- id: satisfaction-support-and-friction
  title: Satisfaction, support, and friction
  body: 'Tide’s satisfaction signal is genuinely mixed rather than uniformly weak. On the positive side, Trustpilot’s aggregate score remains strong at 4.4/5 across 35,681 reviews, and its AI summary says recent reviewers often praise helpful staff, clear explanations, easy setup, and a smooth user experience. App-store ratings are also high enough to suggest that many members do receive day-to-day value. But the adverse evidence is too persistent to ignore. Resolver’s complaints page identifies customer-service issues, account suspensions, and delayed or absent responses as common case types. Trustpilot’s recent review pages include complaints about account shutdowns, payment holds, slow responses, and unclear communication, while Tide’s own replies repeatedly invoke routine account checks. Capterra’s mixed reviews are directionally similar: users praise setup speed, staff cards, and integrations, but also complain about outages, 20p incoming-transfer fees, and a business account being
    held at a critical payroll moment with no response for several days. The pattern does not prove systemic failure, but it does show a real support-risk tax around compliance reviews, communication speed, and fee perception.'
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU033
  - CU041
  tableRefs:
  - TU004
- id: retention-expansion-and-economics
  title: Retention, expansion, and customer-economics visibility
  body: 'Public evidence supports a credible land-and-expand logic, but not underwriteable retention metrics. In the UK, Tide’s switching pages and plan ladder explicitly try to convert a member from a free or first-use account into a fuller primary relationship with savings, card, accounting, support, and team-access upgrades. In India, the invoice assistant, expense-card workflows, partner lending, bill-pay support, and GST tooling show a similar pattern: Tide is trying to own more of the operating stack after the initial signup. That is strategically useful because the more workflows a member runs through Tide, the harder it should be to demote Tide into a secondary tool. However, the public record still leaves the key durability questions open. Tide does not disclose NRR, GRR, churn, contract lengths, active-primary-account share, or top-customer concentration; named customer stories prove use but not cohort health; and even the review platforms leave unclear what proportion of the base
    experiences serious operational friction. Public economics signals are therefore limited to pricing surfaces: pay-as-you-go transfer fees, paid UK tiers with richer support and yield, and India’s ₹49 invoice-assistant premium option. Those pricing clues show monetisation intent, but not CAC, payback, ARPU, or support cost-to-serve.'
