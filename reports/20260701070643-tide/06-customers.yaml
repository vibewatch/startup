company:
  name: Tide
chapter:
  number: 6
  title: Customers
  summary: 'Tide’s customer story is strongest on breadth and top-of-funnel adoption: the company and independent coverage consistently point to 2 million global members by May 2026, roughly 900,000 UK SMEs, and more than 1.1 million India members, while app-store footprints and review volume imply a large self-serve base. The quality of proof is mixed beneath that headline scale: named customer stories show real workflow usage and some expansion, but Tide does not publicly disclose NRR, churn, primary-account share, or customer concentration, and review platforms repeatedly surface support delays, account holds, and fee friction.'
sections:
- id: segments-and-footprint
  title: Segments and geographic footprint
  body: 'Tide’s public customer segmentation is materially clearer than many private fintech peers, but it differs sharply by geography. In the UK, Tide consistently markets toward sole traders, freelancers, contractors, limited companies, and scaling small businesses that want a low-friction business account plus accounting, invoicing, team-spend, and credit-adjacent tools. The sole-trader and limited-company pages both frame Tide as an all-in-one admin surface rather than a narrow current-account wrapper, and the mobile-store listings repeat the same target audience. India is a different wedge: Tide’s homepage and India-focused coverage emphasize shopkeepers, artisans, freelancers, women entrepreneurs, and owner-operators in smaller towns who need GST-compliant invoicing, QR and bill payments, expense management, and lender access more than a like-for-like replacement of a traditional SME current account. That difference matters. UK segmentation looks like a business-account-led acquisition
    funnel that can widen into admin and treasury features, while India’s offer is closer to a business-finance operating layer for underserved microbusinesses entering formal digital workflows.'
  claimRefs:
  - CU005
  - CU007
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU032
  - CU038
