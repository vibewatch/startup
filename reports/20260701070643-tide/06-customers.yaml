- id: adoption-proof-and-named-customer-evidence
  title: Adoption proof and named customer evidence
  body: 'The strongest adoption proof is the member-count trajectory. Tide’s own 2024 milestone page said it had reached one million members worldwide, and the May 2026 milestone release plus independent pickup said the platform had doubled that to 2 million members globally, including about 900,000 UK SMEs and more than 1.1 million India members since the December 2022 launch. Those counts are still company-originated and should not be mistaken for revenue-active cohorts, but they are corroborated across multiple retained sources and remain consistent with earlier chapters. Public usage proxies add weight. Trustpilot hosts tens of thousands of reviews, the Tide iOS app shows 82k ratings at 4.8/5, and the app-store descriptions still lead with self-serve setup and broad SMB targeting. Named customer proof is more selective but real: HJL Accountancy describes using Tide Plus cash-flow and Xero-linked workflows in a live accounting practice; Real Eating Company describes using Funding Options
    by Tide to help open another shop inside a ten-site café chain; and Albert & Maurice appears as a live member story for an owner-led apparel brand. This is enough to prove adoption across multiple SMB archetypes, but not enough to prove enterprise-scale durability or broad expansion economics.'
  claimRefs:
