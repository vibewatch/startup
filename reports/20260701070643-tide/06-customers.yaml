figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: 'Tide’s customer journey differs by geography: the UK starts with a business account and switching pitch, while India starts with formalisation and admin workflows for microbusinesses.'
  data:
    items:
    - id: discover-uk
      label: Discover (UK)
      actor: Sole trader, freelancer, or director
      description: Find Tide through the business-account, limited-company, or app-store surfaces promising fast setup and low-friction banking admin.
      channels:
      - UK product pages
      - App stores
    - id: open-uk
      label: Open and verify
      actor: Founder / finance lead
      description: Open a UK account in minutes, upload ID, and receive a card quickly if eligibility checks pass.
      channels:
      - App onboarding
      - Self-serve signup
    - id: expand-uk
      label: Expand workflow
      actor: Founder and staff
      description: Add invoicing, accounting, team cards, savings, and plan upgrades as the relationship deepens.
      channels:
      - Invoicing
      - Accounting
      - Team access
      - Savings
    - id: discover-in
      label: Discover (India)
      actor: Shopkeeper, artisan, freelancer, or women entrepreneur
      description: Encounter Tide through India messaging focused on GST, invoicing, bill payments, QR, and expense management for underserved MSMEs.
      channels:
      - India homepage
      - India news coverage
    - id: operate-in
      label: Operate and formalise
      actor: Owner-operator
      description: Use invoicing, bill pay, expense cards, and lender access to create a more digital operating record.
      channels:
      - Invoice Assistant
      - Expense cards via partners
      - Partner lending
    - id: retain-or-frict
      label: Retain or escalate
      actor: Member needing support
      description: Members either deepen usage through more workflows or hit friction around support, communication, reviews, or account checks.
      channels:
      - Plan upgrades
      - In-app support
      - Complaints / review platforms
  approximationNotes: The journey map synthesizes public product messaging, named customer stories, and review evidence rather than a disclosed internal funnel.
