  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Segmented NRR, GRR, churn, and account-tenure cohorts for UK and India members.
    whyItMatters: Without cohort retention data, headline member counts cannot be converted into durable revenue or primary-account confidence.
    diligencePath: Request cohort retention tables by geography, segment, and paid-plan tier from management or data room exports.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: Customer-acquisition cost, payback period, ARPU, support cost-to-serve, and gross-margin by cohort or plan.
    whyItMatters: Pricing pages show monetisation intent, but they do not show whether Tide earns attractive economics on acquired members.
    diligencePath: Request board or finance-pack cohort economics by plan, geography, and primary-account status.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer or top-cohort concentration, active-primary-account share, and multi-product attach by segment.
    whyItMatters: Public evidence proves breadth, but concentration and primary-account intensity determine durability and downside risk.
    diligencePath: Request member segmentation tables showing active funded accounts, primary-account share, and revenue concentration buckets.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-sample
    missingEvidence: A larger named customer roster with deployment status, tenure, and product mix beyond three case studies.
    whyItMatters: Three customer stories prove reality, but they are too few to stand in for the whole customer base.
    diligencePath: Request a reference-customer list or anonymized top-cohort proof pack covering at least 10 to 20 accounts across UK and India.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: support-ops-gap
    missingEvidence: Complaint-resolution SLAs, account-freeze incidence, ombudsman escalation rates, and support staffing / response-time metrics.
    whyItMatters: Review evidence shows support friction is a real risk, but severity cannot be judged without operational support metrics.
    diligencePath: Request monthly complaint volumes, response-time distribution, and compliance-review hold rates with root-cause breakdown.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
