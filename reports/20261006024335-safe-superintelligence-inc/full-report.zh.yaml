chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与运营阶段
        blocks:
          - type: paragraph
            body: >
              Safe Superintelligence Inc. 于 2024 年 6 月由 Ilya Sutskever、Daniel Gross 和 Daniel Levy 创立
              [CO001]。公司自称是一家美国公司，并确认在 Palo Alto 和 Tel Aviv 设有办公室；第三方资料则将 Palo Alto 列为总部
              [CO002]。其战略范围异常狭窄：只有一个目标和一个规划中的产品——安全的超级智能；安全与能力同步推进，而不是先做一系列过渡性的商业产品 [CO003]。


              公开证据仍将 SSI 定位在纯研究、尚未推出产品的阶段。截至 2026 年 8 月和 9 月，独立评审未找到公开模型、API、产品界面、论文或技术博客文章
              [CO004]。这并不证明内部没有研究，只说明外部无法评估产品、基准测试或已发布的方法。现有证据也没有公司发布的收入或客户数指标，因此二者都是尽调缺口，而不是零值 [CO012]。因此，SSI
              更像一个由资本支持的研究项目，而不是已经拥有可观察商业牵引力的软件运营商。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO012
