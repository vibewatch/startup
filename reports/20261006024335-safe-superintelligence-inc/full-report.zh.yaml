        title: 展示项
        blocks:
          - type: callout
            title: 近期瓶颈是证据质量，而不是资本获取
            body: SSI 已证明能够获得知名投资人和不断扩大的算力，但现有证据没有展示运营指标、技术结果、治理权利或公开安全框架。下一步尽调应是文件验证，而不是根据报道中的融资额外推精确数值。
