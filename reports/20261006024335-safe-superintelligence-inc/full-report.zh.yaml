      - number: '2.3'
        title: 买方类型、战略支持与采购路径
        blocks:
          - type: paragraph
            body: >-
              Safe Superintelligence Inc. 没有销售商业产品，因此当前资本化主要由战略企业支持者和风险投资人推动，而非传统软件采购部门。迄今主要提供资本和资源的是超大规模硬件及基础设施巨头，尤其是
              Nvidia：据报道，Nvidia 于 2026 年 7 月在提供 Vera Rubin 算力的同时承诺了一笔未披露的数十亿美元投资，金额为 $5 billion；Alphabet 则在参与风险投资的同时提供了
              Google Cloud TPU 算力。这些战略伙伴将 SSI 视为高确信度对冲工具和专业研究载体，可用于压力测试下一代硬件架构。若未来实现安全超级智能，买方群体将与标准 SaaS
              买方明显不同：目标买家会包括寻求地缘政治技术对等的主权防务机构、统筹全自主运营单元的跨国公司，以及系统性研究联盟。年度 SaaS 许可或按 token
              消费计价等标准企业软件采购路径不会主导采用；采购更可能接近战略合资、主权防务收购或高度监管的关键任务基础设施特许经营。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM013
      - number: '2.4'
        title: 结构性驱动、安全验证与商业化瓶颈
        blocks:
          - type: paragraph
            body: >-
              支撑 Safe Superintelligence Inc. 的投资逻辑来自强劲的结构性驱动因素：预训练 Transformer
              的传统扩展规律快速耗尽，行业对真正推理突破的需求上升，以及机构逐渐认识到必须同步解决对齐与能力问题。然而，公司面临严重的采用瓶颈和执行约束。其中首要问题是完全缺乏外部验证：一则暗示 2026 年 8
              月首次发布模型的投资人传闻最终没有公开产物，市场观察者仍看不到公开权重、演示或模型卡。此外，联合创始人兼首任 CEO Daniel Gross 于 2025 年中离开并负责 Meta
              Superintelligence Labs，此前 Mark Zuckerberg 的数十亿美元收购尝试遭到拒绝，凸显资金充足的商业集团带来的激烈人才竞争。实验室在 Palo Alto 和 Tel Aviv 仅有
              13 至 50 名员工，能隔离运营官僚主义，却也让它暴露于关键人物依赖和算力谈判风险。在没有可验证里程碑的情况下，实验室的市场信誉完全依赖 Ilya Sutskever 的个人技术声誉。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商业收入前的资本化与企业软件 TAM 脱钩
            body: >-
              Safe Superintelligence Inc. 的 $32 billion 估值完全建立在创始人期权价值和技术稀缺性上，而非可服务的软件支出。实验室将研究与近期 API
              商业化隔离，以当前现金流换取不受束缚地追求超级智能。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: callout
            title: 没有交付产物时的商业投资判断风险
            body: 传闻中的 2026 年模型里程碑未能落地，加上完全没有已发布论文或公开安全框架，使 SSI 的市场规模测算根本未经验证。如果竞争实验室持续快速部署能力，长期沉默将带来市场怀疑。
            calloutType: risk
            claimRefs:
              - CM005
