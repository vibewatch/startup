    rows:
      - - 乐观情景（超级智能突破）
        - SSI 在样本效率与对齐上取得突破；以 $80B-$200B 估值完成 $10B+ 超大轮融资。
        - 按当前估值标记回报 2.5x - 6.0x；主权资本与超大规模云厂商资本入场。
        - 全球监管介入，或出于国家安全而将算力国有化。
        - 15% - 低
      - - 基准情景（隐身研发延续）
        - SSI 维持 $32B 估值底线，消耗 Nvidia 算力，并在 2027 年前私下扩展。
        - 回报 1.0x；在未定价的战略追加融资中，估值标记维持 $32B 不变。
        - 追加数十亿美元算力融资造成过度稀释。
        - 55% - 高
      - - 悲观情景（执行失败 / 下轮融资）
        - 传闻中的模型未展现能力跃升；核心研究人员离职；算力成本耗尽可用现金。
        - 估值减记 50% - 80%；高级清算优先权抹去普通股权益。
        - 下轮融资重组，或被战略合作伙伴强制收购。
        - 25% - 中
      - - 极端悲观情景（过时 / 解散）
        - 前沿竞争者解决推理对齐问题；SSI 的架构假设被证明不可行。
        - 资本全部损失，或折价出售算力配额等资产。
        - 完全清算，剩余资本仅返还给高级优先股持有人。
        - 5% - 低
    notes: 概率分布与估值倍数反映二元化的研究结果，以及中途缺乏现金流。
