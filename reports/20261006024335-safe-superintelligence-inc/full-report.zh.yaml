        blocks:
          - type: paragraph
            body: >-
              SSI 表示只有一个目标和一个规划产品：安全的超级智能。这是研究目标，而不是今天可用的 SKU。截至 2026 年 9
              月下旬，现有证据没有发现公开模型、API、聊天机器人、定价页面、模型卡或开发者文档。因此，没有可支持的买家、用户工作流、部署模式、服务水平记录或可量化客户收益可供评估。直线式结构可能减少中间商业化带来的干扰，但也消除了暴露可靠性、集成和支持问题的常规产品反馈闭环。因此，产品成熟度应归类为尚未发布的研究，而不是
              alpha 软件或可部署平台。
