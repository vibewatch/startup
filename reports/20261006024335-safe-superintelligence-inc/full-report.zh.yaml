      - number: '4.2'
        title: GTM 证据与单位经济学缺口
        blocks:
          - type: paragraph
            body: >
              SSI 的公开财务信息不足以支持销售效率分析。现有来源没有披露获客成本、销售周期、回本周期、渠道经济性、留存、利用率，或可用于计算这些指标的任何分母
              [CI006]。没有公开定价页面或客户合同，也无法检验标价到实际价格的差异、折扣、最低承诺或收入集中度 [CI002, CI005]。这些是不可用的输入，而不是零值；不应拿假定已经商业化的同行基准替代它们。


              毛利率和交付经济性同样无法分析。据报道，NVIDIA 关系增加了 Vera Rubin 访问权，计划将 SSI 算力扩大一个数量级，使算力成为最清晰的可观察成本驱动因素 [CI007,
              CI013]。但公开证据没有披露算力究竟是购买、抵扣、融资、预留还是实物出资，也没有毛利率、营运资本、资本开支或服务交付成本数据 [CI008, CI014]。在产品和计费单位形成之前，传统 SaaS
              单位经济学不是表现较弱，而是在结构上尚未成熟。
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI014
