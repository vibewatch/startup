  - id: FU001
    title: 客户证据旅程
    type: journey-map
    summary: SSI 已进入研究与算力扩展阶段，但每个客户验证和扩张阶段仍缺乏公开证据。
    data:
      items:
        - label: 1. 封闭式研究
          detail: 已观察到：SSI 推进直线式研究计划，没有中间商业产品。
          touchpoints:
            - 未找到模型、API、定价页面或开发者文档
        - label: 2. 算力扩展
          detail: 已观察到：NVIDIA 投资、Vera Rubin 访问权限与技术合作。
          touchpoints:
            - 已宣布算力增加一个数量级
        - label: 3. 可审阅发布
          detail: 尚未解决：发布外部评估者可以审阅的模型、论文、基准或安全方法。
          touchpoints:
            - 传闻中的 2026 年 8 月模型并非 SSI 的承诺，截至 9 月 25 日仍未出现
        - label: 4. 指定评估或试点
          detail: 尚未解决：明确评估者、用户、付款方、范围和成功标准。
          touchpoints:
            - 指定来源池中没有明确的试点或设计合作伙伴
        - label: 5. 生产环境部署
          detail: 尚未解决：提供带日期的活跃使用与结果证据。
          touchpoints:
            - 没有账户、用户、地点或使用率分母
        - label: 6. 续约与扩张
          detail: 尚未解决：证明合同续约、队列留存与扩张。
          touchpoints:
            - 没有 NRR、GRR、流失、续约或合同期限指标
    approximationNotes: 这是证据成熟度序列，并非预测，也不是声称 SSI 将完成每个阶段；尚未解决的阶段属于尽调要求。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 对最重大的公开证据风险进行序数综合，将未知状态与已观察事件分开。
    data:
      columns:
        - label: 可能性 / 证据状态
          detail: 定性评估风险暴露或披露缺口是否存在；不是统计概率。
        - label: 影响
          detail: 风险兑现时可能产生的投资影响。
        - label: 缓释成熟度
          detail: 仅认可有外部证据支持的控制措施。
        - label: 正向逻辑破坏触发条件
          detail: 应停止增加暴露或重新定价的可监测事件。
      rows:
        - label: 外部安全保障
          values:
            - label: 高披露缺口
              detail: 引用的评审中没有公开 SSI 论文、基准声明或可比的前沿安全框架。
            - label: 严重
            - label: 没有公开证据
            - label: 在没有独立安全审查和发布授权的情况下继续增加算力
        - label: 技术里程碑执行
          values:
            - label: 高可观测性风险
              detail: 外部投资者报道的 8 月窗口并非 SSI 的承诺。
            - label: 高
            - label: 没有公开的里程碑节奏
            - label: 内部承诺的里程碑反复错过，且没有证据包
        - label: 领导层连续性
          values:
            - label: 中
            - label: 高
            - label: 没有公开的继任证据
            - label: 剩余核心领导者离开，且没有书面继任安排
        - label: 算力合作伙伴依赖
          values:
            - label: 中
            - label: 高
            - label: 既有 TPU 关系提供了可能的替代方案，但可移植性尚未核实
            - label: 容量或可移植性失败，阻碍计划中的实验
        - label: 融资与估值模型
          values:
            - label: 高信息缺口
            - label: 高
            - label: 现金、烧钱速度、现金跑道与条款未公开
            - label: 下轮融资、限制性条款，或无法为已批准的安全里程碑提供资金
        - label: 法律与监管状态
          values:
            - label: Unknown
              detail: 指定证据无法证明事件、争议或两者均不存在。
            - label: 若出现不利情况则为高
            - label: 无法公开评估
            - label: 重大执法行动、知识产权缺陷或部署审批障碍
    approximationNotes: 序数标签综合指定来源与明确缺口；它们不是概率、事件数量或预测，也不证明未记录事件曾经或未曾发生。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR007
      - CR008
      - CR010
      - CR013
      - CR015
