              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              两个独立目录将 OpenAI、Anthropic、Google DeepMind、xAI 和 Mistral AI 列入 SSI 的直接前沿实验室对比集合，另一个目录还识别出更长的新实验室尾部
              [CP001]。这一集合在战略上并不均衡：SSI 被描述为专注安全的自研实验室，OpenAI 被描述为覆盖更广泛的对齐、红队测试、评估和内容安全活动，而 Thinking Machines 和 World
              Labs 等较新的研究实验室在现有证据中已经公开命名交付产物 [CP002, CP003,
              CP012]。内部自建和等待更成熟供应商都是有效的买方替代方案，但现有资料没有量化任一路径，因此将其列为明确未知项，而不是虚构的竞争者 [CP015]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
