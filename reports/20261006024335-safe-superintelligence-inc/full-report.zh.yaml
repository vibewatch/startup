      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              历史融资时间线属于公司概况；从财务投资判断角度，关键是这些融资对当前资源意味着什么。公开来源对此并不一致。Vorp Labs 将官方确认的 2024 年 $1 billion 融资与多家媒体报道的约 $2
              billion 2025 年融资分开，并将 2026 年 NVIDIA 金额视为两家公司未披露 [CI009]。其他数据库和分析称三轮融资合计约 $8 billion，而 GetLatka 仍称一轮融资为 $2
              billion [CI010, CI011]。差异反映了来源处理方式和数据陈旧程度，因此不能把单一累计总额当作经审计现金。


              即使融资额正确，也不能证明可用现金，因为保留的来源没有披露当前现金、烧钱速度、受限资金、债务、项目融资、已承诺算力支出，或现金与实物对价的构成 [CI012,
              CI014]。据报算力扩大十倍可能提升研究能力，但也让基础设施义务成为现金跑道问题的核心 [CI007, CI013]。因此，公开证据无法计算现金跑道、确定下一轮融资触发点，或检验融资依赖是否下降
              [CI015]。
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
