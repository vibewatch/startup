  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险态势：证据不透明是核心暴露点
        blocks:
          - type: paragraph
            body: >-
              SSI 表示其唯一产品是安全的超级智能，安全应与能力同步推进，但这项使命声明不能证明任一结果已经实现。最强的公开风险信号是缺少分阶段技术证明：截至来源注明的 2026 年评审日期，现有来源没有 SSI
              归属的论文、基准主张、公开模型、API
              或前沿安全框架。一份技术综述还提醒，当前对齐方法只覆盖问题的一部分，不能构成端到端保证。因此结果是较高的剩余投资判断不确定性，而不是技术失败的证明。适当的缓释措施是将资本和算力获取与可独立复核的评估、治理阈值和回滚标准绑定；这些产物持续缺失就是投资逻辑破坏信号。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
