          description: $8B 累计融资，以及与 Nvidia 达成的 10x 算力交易
        - id: N2
          label: 商业证明
          description: 商业收入为零、公开模型为零、已发表论文为零
        - id: N3
          label: 估值基准
          description: $32B 静态估值在尚无收入的情况下意味着人均 $640M
        - id: N4
          label: 执行风险
          description: 未定价的融资保密、缺乏安全框架，以及关键创始人离任
        - id: N5
          label: 尽调触发条件
          description: 接近 $93.64/股的二级市场指示价，以及即将到来的算力交付里程碑
        - id: N6
          label: 投资结论
          description: 继续研究建议：跟踪二级市场估值标记，等待经过核实的技术里程碑
