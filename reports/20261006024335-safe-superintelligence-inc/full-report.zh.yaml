      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              目前无法根据公开证据对 SSI 的收入质量、毛利路径和资本充足性评级。证据支持其商业化前、研究优先的定位，以及明显扩大的规划算力规模，但不支持收入、ARR、毛利率、烧钱速度、现金跑道或销售效率估计 [CI001,
              CI006, CI013, CI016]。NVIDIA 合作可能降低前沿算力获取风险，但投资金额和合同经济性未披露，无法判断它提供的是现金、容量、采购义务、战略依赖，还是几者组合 [CI007, CI008,
              CI012]。


              核心尽调障碍不只是缺少传统 SaaS
              指标，而是缺少一座连接已报道融资与研究产出的会计及合同桥梁。投资判断需要当前现金和月度烧钱速度、算力承诺和单位成本、债务或担保权益、员工成本、资金计划用途、产品里程碑，以及明确的商业化政策 [CI012,
              CI014, CI015]。在这些记录可获得前，财务逻辑只是押注技术成功的期权，而不是可预测的运营业务 [CI016]。
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI008
              - CI012
              - CI013
