  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与资本历史
        blocks:
          - type: paragraph
            body: >-
              Safe Superintelligence Inc. 在前沿人工智能研究中处于前所未有的估值位置。公司在 Greenoaks Capital 领投的 2025 年 4 月融资中估值 $32
              billion，并将这一基准维持到 2026 年末。据报 2026 年 7 月宣布与 Nvidia 的无定价战略合作后，累计融资约达 $8 billion，Bloomberg 报道该合作金额为 $5
              billion。尽管资本积累巨大，SSI 仍没有商业收入、企业 API，且尚未见公开模型部署；按估计的 50 人团队计算，隐含纸面估值约为每名员工 $640 million。Hiive
              等平台的二级市场报价曾显示股价约 $93.64，但实际交易流动性仍严重受限。在没有商业现金流或经审计财务报表的情况下，$32 billion 估值体现的是对创始人技术能力的纯看涨期权，而不是传统运营倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV013
      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              SSI 的核心投资逻辑建立在创始人稀缺性和研究纯粹性上。实验室坚持只专注于安全超级智能的直线式使命，消除了 OpenAI 和 Anthropic
              等竞争者常见的组织管理成本、产品管理摩擦和商业妥协。这一聚焦使命吸引顶尖研究人员来到 Palo Alto 和 Tel Aviv，也获得 Sequoia Capital、Andreessen Horowitz 和
              Greenoaks Capital 的支持。此外，2026 年 7 月的 Nvidia 合作让 SSI 能专门获取下一代 Vera Rubin 基础设施，预计算力扩大十倍。反向逻辑则强调严重的运营脆弱性：SSI
              没有发布技术论文或模型卡，也错过了市场投资人所引用的 2026 年 8 月等传闻外部交付窗口。此外，联合创始人 Daniel Gross 于 2025 年中离开并加入
              Meta，此前收购要约遭拒，凸显高管更替风险，也使技术执行高度集中于 Ilya Sutskever 和 Daniel Levy。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV009
      - number: '8.3'
        title: 情景建模与下行保护
        blocks:
          - type: paragraph
            body: >-
              评估潜在投资回报，需要对 2027 年和 2028 年之前分化的开发路径进行明确的概率加权。乐观情景是：SSI 在样本效率或可扩展对齐上实现根本性算法突破，累计资本需求接近 $22 billion，估值跃升至
              $60 billion–$200 billion。基准情景是：SSI 继续进行深度隐身研究，吸收 Nvidia 的算力承诺，并通过无定价的战略企业扩展维持 $32 billion
              的估值底线。然而在悲观和困境情景下，技术里程碑停滞，大量算力消耗耗尽流动性。由于数十亿美元融资批次经常附带高级清算优先权和棘轮条款，一旦技术停滞迫使公司进行下轮融资或困境资产整合，普通股股东将面临严重稀释和减记风险。
            claimRefs:
              - CV002
              - CV003
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
      - number: '8.4'
        title: 建议逻辑与尽调触发点
        blocks:
          - type: paragraph
            body: >-
              综合非凡创始人才华与严重估值不透明，结论是明确的继续研究建议，并配以昂贵的估值立场。投资人看不清清算优先权级别和股权结构表的治理安排前，应避免追逐接近每股 $93.64
              的二级市场报价。持续监测必须聚焦明确的投资逻辑破坏触发点，包括算力交付长期延迟、Palo Alto 或 Tel Aviv 研究群体的关键人员离职，或竞争对手在可证明安全架构上取得突破、使 SSI
              的专有直线式方法变得多余。新增本金投入应继续以经审计的里程碑验证、外部安全治理披露，或反映更广泛市场发现的定价轮为前提。
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 估值立场与尽调姿态
            body: SSI 将创始人期权价值和算力集中在极高水平，但在没有收入或可验证研究进展的情况下以 $32 billion 估值进入，风险严重。在可验证的技术里程碑或有定价的市场轮次出现前，投资人应保持继续研究的姿态。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV013
