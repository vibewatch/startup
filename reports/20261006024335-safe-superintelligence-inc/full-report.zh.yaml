      - number: '3.2'
        title: 能力证据与信任立场
        blocks:
          - type: paragraph
            body: >-
              最影响决策的对比不是基准排名，而是外部可检查证据的数量。一份检查 SSI 官方渠道和公开模型目录的资料截至 2026 年 8 月 15 日未发现已发布模型、API、产品、开发者文档或定价页面
              [CP004]。同一评审没有发现 SSI 发布的前沿安全框架，却找到了 Anthropic、OpenAI、Google DeepMind、Meta 和 xAI 的已发布框架 [CP005]。SSI
              对广义对齐的关注是可见的，但落实情况不可见：MindStudio 认为，基于有限公开表述的详细架构说法仍属推测 [CP006]。因此，矩阵和图表衡量的是现有证据中的披露情况，而不是底层模型质量或安全性。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
