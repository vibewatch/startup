              - CO012
      - number: '1.2'
        title: 领导层集中与治理可见度
        blocks:
          - type: paragraph
            body: >
              SSI 的创始团队结合了 Sutskever 的前沿模型研究背景、Gross 的运营和投资经验，以及 Levy 的大规模优化经验 [CO001]。领导结构在 2025 年发生变化：SSI 表示 Gross 在 6
              月 29 日之后已不再任职，Sutskever 出任 CEO，Levy 出任总裁，技术团队继续向 Sutskever 汇报 [CO009,
              CO010]。如今两位留下的创始人构成可见的领导核心，科学和高管责任也集中在 Sutskever 身上。


              现有公开资料没有披露董事会构成、投资人保护权利、独立安全委员会或使命锁定机制 [CO013]。资料也没有发现可供外部评审对照阈值、升级规则或监督机制的公开前沿安全框架
              [CO014]。这些缺失不应被解读为内部不存在控制措施，而是形成了验证问题：投资人需要在得出 SSI 的使命得到制度性保护之前，取得保密治理文件、董事会会议记录和安全评审流程。Gross
              离任后，这一要求更重要，因为最初担任 CEO 的创始人已经离开。
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO013
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO013
              - CO014
      - number: '1.3'
        title: 没有公开运营基线的资本形成
        blocks:
          - type: paragraph
            body: >
              最清晰的融资锚点是 SSI 自己在 2024 年 9 月发布的更新：公司从 NFDG、Andreessen Horowitz、Sequoia、DST Global 和 SV Angel 募集了 $1
              billion [CO005]。独立来源随后报道，2025 年 Greenoaks 领投了一轮约 $2 billion 的融资，估值为 $32 billion，但 SSI 没有在现有官方证据中确认该轮融资或估值
              [CO006]。2026 年 7 月，SSI 确认与 NVIDIA 建立战略合作，目标是将算力提高十倍；现有证据没有披露两家公司的投资金额 [CO007]。


              二手来源将约 $5 billion 的投资归因于 NVIDIA，但保留的最强综合结论明确将该金额标为未经确认 [CO008]。因此，本章不把报道中的融资换算成已确认的可用现金，也不把 $8 billion
              总额当作既定事实。规模同样不确定：现有估计从 13 名员工、约 20–30 名到约 50 名不等，没有官方当前人数
              [CO011]。收入、客户、烧钱速度、剩余现金和现金跑道均无证据支持。因此，资本化情况主要通过融资公告和供应商承诺体现，而不是财务报表或运营 KPI。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
