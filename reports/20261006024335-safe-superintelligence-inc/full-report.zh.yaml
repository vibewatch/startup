      - number: '1.4'
        title: 里程碑与尽调含义
        blocks:
          - type: paragraph
            body: >
              SSI 的公开里程碑显示其迅速获得资本和算力，但可供外部检验的产出有限。时间线从 2024 年 6 月成立、2024 年 9 月融资开始，随后是据报于 2025 年 4 月建立的 Google Cloud TPU
              关系、2025 年 6–7 月的创始人交接，以及 2026 年 7 月与 NVIDIA 的合作 [CO001, CO005, CO009, CO010, CO015]。这些事件证明了融资能力、供应商获取能力以及
              Gross 离任后的连续性，但不能独立证明技术表现或商业化。


              最明确的反向信号不是公司错过了自己的承诺。一篇归因于投资人的报道指向 2026 年 8 月发布模型，但 SSI 从未确认该日期，评审截至 9 月也未发现发布
              [CO016]。这应被视为未兑现的外部预期，而非企业承诺被打破。因此，下一步关键里程碑应是证据事件：模型或研究论文、可审计的安全方法、经核实的当前团队和治理图谱，以及将已募集资金与剩余现金分开的财务披露。在这些证据出现前，关键人物集中和信息不对称将主导公司概况。
            claimRefs:
              - CO001
