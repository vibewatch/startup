      - number: '7.4'
        title: 伙伴、财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              算力获取和融资既是优势，也是集中风险。来源描述 SSI 先使用 Google Cloud TPU，随后于 2026 年与 Nvidia
              合作，预计将算力扩大一个数量级；但在所评审记录中，两家公司没有披露投资金额。因此，融资总额不能互换：GetLatka 在一页最后更新于 2025 年的资料上记录一轮 $2 billion；Vorp Labs 将约
              $3 billion 的已确认及已报道股权与未披露的 Nvidia 投资分开；Value Add VC 则将报道中的 Nvidia $5 billion 金额计入后估计约 $8
              billion。没有任何来源证明可用现金、烧钱速度、现金跑道或融资条款。缓释措施应是核实股权结构表、现金、合同和供应商退出安排，而不是从估值或融资新闻外推。
