  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围内能力与规模测算排除项
        blocks:
          - type: paragraph
            body: >-
              Safe Superintelligence Inc.（SSI）通过严格的结构性排除界定市场范围：公司只追求一个目标——构建安全的超级智能，并明确拒绝参与近期商业软件市场。与依靠消费者聊天机器人、开发者 API
              和企业智能副驾交叉补贴研究的传统基础模型公司不同，SSI
              将中间产品周期视为运营干扰。因此，客户支持自动化、企业搜索和编程助手等传统企业软件类别都完全不在公司的可服务范围内。其范围内领域仅限于基础通用人工智能和自主对齐架构。实验室已从 Google Cloud TPU
              和下一代 Nvidia Vera Rubin 系统获得算力，但没有向第三方提供商业算力或托管服务。此外，SSI 在 arXiv 上没有公开研究论文，没有模型卡，也没有 Anthropic 或 OpenAI
              那样的版本化前沿安全框架，形成了一条封闭的运营边界：研究进展完全在内部评估，而不是通过公开商业或学术基准衡量。
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM011
      - number: '2.2'
        title: 规模测算视角、算力支出基准与 TAM 约束
        blocks:
          - type: paragraph
            body: >-
              用标准可服务市场框架分析 Safe Superintelligence
              Inc.，需要把理论经济潜力与已经实现的市场需求分开。在理论上限情景下，全面自动化认知劳动代表着数十万亿美元的可寻址宏观经济影响，覆盖全球知识工作。但按当前商业现实衡量，SSI
              的可服务、可获取市场支出目前为零，因为实验室没有商业合同、API 或计费基础设施。相比之下，商业前沿同行迅速扩大企业软件渗透：截至 2026 年末，Anthropic 的年化收入运行率超过 $65
              billion，OpenAI 约为 $40 billion，说明市场对运营型 AI 工作流的需求极大。同时，私人资本市场给 SSI 的估值为 $32 billion——这一估值最初来自 Greenoaks
              Capital 领投的 2025 年 4 月融资，并得到后续 Nvidia 算力投资的支持——约为 Thinking Machines Lab（$13.5 billion 二级市场标记）的两点四倍、World
              Labs（$5 billion）的六倍。按其约 13 至 50 人的精简团队计算，这一估值相当于每名员工超过 $600 million，说明 SSI 的定价依据是 AGI
              突破的纯看涨期权，而不是贴现现金流或近期企业软件支出。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM015
