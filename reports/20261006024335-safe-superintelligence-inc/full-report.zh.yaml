      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              SSI 当前的护城河更应理解为资本、算力和稀缺研究人才的获取能力，而不是产品锁定效应。即便资本基线也存在争议：Vorp Labs 将约 $3 billion 的已确认及已报道股权融资与未披露的 NVIDIA
              投资分开，而 Value Add VC 则在报道中的 NVIDIA $5 billion 支票基础上给出约 $8 billion 的总额 [CP008, CP009]。后者还报道 Thinking
              Machines 已交付 Tinker、World Labs 已交付 Marble，而 SSI 仍没有公开产物 [CP012]。截至 9 月 25 日，传闻中的 SSI 2026 年 8
              月模型发布仍未出现，但该传闻从未是 SSI 的承诺 [CP013]。没有模型、基准或方法披露，研究优势和切换成本都无法验证，商品化和执行时点因此成为核心竞争风险 [CP014, CP015]。
            claimRefs:
              - CP008
