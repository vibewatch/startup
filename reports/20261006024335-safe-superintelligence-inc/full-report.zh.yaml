companyProfile:
  summary: >-
    Safe Superintelligence Inc. 是一家私营、尚未推出产品的 AI 安全研究实验室，由 Ilya Sutskever、Daniel Gross 和 Daniel Levy 于 2024
    年创立。公司公开表示只专注于构建安全的超级智能，并确认在 Palo Alto 和 Tel Aviv 设有办公室；公开资料尚未显示其产品、收入或客户基础。公开证据还显示，公司确认 2024 年融资 $1 billion，后续据报以
    $32 billion 估值融资，并于 2026 年与 NVIDIA 建立旨在扩大算力获取的合作。
