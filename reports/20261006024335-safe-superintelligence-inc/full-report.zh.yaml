      - number: '3.3'
        title: 定价、分发与供应获取
        blocks:
          - type: paragraph
            body: >-
              SSI 尚无法按已实现价格、合同期限、折扣或客户切换成本进行比较。现有证据未见公开定价界面或商业套餐，竞争对比页面也没有提供可靠的同行价格卡片 [CP011]。算力获取更为可见：资料描述了先使用 Google
              Cloud TPU、后与 NVIDIA 合作获得 Vera Rubin 访问权，但不能据此声称任一供应关系具有排他性，也不能声称由此形成专有分发能力 [CP010]。公开员工数估计同样存在重大差异，从约 13
              人到约 50 人不等，来源时间和方法各异，因此本章不把任何一个数字换算成精确的当前运营规模 [CP007]。
            claimRefs:
