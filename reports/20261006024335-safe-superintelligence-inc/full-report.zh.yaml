              的差异化是组织层面和愿景层面的：一家小而专注的实验室，打算在不维持中间商业产品的情况下同步发展安全与能力。技术差异化证据并未公开。现有来源没有发现论文、基准、模型卡、代码库、前沿安全框架、外部审计或记录在案的发布阈值。这种不透明可能保护研究，但阻止投资人和实践者比较安全控制、衡量进展或测试可复现性。因此核心尽调问题不是使命是否独特，而是私有证据能否在继续扩大规模前证明可重复的技术优势和可执行的安全控制。
