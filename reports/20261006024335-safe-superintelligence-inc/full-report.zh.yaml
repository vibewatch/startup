      - number: '7.3'
        title: 运营、技术与领导层执行
        blocks:
          - type: paragraph
            body: >-
              SSI 的直线式路线限制了外部验证。Vorp Labs 截至 2026 年 8 月 15 日没有找到公开模型或 API；Value Add VC 报道称，投资人曾提出 8 月发布窗口，但截至 9 月 25
              日仍没有模型。该传闻不是 SSI 的承诺，因此证据支持的是里程碑不确定性，而不是公司承诺被打破。第三方分析还认为，避免迭代部署可能限制真实世界压力测试。领导层集中增加了执行敏感性：现有来源报告 Daniel
              Gross 于 2025 年离任，之后 Ilya Sutskever 和 Daniel Levy 分别担任 CEO
              和总裁。缓释措施需要董事会批准的继任安排、记录在案的里程碑评审、独立红队证据，以及在扩展速度超过保证能力时预先约定停止。
            claimRefs:
