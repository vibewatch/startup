      - number: '7.2'
        title: 治理、法律与监管态势
        blocks:
          - type: paragraph
            body: >-
              公开记录支持存在披露风险，但不能据此认定 SSI 违法或遭遇监管事件。Vorp Labs
              报告称没有已发布的前沿安全框架；评审的公司分析也没有展示决策权、独立发布批准、事故报告、隐私控制、知识产权争议或特定司法辖区的部署义务。由于引用记录中的 SSI
              尚未发布公开产品，未来产品界面和适用要求也无法可靠界定。这些都是重大尽调缺口。在投资或追加资本前，法律顾问应梳理美国和以色列实体，检查诉讼和监管往来，审阅 IP 转让，并测试独立机构能否暂停扩展或部署。
            claimRefs:
              - CR003
              - CR004
              - CR015
              - CR016
          - type: table
