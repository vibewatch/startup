  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业证据
        blocks:
          - type: paragraph
            body: >
              现有证据只支持 SSI 处于商业化前的研究阶段，而不是已经运营的收入模式。多个独立来源称 SSI 没有已发布产品，也未披露收入；评审的来源集合没有找到付费客户、客户合同、定价页面或活跃商业渠道 [CI001,
              CI002]。某个市场数据页面将其收入模式标为“订阅”，但同一页面又称 SSI 尚未商业化，并表示公司没有披露收入或财务指标；因此，该分类不能证明实际存在订阅业务 [CI003, CI004]。


              现有证据中没有经验证的公开记录定义收入流、可计费单位、标价或实际价格、折扣政策、合同期限或收入确认方法 [CI005]。融资和算力获取是研究投入，不是收入。更稳妥的结论不是“收入为零”，而是收入未公开披露；截至
              2026 年 9 月，现有证据也没有证明其存在商业产品。管理层尽调必须确定未来变现会采用 API 消费、许可、企业合同或其他机制，不能预设为 SaaS 模式 [CI001, CI002, CI005]。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
