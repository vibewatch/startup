  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Ordinal synthesis of the most material public-evidence risks, separating unknown posture from observed events.
    data:
      columns:
        - label: Likelihood / evidence state
          detail: Qualitative assessment of whether the exposure or disclosure gap is present; not a statistical probability.
        - label: Impact
          detail: Potential investment impact if the risk crystallizes.
        - label: Mitigation maturity
          detail: Only externally evidenced controls are credited.
        - label: Thesis-break trigger
          detail: Monitorable event that should stop or reprice incremental exposure.
      rows:
        - label: External safety assurance
          values:
            - label: High disclosure gap
              detail: No public SSI papers, benchmark claims, or comparable frontier safety framework in cited reviews.
            - label: Critical
            - label: Not publicly evidenced
            - label: More compute without independent safety review and release authority
        - label: Technical milestone execution
          values:
            - label: High observability risk
              detail: An outside investor's reported August window was not an SSI commitment.
            - label: High
            - label: No public milestone cadence
            - label: Repeated internally committed milestones missed without evidence packs
        - label: Leadership continuity
          values:
            - label: Medium
            - label: High
            - label: Succession not publicly evidenced
            - label: Loss of a remaining core leader without documented succession
        - label: Compute partner dependence
          values:
            - label: Medium
            - label: High
            - label: Prior TPU relationship offers a possible alternative, but portability is unverified
            - label: Capacity or portability failure that blocks planned experiments
        - label: Financing and valuation model
          values:
            - label: High information gap
            - label: High
            - label: Cash, burn, runway, and terms not public
            - label: Down-round, restrictive terms, or inability to fund approved safety milestones
        - label: Legal and regulatory posture
          values:
            - label: Unknown
              detail: Assigned evidence does not establish incidents, disputes, or absence of either.
            - label: High if adverse
            - label: Not publicly assessable
            - label: Material enforcement, IP defect, or deployment approval blocker
    approximationNotes: >-
      Ordinal labels synthesize the assigned sources and explicit gaps; they are not probabilities, incident counts,
      forecasts, or evidence that an unrecorded event did or did not occur.
