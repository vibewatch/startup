              - CP012
              - CP015
      - number: '3.2'
        title: Capability evidence and trust posture
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant contrast is not a benchmark ranking but the amount of externally inspectable
              evidence. A source that checked official SSI channels and a public model catalog through August 15, 2026
              found no released model, API, product, developer documentation, or pricing page [CP004]. The same review
              found no published SSI frontier safety framework, while identifying published frameworks for Anthropic,
              OpenAI, Google DeepMind, Meta, and xAI [CP005]. SSI's broad alignment focus is visible, but its
              implementation is not: MindStudio characterizes detailed architecture claims as speculation based on
              limited public statements [CP006]. The matrix and figure therefore measure disclosure in the assigned
              evidence, not underlying model quality or safety.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
