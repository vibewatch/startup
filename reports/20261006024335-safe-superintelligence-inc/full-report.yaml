      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case (Superintelligence Breakthrough)
        - SSI achieves breakthrough in sample efficiency and alignment; raises $10B+ mega-round at $80B-$200B valuation.
        - 2.5x - 6.0x return on current mark; sovereign and hyper-scaler capital enters.
        - Global regulatory intervention or national security compute nationalization.
        - 15% - Low
      - - Base Case (Stealth R&D Continuation)
        - SSI maintains $32B valuation floor, consumes Nvidia compute, and conducts private scaling through 2027.
        - 1.0x return; valuation marks stay flat at $32B in unpriced strategic extensions.
        - Excessive dilution from additional multi-billion compute financings.
        - 55% - High
      - - Bear Case (Execution Failure / Down-Round)
        - Rumored models fail to show capability leap; key researchers leave; compute costs drain available cash.
        - 50% - 80% valuation write-down; senior liquidation preferences wipe out common equity.
        - Down-round restructuring or forced acquisition by strategic partner.
        - 25% - Moderate
      - - Severe Bear (Obsolescence / Dissolution)
        - Frontier competitors solve reasoning alignment; SSI's architectural hypothesis proves non-viable.
        - Total capital loss or distressed asset sale of compute allocations.
        - Complete liquidation with residual capital returning solely to senior preferred holders.
        - 5% - Low
    notes: Probability distribution and valuation multiples reflect binary research outcomes and lack of interim cash flow.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
