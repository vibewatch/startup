      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert absent disclosure into a zero-customer metric
            body: >-
              The evidence supports “no publicly named customer in the assigned pool,” not a precise customer count of
              zero. Underwriting should keep customer count, retention, and concentration null until SSI provides
              primary, denominator-defined evidence.
            calloutType: risk
            claimRefs:
              - CU002
