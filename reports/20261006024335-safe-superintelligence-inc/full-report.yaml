      - number: '3.3'
        title: Pricing, distribution, and supply access
        blocks:
          - type: paragraph
            body: >-
              SSI cannot yet be compared on realized price, contract term, discounting, or customer switching cost. The
              assigned evidence identifies no public pricing surface or commercial package, while the
              competitor-comparison pages do not provide reliable peer price cards [CP011]. Compute access is more
              visible: sources describe Google Cloud TPU usage followed by an NVIDIA partnership that includes Vera
              Rubin access, but they do not establish that either supply relationship is exclusive or that it creates
              proprietary distribution [CP010]. Public headcount estimates also diverge materially, from approximately
              13 to roughly 50, with different source vintages and methods, so this chapter does not convert either
              figure into a precise current operating-scale claim [CP007].
            claimRefs:
              - CP007
              - CP010
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              SSI's current moat is best understood as access to capital, compute, and scarce research talent rather
              than product lock-in. Even the capital baseline is disputed: Vorp Labs separates about $3 billion of
              confirmed-and-reported equity from an undisclosed NVIDIA investment, whereas Value Add VC asserts roughly
              $8 billion after a reported $5 billion NVIDIA check [CP008, CP009]. The latter source also reports that
              Thinking Machines shipped Tinker and World Labs shipped Marble, while SSI still lacked a public artifact
              [CP012]. A rumored August 2026 SSI model release had not appeared by September 25, but the rumor was never
              an SSI promise [CP013]. Without a model, benchmark, or method disclosure, research advantage and switching
              costs remain unverified, leaving commoditization and execution timing as the central competitive risks
              [CP014, CP015].
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation remains unbenchmarked
            body: >-
              SSI may possess valuable proprietary research, but no assigned source provides a model, benchmark, method
              disclosure, or safety framework that lets an outside investor compare that work with frontier peers.
              Capital and compute access extend the time available to prove the thesis; they do not themselves establish
              technical superiority or customer lock-in.
            calloutType: risk
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Evidence
        blocks:
          - type: paragraph
            body: >
              The retained evidence supports a pre-commercial research model, not an operating revenue model. Multiple
              independent sources describe SSI as having no released product and no disclosed revenue, and the reviewed
              source set identifies no paying customer, customer contract, pricing page, or active commercial channel
              [CI001, CI002]. One market-data page labels the revenue model "subscription," but the same page calls SSI
              pre-commercial and says it has disclosed no revenue or financial metrics; that taxonomy is therefore not
              evidence of an actual subscription business [CI003, CI004].


              No verified public record in the assigned evidence defines a revenue stream, billable unit, list or
              realized price, discount policy, contract duration, or revenue-recognition method [CI005]. Financing and
              compute access are inputs to research, not revenue. The defensible conclusion is narrower than "zero
              revenue": revenue is not publicly disclosed, and the evidence available through September 2026 does not
              establish a commercial offering. Management diligence must determine whether eventual monetization would
              use API consumption, licensing, enterprise contracts, or another mechanism rather than assuming a SaaS
              model [CI001, CI002, CI005].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI007
              - CI013
              - CI016
      - number: '4.2'
        title: GTM Evidence and Unit-Economics Gaps
        blocks:
          - type: paragraph
            body: >
              SSI's public financial surface does not support a sales-efficiency analysis. The retained sources do not
              disclose customer acquisition cost, sales cycle, payback, channel economics, retention, utilization, or
              any denominator from which those metrics could be calculated [CI006]. The absence of a reported pricing
              page or customer contract also prevents testing list-to-realized pricing, discounting, minimum
              commitments, or revenue concentration [CI002, CI005]. These are unavailable inputs, not zero values, and
              they should not be replaced with peer benchmarks that presume an already commercial model.


              The same limitation applies to gross margin and delivery economics. The NVIDIA relationship reportedly
              adds Vera Rubin access and is intended to expand SSI's compute by an order of magnitude, making compute
              the clearest observable cost driver [CI007, CI013]. Yet the public evidence does not disclose whether
              compute is purchased, credited, financed, reserved, or contributed in kind, nor does it provide gross
              margin, working-capital, capex, or service-delivery cost data [CI008, CI014]. Until a product and billing
              unit exist, conventional SaaS unit economics are not merely weak; they are structurally premature.
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI005
              - CI006
      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >
              The historical round chronology belongs in Company Overview; for financial underwriting, the relevant
              issue is what those financings imply about current resources. Public sources do not agree on the answer.
              Vorp Labs separates an officially confirmed $1 billion 2024 raise from an approximately $2 billion 2025
              round reported by multiple outlets and treats the 2026 NVIDIA amount as undisclosed by the companies
              [CI009]. Other databases and analyses report roughly $8 billion across three rounds, while GetLatka still
              reports $2 billion across one round [CI010, CI011]. The divergence reflects source treatment and
              staleness, so a single cumulative total should not be presented as audited cash.


              Even a correct funding-raised figure would not establish cash available, because none of the retained
              sources discloses current cash, burn, restricted funds, debt, project finance, committed compute spend, or
              the mix of cash and in-kind consideration [CI012, CI014]. The reported tenfold compute expansion may
              increase research capacity, but it also makes infrastructure obligations central to the runway question
              [CI007, CI013]. Public evidence therefore cannot calculate runway, determine a next-round trigger, or test
              whether financing dependence has declined [CI015].
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
