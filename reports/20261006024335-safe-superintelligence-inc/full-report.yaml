  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk posture: evidence opacity is the central exposure'
        blocks:
          - type: paragraph
            body: >-
              SSI says its sole product is safe superintelligence and that safety should advance with capability, but
              that mission statement is not evidence that either outcome has been achieved. The strongest public risk
              signal is the absence of staged technical proof: assigned sources describe no SSI-attributed papers,
              benchmark claims, public model, API, or frontier safety framework as of their stated 2026 review dates. A
              technical survey also cautions that current alignment methods address pieces of the problem rather than an
              end-to-end assurance case. The result is high residual underwriting uncertainty, not proof of technical
              failure. The appropriate mitigation is milestone-gated capital and compute access tied to independently
              reviewable evaluations, governance thresholds, and rollback criteria; continued absence of those artifacts
              is a thesis-break signal.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: Governance, legal, and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              The public record supports a disclosure-risk conclusion but not a finding that SSI has violated any law or
              suffered a regulatory incident. Vorp Labs reports no published frontier safety framework, while the
              reviewed company analyses do not expose decision rights, independent release approval, incident reporting,
              privacy controls, intellectual-property disputes, or jurisdiction-specific deployment obligations. Because
              SSI has not released a public product in the cited record, the eventual product surface and applicable
              requirements also cannot be scoped confidently. These are material diligence gaps. Before investment or
              additional capital release, counsel should map the United States and Israel entities, inspect litigation
              and regulator correspondence, review IP assignments, and test whether an independent body can pause
              scaling or deployment.
            claimRefs:
              - CR003
              - CR004
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR015
              - CR016
      - number: '7.3'
        title: Operational, technical, and leadership execution
        blocks:
          - type: paragraph
            body: >-
              External validation is constrained by SSI's straight-shot posture. Vorp Labs found no public model or API
              as of August 15, 2026, and Value Add VC reported no model by September 25 after an investor had floated an
              August release window; that rumor was not an SSI promise, so the evidence supports milestone uncertainty
              rather than a broken company commitment. Third-party analysis also argues that avoiding iterative
              deployment can limit real-world stress testing. Leadership concentration adds execution sensitivity:
              assigned sources report Daniel Gross's 2025 departure and the resulting CEO and president roles for Ilya
              Sutskever and Daniel Levy. Mitigation requires board-approved succession, documented milestone review,
              independent red-team evidence, and a pre-agreed stop if scaling outruns assurance.
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR010
              - CR014
      - number: '7.4'
        title: Partner, financial, and model risk
        blocks:
          - type: paragraph
            body: >-
              Compute access and financing are simultaneously strengths and concentration risks. Sources describe prior
              Google Cloud TPU use followed by a 2026 Nvidia partnership expected to expand compute by an order of
              magnitude, but the investment amount was not disclosed by the companies in the reviewed record. Funding
              totals are therefore not interchangeable: GetLatka records $2 billion across one round on a page last
              updated in 2025, Vorp Labs separates roughly $3 billion of confirmed-and-reported equity from an
              undisclosed Nvidia investment, and Value Add VC estimates roughly $8 billion by including a reported $5
              billion Nvidia amount. None establishes cash available, burn, runway, or financing terms. Mitigation is
              verified cap-table, cash, contract, and vendor-exit diligence rather than extrapolation from valuation or
              funding headlines.
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
