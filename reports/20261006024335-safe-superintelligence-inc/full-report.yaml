              - CU013
      - number: '6.3'
        title: Named counterparties are not named customers
        blocks:
          - type: paragraph
            body: >-
              NVIDIA is the strongest named external relationship in the pool, but the joint announcement describes a
              long-term strategic partnership, an investment, Vera Rubin access, and technical collaboration. It does
              not describe NVIDIA buying, piloting, or deploying an SSI product. Secondary reporting similarly
              characterizes Google Cloud as a prior compute provider. Treating either supplier or investor as customer
              proof would overstate traction and obscure SSI's dependency on capital and scarce compute. The
              customer-proof table therefore records relationship type explicitly and retains an open row for the
              undisclosed end-customer population. This distinction is material because supplier concentration can
              increase execution risk even when customer concentration remains unknowable.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
              - CU012
      - number: '6.4'
        title: What must happen before customer quality can be judged
        blocks:
          - type: paragraph
            body: >-
              The next credible adoption signal is not another financing headline; it is an externally inspectable
              product or research artifact followed by named evaluation, pilot, and production evidence. Enterprise DNA
              explicitly places SSI's work years away from business adoption, while an IBM panel raised the broader
              pressure on a capital-backed, single-goal research organization to eventually demonstrate a return. The
              journey map separates what is observed today from the unresolved conversion gates. Investors should
              require customer identity, payer and user roles, deployment status, dated usage denominators, outcomes,
              contract terms, and renewal evidence before assigning revenue durability or land-and-expand value.
            claimRefs:
              - CU008
              - CU011
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
