chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating stage
        blocks:
          - type: paragraph
            body: >
              Safe Superintelligence Inc. was founded in June 2024 by Ilya Sutskever, Daniel Gross, and Daniel Levy
              [CO001]. The company describes itself as American and confirms offices in Palo Alto and Tel Aviv, while
              third-party profiles identify Palo Alto as its headquarters [CO002]. Its stated strategy is unusually
              narrow: one goal and one intended product, a safe superintelligence, with safety and capability pursued
              together rather than through an interim commercial portfolio [CO003].


              Public evidence still places SSI in a research-only, pre-product stage. Independent reviews through August
              and September 2026 found no public model, API, product surface, paper, or technical blog post [CO004].
              That finding does not prove that internal research is absent; it means outsiders cannot evaluate a
              product, benchmark, or published method. The assigned evidence also contains no company-issued revenue or
              customer-count metric, so both remain diligence gaps rather than zeros [CO012]. SSI is therefore best
              understood as a capital-financed research program, not yet as an operating software vendor with observable
              commercial traction.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership concentration and governance visibility
        blocks:
          - type: paragraph
            body: >
              SSI's founding team combined Sutskever's frontier-model research background, Gross's operating and
              investing experience, and Levy's large-scale optimization work [CO001]. The leadership structure changed
              in 2025: SSI says Gross was no longer part of the company after June 29, Sutskever became chief executive,
              and Levy became president while the technical team continued to report to Sutskever [CO009, CO010]. This
              leaves the two remaining founders as the visible leadership core and concentrates scientific and executive
              accountability in Sutskever.


              The assigned public materials do not disclose board composition, investor protective rights, an
              independent safety committee, or a mission-lock mechanism [CO013]. They also report no public
              frontier-safety framework against which external reviewers could compare thresholds, escalation rules, or
              oversight [CO014]. Those absences should not be interpreted as evidence that internal controls do not
              exist. They instead create a verification problem: investors need confidential governance documents, board
              minutes, and safety-review protocols before concluding that SSI's stated mission is institutionally
              protected. Gross's departure makes that request more important because it removed the founder who
              initially held the CEO role.
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO013
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO013
              - CO014
      - number: '1.3'
        title: Capital formation without a public operating baseline
        blocks:
          - type: paragraph
            body: >
              The cleanest funding anchor is SSI's own September 2024 update: it raised $1 billion from NFDG, Andreessen
              Horowitz, Sequoia, DST Global, and SV Angel [CO005]. Independent sources subsequently report an
              approximately $2 billion 2025 round led by Greenoaks at a $32 billion valuation, but SSI did not confirm
              that round or valuation in the assigned official evidence [CO006]. In July 2026, SSI confirmed a strategic
              NVIDIA partnership intended to increase compute tenfold; the companies' investment amount was undisclosed
              in the assigned evidence [CO007].


              Secondary sources attribute a roughly $5 billion investment to NVIDIA, but the strongest retained
              synthesis explicitly labels that amount unconfirmed [CO008]. Accordingly, this chapter does not convert
              the reported financing into confirmed cash available or present an $8 billion total as settled fact. Scale
              is similarly uncertain: assigned estimates range from 13 employees to roughly 20-30 and about 50, with no
              official current count [CO011]. Revenue, customers, burn, remaining cash, and runway are unsupported. The
              capitalization case is therefore observable mainly through financing announcements and supplier
              commitments, not financial statements or operating KPIs.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
              - CO015
      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >
              SSI's public milestones show rapid access to capital and compute but limited externally testable output.
              The sequence runs from the June 2024 founding and September 2024 raise to a reported Google Cloud TPU
              relationship in April 2025, the June-July 2025 founder transition, and the July 2026 NVIDIA partnership
              [CO001, CO005, CO009, CO010, CO015]. These events demonstrate financing capacity, supplier access, and
              continuity after Gross's exit; they do not independently demonstrate technical performance or
              commercialization.


              The clearest adverse signal is not a missed company promise. An investor-attributed report pointed to an
              August 2026 model release, but SSI never confirmed the date, and reviews through September found no
              release [CO016]. It should be treated as an unfulfilled external expectation, not a broken corporate
              commitment. The decisive next milestones are therefore evidence events: a model or research publication,
              auditable safety methods, a verified current team and governance map, and financial disclosures separating
              funding raised from cash remaining. Until those appear, key-person concentration and information asymmetry
              dominate the company overview.
            claimRefs:
              - CO001
              - CO005
              - CO009
              - CO010
              - CO015
              - CO016
