callouts:
  - calloutType: insight
    title: Pre-Revenue Capitalization Decoupled from Enterprise Software TAM
    body: Safe Superintelligence Inc.'s $32 billion valuation reflects a capitalization model grounded entirely in founder option value and technical scarcity rather than addressable software spend. By insulating research from near-term API commercialization, the lab trades current cash flows for unencumbered pursuit of superintelligence.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM015
  - calloutType: risk
    title: Commercial Underwriting Risk in the Absence of Shipped Artifacts
    body: The failure of rumored 2026 model milestones to materialize, coupled with the complete absence of published papers or public safety frameworks, leaves SSI's market sizing fundamentally unverified. Prolonged silence risks market skepticism if competitor labs maintain rapid capability deployment.
    claimRefs:
      - CM005
      - CM010
      - CM011
