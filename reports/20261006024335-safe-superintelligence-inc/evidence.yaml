evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, investor rights, mission-lock terms, independent safety oversight, and founder succession
      arrangements.
    whyItMatters: >-
      The public record cannot show whether the safety mission survives founder departure, financing pressure, or a
      change in control.
    diligencePath: >-
      Request the charter, bylaws, voting agreements, board minutes, safety committee mandate, and key-person succession
      plan.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Audited or management-certified revenue, customer count, current headcount, cash balance, burn, compute
      commitments, and runway.
    whyItMatters: >-
      Conflicting headcount estimates and undisclosed financial metrics prevent a reliable view of operating scale or
      capital sufficiency.
    diligencePath: >-
      Obtain current management accounts, bank statements, payroll roster, customer ledger, financing closing
      statements, and compute contracts.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: commercial-contracts
    missingEvidence: >-
      Verifiable customer contracts, commercial pricing schedules, or enterprise procurement agreements for Safe
      Superintelligence Inc. deliverables.
    whyItMatters: >-
      Without commercial contracts or monetization roadmaps, addressable market sizing cannot rely on observed customer
      willingness to pay or contract values.
    diligencePath: >-
      Monitor official SSI channels for commercial licensing announcements or enterprise pilot partnership disclosures
      following model completion.
    relatedQuestionRefs:
      - QM009
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      A buyer-grounded enumeration of internal-build programs, status-quo substitutes, likely entrants, and adjacent
      research providers.
    whyItMatters: Direct lab lists alone do not show every way a buyer, strategic partner, or researcher can solve the same job.
    diligencePath: >-
      Interview target buyers and research partners, then validate named alternatives against procurement records and
      first-party product documentation.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: buyer-alternatives
    missingEvidence: >-
      Current price cards, realized contract terms, switching costs, multi-homing behavior, and internal-build cost
      benchmarks.
    whyItMatters: >-
      Without buyer economics, the chapter cannot quantify distribution power, lock-in, or SSI's eventual
      willingness-to-pay ceiling.
    diligencePath: >-
      Obtain first-party price cards and redacted contracts, and conduct reference calls with frontier-model buyers and
      internal AI teams.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: commercial-evidence
    missingEvidence: Customer contracts, product price book, billing unit, pipeline, and revenue-recognition policy.
    whyItMatters: These records are required to establish whether a revenue model exists and how revenue quality should be assessed.
    diligencePath: >-
      Request the commercial plan, executed contracts, invoices, pipeline export, and accounting policy in the diligence
      data room.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Customer acquisition, sales-cycle, retention, utilization, cost-to-serve, and gross-margin records.
    whyItMatters: Without common units and periods, sales efficiency and contribution economics cannot be calculated.
    diligencePath: >-
      Request cohort-level bookings, sales expenses, compute consumption, support costs, and product-level margin
      schedules.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: financing
    missingEvidence: >-
      Executed financing documents and a reconciled capitalization schedule separating confirmed cash, reported equity,
      and in-kind compute.
    whyItMatters: Public cumulative funding figures conflict and cannot establish available liquidity or dilution.
    diligencePath: Reconcile bank receipts, stock-purchase agreements, cap table entries, and partner credits for every financing.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, restricted funds, debt, leases, compute commitments, planned uses of funds, and
      next-round trigger.
    whyItMatters: Funding raised is not cash available, and undisclosed compute obligations prevent a runway calculation.
    diligencePath: >-
      Request bank statements, monthly cash-flow forecasts, debt and lease schedules, and the complete NVIDIA and cloud
      agreements.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: >-
      Internal architecture specifications, training and evaluation methodology, benchmark results, scaling curves, and
      reproducibility evidence.
    whyItMatters: >-
