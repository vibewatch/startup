company:
  name: "Safe Superintelligence Inc."
chapter:
  number: 5
  title: "Product & Technology"
  summary: "SSI remains a research-only lab whose sole stated product is safe superintelligence; no public model, API, technical paper, benchmark, or safety framework was available in the assigned evidence through late September 2026. The clearest technical signals are successive Google TPU and NVIDIA Vera Rubin compute relationships, while the model architecture, safety controls, deployment workflow, and release criteria remain private."
sections:
  - id: "product-definition-and-maturity"
    title: "One Planned Product, No Public Product Surface"
    body: "SSI describes one goal and one planned product: safe superintelligence. That is a research objective rather than a usable SKU today. The assigned evidence found no public model, API, chatbot, pricing page, model card, or developer documentation through late September 2026. Accordingly, there is no supported buyer, user workflow, deployment pattern, service-level record, or measurable customer benefit to evaluate. The straight-shot structure may reduce distraction from intermediate commercialization, but it also removes the normal product feedback loops that expose reliability, integration, and support problems. Product maturity should therefore be classified as unreleased research, not alpha software or a deployable platform."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE011"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "architecture-and-compute"
    title: "Architecture Is Undisclosed; Compute Is the Observable Layer"
    body: "Public evidence supports an infrastructure outline, not a model architecture. Google Cloud supplied TPUs for SSI research in 2025, and the July 2026 NVIDIA partnership added access to the Vera Rubin platform with a company-reported order-of-magnitude compute expansion. The workload split, cluster size, software stack, training method, model parameters, data strategy, and migration plan are not disclosed. SSI says safety and capability advance in tandem, but that statement does not identify a control mechanism or demonstrate performance. Commentary about brain-inspired learning, sample efficiency, continual learning, or internal value functions remains speculative and should not be represented as implemented SSI technology without primary technical disclosure."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-and-roadmap"
    title: "Deployment, Integration, Reliability, and Roadmap"
    body: "SSI has not exposed a deployment or integration surface, so uptime, latency, support, security operations, versioning, compatibility, and incident history cannot be assessed. An investor relayed an August 2026 model-release expectation, but SSI did not confirm that date and no release had appeared by late September in the assigned evidence. A missed third-party rumor is not a missed company commitment; it instead demonstrates that the external roadmap is unverified. The NVIDIA relationship and Sutskever's statement that research was worthy of scaling show willingness to commit compute, but neither establishes benchmark quality, safe operation, production readiness, or a release date."
    claimRefs:
      - "CE010"
      - "CE012"
      - "CE013"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE002"
  - id: "trust-safety-and-differentiation"
    title: "Differentiation Is a Focus Claim, Not Yet an Auditable Moat"
    body: "SSI's differentiation is organizational and aspirational in the public record: a small, focused lab intends to develop safety and capability together without maintaining intermediate commercial products. Evidence of technical differentiation is not public. The assigned sources found no paper, benchmark, model card, code repository, frontier safety framework, external audit, or documented release threshold. This opacity may protect research, but it prevents investors and practitioners from comparing safety controls, measuring progress, or testing reproducibility. The central diligence issue is therefore not whether the mission is distinctive; it is whether private evidence can demonstrate a repeatable technical advantage and enforceable safety controls before further scaling."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE011"
      - "CE015"
