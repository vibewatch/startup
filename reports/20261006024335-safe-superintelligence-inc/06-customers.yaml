figures:
  - id: FU001
    title: "Customer evidence journey"
    type: journey-map
    summary: >-
      SSI has reached the research and compute-scaling stages, while every customer
      validation and expansion stage remains publicly unevidenced.
    data:
      items:
        - label: "1. Closed research"
          detail: "Observed: SSI pursues a straight-shot research program without an intermediate commercial product."
          touchpoints:
            - "No model, API, pricing page, or developer documentation found"
        - label: "2. Compute scaling"
          detail: "Observed: NVIDIA investment, Vera Rubin access, and technical collaboration."
          touchpoints:
            - "Order-of-magnitude compute increase announced"
        - label: "3. Inspectable release"
          detail: "Unresolved: publish a model, paper, benchmark, or safety methodology that external evaluators can inspect."
          touchpoints:
            - "Rumored August 2026 model was not an SSI commitment and had not appeared by September 25"
        - label: "4. Named evaluation or pilot"
          detail: "Unresolved: identify evaluator, user, payer, scope, and success criteria."
          touchpoints:
            - "No named pilot or design partner in the assigned pool"
        - label: "5. Production deployment"
          detail: "Unresolved: provide dated active usage and outcome evidence."
          touchpoints:
            - "No account, user, location, or utilization denominator"
        - label: "6. Renewal and expansion"
          detail: "Unresolved: demonstrate contract renewal, cohort retention, and expansion."
          touchpoints:
            - "No NRR, GRR, churn, renewal, or contract-length metric"
    approximationNotes: >-
      This is an evidence-maturity sequence, not a forecast or claim that SSI will
      complete every stage; unresolved stages are diligence requirements.
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU013
      - CU014
callouts:
  - calloutType: risk
    title: "Do not convert absent disclosure into a zero-customer metric"
    body: >-
      The evidence supports “no publicly named customer in the assigned pool,” not a
      precise customer count of zero. Underwriting should keep customer count, retention,
      and concentration null until SSI provides primary, denominator-defined evidence.
    claimRefs:
      - CU002
      - CU009
      - CU013
