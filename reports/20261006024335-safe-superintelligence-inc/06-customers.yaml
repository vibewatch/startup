schemaVersion: "report-v2"
artifact: customers
slug: safe-superintelligence-inc
runDate: "2026-10-06"
company:
  name: "Safe Superintelligence Inc."
chapter:
  number: 6
  title: "Customers"
  summary: >-
    SSI remains pre-commercial in the reviewed public record: no named paying customer,
    pilot, production deployment, model, API, pricing page, or retention metric is
    disclosed. NVIDIA is evidenced as an investor, compute supplier, and technical
    partner rather than as a customer, so its relationship cannot substitute for
    customer validation.
sections:
  - id: commercial-surface
    title: "Commercial surface and customer segmentation"
    body: >-
      The available evidence does not support a conventional customer segmentation
      analysis because SSI has not exposed a product surface through which enterprises,
      developers, or researchers could become observable users. Independent reviews
      found no released model, API, pricing page, developer documentation, or benchmark,
      while SSI's stated straight-shot strategy places safe superintelligence ahead of
      intermediate products. Accordingly, the segment map below is a diligence
      classification of potential buyer and user groups, not a claim that SSI serves
      them today. The reviewed sources identify no paying account, pilot customer,
      production deployment, or customer case study. That absence is evidence of weak
      public commercial validation, but it is not proof that no private evaluation or
      undisclosed relationship exists.
    claimRefs:
      - CU001
      - CU002
      - CU010
      - CU014
    tableRefs:
      - TU001
  - id: adoption-and-durability
    title: "Adoption, retention, and expansion remain unmeasurable"
    body: >-
      Public adoption evidence stops before the first customer milestone. Value Add VC
      reported zero disclosed revenue as of September 25, 2026, and multiple sources
      reported that the anticipated August model release had not appeared; however,
      disclosed revenue is not ARR, and the release timing came from an investor rather
      than an SSI commitment. No source supplies accounts, active users, locations,
      utilization, backlog, NRR, GRR, churn, renewal, contract length, satisfaction, or
      cohort data. The appropriate conclusion is therefore not that retention is poor,
      but that retention and expansion cannot yet be assessed. Any underwriting model
      should leave those fields null until SSI supplies dated, denominator-defined
      operating evidence.
    claimRefs:
      - CU003
      - CU004
      - CU009
      - CU013
    tableRefs:
      - TU002
  - id: counterparties-and-proof
    title: "Named counterparties are not named customers"
    body: >-
      NVIDIA is the strongest named external relationship in the pool, but the joint
      announcement describes a long-term strategic partnership, an investment, Vera
      Rubin access, and technical collaboration. It does not describe NVIDIA buying,
      piloting, or deploying an SSI product. Secondary reporting similarly characterizes
      Google Cloud as a prior compute provider. Treating either supplier or investor as
      customer proof would overstate traction and obscure SSI's dependency on capital
      and scarce compute. The customer-proof table therefore records relationship type
      explicitly and retains an open row for the undisclosed end-customer population.
      This distinction is material because supplier concentration can increase execution
      risk even when customer concentration remains unknowable.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU012
    tableRefs:
      - TU003
  - id: conversion-gates
    title: "What must happen before customer quality can be judged"
    body: >-
      The next credible adoption signal is not another financing headline; it is an
      externally inspectable product or research artifact followed by named evaluation,
      pilot, and production evidence. Enterprise DNA explicitly places SSI's work years
      away from business adoption, while an IBM panel raised the broader pressure on a
      capital-backed, single-goal research organization to eventually demonstrate a
      return. The journey map separates what is observed today from the unresolved
      conversion gates. Investors should require customer identity, payer and user
      roles, deployment status, dated usage denominators, outcomes, contract terms, and
      renewal evidence before assigning revenue durability or land-and-expand value.
    claimRefs:
      - CU008
      - CU011
      - CU013
      - CU014
    figureRefs:
      - FU001
