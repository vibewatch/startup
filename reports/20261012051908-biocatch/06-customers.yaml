company:
  name: BioCatch
chapter:
  number: 6
  title: Customers
  summary: BioCatch protects more than 350 financial institutions, 760 million users, and 1.8 billion devices globally, including three of the top four US banks by assets and global leaders such as HSBC and Barclays. While customer adoption and session scale are validated across 21 countries, critical durability metrics including net revenue retention, churn, and top-account concentration remain undisclosed.
sections:
  - id: customer-segmentation-and-buyer-personas
    title: Customer Segmentation and Enterprise Buyer Personas
    body: 'BioCatch segments its customer base primarily across tier-one global money-center banks, regional commercial financial institutions, and digital-only fintech challenger banks. Enterprise buyers within these organizations typically reside within fraud management, financial crime compliance, and digital channels departments. Fraud executives face dual pressures: stopping rapidly evolving authorized push payment scams and account takeover attacks while minimizing false positive friction that disrupts legitimate user transactions. In tier-one banks, procurement is highly structured, requiring rigorous return-on-investment justification, data privacy compliance, and architectural proofs of concept before production rollout. The company has successfully penetrated this conservative buyer segment by establishing high-confidence behavioral signals that differentiate criminal manipulation from genuine user intent without requiring disruptive step-up authentication.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU014
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-deployment-scale
    title: Adoption Trajectory and Global Scale
    body: 'The adoption trajectory of BioCatch illustrates rapid commercial expansion from niche biometric authentication toward an enterprise-scale fraud and financial crime platform. As of mid-2026, more than 350 financial institutions across 21 countries deploy BioCatch solutions, up from 340 customers reported in 2025 disclosures and earlier milestones exceeding 100 million dollars in ARR. The platform monitors approximately 19 billion digital banking sessions each month, safeguarding more than 760 million end users across 1.8 billion unique devices. In the United States, BioCatch protects customers across three of the top four commercial banking institutions by assets. This extensive scale generates a powerful data network advantage: as the platform monitors billions of interactions, its machine learning models continuously refine behavioral baselines, strengthening real-time anomaly detection against sophisticated cyber threats.'
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU007
    tableRefs:
      - TU002
  - id: named-customer-proof-and-production-outcomes
    title: Named Customer Proof and Production Deployments
    body: Publicly verified customer deployments validate BioCatch production efficacy across diverse international banking environments. In the United Kingdom, flagship institutions including HSBC, Barclays, and NatWest have deployed BioCatch across retail and commercial online channels, utilizing continuous session profiling to alert fraud response teams to coercive social engineering attacks. In Latin America, Brazil’s Itau Unibanco deployed BioCatch to mitigate prevalent regional malware and banking Trojans while avoiding digital channel disruption and reducing operational fraud handling expenses. Similarly, Australian digital bank 86 400 implemented behavioral biometrics to maintain a two-minute digital onboarding experience without compromising defense against identity theft. Multiple tier-one customer executives have also joined BioCatch’s Client Innovation Board, underscoring deep executive engagement and strategic co-development relationships.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: customer-journey-retention-and-concentration-risks
    title: Customer Journey, Retention Durability, and Concentration Dynamics
    body: BioCatch customer adoption typically follows an expansion loop that begins with targeted proof-of-concept deployments on high-risk transaction flows and expands across enterprise mobile, web, and API channels. Over time, enterprise accounts add specialized capabilities such as mule account detection and device intelligence. However, key diligence risks persist regarding contract durability and commercial disclosure opacity. BioCatch does not publicly disclose audited net revenue retention rates, annual gross customer churn, average contract length, or top-customer revenue concentration. Furthermore, broader industry scam losses and mule activity continue to escalate globally, suggesting that while behavioral biometrics mitigates direct account compromise, systemic financial crime remains an aggressive challenge for financial institution customers.
    claimRefs:
      - CU004
      - CU008
      - CU013
      - CU014
    figureRefs:
      - FU001
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer & User Personas
      - Primary Use Case
      - Scale & Penetration
      - Strategic Value & Revenue Model
      - Key Diligence Gap
    rows:
      - - Global Mega-Banks (Tier 1)
        - Group Heads of Retail Fraud, Head of Cyber Defense, Digital Channels
        - Continuous session monitoring, authorized scam detection, account takeover interception
        - 100+ of the largest global banks; 3 of top 4 US banks
        - High-ACV multi-year enterprise platform subscriptions with high stickiness
        - Concentration of total ARR among the top 10 banking relationships
      - - Regional & National Banks (Tier 2/3)
        - Chief Risk Officers, VP of Financial Crime, AML Compliance Officers
        - Account opening validation, mobile banking malware detection, mule account detection
        - Over 200 institutions across North America, Europe, Latin America, and APAC
        - Mid-tier ACV annual licenses with expansion potential across digital banking lines
        - Implementation overhead and longer procurement conversion timelines
      - - Fintech Neobanks & Challenger Banks
        - Chief Technology Officers, Chief Risk Officers, Product Growth Teams
        - Rapid frictionless customer onboarding, synthetic identity detection, API-driven auth
        - Dozens of high-growth digital banks (e.g. 86 400)
        - Usage-based or tiered session volume pricing tied to account growth
        - Higher exposure to fintech funding volatility and potential customer churn
      - - Payments & Card Networks
        - Global Head of Value-Added Services, Network Security Architecture
        - Consortium network fraud intelligence, cross-border scam and mule detection
        - Acquisition by Visa connecting to 14,500 financial institutions globally
        - Strategic integration into network rails as upstream value-added security service
        - Regulatory approval timeline and potential post-acquisition integration friction
    notes: Customer segments synthesized from company disclosures, tier-one bank client lists, and corporate transaction filings; pricing models and exact ARR distributions remain confidential.
