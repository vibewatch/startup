figures:
  - id: FU001
    title: 'Customer journey map: Banking fraud prevention and expansion loop'
    type: journey-map
    summary: Illustrates the financial institution lifecycle from trial integration through multi-signal production deployment and consortium telemetry sharing.
    claimRefs:
      - CU008
      - CU014
    data:
      items:
        - stage: Discovery & Evaluation
          label: Risk Assessment
          description: Bank fraud strategy team evaluates rising scam and ATO losses against existing rule-based engines.
          touchpoints:
            - Executive briefings on authorized push payment scams
            - Proof-of-concept modeling against historical fraud telemetry
        - stage: Pilot Integration
          label: Sandbox Telemetry
          description: Institution integrates BioCatch SDK and API into high-risk digital banking flows in shadow mode.
          touchpoints:
            - Passive behavioral telemetry collection without user friction
            - Baseline false-positive rate benchmarking against production fraud
        - stage: Initial Production
          label: Targeted Flow Protection
          description: Live deployment targeted at high-risk transaction authorization and digital account opening.
          touchpoints:
            - Real-time risk scoring for high-value fund movements
            - Immediate interception of impersonation and social engineering coercion
        - stage: Full Fleet Deployment
          label: Omnichannel Coverage
          description: Expansion across all retail and commercial mobile and web digital banking sessions.
          touchpoints:
            - Continuous session monitoring across native mobile apps and web portals
            - Integration with core AML and enterprise fraud case management systems
        - stage: Multi-Module Expansion
          label: Cross-Product Add-ons
          description: Adoption of mule detection, scam intelligence, and device intelligence modules.
          touchpoints:
            - Account opening fraud detection preventing synthetic identity creation
            - Inbound and outbound money mule account identification
        - stage: Network Consortium
          label: Cross-Bank Intelligence
          description: Participation in real-time intelligence-sharing networks across peer financial institutions.
          touchpoints:
            - Federated fraud intelligence across peer banks to track cross-institutional mule rings
            - Collaborative detection of emerging generative AI scam campaigns
