  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Customer Retention and Cohort Expansion Dynamics
      missingEvidence: Audited net revenue retention (NRR), gross revenue retention (GRR), logo churn, and customer contract duration metrics.
      whyItMatters: Without public cohort retention disclosures, underwriters cannot definitively verify whether revenue expansion to $185M ARR is driven by new logo acquisition or expansion within existing tier-one banks.
      diligencePath: Request customer cohort retention schedules, historical churn by banking tier, and module-level net expansion figures during sponsor diligence.
      relatedQuestionRefs:
        - QU008
    - type: enumeration-incomplete
      severity: minor
      topic: Named customer proof table
      missingEvidence: Comprehensive roster of all 350+ banking deployments, pilot-to-production conversion rates, and contract values.
      whyItMatters: Public case studies disclose only a subset of flagship banking clients (such as HSBC, Barclays, NatWest, and Itau Unibanco), leaving the remaining ~340 client contracts and commercial terms unobservable.
      diligencePath: Review vendor management records, anonymized customer concentration lists, and top-20 client billing schedules.
      relatedQuestionRefs:
        - QU001
      relatedTableRefs:
        - TU003
