callouts:
- calloutType: insight
  title: Upstream Fraud Intelligence Driving Premium Valuation Multiple
  body: Visa's $2.4 billion acquisition of BioCatch at roughly 13x trailing ARR highlights a structural pivot in digital payment security. Rather than inspecting transactions solely at the terminal or network level, payment networks are aggressively acquiring upstream behavioural telemetry to neutralize account takeovers, social engineering scams, and mule accounts prior to payment authorization.
  claimRefs:
  - CO003
  - CO006
  - CO010
- calloutType: risk
  title: Extended Antitrust Review Horizon and Regulatory Friction
  body: The multi-quarter closing timeline stretching to Visa's fiscal Q2 2027 exposes the deal to intense scrutiny from global antitrust regulators wary of card network dominance in adjacent financial data infrastructure. Prolonged pre-closing uncertainty could affect talent retention and strain BioCatch's collaborative fraud intelligence network across competing banking institutions.
  claimRefs:
  - CO012
  - CO013
