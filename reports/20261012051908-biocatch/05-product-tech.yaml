company:
  name: BioCatch
chapter:
  number: 5
  title: Product & Technology
  summary: BioCatch delivers a behavioral-first digital fraud prevention platform centered on BioCatch Connect, capturing real-time telemetry across 3,000-plus behavioral signals to distinguish legitimate accountholders from unauthorized fraudsters and coerced scam victims. Serving more than 350 financial institutions across 1.8 billion devices, the architecture combines on-device sensors, continuous machine-learning intent scoring, and cross-bank mule intelligence networks, validated by Visa's .4 billion acquisition announcement in August 2026.
sections:
- id: product-definition-and-telemetry-architecture
  title: Product Architecture and Client-Side Telemetry Collection
  body: BioCatch Connect operates as an enterprise-grade digital fraud intelligence platform designed to protect financial institutions throughout the consumer banking lifecycle. Rather than relying solely on static point-in-time identity verification or traditional network credentials, the platform captures passive, continuous telemetry through lightweight mobile SDKs and web JavaScript sensors. As users interact with banking applications, BioCatch monitors more than 3,000 distinct behavioral parameters in real time without imposing active friction on legitimate customers. These micro-behaviors encompass fine-grained physical interactions such as keystroke cadence, typing velocity, touchscreen swipe pressure, touch angles, gyroscopic orientation, mouse acceleration, cursor hesitation, and clipboard paste actions. By synthesizing these micro-interactions into dynamic behavioral profiles, the platform continuously re-establishes session trust throughout every active millisecond, effectively
    distinguishing genuine human accountholders from automated bot scripts, cybercriminals, and manipulated users.
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE005
  - CE009
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: module-matrix-and-solution-capabilities
  title: BioCatch Connect Core Modules and Functional Map
  body: The commercial portfolio of BioCatch Connect is organized into specialized functional modules tailored to specific vulnerability windows across retail and commercial banking workflows. Core modules include Account Opening Protection, which screens for synthetic identities and fraudulent onboarding; Account Takeover (ATO) Protection, which detects unauthorized credential usage and session hijacking; Scam Detection (Anti-Coercion), which flags authorized push payment fraud; and Mule Account Defense, which identifies money laundering accounts during creation and cash-out. Additionally, the DeviceIQ module delivers deep contextual intelligence regarding device integrity, recognizing rooted handsets, jailbreaks, emulator environments, and proxy infrastructure. This modular architecture is reinforced by an extensive intellectual property moat comprising 92 registered patents, allowing tier-1 banking clients to deploy targeted protection modules or implement the unified BioCatch Connect
    suite across global digital banking portals.
  claimRefs:
  - CE001
  - CE002
  - CE004
  - CE005
  tableRefs:
  - TE001
- id: workflow-use-cases-and-inter-bank-defense
  title: Critical Workflows, Scam Defense, and Cross-Bank Intelligence
  body: The emergence of instant payment networks and sophisticated social engineering schemes has created a critical need for fraud detection that identifies authorized fraud, where accountholders are manipulated into transferring funds voluntarily. BioCatch addresses this challenge by analyzing cognitive hesitation and subtle behavioral anomalies that manifest when a victim executes transactions under external cybercriminal coaching. When a high-risk scam pattern is identified, the platform triggers automated policy actions such as real-time warning prompts, delayed transaction processing, or fraud analyst escalation before irrevocable fund disbursement occurs. Furthermore, BioCatch operates an inter-bank collaborative intelligence network linking over 350 financial institutions. This network bridges the historical visibility gap between sending and receiving institutions, sharing real-time risk indicators regarding recipient account reputation to intercept mule transactions across banking
    boundaries.
  claimRefs:
  - CE002
  - CE003
  - CE006
  - CE007
  tableRefs:
  - TE002
- id: integration-scalability-and-technical-risks
  title: Integration Scalability, Visa Synergies, and Technical Limitations
  body: From a deployment perspective, BioCatch Connect integrates into existing bank architectures via RESTful APIs, event-driven webhooks, and client-side SDKs, operating at massive global scale with over 19 billion sessions evaluated monthly across 760 million users and 1.8 billion devices. The announced .4 billion acquisition by Visa in August 2026 provides significant technological and distribution synergies, connecting BioCatch upstream behavioral intelligence with Visa global payments network and cyber risk tooling. However, the architecture carries notable technical limitations and diligence considerations. BioCatch does not natively provide document-based identity verification or comprehensive AML transaction monitoring, requiring integration with complementary risk vendors. Additionally, maintaining lightweight client SDKs across evolving iOS and Android operating system permissions demands continuous engineering updates, while behavioral scoring requires ongoing threshold tuning
    to prevent false-positive customer disruptions.
  claimRefs:
  - CE008
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
callouts:
- calloutType: insight
  title: Shift from Static Biometrics to Continuous Behavioral Intent
  body: Traditional biometric systems evaluate physical identity at discrete authentication checkpoints, whereas BioCatch analyzes cognitive intent continuously throughout active sessions. By parsing 3,000-plus telemetry points in real time, the platform identifies manipulation and behavioral coercion even when valid credentials are authenticated.
  claimRefs:
  - CE001
  - CE003
  - CE004
- calloutType: risk
  title: Client-Side SDK Maintenance and Mobile OS Constraints
  body: Continuous capture of fine-grained sensor and gesture telemetry requires ongoing client-side SDK maintenance across rapid mobile operating system releases, creating integration overhead and requiring vigilance regarding background execution limits and global biometric privacy regulations.
  claimRefs:
  - CE008
  - CE010
  - CE013
