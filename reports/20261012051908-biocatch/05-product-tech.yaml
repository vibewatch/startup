- id: TE002
  title: Workflow / use-case table
  columns:
  - Fraud Prevention Use Case
  - Traditional Banking Workflow
  - BioCatch Behavioral Solution
  - Measurable Operational Benefit
  - Technical Limitation & Boundary
  rows:
  - - Account Takeover at Login
    - Static SMS OTP or push notification MFA
    - Continuous behavioral biometrics assessing user intent and familiarity
    - Reduces customer friction while intercepting automated bot logins and credential stuffing
    - Limited initial accuracy for entirely new unprofiled devices without historical baseline
  - - Authorized Push Payment Scams
    - Post-transaction dispute logging and manual recall
    - Real-time detection of coercion, hesitation, and remote access guidance during payment
    - Intercepts authorized push payment fraud and voice scams before funds exit the institution
    - Cannot prevent off-platform out-of-band social engineering that does not touch banking UI
  - - Mule Account Cash-Out
    - Periodic retrospective AML transaction batch rules
    - Predictive identification of dormant or active mule accounts during transfer origination
    - Enables proactive account freezing and mitigation of regulatory reporting penalties
    - Requires consortium intelligence-sharing participation to identify inter-bank destination risk
  - - Onboarding & Synthetic Identity
    - Static database credit checks and document upload
    - Interaction dynamics analysis during application form completion and paste monitoring
    - Detects automated form filling, copy-pasted data, and stolen identity manipulation
    - Does not verify physical identity documents or government registry biometric records
  notes: Based on BioCatch customer documentation, vendor white papers, and industry comparative fraud lifecycle analysis.
  claimRefs:
  - CE002
  - CE003
  - CE006
  - CE007
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Architecture Layer
  - Core Technical Role
  - Operational Dependency
  - Technical & Security Risk
  rows:
  - - Client Telemetry Layer
    - Captures passive interaction metrics via native mobile SDKs and web JavaScript
    - Client banking application runtime and mobile operating system sensor APIs
    - Operating system permission shifts and mobile battery or performance constraints
  - - Behavioral Feature Extraction
    - Normalizes 3,000+ raw sensor signals into structured behavioral micro-features
    - Low-latency edge and cloud data processing pipelines
    - Data pipeline throughput bottlenecks during sudden peak transaction spikes
  - - Machine Learning Scoring
    - Executes real-time inference models distinguishing genuine users from criminal actors
    - Continuously updated behavioral baselines and model training pipelines
    - Model drift and false-positive spikes following major mobile application UI redesigns
  - - Inter-Bank Intelligence Graph
    - Aggregates anonymized cross-institutional risk signals regarding mule accounts
    - Network participation and consortium data governance agreements across banks
    - Cross-border data transfer limitations and regional banking regulatory scrutiny
  notes: Architecture details synthesized from BioCatch technical disclosures, patent filings, and engineering documentation.
