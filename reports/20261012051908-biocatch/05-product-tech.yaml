figures:
- id: FE001
  title: BioCatch Connect Platform Architecture Stack
  type: stack
  summary: Six-layer behavioral intelligence architecture spanning client telemetry capture, device integrity inspection, feature extraction, real-time ML inference, cross-bank intelligence sharing, and enterprise orchestration.
  approximationNotes: Stack represents functional layers of BioCatch Connect as detailed in technical publications and vendor disclosures.
  data:
    layers:
    - label: Client-Side Telemetry Collection
      detail: Mobile SDK and web JavaScript sensors capturing touch, keystroke, mouse, and orientation dynamics
      modules:
      - Keystroke cadence & velocity sensors
      - Touchscreen pressure & swipe angle tracking
      - Gyroscopic orientation & accelerometer telemetry
    - label: Device & Environmental Integrity Inspection
      detail: Real-time evaluation of device spoofing, root/jailbreak status, emulators, proxy usage, and bot automation
      modules:
      - Root and jailbreak detection hooks
      - Emulator and virtual machine screening
      - Proxy, VPN, and network anomaly evaluation
    - label: Behavioral Feature Extraction & Micro-Telemetry
      detail: Processing of 3,000+ behavioral parameters including cognitive hesitation, segmented swiping, and paste activity
      modules:
      - Cognitive hesitation measurement
      - Segmented touch trajectory analysis
      - Automated form filling and paste monitoring
    - label: Real-Time Machine Learning Inference Engine
      detail: Continuous neural and statistical scoring distinguishing legitimate accountholders from unauthorized fraudsters or coerced users
      modules:
      - Continuous session baseline matching
      - Coercion and social engineering classifiers
      - Anomaly scoring across active milliseconds
    - label: Cross-Bank Collaborative Intelligence Network
      detail: Inter-bank intelligence sharing mapping mule account behavior and scam recipient accounts across 350+ institutions
      modules:
      - Global mule account reputation graph
      - Cross-institutional inbound risk queries
      - Consortium pattern aggregation across 350+ banks
    - label: Enterprise Decisioning & Workflow Orchestration
      detail: Low-latency risk scoring, policy step-up hooks, fraud analyst consoles, and transaction approval integrations
      modules:
      - Real-time REST API risk decisioning
      - Step-up authentication policy triggers
      - Analyst case management and audit trails
