callouts:
  - calloutType: insight
    title: Upstream Session Intervention vs. Downstream Transaction Settlement
    body: Traditional fraud defense tools operate primarily at transaction execution or post-settlement chargeback adjudication, where money has already left customer accounts. Behavioral intelligence shifts fraud prevention upstream to session origination and account-level interactions, evaluating cognitive intent before payment authorization and mitigating irreversible authorized push payment scam losses.
    claimRefs:
      - CM004
      - CM010
  - calloutType: risk
    title: Regulatory Privacy Scrutiny on Device and Behavioral Telemetry
    body: While BioCatch uses pseudonymized telemetry and collects no direct names or government identification numbers, behavioral profiling and persistent device tracking face heightened regulatory review under European and U.S. data protection regimes. Financial institutions require clear data protection impact assessments to verify compliance across cross-border banking jurisdictions.
    claimRefs:
      - CM012
      - CM013
