      - number: '4.3'
        title: 成本结构、毛利率动态与单位经济
        blocks:
          - type: paragraph
            body: >-
              BioCatch 受益于云端机器学习架构的运营可扩展性：新增会话接入只带来相对有限的边际基础设施支出。核心遥测处理、设备特征提取和行为风险评分通过高吞吐、低延迟 API
              运行，随着现有银行部署的会话密度上升，单位计算成本会下降。不过，精确毛利率、公共云托管支出和实施成本仍是严格保密的私有数据。运营压力主要来自界面变化：消费者银行交互转向对话式 AI
              代理和自动化界面后，传统的打字、滚动模式可能失效，公司需要增加研发投入，构建多信号设备智能。北美和欧洲不断收紧的数据隐私法规与同意框架，也会持续增加跨境行为遥测采集的合规负担。
            claimRefs:
