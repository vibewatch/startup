      - number: '4.4'
        title: ， M&A， 及
        blocks:
          - type: paragraph
            body: >-
              在转为私募股权所有制之前，BioCatch 已从金融赞助方和战略银行投资者处累计筹得超过 $200m 的风险资本和成长股权。2024 年 5 月，Permira 以 $1.3b 的交易估值收购 BioCatch
              多数控制权。在赞助方支持下，公司具备足够的运营自立性和资本充足性，无需通过中间融资稀释股权。2026 年 8 月，全球支付网络 Visa 宣布与 Permira 及其他股东达成最终协议，以现金 $2.4b 收购
              BioCatch，对应约 13x 预期 ARR 的隐含估值倍数。交易计划在 Visa 2027 财年第二季度末前完成，但仍需通过惯常监管审批。从投资判断看，BioCatch
              的企业市场定位和已验证收入规模都很突出，但由于完全缺少经审计毛利率、现金消耗、客户流失和 NRR 披露，独立财务评估仍受限。
