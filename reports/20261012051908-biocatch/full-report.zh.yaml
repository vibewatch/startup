      - number: '4.2'
        title: 市场进入模型、伙伴渠道与销售速度
        blocks:
          - type: paragraph
            body: >-
              商业分销依靠直接企业销售团队，目标是全球系统重要性银行，同时由不断扩大的技术和集成伙伴生态补充。一级金融机构的直接销售周期通常为 6 至 12
              个月，因为客户要完成风险、信息安全和监管合规评估。为加快进入中型机构和区域银行，BioCatch 将行为遥测接入核心银行平台和编排服务商，并与 Q2、Alloy 合作。这个间接伙伴渠道增长很快：截至 2025
              年第二季度，ARR 已超过 $10m，同比增长超过 71%。规模优势进一步强化了这一进入市场引擎：平台每月接入 19b 个数字银行会话，在 1.8b 台设备上监测超过 760m
              名用户，形成显著的数据网络效应，提升所有参与机构的风险评分准确度。
            claimRefs:
              - CI001
              - CI004
              - CI010
              - CI012
