  - id: FE001
    title: BioCatch Connect 平台架构技术栈
    type: stack
    summary: 六层行为智能架构，覆盖客户端遥测采集、设备完整性检查、特征提取、实时 ML 推理、跨银行情报共享和企业编排。
    approximationNotes: 该技术栈代表技术出版物和供应商披露中详述的 BioCatch Connect 功能层。
    data:
      layers:
        - label: 客户端遥测采集
          detail: 移动 SDK 和 Web JavaScript 传感器捕获触控、击键、鼠标和方向动态
          modules:
            - 击键节奏与速度传感器
            - 触屏压力与滑动角度跟踪
            - 陀螺仪方向与加速度计遥测
        - label: 设备与环境完整性检查
          detail: 实时评估设备欺骗、root / 越狱状态、模拟器、代理使用和机器人自动化
          modules:
            - Root 与越狱检测钩子
            - 模拟器与虚拟机筛查
            - 代理、VPN 和网络异常评估
        - label: 行为特征提取与微遥测
          detail: 处理 3,000+ 个行为参数，包括认知犹豫、分段滑动和粘贴活动
          modules:
            - 认知犹豫测量
            - 分段触控轨迹分析
            - 自动填表和粘贴监测
        - label: 实时机器学习推理引擎
          detail: 持续进行神经网络与统计评分，区分合法账户持有人、未经授权的欺诈者和受胁迫用户
          modules:
            - 持续会话基线匹配
            - 胁迫与社会工程分类器
            - 对活跃毫秒进行异常评分
        - label: 跨银行协作情报网络
          detail: 在 350+ 家机构间共享银行情报，绘制骡账户行为和诈骗收款账户图谱
          modules:
            - 全球骡账户信誉图谱
            - 跨机构入站风险查询
            - 350+ 家银行的联盟模式聚合
        - label: 企业决策与工作流编排
          detail: 低延迟风险评分、策略升级验证钩子、欺诈分析师控制台和交易审批集成
          modules:
            - 实时 REST API 风险决策
            - 升级身份验证策略触发器
            - 分析师案件管理和审计轨迹
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE009
  - id: FU001
    title: 客户旅程图：银行欺诈防范与扩张循环
    type: journey-map
    summary: 展示金融机构从试点集成、多信号生产部署到联盟遥测共享的完整生命周期。
    claimRefs:
      - CU008
      - CU014
    data:
      items:
        - stage: 发现与评估
          label: 风险评估
          description: 银行欺诈策略团队将不断上升的诈骗和 ATO 损失与现有规则引擎进行比较评估。
          touchpoints:
            - 关于授权推送支付诈骗的高管简报
            - 基于历史欺诈遥测进行概念验证建模
        - stage: 试点集成
          label: 沙盒遥测
          description: 机构以影子模式将 BioCatch SDK 和 API 集成进高风险数字银行流程。
          touchpoints:
            - 在不打扰用户的情况下被动采集行为遥测数据
            - 以生产环境欺诈数据为基准，评估初始误报率
        - stage: 初始生产
          label: 定向流程防护
          description: 面向高风险交易授权和数字开户的生产环境实时部署。
          touchpoints:
            - 实时评估大额资金流动的风险
            - 立即拦截冒充和社交工程胁迫
        - stage: 全面部署
          label: 全渠道覆盖
          description: 扩展到零售和商业数字银行的全部移动端与 Web 会话。
          touchpoints:
            - 持续监控原生移动应用和 Web 门户中的会话
            - 接入核心 AML 系统和企业级欺诈案件管理系统
        - stage: 多模块扩展
          label: 跨产品扩展
          description: 引入人头账户检测、诈骗情报和设备情报模块。
          touchpoints:
            - 检测开户欺诈，阻止创建合成身份
            - 识别流入和流出资金的人头账户
        - stage: 网络联盟
          label: 跨银行情报
          description: 参与同业金融机构之间的实时情报共享网络。
          touchpoints:
            - 在同业银行之间共享欺诈情报，追踪跨机构人头账户团伙
            - 协同检测新出现的生成式 AI 诈骗活动
