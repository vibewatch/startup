  - id: TV001
    title: BioCatch 建议与投资总结
    columns:
      - 维度
      - 评估
      - 证据 / 指标依据
      - 决策含义
    rows:
      - - 建议
        - 持有 / 跟踪（并购套利）
        - Visa 已同意以 $2.4B 现金收购；预计 2027 财年第二季度交割
        - 维持敞口以获取交易对价；评估监管交割风险，而非押注创业公司增长上行空间
      - - 信心
        - 中等-高
        - Visa、Permira 和 BioCatch 已宣布最终合并协议，条款已披露
        - 交易对价确定性高，但私有审计财务明细和交割契约仍属保密
      - - 风险评级
        - 中等
        - 规模化银行客户基础（350+ 家机构）部分抵消了反垄断审查和 CIAM 集成复杂性
        - 跟踪国际反垄断审查进展、客户留存契约和关键高管留任
      - - 估值判断
        - 估值充分 / 溢价退出
        - $2.4B 收购价对应 2025 年 ARR（$185M）的约 13.0 倍，较 2024 年 Permira 标记价值（$1.3B）上升 85%
        - 估值已充分反映战略并购溢价；最终现金交易价格限制了独立经营倍数扩张
    notes: 建议与估值指标基于 Visa 于 2026 年 8 月宣布的 $2.4B 现金最终收购；ARR 倍数由报告的 2025 年 $185M ARR 推导。
