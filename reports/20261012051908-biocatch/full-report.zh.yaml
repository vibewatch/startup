  - id: FV001
    title: BioCatch 估值与投资建议逻辑链
    type: flow
    summary: 这条分析链依次将企业银行业务规模、确定的并购条款、估值倍数和技术风险连接到最终投资立场。
    data:
      nodes:
        - id: scale
          label: 企业银行业务规模
          detail: 2025 年拥有 350+ 家银行客户、760M 名用户和 $185M ARR，确立了市场领先地位
        - id: ma-agreement
          label: Visa 并购协议
          detail: Visa 于 2026 年 8 月宣布以全现金方式从 Permira 和股东手中收购，交易金额为 $2.4B
        - id: valuation-multiple
          label: 估值倍数（13.0x ARR）
          detail: 13.0x ARR 的溢价倍数反映了战略方抢先进入市场的需求，以及稀缺的行为数据资产
        - id: risks
          label: 整合与技术风险
          detail: 交割条件持续到 2027 年第二季度，且面临 CIAM 整合障碍和 AI 机器人规避挑战
        - id: scenarios
          label: 情景权重
          detail: 基准情景 55%（以 $2.4B 完成交割）、乐观情景 30%（协同效应带来 $2.8B+）、悲观情景 15%（独立运营价值 $1.3B-$1.6B）
        - id: recommendation
          label: 投资建议：跟踪 / 持有
          detail: 维持跟踪立场，重点关注并购交割套利和监管审批里程碑
      edges:
        - source: scale
          target: ma-agreement
        - source: ma-agreement
          target: valuation-multiple
        - source: valuation-multiple
          target: scenarios
        - source: risks
          target: scenarios
        - source: scenarios
          target: recommendation
    approximationNotes: 估值倍数根据 $2.4B 交易价值和报告披露的 2025 年 $185M ARR 计算。
