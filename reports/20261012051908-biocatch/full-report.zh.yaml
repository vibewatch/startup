        - 收购被阻止或放弃；估值压缩至 7.0–8.5 倍 ARR，与独立网络安全公司的倍数一致
        - 交易终止、高管离任，以及客户流失至捆绑式支付网络欺诈套件
    notes: 基准情景反映已签署的最终协议条款；若交易终止，悲观情景采用 2024 年 Permira 历史交易倍数（约 7.0 倍 ARR）。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV009
