companyProfile:
  summary: >-
    BioCatch 是一家创立于特拉维夫的行为生物识别与欺诈情报厂商，依靠持续遥测、设备智能和诈骗检测流程保护大型金融机构的数字银行会话。公司已从早期的账户接管防护专家，扩展为服务超过 350
    家银行和金融机构的行为反欺诈平台；2026 年 8 月，Visa 同意以现金 $2.4b 收购 BioCatch。公开证据支持其成为一家已有明确产品市场牵引力、由赞助方支持的后期私营公司，但私有经营数据和部分治理细节仍不透明。
