            body: >-
              BioCatch 采用面向商业银行的 B2B SaaS 模式，向机构交付行为生物识别风险情报。公司通过 Connect
              欺诈情报平台的年度软件订阅合同获得经常性收入，定价主要围绕用户会话接入量、受保护的活跃数字银行账户数和分层交易阈值展开。过去三年，公司已从核心账户接管防护扩展到更高价值的专项欺诈检测模块，尤其是针对授权推送支付诈骗的
              Scams360 和网络级骡子账户检测。行业研究显示，这些专项模块占 ARR 的比例已从两年前的 5% 上升到 2025 年年中的约 15%。Sacra 的第三方分析追踪估计 BioCatch 在 2025 年
              6 月达到 $160m ARR；2026 年初的行业披露则称 2025 全年 ARR 达到 $185m。商业关系覆盖全球超过 350 家金融机构，包括 Barclays、HSBC、American Express
              和 National Australia Bank 等一级机构。
