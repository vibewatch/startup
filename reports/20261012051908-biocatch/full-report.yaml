  - id: TV002
    title: BioCatch Investment Thesis and Anti-Thesis Register
    columns:
      - Core Pillar
      - Thesis Argument
      - Anti-Thesis Counter-Argument
      - Monitoring Trigger / Diligence Test
    rows:
      - - Market Dominance & Scale
        - BioCatch protects 760M users and 1.8B devices across 350+ banks, including 3 of the top 4 US banks
        - Behavioral biometrics as a standalone product category is commoditizing into larger CIAM and fraud platforms
        - Track client retention rates during Visa transition and verify enterprise expansion across top 20 accounts
      - - Technical Differentiation
        - Continuous telemetry (keystroke, touch, mouse) detects scams and account takeover before payments execute
        - >-
          AI automation, bots, and robotic process automation can mimic human cadence; motor variations cause false
          positives
        - Audit false positive transaction decline rates and test resistance against generative AI agent spoofing tools
      - - Strategic M&A Realization
        - Visa acquisition at $2.4B cash provides full liquidity and distribution across Visa Protect network
        - >-
          Transaction faces extended antitrust scrutiny through Q2 2027; failure to close leaves BioCatch as an isolated
          pure-play
        - Monitor regulatory filings across US DOJ, UK CMA, and EU regulators, tracking closing covenant compliance
      - - Financial Performance
        - Reported $185M ARR in 2025 demonstrates strong bank fraud budget capture and commercial scale
        - Implied 13.0x ARR multiple leaves no margin of safety if ARR growth decelerates or contract durations shorten
        - Inspect audited NRR, gross margin schedules, and revenue concentration across tier-one banking partners
