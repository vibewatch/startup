      - number: '6.4'
        title: Customer Journey, Retention Durability, and Concentration Dynamics
        blocks:
          - type: paragraph
            body: >-
              BioCatch customer adoption typically follows an expansion loop that begins with targeted proof-of-concept
              deployments on high-risk transaction flows and expands across enterprise mobile, web, and API channels.
              Over time, enterprise accounts add specialized capabilities such as mule account detection and device
              intelligence. However, key diligence risks persist regarding contract durability and commercial disclosure
              opacity. BioCatch does not publicly disclose audited net revenue retention rates, annual gross customer
              churn, average contract length, or top-customer revenue concentration. Furthermore, broader industry scam
              losses and mule activity continue to escalate globally, suggesting that while behavioral biometrics
              mitigates direct account compromise, systemic financial crime remains an aggressive challenge for
              financial institution customers.
            claimRefs:
