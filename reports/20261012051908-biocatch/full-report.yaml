chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Behavioral Intelligence
        blocks:
          - type: paragraph
            body: >-
              BioCatch was founded in 2011 by Avi Turgeman, Benny Rosenbaum, and Uri Rivner to address emergent digital
              banking vulnerabilities through behavioral biometrics rather than static authentication credentials.
              Drawing from military intelligence and vulnerability research, the founders developed foundational
              intellectual property recognizing that human interactions with digital interfaces exhibit measurable,
              individual-specific physical and cognitive signatures. The company operates dual principal executive
              headquarters in Tel Aviv, Israel, and New York City, supported by international operational offices across
              London, São Paulo, Mexico City, Sydney, Mumbai, and Singapore. Under the operational leadership of Chief
              Executive Officer Gadi Mazor, BioCatch has scaled its behavioral platform to inspect user intent and
              detect coercion across thousands of digital interaction variables.
            claimRefs:
              - CO001
              - CO002
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO009
          - type: figure
            figureRef: FO001
            claimRefs:
