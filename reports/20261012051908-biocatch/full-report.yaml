              - CO005
              - CO006
              - CO012
              - CO014
      - number: '1.2'
        title: Commercial Traction, Platform Telemetry, and Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              BioCatch Connect operates as a centralized fraud and financial crime detection platform deployed across
              more than 350 retail banks and financial institutions worldwide, including over 100 of the world's largest
              banks and three of the four largest U.S. commercial banks by assets. The system analyzes behavioral
              telemetry across 1.8 billion devices and 760 million consumer profiles globally, processing 18 to 19
              billion sessions each month. BioCatch reported exceeding $185 million in annual recurring revenue (ARR)
              during 2025, continuing an upward trajectory from $100 million ARR in late 2023. Headcount is estimated
              between 400 and 526 professionals across global delivery centers, though recent workforce indicators
              indicate flat hiring velocity. Audited financial statements, gross margin metrics, cash burn, and GAAP net
              profitability remain confidential private data.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
