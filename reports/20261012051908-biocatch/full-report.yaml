      - number: '4.2'
        title: Go-to-Market Model, Partner Channels, and Sales Velocity
        blocks:
          - type: paragraph
            body: >-
              The commercial distribution model relies on direct enterprise sales teams targeting global systemically
              important banks, augmented by an expanding ecosystem of technology and integration partners. Direct sales
              cycles for Tier-1 financial institutions typically span six to twelve months due to extensive risk,
              information security, and regulatory compliance evaluations. To accelerate market penetration into
              mid-market institutions and regional banks, BioCatch integrated its behavioral telemetry into core banking
              platforms and orchestration providers, including partnerships with Q2 and Alloy. This indirect partner
              channel demonstrated rapid momentum, generating over $10 million in ARR by the second quarter of 2025 with
              year-over-year revenue expansion exceeding 71%. Scale advantages reinforce this go-to-market engine: the
              platform ingests 19 billion monthly digital banking sessions and monitors over 760 million users across
              1.8 billion devices, creating substantial data network effects that improve risk scoring accuracy for all
              participating institutions.
            claimRefs:
              - CI001
              - CI004
              - CI010
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI010
              - CI012
      - number: '4.3'
        title: Cost Structure, Gross Margin Dynamics, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              BioCatch benefits from the operational scalability inherent in cloud-based machine learning architectures,
              where incremental session ingestion incurs relatively modest marginal infrastructure expenditure. Because
              core telemetry processing, device feature extraction, and behavioral risk scoring run via high-throughput
              low-latency APIs, unit computing costs decline as aggregate session density expands across existing bank
              deployments. However, precise gross margin percentages, hosting expenditure with public cloud providers,
              and implementation costs remain closely guarded private data. Operational headwinds center on interface
              evolution: as consumer banking interactions migrate toward conversational AI agents and automated
              interfaces, traditional physical typing and scrolling patterns may degrade, necessitating increased
              research and development investment in multi-signal device intelligence. Furthermore, tightening global
              data privacy regulations and consent frameworks across North America and Europe impose ongoing compliance
              overhead on cross-border behavioral telemetry collection.
            claimRefs:
              - CI001
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI012
              - CI014
      - number: '4.4'
        title: Capital Adequacy, M&A Exit Liquidity, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Prior to its transition to private equity ownership, BioCatch raised more than $200 million in cumulative
              venture capital and growth equity from financial sponsors and strategic banking investors. In May 2024,
              private equity firm Permira acquired majority control of BioCatch in a transaction valuing the business at
              $1.3 billion. Operating under sponsor backing, the company demonstrated sufficient operational
              self-sufficiency and capital adequacy to avoid dilutive interim financings. In August 2026, global
              payments network Visa announced a definitive agreement to acquire BioCatch from Permira and other
              shareholders for $2.4 billion in cash, representing an implied valuation multiple of approximately 13x
              forward ARR. The transaction is slated to close by the end of Visa's fiscal second quarter of 2027,
              subject to customary regulatory clearances. From an underwriting standpoint, while BioCatch demonstrates
              exceptional enterprise market positioning and verified top-line scale, independent financial underwriting
              remains constrained by the complete absence of audited gross margins, cash burn rates, customer churn
              figures, and net revenue retention disclosures.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sponsor Transition and Valuation Realization Under Visa
            body: >-
              The trajectory from Permira's $1.3 billion majority buyout in May 2024 to Visa's $2.4 billion definitive
              cash purchase in August 2026 represents an 85% step-up in headline enterprise valuation over a 27-month
              hold period, reflecting premium strategic value assigned to multi-signal fraud telemetry at the network
              level.
            calloutType: insight
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: callout
            title: Interface Shifts and Behavioral Telemetry Degradation Risks
            body: >-
              As banking platforms adopt agentic AI assistants and voice-first interaction layers, traditional
              micro-behavioral signals like keystroke dynamics and mouse trajectories risk signal attenuation, requiring
              ongoing R&D reallocation into network and device-level telemetry.
            calloutType: risk
            claimRefs:
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Client-Side Telemetry Collection
        blocks:
          - type: paragraph
            body: >-
              BioCatch Connect operates as an enterprise-grade digital fraud intelligence platform designed to protect
              financial institutions throughout the consumer banking lifecycle. Rather than relying solely on static
              point-in-time identity verification or traditional network credentials, the platform captures passive,
              continuous telemetry through lightweight mobile SDKs and web JavaScript sensors. As users interact with
              banking applications, BioCatch monitors more than 3,000 distinct behavioral parameters in real time
              without imposing active friction on legitimate customers. These micro-behaviors encompass fine-grained
              physical interactions such as keystroke cadence, typing velocity, touchscreen swipe pressure, touch
              angles, gyroscopic orientation, mouse acceleration, cursor hesitation, and clipboard paste actions. By
              synthesizing these micro-interactions into dynamic behavioral profiles, the platform continuously
              re-establishes session trust throughout every active millisecond, effectively distinguishing genuine human
              accountholders from automated bot scripts, cybercriminals, and manipulated users.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE009
