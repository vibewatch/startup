      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Workflows
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement of behavioral intelligence is concentrated within regulated banking institutions,
              where budget ownership sits across fraud strategy, digital channels, and executive risk management. At
              global tier-one megabanks, the primary economic buyer is typically the Head of Fraud Strategy or Chief
              Risk Officer, who allocates budget to mitigate direct fraud reimbursement liabilities. These institutions
              integrate BioCatch Connect directly into centralized risk decisioning engines via real-time APIs,
              processing billions of monthly sessions to detect anomalous behavior without introducing manual customer
              friction. In regional banks and digital neobanks, procurement is often shared between retail digital
              banking executives and CISOs seeking to prevent automated bot account openings. The critical adoption
              trigger across all segments is the surge in authorized push payment scams, where customers are socially
              engineered into initiating payments themselves, making downstream transaction monitoring ineffective and
              elevating continuous behavioral profiling to a mandatory control.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Market Growth Drivers, Technology Enablers, and Regulatory Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of behavioral intelligence is accelerating under the twin pressures of generative AI-enabled
              cybercrime and payment rail modernization. The widespread availability of automated scam toolkits,
              deepfake audio injection, and agentic browsers allows attackers to mimic legitimate user interaction and
              overwhelm legacy rule-based defenses. Furthermore, global payment networks are shifting strategic priority
              upstream toward session defense as real-time account-to-account payment systems reduce reliance on
              card-based chargeback mechanisms. However, adoption faces meaningful operational and regulatory
              constraints. Integrating complex behavioral and device SDKs into consumer banking applications requires
              extensive testing, security review, and cross-departmental coordination. In addition, institutions must
              navigate evolving biometric data protection regulations, ensuring that continuous user telemetry remains
              pseudonymized and compliant with privacy standards across North American, European, and Asia-Pacific
              jurisdictions.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Upstream Session Intervention vs. Downstream Transaction Settlement
            body: >-
              Traditional fraud defense tools operate primarily at transaction execution or post-settlement chargeback
              adjudication, where money has already left customer accounts. Behavioral intelligence shifts fraud
              prevention upstream to session origination and account-level interactions, evaluating cognitive intent
              before payment authorization and mitigating irreversible authorized push payment scam losses.
            calloutType: insight
            claimRefs:
              - CM004
              - CM010
          - type: callout
            title: Regulatory Privacy Scrutiny on Device and Behavioral Telemetry
            body: >-
              While BioCatch uses pseudonymized telemetry and collects no direct names or government identification
              numbers, behavioral profiling and persistent device tracking face heightened regulatory review under
              European and U.S. data protection regimes. Financial institutions require clear data protection impact
              assessments to verify compliance across cross-border banking jurisdictions.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding BioCatch spans specialized risk platforms, card-network security
              units, identity-orchestration platforms, and internal bank defenses. In digital banking session security,
              direct competition centers on vendors capable of analyzing real-time user intent, keystroke cadence, and
              touchscreen dynamics without introducing transaction friction. BioCatch distinguishes its offering through
              deep telemetry capturing over 3,000 anonymized session parameters, which traditional
              transaction-monitoring engines and point-in-time identity verification tools cannot replicate directly.
              Concurrently, major card networks have absorbed pure-play behavioral and machine-learning anti-fraud
              providers, most visibly marked by Mastercard's acquisition of NuData and Visa's acquisition of
              Featurespace alongside its pending purchase of BioCatch. Meanwhile, comprehensive identity platforms such
              as Socure and Alloy serve as adjacent orchestrators, sometimes embedding behavioral capabilities while
              offering complementary onboarding KYC and AML workflows. Internal build options among Tier-1 global
              institutions remain limited to rules engines and static machine learning models, as continuous client-side
              behavioral profiling demands extensive continuous training data and specialized mobile and web telemetry
              infrastructure.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Competitor Profiles and Alternatives
        blocks:
          - type: paragraph
            body: >-
              Enterprise buyers evaluating alternatives to BioCatch encounter distinct architectural paradigms across
              the fraud and AML spectrum. Specialized platforms such as Feedzai market holistic RiskOps suites that
              unite transaction monitoring, behavioral biometrics, and financial crime casework, offering an all-in-one
              footprint for retail banks. In contrast, Featurespace, operating as a Visa unit following its late-2024
              acquisition, focuses on transaction scoring and payment authorization via its ARIC platform, complementing
              rather than directly substituting client-side session telemetry. Sardine targets faster payment rails,
              fintechs, and instant settlement flows, pairing device signals with transaction monitoring and AI-driven
              alert review. Identity-first alternatives including Socure and Alloy dominate account-opening risk, KYC,
              and document verification, frequently coexisting with BioCatch by ingesting its session scores into their
              decisioning orchestration layers rather than attempting to displace in-session behavioral monitoring.
              Incumbent transaction-monitoring providers and rules engines lack continuous session visibility, leaving
              them vulnerable to authorized push payment scams where the genuine customer executes the wire or transfer.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Differentiation and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              BioCatch's differentiation durability rests on two primary structural moats: its client-side telemetry
              depth and the emerging network effects of cross-institutional intelligence sharing. By deploying native
              SDKs (notably the Align SDK) and web scripts directly within bank digital properties, BioCatch
              continuously collects more than 3,000 anonymized behavioral and device signals per session, creating
              significant switching costs for banking IT teams that face arduous compliance and security validation
              cycles when altering client-side code. Furthermore, through initiatives such as BioCatch Trust in
              Australia and Argentina, participating institutions share real-time risk intelligence on receiving
              accounts prior to funds execution, constructing an inter-bank data moat that standalone software vendors
              cannot match without cross-institutional buy-in. However, commoditization risks and structural constraints
              persist. Point-solution behavioral biometrics features are increasingly embedded into broader
              fraud-orchestration hubs, and BioCatch Trust remains unavailable in major markets like the United States
              due to regulatory and inter-bank coordination hurdles. Additionally, the impending completion of Visa's
              $2.4 billion acquisition introduces counterparty considerations for institutions reliant on rival payment
              rails.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP010
              - CP011
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Card-Network Consolidation Reshapes Competitive Boundaries
            body: >-
              With Visa acquiring Featurespace and BioCatch, and Mastercard having acquired NuData, behavioral fraud
              defense is transitioning from independent venture-backed tooling to core payment-network infrastructure.
              This shift drives scale advantages while raising multi-homing questions for rival payment networks.
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP008
          - type: callout
            title: Geographic Asymmetry in Inter-Bank Network Defense
            body: >-
              While BioCatch Trust demonstrates high efficacy against authorized push payment scams across consortia in
              Australia and Argentina, its absence in the US leaves domestic deployments reliant on single-institution
              behavioral telemetry without destination-account intelligence.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture, Contract Structure, and Pricing Mechanics
        blocks:
          - type: paragraph
            body: >-
              BioCatch operates a business-to-business enterprise software-as-a-service model delivering behavioral
              biometric risk intelligence to commercial banking institutions. The company generates recurring revenue
              through annual software subscription contracts that license its Connect fraud intelligence platform.
              Commercial monetization is primarily structured around user session ingestion volume, active protected
              digital banking accounts, and tiered transaction thresholds. Over the past three years, BioCatch expanded
              its commercial footprint from core account takeover prevention to higher-value specialized fraud detection
              modules, notably Scams360 for authorized push payment fraud and network-level money mule account
              detection. Industry research indicates these specialized detection modules grew from 5% of annual
              recurring revenue two years ago to roughly 15% of ARR by mid-2025. Third-party analyst tracking from Sacra
              estimated that BioCatch achieved $160 million in ARR by June 2025, while trade disclosures in early 2026
              reported full-year 2025 ARR reaching $185 million. Commercial relationships span more than 350 financial
              institutions globally, including Tier-1 institutions such as Barclays, HSBC, American Express, and
              National Australia Bank.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
