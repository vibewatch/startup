              - CR008
              - CR010
              - CR013
              - CR014
      - number: '7.3'
        title: Partner Dependencies, Channel Concentration, and Commercial TCO
        blocks:
          - type: paragraph
            body: >
              BioCatch exhibits concentrated exposure across anchor banking clients, distribution partners, and
              infrastructure providers. The company's 350 financial institution clients include three of the top four
              commercial banks in the United States and over 100 major global institutions, generating the majority of
              its $185 million in 2025 annual recurring revenue. The loss or contractual renegotiation of a single
              tier-one institution represents material downside risk to revenue durability and network data density.
              From a distribution perspective, BioCatch leverages ecosystem integrations with digital banking providers
              such as Q2 and Alkami, as well as the Microsoft Azure Marketplace. However, custom enterprise deployments
              still demand extensive middleware integration with internal identity and access management and payment
              processing architectures. Commercially, BioCatch relies on bespoke pricing models without public SKU rate
              cards, exposing institutions to expanding recurring costs as protected session volumes scale. Under
              Permira's majority sponsorship, detailed EBITDA margins and unit economics have remained private,
              complicating external assessment of operational cash conversion resilience prior to the expected Visa
              transaction closing.
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
