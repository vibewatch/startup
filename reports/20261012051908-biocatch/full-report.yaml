  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: Antitrust Scrutiny and Biometric Privacy Governance'
        blocks:
          - type: paragraph
            body: >
              The announced $2.4 billion cash acquisition of BioCatch by Visa establishes critical strategic and
              antitrust exposure across major regulatory jurisdictions. Because the definitive agreement is subject to
              customary closing conditions and applicable regulatory approvals extending through Visa's fiscal second
              quarter of 2027, the firm faces a prolonged period of operational and competitive uncertainty. Antitrust
              enforcement authorities including the US Department of Justice, Federal Trade Commission, and UK
              Competition and Markets Authority are examining payment network integration of upstream fraud-detection
              telemetry. A primary risk factor identified in corporate disclosures is that shifts in the competitive and
              regulatory landscape, or delays in closing milestones, could impair transaction completion. Concurrently,
              BioCatch collects over 3,000 granular telemetry signals, including keystroke cadence, mouse velocity, and
              touch dynamics, to model user intent. While BioCatch processes data pseudonymously, evolving biometric
              privacy statutes such as Illinois BIPA and European GDPR present ongoing regulatory scrutiny regarding
              whether behavioral interaction patterns constitute biometric identifiers requiring explicit opt-in
              consent. Mandatory authorized push payment reimbursement mandates in the United Kingdom and Australia
              further raise customer scrutiny on vendor performance and indemnification boundaries.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 'Operational, Security, and Detection Limits: Adversarial Evasion and Telemetry Gaps'
        blocks:
          - type: paragraph
            body: >
              While behavioral biometrics provide passive continuous verification across digital banking sessions,
              modern cybercriminal tactics introduce distinct technical failure modes. Security analyses indicate that
              sophisticated adversaries increasingly deploy remote access tools such as TeamViewer and AnyDesk, combined
              with adversary-in-the-middle frameworks, to bypass endpoint behavioral baselines. In social engineering
              and authorized push payment fraud scenarios, the legitimate account holder performs the transaction under
              criminal coercion or remote guidance, generating genuine biometric signals that reduce automated detection
              efficacy unless supplemented by scam-specific cognitive hesitation profiling. Furthermore, procurement
              evaluations reveal substantial operational trade-offs for deploying institutions. BioCatch's machine
              learning models require continuous baseline calibration to prevent false positive alerts from disrupting
              legitimate user transactions. The operational burden of alert triage, exception management, and case
              investigations falls squarely on bank fraud operations personnel, creating significant hidden staffing
              overhead. BioCatch publishes no public uptime service level agreements, system status dashboards, or
              verified incident history, leaving enterprise risk committees dependent on proprietary assurances for
              mission-critical core banking availability.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
