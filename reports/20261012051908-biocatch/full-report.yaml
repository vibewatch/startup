      - number: '6.3'
        title: Named Customer Proof and Production Deployments
        blocks:
          - type: paragraph
            body: >-
              Publicly verified customer deployments validate BioCatch production efficacy across diverse international
              banking environments. In the United Kingdom, flagship institutions including HSBC, Barclays, and NatWest
              have deployed BioCatch across retail and commercial online channels, utilizing continuous session
              profiling to alert fraud response teams to coercive social engineering attacks. In Latin America, Brazil’s
              Itau Unibanco deployed BioCatch to mitigate prevalent regional malware and banking Trojans while avoiding
              digital channel disruption and reducing operational fraud handling expenses. Similarly, Australian digital
              bank 86 400 implemented behavioral biometrics to maintain a two-minute digital onboarding experience
              without compromising defense against identity theft. Multiple tier-one customer executives have also
              joined BioCatch’s Client Innovation Board, underscoring deep executive engagement and strategic
              co-development relationships.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
