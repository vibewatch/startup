      - number: '6.2'
        title: Adoption Trajectory and Global Scale
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of BioCatch illustrates rapid commercial expansion from niche biometric
              authentication toward an enterprise-scale fraud and financial crime platform. As of mid-2026, more than
              350 financial institutions across 21 countries deploy BioCatch solutions, up from 340 customers reported
              in 2025 disclosures and earlier milestones exceeding 100 million dollars in ARR. The platform monitors
              approximately 19 billion digital banking sessions each month, safeguarding more than 760 million end users
              across 1.8 billion unique devices. In the United States, BioCatch protects customers across three of the
              top four commercial banking institutions by assets. This extensive scale generates a powerful data network
              advantage: as the platform monitors billions of interactions, its machine learning models continuously
              refine behavioral baselines, strengthening real-time anomaly detection against sophisticated cyber
              threats.
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
