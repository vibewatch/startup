evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory-clearance-and-closing-terms
    missingEvidence: >-
      Antitrust filing disclosures, Department of Justice or European Commission merger notifications, and complete
      break-fee or closing covenant terms for Visa's proposed acquisition of BioCatch.
    whyItMatters: >-
      The $2.4 billion acquisition faces an extended closing timeline through fiscal Q2 2027; unexpected regulatory
      challenges or deal conditions could leave BioCatch in operational limbo or trigger restructuring.
    diligencePath: >-
      Review subsequent public merger filings by Visa Inc. (SEC Form 10-K/10-Q) and monitor international competition
      authority merger registries for formal review notices.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: private-company-financial-audits
    missingEvidence: >-
      Audited financial statements verifying GAAP revenue, gross margin percentages, cash operating expenses, net
      income/loss, and balance sheet cash reserves.
    whyItMatters: >-
      While BioCatch disclosed $185M ARR for 2025, underlying profitability, cash burn, and unit economics remain
      strictly private and unverified by independent auditors.
    diligencePath: >-
      Request confidential audited financials, auditor management letters, and monthly SaaS metric cohort packs under
      non-disclosure agreement during formal transaction diligence.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: comprehensive-cap-table-and-governance
    missingEvidence: >-
      Detailed capitalization table disclosing post-Series D and post-Permira ownership percentages, option pool
      allocation, liquidation preferences, and board representation.
    whyItMatters: >-
      Public sources identify key institutional backers like Permira, Bain Capital, and Sapphire Ventures, but precise
      waterfall mechanics and minority shareholder governance rights remain opaque.
    diligencePath: >-
      Inspect the Israeli Registrar of Companies (Rasham HaHavarot) share registry and obtain the company's amended
      articles of association and investor rights agreements.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: tam-isolation-and-sub-segment-spend
    missingEvidence: >-
      Independent market research isolating exact addressable annual enterprise software spend on behavioral biometrics
      from general fraud detection and identity verification.
    whyItMatters: >-
      Broad financial crime statistics group fraud management into general compliance, obscuring the precise budget
      ceiling available specifically for behavioral intelligence.
    diligencePath: >-
      Request segment-level software budget allocations and competitive displacement figures from lead bank CISOs during
      diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: minor
    topic: bank-procurement-cycle-timing
    missingEvidence: >-
      Audited cohort-level contract expansion timelines and multi-product uptake rates for BioCatch modules across
      mid-tier financial institutions.
    whyItMatters: >-
      Reveals whether expansion beyond initial account opening fraud into mule detection and device telemetry occurs on
      standard renewal cycles or requires separate procurement approvals.
    diligencePath: >-
      Review customer case study renewal timings and sales pipeline conversion stages directly in data room vendor
      materials.
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Audited pricing schedules, contractual minimum commitments, and volume discount tiers across enterprise fraud
      competitors.
    whyItMatters: >-
      Direct commercial comparisons rely on qualitative licensing structures because enterprise anti-fraud pricing is
      customized and confidential.
    diligencePath: Review vendor RFP bids and enterprise customer procurement contracts under non-disclosure agreements.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: trust-network-us
    missingEvidence: >-
      Regulatory filings or bank consortium timelines for launching an inter-bank fraud intelligence network like
      BioCatch Trust in the US.
    whyItMatters: >-
      The absence of inter-bank data sharing in the US constrains BioCatch's receiving-account visibility against
      domestic authorized push payment fraud.
    diligencePath: Interview bank consortium executives and evaluate Nacha and FedNow fraud-sharing initiatives.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: >-
      Audited financial statements detailing BioCatch's gross margin, net revenue retention, operating burn rate, and
      cash reserves.
    whyItMatters: >-
      Without verified gross margin and cash burn metrics, underwriting long-term software profitability and standalone
      unit economics remains speculative.
    diligencePath: >-
      Request audited GAAP financial statements, gross margin bridge by product line, and detailed cohort retention
      waterfalls during confirmatory underwriting.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: privacy-and-compliance
    missingEvidence: >-
      Independent third-party audits, Data Protection Impact Assessments (DPIAs), and certification attestations (such
      as SOC 2 Type II or ISO 27001) verifying anonymization boundaries under EU GDPR and US biometric privacy laws.
    whyItMatters: >-
      Financial institutions face stringent regulatory exposure regarding biometric data categorization; independent
      validation is required to verify that 3,000-plus telemetry points cannot be reverse-engineered to individual
      identities.
    diligencePath: >-
      Request BioCatch latest independent DPIA documentation, third-party penetration test reports, and model
      explainability governance audits during technical diligence.
