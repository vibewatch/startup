companyProfile:
  summary: >-
    BioCatch is a Tel Aviv-founded behavioral biometrics and fraud intelligence vendor that protects digital banking
    sessions for large financial institutions through continuous telemetry, device intelligence, and scam-detection
    workflows. The company scaled from an early account-takeover specialist into a broader behavioral fraud platform
    serving more than 350 banks and financial institutions, and in August 2026 Visa agreed to acquire it for $2.4
    billion in cash. Public evidence supports a sponsor-backed late-private company with clear product-market traction,
    but still leaves private economics and some governance details opaque.
