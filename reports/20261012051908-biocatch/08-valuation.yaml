  - id: TV001
    title: BioCatch Recommendation and Investment Summary
    columns:
      - Dimension
      - Assessment
      - Evidence / Metric Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Hold / Track (M&A Arbitrage)
        - Definitive cash acquisition agreed at $2.4B by Visa; closing projected in fiscal Q2 2027
        - Maintain exposure to capture transaction consideration; assess regulatory closing risk rather than venture growth upside
      - - Confidence
        - Medium-High
        - Definitive merger agreement announced by Visa, Permira, and BioCatch with disclosed terms
        - High certainty on deal consideration, but private audited financial schedules and closing covenants remain confidential
      - - Risk Rating
        - Medium
        - Scaled banking client base (350+ institutions) offset by antitrust review and CIAM integration complexity
        - Monitor international antitrust review progress, customer retention covenants, and key executive retention
      - - Valuation Stance
        - Fully Valued / Premium Exit
        - $2.4B purchase price implies ~13.0x 2025 ARR ($185M), an 85% step-up over 2024 Permira mark ($1.3B)
        - Valuation fully reflects strategic M&A premium; standalone multiple expansion is capped by definitive cash deal price
    notes: Recommendation and valuation metrics reflect Visa definitive acquisition announcement in August 2026 for $2.4B cash; ARR multiple derived from reported 2025 ARR of $185M.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
  - id: TV002
    title: BioCatch Investment Thesis and Anti-Thesis Register
    columns:
      - Core Pillar
      - Thesis Argument
      - Anti-Thesis Counter-Argument
      - Monitoring Trigger / Diligence Test
    rows:
      - - Market Dominance & Scale
        - BioCatch protects 760M users and 1.8B devices across 350+ banks, including 3 of the top 4 US banks
        - Behavioral biometrics as a standalone product category is commoditizing into larger CIAM and fraud platforms
        - Track client retention rates during Visa transition and verify enterprise expansion across top 20 accounts
      - - Technical Differentiation
        - Continuous telemetry (keystroke, touch, mouse) detects scams and account takeover before payments execute
        - AI automation, bots, and robotic process automation can mimic human cadence; motor variations cause false positives
        - Audit false positive transaction decline rates and test resistance against generative AI agent spoofing tools
      - - Strategic M&A Realization
        - Visa acquisition at $2.4B cash provides full liquidity and distribution across Visa Protect network
        - Transaction faces extended antitrust scrutiny through Q2 2027; failure to close leaves BioCatch as an isolated pure-play
        - Monitor regulatory filings across US DOJ, UK CMA, and EU regulators, tracking closing covenant compliance
      - - Financial Performance
        - Reported $185M ARR in 2025 demonstrates strong bank fraud budget capture and commercial scale
        - Implied 13.0x ARR multiple leaves no margin of safety if ARR growth decelerates or contract durations shorten
        - Inspect audited NRR, gross margin schedules, and revenue concentration across tier-one banking partners
    notes: Thesis and anti-thesis points synthesized from Visa transaction disclosures, BioCatch platform capabilities, and Forrester Research independent market critique.
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 'BioCatch Scenario Analysis: Bull, Base, and Bear Valuation Outcomes'
    columns:
      - Scenario
      - Probability
      - Implied Valuation
      - Core Assumptions & Return Logic
      - Downside Triggers / Kill Criteria
    rows:
      - - Bull Case (Seamless Visa Integration)
        - 30%
        - $2,800M+ (Synergy Value)
        - Visa closes acquisition in fiscal Q2 2027; BioCatch integrated into Visa Protect suite; rapid cross-sell to 100+ global network banks
        - Extended antitrust inquiry delays closing past mid-2027 or mandates structural data concessions
      - - Base Case (Agreed Cash Merger Terms)
        - 55%
        - $2,400M (Cash Deal Price)
        - Transaction clears regulatory approvals on schedule in Q2 2027; Permira and shareholders receive $2.4B cash; ~13.0x 2025 ARR multiple
        - Regulatory remedies or data-sharing restrictions imposed by competition authorities
      - - Bear Case (Regulatory Block / Standalone)
        - 15%
        - $1,300M - $1,600M (Standalone Market Comp)
        - Acquisition blocked or abandoned; valuation compresses to 7.0x-8.5x ARR in line with standalone cybersecurity multiples
        - Deal termination, executive departures, and customer churn to bundled payment network fraud suites
    notes: Base case reflects executed definitive agreement terms; bear case applies historical 2024 Permira transaction multiple (~7.0x ARR) in the event of deal termination.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV009
