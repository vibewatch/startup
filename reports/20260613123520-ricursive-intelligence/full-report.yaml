      - number: '6.2'
        title: 'Public proof stack: adjacent credibility is real, Ricursive-specific customer proof is still thin'
        blocks:
          - type: paragraph
            body: >-
              The central customer fact is negative but important: Ricursive’s public surfaces do not name a production
              customer. TechCrunch is even more explicit, saying the founders would not name their early customers. That
              same interview does report strong inbound interest from “every big chip making name” and says Ricursive
              can choose its first development partners, which is better than zero signal, but still materially weaker
              than a named account, a buyer quote, a tapeout case study, or an outcome metric. The launch release’s
              “early enterprise” language belongs in the same bucket: it shows commercialization intent, not customer
              proof.


              What is stronger is adjacent lineage. DeepMind says AlphaChip has already been used on multiple TPU
              generations and that MediaTek extended it for advanced chips. Sequoia’s podcast adds that the founders
              treated the TPU team as an internal customer for years and tuned their approach around the metrics those
              engineers actually cared about. That is meaningful because it demonstrates they have solved a real
              design-user problem before. But it is still adjacent proof, not Ricursive revenue proof. The right
              interpretation is that Ricursive starts with unusually strong founder-market fit and unusually weak public
              traction disclosure.


              The market-side context helps explain why investors are willing to tolerate that gap. Anthropic, AWS,
              Google, Microsoft, and other platform builders are already proving that large buyers will commit to
              custom-silicon paths when cost, throughput, and control matter enough. In that sense Ricursive is pointing
              at a real pain point. The missing step is proving that customers will trust Ricursive, specifically, with
              a meaningful part of a production design flow.
