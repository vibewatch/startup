figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Founder-lineage and company milestones from the pre-company thesis in 2018 through Ricursive's June 2026 hiring
      footprint.
    data:
      items:
        - date: '2018'
          label: Founding thesis begins
          detail: Goldie and Mirhoseini begin exploring the chip-design bottleneck thesis together.
          tone: positive
        - date: '2021'
          label: AlphaChip published in Nature
          detail: Nature publication establishes the RL floorplanning lineage later cited by Ricursive.
          tone: positive
        - date: '2024-10-02'
          label: External critique appears
          detail: New Scientist reports expert skepticism about “superhuman” AlphaChip claims.
          tone: negative
        - date: '2025-05-13'
          label: BIS AI-chip policy clarification
          detail: U.S. policy highlights regulatory dependencies around advanced-computing chips and AI training.
          tone: neutral
        - date: '2025-12-02'
          label: Public launch + $35M seed
          detail: Ricursive launches with Sequoia-led seed financing at a $750M valuation.
          tone: positive
        - date: '2025-12-02'
          label: Full-stack platform announced
          detail: Company says it will optimize the chip-design stack and pursue early enterprise / hyperscale users.
          tone: positive
        - date: '2026-01-26'
          label: $300M Series A at $4B
          detail: Lightspeed leads a rapid follow-on financing less than two months after launch.
          tone: positive
        - date: '2026-02-16'
          label: $335M total raised reported
          detail: TechCrunch says Ricursive targets chipmakers and electronics firms rather than building chips itself.
          tone: positive
        - date: '2026-06-13'
          label: Seven open Palo Alto roles
          detail: Hiring spans EDA, LLM infra, software infra, verification, research, and security.
