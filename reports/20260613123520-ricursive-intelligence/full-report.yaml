      - number: '8.4'
        title: Recommendation, entry discipline, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most defensible call today is track / research-more with medium confidence, high risk, and a stretched
              valuation stance. Ricursive could become strategically important if it proves faster design cycles, better
              compute efficiency, and repeatable customer adoption across major chip programs. But public evidence today
              is still missing the inputs that would turn a valuation story into an underwritable investment case:
              revenue, customer proof, margin structure, benchmarked performance against incumbent workflows, and the
              rights embedded in the $300 million Series A. Price sensitivity matters because the January 2026 round
              already capitalized a substantial share of the upside narrative. Without new operating evidence, paying
              above the current $4 billion benchmark would amount to underwriting prestige and scarcity alone. The
              gating diligence items are straightforward: prove who is paying, what they are paying for, what technical
              improvement Ricursive delivers versus Synopsys and Cadence baselines, and how quickly the company can
              convert its hiring-and-compute buildout into commercial revenue. Until that package is visible, another
              private round or strategic partnership is easier to support than a near-term IPO-style valuation
              framework.
