      - number: '7.5'
        title: Talent concentration, thin public org depth, and evidence-quality gaps keep residual risk elevated
        blocks:
          - type: paragraph
            body: >-
              Ricursive’s public persona is intentionally concentrated: a small elite team, two exceptional founders,
              and a narrow set of open roles. That can be a feature in the earliest research phase, but it becomes a
              risk as the company tries to commercialize into a market that simultaneously requires advanced algorithm
              research, verification, security, export-control diligence, ecosystem partnerships, and enterprise
              customer management. Oregon State’s workforce reporting and Embedded’s industry analysis both reinforce
              that verification and specialist talent are scarce sector-wide, which means Ricursive is hiring into a
              structurally tight market rather than a merely competitive one. The public jobs page shows open needs in
              EDA algorithms, RTL and design verification, infrastructure, research, and security, but offers no
              visibility into organizational redundancy, customer-facing leadership, or compliance ownership. Combined
              with the broader evidence-quality problem—most detailed positives come from the company and investors—this
              leaves the residual risk higher than the technical narrative alone would imply. The company may well
              execute, but the public evidence base still requires investors to underwrite several mission-critical
              capabilities on trust.
