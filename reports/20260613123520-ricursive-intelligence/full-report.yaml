      - number: '8.3'
        title: Adverse case, execution mismatch, and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that Ricursive lacks a credible technical team; it is that commercial valuation
              may be running ahead of reproducible differentiation. New Scientist documented serious outside criticism
              of AlphaChip-style claims, including the complaint that public evidence has not shown consistent
              outperformance versus expert designers or commercial tools and that reinforcement-learning approaches may
              demand far more compute. Meanwhile Synopsys and Cadence already market production AI optimization
              products, and Cadence was still broadening its AI automation stack in early 2026. That means Ricursive
              must prove not just that AI can help with chip design, but that its own system creates enough incremental
              speed, power-performance-area improvement, or workflow automation to pull budget away from incumbents or
              to become a strategic layer for them. The bear case therefore centers on execution mismatch: strong
              founder narrative, high spend on talent and compute, but slow conversion into paid deployments or
              benchmarked outcomes. The base case keeps the current valuation roughly intact because frontier-AI
              scarcity and strategic interest remain real. The bull case requires evidence of measurable commercial
              traction, partner integration, and technical wins that are legible to buyers rather than only to
              investors.
