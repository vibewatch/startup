      - number: '2.2'
        title: Multiple sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The best sizing discipline starts with a broad observable ceiling and then works down. The cleanest
              upper-bound proxy for the broad EDA and IP software pool is incumbent revenue: CompaniesMarketCap reports
              about 8.00 billion dollars of 2025 revenue for Synopsys and 5.29 billion dollars for Cadence, or roughly
              13.29 billion dollars combined, with a similar 13.52 billion dollar trailing-twelve-month pool in 2026.
              That is still an imperfect lens because those revenues include legacy flows, IP, and enterprise
              relationships Ricursive has not displaced. But it is far more defensible than borrowing semiconductor
              capex or AI-chip revenue.


              A second lens is downstream urgency. SEMI’s forecast of 110 billion dollars of fab-equipment spending in
              2025 and 130 billion dollars in 2026 shows that AI-related chip demand is pushing capital formation
              through the hardware stack. It does not, however, convert into Ricursive’s software TAM one-for-one. The
              contradiction to preserve is this: venture narratives around custom silicon are directionally right about
              urgency, but the currently monetized software control points are much smaller than the adjacent hardware
              pools. That is why the narrow market estimate here uses a low/base/high range anchored on incumbent
              software ceilings, not on total semiconductor spend.
