chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and stage
        blocks:
          - type: paragraph
            body: >-
              Ricursive Intelligence emerged publicly on 2 December 2025 as a frontier AI lab focused on using AI to
              accelerate semiconductor design. Its own site and launch materials frame the company as building
              self-improving systems that start with chip design and then close a recursive loop between better models
              and better silicon. The product claim is broader than a point EDA utility: retained sources describe a
              platform intended to optimize layout, verification, and architecture exploration across the semiconductor
              design stack. TechCrunch also reports that Ricursive is building AI tools that design chips rather than
              fabricating chips itself, which matters for how later diligence should think about its business model,
              capital intensity, and likely customer base.

              Public location evidence points to Palo Alto, California rather than a distributed multi-office footprint.
              Independent coverage describes Ricursive as Palo Alto-based, and the current Ashby job board lists all
              open roles as on-site in Palo Alto. As of the 2026-06-13 run date, Ricursive is still best understood as a
              newly launched private Series A company: it has raised unusually large amounts of capital very quickly,
              but retained public sources do not name customers, disclose revenue, or provide a customer-count metric.
              That gap pushes this chapter toward identity, capital, and founder-quality analysis rather than
              conventional traction underwriting.
