  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct commercial alternatives are incumbent EDA suites, not other early startups
        blocks:
          - type: paragraph
            body: >-
              AI-assisted chip design is already a commercial category, so Ricursive is not entering a blank market.
              Synopsys positions DSO.ai as autonomous RTL-to-GDSII full-flow optimization and AWS describes it as
              reinforcement-learning software that can search enormous design spaces in weeks rather than months while
              improving power, performance, and area. Cadence positions Cerebrus as an AI-driven full-flow optimizer
              and, by early 2026, had extended its story to the ChipStack AI Super Agent, which Forbes described as an
              agentic workflow for automating chip design and verification with claimed 10x productivity gains. Those
              two incumbents are the most important direct alternatives because many prospective Ricursive buyers
              already license Synopsys or Cadence tools and can expand AI usage without changing primary procurement,
              signoff, or support relationships.

              Ricursive still has a differentiated narrative. Its own site, launch materials, and partner writeups frame
              the company as building a full-stack, self-improving platform rather than a single optimization point
              tool. That ambition may matter if buyers want automation spanning placement, verification, and
              architecture exploration instead of a better tuning engine inside an existing flow. But public evidence
              today is still narrative-heavy: there are no retained public customer references showing Ricursive beating
              DSO.ai or Cerebrus in production. In the next one to two years, the practical buyer choice is likely to be
              incumbent-extension versus Ricursive trial, not Ricursive versus another startup of similar scale.
