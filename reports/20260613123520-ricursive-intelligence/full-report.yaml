      - number: '7.4'
        title: Customer adoption risk remains high because valuation raced ahead of visible commercial proof
        blocks:
          - type: paragraph
            body: >-
              The company’s financing strength is a mitigating asset, but it also sharpens the downside if adoption
              lags. Public materials do not yet identify paying customers, revenue, or deployment case studies. Instead,
              the narrative is built around founder pedigree, AlphaChip history, and investor conviction. In software
              categories this can be acceptable for a short period, but chip-design platforms face longer verification
              loops, greater switching costs, and deeper integration requirements with customer toolchains, foundries,
              and packaging plans. That raises the bar for what traction must eventually look like. The same
              supply-chain evidence that validates the importance of the market also highlights why adoption can be
              slow: startup access to foundries is hard, low-volume manufacturing is not built for small innovators, and
              large customers already have relationships with incumbent EDA vendors. Put differently, Ricursive has
              clearly validated investor demand, but not yet public customer demand. A $4 billion valuation before
              public customer proof leaves little room for slippage in benchmarks, first design wins, or
              compliance-driven go-to-market delays.
