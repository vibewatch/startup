      - number: '1.4'
        title: Milestones, ecosystem dependencies, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Ricursive's milestone record is short because the company is young, but it is dense. The most important
              pre-company milestones are the founders' 2018 collaboration around AI-driven chip design and the 2021
              AlphaChip publication, which are the evidence base for founder legitimacy. The company milestone sequence
              then moves quickly: public launch and seed financing in December 2025, a major Series A in January 2026,
              and a June 2026 hiring footprint that still centers on one Palo Alto office. The product narrative also
              expanded from floorplanning lineage to a broader full-stack design platform, with TechCrunch reporting a
              workflow that runs from component placement through design verification.

              The main risks are external dependency and proof opacity. Ricursive is not alone: Synopsys DSO.ai and
              Cadence Cerebrus show that AI-assisted chip design is already a commercial category, so the company must
              prove full-stack differentiation rather than just “AI in EDA.” At the same time, Google TPU, AWS Trainium,
              and Microsoft Maia demonstrate real hyperscaler demand for custom silicon, which helps explain investor
              enthusiasm. Regulatory exposure is indirect but still material because BIS, CSIS, and Morrison Foerster
              all show that the advanced-compute and AI-chip ecosystem remains subject to evolving U.S. export-control
              and enforcement rules. Finally, the New Scientist critique and the absence of named design wins mean that
              Ricursive's technical thesis is promising but not yet externally settled.
