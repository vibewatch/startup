      - number: '3.2'
        title: Open-source lineage, internal silicon teams, and merchant chips create substitute pressure
        blocks:
          - type: paragraph
            body: >-
              Ricursive is also exposed to substitutes that are not direct software vendors. The AlphaChip lineage
              behind the founders is now partly open-source through Google Research's circuit_training repository, which
              reproduces the Nature 2021 methodology for chip floorplans with distributed deep reinforcement learning.
              Sequoia and Ricursive-linked sources describe AlphaChip as reducing floorplanning from months to hours,
              but independent coverage is less clean: TechCrunch and New Scientist recount a three-generation TPU
              deployment record and note that experts still dispute whether public evidence proves superhuman
              performance over expert designers or commercial tools. That combination matters competitively. It
              validates the founders' technical pedigree while also making clear that sophisticated buyers can study or
              adapt part of the floorplanning stack internally instead of paying a new vendor.

              The larger substitute threat is internal silicon. Google, AWS, and Microsoft each publicly describe
              first-party AI accelerators—TPU, Trainium, and Maia—built to optimize training or inference economics
              inside their own platforms. Microsoft's Maia 200 page goes further by benchmarking itself against Amazon
              Trainium and Google TPU. These are not direct EDA competitors, but they show that the most advanced AI
              infrastructure buyers often respond to hardware bottlenecks by building internal chip organizations and
              proprietary toolchains. A more prosaic substitute is simply buying merchant accelerators from NVIDIA or
              AMD rather than starting a custom-ASIC program at all. For many enterprises, that off-the-shelf option
              will be operationally easier than adopting a new AI chip-design platform.
