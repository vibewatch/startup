      - number: '7.3'
        title: Export controls and concentrated semiconductor supply chains can delay or narrow commercialization paths
        blocks:
          - type: paragraph
            body: >-
              Ricursive operates in a part of the value chain where compliance and supply-chain issues are not
              background noise. BIS guidance, legal analyses, and current coverage all point to a regime in which
              advanced chips, related services, remote users, and even foundry-capacity diversion have become
              underwritten policy questions. January 2026 rule changes introduced a more flexible path for some exports
              to China and Macau, but only in exchange for tighter certification, KYC, testing, and end-user disclosure
              burdens. June 2026 clarifications then reaffirmed that Chinese-parent subsidiaries outside China are still
              within the compliance perimeter. At the same time, the manufacturing side of the ecosystem remains deeply
              concentrated. Trade.gov says Taiwan still commands more than 60% of foundry revenue and over 90% of
              leading-edge manufacturing, while GAO and SEMI show that U.S. diversification is underway but measured in
              multiyear and even decade-long timelines. For a startup that may eventually need foundry, packaging,
              cloud, and customer access across borders, this means commercial timing can be constrained by policy
              friction and chokepoint suppliers even if the design software itself works well.
