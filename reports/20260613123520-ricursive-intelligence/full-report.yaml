        title: Comparable set and market-cap-to-revenue proxies
        blocks:
          - type: paragraph
            body: >-
              The cleanest external framing for Ricursive is not a direct startup comp but a mix of public EDA,
              semiconductor, and frontier-AI reference points. Synopsys and Cadence matter because they already sell
              AI-assisted chip-design tooling into real customer workflows. NVIDIA and AMD matter because they anchor
              how investors currently pay for AI-compute leaders, even though they are much larger hardware businesses.
              On June 12, 2026 market-cap and revenue snapshots imply roughly 10.9x revenue for Synopsys, 19.2x for
              Cadence, 23.0x for NVIDIA, and 24.1x for AMD. Those are rich multiples, but they are attached to companies
              with disclosed revenue, large installed bases, and proven product-market fit. Applying those same proxies
              backward to Ricursive shows how much commercial substance would be needed to defend the current price.
              Depending on which comp lens is used, a $4 billion valuation would require something like $166 million to
              $367 million of annual revenue. No cited Ricursive source discloses anything close to that benchmark,
              which makes the current mark a scarcity premium on founders, technology narrative, and perceived strategic
              optionality. The private frontier-AI peer set does show that paper valuations at or above $4 billion can
              appear very early, but those marks still do not substitute for revenue support.
