      - number: '3.3'
        title: Switching costs and public-disclosure gaps currently favor incumbents and substitutes
        blocks:
          - type: paragraph
            body: >-
              The public packaging comparison is asymmetric. Synopsys and Cadence present AI functionality as extensions
              of established enterprise flows, and Synopsys specifically pairs DSO.ai with AWS ParallelCluster, AWS
              Batch, and Slurm-style HPC orchestration. Cadence emphasizes reusable optimized models and a designer
              cockpit that keeps engineers inside the existing process. Those facts imply lower deployment friction for
              buyers already committed to incumbent stacks. By contrast, Ricursive's public materials describe ambition,
              funding, and team quality, but they do not disclose pricing, contract structure, security attestations,
              compliance posture, or named customer wins. That does not mean the company lacks them; it means public
              diligence cannot yet treat Ricursive as enterprise-proven.

              Substitutes also compare well on adoption friction. circuit_training is open-source, but only elite teams
              with reinforcement-learning and physical-design expertise are likely to operationalize it. Internal
              hyperscaler build-outs are expensive, yet they give complete control to the buyer. Merchant accelerators
              from NVIDIA and AMD require no design-tool adoption at all; they solve the near-term compute need by
              hardware procurement rather than custom design. This leaves Ricursive squeezed in the middle. Its best
              near-term wedge is not lowest-friction deployment, but a claim that it can offer broader automation and
              faster iteration than either point-tool incumbents or do-it-yourself alternatives.
