      - number: '6.3'
        title: Early-partner ambiguity, channels, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Even if Ricursive wins a technically impressive pilot, adoption still depends on an ecosystem the company
              does not fully control. Cadence and Synopsys evidence shows where customers already expect these tools to
              live: inside full digital design flows, in close interaction with verification, timing, and physical
              implementation. AWS’s DSO.ai case study adds another implementation layer by showing that infrastructure
              scale and auto-scaling HPC clusters matter in practice. TSMC’s dedicated-foundry materials make the same
              point from the manufacturing side: serious silicon customers buy into support, account management,
              engineering services, and ecosystem compatibility, not only into a single optimization engine.


              Customer-side constraints are also visible outside Ricursive. Omdia’s foundry-wall analysis says advanced
              packaging and HBM remain chokepoints through at least mid-2027. Morrison Foerster’s export-control note
              reminds readers that compliance risk now touches the broader AI-chip ecosystem, not just fabs and
              exporters. Data Center Frontier’s Anthropic profile shows that sophisticated labs actively diversify
              across Trainium, TPUs, and GPUs to preserve supply and pricing leverage. That behavior suggests a subtle
              but important customer requirement for Ricursive: buyers may want portability and interoperability, not a
              workflow that locks them into one cloud, one foundry relationship, or one verification stack.


              This is why the “first development partners” line from TechCrunch matters less than it first appears.
              Development partners are useful, but they do not answer who owns deployment risk, who signs the contract,
              who supports tapeout, or who absorbs foundry or export delays when a design has to move from promising
              pilot to commercial silicon. Channel quality and ecosystem fit are therefore central diligence topics, not
              side notes.
