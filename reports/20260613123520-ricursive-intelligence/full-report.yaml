  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: '''Risk overview: the underwriting problem is proof conversion, not just technical ambition'''
        blocks:
          - type: paragraph
            body: >-
              Ricursive’s top risks stem from the gap between an exceptional technical origin story and the still-thin
              public record of commercialization. The company, its investors, and independent coverage all agree that
              chip design is slow, expensive, and strategically important, which explains why Ricursive was able to
              raise $335 million so quickly. But the same evidence set also shows that the company is entering a market
              where incumbents already ship AI-assisted design products, advanced-node verification remains stubbornly
              hard, and export-control burdens now reach into remote access, foundry allocation, and customer screening.
              Public proof is dominated by founders, investors, and inherited AlphaChip credibility rather than by named
              customers, disclosed revenue, or independent benchmark wins. That makes the risks interactive: technology
              proof gaps slow adoption, adoption gaps amplify valuation risk, export and foundry constraints can delay
              deployment, and a small specialist team has to absorb all of that at once. The chapter’s base case is
              therefore not “science project failure,” but a more common startup failure mode in semiconductors:
              impressive technical pedigree failing to convert quickly enough into repeatable commercial proof.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
