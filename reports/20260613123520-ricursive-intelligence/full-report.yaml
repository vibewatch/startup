  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and why the $4B mark is ambitious
        blocks:
          - type: paragraph
            body: >-
              Ricursive Intelligence jumped from a December 2025 seed valuation of about $750 million to a January 2026
              Series A post-money valuation of $4 billion after only a few months in public view. That step-up is not
              impossible in the 2025-2026 frontier-AI market, but it is unusually aggressive even by current mega-round
              standards. The available evidence says investors funded a founder-and-vision bet: Anna Goldie and Azalia
              Mirhoseini carry rare credibility from AlphaChip and Google TPU work, the company is pursuing a real
              bottleneck in AI infrastructure, and the round syndicated quickly across elite AI and semiconductor
              investors. At the same time, the public record does not disclose revenue, ARR, gross margin, customer
              count, or named paid design programs. The capital raise therefore prices future platform relevance rather
              than demonstrated commercial output. A $300 million primary into a $4 billion post-money valuation also
              implies only about 7.5% new-money dilution, so the round resets price expectations upward without bringing
              the kind of operating transparency that would normally support a durable late-stage benchmark.
