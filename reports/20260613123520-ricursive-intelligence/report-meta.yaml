companyProfile:
  summary: Ricursive Intelligence is a Palo Alto private frontier AI lab founded in late 2025 by Anna Goldie and Azalia Mirhoseini, the researchers behind AlphaChip. The company is building an AI-driven semiconductor design platform intended to compress chip-development timelines and enable tighter co-evolution between AI models and custom silicon. Public evidence supports unusual founder-market fit and very strong investor demand, but it does not yet disclose the operating metrics investors usually need to underwrite a $4 billion software-and-infrastructure business.
