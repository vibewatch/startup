evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster, board observers, committee structure, and a fuller executive directory beyond the two
      founders.
    whyItMatters: >-
      Governance visibility is necessary to assess real management depth, investor control, and succession resilience in
      a founder-concentrated company.
    diligencePath: >-
      Request board materials, an org chart, and the latest financing governance package from the company or lead
      investors.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: commercial-traction
    missingEvidence: >-
      Named customers, revenue or ARR, customer count, design-win evidence, pricing, and any conversion from pilots to
      contracted engagements.
    whyItMatters: >-
      Public financing speed is not a substitute for commercial proof, and downstream customer and valuation chapters
      require concrete traction data.
    diligencePath: >-
      Ask for customer references, signed statements of work, revenue bridge materials, and a pipeline conversion
      report.
    relatedQuestionRefs:
      - QO014
      - QO025
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count, function mix, and geographic distribution beyond the seven public openings.
    whyItMatters: >-
      Hiring intensity alone cannot show whether Ricursive has the engineering depth to execute on a full-stack design
      platform.
    diligencePath: Request an anonymized headcount by function and location plus historical hiring and attrition trends.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Cap table, ownership by round, any secondaries, and confirmation of whether debt, venture credit, or other
      structured financing exists off the retained public record.
    whyItMatters: >-
      The round sizes are large enough that preference stack, concentration, and hidden structured capital could
      materially affect later valuation analysis.
    diligencePath: Request the latest cap table, financing documents, and investor-rights summaries from counsel or the finance team.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: legal-entity-details
    missingEvidence: Formal legal incorporation date and registered office for Ricursive Intelligence.
    whyItMatters: >-
      The company can still be analyzed without it, but later legal and diligence workflows should anchor on the actual
      legal entity rather than public launch date.
    diligencePath: Pull state incorporation records or ask the company for formation documents.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Public pricing, contract structure, or pilot economics for Ricursive and comparable multi-stage chip-design
      automation products.
    whyItMatters: >-
      Without pricing and deployment terms, any SAM-to-revenue conversion remains speculative and buyer willingness to
      pay cannot be benchmarked.
    diligencePath: >-
      Request pilot pricing, contract terms, and expansion assumptions from Ricursive management and compare them with
      incumbent EDA enterprise agreements.
    relatedQuestionRefs:
      - QM023
      - QM024
      - QM030
  - type: private-evidence-only
    severity: material
    topic: design-wins
    missingEvidence: >-
      Named customer references, public production design wins, or benchmark case studies that go beyond founder
      pedigree and financing velocity.
    whyItMatters: >-
      Commercial proof would determine whether Ricursive can move from a research-led narrative to repeatable budget
      capture in real programs.
    diligencePath: >-
      Request customer references, pilot-to-production conversion data, and benchmark reports under NDA from Ricursive
      and prospective design-partner customers.
    relatedQuestionRefs:
      - QM004
      - QM026
      - QM030
  - type: conflicting-data
    severity: material
    topic: benchmark-proof
    missingEvidence: >-
      A current public benchmark set comparing AI-assisted layouts and verification outcomes against expert human teams
      and incumbent commercial tools.
    whyItMatters: >-
      The gap between published AlphaChip success and later expert skepticism directly affects trust, pilot scope, and
      the size of the reachable market.
    diligencePath: >-
      Commission an independent benchmark across modern chip blocks and verification workloads using neutral academic or
      industrial evaluators.
    relatedQuestionRefs:
      - QM011
      - QM012
  - type: missing-source
    severity: minor
    topic: budget-owner
    missingEvidence: >-
      Procurement workflow detail showing which functional leader actually owns the budget for AI-EDA platform expansion
      inside hyperscalers and fabless design teams.
    whyItMatters: Budget ownership determines sales-cycle length, expansion path, and the realistic denominator for SOM assumptions.
    diligencePath: >-
      Interview CAD leaders, physical-design managers, and silicon engineering VPs at target accounts to map budget
      ownership and approval thresholds.
    relatedQuestionRefs:
      - QM016
      - QM027
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: ai-eda-segmentation
    missingEvidence: >-
      Official revenue segmentation showing what share of incumbent EDA revenue already comes from AI-automation modules
      rather than legacy flows.
    whyItMatters: >-
      The narrow-SAM estimate would be more reliable if there were a disclosed baseline for existing buyer spend on
      AI-augmented tooling.
    diligencePath: >-
      Review vendor investor materials for segment commentary and ask industry experts or former executives to estimate
      current AI-module penetration.
    relatedQuestionRefs:
      - QM021
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
