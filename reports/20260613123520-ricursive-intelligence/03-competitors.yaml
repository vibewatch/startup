    title: Competitive positioning map
    type: quadrant
    layout: wide
    summary: >-
      Ordinal positioning of Ricursive and key alternatives on two
      evidence-backed axes: x = distribution / procurement power and y =
      automation breadth / strategic control. Ricursive scores high on
      ambition but low on installed distribution; incumbents score highest on
      distribution; internal silicon organizations score highest on strategic
      control.
    data:
      xAxis: Distribution / procurement power (0=none, 10=entrenched enterprise or platform control)
      yAxis: Automation breadth / strategic control (0=narrow or no design-control value, 10=full-stack or fully internalized control)
      points:
        - {label: Ricursive Intelligence, x: 4, y: 8}
        - {label: Synopsys DSO.ai, x: 9, y: 7}
        - {label: Cadence Cerebrus / ChipStack, x: 9, y: 8}
        - {label: AlphaChip / circuit_training, x: 3, y: 6}
        - {label: Google TPU org, x: 8, y: 9}
        - {label: AWS Trainium org, x: 8, y: 8}
        - {label: Microsoft Maia org, x: 8, y: 8}
        - {label: Merchant silicon (NVIDIA/AMD), x: 10, y: 4}
    approximationNotes: >-
