- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric / artifact
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Pricing sheets and standard contract terms
    - Without price architecture, realized monetization and discounting are unknowable
    - Request pricing deck, standard MSA, SOW templates, and sample invoice
  - - Named customers, design wins, and conversion cohorts
    - No way to test revenue quality, concentration, or pilot-to-production conversion
    - Request customer list, stage-by-stage funnel, and at least two customer references
  - - Revenue / ARR / backlog
    - Top-line scale remains fully opaque
    - Request monthly revenue bridge, contracted ARR, deferred revenue, and forecast
  - - Gross margin / COGS detail
    - Cannot distinguish software economics from compute-heavy service economics
    - Request margin bridge separating cloud/GPU, personnel, and third-party tool spend
  - - Burn, runway, and cash balance
    - Capital adequacy cannot be judged despite large rounds
    - Request latest balance sheet, cash waterfall, and runway model
  - - Headcount by function
    - Open roles are not a substitute for actual org cost structure
    - Request current headcount, compensation bands, and hiring plan by department
  - - Series A cap table, board, and investor rights
    - Governance and liquidation stack remain unknown
    - Request cap table, charter, board deck, and investor rights agreement
  - - Use-of-proceeds budget
    - Headline round size does not reveal whether the company is over- or under-capitalized for the next milestone
    - Request fundraising model with planned spend by labor, compute, licenses, and GTM
  notes: Every row in this table is a real diligence blocker rather than a cosmetic disclosure preference. Ricursive is a private company, so nulls and undisclosed values are preserved instead of replaced with speculative estimates.
