- id: gtm-and-sales-efficiency-proxies
  title: GTM motion and sales-efficiency proxies
  body: |-
    Because Ricursive discloses neither customers nor commercial metrics, the only usable public GTM proxies come from hiring and workflow context. The Ashby board shows seven open roles, all on-site in Palo Alto, and every retained role is technical or security-oriented: EDA algorithms, LLM infrastructure, software infrastructure, design verification, research, and founding security. That pattern suggests a company still allocating visible spend to product and technical execution rather than a scaled field-sales organization. It also suggests the commercial model is not self-serve; mission-critical chip-design software normally enters accounts through technical evaluation, workflow integration, and co-development rather than checkout-cart conversion.

    The absence of public customer references means CAC, payback, and cycle-length cannot be measured from public evidence. Still, the workflow context matters. If Ricursive is selling into advanced chip programs at AMD-, Intel-, NVIDIA-, or hyperscaler-grade quality bars, the sales motion is likely to be high-touch and technically mediated even if the eventual gross-margin profile looks software-like. That creates a familiar private-company pattern: early spend looks R&D heavy, while GTM efficiency remains unverifiable until the company starts naming pilots, conversions, and expansion cohorts.
