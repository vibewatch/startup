  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-contracts
    missingEvidence: Customer contracts, pricing sheets, discount schedules, and revenue-recognition policy.
    whyItMatters: Without contract structure, list pricing, and discounting, revenue quality and recurring-software economics cannot be underwritten.
    diligencePath: Request current pricing deck, standard MSA/SOW, sample invoice, and revenue-recognition memo in the data room.
    relatedQuestionRefs:
    - QI002
    - QI009
    - QI024
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: customer-proof
    missingEvidence: Named design partners, paying customers, pilot conversion data, and deployment case studies.
    whyItMatters: Customer proof is the missing bridge between founder pedigree and revenue-quality underwriting.
    diligencePath: Ask for customer list, design-win pipeline, churn-free cohort data, and reference calls with at least two active users.
    relatedQuestionRefs:
    - QI003
    - QI008
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-runway
    missingEvidence: ARR, revenue mix, gross margin, burn, runway, headcount, and infra/computing spend by month.
    whyItMatters: These metrics determine whether Ricursive is becoming a software business with improving margins or a compute-heavy research program with prolonged cash dependence.
    diligencePath: Request monthly management accounts, burn bridge, headcount by function, cloud/GPU spend ledger, and board-approved operating plan.
    relatedQuestionRefs:
    - QI008
    - QI017
    - QI021
    - QI024
    relatedTableRefs:
    - TI003
    - TI004
  - type: missing-source
    severity: material
    topic: capital-structure-and-rights
    missingEvidence: Cap table, liquidation preferences, board composition, debt terms, and investor rights after the Series A.
    whyItMatters: Financing dependency cannot be judged cleanly without knowing who controls governance and what senior claims or preferences sit above common equity.
    diligencePath: Request post-Series A cap table, charter, investor rights agreement, board consent package, and any debt or compute-capacity commitments.
    relatedQuestionRefs:
    - QI020
    - QI021
    - QI025
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: use-of-funds-detail
    missingEvidence: Budget-level split of proceeds across talent, compute, EDA licenses, customer pilots, and legal/compliance.
    whyItMatters: Broad statements about accelerating semiconductor design do not reveal whether the current capital base is sufficient for the next milestone.
    diligencePath: Request the board deck or fundraising model showing use of proceeds, hiring plan, and milestone-linked cash needs.
    relatedQuestionRefs:
    - QI022
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
