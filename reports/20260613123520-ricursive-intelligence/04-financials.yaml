- id: cost-structure-and-proxy-economics
  title: Cost structure and proxy economics
  body: |-
    The most supportable cost-structure view comes from adjacent evidence rather than Ricursive disclosures. Lightspeed says state-of-the-art silicon programs can take two to three years and hundreds of millions of dollars, with labor absorbing the bulk of semiconductor R&D spend. TechCrunch and Sequoia add that AlphaChip-style approaches can collapse floorplanning from months or a year-plus into hours. Read together, those sources imply that Ricursive is trying to monetize a meaningful customer cost center: expensive engineering time and long iteration cycles.

    Public analogs also frame the upside and the boundary conditions. Synopsys DSO.ai and Cadence Cerebrus already sell AI-assisted design optimization, and Forbes says AI is now used on roughly 20–40% of leading-edge SoC designs while Cadence markets 10x productivity gains. The broader comp stack sharpens the economic picture: Ansys and Autodesk show that design-centric engineering software can reach $2.58B and $7.20B of revenue with $32.90B and $41.89B market caps, while Arm shows the semiconductor IP layer can support $4.67B of revenue and a $406.73B market cap without owning fabs. TSMC's $121.91B revenue and $2.198T market cap mark the much larger but capital-heavier foundry end of the stack. That spread supports a software/IP upside case for Ricursive rather than a manufacturing one, even if its recursive model-hardware loop still implies meaningful internal compute, experimentation, and specialist-labor spend.
