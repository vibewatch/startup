- id: verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: |-
    The adverse case is not that Ricursive lacks capital; it is that public underwriting still rests more on founder pedigree and financing speed than on disclosed commercial traction. New Scientist notes that independent experts say public proof remains lacking for AlphaChip's claimed superhuman edge, which matters because Ricursive's financial story depends on turning that technical lineage into customer value that buyers will pay for. At the same time, TSMC's public annual-report and SEC-filing archive is a useful disclosure baseline: mature semiconductor-adjacent businesses routinely publish far more than Ricursive currently does.

    The investable conclusion from public evidence is therefore narrow. Ricursive likely has the capital to keep building, and the public-comp set shows that successful design software can carry software-like enterprise value without foundry-style capex. But revenue quality, gross-margin path, runway, and financing dependency all remain blocked by missing private data. Until the company discloses or shares customer proof, contract structure, monthly financials, and post-Series A governance documents, the right verdict is not that the business is weak—it is that the business is still opaque.
  claimRefs:
  - CI033
  - CI034
