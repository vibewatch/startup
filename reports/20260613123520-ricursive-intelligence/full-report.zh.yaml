  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接商业替代品是既有 EDA 套件，而不是其他早期创业公司
        blocks:
          - type: paragraph
            body: >-
              AI 辅助芯片设计已经是商业品类，Ricursive 进入的不是空白市场。Synopsys 将 DSO.ai 定位为自主 RTL-to-GDSII 全流程优化；AWS
              将其描述为强化学习软件，能在数周而非数月内搜索巨大的设计空间，同时改善功耗、性能和面积。Cadence 将 Cerebrus 定位为 AI 驱动的全流程优化器；到 2026 年初，其叙事已延伸到
              ChipStack AI Super Agent，Forbes 称其为自动化芯片设计和验证的智能体工作流，并宣称生产率提升 10x。这两个既有厂商是最重要的直接替代品，因为许多潜在 Ricursive
              买方已经授权 Synopsys 或 Cadence 工具，可以在不改变主要采购、签核或支持关系的情况下扩大 AI 使用。

              Ricursive
              仍有差异化叙事。公司官网、发布材料和伙伴文章把它描述为在打造全栈、自我改进的平台，而不是单点优化工具。如果买方想要跨放置、验证和架构探索的自动化，而不是既有流程里的更好调参引擎，这种雄心可能很重要。但今天的公开证据仍偏叙事：保留的公开客户引用中，没有显示
              Ricursive 在生产环境击败 DSO.ai 或 Cerebrus。未来一到两年，买方的实际选择更可能是扩展既有工具还是试用 Ricursive，而不是 Ricursive 与另一家同等规模创业公司对决。
