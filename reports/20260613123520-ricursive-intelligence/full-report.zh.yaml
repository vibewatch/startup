      - number: '6.2'
        title: 公开证明栈：相邻可信度真实，但 Ricursive 特定客户证明仍薄
        blocks:
          - type: paragraph
            body: >-
              核心客户事实是负面的，但很重要：Ricursive 的公开界面没有具名生产客户。TechCrunch 更明确，称创始人不愿透露早期客户名称。同一篇访谈确实报道了来自“每个大型芯片制造商”的强劲主动兴趣，并称
              Ricursive 可以选择首批开发伙伴；这比零信号更好，但仍明显弱于具名账户、买方引语、流片案例研究或结果指标。发布稿中的“早期企业”措辞也属于同一类：它显示商业化意图，而不是客户证明。


              更强的是相邻传承。DeepMind 称 AlphaChip 已用于多代 TPU，MediaTek 也将其扩展到先进芯片。Sequoia 播客补充说，创始人数年来把 TPU
              团队视为内部客户，并围绕这些工程师真正关心的指标调优方法。这有意义，因为它证明她们以前解决过真实设计用户问题。但这仍是相邻证明，不是 Ricursive 收入证明。正确解读是，Ricursive
              起点具备异常强的创始人与市场匹配度，也有异常弱的公开牵引力披露。


              市场侧背景有助于解释投资人为什么愿意忍受这个缺口。Anthropic、AWS、Google、Microsoft
              和其他平台建设者已经证明，当成本、吞吐量和控制权足够重要时，大买方会押注定制硅片路径。从这个意义上说，Ricursive 指向的是真实痛点。缺失的一步，是证明客户会把生产设计流程中有意义的一部分专门交给
              Ricursive 信任。
