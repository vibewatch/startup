  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Ricursive 的公开材料对变现只支持一个窄口径财务结论：公司在打造设计芯片的 AI
              工具，而不是向市场销售硅片的芯片制造商。TechCrunch、公司官网和发布材料都指向一个面向半导体设计的全栈软件平台，产品范围从放置延伸到验证和架构探索。这很重要，因为其可能的经济模型是卖入芯片设计工作流的企业软件，而不是晶圆代工收入、库存周转或硬件毛利率。


              未公开的内容几乎同样重要。保留来源均未显示标价、用量费率、合同期限、收入确认政策，甚至没有具名设计伙伴。也没有公开自助漏斗或免费试用动作，无法支持产品驱动 SaaS
              变现路径。因此，公开记录只支持潜在变现面——企业平台授权、试点项目，以及支持或集成工作——而不是已验证收入流。因此，本章把已披露融资之外的每一条收入线都视为未披露，除非直接来源另有说明。
