  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Ricursive 的主要风险如何传导到采用、时间线、利润率、融资和估值。
    data:
      nodes:
        - id: R1
          label: 基准证明缺口
          detail: 相对既有厂商的公开性能优势仍未证实。
          tone: risk
        - id: R2
          label: 验证负担
          detail: 人工签核和先进节点检查仍占主导。
          tone: risk
        - id: R3
          label: 客户采用延迟
          detail: 具名商业证明仍然缺失。
          tone: risk
        - id: R4
          label: 出口管制负担
          detail: KYC、远程用户和国家筛查要求。
          tone: risk
        - id: R5
          label: 晶圆代工 / 封装依赖
          detail: 外部产能和生态准入仍然集中。
          tone: risk
        - id: R6
          label: 团队集中
          detail: 小型专业团队承担多项任务关键职能。
          tone: risk
        - id: R7
          label: 融资压力
          detail: 高估值会放大延迟后果。
          tone: risk
        - id: R8
          label: 缓释因素
          detail: 创始人履历、已融资额和真实品类验证。
          tone: positive
