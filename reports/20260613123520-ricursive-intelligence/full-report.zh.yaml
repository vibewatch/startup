      - number: '1.3'
        title: 资本基础、投资人图谱与规模指标
        blocks:
          - type: paragraph
            body: >-
              Ricursive 的融资速度是公司概况里最醒目的一项事实。公司于 2025-12-02 以 $750 million 估值完成 $35 million 种子轮并公开亮相，随后在 2026-01-26 宣布以
              $4 billion 投后估值完成 $300 million Series A 轮。TechCrunch 后来汇总其累计融资为 $335 million，Ricursive 官网也重复这一数字，并列出
              Sequoia、Lightspeed、DST 和 NVentures 等支持方。按简单算术，估值在不到两个月内从种子轮到 Series A 大约上涨 5.3x；即便按 2026 年前沿 AI 标准看，这也很异常。

              投资人组合和融资金额同样重要。Sequoia 领投种子轮，Lightspeed 领投 Series A。公司和独立媒体还点名 DST Global、NVentures、Felicis、49
              Palms、Radical 等。投资人文章显示，本轮融资至少同样受创始人履历和硬件-软件协同设计投资逻辑驱动，而不只是已披露商业牵引力。公开规模信号仍偏早期而非成熟：官网称 Ricursive
              正在扩张一支小而精的团队，招聘页显示七个现场开放岗位，覆盖核心产品、基础设施、研究和安全。保留的融资来源均未披露债务、收入或股权结构表拆分，因此后续章节应把当前资本化状态视为资金充足，但结构上仍不透明。
