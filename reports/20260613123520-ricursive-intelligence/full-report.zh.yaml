      - number: '1.2'
        title: 创始人、领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Ricursive 目前的可投资性很大程度压在两个人身上：联合创始人兼 CEO Anna Goldie，以及联合创始人兼 CTO Azalia
              Mirhoseini。两人与市场的匹配度异常强，因为公司正在直接商业化她们多年研究 AI 辅助芯片设计时共同发展出的投资逻辑。Nature 2021 年的 AlphaChip 论文确立了技术传承；Sequoia
              的播客提到 AlphaChip 将布图规划从数月压缩到数小时；Google Research 的 circuit_training 仓库称该框架为开源，并已在 Alphabet
              内外使用。结果是一个少见案例：公司的起源故事、技术方法和招聘叙事都指向同一种核心能力。

              不过，公开记录并非完全干净。多个与 Ricursive 相关的来源称 AlphaChip 影响了四代 TPU，而 New Scientist 2024 年的批评称 Google DeepMind 描述的是三代
              TPU，并引用专家观点，认为“超人类”性能的公开证据仍不足。这不会击穿投资逻辑，但意味着创始叙事应被视为可信但有争议，而不是既成事实。治理披露也很薄：保留的公开来源一致确认两位创始人分别担任 CEO 和
              CTO，但没有公布董事会名单或更完整的高管目录。因此，Ricursive 面临集中的关键人风险，外部也很难看清创始二人之外的管理层深度。
