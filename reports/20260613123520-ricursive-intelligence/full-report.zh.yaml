      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Ricursive 最早的买方不是所有地方的所有芯片用户，而是那些时间压缩价值数百万美元、且定制硅片已经具有战略意义的组织。TechCrunch
              称，任何制造电子产品且需要芯片的公司都在范围内，但现实中的第一波会更窄：超大规模云厂商的硅片团队、先进制程无晶圆厂芯片设计商，以及打造定制 ASIC
              的系统公司。这些买方已经长期承受漫长设计周期、昂贵工程团队，以及靠定制硅片形成差异化的上升压力。


              用户群比买方集合更具体。物理设计、CAD 和验证团队会先评估产品，因为 Synopsys 和 Cadence 的既有厂商案例仍扎根于 PPA
              和流程优化。预算权力可能从这些团队开始，一旦工具触及多个工作流阶段或企业级算力承诺，再向上扩展。因此，采用路径应被理解为分阶段信任曲线：基准测试可信度、在一个模块上试点、延伸到验证或签核，然后才是项目级标准化。这个顺序让
              Ricursive 近期 SOM 比其宏大叙事更窄。
