        title: 产品定义与用户任务
        blocks:
          - type: paragraph
            body: >-
              Ricursive 的公开产品最好被理解为面向半导体团队的 AI 设计自动化层，而不是芯片供应商。公司官网和发布材料反复把交付物描述为一个系统：加速芯片设计，并在 AI
              模型与承载它们的硅片之间闭合递归循环。TechCrunch 把描述收得更具体，称 Ricursive 在打造设计芯片的 AI
              工具，而不是自己制造芯片；还报道称平台旨在覆盖从组件放置到设计验证，并能跨连续芯片项目学习。这让买方任务更具体：缩短周期、减少人工迭代负担，并为不想搭建超大规模云厂商级设计组织的团队改善定制硅片经济性。证据在问题框定上最强，在包装上最弱。保留的官方来源均未披露定价、自助访问、客户名称或合同结构，因此公开记录支持的是宽工作流投资逻辑，而不是成熟商业界面。
