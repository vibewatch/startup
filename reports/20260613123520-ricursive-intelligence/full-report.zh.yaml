  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 分层看 Ricursive 的公开叙事：顶层是递归产品逻辑，中层是有技术谱系支撑的优化引擎，底层是算力和既有流程依赖。
    data:
      layers:
        - id: buyer-layer
          label: 买方目标层
          detail: 客户想要更快的定制硅迭代，也想要比多年手工设计循环更好的经济性。
          sublayers:
            - id: designless
              label: Designless wedge
              detail: Investor materials pitch custom silicon access for teams without massive internal design organizations.
            - id: workflow-scope
              label: Full-stack scope claim
              detail: Public materials frame the product as broader than a point optimizer.
        - id: application-layer
          label: Ricursive 应用层
          detail: 公司称，AI 应加速半导体设计的每个阶段，并随时间跨芯片学习。
          sublayers:
            - id: placement
              label: Placement / optimization
              detail: AlphaChip and C3PO lineage support the optimization story.
            - id: verification
              label: Verification / evaluation
              detail: TechCrunch names verification; INSTA lineage supports fast evaluators and timing-aware gradients.
        - id: model-layer
          label: 模型与评估器层
          detail: 技术谱系指向强化学习搜索，并在迭代循环中加入快速时序 / 质量评估器。
          sublayers:
            - id: rl
              label: RL / learned search
              detail: Nature and circuit_training describe distributed deep RL for floorplanning.
            - id: sta
              label: Differentiable timing analysis
              detail: INSTA shows high-speed, high-correlation timing evaluation in public research artifacts.
        - id: dependency-layer
          label: 依赖与部署层
          detail: 任何真实部署仍取决于客户设计数据、与既有 EDA 的互操作、算力基础设施和出口管制治理。
          sublayers:
            - id: compute
              label: Compute substrate
              detail: >-
                Series A funds compute expansion; buyers benchmark against integrated stacks like TPU, Trainium, and
                Maia.
            - id: interop
              label: Incumbent-flow boundary
              detail: Synopsys and Cadence remain the signoff and procurement context for many buyers.
    claimRefs:
      - CE002
      - CE003
      - CE017
      - CE023
      - CE025
      - CE031
