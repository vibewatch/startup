      - number: '2.2'
        title: 多重市场规模视角与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              最好的测算纪律，是先找一个可观察的宽口径天花板，再向下收敛。广义 EDA 和 IP 软件池最干净的上限代理是既有厂商收入：CompaniesMarketCap 报告 Synopsys 2025 年收入约 8.00
              billion dollars，Cadence 为 5.29 billion dollars，合计约 13.29 billion dollars；2026 年过去十二个月池子也类似，为 13.52 billion
              dollar。这个视角仍不完美，因为这些收入包含 Ricursive 尚未替代的传统流程、IP 和企业关系。但它远比借用半导体资本开支或 AI 芯片收入更站得住。


              第二个视角是下游紧迫性。SEMI 预测 2025 年晶圆厂设备支出为 110 billion dollars，2026 年为 130 billion dollars，说明 AI
              相关芯片需求正在沿硬件栈推动资本形成。不过，这不能一比一转化为 Ricursive 的软件
              TAM。需要保留的矛盾是：围绕定制硅片的风投叙事在紧迫性方向上是对的，但当前已经变现的软件控制点远小于相邻硬件资金池。因此，这里的窄口径市场估算采用锚定既有厂商软件天花板的低 / 基准 /
              高区间，而不是锚定半导体总支出。
