        - 当前收入、软件 / 许可 / 服务属性，以及任何 ARR 口径
        - 没有收入形态，公开可比公司测算只能粗略代理。
        - 要求提供收入拆解、定价模型，以及确认收入与签约收入明细。
      - - 客户证明
        - 具名付费客户、项目规模、生产或试点状态、续约路径
        - 估值故事必须从战略兴趣转成付费采用。
        - 询问头部设计合作伙伴、合同阶段和用例结果。
      - - 基准结果
        - 相比在位工作流，实测布局时间、验证吞吐量和 PPA 改进
        - 这是技术优势转商业价值的核心证明。
        - 要求第三方基准包和客户推荐。
      - - 毛利率和算力成本
        - 训练 / 推理的单位经济、服务组合和交付模式
        - 如果算力或服务负担压住利润率，就很难支撑软件式倍数。
        - 复核队列级毛利率和算力 COGS 假设。
      - - Series A 条款
        - 优先股堆叠、董事会权利、按比例跟投结构，以及任何投资人保护
        - 经济吸引力可能与表面估值明显不同。
        - 获取股权结构表、股份购买协议和主要投资人侧信。
      - - 现金跑道和招聘计划
        - 现金消耗、招聘速度和算力资本开支承诺
        - 帮助判断本轮资金是在支持证明，还是只是在延长实验。
        - 要求运营计划、烧钱桥和算力基础设施承诺。
    notes: 买方若要在 2026 年 1 月投后估值基准之上显著承销，至少需要拿到这些尽调材料。
    claimRefs:
      - CV024
      - CV029
      - CV031
      - CV032
      - CV045
      - CV046
      - CV047
