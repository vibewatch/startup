chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              Ricursive Intelligence 于 2025 年 12 月 2 日公开亮相，是一家专注用 AI 加速半导体设计的前沿 AI
              实验室。公司官网和发布材料把它描述为在搭建自我改进系统：先从芯片设计切入，再把更好的模型和更好的硅片连成递归闭环。它的产品主张不只是单点 EDA
              工具；保留来源描述的是一个跨半导体设计栈优化版图、验证和架构探索的平台。TechCrunch 也报道称，Ricursive 在打造设计芯片的 AI
              工具，而不是自己制造芯片；这会影响后续尽调判断其商业模式、资本强度和潜在客户基础。

              公开地点证据指向 California 的 Palo Alto，而不是分布式多办公室。独立报道称 Ricursive 总部在 Palo Alto，当前 Ashby 招聘页也把所有开放岗位列为 Palo Alto
              现场办公。截至 2026-06-13 的运行日期，Ricursive 仍更适合被理解为一家刚推出的私人 Series A
              公司：它很快融到异常大额资金，但保留的公开来源没有具名客户、披露收入，也没有给出客户数指标。这个缺口让本章更侧重身份、资本和创始人质量分析，而不是常规牵引力承销。
