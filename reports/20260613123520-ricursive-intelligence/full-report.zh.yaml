      - number: '7.3'
        title: 出口管制和集中的半导体供应链可能推迟或压窄商业化路径
        blocks:
          - type: paragraph
            body: >-
              Ricursive 所处的价值链位置里，合规和供应链问题不是背景噪音。BIS 指引、法律分析和当前报道都指向一种监管格局：先进芯片、相关服务、远程用户，甚至晶圆代工产能转移，都已经成为需要承销的政策问题。2026
              年 1 月的规则变化为部分对中国和澳门出口引入了更灵活的路径，但代价是更严格的认证、KYC、测试和终端用户披露负担。2026 年 6
              月的澄清随后重申，中国母公司在中国境外的子公司仍在合规边界内。与此同时，生态的制造侧仍高度集中。Trade.gov 称，台湾仍掌握超过 60% 的晶圆代工收入和超过 90% 的领先制程制造；GAO 和 SEMI
              则显示，美国多元化正在推进，但时间尺度按多年甚至十年计算。对于一家未来可能需要跨境获得晶圆代工、封装、云和客户访问的创业公司，这意味着即使设计软件本身运行良好，商业节奏也可能被政策摩擦和瓶颈供应商卡住。
