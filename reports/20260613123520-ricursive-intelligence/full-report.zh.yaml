      - number: '6.4'
        title: 耐久性、集中度，以及仍需补足的尽调
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开证据最弱的一环。保留来源没有披露客户数量、试点到生产的转化率、合同期限、NRR、GRR、续约节奏，甚至没有清楚区分评估账户和生产账户。不能把这种缺失解读为失败信号；许多很年轻的基础设施公司都会把这些数字留在私下。但这也意味着，本章无法负责任地从创始人履历或融资速度推断留存质量、扩张效率或已安装客户基础的健康度。


              公开记录同样无法量化集中度风险，而这种不可量化本身就是风险信号。一家公司可以拥有广泛的主动咨询兴趣，却仍在商业上依赖一两个标杆设计伙伴来完成验证、路线图反馈和未来订单。如果 Ricursive
              第一个可见参考客户最终是一家前沿 AI 实验室或顶级芯片厂商，这个胜利会有战略价值——但也可能给客户带来谈判筹码，并扭曲公司的收入结构。在管理层披露更多信息之前，诚实的做法是保留这个缺口，而不是用尚未公开的客户
              logo、NPS 或留存主张去填补。


              客户尽调因此需要直接追问隐藏变量。最有决策价值的要求包括：具名参考客户包、带转化状态的试点漏斗、经遮盖的合同结构、在既有 EDA
              栈中的工作流位置、流片或验证结果证据，以及已签客户和近期管线的集中度数据。Ricursive 很可能在 NDA 背后已经拥有优秀的早期客户。当前公开记录只是尚未证明这一点。
