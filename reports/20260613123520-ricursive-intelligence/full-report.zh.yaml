      - number: '3.3'
        title: 切换成本和公开披露缺口目前有利于既有厂商与替代品
        blocks:
          - type: paragraph
            body: >-
              公开包装对比并不对称。Synopsys 和 Cadence 把 AI 功能呈现为既有企业流程的扩展，Synopsys 还特别把 DSO.ai 与 AWS ParallelCluster、AWS Batch 和
              Slurm 式 HPC 编排配套。Cadence 强调可复用的优化模型和设计师控制台，让工程师留在现有流程中。这些事实意味着，已经押注既有厂商栈的买方部署摩擦更低。相比之下，Ricursive
              的公开材料描述的是雄心、融资和团队质量，但没有披露定价、合同结构、安全证明、合规状态或具名客户胜利。这不代表公司没有这些东西；它意味着公开尽调尚不能把 Ricursive 视为已被企业验证。

              替代品在采用摩擦上也表现不错。circuit_training 是开源的，但只有具备强化学习和物理设计能力的精英团队才可能把它运营化。超大规模云厂商内部建设很昂贵，却给买方完整控制权。来自 NVIDIA 和
              AMD 的商用加速器根本不需要采用设计工具；它们靠硬件采购而非定制设计解决近期算力需求。这让 Ricursive
              被挤在中间。它近期最好的切入点不是最低摩擦部署，而是证明它能比既有单点工具或自建替代方案提供更广的自动化和更快迭代。
