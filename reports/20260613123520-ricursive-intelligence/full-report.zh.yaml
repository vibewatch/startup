      - number: '4.2'
        title: GTM 动作与销售效率代理
        blocks:
          - type: paragraph
            body: >-
              Ricursive 既不披露客户，也不披露商业指标，可用的公开 GTM 代理只能来自招聘和工作流背景。Ashby 招聘板显示七个开放岗位，全部在 Palo Alto 现场办公；保留的每个岗位都偏技术或安全：EDA
              算法、LLM
              基础设施、软件基础设施、设计验证、研究和创始安全。这种模式说明，公司可见支出仍投向产品和技术执行，而不是规模化外勤销售组织。它也说明商业模式不是自助式；关键任务芯片设计软件通常通过技术评估、工作流集成和共同开发进入账户，而不是购物车转化。


              缺少公开客户引用，意味着 CAC、回本周期和周期长度无法从公开证据测量。不过，工作流背景仍重要。如果 Ricursive 卖入 AMD、Intel、NVIDIA
              或超大规模云厂商级质量门槛的先进芯片项目，销售动作可能是高接触、技术中介型，即便最终毛利率轮廓看起来像软件。这形成了熟悉的私人公司模式：早期支出看起来研发偏重，而 GTM
              效率在公司开始具名试点、转化和扩张队列之前仍无法验证。
