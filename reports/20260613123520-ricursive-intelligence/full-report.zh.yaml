  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览：承销问题在于证明转化，而不只是技术雄心
        blocks:
          - type: paragraph
            body: >-
              Ricursive 的首要风险来自一条裂缝：技术出身极为亮眼，但商业化公开记录仍很薄。公司、投资人和独立报道都同意，芯片设计慢、贵且战略意义重大，这解释了 Ricursive 为什么能如此迅速融资 $335
              million。但同一组证据也显示，公司进入的是一个现有巨头已经交付 AI
              辅助设计产品的市场，先进节点验证仍然顽固地难，出口管制负担如今也延伸到远程访问、晶圆代工分配和客户筛查。公开证明主要来自创始人、投资人和继承自 AlphaChip
              的可信度，而不是具名客户、披露收入或独立基准胜利。这让风险彼此联动：技术证明缺口会拖慢采用，采用缺口会放大估值风险，出口和晶圆代工约束会推迟部署，一个小型专业团队还必须同时吸收所有压力。因此，本章的基准情景不是“科研项目失败”，而是半导体创业公司更常见的失败模式：令人印象深刻的技术履历，未能足够快地转化为可重复的商业证明。
