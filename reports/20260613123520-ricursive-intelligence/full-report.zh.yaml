      - number: '8.3'
        title: 反向情景、执行错配和情景框架
        blocks:
          - type: paragraph
            body: >-
              反向情景不是 Ricursive 缺少可信技术团队，而是商业估值可能跑在可复现差异化之前。New Scientist 记录了外部对 AlphaChip
              风格主张的严肃批评，包括公共证据尚未显示其相对于专家设计师或商业工具有稳定超额表现，以及强化学习方法可能需要多得多算力的质疑。与此同时，Synopsys 和 Cadence 已经在营销生产级 AI
              优化产品，Cadence 到 2026 年初仍在扩展其 AI 自动化栈。这意味着 Ricursive 不仅要证明 AI
              能帮助芯片设计，还要证明自家系统能创造足够增量的速度、功耗性能面积改进或工作流自动化，从而把预算从现有厂商那里拉走，或成为它们的战略层。悲观情景因此围绕执行错配展开：创始人叙事很强，人才和算力投入很高，但付费部署或经基准验证结果转化缓慢。基准情景大体维持当前估值，因为前沿
              AI 稀缺性和战略兴趣仍然真实。乐观情景则需要能被买家而不只是投资人看懂的可衡量商业牵引力、伙伴集成和技术胜利。
