      - number: '3.2'
        title: 开源传承、内部硅片团队和商用芯片制造替代压力
        blocks:
          - type: paragraph
            body: >-
              Ricursive 还暴露在非直接软件供应商的替代品下。创始人背后的 AlphaChip 传承现在部分通过 Google Research 的 circuit_training
              仓库开源，该仓库用分布式深度强化学习复现了 Nature 2021 年芯片布图规划方法。Sequoia 和 Ricursive 相关来源称 AlphaChip
              将布图规划从数月压缩到数小时，但独立报道没有那么干净：TechCrunch 和 New Scientist 复述了三代 TPU
              部署记录，并指出专家仍在争论公开证据能否证明其相较专家设计师或商业工具具备超人类表现。这个组合在竞争上重要：它验证创始人的技术履历，同时也说明成熟买方可以在内部研究或改造部分布图规划栈，而不是付费给新供应商。

              更大的替代威胁是内部硅片。Google、AWS 和 Microsoft 都公开描述了自研 AI 加速器——TPU、Trainium 和 Maia——用于优化各自平台内的训练或推理经济性。Microsoft 的
              Maia 200 页面更进一步，把自身与 Amazon Trainium 和 Google TPU 做基准对比。它们不是直接 EDA 竞争对手，但说明最先进的 AI
              基础设施买方常会通过搭建内部芯片组织和自研工具链来应对硬件瓶颈。更朴素的替代方案，是直接从 NVIDIA 或 AMD 购买商用加速器，而不是启动定制 ASIC 项目。对许多企业来说，这种现货选择在运营上比采用新的
              AI 芯片设计平台更容易。
