        - 缺少已披露收入、利润率和客户集中度，近期 IPO 支撑偏弱。
        - 数据室级别披露，使 Ricursive 能与上市同业比较。
    notes: 反向逻辑聚焦估值支撑和商业化证据，而不是否认 AI 芯片设计自动化的重要性。
