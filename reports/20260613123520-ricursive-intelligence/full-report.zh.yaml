  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Ricursive 应被分析为 AI 芯片设计自动化平台，而不是半导体制造商、晶圆厂、晶圆厂设备供应商或 AI
              芯片卖家。公司官网、发布材料和独立报道都把它放在软件层：帮助工程师更快创造定制硅片。这一区分很重要，因为前沿 AI 投资很容易借用 AI 加速器收入、晶圆代工收入或晶圆厂设备资本开支等巨大相邻数字，并称之为
              TAM。这些资金池是需求驱动因素或背景，但不是 Ricursive 销售进入的市场。


              最相关的纳入支出，是改善芯片设计工作流的软件和服务：布图规划、PPA 优化、设计收敛、验证辅助，以及在公司证明能超越版图之后可能延伸到的架构探索。现状替代方案仍是劳动密集型的既有 EDA
              流程，工程团队在成熟工具里手工迭代直到收敛。最近的相邻替代品，是 Synopsys 和 Cadence 已经销售的 AI 模块。这些既有厂商证明品类存在，但也收窄了边界：Ricursive
              可信的市场是芯片设计内部的自动化层，而不是整个半导体价值链。
