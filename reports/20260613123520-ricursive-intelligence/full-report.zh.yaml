  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及为什么 $4B 标记偏激进
        blocks:
          - type: paragraph
            body: >-
              Ricursive Intelligence 从 2025 年 12 月约 $750 million 的种子轮估值，跃升到 2026 年 1 月 Series A 轮投后估值 $4
              billion；彼时公司公开露面才几个月。在 2025-2026 年前沿 AI 市场里，这种跃升并非不可能，但即便按当前巨额融资轮标准也异常激进。现有证据显示，投资人押注的是创始人与愿景：Anna Goldie
              和 Azalia Mirhoseini 凭 AlphaChip 与 Google TPU 工作拥有罕见可信度，公司瞄准 AI 基础设施里的真实瓶颈，本轮也迅速由一批顶级 AI
              和半导体投资人联合完成。与此同时，公开记录没有披露收入、ARR、毛利率、客户数量或具名付费设计项目。因此，这笔融资定价的是未来平台相关性，而不是已证明的商业产出。向 $4 billion 投后估值投入 $300
              million 新股，也意味着新钱稀释只有约 7.5%，本轮把价格预期向上重置，却没有带来通常支撑耐久后期基准所需的运营透明度。
