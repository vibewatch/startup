      - number: '1.4'
        title: 里程碑、生态依赖与反向证据
        blocks:
          - type: paragraph
            body: >-
              Ricursive 公司年轻，里程碑记录不长，但信息密度很高。公司成立前最重要的里程碑，是创始人在 2018 年围绕 AI 驱动芯片设计展开合作，以及 2021 年 AlphaChip
              论文发表；二者共同构成创始人合法性的证据基础。公司里程碑随后快速推进：2025 年 12 月公开亮相并完成种子轮融资，2026 年 1 月完成大额 Series A，2026 年 6 月的招聘足迹仍围绕 Palo
              Alto 一个办公室展开。产品叙事也从布图规划传承扩展为更广泛的全栈设计平台；TechCrunch 报道的工作流从组件放置一直延伸到设计验证。

              主要风险在外部依赖和证明不透明。Ricursive 并不孤独：Synopsys DSO.ai 和 Cadence Cerebrus 表明，AI
              辅助芯片设计已经是商业品类，所以公司必须证明全栈差异化，而不只是“EDA 里的 AI”。与此同时，Google TPU、AWS Trainium 和 Microsoft Maia
              证明超大规模云厂商对定制硅片有真实需求，这有助于解释投资人热情。监管敞口是间接但仍重要的，因为 BIS、CSIS 和 Morrison Foerster 都显示，先进计算和 AI
              芯片生态仍受不断变化的美国出口管制和执法规则约束。最后，New Scientist 的批评和缺少具名设计胜利意味着，Ricursive 的技术投资逻辑有吸引力，但外部尚未定论。
