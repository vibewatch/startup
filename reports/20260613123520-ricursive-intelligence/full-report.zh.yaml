  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从稀缺创始人和市场需求，推导到当前观察 / 继续研究建议的决策链。
    data:
      nodes:
        - id: n1
          label: 稀缺创始人和 AlphaChip 可信度
          detail: Goldie 和 Mirhoseini 在 AI 驱动芯片设计上带来罕见可信度。
        - id: n2
          label: 真实市场瓶颈
          detail: 超大规模云厂商持续投入定制 AI 硅和更快迭代。
        - id: n3
          label: $4B 标记过早出现
          detail: 从种子轮到 Series A 的估值跃升，发生在公开财务披露之前。
        - id: n4
          label: 既有 AI-EDA 产品已存在
          detail: Synopsys 和 Cadence 已在销售 AI 芯片设计自动化产品。
        - id: n5
          label: 公开收入证明缺失
          detail: Ricursive 未披露公开收入、利润率、ARR 或客户数。
        - id: n6
          label: 反向技术质疑
          detail: 外部专家质疑 AlphaChip 式优势是否已经被充分证明。
        - id: n7
          label: 建议：观察 / 继续研究
          detail: 商业证据补强之前，这一估值可以观察，但还不能有把握地追。
      edges:
        - from: n1
          to: n7
          label: 支撑上行空间
        - from: n2
          to: n7
          label: 支撑上行空间
        - from: n3
          to: n7
          label: 设定入场纪律
        - from: n4
          to: n7
          label: 抬高举证门槛
        - from: n5
          to: n7
          label: 限制确信度
        - from: n6
          to: n7
          label: 抬高下行风险
    approximationNotes: 这条路径是分析框架，不是机械流程；它把主要估值驱动因素压缩成一条可提交投委会的建议路径。
