  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 目标客户原型、买方-用户-付款方图谱与工作流位置
        blocks:
          - type: paragraph
            body: >-
              虽然公开记录不支持公开客户名单，但它支持相当具体的客户形状。Ricursive 卖的不是成品芯片，而是把芯片设计加速投资逻辑卖给那些已经背负昂贵硅片路线图、大额算力预算和痛苦 PPA 取舍的组织。这首先指向前沿
              AI 实验室和超大规模云厂商，其次是大型无晶圆厂半导体供应商，再其次是因为推理规模或硬件差异化具备经济意义、因而能证明内部 ASIC 项目合理性的系统公司。可见类比都在这个世界里：TSMC
              的庞大晶圆代工客户基础、AWS 和 Google 的定制硅片项目，以及优化先进制程 SoC 的 Cadence 和 Synopsys 客户。


              在一个账户内，买方、用户和付款方不太可能是同一个人。买方可能是关心流片时间和总系统经济性的算力、平台或硅片项目负责人。用户更可能是活在 EDA
              工作流里的物理设计、验证或架构团队。付款方则是为芯片路线图出资的更广企业预算负责人。这个分裂很重要，因为它意味着漫长、技术中介型销售动作，而不是轻量产品驱动采用。Ricursive
              自己的招聘板强化了这种解读：公开招聘仍集中在 EDA 算法、基础设施、验证、研究和安全，而不是外勤销售或规模化客户成功。


              Sequoia
              的“designless”框架也有信息量。这个主张不只是让现有芯片团队工作更快；它还意味着更多公司可能成为芯片买方或芯片项目赞助方，而不必建立庞大的内部设计组织。如果这一投资逻辑成立，Ricursive 的
              TAM 可能从传统无晶圆厂供应商延伸到想要定制硅片、但不想从零复制完整 Broadcom、Google 或 NVIDIA 式芯片组织的 AI 实验室和系统公司。但这仍是目标客户假设，不是 Ricursive
              已证明的业务账本。
