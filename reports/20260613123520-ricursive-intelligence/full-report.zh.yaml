  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于证据质量和执行里程碑，给出 Ricursive 的悲观、基准、乐观估值走廊，单位为十亿美元。
    data:
      items:
        - label: 悲观情景
          low: 2.5
          mid: 2.9
          high: 3.25
          unit: $B
        - label: 基准情景
          low: 3.5
          mid: 4
          high: 4.5
          unit: $B
        - label: 乐观情景
          low: 5
          mid: 5.5
          high: 6
          unit: $B
        - label: 概率加权中枢
          low: 3.7
          mid: 3.9
          high: 4.1
          unit: $B
    approximationNotes: 情景区间为分析师估计，既保留不确定性，也围绕最新融资估值锚定。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 一张投委会式评分卡，覆盖最能决定 Ricursive 是否配得上高于叙事估值的关键维度。
    data:
      items:
        - label: 市场需求
          value: 8/10
          note: 定制 AI 芯片需求真实存在，设计复杂度也在上升。
        - label: 创始人 / 人才质量
          value: 9/10
          note: AlphaChip 背景和招聘信号都异常强。
        - label: 技术证明可见度
          value: 6/10
          note: 概念可信，但相对既有厂商的公开基准数据仍然偏薄。
        - label: 客户证明
          value: 3/10
          note: 战略兴趣已经看得到；具名付费客户证据还没有。
        - label: 经济模型可见度
          value: 2/10
          note: 目前没有公开收入、利润率或 ARR 披露。
        - label: 竞争隔离度
          value: 4/10
          note: 既有 EDA 厂商已经在商业化 AI 辅助设计工具。
        - label: 估值支撑
          value: 4/10
          note: 只有商业证据很快落地，$4B 估值才说得通。
        - label: 证据质量
          value: 5/10
          note: 融资和市场叙事来源扎实；变现证据仍留在私域。
    approximationNotes: 分数是基于有来源证据形成的分析判断，并非公司披露，也不是管理层给出的量化评级。
    claimRefs:
      - CV014
      - CV024
      - CV025
      - CV031
      - CV036
      - CV045
      - CV047
