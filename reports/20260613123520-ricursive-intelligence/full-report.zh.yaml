        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求侧是真实的。超大规模云厂商已经规模化运行自研硅片项目：AWS 推广用于 AI 训练和推理的 Trainium，Google 称 TPU 支撑 Gemini 和更广泛的 AI 栈，Microsoft 称
              Maia 200 改善其自有机群内的推理经济性。再叠加 Lightspeed 的观点——顶级硅片项目仍会消耗数年和数亿美元——增长驱动逻辑很强。Ricursive
              不需要全世界每家半导体公司都购买其平台才有意义；它只需要在时间和人才最稀缺的定制硅片项目中拿到有意义份额。


              约束侧同样重要。公开证明仍在布图规划和 PPA 优化上最强，而验证和全栈自动化等更宽主张尚未得到具名设计胜利或公开基准支持。New Scientist 对 AlphaChip
              公开证明的怀疑很重要，因为关键任务设计软件买方对可复现性、保密性和切换成本异常敏感。出口管制又增加了一层摩擦，因为它会塑造哪些客户、晶圆厂和伙伴可以被干净服务。估值上，这意味着 Ricursive
              应围绕证明里程碑和企业采用证据承销，而不是只靠宽口径 TAM 叙事。
