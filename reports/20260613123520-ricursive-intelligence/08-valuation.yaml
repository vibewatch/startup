  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Benchmark gap vs incumbents
        - No clear improvement versus Synopsys/Cadence workflows on customer-relevant designs
        - Undercuts the central claim that Ricursive is a differentiated platform rather than a prestige project.
        - Move valuation stance toward bear case and demand materially lower entry pricing.
      - - No named paying customers
        - Next financing still arrives without customer names, paid pilots, or revenue ranges
        - Signals commercial proof is lagging capital deployment.
        - Keep recommendation at research-more or below.
      - - Technical critique persists
        - Third-party replication still fails to show clear AlphaChip-style superiority
        - Raises odds that narrative outpaced reproducible advantage.
        - Treat the company as experimental infrastructure R&D, not as a scaled software platform.
      - - Policy friction rises
        - Export-control or ecosystem rules constrain cross-border AI-chip programs
        - Can slow customer acquisition and narrow partner set.
        - Increase required margin of safety and shorten underwriting horizon.
      - - Terms overhang surfaces
        - Series A preferences, ratchets, or governance rights materially reduce common-equity upside
        - Can make a headline $4B valuation less attractive economically.
        - Rebuild return math from the cap table before any commitment.
    notes: >-
      Each trigger is chosen because it can change either the probability-weighted
      valuation corridor or the economic attractiveness of buying into the current
      mark.
    claimRefs:
      - CV017
      - CV033
      - CV036
      - CV037
      - CV040
      - CV045
      - CV047
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Revenue model
        - Current revenue, whether software/license/services, and any ARR framing
        - Without revenue shape, public comp math is only a proxy exercise.
        - Request revenue bridge, pricing model, and recognized-vs-booked revenue detail.
      - - Customer proof
        - Named paying customers, program size, production vs pilot status, renewal path
        - The valuation story must convert from strategic interest to monetized adoption.
        - Ask for top design partners, contract stage, and use-case outcomes.
      - - Benchmark results
        - Measured time-to-layout, verification throughput, and PPA improvement versus incumbent workflows
        - This is the core technical-to-commercial conversion proof.
        - Request third-party benchmark package and customer references.
      - - Gross margin and compute cost
        - Unit economics for training/inference, services mix, and delivery model
        - A software-like multiple is hard to support if compute or services burden margins.
        - Review cohort-level gross margin and compute COGS assumptions.
      - - Series A terms
        - Preference stack, board rights, pro rata structure, and any investor protections
        - Economic attractiveness can differ materially from the headline valuation.
        - Obtain cap table, stock purchase agreement, and major investor side letters.
      - - Runway and hiring plan
        - Cash burn, hiring velocity, and compute capex commitments
        - Helps judge whether the current round funds proof or merely extends experimentation.
        - Request operating plan, burn bridge, and compute-infrastructure commitments.
    notes: >-
      These are the minimum diligence items required before a buyer should
      underwrite meaningfully above the January 2026 post-money benchmark.
