tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Track / research-more
        - Wait for commercial proof before underwriting a buy case.
      - - Confidence
        - Medium
        - The founder and market case are credible, but public operating proof is thin.
      - - Risk rating
        - High
        - Execution, commercialization, and valuation-support risk remain substantial.
      - - Valuation stance
        - Stretched
        - The $4B mark prices future success more than disclosed current performance.
      - - Current anchor
        - January 2026 $4B post-money Series A
        - Treat it as the latest market-clearing private mark, not as proven intrinsic value.
      - - Adverse lens
        - Execution mismatch vs incumbents
        - Technical promise may not translate into benchmarked commercial advantage.
      - - Upgrade trigger
        - Named paying customers plus benchmarked design wins
        - Would improve confidence that the mark is supported by real demand.
      - - Primary downside trigger
        - No revenue proof or weak benchmark data by next financing
        - Would increase risk of narrative compression or a flat/down follow-on round.
    notes: >-
      Recommendation is explicitly price-sensitive and evidence-sensitive; it is not
      a generic verdict on founder quality.
