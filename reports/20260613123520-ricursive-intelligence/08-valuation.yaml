        - Latest market-clearing private price
        - Primary anchor for current entry discipline.
        - Still lacks public revenue, margin, or customer disclosure.
      - - Synopsys
        - Public / Jun 2026
        - $86.91B market cap; $8.00B TTM revenue
        - ~10.9x market-cap/revenue
        - EDA incumbent with direct AI-chip-design relevance.
        - Large, mature, diversified public company.
      - - Cadence
        - Public / Jun 2026
        - $106.17B market cap; $5.52B TTM revenue
        - ~19.2x market-cap/revenue
        - Closest public AI-EDA workflow comp set.
        - Also mature, global, and already commercialized.
      - - NVIDIA
        - Public / Jun 2026
        - $4.969T market cap; $215.93B TTM revenue
        - ~23.0x market-cap/revenue
        - Upper-bound AI infrastructure scarcity proxy.
        - Hardware platform leader, not a startup software-tool comp.
      - - AMD
        - Public / Jun 2026
        - $834.16B market cap; $34.63B TTM revenue
        - ~24.1x market-cap/revenue
        - Additional AI-silicon proxy in a fast-growing fabless model.
        - Still much larger and far more disclosed than Ricursive.
      - - Unconventional AI
        - Private / Dec 2025
        - $4.5B valuation; $475M seed
        - Narrative peer for frontier AI-infrastructure scarcity
        - Shows that multibillion-dollar seed marks exist in the current market.
        - Not a direct chip-design-automation comp.
      - - Humans&
        - Private / Jan 2026
        - $4.48B valuation; $480M seed
        - Narrative peer for frontier-AI paper pricing
        - Confirms that investors sometimes pay extreme premiums for team and narrative.
        - Says little about Ricursive’s eventual monetization.
    notes: >-
      Public-company revenue proxies use market-cap and TTM revenue snapshots.
