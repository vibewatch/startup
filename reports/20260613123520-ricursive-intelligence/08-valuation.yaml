  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Founders and technical credibility
        - AlphaChip pedigree and rare talent density justify premium attention.
        - Prestige alone does not prove that Ricursive beats commercial EDA workflows in production.
        - Independent benchmark data versus incumbent baselines.
      - - Market need
        - AI labs and hyperscalers clearly need faster custom-silicon iteration.
        - A real market bottleneck does not guarantee Ricursive captures attractive economics.
        - Signed paid programs and expansion evidence across multiple buyers.
      - - Financing quality
        - Elite investors quickly syndicated $335M total financing.
        - The 5.3x valuation jump happened before revenue disclosure, so price may reflect scarcity more than traction.
        - Fresh financing or secondary pricing tied to operating disclosure.
      - - Competitive position
        - Ricursive could become a strategic enabling layer for chip makers and cloud labs.
        - Synopsys and Cadence already ship AI optimization tools with customer references.
        - Proof that Ricursive delivers better time-to-results or PPA on meaningful designs.
      - - Technology narrative
        - Recursive AI-hardware co-evolution is a powerful long-term story.
        - Public adverse coverage says AlphaChip-style superiority remains contested and compute intensive.
        - Reproducible third-party validation on current industrial workloads.
      - - Exit logic
        - Scarcity could support another premium private round or strategic partnership.
        - Near-term IPO support is weak without disclosed revenue, margins, and customer concentration.
        - Data-room quality disclosures that make Ricursive comparable to public peers.
    notes: >-
      Anti-thesis arguments focus on valuation support and commercialization
      evidence, not on denying the importance of AI-chip design automation.
