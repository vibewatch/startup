  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-disclosure
      missingEvidence: Current revenue, ARR, gross margin, customer count, and any pricing model segmentation.
      whyItMatters: Without operating metrics, the $4 billion mark cannot be triangulated against public revenue multiples with confidence.
      diligencePath: Request management reporting pack, revenue bridge, pricing sheets, and customer concentration snapshot.
      relatedQuestionRefs:
        - QV005
        - QV017
        - QV018
        - QV030
    - type: private-evidence-only
      severity: material
      topic: series-a-terms
      missingEvidence: Cap table, liquidation preferences, pro rata rights, board rights, and any ratchet or side-letter protections in the January 2026 Series A.
      whyItMatters: Headline valuation can materially overstate economic attractiveness if preference or governance terms are aggressive.
      diligencePath: Obtain stock purchase agreement, investor rights agreement, cap table, and board deck from counsel.
      relatedQuestionRefs:
        - QV028
      relatedTableRefs:
        - TV006
    - type: missing-source
      severity: material
      topic: benchmark-proof
      missingEvidence: Independent benchmark data showing time-to-design, verification throughput, and PPA outcomes versus Synopsys or Cadence baselines.
      whyItMatters: This is the most important bridge between Ricursive’s technical narrative and sustainable commercial advantage.
      diligencePath: Request third-party benchmark package, customer reference calls, and benchmark methodology review.
      relatedQuestionRefs:
        - QV029
      relatedTableRefs:
        - TV005
        - TV006
    - type: private-evidence-only
      severity: material
      topic: customer-proof
      missingEvidence: Named paying customers, program scope, production versus pilot status, and renewal or expansion signals.
      whyItMatters: Strategic interest is not the same as monetized adoption, and adoption quality determines whether the valuation can compound.
      diligencePath: Request top-customer list, contract stage, program economics, and pipeline conversion metrics.
      relatedQuestionRefs:
        - QV014
        - QV030
      relatedTableRefs:
        - TV006
    - type: enumeration-incomplete
      severity: minor
      topic: TV004 comparable coverage
      missingEvidence: Additional private and public valuation references covering more chip-design and frontier-AI transactions.
      whyItMatters: TV004 is intentionally partial and should be read as a decision-useful sample rather than a full universe of comparable transactions.
      diligencePath: Extend the comp set with more direct startup financings, relevant M&A, and additional listed EDA or semiconductor tooling companies during the next refresh.
      relatedTableRefs:
        - TV004
