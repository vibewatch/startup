  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability signal
      - Valuation range
      - Key assumptions
      - Main failure mode
    rows:
      - - Bear
        - 30%
        - $2.5B-$3.25B
        - Ricursive wins attention but not enough benchmarked or paid traction to justify the January 2026 premium.
        - Next financing needs to reprice around evidence rather than scarcity.
      - - Base
        - 50%
        - $3.5B-$4.5B
        - The company converts investor enthusiasm into early commercial programs but still lacks full operating disclosure.
        - Commercial proof arrives slower than the hiring and compute spend ramp.
      - - Bull
        - 20%
        - $5.0B-$6.0B
        - Ricursive demonstrates measurable design-cycle compression and PPA gains on important customer programs, making the platform strategically scarce.
        - Incumbents match the feature set before Ricursive scales revenue.
      - - Probability-weighted center
        - 100%
        - ~$3.7B-$4.1B
        - The current round is roughly defensible only if the base case begins to materialize over the next 12-18 months.
        - Absent milestones, the weighted center drifts below the last mark.
    notes: >-
      Ranges are analyst scenario frames, not company guidance; they preserve
      uncertainty because Ricursive has not disclosed revenue or margin inputs.
