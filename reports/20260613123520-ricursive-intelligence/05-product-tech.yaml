  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: trust-gap
    missingEvidence: Public evidence does not show a trust center, security architecture, certification inventory, or PDK/data-isolation controls for Ricursive.
    whyItMatters: Enterprise semiconductor buyers will care about design-IP isolation, model access controls, and signoff trust before giving a new vendor sensitive chip data.
    diligencePath: Request security whitepaper, certification packet, data-flow diagram, tenant-isolation controls, and PDK / design-file handling policy.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE028
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: customer-proof-gap
    missingEvidence: No named customer, design win, production benchmark, or signed deployment reference appears in the retained public pack.
    whyItMatters: Without customer proof, public diligence cannot separate a promising platform thesis from a workflow that has not yet cleared enterprise adoption hurdles.
    diligencePath: Request customer list by stage, benchmark reports versus incumbent flows, and at least two production references.
    relatedQuestionRefs:
    - QE020
    - QE024
    relatedTableRefs:
    - TE002
    - TE005
  - type: private-evidence-only
    severity: material
    topic: deployment-fit
    missingEvidence: Public materials do not disclose foundry, signoff, PDK, or enterprise integration mechanics.
    whyItMatters: Deployment into real chip programs depends on where Ricursive plugs into incumbent EDA flows, how it handles closed design data, and how results are validated.
    diligencePath: Request architecture deep dive covering signoff boundary, PDK custody, APIs/connectors, workload handoffs, and rollback paths into Synopsys/Cadence flows.
    relatedQuestionRefs:
    - QE014
    - QE016
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: corroboration-gap
    missingEvidence: The retained public award-archive fetches do not fully corroborate the most recent 2026 C3PO award claim outside NVIDIA and Ricursive-linked surfaces.
    whyItMatters: The claim itself may still be true, but independent corroboration depth is thinner for the newest lineage milestone than for AlphaChip.
    diligencePath: Re-check conference award archives or proceedings after publication lag clears, and request the canonical conference citation from the company.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE005
  - type: stale
    severity: minor
    topic: release-discipline
    missingEvidence: No public changelog, uptime history, or versioned release discipline for the Ricursive product surface is visible in retained sources.
    whyItMatters: A missing release trail makes it harder to distinguish shipped capability from roadmap narrative and to judge operational maturity over time.
