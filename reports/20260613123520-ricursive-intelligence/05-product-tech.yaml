- id: architecture-and-technical-lineage
  title: Architecture and technical lineage
  body: 'The most credible part of Ricursive’s technical story is its lineage. AlphaChip’s Nature paper and the public circuit_training repository show a real reinforcement-learning approach to floorplanning rather than a generic AI wrapper, and Sequoia plus Lightspeed say that lineage compressed floorplanning from months to hours and was used across four TPU generations. Ricursive’s current product claim sits on top of that base layer. Public sources say the platform should learn across chips, and the founders’ named lineage now extends into RL-CCD for clock-and-data optimization, INSTA for differentiable timing analysis, and C3PO for commercial-quality placement objectives. That progression matters because it suggests a path toward a broader optimization stack: search, reward modeling, timing-aware evaluation, and placement-quality objectives. It also sets boundaries. The retained evidence is still richer on research artifacts than on Ricursive-specific implementation details, so the architecture
    visible to outside diligence is a layered inference—optimization engines above fast evaluators above compute and incumbent-flow dependencies—rather than a documented enterprise blueprint.'
