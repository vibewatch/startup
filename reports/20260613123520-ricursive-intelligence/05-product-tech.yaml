- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Ricursive solution
  - Measurable benefit
  - Limitation
  rows:
  - - Macro placement and floorplanning
    - Senior physical-design engineers iterate for weeks or months
    - AlphaChip-style RL automates layout search
    - Months-to-hours floorplanning compression is the best-supported public benchmark
    - Benchmark comes from lineage artifacts, not a Ricursive customer case
  - - Timing-sensitive optimization
    - Teams re-run signoff and local timing fixes repeatedly
    - INSTA/RL-CCD lineage implies faster timing-aware evaluation inside optimization loops
    - Public lineage points to sub-second timing propagation and differentiated timing gradients
    - No public proof that Ricursive exposes this as a product workflow
  - - Cross-program learning
    - Each new chip program usually starts with fresh heuristics
    - Ricursive says each chip designed should improve the next designer
    - Potentially higher reuse and faster iteration across programs
    - No public deployment or transfer-learning results are published
  - - Design verification handoff
    - Verification often sits downstream of placement changes
    - TechCrunch says Ricursive intends to cover verification too
    - Could reduce rework between optimization and validation
    - No public detail on verification coverage, toolchain, or acceptance criteria
  - - Custom-silicon access for smaller teams
    - Non-hyperscalers often cannot field huge chip-design orgs
    - Investor materials position Ricursive as enabling designless custom silicon
    - Could widen the buyer pool beyond giants with massive internal teams
    - No public case study shows a smaller team reaching tapeout with Ricursive
  - - Enterprise adoption into incumbent flows
    - Existing EDA buyers already use Synopsys or Cadence stacks
    - Ricursive would need to plug into those flows rather than replace them overnight
    - Potential for broader automation than point tools if integration works
    - Public integration boundary, signoff path, and rollback plan remain undisclosed
  notes: Benefit statements reflect the strongest public lineage evidence and incumbent comparison context; Ricursive-specific production outcomes remain unproven publicly.
