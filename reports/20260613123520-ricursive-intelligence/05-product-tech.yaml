- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Design-intent ingestion
    - Translate workload or architecture goals into optimization objectives
    - Customer design data, constraints, and closed EDA inputs
    - No public evidence on file formats, APIs, or how closed PDK data is handled
  - - Optimization policy layer
    - Search large design spaces for better placement / closure choices
    - Reinforcement-learning or learned-search techniques from AlphaChip lineage
    - Transfer from lineage to Ricursive product is plausible but not directly benchmarked
  - - Fast evaluators and reward models
    - Score candidate placements and timing outcomes quickly
    - Timing-analysis engines, placement metrics, routability and wirelength estimators
    - Public proof exists in lineage artifacts, not as Ricursive enterprise documentation
  - - Verification and signoff boundary
    - Validate whether changes hold up beyond optimization loop
    - External verification tools and incumbent signoff systems
    - Ricursive has not publicly disclosed where its platform stops and signoff begins
  - - Compute and orchestration substrate
    - Run many design experiments quickly and economically
    - Cloud or internal clusters plus scheduling/orchestration
    - No public detail on cluster topology, workload routing, or failure handling
  - - Incumbent EDA interop
    - Connect into Synopsys/Cadence-centered customer flows
    - Customer licenses, scripts, PDKs, and flow ownership
    - Deployment friction may stay high unless Ricursive augments incumbent flows cleanly
  - - Governance and geo-compliance layer
    - Screen customer programs and technology access
    - Export-control policies and customer diligence
    - Semiconductor and AI controls can constrain where and how the product is sold
  notes: This architecture table maps only the layers that are visible or inferable from retained sources. Missing integration specifics are preserved as risks rather than guessed away.
