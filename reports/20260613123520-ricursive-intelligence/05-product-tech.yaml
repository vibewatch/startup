callouts:
- calloutType: strength
  title: The moat is strongest where lineage broadens from placement into timing-aware evaluation
  body: AlphaChip alone would support a strong placement story, but RL-CCD, INSTA, and C3PO widen the founders’ visible record into timing, optimization, and placement-quality objectives. That breadth is the clearest public reason to believe Ricursive could become more than a single-point EDA feature.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
- calloutType: risk
  title: Enterprise deployment trust is still the public weak spot
  body: 'Ricursive’s official surfaces do not yet provide the trust and operating proof that enterprise chip programs usually demand: no public security center, no customer references, no release trail, and no signoff-boundary documentation. That matters more than valuation or pedigree when the workload contains high-value design IP.'
  claimRefs:
  - CE019
  - CE040
  - CE041
- calloutType: recommendation
  title: Underwrite Ricursive as an augmentation layer until signoff and customer proof appear
  body: The practical deployment assumption should be coexistence with Synopsys and Cadence flows rather than immediate displacement. Ask management to show where Ricursive starts and stops in the flow, how it handles closed design data, and which customers have already trusted it in production.
  claimRefs:
  - CE014
  - CE031
  - CE039
  - CE047
