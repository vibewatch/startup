company:
  name: Ricursive Intelligence
chapter:
  number: 1
  title: Company Overview
  summary: Ricursive Intelligence is a Palo Alto-based private frontier AI lab that
    publicly launched on 2025-12-02 with a $35 million seed round and then raised
    a $300 million Series A at a $4 billion valuation on 2026-01-26. The company
    is founded and still led by AlphaChip researchers Anna Goldie and Azalia Mirhoseini,
    and is positioning a full-stack AI platform for semiconductor design rather
    than a chip-manufacturing business. Public evidence supports exceptional founder-market
    fit and financing velocity, but not named customers, revenue, headcount, or
    full governance disclosure.
sections:
  - id: identity-product-stage
    title: Identity, product, and stage
    body: >-
      Ricursive Intelligence emerged publicly on 2 December 2025 as a frontier AI
      lab focused on using AI to accelerate semiconductor design. Its own site and
      launch materials frame the company as building self-improving systems that
      start with chip design and then close a recursive loop between better models
      and better silicon. The product claim is broader than a point EDA utility:
      retained sources describe a platform intended to optimize layout, verification,
      and architecture exploration across the semiconductor design stack. TechCrunch
      also reports that Ricursive is building AI tools that design chips rather than
      fabricating chips itself, which matters for how later diligence should think
      about its business model, capital intensity, and likely customer base.

      Public location evidence points to Palo Alto, California rather than a distributed
      multi-office footprint. Independent coverage describes Ricursive as Palo Alto-based,
      and the current Ashby job board lists all open roles as on-site in Palo Alto.
      As of the 2026-06-13 run date, Ricursive is still best understood as a newly
      launched private Series A company: it has raised unusually large amounts of
      capital very quickly, but retained public sources do not name customers, disclose
      revenue, or provide a customer-count metric. That gap pushes this chapter toward
      identity, capital, and founder-quality analysis rather than conventional traction
      underwriting.
