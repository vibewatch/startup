callouts:
  - calloutType: strength
    title: Financing speed is exceptional even by frontier-AI standards
    body: Ricursive moved from public launch and a $35 million seed on 2025-12-02 to
      a $300 million Series A at a $4 billion valuation on 2026-01-26. That pace signals
      unusually strong founder-market fit and investor urgency around semiconductor
      design as an AI bottleneck.
    claimRefs:
      - CO001
      - CO008
      - CO024
      - CO038
  - calloutType: risk
    title: Public traction proof is much thinner than public financing proof
    body: The retained public record is rich on capital and founder pedigree but thin
      on named customers, pricing, revenue, customer count, or disclosed design wins.
      Later chapters should treat customer and economic diligence as high-priority gap-closing
      work rather than as already validated facts.
    claimRefs:
      - CO011
      - CO021
      - CO039
      - CO040
  - calloutType: risk
    title: Ricursive's technical thesis is credible but not uncontested
    body: Nature, GitHub, Sequoia, and company-linked materials all support the founders'
      AlphaChip credentials, yet New Scientist documents expert skepticism about the
      strength and reproducibility of the “superhuman” narrative. That pushes diligence
      toward proof of real customer outcomes rather than founder reputation alone.
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO015
      - CO017
  - calloutType: insight
    title: Export-control exposure is indirect but relevant from day one
    body: Ricursive is not a public chip exporter in the retained record, but the customers,
      compute providers, and ecosystem partners it likely needs operate inside a moving
      U.S. export-control regime. That matters for market selection, partner diligence,
      and any future cross-border design or cloud-delivery workflows.
    claimRefs:
      - CO030
      - CO031
      - CO032
      - CO033
      - CO035
