  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: A current board roster, board observers, committee structure, and a fuller executive directory beyond the two founders.
      whyItMatters: Governance visibility is necessary to assess real management depth, investor control, and succession resilience in a founder-concentrated company.
      diligencePath: Request board materials, an org chart, and the latest financing governance package from the company or lead investors.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: blocking
      topic: commercial-traction
      missingEvidence: Named customers, revenue or ARR, customer count, design-win evidence, pricing, and any conversion from pilots to contracted engagements.
      whyItMatters: Public financing speed is not a substitute for commercial proof, and downstream customer and valuation chapters require concrete traction data.
      diligencePath: Ask for customer references, signed statements of work, revenue bridge materials, and a pipeline conversion report.
      relatedQuestionRefs:
        - QO014
        - QO025
        - QO026
      relatedTableRefs:
        - TO004
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: Current employee count, function mix, and geographic distribution beyond the seven public openings.
      whyItMatters: Hiring intensity alone cannot show whether Ricursive has the engineering depth to execute on a full-stack design platform.
      diligencePath: Request an anonymized headcount by function and location plus historical hiring and attrition trends.
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO001
    - type: missing-source
      severity: material
      topic: capital-structure
      missingEvidence: Cap table, ownership by round, any secondaries, and confirmation of whether debt, venture credit, or other structured financing exists off the retained public record.
      whyItMatters: The round sizes are large enough that preference stack, concentration, and hidden structured capital could materially affect later valuation analysis.
      diligencePath: Request the latest cap table, financing documents, and investor-rights summaries from counsel or the finance team.
      relatedQuestionRefs:
        - QO013
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: minor
      topic: legal-entity-details
      missingEvidence: Formal legal incorporation date and registered office for Ricursive Intelligence.
      whyItMatters: The company can still be analyzed without it, but later legal and diligence workflows should anchor on the actual legal entity rather than public launch date.
      diligencePath: Pull state incorporation records or ask the company for formation documents.
      relatedQuestionRefs:
        - QO001
