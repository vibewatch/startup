  - id: founders-leadership-governance
    title: Founders, leadership, governance, and key-person dependence
    body: >-
      Ricursive's investability currently rests heavily on two people: co-founder
      CEO Anna Goldie and co-founder CTO Azalia Mirhoseini. Their founder-market
      fit is unusually strong because the company is directly commercializing a thesis
      they developed together over years of research on AI-assisted chip design.
      Nature's 2021 AlphaChip paper established the technical lineage, Sequoia's
      podcast notes that AlphaChip reduced floorplanning from months to hours, and
      Google Research's circuit_training repository describes the framework as open-source
      and used across Alphabet and outside it. The result is a rare case where the
      company's origin story, technical method, and recruiting pitch all point at
      the same core capability.

      That said, the public record is not perfectly clean. Multiple Ricursive-linked
      sources say AlphaChip has influenced four TPU generations, while New Scientist's
      2024 critique says Google DeepMind described three TPU generations and quotes
      experts arguing that public evidence for “superhuman” performance remains insufficient.
      This is not a thesis-breaker, but it does mean the founding narrative should
      be treated as credible-yet-contested rather than as settled fact. Governance
      disclosure is also thin: retained public sources consistently identify the founders
      in the CEO and CTO roles, but do not publish a board roster or a broader executive
      directory. That leaves Ricursive with concentrated key-person risk and limited
      outside visibility into management depth beyond the founding pair.
    claimRefs:
