  - id: capital-base-investor-map
    title: Capital base, investor map, and scale indicators
    body: >-
      Ricursive's financing speed is the single most striking company-overview fact.
      The company launched with a $35 million seed round at a $750 million valuation
      on 2025-12-02, then announced a $300 million Series A at a $4 billion post-money
      valuation on 2026-01-26. TechCrunch later summarized total capital raised at
      $335 million, and Ricursive's own site repeats that figure while naming Sequoia,
      Lightspeed, DST, and NVentures among the backers. On a simple arithmetic basis,
      the valuation increased roughly 5.3x from seed to Series A in under two months,
      which is extraordinary even by 2026 frontier-AI standards.

      The investor mix matters as much as the raw amount. Sequoia led the seed. Lightspeed
      led the Series A. The company and independent press also name DST Global, NVentures,
      Felicis, 49 Palms, Radical, and others. Investor writeups suggest that the round
      was driven at least as much by founder pedigree and the hardware-software co-design
      thesis as by already disclosed commercial traction. Public signals of scale are
      still early-stage rather than mature: the official site says Ricursive is scaling
      a small, elite team, and the jobs page shows seven open onsite roles across
      core product, infrastructure, research, and security. No retained financing
      source discloses debt, revenue, or a cap-table breakdown, so later chapters
      should treat current capitalization as well funded but still structurally opaque.
