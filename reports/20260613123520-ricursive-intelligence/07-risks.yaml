callouts:
  - calloutType: risk
    title: >-
      The main technology risk is verification credibility, not lack of founder pedigree
    body: >-
      Ricursive inherits real AlphaChip credibility, but public underwriting still turns on whether that heritage translates into reproducible, customer-relevant advantages against incumbent flows. The unresolved critique is benchmark trust.
    claimRefs: [CR008, CR010, CR011, CR017, CR018]
  - calloutType: risk
    title: >-
      Export controls now touch software-style business models too
    body: >-
      BIS, MoFo, Finnegan, Mayer Brown, and June 2026 coverage all point to a regime where KYC, remote access, and parent-company screening can matter even before a startup ships its own silicon.
    claimRefs: [CR024, CR027, CR028, CR029, CR030]
  - calloutType: risk
    title: >-
      Supply-chain concentration can delay proof even if the software works
    body: >-
      Foundry, packaging, and low-volume access remain concentrated and slow-moving relative to startup timelines, so commercial proof can bottleneck outside Ricursive’s codebase.
    claimRefs: [CR031, CR033, CR034, CR036, CR038]
  - calloutType: strength
    title: >-
      There are real mitigants, but they mostly buy time rather than remove risk
    body: >-
      Founder-market fit, early capital, and the fact that major EDA vendors validate the category all support the thesis. They do not, by themselves, prove customer adoption, benchmark superiority, or compliance readiness.
    claimRefs: [CR003, CR004, CR045]
