  evidenceGaps:
    - type: missing-source
      severity: material
      topic: customer-proof-gap
      missingEvidence: >-
        Named paying customers, production deployments, renewal signals, and any public case studies or benchmarks tied to Ricursive rather than AlphaChip history.
      whyItMatters: >-
        Without customer proof, the market is underwriting promise and pedigree rather than evidence of real adoption or switching behavior.
      diligencePath: >-
        Request a customer list with deployment status, contract value bands, and at least two reference calls under NDA.
      relatedQuestionRefs: [QR006, QR007, QR029]
    - type: private-evidence-only
      severity: material
      topic: export-control-readiness
      missingEvidence: >-
        Internal export-control program details, end-user screening process, remote-access controls, and any outside counsel compliance audits.
      whyItMatters: >-
        The 2026 rule set expands diligence obligations across chips, remote access, and customer verification, so a weak compliance stack could block sales or create legal exposure.
      diligencePath: >-
        Review export-control memos, compliance ownership, KYC workflows, and any customer or country screening logs with counsel.
      relatedQuestionRefs: [QR008, QR011, QR025, QR030]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: benchmark-replication
      missingEvidence: >-
        Current-state benchmark data showing Ricursive workflows against Cadence, Synopsys, or Siemens baselines on production-relevant designs.
      whyItMatters: >-
        The core technology risk is not whether RL once worked at Google, but whether Ricursive materially beats incumbent flows on current customer problems.
      diligencePath: >-
        Request blinded benchmark decks, third-party replication, and engineering review of methodology and compute cost assumptions.
      relatedQuestionRefs: [QR002, QR003, QR004, QR026]
    - type: private-evidence-only
      severity: material
      topic: foundry-and-packaging-access
      missingEvidence: >-
        Any reserved foundry, advanced-packaging, mask, or cloud-compute commitments that ensure Ricursive can translate design wins into manufactured silicon.
      whyItMatters: >-
        Supply-chain concentration and low-volume access can turn a design startup into a schedule hostage if external capacity or packaging slots are constrained.
      diligencePath: >-
        Review foundry NDAs, MPW or shuttle access, packaging partners, and forecasted tape-out calendars.
      relatedQuestionRefs: [QR012, QR013, QR014, QR016, QR027]
    - type: private-evidence-only
      severity: material
      topic: org-depth
      missingEvidence: >-
        Org chart depth below the founders, hiring plan for verification and security, and retention incentives for scarce specialists.
      whyItMatters: >-
        A company attempting full-stack AI-assisted chip design can fail through management bandwidth and single-point-of-failure issues before the core technology fails.
      diligencePath: >-
        Request org chart, key-person redundancy plan, time-to-fill metrics, and retention data for critical engineering roles.
      relatedQuestionRefs: [QR017, QR018, QR019, QR028]
      relatedTableRefs: [TR004]
    - type: enumeration-incomplete
      severity: minor
      topic: regulatory-register-coverage
      missingEvidence: >-
        A full list of countries, counterparties, products, and end-use scenarios that management has screened under the evolving 2026 export-control regime.
      whyItMatters: >-
        The public record supports the existence of compliance risk but not the company-specific exposure map, so the regulatory register remains intentionally partial.
      diligencePath: >-
        Map customers, remote users, foundries, and cloud providers against BIS classifications and counsel opinions before underwriting expansion.
      relatedQuestionRefs: [QR009, QR010, QR030]
      relatedTableRefs: [TR001]
