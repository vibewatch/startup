  - id: TR005
    title: >-
      Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold or event
      - Action implication
    rows:
      - - Technical proof gap
        - Independent benchmark replication
        - No third-party benchmark win against incumbent or internal baseline within the next major diligence cycle
        - Do not underwrite durable technical differentiation; require staged financing or pass.
      - - Commercial proof gap
        - Named customer evidence
        - No paying design customer, production deployment, or design-win reference by the next financing step
        - Treat valuation as founder-premium speculation rather than proof-backed platform value.
      - - Export-control readiness
        - Compliance audit outcome
        - No documented export-control owner, KYC workflow, and outside-counsel review for sensitive geographies
        - Block international go-to-market expansion until controls exist.
      - - Supply-chain dependence
        - Foundry and packaging path
        - No credible MPW, foundry, packaging, or cloud-compute path for early customer programs
        - Discount timelines for customer conversion and tape-out-linked revenue opportunities.
      - - Team concentration
        - Critical-hire completion
        - Verification and security leadership remain founder-adjacent with no functional redundancy
        - Increase key-person discount and require retention and hiring milestones.
      - - Valuation risk
        - Proof-to-price conversion
        - New capital is raised before customer, benchmark, or compliance milestones materially improve
        - Assume down-round or flat-round pressure and reset entry price expectations.
    notes: >-
      These triggers are intentionally monitorable so diligence can convert risk discussion into explicit go or no-go thresholds.
    claimRefs: [CR023, CR028, CR031, CR038, CR042, CR043, CR044, CR045]
