  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: At least one named Ricursive customer or pilot account with use case, stage, and buyer quote.
    whyItMatters: The public record currently proves founder pedigree and adjacent demand, but not Ricursive-specific account adoption.
    diligencePath: Request a redacted customer list or three reference calls covering one hyperscaler-style account, one fabless design team, and one pilot that did not expand.
    relatedQuestionRefs:
    - QU005
    - QU006
    - QU014
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, contract length, renewal cadence, or even a basic pilot-to-production conversion metric.
    whyItMatters: Without durability data, investors cannot tell whether Ricursive is creating sticky workflow value or only generating curiosity.
    diligencePath: Obtain cohort tables for pilots, converted production accounts, renewal timing, and any expansion revenue by account.
    relatedQuestionRefs:
    - QU013
    - QU024
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: adoption-denominators
    missingEvidence: Customer count, number of active evaluations, number of taped-out designs, and deployment-stage denominators.
    whyItMatters: Public anecdotes can mask a tiny installed base if the underlying account count and stage distribution remain undisclosed.
    diligencePath: Ask management for a funnel from inbound interest to evaluation to taped-out production, with dates and conversion rates.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-account exposure, ACV mix, and the share of pipeline tied to one or two marquee labs or chip vendors.
    whyItMatters: The company could be commercially dependent on a very small number of reference accounts even if public demand appears broad.
    diligencePath: Review top-10 opportunity pipeline, signed pilots, and expected 12-month bookings concentration by account.
    relatedQuestionRefs:
    - QU014
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: partner-stack
    missingEvidence: Named channel, foundry, cloud, or EDA partnership agreements that define how Ricursive enters and supports customer accounts.
    whyItMatters: Partner dependence can accelerate adoption but also shifts bargaining power and implementation risk outside Ricursive’s control.
    diligencePath: Request copies or summaries of any cloud marketplace, foundry ecosystem, EDA interoperability, or co-sell agreements.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: customer-eligibility
    missingEvidence: Customer geography, export-classification assumptions, and any restrictions on the end users Ricursive can serve.
    whyItMatters: Export controls and foundry bottlenecks can shrink the practical customer set even when technical interest is high.
    diligencePath: Ask counsel and management for export-control coverage by geography, end use, and customer segment.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU005
