summary:
  headline: >-
    Ricursive combines rare AlphaChip-derived technical credibility with extraordinary financing speed, but the company
    still lacks public customer, revenue, and benchmark proof sufficient to fully underwrite a $4B valuation.
  overallScore: 6.1
  recommendation: research-more
