    title: Evidence-bounded customer journey and expansion surfaces
    type: journey-map
    summary: Public discovery can progress toward controlled enterprise deployment, but the evidence does not quantify stage conversion, renewal, or expansion.
    data:
      items:
        - label: Public discovery
          detail: Developers encounter models, datasets, applications, and open-source tooling.
          touchpoints:
            - Hub
            - Public repositories
            - Open-source libraries
        - label: Evaluation and adaptation
          detail: Users compare, adapt, and evaluate artifacts before committing to deployment.
          touchpoints:
            - Model pages
            - Datasets
            - Spaces
        - label: Team controls
          detail: Enterprise buyers may require security, access controls, and dedicated support.
          touchpoints:
            - Team and Enterprise
            - Access controls
            - Dedicated support
        - label: Managed inference
          detail: More than 45,000 models are offered through a unified inference-provider API.
          touchpoints:
            - Inference Providers
            - Inference Endpoints
            - Provider routing
        - label: Deeper integration
          detail: Named deployments and partner integration can embed Hugging Face in production workflows.
          touchpoints:
            - Spark integration
            - Sovereign RAG
            - ggml and llama.cpp integration
        - label: Renewal and expansion
          detail: Public evidence does not quantify cohort retention, contract expansion, or revenue concentration.
          touchpoints:
            - Renewal
            - Compute expansion
            - Additional teams and workloads
    approximationNotes: This is a qualitative sequence of supported adoption surfaces, not a measured funnel; no conversion rate, shared cohort, or common time basis is available.
    claimRefs:
