  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: Three deployments visible in the assigned Apps Run The World customer page, spanning records dated 2023 and 2024.
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production versus pilot
      - Reported outcome
      - Limitation
    rows:
      - - Databricks
        - Data and ML platform
        - Spark runtime integration and Dataset.from_spark path for training workflows
        - Operational integration reported for 2023; production status not independently verified
        - Data-preparation time reportedly reduced by up to approximately 40%
        - One technographic source; subscription value and continuing usage are unknown
      - - Banque Des Territoires
        - French public-sector financial institution
        - Sovereign retrieval-augmented assistant for the EduRénov program
        - Pilot beginning in January 2024
        - Improved responsiveness to local authorities was reported
        - Broader production rollout, contract value, and renewal are unverified
      - - Capital Fund Management France
        - Quantitative financial research
        - Inference Endpoints, Expert Support, Llama models, and assisted NER labeling
        - Production inference reported for 2024
        - Up to 6.4% NER accuracy gain and approximately 80x cost efficiency versus large LLMs were reported
        - Outcome methodology, spend, renewal, and independent corroboration are absent
    notes: The table is a partial, single-publisher sample; reported outcomes are preserved as source claims and are not independently verified.
    claimRefs:
