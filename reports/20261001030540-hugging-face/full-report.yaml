      - number: '6.2'
        title: Adoption scale and reference quality
        blocks:
          - type: paragraph
            body: >
              NVIDIA's September 2026 acquisition announcement states that more than 18 million developers, researchers,
              and creators use Hugging Face and that more than 200,000 companies use the platform. Independent articles
              repeat those figures but identify NVIDIA as their source, so they are useful confirmation of publication,
              not independent measurement. The denominators are also incomplete: the evidence does not separate
              cumulative registrations from active users, free organizational workspaces from paying accounts, or
              experimentation from production deployment. The strongest named proof is narrower. A technographic
              provider describes one 2023 Databricks integration and two 2024 French financial or public-sector
              deployments with reported operating outcomes, but the visible three-company sample is not an exhaustive or
              independently corroborated customer census.
            claimRefs:
