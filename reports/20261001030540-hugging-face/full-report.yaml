figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological progression of Hugging Face from consumer chatbot origin in 2016 through open-source infrastructure
      leadership to its $12.93B NVIDIA acquisition in 2026.
    approximationNotes: Dates reflect publicly announced funding rounds, product releases, and disclosed operational incidents.
    data:
      items:
        - date: 2016-07
          label: Founding in New York
          detail: >-
            Clément Delangue, Julien Chaumond, and Thomas Wolf found Hugging Face in New York City with backing from
            Betaworks, initially launching a teenage chatbot app.
          tone: neutral
        - date: 2018-11
          label: PyTorch-BERT Release
          detail: >-
            Hugging Face releases an open-source PyTorch implementation of Google's BERT language model within one week
            of publication, igniting community adoption.
          tone: positive
        - date: 2019-10
          label: Strategic Infrastructure Pivot
          detail: >-
            Formal pivot away from consumer chatbots to open-source ML developer tooling with the launch of the
            Transformers library.
          tone: positive
        - date: 2021-03
          label: Series B Financing & Hub Launch
          detail: >-
            Raised $40M Series B round led by Addition; launched Hugging Face Hub as a collaborative open-source model
            repository and marketplace.
          tone: positive
        - date: 2022-05
          label: Series C Round at $2B Valuation
          detail: >-
            Secured $100M Series C led by Lux Capital, scaling enterprise adoption and releasing the 176B-parameter
            multilingual BLOOM model.
          tone: positive
        - date: 2023-08
          label: Series D Round at $4.5B Valuation
          detail: >-
            Raised $235M Series D from Salesforce Ventures, Google, Amazon, NVIDIA, Intel, AMD, Qualcomm, and IBM,
            affirming neutrality.
          tone: positive
        - date: 2026-07
          label: Autonomous Agent Infrastructure Breach
          detail: >-
            Disclosed a weekend intrusion into production dataset workers driven by an autonomous AI agent exploiting
            remote-code loader and template flaws.
          tone: negative
        - date: 2026-09
          label: NVIDIA $12.93B Acquisition Agreement
          detail: >-
            Agreed to be acquired by NVIDIA for $12,930,300,000 while maintaining open, vendor-agnostic multi-cloud and
            multi-hardware operations.
          tone: positive
    claimRefs:
