      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >
              The observable expansion mechanisms are product-led and ecosystem-led: public discovery can lead to team
              controls, managed inference, enterprise support, or deeper partner integration. The ggml/llama.cpp
              announcement is evidence of ecosystem depth and planned technical integration, not customer retention or
              contract expansion. No assigned source reports NRR, GRR, logo churn, renewal rates, contract duration,
              account-level seat or compute expansion, top-customer revenue share, or channel-sourced revenue.
              Consequently, the chapter cannot quantify durability or concentration. Management diligence should
              reconcile the 200,000-company platform-use claim to active organizations, paying customers, annual
              contract value bands, renewal cohorts, inference consumption, and revenue concentration before broad reach
              is treated as recurring commercial traction.
            claimRefs:
              - CU001
