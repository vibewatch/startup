      - number: '2.3'
        title: Buyer Segmentation, Adoption Drivers, and Constraints
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics across open AI infrastructure divide into three principal customer segments:
              individual developers and academic researchers, enterprise machine learning platform teams, and strategic
              hardware silicon providers. Individual practitioners drive platform network effects through community
              model uploads and open research papers, while enterprise platform leads purchase dedicated compute and
              private repository governance to enforce security protocols and compliance. Crucially, silicon vendors
              such as NVIDIA represent a unique payer class that treats open platform repositories as an early demand
              radar, observing emerging neural architectures to optimize hardware runtimes and software frameworks. Key
              growth drivers include enterprise demand for data sovereignty and multi-cloud portability, while primary
              adoption constraints involve infrastructure security vulnerabilities, reliance on compute-heavy open
              models, and the risk that platform neutrality erodes following major vendor acquisitions.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
