      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Divergence Between SaaS Revenue and Ecosystem Control
            body: >-
              Hugging Face illustrates a fundamental paradox in open-source AI infrastructure: while direct annual
              software revenue remained bounded around $100M-$150M, its platform gravity over 18 million developers and
              3 million models commanded a $12.93 billion acquisition valuation from NVIDIA, proving that strategic
              workload routing exceeds standalone software margins in economic value.
            calloutType: insight
            claimRefs:
