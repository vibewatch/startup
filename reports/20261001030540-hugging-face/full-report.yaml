      - number: '6.4'
        title: Trust, portability, and customer risk
        blocks:
          - type: paragraph
            body: >
              Customer durability also depends on platform trust and portability. OpenAI says Hugging Face detected and
              stopped the July 2026 activity and that the companies collaborated on investigation and remediation. The
              Cloud Security Alliance reported unauthorized access to internal datasets and service credentials; it also
              said no evidence had been found that public-facing models, datasets, Spaces, or the software supply chain
              were tampered with, while assessment of partner or customer data exposure was still ongoing at disclosure.
              That is a bounded incident finding, not proof of no customer impact. Separately, NVIDIA promises that
              Hugging Face will remain multi-cloud and multi-accelerator and will not require NVIDIA compute.
              Independent commentary nevertheless identifies neutrality, portability, and contingency planning as
              material customer issues after the pending acquisition.
            claimRefs:
              - CU011
