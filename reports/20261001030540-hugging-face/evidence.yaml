evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited GAAP financial statements, detailed gross margin percentages, cash burn rate, and net revenue retention
      (NRR) metrics are not publicly disclosed by Hugging Face.
    whyItMatters: >-
      Prevents independent verification of unit economics, platform gross profitability, and enterprise contract renewal
      trends prior to the closing of the NVIDIA transaction.
    diligencePath: >-
      Request unaudited and audited income statements, balance sheets, and cohort retention tables during formal
      acquisition confirmatory diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-governance
    missingEvidence: >-
      Detailed capitalization table disclosing precise equity ownership percentages, voting rights, and liquidation
      preference seniorities for Series A through D shareholders.
    whyItMatters: >-
      Obscures exact shareholder voting control, board composition dynamics, and distribution waterfall terms in the
      pending $12.93B acquisition.
    diligencePath: >-
      Review the certificate of incorporation, investor rights agreement, and merger distribution schedule during legal
      closing diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited segmentation of enterprise paying customer contracts, renewal rates, and ARR breakdown between private hub
      seats and compute infrastructure.
    whyItMatters: >-
      Without segmented enterprise contract values, TAM and SAM conversion efficiencies cannot be modeled independently
      from total registered corporate accounts.
    diligencePath: >-
      Review internal management presentations, confidential customer billing ledgers, and revenue recognition schedules
      during acquisition regulatory filings.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: enterprise-commercial-terms
    missingEvidence: >-
      Audited enterprise discount schedules, net revenue retention rates, and churn metrics comparing Hugging Face
      against proprietary API alternatives.
    whyItMatters: >-
      Without negotiated contract visibility, buyers and investors cannot verify realized enterprise ARR expansion
      versus list seat pricing.
    diligencePath: >-
      Request customer cohort retention data, average contract values (ACV), and enterprise SLA commit schedules during
      management diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited GAAP financial statements, income statement line items, gross margin percentages by revenue stream, and
      operating cash burn figures.
    whyItMatters: >-
      Without verified gross margins, it is impossible to evaluate whether inference revenue delivers high software
      margins or low compute pass-through margins.
    diligencePath: >-
      Request audited financial statements, historical income statements, and management accounts as part of
      confirmatory acquisition diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Enterprise customer contract cohort data, net revenue retention (NRR), gross revenue retention (GRR), and customer
      churn rates for Enterprise Hub.
    whyItMatters: >-
      Expansion within existing enterprise accounts is the primary indicator of commercial durability for SaaS platforms
      targeting developer workflows.
    diligencePath: >-
      Require management presentation detailing annual contract value (ACV) distribution, cohort retention curves, and
      logo expansion metrics.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: enterprise-infrastructure-cost
    missingEvidence: >-
      Audited compute and storage cost breakdowns for hosting multi-million model repositories and GPU allocations on
      Spaces ZeroGPU.
    whyItMatters: >-
      Without visibility into raw cloud and hardware egress expenses, the long-term gross margin profile of free
      community hosting remains unverified.
    diligencePath: >-
      Request management disclosure on infrastructure hosting unit costs and private hyperscaler compute subsidies
      during investor diligence.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: enterprise-sla-performance
    missingEvidence: >-
      Independent third-party SLA uptime reports and latency benchmarks for the Inference Providers routing mesh across
      diverse geographical regions.
    whyItMatters: >-
      Enterprise buyers require guaranteed latency percentiles and failover mechanisms before routing mission-critical
      application traffic.
    diligencePath: Review internal status incident logs and multi-region failover audit reports under non-disclosure agreement.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rates, contract duration, cohort expansion, and customer satisfaction by customer
      segment.
    whyItMatters: Platform reach cannot establish recurring revenue durability or expansion without cohort and renewal evidence.
    diligencePath: >-
      Request management's customer-level cohort schedules, renewal bridge, expansion and contraction waterfall, and
      churn reasons under NDA.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete named paying-customer list with deployment status, contract value, start date, renewal date, and
      independently referenceable outcomes.
    whyItMatters: Three visible records cannot establish the breadth, production mix, or economics of the customer base.
    diligencePath: >-
      Reconcile CRM and billing exports to signed contracts, then sample-reference customers across size, vertical,
      geography, and deployment maturity.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-one, top-five, and top-ten customer revenue concentration plus channel- and partner-sourced revenue shares.
    whyItMatters: >-
      Broad platform use may coexist with concentrated commercial revenue or dependence on a small number of
      infrastructure partners.
    diligencePath: >-
      Review customer revenue concentration by quarter and contract, including related-party, reseller, marketplace, and
      cloud-provider channels.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: customer-data
    missingEvidence: >-
      Final incident report specifying whether customer or partner data was exposed and describing completed remediation
      controls.
    whyItMatters: An ongoing assessment cannot establish the final scope of customer impact or residual trust risk.
    diligencePath: >-
      Obtain the final post-incident report, third-party forensic validation, customer notifications, and remediation
      closure evidence.
    relatedQuestionRefs:
      - QU006
  - type: missing-source
    severity: material
    topic: security-forensic-disclosure
    missingEvidence: >-
      Comprehensive third-party forensic audit detailing the complete scope of database records and customer credentials
      accessed during the July 2026 intrusion.
    whyItMatters: >-
      Without final forensic disclosure, residual unauthorized access or latent credential exposure across enterprise
      accounts cannot be independently bounded.
    diligencePath: >-
      Request unredacted post-incident forensic audit reports from external investigators and enterprise credential
      rotation logs.
    relatedQuestionRefs:
      - QR008
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Complete docket of global merger clearance filings and regulatory inquiries concerning the NVIDIA transaction
      across US, EU, and UK jurisdictions.
    whyItMatters: >-
      Antitrust scrutiny or mandatory behavioral remedies could delay closing, alter governance covenants, or impose
      platform neutrality constraints.
    diligencePath: Monitor FTC, DOJ, European Commission, and UK CMA merger filing notifications and public review milestones.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: profitability-and-margins
    missingEvidence: >-
      Audited financial statements, hosting and compute cost margins, and segment profitability for Hugging Face
      Enterprise Hub and inference services.
    whyItMatters: >-
      Without verified gross margins and unit economics, the sustainability of standalone operations and the exact
      operational accretion to Nvidia cannot be independently modeled.
    diligencePath: >-
      Review non-public disclosure schedules and audited financials required under the definitive merger agreement
      disclosures during regulatory filing reviews.
    relatedQuestionRefs:
      - QV009
