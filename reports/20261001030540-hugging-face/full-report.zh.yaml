      - number: '7.3'
        title: 生态依赖、平台集中度与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Hugging Face 是开源 AI 生态的核心枢纽，因此深度依赖硬件供应商、云基础设施和第三方模型开发者。尽管平台托管了 45,000 多个可通过统一 API
              免服务费调用的模型，并为海量公开模型与数据集提供免费托管，但其核心变现手段仍高度依赖付费的 Compute 算力档和 Enterprise
              企业档。这种免费增值模式在面对全球数以百万计的下载需求时，因巨大的带宽、存储和出网流量开销而承受沉重的毛利率压力。更关键的是，NVIDIA 不仅是本次交易的拟收购方，还是平台上单个最大的模型贡献方（贡献 500+
              个开源模型）与数据集贡献方（贡献 250+ 个数据集），构成了极端的交易对手方集中风险。尽管 Hugging Face 维护人员持续打磨 Transformers、Diffusers 和 Safetensors
              等底层开发者库，但来自 260 多个协同机器学习平台的激烈竞争，一旦伴随企业级功能不及预期或平台中立性动摇，势必对其开发者心智造成严重分流。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
