      - number: '5.2'
        title: 技术架构与基础设施系统
        blocks:
          - type: paragraph
            body: >-
              Hugging Face 的底层技术架构围绕高吞吐模型资产存储、统一推理网关及即用即弃的临时 GPU 执行机制构建。代码库基座借助 Git-LFS 与 Xet 分块（chunking）技术，实现了对多 GB
              级神经网络权重文件基于 Git 的版本控制与数据去重。针对训练 Checkpoint 和运行日志等无版本要求的可变存储需求，平台集成了具备内容寻址去重功能的 S3 兼容 Storage
              Bucket。这种分层存储架构在兼顾开发者对 Git 协议操作习惯的同时，化解了多 TB 级模型权重带来的严峻带宽与存储压力。

              为破解模型落地运行瓶颈且不强制客户签署排他性托管协议，Hugging Face 开发了 Inference Providers 网关。这一兼容 OpenAI 规范的路由网关将客户端应用直连到 15
              家外部推理供应商旗下的 45,000 多个模型，涵盖 Groq、Cerebras 等专用硬件芯片商，以及 Together AI、Fireworks 等云端聚合商。通过不加收任何平台服务费、仅凭一个 API
              Token 便能直接调度请求，Hugging Face 将开发者体验与底层硬件归属彻底解耦。与此同时，针对交互式 Demo 应用，Spaces ZeroGPU 能根据单次推理任务的时长动态分配共享 NVIDIA
              H200 加速算力，并在任务结束后立刻释放，把硬件闲置成本降至最低。
            claimRefs:
