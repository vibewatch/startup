        blocks:
          - type: paragraph
            body: >-
              Hugging Face 采取自下而上的开发者平台变现路径，通过 Inference Endpoints、Enterprise Hub 和 Pro 订阅三大核心档位，将开源从业者转化为付费商业客户。Sacra 与
              ValueAddVC 等行业研报估算，截至 2026 年 8 月，公司年经常性收入（ARR）达到约 $150M，较 2023 年底基线水平大致翻至四倍。托管型 Inference Endpoints
              是最大的收入贡献源，估计占总收入的 40%（约 $60M ARR），采用 GPU 机时计费：入门级 T4 加速卡起价每小时 $0.50，并随高端 A100 和 H100 集群逐步上升。Enterprise Hub
              是第二大收入支柱，约占收入的 35%（约 $52M ARR），以每人每月 $50 的价格向企业提供全员安全管控、SAML 单点登录、审计日志及细粒度权限控制。个人 Pro 账户（每月 $9）贡献估计 15%
              的收入，定制训练与企业级支持服务则占剩余的 10%。鉴于底层模型 Hub 对超过 1800 万名开发者和 200,000 家组织保持免费开放，其商业转化更像是一层基础设施与治理护栏，而非给开源权重设置付费门槛。
