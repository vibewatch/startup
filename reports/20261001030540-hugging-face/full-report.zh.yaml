  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与战略卡位
        blocks:
          - type: paragraph
            body: >-
              Hugging Face 已成为开源机器学习生态中不可或缺的分发层与协作中枢，依托超过 18M 名开发者和 200,000 家组织构成的用户基础，托管超过 3M 个模型、500,000 个数据集及 1M
              个应用程序。这种平台网络效应构成核心投资逻辑：随着企业加快采用 AI，掌握开源分发和模型评测，便握住了影响整个技术栈的战略关键点。2026 年 9 月 2 日，Nvidia 签署了以 $12.93B 收购
              Hugging Face 的确定性协议，为持续数周的市场传闻画上句号；此前在 2025 年底，Hugging Face 曾拒绝过一笔 $500M 的少数股权投资要约。对 Nvidia
              而言，这笔收购的战略逻辑超越了传统的软件收并购财务考量：面对超大规模云厂商以及 OpenAI、Anthropic、Google、Amazon 等前沿模型厂商加速自研定制芯片的挑战，收购 Hugging Face
              能够直接锚定广大独立开发者及中小企业客群，使其继续重度依赖针对 Nvidia 算力架构深度优化的开源权重。然而，反向逻辑则强调，Hugging Face
              的平台价值历来植根于其严苛的供应商中立地位。能否坚守多云与多芯片加速的独立性，是防范开发者与竞品硬件厂商集体出逃至替代性开源代码库的关键所在。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
