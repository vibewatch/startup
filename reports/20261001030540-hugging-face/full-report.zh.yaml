      - number: '3.2'
        title: 同业画像与核心能力对比
        blocks:
          - type: paragraph
            body: >-
              对比各类方案可以看到，部署自主权与开箱即用的运维便利性之间存在取舍。选择 Hugging Face 的企业看重查看完整模型参数、利用 PEFT 和 TRL
              等库定制微调，以及下载模型权重并部署在本地或私有云的自由。相比之下，选用 OpenAI 或 Anthropic
              的企业优先追求顶尖前沿基准性能与极低基础设施开销，将数据出境传输与模型黑盒不透明视为可接受的代价。关键在于，Hugging Face 并不推行排他策略：其开源库可直接编排闭源专有
              API，支持工程团队搭建混合流水线——由轻量专业开源模型处理成本敏感型任务，同时由闭源前沿模型处理复杂的对话工作流。Replicate 等托管基础设施提供商则卡位中间地带，为热门开源架构提供 Serverless
              执行能力，客户无需自行配置原始 Kubernetes 集群。
