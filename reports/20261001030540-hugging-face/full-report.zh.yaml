      - number: '1.3'
        title: 融资历史、估值演进与 NVIDIA 收购案
        blocks:
          - type: paragraph
            body: >-
              Hugging Face 早期在纽约 Betaworks 加速器孵化，之后完成多轮机构融资；整体风投融资节奏相对克制。公司通过历次股权融资累计筹集约 $395M 至 $400M 风投资本。关键里程碑包括 2021
              年由 Addition 领投的 $40M Series B 轮、2022 年由 Lux Capital 领投且估值达 $2.0B 的 $100M Series C 轮，以及 2023 年 8 月估值 $4.5B
              的标志性 $235M Series D 轮。Series D 投资团集结了互为竞对的行业巨头，因而备受关注——包括 Salesforce
              Ventures、Google、Amazon、NVIDIA、Intel、AMD、Qualcomm 和 IBM——这凸显了 Hugging Face 作为独立、中立平台的战略地位。这种独立性在 2026 年 9 月
              3 日迎来历史性转折：NVIDIA 宣布达成以 $12,930,300,000 收购 Hugging Face 的协议。根据已公布协议，NVIDIA 承诺 Hugging Face
              将保留原有标志性品牌，继续运营开放、不绑定单一供应商的平台，支持各类模型架构、多云托管环境以及竞品半导体加速器。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
