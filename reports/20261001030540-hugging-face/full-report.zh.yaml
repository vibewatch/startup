      - number: '2.3'
        title: 买方画像、采纳驱动因素与落地制约
        blocks:
          - type: paragraph
            body: >-
              开源 AI
              基础设施的买方主要分为三类：个人开发者与学术研究人员、企业机器学习平台团队，以及战略硬件厂商。个人通过上传模型和发表开源研究推动社区网络效应；企业平台负责人则采购专属算力和私有代码库治理工具，以落实安全与合规要求。NVIDIA
              等芯片供应商是独特的一类买方：它们把开源平台上的代码库当作早期需求信号，观察新兴神经网络架构，以优化硬件运行时和软件框架。企业对数据主权和多云可移植性的需求推动增长；基础设施漏洞、开源模型的高算力需求，以及大型供应商收购后平台中立性可能受损，则会制约采纳。
            claimRefs:
