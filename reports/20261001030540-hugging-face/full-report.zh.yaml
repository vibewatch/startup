            body: >-
              Hugging Face 的成本结构主要由云算力支出与研发薪酬构成，但详细的 GAAP 财务数据仍未公开。第三方估算显示已披露收入存在较大分歧：独立数据聚合平台 CorpDigest 援引的 FY2026 收入为
              $81M，而 Sacra 估算的 ARR 运行率则达 $150M，凸显出非上市企业信息披露的不透明度。毛利率波动的最核心变量是与 Inference Endpoints 及免费版 ZeroGPU
              算力挂钩的销售成本（COGS）——Hugging Face 必须为此向 AWS、Google Cloud 和 Azure 支付底层云基础设施开销。聚焦托管推理，Hugging Face 面临 Baseten 和
