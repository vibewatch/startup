  - id: TV001
    title: 看多 / 看空论点表
    columns:
      - 视角
      - 核心论点
      - 证据与驱动因素
      - 转向触发条件
    rows:
      - - 看多论点（战略整合）
        - 占据开放权重 AI 统治级分发层地位，赋予收购方贯穿开发者工作流与模型注册表的决定性影响力。
        - 托管 3M+ 模型、500k 数据集、1M 应用与 18M 用户；ARR 在两个月内增长 50%，自 $100M 升至 $150M。
        - 绕过开放代码库的专有围墙花园模型泛滥，或模型托管格局碎片化。
      - - 看空论点（估值倍数）
        - 基于 $150M 年化收入的 86x 倍数，$12.93B 估值体现由战略性硬件防御驱动的空前软件估值倍数。
        - 历史软件并购倍数鲜见超过 20–30x；收购溢价接近 2023 年 D 轮估值的 3x。
        - 企业级商业化加速推进，ARR 达到 $300M+ 且毛利率达到 80%+，从而支撑高估值溢价。
      - - 看空论点（生态中立性）
        - 硬件厂商控股危及多云、多加速卡中立性，动摇开发者信任根基。
        - 自研专有芯片的竞争对手（AMD、Intel、Google、Amazon）可能避免向 NVIDIA 控股的 Hub 提供资金支持或对接集成。
        - 确立具备法律约束力的合同与治理防火墙，维护厂商中立性与开放权重访问权限。
      - - 看多论点（硬件协同）
        - NVIDIA 可打包闲置算力、深度优化 CUDA 集成，构筑抵御超大规模云厂商自研芯片的防线。
        - OpenAI、Anthropic 及超大规模云厂商均在发力自研 ASIC；控股 Hugging Face 锁定独立开发者基本盘。
        - 未能通过反垄断监管审批，或遭遇严苛的行为性救济限制软硬件捆绑。
    notes: 综合截至 2026 年 9 月披露的交易条款、分析师估值倍数及平台使用指标提炼的核心论点。
