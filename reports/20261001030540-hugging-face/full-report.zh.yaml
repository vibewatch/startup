      - number: '3.3'
        title: 商业模式与产品打包取舍
        blocks:
          - type: paragraph
            body: >-
              AI 平台生态的定价方式各有不同。Hugging Face 主要靠四类收入来源变现：订阅席位、存储梯级、专属算力实例和 Serverless 推理路由。基础 Hub 账户完全免费；个人 PRO 档每月
              $9，Team 席位每人每月 $20，Enterprise 治理档每人每月 $50。企业合同金额（ACV）主要来自算力消耗，而非席位费。Dedicated Inference Endpoints 按小时计费：小型
              CPU 实例低至每小时 $0.033，单张 A100 GPU 实例为每小时 $2.50，多 GPU 集群最高可达每小时 $74。在 Serverless 请求上，Hugging Face 原价透传底层合作方的
              Token 费率，不加收任何差价。与此相反，OpenAI、Anthropic 等专有厂商主要通过按 Token 计费的 API 及 C
              端订阅变现；这种成本结构直接随推理调用量线性放大，在大规模生产场景下，其开销可能迅速甩开自建托管开源模型的成本。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.4'
        title: 护城河韧性与平台中立性风险
        blocks:
          - type: paragraph
            body: >-
              Hugging Face 的防御壁垒来自强大的网络效应与深度嵌入开发者工作流的黏性，而非专有模型权重。公司的 Transformers 库、safetensors 权重格式以及详尽的 Model Card
              元数据，使 Hub 成为现代机器学习的默认注册表，抬高了整体迁移成本。单个开发者虽能轻易下载开源权重、在多个基础设施平台同时部署（multi-home），但团队协作、私有数据集代码库与微调资产集中在
              Hugging Face 上，显著提升了平台留存。尽管如此，长期风险正在逼近：商业推理供应商不断压低单位 Token 成本，使模型执行迅速商品化；NVIDIA 宣布以 $12.93B 收购 Hugging
              Face，也引发了生态对平台中立性的强烈担忧。尽管管理层坚称将继续支持多云环境与非 NVIDIA 加速芯片，但竞争对手芯片厂商及超大规模云厂商若要加深对主导 GPU 巨头旗下平台的依赖，难免产生戒心。
            claimRefs:
