      - number: '1.4'
        title: 生态规模、运营里程碑与自主智能体威胁敞口
        blocks:
          - type: paragraph
            body: >-
              到 2025—2026 年，Hugging Face 在开源 AI 生态中的平台规模和参与度都达到前所未有的水平。根据公司《2026 年春季开源现状》报告，该平台注册用户突破 13M，托管超过 2M 个公开模型和
              500,000 个公开数据集；独立信源统计的模型和数据集更分别高达 2.4M 个和 730,000 个。超过 30% 的 Fortune 500 企业在平台上拥有官方认证组织账号。然而，平台架构要求数据集处理
              Worker 接收并执行第三方提交的代码，带来显著的安全风险。2026 年 7 月 16 日，Hugging Face 披露，一名入侵者借助自主 AI
              智能体框架，在一个周末内发起了网络入侵。该智能体利用远程代码加载缺陷和模板注入漏洞，以机器速度执行约 17,000
              次操作，提升节点权限、窃取集群机密信息并访问内部数据集。法证审计确认，公开模型、数据集、Spaces 和软件发布流水线均未遭篡改。此事也说明，机器学习代码库需要专门的运行时安全控制，才能拦截机器速度的自主攻击。
            claimRefs:
