      - number: '6.4'
        title: 信任机制、可移植性与客户侧风险
        blocks:
          - type: paragraph
            body: >
              客户黏性同样取决于对平台的信任程度与工作负载的可移植性。OpenAI 表示，Hugging Face 侦测并制止了 2026 年 7 月的入侵行为，两家公司就事件调查与补救措施展开了联合行动。Cloud
              Security Alliance 报告称内部数据集和内部服务凭证遭遇了非授权访问；该联盟同时指出，未发现面向公众的模型、数据集、Spaces
              或软件供应链遭到篡改的证据，但披露当时对伙伴或客户数据泄露风险的评估仍在进行。这一结论仅仅是对该次受控安全事件的定性，绝非对客户零影响的证明。另一方面，NVIDIA 承诺 Hugging Face
              将维持多云与多芯片支持，不会强制要求绑定 NVIDIA 算力。然而独立评论指出，在这笔待定收购案落地后，平台中立性、可移植性与应急替代预案已成为客户面临的实质性关切。
            claimRefs:
