  - id: TV002
    title: 乐观 / 中性 / 悲观情景分析表
    columns:
      - 情景
      - 核心运营假设
      - 隐含估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景（全额交割与协同释放）
        - 收购在 2027 年上半年通过监管审查；平台保持开放中立，企业级算力推动 ARR 扩展至 $300M+。
        - 现有股东全额变现 $12.93B 最终收购价（$11.9B 股东权益 + $1B 留任激励）。
        - 次要监管让步导致交割推迟至 2027 年年中以后。
        - 55% —— 已签署具约束力协议，且获 NVIDIA 资产负债表背书。
      - - 基准情景（监管附加条件 / 条款调整）
        - 美欧反垄断审查要求在批准前设立正式多加速卡防火墙与独立监督委员会。
        - $12.93B 名义交易对价维持不变，但合规与结构性运营隔离成本上升。
        - 审查周期拉长至 12–18 个月引发核心人才流失。
        - 30% —— 反映 AI 基础设施领域整合面临更严格的反垄断审查。
      - - 悲观情景（监管否决 / 交易终止）
        - 欧盟《第 22 条》或美国反垄断法案否决交易；Hugging Face 维持独立运营。
        - 估值回归独立非上市基本面（以 $150M ARR 的 30–40x 计算，对应 $4.5B D 轮估值至 $6.0B）。
        - 并购溢价归零，且面临资金雄厚的专有基础模型实验室竞争压力。
        - 15% —— 尽管 Run:ai 等先例获批，但更大交易规模与生态地位引致更严苛审查。
    notes: 基于公开并购条款对交易交割概率、潜在监管救济及估值结果进行情景建模。
