  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与有效服务范畴
        blocks:
          - type: paragraph
            body: >-
              机器学习与人工智能生态主要由两个截然不同的运营层构成：闭源专有 API 服务和开源协作基础设施。Hugging Face 充当开源模型市场最核心的分发枢纽与开发者生态，为模型权重、精选数据集及交互式机器学习
              Demo 空间（Spaces）提供公开与私有代码库托管。该细分市场包含的支出范畴包括私有模型托管的企业订阅费、托管推理端点、算力编排及微调环境；排除在外的范畴则涵盖闭源专有模型的 API
              消耗费、实体半导体硬件采购以及最终用户商业应用许可。在此领域内，软件工程团队、学术研究人员和企业级 AI 部门选择开源基础权重，旨在保持数据主权、规避供应商锁定，并在无需从头训练基础架构的前提下定制领域模型。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
