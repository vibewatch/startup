  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与玩家分类图谱
        blocks:
          - type: paragraph
            body: >-
              机器学习工具链与模型使用市场有三类主要竞争模式：开源社区 Hub、闭源专有模型 API 和专业托管基础设施。Hugging Face 占据开源阵营的核心位置，统一接入来自顶尖供应商的 45,000
              多个模型，同时托管超过 300 万个社区模型。这一模型代码库与 OpenAI、Anthropic 等前沿闭源实验室形成鲜明对比——后者封闭模型权重，仅通过托管 API 开放调用。外界常将 Hugging Face
              与 OpenAI 视为直接竞争对手，但两者服务的需求并不相同：Hugging Face 是横向开发者工具箱和协作注册表，OpenAI 则是纵向一体化的模型供应商。与此同时，Replicate 和 Baseten
              等专业基础设施平台瞄准了希望获得低延迟模型执行能力又无需打理底层 GPU 集群的生产工程团队；Continue 等 IDE 内开源工具则提供客户端替代方案，把本地模型直接嵌入开发者的日常工作流。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
