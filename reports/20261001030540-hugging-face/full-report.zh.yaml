chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、战略卡位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Hugging Face, Inc. 是全球机器学习生态中占据主导地位的开源协作平台与基础设施提供商。公司常被称为「AI 领域的 GitHub」，于 2016 年成立，总部位于纽约市。该平台提供统一
              Hub，供超过 1300 万名注册用户与 50,000 家组织共享、发掘、评估和部署机器学习模型、数据集与交互式应用。Hugging Face 采用
              Open-Core（开源核心）商业模式，将免费开源软件库（最著名的包括 Transformers、Diffusers、Tokenizers 和 Datasets）与商业付费变现结合。收入来源包括每月 $9 的个人
              PRO 订阅、每人每月 $20 的协作团队工作区、托管推理端点用量算力（起价每小时 $0.033），以及提供专属安全保障、SSO
              集成、私有云部署与高级支持的定制化企业许可证。这种模式成功将广泛的草根开源采纳转化为科技、医疗、金融和工业等领域的企业级合同。
            claimRefs:
              - CO001
              - CO008
              - CO011
