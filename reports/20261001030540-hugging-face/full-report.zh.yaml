      - number: '1.2'
        title: 创立故事、管理团队与治理结构
        blocks:
          - type: paragraph
            body: >-
              Hugging Face 由 Clément Delangue（CEO）、Julien Chaumond（CTO）和 Thomas Wolf（CSO）于 2016 年 7
              月创立。公司的创立历程展现了科技行业最引人瞩目的产品转型之一。Delangue 毕业于 ESCP 与 Stanford，曾先后在 Moodstocks 和 Mention 担任产品负责人；他在共同参加
              Stanford 在线工程课程后，结识了前法国经济部工程师 Chaumond 以及学者兼专利律师 Wolf。三人最初面向青少年开发了一款主打「挚友」概念的对话式 AI
              聊天机器人，并选用了拥抱表情（hugging-face emoji）作为轻松诙谐的公司品牌形象。2018 年底 Google 发布 BERT 之后，团队在 7 天内开发并发布了开源 PyTorch
              实现版本。开发者群体的迅速采纳促使管理层在 2019 年果断砍掉 C 端聊天机器人业务，全面聚焦开源机器学习工具链。如今，三位创始人保持着高度统一的领导结构：Delangue
              统领公司战略、商业化扩张与生态倡导；Chaumond 掌管分布式基础设施与平台架构；Wolf 则主管前沿科研项目与负责任 AI 治理。公司对 Delangue
              的关键人物依赖依然显著，其个人品牌影响力以及对开源中立性的坚持，构成了平台社区声誉的基石。
            claimRefs:
