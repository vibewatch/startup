              Hub 上原生发现模型的天然漏斗，保持了更优异的单客获客经济性。包括 GAAP 毛利率、净收入留存率（NRR）以及获客成本（CAC）回收期在内的核心投资评估指标，仍属未披露的私有变量，亟待正式审计求证。
