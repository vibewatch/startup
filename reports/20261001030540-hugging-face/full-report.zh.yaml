            body: >-
              2026 年 7 月的安全入侵事件由自主 AI 智能体端到端执行，利用数据集处理流水线完成了 17,000 次自动化操作，揭示了 AI
              基础设施风险的新范式。尽管公开模型完整性得以保全，但该事件表明，执行用户提交代码的平台必须引入智能体级运行时管控与严格的凭证作用域隔离，以防御自动化横向渗透。
