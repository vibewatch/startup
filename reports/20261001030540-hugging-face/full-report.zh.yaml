      - number: '2.2'
        title: 市场规模测算口径与受约束的估值逻辑
        blocks:
          - type: paragraph
            body: >-
              评估开源 AI 平台的潜在市场空间，需要将宽泛的企业级 AI 支出拆解为切合实际的基础设施捕获层。宏观全球 AI
              行业预测经常引用庞大数字，将硬件资本支出与软件工具链预算混为一谈。相比之下，专门聚焦开源机器学习协作、模型注册表和开发者工具的可服务有效市场（SAM），其真实的支出体量要狭窄得多。Hugging Face
              上的社区采纳规模极其庞大，托管了 120 万至 300 万个模型以及数十万个数据集。然而，Hugging Face 的企业软件 ARR 估计仅在 $81M 至 $150M
              之间，这反映了底层模型和软件库完全免费时，将开发者心智变现的结构性阻力。这一商业化鸿沟最终促使 NVIDIA 于 2026 年 9 月达成以 $12.93B 收购 Hugging Face
              的确定性协议——买方支付战略溢价，是为了掌握开发者分发渠道、发掘硬件工作负载需求，而非押注独立软件业务的现金流。
