  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: Hugging Face 自 2016 年 C 端聊天机器人起步，演进为开源基础设施领军者，直至 2026 年达成 $12.93B NVIDIA 收购案的发展历程。
    approximationNotes: 日期反映公开宣布的融资轮次、产品发布及披露的运营安全事件。
    data:
      items:
        - date: 2016-07
          label: 纽约创立
          detail: Clément Delangue、Julien Chaumond 与 Thomas Wolf 在 Betaworks 支持下于纽约创立 Hugging Face，起初上线面向青少年的聊天机器人 App。
          tone: neutral
        - date: 2018-11
          label: PyTorch-BERT 发布
          detail: 在 Google 发布 BERT 语言模型一周内开源推出 PyTorch 实现版本，引爆社区采用热潮。
          tone: positive
        - date: 2019-10
          label: 基础设施战略转型
          detail: 伴随 Transformers 库发布，正式由 C 端聊天机器人转型为开源机器学习开发者工具链。
          tone: positive
        - date: 2021-03
          label: B 轮融资与 Hub 上线
          detail: 完成由 Addition 领投的 $40M B 轮融资；上线 Hugging Face Hub 作为协作式开源模型代码库与交易市场。
          tone: positive
        - date: 2022-05
          label: 估值 $2B 的 C 轮融资
          detail: 完成由 Lux Capital 领投的 $100M C 轮融资，加速拓展企业级客户，并发布 176B 参数多语言模型 BLOOM。
          tone: positive
        - date: 2023-08
          label: 估值 $4.5B 的 D 轮融资
          detail: 获得来自 Salesforce Ventures、Google、Amazon、NVIDIA、Intel、AMD、Qualcomm 及 IBM 的 $235M D 轮融资，确立中立地位。
          tone: positive
        - date: 2026-07
          label: 自主智能体基础设施入侵事件
          detail: 披露生产环境数据集 Worker 周末遭自主 AI 智能体入侵，攻击者利用远程代码加载器与模板漏洞实施渗透。
          tone: negative
        - date: 2026-09
          label: NVIDIA $12.93B 收购协议
          detail: 同意由 NVIDIA 以 $12,930,300,000 收购，同时保持开放、跨厂商的多云及多硬件运营架构。
          tone: positive
