- id: trust-controls-support-and-gaps
  title: Public trust and control signals exist, but security and reliability evidence remains shallow
  body: Foodics does expose some control-layer evidence. The accounting module page describes role customization, access logs, and regular backups, while the API Adapter flow requires owner authorization before sharing sales-order data with registered entities. The support page publishes multi-country phone lines and repeats the company's SAMA-supervision and fintech-licensing framing. These are useful signals, but they stop well short of a mature public trust center. The retrieved developer surfaces reveal that API docs and a developer page exist, yet their publicly retrievable content is minimal. The official GitHub organization had no public repositories visible at access time, while community repositories exist but cannot be treated as authoritative product documentation. Taken together, the public record supports a basic conclusion that Foodics has role, support, and developer-access mechanisms, but it does not support stronger claims about uptime, incident response, security certification,
    or deeper implementation quality.
