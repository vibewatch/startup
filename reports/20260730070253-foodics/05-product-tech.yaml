- id: roadmap-ai-and-dependencies
  title: The 2025-2026 roadmap points toward fintech and AI, with rising partner and execution dependencies
  body: 'The most important product trend since the 2022 funding round is expansion beyond core restaurant software into financial enablement and AI-native decision support. The Solo transaction widened Foodics'' ordering and kiosk capabilities. Qlub and Suplyd show that the company is using partner integrations to extend checkout and procurement workflows. The Lean-related sources frame a more ambitious push into cashflow visibility, credit scoring, and financing access. Most strategically, the full Norma acquisition in 2026 created a dedicated AI division and brought a natural-language analytics assistant plus BI workflows into the platform. That strengthens Foodics'' differentiation story, but it also creates new dependencies: external payment rails, open-banking infrastructure, procurement partners, AI execution quality, and implementation support all become more important to the customer experience. Product ambition is clearly increasing faster than public technical disclosure, so roadmap
    credibility is positive but not yet fully de-risked. Diligence still needs direct reference calls, implementation evidence, and engineering walkthroughs to test uptime discipline, partner failover, and AI-governance execution, disaster recovery discipline, and merchant onboarding quality overall today.'
