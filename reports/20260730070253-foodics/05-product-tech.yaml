- id: integration-and-operating-model
  title: The operating model appears console-centric, integration-heavy, and permissioned rather than openly self-serve
  body: The clearest architecture signal in the public record is not a system diagram but an operating pattern. Foodics seems to organize its platform around a merchant console, branch-scoped operational data, and a growing set of partner or module extensions. The API Adapter documentation shows that third-party access is explicitly authorized by the merchant owner and can be limited to selected branches, which implies an account-and-permission model built around controlled data exposure rather than broad anonymous API consumption. The Integration Availability article reinforces that custom integrations are gated behind the Advanced plan or a purchased API license. Marketplace and partnership materials show that Foodics relies on integrations for procurement, guest checkout, accounting, and other extensions. This looks like a practical restaurant-ops architecture with platform ambitions. It also means product quality depends materially on partner connectivity, entitlement logic, and implementation
    support, none of which are described at engineering depth in the reviewed sources.
  claimRefs:
  - CE005
  - CE012
  - CE013
  - CE014
