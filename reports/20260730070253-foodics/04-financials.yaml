      - FI002
  - id: unit-economics-cost-structure-and-comps
    title: Unit economics are mostly undisclosed, so public comps and product mechanics have to stand in for direct proof
    body: >-
      Foodics does not publish the core unit-economics data needed for full underwriting. There is no public CAC,
      payback period, gross retention, net retention, payment take rate, gross margin split, hardware margin, or default
      history for lending products. The most defensible way to reason about economics is to combine the company's product
      mechanics with a public comp that mixes restaurant SaaS and payments. Toast's 2025 Form 10-K is useful here. It
      shows how restaurant-tech financial performance can be driven by both recurring software fees and payment volume,
      with GPV of $195.1 billion, ARR of $2.047 billion, and material liquidity on the balance sheet. Toast is not a
      direct Saudi multiple comp, but it demonstrates the economic logic of integrated restaurant software plus payments:
      more locations and more GPV typically create more high-frequency monetization than software alone. Foodics' own
      public product design points the same way. Payment processing, twice-daily or daily settlement, unified receipts,
      direct-order channels, BNPL-style merchant features, and AI or accounting adjacencies all suggest a model where
      customer value expands with operational intensity. The problem is that without disclosed take rates or margin data,
      investors cannot tell whether growth is efficiently monetized or merely broadly utilized. That makes diligence on
      realized economics more important than diligence on topline adoption.
    claimRefs:
      - CI018
      - CI019
      - CI020
      - CI021
      - CI028
      - CI029
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
    tableRefs:
      - TI004
    figureRefs:
      - FI003
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy looks credible for growth investment, but disclosure is too thin for a true IPO-ready verdict
    body: >-
      The capital story is directionally encouraging but still incomplete. Foodics' 2022 Series C brought in $170
      million from high-quality investors led by Prosus and Sanabil, and official statements tied the proceeds to
      geographic expansion, M&A, fintech, micro-lending, and supply-chain initiatives. Later activity suggests the money
      was used in line with that narrative: Foodics expanded payments partnerships, announced a three-year $100 million
      acquisition and investment plan, bought Solo, took an initial stake in Norma before fully acquiring it, and pushed
      deeper into open-banking-enabled merchant finance. The 2025 Kamco stake purchase adds another capital-market signal
      by showing institutional demand ahead of a possible Tadawul listing. But adequacy is not the same as transparency.
      Neither Kamco's undisclosed stake nor Tracxn's obscured 2025 funding record provides the clean cash-balance picture
      an IPO-bound investor would want. Public evidence still lacks current cash on hand, debt obligations, monthly burn,
      financing cost on lending products, or the share of capital devoted to acquisitions versus operating runway.
      Financially, Foodics looks like a serious growth company with enough strategic capital access to keep building. It
      does not yet look publicly documented enough for an investor to underwrite earnings power without management data.
    claimRefs:
      - CI001
      - CI002
      - CI018
      - CI022
