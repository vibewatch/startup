company:
  name: Foodics
chapter:
  number: 4
  title: Financials
  summary: >-
    Foodics' public financial picture is strongest on operating throughput and weakest on classic private-company P&L
    disclosure. The best evidence shows a vertical SaaS-plus-fintech model monetizing subscriptions, payments, ordering,
    and merchant-finance adjacency rather than one pure software fee stream. The strongest public growth datapoint is
    Menabytes' H1 2025 update: 33,500 active restaurant branches, $6 billion in half-year GMV, payment volume up 38%,
    ARR up 29%, and international revenue up 56%. But revenue, gross margin, burn, cash balance, take rate, and
    loan-book size remain undisclosed. Capital adequacy is therefore inferred from the 2022 $170 million Series C,
    ongoing institutional interest such as Kamco's 2025 stake acquisition, and management's continued willingness to
    fund M&A and fintech expansion.
sections:
  - id: revenue-model-and-monetization
    title: Revenue streams are diversified across software, payments, ordering, and merchant-finance adjacency
    body: >-
      Foodics should not be modeled as a single-line POS subscription business. Its public surfaces support a broader
      monetization stack built around restaurant operations software, integrated payments, online ordering, and newer
      financial products. The company still clearly sells core software: restaurant management, POS, reporting,
      back-office tools, online storefronts, and specialized products such as Foodics One. But payments are now
      structurally important. Foodics Pay is positioned as a dedicated fintech layer handling merchant transactions,
      settlement convenience, and payment acceptance across channels. Foodics Online also points toward monetization via
      digital commerce enablement and improved merchant retention by helping restaurants avoid third-party commissions.
      The 2022 and 2025 official releases widen the model further through micro-lending, BNPL, accounting, and AI-
      assisted financial tooling. The revenue-quality implication is positive in one sense and uncertain in another.
      Positive, because multi-product attachment can deepen retention and increase ARPU over time. Uncertain, because the
      public record does not disclose how much revenue comes from subscriptions versus payments versus newer fintech lines,
      nor whether those streams carry software-like margins or processor-like margins. The right financial view is a
      layered revenue model with increasing fintech weight, not a clean single-metric SaaS story.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI024
      - CI025
      - CI026
      - CI027
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: public-traction-and-growth-signals
    title: Public traction is strong on branches, GMV, payment volume, and ARR growth, but not on reported revenue
    body: >-
      Public traction signals are unusually strong for a private company in the regional restaurant-tech market. The
      most useful new datapoint is Menabytes' H1 2025 report, which says Foodics reached 33,500 active restaurant
      branches, processed $6 billion in GMV during the half, grew payment volume 38%, increased ARR 29%, and expanded
      international revenue 56%. Those figures matter because they suggest the business is not only selling more
      software seats, but also increasing embedded-fintech activity and geographic reach. They also align with the
      broader 2025 external narrative that Foodics exceeded $10 billion of annual GMV in 2024 and remained one of the
      region's largest restaurant-tech platforms by throughput. Official releases support the scale story from another
      angle: over 5 billion cumulative orders by April 2022, more than 6 billion orders by later partner and M&A
      releases, 10,000 branches already using Norma's analytics within the Foodics base, and over 40,000 branches on the
      platform by June 2026 according to the Norma acquisition announcement. Yet the public file still stops short of the
      metrics equity or growth investors usually need most. No exact revenue, gross profit, EBITDA, free cash flow, or
      cohort retention schedule is disclosed. That means traction is compelling, but monetization quality remains partly
      hidden behind throughput and attachment-growth proxies.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
