  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Impact
      - Why it matters
      - Exact diligence path
    rows:
      - - Exact revenue
        - Material
        - Without absolute revenue, valuation and efficiency framing remain proxy-based
        - Request audited annual revenue and quarterly management reporting
      - - Gross margin by stream
        - Material
        - Software, payments, hardware, and finance products can have very different economics
        - Request gross margin bridge by software, payments, hardware, and finance
      - - Cash balance and burn
        - Material
        - Determines runway and dependence on new financing before IPO
        - Request latest balance sheet, cash flow statement, and monthly burn summary
      - - Payments take rate and attach rate
        - Material
        - Essential to translate GMV into actual fintech revenue and contribution margin
        - Request Foodics Pay cohort tables showing GPV, take rate, losses, and support costs
      - - Loan-book size and credit quality
        - Material
        - Merchant finance can create upside or significant hidden risk
        - Request loan book, delinquency buckets, recovery, and funding model
      - - Customer retention and sales efficiency
        - Medium
        - ARR growth is harder to interpret without retention and acquisition-cost context
        - Request NRR, gross retention, CAC, payback, and win-back data
    notes: The public data set is rich enough for a growth narrative but incomplete for true underwriting.
    claimRefs:
