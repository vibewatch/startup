        - Public feature breadth appears narrower than Foodics; pricing pages not publicly exposed in reviewed sources
      - - Oracle Simphony
        - Global enterprise incumbent
        - 200+ integration partners and global support positioning
        - Large chains, hotel restaurants, international operators
        - Scale, open API framework, kiosk, KDS, loyalty, analytics
        - Less visibly Saudi-specific in public restaurant materials
      - - NCR Aloha / NCR Voyix
        - Global enterprise incumbent
        - Large installed-base narrative and high transaction scale
        - QSR, casual dining, enterprise chains
        - Order orchestration, edge resilience, payments, modular platform
        - Public pricing absent; imported-enterprise profile can be heavy for SMBs
      - - Toast
        - North American cloud restaurant POS
        - Strong product reputation and public pricing page, but market availability appears US/Canada/Ireland focused
        - US restaurant operators, some internationally inspired buyers
        - Ease of setup, hardware, modern restaurant stack
        - Weak Saudi localization evidence in reviewed sources
      - - Lightspeed
        - Global hospitality and retail cloud POS
        - 150K locations worldwide and 200+ Michelin-starred restaurants cited
        - Hospitality groups, multilocation restaurants, Europe/North America
        - Benchmarks, analytics, multilocation management, integrations
        - Saudi restaurant fit appears weaker than retail or European hospitality fit
      - - Sapaad
        - GCC-oriented restaurant OS
        - 15K+ restaurants worldwide claimed
        - Café through enterprise restaurant operators
        - POS, delivery, AI insights, KDS, loyalty, cloud printing
        - Quote-led pricing and less public evidence on Saudi-specific payments than Foodics or Marn
      - - Loyverse
        - Low-cost SMB POS substitute
        - Transparent add-on pricing for stores
        - Micro-merchants and simple small operators
        - Low entry price and self-serve onboarding
        - Less restaurant-specific depth and weaker localized Saudi positioning
    notes: The table groups competitors by the job they are most likely to win, rather than treating every vendor as equally direct.
