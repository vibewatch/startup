  - id: capability-pricing-and-distribution-comparison
    title: Capability breadth is converging, but localization, pricing transparency, and distribution still separate vendors
    body: >-
      Across restaurant-tech vendors, the capability matrix is no longer defined by whether a system can take orders and print receipts. The differentiators are now around local payment support, regulatory fit, integrations, online ordering, kitchen tooling, analytics, deployment speed, and whether those features come natively or through add-ons. Foodics' public product surfaces show POS, payments, online ordering, Foodics One, and 100-plus integrations, which supports a broad module story for Saudi operators. Marn presents a simpler but credible local alternative with cloud operation, offline mode, analytics, and multilingual support. Oracle and NCR emphasize scale, open APIs, kitchen orchestration, and chain-grade operational resilience; Lightspeed emphasizes benchmarks, multi-location control, and hospitality management; Toast emphasizes ease, hardware, and a modern product stack, but public Saudi evidence is weak. Pricing transparency is uneven. Toast and Loyverse expose at least parts of their commercial model publicly, while Foodics, Oracle, NCR, Marn, and Sapaad remain mostly quote-led in the reviewed evidence. That lack of transparency is not inherently negative for enterprise sales, but it makes price-based SMB comparisons more vulnerable to third-party framing by review sites and competitors. Distribution also matters: a Saudi operator may rationally prefer a more localized vendor even if a global platform looks richer on paper, because deployment, support, payment compatibility, and tax compliance determine time-to-value.
    claimRefs:
