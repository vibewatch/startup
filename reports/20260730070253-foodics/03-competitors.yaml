  title: Competitors
  summary: Foodics competes in a crowded restaurant-tech stack, but the most relevant battlefield in Saudi Arabia is not generic global POS breadth alone. Its strongest direct rivalry is with local and GCC-oriented vendors such as Marn, Sapaad, Matbex, and other Arabic-first or compliance-first systems, while Oracle, NCR, Revel, Toast, and Lightspeed matter more as enterprise or imported alternatives. Foodics' local advantage comes from Saudi market fit, ZATCA readiness, Arabic support, and an integrated software-plus-payments story. Its competitive risk comes from feature commoditization, lower-cost SMB tools, enterprise incumbents with deeper global chain relationships, and the fact that several buyer-facing differentiators such as online ordering, analytics, and integrations are no longer unique.
sections:
  - id: competitor-landscape
    title: The landscape is fragmented across local champions, imported enterprise incumbents, and low-cost substitutes
    body: >-
      Foodics does not compete against one single benchmark vendor. In Saudi Arabia, the relevant landscape splits into at least five classes: local Saudi specialists such as Marn; GCC-oriented restaurant operating systems such as Sapaad and Matbex; global cloud restaurant POS platforms such as Toast, Lightspeed, and Revel; older hospitality incumbents such as Oracle Simphony and NCR Aloha; and lower-cost SMB substitutes such as Loyverse or spreadsheets plus disconnected payment tools. This matters because different buyers are not running the same selection process. A single-site café may compare Foodics against Marn, Loyverse, or a manual setup, while a large chain may weigh it against Oracle, NCR, or a globally inherited Revel deployment. Foodics' strongest market position is in the middle: it is more localized than the large US incumbents, yet more operationally complete than the lightest low-cost tools. The competitive conclusion is therefore not that Foodics is universally best, but that it is best positioned where Saudi restaurants need local compliance, Arabic workflows, multi-branch control, and a broader operating system rather than a simple till.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
