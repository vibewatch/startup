    rows:
      - - Electronic payments reached 85% of retail payments in 2025
        - Positive driver
        - Current
        - Expands merchant readiness for integrated payment-linked restaurant software
        - Verify Foodics Pay attachment and take-rate by merchant cohort
      - - ZATCA Wave 24 integration deadline for SAR 375K+ turnover taxpayers
        - Positive driver
        - Immediate through 30 June 2026
        - Forces many restaurants to adopt or upgrade compliant billing and invoicing systems
