      - - Delivery and takeaway growth
        - Positive driver
        - Ongoing
        - Increases value of order aggregation, direct ordering, and unified reporting across channels
        - Measure share of Foodics customers using delivery integrations and online ordering modules
      - - Youthful, digitally engaged consumer base and urban infrastructure growth
        - Positive driver
        - Ongoing
