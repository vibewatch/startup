callouts:
  - calloutType: strength
    title: Why Saudi is structurally attractive for Foodics
    body: >-
      Foodics benefits from a combination that many emerging markets do not have at the same time: large restaurant
      demand, very high electronic-payment penetration, compliance pressure, and a local-language/local-payment
      requirement that slows generic global competitors.
    claimRefs:
      - CM017
      - CM019
      - CM026
      - CM031
      - CM032
  - calloutType: risk
    title: The TAM story is only strong if boundaries stay disciplined
    body: >-
      The easiest analytical mistake is to confuse Saudi Arabia's whole F&B economy with the narrower restaurant-software
      and payments layer that Foodics can monetize. That error can overstate TAM and make share assumptions look stronger
      than the evidence actually supports.
    claimRefs:
      - CM003
      - CM023
      - CM033
      - CM034
      - CM036

