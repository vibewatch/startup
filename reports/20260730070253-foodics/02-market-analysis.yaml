  evidenceGaps:
    - type: missing-source
      severity: material
      topic: saudi-restaurant-software-tam
      missingEvidence: A public, methodologically transparent estimate for Saudi restaurant software and integrated restaurant-payments TAM that cleanly excludes grocery retail, general POS hardware, and upstream F&B sectors.
      whyItMatters: Later valuation work will be stronger if TAM is anchored to the exact monetizable category rather than to foodservice or the broader F&B economy.
      diligencePath: Obtain paid analyst datasets or internal market-sizing work that isolates Saudi restaurant software, integrated payments, and module penetration by outlet type.
      relatedQuestionRefs:
