        - Request cohort data on digital-payment mix by city and merchant size
      - - Fragmented SMB base with low willingness to pay upfront
        - Negative constraint
        - Ongoing
        - Slows premium software adoption outside compliance-led purchases
        - Request CAC, payback, and package-mix data for micro and SME cohorts
