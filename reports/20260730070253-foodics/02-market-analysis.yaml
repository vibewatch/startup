tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment or category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Foodics
    rows:
      - - Saudi restaurant operating software
        - POS, order capture, menu management, branch reporting, inventory-linked workflows, staff permissions, analytics
        - ERP suites without restaurant workflows; hotel PMS; grocery POS not designed for restaurants
        - Restaurant owner or operator; payer usually owner, finance, or ops function
        - Core direct market; this is where Foodics' system-of-record logic lives
      - - Integrated restaurant payments
        - Card acceptance, wallet acceptance, terminal payments, pay-by-link, table-side payments, settlements, reporting
        - Consumer lending, card issuing, bank-core systems, processor economics outside the merchant layer
        - Merchant operator; payer through MDR or subscription bundle
        - Important monetization adjacency that deepens switching costs
      - - Digital ordering and channel management
        - Direct online ordering, self-ordering, delivery-order routing, order aggregation, branded digital storefronts
        - Marketplace GMV retained by aggregators; logistics fleet economics
        - Restaurant operator; payer is usually marketing or operations budget
        - Important for defending margin against delivery commissions and off-premise complexity
      - - Compliance and invoicing software
        - ZATCA-compliant invoicing, QR-code issuance, audit trails, archival, tax formatting, integration to Fatoora
        - Generic accounting tools without restaurant transaction workflow integration
        - Merchant owner / finance
        - Strong adoption trigger because compliance is increasingly non-optional
      - - Broader Saudi F&B economy
        - Retail and foodservice spend, manufacturing, halal exports, upstream sector investment
        - N/A
        - Investors and policymakers, not direct restaurant-software buyers
        - Useful context for macro demand, but too broad to use as Foodics' direct TAM
    notes: Foodics' defendable demand base is the restaurant operating-and-payments layer on top of Saudi foodservice, not the entire F&B economy.
    claimRefs:
