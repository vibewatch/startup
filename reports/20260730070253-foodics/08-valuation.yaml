- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Foodics has real operating scale with 33,000+ restaurants and $10B+ 2024 GMV.
    - Audited revenue and margin disclosure would strengthen the thesis materially.
  - - Payments, capital, and AI/data adjacencies create a credible premium narrative beyond basic POS.
    - Module attach, take rate, and loss-rate disclosure is needed to prove those adjacencies are economically attractive.
  - - Kamco’s 2025 stake purchase validates institutional demand and IPO optionality.
    - Ownership percentage, valuation, and instrument detail would be required to use the transaction as a pricing benchmark.
  - - 'Anti-thesis: public evidence still hides the denominator needed for proper multiple analysis.'
    - Annual revenue, ARR, and profitability disclosure would directly reduce this concern.
  - - 'Anti-thesis: Saudi / MENA concentration and fintech complexity deserve a discount to public comps.'
    - Broader geographic revenue mix and cleaner compliance disclosure would narrow that discount.
  notes: The anti-thesis is not that Foodics is weak; it is that current public pricing evidence is incomplete.
