- id: public-comp-corridor
  title: Public comps provide a live corridor, but they are useful mainly as discipline tools rather than direct answers
  body: 'Toast, Lightspeed, and Block show why price discipline matters. They are all public, all have current revenue snapshots, and all sit somewhere on the software-plus-payments continuum that Foodics wants to occupy. As of late July 2026, the observed public-sales corridor from the reviewed sources runs from roughly 1.2x trailing sales for Lightspeed to about 2.0x for Block and about 2.9x for Toast. Lightspeed is the closest restaurant-commerce software comp by product shape, Toast is the closest restaurant-tech growth narrative, and Block is the broadest payments-and-fintech reference. None is a perfect match for a Saudi private company with hidden revenue and lending economics, but together they create a useful reality check: even strong platforms do not receive unlimited multiples. Foodics can plausibly argue for premium features such as payments, capital, and AI/data tooling, yet it also deserves a private-company, geography, and disclosure discount versus listed peers with fuller
    filings.'
  claimRefs:
