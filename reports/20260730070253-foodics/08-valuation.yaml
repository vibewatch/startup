  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Toast
    - July 2026 market cap and trailing revenue
    - ~$18.9B market cap; ~2.9x sales by reviewed market-data sources
    - Closest public high-growth restaurant-tech narrative with integrated payments.
    - U.S.-listed, more mature disclosure profile, and broader public-market liquidity.
  - - Lightspeed Commerce
    - July 2026 market cap and FY2026 revenue
    - ~$1.44B-$1.46B market cap; ~1.2x sales
    - Useful restaurant / commerce software and payments comp with hospitality exposure.
    - Geographic mix and restructuring history differ materially from Foodics.
  - - Block
    - July 2026 market cap and trailing revenue
    - ~$48.9B-$49.4B market cap; ~2.0x sales
    - Relevant for fintech and payments monetization framing.
    - Much broader ecosystem than Foodics and not restaurant-specific.
  - - Foodics 2022 Series C
    - Private valuation anchor
    - Unicorn threshold confirmed in 2022; precise current mark undisclosed
    - Only hard private valuation floor visible in reviewed public record.
    - Stale for precise pricing and not enough for a 2026 rerating on its own.
  - - Kamco 2025 stake purchase
    - Secondary / private-market validation
    - Institutional demand confirmed; valuation and stake size undisclosed
    - Shows live investor appetite ahead of a Tadawul path.
    - Cannot be converted into a clean price benchmark without terms.
