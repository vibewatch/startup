- id: recommendation-and-scenarios
  title: 'The right call is track: the company quality is real, but the public file is too incomplete for an aggressive buy recommendation'
  body: The valuation problem is not whether Foodics matters; it plainly does. The valuation problem is that new capital would still be underwriting with a hidden denominator. Without disclosed revenue, margin, retention, or credit-loss data, investors cannot test whether the business deserves a Toast-like premium, a Block-like blended multiple, or a Lightspeed-like discount. The best-supported recommendation is therefore track, not buy and not pass. The company has enough scale, institutional support, product breadth, and IPO optionality that writing it off would be too harsh. But the evidence is also too thin to support a publishable claim that current private pricing leaves obvious upside. That makes the stance fair-to-full rather than cheap. In scenario terms, the unicorn floor remains the factual anchor, while any material uplift above that level should be treated as conditional on audited economics, stronger disclosure, and clean evidence that payments and capital attach improve quality
    rather than merely narrative breadth.
