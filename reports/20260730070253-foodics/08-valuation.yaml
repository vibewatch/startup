- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue disclosure comes in materially below what the current narrative implies
    - Annual revenue or ARR is weak relative to unicorn expectations
    - Public-comp support collapses because the denominator proves too small.
    - Reprice or pause the investment case.
  - - Fintech economics are poor
    - Payments take rate, loss rates, or capital defaults show weak unit economics
    - Premium-valuation narrative around embedded finance weakens sharply.
    - Cap upside and require revised valuation assumptions.
  - - IPO readiness slips again without better disclosure
    - No visible governance/reporting hardening before next IPO milestone
    - IPO optionality stops functioning as valuation support.
    - Treat listing as optional upside only.
  - - Customer-quality evidence deteriorates
    - Reference calls or public review signal suggest reliability or churn pressure
    - Growth quality and attach assumptions become less believable.
    - Move from track to caution / defer.
  - - Regulatory or compliance issue emerges
    - Any disclosed enforcement or material licensing problem in payments, lending, or data
    - Discount rate rises and listing pathway weakens.
    - Pause until remediation is verified.
  notes: Kill triggers focus on events that would actually change pricing confidence, not just generic business risk.
