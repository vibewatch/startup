  rows:
  - - Bull
    - Revenue quality is strong, payments and capital attach are accretive, IPO readiness improves, and growth sustains near recent signals.
    - $2.0B-$2.8B analytical envelope; needs evidence that Foodics merits a premium above the unicorn floor.
    - Disclosure may fail to support the premium; fintech losses or regulation could compress upside.
    - Possible, but not yet supported by current public evidence.
  - - Base
    - Foodics remains a genuine unicorn-scale platform, growth remains healthy, but major economics stay undisclosed.
    - $1.4B-$2.0B analytical envelope; public evidence supports quality and continued relevance more than a sharp rerating.
    - IPO timing drifts and multiple support remains incomplete.
    - Most plausible on reviewed public evidence.
  - - Bear
    - Growth slows, attach is weaker than implied, or public-market style diligence exposes weaker margins or higher credit/regulatory burden.
    - $1.0B-$1.4B analytical envelope; the 2022 unicorn floor still matters, but upside evaporates.
    - Disclosure disappointment and comp compression become dominant.
    - Real downside case if hidden economics underwhelm.
