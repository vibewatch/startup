company:
  name: Foodics
chapter:
  number: 8
  title: Valuation
  summary: 'Foodics looks like a real regional winner, but the public record still supports a disciplined valuation posture rather than a clean step-up call. The strongest facts are the 2022 unicorn-making Series C, 2025 Kamco stake acquisition, 33,000-plus restaurant footprint, more than $10 billion of 2024 GMV, and continued H1 2025 growth signals. The weakest facts are exactly the ones needed for precise pricing: annual revenue, gross margin, EBITDA, NRR, cap-table terms, and Foodics Capital loss performance remain undisclosed. Public restaurant and commerce-software comps show a live sales-multiple corridor, but Foodics cannot be dropped into that corridor mechanically because the denominator is hidden. The result is a constructive but price-sensitive call: track, medium confidence, medium-high risk, and a fair-to-full stance until audited economics or IPO-grade disclosure arrives.'
sections:
- id: known-valuation-anchors
  title: 'What is actually knowable: Foodics has credible private-market validation, but only a small number of hard valuation anchors'
  body: The first anchor is still the 2022 Series C. Official Foodics materials and independent coverage align that the company raised $170 million in April 2022 and crossed the unicorn threshold while positioning the proceeds for expansion, fintech, and adjacent operating modules. The second anchor is the 2025 Kamco stake purchase, which is strategically important because it shows institutional appetite close to a proposed Tadawul path. Multiple 2025 articles repeat that Foodics served more than 33,000 restaurants and exceeded $10 billion of 2024 GMV, while MENAbytes adds a useful H1 2025 operating update showing continued GMV and revenue growth. Those are strong business-quality signals, but they are not the same thing as a disclosed mark. Public evidence therefore confirms that Foodics is still in the unicorn class, yet it does not provide a clean refreshed valuation print or enough audited financial detail to defend a precise upside case above that floor.
