- id: section-O3
  title: Capital history, shareholder signaling, and milestone acceleration
  body: 'The 2022 Series C remains the single most important financing event in Foodics'' public record. Official and independent sources line up on the headline: $170 million led by Prosus and Sanabil, with Sequoia Capital India and existing investors including STV and Endeavor Catalyst also participating. The strategic use of proceeds is equally important. Foodics said the round would fund geographic expansion, acquisitions, micro-lending, supply-chain initiatives, and entry into non-food micro-retail. In hindsight, later announcements make that capital-allocation story credible: the company deepened payment infrastructure partnerships, broadened merchant-finance tooling via open banking, announced a $100 million strategic acquisition and investment plan in 2025, and completed the Norma acquisition in 2026 to extend an AI division.


    The Kamco stake purchase adds a different signal. Because the amount and ownership percentage were not disclosed, it cannot be treated as a clean new-money valuation marker. But it does suggest secondary liquidity interest and a widening shareholder base before any eventual listing. Public reports also show two different types of IPO messaging: a May 2024 statement about possibly listing at least 30% of shares by end-2025, and later 2025 coverage that softened the timeline to a two-to-three-year window. That slippage does not kill the IPO thesis, but it does imply that timing remains aspirational rather than committed. Public-company style disclosure readiness is therefore still catching up with the strategic ambition.'
