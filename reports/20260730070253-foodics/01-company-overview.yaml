- id: section-O2
  title: Founders, visible leadership, and organizational footprint
  body: 'Public sources consistently place Foodics'' founding in 2014 and identify Ahmad AlZaini plus Mosab Al-Othmani as the founding pair, though transliterations vary across third-party databases. The public leadership picture is far clearer for Ahmad AlZaini than for any broader board or governance structure. He appears as the voice of the 2022 Series C, the Alinma bank alliance, the 2025 acquisition strategy, the 2026 Norma acquisition, and Lean-related fintech positioning. That repeated pattern supports a key-person dependence view: investors and prospective public-market buyers are effectively underwriting a company whose external narrative is still heavily centered on the co-founder CEO.


    Third-party people-data sources suggest Foodics is no longer a small startup. Tracxn reports 1,142 employees as of June 2026, while LeadIQ places the company in the 1,001-5,000 employee range and shows meaningful staff concentration in Saudi Arabia, Egypt, and the UAE, alongside smaller footprints elsewhere. Those numbers are directionally useful because they corroborate that the company is above 1,000 employees, but they are still derived from commercial datasets rather than audited filings. What remains materially missing is governance transparency: the public evidence reviewed here does not disclose a full board roster, the mix of independent directors, or a formal succession plan. That gap becomes more important, not less, because Foodics is now discussed as a pre-IPO candidate.'
