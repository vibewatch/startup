- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - More branches per customer
    - Branch-heavy operators can expand seat, device, and workflow usage
    - Supports land-and-expand economics if churn is contained
    - Request branch expansion cohorts and same-account growth data
  - - Payments attach
    - Foodics Pay can deepen monetization among existing merchants
    - Can raise revenue concentration on payment-active merchants
    - Request payments attach and GMV concentration by cohort
  - - Analytics / accounting / AI attach
    - Back-office and intelligence modules can lift ARPU over time
    - Attach may be uneven by merchant sophistication
    - Request module penetration by segment
  - - Geographic expansion
    - Egypt and broader regional growth can diversify the base
    - Current geography-by-revenue and geography-by-customer mix is undisclosed
    - Request country-level customer and revenue mix
  - - Large-group customer concentration
    - Groups such as Foods Gate or chain brands may be strategically important
    - Public record does not reveal top-account share or contract concentration
    - Request top-10 customer revenue share and renewal exposure
  notes: Expansion logic is plausible, but concentration risk is still mostly unknown publicly.
