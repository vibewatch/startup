- id: durability-satisfaction-and-adverse-signal
  title: Durability is under-disclosed, and open-market satisfaction evidence is materially weaker than official testimonial evidence
  body: 'The biggest weakness in the customer chapter is not adoption but durability. There is no public NRR, GRR, churn, renewal, contract-length, or cohort disclosure in the reviewed materials, so the retention story cannot be underwritten from public evidence alone. Foodics'' official customer voices skew positive and emphasize operational usefulness, support, and branch management. Independent open-review evidence is much less flattering: Trustpilot shows a poor rating and recurring complaints around service or support quality, which raises the possibility that implementation and post-sale experience are more uneven than the official surface suggests. This does not negate the existence of real adoption, but it does mean the current public record is asymmetric. Positive customer proof is concrete and named, whereas negative signal is broader but less customer-specific. The right investor conclusion is that deployment is clear, satisfaction is mixed, and durability economics remain mostly
    unverified.'
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU028
