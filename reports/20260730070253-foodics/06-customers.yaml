company:
  name: Foodics
chapter:
  number: 6
  title: Customers
  summary: 'Foodics'' public customer evidence is stronger on existence and deployment breadth than on durability economics. The company and independent reporting consistently place it at meaningful scale across tens of thousands of restaurants or branches, with the strongest current independent metric being 33,500 active restaurant branches in H1 2025 and the strongest official 2026 scale marker being over 40,000 branches on platform after the Norma acquisition. Named-customer proof is unusually concrete for a growth-stage private software company: Foodics'' public surfaces quote restaurant operators such as 7Ribs, Koobs Cafe, Mazaj Maghrebi, Chef''s Restaurant, and Food Gate Co., and those brands maintain their own public operating surfaces. What remains thin is the investor-grade layer: there is no public NRR, churn, contract-duration, concentration, or cohort data, and open-review evidence is materially more mixed than the official testimonials.'
sections:
- id: customer-base-and-segmentation
  title: Customer scale is real and spans independents, micro-businesses, and multi-branch operators
  body: 'The public record is strong enough to conclude that Foodics has real customer scale rather than a small logo list. Independent 2025 reporting from Menabytes places the company at more than 33,500 active restaurant branches, while Wamda and Arab News place Foodics above 33,000 restaurants. Official 2025 and 2026 releases offer adjacent but directionally consistent scale markers: more than 30,000 F&B business owners across 30 countries in the Solo release and more than 40,000 branches on platform in the Norma release. The boundary is imperfect because restaurants, business owners, and branches are not interchangeable units, but the directional signal is unmistakable: Foodics serves a large installed base. Segment evidence also points beyond a single merchant archetype. Alinma materials emphasize SMBs and micro-businesses, while named testimonials and customer-owned websites show the platform is being used by local chains, restaurant groups, and multi-branch brands rather than only
    standalone outlets.'
  claimRefs:
