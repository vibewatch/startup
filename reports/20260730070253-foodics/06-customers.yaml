- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Main gap
  rows:
  - - Independent or micro restaurant
    - Owner-operator / cashier / merchant
    - Core POS, payments, and operational control
    - Alinma release explicitly targets SMBs and micro-businesses
    - Large addressable base and likely high logo count
    - No public ARPU or churn by micro segment
  - - Single-brand local chain
    - Operator / branch managers / finance owner
    - Branch visibility, inventory, analytics, and payments
    - Mazaj and Koobs testimonials reference cost, inventory, analytics, and branch management
    - Likely strong expansion surface for added branches
    - No segment-level penetration metrics
  - - Restaurant group / multi-brand operator
    - Group leadership / ops / finance
    - Multi-brand branch management and reporting
    - Foods Gate and FBH / Chef's support group-scale use cases
    - Strategically important for land-and-expand logic
    - No public revenue share by group accounts
  - - Dine-in restaurant operator
    - Merchant / front-of-house / guest
    - Checkout speed and service workflow
    - Qlub integration shows self-checkout demand
    - Supports payments and checkout attach
    - No public attach rate
  - - Regional or international operator
    - Merchant / finance / ops
    - Cross-market operating stack and growth support
    - Wamda, Arab News, Solo, and Norma sources all show multi-country reach
    - Validates broader MENA relevance
    - No public geography-by-revenue disclosure
  notes: Public evidence supports several customer segments, but not clean revenue mix by segment.
