- id: expansion-loops-and-concentration-unknowns
  title: The platform has plausible expansion loops, but customer concentration and geographic revenue mix remain opaque
  body: Foodics has several believable land-and-expand pathways. Multi-branch or multi-brand restaurant groups can add more branches, more staff seats, more devices, and additional modules such as payments, online ordering, accounting, and analytics. Partnership and ecosystem evidence suggests the company is also deepening relationships by solving adjacent jobs such as dine-in self-checkout, procurement, and merchant finance. The Million Riyal Menu sponsorship in Saudi Arabia, after prior work with the Egypt edition, also shows the brand positioning itself close to emerging restaurant concepts, not only established chains. Even so, the company has not publicly disclosed top-account share, revenue concentration, or a clean geography-by-revenue breakdown. International revenue growth in H1 2025 was strong, but the base is unknown. As a result, Foodics can be credited with clear adoption and plausible expansion logic, but not yet with a publicly verifiable concentration or retention profile. That is the key gap between strong surface adoption and true customer-quality underwriting in public markets today with confidence today.
