  - Real operating scale with 33,000+ restaurant customers and $10B+ of 2024 GMV.
  - Product breadth across POS, payments, and capital creates genuine multi-module upside.
  - Institutional validation from the 2022 Series C and 2025 Kamco stake purchase.
