      - number: '3.3'
        title: 能力宽度正在收敛，但本地化、定价透明度和分销仍在拉开厂商差距
        blocks:
          - type: paragraph
            body: >-
              在餐饮科技厂商之间，能力矩阵已经不再由系统能否接单、打印小票来定义。现在的差异点在本地支付支持、监管适配、集成、在线点餐、后厨工具、分析、部署速度，以及这些功能是原生提供还是靠附加组件补上。Foodics
              的公开产品界面展示 POS、支付、在线点餐、Foodics One 和 100+ 集成，支撑其面向沙特运营商的宽模块叙事。Marn
              提供更简单但可信的本地替代方案，具备云端运行、离线模式、分析和多语言支持。Oracle 和 NCR 强调规模、开放 API、后厨编排和连锁级运营韧性；Lightspeed
              强调基准、多门店控制和酒店餐饮管理；Toast 强调易用性、硬件和现代产品栈，但沙特公开证据弱。定价透明度不均。Toast 和 Loyverse
              至少公开了部分商业模式；Foodics、Oracle、NCR、Marn 和 Sapaad 在审阅证据中大多仍是报价驱动。缺乏透明度对企业销售并非天然负面，但会让 SMB
              价格比较更容易受评测网站和竞争者的第三方叙事影响。分销也重要：即便全球平台纸面上功能更丰富，沙特运营商也可能理性地偏好更本地化的厂商，因为部署、支持、支付兼容和税务合规决定价值落地速度。
