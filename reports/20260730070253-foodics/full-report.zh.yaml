      - number: '2.4'
        title: 增长驱动、采用约束，以及估值真正该看什么
        blocks:
          - type: paragraph
            body: >-
              Foodics 的市场多头逻辑，不只是沙特餐厅在增长，而是多个结构性驱动同时对齐。Vision 2030 推动旅游和娱乐扩张，正在放大利雅得、吉达、目的地项目和综合用途街区的餐厅需求；Mordor
              的行业研究也把餐厅增长分别归因于年轻人口、城市基础设施和配送渠道扩张。堂食仍是餐饮服务、快餐和全服务餐厅中的最大收入池，但配送和外带是增长更快的边缘，这会提升统一店内和店外流程系统的价值。不过，重要刹车仍在。公开市场测算很混乱：有的来源描述沙特
              食品与餐饮经济，有的描述餐饮服务行业，有的描述 POS 软件市场，还有的给出未经佐证的云 POS
              渗透率说法。餐厅买方也仍然分散、价格敏感，且许多商户小到可以推迟软件升级，直到合规或增长痛点无法回避。本地化也是一道真实筛选：阿拉伯语支持、mada 和钱包受理、ZATCA 就绪度在沙特很重要，这让通用全球
              POS 的扩张更难。对估值来说，最好的结论是 Foodics 位于强劲且增长中的市场，但精确 TAM、渗透率和支付意愿曲线，并不像表层叙事看起来那样清晰可测。
