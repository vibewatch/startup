  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与最站得住脚的测算口径
        blocks:
          - type: paragraph
            body: >-
              分析 Foodics
              应放在沙特餐厅运营软件和支付栈里，而不是对标所有沙特消费，甚至也不是对标王国完整的餐饮经济。对估值最关键的边界，是直接连接餐厅运营的软件与支付流程：POS、订单采集、菜单和门店管理、后厨和桌台流程、支付受理、发票合规、分析、在线点餐和相关集成。应剔除的支出包括杂货零售、上游食品制造、酒店物业管理软件、外卖平台由聚合方保留的
              GMV，以及并非为餐厅运营商专门打造的通用企业软件。这个区分很重要，因为一些公开来源引用约 $75B 的沙特食品与餐饮 机会，把零售和餐饮服务打包在一起；而 Foodics
              更近的需求基础，是覆盖在沙特餐饮服务之上的餐厅运营层。这个较窄边界中最强的公开需求锚点，是 Mordor Intelligence 估计沙特餐饮服务市场在 2026 年达到 $32.56B，2031 年达到
              $48.06B。对垂直软件和金融科技平台来说，这仍是非常大的需求底盘，但它显著小于食品与餐饮头部数字，因此更适合尽调使用。由此得到的市场论点，应建立在餐饮服务内部的运营数字化上，而不是整个消费者支出宇宙。
