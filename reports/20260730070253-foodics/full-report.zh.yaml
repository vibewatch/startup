        title: 门店、GMV、支付量和 ARR 增长等公开牵引力很强，但没有披露收入
        blocks:
          - type: paragraph
            body: >-
              在区域餐饮科技市场，Foodics 作为私营公司的公开牵引力信号异乎寻常地强。最有用的新数据点来自 Menabytes H1 2025 报告：Foodics 达到 33,500 家活跃餐厅门店，半年处理 $6B
              GMV，支付量增长 38%，ARR 增长 29%，国际收入增长 56%。这些数字重要，因为它们显示业务不只是卖出更多软件席位，也在提高嵌入式金融科技活动和地域覆盖。它们也与更宽的 2025
              年外部叙事吻合：Foodics 在 2024 年年度 GMV 超过 $10B，并按吞吐量仍是区域最大的餐饮科技平台之一。官方发布从另一个角度支撑规模叙事：截至 2022 年 4 月累计订单超过 5B
              单；后续伙伴和 M&A 发布中超过 6B 单；Foodics 客户群中已有 10,000 家门店使用 Norma 分析；Norma 收购公告称，到 2026 年 6 月平台门店超过 40,000
              家。可是，公开档案仍止步于股权或成长型投资人通常最需要的指标之前。精确收入、毛利、EBITDA、自由现金流或分群留存表均未披露。这意味着牵引力有说服力，但变现质量仍部分藏在吞吐量和挂载增长代理指标后面。
