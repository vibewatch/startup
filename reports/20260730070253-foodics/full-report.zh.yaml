  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入和 ARR
        - 经审计的 2025 和 2026 年收入、ARR 和增长桥
        - 要精确把 Foodics 映射到公开可比公司区间，就需要这些数据。
        - 索取 CFO 材料包或 IPO 准备财务材料。
      - - 利润率质量
        - 毛利率、贡献利润率和支付抽成率
        - 决定金融科技和软件是否配得上溢价倍数。
        - 索取经审计的分部经济性和单位经济性桥。
      - - Foodics Capital 风险
        - 贷款账簿规模、资金来源、违约、回收和拨备
        - 嵌入式金融亏损会迅速摧毁估值支撑。
        - 索取放贷和催收仪表盘，以及承保备忘录。
      - - 股权结构 / Kamco 条款
        - 持股规模、工具、优先权，以及任何二级 / 一级拆分
        - 这是把 2025 年机构验证解读成定价信号所必需的。
        - 索取股权结构摘要和交易备忘录。
      - - IPO 准备
        - 治理、报告控制、经审计报表和上市工作计划
        - 要把媒体层面的 IPO 叙事转化为实际估值支撑，就需要这些证据。
        - 索取董事会材料和 IPO 准备清单。
    notes: 这些缺失项最可能快速改变建议。
