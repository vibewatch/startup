      - number: '7.4'
        title: 最大残余风险，是用公开市场叙事推进，却缺少公开市场级披露深度
        blocks:
          - type: paragraph
            body: >-
              最有信息量的风险信号，可能是时间表漂移。2024 年，Sharikat Mubasher 报道 Foodics 正在研究到 2025 年底 IPO、发行至少 30% 股份。到 2025 年 Kamco
              交易进入流通报道时，公开表述已经转向两到三年的上市窗口。这不证明失败，但说明 IPO 时点有弹性。与此同时，公司在增加融资、开放银行、AI
              和收购复杂度，却没有公开披露贷款账簿质量、违约率、现金跑道、集中度、NRR 或完整可靠性指标。私募成长投资人或许可以接受部分不透明；但若要讲给公开市场听，这就是实打实的执行风险。更合适的解读是：Foodics
              仍可能在搭建可信 IPO 路径，但证明责任已经从市场热度转向治理、控制、客户耐久度和财务披露成熟度。
