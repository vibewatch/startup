      - number: '8.2'
        title: 公开可比公司给出实时区间，但主要价值是约束，而不是直接答案
        blocks:
          - type: paragraph
            body: >-
              Toast、Lightspeed 和 Block 说明为什么价格纪律重要。它们都是上市公司，都有当前收入快照，也都处在 Foodics 想进入的软件加支付连续谱上。截至 2026 年 7
              月下旬，复核来源显示的公开市销率区间，大约从 Lightspeed 的 1.2x 过去销售额，到 Block 约 2.0x、Toast 约 2.9x。按产品形态看，Lightspeed
              是最接近的餐饮商业软件可比；按餐饮科技成长叙事看，Toast 最接近；Block
              则是最宽的支付与金融科技参照。没有一家能完美匹配一家收入和信贷经济性都隐藏的沙特私营公司，但合在一起能提供有用的现实校验：即便是强平台，也拿不到无限倍数。Foodics 可以合理主张支付、资金和
              AI/数据工具带来的溢价特征，但相较披露更完整的上市同业，它也应承受私营公司、地域和披露折扣。
