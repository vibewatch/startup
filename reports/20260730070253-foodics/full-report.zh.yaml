      - number: '2.3'
        title: 支付数字化、合规压力，以及沙特采用速度为什么可能很快
        blocks:
          - type: paragraph
            body: >-
              沙特市场结构越来越偏向集成式餐厅软件和支付，而不是独立开票工具。最清晰的宏观信号来自 SAMA：电子支付在 2025 年达到零售总支付的 85%，高于 2024 年的 79%；电子交易升至 14.6B
              笔。这大幅降低了区域内餐厅软件变现的一项历史障碍：商户以现金为主，对数据联动支付基础设施需求不强。与此同时，ZATCA 的电子发票制度让合规更有时限压力。集成阶段第 24 波覆盖 2022、2023 或 2024
              年 VAT 应税收入超过 SAR 375,000 的纳税人，并要求在 2026 年 6 月 30 日前完成集成。第二阶段还要求更严格的发票格式、与 Fatoora
              平台系统集成，以及额外安全和记录留存要求。这些规则不会强迫商户专门购买 Foodics，但会迫使许多沙特餐厅采用、升级或重配数字系统，把支付受理、发票生成、审计轨迹和门店级运营报表一起处理。对已经超过 Excel
              或松散集成旧收银机能力的餐厅，这种推动尤其强。
