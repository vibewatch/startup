    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入质量强，支付和资本业务附加能增厚收益，IPO 准备改善，增长保持接近近期信号的水平。
        - $2.0B-$2.8B 分析区间；需要证据证明 Foodics 配得上高于独角兽底线的溢价。
        - 披露可能无法支撑溢价；金融科技亏损或监管可能压缩上行空间。
        - 可能，但当前公开证据尚不支持。
      - - 基准
        - Foodics 仍是真正具备独角兽规模的平台，增长保持健康，但关键经济指标仍未披露。
        - $1.4B-$2.0B 分析区间；公开证据更能支撑公司质量和持续价值，而不是明显重估。
        - IPO 时间漂移，倍数支撑仍不完整。
        - 基于已审阅公开证据，这是最可能情景。
      - - 悲观
        - 增长放缓，附加率弱于暗示水平，或公开市场式尽调暴露出更弱利润率或更高信贷 / 监管负担。
        - $1.0B-$1.4B 分析区间；2022 年独角兽底线仍重要，但上行空间消失。
        - 披露令人失望和可比公司倍数压缩成为主导因素。
        - 若隐藏经济指标不及预期，下行情景真实存在。
    notes: 情景区间是委员会讨论工具，锚定已知独角兽底线和公开可比公司走廊，并非公司披露估值。
