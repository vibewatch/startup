  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 随着 Foodics 更深进入支付、借贷、数据和 IPO 准备，监管与法律义务正在上升
        blocks:
          - type: paragraph
            body: >-
              Foodics 已很难按普通餐厅 SaaS
              工具来承销。它自己的隐私和支付条款显示，服务足迹很宽，横跨网站、应用、软件、硬件、支付和账户；沙特监管来源也显示，个人数据保护、开放银行和支付系统监督环境正在收紧。SDAIA 的框架现在明确包括
              PDPL、实施条例、数据泄露程序、DPO 规则、转移指引和认证框架。与此同时，SAMA 相关 2026
              年材料显示，开放银行已进入许可监管制度，支付系统监督也已扩展到金融科技和数字金融服务。这对市场合法性是战略利好，但也提高了在同意、治理、网络安全、报告和运营韧性上出错的成本。最后，沙特上市规则明确表明，Tadawul
              IPO 路径伴随沉重的持续义务和披露纪律，而 Foodics 当前公开档案尚未在上市公司层面证明这种能力。
