            body: >-
              Foodics 确实披露了一些控制层证据。会计模块页面描述了角色定制、访问日志和定期备份；API Adapter 流程要求在与注册实体共享销售订单数据前取得所有者授权。支持页面公布了多国电话号码，并重复公司的
              SAMA 监管和金融科技许可定位。这些信号有用，但距离成熟的公开信任中心还很远。检索到的开发者界面显示 API 文档和开发者页面存在，但可公开获取内容很少。官方 GitHub
              组织在访问时没有可见公开仓库，社区仓库存在但不能当作权威产品文档。合并来看，公开记录支持一个基本结论：Foodics
