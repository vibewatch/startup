      - number: '1.4'
        title: 当前优势、负面信号与仍未证实的部分
        blocks:
          - type: paragraph
            body: >-
              即使没有数据室权限，Foodics 当前最强的优势也很清楚。它通过反复出现的 SAMA 金融科技表述，具备本地可信的沙特监管姿态；在 POS
              和支付上产品深度可见，伙伴生态庞大，装机基础可观，投资人阵容也有说服力。公开里程碑轨迹还显示，公司不是偏航，而是在战略上拓宽：从餐厅 SaaS 延伸到支付、入驻合作、商户融资赋能、收购，如今又进入
              AI。正因如此，媒体越来越多把 Foodics 描述为沙特科技冠军和 IPO 前资产，而不只是垂直软件厂商。


              不过，公司概览章节必须保留负面和未解信号，不能全部推到风险章节。Trustpilot 评分偏低，仅
              2.2/5，具体投诉涉及支持、系统宕机、退款摩擦和实施质量。单靠这一点不足以推翻规模叙事，但如果不处理，服务质量问题可能放大流失、损害品牌信任，或拖累国际扩张。同样重要的是，公开档案仍缺少经审计收入、利润、精确估值、Kamco
              准确持股和正式治理细节。正确解读不是 Foodics 弱，而是公司已经足够大、战略重要性足够高，披露缺口现在比早期私营 SaaS 公司阶段更重要。
