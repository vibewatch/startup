        title: 直接竞争者在地域、客群和产品深度上差异很大
        blocks:
          - type: paragraph
            body: >-
              梳理 Foodics 直接竞争，最清楚的办法是看谁在争夺同一项餐厅任务。Marn 是高度相关的本地参照：总部在 利雅得，支持阿拉伯语，基于云，并明确向餐厅运营商承诺离线连续性和报表。Sapaad 和 Matbex
              则讲述更宽的餐厅运营叙事，围绕统一流程、后厨工具、配送或薪资相邻能力，以及面向从咖啡馆到企业客户的报价式包装。这些厂商最可能在沙特和 GCC 的 SMB 到中端市场交易中挑战
              Foodics。全球厂商只在更选择性的场景中重要。Toast 在运营上很深，在北美评价很高，但本文审阅的公开证据仍显示它不在 GCC 内，也没有沙特特定支付和合规定位。Lightspeed
              提供宽餐厅功能、分析和多门店支持，但公开定位在欧洲和北美比在沙特餐厅运营中强得多。Oracle Simphony 和 NCR Aloha
              对大型连锁仍有意义，因为它们强调规模、多渠道订单编排、正常运行时间和集成广度。Revel 符合类似的企业级进口模式，不过这里可用的公开证据更薄，因为网站部分设有机器人防护。因此，Foodics
              的相对强项不是普遍功能优越，而是本地适配加多流程完整性的更窄、也更有价值的组合。
