      - number: '1.3'
        title: 资本历史、股东信号与里程碑加速
        blocks:
          - type: paragraph
            body: >-
              2022 年 Series C 轮仍是 Foodics 公开记录中最重要的融资事件。官方和独立来源在核心信息上对齐：Prosus 和 Sanabil 领投 $170M，Sequoia Capital India
              以及 STV、Endeavor Catalyst 等既有投资者参投。资金用途同样重要。Foodics
              称本轮将支持地域扩张、收购、小额贷款、供应链举措，以及进入非食品微型零售。回头看，后续公告让这条资本配置叙事具备可信度：公司深化支付基础设施合作，借助开放银行拓宽商户融资工具，2025 年宣布 $100M
              战略收购和投资计划，并在 2026 年完成 Norma 收购以扩展 AI 部门。


              Kamco 入股交易释放了另一类信号。由于金额和持股比例未披露，不能把它当作干净的新钱估值标记。但它确实暗示二级流动性兴趣，也显示潜在上市前股东基础在扩大。公开报道还呈现两类 IPO 信息：2024 年 5
              月曾称可能在 2025 年底前至少上市 30% 股份，后续 2025 年报道则把时间表软化为两到三年窗口。这种延后不会推翻 IPO
              论点，但意味着时点仍更像愿望，而不是承诺。因此，上市公司式披露准备仍在追赶战略雄心。
