          label: $170M C 轮
          detail: Prosus 和 Sanabil 领投公司历史上公开讨论规模最大的融资轮。
          tone: positive
        - date: 2022-07
          label: Alinma 金融科技合作
          detail: 银行合作深化中小商户支付和入驻逻辑。
