              客户章节最大的弱点不是采用，而是耐久性。审阅材料中没有公开 NRR、GRR、流失、续约、合同期限或 cohort 披露，因此留存故事无法只靠公开证据承销。Foodics
              官方客户声音偏正面，强调运营有用性、支持和门店管理。独立开放评价证据要难看得多：Trustpilot
              评分差，围绕服务或支持质量反复出现投诉，这提出一种可能性：实施和售后体验比官方界面显示的更不均衡。这不会否定真实采用的存在，但意味着当前公开记录不对称。正面客户证据具体且具名；负面信号更宽泛，但客户特定性更弱。投资人的正确结论是：部署清晰，满意度混杂，耐久性经济性大多仍未验证。
