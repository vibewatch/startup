      - number: '4.4'
        title: 资本充足性看起来能支撑增长投入，但披露太薄，无法给出真正 IPO 就绪判断
        blocks:
          - type: paragraph
            body: >-
              资本故事方向上令人鼓舞，但仍不完整。Foodics 2022 年 Series C 轮从 Prosus 和 Sanabil 领投的高质量投资人处获得
              $170M，官方说法把资金用途绑定到地域扩张、M&A、金融科技、小额贷款和供应链举措。后续动作显示资金使用基本符合这条叙事：Foodics 扩大支付合作，宣布三年 $100M 收购和投资计划，收购
              Solo，先入股 Norma 后又完全收购，并更深推进开放银行赋能的商户融资。2025 年 Kamco 持股购买又释放资本市场信号，显示潜在 Tadawul 上市前有机构需求。但充足不等于透明。Kamco
              未披露的持股，以及 Tracxn 模糊的 2025 年融资记录，都无法给出 IPO
              投资人想看的干净现金余额图景。公开证据仍缺少当前账面现金、债务义务、月度烧钱、借贷产品融资成本，以及资本在收购和经营续航之间的分配。财务上，Foodics
              看起来是一家能持续获得战略资本、继续建设的严肃成长公司。但在没有管理层数据的情况下，它还没有公开记录到足以让投资人承销盈利能力。
