      - number: '8.4'
        title: 能改变建议的因素：更清晰的经济性、股权结构透明度和 IPO 级披露
        blocks:
          - type: paragraph
            body: >-
              未来出现买入理由是可能的，但门槛很具体。第一，Foodics 需要披露年收入或
              ARR，并讲清软件、支付和资金业务经济性如何衔接。第二，投资人需要毛利率、贡献利润率，或至少抽佣率数据，判断金融科技层是在增厚价值，而不是增加运营成本。第三，股权结构很重要：Kamco 2025
              年进入验证了需求，但没有持股比例、证券工具结构或任何优先权细节，就不能把它当成干净的价格标记。第四，公司需要证明 IPO
              准备正在转化为上市公司级治理和报告，而不只是媒体上讨论时间表。在这些问题解决之前，建议应保持建设性但有纪律。Foodics
              值得继续尽调、接触管理层并持续跟踪，而不是盲目支付溢价。如果经审计指标和治理深度落地顺利，建议改善的速度可能快过当前市场叙事所暗示的节奏。
