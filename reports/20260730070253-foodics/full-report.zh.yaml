    layout: standard
    summary: 分析区间拉得很宽，因为 2022 年独角兽底线是事实，2026 年上行空间则需要判断，不是已披露定价给出的。
    data:
      items:
        - label: 悲观情景
          low: 1000
          mid: 1200
          high: 1400
          displayValue: $1.0B-$1.4B
          detail: 披露不及预期，或可比公司倍数压缩占主导。
        - label: 基准情景
          low: 1400
          mid: 1700
          high: 2000
          displayValue: $1.4B-$2.0B
          detail: 质量真实，但经济性披露前，重估只能部分兑现。
        - label: 乐观情景
          low: 2000
          mid: 2400
          high: 2800
          displayValue: $2.0B-$2.8B
          detail: 支付、资金和 AI 附着被证明能带来增量价值，IPO 就绪度改善。
        - label: 已知硬底线
          low: 1000
          mid: 1000
          high: 1000
          displayValue: $1.0B+
          detail: 2022 年独角兽门槛参考。
    approximationNotes: 情景区间是 IC 式分析包络，锚定已知独角兽门槛和上市可比公司区间，而非公司披露的估值标记。
