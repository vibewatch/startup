              赞助沙特 Million Riyal Menu，也显示品牌正把自己贴近新兴餐厅概念，而不只是成熟连锁。即便如此，公司没有公开披露头部账户占比、收入集中度，或按地域划分的清晰收入拆分。H1 2025
