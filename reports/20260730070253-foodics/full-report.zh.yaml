      - number: '5.2'
        title: 运营模式看起来以控制台为中心、重集成、重授权，而不是开放自助
        blocks:
          - type: paragraph
            body: >-
              公开记录里最清晰的架构信号不是系统图，而是一种运营模式。Foodics 似乎围绕商户控制台、按门店划分的运营数据，以及不断扩展的伙伴或模块延伸来组织平台。API Adapter
              文档显示，第三方访问必须由商户所有者明确授权，并可限制在选定门店，这意味着账户和权限模型围绕受控数据暴露搭建，而不是广泛匿名 API 使用。Integration Availability
              文章进一步说明，自定义集成被 Advanced 计划或购买 API 许可证限制。市场和合作材料显示，Foodics
              依赖集成来覆盖采购、客人结账、会计和其他延伸。这看起来像一套实用的餐厅运营架构，同时带有平台野心。它也意味着产品质量实质上取决于伙伴连接、权益逻辑和实施支持，而这些在审阅来源中都没有工程深度描述。
