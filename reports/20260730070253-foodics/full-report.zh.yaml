  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管合规滑坡
        - 正式执法、牌照问题或重大审计缺陷
        - 任何已披露且涉及支付、借贷或数据保护的执法行动
        - 在整改获验证前，暂停或重估投资假设
      - - 支持或正常运行时间恶化
        - 具名参考客户投诉量上升或客户流失
        - 多次参考访谈提到未解决的服务故障
        - 将投资假设从增长转向修复，并要求运营计划
      - - IPO 准备进度滑移
        - 时间表再次延后，披露质量却没有改善
        - 下一个 IPO 节点前，看不到治理和披露强化证据
        - 将 IPO 视为可选上行，而非核心估值支撑
      - - 嵌入式金融亏损敞口
        - 逾期率上升，或损失控制未定义
        - 管理层无法量化贷款账簿质量或违约敞口
        - 在金融风险透明前，限制估值上行
      - - 合作伙伴依赖冲击
        - 主要支付、开放银行或 AI 合作伙伴中断
        - 合作伙伴事件后，核心流程明显恶化
        - 要求审查合作伙伴集中度，并提供应急架构
    notes: 否决标准可监控，因为它们盯的是明确事件或管理层缺失答案，而不是模糊的战略不适。
