  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分散：本地冠军、进口企业级既有厂商与低成本替代品并存
        blocks:
          - type: paragraph
            body: >-
              Foodics 面对的不是单一标杆厂商。在沙特，相关格局至少分成五类：Marn 等本地沙特专业厂商；Sapaad 和 Matbex 等面向 GCC 的餐厅操作系统；Toast、Lightspeed、Revel
              等全球云餐厅 POS 平台；Oracle Simphony、NCR Aloha 等较老酒店餐饮既有厂商；以及 Loyverse 或 Excel + 割裂支付工具这类低成本 SMB
              替代品。这很重要，因为不同买方并不走同一套选型流程。单店咖啡馆可能拿 Foodics 与 Marn、Loyverse 或手工方案比较；大型连锁则可能在 Oracle、NCR 或全球继承下来的 Revel
              部署之间权衡。Foodics 最强的位置在中间：它比大型美国既有厂商更本地化，又比最轻量的低成本工具更完整。竞争结论因此不是 Foodics
              普遍最好，而是当沙特餐厅需要本地合规、阿拉伯语流程、多门店控制和更宽的操作系统，而不是简单收银机时，Foodics 的位置最好。
