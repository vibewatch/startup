      - number: '1.2'
        title: 创始人、可见领导层与组织规模
        blocks:
          - type: paragraph
            body: >-
              公开资料一致把 Foodics 的创立时间指向 2014 年，并将 Ahmad AlZaini 和 Mosab Al-Othmani 标为创始二人组，尽管第三方数据库的转写不完全一致。公开领导层画像里，Ahmad
              AlZaini 远比董事会或更宽的治理结构清晰。他是 2022 年 Series C、Alinma 银行联盟、2025 年收购策略、2026 年 Norma 收购以及 Lean
              相关金融科技定位的对外声音。这种反复出现的模式支撑一个关键人物依赖判断：投资人和潜在公开市场买家，实际是在承销一家外部叙事仍高度围绕联合创始人 CEO 展开的公司。


              第三方人员数据来源显示，Foodics 已不再是小型初创公司。Tracxn 报告称，截至 2026 年 6 月，Foodics 有 1,142 名员工；LeadIQ 将公司置于 1,001-5,000
              人区间，并显示员工明显集中在沙特、埃及和阿联酋，其他地区规模更小。这些数字有方向性价值，因为它们相互印证公司员工已超过 1,000
              人，但仍来自商业数据集，而不是经审计申报。实质缺口在治理透明度：本文审阅的公开证据没有披露完整董事会名单、独立董事比例或正式接班计划。Foodics 已被讨论为 IPO 前候选公司，这一缺口只会更重要，不会更轻。
