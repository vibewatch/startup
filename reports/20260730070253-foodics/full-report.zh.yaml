      - number: '3.4'
        title: Foodics 有真实本地护城河，但并非不可攻破
        blocks:
          - type: paragraph
            body: >-
              Foodics 的护城河在本地复杂度高、买方预算有分量的地方最强。需要 ZATCA 就绪流程、阿拉伯语支持、多门店控制、集成支付和直订能力的沙特餐厅，比使用轻量收银 应用 的商户更难切换。这利好 Foodics
              和其他本地化既有厂商。但护城河有清晰边界。第一，许多餐厅流程正在变成行业标配：在线点餐、实时报表、厨房显示、多门店控制和伙伴 API 已是常见主张，不再稀缺。第二，低成本或模块化对手可以在简单商户上压低
              Foodics，因为这些商户未必觉得一体化平台值得更高总支出。第三，大型连锁仍可能偏好 Oracle、NCR
              或继承下来的国际栈，因为这些厂商在多国拥有长期企业关系和运营深度。第四，竞争者撰写的对比页已经从价格、WhatsApp 式商业对第三方的依赖，以及 GCC 以外区域狭窄性攻击
              Foodics。即便这些页面有自利动机，它们也点出了真实战略问题：Foodics
              能否守住高端本地定位，同时拓宽到足以领先企业级进口厂商和更便宜的区域挑战者。答案在沙特中端餐饮科技市场大概率是可以，但在边缘场景没那么确定。
