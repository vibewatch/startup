  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户规模真实，覆盖独立商户、微型企业和多门店运营商
        blocks:
          - type: paragraph
            body: >-
              公开记录足以得出结论：Foodics 拥有真实客户规模，而不是一小串品牌标识。Menabytes 的独立 2025 年报道将公司置于超过 33,500 家活跃餐厅门店；Wamda 和 Arab News 则称
              Foodics 超过 33,000 家餐厅。官方 2025 年和 2026 年发布给出相邻但方向一致的规模标记：Solo 发布中称覆盖 30 个国家、超过 30,000 名餐饮企业主；Norma
              发布中称平台门店超过 40,000 家。边界并不完美，因为餐厅、企业主和门店不是可互换单位，但方向性信号很明确：Foodics 服务了庞大的安装基础。客群证据也指向不止一种商户类型。Alinma 材料强调 SMB
              和微型企业，而具名证言和客户自有网站显示，平台不仅被单体门店使用，也被本地连锁、餐饮集团和多门店品牌使用。
