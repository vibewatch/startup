  - id: TV005
    title: 论点失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 收入披露明显低于当前叙事暗示
        - 年收入或 ARR 相对独角兽预期偏弱
        - 分母被证明过小，公开可比公司支撑坍塌。
        - 重估或暂停投资案例。
      - - 金融科技经济性差
        - 支付抽成率、损失率或资本业务违约显示单位经济性偏弱
        - 围绕嵌入式金融的溢价估值叙事急剧减弱。
        - 限制上行，并要求修订估值假设。
      - - IPO 准备再次延后，披露仍未改善
        - 下一个 IPO 节点前，看不到治理 / 报告强化
        - IPO 可选性不再能支撑估值。
        - 只把上市当作可选上行。
      - - 客户质量证据恶化
        - 参考访谈或公开评论信号显示可靠性或流失压力
        - 增长质量和附加假设可信度下降。
        - 从跟踪转为谨慎 / 延后。
      - - 出现监管或合规问题
        - 任何已披露、涉及支付、借贷或数据的执法行动或重大牌照问题
        - 折现率上升，上市路径减弱。
        - 暂停，直到整改获验证。
    notes: 否决触发因素聚焦真正会改变定价信心的事件，而不是泛泛的经营风险。
    claimRefs:
      - CV027
      - CV028
