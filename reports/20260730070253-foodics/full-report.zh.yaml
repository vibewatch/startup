      - number: '8.3'
        title: 合适结论是继续跟踪：公司质量真实，但公开资料太不完整，不足以支持激进买入建议
        blocks:
          - type: paragraph
            body: >-
              估值问题不在于 Foodics 是否重要；它显然重要。问题在于，新资金仍要在分母被隐藏的情况下做投资判断。没有披露收入、利润率、留存或信贷损失数据，投资人无法测试这门生意该拿 Toast 式溢价、Block
              式混合倍数，还是 Lightspeed 式折扣。因此，证据最能支持的建议是跟踪，而不是买入，也不是放弃。公司有足够规模、机构支持、产品宽度和 IPO
              可选性，直接否定过于严厉。但证据也太薄，无法支撑一个可发表的结论：当前私募定价显然留下上行空间。所以姿态应是估值合理到偏满，而不是便宜。按情景看，独角兽下限仍是事实锚点；任何显著高于该水平的上调，都应以经审计经济性、更强披露，以及支付和资金产品附着确实提升质量、而非只是拓宽叙事为条件。
