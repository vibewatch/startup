chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品边界与规模锚点
        blocks:
          - type: paragraph
            body: >-
              Foodics 现在把自己定位为沙特餐厅操作系统，而不是狭义收银工具。官网和核心产品页把云 POS、支付、在线点餐、自助点餐、应用市场集成，以及面向微型商户的一体机产品放在同一品牌下。关键在于，这让
              Foodics 更像一个软件 + 金融科技平台，把多条流程嵌入餐饮企业的日常运营。后续章节最该复用的身份判断也不是 Foodics 卖 POS
              终端，而是它围绕同一数据层协调订单、支付、库存相关运营、客户互动，并越来越多地承接商户融资。


              公开证据里最站得住脚的规模指标，也来自多篇相互独立的 2025 年文章：支持超过 33,000 家餐厅，2024 年年度 GMV 超过 $10B。这组数字强于部分官方页面仍可见的 30,000+
              家餐厅说法，因此后续章节应把 33,000+ 和 $10B+ 作为当前外部参照，同时保留官方 30,000+ 作为较早公司披露。累计订单量也从 2022 年 Series C 公告中的超过 5B
              单，推进到后续合作伙伴材料中的超过 6B 单，支撑平台活动在大轮融资后继续复合增长的叙事。尽管收入和盈利能力仍未披露，这些仍是私营公司的扎实牵引力信号。
