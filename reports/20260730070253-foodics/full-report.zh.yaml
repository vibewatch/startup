      - number: '5.4'
        title: 2025-2026 路线图指向金融科技和 AI，伙伴与执行依赖上升
        blocks:
          - type: paragraph
            body: >-
              2022 年融资后，最重要的产品趋势是从核心餐厅软件扩展到金融赋能和 AI 原生决策支持。Solo 交易拓宽了 Foodics 的点餐和自助终端能力。Qlub 和 Suplyd
              显示，公司正用伙伴集成延展结账和采购流程。Lean 相关来源描绘了更有野心的推进：现金流可见性、信用评分和融资获取。最具战略意义的是，2026 年完全收购 Norma 后，Foodics 建立了专门 AI
              部门，并把自然语言分析助手和 BI 流程带入平台。这强化了 Foodics 的差异化叙事，但也创造了新依赖：外部支付轨道、开放银行基础设施、采购伙伴、AI
              执行质量和实施支持，都更深地影响客户体验。产品野心明显比公开技术披露增长更快，因此路线图可信度为正，但还没有完全去风险。尽调仍需要直接客户访谈、实施证据和工程走查，去检验 正常运行时间纪律、伙伴故障切换、AI
              治理执行、灾备纪律，以及当前商户入驻整体质量。
