  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流横跨软件、支付、点餐和商户融资相邻领域
        blocks:
          - type: paragraph
            body: >-
              不应把 Foodics 建模成单线 POS
              订阅业务。公开界面支撑一个更宽的变现栈，围绕餐厅运营软件、集成支付、在线点餐和更新的金融产品展开。公司仍然明确销售核心软件：餐厅管理、POS、报表、后台工具、在线门店，以及 Foodics One
              等专项产品。但支付现在在结构上很重要。Foodics Pay 被定位为专门的金融科技层，处理商户交易、结算便利和跨渠道支付受理。Foodics Online
              也指向通过数字商务赋能变现，并帮助餐厅避开第三方佣金以提升商户留存。2022 年和 2025 年官方发布又通过小额贷款、BNPL、会计和 AI
              辅助金融工具进一步拓宽模型。收入质量含义一面积极，一面不确定。积极在于，多产品挂载可随时间加深留存并提高
              ARPU。不确定在于，公开记录没有披露订阅、支付和更新金融科技业务各贡献多少收入，也没有说明这些收入流是软件式利润率还是处理商式利润率。正确财务视角是一套金融科技权重上升的分层收入模型，而不是干净的单指标
              SaaS 故事。
