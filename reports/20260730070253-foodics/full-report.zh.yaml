      - number: '4.3'
        title: 单位经济大多未披露，只能用公开可比公司和产品机制替代直接证据
        blocks:
          - type: paragraph
            body: >-
              Foodics 没有发布完整承销所需的核心单位经济数据。公开资料中没有
              CAC、回本周期、毛留存、净留存、支付抽成率、毛利率拆分、硬件利润率，也没有借贷产品违约历史。最站得住脚的经济性推理，是把公司的产品机制与一家同时包含餐厅 SaaS 和支付的公开可比公司结合起来。Toast 的
              2025 Form 10-K 在这里有用。它展示了餐饮科技财务表现如何由经常性软件费和支付量共同驱动：GPV 为 $195.1B，ARR 为 $2.047B，资产负债表上有可观流动性。Toast
              不是直接的沙特倍数可比公司，但它证明了集成餐厅软件 + 支付的经济逻辑：更多门店和更高 GPV 通常比单纯软件创造更多高频变现。Foodics
              自身公开产品设计也指向同一方向。支付处理、每日两次或每日结算、统一小票、直订渠道、BNPL 式商户功能，以及 AI 或会计相邻业务，都说明客户价值会随运营强度扩张。问题在于，没有披露抽成率
              或利润率数据，投资人无法判断增长是被高效变现，还是只是被广泛使用。因此，对已实现经济性的尽调，比对表层采用率的尽调更重要。
