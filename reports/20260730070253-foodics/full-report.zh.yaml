      - number: '7.3'
        title: 伙伴扩张和竞争强度意味着 Foodics 同时暴露于依赖风险和市场压力
        blocks:
          - type: paragraph
            body: >-
              Foodics 的产品雄心越来越依赖第三方。支付和结算靠外部轨道与处理商；类似 Lean 的开放银行流程依赖受监管的金融数据基础设施；Qlub 和 Suplyd 延伸结账与采购，Norma 和 Solo
              则通过收购与集成扩展 AI 和点餐能力，而不只是靠内部研发。这些依赖本身并不坏；它们能加快产品宽度和 GTM 速度。但依赖也带来更多故障模式、更多合同界面和更多集成义务。竞争风险也真实存在。Foodics
              仍要面对 Toast、Oracle、NCR、Lightspeed 等全球餐饮科技既有厂商，也要面对 Marn
              这类强调本地运营适配的区域玩家。公开具名客户证明仍偏沙特，国际收入增长又来自未披露基数，因此不能排除集中度风险。落到执行层面，如果区域落地放慢，公司可能同时遭遇更强的伙伴议价、更本地化的竞争威胁，以及弱于预期的地域多元化。
