  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可真正确认的是：Foodics 有可信的私募市场验证，但硬估值锚点很少
        blocks:
          - type: paragraph
            body: >-
              第一个锚点仍是 2022 年 C 轮。Foodics 官方材料和独立报道一致显示，公司在 2022 年 4 月融资 $170
              million，跨过独角兽门槛，并将资金用途指向扩张、金融科技和相邻运营模块。第二个锚点是 2025 年 Kamco 购股；这件事具有战略意义，因为它显示，在拟议 Tadawul 路径附近仍有机构需求。多篇
              2025 年文章反复提到 Foodics 服务超过 33,000 家餐厅、2024 年 GMV 超过 $10 billion；MENAbytes 还补充了有用的 2025 年上半年运营更新，显示 GMV
              和收入继续增长。这些都是强业务质量信号，但不等于披露估值标记。因此，公开证据确认 Foodics 仍在独角兽行列，却没有给出干净的最新估值记录，也没有足够经审计的财务细节来支撑高于这一下限的精确上行论证。
