- id: financial-model-and-ipo-execution-risk
  title: The biggest residual risk is execution against a public-market narrative without public-market disclosure depth
  body: The most revealing risk signal may be timeline drift. In 2024, Sharikat Mubasher reported that Foodics was studying an IPO of at least 30% of shares by end-2025. By the time the Kamco transaction entered circulation in 2025, the public framing had shifted toward a two-to-three-year listing window instead. That does not prove failure, but it does show that IPO timing is elastic. At the same time, the company is adding financing, open-banking, AI, and acquisition complexity without publicly disclosing loan-book quality, default rates, runway, concentration, NRR, or full reliability metrics. For a private growth investor, some of that opacity may be tolerable. For a prospective public-market story, it is a real execution risk. The right reading is that Foodics may still be building toward a credible IPO, but the burden of proof has shifted from market excitement to demonstrated governance, controls, customer durability, and financial disclosure maturity.
