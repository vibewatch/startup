- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory compliance slippage
    - Formal enforcement, license issue, or material audit deficiency
    - Any disclosed enforcement action touching payments, lending, or data protection
    - Pause or reprice investment thesis until remediation is verified
  - - Support or uptime deterioration
    - Escalating complaint volume or customer churn among named references
    - Multiple reference calls describe unresolved service failures
    - Shift thesis from growth to repair and require operating plan
  - - IPO-readiness drift
    - Timeline slips again without improved disclosure quality
    - No evidence of governance and disclosure hardening before next IPO milestone
    - Treat IPO as optional upside, not core valuation support
  - - Embedded-finance loss exposure
    - Rising delinquencies or undefined loss controls
    - Management cannot quantify loan-book quality or default exposure
    - Cap valuation upside until finance risk is transparent
  - - Partner dependency shock
    - Major payment, open-banking, or AI partner disruption
    - Core workflows degrade materially after partner incident
    - Require partner concentration review and contingency architecture
  notes: Kill criteria are monitorable because they focus on explicit events or missing management answers rather than vague strategic discomfort.
