          - type: callout
            title: The TAM story is only strong if boundaries stay disciplined
            body: >-
              The easiest analytical mistake is to confuse Saudi Arabia's whole F&B economy with the narrower
              restaurant-software and payments layer that Foodics can monetize. That error can overstate TAM and make
              share assumptions look stronger than the evidence actually supports.
