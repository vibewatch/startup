      - number: '8.4'
        title: 'What would move the recommendation: cleaner economics, cap-table transparency, and IPO-grade disclosure'
        blocks:
          - type: paragraph
            body: >-
              A future buy case is possible, but the bar is specific. First, Foodics would need to disclose annual
              revenue or ARR plus a credible bridge between software, payments, and capital economics. Second, investors
              need gross margin, contribution margin, or at least take-rate data to judge whether the fintech layer is
              accretive rather than operationally expensive. Third, the cap table matters: Kamco's 2025 entry validated
              demand, but without ownership percentage, instrument structure, or any preference detail, it cannot be
              used as a clean price marker. Fourth, the company would need to show that IPO preparation is translating
              into listed-company-grade governance and reporting, not just media discussion about timing. Until those
              items are resolved, the recommendation should stay constructive but disciplined. Foodics deserves
              continued diligence, management access, and monitoring rather than a blind premium. If audited metrics and
              governance depth land well, the recommendation could improve faster than the market narrative currently
              implies.
