      - number: '2.3'
        title: Payments digitalization, compliance pressure, and why Saudi adoption can move quickly
        blocks:
          - type: paragraph
            body: >-
              Saudi Arabia's market structure increasingly favors integrated restaurant software and payments rather
              than standalone billing tools. The clearest macro signal is SAMA's report that electronic payments reached
              85% of total retail payments in 2025, up from 79% in 2024, while electronic transactions rose to 14.6
              billion. That sharply reduces one of the historical barriers to restaurant-software monetization in the
              region: a cash-heavy merchant base with little need for data-linked payment infrastructure. At the same
              time, ZATCA's e-invoicing regime makes compliance increasingly time-sensitive. Wave 24 of the integration
              phase reaches taxpayers whose VAT- taxable revenues exceeded SAR 375,000 in 2022, 2023, or 2024 and
              requires integration by 30 June 2026. Phase Two also requires tighter invoice formatting, system
              integration with the Fatoora platform, and additional security and recordkeeping requirements. Those rules
              do not force merchants to buy Foodics specifically, but they do force many Saudi restaurants to adopt,
              upgrade, or reconfigure digital systems that can handle payment acceptance, invoice generation, audit
              trails, and branch-level operational reporting together. The effect is especially strong for restaurants
              that have outgrown spreadsheets or loosely integrated legacy cash-register setups.
            claimRefs:
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM037
