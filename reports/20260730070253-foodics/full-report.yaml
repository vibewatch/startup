        title: Exhibits
        blocks:
          - type: callout
            title: Why Saudi is structurally attractive for Foodics
            body: >-
              Foodics benefits from a combination that many emerging markets do not have at the same time: large
              restaurant demand, very high electronic-payment penetration, compliance pressure, and a
              local-language/local-payment requirement that slows generic global competitors.
            calloutType: strength
            claimRefs:
