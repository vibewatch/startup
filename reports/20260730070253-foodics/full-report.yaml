      - number: '3.2'
        title: Direct competitors differ sharply by geography, segment, and product depth
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to profile Foodics' direct competition is by who shows up for the same restaurant job to
              be done. Marn is a highly relevant local comparator because it is Riyadh-based, Arabic-capable,
              cloud-based, and explicitly promises offline continuity and reporting for restaurant operators. Sapaad and
              Matbex push a broader restaurant-operating narrative built around unified workflows, kitchen tools,
              delivery or payroll-adjacent capabilities, and quote-led packaging for restaurants from cafés to
              enterprise. These are the vendors most likely to challenge Foodics in Saudi and GCC SMB to mid-market
              deals. Global vendors matter in more selective situations. Toast is operationally deep and highly regarded
              in North America, but the public evidence reviewed here still places it outside the GCC and without
              Saudi-specific payment and compliance positioning. Lightspeed offers broad restaurant functionality,
              analytics, and multi-location support, but its public positioning is much stronger in Europe and North
              America than in Saudi restaurant operations. Oracle Simphony and NCR Aloha remain meaningful for large
              chains because they emphasize scale, multi-channel order orchestration, uptime, and integration breadth.
              Revel fits a similar enterprise-import pattern, though the available public evidence here is thinner
              because the site was partly bot-protected. Foodics' relative strength is therefore not universal
              functional superiority, but a narrower and more valuable mix of local fit plus multi-workflow
              completeness.
