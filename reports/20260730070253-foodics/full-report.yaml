      - number: '4.3'
        title: Unit economics are mostly undisclosed, so public comps and product mechanics have to stand in for direct proof
        blocks:
          - type: paragraph
            body: >-
              Foodics does not publish the core unit-economics data needed for full underwriting. There is no public
              CAC, payback period, gross retention, net retention, payment take rate, gross margin split, hardware
              margin, or default history for lending products. The most defensible way to reason about economics is to
              combine the company's product mechanics with a public comp that mixes restaurant SaaS and payments.
              Toast's 2025 Form 10-K is useful here. It shows how restaurant-tech financial performance can be driven by
              both recurring software fees and payment volume, with GPV of $195.1 billion, ARR of $2.047 billion, and
              material liquidity on the balance sheet. Toast is not a direct Saudi multiple comp, but it demonstrates
              the economic logic of integrated restaurant software plus payments: more locations and more GPV typically
              create more high-frequency monetization than software alone. Foodics' own public product design points the
              same way. Payment processing, twice-daily or daily settlement, unified receipts, direct-order channels,
              BNPL-style merchant features, and AI or accounting adjacencies all suggest a model where customer value
              expands with operational intensity. The problem is that without disclosed take rates or margin data,
              investors cannot tell whether growth is efficiently monetized or merely broadly utilized. That makes
              diligence on realized economics more important than diligence on topline adoption.
