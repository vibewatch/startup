      - number: '7.2'
        title: >-
          Operational and trust risks are visible because public controls exist, but reliability and customer-experience
          proof are still thin
        blocks:
          - type: paragraph
            body: >-
              Foodics does show some mitigation signals. The privacy policy is detailed, the API Adapter supports
              owner-authorized and branch-scoped access, and the support page shows multi-country contact coverage.
              Those are useful, but they are not the same thing as a mature public trust center, uptime record, or
              independently verified security posture. The public developer surfaces remain shallow, the official GitHub
              organization is closed to public repo inspection, and the reviewed record did not expose public security
              certifications or a status page. Open-market review evidence is also unfavorable: Trustpilot suggests that
              support or implementation quality may be materially more uneven than the polished official customer
              surface. That matters because restaurant infrastructure is operationally critical. If payments, order
              flow, settlement, or implementation reliability slips, the impact can move quickly from support complaints
              into retention pressure, payment-volume softness, and brand damage. The operational thesis may still be
              sound, but public evidence is not strong enough to treat resilience risk as solved.
