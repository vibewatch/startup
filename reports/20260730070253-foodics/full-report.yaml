        - Request CFO pack or IPO-prep financial deck.
      - - Margin quality
        - Gross margin, contribution margin, and payments take rate
        - Determines whether fintech and software justify a premium multiple.
        - Request audited segment economics and unit-economics bridge.
      - - Foodics Capital risk
        - Loan-book size, funding source, defaults, recoveries, and provisioning
        - Embedded-finance losses can destroy valuation support quickly.
        - Request lending and collections dashboard plus underwriting memo.
      - - Cap table / Kamco terms
        - Stake size, instrument, preferences, and any secondary / primary split
        - Required to interpret 2025 institutional validation as a pricing signal.
        - Request cap-table summary and transaction memo.
      - - IPO readiness
        - Governance, reporting controls, audited statements, and listing workplan
        - Needed to convert media-level IPO narrative into actual valuation support.
        - Request board materials and IPO readiness checklist.
    notes: These are the missing items most likely to move the recommendation quickly.
    claimRefs:
      - CV028
      - CV030
      - CV035
      - CV038
      - CV040
