companyProfile:
  summary: >-
    Foodics is a Riyadh-based restaurant operating system that combines cloud POS, inventory and back-office tooling,
    payments, and merchant-finance workflows for restaurants and food-service operators across the Middle East and
    beyond. Public evidence supports meaningful regional scale, continued growth, and credible expansion into fintech
    and AI-adjacent products, but not enough audited economics to support precise price underwriting.
