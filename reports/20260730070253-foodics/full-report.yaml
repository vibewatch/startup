      - number: '2.2'
        title: Buyer, user, and payer segmentation across Saudi restaurant archetypes
        blocks:
          - type: paragraph
            body: >-
              Foodics' buyer map is heterogeneous, which is why product packaging and adoption triggers matter as much
              as topline market size. The smallest buyer is the owner-operator or single-site merchant who needs a
              compliant, all-in-one system that reduces manual billing, simplifies card and wallet acceptance, and
              avoids paying staff to reconcile multiple disconnected tools. Foodics One and the company's
              lower-complexity packaging suggest that this segment buys on ease of setup, compliance, and monthly
              affordability. The next tier is the fast-growing small chain or franchisee that needs multi-branch
              management, standardized menus, staff permissions, reporting, and direct-order channels. Above that sit
              larger chains and restaurant groups whose adoption path depends more on integrations, treasury visibility,
              acquiring reliability, and workflow consistency across many outlets. User and payer are often the same for
              independents, but split across founders, finance, operations, and IT functions for scaled chains.
              Delivery-heavy operators and cloud kitchens form a separate high-urgency archetype because they experience
              acute pain from aggregator commissions and tablet fragmentation, making integrated online ordering,
              payments, and dashboarding especially valuable. The buyer conclusion is therefore not that Foodics sells
              one generic POS, but that it sells different layers of restaurant infrastructure to different budget
              owners inside the same sector.
            claimRefs:
