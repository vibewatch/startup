  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          What is actually knowable: Foodics has credible private-market validation, but only a small number of hard
          valuation anchors
        blocks:
          - type: paragraph
            body: >-
              The first anchor is still the 2022 Series C. Official Foodics materials and independent coverage align
              that the company raised $170 million in April 2022 and crossed the unicorn threshold while positioning the
              proceeds for expansion, fintech, and adjacent operating modules. The second anchor is the 2025 Kamco stake
              purchase, which is strategically important because it shows institutional appetite close to a proposed
              Tadawul path. Multiple 2025 articles repeat that Foodics served more than 33,000 restaurants and exceeded
              $10 billion of 2024 GMV, while MENAbytes adds a useful H1 2025 operating update showing continued GMV and
              revenue growth. Those are strong business-quality signals, but they are not the same thing as a disclosed
              mark. Public evidence therefore confirms that Foodics is still in the unicorn class, yet it does not
              provide a clean refreshed valuation print or enough audited financial detail to defend a precise upside
              case above that floor.
            claimRefs:
