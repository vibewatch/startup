  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and the best defensible sizing lens
        blocks:
          - type: paragraph
            body: >-
              Foodics should be analyzed against the Saudi restaurant operating-software and payments stack, not against
              all Saudi consumption or even the Kingdom's full food-and-beverage economy. The market boundary that
              matters most for valuation includes software and payment workflows directly tied to restaurant operations:
              POS, order capture, menu and branch management, kitchen and table workflows, payments acceptance, invoice
              compliance, analytics, online ordering, and relevant integrations. Excluded spend includes grocery retail,
              upstream food manufacturing, hotel property-management software, food delivery marketplace gross
              merchandise value kept by aggregators, and general-purpose enterprise software that is not purpose-built
              for restaurant operators. This distinction matters because some public sources cite a roughly $75 billion
              Saudi F&B opportunity that bundles retail and foodservice, whereas Foodics' nearer demand base is the
              restaurant-facing operating layer on top of Saudi foodservice. The strongest public demand anchor in that
              narrower boundary is Mordor Intelligence's estimate that Saudi Arabia's foodservice market reaches $32.56
              billion in 2026 and $48.06 billion by 2031. That is still a very large demand base for a vertical software
              and fintech platform, but it is materially smaller than the headline F&B figure and therefore more
              defensible for diligence. The result is a market thesis built on operational digitization inside
              foodservice rather than on the entire consumer-spend universe.
