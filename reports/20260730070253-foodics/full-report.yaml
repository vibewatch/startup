              $170 million from high-quality investors led by Prosus and Sanabil, and official statements tied the
              proceeds to geographic expansion, M&A, fintech, micro-lending, and supply-chain initiatives. Later
              activity suggests the money was used in line with that narrative: Foodics expanded payments partnerships,
              announced a three-year $100 million acquisition and investment plan, bought Solo, took an initial stake in
              Norma before fully acquiring it, and pushed deeper into open-banking-enabled merchant finance. The 2025
              Kamco stake purchase adds another capital-market signal by showing institutional demand ahead of a
              possible Tadawul listing. But adequacy is not the same as transparency. Neither Kamco's undisclosed stake
              nor Tracxn's obscured 2025 funding record provides the clean cash-balance picture an IPO-bound investor
              would want. Public evidence still lacks current cash on hand, debt obligations, monthly burn, financing
