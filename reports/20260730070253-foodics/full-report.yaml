  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Regulatory and legal obligations are rising as Foodics expands deeper into payments, lending, data, and IPO
          preparation
        blocks:
          - type: paragraph
            body: >-
              Foodics is no longer easy to underwrite as a plain restaurant SaaS tool. Its own privacy and payments
              terms show a wide service footprint spanning websites, apps, software, hardware, payments, and accounts,
              while Saudi regulatory sources show a tightening environment around personal-data protection, open
              banking, and payment-system oversight. SDAIA's framework now explicitly includes the PDPL, implementing
              regulation, breach procedures, DPO rules, transfer guidance, and accreditation frameworks. At the same
              time, SAMA-related 2026 materials show that open banking has moved into a licensed supervisory regime and
              that payment-system oversight has expanded across fintech and digital financial services. That is
              strategically positive for market legitimacy, but it raises the cost of being wrong on consent,
              governance, cybersecurity, reporting, and operational resilience. Finally, the Saudi listing rules make
              clear that a Tadawul IPO path comes with heavy continuing obligations and disclosure discipline that
              Foodics' current public file does not yet demonstrate at a listed-company level.
