      - number: '2.4'
        title: Growth drivers, adoption constraints, and what actually matters for valuation
        blocks:
          - type: paragraph
            body: >-
              The bull case for Foodics' market is not just that Saudi restaurants are growing, but that several
              structural drivers are aligned at once. Vision 2030 tourism and entertainment expansion is enlarging
              restaurant demand in Riyadh, Jeddah, destination projects, and mixed-use districts; Mordor's sector work
              separately ties restaurant growth to youthful demographics, urban infrastructure, and delivery-channel
              expansion. Dine-in remains the largest revenue pool across foodservice, quick service, and full service,
              but delivery and takeaway are the faster-growing edges, which increases the value of systems that unify
              onsite and off-premise workflows. Still, important brakes remain. Public market estimates are messy
              because some sources describe the Saudi F&B economy, some describe the foodservice sector, some describe
              the POS-software market, and some offer uncorroborated claims about cloud-POS penetration. Restaurant
              buyers also remain fragmented, price sensitive, and often small enough to defer software upgrades until
              compliance or growth pain becomes unavoidable. Localization is another real filter: Arabic support, mada
              and wallet acceptance, and ZATCA readiness matter in Saudi in ways that make generic global POS expansion
              harder. For valuation, the best conclusion is that Foodics sits in a strong and growing market, but
              precise TAM, penetration, and willingness-to-pay curves remain less cleanly measured than the headline
              narrative suggests.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
