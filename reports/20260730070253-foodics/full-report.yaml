  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The landscape is fragmented across local champions, imported enterprise incumbents, and low-cost substitutes
        blocks:
          - type: paragraph
            body: >-
              Foodics does not compete against one single benchmark vendor. In Saudi Arabia, the relevant landscape
              splits into at least five classes: local Saudi specialists such as Marn; GCC-oriented restaurant operating
              systems such as Sapaad and Matbex; global cloud restaurant POS platforms such as Toast, Lightspeed, and
              Revel; older hospitality incumbents such as Oracle Simphony and NCR Aloha; and lower-cost SMB substitutes
              such as Loyverse or spreadsheets plus disconnected payment tools. This matters because different buyers
              are not running the same selection process. A single-site café may compare Foodics against Marn, Loyverse,
              or a manual setup, while a large chain may weigh it against Oracle, NCR, or a globally inherited Revel
              deployment. Foodics' strongest market position is in the middle: it is more localized than the large US
              incumbents, yet more operationally complete than the lightest low-cost tools. The competitive conclusion
              is therefore not that Foodics is universally best, but that it is best positioned where Saudi restaurants
              need local compliance, Arabic workflows, multi-branch control, and a broader operating system rather than
              a simple till.
            claimRefs:
              - CP001
