  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and scale anchors
        blocks:
          - type: paragraph
            body: >-
              Foodics now presents itself as a Saudi restaurant operating system rather than a narrow checkout tool.
              Across its homepage and core product pages, the company bundles cloud POS, payments, online ordering,
              self-ordering, app-marketplace integrations, and a single-device product for micro-merchants under one
              brand. That matters because it frames the company as a software-plus-fintech platform with multiple
              workflows embedded inside the daily operations of food and beverage businesses. The most reusable identity
              claim for later chapters is therefore not simply that Foodics sells POS terminals, but that it coordinates
              orders, payments, inventory-linked operations, customer engagement, and increasingly merchant finance
              around a single data layer.


              The most defensible public scale metrics are also visible from several independent 2025 articles: over
              33,000 restaurants supported and more than $10 billion of annual GMV in 2024. Those numbers are stronger
              than the softer 30,000-plus restaurant claim still visible on some official pages, so later chapters
              should treat 33,000-plus and $10 billion-plus as the current external reference point while preserving the
              official 30,000-plus figure as an older company disclosure. Cumulative order volume likewise progressed
              from more than 5 billion orders in the 2022 Series C announcement to more than 6 billion orders in later
              partner materials, supporting the narrative that platform activity continued compounding after the big
              round. These are robust traction signals for a private company even though revenue and profitability
              remain undisclosed.
