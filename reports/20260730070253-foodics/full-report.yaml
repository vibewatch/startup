        title: Public traction is strong on branches, GMV, payment volume, and ARR growth, but not on reported revenue
        blocks:
          - type: paragraph
            body: >-
              Public traction signals are unusually strong for a private company in the regional restaurant-tech market.
              The most useful new datapoint is Menabytes' H1 2025 report, which says Foodics reached 33,500 active
              restaurant branches, processed $6 billion in GMV during the half, grew payment volume 38%, increased ARR
              29%, and expanded international revenue 56%. Those figures matter because they suggest the business is not
              only selling more software seats, but also increasing embedded-fintech activity and geographic reach. They
              also align with the broader 2025 external narrative that Foodics exceeded $10 billion of annual GMV in
              2024 and remained one of the region's largest restaurant-tech platforms by throughput. Official releases
              support the scale story from another angle: over 5 billion cumulative orders by April 2022, more than 6
              billion orders by later partner and M&A releases, 10,000 branches already using Norma's analytics within
              the Foodics base, and over 40,000 branches on the platform by June 2026 according to the Norma acquisition
              announcement. Yet the public file still stops short of the metrics equity or growth investors usually need
              most. No exact revenue, gross profit, EBITDA, free cash flow, or cohort retention schedule is disclosed.
              That means traction is compelling, but monetization quality remains partly hidden behind throughput and
