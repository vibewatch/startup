      - number: '3.4'
        title: Foodics has a real local moat, but not an unassailable one
        blocks:
          - type: paragraph
            body: >-
              Foodics' moat is strongest where local complexity is high and buyer budgets are meaningful. Saudi
              restaurants that need ZATCA-ready workflows, Arabic-language support, multi-branch control, integrated
              payments, and direct-order capability face more switching friction than merchants using a lightweight
              cash-register app. That favors Foodics and other localized incumbents. But the moat has clear limits.
              First, many restaurant workflows are becoming table stakes across the category: online ordering, real-time
              reporting, kitchen displays, multi-location control, and partner APIs are now common claims, not rare
              ones. Second, low-cost or modular rivals can undercut Foodics for simple merchants who do not value an
              all-in-one platform enough to justify higher total spend. Third, large chains may still prefer Oracle,
              NCR, or inherited international stacks because those vendors have longstanding enterprise relationships
              and operational depth across countries. Fourth, competitor-authored comparison pages already attack
