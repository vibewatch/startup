  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams are diversified across software, payments, ordering, and merchant-finance adjacency
        blocks:
          - type: paragraph
            body: >-
              Foodics should not be modeled as a single-line POS subscription business. Its public surfaces support a
              broader monetization stack built around restaurant operations software, integrated payments, online
              ordering, and newer financial products. The company still clearly sells core software: restaurant
              management, POS, reporting, back-office tools, online storefronts, and specialized products such as
              Foodics One. But payments are now structurally important. Foodics Pay is positioned as a dedicated fintech
              layer handling merchant transactions, settlement convenience, and payment acceptance across channels.
              Foodics Online also points toward monetization via digital commerce enablement and improved merchant
              retention by helping restaurants avoid third-party commissions. The 2022 and 2025 official releases widen
              the model further through micro-lending, BNPL, accounting, and AI- assisted financial tooling. The
              revenue-quality implication is positive in one sense and uncertain in another. Positive, because
              multi-product attachment can deepen retention and increase ARPU over time. Uncertain, because the public
              record does not disclose how much revenue comes from subscriptions versus payments versus newer fintech
              lines, nor whether those streams carry software-like margins or processor-like margins. The right
              financial view is a layered revenue model with increasing fintech weight, not a clean single-metric SaaS
              story.
