callouts:
  - calloutType: "risk"
    title: "Stale Valuation Mark and Capital Structure Overhang"
    body: "Komodo Health's $3.3B valuation headline dates to March 2021's Series E, augmented by a $200M structured equity round from Coatue in November 2022. Without a post-2022 priced equity round, audited financial disclosures, or public S-1 filing, the current equity value is vulnerable to substantial macro peer multiple compression across healthcare SaaS and data platforms."
    claimRefs:
      - "CO002"
      - "CO010"
      - "CO011"
  - calloutType: "insight"
    title: "Transition to Vertical AI Engine via Marmot"
    body: "Following executive appointments of CTO Amit Sangani (former Meta AI platform lead) and promotion of Miles Ennis to President, Komodo is attempting to transition from a static real-world data broker to a vertical AI operating system. The August 2025 launch of Marmot and enterprise agreements with Alnylam, NCQA, and AWS represent strategic efforts to improve software gross margins and workflow lock-in."
    claimRefs:
      - "CO007"
      - "CO009"
      - "CO013"
      - "CO014"
