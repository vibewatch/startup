company:
  name: "Komodo Health"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2014, Komodo Health has built an AI-powered healthcare intelligence platform anchored on its 330M+ patient Healthcare Map and Marmot AI engine. While capitalized with $514M+ in equity funding from Tiger Global, Coatue, and ICONIQ, the company's $3.3B valuation remains fixed to 2021-2022 rounds amid lack of audited revenue disclosures and past workforce restructuring."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Operating Footprint, and Business Mission"
    body: "Komodo Health, Inc. was established in 2014 by Arif Nathoo, MD, and Web Sun with the explicit corporate mission of reducing the global burden of disease through healthcare data science and artificial intelligence. Operating out of dual headquarters in New York City and San Francisco with an additional regional office in Chicago, the company functions as a healthcare intelligence and real-world data analytics enterprise. Rather than offering basic claims aggregation or static benchmarking dashboards, Komodo centers its product suite on the Healthcare Map, an integrated data asset tracking longitudinal patient journeys across diverse healthcare providers and payers. The commercial model monetizes access to this underlying data foundation alongside proprietary analytical applications, catering primarily to life sciences enterprises, healthcare payers, provider networks, and patient advocacy organizations seeking auditable real-world evidence."
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO015"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership Architecture, Governance, and Key-Person Roles"
    body: "The leadership architecture of Komodo Health reflects a co-founder model combined with specialized functional executives recruited to steer vertical artificial intelligence expansion. Co-founder Arif Nathoo, MD, serves as Co-CEO overseeing data science, engineering, and platform initiatives, while co-founder Web Sun serves as Co-CEO directing corporate commercialization, sales, business development, and people operations. In June 2026, Komodo evolved its executive structure by naming Miles Ennis President, formalizing his role leading enterprise growth, customer operations, and commercialization of the Marmot AI platform following tenures as Chief Revenue Officer and Chief Operating Officer. Technical execution is steered by Chief Technology Officer Amit Sangani, an 11-year Meta engineering leader overseeing PyTorch and Llama systems who joined in January 2026 to architect enterprise AI capabilities. Financial governance is directed by Chief Financial Officer Paul Thomas, promoted in April 2026 following senior financial leadership roles at Talkdesk and Sumo Logic. While founder-led continuity remains robust, executive concentration in early platform design and commercial relationships represents an ongoing key-person operational consideration."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-valuation-and-investors"
    title: "Capitalization History, Private Valuation Marks, and Institutional Stakeholders"
    body: "Komodo Health has accumulated $514 million in disclosed funding across seven discrete rounds since its 2015 Seed investment, drawing capital from prominent venture capital and growth equity institutions. Early institutional momentum accelerated through a $50 million Series C in January 2020 and a $44 million Series D in January 2021, culminating in a $220 million Series E in March 2021 led by Tiger Global Management that established the company's peak public valuation mark of $3.3 billion. Following broader tech market multiple contraction and a late 2022 workforce reduction, Komodo closed a $200 million structured equity financing in November 2022 led by Coatue Management with participation from Dragoneer Investment Group. Key institutional backers include ICONIQ Capital, Andreessen Horowitz, Oak HC/FT, Felicis Ventures, IA Ventures, Casdin Capital, and McKesson Ventures. However, because Komodo has remained privately held without a public S-1 filing, subsequent priced rounds, or audited revenue releases, its $3.3 billion valuation mark is heavily reliant on historical private valuations that face potential discount risk relative to compressed public real-world evidence peers."
    claimRefs:
      - "CO002"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO003"
  - id: "corporate-milestones-and-operational-trajectory"
    title: "Corporate Evolution, Product Milestones, and Operational Trajectory"
    body: "The developmental chronology of Komodo Health spans distinct phases of data asset aggregation, platform acquisition, modular productization, and vertical AI deployment. Following its 2014 founding, initial years focused on ingesting and linking disparate healthcare datasets into the longitudinal Healthcare Map. In January 2021, the company expanded its enterprise software footprint by acquiring Mavens, establishing cloud-native software and consulting capabilities on the Salesforce platform for medical affairs and commercial operations. Product packaging evolved through the rollout of MapLab in September 2023 and MapView in March 2024, enabling customers to run self-service analytics beyond static data feeds. In August 2025, Komodo launched Marmot, an AI-powered intelligence engine built on the Healthcare Map to automate multi-step research workflows with auditable and reproducible evidence generation. Enterprise distribution has expanded through strategic collaborations with Alnylam Pharmaceuticals, the National Committee for Quality Assurance (NCQA) to modernize HEDIS quality measurement, and availability on the AWS Marketplace. These technology advances exist alongside historical operational discipline, following a belt-tightening restructuring in late 2022 that saw workforce adjustments and leadership departures before resuming platform scaling."
    claimRefs:
      - "CO004"
      - "CO008"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
