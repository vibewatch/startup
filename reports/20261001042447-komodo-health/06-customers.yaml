company:
  name: "Komodo Health"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence shows adoption across pharmaceutical analytics, healthcare quality measurement, and
    data-partner workflows, with 2026 expansions at Alnylam and NCQA providing the freshest named proof.
    Retention, churn, active-customer count, contract value, and customer concentration remain material
    diligence gaps rather than supportable public metrics.
sections:
  - id: "customer-segments"
    title: "Buyer Segments and Workflow Entry Points"
    body: >-
      Komodo addresses several institutional buying centers rather than a single end-user persona. Its
      current product surface spans analytics tools built on the Healthcare Map, while public materials
      place commercial, medical-affairs, research, and quality-measurement teams at the center of use.
      The evidence is strongest for large life-sciences organizations: a current account-executive
      description targets commercial analytics, sales, field, marketing, and business leadership, and
      an official enterprise-services example describes an unnamed global top-20 pharmaceutical medical
      information team. Verana provides a separate partner-led research segment, linking specialty EHR
      data with Komodo patient journeys. Public sources do not disclose customer revenue bands or payer
      shares, so the segmentation table treats strategic value qualitatively and leaves financial scale
      as an explicit gap.
    claimRefs:
      - "CU001"
      - "CU008"
      - "CU012"
      - "CU015"
    tableRefs:
      - "TU001"
  - id: "named-adoption-proof"
    title: "Named Adoption and Outcome Proof"
    body: >-
      The freshest customer proof is concentrated in company-hosted announcements and testimonials.
      Komodo reported in June 2026 that Alnylam expanded Marmot from custom commercial agents into its
      customer-facing organization and broader enterprise, with reporting cycles described as moving
      from months to hours. In August 2026, Komodo and NCQA announced a multi-year quality-measurement
      effort; the first cited measure was tested in about one month versus a historical two-to-three-month
      process. The homepage also carries a Novo Nordisk testimonial that compares six-month studies with
      a shortest study completed over a weekend. These are specific outcome claims, but they are presented
      on Komodo-controlled surfaces and lack disclosed baselines, sample sizes, or independent audits.
      Verana's 2021 announcement supplies older partner-issued corroboration for a deployed data linkage.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "expansion-motion"
    title: "Expansion Motion and Commercial Durability"
    body: >-
      The available evidence supports a land-and-expand motion, not a measured retention conclusion.
      Alnylam's move from an initial commercial use case toward broader enterprise deployment is the
      clearest named example. Company-issued recruiting material separately describes landing high-value
      use cases, expanding into multi-team platform relationships, running renewal reviews, adding managed
      services, and increasing license adoption. Pear's interview with co-founder Web Sun supplies the
      demand-side rationale: life-sciences teams were described as using four data vendors and taking
      seven months before analysis, creating an opening for a consolidated workflow. These sources explain
      the commercial mechanism, but none reports net revenue retention, gross retention, churn, renewal
      rates, or cohort behavior.
    claimRefs:
      - "CU004"
      - "CU010"
      - "CU012"
      - "CU014"
      - "CU016"
    figureRefs:
      - "FU001"
  - id: "concentration-and-evidence-limits"
    title: "Concentration, Procurement, and Evidence Limits"
    body: >-
      Enterprise selling appears operationally demanding. The current commercial role requires navigating
      complex buying groups and long sales cycles, while the Mavens client-partner role centers on QBRs,
      renewals, escalations, services expansion, and a dedicated portfolio of top accounts. That pattern
      indicates procurement friction and meaningful servicing effort, but it does not establish revenue
      concentration or services gross margin. Simplify adds one explicitly adverse but low-confidence
      editorial signal, asserting that January 2026 layoffs reflected cost pressure; because it appears
      inside a company job repost and lacks underlying documentation in the retained page, it is not
      treated as independent corroboration. Investors should request account-level ARR, product mix,
      renewal cohorts, implementation effort, and the top-10 customer share before underwriting durability.
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU016"
