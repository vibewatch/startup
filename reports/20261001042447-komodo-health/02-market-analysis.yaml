  - calloutType: "insight"
    title: "Market Boundary Realities: Research Infrastructure vs. Point of Care"
    body: "Prospective buyers and diligence teams must maintain strict boundary discipline regarding Komodo Health's software positioning. The platform is research-grade analytics infrastructure designed for retrospective cohort analysis, real-world evidence generation, and strategic provider targeting. It does not provide real-time clinical decision support at the point of care, nor does it deliver transactional HCP contact information for direct sales prospecting."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
  - calloutType: "risk"
    title: "Adoption Bottlenecks: Enterprise Sales Cycles and Analytics Talent Deficits"
    body: "Despite robust demand for real-world evidence, Komodo Health faces structural friction in scaling beyond life sciences commercial teams. Unpublished, custom enterprise SaaS pricing ($150K to over $1M annually) creates protracted procurement cycles, while extracting meaningful value requires highly skilled in-house claims analysts or costly vendor professional services."
    claimRefs:
      - "CM004"
      - "CM009"
      - "CM015"
