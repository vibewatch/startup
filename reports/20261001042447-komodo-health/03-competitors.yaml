      - ["Healthcare-specific AI", "Marmot is positioned as healthcare-native", "Unknown", "General-purpose by definition", "Depends on customer implementation"]
      - ["Auditability and reproducibility", "Explicit company claim", "Unknown", "Identified as a comparison point, not benchmarked", "Depends on governance and tooling"]
      - ["Workflow applications", "Broad portfolio on one data foundation", "Unknown", "Requires configuration or integration", "Can be tailored to internal process"]
      - ["Identity resolution and data provenance", "Evaluated in the sales-engineering motion", "Unknown", "Not established by retained evidence", "Requires internal or partner capability"]
      - ["Security, compliance, and AI governance", "Enterprise review is part of the sales cycle", "Unknown", "Not established by retained evidence", "Customer retains implementation burden"]
      - ["Transparent public pricing", "No price disclosed in retained pages", "Unknown", "Unknown", "Internal labor and data costs are undisclosed"]
    notes: >-
      Matrix records only evidence visible in the assigned pool; "Unknown" means no
      retained source supports a comparison, not that the capability is absent.
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP007, CP008, CP011, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Alternative
      - Public price or unit
      - Observable contract model
      - Included capabilities
      - Discount or commitment evidence
      - Underwriting implication
    rows:
      - [Komodo Health, "Not disclosed", "Contact-led enterprise sale", "Healthcare Map, Marmot, and portfolio products", "Unknown", "Cannot test price advantage or realized unit economics"]
      - [HealthVerity, "Unknown", "Unknown", "RWD competitor class only", "Unknown", "Request a matched quote and scope"]
      - [Symphony Health Solutions, "Unknown", "Unknown", "Healthcare analytics competitor class only", "Unknown", "Request a matched quote and scope"]
      - [Inovalon, "Unknown", "Unknown", "Healthcare software and analytics class only", "Unknown", "Request a matched quote and scope"]
      - ["Internal build", "No list price", "Labor, data licenses, and infrastructure", "Customer-defined", "Not applicable", "Compare fully loaded cost and time-to-value"]
    notes: >-
      No public list price, realized contract value, discount schedule, or minimum
      commitment was present in the assigned evidence; every unknown requires direct
      procurement diligence.
    claimRefs: [CP005, CP014, CP016]
figures:
  - id: FP001
    title: Competitive positioning by healthcare-data depth and workflow breadth
    type: quadrant
    summary: >-
      An ordinal, evidence-constrained map shows Komodo's claimed integrated position
      while keeping peer and substitute scores explicitly provisional.
    data:
      xAxis:
        label: Healthcare-data specificity
        min: 1
        max: 5
      yAxis:
        label: Workflow breadth
        min: 1
        max: 5
      points:
        - label: Komodo Health
          x: 5
          y: 5
          detail: "Company-claimed integrated Healthcare Map, AI, and application stack."
        - label: HealthVerity
          x: 4
          y: 3
          detail: "Direct RWD rival; relative breadth is not independently benchmarked."
        - label: Symphony Health Solutions
          x: 3
          y: 3
          detail: "Named healthcare analytics peer; retained evidence is incomplete."
        - label: Inovalon
          x: 4
          y: 4
          detail: "Healthcare software incumbent; relative position is provisional."
        - label: General-purpose AI
          x: 1
          y: 3
          detail: "Broad tooling with no retained proof of native healthcare-data depth."
        - label: Internal build
          x: 2
          y: 4
          detail: "Potentially broad and tailored, but dependent on customer data and talent."
    approximationNotes: >-
      Scores are analyst-authored ordinal positions from 1 to 5, not measured market
      data. Komodo's position uses company claims; peer positions use a single
      independent landscape source and are provisional pending primary-source and
      customer validation.
    claimRefs: [CP001, CP004, CP006, CP010, CP011, CP015]
callouts:
  - calloutType: strength
    title: Integrated proof point
    body: >-
      Komodo combines a large company-claimed healthcare-data foundation with an
      auditable AI layer and purpose-built workflows, a broader proposition than a
      standalone model or raw-data feed.
    claimRefs: [CP001, CP002, CP003]
  - calloutType: risk
    title: Moat evidence is not yet decision-grade
    body: >-
      The assigned pool lacks independent win-loss data, renewal metrics, matched
      pricing, migration costs, and peer performance tests; buyer lock-in and
      differentiation durability remain underwriting gaps.
    claimRefs: [CP004, CP005, CP016]
