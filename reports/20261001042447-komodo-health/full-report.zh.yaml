      - number: '5.2'
        title: Healthcare Map 接入、标准化与湖仓一体基础设施
        blocks:
          - type: paragraph
            body: >-
              驱动 Healthcare Map 运转的是一套精密的底层数据架构，专为持续接入、标准化并关联海量异构医疗交易数据流而设计。接入的数据包含各种互不统一的临床编码体系，需要在 ICD-10 诊断代码、CPT
              诊疗代码、NDC 药品代码以及 NPI 医疗机构分类体系之间实现自动化跨库映射。为了在不牺牲数据完整性的前提下每日处理数十亿条新接入记录，Komodo 在 AWS 对象存储上采用 Apache Spark
              等分布式计算框架与现代事务型数据湖仓架构，评估了 Apache Iceberg、Apache Hudi 和 Delta Lake 等格式。数据工程团队采用 Apache Airflow
              进行工作流编排以协同多阶段接入流水线，在验证数据新鲜度与血缘关系的同时，降低 Schema 漂移风险。此外，Komodo 构建了 Agent
              驱动的数据采集系统以及基于大语言模型的人机协同（HITL）清洗流水线，从非结构化公开档案和临床文本中提取结构化临床变量，大幅扩展了核心真实世界数据资产的分析深度。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE014
      - number: '5.3'
        title: Marmot AI 层、Agent 工作流与领域验证
        blocks:
          - type: paragraph
            body: >-
              在数据底座之上，Komodo 部署了 Marmot，这是一个专为医疗原生场景打造的人工智能平台，用于在 Healthcare Map
              上运行复杂的多步分析推理。不同于在临床专业术语和医学逻辑上表现不佳的通用大语言模型，Marmot 专门设计用于生成可审计、可复现且可验证的证据。大型制药企业客户将定制的 Marmot AI Agent
              直接嵌入商业化、医学事务以及临床研发工作流中。例如，Alnylam Pharmaceuticals 在整个商业化部门推广了
              Marmot，成功将分析报告周期从数月压缩至数小时，赋能跨职能团队直接查询统一的真实世界证据。同样，NCQA 与 Komodo 合作推进医疗质量指标的构建与验证，针对 HEDIS
              结直肠癌筛查随访指标（COF-E）的测试，相比以往两到三个月的周期，在约一个月内即告完成。这些落地案例表明，锚定在经过验证的全纵向数据底座上的垂直 AI 推理，相比传统商业智能工具能够实现切实显著的业务加速。
            claimRefs:
              - CE004
              - CE009
              - CE010
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE013
              - CE015
      - number: '5.4'
        title: 企业级部署、安全治理与技术债风险
        blocks:
          - type: paragraph
            body: >-
              受监管的医疗环境中的企业级集成与治理，要求极高标准的数据隔离、身份管理以及基础设施安全性。Komodo 采用混合数仓架构管理其分析与机器学习工作负载，利用 Snowflake 承担结构化 SQL 数仓工作，利用
              Databricks 集群进行高级数据科学建模。平台采用细粒度访问控制模型和自动化标签体系对数据敏感度、归属权和基础设施成本进行分类，严格恪守 HIPAA 合规与企业安全边界。生产服务和面向客户的 API 则通过
              AWS 基础设施上的 Kubernetes 容器化流水线进行管理。尽管具备这些架构底座，Komodo 仍面临关键的技术与运营尽调风险。Marmot AI 依然缺乏独立的公开基准评测、延迟画像及模型安全评估，截至
              2026 年 9 月，在 PeerSpot 等第三方软件评测平台上，其经核实的评价数量依然为 0。此外，同时运行 Snowflake 和 Databricks
              两套超大规模数仓平台带来了持续的云成本优化压力，而在维持 330 million 名患者数据新鲜度时，也必须不断应对上游结算中心 ETL 延迟以及专有匹配关联算法失误的挑战。
            claimRefs:
              - CE005
              - CE011
              - CE013
              - CE015
      - number: '5.5'
        title: 图表与案例
        blocks:
          - type: callout
            title: 数据湖仓与 AI 推理的架构解耦
            body: >-
              Komodo 将原始的全纵向数据接入（采用 Airflow、Spark 及事务型数据湖仓表）与分析服务及 AI 层（Snowflake、Databricks 和
              Marmot）进行解耦。这使得临床数据清洗加工与对话式 AI 接口能够独立进行规模化扩容。
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE009
          - type: callout
            title: 缺乏第三方市场评测与同业基准对比
            body: 在 PeerSpot 等企业评估平台上，独立的从业者评价依然匮乏（记录为 0 条评价），这迫使潜在客户与投资人高度依赖厂商提供的案例研究和内部试点评估，而非公开客观的行业基准测试。
            calloutType: risk
            claimRefs:
              - CE011
              - CE014
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方细分与工作流切入点
        blocks:
          - type: paragraph
            body: >-
              Komodo 面向的是多个机构采购中心，而非单一的最终用户画像。其当前产品涵盖基于 Healthcare Map
              构建的分析工具，而公开资料显示商业化、医学事务、科研以及质量测算团队是其核心使用主体。大型生命科学企业方面的佐证最为充分：目前的客户经理岗位描述明确指向商业分析、销售、一线外勤、市场以及业务领导层；官方的企业服务案例中则提及了一家未具名的全球前
              20 强药企医学信息团队。Verana 则代表了另一个由合作伙伴驱动的研究细分领域，将专科 EHR 数据与 Komodo
