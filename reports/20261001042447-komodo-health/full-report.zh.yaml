      - number: '4.4'
        title: 资本充足度、融资结构与投资研判结论
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 的历史融资以 5 轮机构融资累计募集的 $514 million 股权资金为基础，最高峰是在 2021 年 3 月由 Tiger Global 领投的 $220 million E
              轮融资，投后估值达到 $3.3 billion。2022 年底，公司获得了 Coatue Management 领投的 $200 million
              结构化股权投资，在未设立新普通股估值基准的情形下充实了资产负债表。财务运营由财务高级副总裁兼代理首席财务官 Paul Thomas
              主持，其统筹财务规划与资本化战略。然而，结构化优先清算条款的存在叠加公开财务报表的缺失，导致普通股实际稀释程度、清算优先权以及现金跑道均不够透明。在管理层于正式尽调中提供经核实的 GAAP
              财务报表、资金消耗指标及客户留存数据之前，潜在投资机构必须对二级市场估值持审慎态度。
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI013
              - CI014
