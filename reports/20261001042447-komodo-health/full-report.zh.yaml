chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、运营布局与业务使命
        blocks:
          - type: paragraph
            body: >-
              Komodo Health, Inc. 由 Arif Nathoo 博士（MD）与 Web Sun 于 2014
              年创立，其明确的企业使命是借助医疗数据科学和人工智能减轻全球疾病负担。公司在纽约和旧金山设立双总部，并在芝加哥设有区域办公室，定位于医疗智能与真实世界数据分析企业。据公司自述，Komodo
              没有局限于基础的理赔数据聚合或静态指标看板，而是将产品矩阵建立在 Healthcare Map
              之上——这是一项整合型数据资产，持续追踪跨多元医疗服务机构与支付方的全纵向患者旅程。其商业模式通过将底层数据资产与专有分析应用相结合实现变现，主要面向寻求可审计真实世界证据的生命科学企业、医疗支付方、医疗服务网络及患者权益倡导组织。
            claimRefs:
              - CO001
              - CO005
              - CO015
