      - number: '2.3'
        title: 买方细分、预算归属与落地路径
        blocks:
          - type: paragraph
            body: >-
              Komodo Health
              的企业级客户主要分布在三大机构类别：生命科学药企、支付方机构与医疗卫生服务网络。生物制药企业贡献了当前绝大部分软件支出与年经常性收入（ARR），预算分布在商业运营、医学事务与临床研发部门。商业化团队使用
              Komodo 测算市场规模、追踪用药依从性并绘制包含 7 类信号的 KOL 网络图谱；HEOR 与医学事务团队则借助 Healthcare Map 构建站得住脚的真实世界证据档案与医保申报材料。与 Alnylam
              Pharmaceuticals 等企业的战略合作表明，客户正在全公司范围内采用 Komodo 的 Marmot AI 平台，将报告周期从数月大幅缩短至数小时。在支付方与医疗质量治理领域，公司于 2026 年 8
              月宣布与 NCQA 达成战略合作，利用 Healthcare Map 和 Marmot，将覆盖 Medicare Advantage、Medicaid 及商业保险人群的 HEDIS
              指标开发与测试周期从数月压缩至约一个月。
