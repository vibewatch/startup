      - number: '3.2'
        title: 公司声称的护城河：数据广度、可审计性与深度工作流结合
        blocks:
          - type: paragraph
            body: >-
              Komodo 公开披露的最强竞争优势体现在技术架构，而非价格优势。公司称其 Healthcare Map 拥有超过 1 trillion 条关联记录，覆盖逾 330 million
              名去标识化患者，且保持每日更新。公司在此底层之上叠加了 Marmot
              及更广泛的应用组合，并将可复现、可审计的输出作为核心信任支柱。公司还主张，客户的业务逻辑与工作流一旦配置进平台，若深度嵌入就会推高替换成本。但这属于公司口径，并非经过独立验证的护城河。留存的竞品资料并未证实直接竞争对手是否在数据覆盖率、更新频次、身份识别匹配或工作流广度上与之持平，因此缺乏证据支撑的对比项应归为未知，而不能直接判定为竞品落后。
