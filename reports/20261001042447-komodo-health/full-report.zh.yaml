              - CO011
      - number: '1.4'
        title: 企业演进、产品里程碑与发展轨迹
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 的发展历程经历了数据资产聚合、平台并购、模块化产品开发以及垂直 AI 落地几个鲜明阶段。2014 年成立后，公司早年重点将分散的医疗数据集接入并关联至全纵向 Healthcare
              Map。2021 年 1 月，公司收购 Mavens 扩大企业级软件版图，基于 Salesforce 平台为医学事务与商业运营建立起云原生软件和咨询能力。产品形态随后不断演进：2023 年 9 月推出
              MapLab，2024 年 3 月推出 MapView，让客户得以在静态数据流之外运行自助式分析。2025 年 8 月，Komodo 推出 Marmot，这是一款基于 Healthcare Map 构建的 AI
              智能引擎，可生成可审计且可复现的证据，从而实现多步研究工作流自动化。在企业分销端，公司通过与 Alnylam Pharmaceuticals 的战略合作、与美国国家质量保证委员会（NCQA）合作推动 HEDIS
              质量测算现代化，以及上线 AWS Marketplace，持续扩大销售触达。在这些技术进展背后，公司也经历过运营纪律调整：2022 年底进行了紧缩重组，经历人员裁减与管理层变动后，才重新恢复平台规模扩张。
