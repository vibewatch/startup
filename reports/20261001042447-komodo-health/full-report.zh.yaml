  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、授权模式与实际定价落地
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 主要通过向生物制药厂商、健康险计划及咨询机构销售多年期企业级 SaaS 订阅，实现数据与医疗智能资产的商业化变现。公司将全纵向 Healthcare Map
              的访问权限与打包的分析应用（如 MapLab 及对话式 MapAI 助手）相结合，使生命科学客户无需采购定制咨询服务即可直接查询临床诊疗数据集。为加速企业级软件采购并撬动客户已承诺的云基础设施预算，Komodo
              还通过 AWS Marketplace 专属优惠分销其平台。对全球顶级药企大客户，合同通常会进一步拓展至定制 AI Agent 部署，例如在销售和一线客户团队中落地 Marmot 的商业化工作流合作。然而，由于
              Komodo Health 仍是非上市公司，公开价目表并未对外披露，实际合同金额取决于针对具体企业的一事一议用量折扣。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI014
