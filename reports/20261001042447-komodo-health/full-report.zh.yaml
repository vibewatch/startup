  - id: TV001
    title: 投资建议汇总表
    columns:
      - 参数
      - 评估结论
      - 证据依据
      - 决策含义
    rows:
      - - 投资建议
        - 深入研究
        - 2021 年 E 轮 $3.3B 估值已过时，F 轮估值未获证实，且未披露任何公开财务数据
        - 在经审计 ARR、资金消耗率及客户合同明细披露前，暂缓做出成长期股权投资承诺。
      - - 置信度
        - 中
        - 已验证的 $220M E 轮融资及企业客户里程碑，与经审计财务数据的完全缺失形成对照
        - 尽调应聚焦于核实非公开运营指标，而非依赖二级市场投机预期。
      - - 风险评级
        - 高
        - 二级市场缺乏流动性、1.5x 清算优先权、20% 累积股息以及 $300M 结构化债务
        - 若退出估值低于 $3.5B，普通股与次级优先股将面临重大归零下行风险。
      - - 估值立场
        - 偏高
        - 在可比公司估值倍数承压的市场环境下，历史上 $3.3B 至 $3.71B 的估值对应不足 $300M 的预估收入，隐含 12x-15x 的激进倍数
        - 二级市场交易或过桥轮入场须较后期公开标称估值至少折价 35% 至 50%。
    notes: 评估结论综合了截至 2026 年 10 月的一级市场融资历史、二级市场定价免责声明及企业客户公开披露信息。
