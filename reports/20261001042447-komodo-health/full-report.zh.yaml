      - number: '8.4'
        title: 估值情景推演与确认性尽调诉求
        blocks:
          - type: paragraph
            body: >-
              为了评估回报与下行风险分布，我们在 5 年投资期限内构建了三种经营情景模型。在乐观情景（Bull Case，概率 15%）下，受 Marmot AI 在企业端大规模落地的驱动，Komodo Health 的
              ARR 加速升至 $350M 以上，实现 125% 的净留存率（NRR），并将营业利润率拓展至 20%。按 10.0x ARR 的溢价估值倍数计算，该业务在 IPO 时估值可达 $3.5B 至 $4.0B，相对于
              E 轮入场价格仅能实现个位数的低年化收益率。在基准情景（Base Case，概率 60%）下，ARR 以 12% 至 18% 的温和复合增速增至 $220M 至 $260M。按照目前医疗垂直 SaaS 普遍适用的
              6.0x 至 7.0x 预期收入倍数，得出较为客观的股权公允价值为 $1.4B 至 $1.8B——较历史估值折价 45% 至 55%。在悲观情景（Bear Case，概率
              25%）下，受制于数据供应商竞争压力与客户整合，收入增长停滞在 $200M 以下。承压状态下 3.0x 至 4.0x 的倍数意味着企业估值仅为 $600M 至
              $800M，此时优先清算权与结构化债务将吞噬几乎所有退出所得，造成普通股严重减值。潜在投资者在确认性尽调核实经审计的 ARR、合同流失率以及股权结构表（cap
              table）中确切的清算分配瀑布层级之前，应避免参与新股投资。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV013
              - CV014
