      - number: '1.5'
        title: 图表与案例
        blocks:
          - type: callout
            title: 过期的估值基准与资本结构悬顶
            body: >-
              Komodo Health 备受瞩目的 $3.3B 估值还要追溯到 2021 年 3 月的 E 轮融资，随后在 2022 年 11 月补充了 Coatue 领投的 $200M 结构化股权融资。在 2022
              年之后缺乏定价股权轮次、未经审计财务披露或公开 S-1 申报文件的情况下，面对医疗 SaaS 和数据平台同业公司的估值倍数普遍收缩，当前的股权价值存在大幅下修风险。
            calloutType: risk
