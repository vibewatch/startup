      - number: '4.2'
        title: 收入模型架构与平台转化链路
        blocks:
          - type: paragraph
            body: >-
              支撑 Komodo Health 平台的商业引擎，将持续的数据接入转化为高确定性的企业软件经常性收入。据公司口径，这一链路始于每日接入并关联来自各类医疗理赔、处方登记和化验结果的逾 15 million
              笔临床诊疗记录，不断充实覆盖超过 330 million 例去标识化患者旅程的全纵向数据底座。该标准化数据层输入 Marmot 医疗 AI 分析环境，专用的垂直模型与算法 Agent
              将原始就诊历史转化为可复现的患者队列分析与商业洞察。企业客户通过年度订阅许可购买访问权限，而非一次性交易型数据交付，从而形成可持续的经常性合同价值。然而，每天处理 PB
              级医疗数据所需的第三方数据采购版权费和云计算成本，对平台的毛利率构成了天花板约束。
            claimRefs:
              - CI001
              - CI005
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
