      - number: '1.3'
        title: 融资历史、非公开估值基准与机构股东
        blocks:
          - type: paragraph
            body: >-
              自 2015 年种子轮投资以来，Komodo Health 历经 7 轮独立融资，累计披露融资额达 $514 million，吸引了多家知名风投和成长型股权机构。早期机构投资势头在 2020 年 1 月的 $50
              million C 轮和 2021 年 1 月的 $44 million D 轮中持续加速，并在 2021 年 3 月由 Tiger Global Management 领投的 $220 million E
              轮融资中达到顶峰，确立了公司最高公开估值基准 $3.3 billion。此后随着科技市场估值倍数普遍收缩以及 2022 年底的裁员，Komodo 于 2022 年 11 月完成了由 Coatue
              Management 领投、Dragoneer Investment Group 参投的 $200 million 结构化股权融资。主要机构投资方包括 ICONIQ Capital、Andreessen
              Horowitz、Oak HC/FT、Felicis Ventures、IA Ventures、Casdin Capital 和 McKesson Ventures。然而，由于 Komodo
              始终保持非上市状态，未提交公开 S-1 文件，此后也未进行定价股权融资或披露经审计的收入数据，其 $3.3 billion
              的估值基准在很大程度上依赖历史非公开估值，相比于估值倍数承压的上市真实世界数据同业公司，面临潜在折价风险。
            claimRefs:
              - CO002
              - CO010
              - CO011
