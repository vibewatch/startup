            title: 未上市资本结构与缺乏经审计的 GAAP 披露
            body: >-
              尽管 Komodo Health 凭借据报道超过 $150 million 的 ARR 以及历史上募集的 $514 million
              资金展现出企业级规模，但公开财务报表、经审计毛利率以及客户留存指标的缺失，限制了投资判断的确定性。依靠结构化股权与债权工具运营的后期非上市公司，一旦扩张放缓，将面临更高的估值敏感性。
