      - number: '2.2'
        title: 市场规模测算视角：TAM、SAM 与可服务需求
        blocks:
          - type: paragraph
            body: >-
              评估 Komodo Health 的市场规模需要采用多种分析视角，而非依赖单一宽泛的医疗 IT 汇总数据。从最宏观视角来看，全球与美国医疗分析及真实世界数据市场构成了一个超过 $35 billion
              的庞大总可用市场（TAM），涵盖商业分析、临床 RWD、支付方风险分层以及流行病学数据基础设施。然而，Komodo
              实际的可服务市场（SAM）集中在美国生命科学企业级分析、专科生物制药商业情报和监管级真实世界证据（RWE），在生物制药申办方、大型整合医疗服务网络（IDN）与商业健康保险计划中的可触达规模预估为 $4.5
              billion 至 $6.0 billion。在此范围内，Komodo 的可获得服务市场（SOM）取决于有预算能力承受定制企业级 SaaS 合同的机构，合同金额从单适应症模块的 $150,000
              到全套数据集授权的 $2.0 million 或更高不等。行业调研显示，Komodo
              的核心高价值细分场景集中在专科与罕见病生物制药领域，在这些领域中，对小规模患者群体的完整全纵向追踪，能够比竞品基于抽样推断的方案获得更高溢价。
            claimRefs:
              - CM007
