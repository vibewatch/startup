  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、隐私治理与合同约束
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 的核心价值主张依托于持续接入并全纵向关联海量真实世界患者数据，聚合了覆盖 330 million 名去标识化个人、超过 1 trillion
              条关联临床与医疗就诊记录。在如此规模下运营，不可避免地会面临《健康保险可携性与责任法案》（HIPAA）、各州级健康隐私法规框架（如华盛顿州《我的健康我的数据法案》和加州消费者隐私法案 CCPA）以及新兴医疗 AI
              治理标准下的合规风险。为了防范患者再识别的重大风险，Komodo Health 在其主服务协议（MSA）中设立了严苛的合同约束。根据其通用条款与条件第 2.7
              条，严禁客户直接或间接尝试对任何去标识化个人进行重新识别，或将 Komodo 数据与外部第三方数据集进行关联。此外，第 2.9 条明确限制用户将 Komodo 知识产权输入包括
              ChatGPT、Claude、Copilot 和 Gemini 在内的公共人工智能模型中，强制要求采用具备严格保密承诺的隔离私有化部署。Komodo 还通过第 2.10 条确立了在协议终止后 6
              个月内仍可行使的单方审计权来强化这一约束。尽管如此，独立的供应商评估指出，生物制药及医疗企业买方经常遭遇冗长的法律、隐私与数据合规审查周期，延缓了系统实际接入和价值兑现。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
