              现有证据支持其具备“先落地后增购”（land-and-expand）的商业打法，但不足以推导出一份经实测验证的留存率结论。Alnylam
              从最初的商业化应用场景走向全企业级推广，是目前最明确的实名案例。公司发布的招聘材料还分别描述了切入高价值业务场景、拓展至多团队平台合作、主持续约复盘、增设托管服务以及提高软件许可采纳率等环节。Pear
              对联合创始人 Web Sun 的专访提供了需求端的逻辑：据其描述，生命科学团队以往需要对接 4 家数据供应商，在开展分析前往往要耗费 7
              个月时间，这为整合型工作流创造了切入契机。这些材料解释了其商业运作机制，但均未披露净收入留存率、毛留存率、客户流失率、续约率或同期群表现。
