      - number: '2.4'
        title: 增长驱动力、落地瓶颈与尽调盲区
        blocks:
          - type: paragraph
            body: >-
              多项宏观因素推动了 Komodo Health 分析套件的落地，首要驱动力包括 FDA 等监管机构对真实世界证据的采纳、需要全纵向追踪的复杂专科及细胞/基因疗法的涌现，以及企业对具备自然语言查询生成能力的垂直医疗
              AI Agent 的需求。尽管顺风明显，实质性的采纳瓶颈依然制约着部署速度。首要商业瓶颈在于定价不透明；Komodo 采用一事一议的企业 SaaS
              合同，未公布公开定价档位，导致潜在客户往往需要经历长达数月的采购周期。其次，技术部署需要精通理赔数据特性的专业分析团队、流行病学专家或生物统计学者，缺乏专门分析卓越中心（CoE）的机构很可能导致软件搁置，或不得不购买厂商所称专业服务的交付支持。此外，理赔数据天然存在数周至数月的审结延迟，且不包含现金自费交易，限制了其实时运营价值。最后，围绕患者去标识化和数据来源追溯的数据治理与监管审查，构成了机构买方必须主动审计的合规风险。
            claimRefs:
              - CM004
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: 图表与案例
        blocks:
          - type: callout
            title: 市场边界现实：科研基础设施 vs. 临床床旁场景
            body: >-
              潜在买方与尽调团队必须对 Komodo Health
              的软件定位保持清晰的边界意识。该平台属于科研级分析基础设施，专为回顾性队列分析、真实世界证据生成以及医疗机构战略定位而设计。它既不在临床床旁提供实时临床决策支持，也不提供用于直销获客的交易型医务人员（HCP）联系方式。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: 落地瓶颈：企业级销售周期与分析人才短缺
            body: >-
              尽管市场对真实世界证据的需求强劲，Komodo Health 在向生命科学商业化团队之外扩张时仍面临结构性阻力。未公开的定制企业 SaaS 定价（每年 $150K 至逾
              $1M）导致采购周期冗长，而要想挖掘出实际业务价值，据采购方反馈称，要么需要极高水平的内部理赔数据分析师，要么需要购买昂贵的厂商专业服务。
            calloutType: risk
            claimRefs:
              - CM004
              - CM009
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方可选路径：垂直同业、通用平台或内部自建
        blocks:
          - type: paragraph
            body: >-
              可见的竞争格局远比一份单纯的医疗数据厂商名单更宽广。ForesightIQ 将 HealthVerity、Symphony Health Solutions 和 Inovalon
              列为直接竞争对手，但并未提供经过审计的业务规模或对等维度的性能对比。Komodo
              自身的售前工程简报则另行提到，公司既要面对真实世界数据厂商的竞争，也要抵御通用基础大模型的冲击。内部自建同样是不可忽视的替代方案：一份 Komodo
              数据分析师指南和目前在招的数据产品岗位显示，具备成熟技术能力的机构完全可以自行搭建
              SQL、Python、数据模型、数据流水线及产品能力。因此，即使没有明确指名某家供应商，支离破碎的看板和一次性分析的现状也在争夺预算。这种多线作战的格局，使得保住细分赛道领头羊地位的难度，远高于仅盯防 3
              家同业对手。
            claimRefs:
              - CP004
              - CP006
              - CP009
              - CP010
              - CP015
