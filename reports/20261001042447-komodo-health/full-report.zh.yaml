      - number: '1.2'
        title: 高管领导架构、公司治理与关键人物角色
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 的高层管理架构采取联席创始人模式，并引入专业职能高管共同推动垂直人工智能扩张。联合创始人 Arif Nathoo 博士担任联席 CEO，分管数据科学、工程与平台研发；联合创始人 Web
              Sun 同为联席 CEO，统领公司商业化、销售、业务拓展及人力运营。2026 年 6 月，Komodo 进一步调整高管架构，任命曾任首席营收官与首席运营官的 Miles Ennis
              为总裁，正式由其统领企业增长、客户运营以及 Marmot AI 平台的商业化。技术执行层面由首席技术官 Amit Sangani 掌舵，他在 Meta 拥有 11 年工程管理经验并曾主管 PyTorch 与
              Llama 系统，于 2026 年 1 月加入公司负责构建企业级 AI 架构。财务治理则由首席财务官 Paul Thomas 负责，他曾在 Talkdesk 和 Sumo Logic 担任资深财务管理职务，于
              2026 年 4 月升任现职。虽然创始人带来的业务延续性依旧稳固，但高管层在早期平台架构设计与商业关系上的高度集中，构成了需要持续关注的关键人物运营风险。
            claimRefs:
