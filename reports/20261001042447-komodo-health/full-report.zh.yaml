      - number: '7.4'
        title: 财务模型可持续性、核心逻辑证伪触发条件与尽调路径
        blocks:
          - type: paragraph
            body: >-
              财务模型的不确定性构成了 Komodo Health 显著的遗留风险，这源于公司自 2021 年 3 月确立 $3.3 billion 峰值投后估值的 $220 million E
              轮融资之后，既无公开财务披露，也未进行过定价股权融资。尽管公司随后在推进运营重组的同时，于 2022 年 11 月从 Coatue 获得了 $200 million 结构化股权投资，但 Komodo
              从未披露过经审计的年经常性收入（ARR）、营收增速、毛利率、净收入留存率（NRR）或持续现金消耗等数据。这种透明度的缺失，掩盖了 Komodo
              软件业务的经营杠杆与其维持庞大专有数据接入流水线的资本密集度之间的实际关系。足以打破投资逻辑的潜在证伪触发条件包括：因患者再识别问题遭遇重大监管执法或 HIPAA OCR 调查；核心结算中心数据流终止导致
              Healthcare Map 覆盖度受损；因总拥有成本过高或服务依赖度过重导致头部药企客户大面积流失；以及二级市场估值较 $3.3 billion 基准线大幅打折的证据。后续必要的尽调路径包括：审阅经审计的
              GAAP 财务报表、获取经核实的同期群留存曲线，以及评估 Marmot 等最新 AI 功能的边际利润贡献。
