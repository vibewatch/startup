      - number: '3.3'
        title: 企业信任与采购流程可见，但定价依然不透明
        blocks:
          - type: paragraph
            body: >-
              现有的市场拓展证据表明其采用顾问式企业销售模式。Komodo 的售前工程职责覆盖需求调研、资质审核、方案设计、价值验证、客户 AI
              评估委员会、安全审查、合规以及采购全流程。这种销售打法固然能加深客户关系并增加系统接入黏性，但也意味着漫长的评估周期以及客户在谈判中掌握主动权。在留存的资料中，公开价目表、计费单元、折扣梯度、最低承诺消费额以及实际履约合同金额均未披露；Komodo
              的产品页面均引导潜在客户联系客户经理或预约演示。上述指名直接竞争对手的定价同样缺乏公开证据支持。因此，商业维度的对比只能梳理出以商务洽谈为主的合同模式与采购决策标准，无法判定其是否具备价格或总拥有成本优势。
            claimRefs:
