              Komodo Health 软件利润率的可持续性在结构上与其数据获取成本绑定。据公司自述，由于 Healthcare Map 依赖聚合每日超过 15 million
              次患者就诊及第三方理赔数据，数据授权版权费和云计算基础设施构成了大额可变成本，使其成本结构显著有别于纯粹的 SaaS 平台。
