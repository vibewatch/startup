          - type: callout
            title: 借助 Marmot 向垂直 AI 引擎转型
            body: >-
              在任命前 Meta AI 平台负责人 Amit Sangani 为 CTO，并将 Miles Ennis 提拔为总裁后，Komodo 正试图从静态的真实世界数据经纪商转型为垂直 AI 操作系统。2025 年 8
              月推出的 Marmot，以及与 Alnylam、NCQA 和 AWS 达成的企业协议，代表了公司提高软件毛利率与加深工作流绑定的战略举措。
            calloutType: insight
