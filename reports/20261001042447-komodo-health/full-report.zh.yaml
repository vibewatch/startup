  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、核心客群与可触达支出
        blocks:
          - type: paragraph
            body: >-
              界定 Komodo Health 的目标市场，需要将全纵向真实世界数据（RWD）及理赔分析，与交易型医疗 IT 及临床工作流工具区分开来。Komodo
              的核心市场涵盖面向生命科学商业化、卫生经济学与结果研究（HEOR）、医学事务意见领袖（KOL）画像分析以及临床试验可行性评估的软件与数据解决方案。据公司口径，平台将医疗和处方理赔数据聚合标准化为专有的
              Healthcare Map，覆盖来自 60 多个更新源的逾 330 million 例去标识化美国患者诊疗轨迹与超过 1 trillion
              条关联记录。该市场的边界明确包括企业级二手数据授权、全纵向患者队列构建、治疗路径分析以及诸如 Komodo 的 Marmot 等 AI 查询基础设施。相反，该市场不包括床旁临床决策支持、嵌入 EHR
              的临床病历文档、交易型账单结算中心引擎，以及直销获客拓客工具。需要联系人名单的买方必须通过名录供应商补充数据，因为该平台专为回顾性流行病学和市场准入研究打造，而非用于一线临床工作流。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
