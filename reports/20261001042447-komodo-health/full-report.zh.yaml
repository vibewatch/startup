      - number: '7.2'
        title: 运营可靠性、身份全生命周期与审计基础设施
        blocks:
          - type: paragraph
            body: >-
              鉴于其多租户 SaaS 架构以及高度敏感的医疗数据流，运营韧性与安全治理是 Komodo Health 核心的风险敞口所在。内部运维工程资料显示，Komodo 高度依赖跨 Workday、Okta
              Workflows、Google Workspace 和 Jira Service Management 的自动化身份与访问管理。其运营核心重点在于实现员工入职、调岗与离职（JML）全生命周期的自动化，消除在
              SOC 2 和 HIPAA 审计评估中极易暴露严重问题的权限注销盲区。对非人类身份（包括 API 令牌、服务账户和 Agent
              集成）的管理构成了一个不断扩大的受攻击面，需要实施自动化凭证轮换、最小权限原则以及持续的权限复核。支撑 MapLab 等应用及 MapAI
              等对话助手的云基础设施部署，在处理高吞吐量分析查询工作负载的同时，必须保持各客户租户间严密的逻辑隔离。如果无法确保持续生成合规审计证据，将面临在客户安全审查中被判定不合规的风险，从而直接危及企业客户的订阅续约，并加剧运营摩擦。
            claimRefs:
              - CR005
              - CR006
              - CR012
