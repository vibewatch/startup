    approximationNotes: 评分系分析师拟定的 1 至 5 级序数定位，非实测市场数据。Komodo 的定位基于公司自身宣称；竞品定位来自单一独立行业格局来源，在获得一手资料与客户验证前暂定。
    claimRefs:
      - CP001
      - CP004
      - CP006
      - CP010
      - CP011
      - CP015
