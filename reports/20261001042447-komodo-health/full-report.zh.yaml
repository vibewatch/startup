      - number: '4.3'
        title: 运营成本结构、毛利率与财务表现
        blocks:
          - type: paragraph
            body: >-
              Komodo Health
              的成本结构融合了企业软件开发、专业医疗数据工程以及可变数据授权开支。与纯软件厂商不同，公司需要承担持续的授权和版税支出以维持其多源数据接入流水线，同时背负高额的云基础设施托管承诺。为应对后疫情时代的软件估值倍数收缩，Komodo
              于 2022 年底实施了裁员和运营重组，以重新调整运营支出并建立财务纪律。第三方研究机构估算 Komodo Health 的年经常性收入（ARR）约为 $150 million，二级市场平台 UpMarket
              的预估数据则指出其 2024 年收入为 $165.7 million。尽管如此，公司尚未公开披露实现正向营业利润，且包括 GAAP
              毛利率、获客成本及净收入留存率在内的核心单体经济学指标，仍属于未公开数据，亟待尽调审计确认。
