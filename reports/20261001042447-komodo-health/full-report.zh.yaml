  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 管理层建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              尽调评估给予 Komodo Health 继续研究（Research-More）建议，置信度为中，风险评级为高，估值立场偏高。该公司依托 Healthcare Map 沉淀了极其优质的医疗数据资产，追踪跨越 1T
              条记录的逾 330M 去标识化患者就诊全流程。近期与大型企业级生物制药合作伙伴的商业化进展，包括在 Alnylam Pharmaceuticals 扩大多年期 Marmot AI 部署，以及与 National
              Committee for Quality Assurance（NCQA）达成证据生成联盟，印证了其产品在市场中的实用价值。然而，估值与资本结构冲突严重制约了该投资逻辑。自 2021 年 3 月以 $3.3B
              估值完成 $220M E 轮融资以来，Komodo Health 尚未完成任何公开确认的新股股权融资。在此期间，宏观重定价与可比公司估值倍数收缩大幅拉低了软件行业估值。在老股市场流动性冻结且 Forge
              Global 等平台未公布老股交易价格的情况下，若无法获取经审计的收入、增速与现金消耗指标，按以往的名义高估值介入股权将承担无法获得合理风险补偿的下行风险。
