      - number: '7.3'
        title: 合作伙伴集中度、供应商治理与商业依赖性
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 在上游数据提供商与下游实施工作流两端，均存在显著的运营与商业依赖。在上游，Healthcare Map
              的完整性与临床有效性，取决于其与医疗结算中心、商业保险机构及临床实验室保持持续的数据授权协议。任何合同中断、费用上涨或对商业性二级医疗数据授权的监管收紧，都会直接损害 Komodo
              的数据更新频次与全纵向就诊旅程的保真度。至于下游交付，来自 RFP Wiki
              的独立采购评估强调，商业风险往往潜藏于长期的服务依赖以及交付实施带宽受限之中。当企业买方无法建立独立的分析能力时，便需要购买昂贵的专业服务或依靠厂商分析师协助，才能开展复杂的卫生经济学与结果研究（HEOR）。此外，买方必须严格核验特定专科和地理区域的数据覆盖范围，以免宽泛的企业宣传口径与狭窄的治疗领域匹配度之间产生脱节。为控制交易对手风险，Komodo
              在 FP&A 部门的监管下搭建了基于 Zip 的集中采购框架，对 SaaS 供应商合同、数据保护协议（DPA）及供应商履约表现实施统一治理。
