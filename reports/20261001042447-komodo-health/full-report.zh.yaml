  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与核心临床智能平台
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 将零散的临床诊疗记录转化为统一的全纵向患者诊疗全景，为生命科学药企、商业健康险计划及临床研究人员提供企业级医疗智能。平台的核心是 Healthcare Map，它关联了超过 330
              million 例去标识化患者旅程，涵盖来自商业保险、Medicare、Medicaid、电子病历（EHR）、化验单及处方理赔的 1 trillion 次临床诊疗记录。企业生命科学团队最主要的分析使用界面是
              MapLab，这是一个探索型工作流界面，研究人员借此可定义复杂的患者队列、追踪临床进展并绘制治疗路径。在 MapLab 内部，Komodo 提供了
              MapAI，这是一款专用的对话助手，旨在将通俗的自然语言查询转化为结构化的医疗分析结果。据公司自述，通过将全面的真实世界证据与医疗专属智能相结合，Komodo
              摆脱了传统上对割裂的陈旧报表系统的依赖，让临床与商业化团队能够以可验证的准确度洞察患者行为、用药依从性以及健康结局差异。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
