  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层技术架构栈，涵盖数据摄入、标准化、湖仓基础设施、核心数据资产、AI 智能分析及服务接口。
    approximationNotes: 架构分层与组件归属综合自 Komodo 工程团队公开资料、职位描述及技术评估文档。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE013
    data:
      layers:
        - label: 数据摄入与采集层
          detail: 据公司称，摄入原始理赔、EHR、化验、药房及非理赔数据集，并结合 LLM 驱动的人机协同（HITL）进行数据清洗整理。
          modules:
            - 结算机构理赔数据摄入
            - EHR / 临床数据流适配器
            - 基于智能体的公开数据抽取
        - label: 身份解析与标准化层
          detail: 将 ICD-10、CPT、NDC、RxNorm 和 NPI 代码映射并关联至患者维度的纵向记录。
          modules:
            - 令牌化患者去标识化
            - 跨分类学编码标准化
            - 纵向轨迹拼接缝合
        - label: 事务型湖仓与数据底座层
          detail: 采用 AWS 云存储、Apache Spark 分布式计算、Airflow 工作流编排及 Apache Iceberg/Hudi 表格式。
          modules:
            - Apache Spark 计算引擎
            - Airflow 流水线编排
            - ACID 事务型表存储
        - label: 分析型数仓与湖仓层
          detail: 包含 Snowflake 数据仓库、Databricks 机器学习集群及 JupyterHub 交互环境。
          modules:
            - Snowflake 企业级数仓
            - Databricks 机器学习与分析
            - JupyterHub 探索式分析服务
        - label: Healthcare Map 知识图谱层
          detail: 核心图谱关联跨越 1T+ 临床就诊事件的 330M+ 美国去标识化患者。
          modules:
            - 纵向患者历程图谱
            - 多专科诊疗路径映射
            - 每日增量图谱更新
        - label: Marmot AI 与分析服务层
          detail: 提供 MapLab 可视化分析、MapAI 对话式查询、客户 API 及企业定制智能体。
          modules:
            - MapLab 可视化分析中心
            - MapAI 自然语言查询
            - Marmot 领域推理智能体
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持从工作流痛点到单点试用、成效验证、跨团队扩张及续约管理的定性路径，但未提供各阶段的转化率数据。
    data:
      items:
        - label: 割裂的数据与工作流
          detail: 据描述，生命科学团队以往需要使用 4 家数据供应商，并在开展分析前等待 7 个月。
          touchpoints:
            - 数据供应商评估
            - 工作流与可行性评估
        - label: 单点用例切入
          detail: 商业、医学事务、科研或质量团队从边界明确的单一分析工作流起步。
          touchpoints:
            - 商业分析
            - 医学信息
            - 质量指标测试
        - label: 具名项目部署
          detail: 客户或合作伙伴将 Healthcare Map 或 Marmot 应用于特定工作流。
          touchpoints:
            - 定制 AI 智能体
            - EHR 与理赔数据关联
        - label: 成效验证
          detail: 公司官方收录证据强调了报告生成或研究完成速度的提升。
          touchpoints:
            - 从数月缩短至数小时
            - 从 6 个月缩短至一个周末
        - label: 跨团队扩张
          detail: 客户资料描述了从单点解决方案向多团队或企业级合作关系的拓展。
          touchpoints:
            - 拓展更多团队
            - 引入更多工作流解决方案
        - label: 续约与客户价值增长
          detail: 客户合伙人工作围绕季度业务复盘（QBR）、续约、管理服务、许可证采用及升级响应展开。
          touchpoints:
            - 续约评估
            - 增销与许可扩充
    approximationNotes: 这是一个根据访谈、合作伙伴资料以及公司发布的客户管理岗位证据综合构建的定性分析序列；并非实测漏斗，亦不暗示具体转化率。
    claimRefs:
      - CU010
      - CU012
      - CU014
      - CU016
