      - number: '8.2'
        title: 融资历史与高级优先权悬顶
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 的资本形成历程反映出后期激进注资与后续结构化下行保护的鲜明结合。据非公开追踪平台 Tracxn 与 Forge Global 统计，该公司在整个生命周期内累计融资超 $514M 至
              $587M。主要融资里程碑包括：2020 年 1 月获 $50M C 轮融资；2021 年 1 月以 $1.41B 至 $2.2B 估值完成 $44M D 轮融资；2021 年 3 月完成标志性的 $220M E
              轮融资，由 Tiger Global Management 领投，ICONIQ Growth、Andreessen Horowitz、Casdin Capital 和 SVB Capital 参投，估值达
              $3.3B。此后的融资重心转向结构化工具。2022 年 10 月，Coatue Management 与 Dragoneer 参与了 $300M 不可转换融资，附带 11% 的累积股息率。此外，Forge
              Global 记录显示，根据公司注册证书修正案，2025 年 3 月获批的 $50M F 轮融资预估估值为 $3.71B。关键在于，该 F 轮工具附带 1.5x 的清算优先权乘数与 20%
              的累积股息率。这种资本结构堆叠形成了巨大的高级清算优先权负担，直接将普通股及早期优先股置于次级受偿地位，在任何低于峰值估值的退出情景中，都显著放大了本金减值风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: 投资逻辑与反向逻辑驱动因素
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑立足于 Komodo Health 具备护城河的数据底座，以及其向企业级垂直 AI 领军者的演进。Healthcare Map 提供了无与伦比的患者病程纵向视角，保护该公司免受简单抓取或大路货 EHR
              数据整合商的竞争冲击。Marmot AI 在 2025 与 2026 年的推广证明，企业级生物制药客户可在数小时内提取出可复现、可审计的洞察，无需耗时数月等待定制咨询研究。2026 年 6
              月的高管架构重组——提拔资深商业操盘手 Miles Ennis 为总裁，并任命联合创始人 Web Sun 与医学博士 Arif Nathoo 共同担任联合首席执行官——释放出运营重心聚焦于垂直 AI
              规模化的信号。相反，反向逻辑则植根于实质性的估值风险。公开资料中未披露关于年经常性收入（ARR）、经常性软件业务占比、净留存率（NRR）或营运现金消耗的任何数据。此外，真实世界数据（RWD）供应商在 HHS 与
              FTC 监管框架下面临更趋严格的合规审查，而客户对数百万美元的年度软件采购承诺也愈发审慎。鉴于优先清算权门槛的存在，若缺乏显著的收入加速增长，即使商业表现稳健，也难以给后期股权投资者带来有吸引力的回报。
