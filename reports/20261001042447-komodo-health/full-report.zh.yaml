      - CV002
      - CV004
      - CV005
      - CV006
      - CV013
      - CV014
  - id: TV002
    title: 投资论点与反论点表
    columns:
      - 维度
      - 正方投资论点
      - 反方投资论点
      - 论点破裂 / 转向触发条件
    rows:
      - - 数据资产规模
        - Healthcare Map 关联跨越 1T+ 条记录的 330M+ 去标识化患者历程，在美国生命科学领域建立了难以逾越的纵向数据护城河。
        - 反方观点认为，聚合理赔与 EHR 数据面临日益收紧的监管审查、数据供应商去中介化，以及大宗合成数据替代品的冲击。
        - 失去关键数据供应商的数据流，或 HHS / FTC 对去标识化真实世界数据联合分发施加监管限制。
      - - 商业势头
        - 头部药企广泛采用，Alnylam 与 NCQA 验证了 Marmot AI 在临床与商业化应用中的工作流自动化价值。
        - 漫长的销售周期、高定制化需求以及对企业 SaaS 预算的严格审视制约了 ARR 增长并压缩了净扩张率。
        - 年度净增新客户增速放缓，或企业分析领域的关键药企客户出现流失。
      - - 管理层执行力
        - 领导团队经验丰富，联合创始人 Web Sun 升任联合 CEO，Miles Ennis 出任总裁，加速垂直领域 AI 的规模化拓展。
        - 频繁的高管层重组表明公司在扩大商业化执行和推进产品市场契合度拓展中存在战略摩擦。
        - 重组后 12 个月内核心数据科学或客户收入高管离职。
      - - 资本结构与价格
        - 历史上获得一线机构（Tiger Global、ICONIQ、a16z、Coatue）的强力支持，提供了资产负债表稳定性与战略关系资源。
        - F 轮 1.5x 清算优先权与 20% 股息率带来的沉重优先清算负担，严重压制了普通股和早期轮次股东权益。
        - 发生下调估值融资或结构化资本重组，触发反稀释棘轮并导致普通股权益归零。
    notes: 投资论点与反论点综合评估了业务结构性优势与资本结构及市场估值承压之间的权衡。
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 经营假设
      - 隐含估值逻辑
      - 关键下行情景风险
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 突破 $350M+ 且同比增速达 30%+；Marmot AI 智能体在全球前 50 大生命科学客户中实现 125%+ 的 NRR；EBITDA 利润率向 20% 扩张。
        - 10.0x 的远期 ARR 倍数支撑 IPO 或向大型医疗及企业级云平台战略出售时取得 $3.5B 至 $4.0B 的估值。
        - IPO 窗口持续受限；医疗数据公开可比公司估值倍数压缩至远期收入的 6x 以下。
        - 15%（需要前所未见的企业级 AI 商业化兑现及 IPO 市场的迅速重启）
      - - 基准情景
        - ARR 温和增长至 $220M-$260M；增速放缓至 12%-18%；头部药企客户留存保持稳定，但中端市场流失率上升。
        - 6.0x 至 7.0x 的 ARR 倍数对应 $1.4B 至 $1.8B 的股权价值，较 2021 年 E 轮公开标称估值折价 45%-55%。
        - 流动性长期冻结迫使公司进行结构化二级市场交易，或开展估值持平 / 下调的内部过桥融资轮。
        - 60%（反映出成熟医疗 SaaS 的估值倍数，以及缺乏经审计再加速证据的低迷增长态势）
      - - 悲观情景
        - ARR 停滞在 $200M 以下；医疗隐私法规限制数据来源输入；客户改用内部自研 AI 模型；高额资金消耗使流动性承压。
        - 3.0x 至 4.0x 的 ARR 倍数对应 $600M 至 $800M 的企业价值；优先清偿负担（$300M 债务 + F 轮优先权）吸纳绝大部分退出收益。
        - 在困境出售或强制资本重组中，普通股与非参与优先股将遭受 80%+ 的减值。
        - 25%（受优先清偿负担及缺乏经核实的现金跑道驱动，存在高度结构性下行风险）
    notes: 情景估值区间假定在缺乏经审计财务披露的情况下，将企业级软件可比公司估值倍数应用于预估 ARR 区间推算得出。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV013
      - CV014
