      - number: '3.4'
        title: 工作流成效推动客户落地，但缺乏独立的商业持久性证据
        blocks:
          - type: paragraph
            body: >-
              公司公开的客户案例解释了该产品落地后为何难以被替代。据 Komodo 披露，NCQA 将某项 HEDIS 指标的定量测试周期从两到三个月缩短至约一个月；Alnylam 在将企业数据集接入 Marmot
              后，把分析报告周期从数月压缩到数小时。这些案例反映出潜在的工作流价值与集成深度，但均出自 Komodo 自身的宣传渠道，且未披露合同财务细节、续约行为或对照基准测试。与此同时，垂直 RWD 同业、通用 AI
              与客户内部数据分析团队正在分别蚕食该技术栈的不同层级。客观严谨的结论是：Komodo
              展现出可信的技术差异化主张与客户使用信号，但在缺乏独立的成败单分析、留存率及迁移成本证据之前，无法准确定量评估其被平庸化、客户多平台并用及被替代的风险。
            claimRefs:
              - CP012
              - CP013
              - CP015
              - CP016
