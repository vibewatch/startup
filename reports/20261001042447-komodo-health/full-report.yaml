      - number: '5.2'
        title: Healthcare Map Ingestion, Normalization, and Lakehouse Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Powering the Healthcare Map is a sophisticated data foundations architecture engineered to continuously
              ingest, standardize, and link massive volumes of disparate healthcare transaction streams. Incoming
              records encompass varied and non-standardized clinical coding systems, requiring automated cross-walking
              across ICD-10 diagnosis codes, CPT procedure codes, NDC medication identifiers, and NPI provider
              taxonomies. To handle billions of incoming records daily without sacrificing data integrity, Komodo
              leverages distributed processing frameworks such as Apache Spark alongside modern transactional data
              lakehouse architectures, evaluating formats such as Apache Iceberg, Apache Hudi, and Delta Lake on AWS
              object storage. The data engineering team employs workflow orchestration via Apache Airflow to coordinate
              multi-stage ingestion pipelines, validating data freshness and lineage while mitigating the risk of schema
              drift. Furthermore, Komodo builds agentic data acquisition systems and LLM-powered Human-in-the-Loop
              (HITL) curation pipelines to extract structured clinical variables from unstructured public records and
              clinical text, substantially expanding the analytical depth of its core real-world data asset.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE012
