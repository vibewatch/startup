  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Investment Thesis
      - Investment Anti-Thesis
      - Thesis-Break / Pivot Trigger
    rows:
      - - Data Asset Scale
        - >-
          Healthcare Map links 330M+ de-identified patient journeys across 1T+ records, establishing an insurmountable
          longitudinal data moat in U.S. life sciences.
        - >-
          Aggregated claims and EHR data face increasing regulatory scrutiny, data vendor disintermediation, and
          commodity synthetic data alternatives.
        - >-
          Loss of key data vendor feeds or HHS / FTC regulatory restrictions on de-identified real-world data
          syndication.
      - - Commercial Momentum
        - >-
          Tier-1 pharma enterprise adoption with Alnylam and NCQA validating Marmot AI workflow automation across
          clinical and commercial applications.
        - >-
          Long sales cycles, high customization requirements, and enterprise SaaS budget scrutiny constrain ARR growth
          and compress net expansion.
        - >-
          Deceleration of annual net new customer additions or key pharmaceutical customer cancellations in enterprise
          analytics.
      - - Executive Execution
        - >-
          Experienced leadership team with co-founder Web Sun elevated to co-CEO and Miles Ennis appointed President to
          accelerate vertical AI scaling.
        - >-
          Frequent senior leadership reorganization indicates strategic friction in scaling commercial execution and
          product-market expansion.
        - Executive departures in core data science or customer revenue leadership within 12 months of reorganization.
      - - Capital Structure & Price
        - >-
          Strong historical backing from Tier-1 sponsors (Tiger Global, ICONIQ, a16z, Coatue) provides balance sheet
          stability and strategic relationships.
        - >-
          Severe preference overhang from Series F 1.5x liquidation preference and 20% dividend rate subordinates common
          equity and earlier rounds.
        - Down-round financing or structured recapitalization that triggers anti-dilution ratchets and common wipeout.
    notes: >-
      Thesis and anti-thesis points evaluate structural business strengths against capital structure and market
      valuation overhang.
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Implied Valuation Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR scales to $350M+ with 30%+ YoY growth; Marmot AI agents achieve 125%+ NRR across top 50 global life
          sciences accounts; EBITDA margins expand toward 20%.
        - >-
          10.0x forward ARR multiple supports a $3.5B to $4.0B valuation at IPO or strategic sale to major healthcare or
          enterprise cloud platform.
        - IPO window remains constrained; public healthcare data peer multiples compress below 6x forward revenue.
        - 15% (Requires unprecedented enterprise AI monetization and rapid IPO market re-opening)
      - - Base Case
        - >-
          ARR grows modestly to $220M-$260M; growth moderates to 12%-18%; customer retention remains stable with
          enterprise pharma but mid-market churn rises.
        - >-
          6.0x to 7.0x ARR multiple yields an equity value of $1.4B to $1.8B, representing a 45%-55% discount to 2021
          Series E headline valuation.
        - Extended liquidity freeze forces structured secondary trades or flat/down internal funding extension rounds.
        - 60% (Reflects mature healthcare SaaS multiples and subdued growth without audited reacceleration)
      - - Bear Case
        - >-
          ARR plateaus below $200M; healthcare privacy regulations restrict data feeds; customers substitute internal AI
          models; high burn strains liquidity.
        - >-
          3.0x to 4.0x ARR multiple yields $600M to $800M enterprise value; senior preference overhang ($300M debt +
          Series F preferences) absorbs bulk of proceeds.
        - >-
          Common shares and non-participating preferred equity suffer 80%+ impairment in distress sale or cram-down
          recapitalization.
        - 25% (High structural downside driven by preference overhang and lack of verified cash runway)
    notes: >-
      Scenario valuation ranges assume enterprise software peer multiples applied to estimated ARR bands in the absence
      of audited financial disclosures.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV013
      - CV014
