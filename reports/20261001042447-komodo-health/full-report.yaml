      - number: '5.3'
        title: Marmot AI Layer, Agentic Workflows, and Domain Validation
        blocks:
          - type: paragraph
            body: >-
              Above the data foundation layer, Komodo deploys Marmot, a healthcare-native artificial intelligence
              platform built to execute complex, multi-step analytical reasoning across the Healthcare Map. Unlike
              generic large language models that struggle with clinical terminology and medical logic, Marmot is
              engineered to provide auditable, reproducible, and verifiable evidence. Enterprise pharmaceutical clients
              deploy custom Marmot AI agents directly into their commercial, medical affairs, and clinical development
              workflows. For instance, Alnylam Pharmaceuticals scaled Marmot across its commercial organization,
              successfully collapsing analytical reporting cycles from several months to hours and empowering
              cross-functional teams to query unified real-world evidence directly. Similarly, the National Committee
              for Quality Assurance (NCQA) partnered with Komodo to accelerate the creation and validation of healthcare
              quality measures, completing testing for the HEDIS colorectal cancer screening follow-up measure (COF-E)
              in approximately one month compared to historical two-to-three-month cycles. These deployments demonstrate
              that vertical AI reasoning anchored to a validated longitudinal data foundation delivers tangible
              operational acceleration over legacy business intelligence tools.
            claimRefs:
              - CE004
              - CE009
              - CE010
              - CE014
