            body: >-
              Komodo Health's $3.3B valuation headline dates to March 2021's Series E, augmented by a $200M structured
              equity round from Coatue in November 2022. Without a post-2022 priced equity round, audited financial
              disclosures, or public S-1 filing, the current equity value is vulnerable to substantial macro peer
              multiple compression across healthcare SaaS and data platforms.
            calloutType: risk
