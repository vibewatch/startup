  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Executive Recommendation & Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Our diligence assessment yields a Research-More recommendation with Medium confidence, a High risk rating,
              and a Stretched valuation stance on Komodo Health. The company has assembled an exceptional healthcare
              data asset in its Healthcare Map, tracking over 330 million de-identified patient encounters across 1
              trillion records. Recent commercial traction with major enterprise biopharma partners, including an
              expanded multi-year rollout of Marmot AI at Alnylam Pharmaceuticals and an evidence generation alliance
              with the National Committee for Quality Assurance (NCQA), validates product-market utility. However, the
              investment case is severely constrained by valuation and capital structure friction. Komodo Health has not
              completed a publicly confirmed primary equity round since its $220 million Series E at a $3.3 billion
              valuation in March 2021. In the intervening years, macroeconomic repricing and peer multiple compression
              have sharply lowered software valuations. With secondary market liquidity frozen and no published
              secondary trading price on platforms like Forge Global, entering equity at legacy headline valuations
              without access to audited revenue, growth, and cash burn metrics represents uncompensated downside
              exposure.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
