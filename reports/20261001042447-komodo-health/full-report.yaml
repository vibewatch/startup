      - number: '8.2'
        title: Financing History & Senior Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              Komodo Health's capital formation reflects aggressive late-stage capitalization followed by structured
              downside protections. Across its lifecycle, the company has raised over $514 million to $587 million in
              total capital, according to private tracking platforms Tracxn and Forge Global. Primary milestones include
              a $50 million Series C in January 2020, a $44 million Series D at a $1.41 billion to $2.2 billion
              valuation in January 2021, and the flagship $220 million Series E in March 2021 led by Tiger Global
              Management with ICONIQ Growth, Andreessen Horowitz, Casdin Capital, and SVB Capital at a $3.3 billion
              valuation. Subsequent financing activity shifted toward structured instruments. In October 2022, Coatue
              Management and Dragoneer participated in a $300 million non-convertible round carrying an 11% cumulative
              dividend rate. Furthermore, Forge Global records reflect a March 2025 Series F authorization of $50
              million at an estimated $3.71 billion valuation based on Certificate of Incorporation amendments.
              Crucially, the Series F instrument carries a 1.5x liquidation preference multiplier and a 20% cumulative
              dividend rate. This capital stack structure creates a massive senior preference overhang that directly
              subordinates common equity and earlier preferred tranches, heightening impairment risk in any exit below
              peak valuations.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: Investment Thesis & Anti-Thesis Drivers
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis rests on Komodo Health's defensible data foundation and its evolving
              transformation into an enterprise vertical AI leader. Healthcare Map provides an unmatched longitudinal
              view of patient journeys, shielding the company from simple scraping or commodity EHR aggregators. The
              rollout of Marmot AI across 2025 and 2026 demonstrates that enterprise biopharma clients can extract
              reproducible, auditable insights within hours rather than waiting months for bespoke consultancy studies.
              The executive reorganization in June 2026—elevating commercial veteran Miles Ennis to President and
              appointing co-founder Web Sun as co-CEO alongside Arif Nathoo, MD—signals operational focus on vertical AI
              scale. Conversely, the anti-thesis is anchored in fundamental valuation risks. Operating opacity is total:
              Komodo Health provides no public disclosure regarding annual recurring revenue, recurring software mix,
              net revenue retention, or operating cash burn. In addition, real-world data vendors face heightened
              regulatory and compliance oversight under HHS and FTC frameworks, while customers scrutinize
              multi-million-dollar annual software commitments. Given the senior preference hurdle, even solid
              commercial performance may fail to deliver attractive returns to late-stage equity without substantial
              revenue acceleration.
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Valuation Scenarios & Confirmatory Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              To evaluate return and downside distribution, we model three operating scenarios across a five-year
              investment horizon. In the Bull Case (15% probability), Komodo Health accelerates ARR to $350 million or
              more driven by aggressive Marmot AI enterprise adoption, achieving 125% net retention and expanding
              operating margins to 20%. Under a premium 10.0x ARR multiple, the business achieves a $3.5 billion to $4.0
              billion valuation at IPO, delivering modest single-digit annualized returns relative to the Series E entry
              price. In the Base Case (60% probability), ARR grows at a moderate 12% to 18% pace to between $220 million
              and $260 million. Applying prevailing healthcare vertical SaaS multiples of 6.0x to 7.0x forward revenue
              yields a realistic equity fair value of $1.4 billion to $1.8B—representing a 45% to 55% discount to
              historical marks. In the Bear Case (25% probability), revenue growth stagnates below $200 million amid
              data vendor pressure and customer consolidation. A distressed 3.0x to 4.0x multiple implies an enterprise
              valuation of $600 million to $800 million, where senior liquidation preferences and structured debt absorb
              nearly all exit proceeds, resulting in severe common impairment. Prospective investors should refrain from
              primary commitments until confirmatory diligence verifies audited ARR, contract churn, and exact cap table
              liquidation waterfall seniority.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Recommendation: Research-More at Stretched Valuation'
            body: >-
              Komodo Health possesses an undeniable foundational data asset with its 330M+ patient Healthcare Map and
              promising enterprise traction with Marmot AI. However, the complete absence of audited ARR and margin
              data, combined with a 1.5x liquidation preference on Series F and $300M in non-convertible debt, makes
              entering at or near the historical $3.3B Series E mark untenable without private financial verification.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
