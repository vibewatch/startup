              - CI012
              - CI014
      - number: '4.4'
        title: Capital Adequacy, Financing Structure, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Komodo Health's historical capitalization is anchored by $514 million in cumulative equity funding raised
              across five institutional rounds, culminating in a $220 million Series E in March 2021 led by Tiger Global
              at a $3.3 billion post-money valuation. In late 2022, the company secured a $200 million structured equity
              investment led by Coatue Management, reinforcing its balance sheet without establishing a new common
              valuation benchmark. Financial operations are overseen by Senior Vice President of Finance and Acting
              Chief Financial Officer Paul Thomas, who manages financial planning and capitalization strategy. However,
              the presence of structured preference layers alongside the absence of public financial statements creates
              ambiguity regarding effective common share dilution, liquidation preferences, and cash runway. Prospective
              underwriters must treat secondary market valuations cautiously until management provides verified GAAP
              statements, cash burn metrics, and customer retention data under formal diligence.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Private Capital Structure and Absence of Audited GAAP Disclosures
            body: >-
              While Komodo Health demonstrates enterprise scale with reported ARR exceeding $150 million and $514
              million in historical capital raised, the absence of publicly filed financial statements, audited gross
              margins, and customer retention metrics limits underwriting certainty. Late-stage private companies
              operating with structured equity and debt facilities face heightened valuation sensitivity if expansion
              decelerates.
            calloutType: risk
            claimRefs:
              - CI006
              - CI009
              - CI011
              - CI014
          - type: callout
            title: Operating Leverage Dependent on Third-Party Data Licensing Costs
            body: >-
              The sustainability of Komodo Health's software margins is structurally tied to data acquisition economics.
              Because the Healthcare Map relies on aggregating over 15 million daily patient encounters and third-party
              claims, data licensing royalties and cloud computing infrastructure represent substantial variable costs
              that distinguish its cost structure from pure-play SaaS platforms.
            calloutType: insight
            claimRefs:
              - CI001
              - CI005
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Core Clinical Intelligence Platform
        blocks:
          - type: paragraph
            body: >-
              Komodo Health delivers enterprise healthcare intelligence to life sciences manufacturers, health plans,
              and clinical researchers by transforming fragmented clinical encounters into a unified longitudinal view
              of patient care. At the core of the platform is the Healthcare Map, which links more than 330 million
              de-identified patient journeys across 1 trillion clinical encounters spanning commercial insurance,
              Medicare, Medicaid, electronic health records (EHR), lab orders, and pharmacy claims. The primary
              analytical consumption surface for enterprise life sciences teams is MapLab, an exploratory workflow
              interface enabling researchers to define complex patient cohorts, track clinical progression, and map
              treatment pathways. Within MapLab, Komodo provides MapAI, a specialized conversational assistant designed
              to translate plain-language natural language queries into structured healthcare analytics. By combining
              comprehensive real-world evidence with healthcare-specific intelligence, Komodo eliminates traditional
              reliance on disconnected legacy reporting systems and enables clinical and commercial teams to navigate
              patient behavior, therapy adoption, and health outcome disparities with verifiable accuracy.
