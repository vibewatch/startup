              - CP006
              - CP010
              - CP011
              - CP015
      - number: '3.3'
        title: Enterprise trust and procurement are visible; pricing is not
        blocks:
          - type: paragraph
            body: >-
              The go-to-market evidence points to a consultative enterprise sale. Komodo's sales-engineering role spans
              discovery, qualification, solution design, proof of value, customer AI councils, security review,
              compliance, and procurement. That motion can deepen relationships and create integration friction, but it
              also suggests a long evaluation path and customer leverage during negotiation. Public list prices, units,
              discount schedules, minimum commitments, and realized contract values are absent from the retained
              sources; Komodo's product pages direct prospects to an account team or demo. Pricing for the named direct
              rivals is also unsupported. The commercial comparison can therefore identify a contact-led contract model
              and buying criteria, but cannot establish a price or total-cost advantage.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP014
              - CP016
      - number: '3.4'
        title: Workflow outcomes support adoption, but independent durability proof is missing
        blocks:
          - type: paragraph
            body: >-
              Company-published customer examples show why the product may be difficult to displace after adoption.
              Komodo reports that NCQA cut quantitative testing of a HEDIS measure from two to three months to about one
              month, and that Alnylam reduced reporting cycles from months to hours after integrating enterprise
              datasets into Marmot. These examples indicate potential workflow value and integration depth, but they are
              carried on Komodo's own publication surface and do not disclose contract economics, renewal behavior, or a
              controlled benchmark. At the same time, direct RWD peers, general-purpose AI, and internal analytics teams
              attack different layers of the stack. The defensible conclusion is that Komodo has credible
              differentiation claims and customer-use signals, while commoditization, multi-homing, and displacement
              risk cannot be sized without independent win-loss, retention, and migration evidence.
            claimRefs:
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated proof point
            body: >-
              Komodo combines a large company-claimed healthcare-data foundation with an auditable AI layer and
              purpose-built workflows, a broader proposition than a standalone model or raw-data feed.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Moat evidence is not yet decision-grade
            body: >-
              The assigned pool lacks independent win-loss data, renewal metrics, matched pricing, migration costs, and
              peer performance tests; buyer lock-in and differentiation durability remain underwriting gaps.
            calloutType: risk
            claimRefs:
              - CP004
              - CP005
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Licensing Models, and Pricing Realization
        blocks:
          - type: paragraph
            body: >-
              Komodo Health commercializes its data and healthcare intelligence assets primarily through multi-year
              enterprise Software-as-a-Service (SaaS) subscriptions sold to biopharmaceutical manufacturers, health
              plans, and consulting organizations. The company pairs access to its longitudinal Healthcare Map with
              packaged analytical applications, such as MapLab and the conversational MapAI assistant, allowing life
              sciences clients to query clinical encounter datasets without bespoke consulting engagements. To
              accelerate enterprise software procurement and tap committed cloud infrastructure budgets, Komodo also
              distributes its platform through AWS Marketplace private offers. At the tier of top global pharmaceutical
              accounts, contracts frequently expand into custom AI agent deployments, as demonstrated by commercial
              workflow partnerships that deploy Marmot across sales and customer-facing teams. However, because Komodo
              Health remains privately held, list pricing schedules are not published and realized contract values
              depend on bespoke enterprise volume discounting.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
