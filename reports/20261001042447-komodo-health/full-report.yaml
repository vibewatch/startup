  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Core Segments, and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              Defining the addressable market for Komodo Health requires separating longitudinal real-world data (RWD)
              and claims analytics from transactional healthcare IT and clinical workflow tooling. Komodo’s core market
              encompasses software and data solutions designed for life sciences commercialization, health economics and
              outcomes research (HEOR), medical affairs key opinion leader (KOL) profiling, and clinical trial
              feasibility. The platform aggregates and harmonizes medical and pharmacy claims into its proprietary
              Healthcare Map, spanning over 330 million de-identified U.S. patient journeys and more than 1 trillion
              linked records across 60-plus refreshed sources. The boundary of this market explicitly includes
              enterprise-level secondary data licensing, longitudinal cohort construction, treatment pathway analytics,
              and AI-enabled query infrastructure such as Komodo's Marmot layer. Conversely, the market excludes
              point-of-care clinical decision support, EHR-embedded clinical documentation, transactional billing
              clearinghouse engines, and direct sales outreach prospecting tools. Buyers seeking contact lists must
              supplement Komodo with directory providers, as the platform is built for retrospective epidemiological and
              market access research rather than frontline clinical workflows.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Serviceable Demand'
        blocks:
          - type: paragraph
            body: >-
              Sizing Komodo Health’s market requires evaluating multiple analytical lenses rather than relying on a
              single broad healthcare IT aggregate. At the broadest level, the global and U.S. healthcare analytics and
              real-world data market represents an expansive Total Addressable Market (TAM) exceeding $35 billion,
              comprising commercial analytics, clinical RWD, payer risk stratification, and epidemiological data
              infrastructure. However, Komodo’s actual Serviceable Addressable Market (SAM) is concentrated within U.S.
              life sciences enterprise analytics, specialty biopharma commercial intelligence, and regulatory-grade
              real-world evidence (RWE), representing an estimated addressable pool of $4.5 billion to $6.0 billion
              across biopharmaceutical sponsors, major integrated delivery networks (IDNs), and health plans. Within
              this envelope, Komodo’s Serviceable Obtainable Market (SOM) is governed by organizations with budgets
              capable of absorbing custom enterprise SaaS contracts ranging from $150,000 for single-indication modules
              up to $2.0 million or more for comprehensive dataset licensing. Industry reviews indicate that Komodo's
              high-stakes niche centers on specialty and rare-disease biopharma where complete longitudinal tracking
              across small cohorts commands premium pricing over sample-projected competitor offerings.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption of Komodo Health spans three primary institutional categories: life sciences
              manufacturers, payer organizations, and health system delivery networks. Biopharmaceutical enterprises
              represent the vast majority of current software spend and ARR generation, where budget ownership is split
              across commercial operations, medical affairs, and clinical development. Commercial teams deploy Komodo
              for market sizing, therapy persistence tracking, and 7-signal KOL network mapping, whereas HEOR and
              medical affairs teams utilize the Healthcare Map to build defensible real-world evidence dossiers and
              payer submission materials. Strategic partnerships with organizations like Alnylam Pharmaceuticals
              demonstrate enterprise-wide adoption of Komodo's Marmot AI platform to shorten reporting cycles from
              months to hours. In the payer and quality governance segment, strategic collaborations like that announced
              with the National Committee for Quality Assurance (NCQA) in August 2026 leverage the Healthcare Map and
              Marmot to accelerate HEDIS measure development and testing from multi-month timelines down to
              approximately one month across Medicare Advantage, Medicaid, and commercial populations.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Growth Catalysts, Adoption Bottlenecks, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Several macro drivers propel adoption of Komodo Health's analytics suite, led by regulatory acceptance of
              real-world evidence by agencies like the FDA, the proliferation of complex specialty and cell/gene
              therapies requiring longitudinal tracking, and enterprise demand for vertical healthcare AI agents capable
              of natural language query generation. Despite these tailwinds, material adoption constraints govern
              deployment velocity. The foremost commercial bottleneck is pricing opacity; Komodo enforces negotiated
              enterprise SaaS contracts without public pricing tiers, forcing prospective customers into multi-month
              procurement cycles. Second, technical deployment requires specialized analytics teams, epidemiologists, or
              biostatisticians proficient in claims data nuances, meaning organizations lacking dedicated analytics
              centers of excellence risk shelfware or must purchase vendor professional services. Furthermore, claims
              data carries an inherent adjudication latency of weeks to months and excludes cash-pay transactions,
              limiting real-time operational utility. Finally, data governance and regulatory scrutiny regarding patient
              de-identification and source provenance present ongoing compliance considerations that institutional
              buyers must actively audit.
            claimRefs:
              - CM004
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Market Boundary Realities: Research Infrastructure vs. Point of Care'
            body: >-
              Prospective buyers and diligence teams must maintain strict boundary discipline regarding Komodo Health's
              software positioning. The platform is research-grade analytics infrastructure designed for retrospective
              cohort analysis, real-world evidence generation, and strategic provider targeting. It does not provide
              real-time clinical decision support at the point of care, nor does it deliver transactional HCP contact
              information for direct sales prospecting.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: 'Adoption Bottlenecks: Enterprise Sales Cycles and Analytics Talent Deficits'
            body: >-
              Despite robust demand for real-world evidence, Komodo Health faces structural friction in scaling beyond
              life sciences commercial teams. Unpublished, custom enterprise SaaS pricing ($150K to over $1M annually)
              creates protracted procurement cycles, while extracting meaningful value requires highly skilled in-house
              claims analysts or costly vendor professional services.
            calloutType: risk
            claimRefs:
              - CM004
              - CM009
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer can choose a peer, a general platform, or internal build
        blocks:
          - type: paragraph
            body: >-
              The observable landscape is broader than a list of healthcare-data vendors. ForesightIQ names
              HealthVerity, Symphony Health Solutions, and Inovalon as direct rivals, but supplies no audited scale or
              like-for-like performance comparison. Komodo's own sales-engineering brief separately says the company
              must position against both real-world-data vendors and general-purpose foundation models. Internal build
              is also a credible substitute: a Komodo data-analyst guide and a current data-product role describe SQL,
              Python, data-model, pipeline, and product capabilities that sophisticated organizations can assemble
              themselves. The status quo of fragmented dashboards and one-off analysis therefore competes for budget
              even when it is not a named vendor. This multi-front set makes category leadership harder to defend than a
              three-company peer list implies.
            claimRefs:
              - CP004
              - CP006
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP006
              - CP009
              - CP010
              - CP015
      - number: '3.2'
        title: The claimed moat combines data breadth, auditability, and workflow depth
        blocks:
          - type: paragraph
            body: >-
              Komodo's strongest disclosed position is architectural rather than price-based. The company says its
              Healthcare Map contains more than 1 trillion linked records covering more than 330 million de-identified
              patients and is refreshed daily. It layers Marmot and a wider application portfolio on that foundation,
              with reproducible and auditable outputs as the core trust proposition. The company also argues that
              customer logic and workflows become configured into the platform, which could raise switching costs if
              those workflows are deeply embedded. Those are company claims, not independent moat verification. The
              retained competitor source does not establish whether direct peers match the data coverage, refresh
              cadence, identity resolution, or workflow breadth, so unsupported cells remain unknown rather than being
              scored as losses for rivals.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP011
