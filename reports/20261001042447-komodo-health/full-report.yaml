      - number: '5.4'
        title: Enterprise Deployment, Security Governance, and Technical Debt Risks
        blocks:
          - type: paragraph
            body: >-
              Enterprise integration and governance within regulated healthcare environments demand rigorous data
              segregation, identity management, and infrastructure security. Komodo manages its analytical and machine
              learning workloads across a hybrid warehouse architecture utilizing Snowflake for structured SQL
              warehousing and Databricks clusters for advanced data science modeling. The platform enforces fine-grained
              access control models and automated tagging structures to classify data sensitivity, ownership, and
              infrastructure costs, ensuring strict alignment with HIPAA compliance and enterprise security boundaries.
              Production services and customer-facing APIs are packaged in containerized pipelines managed via
              Kubernetes on AWS infrastructure. Despite these architectural foundations, Komodo faces critical technical
              and operational diligence risks. Independent public benchmarks, latency profiles, and model safety
              evaluations for Marmot AI remain unavailable, with third-party software review platforms such as PeerSpot
              listing zero verified reviews as of September 2026. Furthermore, operating dual high-scale warehousing
              platforms across Snowflake and Databricks introduces ongoing cloud cost optimization pressures, while
              maintaining data freshness across 330 million patients requires continuous mitigation of upstream
              clearinghouse ETL delays and proprietary linkage errors.
            claimRefs:
              - CE005
              - CE011
              - CE013
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Decoupling of Data Lakehouse and AI Reasoning
            body: >-
              Komodo separates raw longitudinal ingestion (using Airflow, Spark, and transactional data lakehouse
              tables) from its analytical serving and AI tier (Snowflake, Databricks, and Marmot). This allows
              independent scaling of clinical data curation and conversational AI interfaces.
            calloutType: insight
            claimRefs:
