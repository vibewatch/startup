  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Privacy Governance, and Contractual Restraints
        blocks:
          - type: paragraph
            body: >-
              Komodo Health's core value proposition rests upon the continuous ingestion and longitudinal linkage of
              vast volumes of real-world patient data, aggregating over 1 trillion linked clinical and healthcare
              encounter records spanning 330 million de-identified individuals. Operating at this scale creates inherent
              regulatory exposure under the Health Insurance Portability and Accountability Act (HIPAA), state-level
              health privacy statutory frameworks such as Washington's My Health My Data Act and the California Consumer
              Privacy Act (CCPA), and emerging healthcare AI governance standards. To mitigate the critical hazard of
              patient re-identification, Komodo Health enforces stringent contractual boundaries within its Master
              Service Agreement. Under Section 2.7 of its General Terms and Conditions, customers are strictly
              prohibited from directly or indirectly attempting to re-identify any de-identified individual or linking
              Komodo Data to external third-party datasets. Furthermore, Section 2.9 explicitly restricts users from
              inputting Komodo IP into public artificial intelligence models, including ChatGPT, Claude, Copilot, and
              Gemini, requiring isolated private deployments with binding confidentiality commitments. Komodo reinforces
              this posture through unilateral audit rights lasting six months beyond agreement termination under Section
              2.10. Nonetheless, independent vendor evaluations indicate that biopharma and enterprise healthcare buyers
              frequently encounter protracted legal, privacy, and data-rights compliance review cycles that delay
              operational onboarding and value realization.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
      - number: '7.2'
        title: Operational Reliability, Identity Lifecycle, and Audit Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Operational resilience and security governance represent critical risk surfaces for Komodo Health given
              its multi-tenant SaaS architecture and sensitive healthcare data pipelines. Internal operational
              engineering disclosures reveal that Komodo relies heavily on automated identity and access management
              across Workday, Okta Workflows, Google Workspace, and Jira Service Management. A primary operational focus
              centers on automating the joiner, mover, and leaver lifecycle to eliminate deprovisioning gaps that
              generate severe audit exposure during SOC 2 and HIPAA evaluations. Managing non-human identities,
              including API tokens, service accounts, and agentic integrations, represents an expanding attack surface
              that requires automated credential rotation, least-privilege scoping, and continuous access review. Cloud
              infrastructure deployments delivering applications such as MapLab and conversational assistants like MapAI
              must maintain rigorous logical separation between customer tenants while handling high-throughput
              analytical query workloads. Failure to maintain continuous audit evidence generation risks triggering
              compliance deficiencies during customer security reviews, directly jeopardizing enterprise subscription
              renewals and expanding operational friction.
            claimRefs:
              - CR005
              - CR006
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
