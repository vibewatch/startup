              - CI003
              - CI004
              - CI014
      - number: '4.2'
        title: Revenue Model Architecture and Platform Conversion Flow
        blocks:
          - type: paragraph
            body: >-
              The economic engine underpinning Komodo Health's platform converts continuous data ingestion into
              high-visibility recurring enterprise software revenue. The pipeline begins by ingesting and linking over
              15 million daily clinical transactions across diverse medical claims, prescription registries, and
              laboratory feeds, continuously expanding a longitudinal foundation covering more than 330 million
              de-identified patient journeys. This standardized data layer feeds into the Marmot healthcare AI analytics
              environment, where specialized vertical models and algorithmic agents transform raw encounter histories
              into reproducible cohort analyses and commercial insights. Enterprise customers contract for access
              through annual subscription licenses rather than one-off transactional data deliveries, creating recurring
              contract value. However, platform gross margins are bounded by third-party data acquisition royalties and
              cloud compute expenses required to process petabyte-scale healthcare records daily.
            claimRefs:
              - CI001
              - CI005
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI012
      - number: '4.3'
        title: Operating Cost Structure, Gross Margins, and Financial Traction
        blocks:
          - type: paragraph
            body: >-
              Komodo Health's cost structure reflects a hybrid of enterprise software development, specialized
              healthcare data engineering, and variable data licensing overhead. Unlike pure-play software vendors, the
              company incurs ongoing licensing and royalty obligations to maintain its multi-source data ingestion
              pipeline, alongside significant cloud hosting infrastructure commitments. In response to post-pandemic
              software multiple compression, Komodo executed a workforce reduction and operational restructuring in late
              2022 to realign operating expenses and establish fiscal discipline. Third-party research tracks Komodo
              Health at approximately $150 million in annual recurring revenue (ARR), with secondary platform estimates
              from UpMarket citing $165.7 million in 2024 revenue. Nevertheless, the company has not publicly reported
              positive operating profitability, and core unit economics—including GAAP gross margins, customer
              acquisition costs, and net revenue retention—remain undisclosed private data points requiring confirmatory
              audit.
            claimRefs:
              - CI006
              - CI007
              - CI010
              - CI012
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
