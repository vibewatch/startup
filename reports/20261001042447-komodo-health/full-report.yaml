      - number: '7.3'
        title: Partner Concentration, Vendor Governance, and Commercial Dependency
        blocks:
          - type: paragraph
            body: >-
              Komodo Health maintains substantial operational and commercial dependencies across both upstream data
              providers and downstream implementation workflows. Upstream, the completeness and clinical validity of the
              Healthcare Map depend on continuous data licensing agreements with healthcare clearinghouses, commercial
              payers, and clinical laboratories. Any contractual disruption, fee escalation, or regulatory restriction
              on commercial secondary health data licensing would directly impair Komodo's data refresh cadence and
              longitudinal journey fidelity. On the downstream deployment front, independent procurement assessments
              from RFP Wiki emphasize that commercial risks frequently hide in prolonged services dependency and
              implementation bandwidth constraints. When enterprise buyers fail to achieve analytical self-sufficiency,
              expensive professional services or vendor analyst assistance are required to execute complex health
              economics and outcomes research (HEOR) studies. Additionally, buyers must rigorously validate data
              coverage across specific medical specialties and geographies to avoid misalignments between broad
              corporate positioning and narrow therapeutic fit. To manage counterparty exposures, Komodo has
              operationalized a centralized procurement framework utilizing Zip under FP&A oversight to govern SaaS
              vendor contracts, Data Protection Agreements, and supplier performance.
            claimRefs:
              - CR004
              - CR007
              - CR008
              - CR011
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
