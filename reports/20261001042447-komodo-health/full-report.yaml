      - number: '7.4'
        title: Financial Model Sustainability, Thesis-Break Triggers, and Diligence Paths
        blocks:
          - type: paragraph
            body: >-
              Financial model uncertainty constitutes a prominent residual exposure for Komodo Health due to the absence
              of public financial disclosures or priced equity financing events since its $220 million Series E round in
              March 2021, which established a peak $3.3 billion post-money valuation. While the company subsequently
              raised $200 million in structured equity from Coatue in November 2022 alongside operational restructuring,
              Komodo has disclosed no audited figures for annual recurring revenue (ARR), revenue growth rate, gross
              margins, net revenue retention (NRR), or ongoing cash burn. This lack of transparency obscures the
              operating leverage of Komodo's software business versus its capital intensity in maintaining massive
              proprietary data ingestion feeds. Thesis-break triggers that would invalidate an investment thesis
              include: material regulatory enforcement or HIPAA OCR investigations regarding patient re-identification;
              termination of key clearinghouse data feeds that degrade Healthcare Map coverage; significant customer
              churn among top biopharma accounts due to high total cost of ownership or services dependency; and
              evidence of steep secondary market valuation haircuts below the $3.3 billion baseline. Necessary diligence
              paths require reviewing audited GAAP financial statements, obtaining verified cohort retention curves, and
              evaluating the margin contribution of recent AI capabilities like Marmot.
            claimRefs:
              - CR008
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
