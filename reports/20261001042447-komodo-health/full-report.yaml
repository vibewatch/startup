              Ennis to President, Komodo is attempting to transition from a static real-world data broker to a vertical
              AI operating system. The August 2025 launch of Marmot and enterprise agreements with Alnylam, NCQA, and
              AWS represent strategic efforts to improve software gross margins and workflow lock-in.
            calloutType: insight
