chapter:
  number: 5
  title: "Product & Technology"
  summary: "Komodo Health operates an AI-powered healthcare intelligence platform anchored by its Healthcare Map, aggregating over 330 million de-identified longitudinal patient records and 1 trillion clinical encounters across claims, electronic health records, lab, and pharmacy sources. The technology stack decouples a cloud data lakehouse on AWS—leveraging Apache Spark, Airflow, Snowflake, and Databricks—from an analytics serving tier and the Marmot healthcare-native AI engine. While enterprise customer deployments demonstrate analytical speedups, public peer benchmarks and open technical disclosures remain constrained, necessitating specific architectural diligence."
sections:
  - id: "product-definition-workflow"
    title: "Product Architecture and Core Clinical Intelligence Platform"
    body: "Komodo Health delivers enterprise healthcare intelligence to life sciences manufacturers, health plans, and clinical researchers by transforming fragmented clinical encounters into a unified longitudinal view of patient care. At the core of the platform is the Healthcare Map, which links more than 330 million de-identified patient journeys across 1 trillion clinical encounters spanning commercial insurance, Medicare, Medicaid, electronic health records (EHR), lab orders, and pharmacy claims. The primary analytical consumption surface for enterprise life sciences teams is MapLab, an exploratory workflow interface enabling researchers to define complex patient cohorts, track clinical progression, and map treatment pathways. Within MapLab, Komodo provides MapAI, a specialized conversational assistant designed to translate plain-language natural language queries into structured healthcare analytics. By combining comprehensive real-world evidence with healthcare-specific intelligence, Komodo eliminates traditional reliance on disconnected legacy reporting systems and enables clinical and commercial teams to navigate patient behavior, therapy adoption, and health outcome disparities with verifiable accuracy."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "data-foundations-lakehouse"
    title: "Healthcare Map Ingestion, Normalization, and Lakehouse Infrastructure"
    body: "Powering the Healthcare Map is a sophisticated data foundations architecture engineered to continuously ingest, standardize, and link massive volumes of disparate healthcare transaction streams. Incoming records encompass varied and non-standardized clinical coding systems, requiring automated cross-walking across ICD-10 diagnosis codes, CPT procedure codes, NDC medication identifiers, and NPI provider taxonomies. To handle billions of incoming records daily without sacrificing data integrity, Komodo leverages distributed processing frameworks such as Apache Spark alongside modern transactional data lakehouse architectures, evaluating formats such as Apache Iceberg, Apache Hudi, and Delta Lake on AWS object storage. The data engineering team employs workflow orchestration via Apache Airflow to coordinate multi-stage ingestion pipelines, validating data freshness and lineage while mitigating the risk of schema drift. Furthermore, Komodo builds agentic data acquisition systems and LLM-powered Human-in-the-Loop (HITL) curation pipelines to extract structured clinical variables from unstructured public records and clinical text, substantially expanding the analytical depth of its core real-world data asset."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE012"
    tableRefs:
      - "TE002"
  - id: "marmot-ai-analytics"
    title: "Marmot AI Layer, Agentic Workflows, and Domain Validation"
    body: "Above the data foundation layer, Komodo deploys Marmot, a healthcare-native artificial intelligence platform built to execute complex, multi-step analytical reasoning across the Healthcare Map. Unlike generic large language models that struggle with clinical terminology and medical logic, Marmot is engineered to provide auditable, reproducible, and verifiable evidence. Enterprise pharmaceutical clients deploy custom Marmot AI agents directly into their commercial, medical affairs, and clinical development workflows. For instance, Alnylam Pharmaceuticals scaled Marmot across its commercial organization, successfully collapsing analytical reporting cycles from several months to hours and empowering cross-functional teams to query unified real-world evidence directly. Similarly, the National Committee for Quality Assurance (NCQA) partnered with Komodo to accelerate the creation and validation of healthcare quality measures, completing testing for the HEDIS colorectal cancer screening follow-up measure (COF-E) in approximately one month compared to historical two-to-three-month cycles. These deployments demonstrate that vertical AI reasoning anchored to a validated longitudinal data foundation delivers tangible operational acceleration over legacy business intelligence tools."
    claimRefs:
      - "CE004"
      - "CE009"
      - "CE010"
      - "CE014"
    tableRefs:
      - "TE003"
  - id: "deployment-security-risks"
    title: "Enterprise Deployment, Security Governance, and Technical Debt Risks"
    body: "Enterprise integration and governance within regulated healthcare environments demand rigorous data segregation, identity management, and infrastructure security. Komodo manages its analytical and machine learning workloads across a hybrid warehouse architecture utilizing Snowflake for structured SQL warehousing and Databricks clusters for advanced data science modeling. The platform enforces fine-grained access control models and automated tagging structures to classify data sensitivity, ownership, and infrastructure costs, ensuring strict alignment with HIPAA compliance and enterprise security boundaries. Production services and customer-facing APIs are packaged in containerized pipelines managed via Kubernetes on AWS infrastructure. Despite these architectural foundations, Komodo faces critical technical and operational diligence risks. Independent public benchmarks, latency profiles, and model safety evaluations for Marmot AI remain unavailable, with third-party software review platforms such as PeerSpot listing zero verified reviews as of September 2026. Furthermore, operating dual high-scale warehousing platforms across Snowflake and Databricks introduces ongoing cloud cost optimization pressures, while maintaining data freshness across 330 million patients requires continuous mitigation of upstream clearinghouse ETL delays and proprietary linkage errors."
    claimRefs:
      - "CE005"
      - "CE011"
      - "CE013"
      - "CE015"
