        - "10.0x forward ARR multiple supports a $3.5B to $4.0B valuation at IPO or strategic sale to major healthcare or enterprise cloud platform."
        - "IPO window remains constrained; public healthcare data peer multiples compress below 6x forward revenue."
        - "15% (Requires unprecedented enterprise AI monetization and rapid IPO market re-opening)"
      - - "Base Case"
        - "ARR grows modestly to $220M-$260M; growth moderates to 12%-18%; customer retention remains stable with enterprise pharma but mid-market churn rises."
        - "6.0x to 7.0x ARR multiple yields an equity value of $1.4B to $1.8B, representing a 45%-55% discount to 2021 Series E headline valuation."
        - "Extended liquidity freeze forces structured secondary trades or flat/down internal funding extension rounds."
        - "60% (Reflects mature healthcare SaaS multiples and subdued growth without audited reacceleration)"
      - - "Bear Case"
        - "ARR plateaus below $200M; healthcare privacy regulations restrict data feeds; customers substitute internal AI models; high burn strains liquidity."
        - "3.0x to 4.0x ARR multiple yields $600M to $800M enterprise value; senior preference overhang ($300M debt + Series F preferences) absorbs bulk of proceeds."
        - "Common shares and non-participating preferred equity suffer 80%+ impairment in distress sale or cram-down recapitalization."
        - "25% (High structural downside driven by preference overhang and lack of verified cash runway)"
