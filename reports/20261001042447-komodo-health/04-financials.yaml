callouts:
  - calloutType: "risk"
    title: "Private Capital Structure and Absence of Audited GAAP Disclosures"
    body: "While Komodo Health demonstrates enterprise scale with reported ARR exceeding $150 million and $514 million in historical capital raised, the absence of publicly filed financial statements, audited gross margins, and customer retention metrics limits underwriting certainty. Late-stage private companies operating with structured equity and debt facilities face heightened valuation sensitivity if expansion decelerates."
    claimRefs:
      - "CI006"
      - "CI009"
      - "CI011"
      - "CI014"
  - calloutType: "insight"
    title: "Operating Leverage Dependent on Third-Party Data Licensing Costs"
    body: "The sustainability of Komodo Health's software margins is structurally tied to data acquisition economics. Because the Healthcare Map relies on aggregating over 15 million daily patient encounters and third-party claims, data licensing royalties and cloud computing infrastructure represent substantial variable costs that distinguish its cost structure from pure-play SaaS platforms."
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI012"
