evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-unit-economics
    missingEvidence: >-
      Audited income statements, balance sheets, cash flow statements, ARR breakdowns, gross margins, net revenue
      retention, and gross retention rates.
    whyItMatters: >-
      Without audited financial disclosures or an active S-1 registration, reported figures such as $150M ARR cannot be
      validated against revenue recognition standards or operating cash burn.
    diligencePath: >-
      Request audited GAAP financial statements, trailing twelve months (TTM) cohort retention data, and contract-level
      ACV schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-governance
    missingEvidence: >-
      Comprehensive roster of vice presidents, directors, and independent board members with detailed voting covenants
      and committee assignments.
    whyItMatters: >-
      Understanding functional leadership depth, executive turnover rates following 2022 restructuring, and board
      governance dynamics is critical to evaluating key-person risk.
    diligencePath: >-
      Review full organizational charts, executive retention agreements, and board composition records during management
      diligence sessions.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investor-capitalization-and-shareholder-register
    missingEvidence: >-
      Complete cap table detailing share class preferences, liquidation rights, option pools, and secondary trade prices
      since the 2022 structured equity infusion.
    whyItMatters: >-
      Coatue's $200M structured equity round in late 2022 likely introduced senior liquidation preferences and
      structured return hurdles that impair common equity value in downside or modest exit scenarios.
    diligencePath: >-
      Examine the fully diluted capitalization table, preferred stock purchase agreements, and secondary trading records
      through equity administration platforms.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: Audited Contract Value and Cohort Sizing
    missingEvidence: >-
      Audited customer-level ACVs, renewal rates, and exact market share breakdown between biopharma commercial, HEOR,
      and payer segments.
    whyItMatters: >-
      Independent quantification of Komodo's Serviceable Obtainable Market (SOM) relies on third-party pricing estimates
      ($150K-$2M) and self-reported 600+ customer counts rather than GAAP audited segment disclosures.
    diligencePath: >-
      Review confidential customer contract exhibits, revenue schedules by buyer tier, and net retention metrics in
      prospective pre-IPO filings.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: minor
    topic: Claims Adjudication Lag and Data Freshness Metrics
    missingEvidence: >-
      Empirical third-party benchmarks measuring the exact latency (days to weeks) between patient clinical encounters
      and appearance in queryable Healthcare Map tables.
    whyItMatters: >-
      Understanding data lag is critical for evaluating whether Komodo can service rapid competitive monitoring or acute
      epidemiological monitoring workflows.
    diligencePath: >-
      Request vendor SLA documentation on claims ingestion timelines and run test queries on recent ICD-10 diagnostic
      code releases.
    relatedQuestionRefs:
      - QM005
      - QM007
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      Independent win-loss data, customer renewal and multi-homing evidence, matched product tests, peer scale metrics,
      realized pricing, and migration costs.
    whyItMatters: >-
      Without matched evidence, the relative capability scores and moat-durability conclusion rely mainly on Komodo
      claims and one low-reputation landscape source.
    diligencePath: >-
      Obtain recent competitive bake-off results, three customer reference calls, anonymized win-loss records, renewal
      cohorts, and matched vendor proposals.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements confirming GAAP revenue, gross margin, net revenue retention (NRR), and operating
      cash burn.
    whyItMatters: >-
      Without audited disclosure or public SEC filings, private secondary revenue estimates cannot be verified for
      valuation underwriting.
    diligencePath: >-
      Request audited financial statements, historical income statements, and management accounts under NDA during
      confirmatory diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Customer acquisition cost (CAC), payback period, and software versus data gross margin breakdown.
    whyItMatters: >-
      Understanding software gross margins versus data licensing royalty costs is essential to evaluate operating
      leverage and long-term terminal margin.
    diligencePath: >-
      Obtain cohort-level contribution margin data and sales efficiency metrics directly from Komodo Health's finance
      leadership.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: marmot-benchmarks-and-model-provenance
    missingEvidence: >-
      Independent technical benchmarks on Marmot AI latency, hallucination rates, proprietary base model architectures,
      and fine-tuning datasets are not publicly disclosed.
    whyItMatters: >-
      Life sciences enterprise underwriting requires verifiable proof of model safety, medical hallucination bounds, and
      regulatory compliance under HHS Section 1557 AI standards.
    diligencePath: >-
      Request vendor architecture briefs, technical whitepapers on Marmot foundation model lineage, internal validation
      error logs, and customer benchmark telemetry under NDA.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: external-review-saturation
    missingEvidence: >-
      Public enterprise software reviews and third-party ratings for Marmot remain sparse across practitioner platforms
      such as PeerSpot and G2.
    whyItMatters: >-
      Absence of practitioner community feedback makes it difficult to assess real-world implementation friction, vendor
      lock-in, and integration maintenance overhead.
    diligencePath: >-
      Conduct reference calls with clinical data science and commercial analytics leads at named deployment partners
      (e.g. Alnylam, Novo Nordisk, Merck).
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rates, customer-satisfaction measures, and cohort expansion by product and customer
      segment.
    whyItMatters: Named expansions do not establish whether the broader installed base renews or expands economically.
    diligencePath: >-
      Review monthly customer cohorts, renewal schedules, contraction and churn logs, and product-level expansion
      bridges under NDA.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Active paying-customer count, ARR distribution by contract size, top-10 customer share, contract duration, and
      services versus software mix.
    whyItMatters: >-
      Without denominators and concentration data, public logos cannot establish revenue durability or exposure to a
      small number of accounts.
    diligencePath: >-
      Obtain the customer master and contract schedule, reconcile it to audited revenue, and calculate concentration and
      renewal cohorts.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: financial-model-risk
    missingEvidence: >-
      Audited financial statements confirming revenue, ARR, gross margins, cash burn rate, and customer contract churn
      rates for 2024 through 2026.
    whyItMatters: >-
      Without audited financial disclosures, Komodo Health's cash runway, operating margins, and residual exposure to
      high fixed cloud and data acquisition costs cannot be independently substantiated.
    diligencePath: >-
      Request audited GAAP financials, board-approved quarterly reporting packs, and a verified ARR bridge from
      management under non-disclosure agreement.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive non-public regulatory filings, state data protection assessments, and private customer dispute logs
      across all commercial jurisdictions.
    whyItMatters: >-
      Public review of terms of service and standard compliance frameworks provides only partial visibility into
      customer-specific compliance exceptions or active confidential regulatory inquiries.
    diligencePath: >-
      Review full legal compliance documentation, customer audit request logs, and outside counsel litigation risk
      assessments during confidential diligence.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited GAAP revenue, ARR, recurring revenue growth rates, gross margins, and net retention figures from company
      filings or audited financial statements.
    whyItMatters: >-
      Without verified revenue or ARR numbers, valuation multiples cannot be anchored to audited operating performance,
      forcing investors to rely on unconfirmed secondary marks and historical headline valuations.
    diligencePath: >-
      Request confidential financial disclosure schedules, audited financial statements, and board-level ARR bridge
      reports under an NDA.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Fully diluted capitalization table, Certificate of Incorporation amendments, and definitive liquidation preference
      schedules detailing seniority across Series A through F and non-convertible debt.
    whyItMatters: >-
      Disclosed terms on Forge indicate a 1.5x liquidation preference and 20% cumulative dividend on Series F, plus an
      11% non-convertible instrument, which create substantial preference overhang that materially impairs common share
      value in downside scenarios.
    diligencePath: >-
      Review the executed Certificate of Incorporation, investor rights agreements, and debt covenants during
      confirmatory legal diligence.
    relatedQuestionRefs:
      - QV008
