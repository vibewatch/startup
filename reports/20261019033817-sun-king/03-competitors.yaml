      - ["Sun King higher-tier bundles", "Teardown cites pricing up to KES 62,000 for a 43-inch HD TV bundle", "Higher-ticket financed bundle", "TV bundle and larger energy load", "Moves Sun King into categories closer to weak-grid backup and wallet-share adjacencies"]
      - ["Sun King Nigeria 50W system", "Teardown cites NGN 165,000 cash versus NGN 319,300 total on a 74-week PAYGO plan", "Long-tenor PAYGO", "Solar kit ownership with affordability at checkout", "Public evidence shows the financing layer can materially raise lifetime cost"]
      - ["M-KOPA-style finance-led adjacency", "No retained 2026 public list price in this pool", "Device financing rather than a full solar-kit sale", "Smartphones and other financed devices", "Can compete for the same repayment capacity without replicating Sun King's full installation stack"]
      - ["Mini-grid or public-grid substitute", "No comparable consumer list price in this pool", "Connection or utility service contract", "Ongoing energy service instead of a financed kit", "Displaces the home-system purchase when density or grid quality improves enough"]
    notes: "Only Sun King's own public price points are explicit in the assigned pool; rival rows therefore compare contract model and use case rather than asserting unsupported like-for-like consumer prices."
    claimRefs: ["CP002", "CP005", "CP007", "CP012", "CP015"]
