company:
  name: "Sun King"
chapter:
  number: 3
  title: "Competitors"
  summary: "Sun King's closest direct rivals remain PAYGO solar operators such as d.light, while the sharper near-term threat comes from adjacencies like M-KOPA's smartphone financing and mini-grid or grid substitutes in denser and weak-grid areas. The retained evidence suggests Sun King's moat is strongest in its bundled field distribution, servicing, and receivables-financing stack, but that same model faces pressure from high PAYGO markups, agent competition, and upmarket category expansion."
sections:
  - id: "landscape"
    title: "Landscape spans direct PAYGO peers and several substitute classes"
    body: |
      The retained third-party evidence does not support a narrow "other solar brands only" view of competition. Teardown frames Sun King's direct peer set as d.light, M-KOPA, ENGIE Energy Access, Bboxx, and Zola Electric, then adds mini-grids, grid extension, and distribution-first operators as meaningful substitute or channel threats. That matters because Sun King no longer sells only entry-level lanterns: its own current product pages show a ladder from basic lighting and charging through TV bundles and larger systems, so the company now overlaps both classic off-grid peers and higher-load, weak-grid backup use cases. In practice, this means Sun King competes on at least three fronts at once: direct PAYGO solar brands, consumer-finance adjacencies that can capture the same household wallet, and electrification substitutes that remove the need for a bundled solar kit altogether.
    claimRefs: ["CP001", "CP002", "CP003", "CP004", "CP005", "CP007", "CP008"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "capability-and-packaging"
    title: "Capability breadth is a strength, but pricing evidence is asymmetric"
    body: |
      Sun King's official pages and corroborating independent coverage show a broader package than a single-SKU solar seller. The company currently markets basic lighting and phone-charging kits, TV bundles, larger home systems, and other appliances, while Fortune still describes the business as spanning solar lanterns, home systems, and multi-kilowatt systems for off-grid and weak-grid customers. That breadth supports the positioning claim that Sun King can follow households up the energy ladder. The evidence is weaker on like-for-like rival packaging and consumer prices, because this worker's assigned pool contains detailed Sun King pricing and financing examples but not equivalent 2026 public price sheets for d.light, M-KOPA, ENGIE Energy Access, Bboxx, or Zola. The chapter can therefore compare solution classes and contract structures with confidence, but not claim precise public-price superiority over those rivals.
    claimRefs: ["CP006", "CP007", "CP008", "CP009", "CP012"]
    tableRefs: ["TP002", "TP003"]
  - id: "distribution-and-financing-moat"
    title: "Distribution plus financing is the main moat"
    body: |
      Sun King's strongest competitive defense is the combination of owned distribution, servicing, and financing infrastructure. Its official pages describe 41,000-plus to 45,000-plus field agents, 440 shops, installation and maintenance, and PAYG financing under one brand. Teardown then ties that operating layer to mobile-money collection, credit scoring, and securitisation, while British International Investment says its Sun King financing vehicle was created specifically to purchase PAYGO receivables originated by Sun King Kenya. Together, those sources support the view that Sun King's advantage is not just hardware branding; it is a capital-backed servicing system that is hard for a new entrant to reproduce quickly. That also explains why direct hardware imitation looks less dangerous than consumer-finance or distribution attacks that try to unbundle credit, appliances, or last-mile labor from the kit itself.
    claimRefs: ["CP006", "CP010", "CP011", "CP013"]
  - id: "durability-and-displacement-risk"
    title: "Durability is real, but weakest where the customer no longer needs a full bundle"
    body: |
      The same evidence also limits how far the moat should be stretched. Teardown's competitive analysis highlights M-KOPA's smartphone-finance pivot, d.light's securitisation program, and mini-grid or grid substitutes as credible paths around Sun King's traditional solar-home-system wedge. The most concrete public consumer-pricing signal is adverse: Teardown reports a Nigerian 50W PAYGO plan totaling 94% above cash price, implying that affordability at checkout can become expensive lifetime ownership in the very segments Sun King is trying to serve. Techparley's 2025 funding report reinforces that management is pushing product expansion, scale, and higher capacity rather than narrowing back to low-end lighting. The competitive takeaway is that Sun King still looks hardest to attack in first-time energy access sold through its own field network, but more contestable in already-electrified, peri-urban, or appliance-led categories where the buyer may value financing or backup power more than a full Sun King bundle.
    claimRefs: ["CP002", "CP005", "CP012", "CP014", "CP015"]
