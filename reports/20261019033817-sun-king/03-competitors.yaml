callouts:
  - calloutType: "insight"
    title: "Moat lives in the bundle, not just the box"
    body: "The strongest retained evidence points to Sun King's field-sales, servicing, and receivables-financing bundle as the true barrier to entry; that is harder to copy quickly than a solar-home-system bill of materials."
    claimRefs: ["CP006", "CP010", "CP011", "CP013"]
  - calloutType: "risk"
    title: "Adjacencies may matter more than copycat solar brands"
    body: "M-KOPA-style device finance, appliance-led financing, and electrification substitutes can attack the same household budget or remove the need for a financed solar kit even if they do not look like a classic direct solar competitor."
    claimRefs: ["CP002", "CP005", "CP015"]
