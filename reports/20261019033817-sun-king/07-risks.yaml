      topic: legal-regulatory-record
      missingEvidence: >-
        Primary regulator, licensing, court, enforcement, recall, safety, privacy,
        cybersecurity-incident, and material-outage records for each operating country.
      whyItMatters: >-
        These records are required to distinguish an unobserved issue from a verified clean
        history and to assess whether core PAYGo or product practices face restrictions.
      diligencePath: >-
        Commission country-by-country regulator and court searches, obtain all active
        licences and regulator correspondence, and reconcile results to management's legal register.
      relatedQuestionRefs: [QR002, QR007]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: portfolio-credit-performance
      missingEvidence: >-
        Monthly vintage curves for delinquency, default, write-off, recovery, deactivation,
        reactivation, repossession, and cash collection by country and product.
      whyItMatters: >-
        PAYGo receivables and their financing structures cannot be underwritten from loan
        originations, products sold, or funding raised alone.
      diligencePath: >-
        Reconcile audited servicing tapes to the general ledger, securitisation reports,
        covenant calculations, and cash collections for at least 36 months.
      relatedQuestionRefs: [QR005, QR008, QR010]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: product-quality-and-service
      missingEvidence: >-
        Product cohort failure rates, warranty claims, recalls, safety events, repair times,
        spare-parts fill rates, warranty reserves, and supplier concentration.
      whyItMatters: >-
        A claimed ten-year battery life and rapid product expansion create obligations that
        cannot be assessed from specifications and warranty promises alone.
      diligencePath: >-
        Sample serial-number cohorts, test reserve adequacy, inspect supplier agreements,
        and review quality audits, incident logs, and service-level performance.
      relatedQuestionRefs: [QR003, QR007, QR009]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: governance-and-financing
      missingEvidence: >-
        Current cap table, shareholder rights, board composition, debt maturities, covenant
        headroom, undrawn liquidity, lender concentration, and cross-default terms.
      whyItMatters: >-
        Founder voting control and dependence on external finance can change downside
        protections, refinancing flexibility, and minority-investor influence.
      diligencePath: >-
        Review shareholder and debt agreements, board materials, treasury forecasts,
        covenant certificates, and lender-level exposure schedules.
      relatedQuestionRefs: [QR004, QR006, QR010]
      relatedTableRefs: [TR001, TR003]
