schemaVersion: "report-v2"
artifact: risks
slug: sun-king
runDate: 2026-10-19
company:
  name: Sun King
chapter:
  number: 7
  title: Risks
  summary: >-
    Sun King's principal disclosed risks arise from the interaction of long-dated PAYGo
    receivables, dependence on external financing, rapid last-mile expansion, and broad
    product-support obligations. Public evidence describes meaningful mitigations, but
    portfolio credit performance, regulatory records, incident history, and governance
    protections remain insufficiently disclosed for a lower-risk underwriting view.
sections:
  - id: risk-ranking
    title: Risk ranking and investment implication
    body: >-
      The highest residual exposure is financial-model risk. Sun King says most customers
      need financing, while PAYGo contracts can run for up to 36 months and delay capital
      recoupment; its 2025 financing report also shows how receivables are converted into
      investable assets through securitisation. That structure can fund growth and reduce
      currency mismatch when facilities are locally denominated, but it also makes credit
      performance, collections, refinancing access, and investor appetite central to the
      operating model. The next tier is execution risk: the company describes a large
      field network and an expansion plan that would multiply outlets and agents while
      broadening products. The risk heatmap therefore treats funding continuity, portfolio
      quality, and scale discipline as thesis-critical rather than assuming announced
      capital is equivalent to durable liquidity.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR007, CR008, CR009, CR010, CR014]
    figureRefs: [FR001]
  - id: legal-regulatory-governance
    title: Legal, regulatory, and governance exposure
    body: >-
      The available record describes consumer underwriting, payment reminders, temporary
      deactivation after missed payments, a sustainable-finance committee, and annual
      allocation reporting. Those controls are relevant mitigations, but they do not
      establish compliance outcomes across every lending, consumer-protection, data,
      product-safety, or licensing regime in the countries served. The financing report
      expressly says Sun King is responsible for the correctness and trustworthiness of
      its information and that the report is not a certification of financed projects.
      Separately, an investor-issued release reported that the founders retained voting
      control of the board after the Series D. The investment case therefore requires
      primary regulatory checks, debt documents, board-rights review, and legal searches;
      the absence of an adverse result in this assigned evidence pool is not evidence that
      no dispute or enforcement matter exists.
    claimRefs: [CR002, CR004, CR011, CR012, CR016]
    tableRefs: [TR001]
  - id: operational-quality
    title: Operational, quality, and scale risk
    body: >-
      Sun King's vertically integrated promise spans design, raw materials, delivery,
      installation, financing, maintenance, and warranty support. That breadth can improve
      accountability, yet it concentrates execution responsibility inside one operating
      system. Company pages cite more than 41,000 field agents and hundreds of shops, while
      a 2025 financing article described targets of roughly 90,000 agents, about 1,650
      outlets, and one million kits per month by 2030. Product obligations also extend
      across lanterns, home systems, appliances, larger inverter systems, and smartphones.
      A claimed ten-year battery life paired with a two-year product warranty highlights
      the need to test actual failure curves, spare-parts availability, service response,
      warranty reserves, agent controls, and quality consistency rather than relying on
      design-life claims alone.
    claimRefs: [CR006, CR007, CR008, CR009, CR013, CR014, CR015]
    tableRefs: [TR002]
  - id: partners-financing-kill-criteria
    title: Dependencies, mitigations, and thesis-break triggers
    body: >-
      External capital providers, local banks, development-finance institutions, placement
      agents, field agents, and distribution partners are not peripheral: they fund or
      execute core elements of the model. Local-currency facilities and diversified
      syndicates mitigate single-currency and single-lender exposure, while the sustainable
      finance register, annual committee review, warranties, and integrated servicing
      provide operating controls. Residual exposure remains high because the assigned
      public sources do not disclose delinquency, defaults, write-offs, recoveries,
      covenant headroom, country-level profitability, or partner concentration. Thesis-break
      triggers should include a material deterioration in receivables performance, loss of
      local-currency funding, repeated safety or quality failures, inability to service the
      field footprint, or a material regulatory restriction on PAYGo collection or device
      deactivation. Until those indicators are tested against private data, financing and
      execution mitigations should be rated developing rather than proven.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR010, CR012, CR013, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk area
      - Jurisdiction / scope
      - Evidence status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - PAYGo consumer-credit conduct and device deactivation
        - 12 PAYGo countries described by Sun King
        - Company describes phone underwriting, flexible instalments, reminders, and temporary deactivation without a financial penalty
        - Medium
        - High
        - Central credit team; payment flexibility; reactivation after resumed payment
        - Regulatory treatment and customer outcomes are not evidenced country by country
        - Obtain lending licences, standard contracts, complaints, regulator correspondence, and deactivation data by country
      - - Sustainable-finance allocation and impact representations
        - Kenya, Tanzania, Nigeria, and listed MSME bond facilities
        - Company reports full allocation and committee oversight; the report states that it is not a certification
        - Medium
        - High
        - Annual committee review, financing register, eligibility criteria, and framework review
        - Allocation and impact data remain management-reported; underlying assurance scope is unclear
        - Review external assurance, offering documents, asset eligibility tests, and exception logs
      - - Founder control and minority-investor protections
        - Corporate governance
        - General Atlantic reported that founders retained voting control after the Series D
        - Medium
        - Medium
        - Institutional investors and external transaction counsel participated in the financing
        - Board composition, veto rights, related-party controls, and preference terms are not public
        - Inspect cap table, shareholder agreements, board minutes, reserved matters, and conflicts policy
    notes: >-
      Partial public-evidence register as of 2026-10-19; likelihood and severity are analytical
      ratings anchored to the cited operating and financing evidence, not confirmed violations.
    enumerationScope:
      coverage: partial
      basis: >-
        Material legal, regulatory, and governance themes identifiable in the assigned
        prefetched evidence; primary regulator and court records were not present.
    claimRefs: [CR002, CR004, CR011, CR012, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitoring indicator / unresolved gap
    rows:
      - - Agent and retail expansion outpaces training, controls, and service capacity
        - High
        - High
        - Developing
        - A much larger distributed workforce increases conduct, fraud, installation, and support variability
        - Agent productivity, attrition, audit exceptions, fraud losses, first-time-fix rate
      - - Battery or system failures emerge after the two-year warranty period
        - Medium
        - High
        - Developing
        - Claimed ten-year typical-use battery life is longer than the stated product warranty
        - Cohort failure curves, warranty claims, reserve adequacy, spare-part availability
      - - Product breadth creates quality and support complexity
        - Medium
        - Medium-high
        - Developing
        - Lanterns, home systems, appliances, inverters, and smartphones add supply-chain and service surfaces
        - Supplier concentration, defect rates, recall history, firmware and data-security controls
      - - Multi-country logistics or partner execution interrupts customer service
        - Medium
        - High
        - Developing
        - Direct operations and partner markets require consistent inventory, installation, collections, and maintenance
        - Stock-outs, installation backlog, service response, partner SLA breaches, country-level downtime
    notes: >-
      Ratings combine company-reported network and product scope with third-party-reported
      expansion targets; no public defect, recall, outage, or security-incident dataset was available.
    claimRefs: [CR006, CR007, CR008, CR009, CR013, CR014, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Growth debt and sustainable-finance capacity
        - Commercial banks, DFIs, bond investors, and impact lenders
        - Financing is described as critical because most customers require credit
        - Funding costs rise or new facilities become unavailable
        - High
        - Multiple instruments, lenders, and local-currency structures
        - Covenant, maturity, refinancing, and undrawn-liquidity data are not public
      - - PAYGo receivables performance
        - Customers whose future payments support securitised assets
        - Payment plans can last up to 36 months
        - Delinquencies, defaults, or collection friction weaken cash conversion and asset funding
        - High
        - Credit assessment, reminders, temporary deactivation, diversified receivable pools
        - No public delinquency, write-off, recovery, or vintage curves in the assigned evidence
      - - Financing intermediaries and structuring partners
        - Citi, placement agents, local banks, DFIs, and framework investors
        - Several facilities depend on multi-party execution
        - A key arranger, lender, rating process, or concessional tranche is delayed or withdrawn
        - Medium-high
        - Syndicated senior and mezzanine participation across facilities
        - Replacement-capital timing and cross-default exposure are undisclosed
      - - Last-mile sales, installation, and support network
        - Field agents, shops, and distribution partners
        - Tens of thousands of agents and hundreds of outlets
        - Agent attrition, weak controls, or partner underperformance disrupts acquisition and service
        - High
        - Integrated installation, maintenance, and warranty model
        - Agent economics, partner concentration, and service-level performance are not disclosed
    notes: >-
      Concentration is qualitative because the assigned sources do not disclose lender shares,
      partner revenue shares, maturity schedules, covenant headroom, or portfolio credit metrics.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR010, CR013]
figures:
  - id: FR001
    title: Residual-risk heatmap after disclosed mitigations
    type: matrix
    summary: >-
      Financial-model and scale-execution risks remain highest because disclosed controls are
      not accompanied by public portfolio-quality, covenant, incident, or operating-cohort data.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: PAYGo credit and collections
          values: [High, High, Developing, High]
        - label: Funding and refinancing access
          values: [Medium-high, High, Developing, High]
        - label: Agent and retail scale execution
          values: [High, High, Developing, High]
        - label: Product quality and long-tail service
          values: [Medium, High, Developing, Medium-high]
        - label: Multi-country regulatory compliance
          values: [Medium, High, Unverified, Medium-high]
        - label: Founder control and governance protections
          values: [Medium, Medium-high, Unverified, Medium]
    approximationNotes: >-
      Qualitative analytical ratings as of 2026-10-19; positions are not probabilities and
      should be updated with private credit, legal, quality, and governance diligence.
    claimRefs: [CR002, CR005, CR008, CR010, CR012, CR014, CR016]
callouts:
  - calloutType: risk
    title: Kill criteria
    body: >-
      Pause or reject an investment if portfolio-vintage data show material credit deterioration,
      local-currency funding cannot be renewed on sustainable terms, regulatory review restricts
      core PAYGo collection or deactivation practices, repeated product failures exceed reserves,
      or governance documents leave minority investors without protections against controlled-board decisions.
    claimRefs: [CR001, CR002, CR003, CR006, CR010, CR011, CR016]
