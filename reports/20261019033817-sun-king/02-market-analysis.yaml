figures:
  - id: FM001
    title: Sun King penetration within the electrification gap
    type: pyramid
    summary: Broad electrification demand remains far larger than any one company can serve, but Sun King's customer base, install run-rate, and category share show it already operates at meaningful scale inside the off-grid subset.
    data:
      items:
        - label: Global population without electricity
          value: 730
          unit: mn people
          note: IEA estimate cited by FT in 2026
        - label: Africa 2030 electrification target
          value: 300
          unit: mn people
          note: World Bank and AfDB target cited by FT
        - label: Off-grid share of that target
          value: 150
          unit: mn people
          note: Approximation from the Global Solar Council's "close to half" estimate
        - label: Sun King current customer footprint
          value: 50
          unit: mn customers
          note: FT reports more than 50mn customers across sub-Saharan Africa
        - label: Current monthly installation run-rate
          value: 330
          unit: k kits per month
          note: FT reports about 330,000 monthly installs
        - label: PAYG solar revenue share
          value: 38
          unit: pct
          note: GOGLA-based figure cited by Tech Funding News and General Atlantic
    approximationNotes: >-
      The 150mn layer is a simple transformation of an FT-cited share rather than a separately published total, and the final 330k layer is a monthly flow rather than a cumulative installed base.
