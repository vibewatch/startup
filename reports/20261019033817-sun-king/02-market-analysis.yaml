      - - World Bank + AfDB target cited by FT
        - "2030 target"
        - Africa
        - 300mn people to be connected
        - Policy target
        - Public electrification target
        - Medium
        - Includes grid and off-grid pathways
      - - Global Solar Council estimate cited by FT
        - "2030 target"
        - Africa
        - Close to half of the 300mn target via off-grid solutions (~150mn people)
        - n/a
        - Off-grid share of the policy target
        - Medium
        - Approximation rather than a published SAM/SOM
    notes: >-
      This table intentionally mixes stock, policy-target, and company-footprint lenses because public sources do not provide a clean Sun King SAM/SOM; approximate values are spelled out rather than treated as precise market totals.
