callouts:
  - calloutType: insight
    title: Sun King's real market is resilience plus affordability, not "solar" in the abstract
    body: >-
      The strongest evidence frames Sun King's category as cash-flow-based distributed energy for off-grid and weak-grid users, where the substitute is kerosene, diesel, or unreliable grid power rather than a generic renewable-energy budget.
    claimRefs:
      - CM005
      - CM008
      - CM014
  - calloutType: risk
    title: A large access gap does not automatically convert into durable country-level demand
    body: >-
      Grid expansion, subsidy-program timing, and inconsistent company-reported distribution metrics all argue against treating the Africa electrification opportunity as a clean linear funnel into Sun King's revenue.
    claimRefs:
      - CM009
      - CM015
