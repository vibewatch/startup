company:
  name: Sun King
chapter:
  number: 2
  title: Market Analysis
  summary: Sun King's market is narrower than a generic "solar" TAM and is better framed as distributed energy for off-grid and weak-grid households, microbusinesses, and selected institutions that cannot rely on utility service. Independent demand lenses still show a very large access gap, but public evidence does not cleanly isolate a country-by-country SAM/SOM, and even company-controlled distribution disclosures conflict on current reach.
sections:
  - id: market-boundary-and-substitutes
    title: Market boundary and status-quo substitutes
    body: >-
      The relevant market is not all solar generation or all African electricity spend. The evidence points to a narrower category: distributed solar hardware plus financing for homes and businesses with no grid service or unreliable service, where the real comparison is against kerosene, candles, diesel generators, or expensive grid extension rather than against utility-scale renewable procurement. Sun King explicitly frames its offer around off-grid and weak-grid users, and its current product set stretches from basic lighting and phone charging to higher-capacity home and business systems. That matters because the buyer decision is anchored on resilience and cash-flow affordability, not on green branding alone. The FT's pricing evidence also shows how the category monetizes across a very wide ticket range by converting upfront capex into instalments.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM014
    tableRefs:
      - TM001
  - id: sizing-lenses-and-penetration
    title: Sizing lenses and current penetration
    body: >-
      Public market sizing is available only through imperfect lenses, but those lenses are directionally useful. FT reporting citing IEA data says 730 million people worldwide still lack electricity access and that sub-Saharan Africa accounts for 80 percent of that population, which keeps the center of gravity in Sun King's core geography. The same article cites a World Bank and African Development Bank goal to connect 300 million Africans by 2030, with the Global Solar Council estimating that close to half of those connections could come from off-grid solutions. That is a much stronger boundary than a generic multi-trillion-dollar clean-energy TAM, but it still stops short of a precise Sun King SAM/SOM. Current company footprint data indicate meaningful category penetration already, with FT reporting more than 50 million customers and about 330,000 monthly installations, while GOGLA-linked revenue-share figures suggest scaled share inside PAYG solar rather than a fringe position.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM011
      - CM012
      - CM016
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-segmentation-and-budget-ownership
    title: Buyer segmentation, budget ownership, and adoption path
    body: >-
      The buyer/user/payer path varies by use case, but it is still unusually legible for a frontier-energy company. Entry systems map to rural or peri-urban households that need lighting and phone charging and can only absorb the product through small recurring payments. Upmarket home systems and TV bundles extend the same budget logic to weak-grid households that value blackout protection, device charging, and entertainment or study use cases. Small businesses sit one step above that ladder because downtime and generator fuel costs create a clearer operating-budget ROI. Institutions such as schools and public buildings appear addressable as higher-ticket cases, but public materials still offer more anecdotal evidence than a clean procurement pipeline. The adoption path is therefore broadening from basic access into resilience and productive-use energy, even though the public record cannot yet quantify take rates by segment.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM014
    tableRefs:
      - TM003
  - id: growth-drivers-and-market-constraints
    title: Growth drivers and market constraints
    body: >-
      Three forces support adoption timing: declining solar and battery costs, the persistence of weak or outage-prone grids, and fuel-price pressure on generator-dependent households and microbusinesses. FT reporting ties Sun King's growth partly to cheaper, higher-quality panels and batteries, while both FT and product-launch coverage show the company moving toward higher-load systems that matter more in weak-grid settings. The same sources also show why investors should not treat the TAM as automatically durable. BloombergNEF warns that grid rollout can undercut PAYG solar economics in some markets, and FT notes that national off-grid sales can swing sharply when subsidy programs pause or restart. A second caution is internal inconsistency: Sun King's own about pages disagree on field-agent and country counts, which does not negate the market thesis but does reduce confidence in precise go-to-market capacity claims without diligence follow-up.
    claimRefs:
      - CM009
      - CM013
      - CM014
      - CM015
      - CM016
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment/category
      - Included spend
      - Excluded spend
      - Buyer/payer
      - Relevance
    rows:
      - - Entry off-grid household energy
        - Solar lanterns, entry home systems, PAYG financing, installation and after-sales support
        - Utility-scale power generation, rooftop solar for affluent grid-connected users
        - Household head / household cash flow
        - Core no-access market where lighting and phone charging are the starting job-to-be-done
      - - Weak-grid household backup and upgrade
        - Multi-room lighting, laptop charging, TV bundles, hybrid solar-or-grid charging
        - Full home rewiring and large AC-heavy appliance demand beyond entry systems
        - Household decision-maker / household income
        - Expands the category from access to resilience and device uptime
      - - Microbusiness productive-use energy
        - Higher-capacity systems, inverter-ready products, backup for shops and home businesses
        - Industrial solar PPAs and large commercial energy-management systems
        - Owner-operator / SME operating budget
        - Outage and diesel economics create clearer ROI than pure household convenience
      - - Institutional and public-building use cases
        - School, clinic, and public-building solar systems plus service support
        - National grid capex, utility procurement, and utility-scale mini-grid development
        - Institution administrator or sponsor / public, donor, or facility budget
        - Raises ticket size but public evidence is thinner than for household segments
      - - Status-quo substitutes
        - Kerosene, candles, diesel generators, and unreliable grid power
        - General climate spending unrelated to end-user electricity substitution
        - Existing energy budget holder
        - These substitutes define the real switching benchmark for adoption
    notes: >-
      Boundary is synthesized from company product pages, launch coverage, and FT reporting; included and excluded spend describe category edges rather than audited revenue pools.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM014
