  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Off-grid household lighting and charging
        - Household head
        - Family members
        - Same household via PAYG instalments
        - Purchase, install, then top up to keep the system active
        - Household discretionary or mobile-money budget
        - Replace kerosene or candles with affordable daily/weekly payments
      - - Weak-grid household upgrade
        - Household head
        - Family, students, home workers
        - Same household
        - Install HomePlus or TV bundle and use solar plus optional grid charging
        - Household income budget
        - Blackout protection and device reliability for phones, laptops, and TVs
      - - Microbusiness or shop owner
        - Owner-operator
        - Owner, staff, customers
        - Same business
        - Use higher-capacity systems to keep lights, fans, TVs, and small appliances running
        - SME operating budget
        - Reduce downtime and generator-fuel exposure
      - - School, clinic, or public building
        - Institution administrator or sponsor
        - Students, staff, patients, or community users
        - Facility, donor, or public sponsor
        - Procure larger systems for continuity of lighting and device charging
        - Institutional capital or program budget
        - Replace generator dependence and support continuity of service
    notes: >-
      Budget-owner and workflow fields summarize evidence from official product pages, impact stories, and launch coverage; public sources do not quantify conversion by segment or country.
