  topStrengths:
    - Large multi-country PAYG distribution and installation network.
    - Broad product ladder from lighting and charging to TV bundles and larger inverter-capable systems.
    - Repeated financing access and founder control that support continued expansion.
  topRisks:
    - Public financial disclosure remains opaque on revenue, margins, runway, and credit performance.
    - Customer economics and repayment quality remain unproven in public evidence.
    - Private-market valuation and cap-table terms remain undisclosed, limiting entry-price underwriting.
  unresolvedGaps:
    - Audited consolidated financial statements and country-level profitability remain unavailable in the public record.
    - >-
      Portfolio credit metrics such as default rates, delinquency buckets, write-offs, and recoveries are not publicly
      disclosed.
    - Detailed cap-table economics, liquidation preferences, and board control rights remain undisclosed.
    - Active customer, retention, and repeat-purchase metrics remain unclear.
