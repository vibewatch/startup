companyProfile:
  summary: >-
    Sun King is a privately held off-grid solar company founded in 2007 that combines hardware, PAYG financing,
    last-mile installation, and after-sales support to serve households, microbusinesses, and institutions in Africa and
    Asia. Public evidence points to a large distribution network and repeated late-stage financing, but disclosure
    remains uneven on headquarters, audited financials, and customer-economics quality.
