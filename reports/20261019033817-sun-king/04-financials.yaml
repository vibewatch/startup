company:
  name: Sun King
chapter:
  number: 4
  title: Financials
  summary: >-
    Sun King's public evidence supports a vertically integrated hardware-plus-finance
    model with meaningful distribution scale and repeated access to debt and equity,
    but the assigned pool still does not expose consolidated revenue, gross margin,
    credit losses, or runway. That leaves underwriting anchored to traction proxies
    and financing dependency rather than auditable earnings quality.
sections:
  - id: revenue-model
    title: Revenue model and pricing visibility
    body: >-
      The assigned public sources consistently describe Sun King as more than a solar
      hardware vendor. Official pages and partner materials show a model that combines
      product design, raw materials, last-mile delivery, installation, consumer
      financing, and warranty support under one roof, with monetization spanning
      entry-level lighting kits, solar home systems, TV bundles, appliances,
      smartphones, and larger inverter systems. That breadth matters because it
      suggests revenue quality depends on both hardware sell-through and the
      collection performance of customer receivables. What remains missing is basic
      commercial transparency: the assigned pool does not provide accessible country
      price cards, realized selling prices, discounting conventions, or product-mix
      revenue split, so public pricing evidence is mostly about payment mechanics
      rather than realized margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-operating-proxies
    title: Public traction and operating proxies
    body: >-
      Revenue disclosure is thin, so the best public read-throughs come from operating
      proxies. Official and partner sources point to a large physical sales and service
      network, high monthly household additions, and substantial customer-financing
      volume. Those signals are directionally positive because they imply repeatable
      distribution and collections infrastructure, but they do not by themselves prove
      attractive unit economics. The same evidence set also shows why Sun King's model
      is unlikely to behave like low-touch software: thousands of agents, hundreds of
      shops, installation, and warranty service all imply labor, logistics, inventory,
      and working-capital intensity that should be modeled explicitly once management
      data is available.
    claimRefs: [CI005, CI006, CI008, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-structure
    title: Capital structure and financing dependency
    body: >-
      Sun King's recent financing surfaces reinforce that growth is funded through a
      mix of equity and structured debt rather than self-disclosed free cash flow. The
      company said proceeds from its 2023 Kenya securitisation and 2024 Enterprises
      Bond were fully allocated to eligible assets, while a December 2025 secondary
      report said a new $40 million Lightrock investment was part of the financing
      required to reach Sun King's target operating scale. That combination fits the
      operating model: customer loans appear to be a core asset, so capital adequacy
      depends not just on demand for solar systems but on continued access to
      receivable funding, balance-sheet capacity, and servicing infrastructure. The
      assigned pool contains no cash balance, debt covenant, borrowing-cost, or runway
      disclosure, so capital sufficiency remains a diligence topic rather than a
      closed conclusion.
    claimRefs: [CI006, CI007, CI009, CI012, CI013]
  - id: verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial read-through is therefore mixed. Positively, Sun King appears to
      have a scaled PAYG revenue engine, a broadened product set, and repeat access to
      external financing that has funded both receivables and expansion. Negatively,
      the independent market profiles in the assigned pool still do not publish open
      revenue, profit, valuation, employee-count, or detailed operating metrics, and
      the company-controlled surfaces do not close that gap with audited statements or
      cohort economics. For underwriting, that means the business currently screens as
      commercially credible but financially opaque: margin path, realized pricing,
      default rates, working-capital turns, and runway should all be treated as
      unresolved diligence items rather than inferred from impact or volume metrics.
    claimRefs: [CI008, CI009, CI010, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality / diligence ask
    rows:
      - [Solar home systems and lanterns, "Product sale plus PAYG-financed ownership transfer", "system / kit", "Core category confirmed on official product surfaces", "Need SKU-level revenue mix, realized ASP, and gross margin by family"]
      - ["TV, fan, and appliance bundles", "Higher-ticket hardware bundles financed through the same distribution rails", "bundle / appliance", "Product bundles are visible but accessible list pricing is not", "Need attach rate, warranty cost, and bundle margin by country"]
      - [Inverter and backup-power systems, "Larger AC-capable systems sold with installation and service", "system installation", "Official pages confirm the category and target use cases", "Need contract values, installer economics, and service gross margin"]
      - [Smartphones and adjacent financed devices, "Cross-sell on existing customer-finance rails", "financed device", "Partner and company sources describe the expansion", "Need take rate, repayment performance, and contribution margin"]
    notes: "Public evidence confirms categories and financing mechanics, but list prices, realized selling prices, and revenue mix are not disclosed in the assigned pool."
    claimRefs: [CI001, CI004, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / term
      - Publicly visible monetization cue
      - List vs realized pricing
      - Source status
      - Implication
    rows:
      - ["PAYG entry terms", "Customers typically pay a nominal deposit and then daily, weekly, or monthly instalments", "Realized pricing undisclosed", "Described across official and partner sources", "Financing convenience appears central to conversion"]
      - ["Pulse2 affordability proxy", "$0.15-$0.20 per day over 12-24 months", "Media-reported company proxy, not audited realized pricing", "One secondary source", "Useful affordability datapoint, but not proof of gross margin"]
      - ["Solar home systems and TV bundles", "Product categories and bundles are visible on public pages", "Accessible list prices unavailable in assigned pool", "Official product evidence only", "Need country price sheets and discount policy"]
      - ["Inverter / business systems", "Capability and use cases are public, but prices are not", "List and realized pricing unavailable", "Official pages only", "Need sample contracts, deposits, and service-fee structure"]
    notes: "Null or unavailable pricing means the source did not expose a usable public price point in the assigned worker pool, not that the product is free."
    claimRefs: [CI002, CI003, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Consolidated revenue", "Not publicly disclosed in assigned pool", Low, "Needed to size scale and assess earnings quality", "Latest audited revenue by geography, product family, and financing channel"]
      - ["Gross margin", "Not publicly disclosed", Low, "Tests profitability after hardware, logistics, installation, and warranty costs", "Gross margin bridge by product family and market"]
      - ["CAC / sales payback", "Not publicly disclosed", Low, "A 41,000+ agent model could be powerful but distribution-intensive", "Agent productivity, sales CAC, and cohort payback by channel"]
      - ["Credit performance", "Not publicly disclosed", Low, "PAYG receivables determine true margin and cash conversion", "PAR buckets, write-offs, recoveries, and vintage curves"]
      - ["Customer financing deployed", "$950M solar loans extended; later public sources cite $1.4B financing across Africa", Medium, "Shows receivable scale but not credit quality", "Reconcile current financed portfolio, funding cost, and advance rates"]
      - ["Expansion capital needs", "2023/2024 sustainable debt issuance plus a $40M 2025 equity round", Medium, "Shows growth still depends on external capital", "Cash balance, runway, debt covenants, and next-round trigger"]
    notes: "Low confidence rows are missing because the assigned public evidence does not disclose them; they are explicit diligence asks, not zero values."
    claimRefs: [CI005, CI006, CI007, CI009, CI010, CI012, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "Public evidence supports a financing-led operating loop rather than a one-time hardware sale."
    data:
      nodes:
        - id: demand
          label: Off-grid or weak-grid demand
          note: "Official pages position the offer around lighting, phone charging, TV, fan, and backup-power needs."
        - id: deposit
          label: Small deposit to onboard
          note: "LeapFrog says customers typically pay a nominal deposit before beginning PAYG repayment."
        - id: installments
          label: Daily / weekly / monthly installments
          note: "Assigned sources describe instalments; Pulse2 reports a 12-24 month tenor and about $0.15-$0.20 per day."
        - id: service
          label: Installation and warranty support
          note: "Sun King handles delivery, installation, and support, and product pages cite a two-year warranty."
        - id: upsell
          label: Upsell into larger systems and devices
          note: "Public surfaces show expansion into TVs, appliances, smartphones, and inverter systems."
        - id: recycle
          label: Capital recycled into inventory and receivables
          note: "Growth is supported by customer-finance deployment, sustainable debt issuance, and new equity."
      edges:
        - from: demand
          to: deposit
        - from: deposit
          to: installments
        - from: installments
          to: service
        - from: service
          to: upsell
        - from: upsell
          to: recycle
    approximationNotes: "This is a qualitative operating bridge; it shows monetization flow and capital touchpoints, not audited conversion rates."
    claimRefs: [CI002, CI003, CI004, CI007, CI011, CI013]
callouts:
  - calloutType: risk
    title: Capital intensity is clearer than earnings quality
    body: >-
      The assigned evidence shows real scale and repeated financing access, but it
      does not disclose the revenue, margin, default, or runway metrics needed to
      underwrite whether that scale converts into durable free-cash-flow economics.
    claimRefs: [CI007, CI009, CI010, CI013]
  - calloutType: insight
    title: PAYG is both the conversion lever and the underwriting risk
    body: >-
      Sun King's public value proposition relies on lowering upfront cost through
      instalments, which likely expands demand and average ticket size but also means
      receivable performance is central to margin quality and capital needs.
    claimRefs: [CI002, CI003, CI006, CI013]
