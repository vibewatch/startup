  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Operating scale preserves interest, but missing price and downside terms prevent a buy recommendation.
    data:
      nodes:
        - id: capital-access
          label: Capital access
          detail: Large historical Series D, 2025 equity, and a September 2026 financing signal.
        - id: operating-scale
          label: Operating scale
          detail: Integrated distribution and company-reported customer-financing reach.
        - id: execution-target
          label: Execution target
          detail: Company aims to grow monthly kit volume toward one million by 2030.
        - id: adverse-context
          label: Adverse context
          detail: Broad third-party competitor ranking is modest and is not a valuation benchmark.
        - id: evidence-gap
          label: Price and credit gap
          detail: No usable current valuation, preference stack, or portfolio-loss evidence.
        - id: decision
          label: Track / research more
          detail: Invest only after private diligence supports price, downside protection, and exit returns.
    approximationNotes: >-
      Qualitative decision chain only; node order does not represent probability, magnitude, or a numeric valuation
      bridge.
