    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and operating model
        blocks:
          - type: paragraph
            body: >-
              Retained official and independent sources consistently describe Sun King as an off-grid solar company
              serving households and small businesses in weak-grid or off-grid markets across Africa and Asia. The
              current official homepage says the company installs and finances solar power for the 1.8 billion people
              who live off the reliable grid, while the Nigeria product page shows the offering spans solar home
              systems, appliances, and larger AC-capable systems rather than a single lantern SKU. The June 2026 General
              Atlantic announcement and a matching Tech Funding News report both say the business was founded in 2007 as
              Greenlight Planet and rebranded as Sun King, giving later chapters a usable identity baseline even though
              the precise legal-entity footprint and corporate domicile remain only partly corroborated in the assigned
              evidence.
