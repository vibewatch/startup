      - number: '5.3'
        title: Maturity, differentiation, and product-tech risk
        blocks:
          - type: paragraph
            body: >-
              Sun King's differentiation is the combination of hardware depth and a field-financing machine that can
              carry products into off-grid and weak-grid contexts at scale. Independent and partner sources both
              describe Sun King as coupling solar hardware with pay-as-you-go finance and direct distribution, while
              third-party product documentation shows at least some historical quality verification around battery
              durability, ingress protection, workmanship, and minimum warranty terms. The roadmap signal is also
              concrete: General Atlantic said Series D proceeds would expand the product line into larger
              inverter-equipped systems and adjacent devices. The remaining product-tech risk is disclosure asymmetry.
              Public evidence is much stronger on hardware features and channel reach than on software architecture,
              privacy and security controls around PAYG/customer data, service-level reliability metrics, or
              developer/practitioner adoption signals, so those areas remain diligence asks rather than underwritten
              strengths.
            claimRefs:
              - CE008
              - CE009
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix is broad, but buyer economics are still lightly disclosed
        blocks:
          - type: paragraph
            body: >-
              The retained pool consistently describes Sun King as serving people without reliable grid access, but the
              practical customer mix is broader than a single retail household segment. Official product and about pages
              show a ladder from basic lighting and phone charging kits to TV bundles, fans, and larger inverter-style
              systems for homes and businesses, while external profiles add education and health-care facilities as
              visible use cases. That breadth matters because it suggests Sun King can monetize multiple budgets and use
              cases through the same PAYG and field-service infrastructure. What the public evidence does not disclose
              is which segments contribute the most revenue, margins, or repayment quality, so the segment map is
              operationally credible but still financially under-specified.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU010
              - CU011
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
