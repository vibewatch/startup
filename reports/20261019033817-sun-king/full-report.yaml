      - number: '2.3'
        title: Buyer segmentation, budget ownership, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer/user/payer path varies by use case, but it is still unusually legible for a frontier-energy
              company. Entry systems map to rural or peri-urban households that need lighting and phone charging and can
              only absorb the product through small recurring payments. Upmarket home systems and TV bundles extend the
              same budget logic to weak-grid households that value blackout protection, device charging, and
              entertainment or study use cases. Small businesses sit one step above that ladder because downtime and
              generator fuel costs create a clearer operating-budget ROI. Institutions such as schools and public
              buildings appear addressable as higher-ticket cases, but public materials still offer more anecdotal
              evidence than a clean procurement pipeline. The adoption path is therefore broadening from basic access
              into resilience and productive-use energy, even though the public record cannot yet quantify take rates by
              segment.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.4'
        title: Growth drivers and market constraints
        blocks:
          - type: paragraph
            body: >-
              Three forces support adoption timing: declining solar and battery costs, the persistence of weak or
              outage-prone grids, and fuel-price pressure on generator-dependent households and microbusinesses. FT
              reporting ties Sun King's growth partly to cheaper, higher-quality panels and batteries, while both FT and
              product-launch coverage show the company moving toward higher-load systems that matter more in weak-grid
              settings. The same sources also show why investors should not treat the TAM as automatically durable.
              BloombergNEF warns that grid rollout can undercut PAYG solar economics in some markets, and FT notes that
              national off-grid sales can swing sharply when subsidy programs pause or restart. A second caution is
              internal inconsistency: Sun King's own about pages disagree on field-agent and country counts, which does
              not negate the market thesis but does reduce confidence in precise go-to-market capacity claims without
              diligence follow-up.
            claimRefs:
              - CM009
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sun King's real market is resilience plus affordability, not "solar" in the abstract
            body: >-
              The strongest evidence frames Sun King's category as cash-flow-based distributed energy for off-grid and
              weak-grid users, where the substitute is kerosene, diesel, or unreliable grid power rather than a generic
              renewable-energy budget.
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM014
          - type: callout
            title: A large access gap does not automatically convert into durable country-level demand
            body: >-
              Grid expansion, subsidy-program timing, and inconsistent company-reported distribution metrics all argue
              against treating the Africa electrification opportunity as a clean linear funnel into Sun King's revenue.
            calloutType: risk
            claimRefs:
              - CM009
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape spans direct PAYGO peers and several substitute classes
        blocks:
          - type: paragraph
            body: >
              The retained third-party evidence does not support a narrow "other solar brands only" view of competition.
              Teardown frames Sun King's direct peer set as d.light, M-KOPA, ENGIE Energy Access, Bboxx, and Zola
              Electric, then adds mini-grids, grid extension, and distribution-first operators as meaningful substitute
              or channel threats. That matters because Sun King no longer sells only entry-level lanterns: its own
              current product pages show a ladder from basic lighting and charging through TV bundles and larger
              systems, so the company now overlaps both classic off-grid peers and higher-load, weak-grid backup use
              cases. In practice, this means Sun King competes on at least three fronts at once: direct PAYGO solar
              brands, consumer-finance adjacencies that can capture the same household wallet, and electrification
              substitutes that remove the need for a bundled solar kit altogether.
