        title: Funding history, scale claims, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence confirms a substantial late-stage capital base but not one clean latest total.
              General Atlantic announced a $260 million Series D in June 2026, while Sun King's own December 2022
              release said an additional $70 million brought that Series D to $330 million and was used partly for
