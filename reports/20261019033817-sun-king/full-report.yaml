  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Sun King delivers in the customer workflow
        blocks:
          - type: paragraph
            body: >-
              Sun King is not just selling a panel-and-battery kit. Its current solar home systems are positioned for
              homes and small businesses with no or weak grid access, and the customer job is explicit: replace kerosene
              or unreliable mains for lighting, phone charging, and a limited set of compatible appliances such as TVs,
              radios, and fans. The current lineup centers on the HomePlus family, with the HomePlus Max extending from
              basic multi-room lighting into laptop charging, TV/fan/radio support, a motion security light, and dual
              solar/grid battery charging. Sun King also keeps the commercial workflow flexible: the same products can
              be bought outright, or financed through EasyBuy in small installments across online, shop, and field-agent
              channels, which means the financing rail is part of the delivered product rather than a separate
              afterthought.
