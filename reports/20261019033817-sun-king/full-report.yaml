        title: Public traction and operating proxies
        blocks:
          - type: paragraph
            body: >-
              Revenue disclosure is thin, so the best public read-throughs come from operating proxies. Official and
              partner sources point to a large physical sales and service network, high monthly household additions, and
              substantial customer-financing volume. Those signals are directionally positive because they imply
              repeatable distribution and collections infrastructure, but they do not by themselves prove attractive
              unit economics. The same evidence set also shows why Sun King's model is unlikely to behave like low-touch
              software: thousands of agents, hundreds of shops, installation, and warranty service all imply labor,
              logistics, inventory, and working-capital intensity that should be modeled explicitly once management data
              is available.
