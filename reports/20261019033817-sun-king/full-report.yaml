      - number: '3.2'
        title: Capability breadth is a strength, but pricing evidence is asymmetric
        blocks:
          - type: paragraph
            body: >
              Sun King's official pages and corroborating independent coverage show a broader package than a single-SKU
              solar seller. The company currently markets basic lighting and phone-charging kits, TV bundles, larger
              home systems, and other appliances, while Fortune still describes the business as spanning solar lanterns,
              home systems, and multi-kilowatt systems for off-grid and weak-grid customers. That breadth supports the
              positioning claim that Sun King can follow households up the energy ladder. The evidence is weaker on
              like-for-like rival packaging and consumer prices, because this worker's assigned pool contains detailed
              Sun King pricing and financing examples but not equivalent 2026 public price sheets for d.light, M-KOPA,
              ENGIE Energy Access, Bboxx, or Zola. The chapter can therefore compare solution classes and contract
