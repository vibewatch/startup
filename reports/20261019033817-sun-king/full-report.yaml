  - id: FM001
    title: Sun King penetration within the electrification gap
    type: pyramid
    summary: >-
      Broad electrification demand remains far larger than any one company can serve, but Sun King's customer base,
      install run-rate, and category share show it already operates at meaningful scale inside the off-grid subset.
    data:
      items:
        - label: Global population without electricity
          value: 730
          unit: mn people
          note: IEA estimate cited by FT in 2026
        - label: Africa 2030 electrification target
          value: 300
          unit: mn people
          note: World Bank and AfDB target cited by FT
        - label: Off-grid share of that target
          value: 150
          unit: mn people
          note: Approximation from the Global Solar Council's "close to half" estimate
        - label: Sun King current customer footprint
          value: 50
          unit: mn customers
          note: FT reports more than 50mn customers across sub-Saharan Africa
        - label: Current monthly installation run-rate
          value: 330
          unit: k kits per month
          note: FT reports about 330,000 monthly installs
        - label: PAYG solar revenue share
          value: 38
          unit: pct
          note: GOGLA-based figure cited by Tech Funding News and General Atlantic
    approximationNotes: >-
      The 150mn layer is a simple transformation of an FT-cited share rather than a separately published total, and the
      final 330k layer is a monthly flow rather than a cumulative installed base.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM011
      - CM012
      - CM016
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning suggests Sun King's strongest direct defense is against hardware peers, while wallet-share
      adjacencies and substitutes attack from different angles.
    data:
      xAxis:
        label: Ability to match Sun King's distribution + financing stack
        min: 1
        max: 5
        low: Low
        high: High
        description: Ordinal synthesis from retained evidence, not a measured market-share scale.
        scale: ordinal
      yAxis:
        label: Ability to displace current Sun King demand
        min: 1
        max: 5
        low: Low
        high: High
        description: Higher scores indicate a more credible route to capturing the same buyer spend or removing the need for a kit.
        scale: ordinal
      points:
        - label: Sun King
          x: 5
          'y': 3
          tone: positive
          note: 'Benchmark point: integrated field distribution, servicing, and receivables financing.'
        - label: d.light
          x: 4
          'y': 4
          tone: warning
          note: Closest direct PAYGO peer with its own securitisation programme and matching product depth.
        - label: M-KOPA
          x: 4
          'y': 5
          tone: risk
          note: High wallet-share threat because smartphone financing competes for the same household repayment capacity.
        - label: ENGIE Energy Access
          x: 3
          'y': 3
          tone: warning
          note: Utility-backed balance sheet and mini-grid exposure, but retained evidence describes slower PAYGO execution.
        - label: Bboxx / Zola
          x: 3
          'y': 3
          tone: warning
          note: >-
            Meaningful upmarket and partnership pressure, but weaker retained evidence on equivalent field-scale
            execution.
        - label: Mini-grid / public grid
          x: 2
          'y': 4
          tone: risk
          note: Substitute threat rises where density or grid reliability improves enough to remove the home-kit need.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a financing-led operating loop rather than a one-time hardware sale.
    data:
      nodes:
        - id: demand
          label: Off-grid or weak-grid demand
          note: Official pages position the offer around lighting, phone charging, TV, fan, and backup-power needs.
        - id: deposit
          label: Small deposit to onboard
          note: LeapFrog says customers typically pay a nominal deposit before beginning PAYG repayment.
        - id: installments
          label: Daily / weekly / monthly installments
          note: Assigned sources describe instalments; Pulse2 reports a 12-24 month tenor and about $0.15-$0.20 per day.
        - id: service
          label: Installation and warranty support
          note: Sun King handles delivery, installation, and support, and product pages cite a two-year warranty.
        - id: upsell
          label: Upsell into larger systems and devices
          note: Public surfaces show expansion into TVs, appliances, smartphones, and inverter systems.
        - id: recycle
          label: Capital recycled into inventory and receivables
          note: Growth is supported by customer-finance deployment, sustainable debt issuance, and new equity.
      edges:
        - from: demand
          to: deposit
        - from: deposit
          to: installments
        - from: installments
          to: service
        - from: service
          to: upsell
        - from: upsell
          to: recycle
    approximationNotes: >-
      This is a qualitative operating bridge; it shows monetization flow and capital touchpoints, not audited conversion
      rates.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI007
      - CI011
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Sun King's public product architecture stacks customer energy jobs on top of device hardware, embedded
      controls/PAYG, and a field-service network.
    data:
      layers:
        - label: Customer energy jobs
          detail: >-
            Homes and small businesses without reliable grid access need lighting, charging, and limited appliance
            power.
          outputs:
            - Multi-room lighting
            - Phone charging
            - TV/radio/fan support on larger systems
        - label: Device hardware
          detail: The product family spans entry-level and larger solar home systems rather than a single box.
          items:
            - HomePlus: 7 Wp panel; 19.2 Wh LFP battery; 3 lamps / 480 lumens
            - Home 60: 6 W panel; 6000 mAh battery; 3 fixed LED lamps
            - HomePlus Max: laptop charging; security light; solar plus grid charging
          outputs:
            - Roof-mountable panel
            - Linked wall-switched lights
            - Optional TV bundles
        - label: Embedded power controls
          detail: >-
            Energy harvesting and low-battery behavior are designed into the control unit rather than left to user
            workarounds.
          modules:
            - MPPT charge controller
            - Low-battery dimming and paused charging
            - Wall-switch lighting control
            - Remote diagnostics on Home 60
        - label: Payment and affordability rail
          detail: Customer acquisition depends on embedded installment purchasing rather than cash-upfront hardware sales.
          modules:
            - EasyBuy PAYG installments
            - One-off purchase option
            - In-device payment enablement
        - label: Distribution and installation network
          detail: Sun King owns the channel and install loop instead of relying on a thin reseller layer.
          modules:
            - 41,000+ field agents
            - 440+ shops in 15 countries
            - Online, shop, and agent sales
            - Last-mile installation
        - label: Support and roadmap extension
          detail: Warranty-backed service and adjacent product expansion extend the system beyond the first sale.
          modules:
            - Long-term warranty support
            - Larger inverter-based systems on roadmap
    claimRefs:
      - CE002
      - CE006
      - CE009
      - CE010
      - CE012
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Sun King's customer motion centers on affordability, field installation, real usage proof, and later expansion,
      while retention visibility stays weak.
    data:
      items:
        - label: Need discovery in off-grid or weak-grid settings
          stage: Entry point
          actor: Households and businesses without reliable electrical grid access
          touchpoints:
            - Core demand is affordable, reliable electricity where the grid is absent or unstable.
            - The addressable base includes homes, small businesses, and some institutions.
        - label: Affordability unlock through PAYG
          stage: Purchase
          actor: Household or business payer
          touchpoints:
            - Customers can pay in small instalments rather than years of energy upfront.
            - PAYG lowers the barrier to moving from candles, kerosene, generators, or weak-grid power.
        - label: Field-agent sale, install, and service
          stage: Fulfillment
          actor: Sun King field agents and shops
          touchpoints:
            - Official pages describe 440+ shops and more than 40,000 field agents.
            - Installation, financing, warranty support, and maintenance are part of the same operating surface.
        - label: Usage expands from basic power to productive loads
          stage: Usage
          actor: Households, microbusinesses, and institutions
          touchpoints:
            - Entry products cover lighting and phone charging.
            - Higher tiers add TVs, fans, and inverter-backed systems for homes and businesses.
        - label: Public proof comes from named stories and programs
          stage: Referenceability
          actor: Named users and institutional deployments
          touchpoints:
            - >-
              Public proof includes the Dickson family, Prince Adeyemi, the Zambia Institute of Agriculture, and Malawi
              school programs.
            - Most named proof is company-curated rather than independently audited.
        - label: Expansion upside is visible before retention proof
          stage: Expansion
          actor: New geographies and adjacent product lines
          touchpoints:
            - 2026 third-party sources update population served and planned geographic expansion.
            - Public sources still do not disclose NRR, churn, delinquency, or top-customer concentration.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU010
      - CU013
      - CU016
