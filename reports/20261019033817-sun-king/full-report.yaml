          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU010
              - CU013
              - CU016
      - number: '6.2'
        title: Adoption proof is strong on reach and named deployments
        blocks:
          - type: paragraph
            body: >-
              Sun King's customer proof is strongest where the sources speak to visible scale and concrete deployments.
              MIT Technology Review reported more than 40 million people in 2024, while Dealroom's profile, retrieved in
              October 2026 but not publication-dated, states that Sun King has powered more than 82 million people.
              General Atlantic's undated release page reports an acquisition cadence of 150,000 new clients per month
              across seven countries at the time of that release; it is partner-hosted rather than an independent
              current benchmark. Official customer-proof pages are better than logo walls: they show named users
              including the Dickson family and broadcaster Prince Adeyemi, plus institutional examples in Zambia and
              Malawi. These examples support real use, but remain company-curated and do not independently establish
              retention.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
              - CU013
      - number: '6.3'
        title: Durability and concentration remain the key diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The weak point in this chapter is not whether Sun King can win customers; it is whether public evidence
              proves those customers stay, repay, expand, and diversify revenue in a durable way. Official pages offer
              useful operating proxies such as a two-year warranty, a claimed 10-year battery lifespan, and large
              field-service coverage, but those are not substitutes for NRR, GRR, churn, loan delinquency, renewal, or
              repeat-purchase cohorts. The same pattern appears in third-party profiles: they update served-population
              milestones and geographic expansion plans, but they do not quantify top-customer exposure, partner
              concentration, or repayment quality. MIT Technology Review also adds a meaningful adverse note that
              clean-cooking adoption still depends on household habits, incomes, and cultural practices, which limits
              how far product-line expansion can be treated as proven retention upside.
            claimRefs:
              - CU012
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is financial-model risk. Sun King says most customers need financing, while
              PAYGo contracts can run for up to 36 months and delay capital recoupment; its 2025 financing report also
              shows how receivables are converted into investable assets through securitisation. That structure can fund
              growth and reduce currency mismatch when facilities are locally denominated, but it also makes credit
              performance, collections, refinancing access, and investor appetite central to the operating model. The
              next tier is execution risk: the company describes a large field network and an expansion plan that would
              multiply outlets and agents while broadening products. The risk heatmap therefore treats funding
              continuity, portfolio quality, and scale discipline as thesis-critical rather than assuming announced
              capital is equivalent to durable liquidity.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR010
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The available record describes consumer underwriting, payment reminders, temporary deactivation after
              missed payments, a sustainable-finance committee, and annual allocation reporting. Those controls are
              relevant mitigations, but they do not establish compliance outcomes across every lending,
              consumer-protection, data, product-safety, or licensing regime in the countries served. The financing
              report expressly says Sun King is responsible for the correctness and trustworthiness of its information
              and that the report is not a certification of financed projects. Separately, an investor-issued release
              reported that the founders retained voting control of the board after the Series D. The investment case
              therefore requires primary regulatory checks, debt documents, board-rights review, and legal searches; the
              absence of an adverse result in this assigned evidence pool is not evidence that no dispute or enforcement
              matter exists.
            claimRefs:
              - CR002
              - CR004
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR004
              - CR011
              - CR012
              - CR016
      - number: '7.3'
        title: Operational, quality, and scale risk
        blocks:
          - type: paragraph
            body: >-
              Sun King's vertically integrated promise spans design, raw materials, delivery, installation, financing,
              maintenance, and warranty support. That breadth can improve accountability, yet it concentrates execution
              responsibility inside one operating system. Company pages cite more than 41,000 field agents and hundreds
              of shops, while a 2025 financing article described targets of roughly 90,000 agents, about 1,650 outlets,
              and one million kits per month by 2030. Product obligations also extend across lanterns, home systems,
              appliances, larger inverter systems, and smartphones. A claimed ten-year battery life paired with a
              two-year product warranty highlights the need to test actual failure curves, spare-parts availability,
              service response, warranty reserves, agent controls, and quality consistency rather than relying on
              design-life claims alone.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              External capital providers, local banks, development-finance institutions, placement agents, field agents,
              and distribution partners are not peripheral: they fund or execute core elements of the model.
              Local-currency facilities and diversified syndicates mitigate single-currency and single-lender exposure,
              while the sustainable finance register, annual committee review, warranties, and integrated servicing
              provide operating controls. Residual exposure remains high because the assigned public sources do not
              disclose delinquency, defaults, write-offs, recoveries, covenant headroom, country-level profitability, or
              partner concentration. Thesis-break triggers should include a material deterioration in receivables
              performance, loss of local-currency funding, repeated safety or quality failures, inability to service the
              field footprint, or a material regulatory restriction on PAYGo collection or device deactivation. Until
              those indicators are tested against private data, financing and execution mitigations should be rated
              developing rather than proven.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria
            body: >-
              Pause or reject an investment if portfolio-vintage data show material credit deterioration, local-currency
              funding cannot be renewed on sustainable terms, regulatory review restricts core PAYGo collection or
              deactivation practices, repeated product failures exceed reserves, or governance documents leave minority
              investors without protections against controlled-board decisions.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR010
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track and research more, not buy. Sun King has repeatedly attracted equity and debt
              capital, including a company-announced $40 million equity investment in December 2025, and two independent
              market-data pages show another financing event in September 2026. Those pages do not expose a usable round
              amount or valuation, however, so they establish financing activity rather than an investable price.
              Tracxn's 54/100 score and nineteenth-place ranking in its broad active-competitor set provide an adverse
              signal, but not a valuation benchmark. Without current share-class economics, liquidation preferences,
              audited earnings, or portfolio-loss data, a numeric entry range would be false precision. Any investment
              decision should therefore remain conditional on private documents and a return case built from actual
              terms rather than funding headlines.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Financing and control context
        blocks:
          - type: paragraph
            body: >-
              The historical capital base is substantial but not fully reconcilable from public evidence. TechCrunch
              reported a $260 million Series D in April 2022, while a university-hosted, company-originated announcement
              specified that $100 million was primary capital and that the founders retained board voting control at
              that time. Sun King's own December 2025 release added $40 million of equity for product and distribution
              expansion. Tracxn now reports $552 million raised across nineteen rounds, but the assigned sources do not
              provide a complete split among equity, corporate financing, project finance, and debt. The evidence
              therefore supports confidence in access to capital, not confidence in current capitalization, dilution,
              preference overhang, or the value attributable to common equity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.3'
        title: Thesis, anti-thesis, and scenarios
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Sun King combines product design, installation, service, last-mile distribution, and
              consumer credit in one platform. Company materials report $1.4 billion of customer financing, growth from
              10,000 kits per month in 2017 to more than 330,000, and a target of one million kits per month by
              2030.       EquityZen independently describes the integrated design, distribution, installation, and
              financing model, while independent coverage citing GOGLA reports meaningful PAYG-solar revenue share. The
              anti-thesis is that the key current operating indicators remain company-issued and cannot be converted
              into equity value without audited margins, cash generation, credit-loss vintages, and round terms. The
              bull case requires independent proof that scale produces durable economics; the base case preserves
              momentum but applies strict price discipline; the bear case begins when capital needs or credit losses
              outrun operating returns.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Public exit readiness is not demonstrated. Caplight identifies private financing history but withholds
              underlying filing coverage from the public page, and neither assigned market-data source provides a
              current secondary price, comparable transaction value, or credible path from enterprise value to
              common-equity proceeds. The decisive diligence package is therefore the latest capitalization table,
              signed financing documents, liquidation waterfall, investor-rights schedule, audited consolidated
              accounts, country profitability, and static-vintage PAYG credit data. A clean preference stack, controlled
              losses, and repeatable cash generation at a price that meets the target return could improve the
              recommendation. Heavy senior claims, weak collections, or a valuation step-up unsupported by audited
              economics are thesis-break triggers and should move the decision from track to pass.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Sun King's scale earns continued diligence, but no buy case is supportable until current price, security
              terms, and common-equity return mechanics are available.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV016
          - type: callout
            title: Thesis-break test
            body: >-
              Pass if audited credit losses, country economics, or the liquidation stack prevent operating growth from
              converting into acceptable common-equity returns.
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
