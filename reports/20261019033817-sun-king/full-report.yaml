      - number: '5.2'
        title: Hardware, controls, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The retained technical evidence points to a layered operating model rather than a single-device SKU. On
              hardware, the HomePlus range combines a roof-mountable panel, battery-backed control unit, and linked
              lamps, while the legacy Home 60 listing shows Sun King also supporting a simpler PAYG system with fixed
              LED lamps, USB/AC outputs, and remote diagnostics. On controls, the product surfaces emphasize intelligent
              battery management, low-battery dimming, MPPT charging, and PAYG enablement, showing that energy
              management and payment collection are embedded in the electronics. Operationally, Sun King claims
              end-to-end ownership across product design, raw materials, last-mile delivery, installation, financing,
              and warranty support; that bundle is reinforced by field distribution at national-shop scale rather than
              by a pure reseller model.
