        title: Refresh-specific gaps and contradictions
        blocks:
          - type: paragraph
            body: >-
              The chapter is usable as a ground-truth starting point for later work, but several identity fields should
              be treated as provisional. Fortune lists Chicago as headquarters, while Tracxn says Nairobi; neither claim
