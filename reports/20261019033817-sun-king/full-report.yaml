      - number: '4.3'
        title: Capital structure and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Sun King's recent financing surfaces reinforce that growth is funded through a mix of equity and
              structured debt rather than self-disclosed free cash flow. The company said proceeds from its 2023 Kenya
              securitisation and 2024 Enterprises Bond were fully allocated to eligible assets, while a December 2025
              secondary report said a new $40 million Lightrock investment was part of the financing required to reach
              Sun King's target operating scale. That combination fits the operating model: customer loans appear to be
              a core asset, so capital adequacy depends not just on demand for solar systems but on continued access to
              receivable funding, balance-sheet capacity, and servicing infrastructure. The assigned pool contains no
              cash balance, debt covenant, borrowing-cost, or runway disclosure, so capital sufficiency remains a
              diligence topic rather than a closed conclusion.
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial read-through is therefore mixed. Positively, Sun King appears to have a scaled PAYG revenue
              engine, a broadened product set, and repeat access to external financing that has funded both receivables
              and expansion. Negatively, the independent market profiles in the assigned pool still do not publish open
              revenue, profit, valuation, employee-count, or detailed operating metrics, and the company-controlled
              surfaces do not close that gap with audited statements or cohort economics. For underwriting, that means
              the business currently screens as commercially credible but financially opaque: margin path, realized
              pricing, default rates, working-capital turns, and runway should all be treated as unresolved diligence
              items rather than inferred from impact or volume metrics.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital intensity is clearer than earnings quality
            body: >-
              The assigned evidence shows real scale and repeated financing access, but it does not disclose the
              revenue, margin, default, or runway metrics needed to underwrite whether that scale converts into durable
              free-cash-flow economics.
            calloutType: risk
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI013
          - type: callout
            title: PAYG is both the conversion lever and the underwriting risk
            body: >-
              Sun King's public value proposition relies on lowering upfront cost through instalments, which likely
              expands demand and average ticket size but also means receivable performance is central to margin quality
              and capital needs.
            calloutType: insight
            claimRefs:
