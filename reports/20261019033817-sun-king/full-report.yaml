      - number: '3.3'
        title: Distribution plus financing is the main moat
        blocks:
          - type: paragraph
            body: >
              Sun King's strongest competitive defense is the combination of owned distribution, servicing, and
              financing infrastructure. Its official pages describe 41,000-plus to 45,000-plus field agents, 440 shops,
              installation and maintenance, and PAYG financing under one brand. Teardown then ties that operating layer
              to mobile-money collection, credit scoring, and securitisation, while British International Investment
              says its Sun King financing vehicle was created specifically to purchase PAYGO receivables originated by
              Sun King Kenya. Together, those sources support the view that Sun King's advantage is not just hardware
              branding; it is a capital-backed servicing system that is hard for a new entrant to reproduce quickly.
              That also explains why direct hardware imitation looks less dangerous than consumer-finance or
              distribution attacks that try to unbundle credit, appliances, or last-mile labor from the kit itself.
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: Durability is real, but weakest where the customer no longer needs a full bundle
        blocks:
          - type: paragraph
            body: >
              The same evidence also limits how far the moat should be stretched. Teardown's competitive analysis
              highlights M-KOPA's smartphone-finance pivot, d.light's securitisation program, and mini-grid or grid
              substitutes as credible paths around Sun King's traditional solar-home-system wedge. The most concrete
              public consumer-pricing signal is adverse: Teardown reports a Nigerian 50W PAYGO plan totaling 94% above
              cash price, implying that affordability at checkout can become expensive lifetime ownership in the very
              segments Sun King is trying to serve. Techparley's 2025 funding report reinforces that management is
              pushing product expansion, scale, and higher capacity rather than narrowing back to low-end lighting. The
              competitive takeaway is that Sun King still looks hardest to attack in first-time energy access sold
              through its own field network, but more contestable in already-electrified, peri-urban, or appliance-led
              categories where the buyer may value financing or backup power more than a full Sun King bundle.
            claimRefs:
              - CP002
              - CP005
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Moat lives in the bundle, not just the box
            body: >-
              The strongest retained evidence points to Sun King's field-sales, servicing, and receivables-financing
              bundle as the true barrier to entry; that is harder to copy quickly than a solar-home-system bill of
              materials.
            calloutType: insight
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
          - type: callout
            title: Adjacencies may matter more than copycat solar brands
            body: >-
              M-KOPA-style device finance, appliance-led financing, and electrification substitutes can attack the same
              household budget or remove the need for a financed solar kit even if they do not look like a classic
              direct solar competitor.
            calloutType: risk
            claimRefs:
              - CP002
              - CP005
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing visibility
        blocks:
          - type: paragraph
            body: >-
              The assigned public sources consistently describe Sun King as more than a solar hardware vendor. Official
              pages and partner materials show a model that combines product design, raw materials, last-mile delivery,
              installation, consumer financing, and warranty support under one roof, with monetization spanning
              entry-level lighting kits, solar home systems, TV bundles, appliances, smartphones, and larger inverter
              systems. That breadth matters because it suggests revenue quality depends on both hardware sell-through
              and the collection performance of customer receivables. What remains missing is basic commercial
              transparency: the assigned pool does not provide accessible country price cards, realized selling prices,
              discounting conventions, or product-mix revenue split, so public pricing evidence is mostly about payment
              mechanics rather than realized margin.
