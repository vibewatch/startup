  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly visible milestones show a long operating history, repeated financing, and continuing expansion, but later
      scale numbers are not internally consistent.
    data:
      items:
        - label: 2007 — Founded as Greenlight Planet
          description: >-
            General Atlantic and Tech Funding News both describe the company as founded in 2007, before later rebranding
            to Sun King.
          claimRefs:
            - CO001
        - label: 2022-04 — $260M Series D announced
          description: >-
            General Atlantic announced a $260M Series D led by BeyondNetZero with M&G Investments Catalyst and Arch
            Emerging Markets Partners.
          claimRefs:
            - CO004
        - label: 2022-04 — Capital earmarked for expansion and product-line growth
          description: >-
            The same financing announcement tied the round to geographic expansion and larger AC-capable systems plus
            new product categories.
          claimRefs:
            - CO004
            - CO005
        - label: 2022-12-15 — Series D expanded to $330M
          description: Sun King said a $70M extension lifted the Series D total to $330M.
          claimRefs:
            - CO005
        - label: 2022-12-15 — Governance widened but founders kept control
          description: >-
            Sun King said founders retained voting control while LeapFrog joined a board that also included General
            Atlantic, M&G, and Prabha Sinha.
          claimRefs:
            - CO006
