  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all solar generation or all African electricity spend. The evidence points to a
              narrower category: distributed solar hardware plus financing for homes and businesses with no grid service
              or unreliable service, where the real comparison is against kerosene, candles, diesel generators, or
              expensive grid extension rather than against utility-scale renewable procurement. Sun King explicitly
              frames its offer around off-grid and weak-grid users, and its current product set stretches from basic
              lighting and phone charging to higher-capacity home and business systems. That matters because the buyer
              decision is anchored on resilience and cash-flow affordability, not on green branding alone. The FT's
              pricing evidence also shows how the category monetizes across a very wide ticket range by converting
              upfront capex into instalments.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.2'
        title: Sizing lenses and current penetration
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is available only through imperfect lenses, but those lenses are directionally
              useful. FT reporting citing IEA data says 730 million people worldwide still lack electricity access and
              that sub-Saharan Africa accounts for 80 percent of that population, which keeps the center of gravity in
              Sun King's core geography. The same article cites a World Bank and African Development Bank goal to
              connect 300 million Africans by 2030, with the Global Solar Council estimating that close to half of those
              connections could come from off-grid solutions. That is a much stronger boundary than a generic
              multi-trillion-dollar clean-energy TAM, but it still stops short of a precise Sun King SAM/SOM. Current
              company footprint data indicate meaningful category penetration already, with FT reporting more than 50
              million customers and about 330,000 monthly installations, while GOGLA-linked revenue-share figures
              suggest scaled share inside PAYG solar rather than a fringe position.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
