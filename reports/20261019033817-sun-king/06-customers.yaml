company:
  name: "Sun King"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Public evidence supports Sun King as a mass-market PAYG energy provider with real
    household, microbusiness, and institutional deployments, plus very large distribution
    reach and still-expanding customer scale. What remains weak in the public record is
    durability proof: the retained sources are much better at evidencing acquisition,
    installation, and expansion ambition than retention, cohort repayment quality, or
    customer concentration.
sections:
  - id: "segment-mix"
    title: "Segment mix is broad, but buyer economics are still lightly disclosed"
    body: >-
      The retained pool consistently describes Sun King as serving people without reliable
      grid access, but the practical customer mix is broader than a single retail household
      segment. Official product and about pages show a ladder from basic lighting and phone
      charging kits to TV bundles, fans, and larger inverter-style systems for homes and
      businesses, while external profiles add education and health-care facilities as visible
      use cases. That breadth matters because it suggests Sun King can monetize multiple
      budgets and use cases through the same PAYG and field-service infrastructure. What the
      public evidence does not disclose is which segments contribute the most revenue,
      margins, or repayment quality, so the segment map is operationally credible but still
      financially under-specified.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU010"
      - "CU011"
      - "CU016"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-proof"
    title: "Adoption proof is strong on reach and named deployments"
    body: >-
      Sun King's customer proof is strongest where the sources speak to visible scale and
      concrete deployments. MIT Technology Review reported more than 40 million people in
      2024, while Dealroom's profile, retrieved in October 2026 but not publication-dated,
      states that Sun King has powered more than 82 million people. General Atlantic's
      undated release page reports an acquisition cadence of 150,000 new clients per month
      across seven countries at the time of that release; it is partner-hosted rather than an
      independent current benchmark. Official customer-proof pages are better than logo
      walls: they show named users including the Dickson family and broadcaster Prince
      Adeyemi, plus institutional examples in Zambia and Malawi. These examples support real
      use, but remain company-curated and do not independently establish retention.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-risk"
    title: "Durability and concentration remain the key diligence gaps"
    body: >-
      The weak point in this chapter is not whether Sun King can win customers; it is whether
      public evidence proves those customers stay, repay, expand, and diversify revenue in a
      durable way. Official pages offer useful operating proxies such as a two-year warranty,
      a claimed 10-year battery lifespan, and large field-service coverage, but those are not
      substitutes for NRR, GRR, churn, loan delinquency, renewal, or repeat-purchase cohorts.
      The same pattern appears in third-party profiles: they update served-population
      milestones and geographic expansion plans, but they do not quantify top-customer
      exposure, partner concentration, or repayment quality. MIT Technology Review also adds
      a meaningful adverse note that clean-cooking adoption still depends on household habits,
      incomes, and cultural practices, which limits how far product-line expansion can be
      treated as proven retention upside.
    claimRefs:
      - "CU012"
      - "CU015"
      - "CU016"
