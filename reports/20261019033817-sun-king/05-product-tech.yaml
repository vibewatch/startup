company:
  name: Sun King
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Sun King sells solar home systems as an integrated product-delivery stack:
    rooftop hardware, EasyBuy pay-as-you-go financing, and a large last-mile
    installation and support network. The retained evidence shows a current
    third-generation HomePlus family, independently documented legacy hardware
    quality checks, and roadmap expansion into larger inverter-led systems, but
    public disclosure is still thin on software, privacy, reliability cohorts,
    and developer-facing integration evidence.
sections:
  - id: delivered-workflow
    title: What Sun King delivers in the customer workflow
    body: >-
      Sun King is not just selling a panel-and-battery kit. Its current solar
      home systems are positioned for homes and small businesses with no or weak
      grid access, and the customer job is explicit: replace kerosene or
      unreliable mains for lighting, phone charging, and a limited set of
      compatible appliances such as TVs, radios, and fans. The current lineup
      centers on the HomePlus family, with the HomePlus Max extending from basic
      multi-room lighting into laptop charging, TV/fan/radio support, a motion
      security light, and dual solar/grid battery charging. Sun King also keeps
      the commercial workflow flexible: the same products can be bought
      outright, or financed through EasyBuy in small installments across online,
      shop, and field-agent channels, which means the financing rail is part of
      the delivered product rather than a separate afterthought.
    claimRefs: [CE001, CE002, CE003, CE010, CE011, CE012]
    tableRefs: [TE001, TE002]
  - id: architecture-operations
    title: Hardware, controls, and operating architecture
    body: >-
      The retained technical evidence points to a layered operating model rather
      than a single-device SKU. On hardware, the HomePlus range combines a
      roof-mountable panel, battery-backed control unit, and linked lamps, while
      the legacy Home 60 listing shows Sun King also supporting a simpler PAYG
      system with fixed LED lamps, USB/AC outputs, and remote diagnostics. On
      controls, the product surfaces emphasize intelligent battery management,
      low-battery dimming, MPPT charging, and PAYG enablement, showing that
      energy management and payment collection are embedded in the electronics.
      Operationally, Sun King claims end-to-end ownership across product design,
      raw materials, last-mile delivery, installation, financing, and warranty
      support; that bundle is reinforced by field distribution at national-shop
      scale rather than by a pure reseller model.
    claimRefs: [CE004, CE005, CE006, CE007, CE009, CE010, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-differentiation-risks
    title: Maturity, differentiation, and product-tech risk
    body: >-
      Sun King's differentiation is the combination of hardware depth and a
      field-financing machine that can carry products into off-grid and weak-grid
      contexts at scale. Independent and partner sources both describe Sun King
      as coupling solar hardware with pay-as-you-go finance and direct
      distribution, while third-party product documentation shows at least some
      historical quality verification around battery durability, ingress
      protection, workmanship, and minimum warranty terms. The roadmap signal is
      also concrete: General Atlantic said Series D proceeds would expand the
      product line into larger inverter-equipped systems and adjacent devices.
      The remaining product-tech risk is disclosure asymmetry. Public evidence is
      much stronger on hardware features and channel reach than on software
      architecture, privacy and security controls around PAYG/customer data,
      service-level reliability metrics, or developer/practitioner adoption
      signals, so those areas remain diligence asks rather than underwritten
      strengths.
    claimRefs: [CE008, CE009, CE012, CE013]
tables:
  - id: TE001
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Sun King solution
      - Measurable benefit
      - Limitation
    rows:
      - - Basic home lighting
        - Off-grid or weak-grid households rely on dim or unreliable legacy lighting.
        - HomePlus and HomePlus Max provide multi-room solar lighting kits.
        - HomePlus Max is marketed to illuminate up to four rooms; HomePlus spec cites 43 hours on low-brightness mode.
        - Benefit is company-stated; retained evidence does not include field failure or uptime cohorts.
      - - Device charging
        - Users need phone charging without dependable mains power.
        - HomePlus offers USB-A phone charging; HomePlus Max adds faster smartphone and laptop charging.
        - Charging expands beyond feature phones to higher-draw consumer devices on Max.
        - Public evidence does not include charging-speed benchmarks or battery-degradation curves.
      - - Basic appliance power
        - Households and shops want small-appliance capability, not just lighting.
        - HomePlus Max can power Sun King TVs, radios, and a pedestal fan; catalog pages bundle 24/32/43 inch TV variants.
        - Product scope moves from lighting into small entertainment and comfort loads.
        - No retained inverter-load profile or appliance runtime table is public.
      - - Affordable acquisition
        - Upfront purchase can block adoption for low-income customers.
        - EasyBuy PAYG lets customers buy through small installments via agents, shops, or online.
        - Financing is embedded in the commercial workflow rather than added later.
        - No retained public data covers approval rates, delinquency, repossession, or repayment cohorts.
    notes: >-
      Synthesizes official product pages, the HomePlus spec sheet, and
      independent narrative coverage; benefits are source-stated and nulls mark
      missing public operating metrics rather than negative evidence.
    claimRefs: [CE001, CE002, CE004, CE005, CE010, CE011, CE012]
  - id: TE002
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - User
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - HomePlus
        - Entry-level off-grid households and microbusinesses
        - Current public SKU; described as a third-generation system
        - 7 Wp panel, 19.2 Wh LFP battery, 3 lamps / 480 lumens, USB-A charging, MPPT-enabled control electronics
        - Need current sell-through, return-rate, and failure-rate disclosure
      - - HomePlus Max
        - Weak-grid households and small businesses needing higher-power charging and lighting
        - Current flagship in retained launch materials
        - USB-C laptop charging, motion security light, solar plus grid charging, supports TV/fan/radio accessories
        - Need duty-cycle evidence, install complexity, and real-world battery-life data
      - - HomePlus Max + TV bundles
        - Customers willing to bundle power and entertainment
        - Current catalog bundle variants (24/32/43 inch)
        - Converts the system from lighting-plus-charging into an appliance bundle
        - Need bundle economics, warranty-claim mix, and attachment-rate data
      - - Home 60
        - Entry-level PAYG users in earlier/adjacent distribution channels
        - Independently documented legacy/basic system
        - Remote diagnostics, 3 AC outlets, 1 USB output, Lighting Global-vetted performance categories
        - Need current deployment share versus newer HomePlus generation
    notes: >-
      "Current" reflects what remains on retained public surfaces during this
      refresh run; Home 60 is kept as a documented benchmark for architecture
      and quality signals, not proof that it is still a lead sales SKU.
    claimRefs: [CE002, CE003, CE005, CE006, CE007, CE008, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Solar generation and storage hardware
        - Captures and stores power for multi-room lighting, charging, and small loads
        - Rooftop panels, LFP batteries, control unit form factor, and component quality
        - Public evidence is stronger on features than on field failure distributions or replacement cost
      - - Control electronics and power management
        - Regulates charging, protects the battery, and extends low-battery runtime
        - MPPT control, dimming logic, paused charging, and product-specific firmware/electronics
        - No retained public evidence on firmware update process or software-security controls
      - - Payment and device enablement
        - Makes hardware affordable through installment-based acquisition
        - EasyBuy PAYG rails, mobile-money collection, and in-device payment enablement
        - Core dependency on collections and customer-data handling with limited public privacy/control disclosure
      - - Distribution, installation, and after-sales support
        - Puts systems into remote homes and keeps them working
        - Field agents, shops, last-mile logistics, warranty workflows, and local service capacity
        - Execution risk rises with network scale; public record does not expose service turnaround or parts availability metrics
    notes: >-
      Architecture combines device, payment, and field-operations layers; risk
      cells highlight missing public evidence, not proof of failure.
    claimRefs: [CE004, CE006, CE007, CE009, CE010, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Sun King's public product architecture stacks customer energy jobs on top
      of device hardware, embedded controls/PAYG, and a field-service network.
    data:
      layers:
        - label: Customer energy jobs
          detail: Homes and small businesses without reliable grid access need lighting, charging, and limited appliance power.
          outputs:
            - Multi-room lighting
            - Phone charging
            - TV/radio/fan support on larger systems
        - label: Device hardware
          detail: The product family spans entry-level and larger solar home systems rather than a single box.
          items:
            - HomePlus: 7 Wp panel; 19.2 Wh LFP battery; 3 lamps / 480 lumens
            - Home 60: 6 W panel; 6000 mAh battery; 3 fixed LED lamps
            - HomePlus Max: laptop charging; security light; solar plus grid charging
          outputs:
            - Roof-mountable panel
            - Linked wall-switched lights
            - Optional TV bundles
        - label: Embedded power controls
          detail: Energy harvesting and low-battery behavior are designed into the control unit rather than left to user workarounds.
          modules:
            - MPPT charge controller
            - Low-battery dimming and paused charging
            - Wall-switch lighting control
            - Remote diagnostics on Home 60
        - label: Payment and affordability rail
          detail: Customer acquisition depends on embedded installment purchasing rather than cash-upfront hardware sales.
          modules:
            - EasyBuy PAYG installments
            - One-off purchase option
            - In-device payment enablement
        - label: Distribution and installation network
          detail: Sun King owns the channel and install loop instead of relying on a thin reseller layer.
          modules:
            - 41,000+ field agents
            - 440+ shops in 15 countries
            - Online, shop, and agent sales
            - Last-mile installation
        - label: Support and roadmap extension
          detail: Warranty-backed service and adjacent product expansion extend the system beyond the first sale.
          modules:
            - Long-term warranty support
            - Larger inverter-based systems on roadmap
    claimRefs: [CE002, CE006, CE009, CE010, CE012, CE013]
