    rows:
      - - 正论点：一体化运营模式
        - Sun King 称其将发电产品、安装、服务和客户融资结合起来。
        - 独立的单位经济性证据将进一步巩固护城河主张。
      - - 论点：已验证的资本获取能力
        - 披露的融资包括 2022 年 $260m D 轮和 2025 年 $40m 股权轮。
        - 完整的资本结构与债务明细表可以显示融资质量是否匹配融资规模。
      - - 反论点：估值不透明
        - 2026 年 9 月的融资在两个市场数据来源中可见，但融资金额和估值无法公开使用。
        - 签署的轮次文件和完全稀释后的股权结构表可以让投资者评估入场定价。
      - - 反论点：泛化的同行排名不等于可比交易
        - Tracxn 将 Sun King 排在第 19 位，评分为 54/100，但没有提供可比交易估值。
