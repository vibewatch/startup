              则称总部在内罗毕；指定资料池保留的官方页面主要聚焦产品和分销，没有一方得到官方公司注册地信息的佐证。同样，这组来源没有提供清晰的公开估值、经审计财务披露或可直接比较的客户数。因此，后续章节最重要的尽调任务不是继续补充叙述，而是完成核对：法律实体总部、累计融资、员工数以及公司首选的规模指标，都需要一手文件或管理层确认后，才能用作封面事实。
