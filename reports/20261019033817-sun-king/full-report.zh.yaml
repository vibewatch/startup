  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 有证据支持的假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 看涨
        - 月度套件销量向 2030 年目标推进，同时经审计的亏损和利润率证明具有持续性。
        - 只有在优先股分配顺序之后仍能达到目标回报的条款下，溢价才可能站得住。
        - 经审计的现金创造能力和独立验证的信贷账龄会强化该情景。
        - 扩张消耗资本，却没有改善现金经济性。
      - - 基准
        - 分销与融资规模继续扩大，但公开财务信息和轮次条款披露仍然有限。
        - 无法支持数值区间；只有在取得价格、稀释和下行保护条款后才应推进。
        - 与当前分配到的证据最为一致。
        - 拟议入场价格假设盈利能力或亏损表现未经验证。
      - - 看跌
        - 信贷损失、所在国经济状况或优先级债权主张明显高于公司增长指标所暗示的水平。
        - 即使产品销量增长，普通股价值也可能下跌；除非价格完全吸收减值，否则应放弃。
        - 如果尽调发现回款薄弱、优先权负担沉重或反复依赖外部资本，该情景会强化。
        - 没有可信路径能将经营规模转化为可分配给普通股的收益。
    notes: 由于指定证据中缺少收入、经审计利润、当前估值、组合损失账龄和证券条款，情景仅作定性分析；未估算概率或数值区间。
