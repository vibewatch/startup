              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              公开证据尚未证明其具备退出准备度。Caplight
              识别出私募融资历史，但其公开页面不提供底层申报覆盖；指定市场数据来源都没有当前二级市场价格、可比交易价值，或从企业价值推导普通股收益的可信路径。因此，决定性尽调材料应包括最新股权结构表、已签署融资文件、清算瀑布、投资者权利清单、经审计合并账目、各国盈利能力和静态分期
              PAYG
              信用数据。如果优先股堆叠清晰、损失受控，且在满足目标回报的价格下能够反复产生现金，建议可能改善。高额优先级债权主张、回款疲弱，或缺少经审计经济性支持的估值上调，都是论点失效触发器，应将决定从跟踪转为放弃。
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: Sun King 的规模值得继续尽调，但在当前价格、证券条款和普通股回报机制明确之前，无法支持买入论点。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV016
          - type: callout
            title: 论点失效测试
            body: 如果经审计的信用损失、各国经济性或清算结构使运营增长无法转化为可接受的普通股回报，则应放弃。
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
