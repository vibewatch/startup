      - number: '3.2'
        title: 能力广度是优势，但定价证据并不对称
        blocks:
          - type: paragraph
            body: >-
              Sun King 的官方页面和独立报道显示，其产品包比单一 SKU 的太阳能卖家更广。公司当前销售基础照明和手机充电套件、电视套装、更大型家庭系统及其他家电；Fortune
              仍将其描述为覆盖太阳能手提灯、家庭系统和多千瓦系统，服务离网及弱电网客户。这种广度支持其能够让家庭沿能源阶梯升级的定位。但对于同类竞争者的产品组合和消费者价格，证据明显更弱：本次资料池包含详细的 Sun King
              定价和融资例子，却没有 d.light、M-KOPA、ENGIE Energy Access、Bboxx 或 Zola 2026 年同等公开价目表。因此，本章可以有把握地比较方案类别和合同结构，但不能声称 Sun
              King 在公开价格上精确优于这些竞争者。
            claimRefs:
