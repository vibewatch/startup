        - label: 2022-04 — 资本用于扩张和产品线增长
          description: 同一份融资公告称，该轮资金将用于地域扩张、扩大具备交流电能力的系统，以及推出新的产品类别。
          claimRefs:
            - CO004
            - CO005
        - label: 2022-12-15 — D 轮扩大至 3.3 亿美元
          description: Sun King 表示，追加 7000 万美元后，D 轮总额升至 3.3 亿美元。
          claimRefs:
            - CO005
        - label: 2022-12-15 — 治理范围扩大，但创始人保留控制权
          description: Sun King 表示创始人保留投票控制权，同时 LeapFrog 加入董事会；董事会成员还包括 General Atlantic、M&G 和 Prabha Sinha。
          claimRefs:
            - CO006
            - CO007
        - label: 2022-12-15 — 强调进军莫桑比克、多哥和喀麦隆
          description: Sun King 的扩展公告将该融资与非洲多国扩张联系起来。
          claimRefs:
            - CO005
            - CO007
        - label: 2026-06-05 — General Atlantic 更新规模叙事
          description: 2026 年 6 月的投资者公告称，Sun King 已为 40 个国家的 8200 万人提供电力服务。
