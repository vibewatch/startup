            body: >-
              公开融资证据确认其拥有可观的后期资本基础，但无法得出一个一致的最新累计总额。General Atlantic 于 2026 年 6 月宣布 $260m Series D；Sun King 自己在 2022 年
              12 月的公告中称，追加 $70m 后，该 Series D 达到 $330m，其中部分用于老股转让。Tracxn 的资料进一步将 Sun King 描述为一家总部位于内罗毕的 Series D 公司，累计融资
              $552m，但指定资料池没有披露逐轮融资台账。运营规模的披露同样不一致：General Atlantic 2026 年 6 月称 Sun King 已为 40 个国家的 82m 人提供电力，Sun King
              2022 年 12 月的公告称服务人数为 95m，而南非关于我们页面则突出 15 个国家的 41,000+ 名现场代理和 440+
              家以上门店。这些信号证明其规模不小，但无法为本次刷新确定一个统一的客户数、服务人数或员工数。
