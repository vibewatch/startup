          unit: pct
          note: Tech Funding News 和 General Atlantic 引用的 GOGLA 数据
    approximationNotes: 150mn 这一层是对 FT 引用份额的简单换算，并非单独发布的总量；最后的 330k 层代表月度流量，而不是累计安装基数。
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM011
      - CM012
      - CM016
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序位定位表明，Sun King 最强的直接防线是硬件同行；钱包份额相邻市场和替代方案则从不同角度发起攻击。
    data:
      xAxis:
        label: 匹配 Sun King 分销 + 融资组合的能力
        min: 1
        max: 5
        low: 低
        high: 高
        description: Ordinal synthesis from retained evidence, not a measured market-share scale.
        scale: ordinal
      yAxis:
        label: 替代 Sun King 当前需求的能力
        min: 1
        max: 5
        low: 低
        high: 高
        description: Higher scores indicate a more credible route to capturing the same buyer spend or removing the need for a kit.
        scale: ordinal
      points:
        - label: Sun King
          x: 5
          'y': 3
          tone: positive
          note: 基准点：一体化现场分销、服务和应收账款融资。
        - label: d.light
          x: 4
          'y': 4
          tone: warning
          note: 拥有自身证券化计划且产品深度相当，是最接近的直接 PAYGO 同行。
        - label: M-KOPA
          x: 4
          'y': 5
          tone: risk
          note: 钱包份额威胁较高，因为智能手机融资会争夺同一家庭的还款能力。
        - label: ENGIE Energy Access
          x: 3
          'y': 3
          tone: warning
          note: 由公用事业支持的资产负债表并涉足微电网，但保留的证据显示其 PAYGO 执行速度较慢。
        - label: Bboxx / Zola
          x: 3
          'y': 3
          tone: warning
          note: 带来有意义的高端市场和合作伙伴压力，但关于其是否具备同等现场规模执行能力的保留证据较弱。
        - label: 微电网 / 公共电网
          x: 2
          'y': 4
          tone: risk
          note: 当人口密度或电网可靠性改善到足以消除家用套件需求时，替代威胁会上升。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP015
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据支持的是融资驱动的经营闭环，而不是一次性硬件销售。
    data:
      nodes:
        - id: demand
          label: 离网或弱电网需求
          note: 官方页面将产品定位于照明、手机充电、电视、风扇和备用电力需求。
        - id: deposit
          label: 低额押金完成接入
          note: LeapFrog 表示，客户通常先支付名义押金，再开始 PAYG 还款。
        - id: installments
          label: 按日 / 周 / 月分期
          note: 指定来源描述了分期付款；Pulse2 报道期限为 12–24 个月，每天约 $0.15-$0.20。
        - id: service
          label: 安装与保修支持
          note: Sun King 负责交付、安装和支持，产品页面称提供两年保修。
        - id: upsell
          label: 向更大系统和设备追加销售
          note: 公开页面显示产品已扩展至电视、家电、智能手机和逆变器系统。
        - id: recycle
          label: 资本循环投入库存和应收账款
          note: 增长由客户融资投放、可持续债务发行和新增股权支持。
      edges:
        - from: demand
          to: deposit
        - from: deposit
          to: installments
        - from: installments
          to: service
        - from: service
          to: upsell
        - from: upsell
          to: recycle
    approximationNotes: 这是一个定性经营桥接图，展示变现流程和资本触点，不是经审计的转化率。
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI007
      - CI011
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Sun King 的公开产品架构以客户能源需求为顶层，底部由设备硬件、嵌入式控制 / PAYG 和现场服务网络支撑。
    data:
      layers:
        - label: 客户能源需求
          detail: 无法可靠接入电网的家庭和小型企业需要照明、充电以及有限的家电用电能力。
          outputs:
            - 多房间照明
            - 手机充电
            - 更大型系统支持电视 / 收音机 / 风扇
        - label: 设备硬件
          detail: 产品系列覆盖入门级和更大型的太阳能家用系统，而非单一设备。
          items:
            - HomePlus: 7 Wp panel; 19.2 Wh LFP battery; 3 lamps / 480 lumens
            - Home 60: 6 W panel; 6000 mAh battery; 3 fixed LED lamps
            - HomePlus Max: laptop charging; security light; solar plus grid charging
          outputs:
            - 可安装在屋顶的面板
            - 联动墙壁开关灯
            - 可选电视套装
        - label: 嵌入式电源控制
          detail: 能量采集和低电量行为被设计进控制单元，而不是留给用户自行解决。
          modules:
            - MPPT 充电控制器
            - 低电量调光与暂停充电
            - 墙壁开关照明控制
            - Home 60 远程诊断
        - label: 支付与可负担性通道
          detail: 获客依赖嵌入式分期购买，而不是预付现金购买硬件。
          modules:
            - EasyBuy PAYG 分期
            - 一次性购买选项
            - 设备内支付启用
        - label: 分销与安装网络
          detail: Sun King 自有渠道和安装闭环，而不是依赖单薄的经销商层。
          modules:
            - 41,000+ 名现场代理
            - 15 个国家的 440+ 家门店
            - 线上、门店和代理销售
            - 最后一公里安装
        - label: 支持与路线图延伸
          detail: 保修支持和相邻产品扩张让系统的价值延伸到首次销售之后。
          modules:
            - 长期保修支持
            - 路线图中的更大型逆变器系统
    claimRefs:
      - CE002
      - CE006
      - CE009
      - CE010
      - CE012
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Sun King 的客户路径围绕可负担性、现场安装、真实使用证明和后续扩张展开，但留存情况仍缺乏可见度。
    data:
      items:
        - label: 在离网或弱电网环境发现需求
          stage: 入口
          actor: 无法可靠接入电网的家庭和企业
          touchpoints:
            - 核心需求是在电网缺失或不稳定的地方获得可负担、可靠的电力。
            - 可服务基础包括家庭、小型企业和部分机构。
        - label: 通过 PAYG 打开可负担性
          stage: 购买
          actor: 家庭或企业付款人
          touchpoints:
            - 客户可以小额分期付款，而不是预付多年的能源费用。
            - PAYG 降低了从蜡烛、煤油、发电机或弱电网电力迁移过来的门槛。
        - label: 现场代理销售、安装和服务
          stage: 履约
          actor: Sun King 现场代理和门店
          touchpoints:
            - 官方页面称有 440+ 家门店和超过 40,000 名现场代理。
            - 安装、融资、保修支持和维护处在同一个运营体系内。
        - label: 使用从基础供电扩展到生产性负载
          stage: 使用
          actor: 家庭、微型企业和机构
          touchpoints:
            - 入门产品覆盖照明和手机充电。
            - 更高阶产品为家庭和企业增加电视、风扇及逆变器支持的系统。
        - label: 公开证明来自具名故事和项目
          stage: 可引用性
          actor: 具名用户和机构部署
          touchpoints:
            - 公开证明包括 Dickson 家庭、Prince Adeyemi、Zambia 农业研究所和马拉维学校项目。
            - 大多数具名证明由公司筛选整理，未经独立审计。
        - label: 扩张上行空间先于留存证明出现
          stage: 扩张
          actor: 新地域和相邻产品线
          touchpoints:
            - 2026 年第三方来源更新了服务人口和计划中的地域扩张。
            - 公开来源仍未披露 NRR、流失率、逾期率或头部客户集中度。
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU010
      - CU013
      - CU016
  - id: FR001
    title: 已披露缓解措施之后的剩余风险热力图
    type: matrix
    summary: 财务模型和规模执行风险仍然最高，因为已披露的控制措施没有配套公开的组合质量、契约、事故或运营队列数据。
