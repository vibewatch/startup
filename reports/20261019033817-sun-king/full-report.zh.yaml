    sections:
      - number: '1.1'
        title: 身份、定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              保留的官方及独立来源持续将 Sun King 描述为一家离网太阳能公司，服务于非洲和亚洲电网薄弱或无电网地区的家庭和小企业。当前官方主页称，公司为生活在可靠电网之外的 18
              亿人安装并提供太阳能融资；尼日利亚产品页则显示，其产品覆盖太阳能家庭系统、家电和更大功率的交流电兼容系统，而非单一的手提灯 SKU。General Atlantic 2026 年 6 月公告及 Tech
              Funding News 的对应报道都称，该业务 2007 年以 Greenlight Planet 的名义成立，后更名为 Sun
              King。这为后续章节提供了可用的身份基线，但指定证据对其精确法律实体范围和公司注册地的佐证仍不完整。
