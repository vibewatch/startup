      - number: '8.2'
        title: 融资与控制权背景
        blocks:
          - type: paragraph
            body: >-
              历史资本基础相当可观，但无法从公开证据中完全核对。TechCrunch 报道 2022 年 4 月完成 $260m Series D；一家大学托管、源自公司的公告则具体称其中 $100m
              为新发股权资本，且当时创始人保留董事会投票控制权。Sun King 自己在 2025 年 12 月的公告中又为产品和分销扩张增加了 $40m 股权。Tracxn 目前称其 19 轮融资累计
              $552m，但指定来源没有完整拆分股权、公司融资、项目融资和债务。因此，证据支持其获得资本的能力，却不足以支持对当前资本化、稀释、优先权负担或普通股权益价值的判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.3'
        title: 论点、反论点与情景
        blocks:
          - type: paragraph
            body: >-
              论点是，Sun King 把产品设计、安装、服务、最后一公里分销和消费者信贷整合到一个平台中。公司材料称客户融资规模为 $1.4 billion；月度套件量从 2017 年的 10,000 套增至 330,000
              套以上，目标是到 2030 年达到每月 1,000,000 套。EquityZen 独立描述了其设计、分销、安装和融资一体化模式；援引 GOGLA 的独立报道则称其在 PAYG
              太阳能收入中占有重要份额。反论点是，关键当前运营指标仍由公司发布，没有经审计的利润率、现金产生能力、信用损失分期数据和轮次条款，就无法转化为股权价值。乐观情景需要独立证明规模能带来持久经济性；基准情景保留增长势头，但执行严格价格纪律；悲观情景从资本需求或信用损失超过运营回报开始。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
