            body: >-
              当前资料池确认了创始团队，也显示创始人控制权持续存在，但正式治理文件仍然不足。Tech Funding News 将 Anish Thakkar、Mayank Sekhsaria 和 T. Patrick
              Walsh 列为创始人；Fortune 则列 Walsh 为截至 2026 年 9 月的 CEO。治理层面的信号比管理层披露本身更强：General Atlantic 2026 年 6
