      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方、用户和付款方会随使用场景变化，但对一家前沿能源公司而言，这条路径仍然相当清晰。入门系统面向需要照明和手机充电的农村或城郊家庭；这些家庭只能靠小额、持续付款承担产品。更高端的家庭系统和电视套装，把同一套预算逻辑延伸到电网薄弱地区的家庭：它们看重停电保护、设备充电，以及娱乐或学习场景。小企业位于更上一层，因为停工和发电机燃料成本带来更明确的运营预算回报。学校和公共建筑等机构似乎也能承接更高客单价的方案，但公开材料提供的仍多是个案，而非清晰的采购管线。因此，采用路径正从基础用电延伸到韧性和生产性用能，只是公开记录还无法按细分市场量化转化率。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.4'
        title: 增长驱动与市场约束
        blocks:
          - type: paragraph
            body: >-
              三股力量支持采用：太阳能和电池成本下降、弱电网或频繁停电持续存在，以及燃油价格给依赖发电机的家庭和小微企业带来的压力。FT 报道将 Sun King 的部分增长归因于更便宜且质量更高的面板和电池；FT
              及产品发布报道也显示，公司正转向在弱电网环境更有价值的高负载系统。但同一批来源也说明，投资者不应把 TAM 视为自动持久。BloombergNEF 警告，部分市场的电网铺设可能削弱 PAYG 太阳能的经济性；FT
              指出，国家层面的离网产品销售会随着补贴计划暂停或重启而大幅波动。另一个需要警惕的问题是内部口径不一致：Sun King
              自己的关于我们页面对现场代理和国家数量的说法并不一致。这并不否定市场论点，但在没有进一步尽调前，会降低对精确获客和销售能力声明的信心。
            claimRefs:
              - CM009
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: Sun King 的真实市场是韧性与可负担性，而不是抽象的“太阳能”
            body: 保留的最强证据将 Sun King 所处品类定义为面向离网和弱电网用户、以现金流为基础的分布式能源；替代方案是煤油、柴油或不可靠的电网供电，而不是笼统的可再生能源预算。
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM014
          - type: callout
            title: 巨大的用电缺口不会自动转化为持久的国家级需求
            body: 电网扩张、补贴计划时点以及公司披露的分销指标不一致，都说明不能把非洲电气化机会视为一条线性、干净地转入 Sun King 收入的漏斗。
            calloutType: risk
            claimRefs:
              - CM009
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局覆盖直接 PAYGO 同业和多类替代方案
        blocks:
          - type: paragraph
            body: >-
              保留的第三方证据不支持“只有其他太阳能品牌”的狭窄竞争视角。Teardown 将 Sun King 的直接同业列为 d.light、M-KOPA、ENGIE Energy Access、Bboxx 和 Zola
              Electric，并进一步将微电网、电网延伸及以分销为先的运营商列为重要替代或渠道威胁。这一点很重要，因为 Sun King
              已不再只销售入门级手提灯：其当前产品页面显示，产品梯度从基础照明和充电延伸到电视套装和更大型系统，因此同时与经典离网同业以及高负载弱电网备电方案重叠。实际而言，Sun King 至少同时面对三条战线：直接
              PAYGO 太阳能品牌、争夺同一家庭钱包的消费金融相邻业务，以及让客户不再需要整套太阳能设备的电气化替代方案。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
