      - number: '4.3'
        title: 资本结构与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Sun King 最近的融资信息进一步表明，增长资金来自股权与结构化债务的组合，而不是公司自披露的自由现金流。公司称，2023 年肯尼亚证券化和 2024 年 Enterprises Bond
              的资金已全部分配给合资格资产；2025 年 12 月的一篇二手报道则称，Lightrock 新投资的 4000 万美元是达到 Sun King
              目标运营规模所需融资的一部分。这种组合符合其运营模式：客户贷款似乎是核心资产，因此资本充足性不仅取决于太阳能系统需求，也取决于持续获得应收账款融资、资产负债表容量和服务基础设施。指定资料池没有现金余额、债务契约、借款成本或现金跑道披露，因此资本是否充足仍是待尽调事项，而不是已得出的结论。
