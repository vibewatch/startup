          - type: paragraph
            body: >-
              建议是跟踪并继续研究，而不是买入。Sun King 持续吸引股权和债务资本，包括公司宣布的 2025 年 12 月 $40m 股权投资；两个独立市场数据页面还显示 2026 年 9
              月发生了另一笔融资。但这些页面没有披露可用的轮次金额或估值，因此只能证明融资活动，不能形成可投资价格。Tracxn 在其广泛的活跃竞争者集合中给出 54/100 分和第 19
              名，这是一项不利信号，却不是估值基准。在缺少当前股份类别经济条款、清算优先权、经审计收益或资产组合损失数据的情况下，给出数字入场区间会制造虚假精确。因此，任何投资决定都应以私有文件和基于真实条款构建的回报案例为前提，而不能依据融资头条。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV013
