  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场不是全部太阳能发电，也不是所有非洲电力支出。证据指向一个更窄的类别：为无电网服务或供电不稳定的家庭和企业提供分布式太阳能硬件及融资；真正的比较对象是煤油、蜡烛、柴油发电机或昂贵的电网延伸，而非公用事业级可再生能源采购。Sun
              King 明确围绕离网和弱电网用户定位产品，当前产品线从基础照明和手机充电延伸到更高容量的家庭及商业系统。这一点很重要，因为客户决策基于供电韧性和现金流可负担性，而不只是绿色品牌。FT
              的定价证据也显示，该品类通过把前期资本支出转化为分期付款，覆盖了极宽的客单价范围。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.2'
        title: 规模测算视角与当前渗透
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只能从不完美的视角估算，但这些视角仍具有方向性。援引 IEA 数据的 FT 报道称，全球仍有 7.3 亿人无法获得电力，其中撒哈拉以南非洲占 80%，这使 Sun King
              的核心地理区域成为市场重心。同一篇文章援引世界银行和非洲开发银行的目标称，到 2030 年要为 3 亿非洲人接入电力；Global Solar Council
              估计其中接近一半可能来自离网方案。这比泛泛而谈的数万亿美元清洁能源 TAM 更能界定市场，但仍不足以给出 Sun King 精确的 SAM/SOM。当前公司覆盖数据已显示相当程度的品类渗透：FT 报道其客户超过
              5000 万、每月安装约 33 万套；与 GOGLA 相关的收入份额数据则显示其在 PAYG 太阳能内部已达到规模化份额，而非边缘位置。
            claimRefs:
              - CM001
