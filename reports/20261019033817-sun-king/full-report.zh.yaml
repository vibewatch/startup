  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 经营规模维持吸引力，但缺少价格和下行条款，无法给出买入建议。
    data:
      nodes:
        - id: capital-access
          label: 资本获取
          detail: 历史上规模较大的 D 轮、2025 年股权融资，以及 2026 年 9 月融资信号。
        - id: operating-scale
          label: 经营规模
          detail: 一体化分销和公司自报的客户融资覆盖。
        - id: execution-target
          label: 执行目标
          detail: 公司目标是到 2030 年将月度套件销量提升至 100 万套左右。
        - id: adverse-context
          label: 不利背景
          detail: 泛化的第三方竞争对手排名不高，也不是估值基准。
        - id: evidence-gap
          label: 价格与信贷缺口
          detail: 没有可用的当前估值、优先股堆叠或组合损失证据。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 只有在私有尽调支持价格、下行保护和退出回报后才投资。
    approximationNotes: 仅为定性决策链；节点顺序不代表概率、规模或数值估值桥接。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV009
      - CV013
      - CV015
      - CV016
