        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              因此，财务判断是混合的。积极的一面是，Sun King 似乎拥有规模化 PAYG
              收入引擎、扩大的产品组合，以及反复获得外部融资的能力，支持其增长和扩张。消极的一面是，指定资料池中的独立市场资料仍未公开收入、利润、估值、员工数或详细运营指标，公司控制的渠道也没有用经审计报表或客户群经济性填补这一缺口。对投资判断而言，业务在商业上看起来可信，但财务上仍不透明：利润率路径、实际定价、违约率、营运资金周转和现金跑道，都应视为尚未解决的尽调事项，不能从影响力或业务量指标中推断。
