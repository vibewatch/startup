      - number: '3.3'
        title: 分销加融资是核心护城河
        blocks:
          - type: paragraph
            body: >-
              Sun King 最强的竞争防线，是自有分销、服务和融资基础设施的组合。官方页面披露了 4.1 万至 4.5 万名以上现场代理、440 家门店、安装和维护服务，以及同一品牌下的 PAYG 融资。Teardown
              进一步将这一运营层与移动支付收款、信用评分和证券化联系起来；British International Investment 则称，其为 Sun King 设立的融资工具专门购买由 Sun King Kenya
              发起的 PAYGO 应收账款。这些来源共同支持一个判断：Sun King
              的优势不只是硬件品牌，而是一套资本支持的服务系统，新进入者很难快速复刻。这也解释了为什么单纯模仿硬件的威胁小于消费金融或分销攻击——后者试图把信贷、家电或最后一公里劳动力从设备套装中拆出来。
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: 护城河确实存在，但客户不再需要整套方案时最脆弱
        blocks:
          - type: paragraph
            body: >-
              同一批证据也限制了护城河可以延伸的范围。Teardown 的竞争分析指出，M-KOPA 转向智能手机融资、d.light 的证券化计划，以及微电网或电网替代方案，都可能绕开 Sun King
              传统的太阳能家庭系统切入口。最具体的公开消费者定价信号并不利好：Teardown 报道，尼日利亚一项 50W PAYGO 计划的总价比现金价高
              94%，说明在结账时看似可负担，终身拥有成本却可能变高。Techparley 2025
              年融资报告进一步表明，管理层正推动产品扩张、规模和更高容量，而不是重新收缩到低端照明。竞争结论是：在首次用电、且通过自有现场网络销售的场景，Sun King
              仍最难被攻击；但在已经通电的城郊或以家电为主的品类中，客户可能更看重融资或备电，而非完整的 Sun King 套装，竞争就更激烈。
            claimRefs:
              - CP002
              - CP005
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 护城河在套装里，而不只在设备里
            body: 保留的最强证据表明，Sun King 的现场销售、服务和应收账款融资组合才是真正的进入壁垒；相比之下，太阳能家庭系统的物料清单更容易被快速复制。
            calloutType: insight
            claimRefs:
              - CP006
              - CP010
              - CP011
              - CP013
          - type: callout
            title: 相邻业务可能比仿制太阳能品牌更重要
