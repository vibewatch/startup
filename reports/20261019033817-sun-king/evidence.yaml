evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: Primary corporate documentation confirming legal headquarters and operating headquarters.
    whyItMatters: >-
      Company overview is the identity anchor for later chapters, and Chicago versus Nairobi changes jurisdictional,
      talent, and governance interpretation.
    diligencePath: >-
      Request the current legal-entity chart, incorporation records, and board-approved company profile used in
      financing materials.
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: One canonical scale metric with definition, numerator, geography, and as-of date.
    whyItMatters: >-
      The current pool contains 82M people, 95M people, 34M products sold, and 41,000+ field-agent distribution data
      that are not directly comparable.
    diligencePath: >-
      Ask management for the latest KPI deck defining active customers, cumulative people served, products sold, and
      distribution footprint.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A public or management-confirmed valuation figure tied to a dated financing event.
    whyItMatters: Later valuation analysis should not infer post-money value from round size alone.
    diligencePath: Request the most recent financing summary, cap table, and any secondary transaction documentation.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: Current board seats, observer rights, reserved matters, and liquidation preferences.
    whyItMatters: >-
      Public releases establish founder control but not whether later investors have downside protection or effective
      vetoes.
    diligencePath: Review shareholder agreements, board consents, and current financing docs.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: TO002 leadership map completeness
    missingEvidence: A current executive-team and board roster beyond the founders and CEO named in retained public sources.
    whyItMatters: >-
      The chapter can identify control concentration, but not full functional coverage or succession depth, from the
      assigned pool alone.
    diligencePath: >-
      Request the latest leadership org chart, executive bios, and board membership list used for financing and
      recruiting.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sam-isolation
    missingEvidence: >-
      Public country-level TAM, SAM, and SOM estimates tied to Sun King's actual addressable populations, income bands,
      and product mix.
    whyItMatters: >-
      Broad electrification and off-grid lenses show demand, but they do not show how much of that pool is practically
      reachable by Sun King's current distribution and financing model.
    diligencePath: >-
      Obtain GOGLA or country-market data, combine it with Sun King geography/product disclosures, and test serviceable
      demand by country, income tier, and weak-grid vs fully off-grid use case.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: distribution-footprint
    missingEvidence: >-
      A reconciled current count for field agents, country coverage, and shop footprint across Sun King's regional and
      global properties.
    whyItMatters: >-
      Go-to-market capacity is central to adoption velocity, but the public official surfaces do not currently agree on
      the size of that distribution network.
    diligencePath: >-
      Request the latest company operating dashboard or board materials and reconcile agent, shop, and country counts
      with dated geography notes.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: rival-pricing
    missingEvidence: >-
      Current 2026 public pricing or contract terms for d.light, M-KOPA, ENGIE Energy Access, Bboxx, and Zola Electric
      that can be compared directly with Sun King's PAYGO and cash offers.
    whyItMatters: >-
      Without like-for-like rival price sheets, the chapter can compare contract structures and threat vectors but
      cannot prove a precise consumer-price advantage or disadvantage across rivals.
    diligencePath: >-
      Pull current rival pricing, financing-tenor, and device-bundle pages from each competitor's official market sites
      and cross-check them against independent reviews.
  - type: missing-source
    severity: material
    topic: receivables-quality
    missingEvidence: Public rival-by-rival delinquency, write-off, repossession, and collection-performance data for PAYGO portfolios.
    whyItMatters: >-
      Sun King's financing moat depends on receivables quality, so competitive durability is difficult to underwrite
      without comparable portfolio-performance data.
    diligencePath: >-
      Collect investor, lender, or rating-style disclosures from Sun King, d.light, and other PAYGO operators that
      quantify arrears, write-offs, and funding costs by market.
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited consolidated revenue, gross margin, operating expense, and free-cash-flow statements by period.
    whyItMatters: Public traction and financing data do not establish earnings quality, margin path, or runway.
    diligencePath: >-
      Request the latest audited financial statements plus management accounts bridging revenue, gross margin, opex, and
      cash burn.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: private-evidence-only
    severity: blocking
    topic: credit-performance
    missingEvidence: Portfolio delinquency, write-off, recovery, and funding-cost metrics for PAYG receivables.
    whyItMatters: Customer-finance performance determines whether volume growth converts into real margin and cash generation.
    diligencePath: >-
      Request vintage curves, PAR buckets, charge-off policy, recoveries, and warehouse or securitisation terms by
      market.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Country-level price sheets, average selling prices, discount policy, and financing fee/APR disclosure by SKU.
    whyItMatters: >-
      Public pages confirm product categories but do not show what customers actually pay or what margin each offer
      carries.
    diligencePath: Obtain current price books, sample contracts, and realized ASP by product family and country.
    relatedQuestionRefs:
      - QI002
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: working-capital
    missingEvidence: Cash balance, debt covenants, borrowing costs, advance rates, and runway under the current growth plan.
    whyItMatters: >-
      External debt and equity are clearly important, but the assigned public evidence does not show whether liquidity
      is comfortably funded.
    diligencePath: Request treasury reporting, debt agreements, covenant headroom, and a 12- to 24-month liquidity forecast.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-security-privacy
    missingEvidence: >-
      Public security/privacy architecture, status-history or SLA reporting, incident disclosures, and third-party
      assurance beyond hardware quality checks for PAYG, remote diagnostics, and customer-data handling.
    whyItMatters: >-
      The product includes financing and device-control logic, so underwriting product reliability without public
      operational or data-governance evidence would overstate maturity.
    diligencePath: >-
      Request privacy and security documentation, incident history, service uptime records, and any third-party control
      audits from Sun King.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-and-integration-signal
    missingEvidence: >-
      Public developer-signal or practitioner-community proxy showing API, integration, or installer/technician
      discussion depth for current systems.
    whyItMatters: >-
      External technical adoption signals help test whether the platform has reusable integration depth beyond marketing
      copy and product sheets.
    diligencePath: >-
      Request public API/docs, partner integration references, installer forums, or another practitioner-community proxy
      for the current product line.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal, repeat-purchase, and loan-delinquency or default cohorts by vintage and market.
    whyItMatters: >-
      Customer durability is the core missing proof point in public materials, and it directly affects valuation quality
      and credit-risk underwriting.
    diligencePath: >-
      Request cohort tables from management and lender materials covering active accounts, write-offs, and repeat
      purchases by country and product tier.
    relatedQuestionRefs:
      - QU004
      - QU007
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-customer, top-partner, top-channel, and segment or geography revenue concentration.
    whyItMatters: >-
      Expansion can look strong while revenue remains concentrated in a few countries, channels, or institutional
      programs.
    diligencePath: >-
      Request revenue concentration and channel mix from board, lender, or diligence-room materials and reconcile them
      to current deployment geographies.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: named-customer-economics
    missingEvidence: Contract length, repayment status, and realized savings or uptime for named customer stories.
    whyItMatters: >-
      Named proof is directionally useful but does not by itself show that reference deployments convert into durable
      unit economics.
    diligencePath: >-
      Ask for customer-reference call notes, repayment history, and before/after cost or uptime data for a sample of
      household, SMB, and institutional accounts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory-record
    missingEvidence: >-
      Primary regulator, licensing, court, enforcement, recall, safety, privacy, cybersecurity-incident, and
      material-outage records for each operating country.
    whyItMatters: >-
      These records are required to distinguish an unobserved issue from a verified clean history and to assess whether
      core PAYGo or product practices face restrictions.
    diligencePath: >-
      Commission country-by-country regulator and court searches, obtain all active licences and regulator
      correspondence, and reconcile results to management's legal register.
    relatedQuestionRefs:
      - QR002
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: portfolio-credit-performance
    missingEvidence: >-
      Monthly vintage curves for delinquency, default, write-off, recovery, deactivation, reactivation, repossession,
      and cash collection by country and product.
    whyItMatters: >-
      PAYGo receivables and their financing structures cannot be underwritten from loan originations, products sold, or
      funding raised alone.
    diligencePath: >-
      Reconcile audited servicing tapes to the general ledger, securitisation reports, covenant calculations, and cash
      collections for at least 36 months.
    relatedQuestionRefs:
      - QR005
      - QR008
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: product-quality-and-service
    missingEvidence: >-
      Product cohort failure rates, warranty claims, recalls, safety events, repair times, spare-parts fill rates,
      warranty reserves, and supplier concentration.
    whyItMatters: >-
      A claimed ten-year battery life and rapid product expansion create obligations that cannot be assessed from
      specifications and warranty promises alone.
    diligencePath: >-
      Sample serial-number cohorts, test reserve adequacy, inspect supplier agreements, and review quality audits,
      incident logs, and service-level performance.
    relatedQuestionRefs:
      - QR003
      - QR007
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: governance-and-financing
    missingEvidence: >-
      Current cap table, shareholder rights, board composition, debt maturities, covenant headroom, undrawn liquidity,
      lender concentration, and cross-default terms.
    whyItMatters: >-
      Founder voting control and dependence on external finance can change downside protections, refinancing
      flexibility, and minority-investor influence.
    diligencePath: >-
      Review shareholder and debt agreements, board materials, treasury forecasts, covenant certificates, and
      lender-level exposure schedules.
    relatedQuestionRefs:
      - QR004
      - QR006
      - QR010
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-preferences
    missingEvidence: >-
      Current fully diluted cap table, security classes, liquidation preferences, investor rights, board-control terms,
      and dilution from the latest financing.
    whyItMatters: >-
      Common-equity ownership and downside protection cannot be determined from financing dates or aggregate funding
      totals.
    diligencePath: >-
      Obtain the signed latest financing documents, capitalization ledger, option schedule, and modeled liquidation
      waterfall from the company and lead investor.
    relatedQuestionRefs:
      - QV010
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited consolidated financial statements and country-level revenue, margin, cash-generation, and working-capital
      detail.
    whyItMatters: >-
      A price-sensitive valuation requires verified earnings quality and capital intensity rather than operating-volume
      claims.
    diligencePath: Review audited statements, management accounts, debt schedules, and country contribution-margin bridges.
  - type: private-evidence-only
    severity: material
    topic: portfolio-credit-performance
    missingEvidence: >-
      Static-vintage delinquency, default, write-off, recovery, prepayment, and repeat-purchase data for financed
      customers.
    whyItMatters: Credit losses and collection durability determine whether PAYG growth compounds or destroys equity value.
    diligencePath: >-
      Reconcile portfolio dashboards to audited accounts and lender reports, then stress loss rates by country and
      product cohort.
  - type: missing-source
    severity: material
    topic: comparable-valuations
    missingEvidence: >-
      Public-company, private-round, or M&A references with matched business mix, economics, date, and transaction
      value.
    whyItMatters: The broad competitor lists in the assigned evidence do not establish an independent valuation range.
    diligencePath: >-
      Commission a transaction-comps set using verified deal values and normalize each comparable for financing mix,
      geography, growth, margin, and credit exposure.
