company:
  name: "Sun King"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Sun King presents as a scaled off-grid solar platform with a long operating
    history, multiple late-stage funding announcements, and unusually broad
    field distribution infrastructure, but the current refresh pool still leaves
    material uncertainty around headquarters, total funding, employee count, and
    which of several company-reported scale figures should be treated as
    canonical.
sections:
  - id: "identity-and-model"
    title: "Identity, positioning, and operating model"
    body: >-
      Retained official and independent sources consistently describe Sun King
      as an off-grid solar company serving households and small businesses in
      weak-grid or off-grid markets across Africa and Asia. The current official
      homepage says the company installs and finances solar power for the 1.8
      billion people who live off the reliable grid, while the Nigeria product
      page shows the offering spans solar home systems, appliances, and larger
      AC-capable systems rather than a single lantern SKU. The June 2026 General
      Atlantic announcement and a matching Tech Funding News report both say the
      business was founded in 2007 as Greenlight Planet and rebranded as Sun
      King, giving later chapters a usable identity baseline even though the
      precise legal-entity footprint and corporate domicile remain only partly
      corroborated in the assigned evidence.
    claimRefs: ["CO001", "CO002", "CO003", "CO014"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Founders, leadership, and governance concentration"
    body: >-
      The current pool identifies the founding group and shows durable founder
      control, but it is still thin on formal governance documentation. Tech
      Funding News names Anish Thakkar, Mayank Sekhsaria, and T. Patrick Walsh
      as founders, and Fortune lists Walsh as CEO as of September 2026. The key
      governance signal is stronger than the management disclosure itself:
      General Atlantic's June 2026 financing announcement says the founders
      retain voting control, and Sun King's December 2022 Series D extension
      post says LeapFrog joined a board that already included General Atlantic,
      M&G Investments, and first investor Prabha Sinha. That structure implies
      key-person dependence remains meaningful because outside capital appears
      influential but not controlling from the evidence retained here.
    claimRefs: ["CO004", "CO006", "CO007", "CO008", "CO013"]
    tableRefs: ["TO002", "TO003"]
  - id: "funding-scale-and-current-disclosure"
    title: "Funding history, scale claims, and disclosure quality"
    body: >-
      Public financing evidence confirms a substantial late-stage capital base
      but not one clean latest total. General Atlantic announced a $260 million
      Series D in June 2026, while Sun King's own December 2022 release said an
      additional $70 million brought that Series D to $330 million and was used
      partly for secondary exits. A Tracxn profile goes further and describes
      Sun King as a Nairobi-based Series D company with $552 million raised, but
      the assigned pool does not expose the underlying round-by-round ledger.
      Disclosure quality is similarly uneven on operating scale: General
      Atlantic's June 2026 post said Sun King had powered 82 million people
      across 40 countries, Sun King's December 2022 release said 95 million
      people, and the South Africa about page instead foregrounds 41,000+ field
      agents and 440+ shops in 15 countries. Those signals establish real scale
      but not one canonical customer, people-served, or headcount figure for
      this refresh.
    claimRefs: ["CO005", "CO009", "CO010", "CO011", "CO014", "CO015"]
    figureRefs: ["FO001"]
  - id: "open-identity-and-refresh-risks"
    title: "Refresh-specific gaps and contradictions"
    body: >-
      The chapter is usable as a ground-truth starting point for later work, but
      several identity fields should be treated as provisional. Fortune lists
      Chicago as headquarters, while Tracxn says Nairobi; neither claim is
      corroborated by the official pages retained in this pool, which focus on
      product and distribution rather than corporate domicile. Likewise, the
      same source set does not provide a clean public valuation, audited
      financial disclosure, or a directly comparable customer count. The most
      important diligence task for later chapters is therefore not more
      narrative description but reconciliation: legal-entity headquarters,
      lifetime funding, employee count, and the company's preferred scale metric
      all need primary documentation or management confirmation before they
      should be used as cover-page facts.
    claimRefs: ["CO011", "CO012", "CO014", "CO015", "CO016"]
