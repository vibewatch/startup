company:
  name: Sun King
chapter:
  number: 8
  title: Valuation
  summary: >-
    Sun King merits continued tracking, but the assigned evidence does not support a price-sensitive
    buy decision: financing momentum and operating scale are visible while current valuation, share
    terms, credit performance, and exit economics remain undisclosed. The appropriate stance is
    research more, with high underwriting risk until private diligence establishes a defensible entry.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is track and research more, not buy. Sun King has repeatedly attracted
      equity and debt capital, including a company-announced $40 million equity investment in
      December 2025, and two independent market-data pages show another financing event in September
      2026. Those pages do not expose a usable round amount or valuation, however, so they establish
      financing activity rather than an investable price. Tracxn's 54/100 score and nineteenth-place
      ranking in its broad active-competitor set provide an adverse signal, but not a valuation
      benchmark. Without current share-class economics, liquidation preferences, audited earnings,
      or portfolio-loss data, a numeric entry range would be false precision. Any investment decision
      should therefore remain conditional on private documents and a return case built from actual
      terms rather than funding headlines.
    claimRefs: [CV003, CV004, CV005, CV006, CV013, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-control-context
    title: Financing and control context
    body: >-
      The historical capital base is substantial but not fully reconcilable from public evidence.
      TechCrunch reported a $260 million Series D in April 2022, while a university-hosted,
      company-originated announcement specified that $100 million was primary capital and that the
      founders retained board voting control at that time. Sun King's own December 2025 release added
      $40 million of equity for product and distribution expansion. Tracxn now reports $552 million
      raised across nineteen rounds, but the assigned sources do not provide a complete split among
      equity, corporate financing, project finance, and debt. The evidence therefore supports
      confidence in access to capital, not confidence in current capitalization, dilution, preference
      overhang, or the value attributable to common equity.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
  - id: thesis-antithesis-and-scenarios
    title: Thesis, anti-thesis, and scenarios
    body: >-
      The thesis is that Sun King combines product design, installation, service, last-mile
      distribution, and consumer credit in one platform. Company materials report $1.4 billion of
      customer financing, growth from 10,000 kits per month in 2017 to more than 330,000, and a target
      of one million kits per month by 2030.       EquityZen independently describes the integrated design, distribution, installation, and
      financing model, while independent coverage citing GOGLA reports meaningful PAYG-solar revenue
      share. The anti-thesis is that the key current operating indicators remain company-issued and
      cannot be converted into equity value without audited margins, cash
      generation, credit-loss vintages, and round terms. The bull case requires independent proof that
      scale produces durable economics; the base case preserves momentum but applies strict price
      discipline; the bear case begins when capital needs or credit losses outrun operating returns.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV014, CV015]
    tableRefs: [TV002, TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Public exit readiness is not demonstrated. Caplight identifies private financing history but
      withholds underlying filing coverage from the public page, and neither assigned market-data
      source provides a current secondary price, comparable transaction value, or credible path from
      enterprise value to common-equity proceeds. The decisive diligence package is therefore the
      latest capitalization table, signed financing documents, liquidation waterfall, investor-rights
      schedule, audited consolidated accounts, country profitability, and static-vintage PAYG credit
      data. A clean preference stack, controlled losses, and repeatable cash generation at a
      price that meets the target return could improve the recommendation. Heavy senior claims,
      weak collections, or a valuation step-up unsupported by audited economics are thesis-break
      triggers and should move the decision from track to pass.
    claimRefs: [CV005, CV006, CV008, CV014, CV015, CV016]
