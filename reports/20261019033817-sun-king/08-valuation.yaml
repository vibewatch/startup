      - ["Anti-thesis: valuation opacity", "The September 2026 financing is visible in two market-data sources, but amount and valuation are not publicly usable.", "Signed round documents and a fully diluted cap table could make entry pricing underwritable."]
      - ["Anti-thesis: broad peer rank is not a comp", "Tracxn ranks Sun King nineteenth with a 54/100 score, but provides no comparable transaction valuation.", "Model-appropriate transaction multiples with matched economics could support a relative range."]
    notes: >-
      Company-issued operating statements are identified as such; the broad competitor score is an
      adverse context signal, not an independent valuation benchmark.
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Evidence-backed assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Monthly kit volume advances toward the 2030 target while audited losses and margins prove durable.", "A premium could be supportable only at terms that still clear the target return after the preference waterfall.", "Strengthens with audited cash generation and independently verified credit vintages.", "Expansion consumes capital without improving cash economics."]
      - [Base, "Distribution and financing scale continue, but public financial and round-term disclosure stays limited.", "No numeric range is supportable; engage only after obtaining price, dilution, and downside-protection terms.", "Best aligned with the currently assigned evidence.", "A proposed entry price assumes unverified profitability or loss performance."]
      - [Bear, "Credit losses, country economics, or senior claims are materially worse than company growth indicators imply.", "Common-equity value may fall even if product volume grows; pass unless price fully absorbs the impairment.", "Strengthens if diligence reveals weak collections, heavy preferences, or recurring external-capital dependence.", "No credible path from operating scale to distributable common-equity proceeds."]
    notes: >-
      Scenarios are qualitative because revenue, audited earnings, current valuation, portfolio-loss
      vintages, and security terms are absent from the assigned evidence; no probabilities or numeric
      ranges are estimated.
    claimRefs: [CV003, CV005, CV009, CV014, CV015, CV016]
