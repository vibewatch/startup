  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capitalization-and-preferences
      missingEvidence: Current fully diluted cap table, security classes, liquidation preferences, investor rights, board-control terms, and dilution from the latest financing.
      whyItMatters: Common-equity ownership and downside protection cannot be determined from financing dates or aggregate funding totals.
      diligencePath: Obtain the signed latest financing documents, capitalization ledger, option schedule, and modeled liquidation waterfall from the company and lead investor.
      relatedQuestionRefs: [QV010]
    - type: private-evidence-only
      severity: material
      topic: audited-financials
      missingEvidence: Audited consolidated financial statements and country-level revenue, margin, cash-generation, and working-capital detail.
      whyItMatters: A price-sensitive valuation requires verified earnings quality and capital intensity rather than operating-volume claims.
      diligencePath: Review audited statements, management accounts, debt schedules, and country contribution-margin bridges.
    - type: private-evidence-only
      severity: material
      topic: portfolio-credit-performance
      missingEvidence: Static-vintage delinquency, default, write-off, recovery, prepayment, and repeat-purchase data for financed customers.
      whyItMatters: Credit losses and collection durability determine whether PAYG growth compounds or destroys equity value.
      diligencePath: Reconcile portfolio dashboards to audited accounts and lender reports, then stress loss rates by country and product cohort.
    - type: missing-source
      severity: material
      topic: comparable-valuations
      missingEvidence: Public-company, private-round, or M&A references with matched business mix, economics, date, and transaction value.
      whyItMatters: The broad competitor lists in the assigned evidence do not establish an independent valuation range.
      diligencePath: Commission a transaction-comps set using verified deal values and normalize each comparable for financing mix, geography, growth, margin, and credit exposure.
