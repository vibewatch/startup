callouts:
  - calloutType: risk
    title: The Benefit Patchwork and Point-Solution Fatigue Headwind
    body: While enterprise customer acquisition remains robust with over 2,000 clients, Maven's own employer survey reveals that rapid addition of fragmented point solutions has led to declining employee confidence across fertility, preconception, and adoption benefits. To sustain customer durability, Maven must prove its consolidated platform eliminates vendor confusion and delivers measurable claims ROI rather than adding administrative complexity.
    claimRefs:
      - CU015
      - CU016
