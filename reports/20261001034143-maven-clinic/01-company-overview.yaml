callouts:
  - calloutType: "strength"
    title: "Category Leadership in Virtual Care Network Scale"
    body: "Maven Clinic has built an expansive digital healthcare footprint spanning more than 2,000 corporate clients, 28 million covered lives, and 30 provider specialties across 175 countries [CO003, CO004]. Its proven ability to contract with Fortune 15 enterprises such as Microsoft demonstrates high enterprise retention and meaningful clinical validation, including published claims of up to 27% fewer NICU admissions [CO003, CO008]."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO008"
  - calloutType: "risk"
    title: "Fragmented Point-Solution Fatigue and Benefit Perceptions"
    body: "According to Maven's 2026 State of Women's and Family Health Benefits report, despite employers increasing women's and family health benefits by an average of 39% year over year, employee confidence that benefits support them 'very well' declined by 10% [CO004, CO007]. Furthermore, 27% of women reported delaying or skipping routine care due to access barriers, highlighting the risk that adding unintegrated benefit programs fails to resolve underlying member friction [CO004, CO007]."
    claimRefs:
      - "CO004"
      - "CO007"
