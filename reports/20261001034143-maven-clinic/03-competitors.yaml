callouts:
  - calloutType: "strength"
    title: "Multi-Stage Continuum as a Competitive Moat"
    body: "Unlike point solutions restricted to single episodes like IVF or hormonal imbalance, Maven Clinic captures members across a multi-year continuum from preconception and maternity to pediatrics and menopause. This continuous lifecycle coverage creates high switching barriers for enterprise employers seeking to avoid digital health point-solution fatigue [CP001, CP002, CP008]."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP008"
  - calloutType: "risk"
    title: "Vendor Consolidation and Health Plan Bundling Pressure"
    body: "As enterprise employers evaluate healthcare spending, legacy health plans and broad telemedicine conglomerates (such as MDLIVE and Amwell) increasingly offer bundled virtual care. If payer incumbents enhance native maternity navigation, standalone specialty vendors face ongoing procurement resistance [CP003, CP004, CP009]."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP009"
