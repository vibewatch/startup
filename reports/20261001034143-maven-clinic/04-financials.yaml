callouts:
  - calloutType: insight
    title: "Value-Based Clinical ROI Drives Enterprise Pricing Power"
    body: "Maven's ability to document tangible hospital spend reductions—including $70,000 per avoided NICU admission and $11,500 per delivery shifted from cesarean to vaginal birth—allows it to command a $2,300 average annual revenue per enrolled member, far outstripping commoditized digital health navigation tools."
    claimRefs:
      - CI001
      - CI007
      - CI009
  - calloutType: risk
    title: "Asset-Light Model Shields Balance Sheet but Exposes Margin to Network Pricing"
    body: "While Maven avoids clinic construction capex and medical practice liability by contracting with independent telehealth providers, it sacrifices vertical margin capture to clinic-owning competitors like Kindbody and remains exposed to provider compensation inflation as clinical labor costs rise."
    claimRefs:
      - CI010
