companyProfile:
  summary: >-
    Maven Clinic is a late-stage private digital health company focused on women's and family health, combining
    employer-sponsored benefits, payer partnerships, and direct-to-consumer programs into a single virtual care
    platform. Founded by Kate Ryder and headquartered in New York City, the company claims more than 2,300 employer and
    health plan customers across 175 countries, with offerings spanning fertility, maternity, parenting, menopause, and
    adjacent programs. Its business model blends recurring enterprise platform fees, program and wallet administration
    fees, and consumer subscriptions, while its funding history culminated in a $125 million Series F at a $1.7 billion
    valuation.
  founders:
