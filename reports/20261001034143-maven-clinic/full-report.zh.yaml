      - number: '1.2'
        title: 高管团队、公司治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Maven 的高管团队与公司治理由创始人 Kate Ryder 及机构董事代表共同坐镇 [CO001, CO008]。Ryder 创立 Maven
              的起因，是察觉到传统商业健康保险与雇主福利方案对女性就医全程缺乏系统研究，服务也长期缺位 [CO006, CO008]。平台产品方向由首席产品官 Jason Lee
              等产品负责人主导，统一调度专科远程诊疗、异步消息沟通与临床 AI 导航等数字化工作流 [CO002, CO009]。Maven 董事会吸纳了来自 Dragoneer Investment Group 的风险投资人
              Eric Jones 和 Lux Capital 的 Deena Shakir，两人在机构联合领投 Maven Series D 轮融资后入局
              [CO008]。这套治理架构虽带来了机构资本与企业医疗专长，但关键人物风险依然高度系于 Ryder 一人，其个人愿景与公众影响力是维系大客户信任和推进战略融资的核心支柱 [CO001,
              CO008]。随着业务迅速延伸至异步 AI 工具和 DTC 药房管理，监管要求与临床合规把控随之收紧，亟须引入更多独立临床力量扩充治理结构 [CO007, CO009]。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
