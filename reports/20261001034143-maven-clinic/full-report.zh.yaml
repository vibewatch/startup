      - number: '1.3'
        title: 资本历程、规模指标与信息缺口
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic 累计获得超过 $425 million 机构股权融资，走过早期种子轮与风险投资阶段，并于 2021 年 8 月完成由 Dragoneer Investment Group 与 Lux
              Capital 联合领投的 $110 million Series D 轮融资，参投方包括 BOND、Sequoia Capital、Oak HC/FT、Icon Ventures 以及 Oprah
              Winfrey [CO004, CO008]。这条资本路径确立了 Maven 作为家庭福利领域标杆独角兽的地位，在非公开融资轮次中估值达到 $1.7 billion [CO004]。IPO
              前老股的二级市场流动性主要经由 EquityZen 等平台流转，老股东与早期员工在此交易非公开份额 [CO002]。在商业版图上，Maven 自述业务覆盖 175 个国家，拥有超过 2,300
              家企业雇主合作伙伴，包括 Microsoft、Amazon、L'Oreal 与 Boston Scientific 等大型企业客户 [CO003, CO008]。但作为私营企业，Maven 并未公开披露经审计的
              GAAP 财务报表、经营现金消耗速度、净留存率（NRR）或确切的员工人月（PEPM）阶梯定价，其顶层收入运行率估算与单体经济模型仍是尽调的关键待解缺口 [CO010, CO011, CO012]。
            claimRefs:
