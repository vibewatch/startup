  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群细分、支付方协同与交付渠道
        blocks:
          - type: paragraph
            body: >
              Maven Clinic
              的商业客群主要划分为三大采购主体：自保型大企业雇主、商业健康险计划与区域团体福利承保机构，以及直接面向消费者的自费会员。在大企业雇主板块，企业人力资源负责人、首席人才官及薪酬福利总监按每名员工每月（PEPM）费率采购企业准入包，由雇主全额买单，向员工及合规家属免费开放虚拟诊所。在健康计划与支付方板块，区域及全球保险机构（如加拿大宏利金融
              Manulife Canada）与 Maven 签约，将专科虚拟诊疗直接嵌入参保员工团体福利与数字健康生态。与此同时，Maven
              开辟了直接面向消费者的自费渠道，向个人提供脱离传统雇主福利支持的自费就医、激素调理或代谢管理项目。在交付与采购环节，Castlight Health 等医疗就医导航平台与生态伙伴发挥了桥梁作用，将 Maven
              预先集成到企业福利门户中，简化供应商准入与员工使用流程。
