  - id: TV003
    title: 乐观 / 基准 / 悲观情景推演表
    columns:
      - 情景
      - 收入 / 经营假设
      - 隐含估值 / 估值倍数
      - 核心风险与阻力
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 同比增长 40% 达到 $375M；Medicaid 全风险共担合同顺利规模化放量；生育福利向全球市场扩张。
        - 对应股权估值 $2.5B（6.7x 远期收入）；赛道龙头地位与完备的上市筹备支撑估值溢价。
        - 跨国福利落地存在执行阻力，管理式医疗面临沉重监管合规负担。
        - 25% —— 取决于企业福利开支保持强劲，并在 18 个月内成功上市。
      - - 基准情景
        - ARR 同比增长 25% 达到 $335M；2,000+ 家雇主保持稳固留存；部分风险共担合同稳态运行。
        - 对应股权估值 $1.7B（5.1x 远期收入）；估值维持稳定，守住 F 轮优先股基准价格。
        - 大企业销售周期拉长；公开市场数字医疗可比公司估值倍数温和承压。
        - 55% —— 综合反映当前平台规模、已验证的临床黏性以及宏观经济现状。
      - - 悲观情景
        - ARR 同比增速降至 10% 达 $295M；风险共担合同亏损拖累毛利率走低；腰部中端市场雇主客户出现流失。
        - 对应股权估值 $885M（3.0x 远期收入）；倍数压缩导致流血融资或老股深度折价。
        - 企业大幅削减福利预算；更年期缺乏标准化报销代码；大客户集中度过高。
        - 20% —— 若大企业客户续约率下滑或宏观医疗 IT 开支急剧萎缩，将触发该情景。
    notes: 情景推演模型采用远期企业收入倍数，参数源于一级市场融资估值与数字医疗行业基准。
    claimRefs:
      - CV001
      - CV003
      - CV013
      - CV014
