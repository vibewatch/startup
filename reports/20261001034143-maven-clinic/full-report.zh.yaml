    title: 企业客户生命周期与平台拓展旅程
    type: journey-map
    summary: 结构化旅程图展示了跨越整个健康周期的雇主引入、会员临床接触点及客户增购扩张闭环。
    data:
      items:
        - label: 1. 企业采购与经纪人引入
          value: Employer Evaluation
          detail: 企业 HR 福利负责人评估 PEPM 定价、理赔主张数据打通可行性，并参考 Castlight 或健康险合作方的经纪人建议
          touchpoints:
            - RFP 招标与经纪人宣讲
            - 福利平台系统集成
            - 安全与合规审计
        - label: 2. 对话式会员接入与分诊分流
          value: Active Onboarding
          detail: 参保员工针对生育、孕期、儿科或更年期需求，进入对话式数字化登记导诊
          touchpoints:
            - 移动端 App 注册
            - 对话式症状评估
            - 匹配专属健康协调员（Care Coordinator）
        - label: 3. 多专科远程在线问诊
          value: Care Delivery
          detail: 会员预约接入 30+ 个专科的线上诊疗，涵盖妇产科医生（OB-GYN）、心理健康专家及导乐师
          touchpoints:
            - 即时音视频问诊
            - 兼顾文化背景的医生匹配
            - 处方流转与导医指引
        - label: 4. 跨生命周期平滑转诊
          value: Lifecycle Retention
          detail: 各诊疗阶段顺畅交接，完整保留从备孕生育、产后康复、儿科护理直至中年健康的既往病历
          touchpoints:
            - 产后抑郁筛查
            - 返岗复工辅导
            - 儿科分诊支持
        - label: 5. 临床 ROI 报告与合同续约
          value: Annual Account Renewal
          detail: 雇主基于理赔支出节省主张、NICU 入住减少及员工满意度评估，为多年期续约提供依据
          touchpoints:
            - 基于理赔数据的年度 ROI 报告
            - 返岗复工留任率指标
            - 增购更年期或 Maven Wallet 模块
        - label: 6. 价值导向的多年期平台深度拓展
          value: Enterprise Scale
          detail: 客户合作向海外分支机构、全球福利导航以及个人自费增值包延伸
          touchpoints:
            - 跨国多区域推广落地
            - 全球药房及福利钱包覆盖
            - 激素与代谢健康可选服务
    approximationNotes: 结合 Maven 的诊疗生命周期和企业雇主采购流程，搭建的企业客户旅程阶段模型。
    claimRefs:
      - CU001
      - CU006
      - CU008
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 风险矩阵按发生概率与残留严重程度，绘制关键法律、运营及商业风险敞口。
    data:
      columns:
        - 低残留风险
        - 中残留风险
        - 高残留风险
      rows:
        - label: 各州生殖立法与差旅福利
          values:
            - null
            - null
            - text: 高残留风险
              tone: critical
              detail: 各州生殖医疗准入规定冲突，推行员工差旅报销面临潜在法律责任
        - label: CPT 孕产计费代码拆分
          values:
            - null
            - text: 中残留风险
              tone: warning
              detail: 2027 年 CPT 代码拆分，导致高危分娩收费明细面临支付方严密审视
            - null
        - label: AI 报销决策执行
          values:
            - null
            - text: 中度剩余风险
              tone: warning
              detail: 依托双模型共识机制降低自动化报销错误，并辅以人工审计
            - null
        - label: 企业客户预算与流失风险
          values:
            - null
            - null
            - text: 高度剩余风险
              tone: critical
              detail: 大型雇主面临公司预算收紧压力以及单点方案采购疲劳
        - label: 签约临床医生供给与执业执照
          values:
            - text: 低度剩余风险
              tone: neutral
              detail: 覆盖 30+ 专科领域的 1,000+ 名临床医生，缓解单点供给瓶颈
            - null
            - null
        - label: 网络安全与网络钓鱼仿冒
          values:
            - text: 低度剩余风险
              tone: neutral
              detail: 严格执行邮件域名管控并落实 NIST 事件响应演练
            - null
            - null
    approximationNotes: 剩余风险评级综合已披露的技术安全防护、临床产出以及法律法规合规敞口评定。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR007
      - CR009
      - CR010
      - CR012
      - CR014
  - id: FV001
    title: 建议决策逻辑
    type: flow
    summary: 连接企业规模、临床产出、风险因素及估值倍数直至得出最终建议的序贯决策框架。
    claimRefs:
      - CV002
      - CV006
      - CV011
      - CV012
    approximationNotes: 这是分析维度的决策层级，不是经验统计流程。
    data:
      nodes:
        - id: N1
          label: 1. 企业规模
          description: 28M 受益人群，2,300+ 家客户（包括 Amazon 与 Microsoft），验证了商业化落地能力
        - id: N2
          label: 2. 临床 ROI 证据
          description: 公开发布的 2:1 ROI 与 NICU 入住率降低 27%，推动了雇主留存与参与度
        - id: N3
          label: 3. 毛利与报销风险
          description: 向部分风险共担合同转型，而更年期护理仍缺少成熟的支付方报销代码与赔付主张
        - id: N4
          label: 4. 资本与融资底盘
          description: $125M Series F 轮及 $425M+ 累计融资，为资产负债表提供了充裕的运营现金跑道
        - id: N5
          label: 5. 估值倍数
          description: 当前 $1.7B 投后估值对应约 6.3x 收入倍数，高于 2-4x 的上市可比公司中位数
        - id: N6
          label: 6. 建议态度
          description: 投资建议维持「观察」（Track），估值判断偏高；等待经审计 GAAP 财务数据或估值倍数回调
      edges:
        - from: N1
          to: N2
          label: 验证
        - from: N2
          to: N3
          label: 支撑
        - from: N3
          to: N4
          label: 缓冲
        - from: N4
          to: N5
          label: 定价
        - from: N5
          to: N6
          label: 导出结论
