      - number: '3.3'
        title: 切换成本、分销锁定与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic 的竞争护城河来自与雇主及支付方的深度绑定、贯穿多阶段的长期服务关系，以及有据可查的临床投资回报 [CP001, CP005, CP008]。依托 B2B2C 架构，Maven
              直接接入企业福利系统和健康计划工作流，再用跨部门业务分析、用户行为分析及客户专属报告量化服务价值 [CP005]。经同行评审研究与雇主理赔数据验证，上述临床成效主张切实减少了高额医疗支出事件，包括将 NICU
              入院率降低至多 27%，且 30% 的生育项目会员无需辅助生殖技术即成功受孕 [CP001]。服务 2,300+ 家企业雇主、全球覆盖超过 28 million 人群的规模体量，让 Maven 在 30+
              个专科领域构建起显著的网络效应 [CP001, CP007]。但随着企业整合供应商，切换成本面临冲击：雇主人力资源福利团队背负压力，倾向于将零散单点方案打包进大型健康计划平台或全科远程医疗套件 [CP003,
              CP004, CP009]。护城河能否持久，关键取决于 Maven 能否持续拿出优于传统健康计划与同质化远程医疗竞品的临床疗效 [CP001, CP009]。
