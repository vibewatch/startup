  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现架构
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic 依靠多层级的 B2B2C 商业模式获取收入，融合了企业经常性准入费、按会员收取的临床使用费以及福利管理费。在企业端，雇主与健康计划赞助方每年支付一笔基础平台费以开通机构准入权限，估计在
              $20,000 至 $40,000 之间。除平台准入费外，雇主还会签约涵盖备孕规划、生育支持、孕产护理与儿科导航的专属临床项目，按参保员工计费，年费在每人 $700 至 $950 之间。随着 Maven
              Managed Benefit 和 Maven Wallet 的上线，公司负责管理雇主出资的生育与孕产报销账户，每年向每位参保人收取估计 $800 的管理费。作为对核心 B2B2C 企业合同的补充，Maven
              进一步延伸至雇主福利体系之外的直接面向消费者（DTC）订阅服务，覆盖虚拟问诊、GLP-1 专项体重管理及激素护理。
