      - number: '6.4'
        title: 客户持久度、单点方案疲劳与集中度隐患
        blocks:
          - type: paragraph
            body: >
              尽管企业客户版图庞大，但缺乏透明度与新兴客户逆风让客户持久度承压。Maven Clinic
              并未公开披露经审计的净收入留存率（NRR）、毛收入留存率（GRR）、年度客户流失率、平均合同期限，或头部前几大客户的收入集中度。虽然公司自述调研显示参与员工的重返职场（或计划重返）比例达
              94%，但企业客户的情绪却显露出日益加剧的单点方案疲劳：Maven 针对 2,071 名 HR 主管和 4,964 名全职员工的调研发现，虽然雇主提供的妇女和家庭福利单项服务同比增加了
              39%，但员工对福利充足度的信心却在几乎所有门类中普遍下滑——生育福利信心由 55% 降至 49%，孕前关怀信心由 65% 降至 56%。面对杂乱拼凑的单点工具与不断通胀的保费（2025 年家庭保费已接近
              $28,000），雇主在福利续约时面临更严苛的采购审查；若专科就医导航无法证明综合经济回报，客户流失风险将显著上升。
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 展品
        blocks:
          - type: callout
            title: 碎片化福利拼盘与单点方案疲劳逆风
            body: >-
              尽管企业获客势头强劲、拥有超 2,000 家客户，但 Maven 自身开展的雇主调研称，碎片化单点工具的过快增加导致员工对生育、孕前及收养福利的信心普遍下滑。为维系客户持久度，Maven
              必须证明其一体化平台能消除供应商冗余混乱并带来可量化的理赔投资回报，而非增添管理负担。
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合规监管、法定要求与生殖政策逆风
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic 所处的美国医疗监管环境正日益碎片化与极化。2022 年最高法院对多布斯案（Dobbs）的裁决引发了针对生殖健康服务的严苛地域限制，促使 Maven
              拓展由雇主出资的异地就医差旅报销与怀孕方案咨询服务 [CR001]。这些特色服务使 Maven 及其企业雇主客户面临潜在的跨州法律挑战、民事责任风险以及各州执法冲突 [CR002]。与此同时，全美 25
              个州及华盛顿特区相继出台州级生育医疗强制保障法令，要求全额投保计划必须履约，但自保型雇主仍暴露于缺乏主动管理的生育理赔开支风险与主张中 [CR002]。此外，联邦支付方与商业健康险计划将于 2027 年 1 月
              1 日起全面取消孕产总包计费代码，产科诊疗将转向细分单项的 CPT 理赔账单行 [CR003]。这一计费重组将使高成本产前干预与 NICU 入院直接置于支付方的微观逐笔审查之下，对 Maven
              临床有效性的评估标准也将更加严苛。与此同时，已有 13 个州与哥伦比亚特区立法实施带薪家事与病假项目，迫使跨州运营的雇主应对复杂的法定福利差异以及日益上升的员工休假协同摩擦 [CR004]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营安全防线、AI 可靠性架构与质量治理
        blocks:
          - type: paragraph
            body: >-
              随着 Maven Clinic 向自动化与 AI 驱动型医疗平台演进，运营可靠性与临床质量治理已成为核心防线。依托自研的 Maven Intelligence 编排层，Maven
              奉行严格的运营原则：预约挂号等可逆的用户操作允许标准自动化重试；而会员报销理赔主张审批等不可逆的财务操作，则必须取得两套独立 AI 模型的一致同意
              [CR005]。两套模型若出现分歧，理赔申请将自动分流至专门的人工复核团队介入处理 [CR005, CR006]。尽管设立了内部安全护栏，企业客户调研仍显示，88% 的人力资源主管极度担忧员工可能因 AI
              生成的错误建议而做出关键就医抉择 [CR012]。在业务安全防范上，公开的网络安全演练显示 Maven 采纳了 NIST 事件响应流程框架，用以化解模拟的未授权网络异常状况 [CR007]。此外，Maven
              针对冒用企业名义的招聘钓鱼与未授权域名仿冒行为，主动提醒求职者与员工防范，并严格要求所有沟通必须经由认证的企业官方域名流转，以控制外部品牌声誉风险 [CR008]。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
