        title: 展品
        blocks:
          - type: callout
            title: 州级生殖健康法规撕裂带来的合规风险
            body: 各州对生殖医疗政策的撕裂性规定，让 Maven 的异地就医差旅报销与孕情就医指导业务持续面临法律合规风险，迫使其对跨辖区合规展开常态化审计。
            calloutType: risk
