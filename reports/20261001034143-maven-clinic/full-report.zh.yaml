chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、使命与平台架构
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic Co. 是一家后期私营数字医疗企业，由首席执行官 Katherine (Kate) Ryder 于 2014 年创立，总部位于纽约市 [CO001,
              CO002]。作为一家专注于女性与家庭医疗的专业虚拟诊所，Maven 旨在解决生殖、孕产、儿科和中年期护理领域存在的结构性割裂及医疗资源短缺问题 [CO003, CO004]。平台不仅覆盖超过 30
              种专科医疗人员的远程诊疗服务，还配备专属护理顾问（Care Advocates），为会员提供个性化的就医引导与协调 [CO004, CO005]。Maven 早期深耕 B2B 雇主福利模式，现已扩展至全球覆盖超过
              28 million 人群，签约雇主与商业健康计划超过 2,000 家 [CO003, CO004]。2026 年初，公司推出独立的直接面向消费者业务 Maven
              Consumer，进一步扩大业务范围：个人用户可以按需订阅 GLP-1 代谢健康、激素替代疗法和即时虚拟问诊等专属临床服务包 [CO005, CO006]。这种兼顾 B2B2C 与直接触达的混合战略，使
              Maven 更像综合临床基础设施层，而不是狭窄的单点方案；但毛利管理和消费者临床分诊也因此更复杂 [CO007]。
            claimRefs:
