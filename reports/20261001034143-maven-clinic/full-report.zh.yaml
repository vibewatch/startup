      - number: '7.3'
        title: 商业伙伴依赖、大客户集中度与医护供给
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic 采取的 B2B2C 商业模式，使其对企业福利买方、签约临床医护团队与核心技术基础设施形成了高度依赖。在商业拓展上，Maven 重度依赖企业客户的年度续约；虽然其服务全球 2,300
              多家雇主和健康计划合作伙伴（涵盖约半数财富 15 强企业，覆盖超 28 million 人群）[CR009]，但在企业预算缩减与单点方案疲劳的宏观背景下，企业采购团队正加速整合单病种福利。任何财富 500
              强标杆客户的流失，都会直接侵蚀 Maven 的经常性收入基本盘与覆盖人群规模。在业务运营上，Maven 依赖由 30 多个专科、1,000 多名兼职专科远程医疗医护组成的弹性供给网络
              [CR010]。尽管全方位的股权与福利激励有助于稳定核心团队
              [CR014]，但专科招聘短缺、跨州执医执照审批瓶颈与临床外包人员流失，始终构成持续的运力供给风险。这类医护网络供给摩擦也折射出更宏观的就医难现状：独立调研显示，27%
              的女性曾因无法约上医生或排期冲突而推迟或放弃常规健康体检 [CR013]。
            claimRefs:
              - CR009
              - CR010
              - CR013
              - CR014
