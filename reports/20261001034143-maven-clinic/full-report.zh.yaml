      - number: '7.4'
        title: 财务持久度、资本密集度与逻辑破损监测指标
        blocks:
          - type: paragraph
            body: >-
              从财务表现与商业模式风险审视，Maven Clinic 的非公开发行资本结构与激进的国际扩张路线，高度仰赖高利润率的企业端持续增长。2022 年 11 月，Maven 完成由 General Catalyst
              领投的 $90 million Series E 轮融资，投后估值达 $1.35 billion，累计股权融资额达 $300 million [CR011]。然而，Maven 并未公开披露经审计的 GAAP
              财务报表、营业亏损、毛利率明细或精确的现金消耗速率。投资尽调必须密切跟踪四大明确的逻辑破损触发条件（包含核心反方观点）：其一，司法或监管机构下达禁令，限制跨州雇主资助的生殖异地就医差旅报销 [CR001,
              CR002]；其二，年度续约周期中财富 500 强核心客户流失率超过 10% [CR009]；其三，因 AI 编排失误导致重大自动化理赔跑冒滴漏，或引发临床误诊事件 [CR005,
              CR006]；其四，年收入复合增速若滑落至 30% 以下，将引发估值倍数大幅下修或折价轮融资。后续确认性尽调须重点核验非公开的保险赔付记录（loss
              runs）、承保机构理赔结算凭证以及州医疗执照委员会的合规申报案卷。
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR009
              - CR011
