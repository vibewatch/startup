        - 女性与家庭健康赛道绝对龙头，覆盖 28M 人群与 2,300+ 家企业雇主。
        - 综合福利平台加速整合单点方案，大型健康险机构直接入场竞争。
        - Fortune 500 核心雇主客户出现重大流失，或多福利打包销售拓展受阻。
      - - 临床 ROI
        - 临床降本成效已获验证，多家客户实证研究显示 NICU 入住率最高下降 27%，ROI 达到 2:1。
        - 在更年期与中老年健康等新兴板块，难以基于精算理赔数据确立明确的 ROI 主张。
        - 支付方拒绝签署按价值付费报销协议，或拒绝为独立专科临床服务买单。
      - - 报销模式
        - 从按服务收费单列模式，向按价值付费及 Medicaid 风险共担合作延伸。
        - 全额风险合同暗藏承保下行风险，不利临床事件发生时将侵蚀营业利润率。
        - 风险共担合同出现亏损，或 Medicaid 费率下调挤压毛利率。
      - - 老股流动性
        - 头部医疗基金在私募市场需求持续强劲，稳住了独角兽估值底线。
        - 若 IPO 窗口期持续延后，老股市场缺乏流动性且折价压力难解。
        - 老股交易价格较 F 轮优先股价格折价超过 25%。
    notes: 围绕核心执行风险，审视支撑 Maven Clinic 投资逻辑的底层结构性论据。
