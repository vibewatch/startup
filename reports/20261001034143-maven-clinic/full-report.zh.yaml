              和 PwC，覆盖超过 30% 的财富 500 强企业。公开披露的员工与企业案例呈现了切实的组织效益：在
              Microsoft，员工实名记录了直接的经济与就医减负，称避免了非必要的辅助生殖开支，节省数千英镑，并获得了全流程心理支持。分销渠道上，Castlight Health
              构建了全方位育儿支持集成，向其企业客户群提供即插即用的数字诊所服务。在国际化拓展上，加拿大宏利（Manulife Canada）携手 Maven，向其加拿大团体福利参保会员推出虚拟妇女与家庭健康福利，提供
              24/7 数字化导航、覆盖 35 种以上语言的多语种专家咨询，以及量身定制的护理方案，缓解全国性的基础医疗资源紧缺。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
