      - number: '4.2'
        title: 市场拓展路径、合同签订与定价机制
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic
              采取以大企业客户为主导的获客路径，精准锚定自保企业、健康计划与区域支付方机构。商业合同以多年期主服务协议（MSA）形式签署，牌面标价通常会根据总覆盖人群规模、多项目打包组合及落地实施范围给予阶梯折扣。尽管
              Maven 的公开报价对平台准入与各服务模块设定了独立的年费标准，但每个客户的实际净单价高度取决于员工注册率和使用活跃度。商业拓展已扩展至全球 2,300 多家企业客户与健康计划合作伙伴，覆盖超过 28
              million 人群，Amazon 全球员工福利等标杆合作更是提供了强力背书。公司自述企业客户留存率估计达
              98%，印证了其在大型雇主端极强的续约粘性。但固定订阅收入与浮动会员使用费之间的具体构成比例仍属未公开的内部指标，投资评估时须重点审视。
