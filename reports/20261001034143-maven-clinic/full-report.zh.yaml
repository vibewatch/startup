  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 临床服务定义与核心产品线架构
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic 打造了一套端到端数字医疗平台，旨在从孕前到更年期的完整阶段中，贯穿女性及家庭的临床问诊、心理支持与经济报销全流程，提供全方位就医陪伴
              [CE001]。核心产品涵盖四大雇主赞助福利模块：生育与组建家庭（Fertility & Family Building）、孕产与新生儿护理（Maternity & Newborn
              Care）、育儿与儿科（Parenting & Pediatrics），以及更年期与中年健康（Menopause & Midlife Health）[CE002]。围绕这些企业级项目，Maven 为会员提供
              24/7 全天候按需虚拟问诊，专科覆盖妇产科医生（OB/GYN）、持证助产士、导乐、泌乳顾问、儿科医生及心理健康专家等超过 30 种专科方向 [CE003]。除虚拟问诊外，Maven
              还打包提供了配套管理与财务工具，例如用于经办雇主自定生育及家庭组建报销的 Maven Wallet，以及提供专业母乳冷链运输服务的 Maven Milk [CE004]。据公司自述，该护理模式拥有 40
              多项同行评审临床研究以及基于外部理赔数据的实证评估支撑，有力验证了孕产健康改善成效 [CE005]。为在雇主付费基本盘外捕获个人就医需求，Maven 进一步开拓直接面向消费者的自费服务，涵盖代谢健康、品牌
              GLP-1 用药管理与激素治疗 [CE006]。
