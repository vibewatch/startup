    body: "While Maven Clinic commands undisputed leadership in enterprise women's and family health benefits with over 2,300 corporate clients, the prevailing $1.7 billion valuation implies an estimated 6.3x forward revenue multiple in a normalized digital health market. Investors should maintain a Track stance, deferring direct equity commitments until audited margins and cash burn verify whether the business model can support public market multiples."
    claimRefs:
      - "CV001"
      - "CV006"
  - calloutType: "risk"
    title: "Value-Based Contracting and Menopause Reimbursement Uncertainty"
    body: "Maven's strategic push deeper into risk-bearing maternity arrangements introduces actuarial downside exposure if clinical complications outpace contract thresholds. Furthermore, health plans lack standardized claims codes and validated ROI frameworks for menopause care, presenting potential pricing pressure as enterprise benefits budgets face heightened scrutiny."
    claimRefs:
      - "CV007"
      - "CV008"
