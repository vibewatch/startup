      IP litigation (including the Coretek Licensing patent dispute).
    whyItMatters: >-
      Direct verification of legal exposure is essential to evaluate potential indemnification liabilities and
      operational injunctions that could disrupt employer contracts.
    diligencePath: >-
      Subpoena state licensing board dockets and PACER federal court records to confirm current disposition and
      settlement terms of intellectual property disputes.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: clinical-malpractice-and-network-outcomes
    missingEvidence: >-
      Audited clinical loss ratios, historical malpractice claims settlement histories, and individual provider
      credentialing denial rates.
    whyItMatters: >-
      In an on-demand network model of over 1,000 clinicians, latent malpractice exposure or credentialing lapses create
      severe reputational and legal contagion.
    diligencePath: >-
      Review carrier loss run reports, provider credentialing committee logs, and professional liability insurance
      policy declarations during formal confirmatory diligence.
    relatedQuestionRefs:
      - QR008
