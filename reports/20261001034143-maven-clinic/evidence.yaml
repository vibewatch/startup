      API surface.
    diligencePath: Review technical developer documentation and sandbox API specifications under mutual NDA.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited multi-year Net Revenue Retention (NRR), Gross Revenue Retention (GRR), enterprise logo churn rates, and
      cohort renewal figures.
    whyItMatters: >-
      Without audited NRR and renewal cohorts, evaluating true customer durability and platform stickiness amid
      tightening corporate benefits budgets remains speculative.
    diligencePath: >-
      Request confidential historical cohort retention tables, customer expansion case studies, and renewal tracking
      data under NDA during investment diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-5 and Top-10 customer revenue contribution percentages and customer segment revenue distribution (Fortune 500
      enterprise vs. mid-market vs. health plans).
    whyItMatters: >-
      High client concentration among mega-employers (such as Microsoft or AT&T) or health plan partners could expose
      Maven to catastrophic revenue vulnerability if a major account churns.
    diligencePath: Review audited customer revenue concentration schedules and top-customer contract terms in the virtual data room.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: clinical-roi-denominators
    missingEvidence: >-
      Audited portfolio-wide claims studies with control cohorts verifying NICU admission reductions and cesarean
      section decreases across all customer types.
    whyItMatters: >-
      Demonstrating verified claims-based financial return is required by enterprise buyers to overcome point-solution
      fatigue and justify PEPM benefit line items.
    diligencePath: >-
      Obtain actuarial validation reports (e.g., Milliman actuarial evaluations) and customer-specific claims data books
      under NDA.
    relatedQuestionRefs:
