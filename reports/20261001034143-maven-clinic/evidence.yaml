    severity: material
    topic: financial-audits
    missingEvidence: Audited GAAP financial statements disclosing net revenue, cost of goods sold, operating expenses, and cash burn.
    whyItMatters: >-
      Without audited financials, revenue multiples and path to profitability cannot be independently verified prior to
      an IPO.
    diligencePath: >-
      Review S-1 registration statements, confidential investor presentations, or audited financial disclosures under
      NDA.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: retention-concentration
    missingEvidence: >-
      Detailed net revenue retention (NRR), gross revenue retention (GRR), and top-account concentration percentages for
      enterprise clients.
    whyItMatters: >-
      High customer concentration among top tech employers or margin compression in full-risk contracts would directly
      impair base case valuation multiples.
    diligencePath: Request customer cohort retention schedules and contract profitability breakdowns in a formal diligence data room.
    relatedQuestionRefs:
      - QV009
