evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: Audited financial statements detailing Maven's annual revenue, gross margin, operating loss, and cash burn rate.
    whyItMatters: >-
      Without audited financial disclosures, assessments of Maven's revenue multiple and long-term operating durability
      rely on third-party estimates.
    diligencePath: Obtain confidential financial review deck or auditor statement during investor due diligence.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-enumeration
    missingEvidence: >-
      Full exhaustive executive committee and full board of directors roster beyond publicly announced investors and
      founders.
    whyItMatters: >-
      A complete governance mapping enables thorough diligence of independent board oversight and key-person operational
      succession.
    diligencePath: Request the complete corporate leadership directory and board register under confidential diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: capitalization-table
    missingEvidence: Full capitalization table enumerating all common, preferred, and debt security holders and share class terms.
    whyItMatters: >-
      Comprehensive stakeholder enumeration is required to determine exact liquidation waterfalls and secondary market
      transfer restrictions.
    diligencePath: Inspect cap table and investor rights agreement in the corporate data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing-audited-financials
    missingEvidence: >-
      Audited GAAP revenue breakdown by segment (PEPM platform fees vs. wallet administration vs. consults) and verified
      customer retention rates.
    whyItMatters: >-
      Without audited financial statements, exact addressable market penetration and commercial margins cannot be
      verified independently from marketing and third-party estimates.
    diligencePath: >-
      Request confidential disclosure of audited income statements, PEPM schedule contracts, and revenue cohort
      retention data under NDA.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-structure
    missingEvidence: >-
      Proprietary PEPM contract schedules, tier break-points, and administrative fees charged to enterprise employers
      and health plans.
    whyItMatters: >-
      Direct price comparisons against point-solution competitors and health plan bundled offerings cannot be precisely
      evaluated without contractual PEPM schedules.
    diligencePath: >-
      Review commercial RFP responses, employer benefits broker rate sheets, and customer health plan administrative
      contracts under confidentiality.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: financial-audit-and-cash-flow
    missingEvidence: >-
      Audited GAAP financial statements disclosing net revenue, cost of goods sold, gross margin, GAAP operating loss,
      and cash burn rate.
    whyItMatters: >-
      Without audited financial statements, underwriting cannot independently verify unit gross margin sustainability,
      cash runway, or path to GAAP operating profitability.
    diligencePath: >-
      Request audited financial statements and auditor management letters under non-disclosure agreement during private
      investment diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-concentration-and-contract-terms
    missingEvidence: >-
      Cohort-level net revenue retention (NRR), gross revenue retention (GRR), and top-10 customer revenue concentration
      data.
    whyItMatters: >-
      While high-level client retention is stated at 98%, lack of contract duration, expansion dynamics, and account
      concentration obscures underlying revenue durability.
    diligencePath: >-
      Review master service agreements (MSAs) and billing schedules for top payer and enterprise accounts during
      confidential diligence.
