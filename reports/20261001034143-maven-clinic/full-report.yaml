chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              Maven Clinic Co. is a late-stage private digital health enterprise founded in 2014 by Chief Executive
              Officer Katherine (Kate) Ryder and headquartered in New York City [CO001, CO002]. Operating as a
              specialized virtual clinic for women's and family healthcare, Maven addresses structural fragmentation and
              provider shortages across reproductive, maternal, pediatric, and midlife care [CO003, CO004]. The platform
              combines telehealth access across more than 30 specialized provider types with dedicated Care Advocates
              who provide personalized navigation and coordination for members [CO004, CO005]. Historically anchored in
              a B2B employer-sponsored model, Maven has scaled to cover over 28 million lives globally and contracts
              with more than 2,000 employers and commercial health plans [CO003, CO004]. In early 2026, the company
              broadened its operating scope by launching Maven Consumer, an unbundled direct-to-consumer offering that
              allows individuals to subscribe directly to specialized clinical packages for GLP-1 metabolic health,
              hormone replacement therapy, and on-demand virtual consultations [CO005, CO006]. This hybrid B2B2C and
              direct access strategy positions Maven as an integrated clinical infrastructure layer rather than a narrow
              point solution, while presenting operational complexities in margin management and consumer clinical
              triage [CO007].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
