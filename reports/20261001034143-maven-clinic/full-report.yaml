  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Investment Angle
      - Thesis (Core Bull Driver)
      - Anti-Thesis (Core Bear Risk)
      - View Revision Trigger
    rows:
      - - Market Position
        - Dominant category leader in women's and family health covering 28M lives and 2,300+ enterprise employers.
        - Point-solution consolidation by unified benefit platforms and health plans competing directly.
        - Significant churn of anchor Fortune 500 employer accounts or multi-benefit bundling losses.
      - - Clinical ROI
        - >-
          Proven clinical cost reduction with up to 27% lower NICU admissions and 2:1 ROI demonstrated across client
          studies.
        - Difficulty establishing definitive actuarial claims ROI in emerging segments like Menopause and Midlife.
        - Payer refusal to contract value-based reimbursement or cover carve-out clinical services.
      - - Reimbursement Model
        - Expansion from fee-for-service carve-out into value-based and Medicaid risk-sharing partnerships.
        - Underwriting downside in full-risk contracts where adverse clinical events erode operating margins.
        - Losses on risk contracts or Medicaid rate reductions impairing gross margin.
      - - Secondary Liquidity
        - Sustained private investor demand from top-tier healthcare funds maintaining unicorn valuation floor.
        - Secondary market illiquidity and potential discount overhang if IPO window remains delayed.
        - Secondary share transactions pricing at greater than 25% discount to Series F preferred price.
    notes: >-
      Evaluates core structural arguments driving Maven Clinic's underwriting thesis against key execution
      vulnerabilities.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue / Operating Assumptions
      - Implied Valuation / Multiple
      - Key Risks & Headwinds
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          40% ARR growth to $375M; successful full-risk contract scaling in Medicaid; fertility benefit expansion
          globally.
        - >-
          $2.5B equity valuation (6.7x forward revenue); premium multiple supported by market leadership and IPO
          readiness.
        - Execution friction in international benefits and regulatory overhead in managed care.
        - 25% — Dependent on robust corporate benefits spending and successful IPO execution within 18 months.
      - - Base Case
        - 25% ARR growth to $335M; stable retention across 2,000+ employers; partial-risk contract steady state.
        - $1.7B equity valuation (5.1x forward revenue); stable valuation holding Series F preferred baseline price.
        - Slowing enterprise sales cycles; moderate multiple compression across public digital health comparables.
        - 55% — Reflects observed platform scale, proven clinical engagement, and current macroeconomic conditions.
      - - Bear Case
        - 10% ARR growth to $295M; gross margin deterioration from risk-contract losses; employer churn in mid-market.
        - >-
          $885M equity valuation (3.0x forward revenue); down-round or severe secondary discount reflecting compressed
          multiples.
        - Corporate benefits budget cuts; lack of standardized menopause reimbursement codes; customer concentration.
        - 20% — Triggered if enterprise client renewals drop or macro healthcare IT spending contracts sharply.
    notes: >-
      Scenario models apply forward enterprise revenue multiples derived from private financing marks and digital health
      benchmarks.
    claimRefs:
      - CV001
      - CV003
      - CV013
      - CV014
