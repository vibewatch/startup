  rows:
  - - AI data-center developers and hyperscalers
    - Developer / operator / long-term power buyer
    - 24/7 colocated power for AI and cloud loads
    - Targeted heavily in official and press materials, but no named production customer disclosed
    - Potentially the largest long-duration demand pool
    - No disclosed PPA tenor, MW commitment, or named hyperscaler counterparty
  - - Heavy industrial sites
    - Plant owner / operator / energy procurement lead
    - Behind-the-meter industrial electricity and high-temperature process heat
    - Explicitly marketed; no named industrial account retained
    - Fits Valar’s high-temperature reactor positioning
    - No disclosed industrial pilot, pricing, or uptime proof
  - - Hydrogen and synthetic-fuel operators
    - Project developer / operator / offtaker
    - Use reactor heat for hydrogen and fuel pathways
    - Officially marketed as product lanes; no retained public offtake disclosed
    - Could expand margin per site if chemistry works
    - No offtake counterparties, yield data, or contract structure disclosed
  - - Defense / resilience-sensitive public-sector users
    - Base operator / government sponsor / mission user
    - Rapidly deployable resilient power for bases or emergency contexts
    - Airlift and local quotes make this plausible, but no named contracted base customer is public
    - Strategic and political wedge for early deployments
    - No formal procurement contract, budget line, or operating customer disclosed
  - - Research hosts and nuclear institutions
    - Research institute / test-site operator / public sponsor
    - Pilot siting, testing, validation, and training
    - 'Strongest named proof today: PNRI, DOE/LANL/NCERC, USREL/Utah, Emery County support'
    - Validates pathway from concept to real-world pilot environments
    - Host and partner proof does not equal diversified recurring revenue
  notes: Public rows separate marketed end markets from named pilot or host counterparties; gaps reflect absent public contract disclosure, not assumed commercial failure.
