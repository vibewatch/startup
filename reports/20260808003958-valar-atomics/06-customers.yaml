- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Pilot-to-commercial conversion
    - If Ward250 or PNRI stays in research mode, the land-and-expand thesis stalls early
    - High impact on revenue timing and credibility
    - Review milestone map from cold criticality to at-power operation to first paying delivery
  - - Large-account sales model
    - A handful of very large site accounts can dominate pipeline and negotiating leverage
    - High impact on concentration and pricing power
    - Request weighted pipeline, top-5 exposure, and expected MW per account
  - - Public-sector and federal support
    - DOE and site-host support may matter disproportionately in early years
    - Medium-to-high impact if policy support changes
    - Request commercial plan that still works outside expedited pilot frameworks
  - - Hyperscaler disclosure gap
    - Peers disclose named data-center agreements while Valar does not
    - Medium impact on market confidence and fundraising narrative
    - Request all signed LOIs, PPAs, and status of named or unnamed data-center negotiations
  - - Site-host and community dependence
    - Early deployments rely on local political acceptance and permitting goodwill
    - Medium impact on siting speed and reputation
    - Review host MOUs, local permitting status, and community-engagement plan by site
  - - Fuel and bankability path
    - Customers may wait for stronger fuel, licensing, and runtime proof before expansion
    - High impact on repeat sales
    - Request fuel supply plan, commercial licensing roadmap, and reliability test results
  notes: These risks describe likely concentration mechanics for a lumpy infrastructure business; they are not proof that concentration has already produced losses or churn.
