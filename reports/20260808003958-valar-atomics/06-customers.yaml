- id: named-proof-is-pilots-hosts-and-partners
  title: Named Proof Today Is Pilots, Hosts, and Partners
  body: 'The strongest public proof is not a hyperscaler logo wall; it is a chain of pilot and host relationships. TechCrunch and Business Insider both report a Philippines Nuclear Research Institute research contract, which appears to be the clearest named customer-style agreement in the retained source set. In the United States, the visible counterparties are mostly infrastructure and validation partners: DOE’s Reactor Pilot Program, Los Alamos and NCERC under Project NOVA, the Utah San Rafael Energy Lab, and Emery County’s local host ecosystem. Those are meaningful proof points because they show real siting, testing, and institutional support rather than slideware.


    But the distinction matters. Project NOVA validates reactor physics and government-lab collaboration; it is not a recurring commercial offtake. USREL and Emery County prove host-site acceptance and local political backing; they do not prove power-purchase conversion. Nvidia is now a named strategic partner on a public 30 MW AI-facility collaboration, but the retained sources still describe that work as a study or scale-up plan rather than a disclosed long-duration power contract. Even the PNRI relationship, while strategically important, is described as a research or pilot path with later full-scale ambitions, not as a disclosed revenue-rich production contract. Publicly, Valar has therefore crossed the line from concept to named pilot ecosystem, but not the line from pilot ecosystem to bankable customer base.'
