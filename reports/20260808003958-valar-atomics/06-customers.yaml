- id: TU006
  title: Buying criteria / procurement gate table
  columns:
  - Buyer criterion
  - Why it matters
  - Current public proof
  - Status
  - Remaining gap
  rows:
  - - 24/7 firm power near the load
    - Core reason data centers and industrial sites would pay for nuclear
    - Strong target-market positioning across official pages and sector coverage
    - Targeting visible
    - No disclosed commercial service contract
  - - At-power operating evidence
    - Customers need proof beyond cold criticality
    - Project NOVA and Ward250 validate physics and setup
    - Partial
    - No public long-duration at-power operating record
  - - Commercial licensing pathway
    - Customers need confidence that research milestones translate to sellable plants
    - DOE pilot fast-tracks testing and future licensing preparation
    - Partial
    - No public NRC-backed commercial approval or timetable by account
  - - Fuel and supply-chain readiness
    - A customer contract is only bankable if fuel and major components can actually be delivered
    - Public sources show federal support and hiring, but still discuss HALEU and factory hurdles
    - Partial
    - No customer-facing delivery assurance disclosure
  - - Economic bankability
    - Large buyers will care about contract tenor, uptime guarantees, and cost per MWh or product unit
    - No public tariff, PPA, or offtake economics retained
    - Weak
    - Need signed commercial terms and unit-economics disclosure
  - - Community and siting acceptance
    - Large industrial infrastructure can stall without host support
    - Utah host support and open-house turnout are positive
    - Positive early signal
    - Need evidence this support repeats at future commercial sites
  notes: This table focuses on procurement gates future buyers are likely to apply. Public proof is strongest on targeting and weakest on bankable commercial terms.
