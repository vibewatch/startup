- id: retention-expansion-concentration-and-disclosure-gaps
  title: Retention, Expansion, Concentration, and Disclosure Gaps
  body: 'The public record is weakest exactly where later-stage investors or enterprise buyers would want the most precision. No retained public source discloses active customer count, booked megawatts, backlog, renewal rate, NRR, GRR, churn, average contract length, or customer satisfaction scores. There is also no disclosed named hyperscaler or industrial production offtaker in the retained evidence set. The customer chapter therefore cannot conclude that Valar has poor retention or dangerous concentration; it can only conclude that the company has not publicly shown the data required to evaluate either.


    That gap matters because the likely commercial model is concentrated by design. A reactor developer selling into data centers, industrial campuses, or international site hosts will almost certainly depend on a handful of very large accounts early on. If the public record today consists mainly of PNRI, DOE/LANL validation, Utah host institutions, and local site support, then near-term concentration risk is probably high until more named production customers appear. The expansion path is conceptually attractive—pilot to first sales to multi-reactor gigasites—but public diligence should center on conversion, not narrative: which counterparties are under LOI, how much contracted load exists, what the initial contract tenors are, and whether at-power performance is strong enough to win follow-on orders.'
