  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-metrics-gap
    missingEvidence: Active customer count, deployed MW, backlog, and booked load by segment.
    whyItMatters: Without denominator metrics, investors cannot tell whether demand is broad, concentrated, or mostly narrative.
    diligencePath: Request a pipeline and backlog schedule with named accounts, contracted MW, weighted probability, and start dates.
    relatedQuestionRefs:
    - QU012
    - QU025
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal rate, average contract tenor, and referenceable customer satisfaction data.
    whyItMatters: Retention and contract durability determine whether early pilots can become recurring infrastructure revenue.
    diligencePath: Request signed contracts, renewal history, term sheets, and reference calls from any repeat or expanding counterparties.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU026
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: pnri-contract
    missingEvidence: PNRI contract value, milestone payments, delivery timeline, IP terms, and path to follow-on reactors.
    whyItMatters: The PNRI relationship is the clearest public customer-style proof point, so its economics matter disproportionately.
    diligencePath: Review the full PNRI agreement, project scope, budget responsibility, and any contingent follow-on commitments.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU021
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: production-customer-proof
    missingEvidence: Named production data-center, industrial, or public-sector offtaker with disclosed deployment or contract specifics.
    whyItMatters: Public customer proof currently leans toward pilots and partners; a named production counterparty would materially change confidence.
    diligencePath: Request customer logos that management is willing to name, plus supporting LOIs, PPAs, or operating-service agreements.
    relatedQuestionRefs:
    - QU006
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: buyer-criteria
    missingEvidence: At-power runtime evidence, reliability hours, and customer-facing performance guarantees for a Ward-class system.
    whyItMatters: Future customers are likely to care more about runtime and reliability than about cold-criticality headlines alone.
    diligencePath: Request engineering test plans, uptime targets, degradation curves, and any performance guarantees proposed to buyers.
    relatedQuestionRefs:
    - QU015
    - QU022
    relatedTableRefs:
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A fuller public list of named counterparties or customer references beyond the current pilot and host set.
    whyItMatters: The named proof table is necessarily partial and should not be mistaken for a complete customer list.
    diligencePath: Ask management for a full counterparties list divided into hosts, pilots, LOIs, signed customers, and expansion accounts.
    relatedQuestionRefs:
    - QU004
    - QU019
    relatedTableRefs:
    - TU003
