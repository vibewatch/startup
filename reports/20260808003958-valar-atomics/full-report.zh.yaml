      - number: '3.3'
        title: 替代品、潜在进入者与采购现实
        blocks:
          - type: paragraph
            body: >-
              Valar 不只是在同具名初创公司竞争，也在同时间和买方风险容忍度竞争。Reuters、Utility Dive 和 ANS 都显示，DOE 快速试点包含更广泛的进入者——Aalo、Antares、Deep
              Fission、Last Energy、Natura、Radiant、Terrestrial、Oklo 等——因此投资者注意力和客户心智会分散到许多“首堆”故事上。关键在于，公开 Valar
              同业集合中的公司还没有一家用先进设计交付商业电力，所以买方仍会默认选择能更快解决问题的替代方案。对 AI 和数据中心采购来说，近端替代品仍是电网供电、燃气，以及既有核电重启或增容。IEA 的 Energy and
              AI 分析明确称，在高需求情景下，化石燃料到 2030 年仍然关键；EIA 关于加密挖矿用电的研究也显示，共址、高耗电负载已经在追逐直接低成本能源。这些模式支持 Valar
              的场址逻辑，但还不支持它的经济性。它们也意味着，Valar 必须用一个未来运营模式，去对抗今天金融机构、公用事业和超大规模云厂商更熟悉的替代品；这些替代品更脏、差异化更低，却更容易被理解。
