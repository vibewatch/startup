      - number: '7.2'
        title: 反应堆、燃料与废物准备度
        blocks:
          - type: paragraph
            body: >-
              技术记录有分量，但还不完整。Project NOVA 给了 Valar 一个真实里程碑：在 DOE 和 NNSA 监督下，借助 LANL 与 NCERC
              支持实现冷临界。这很重要，因为它验证物理、支撑堆芯建模，也比单纯的 PPT 叙事提供了更好的证据基础。但独立报道一致认为，这仍只是部分里程碑。New Scientist
              称，真正的证明点仍是受控功率运行、持续温度表现、材料长期行为，以及监管方和客户能够信任设计在常规运行中的证据。Valar 自己的材料也承认，NOVA
              数据仍需要用于氦回路调试和升温协议，这意味着部分最难的工程工作还在新闻标题之后。


              燃料和废物让这个缺口更深。Reuters 和 DOE 都称 HALEU 供应仍有限，DOE 的 2026 年大额浓缩奖励说明供应链还在建设，并未完成。NRC
              材料同样清楚表明，燃料循环设施和乏燃料储存仍受到严格监管，具有场址特异性，运营负担很重。AP 补上了关键的下行细节：官员仍未解决反应堆废物最终如何处置。这不能证明 Valar
              无法解决燃料或废物问题；它证明这些议题仍是活依赖，而不是已关闭的工作流。因此，投资人应把冷临界视为技术降险，而不是 Valar 已经跨过燃料、后端和功率运行验证门槛、足以支撑商业信心的证明。
