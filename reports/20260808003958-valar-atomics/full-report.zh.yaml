        - 公司法律顾问；搭建下行情景瀑布。
      - - 客户合同
        - 带定价和期限的已签 PPA、试点合同或包销协议。
        - 这是把 AI 电力叙事转成可承保需求的前提。
        - 商务负责人；核验买方信用和用量。
      - - 单位经济性
        - Ward 级部署的 capex、opex、可用率、燃料和利润率模型。
        - 情景价值主要跟项目经济性走，不跟故事质量走。
        - 项目融资与工程模型审查。
      - - 运行数据
        - Ward 250 越过冷态临界后取得的带功率运行数据。
