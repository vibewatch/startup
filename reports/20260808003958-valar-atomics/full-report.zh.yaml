  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与真正该计入的支出
        blocks:
          - type: paragraph
            body: >-
              相关市场不是“所有核能”，甚至也不是“所有 AI 电力”。Valar
              自己的材料反复把机会收窄到离网或电网受限应用：在这些场景里，密集、全天候的能源或热，比尽可能低的交付电价更重要。公司明确点名数据中心电力、氢气、重工业电力和清洁烃类燃料；技术页强调高品位工艺热，使命页强调通过在一个园区集群部署多个反应堆，让核能在
              gigasite 中产品化。这个定义把市场拉向表后或园区邻近发电、工业蒸汽和热，以及那些部署和运营一旦能跨多台机组标准化，场址经济性就会改善的项目。


              这个边界也排除了大量表面相邻的支出。通用大电网发电、没有稳供要求的间歇性可再生电采购、传统集中式核电项目，解决的买方任务不同于“在受限场址快速获得安全电力或热”。更有决策价值的替代品，是同样能解决运营瓶颈的直接能源方案：公用事业交付的清洁稳供电力块、本地先进反应堆、场内燃烧或燃料电池系统，以及高温工业能源包。重点不是
              Valar 已经拥有这些市场，而是它在卖给能源需求中的一个子集：在这里，取电速度、可用率、热质量和场址成本摊销足够重要，可以支撑一条非传统核能采购路径。
