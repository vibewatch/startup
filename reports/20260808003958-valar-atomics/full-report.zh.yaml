  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Valar 的产品栈从高温核心物理出发，经过热验证，延伸到尚未公开工程细节的产品转换层。
    data:
      layers:
        - label: 核心物理组件
          detail: 公开资料目前描述的反应堆核心架构，由 HALEU TRISO 燃料、石墨慢化、氦冷却和碳化硼控制元件构成。
          modules:
            - HALEU TRISO 燃料
            - 石墨慢化剂
            - 氦冷却剂
            - 碳化硼控制元件
        - label: 热验证层
          detail: Ward Zero 是非核、全温度替代系统，让 Valar 能在装料启动前测试大量热系统。
          modules:
            - Ward Zero 替代堆芯
            - 碳化硅加热元件
            - 仪表与热系统检查
        - label: 中子学验证层
          detail: Project NOVA 在联邦监督下，以零功率验证类似 Ward250 的燃料、慢化剂和反应性控制假设。
          modules:
            - NOVA 子组件
            - NCERC 临界装置
            - 模型与测试对比
        - label: 集成反应堆层
          detail: Ward250 是首个带功率运行的集成工厂，计划在 Utah 场址规模下把堆芯、冷却剂、控制和场址系统拼在一起。
          modules:
            - Ward250 反应堆容器
            - 一回路
            - 场址组装 / 屏蔽
        - label: 产品转换层
          detail: 商业价值取决于下游能否把高温热转换为电力、氢和合成燃料。
          modules:
            - 数据中心供电
            - 工业热
            - 硫碘制氢
            - 改良 Fischer-Tropsch 燃料
