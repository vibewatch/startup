      - number: '4.2'
        title: 资本形成与融资结构
        blocks:
          - type: paragraph
            body: >-
              资本形成是 Valar 财务故事中唯一清楚可见的部分。公开来源支持一个很快的融资节奏：2025 年 2 月种子轮被广泛报道为 $19M；2025 年末完成 $130M Series A；2026 年 3
              月据报道融资 $450M、估值 $2B；随后在 2026 年 8 月宣布 $1B 股权 Series B，另有单独 $200M 信贷额度，外部报道投后估值
              $6B。最新一轮重要的不只是规模，还有结构：公司不再只融风险股权，而是在股权上叠加贷款人式承诺。


              更难的问题是累计融资和优先级。按公开披露计算，在不计新信贷额度前，Valar 自成立以来似乎已融资约 $1.4B 股权；与此同时，老数据库和旧轮次摘要现在明显过时。这个不一致不推翻更大的结论：以 Valar
              的成立时间看，它已经融到异常大的一笔资本；但它确实让直接尽调股权结构表、债务时间表、抵押包和优先股堆叠变得更重要。到了这个规模，财务问题已经不是 Valar
              能不能融钱，而是商业化之前，企业价值中有多少已经被预先占走。
