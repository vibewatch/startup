      - number: '4.4'
        title: 资本充足性与烧钱代理指标
        blocks:
          - type: paragraph
            body: >-
              Valar
              可能拥有可观资本，但公开证据没有说明这些资本是否足够。公司没有披露现金余额、月度烧钱、季度经营现金消耗、债务到期表、最低流动性契约或现金跑道估计。能观察到的是烧钱代理指标：财务、运营、燃料处理和建设岗位持续招聘；Utah
              有外部 EPC 和场址伙伴；围绕燃料有纵向整合野心；试点路径仍依赖 DOE 支持、Nevada 燃料供应和监管加速。这些代理指标说明，成本基础的扩张速度快过公开记录能够量化的速度。


              2026 年融资中的结构化资本成分现在尤其重要。3 月报道的 $450M 轮次已经包含 $110M 债务，8 月又增加单独的 $200M
              信贷额度。如果信贷用于衔接场址建设或项目里程碑，它可以很聪明；但它也会在利润率可见之前很久，就引入还款、抵押和契约风险。新的项目融资招聘支持这样一个判断：管理层已经在准备结构化资本，也可能在准备未来项目融资式载体，而不只是又一轮干净普通股融资。承销含义很直接：不能只看标题融资额来判断资本充足性。它取决于
              2026 年股权中有多少是不受限现金，Utah、燃料和未来部署项目会多快吃掉这些资金，以及未公开信贷文件里装着哪些义务。
