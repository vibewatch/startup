      - number: '3.2'
        title: 直接同业对比：HTGR、微型反应堆与示范路径差异
        blocks:
          - type: paragraph
            body: >-
              在具名同业中，X-energy 最难被 Valar 轻易排除，因为重叠是结构性的：两者都依赖 HTGR 和 TRISO
              叙事，都强调工业热，也都把先进核能描述为能源密集型现代工业的解决方案。差异在商业姿态。X-energy 的公开定位更像大型工业或公用事业邻近平台，而 Valar 强调可运输试点和离网园区。Oklo
              在反应堆物理和客户承诺上差异更大：Aurora 是一个带燃料回收角度的紧凑型先进裂变电力故事，对园区和表后电力买方的吸引力高于合成燃料或工艺热买方。Kairos 是最清楚的执行标杆。它覆盖
              R&D、熔盐工作、制造和 Hermes 示范园区的足迹，传递出一个分步项目；大买方可能会觉得它比 Valar 的空运加诉讼叙事更常规、更易读。相比之下，TerraPower
              提醒人们，并非所有强劲竞争者都很小：Natrium 大得多，面向电网，并带储能，这削弱了它同 Valar 的设计类比，却增强了它在“谁会赢得最大清洁电力预算”讨论中的相关性。
