  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险面
        blocks:
          - type: paragraph
            body: >-
              Valar 最大的单一风险仍是监管转化：公司已经找到办法在 DOE 主导的测试中快速推进，但公开证据没有显示它已经打通常规商业许可路径。公司官方材料、Reuters 和 Utility Dive 都称，DOE
              试点可以在 NRC 之外授权测试反应堆，并明确把 2026 年 7 月 4 日前达到临界作为目标。这是真实加速，但还不是可融资的商业运营框架。WIRED 和 NRC 材料都说得很清楚，商业反应堆仍必须重新接入
              NRC；NRC 自己面向微反应堆的快速许可框架 Proposed Part 57，截至 2026 年 5 月也仍只是提案。NRC 的 ADVANCE Act
              实施页面还称，机构仍在处理加速审查和微反应堆指引的法定期限；Regulations.gov 上的 NRC-2025-0379
              案卷也仍是拟议许可路径的已截止意见案卷，而不是最终制度。政策方向有支撑，但也意味着商业框架仍在实时搭建。


              针对 NRC 的诉讼没有消除风险，反而让风险更尖锐。Valar 不只是为改革游说；它公开主张，现行联邦规则让原型测试过慢，否则 Ward One 将在菲律宾
              测试。这释放出真实的进度压力，也显示管理层愿意推动制度边界。它最终可能帮助改革制度，但今天的含义是，Valar
              正处在一场仍在进行的法律和政策博弈中：谁来监管、监管什么、按什么节奏、用什么安全阈值。对投资人而言，这制造了二元风险：如果 DOE
              优先路径站得住，进展会很快；如果商业许可、法院结果或监管解释无法足够快地收敛，延误也会很剧烈。
