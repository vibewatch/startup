      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Isaiah Taylor 是 Valar 公开身份的核心。多方来源把他描述为自学编程、高中辍学、在早期创业试验后创办 Valar 的人，并通过 Ward Schaap 将公司使命同家族
              Manhattan Project 传承相连。周围管理层信号更混杂。正向尽调信号包括：Mark Mitchell 曾领导 Ultra Safe Nuclear Corporation，Muhammad
              Shahzad 有航空航天运营背景，Max Ukropina 在重大测试和部署里程碑中角色可见。不过，治理披露比融资叙事薄：公开证据清楚显示 Doug Philippone 因 $130 million
              Series A 加入董事会，但没有给出最新完整董事名单、委员会结构或控制权地图。反向报道还提出关键人物和治理问题，原因是 Kip Mock、Elijah Froh
              等不具备同等核能资历的长期亲近人士在运营中很突出，Day One Ventures 创始人 Masha Bucher 也有声誉争议。实际结论是，Valar
              同时拥有一些资深核能和工业运营人才、异常创始人中心化的公开形象，以及仍然有限的治理透明度。
