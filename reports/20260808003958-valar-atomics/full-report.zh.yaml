          to: call
          label: 阻碍定价信心
    approximationNotes: 这是一条逻辑链，不是财务模型。它解释的是，为什么可见优势尚不足以压过缺失的投资测算输入。
    claimRefs:
      - CV007
      - CV013
      - CV014
      - CV039
      - CV045
      - CV046
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 最能推动公允价值变化的是里程碑和资本结构变量，而不是当期倍数。
    data:
      items:
        - label: 持续带功率运行时长证明
          value: 3
          detail: 一旦公开，将是最强的正向重估驱动因素。
        - label: 已签约合同经济性
          value: 3
          detail: 会把需求故事转化为可测算的收入质量。
        - label: 更干净的债务 / 优先权条款
          value: 2
          detail: 提高普通股对上行空间的捕获。
        - label: 超大规模云厂商背书的核能需求
          value: 2
          detail: 有助于解释战略溢价，但不能替代经济性。
        - label: 无收入或定价披露
          value: -3
          detail: 这是不能假装传统倍数站得住脚的最大原因。
        - label: 2026-2028 进度滑坡
          value: -3
          detail: 会让期权价值比当前叙事暗示的速度更快坍塌。
        - label: 燃料供应或监管挫折
          value: -2
          detail: 可能抹掉 Valar 相对同业的速度优势。
    approximationNotes: 影响分值是 -3 到 +3 的序数刻度，排序的是估值方向敏感度，而不是预测百分比涨跌幅。
    claimRefs:
      - CV015
      - CV019
      - CV025
      - CV039
      - CV041
      - CV047
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间锚定里程碑结果和合同证明，而不是收入倍数。
    data:
      items:
        - label: 悲观情景（USDm）
          low: 600
          value: 900
          high: 1200
          detail: 进度延误、融资结构苛刻，合同经济性缺失。
        - label: 基准情景（USDm）
          low: 1500
          value: 1900
          high: 2400
          detail: 满功率演示落地，但经常性经济性大多仍未公开。
        - label: 乐观情景（USDm）
          low: 3000
          value: 3750
          high: 4500
          detail: 运行时长、已签合同和可复制的部署经济账出现。
    approximationNotes: 所有数值都是企业价值口径的方向性区间，单位为百万美元，仅供估值讨论；不是 DCF 输出。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 给 IC 的压缩视图：公开记录今天真正能支撑什么。
    data:
      items:
        - label: 已披露私募估值
          value: 2000
          unit: USDm
          claimRefs:
            - CV001
        - label: 最新一轮融资规模
          value: 450
          unit: USDm
          claimRefs:
            - CV001
        - label: 最新一轮内含债务
          value: 110
          unit: USDm
          claimRefs:
            - CV001
            - CV014
        - label: 已追踪员工数
          value: 104
          unit: people
          claimRefs:
            - CV003
        - label: Google-Kairos 协议
          value: 500
          unit: MW
          claimRefs:
            - CV035
        - label: NuScale 2025 年经营现金消耗
          value: 459.6
          unit: USDm
          claimRefs:
            - CV031
        - label: 公开收入披露
          value: none
          unit: as of run date
          claimRefs:
            - CV011
    approximationNotes: 本面板有意把估值、融资、同行采购和披露指标放在一起，因为当前投资判断的核心是证据质量，而不是某个标准化倍数。
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV014
      - CV031
      - CV035
