      - number: '1.3'
        title: 资本结构、投资者基础与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              Valar 的融资节奏已经从少见走向极端。TechCrunch 报道，公司在 2025 年 2 月走出隐身时完成 $19 million 种子轮；Los Angeles Times 后来报道，Snowpoint
              Ventures 领投了 $130 million Series A，Day One 和 Dream 共同领投。2026 年 3 月，Bloomberg 报道又一轮 $450 million 融资，估值 $2
              billion。到 2026 年 8 月，TechCrunch 和 Yahoo Finance / Bloomberg 报道了新的阶跃：$1 billion Series B 股权、单独的 $200
              million 信贷额度，以及 $6 billion 投后估值；Valar 自己的公告则称 Sequoia 领投，Shaun Maguire 加入董事会。

              关键在于，投资者基础正在变得更机构化，也更牵涉治理。财团里仍混有 Palmer Luckey、Shyam Sankar、Doug Philippone 等气候和防务科技支持者，但 Sequoia
              的董事席位和信贷额度出资方，让资本堆栈不像纯风险投资故事，更像早期基础设施平台。代价是公开披露仍落后于标题规模：没有公开股权结构表，没有优先股堆叠摘要，也没有针对 2026 年信贷承诺的公开契约包。
