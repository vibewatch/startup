      - number: '5.4'
        title: 安全论证、监管边界与瓶颈
        blocks:
          - type: paragraph
            body: >-
              Valar 目前的公开安全论证建立在三层之上：通用 HTGR 加 TRISO 叙事、诉讼时期围绕负热反馈和被动余热排出的主张，以及 NOVA
              在联邦监督下运行这一事实。这些有意义，但不完整。它们支持“堆芯概念值得认真关注”的观点；却还没有构成一套完整电站安全论证，不能覆盖带燃料运输、客户附近日常运行或寿期末处理。AP
              的报道在这里尤其重要，因为它提出了批评者最关心的未解问题：系统是否可行且经济，带核燃料运输如何保障安全，废物最终去哪里。Utah 本地沟通有助于选址合法性，但不能替代一套有文件支撑的从摇篮到坟墓反应堆论证。


              因此，最大的技术瓶颈不只在堆芯内部。公开 DOE 和 NRC 材料清楚显示，HALEU
              供应、临界基准、运输包装和未来微型反应堆许可，仍是活跃的全国性工作流。这些工作流之所以存在，正是因为先进反应堆生态还没有充足商业燃料、成熟基准数据或规模化无摩擦许可。Valar
              可能从这些项目受益，但逃不开它们。产品技术判断因此更细：Valar 比许多初创公司更深入真实硬件证明，但下一组风险是系统集成、燃料物流、许可转换，以及证明其雄心很大的热到产品栈能走出叙事。
