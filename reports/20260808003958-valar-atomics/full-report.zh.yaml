  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Valar 的公开材料指向未来以项目驱动的能源业务，不是软件订阅，也不是已经成型的公用事业模式。公司营销四条终端产品线——数据中心电力、氢气、工业电力和清洁燃料——并反复主张，标准化 gigasite
              会创造最终支撑规模化的现金流。独立报道方向一致：TechCrunch 和 Business Insider 描述了一种面向大型能源买方的离网部署模式；AP 则报道，管理层希望在 2027 年开始测试性售电，并在
              2028 年全面商业化。关键在于，这说明当前公开牵引力仍处于收入前阶段，最多也是规模化商业化前阶段。


              缺失的正是财务承销人最需要的东西。留存官方页面没有披露电价、$/MWh 基准、氢气价格、合成燃料价格、反应堆售价、毛利率或实际合同结构。公开材料说明 Valar
              想卖什么，但没有说明客户目前付多少钱、合同是否照付不议，或早期部署到底通过设备销售、融资型电力服务、测试合同，还是三者混合来变现。TechCrunch 提到的 Philippines 合同，以及 AP 的
              2027/2028 时间线，暗示变现可能分阶段到来——先做试点，后有更广产品收入——但顺序仍只是粗线条勾勒。
