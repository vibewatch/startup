      - number: '8.3'
        title: 可比锚点与情景区间
        blocks:
          - type: paragraph
            body: >-
              合适的可比集合不能证明 Valar 的干净公允价值，但能约束 $6B 估值讲的是什么故事。Oklo 和 NuScale
              等公开先进核能同行显示，在规模化收入出现前，投资人可以给反应堆公司数十亿美元期权价值；但同一批申报文件也显示，这类路径会消耗多少资本。Oklo 在 2025 年中给出的公开规模信号约为 $7B，NuScale
              约为 $5.3B，但 NuScale 也披露了 2025 年近 $460M 经营现金消耗。Bloom Energy 不是核能同行，但其约 $3.9B 的市场价值信号提醒人们，有真实收入的公司仍可能在 Valar
              的私募估值附近或更低交易。


              私募和战略可比也指向同一结论。Google 的 Kairos 协议和 Amazon 支持 X-energy
              的部署模式显示，成熟买家在资助分阶段产能和订单簿形成，而不是把收入前叙事当成客户经济性的替代品。这支持使用情景法，而不是倍数法。熊市、基准和牛市情景的价值应主要随运行证明、已签承购和资本结构清晰度移动。按这个基础，今天的
              $6B 估值已经假设了大量技术和商业成功，而这些成功尚未以财务形式公开。
