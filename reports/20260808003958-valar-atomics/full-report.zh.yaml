      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 只有证据改善后，这个估值才可投，而不是因为故事令人兴奋。
            body: 在报道的 $6B 投后估值下，举证责任已从 Valar 是否有趣，转向下一位投资人能否用真实运营和合同证据承保下行与转化。公开来源尚未跨过这条线。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV045
              - CV046
          - type: callout
            title: 对一家 2023 年成立的核能创业公司，Valar 已拿出异常可见的硬件和融资里程碑。
            body: 冷临界、Utah 场址活动和快速融资，让 Valar 有别于许多纸面阶段核能叙事，也支撑继续尽调，而不是直接否定。
            calloutType: strength
            claimRefs:
              - CV002
              - CV007
              - CV009
          - type: callout
            title: 最大未定价风险不是需求，而是经济性缺失。
            body: 公司可能解决真实市场需求，但在定价、毛利、资本结构条款和客户文件可见之前，当前估值主要仍是在押注未来证明。
            calloutType: risk
            claimRefs:
