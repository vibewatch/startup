chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Valar Atomics 成立于 2023 年，自称是一家私营先进核能公司。它开发高温气冷堆，但部署模式不是传统公用事业电网电站，而是“gigasite”。在主页、使命、技术和 Ward 250
              材料中，公司反复描述一种以 TRISO 为燃料、氦冷、石墨慢化的反应堆设计，目标场景都不依赖电网：数据中心电力、工业热、制氢和合成燃料。第三方公开报道通常称公司位于 El Segundo，但当前招聘信息显示，它在
              California 的 Hawthorne 有相当规模的足迹，也在 Utah 的 Orangeville 招人。也就是说，运营足迹清楚，但公开总部标签并不精确。后续章节最稳妥的表述是：总部在 Los
              Angeles 都市区，并向 Utah 测试场扩张。Valar 还强调，自己并不想先向传统电网售电；它要的是共址工业园区，园区内布置大量标准化反应堆，并用高品位工艺热同轻水堆既有玩家拉开差异。
