      - number: '1.5'
        title: 风险、争议与证据缺口
        blocks:
          - type: paragraph
            body: >-
              公司概况层面的主要风险并不隐晦。第一，Valar 的可信度已经不只是能否命中带爱国叙事的 7 月 4 日目标，而是要证明一个 DOE 授权里程碑和小型 Nvidia 负载演示，能够转化为可获 NRC
              许可的商业产品。第二，收入、客户数、利润率画像和已签商业电力合同仍未公开披露，因此估值从 3 月的 $2 billion 跳到 8 月据报道的 $6 billion
              投后，仍高度依赖叙事。第三，反向报道继续提出投资者声誉暴露、创始人判断，以及缺乏同等核能资历的亲近人士地位过高等问题。第四，公开反应堆功率叙事仍未完全对齐：官方诉讼语言、Utah 建设报道、SMR
              专业报道和空运报道使用的尺寸描述存在实质差异。最后，轨道数据中心或“原 Aetherflux”的混淆似乎属于 Cowboy Space，而不是 Valar
              的地面反应堆项目；这本身也提醒人们，公开故事可能跑在精确溯源前面。如果后续章节能验证技术、客户需求和商业化时间线，这些问题在尽调中可以管理；但目前它们仍是核心开放项，不是边缘脚注。
