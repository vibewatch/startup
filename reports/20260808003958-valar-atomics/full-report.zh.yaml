      - number: '6.4'
        title: 留存、扩张、集中度与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录最薄弱的地方，恰好是后期投资人或企业买方最需要精确度的地方。保留下来的公开来源没有披露活跃客户数、已预订
              MW、积压订单、续约率、NRR、GRR、流失率、平均合同期限或客户满意度评分。保留下来的证据集中，也没有披露任何具名的超大规模云厂商或工业生产承购方。因此，客户章节不能断言 Valar
              留存差或集中度危险；只能说公司尚未公开拿出评估这两项所需的数据。


              这个缺口很重要，因为可能的商业模式天然集中。面向数据中心、工业园区或国际场址运营方销售反应堆的开发商，早期几乎一定依赖少数几个超大客户。如果今天的公开记录主要由 PNRI、DOE/LANL 验证、Utah
              承载机构和本地场址支持构成，那么在更多具名生产客户出现前，近期集中度风险很可能较高。扩张路径在概念上很有吸引力——从试点到首批销售，再到多反应堆吉瓦级场址——但公开尽调应围绕转化而不是叙事：哪些交易对手已签
              LOI、已有多少签约负载、初始合同期限多长，以及带功率表现是否足够强到赢得后续订单。
