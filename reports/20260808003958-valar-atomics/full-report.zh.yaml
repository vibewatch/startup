        - 8000-12000
        - 1.33x-2.0x
        - 商业数据追上当前叙事。
    notes: 这些区间是情景输出，不是收入倍数输出。它们要表达的是：同一家公司在获得更高或更低估值前， 必须拿出哪些证据。
