      - number: '8.4'
        title: 入场纪律、论点破裂点与最终追问
        blocks:
          - type: paragraph
            body: >-
              有纪律的投资人仍可以认可这里的发展方向。稳定清洁电力背后的市场拉力是真实的，技术团队至少有一个异常可见的证明点，可比项目也显示大型战略交易对手愿意在长周期里支持先进核能路径。缺的不是兴奋感，而是投资承保 闭环。在
              Valar 拿出持续带功率数据、合同经济性，以及完整债务和优先权披露之前，当前估值应被视为进一步尽调的上限，而不是需要追逐的底价。


              这把尽调压缩成一张窄清单。最重要的追问是已签客户文件、精确资本结构、Ward 级部署的单元经济性，以及 Ward 250 走出早期负载证明后的运行数据。如果 2026 到 2028
              年时间表拉长却没有补偿性证据，如果融资结构比头条显示得更苛刻，或者如果燃料和监管瓶颈抹掉公司的速度优势，投资论点就会破裂。换句话说：Valar 也许最终能在 $6B
              或以上融资，但公开证据显示它还没有赢得这个结论。
            claimRefs:
              - CV025
              - CV040
