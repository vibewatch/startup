  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争分层：谁真正与 Valar 重叠
        blocks:
          - type: paragraph
            body: >-
              不能把 Valar 同整个核能行业一概比较，好像每种设计卖的都是同一件事。它的公开主张同时结合三点：使用 TRISO
              燃料的高温气冷堆、离网“gigasite”运营模式，以及从电力延伸到氢气、工业热和合成燃料的产品野心。这意味着直接同业集合比广义先进反应堆宇宙更窄。X-energy
              是披露最清楚的技术类比，因为它也围绕高温蒸汽和工业用途销售 HTGR/TRISO 系统。Oklo 在 24/7
              园区级表后电力上有重叠，但它的快堆和燃料回收叙事，让它更偏向电力优先买方，而不是超高温热买方。Kairos 在先进核能初创公司执行层面有重叠，但路径更像传统示范园区。TerraPower
              主要是超大规模云和大型清洁电力采购里的资本充足相邻威胁，不是同类微型反应堆替代品。与此同时，现状替代品——电网供电、燃气发电、棕地核电重启或增容——仍很强，因为它们能在近端交付更大的兆瓦级电力块，而任何初创先进反应堆都还没有在商业规模上证明这一点。
