      - number: '7.5'
        title: 缓释因素、未解缺口与否决标准
        blocks:
          - type: paragraph
            body: >-
              Valar 不是一个毫无缓释因素的故事。它已经积累了几项真实降险项：DOE 背书、冷临界数据、Utah 实体进展、活跃社区沟通，以及正在加强的联邦燃料议程。Proposed Part 57
              最终可能让后续微反应堆许可更标准化，DOE 的 HALEU
              支出也可能逐步改善燃料可得性。这些都是重要正面因素，但它们是系统层面的缓释，不是公司层面的闭环。公开记录仍缺少投资人把高雄心转成可投结论所需的文件：一张能把试点接到商业机组的产品路线图、项目特定的燃料分配或浓缩合同、废物处理策略、已签承购经济性、详细的商业
              NRC 路径，以及安全和执行责任归属更透明的治理安排。


              因此，否决标准异常清晰。如果 Valar 在赢得冷临界新闻之后错过功率运行验证序列，如果燃料和废物路径到 2027
              年仍停留在抽象层面，或者如果融资继续跑在客户证明前面，下行不只是进度延迟，而是商业化论点坍塌。反过来，如果公司披露可信燃料路径、证明热态运行和可重复性，并在下一轮叙事驱动的重估前拿到可融资承购，当前风险栈会明显压缩。在此之前，正确姿态不是一概否定，而是带着明确里程碑闸门的纪律性怀疑。
