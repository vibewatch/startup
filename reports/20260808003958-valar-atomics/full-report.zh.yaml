  - id: TV002
    title: 正反论点表
    columns:
      - 视角
      - 正方论点
      - 反方论点
      - 改善看法的证据
      - 恶化看法的证据
    rows:
      - - 市场需求
        - AI 和工业客户明确需要更多 24/7 清洁电力。
        - 只有需求，不保证 Valar 能拿到合同或经济性。
        - 与有信用买方签署 PPA 或购电协议。
        - 需求仍停留在叙事，未披露转化。
      - - 技术进展
        - Project NOVA 和 Ward 250 里程碑领先于许多初创公司的公开进度。
        - 冷临界不是满功率、长时长表现。
        - 发布运行时长和热性能数据。
        - 进度重置，或无法可靠功率运行。
      - - 资本可得性
        - 作为 2023 年成立的核能初创公司，Valar 融资规模异常大。
        - 3 月债务和 8 月信贷额度意味着，未来下行可能比表面估值暗示得更快传导到股权。
        - 干净的债务文件和非惩罚性优先权条款。
        - 限制性契约或对退出价值的优先索偿。
      - - 可比公司
        - Oklo、NuScale、Kairos、X-energy 和 TerraPower 证明投资人愿意为核能期权价值付费。
        - 同行也表明，在商业证明前，长周期和高烧钱可能持续很久。
        - 证据显示 Valar 能比同行更快或更便宜地拿到证明。
        - 同行进展超过 Valar，而 Valar 仍不透明。
      - - 估值
        - 如果 Valar 能快速把证明转成合同，并保持许可推进，$6B 估值可能变得合理。
        - 没有收入或合同经济性时，这个估值已经假定了尚未公开的成功。
        - 功率运行时长，加上可融资的合同经济性。
        - 披露没有改善，价格继续上行。
    notes: 各行把“拥有这个故事”的理由，与“今天按当前价格买入”的理由拆开。
    claimRefs:
      - CV007
      - CV008
      - CV013
      - CV014
      - CV039
      - CV045
  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象
      - 估值 / 状态信号
      - 对 Valar 的意义
      - 参考价值
      - 主要局限
    rows:
      - - Valar Atomics
        - 私有市场据报在 $1B Series B 加 $200M 信贷额度后，投后估值 $6B。
        - 作为本文检验当前入场价格的锚点。
        - 最接近的直接价格信号。
        - 私有估值，财务披露有限，优先权 / 契约条款未披露。
      - - Oklo
        - 2025 年非关联方市值约 $7B；Aurora-INL 目标时间为 2027 年末至 2028 年初。
        - 说明公开市场会在规模化前为先进核能期权价值付费。
        - 最好的美国公开先进反应堆标的。
        - 反应堆类型和燃料循环逻辑不同。
      - - NuScale
        - 2025 年非关联方市值约 $5.3B，且披露的运营现金消耗很重。
        - 显示商业化前反应堆开发会吃掉多少资本。
        - 基于公开申报的资本强度代理。
        - 面向公用事业的 SMR 路径，不是 Valar 式巨型场址路径。
      - - Bloom Energy
        - 2025 年非关联方市值约 $3.9B，且已有真实运营业务。
        - 提醒：有收入的能源硬件公司也可能在 Valar 私有估值附近或以下交易。
        - 有用的非核能源硬件参照。
        - 不是反应堆开发商，也不是直接许可比较。
      - - X-energy
        - 约 $500M Series C-1 融资，以及与 Amazon 绑定的 >5 GW 部署雄心。
        - 证实强势战略资本仍在支持 HTGR 同行。
        - 最接近且已披露的 HTGR / TRISO 融资参照。
        - 融资额不等于已披露企业价值。
      - - Kairos Power
        - 与 Google 达成最高 500 MW 协议，首座反应堆计划 2030 年投运。
        - 显示买方支持按里程碑推进的容量协议。
        - 核能商业化的企业购电参照。
        - 购电结构不是估值标记。
      - - TerraPower Natrium
        - 345 MWe 基荷，配储能峰值 500 MWe，2026 年 NRC 许可，并有 DOE 支持。
        - 说明更成熟的项目仍要补贴，也要走漫长监管流程。
        - 可作为成熟度和规模参照。
        - 厂站级别远大于 Valar 当前公开设计。
    notes: 这张表混合了私募估值、公开市场信号、融资轮次和由里程碑支撑的客户承诺， 因为营收前先进核能没有单一标准化估值指标可直接套用。
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most relevant public valuation and milestone anchors for U.S. advanced-nuclear peers and
        adjacent energy-hardware references discussed in this chapter; it is not an exhaustive census of all reactor
        developers.
