      - number: '4.3'
        title: 成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Valar 即使在商业化启动前，成本结构看起来也很资本密集。公司在建实体反应堆、场址基础设施、屏蔽和测试系统；招聘覆盖项目融资、会计、ERP、薪酬、建设质量、燃料工厂运营和电站运营；Utah
              项目还依赖外部工程和建设伙伴。官方 Project NOVA 材料也清楚表明，公司仍在花钱验证核心设计、氦回路调理和升温协议。这些都不像精简软件公司的烧钱曲线。


              由于 Valar 不披露自身单位经济性，最好的公开代理指标是会提交文件的可比先进反应堆公司。NuScale 的 2026 10-K 称，它仍没有产生实质收入，至今收入来自工程和许可服务；同时，尽管持有超过
              $1.2B 流动性，它在 2025 年仍消耗 $459.6M 经营现金。Oklo 的 2026 10-K 同样显示，大量流动性伴随持续亏损。Bloom Energy
              虽然不是核能同业，但提供了有用的表后硬件类比：终端用户常常偏好融资型电力结构，即使已有收入，客户集中度也可能仍然很高。这些可比公司不能证明 Valar 会长得一样，但它们说明，未披露利润率和单机 capex
              不是装饰性遗漏，而是重大尽调缺口。
