      - number: '2.3'
        title: 买方、用户、付款方与可能的首批签约路径
        blocks:
          - type: paragraph
            body: >-
              Valar 的买方地图多分段但逻辑一致。在超大规模云和 AI
              园区场景中，用户是计算园区，经济买方可能是能源采购、基础设施或场址开发团队；对他们来说，电力可得性是新产能上线的门槛。在公用事业和公共电力场景中，付款方更可能是服务电网的主体，它能签约购买清洁稳供电力块，再把电量分配给负载增长、可靠性需求或大客户承诺。工业用户并不太在意“AI
              电力”这个类别，更关心连续电力加高温热、蒸汽、氢气或燃料合成经济性的组合。同一类反应堆会落到不同预算所有者手里，取决于问题到底是电网瓶颈、工艺热，还是燃料原料。


              公开同业证据显示，首批合同未必总是超大规模云厂商直接在围栏后购买反应堆。Kairos 与 Google 相关的部署通过 TVA 流转，而不是直接进入某个私有园区。TerraPower 的 Wyoming
              案例明确围绕区域电网和退役煤电场址需求展开。Oklo 的监管材料强调卖 power-as-a-service，而不是卖反应堆硬件。这些模式重要，因为它们暗示 Valar
              的早期收入可能先来自公用事业、试点、工业园区或政府相关场址，再来自纯粹的超大规模云“把反应堆放到我数据中心旁边”动作。因此，分段地图的重点不是理论上谁需要密集电力，而是谁能在现实时间表上签约、获批、融资，并吸收首台套核能产出。
