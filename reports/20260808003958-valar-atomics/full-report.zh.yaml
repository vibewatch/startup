      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论偏谨慎。Valar
              已经清楚解决了早期融资方程的一半：它能吸引资本和注意力。但它还没有解决公开投资者或后期私募投资者通常用于承销的另一半：证明定价真实、需求已签约、利润率为正或可信地朝那里走，以及商业化无需持续再融资。独立反向来源强化了这个担忧。Mother
              Jones 引用专家质疑小型反应堆能否具备经济竞争力；AP 引用一位怀疑者的话说，吸睛的空运并没有回答项目是否经济或可行。这些并非最终否定，但确实框定了正确的尽调姿态。


              因此，核心财务发现不是“经济性已被证明很差”，而是“经济性尚未公开证明”。投资者应要求当前现金余额、月度总烧钱和净烧钱、$200M 额度及任何仍未偿还 2026 年 3 月债务的完整信贷协议和抵押条款、每套
              Ward 级系统的 capex 和 opex、任何客户 LOI、PPA 或氢气 /
              燃料承购协议、预期服务毛利率，以及试点部署与商业部署的回款画像。在这些材料出现之前，估值更多由战略叙事、政策加速和技术野心锚定，而不是由可审计的经营表现锚定。
