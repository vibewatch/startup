        - 里程碑推进快，可以提前撬动融资和人才
        - 速度可能依赖特殊试点条件，无法迁移到商业部署
        - 高
        - 今天是优势，明天能否守住不确定
        - 区分只适用于试点的许可和可复用的商业化优势
      - - 首家初创公司临界宣传
        - 帮 Valar 从其他初创公司中抢到注意力
        - 没有长周期发电数据，公开里程碑未必转化为买方信任
