  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发因素
      - 阈值 / 日期
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 没有 Ward 250 持续带功率证据
        - 相较 2026-2028 年公开时间线出现重大延误
        - 把当前期权价值变成更慢、更高风险的科学项目。
        - 按熊情景重切估值，或停止推进。
      - - 债务或优先股栈条款被证实苛刻
        - 任何让新普通股投资者明显劣后于优先索偿的条款
        - 即便技术推进，也会压低上行收益捕获。
        - 任何投资决定前，必须先拿到瀑布模型。
      - - 燃料供应或监管受挫
        - HALEU、DOE 授权或 NRC 路径比当前暗示更慢
        - 抹掉 Valar 相对同行的速度溢价。
        - 从继续研究转为回避，直到时间风险重新定价。
      - - 没有披露客户经济性
        - 技术里程碑之后，仍没有已签定价、量或期限证据
        - 让估值继续靠叙事，而非合同转化。
        - 不要以高于该标记估值的价格入场。
    notes: 这些是会打断投资逻辑的条件，不是泛泛的创业风险。每一项都会直接改变理性投资者应该支付的价格。
