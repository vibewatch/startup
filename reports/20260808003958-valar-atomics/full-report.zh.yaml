      - number: '7.3'
        title: 执行与依赖栈
        blocks:
          - type: paragraph
            body: >-
              Valar 的项目之所以快，恰恰因为它依赖一套密集的外部支持栈：DOE 试点授权、LANL/NCERC 实验、Nevada 燃料和测试基础设施、Utah
              场址准入、本地政治支持，以及一个仍在关键燃料、运营、建设和财务岗位上招聘的组织。这些不是附带助推器，而是当前计划的操作系统。DOE 已选择 Valar 进入试点，但 Reuters 和 Utility Dive
              都指出，每个参与者仍自行承担设计、制造、建设、运营和退役成本。换句话说，联邦背书加速了路径，但没有吸收执行复杂度或资本强度。


              这让 Valar 暴露在排序风险中。ANS、AP 和 Utah
              本地报道显示，这个项目已经把冷临界、破土、军用空运、社区沟通和场址转移串在一起，公开可见缓冲很少。同一批证据也说明，不能夸大本地热情：县支持信和开放日有助于社区接受，但无法替代燃料交付、带功率调试、合规人员配置或有韧性的供应链。务实判断是，Valar
              已展现出异常强的创业速度，但只差一次滑点就可能把速度变成拥堵。燃料交接延迟、场址调试问题或合规流程失误，都可能迅速传导为收入时间点落空，因为当前公开计划看不到多少缓冲。
