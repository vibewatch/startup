    rows:
      - - Valar Atomics
        - HTGR 微反应堆 / 离网吉瓦级站点
        - $450M 融资，估值 $2B；Tracxn 跟踪总融资 $489M
        - 数据中心、氢、工业热、合成燃料
        - 自身产品范围定义目标工作流
        - 没有公开带功率运行记录；公开披露的 Ward250 规模不一致
      - - X-energy
        - HTGR / TRISO 工业 SMR
        - 大型先进核能平台；销售高温蒸汽和稳定电力
        - 重工业、先进技术、更大站点清洁能源
        - 公开信息中最接近的 HTGR + TRISO + 工业热类比对象
        - 公开定位更弱化可运输性，也不围绕园区微反应堆
      - - Oklo
        - 快裂变表后反应堆
        - 上市公司画像；Aurora-INL 目标时间为 2027 年末至 2028 年初
        - 园区电力、数据中心、共址 24/7 电力
        - 在离网电力和数据中心叙事上高度重叠
        - 不是高温气冷 / 合成燃料主张
      - - Kairos Power
        - 熔盐先进反应堆项目
        - 跨州研发、制造和示范布局
        - 示范反应堆、公用事业相邻清洁电力、工业负荷
        - 以执行可信度和工厂化开发竞争
        - 公开叙事较少聚焦氢或合成燃料
      - - TerraPower
        - 带储能的大型钠冷 SMR
        - ARDP 支持的怀俄明首座电站
        - 公用事业级清洁电力、大型工业或超大规模采购
        - 切入大型清洁电力预算和严肃对手方
        - 规模明显大于 Valar，也更偏向电网
      - - DOE 试点进入者群体
        - 可能进入者
        - Aalo、Antares、Deep Fission、Last Energy、Natura、Radiant、Terrestrial、Oklo、Valar，以及 Atomic Alchemy 关联活动
        - 微电网、试点反应堆、军事、专项或园区负荷
        - 争夺首个验证点心智和投资者资本
        - 许多仍处早期阶段，或披露很薄
      - - 存量核电 / 提功率
        - 既有替代方案
        - 现有机组、重启和提功率可更快交付大体量电力
        - 需要近期无碳电力的超大规模企业或工业买方
        - 在某些情况下更快解决同一个 24/7 清洁电力问题
        - 非模块化；对站点相邻热产品的适配度较低
      - - 电网加燃气 PPA
        - 现状替代方案
        - 到 2030 年，在高需求场景中仍是现实默认选项
        - AI 园区、工业负荷、一般电力采购
        - 可获得、可融资，运营上熟悉
        - 有碳暴露，也没有 Valar 式产品差异化
    notes: 各行混合了直接同业、相邻先进反应堆供应商和现状替代方案，因为 Valar 同时面向多种买方任务销售。融资和规模只是公开信号的代理变量，不是标准化企业价值。
