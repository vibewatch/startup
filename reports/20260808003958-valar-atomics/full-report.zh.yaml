      - number: '2.4'
        title: 采用驱动因素、时间约束与规模化前提
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动因素在 Valar 和同业材料中都很清楚：负载增长快过电网交付，关键任务场址需要可靠性，电力与工业热结合有价值。Valar 自己的主张依赖 gigasite 的场址成本摊销；X-energy 和
              Kairos 都认为，模块化、在线换料或标准化建设能把核能推近需求点；TerraPower
              的选址标准也显示，基础设施可达性和可许可性同商业就绪度不可分割。合在一起，证据支撑一个清晰判断：市场确实需要清洁稳供能源，而且这种能源若能比传统核电站更靠近受限负载，需求会是真实的。


              但约束至少和需求池同样重要。DOE 的试点框架可能为测试反应堆移除一个许可瓶颈，但 Utility Dive 记录了直接批评：绕过 NRC 会增加安全和治理风险。DCD
              指出，开发商仍要自己承担设计、建设、运营和退役成本，所以更快的试点路径不会让资本密集度消失。Kairos 的 TRISO 工作和 X-energy 的 TRISO-X
              定位也说明，燃料和制造就绪度仍是商业化闸门，不是背景细节。TNW 对这个领域的梳理在时间上很直白：领先的先进反应堆初创公司仍没有规模化交付商业电力。对估值来说，结论是 Valar
              所处市场确有采用压力，但公开证据仍指向分阶段路径——先证明试点，再验证渠道、标准化场址、准备燃料，最后才是更广泛的超大规模云或工业铺开。
