  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 目标账户与买方结构
        blocks:
          - type: paragraph
            body: >-
              Valar 的客户故事在战略上容易理解，在商业上很难承销。官方材料一贯把公司放在离网能源产品上，而不是受监管公用事业销售：数据中心电力、工业电力、氢气和清洁燃料。Business Insider 和 Axios
              通过引用管理层对“为什么电网不是首选客户”的说法，进一步强化了这个信息。运营思路是把反应堆同非常大的负载共址，这些负载重视韧性、可控性和高温工艺热，而不是去争普通批发电网需求。


              这一定义了买方集合。相关决策者不是零售电价用户，也不是广义公用事业辖区；而是数据中心开发商和运营商、工业场址所有者、氢气或燃料运营商，以及需要快速部署电力的公共部门用户。本地新闻和 AP
              报道还加入了第五类买方原型：重视可运输性和能源安全的军方或韧性导向用户。因此，公开记录支持一种聚焦、高价值账户策略。它尚未支持的是：任何目标账户已经转化为披露的长期 PPA、生产部署或经常性扩张合同。
