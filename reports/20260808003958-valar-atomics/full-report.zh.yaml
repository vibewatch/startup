  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格背景与建议
        blocks:
          - type: paragraph
            body: >-
              Valar 2026 年 8 月被报道的估值很好描述，却很难承保。TechCrunch 和 Yahoo Finance / Bloomberg 称，公司在 $1B Series B 后的投后估值被报道为
              $6B；Valar 自己另行确认了 $200M 信贷额度和 Sequoia 董事会参与。仅这个速度就足以解释公司为什么吸引关注：投资人显然在为一个被感知到的机会付费——成为最早把 AI
              时代真实需求和真实硬件进展接起来的先进核能创业公司之一。


              问题在于，公开记录仍未披露能让投资人把 $6B
              视为传统财务价格的输入项。没有公开收入、没有披露定价、没有单机毛利、没有已签电力经济性包，也看不到信贷契约或股权优先权结构。这让本章更接近价格敏感型建议，而不是公司质量评分。按这个标准，结论仍是继续研究，置信度中等，估值立场则已偏昂贵：公司或许值得严肃尽调，但公开证据尚不足以证明可以穿透当前估值买入。
