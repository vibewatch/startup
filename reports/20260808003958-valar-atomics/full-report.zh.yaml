      - number: '8.2'
        title: 为什么 $6B 估值更像里程碑装载，而不是收入支撑
        blocks:
          - type: paragraph
            body: >-
              与大多数 2023 年成立的创业公司相比，Valar 已经取得更多技术和政治推进。Project NOVA 在 DOE 与 Los Alamos 监督下达到冷临界，Ward 250 随后进入 Utah
              的真实功率运行；2026 年 8 月公开来源称，它在 Valar 与 Nvidia 宣布 30 MW 无水 AI 工厂合作前，为 Nvidia DGX Spark / Blackwell
              系统供电。这些是真实数据点，不是空气项目。它们也解释了为什么投资人可能愿意在商业指标可见前支付溢价。


              但装载里程碑的估值，不等于持久经济证明。New Scientist、Associated Press、SMRIntel 和 Mother Jones 各自呈现了同一条警示的不同版本：冷临界不等于商业运行，有限的
              Nvidia 工作站演示不等于可融资的数据中心部署，对小反应堆竞争力的专家怀疑仍然存在。3 月债务和 8
              月信贷额度在这里很重要，因为一家公司一旦开始在收入前核能建设上叠加优先资本，时间线滑坡或成本意外伤害股权价值的速度，会比头条融资总额显示得更快。因此，公开证据支持的是期权价值框架：Valar
              给自己买到了更多射门机会，但还没有权利被当作已经进球来承保。
