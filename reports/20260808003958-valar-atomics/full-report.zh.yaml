      - number: '3.4'
        title: 护城河耐久性、切换成本与高不确定性位置
        blocks:
          - type: paragraph
            body: >-
              Valar 的护城河在概念上真实存在，但证据上仍有条件。故事的独特之处不只是“AI
              小反应堆”；其他公司也能这么说。更强的主张是把高温热、离网选址，以及同一个反应堆家族变现电力、氢气、工业热和烃类燃料的可能性结合起来。如果这个产品栈跑通，Valar
              就可能同只卖电力的对手拉开差异。但护城河能否持久，取决于买方是否更重视这种多功能性，而不是已验证运行时长、公用事业关系和透明许可。买方一旦选择某个反应堆供应商，切换成本应当很高，因为燃料形态、冷却剂、许可路径、场址布局和长期运营模式会一起改变；在同一场址多供应商并行因此不现实。即便如此，公开证据在两个最商业化的问题上仍不完整：Ward250
              在单机尺度上到底是什么，以及 Valar 能否展示优于替代品或资本更充足同业的经济性。公开描述还不能把 Ward250 干净对齐，所以公司仍要求投资者相信一个移动中的规格，并押注速度会转化成可融资的运营证明。
