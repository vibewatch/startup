      - number: '5.2'
        title: 反应堆架构与验证阶梯
        blocks:
          - type: paragraph
            body: >-
              从架构看，Valar 明显属于 HTGR 家族。公开来源在 TRISO 燃料、石墨慢化和氦冷上口径一致；Project NOVA
              还把不锈钢中的碳化硼控制元件加入已披露材料栈。这已经足以理解基本设计哲学：一种使用包覆颗粒燃料、以石墨为中心堆芯的高温气冷堆，优化目标是高品位热，而不只是传统电网电力。最清楚的技术证据来自
              NOVA，因为那是公司从营销文案走进真实联邦测试环境的节点。Valar、WIRED 和 New Scientist
              都认为该里程碑是零功率临界——这很重要，因为它验证堆芯几何和反应性行为，但并不等同于证明一座热态集成反应堆。


              Ward Zero 用一个非核、全温度替身填补了部分缺口。Ward Zero 和 NOVA
              合在一起，支持公司有意分离热工验证和中子学验证的说法。它们尚未证明的是集成发电、在设计温度下持续运行，或具备商业价值的转化效率。关于压缩机、换热器、涡轮系统和特定产品配套系统平衡的公开细节仍然缺失。这个中间缺口解释了为什么
              Ward250——而不是 NOVA——仍是决定性的技术产品里程碑。
