      - number: '5.3'
        title: 可制造性与运营模型
        blocks:
          - type: paragraph
            body: >-
              Valar 的差异化主张不只是新物理，而是可制造性。公司反复主张，核工业的问题是手工作坊式部署，而标准化 gigasite 模式可以创造重复经济。公开证据部分支持这个论点。Utah
              报道点名了外部工程和建设伙伴；招聘则显示，公司不只在补反应堆设计，还在补燃料工厂、涡轮机械、供应商质量、电站运营、IT
              和系统职能。这符合纵向整合运营野心，而不是一家狭窄设计公司的样子。它也意味着执行负担很宽：Valar 必须建设核堆芯项目、燃料处理能力、场址建设能力，并最终具备运营工业园区的能力。


              到这里，披露缺口开始比话术更重要。与 X-energy、Oklo 等同业相比，Valar
              对堆芯周边电站系统发布的系统级细节少得多。公司有足够公开具体性支撑一个真实反应堆努力，但还不足以承销工厂吞吐量、可维护性或首批客户运营保证。2026 年 2 月下旬的社区报道还显示，Utah
              项目仍处在组装和文书阶段，这意味着 7 月 4 日目标前存在真实的进度压缩。可制造性论点方向上可信，但经审计的执行证据仍处早期。
