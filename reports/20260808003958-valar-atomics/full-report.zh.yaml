      - number: '6.2'
        title: 当下具名证明是试点、宿主和伙伴
        blocks:
          - type: paragraph
            body: >-
              最强的公开证明不是一面超大规模云厂商 logo 墙，而是一串试点和宿主关系。TechCrunch 和 Business Insider 都报道了 Philippines Nuclear Research
              Institute 研究合同；在留存来源集合中，这似乎是最清楚的具名客户式协议。在美国，可见交易对手大多是基础设施和验证伙伴：DOE 的 Reactor Pilot Program、Project NOVA 下的
              Los Alamos 和 NCERC、Utah San Rafael Energy Lab，以及 Emery County
              的本地主场生态。这些证明点有意义，因为它们显示的是真实选址、测试和机构支持，而不是幻灯片。


              但区分很重要。Project NOVA 验证的是反应堆物理和政府实验室合作；它不是经常性商业承购。USREL 和 Emery County 证明宿主场址接受度和地方政治支持；它们不证明电力购买转化。Nvidia
              现在是公开 30 MW AI 设施合作中的具名战略伙伴，但留存来源仍把这项工作描述为研究或规模化计划，而不是已披露的长期电力合同。即使 PNRI
              关系很有战略意义，它也被描述为一条研究或试点路径，后续才有全规模野心，并不是已披露的高收入生产合同。公开层面，Valar 因此已经跨过从概念到具名试点生态的线，但还没有跨过从试点生态到可融资客户基础的线。
