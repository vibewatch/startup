      - number: '1.4'
        title: 里程碑、项目与规模化路径
        blocks:
          - type: paragraph
            body: >-
              对先进核能公司来说，Valar 的里程碑序列压缩得异常厉害。官方材料称，Ward Zero 是 Los Angeles 的非核热工原型，随后是 Utah 的 Ward 250 建设、入选 DOE
              加速试点框架，以及 Project NOVA 于 2025 年 11 月 17 日在 Nevada、由 Los Alamos 运营的 NCERC 达到零功率临界。公开报道随后显示，2026 年 2 月，一架
              C-17 将设备从 California 空运到 Hill Air Force Base，再转运到 Utah San Rafael Energy Research Lab，同时 Emery County
              也开展了社区沟通。2026 年 6 月到 7 月的序列改变了本次更新的判断：TechCrunch、Valar 2026 年 8 月融资公告和 SMRIntel 都称，Ward 250 随后在 Utah
              实现自持临界，并为一套 Nvidia DGX Spark / Blackwell 系统供电；Valar 和 Nvidia 还公开把这次演示同 Utah 计划中的 30 MW 无水 AI 设施相连。

              这些里程碑重要，因为故事从“冷态临界加可运输性”变成了“有限真实负载验证加商业设计研究”。即便如此，公开记录里仍有重要模糊点：有些来源仍把 Ward 250 描述为 5-megawatt 反应堆，另一些则称它是
              100-kWt / 100-kWth 装置，说明可能存在不同功率口径、不同阶段，或者公开解释不完整。公司单独的 Philippines 计划和 NRC 诉讼进一步说明，Valar
              正在并行追求多条监管路线，而不是押注单一路径。
