        title: 需求信号与采购标准
        blocks:
          - type: paragraph
            body: >-
              需求论文本身可信。IEA 预计，服务数据中心的发电量从 2024 年到 2030 年将增加一倍以上；Data Center Frontier
              描绘的市场里，超大规模云厂商正在积极寻找稳定、全天候、无碳电力供应。TechCrunch 的行业综述显示，主要科技买家已经和其他供应商签署或资助核能安排。这个背景对 Valar
              有利，因为它说明公司瞄准的是真实采购痛点，不是在凭空造需求。


              同样的比较也说明，Valar 仍要跨过哪些采购门槛。未来客户大概率不会太在意冷临界新闻，更会关心反应堆能否带功率运行、可靠调峰、拿到商业许可、锁定燃料，并支撑长周期合同结构。New Scientist
              称，未来客户会要求受控功率运行、热性能和长期可靠表现；Reuters 和 AP 则把燃料、经济性、安全和许可这些现实障碍摆到台面。换句话说，市场拉力真实存在，但 Valar
              目前是否满足可融资级买方标准，证据仍不完整。
