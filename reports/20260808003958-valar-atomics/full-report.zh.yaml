      - number: '2.2'
        title: 规模测算视角：电力问题很大，但不是清晰的 Valar 专属 TAM
        blocks:
          - type: paragraph
            body: >-
              留存来源没有清楚发布 Valar 专属的总可用市场（TAM）、可服务市场（SAM）或可获取市场（SOM），所以只能通过相邻需求池和反应堆采购区间来三角测算。最宽的独立视角来自 IEA
              对数据中心用电的展望：基准情景下，供应给数据中心的电量从 2024 年的 460 TWh 上升到 2030 年超过 1,000 TWh，核能在本十年后期会变得更重要。Valar
              自己主页的口径窄得多，也更营销化，声称到 2030 年 AI 模型将需要超过 200 TWh 的新增电网电力。EIA 对加密挖矿的分析提供了一个有用类比，说明高耗电计算负载能多快变成系统级变量：美国每年
              25-91 TWh，占全国需求 0.6%-2.3%，运营商会转向便宜电力、直接发电连接和需求响应项目。TNW 则加入资本市场视角，引用 Goldman Sachs 的说法，称 AI 缺口最终需要 85-90 GW
              新增核电容量。


              这些数字有意义，因为它们确立了问题规模，但并不能证明 Valar 能按比例拿到份额。更近端的商业切入口，应该通过买方面对的部署块和渠道结构来理解：Kairos 正向 TVA 电网出售 50 MW，以服务
              Google 相关需求；X-energy 对外销售 80 MWe 模块和带工业蒸汽的 320 MWe 四机组包；TerraPower 的 Natrium 落在 345-500 MW
              区域电网区间。证据说明，公开市场目前披露稀缺问题和可能采购规模，比披露 Valar 专属可触达市场清楚得多。因此，任何硬性的 SAM 或 SOM 数字都只能是估计，不是公开事实。
