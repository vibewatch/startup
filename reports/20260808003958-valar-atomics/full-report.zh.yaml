  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与项目栈
        blocks:
          - type: paragraph
            body: >-
              Valar
              展示的不是一次单一公用事业式反应堆销售。公开材料定义的是一个更广的离网能源平台：标准化反应堆与大型负载或工艺用户共址。第一层要完成的任务包括为数据中心提供可靠电力，为重工业提供高品位工艺热，通过硫碘化学制氢，并最终通过改造后的
              Fischer-Tropsch 链生产合成烃类燃料。这个框架重要，因为它把公司推入一个产品栈，而不只是核心物理问题：Valar 必须把反应堆、传热系统、转化层、场址模型和运营模型一起证明。


              公开成熟度阶梯也异常清楚。Ward Zero 是热工替身；Project NOVA 是中子学证明点；Ward250 是第一座集成带电反应堆；gigasite
              则是再往后的规模化论点。纸面上，这是合理的工程推进，因为它把风险拆成热工系统检查、零功率堆芯验证，然后才是集成电站启动。2026 年 6/7 月里程碑重要，是因为 Ward 250
              从未来时项目变成了有限真实负载证明点。但同一序列也凸显今天仍缺什么：没有公开热平衡包，没有完整商业产品规格，也没有披露证据显示下游氢气或燃料层已经超出概念性工艺主张。产品故事连贯，但面向客户的 SKU
              定义仍然很薄。
