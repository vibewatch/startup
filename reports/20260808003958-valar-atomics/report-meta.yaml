  topStrengths:
    - >-
      Real DOE- and Utah-linked milestones, including a limited Nvidia-powered demonstration, put Valar ahead of many
      narrative-only advanced-nuclear startups.
    - >-
      The product thesis is tightly aligned with AI-era demand for dense, always-on, carbon-free power and industrial
      heat.
    - >-
      A $1 billion Series B plus a $200 million credit facility give the company unusual access to capital and
      manufacturing optionality for a 2023-founded startup.
  topRisks:
    - >-
      Commercial NRC translation, HALEU fuel supply, and waste/disposal pathways remain unresolved enough to break the
      schedule.
    - >-
      Revenue, pricing, signed offtakes, margins, and credit-covenant details are not public, leaving the $6 billion
      valuation mostly narrative-driven.
    - >-
      Founder-centric governance and reputational controversy could turn technical or policy stumbles into financing
      stress despite the new Sequoia-led round.
  unresolvedGaps:
    - Exact credit covenants, equity preference stack, and investor ownership rights for the August 2026 financing.
    - >-
      Signed customer documents, pricing terms, and project-level unit economics for initial deployments and the planned
      30 MW AI facility.
    - Sustained at-power operating data, project-specific fuel allocation, and a durable waste-handling pathway.
