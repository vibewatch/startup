      - number: '1.5'
        title: Risks, Controversies, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The main company-overview risks are not subtle. First, Valar’s credibility is no longer about merely
              hitting a patriotic July 4 target; it is about proving that a DOE-authorized milestone and a small Nvidia
              load demo can convert into an NRC-licensable commercial product. Second, revenue, customer count, margin
              profile, and signed commercial power contracts are still not publicly disclosed, so the jump from $2
              billion in March to a reported $6 billion post-money valuation in August remains heavily narrative-driven.
              Third, adverse reporting continues to raise questions about investor reputational exposure, founder
              judgment, and the prominence of close associates without equivalent nuclear credentials. Fourth, the
              public reactor-rating narrative is still not fully reconciled: official lawsuit language, Utah
              construction reporting, SMR-specialist coverage, and airlift coverage use materially different size
              descriptions. Finally, orbital-data-center or "formerly Aetherflux" confusion appears to belong to Cowboy
              Space rather than to Valar’s terrestrial reactor program, which is itself a reminder that the public story
              can outrun precise sourcing. These are manageable in diligence if later chapters validate technology,
              customer demand, and commercialization timelines; for now they remain central open items rather than
              edge-case footnotes.
            claimRefs:
