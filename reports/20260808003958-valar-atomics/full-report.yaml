              But the distinction matters. Project NOVA validates reactor physics and government-lab collaboration; it
              is not a recurring commercial offtake. USREL and Emery County prove host-site acceptance and local
              political backing; they do not prove power-purchase conversion. Nvidia is now a named strategic partner on
              a public 30 MW AI-facility collaboration, but the retained sources still describe that work as a study or
              scale-up plan rather than a disclosed long-duration power contract. Even the PNRI relationship, while
              strategically important, is described as a research or pilot path with later full-scale ambitions, not as
              a disclosed revenue-rich production contract. Publicly, Valar has therefore crossed the line from concept
