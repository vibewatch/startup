  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call stays at research-more because technical progress and market pull are real, but economics and the capital
      stack are still under-disclosed.
    data:
      nodes:
        - id: market
          label: AI and industrial power demand
          detail: Firm clean power demand is real and peers have found strategic buyers.
        - id: proof
          label: Visible technical progress
          detail: Cold criticality and Ward 250 site work show more than a paper reactor.
        - id: capital
          label: Fast capital formation
          detail: Seed to Series A to a reported $6B post-money mark happened in roughly 18 months.
        - id: opacity
          label: Economics still opaque
          detail: No public revenue, pricing, margin, or customer-contract package.
        - id: stack
          label: Capital-stack uncertainty
          detail: Debt and preference terms remain undisclosed.
        - id: call
          label: 'Recommendation: research-more'
          detail: Public evidence supports continued diligence, not paying through the mark.
      edges:
        - from: market
          to: call
          label: Demand supports further work
        - from: proof
          to: call
          label: Progress keeps thesis alive
        - from: capital
          to: call
          label: Financing confirms investor appetite
        - from: opacity
          to: call
          label: Blocks buy conviction
        - from: stack
          to: call
          label: Blocks price confidence
    approximationNotes: >-
      This is a logic chain, not a financial model. It shows why visible strengths do not yet outweigh missing
      underwriting inputs.
    claimRefs:
      - CV007
      - CV013
      - CV014
      - CV039
      - CV045
      - CV046
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The factors that move fair value most are milestone and capital-stack variables, not current-period multiples.
    data:
      items:
        - label: Sustained at-power runtime proof
          value: 3
          detail: Strongest positive re-rating driver once public.
        - label: Signed contract economics
          value: 3
          detail: Would convert demand story into underwritten revenue quality.
        - label: Cleaner debt / preference terms
          value: 2
          detail: Improves common-equity capture of any upside.
        - label: Hyperscaler-backed nuclear demand
          value: 2
          detail: Helps explain strategic premium, but does not replace economics.
        - label: No revenue or pricing disclosure
          value: -3
          detail: Largest reason to avoid pretending a traditional multiple is defensible.
        - label: 2026-2028 schedule slippage
          value: -3
          detail: Would collapse option value faster than the current narrative implies.
        - label: Fuel-supply or regulatory setback
          value: -2
          detail: Can erase Valar’s speed advantage relative to peers.
    approximationNotes: >-
      Impact scores are ordinal from -3 to +3. They rank directional valuation sensitivity rather than forecast
      percentage moves.
    claimRefs:
      - CV015
      - CV019
      - CV025
      - CV039
      - CV041
      - CV047
      - CV049
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Scenario ranges are anchored to milestone outcomes and contract proof, not to revenue multiples.
    data:
      items:
        - label: Bear case (USDm)
          low: 600
          value: 900
          high: 1200
          detail: Timeline slip, punitive stack, no contract economics.
        - label: Base case (USDm)
          low: 1500
          value: 1900
          high: 2400
          detail: At-power demo lands, but recurring economics stay mostly private.
        - label: Bull case (USDm)
          low: 3000
          value: 3750
          high: 4500
          detail: Runtime, signed contracts, and repeatable deployment math appear.
    approximationNotes: >-
      All values are enterprise-style directional ranges in USD millions for valuation discussion only; they are not DCF
      outputs.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
