      - number: '7.3'
        title: Execution and dependency stack
        blocks:
          - type: paragraph
            body: >-
              Valar's program is fast precisely because it depends on a dense external support stack: DOE pilot
              authorization, LANL/NCERC experimentation, Nevada fuel/test infrastructure, Utah site access, local
              political support, and an organization still hiring into critical fuel, operations, construction, and
              finance roles. Those are not incidental enablers; they are the operating system of the current plan. DOE
              selected Valar for the pilot, but Reuters and Utility Dive both note that each participant still bears its
              own design, manufacturing, construction, operating, and decommissioning costs. In other words, federal
              sponsorship accelerates the path, but it does not absorb execution complexity or capital intensity.


              That leaves Valar exposed to sequencing risk. ANS, AP, and local Utah coverage show a program that has
              already chained together cold criticality, groundbreaking, military airlift, community outreach, and site
              transfer with very little public slack. The same evidence also shows why local enthusiasm should not be
              overstated: county support letters and open houses help community acceptance, but they do not substitute
              for fuel delivery, at-power commissioning, compliance staffing, or a resilient supply chain. The practical
              read is that Valar has shown unusually strong startup velocity, yet it remains one slip away from turning
              speed into congestion. A delayed fuel handoff, site-commissioning issue, or compliance-process miss could
              transmit quickly into missed revenue timing because the current public plan has few visible buffers.
            claimRefs:
