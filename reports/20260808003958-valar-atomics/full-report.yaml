  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal surface
        blocks:
          - type: paragraph
            body: >-
              Valar's largest single risk remains regulatory translation: the company has found a way to move quickly in
              DOE-controlled testing, but public evidence does not show that it has solved the path to routine
              commercial licensing. Official company material, Reuters, and Utility Dive all say the DOE pilot can
              authorize test reactors outside the NRC and is explicitly targeting criticality by July 4, 2026. That is
              real acceleration. It is also not the same as a bankable commercial operating framework. WIRED and NRC
              materials both make clear that commercial reactors still must reengage the NRC, and NRC's own
              rapid-licensing framework for microreactors—Proposed Part 57—was still only a proposal as of May 2026.
              NRC's ADVANCE Act implementation page also says the agency is still working through statutory deadlines
              for expedited reviews and microreactor guidance, while the NRC-2025-0379 docket on Regulations.gov
              remained a closed comment docket for a proposed licensing pathway rather than a finalized regime. That is
              supportive policy direction, but it still means the commercial framework is being built in real time.


              The lawsuit against the NRC sharpens the risk rather than eliminating it. Valar is not merely lobbying for
              reform; it is publicly arguing that current federal rules make prototype testing too slow and that Ward
              One would otherwise be tested in the Philippines. That signals genuine schedule pain and a management
              willingness to push institutional boundaries. It may ultimately help reform the regime, but today it means
              Valar is operating in a live legal-policy contest over who regulates what, on what timeline, and with what
              safety thresholds. For an investor, that creates binary risk: rapid progress if DOE-first pathways hold,
              but sharp delay if commercial licensing, court outcomes, or regulatory interpretation fail to converge
              fast enough.
            claimRefs:
