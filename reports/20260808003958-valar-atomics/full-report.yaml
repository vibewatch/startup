      - number: '3.2'
        title: 'Direct peer comparisons: HTGR, microreactor, and demo-path differences'
        blocks:
          - type: paragraph
            body: >-
              Among named peers, X-energy is the hardest company for Valar to dismiss because the overlap is structural:
              both rely on HTGR and TRISO narratives, both emphasize industrial heat, and both frame advanced nuclear as
              a solution for energy-intensive modern industry. The difference is commercial posture. X-energy's public
              positioning reads more like a larger industrial or utility-adjacent platform, while Valar emphasizes
              transportable pilots and off-grid campuses. Oklo differs even more on reactor physics and customer
              promise: Aurora is a compact advanced-fission power story with a fuel-recycling angle, appealing to campus
              and behind-the-meter electricity buyers more than to synfuel or process-heat buyers. Kairos is the
              clearest execution benchmark. Its footprint across R&D, salt work, manufacturing, and the Hermes
              demonstration campus signals a stepwise program that large buyers may regard as more conventional and
              legible than Valar's airlift-plus-lawsuit narrative. TerraPower, by contrast, is a reminder that not all
              serious competitors are small: Natrium is much larger, grid-oriented, and storage-enabled, which weakens
              its design analogy to Valar but strengthens its relevance in any conversation about who will win the
              biggest clean-power budgets.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
