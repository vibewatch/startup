      - number: '7.4'
        title: Financing, commercialization, and reputation
        blocks:
          - type: paragraph
            body: >-
              Financing is a mitigant, but not a clean answer. August 2026 sources show that Valar has now raised at a
              scale that pushes the company into late-stage expectations, while Data Center Frontier, AP, and peer 10-Ks
              all reinforce that next-generation nuclear is still not bankable for near-term AI load planning without
              more proof. The public record still shows no disclosed signed PPA book, no project-level economics, no
              explicit customer concentration table, and no public commercial-license schedule tied to revenue
              recognition. That means the current financing has reduced insolvency risk in the short run, but it has not
              solved conversion risk between a high-profile demo and a real revenue stack.


              Reputation and governance make that financing risk sharper. Mother Jones raises issues around investor
              associations, founder judgment, and safety communications; Business Insider and TechCrunch both show how
              central Isaiah Taylor is to the story; and public governance disclosure still lags the amount of capital
              involved. None of those issues alone disproves the company. But together they increase the odds that a
              technical stumble, safety messaging error, or political shift becomes a funding event rather than just a
              PR event. Investors should therefore separate two propositions that can look similar in momentum markets:
              Valar may be one of the fastest-moving nuclear startups, and Valar may still be too early to underwrite as
              a routine commercial power company. The former is supported by evidence. The latter is not yet.
            claimRefs:
              - CR034
              - CR035
