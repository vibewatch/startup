      - number: '4.2'
        title: Capital Formation and Financing Structure
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the one part of Valar’s financial story that is plainly visible. Public sources
              support a fast financing cadence: a February 2025 seed round widely reported at $19M, a late-2025 Series A
              of $130M, a March 2026 financing reported at $450M and a $2B valuation, and then an August 2026 Series B
              announced at $1B of equity with a separate $200M credit facility and outside reporting of a $6B post-money
              valuation. The newest round matters not just for size but for structure: the company is no longer raising
              only venture equity, it is layering equity with lender-style commitments.


              The harder question is cumulative funding and seniority. Using public disclosures, Valar appears to have
              raised about $1.4B of equity since inception before counting the new credit facility, while legacy
              trackers and older round summaries are now clearly stale. That disagreement does not invalidate the larger
              conclusion that Valar has raised an unusually large amount of capital for its age; it does, however, make
              direct diligence on the cap table, debt schedule, collateral package, and preference stack even more
              important. At this scale, the financial question is no longer whether Valar can raise money. It is how
              much of the enterprise value is already spoken for before commercialization.
