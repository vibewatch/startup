  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Valar’s public materials point to a future project-led energy business, not a software subscription or
              fully formed utility model. The company markets four end-product lanes—data-center power, hydrogen,
              industrial power, and clean fuels—and repeatedly argues that standardized gigasites will create the
              cashflow that eventually drives scale. Independent coverage is directionally consistent: TechCrunch and
              Business Insider describe an off-grid deployment model aimed at large energy buyers, while AP reports that
              management hopes to begin selling power on a test basis in 2027 and become fully commercial in 2028. That
              is important because it means the current public traction is still pre-revenue or at best pre-scale
              commercialization.


              What is missing is exactly what a financial underwriter needs most. No retained official page discloses a
              tariff, $/MWh benchmark, hydrogen price, synthetic-fuel price, reactor sale price, gross margin, or
              realized contract structure. The public materials describe what Valar wants to sell, but not how much
              customers currently pay, whether contracts are take-or-pay, or whether early deployments monetize as
              equipment sales, financed power service, test contracts, or some blend of all three. TechCrunch’s
              Philippines contract reference and AP’s 2027/2028 timeline imply monetization may arrive in stages—pilot
              work first, broader product revenue later—but the sequence is still only loosely sketched.
            claimRefs:
