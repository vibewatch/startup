      - number: '2.3'
        title: Buyer, user, payer, and likely first contracting path
        blocks:
          - type: paragraph
            body: >-
              Valar’s buyer map is multi-segment but coherent. In hyperscale and AI-campus settings, the user is the
              compute campus, while the economic buyer may be an energy-procurement, infrastructure, or site-development
              team that treats power availability as a gating requirement for bringing new capacity online. In utility
              and public-power settings, the payer is more likely a grid-serving entity that can contract for a
              clean-firm block and then allocate output across load growth, reliability, or large-customer commitments.
              Industrial users care less about “AI power” as a category and more about a package of continuous
              electricity plus high-temperature heat, steam, hydrogen, or fuel-synthesis economics. The same reactor
              class can therefore land in very different budget owners depending on whether the problem is grid
              bottleneck, process heat, or fuel feedstock.


              Public peer evidence suggests that first contracts may not always look like direct, behind-the-fence
              reactor sales to hyperscalers. Kairos’ Google-linked deployment flows through TVA, not directly into a
              single private campus. TerraPower’s Wyoming case is explicitly framed around regional grid and
              retiring-coal-site needs. Oklo’s regulatory materials emphasize selling power-as-a-service instead of
              reactor hardware. These patterns matter because they imply Valar’s early revenue may come through
              utilities, pilots, industrial campuses, or government-linked sites before it comes from a pure hyperscale
              “drop a reactor next to my data center” motion. The segment map is therefore less about who theoretically
              needs dense power and more about who can actually sign, permit, finance, and absorb first-of-a-kind
              nuclear output on a practical timetable.
