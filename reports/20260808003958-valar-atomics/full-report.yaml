      - number: '4.4'
        title: Capital Adequacy and Burn Proxies
        blocks:
          - type: paragraph
            body: >-
              Valar likely has meaningful capital, but public evidence does not say whether that capital is enough.
              There is no disclosed cash balance, monthly burn, quarterly operating cash use, debt maturity schedule,
              minimum-liquidity covenant, or runway estimate. What can be observed instead are burn proxies: continued
              hiring in finance, operations, fuel handling, and construction; outside EPC and site partners in Utah;
              vertical-integration ambitions around fuel; and a pilot pathway still dependent on DOE support, Nevada
              fuel supply, and regulatory acceleration. Those proxies argue for a cost base that is expanding faster
              than the public record can quantify.


              The structured-capital component of the 2026 financings is now especially important. March already
              included $110M of debt inside the reported $450M round, and August added a separate $200M credit facility.
              Credit can be smart if it bridges site buildout or project milestones, but it also introduces repayment,
              collateral, and covenant risk long before margins are visible. The new project-finance hiring supports the
              view that management is already preparing for structured capital and perhaps future project-finance style
              vehicles, not just another clean common equity round. The underwriting implication is straightforward:
              capital adequacy cannot be judged from headline fundraising alone. It depends on how much of the 2026
              equity is unrestricted cash, how quickly Utah, fuel, and future deployment programs absorb it, and what
              obligations sit inside the credit documents that have not been made public.
