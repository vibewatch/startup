  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price context and recommendation
        blocks:
          - type: paragraph
            body: >-
              Valar’s reported August 2026 mark is easy to describe and hard to underwrite. TechCrunch and Yahoo Finance
              / Bloomberg place the company at a reported $6B post-money valuation after a $1B Series B, while Valar’s
              own announcement separately confirmed a $200M credit facility and Sequoia’s board involvement. That pace
              alone explains why the company is attracting attention: investors are clearly paying for a perceived
              chance to become one of the first advanced-nuclear startups to connect real AI-era demand with real
              hardware progress.


              The problem is that the public record still does not disclose the inputs that would let an investor treat
              $6B as a conventionally grounded financial price. There is no public revenue, no disclosed pricing, no
              unit gross margin, no signed power-economics package, and no visibility into the credit covenants or the
              equity preference stack. That pushes this chapter toward a price-sensitive recommendation rather than a
              company-quality score. On that standard, the call remains research-more with medium confidence and now an
              expensive valuation stance: the company may deserve serious diligence, but the public evidence does not
              yet justify paying through the current mark.
            claimRefs:
