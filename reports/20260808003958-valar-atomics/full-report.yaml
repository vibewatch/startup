      - number: '5.2'
        title: Reactor Architecture and Validation Ladder
        blocks:
          - type: paragraph
            body: >-
              At the architecture level, Valar is clearly in the HTGR family. Public sources align on TRISO fuel,
              graphite moderation, and helium cooling, while Project NOVA adds boron-carbide control elements in
              stainless steel to the disclosed materials stack. That is enough to understand the basic design
              philosophy: a high-temperature gas reactor using coated-particle fuel and a graphite-centric core,
              optimized for high-grade heat rather than only conventional grid electricity. The clearest technical
              evidence comes from NOVA, because it is the point where the company moved from marketing copy into a real
              federal test environment. Valar, WIRED, and New Scientist all converge that the milestone was zero-power
              criticality—important because it validates core geometry and reactivity behavior, but not equivalent to
              proving a hot, integrated reactor.


              Ward Zero fills part of that gap by giving Valar a non-nuclear, full-temperature surrogate. Together, Ward
              Zero and NOVA support the claim that the company is intentionally separating thermal and neutronic
              validation. What they do not yet prove is integrated power production, sustained operation at design
              temperature, or commercially useful conversion efficiency. Public detail on compressors, heat exchangers,
              turbine systems, and product-specific balances of plant remains absent. That missing middle is why
              Ward250—not NOVA—is still the decisive technical product milestone.
