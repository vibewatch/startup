      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is cautious. Valar has clearly solved one half of the early-stage financing
              equation: it can attract capital and attention. It has not solved the half that public investors or
              late-stage private investors normally need for underwriting: evidence that pricing is real, demand is
              contracted, margins are positive or credibly trending there, and commercialization can happen without
              continual re-funding. Independent adverse sources sharpen that concern. Mother Jones quotes experts who
              question whether small reactors can be economically competitive, and AP quotes a skeptic saying the
              headline-grabbing airlift does not answer whether the project is economic or workable. Those are not
              definitive take-downs, but they do frame the right diligence posture.


              Accordingly, the central financial finding is not “bad economics proven,” but “economics not yet publicly
              demonstrated.” Investors should request the current cash balance; monthly gross and net burn; full
              credit-agreement and collateral terms for the $200M facility and any still-outstanding March 2026 debt;
              capex and opex per Ward-class system; any customer LOIs, PPAs, or hydrogen/fuel offtakes; expected service
              gross margin; and the collections profile for pilot versus commercial deployments. Until those materials
              exist, valuation is anchored more by strategic narrative, political acceleration, and technical ambition
              than by auditable operating performance.
