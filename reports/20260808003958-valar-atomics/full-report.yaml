      - number: '4.3'
        title: Cost Structure and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Valar’s cost structure appears capital intensive even before commercial launch. The company is building
              physical reactors, site infrastructure, shielding, and test systems; it is recruiting across project
              finance, accounting, ERP, payroll, construction quality, fuel-plant operations, and plant operations; and
              it is relying on outside engineering and construction partners for the Utah program. Official Project NOVA
              material also makes clear that the firm is still spending to validate core design, helium-loop
              conditioning, and temperature ramp-up protocols. None of this looks like a lean software burn profile.


              Because Valar does not disclose its own unit economics, the best public proxy is comparable
              advanced-reactor companies that do file. NuScale’s 2026 10-K says it still has not generated material
              revenue and that revenue to date comes from engineering and licensing services; it also burned $459.6M of
              operating cash in 2025 despite holding more than $1.2B of liquidity. Oklo’s 2026 10-K likewise shows large
              liquidity paired with ongoing losses. Bloom Energy, while not a nuclear peer, provides a useful
              behind-the-meter hardware analog: end users often prefer financed power structures, and customer
              concentration can remain high even when revenue exists. These comps do not prove Valar will look the same,
              but they do show why undisclosed margins and capex per unit are a material diligence hole rather than a
              cosmetic omission.
