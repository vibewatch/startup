  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive segmentation: who actually overlaps with Valar'
        blocks:
          - type: paragraph
            body: >-
              Valar should not be compared to the entire nuclear sector as if every design sells the same job. Its
              public pitch combines three things at once: a high-temperature gas reactor using TRISO fuel, an off-grid
              “gigasite” operating model, and product ambitions that extend beyond electricity into hydrogen, industrial
              heat, and synthetic fuels. That means the direct peer set is narrower than the broader advanced-reactor
              universe. X-energy is the clearest disclosed technical analog because it also markets HTGR/TRISO systems
              around high-temperature steam and industrial uses. Oklo overlaps on 24/7 campus-scale behind-the-meter
              power, but its fast-reactor and fuel-recycling story points it toward power-first buyers rather than
              very-high-temperature heat buyers. Kairos overlaps on startup execution in advanced nuclear but presents a
              more conventional demonstration-campus path. TerraPower matters mainly as a well-capitalized adjacent
              threat for hyperscaler and large clean-power procurement, not as a like-for-like microreactor substitute.
              Meanwhile, status-quo alternatives—grid supply, gas generation, and brownfield nuclear restarts or
              uprates—remain powerful because they can deliver larger near-term megawatt blocks than any startup
              advanced reactor has yet proven at commercial scale.
