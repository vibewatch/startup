      - number: '1.2'
        title: Founder, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Founder and CEO Isaiah Taylor is central to Valar’s public identity. Multiple sources depict him as a
              self-taught coder who dropped out of high school, founded Valar after earlier entrepreneurial experiments,
              and ties the company mission to family Manhattan Project heritage through Ward Schaap. The surrounding
              leadership bench is more mixed. Positive diligence signals include Mark Mitchell’s prior leadership at
              Ultra Safe Nuclear Corporation, Muhammad Shahzad’s aerospace operating background, and Max Ukropina’s
              visible role running major testing and deployment milestones. Governance disclosure, however, is thinner
              than the funding narrative: public evidence clearly identifies Doug Philippone joining the board as part
              of the $130 million Series A, but does not provide a full up-to-date board roster, committee structure, or
              control-rights map. Adverse reporting also raises key-person and governance questions by noting the
              operational prominence of non-nuclear longtime associates such as Kip Mock and Elijah Froh, plus
              reputational controversy around Day One Ventures founder Masha Bucher. The practical takeaway is that
              Valar combines some seasoned nuclear and industrial operators with an unusually founder-centric public
              profile and still-limited governance transparency.
