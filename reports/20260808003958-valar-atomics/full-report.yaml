  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Program Stack
        blocks:
          - type: paragraph
            body: >-
              Valar is not presenting a single utility-style reactor sale. Its public materials define a broader
              grid-independent energy platform built around standardized reactors colocated with large loads or process
              users. The first-order jobs to be done are reliable power for data centers, high-grade process heat for
              heavy industry, hydrogen via sulfur-iodine chemistry, and eventually synthetic hydrocarbon fuels via a
              modified Fischer-Tropsch chain. That framing matters because it pushes the company into a product stack,
              not just a core-physics problem: Valar must prove the reactor, the heat-transfer system, the conversion
              layer, the site model, and the operating model together.


              The public maturity ladder is also unusually legible. Ward Zero is the thermal surrogate; Project NOVA is
              the neutronics proof point; Ward250 is the first integrated powered reactor; and gigasites are the scale
              thesis beyond that. This is a sensible engineering progression on paper because it decomposes risk into
              thermal-system checks, zero-power core validation, and only then an integrated plant startup. The
              June/July 2026 milestone matters because Ward 250 moved from a future tense program into a limited
              real-load proof point. But the same sequence also highlights what remains missing today: there is still no
              public heat-balance package, no full commercial product specification, and no disclosed evidence that the
              downstream hydrogen or fuels layers have moved beyond conceptual process claims. The product story is
              coherent, but the customer-ready SKU definition is still thin.
