      - number: '1.4'
        title: Milestones, Programs, and Scale-up Path
        blocks:
          - type: paragraph
            body: >-
              The company’s milestone sequence is unusually compressed for advanced nuclear. Official materials describe
              Ward Zero as the non-nuclear thermal prototype in Los Angeles, followed by Utah construction for Ward 250,
              selection into the DOE’s accelerated pilot framework, and Project NOVA’s zero-power criticality milestone
              at Los Alamos-operated NCERC in Nevada on November 17, 2025. Public reporting then shows a February 2026
              C-17 airlift from California to Hill Air Force Base and onward transport to the Utah San Rafael Energy
              Research Lab, plus community outreach efforts in Emery County. The June-to-July 2026 sequence is what
              changed the refresh case: TechCrunch, Valar’s August 2026 financing post, and SMRIntel all say Ward 250
              then achieved self-sustaining criticality in Utah and subsequently powered an Nvidia DGX Spark / Blackwell
              system, with Valar and Nvidia publicly linking that demo to a planned 30 MW waterless AI facility in Utah.

              Those milestones matter because they turn the story from "cold criticality plus transportability" into
              "limited real-load proof plus a commercial design study." Even so, important ambiguities remain in the
              public record: some sources still describe Ward 250 as a 5-megawatt reactor while others describe a
              100-kWt / 100-kWth unit, suggesting either different power-rating conventions, different stages, or
              incomplete public explanation. The company’s separate Philippines plan and NRC lawsuit further show that
              Valar is pursuing multiple regulatory routes in parallel rather than relying on a single licensing path.
