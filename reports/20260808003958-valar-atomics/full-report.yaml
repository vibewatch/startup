      - number: '8.4'
        title: Entry discipline, thesis-breaks, and final asks
        blocks:
          - type: paragraph
            body: >-
              A disciplined investor can still like the direction of travel here. The market pull behind firm clean
              power is real, the technical team has at least one unusually visible proof point, and comparable programs
              show that large strategic counterparties are willing to support advanced-nuclear pathways over long
              timelines. What is missing is not excitement but underwriting closure. Until Valar produces sustained
              at-power data, contract economics, and full debt and preference disclosure, the current valuation should
              be treated as a ceiling for further diligence, not as a floor to chase.


              That turns diligence into a narrow checklist. The most important asks are signed customer documents, the
              exact capital stack, unit economics for a Ward-class deployment, and operating data once Ward 250 moves
              beyond its early-load proof. The thesis breaks if the 2026 to 2028 schedule stretches without compensating
              evidence, if the financing stack is more punitive than the headline suggests, or if fuel and regulatory
              bottlenecks erase the company’s speed advantage. In other words: Valar may become financeable at or above
              $6B, but public evidence says it has not earned that conclusion yet.
