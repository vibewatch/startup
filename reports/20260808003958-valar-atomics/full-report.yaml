        title: Target Accounts and Buyer Structure
        blocks:
          - type: paragraph
            body: >-
              Valar’s customer story is easy to understand strategically and hard to underwrite commercially. Official
              materials consistently frame the company around grid-independent energy products rather than regulated
              utility sales: data-center power, industrial power, hydrogen, and clean fuels. Business Insider and Axios
              sharpen that message by quoting management on why the grid is not the preferred customer. The operating
              idea is to colocate reactors with very large loads that value resilience, controllability, and
              high-temperature process heat, instead of trying to win ordinary wholesale grid demand.


              That matters because it defines the buyer set. The relevant decision makers are not retail ratepayers or
              broad utility territories; they are data-center developers and operators, industrial site owners, hydrogen
              or fuels operators, and public-sector users that need rapidly deployable power. The local-news and AP
              coverage adds a fifth buyer archetype: military or resilience-oriented users who care about
              transportability and energy security. The public record therefore supports a focused, high-value account
              strategy. What it does not yet support is proof that any of those target accounts have converted into
              disclosed long-duration PPAs, production deployments, or recurring expansion contracts.
