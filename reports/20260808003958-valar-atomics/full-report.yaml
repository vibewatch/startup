  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what spend actually counts
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “all nuclear” and not even “all AI power.” Valar’s own materials repeatedly
              narrow the opportunity to grid-independent or grid-constrained applications where dense, always-on energy
              or heat matters more than the lowest possible delivered megawatt-hour. The company explicitly names
              data-center power, hydrogen, heavy industrial power, and clean hydrocarbon fuels, while its technology
              page emphasizes high-grade process heat and its mission page emphasizes gigasites that productize nuclear
              by clustering many reactors on one campus. That definition pulls the market toward behind-the-meter or
              campus-adjacent generation, industrial steam and heat, and projects where site economics improve when
              deployment and operations are standardized across many units.


              That boundary also excludes a large amount of spend that looks superficially adjacent. Generic bulk-grid
              generation, intermittent renewables purchased without a firming requirement, and conventional
              central-station nuclear projects solve different buyer jobs than “secure power or heat quickly at a
              constrained site.” The more decision-useful substitutes are direct-energy solutions that address the same
              operational bottleneck: utility-delivered clean-firm blocks, local advanced reactors, onsite combustion or
              fuel-cell systems, and high-temperature industrial energy packages. The point is not that Valar already
              owns those markets; it is that the company is selling into a subset of energy demand where time-to-power,
              uptime, heat quality, and site cost amortization matter enough to justify a nontraditional nuclear
              procurement path.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
