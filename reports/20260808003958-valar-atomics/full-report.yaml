      - number: '1.3'
        title: Capitalization, Investor Base, and Strategic Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Valar’s capital formation has accelerated from unusual to extreme. TechCrunch reported a $19 million seed
              round when the company emerged from stealth in February 2025, and Los Angeles Times later reported a $130
              million Series A led by Snowpoint Ventures with Day One and Dream as co-leads. In March 2026, Bloomberg
              reported another $450 million financing at a $2 billion valuation. By August 2026, TechCrunch and Yahoo
              Finance / Bloomberg were reporting a new step-function: $1 billion of Series B equity, a separate $200
              million credit facility, and a $6 billion post-money valuation, while Valar’s own announcement said
              Sequoia led the round and that Shaun Maguire joined the board.

              That matters because the investor base is becoming more institutional and more governance-relevant at the
              same time. The syndicate still blends climate and defense-tech backers such as Palmer Luckey, Shyam
              Sankar, and Doug Philippone, but Sequoia’s board seat and the credit-facility lenders make the capital
              stack look less like a pure venture story and more like an early infrastructure platform. The tradeoff is
              that public disclosure still lags the headline scale: there is no published cap table, no preference-stack
              summary, and no public covenant package for the 2026 credit commitments.
