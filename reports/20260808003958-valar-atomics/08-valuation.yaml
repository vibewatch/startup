- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / date
  - Transmission to thesis
  - Action implication
  rows:
  - - No sustained at-power Ward 250 evidence
    - Material slip versus 2026-2028 public timeline
    - Turns current option value into a slower and riskier science project.
    - Re-cut valuation toward bear case or stop work.
  - - Debt or preference stack proves punitive
    - Any term that meaningfully subordinates new common investors to senior claims
    - Reduces upside capture even if technology progresses.
    - Require waterfall model before any investment decision.
  - - Fuel-supply or regulatory setback
    - HALEU, DOE authorization, or NRC path becomes slower than implied today
    - Erases Valar’s speed premium relative to peers.
    - Move from research-more to avoid until timing risk resets.
  - - No disclosed customer economics
    - Still no signed pricing, volume, or tenor evidence after technical milestones
    - Leaves valuation dependent on narrative rather than contract conversion.
    - Do not pay through the mark.
  notes: These are thesis-break conditions, not generic startup risks. Each one directly changes what a rational investor should pay.
