  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: The signed debt and credit agreements for Valar's disclosed 2026 debt instruments, including coupon or fee structure, maturity, security package, covenants, and any draw or milestone triggers.
    whyItMatters: Debt can materially change downside and dilution math even when the headline valuation looks strong.
    diligencePath: Request the executed debt term sheet and model covenant headroom against the 2026-2028 build schedule.
    relatedQuestionRefs:
    - QV008
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: The liquidation preference, participation, anti-dilution, and governance rights attached to the 2026 financing.
    whyItMatters: A late-stage private mark can overstate common-equity upside if senior securities absorb exit value first.
    diligencePath: Review the latest cap table, stock purchase agreement, and waterfall analysis before any price-sensitive recommendation.
    relatedQuestionRefs:
    - QV009
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: contract-economics
    missingEvidence: Signed PPAs, LOIs, pilot contracts, or offtake agreements showing volume, pricing, tenor, and credit quality.
    whyItMatters: Without customer economics, the $2B mark cannot be tied to conversion, margin, or financing durability.
    diligencePath: Request the Philippines contract, any U.S. pilot or campus power documents, and a customer pipeline roll-forward.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Bottoms-up capex, opex, uptime, fuel, maintenance, and gross-margin assumptions for a Ward-class deployment.
    whyItMatters: Scenario valuation is highly sensitive to whether the first real units are economic at all, not merely technically possible.
    diligencePath: Obtain project-finance model outputs, vendor quotes, and sensitivity cases used internally for site underwriting.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV003
    - TV004
    - TV006
  - type: missing-source
    severity: material
    topic: runtime-data
    missingEvidence: Sustained at-power runtime data, thermal performance, and controlled start-stop evidence for Ward 250.
    whyItMatters: Cold criticality is valuable, but not enough to validate commercial reliability or customer bankability.
    diligencePath: Revisit the valuation once Ward 250 has delivered disclosed runtime and performance data at operating temperature.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV004
