- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Debt tranche
    - Executed debt and credit documents for Valar's disclosed 2026 debt instruments.
    - Headline round size is not enough without covenant and maturity detail.
    - Company finance team; legal review of debt package.
  - - Preference stack
    - 2026 stock purchase agreement and waterfall.
    - Private marks can overstate common-equity value.
    - Company counsel; build downside waterfall.
  - - Customer contracts
    - Signed PPAs, pilot contracts, or offtake agreements with pricing and tenor.
    - Needed to convert AI-power narrative into underwritten demand.
    - Commercial lead; verify buyer credit and volume.
  - - Unit economics
    - Capex, opex, uptime, fuel, and margin model for Ward-class deployment.
    - Scenario value changes mainly with project economics, not story quality.
    - Project finance and engineering model review.
  - - Runtime data
    - At-power operating data once Ward 250 progresses beyond cold criticality.
    - Bankability depends on controlled operation, not just physics proof.
    - Technical diligence after public milestone update.
  notes: 'These asks are sequenced to answer price before vision: first downside protections, then contract economics, then proof of durable operation.'
