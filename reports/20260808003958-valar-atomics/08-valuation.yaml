- id: why-the-mark-is-milestone-loaded
  title: Why the $6B mark is milestone-loaded rather than revenue-backed
  body: |-
    Valar has achieved more technical and political motion than most startups founded in 2023. Project NOVA reached cold criticality under DOE and Los Alamos oversight, Ward 250 then moved into real Utah power operations, and public August 2026 sources say it powered an Nvidia DGX Spark / Blackwell system before Valar and Nvidia announced a 30 MW waterless AI-factory collaboration. Those are real data points, not vaporware. They also explain why investors may be willing to pay a premium before commercial metrics are visible.

    But milestone-loaded valuation is not the same thing as durable economic proof. New Scientist, Associated Press, SMRIntel, and Mother Jones each capture a different version of the same caution: cold criticality is not the same thing as commercial operation, a limited Nvidia workstation demo is not a bankable data-center deployment, and expert skepticism on small-reactor competitiveness remains alive. The March debt and August credit facility matter here because once a company starts layering senior capital into a pre-revenue nuclear buildout, timeline slips or cost surprises can hurt equity value faster than headline fundraising totals suggest. Public evidence therefore supports an option-value framing: Valar has bought itself more shots on goal, but not yet the right to be underwritten as if those goals are already scored.
  claimRefs:
