- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Valuation / status signal
  - Why it matters for Valar
  - Relevance
  - Main limitation
  rows:
  - - Valar Atomics
    - Private reported $6B post-money mark after $1B Series B plus a $200M credit facility.
    - Anchor for current entry price being tested here.
    - Closest direct price signal.
    - Private mark with limited financial disclosure and undisclosed preference/covenant terms.
  - - Oklo
    - ~$7B non-affiliate market value in 2025; late-2027 to early-2028 target for Aurora-INL.
    - Shows public markets can pay for advanced-nuclear option value before scale.
    - Best U.S. public advanced-reactor benchmark.
    - Different reactor type and fuel-cycle thesis.
  - - NuScale
    - ~$5.3B non-affiliate market value in 2025 plus very heavy disclosed operating cash burn.
    - Shows how much capital pre-commercial reactor development can absorb.
    - Public filing-based capital-intensity proxy.
    - Utility-oriented SMR path, not Valar-style gigasite path.
  - - Bloom Energy
    - ~$3.9B non-affiliate market value in 2025 with real operating business.
    - Highlights that a revenue-bearing energy-hardware company can still trade near or below Valar’s private mark.
    - Useful non-nuclear energy hardware analogue.
    - Not a reactor developer and not a direct licensing comparison.
  - - X-energy
    - ~$500M Series C-1 financing and >5 GW Amazon-linked deployment ambition.
    - Confirms strong strategic capital still backs HTGR peers.
    - Closest disclosed HTGR / TRISO financing analogue.
    - Funding amount is not the same thing as disclosed enterprise value.
  - - Kairos Power
    - Google agreement for up to 500 MW, first reactor intended by 2030.
    - Shows buyers support milestone-based capacity agreements.
    - Corporate offtake reference for nuclear commercialization.
    - Offtake structure is not a valuation mark.
  - - TerraPower Natrium
    - 345 MWe base, 500 MWe peak with storage, NRC permit in 2026 and DOE support.
    - Shows more mature programs still need subsidy and long regulatory arcs.
    - Useful maturity and scale reference.
    - Much larger plant class than Valar’s current public design.
  notes: This table mixes private marks, public-market signals, financing rounds, and milestone-backed customer commitments because no single normalized valuation metric fits pre-revenue advanced nuclear cleanly.
