- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would improve the view
  - What would worsen the view
  rows:
  - - Market demand
    - AI and industrial customers clearly want more 24/7 clean power.
    - Demand alone does not guarantee Valar wins contracts or economics.
    - Signed PPAs or offtakes with creditworthy buyers.
    - Demand remains narrative-only with no disclosed conversion.
  - - Technical progress
    - Project NOVA and Ward 250 milestones are ahead of what many startups show publicly.
    - Cold criticality is not full-power, long-duration performance.
    - Published runtime and thermal-performance data.
    - Schedule reset or inability to operate at power reliably.
  - - Capital access
    - Valar has raised unusually large rounds for a 2023-founded nuclear startup.
    - The March debt and August credit facility mean future downside can reach equity faster than the headline valuation suggests.
    - Clean debt documents and non-punitive preference terms.
    - Restrictive covenants or senior claims on exit value.
  - - Comparables
    - Oklo, NuScale, Kairos, X-energy, and TerraPower prove investor appetite for nuclear option value.
    - Peers also show that long timelines and huge burn can persist before commercial proof.
    - Evidence that Valar can reach proof faster or cheaper than peers.
    - Peer progress outpaces Valar while Valar remains opaque.
  - - Valuation
    - The $6B mark could become reasonable if Valar converts proof into contracts quickly and keeps licensing momentum.
    - Without revenue or contract economics, the mark already assumes success that is not yet public.
    - At-power runtime plus bankable contract economics.
    - Further price appreciation without disclosure improvement.
  notes: Rows separate the argument for owning the story from the argument for paying the current price today.
