- id: comparable-anchors-and-scenario-ranges
  title: Comparable anchors and scenario ranges
  body: |-
    The right comparable set does not prove a clean fair value for Valar, but it does constrain what kind of story a $6B mark is telling. Public advanced-nuclear peers such as Oklo and NuScale show that investors can assign multi-billion-dollar option value to reactor companies before scaled revenue, yet those same filings also show how much capital such paths can consume. Oklo’s public scale signal was about $7B in mid-2025 and NuScale’s about $5.3B, but NuScale also disclosed nearly $460M of 2025 operating cash burn. Bloom Energy is not a nuclear peer, yet its roughly $3.9B market-value signal is a reminder that a company with real revenue can still trade near or below Valar’s private mark.

    Private and strategic comparables point the same way. Google’s Kairos agreement and Amazon’s X-energy-backed deployment model show that sophisticated buyers are funding staged capacity and order-book formation, not treating pre-revenue narratives as substitutes for customer economics. That supports a scenario method instead of a multiple. Bear, base, and bull values should move mainly with runtime proof, signed offtakes, and capital-stack clarity. On that basis, today’s $6B mark already assumes a large amount of technical and commercial success that has not yet been made public in financial form.
