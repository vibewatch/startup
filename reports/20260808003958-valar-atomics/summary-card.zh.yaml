  topStrengths:
    - DOE 和 Utah 相关里程碑是真实的，包括一次受限的 Nvidia 驱动演示，让 Valar 领先许多只讲叙事的先进核能初创。
    - 产品假设紧贴 AI 时代对高密度、全天候、无碳电力和工业热的需求。
    - $1 billion Series B 加 $200 million credit facility，让这家 2023 年成立的公司获得少见资本入口和制造可选性。
  topRisks:
    - 商业化 NRC 转换、HALEU 燃料供应和废物 / 处置路径仍未解决，足以打断时间表。
    - 收入、定价、签署的 offtake、利润率和信贷 covenant 细节均未公开，$6 billion 估值大多由叙事支撑。
    - 创始人中心化治理和声誉争议，可能把技术或政策失误放大成融资压力，即便新一轮由 Sequoia 领投。
  unresolvedGaps:
    - August 2026 融资的具体信贷 covenant、股权优先权栈和投资人所有权。
    - 初始部署和计划中 30 MW AI facility 的已签客户文件、定价条款和项目级单位经济性。
    - 持续满功率运行数据、项目特定燃料分配，以及可持续废物处理路径。
