  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Tailscale is a Toronto-incorporated, fully remote secure networking company founded in 2019 that sells identity-first mesh connectivity built on WireGuard. Public evidence supports a $160 million Series C in April 2025 at a roughly $1.45 billion post-money valuation, more than 10,000 business customers by January 2025, strong AI-company adoption, and expanding product scope into PAM and AI governance, while headcount, exact headquarters framing, and private-company financial disclosure remain imperfectly public."
  },
  "sections": [
    {
      "id": "identity-product-and-footprint",
      "title": "Identity, product architecture, and footprint",
      "body": "Tailscale’s core company story is unusually coherent for a private infrastructure vendor: it exists to make networking disappear for users who need secure connectivity but do not want the operational weight of traditional VPNs and network overlays. The company’s own pages consistently frame the product as identity-first secure connectivity built on WireGuard, with an end-to-end encrypted mesh data plane, a lightweight coordination control plane, and outsourced identity to SSO or directory providers rather than a separate credential system. Official pages also show that the product family has widened beyond the original business VPN motion into PAM, CI/CD connectivity, AI governance, workload connectivity, edge and IoT use cases, and developer-centric remote access. Corporate-footprint evidence is slightly less clean than product evidence: a Canadian corporate record shows a Toronto registered office, Osler describes the company as Toronto-based, and the company itself says it has always been fully remote. The clean diligence read is that Tailscale is Toronto-anchored legally and reputationally, but operationally distributed by design. The company also keeps a notable open-source and privacy posture in its narrative: the node software is public on GitHub, the privacy policy reiterates that encrypted mesh connections are the core service, and customer stories show the product being used across clouds, laptops, servers, and developer tooling rather than only for headquarters-style remote access.",
