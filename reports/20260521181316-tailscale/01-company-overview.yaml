    {
      "id": "leadership-governance-and-capital-base",
      "title": "Leadership, governance, and capital base",
      "body": "Leadership and ownership signals are strong enough for orientation but not complete enough for full governance underwriting. The about page puts Avery Pennarun in the CEO seat and David Carney alongside him as chief strategy officer, while the same page lists Amit Kumar from Accel under the board and then surfaces investor partners from Uncork, Insight, CRV, and Heavybit as prominent strategic backers. External coverage fills in founder history: Pennarun, David Crawshaw, David Carney, and Brad Fitzpatrick are repeatedly identified as the founding cohort, with Pennarun remaining the visible public operator in 2025 and 2026 financing, launch, and acquisition coverage. Capital formation is much better disclosed than executive structure. Tailscale’s own Series B and Series C posts, together with Business Wire, BetaKit, BankInfoSecurity, Accel, and Osler, support a progression from a $100 million Series B in 2022 to a $160 million Series C in April 2025, taking total capital raised to roughly $275 million and post-money valuation to about $1.45 billion. The main residual gap is not round history but the private cap table: exact ownership, voting rights, liquidation preferences, and current board committees are not public.",
