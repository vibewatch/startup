  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 定价模型、收入形态与牵引信号
        blocks:
          - type: paragraph
            body: >-
              Tailscale 的公开变现表面比财务报表清楚。定价页显示经常性 SaaS 结构：免费个人层、付费 Standard 和 Premium
              席位许可证，以及定制企业层；同时，它通过带标签资源和临时资源分钟数增加第二条变现轴。这点重要，因为收入不只是纯用户席位故事；工作负载、 CI/CD
              runner、出口节点和其他非人类资源也能拉动付费使用。公司自己关于突破 5,000 付费客户的回顾，描述了明确的自下而上自助服务动作， 后来扩展到企业部署，其中一个客户从 100 席扩到 1,000 席，再到
              10,000 多席。公开牵引披露强化了这个模式： BetaKit 报道称，到 2025 年 1 月，Tailscale 拥有 10,000 家付费企业客户，此后客户数又增加 20%； Tailscale
              的业务团队文章则称，整体上超过 30,000 家公司使用产品。由此读出的需求和扩张机制是有利的，但已实现经济性仍受限制。 企业定价定制、折扣未披露，官方来源不发布 ARR 或 GAAP
              收入，因此标价表面最好被视为变现架构，而不是收入质量证明。
