  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争挤压与边界风险
        blocks:
          - type: paragraph
            body: >-
              Tailscale 最强的产品优点，也是它的核心战略风险：客户只想买安全连接时，它最容易成交；但同样的聚焦让它在市场两端都暴露。
              公开定价页用免费、标准、高级和企业版把初始购买动作压得很简单，但产品页也显示，公司已经伸向标签资源、临时资源、 邻近 PAM 的功能和 AI 治理。更宽的产品面能抬高单账户平均收入，却也把 Tailscale
              推进 Cloudflare、Zscaler、 Palo Alto Networks 和 Cisco 的预算通道；这些厂商靠把私有访问与 DLP、SWG、CASB、浏览器隔离、AI 控制和更宽的策略控制台捆在一起，
              卖出更大的预算。往下看，NetBird、ZeroTier 和 Teleport 仍在证明，买方可以用产品打磨度换自托管、开源杠杆或更窄的特权访问专精。 净结果不是 Tailscale
              没有差异化，而是这种差异化更多来自体验和架构，不是完全结构性的壁垒。如果套件厂商变得更简单，或开放 / 自托管工具变得更易用， Tailscale
              可能被压缩成一个功能、一个补充项，或采购上的折中，而不是整个平台采购。
            claimRefs:
              - CR015
              - CR016
              - CR017
