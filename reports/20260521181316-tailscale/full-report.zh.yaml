  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 含义
      - 尽调追问
    rows:
      - - 混合办公和第三方访问
        - 正向
        - 当前
        - 即使纯远程办公叙事成熟，面向具体应用的访问需求仍会持续
        - 衡量新增 ARR 中还有多少始于员工访问，而不是工作负载访问
      - - 多云和分布式基础设施复杂性
        - 正向
        - 当前
        - 利好能避免流量回传并简化跨环境连接的产品
        - 追问 Tailscale 的具体赢点是否来自云、集群和承包商分散在多个环境。
      - - AI 基础设施和智能体治理
        - 正向
        - 当前
        - 围绕机器人、CI、GPU 和模型访问的身份能力，打开新的增长切口
        - 验证管线中有多少由 AI 基础设施驱动，而不是一般平台工程
      - - 合规和数据驻留压力
        - 正向
        - 当前
        - 把身份、日志和最小权限推成预算优先项
        - 梳理哪些受监管行业转化最快、哪些证明点最有力
      - - 既有 VPN、防火墙和身份投入
        - 负向
        - 当前
        - 提高切换成本，使分阶段推出比硬替换更可能
        - 量化大单中的替换周期和共存要求
      - - 延迟、出站流量费和稀缺 SASE 人才
        - 负向
        - 当前
        - 可能拖慢部署，或把买方推向打包托管服务
        - 追问哪些工作负载无法通过性能测试，或需要专业服务
      - - 现有套件捆绑
        - 负向
        - 当前
        - 大平台厂商可能用「够用」的访问功能吃掉预算
        - 重点复盘与 Microsoft、Cisco、Cloudflare、Zscaler 和 Palo Alto 的胜负数据
      - - 供应商锁定和标准不明
        - 负向
        - 中期
        - 让买方警惕：别用一组依赖替换成另一组依赖
        - 要求证明 Tailscale 足够互通，不会变成另一个难退出的技术栈
    notes: 市场有吸引力，因为多项驱动因素属于结构性变化；但约束并非表面噪音。定价权取决于能否证明自身相对现有厂商捆绑替代方案和低成本现状替代品具备运营差异化。
