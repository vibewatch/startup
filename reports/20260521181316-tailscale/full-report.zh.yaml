      - number: '5.3'
        title: 模块范围与超越原始企业 VPN 切口的平台扩张
        blocks:
          - type: paragraph
            body: >-
              模块地图显示，公司正稳步从安全连接上行到相邻控制面。Tailscale SSH 是最清晰的例子：管理员不必手动分发和撤销 SSH key，可以依赖 tailnet 身份、check-mode
              重新认证和录制策略；Tailscale 会拦截来自 tailnet 的 22 端口 SSH。Kubernetes Operator 进一步拓宽平台，把 Tailscale 身份转成私有 Kubernetes
              API 访问、 内部应用发布，以及面向子网路由器、出口节点、app connector 和 SSH recorder node 的集群内连接器资源。
              子网路由器和出口节点处理纯网状网络无法覆盖的经典桥接场景：把访问延伸到未托管网络，并在工作流仍需要 full-tunnel 行为时，强制所有流量走选定出口点。Serve 和 Funnel
              随后暴露应用共享层：Serve 保持 tailnet 内私有，Funnel 则使用公有中继基础设施面向互联网暴露。设备姿态、流日志、配置审计日志 和 Tailnet Lock
              补上企业围绕谁能连接、变更如何追踪所期待的控制。2026 年扩展路径更宽。Aperture 试图让 Tailscale 成为 AI 使用的身份和控制网关；Border0
              则给公司一条进入更具协议感知能力的特权访问管理路径。机会很明显： 在更多安全任务上复用同一身份和连接基础。风险也很明显：Tailscale 越从连接延展到 AI 治理或 PAM，买方越会拿它同更深的在位套件比较，
              而不只是同传统 VPN 比较。
