      - number: '7.2'
        title: 架构、安全与运营依赖风险
        blocks:
          - type: paragraph
            body: >-
              这套架构仍然是在拿掉一类风险的同时引入另一类风险。Tailscale 的安全页面罕见地明确说明，它无法检查客户流量，既有点对点连接也能在协调平面宕机时继续存活；
              这有利于隐私、成本结构，也提升了抵御集中式数据平面瓶颈的韧性。但同一批资料也说得很清楚：入门配置、密钥交换、策略分发、管理员变更和部分恢复路径， 仍然依赖协调服务正确运行。DERP 只是兜底，但 DERP
              文档说，重度依赖中继通常意味着性能更差；运行自定义 DERP 是一项高级、持续的运营负担， 不是轻松的逃生通道。已披露的安全记录同样重要。2026 年公告覆盖了一个 Web 界面 ACL 绕过和一个 macOS
              AlwaysOn helper 漏洞； 更早的公告以及 NVD/CVE 记录显示，SSH 和 Tailnet Lock 的边缘案例曾跨不同平台和部署模式出现。独立宕机追踪又补了一层提醒：
              公开事故历史包含多次协调、管理控制台、证书、日志、计费和 Funnel 降级。单看这些都不会推翻产品逻辑，但它们说明 Tailscale 仍是一家真实的软件和运营公司， 不是魔法。
