  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 作用
      - 平面
      - 关键依赖
      - 主要风险 / 权衡
    rows:
      - - 身份提供商
        - 验证用户，并把 MFA / 上下文带入 tailnet 登录
        - 控制
        - 外部 IdP 可用性和策略治理
        - Tailscale 继承 IdP 的强度，也继承其宕机风险
      - - 协调服务
        - 分发公钥、peer 信息、DERP 地图和由策略生成的发现数据
        - 控制
        - Tailscale 托管后端
        - 没有它，既有会话仍可持续；但管理变更和新发现都依赖它
      - - tailnet 策略文件
        - 定义 ACL、grants、态势、SSH 规则、标签、测试和路由审批
        - 控制
        - 管理员配置正确性和评审流程
        - grants 范围设错或策略测试过期，会扩大爆炸半径
      - - WireGuard 对等节点
        - 加密并承载设备到设备流量
        - 数据
        - 客户端健康、密钥管理、端点可达性
        - 安全被推到端点后，特定平台客户端 bug 仍然重要
      - - NAT 穿透后的直连 UDP 路径
        - 大多数流量的首选路径
        - 数据
        - 公共互联网状况和本地防火墙行为
        - 未披露公开口径下的直连成功率
      - - 对等节点中继
        - 在回退到 DERP 前，使用 tailnet 设备中继流量
        - 数据
        - 客户配置的可中继节点
        - 需要有意规划配置和容量
      - - DERP 中继网络
        - 协商路径；直连失败时中继加密流量
        - 数据回退
        - Tailscale 托管的全球中继覆盖
        - Hard-NAT 流量依赖中继健康度和距离
      - - 扩展服务
        - SSH、Kubernetes、Serve/Funnel、日志、Aperture 和 PAM 扩展复用同一身份基础
        - 混合
        - 各功能专属服务和产品成熟度
        - 覆盖面变宽，版本、权益和集成复杂度也增加
    notes: 该架构区分了 Tailscale 通常放在控制平面的内容，以及实际在数据平面承载客户流量的内容。
