      - number: '8.3'
        title: 基准情景接近上一轮，但前提是私下尽调补上缺失的质量指标
        blocks:
          - type: paragraph
            body: >-
              由此得出的投资观点，既不是看空否定，也不是放绿灯加价买入。最强投资逻辑是，Tailscale 已经证明了一件少见的事：在一个痛点明确的品类里实现了真实产品市场契合， 看得见 AI
              和企业拉力，并且管理层称这套商业模式不靠紧急融资也能走向盈利。反向逻辑是，这些证明来自选择性叙事披露，而不是可审计的运营数据。 因此，保守基准情景只有在管理层能私下证明
              ARR、毛利率、留存和账户质量强于公开证据时，才会落在上一轮附近。乐观情景要求的不只是持续客户增长，
              还要范围拓宽、大客户内部持久扩张，并有足够经济质量去拿到高于上市网络安全平均倍数的溢价。悲观情景更简单：如果增长质量比故事更薄， 或者 AI 热情和私募市场稀缺性在 2025
              年定价中出力最多，这轮估值很快会显得过度拉伸。基于这些公开证据，合适的建议是继续研究，置信度中等， 风险评级高，估值立场偏高。
