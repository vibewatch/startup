chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品架构与公司足迹
        blocks:
          - type: paragraph
            body: >-
              Tailscale 作为私营基础设施厂商，公司叙事少见地清晰：它要让安全连接变得像不存在一样，服务的是需要安全连接、却不想背上传统 VPN 和网络覆盖层运维负担的用户。公司自有页面始终把产品定义为基于
              WireGuard 的身份优先安全连接：端到端加密的网状数据平面、 轻量协调控制平面，以及外包给 SSO 或目录提供商的身份能力，而不是另建一套凭证系统。官方页面还显示，产品家族已从最初的企业 VPN 切入点扩到
              PAM、CI/CD 连接、AI 治理、工作负载连接、边缘和 IoT 场景，以及面向开发者的远程访问。公司足迹证据略不如产品证据干净： 加拿大公司记录显示注册办公室在 Toronto，Osler 称公司总部在
              Toronto，Tailscale 自己则称始终全远程。尽调上更清晰的读法是： Tailscale 在法律和声誉上锚定 Toronto，运营上则按设计分布式。公司叙事里还保留明显的开源和隐私姿态：节点软件公开在
              GitHub，隐私政策反复强调加密网状连接是核心服务，客户故事显示产品用于云、笔记本、服务器和开发者工具，而不只是总部式远程访问。
