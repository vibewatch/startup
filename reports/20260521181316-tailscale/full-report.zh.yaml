  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 立足点
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Tailscale
        - 直接网状网络 / 身份优先的安全连接
        - 私有成长阶段厂商；2026 年扩展到 PAM 和 AI 治理
        - 开发者、IT、安全、平台团队，以及多云和 AI 密集环境
        - 点对点网状网络、快速推出、简单用户体验、资源感知定价
        - 在内联检查和合规重控制方面，覆盖面不如完整 SSE/SASE 套件
      - - Cloudflare One / Access
        - 现有统一 SASE / ZTNA 套件
        - 大型上市连接和安全平台
        - 希望在一个控制平面上标准化的安全和网络团队
        - 全球网络、无限连接器、设备姿态、SWG/CASB/DLP/FWaaS/RBI 覆盖面
        - 套件销售动作更重，少了 Tailscale 那种「连上就行」的简单性
      - - Zscaler Private Access
        - 现有零信任私有应用平台
        - 大型上市安全平台
        - 优先保护和检查私有应用的企业
        - Layer-7 代理架构、内联检查、DLP、浏览器隔离
        - 公开定价更难与 Tailscale 归一比较，架构也更偏代理中心
      - - Prisma Access / Prisma SASE
        - 现有网络安全套件
        - 大型上市安全平台，有已部署 NGFW 基础
        - 已在购买 Palo Alto 安全和网络控制的大企业
        - ZTNA 加 SWG、CASB、云原生网络安全，以及来自既有 NGFW 的连接器杠杆
        - 运营覆盖更宽，可能比聚焦连接的推出更重
      - - Cisco Secure Access / Duo
        - 现有身份加网络访问捆绑
        - 大型上市网络厂商，加上强 IAM/MFA 渠道
        - 已标准化 Cisco 身份、网络或安全合同的企业
        - 客户端和无客户端访问、VPNaaS 扩展、MFA/SSO、大渠道触达
        - 产品故事更宽，但不如 Tailscale 贴近开发者网络原生
      - - ZeroTier
        - 相邻叠加网络替代方案
        - 独立叠加网络厂商，公开以设备为中心的套餐矩阵
        - 希望获得叠加网络、但不买完整安全套件的团队
        - 简单虚拟 LAN 模型，以及覆盖多档设备数的公开套餐矩阵
        - 身份、治理和企业工作流深度弱于访问优先的安全平台
      - - NetBird
        - 直接开源和自托管替代方案
        - 开源厂商，提供托管和自托管产品
        - 想替换 VPN，同时希望对托管方式或 IdP 选择有更多控制权的团队
        - 基于 WireGuard 的叠加网络、SSO/MFA、SCIM、审计日志、自托管
        - 相比 Tailscale SaaS，仍要求买方承担更多部署细节
      - - Nebula
        - 开源现状 / 内部自建替代
        - 开源项目，仓库之外有托管选项
        - 熟悉 PKI 和 lighthouse 节点运维的专家型基础设施团队
        - 点对点设计、防火墙式规则、打洞、性能导向
        - 运维负担高，开箱即用的身份 / 管理体验更弱
      - - Teleport
        - 相邻特权访问和工作负载访问工具
        - 商业平台，提供社区版和自托管部署
        - 优先审计服务器、Kubernetes、数据库和工作负载访问的基础设施安全团队
        - 短期证书、审计轨迹、会话录制、自托管和云模式
        - 对通用网状网络连接的适配更窄，预算负责人通常也不同
      - - 传统 VPN / 内部自建
        - 现状和替代品
        - 已部署的安装基础或内部人力
        - 只想解决狭窄访问问题、不购买新平台软件的组织
        - 可见增量支出低，流程熟悉
        - 瓶颈、身份姿态更弱、手工运维更多、开发者体验更差
    notes: 画像行总结有证据支撑的竞争立足点，而不是归一化市场份额排名；「规模 / 立足点」有意混合上市公司体量、开源姿态和风险投资阶段成熟度，因为不是每一行的确切融资都公开。
