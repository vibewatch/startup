companyProfile:
  summary: >-
    Tailscale 是一家在 Toronto 注册、全远程运营的安全网络公司，由 Avery Pennarun、David Carney、David Crawshaw 和 Brad Fitzpatrick 于 2019
    年创立。公司靠基于 WireGuard、身份优先的网状连接打出口碑：部署比传统 VPN 更轻，也更贴合多云、开发者和远程团队工作流。以公司年限看，公开牵引信号很强：截至 2025 年 1 月，企业客户超过 10,000
    家；已出现具名 AI 和企业用户；2025 年 4 月完成 $160 million Series C 轮，估值约 $1.45 billion。产品范围正扩到特权访问管理（PAM）和 AI 治理工作流，但
    ARR、利润率、留存和当前股权结构细节仍受私营公司不透明限制， 投资判断空间有限。
