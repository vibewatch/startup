      - number: '8.4'
        title: 入场纪律取决于私下尽调揭示的集中度、留存和股权结构
        blocks:
          - type: paragraph
            body: >-
              最终判断关乎纪律，而不是欣赏。Tailscale 看起来是一家强公司；问题是新投资人在 2025 年 4 月价格或更高价格上，还能不能获得回报。 答案取决于一小组公开证据回答不了的私下事实。第一，投资人需要
              ARR 桥接，以及毛利率、烧钱速度和现金效率的清晰视图，才能判断估值是偏高但合理， 还是单纯偏高。第二，需要留存和集中度数据，尤其公开报道强调 AI
              需求和更大企业采用，却没有量化业务对二者的依赖。第三，需要股权结构表机制， 判断未来融资轮或退出是否真的能从这个入场点交付风险投资回报。这些尽调问题不是内务清单。它们决定该把这轮融资称为大致公允，还是过于激进。
              在这些缺口关闭前，正确姿态是密切跟踪公司，避免英雄假设，并把下行触发器视为高度可行动，而不是理论风险。
