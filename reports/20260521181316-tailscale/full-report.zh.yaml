        - CFO / 财务
        - 重建可比公司和情景区间。
      - - 毛利率和烧钱
        - GAAP 或管理口径毛利率、烧钱倍数和现金跑道表。
        - 区分高效软件增长和高成本增长。
        - CFO / 财务
        - 验证基准情景倍数和下行地板。
      - - 留存质量
        - 按细分给出的 NRR、GRR、logo 流失和队列扩张。
        - 判断客户质量能否支撑溢价估值。
        - 收入运营
        - 确认或否定乐观情景的扩张逻辑。
      - - 客户集中度
        - 按 ARR 拆分的前 10 大客户、AI 客户和企业客户组合。
        - 测试 AI 和企业叙事是分散支撑还是脆弱依赖。
        - 财务 / 销售领导层
        - 调整下行概率和折价。
      - - 股权结构表和条款
        - 优先股堆叠、清算权、期权池和老股交易历史。
        - 进入回报取决于实际分配机制，不只取决于名义估值。
        - 财务 / 法务
        - 测算真实稀释和退出所得。
      - - 上市公司准备度
        - 审计状态、董事会搭建和 IPO 准备里程碑。
        - 只有治理和报告能力撑得住，IPO 路径主张才有意义。
        - CEO / 法务 / 董事会
        - 评估退出选择权和时点现实性。
    notes: 这些是最低限度的尽调问题；只有拿到这些，本章才能从公开证据判断转为可投资的承销备忘录。
    claimRefs:
      - CV007
      - CV013
      - CV043
      - CV055
      - CV056
      - CV061
      - CV062
