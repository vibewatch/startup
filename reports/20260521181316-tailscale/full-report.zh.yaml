      - number: '7.4'
        title: 治理、法律与融资风险
        blocks:
          - type: paragraph
            body: >-
              剩下的风险簇，重点不在 Tailscale 能不能卖软件，而在新投资人到底能从公开证据中承保多少。2025 年 Series C 明显重设了预期： 公司融资 $160M，独立报道给出的投后估值接近 $1.45B
              USD；这意味着后续投资人买的是高增长溢价叙事，不是隐藏便宜货。但公司仍不披露当前 ARR、 利润率、留存和客户集中度，甚至公开员工数在可信报道之间也不一致。官方 About
              页面继续强调全远程、小团队运营模式，并在技术身份和外部叙事中高度围绕 Avery
              Pennarun。这可以是优势，但随着公司增加企业销售、全球覆盖和更宽的产品地图，也会抬高关键人物和执行梯队风险。法律上，Tailscale 的条款、隐私政策、 DPA 和 DORA
              附录显示了相当成熟的合同栈，但也把大量合规适配推给客户，依赖跨境处理和分包处理方，并把特殊审计、退出和事故响应机制留给受监管买方。
              在保留的直接来源中，没有强公开诉讼或执法记录；更合适的处理方式是把它视为一个开放尽调项，而不是无风险证明。
