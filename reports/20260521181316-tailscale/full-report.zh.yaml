      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Tailscale 的市场更像现代基础设施软件：初始用户往往不是最终付款方。最清晰的用户队列是开发者、平台工程师、DevOps 团队、IT
              管理员和安全运营人员；他们需要快速、低摩擦地访问跨云、办公室、笔记本、CI runner 和承包商环境中的私有资源。付款方一开始常是团队经理或工程预算，
              但公开包装和企业材料显示，只要身份集成、可审计性、姿态、支持和合规变重要，支出就会集中。因此买方、用户和付款方会按阶段分离。 小团队里，买方、用户和付款方可能都是同一个技术负责人。大公司里，用户可能是工程或
              MLOps，预算所有者则在 IT 或安全运营。 Tailscale 近期 AI 信息进一步扩展了用户集合：AI 构建者需要在用户、GPU、模型、数据、CI pipeline 和自主智能体之间建立安全连接，
              WorkOS 访谈显示 Tailscale 正试图把智能体身份做成原生网络控制问题。因此，采用路径通常是开发者主导的价值验证，随后接入身份提供商并强化策略， 再进入更广泛的企业标准化，或向 AI
              治理、工作负载访问、类 PAM 控制邻近增购。这个路径有吸引力，因为它缩短首次使用时间；但它也意味着公司必须同时赢得自下而上的产品喜爱和后期安全审查。
