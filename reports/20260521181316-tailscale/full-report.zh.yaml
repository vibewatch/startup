  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块
      - 主要用户 / 任务
      - 状态 / 成熟度
      - 技术基础
      - 差异化
      - 局限 / 尽调缺口
    rows:
      - - 核心 tailnet 连接
        - IT、安全、DevOps、开发者
        - GA / 成熟
        - WireGuard 网状网络、协调服务、NAT 穿透、DERP 回退
        - 通常让用户数据平面不经过供应商云，并能跨异构网络运行
        - Tailscale 未公开直连与中继流量占比
      - - tailnet 策略、ACL 和 grants
        - 网络和安全管理员
        - GA；grants 是后续主线
        - HuJSON 策略文件，包含组、标签、IP 集、设备态势、自动批准器和测试
        - 集中式默认拒绝策略可覆盖网络层和应用层
        - 仍不能替代完整内联 SWG/CASB/DLP 控制
      - - Tailscale SSH
        - 基础设施和平台团队
        - GA
        - 22 端口拦截、节点密钥、check 模式、会话录制
        - 保持基于身份访问的同时，省掉大部分 SSH 密钥分发苦活
        - 平台限制和既有 SSH 专属漏洞意味着买方仍需严格补丁纪律
      - - Kubernetes Operator
        - 平台工程
        - GA
        - API 代理、入口 / 出口代理、Connector CRD、S3 兼容会话录制
        - 不暴露公开 API、也无需单独集群凭证，就能私有访问 Kubernetes
        - 部分代理模式的 HA 扩展仍在推进中
      - - 子网路由器
        - IT 和网络运维
        - GA
        - 路由通告、审批流程、默认 SNAT、HA 模式
        - 将非托管设备以及整个 VPC/LAN 纳入同一身份模型
        - 相比直连客户端，网关管理和路由治理会增加复杂度
      - - 出口节点
        - 远程员工和安全团队
        - GA
        - 默认路由通告、客户端选择加入、审批流程、高阶套餐目的地日志
        - 让 Tailscale 能承接传统全隧道 VPN 和按地域出站的任务
        - 增加出站延迟，并把流量压到客户自管的中继设备上
      - - Serve / Funnel
        - 开发者和平台团队
        - Serve 已成熟；Funnel 在文档中仍为 beta
        - HTTPS 证书自动化、身份标头、Funnel 公共中继和 TCP 代理
        - 基于同一 tailnet 身份层，快速做私有或公开共享
        - 公开暴露仍需管好端口、带宽和生命周期
      - - 设备态势 + 日志
        - 安全和合规团队
        - GA，付费套餐权益更丰富
        - 设备态势属性、流日志、审计日志、SIEM 流式输出
        - 把持续验证和可审计性纳入连接决策
        - 高级态势信号和目的地日志受套餐限制
      - - Aperture AI 治理
        - 平台、安全和 AI 团队
        - Pre-GA / 实验性
        - 身份认证网关、集中式服务商凭证、钩子 / 护栏
        - 把 API 密钥从笔记本、CI 和智能体运行时移到可控网关
        - 文档和发布文章仍将其定位为 pre-GA，而非已在生产中验证
      - - Border0 支撑的 PAM 扩展
        - 基础设施和安全团队
        - 集成阶段
        - 协议感知控制、会话可见性、审批、录制、DB/K8s/RDP/VNC 工作流
        - 将 Tailscale 从网络层可达性扩展到应用层特权访问
        - 官方信息仍把更深原生集成放在路线图里，而不是已完成产品
    notes: 状态基于截至 2026-05-21 的公开证据；当 Tailscale 自身表述未达到完整 GA 声称时，使用「pre-GA」和「集成阶段」。
