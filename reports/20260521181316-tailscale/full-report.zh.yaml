  - id: FP002
    title: 按竞争者划分的能力集中度
    type: matrix
    layout: wide
    summary: 矩阵是压缩后的战略视图，不能替代详表；用途是显示能力在哪里集中、稀疏，或依赖运营者。
    data:
      columns:
        - 直连能力
        - 身份集成
        - 内联安全
        - 自托管控制
        - 特权会话深度
      rows:
        - label: Tailscale
          values:
            - label: 高
              tone: positive
              detail: 点对点网格，中央协调。
            - label: 高
              tone: positive
              detail: SSO、SCIM、群组，以及以代码管理的 ACL。
            - label: 低
              tone: risk
              detail: 不是完整的 SWG/CASB/DLP 套件。
            - label: 低
              tone: risk
              detail: 保留证据显示控制平面以托管为主。
            - label: 中
              tone: warning
              detail: 借 Border0 改善，但相比 Teleport 或完整 PAM 套件仍处早期。
        - label: Cloudflare One
          values:
            - label: 中
              tone: warning
              detail: 隧道和客户端模型，不是纯网格。
            - label: 高
              tone: positive
              detail: 多个 IdP、SAML/OIDC，以及绑定设备状态的策略。
            - label: 高
              tone: positive
              detail: SWG、CASB、FWaaS、DLP、RBI、DEM 等能力。
            - label: 低
              tone: risk
              detail: 托管云平台。
            - label: 中
              tone: warning
              detail: 基础设施访问包含短期证书和审计日志。
        - label: Zscaler
          values:
            - label: 中
              tone: warning
              detail: 通过云原生代理架构访问私有应用。
            - label: 中
              tone: warning
              detail: 具备身份感知访问，但保留证据中的集成细节少于 Cloudflare 或 Tailscale。
            - label: 高
              tone: positive
              detail: 内联检测、DLP、浏览器隔离。
            - label: 低
              tone: risk
              detail: 托管云服务。
            - label: 中
              tone: warning
              detail: 应用保护叙事强；保留来源中 PAM/会话叙事不够明确。
        - label: Prisma Access
          values:
            - label: 中
              tone: warning
              detail: 以连接器和云边缘为中心，而非网格。
            - label: 中
              tone: warning
              detail: 更大的 Palo Alto 技术栈提供企业策略深度。
            - label: 高
              tone: positive
              detail: ZTNA、SWG、CASB、网络安全，以及内联和 API 控制。
            - label: 低
              tone: risk
              detail: 托管套件，常与现有 NGFW 资产配套。
            - label: 中
              tone: warning
              detail: 企业控制强，但保留证据中它不是主要的 PAM 工具。
        - label: Cisco / Duo
          values:
            - label: 中
              tone: warning
              detail: 客户端或无客户端访问，加上面向非 ZTNA 应用的 VPNaaS。
            - label: 高
              tone: positive
              detail: Duo MFA、SSO、设备信任和广泛企业集成。
            - label: 高
              tone: positive
              detail: Secure Access 覆盖 SaaS、互联网和 AI 智能体检测主张。
            - label: 低
              tone: risk
              detail: 托管服务和更大的 Cisco 技术栈。
            - label: 中
              tone: warning
              detail: 身份安全不错；更深的 PAM 往往依赖相邻 Cisco 工具。
        - label: ZeroTier
          values:
            - label: 高
              tone: positive
              detail: 核心覆盖网络就是重点。
            - label: 中
              tone: warning
              detail: 套餐矩阵中出现 SSO 和访问控制功能。
            - label: 低
              tone: risk
              detail: 定位并不是广义检查套件。
            - label: 中
              tone: warning
              detail: 控制取向高于套件厂商，但托管方案仍占主导。
            - label: 低
              tone: risk
              detail: 不是以会话治理为先的工具。
        - label: NetBird
          values:
            - label: 高
              tone: positive
              detail: 基于 WireGuard 的 P2P 覆盖网络和路由。
            - label: 高
              tone: positive
              detail: SSO、MFA、SCIM、企业 IdP、审计日志。
            - label: 低
              tone: risk
              detail: 现代 VPN 替代品，不是 SSE 套件。
            - label: 高
              tone: positive
              detail: 开源，可自托管，并支持 IdP 选项。
            - label: 中
              tone: warning
              detail: 已有 NetBird SSH 和审计事件，但达不到完整 PAM 深度。
        - label: Nebula
          values:
            - label: 高
              tone: positive
              detail: 带打洞的 P2P SDN。
            - label: 低
              tone: risk
              detail: 身份靠证书和组驱动，不是 SaaS IdP 优先。
            - label: 低
              tone: risk
              detail: 代码库证据里看不到广义检查栈。
            - label: 高
              tone: positive
              detail: 控制力很高，因为运营方掌握 PKI 和 lighthouse 节点。
            - label: 低
              tone: risk
              detail: 保留证据里没有原生会话治理叙事。
        - label: Teleport
          values:
            - label: 中
              tone: warning
              detail: 安全隧道和基于代理的访问，不是通用网状网络。
            - label: 高
              tone: positive
              detail: SSO、短期证书和 RBAC。
            - label: 中
