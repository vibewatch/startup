  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 规模
      - 倍数 / 估值状态
      - 相关性
      - 为何不能直接类比
      - 对 Tailscale 的启示
    rows:
      - - Cloudflare
        - 上市公司；市值约 $75.16B，TTM 收入 $2.16B
        - 市值 / 收入约 34.8x；Multiples.vc 显示 EV/LTM 收入约 30.5x
        - 显示投资人愿意为高速增长的云基础设施叠加零信任邻近业务支付多少。
        - 边缘、网络和 SASE 平台宽得多，且有上市公司披露。
        - 只能作上限护栏；不能直接套用为 Tailscale 的倍数。
      - - Zscaler
        - 上市公司；市值约 $27.49B，TTM 收入 $3.00B
        - 市值 / 收入约 9.2x；Multiples.vc 显示 EV/LTM 收入约 8.3x
        - 可用作零信任与安全访问基准，企业级检测深度更强。
        - 平台以检测为重，企业规模也大于 Tailscale 当前范围。
        - 更适合作为已披露访问 / 安全厂商的中低位护栏。
      - - Palo Alto Networks
        - 上市公司；市值约 $205.11B，TTM 收入 $9.89B
        - 市值 / 收入约 20.7x；Multiples.vc 显示 EV/LTM 收入约 18.0x
        - 显示市场如何给已有规模、ARR 韧性强的安全平台定价。
        - 产品套件宽得多，ARR 达数十亿美元，分销引擎也更成熟。
        - 说明高端估值需要市场奖励怎样的业务范围和披露水平。
      - - Cisco
        - 上市公司；市值约 $465.87B，TTM 收入 $59.05B
        - 市值 / 收入约 7.9x
        - 可作广泛但增长较慢的既有厂商下限参照。
        - 集团规模、硬件收入混合和渠道力量让其结构上不同。
        - 说明增长放慢时，宽平台倍数可以低到什么水平。
      - - Finro 上市网络安全公司平均值
        - 覆盖 28 家上市网络安全公司的独立数据集
        - 平均收入倍数约 7.8x
        - 可锚定公开市场估值重心。
        - 数据集横跨多个细分赛道，并不专门针对连接优先厂商。
        - 支持保守折价，而不是假设顶十分位溢价。
      - - Finro 私营与 M&A 基准
        - 覆盖 161 家私营公司和 61 笔 M&A 可比交易的独立数据集
        - 私营公司平均收入倍数约 15.2x，M&A 约 16.3x；云安全平均约 21.7x
        - 说明私营轮和收购定价可以高于公开市场平均。
        - 基准混合了不同细分、阶段和交易动机。
        - 解释了为什么 Tailscale 或许能完成溢价融资，但相对上市可比公司仍显偏贵。
    notes: 公司倍数基于 2026-05-21 CompaniesMarketCap 的市值和收入快照估算；可取得时用 Multiples.vc 交叉校验上市可比公司。表格是一组代表性护栏，不是完整可比公司池。
