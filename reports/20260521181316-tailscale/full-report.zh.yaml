        title: 公开可比公司是有用护栏，但也说明顶端倍数很危险
        blocks:
          - type: paragraph
            body: >-
              使用公开可比公司的保守方式，是把它们当护栏，而不是直接套公式。Cloudflare、Zscaler、Palo Alto Networks 和 Cisco 都提供了有用的估值参照点， 但每家公司在关键层面都比
              Tailscale 更宽。Cloudflare 混合了网络、边缘和 SASE 宽度；Zscaler 围绕大规模检查和零信任交换架构搭建； Palo Alto 销售 AI 驱动的安全平台，下一代 ARR
              达数十亿美元；Cisco 拥有巨大规模、渠道触达和宽基础设施经济性。即便如此，公开样本仍有价值， 因为它显示了投资人已经愿意为具备可见收入和披露节奏的安全资产支付的估值区间。按公开市值和收入信号，选定区间大约在
              8x 到 35x 收入之间； Multiples.vc 和 Finro 都指向一个结论：上市网络安全公司的平均倍数远低于私募融资或头部 M&A。也就是说，Tailscale 不能只因为有 AI 客户和强用户喜爱，
              就自动借用 Cloudflare 式或云安全溢价倍数。如果唯一可见的 ARR 估计即便只是方向正确，2025 年 4 月这轮融资也已经偏向公开可比公司可支撑范围的高端。
