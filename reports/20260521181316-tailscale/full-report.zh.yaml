      - number: '7.3'
        title: 商业执行与客户质量风险
        blocks:
          - type: paragraph
            body: >-
              Tailscale 的商业化故事强到值得投资，但还没有透明到低风险。公开报道显示，Tailscale 已有超过 10,000 家付费商业客户，仍在增长； Mistral、Hugging
              Face、Perplexity、Cohere 和 Groq 等 AI 名字被反复强调为重要用户。这是一个真实信号：多云 AI 基础设施是身份优先 mesh 产品的有力切入点。 这也是集中度警报。公开记录没有说明
              AI 相关客户贡献了多少 ARR、毛利率或支持负担，免费增值底盘转化多少，或者第一个技术团队落地后，使用量是否能持久扩张。 定价面也不再像纯按座席计费的 VPN
              替代品那么简单，因为标签资源和临时资源现在很重要。与此同时，管理层评论和独立访谈显示，公司被拉向更大、 更多域的企业和 PAM 等相邻工作流。产品驱动增长最容易在这个阶段放慢，进入更长、更定制的企业周期。如果
              Tailscale 不能在支持大客户的同时守住低摩擦部署， 它可能两头都落空：既没有干净的 SMB 简单性，也拿不到完整企业钱包份额。
