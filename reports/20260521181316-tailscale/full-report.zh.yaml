      - number: '3.2'
        title: 架构、交付模型与控制平面取舍
        blocks:
          - type: paragraph
            body: >-
              架构核心分野在于，安全访问首先是直接覆盖网络问题，还是代理与检查问题。Tailscale 自己的对比材料仍最偏向第一种：集中协调但点对点连接，
              减少瓶颈、压低延迟，也更贴合开发者、基础设施和多云工作负载。Cloudflare、Zscaler、Prisma Access 和 Cisco
              则强调托管连接器、客户端和云端执行点，因为它们除了可达性，还在销售检查、姿态和策略汇聚。买方体验因此明显不同。套件厂商可以可信地主张更深的 inline 控制、浏览器隔离、DLP、安全 Web
              网关执行和更正式的私有应用保护，但它们也插入更多平台、更多策略表面，且往往让架构更依赖供应商云边缘。 第二个分野是自托管和开源。NetBird 明确支持带反向代理和 IdP 选择的自托管部署，Nebula
              要求团队管理 PKI 和 lighthouse，Teleport 提供社区版以及围绕证书颁发机构、代理和审计服务的自托管部署模式。这些替代方案重要，因为它们说明 Tailscale
              干净的托管体验是一项优势，而不是不可挑战的技术垄断。
