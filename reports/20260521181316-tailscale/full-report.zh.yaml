      - number: '5.4'
        title: 信任模型、运营成熟度与买方仍需承担的技术风险
        blocks:
          - type: paragraph
            body: >-
              Tailscale 的信任故事明显强于纯营销表面，但并非无风险。安全页和日志文档在基本原则上很强：端到端 WireGuard 加密、 私钥留在节点、Tailnet Lock
              降低对协调服务的信任、公开安全政策、SOC 2 Type II、不包含流量内容的 流日志，以及默认开启的配置审计日志。这是真实的控制姿态。公司愿意发布详细公告和清晰事故披露政策，同样如此。但 2026 年
              安全通告也说明产品可能在哪里失效。TS-2026-002 涉及本地 Web 界面，可能让已授权但权限不足的 peer 清除 exit-node 或 subnet-route 设置；TS-2026-001 影响
              macOS AlwaysOn MDM helper service， 并允许在窄部署切片中提升命令执行权限。FreeBSD Tailscale SSH 权限漏洞等更早记录显示，平台特定边缘案例确实会发生。
              可靠性也有类似双重性。Tailscale 的点对点设计降低了对中心流量枢纽的依赖，DERP 区域也会故障转移； 但 hard-NAT 场景仍依赖中继基础设施，运营状态页仍然存在，因为托管协调和中继系统可能失败。
              最大的战略取舍是功能广度。Tailscale 通常不解密或检查流量，因此保留隐私和性能；但它不是许多大型 SSE 或 SASE
              项目所购买的检查密集控制的完整替代品。产品在任务是安全可达性加身份感知策略时最强；当任务是集中内容检查、深度 inline 治理，或不需要路线图补充就成熟可用的 PAM 工作流时，它更弱。
