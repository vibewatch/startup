      - 公开状态
      - 范围
      - 运营价值
      - 剩余缺口 / 风险
    rows:
      - - 端到端 WireGuard 加密
        - 已有文档
        - 对等节点流量和 DERP 中继流量
        - 让 Tailscale 不进入明文数据路径
        - 无法做内联内容检查，信任也被推到端点
      - - Tailnet Lock
        - 已有文档
        - 节点密钥信任模型
        - 降低对等节点密钥分发对协调服务器的信任要求
        - 需要正确处理本地状态，并保持版本治理
      - - SSO / MFA 继承
        - 已有文档
        - 用户认证
        - 团队可复用既有 IdP 控制，而不是再建一套凭证孤岛
        - IdP 宕机或上游策略薄弱仍会传导
      - - SOC 2 Type II
        - 已有文档
        - 服务控制
        - 为安全性、可用性和机密性提供外部合规信号
        - 认证不等于每个模块都已达到功能级成熟
      - - 安全公告 + 事件政策
        - 已有文档
        - 客户端和托管后端
        - 明确修复预期和披露阈值
        - 要求客户跟踪版本，并在公告发布后快速行动
      - - 配置审计日志
        - GA，默认开启
        - tailnet 配置变更
        - 改善变更追踪和审计员可见性
        - 不能替代每个工作流更深层的协议 / 会话审计
      - - 网络流日志 / 日志流式输出
        - 付费套餐可用
        - 连接元数据，不含流量内容
        - 不传包负载，也能支持 SIEM 摄取和事件取证
        - 如果买方需要内联检查或内容 DLP 证据，价值有限
      - - 设备态势
        - 已有文档，按套餐分层
        - 基于设备状态的访问条件
        - 加入持续验证和条件访问
        - 更丰富信号需要付费权益和外部集成
      - - 公开状态 / 故障可见性
        - 公开状态页加第三方聚合
        - 托管服务运营
        - 事件期间提升运维人员感知
        - Hard-NAT 场景和控制平面依赖仍会带来托管服务风险
      - - 通过 Border0 获得 PAM 会话可见性
        - 已宣布 / 集成阶段
        - SSH、Kubernetes、DB、远程管理工作流
        - 有望补强特权访问审计轨迹
        - 在公开的 Tailscale 部署中，仍未完全原生，也未充分验证
    notes: 行项区分已以 GA 形态存在的控制，以及仍属路线图或套餐门槛的扩展。
