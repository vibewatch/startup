      - number: '2.4'
        title: 增长驱动、采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              品类确有动能，但不是无摩擦。增长驱动因素已有充分记录：云和 SaaS 迁移、身份中心安全、第三方访问、合规压力、混合办公，以及如今 AI 驱动的治理需求，都在把买方从旧边界模型推开。Grand
              View、MarketsandMarkets 和 Global Market Insights 都指向这些力量的某种组合，Mordor 还加入托管服务渠道和主权云要求，作为新的预算打开点。这些因素对
              Tailscale 尤其相关，因为产品适配多云和 AI 密集环境；在这些环境里，网络复杂度上升快于安全团队人数。约束同样重要，尤其影响估值。MarketsandMarkets 和 Global Market
              Insights 都标记了遗留基础设施、切换成本、供应商锁定和多云复杂度；Mordor 还加入延迟、出口流量费用和 SASE 架构师稀缺。更战略性地看，最大的市场风险是在位厂商打包。Zscaler、Palo
              Alto 和 Cisco 都营销低复杂度的平台整合， AWS 和 Microsoft 也能把身份优先私有访问塞进更广泛的云或身份合同。这意味着 Tailscale 的上行空间不只取决于品类增长，
              还取决于它能否保持足够差异化，让买方不默认选择更大在位厂商包里的「够用」访问。乐观情景是一块面向人员和工作负载的快速增长控制平面；悲观情景是一个有价值功能被更大平台逐步吸收。
