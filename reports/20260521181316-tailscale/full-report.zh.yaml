        blocks:
          - type: paragraph
            body: >-
              资本形成公开，资本充足性只部分公开。Tailscale 2022 年 Series B 和 2025 年 Series C 记录充分， 后者以约 $1.45-1.5 billion 估值融资 $160
              million，把累计披露融资推到约 $275 million。官方 Series C 文章的看点不只是轮次规模，更是管理层姿态：Tailscale 称自己已有很长现金跑道，之所以融资，是因为机会正在加速，
              尤其围绕 AI 基础设施、更广泛市场扩张、免费支持承诺和平台耐久性。BetaKit 进一步报道称，管理层认为公司无需追加融资也能实现现金流转正，
              后来又称其商业模式高效、现金跑道很长。招聘证据支持公司仍在投入。2026-05-21，careers 和 Greenhouse
              页面仍显示约二十多个开放岗位，覆盖工程、安全、产品、支持、营销、采购和销售；Border0 收购又在自然招聘之外增加了 PAM
              团队和集成路线图。缺失的是实际现金模型。保留公开来源没有披露在手现金、月度烧钱速度、现金跑道月份、债务工具或营运资本需求， 因此投资判断依赖管理层可信度和已募股权缓冲，而不是一张可发布的现金桥。
