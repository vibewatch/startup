      - number: '5.2'
        title: 网络实际如何运行：WireGuard、协调、NAT 穿透、DERP 与策略
        blocks:
          - type: paragraph
            body: >-
              技术核心是加密数据平面与托管协调平面的分工。Tailscale 称，设备间流量用 WireGuard 加密，协调服务交换公钥、peer 信息和 DERP
              map，让节点能够找到彼此。因此，产品会先尝试直连路径：设备认证，接收策略和 peer 元数据，尝试 NAT 穿透，然后在网络允许时点对点通信。 DERP 用于困难场景。DERP
              文档非常明确：中继服务器主要帮助协商连接，只有在直接路径和 peer relay 不可用时才承载加密 WireGuard 数据包。这个架构是 Tailscale 与传统集中式 VPN
              拉开差异的核心原因：多数用户平面流量不会经由供应商瓶颈折返， 因此直连成功时延迟和吞吐可以更好，常驻瓶颈也更少。不过控制平面仍重要。Tailscale 文档说明，现有点对点连接可以在协调服务中断时继续存活，
              但管理变更、新 peer 发现和部分 relay 优化仍依赖控制平面的正确性。策略同样集中化，尽管流量通常不是。tailnet policy file 承载 ACL、grant、设备姿态规则、SSH
              规则、auto-approver、tag 和 DERP map 定制，让访问控制可审计、可编程； 但这也意味着策略错误或过宽 grant 会带来真实影响半径。
