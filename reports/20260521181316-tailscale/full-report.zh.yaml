      - number: '3.4'
        title: 耐久性、替代风险与真实取舍
        blocks:
          - type: paragraph
            body: >-
              Tailscale 最强的乐观情景在于，买方准备购买完整 SASE 项目前，往往已经需要采购安全连接。这就是公司持续靠简单性、直接性能和开发者亲和力赢单的原因：
              产品从团队最先感受到的运维痛点切入。问题是，同样这些优势也最容易商品化。NetBird、Nebula、ZeroTier、Teleport Community Edition
              和普通内部自建都显示，安全覆盖网络可以用更多人力或更低打磨度重建。在高端，Cloudflare、Zscaler、 Palo Alto 和 Cisco 展示了相反风险：私有访问可以被吸收到更大的检查与合规套件里，让
              Tailscale 看起来像优秀功能，而不是完整平台。 Tailscale 2026 年进入 Aperture 和 Border0 支持的
              PAM，缩小了部分差距，但也抬高了公司在策略深度、可审计性、审批和企业控制上的达标线。 干净的尽调结论不是 Tailscale
              没有差异化；它显然有。结论是，它的护城河更偏执行和体验，而不是结构性：更快上线、更强产品喜爱、 更好的连接任务性能可以赢，但前提是公司上行到企业级的速度，要快过套件简化，也快过开源替代品模仿基础能力。
