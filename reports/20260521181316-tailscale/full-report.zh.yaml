  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Tailscale 在主要直连的 WireGuard 数据平面之上叠加身份、策略、协调和扩展，并提供中继兜底。
    data:
      layers:
        - id: l1
          label: 身份与管理层
          detail: 外部 IdP 登录、管理控制台、API 和计划权益决定谁能加入 tailnet，谁能管理 tailnet。
        - id: l2
          label: 策略与信任层
          detail: tailnet 策略文件、授权规则、ACL、设备状态规则、自动审批器、SSH 规则和 Tailnet Lock 定义哪些动作被允许、密钥如何受信任。
        - id: l3
          label: 协调层
          detail: Tailscale 的协调服务交换公钥、对等节点元数据和 DERP 映射，让节点彼此发现。
        - id: l4
          label: 连接层
          detail: WireGuard 对等节点先尝试穿越 NAT 直连 UDP；失败后再用对等中继，最后才用 DERP 作为加密兜底。
        - id: l5
          label: 访问与路由扩展
          detail: SSH、Kubernetes 代理、子网路由器、出口节点、Serve、Funnel 以及应用 / 工作负载连接器都复用同一张身份感知网络底座。
        - id: l6
          label: 可观测性与扩展层
          detail: 流量日志、配置审计日志、Aperture 以及 Border0/PAM 扩展位于连接底座之上，补上治理和审计深度。
    approximationNotes: null
    claimRefs:
      - CE003
      - CE008
      - CE009
      - CE021
      - CE027
      - CE030
      - CE031
      - CE039
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 典型 Tailscale 工作流先认证身份、下发策略和密钥，再优先尝试直连路径，最后调用具体功能访问层。
    data:
      nodes:
        - id: w1
          label: 认证用户或设备
          type: input
          detail: 用户通过外部身份提供商登录，或带标签设备加入 tailnet。
        - id: w2
          label: 加入 tailnet
          type: process
          detail: 设备获得 tailnet 身份、私有 Tailscale IP 和适用的策略状态。
        - id: w3
          label: 交换密钥和对等节点元数据
          type: process
          detail: 协调服务共享公钥、对等节点详情和 DERP 映射信息。
        - id: w4
          label: 尝试直连路径
          type: decision
          detail: 客户端尝试穿过 NAT 和防火墙建立加密 WireGuard 路径，无需手动转发端口。
        - id: w5
          label: 需要时兜底
          type: process
          detail: 如果直连不可达，流量可以先走对等中继；只有最后才用 DERP 作为加密兜底。
        - id: w6
          label: 应用功能专属控制
          type: process
          detail: SSH、Kubernetes、子网路由、出口节点、Serve/Funnel、设备状态、日志或 Aperture 增加工作流专属行为。
        - id: w7
          label: 观察并审计
          type: output
          detail: 管理员查看日志、审计轨迹和策略结果，终端用户则继续使用服务。
      edges:
        - from: w1
          to: w2
        - from: w2
          to: w3
        - from: w3
          to: w4
        - from: w4
          to: w5
        - from: w5
          to: w6
        - from: w6
          to: w7
    approximationNotes: null
    claimRefs:
      - CE002
      - CE005
      - CE008
      - CE011
      - CE021
      - CE031
      - CE052
  - id: FE003
    title: 关键依赖地图
    type: dag
    layout: wide
    summary: Tailscale 最大的收益来自 WireGuard 直连，但仍依赖外部身份、托管协调、公共网络可达性和功能专属扩展。
    data:
      nodes:
        - id: d1
          label: 外部身份提供商
          detail: SSO 和 MFA 状态依赖客户选择的 IdP 及其可用性。
        - id: d2
          label: Tailscale 协调服务
          detail: 分发公钥、对等节点元数据和 DERP 映射，并支撑管理变更。
        - id: d3
          label: 公共互联网与 NAT 条件
          detail: 直连可达性取决于真实世界的防火墙和 NAT 行为，这些现实条件不在 Tailscale 直接控制内。
        - id: d4
          label: 支持 WireGuard 的终端
          detail: 客户端正确性和版本卫生很关键，因为加密和策略执行都落在终端上。
        - id: d5
          label: 支持对等中继的 tailnet 节点
          detail: 客户配置的中继节点可在路径受阻时降低对 DERP 的依赖。
        - id: d6
          label: DERP 中继网络
          detail: 直连或对等中继失败时，托管中继区域吸收复杂 NAT 流量。
        - id: d7
          label: 功能专属服务
          detail: SSH、Kubernetes、出口节点、Serve/Funnel、Aperture 和 Border0 支撑的 PAM 在上层增加差异化工作流。
      edges:
        - from: d1
          to: d2
          label: 认证上下文
        - from: d2
          to: d4
          label: 密钥 + 策略
        - from: d3
          to: d4
          label: 可达性
        - from: d4
          to: d5
          label: 可选中继
        - from: d4
          to: d6
          label: 兜底中继
        - from: d2
          to: d6
          label: DERP 映射
        - from: d4
          to: d7
          label: 扩展工作负载
    approximationNotes: 依赖地图聚焦会改变产品行为或风险的公开依赖，不试图枚举 Tailscale 托管后端背后的每一项内部服务。
    claimRefs:
      - CE031
      - CE032
      - CE034
      - CE035
      - CE046
      - CE047
      - CE052
      - CE053
