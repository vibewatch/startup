  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：为什么短名单会按买方类型分裂
        blocks:
          - type: paragraph
            body: >-
              Tailscale 实际上不是在打一组单一竞争对手。短名单会按买方最先要解决的问题分裂。如果任务是「快速替换传统 VPN 摩擦，而不是重做整个安全栈」， Tailscale、NetBird、ZeroTier
              以及较弱程度上的 Nebula 是自然对照，因为它们都承诺以比传统 VPN 资产更轻的运维负担实现覆盖网络连接。 如果任务是「在更大安全转型里标准化私有访问」，Cloudflare One、Zscaler
              Private Access、Prisma Access 和 Cisco Secure Access 会排到前面，因为这些平台把 ZTNA 与更广泛的流量检查、SaaS 控制、浏览器隔离、防火墙和企业分发打包。
              Teleport 在评估从特权基础设施访问、而不是员工网络连接开始时发生重叠。战略转折在于，Tailscale 已不只是企业 VPN 替代品：
              它的定价现在覆盖带标签和临时资源，企业叙事围绕身份、策略和自动化，2026 年新闻显示它正扩到 AI 治理和更完整的 PAM。 这扩大了上行空间，也把 Tailscale
              拉进与套件厂商更直接的竞争；后者能用广度、渠道力量和采购捆绑，对冲 Tailscale 的简单性叙事。
