      - number: '6.5'
        title: 集中度风险、AI 组合与公开证据缺口仍需尽调
        blocks:
          - type: paragraph
            body: >-
              Tailscale 的客户故事带着三类商业风险。第一，AI 需求显然在推着增长走——独立报道把公司与 Mistral、Hugging Face、Perplexity 和 Cohere 联系在一起——但公司没有披露
              AI 初创公司相对于更广客户 底盘贡献了多少收入、带来了多少增量客户。第二，证据集偏向技术前沿、工程驱动型组织；这对产品市场契合度是好信号，
              但也可能高估了行动更慢、采购更重的买方采用率。第三，公共部门证据仍然薄弱。本轮看到的具名机构证据，最强的在高等教育、
              非营利基础设施和邻近公共部门的航空航天，而不是已披露的政府机构部署。这并不意味着公司没有公共部门牵引力，只是公开证据
              还没有跟上。再叠加缺少头部客户集中度数据，这一章的结论是：生产使用已经被充分证明，但客户质量背后的经济性仍披露不足。
