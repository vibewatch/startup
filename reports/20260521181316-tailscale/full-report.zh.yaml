  - id: TP003
    title: 定价 / 包装比较
    columns:
      - 厂商
      - 公开包装信号
      - 计量口径 / 单位
      - 公开标价信号
      - 含义
    rows:
      - - Tailscale
        - 免费增值、Premium 和 Enterprise
        - 用户、带标签资源、临时资源分钟数
        - 公开：最多 6 名用户免费，之后每用户 / 月 $8 和 $18，企业版定制
        - 试用门槛很低；买方能看见以工作负载为主的使用何时开始变得重要
      - - Cloudflare One
        - 零信任 / SASE 方案页面，加联系销售式套餐
        - 用户自助导向的 SASE 套餐，连接器经济性藏在平台里
        - 公开页面更强调套餐思路和专家联系，而不是可直接对比的访问价格
        - 捆绑杠杆强，但很难用单席位指标与 Tailscale 直接对比
      - - Zscaler Private Access
        - 有公开定价，但页面覆盖范围比 ZPA 更宽
        - 按套件 / 模块组织
        - 留存公开页面没有给出清晰的 ZPA 单品标价
        - 安全主导的买家往往把它放进更大的平台评估，而不是当作简单 VPN 替代品
      - - Prisma Access / Prisma SASE
        - 专家销售主导的企业套餐
        - 以报价为主的套件 / 连接器 / 平台经济性
        - 留存页面没有清晰公开标价
        - Palo Alto 可以用产品宽度和装机基础抵消定价不透明
      - - Cisco Secure Access / Duo
        - Secure Access 以报价为主；Duo 公开分层
        - Secure Access 套件加 Duo 按用户分层
        - Duo 显示 $0 / $3 / $6 / $9 / 用户 / 月；Secure Access 页面公开，但没有标价
        - Cisco 可以公开身份层级，同时让更宽的访问套件价格留在谈判桌上
      - - ZeroTier
        - 面向设备和网络的公开方案矩阵
        - 按设备 / 网络组织
        - 定价页公开，但具体方案机制更偏设备，不是席位
        - 对覆盖网络买家有用，但不是访问套件采购的干净替代品
      - - NetBird
        - 透明的现代 VPN 套餐
        - 按用户计费，机器超额另算
        - 公开：最多 5 个用户免费；Team $5 / 用户 / 月；Business $10
        - 在现代托管覆盖网络中，NetBird 对 Tailscale 的低端定价压力最直接
      - - Nebula
        - 开源运营模式
        - 基础设施人力、PKI、lighthouse 托管
        - 仓库证据中没有软件标价；托管选项不在留存仓库证据内
        - 许可证成本低，但除非团队本来就想自运维，否则运营时间很贵
      - - Teleport
        - 按明确计量项定制报价
        - MAU、机器 / 工作负载身份、受保护资源
        - 商业定价为定制，但计费单位公开；较小公司可免费使用社区版
        - 更接近治理与可审计访问平台，而不是简单的按席位 VPN 替代品
    notes: 关键尽调点不是每个既有厂商的准确标价，而是计费模型与 Tailscale 的可比性。许多套件厂商公开套餐信号，同时把买家推向谈判合同。
