  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 传统 / 现有工作流
      - Tailscale 方案
      - 声称收益
      - 主要局限 / 权衡
    rows:
      - - 从任何地方访问内部应用和服务器
        - 流量绕回集中式 VPN 集中器
        - 直连 tailnet；需要全隧道时用出口节点
        - 直连路径可用时，延迟更低、瓶颈更少
        - 单独来看不是完整内联检查栈
      - - 暴露非托管子网或云 VPC
        - 搭建对等连接、堡垒机，或到处安装客户端
        - 子网路由器向 tailnet 通告路由
        - 将基于身份的访问扩展到遗留或非托管网络
        - 路由审批、SNAT 选择和 HA 设计都变成管理员工作
      - - 为差旅或合规保护全部公共互联网流量
        - 传统全隧道 VPN
        - 出口节点把默认流量经由指定设备转发
        - 满足 VPN 式出站和地域要求
        - 集中出站会增加延迟和节点运维负担
      - - 管理主机和集群
        - SSH 密钥、公开 API 端点、单独 kubeconfig 密钥
        - Tailscale SSH 和 Kubernetes API 代理
        - 基于身份的访问、录制选项和私有 API 可达性
        - 仍需要严谨的策略设计，并保持客户端版本最新
      - - 快速共享内部或面向公网的服务
        - 临时反向代理或公网隧道工具
        - Serve 用于仅限 tailnet 的访问；Funnel 用于面向互联网的访问
        - 在私有路径上带身份上下文的快速 HTTPS 共享
        - Funnel 仍为 beta，公开暴露有固定带宽和端口限制
      - - 控制 AI 模型访问，避免密钥蔓延
        - API 密钥被复制到本地 env 文件、CI 和智能体运行时
        - Aperture 网关集中管理密钥，并将请求绑定到 Tailscale 身份
        - 在网关集中做审计、支出控制和护栏
        - 公开证据仍显示部署基础偏实验性，而非广泛验证
    notes: 本表比较的是 Tailscale 取代既有工作流的运行方式，而不是对标某个单一竞品 SKU。
