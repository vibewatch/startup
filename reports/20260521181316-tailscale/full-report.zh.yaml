      - CU043
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高的剩余风险不是单纯技术故障；而是上方套件厂商的战略挤压、披露不透明，以及从最初 VPN 替代切入口向外扩张所需的协同能力。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 套件厂商挤压
          values:
            - label: 高
              tone: risk
              detail: Cloudflare、Zscaler、Palo Alto、Cisco 都在销售更完整的 SSE 平台。
            - label: 高
              tone: risk
              detail: 可能压住客户预算份额，或把 Tailscale 降格成一个功能 / 补充组件。
            - label: 中
              tone: warning
              detail: Tailscale 靠简单和产品口碑应对，而不是用同等广度硬拼。
            - label: 高
              tone: risk
              detail: 仍是最具战略性的长期风险。
        - label: 开源 / 自托管替代品
          values:
            - label: 中
              tone: warning
              detail: NetBird、ZeroTier、Teleport 让替代方案始终可见。
            - label: 中
              tone: warning
              detail: 主要压迫低端或专业化场景。
            - label: 中
              tone: warning
              detail: Tailscale 仍靠托管版的简单性胜出。
            - label: 中
              tone: warning
              detail: 护城河来自执行，不是绝对壁垒。
        - label: 协调 / DERP 依赖
          values:
            - label: 中
              tone: warning
              detail: 管理操作和困难路径流量仍依赖托管系统。
            - label: 高
              tone: risk
              detail: 运营问题可能很快影响登录、API、Funnel 和策略变更。
            - label: 中
              tone: warning
              detail: Tailnet Lock、点对点设计和中继故障切换有所缓释，但无法抹掉依赖。
            - label: 高
              tone: risk
              detail: 关乎企业信任的核心运营风险。
        - label: 安全 / 补丁执行
          values:
            - label: 中
              tone: warning
              detail: 公告显示，客户端攻击面仍会反复出问题，但可以修复。
            - label: 高
              tone: risk
              detail: 对敏感部署，特权访问和路由控制漏洞可能影响重大。
            - label: 中
              tone: warning
              detail: 披露质量不错；但客户侧设备群的补丁卫生不完全由 Tailscale 控制。
            - label: 中
              tone: warning
              detail: 剩余风险可控但持续存在。
        - label: 客户质量不透明
          values:
            - label: 高
              tone: risk
              detail: 转化率、留存率和集中度均未公开披露。
            - label: 高
              tone: risk
              detail: 估值纪律更难把握。
            - label: 低
              tone: risk
              detail: 除管理层表述和精选客户故事外，没有公开缓释证据。
            - label: 高
              tone: risk
              detail: 这是投资人视角下最大的风险之一。
        - label: 治理 / 范围执行风险
          values:
            - label: 中
              tone: warning
              detail: 全远程小团队加创始人主导叙事，可能规模化得很好，也可能被摊得太薄。
            - label: 中
              tone: warning
              detail: 可能拖慢企业级准备度或集成质量。
            - label: 中
              tone: warning
              detail: 新资金和新运营高管有帮助，但证据仍处早期。
            - label: 中
              tone: warning
              detail: 风险有分量，但低于竞争和不透明度。
    approximationNotes: 这张热力图是基于公开直接证据搭出的综合视角，不是统计损失模型。标签按投资人截至 2026-05-21 对剩余暴露的判断分级。
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR026
      - CR035
      - CR037
      - CR047
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Tailscale 的主要风险通过少数渠道传导到估值：企业胜率、留存质量、支持成本，以及市场是否相信公司能扩张而不变成更重的套件。
    data:
      nodes:
        - id: n1
          label: 套件厂商挤压
          detail: 更完整的 SSE 厂商可能降低胜率或客户预算份额。
        - id: n2
          label: AI / 客户集中度不透明
          detail: 公开证据显示 AI 需求存在，但未披露收入结构或集中度。
        - id: n3
          label: 协调 / 宕机风险
          detail: 可靠性事件可能削弱管理和访问工作流的信任。
        - id: n4
          label: 功能蔓延执行
          detail: PAM 和 AI 治理扩张可能抬高支持和交付负担。
        - id: n5
          label: 企业胜率
          detail: 大单能否在不依赖重折扣或补充栈要求下成交。
        - id: n6
          label: 留存 / 扩张质量
          detail: 已落地账户能否续约，并以有吸引力的经济性扩大使用。
        - id: n7
          label: 支持与运营成本
          detail: 复杂度或事故会抬高服务和工程负载。
        - id: n8
          label: 估值支撑
          detail: 只有增长质量被证明可持续，私募市场溢价才站得住。
      edges:
        - from: n1
          to: n5
          label: 压低成交率
        - from: n1
          to: n8
          label: 压缩护城河
        - from: n2
          to: n6
          label: 遮蔽质量
        - from: n2
          to: n8
          label: 抬高折扣
        - from: n3
          to: n7
          label: 增加事故负载
        - from: n3
          to: n6
          label: 可能伤害信任
        - from: n4
          to: n7
          label: 增加交付成本
        - from: n4
          to: n5
          label: 拖慢企业销售动作
        - from: n5
          to: n8
          label: 支撑增长叙事
        - from: n6
          to: n8
          label: 支撑持续性叙事
        - from: n7
          to: n8
          label: 挤压效率
    approximationNotes: 这张图展示因果传导路径，而不是量化弹性；目的是说明哪些可观察事件会最快改变估值信心。
    claimRefs:
      - CR002
      - CR013
      - CR026
      - CR029
      - CR032
      - CR036
      - CR037
      - CR046
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 最关键的依赖并不在加密数据平面内，而在身份、协调、中继条件、合规伙伴，以及仍在成形的特权访问扩张栈。
    data:
      nodes:
        - id: d1
          label: 客户身份提供商
          detail: 认证和 MFA 来自买方现有 IdP。
        - id: d2
          label: Tailscale 协调服务
          detail: 分发密钥、策略和节点准入状态。
        - id: d3
          label: 公共互联网 / NAT 条件
          detail: 直连取决于真实网络路径条件。
        - id: d4
          label: DERP 中继网络
          detail: 直连或对等中继失败时的备用路径。
        - id: d5
          label: 客户合规与安全团队
          detail: 需要判断 Tailscale 是否符合监管和检查要求。
        - id: d6
          label: 分包处理方 / 服务地点
          detail: 支撑服务背后的法律和数据处理栈。
        - id: d7
          label: Border0 / PAM 集成路径
          detail: 为特权访问新增工作流，但仍在集成中。
        - id: d8
          label: Tailscale 账户经济性
          detail: 席位、带标签资源、临时用量分钟数和企业定价。
      edges:
        - from: d1
          to: d2
          label: 认证上下文
        - from: d2
          to: d4
          label: 中继地图
        - from: d3
          to: d4
          label: 备用需求
        - from: d2
          to: d5
          label: 共同责任审查
        - from: d6
          to: d5
          label: 隐私 / 地点审查
        - from: d7
          to: d8
          label: 新变现面
        - from: d2
          to: d8
          label: 核心产品价值
        - from: d5
          to: d8
          label: 采购匹配度
    approximationNotes: 这张依赖图有意排除所有内部微服务，只聚焦最可能改变客户信任、采购摩擦或经济价值的外部系统 / 架构依赖。
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR008
      - CR015
      - CR033
      - CR041
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 只有在强劲市场拉力和客户增长能够匹配 ARR、留存和利润率的私有证据时，估值判断才会改善。
    data:
      nodes:
        - id: n1
          label: 产品-市场验证
          description: 10,000+ 付费企业客户加上客户持续增长，显示市场拉力强。
        - id: n2
          label: AI 与企业需求
          description: AI 客户和大型企业似乎正在把路线图和融资叙事向上拉。
        - id: n3
          label: 2025 年溢价融资
          description: $1.45B 投后融资已把持续强执行计入价格。
        - id: n4
          label: 披露缺口
          description: 公开证据仍缺准确 ARR、利润率、留存、集中度和股权结构细节。
        - id: n5
          label: 上市可比公司天花板
          description: 披露更强、套件更完整的上市同行已经划定溢价区间。
        - id: n6
          label: 继续研究
          description: 只有私有尽调证明 Tailscale 值得接近或高于上一轮估值时才投资。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n6
          label: 只有质量守住才支撑上行
        - from: n4
          to: n6
          label: 迫使尽调
        - from: n5
          to: n6
          label: 限制盲目乐观
        - from: n3
          to: n5
          label: 用公开护栏检验溢价
        - from: n1
          to: n4
          label: 仅有牵引力不够
    approximationNotes: 这条流程是分析性决策路径，不是统计模型。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV013
      - CV045
      - CV046
      - CV055
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值案例最敏感的不是已经可见的市场故事，而是非公开经济性证据。
    data:
      items:
        - label: ARR 证明
          value: 5
          detail: 准确 ARR 是缺失的单一最重要估值输入。
        - label: 利润率与烧钱质量
          value: 5
          detail: 资本效率决定溢价定价是合理还是危险。
        - label: 留存 / 扩张
          value: 5
          detail: 高溢价软件估值需要持久的落地扩张证据。
        - label: 客户集中度
          value: 4
          detail: AI 和大型企业动能仍可能掩盖集中度风险。
        - label: 平台广度执行
          value: 4
          detail: 范围扩张必须提高客户预算份额，同时不破坏简单性。
        - label: 公开市场倍数环境
          value: 3
          detail: 板块风险偏好重要，但公司质量证据更重要。
    approximationNotes: 条形图按投资人视角用 1-5 分衡量相对估值敏感性，不代表测得的弹性。
    claimRefs:
      - CV042
      - CV047
      - CV049
      - CV051
      - CV057
      - CV061
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 根据私有尽调结果，保守的公开证据区间把 Tailscale 放在低于、接近或高于 2025 年融资轮的位置。
    data:
      items:
        - label: 悲观情景
          low: 0.8
          mid: 0.95
          high: 1.1
        - label: 基准情景
          low: 1.2
          mid: 1.4
          high: 1.6
        - label: 乐观情景
          low: 1.7
          mid: 2
          high: 2.3
    approximationNotes: 所有数值均为以十亿美元计的估算值，反映保守的公开证据护栏，不代表按市价计量的精确值。
    claimRefs:
      - CV049
      - CV050
      - CV051
      - CV058
      - CV059
      - CV060
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 记分卡在市场拉力和产品验证上很强，但披露质量和安全边际偏弱。
    data:
      items:
        - label: 市场拉力
          value: 4/5
          detail: 客户和增长信号强劲。
          tone: positive
        - label: 产品差异化
          value: 4/5
          detail: 相比传统 VPN 痛点，公司仍明显更好。
          tone: positive
        - label: 平台广度
          value: 2/5
          detail: 上市可比公司套件更广，也承载更多检查流程。
          tone: risk
        - label: 披露质量
          value: 1/5
          detail: ARR、利润率、留存和股权结构条款仍未公开。
          tone: risk
        - label: 资本效率证明
          value: 3/5
          detail: 叙事有吸引力，但硬数字缺失。
          tone: warning
        - label: 估值安全边际
          value: 2/5
          detail: 上一轮已经把大部分可见上行计入价格。
          tone: risk
    approximationNotes: 这些 KPI 是综合投资判断，不是经审计的运营指标。
    claimRefs:
      - CV004
      - CV005
      - CV013
      - CV045
      - CV046
      - CV047
      - CV055
      - CV058
