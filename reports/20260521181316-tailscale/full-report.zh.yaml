            body: >-
              留存和扩张证据显然是公开客户故事中最弱的一环。好消息是，定性信号真实存在：员工数和运营复杂度上升后，Cribl、Mercury 和 Loft Orbital
              都描述了更大范围铺开，评论网站也仍强调易用、设置快、支持负担更低。评论信号并不完美。PeerSpot 投诉提到 Mac 上的多账户登录问题，以及在 tailnet 之间切换时的摩擦；Trustpilot
              至少包含一条认为文档缺少细节的投诉。 即便如此，负面信号指向的是可用性边缘，而不是大规模部署失败。投资者需要判断耐久性的关键数据仍然缺失：NRR、GRR、流失、
              平均合同期限、续约率和分部门扩张曲线。公开案例研究显示，账户可以从一个工作流落地，并扩到路由、身份、CI/CD 或边缘支持， 但并未显示这种扩张发生的频率，也没有显示创造了多少收入扩张。
