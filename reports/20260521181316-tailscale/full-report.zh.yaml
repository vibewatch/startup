      - number: '4.4'
        title: 反向视角与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              反向财务视角更多是不透明，而不是可见困境。官方和媒体来源让一家私营基础设施公司的定价、客户 logo、融资轮次和增长叙事异常清晰， 但核心尽调指标仍是私有信息：没有官方
              ARR、收入、毛利率、烧钱速度、现金跑道、递延收入、NRR 或折扣披露。第三方数据库试图填补缺口， 却带来噪声而不是确定性。GetLatka 估算 2025 年收入约 $45.2 million、员工约 250
              人；BetaKit 则报道 Series C 后立即有 150 名员工。方向上这与增长一致，但不足以精确建模。公司还背负销售信任基础设施的信任负担。 Tailscale 披露了两个值得注意的 2026
              年安全公告，并保持公开状态和事故披露姿态；这是良好治理，也提醒投资人：
              修复、支持和声誉成本都是商业模式的一部分。因此，财务结论受限但仍可用：收入质量可能受益于经常性席位和扩张用量，资本强度看起来像软件而非重资产，
              融资依赖度中等；但严肃投资者在把当前估值视为已被充分支撑前，仍需要客户队列、实际成交价和现金烧钱数据。
