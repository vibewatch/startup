    columns:
      - 触发项
      - 阈值 / 信号
      - 为何重要
      - 行动含义
      - 监控路径
    rows:
      - - ARR 真实性核验失败
        - 私营 ARR 明显低于约 $60M，或增长已经拐头。
        - 2025 年融资估值相对上市可比区间开始显得偏贵。
        - 不要按上一轮或高于上一轮承销。
        - 索取月度 ARR 桥表和队列增长。
      - - 利润率和烧钱表现偏弱
        - 毛利率或烧钱曲线显示软件杠杆不足。
        - 相对上市同业，溢价估值更难站住。
        - 要求价格保护，或放弃。
        - 复核经审计毛利率、烧钱倍数和现金跑道。
      - - 客户集中度高
        - 头部客户或 AI 队列贡献了过高 ARR 份额。
        - 一旦某个队列降温，叙事强度可能很快回落。
        - 提高折现率，或避免进入。
        - 取得前 10 大客户和行业集中度表。
      - - 留存只是普通水平
        - NRR 或 GRR 看不出强劲的落地后扩张行为。
        - 公司可能只配得上上市网络安全公司的平均倍数。
        - 下调基准情景。
        - 索取 NRR、GRR、logo 流失和扩张桥表。
      - - 平台扩张停滞
        - 企业级路线图和邻近产品扩大了成本，却没有提高客户钱包份额。
        - Tailscale 可能停留在受欢迎但更窄的访问工具。
        - 下调终局倍数假设。
        - 跟踪企业功能和新产品模块的附加采用率。
    notes: 阈值是估算性的尽调触发项，不是公开事实；刻意保持简单，因为公开证据集缺少做更精细校准所需的公司数据。
