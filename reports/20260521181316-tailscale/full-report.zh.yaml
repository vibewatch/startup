      - number: '2.2'
        title: 定量视角：狭义 ZTNA、广义 SASE 与 Tailscale 可触达 SAM
        blocks:
          - type: paragraph
            body: >-
              最重要的市场规模事实是，公开估算分歧很大，而且分歧有合理原因。狭义 ZTNA 来源指向当下低个位数十亿美元市场：Grand View 将 2025 年 ZTNA 估为 USD 1.97 billion，ORDR
              的 2026 年汇编将 ZTNA 估为 USD 2.95 billion。广义 SASE 估算大得多，但内部也不一致：MarketsandMarkets 称 2026 年为 USD 19.19
              billion，Mordor 称 2026 年为 USD 15.54 billion，Global Market Insights 称 2026 年为 USD 2.8
              billion。这种跨度不是可以平均掉的噪声，而是市场定义驱动估值叙事的证据。对 Tailscale 来说，务实的定量方法是同时使用多个视角。 最宽的 TAM 是重新打开的零信任和 SASE
              预算，买方在这里重新考虑 VPN、访问和网络安全架构。更直接的 SAM 是替换员工、承包商和工作负载的传统 VPN 或堡垒机流程的支出，尤其是团队想要身份原生控制、但不想买完整安全套件的场景。最受证据限制的
              SOM 视角是变现：Tailscale 按用户收费，并对某些资源和临时工作负载另行计量，因此已部署席位和资源分钟数，比一句笼统的「SASE 份额」更重要。传统 AWS VPN
              定价也说明，这可以是一条预算线，而不只是技术偏好。
