        - 开源和自托管覆盖网络复制了基础 mesh 访问任务
        - 高
        - NetBird、Nebula、ZeroTier、Teleport Community 以及内部自建，会在小客户和重视控制的账户中压低价格
        - 衡量开发者主导试点相对免费或自托管替代方案的付费转化和扩张
      - - 身份优先的连接叙事
        - 既有厂商把连接打包进更宽的身份、SWG、CASB、DLP 套件
        - 高
        - 预算负责人可能优先优化整合度和合规姿态，而不是纯连接体验
        - 测试交易需要设备姿态、日志和受监管工作流时，Tailscale 附加率是否上升
      - - 向 PAM 和 AI 治理扩张
        - 上移栈位会在功能对等完全跑通前，就增加与 Teleport 和套件厂商的重叠
        - 中
        - Aperture 和 Border0 抬高上行空间，也抬高了在审批、会话可见性、审计控制上的举证门槛
        - 索取在生产环境使用 Border0 衍生工作流和 Aperture 的客户证言，而不是 alpha 阶段
      - - 基础设施无关定位
        - 云和身份既有厂商仍可把相邻访问功能吸进更大的合同
        - 中
        - 即使直接竞争者技术路径不同，预算科目仍可能并入更大的平台续约
        - 核查 Tailscale 作为独立预算项销售的频率，而不是被纳入更宽安全标准的频率
      - - 简单定价和易试用
        - 企业定价仍很难与谈判后的套件折扣对比
        - 中
        - 没有真实采购对比时，公开标价透明度可能高估经济优势
        - 收集现有竞争交易中的真实客户报价、折扣水平和替换成本
    notes: 严重程度反映的是对 Tailscale 差异化的竞争风险，不是生存概率。该台账有意同时覆盖自下而上的开源压力和自上而下的既有厂商捆绑。
