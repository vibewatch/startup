  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              不应把 Tailscale 的市场口径算成「全部网络安全」，甚至也不应算成「全部 SASE」。公司自己的文档把它放在更窄但仍有意义的切口： 身份优先安全连接，替换传统 VPN 访问，延伸到 PAM
              和工作负载访问，现在又触达 AI 基础设施和智能体治理。也就是说，纳入支出包括远程和第三方应用访问、 基础设施访问、用户与工作负载身份执行、开发者和 CI/CD
              连接，以及让这些流在企业规模下可用的策略层。主要排除支出包括更广义的 Web 和邮件安全、完整 CASB 和 DLP 套件，以及整个 SD-WAN
              或分支网络栈，除非这些预算正因零信任项目重新打开。因此，替代集合与标题品类标签同样重要。 传统 VPN 和自管 WireGuard 仍是很多团队的现状；ZeroTier 和 NetBird
              是软件优先的覆盖网络替代品；Teleport 争夺 PAM 和工作负载身份预算；AWS、Microsoft、Cloudflare、Cisco、Zscaler 和 Palo Alto
              都把重叠访问控制打包进更大的套件。 尽调时，真正有用的边界是这笔支出：以低运维摩擦把正确的人、设备或工作负载连到正确私有资源，而不是分析师营销里每一美元叫作 SASE 的预算。
