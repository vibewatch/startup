  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与 Tailscale 实际服务的客户任务
        blocks:
          - type: paragraph
            body: >-
              Tailscale 的公开产品表面从一个比多数传统 VPN 或 SSE 栈更简单的承诺出发：先用身份和加密，把正确用户、设备或工作负载连到正确资源； 只有需要时，再加路由或治理功能。文档把核心单元定义为
              tailnet，即由用户、设备和资源组成的私有网络；产品页把同一模型延展到远程员工访问、 多云和本地基础设施、CI/CD runner、边缘设备和 AI 工作负载。这个框架重要，因为它解释了为什么
              Tailscale 会同时像好几个产品。 一个部署里，它是集中式远程访问 VPN 的直接替代；另一个部署里，它是安全 SSH 和 Kubernetes 访问；再一个部署里，它是私有服务共享层， 或 AI
              模型访问网关。当前商业包装强化了这种广度：定价页现在把点对点连接、子网路由器、出口节点、SSH、Kubernetes、 Funnel、设备姿态、日志和 Aperture
              视为一个平台的组成部分，而不是互不相连的附加件。乐观读法是，公司在不放弃同一个身份优先网络核心的前提下， 不断扩展可解决的任务数量。更审慎的读法是，它本质上仍是连接平台，因此想要完整 inline
              流量检查、DLP 或浏览器隔离控制的买方，仍需要互补工具。
