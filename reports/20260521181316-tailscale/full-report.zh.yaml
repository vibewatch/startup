  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 2025 年 4 月这轮融资抬高了门槛，但公开经济性仍落后于叙事
        blocks:
          - type: paragraph
            body: >-
              Tailscale 2025 年 4 月的 Series C 很容易被误读，因为融资标题比背后的公开经济披露更强。独立报道在关键事实上一致： 公司融资 $160M，投后估值约 $1.45B，付费商业客户超过
              10,000 家，并且到 2025 年春季仍在快速复合增长客户新增和收入。这是真实的商业拉力证据， 但不等于一个可以完整承保的估值。同一批报道也说，ARR
              未披露，公司只是方向性描述高速增长，管理层把业务描述为在需要时有足够现金跑道走向盈利。 这种组合通常意味着投资人在为轨迹付费，而不是为已披露的财务质量付费。因此，从 2022 年 Series B 到 2025
              年 Series C 的融资推进很重要， 但主要证明市场对 Tailscale 的预期大幅上台阶。没有公开留存、利润率、烧钱速度或集中度数据，这轮融资更应该被看作一次雄心很高的价格发现事件，
              而不是干净的公允价值锚。
