      - number: '3.3'
        title: 定价、包装与分发力量
        blocks:
          - type: paragraph
            body: >-
              公开定价是 Tailscale 最清楚的差异化方式之一。Tailscale 披露免费增值入口、两个公开按用户计费层、定制企业包装，以及带标签和临时资源的单独定价概念。 NetBird 和 Duo
              也相对透明；Teleport 即使商业报价定制，也披露计费指标。相比之下，Cloudflare 的公开套餐页面更清楚地呈现包装哲学， 而不是可一一对比的访问定价；Zscaler 的公开定价页比 ZPA
              更宽；Prisma Access 要求买方联系专家； Cisco Secure Access 没有发布清晰的等效标价清单。这点重要，因为买方很少只按单一「每席价格」比较这些工具。Tailscale
              常以易购买的点解决方案落地；套件厂商通过把私有访问藏进更广泛的安全或网络合同守住侧翼；开源或自托管工具则在低端施压，让基础设施人力而不是标价成为主要成本变量。
              实践中，定价放大了架构里同样的模式：Tailscale 最容易试用和解释，但如果预算所有者优化的是整套套件整合，而不是首次部署速度，在位厂商仍能赢。
