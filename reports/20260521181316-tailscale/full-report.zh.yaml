  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: 竞争叙事压缩到少数杠杆时最强：Tailscale 究竟会成为平台赢家、点状方案赢家，还是被更大技术栈吸收的功能，取决于这些杠杆。
    data:
      items:
        - label: 上线速度优势
          value: High
          detail: 点对点网状网络加上身份驱动设置，仍是最清晰的产品优势。
          tone: positive
        - label: 相对套件的检查缺口
          value: Meaningful
          detail: Cloudflare、Zscaler、Palo Alto 和 Cisco 都打包了更广泛的 SWG/CASB/DLP 或类似控制。
          tone: risk
        - label: 自托管压力
          value: Rising
          detail: NetBird、Nebula、Teleport Community、ZeroTier 和内部自建限制了基础连接的定价权。
          tone: risk
        - label: 上探技术栈
          value: Active
          detail: Aperture 和 Border0 缩小 AI 治理与 PAM 缺口，但执行证据仍早。
          tone: warning
        - label: 分发缺口
          value: Material
          detail: 既有厂商仍掌握更多渠道触达、采购杠杆和合规驱动的成交路径。
          tone: risk
    approximationNotes: 这些 KPI 是基于保留证据集综合得出的判断，不是财务指标。
