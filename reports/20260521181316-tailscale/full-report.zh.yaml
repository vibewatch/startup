        blocks:
          - type: paragraph
            body: >-
              公开效率证据好于公开利润率证据。Tailscale 的安全和文档页面反复描述一个点对点数据平面：协调服务交换密钥和元数据，实际流量端到端加密， 只有直接连接失败时才回退到 DERP 中继。新的 peer
              relay 文档把这个逻辑推进一步，允许客户用自己的 tailnet 设备承载高吞吐中继流量；这在方向上支持一种比完全代理式访问产品更轻的集中带宽成本结构。客户故事也匹配低摩擦运营模型： Instacart
              称工程师每天在传统 VPN 工作流上损失最多 20 分钟，后来把支持工单从每周 10 张降到近乎为零； Positron 称 Tailscale
              为每个已引导试用的潜在客户节省约一小时，并帮助支撑先试后买的推理服务。最强数字 ROI 证据仍由公司赞助：Tailscale 2026 年 TEI 摘要基于委托 Forrester 模型，声称 213%
              ROI、不到六个月回本，并为一个 3,000 名员工的复合客户量化了基础设施和生产力节省。这个证据方向上有用，但不同于披露 CAC、回本周期、毛利率或留存数据。
