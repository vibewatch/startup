  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 公开客户证据集中在一条可复制路径：工程主导发现、低摩擦试用、策略加固，再扩展到更广工作流。
    data:
      nodes:
        - id: discover
          label: 发现 / 自助入口
          description: 工程师、IT 管理员或安全负责人因为个人用例、免费计划、创业公司激励或同行推荐发现 Tailscale。
        - id: pilot
          label: 小团队试点
          description: 团队常因旧 VPN 缓慢、割裂或难管理，先在一个环境快速搭起 tailnet。
        - id: validate
          label: 安全验证
          description: 团队用身份提供商集成、ACL、子网路由器和其他控制来证明系统能满足内部策略预期。
        - id: rollout
          label: 生产部署
          description: 开发者、支持人员、教职员工或远程员工接入生产访问工作流，而不必变成网络专家。
        - id: expand
          label: 工作流扩展
          description: 随着信任增加，客户加入 split DNS、CI/CD、Codespaces、现场设备支持或远程调试环境。
        - id: reference
          label: 背书 / 推荐
          description: 满意团队成为公开参考客户，再反过来强化下一轮工程主导发现。
    approximationNotes: 这些旅程阶段综合自公开案例研究和部署页面，不来自 Tailscale 披露的漏斗转化报告。
    claimRefs:
      - CU001
      - CU003
      - CU030
      - CU031
      - CU032
      - CU034
      - CU042
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: Tailscale 采用通常从技术上可信的试点开始；相邻工作流接入同一个 tailnet 后，再扩展为更广泛的业务标准。
    data:
      nodes:
        - id: n1
          label: 拥护者感到 VPN 痛点
          type: input
          detail: DevOps、IT 或安全负责人碰到多套 VPN、证书频繁轮换、糟糕用户体验或支持工单负担。
        - id: n2
          label: 快速创建 tailnet
          type: process
          detail: 第一个 tailnet 面向一个团队、办公室或工作流创建，几乎不需要网络重配置。
        - id: n3
          label: 核心资源接入
          type: process
          detail: 关键数据库、内部服务、校园系统、QA 设备或支持环境先接入。
        - id: n4
          label: 调优策略和路由
          type: process
          detail: SSO、ACL、子网路由器、split DNS 或远程管理控制叠加进来，以满足安全团队。
        - id: n5
          label: 相邻工作流接入
          type: process
          detail: 同一个 tailnet 开始承载 CI/CD、Codespaces、现场设备访问或共享调试环境。
        - id: n6
          label: 更广泛的公司标准
          type: output
          detail: Tailscale 成为更大用户群的默认访问层，最终出现在公开客户证据中。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 该流程是定性判断，来自具名案例研究里的重复模式，不来自已披露客户漏斗仪表盘。
    claimRefs:
      - CU013
      - CU017
      - CU025
      - CU030
      - CU031
      - CU032
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 公开证据集在生产确认和具名运营方上最强，但独立经济验证和留存可见性较弱。
    data:
      columns:
        - 生产已确认
        - 具体结果
        - 具名运营方引述
        - 客户域名佐证
        - 留存可见性
      rows:
        - label: Hugging Face
          values:
            - 是
            - 是 — 每月节省数十小时
            - 是
            - 是
            - 低 — 无续约或席位数据
        - label: Instacart
          values:
            - 是
            - 是 — 替换八套 VPN；试点 <1 天
            - 是
            - 是
            - 低 — 无扩张经济性
        - label: Mercury
          values:
            - 是
            - 部分 — 快速部署，并扩展到更广泛公司使用
            - 是
            - 是
            - 低 — 无合同数据
        - label: ACU
          values:
            - 是
            - 部分 — ERP 和校园访问改善
            - 是
