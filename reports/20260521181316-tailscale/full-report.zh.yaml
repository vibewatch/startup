      - number: '1.3'
        title: 牵引、里程碑与风险提示
        blocks:
          - type: paragraph
            body: >-
              最强公开牵引信号不是收入披露，而是客户采用。Tailscale 宣布 2025 年 1 月企业客户突破 10,000 家，十个月前为 5,000 家；公司和投资人都强调，到 2025 年 4 月 Series C
              结束时，这个数字又更高。具名引用强化了采用质量： 官方故事突出 Instacart、Hugging Face、Mercury 和 Cribl，融资报道指向 Perplexity、Mistral、
              Cohere、Groq、SAP、Telus、Duolingo 和 Motorola 等企业或 AI 用户。Series C 之后，里程碑节奏也加快。 2026 年 2 月，Tailscale 发布面向 AI
              治理的 Aperture；2026 年 3 月收购 Border0，把特权访问控制和会话可见性补到更靠近应用层的位置。
              主要反向提示不是公开诉讼或监管行动，而是安全平台自身带来的安全与服务可运营性暴露：Tailscale 发布详细安全公告，披露了两个值得注意的 2026
              年漏洞，并维护公开状态页和事故政策。公开员工数也不一致，2025 年 4 月报道同时引用 150 和 177 名员工，
              因此规模只能方向性看待，不能精确建模。这个组合对尽调重要：公司正试图成为连接和授权的更广义控制平面，同时仍背着安全软件固有的问责负担。 产品故事扩张得比财务披露更快，所以运营信任和执行质量仍比标题估值本身更重要。
