      "id": "architecture-security-and-operational-dependency-risk",
      "title": "Architecture, security, and operational dependency risk",
      "body": "The architecture still removes one class of risk while introducing another. Tailscale's security page is unusually explicit that it cannot inspect customer traffic and that existing peer-to-peer connectivity can survive a coordination-plane outage, which is good for privacy, cost structure, and resilience against centralized data-plane bottlenecks. But those same sources also make clear that onboarding, key exchange, policy distribution, admin changes, and some recovery paths still depend on the coordination service behaving correctly. DERP is only a fallback, yet the DERP documentation says heavy reliance on relays usually means poorer performance, and running custom DERP is an advanced, ongoing operational burden rather than an easy escape hatch. The disclosed security record also matters. The 2026 bulletins cover a web-interface ACL bypass and a macOS AlwaysOn helper bug, while older bulletins and NVD/CVE records show that SSH and Tailnet Lock edge cases have existed across different platforms and deployment modes. Independent outage trackers then add another reminder: the public incident history includes repeated coordination, admin-console, certificate, logging, billing, and Funnel degradations. None of that breaks the product thesis on its own, but it shows Tailscale is still a real software and operations company, not magic.",
