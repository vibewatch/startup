    {
      "id": "concentration-risks-and-gaps",
      "title": "Concentration risk, AI mix, and public-proof gaps still require diligence",
      "body": "Tailscale’s customer story carries three commercial risks. First, AI demand is clearly helping growth—independent coverage links the company to Mistral, Hugging Face, Perplexity, and Cohere—but the company does not disclose how much revenue or how many incremental customer adds come from AI startups versus the wider base. Second, the proof set is skewed toward tech-forward, engineering-led organizations; that is encouraging for product-market fit, but it may overstate adoption among slower-moving or procurement-heavy buyers. Third, public-sector proof is still thin. The named institutional evidence in this run is strongest in higher education, nonprofit infrastructure, and public-sector-adjacent aerospace rather than in disclosed government-agency deployments. That does not mean the company lacks public-sector traction, only that the public evidence base is not there yet. Combined with the absence of top-customer concentration data, the result is a chapter where production use is well demonstrated but customer-quality economics remain under-disclosed.",
