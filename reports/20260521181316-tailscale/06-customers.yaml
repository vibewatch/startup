    "number": 6,
    "title": "Customers",
    "summary": "By 2026-05-21 the public evidence points to a broad, engineering-led Tailscale customer base anchored by 10,000 paid business customers, hundreds of thousands of personal users, and named deployments spanning AI, commerce, security, fintech, institutions, field IoT, and developer infrastructure. The strongest adoption pattern is bottoms-up replacement of legacy VPN pain by DevOps, security, and IT teams, followed by expansion into SSO, ACLs, subnet routers, CI and CD, Codespaces, or edge-device workflows. What public sources still do not show is the conversion mix, retention cohorts, contract economics, or top-customer concentration that would prove customer-quality durability."
  },
  "sections": [
    {
      "id": "customer-base-and-entry-paths",
      "title": "Customer-base scale and the entry paths that feed it",
      "body": "Public evidence supports a broad but still partly opaque customer base. BetaKit says Tailscale crossed 10,000 paid business customers after doubling from 5,000 in ten months and still had hundreds of thousands of personal users, while the University of Waterloo separately reports 10,000-plus clients, 20% business-client growth since January, and more than 100% year-over-year revenue growth. Official pricing and program pages explain how the top of funnel can stay wide: there is a free Personal tier for up to six users, paid seat-based business tiers, an enterprise motion, and a startups program that gives selected companies a year of business-plan access. Combined with the bring-to-work page, this looks like a classic bottoms-up motion where engineers and small teams can adopt first and only later trigger broader company rollout. What public sources still do not reveal is the conversion mix from personal or startup use into durable paid team deployments.",
