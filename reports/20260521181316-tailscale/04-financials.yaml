    {
      "id": "capital-adequacy-and-financing-dependence",
      "title": "Capital adequacy, financing dependence, and hiring intensity",
      "body": "Capital formation is public; capital adequacy is only partially public. Tailscale’s 2022 Series B and 2025 Series C are well documented, with the latter raising $160 million at about a $1.45-1.5 billion valuation and taking cumulative disclosed funding to roughly $275 million. The official Series C post is notable less for the round size than for management posture: Tailscale said it already had a long runway and raised because opportunity was accelerating, especially around AI infrastructure, broader market expansion, free-support commitments, and platform durability. BetaKit went further, reporting management’s view that the company could become cash-flow positive without additional financing and later describing an efficient business model with long runway. Hiring evidence supports ongoing spend. The careers and Greenhouse pages still showed roughly two dozen open roles across engineering, security, product, support, marketing, procurement, and sales on 2026-05-21, and the Border0 acquisition added a PAM team and integration roadmap on top of organic hiring. What remains missing is the actual cash model. No retained public source disclosed cash on hand, monthly burn, runway months, debt facilities, or working-capital needs, so the underwrite depends on management credibility plus the equity cushion already raised rather than on a publishable cash bridge.",
