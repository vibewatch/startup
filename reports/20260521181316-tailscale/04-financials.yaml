    {
      "id": "adverse-lens-and-diligence-blockers",
      "title": "Adverse lens and underwriting blockers",
      "body": "The adverse financial lens is opacity more than visible distress. Official and media sources make pricing, customer logos, financing rounds, and growth rhetoric unusually legible for a private infrastructure company, but the core underwriting metrics remain private: there is no official ARR, revenue, gross margin, burn, runway, deferred revenue, NRR, or discount disclosure. Third-party databases try to fill the gap, but they introduce noise rather than certainty. GetLatka estimates roughly $45.2 million of 2025 revenue and about 250 employees, while BetaKit reported 150 employees immediately after the Series C; that is directionally consistent with growth, but not precise enough for financial modeling. The company also bears the trust burden of selling security infrastructure. Tailscale disclosed two notable 2026 security bulletins and maintains a public status and incident-disclosure posture, which is good governance but also a reminder that remediation, support, and reputation costs are part of the business model. The financial conclusion is therefore constrained but still usable: revenue quality likely benefits from recurring seats plus expansion usage, capital intensity appears software-like rather than asset-heavy, and financing dependence looks moderate, yet a serious investor would still need customer-cohort, realized-pricing, and cash-burn data before treating the current valuation as fully underwritten.",
