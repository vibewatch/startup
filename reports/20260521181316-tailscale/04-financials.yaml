      "id": "efficiency-proxies-and-cost-structure",
      "title": "Efficiency proxies and cost structure clues",
      "body": "Public efficiency evidence is better than public margin evidence. Tailscale’s security and documentation pages repeatedly describe a point-to-point data plane in which the coordination service exchanges keys and metadata, while actual traffic is encrypted end to end and only falls back to DERP relays when direct connectivity fails. The newer peer-relay documentation pushes that logic further by letting customers use their own tailnet devices for high-throughput relay traffic, which directionally supports a lighter centralized-bandwidth cost structure than a fully proxy-based access product. Customer stories line up with a low-friction operating model: Instacart said engineers were losing up to 20 minutes per day to legacy VPN workflows and later cut support tickets from 10 per week to nearly zero, while Positron said Tailscale saves roughly an hour per onboarded prospect and helps power a try-before-you-buy inference service. The strongest numeric ROI proof is still company-sponsored: Tailscale’s 2026 TEI summary, based on a commissioned Forrester model, claims 213% ROI, sub-six-month payback, and quantified infrastructure and productivity savings for a 3,000-employee composite customer. That is directionally useful, but it is not the same as disclosed CAC, payback, gross margin, or retention data.",
