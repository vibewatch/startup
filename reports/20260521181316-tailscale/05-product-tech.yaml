    {
      "id": "module-surface-and-platform-expansion",
      "title": "Module surface and platform expansion beyond the original business-VPN wedge",
      "body": "The module map shows a company steadily moving up-stack from secure connectivity into adjacent control surfaces. Tailscale SSH is the cleanest example: instead of distributing and revoking SSH keys manually, admins can rely on tailnet identity, check-mode reauthentication, and recording policies, with Tailscale intercepting tailnet-originated SSH on port 22. The Kubernetes Operator broadens the platform further by turning Tailscale identity into private Kubernetes API access, internal application publishing, and in-cluster connector resources for subnet routers, exit nodes, app connectors, and SSH recorder nodes. Subnet routers and exit nodes handle the classic bridge use cases that pure mesh networking cannot: extending access to unmanaged networks and forcing all traffic through a selected egress point when a workflow still needs full-tunnel behavior. Serve and Funnel then expose the application-sharing layer, with Serve staying private to the tailnet and Funnel using public relay infrastructure for internet-facing exposure. Device posture, flow logs, config audit logs, and Tailnet Lock add the controls enterprises expect around who can connect and how changes are traced. The 2026 expansion path is even broader. Aperture tries to make Tailscale the identity and control gateway for AI usage, while Border0 gives the company a route into more protocol-aware privileged access management. The opportunity is obvious: reuse the same identity and connectivity foundation across more security jobs. The risk is also obvious: the further Tailscale stretches away from connectivity and into AI governance or PAM, the more buyers will judge it against deeper incumbent suites rather than against legacy VPNs alone.",
