      "id": "how-the-network-actually-works",
      "title": "How the network actually works: WireGuard, coordination, NAT traversal, DERP, and policy",
      "body": "The technical core is a split between a cryptographic data plane and a managed coordination plane. Tailscale says device-to-device traffic is encrypted with WireGuard, while its coordination service exchanges public keys, peer information, and DERP maps so nodes can find each other. The product therefore tries to make a direct path first: devices authenticate, receive policy and peer metadata, attempt NAT traversal, and then talk point to point whenever the network allows it. DERP exists for the hard cases. The DERP docs are unusually explicit that relay servers mainly help negotiate connections and only carry encrypted WireGuard packets when direct paths and peer relays are unavailable. That architecture is the core reason Tailscale differentiates itself from traditional centralized VPNs: most user-plane traffic is not hairpinned through a vendor choke point, so latency and throughput can be better and there are fewer always-on bottlenecks. The control plane still matters, however. Tailscale documents that existing point-to-point connectivity can survive a coordination outage, but administrative changes, fresh peer discovery, and some relay optimizations still depend on control-plane correctness. Policy is similarly centralized even though traffic is usually not. The tailnet policy file holds ACLs, grants, device posture rules, SSH rules, auto-approvers, tags, and DERP-map customization, which makes access control auditable and programmable but also means policy mistakes or overly broad grants can have real blast radius.",
