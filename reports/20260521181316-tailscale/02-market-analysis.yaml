  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Tailscale's economically relevant market is narrower than the full SASE category but broader than legacy remote-access VPN: identity-first secure connectivity for employees, contractors, workloads, CI/CD pipelines, and AI infrastructure sold mostly to IT- and security-led teams through recurring user and resource subscriptions. Public sizing is contradictory by design\u2014narrow ZTNA estimates cluster around USD 2-3 billion in 2025-2026 while broader SASE estimates range from USD 2.8 billion to USD 19.19 billion in 2026\u2014so the right diligence frame is a layered TAM/SAM/SOM logic rather than one headline TAM. Demand tailwinds from hybrid work, multi-cloud complexity, AI-agent governance, and compliance pressure are real, but incumbent bundles, switching friction, latency, and scarce SASE talent can slow conversion and compress standalone vendor economics."
  },
  "sections": [
    {
      "id": "market-boundary-and-substitutes",
      "title": "Market Boundary, Included Spend, and Status-Quo Substitutes",
      "body": "Tailscale should not be sized as \u201call cybersecurity\u201d or even \u201call SASE.\u201d The company's own documentation places it in a narrower but still meaningful wedge: identity-first secure connectivity that replaces legacy VPN access, stretches into PAM and workload access, and now reaches AI infrastructure and agent governance. That means the included spend is remote and third-party application access, infrastructure access, user and workload identity enforcement, developer and CI/CD connectivity, and the policy layer that makes those flows usable at enterprise scale. The main excluded spend is broader web and email security, full CASB and DLP suites, and the entire SD-WAN or branch-networking stack unless those budgets are being reopened through a zero-trust project. The substitute set therefore matters as much as the headline category label. Traditional VPNs and self-managed WireGuard remain the status quo for many teams; ZeroTier and NetBird are software-first overlay alternatives; Teleport competes for PAM and workload-identity budgets; and AWS, Microsoft, Cloudflare, Cisco, Zscaler, and Palo Alto all package overlapping access controls inside broader suites. For diligence, the useful boundary is the spend tied to getting the right human, device, or workload to the right private resource with low operational friction\u2014not every dollar called SASE in analyst marketing.",
