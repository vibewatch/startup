  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Status / scale
      - Multiple / valuation status
      - Why relevant
      - Why not directly comparable
      - Read-through for Tailscale
    rows:
      - - Cloudflare
        - Public; about $75.16B market cap and $2.16B TTM revenue
        - ~34.8x market cap / revenue; Multiples.vc shows ~30.5x EV/LTM revenue
        - Shows what investors pay for fast-growing cloud infrastructure plus zero-trust adjacency.
        - Much broader edge, network, and SASE platform with public-company disclosure.
        - Useful upper guardrail only; not a clean plug-in multiple for Tailscale.
      - - Zscaler
        - Public; about $27.49B market cap and $3.00B TTM revenue
        - ~9.2x market cap / revenue; Multiples.vc shows ~8.3x EV/LTM revenue
        - Relevant zero-trust and secure-access benchmark with enterprise inspection depth.
        - Inspection-heavy platform and larger enterprise scale exceed Tailscale’s current scope.
        - Better lower-to-mid guardrail for disclosed access/security vendors.
      - - Palo Alto Networks
        - Public; about $205.11B market cap and $9.89B TTM revenue
        - ~20.7x market cap / revenue; Multiples.vc shows ~18.0x EV/LTM revenue
        - Shows what the market pays for a scaled security platform with durable ARR.
        - Far broader suite, multibillion-dollar ARR, and mature distribution engine.
        - Demonstrates how much scope and disclosure the market rewards at the high end.
      - - Cisco
        - Public; about $465.87B market cap and $59.05B TTM revenue
        - ~7.9x market cap / revenue
        - Useful floor-like reference for a broad but slower-growth incumbent.
        - Conglomerate scale, hardware mix, and channel power make it structurally different.
        - Shows how much lower broad-platform multiples can be when growth is slower.
      - - Finro public cyber average
        - Independent dataset across 28 public cyber companies
        - ~7.8x average revenue multiple
        - Good anchor for the public-market center of gravity.
        - Dataset is cross-sector and not specific to connectivity-first vendors.
        - Supports a conservative haircut rather than a top-decile premium assumption.
      - - Finro private and M&A benchmarks
        - Independent dataset across 161 private and 61 M&A comps
        - ~15.2x private and ~16.3x M&A average revenue multiples; cloud security averages ~21.7x
        - Shows that private and acquisition pricing can exceed public averages.
        - Benchmarks mix niches, stages, and deal motives.
        - Helps explain why Tailscale could clear a premium round while still looking rich versus public comps.
