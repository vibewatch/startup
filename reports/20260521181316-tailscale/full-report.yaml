      - number: '3.3'
        title: Pricing, Packaging, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Public pricing is one of the clearest ways Tailscale differentiates. Tailscale discloses a freemium entry
              point, two published per-user tiers, custom enterprise packaging, and separate pricing concepts for tagged
              and ephemeral resources. NetBird and Duo are also comparatively transparent, while Teleport discloses its
              billing metrics even when the commercial quote is custom. By contrast, Cloudflare’s public plan surface is
              clearer about packaging philosophy than exact apples-to-apples access pricing, Zscaler’s public pricing
              page is broader than ZPA, Prisma Access pushes buyers toward expert contact, and Cisco Secure Access does
              not publish a clean list-price equivalent. That matters because buyers rarely compare these tools on a
              single “price per seat” basis. Tailscale often lands as an easy-to-buy point solution; suite vendors
              defend their flank by hiding private access inside broader security or network contracts; and open-source
              or self-hosted tools pressure the bottom end by making infrastructure labor, not list price, the main cost
