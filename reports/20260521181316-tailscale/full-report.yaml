companyProfile:
  summary: >-
    Tailscale is a Toronto-incorporated, fully remote secure-networking company founded in 2019 by Avery Pennarun, David
    Carney, David Crawshaw, and Brad Fitzpatrick. The company built its reputation on WireGuard-based, identity-first
    mesh connectivity that is easier to deploy than traditional VPNs and better aligned with multi-cloud, developer, and
    remote-team workflows. Public traction signals are strong for a company of its age: more than 10,000 business
    customers by January 2025, named AI and enterprise users, and a $160 million Series C in April 2025 at roughly a
    $1.45 billion valuation. Product scope is broadening into privileged access management and AI-governance workflows,
    but underwriting remains limited by private-company opacity around ARR, margins, retention, and current cap-table
    detail.
