  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The April 2025 round reset the bar, but public economics still lag the narrative
        blocks:
          - type: paragraph
            body: >-
              Tailscale’s April 2025 Series C is easy to misread because the financing headline is stronger than the
              public economic disclosure behind it. Independent coverage lines up on the key headline facts: the company
              raised $160 million, reached roughly $1.45 billion post-money, crossed 10,000 paid business customers, and
              was still compounding customer adds and revenue growth quickly into spring 2025. That is real evidence of
              commercial pull. It is not the same thing as a fully underwriteable valuation. The same stories also say
              ARR was not disclosed, that the company was only directionally describing rapid growth, and that
              management framed the business as having enough runway to become profitable when needed. That combination
              usually means investors were paying for trajectory rather than reported financial quality. The financing
              progression from the 2022 Series B to the 2025 Series C therefore matters, but it matters mainly as proof
              that the market’s expectations for Tailscale stepped up sharply. Without public retention, margin, burn,
              or concentration data, the round should be treated as an ambitious price discovery event rather than a
              clean fair-value anchor.
            claimRefs:
