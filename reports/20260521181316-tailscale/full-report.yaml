  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Tailscale should not be sized as “all cybersecurity” or even “all SASE.” The company's own documentation
              places it in a narrower but still meaningful wedge: identity-first secure connectivity that replaces
              legacy VPN access, stretches into PAM and workload access, and now reaches AI infrastructure and agent
              governance. That means the included spend is remote and third-party application access, infrastructure
              access, user and workload identity enforcement, developer and CI/CD connectivity, and the policy layer
              that makes those flows usable at enterprise scale. The main excluded spend is broader web and email
              security, full CASB and DLP suites, and the entire SD-WAN or branch-networking stack unless those budgets
              are being reopened through a zero-trust project. The substitute set therefore matters as much as the
              headline category label. Traditional VPNs and self-managed WireGuard remain the status quo for many teams;
              ZeroTier and NetBird are software-first overlay alternatives; Teleport competes for PAM and
              workload-identity budgets; and AWS, Microsoft, Cloudflare, Cisco, Zscaler, and Palo Alto all package
              overlapping access controls inside broader suites. For diligence, the useful boundary is the spend tied to
              getting the right human, device, or workload to the right private resource with low operational
              friction—not every dollar called SASE in analyst marketing.
