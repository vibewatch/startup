  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The valuation view improves only if strong market pull and customer growth are matched by private proof on ARR,
      retention, and margins.
    data:
      nodes:
        - id: n1
          label: Product-market proof
          description: 10,000+ paid business customers and continued customer growth suggest strong market pull.
        - id: n2
          label: AI and enterprise demand
          description: AI names and larger enterprises appear to be pulling the roadmap and round narrative upward.
        - id: n3
          label: Premium 2025 round
          description: The $1.45B post-money round prices in continued strong execution.
        - id: n4
          label: Disclosure gap
          description: Public evidence still lacks exact ARR, margin, retention, concentration, and cap-table detail.
        - id: n5
          label: Broader public-comp ceiling
          description: Public peers with stronger disclosure and broader suites already define the premium band.
        - id: n6
          label: Research-more
          description: Invest only after private diligence proves Tailscale deserves to sit near or above the last round.
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n6
          label: supports upside only if quality holds
        - from: n4
          to: n6
          label: forces diligence
        - from: n5
          to: n6
          label: caps blind optimism
        - from: n3
          to: n5
          label: tests premium against public guardrails
        - from: n1
          to: n4
          label: traction alone is not enough
    approximationNotes: The flow is an analytical decision path rather than a statistical model.
    claimRefs:
