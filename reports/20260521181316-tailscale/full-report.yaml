  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competitive compression and boundary risk
        blocks:
          - type: paragraph
            body: >-
              Tailscale's strongest product virtue is also its core strategic risk: it is easiest to buy when the
              customer only wants secure connectivity, but that same focus leaves it exposed on both sides of the
              market. The published pricing page keeps the initial motion simple with free, standard, premium, and
              enterprise tiers, yet the product page also shows that the company is already stretching into tagged
              resources, ephemeral resources, PAM-adjacent features, and AI governance. That broadened surface can help
              average revenue per account, but it also moves Tailscale into the lanes where Cloudflare, Zscaler, Palo
              Alto Networks, and Cisco sell bigger budgets by bundling private access with DLP, SWG, CASB, browser
              isolation, AI controls, and broader policy consoles. Below that level, NetBird, ZeroTier, and Teleport
              keep proving that buyers can trade polish for self-hosting, open-source leverage, or narrower
              privileged-access specialization. The net result is not that Tailscale lacks differentiation; it is that
              differentiation is experiential and architectural rather than fully structural. If suite vendors get
              simpler or if open/self-hosted tools get easier, Tailscale can be compressed into a feature, a complement,
              or a procurement compromise instead of the whole platform purchase.
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
