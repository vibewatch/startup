  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Public customer proof clusters around a repeatable journey: engineering-led discovery, low-friction trial, policy
      hardening, and broader workflow expansion.
    data:
      nodes:
        - id: discover
          label: Discover / self-serve entry
          description: >-
            An engineer, IT admin, or security lead discovers Tailscale through a personal use case, free plan, startup
            incentive, or peer recommendation.
        - id: pilot
          label: Small-team pilot
          description: >-
            The team stands up a tailnet quickly in one environment, often because the old VPN is slow, fragmented, or
            hard to manage.
        - id: validate
          label: Security validation
          description: >-
            Identity provider integration, ACLs, subnet routers, and other controls are used to prove the system can
            meet internal policy expectations.
        - id: rollout
          label: Production rollout
          description: >-
            Developers, support staff, faculty, or remote employees are onboarded into production access workflows
            without forcing them to become network specialists.
        - id: expand
          label: Workflow expansion
          description: >-
            Customers add split DNS, CI/CD, Codespaces, field-device support, or remote-debug environments as trust
            grows.
        - id: reference
          label: Reference / advocacy
          description: Satisfied teams become public references, which then reinforces the next cycle of engineering-led discovery.
    approximationNotes: >-
