  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Tailscale layers identity, policy, coordination, and extensions above a mostly direct WireGuard data plane with
      relay fallbacks.
    data:
      layers:
        - id: l1
          label: Identity and admin layer
          detail: >-
            External IdP login, admin console, API, and plan entitlements decide who can join and who can administer the
            tailnet.
        - id: l2
          label: Policy and trust layer
          detail: >-
            The tailnet policy file, grants, ACLs, posture rules, auto-approvers, SSH rules, and Tailnet Lock define
            what is allowed and how keys are trusted.
        - id: l3
          label: Coordination layer
          detail: >-
            Tailscale's coordination service exchanges public keys, peer metadata, and DERP maps so nodes can discover
            one another.
        - id: l4
          label: Connectivity layer
          detail: >-
            WireGuard peers try direct NAT-traversed UDP first, then peer relays, then DERP as encrypted fallback when
            direct paths fail.
        - id: l5
          label: Access and routing extensions
          detail: >-
            SSH, Kubernetes proxying, subnet routers, exit nodes, Serve, Funnel, and app/workload connectors all reuse
            the same identity-aware network fabric.
        - id: l6
          label: Observability and expansion layer
          detail: >-
            Flow logs, config audit logs, Aperture, and Border0/PAM expansion sit above the connectivity substrate to
            add governance and audit depth.
    approximationNotes: null
    claimRefs:
