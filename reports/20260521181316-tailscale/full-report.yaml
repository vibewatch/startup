  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / footing
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Tailscale
        - Direct mesh / identity-first secure connectivity
        - Private growth-stage vendor; 2026 expansion into PAM and AI governance
        - Developers, IT, security, platform teams, multi-cloud and AI-heavy environments
        - Peer-to-peer mesh, fast rollout, simple UX, resource-aware pricing
        - Less breadth than full SSE/SASE suites for inline inspection and compliance-heavy controls
      - - Cloudflare One / Access
        - Incumbent unified SASE / ZTNA suite
        - Large public connectivity and security platform
        - Security and network teams standardizing on one control plane
        - Global network, unlimited connectors, device posture, SWG/CASB/DLP/FWaaS/RBI breadth
        - Heavier suite motion and less “just connect it” simplicity than Tailscale
      - - Zscaler Private Access
        - Incumbent zero-trust private-app platform
        - Large public security platform
        - Enterprises prioritizing private-app protection and inspection
        - Layer-7 proxy architecture, inline inspection, DLP, browser isolation
        - Public pricing is harder to normalize to Tailscale and architecture is more proxy-centric
      - - Prisma Access / Prisma SASE
        - Incumbent network-security suite
        - Large public security platform with installed NGFW base
        - Large enterprises already buying Palo Alto security and network controls
        - ZTNA plus SWG, CASB, cloud-native network security, connector leverage from existing NGFWs
        - Operationally broader and likely heavier than a focused connectivity rollout
      - - Cisco Secure Access / Duo
        - Incumbent identity plus network-access bundle
        - Large public networking vendor plus strong IAM/MFA channel
        - Enterprises already standardized on Cisco identity, network, or security contracts
        - Client and clientless access, VPNaaS extension, MFA/SSO, large channel reach
        - Product story is broader and less developer-network-native than Tailscale
      - - ZeroTier
        - Adjacent overlay networking alternative
        - Independent overlay-network vendor with public device-centric plan matrix
        - Teams wanting overlay networking without a full security suite
        - Simple virtual-LAN model and public plan matrix across many device counts
        - Identity, governance, and enterprise workflow depth are thinner than access-first security platforms
      - - NetBird
        - Direct open-source and self-hosted alternative
        - Open-source vendor with managed and self-hosted offers
        - Teams replacing VPN while wanting more control over hosting or IdP choices
        - WireGuard-based overlay, SSO/MFA, SCIM, audit logging, self-hosting
        - Still asks buyers to own more deployment detail than Tailscale SaaS
      - - Nebula
        - Open-source status-quo / internal-build substitute
        - Open-source project with managed option outside the repo
        - Expert infrastructure teams comfortable operating PKI and lighthouses
        - Peer-to-peer design, firewall-style rules, hole punching, performance focus
        - High operational burden and less turnkey identity/admin experience
      - - Teleport
        - Adjacent privileged-access and workload-access tool
        - Commercial platform with community edition and self-hosted deployment
        - Infrastructure-security teams prioritizing audited access to servers, Kubernetes, databases, and workloads
        - Short-lived certificates, audit trails, session recording, self-hosted and cloud modes
        - Narrower fit for general mesh connectivity and usually a different budget owner
      - - Traditional VPN / internal build
        - Status quo and substitute
        - Already deployed installed base or internal labor
        - Organizations solving a narrow access problem without buying new platform software
        - Low visible incremental spend and familiar process
        - Bottlenecks, weaker identity posture, more manual operations, and poorer developer ergonomics
    notes: >-
      Profile rows summarize evidence-backed competitive footing rather than a normalized market-share ranking; “scale /
      footing” intentionally mixes public-company heft, open-source posture, and venture-stage maturity because exact
      funding is not public for every row.
