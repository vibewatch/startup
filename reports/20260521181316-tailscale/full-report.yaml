          - type: paragraph
            body: >-
              Named customer proof is much stronger on use case and operator quotes than on contract economics. The
              current public sample spans AI and open source (Hugging Face), digital commerce and marketplace buyers
              (Instacart, Mercari), security, telemetry, and compliance vendors (Cribl, Vanta, Netcraft), fintech and
              regulated buyers (Mercury, VersaBank), institutional and nonprofit users (Abilene Christian University,
              Linux Foundation), public-sector-adjacent aerospace operations (Loft Orbital), field and IoT support (DEEL
              Media), and developer infrastructure teams (Yugabyte). In nearly every case the documented job-to-be-done
              is concrete: replace VPN sprawl, cut remote troubleshooting friction, simplify zero-trust controls, or
              support distributed engineering and support staff across cloud, on-prem, and field devices. The limit is
              proof quality. Most evidence comes from Tailscale-published case studies paired with customer
              self-descriptions, not filings, procurement records, or third-party deployment audits. That is enough to
              show real production use across several buyer types, but not enough to size spend, renewal behavior, or
              procurement durability.
