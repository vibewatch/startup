      - CE030
      - CE031
      - CE039
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      A typical Tailscale workflow authenticates identity first, distributes policy and keys, then prefers a direct path
      before invoking feature-specific access layers.
    data:
      nodes:
        - id: w1
          label: Authenticate user or device
          type: input
          detail: A user signs in through an external identity provider or a tagged device joins the tailnet.
        - id: w2
          label: Join the tailnet
          type: process
          detail: The device receives a tailnet identity, private Tailscale IP, and applicable policy state.
        - id: w3
          label: Exchange keys and peer metadata
          type: process
          detail: The coordination service shares public keys, peer details, and DERP map information.
        - id: w4
          label: Attempt direct path
          type: decision
          detail: >-
            Clients try to establish an encrypted WireGuard path across NAT and firewalls without manual port
            forwarding.
        - id: w5
          label: Fallback if needed
          type: process
          detail: If direct reachability fails, traffic can use a peer relay first and DERP only as last encrypted resort.
        - id: w6
          label: Apply feature-specific controls
          type: process
          detail: >-
            SSH, Kubernetes, subnet routing, exit nodes, Serve/Funnel, posture, logs, or Aperture add workflow-specific
            behavior.
        - id: w7
          label: Observe and audit
          type: output
          detail: Admins review logs, audit trails, and policy outcomes while end users keep using the service.
      edges:
        - from: w1
          to: w2
        - from: w2
          to: w3
        - from: w3
          to: w4
        - from: w4
          to: w5
        - from: w5
          to: w6
        - from: w6
          to: w7
    approximationNotes: null
    claimRefs:
      - CE002
      - CE005
      - CE008
      - CE011
      - CE021
      - CE031
