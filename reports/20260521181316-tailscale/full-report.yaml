      - number: '2.2'
        title: 'Sizing Lenses: Narrow ZTNA, Broad SASE, and Tailscale-Relevant SAM'
        blocks:
          - type: paragraph
            body: >-
              The most important market-sizing fact is that public estimates disagree materially, and they disagree for
              understandable reasons. Narrow ZTNA sources point to a market in the low single-digit billions today:
              Grand View places 2025 ZTNA at USD 1.97 billion and ORDR's 2026 compilation places ZTNA at USD 2.95
              billion. Broad SASE estimates are much larger, but they are not even internally consistent:
              MarketsandMarkets says USD 19.19 billion in 2026, Mordor says USD 15.54 billion in 2026, and Global Market
              Insights says USD 2.8 billion in 2026. That spread is not noise to be averaged away; it is the evidence
              that market definition drives valuation narratives. For Tailscale, the practical sizing move is to use
              multiple lenses. The broadest TAM is the reopened zero-trust and SASE budget where buyers reconsider VPNs,
              access, and network-security architecture. The more direct SAM is the portion spent on replacing legacy
              VPN or bastion workflows for employees, contractors, and workloads, especially where teams want
              identity-native controls without buying a full security suite. The most evidence-constrained SOM lens is
              monetization: Tailscale charges per user and separately meters certain resources and ephemeral workloads,
              so deployed seats and resource minutes matter more than a single, sweeping “share of SASE” statement.
              Legacy AWS VPN pricing also shows why this can be a budget line, not just a technical preference.
