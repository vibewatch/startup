        title: Exhibits
        blocks:
          - type: callout
            title: Moat pressure comes from both directions
            body: >-
              The market does not force Tailscale to beat only one rival class. It must stay simpler than full SSE
              suites while staying more valuable than self-hosted or open alternatives that can undercut it on control
              or price.
