      - number: '8.3'
        title: The base case is close to the last round, but only if private diligence fills in the missing quality metrics
        blocks:
          - type: paragraph
            body: >-
              The resulting investment view is neither a bearish dismissal nor a green light to pay up. The strongest
              thesis is that Tailscale has already proved something rare: genuine product-market fit in a painful
              category, visible AI and enterprise pull, and a business model management claims can be made profitable
              without emergency fundraising. The anti-thesis is that this proof arrives through selective narrative
              disclosure rather than auditable operating data. A conservative base case therefore lands near the last
              round only if management can privately prove stronger ARR, gross margin, retention, and account quality
              than public evidence shows. The bull case requires not just continued customer growth but broadening
              scope, durable expansion inside larger accounts, and enough economic quality to deserve a premium to
              average public cyber multiples. The bear case is simpler: if growth quality is thinner than the story, or
              if AI enthusiasm and private-market scarcity were doing most of the pricing work in 2025, then the round
              can look stretched quickly. On that basis the right public-evidence recommendation is research-more with
              medium confidence, a high risk rating, and a stretched valuation stance.
