    type: dag
    layout: wide
    summary: >-
      Tailscale's strongest benefits come from direct WireGuard connectivity, but they still depend on external
      identity, managed coordination, public-network reachability, and feature-specific extensions.
    data:
      nodes:
        - id: d1
          label: External identity provider
          detail: SSO and MFA posture depend on the customer's chosen IdP and its availability.
        - id: d2
          label: Tailscale coordination service
          detail: Distributes public keys, peer metadata, and DERP maps and backs admin changes.
        - id: d3
          label: Public internet and NAT conditions
          detail: Direct reachability depends on real-world firewall and NAT behavior outside Tailscale's direct control.
        - id: d4
          label: WireGuard-capable endpoints
          detail: Client correctness and version hygiene matter because encryption and policy enforcement sit on endpoints.
        - id: d5
          label: Peer relay-capable tailnet nodes
          detail: Customer-provisioned relay nodes can reduce DERP dependence for difficult paths.
        - id: d6
          label: DERP relay network
          detail: Managed relay regions absorb hard-NAT traffic when direct or peer-relay paths fail.
        - id: d7
          label: Feature-specific services
          detail: >-
            SSH, Kubernetes, exit nodes, Serve/Funnel, Aperture, and Border0-backed PAM add differentiated workflows on
            top.
