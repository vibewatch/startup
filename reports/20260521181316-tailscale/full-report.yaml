  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The value case is most sensitive to nonpublic economic proof, not to the already-visible market story.
    data:
      items:
        - label: ARR proof
          value: 5
          detail: Exact ARR is the single most important missing valuation input.
        - label: Margin and burn quality
          value: 5
          detail: Capital efficiency decides whether premium pricing is deserved or dangerous.
        - label: Retention / expansion
          value: 5
          detail: Premium software valuations need durable land-and-expand evidence.
        - label: Customer concentration
          value: 4
          detail: AI and larger-enterprise momentum could still hide concentration risk.
        - label: Platform-breadth execution
          value: 4
          detail: Scope expansion must improve wallet share without destroying simplicity.
        - label: Public-market multiple climate
          value: 3
          detail: Sector appetite matters, but company-quality proof matters more.
    approximationNotes: >-
      Bars score relative valuation sensitivity on a 1-5 scale from an investor perspective rather than a measured
      elasticity.
