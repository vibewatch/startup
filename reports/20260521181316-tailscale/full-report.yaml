      - number: '1.3'
        title: Traction, milestones, and risk notes
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signal is customer adoption rather than revenue disclosure. Tailscale
              announced that it crossed 10,000 business customers in January 2025 after being at 5,000 ten months
              earlier, and both the company and investors emphasize that the count was higher again by the time the
              April 2025 Series C closed. Named references reinforce quality of adoption: official stories highlight
              Instacart, Hugging Face, Mercury, and Cribl, while financing coverage points to Perplexity, Mistral,
              Cohere, Groq, SAP, Telus, Duolingo, and Motorola as enterprise or AI users. Milestone cadence also
              accelerated after the Series C. In February 2026 Tailscale launched Aperture for AI governance, and in
              March 2026 it acquired Border0 to add privileged-access controls and session visibility closer to the
              application layer. The main adverse note is not a public lawsuit or regulator action, but security and
              service-operability exposure that comes with being a security platform itself: Tailscale publishes
              detailed security bulletins, disclosed two notable 2026 vulnerabilities, and maintains a public status
              page and incident policy. Public headcount is also inconsistent, with April 2025 reporting citing both 150
              and 177 employees, so scale should be treated directionally rather than precisely. That combination
              matters for diligence because it shows a company trying to become a broader control plane for connectivity
              and authorization, while still carrying the accountability burden that comes with security software. The
              product story is broadening faster than the financial-disclosure story, so operational trust and execution
              quality still matter more than headline valuation alone.
