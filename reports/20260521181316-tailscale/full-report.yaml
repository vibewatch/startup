      - number: '7.4'
        title: Governance, legal, and financing risk
        blocks:
          - type: paragraph
            body: >-
              The remaining risk cluster is less about whether Tailscale can sell software and more about how much a new
              investor can really underwrite from public evidence. The 2025 Series C clearly reset expectations: the
              company raised $160 million and independent coverage put the post-money value near $1.45 billion USD,
              which means future investors are buying into a premium-growth narrative rather than a hidden bargain. Yet
              the company still withholds current ARR, margin, retention, and customer-concentration data, and even
              public employee counts vary across reputable articles. The official About page doubles down on a fully
              remote, small-team operating model and still centers Avery Pennarun heavily in both technical identity and
              external storytelling. That can be a strength, but it also raises key-person and execution-bench risk as
              the company adds enterprise sales, global coverage, and a broader product map. Legally, Tailscale's terms,
              privacy policy, DPA, and DORA addendum show a fairly mature contracting stack, but they also push
              substantial compliance fit onto the customer, rely on cross-border processing and subprocessors, and
              reserve special audit, exit, and incident-response mechanics for regulated buyers. The absence of a strong
              public litigation or enforcement record in retained direct sources is better treated as an open diligence
              item than as proof of no risk.
