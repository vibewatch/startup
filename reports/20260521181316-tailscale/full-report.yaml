      - number: '3.4'
        title: Durability, Displacement Risk, and the Real Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The strongest bull case for Tailscale is that secure connectivity is often purchased before a buyer is
              ready to buy a whole SASE program. That is why the company keeps winning on simplicity, direct
              performance, and developer affinity: the product starts from the operational pain that teams feel first.
              The problem is that those same strengths are easiest to commoditize. NetBird, Nebula, ZeroTier, Teleport
              Community Edition, and plain internal build all show that secure overlay networking can be recreated with
              more labor or less polish. At the high end, Cloudflare, Zscaler, Palo Alto, and Cisco show the opposite
              risk: private access can be absorbed into a larger inspection-and-compliance suite, making Tailscale look
              like a great feature rather than the whole platform. Tailscale’s 2026 moves into Aperture and
              Border0-backed PAM narrow some of that gap, but they also raise the standard the company must meet around
              policy depth, auditability, approvals, and enterprise controls. The clean diligence conclusion is not that
              Tailscale lacks differentiation. It clearly has one. The conclusion is that its moat is executional and
              experiential more than structural: faster rollout, better product love, and better performance on the
              connectivity job can win, but only if the company keeps moving up-market faster than suites can simplify
              and faster than open-source alternatives can mimic the basics.
