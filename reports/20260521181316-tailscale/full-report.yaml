      - number: '6.4'
        title: Durability, expansion, and satisfaction are visible qualitatively but not numerically
        blocks:
          - type: paragraph
            body: >-
              Retention and expansion evidence is clearly the weakest part of the public customer story. The good news
              is that the qualitative signals are real: Cribl, Mercury, and Loft Orbital describe wider rollout as their
              headcount and operating complexity increased, and review sites still emphasize ease of use, fast setup,
              and lower support burden. The review signal is not perfect. PeerSpot complaints mention multiple-account
              login problems on Mac and friction when moving between tailnets, while Trustpilot includes at least one
              complaint that the documentation lacks detail. Even so, the negative signal is about usability edges
              rather than mass deployment failure. The missing data are the ones investors need to underwrite
              durability: NRR, GRR, churn, average contract length, renewal rates, and segment-level expansion curves.
              Public case studies show that accounts can land in one workflow and expand into routing, identity, CI/CD,
              or edge support, but they do not show how often that happens or how much revenue expansion it creates.
