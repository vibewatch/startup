  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      The highest residual risks are not pure technology failures; they are the strategic squeeze from suites above,
      disclosure opacity, and the coordination needed to scale beyond the original VPN-replacement wedge.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Suite-vendor compression
          values:
            - label: high
              tone: risk
              detail: Cloudflare, Zscaler, Palo Alto, and Cisco all sell broader SSE platforms.
            - label: high
              tone: risk
              detail: Can cap wallet share or relegate Tailscale to a feature/complement.
            - label: medium
              tone: warning
              detail: Tailscale answers with simplicity and product love, not equal breadth.
            - label: high
              tone: risk
              detail: Remains the most strategic long-term risk.
        - label: Open/self-hosted alternatives
          values:
            - label: medium
              tone: warning
              detail: NetBird, ZeroTier, and Teleport keep alternatives visible.
            - label: medium
              tone: warning
              detail: Mainly pressures lower-end or specialist use cases.
            - label: medium
              tone: warning
              detail: Tailscale still wins on managed simplicity.
            - label: medium
              tone: warning
              detail: Moat is executional, not absolute.
        - label: Coordination / DERP dependence
          values:
            - label: medium
              tone: warning
              detail: Admin and difficult-path traffic still depend on managed systems.
            - label: high
              tone: risk
              detail: Operational issues can hit login, API, Funnel, and policy changes quickly.
            - label: medium
              tone: warning
              detail: Tailnet Lock, peer-to-peer design, and relay failover help but do not erase dependence.
            - label: high
              tone: risk
              detail: A core operational risk for enterprise trust.
        - label: Security / patch execution
          values:
            - label: medium
              tone: warning
              detail: Bulletins show recurring but fixable client-surface issues.
            - label: high
              tone: risk
              detail: Privileged access and route-control bugs can be material for sensitive deployments.
            - label: medium
              tone: warning
              detail: Disclosure quality is good; fleet hygiene is outside Tailscale's full control.
            - label: medium
              tone: warning
              detail: Residual risk is manageable but persistent.
        - label: Customer-quality opacity
          values:
            - label: high
              tone: risk
              detail: Conversion, retention, and concentration are not publicly disclosed.
            - label: high
              tone: risk
              detail: Makes valuation discipline harder.
            - label: low
              tone: risk
              detail: No public mitigation beyond management commentary and selected customer stories.
            - label: high
              tone: risk
              detail: One of the biggest investor-specific risks.
        - label: Governance / scope-execution risk
          values:
            - label: medium
              tone: warning
              detail: Fully remote small teams and founder-led storytelling can scale well or stretch thin.
            - label: medium
              tone: warning
              detail: Could slow enterprise readiness or integration quality.
            - label: medium
              tone: warning
              detail: Fresh capital and new operators help, but evidence is still early.
            - label: medium
              tone: warning
              detail: Meaningful, but secondary to competition and opacity.
    approximationNotes: >-
      The heatmap is a synthesis lens built from direct public evidence rather than a statistical loss model. Labels
      rank residual exposure from an investor perspective on 2026-05-21.
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR026
      - CR035
      - CR037
      - CR047
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Tailscale's main risks transmit into valuation through a small set of channels: enterprise win rate, retention
      quality, support cost, and belief in the company's ability to scale without becoming a heavier suite.
    data:
      nodes:
        - id: n1
          label: Suite-vendor compression
          detail: Broader SSE vendors can reduce win rate or wallet share.
        - id: n2
          label: AI/customer concentration opacity
          detail: Public evidence shows AI demand but not revenue mix or concentration.
        - id: n3
          label: Coordination / outage risk
          detail: Reliability incidents can weaken trust in admin and access workflows.
        - id: n4
          label: Feature-creep execution
          detail: PAM and AI governance expansion can raise support and delivery burden.
        - id: n5
          label: Enterprise win rate
          detail: How often larger deals close without heavy discounting or complementary stack requirements.
        - id: n6
          label: Retention / expansion quality
          detail: Whether landed accounts renew and broaden usage at attractive economics.
        - id: n7
          label: Support and operating cost
          detail: Complexity or incidents can raise service and engineering load.
        - id: n8
          label: Valuation support
          detail: Private-market premium remains justified only if growth quality proves durable.
      edges:
        - from: n1
          to: n5
          label: pressures closes
        - from: n1
          to: n8
          label: compresses moat
        - from: n2
          to: n6
          label: obscures quality
        - from: n2
          to: n8
          label: raises discount
        - from: n3
          to: n7
          label: raises incident load
        - from: n3
          to: n6
          label: can hurt trust
        - from: n4
          to: n7
          label: adds delivery cost
        - from: n4
          to: n5
          label: slows enterprise motion
        - from: n5
          to: n8
          label: supports growth narrative
        - from: n6
          to: n8
          label: supports durability narrative
        - from: n7
          to: n8
          label: pressures efficiency
    approximationNotes: >-
      The map shows causal transmission paths rather than quantified elasticity. It is intended to clarify which
      observable events most quickly change valuation confidence.
    claimRefs:
      - CR002
      - CR013
      - CR026
      - CR029
      - CR032
      - CR036
      - CR037
      - CR046
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      The most important dependencies sit outside the encrypted data plane: identity, coordination, relay conditions,
      compliance partners, and the still-emerging privileged-access expansion stack.
    data:
      nodes:
        - id: d1
          label: Customer identity provider
          detail: Auth and MFA come from the buyer's existing IdP.
        - id: d2
          label: Tailscale coordination service
          detail: Distributes keys, policy, and node admission state.
        - id: d3
          label: Public internet / NAT conditions
          detail: Direct connectivity depends on real-world path conditions.
        - id: d4
          label: DERP relay network
          detail: Fallback path when direct or peer-relay connectivity fails.
        - id: d5
          label: Customer compliance and security teams
          detail: Must decide whether Tailscale fits regulatory and inspection requirements.
        - id: d6
          label: Subprocessors / service locations
          detail: Support the legal and data-processing stack behind the service.
        - id: d7
          label: Border0 / PAM integration path
          detail: Adds new workflows for privileged access but is still being integrated.
        - id: d8
          label: Tailscale account economics
          detail: Seats, tagged resources, ephemeral minutes, and enterprise pricing.
      edges:
        - from: d1
          to: d2
          label: auth context
        - from: d2
          to: d4
          label: relay map
        - from: d3
          to: d4
          label: fallback need
        - from: d2
          to: d5
          label: shared-responsibility review
        - from: d6
          to: d5
          label: privacy / location review
        - from: d7
          to: d8
          label: new monetization surface
        - from: d2
          to: d8
          label: core product value
        - from: d5
          to: d8
          label: procurement fit
    approximationNotes: >-
      This dependency map intentionally excludes every internal microservice. It focuses on the external systems or
      architectural dependencies most likely to alter customer trust, procurement friction, or economic value.
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR008
      - CR015
