        title: Pricing model, revenue shape, and traction signals
        blocks:
          - type: paragraph
            body: >-
              Tailscale’s public monetization surface is clearer than its financial statements. The pricing page shows a
              recurring SaaS structure with a free personal tier, paid Standard and Premium seat licenses, and a custom
              enterprise tier, but it adds a second monetization axis through tagged resources and ephemeral-resource
              minutes. That matters because revenue is not only a pure user-seat story; workloads, CI/CD runners, exit
              nodes, and other non-human resources can drive paid usage too. The company’s own retrospective on passing
              5,000 paying customers describes an explicitly bottoms-up self-service motion that later expanded into
              enterprise deployments, including one customer that moved from 100 seats to 1,000 and then 10,000-plus
              seats. Public traction disclosures reinforce that pattern: BetaKit reported 10,000 paid business clients
              by January 2025 and another 20% customer increase after that, while Tailscale’s field posts claim more
              than 30,000 companies use the product overall. The read-through is favorable on demand and expansion
              mechanics, but still constrained on realized economics. Enterprise pricing is custom, discounts are
              undisclosed, and official sources do not publish ARR or GAAP revenue, so the list-price surface is best
              treated as monetization architecture rather than proof of revenue quality.
