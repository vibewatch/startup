      - number: '8.4'
        title: Entry discipline depends on what private diligence reveals about concentration, retention, and the cap table
        blocks:
          - type: paragraph
            body: >-
              The final judgment is therefore about discipline, not admiration. Tailscale appears to be a strong
              company; the question is whether a new investor can still get paid at or above the April 2025 price. The
              answer depends on a short list of private facts that public evidence cannot answer. First, investors need
              an ARR bridge and a clean view of gross margin, burn, and cash efficiency to know whether the valuation is
              rich but reasonable or simply rich. Second, they need retention and concentration data, especially because
              public coverage emphasizes AI demand and larger enterprise adoption without quantifying how dependent the
              business is on either. Third, they need the cap-table mechanics that determine whether future rounds or
              exits will actually deliver venture returns from this entry point. Those diligence asks are not
              housekeeping. They are the difference between calling the round roughly fair and calling it too
              aggressive. Until those gaps close, the right posture is to track the company closely, avoid hero
              assumptions, and treat downside triggers as highly actionable rather than theoretical.
            claimRefs:
              - CV059
