  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Why the Shortlist Splits by Buyer Type
        blocks:
          - type: paragraph
            body: >-
              Tailscale is not really fighting one monolithic competitor set. The shortlist fractures by the buyer’s
              first problem. If the job is “replace legacy VPN friction fast without redesigning the whole security
              stack,” Tailscale, NetBird, ZeroTier, and to a lesser extent Nebula are the natural comparison set because
              they all promise overlay connectivity with lighter operational overhead than traditional VPN estates. If
              the job is “standardize private access inside a larger security transformation,” Cloudflare One, Zscaler
              Private Access, Prisma Access, and Cisco Secure Access move to the front because those platforms package
              ZTNA with broader traffic inspection, SaaS controls, browser isolation, firewalling, and enterprise
              distribution. Teleport overlaps when the evaluation starts from privileged infrastructure access rather
              than employee network connectivity. The strategic twist is that Tailscale is no longer only a business-VPN
              replacement: its pricing now spans tagged and ephemeral resources, its enterprise pitch centers on
              identity, policy, and automation, and 2026 news shows it expanding into AI governance and more complete
              PAM. That broadens upside, but it also drags Tailscale into more direct competition with suite vendors
              that can trade breadth, channel power, and procurement bundling against Tailscale’s simplicity narrative.
