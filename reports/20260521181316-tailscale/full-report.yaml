            title: Tailnet Lock is a meaningful mitigation, not a free pass
            body: >-
              Tailnet Lock materially reduces blind trust in the coordination plane, but it is optional, operationally
              nontrivial, and has already had historical edge-case failures. Investors should treat it as a strong
              control for disciplined customers, not a universal risk eraser.
            calloutType: insight
