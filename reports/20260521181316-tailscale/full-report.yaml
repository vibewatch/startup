      - number: '3.2'
        title: Architecture, Delivery Model, and Control-Plane Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The core architectural divide is whether secure access is primarily a direct overlay problem or a
              proxy-and-inspection problem. Tailscale’s own comparison material still leans hardest on the first view:
              centrally coordinated but peer-to-peer connectivity reduces bottlenecks, keeps latency low, and maps well
              to developer, infrastructure, and multi-cloud workloads. Cloudflare, Zscaler, Prisma Access, and Cisco
              instead emphasize managed connectors, clients, and cloud enforcement points because they are selling
              inspection, posture, and policy convergence in addition to reachability. That produces a materially
              different buyer experience. The suite vendors can credibly claim deeper inline controls, browser
              isolation, DLP, secure-web-gateway enforcement, and more formal private-app protection, but they also
              insert more platform, more policy surface, and often more architectural dependency on the vendor’s cloud
              edge. The second divide is self-hosting and open source. NetBird explicitly supports self-hosted
              deployment with reverse-proxy and IdP choices, Nebula requires teams to manage PKI and lighthouses, and
              Teleport offers a community edition plus self-hosted deployment patterns oriented around certificate
              authority, proxy, and audit services. Those alternatives matter because they show Tailscale’s clean
              managed experience is a strength, not an unchallengeable technical monopoly.
