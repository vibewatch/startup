  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Why the thesis works
      - Why the anti-thesis still matters
      - View update trigger
    rows:
      - - Product-market fit
        - 10,000+ paid business customers and continued customer growth show real demand.
        - Adoption proof is stronger than monetization proof.
        - Retention, expansion, and contract-size disclosure.
      - - Business model
        - Seat-based pricing plus resource concepts suggest more monetization room than a simple VPN replacement.
        - Complex pricing does not prove willingness to pay at enterprise scale.
        - Cohort data on paid-seat growth and resource attach.
      - - Capital efficiency narrative
        - Management says the company had runway and could become profitable when needed.
        - Narrative efficiency is not the same as disclosed gross margin or burn quality.
        - Actual burn multiple, gross margin, and cash balance.
      - - AI and enterprise pull
        - AI names and larger enterprises appear to be pulling the roadmap upward.
        - AI enthusiasm can over-inflate private valuations and hide concentration risk.
        - Revenue share, NRR, and concentration by AI cohort.
      - - Public comp ceiling
        - Cloud and zero-trust peers prove the market will pay premium multiples for security assets.
        - Those same peers are broader, more disclosed, and often more profitable than Tailscale.
        - Proof Tailscale deserves a premium niche multiple rather than an average public one.
      - - Exit optionality
        - Management frames the company as independent with a likely IPO path.
        - IPO language is aspirational until disclosure quality and public-company readiness improve.
        - Audit readiness, governance depth, and sustained public-scale metrics.
    notes: >-
      Each row juxtaposes the strongest public bull signal against the most material public counterpoint; it is
      intentionally balanced rather than persuasive.
