      - number: '8.2'
        title: Public comps are useful guardrails, but they mostly show why the top-end multiple is dangerous
        blocks:
          - type: paragraph
            body: >-
              The conservative way to use public comps is as a guardrail rather than a direct plug-in formula.
              Cloudflare, Zscaler, Palo Alto Networks, and Cisco all provide useful valuation reference points, but each
              is broader than Tailscale in important ways. Cloudflare mixes network, edge, and SASE breadth; Zscaler is
              built around large-scale inspection and zero-trust exchange architecture; Palo Alto sells an AI-powered
              security platform with multibillion-dollar next-generation ARR; Cisco brings giant scale, channel reach,
              and broad infrastructure economics. Even so, the public set is still useful because it shows the valuation
              band investors are already willing to pay for security assets with visible revenue and disclosure cadence.
              Using public market-cap and revenue signals, the selected band spans roughly 8x to 35x revenue, while
              Multiples.vc and Finro both point to a much lower average for public cybersecurity companies than for
              private financings or headline M&A. That means Tailscale cannot automatically borrow Cloudflare-like or
              cloud-security-premium multiples just because it has AI customers and strong user love. If the only
              visible ARR estimate is even directionally right, the April 2025 round already leans toward the rich end
              of what public comps can support.
