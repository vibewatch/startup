  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and the customer jobs Tailscale actually serves
        blocks:
          - type: paragraph
            body: >-
              Tailscale's public product surface starts from a simpler promise than most legacy VPN or SSE stacks:
              connect the right user, device, or workload to the right resource with identity and encryption first, then
              add routing or governance features only where needed. The docs define the core unit as a tailnet, a
              private network of users, devices, and resources, and the product page stretches that same model across
              remote workforce access, multi-cloud and on-prem infrastructure, CI/CD runners, edge devices, and AI
              workloads. That framing matters because it explains why Tailscale can look like several products at once.
              In one deployment it is a direct replacement for a centralized remote-access VPN; in another it is secure
              SSH and Kubernetes access; in another it is a private service-sharing layer or a gateway for AI model
              access. The current commercial packaging reinforces that breadth: the pricing page now treats peer
              connectivity, subnet routers, exit nodes, SSH, Kubernetes, Funnel, device posture, logging, and Aperture
              as parts of one platform rather than disconnected add-ons. The bullish read is that the company keeps
              expanding the number of jobs it can solve without abandoning the same identity-first networking core. The
              more skeptical read is that it is still fundamentally a connectivity platform, so buyers wanting full
              inline traffic inspection, DLP, or browser-isolation controls still need complementary tooling.
