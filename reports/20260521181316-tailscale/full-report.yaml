  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Why it matters
      - Action implication
      - Monitoring path
    rows:
      - - ARR reality check fails
        - Private ARR is materially below ~$60M or growth has already rolled over.
        - The 2025 round starts to look rich versus public comp bands.
        - Do not underwrite at or above the last round.
        - Request monthly ARR bridge and cohort growth.
      - - Margin and burn are weak
        - Gross margin or burn profile implies low software leverage.
        - Premium valuation becomes harder to defend against public peers.
        - Demand price protection or pass.
        - Review audited gross margin, burn multiple, and cash runway.
      - - Customer concentration is high
        - Top customers or AI cohort contribute an outsized share of ARR.
        - Narrative strength could unwind quickly if one cohort cools.
        - Increase discount rate or avoid entry.
        - Obtain top-10 customer and sector concentration table.
      - - Retention is merely ordinary
        - NRR or GRR does not show strong land-and-expand behavior.
        - The company may deserve only average public cyber multiples.
        - Reset base case lower.
        - Request NRR, GRR, logo churn, and expansion bridges.
      - - Platform expansion stalls
        - Enterprise and adjacency roadmap broadens cost without improving wallet share.
        - Tailscale risks staying a beloved but narrower access tool.
        - Lower terminal multiple assumptions.
        - Track attach rates for enterprise features and new product modules.
    notes: >-
      Thresholds are estimated diligence triggers rather than public facts. They are intentionally simple because the
      public evidence set does not include the company data needed for tighter calibration.
    claimRefs:
      - CV047
      - CV049
      - CV051
      - CV057
      - CV058
      - CV059
      - CV060
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Likely owner
      - Decision use
    rows:
      - - ARR bridge
        - Monthly ARR and net-new ARR bridge from 2024 through 2026.
        - Shows whether the 2025 valuation multiple is rich-but-earned or simply rich.
        - CFO / finance
        - Rebuild comp and scenario ranges.
      - - Gross margin and burn
        - GAAP or management gross margin, burn multiple, and cash runway schedule.
        - Separates efficient software growth from expensive growth.
        - CFO / finance
        - Validate base-case multiple and downside floor.
      - - Retention quality
        - NRR, GRR, logo churn, and cohort expansion by segment.
        - Determines whether customer quality supports premium valuation.
        - Revenue operations
        - Confirm or reject bull-case expansion logic.
      - - Customer concentration
        - Top-10 customer, AI-customer, and enterprise mix by ARR.
        - Tests whether the AI and enterprise story is diversified or fragile.
        - Finance / sales leadership
        - Adjust downside probability and discount.
      - - Cap table and terms
        - Preference stack, liquidation rights, option pool, and secondary history.
        - Entry returns depend on actual distribution mechanics, not headline valuation alone.
        - Finance / legal
        - Model real dilution and exit proceeds.
      - - Public-company readiness
        - Audit status, board build-out, and IPO-readiness milestones.
        - IPO path claims matter only if governance and reporting can support them.
        - CEO / legal / board
        - Assess exit optionality and timing realism.
    notes: >-
      These are the minimum diligence asks needed to convert this chapter from a public-evidence judgment into an
      investable underwriting memo.
    claimRefs:
