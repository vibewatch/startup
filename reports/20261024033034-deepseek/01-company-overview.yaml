company:
  name: DeepSeek
chapter:
  number: 1
  title: Company Overview
  summary: >-
    DeepSeek is a Hangzhou-based private AI lab associated with High-Flyer, whose open-weight models and low reported training costs drove rapid global attention. The evidence supports a technically influential but opaque company profile: Liang Wenfeng remains the identifiable founder-leader, while audited financials, customer concentration, and formal governance are not publicly established in the assigned sources.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      DeepSeek is described by independent reporting and company-profile coverage as a Chinese AI company and research lab headquartered in Hangzhou. Its product surface combines a free chatbot, developer API access, and open-weight large language models, with R1 positioned as a reasoning model and later model families continuing the open-weight strategy. The strongest evidence distinguishes the model license from the service: the models are described as MIT-licensed or open-weight, while the chatbot and API are commercial delivery channels. That combination gives developers a self-hosting option and gives DeepSeek distribution beyond a single hosted application. The evidence is less conclusive on the legal incorporation date because the assigned sources report both a 2023 incorporation/spin-out narrative and older High-Flyer roots. I therefore treat 2023 as the operating-company milestone and 2015 as the associated founder/parent origin, rather than collapsing them into one founding date.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, control, and governance
    body: >-
      Liang Wenfeng is the only consistently identified senior leader in the assigned evidence. BBC reporting describes him as DeepSeek's founder and links him to High-Flyer, while profile coverage describes the lab as closely associated with the hedge fund he co-founded. CNBC reporting on the 2026 external round also describes investors being told not to poach DeepSeek personnel, which makes retention and founder-led control material diligence considerations. No assigned source establishes a complete board, executive bench, or formal governance chart. That absence is not evidence that governance is deficient, but it limits confidence in succession planning, independent oversight, and key-person resilience. The company therefore appears founder-centered and High-Flyer-linked, with governance depth still requiring primary documentation.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-scale-and-disclosure
    title: Capital, scale, and disclosure
    body: >-
      The refresh evidence indicates a major change from the prior self-funded narrative: CNBC reported that DeepSeek closed a first external round valuing the lab above $50 billion in June 2026, while TechCrunch reported in July that the company was seeking approximately $1.5 billion at about a $71 billion valuation. These are reported or proposed transaction figures, not audited valuation marks or cash available to the company. Other assigned profiles publish materially different funding and valuation numbers, and one profile gives an employee count of 422 without a primary filing. The Information source is retained as a net-new lead for reported revenue, but its fetched text does not expose enough underlying article detail to treat the preview as audited financial evidence. Revenue, ARR, gross margin, customer count, and cash runway therefore remain gaps.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-risk-boundaries
    title: Milestones and material risk boundaries
    body: >-
      DeepSeek's visible trajectory runs from High-Flyer-linked research through the R1 release and subsequent financing interest. BBC reporting links R1's low reported training cost and app adoption to the company's global breakthrough, while technical analysis attributes the cost narrative to mixture-of-experts architecture, compression, and caching. The same evidence shows that technical influence does not remove operating and policy risk: CNBC reports a U.S. ban on DeepSeek-related technology in federal civilian agency systems, citing potential sensitive-data transfers and cybersecurity vulnerabilities. Leadership retention pressure, export-control exposure, and service outages or attacks should consequently be tracked alongside model releases. The company has meaningful milestone evidence, but public disclosure remains insufficient for a complete operating KPI baseline.
    claimRefs: [CO003, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Technical differentiation with broad distribution
    body: Open-weight releases, reported low training cost, and a free consumer surface gave DeepSeek both developer reach and strategic visibility.
    claimRefs: [CO002, CO003, CO014]
  - calloutType: risk
    title: Governance and financial opacity
    body: The assigned evidence does not establish audited financials, a complete leadership or board roster, customer concentration, or a reconciled capitalization history.
    claimRefs: [CO008, CO012, CO013]
