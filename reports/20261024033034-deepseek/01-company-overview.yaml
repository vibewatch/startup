  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Audited revenue, ARR, gross margin, active customer count, retention, and cash runway.
      whyItMatters: These metrics determine whether model attention and reported financing translate into durable commercial economics.
      diligencePath: Request audited financial statements, management accounts, customer concentration, cohort retention, and cash-flow schedules under confidentiality.
      relatedQuestionRefs: [QO004, QO008]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: material
      topic: funding
      missingEvidence: Definitive financing documents reconciling the reported June round, proposed July round, investors, proceeds, and post-money valuation.
      whyItMatters: Reported valuation and funding figures differ materially and cannot be treated as interchangeable or as cash available.
      diligencePath: Obtain signed term sheets, cap table extracts, closing notices, and investor confirmations for each financing.
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO003]
    - type: enumeration-incomplete
      severity: material
      topic: governance
      missingEvidence: Complete current leadership, board, ownership, and succession disclosures.
      whyItMatters: Founder dependence and control rights affect execution resilience and investor protections.
      diligencePath: Request the current organizational chart, board minutes or roster, beneficial ownership schedule, and key-person provisions.
      relatedQuestionRefs: [QO002, QO006]
      relatedTableRefs: [TO002]
    - type: missing-source
      severity: material
      topic: customers
      missingEvidence: Primary customer, usage, and service-reliability evidence.
      whyItMatters: Public popularity and token share do not establish paying customers, retention, service levels, or concentration.
      diligencePath: Obtain anonymized customer cohorts, API usage and revenue bridges, uptime reports, and representative customer references.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001]
