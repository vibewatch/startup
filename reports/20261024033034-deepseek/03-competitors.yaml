    title: Competitor profile table
    columns: [Competitor, Category, Scale or distribution signal, Differentiation, Limitation or diligence gap]
    rows:
      - [DeepSeek, Direct open-weight peer, "125M app downloads reported for Feb 2025", "MIT weights; low API prices; self-hosting", "Trust, federal procurement, retention and audited economics remain unclear"]
      - [OpenAI, Direct proprietary frontier peer, "Hosted API and app distribution", "General-purpose and multimodal breadth", "No self-hosted weights; comparable current economics require workload testing"]
      - [Anthropic, Direct proprietary frontier peer, "Enterprise-oriented hosted model route", "Safety and agentic-workflow positioning", "Public comparison here lacks comparable price and retention evidence"]
      - [Google, Direct proprietary frontier peer, "Cloud and assistant ecosystem", "Distribution and infrastructure scale", "Public comparison here lacks comparable current product economics"]
      - [Meta, Adjacent distribution incumbent, "1B monthly active users reported in May 2025", "Embedded WhatsApp, Instagram, Facebook, and Messenger distribution", "Consumer assistant backend and API economics are not fully disclosed"]
      - [xAI, Direct/adjacent frontier peer, "32M MAU reported for Feb 2025", "Live X data and coding-tool integrations", "Closed weights and higher cited token prices"]
    notes: >-
      Signals are publisher-reported and use different dates and denominators; they are
      not a comparable market-share ranking. Missing fields indicate no comparable
      evidence in the assigned pool.
    claimRefs: [CP001, CP003, CP006, CP008, CP009]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, DeepSeek, OpenAI or Anthropic, Meta, xAI, Evidence boundary]
    rows:
      - [Open-weight self-hosting, "Yes; MIT license", "No; hosted/proprietary in cited comparison", "Llama weights are open but assistant layer is separate", "No; proprietary", "License and product-layer distinctions are material"]
      - [API price signal, "$0.435/$0.87 V4 Pro; $0.14/$0.28 V4 Flash", "Not comparable in assigned source", "Hosted API retired July 2026 in cited comparison", "$2/$6 in cited comparison", "List prices, not realized unit economics"]
      - [Long context, "1M tokens reported", "About 1.05M tokens reported for GPT-5.6", "Raw Llama limits differ from assistant limit", "500K confirmed for Grok 4.5; current flagship not established", "Model and product limits must not be conflated"]
      - [Live information, "No equivalent live X integration cited", "Not established in assigned pool", "No equivalent live X integration cited", "Native X data and search", "Feature presence is not quality or reliability proof"]
      - [Federal access, "Barred from federal civilian IT systems and covered derived services", "Not subject to cited order", "Not subject to cited order", "Not subject to cited order", "Procurement status is not a benchmark result"]
      - [Data-control route, "Hosted API or self-hosted weights", "Hosted API/app in cited comparison", "Hosted assistant plus open model alternatives", "Hosted API/app", "Self-hosting shifts cost and responsibility to buyer"]
    notes: >-
      The matrix separates source-backed facts from unknowns and does not infer unsupported
      capability scores. Price rows are published list-price snapshots and may change.
    claimRefs: [CP006, CP007, CP008, CP009, CP010, CP011]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider or model, Input price per 1M tokens, Output price per 1M tokens, Packaging, Buyer implication]
    rows:
      - [DeepSeek V4 Pro, 0.435, 0.87, "Free chat; API; MIT self-hosting", "Strong cost and control option where risk controls are acceptable"]
      - [DeepSeek V4 Flash, 0.14, 0.28, "Lower-cost API tier; open-weight route", "Best fit for high-volume workloads subject to quality testing"]
      - [Grok, 2.0, 6.0, "Subscription plus API; proprietary", "Pays for live-data and ecosystem access rather than lowest token cost"]
      - [Meta AI, null, null, "Free assistant embedded in Meta apps", "Distribution is the advantage; comparable consumer API price is unavailable"]
      - [GPT-5.6, "1 to 5", "6 to 30", "Hosted proprietary tiers", "Broader multimodal route with materially higher cited price range"]
      - [Claude Opus 4.8, 5.0, 25.0, "Hosted proprietary model", "Cited as a higher-cost quality comparator; workload proof still required"]
    notes: >-
      Values are cited comparison snapshots, not a normalized total-cost-of-ownership
      model. Null means no comparable per-token price was reported in the assigned source.
    claimRefs: [CP006, CP007, CP009]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: DeepSeek is positioned as high on deployment control and price advantage, while peers differentiate through distribution, live data, or enterprise posture.
    data:
      xAxis: Deployment control (ordinal 1 = hosted only, 5 = self-hostable)
      yAxis: Buyer reach or enterprise access (ordinal 1 = narrow, 5 = broad)
      points:
        - {label: DeepSeek, x: 5, y: 3, note: "MIT weights and self-hosting; federal access constrained"}
        - {label: OpenAI, x: 1, y: 4, note: "Hosted proprietary route; broad product reach"}
        - {label: Anthropic, x: 1, y: 3, note: "Hosted proprietary route; enterprise positioning"}
        - {label: Google, x: 2, y: 5, note: "Cloud and assistant ecosystem"}
        - {label: Meta, x: 3, y: 5, note: "Open Llama weights plus embedded assistant distribution"}
        - {label: xAI, x: 1, y: 3, note: "Hosted proprietary route; X distribution and live data"}
    approximationNotes: >-
      Ordinal coordinates are analytical synthesis of the cited licensing, distribution,
      pricing, and procurement evidence; they are not a measured market-share or capability
      score and should not be read as a ranking.
    claimRefs: [CP001, CP006, CP008, CP010, CP011]
callouts:
  - calloutType: strength
    title: A real price-and-control wedge
    body: DeepSeek combines open weights with cited API prices below Grok and other frontier comparators, creating a credible option for buyers willing to own deployment and evaluation.
    claimRefs: [CP006, CP007]
  - calloutType: risk
    title: Trust can override technical economics
    body: The October 2026 federal exclusion covers DeepSeek-derived third-party services, showing that model lineage and jurisdiction can outweigh price in regulated procurement.
    claimRefs: [CP009, CP010]
  - calloutType: insight
    title: Openness is not a complete moat
    body: Chinese peers have narrowed the gap, so durable differentiation depends on repeatable workload quality, serving economics, and enterprise trust rather than release novelty alone.
    claimRefs: [CP003, CP012, CP014]
