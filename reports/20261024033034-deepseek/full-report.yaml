chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              DeepSeek is described by independent reporting and company-profile coverage as a Chinese AI company and
              research lab headquartered in Hangzhou. Its product surface combines a free chatbot, developer API access,
              and open-weight large language models, with R1 positioned as a reasoning model and later model families
              continuing the open-weight strategy. The strongest evidence distinguishes the model license from the
              service: the models are described as MIT-licensed or open-weight, while the chatbot and API are commercial
              delivery channels. That combination gives developers a self-hosting option and gives DeepSeek distribution
              beyond a single hosted application. The evidence is less conclusive on the legal incorporation date
              because the assigned sources report both a 2023 incorporation/spin-out narrative and older High-Flyer
              roots. I therefore treat 2023 as the operating-company milestone and 2015 as the associated founder/parent
              origin, rather than collapsing them into one founding date.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: Leadership, control, and governance
        blocks:
          - type: paragraph
            body: >-
              Liang Wenfeng is the only consistently identified senior leader in the assigned evidence. BBC reporting
              describes him as DeepSeek's founder and links him to High-Flyer, while profile coverage describes the lab
              as closely associated with the hedge fund he co-founded. CNBC reporting on the 2026 external round also
              describes investors being told not to poach DeepSeek personnel, which makes retention and founder-led
              control material diligence considerations. No assigned source establishes a complete board, executive
              bench, or formal governance chart. That absence is not evidence that governance is deficient, but it
              limits confidence in succession planning, independent oversight, and key-person resilience. The company
              therefore appears founder-centered and High-Flyer-linked, with governance depth still requiring primary
              documentation.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
