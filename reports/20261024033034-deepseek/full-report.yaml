      - number: '1.3'
        title: Capital, scale, and disclosure
        blocks:
          - type: paragraph
            body: >-
              The refresh evidence indicates a major change from the prior self-funded narrative: CNBC reported that
              DeepSeek closed a first external round valuing the lab above $50 billion in June 2026, while TechCrunch
              reported in July that the company was seeking approximately $1.5 billion at about a $71 billion valuation.
              These are reported or proposed transaction figures, not audited valuation marks or cash available to the
              company. Other assigned profiles publish materially different funding and valuation numbers, and one
              profile gives an employee count of 422 without a primary filing. The Information source is retained as a
              net-new lead for reported revenue, but its fetched text does not expose enough underlying article detail
              to treat the preview as audited financial evidence. Revenue, ARR, gross margin, customer count, and cash
              runway therefore remain gaps.
