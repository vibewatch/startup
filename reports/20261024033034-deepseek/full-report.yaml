              - CE006
              - CE008
              - CE011
              - CE012
      - number: '5.2'
        title: Architecture, efficiency, and deployment
        blocks:
          - type: paragraph
            body: >
              The strongest technical evidence is the DeepSeek-V3 technical report, which specifies a
              671B-total-parameter mixture-of-experts model with 37B parameters activated per token, 14.8 trillion
              pre-training tokens, MLA and DeepSeekMoE architectures, auxiliary-loss-free load balancing, multi-token
              prediction, and 2.788 million H800 GPU hours for the full training run. IBM's technical explainer provides
              the mechanism: routing only selected experts reduces computation, while the full model still creates a
              memory bottleneck. NVIDIA's deployment account shows the trade-off in production: the full R1 model can
              run as a NIM microservice on an eight-H200 system, with reported throughput up to 3,872 tokens per second.
              This is a credible efficiency story, not a claim that frontier serving is lightweight.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE006
              - CE009
              - CE013
      - number: '5.3'
        title: Trust, security, and implementation risk
        blocks:
          - type: paragraph
            body: >
              Open weights improve inspectability and portability, but they also transfer more control and
              responsibility to deployers. Stanford HAI faculty describe the open technical paper and weights as
              valuable for reproducibility while calling DeepSeek opaque on privacy protection, data sourcing, and
              copyright. The CSIS analysis raises separate concerns about weak safeguards and jailbreak exposure, while
              CIO reports that the October 2026 DHS order covers federal procurement, removal, and third-party
              implementations and cites data-sovereignty and security concerns. Those sources do not prove that every
              deployment is compromised; they do establish that enterprise adoption requires model provenance,
              data-flow, permission, monitoring, and fallback controls. The public record also lacks a complete
              independent security-assurance package, incident history, and reproducible end-to-end training pipeline.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Product and technology verdict
        blocks:
          - type: paragraph
            body: >
              DeepSeek's product advantage is a combination of capable open-weight models, unusually visible research
              artifacts, and engineering choices that lower active compute relative to total capacity. The architecture
              is differentiated enough to matter, but not self-sufficient: memory, multi-GPU networking, inference
              operations, data governance, and safety controls remain part of the buyer's problem. Official materials
              show continuing releases and a developer-facing surface, while independent technical and policy sources
              show why deployment maturity should not be inferred from benchmark performance or open licensing. The
              underwriting conclusion is therefore selective: DeepSeek is technically credible for experimentation and
              controlled self-hosting, but production use in sensitive workflows depends on verification of data
              handling, model integrity, security testing, service continuity, and the exact dependency chain behind any
              third-party product.
            claimRefs:
              - CE006
              - CE009
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              DeepSeek serves at least three distinct customer surfaces rather than one homogeneous customer base.
              Consumers use a free web and mobile chatbot; developers and businesses can call usage-priced APIs; and
              technical teams can download or self-host open-weight models. The available evidence supports broad user
              interest and developer accessibility, but it does not disclose a verified split between free users, paid
              API accounts, enterprise contracts, or self-hosted production deployments. That distinction matters
              because downloads and model followers measure reach, not recurring revenue or durable usage. The segment
              with the clearest conversion potential is high-volume technical work where low inference prices, local
              deployment, or model customization can offset integration and governance costs. The enterprise segment is
              more constrained: public-sector restrictions and privacy questions can block procurement even where model
              capability is attractive.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and evidence quality
        blocks:
          - type: paragraph
            body: >-
              Public usage indicators show a sharp launch-driven adoption event, followed by an incomplete commercial
              picture. Sensor Tower estimated more than 23 million global mobile downloads in DeepSeek's first 19 days
              and a more than 700% week-over-week increase in average mobile daily active users during the measured
              January 2025 window. AppFigures separately estimated more than one million downloads across the App Store
              and Google Play at an earlier point. These measures are useful for distribution and awareness, but they
              are not active-user cohorts, paid accounts, retention, or revenue. The later refresh pool contains a June
              2026 user-ranking page, yet the fetched evidence does not provide a comparable current denominator or a
              verified retention series. Investors should therefore treat adoption as high-reach but low-visibility on
              durability and monetization.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU009
              - CU011
              - CU014
      - number: '6.3'
        title: Named customer proof and deployment quality
        blocks:
          - type: paragraph
            body: >-
              The evidence identifies user populations and access channels more reliably than named commercial
              customers. DeepSeek's public chatbot and API are available to consumers, developers, and businesses, while
              open-weight models can be downloaded and deployed by third parties. That is evidence of product
              availability and ecosystem reach, not proof that a named enterprise has deployed the product in production
              or achieved an outcome. The assigned sources do not supply three independently verified customer case
              studies with named buyers, production status, measurable outcomes, and contract context. A disciplined
              underwriting view is to separate public distribution from customer proof: the former is confirmed, while
              the latter remains a material diligence gap. A customer reference list, anonymized account cohort, and
              deployment telemetry would materially improve confidence.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
      - number: '6.4'
        title: Retention, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              No retained source reports NRR, GRR, churn, renewal rates, contract length, cohort retention, or customer
              concentration. The open-weight model and free-chatbot strategy can expand the top of the funnel while
              allowing users to switch among models or self-host, so reach should not be converted into retention
              without account-level evidence. Expansion may occur through API usage, local deployment, or enterprise
              workflow integration, but the sources do not quantify conversion between those surfaces. Conversely,
              regulatory and security restrictions can reduce enterprise expansion: CNBC reports a U.S. federal
              civilian-agency ban that also covers third-party products and services built using DeepSeek technology,
              while other reporting documents restrictions tied to sensitive-data and privacy concerns. The immediate
              diligence priority is a segmented cohort bridge from download or registration to active use, paid usage,
              renewal, and expansion, with customer and geography concentration disclosed.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is demonstrably broad
            body: >-
              Sensor Tower's early-period estimates show more than 23 million global downloads and more than 700%
              week-over-week DAU growth, while the open-weight strategy expands access beyond the hosted chatbot.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU009
          - type: callout
            title: Adoption is not retention
            body: >-
              No retained source discloses paid-account count, active-user cohorts, churn, renewal, NRR, GRR, or
              customer concentration.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
          - type: callout
            title: Require a segmented customer bridge
            body: >-
              Before underwriting commercial durability, request cohorts by geography and product surface from download
              or registration through active use, paid API usage, renewal, expansion, and concentration.
            calloutType: recommendation
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              DeepSeek faces a widening policy perimeter in which model access, data handling, and downstream deployment
              are treated as national-security or privacy questions rather than ordinary software procurement. The
              October 2026 DHS action reportedly requires federal civilian agencies to remove covered DeepSeek products
              and prohibits both direct acquisition and third-party offerings developed using DeepSeek implementations,
              extending exposure beyond the branded application (CR001, CR002, CR003). The reported rationale includes
              possible sensitive-data transfer to China, intelligence value, and embedded vulnerabilities, but the same
              reporting notes that implementation details and a specific compliance deadline were not yet published
              (CR002, CR003). This creates a moving compliance surface for enterprise customers and integrators. The
              risk is high because an exclusion can remove a channel even when model quality and price remain
              competitive; the monitoring trigger is a final rule, agency implementation guidance, or expansion to
              commercial critical infrastructure. DeepSeek's own terms say service availability may vary by jurisdiction
              and that the company may modify, suspend, or terminate services as laws and regulations change (CR006).
              The diligence path is to obtain the DHS docket, map affected jurisdictions and indirect model
              dependencies, and test whether customer contracts allocate data residency, indemnity, and continuity
              obligations.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR023
      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              The product combines meaningful technical efficiency with unresolved safety and reliability questions. IBM
              describes DeepSeek-V3 as a 671-billion-parameter mixture-of-experts model with 37 billion active
              parameters, while also noting that mixture-of-experts systems retain a large memory footprint and are
              harder to train and fine-tune (CR007, CR008). That architecture can support lower inference cost, but it
              leaves compute, memory, and operational complexity as material constraints. IBM also reports that
              DeepSeek-R1 has performed poorly in security and jailbreaking tests, an adverse signal for enterprise
              deployment even though the article does not provide a standardized scorecard (CR009). The terms promise
              industry-practice cyber-security measures and stable operation, but expressly provide no warranty that the
              services will remain available in particular jurisdictions (CR010, CR011). A prior cyberattack disrupted
              service and led to restricted new-user registration according to the maintained public chronology (CR012).
              Residual exposure is therefore medium-high: open weights can enable local deployment, but customers must
              own evaluation, patching, abuse monitoring, fallback routing, and model provenance. Kill criteria should
              include a material incident without timely disclosure, repeated availability failures, or an evaluation
              showing unacceptable harmful-output or data-exfiltration rates in the intended workload.
            claimRefs:
              - CR007
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR009
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR009
              - CR012
              - CR015
              - CR023
      - number: '7.3'
        title: Partner, financial, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              DeepSeek's model economics are attractive but do not establish durable margins or sufficient capital.
              Gartner forecasts worldwide end-user spending on AI models and platforms at $64.252 billion in 2026, while
              explicitly warning that providers face pressure to demonstrate sustained use and durable margins as usage
              becomes more cost-driven (CR013, CR014). Vercel's anonymized AI Gateway data shows DeepSeek's token share
              rising to 17% in May 2026 while its spend share stayed near 1%, and reports a 49% token share but only 4%
              cost share in coding-agent traffic (CR015, CR016). Those figures indicate usage traction and severe price
              capture pressure, not revenue or cash generation. A separate report describes a proposed first external
              round of at least $300 million at a valuation above $10 billion, but the article says the company had not
              confirmed an official timeline and declined requests for comment (CR017, CR018). CNBC later reported that
              DeepSeek reportedly closed a first external round valuing it above $50 billion, while stating it could not
              independently verify the underlying no-poaching report (CR019, CR020). The conflicting financing signals
              make capital structure, ownership, and available cash a diligence gap. Talent concentration is also
              material: CNBC reported that the company sought funding after losing key researchers and that a reported
              investor condition barred poaching staff or encouraging spinouts (CR021, CR022). Monitor disclosed
              financing documents, retention of named technical leaders, GPU availability and utilization, price
              changes, and customer-level gross margin; a failed next financing, sustained senior-researcher attrition,
              or inability to secure compliant compute would break the operating thesis.
            claimRefs:
              - CR015
              - CR016
              - CR020
              - CR022
          - type: table
            tableRef: TR003
            claimRefs:
              - CR015
              - CR020
              - CR022
      - number: '7.4'
        title: Residual exposure and decision triggers
        blocks:
          - type: paragraph
            body: >-
              The highest-priority diligence is not another benchmark comparison; it is proof that DeepSeek can convert
              open-weight adoption into compliant, dependable, and financeable production usage. Stanford's policy brief
              says commercial strategies for translating adoption into business success are emerging but long-term
              viability remains uncertain, and it cautions that government support is not guaranteed (CR023, CR024). The
              appropriate mitigation is a deployment-control package: customer-specific data residency and logging,
              independent safety evaluation, incident response, model and dependency inventories, multi-provider
              failover, and evidence of renewal or paid usage by segment. A risk can be downgraded only when the company
              provides auditable answers, not when a model leaderboard improves. Key thesis-break triggers are a binding
              expansion of public-sector exclusions, a confirmed material privacy or security incident, a sustained gap
              between token volume and monetization, inability to retain core researchers, or a capital event that
              materially changes control or financing terms. Until those tests are passed, the investment implication is
              to underwrite technical capability separately from commercial durability and to treat any valuation as
              exposed to policy and execution discounts.
            claimRefs:
              - CR023
              - CR025
              - CR026
              - CR027
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              The October 2026 federal exclusion is a direct commercial and distribution risk, and its extension to
              third-party implementations means an integrator can lose access even when the underlying model remains
              technically competitive.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Financing uncertainty
            body: >-
              Reported financing terms are not reconciled: one retained report described a proposed $300 million round
              above a $10 billion valuation, while later reporting described a valuation above $50 billion and disclosed
              that part of the underlying report was not independently verified.
            calloutType: assumption
            claimRefs:
              - CR020
              - CR022
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on a differentiated combination of open-weight distribution, efficient model
              architecture, and a usage-priced API that can convert ecosystem adoption into revenue. Sacra estimates
              $1.00B of annualized revenue in September 2026 and reports a 50%+ gross margin on model sales by July,
              with 82.9% API gross margin during the first seven months; these are analyst estimates, not audited
              company disclosures. The countercase is equally material: IBM notes that mixture-of- experts reduces
              compute but not memory costs, while CNBC reports a U.S. federal civilian-agency ban that includes
              third-party products built with DeepSeek models. The result is strategic reach with uncertain direct value
              capture and a meaningful discount for regulatory, security, and disclosure risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing evidence is inconsistent across the refresh pool and should not be collapsed into one
              precise valuation. Sacra reports a roughly RMB350.88 billion ($51.82 billion) post-money valuation from a
              June 2026 external round and says a second round was being sought at roughly $75 billion; an April 2026
              report instead described advanced discussions for at least $300 million above $10 billion. The difference
              may reflect separate financing stages, stale reporting, or source error, so the current price is a
              blocking diligence question rather than a settled fact. Publicly available evidence also does not disclose
              liquidation preferences, option dilution, debt, or a cap table sufficient to translate headline valuation
              into common-equity value. Entry discipline therefore requires verified term sheets and audited revenue
              definitions before assigning a buy price.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV015
      - number: '8.3'
        title: Scenarios and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point estimate because the evidence supports directional
              drivers but not a complete forecast. The bull case assumes API demand converts into durable, high-margin
              usage while open-weight distribution expands enterprise and sovereign deployments. The base case assumes
              technical leadership remains valuable but direct monetization is constrained by self-hosting, substitutes,
              and geopolitical limits. The bear case assumes valuation compression as government exclusions, security
              scrutiny, or capital constraints reduce addressable demand. Public comparables are imperfect: TechNode
              reports MiniMax at more than $11.5 billion after its Hong Kong debut, with a $512 million net loss in the
              first three quarters of 2025, while StepFun reporting describes a nearly $2.5 billion financing round and
              an intended Hong Kong listing. These are market context, not directly comparable operating multiples for
              DeepSeek.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV015
      - number: '8.4'
        title: Decision, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The appropriate decision is track/research-more, not buy, because valuation support is less reliable than
              the product signal. A price-sensitive upgrade requires three confirmations: audited revenue separating
              recognized revenue from annualized run rate, financing documents that establish ownership and preference
              economics, and evidence that enterprise customers can deploy the models without unacceptable data,
              export-control, or security exposure. IBM cautions that the widely repeated $5.576 million training figure
              is only an estimate for a final pre-training run and excludes prior research, data, infrastructure,
              salaries, and facilities. A thesis break would be a failed financing, sustained loss of access to critical
              compute, a material security incident, or evidence that usage growth does not translate into paid,
              repeatable contribution margin. Exit readiness is therefore limited until reporting and governance
              improve.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not buy on headline valuation
            body: >-
              DeepSeek's technical and distribution signal is credible enough to keep monitoring, but public valuation
              marks, financing terms, and revenue quality are not sufficiently reconciled for a high-confidence buy
              recommendation.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV008
          - type: callout
            title: Valuation can fail through access, not only growth
            body: >-
              A federal civilian-agency ban that also reaches third-party implementations can reduce addressable demand
              and raise diligence costs even if model quality and token usage continue to improve.
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
