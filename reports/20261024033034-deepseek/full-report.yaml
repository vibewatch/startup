      - CE004
      - CE006
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: Customer journey from discovery to expansion
    type: journey-map
    summary: >-
      DeepSeek's observable journey runs from broad free access and downloads toward API or self-hosted use, with
      enterprise expansion constrained by missing retention proof and governance barriers.
    data:
      nodes:
        - id: discovery
          label: Discovery
          title: App-store and media visibility
          detail: R1 became the most-downloaded free iOS app in the U.S. by Jan 27, 2025.
          touchpoints:
            - App Store rankings
            - Media and community attention
        - id: trial
          label: Trial
          title: Free chatbot access
          detail: Users can access the chatbot through the official website or mobile application.
          touchpoints:
            - Web chatbot
            - iOS and Android apps
        - id: developer
          label: Developer adoption
          title: API and open-weight access
          detail: Developers and businesses can use a usage-priced API, while model weights can be downloaded and deployed.
          touchpoints:
            - API
            - Hugging Face and local deployment
        - id: workflow
          label: Workflow use
          title: Enterprise or technical workflow integration
          detail: The assigned evidence describes enterprise use cases but does not verify named production deployments.
          touchpoints:
            - Coding and document workflows
            - Internal support and analysis
        - id: expansion
          label: Expansion
          title: Paid usage, renewal, or self-hosted scale
          detail: >-
            Expansion pathways are plausible but no NRR, GRR, churn, contract, or account-level cohort data is
            disclosed.
          touchpoints:
            - API volume
            - Renewal
            - Additional teams or locations
        - id: constraint
          label: Constraint
          title: Governance and procurement friction
          detail: >-
            Government restrictions cite security and sensitive-data concerns, limiting some enterprise and
            public-sector use.
          touchpoints:
            - Security review
            - Data residency
            - Procurement restrictions
    approximationNotes: >-
      Stages are an evidence-based sequence of access surfaces, not a measured conversion funnel; no rates or population
      shares are inferred.
    claimRefs:
      - CU005
      - CU009
      - CU011
      - CU014
