  - id: FI001
    title: From model usage to financial contribution
    type: flow
    summary: >-
      DeepSeek's public business model links token usage and deployment choices to revenue, infrastructure cost, and
      ultimately contribution margin, with key conversion points undisclosed.
    data:
      nodes:
        - id: user-demand
          label: Developer and enterprise demand
          detail: Public sources describe business and developer API use; account volume is undisclosed.
        - id: token-volume
          label: Tokens processed
          detail: Usage-based billing unit for API access.
        - id: api-revenue
          label: API revenue
          detail: Reported pricing exists, but realized price and recognized revenue are not public.
        - id: compute-cost
          label: Compute and infrastructure cost
          detail: Chips, data centers, electricity, leases, and inference utilization are not fully disclosed.
        - id: operating-cost
          label: Research and operating cost
          detail: Talent and other operating costs are not publicly quantified.
        - id: contribution-margin
          label: Contribution margin and cash generation
          detail: No audited or model-level public margin bridge was retained.
      edges:
        - from: user-demand
          to: token-volume
        - from: token-volume
          to: api-revenue
        - from: api-revenue
          to: contribution-margin
        - from: compute-cost
          to: contribution-margin
        - from: operating-cost
          to: contribution-margin
    approximationNotes: The flow is a sourced operating model, not a quantitative forecast; it does not infer conversion rates or margins.
    claimRefs:
      - CI001
      - CI005
      - CI007
      - CI012
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: DeepSeek's public product stack links model research to hosted access and operator-controlled deployment.
    data:
      layers:
        - label: Research and model releases
          modules:
            - label: V3, R1, V4.0
              detail: >-
                Open-weight model family with technical reports and model cards listed across the official and research
                sources.
              unit: model releases
        - label: Core model architecture
          modules:
            - label: MoE routing
              detail: 671B total / 37B active per token for V3.
              unit: parameters
            - label: MLA and FP8
              detail: Memory and compute efficiency techniques described in technical coverage.
              unit: techniques
        - label: Developer interface
          modules:
            - label: API Platform
              detail: Official transparency page links API access and API documentation.
              unit: service
            - label: Harness
              detail: Official product navigation lists a developer-facing Harness surface.
              unit: service
        - label: Deployment options
          modules:
            - label: Hosted web and app
              detail: Free consumer access is described in independent coverage.
              unit: channel
            - label: NVIDIA NIM
              detail: NVIDIA reports a full R1 microservice deployment on eight H200 GPUs.
              unit: deployment
        - label: Operating controls
          modules:
            - label: Data and permissions
              detail: Enterprise deployment requires explicit data-flow, access, and monitoring controls.
              unit: control layer
            - label: Supply-chain review
              detail: CIO reports third-party implementations are within the DHS procurement and removal scope.
              unit: control layer
        - label: Assurance gaps
          modules:
            - label: Security evidence
              detail: >-
                Independent security testing, incident history, and complete provenance remain incomplete in the
                retained public record.
              unit: diligence gap
    approximationNotes: >-
      The stack is an authored operating model, not a claim that every layer is vertically integrated or that the layers
      imply a universal deployment direction.
