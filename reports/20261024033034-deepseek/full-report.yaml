  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              DeepSeek's relevant market comprises hosted model inference through chat and APIs plus open-weight
              deployment on customer-controlled infrastructure. The boundary excludes chips, general cloud capacity,
              downstream application revenue, and the broader AI development-platform market unless DeepSeek captures
              that spend directly. Layer3 Labs describes consumer chat, a developer API, and downloadable weights as the
              visible routes to use, while reporting no formal enterprise sales, professional-services, or support tier
              at publication. Buyers can substitute closed-model APIs, other open-weight families, or internal
              deployment. Those alternatives mean that low price and weight availability expand usage but also constrain
              vendor lock-in and the share of ecosystem value that accrues to the model author.
            claimRefs:
              - CM001
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.2'
        title: Sizing and observed adoption
        blocks:
          - type: paragraph
            body: >-
              Gartner forecasts worldwide end-user spending on AI models and platforms at $64.252 billion in 2026, up
              63.4% from $39.311 billion in 2025. Within that total, foundation generative-AI models are forecast at
              $23.356 billion and specialized generative-AI models at $4.910 billion. These category figures are not
              DeepSeek revenue or serviceable market. Direct platform observations provide a narrower adoption lens:
              Vercel reports that DeepSeek moved from under 1% to 17% of its gateway tokens in May 2026 while remaining
              near 1% of spend, and OpenRouter reports DeepSeek's token share rose from 9% in January to 18% in June.
              The evidence establishes usage momentum and price leverage, not monetization or durable share.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
      - number: '2.3'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              Adoption splits into distinct purchasing paths rather than a single funnel. Application teams can trial a
              low-cost hosted endpoint; platform teams can route production workloads across several models;
              infrastructure and security teams can self-host weights when data control outweighs operational
              simplicity. Gartner says enterprise buyers increasingly evaluate cost, latency, performance, reliability,
              evaluation, and usage tracking together. Darden's Michael Albert argues that value is likely to accrue to
              end uses and to firms controlling platforms and data rather than automatically to the foundation model.
              Consumer distribution is visible—Digital in Asia reports 130 million monthly active DeepSeek app users as
              of May 2026—but the assigned evidence does not identify the payer, conversion rate, or budget owner behind
              that audience.
            claimRefs:
              - CM005
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption driver is economical production usage. OpenRouter reports that V4-Flash represented
              70% of DeepSeek's agentic token flow by the end of May 2026, while the State of AI Report cites an
              estimated 47% quarterly decline since 2023 in the cost of reaching a fixed benchmark score. Capability
              remains differentiated: the fetched Artificial Analysis comparison places DeepSeek V4.1 Flash tenth in
              both Finance & Accounting and Strategy & Ops, not at the frontier across every domain. Constraints are
              commercial and political as well as technical. CNBC reports a US federal civilian-agency ban covering
              DeepSeek technology and third-party products built with its models. For valuation, broad category growth
              and routed-token share should therefore be treated as demand signals, not as substitutes for revenue,
              retention, margin, or a verified serviceable market.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Usage momentum is not market share in dollars
            body: >-
              Vercel and OpenRouter measure routed tokens in their own populations. Those observations show adoption but
              do not establish DeepSeek revenue, spend share outside Vercel, customer count, retention, or gross margin.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM016
          - type: callout
            title: Compliance narrows the serviceable market
            body: >-
              Self-hosting can remove the hosted-service network path, but the reported US federal order covers
              DeepSeek-related technology, including third-party products built with its models, so deployment
              architecture does not restore eligibility for that buyer segment.
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and differentiation
        blocks:
          - type: paragraph
            body: >-
              DeepSeek sits in a crowded model market rather than a one-company category. The available evidence
              describes a direct frontier set of OpenAI, Anthropic, Google, xAI, and Meta, alongside Chinese peers
              including Moonshot's Kimi, Alibaba's Qwen, Doubao, and other open-weight providers. DeepSeek's
              differentiated choice is to release weights under MIT licensing while competing on inference economics; a
              comparison of Grok, Meta AI, and DeepSeek describes DeepSeek as the only one of that set offering
              self-hostable weights and identifies Meta's embedded distribution and Grok's live X data as different
              competitive advantages. This is a buyer-choice distinction, not proof that DeepSeek wins every benchmark
              or workflow.

              Its durability is mixed. A refreshed technical profile says Moonshot Kimi 2.6 and Alibaba Qwen have
              narrowed the gap and that the Chinese market is now defined by multiple capable providers. DeepSeek's
              efficiency and openness are still described as difficult-to-replicate advantages, while Alibaba's
              cloud-only proprietary releases represent the opposite strategic bet. Internal build and self-hosting are
              substitutes for hosted API consumption, but they transfer infrastructure, security, and operations
              responsibility to the buyer.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP010
              - CP011
      - number: '3.2'
        title: Capability, price, distribution, and trust trade-offs
        blocks:
          - type: paragraph
            body: >-
              Price-performance is DeepSeek's clearest commercial wedge. The retained comparison reports V4 Pro API
              pricing of $0.435 per million input tokens and $0.87 per million output tokens, versus Grok at $2 and $6
              in the same table; it also reports V4 Flash at $0.14 and $0.28. Another technical comparison estimates
              that V4 can reduce inference costs by 90% or more versus top US models for high-volume workloads, but
              explicitly cautions that benchmark parity does not guarantee task parity. These are published comparisons
              and estimates, not audited realized customer economics.

              Distribution and compliance pull in the opposite direction. Meta AI benefits from being embedded in
              WhatsApp, Instagram, Facebook, and Messenger, while Grok offers live X data and coding-workflow
              integrations. CNBC reports that a US federal action bans DeepSeek-related technology from government
              agency systems, including third-party products and services built using its models. That is a direct loss
              of federal procurement access and a reputational signal for risk-sensitive private buyers, although the
              reporting does not describe it as a blanket private-sector ban.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
      - number: '3.3'
        title: Switching costs and moat durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs are highest where a buyer has embedded model-specific prompts, evaluation suites,
              fine-tuning, or self-hosted serving infrastructure. MIT-licensed weights lower licensing lock-in and allow
              a buyer to move from hosted API usage to controlled infrastructure, but that path is not frictionless: the
              evidence notes that self-hosting a frontier-class model is operationally substantial. Hosted customers
              retain exposure to provider availability, rate limits, data-routing rules, and changing model behavior.

              The main displacement risk is that openness and low price become table stakes. The evidence says Kimi,
              Qwen, Doubao, and other Chinese providers have caught up, while US frontier vendors retain advantages in
              mature enterprise support, alignment, and some complex agentic workflows. The October 2026 federal
              exclusion also shows that model lineage can become a procurement constraint even when weights are open and
              easily repackaged. DeepSeek therefore has a strong technical wedge but an uncertain enterprise moat:
              retention depends on workload-level evaluations, deployment control, and trust rather than on benchmark
              leadership alone.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Competitive diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence is sufficient to map the strategic trade-offs but not to underwrite durable share or
              customer retention. The assigned sources do not provide comparable audited win rates, net retention,
              enterprise contract volumes, migration rates, or a consistent independent benchmark across all named
              vendors. Several comparison pages are vendor-adjacent or analytical summaries, so their pricing and
              benchmark claims should be re-tested on representative workloads. The federal ban is better evidence of
              procurement posture than of technical inferiority. A decision-maker should require a workload bake-off
              covering quality, latency, safety, data residency, total serving cost, and migration effort before
              treating the price gap as a durable moat.
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A real price-and-control wedge
            body: >-
              DeepSeek combines open weights with cited API prices below Grok and other frontier comparators, creating a
              credible option for buyers willing to own deployment and evaluation.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: Trust can override technical economics
            body: >-
              The October 2026 federal exclusion covers DeepSeek-derived third-party services, showing that model
              lineage and jurisdiction can outweigh price in regulated procurement.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
          - type: callout
            title: Openness is not a complete moat
            body: >-
              Chinese peers have narrowed the gap, so durable differentiation depends on repeatable workload quality,
              serving economics, and enterprise trust rather than release novelty alone.
            calloutType: insight
            claimRefs:
              - CP003
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              DeepSeek monetizes access to its models through usage-based APIs while also distributing a free chatbot
              and open-weight models. The API mechanism is explicit: developers and businesses pay for processed tokens,
              whereas the free surface is a distribution and adoption channel rather than recognized revenue. Public
              reporting gives a directional traction signal but not an audited revenue bridge. StoneX relays a September
              2026 estimate of approximately $500 million of annual recurring revenue and separately cites 475 million
              yuan, or $70.7 million, of revenue in the first seven months of 2026. Those measures are not
              interchangeable: ARR is an annualized run-rate and the seven-month figure is reported revenue. Neither
              source establishes customer concentration, retention, recognized gross margin, or the share of revenue
              from API versus other channels. The underwriting implication is that usage appears commercially
              meaningful, but revenue quality remains unverified until management provides accounting definitions,
              cohort data, and customer-level concentration.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI012
              - CI015
      - number: '4.2'
        title: Pricing, cost drivers, and unit economics
        blocks:
          - type: paragraph
            body: >-
              The public pricing evidence supports a low-price, high-volume strategy rather than premium software
              monetization. Wikipedia records a usage-based API and approximately $0.28 per million input tokens and
              $0.42 per million output tokens as of February 2025; a later Tech Insider analysis reports $0.55 and $2.19
              for a different R1 comparison, so the figures should not be treated as one stable tariff without model,
              date, and billing-schedule reconciliation. The same reporting describes a 671-billion-parameter
              mixture-of-experts model with 37 billion parameters activated per token and a reported $5.6 million V3
              GPU-rental cost, while noting that the training-cost claim is debated. These are efficiency and cost
              proxies, not DeepSeek's gross margin. Electricity, chips, data-center leases, research compensation,
              inference utilization, discounts, cloud take rates, and support costs are not publicly quantified. The
              margin path therefore depends on whether algorithmic efficiency and scale offset aggressive pricing and
              frontier-model capacity requirements.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI007
              - CI009
              - CI012
              - CI013
              - CI015
      - number: '4.3'
        title: Capital intensity and financing dependency
        blocks:
          - type: paragraph
            body: >-
              DeepSeek's financing profile has shifted from founder-linked internal funding toward external capital, but
              the latest reported raise still does not establish capital sufficiency. A Forbes profile states that
              DeepSeek raised $14.9 billion in October 2026 at a $74.7 billion valuation. That is a funding report, not
              a cash balance: it does not disclose the amount funded at close, restrictions on proceeds, debt-like
              obligations, committed infrastructure purchases, or remaining liquidity. StoneX separately relays
              approximately $1.6 billion of expected AI infrastructure expenditure for 2026 and a 715 million yuan net
              loss for the first seven months of the year. The periods and accounting measures must remain separate. Net
              loss is not cash burn, expected infrastructure expenditure is not total operating cost, and funding raised
              is not cash available. Forward underwriting therefore requires current cash, monthly burn, working-capital
              needs, debt and capex commitments, and the milestone that would trigger another financing.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is promising but not yet underwritable on public evidence. The API is a plausible
              recurring mechanism, and the open-weight strategy can widen adoption, but free distribution and low
              per-token prices make usage volume an insufficient substitute for realized revenue, contribution margin,
              and retention. Capital intensity is the more immediate financial risk: reported infrastructure spending
              and losses are large relative to the limited public operating detail, and the financing reports conflict
              on transaction size and valuation. Regulatory restrictions create an additional route to revenue
              volatility. CNBC reports that a July DHS order made public in October bars federal civilian agencies from
              procuring DeepSeek products and requires removal of DeepSeek-related technology, citing sensitive-data
              transfer and cybersecurity concerns. That order does not quantify total commercial revenue exposure, but
              it is adverse evidence against assuming unrestricted enterprise or public-sector distribution.
              Underwriting should remain conditional on audited revenue recognition, model-level price cards, gross
              margin by deployment mode, customer concentration, cash and commitments, and a financing plan tied to
              next-model capex.
            claimRefs:
              - CI015
              - CI016
              - CI017
              - CI018
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital adequacy is not demonstrated
            body: >-
              Conflicting financing reports, reported infrastructure expenditure, and accounting losses leave cash on
              hand, burn, debt, and runway unresolved.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: callout
            title: Underwrite only after a financial data room
            body: >-
              Require audited revenue recognition, current price cards, gross margin by deployment mode, customer
              concentration, and a cash-flow/capex bridge before treating reported traction as durable economics.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI005
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >
              DeepSeek is simultaneously a research lab, a model family, a free web and mobile assistant, and an API
              platform. The official transparency page lists DeepSeek Web, Harness, the API Platform, API documentation,
              downloads, service status, and a sequence of released models; it also records V4.0 as released on April
              24, 2026 and V3.2 on December 1, 2025. A Chinese company profile describes the product progression from
              the first DeepSeek LLM through V2, V3, and R1, alongside app and API access. This is a broad product
              surface rather than a single SKU, but the public material does not disclose service-level reliability,
              customer-level deployment counts, or a complete release-management history.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
