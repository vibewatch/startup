      - number: '1.4'
        title: Milestones and material risk boundaries
        blocks:
          - type: paragraph
            body: >-
              DeepSeek's visible trajectory runs from High-Flyer-linked research through the R1 release and subsequent
              financing interest. BBC reporting links R1's low reported training cost and app adoption to the company's
              global breakthrough, while technical analysis attributes the cost narrative to mixture-of-experts
              architecture, compression, and caching. The same evidence shows that technical influence does not remove
              operating and policy risk: CNBC reports a U.S. ban on DeepSeek-related technology in federal civilian
              agency systems, citing potential sensitive-data transfers and cybersecurity vulnerabilities. Leadership
              retention pressure, export-control exposure, and service outages or attacks should consequently be tracked
              alongside model releases. The company has meaningful milestone evidence, but public disclosure remains
              insufficient for a complete operating KPI baseline.
