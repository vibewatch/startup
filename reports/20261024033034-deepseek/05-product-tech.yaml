      - [Routing and expert computation, "Mixture-of-experts routes tokens to selected experts", "Gating and expert network implementation", "Training and debugging complexity can impair reproducibility"]
      - [Attention and precision, "MLA reduces KV-cache memory; FP8 improves efficiency", "Hardware and numerical-kernel support", "Precision, compatibility, and quality trade-offs require workload testing"]
      - [Training pipeline, "14.8T-token pretraining plus SFT and RL stages", "Data, compute, and research infrastructure", "Reported run cost is not total development cost"]
      - [Inference deployment, "NVIDIA NIM supports a full R1 deployment on eight H200 GPUs", "High-bandwidth multi-GPU system", "Capital, power, networking, and operator capability can dominate economics"]
    notes: "Technical values are reported metrics from the V3 paper and NVIDIA deployment material; the table separates model design from infrastructure requirements and does not infer customer economics."
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
  - id: TE003
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["General question answering", "User submits prompts through web or mobile assistant", "Hosted DeepSeek chatbot", "Free access supports broad experimentation", "Public evidence does not establish uptime or answer-quality consistency"]
      - ["Programmatic text generation", "Application sends prompts to a hosted endpoint", "API access to model services", "Usage-based integration for developers and businesses", "Pricing and service terms need current primary-source confirmation"]
      - ["Private model deployment", "Enterprise runs weights on controlled infrastructure", "Open-weight models and NIM packaging", "Can improve data locality and deployment control", "Full-model memory, GPUs, networking, and security operations remain required"]
      - ["Reasoning and coding assistance", "Model generates longer inference traces and answers", "R1 reasoning model and related releases", "Reported strength on math, coding, and reasoning tasks", "Longer inference can increase latency and serving cost"]
      - ["Model research and fine-tuning", "Researchers inspect papers, weights, and code", "Open weights plus technical reports", "Supports replication and downstream experimentation", "Training data and complete reproduction pipeline are not public"]
    notes: "Benefits are framed as supported product mechanisms or reported technical properties, not independently verified customer outcomes; production limits remain explicit."
    claimRefs: [CE003, CE006, CE009, CE013]
