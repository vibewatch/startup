artifact: product-tech
slug: deepseek
runDate: 2026-10-24
company:
  name: DeepSeek
chapter:
  number: 5
  title: Product & Technology
  summary: DeepSeek combines open-weight model distribution with a technically differentiated but infrastructure-intensive mixture-of-experts stack. The evidence supports strong model-research execution and broad deployment options, while security, privacy, supply-chain, and reproducibility controls remain material diligence constraints.
sections:
  - id: product-surface
    title: Product surface and maturity
    body: |
      DeepSeek is simultaneously a research lab, a model family, a free web and mobile assistant, and an API platform. The official transparency page lists DeepSeek Web, Harness, the API Platform, API documentation, downloads, service status, and a sequence of released models; it also records V4.0 as released on April 24, 2026 and V3.2 on December 1, 2025. A Chinese company profile describes the product progression from the first DeepSeek LLM through V2, V3, and R1, alongside app and API access. This is a broad product surface rather than a single SKU, but the public material does not disclose service-level reliability, customer-level deployment counts, or a complete release-management history.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: architecture-and-deployment
    title: Architecture, efficiency, and deployment
    body: |
      The strongest technical evidence is the DeepSeek-V3 technical report, which specifies a 671B-total-parameter mixture-of-experts model with 37B parameters activated per token, 14.8 trillion pre-training tokens, MLA and DeepSeekMoE architectures, auxiliary-loss-free load balancing, multi-token prediction, and 2.788 million H800 GPU hours for the full training run. IBM's technical explainer provides the mechanism: routing only selected experts reduces computation, while the full model still creates a memory bottleneck. NVIDIA's deployment account shows the trade-off in production: the full R1 model can run as a NIM microservice on an eight-H200 system, with reported throughput up to 3,872 tokens per second. This is a credible efficiency story, not a claim that frontier serving is lightweight.
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE002, TE003]
  - id: trust-and-implementation-risk
    title: Trust, security, and implementation risk
    body: |
      Open weights improve inspectability and portability, but they also transfer more control and responsibility to deployers. Stanford HAI faculty describe the open technical paper and weights as valuable for reproducibility while calling DeepSeek opaque on privacy protection, data sourcing, and copyright. The CSIS analysis raises separate concerns about weak safeguards and jailbreak exposure, while CIO reports that the October 2026 DHS order covers federal procurement, removal, and third-party implementations and cites data-sovereignty and security concerns. Those sources do not prove that every deployment is compromised; they do establish that enterprise adoption requires model provenance, data-flow, permission, monitoring, and fallback controls. The public record also lacks a complete independent security-assurance package, incident history, and reproducible end-to-end training pipeline.
    claimRefs: [CE009, CE010, CE011, CE012, CE013]
    tableRefs: []
  - id: product-verdict
    title: Product and technology verdict
    body: |
      DeepSeek's product advantage is a combination of capable open-weight models, unusually visible research artifacts, and engineering choices that lower active compute relative to total capacity. The architecture is differentiated enough to matter, but not self-sufficient: memory, multi-GPU networking, inference operations, data governance, and safety controls remain part of the buyer's problem. Official materials show continuing releases and a developer-facing surface, while independent technical and policy sources show why deployment maturity should not be inferred from benchmark performance or open licensing. The underwriting conclusion is therefore selective: DeepSeek is technically credible for experimentation and controlled self-hosting, but production use in sensitive workflows depends on verification of data handling, model integrity, security testing, service continuity, and the exact dependency chain behind any third-party product.
    claimRefs: [CE006, CE009, CE011, CE013]
    callouts:
      - calloutType: strength
        title: Engineering efficiency is a real product advantage
        body: The V3 paper documents sparse activation, training scale, and stable execution; the advantage is strongest where buyers can absorb the memory and deployment complexity.
        claimRefs: [CE004, CE005, CE006]
      - calloutType: risk
        title: Open deployment shifts controls to the operator
        body: Open weights and third-party implementations can broaden access, but security, privacy, provenance, and supply-chain verification remain unresolved public diligence items.
        claimRefs: [CE009, CE011, CE012, CE013]
