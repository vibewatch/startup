evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited revenue, ARR, gross margin, active customer count, retention, and cash runway.
    whyItMatters: >-
      These metrics determine whether model attention and reported financing translate into durable commercial
      economics.
    diligencePath: >-
      Request audited financial statements, management accounts, customer concentration, cohort retention, and cash-flow
      schedules under confidentiality.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Definitive financing documents reconciling the reported June round, proposed July round, investors, proceeds, and
      post-money valuation.
    whyItMatters: >-
      Reported valuation and funding figures differ materially and cannot be treated as interchangeable or as cash
      available.
    diligencePath: Obtain signed term sheets, cap table extracts, closing notices, and investor confirmations for each financing.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete current leadership, board, ownership, and succession disclosures.
    whyItMatters: Founder dependence and control rights affect execution resilience and investor protections.
    diligencePath: >-
      Request the current organizational chart, board minutes or roster, beneficial ownership schedule, and key-person
      provisions.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Primary customer, usage, and service-reliability evidence.
    whyItMatters: Public popularity and token share do not establish paying customers, retention, service levels, or concentration.
    diligencePath: >-
      Obtain anonymized customer cohorts, API usage and revenue bridges, uptime reports, and representative customer
      references.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-limit
    missingEvidence: >-
      Verified DeepSeek revenue, paid usage by geography and segment, customer counts, retention, realized pricing, and
      gross margin.
    whyItMatters: >-
      Without company capture and unit economics, broad category forecasts cannot be converted into a defensible TAM,
      SAM, SOM, or valuation multiple.
    diligencePath: >-
      Request management financials, billing and token-volume reconciliation, customer cohorts, segment mix, and
      gross-margin bridges under confidentiality.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Customer and workload distribution across hosted API, consumer chat, self-hosting, geography, industry, and
      regulated use.
    whyItMatters: Observed gateway shares and consumer users may not represent the enterprise segments that control durable budgets.
    diligencePath: >-
      Obtain customer segmentation, deployment mix, procurement win-loss data, and contract values by workload and
      region.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: adoption-measurement
    missingEvidence: >-
      A reconciled measurement of DeepSeek usage across gateways, direct API traffic, self-hosted deployments, and
      consumer chat.
    whyItMatters: >-
      Each retained adoption source measures a different population, so its share cannot be generalized to the full
      market.
    diligencePath: >-
      Compare direct service telemetry with gateway logs and a methodologically disclosed survey of self-hosted
      production deployments.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: competitive-share
    missingEvidence: Comparable independent enterprise win rates, customer retention, and migration data by model provider.
    whyItMatters: Without comparable demand and retention evidence, low token price cannot be translated into durable share or moat.
    diligencePath: >-
      Request provider-neutral customer references and run a matched workload bake-off with retention and migration
      instrumentation.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Realized pricing, discounts, serving costs, and total cost of ownership for comparable production workloads.
    whyItMatters: >-
      Published list prices omit infrastructure, support, compliance, and engineering costs that can reverse the
      apparent advantage.
    diligencePath: Collect current contracts or quotes and benchmark end-to-end cost on representative traffic.
    relatedQuestionRefs:
      - QP003
      - QP005
  - type: missing-source
    severity: material
    topic: procurement
    missingEvidence: A primary Federal Register or DHS order text and comparable private-sector procurement outcomes.
    whyItMatters: >-
