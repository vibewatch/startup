company:
  name: DeepSeek
chapter:
  number: 6
  title: Customers
  summary: DeepSeek shows strong consumer and developer pull through free app distribution, open-weight releases, and low-cost API access, but the assigned evidence does not establish paid-customer count, retention, or production deployment quality. Government restrictions and unresolved data-governance concerns narrow the addressable enterprise segment, especially for sensitive workloads.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segmentation
    body: >-
      DeepSeek serves at least three distinct customer surfaces rather than one homogeneous customer base. Consumers use a free web and mobile chatbot; developers and businesses can call usage-priced APIs; and technical teams can download or self-host open-weight models. The available evidence supports broad user interest and developer accessibility, but it does not disclose a verified split between free users, paid API accounts, enterprise contracts, or self-hosted production deployments. That distinction matters because downloads and model followers measure reach, not recurring revenue or durable usage. The segment with the clearest conversion potential is high-volume technical work where low inference prices, local deployment, or model customization can offset integration and governance costs. The enterprise segment is more constrained: public-sector restrictions and privacy questions can block procurement even where model capability is attractive.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and evidence quality
    body: >-
      Public usage indicators show a sharp launch-driven adoption event, followed by an incomplete commercial picture. Sensor Tower estimated more than 23 million global mobile downloads in DeepSeek's first 19 days and a more than 700% week-over-week increase in average mobile daily active users during the measured January 2025 window. AppFigures separately estimated more than one million downloads across the App Store and Google Play at an earlier point. These measures are useful for distribution and awareness, but they are not active-user cohorts, paid accounts, retention, or revenue. The later refresh pool contains a June 2026 user-ranking page, yet the fetched evidence does not provide a comparable current denominator or a verified retention series. Investors should therefore treat adoption as high-reach but low-visibility on durability and monetization.
    claimRefs: [CU005, CU006, CU007, CU008, CU016]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Named customer proof and deployment quality
    body: >-
      The evidence identifies user populations and access channels more reliably than named commercial customers. DeepSeek's public chatbot and API are available to consumers, developers, and businesses, while open-weight models can be downloaded and deployed by third parties. That is evidence of product availability and ecosystem reach, not proof that a named enterprise has deployed the product in production or achieved an outcome. The assigned sources do not supply three independently verified customer case studies with named buyers, production status, measurable outcomes, and contract context. A disciplined underwriting view is to separate public distribution from customer proof: the former is confirmed, while the latter remains a material diligence gap. A customer reference list, anonymized account cohort, and deployment telemetry would materially improve confidence.
    claimRefs: [CU001, CU002, CU009, CU010]
    tableRefs: [TU003]
  - id: retention-expansion-concentration
    title: Retention, expansion, and concentration risks
    body: >-
      No retained source reports NRR, GRR, churn, renewal rates, contract length, cohort retention, or customer concentration. The open-weight model and free-chatbot strategy can expand the top of the funnel while allowing users to switch among models or self-host, so reach should not be converted into retention without account-level evidence. Expansion may occur through API usage, local deployment, or enterprise workflow integration, but the sources do not quantify conversion between those surfaces. Conversely, regulatory and security restrictions can reduce enterprise expansion: CNBC reports a U.S. federal civilian-agency ban that also covers third-party products and services built using DeepSeek technology, while other reporting documents restrictions tied to sensitive-data and privacy concerns. The immediate diligence priority is a segmented cohort bridge from download or registration to active use, paid usage, renewal, and expansion, with customer and geography concentration disclosed.
    claimRefs: [CU011, CU012, CU013, CU014]
