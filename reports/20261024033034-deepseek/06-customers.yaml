  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source, Confidence, Implication, Missing denominator]
    rows:
      - [Mobile app downloads, ">23 million", "First 19 days after launch; Jan-Feb 2025 window", "Sensor Tower", high, "Exceptional launch distribution", "No retained cohort or active-user series"]
      - [Average mobile app DAUs, ">700% week-over-week increase", "Jan 22-28, 2025 versus Jan 15-21, 2025", "Sensor Tower", high, "Rapid early engagement growth", "Absolute DAU and later retention not reported"]
      - [App Store and Google Play downloads, ">1 million", "By Jan 23-24, 2025 estimate", "AppFigures", medium, "Early cross-platform demand", "Estimate is historical and not reconciled to later totals"]
      - [V4.1-Flash downloads, "391,000", "First week; date not independently established in fetched text", "Bybit", low, "Potential model-level ecosystem pull", "No denominator for active or repeat users"]
      - [Website ranking evidence, "Not attributable from fetched text", "Jun 2026 edition; updated Jul 8, 2026", "AICPB", low, "Provides a current ranking methodology but not a usable DeepSeek observation", "Fetched text omits product labels"]
    notes: "The rows are not a single comparable funnel: they cover different products, sources, dates, and measurement definitions. Values are preserved as reported; no conversion rate is inferred."
    claimRefs: [CU005, CU006, CU007, CU008, CU016]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or user group, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    enumerationScope:
      coverage: sample
      basis: "Publicly accessible customer and user evidence in the assigned pool through 2026-10-24"
    rows:
      - ["Individual mobile users", Consumer, "DeepSeek chatbot on iOS and Android", "Public access; production status of individual usage not measurable", "Large early download and ranking signals", "No named users, paid status, or retention"]
      - ["Developers and businesses", Developer/API, "Usage-priced API for applications", "API availability documented; named production deployments absent", "Potential low-cost integration", "No account count, API volume, or customer outcomes"]
      - ["Open-weight developers and researchers", "Self-hosting/open-weight", "Download, modify, fine-tune, or deploy model weights", "Public ecosystem access; customer deployment not verified", "Community and distribution reach", "Follower/download counts do not establish production use"]
    notes: "This is a partial, evidence-bounded enumeration of user groups and access surfaces, not a list of named commercial customers. The assigned pool did not contain three independently verified named production customer case studies."
    claimRefs: [CU001, CU002, CU009, CU010]
figures:
  - id: FU001
    title: Customer journey from discovery to expansion
    type: journey-map
    summary: DeepSeek's observable journey runs from broad free access and downloads toward API or self-hosted use, with enterprise expansion constrained by missing retention proof and governance barriers.
    data:
      nodes:
        - id: discovery
          label: Discovery
          title: App-store and media visibility
          detail: "R1 became the most-downloaded free iOS app in the U.S. by Jan 27, 2025."
          touchpoints: ["App Store rankings", "Media and community attention"]
        - id: trial
          label: Trial
          title: Free chatbot access
          detail: "Users can access the chatbot through the official website or mobile application."
          touchpoints: ["Web chatbot", "iOS and Android apps"]
        - id: developer
          label: Developer adoption
          title: API and open-weight access
          detail: "Developers and businesses can use a usage-priced API, while model weights can be downloaded and deployed."
          touchpoints: ["API", "Hugging Face and local deployment"]
        - id: workflow
          label: Workflow use
          title: Enterprise or technical workflow integration
          detail: "The assigned evidence describes enterprise use cases but does not verify named production deployments."
          touchpoints: ["Coding and document workflows", "Internal support and analysis"]
        - id: expansion
          label: Expansion
          title: Paid usage, renewal, or self-hosted scale
          detail: "Expansion pathways are plausible but no NRR, GRR, churn, contract, or account-level cohort data is disclosed."
          touchpoints: ["API volume", "Renewal", "Additional teams or locations"]
        - id: constraint
          label: Constraint
          title: Governance and procurement friction
          detail: "Government restrictions cite security and sensitive-data concerns, limiting some enterprise and public-sector use."
          touchpoints: ["Security review", "Data residency", "Procurement restrictions"]
    approximationNotes: "Stages are an evidence-based sequence of access surfaces, not a measured conversion funnel; no rates or population shares are inferred."
    claimRefs: [CU005, CU009, CU011, CU014]
callouts:
  - calloutType: strength
    title: Distribution is demonstrably broad
    body: "Sensor Tower's early-period estimates show more than 23 million global downloads and more than 700% week-over-week DAU growth, while the open-weight strategy expands access beyond the hosted chatbot."
    claimRefs: [CU005, CU006, CU009]
  - calloutType: risk
    title: Adoption is not retention
    body: "No retained source discloses paid-account count, active-user cohorts, churn, renewal, NRR, GRR, or customer concentration."
    claimRefs: [CU010, CU012]
  - calloutType: recommendation
    title: Require a segmented customer bridge
    body: "Before underwriting commercial durability, request cohorts by geography and product surface from download or registration through active use, paid API usage, renewal, expansion, and concentration."
    claimRefs: [CU012, CU013]
