callouts:
  - calloutType: recommendation
    title: Track, do not buy on headline valuation
    body: "DeepSeek's technical and distribution signal is credible enough to keep monitoring, but public valuation marks, financing terms, and revenue quality are not sufficiently reconciled for a high-confidence buy recommendation."
    claimRefs: [CV005, CV006, CV008]
  - calloutType: risk
    title: Valuation can fail through access, not only growth
    body: "A federal civilian-agency ban that also reaches third-party implementations can reduce addressable demand and raise diligence costs even if model quality and token usage continue to improve."
    claimRefs: [CV015, CV016]
