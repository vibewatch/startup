company:
  name: DeepSeek
chapter:
  number: 8
  title: Valuation
  summary: DeepSeek has unusually strong model distribution and apparent 2026 monetization momentum, but the public record is still too thin to underwrite a firm price with high confidence. The evidence supports tracking rather than buying until financing terms, audited revenue quality, governance, and geopolitical access risks are disclosed.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case rests on a differentiated combination of open-weight distribution,
      efficient model architecture, and a usage-priced API that can convert ecosystem
      adoption into revenue. Sacra estimates $1.00B of annualized revenue in September
      2026 and reports a 50%+ gross margin on model sales by July, with 82.9% API gross
      margin during the first seven months; these are analyst estimates, not audited
      company disclosures. The countercase is equally material: IBM notes that mixture-of-
      experts reduces compute but not memory costs, while CNBC reports a U.S. federal
      civilian-agency ban that includes third-party products built with DeepSeek models.
      The result is strategic reach with uncertain direct value capture and a meaningful
      discount for regulatory, security, and disclosure risk.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      The financing evidence is inconsistent across the refresh pool and should not be
      collapsed into one precise valuation. Sacra reports a roughly RMB350.88 billion
      ($51.82 billion) post-money valuation from a June 2026 external round and says a
      second round was being sought at roughly $75 billion; an April 2026 report instead
      described advanced discussions for at least $300 million above $10 billion. The
      difference may reflect separate financing stages, stale reporting, or source error,
      so the current price is a blocking diligence question rather than a settled fact.
      Publicly available evidence also does not disclose liquidation preferences, option
      dilution, debt, or a cap table sufficient to translate headline valuation into
      common-equity value. Entry discipline therefore requires verified term sheets and
      audited revenue definitions before assigning a buy price.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV001]
  - id: scenarios-and-comparables
    title: Scenarios and comparable evidence
    body: >-
      A scenario framework is more defensible than a point estimate because the evidence
      supports directional drivers but not a complete forecast. The bull case assumes
      API demand converts into durable, high-margin usage while open-weight distribution
      expands enterprise and sovereign deployments. The base case assumes technical
      leadership remains valuable but direct monetization is constrained by self-hosting,
      substitutes, and geopolitical limits. The bear case assumes valuation compression
      as government exclusions, security scrutiny, or capital constraints reduce addressable
      demand. Public comparables are imperfect: TechNode reports MiniMax at more than
      $11.5 billion after its Hong Kong debut, with a $512 million net loss in the first
      three quarters of 2025, while StepFun reporting describes a nearly $2.5 billion
      financing round and an intended Hong Kong listing. These are market context, not
      directly comparable operating multiples for DeepSeek.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and thesis breaks
    body: >-
      The appropriate decision is track/research-more, not buy, because valuation support
      is less reliable than the product signal. A price-sensitive upgrade requires three
      confirmations: audited revenue separating recognized revenue from annualized run
      rate, financing documents that establish ownership and preference economics, and
      evidence that enterprise customers can deploy the models without unacceptable data,
      export-control, or security exposure. IBM cautions that the widely repeated $5.576
      million training figure is only an estimate for a final pre-training run and excludes
      prior research, data, infrastructure, salaries, and facilities. A thesis break would
      be a failed financing, sustained loss of access to critical compute, a material
      security incident, or evidence that usage growth does not translate into paid,
      repeatable contribution margin. Exit readiness is therefore limited until reporting
      and governance improve.
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: []
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track / research-more, Wait for verified price and financial disclosure]
      - [Confidence, medium-low, Directional evidence is stronger than valuation evidence]
      - [Risk rating, high, Apply a material geopolitical and security discount]
      - [Valuation stance, stretched / unresolved, Do not underwrite the reported headline marks as common-equity value]
    notes: "Assessment synthesizes cited public sources; null or unavailable financing terms are not treated as zero."
    claimRefs: [CV005, CV006, CV008, CV015]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Efficient open-weight distribution can widen adoption, "MIT reports open-source R1 and materially lower API pricing; IBM describes 671B total and 37B active parameters for V3", "Independent paid-retention and enterprise deployment data"]
      - [Revenue momentum may support premium valuation, "Sacra estimates $1B September 2026 annualized revenue and 82.9% API gross margin for January-July 2026", "Audited revenue, cohort retention, and reconciled margin bridge"]
      - [Headline valuation is not yet investable, "Sacra reports $51.82B post-money and a proposed $75B round; another April report described $10B+ discussions", "Executed term sheet, cap table, preferences, and dilution"]
      - [Geopolitics can impair value capture, "CNBC reports a federal civilian-agency ban covering DeepSeek and third-party implementations", "Documented enterprise approvals and durable access across target markets"]
    notes: "Rows compare the investment argument with a falsifiable counter-test; analyst estimates and reported financing are labeled as such."
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Operating assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Paid API usage compounds; open-weight models drive enterprise and sovereign deployments; margin remains strong", "A verified $75B financing mark could be supportable only if revenue quality and retention validate the multiple", "Competition, compute access, governance", "Low-to-medium"]
      - [Base, "Technical adoption continues but self-hosting, substitutes, and restricted procurement limit direct capture", "Preserve capital and wait for a documented entry price; no numeric target is supportable", "Commercial conversion and geopolitical access", "Medium"]
      - [Bear, "Federal and enterprise restrictions spread; financing terms worsen; monetization lags token usage", "Multiple compression and dilution risk dominate; avoid new capital until terms reset", "Security incidents, export controls, liquidity", "Medium"]
      - [Comparator context, "MiniMax reached over $11.5B market capitalization after its Hong Kong debut and reported a $512M nine-month 2025 net loss", "Public AI appetite does not establish a DeepSeek multiple", "Different stage, disclosure, and market structure", "Observed comparator"]
      - [Comparator context, "StepFun reporting describes nearly $2.5B financing and Hong Kong listing preparation", "Private-round headline values are context, not a verified DeepSeek benchmark", "Syndication, timing, and comparability", "Observed comparator"]
    notes: "Scenarios are qualitative because the pool lacks audited DeepSeek revenue, a verified cap table, preference terms, and a consistent current valuation."
    claimRefs: [CV005, CV006, CV009, CV010, CV011, CV012]
