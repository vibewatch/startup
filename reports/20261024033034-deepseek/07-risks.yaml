  - calloutType: assumption
    title: Financing uncertainty
    body: "Reported financing terms are not reconciled: one retained report described a proposed $300 million round above a $10 billion valuation, while later reporting described a valuation above $50 billion and disclosed that part of the underlying report was not independently verified."
    claimRefs: [CR020, CR022]
