company:
  name: DeepSeek
chapter:
  number: 7
  title: Risks
  summary: "DeepSeek's principal risks are externally imposed rather than purely technical: government exclusion, data-governance scrutiny, uncertain commercialization, and dependence on scarce talent and compute. The evidence supports a high residual-risk posture, with mitigations visible in open-weight distribution and published terms but not yet sufficient to neutralize procurement, privacy, and execution exposure."
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: DeepSeek faces a widening policy perimeter in which model access, data handling, and downstream deployment are treated as national-security or privacy questions rather than ordinary software procurement. The October 2026 DHS action reportedly requires federal civilian agencies to remove covered DeepSeek products and prohibits both direct acquisition and third-party offerings developed using DeepSeek implementations, extending exposure beyond the branded application (CR001, CR002, CR003). The reported rationale includes possible sensitive-data transfer to China, intelligence value, and embedded vulnerabilities, but the same reporting notes that implementation details and a specific compliance deadline were not yet published (CR002, CR003). This creates a moving compliance surface for enterprise customers and integrators. The risk is high because an exclusion can remove a channel even when model quality and price remain competitive; the monitoring trigger is a final rule, agency implementation guidance, or expansion to commercial critical infrastructure. DeepSeek's own terms say service availability may vary by jurisdiction and that the company may modify, suspend, or terminate services as laws and regulations change (CR006). The diligence path is to obtain the DHS docket, map affected jurisdictions and indirect model dependencies, and test whether customer contracts allocate data residency, indemnity, and continuity obligations.
    claimRefs: [CR001, CR002, CR003, CR004, CR006]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, quality, and security risk
    body: "The product combines meaningful technical efficiency with unresolved safety and reliability questions. IBM describes DeepSeek-V3 as a 671-billion-parameter mixture-of-experts model with 37 billion active parameters, while also noting that mixture-of-experts systems retain a large memory footprint and are harder to train and fine-tune (CR007, CR008). That architecture can support lower inference cost, but it leaves compute, memory, and operational complexity as material constraints. IBM also reports that DeepSeek-R1 has performed poorly in security and jailbreaking tests, an adverse signal for enterprise deployment even though the article does not provide a standardized scorecard (CR009). The terms promise industry-practice cyber-security measures and stable operation, but expressly provide no warranty that the services will remain available in particular jurisdictions (CR010, CR011). A prior cyberattack disrupted service and led to restricted new-user registration according to the maintained public chronology (CR012). Residual exposure is therefore medium-high: open weights can enable local deployment, but customers must own evaluation, patching, abuse monitoring, fallback routing, and model provenance. Kill criteria should include a material incident without timely disclosure, repeated availability failures, or an evaluation showing unacceptable harmful-output or data-exfiltration rates in the intended workload."
    claimRefs: [CR007, CR009, CR012]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependency-financial-execution
    title: Partner, financial, and execution dependencies
    body: "DeepSeek's model economics are attractive but do not establish durable margins or sufficient capital. Gartner forecasts worldwide end-user spending on AI models and platforms at $64.252 billion in 2026, while explicitly warning that providers face pressure to demonstrate sustained use and durable margins as usage becomes more cost-driven (CR013, CR014). Vercel's anonymized AI Gateway data shows DeepSeek's token share rising to 17% in May 2026 while its spend share stayed near 1%, and reports a 49% token share but only 4% cost share in coding-agent traffic (CR015, CR016). Those figures indicate usage traction and severe price capture pressure, not revenue or cash generation. A separate report describes a proposed first external round of at least $300 million at a valuation above $10 billion, but the article says the company had not confirmed an official timeline and declined requests for comment (CR017, CR018). CNBC later reported that DeepSeek reportedly closed a first external round valuing it above $50 billion, while stating it could not independently verify the underlying no-poaching report (CR019, CR020). The conflicting financing signals make capital structure, ownership, and available cash a diligence gap. Talent concentration is also material: CNBC reported that the company sought funding after losing key researchers and that a reported investor condition barred poaching staff or encouraging spinouts (CR021, CR022). Monitor disclosed financing documents, retention of named technical leaders, GPU availability and utilization, price changes, and customer-level gross margin; a failed next financing, sustained senior-researcher attrition, or inability to secure compliant compute would break the operating thesis."
    claimRefs: [CR015, CR016, CR020, CR022]
    tableRefs: [TR003]
  - id: diligence-and-kill-criteria
    title: Residual exposure and decision triggers
    body: "The highest-priority diligence is not another benchmark comparison; it is proof that DeepSeek can convert open-weight adoption into compliant, dependable, and financeable production usage. Stanford's policy brief says commercial strategies for translating adoption into business success are emerging but long-term viability remains uncertain, and it cautions that government support is not guaranteed (CR023, CR024). The appropriate mitigation is a deployment-control package: customer-specific data residency and logging, independent safety evaluation, incident response, model and dependency inventories, multi-provider failover, and evidence of renewal or paid usage by segment. A risk can be downgraded only when the company provides auditable answers, not when a model leaderboard improves. Key thesis-break triggers are a binding expansion of public-sector exclusions, a confirmed material privacy or security incident, a sustained gap between token volume and monetization, inability to retain core researchers, or a capital event that materially changes control or financing terms. Until those tests are passed, the investment implication is to underwrite technical capability separately from commercial durability and to treat any valuation as exposed to policy and execution discounts."
    claimRefs: [CR023, CR025, CR026, CR027]
    tableRefs: []
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Evidence and status, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Federal procurement exclusion and indirect-use reach, "DHS reportedly ordered removal and barred acquisition of DeepSeek and third-party implementations; implementation details remain incomplete.", high, critical, partial, high, "Obtain docket and agency guidance; map indirect dependencies."]
      - [Data transfer and privacy scrutiny, "Public policy analysis cites China-hosted data and privacy concerns; DeepSeek terms point users to a separate privacy policy.", medium-high, high, partial, high, "Review current privacy policy, data residency, subprocessors, and enterprise controls."]
      - [Jurisdictional availability, "DeepSeek terms state that availability is not warranted in certain jurisdictions and may vary by jurisdiction.", medium, high, developing, medium-high, "Test continuity and contractual remedies across target markets."]
      - [Open-weight misuse and regulatory response, "Policy analysis links open distribution to both lower cost and misuse, including safety and censorship concerns.", medium, high, partial, high, "Run independent abuse testing and document downstream-use controls."]
    notes: "Rows synthesize dated primary, policy, and independent reporting; likelihood and residual exposure are analytical judgments anchored to the cited evidence, not company disclosures."
    enumerationScope:
      coverage: partial
      basis: "Publicly reported regulatory, privacy, and policy exposures available through the 2026-10-24 run date."
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR023]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Safety and jailbreak failure, medium-high, high, partial, high, "No current standardized independent enterprise safety scorecard retained."]
      - [Service outage or regional unavailability, medium, high, developing, medium-high, "No public recovery-time or service-level commitment retained."]
      - [Memory and training complexity, medium, medium-high, developing, medium, "Customer-specific infrastructure and utilization requirements are not disclosed."]
      - [Model provenance and downstream modification, medium, high, partial, medium-high, "Need signed artifacts, version policy, and customer rollback controls."]
    notes: "Operational ratings are based on published architecture, terms, prior service disruption, and reported testing; no incident-free claim is inferred from the absence of additional incidents."
    claimRefs: [CR007, CR009, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or ecosystem, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Advanced compute and memory, "Nvidia-linked GPU ecosystem and constrained compliant supply", Export controls or supply interruption limits training and inference capacity, high, "Optimize sparse architectures; diversify approved infrastructure; disclose utilization.", high]
      - [Technical talent, "Core researchers and competing Chinese AI labs", Senior departures slow releases or transfer know-how, high, "Retention plan, succession depth, and independent team ownership.", high]
      - [Enterprise distribution, "Cloud gateways, integrators, and public-sector buyers", Customer routes are blocked by policy or procurement exclusions, high, "Multi-provider routing and jurisdiction-specific deployment options.", high]
      - [External capital and governance, "Reported first external funding and strategic backers", "Financing terms change control, incentives, or model openness", high, "Review signed financing, cap table, preference stack, and governance rights.", high]
    notes: "The financing evidence is explicitly conflicting or unconfirmed in the retained reporting; funding raised is not treated as cash available or proof of solvency."
    claimRefs: [CR015, CR020, CR022]
