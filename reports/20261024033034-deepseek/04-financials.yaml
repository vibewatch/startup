schemaVersion: "report-v2"
artifact: financials
slug: deepseek
runDate: 2026-10-24
company:
  name: DeepSeek
chapter:
  number: 4
  title: Financials
  summary: DeepSeek has a credible token-based API and open-weight distribution model, but public evidence points to a business still converting usage and technical efficiency into durable revenue. Reported revenue, losses, capital needs, and regulatory restrictions make margin, cash runway, and realized customer economics the central underwriting gaps.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      DeepSeek monetizes access to its models through usage-based APIs while also
      distributing a free chatbot and open-weight models. The API mechanism is
      explicit: developers and businesses pay for processed tokens, whereas the
      free surface is a distribution and adoption channel rather than recognized
      revenue. Public reporting gives a directional traction signal but not an
      audited revenue bridge. StoneX relays a September 2026 estimate of
      approximately $500 million of annual recurring revenue and separately cites
      475 million yuan, or $70.7 million, of revenue in the first seven months of
      2026. Those measures are not interchangeable: ARR is an annualized run-rate
      and the seven-month figure is reported revenue. Neither source establishes
      customer concentration, retention, recognized gross margin, or the share of
      revenue from API versus other channels. The underwriting implication is
      that usage appears commercially meaningful, but revenue quality remains
      unverified until management provides accounting definitions, cohort data, and
      customer-level concentration.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing, cost drivers, and unit economics
    body: >-
      The public pricing evidence supports a low-price, high-volume strategy rather
      than premium software monetization. Wikipedia records a usage-based API and
      approximately $0.28 per million input tokens and $0.42 per million output
      tokens as of February 2025; a later Tech Insider analysis reports $0.55 and
      $2.19 for a different R1 comparison, so the figures should not be treated as
      one stable tariff without model, date, and billing-schedule reconciliation.
      The same reporting describes a 671-billion-parameter mixture-of-experts
      model with 37 billion parameters activated per token and a reported $5.6
      million V3 GPU-rental cost, while noting that the training-cost claim is
      debated. These are efficiency and cost proxies, not DeepSeek's gross margin.
      Electricity, chips, data-center leases, research compensation, inference
      utilization, discounts, cloud take rates, and support costs are not publicly
      quantified. The margin path therefore depends on whether algorithmic
      efficiency and scale offset aggressive pricing and frontier-model capacity
      requirements.
    claimRefs: [CI005, CI006, CI007, CI009]
    tableRefs: [TI002, TI003]
  - id: capital-intensity-and-financing
    title: Capital intensity and financing dependency
    body: >-
      DeepSeek's financing profile has shifted from founder-linked internal funding
      toward external capital, but the latest reported raise still does not
      establish capital sufficiency. A Forbes profile states that DeepSeek raised
      $14.9 billion in October 2026 at a $74.7 billion valuation. That is a funding
      report, not a cash balance: it does not disclose the amount funded at close,
      restrictions on proceeds, debt-like obligations, committed infrastructure
      purchases, or remaining liquidity. StoneX separately relays approximately
      $1.6 billion of expected AI infrastructure expenditure for 2026 and a 715
      million yuan net loss for the first seven months of the year. The periods
      and accounting measures must remain separate. Net loss is not cash burn,
      expected infrastructure expenditure is not total operating cost, and
      funding raised is not cash available. Forward underwriting therefore
      requires current cash, monthly burn, working-capital needs, debt and capex
      commitments, and the milestone that would trigger another financing.
    claimRefs: [CI010, CI011, CI012, CI013, CI015]
  - id: underwriting-verdict-and-gaps
    title: Underwriting verdict and diligence blockers
    body: >-
      Revenue quality is promising but not yet underwritable on public evidence.
      The API is a plausible recurring mechanism, and the open-weight strategy can
      widen adoption, but free distribution and low per-token prices make usage
      volume an insufficient substitute for realized revenue, contribution margin,
      and retention. Capital intensity is the more immediate financial risk:
      reported infrastructure spending and losses are large relative to the
      limited public operating detail, and the financing reports conflict on
      transaction size and valuation. Regulatory restrictions create an additional
      route to revenue volatility. CNBC reports that a July DHS order made public
      in October bars federal civilian agencies from procuring DeepSeek products
      and requires removal of DeepSeek-related technology, citing sensitive-data
      transfer and cybersecurity concerns. That order does not quantify total
      commercial revenue exposure, but it is adverse evidence against assuming
      unrestricted enterprise or public-sector distribution. Underwriting should
      remain conditional on audited revenue recognition, model-level price cards,
      gross margin by deployment mode, customer concentration, cash and
      commitments, and a financing plan tied to next-model capex.
    claimRefs: [CI015, CI016, CI017, CI018]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Current value or status, Quality, Diligence ask]
    rows:
      - [API access, "Usage-based model inference", "Tokens processed", "Reported API access with per-token pricing; no audited revenue split", "Company/product mechanism reported by third parties", "Reconcile billed tokens, discounts, cloud take rates, and recognized revenue by model"]
      - [Free chatbot, "Consumer web and mobile distribution", "Queries or messages", "Free access reported; usage is not recognized revenue", "Observed/reported distribution; monetization unclear", "Provide conversion, paid-account, geography, and retention cohorts"]
      - [Open-weight models, "Weights released for self-managed deployment", "Downloads or deployments", "Open-weight distribution supports adoption but no public royalty stream is shown", "Third-party reported; revenue contribution unavailable", "Quantify hosted, support, licensing, and partner revenue attributable to weights"]
      - [Enterprise usage, "Developer and business API consumption", "Accounts and tokens", "Commercial target is described, but customer count and concentration are undisclosed", "Private evidence gap", "Provide top-customer concentration, contract terms, churn, and net retention"]
    notes: "Public sources describe mechanisms and directional traction, not an audited revenue mix; null or unavailable fields mean the company has not publicly disclosed the requested denominator."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization reference points
    columns: [Reference, Input price, Output price, Basis and period, List versus realized, Implication]
    rows:
      - [DeepSeek API, "$0.28 per million tokens", "$0.42 per million tokens", "Wikipedia reports approximate February 2025 API pricing", "Public list-like reference; realized discounts unknown", "Supports volume-led monetization, not premium pricing"]
      - [DeepSeek R1 comparison, "$0.55 per million tokens", "$2.19 per million tokens", "Tech Insider comparison; model and date context differ from the Wikipedia figure", "Comparison price; realized economics unknown", "Requires tariff and model reconciliation before margin modeling"]
      - [OpenAI o1 comparison, "$15 per million tokens", "$60 per million tokens", "Tech Insider reports launch comparison", "Competitor reference, not DeepSeek realized revenue", "Shows a large headline price spread but not contribution margin"]
    notes: "Prices are reported reference points from different periods and model comparisons; they are not a consistent realized-price series."
    claimRefs: [CI005, CI006]
  - id: TI003
    title: Unit economics and cost proxies
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [API input price, "$0.28-$0.55 per million tokens in cited references", medium, "Sets potential revenue per unit before discounts and mix", "Provide current model-level price cards and realized price"]
      - [API output price, "$0.42-$2.19 per million tokens in cited references", medium, "Output tokens may carry different inference cost and mix", "Provide output-token mix, discounts, and gross profit per million tokens"]
      - [V3 GPU rental cost, "$5.6 million reported", low, "Illustrates training-cost efficiency but is not total cost of ownership", "Reconcile hardware, labor, data, electricity, lease, and depreciation costs"]
      - [Expected 2026 AI infrastructure expenditure, "$1.6 billion reported", medium, "Indicates capital intensity but is not recognized expense or cash burn", "Provide capex versus opex classification, payment timing, and committed spend"]
      - [Net loss for first seven months of 2026, "715 million yuan reported", medium, "Shows accounting losses but not monthly cash consumption", "Provide audited income and cash-flow statements with noncash reconciliations"]
      - [Gross margin, null, low, "No reviewed source reports audited or model-level gross margin", "Provide audited gross margin and contribution margin by API, hosted, and self-managed modes"]
      - ["Cash, burn, and runway", null, low, "Reported funding cannot establish liquidity or the next financing date", "Provide cash, restricted cash, monthly burn, debt, commitments, and a 24-month forecast"]
    notes: "The table separates reported price, cost, expenditure, and loss measures from unavailable unit economics; none of the reported figures should be treated as cash burn or total cost without reconciliation."
    claimRefs: [CI005, CI007, CI009, CI012, CI013, CI015]
figures:
  - id: FI001
    title: From model usage to financial contribution
    type: flow
    summary: DeepSeek's public business model links token usage and deployment choices to revenue, infrastructure cost, and ultimately contribution margin, with key conversion points undisclosed.
    data:
      nodes:
        - {id: user-demand, label: "Developer and enterprise demand", detail: "Public sources describe business and developer API use; account volume is undisclosed."}
        - {id: token-volume, label: "Tokens processed", detail: "Usage-based billing unit for API access."}
        - {id: api-revenue, label: "API revenue", detail: "Reported pricing exists, but realized price and recognized revenue are not public."}
        - {id: compute-cost, label: "Compute and infrastructure cost", detail: "Chips, data centers, electricity, leases, and inference utilization are not fully disclosed."}
        - {id: operating-cost, label: "Research and operating cost", detail: "Talent and other operating costs are not publicly quantified."}
        - {id: contribution-margin, label: "Contribution margin and cash generation", detail: "No audited or model-level public margin bridge was retained."}
      edges:
        - {from: user-demand, to: token-volume}
        - {from: token-volume, to: api-revenue}
        - {from: api-revenue, to: contribution-margin}
        - {from: compute-cost, to: contribution-margin}
        - {from: operating-cost, to: contribution-margin}
    approximationNotes: "The flow is a sourced operating model, not a quantitative forecast; it does not infer conversion rates or margins."
    claimRefs: [CI001, CI005, CI007, CI012, CI015]
callouts:
  - calloutType: risk
    title: Capital adequacy is not demonstrated
    body: Conflicting financing reports, reported infrastructure expenditure, and accounting losses leave cash on hand, burn, debt, and runway unresolved.
    claimRefs: [CI010, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Underwrite only after a financial data room
    body: Require audited revenue recognition, current price cards, gross margin by deployment mode, customer concentration, and a cash-flow/capex bridge before treating reported traction as durable economics.
    claimRefs: [CI003, CI005, CI015]
