schemaVersion: "report-v2"
artifact: market-analysis
slug: deepseek
runDate: 2026-10-24
company:
  name: DeepSeek
chapter:
  number: 2
  title: Market Analysis
  summary: DeepSeek competes in the fast-growing market for foundation-model access, but the defensible opportunity is narrower than the whole AI-platform category. Direct gateway data shows rapid low-cost adoption, while absent company revenue data and a new US federal restriction prevent a supportable company-specific TAM, SAM, or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      DeepSeek's relevant market comprises hosted model inference through chat
      and APIs plus open-weight deployment on customer-controlled infrastructure.
      The boundary excludes chips, general cloud capacity, downstream application
      revenue, and the broader AI development-platform market unless DeepSeek
      captures that spend directly. Layer3 Labs describes consumer chat, a
      developer API, and downloadable weights as the visible routes to use, while
      reporting no formal enterprise sales, professional-services, or support
      tier at publication. Buyers can substitute closed-model APIs, other
      open-weight families, or internal deployment. Those alternatives mean that
      low price and weight availability expand usage but also constrain vendor
      lock-in and the share of ecosystem value that accrues to the model author.
    claimRefs: [CM001, CM012, CM013, CM014]
    tableRefs: [TM001]
  - id: sizing-and-adoption
    title: Sizing and observed adoption
    body: >-
      Gartner forecasts worldwide end-user spending on AI models and platforms
      at $64.252 billion in 2026, up 63.4% from $39.311 billion in 2025. Within
      that total, foundation generative-AI models are forecast at $23.356 billion
      and specialized generative-AI models at $4.910 billion. These category
      figures are not DeepSeek revenue or serviceable market. Direct platform
      observations provide a narrower adoption lens: Vercel reports that DeepSeek
      moved from under 1% to 17% of its gateway tokens in May 2026 while remaining
      near 1% of spend, and OpenRouter reports DeepSeek's token share rose from 9%
      in January to 18% in June. The evidence establishes usage momentum and price
      leverage, not monetization or durable share.
    claimRefs: [CM002, CM003, CM004, CM006, CM007, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-budgets
    title: Buyers, users, and budget ownership
    body: >-
      Adoption splits into distinct purchasing paths rather than a single funnel.
      Application teams can trial a low-cost hosted endpoint; platform teams can
      route production workloads across several models; infrastructure and
      security teams can self-host weights when data control outweighs operational
      simplicity. Gartner says enterprise buyers increasingly evaluate cost,
      latency, performance, reliability, evaluation, and usage tracking together.
      Darden's Michael Albert argues that value is likely to accrue to end uses
      and to firms controlling platforms and data rather than automatically to
      the foundation model. Consumer distribution is visible—Digital in Asia
      reports 130 million monthly active DeepSeek app users as of May 2026—but
      the assigned evidence does not identify the payer, conversion rate, or
      budget owner behind that audience.
    claimRefs: [CM005, CM014, CM015]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      The strongest adoption driver is economical production usage. OpenRouter
      reports that V4-Flash represented 70% of DeepSeek's agentic token flow by
      the end of May 2026, while the State of AI Report cites an estimated 47%
      quarterly decline since 2023 in the cost of reaching a fixed benchmark
      score. Capability remains differentiated: the fetched Artificial Analysis
      comparison places DeepSeek V4.1 Flash tenth in both Finance & Accounting
      and Strategy & Ops, not at the frontier across every domain. Constraints
      are commercial and political as well as technical. CNBC reports a US
      federal civilian-agency ban covering DeepSeek technology and third-party
      products built with its models. For valuation, broad category growth and
      routed-token share should therefore be treated as demand signals, not as
      substitutes for revenue, retention, margin, or a verified serviceable
      market.
    claimRefs: [CM008, CM009, CM010, CM011, CM016]
