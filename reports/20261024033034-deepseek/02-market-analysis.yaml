callouts:
  - calloutType: insight
    title: Usage momentum is not market share in dollars
    body: Vercel and OpenRouter measure routed tokens in their own populations. Those observations show adoption but do not establish DeepSeek revenue, spend share outside Vercel, customer count, retention, or gross margin.
    claimRefs: [CM006, CM007, CM016]
  - calloutType: risk
    title: Compliance narrows the serviceable market
    body: Self-hosting can remove the hosted-service network path, but the reported US federal order covers DeepSeek-related technology, including third-party products built with its models, so deployment architecture does not restore eligibility for that buyer segment.
    claimRefs: [CM011, CM013]
