  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - No financial bridge
        - Management will not provide 2025-2026 revenue gross margin EBITDA cash and debt by segment.
        - The current mark remains narrative-led rather than economically underwritten.
        - Do not treat the Forge anchor as investable price support.
      - - Preference stack is heavy
        - Liquidation preferences or side letters absorb a large share of sub-$1.5B outcomes.
        - Headline valuation diverges from common-equity value.
        - Reprice expected return or walk away.
      - - Liquidity stays weak
        - Independent market work keeps showing lower traded volume without a broad recovery in trusted supply.
        - Exchange and data volumes become weaker revenue proxies.
        - Lean toward the bear case and demand a lower entry.
      - - Partner proofs do not monetize
        - Enverus Constellation or similar launches fail to show paid recurring adoption.
        - Strategic breadth stops translating into valuation quality.
        - Remove bull-case assumptions from the model.
      - - Compliance exposure rises faster than monetization
        - ACE regulated brokerage or disclosure workflows add cost without visible high-margin conversion.
        - Infrastructure complexity becomes discount rather than moat.
        - Increase risk discount and reduce willingness to pay.
      - - No verified current mark
        - No 409A tender or verified 2025-2026 secondary print is provided beyond Forge.
        - Entry price remains a headline without live market depth.
        - Treat current valuation as provisional not confirmed.
    notes: >-
      These are valuation-moving triggers; each one changes the price support behind the thesis rather than merely
      changing the narrative tone.
