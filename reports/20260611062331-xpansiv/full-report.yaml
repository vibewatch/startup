      - number: '3.2'
        title: Substitute channels remain credible because the buyer job can be unbundled
        blocks:
          - type: paragraph
            body: >-
              Many buyers can solve the job without buying the full Xpansiv stack. Evolution Markets and OTX keep
              brokered OTC, structured transactions, and consulting alive as a substitute for order-book-only execution,
              especially where long-term offtakes, hedges, or bespoke sourcing matter more than continuous screen
              liquidity. Direct registry procurement is another substitute: TIGR explicitly says buyers can open their
              own accounts or use intermediaries, which means the default workflow in parts of the market is still
              registry plus broker plus manual retirement rather than a single integrated venue. For sophisticated power
              or clean-fuel operators, internal build is also credible because Xpansiv itself markets APIs, telemetry,
              enterprise data delivery, and compliance automation as value propositions that replace fragmented in-house
              systems. That is strategically important because it implies Xpansiv is often replacing a messy combination
              of tools and relationships, not just one rival exchange. Pricing reinforces the point. The retained corpus
              shows more public packaging detail for Xpansiv's managed solutions—percentage-based SREC fees and turnkey
              LCFS workflows—than for CME, ICE, CIX, ACX, or Evolution's venue economics. That does not make Xpansiv
              cheaper; it means public evidence on competitor fee schedules is thin, so underwriting should assume
              negotiated enterprise pricing and frequent multi-homing rather than durable public-price lock-in. In
              practice, buyers likely compare a bundled workflow budget against internal labor, registry fees, broker
              commissions, and data subscriptions rather than against one transparent list price from a single
              competitor.
