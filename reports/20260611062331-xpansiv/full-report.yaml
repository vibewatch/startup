            body: >-
              Public materials do not disclose Xpansiv-wide NRR, GRR, churn, renewal rates, or customer satisfaction
              scores, so this chapter cannot claim software-like retention from reported metrics. What the corpus does
              show is workflow embeddedness. Registry users must clear account approval, pay fees, designate verifiers,
              register assets, and submit recurring production data before certificates can be issued. TIGR buyers can
              hold direct accounts or rely on intermediaries, but either path still creates retirement and transparency
              records. Managed Solutions customers hand Xpansiv onboarding, certification, certificate sale, and payment
              processing; that looks more like outsourced operations than a casual marketplace session. Those features
              imply stickier relationships than a simple order book would. Even so, the evidence remains indirect. The
              retained corpus does not show cohort retention, renewal rates by segment, support-quality metrics, or even
              a reliable count of repeat transactors. The most defensible conclusion is that Xpansiv’s infrastructure
              position can create durable workflow dependence, while the actual magnitude of retention is still a
