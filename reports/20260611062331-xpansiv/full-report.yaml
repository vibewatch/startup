companyProfile:
  summary: >-
    Xpansiv is a late-stage private environmental-commodities infrastructure company formed from the 2019 combination of
    CBL and Xpansiv. The platform now spans registries, portfolio and transfer management through Connect, spot exchange
    execution through CBL, brokerage and market execution through Evolution Markets, market data, power software, and
    managed clean-energy and clean-fuels workflows. Public evidence supports meaningful strategic scale, repeated
    backing from major institutional investors, and continued unicorn-level price support, but not the current revenue,
    margin, liquidity, or preference-stack details needed for full underwriting.
