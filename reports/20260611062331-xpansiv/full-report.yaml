        blocks:
          - type: paragraph
            body: >-
              The scenario work is straightforward because the public record is strategically rich and economically
              poor. The bull case says Xpansiv converts today’s breadth into higher-quality revenue: quality-led VCM
              recovery continues, registry and data products monetize the shift toward high-integrity credits,
              electricity and clean-fuels workflows scale, and partner launches such as Enverus and Constellation
              translate into recurring paid activity. The base case is less heroic and more supportable. It assumes
              Forge’s ~$1.4 billion signal is roughly fair because Xpansiv has preserved strategic position, but it also
              assumes that market-liquidity recovery remains incomplete and that investors should not pay for
              undisclosed economics as if they were already proven. The bear case does not require the platform to fail.
              It only requires market mistrust, low liquidity, or preference-stack opacity to persist long enough that
              buyers apply a harder discount to activity metrics and private marks. Independent market sources support
              that caution. Reuters Plus, Ecosystem Marketplace, Climate Focus, and MSCI all describe a market that is
              still quality-led, selective, and trust-constrained rather than broadly re-accelerated. That backdrop
              makes Xpansiv’s latest mark investable only with tight entry discipline and explicit diligence conditions,
