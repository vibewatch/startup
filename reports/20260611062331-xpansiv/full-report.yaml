    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, heritage, and platform composition
        blocks:
          - type: paragraph
            body: >-
              Xpansiv presents itself as a market-infrastructure stack rather than a single exchange. The company’s own
              history page roots the business in CBL, founded in Sydney in 2009 by Ben Stuart and Nathan Rockliff, then
              describes the 2019 transaction in which CBL acquired Xpansiv and the combined business adopted the Xpansiv
              name. Current official materials describe an integrated platform spanning registries, online marketplaces,
              market execution, wholesale power software, portfolio management, and data. The 2025 fact sheet and
              platform overview both frame Xpansiv as an open and neutral infrastructure layer across the environmental
              commodity lifecycle. That positioning matters because the company sits between issuance systems, portfolio
              synchronization, execution venues, and downstream data users. Registry software records and serializes
              instruments, Xpansiv Connect synchronizes positions and transfers, CBL provides spot-market execution, and
              Evolution Markets plus Carbon Financial Services extend the platform into OTC and structured transactions.
              The strongest company-overview conclusion from the reviewed evidence is therefore not simply that Xpansiv
              runs a carbon marketplace, but that it has assembled an acquisition-led operating system for environmental
              commodities and adjacent energy-transition markets.
