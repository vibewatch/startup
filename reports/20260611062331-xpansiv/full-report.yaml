  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Regulatory and market-integrity risk is the sharpest exogenous exposure because California disclosure rules
          and CORSIA governance sit outside Xpansiv's control
        blocks:
          - type: paragraph
            body: >-
              Xpansiv's legal-risk stack starts with the fact that it is no longer just selling generic workflow
              software. Its own AB 1305 pages acknowledge that multiple affiliated entities may be considered to be
              marketing or selling voluntary carbon offsets in California, and the company's disclosures explicitly
              point users back to registry documentation while disclaiming independent verification and legal advice.
              That matters because AB 1305 is designed to reduce greenwashing, not just to add a procedural checkbox. In
              practice, Xpansiv has to keep project-level data, accountability terms, and calculation methods aligned
              across company pages, registry records, and any California-linked marketing claims. The statutory
              requirement is clear; the operational boundary is not. Legal analysis from Keller Heckman and Sidley
              highlights that the law reaches sellers, users, and claim-makers, while leaving ambiguity around what it
              means to market offsets or operate in California. For a platform that intermediates offsets, registries,
              and brokerage-style workflows, that ambiguity keeps residual legal exposure elevated even after disclosure
              pages are live.

              The second regulatory layer is CORSIA. ICAO's own pages make clear that eligibility decisions are
              programme-level, period-bound, and controlled by the ICAO Council and TAB rather than by market operators.
              That creates a direct dependency for ACE and any airline-facing certificate or offset workflow Xpansiv
              wants to support. At the same time, independent market research still shows a trust-and-liquidity deficit
              in the voluntary carbon market. Reuters Plus, Climate Focus, Ecosystem Marketplace, and MSCI all describe
              a market still digesting integrity controversies, governance reform, and lower transaction liquidity even
              as demand for higher-quality supply persists. Xpansiv can position itself on the right side of that
              quality migration, but it cannot insulate itself from the fact that the market's reference standards,
              accepted claims frameworks, and eligible supply pools are being re-written by regulators and standards
              bodies outside the company.
