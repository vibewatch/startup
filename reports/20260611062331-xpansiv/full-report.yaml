      - number: '1.3'
        title: Funding momentum is clear; economic terms are still incomplete
        blocks:
          - type: paragraph
            body: >-
              Xpansiv’s financing history is directionally clear even though not every term is public. Blackstone
              announced a $400 million strategic investment in July 2022. Bank of America’s January 2023 release added
              that Xpansiv simultaneously completed the Evolution Markets acquisition and a linked $125 million capital
              raise with Bank of America and Goldman Sachs participation. Aramco Ventures then announced another round
              in May 2024, but without disclosing the amount. By April 2025, Forge Global showed a last known valuation
              of about $1.4 billion, which is the best post-cutoff public evidence that the company remained in unicorn
              territory. Investor rosters disclosed by Xpansiv and partners now consistently include Blackstone, Bank of
              America, Goldman Sachs, Aramco Ventures, Macquarie, S&P Global Ventures, Aware Super, BP Ventures,
              Commonwealth Bank, and the Australian Clean Energy Finance Corporation. Location evidence is weaker than
              funding evidence but still serviceable: Craft identifies San Francisco as headquarters while Xpansiv’s own
              contact page clearly lists a New York office and international lines for the UK and Australia. The picture
              is of a global late-stage private company with a credible capital base, but with undisclosed 2024 round
              size, undisclosed current revenues, and limited public governance detail.
