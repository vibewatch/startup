            title: Integrity and liquidity stress still cap near-term market velocity
            body: >-
              Independent sources agree that the voluntary carbon market remains in a quality-driven reset with lower
              liquidity and cautious buyers. That does not eliminate the need for infrastructure, but it does limit how
              quickly exchange-like revenues can scale if turnover remains muted.
