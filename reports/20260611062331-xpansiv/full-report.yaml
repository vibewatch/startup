          Pricing is partly visible in registries and managed solutions, while unit economics must be inferred from
          throughput, automation, and customer footprint
        blocks:
          - type: paragraph
            body: >-
              Public pricing is strongest where Xpansiv runs workflow-heavy, rules-driven products. The NAR fee schedule
              provides exact account, asset, and per-certificate fees, and the solar managed-solutions pages publish
              percentage-based EasyREC and Illinois ABP fee schedules plus minimum per-REC service charges. Those
              disclosures show that at least some of Xpansiv's economics are recurring and operationally granular rather
              than pure ad valorem exchange commissions. By contrast, the company does not publish standard rate cards
              for market-data subscriptions, exchange commissions, most brokerage mandates, power-software contracts, or
              clean-fuel revenue sharing. Evolution's data policy makes the point indirectly: fees vary by application,
              users, locations, and data volume, which implies negotiated enterprise monetization. Because company-level
              margins are undisclosed, the best unit-economics proxies are operational breadth and automation. Xpansiv
              cites 15 GW served in power, more than 20% of ERCOT and CAISO battery storage capacity, more than 125,000
              solar customers, about 1.9 GW to 2,000 MW of managed solar assets, more than 500,000 clean-fuel credits
              annually, more than 50,000 clean-fuel assets, and more than 1 billion data points processed. Those metrics
              do not reveal gross profit, but they do show where scale, workflow automation, and data reuse could create
