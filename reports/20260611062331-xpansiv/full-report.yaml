  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          The public price anchor remains in unicorn territory, but disclosure quality is still too thin to treat that
          mark as clean underwriting evidence
        blocks:
          - type: paragraph
            body: >-
              The valuation story starts with a real anchor and then gets hazy. Blackstone’s July 2022 announcement is
              the last clearly disclosed priced financing event in the retained corpus: $400 million into a business it
              described as owning critical software, technology, and a scalable exchange for environmental commodities.
              Bank of America’s January 2023 release then confirmed another $125 million raise tied to that financing
              and to the Evolution Markets acquisition. Aramco Ventures led another raise in 2024, but the amount and
              valuation were not disclosed. Forge’s April 2025 page is therefore the most important post-cutoff market
              datapoint: it shows a $1.4 billion last known valuation, which keeps Xpansiv in unicorn territory but does
              not prove a broad market re-rating. That modest step-up matters because the company simultaneously spent
              the period broadening the platform through acquisitions, registry expansion, power workflows, and more
              strategic investors. If public evidence still only supports a move from roughly $1.2 billion to roughly
              $1.4 billion after all of that, investors should read the signal as resilience, not obvious cheapness. The
              gap is not strategic relevance. The gap is denominator quality: no retained public source discloses
              current revenue, gross margin, EBITDA, cash, debt, burn, or liquidation-preference structure tightly
              enough to convert the headline mark into underwritten common-equity value.
