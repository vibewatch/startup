  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          VCM quality recovery improves paid volume and registry data plus power workflows prove recurring economics
          with manageable senior preferences.
        - >-
          $1.7B-$2.1B headline value range; upside comes from proving Xpansiv is closer to premium infrastructure than
          to a services-heavy platform.
        - Partner launches stay pilot-like or recurring revenue quality proves weaker than the story.
        - Possible but needs private-proof upgrades.
      - - Base
        - >-
          Forge’s ~$1.4B mark is directionally right and infrastructure breadth is real while monetization quality is
          mixed but acceptable.
        - >-
          $1.2B-$1.5B; roughly fair around the current public anchor but not cheap enough to underwrite without more
          files.
        - Liquidity recovery stays partial and private economics remain opaque.
        - Most consistent with the retained corpus.
      - - Bear
        - >-
          Market mistrust and low liquidity persist while data or registry monetization under-converts or the cap table
          proves senior and heavy.
        - $0.7B-$1.0B common-value support; downside can appear even without a dramatic headline valuation reset.
        - Selective demand thin margins or heavy preferences compress common-equity outcomes.
        - Material if diligence disappoints.
      - - Face-value entry check
        - Use Forge as the checkpoint not as proof of clearance.
        - ~$1.4B is defensible only if management can evidence recurring margin-rich revenue and a manageable waterfall.
        - Without that proof face-value entry is stretched rather than conservative.
        - Needs diligence before acceptance.
    notes: >-
      Scenario bands are simple underwriting ranges built from public valuation anchors, market-structure evidence, and
      disclosure quality; they are not a DCF or fairness opinion.
