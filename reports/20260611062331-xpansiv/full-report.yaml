  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Served market boundary: environmental commodities infrastructure, not a single carbon exchange'
        blocks:
          - type: paragraph
            body: >-
              Xpansiv's market should be defined as infrastructure for environmental commodities rather than as a narrow
              voluntary-carbon exchange. The company's exchanges overview, trading-platforms page, and carbon page show
              a stack that spans venue access, standardized contracts, registry connectivity, portfolio management,
              settlement, and data. Its official category map covers carbon, renewable electricity certificates,
              clean-fuel attributes, water rights, and recycled-material credits, while the solutions pages separate
              corporate buyers, traders and brokers, and asset or project owners as distinct workflow owners. That
              boundary matters because the economic problem Xpansiv solves is fragmentation: attributes are issued in
              many registries, priced in fragmented markets, and retired by a different set of actors than those who
              create them. The company's own positioning consistently emphasizes transparent order books, automated
              post-trade settlement, multi-registry connectivity, and audit-ready reporting. Accordingly, included spend
              is not only spot carbon execution. It also includes registry issuance and retirement, portfolio
              synchronization, broker-assisted structured transactions, transaction data, and compliance-oriented
              transfer workflows across renewable, fuels, water, and recycling instruments. Excluded spend is the
              physical decarbonization capex underneath those instruments—solar farms, SAF plants, waste-processing
              facilities, or water infrastructure—as well as generic ESG consulting without marketplace or registry
              workflow. The best way to view Xpansiv's served market is therefore as a multi-sided market-structure
              layer sitting between project issuance, trading and brokerage, and buyer retirement and reporting.
            claimRefs:
