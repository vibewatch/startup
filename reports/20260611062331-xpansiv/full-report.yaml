  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: The visible revenue stack is broad and infrastructure-shaped, not a single exchange-fee story
        blocks:
          - type: paragraph
            body: >-
              Xpansiv's public materials support a genuinely multi-line monetization model. CBL is presented as a
              transparent order-book venue with automated same-day settlement, while buyer and trader pages separately
              stress OTC post-trade settlement that can connect participants without bilateral agreements. That matters
              financially because it implies Xpansiv can monetize both on-screen execution and off-screen workflow
              completion. The company's Data business adds a separate license-like stream: transaction-based, real-time,
              and historical data are sold through API, SFTP, cloud-warehouse, and portal delivery, and the data itself
              is built from CBL and Evolution order flow. Market Execution expands the stack again with brokerage,
              structured transactions, and consulting, which are economically different from exchange commissions.
              Registries and Connect create another layer: NAR, TIGR, and related infrastructure monetize accounts,
              assets, and certificate events rather than pure trade count. Power adds SaaS-style scheduling, settlement,
              telemetry, and operations across all U.S. ISOs, while managed solar and clean-transportation products
              monetize aggregation, onboarding, sale execution, and payment workflows. The result is a diversified
              infrastructure model with many logical fee surfaces, even though Xpansiv still does not publicly disclose
              the actual revenue mix across those surfaces.
