            body: >-
              The module map in the reviewed evidence is unusually broad for a private climate-infrastructure company.
              Registries are software-heavy systems of record with configurable rules, issuance logic, billing, and
              audit support. Connect is the interoperability layer, exposing APIs, position synchronization, and
              role-based access into those registries and linked venues. CBL and the broader exchange stack provide
              transparent order books and straight-through settlement, while ACE and JSE-V show that Xpansiv can package
