              somewhat differently: they are not pure software modules so much as market-access services that use the
              rest of the platform to support brokerage, structured offtakes, advisory work, and portfolio strategy.
              Data and Power extend the model further into enterprise operations. Data monetizes verified transaction
              flow and historical datasets across environmental and energy commodities, while Power combines SaaS
              scheduling, telemetry, settlement support, and around-the-clock operator coverage across all seven U.S.
              ISOs. Managed Solutions, H2OX, and the Digital Fuels Registry then show that Xpansiv can own narrower
              category workflows where customers value outsourced onboarding, compliance administration, or faster
              settlement more than generic software configurability. The result is a hybrid operating model: some
              modules resemble cloud infrastructure, others resemble workflow software, and others still remain
