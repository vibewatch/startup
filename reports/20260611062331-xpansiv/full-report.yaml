          - type: callout
            title: Keep the thesis live not blind
            body: >-
              Proceed only if private diligence can turn the Forge checkpoint into a fully evidenced valuation rather
              than a narrative anchor.
            calloutType: recommendation
            claimRefs:
              - CV040
              - CV045
