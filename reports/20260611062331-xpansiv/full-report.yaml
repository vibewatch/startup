        title: Leadership depth is visible, but governance detail is comparatively thin
        blocks:
          - type: paragraph
            body: >-
              The current executive bench is straightforward to verify from Xpansiv’s leadership page. John Melby is
              chief executive officer; Frank McAnally is chief financial officer; Nathan Rockliff is chief strategy
              officer; Paul Sestili is chief operating officer; Henrik Hasselknippe is chief platform officer; Ben
              Stuart is chief commercial officer; Seshadri Sundaram is chief technology officer; Michael Goldstein is
              general counsel; Erika Crandall is chief risk officer; and Evan Ard remains president of Evolution
              Markets. This line-up suggests that the company has moved well beyond founder-only staffing and now
              emphasizes integration, commercialization, and platform risk management. It also highlights the continuing
              importance of legacy CBL and acquired-business talent: Rockliff and Stuart connect to the exchange
              heritage, while Ard anchors the brokerage franchise brought in through Evolution Markets. What is less
              visible in current public materials is board structure, committee oversight, or ownership concentration.
              That absence does not itself prove weak governance, but it does leave a meaningful diligence gap relative
              to the late-stage valuation signaled by Blackstone and Forge.
