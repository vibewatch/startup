            title: Xpansiv's real TAM is a workflow TAM, not a single commodity TAM
            body: >-
              The public evidence supports a broad workflow opportunity across issuance, trading, settlement, portfolio
              management, and retirement, but it does not support one clean all-in revenue TAM. Investors should treat
              carbon-market size only as the most measurable subset, not as the whole story.
            calloutType: insight
            claimRefs:
