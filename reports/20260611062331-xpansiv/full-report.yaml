              carbon-exchange story. Its own 2025 milestones release describes a platform that covers clean energy and
              power, carbon and emissions, clean fuels and transportation, water, and recycled materials, and spans
              market access, structured transactions, issuance, brokerage, settlement, portfolio management, power
              operations, and data. The same release points to 31% of global REC issuance in 2024 through its REC
              registry network, about 6% of global renewable power capacity represented in its owned REC registries,
              more than 15 GW served in power, roughly one billion asset transfers through Connect, and more than $800
              billion of notional value facilitated by Market Execution since 2020. Enverus strengthens the external
              read-through by saying its MarketView user base can now use Xpansiv spot and OTC data for defensible
              mark-to-market valuation and risk decisions. That is infrastructure behavior, not brochureware. But the
              comparable set still enforces humility. ICE shows what mature transaction-plus-data revenue quality looks
              like; CME shows how environmental products plug into a much larger derivatives machine; AirCarbon Exchange
              shows a smaller digital-native analog. Xpansiv is strategically closer to hybrid exchange infrastructure
              than to a pure broker, yet it still lacks the audited economics that make ICE-like valuation comfort
