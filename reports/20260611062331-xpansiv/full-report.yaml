  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue bridge
        - 2024-2026 revenue by registry exchange brokerage data power and managed-solutions line.
        - Without the denominator the current mark cannot be tied to revenue quality.
        - CFO package board deck and auditor review.
      - - Margin and cash profile
        - Gross margin EBITDA operating cash flow debt and cash balance.
        - Infrastructure breadth can be attractive or value-destructive depending on cost structure.
        - Finance diligence room and lender materials.
      - - Cap table and preferences
        - Full capitalization table liquidation preferences side letters participation rights and employee pool detail.
        - Common-equity value may diverge sharply from headline valuation.
        - Legal counsel transfer agent and board consents.
      - - Current price support
        - 409A tender history any 2025-2026 verified secondary prints and board-approved internal marks.
        - Forge alone is useful but insufficient as a live price discovery mechanism.
        - Finance team and secondary administrator.
      - - Partner-to-paid conversion
        - >-
          Revenue margin and renewal evidence tied to Enverus Constellation ACE registry customers and other launch
          references.
        - Distinguishes strategic relevance from actual monetization.
        - Commercial ops and account-level cohort review.
      - - Market-liquidity sensitivity
        - >-
          Internal exposure analysis showing how VCM liquidity quality premiums and compliance-driven demand affect each
          business line.
        - Clarifies whether diversification truly buffers carbon-market weakness.
        - Strategy team sensitivity model and FP&A scenario pack.
    notes: >-
      These are the minimum files needed to turn Xpansiv from a strategically impressive private asset into a fully
      underwritable investment.
