      - number: '4.3'
        title: >-
          Capital access is real, but present adequacy is impossible to prove because cash, burn, and debt remain
          private
        blocks:
          - type: paragraph
            body: >-
              The chapter-local evidence supports a company that has repeatedly raised capital and kept spending against
              expansion. Blackstone committed $400 million in 2022 and explicitly said the capital would support both
              organic growth and future acquisitions. Bank of America's January 2023 release then tied the Evolution
              Markets acquisition to a further $125 million raise for service offerings and technology platforms, with
              Bank of America and Goldman Sachs joining as strategic investors. Aramco Ventures led another capital
              raise in May 2024, but the amount was not disclosed. By late 2025, Xpansiv had wholly acquired Evident,
              enlarging the REC registry footprint again. That chronology suggests management has been willing to invest
              through product buildout and M&A rather than harvesting disclosed profits. The positive interpretation is
              that investors have repeatedly funded a category leader in market infrastructure. The cautious
              interpretation is that acquisitions and product breadth can mask high integration cost, support cost, and
              ongoing capital need. Public evidence does not establish current cash on hand, monthly burn, runway, debt,
              project-finance obligations, or covenant headroom. Forge's secondary-market valuation signal gives outside
              context but not liquidity proof. Underwriting therefore has to separate 'can still raise' from 'is
              currently well capitalized' and treat the latter as unproven until private financials are produced.
