              gross margin, EBITDA, cash, debt, cap-table terms, or secondary depth beyond a Forge headline. Because
              those missing files sit directly inside valuation, they cannot be treated as side issues. They are the
              difference between a fair private-market price and a stretched one. The recommendation is therefore
              research-more with medium confidence. If management can show that registry, data, and power products carry
              recurring economics, that partner proofs convert into paid volume, and that the liquidation waterfall is
              manageable, the current mark can become defensible or even attractive. If not, common-equity value can
