  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct market-infrastructure peers are real, but they attack different layers of the stack
        blocks:
          - type: paragraph
            body: >-
              Direct competition is not one neat peer set. Xpansiv competes head-on with Climate Impact X and AirCarbon
              Exchange for institutional carbon and REC buyers who want transparent execution, custody, and post-trade
              certainty without building every registry workflow themselves. It also competes indirectly with CME and
              ICE, whose cleared futures and environmental derivatives can absorb price discovery and trader attention
              even if they do not present the same full-stack procurement workflow in the retained sources. The key
              Xpansiv difference in the corpus is platform breadth: its exchanges page plus commodity, data, power, and
              solutions pages show one family that spans spot venues, brokerage, registries, portfolio data, power
              operations, and managed compliance workflows. CIX is the closest public analog on integrated custody and
              execution because it lets customers hold assets from 11 registries inside a CIX account, pairs that with
              market intelligence, and is backed by large financial institutions. ACX looks more like a specialist
              exchange with disclosed member and country scale but much less visible workflow breadth. CME and ICE
              matter because benchmark contracts, clearing, and incumbent distribution can commoditize the pure venue
              layer even when Xpansiv wins on operating workflow.
