      - number: '2.4'
        title: Growth drivers and constraints point to infrastructure need, but they also cap near-term market velocity
        blocks:
          - type: paragraph
            body: >-
              The most constructive demand drivers for Xpansiv are compliance overlap, reporting pressure, and registry
              fragmentation. ICAO's CORSIA scheme makes international aviation the clearest example of voluntary and
              compliance logic converging around standardized eligible units, which is why both Xpansiv ACE and Climate
              Impact X launched CORSIA-linked trading workflows. California's AB 1305 disclosure regime adds another
              transparency burden by forcing more project, methodology, and accountability detail into the market. More
              generally, Xpansiv's own messaging to buyers and traders keeps returning to one core need: participants
              require audit-ready reporting, trusted data, and settlement across many registries without duplicative
              bilateral operations. Independent exchange and futures infrastructure reinforces that price transparency
              matters. CME lists physically settled CBL GEO, N-GEO, and C-GEO futures; ICE maintains broader carbon and
              environmental derivatives; ACX and CIX both position themselves around transparency, custody, settlement,
              and multi-registry access. But the constraints are equally real. Reuters Plus describes a confidence
              crisis, flat retirements, and falling spot prices; Climate Focus says integrity concerns and regulatory
              uncertainty still affect demand; Ecosystem Marketplace says liquidity remains lower even as demand holds
              up; and MSCI says high-quality demand is outstripping supply while governance and delivery risks remain
              material. The result is a market where infrastructure remains necessary but not uniformly monetizable.
              Xpansiv benefits when customers need better tracking, pricing, and transfer tooling, yet it is still
              exposed to slower turnover, cautious buyers, and policy ambiguity in the underlying environmental-credit
              markets. For underwriting, that means the bullish case should rest less on a generic "huge carbon market"
              narrative and more on whether Xpansiv can convert fragmented, compliance-adjacent workflows into recurring
              registry, data, settlement, and exchange economics across categories.
