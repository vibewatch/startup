            title: Multi-registry and multi-category infrastructure broadens addressable spend
            body: >-
              Xpansiv is not confined to voluntary carbon. Its official footprint spans REC registries, low-carbon
              fuels, water rights, recycled-material credits, and related settlement and data workflows, which can
              diversify exposure away from any one product class.
            calloutType: strength
            claimRefs:
