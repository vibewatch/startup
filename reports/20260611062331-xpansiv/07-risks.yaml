  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - AB 1305 / greenwashing exposure
        - Disclosure challenge or mismatch between website claims and registry evidence
        - Material inconsistency, takedown demand, or formal counsel warning
        - Pause underwriting until claim-control and legal-review workflow is remediated.
      - - CORSIA eligibility dependence
        - Approved programme list changes
        - Relevant programme loses approval or narrows for the next compliance period
        - Mark down aviation-linked growth assumptions and verify product fallback plan.
      - - VCM trust / liquidity weakness
        - Market turnover and pricing data
        - Another step-down in transaction volume without offsetting evidence of higher-quality monetization
        - Reduce volume-driven upside assumptions and stress-test exchange revenue sensitivity.
      - - Platform reliability opacity
        - Operational evidence request
        - Company cannot produce uptime, incident, and recovery metrics for core modules
        - Treat infrastructure claims as unproven and widen residual-risk discount.
      - - Partner-channel concentration
        - Named partner share of pipeline or usage
        - One channel or flagship counterparty appears to dominate growth narrative without broader proof
        - Cut channel-quality score and require direct-customer proof outside the flagship set.
      - - Integration execution
        - Control-system evidence
        - No measurable progress on unified controls, migrations, or duplicated-system retirement
        - Assume higher operating friction and extend diligence timeline or pass.
      - - Financial opacity
        - Private KPI request
        - No revenue, gross-margin, burn, runway, or attach-rate disclosure under NDA
        - Do not underwrite monetization upside from product breadth.
      - - Competitive pressure
        - Incumbent exchange substitution
        - Customers treat CME / ICE access as close substitutes for Xpansiv workflows
        - Lower differentiation assumptions and focus diligence on non-commodity workflow stickiness.
    notes: Triggers are intentionally monitorable and tied to observable operating, regulatory, or diligence events rather than to generic sentiment changes.
