  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability-disclosure-gap
      missingEvidence: Product-level uptime, incident history, recovery objectives, and customer SLA attainment for Connect, CBL, registries, and Market Execution.
      whyItMatters: Without operating reliability evidence, investors cannot separate infrastructure-like resilience from marketing claims about scale and automation.
      diligencePath: Request the last 24 months of incident logs, uptime dashboards, customer SLA reports, and any third-party security or resilience audits for each core module.
      relatedQuestionRefs:
        - QR014
      relatedTableRefs:
        - TR002
    - type: private-evidence-only
      severity: material
      topic: concentration-gap
      missingEvidence: Revenue concentration by customer, counterparty, partner, and product line plus attach rates across Connect, CBL, registries, brokerage, and managed solutions.
      whyItMatters: Concentration and cross-sell data determine whether Xpansiv is diversified infrastructure or a narrow set of flagship relationships with fragile economics.
      diligencePath: Obtain cohort revenue by top 10 customers and counterparties, partner-sourced revenue mix, product attach rates, and gross margin by business line under NDA.
      relatedQuestionRefs:
        - QR024
        - QR025
        - QR026
      relatedTableRefs:
        - TR003
        - TR005
    - type: private-evidence-only
      severity: material
      topic: integration-gap
      missingEvidence: Post-acquisition integration KPIs, shared-control attestations, org design for unified operations, and executive or committee cadence for cross-platform risk management.
      whyItMatters: The thesis depends on Xpansiv operating like a unified market-infrastructure platform rather than a portfolio of adjacent brands with separate controls.
      diligencePath: Request integration scorecards, common-control maps, platform architecture ownership charts, and board-level risk reporting that ties acquired businesses into one operating model.
      relatedQuestionRefs:
        - QR027
        - QR028
      relatedTableRefs:
        - TR004
        - TR005
    - type: enumeration-incomplete
      severity: material
      topic: TR001 regulatory coverage boundary
      missingEvidence: Full counsel-grade mapping of every jurisdictional disclosure, claim-support path, and registry dependency across all products that could be captured by the chapter's regulatory risk register.
      whyItMatters: The register is intentionally severity-ranked rather than exhaustive, so investors still need a complete legal coverage map before treating the regulatory perimeter as fully known.
      diligencePath: Build a product-by-jurisdiction compliance matrix covering AB 1305, CORSIA-linked workflows, broker-regulation obligations, and registry-governance dependencies, then reconcile it against website disclosures and contract language.
      relatedQuestionRefs:
        - QR003
        - QR005
      relatedTableRefs:
        - TR001
