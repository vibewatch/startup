    body: Xpansiv has already published AB 1305 and brokerage disclosures, yet the company still depends on external statutes, regulators, and standards bodies for the rules that make those disclosures sufficient. Residual exposure therefore remains high until diligence proves control maturity.
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR010
