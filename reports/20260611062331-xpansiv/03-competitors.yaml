  title: Competitive positioning map — workflow breadth vs institutional market access
  type: quadrant
  layout: wide
  summary: Evidence-backed ordinal scoring suggests Xpansiv leads on workflow breadth, while CME and ICE lead on incumbent market access and distribution.
