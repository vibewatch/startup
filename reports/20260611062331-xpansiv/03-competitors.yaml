- id: TP004
  title: Moat durability / competitive risk register — where Xpansiv is strongest and where risk is highest
  columns:
  - Moat claim
  - Evidence
  - Threat / substitute
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Integrated workflow breadth
    - Xpansiv visibly spans exchanges, brokerage, registries, data, power, and managed solutions
    - Specialists can still cherry-pick the highest-liquidity layer
    - Medium
    - Ask for attach rates across workflow layers, not just venue usage
  - - Registry and portfolio integration
    - Data, Connect-linked products, ACE subaccounts, and custody workflows raise operational stickiness
    - CIX custody plus direct registry accounts narrow the advantage
    - High
    - Request evidence of customers using multiple Xpansiv layers and the churn rate after onboarding
  - - Brokered OTC plus structured transactions
    - Evolution and OTX make Xpansiv stronger in bespoke markets than a pure exchange peer
    - OTC capability may remain substitutable and relationship-driven
    - Medium
    - Split revenue by brokered OTC, exchange, registry, and data to test concentration
  - - Managed operational services
    - Solar, power, and clean-fuel pages show Xpansiv can own recurring workflow and reporting tasks
    - Large operators may still build internally or use niche service providers
    - Medium
    - Request gross-margin and retention data for managed workflows versus venue-only customers
  - - Trust and institutional distribution
    - CIX has bank-linked shareholders; incumbents have exchange trust; market integrity remains a concern
    - Integrity skepticism or stronger incumbent brands can steer flow away from Xpansiv
    - High
    - Review win/loss data by buyer type and ask how integrity concerns affect conversion
  - - Pure liquidity moat
    - CME, ICE, ACX, and CIX all offer viable routes to price discovery or execution
    - Multi-homing can compress take rates and reduce exclusivity
    - High
    - Ask for venue share, active-account overlap, and evidence that data or registry hooks prevent easy venue switching
  notes: The risk register focuses on durability, not just feature comparison; severity reflects competitive pressure on retention and monetization rather than existential binary risk.
  enumerationScope:
    coverage: partial
    basis: Summarizes the principal moat claims and threats supported by retained evidence for the major competitive channels relevant to Xpansiv today.
