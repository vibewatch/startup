  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Public fee schedules, custody charges, clearing costs, and broker commissions for Xpansiv, CIX, ACX, CME, ICE, and Evolution.
    whyItMatters: Without comparable pricing disclosure, investors cannot tell whether Xpansiv wins on economics, bundle breadth, or simply negotiated packaging.
    diligencePath: Request customer proposals, fee cards, and broker commission schedules by channel, then normalize pricing by workflow layer.
    relatedQuestionRefs:
    - QP014
    - QP015
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: multi-homing-economics
    missingEvidence: Customer-level data on attach rates across registry, data, execution, and managed workflows plus actual multi-homing behavior by buyer type.
    whyItMatters: The chapter’s moat judgment depends on whether bundled workflow actually reduces churn or whether customers still route trades and data across several venues.
    diligencePath: Ask management for cohort retention, cross-sell penetration, and venue overlap for the top customer segments.
    relatedQuestionRefs:
    - QP018
    - QP019
    - QP026
    relatedTableRefs:
    - TP004
