    - label: Climate Impact X
      x: 7
      y: 7
      tone: opportunity
      detail: Custody plus 11-registry access and bank-backed shareholder network make it the closest integrated direct peer in carbon and RECs.
    - label: AirCarbon Exchange
      x: 4
      y: 6
      tone: neutral
      detail: Specialist exchange with disclosed member and country scale, but less visible workflow breadth in the retained corpus.
    - label: CME Group
      x: 4
      y: 10
      tone: risk
      detail: Cleared futures, benchmark contracts, and institutional distribution are strong even without full-stack workflow breadth.
    - label: ICE
      x: 5
      y: 10
      tone: risk
      detail: Environmental contracts benefit from a much broader incumbent commodity venue relationship.
    - label: Evolution / OTX
      x: 7
      y: 7
      tone: opportunity
      detail: High-touch brokerage, structured transactions, and networked execution extend Xpansiv beyond order-book competition.
    - label: Direct registry / internal
      x: 3
      y: 4
      tone: warning
      detail: A credible substitute for sophisticated buyers, but operationally fragmented and weaker on consolidated execution.
