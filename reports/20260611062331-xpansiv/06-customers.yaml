  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics-gap
    missingEvidence: Product-level NRR, GRR, churn, renewal, and customer satisfaction metrics for managed solutions, registries, exchange, and data products.
    whyItMatters: Without explicit cohort or renewal metrics, durability can only be inferred from workflow design rather than verified through customer behavior.
    diligencePath: Request renewal cohorts, churn reasons, support KPIs, and any board reporting on retention by product line.
    relatedQuestionRefs:
    - QU015
    - QU016
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer concentration, segment revenue mix, and direct-vs-channel revenue split across major Xpansiv business lines.
    whyItMatters: Visible anchors such as Constellation and Enverus may overstate or understate real concentration because public materials do not quantify revenue dependence.
    diligencePath: Request top-10 customer revenue share, product-line customer counts, and channel-vs-direct bookings by business unit.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-proof-coverage
    missingEvidence: A fuller set of named enterprise customers with deployment status, contract type, outcome metrics, and whether each relationship is direct or channel-mediated.
    whyItMatters: Current public proof is concentrated in a handful of logos, and several of those logos are better read as partner or ecosystem proof than as direct customer wins.
    diligencePath: Request a customer reference list that classifies each named account as direct customer, participant, channel partner, or ecosystem collaborator.
    relatedQuestionRefs:
    - QU005
    - QU007
    - QU008
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: complaints-gap
    missingEvidence: Customer complaint logs, dispute history, material terminations, and failed deployment records across enterprise and managed-solutions products.
    whyItMatters: The absence of public complaints is not strong satisfaction proof in a market where many relationships are private and review surfaces are thin.
    diligencePath: Ask management for churn interviews, escalated support cases, legal disputes with customers, and material implementation failures from the last 24 months.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
