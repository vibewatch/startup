- id: named-proof-and-relationship-quality
  title: Named proof exists, but much of it is partner or channel evidence rather than clean end-customer proof
  body: 'Named public proof for Xpansiv should be treated carefully because several visible logos sit somewhere between customer, distribution partner, liquidity participant, and ecosystem collaborator. Constellation is the strongest customer-adjacent example in the retained corpus because the release names a specific product launch on CBL, gives a go-live date, and ties the exchange workflow to NAR-issued nuclear ZEC traceability. Enverus is different: the May 2026 release proves real distribution into MarketView’s 8,000-user workflow, but it does not show that all downstream users are direct Xpansiv customers. Puro.earth’s partner page is clearer about intermediary status than end-customer status, positioning Xpansiv as a route into carbon-removal trading rather than as the underlying buyer. Trafigura and MSCI quotes on the Connect page add valuable ecosystem validation, yet those endorsements still do not disclose whether the relationship is software seat, data feed, market participation,
    or co-marketing. That ambiguity matters for diligence. Xpansiv clearly has real market touch points and recognizable counterparties, but only a subset of those relationships can be treated as production customer proof without management clarification.'
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
