- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Registry-to-execution cross-sell
    - Dependent on active counterparties, standards bodies, and eligible supply
    - High strategic upside if issuance users also trade and retire through Xpansiv
    - Request module attach rates across registries, Connect, CBL, and Evolution
  - - Managed Solutions channel expansion
    - Large long-tail base may still have low ARPU or high support intensity
    - High for customer count growth; unknown for margin quality
    - Request gross margin, churn, and partner conversion by state and by installer cohort
  - - Data distribution via Enverus and similar channels
    - Channel partners may own the primary end-user relationship
    - Medium-high because embedded distribution can scale reach quickly
    - Request direct-vs-channel revenue split and renewal economics for data products
  - - Named enterprise anchors such as Constellation
    - A small number of visible anchors can dominate perception and possibly revenue
    - Medium-high because few named launches are public
    - Request top-10 customer concentration and enterprise pipeline by product
  - - Voluntary carbon buyer activity
    - Liquidity and buyer demand can weaken when market integrity is questioned
    - High for carbon-focused desks and exchange activity
    - Track liquidity, retirements, and mix shift toward higher-integrity products
  - - Alternative institutional venues
    - Buyers and traders can route activity through other exchanges or brokers
    - Medium because Xpansiv is strong but not the only workflow option
    - Benchmark win rates, pricing, and participant overlap against alternative venues
  - - Registry / standards / government relationships
    - Some important counterparties are both customers and dependencies, raising governance risk
    - High because policy or methodology changes can affect user demand directly
    - Request contract terms, exclusivity limits, and concentration by standards-linked programs
  notes: Risk rows emphasize where customer expansion and ecosystem dependence are intertwined rather than independent.
