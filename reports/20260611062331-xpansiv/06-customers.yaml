  title: Named customer proof table
  columns:
  - Customer / relationship
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof quality
  - Limitation
  rows:
  - - Constellation
    - Power producer / clean-energy supplier
    - Launch annual EFEC trading on CBL with NAR-issued ZEC traceability
    - Live market launch announced for 2025-12; hourly products planned
    - Strongest named customer-adjacent proof because the release names the instrument, venue, registry, and go-live date
