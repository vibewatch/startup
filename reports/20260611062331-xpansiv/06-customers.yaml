- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Value / status
  - Segment
  - Confidence
  - Diligence ask
  rows:
  - - Net revenue retention (NRR)
    - Not disclosed
    - Company-wide
    - Low
    - Request product-level NRR or at least renewal / expansion rates by major business line
  - - Gross revenue retention (GRR)
    - Not disclosed
    - Company-wide
    - Low
    - Request churned revenue and cancellation history by product and segment
  - - Churn / customer satisfaction scores
    - Not disclosed
    - Company-wide
    - Low
    - Request support KPIs, CSAT / NPS, and complaint escalation data
  - - Registry repeat usage signal
    - Structural repeat activity implied by asset approval, issuance, transfer, and retirement workflows
    - NAR / TIGR / Evident users
    - Medium
    - Request renewal rates for registry accounts and average annual transfer / retirement activity per account
  - - Managed Solutions repeat usage signal
    - Operational stickiness implied because Xpansiv runs registration, certificate sale, and payment processing
    - Solar and clean-transportation users
    - Medium
    - Request average customer lifetime, cancellation reasons, and cohort retention by state program
  - - Public complaint / failed deployment history
    - No clear public review corpus or named failure event found
    - Enterprise and long-tail segments
    - Low
    - Request churn interviews, support backlog data, and any material customer disputes or terminations
  notes: The public corpus supports workflow-based durability inferences, but not numeric retention metrics or satisfaction evidence.
