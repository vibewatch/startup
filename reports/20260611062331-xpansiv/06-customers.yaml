tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Corporate / end buyers
    - Sustainability, procurement, finance, and reporting teams; payer is corporate budget owner
    - Source RECs, carbon, and clean-fuel instruments; track and retire certificates; support disclosures
    - CBL access to hundreds of qualified participants and project-specific instruments
    - High strategic value because claims, procurement, and reporting can expand into data and Connect
    - No disclosed conversion from buyer participation to paying-software seats
  - - Traders, brokers, and financial institutions
    - Trading desks, brokers, intermediaries, risk teams; payer is trading business
    - Execute spot or OTC trades, access pricing, and manage cross-market exposure
    - CBL reports 1,100+ participants from 200+ organizations; Enverus targets trading houses, brokers, and FIs
    - Important for liquidity and data monetization
    - Active participants are not the same as recurring software customers
  - - Asset & project owners
    - Developers, generators, fuel producers, solar operators; payer is asset owner or sponsor
    - Register assets, issue certificates, monetize output, structure offtakes, and manage clean-fuel workflows
    - 300 GW of registered assets; 1.9 GW managed-solution assets; 50,000+ clean-fuel assets
    - Strategic because issuance and administration can expand into brokerage, exchange, and reporting
    - Segment-level revenue mix is undisclosed
  - - Power producers & utilities
    - Generation owners, schedulers, structured-transactions teams; payer is producer or utility
    - Operate assets across ISOs, hedge power or REC exposure, and manage bundled or unbundled clean-energy sales
    - All 7 U.S. ISOs served; >20% of ERCOT and CAISO battery storage capacity referenced
    - Potentially large ACV and durable workflow embedding
    - Public customer names are sparse beyond Constellation and a sample REC agreement
  - - Managed Solutions long tail
    - Solar installers, homeowners, businesses, EV charging and fleet operators; payer is participant or revenue-share customer
    - Outsource registration, certification, credit sale, payment, and compliance reporting
    - 125,000+ customers/systems, 600 partners, multi-state support, 500,000+ clean-fuel credits annually
    - Best evidence of mass-customer scale and recurring operational touchpoints
    - Named end-customer outcomes and retention cohorts are not public
  - - Registry / standards / program participants
    - Retail purchasers, project accounts, verifiers, program administrators, standards-linked participants
    - Operate registry accounts, approve assets, verify generation, and retire credits
    - NAR account types and TIGR buyer/intermediary modes show multiple user roles
    - Supports high switching costs and governance relevance
    - Hard to separate customers from dependency partners in public disclosures
  notes: Rows group customer cohorts by workflow and payer logic; several scale signals are participant or asset counts rather than direct revenue disclosures.
