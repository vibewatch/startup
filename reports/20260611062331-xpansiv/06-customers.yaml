    - High-quality proof of downstream reach into 8,000+ users across 500+ sites
    - Downstream users should not be counted as direct Xpansiv customers without confirmation
  - - Puro.earth
    - Carbon-removal intermediary partner
    - List Xpansiv as an intermediary partner for access to transparent carbon-removal trading infrastructure
    - Active partner listing
    - Good proof that Xpansiv is accepted as a route into buyer workflows for removals
    - Partner proof rather than a named end-buyer deployment
  - - Trafigura
    - Market participant / collaborator
    - Quoted on Connect page discussing collaboration with Xpansiv to build transparency and liquidity
    - Active collaboration claimed
    - Named quote from a major market participant improves reference quality
    - The page does not disclose whether Trafigura is a software customer, venue participant, or ecosystem collaborator
  - - MSCI Carbon Markets
    - Data / analytics collaborator
    - Quoted on Connect page about carbon-market data and analytics adding value through an open market platform
    - Active collaboration claimed
    - Named quote suggests ecosystem validation around data and market infrastructure
    - The relationship is not clean end-customer proof and may reflect channel or content collaboration instead
