company:
  name: Xpansiv
chapter:
  number: 6
  title: Customers
summary: Xpansiv serves a broad mix of corporates, intermediaries, asset owners, generators, registries, and long-tail managed-solutions users, but the public evidence is uneven across segments. Managed Solutions supplies the clearest scaled customer proof, while enterprise adoption is best evidenced through CBL participant depth, registry workflows, and a small set of named ecosystem relationships such as Constellation, Enverus, Puro.earth, Trafigura, and MSCI. Retention, churn, and top-customer concentration remain largely undisclosed, so durability must be inferred from workflow embedding rather than from reported cohort metrics.
sections:
- id: customer-segmentation-and-adoption
  title: Customer segmentation is broad, but public adoption proof is strongest in workflow-heavy and long-tail cohorts
  body: 'Xpansiv’s customer map is unusually heterogeneous for a private infrastructure company. Public solution pages split the base into environmental commodity buyers, traders and brokers, asset and project owners, power producers, solar installers, homeowners and businesses, EV charging and fleet operators, and registry/program participants. Those are not just marketing labels: each segment is tied to a distinct buying job and workflow. Corporate buyers are pushed toward sourcing, reporting, and retirement across RECs, carbon, and clean fuels; traders and brokers are pushed toward liquidity, data, and post-trade settlement; asset owners and power producers are pushed toward issuance, monetization, structured offtakes, scheduling, and ISO operations; and long-tail managed-solution users are pushed toward outsourced registration, compliance administration, and payment processing. The clearest scaled adoption proof comes from the managed-solutions surfaces, which state 125,000+ customers
    or systems, roughly 1.9-2.0 GW under management, 600 partner relationships, and state-by-state support coverage. Enterprise and institutional surfaces also show meaningful breadth—CBL advertises 1,100+ participants from 200+ organizations and Connect advertises 1 billion assets transferred annually—but those are activity and participant metrics, not clean counts of paying Xpansiv customers.'
