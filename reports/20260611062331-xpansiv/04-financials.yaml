  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cash-runway
      missingEvidence: >-
        Current cash balance, monthly burn, runway months, and management’s explicit next-round
        trigger thresholds.
      whyItMatters: >-
        A private market-infrastructure company can look strategically important while still
        carrying a near-term financing need; without cash and burn data, capital adequacy cannot be
        underwritten directly.
      diligencePath: >-
        Request the last 12 months of management accounts, board cash-bridge materials, and monthly
        cash-flow forecasts tied to covenant and hiring assumptions.
      relatedQuestionRefs: [QI015]
    - type: private-evidence-only
      severity: material
      topic: debt-and-contingent-liabilities
      missingEvidence: >-
        Debt facilities, acquisition earn-outs, project-finance guarantees, working-capital lines,
        and any collateral or liquidity covenants.
      whyItMatters: >-
        Exchange, registry, and settlement businesses can carry obligations that do not appear in
        product marketing, yet those obligations shape downside resilience and financing
        flexibility.
      diligencePath: >-
        Request the debt schedule, acquisition purchase agreements, guarantee register, and legal
        memo on contingent obligations and regulatory capital requirements.
      relatedQuestionRefs: [QI016]
    - type: private-evidence-only
      severity: material
      topic: gross-margin-disclosure
      missingEvidence: >-
        Gross margin, contribution margin, and support-cost allocation by exchange, registry, data,
        power, and managed-solutions business line.
      whyItMatters: >-
        The underwriting case depends on whether higher-touch businesses subsidize low-liquidity
        products or whether software, data, and registry lines already carry durable recurring
        gross profit.
      diligencePath: >-
        Request segment P&Ls with direct cost allocations, support headcount by product, and
        cohort-level contribution analysis for power, data, registry, and managed-services
        customers.
      relatedQuestionRefs: [QI023]
      relatedTableRefs: [TI005]
