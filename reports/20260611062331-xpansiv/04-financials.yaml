company:
  name: Xpansiv
chapter:
  number: 4
  title: Financials
  summary: >-
    Xpansiv shows a broad, infrastructure-style monetization surface across exchange execution,
    OTC settlement, registries, managed solutions, data, brokerage, and power software, and
    several of those lines have concrete public pricing. The investment case is still constrained
    by missing company-level revenue, margin, burn, cash, and runway disclosure, so the financial
    verdict is strategically positive but underwritten with material opacity and clear
    volume-sensitivity risk.
sections:
  - id: monetization-stack
    title: The visible revenue stack is broad and infrastructure-shaped, not a single exchange-fee story
    body: >-
      Xpansiv's public materials support a genuinely multi-line monetization model. CBL is
      presented as a transparent order-book venue with automated same-day settlement, while buyer
      and trader pages separately stress OTC post-trade settlement that can connect participants
      without bilateral agreements. That matters financially because it implies Xpansiv can
      monetize both on-screen execution and off-screen workflow completion. The company's Data
      business adds a separate license-like stream: transaction-based, real-time, and historical
      data are sold through API, SFTP, cloud-warehouse, and portal delivery, and the data itself
      is built from CBL and Evolution order flow. Market Execution expands the stack again with
      brokerage, structured transactions, and consulting, which are economically different from
      exchange commissions. Registries and Connect create another layer: NAR, TIGR, and related
      infrastructure monetize accounts, assets, and certificate events rather than pure trade
      count. Power adds SaaS-style scheduling, settlement, telemetry, and operations across all
      U.S. ISOs, while managed solar and clean-transportation products monetize aggregation,
      onboarding, sale execution, and payment workflows. The result is a diversified
      infrastructure model with many logical fee surfaces, even though Xpansiv still does not
      publicly disclose the actual revenue mix across those surfaces.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI008
      - CI009
      - CI012
      - CI040
      - CI044
