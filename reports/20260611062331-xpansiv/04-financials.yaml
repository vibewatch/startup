callouts:
  - calloutType: strength
    title: More than one revenue engine is publicly visible
    body: >-
      Exchange execution is only one part of the model. Registry fees, market data, managed
      solutions, brokerage, and power software all appear to be meaningful monetization surfaces.
    claimRefs:
      - CI040
      - CI044
  - calloutType: risk
    title: Public disclosure opacity is still the main underwriting blocker
    body: >-
      The chapter-local evidence does not establish revenue, gross margin, cash, burn, runway, or
      debt, so the capital story is directionally positive but not directly underwritten.
    claimRefs:
      - CI043
      - CI045
  - calloutType: risk
    title: Carbon-market weakness can hit both volume and data demand
    body: >-
      If turnover weakens in fragile carbon markets, Xpansiv can lose not only execution fees but
      also some of the underlying activity that feeds data products and discretionary workflow
      demand.
    claimRefs:
