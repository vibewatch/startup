  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Revenue by line of business
        - Cannot determine whether exchange, registry, data, power, or managed solutions drives economics
        - Request segment revenue for 2024-2026 with YoY growth and customer concentration
      - - Gross margin by line
        - Cannot judge which businesses are software-like versus service-heavy
        - Request segment gross margin and direct-cost allocation methodology
      - - Cash balance and monthly burn
        - Cannot measure liquidity cushion or timing risk for the next financing event
        - Request monthly cash bridge and forecast to 18 months
      - - Runway months under base and downside scenarios
        - Cannot test whether market contraction is manageable without another raise
        - Request downside scenario model tied to carbon-volume and hiring assumptions
      - - Realized exchange take rates and brokerage commissions
        - Cannot convert visible transaction flow into revenue expectations
        - Request take-rate history by venue and product
      - - Data customer count, ACV, and renewal
        - Cannot judge quality of recurring revenue or durability of data economics
        - Request ARR bridge, logo count, ACV distribution, and net retention
      - - Power software ARR and services mix
        - Cannot determine whether power is a scalable software line or labor-intensive services business
        - Request bookings, ARR, implementation revenue, and margin by power product
      - - Debt, guarantees, and acquisition earn-outs
        - Cannot assess hidden balance-sheet pressure or contingent cash use
        - Request debt schedule, guarantee register, and acquisition payment obligations
    notes: >-
      These are the exact gaps blocking a full financial model; each row maps to a concrete
      management request rather than a generic “more diligence” placeholder.
    claimRefs:
      - CI039
      - CI043
      - CI045
