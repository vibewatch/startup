evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Current revenue, EBITDA or cash-flow disclosure and any management discussion of profitability or burn.
    whyItMatters: >-
      Late-stage infrastructure underwriting depends on whether scale metrics convert into durable fee revenue and cash
      generation.
    diligencePath: Request management financial deck, lender materials, or audited statements for 2024-2025.
    relatedQuestionRefs:
      - QO018
      - QO019
  - type: missing-source
    severity: material
    topic: governance-and-leadership-table-TO002
    missingEvidence: Board composition, committee structure, voting control, and investor governance rights.
    whyItMatters: >-
      An acquisition-heavy private platform with multiple regulated-adjacent businesses needs clear governance and
      control visibility beyond the named executive roster.
    diligencePath: Request board list, committee charters, shareholder agreement summaries, and latest cap table.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: funding-round-terms-and-milestone-table-TO004
    missingEvidence: Size, security type, and price/valuation terms of the May 2024 Aramco-led capital raise.
    whyItMatters: >-
      The company clearly remained fundable, but round terms determine whether the current unicorn narrative reflects
      fresh price discovery and close the chronology gap in the milestone table.
    diligencePath: Obtain financing announcement deck, subscription documents, or shareholder update describing the 2024 round.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO004
