companyProfile:
  summary: >-
    Xpansiv is a late-stage private environmental-commodities infrastructure company formed from
    the 2019 combination of CBL and Xpansiv. The platform now spans registries, portfolio and
    transfer management through Connect, spot exchange execution through CBL, brokerage and market
    execution through Evolution Markets, market data, power software, and managed clean-energy and
    clean-fuels workflows. Public evidence supports meaningful strategic scale, repeated backing
    from major institutional investors, and continued unicorn-level price support, but not the
    current revenue, margin, liquidity, or preference-stack details needed for full underwriting.
  foundedDate: "2019-01-01"
  founders:
    - name: "Ben Stuart"
      role: "CBL co-founder; current Chief Commercial Officer"
      background: "Xpansiv traces its operating lineage to CBL, which the company says was co-founded in Sydney in 2009 by Ben Stuart and Nathan Rockliff before the combined business adopted the Xpansiv name in 2019."
      claimRefs: [CO001, CO002, CO006]
    - name: "Nathan Rockliff"
