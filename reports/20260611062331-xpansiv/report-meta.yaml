      claimRefs: [CO001, CO002, CO004]
  foundingLocation: "Sydney, Australia (operating lineage via CBL)"
  headquarters: "San Francisco, CA, USA"
  productSummary: >-
    Xpansiv sells market infrastructure for environmental commodities: registry software,
    certificate issuance and transfer workflows, Connect-based portfolio management,
    exchange and OTC settlement rails, brokerage and structured transactions, market data,
    wholesale power software, and managed solutions for solar, clean transportation, and
    related certificate programs.
  customerFocus: >-
    Corporates, traders and brokers, project and asset owners, registry participants,
