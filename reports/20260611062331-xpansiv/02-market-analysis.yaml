callouts:
  - calloutType: insight
    title: Xpansiv's real TAM is a workflow TAM, not a single commodity TAM
    body: >-
      The public evidence supports a broad workflow opportunity across issuance, trading,
      settlement, portfolio management, and retirement, but it does not support one clean all-in
      revenue TAM. Investors should treat carbon-market size only as the most measurable subset,
      not as the whole story.
    claimRefs:
      - CM006
      - CM014
      - CM028
  - calloutType: strength
    title: Multi-registry and multi-category infrastructure broadens addressable spend
    body: >-
      Xpansiv is not confined to voluntary carbon. Its official footprint spans REC registries,
      low-carbon fuels, water rights, recycled-material credits, and related settlement and data
      workflows, which can diversify exposure away from any one product class.
    claimRefs:
      - CM002
      - CM011
      - CM012
      - CM044
      - CM045
      - CM046
  - calloutType: risk
    title: Integrity and liquidity stress still cap near-term market velocity
    body: >-
      Independent sources agree that the voluntary carbon market remains in a quality-driven reset
      with lower liquidity and cautious buyers. That does not eliminate the need for
      infrastructure, but it does limit how quickly exchange-like revenues can scale if turnover
      remains muted.
    claimRefs:
      - CM014
      - CM020
      - CM023
      - CM026
