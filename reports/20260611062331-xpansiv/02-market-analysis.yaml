    title: Market definition table — included spend, excluded spend, and why the market is broader than carbon-only
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Xpansiv
    rows:
      - - Voluntary carbon and CORSIA credits
        - Exchange execution, OTC settlement, registry-linked transfers, standardized contracts, price data
        - Project development capex, direct forestry project ownership, generic climate consulting
        - Corporates, airlines, traders, brokers
        - Core current market with the deepest third-party data and the clearest benchmark contracts
      - - Renewable electricity certificates (RECs, I-RECs, hourly RECs, ZECs)
        - Registry issuance, transfers, retirements, trading, portfolio tracking
        - Underlying power-generation capex and retail electricity spend
        - Corporate energy buyers, utilities, retailers, project owners
        - Large existing registry footprint and strong cross-border attribute infrastructure
      - - Low-carbon fuels and transportation attributes
        - TERC issuance, tracking, retirement, brokerage, clean-fuel certificate workflows
        - Physical fuel supply contracts and refinery capex
        - Fuel producers, voluntary buyers with scope 3 exposure, logistics operators
        - Adjacency that extends Xpansiv beyond carbon into transport decarbonization
      - - Water rights and allocations
        - Exchange fees, settlement, pricing, market data, portfolio workflows
        - Physical water infrastructure and irrigation equipment
        - Irrigators, traders, enterprises
        - Shows Xpansiv is also monetizing scarce-resource market infrastructure outside emissions
      - - Recycled-material credits
        - Registry, transfer, retirement, reporting, portfolio visibility
        - Recycling-facility capex and waste-hauling operations
        - Brands, manufacturers, sustainability teams
        - Expands the platform into Scope 3 and circularity claims
      - - Cross-market data, connect, and post-trade infrastructure
        - Price data, settlement, registry connectivity, audit-ready reporting
        - Standalone ESG software without market workflow
        - Risk teams, trading desks, operations, finance
        - High-value infrastructure layer that can span all commodity categories
    notes: >-
      Rows enumerate the major monetizable workflow categories visible in official product pages;
      excluded spend captures physical project or commodity economics outside Xpansiv's
      infrastructure layer.
