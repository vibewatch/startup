  - id: constrained-sizing-lenses
    title: Sizing must use constrained lenses, because public sources do not support one clean multi-commodity TAM
    body: >-
      Public evidence is strong enough to support market lenses, but not a single defensible
      blended TAM for everything Xpansiv touches. The cleanest independent denominator is still
      voluntary carbon. Ecosystem Marketplace's 2025 review says 2024 transaction volumes fell
      25%, prices declined only 5.5%, and retirements reached 182 million tons, indicating
      resilience in end-user demand despite weaker turnover. The same evidence shows a market
      shifting toward newer vintages and removals, with meaningful price premiums for
      higher-integrity supply. Reuters Plus adds the sharper downside context: the market
      plateaued at roughly $1.4 billion, retirements were flat, and a broader confidence crisis
      slowed growth. Climate Focus likewise describes 2024 as a difficult year marked by
      regulatory uncertainty and integrity concerns, while noting pockets of growth and rising
      weight for recent vintages. For Xpansiv, however, carbon is only the most externally
      measurable slice. The company's nearer-term addressable market is better proxied by
      infrastructure activity and installed asset coverage across categories: $2 billion-plus
      cumulative notional traded on its trading platforms, 17-plus registry integrations,
      1.3 billion RECs issued in NAR, 200 GW of I-REC(E) capacity in 60-plus countries, a
      voluntary fuels registry based on one-ton TERC units, and environmental-credit workflows
      that extend into water and recycled materials. That is why this chapter uses a TAM-SAM-SOM
      lens only in a constrained sense. The broad TAM is environmental-attribute infrastructure
      across multiple categories; the nearer SAM is the set of markets where Xpansiv already has
      live registry, exchange, brokerage, or data products; and SOM cannot be calculated from
      public data because revenue mix, take rates, and category-level GMV are undisclosed.
    claimRefs:
