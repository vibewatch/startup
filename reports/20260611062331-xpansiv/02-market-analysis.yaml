  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: evidence-gap
      missingEvidence: Product-level revenue mix, take rates, and GMV by carbon, RECs, fuels, water, and recycled materials.
      whyItMatters: >-
        Without category economics, public evidence cannot support a real SOM or judge whether
        non-carbon adjacencies are meaningful revenue contributors.
      diligencePath: Request management reporting that breaks revenue, gross margin, and volume by product family and by transaction, registry, and data line.
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: valuation-relevance
      missingEvidence: Independent 2026 volume or pricing disclosures for Xpansiv's REC, fuels, water, and recycled-material workflows.
      whyItMatters: >-
        Current public evidence is strongest in voluntary carbon; weaker adjacent-market
        disclosures could lead investors to overstate diversification.
      diligencePath: Obtain 2025 and YTD 2026 operating dashboards or customer-volume cohorts by product family.
      relatedQuestionRefs:
        - QM026
        - QM027
      relatedTableRefs:
        - TM002
        - TM004
    - type: missing-source
      severity: minor
      topic: buyer-segmentation
      missingEvidence: Customer-count or cohort evidence for each buyer segment and the share of revenue tied to sustainability teams versus trading desks or project owners.
      whyItMatters: >-
        The chapter can map workflows and budget owners, but it cannot rank segment concentration
        or churn risk from public materials.
      diligencePath: Ask management for top-customer concentration, segment mix, and new-logo pipeline by buyer archetype.
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM003
