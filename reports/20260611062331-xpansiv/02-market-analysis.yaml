  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication for market adoption
      - Implication for Xpansiv
      - Diligence ask
    rows:
      - - CORSIA compliance linkage and standardized EEUs
        - Driver
        - Current through first compliance phase
        - Pushes airlines toward standardized, eligible, budgetable carbon instruments
        - Supports ACE and related settlement / eligibility tooling
        - What airline share or EEU volumes actually flow through Xpansiv venues?
      - - AB 1305 and broader disclosure pressure
        - Driver
        - Current / rising
        - Raises the value of project, methodology, and accountability data in voluntary offsets
        - Supports audit-ready reporting, registry links, and transparency tooling
        - How much customer demand or pricing uplift comes from disclosure support?
      - - Registry fragmentation and multi-jurisdiction issuance
        - Driver
        - Structural / persistent
        - Creates operational pain in transfers, retirements, and double-counting control
        - Favors Connect, registries, and white-label marketplace infrastructure
        - What share of revenue is registry / connectivity versus exchange commissions?
      - - Need for price transparency and benchmark contracts
        - Driver
        - Current
        - Institutional buyers and traders prefer visible benchmarks and standardized terms
        - Supports CBL contracts, data products, and futures-linked ecosystem participation
        - How sticky is transaction-based data revenue relative to trading volume?
      - - Growth of renewable-energy and clean-fuel attribute workflows
        - Driver
        - Current but uneven by region
        - Extends environmental-attribute demand beyond carbon-only use cases
        - Broadens served market into RECs, ZECs, TERCs, and related claims workflows
        - Which non-carbon categories are growing fastest in volume and gross profit?
      - - VCM integrity crisis and greenwashing risk
        - Constraint
        - Current / unresolved
        - Slows discretionary buyer adoption and pushes more diligence per trade
        - Can reduce turnover even when infrastructure remains necessary
        - How exposed is Xpansiv revenue to lower spot turnover in voluntary carbon?
      - - Lower liquidity and cautious buyer behavior
        - Constraint
        - Current
        - Lower turnover reduces commissions and weakens benchmark formation
        - Pressures exchange economics; may increase reliance on registry / data revenue
        - What were 2024-2025 carbon, REC, and fuels volume trends by product?
      - - Fragmented standards and policy uncertainty
        - Constraint
        - Structural
        - Increases legal, compliance, and methodology complexity across products
        - Raises product-maintenance cost but also supports infrastructure value
        - How much regulatory / methodology maintenance cost sits inside gross margin?
      - - Shortage of high-integrity supply
        - Constraint
        - Current
        - Keeps buyers active but concentrated in narrower project types
        - Can compress activity breadth even if higher-quality segments hold up
        - Which product types retain liquidity and price power on Xpansiv venues?
    notes: >-
      Directions and timing synthesize official workflow evidence with independent market-health
      sources; several diligence asks remain unresolved because Xpansiv does not disclose
      product-level economics publicly.
