  - id: buyers-users-payers
    title: Buyer, user, and payer segmentation is multi-sided and budget-owner specific
    body: >-
      Xpansiv's user base is not one monolithic "carbon buyer" segment. The company's buyer page
      centers procurement, high-integrity sourcing, and credible reporting for corporate
      sustainability teams. Its trader and broker page instead emphasizes deep liquidity,
      transparent pricing, position valuation, and reliable settlement, which maps to market-making
      desks, commodity traders, and brokers rather than corporate sustainability teams. Its asset
      and project owner page points to yet another group: developers and operators who want to
      issue attributes, secure structured offtakes, monetize renewable generation, battery
      storage, SRECs, LCFS credits, or other certificates, and then track and retire them with
      audit trails. Compliance-linked users create additional pockets of demand. ACE is explicitly
      designed for airlines transacting CORSIA-eligible units and the GEO CORSIA CP1 contract,
      while JSE-V Carbon serves carbon and I-REC participants in South Africa through a
      white-label marketplace model. Water users are different again: H2OX markets live pricing,
      parcel visibility, and fast settlement to irrigators, traders, and enterprises in
      Australian water-rights markets. Across those segments, the budget owner changes. Corporate
      certificate programs tend to sit with sustainability, procurement, finance, or risk;
      airline offset buying is closer to compliance and fuel-procurement functions; trading desks
      sit under portfolio and risk teams; and asset owners pay out of commercial, operations, or
      project-finance budgets. That segmentation is strategically important because Xpansiv can
      win for different reasons in each segment—compliance workflow, liquidity, traceability, or
      monetization—rather than by selling a single standardized SaaS seat.
    claimRefs:
      - CM029
      - CM030
