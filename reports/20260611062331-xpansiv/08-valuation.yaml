  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table-opacity
      missingEvidence: Current cap table, liquidation preferences, participation rights, side letters, and common-equity waterfall analysis.
      whyItMatters: Headline valuation can overstate realizable value if senior terms absorb downside or base-case exits.
      diligencePath: Obtain board-approved capitalization table, financing documents, and waterfall model from company counsel and finance.
      relatedQuestionRefs: [QV028]
      relatedTableRefs: [TV005, TV006]
    - type: private-evidence-only
      severity: material
      topic: financial-opacity
      missingEvidence: 2024-2026 revenue by segment plus gross margin, EBITDA, operating cash flow, debt, and cash balance.
      whyItMatters: Without the economic denominator, investors cannot tell whether $1.4B is attractive, fair, or stretched.
      diligencePath: Request audited or board-grade financial bridge and latest lender package from the CFO.
      relatedQuestionRefs: [QV029]
      relatedTableRefs: [TV003, TV006]
    - type: missing-source
      severity: material
      topic: secondary-opacity
      missingEvidence: Verified 2025-2026 409A marks, tender outcomes, secondary prints, and order-book depth beyond the Forge headline.
      whyItMatters: A single headline valuation does not show whether there is real depth or only indicative pricing.
      diligencePath: Request recent 409A, transfer-agent history, and any tender or approved secondary transaction memos.
      relatedQuestionRefs: [QV030]
      relatedTableRefs: [TV003, TV005, TV006]
    - type: private-evidence-only
      severity: material
      topic: partner-to-paid-conversion
      missingEvidence: Account-level revenue and margin evidence showing whether registry, data, and partnership launches convert into durable paid adoption.
      whyItMatters: Strategic relevance only supports valuation if it turns into recurring revenue quality rather than into activity metrics alone.
      diligencePath: Review cohort revenue, pipeline-to-bookings, and renewal data for Enverus, Constellation, ACE, and major registry customers.
