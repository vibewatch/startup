schemaVersion: report-v2
artifact: valuation
slug: xpansiv
runDate: '2026-06-11'
company:
  name: Xpansiv
chapter:
  number: 8
  title: Valuation
  summary: >-
    Forge’s April 2025 ~$1.4B signal says Xpansiv still clears unicorn territory, but the public
    record does not show the revenue, margin, cash-flow, or preference-stack evidence needed to
    underwrite a bullish entry at face value. The best-supported stance is research-more with
    medium confidence and a fair-to-stretched valuation view that can improve only if private
    diligence proves recurring registry, data, and power economics.
sections:
  - id: price-anchor-and-disclosure
    title: The public price anchor remains in unicorn territory, but disclosure quality is still too thin to treat that mark as clean underwriting evidence
    body: >-
      The valuation story starts with a real anchor and then gets hazy. Blackstone’s July 2022
      announcement is the last clearly disclosed priced financing event in the retained corpus:
      $400 million into a business it described as owning critical software, technology, and a
      scalable exchange for environmental commodities. Bank of America’s January 2023 release then
      confirmed another $125 million raise tied to that financing and to the Evolution Markets
      acquisition. Aramco Ventures led another raise in 2024, but the amount and valuation were not
      disclosed. Forge’s April 2025 page is therefore the most important post-cutoff market
      datapoint: it shows a $1.4 billion last known valuation, which keeps Xpansiv in unicorn
      territory but does not prove a broad market re-rating. That modest step-up matters because the
      company simultaneously spent the period broadening the platform through acquisitions, registry
      expansion, power workflows, and more strategic investors. If public evidence still only
      supports a move from roughly $1.2 billion to roughly $1.4 billion after all of that,
      investors should read the signal as resilience, not obvious cheapness. The gap is not
      strategic relevance. The gap is denominator quality: no retained public source discloses
      current revenue, gross margin, EBITDA, cash, debt, burn, or liquidation-preference structure
      tightly enough to convert the headline mark into underwritten common-equity value.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV031, CV032, CV033, CV038, CV039, CV042]
    tableRefs: [TV002]
    figureRefs: [FV002]
  - id: breadth-and-comparable-frame
    title: Xpansiv deserves to be framed as hybrid market infrastructure, but the right comparables still argue for discipline rather than enthusiasm
    body: >-
      The best reason Xpansiv still deserves a premium framing is that the company is no longer
      just a carbon-exchange story. Its own 2025 milestones release describes a platform that
      covers clean energy and power, carbon and emissions, clean fuels and transportation, water,
      and recycled materials, and spans market access, structured transactions, issuance,
      brokerage, settlement, portfolio management, power operations, and data. The same release
      points to 31% of global REC issuance in 2024 through its REC registry network, about 6% of
      global renewable power capacity represented in its owned REC registries, more than 15 GW
      served in power, roughly one billion asset transfers through Connect, and more than $800
      billion of notional value facilitated by Market Execution since 2020. Enverus strengthens the
      external read-through by saying its MarketView user base can now use Xpansiv spot and OTC
      data for defensible mark-to-market valuation and risk decisions. That is infrastructure
      behavior, not brochureware. But the comparable set still enforces humility. ICE shows what
      mature transaction-plus-data revenue quality looks like; CME shows how environmental products
      plug into a much larger derivatives machine; AirCarbon Exchange shows a smaller digital-native
      analog. Xpansiv is strategically closer to hybrid exchange infrastructure than to a pure
      broker, yet it still lacks the audited economics that make ICE-like valuation comfort
      possible.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV017, CV018, CV019, CV020, CV027, CV028, CV029, CV030]
    tableRefs: [TV004]
    figureRefs: [FV004]
  - id: scenario-range-and-entry-discipline
    title: Bull, base, and bear cases are all plausible, which is exactly why a face-value entry should be treated as fair-to-stretched
    body: >-
      The scenario work is straightforward because the public record is strategically rich and
      economically poor. The bull case says Xpansiv converts today’s breadth into higher-quality
      revenue: quality-led VCM recovery continues, registry and data products monetize the shift
      toward high-integrity credits, electricity and clean-fuels workflows scale, and partner
      launches such as Enverus and Constellation translate into recurring paid activity. The base
      case is less heroic and more supportable. It assumes Forge’s ~$1.4 billion signal is roughly
      fair because Xpansiv has preserved strategic position, but it also assumes that
      market-liquidity recovery remains incomplete and that investors should not pay for undisclosed
      economics as if they were already proven. The bear case does not require the platform to fail.
      It only requires market mistrust, low liquidity, or preference-stack opacity to persist long
      enough that buyers apply a harder discount to activity metrics and private marks. Independent
      market sources support that caution. Reuters Plus, Ecosystem Marketplace, Climate Focus, and
      MSCI all describe a market that is still quality-led, selective, and trust-constrained rather
      than broadly re-accelerated. That backdrop makes Xpansiv’s latest mark investable only with
      tight entry discipline and explicit diligence conditions, not with automatic bullishness.
    claimRefs: [CV021, CV022, CV023, CV024, CV025, CV026, CV034, CV035, CV036, CV042, CV043, CV044, CV046, CV047, CV049, CV051]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: recommendation-and-diligence-conditions
    title: The right output is research-more; strategic strength is real, but the final investment decision still belongs to private diligence rather than to public narrative
    body: >-
      On public evidence alone, Xpansiv looks like a strategically important infrastructure asset
      with real optionality across registries, compliance-linked workflow, brokerage, data, power
      software, and managed services. That is enough to reject a lazy bearish view. It is not
      enough to write a bullish check at face value. The unresolved problem is structural: the
      retained corpus does not disclose current revenue mix, gross margin, EBITDA, cash, debt,
      cap-table terms, or secondary depth beyond a Forge headline. Because those missing files sit
      directly inside valuation, they cannot be treated as side issues. They are the difference
      between a fair private-market price and a stretched one. The recommendation is therefore
      research-more with medium confidence. If management can show that registry, data, and power
      products carry recurring economics, that partner proofs convert into paid volume, and that the
      liquidation waterfall is manageable, the current mark can become defensible or even
      attractive. If not, common-equity value can disappoint even without a headline down-round. The
      practical answer is to keep the thesis live, but only behind a tight diligence list and clear
      thesis-break triggers tied to disclosure, market-liquidity recovery, and monetization
      quality.
    claimRefs: [CV031, CV032, CV037, CV038, CV039, CV040, CV041, CV042, CV043, CV044, CV045, CV048, CV052, CV053]
    tableRefs: [TV001, TV005, TV006]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Assessment, Basis]
    rows:
      - [Recommendation, research-more, Public evidence supports a serious diligence case but not a bullish entry at face value.]
      - [Confidence, medium, Strategic position is corroborated but the economic denominator and cap table are still opaque.]
      - [Risk rating, high, Liquidity recovery plus integrity-led market selectivity and preference-stack opacity can all reset common-equity value.]
      - [Valuation stance, fair-to-stretched, Forge’s ~$1.4B signal looks roughly fair in the base case and stretched if private economics disappoint.]
      - [Public price support, ~$1.2B to ~$1.4B visible, The retained corpus shows a disclosed 2022 $1.2B anchor and a 2025 ~$1.4B secondary-style signal but no cleaner current round price.]
      - [Decision implication, Diligence before price commitment, Require audited financial bridge current 409A or secondary support and liquidation-waterfall detail before underwriting the mark.]
    notes: >-
      This summary evaluates public evidence only; it is not a fairness opinion and does not assume
      favorable preference-stack terms.
    claimRefs: [CV001, CV004, CV040, CV041, CV042, CV045]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Dimension, Thesis, Anti-thesis]
    rows:
      - [Platform breadth, Xpansiv now spans exchange brokerage registries power data and managed workflows across multiple environmental asset classes., Breadth can hide integration cost and services intensity if segment-level economics are not disclosed.]
      - [Registry moat, Registry software Connect integrations and recurring onboarding or issuance steps create infrastructure-style lock-in., Moat quality is hard to price without disclosed retention gross margin or paid-usage conversion.]
      - [Market position, Forge still shows a unicorn-scale value and strategic investors kept funding the platform through 2024., A $1.4B signal only modestly above the 2022 disclosed anchor is resilience not obvious upside.]
      - [Compliance exposure, ACE NAR and regulated futures disclosures suggest Xpansiv can monetize compliance-linked workflows as markets formalize., Compliance also increases operational and legal burden while ICAO and other frameworks sit outside Xpansiv’s control.]
      - [Quality-led recovery, Independent market work suggests demand persists for higher-integrity newer-vintage credits and related workflows., The same independent work also says liquidity is lower and broad market trust remains incomplete.]
      - [Comparable frame, The business merits an exchange-plus-data-plus-registry infrastructure lens rather than a pure broker lens., It does not yet merit mature ICE-like valuation confidence because audited revenue quality remains private.]
    notes: >-
      The anti-thesis focuses on what would invalidate price support, not on whether Xpansiv matters
      strategically.
    claimRefs: [CV005, CV006, CV007, CV016, CV020, CV021, CV022, CV025, CV030, CV031, CV032, CV033]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, VCM quality recovery improves paid volume and registry data plus power workflows prove recurring economics with manageable senior preferences., $1.7B-$2.1B headline value range; upside comes from proving Xpansiv is closer to premium infrastructure than to a services-heavy platform., Partner launches stay pilot-like or recurring revenue quality proves weaker than the story., Possible but needs private-proof upgrades.]
      - [Base, Forge’s ~$1.4B mark is directionally right and infrastructure breadth is real while monetization quality is mixed but acceptable., $1.2B-$1.5B; roughly fair around the current public anchor but not cheap enough to underwrite without more files., Liquidity recovery stays partial and private economics remain opaque., Most consistent with the retained corpus.]
      - [Bear, Market mistrust and low liquidity persist while data or registry monetization under-converts or the cap table proves senior and heavy., $0.7B-$1.0B common-value support; downside can appear even without a dramatic headline valuation reset., Selective demand thin margins or heavy preferences compress common-equity outcomes., Material if diligence disappoints.]
      - [Face-value entry check, Use Forge as the checkpoint not as proof of clearance., ~$1.4B is defensible only if management can evidence recurring margin-rich revenue and a manageable waterfall., Without that proof face-value entry is stretched rather than conservative., Needs diligence before acceptance.]
    notes: >-
      Scenario bands are simple underwriting ranges built from public valuation anchors,
      market-structure evidence, and disclosure quality; they are not a DCF or fairness opinion.
    claimRefs: [CV034, CV035, CV036, CV042, CV043, CV044]
  - id: TV004
    title: Comparable valuation table
    columns: [Comparable, Metric anchor, Multiple / valuation / status, Relevance, Limitation]
    rows:
      - [Xpansiv 2022 Blackstone round, $400M strategic investment, ~$1.2B post-money anchor, Last clearly disclosed priced financing event in the retained corpus., Dated before the 2024-2025 integrity reset and later platform expansion.]
      - [Xpansiv 2025 Forge signal, Secondary-style market reference, ~$1.4B last known valuation, Latest public valuation signal and best current checkpoint., Not a disclosed primary round and not enough to reveal waterfall economics.]
      - [ICE, Public exchange operator with transaction data and listings revenue, Public audited market-infrastructure benchmark, Useful read-through for mature revenue quality in exchange-plus-data infrastructure., Far larger more diversified and more heavily regulated than Xpansiv.]
      - [CME environmental suite, Derivatives and physically settled voluntary-carbon contracts tied to CBL delivery, Public exchange ecosystem reference, Shows how Xpansiv products already feed a larger derivatives market., Derivatives-heavy model is not the same as Xpansiv’s hybrid exchange-registry-services stack.]
      - [AirCarbon Exchange, 21 Mt transacted 190 active members 30 countries represented, Private digital carbon-exchange analog, Useful for digital-native voluntary-carbon market infrastructure comparison., Narrower disclosed breadth and smaller visible scale than Xpansiv.]
      - [Partner-channel proof set, Enverus and Constellation launches, Commercial validation not a trading multiple, Shows Xpansiv can become embedded in valuation workflows and clean-energy certificate markets., Partner proofs still do not disclose Xpansiv’s own revenue conversion or margin.]
    notes: >-
      This table exhaustively covers the comparable frame used in this chapter: two Xpansiv
      anchors, two large public infrastructure references, one digital carbon-exchange analog, and
      one channel-validation row.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This table exhaustively covers the benchmark set actually used in the valuation argument for
        this chapter and intentionally mixes priced anchors, public infrastructure references, and
        model-appropriate analogs.
    claimRefs: [CV001, CV004, CV014, CV027, CV028, CV029, CV030, CV049, CV050, CV051, CV053]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns: [Trigger, Threshold, Transmission to thesis, Action implication]
    rows:
      - [No financial bridge, Management will not provide 2025-2026 revenue gross margin EBITDA cash and debt by segment., The current mark remains narrative-led rather than economically underwritten., Do not treat the Forge anchor as investable price support.]
      - [Preference stack is heavy, Liquidation preferences or side letters absorb a large share of sub-$1.5B outcomes., Headline valuation diverges from common-equity value., Reprice expected return or walk away.]
      - [Liquidity stays weak, Independent market work keeps showing lower traded volume without a broad recovery in trusted supply., Exchange and data volumes become weaker revenue proxies., Lean toward the bear case and demand a lower entry.]
      - [Partner proofs do not monetize, Enverus Constellation or similar launches fail to show paid recurring adoption., Strategic breadth stops translating into valuation quality., Remove bull-case assumptions from the model.]
      - [Compliance exposure rises faster than monetization, ACE regulated brokerage or disclosure workflows add cost without visible high-margin conversion., Infrastructure complexity becomes discount rather than moat., Increase risk discount and reduce willingness to pay.]
      - [No verified current mark, No 409A tender or verified 2025-2026 secondary print is provided beyond Forge., Entry price remains a headline without live market depth., Treat current valuation as provisional not confirmed.]
    notes: >-
      These are valuation-moving triggers; each one changes the price support behind the thesis
      rather than merely changing the narrative tone.
    claimRefs: [CV021, CV023, CV025, CV037, CV038, CV039, CV044, CV045, CV047, CV048, CV052, CV053]
  - id: TV006
    title: Final diligence asks table
    columns: [Topic, Missing evidence, Why it matters, Owner or diligence path]
    rows:
      - [Revenue bridge, 2024-2026 revenue by registry exchange brokerage data power and managed-solutions line., Without the denominator the current mark cannot be tied to revenue quality., CFO package board deck and auditor review.]
      - [Margin and cash profile, Gross margin EBITDA operating cash flow debt and cash balance., Infrastructure breadth can be attractive or value-destructive depending on cost structure., Finance diligence room and lender materials.]
      - [Cap table and preferences, Full capitalization table liquidation preferences side letters participation rights and employee pool detail., Common-equity value may diverge sharply from headline valuation., Legal counsel transfer agent and board consents.]
      - [Current price support, 409A tender history any 2025-2026 verified secondary prints and board-approved internal marks., Forge alone is useful but insufficient as a live price discovery mechanism., Finance team and secondary administrator.]
      - [Partner-to-paid conversion, Revenue margin and renewal evidence tied to Enverus Constellation ACE registry customers and other launch references., Distinguishes strategic relevance from actual monetization., Commercial ops and account-level cohort review.]
      - [Market-liquidity sensitivity, Internal exposure analysis showing how VCM liquidity quality premiums and compliance-driven demand affect each business line., Clarifies whether diversification truly buffers carbon-market weakness., Strategy team sensitivity model and FP&A scenario pack.]
    notes: >-
      These are the minimum files needed to turn Xpansiv from a strategically impressive private
      asset into a fully underwritable investment.
    claimRefs: [CV037, CV038, CV039, CV040, CV045, CV048, CV052, CV053]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Xpansiv clears the strategic-quality bar, but public economic opacity still blocks a bullish recommendation.
    data:
      nodes:
        - { id: A, label: Infrastructure breadth, detail: Registries exchange brokerage power data and managed workflows are all visible in the corpus., tone: positive }
        - { id: B, label: External validation, detail: Enverus and Constellation show downstream workflow relevance beyond marketing copy., tone: positive }
        - { id: C, label: Market backdrop, detail: VCM demand is quality-led selective and still trust-constrained., tone: warning }
        - { id: D, label: Economic opacity, detail: Revenue margin cash flow and preference-stack terms are still private., tone: warning }
        - { id: E, label: Decision, detail: research-more and fair-to-stretched until private diligence closes the denominator and waterfall gaps., tone: neutral }
      edges:
        - { from: A, to: E, label: supports strategic interest }
        - { from: B, to: E, label: supports relevance }
        - { from: C, to: E, label: raises discount rate }
        - { from: D, to: E, label: blocks conviction }
    approximationNotes: This flow summarizes underwriting logic rather than a numeric model.
    claimRefs: [CV006, CV014, CV021, CV032, CV040]
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The supportable mark moves quickly as disclosure quality and market conditions change.
    data:
      items:
        - { label: Bear / weak disclosure, value: 0.85, detail: Market mistrust persists and the cap table or margin profile disappoints., tone: negative }
        - { label: Base / current public support, value: 1.35, detail: Rough midpoint of the most defensible public band around the Forge signal., tone: warning }
        - { label: Forge checkpoint, value: 1.4, detail: Latest public valuation signal in the retained corpus., tone: neutral }
        - { label: Bull / proof-upside, value: 1.9, detail: Requires high-quality recurring economics and manageable preferences., tone: positive }
    approximationNotes: Values are simple USD billions used as underwriting checkpoints, not management guidance or observed clearing prices.
    claimRefs: [CV004, CV021, CV022, CV023, CV025, CV042]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: The valuation range is wide because public proof is strategic while the key economic files remain private.
    data:
      items:
        - { label: Bear, low: 0.7, mid: 0.85, high: 1.0, displayValue: '$0.7B-$1.0B', detail: Low liquidity thin economics or a heavy waterfall compress common value., tone: negative }
        - { label: Base, low: 1.2, mid: 1.35, high: 1.5, displayValue: '$1.2B-$1.5B', detail: Strategic relevance is real but economics are only partly proven., tone: warning }
        - { label: Bull, low: 1.7, mid: 1.9, high: 2.1, displayValue: '$1.7B-$2.1B', detail: Recurring infrastructure economics prove strong and market quality recovery continues., tone: positive }
        - { label: Forge reference, low: 1.4, mid: 1.4, high: 1.4, displayValue: '~$1.4B', detail: Useful checkpoint but still not a full diligence substitute., tone: neutral }
    approximationNotes: Ranges are scenario-based USD billions and should be read as headline-value bands pending private diligence on capital structure.
    claimRefs: [CV033, CV034, CV035, CV036, CV043, CV044]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Strategic positioning scores higher than evidence quality and downside protection.
    data:
      items:
        - { label: Platform breadth, score: 9, detail: The retained corpus supports a genuinely multi-asset infrastructure stack., tone: positive }
        - { label: Monetization surfaces, score: 7, detail: Registry fees managed-solution fees data and execution workflows are visible but segment revenue is not., tone: positive }
        - { label: Market relevance, score: 8, detail: Partner and data-channel evidence shows Xpansiv matters inside environmental-market workflows., tone: positive }
        - { label: Evidence quality, score: 4, detail: Financial disclosure remains too thin for conviction underwriting., tone: warning }
        - { label: Downside protection, score: 3, detail: Preference-stack and secondary-depth opacity weaken common-equity confidence., tone: warning }
        - { label: Valuation support, score: 5, detail: The current mark is plausible but not obviously cheap on public evidence., tone: warning }
    approximationNotes: Scores are investment-committee heuristics on a 1-10 scale built only from retained public evidence.
    claimRefs: [CV007, CV014, CV020, CV032, CV038, CV041, CV042]
callouts:
  - calloutType: strength
    title: Real infrastructure position
    body: Xpansiv has enough product breadth partner validation and workflow depth to be treated as real infrastructure rather than as a speculative carbon app.
    claimRefs: [CV007, CV014, CV031]
  - calloutType: risk
    title: Opacity is the main discount
    body: The biggest public risk is not whether Xpansiv matters; it is whether the current price hides thin margins or a heavy liquidation stack.
    claimRefs: [CV038, CV039, CV042]
  - calloutType: recommendation
    title: Keep the thesis live not blind
    body: Proceed only if private diligence can turn the Forge checkpoint into a fully evidenced valuation rather than a narrative anchor.
    claimRefs: [CV040, CV045]
