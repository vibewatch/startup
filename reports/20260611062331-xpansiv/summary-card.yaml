  headline: >-
    Xpansiv looks like strategically important climate-market infrastructure with credible unicorn price support and
    real workflow breadth, but persistent financial and cap-table opacity plus a fragile voluntary-carbon backdrop keep
    the correct public-markets posture at research-more.
