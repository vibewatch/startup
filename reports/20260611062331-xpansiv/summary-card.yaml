  topStrengths:
    - >-
      Hybrid exchange-plus-registry-plus-data infrastructure model spans multiple fee surfaces instead of relying on a
      single carbon spot venue.
    - >-
      Public scale signals are meaningful: Connect processes about 1B asset transfers annually and Xpansiv claims
      registry software support for 80%+ of global carbon credits and 60%+ of North American RECs.
    - >-
      Strategic investors including Blackstone, Bank of America, Goldman Sachs, and Aramco Ventures repeatedly funded
      platform expansion and acquisitions.
    - >-
      The company preserved unicorn-level public price support, with Forge showing an approximately $1.4B last-known
      valuation in April 2025.
    - >-
      Platform breadth across registries, brokerage, data, power, and managed solutions gives Xpansiv more resilience
      than a pure voluntary-carbon exchange.
  topRisks:
    - >-
      Public sources still do not disclose company-level revenue, gross margin, EBITDA, burn, cash, debt, or
      liquidation-preference terms tightly enough to underwrite a face-value entry.
    - >-
      Voluntary carbon markets remain integrity- and liquidity-constrained, with selective demand and ongoing trust,
      governance, and greenwashing scrutiny.
    - >-
      California AB 1305 disclosures, CORSIA eligibility governance, and broader standards-body decisions sit outside
      Xpansiv's control but can directly affect workflow value.
    - >-
      The platform has been assembled through acquisitions and multiple product surfaces without public uptime,
      incident, integration, or segment-profitability evidence.
    - >-
      Partner and flagship-launch proof points may validate relevance without proving durable paid conversion or margin
      quality.
  unresolvedGaps:
    - 2024-2026 revenue bridge by registries, exchange, brokerage, data, power, and managed-solutions line.
    - Gross margin, EBITDA, cash balance, debt, burn, and runway for the consolidated business.
    - >-
      Full cap table, liquidation preferences, side letters, and any verified 2025-2026 409A, tender, or secondary-print
      support beyond Forge.
    - >-
      Partner-to-paid conversion and renewal evidence for Enverus, Constellation, ACE, registry, and power-related
      workflows.
    - >-
      Post-acquisition integration KPIs, uptime, incident-response metrics, customer concentration, and module-level
      profitability.
