- id: scale-metrics-and-context
  title: The platform shows real scale, but it still depends on carbon-market confidence
  body: The most important take-away from the reviewed sources is that Xpansiv’s scale claims are substantial enough to matter if they hold, but they remain heavily company-communicated. Xpansiv Connect says it manages more than one billion asset transfers annually across more than 17 registries and trading platforms. The Aramco Ventures announcement goes further, stating that Xpansiv software supports more than 80% of global carbon credits and 60% of North American RECs, while CBL holds a 90%+ share of exchange-traded settled carbon credits. The December 2025 milestones release adds that the REC network issued 31% of global RECs in 2024, that CBL has facilitated over 330 million carbon credits and more than 14 million RECs and EACs since 2020, and that Evolution Markets has facilitated more than $800 billion in notional value since 2020. Those numbers support the central company-overview thesis that Xpansiv is meaningful infrastructure. At the same time, independent market sources remind
    us that infrastructure quality is only as valuable as market confidence in the underlying asset class. Ecosystem Marketplace, Reuters Plus, and MSCI all describe a voluntary carbon market still working through integrity concerns, flat demand, and quality sorting. That means Xpansiv’s scale should be read as strategically powerful but not immune to underlying market-trust shocks.
