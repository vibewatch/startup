    severity: minor
    topic: funding-round-terms-and-milestone-table-TO004
    missingEvidence: Size, security type, and price/valuation terms of the May 2024 Aramco-led capital raise.
    whyItMatters: The company clearly remained fundable, but round terms determine whether the current unicorn narrative reflects fresh price discovery and close the chronology gap in the milestone table.
