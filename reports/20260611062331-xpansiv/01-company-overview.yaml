  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Current revenue, EBITDA or cash-flow disclosure and any management discussion of profitability or burn.
    whyItMatters: Late-stage infrastructure underwriting depends on whether scale metrics convert into durable fee revenue and cash generation.
    diligencePath: Request management financial deck, lender materials, or audited statements for 2024-2025.
    relatedQuestionRefs:
    - QO018
    - QO019
  - type: missing-source
    severity: material
    topic: governance-and-leadership-table-TO002
    missingEvidence: Board composition, committee structure, voting control, and investor governance rights.
    whyItMatters: An acquisition-heavy private platform with multiple regulated-adjacent businesses needs clear governance and control visibility beyond the named executive roster.
    diligencePath: Request board list, committee charters, shareholder agreement summaries, and latest cap table.
    relatedQuestionRefs:
    - QO022
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
