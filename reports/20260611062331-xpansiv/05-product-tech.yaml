  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability-disclosure
      missingEvidence: Public uptime statistics, SLA attainment, incident history, and service-status disclosures for Connect, CBL, registries, and Power.
      whyItMatters: >-
        Enterprise workflow software can look robust in marketing copy while
        still failing on reliability; without operating metrics, resilience
        must be inferred rather than verified.
      diligencePath: >-
        Request customer contracts, SLA reports, historical incident logs, and
        status-page archives for the last 24 months.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: cross-module-adoption
      missingEvidence: >-
        Module-level customer counts, attach rates across Connect, CBL,
        registries, Data, Power, and Managed Solutions, plus retention by
        bundled vs single-product customers.
      whyItMatters: >-
        The platform thesis depends on cross-sell and workflow stickiness, but
        public releases do not quantify how many customers actually use multiple
        layers together.
      diligencePath: >-
        Request a product attach-rate dashboard, cohort retention by module
        bundle, and the top 20 customer product map.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE001
    - type: enumeration-incomplete
      severity: minor
      topic: public-roadmap-coverage
      missingEvidence: >-
        A complete public roadmap for unpublished product work across APIs,
        reliability tooling, and future registry or exchange launches.
      whyItMatters: >-
        The roadmap table is assembled from launches and partner releases, so it
        may miss engineering priorities that matter for execution risk and
        product timing.
      diligencePath: >-
        Ask management for a 12-18 month product roadmap with dependencies,
        resourcing, and launch criteria by module.
      relatedTableRefs:
        - TE005
