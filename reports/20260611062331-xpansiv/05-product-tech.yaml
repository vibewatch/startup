  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role in stack
      - Publicly evidenced interfaces or processes
      - Key dependency
      - Primary risk
    rows:
      - - Registry systems
        - System of record for issuance, transfer, retirement, and serialization
        - Custom workflows, issuance algorithms, billing, and chain-of-custody records
        - Program rules, standards bodies, project verification inputs
        - Standards or governance changes can affect product integrity and customer trust
      - - Connect integration layer
        - Portfolio sync and workflow automation across registries and venues
        - REST APIs, role-based permissions, token auth, bank and registry sync, audit logs
        - Registry integrations, bank workflows, customer enterprise systems
        - High integration surface raises maintenance and reliability burden
      - - Exchange layer (CBL, ACE, JSE-V, H2OX)
        - Price discovery, matching, settlement orchestration, and market access
        - Transparent order books, same-day or automated settlement, ICH support, white-label deployment
        - Liquidity, eligible contract design, post-trade registry connectivity
        - Weak liquidity or broken settlement links can reduce venue value quickly
      - - Brokerage / advisory layer (Evolution, OTX, Climate Solutions)
        - Structured transactions, OTC execution, compliance strategy, project diligence
        - Broker desks, structured offtakes, Article 6 and net-zero advisory, full-lifecycle ticket management
        - Human expertise, regulatory registrations, relationship networks
        - Service intensity and regulated-entity obligations can limit software-like scaling
      - - Data layer
        - Package exchange and OTC activity into enterprise datasets
        - API, SFTP, cloud warehouse, portal delivery, historical and real-time data
        - Underlying venue activity and partner distribution
        - Thin market activity can weaken the data moat and valuation use case
      - - Power layer
        - Operate assets and automate ISO interaction
        - APIs/webhooks, telemetry, settlement datasets, dispute analysis, 24/7 operators
        - ISO interfaces, SCADA data, optimizer integrations
        - Operational outages would directly affect customer dispatch and settlements
      - - Managed workflow layer
        - Own onboarding, certification, and administrative execution for long-tail customers
        - Certification administration, state-specific market mapping, clean-fuel and solar program workflow
        - Registry rules, installer or fleet data quality, support organization
        - Support intensity can grow faster than software margin if automation is weak
      - - Compliance and legal overlay
        - Disclose risk, entity boundaries, and project information obligations
        - AB 1305 pages, futures risk warnings, registered-entity disclosures
        - External regulation and project-data provenance
        - Public disclosures can still rely on third-party project data that is not independently verified by Xpansiv
    notes: >-
      The architecture is described operationally because the public corpus does
      not expose a code-level system design or service map.
