        - Public failure rates and reconciliation exception metrics are not disclosed
      - - CORSIA tagging and IATA Clearing House settlement
        - Publicly claimed
        - ACE
        - Aviation-compliance procurement workflow
        - Public airline adoption and settlement volume are not disclosed
      - - Regulated brokerage entity separation
        - Publicly observed
        - Evolution futures activity
        - Clarifies which subsidiaries handle futures brokerage and regulated activity
        - Disclosure does not reveal economics, internal controls, or compliance staffing depth
      - - AB 1305-style disclosure pages
        - Publicly observed
        - CBL/Evolution carbon marketing in California
        - Project-level disclosure and accountability workflow
        - Pages explicitly say information may not be independently verified and is not legal advice
      - - Evident / I-TRACK governance continuity
        - Publicly claimed by both parties
        - International REC registry governance
        - Protects independence and market-integrity narrative after acquisition
        - Governance continuity is promised publicly but integration execution remains unquantified
      - - Public reliability disclosure
        - Not publicly visible
        - Connect, exchanges, registries, Power
        - Would support diligence on resilience and enterprise fit
        - No public uptime, SLA, or incident history found in retained corpus
    notes: >-
      The table separates explicit public controls from analytical caveats;
      absence of public reliability disclosure is itself a meaningful diligence
      finding.
