tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / venue
      - Primary user
      - Core workflow job
      - Maturity / status
      - Differentiation
      - Diligence gap
    rows:
      - - Registries (NAR, TIGR, Evident, Digital Fuels)
        - Generators, project owners, standards bodies, buyers
        - Issue, serialize, transfer, retire, and audit certificates
        - Core / scaled
        - Rules-based infrastructure with traceability, billing, and multi-registry connectivity
        - Public margin, uptime, and implementation-cost detail are absent
      - - Xpansiv Connect
        - Portfolio managers, traders, sustainability and finance teams
        - Sync positions across registries and venues; automate transfers and reporting
        - Core / scaled
        - 17+ integrations, APIs, audit logs, SOC 2 messaging, role-based permissions
        - No public SLA attainment, incident history, or attach-rate data
      - - CBL
        - Exchange participants, traders, corporates, brokers
        - Transparent order-book trading plus post-trade settlement
        - Core / scaled
        - Large environmental spot venue with Connect-linked settlement and data exhaust
        - Public commission schedule and venue retention data remain private
      - - ACE
        - Airlines, project developers, intermediaries
        - Procure CORSIA-eligible units and CP1 contracts
        - Scaled niche module
        - IATA partnership, ICH settlement, subaccount option for airlines
        - Public airline adoption and liquidity depth are not disclosed
      - - JSE Ventures Carbon
        - South African carbon and I-REC participants
        - White-label exchange and OTC settlement
        - Scaled regional module
        - Rapid white-label deployment using CBL and Connect with Evident-linked I-REC settlement
        - No public participant count or revenue disclosure
      - - Evolution Markets / OTX
        - Institutional traders, corporates, project developers
        - Brokered OTC execution, structured transactions, advisory, and risk management
        - Core but service-heavy
        - 25-year market expertise and bespoke deal capability complement electronic venues
        - Service intensity, staffing leverage, and economics by desk are undisclosed
      - - Xpansiv Data
        - Trading desks, risk teams, sustainability teams, analysts
        - Distribute verified spot, OTC, and historical pricing data
        - Core / scaled
        - Native links to CBL, Evolution, and Connect plus multiple enterprise delivery methods
        - Public ACV, renewal, and product attach rates are not disclosed
      - - Xpansiv Power
        - Power producers, storage operators, schedulers
        - ISO scheduling, telemetry, settlements, dispute support, and 24/7 operations
        - Core / scaled
        - All 7 ISOs, 15 GW served, SaaS plus managed operations
        - Public gross-margin split between software and services is missing
      - - Managed Solutions (Solar / Clean Transportation)
        - Solar owners, installers, EV charging and fleet operators
        - Onboard assets, manage certification/admin, monetize SRECs or clean-fuel credits
        - Scaled workflow business
        - Turnkey operations and state/program-specific execution reduce customer burden
        - Revenue-share terms and support-cost intensity are not fully public
      - - H2OX
        - Australian water-rights traders and enterprises
        - Electronic water trading with fixed-fee settlement
        - Adjacent niche venue
        - Transparent fixed-fee model and one-business-day settlement
        - Adjacency value to the wider platform is strategically plausible but not quantified
    notes: >-
      Rows cover the core modules visible in the public corpus and classify
      maturity analytically; several modules are software-heavy while others
      remain service-heavy execution businesses.
    enumerationScope:
      coverage: partial
