  - id: trust-controls-and-compliance
    title: Trust claims are grounded in auditability and compliance features, but external governance still matters
    body: >-
      Public trust controls are one of the better-documented parts of the
      product story. Connect and the registry pages repeatedly emphasize SOC
      2-certified cloud infrastructure, token-based or role-based access
      controls, immutable serialization, and full audit logs. Those features are
      not cosmetic in environmental commodities: double counting, broken
      chain-of-custody, or unclear retirement records would undermine the
      economic purpose of the asset. Several workflow-specific controls also
      appear. ACE ties aviation procurement into CORSIA-eligible units and IATA
      Clearing House settlement. Evolution’s regulatory pages distinguish the
      brokerage entities that handle futures activity and repeatedly warn that
      trading involves substantial risk of loss. The AB 1305-style disclosure
      surface is also visible, but it comes with a caveat that project
      information may come from sources believed reliable without independent
      verification. Evident’s acquisition is handled carefully in the product
      narrative: Xpansiv stresses that I-TRACK governance remains intact and
      that Evident continues as an independent facilitator. That is directionally
      reassuring, yet it also reveals a key product dependency. Xpansiv’s own
      software and process controls can improve auditability, but the value of
      the platform still depends on outside registry standards, methodology
      governance, and underlying credit quality. Security and workflow integrity
      look well messaged; ecosystem integrity remains partly exogenous.
    claimRefs:
