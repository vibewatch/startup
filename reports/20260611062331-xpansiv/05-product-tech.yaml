callouts:
  - calloutType: strength
    title: The moat is workflow combination, not one isolated product
    body: >-
      Xpansiv’s strongest differentiation in the corpus is the ability to move
      the same asset from registry issuance into portfolio sync, execution,
      settlement, and downstream reporting without forcing the customer to
      stitch every step together manually.
    claimRefs:
      - CE001
      - CE002
      - CE018
      - CE043
  - calloutType: risk
    title: Integration breadth is impressive, but public reliability proof is still thin
    body: >-
      The company can point to many modules and recent launches, yet public
      materials still do not quantify uptime, incident history, or attach rates
      across the combined stack. That leaves investors reliant on product claims
      rather than operating evidence for resilience and cross-sell strength.
    claimRefs:
      - CE026
      - CE041
      - CE042
