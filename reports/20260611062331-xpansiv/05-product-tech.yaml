  - id: module-map-and-operating-model
    title: Module breadth is real, and the operating model mixes software-heavy infrastructure with service-heavy execution
    body: >-
      The module map in the reviewed evidence is unusually broad for a private
      climate-infrastructure company. Registries are software-heavy systems of
      record with configurable rules, issuance logic, billing, and audit
      support. Connect is the interoperability layer, exposing APIs, position
      synchronization, and role-based access into those registries and linked
      venues. CBL and the broader exchange stack provide transparent order books
      and straight-through settlement, while ACE and JSE-V show that Xpansiv can
      package the same plumbing into compliance-specific or white-label
      offerings. Evolution Markets and OTX sit somewhat differently: they are
      not pure software modules so much as market-access services that use the
      rest of the platform to support brokerage, structured offtakes, advisory
      work, and portfolio strategy. Data and Power extend the model further into
      enterprise operations. Data monetizes verified transaction flow and
      historical datasets across environmental and energy commodities, while
      Power combines SaaS scheduling, telemetry, settlement support, and
      around-the-clock operator coverage across all seven U.S. ISOs. Managed
      Solutions, H2OX, and the Digital Fuels Registry then show that Xpansiv can
      own narrower category workflows where customers value outsourced
      onboarding, compliance administration, or faster settlement more than
      generic software configurability. The result is a hybrid operating model:
      some modules resemble cloud infrastructure, others resemble workflow
      software, and others still remain service-heavy market access businesses
      wrapped into a common platform story.
    claimRefs:
