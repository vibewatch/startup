chapter:
  number: 5
  title: Product & Technology
summary: >-
  Xpansiv sells a workflow stack rather than a single venue: registry issuance
  and serialization, Connect-based portfolio sync, exchange and brokerage
  execution, automated settlement, and downstream data/reporting. The product
  surface is broad and strategically differentiated, but public evidence still
  leaves gaps around uptime, cross-module attach rates, and how smoothly an
  acquisition-built architecture operates at scale.
sections:
  - id: workflow-stack
    title: The product is best understood as a workflow stack from issuance to reporting
    body: >-
      Xpansiv’s own materials consistently describe a workflow chain rather than
      a single software screen. The top of the stack is issuance and registry
      administration: NAR, TIGR, Evident, and the Digital Fuels Registry create
      and serialize the asset, record transfers, and preserve retirement
      history. Connect then sits in the middle as the portfolio synchronization
      layer that links registries and venues, automates transfers and
      reconciliations, and pushes data into customer systems through APIs and
      export-ready reporting. Below that are execution and transaction surfaces:
      CBL for spot order books, ACE for CORSIA-specific procurement, JSE-V for a
      white-label regional market, H2OX for Australian water, and Evolution or
      OTX for brokered, structured, or less standardized flow. Finally, Data
      and downstream reporting complete the loop by turning transaction and
      registry events into market intelligence, valuation inputs, and audit-ready
      evidence for finance, sustainability, and compliance teams. That workflow
      framing matters because Xpansiv’s differentiation is not merely price
      discovery. The company is trying to capture the operational burden that
      usually sits between project issuance, fragmented registry accounts,
      execution, settlement, and final disclosure. The corpus therefore
      supports a product thesis built around orchestration, automation, and
      traceability more than around a single exchange moat.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
