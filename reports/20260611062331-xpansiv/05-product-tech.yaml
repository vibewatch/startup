  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current fragmented workflow
      - Xpansiv solution
      - Measurable benefit
      - Limitation
    rows:
      - - Issue and sell RECs from registered assets
        - Register asset, wait for issuance, transfer certificates, reconcile payments across separate systems
        - NAR/TIGR/Evident plus Connect, CBL, and Evolution support lifecycle from issuance to sale
        - Public evidence of 1.3B RECs in NAR, 300+ GW network scale, and automated billing/reconciliation
        - Public economics by registry and attach rates into CBL or Evolution are undisclosed
      - - Manage a multi-registry environmental portfolio
        - Hold separate registry logins, manually reconcile transfers, then export ad hoc reports
        - Connect synchronizes positions, automates transfers/retirements, and exposes APIs and export-ready reports
        - 1B+ annual asset transfers and 17+ integrations are claimed
        - No public uptime/SLA or customer satisfaction data
      - - Trade spot environmental commodities and settle reliably
        - Use brokers, bilateral agreements, and manual post-trade registry transfers
        - CBL provides transparent order books with post-trade settlement integrated to registries via Connect
        - Same-day or straight-through settlement is publicly messaged
        - Public fee schedules and realized settlement failure rates are not disclosed
      - - Buy CORSIA-eligible units as an airline
        - Source units bilaterally, confirm eligibility, and manage registry positions manually
        - ACE centralizes EEUs and CP1 contracts with IATA-linked settlement and optional subaccounts
        - Live bids/offers and IATA Clearing House support are visible
        - Public airline participation and recurring volume are not disclosed
      - - Launch a regional carbon or I-REC marketplace quickly
        - Build exchange matching, registry connectivity, and settlement process from scratch
        - JSE-V uses a white-label CBL deployment linked with Connect and Evident
        - Xpansiv says the deployment occurred within months
        - No public contract economics for the white-label model
      - - Outsource power-market operations
        - Maintain separate ISO interfaces, telemetry, bidding logic, and settlement review tools
        - Xpansiv Power bundles SaaS, APIs, alerts, and 24/7 operators across all seven ISOs
        - 15 GW served and sub-4-second streaming are claimed
        - Public renewal, implementation time, and support-burden data are absent
      - - Monetize distributed solar or clean-fuel attributes
        - Navigate state certification, registry enrollment, reporting, and sale execution manually
        - Managed Solutions handles onboarding, certification, administration, and sale support
        - Public timelines and state-by-state market coverage exist for solar workflows
        - Revenue-share structure and churn by cohort are not public
    notes: >-
      This table focuses on customer jobs and workflow compression rather than
      product packaging alone.
    enumerationScope:
      coverage: partial
      basis: >-
        Summarizes the most important customer jobs publicly evidenced across
        Xpansiv modules rather than every niche asset class or regional
        workflow.
