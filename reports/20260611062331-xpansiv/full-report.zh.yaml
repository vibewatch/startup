      - number: '5.3'
        title: 信任主张扎根于可审计性和合规功能，但外部治理仍然重要
        blocks:
          - type: paragraph
            body: >-
              公开信任控制是产品故事中记录较充分的部分。Connect 和注册簿页面反复强调 SOC 2 认证云基础设施、基于 token
              或角色的访问控制、不可变序列化和完整审计日志。这些功能在环境商品中不是装饰：重复计算、监管链断裂或注销记录不清，都会削弱资产的经济目的。几个工作流专用控制也可见。ACE 把航空采购接入 CORSIA 合格单位和
              IATA Clearing House 结算。Evolution 的监管页面区分处理期货活动的经纪实体，并反复警示交易存在重大亏损风险。AB 1305
              式披露表面也可见，但附带一个限定：项目信息可能来自被认为可靠、但未独立验证的来源。产品叙事对 Evident 收购处理得很谨慎：Xpansiv 强调 I-TRACK 治理保持完整，Evident
              继续作为独立促进者运营。这在方向上令人安心，但也揭示了关键产品依赖。Xpansiv
              自身软件和流程控制可以改善可审计性，但平台价值仍取决于外部注册簿标准、方法学治理和底层信用质量。安全和工作流完整性传达得不错；生态完整性仍有一部分来自外部。
