      - number: '7.4'
        title: 人员和执行风险本质上是控制系统问题，因为公开记录尚未给出足以降低剩余暴露的 KPI
        blocks:
          - type: paragraph
            body: >-
              本章没有发现典型的创始人关键人危机证据，但确实发现了有意义的控制集中问题。一个横跨受监管经纪、注册系统、自动化结算、伙伴渠道和收购整合的平台，需要清晰的权责归属、冗余控制，并定期证明各模块被当作一个运营系统来管理。公开记录提供的证明更薄：受监管子公司的披露、品牌统一表述，以及描述规模的伙伴新闻稿。它没有提供风险承保更关键的数据集：正常运行时间趋势、事故响应指标、按金额计算的客户集中度、并购后整合记分卡、共享控制鉴证或产品级盈利能力。因此，人员和执行风险应被视为尽调阻断项，而不是风格问题。

              实际含义是，Xpansiv
              的投资逻辑可能在业务出现标题式失败之前就先破裂。期间限定的资格冲击、漂绿或披露挑战、伙伴回撤，或一系列未解决的集成事故，都可能在进入公开收入指标之前，先削弱客户信任和流动性。因此，正确的承保反应应当是可监控的。投资者应要求证据证明核心模块稳定、集中度可控、伙伴来源增长没有掩盖薄弱的直接经济性，且统一技术栈由共同流程控制，而不是由并行的遗留团队各自运转。在此之前，缓释措施确实存在，但剩余暴露仍高到足以让风险监控和尽调问题成为产品的一部分，而不是附录。
