  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥
        - 2024-2026 年按注册登记、交易所、经纪、数据、能源和托管解决方案线拆分的收入。
        - 没有分母，当前估值标记就无法绑定收入质量。
        - CFO 材料包、董事会材料和审计师审阅。
      - - 利润率和现金画像
        - 毛利率、EBITDA、经营现金流、债务和现金余额。
        - 基础设施宽度可能有吸引力，也可能毁损价值，取决于成本结构。
        - 财务尽调资料室和贷款人材料。
      - - 股权结构和优先权
        - 完整股本表、清算优先权、附函、参与权和员工池明细。
        - 普通股价值可能与名义估值大幅背离。
        - 法律顾问、过户代理和董事会同意文件。
      - - 当前价格支撑
        - 409A、要约历史、任何 2025-2026 年经验证的二级市场成交价，以及董事会批准的内部标记。
        - Forge 单独有用，但不足以作为实时价格发现机制。
        - 财务团队和二级市场管理员。
      - - 伙伴转付费
        - 与 Enverus、Constellation、ACE 注册登记客户和其他发布背书绑定的收入、利润率和续约证据。
        - 区分战略相关性和实际变现。
        - 商业运营和账户级 cohort 审阅。
      - - 市场流动性敏感度
        - 内部敞口分析，说明 VCM 流动性、质量溢价和合规驱动需求如何影响每条业务线。
        - 说明多元化是否真正缓冲碳市场疲弱。
        - 战略团队敏感性模型和 FP&A 情景包。
    notes: 要把 Xpansiv 从战略上令人印象深刻的私有资产，变成可完整承销的投资，至少需要这些文件。
    claimRefs:
