      - number: '8.4'
        title: 正确输出是继续研究；战略强度真实存在，但最终投资决定仍属于私下尽调，而不是公开叙事
        blocks:
          - type: paragraph
            body: >-
              仅看公开证据，Xpansiv
              像是一项具有战略重要性的基础设施资产，在注册系统、合规相关工作流、经纪、数据、电力软件和托管服务之间拥有真实可选性。这足以否定懒惰的看空观点。但还不足以按面值开出看多支票。未解决的问题是结构性的：保留语料没有披露当前收入结构、毛利率、EBITDA、现金、债务、股权结构条款，或
              Forge
              标题之外的老股深度。由于这些缺失文件正位于估值核心，不能被当作边缘问题。它们决定当前私募市场价格是合理还是偏高。因此，建议是以中等置信度继续研究。如果管理层能证明注册系统、数据和电力产品具备经常性经济性，伙伴证明能够转化为付费交易量，且清算瀑布可控，当前标记可以变得可辩护，甚至有吸引力。否则，即使没有标题式下轮融资，普通股价值也可能令人失望。实际答案是保留投资逻辑，但只能放在一份严格尽调清单之后，并设置清晰的逻辑破裂触发器，绑定披露、市场流动性复苏和变现质量。
