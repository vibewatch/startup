      - number: '1.2'
        title: 领导层深度可见，但治理细节相对单薄
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 领导层页面可以直接核验当前高管班底。John Melby 担任首席执行官；Frank McAnally 担任首席财务官；Nathan Rockliff 担任首席战略官；Paul Sestili
              担任首席运营官；Henrik Hasselknippe 担任首席平台官；Ben Stuart 担任首席商务官；Seshadri Sundaram 担任首席技术官；Michael Goldstein
              担任总法律顾问；Erika Crandall 担任首席风险官；Evan Ard 仍任 Evolution Markets
              总裁。这套阵容表明，公司已经远远越过只有创始人的阶段，现在更强调整合、商业化和平台风险管理。它也凸显了原 CBL 和被收购业务人才仍然重要：Rockliff 和 Stuart 连接交易所传统，Ard 则锚定通过
              Evolution Markets 带入的经纪业务。当前公开材料较少呈现的是董事会结构、委员会监督或所有权集中度。缺位本身不能证明治理薄弱，但相对 Blackstone 和 Forge
              暗示的后期估值，确实留下了重要尽调缺口。
