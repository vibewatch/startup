  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 可见收入栈很宽，形态更像基础设施，而不是单一交易所收费故事
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 的公开材料支持一个真正多线条的变现模型。CBL 被呈现为带自动化当日结算的透明订单簿场所，而买方和交易员页面分别强调 OTC
              交易后结算，可以在没有双边协议的情况下连接参与者。这在财务上重要，因为它意味着 Xpansiv 可以同时变现屏幕内执行和屏幕外工作流完成。公司的 Data
              业务增加了一条类似许可的独立收入流：基于交易的实时和历史数据通过 API、SFTP、云仓库和门户交付销售，数据本身来自 CBL 和 Evolution 的订单流。Market Execution
              又用经纪、结构化交易和咨询扩展收入栈，这些经济属性不同于交易所佣金。注册簿和 Connect 形成另一层：NAR、TIGR 及相关基础设施变现的是账户、资产和证书事件，而不是纯交易次数。Power
              增加了横跨所有美国 ISO 的 SaaS 式调度、结算、遥测和运营；托管太阳能和清洁交通产品则变现聚合、接入、销售执行和付款工作流。结果是一种多元化基础设施模型，有许多合乎逻辑的收费面，尽管 Xpansiv
              仍未公开披露这些收费面之间的实际收入结构。
