  - id: TR005
    title: 缓释措施和终止标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - AB 1305 / 绿色洗白敞口
        - 披露受到质疑，或网站表述与注册登记证据不匹配
        - 重大不一致、下架要求，或正式律师警示
        - 暂停承销，直到声明控制和法律审阅流程完成整改。
      - - CORSIA 资格依赖
        - 获批项目清单变化
        - 相关项目在下一合规期失去批准或适用范围收窄
        - 下调航空相关增长假设，并核实产品后备方案。
      - - VCM 信任 / 流动性疲弱
        - 市场成交和定价数据
        - 交易量再下一台阶，又没有更高质量变现证据抵消
        - 降低成交量驱动的上行假设，并压力测试交易所收入敏感性。
      - - 平台可靠性不透明
        - 运营证据请求
        - 公司无法提供核心模块的可用性、事件和恢复指标
        - 将基础设施主张视为未证实，并扩大剩余风险折价。
      - - 伙伴渠道集中
        - 具名伙伴在管线或使用中的占比
        - 在缺少更广验证的情况下，一个渠道或旗舰交易对手似乎主导增长叙事
        - 下调渠道质量评分，并要求旗舰样本之外的直接客户证明。
      - - 整合执行
        - 控制系统证据
        - 统一控制、迁移或重复系统下线没有可衡量进展
        - 假设运营摩擦更高，并拉长尽调时间线或放弃。
      - - 财务不透明
        - 私有 KPI 请求
        - NDA 下仍不披露收入、毛利率、烧钱、跑道或附加率
        - 不要基于产品宽度承销变现上行。
      - - 竞争压力
        - 现有交易所替代
        - 客户将 CME / ICE 入口视为 Xpansiv 工作流的近似替代
        - 下调差异化假设，并把尽调重点放在非大宗商品工作流粘性上。
    notes: 触发项刻意设为可监控，并绑定可观察的运营、监管或尽调事件，而不是泛泛的情绪变化。
    claimRefs:
      - CR026
      - CR038
      - CR041
      - CR042
      - CR047
      - CR048
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 依据
    rows:
      - - 建议
        - 继续研究
        - 公开证据足以支撑严肃尽调，但不足以按表面价格看多进场。
      - - 置信度
        - 中
        - 战略位置得到佐证，但经济分母和股权结构仍不透明。
      - - 风险评级
        - 高
        - 流动性修复、诚信导向的市场选择性，以及优先权结构不透明，都可能重置普通股价值。
      - - 估值立场
        - 公允至偏高
        - Forge 约 $1.4B 的信号在基准情形下大致公允；若私有经济性不及预期，则偏高。
      - - 公开价格支撑
        - 可见区间约 $1.2B 至约 $1.4B
        - 保留材料显示，2022 年披露的 $1.2B 锚点和 2025 年约 $1.4B 的二级市场式信号仍在，但没有更干净的当前轮价格。
      - - 决策含义
        - 先尽调，再承诺价格
        - 承销该估值前，要求提供经审计财务桥、当前 409A 或二级市场支撑，以及清算瀑布细节。
    notes: 本摘要只评估公开证据；它不是公平性意见，也不假设优先权结构条款有利。
    claimRefs:
      - CV001
      - CV004
      - CV040
      - CV041
      - CV042
      - CV045
  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 维度
      - 正向论点
      - 反向论点
    rows:
      - - 平台宽度
        - Xpansiv 现在横跨多个环境资产类别，覆盖交易所、经纪、注册登记、能源数据和托管工作流。
        - 若不披露分部经济性，宽度可能掩盖整合成本和服务强度。
      - - 注册登记护城河
        - 注册登记软件、Connect 集成，以及反复发生的入驻或签发步骤，形成基础设施式锁定。
        - 若不披露留存、毛利率或付费使用转化，护城河质量很难定价。
      - - 市场位置
        - Forge 仍显示独角兽级价值，战略投资者也持续为平台提供资金直到 2024 年。
        - $1.4B 信号只比 2022 年披露锚点略高，体现韧性，但不构成明显上行。
      - - 合规敞口
        - ACE、NAR 和受监管期货披露表明，随着市场正规化，Xpansiv 可以变现合规相关工作流。
        - 合规也会增加运营和法律负担，而 ICAO 等框架不在 Xpansiv 控制范围内。
      - - 质量驱动复苏
        - 独立市场研究显示，诚信度更高、年份更新的信用及相关工作流仍有需求。
        - 同一批独立研究也指出，流动性更低，广泛市场信任仍未完全恢复。
      - - 可比框架
        - 该业务应按交易所 + 数据 + 注册登记基础设施来看，而不是按纯经纪商来看。
        - 但经审计收入质量仍为私有信息，因此还不足以获得成熟 ICE 式估值信心。
    notes: 反向论点聚焦什么会削弱价格支撑，而不是 Xpansiv 是否具有战略意义。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV016
