              NRR、GRR、流失率、续约率或客户满意度分数，因此本章不能靠已披露指标断言其具备软件式留存。现有语料能证明的是工作流嵌入度。注册系统用户必须完成账户审批、支付费用、指定核查方、登记资产，并在证书签发前持续提交生产数据。TIGR
              买方可以直接持有账户，也可以依赖中介，但两条路径都会留下注销和透明度记录。Managed Solutions 客户把上手、认证、证书销售和付款处理交给
              Xpansiv；这种关系更像外包运营，而不是一次随手完成的市场交易。这些特征意味着客户关系比简单订单簿更黏。即便如此，证据仍是间接的。保留语料没有给出队列留存、分客群续约率、支持质量指标，甚至没有可靠披露重复交易方数量。最稳妥的结论是：Xpansiv
              的基础设施位置可以制造持久的工作流依赖，但实际留存强度仍是尽调缺口，需要合同和队列数据来验证。
