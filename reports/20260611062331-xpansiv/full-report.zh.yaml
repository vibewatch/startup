    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、沿革与平台构成
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 把自己定位为一套市场基础设施栈，而不是单一交易所。公司历史页面把业务根源放在 CBL：Ben Stuart 和 Nathan Rockliff 于 2009 年在悉尼创立 CBL；2019 年
              CBL 收购 Xpansiv，合并后的业务采用 Xpansiv 名称。现有官方材料把它描述为一个整合平台，覆盖注册簿、在线市场、市场执行、批发电力软件、组合管理和数据。2025 年事实表和平台概览都把
              Xpansiv 定义为贯穿环境商品生命周期的开放、中立基础设施层。这一定位重要，因为公司卡在发行系统、组合同步、执行场所和下游数据用户之间。注册簿软件记录资产并做序列化，Xpansiv Connect
              同步头寸和转移，CBL 提供现货市场执行，Evolution Markets 加上 Carbon Financial Services 把平台延伸到 OTC
              和结构化交易。因此，已审阅证据给出的最强公司概况结论，不只是 Xpansiv 运营一个碳市场，而是它靠收购拼出了一套面向环境商品及相邻能源转型市场的操作系统。
