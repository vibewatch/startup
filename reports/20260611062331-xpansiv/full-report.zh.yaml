  - id: TV005
    title: 论点失效和终止触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 没有财务桥
        - 管理层不按分部提供 2025-2026 年收入、毛利率、EBITDA、现金和债务。
        - 当前估值标记仍由叙事驱动，而不是由经济性承销。
        - 不要把 Forge 锚点视为可投资的价格支撑。
      - - 优先权结构沉重
        - 清算优先权或附函吸收低于 $1.5B 结果中的大部分价值。
        - 名义估值与普通股价值背离。
        - 重新定价预期回报，或直接退出。
      - - 流动性持续疲弱
        - 独立市场研究继续显示成交量更低，可信供给没有广泛恢复。
        - 交易所和数据成交量作为收入代理变量变弱。
        - 向熊市情形倾斜，并要求更低进场价。
      - - 伙伴验证无法变现
        - Enverus、Constellation 或类似发布无法显示付费经常性采用。
        - 战略宽度不再转化为估值质量。
        - 从模型中移除牛市情形假设。
      - - 合规敞口上升快于变现
        - ACE 受监管经纪或披露工作流增加成本，却看不到高利润率转化。
        - 基础设施复杂度变成折价，而不是护城河。
        - 提高风险折价，降低支付意愿。
      - - 没有已验证的当前标记
        - 除 Forge 外，没有提供 409A、要约历史或经验证的 2025-2026 年二级市场成交价。
        - 进场价格仍是一个缺少实时市场深度的名义数字。
        - 将当前估值视为暂定，而非已确认。
    notes: 这些触发项会移动估值；每一项改变的是论点背后的价格支撑，而不只是改变叙事语气。
    claimRefs:
