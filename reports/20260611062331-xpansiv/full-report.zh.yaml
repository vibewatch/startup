  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和市场完整性风险是最尖锐的外生暴露，因为 California 披露规则和 CORSIA 治理都不受 Xpansiv 控制
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 的法律风险栈，起点在于它已经不只是销售通用工作流软件。公司自己的 AB 1305 页面承认，多个关联实体可能被视为在 California
              营销或销售自愿碳抵消；其披露还明确把用户指回注册系统文件，同时声明不提供独立核查和法律意见。这一点重要，因为 AB 1305 的目标是减少漂绿，而不只是增加一个流程勾选框。实际运营中，Xpansiv
              必须让项目级数据、问责条款和计算方法在公司页面、注册系统记录以及任何关联 California 的营销主张之间保持一致。法律要求很清楚；运营边界并不清楚。Keller Heckman 和 Sidley
              的法律分析强调，该法覆盖卖方、使用方和主张提出方，却仍未明确什么算营销抵消，或什么算在 California
              运营。对于一个连接抵消、注册系统和经纪式工作流的平台，这种模糊性意味着披露页面上线之后，剩余法律暴露仍然偏高。

              第二层监管来自 CORSIA。ICAO 自身页面明确显示，资格决定按项目层面作出、受期间限制，并由 ICAO Council 和 TAB 控制，而不是由市场运营方控制。这让 ACE 以及 Xpansiv
              想支持的任何面向航空公司的证书或抵消工作流，都产生直接依赖。与此同时，独立市场研究仍显示自愿碳市场存在信任和流动性赤字。Reuters Plus、Climate Focus、Ecosystem
              Marketplace 和 MSCI 都描述了一个仍在消化完整性争议、治理改革和交易流动性下降的市场，尽管高质量供给的需求仍在。Xpansiv
              可以把自己放在质量迁移的正确一侧，但无法隔绝一个事实：市场参考标准、被接受的主张框架和合格供给池，正在被公司之外的监管者和标准机构改写。
