  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 服务市场边界：环境商品基础设施，而不是单一碳交易所
        blocks:
          - type: paragraph
            body: >-
              Xpansiv
              的市场应定义为环境商品基础设施，而不是狭义的自愿碳交易所。公司的交易所概览、交易平台页面和碳页面显示出一套栈：覆盖场所接入、标准化合约、注册簿连接、组合管理、结算和数据。官方品类地图覆盖碳、可再生电力证书、清洁燃料属性、水权和再生材料信用；解决方案页面则把企业买方、交易员和经纪商、资产或项目所有者拆成不同的工作流所有者。这个边界重要，因为
              Xpansiv
              解决的经济问题是碎片化：属性在许多注册簿中发行，在分散市场中定价，又由不同于创造者的一组参与者注销。公司自身定位始终强调透明订单簿、自动化交易后结算、多注册簿连接和可审计报告。因此，纳入的支出不只是现货碳执行，还包括跨可再生能源、燃料、水和回收工具的注册簿发行和注销、组合同步、经纪协助的结构化交易、交易数据和面向合规的转移工作流。排除的支出是这些工具底层的实体脱碳资本开支——太阳能电站、SAF
              工厂、废弃物处理设施或水基础设施——以及不带市场或注册簿工作流的通用 ESG 咨询。因此，看待 Xpansiv 服务市场的最佳方式，是把它视为位于项目发行、交易与经纪、买方注销和报告之间的多边市场结构层。
