      - number: '4.3'
        title: 融资通道真实存在，但现金、烧钱速度和债务仍未公开，当前资本充足性无法证明
        blocks:
          - type: paragraph
            body: >-
              本章内证据支持这样一家公司：它反复融资，并持续为扩张投入。Blackstone 在 2022 年承诺 $400 million，并明确称资金将支持有机增长和未来收购。Bank of America 2023 年
              1 月的公告随后把 Evolution Markets 收购与进一步 $125 million 融资绑定，资金用于服务产品和技术平台，Bank of America 和 Goldman Sachs
              作为战略投资者加入。Aramco Ventures 在 2024 年 5 月又领投一轮融资，但金额未披露。到 2025 年末，Xpansiv 已全资收购 Evident，再次扩大 REC
              注册簿足迹。这条时间线说明，管理层愿意通过产品建设和并购投入，而不是收割已披露利润。积极解读是，投资者反复资助了一家市场基础设施品类领导者。谨慎解读是，收购和产品宽度可能掩盖高整合成本、支持成本和持续资本需求。公开证据不能证明当前账上现金、月度烧钱速度、现金跑道、债务、项目融资义务或契约余量。Forge
              的二级市场估值信号提供了外部背景，但不是流动性证明。因此，承保必须区分「还能融资」和「当前资本充足」，在私人财务数据提供前，把后者视为未证明。
