      - number: '7.2'
        title: 运营风险偏高，因为 Xpansiv 在一个靠收购拼起的技术栈上串接结算、注册系统和经纪工作流，却没有公开可靠性披露
        blocks:
          - type: paragraph
            body: >-
              从运营角度看，Xpansiv 的护城河也是它的负担。公司销售的是一条工作流链：注册系统、基于 Connect 的组合同步、CBL
              现货交易、自动化结算和市场执行服务。每个模块本身都可能有价值，但风险章节应承保的是模块之间的交接，而不是任何单一模块的营销文案。Connect 宣称能即时反映组合状态，且每年转移十亿项资产。CBL
              宣称自动化当日结算、OTC 交易后基础设施，以及触达数百个市场参与者。这些说法意味着真实运营规模，也意味着一旦数据映射、权限管理、结算信息或注册系统同步出错，客户会立刻看到，并可能同时伤害多个产品界面的信任。

              平台的组装方式放大了集成挑战。Bank of America 的收购新闻稿确认，Xpansiv 使用债务和股权收购 Evolution Markets 以及 APX 的环境组合业务；2025
              年里程碑新闻稿则称，被收购业务仍在并入统一的 Xpansiv 品牌。Evident
              又带来一块大型注册系统足迹，附带自身治理承诺和多国认证网络。这些都不是致命缺陷；收购驱动的市场基础设施可以跑通。但公开材料缺少正常运行时间、事故响应或并购后控制指标，意味着投资者仍无法验证公司是否已把产品宽度转化为统一的运营成熟度。因此，尽调不应停留在抽象架构图，而应转向模块级可靠性、变更管理和事故治理证据。
