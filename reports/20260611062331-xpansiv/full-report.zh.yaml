      - number: '5.4'
        title: 近期发布强化了平台路线图，但整合复杂度和可靠性披露有限仍是真实风险
        blocks:
          - type: paragraph
            body: >-
              过去两年可见的产品开发是连贯的。Xpansiv 先通过收购和伙伴集成横向扩展平台，再借 2025 年品牌重塑把这些组件呈现为一套端到端栈。收购 Evident
              加深了可再生证书基础设施，并加入对治理敏感的国际注册簿资产。Constellation 发布把 CBL 和 NAR 推入无排放能源证书和核电相关 ZEC 可追溯性，并明确把小时级证书列为下一步。与 Enverus
              的合作扩大了分发，把 CBL 和 Evolution
              定价放入一个已有交易和风险工作流，该工作流被数千名能源专业人士使用。这些动作都指向同一方向：更多跨品类证书产品、更多嵌入式数据，以及注册簿发行、执行和下游报告之间更多连接。风险同样清楚。Xpansiv
              仍在整合大量被收购产品，其中一些是软件原生，一些是服务重业务。公开材料支持整合逻辑，但没有量化模块附加率、跨模块留存，或维护这么多接口的工程成本。已审阅材料也缺少公开 uptime、SLA
              或事故披露。这一缺位不能证明可靠性薄弱，但意味着投资者主要要从产品主张和客户工作流逻辑，而不是披露的运营指标，来承保平台韧性。
