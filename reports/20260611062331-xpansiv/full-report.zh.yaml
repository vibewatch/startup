      - number: '2.4'
        title: 增长驱动与约束都指向基础设施需求，但也压住近端市场速度
        blocks:
          - type: paragraph
            body: >-
              对 Xpansiv 最有建设性的需求驱动，是合规重叠、报告压力和注册簿碎片化。ICAO 的 CORSIA 机制让国际航空成为自愿逻辑与合规逻辑围绕标准化合格单位汇合的最清晰案例，这也是 Xpansiv ACE 和
              Climate Impact X 都推出 CORSIA 相关交易工作流的原因。California 的 AB 1305
              披露制度又增加了一层透明度负担，迫使更多项目、方法学和问责细节进入市场。更一般地说，Xpansiv
              面向买方和交易员的信息反复回到一个核心需求：参与者需要可审计报告、可信数据，以及跨多个注册簿的结算，同时避免重复的双边操作。独立交易所和期货基础设施也说明价格透明度重要。CME 上市实物结算的 CBL
              GEO、N-GEO 和 C-GEO 期货；ICE 维护更广泛的碳和环境衍生品；ACX 和 CIX 都围绕透明度、托管、结算和多注册簿接入定位。但约束同样真实。Reuters Plus
              描述了信心危机、注销量持平和现货价格下跌；Climate Focus 称完整性担忧和监管不确定性仍在影响需求；Ecosystem Marketplace 称即使需求撑住，流动性仍偏低；MSCI
              称高质量需求超过供给，但治理和交付风险仍然重大。结果是，市场仍需要基础设施，但并非每个环节都能均匀变现。客户需要更好的跟踪、定价和转移工具时，Xpansiv
              会受益；但底层环境信用市场周转放缓、买方谨慎和政策模糊，仍会传导到公司。对承保而言，乐观情景不应主要依赖泛泛的「巨大碳市场」叙事，而应取决于 Xpansiv
              能否把碎片化、合规相邻的工作流转化为跨品类的经常性注册簿、数据、结算和交易所经济。
