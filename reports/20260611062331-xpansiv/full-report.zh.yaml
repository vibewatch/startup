        title: 定价在注册簿和托管解决方案中部分可见，单位经济性则必须从吞吐量、自动化和客户足迹推断
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 运营工作流重、规则驱动的产品时，公开定价最清楚。NAR 费率表给出精确的账户、资产和单证书费用；太阳能托管解决方案页面公布按比例收取的 EasyREC 和 Illinois ABP
              费率表，以及每个 REC 的最低服务费。这些披露说明，Xpansiv
              至少部分经济性是经常性且运营颗粒度很细的，而不是纯按价值计收的交易所佣金。相比之下，公司没有公布市场数据订阅、交易所佣金、大多数经纪委托、电力软件合同或清洁燃料收入分成的标准费率卡。Evolution
              的数据政策间接说明了这一点：费用会随应用、用户、地点和数据量变化，意味着企业级变现靠谈判确定。由于公司层面利润率未披露，最好的单位经济性代理指标是运营宽度和自动化。Xpansiv 引用的指标包括电力服务 15
              GW、超过 ERCOT 和 CAISO 电池储能容量的 20%、超过 125,000 个太阳能客户、约 1.9 GW 至 2,000 MW 的托管太阳能资产、每年超过 500,000 个清洁燃料信用、超过
              50,000 个清洁燃料资产，以及处理超过 1 billion 个数据点。这些指标不揭示毛利，但确实显示出：如果流失和支持强度受控，规模、工作流自动化和数据复用可能创造有吸引力的经济性。
