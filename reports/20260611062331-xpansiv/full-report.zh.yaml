  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高的剩余风险集中在外部治理、市场完整性暴露和收购后运营控制，而不是单一技术缺陷。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: AB 1305 / 绿色洗牌披露风险
          values:
            - label: 高
              tone: warning
              detail: Xpansiv 自有披露页面已标记多个实体。
            - label: 高
              tone: warning
              detail: 声明错配会损害客户信任和法律姿态。
            - label: 中等
              tone: neutral
              detail: 页面已经存在，但 Xpansiv 仍声明不负责验证，也不提供法律建议。
            - label: 高
              tone: warning
              detail: 范围模糊和年度刷新负担仍在。
        - label: CORSIA 合格性依赖
          values:
            - label: 中高
              tone: warning
              detail: 项目批准来自外部，且受期限约束。
            - label: 高
              tone: warning
              detail: 如果获批路径收窄，面向航空公司的产品可能很快失去相关性。
            - label: 低到中等
              tone: warning
              detail: Xpansiv 不控制 ICAO 决策。
            - label: 高
              tone: warning
              detail: 即便产品多元化，剩余风险仍处高位。
        - label: 收购后整合
          values:
            - label: 高
              tone: warning
              detail: 这套栈靠收购拼成，仍在统一到一个品牌下。
            - label: 高
              tone: warning
              detail: 控制失效可能同时冲击不止一个产品界面。
            - label: 中等
              tone: neutral
              detail: 品牌统一和治理表述存在，但缺少 KPI 证据。
            - label: 高
              tone: warning
              detail: 没有公开整合记分卡，信心因此下降。
        - label: VCM 完整性 / 流动性拖累
          values:
            - label: 高
              tone: warning
              detail: 多个独立来源仍描述信任和换手压力。
            - label: 高
              tone: warning
              detail: 流动性下降会压缩交易所和合作伙伴经济性。
            - label: 中等
              tone: neutral
              detail: 质量迁移有帮助，但 Xpansiv 无法消除行业层面的波动。
            - label: 高
              tone: warning
              detail: 外部市场信任仍影响交易量和定价。
        - label: 合作伙伴与渠道集中
          values:
            - label: 中
              tone: neutral
              detail: 增长证明依赖少数具名合作伙伴和渠道。
            - label: 中高
              tone: warning
              detail: 合作伙伴放缓会削弱采用证明和价格发现触达。
            - label: 中等
              tone: neutral
              detail: 合作关系真实存在，但直接经济性披露偏弱。
            - label: 中高
              tone: warning
              detail: 没有更广泛客户证明时，剩余暴露仍然偏高。
    approximationNotes: null
    claimRefs:
      - CR010
      - CR016
      - CR018
      - CR028
      - CR033
      - CR035
      - CR047
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要风险通道从外部治理和市场信任冲击，传导到合格供给、流动性、合作伙伴信心，再传导到变现和估值。
    data:
      nodes:
        - id: n1
          label: 外部治理冲击
          detail: AB 1305 审查、CORSIA 合格性变化或标准改革
          tone: warning
        - id: n2
          label: 合格 / 可信供给收窄
          detail: 项目批准、方法学改革或更高完整性买方过滤
          tone: warning
        - id: n3
          label: 交易量和价格发现走弱
          detail: 换手下降或买方更挑剔，会压低流动性
          tone: warning
        - id: n4
          label: 合作伙伴与渠道压力
          detail: 市场疲弱时，具名上线伙伴和数据渠道权重更高
          tone: warning
        - id: n5
          label: 收入转化不透明度上升
          detail: 公开活动指标更难转译成经济性
          tone: warning
        - id: n6
          label: 估值 / 建议受冲击
          detail: 剩余风险上升快于公开变现证明
          tone: warning
      edges:
        - from: n1
          to: n2
          label: 规则和合格性改变买方可用库存
        - from: n2
          to: n3
          label: 信任度或合格性较低的供给削弱换手
        - from: n3
          to: n4
          label: 流动性下降抬高具名渠道和交易对手的重要性
        - from: n3
          to: n5
          label: 市场活动作为收入和利润率代理指标时噪声更大
        - from: n4
          to: n5
          label: 渠道依赖放大变现不确定性
        - from: n5
          to: n6
          label: 不透明让剩余风险折价维持高位
    approximationNotes: null
    claimRefs:
      - CR012
      - CR016
      - CR017
      - CR019
      - CR033
      - CR035
      - CR038
      - CR046
      - CR047
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Xpansiv 位于一张依赖网络中心，网络横跨监管机构、标准制定机构、登记系统治理、渠道、上线伙伴和受监管子公司。
    data:
      nodes:
        - id: d1
          label: ICAO / CORSIA
          detail: 控制航空相关合格性规则
          tone: warning
        - id: d2
          label: Verra / ICVCM
          detail: 塑造方法学和完整性预期
          tone: warning
        - id: d3
          label: 登记系统网络
          detail: NAR、TIGR、I-REC(E) 和 powered registries 锚定发行和注销记录
          tone: neutral
        - id: d4
          label: Enverus / MarketView
          detail: 大型下游数据渠道和工作流界面
          tone: neutral
        - id: d5
          label: 旗舰上线伙伴
          detail: Constellation 类引用证明品类扩张
          tone: neutral
        - id: d6
          label: 受监管经纪子公司
          detail: CFTC、NFA 和 FCA 关联活动增加合规负担
          tone: warning
        - id: d7
          label: Xpansiv 统一平台
          detail: 连接交易所、经纪业务、登记系统和工作流工具
          tone: positive
      edges:
        - from: d1
          to: d7
          label: 合格性规则影响面向航空的产品
        - from: d2
          to: d7
          label: 完整性框架塑造供给和声明支持
        - from: d3
          to: d7
          label: 登记系统治理锚定发行和注销数据
        - from: d4
          to: d7
          label: 渠道集成扩大触达，但增加依赖
        - from: d5
          to: d7
          label: 具名上线提供证明，也带来集中风险
        - from: d6
          to: d7
          label: 受监管运营需要专门控制
    approximationNotes: null
    claimRefs:
      - CR007
      - CR010
      - CR029
      - CR030
      - CR033
      - CR035
      - CR043
      - CR044
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: Xpansiv 达到战略质量门槛，但公开经济性仍不透明，挡住了看多建议。
    data:
      nodes:
        - id: A
          label: 基础设施广度
          detail: 语料中可以看到登记系统、交易所、经纪业务、电力数据和托管工作流。
          tone: positive
        - id: B
          label: 外部验证
          detail: Enverus 和 Constellation 说明，下游工作流相关性不只是营销说法。
          tone: positive
        - id: C
          label: 市场背景
          detail: VCM 需求由质量驱动，买方仍然挑剔，信任约束还在。
          tone: warning
        - id: D
          label: 经济数据不透明
          detail: 收入、利润率、现金流和优先股堆叠条款仍未公开。
          tone: warning
        - id: E
          label: 决策
          detail: 私有尽调补上估值分母和清算瀑布缺口之前，结论维持继续研究，估值为合理至偏高。
          tone: neutral
      edges:
        - from: A
          to: E
          label: 支撑战略兴趣
        - from: B
          to: E
          label: 支撑相关性
        - from: C
          to: E
          label: 抬高折现率
        - from: D
          to: E
          label: 阻断确信度
    approximationNotes: 该流程概括的是承销判断逻辑，不是数值模型。
    claimRefs:
      - CV006
      - CV014
      - CV021
      - CV032
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 信息披露质量和市场环境一变，可支撑估值会迅速移动。
    data:
      items:
        - label: 悲观 / 披露偏弱
          value: 0.85
          detail: 市场不信任延续，股权结构表或利润率表现不及预期。
          tone: negative
        - label: 基准 / 现有公开支撑
          value: 1.35
          detail: 围绕 Forge 信号，最能用公开证据辩护的区间大致中点。
          tone: warning
        - label: Forge 检查点
          value: 1.4
          detail: 留存语料中最新的公开估值信号。
          tone: neutral
        - label: 乐观 / 证明上行
          value: 1.9
          detail: 需要高质量经常性经济性，且优先权可控。
          tone: positive
    approximationNotes: 数值只是以十亿美元计的简单承销检查点，不是管理层指引，也不是观察到的成交 价格。
    claimRefs:
      - CV004
      - CV021
      - CV022
      - CV023
      - CV025
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 估值区间很宽，因为公开证据能证明战略价值，但关键经济文件仍未公开。
    data:
      items:
        - label: 悲观
          low: 0.7
          mid: 0.85
          high: 1
          displayValue: $0.7B-$1.0B
          detail: 流动性低、经济性薄，或清算瀑布沉重，都会压缩普通股价值。
          tone: negative
        - label: 基准
          low: 1.2
          mid: 1.35
          high: 1.5
          displayValue: $1.2B-$1.5B
          detail: 战略相关性真实存在，但经济性只得到部分证明。
          tone: warning
        - label: 乐观
          low: 1.7
          mid: 1.9
          high: 2.1
          displayValue: $1.7B-$2.1B
          detail: 经常性基础设施经济性被证明强劲，市场质量继续修复。
          tone: positive
        - label: Forge 参考
          low: 1.4
          mid: 1.4
          high: 1.4
          displayValue: ~$1.4B
          detail: 这是有用检查点，但仍不能替代完整尽调。
          tone: neutral
    approximationNotes: 区间以情景法估算，单位为十亿美元；在完成资本结构私有尽调前，应把它理解为头部估值 带。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 战略定位得分高于证据质量和下行保护。
    data:
      items:
        - label: 平台广度
          score: 9
          detail: 留存语料支撑一个真正多资产的基础设施栈。
          tone: positive
        - label: 变现面
          score: 7
          detail: 注册费、托管解决方案费用、数据和执行工作流可见，但分部收入不可见。
          tone: positive
        - label: 市场相关性
          score: 8
          detail: 合作伙伴和数据渠道证据显示，Xpansiv 在环境市场工作流里有位置。
          tone: positive
        - label: 证据质量
          score: 4
          detail: 财务披露仍然太薄，撑不起高确信度承销。
          tone: warning
        - label: 下行保护
          score: 3
          detail: 优先股堆叠和老股深度不透明，削弱普通股信心。
          tone: warning
        - label: 估值支撑
          score: 5
          detail: 当前估值说得通，但仅看公开证据并不明显便宜。
          tone: warning
    approximationNotes: 得分是投资委员会启发式判断，采用 1-10 分量表，只基于留存的公开证据。
    claimRefs:
      - CV007
      - CV014
      - CV020
      - CV032
      - CV038
      - CV041
      - CV042
