      - number: '6.4'
        title: 扩张路径真实存在，但集中度和市场信心风险仍披露不足
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 的扩张逻辑说得通。买方可以从经纪或现货执行起步，再增加注册系统账户、基于 Connect
              的组合管理、市场数据、结构化交易，或相邻的清洁能源工作流。资产所有者也可以反向推进，从签发或托管式管理开始，再扩展到变现、电力运营或长期承购。Enverus 集成展示了另一条路径：Xpansiv
              的数据可以嵌入既有能源工作流，而不必要求客户完全转到原生席位。不过扩张上行空间旁边就是风险。公开材料没有披露按收入计算的客户集中度、最大交易对手占比或客群结构，因此投资者只能从
              Constellation、Enverus、主要注册系统、标准机构和活跃 CBL 参与者群体等可见锚点推断集中度。面向碳的客户队列仍暴露在自愿市场完整性冲击下。Reuters Plus、Climate
              Focus、Ecosystem Marketplace 和 MSCI 都描述了一个质量在改善、但仍面临流动性下降、信任缺口和治理压力的市场。因此，Xpansiv
              的客户机会很宽，但其中相当一部分仍依赖可信供给、活跃交易对手和生态伙伴，而这些并不完全由公司控制。
