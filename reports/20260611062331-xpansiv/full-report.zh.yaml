  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 最适合把产品理解为从发行到报告的工作流栈
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 自己的材料始终描述的是一条工作流链，而不是单一软件界面。栈顶是发行和注册簿管理：NAR、TIGR、Evident 和 Digital Fuels Registry
              创建资产并序列化，记录转移，保存注销历史。Connect 位于中间，作为组合同步层连接注册簿和场所，自动化转移与对账，并通过 API 和可导出报告把数据推入客户系统。其下是执行和交易表面：CBL
              负责现货订单簿，ACE 负责 CORSIA 专用采购，JSE-V 负责白标区域市场，H2OX 负责澳大利亚水，Evolution 或 OTX 负责经纪式、结构化或较非标准化的交易流。最后，Data
              和下游报告把交易与注册簿事件转化为市场情报、估值输入，以及供财务、可持续发展和合规团队使用的可审计证据，形成闭环。这种工作流框架重要，因为 Xpansiv
              的差异化不只是价格发现。公司试图吃下通常卡在项目发行、碎片化注册簿账户、执行、结算和最终披露之间的运营负担。因此，材料更支持一个围绕编排、自动化和可追溯性建立的产品逻辑，而不是围绕单一交易所护城河。
