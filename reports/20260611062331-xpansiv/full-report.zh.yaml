    rows:
      - - 企业 / 终端买方
        - 可持续发展、采购、财务和报告团队；付款方是企业预算负责人
        - 寻找 REC、碳和清洁燃料工具；跟踪并注销证书；支持披露
        - CBL 接入数百名合格参与者和项目特定工具
        - 战略价值高，因为声明、采购和报告可以扩展到数据和 Connect
        - 未披露从买方参与到付费软件席位的转化
      - - 交易员、经纪商和金融机构
        - 交易台、经纪商、中介机构、风险团队；付款方是交易业务
        - 执行现货或 OTC 交易，获取定价，并管理跨市场敞口
        - CBL 报告来自 200+ 家机构的 1,100+ 名参与者；Enverus 面向交易公司、经纪商和金融机构
        - 对流动性和数据变现很重要
        - 活跃参与者不等同于经常性软件客户
      - - 资产和项目所有者
        - 开发商、发电方、燃料生产商、太阳能运营商；付款方是资产所有者或发起方
        - 注册资产、签发证书、变现产出、设计包销，并管理清洁燃料工作流
        - 注册资产 300 GW；托管方案资产 1.9 GW；50,000+ 个清洁燃料资产
        - 具备战略意义，因为签发和行政流程可以扩展到经纪、交易所和报告
        - 细分层面的收入结构未披露
      - - 电力生产商和公用事业
        - 发电业主、调度员、结构化交易团队；付款方是生产商或公用事业
        - 跨 ISO 运营资产，对冲电力或 REC 敞口，并管理捆绑或非捆绑清洁能源销售
        - 服务全部 7 个美国 ISO；提及 >20% 的 ERCOT 和 CAISO 电池储能容量
        - ACV 潜力大，工作流嵌入也可能更持久
        - 除 Constellation 和一份 REC 协议样本外，公开客户名称稀少
      - - Managed Solutions 长尾
        - 太阳能安装商、房主、企业、EV 充电和车队运营商；付款方是参与者或收入分成客户
        - 外包注册、认证、积分出售、付款和合规报告
        - 125,000+ 个客户 / 系统、600 个伙伴、多州支持、每年 500,000+ 个清洁燃料积分
