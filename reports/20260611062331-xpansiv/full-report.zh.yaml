      - number: '1.4'
        title: 平台已有真实规模，但仍依赖碳市场信心
        blocks:
          - type: paragraph
            body: >-
              已审阅来源最重要的结论是：如果 Xpansiv 的规模说法成立，其体量已经足够重要，但这些说法仍高度来自公司自身传播。Xpansiv Connect 称，它每年在 17 个以上注册簿和交易平台之间管理超过 10
              亿次资产转移。Aramco Ventures 的公告更进一步，称 Xpansiv 软件支持全球 80% 以上的碳信用和北美 60% 的 REC，而 CBL 在交易所交易且已结算的碳信用中占有 90%
              以上份额。2025 年 12 月的里程碑公告还称，REC 网络在 2024 年发行了全球 31% 的 REC；自 2020 年以来，CBL 已促成超过 330 million 个碳信用和超过 14 million
              个 REC 与 EAC；Evolution Markets 已促成超过 $800 billion 的名义价值。这些数字支持公司概况的核心判断：Xpansiv
              是有意义的基础设施。与此同时，独立市场来源提醒我们，基础设施质量的价值取决于底层资产类别的市场信心。Ecosystem Marketplace、Reuters Plus 和 MSCI
              都描述了一个仍在消化完整性担忧、需求持平和质量分层的自愿碳市场。这意味着，Xpansiv 的规模应被理解为战略上有力，但并不免疫于底层市场信任冲击。
