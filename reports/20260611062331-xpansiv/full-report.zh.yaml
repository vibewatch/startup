  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开价格锚点仍处在独角兽区间，但披露质量仍太薄，不能把这个标记当作干净的承保证据
        blocks:
          - type: paragraph
            body: >-
              估值故事从一个真实锚点开始，随后变得模糊。Blackstone 2022 年 7 月公告，是保留语料中最后一个清晰披露的定价融资事件：向一家拥有关键软件、技术和可扩展环境商品交易所的企业投入 $400
              million。Bank of America 2023 年 1 月新闻稿随后确认，另一笔 $125 million 融资与该融资及 Evolution Markets 收购有关。Aramco Ventures
              在 2024 年领投了另一轮融资，但金额和估值未披露。因此，Forge 2025 年 4 月页面成为截止后最重要的市场数据点：它显示最后已知估值为 $1.4 billion，让 Xpansiv
              仍处于独角兽区间，但并不能证明市场广泛重估。这个温和上调值得注意，因为公司同期还通过收购、注册系统扩张、电力工作流和更多战略投资者来拓宽平台。如果所有这些动作之后，公开证据仍只能支持估值从大约 $1.2
              billion 上行到大约 $1.4
              billion，投资者应把信号解读为韧性，而不是明显便宜。缺口不在战略相关性。缺口在分母质量：没有保留的公开来源足够紧密地披露当前收入、毛利率、EBITDA、现金、债务、烧钱速度或清算优先权结构，无法把标题估值转换为经承保的普通股价值。
