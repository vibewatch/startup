      - number: '3.2'
        title: 替代渠道仍可信，因为买方任务可以拆开完成
        blocks:
          - type: paragraph
            body: >-
              很多买方不必购买完整 Xpansiv 栈也能完成任务。Evolution Markets 和 OTX 让经纪式
              OTC、结构化交易和咨询继续存在，作为只靠订单簿执行的替代方案；在长期承购、对冲或定制化采购比连续屏幕流动性更重要的场景里尤其如此。直接通过注册簿采购也是替代方案：TIGR
              明确称买方可以开设自己的账户或使用中介，这意味着市场部分环节的默认工作流仍是注册簿加经纪商加手工注销，而不是单一整合场所。对成熟的电力或清洁燃料运营方来说，内部自建也可信，因为 Xpansiv 自己就把
              API、遥测、企业数据交付和合规自动化作为替代碎片化内部系统的价值主张来销售。这一点具有战略意义，因为它意味着 Xpansiv
              往往替换的是一组杂乱的工具和关系，而不只是一个竞争交易所。定价也强化了这一点。保留材料中，Xpansiv 托管解决方案的公开包装细节更多——按比例收取的 SREC 费用和交钥匙 LCFS 工作流——而
              CME、ICE、CIX、ACX 或 Evolution 的场所经济披露更少。这并不说明 Xpansiv
              更便宜；它说明竞争对手费率表的公开证据很薄，所以承保应假设企业定价通过谈判确定、客户经常多平台使用，而不是存在持久的公开价格锁定。实践中，买方可能是把打包工作流预算与内部人力、注册簿费用、经纪佣金和数据订阅比较，而不是与某一个竞争对手的透明标价比较。
