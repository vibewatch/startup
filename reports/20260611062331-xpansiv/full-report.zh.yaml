  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对承保的影响
      - 精确尽调路径
    rows:
      - - 按业务线划分的收入
        - 无法判断经济性由交易所、注册处、数据、电力还是托管解决方案驱动
        - 要求提供 2024-2026 年分部收入、同比增长和客户集中度
      - - 按业务线划分的毛利率
        - 无法判断哪些业务像软件，哪些业务服务属性重
        - 要求提供分部毛利率和直接成本分摊方法
      - - 现金余额和月度烧钱速度
        - 无法衡量流动性缓冲，也无法判断下一次融资事件的时间风险
        - 要求提供月度现金桥和 18 个月预测
      - - 基准和下行情景下的现金跑道月数
        - 无法检验市场收缩时是否无需再次融资也能撑住
        - 要求提供绑定碳交易量和招聘假设的下行情景模型
      - - 实际交易所抽成率和经纪佣金
        - 无法把可见交易流量转换为收入预期
        - 要求按场所和产品提供抽成率历史
      - - 数据客户数、ACV 和续约
        - 无法判断经常性收入质量或数据经济性的耐久度
        - 要求提供 ARR 桥、客户 logo 数、ACV 分布和净留存率
      - - 电力软件 ARR 和服务组合
        - 无法判断电力业务是可扩展软件线，还是劳动密集型服务业务
        - 要求按电力产品提供预订额、ARR、实施收入和利润率
      - - 债务、担保和收购 earn-out
        - 无法评估隐藏的资产负债表压力或或有现金使用
        - 要求提供债务明细、担保登记册和收购付款义务
    notes: 这些正是阻碍完整财务模型的缺口；每一行都对应具体管理层请求，而不是泛泛的“更多尽调”占位符。
