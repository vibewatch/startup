  - id: TP004
    title: 护城河耐久度 / 竞争风险清单——Xpansiv 最强在哪里，风险最高在哪里
    columns:
      - 护城河主张
      - 证据
      - 威胁 / 替代方案
      - 严重程度
      - 缓解措施 / 尽调要求
    rows:
      - - 集成工作流广度
        - Xpansiv 明显覆盖交易所、经纪、注册处、数据、电力和托管解决方案
