  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 栈中角色
      - 公开可验证的接口或流程
      - 关键依赖
      - 主要风险
    rows:
      - - 登记系统
        - 签发、转让、注销和序列化的记录系统
        - 定制工作流、签发算法、计费和监管链记录
        - 项目规则、标准机构、项目验证输入
        - 标准或治理变化可能影响产品完整性和客户信任
      - - Connect 集成层
        - 跨登记系统和交易场所同步组合并自动化工作流
        - REST API、基于角色的权限、令牌认证、银行和登记系统同步、审计日志
        - 登记系统集成、银行工作流、客户企业系统
        - 集成面广，维护和可靠性负担更重
      - - 交易所层（CBL、ACE、JSE-V、H2OX）
        - 价格发现、撮合、结算编排和市场准入
        - 透明订单簿、当日或自动结算、ICH 支持、白标部署
        - 流动性、合格合约设计、交易后登记系统连接
        - 流动性弱或结算链路断裂，会迅速削弱场所价值
      - - 经纪 / 咨询层（Evolution、OTX、Climate Solutions）
        - 结构化交易、OTC 执行、合规策略、项目尽调
        - 经纪交易台、结构化包销、Article 6 和净零咨询、全生命周期工单管理
        - 人的专业能力、监管注册、关系网络
        - 服务强度和受监管实体义务可能限制其像软件一样扩张
      - - 数据层
        - 将交易所和 OTC 活动打包成企业数据集
        - API、SFTP、云数仓、门户交付、历史和实时数据
        - 底层场所活动和伙伴分发
        - 市场活动稀薄会削弱数据护城河和估值用例
      - - 电力层
        - 运营资产并自动化 ISO 交互
        - API/webhook、遥测、结算数据集、争议分析、24/7 运营人员
        - ISO 接口、SCADA 数据、优化器集成
        - 运营中断会直接影响客户调度和结算
      - - 托管工作流层
        - 为长尾客户负责接入、认证和行政执行
        - 认证行政、州别市场映射、清洁燃料和太阳能项目工作流
        - 登记系统规则、安装商或车队数据质量、支持组织
        - 如果自动化弱，支持强度可能比软件利润率增长更快
      - - 合规和法律覆盖层
        - 披露风险、实体边界和项目信息义务
        - AB 1305 页面、期货风险提示、受监管实体披露
        - 外部监管和项目数据来源
        - 公开披露仍可能依赖未由 Xpansiv 独立验证的第三方项目数据
    notes: 由于公开语料没有暴露代码级系统设计或服务地图，架构只能按运营口径描述。
