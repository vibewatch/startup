      - number: '2.2'
        title: 市场测算必须用受限视角，因为公开来源无法支撑一个干净的多商品 TAM
        blocks:
          - type: paragraph
            body: >-
              公开证据足以支撑若干市场视角，但不足以为 Xpansiv 触达的一切构建一个可辩护的混合 TAM。最干净的独立分母仍是自愿碳市场。Ecosystem Marketplace 的 2025 年回顾称，2024
              年交易量下降 25%，价格仅下降 5.5%，注销量达到 182 million
              吨，说明即使周转走弱，终端用户需求仍有韧性。同一证据显示，市场正在转向更新年份和移除类信用，高完整性供给拥有明显价格溢价。Reuters Plus 给出了更尖锐的下行情境：市场停在约 $1.4
              billion，注销量持平，更广泛的信心危机拖慢增长。Climate Focus 同样把 2024 年描述为艰难年份，监管不确定性和完整性担忧突出，同时也指出局部增长和近期年份权重上升。但对 Xpansiv
              来说，碳只是外部最容易测量的一片。公司更近端的可寻址市场，更适合用跨品类的基础设施活动和已安装资产覆盖来代理：交易平台累计名义交易额超过 $2 billion，17 个以上注册簿集成，NAR 发行 1.3
              billion 个 REC，I-REC(E) 在 60 多个国家覆盖 200 GW 容量，基于一吨 TERC 单位的自愿燃料注册簿，以及延伸到水和再生材料的环境信用工作流。因此，本章只在受限意义上使用
              TAM-SAM-SOM 视角。广义 TAM 是跨多个品类的环境属性基础设施；较近的 SAM 是 Xpansiv 已经有在线注册簿、交易所、经纪或数据产品的市场集合；SOM
              则无法用公开数据计算，因为收入结构、抽成率和品类层面的 GMV 均未披露。
