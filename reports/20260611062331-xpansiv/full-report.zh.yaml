      - number: '8.3'
        title: 乐观、基准和悲观情景都说得通，这正是按面值进入应被视为合理到偏高的原因
        blocks:
          - type: paragraph
            body: >-
              情景推演很直接，因为公开记录在战略上很丰富、在经济性上很贫乏。乐观情景认为，Xpansiv 能把今天的平台宽度转化为更高质量收入：质量驱动的 VCM
              复苏延续，注册系统和数据产品变现高完整性信用迁移，电力和清洁燃料工作流放量，Enverus 和 Constellation 等伙伴发布转化为经常性付费活动。基准情景没那么激进，也更有支撑。它假设 Forge 约
              $1.4 billion 的信号大致合理，因为 Xpansiv
              守住了战略位置；但它也假设市场流动性复苏仍不完整，投资者不应像未披露经济性已经被证明那样为其付费。悲观情景并不要求平台失败。只要市场不信任、低流动性或优先股堆叠不透明持续足够久，买方就会对活动指标和私募标记施加更硬的折价。独立市场来源支持这种谨慎。Reuters
              Plus、Ecosystem Marketplace、Climate Focus 和 MSCI 都描述了一个仍由质量驱动、选择性强且受信任约束的市场，而不是全面重新加速的市场。这样的背景让 Xpansiv
              最新标记只有在进入价格纪律严格且尽调条件明确时才具备可投资性，而不是自动看多。
