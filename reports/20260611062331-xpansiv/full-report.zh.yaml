        - 中
        - 要求提供各工作流层的附着率，而不只是场所使用量
      - - 注册处和组合集成
        - 数据、Connect 关联产品、ACE 子账户和托管工作流提高运营黏性
        - CIX 托管加直接注册处账户会收窄这一优势
        - 高
        - 要求提供客户使用多个 Xpansiv 层的证据，以及上线后的流失率
      - - 经纪撮合 OTC 加结构化交易
        - Evolution 和 OTX 让 Xpansiv 在定制化市场强于纯交易所同行
        - OTC 能力可能仍可替代，并由关系驱动
        - 中
        - 按经纪撮合 OTC、交易所、注册处和数据拆分收入，以检验集中度
      - - 托管运营服务
        - 太阳能、电力和清洁燃料页面显示，Xpansiv 能承接重复性工作流和报告任务
        - 大型运营商仍可能自建，或使用垂直服务商
        - 中
        - 要求提供托管工作流相对仅使用场所客户的毛利率和留存数据
      - - 信任和机构分销
        - CIX 有银行关联股东；传统机构拥有交易所信任；市场诚信仍是担忧
        - 对诚信的怀疑或更强的传统机构品牌，可能把流量从 Xpansiv 导走
        - 高
        - 按买方类型审阅赢单 / 输单数据，并询问诚信担忧如何影响转化
      - - 纯流动性护城河
        - CME、ICE、ACX 和 CIX 都提供可行的价格发现或执行路径
        - 多平台并用可能压缩抽成率，并削弱独占性
        - 高
        - 要求提供场所份额、活跃账户重叠度，以及数据或注册处挂钩能阻止客户轻易切换场所的证据
    notes: 这份风险清单关注耐久度，而不只是功能对比；严重程度反映留存和变现承受的竞争压力，不是非生即死的二元风险。
