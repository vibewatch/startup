              Sachs、Aramco Ventures、Macquarie、S&P Global Ventures、Aware Super、BP Ventures、Commonwealth Bank 和 Australian
              Clean Energy Finance Corporation。地点证据弱于融资证据，但仍可使用：Craft 将总部标为 San Francisco，而 Xpansiv 自己的联系页面清楚列出 New York
