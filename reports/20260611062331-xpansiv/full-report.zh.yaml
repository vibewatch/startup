  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接市场基础设施同业真实存在，但攻击的是栈中不同层
        blocks:
          - type: paragraph
            body: >-
              直接竞争并不是一组整齐的同业。Xpansiv 与 Climate Impact X 和 AirCarbon Exchange 正面竞争，争夺机构碳和 REC
              买方；这些买方想要透明执行、托管和交易后确定性，但不想自己搭建每个注册簿工作流。它也与 CME 和 ICE
              间接竞争，后两者的清算期货和环境衍生品可以吸收价格发现和交易员注意力，即便保留来源没有显示同样的全栈采购工作流。材料中 Xpansiv
              的关键差异是平台宽度：交易所页面加上商品、数据、电力和解决方案页面，显示同一平台家族横跨现货场所、经纪、注册簿、组合数据、电力运营和托管式合规工作流。CIX 是整合托管和执行上最接近的公开类比，因为它允许客户在
              CIX 账户中持有来自 11 个注册簿的资产，并叠加市场情报，且由大型金融机构支持。ACX 更像一家专业交易所，披露了会员和国家规模，但工作流宽度可见度低得多。CME 和 ICE
              重要，是因为基准合约、清算和既有分发可以把纯场所层商品化，即便 Xpansiv 在运营工作流上胜出。
