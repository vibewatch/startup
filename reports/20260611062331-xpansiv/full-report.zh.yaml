      - number: '2.3'
        title: 买方、用户和付款方分层是多边的，并且取决于预算所有者
        blocks:
          - type: paragraph
            body: >-
              Xpansiv
              的用户基础不是一个单一的「碳买方」群体。公司的买方页面服务企业可持续发展团队，重点是采购、高完整性来源和可信报告。交易员和经纪商页面则强调深度流动性、透明定价、头寸估值和可靠结算，对应的是做市部门、大宗商品交易员和经纪商，而不是企业可持续发展团队。资产和项目所有者页面指向另一组人：开发商和运营方希望发行属性，锁定结构化承购，把可再生发电、电池储能、SREC、LCFS
              信用或其他证书变现，再用审计轨迹跟踪和注销。合规相关用户又形成额外需求口袋。ACE 明确面向交易 CORSIA 合格单位和 GEO CORSIA CP1 合约的航空公司；JSE-V Carbon
              通过白标市场模式服务南非的碳和 I-REC 参与者。水用户又不同：H2OX
              向澳大利亚水权市场中的灌溉者、交易员和企业销售实时定价、地块可见性和快速结算。跨这些细分市场，预算所有者会变化。企业证书项目通常落在可持续发展、采购、财务或风险团队；航空公司抵消购买更接近合规和燃料采购职能；交易台归属组合和风险团队；资产所有者则用商业、运营或项目融资预算付款。这种分层具有战略意义，因为
              Xpansiv 在每个细分市场赢单的理由可以不同——合规工作流、流动性、可追溯性或变现——而不是只卖一个标准化 SaaS 席位。
