      - number: '5.2'
        title: 模块宽度真实存在，运营模型把软件重的基础设施与服务重的执行混在一起
        blocks:
          - type: paragraph
            body: >-
              对一家私营气候基础设施公司来说，已审阅证据中的模块地图异常宽。注册簿是软件重的记录系统，带可配置规则、发行逻辑、计费和审计支持。Connect 是互操作层，把
              API、头寸同步和基于角色的访问暴露给这些注册簿及其连接场所。CBL 和更广泛的交易所栈提供透明订单簿和直通式结算；ACE 和 JSE-V 则说明 Xpansiv
              可以把同一套管道包装成合规专用或白标产品。Evolution Markets 和 OTX
              的位置略有不同：它们与其说是纯软件模块，不如说是市场接入服务，利用平台其余部分支持经纪、结构化承购、咨询工作和组合策略。Data 和 Power 又把模型进一步延伸进企业运营。Data
              变现跨环境和能源商品的已验证交易流和历史数据集；Power 则把 SaaS 调度、遥测、结算支持和全天候运营覆盖组合起来，覆盖美国全部七个 ISO。Managed Solutions、H2OX 和 Digital
              Fuels Registry 又说明，在客户更看重外包接入、合规管理或更快结算，而不是通用软件可配置性的窄品类工作流中，Xpansiv
              也能掌握环节。结果是一个混合运营模型：部分模块像云基础设施，部分像工作流软件，还有部分仍是被包装进同一平台故事的服务重市场接入业务。
