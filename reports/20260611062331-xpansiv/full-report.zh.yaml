companyProfile:
  summary: >-
    Xpansiv 是一家后期私营环境商品基础设施公司，由 CBL 与 Xpansiv 在 2019 年合并形成。平台现在覆盖注册簿、通过 Connect 管理组合和转移、通过 CBL 执行现货交易、通过 Evolution
    Markets
    提供经纪和市场执行、市场数据、电力软件，以及托管式清洁能源和清洁燃料工作流。公开证据足以支持其战略规模、主要机构投资者反复背书，以及独角兽级价格仍有支撑；但当前收入、利润率、流动性和优先股堆叠细节仍不足以完成完整承保。
