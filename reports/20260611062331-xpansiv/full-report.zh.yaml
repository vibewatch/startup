  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 这张栈图展示 Xpansiv 的模块如何从发行基础设施一路叠到数据分发和托管工作流。
    data:
      layers:
        - label: 发行与注册簿系统
          detail: 记录系统负责发行、序列化、转移并注销环境工具。
          items:
            - label: NAR
              detail: 北美 REC、小时级 REC、ZEC
            - label: TIGR
              detail: 全球可再生能源证书和注销
            - label: Evident
              detail: I-TRACK 治理下的 I-REC(E) 保管链
            - label: Digital Fuels Registry
              detail: TERC 和低碳燃料属性
        - label: 资产组合与集成层
          detail: 共享工作流层同步余额，并开放报告和 API。
          items:
            - label: Xpansiv Connect
              detail: 资产组合同步、转移、注销、报告
            - label: API 与企业集成
              detail: ETRM、ERP、可持续发展系统
            - label: 审计与权限控制
              detail: RBAC、令牌认证、审计日志
        - label: 执行与市场准入
          detail: 交易场所和经纪商提供价格发现、结构化执行和结算路由。
          items:
            - label: CBL
              detail: 现货交易所和交易后结算
            - label: ACE
              detail: CORSIA 采购和 IATA 关联结算
            - label: JSE-V 与 H2OX
              detail: 区域碳和水交易场所的白标方案
            - label: Evolution / OTX
              detail: 经纪式 OTC、结构化和咨询流量
        - label: 运营与洞察产品
          detail: 下游产品靠数据、电力运营和托管工作流，把平台活动变现。
          items:
            - label: Xpansiv Data
              detail: 通过 API、SFTP、数据仓库、门户提供交易所和 OTC 定价
            - label: Xpansiv Power
              detail: ISO 调度、遥测、结算、24/7 运营
            - label: Managed Solutions
              detail: 太阳能和清洁燃料接入与管理
    approximationNotes: 分层是分析性划分，但图中每个模块都在保留的公开来源中明确出现。
