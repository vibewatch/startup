  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - VCM 质量修复提升付费成交量；注册登记数据和能源工作流证明可重复经济性，且高级优先权可控。
        - 名义价值区间为 $1.7B-$2.1B；上行来自证明 Xpansiv 更接近优质基础设施，而不是服务偏重的平台。
        - 伙伴发布仍停留在试点，或经常性收入质量弱于叙事。
        - 有可能，但需要私有证据升级。
      - - 基准
        - Forge 约 $1.4B 的标记方向上正确，基础设施宽度真实，变现质量参差但可接受。
        - $1.2B-$1.5B；围绕当前公开锚点大致公允，但在拿到更多文件前，还不够便宜，无法承销。
        - 流动性修复仍不完整，私有经济性继续不透明。
        - 最符合保留材料。
      - - 熊市
        - 市场不信任和低流动性持续；数据或注册登记变现转化不足，或股权结构显示高级权利厚重。
        - 普通股价值支撑为 $0.7B-$1.0B；即使名义估值没有大幅重置，下行也可能出现。
        - 选择性需求、薄利润率或沉重优先权会压缩普通股结果。
        - 若尽调不及预期，影响重大。
      - - 按表面价值进场检查
        - 将 Forge 作为检查点，而不是通关证明。
        - 只有管理层能证明经常性、高利润率收入和可控瀑布，约 $1.4B 才站得住。
        - 没有这些证明，按表面价值进场是偏高，而不是保守。
        - 接受前需要尽调。
    notes: 情景区间是基于公开估值锚点、市场结构证据和披露质量搭出的简单承销区间；它们不是 DCF，也不是公平性意见。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV042
      - CV043
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标锚点
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Xpansiv 2022 年 Blackstone 轮
        - $400M 战略投资
        - 投后约 $1.2B 锚点
        - 保留材料中最后一个清晰披露、带定价的融资事件。
        - 发生在 2024-2025 年诚信重置和后续平台扩张之前，时间偏旧。
      - - Xpansiv 2025 年 Forge 信号
        - 二级市场式参考
        - 最新已知估值约 $1.4B
        - 最新公开估值信号，也是当前最佳检查点。
        - 不是披露的一手融资轮，也不足以揭示瀑布经济性。
      - - ICE
        - 拥有交易数据和上市收入的公开交易所运营商
        - 经审计的公开市场基础设施基准
        - 可为交易所 + 数据基础设施的成熟收入质量提供参照。
        - 规模远大于 Xpansiv，更多元，也受到更重监管。
      - - CME 环境产品套件
        - 与 CBL 交割挂钩的衍生品和实物结算自愿碳合约
        - 公开交易所生态参考
        - 说明 Xpansiv 产品已经向更大的衍生品市场供给。
        - 衍生品偏重模式不同于 Xpansiv 的交易所 - 注册登记 - 服务混合堆栈。
      - - AirCarbon Exchange
        - 成交 21 Mt，190 名活跃会员，覆盖 30 个国家
        - 私有数字碳交易所类比对象
        - 可用于比较数字原生自愿碳市场基础设施。
        - 披露宽度窄于 Xpansiv，可见规模也更小。
      - - 伙伴渠道验证集
        - Enverus 和 Constellation 发布
        - 商业验证，不是交易倍数
        - 说明 Xpansiv 可以嵌入估值工作流和清洁能源证书市场。
        - 伙伴验证仍未披露 Xpansiv 自身的收入转化或利润率。
    notes: 本表完整覆盖本章使用的可比框架：两个 Xpansiv 锚点、两个大型公开基础设施参照、一个数字碳交易所类比对象，以及一行渠道验证。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        This table exhaustively covers the benchmark set actually used in the valuation argument for this chapter and
        intentionally mixes priced anchors, public infrastructure references, and model-appropriate analogs.
