      - number: '8.2'
        title: Xpansiv 应被框定为混合型市场基础设施，但正确可比公司仍要求克制，而不是兴奋
        blocks:
          - type: paragraph
            body: >-
              Xpansiv 仍值得获得溢价框架，最好的理由是公司已经不只是一个碳交易所故事。它自己的 2025
              年里程碑新闻稿描述了一个平台，覆盖清洁能源和电力、碳和排放、清洁燃料和交通、水以及再生材料，并横跨市场接入、结构化交易、签发、经纪、结算、组合管理、电力运营和数据。同一新闻稿还指出，2024 年全球 REC
              签发量的 31% 通过其 REC 注册系统网络完成，其自有 REC 注册系统代表约 6% 的全球可再生电力装机容量，在电力领域服务超过 15 GW，通过 Connect 完成约十亿项资产转移，并且 Market
              Execution 自 2020 年以来促成超过 $800 billion 名义价值。Enverus 的外部映射进一步增强：其称 MarketView 用户群现在可以使用 Xpansiv 现货和 OTC
              数据，来支持可辩护的盯市估值和风险决策。这是基础设施行为，不是宣传册软件。但可比公司组合仍要求保持谦逊。ICE 展示了成熟交易加数据收入质量的样子；CME
              展示了环境产品如何接入一台更大的衍生品机器；AirCarbon Exchange 则提供了一个规模更小的数字原生类比。Xpansiv 在战略上更接近混合型交易所基础设施，而不是纯经纪商，但它仍缺少让 ICE
              式估值安心成立的已审计经济数据。
