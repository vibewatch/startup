    title: 'Recommendation Stance: Track at Fair Value'
    body: Generate:Biomedicines represents a pioneering generative AI therapeutics developer with legitimate late-stage clinical exposure via GB-0895. However, with an implied valuation around $2.04B matching its private Series C baseline, public market pricing already reflects platform credit ahead of Phase 3 binary trial readouts.
    claimRefs:
