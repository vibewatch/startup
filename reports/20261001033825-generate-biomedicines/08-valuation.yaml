  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Debate Pillar
      - Core Thesis Argument
      - Anti-Thesis Counterargument
      - What Would Change View
    rows:
      - - Platform Technology & AI Moat
        - Proprietary generative biology models automate de novo protein design, validated by Amgen and Novartis multi-target partnerships
        - Pure computational platform claims lack standalone commercial value until molecules demonstrate reproducible clinical efficacy
        - Disclosed clinical success rates across non-respiratory modalities including CAR-T GB-5267 and MMAE neutralizer GB-4362
      - - Lead Asset Execution
        - GB-0895 targets TSLP with extended half-life enabling convenient six-month dosing intervals in severe asthma and COPD
        - Severe asthma is already contested by established biologics like tezepelumab, creating severe payer access and pricing hurdles
        - Head-to-head pharmacodynamic data proving differentiated exacerbation reduction and superior patient compliance
      - - Financial Runway & Burn Rate
        - $457.4M in cash and marketable securities provides runway into first half of 2028, buffering ongoing clinical trial execution
        - Net cash outflow of $138.3M over six months signals rapid cash depletion requiring substantial refinancing before commercialization
        - Acceleration of non-dilutive milestone inflows from Amgen ($1.9B potential) or Novartis reducing net cash burn below $40M/quarter
      - - Valuation & Risk-Reward
        - Implied valuation of ~$2.04B represents disciplined pricing relative to private Series C valuation and peak biologics market potential
        - Lack of product revenues and cumulative operating losses since inception create extreme downside sensitivity to clinical trial delays
        - Regulatory filing acceptance with clear label advantages or binding commercial co-promotion commitments
    notes: Structured comparison of investment thesis pillars against commercial and clinical counterarguments, highlighting key verification catalysts.
