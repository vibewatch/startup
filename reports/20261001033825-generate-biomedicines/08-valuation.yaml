  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Signal
      - Core Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Triggers
    rows:
      - - Bull Case
        - 25%
        - SOLAIRIA-1/2 Phase 3 trials succeed with robust six-month dosing durability; Amgen exercises pipeline expansion options; cash burn moderates
        - $3.5B - $4.5B implied valuation (+70% to +120% upside) driven by premium biologics multiple on projected blockbuster asthma peak sales
        - Competitive emergence of oral TSLP inhibitors or regulatory delays in major European and Asian study sites
      - - Base Case
        - 50%
        - GB-0895 achieves non-inferior clinical endpoints in severe asthma; partnership revenue averages $25M-$35M annually; refinancing completed in late 2027
        - $1.8B - $2.4B implied valuation (-10% to +20% return) reflecting fair value pricing aligned with post-IPO capitalization
        - Payer formulary resistance demanding heavy discounting, compressing gross margins below biopharma industry standards
      - - Bear Case
        - 25%
        - SOLAIRIA trials fail to demonstrate statistically significant benefit over standard of care; cash burn forces dilutive equity financing below $10/share
        - $500M - $800M valuation (-60% to -75% drawdown) valuing the company primarily on cash liquidation and residual early-stage IP
        - Clinical safety halts, partner termination of multi-target programs, or shareholder lockup expiration dumping
    notes: Scenario probability weights and valuation logic based on replicate Phase 3 SOLAIRIA clinical execution and 2028 cash horizon.
