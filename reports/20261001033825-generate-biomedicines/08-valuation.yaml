      - CV008
      - CV013
  - calloutType: risk
    title: Operating Loss and Financing Horizon Risk
    body: Operating cash burn of $138.3M over six months and quarterly net losses exceeding $67M mean the company cash buffer will require additional equity or debt financing by early 2028, presenting dilution risk if clinical milestones stumble.
