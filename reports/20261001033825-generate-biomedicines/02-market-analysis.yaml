callouts:
  - calloutType: "insight"
    title: "Clinical Execution Dominates Pure Platform Narrative"
    body: >
      Generate:Biomedicines has shifted its market identity from an early-stage computational platform to an asset-driven clinical biotechnology enterprise. With lead candidate GB-0895 progressing through replicate global Phase 3 trials in severe asthma across 33 approved nations, market sentiment and corporate valuation are fundamentally tied to late-stage regulatory readouts and commercial competitiveness rather than computational benchmark demonstrations.
    claimRefs:
      - "CM001"
      - "CM007"
      - "CM008"
