    title: Product architecture map
    type: stack
    summary: >-
      Six-layer operating architecture of the Generate Platform illustrating the computational and physical feedback
      loop.
    data:
      layers:
        - label: Generative AI Foundation Models
          detail: >-
            In silico sequence and structure generation trained on natural protein rules to propose de novo therapeutic
            candidates.
        - label: Automated Wet-Lab Synthesis
          detail: >-
            High-throughput robotic synthesis and expression translating computational designs into physical protein
            molecules.
        - label: High-Throughput Biophysical Assays
          detail: >-
            Robotic screening measuring target binding affinity, kinetics, and functional modulation across thousands of
            variants.
        - label: CryoEM Structural Determination
          detail: >-
            Four top-tier electron microscopes providing atomic-resolution validation of protein-target interaction
            interfaces.
        - label: Centralized Data Lake & Scientific Agents
          detail: >-
            Unified repository ingesting all experimental measurements for autonomous agentic analysis and hypothesis
            exploration.
        - label: Closed-Loop Retraining Engine
          detail: >-
            Continuous feedback loop updating model weights and training parameters in real time based on physical assay
            data.
