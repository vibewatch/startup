chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Generative Biology Platform
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines is a clinical-stage generative biology company pioneering an automated integration
              of machine learning algorithms and high-throughput experimental biology to generate novel protein
              therapeutics. The company was incorporated in Delaware in August 2018 under the original legal name
              Flagship VL56, Inc. by venture creation firm Flagship Pioneering, before adopting its current corporate
              name in February 2020. Operating from its headquarters in Somerville, Massachusetts, the organization has
              transitioned from foundational computational research into an active clinical development stage. Its
              proprietary Generate Platform continuously trains machine learning models on biological data to design de
              novo proteins with optimized therapeutic properties, bypassing traditional empirical screening.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
