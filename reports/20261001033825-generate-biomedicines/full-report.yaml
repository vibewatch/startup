              - CU008
              - CU012
              - CU015
              - CU016
      - number: '6.4'
        title: Concentration and expansion remain insufficiently disclosed
        blocks:
          - type: paragraph
            body: >
              Public evidence supports only a narrow named-counterparty set and does not disclose the revenue share
              attributable to each partner, contract renewal dates, termination behavior, churn, or total active-account
              count. Headline milestone ceilings are contingent opportunities rather than booked revenue or committed
              cash, and future royalties require licensed products to reach commercial sales. Generate's first disclosed
              partner-program advancement is encouraging, but one preclinical handoff does not demonstrate a repeatable
              conversion rate across the confidential portfolio. Diligence should therefore focus on partner-level
              revenue concentration, target-by-target continuation decisions, remaining performance obligations,
              termination rights, and the proportion of collaboration programs that advance from research into
              development.
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU008
              - CU012
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Active research demand is not commercial medicine adoption
            body: >-
              Partner payments, program expansion, and preclinical handoff validate research engagement, but they do not
              establish prescription demand, payer access, patient retention, or product-market fit for an approved
              medicine.
            calloutType: insight
            claimRefs:
              - CU001
              - CU005
              - CU008
          - type: callout
            title: Retention and concentration cannot be calculated
            body: >-
              Public disclosures do not provide partner-level revenue, renewals, churn, contract duration, or
              termination outcomes. Diligence should obtain those denominators before treating collaboration revenue as
              durable recurring demand.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
