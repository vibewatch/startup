              - CO004
              - CO007
      - number: '1.2'
        title: Executive Leadership, Scientific Founders, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              The company is guided by experienced biopharmaceutical executives and foundational computational biology
              pioneers. Michael Nally joined as Chief Executive Officer and Director in March 2021 following an
              extensive executive career at Merck & Co., where he previously served as Chief Marketing Officer.
              Scientific co-founder Dr. Gevorg Grigoryan serves as Chief Technology Officer, leveraging academic
              insights from Dartmouth College and MIT into computational structural biology to direct platform algorithm
              development. Flagship Pioneering founder Dr. Noubar B. Afeyan chairs the board of directors, providing
              institutional backing and venture governance. As of December 31, 2025, the company employed 312 full-time
              staff, with 138 holding advanced doctoral or medical degrees.
            claimRefs:
              - CO005
              - CO006
              - CO008
