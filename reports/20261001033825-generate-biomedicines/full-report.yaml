        title: Capitalization, Preferred Venture Financing, and Public Listing
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines built a robust capital base prior to entering the public markets, securing $693
              million in aggregate venture capital across four financing rounds through late 2024. Lead institutional
              sponsor Flagship Pioneering anchored early financing alongside major global investors including the Abu
              Dhabi Investment Authority, Alaska Permanent Fund, Arch Venture Partners, and strategic partner Amgen. On
              February 27, 2026, the company completed its initial public offering on The Nasdaq Stock Market under the
