            body: >-
              Generate:Biomedicines operates a hybrid development model combining wholly owned proprietary clinical
              programs with high-value pharmaceutical partnerships. By deploying computational generative biology models
              coupled with high-throughput laboratory validation, the company simultaneously advances internal assets
              such as GB-0895 in asthma and partnered programs with Amgen and Novartis, creating multiple independent
              monetization paths.
