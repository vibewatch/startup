      - number: '6.3'
        title: Revenue evidence is active but not recurring-retention evidence
        blocks:
          - type: paragraph
            body: >
              Collaboration revenue increased from $20.459 million in 2024 to $31.893 million in 2025, but the more
              recent comparison moved in the opposite direction: second-quarter 2026 collaboration revenue was $6.314
              million versus $10.130 million in the prior-year quarter, and first-half 2026 collaboration revenue was
              $13.538 million versus $18.948 million in first-half 2025. The filing also expected the remaining fixed
              Novartis transaction price to be recognized through 2027 and the remaining Amgen transaction price through
              2026. These schedules indicate continuing contracted work, not ARR, NRR, renewal, or cash collected in
              those periods. Revenue timing follows performance obligations and therefore should not be read as customer
              growth without contract-level denominators.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU015
              - CU016
          - type: table
