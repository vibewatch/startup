        title: Clinical Pipeline Progression and Corporate Milestones
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines has advanced multiple computational candidates into human clinical studies, led by
              GB-0895, an investigational anti-TSLP monoclonal antibody undergoing global Phase 3 replicate trials in
              severe asthma across 33 approved jurisdictions. In oncology, the company is advancing GB-4362, a selective
