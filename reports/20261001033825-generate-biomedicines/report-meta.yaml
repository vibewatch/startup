companyProfile:
  summary: >-
    Generate:Biomedicines is a public, post-IPO clinical-stage biopharmaceutical company built around a generative
    biology platform that uses machine learning and high-throughput experimentation to design novel protein
    therapeutics. Its lead internal program is GB-0895 for severe asthma, while Amgen and Novartis collaborations
    provide external validation and non-dilutive revenue.
