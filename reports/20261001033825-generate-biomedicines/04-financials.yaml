callouts:
  - calloutType: risk
    title: High Clinical Burn Rate and Equity Dilution Dependency
    body: >-
      While Generate $457.4 million cash reserve provides operational runway into H1 2028, net cash used in operating
      activities reached $138.3 million in the first half of 2026. Because GB-0895 Phase 3 trials are expanding across
      33 countries and the company has no commercial product revenue, capital intensity will remain elevated, leaving
      Generate reliant on milestone achievement or secondary equity financing to fund commercial launch.
    claimRefs:
      - CI001
      - CI010
      - CI012
  - calloutType: insight
    title: Collaboration Economics Validate Generative Biology Scalability
    body: >-
      Generate multi-target agreements with Amgen and Novartis demonstrate that large biopharma counterparties are
      willing to commit substantial upfront capital ($50 million from Amgen) and milestone structures (up to $370
      million per program) to access the platform. This non-dilutive funding partially subsidizes internal R&D while
      preserving full commercial ownership of lead asset GB-0895.
    claimRefs:
      - CI005
      - CI006
      - CI007
