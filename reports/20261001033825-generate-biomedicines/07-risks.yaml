callouts:
  - calloutType: "risk"
    title: "Replicate Phase 3 Execution Across 42 Jurisdictions Is Generate's Primary Valuation Driver"
    body: "With GB-0895 advancing through replicate Phase 3 SOLAIRIA trials across 33 approved jurisdictions out of 42 planned, trial execution, retention, and timely readout represent the single largest binary determinant of Generate's enterprise value. Any protocol modification, patient recruitment delay, or safety signal in asthma or COPD would directly impair Generate's clinical credibility and market valuation."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR013"
  - calloutType: "insight"
    title: "Runway Extension into 2028 Provides Operational Buffer but Masks Long-Term Commercial Capital Needs"
    body: "While Generate's $457.4 million cash balance as of June 30, 2026, secures its operating runway into the first half of 2028, ongoing annualized net operating cash burn exceeding $270 million means commercial-scale launch preparation, marketing infrastructure buildout, and expanded manufacturing commitments will necessitate substantial additional external financing or expanded partner milestone monetization."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
