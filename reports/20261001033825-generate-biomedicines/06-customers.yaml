chapter:
  number: 6
  title: "Customers"
  summary: "Generate's present paying-customer evidence is concentrated in two research counterparties, Amgen and Novartis, while MD Anderson and Roswell Park are co-development partners rather than conventional customers. Collaboration revenue and partner-program advancement demonstrate activity, but public evidence does not establish renewal, churn, partner-level concentration, contract duration, or commercial-product adoption."
sections:
  - id: "who-pays-and-who-benefits"
    title: "Who pays, who uses, and who may ultimately benefit"
    body: |
      Generate is still a clinical-stage biotechnology company, so its customer model is not yet a conventional medicine-sales model. The filing treats Amgen and Novartis as customers under ASC 606 because they pay for research services and licenses; the immediate users are partner discovery and development teams. MD Anderson and Roswell Park instead operate under co-development arrangements accounted for as collaborations, with research-cost and potential commercialization economics shared between the parties. Patients, prescribers, and payers are prospective downstream beneficiaries and buyers only if a candidate receives approval. This distinction matters because current collaboration revenue is evidence of enterprise demand for research output, not evidence of patient adoption, reimbursed prescriptions, or a commercial franchise.
    claimRefs:
      - "CU001"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "proof-of-active-adoption"
    title: "Proof of active partner adoption"
    body: |
      The strongest adoption signals are program expansion and movement into a partner's development pipeline. Amgen's original five-target agreement included options for additional targets, and a sixth target was added in December 2023. Generate also reports six confidential Amgen programs and multiple confidential Novartis programs. In the second quarter of 2026, Novartis advanced a biologic designed with the Generate Platform into its preclinical pipeline. Roswell Park's GB-5267 collaboration had progressed to an actively recruiting Phase 1 study, although the first patient was still expected later in 2026 at the August update. These are meaningful workflow milestones, but they remain pre-commercial and do not establish end-market outcomes.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "revenue-and-durability"
    title: "Revenue evidence is active but not recurring-retention evidence"
    body: |
      Collaboration revenue increased from $20.459 million in 2024 to $31.893 million in 2025, but the more recent comparison moved in the opposite direction: second-quarter 2026 collaboration revenue was $6.314 million versus $10.130 million in the prior-year quarter, and first-half 2026 collaboration revenue was $13.538 million versus $18.948 million in first-half 2025. The filing also expected the remaining fixed Novartis transaction price to be recognized through 2027 and the remaining Amgen transaction price through 2026. These schedules indicate continuing contracted work, not ARR, NRR, renewal, or cash collected in those periods. Revenue timing follows performance obligations and therefore should not be read as customer growth without contract-level denominators.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "concentration-and-diligence"
    title: "Concentration and expansion remain insufficiently disclosed"
    body: |
      Public evidence supports only a narrow named-counterparty set and does not disclose the revenue share attributable to each partner, contract renewal dates, termination behavior, churn, or total active-account count. Headline milestone ceilings are contingent opportunities rather than booked revenue or committed cash, and future royalties require licensed products to reach commercial sales. Generate's first disclosed partner-program advancement is encouraging, but one preclinical handoff does not demonstrate a repeatable conversion rate across the confidential portfolio. Diligence should therefore focus on partner-level revenue concentration, target-by-target continuation decisions, remaining performance obligations, termination rights, and the proportion of collaboration programs that advance from research into development.
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU007"
      - "CU008"
      - "CU012"
      - "CU015"
      - "CU016"
