figures:
  - id: "FU001"
    title: "Collaboration customer journey from target scope to contingent commercialization"
    type: "journey-map"
    summary: "The observable journey reaches research expansion and one partner preclinical handoff; later clinical and commercial conversion remains contingent."
    data:
      items:
        - label: "1. Target scope"
          detail: "A pharmaceutical counterparty selects multiple research targets and licenses Generate's research output."
          touchpoints:
            - "Amgen initial five-target scope"
            - "Novartis multi-target agreement"
        - label: "2. Upfront commitment"
          detail: "The counterparty pays upfront consideration and may also make an equity investment."
          touchpoints:
            - "Amgen $50.0 million initial upfront payment"
            - "Novartis $50.0 million upfront payment"
        - label: "3. Research performance"
          detail: "Generate performs program-specific research and recognizes collaboration revenue as performance obligations are satisfied."
          touchpoints:
            - "Cost-incurred revenue recognition"
            - "Confidential program execution"
        - label: "4. Expansion or milestone"
          detail: "A counterparty may add a target or trigger a development milestone when agreed criteria are met."
          touchpoints:
            - "Amgen sixth target"
            - "Amgen first development milestone payment"
        - label: "5. Partner development handoff"
          detail: "A generated biologic can move into the counterparty's own preclinical development pipeline."
          touchpoints:
            - "Novartis preclinical advancement reported in Q2 2026"
        - label: "6. Clinical and commercial conversion"
          detail: "Future milestones and royalties require further development and licensed-product sales; no product-sales revenue was disclosed."
          touchpoints:
            - "Development and regulatory milestones"
            - "Contingent net-sales royalties"
    approximationNotes: "The sequence reflects disclosed contract mechanics and observed milestones; it does not estimate stage duration, conversion probability, or future cash receipts."
    claimRefs:
