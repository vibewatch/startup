callouts:
  - calloutType: "insight"
    title: "Active research demand is not commercial medicine adoption"
    body: "Partner payments, program expansion, and preclinical handoff validate research engagement, but they do not establish prescription demand, payer access, patient retention, or product-market fit for an approved medicine."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU008"
  - calloutType: "risk"
    title: "Retention and concentration cannot be calculated"
    body: "Public disclosures do not provide partner-level revenue, renewals, churn, contract duration, or termination outcomes. Diligence should obtain those denominators before treating collaboration revenue as durable recurring demand."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU015"
      - "CU016"
