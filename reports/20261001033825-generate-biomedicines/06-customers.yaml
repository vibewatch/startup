      missingEvidence: "Partner-level revenue, contract duration, renewal dates, termination outcomes, churn, satisfaction, and remaining performance obligations by counterparty."
      whyItMatters: "Without these denominators, investors cannot distinguish durable repeat demand from concentrated and episodic revenue recognition."
      diligencePath: "Request the customer-contract schedule, partner-level revenue concentration, renewal and termination history, and quarterly remaining-performance-obligation roll-forward."
