      - number: '7.2'
        title: 运营脆弱性、CDMO 代工依赖与知识产权壁垒
        blocks:
          - type: paragraph
            body: >-
              Generate
              的原料药合成、制剂配方、冷链物流以及无菌灌装等业务完全依赖外部合同研发生产机构（CDMO）。公司自身并不拥有或运营商业化规模的生产工厂，这导致其面临单点依赖第三方的脆弱性，包括设备故障、原材料短缺、污染事故以及现行药品生产质量管理规范（cGMP）下的批次不合格报废。外部生产基地的任何停滞，都可能导致正在进行的
              3 期临床给药中断、延误监管审批申报材料递交，或引致巨额经济赔偿。技术端，Generate 的平台将闭环机器学习模型与自动化高通量湿实验结合，用于生成新型蛋白质序列。尽管 Generate
              拥有涵盖蛋白质设计生成式扩散模型的专利（如 US 12,580,040），但计算生物学领域的自由实施权（FTO）正面临着来自 4,000
              多家活跃生物技术竞争对手日益拥挤的竞争环境。捍卫专有模型架构、序列空间和从头设计抗原表位免受竞对专利侵扰，需要持续投入法律审查与资金成本。
            claimRefs:
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: 交易对手集中度、合作里程碑与收入可持续性
        blocks:
          - type: paragraph
            body: >-
              Generate 的非稀释性资金与近期商业化背书高度依赖与制药巨头（主要是 Amgen 和 Novartis）的战略研发合作。根据 2022 年启动的多靶点协议，Amgen 在最初五个靶点上承诺提供 $50M
              首付款，每个项目下游研发里程碑款项最高可达 $370M，此外还附带潜在的销售分成。然而合作收入已从 2025 年第二季度的 $10.1M 下滑至 2026 年第二季度的
              $6.3M，折射出临床前阶段考核与里程碑触发时点的难以预测。这种收入的高度集中使 Generate
              极易受到外部管理决策、合作方研发重心转移或单方面终止合作项目的影响。一旦合作方降低已指定项目的优先级或放缓临床前推进速度，Generate
              将失去至关重要的现金流入与平台能力的外部背书，从而给其独立资产负债表带来沉重的融资压力。
            claimRefs:
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: 现金消耗、股权稀释风险与投资逻辑证伪指标
        blocks:
          - type: paragraph
            body: >-
              Generate 于 2026 年 2 月完成纳斯达克 IPO（代码 GENB），筹集了大量资金，为临床业务的扩张提供了必要的流动性支持。截至 2026 年 6 月 30
              日，公司持有现金、现金等价物及有价证券共计 $457.4M，较 2026 年第一季度末的 $516.6M 有所下降。2026 年上半年经营活动消耗现金
              $138.3M，主要是由于全球临床试验网点扩增导致单季度研发投入走高，仅第二季度研发开支就达到 $64.3M。管理层预计现有现金储备可支撑运营至 2028
              年上半年，但也明确警示：在任何资产实现商业化盈利之前，公司都需要大笔追加股权或债权融资。未来的融资可能会稀释现有公众股东权益，或带来严苛的债务限制条款。关键在于，投资者必须紧盯投资逻辑证伪的触发条件（thesis-break
              triggers）：SOLAIRIA 试验中出现未能消除的安全风险信号、GB-0895 未能展现出显著的临床差异化优势，或任一跨国药企巨头终止合作，都会直接推翻核心投资逻辑。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR012
      - number: '7.5'
        title: 图表与补充材料
        blocks:
          - type: callout
            title: 覆盖 42 个国家和地区的 3 期重复试验执行力是 Generate 估值的核心驱动器
            body: >-
              随着 GB-0895 在计划的 42 个国家和地区中已获批的 33 个区域全力推进 3 期 SOLAIRIA 重复试验，试验推进节奏、患者留存及能否按时读出数据，构成了决定 Generate
              企业价值最大的非成即败因素。在哮喘或 COPD 试验中出现的任何方案调整、招募延期或安全隐患信号，都会直接重创 Generate 的临床信誉与市场估值。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: callout
            title: 现金跑道延至 2028 年提供了运营缓冲，但掩盖了长期的商业化资金渴求
            body: >-
              尽管截至 2026 年 6 月 30 日 Generate 拥有的 $457.4M 现金余额保障了其至 2028 年上半年的运营资金，但目前年化超 $270M
              的净经营现金消耗意味着，商业化规模的上市筹备、营销渠道建设以及扩产承诺仍需大额额外外部融资或扩大合作伙伴的里程碑款项兑现。
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
              - CR006
