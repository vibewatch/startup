            title: 模型本身并非坚固壁垒
            body: 管理层指出，生成式模型正在迅速同质化；投资逻辑转而依赖实验吞吐量、临床转化效率及与大药企的深度绑定，用竞争对手无法迅速复制的扎实证据来立足。
