    rows:
      - - 平台技术与 AI 护城河
        - 专有生成式生物学模型实现从头蛋白质自动化设计，已获 Amgen 与 Novartis 多靶点合作背书
        - 纯计算平台的主张若缺乏分子可重复临床疗效验证，难有独立商业价值
        - 披露非呼吸系统模态的临床成功率，包括 CAR-T GB-5267 与 MMAE 中和剂 GB-4362
      - - 核心管线推进
        - GB-0895 靶向 TSLP 且半衰期延长，在重度哮喘与 COPD 中可实现 6 个月给药一次的便利给药间隔
        - 重度哮喘已有 tezepelumab 等上市生物制剂盘踞，支付方准入与定价门槛极高
        - 头对头药效学数据证实其在减少急性发作上具备差异化优势，且患者依从性更优
      - - 资金跑道与烧钱速度
        - $457.4M 现金及有价证券支撑现金跑道至 2028 年上半年，为推进临床试验提供缓冲
        - 半年净现金流出 $138.3M 预示资金消耗过快，商业化前需要大额再融资
        - 来自 Amgen（潜在 $1.9B）或 Novartis 的非稀释性里程碑回款加速，将季度净烧钱压至 $40M 以下
      - - 估值与风险收益比
        - 约 ~$2.04B 的隐含估值相较一级市场 C 轮估值及重磅生物药峰值销售潜力而言，定价较为克制
        - 缺乏产品销售收入且成立以来累计经营亏损，导致估值对临床试验延期极度敏感
        - 监管受理申报并认可明确标签优势，或签署具有约束力的商业化联合推广协议
    notes: 结构化对比投资逻辑支柱与商业及临床反向质疑，突出核心验证催化剂。
