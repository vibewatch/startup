            body: >-
              Generate:Biomedicines 的市场定位已从早期的计算平台转变为资产驱动型的临床生物科技企业。随着核心管线 GB-0895 在 33 个获批国家推进重度哮喘全球 3
              期重复临床试验，市场情绪与公司估值已根本性地绑定在后期监管审批结果与商业竞争力上，而非计算基准指标的演示。
            calloutType: insight
