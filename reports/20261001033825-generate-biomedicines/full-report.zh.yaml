  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与相关适应症延展
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines
              主打计算程序化生物疗法。公司摒弃传统高通量分子试错筛选，转而利用机器学习算法建模蛋白质序列、结构与生物功能之间的关系。其目标市场涵盖单克隆抗体、多特异性抗体、工程化酶及针对重度肺部和肿瘤疾病的细胞疗法等处于临床阶段的生物药生成。针对重度哮喘，核心候选药
              GB-0895 直接靶向上游抗 TSLP 细胞因子轴，与已上市的 IL-4、IL-5 及 IgE
              抑制剂等成熟生物制剂机制正面竞争，而吸入性糖皮质激素和支气管扩张剂等现有标准疗法仅作为基础对照用药。而在肿瘤领域，候选药物 GB-4362 定位为降低毒副作用的辅助中和剂，选择性结合从 enfortumab
              vedotin 等抗体偶联药物（ADC）释放至循环血液中的游离单甲基奥瑞他汀
              E（MMAE），开辟出全新的疗效增强细分市场，而非单打独斗的细胞毒性药物。传统小分子化学合成与未捆绑研发的横向计算软件授权，均排除在这一边界之外。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM010
