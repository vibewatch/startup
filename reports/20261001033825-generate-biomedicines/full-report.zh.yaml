  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 生成生物学平台架构与运行闭环
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines
              立足于机器学习、结构生物学与生物工程学的交叉前沿，运用公司定义的“生成生物学”技术，设计具备特定治疗功能的新型蛋白质。与传统依赖天然抗体库概率性筛选或随机突变库的制药模式不同，Generate Platform
              建立了一套迭代闭环架构。在此闭环中，计算模型生成候选序列与结构构象，随后由自动化湿实验机器人进行高通量合成与测试。由此测得的生物物理与结构表征数据直接回流至企业中央数据湖，驱动模型参数持续迭代，并支持科研 AI
              智能体自主探索科研假设。迄今为止，公司依托位于 Boynton Yards 和 Andover 占地超 140,000 平方英尺的实验设施，已生成、构建并测试了超过 42,000
              种蛋白质。整套技术栈作为内部专有的造药引擎运转，而非对外开放的开发者接口，从而将知识产权与结构数据集完好留存在自主开发及合作管线中。
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE009
