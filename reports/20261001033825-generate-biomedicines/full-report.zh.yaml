  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入构成、合作经济性与商业架构
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines 在商业化前的收入主要来自与大型跨国药企（尤其是 Amgen 和 Novartis）开展的多靶点研发合作。2026 年第二季度，Generate 确认合作收入
              $6.3M，低于 2025 年第二季度的 $10.1M，2026 年第一季度则为
              $7.2M。这部分收入不代表商业化药品销售、软件订阅或持续性授权费；其本质是针对首付款、研发资助以及管线达标里程碑款项的会计确认。按照 2022 年 1 月与 Amgen 达成的标志性合作协议，Generate
              在五个初始靶点上获得了 $50M 首付款，潜在交易总额最高达 $1.9B，外加低双位数的商业化销售提成，单个靶点里程碑款项最高可达 $370M。同样，Novartis 于 2026 年中将一款由 Generate
              平台设计的 AI 生物制剂推进至临床前管线，触发了相应的合作里程碑节点。不过，未来的合作收入天然具有阶段性波动的特征，取决于合作伙伴的靶点指定节奏与技术攻关成败，而非可预测的企业订阅周期。
