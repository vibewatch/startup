      - number: '5.4'
        title: 安全科学、技术依赖与尽调风险点
        blocks:
          - type: paragraph
            body: >-
              随着 Generate 从早期药物发现大步迈向后期临床研发，公司也相应扩建了临床安全科学与监管药物警戒基础设施。在 Flagship Pioneering 管理层及董事会主席 Noubar Afeyan
              的主导下，Generate 在各个研发项目中推行严密的临床安全治理，借助 Argus、Veeva Safety 及 Spotfire
              等行业成熟的安全数据库展开系统性安全评估与风险信号监测。尽管具备这些机构级风控手段，重大的技术与运营风险依然存在。公司估值高度悬于 SOLAIRIA 3
              期试验的临床疗效与安全性结果：一旦出现免疫原性隐患或给药方案缺乏竞争力，商业化普及将遭受重创。此外，Generate Platform
              依赖持续的高通量湿实验来验证计算假说；任何冷冻电镜设备停机、机器人检测校准偏差或专用试剂供应短缺，都会直接卡死候选分子的生成节奏。
