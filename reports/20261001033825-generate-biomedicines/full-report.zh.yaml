      - number: '2.3'
        title: 客户细分、买方经济学与商业采纳动因
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines 采取双引擎商业化模式，同时面向机构类大型药企合作伙伴与医疗体系支付方。Novartis 与 Amgen
              等战略级药企合作伙伴构成企业级买方群体，其研发部门与商务拓展团队出资支付首付款及里程碑款项（2026 年第二季度确认收入 $6.3M），用于共同开发或引进生成式蛋白质资产。而在下游，GB-0895
              等自研全权持有的管线主要面向呼吸科及免疫科专家、医疗机构药事委员会（P&T）以及商业和政府医保支付方。支付方的报销决策严格取决于该药相比现有抗 TSLP
              和细胞因子类生物药是否展现出确证的临床优势，或在给药便利度上具备差异化特征。在肿瘤领域，医院采购体系和特药肿瘤药房则主要根据整体治疗成本效益，以及在 enfortumab vedotin ADC
              治疗方案中降低剂量限制性毒性的表现来评估 GB-4362。
