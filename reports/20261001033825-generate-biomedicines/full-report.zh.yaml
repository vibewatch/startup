      - number: '2.2'
        title: 市场规模测算、商业预期与股权估值视角
        blocks:
          - type: paragraph
            body: >-
              评估 Generate:Biomedicines 的商业市场，需要结合股票市值、目标临床适应症与券商分析师预期作三方交叉验证。Generate 在纳斯达克挂牌交易（代码 GENB），总市值在 $1.93B 至
              $1.95B 之间浮动，由 128.35M 股已发行普通股及截至 2026 年第二季度末的 $457.4M 现金储备支撑。卖方一致预期给出“温和买入”（Moderate Buy）评级，12 个月平均目标价为
              $26.40，较 $15.02 的基准市价约有 75.8% 的上涨空间。独立股票研究机构 Zacks 给予 Generate 的评级为 Zacks Rank 3（持有），价值维度风格得分（Style
              Score）为 F，符合商业化前临床生物科技企业的典型画像：巨额研发开支、经营性现金流为负且尚未产生任何获批产品收入。其潜在商业机会主要切分为两大部分：一是计划覆盖 42
              个临床国家的全球数十亿美元级重度哮喘生物制剂市场，二是生物制药研发合作里程碑付款。
            claimRefs:
