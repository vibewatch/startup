            body: >-
              在经历未上市阶段连续几个季度的剧烈资金消耗后，Generate 借助 2026 年 3 月的首次公开募股迅速修复了资产负债表的流动性。公司于 2026 年 3 月 2 日完成 IPO，净募集资金
              $369.3M，使得 2026 年第一季度末的现金、现金等价物及有价证券总额充实至 $516.6M。截至 2026 年 6 月 30 日，现金及有价证券总额为 $457.4M，其中包含 $135.4M
              现金及现金等价物，以及 $322.1M 高流动性有价证券。在此之前，截至 2025 年 12 月 31 日，Generate 累计亏损达 $676.3M，私募阶段累计融资近 $700M，其中包括 2023 年 9
              月完成的 $273M C 轮融资。管理层目前预计，这笔 $457.4M 的资金储备足以支撑业务运营至 2028 年上半年，自 2026 年中起算约能维持 21
              个月。只要临床试验推进按计划进行，该现金跑道旨在护航公司走完 GB-0895 关键的 3 期临床数据读出期，无需立即寻求紧急注资。
