      items:
        - label: 1. 靶点范围确定
          detail: 药企合作方选定多个研究靶点，并获得 Generate 研发成果的许可。
          touchpoints:
            - Amgen 初始五靶点合作范围
            - Novartis 多靶点合作协议
        - label: 2. 首付款承诺
          detail: 合作方支付首付款，并可能参与股权投资。
          touchpoints:
            - Amgen $50.0 million 初始首付款
            - Novartis $50.0 million 首付款
        - label: 3. 研发履约
          detail: Generate 推进特定项目研发，并在履约义务履行后确认合作收入。
          touchpoints:
            - 按已发生成本确认收入
            - 保密项目研发执行
        - label: 4. 合作扩充或里程碑达成
          detail: 合作方可追加靶点，并在达成约定标准时触发开发里程碑付款。
          touchpoints:
            - Amgen 追加第六个靶点
            - Amgen 支付首笔开发里程碑款项
        - label: 5. 合作方开发交付
          detail: 生成的生物药可转入合作方自身的临床前开发管线。
          touchpoints:
            - 2026 年第二季度披露的 Novartis 临床前推进进展
        - label: 6. 临床与商业化转化
          detail: 未来的里程碑与特许权使用费取决于进一步开发进展及获许可产品销售；目前尚未披露产品销售收入。
          touchpoints:
            - 开发与监管里程碑
            - 基于净销售额的或有特许权使用费
    approximationNotes: 该推进序列反映已披露的合同机制及观察到的里程碑；不预估各阶段持续时间、转化概率或未来现金流入。
