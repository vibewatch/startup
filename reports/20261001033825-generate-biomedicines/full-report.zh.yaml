      - number: '2.4'
        title: 采纳驱动力、资本密集度与执行瓶颈
        blocks:
          - type: paragraph
            body: >-
              制药行业对 AI 设计生物药的需求日益增长，渴望借此压缩研发周期并攻克传统难成药蛋白质靶点，这成为 Generate 核心业务的持续增长驱动力。GB-0895 在 33 个获批国家和地区启动并推进全球 3
              期重复试验（SOLAIRIA-1 与 SOLAIRIA-2），证明 Generate 已顺利跨入后期临床执行阶段。然而，严峻的市场约束制约着这一前景。生物药开发属于极高资本密集型业务：Generate 在
              2026 年第二季度录得季度净亏损 $67.3M，研发支出高达 $64.3M。2026 年上半年公司经营现金消耗总额达 $138.3M，现有现金储备（$457.4M）仅能维持运营至 2028
              年上半年，迫使公司必须严格把控管线优先级或择机重返资本市场融资。此外，公开披露信息中缺失商业化毛利率预测、单价定价模型及支付方协议框架，最终商业化落地的可行性仍存在重大不确定性。
            claimRefs:
              - CM007
              - CM008
              - CM014
              - CM015
              - CM016
