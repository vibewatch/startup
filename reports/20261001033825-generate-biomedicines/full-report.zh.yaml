        title: 高管团队、科学家创始人与治理架构
        blocks:
          - type: paragraph
            body: >-
              公司由资深生物制药高管与计算生物学早期开拓者掌舵。Michael Nally 于 2021 年 3 月出任首席执行官兼董事，此前他在 Merck & Co.
              拥有漫长的高管任职经历，曾担任首席营销官。科学联合创始人 Gevorg Grigoryan 博士担任首席技术官，将他在 Dartmouth College 和 MIT
              积累的计算结构生物学学术洞见转化为平台算法研发主导能力。Flagship Pioneering 创始人 Noubar B. Afeyan 博士出任董事会主席，提供机构背书与创投治理经验。截至 2025 年 12
              月 31 日，公司拥有 312 名全职员工，其中 138 人拥有博士或医学博士学位。
