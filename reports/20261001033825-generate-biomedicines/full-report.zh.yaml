      - number: '3.4'
        title: 持续壁垒取决于数据积累，而非模型本身的稀缺性
        blocks:
          - type: paragraph
            body: >-
              严峻的反向风险在于技术商品化。在 2026 年 9 月的公司路演演示中，管理层公开表示模型正在走向同质化平庸，并认为实验基础设施构筑的壁垒更为持久。招股书同时预警：竞争对手可能以更快速度应用
              AI；中国生物科技公司可能以更快节奏或更低成本部署计算与生物设计技术；Generate 自身平台也未必能兑现预期的时间压缩、成功率提升或成本削减。2026 年 5 月的一份市场评论还将 $7.2M 的合作收入与
              $80.4M 的季度经营现金流出并列；这虽是特定季度的财务数据，并非 ARR 或常态化的烧钱率，但足以折射出 Generate
              相比多元化巨头在资金筹措上的不对称弱势。因此，公司真正可防守的护城河必须靠可重复的临床成果、专有实验数据以及深度绑定的合作项目来支撑，而这些目前均尚未证明能带来更优越的商业经济性。
            claimRefs:
              - CP005
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 图表与补充材料
        blocks:
