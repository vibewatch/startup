      nodes:
        - id: step-1
          label: 平台验证与合作伙伴
          description: 生成式 AI 平台获 Amgen（$50M 首付款、最高 $1.9B 里程碑款）与 Novartis 研发合作验证
        - id: step-2
          label: 核心临床管线推进
          description: 长效抗 TSLP 抗体 GB-0895 在 33 个国家开展重现性 Phase 3 SOLAIRIA 重症哮喘临床研究
        - id: step-3
          label: 运营烧钱与现金跑道
          description: $457.4M 现金缓冲支持运营延至 1H 2028，对冲 $67.3M Q2 净亏损与 $138.3M 的六个月运营烧钱
        - id: step-4
          label: 估值与定价自律
          description: 2026 年 2 月 IPO 隐含估值 $2.04B，与 $2.22B Series C 轮估值持平，避免了二级市场的过度泡沫
        - id: step-5
          label: 风险因素评估
          description: 尚无产品收入、成立以来持续亏损、面临 4,000+ 竞争对手的拥挤赛道，且高度依赖二元 Phase 3 数据读出
        - id: step-6
          label: 综合决策输出
          description: 维持“观察”建议，估值“合理”，风险评级为“高”，有待 SOLAIRIA 临床验证
