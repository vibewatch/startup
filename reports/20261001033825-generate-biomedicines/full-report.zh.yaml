              个目标国家的临床入组速度；相较既有单抗的竞价与医保准入动态；长半衰期抗体的 CMC 放大生产经济性；以及现金消耗纪律。直接将评级下调至“回避”（Avoid）的逻辑破裂触发条件包括：SOLAIRIA-1/2
