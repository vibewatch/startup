      - number: '4.4'
        title: 财务研判、估值含义与尽调核心疑点
        blocks:
          - type: paragraph
            body: >-
              从投资评估角度看，Generate:Biomedicines 更像资本充足、处于临床阶段的生物制药平台，而非高毛利的生成式 AI
              软件厂商。公司尚无任何获批上市的商业化药品，自研产品销售收入为零，财务表现完全受制于临床试验里程碑及合作方推进节奏。尽管预计可支撑至 2028 年上半年的现金跑道为完成 SOLAIRIA 3
              期试验招募留出了充裕的缓冲期，但长期的商业化评估面临显著的信息断层。公开披露材料中并未提供 GB-0895 的单品定价目标、医保支付报销模式或营业成本基准，导致在监管获批前无法对其毛利率进行可靠建模。此外，一旦
              GB-0895 遭遇试验延期、安全性警示，或被 tezepelumab 等已上市生物药强力挤压，Generate 高额的年度现金消耗将迅速压缩流动性，迫使公司进行大幅度的二级市场增发稀释。潜在投资者必须将
              Generate 视为一家临床药物开发商：其估值的长期支撑点在于 3 期生物学疗效，而非当下的财务估值倍数。
