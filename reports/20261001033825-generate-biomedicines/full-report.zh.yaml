  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 临床开发、监管门槛与审批风险
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines 是一家处于临床阶段的生成生物学公司，迄今尚未获得任何商业化销售监管审批，商业化产品收入为零。公司的企业估值与商业逻辑主要押注在其核心在研生物制剂
              GB-0895（golukibart）的成败上。这是一款抗 TSLP 单克隆抗体，目前正通过全球 SOLAIRIA-1 和 SOLAIRIA-2 试验在重度哮喘适应症中推进 3 期重复临床评估。尽管
              Generate 已在 33 个国家获得临床试验许可，正朝着覆盖 42
              个国家和地区的目标迈进，但在多区域管理临床招募、患者留存和方案执行仍面临巨大的执行阻力。生物制药临床试验历来极易遭遇意外的安全隐患、无法证明相对于 tezepelumab 等标准疗法具备统计学优效性，或遭遇
              FDA、EMA 及 MHRA 等卫生监管机构审批延期。在肿瘤学领域，Generate 还在开展探索性 1 期临床试验，评估 GB-4362 联合 enfortumab vedotin 及
              pembrolizumab 治疗尿路上皮癌的效果，这属于早期在研管线，人体安全性与有效性尚未在临床上得到证实。
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR013
              - CR014
