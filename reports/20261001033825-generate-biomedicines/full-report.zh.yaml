      - number: '3.3'
        title: 牵手巨头带来杠杆效应，也带来依赖风险
        blocks:
          - type: paragraph
            body: >-
              Amgen 与 Novartis 为 Generate 提供了外部行业背书，并补足了原本需要自行搭建的研发能力，但这些合作关系绝不等同于专属于己的分销渠道。从已披露的信息看，Amgen
              的合作结构限定在特定靶点：Generate 牵头指定的研究工作，候选药物筛选完成后，Amgen
              可获得独家权利并全权负责后续的开发、生产与商业化。协议虽包含首付款、里程碑付款与商业分成条款，但公开资料中仍无法获取产品实际定价、折扣水平、支付方准入或可比同行的合同条款。合同独占性与针对特定靶点的联合研发形成了转换摩擦，但
              Amgen 同时也保留了无过错单方终止权。Generate 背后的 Flagship 关系网及其董事长与 Moderna 的渊源或许有助于获取生态圈资源，但这绝非商业销售渠道或优先医保准入的凭证。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
