    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、创立历程与生成生物学平台
        blocks:
          - type: paragraph
            body: >-
              Generate:Biomedicines 是一家处于临床阶段的生成生物学公司，开创性地将机器学习算法与高通量实验生物学自动化结合，用于生成新型蛋白质药物。公司于 2018 年 8 月由风险孵化机构
              Flagship Pioneering 在特拉华州注册成立，原法定名称为 Flagship VL56, Inc.，随后于 2020 年 2 月更名为现名。公司总部设在马萨诸塞州
              Somerville，目前已从早期计算基础研究跨入活跃的临床开发阶段。旗下自研的 Generate Platform 持续利用生物数据训练机器学习模型，从头设计（de
              novo）具备更优成药特性的蛋白质，跳过了传统经验式的试错筛选。
            claimRefs:
