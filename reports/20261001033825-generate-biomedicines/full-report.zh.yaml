            body: >-
              Generate 的运营成本结构完全由庞大的临床研发支出主导，这是将生成生物学平台及候选管线推向后期人体临床试验的刚性开支。2026 年第二季度，研发费用达到 $64.3M，高于去年同期的 $59.7M 以及
              2026 年第一季度的 $57.8M。研发支出的攀升主要由于核心资产 GB-0895（抗 TSLP）针对重度哮喘的 SOLAIRIA-1 和 SOLAIRIA-2 全球 3 期试验在 33
              个获批国家加速招募患者，同时肿瘤管线 GB-4362 与 GB-5267 的早期临床也在同步推进。2026 年第二季度管理费用为 $13.6M，第一季度为
              $13.5M；作为新近登陆纳斯达克的发行人，公司承担的法律、专业咨询、财会及合规成本日益加重。2026 年第二季度非现金股权激励支出总计 $8.2M，第一季度为
