      - number: '8.3'
        title: 估值情景假设与敏感性分析
        blocks:
          - type: paragraph
            body: >-
              本估值情景框架从 2026 至 2028 年的三条独立经营轨迹评估 Generate:Biomedicines。在乐观情景（25% 概率）下，双重验证的 3 期 SOLAIRIA
              试验展现明确优效性，GB-0895 在重度哮喘中确立 6 个月给药周期的持久疗效，GB-4362 在肿瘤管线亦取得进展，推动隐含企业价值向 $3.5B 至 $4.5B 扩张。在基准情景（50%
              概率）下，SOLAIRIA 试验达成非劣效终点，但遭遇 tezepelumab 等既有生物制剂的竞争阻力，在持续消耗现金的同时，企业估值维持在 $1.8B 至 $2.4B 附近。在悲观情景（25%
              概率）下，SOLAIRIA 遭遇疗效挫折或耐受性不良信号，引发估值大幅下调至现金支撑的 $500M 至 $800M 底线，并在 2028 年前加剧稀释性再融资需求。
