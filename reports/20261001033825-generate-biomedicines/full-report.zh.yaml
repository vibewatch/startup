      - number: '6.2'
        title: 合作伙伴实际采纳的印证
        blocks:
          - type: paragraph
            body: >-
              最强烈的采纳信号体现在合作项目的扩容以及正式进入合作方的研发管线。Amgen 最初签署的五个靶点协议中包含了额外靶点的选择权，并在 2023 年 12 月追加了第六个靶点。Generate
              还披露了六个处于保密状态的 Amgen 项目及多个处于保密状态的 Novartis 项目。2026 年第二季度，Novartis 将一款利用 Generate Platform
              设计的生物制剂推进至临床前管线。Roswell Park 合作的 GB-5267 项目已推进至招募患者的 1 期临床研究，不过截至 2026 年 8 月的最新动态，首例患者入组仍预计在 2026
