            body: >-
              Generate:Biomedicines 于 2026 年 2 月完成 IPO 进入公开市场，隐含估值约为 $2.04B，在纳斯达克挂牌交易（代码 GENB）。这一估值与其一级市场后期定价高度吻合，接近
              2025 年 1 月确立的 $2.22B C 轮估值。截至 2026 年 6 月 30 日，公司持有现金、现金等价物及有价证券 $457.4M，预计运营现金跑道可支撑研发至 2028 年上半年。不过
              Generate:Biomedicines 目前仅能获取阶段性的偶发合作收入——例如 2026 年第二季度的 $6.3M——而季度净亏损达 $67.3M，上半年经营性现金消耗达 $138.3M。鉴于在 3
              期临床数据出炉之前，当前股价已为尚未获批的生成生物学技术计入了可观股权价值，我们的投资建议为“观察”（Track），风险评级定为“高”（High），估值立场定为“合理”（Fair）。
