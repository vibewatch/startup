      - number: '3.2'
        title: 湿实验深度整合是核心逻辑，临床数据才是护城河的终极大考
        blocks:
          - type: paragraph
            body: >-
              Generate 将其定位为“设计-构建-测试-学习”的闭环，主打专有实验数据对模型的持续反哺，而非纯软件发现引擎。公司称已将该路径成功转化为 3 期抗 TSLP 管线，并声称 GB-0895 结合了约 106
              femtomolar 的结合亲和力、约 98 天的半衰期以及拟定的每 6 个月一次给药方案。但横向直接对比依然不够充分：招股书中列出了已获批的 tezepelumab
              和多款长效管线，然而所查阅的信源均未提供头对头（head-to-head）临床疗效或实际依从性数据。官方招聘页面确实发布了内部机器学习及高通量 CryoEM
              相关职位，印证了其一体化软硬件能力的存在，但这并不能作为衡量其实际研发产出效率的独立基准。因此，定位图仅依据已披露的研发阶段和信源描述的差异化特征展开，而非基于预测疗效。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP014
