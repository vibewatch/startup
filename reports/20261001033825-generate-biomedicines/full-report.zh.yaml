        title: 核心投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑依托 Generate:Biomedicines 的计算平台，该平台将生成式深度学习与高通量生物检测相连通，实现新型蛋白质形态的自动化设计。大型药企的深度认可在此得到充分印证：与 Amgen
              的合作协议包含 $50M 前期资金和高达 $1.9B 的潜在里程碑款项，同时与 Novartis 的多靶点合作项目也在持续推进。相反，反向逻辑则揭示了严峻的结构性风险：Generate
              从未产生过商业化产品收入，自成立以来累计亏损庞大，且置身于包含数千家活跃肿瘤与免疫学研发商的激烈竞争格局中。更重要的是，整座技术平台的成败高度系于核心候选药 GB-0895
              一役，若其在重度哮喘领域的临床试验受挫，不仅会引发估值倍数的断崖式跳水，更将沉重打击市场对生成生物学这一方向的信心。
