  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范畴远超原生 AI 同行
        blocks:
          - type: paragraph
            body: >-
              Generate 面临的竞品和替代方案涵盖已上市药物、直接在研临床管线、大型药企内部自研、传统药物发现手段以及引进其他计算平台的可能。其 S-1
              招股说明书明确将大型药企、中小型生物技术公司、高校、公共科研机构乃至其合作方列为竞争对手，在治疗药物、人才、临床试验中心、知识产权及合作机会等多维度展开角逐。在重度哮喘领域，已获批上市的 tezepelumab
              是现实中的既得利益者；同时，GSK/Aiolos、Upstream Bio、Apogee 等开发商正推进长效型或作用机制存在差异的 TSLP
              管线。一份虽独立但信誉一般的行业简报还将传统药企内部自研团队以及资金更充裕的同行纳入平台层面的竞争名单。这场角逐因此不再是单一功能的较量，而演变成一场抢在替代方案抹平其差异化优势前跑出临床证据的赛跑。
            claimRefs:
              - CP002
              - CP003
              - CP011
              - CP013
