      - number: '5.3'
        title: 结构生物学能力与药物发现工作流
        blocks:
          - type: paragraph
            body: >-
              计算蛋白质设计算法与实体验证基础设施之间的物理深度咬合，构成了 Generate 的根本技术壁垒。公司在其马萨诸塞州研发中心搭建了业内最为密集的私营冷冻电镜设施之一，配备四台顶级 CryoEM
              显微镜，将结构解析转化成日常化的高通量能力。公司依托高分辨率蛋白质-靶点复合物的快速解析能力，从原子精度层面验证计算生成的从头设计结合蛋白是否精准结合预定生物表位。这一结构验证工作流直接对接了与
              Amgen（多个项目潜在总值最高达 $1.9B）以及与 Novartis（合作规模超 $1B）的多靶点商业联盟。在两项合作中，Generate
              均保留了底层数据权益用于打磨自身的机器学习模型，确保外部验证任务在推进合作候选药物的同时，持续夯实平台的底层核心算法能力。
