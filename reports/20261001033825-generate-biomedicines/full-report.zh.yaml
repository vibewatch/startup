  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁在买单、谁在使用，以及谁最终获益
        blocks:
          - type: paragraph
            body: >-
              Generate 仍是一家处于临床阶段的生物技术公司，因此其客户模式尚未形成传统的药品销售模式。在 ASC 606 会计准则下，监管文件将 Amgen 和 Novartis
              列为客户，因为两家药企为研发服务和授权许可支付了对价；而直接使用者则是合作伙伴的药物发现与开发团队。MD Anderson 与 Roswell Park
              则采取共同开发模式，按合作协议核算，双方共同分担研发成本并共享潜在商业化收益。只有当候选药物最终获批上市后，患者、处方医生与医保支付方才会成为下游潜在的受益者与真正买家。厘清这一区别至关重要：当前的合作收入只能证明大型企业对其研发产出有切实需求，并不构成患者接受度、医保报销处方量或成熟商业化实体的证明。
            claimRefs:
              - CU001
              - CU013
              - CU014
