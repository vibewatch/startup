      - number: '5.2'
        title: 临床管线布局与核心资产推进
        blocks:
          - type: paragraph
            body: >-
              Generate Platform 最核心的商业化与临床验证标杆是其主要管线 GB-0895，这是一款针对重度哮喘胸腺基质淋巴细胞生成素（TSLP）的在研单克隆抗体。Generate 已启动两项代号为
              NCT07276724 与 NCT07359846 的关键 3 期临床试验，研究人员已于 2026 年 1 月 26 日完成首例重度哮喘患者给药。公司将 GB-0895 标榜为 AstraZeneca 获批抗
              TSLP 生物药 Tezspire（tezepelumab）的明显差异化挑战者；据报道，其靶点结合亲和力提升至原来的二十倍，终末半衰期延长至 98 天，有望实现每年两次皮下注射给药。借助 2026 年 2 月总额
              $400M 的 IPO 募资中所拨备的 $300M 专项资金，Generate 还划拨了 $100M 用于正在进行的 1b
              期试验及向慢性阻塞性肺疾病（COPD）的临床拓展。早期管线也经历过淘汰折损，尤其是针对新冠的抗体药物 GB-0669 因后疫情时期的市场变动而终止，证明了平台研发速度无法让资产天然免疫于商业环境的剧变。
