    data:
      layers:
        - label: Client Capture & Interface Layer
          detail: Ambient microphone input, web/desktop apps, Chrome extensions, and embedded EHR widgets (e.g. Vim Connect).
          modules:
            - Web Application
            - Desktop Client
            - Mobile Apps
            - Chrome Extension
            - EHR Embedded Widgets
        - label: Session Orchestration & Pre-Processing
          detail: Audio capture pipeline, real-time audio streaming, speaker separation, and consultation context ingestion.
          modules:
            - Audio Stream Ingestion
            - Noise Filtering
            - Context Assembler
            - Template Selector
        - label: Model Fine-Tuning & Inference Engine
          detail: >-
            Specialized open foundation models fine-tuned via SFT and RFT (DPO) hosted on Fireworks AI inference
            platform.
          modules:
            - Fireworks AI Inference Runtime
            - Supervised Fine-Tuning (SFT) Models
            - Reinforcement Fine-Tuning (RFT) Pipeline
            - Direct Preference Optimization Engine
        - label: Clinical Knowledge & Alignment Layer
          detail: LLM-as-a-Judge quality filtering, template adherence verification, and synthetic rewrite generation.
          modules:
            - Synthetic Rewrite Generator
            - LLM Quality Judge
            - Specialty Template Library
            - Hallucination Safeguards
        - label: EHR Integration & Interoperability Gateway
          detail: Connect schedule ingestion, appointment matching, and push-to-chart note transmission across external EHRs.
          modules:
            - Connect Backend Sync
            - HL7 / FHIR Gateway
            - EHR Push-to-Chart Connector
            - Developer API & Webhooks
        - label: Compliance, Trust & Security Layer
          detail: >-
            Ephemeral audio processing (audio discarded post-transcription), HIPAA/GDPR alignment, and role-based access
            control.
          modules:
            - Ephemeral Audio Purge
            - HIPAA / GDPR Compliance Guards
            - Data Encryption at Rest & Transit
            - Audit Logging
callouts:
  - calloutType: strength
    title: Inference Latency Breakthrough via Fine-Tuning Optimization
    body: >-
      By transitioning from closed frontier APIs to open models fine-tuned with SFT and RFT (via DPO) hosted on
      Fireworks AI, Heidi reduced inference latency from 25 seconds to 7 seconds—a 3.5x improvement that significantly
      accelerates note generation while lowering serving costs.
    claimRefs:
      - CE005
      - CE006
  - calloutType: risk
    title: The Ambient Data Gap and Regional API Deprecations
    body: >-
      Heidi's structured output stops at the encounter note, leaving discrete EHR charts and problem lists un-updated.
      Furthermore, the withdrawal of the Heidi API and Widget for future integrations in Australia and New Zealand
      highlights platform dependency risks for healthtech partners.
    claimRefs:
      - CE004
      - CE009
