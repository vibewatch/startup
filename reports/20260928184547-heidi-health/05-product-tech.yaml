chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Heidi Health delivers an ambient AI clinical scribe that captures clinician-patient dialogues across 110 languages,
    leveraging open models fine-tuned on Fireworks AI to achieve 7-second inference latency. While offering deep EHR
    schedule and note synchronization across verified systems, Heidi maintains a focused note-centric boundary that
    avoids discrete EHR chart write-back and has recently deprecated API access in ANZ.
sections:
  - id: product-definition-workflow
    title: Product Architecture and Ambient Clinical Scribing Workflow
    body: >-
      Heidi Health operates as an ambient clinical intelligence platform engineered to alleviate healthcare provider
      documentation burden by converting natural clinician-patient conversations into structured medical records.
      Clinicians activate the software via web applications, desktop clients, mobile applications, or lightweight
      browser and EHR widgets during consultations, allowing the microphone stream to capture real-time audio without
      altering encounter dynamics. The underlying processing engine filters ambient acoustic noise, transcribes
      multi-speaker dialogues, and organizes clinical findings into standardized SOAP notes, consultation summaries, or
      specialty-specific documentation formats across 110 languages in over 116 countries. By handling real-time
      transcription and initial synthesis, Heidi claims to save practitioners up to two hours per clinical workday,
      returning time to direct patient care.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE014
    tableRefs:
      - TE002
    figureRefs:
      - FE001
  - id: modules-capabilities-matrix
    title: Product Modules, Asset Portfolio, and Clinical Capabilities
    body: >-
      The core offering centers on the ambient AI scribe, supported by an expanding portfolio of auxiliary modules
      designed to extend workflow automation across practice settings. For EHR interoperability, Heidi provides two
      primary integration styles: Connect integrations, which establish backend bidirectional synchronization to pull
      daily appointment schedules and push finalized notes back into patient records, and Embedded integrations, which
      surface side-panel widgets directly inside web-based EHR interfaces. Beyond core encounter documentation, Heidi
      launched Heidi Comms in February 2026 to automate routine outbound patient touchpoints, appointment reminders, and
      follow-up communications, alongside Heidi Evidence for in-workflow medical evidence queries. Enterprise customers
      also gain access to AI-driven coding suggestions that map diagnoses to ICD-10 and SNOMED-CT taxonomies.
    claimRefs:
      - CE001
      - CE003
      - CE011
      - CE012
    tableRefs:
      - TE001
  - id: model-training-inference-infrastructure
    title: Model Infrastructure, Fine-Tuning Pipeline, and Inference Latency
    body: >-
      A central technological milestone for Heidi was transitioning from proprietary closed-model APIs toward
      domain-specialized open foundation models hosted on Fireworks AI's optimized inference infrastructure. To surpass
      frontier model performance while managing cost and latency, Heidi implemented a two-stage training strategy:
      Supervised Fine-Tuning (SFT) to teach clinical style and structure, followed by Reinforcement Fine-Tuning (RFT)
      using Direct Preference Optimization (DPO) to instill deep clinical reasoning and preference adherence. To
      overcome noisy human evaluations, Heidi utilizes frontier model synthetic rewrites and automated LLM-as-a-Judge
      filtering for template compliance and omission prevention. Training stability is maintained by scaling effective
      batch sizes to 1.5 million tokens using gradient accumulation across 24 steps, resulting in a 3.5x reduction in
      inference latency from 25 seconds down to 7 seconds.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
    tableRefs:
      - TE003
  - id: integration-governance-limitations
    title: EHR Interoperability, Regional Availability, and Technical Gaps
    body: >-
      Despite substantial technical progress and recent funding of US40 million to scale agentic capabilities across
      global healthcare systems, notable architectural boundaries and operational constraints persist. From an
      integration standpoint, Heidi announced that its developer API and lightweight widget integrations are no longer
      available for new partner integrations in Australia and New Zealand, restricting regional extensibility.
      Furthermore, competitive benchmarks highlight that Heidi's structured output terminates at the clinical note
      rather than updating discrete coded EHR flowsheets, medication registries, or longitudinal problem lists. While
      Heidi's deliberate privacy policy of discarding audio recordings immediately after transcription strengthens data
      protection compliance under HIPAA and GDPR, it precludes retrospective acoustic auditing or sentence-level audio
      replay during clinical record disputes.
    claimRefs:
      - CE004
      - CE009
      - CE010
      - CE013
tables:
