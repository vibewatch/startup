      - Target User
      - Status & Maturity
      - Technical Differentiation
      - Diligence Gap
    rows:
      - - Ambient AI Scribe
        - Clinicians (ambulatory & hospital)
        - Commercial production (2M+ visits/wk across 116+ countries)
        - Fine-tuned open models via Fireworks AI achieving 7s latency; multilingual in 110+ languages
        - Audio discarded after transcription precluding retrospective verbatim audit trails
      - - Heidi Connect & Embedded EHR Widgets
        - Practice & Enterprise clinics
        - Commercial production (supports Athena Cliniko Best Practice Veradigm Zedmed Genie)
        - Two deployment modes (Connect schedule-sync vs Embedded side-panel widget)
        - Discontinued for future integrations in ANZ; restricted to Practice/Enterprise tiers
      - - Heidi Developer API & SDK
        - Healthtech partners & telehealth platforms
        - Deprecated in ANZ; active internationally
        - Headless AI scribing and structured consultation generation
        - Regional availability restrictions; single EHR integration limit per profile
      - - Heidi Comms & Evidence
        - Outpatient clinics & physicians
        - Commercial production (Comms launched Feb 2026; Evidence clinical search)
        - Automated outbound patient comms and clinical evidence checks
        - Isolated module outputs lacking unified shared context or inbound fax clearing
    notes: >-
      Maturity and differentiation verified from official developer docs, customer case studies, and partner
      announcements; gaps reflect competitor benchmarks and regional API deprecation notices.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE011
      - CE012
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Workflow
      - Company Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Ambulatory Consultation Documentation
        - Manual typing or evening dictation after patient encounters
        - Ambient recording via web or mobile app converting speech into structured notes
        - Saves clinicians up to 2 hours per working day
        - Does not write directly to discrete chart fields; structured output stops at note prose
      - - EHR Schedule & Note Synchronization
        - Manual copy-pasting of notes across separate EHR windows
        - Heidi Connect backend integration to ingest schedule and push notes
        - Eliminates manual copy-paste across verified EHRs
        - Multi-EHR linking blocked on single profile; write-back gated on Practice/Enterprise plans
      - - Emergency & High-Acuity Scribing
        - High-stress verbal dictation amidst ambient environmental noise
        - Noise-resilient speech transcription with specialty templates
        - Deployed across UK NHS and NZ public emergency departments
        - Acoustic challenges in multi-party chaotic conversations require manual clinician review
      - - Model Fine-Tuning & Inference Optimization
        - Proprietary frontier model API calls with high latency and cost
        - Open model fine-tuning (SFT + RFT via DPO) on Fireworks AI infrastructure
        - Latency reduced from 25s to 7s (3.5x speedup) with 51.3% win rate over proprietary models
        - Model customization requires synthetic rewrite generation and large effective batch sizes
    notes: >-
      Benefits and time savings sourced from clinician user studies and vendor disclosures; limitations reflect lack of
      discrete EHR flowsheet write-back.
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer / Component
      - Operational Role
      - Critical Dependencies
      - Key Failure Modes & Technical Risks
    rows:
      - - Client Capture & Interaction Surface
        - Web application desktop client mobile apps and Chrome/Vim widgets
        - Local microphone browser permissions and network connectivity
        - Local audio capture degradation or browser sandbox restrictions
      - - Model Inference & Serving Infrastructure
        - Fine-tuned open LLM execution with gradient accumulation
        - Fireworks AI serverless/dedicated inference platform
        - External infrastructure outage or inference latency degradation under peak clinical loads
      - - Clinical Knowledge & Preference Alignment
        - SFT and RFT with DPO for template adherence and hallucination filtering
        - Synthetic rewrites via frontier models and LLM-as-a-Judge datasets
        - Preference dataset noise or model drift across niche medical subspecialties
      - - EHR Interoperability & Integration Gateway
        - Connect schedule sync and push-to-chart note filing
        - HL7 FHIR and vendor-specific APIs (Athena Epic Cliniko)
        - Vendor API deprecation regional API shutdowns (ANZ) or EHR session timeouts
    notes: >-
      Architecture layers and technical dependencies derived from Fireworks technical whitepaper, integration guides,
      and engineering recruitment disclosures.
    claimRefs:
      - CE005
      - CE007
      - CE008
      - CE012
