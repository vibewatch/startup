callouts:
  - calloutType: "insight"
    title: "The Self-Serve Integration Paradox in Ambulatory Care"
    body: "While Heidi's self-serve model removes friction for solo practitioners, the absence of native EHR push integration in lower-tier plans creates a hidden copy-paste tax of 132 to 330 annual hours per clinician. Practices with more than five providers rapidly experience workflow diseconomies unless they upgrade to custom enterprise contracts."
    claimRefs:
      - "CM002"
      - "CM008"
      - "CM009"
  - calloutType: "risk"
    title: "Reimbursement Leakage from Unmanaged E&M Complexity"
    body: "Adopting ambient scribing without embedded coding intelligence leaves practices exposed to persistent E&M undercoding. In high-volume clinics conducting 50 or more daily visits, aggregate revenue losses from uncaptured visit complexity often exceed annual software subscription expenses by a significant multiple."
    claimRefs:
      - "CM006"
      - "CM011"
      - "CM012"
