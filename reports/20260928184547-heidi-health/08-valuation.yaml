callouts:
  - calloutType: "recommendation"
    title: "Investment Stance: Disciplined Watchlist Position"
    body: "While Heidi Health demonstrates impressive commercial momentum by reaching US$50 million in run-rate ARR within two years, entering at an 18x multiple on an unproven gross margin profile presents asymmetric downside. Capital allocators should maintain a Hold / Research-More posture until verified enterprise cohort retention data confirms long-term pricing power."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"

  - calloutType: "risk"
    title: "Capital Structure Encumbrance and Secondary Illiquidity"
    body: "The combination of US$240 million in non-dilutive revenue-share financing from General Catalyst Customer Value Fund and the total absence of secondary market price discovery on platforms like Forge Global creates significant downside vulnerability. If ARR growth slows, senior revenue-share payments will directly compress free cash flow available to common equity."
    claimRefs:
      - "CV002"
      - "CV009"
      - "CV010"
      - "CV011"

