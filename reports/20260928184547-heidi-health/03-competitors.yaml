callouts:
  - calloutType: "risk"
    title: "Enterprise Feature Gating Erodes SMB Clinician Retention"
    body: "By gating essential EHR push-to-chart and automated billing coding behind an unpublished enterprise tier while raising Clinician plan pricing to $150/month, Heidi creates an incentive for solo and small-practice physicians to migrate to competitors like Freed ($59–$119/mo) and DeepCura ($129/mo) that include these capabilities in standard self-serve plans."
    claimRefs:
      - "CP007"
      - "CP008"
      - "CP010"
  - calloutType: "insight"
    title: "The Architectural Shift from Ambient Scribing to Ambient Data"
    body: "Competitive pressures in 2026 reflect an evolution from prose documentation generators toward structured ambient data platforms. While Heidi's $340M capital injection funds an expansion toward agentic workflows, peers like DeepCura have already introduced automated ICD-10/LOINC chart staging and unified inbox routing, challenging Heidi's note-centric architecture."
    claimRefs:
      - "CP004"
      - "CP009"
      - "CP011"
