callouts:
  - calloutType: insight
    title: Hybrid Capital Structure Signals Go-To-Market Scaling Shift
    body: >-
      The bifurcation of the September 2026 funding into a $100 million equity round and a $240 million non-dilutive
      Customer Value Fund facility from General Catalyst highlights a deliberate strategy: funding enterprise health
      system onboarding and GTM sales cycles without pricing the entire capital stack at prevailing 18x ARR equity
      multiples.
    claimRefs:
      - CO004
      - CO005
      - CO006
  - calloutType: risk
    title: EHR Write-Back and Workflow Integration Gaps
    body: >-
      While Heidi excels in ambient transcription across 110 languages, competitor evaluations emphasize that structured
      chart write-back remains limited on standard tiers, and audio recordings are immediately purged
      post-consultation—precluding retrospective audio verification and placing the integration burden on clinician
      review.
    claimRefs:
      - CO012
      - CO013
