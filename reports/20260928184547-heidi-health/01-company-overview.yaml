company:
  name: Heidi Health
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Heidi Health is a Melbourne-founded clinical AI care partner platform that has raised over $420 million in aggregate
    financing, including a September 2026 $340 million round featuring a $100 million Series C equity tranche at a $900
    million valuation and a $240 million General Catalyst growth facility. Scaling rapidly to $50 million in annual
    recurring revenue by April 2026, the company supports 2.8 million weekly patient visits across 190 countries while
    expanding from ambient scribe documentation into supervised clinical workflows. This chapter establishes the
    corporate identity, executive leadership, capitalization structure, and milestone trajectory that serve as ground
    truth for subsequent diligence.
sections:
  - id: identity-and-mission
    title: Corporate Identity, Founding, and Core Proposition
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO005
      - CO008
      - CO009
    tableRefs:
      - TO001
    body: >-
      Heidi Health is an Australian clinical artificial intelligence enterprise established in 2019 in Melbourne
      (headquartered in Cremorne, Victoria) that originally operated under the corporate name Oscer before rebranding in
      2021. The company's core technological mission is to alleviate the severe administrative burden borne by
      clinicians by deploying an ambient AI care partner platform. Rather than functioning solely as an audio
      transcription utility, Heidi's system listens to patient encounters in real time, automatically producing
      structured, specialty-specific clinical notes that are finalized at the conclusion of each consultation.


      Over the past two years, Heidi has achieved extraordinary commercial adoption, expanding annual recurring revenue
      from $1 million to $50 million by April 2026. As of September 2026, the platform supports 2.8 million weekly
      patient consultations across 190 countries and 110 languages, with cumulative consultation coverage exceeding 175
      million visits. The company's recent $340 million financing round—comprising a $100 million Series C equity
      investment valuing Heidi at $900 million alongside a $240 million non-dilutive growth facility—positions the
      business to expand beyond acute ambient notetaking into supervised multi-modal clinical workflows across global
      health systems.
  - id: founding-and-milestones
    title: Organizational Evolution and Milestone Trajectory
    claimRefs:
      - CO001
      - CO003
      - CO007
      - CO008
      - CO009
      - CO010
    figureRefs:
      - FO001
    body: >-
      Heidi Health's developmental trajectory reflects a deliberate transition from early clinical simulation software
      to ambient medical scribing, followed by an aggressive push into supervised agentic workflows. Originally founded
      as Oscer in 2019 to improve clinical diagnostic training, the company pivoted in 2021 toward real-time clinical
      documentation after recognizing that excessive administrative overhead represented healthcare's primary capacity
      bottleneck. Between 2021 and 2024, the company developed its proprietary acoustic transcription and
      template-customization engine, achieving viral organic adoption among primary care doctors and outpatient
      specialists across Australia and the United Kingdom.


      Institutional capital accelerated this expansion, beginning with a $16.6 million Series A round in early 2025,
      followed rapidly seven months later by a $65 million Series B led by Point72 Private Investments in October 2025.
      In early 2026, Heidi initiated its agentic product expansion, launching Heidi Comms in February to automate
      patient outreach, call handling, and scheduling, followed by Heidi Evidence in March to provide context-aware
      point-of-care clinical guidelines (answering over 10 million queries within months). By April 2026, ARR crossed
      $50 million, culminating in the landmark September 2026 Series C and General Catalyst growth financing to deploy
      hospital-wide agentic infrastructure.
  - id: leadership-and-governance
    title: Executive Leadership, Governance, and Key-Person Exposure
    claimRefs:
      - CO001
      - CO002
    tableRefs:
      - TO002
    body: >-
      Heidi Health was founded by Dr. Thomas Kelly alongside technical and product co-founders Waleed Mussa and Yu Liu.
      Dr. Kelly, a former vascular surgical resident in the Australian public hospital system, serves as Chief Executive
      Officer and executive figurehead. His lived experience with administrative burnout and clinical documentation
      friction directly shapes the company's product philosophy and user empathy. Co-founders Mussa and Liu oversee core
      platform architecture, real-time speech-to-text ingestion pipelines, and specialized clinical model orchestration,
      providing institutional engineering continuity since the firm's inception.


      From a diligence and governance perspective, Heidi exhibits significant key-person dependence centered on Dr.
      Kelly. As the primary clinical voice, vision driver, and fundraising spokesperson, Dr. Kelly's leadership is
      critical to sustaining user trust and institutional investor confidence. While the company has fortified middle
      and senior management—expanding commercial, customer success, and product marketing functions across New York,
      London, and Melbourne—independent board oversight remains opaque in public disclosures. Confirmatory diligence
      must evaluate formal board committee compositions, executive voting control agreements, and succession planning.
  - id: capitalization-and-stakeholders
    title: Capitalization Structure, Valuation, and Stakeholder Alignment
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO007
      - CO014
    tableRefs:
      - TO003
    body: >-
      Heidi Health's capitalization architecture underwent a profound transformation in September 2026 with the closing
      of $340 million in new funding. The transaction was structured into two distinct tranches: a $100 million Series C
      equity financing led by Blackbird Ventures (with follow-on participation from Point72 Private Investments,
      Headline, and Phoenix Court), and a $240 million growth financing investment deployed by General Catalyst through
      its Customer Value Fund (CVF). The equity tranche values Heidi at a post-money valuation of $900 million,
      representing an approximate 18x multiple on its reported $50 million ARR run-rate.


      The deployment of General Catalyst's Customer Value Fund introduces a highly strategic, non-dilutive capital
      structure designed to finance go-to-market scaling, enterprise health system implementation, and regional sales
      capacity without incurring immediate equity dilution. However, while commercial registry trackers like FundedIQ
      record aggregate lifetime capital at approximately $420 million (normalizing historical rounds as $16.6 million
      Series A, $65 million Series B, and $338 million Series C), the company announces total lifetime financing
      exceeding $421.6 million. Investors must inspect the detailed covenants, repayment thresholds, and potential
      revenue-share mechanics embedded within the $240 million CVF facility.
  - id: scale-and-diligence-trajectory
    title: Operational Scale, Competitive Trade-Offs, and Diligence Trajectory
    claimRefs:
      - CO008
      - CO009
      - CO011
      - CO012
      - CO013
    body: >-
      Heidi Health's global operational footprint distinguishes it from predominantly domestic United States clinical AI
      competitors. Operating across 190 countries and supporting 110 languages, the company has secured enterprise
      partnerships and clinical deployments across prestigious healthcare providers including the UK National Health
      Service (NHS), Beth Israel Lahey Health, MaineGeneral, and Monash Health in Australia. This broad international
      presence validates the adaptability of Heidi's multilingual acoustic engine across varied payer regimes and
      clinical nomenclature standards.


      Nevertheless, independent competitive assessments highlight critical product boundaries and strategic trade-offs.
      Scribe reviews from competitors such as DeepCura emphasize that Heidi's structured output primarily terminates at
      the consultation note rather than generating bi-directional EHR chart updates or automated coding flowsheets on
      baseline tiers. Furthermore, Heidi's core privacy posture intentionally purges consultation audio immediately
      following note generation; while advantageous for strict patient data privacy compliance, this architecture
      prevents retrospective audio re-verification if documentation discrepancies arise. Coupled with standard SaaS
      pricing of $150 per clinician per month, Heidi faces increasing pressure from integrated ambient platforms.
      Subsequent diligence chapters must probe EHR write-back depth, enterprise gross margins, and customer retention
      dynamics.
