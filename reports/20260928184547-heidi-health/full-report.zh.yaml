chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、初创背景与核心价值主张
        blocks:
          - type: paragraph
            body: >-
              Heidi Health 是一家澳大利亚临床 AI 企业，2019 年创立于墨尔本（总部位于维多利亚州克雷莫恩），最初名为 Oscer，2021 年更名。公司希望用环境式 AI
              诊疗助手减轻临床医生沉重的行政文书负担。Heidi 不只是语音转录工具：系统实时记录问诊对话，并在每次问诊结束时生成排版规范、符合专科要求的结构化病历。


              过去两年，Heidi 商业化增长迅速，年经常性收入（ARR）从 $1M 增至 2026 年 4 月的 $50M。截至 2026 年 9 月，平台覆盖 190 个国家、支持 110 种语言，每周处理 2.8M
              次患者问诊，累计覆盖超过 175M 次就诊。公司近期完成 $340M 融资，包括估值 $900M 的 $100M Series C 股权融资和 $240M
              非稀释性增长信贷；这笔资金将支持业务从单次问诊记录扩展到面向全球医疗系统的多模态、受监督临床工作流。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: 组织演进与里程碑轨迹
        blocks:
          - type: paragraph
            body: >-
              Heidi Health 经历了三次转型：从临床模拟软件转向环境式病历记录，近期又大力拓展受监督的智能体工作流。公司 2019 年以 Oscer
              之名创立，最初致力于改进临床诊断培训；团队随后意识到，繁重的行政工作才是医疗行业的主要接诊能力瓶颈，于是 2021 年转向实时问诊记录工具。2021 年至 2024
              年间，团队自研语音转录和模板定制引擎，在澳大利亚和英国的基层全科医生及门诊专科医生中迅速普及。


              后续机构融资加快了扩张：公司于 2025 年初完成 $16.6M Series A；7 个月后，Point72 Private Investments 领投了 2025 年 10 月的 $65M Series
              B。2026 年初，Heidi 开始拓展智能体产品：2 月上线 Heidi Comms，自动处理患者联络、电话和预约排程；3 月推出 Heidi
              Evidence，在诊疗现场提供结合上下文的临床指南支持，数月内回答超过 10M 次查询。到 2026 年 4 月，ARR 突破 $50M；同年 9 月，公司完成 Series C 股权融资并获得 General
              Catalyst 增长信贷，将资金用于部署全院级智能体基础设施。
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
