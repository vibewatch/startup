      - number: '6.3'
        title: 企业级交付与客户实证
        blocks:
          - type: paragraph
            body: >
              企业客户验证已成为 Heidi 商业化 GTM 战略的重心，推动公司从面向个人医生的工具转向机构交付。公司在美国的标杆客户为 Beth Israel Lahey Health（BILH）。该系统在 1,000
              名医护人员参与的 6 个月试点后，完成了全院推广。独立医疗系统评估显示，89% 的参测医生满意 AI 生成病历的质量，90% 表示问诊时能更专注于患者，82% 表示认知负荷下降，74%
              表示下班后的行政文书时间明显减少。其他参考医疗系统包括北美的 MaineGeneral、澳大利亚的 Monash Health，以及加拿大育空地区政府等区域卫生管理机构。


              专科门诊网络也公布了可量化的效率收益。心理健康机构 Indiana Health Group 记录节省 2,000 小时文书时间，并在部署 5 个月内释放约 $200,000 的临床产能价值；门诊外科机构
              Advanced Urology 报告投资回报率为 10.3x，在 16 周内收回价值 $121,000 的临床工时。在英国，Heidi 被 Modality Partnership
              选中，用于该地区规模最大的环境式临床 AI 部署；公司还在多家 NHS 信托基金开展试点，覆盖近 400 万名患者。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
