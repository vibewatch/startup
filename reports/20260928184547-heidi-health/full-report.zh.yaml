      - number: '5.3'
        title: 模型基础设施、微调管线与推理延迟
        blocks:
          - type: paragraph
            body: >-
              Heidi 的一项重要技术进展，是从专有闭源模型 API 转向部署在 Fireworks AI 优化推理基础设施上的领域专用开源基础模型。为了降低成本和延迟，同时超越前沿模型表现，Heidi
              采用两阶段训练：先用监督微调（SFT）训练临床文风和结构，再用直接偏好优化（DPO）进行强化微调（RFT），提升临床推理能力并贴合医生偏好。为减少人工评估噪声，Heidi 用前沿模型生成合成改写，再通过自动化
              LLM-as-a-Judge 过滤，检查模板合规性并防止遗漏。团队以 24 步梯度累积将有效批次规模扩大至 1.5M tokens 来维持训练稳定，最终将推理延迟从 25 秒降至 7 秒，速度提升 3.5x。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
