              一键推送病历、自动计费编码建议等关键工作流功能仍只在价格未公开的企业方案中提供。独立医生和小型联合诊所因此面临运营摩擦：即使支付较高订阅费，仍要手动复制粘贴病历。相比之下，Freed 的公开月付方案价格为 $59
