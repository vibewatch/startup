        blocks:
          - type: paragraph
            body: >
              Heidi Health 将商业客户分为三类：独立执业和单体门诊医生、中型诊所网络，以及跨国大型医院系统。获客主要依靠产品驱动增长（PLG）的免费增值模式，提供不限量基础转录和每月 10 次 Pro
              Actions。自助服务让一线医生无需经历繁琐采购流程就能试用环境式病历生成，先在门诊实践中积累自下而上的口碑，再推动付费增购。


              Heidi 将这批医生用户转化为付费订阅客户。独立医生可自行升级至 Clinician 方案，按年付费，每位用户每月 $150；集团诊所和区域医疗机构则转向定制定价的 Practice 与 Enterprise
              方案。中型市场由区域客户成功经理负责，每位经理管理约 50 个医疗客户，对应约 £2.5M 年经常性收入。企业级客户成功经理则各自管理 3 到 6 家大型医院网络及多院区医疗系统，每个系统至少有 250
              名活跃临床用户。为适应不同医疗监管体系，Heidi 已在英国、美国和南非等重点市场配置专职商务与 GTM 团队。
