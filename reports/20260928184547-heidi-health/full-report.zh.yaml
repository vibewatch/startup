      - CE006
      - CE007
      - CE008
      - CE010
    data:
      layers:
        - label: 客户端采集与交互层
          detail: 包括环境音采集麦克风、Web/桌面应用、Chrome 扩展和嵌入式 EHR 小组件（如 Vim Connect）。
          modules:
            - Web 应用程序
            - 桌面客户端
            - 移动端应用
            - Chrome 插件
            - EHR 嵌入式小部件
        - label: 会话编排与预处理层
          detail: 包括音频采集流水线、实时音频流传输、说话人分离和就诊上下文导入。
          modules:
            - 音频流接入
            - 噪音过滤
            - 上下文组装器
            - 模板选择器
        - label: 模型微调与推理引擎层
          detail: 专用开源基础模型经 SFT 和 RFT（DPO）微调后，部署在 Fireworks AI 推理平台。
          modules:
            - Fireworks AI 推理运行时
            - 监督微调（SFT）模型
            - 强化微调（RFT）流水线
            - 直接偏好优化（DPO）引擎
        - label: 临床知识与对齐层
          detail: 用 LLM-as-a-Judge 筛选质量、校验模板遵循情况，并生成合成改写。
          modules:
            - 合成重写生成器
            - LLM 质量裁判
            - 专科模板库
            - 幻觉防护机制
        - label: EHR 集成与互操作网关层
          detail: 导入 Connect 排班、匹配预约，并向外部 EHR 回写病历。
          modules:
            - Connect 后端同步
            - HL7 / FHIR 网关
            - EHR Push-to-Chart 连接器
            - 开发者 API 与 Webhooks
        - label: 合规、信任与安全层
          detail: 音频仅临时处理，转录后即销毁；符合 HIPAA/GDPR 要求，并实行基于角色的访问控制（RBAC）。
          modules:
            - 即时音频清除
            - HIPAA / GDPR 合规护栏
            - 静态存储和传输中的数据加密
            - 审计日志
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 呈现客户从自助免费增值试用到企业级 EHR 部署的完整采纳路径。
    approximationNotes: 综合产品定价文档、招聘岗位说明和医疗系统案例，归纳采纳里程碑与扩张阶段。
    claimRefs:
      - CU001
      - CU007
      - CU009
      - CU014
    data:
      items:
        - label: 免费版体验
          stage: 单名医生试用
          touchpoints:
            - 网页注册免费版
            - 自行下载移动端或桌面端应用
            - 用标准病历模板评估环境音转录效果
          description: 临床医生个人无需采购审批，每月可使用 10 次 Pro Action 体验环境音病历生成。
        - label: 医生个人订阅转付费
          stage: 个人付费订阅阶段
          touchpoints:
            - 承诺按年订阅，月费 $150
            - 无限次病历生成与自定义模板配置
            - 手动将病历复制粘贴到诊所 EHR
          description: 临床医生转为个人付费订阅以解除 Pro Action 次数限制，但仍需手动复制粘贴病历，工作流繁琐。
        - label: 诊所内扩散
          stage: 多医生诊所扩张阶段
          touchpoints:
            - 团体诊所管理者评估
            - 集中计费与团队行政管理
            - 申请 Practice 版本报价
          description: 诊所多名医生自发采用 Heidi，管理层因此开始评估团队授权。
        - label: EHR 集成与合规
          stage: Practice 版部署配置
          touchpoints:
            - 签署商业合作协议（BAA）
            - 与 Athena、Epic 或 eClinicalWorks 完成应用市场集成
            - 启用自动化病历回写（push-to-chart）功能
          description: 诊所正式部署后即可使用 EHR 病历回写并满足 HIPAA BAA 合规要求，免去人工复制粘贴。
        - label: 医疗系统企业级采购
          stage: 医疗系统企业级方案评估
          touchpoints:
            - CIO 与 CMIO 治理审查
            - SMART on FHIR 与安全互联配置
            - 结构化多院区试点设计（如 1,000 名医护人员）
          description: 医疗系统启动正式企业试点，由专属企业客户成功经理（CSM）统筹多院区工作流。
        - label: 企业级全面部署与扩张
          stage: 全院推广与 NRR 增长
          touchpoints:
            - 科室分批培训与实操考核
            - 定期召开季度业务回顾（QBR），持续跟踪临床医生满意度和节约工时
            - 多年期续约并向更多诊疗场景拓展
          description: 医疗系统在门诊、急诊和专科全面部署，推动企业级净收入留存率（NRR）增长。
