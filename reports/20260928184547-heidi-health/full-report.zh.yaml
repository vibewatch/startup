      - number: '6.2'
        title: 业务采用轨迹与扩张速度
        blocks:
          - type: paragraph
            body: >
              Heidi 披露的平台使用数据表明，过去 24 个月业务迅速扩张。根据 2026 年 9 月融资公告，平台覆盖 190 多个国家、支持 110 种语言，每周处理超过 2.8M 次患者问诊，远高于 2025
              年底每周约 2M 次的里程碑。自商业化以来，Heidi 累计处理超过 175M 次临床问诊，累计处理的临床文书工作量达 67M 小时；累计问诊量已超过 B 轮融资时记录的 73M 次的两倍。


              快速增长的使用量也转化为收入增长。Heidi 报告称，截至 2026 年 4 月，ARR 从 $1M 增至 $50M，24 个月内收入扩大了五十倍。招聘简报显示，
              客户成功团队的考核指标包括净留存率（NRR）、合同续约和客户扩张。但尽管交易数和 ARR 等规模指标强劲，Heidi
              尚未公开披露每周问诊量中免费用户与付费订阅账户各占多少，机构投资者因此必须独立评估账户层面的单位经济模型。
