evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-burn-and-margins
    missingEvidence: Audited gross margin percentage, net revenue retention (NRR), and operating cash burn rate for fiscal year 2026.
    whyItMatters: >-
      While $50 million ARR was disclosed as of April 2026, unit economics and capital consumption rates remain
      undisclosed for this privately held enterprise.
    diligencePath: >-
      Request audited management accounts, GAAP/IFRS revenue breakdown, and gross margin schedules during Phase II
      confirmatory diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-ownership
    missingEvidence: >-
      Fully diluted capitalization table, founder equity splits, and General Catalyst Customer Value Fund covenant
      terms.
    whyItMatters: >-
      The $240 million non-dilutive tranche may carry structured repayment obligations or revenue-share covenants that
      impact equity valuation.
    diligencePath: >-
      Inspect certificate of incorporation, series-specific liquidation preference schedules, and debt/growth financing
      facility agreements.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: tam-sizing-gap
    missingEvidence: >-
      Audited third-party breakdown of global ambulatory AI scribe software spend separating self-serve seat licenses
      from enterprise EHR-integrated contracts.
    whyItMatters: >-
      Vendor-disclosed ARR and volume metrics do not reveal net revenue retention, churn rates across solo tiers, or
      true serviceable addressable market penetration.
    diligencePath: >-
      Review independent health system procurement benchmarks, KLAS digital scribe adoption surveys, and audited revenue
      disclosures across regional operating entities.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: enterprise-retention-churn
    missingEvidence: Audited cohort net retention rates and customer churn data for enterprise health systems using Heidi Health.
    whyItMatters: >-
      Enterprise health systems represent Heidi's primary long-term moat against low-cost SMB competitors; without
      retention data, durability cannot be independently verified.
    diligencePath: Request anonymized health system cohort retention logs and ACV expansion metrics during management diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited income statements, GAAP gross margin breakdowns, customer acquisition cost (CAC), and cohort net revenue
      retention (NRR) schedules.
    whyItMatters: >-
      Without audited unit economics, it is impossible to verify whether the 50 percent free-to-paid conversion
      generates positive unit economics or whether debt service on the US$240 million facility will strain operating
      cash flow.
    diligencePath: >-
      Request management presentation containing audited trailing twelve-month revenue, gross profit by customer cohort,
      and repayment schedule for the General Catalyst facility.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: ehr-integration-sla
    missingEvidence: >-
      Public enterprise performance benchmarks, uptime SLAs, and write-back latency telemetry for Heidi Connect EHR
      integrations across hospital deployments.
    whyItMatters: >-
      Health systems require strict uptime and low-latency write-back to ensure clinical workflows are not disrupted
      during peak consultation windows.
    diligencePath: >-
      Request vendor SLA schedules, hospital pilot uptime reports, and error-rate monitoring dashboards during technical
      diligence.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and enterprise logo renewal rates across
      health systems.
    whyItMatters: >-
      While recruitment briefs state CSMs carry NRR and renewal quotas, Heidi has not disclosed auditable cohort
      retention or expansion figures, leaving customer durability unverified.
    diligencePath: >-
      Request audited customer cohort retention tables, logo churn rates, and renewal contract values for enterprise
      hospital systems during diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: ehr-writeback-penetration
    missingEvidence: >-
      Data on the proportion of enterprise and practice accounts actively utilizing certified bi-directional EHR
      write-back versus manual chart transfer.
    whyItMatters: >-
      EHR write-back is gated behind Practice/Enterprise tiers and requires substantial IT integration overhead; without
      write-back adoption data, the true workflow automation and stickiness cannot be confirmed.
    diligencePath: >-
      Obtain breakdown of active user base utilizing automated push-to-chart by EHR platform (Epic, Athena,
      eClinicalWorks) versus manual copy-paste.
    relatedTableRefs:
      - TU001
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-deployment-enumeration
    missingEvidence: >-
      Comprehensive census of enterprise hospital system contracts, active clinician seats per health system, and
      production versus pilot deployment status.
    whyItMatters: >-
      Current disclosures cite flagship health system pilots (e.g. Beth Israel Lahey Health, MaineGeneral, Modality
      Partnership) but omit full health system account counts and contract values, limiting independent verification of
      enterprise penetration.
    diligencePath: >-
      Obtain complete enterprise customer roster with contract commencement dates, annual contract values (ACV), active
      seat counts, and primary EHR integration architecture.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register-verification
    missingEvidence: >-
      Non-public correspondence, pre-submission inquiries, or unannounced audit records with the Australian TGA, US FDA,
      and Health New Zealand regarding SaMD classification thresholds.
    whyItMatters: >-
      Reclassification from an exempt administrative scribe to a regulated medical device would impose lengthy clinical
      trial validations and CE/FDA/ARTG pre-market submission requirements.
    diligencePath: >-
      Request confidential regulatory filing disclosures, TGA/FDA pre-submission meeting minutes, and enterprise
      compliance audit reports under NDA.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: ehr-integration-vendor-agreements
    missingEvidence: >-
      Direct enterprise partnership agreements, revenue-sharing terms, and API rate-limit covenants with electronic
      health record vendors including Epic, Oracle Health (Cerner), and MEDITECH.
    whyItMatters: >-
      EHR vendors have structural incentives to favor first-party or vertically integrated solutions like Nuance DAX
      Copilot, creating platform access and pricing risks.
    diligencePath: >-
      Review vendor partner agreements, API access SLAs, and marketplace certification status across core EHR platforms
      during confirmatory diligence.
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: enterprise-cohort-retention-and-gross-margins
    missingEvidence: >-
      Audited gross margins, cloud inference hosting costs per consult on Google Gemini, and net revenue retention (NRR)
      rates by customer tier.
    whyItMatters: >-
      Without visibility into unit-level inference costs and customer renewal rates, verifying whether an 18x ARR
      multiple is justified remains impossible.
    diligencePath: >-
      Request full access to management financial model, cloud compute invoices, and enterprise health system cohort
      retention tables in the confidential data room.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: minor
    topic: cvf-repayment-terms
    missingEvidence: >-
      Detailed contract terms, revenue-share percentages, repayment schedules, and return caps for the US$240M General
      Catalyst Customer Value Fund investment.
    whyItMatters: Senior revenue-share claims could subordinate common equity returns in lower-growth scenarios.
    diligencePath: >-
      Review the General Catalyst CVF transaction agreements and senior financing covenants during confirmatory legal
      diligence.
    relatedQuestionRefs:
      - QV003
