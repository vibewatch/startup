  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Ambient Clinical Scribing Workflow
        blocks:
          - type: paragraph
            body: >-
              Heidi Health operates as an ambient clinical intelligence platform engineered to alleviate healthcare
              provider documentation burden by converting natural clinician-patient conversations into structured
              medical records. Clinicians activate the software via web applications, desktop clients, mobile
              applications, or lightweight browser and EHR widgets during consultations, allowing the microphone stream
              to capture real-time audio without altering encounter dynamics. The underlying processing engine filters
              ambient acoustic noise, transcribes multi-speaker dialogues, and organizes clinical findings into
              standardized SOAP notes, consultation summaries, or specialty-specific documentation formats across 110
              languages in over 116 countries. By handling real-time transcription and initial synthesis, Heidi claims
              to save practitioners up to two hours per clinical workday, returning time to direct patient care.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
      - number: '5.2'
        title: Product Modules, Asset Portfolio, and Clinical Capabilities
        blocks:
          - type: paragraph
            body: >-
              The core offering centers on the ambient AI scribe, supported by an expanding portfolio of auxiliary
              modules designed to extend workflow automation across practice settings. For EHR interoperability, Heidi
              provides two primary integration styles: Connect integrations, which establish backend bidirectional
              synchronization to pull daily appointment schedules and push finalized notes back into patient records,
              and Embedded integrations, which surface side-panel widgets directly inside web-based EHR interfaces.
              Beyond core encounter documentation, Heidi launched Heidi Comms in February 2026 to automate routine
              outbound patient touchpoints, appointment reminders, and follow-up communications, alongside Heidi
              Evidence for in-workflow medical evidence queries. Enterprise customers also gain access to AI-driven
              coding suggestions that map diagnoses to ICD-10 and SNOMED-CT taxonomies.
            claimRefs:
              - CE001
              - CE003
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE011
              - CE012
      - number: '5.3'
        title: Model Infrastructure, Fine-Tuning Pipeline, and Inference Latency
        blocks:
          - type: paragraph
            body: >-
              A central technological milestone for Heidi was transitioning from proprietary closed-model APIs toward
              domain-specialized open foundation models hosted on Fireworks AI's optimized inference infrastructure. To
              surpass frontier model performance while managing cost and latency, Heidi implemented a two-stage training
              strategy: Supervised Fine-Tuning (SFT) to teach clinical style and structure, followed by Reinforcement
              Fine-Tuning (RFT) using Direct Preference Optimization (DPO) to instill deep clinical reasoning and
              preference adherence. To overcome noisy human evaluations, Heidi utilizes frontier model synthetic
              rewrites and automated LLM-as-a-Judge filtering for template compliance and omission prevention. Training
              stability is maintained by scaling effective batch sizes to 1.5 million tokens using gradient accumulation
              across 24 steps, resulting in a 3.5x reduction in inference latency from 25 seconds down to 7 seconds.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE012
      - number: '5.4'
        title: EHR Interoperability, Regional Availability, and Technical Gaps
        blocks:
          - type: paragraph
            body: >-
              Despite substantial technical progress and recent funding of US40 million to scale agentic capabilities
              across global healthcare systems, notable architectural boundaries and operational constraints persist.
              From an integration standpoint, Heidi announced that its developer API and lightweight widget integrations
              are no longer available for new partner integrations in Australia and New Zealand, restricting regional
              extensibility. Furthermore, competitive benchmarks highlight that Heidi's structured output terminates at
              the clinical note rather than updating discrete coded EHR flowsheets, medication registries, or
              longitudinal problem lists. While Heidi's deliberate privacy policy of discarding audio recordings
              immediately after transcription strengthens data protection compliance under HIPAA and GDPR, it precludes
              retrospective acoustic auditing or sentence-level audio replay during clinical record disputes.
            claimRefs:
              - CE004
              - CE009
              - CE010
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Inference Latency Breakthrough via Fine-Tuning Optimization
            body: >-
              By transitioning from closed frontier APIs to open models fine-tuned with SFT and RFT (via DPO) hosted on
              Fireworks AI, Heidi reduced inference latency from 25 seconds to 7 seconds—a 3.5x improvement that
              significantly accelerates note generation while lowering serving costs.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
          - type: callout
            title: The Ambient Data Gap and Regional API Deprecations
            body: >-
              Heidi's structured output stops at the encounter note, leaving discrete EHR charts and problem lists
              un-updated. Furthermore, the withdrawal of the Heidi API and Widget for future integrations in Australia
              and New Zealand highlights platform dependency risks for healthtech partners.
            calloutType: risk
            claimRefs:
              - CE004
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Commercial Structure
        blocks:
          - type: paragraph
            body: >
              Heidi Health divides its commercial customer landscape into three distinct tiers: solo and independent
              outpatient clinicians, mid-market clinic networks, and large enterprise hospital networks across
              international markets. Top-of-funnel customer acquisition relies heavily on a product-led growth freemium
              model that offers unlimited basic medical transcription alongside a monthly cap of ten Pro Actions. This
              self-serve tier allows frontline practitioners to test ambient documentation without administrative
              procurement friction, building organic grassroots advocacy across outpatient practices before commercial
              upselling occurs.


              To monetize this broad practitioner base, Heidi transitions active users into paid subscription
              structures. Independent practitioners can self-upgrade to the Clinician plan at $150 per user per month
              billed annually, while group clinics and regional healthcare organizations are directed toward
              custom-quoted Practice and Enterprise tiers. Mid-market commercial execution is structured around
              regionally aligned Customer Success Managers who manage dedicated portfolios of approximately 50
              healthcare accounts representing roughly £2.5 million in annual recurring revenue. At the high end of the
              market, Enterprise Customer Success Managers oversee tightly bounded portfolios of three to six major
              hospital networks and multi-site health systems, each encompassing 250 or more active clinical users. To
              support international expansion across different healthcare operating regimes, Heidi has deployed
              dedicated commercial and go-to-market personnel across key target regions including the United Kingdom,
              the United States, and South Africa.
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU014
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU007
              - CU009
              - CU014
      - number: '6.2'
        title: Adoption Trajectory and Scaling Velocity
        blocks:
          - type: paragraph
            body: >
              The velocity of platform utilization reported by Heidi Health reflects dramatic expansion over the past
              twenty-four months. According to company disclosures published in conjunction with its September 2026
              financing announcement, the platform powers more than 2.8 million weekly patient sessions across 110
              languages in over 190 countries. This encounter volume represents substantial acceleration from late 2025
              milestones, when weekly consultations stood at approximately 2 million. Cumulatively, Heidi claims to have
              processed over 175 million clinical visits and absorbed 67 million clinical documentation hours since
              commercial inception, more than doubling its footprint from the 73 million visits recorded at its Series B
              round.


              This rapid operational adoption has translated into steep top-line commercial growth. Heidi reported
              growing its annual recurring revenue from $1 million to $50 million as of April 2026, representing a
              fiftyfold revenue expansion achieved in a twenty-four-month operating window. Commercial staffing briefs
              indicate that customer success teams are assigned strict quotas covering net revenue retention, contract
              renewals, and account expansion. However, while top-line transaction counts and ARR milestones demonstrate
              robust customer intake, Heidi does not publicly disclose the precise proportion of weekly consultations
              generated by free users versus paying subscription accounts, making independent evaluation of underlying
              account unit economics essential for institutional diligence.
            claimRefs:
              - CU005
              - CU006
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
      - number: '6.3'
        title: Enterprise Deployments and Customer Proof
        blocks:
          - type: paragraph
            body: >
              Enterprise customer validation has become the central focus of Heidi's commercial go-to-market strategy,
              shifting away from pure direct-to-consumer clinician tools toward institutional deployments. The company's
              premier reference customer in the United States is Beth Israel Lahey Health (BILH), which completed a
              system-wide enterprise rollout following a six-month pilot program involving 1,000 participating
              healthcare providers. Independent health system evaluations indicated that 89% of participating clinicians
              reported satisfaction with AI-generated note quality, 90% felt more present during patient consultations,
              82% reported reduced cognitive load, and 74% experienced measurable reductions in after-hours
              administrative documentation time. Additional referenced North American health systems include
              MaineGeneral, Monash Health in Australia, and regional health authorities such as the Yukon Government in
              Canada.


              Beyond hospital health systems, specialized outpatient clinic networks have published tangible
              productivity outcomes. In behavioral health, Indiana Health Group documented 2,000 hours of documentation
              time savings and recovered approximately $200,000 in clinical capacity value within five months of
              deployment. In surgical outpatient care, Advanced Urology reported a 10.3x return on investment, recouping
              $121,000 in productive clinical time over sixteen weeks. In the United Kingdom, Heidi was selected by the
              Modality Partnership for the largest regional deployment of ambient clinical AI, while simultaneously
              conducting pilots across multiple NHS Trusts covering a collective population of nearly four million
              patients.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU012
      - number: '6.4'
        title: Workflow Friction, Retention Risks, and Churn Drivers
        blocks:
          - type: paragraph
            body: >
              Despite rapid top-line intake, Heidi Health encounters notable workflow friction, pricing resistance, and
              compliance barriers that introduce customer retention vulnerabilities. The most acute structural barrier
              for independent US outpatient practices is the strict gating of electronic health record write-back behind
              custom-quoted Practice and Enterprise tiers. On the standard $150 per month Clinician plan, automated
              push-to-chart functionality is unavailable, forcing clinicians to manually copy and paste generated notes
              into their EHR systems at the end of each encounter. This manual transfer partially negates the core
              administrative time savings that motivate adoption in outpatient settings.


              Furthermore, competitive reviews highlight that Heidi's Clinician plan does not include a signed HIPAA
              Business Associate Agreement, restricting compliant US use to higher-cost custom tiers. Competitors such
              as BastionGPT emphasize this limitation by offering full BAA coverage and document analysis on entry tiers
              starting at $20 per month, directly challenging Heidi's $150 per month pricing introduced during its
              February 2026 rebrand. Technical evaluations also indicate that Heidi relies on static note template
              configuration rather than adaptive machine learning that dynamically adjusts to individual physician
              phrasing or revision habits over time. Finally, peer-reviewed clinical AI evaluations demonstrate that
              ambient scribes consistently produce documentation errors requiring mandatory clinician oversight, meaning
              that lack of tight EHR integration significantly exacerbates physician review burden and elevates
              long-term contract churn risks.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapid Bottom-Up Clinician Adoption Driven by Product-Led Growth
            body: >-
              Heidi Health's freemium model and template customization have successfully generated massive clinician
              top-of-funnel engagement, reaching 2.8 million weekly consultations across 190 countries and creating
              organic demand that precedes enterprise discussions.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
              - CU014
          - type: callout
            title: EHR Integration Paywall and Missing BAA on Self-Serve Tiers
            body: >-
              Restricting automated EHR write-back and HIPAA Business Associate Agreements to custom-quoted Practice and
              Enterprise tiers creates substantial churn risk among solo and small group practitioners, who must
              manually copy notes into charts while paying $150 per month.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory & Software-as-a-Medical-Device (SaMD) Exposure
        blocks:
          - type: paragraph
            body: >-
              Heidi Health's current market access across Australia, New Zealand, the United Kingdom, and the United
              States depends on maintaining its regulatory characterization as an administrative documentation tool
              rather than a diagnostic clinical system. Under existing Therapeutic Goods Administration (TGA) regulatory
              policies in Australia, ambient AI scribes that solely record and format clinical dialogue are exempt from
              pre-market registration on the Australian Register of Therapeutic Goods (ARTG). However, as Heidi Health
              expands its platform roadmap from passive ambient transcription toward autonomous clinical agents,
              pre-chart summarization, and supervised clinical workflows, this regulatory boundary becomes precarious.
              If healthcare regulators in Australia, the US Food and Drug Administration (FDA), or Medsafe in New
              Zealand determine that the software assists in differential diagnosis or clinical decision-making, Heidi
              Health faces immediate reclassification as Software as a Medical Device (SaMD). Such reclassification
              would mandate rigorous clinical evidence generation, formal conformity assessments, and substantial
              ongoing regulatory compliance expenditures, potentially delaying feature deployments across enterprise
              health networks.
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR013
      - number: '7.2'
        title: Operational Reliability & Prompt Injection Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Operational security and transcription fidelity represent acute failure modes for Heidi Health in
              frontline healthcare environments. Independent adversarial red-teaming conducted by cybersecurity research
              firm Mindgard demonstrated that prompt-level manipulation techniques can circumvent Heidi Health's
              safeguard boundaries. In structured vulnerability assessments, researchers induced the underlying language
              models to bypass ethical constraints, generate step-by-step guidance for identity theft using clinical
              electronic health record data, and output diagnostic-style reasoning in direct violation of system
              instructions. Furthermore, Health New Zealand's deployment across emergency departments highlighted that
              governance-led committee approvals often fail to execute technical offensive testing before national
              rollouts. On the clinical operations side, practitioners on Trustpilot report significant workflow
              friction, including transcription processing delays of up to five minutes per patient encounter,
              unexpected session logouts during extended consultations, and formatting divergences between browser and
              desktop applications. In high-velocity medical practices, these operational defects risk clinical burnout
              and prompt clinician churn toward competing transcription utilities.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
      - number: '7.3'
        title: EHR Integration & Hyperscaler Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              Heidi Health's commercial defensibility is constrained by deep structural dependencies on underlying
              foundational artificial intelligence providers and dominant electronic health record (EHR) gatekeepers.
              While Heidi Health utilizes Magic Paste and browser extensions to inject structured clinical notes into
              existing practice management systems, it lacks the native enterprise integration enjoyed by vertically
              integrated incumbents. Most notably, Microsoft's Nuance DAX Copilot leverages direct embedded integrations
              within Epic and MEDITECH across more than 150 health systems, offering health system buyers bundled
              enterprise licensing and unified IT administration. Simultaneously, direct competitors like Freed target
              outpatient clinics with streamlined product-led growth strategies. Although Heidi Health secured a $340
              million financing package in September 2026—comprising a $100 million Series C equity round and a $240
              million non-dilutive growth facility from General Catalyst—the company must sustain high customer
              acquisition investments to overcome ecosystem lock-in and vendor switching costs.
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Mitigation Maturity, Residual Exposure & Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Heidi Health's aggregate risk profile reveals a distinct divergence between established
              operational safeguards and emerging strategic threats. The company has implemented foundational security
              controls, maintaining compliance with HIPAA, GDPR, and ISO 27001 standards, alongside formal Master
              Services Agreements that define physical and technical protections for customer health data. Furthermore,
              corporate communication consistently reiterates that Heidi Health is engineered as an assistive care
              partner that preserves clinician agency rather than replacing human medical judgment. Nevertheless,
              residual exposure remains elevated in areas where technical guardrails interface with regulatory
              definitions. Investors must track explicit thesis-break triggers across the portfolio: (1) any formal
              regulatory inquiry or warning letter from the TGA, FDA, or Medsafe alleging unapproved SaMD functionality;
              (2) public documentation of a patient safety incident or privacy breach arising from hallucinated notes or
              prompt manipulation; and (3) a deceleration in organic clinician retention driven by mobile app
              instability or EHR platform hostility.
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diagnostic Scope Creep as Primary SaMD Reclassification Trigger
            body: >-
              Heidi Health's stated strategic ambition to evolve from passive documentation into agentic workflows
              executing clinical tasks directly threatens its regulatory exemption. If ambient tools offer proactive
              treatment recommendations or diagnostic guidance, global health authorities will enforce medical device
              certification, creating severe operational friction.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation and Decision Framework
        blocks:
          - type: paragraph
            body: >-
              We initiate coverage on Heidi Health with a Hold / Research-More recommendation, assigning a Medium
              confidence level, a High risk rating, and a Full / Stretched valuation stance. In September 2026, Heidi
              Health closed a landmark US$100 million Series C equity financing round led by Blackbird, valuing the
              company at a post-money valuation of US$900 million. Concurrently, the company secured a US$240 million
              non-dilutive growth financing facility from General Catalyst Customer Value Fund, bringing total new
              capital commitments to US$340 million. Although Heidi Health reported rapid top-line ARR expansion from
              US$1 million to US$50 million as of April 2026, entering at an 18x ARR run-rate multiple leaves little
              margin of safety given intense competition from ambient medical scribes and unverified enterprise
              retention cohorts.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: Core Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis rests on Heidi Health demonstrated viral adoption across global clinical
              networks and rapid expansion beyond passive medical transcription into active agentic clinical workflows.
              The company claims its AI Care Partner platform has supported over 175 million patient visits and returned
              67 million clinical hours across 190 countries and 110 languages, building upon foundations established
              during its US$65 million Series B round in October 2025 at a US$465 million valuation. However, the
              anti-thesis emphasizes that ambient documentation is rapidly commoditizing as foundational model providers
              and established electronic health record vendors embed native ambient intelligence. Furthermore,
              proprietary model differentiation remains vulnerable given Heidi Health reliance on Google Gemini for
              underlying clinical synthesis.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV011
              - CV012
      - number: '8.3'
        title: Capital Structure, Growth Facilities, and Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              Heidi Health capitalization structure combines traditional venture equity with specialized revenue-share
              growth capital. While the US$100 million Series C equity round brought cumulative venture equity raised to
              nearly US$200 million, the US$240 million General Catalyst Customer Value Fund investment operates as
              non-dilutive growth capital to fund go-to-market and workforce expansion. Under this structure, General
              Catalyst covers customer acquisition expenditures in exchange for a contracted percentage of new customer
              revenue up to a fixed dollar cap. While non-dilutive to equity ownership, this structure creates a
              cash-flow encumbrance on gross margin that could subordinate equity distributions in adverse revenue
              scenarios. Strengthened leadership appointments, including former Plaid revenue head Paul Williamson as
              CRO and former Microsoft CMO Dr. Simon Kos, aim to navigate these enterprise commitments.
            claimRefs:
              - CV002
              - CV008
              - CV011
      - number: '8.4'
        title: Valuation Multiples and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              At the reported US$900 million Series C post-money valuation, Heidi Health trades at approximately 18x its
              April 2026 ARR run-rate of US$50 million. This multiple represents a premium over mature vertical software
              peers and reflects aggressive forward growth assumptions. Secondary market intelligence from Forge Global
              indicates limited trading activity and no established matched share prices or disclosed trade metrics,
              confirming that liquidity remains constrained and speculative. Our scenario framework evaluates three
              distinct trajectories through 2027: a Bull Case ($120M ARR at 16x multiple, yielding $1.92B valuation), a
              Base Case ($80M ARR at 11x multiple, yielding $880M valuation), and a Bear Case ($45M ARR at 5x multiple,
              yielding $225M valuation). Probability-weighted valuation indicates an expected enterprise value of $869
              million, suggesting current equity pricing is fully valued.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV009
              - CV010
      - number: '8.5'
        title: Exit Readiness, Liquidity Channels, and Confirmatory Diligence
        blocks:
          - type: paragraph
            body: >-
              Heidi Health path to liquidity faces structural hurdles in the private secondary markets. Secondary market
              platforms like Forge Global classify pre-IPO shares as highly speculative and illiquid, with no public
              trading history or published post-money valuation metrics. For an eventual initial public offering or
              strategic acquisition by healthcare IT conglomerates, Heidi Health must demonstrate sustainable net
              revenue retention, software gross margins exceeding 70% net of inference compute costs, and a clear
              resolution of the Customer Value Fund revenue obligations. Prior to considering any equity co-investment
              or secondary share acquisition, confirmatory diligence must audit customer cohort churn, verify gross
              margin durability on Google Gemini APIs, and inspect the specific repayment terms of the US$240 million
              CVF facility.
            claimRefs:
              - CV009
              - CV010
              - CV014
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Disciplined Watchlist Position'
            body: >-
              While Heidi Health demonstrates impressive commercial momentum by reaching US$50 million in run-rate ARR
              within two years, entering at an 18x multiple on an unproven gross margin profile presents asymmetric
              downside. Capital allocators should maintain a Hold / Research-More posture until verified enterprise
              cohort retention data confirms long-term pricing power.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
          - type: callout
            title: Capital Structure Encumbrance and Secondary Illiquidity
            body: >-
              The combination of US$240 million in non-dilutive revenue-share financing from General Catalyst Customer
              Value Fund and the total absence of secondary market price discovery on platforms like Forge Global
              creates significant downside vulnerability. If ARR growth slows, senior revenue-share payments will
              directly compress free cash flow available to common equity.
            calloutType: risk
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV011
