              - CM014
              - CM015
      - number: '2.3'
        title: Buyer Segmentation, Workflow Economics, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              The purchasing dynamics governing AI scribe adoption vary substantially across practice tiers, driving
              distinct unit economics and conversion paths. In solo and two-provider practices, the clinician acts as
              both end user and economic buyer, adopting low-cost or freemium tools to alleviate personal after-hours
              administrative fatigue without formal IT procurement. In mid-sized practices with three to five
              physicians, clinic administrators assume budget ownership, focusing on standardized documentation quality
              and staff retention. However, as practice scale expands to six or more providers, the workflow calculus
              shifts dramatically. In high-volume clinics handling 50 or more daily visits, the absence of direct
              two-way EHR chart write-back imposes an onerous manual copy-paste burden that consumes hundreds of
              physician hours annually. Consequently, multi-provider practices face strong economic pressure to bypass
              entry-level seats in favor of fully integrated enterprise contracts that automate chart injection and
              minimize documentation drag.
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM009
              - CM011
              - CM012
      - number: '2.4'
        title: Structural Adoption Constraints, EHR Gatekeeping, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Despite compelling headline time savings, ambient AI scribes encounter significant structural adoption
              constraints and unresolved diligence questions. Chief among these is the risk of unmanaged Evaluation and
              Management (E&M) undercoding: when clinicians copy unstructured notes into complex EHR systems under time
              pressure, nuance is lost, leading to documentation errors that cost practices tens of thousands of dollars
              per provider annually in missed reimbursement. Furthermore, user feedback from independent reviews
              highlights accuracy challenges in multi-issue encounters, where ambient models risk combining disparate
              clinical complaints into unified narratives. At $150 per user monthly for its Clinician tier, Heidi
              commands a pricing premium over several entry-level alternatives while still restricting discrete
              structured chart updates to high-tier plans. Finally, public market sizing data remains clouded by
              conflicting vendor TAM figures and unaudited commercial disclosures, leaving the long-term enterprise
              software addressability an open diligence item.
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Self-Serve Integration Paradox in Ambulatory Care
            body: >-
              While Heidi's self-serve model removes friction for solo practitioners, the absence of native EHR push
              integration in lower-tier plans creates a hidden copy-paste tax of 132 to 330 annual hours per clinician.
              Practices with more than five providers rapidly experience workflow diseconomies unless they upgrade to
              custom enterprise contracts.
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM009
          - type: callout
            title: Reimbursement Leakage from Unmanaged E&M Complexity
            body: >-
              Adopting ambient scribing without embedded coding intelligence leaves practices exposed to persistent E&M
              undercoding. In high-volume clinics conducting 50 or more daily visits, aggregate revenue losses from
              uncaptured visit complexity often exceed annual software subscription expenses by a significant multiple.
            calloutType: risk
            claimRefs:
              - CM006
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Ambient Peers and Incumbent Positioning'
        blocks:
          - type: paragraph
            body: >-
              The ambient clinical documentation software sector has rapidly differentiated into distinct market tiers,
              separating lightweight documentation utilities from deeply integrated hospital workflow engines. Heidi
              Health originated in Australia and expanded internationally by prioritizing multilingual documentation
              capabilities across 110 languages and 190 countries, positioning itself as an AI Care Partner for clinical
              workflows. However, as documented in direct competitive comparisons, Heidi confronts pressure across
              multiple fronts. Independent US outpatient clinicians increasingly weigh Heidi against domestic peers such
              as Freed and DeepCura, while large health systems evaluate enterprise incumbents including Suki AI and
              Microsoft's Dragon Copilot. Heidi's recent US$340 million funding package, comprising US$100 million in
              Series C equity and US$240 million in non-dilutive growth capital from General Catalyst, provides
              substantial commercial runway to defend its footprint against platform incumbents. Nevertheless,
              enterprise health systems require validated integration pipelines that extend beyond raw transcription
              volume into institutional governance and operational alignment.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.2'
        title: 'Capability Analysis: Ambient Note Drafting Versus Structured Chart Automation'
        blocks:
          - type: paragraph
            body: >-
              A critical technical fault line across ambient medical AI is the architectural distinction between prose
              note synthesis and structured chart data extraction. Heidi Health's core engine processes clinical
              conversations into structured prose notes across specialized templates, but its data output terminates at
              the encounter note. In contrast, emerging competitors such as DeepCura have introduced ambient data
              architectures that autonomously parse spoken clinical dialogue into coded ICD-10, LOINC, and RxNorm
              terminology cards, directly updating discrete patient problem lists and medication registries upon
              physician verification. Furthermore, Heidi maintains a privacy-centric posture that discards raw audio
              recordings post-transcription, which prevents clinicians from auditing notes against exact audio
              timestamps during retrospective reviews. While Heidi offers modular expansions like Heidi Comms for
              outbound communications, competing platforms are unifying inbound communications into automated triage
              queues that bridge ambient scribing directly into practice management workflows.
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.3'
        title: Pricing Economics, Gating Models, and Enterprise Lock-In
        blocks:
          - type: paragraph
            body: >-
              Packaging and pricing strategies in the AI scribe market have diverged sharply between transparent
              self-serve subscription models and negotiated enterprise contracts. Heidi Health increased its entry
              Clinician plan pricing to $150 per user per month, up from approximately $90 per month in prior
              iterations. However, critical workflow automations including electronic health record (EHR) push-to-chart
              functionality and automated billing code suggestions remain restricted to Heidi's enterprise tier under
              unpublished custom pricing. This pricing structure creates operational friction for solo practitioners and
              small group practices who pay premium subscription rates while still relying on manual copy-paste
              charting. Conversely, competitors such as Freed include EHR push-to-chart across 50 systems and ICD-10
              coding within published monthly plans ranging between $59 and $119, while DeepCura provides structured
              charting at $129 per user per month. Consequently, Heidi's packaging strategy risks alienating independent
              practitioners who demand automated chart integration without navigating complex enterprise procurement.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP011
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Displacement Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Heidi Health's long-term defensibility rests on whether its expanding scale and multilingual breadths can
              construct enduring switching barriers before ambient documentation commoditizes. Having achieved US$50
              million in annual recurring revenue and supported over 175 million patient visits worldwide, Heidi
              possesses formidable top-of-funnel momentum across international markets. However, switching costs for
              self-serve outpatient clinicians remain low, as switching between ambient scribe applications requires
              minimal retraining and no infrastructure migration. Independent physician reviews in 2026 highlighted
              recurring reliability concerns, including lost consultation recordings and medication hallucinations that
              depressed user satisfaction ratings. In the enterprise tier, hospital networks are heavily anchored to
              incumbents like Dragon Copilot and Suki due to bi-directional Epic integrations and institutional
              approvals. To establish durable competitive advantages, Heidi must leverage its growth capital to
              transition from isolated encounter documentation toward indispensable multi-agent health system operating
              workflows.
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise Feature Gating Erodes SMB Clinician Retention
            body: >-
              By gating essential EHR push-to-chart and automated billing coding behind an unpublished enterprise tier
              while raising Clinician plan pricing to $150/month, Heidi creates an incentive for solo and small-practice
              physicians to migrate to competitors like Freed ($59–$119/mo) and DeepCura ($129/mo) that include these
              capabilities in standard self-serve plans.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP010
          - type: callout
            title: The Architectural Shift from Ambient Scribing to Ambient Data
            body: >-
              Competitive pressures in 2026 reflect an evolution from prose documentation generators toward structured
              ambient data platforms. While Heidi's $340M capital injection funds an expansion toward agentic workflows,
              peers like DeepCura have already introduced automated ICD-10/LOINC chart staging and unified inbox
              routing, challenging Heidi's note-centric architecture.
            calloutType: insight
            claimRefs:
              - CP004
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Heidi Health commercializes its clinical documentation platform through a tiered software model combining
              a zero-cost ambient transcription wedge, paid individual practitioner subscriptions, and institutional
              enterprise licenses across health systems. Management communications indicate that approximately half of
              active clinicians utilize the free ambient documentation service, while the remaining half have upgraded
              to paid premium tiers that offer longitudinal session linking, multi-application dictation, and advanced
              specialty templates. Enterprise adoption has progressed from individual clinician signups into regional
              provider agreements, exemplified by public procurement awards such as the NHS England Midlands contract
              encompassing 15 acute and community trusts and 1,239 general practices. Enterprise contracts represent
              Heidi's highest-quality revenue stream due to multi-year commitments, high switching costs, and recurring
              software license structures.
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
