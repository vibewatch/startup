      - number: '4.3'
        title: Cost Structure, Gross Margin Dynamics, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              A critical determinant of Heidi Health's underlying gross margin trajectory is its inference compute cost
              architecture. Unlike competitors that rely entirely on proprietary third-party foundation models with
              per-token pricing, Heidi handles the vast majority of its transcription and clinical note generation
              workloads on in-house, domain-specific clinical models. This internal infrastructure significantly
              moderates variable compute expenses as encounter volume scales across millions of weekly visits. However,
              operating expenses are increasingly pressured by European Union medical device regulatory compliance, data
              residency mandates, and international expansion requirements across France, Germany, and the United
              Kingdom. Audited gross margin and net revenue retention metrics remain undisclosed, preventing definitive
              verification of customer-level profitability.
            claimRefs:
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
