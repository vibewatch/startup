figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological progression of key corporate founding, clinical validation, institutional financing, and product
      expansion milestones.
    approximationNotes: null
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO007
      - CO008
      - CO009
      - CO010
    data:
      items:
        - date: '2019'
          label: Company Inception as Oscer
          detail: >-
            Founded in Melbourne by Dr. Thomas Kelly, Waleed Mussa, and Yu Liu to address clinical documentation
            burnout.
          tone: positive
        - date: '2021'
          label: Rebrand to Heidi Health
          detail: Pivoted from initial diagnostic education platform to ambient AI medical scribe for practicing doctors.
          tone: positive
        - date: March 2025
          label: Series A Financing ($16.6M)
          detail: Raised initial institutional funding round to expand clinical documentation software and user acquisition.
          tone: positive
        - date: October 2025
          label: Series B Financing ($65M)
          detail: Point72 Private Investments led $65M round to scale international footprint across the US, UK, and Canada.
          tone: positive
        - date: February 2026
          label: Launch of Heidi Comms
          detail: Expanded product architecture into patient communications, automated booking, and clinic task coordination.
          tone: positive
        - date: March 2026
          label: Launch of Heidi Evidence
          detail: >-
            Rolled out context-aware point-of-care clinical guidelines, answering over 10 million queries in first six
            months.
          tone: positive
        - date: April 2026
          label: Rapid Scale Milestone ($50M ARR)
          detail: ARR scaled from $1M to $50M in 24 months, propelled by viral clinician adoption and multilingual support.
          tone: positive
        - date: September 2026
          label: Series C & Growth Tranche ($340M)
          detail: Secured $100M equity led by Blackbird at $900M valuation alongside $240M from General Catalyst CVF.
          tone: positive
        - date: September 2026
          label: Global Reach (2.8M Consults/Week)
          detail: Supported 2.8 million weekly visits across 190 countries, 110 languages, and major health systems.
          tone: positive
  - id: FM001
    title: 'Market Sizing Lens: From Global Administrative Burden to Addressable Scribe Spend'
    type: pyramid
    summary: >-
      Hierarchical progression from global healthcare workforce shortages and documentation overhead to the addressable
      ambulatory scribe market and Heidi's contracted footprint.
    data:
      items:
        - label: Global Clinician Documentation Overhead
          value: 11000000
          unit: Clinicians
          detail: Macro deficit of 11M health workers by 2030 driving demand to reclaim clinical hours.
        - label: U.S. Ambulatory Documentation Overhead
          value: 2
          unit: Hours/Day/Doctor
          detail: Physicians spend ~2 hours documenting per hour of patient care (UCLA Health/NEJM AI).
        - label: U.S. Small Practice Segment
          value: 47
          unit: '% of Active MDs'
          detail: 47% of active U.S. physicians operate in independent practices with <=5 doctors (AAMC 2025).
        - label: High-Volume Practice Benchmark
          value: 50
          unit: Encounters/Day+
          detail: Practices with 5+ clinicians requiring native 2-way EHR chart push to avoid manual entry.
        - label: Heidi Current Addressable Scribe Footprint
          value: 116
          unit: Countries
          detail: Category leader in multilingual ambient capture supporting 110+ languages.
        - label: Heidi Contracted Scale Run-Rate
          value: 50
          unit: USD M ARR
          detail: Announced ARR expanding from US$1M to US$50M as of April 2026.
    approximationNotes: >-
      Figure data synthesizes macro clinical workforce figures from Business Wire/WHO (11M shortfall by 2030), NEJM AI
      observational study (2:1 documentation ratio), AAMC small practice distribution (47%), and reported Heidi scale.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM014
      - CM015
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal positioning of clinical documentation solutions across workflow breadth and structured data automation.
    data:
      points:
        - label: Heidi Health
          x: 6.5
          'y': 4
          detail: >-
            High international and language reach with $150/mo list price, but structured data and EHR push-to-chart
            remain enterprise-gated.
        - label: Freed
          x: 5
          'y': 5.5
          detail: >-
            Accessible US pricing ($59-$119/mo) with persistent Learn Format personalization and transparent EHR push,
            but narrow international scope.
        - label: DeepCura
          x: 6
          'y': 8
          detail: >-
            Advanced structured chart automation (Ambient Data) and multi-channel AI Inbox at $129/mo, leading in
            administrative workflow breadth.
        - label: Suki AI
          x: 8
          'y': 7
          detail: >-
            Deep bi-directional enterprise EHR integration and voice assistant capability, constrained by a premium
            $399/mo price point.
        - label: Dragon Copilot
          x: 9
          'y': 6.5
          detail: >-
            Dominant Epic ecosystem penetration with institutional compliance, but limited accessibility outside
            enterprise contracts.
        - label: Doximity Scribe
          x: 3
          'y': 2
          detail: >-
            Zero-cost drafting utility for verified US physicians, lacking structured EHR integration, coding
            assistance, or customization.
    approximationNotes: >-
      Axes represent qualitative ordinal scoring (1-10) evaluated from vendor capability audits, pricing structures, and
      EHR integration depth.
