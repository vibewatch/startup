              - CI004
              - CI005
              - CI008
              - CI013
      - number: '4.4'
        title: Capital Adequacy, Solvency, and Diligence Assessment
        blocks:
          - type: paragraph
            body: >-
              With US$340 million in fresh capital raised in September 2026 across equity and debt, Heidi Health
              possesses substantial balance sheet liquidity to support ongoing platform transformation into agentic
              workflows. Cumulative capital raised exceeds US$430 million, and executive leadership has articulated a
              public target of reaching cash-flow neutrality by late 2027 while expanding in continental Europe. Private
              market comps reflect an 18.0x revenue multiple on US$50 million of disclosed revenue at a US$901 million
              valuation, demonstrating multiple contraction from prior rounds. The primary underwriting risk centers on
              whether the revenue-contingent debt facility creates an unmanageable repayment drag if hospital budget
              cycles lengthen or practitioner churn accelerates prior to reaching operating cash-flow breakeven.
            claimRefs:
              - CI001
