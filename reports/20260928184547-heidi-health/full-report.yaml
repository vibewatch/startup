      - number: '4.2'
        title: Go-to-Market Economics and Customer Acquisition Mechanics
        blocks:
          - type: paragraph
            body: >-
              Heidi Health has adopted an unconventional capital structure to accelerate customer acquisition without
              sustaining repeated equity dilution. Alongside its US$100 million Series C equity round, the company
              secured a US$240 million customer-acquisition financing commitment from General Catalyst's Customer Value
              Fund. Earmarked exclusively for sales and marketing expenditures, the facility functions as revenue-based
              growth financing where capital deployed to acquire healthcare organizations is repaid with interest
              directly from the revenue generated by those cohorts. While this structure insulates existing shareholders
              from equity dilution and provides roughly four and a half years of distribution investment capacity, it
              introduces debt-like servicing obligations that hinge on sustained customer retention and healthy net
              expansion over multi-year horizons.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
          - type: figure
            figureRef: FI001
