  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-layer technical stack spanning client capture, orchestration, model fine-tuning, knowledge bases, integration
      gateways, and compliance safeguards.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
    data:
      layers:
        - label: Client Capture & Interface Layer
          detail: Ambient microphone input, web/desktop apps, Chrome extensions, and embedded EHR widgets (e.g. Vim Connect).
          modules:
            - Web Application
            - Desktop Client
            - Mobile Apps
            - Chrome Extension
            - EHR Embedded Widgets
        - label: Session Orchestration & Pre-Processing
          detail: Audio capture pipeline, real-time audio streaming, speaker separation, and consultation context ingestion.
          modules:
            - Audio Stream Ingestion
            - Noise Filtering
            - Context Assembler
            - Template Selector
        - label: Model Fine-Tuning & Inference Engine
          detail: >-
            Specialized open foundation models fine-tuned via SFT and RFT (DPO) hosted on Fireworks AI inference
            platform.
          modules:
            - Fireworks AI Inference Runtime
            - Supervised Fine-Tuning (SFT) Models
            - Reinforcement Fine-Tuning (RFT) Pipeline
            - Direct Preference Optimization Engine
        - label: Clinical Knowledge & Alignment Layer
          detail: LLM-as-a-Judge quality filtering, template adherence verification, and synthetic rewrite generation.
          modules:
            - Synthetic Rewrite Generator
            - LLM Quality Judge
            - Specialty Template Library
            - Hallucination Safeguards
        - label: EHR Integration & Interoperability Gateway
          detail: Connect schedule ingestion, appointment matching, and push-to-chart note transmission across external EHRs.
          modules:
            - Connect Backend Sync
            - HL7 / FHIR Gateway
            - EHR Push-to-Chart Connector
            - Developer API & Webhooks
        - label: Compliance, Trust & Security Layer
          detail: >-
            Ephemeral audio processing (audio discarded post-transcription), HIPAA/GDPR alignment, and role-based access
            control.
          modules:
            - Ephemeral Audio Purge
            - HIPAA / GDPR Compliance Guards
            - Data Encryption at Rest & Transit
            - Audit Logging
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer adoption lifecycle illustrating the progression from self-serve freemium trial to enterprise
      EHR deployment.
    approximationNotes: >-
      Adoption milestones and expansion stages synthesized from product pricing documentation, recruitment
      specifications, and health system case studies.
    claimRefs:
      - CU001
      - CU007
      - CU009
      - CU014
    data:
      items:
        - label: Freemium Discovery
          stage: Solo Clinician Trial
          touchpoints:
            - Web registration for Free tier
            - Self-serve mobile or desktop app download
            - Ambient transcription evaluation on standard note templates
          description: >-
            Individual clinicians test ambient note generation with 10 monthly Pro Actions without procurement
            oversight.
        - label: Clinician Tier Activation
          stage: Individual Paid Subscription
          touchpoints:
            - $150/month annual billing commitment
            - Unlimited note generation and custom template configuration
            - Manual note copying into practice EHR
          description: >-
            Clinicians convert to paid individual subscription to remove Pro Action limits, absorbing copy-paste
            friction.
        - label: Practice Aggregation
          stage: Multi-Clinician Practice Expansion
          touchpoints:
            - Group practice manager review
            - Centralized billing and team administrative management
            - Quote request for Practice tier
          description: Multiple clinic practitioners adopt Heidi, prompting clinic management to evaluate group licensing.
        - label: EHR Integration & Compliance
          stage: Practice Tier Provisioning
          touchpoints:
            - Business Associate Agreement execution
            - Marketplace integration with Athena, Epic, or eClinicalWorks
            - Automated push-to-chart note write-back activation
          description: Formal practice deployment unlocks EHR write-back and HIPAA BAA compliance, eliminating manual copying.
        - label: Enterprise System Procurement
          stage: Health System Enterprise Scoping
          touchpoints:
            - CIO and CMIO governance review
            - SMART on FHIR and security interconnect configuration
            - Structured multi-site pilot design (e.g. 1,000 providers)
          description: >-
            Health systems structure formal enterprise pilots with dedicated Enterprise CSMs managing multi-site
            workstreams.
        - label: Full Enterprise Deployment & Expansion
          stage: System-Wide Rollout & NRR Growth
          touchpoints:
            - Departmental training waves and competency assessments
            - Ongoing QBRs tracking clinician satisfaction and time savings
            - Multi-year renewal and expansion into additional care settings
          description: >-
            Health systems achieve full deployment across ambulatory, emergency, and specialty departments, driving
            enterprise NRR.
