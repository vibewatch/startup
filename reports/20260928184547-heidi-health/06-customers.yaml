          touchpoints:
            - "$150/month annual billing commitment"
            - "Unlimited note generation and custom template configuration"
            - "Manual note copying into practice EHR"
          description: "Clinicians convert to paid individual subscription to remove Pro Action limits, absorbing copy-paste friction."
        - label: "Practice Aggregation"
          stage: "Multi-Clinician Practice Expansion"
          touchpoints:
            - "Group practice manager review"
            - "Centralized billing and team administrative management"
            - "Quote request for Practice tier"
          description: "Multiple clinic practitioners adopt Heidi, prompting clinic management to evaluate group licensing."
        - label: "EHR Integration & Compliance"
          stage: "Practice Tier Provisioning"
          touchpoints:
            - "Business Associate Agreement execution"
            - "Marketplace integration with Athena, Epic, or eClinicalWorks"
            - "Automated push-to-chart note write-back activation"
          description: "Formal practice deployment unlocks EHR write-back and HIPAA BAA compliance, eliminating manual copying."
        - label: "Enterprise System Procurement"
          stage: "Health System Enterprise Scoping"
          touchpoints:
            - "CIO and CMIO governance review"
            - "SMART on FHIR and security interconnect configuration"
            - "Structured multi-site pilot design (e.g. 1,000 providers)"
          description: "Health systems structure formal enterprise pilots with dedicated Enterprise CSMs managing multi-site workstreams."
        - label: "Full Enterprise Deployment & Expansion"
          stage: "System-Wide Rollout & NRR Growth"
          touchpoints:
