  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Safety, and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The strongest public legal and regulatory lesson for Nimble is not that the company has a known
              enforcement action, but that the warehouse environment it wants to automate remains heavily exposed to
              worker-safety, incident-recording, and labor-policy scrutiny. OSHAs Amazon cases and the Senate HELP
              investigation show that highly automated warehouses can still accumulate ergonomic hazards,
              injury-recording disputes, and corporate-wide remediation obligations when throughput pressure outruns
              controls. Nimble also markets broad automation of picking, packing, storage, retrieval, and sorting, which
              means any future site incident would land against a broad operational surface rather than a narrow
              point-solution footprint. On top of safety, Nimbles patent trail shows a fast-expanding IP perimeter
              across grid storage, end effectors, shuttles, teleoperation, and delivery systems. That is strategically
              positive, but it also means freedom-to-operate, assignment chain, and competitive overlap diligence should
              be treated as first-order legal work before assuming the moat is clean or fully enforceable. Public
              materials do not disclose incident rates, warranty claims, or regulatory correspondence for
              Nimble-operated sites, so the legal downside is defined more by blind spots than by resolved proof. The
              policy layer is also moving. Berkeley Labor Center notes that U.S. workplace-technology rules remain
              unsettled, which increases the chance that monitoring, reporting, and worker-governance expectations
              tighten as autonomous warehouses become more common (CR045).
            claimRefs:
