      - number: '3.4'
        title: Moat Durability and Likely Entrants
        blocks:
          - type: paragraph
            body: >-
              Nimble's moat is strongest where customers value three things simultaneously: outsourced execution,
              transportation integration, and low upfront adoption friction. FedEx's 130-plus North American warehouse
              and fulfillment operations plus its 475 million annual returns stream give Nimble a distribution and
              reverse- logistics anchor that most startup peers cannot match. The problem is that this moat is
              partner-enabled rather than owned. At the same time, capital asymmetry is impossible to ignore. Symbotic
              carries a public balance sheet and multibillion-dollar market value, Ocado reports multibillion-pound
              group revenue, and Amazon discloses a robot installed base at a scale private vendors cannot approach.
              Amazon's Covariant deal matters because it shows how frontier manipulation AI can be absorbed into a
              captive network with far more data, facilities, and iteration speed than an independent startup can fund.
              Underwriting should therefore treat Nimble's moat as commercially meaningful, but contingent on partner
              durability and faster execution than larger rivals.
