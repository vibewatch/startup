      - number: '3.2'
        title: Direct Peers and Scaled Alternatives
        blocks:
          - type: paragraph
            body: >-
              Dexterity is the closest technology-level overlap because it markets production AI for manipulation, with
              100 million-plus autonomous decisions, sub-400 millisecond decision speed, and live references such as
              FedEx, Sagawa, and a GXO pilot. But Dexterity still sells workflow automation inside customer facilities,
              not a Nimble-owned outsourced fulfillment node. Symbotic is the strongest scaled benchmark because it
              combines dense storage, case handling, AI software, public-company capital access, and a backlog large
              enough to dwarf any private startup. Locus and GreyOrange are less direct on full autonomy, yet they can
              intercept budget with a much easier brownfield story: preserve the building, layer in AMRs or
              orchestration, and improve throughput without committing to a warehouse-wide redesign. Berkshire Grey
              remains relevant as an enterprise picking and sorting alternative under SoftBank ownership, while Ocado
              shows that vertically integrated fulfillment tech can operate at far greater disclosed revenue scale even
              if its grocery-heavy economics are not the same as Nimble's. Together these rivals prove Nimble is
              differentiated, but not category-alone.
