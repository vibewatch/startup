      - number: '6.3'
        title: Retention, Durability, and Missing Data
        blocks:
          - type: paragraph
            body: >-
              Public durability proof is materially weaker than adoption proof. No reviewed source discloses NRR, GRR,
              logo churn, renewal rate, average contract term, or post-2024 customer-count updates, and no source
              surfaces per-customer revenue or seat count data either (CU029, CU030, CU036). In practical terms, that
              means the public record can answer whether Nimble can win early customers but not whether those customers
              deepen usage, renew, or drive concentrated revenue risk. Some indirect signals are positive: the homepage
              claims a pilot structure with no-penalty outs and elastic task-based pricing, which can reduce switching
              friction at the start and support gradual expansion (CU012, CU013). But those same commercial features do
              not tell us whether customers remain after the pilot, whether they consolidate volumes into Nimble over
              time, or whether a single relationship like FedEx dominates future demand (CU029, CU030). The strongest
              retention-adjacent conclusion available today is therefore negative rather than positive: the company has
              not yet published the metrics that would let an outside investor validate customer durability with
              confidence (CU029, CU036).
