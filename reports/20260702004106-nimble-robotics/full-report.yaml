  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Nimble’s public revenue model is clearest at the product-layer level, not in a detailed price book. The
              homepage frames the offer as robotic fulfillment, transportation, and AI cloud logistics, then explicitly
              says customers pay only for tasks performed and do not carry overhead or fixed costs. That suggests a
              service-led model rather than a license-first robotics sale. Supporting sources from the Series B
              announcement, the New Jersey node release, and TechCrunch’s 2023 coverage reinforce the same picture:
              Nimble is building a robotic 3PL network that sells fulfillment outcomes, low-friction onboarding, and
              national reach instead of asking brands to buy and integrate large fixed automation systems themselves.
              The open problem is realization. No public source in the retained pack discloses a per-order rate card,
              contract minimums, transportation take rate, or realized margin after labor, warehouse, maintenance, and
              support costs. The company’s strongest economic claims — up to 40% logistics savings, up to 75% smaller
              warehouses, and 96%+ population coverage in one to two days — are useful as commercial signals, but they
              are still company claims rather than audited revenue-quality evidence.
