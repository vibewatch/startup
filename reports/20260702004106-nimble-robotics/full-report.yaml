      - number: '6.5'
        title: Adoption Risks and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence does not say customers are failing, but it does show why scaling customer adoption
              could be harder than winning the first logo. BCG says many warehouse automation pilots never scale or miss
              ROI, and PeakLogix argues that most logistics transformation projects underdeliver because of poor
              integration, weak training, and lack of ongoing optimization (CU024, CU025). VOA's reporting on
              port-worker resistance demonstrates that automation remains politically and socially contested, which
              matters because large warehouse customers still need to manage labor acceptance and process change even
              when the business case is attractive (CU026). The OSHA actions against Amazon make the risk more concrete:
              ergonomics and worker safety remain live regulatory issues for automated warehouse networks, which means
              customers will care not just about labor savings but about whether a vendor can operate safely at scale
              (CU027, CU028). For Nimble specifically, the main adoption risk is therefore not absence of interest; it
              is that the public record still leaves too much of the post-go-live story unmeasured. Buyers can see why
              the offer is attractive, but outsiders cannot yet see enough about durability, safety outcomes, or
              large-scale system performance to know how sticky the customer base will be (CU024, CU025, CU028, CU036).
            claimRefs:
