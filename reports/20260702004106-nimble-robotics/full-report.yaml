      - number: '2.2'
        title: Buyer Segments, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The most natural buyers are not generic warehouses; they are brands and partners with volatile parcel
              demand, costly labor exposure, and service-level pressure. Nimble’s own positioning and FedEx’s commercial
              framing both point toward e-commerce and omnichannel brands that care about launch speed, node reach, and
              lower all-in logistics cost more than about owning robotics assets. In smaller and mid-market accounts,
              the day-one user is likely the fulfillment or operations team, but the budget owner can be pulled up to
              the COO, supply-chain lead, or finance owner because the decision changes network design, service levels,
              and transportation cost at once. That buyer map matters because Nimble can sometimes avoid a classic
              robotics CapEx committee by presenting as outsourced capacity with no fixed costs and pilot-style entry.
              Yet that does not eliminate proof requirements. Larger accounts will still underwrite integration burden,
              service resilience, and transportation fit, while strategic partners such as FedEx evaluate whether Nimble
              expands network reach and returns capability rather than simply replacing labor with robots.
