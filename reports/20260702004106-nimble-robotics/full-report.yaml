  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Logic
        blocks:
          - type: paragraph
            body: >-
              The biggest underwriting mistake would be to call Nimble a simple beneficiary of a giant warehouse
              automation TAM and stop there. The company is not selling generic warehouse hardware; it is packaging
              autonomous fulfillment capacity, multi-node placement logic, carrier optimization, and outsourced
              operations into one managed service. That means the broad $34.17 billion global warehouse automation
              market is only a directional ceiling, not the real addressable field. A closer operating lens is Mordor’s
              $13.45 billion North America e-commerce warehouse market, because that frame at least captures
              fulfillment-center economics, value-added services, and automation levels inside the same buildings Nimble
              wants to power. But even that is too wide, because it includes manual and semi-automated spend that Nimble
              does not automatically capture. The narrowest relevant lens is robotic picking, where Interact’s 2023
              revenue base was only $303 million. The right conclusion is not that one number is true and the others are
              wrong; it is that Nimble’s practical market lives between those layers, and any market case that smooths
              them into a single clean TAM hides the real adoption and scope risk.
