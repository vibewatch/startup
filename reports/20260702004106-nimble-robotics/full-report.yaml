  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Nimble is no longer best understood as a single robotic arm vendor. Its public materials describe a
              bundled fulfillment system made of autonomous robotic fulfillment centers, a transportation layer, and an
              AI Cloud Logistics platform that manages orders, inventory, and routing end to end (CE001, CE005). That
              bundle is sold as a service with no upfront investment, elastic volume control, and fast onboarding rather
              than as a bespoke capital project (CE003, CE016). The physical core is a general-purpose warehouse robot
              that Nimble says can store, retrieve, pick, pack, sort, kit, and otherwise handle millions of items across
              a very broad SKU base (CE002, CE004). The module set is broader than the robot itself: Nimble also markets
              robotic value-added services, dynamic inventory slotting, carrier selection, closed-access storage,
              automated cycle counts, and a multi-node network that is meant to give customers low-cost two-day coverage
              without building their own sites (CE005, CE014, CE015). The resulting module map is differentiated because
              Nimble packages robotics, software, and 3PL operations as one offer, but much of the quantified value
              proposition still comes directly from Nimble-authored materials rather than third-party benchmarking
              (CE012, CE013, CE032).
