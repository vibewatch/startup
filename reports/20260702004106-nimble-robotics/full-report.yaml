      - number: '3.5'
        title: Adverse Evidence and Failure Modes
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is less about a single competitor beating Nimble feature-for-feature and more about
              the category's execution physics. Grocery Dive's reporting on Kroger's Ocado retrenchment shows how a
              highly automated network can miss utilization benchmarks badly enough to trigger closures and
              multibillion-dollar charges. BetaKit's account of Attabotics' July 2025 shutdown shows the financing side
              of the same problem: differentiated automation technology still fails if project timing, cash conversion,
              and working capital break. Interact Analysis and transaction-market updates reinforce the backdrop.
              Short-term demand has tilted toward brownfield and targeted projects, customers have recently preferred
              CapEx over RaaS in robotic picking, and interest-rate plus tariff uncertainty can delay large commitments.
              Even Locus, one of the more established AMR vendors, acknowledged a targeted reduction in force during a
              slower post-COVID demand reset. For Nimble, the message is clear: technical differentiation is necessary,
              but utilization, sales efficiency, partner governance, and financing resilience decide whether the moat
              compounds or cracks.
