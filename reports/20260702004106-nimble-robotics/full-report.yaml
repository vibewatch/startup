  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Nimble's real competitive set is narrower than a generic list of warehouse-robotics vendors but broader
              than a pure piece-picking comparison. The company now sells outsourced autonomous fulfillment capacity
              through its own robotic 3PL model, so buyers can compare it against direct AI-manipulation vendors such as
              Dexterity, scaled automation platforms such as Symbotic and Ocado, flexible brownfield substitutes such as
              Locus and GreyOrange, and the status quo of manual labor plus internal build. FedEx's alliance matters
              because it turns Nimble's offer into more than a robot sale: it combines warehouse automation,
              transportation access, and returns infrastructure in one buying motion. That wedge is different from
              customer-site deployments, but it is not unmatched on every buying criterion. Symbotic dominates on public
              scale, Amazon dominates on installed robot base and learning surface, and brownfield AMR or orchestration
              vendors often offer a lower-disruption path for operators that are not ready to outsource the node itself.
