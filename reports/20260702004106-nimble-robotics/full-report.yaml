      - number: '5.3'
        title: Deployment, Integration, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Deployment evidence suggests Nimble has real operating history but an incomplete public roadmap. The early
              proof points were integration speed and production usage: 2021 sources say Nimble could be picking in
              production on day one without WMS code changes, and that production robots were already handling more than
              100,000 items per day (CE006, CE008). By March 2023 Nimble had shifted the commercial model toward a
              nationwide robotic 3PL network that claimed 96%+ U.S. population coverage in one to two days and a 75%
              reduction in warehouse space (CE009, CE013). TechCrunch still reported only between one and ten facilities
              and acknowledged manual operations remained, which means the network thesis was materially ahead of full
              technical closure at that point (CE022). The 2024 New Jersey launch is the clearest proof of node-by-node
              expansion, showing a live East Coast facility serving multiple product categories, while the FedEx-led
              Series C explicitly tied new capital to robot manufacturing, system deployments, and more R&D (CE014,
              CE019, CE036). That combination makes the roadmap legible: more nodes, more deployments, more
              manufacturing scale. What it does not yet provide is a current 2026 public inventory of launched nodes,
              public uptime, or independent confirmation that robotic sortation and fully lights-out operations have
              shipped beyond the company's own statements (CE021, CE035).
