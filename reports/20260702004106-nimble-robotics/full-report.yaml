      - number: '6.4'
        title: Expansion and Channel Leverage
        blocks:
          - type: paragraph
            body: >-
              FedEx changes the shape of Nimble's customer story because it is more than a simple reference account.
              Supply Chain Dive says FedEx Fulfillment is built to serve ecommerce and inventory-management needs for
              SMB merchants, which means the alliance potentially gives Nimble access to customer acquisition leverage
              beyond direct brand sales (CU033). Combined with Nimble's own ecommerce integrations, the emerging
              go-to-market motion looks like a hybrid: direct selling to brands, plus channel distribution through a
              large logistics platform (CU014, CU034). The public evidence also suggests Nimble has learned to make the
              first step easy. The pilot program, no-penalty out clause, on-demand pricing, and rapid onboarding
              narrative all reduce the cost of customer experimentation (CU012, CU013, CU014). Where the expansion story
              becomes less clear is in cross-vertical depth. Outside of FedEx, the visible proof remains concentrated in
              consumer-oriented categories, and many logos are still company-authored rather than customer-authored
              (CU019, CU032). That means the best current expansion evidence is structural rather than statistical: the
              motion looks scalable, but published win-rate, expansion-rate, and post-launch volume data are still
              missing (CU030, CU036). FedEx's own fulfillment page further supports the channel view by showing that the
              partner already sells outsourced ecommerce fulfillment as a merchant service, which makes Nimble more than
              a back-end robot vendor inside the relationship (CU037). Independent warehouse and fulfillment statistics
              also reinforce that the addressable customer pool remains active because merchants still face labor,
              service-level, and throughput pressure that favors outsourced automation-backed fulfillment options
              (CU038, CU039).
