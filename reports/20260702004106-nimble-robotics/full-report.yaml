  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Nimble now presents itself less as a component robotics vendor and more as an outsourced autonomous
              fulfillment platform. Its current homepage promises AI-powered robots that can autonomously fulfill
              ecommerce orders, then layers that fulfillment offer with transportation optimization and an AI
              cloud-logistics control layer. That is a materially different framing from a narrow robotic arm or
              retrofit-automation story: the customer is buying a service outcome, node access, and logistics
              orchestration, not simply a robot cell. The strongest corroboration comes from FedEx and TechCrunch, both
              of which describe Nimble as part of a fully autonomous 3PL or fulfillment-network model rather than only a
              warehouse retrofit tool. Public evidence also places the company in late-stage private-company territory:
              it is founder-led, still narrative-heavy, but already backed by a strategic logistics incumbent and
              selling a broad operating model that depends on warehouses, robots, software, and carrier coordination
              together.
