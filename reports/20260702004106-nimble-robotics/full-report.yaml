      - number: '1.2'
        title: Founder, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The public identity of Nimble is tightly tied to founder and CEO Simon Kalouche. Multiple first-party and
              third-party sources identify him as the founder and chief executive, and the available biography is
              unusually specific for a private robotics founder: Ohio State mechanical engineering in 2014, Carnegie
              Mellon robotics in 2016, then Stanford doctoral work paused to start the company. That background fits the
              company’s product claim unusually well because Nimble’s pitch depends on general-purpose manipulation, end
              effectors, storage-and-retrieval architecture, and practical warehouse deployment rather than pure
              software. Governance disclosure is thinner than founder disclosure, but the board roster that is visible
              is impressive: Fei-Fei Li and Sebastian Thrun joined with the 2021 Series A, and Marc Raibert joined in
              2023. Those names provide real technical and reputational cover. What is still missing is the broader
              governance bench: no public source in the reviewed pack provides a fuller board roster, finance leadership
              map, or committee structure, so key-person concentration around Kalouche remains material.
