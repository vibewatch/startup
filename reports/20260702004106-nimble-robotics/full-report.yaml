      - number: '5.2'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The architecture story has two important eras. In 2021, Nimble was still describing itself primarily as a
              robotic picking system that could drop into customer environments, integrate with existing WMS/WCS stacks
              without code changes, and use human-in-the-loop supervision to keep production reliable from day one
              (CE006, CE007, CE008). By 2023 and 2024, the company had expanded that architecture into a full operating
              model: Nimble-operated warehouses, a Cloud Logistics Platform that consolidates WMS, OMS, TMS, IMS, and
              RMS functions, and a transportation layer that selects carriers and inventory placement across nodes
              (CE009, CE011, CE015, CE034). Practitioner commentary adds detail absent from the marketing copy. Jonathan
              Briggs says Nimble became its own first client, redesigned warehouses around a vertical model, and
              eliminated pickers as a function of the building using six-axis robots and ongoing development in robotic
              sortation (CE020, CE021). The net effect is a product architecture that now spans hardware, control
              software, facility design, and outsourced operations. What remains unclear is exactly how much of that
              stack is fully autonomous versus still partially manual, because TechCrunch and the podcast both indicate
              that some functions remain unfinished or still require human handling even though piece-picking is
              automated (CE022, CE035).
