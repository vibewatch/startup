      - number: '7.4'
        title: Execution, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to rank the downside, but not strong enough to retire it. The critical
              unanswered items are specific and measurable: how many nodes are live today, what utilization and uptime
              they are running at, how customer concentration is distributed, what service-level penalties or warranty
              obligations exist, what field-maintenance burden looks like, and how much additional capital Nimble will
              need before the current network and FedEx relationship mature into durable cash generation. Investors
              should also insist on a clean freedom-to-operate review, because the patent footprint is expanding quickly
              around core picking and storage workflows. The practical thesis-break events are likewise concrete: a
              visible FedEx rollout miss, disclosed customer attrition or underutilized sites, a safety or regulatory
              incident at a Nimble-operated node, or a financing event that resets the valuation below the 2024 unicorn
              mark. Until those signals are cleared, the right posture is not to dismiss Nimble, but to force evidence
              on the variables that actually determine whether an autonomous 3PL model is durable or merely impressive
              in demo form.
