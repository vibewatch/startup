  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              The visible customer base clusters around ecommerce brands and the operators that serve them. Nimble sells
              robotic fulfillment as an outsourced service rather than as customer-owned infrastructure, which means the
              buyer is typically a brand operations or supply-chain owner, the daily user is the operations team running
              orders through Nimble nodes, and the payer is the merchant or enterprise outsourcing fulfillment (CU001,
              CU004). Public customer segmentation is strongest in consumer-oriented categories. Nimble and independent
              coverage explicitly name apparel, footwear, health and beauty, electronics, consumer packaged goods,
              general merchandise, and pharmaceuticals (CU015, CU016). The clearest production-style brand story is TA3
              SWIM, while the clearest enterprise-scale relationship is FedEx. Beyond those, the company highlights
              additional DTC story titles and several recognizable retail logos, but the evidence gets shallower fast:
              many accounts are named without contract, usage-depth, or outcome disclosure (CU017, CU018, CU019). The
              homepage claim of 15 customers with more than $100 million in sales suggests the company has penetrated
              meaningful brand scale, but because the statement is unaudited and unsegmented, it does not reveal how
              much revenue comes from each cohort or whether those customers are concentrated in one vertical (CU002,
              CU030, CU032).
