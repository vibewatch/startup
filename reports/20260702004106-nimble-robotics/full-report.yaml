              - CE037
      - number: '5.5'
        title: Trust, Safety, Compliance, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              The technical-risk picture is shaped as much by what Nimble does not publish as by what it does. The
              company does disclose operational controls such as robot redundancy, no-single-point-of-failure design,
              24/7 operation, closed-access storage, automated cycle counts, and all-electric hardware (CE017, CE018,
              CE033). Those are useful signals, but they are not substitutes for independent uptime, pick-accuracy,
              security, or safety evidence. No reviewed source surfaced public SOC 2, ISO, warehouse safety, or security
              certification documents for Nimble itself, and no independent source surfaced a public benchmark for
              uptime or cost-per-order claims (CE028, CE033). The broader operating environment makes those omissions
              more important. OSHA's ongoing interventions at Amazon show that warehouse automation still attracts live
              ergonomic and safety scrutiny, while BCG shows many automation programs fail when network design or
              integration assumptions break down (CE030, CE031). Nimble's strongest risk therefore is not that the robot
              concept is fictional; it is that the company is asking buyers to trust a highly integrated autonomy stack
              without publishing the operating and compliance evidence that would let an outsider distinguish mature,
              repeatable execution from very strong marketing (CE030, CE031, CE036). Additional external governance
              signals deepen that caution. OSHAs warehousing overview and standards pages make clear that robotic
              warehouses still carry live compliance obligations around material handling, equipment, and worksite
              safety, while LegalClarity highlights the penalty exposure that can follow weak controls (CE038, CE039,
              CE040). Brookings and George Mason further argue that automation can redistribute rather than eliminate
              worker risk, especially in exception handling and maintenance tasks, which matters for Nimble because its
              public materials emphasize autonomy but do not publish operating metrics that would prove safety maturity
              at scale (CE041, CE042).
