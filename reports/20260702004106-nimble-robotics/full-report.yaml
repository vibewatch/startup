      - number: '1.3'
        title: Capital, Stakeholders, and Commercial Proof
        blocks:
          - type: paragraph
            body: >-
              Nimble’s financing history is unusually clean for a private warehouse-robotics company. The Series A in
              March 2021 raised $50 million and added Fei-Fei Li and Sebastian Thrun to the board. The Series B in March
              2023 raised $65 million led by Cedar Pine and formally pushed the company toward a nationwide autonomous
              3PL model. The most important inflection arrived in September and October 2024, when FedEx first announced
              a strategic alliance and investment and then Nimble announced a $106 million Series C at a $1.0 billion
              valuation led by FedEx and co-led by Cedar Pine. Secondary databases cluster around about $221 million of
              disclosed venture funding, with Tracxn also surfacing a small 2018 grant, which is directionally
              consistent with the round chronology. Commercial proof is not purely financial. Public sources point to
              named brand relationships, a new New Jersey node, a TA3 SWIM launch measured in weeks, and repeated
              company claims that Nimble has already handled millions of items across multiple categories.
