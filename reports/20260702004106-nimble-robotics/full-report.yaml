      - number: '2.3'
        title: Growth Drivers and Why the Market Still Moves
        blocks:
          - type: paragraph
            body: >-
              The market is still worth caring about because the underlying drivers have not gone away. Labor scarcity,
              wage pressure, and turnover remain strong enough that warehouse operators continue to look for substitutes
              even after the pandemic spike cooled. BCG’s ROI work is especially useful because it links automation not
              only to labor savings but also to network redesign, inventory placement, and downstream transportation
              benefits, which is closer to Nimble’s value proposition than a robot-only ROI pitch. Returns are another
              major driver: FedEx’s 475 million annual returns stream and Mordor’s forecast that returns processing is
              the fastest-growing broad automation application show why reverse logistics can matter as much as outbound
              fulfillment. At the same time, faster-delivery expectations make distributed nodes and intelligent
              inventory placement strategically valuable, especially for DTC brands. That supports Nimble’s multi-node
              story. The market tailwind is therefore real, but it favors solutions that improve service and flexibility
              alongside labor productivity, not just highly capitalized hardware projects that optimize one warehouse in
              isolation.
