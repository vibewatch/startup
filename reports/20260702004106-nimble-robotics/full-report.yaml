      - number: '3.3'
        title: Pricing, Packaging, and Switching
        blocks:
          - type: paragraph
            body: >-
              Pricing is one of the weakest public records across the category. Nimble's current site emphasizes no
              fixed costs, pay-for-work economics, fast onboarding, and multi-node scaling, while Locus emphasizes
              flexible automation that can expand gradually and Symbotic, Dexterity, GreyOrange, Berkshire Grey, and
              Ocado all market custom enterprise outcomes rather than transparent rate cards. That means the real buyer
              comparison is less about list price and more about which cost bucket is being moved: Nimble shifts the
              discussion toward service economics and outsourced fulfillment; Symbotic and Ocado lean toward large
              integrated system commitments; Dexterity sells targeted workflow automation; and Locus or GreyOrange can
              be layered into existing sites with less disruption. Switching costs appear after go-live through WMS or
              orchestration hooks, inventory-placement logic, facility process redesign, SLA commitments, and training.
              Those barriers help retention, but they also raise the proof burden for Nimble's first deployment inside
              any new customer cohort.
