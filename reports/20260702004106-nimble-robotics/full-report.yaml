      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: FedEx is the strongest customer proof by far
            body: >-
              The FedEx alliance upgrades Nimble from an interesting DTC automation vendor into a company that at least
              one large logistics incumbent is willing to fund and operationalize.
