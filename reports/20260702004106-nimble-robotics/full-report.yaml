companyProfile:
  summary: >-
    Nimble Robotics, now branded publicly as Nimble, is a San Francisco warehouse-automation company that combines
    general-purpose warehouse robots, Nimble-operated fulfillment centers, transportation orchestration, and a cloud
    logistics platform into a robotic 3PL offer. The company targets ecommerce brands, retailers, and platform operators
    that want faster fulfillment, broader SKU handling, and lower labor intensity without building their own automation
    stack. Public evidence supports real production deployments, a strategic FedEx partnership, and a growing patent
    estate, but still leaves revenue, margins, customer concentration, and live-node economics materially
    underdisclosed.
