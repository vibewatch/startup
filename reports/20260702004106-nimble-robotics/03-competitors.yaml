- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / class
  - Contract model signal
  - What is included
  - Public price disclosure
  - Buyer implication
  rows:
  - - Nimble
    - Pay-for-work, no fixed costs, fast onboarding, outsourced node model
    - Robotics, fulfillment execution, cloud logistics, transportation optimization
    - No standard public list rate
    - Lowers adoption friction, but shifts diligence toward service margin and SLA economics
  - - Symbotic
    - Large multi-year system and software agreements
    - Dense storage, robotics, AI software, development work
    - No standard public list rate
    - Best fit for buyers willing to fund long deployments and large facilities
  - - Dexterity
    - Workflow-level enterprise project or pilot model
    - Robotic cells and AI inside the customer's own site
    - No standard public list rate
    - Easier to justify on targeted ROI than on full outsourced fulfillment
  - - Locus Robotics
    - Flexible automation expansion and RaaS-style operating model
    - AMRs, orchestration, labor-productivity lift inside existing sites
    - No standard public list rate
    - Attractive where buyers want incremental adoption without a rebuild
  - - GreyOrange / Berkshire Grey
    - Custom enterprise contracts around orchestration or task automation
    - Mixed-fleet software, robotic workflows, or packaged fulfillment tasks
    - No standard public list rate
    - Lets buyers solve narrower workflow pain without adopting Nimble's service wrapper
  - - Ocado / Amazon-style large-platform alternative
    - Large system or captive-network economics
    - Fulfillment automation at platform scale
    - No merchant-facing public list rate
    - Raises the benchmark on throughput and learning speed, but with much heavier integration burden
  notes: >-
    Public sources reviewed for this chapter describe packaging, deployment shape, and strategic direction much
    more clearly than they disclose realized price per order, robot, site, or SLA clause. Unknown or opaque pricing
    is a market feature, not a missing row.
  claimRefs: [CP005, CP006, CP016, CP020, CP040, CP045, CP046]
- id: TP004
  title: Distribution and switching-cost table
  columns:
  - Lever
  - Nimble evidence
  - Closest alternative
  - Why it matters
  - Leakage / limitation
  rows:
  - - Carrier and returns network access
    - FedEx alliance linked to 130+ warehouse operations and 475M annual returns
    - Symbotic retail embed or Amazon internal network
    - Speeds nationwide SLA coverage and customer acquisition
    - Partner-dependent rather than owned by Nimble
  - - Onboarding speed and low upfront cost
    - Onboard in days; no fixed costs; pay only for tasks performed
    - Locus-style flexible brownfield automation
    - Lowers first-deployment friction for mid-market brands
    - Service economics can compress vendor margin if utilization disappoints
  - - Cloud workflow breadth
    - WMS, OMS, TMS, IMS, and RMS in one platform
    - GreyOrange orchestration or Ocado platform stack
    - Owns operational logic above the robot itself
    - Public sources do not show realized attach rates or module-by-module retention
  - - Node ownership and outsourced execution
    - Nimble runs robotic fulfillment nodes rather than only selling hardware
    - Ocado partner CFCs and Amazon captive nodes
    - Creates operating data loop and SLA control
    - Requires more capital and operational discipline than pure software
  - - Manipulation-AI learning loop
    - Nimble cites millions of items handled; the category's best rivals cite massive learning surfaces too
    - Dexterity and Amazon/Covariant
    - Data and edge-case learning can compound model quality
    - Public evidence remains marketing-heavy and not directly benchmarked
  - - Post-go-live process lock-in
    - Software hooks, inventory-positioning logic, SLAs, and retraining persist after deployment
    - Any major stack once embedded
    - Raises retention and multi-year value
    - The same complexity can lengthen initial sales cycles
  notes: >-
    This table focuses on practical switching and distribution levers rather than broad product claims. Several
    items are mechanism-level interpretations from retained evidence, so the limitation column is essential.
  claimRefs: [CP003, CP005, CP030, CP041, CP042, CP046, CP048]
- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat / adverse evidence
  - Severity
  - Source-backed rationale
  - Mitigation / diligence ask
  rows:
  - - FedEx distribution moat
    - Partnership concentration
    - High
    - The clearest network edge is partner-enabled rather than owned
    - Review exclusivity, termination, economics without FedEx, and expansion rights
  - - Autonomous 3PL uniqueness
    - Symbotic, Ocado, and Amazon can bundle automation at much larger scale
    - High
    - Public scale and capital asymmetry can narrow a startup's commercial window
    - Isolate the segment where outsourced mid-market fulfillment wins despite smaller scale
  - - Manipulation-AI lead
    - Dexterity is live in production and Amazon absorbed Covariant talent and models
    - High
    - Direct overlap exists on high-variance picking and handling intelligence
    - Request picking error-rate trend, retraining cadence, and edge-case resolution data
  - - Service model lowers adoption friction
    - Public demand has recently preferred CapEx in robotic picking and macro headwinds can stretch service margins
    - Medium
    - Market updates show slower commitments and pricing-model sensitivity
    - Request gross margin by node, minimum-volume terms, and contract duration by cohort
  - - Category tailwinds guarantee success
    - Ocado/Kroger closures and Attabotics insolvency show utilization and financing failures
    - High
    - Differentiated automation assets can still fail if volume or working capital misses plan
    - Diligence utilization by site, cash conversion, debt covenants, and funding runway
  - - Brownfield resistance is temporary
    - Short-term demand still favors targeted retrofits and modular systems
    - Medium
    - Operators can defer warehouse-wide redesign by buying narrower substitutes first
    - Show Nimble's conversion funnel from lighter automation to outsourced-node adoption
  - - Pricing opacity is harmless
    - No major comparator publishes standard list pricing or public SLA penalties
    - Medium
    - Opaque pricing lengthens ROI proof cycles and weakens clean win-loss comparison
    - Obtain realized payback, SLA-credit exposure, and customer churn disclosure under NDA
  notes: >-
    Severity is an analyst judgment synthesized from retained sources rather than a statistical score. The register is
    meant to surface where Nimble's moat could fail commercially even if the underlying robotics work.
  claimRefs: [CP017, CP021, CP028, CP029, CP035, CP039, CP042, CP043, CP044, CP049]
figures:
- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: standard
  summary: >-
    The map uses ordinal scores to show that Nimble sits unusually far to the right on outsourced end-to-end scope,
    but not at the top on disclosed channel and deployment power.
  data:
    xAxis: Outsourced end-to-end scope (1=single workflow tool, 10=outsourced autonomous fulfillment node)
    yAxis: Distribution and deployment power (1=niche or opaque, 10=public scale plus partner/channel leverage)
    points:
    - label: Nimble
      x: 9
      y: 7
    - label: Symbotic
      x: 7
      y: 10
    - label: Dexterity
      x: 4
      y: 6
    - label: Locus Robotics
      x: 5
      y: 7
    - label: GreyOrange
      x: 6
      y: 6
    - label: Ocado
      x: 8
      y: 8
    - label: Amazon Robotics / Covariant
      x: 10
      y: 10
    - label: Status quo / internal build
      x: 2
      y: 5
  approximationNotes: >-
    Scores are evidence-backed ordinal judgments synthesized from workflow scope, network access, public scale,
    and deployment signals in retained sources. They are not measured market-share coordinates.
  claimRefs: [CP030, CP031, CP032, CP033, CP034, CP035, CP036, CP038, CP043]
- id: FP002
  title: Moat / readiness KPI snapshot
  type: kpi
  layout: compact
  summary: Compact summary of which competitive pressures matter most to Nimble's durability.
  data:
    items:
    - label: Strongest scaled benchmark
      value: Symbotic
      note: Public revenue, backlog, and capital access make it the hardest scale benchmark for any private entrant.
    - label: Closest direct workflow overlap
      value: Dexterity
      note: The manipulation stack is the clearest like-for-like technology threat even without Nimble's outsourced node model.
    - label: Lowest-friction substitute
      value: Locus / brownfield AMRs
      note: Buyers can improve labor productivity without outsourcing the facility or rebuilding the node.
    - label: Biggest software-layer threat
      value: GreyOrange orchestration
      note: Vendor-agnostic workflow control can reduce the value of any one robot stack.
    - label: Most important moat
      value: FedEx-enabled network access
      note: Transportation and returns infrastructure make Nimble more than a robotics vendor when the alliance is durable.
    - label: Biggest underwriting gap
      value: Realized unit economics
      note: Public sources still do not show per-order pricing, SLA penalties, retention, or node-level margin by cohort.
  approximationNotes: >-
    Values are qualitative summaries from retained sources rather than a weighted scoring model.
  claimRefs: [CP042, CP043, CP045, CP046, CP049]
