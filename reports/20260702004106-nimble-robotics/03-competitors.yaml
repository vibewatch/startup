  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Public sources do not disclose realized per-order rates, robot-service pricing, SLA penalty schedules, or signed commercial terms for Nimble or most competitors.
    whyItMatters: Without realized commercial terms, it is difficult to compare Nimble's service economics against capital-light substitutes or large-system integrators on an apples-to-apples basis.
    diligencePath: Request anonymized customer pricing grids, SLA schedules, and win-loss comparisons under NDA from Nimble management and cross-check them against customer references.
    relatedQuestionRefs: [QP022, QP028]
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-census
    missingEvidence: The public source pack does not support an exhaustive census of every regional integrator, robotic picker startup, or warehouse-execution vendor that could appear in a buyer short list.
    whyItMatters: The landscape is directionally sufficient for underwriting the main competitive threats, but not complete enough to support claims of total category share or universal ranking.
    diligencePath: Build an RFP-derived competitor list from recent Nimble deals, then expand with analyst databases and distributor or integrator channel interviews.
    relatedQuestionRefs: [QP003]
    relatedTableRefs: [TP001]
  - type: private-evidence-only
    severity: material
    topic: nimble-unit-economics
    missingEvidence: Public sources do not show node-level gross margin, customer retention, SLA misses, or cohort utilization for Nimble's outsourced fulfillment model.
    whyItMatters: Those operating metrics determine whether Nimble's moat compounds through service quality and scale or breaks under capital intensity and partner concentration.
    diligencePath: Ask for cohort economics by node and customer vintage, including gross margin, utilization, onboarding payback, churn, and SLA-credit history.
    relatedQuestionRefs: [QP025, QP028]
