  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: Independent benchmarks for pick accuracy, uptime, throughput per robot, and cost per order.
    whyItMatters: Without public benchmarks it is difficult to separate true technical lead from strong marketing and partner
      enthusiasm.
    diligencePath: Request customer-level KPI dashboards, uptime logs, and any third-party performance audits during diligence.
    relatedQuestionRefs:
    - QE017
    - QE023
    relatedTableRefs:
    - TE002
    - TE004
  - type: missing-source
    severity: material
    topic: compliance-gap
    missingEvidence: Public trust artifacts such as SOC 2, ISO, safety certifications, or formal security / trust documentation
      for Nimble itself.
    whyItMatters: Enterprise customers will likely require more than patent and redundancy claims before trusting a robotics
      stack operating in live warehouses.
    diligencePath: Ask for the security, safety, and compliance packet used in enterprise procurement and validate it against
      current operating sites.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: stale
    severity: material
    topic: node-footprint
    missingEvidence: A current 2026 public list of launched versus planned fulfillment nodes and evidence that robotic sortation
      is live outside roadmap commentary.
    whyItMatters: The network thesis is central to the product promise, so outdated node disclosures leave a material gap
      in operational maturity.
    diligencePath: Verify each node, go-live date, and capability set directly with Nimble and with any public customer or
      partner references.
    relatedQuestionRefs:
    - QE009
    - QE010
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: minor
    topic: manufacturing-scale
    missingEvidence: Manufacturing yield, field failure rates, and service-maintenance data for Nimble's robot fleet.
    whyItMatters: The main remaining execution risk after FedEx is not concept validity but repeatable deployment and service
      quality at scale.
    diligencePath: Request internal manufacturing and field-service KPIs for the current installed base.
