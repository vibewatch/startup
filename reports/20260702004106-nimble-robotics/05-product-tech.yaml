- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / pain point
  - Nimble solution
  - Measurable benefit
  - Limitation
  rows:
  - - Brand needing 2-day e-commerce fulfillment
    - Manual or legacy 3PL operations with labor constraints and slow onboarding
    - Robotic fulfillment center plus transportation orchestration under one contract
    - Company claims same-day cutoff, 1-2 day reach, and onboarding in days
    - No independent audit of those service levels
  - - Retailer using existing goods-to-person infrastructure
    - Manual piece-picking remains the labor bottleneck even in automated buildings
    - Early Nimble robot drops into goods-to-person, put-wall sorting, and induction flows
    - 2021 sources say integration could happen in one day with no WMS code changes
    - That original model has since been deemphasized in favor of Nimble-run nodes
  - - Customer with peak demand swings
    - Headcount and fixed-capacity problems around sales spikes
    - On-demand robots and pilot/no-penalty-out commercial model
    - Volume can be flexed up or down without capex, per homepage materials
    - No public data on actual peak-season conversion, cost, or margin effect
  - - Enterprise network seeking turnkey automation
    - Patchwork automation requires many vendors and integrators
    - Nimble claims one end-to-end system replacing more than a dozen components
    - Company says this can cut cost by as much as 70%
    - Cost claim is company-authored and not independently benchmarked
  - - FedEx-scale operator adding autonomous fulfillment
    - Need to streamline returns and North American fulfillment operations
    - Use Nimble technology and fully autonomous 3PL model inside broader network
    - FedEx investment and commercial agreement show enterprise willingness to test the system
    - Scope, deployment timeline, and measured operational impact remain undisclosed
  notes: Benefits shown here are what Nimble or quoted partners claim publicly; independent measurement is strongest for production
    existence and weakest for cost, throughput, and uptime.
