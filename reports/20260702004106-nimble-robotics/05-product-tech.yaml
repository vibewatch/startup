  rows:
  - - General-purpose warehouse robot
    - Warehouse operations team / Nimble ops
    - Live in production; central product claim since 2021
    - One robot family is marketed as capable of storage, retrieval, picking, packing, sorting, and kitting
    - No independent public benchmark for pick accuracy, throughput, or uptime
  - - Cloud Logistics Platform
    - Brand operations / supply-chain manager
    - Live in 2024 company architecture narrative
    - Unifies WMS, OMS, TMS, IMS, and RMS under one orchestration layer
    - No public API or architecture documentation beyond company descriptions
  - - Transportation + carrier network
    - Brand logistics lead
    - Live service layer
    - Optimizes last-mile carrier choice and multi-node inventory placement as part of one contract
    - Carrier economics and SLA methodology are not independently described
  - - Multi-node robotic fulfillment centers
    - Brands outsourcing fulfillment
    - Live but current 2026 node count is undisclosed
    - Robotic 3PL lets customers buy automation as a service instead of capex
    - Public list of launched versus planned nodes is stale
  - - Robotic VAS + dynamic slotting
    - Nimble warehouse operations
    - Homepage-featured; detail light
    - Expands value beyond simple piece-picking into warehouse optimization tasks
    - No operational metrics for VAS attach rate or slotting effectiveness
  - - Pilot / no-penalty-out onboarding model
    - Prospective brand customer
    - Live commercial wrapper
    - Reduces buyer risk and matches outsourced-service positioning
    - No published conversion rate from pilot to scaled program
  - - Patent portfolio
    - Investors / strategic partners / procurement teams
    - Active and growing through 2026 filings
    - Protects picking, storage, end effectors, and fulfillment-center systems
    - Portfolio breadth is visible; commercial enforceability is unknown
  - - Board + research pedigree
    - Customers evaluating vendor durability
    - Mature strategic asset
    - Founder and board depth in AI/robotics is unusually strong for a private 3PL
    - No public org chart or engineering allocation by product area
  notes: Rows combine physical assets, software layers, and commercialization wrappers because Nimble sells an integrated
    robotics-as-a-service system rather than a standalone robot SKU.
