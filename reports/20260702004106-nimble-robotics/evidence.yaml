evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-revenue
    missingEvidence: Current revenue, ARR, margin, and growth metrics after the 2024 Series C.
    whyItMatters: >-
      The company has a verified unicorn financing event, but current operating scale still cannot be underwritten from
      public evidence.
    diligencePath: Request a current board or investor KPI pack with revenue, gross margin, and growth bridges.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A single company-confirmed employee count and function/geography split.
    whyItMatters: Third-party headcount disagreement makes burn and scale inference unreliable.
    diligencePath: Request exact employee count by function and geography from HR or finance.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: network-footprint
    missingEvidence: A current, dated list of live nodes, planned nodes, and utilization by node.
    whyItMatters: >-
      The company’s operating model depends on multi-node fulfillment, but public sources do not reconcile current
      live-node count.
    diligencePath: Request a dated network map and node-by-node utilization summary from operations.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
      - TO004
  - type: conflicting-data
    severity: minor
    topic: later-valuation-reference
    missingEvidence: A primary filing or company announcement supporting any post-Series-C valuation change.
    whyItMatters: Low-quality secondary valuation claims can distort the chronology if treated as real financing events.
    diligencePath: Treat the 2025 $1.1B reference as non-canonical unless a primary financing source is produced.
    relatedQuestionRefs:
      - QO018
  - type: missing-source
    severity: material
    topic: governance-roster
    missingEvidence: A current board roster, committee map, and finance-lead bench.
    whyItMatters: Overview-level key-person and governance risk cannot be fully assessed without broader leadership disclosure.
    diligencePath: Request a governance deck or most recent board materials from the company.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: pricing-model
    missingEvidence: >-
      Buyer-level win-rate and contract data separating CapEx, RaaS, and managed-service procurement across
      Nimble-relevant warehouse cohorts.
    whyItMatters: >-
      Public sources conflict on whether service-style pricing lowers friction or whether buyers now prefer owned
      assets, which changes how credible Nimble’s go-to-market advantage really is.
    diligencePath: >-
      Request a 2025-2026 pipeline breakdown by contract structure and interview won/lost prospects against CapEx and
      RaaS alternatives.
    relatedQuestionRefs:
      - QM017
  - type: private-evidence-only
    severity: material
    topic: nimble-sam
    missingEvidence: >-
      Node-level revenue mix, customer mix, order profile, and geographic concentration needed to translate broad market
      lenses into a credible Nimble SAM.
    whyItMatters: >-
      Public TAM frames are too broad or too narrow without knowing which categories, order sizes, and node types Nimble
      can actually serve at scale today.
    diligencePath: >-
      Request revenue and volume by customer segment, by node, and by product category plus the share tied to apparel,
      beauty, electronics, and returns.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: realized-economics
    missingEvidence: >-
      Live-site utilization, throughput, launch-time, payback, and contract-duration data from Nimble-operated
      facilities.
    whyItMatters: >-
      The market case ultimately depends on whether Nimble clears integration, safety, and supplier-trust hurdles in
      production, not just in narrative form.
    diligencePath: >-
      Run reference calls with one live customer and one operating partner, and request pre/post metrics on cost per
      order, launch time, SLA performance, and renewal behavior.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Public sources do not disclose realized per-order rates, robot-service pricing, SLA penalty schedules, or signed
      commercial terms for Nimble or most competitors.
    whyItMatters: >-
      Without realized commercial terms, it is difficult to compare Nimble's service economics against capital-light
      substitutes or large-system integrators on an apples-to-apples basis.
    diligencePath: >-
      Request anonymized customer pricing grids, SLA schedules, and win-loss comparisons under NDA from Nimble
      management and cross-check them against customer references.
    relatedQuestionRefs:
      - QP022
      - QP028
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-census
    missingEvidence: >-
      The public source pack does not support an exhaustive census of every regional integrator, robotic picker startup,
      or warehouse-execution vendor that could appear in a buyer short list.
    whyItMatters: >-
      The landscape is directionally sufficient for underwriting the main competitive threats, but not complete enough
      to support claims of total category share or universal ranking.
    diligencePath: >-
      Build an RFP-derived competitor list from recent Nimble deals, then expand with analyst databases and distributor
      or integrator channel interviews.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: nimble-unit-economics
    missingEvidence: >-
      Public sources do not show node-level gross margin, customer retention, SLA misses, or cohort utilization for
      Nimble's outsourced fulfillment model.
    whyItMatters: >-
      Those operating metrics determine whether Nimble's moat compounds through service quality and scale or breaks
      under capital intensity and partner concentration.
    diligencePath: >-
      Ask for cohort economics by node and customer vintage, including gross margin, utilization, onboarding payback,
      churn, and SLA-credit history.
    relatedQuestionRefs:
      - QP025
      - QP028
  - type: private-evidence-only
    severity: material
    topic: revenue-and-margin
    missingEvidence: Current revenue, gross margin, and revenue mix by stream.
    whyItMatters: >-
      These are the core metrics needed to test whether Nimble’s robotic 3PL model is scaling economically at the $1B
      valuation anchor.
    diligencePath: Request current revenue bridge, stream mix, and gross-margin split under NDA.
    relatedQuestionRefs:
      - QI018
      - QI022
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Cash on hand, monthly burn, working-capital bridge, and runway plan.
    whyItMatters: Capital adequacy cannot be underwritten from round history alone when the model appears infrastructure-heavy.
    diligencePath: Request treasury, burn, and runway materials from finance.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: contract-pricing
    missingEvidence: Realized contract pricing, minimums, implementation fees, and effective price per order or task.
    whyItMatters: Marketing claims about no fixed cost and low prices are not enough to evaluate revenue quality or unit economics.
    diligencePath: Request sample customer contracts and cohort pricing ladders.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-utilization
    missingEvidence: Top-customer mix, retention, node utilization, throughput, and SLA attainment by node.
    whyItMatters: These variables decide whether a robotic 3PL scales into operating leverage or remains capital hungry.
    diligencePath: Request customer concentration analysis and node KPI dashboard.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: debt-and-partner-economics
    missingEvidence: Debt facilities, project-finance terms, warehouse lease structure, and FedEx commercial economics.
    whyItMatters: >-
      Capital burden can be hidden in off-balance-sheet obligations or partner economics even when customers see a
      low-friction offer.
    diligencePath: Request financing agreements, major leases, and strategic-partner commercial terms.
    relatedQuestionRefs:
      - QI009
      - QI020
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: Independent benchmarks for pick accuracy, uptime, throughput per robot, and cost per order.
    whyItMatters: >-
      Without public benchmarks it is difficult to separate true technical lead from strong marketing and partner
      enthusiasm.
    diligencePath: Request customer-level KPI dashboards, uptime logs, and any third-party performance audits during diligence.
    relatedQuestionRefs:
      - QE017
      - QE023
    relatedTableRefs:
      - TE002
      - TE004
