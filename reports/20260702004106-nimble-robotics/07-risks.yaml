  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: node-level-economics
    missingEvidence: Live-node uptime, utilization, SLA attainment, rework, labor hours, and payback by warehouse.
    whyItMatters: These metrics determine whether Nimble is truly solving warehouse economics or simply moving complexity
      into a different operating layer.
    diligencePath: Request a warehouse-by-warehouse KPI pack, customer cohort economics, and post-launch operating review
      deck.
    relatedQuestionRefs:
    - QR016
    - QR019
    - QR029
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Current customer list, revenue concentration, renewal behavior, and FedEx share of deployed volume.
    whyItMatters: A single-partner or few-customer mix would make the apparent strategic validation much more fragile than
      the headline narrative suggests.
    diligencePath: Request top-customer concentration, contract terms, reference calls, and churn / expansion history.
    relatedQuestionRefs:
    - QR012
    - QR011
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: safety-and-regulatory-controls
    missingEvidence: OSHA-style injury logs, near-miss data, incident investigations, insurance claims, and regulator correspondence
      for Nimble-linked sites.
    whyItMatters: Warehouse-safety scrutiny is demonstrably real in the sector; without direct evidence, investors cannot
      know whether Nimble has actually reduced the exposure it claims to solve.
    diligencePath: Request safety dashboards, claims summaries, ergonomic audits, and any past regulator or carrier findings.
    relatedQuestionRefs:
    - QR005
    - QR002
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: freedom-to-operate
    missingEvidence: Outside counsel FTO memo, live claim chart against major competitors, and patent-assignment chain.
    whyItMatters: A robotics business expanding into operated networks can be damaged by injunction risk, royalty exposure,
      or weak ownership of core IP.
    diligencePath: Commission external IP counsel review and compare Nimble claims to adjacent warehouse-automation patent
      estates.
    relatedQuestionRefs:
    - QR004
    - QR021
    - QR030
    relatedTableRefs:
    - TR001
