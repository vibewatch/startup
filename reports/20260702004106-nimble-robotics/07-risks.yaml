  - - Opaque operating proof persists
    - Public or diligence packet still omits uptime, utilization, customer concentration, or service cost
    - No quantified node-level KPI package before investment decision
    - Do not upgrade conviction; keep thesis in monitor / diligence mode
  notes: These kill criteria focus on observable events that directly transmit into revenue proof, financing terms, and valuation
