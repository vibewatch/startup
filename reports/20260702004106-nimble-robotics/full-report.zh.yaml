      - number: '2.3'
        title: 增长驱动与市场为何仍会前进
        blocks:
          - type: paragraph
            body: >-
              市场仍值得关注，是因为底层驱动没有消失。劳动力短缺、工资压力和人员流失依然足够强，疫情峰值降温后，仓库运营商仍在寻找替代方案。BCG 的 ROI
              研究尤其有用，因为它把自动化不仅连接到节省人工，也连接到网络重构、库存布置和下游运输收益，这比“只买机器人”的 ROI 说法更接近 Nimble 的价值主张。退货是另一大驱动：FedEx 每年 475
              million 件退货流和 Mordor 对退货处理将成为增长最快的大类自动化应用的预测，说明逆向物流可能和出库履约同样重要。与此同时，更快配送预期让分布式节点和智能库存布置具备战略价值，尤其适用于 DTC
              品牌。这支撑了 Nimble 的多节点叙事。因此市场顺风真实存在，但它偏向能同时改善服务、灵活性和劳动生产率的方案，而不只是砸重资本、孤立优化单个仓库的硬件项目。
