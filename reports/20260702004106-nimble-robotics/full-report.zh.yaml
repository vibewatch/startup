      - number: '6.4'
        title: 扩张与渠道杠杆
        blocks:
          - type: paragraph
            body: >-
              FedEx 改变了 Nimble 客户故事的形状，因为它不只是一个简单参考客户。Supply Chain Dive 称，FedEx Fulfillment 面向 SMB
              商户的电商和库存管理需求而建；这意味着联盟可能让 Nimble 获得超越直接品牌销售的获客杠杆 (CU033)。结合 Nimble
              自身电商集成，正在形成的销售动作像混合模式：直接销售给品牌，再通过大型物流平台做渠道分发 (CU014, CU034)。公开证据也显示，Nimble
              学会了让第一步更容易。试点项目、无罚金退出条款、按需定价和快速接入叙事，都降低了客户试验成本 (CU012, CU013, CU014)。扩张故事变得不那么清楚的地方，在跨垂直深度。除 FedEx
              外，可见证据仍集中在面向消费者的品类，许多品牌标识仍是公司自述而非客户自述 (CU019,
              CU032)。这意味着当前最好的扩张证据是结构性的，而不是统计性的：动作看起来可扩展，但已发布的胜率、扩张率和上线后货量数据仍然缺失 (CU030, CU036)。FedEx
              自身履约页面进一步支撑渠道视角，因为它显示该伙伴已经把外包电商履约作为商户服务来销售；这使 Nimble 在关系中不只是后端机器人供应商
              (CU037)。独立仓储和履约统计也强化了可触达客户池仍然活跃这一点，因为商户仍面临劳动力、服务水平和吞吐压力，这有利于自动化支持的外包履约方案 (CU038, CU039)。
            claimRefs:
