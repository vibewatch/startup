  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象 / 信号
      - 指标或证据
      - 当前公开解读
      - 重要性
      - 局限
    rows:
      - - Symbotic
        - 收入、积压订单、EV/sales、自动化规模
        - 2024 年收入 $1.822B；积压订单约 $22.4B；截至 2026 年 7 月 1 日 EV/sales 约 9.98x
        - 最佳公开仓储自动化规模锚
        - 体量和成熟度都远高于 Nimble
      - - Ocado
        - 集团收入、技术解决方案收入、伙伴关系重置
        - FY24 集团收入 £3.156B；技术解决方案收入 £496.5M；Kroger 后续裁撤站点
        - 同时显示平台规模和伙伴关系脆弱性
        - 终端市场和业务组合不同
      - - 仓储自动化市场报告
        - 行业倍数和需求背景
        - MCF 引用 NTM EV/EBITDA 中位数 13.6x；Meridian 看到倍数扩张和活跃 M&A
        - 勾勒投资人如何给该品类定价
        - 行业均值不是公司特定数据
      - - 机器人拣选研究
        - TAM 和采用节奏
        - Interact 预计 2023 年收入 $303M 到 2030 年升至 $3.3B，但预测已下修
        - 支持品类上行空间，同时保留对节奏的现实判断
        - 新兴市场数据变化可能很快
      - - 行业下行先例
        - Locus 裁员、Attabotics 倒闭、Ocado/Kroger 重置
        - 证明执行或融资滑坡时，仓储自动化会快速降级定价
        - 改善下行情景校准
        - 每个先例都与 Nimble 的具体模式不同
    notes: 本表有意混合公开可比公司、行业市场数据和警示性先例，因为今天没有纯粹可比的公开 Nimble 类比对象。
