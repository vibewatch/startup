    title: 依赖关系图
    type: dag
    layout: wide
    summary: Nimble 的可见依赖集中在 FedEx 商业化、客户量、仓储站点、监管机构、 现场运营和未来资本上。
    approximationNotes: 该图只纳入保留公开记录中可见的依赖；未披露客户、房东和供应商可能让集中度比图中更深。
    data:
