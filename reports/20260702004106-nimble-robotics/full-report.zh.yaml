  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 维度
      - 正方论点
      - 反方论点
      - 改变判断的证据
    rows:
      - - 战略验证
        - FedEx 背书说明企业场景相关性和部署潜力真实存在
        - 一个战略投资方不能替代广泛客户、收入或利润率披露
        - 独立客户背书和节点级经济性
      - - 技术叙事
        - Nimble 在自主拣选、包装和履约编排上看起来有差异化
        - 许多性能指标仍由公司自己发布，未经过独立审计
        - 运营 KPI 包和第三方 ROI 证据
      - - 品类时点
        - 仓储自动化仍受益于劳动力短缺和 AI 驱动的生产率需求
        - 客户对供应商稳定性、ROI 和服务模式假设更谨慎
        - 当前需求环境下的已赢单证明
      - - 估值锚
        - $1B 投后估值给出醒目的估值参照点
        - 缺少收入和优先股条款时，这个数字可能合理、偏贵，也可能被设计成公开市场买方看不见的结构
        - Series C 投资条款书细节、当前收入和利润率数据
      - - 竞争定位
        - FedEx 加多客户节点模式，可能拼出稀缺的自主 3PL 资产
        - Amazon、GXO、Symbotic、Ocado 等抬高执行门槛，也压缩容错空间
        - 相对于可信替代方案的参考胜单
    notes: 反论点主要指向证据质量和价格纪律，而不是否认 Nimble 具备有意义的技术和商业动能。
