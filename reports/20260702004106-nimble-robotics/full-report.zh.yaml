      - number: '2.5'
        title: 对 Nimble 的投资判断含义
        blocks:
          - type: paragraph
            body: >-
              做估值时，市场章节不应被读成简单需求绿灯。Nimble 指向的确是大而持久的问题集，FedEx
              联盟也给它切入退货密集、多节点履约经济性的路径，这是很多机器人创业公司拿不到的。但今天的市场奖励低摩擦部署、可信的供应商耐久度和系统级执行，超过奖励宏大的品类叙事。Amazon 近 100 万台机器人基线和密度高
              10x 的下一代履约设计，会抬高买方越来越期待的性能门槛；行业倒闭和收购惊吓也让客户更敏感于供应商能否长期活下去。因此 Nimble 最好的市场论证不是一页巨大
              TAM，而是证明托管自主履约能穿过集成、服务和信任关口，而这些关口仍在现实中拖慢仓库自动化。公开证据已经接近这个论点，但缺少利用率、实际回本和客户合同耐久度等私有数据，还不能完全闭环。
