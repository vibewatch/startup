      - number: '1.4'
        title: 里程碑、未解指标与负面背景
        blocks:
          - type: paragraph
            body: >-
              本章最大的警示，不是 Nimble 没有里程碑，而是公开记录仍留下多项运营指标未解。官网宣传已处理 1M+ SKU，并拥有 15 个销售额 $100M+ 的客户，但没有给出客户总数。Forbes 曾给出 2021
              年早期 ARR 预期 $4 million；但 2024-2026 材料包里看不到当前收入、毛利或 run-rate 披露。员工数同样模糊：Tracxn 显示 321 人，Clay 显示 101-250
              区间，两者都未获公司确认。估值传闻也有同样不确定性。一手来源把经核实叙事锚定在 2024 年 10 月 $1.0 billion Series C；后续一篇声誉较低的 2025 年 12 月文章称估值 $1.1
              billion，却没有任何一手融资事件佐证。最后，品类背景并非没有摩擦：Supply Chain Dive 报道 2023 年北美机器人销售下降 30%，VOA 也报道了有组织劳工对自动化的抵制。因此
              Nimble 确有战略验证，但披露、执行和采用风险仍在，应该放进概览，而不是推迟到后面章节。
