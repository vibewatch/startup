      - number: '8.3'
        title: 情景视角和建议
        blocks:
          - type: paragraph
            body: >-
              由于 Nimble 不披露收入，最可支撑的公开估值方法是倒推，而不是搭一个虚假的精确模型。按大致对齐 Symbotic 当前市场倍数的 10x EV/sales 口径，$1B 估值隐含约 $100M 年收入。按
              8x，隐含收入要求升至约 $125M；按 6x，升至约 $167M；按 12x，则降至约 $83M。对一个快速扩张的自主 3PL 而言，尤其在 FedEx
              作为战略渠道时，这些门槛都不是不可能；但今天没有一个能用公开数据验证。牛市情形是，FedEx 商业化叠加多客户节点扩张，让 Nimble
              在机器人拣选市场成熟前变成稀缺的自主履约平台。熊市情形不是技术造假，而是利用率、推广速度或竞争性定价最终更像仓库自动化里表现平平的一侧，而不是溢价的一侧。因此，基准情形是估值可信但信心不足：$1B
              标记可信，但公开证据尚不足以支持激进入场。
