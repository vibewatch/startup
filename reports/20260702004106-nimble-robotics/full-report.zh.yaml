      - number: '3.5'
        title: 负面证据与失败模式
        blocks:
          - type: paragraph
            body: >-
              负面证据更多不是某个竞争者在功能上逐项击败 Nimble，而是这个品类的执行物理规律。Grocery Dive 对 Kroger 收缩 Ocado
              的报道显示，高度自动化网络如果严重错过利用率基准，足以触发关闭和数十亿美元计提。BetaKit 对 Attabotics 2025 年 7
              月关停的记录显示同一问题的融资侧：差异化自动化技术仍会失败，只要项目节奏、现金转化和营运资本断裂。Interact Analysis
              和交易市场更新强化了这个背景。短期需求转向既有场地改造和定向项目；客户最近在机器人拣选上更偏好 CapEx 而非 RaaS；利率和关税不确定性会推迟大额承诺。即便 Locus 这样更成熟的 AMR
              供应商，也承认在 COVID 后需求重置放缓中进行了定向裁员。对 Nimble 而言，信号很清楚：技术差异化必要，但利用率、销售效率、伙伴治理和融资韧性，决定护城河是复利还是开裂。
