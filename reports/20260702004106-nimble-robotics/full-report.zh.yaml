      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Nimble 的公众身份高度绑定创始人兼 CEO Simon Kalouche。多份一手和三方来源都确认他是创始人兼首席执行官；就私营机器人公司创始人而言，公开履历细得少见：2014 年 Ohio State
              机械工程、2016 年 Carnegie Mellon 机器人学，之后暂停 Stanford 博士项目创办公司。这段背景与公司的产品主张高度贴合，因为 Nimble
              的卖点不是纯软件，而是通用操作、末端执行器、存储与检索架构以及仓库落地。治理披露比创始人披露薄，但可见董事阵容很强：Fei-Fei Li 和 Sebastian Thrun 在 2021 年 Series A
              时加入董事会，Marc Raibert 于 2023 年加入。这些名字提供了真实技术与声誉背书。缺口仍在更完整的治理班底：本次查阅材料没有公开来源给出完整董事会、财务负责人图谱或委员会结构，因此 Kalouche
              的关键人物集中风险仍然重要。
