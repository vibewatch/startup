      - number: '2.2'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              最自然的买方不是普通仓库，而是包裹需求波动大、劳动力成本暴露高、服务水平承压的品牌和合作伙伴。Nimble 自身定位和 FedEx
              商业表述都指向电商及全渠道品牌：它们更在意上线速度、节点触达和更低的综合物流成本，而不是拥有机器人资产。中小客户里，day-one 用户很可能是履约或运营团队；但预算所有者可能上移到
              COO、供应链负责人或财务负责人，因为这个决策同时改变网络设计、服务水平和运输成本。这张买方地图很重要，因为 Nimble 以无固定成本的外包产能和试点式进入来包装自己时，有时能绕开经典机器人 CapEx
              委员会。但这并不会取消验证要求。大客户仍会评估集成负担、服务韧性和运输适配；FedEx 这样的战略伙伴则会判断 Nimble 是否扩大网络覆盖和退货处理能力，而不只是用机器人替代劳动力。
