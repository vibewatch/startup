      - number: '3.3'
        title: 定价、包装与切换
        blocks:
          - type: paragraph
            body: >-
              定价是整个品类公开记录最弱的一环。Nimble 当前网站强调无固定成本、按工作付费、快速接入和多节点扩展；Locus
              强调可逐步扩张的灵活自动化；Symbotic、Dexterity、GreyOrange、Berkshire Grey 和 Ocado
              都营销定制化企业结果，而不是透明价目表。因此真实买方比较不太围绕标价，而更围绕哪一个成本桶被移动：Nimble 把讨论推向服务经济性和外包履约；Symbotic 和 Ocado
              偏向大型集成系统承诺；Dexterity 销售定向流程自动化；Locus 或 GreyOrange 可以以更低扰动叠加到现有站点。切换成本会在上线后出现，来自 WMS
              或编排挂钩、库存布置逻辑、设施流程重设计、SLA 承诺和培训。这些壁垒帮助留存，但也抬高 Nimble 进入任何新客群时首个部署的验证负担。
