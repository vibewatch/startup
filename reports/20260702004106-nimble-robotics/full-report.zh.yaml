      - number: '1.3'
        title: 资本、利益相关方与商业验证
        blocks:
          - type: paragraph
            body: >-
              Nimble 的融资线索在私营仓库机器人公司里罕见清晰。2021 年 3 月 Series A 融资 $50 million，并把 Fei-Fei Li 和 Sebastian Thrun 带入董事会。2023
              年 3 月 Series B 融资 $65 million，由 Cedar Pine 领投，正式把公司推向全国性自主 3PL 模式。最重要拐点出现在 2024 年 9 月至 10 月：FedEx
              先宣布战略联盟和投资，随后 Nimble 宣布由 FedEx 领投、Cedar Pine 共同领投的 $106 million Series C，估值 $1.0 billion。二级数据库大致集中在约 $221
              million 已披露风险融资；Tracxn 还浮现一笔 2018 年小额补助，与轮次时间线方向一致。商业验证不只是钱。公开来源指向已具名品牌关系、新的 New Jersey 节点、以数周计的 TA3 SWIM
              上线，以及公司多次声称 Nimble 已跨多个品类处理数百万件商品。
