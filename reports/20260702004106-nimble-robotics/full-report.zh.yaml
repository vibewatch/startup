    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与分层
        blocks:
          - type: paragraph
            body: >-
              Nimble 的真实竞争集比泛泛列一串仓库机器人供应商更窄，但又比纯单件拣选对比更宽。公司现在通过自有机器人 3PL 模式出售外包自主履约产能，因此买方会把它同几类选择对比：Dexterity 这样的直接 AI
              操作厂商，Symbotic 和 Ocado 这类规模化自动化平台，Locus 和 GreyOrange 这类灵活的既有场地改造替代方案，以及人工 + 内部自建的现状。FedEx 联盟很重要，因为它让 Nimble
              的方案不再只是一笔机器人销售，而是在一次采购动作中结合仓库自动化、运输入口和退货基础设施。这个切口不同于客户现场部署，但并非在所有购买标准上都无对手。Symbotic 在公开规模上领先，Amazon
              在已安装机器人基数和学习面上领先，既有场地改造 AMR 或编排供应商则常常为尚未准备外包节点本身的运营商提供更低扰动路径。
