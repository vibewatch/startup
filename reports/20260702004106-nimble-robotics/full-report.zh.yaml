  - id: TP005
    title: 护城河耐久性 / 竞争风险登记
    columns:
      - 护城河主张
      - 威胁 / 反向证据
      - 严重性
      - 来源支撑的理由
      - 缓释 / 尽调追问
    rows:
      - - FedEx 分销护城河
        - 伙伴集中度
        - 高
        - 最清晰的网络边缘来自伙伴赋能，而非自有
        - 审查排他性、终止条款、脱离 FedEx 后的经济性和扩张权
      - - 自主 3PL 独特性
        - Symbotic、Ocado 和 Amazon 能以大得多的规模捆绑自动化
        - 高
        - 公开规模和资本不对称可能压窄创业公司的商业窗口
        - 隔离一个细分：即使规模更小，外包中端市场履约仍能获胜
      - - 操作 AI 领先
        - Dexterity 已在生产环境运行，Amazon 吸收了 Covariant 人才和模型
        - 高
        - 在高变化度拣选和处理智能上存在直接重叠
        - 索取拣选错误率趋势、再训练节奏和边缘案例解决数据
      - - 服务模式降低采用摩擦
        - 机器人拣选的公开需求近期偏好 CapEx，宏观逆风会拉伸服务毛利
        - 中
        - 市场更新显示承诺放慢，且对定价模式敏感
        - 按节点索取毛利率、最低量条款和按 cohort 划分的合同期限
      - - 品类顺风保证成功
        - Ocado/Kroger 关闭和 Attabotics 破产显示利用率和融资失败
        - 高
        - 即便自动化资产有差异化，量或营运资本不达计划仍会失败
        - 尽调站点利用率、现金转换、债务契约和资金 runway
      - - 棕地阻力只是暂时的
        - 短期需求仍偏向定向改造和模块化系统
        - 中
        - 运营方可以先买更窄的替代方案，推迟全仓重构
        - 展示 Nimble 从轻量自动化转向外包节点采用的转化漏斗
      - - 定价不透明无伤大雅
        - 主要可比公司都没有发布标准标价或公开 SLA 罚则
        - 中
        - 定价不透明会拉长 ROI 证明周期，也削弱清晰的赢单 / 输单比较
        - 在 NDA 下获取实际回本期、SLA 赔付敞口和客户流失披露
    notes: 严重度是分析师基于留存来源综合判断，不是统计分数。这个清单用来暴露 Nimble 护城河可能在商业上失效的位置，即便底层机器人技术能够跑通。
