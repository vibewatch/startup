      - number: '4.2'
        title: 资本历史与运营模式负担
        blocks:
          - type: paragraph
            body: >-
              轮次时间线重要，因为 Nimble 的商业承诺与资本负担分不开。Series A 资金用于招聘、建设产品和扩展部署；Series B 资金用于扩张全国自主履约网络；Series C 资金则指定给制造、部署和
              R&D。这正是机器人 3PL 应有的轨迹：不只软件或 AI 需要更多钱，节点、机器人供给、实施和服务可靠性也需要钱。二级数据库集中在约 $221 million 已披露融资，Tracxn
              还浮现一笔更早的小额补助，因此公开记录确实支持一个有分量的资本基础。但同一记录没有披露资产负债表另一面。未找到公开现金余额、月度 burn、runway
              目标、债务安排、仓库融资结构或仓库层面营运资本画像。如果客户真的能避开固定成本和前期 CapEx，那么这项负担必然落到别处——很可能落在
              Nimble、其投资人以及主要渠道或基础设施伙伴身上。这让利用率、密度和融资耐久度比营销语言本身更重要。
