  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 熊市、基准和牛市区间很宽，说明 Nimble 当前价格可以从几个角度说通， 但公开证据无法精确钉住。
    approximationNotes: 区间是编辑性估计，锚定战略验证、公开可比公司背景和下行先例，而不是正式 DCF。
    data:
      items:
        - label: 熊市情形 —— 部署或利用率低于预期
          low: 650
          high: 850
          unit: $M
        - label: 基准情形 —— 本轮估值大体守住
          low: 900
          high: 1100
          unit: $M
        - label: 牛市情形 —— FedEx 证明复利放大为溢价增长
          low: 1200
          high: 1500
          unit: $M
