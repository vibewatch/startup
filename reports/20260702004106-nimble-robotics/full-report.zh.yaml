  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              可见客户群集中在电商品牌以及服务它们的运营商。Nimble 以外包服务销售机器人履约，而不是出售客户自有基础设施，因此买方通常是品牌运营或供应链负责人，日常用户是通过 Nimble
              节点跑订单的运营团队，付款方是外包履约的商家或企业 (CU001, CU004)。公开客户分层在面向消费者的品类中最强。Nimble 和独立报道明确点名服装、鞋履、健康与美容、电子产品、消费品、综合商品和医药
              (CU015, CU016)。最清晰的生产式品牌故事是 TA3 SWIM，最清晰的企业级关系是 FedEx。除此之外，公司还突出更多 DTC
              故事标题和几个可识别零售品牌标识，但证据很快变浅：许多账户只有名字，没有合同、使用深度或结果披露 (CU017, CU018, CU019)。官网称拥有 15 个销售额超过 $100 million
              的客户，暗示公司已打入有意义的品牌规模；但这句话未经审计、也未分层，因此不能揭示每个客群贡献多少收入，或这些客户是否集中在某个垂直领域 (CU002, CU030, CU032)。
