  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值锚点与披露质量
        blocks:
          - type: paragraph
            body: >-
              Nimble 有真实的公开估值锚点，但还没有完整的公开承销案例。对一家私营机器人公司而言，核心事实集异常清晰：Nimble 称其 2024 年 10 月完成 $106M Series C 轮，估值
              $1B；Business Wire 发布了公告；FedEx 公开确认战略投资和商业联盟；多家行业媒体重复了相同融资条款。已披露融资历史也勾勒出一条合理路径：2021 年 $50M Series A，到 2023
              年 $65M Series B，再到 $106M Series C，意味着至少有 $221M 公开披露资本。缺失的恰恰是判断 2024
              年独角兽标记偏慷慨还是偏保守所需的一切：公开收入、毛利率、留存、客户集中度、优先股条款和当前二级市场定价。公司自有材料围绕处理数百万件商品、全国网络扩张和物流成本节省给出很强的叙事证明，但这不等于经审计的估值支撑。结果就是：估值锚点标题可信度强，经济透明度弱。二级数据库进入后，披露缺口更宽。Crunchbase
              式财务摘要仍不完整，模型估算网站相互分歧，叙事型商业模式文章可以把 Nimble 标在高于上轮一手融资的估值，却不增加新的经审计运营证据 (CV046, CV047, CV048)。
