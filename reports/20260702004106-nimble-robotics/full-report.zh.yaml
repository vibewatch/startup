  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分显示，Nimble 战略证明强、品类吸引力也强，但当前经济性仍未公开， 证据质量只能算中等。
    approximationNotes: 评分采用 1-5 的编辑性尺度，依据截至运行日期保留的公开证据；这些不是管理层提供的 KPI。
    data:
      items:
        - label: 市场机会
          value: 4
          unit: /5
          note: 仓储自动化仍有吸引力，机器人拣选长期增长空间还在。
        - label: 战略验证
          value: 5
          unit: /5
          note: FedEx 已投资并签署商业联盟，也构成本文件中佐证最强的企业客户证明锚点。
        - label: 商业证明
          value: 3
          unit: /5
          note: 具名证明存在，但客户集中度和节点经济性不透明。
        - label: 证据质量
          value: 2
          unit: /5
          note: 无公开收入、毛利率、留存或股权结构细节。
        - label: 估值支撑
          value: 3
          unit: /5
          note: $1B 轮次可信，但按披露证据看不出明显便宜。
    claimRefs:
      - CV001
      - CV002
      - CV015
      - CV017
      - CV024
      - CV028
      - CV029
      - CV039
      - CV040
