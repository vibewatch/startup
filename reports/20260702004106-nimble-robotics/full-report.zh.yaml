      - number: '3.4'
        title: 护城河耐久度与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Nimble 的护城河在客户同时看重三件事时最强：外包执行、运输集成、低前期采用摩擦。FedEx 在北美拥有 130+ 个仓库和履约运营点，叠加每年 475 million 件退货流，给 Nimble
              一个多数创业同业无法匹配的分销和逆向物流锚点。问题是，这条护城河由伙伴赋能，而非 Nimble 自有。与此同时，资本不对称无法忽视。Symbotic 拿着上市公司资产负债表和数十亿美元市值，Ocado
              披露数十亿英镑集团收入，Amazon 披露的机器人安装基数达到私营供应商无法接近的规模。Amazon 的 Covariant 交易很关键，因为它说明前沿操作 AI
              可以被吸纳进一个自有网络；这个网络拥有的数据、设施和迭代速度，远超独立创业公司能负担的水平。因此投资判断应把 Nimble 的护城河视为商业上有意义，但前提是伙伴关系足够持久，且执行速度快过更大对手。
