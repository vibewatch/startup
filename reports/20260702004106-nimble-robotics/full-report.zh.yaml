    layout: wide
    summary: 反推收入门槛显示，在不同销售额倍数口径下，Nimble 需要多少年收入才能支撑 $1B 估值。
    approximationNotes: 数值等于 $1,000M 除以所列倍数；它们表示所需收入支撑，不是实际报告收入。
