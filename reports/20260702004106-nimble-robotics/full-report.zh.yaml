companyProfile:
  summary: >-
    Nimble Robotics 现在对外使用 Nimble 品牌，是一家旧金山仓库自动化公司。它把通用仓库机器人、Nimble 自营履约中心、运输编排和云物流平台拼成机器人 3PL
    服务。公司面向电商品牌、零售商和平台运营商：这些客户想要更快履约、更宽 SKU 覆盖、更低劳动强度，但不想自建自动化栈。公开证据支持其已有真实生产部署、FedEx
    战略合作和持续扩大的专利组合；但收入、毛利、客户集中度和上线节点经济性仍明显披露不足。
