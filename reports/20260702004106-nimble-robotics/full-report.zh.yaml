      - number: '8.2'
        title: 可比框架和市场背景
        blocks:
          - type: paragraph
            body: >-
              Nimble 没有完美的公开可比公司，因此估值只能从相邻自动化龙头、行业市场数据报告，以及公开投资人如何给仓库自动化增长定价的证据中三角校准。Symbotic 是最干净的高增长公开锚点，因为它把大规模自动化、AI
              驱动编排和仓库系统经济性合在一起；其 2024 年收入、积压订单和当前 EV/sales 倍数显示了一个规模化公开龙头可能长什么样。Ocado
              是有用但不完美的第二锚点，因为它显示大型自动化履约平台可以产生真实收入和 EBITDA，同时仍承受伙伴关系重置和站点层经济性风险。MCF、Meridian、Baird、Interact Analysis 和
              Capstone 的行业报告都指向同一方向：由于劳动力稀缺、供应链韧性和 AI 驱动生产率，投资人仍高度看重自动化；但市场对供应商稳定性、项目 ROI，以及终端客户是否偏好 CapEx
              自有而非纯服务模式，已经更挑剔。这个组合让 Nimble 所在品类有吸引力，也意味着举证责任已转向硬部署经济性。更多可比组细节也强化了纪律。Berkshire Grey
              显示，仓库自动化的一条路径是战略收购，而不是顺滑的公开市场复利；Ambi 显示专门化拣选竞争仍活跃；即便品类叙事有利，集成摩擦评论也会压住英雄式采用假设 (CV049, CV050, CV051)。Nimble
              自己的 Series B 表述也清楚说明，价值桥靠网络执行搭起来，不只靠技术新奇 (CV045, CV052)。
