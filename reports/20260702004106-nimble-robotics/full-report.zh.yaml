      - number: '6.5'
        title: 采用风险与负面信号
        blocks:
          - type: paragraph
            body: >-
              负面证据并不说明客户正在失败，但说明扩展客户采用可能比赢下第一个品牌标识更难。BCG 称许多仓库自动化试点从未规模化或错过 ROI；PeakLogix
              认为，多数物流转型项目因集成差、培训弱和缺少持续优化而交付不足 (CU024, CU025)。VOA
              对港口工人抵制的报道说明，自动化仍带有政治和社会争议；即便商业案例有吸引力，大型仓库客户仍要管理劳工接受度和流程变更 (CU026)。OSHA 针对 Amazon
              的行动让风险更具体：人体工学和工人安全仍是自动化仓库网络的实时监管议题，这意味着客户不只关心省人工，也会关心供应商能否规模化安全运营 (CU027, CU028)。对 Nimble
              而言，主要采用风险因此不是缺少兴趣，而是公开记录仍让太多上线后的故事无法衡量。买方能看出方案为什么有吸引力，但外部人还看不到足够多关于耐久度、安全结果或大规模系统性能的信息，无法判断客户基础会有多粘
              (CU024, CU025, CU028, CU036)。
