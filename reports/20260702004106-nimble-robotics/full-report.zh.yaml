      - number: '6.2'
        title: 采用轨迹与证明质量
        blocks:
          - type: paragraph
            body: >-
              Nimble 的公开证据越具体地触及运营痛点，采用故事就越强。TA3 称转向 Nimble，是因为人工履约已经昂贵且难以扩展；公司能够在夏季旺季前几周内上线 (CU005)。FedEx 称联盟将使其借助
              Nimble 的自主 3PL 模式，在北美扩展 FedEx Fulfillment；这是更大的验证点，因为它把 Nimble 接到一个拥有 130+ 个仓库和每年 475 million 件退货的运营商上
              (CU007, CU008)。Nimble 还公开把方案锚定在一到两天覆盖 96%+ 美国地区、无罚金退出的试点、按需定价和即插即用集成上；这些都是采用工具，而不只是技术主张 (CU011, CU012,
              CU013, CU014)。即便如此，证明质量漏斗很快收窄。许多具名品牌标识只来自公司自撰清单或只有标题的客户故事；公开记录中最强的独立佐证来自 FedEx，而不是广泛自我披露的客户基础 (CU017,
              CU019, CU031)。结果是，这组客户看起来商业上有希望，但 FedEx 与账本其他部分之间仍存在背书质量梯度 (CU033, CU035)。
