  - id: FM004
    title: 采用路径与关卡流程
    type: flow
    layout: wide
    summary: Nimble 的市场路径从服务痛点和可试点经济性起步，随后要么借助证据与伙伴杠杆复利，要么卡在集成、供应商信任和安全顾虑上。
    data:
      nodes:
        - id: pain
          label: 服务 + 用工痛点浮现
          detail: 电商品牌面对用工波动、更快配送压力和退货复杂度。
          tone: neutral
        - id: pilot
          label: 托管服务试点变得可行
          detail: 无固定成本、低摩擦切入，可以把讨论从高额前置机器人资本开支拉开。
          tone: positive
        - id: proof
          label: 必须拿出集成和运营证据
          detail: 买方接下来会测试爬坡速度、WMS/WCS 负担、SLA 稳定性和每单实际成本。
          tone: warning
        - id: partner
          label: 伙伴或多节点规模打开扩张
          detail: 若 Nimble 证明网络和退货价值，FedEx 式渠道可以扩大触达。
          tone: positive
        - id: risk
          label: 市场逆风可能冻结推进
          detail: 关税、供应商不稳定、棕地偏好和劳工信任问题都会拖慢决策。
          tone: warning
        - id: scale
          label: 全系统信任建立后才会持久采用
          detail: 市场最终奖励的是可靠服务交付，不是机器人秀。
          tone: neutral
      edges:
        - from: pain
          to: pilot
          label: ROI 和服务缺口制造紧迫感
        - from: pilot
          to: proof
          label: 客户要求现场证据
        - from: proof
          to: partner
          label: 强证据可以拓宽市场路径
        - from: proof
          to: risk
          label: 证据弱或供应商疑虑会拖延采购
        - from: partner
          to: scale
          label: 网络信任开始复利
        - from: risk
          to: scale
          label: 只有可信运营证据才能解决
    approximationNotes: 这条流程是基于留存证据合成的市场逻辑图，不是披露的 Nimble 销售漏斗或管线转化报告。
