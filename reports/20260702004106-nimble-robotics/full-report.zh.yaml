  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 熊市
        - FedEx 推广慢于预期，节点利用不足，客户继续偏好资本开支更重的自有模式
        - 如果投资人把叙事压向低溢价自动化结果，隐含价值约 $650M-$850M
        - 利用率不达标、价格压力、后续融资需求
        - 公开经济性仍不透明，下行尾部风险不小
      - - 基准
        - 战略推广推进，但披露仍不完整，采用节奏稳健而非爆发
        - 约 $900M-$1.1B；2024 年轮次大体站得住，但看不出明显偏向投资人的错价
        - 收入和利润率支撑不透明、竞争基准压力
        - 基于当前证据，这是概率最高区间
      - - 牛市
        - FedEx 商业化和多客户节点展现强利用率、稳定 SLA 和可见经济性
        - 如果 Nimble 在同行追上前证明自己是稀缺的自主履约平台，估值约 $1.2B-$1.5B
        - 执行滑坡或股权结构包袱仍可能迅速封顶上行空间
        - 说得通，但目前公开数据证据不足
    notes: 情景区间是基于公开市场背景、战略验证和下行先例推导的分析估计，不是公司指引或正式 DCF。
