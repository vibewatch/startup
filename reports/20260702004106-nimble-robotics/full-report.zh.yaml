  - id: TP004
    title: 分销与转换成本表
    columns:
      - 杠杆
      - Nimble 证据
      - 最接近替代方案
      - 重要性
      - 外溢 / 局限
    rows:
      - - 承运商与退货网络入口
        - FedEx 联盟连接 130+ 个仓库运营和 475M 年退货量
        - Symbotic 零售嵌入或 Amazon 内部网络
        - 加快全国 SLA 覆盖和获客
        - 依赖伙伴，不归 Nimble 所有
      - - 上线速度与低前期成本
        - 数天上线；无固定成本；只按完成任务付费
        - Locus 式灵活棕地自动化
        - 降低中端市场品牌首次部署摩擦
        - 如果利用率不及预期，服务经济性会压缩供应商毛利
      - - 云端流程广度
        - WMS、OMS、TMS、IMS 和 RMS 在一个平台
        - GreyOrange 编排或 Ocado 平台栈
        - 掌握机器人之上的运营逻辑
        - 公开来源看不出实际附加率或逐模块留存
      - - 节点所有权与外包执行
        - Nimble 运营机器人履约节点，而不只是卖硬件
        - Ocado 伙伴 CFC 和 Amazon 自营节点
        - 形成运营数据闭环和 SLA 控制
        - 比纯软件更需要资本和运营纪律
      - - 操作 AI 学习闭环
        - Nimble 称已处理数百万件商品；同品类最强对手也拥有巨大训练场
        - Dexterity 和 Amazon/Covariant
        - 数据与边缘案例学习能复利模型质量
        - 公开证据仍偏营销，且没有直接基准
      - - 上线后的流程锁定
        - 软件钩子、库存布点逻辑、SLA 和再训练在部署后持续存在
        - 任何嵌入后的主要技术栈
        - 提高留存和多年期价值
        - 同样的复杂度会拉长初始销售周期
    notes: 本表聚焦实际转换和分销杠杆，而不是宽泛产品宣称。多项是基于保留证据的机制层解释，因此局限列不可省。
