      - number: '7.2'
        title: 运营和推广风险
        blocks:
          - type: paragraph
            body: >-
              Nimble 最大的剩余风险在于，仓库自动化是系统问题，不只是机器人问题。公司现在出售自主履约结果；这要求机器人可靠性、WMS/WCS
              编排、异常处理、劳工流程重设计、现场服务和单点经济性同时跑通。独立行业来源说得很直接：许多自动化项目落地不达预期，原因在集成缺口、变革管理薄弱，或上线后优化不足。Nimble
              自己的记录也印证这一点：TechCrunch 2023 年报道称，公司当时仍运营 1 到 10
              个场地，尚未达到完全无人化仓库；后续公司材料仍把更多分拣和端到端自主能力列为在研。这不是致命缺陷；对一家雄心很大的机器人公司来说很正常。但这意味着，在看到已披露的正常运行时间、每节点吞吐、客户流失或维护强度之前，公开市场投资人就要先承销扩张风险。仓库市场背景又放大了这种风险：客户更谨慎，仓库就业在重置，多个自动化网络已经未通过基准测试或被重组。下行并非假设：Attabotics
              的事后分析显示，即使融资不少，资本强度和执行压力也能压垮一个仓库自动化故事；Nimble 同时扩节点和制造时，必须避开这一模式 (CR046)。
