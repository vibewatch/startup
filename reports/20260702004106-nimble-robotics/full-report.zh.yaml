  - id: TM001
    title: 市场定义表
    columns:
      - 口径 / 细分
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Nimble 的相关性
    rows:
      - - 全球仓库自动化
        - 跨行业和应用的仓库硬件、软件和服务
        - 非仓库工业自动化、纯包裹运输和通用劳动力型 3PL 支出
        - 仓库运营、工程、自动化和 capex 负责人
        - 可作为方向性 TAM，但远宽于 Nimble 的外包履约切入点
      - - 北美电商仓库市场
        - 北美电商仓库的履约中心运营、存储、增值服务和自动化水平
        - 非电商仓储、北美以外地区和上游制造自动化
        - 零售商、品牌、3PL 和供应链运营商
        - 最好的公开上限服务口径，因为 Nimble 卖的是履约能力，不只是机器人
      - - 机器人拣选市场
        - 在仓库流程之间移动包裹、箱件和单件商品的操控机器人
        - 机器人拣选之外的存储系统、运输管理和仓库劳动力 / 服务
        - 仓库工程和自动化买方
        - 技术重叠最接近，但对 Nimble 的捆绑服务模式来说太窄
      - - 退货 / 逆向物流自动化
        - 仓库退货区域内的检查、分拣和处理工作
        - 干线运输和面向消费者的包裹服务
        - 退货负责人、供应链运营和伙伴网络
        - 重要相邻领域，因为 FedEx 规模和 Nimble 经济性都受益于退货密度
      - - Nimble 实用 SAM
        - 面向需要快速启动、多节点覆盖和机器人赋能服务水平的电商及全渠道品牌的北美外包自主履约
        - Amazon / 内部自用自动化、纯人工 3PL 合同和无关的纯托盘自动化项目
        - 运营负责人，以及服务经济性重塑网络时的 COO / 财务
        - 按服务层切片承销：它介于宽口径仓库 TAM 和狭口径机器人拣选核心之间
    notes: 各行混合第三方市场定义与作者边界逻辑；Nimble 实用 SAM 行是受证据约束的框架口径，而非公司披露细分。
