  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Nimble 的公开收入模式，在产品层面最清楚，尚不是一本细致价目书。官网把方案表述为机器人履约、运输和 AI
              云物流，并明确说客户只为已完成任务付费，不承担管理成本或固定成本。这指向服务主导模式，而不是以授权许可为先的机器人销售。来自 Series B 公告、New Jersey 节点发布和 TechCrunch
              2023 年报道的支持性来源强化了同一画面：Nimble 正在建设机器人 3PL
              网络，出售履约结果、低摩擦接入和全国覆盖，而不是要求品牌自己购买并集成大型固定自动化系统。开放问题在于兑现。留存材料包没有任何公开来源披露单订单价目表、合同最低额、运输 take
              rate，或扣除人工、仓库、维护和支持成本后的实际毛利。公司最强的经济主张——最高节省 40% 物流成本、仓库面积最多缩小 75%、一到两天覆盖 96%+
              人口——可作为商业信号，但仍是公司自述，不是经审计的收入质量证据。
