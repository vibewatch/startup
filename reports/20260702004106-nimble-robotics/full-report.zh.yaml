  - id: TV005
    title: 投资论点破坏和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - FedEx 商业化不达预期
        - 未来 12 个月没有有意义的新推广证明或可引用客户扩张
        - 战略验证无法继续滚入收入信心
        - 维持或下调信心；不要按溢价增长测算
      - - 节点利用不足或关闭
        - 站点暂停、披露的基准不达标，或在运节点重组
        - 自主 3PL 模式开始更像资本密集型实验，而不是可规模化平台
        - 把情景估值重切到熊市区间
      - - 融资低于 2024 年独角兽标记
        - 因运营短板导致降价轮、重结构条款或过桥融资
        - 显示内部经济性去风险速度不够快
        - 假设稀释更高、估值支撑更弱
      - - 资本开支偏好压过外包需求
        - 大客户选择偏自有模式，而不是 Nimble 式服务经济性
        - 压缩 Nimble 当前商业模式的 TAM
        - 下调倍数假设和采用速度
      - - 披露缺口持续存在
        - 尽调深入后，收入、利润率、集中度和投资条款书可见度仍然缺失
        - 证据质量仍弱，不足以给出带价格判断的结论
        - 建议维持跟踪 / 继续研究
    notes: 这些是最可能改变建议的可观察事件，不是泛泛的宏观担忧。
