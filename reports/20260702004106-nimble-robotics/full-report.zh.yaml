      - number: '8.4'
        title: 尽调问题和论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              Nimble
              仍值得跟踪，因为战略要素是真实的：可信融资轮、规模化物流伙伴、有意义的自动化品类，以及独立行业来源认真对待的产品故事。但估值信心受制于公开记录仍缺失的精确数据。投资人需要当前收入、毛利率、客户集中度、按节点拆分的正常运行时间和利用率、参考客户证据，以及
              Series C 的证券条款，再判断 $1B 是公允还是拉伸。最重要的论点破裂触发器同样可衡量：FedEx 推广失误、客户节点利用不足或低于 SLA 的证据、低于 2024 年独角兽标记的融资事件，或证明偏好
              CapEx 的买方不如预期那样愿意把核心履约经济性外包给 Nimble。在这些问题回答前，基于公开证据的正确建议是跟踪 / 继续研究，而不是不看价格地买入。
