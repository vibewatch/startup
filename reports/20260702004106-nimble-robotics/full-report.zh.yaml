      - number: '7.3'
        title: 伙伴、市场和融资依赖
        blocks:
          - type: paragraph
            body: >-
              Nimble 的公开证据在战略上很强，但高度集中。FedEx
              同时是领投方、商业伙伴，也是把可信度导入企业履约市场的机制。这种绑定能加速采用，但也意味着一段关系可以直接传导到收入证明、部署密度和未来融资条款。FedEx 之外，Nimble
              披露的具名客户证据有限，而行业本身也在释放谨慎信号。Interact Analysis、MCF 和 Capstone 都描述了一个仍相信自动化、但对项目
              ROI、供应商稳定性和宏观疲软高度敏感的市场。其他数据点也指向同一方向：客户更偏好 CapEx 模式，而不是单纯追捧 RaaS；Locus 在疫情后过度扩张后裁员；Attabotics
              在融资不少后仍失败；Kroger 在部分站点未达到经济基准后裁撤了 Ocado 网络的一部分。这些结果都不能证明 Nimble
              会失败。它们证明的是，客户、投资人和伙伴现在期待更硬的利用率、可靠性和现金效率证据，单靠机器人故事标题已经不够。公开市场层面也强化了这种谨慎。Ocado 和 GXO
              的投资人材料显示，要让自动化履约网络经久耐用，需要多大的规模、流程纪律和资本；Baird 也指向一个仍看重整合和选择性资本的行业 (CR047, CR048, CR049)。即便是私营公司数据库，对 Nimble
              的客户集中度和运营指标也留下太多未解问题，因此披露不透明应作为独立风险处理，而不是资料不便 (CR050)。
