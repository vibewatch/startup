        - 北美
        - $13.45B
        - 到 2031 年 CAGR 4.1%
        - 面向电商设施的仓库运营市场，包含不同自动化水平
        - 仍然太宽，因为它包括 Nimble 无法完全拿下的人工和半自动化活动
      - - Interact 机器人拣选市场
        - 2023 实际
        - 全球（不含 Amazon）
        - $0.303B
        - 到 2030 年收入 CAGR 20%
        - 仅机器人静态操控收入
        - 太窄，因为 Nimble 销售的服务、软件和运输价值超出机器人拣选
      - - Interact 机器人拣选单元
        - 2023 实际
        - 全球（不含 Amazon）
        - 2,286 units
        - 到 2030 年单位数量 CAGR 42%
        - 拣选机器人的装机量 / 出货量口径
        - 台数不能直接与服务市场美元规模比较
      - - 作者推导的工作流约束切片
        - 2026 合成
        - 全球代理
        - $1.22B
        - n/a
        - 34.17 × 28.41% 零售 / 电商占比 × 32.31% 拣选 / 包装占比 × 38.96% 3PL 占比
        - 合成下限代理，不是已发布市场细分，也不是干净的 Nimble SAM
      - - MCF / 行业展望
        - 2025 视图
        - 全球
        - 约 25% 设施已自动化
        - 2025-2026 年高个位数增长；2027 年起双位数增长
        - 聚焦采用、估值和履约中心自动化需求的行业综合
        - 采用率框架有信息价值，但不是直接支出估算
    notes: 各数值有意保留彼此不可兼容但有决策价值的口径；不要相加。合成 $1.22B 行是此处披露的作者测算，不是来源发布的细分。
