      - number: '3.2'
        title: 直接同业与规模化替代方案
        blocks:
          - type: paragraph
            body: >-
              Dexterity 是技术层面重叠度最高的公司，因为它营销用于操作的生产级 AI，已作出超过 100,000,000 次自主决策，决策速度低于 400 毫秒，并有 FedEx、Sagawa 和 GXO
              试点等上线参考。但 Dexterity 仍然销售客户设施内的流程自动化，而不是 Nimble 自有的外包履约节点。Symbotic 是最强规模化标杆，因为它结合高密存储、箱件处理、AI
              软件、上市公司融资通道和足以压过任何私营创业公司的积压订单。Locus 和 GreyOrange 在全自主上没那么直接，但它们能用更容易接受的既有场地改造故事截走预算：保留建筑，叠加 AMR
              或编排，在不承诺仓库级重设计的情况下提升吞吐。Berkshire Grey 在 SoftBank 持有下仍是企业级拣选和分拣替代方案；Ocado 则说明，垂直整合的履约技术即便偏重生鲜杂货、经济性不同于
              Nimble，也能跑到高得多的已披露收入规模。合在一起，这些对手证明 Nimble 有差异化，但不是独占一个品类。
