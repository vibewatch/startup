      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              架构故事有两个关键阶段。2021 年，Nimble 仍主要把自己描述成机器人拣选系统：它可以落入客户环境，无需代码修改就接入现有 WMS/WCS 栈，并用人在回路监督从第一天起保障生产可靠性 (CE006,
              CE007, CE008)。到 2023 和 2024 年，公司已把这套架构扩展成完整运营模式：Nimble 自营仓库、整合 WMS、OMS、TMS、IMS 和 RMS 功能的 Cloud Logistics
              Platform，以及一个在节点间选择承运商和库存布置的运输层 (CE009, CE011, CE015, CE034)。从业者评论补足了营销文案没有的细节。Jonathan Briggs 说，Nimble
              成为自己的第一个客户，围绕垂直模型重设计仓库，用六轴机器人取消了建筑内的拣货员职能，并持续开发机器人分拣 (CE020,
              CE021)。最终效果是，产品架构如今横跨硬件、控制软件、设施设计和外包运营。仍不清楚的是，这套栈有多少已经完全自主、还有多少部分依赖人工；TechCrunch
              和播客都显示，虽然单件拣选已自动化，一些功能仍未完成或仍需要人工处理 (CE022, CE035)。
