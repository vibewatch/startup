  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与测算逻辑
        blocks:
          - type: paragraph
            body: >-
              最大的投资判断错误，是把 Nimble 简单看成巨大仓库自动化 TAM 的受益者，然后到此为止。公司卖的不是通用仓库硬件；它把自主履约产能、多节点布点逻辑、承运商优化和外包运营打包成一项托管服务。这意味着全球
              $34.17 billion 仓库自动化大市场只是方向性天花板，不是真正可触达战场。更贴近运营的视角，是 Mordor 给出的 $13.45 billion
              北美电商仓库市场，因为这个框架至少把履约中心经济性、增值服务和自动化水平放进 Nimble 想要驱动的同一类建筑里。但即便这个口径也太宽，因为其中包括 Nimble
              不会自动拿下的人工和半自动化支出。最窄的相关镜头是机器人拣选；Interact 2023 年收入基数只有 $303 million。正确结论不是某个数字为真、其他为假，而是 Nimble
              的现实市场落在这些层之间；任何把它们抹平成单一 TAM 的市场论证，都会遮住真实采用和范围风险。
