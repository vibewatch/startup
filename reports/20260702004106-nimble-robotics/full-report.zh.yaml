  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Nimble 已不适合再被理解成单一机械臂供应商。其公开材料描述的是一套打包履约系统，由自主机器人履约中心、运输层和 AI Cloud Logistics 平台组成，后者端到端管理订单、库存和路由 (CE001,
              CE005)。这套组合以服务形式销售，承诺无需前期投资、可弹性控制量、快速接入，而不是一项定制资本项目 (CE003, CE016)。物理核心是一台通用仓库机器人；Nimble
              称它可以存储、检索、拣选、包装、分拣、套装打包，并以其他方式处理覆盖极宽 SKU 基数的数百万件商品 (CE002, CE004)。模块集合比机器人本身更宽：Nimble
              还营销机器人增值服务、动态库存库位优化、承运商选择、封闭式存储、自动周期盘点，以及一个多节点网络，目标是在客户无需自建站点的情况下提供低成本两日覆盖 (CE005, CE014,
              CE015)。由此形成的模块地图具备差异化，因为 Nimble 把机器人、软件和 3PL 运营打包成一个方案；但量化价值主张很大一部分仍直接来自 Nimble 自有材料，而不是三方基准测试 (CE012,
              CE013, CE032)。
