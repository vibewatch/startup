          - type: paragraph
            body: >-
              部署证据显示 Nimble 确有运营历史，但公开路线图不完整。早期验证点是集成速度和生产使用：2021 年来源称，Nimble 无需 WMS 代码修改即可在第一天进入生产拣选，生产机器人每天已处理超过
              100,000 件商品 (CE006, CE008)。到 2023 年 3 月，Nimble 已把商业模式转向全国性机器人 3PL 网络，声称一到两天覆盖 96%+ 美国人口，并减少 75% 仓库面积
              (CE009, CE013)。TechCrunch 当时仍报道其设施只有 1 到 10 个，并承认人工操作仍存在，这意味着网络论点明显跑在完整技术闭环之前 (CE022)。2024 年 New Jersey
              上线是最清晰的逐节点扩张证据，显示一个服务多个产品品类的美国东海岸实体设施已经上线；FedEx 领投的 Series C 则明确把新资本绑定到机器人制造、系统部署和更多 R&D (CE014, CE019,
              CE036)。这个组合让路线图可读：更多节点、更多部署、更大制造规模。它尚未提供的是 2026 年已上线节点的当前公开清单、公开正常运行时间，或独立确认机器人分拣和完全无人值守运营已经在公司自述之外落地
              (CE021, CE035)。
