      - 置信度
      - 决策含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 这轮融资可信，但经济性和股权结构可见度仍太薄，不足以形成高信心
        - 中
        - 继续尽调；不要在价格不敏感的情况下强行入场
      - - 估值立场
        - 合理到偏贵
        - 战略验证真实存在，但公开证据尚不能证明当前收入或利润率支撑
        - 中
        - 把 $1B 视为合理可能，而不是明显便宜
      - - 主要优势
        - FedEx 牵头的战略验证
        - 一家规模化物流伙伴投资，并签署商业推广协议
        - 高
        - 让 Nimble 留在观察名单上
      - - 主要弱点
        - 运营经济性不透明
        - 没有公开披露收入、毛利率、留存或客户集中度
        - 高
        - 阻碍高信心投资测算
      - - 关键摇摆因素
        - 在运节点利用率和客户密度
        - 如果节点填得满、SLA 达标，$1B 标记会很快显得合理
        - 低
        - 只有 KPI 证据到位后才上调
    notes: 这条建议对证据和价格都敏感。问题不是 Nimble 是否令人印象深刻，而是公开证据能否以可接受置信度支撑当前价格。
