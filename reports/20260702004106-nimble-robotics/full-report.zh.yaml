        - 声称 100,000+ 个活跃智能体；3,000+ 个全球活跃站点
        - 运行混合车队和人工流程的零售商与 3PL
        - 供应商中立的编排加仓库机器人
        - 软件层可位于多种硬件选择之上，削弱单一栈差异化
        - 定制企业合同
      - - Berkshire Grey
        - SoftBank 持有；私有化后聚焦企业物流
        - 自动化拣选、分拣、包装和搬运的企业
        - 覆盖履约运营的 AI 驱动机器人任务解决方案
        - 相邻捆绑威胁，公开运营可见度更低
        - 定制企业合同
      - - Ocado Intelligent Automation
        - FY2024 集团收入 £3.156B；123 个在线模块；伙伴广泛铺开
        - 建设自动化履约网络的食品零售商和伙伴
        - 垂直整合的履约技术，并升级新机器人拣选
        - 强绿地基准，但行业经济性不同于 Nimble 的通用 3PL 路径
        - 大型系统和伙伴合同经济性，不是标价
      - - Amazon Robotics + Covariant
        - 官方披露 750,000+ 台机器人；2026 年报道接近 1M；Covariant 创始人和模型被吸收
        - Amazon 的自营履约网络和内部运营团队
        - 超大规模内部自动化和 AI 工作站迭代
        - 凭数据和学习速度构成潜在进入者风险，但今天不面向第三方销售
        - 自营内部投资，不是面向商户的定价
      - - 现状 / 内部自建
        - 不需要供应商融资；可选择性做点状方案 capex
        - 优先考虑灵活性、低扰动或既有 WMS 纪律的运营商
        - 人工加内部流程调整，再加定向自动化
        - 当全节点外包或重建不划算时，这是最常见替代方案
        - 人工 opex 加选择性项目 capex
    notes: 本表列出保留公开来源包中，对决策最关键的直接、既有、相邻、替代和潜在进入者选项。它刻意保留为部分清单，不穷举每个区域系统集成商或机器人拣选供应商。
