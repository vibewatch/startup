  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 核心下行情景从集成失手和订单量不足开始，传导到 SLA 证明走弱、单位经济性变差、 资本需求上升和估值支撑下降。
    approximationNotes: 传导路径是从保留公开证据推断出的分析性因果链，不是随机模型。
    data:
      nodes:
        - id: n1
          label: 集成失手
          detail: 硬件、软件和工作流跑不出设计 ROI
        - id: n2
          label: 人工例外持续存在
          detail: 节点仍部分依赖人员，服务投入重
        - id: n3
          label: 站点利用不足
          detail: 客户量未按计划填满网络
        - id: n4
          label: SLA / 正常运行时间压力
          detail: 服务水平、吞吐或可靠性走弱
        - id: n5
          label: 单位经济性走弱
          detail: 劳动力节省和回本不及主张
        - id: n6
          label: 需要更多资本
          detail: 证明成熟前，扩张就需要融资
        - id: n7
          label: 估值支撑收缩
          detail: 投资者会给亮眼机器人叙事打折
      edges:
        - to: n2
          label: 复杂系统仍高度依赖操作人员
          from: n1
        - to: n4
          label: 工作流协调落空
          from: n1
        - to: n4
          label: 峰值效率始终未兑现
          from: n3
        - to: n5
          label: 服务成本持续存在
          from: n2
        - to: n5
          label: 罚金 / 返工 / 周转变慢
          from: n4
        - to: n6
          label: 现金生成滑坡
          from: n5
        - to: n7
          label: 后续融资稀释风险
          from: n6
        - to: n7
          label: 标题级主张失去可信度
          from: n5
    claimRefs:
