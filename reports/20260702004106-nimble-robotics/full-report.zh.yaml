      - number: '4.4'
        title: 财务结论与披露阻碍
        blocks:
          - type: paragraph
            body: >-
              概括 Nimble 财务状况，最好的说法是“商业上说得通，但受披露限制”。公司有经核实的融资历史，有 FedEx 这样的战略投资人兼伙伴，有具体客户和节点验证，也有与 3PL
              自动化支出方向相吻合的服务模式。但这些都不能替代缺失的私营公司指标；这些指标才决定模式是复利还是烧钱。公开可比公司把缺口照得很清楚。Symbotic 的官方业绩和 SEC
              文件披露收入、现金、积压订单、服务收入类别，甚至披露其通过 Walmart 承担的极端集中度风险；Nimble
              没有披露任何对应指标。结论并不是对模式本身给出负面判断，而是公开资料还不足以支撑投资判断。没有当前收入、毛利、现金、burn、客户集中度、合同经济性或节点级利用率，本章可以支持对模式逻辑和尽调优先级的看法，但不能判断实际财务质量或
              runway 是否足够。
