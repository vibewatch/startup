  - id: TM003
    title: 细分 / 买方地图
    columns:
      - 细分
      - 买方
      - 用户
      - 付款方 / 预算负责人
      - 工作流
      - 采用触发因素
      - Nimble 适配 / 不适配原因
    rows:
      - - 成长型 DTC 品牌
        - 创始人、运营负责人或履约经理
        - 仓库 / 履约运营团队
        - COO、财务或创始人
        - 包裹履约，需求量波动且快速 SLA 压力高
        - 需要 2 日达覆盖，但不想自建机器人
        - 适配度强，因为 Nimble 声称无固定成本且可试点式进入；若货量太低或品类组合太特殊，则适配较弱
      - - 中端全渠道品牌
        - 供应链或电商运营负责人
        - 履约、库存和客服运营团队
        - COO 或供应链预算负责人
        - 分布式库存和混合 DTC 需求
        - 需要多节点覆盖和承运商优化
        - 当运输加履约经济性比资产所有权更重要时，适配度好
      - - 大型企业零售商 / 品牌
        - 供应链 VP 或网络设计负责人
        - 站点运营、集成和采购团队
        - 含财务的跨职能 capex / opex 委员会
        - 复杂多节点履约和退货项目
        - 需要网络重设计、韧性和服务提升
        - 举证压力最高，因为集成、合规和连续性与节省人工同样重要
      - - 退货量大的商户
        - 退货或逆向物流负责人
        - 退货运营与仓库主管
        - 供应链或运营财务负责人
        - 质检、重新包装和重新入库流程
        - 需要降低单次处理成本，并守住出库产能
        - 相邻机会有依据，因为 FedEx 规模和 Mordor 披露的退货增长都让逆向物流具备战略重要性
      - - 战略平台 / 承运商伙伴
        - 伙伴总经理或履约业务负责人
        - 项目、网络和商业团队
        - 业务单元管理层
        - 渠道扩张与外包节点落地
        - 不想自建全部产能，又需要更大覆盖
        - FedEx 证明这条路径可走，但目前公开披露的伙伴很少
    notes: 买方、用户和付款方字段基于 Nimble 定位、FedEx 表述和自动化 ROI 文献推断，并非来自已披露的客户采购组织架构图。
