      - number: '4.3'
        title: 市场背景与资本强度
        blocks:
          - type: paragraph
            body: >-
              公开市场和市场研究背景让 Nimble 的模式更容易理解，也更难轻率评估。Mordor Intelligence 认为仓库自动化市场将从 2025 年约 $29.98 billion 增至 2026 年
              $34.17 billion，并在 2031 年达到 $65.74 billion；北美电商仓库支出持续扩大，完全自动化站点增速快过整体市场。这是乐观面。悲观面同样重要：Interact Analysis
              报道称机器人拣选市场增长很快，但长期预期被下修；2023 年客户更偏好 CapEx 模式而非 RaaS；供应商不稳定和关税驱动的不确定性拖慢了 2025 年投资预期。Mordor 还单独把高前期
              CapEx、长回本周期和 WMS 集成复杂性列为核心约束。这些点对 Nimble 很重要，因为它的方案不是轻量软件层，而是把机器人、物理站点、编排和运输结果打包。行业顺风真实存在，验证负担也同样真实。
