  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、安全与法律风险
        blocks:
          - type: paragraph
            body: >-
              Nimble 在公开法律和监管层面得到的最强信号，不是公司已有已知执法行动，而是它想要自动化的仓库环境仍高度暴露在工人安全、事故记录和劳工政策审查之下。OSHA 针对 Amazon 的案件和参议院 HELP
              调查都说明，一旦吞吐压力跑在控制措施前面，高度自动化仓库仍会积累人体工学风险、工伤记录争议和全公司层面的整改义务。Nimble
              还把拣选、包装、存储、取回和分拣的广泛自动化作为卖点，这意味着未来任何场地事故都将落在一整片运营面上，而不是落在狭窄的点式解决方案足迹上。安全之外，Nimble
              的专利轨迹也显示，它正在围绕网格存储、末端执行器、穿梭车、远程操作和交付系统快速外扩 IP
              边界。战略上这是好事，但在假设护城河干净且完全可执行之前，自由实施、权属转让链和竞争重叠尽调也应放在一线法律工作里。公开材料没有披露 Nimble
              运营场地的事故率、质保索赔或监管往来，因此法律下行更多由盲区定义，而不是由已证实问题定义。政策层也在变化。Berkeley Labor Center
              指出，美国工作场所技术规则仍未定型；随着自主仓库更常见，监控、报告和工人治理预期收紧的概率会上升 (CR045)。
