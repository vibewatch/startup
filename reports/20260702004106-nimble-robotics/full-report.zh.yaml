        - 降低采用摩擦，但尽调重点转向服务毛利和 SLA 经济性
      - - Symbotic
        - 大型多年期系统和软件协议
        - 密集存储、机器人、AI 软件、开发工作
        - 没有标准公开标价
        - 最适合愿意为长期部署和大型设施投入资金的买方
      - - Dexterity
        - 流程级企业项目或试点模式
        - 客户自有站点内的机器人单元和 AI
        - 没有标准公开标价
        - 按定向 ROI 更容易论证，而不是按完整外包履约论证
      - - Locus Robotics
        - 灵活自动化扩张和 RaaS 式运营模式
        - AMR、编排、既有站点内劳动力生产率提升
        - 没有标准公开标价
        - 适合想不重建、渐进采用的买方
      - - GreyOrange / Berkshire Grey
        - 围绕编排或任务自动化的定制企业合同
        - 混合车队软件、机器人流程或打包履约任务
        - 没有标准公开标价
        - 让买方解决更窄流程痛点，而不必采用 Nimble 的服务外壳
      - - Ocado / Amazon 式大型平台替代方案
        - 大型系统或自营网络经济性
        - 平台规模的履约自动化
        - 没有面向商户的公开标价
        - 把吞吐和学习速度基准抬高，但集成负担重得多
    notes: 本章查阅的公开来源更清楚地描述包装、部署形态和战略方向，而不是披露每单、每台机器人、每个站点或每条 SLA 条款的实际价格。不透明或未知定价是市场特征，不是缺失行。
