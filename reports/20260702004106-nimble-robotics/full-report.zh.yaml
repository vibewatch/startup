    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与运营模式
        blocks:
          - type: paragraph
            body: >-
              Nimble 现在对外讲的故事，已经不太像零部件机器人供应商，而更像外包自主履约平台。当前官网承诺用 AI 驱动的机器人自主完成电商订单，再把这项履约服务叠上运输优化和 AI
              云物流控制层。这个表述明显不同于狭义机械臂或改造式自动化故事：客户买的是服务结果、节点能力和物流编排，不只是一个机器人单元。最强旁证来自 FedEx 和 TechCrunch，两者都把 Nimble 描述为全自主
              3PL
              或履约网络模式的一部分，而不只是仓库改造工具。公开证据也把公司推到后期私营公司区间：创始人仍在掌舵，叙事成分还重，但已经拿到战略物流巨头背书，并在出售一个依赖仓库、机器人、软件和承运商协同跑起来的宽运营模式。
