      - number: '2.4'
        title: 约束、冲突与采用放缓因素
        blocks:
          - type: paragraph
            body: >-
              短期问题不是自动化是否重要，而是哪种形态能足够快地通过预算闸门并落地。Interact 2025
              年更新显示，既有场地改造、定向项目和有积压订单支撑的固定自动化，比大型新站点承诺更稳；关税、高利率和移动机器人下修则把复苏继续往后推。这对 Nimble 很关键，因为外包服务模式既可能被看成绕开 CapEx
              的捷径，也可能在谨慎市场里被看成又一个供应商依赖。公开证据在这里确实相互打架：有些来源仍把 RaaS 和服务式定价描述成降低门槛的顺风，但 Interact 的机器人拣选研究说，客户最近更偏好 CapEx 而非
              RaaS，并更仔细审查供应商稳定性。集成风险让这组矛盾更重要。BCG 和 PeakLogix
              都认为，很多项目失败不是因为机器人不能工作，而是网络设计、系统集成、培训和持续优化断裂。再加上安全、人体工学和劳工反弹，真正的市场约束就变成对全系统交付的信任，而不是抽象的自动化意愿。
