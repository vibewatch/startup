    title: 护城河 / 准备度 KPI 快照
    type: kpi
    layout: compact
    summary: 简要概括哪些竞争压力最影响 Nimble 的耐久性。
    data:
      items:
        - label: 最强规模化标杆
          value: Symbotic
          note: 公开收入、积压订单和资本可得性，让它成为任何私营进入者最难对标的规模基准。
        - label: 最接近的直接工作流重叠
          value: Dexterity
          note: 机械臂操作栈是最清晰的同类技术威胁，即便它没有 Nimble 的外包节点模式。
        - label: 摩擦最低的替代方案
          value: Locus / brownfield AMRs
          note: 买方不用外包设施，也不用重建节点，就能提高劳动生产率。
        - label: 最大软件层威胁
          value: GreyOrange orchestration
          note: 供应商无关的工作流控制可能削弱任何单一机器人栈的价值。
        - label: 最重要护城河
          value: FedEx-enabled network access
          note: 当联盟可持续时，运输和退货基础设施让 Nimble 不只是机器人供应商。
        - label: 最大投资研判缺口
          value: Realized unit economics
