  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐仍保持谨慎：战略验证和品类上行虽强，但收入、利润率和条款证据仍卡在瓶颈。
    approximationNotes: 该流程图映射保留公开证据暗示的决策链；它是定性判断，不是概率模型。
    data:
      nodes:
        - id: proof
          label: 证明：$106M Series C，估值 $1B；FedEx 商业联盟
          type: input
        - id: market
          label: 顺风：仓储自动化仍是有融资支持的增长品类
          type: input
        - id: gaps
          label: 缺口：无公开收入、毛利率、集中度或 Series C 条款
          type: process
        - id: risk
          label: 约束：Attabotics、Locus 和 Ocado/Kroger 带来板块谨慎情绪
          type: process
        - id: rec
          label: 推荐：跟踪 / 继续研究
          type: output
      edges:
        - to: gaps
          label: 锚点可信，但投资判断未闭环
          from: proof
        - to: gaps
          label: 只有品类上行还不够
          from: market
        - to: rec
          label: 阻断信心
          from: gaps
        - to: rec
          label: 迫使价格纪律
          from: risk
