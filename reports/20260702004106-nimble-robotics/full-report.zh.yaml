      - number: '6.3'
        title: 留存、耐久度与缺失数据
        blocks:
          - type: paragraph
            body: >-
              公开耐久度证明明显弱于采用证明。本次查阅来源没有披露 NRR、GRR、logo 流失、续约率、平均合同期限或 2024 年后的客户数量更新，也没有来源浮现单客户收入或席位数数据 (CU029, CU030,
              CU036)。实际含义是，公开记录能回答 Nimble
              是否能赢得早期客户，却不能回答这些客户是否加深使用、续约，或带来集中收入风险。一些间接信号是正面的：官网声称试点结构可无罚金退出，并采用弹性按任务定价，这可以降低初始切换摩擦，并支持逐步扩张 (CU012,
              CU013)。但同样的商业特征不能告诉我们客户在试点后是否留下、是否随时间把更多量集中到 Nimble，或像 FedEx 这样的单一关系是否主导未来需求 (CU029,
              CU030)。因此今天能得出的最强留存相邻结论是负面而非正面：公司尚未发布能让外部投资人有信心验证客户耐久度的指标 (CU029, CU036)。
            claimRefs:
              - CU012
