        - 用于判断 $1B 是便宜、合理还是偏贵
        - 管理层资料包和财务尽调
      - - 毛利率和服务成本
        - 仓库级贡献利润率、用工结构和维护负担
        - 决定自动化经济性是真的更优，还是只具备战略吸引力
        - CFO 复核和站点模型逐项讲解
      - - 客户集中度
        - 头部客户、FedEx 占比、流失率和扩张率
