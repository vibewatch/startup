- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current revenue and growth
    - Latest ARR / revenue run-rate and growth by cohort or node
    - Needed to judge whether $1B is cheap, fair, or stretched
    - Management packet and finance diligence
  - - Gross margin and service cost
    - Warehouse-level contribution margin, labor mix, and maintenance burden
    - Determines whether automation economics are truly superior or only strategically interesting
    - CFO review and site model walk-through
  - - Customer concentration
    - Top customers, FedEx share, churn, and expansion rates
    - Concentration can make a strategic round look stronger than the underlying customer base
    - Customer schedule and reference calls
  - - Operational KPIs
    - Uptime, pick rates, SLA attainment, and utilization by node
    - Separates compelling demos from durable operating proof
    - Site visits and KPI pack
  - - Series C terms
    - Preference stack, liquidation rights, and any strategic side letters
    - Headline post-money can hide very different common-equity outcomes
    - Legal / financing diligence
  notes: These asks are intentionally narrow and mechanical because the missing public evidence is valuation-critical, not
    cosmetic.
