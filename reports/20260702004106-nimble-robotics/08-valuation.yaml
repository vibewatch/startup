- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable / signal
  - Metric or evidence
  - Current public read
  - Why it matters
  - Limitation
  rows:
  - - Symbotic
    - Revenue, backlog, EV/sales, automation scale
    - 2024 revenue $1.822B; backlog ~$22.4B; EV/sales ~9.98x as of Jul 1 2026
    - Best public warehouse-automation scale anchor
    - Much larger and more mature than Nimble
  - - Ocado
    - Group revenue, tech-solutions revenue, partnership resets
    - FY24 group revenue £3.156B; tech solutions revenue £496.5M; Kroger later culled sites
    - Shows both platform scale and partnership fragility
    - Different end market and business mix
  - - Warehouse-automation market reports
    - Sector multiples and demand backdrop
    - MCF cites median NTM EV/EBITDA 13.6x; Meridian sees multiple expansion and active M&A
    - Frames how investors value the category
    - Sector averages are not company-specific
  - - Robotic-picking research
    - TAM and adoption timing
    - Interact sees 2023 revenue $303M rising to $3.3B by 2030, but with forecast cuts
    - Supports category upside while preserving realism on timing
    - Emerging market data can move quickly
  - - Sector downside precedents
    - Locus layoffs, Attabotics collapse, Ocado/Kroger resets
    - Proof that warehouse automation can de-rate fast when execution or financing slips
    - Improves downside calibration
    - Each precedent differs from Nimbles exact model
  notes: The table intentionally mixes public comps, sector-market-data, and cautionary precedents because no pure-play public
    Nimble analogue exists today.
  enumerationScope:
    coverage: partial
    basis: Rows capture the main public comp clusters and downside precedents that meaningfully inform Nimble’s valuation
      without pretending there is a single perfect warehouse-automation comp set.
