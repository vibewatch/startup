company:
  name: Nimble Robotics
chapter:
  number: 8
  title: Valuation
  summary: 'The strongest public valuation fact for Nimble Robotics is the October 2024 Series C: $106 million at a $1 billion
    post-money valuation led by FedEx, with multiple independent trade publications confirming the round and strategic alliance.
    That headline is credible as a financing event, but public evidence is still too thin on revenue, margins, retention,
    customer concentration, and cap-table terms to say whether the $1 billion mark is cheap, fair, or already pricing in aggressive
    scale assumptions. Relative to public and private warehouse-automation comparables, Nimble looks investable enough to
    keep tracking, yet too underdisclosed for a confident buy; the right stance on public evidence is track / research-more
    with medium confidence and a fair-to-stretched valuation posture.'
sections:
- id: valuation-anchor-and-disclosure-quality
  title: Current Valuation Anchor and Disclosure Quality
  body: 'Nimble has a real public valuation anchor, but not a complete public underwriting case. The core fact set is unusually
    clear for a private robotics company: Nimble said it closed a $106 million Series C at a $1 billion valuation in October
    2024; Business Wire carried the announcement; FedEx publicly confirmed a strategic investment and commercial alliance;
    and multiple trade outlets repeated the same financing terms. The disclosed funding history also sketches a sensible progression
    from the $50 million Series A in 2021 to the $65 million Series B in 2023 and then to the $106 million Series C, implying
    at least $221 million of publicly disclosed capital raised. What is missing is everything that determines whether the
    2024 unicorn mark was generous or conservative: public revenue, gross margin, retention, customer concentration, preferred
    terms, and current secondary pricing. Company-authored materials offer strong narrative proof around millions of items
    handled, national network expansion, and logistics-cost savings, but that is not the same thing as audited valuation support.
    The result is a valuation anchor with strong headline credibility and weak economic transparency. The disclosure gap widens
    once secondary databases enter the frame. Crunchbase-style financial summaries remain partial, modeled estimate sites
    diverge, and narrative business-model writeups can mark Nimble above its last primary-source financing value without adding
    new audited operating evidence (CV046, CV047, CV048).'
