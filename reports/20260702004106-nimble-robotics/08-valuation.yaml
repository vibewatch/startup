  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-and-margin
    missingEvidence: Current revenue, gross margin, and cohort economics for live nodes or customer cohorts.
    whyItMatters: These metrics are necessary to decide whether the $1 billion mark is cheap, fair, or already pricing in
      exceptional execution.
    diligencePath: Request finance packet with current revenue, gross margin, and warehouse-level contribution metrics.
    relatedQuestionRefs:
    - QV012
    - QV027
  - type: private-evidence-only
    severity: material
    topic: series-c-terms
    missingEvidence: Series C security terms, preference stack, liquidation rights, and any strategic side letters tied to
      FedEx.
    whyItMatters: Post-money valuation alone does not determine common-equity outcomes or whether the round embedded investor
      protections that change effective price.
    diligencePath: Review executed financing documents and cap table.
    relatedQuestionRefs:
    - QV028
    - QV021
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-node-utilization
    missingEvidence: Named customer list, volume concentration, renewal patterns, and utilization / SLA metrics by node.
    whyItMatters: A strategic round can look far stronger than the underlying business if one partner or a handful of customers
      dominate the proof set.
    diligencePath: Request top-customer schedule, site-level operating metrics, and reference-customer calls.
    relatedQuestionRefs:
    - QV004
    - QV021
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: secondary-or-bridge-signal
    missingEvidence: Current secondary indications or any later financing event that meaningfully updates the 2024 price anchor.
    whyItMatters: A single stale primary round is less informative in a volatile automation market where utilization, rates,
      and customer appetite can shift quickly.
    diligencePath: Request recent board materials, investor updates, and any secondary or bridge pricing data.
    relatedQuestionRefs:
    - QV028
    - QV026
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable-set coverage
    missingEvidence: A fuller company-by-company private and public comparable sheet with disclosed revenue, margins, and
      deployment models for each adjacent warehouse-automation vendor.
    whyItMatters: The current table intentionally clusters comparable frameworks because there is no perfect public Nimble
      analogue; a fuller comp sheet would sharpen both upside and downside ranges.
    diligencePath: Build an expanded comp file that includes direct workflow peers, mature platform operators, and recent
      private financing or M&A references.
    relatedQuestionRefs:
    - QV006
    - QV014
    relatedTableRefs:
    - TV004
