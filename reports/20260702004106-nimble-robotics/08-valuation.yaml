- id: comp-framework-and-market-context
  title: Comparable Framework and Market Context
  body: 'Nimble does not have a perfect public comparable, so valuation has to be triangulated from adjacent automation leaders,
    sector-market-data reports, and evidence of how public investors are pricing warehouse-automation growth. Symbotic is
    the cleanest high-growth public anchor because it combines large-scale automation, AI-enabled orchestration, and warehouse-system
    economics; its 2024 revenue, backlog, and current EV/sales multiple show what a scaled public leader can look like. Ocado
    is a useful but imperfect second anchor because it shows how large automated-fulfillment platforms can produce real revenue
    and EBITDA while still suffering partnership resets and site-level economics risk. Sector reports from MCF, Meridian,
    Baird, Interact Analysis, and Capstone all point in the same direction: investors still value automation highly because
    of labor scarcity, supply-chain resilience, and AI-driven productivity, but the market has become more selective about
    vendor stability, project ROI, and whether end customers prefer CapEx ownership over pure service models. That mix makes
    Nimbles category attractive, but it also means the burden of proof has shifted toward hard deployment economics. Additional
    comp-set nuance reinforces discipline. Berkshire Grey shows one warehouse-automation route is strategic takeout rather
    than clean public-market compounding, Ambi shows specialized picking competition remains active, and integration-friction
    commentary keeps a lid on heroic adoption assumptions even when the category narrative is favorable (CV049, CV050, CV051).
    Nimble''s own Series B framing also makes clear that the value bridge runs through network execution, not just technical
    novelty (CV045, CV052).'
