- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - FedEx rollout is slower than hoped, nodes are underutilized, and customers keep preferring capex-heavy ownership models
    - ~$650M-$850M implied value if investors compress the story toward lower-premium automation outcomes
    - Utilization misses, price pressure, follow-on financing need
    - Meaningful downside tail because public economics are still opaque
  - - Base
    - Strategic rollout progresses, but disclosure remains partial and adoption proves steady rather than explosive
    - ~$900M-$1.1B; the 2024 round broadly holds but does not look obviously mispriced in investor favor
    - Opaque revenue and margin support, competitive benchmark pressure
    - Highest-likelihood zone on current evidence
  - - Bull
    - FedEx commercialization and multiclient nodes show strong utilization, durable SLAs, and visible economics
    - ~$1.2B-$1.5B if Nimble proves itself a scarce autonomous-fulfillment platform before peers catch up
    - Execution slip or cap-table overhang could still cap upside quickly
    - Plausible, but currently under-evidenced from public data
  notes: Scenario bands are analytical estimates inferred from public market context, strategic validation, and downside precedents.
    They are not company guidance or a formal DCF.
