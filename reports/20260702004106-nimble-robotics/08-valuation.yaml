- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - FedEx commercialization miss
    - No meaningful new rollout proof or referenceable customer expansion over the next 12 months
    - Strategic validation stops compounding into revenue confidence
    - Hold or downgrade conviction; do not underwrite premium growth
  - - Node underutilization or closures
    - Paused sites, disclosed benchmark misses, or restructuring at live nodes
    - The autonomous 3PL model starts to look more like a capital-intensive experiment than a scalable platform
    - Re-cut scenario values toward bear range
  - - Financing below the 2024 unicorn mark
    - Down round, heavy structure, or bridge financing caused by operating shortfall
    - Signals that internal economics are not de-risking fast enough
    - Assume higher dilution and weaker valuation support
  - - CapEx preference overwhelms outsourcing demand
    - Large customers choose ownership-oriented models over Nimble-like service economics
    - Shrinks TAM for Nimbles current commercial model
    - Reduce multiple assumptions and adoption pace
  - - Persistent disclosure gap
    - Revenue, margin, concentration, and term-sheet visibility remain absent deep into diligence
    - Evidence quality stays too weak for a priced call
    - Keep recommendation at track / research-more
  notes: These are the observable events most likely to change the recommendation, not generic macro worries.
