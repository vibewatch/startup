- id: diligence-asks-and-thesis-breaks
  title: Diligence Asks and Thesis-Break Triggers
  body: 'Nimble remains worth following because the strategic ingredients are real: a credible funding round, a scaled logistics
    partner, a meaningful automation category, and a product story that independent trade sources treat seriously. But valuation
    confidence is capped by the exact data still missing from the public record. Investors need current revenue, gross margin,
    customer concentration, uptime and utilization by node, reference-customer evidence, and the security terms of the Series
    C before deciding whether $1 billion is fair or stretched. The most important thesis-break triggers are likewise measurable:
    a FedEx rollout miss, evidence that customer nodes are underutilized or below SLA, a financing event below the 2024 unicorn
    mark, or proof that CapEx-preferring buyers are less willing than expected to outsource core fulfillment economics to
    Nimble. Until those questions are answered, the right public-evidence recommendation is track / research-more rather than
    a price-insensitive buy.'
