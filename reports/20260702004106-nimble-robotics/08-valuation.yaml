- id: scenario-view-and-recommendation
  title: Scenario View and Recommendation
  body: 'Because Nimble does not disclose revenue, the most supportable public valuation technique is reverse math rather
    than a false precision model. At a 10x EV/sales lens roughly in line with Symbotics current market multiple, a $1 billion
    valuation implies about $100 million of annual revenue. At 8x, the implied revenue requirement rises to about $125 million;
    at 6x, it rises to about $167 million; at 12x, it falls to about $83 million. None of those thresholds is impossible for
    a fast-scaling autonomous 3PL, especially with FedEx as a strategic channel, but none is verifiable from public data today.
    The bull case is that FedEx commercialization plus multiclient node expansion turns Nimble into a scarce autonomous-fulfillment
    platform before the robotic-picking market matures. The bear case is not that the technology is fake; it is that utilization,
    rollout speed, or competitive pricing eventually look more like the underwhelming side of warehouse automation than the
    premium side. The base case is therefore valuation credibility without conviction: the $1 billion mark is believable,
    but public evidence does not yet support an aggressive entry stance.'
