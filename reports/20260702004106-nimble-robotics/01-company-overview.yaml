- id: milestones-open-metrics-and-adverse-context
  title: Milestones, Open Metrics, and Adverse Context
  body: 'The chapter’s biggest caution is not that Nimble lacks milestones; it is that the public record still leaves several operating metrics unresolved. The homepage markets 1M-plus SKUs handled and 15 customers with $100M-plus in sales, but not a total customer count. Forbes provided an early 2021 ARR expectation of $4 million, yet no current revenue, margin, or run-rate disclosure appears in the 2024-2026 pack. Headcount is likewise fuzzy: Tracxn shows 321 employees while Clay shows a 101-250 band, and neither number is confirmed by the company. The same uncertainty appears in valuation chatter. Primary sources anchor the verified story on the October 2024 $1.0 billion Series C, while a later low-reputation December 2025 article claims a $1.1 billion valuation without any corroborating primary financing event. Finally, the category backdrop is not frictionless: Supply Chain Dive reported a 30% drop in North American robot sales in 2023, and VOA covered organized labor resistance to
    automation. Nimble therefore has real strategic validation, but still carries disclosure, execution, and adoption-risk caveats that belong in the overview rather than being deferred to later chapters.'
