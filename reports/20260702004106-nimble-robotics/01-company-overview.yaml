company:
  name: Nimble Robotics
chapter:
  number: 1
  title: Company Overview
  summary: Nimble Robotics is a founder-led San Francisco warehouse-automation company that now brands simply as Nimble and positions itself as a fully autonomous fulfillment / robotic 3PL platform rather than only a pick-pack robotics vendor. Primary sources support an October 23, 2024 $106 million Series C at a $1.0 billion valuation led by FedEx and co-led by Cedar Pine, following a $50 million Series A in 2021 and a $65 million Series B in 2023. The company has real customer, board, and IP proof, but public disclosure still leaves current revenue, exact live-node count, total customer count, full governance depth, and reliable headcount unresolved.
sections:
- id: identity-stage-and-operating-model
  title: Identity, Stage, and Operating Model
  body: 'Nimble now presents itself less as a component robotics vendor and more as an outsourced autonomous fulfillment platform. Its current homepage promises AI-powered robots that can autonomously fulfill ecommerce orders, then layers that fulfillment offer with transportation optimization and an AI cloud-logistics control layer. That is a materially different framing from a narrow robotic arm or retrofit-automation story: the customer is buying a service outcome, node access, and logistics orchestration, not simply a robot cell. The strongest corroboration comes from FedEx and TechCrunch, both of which describe Nimble as part of a fully autonomous 3PL or fulfillment-network model rather than only a warehouse retrofit tool. Public evidence also places the company in late-stage private-company territory: it is founder-led, still narrative-heavy, but already backed by a strategic logistics incumbent and selling a broad operating model that depends on warehouses, robots, software, and carrier
    coordination together.'
  claimRefs:
