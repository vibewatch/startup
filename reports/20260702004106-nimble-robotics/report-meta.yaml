companyProfile:
  summary: Nimble Robotics, now branded publicly as Nimble, is a San Francisco warehouse-automation company that combines general-purpose warehouse robots, Nimble-operated fulfillment centers, transportation orchestration, and a cloud logistics platform into a robotic 3PL offer. The company targets ecommerce brands, retailers, and platform operators that want faster fulfillment, broader SKU handling, and lower labor intensity without building their own automation stack. Public evidence supports real production deployments, a strategic FedEx partnership, and a growing patent estate, but still leaves revenue, margins, customer concentration, and live-node economics materially underdisclosed.
  foundedDate: '2017-01-01'
  founders:
    - name: Simon Kalouche
      role: Founder & CEO
      background: Carnegie Mellon-trained roboticist who paused a Stanford PhD and built Nimble around warehouse-automation and autonomous-fulfillment execution.
      claimRefs: [CO008, CO009, CO010]
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: General-purpose warehouse robots plus a cloud logistics platform and Nimble-run fulfillment nodes that perform storage, retrieval, picking, packing, sorting, kitting, and transportation orchestration as a service.
  customerFocus: Ecommerce brands, retailers, and logistics platforms seeking outsourced robotic fulfillment and faster delivery coverage
  businessModel: Robotics-as-a-service / autonomous 3PL with task-based outsourced fulfillment pricing
