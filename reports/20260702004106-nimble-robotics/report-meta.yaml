  topStrengths:
    - FedEx-led financing and commercial rollout provide rare strategic validation for a private warehouse-automation startup
    - General-purpose fulfillment architecture and patent depth differentiate Nimble from narrower point-solution robotics vendors
    - Public proof shows real production use cases across DTC brands, enterprise retail logos, and a growing multi-node network
  topRisks:
    - Revenue quality, gross margin, runway, and customer concentration remain underdisclosed relative to the unicorn valuation
    - Scaling autonomous 3PL nodes requires difficult integration, utilization, safety, and field-service execution that public data does not yet clear
    - Valuation support depends heavily on successful FedEx commercialization and broader network economics rather than on disclosed standalone financial performance
  unresolvedGaps:
    - Current revenue, gross margin, burn, and cash runway are not publicly disclosed
    - Live-node count, utilization, uptime, and site-level unit economics are not publicly verified
