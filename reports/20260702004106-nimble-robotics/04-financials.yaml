- id: market-context-and-capital-intensity
  title: Market context and capital intensity
  body: 'Public market and market-research context make Nimble’s model easier to understand but harder to underwrite casually. Mordor Intelligence sees the warehouse-automation market growing from about $29.98 billion in 2025 to $34.17 billion in 2026 and then to $65.74 billion by 2031, while North American ecommerce-warehouse spend continues expanding and fully automated sites grow faster than the broader market. That is the bullish side. The bearish side is just as important: Interact Analysis coverage says the robotic-picking market is growing rapidly but long-term expectations were revised down, customers preferred CapEx models to RaaS in 2023, and supplier instability plus tariff-driven uncertainty slowed 2025 investment expectations. Mordor separately identifies high upfront CapEx, long paybacks, and WMS integration complexity as core restraints. Those points matter for Nimble because its offer is not a lightweight software layer; it bundles robots, physical sites, orchestration, and
    transportation outcomes. The sector tailwind is real, but so is the proof burden.'
