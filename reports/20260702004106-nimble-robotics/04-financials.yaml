  - - Strategic partner / network expansion economics
    - Potential revenue expansion through FedEx channel and broader node footprint
    - Program-level
    - Strategic importance is clear; revenue-share terms are undisclosed
    - Low
    - Request FedEx commercialization, utilization, and revenue-share structure
  notes: Rows capture the revenue surfaces explicitly visible in public materials; none of the retained sources disclose realized pricing, mix percentages, or gross margin by stream.
