- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Why it matters
  - Exact diligence path
  rows:
  - - Current revenue and growth
    - High
    - Needed to judge whether the model is scaling into or away from the $1B valuation anchor
    - Request current monthly / quarterly revenue bridge and year-over-year growth by stream
  - - Gross margin and contribution margin
    - High
    - Determines whether robotic 3PL economics improve with scale or remain capital hungry
    - Request gross margin by stream and node-level contribution margin
  - - Cash, burn, and runway
    - High
    - Decides whether current funding is comfortably sufficient before the next financing need
    - Request cash balance, burn bridge, and runway scenario model
  - - Customer concentration and retention
    - High
    - Large customers or partners can make utilization look better than the diversified demand base really is
    - Request top-customer mix, expansion, churn, and FedEx-linked concentration
  - - Node utilization and working capital
    - High
    - Owned-node economics depend on density, SLA attainment, and inventory / lease burden
    - Request throughput, occupancy, SLA attainment, and working-capital data by node
  notes: These are the smallest set of private metrics needed to turn the chapter from model logic into true financial underwriting.
