- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Current public revenue
    - null
    - low
    - Without current revenue there is no basis to test growth quality against the $1B valuation anchor
    - Request current revenue, prior-year revenue, and revenue mix by stream
  - - Gross margin by stream
    - null
    - low
    - Needed to determine whether fulfillment scale is economically attractive or only strategically impressive
    - Request gross margin split across fulfillment, transportation, and platform/service layers
  - - Customer concentration
    - null
    - low
    - A strategic round can mask heavy dependence on a few accounts or channel partners
    - Request top-10 customer contribution and FedEx-related share
  - - Node utilization / density
    - null
    - low
    - Utilization determines whether owned or controlled infrastructure creates leverage or burn
    - Request utilization, order density, and throughput by node
  - - Contract pricing realization
    - null
    - low
    - Marketing claims say little about revenue quality without realized contract economics
    - Request realized ASP or effective price per order/task by cohort
  - - Headcount / burn proxy
    - Third-party headcount data exists but is inconsistent
    - low
    - Burn inference is unreliable without a confirmed employee base or expense bridge
    - Request employee count and opex by function
  - - Market demand context
    - 3PL automation demand is real, but CapEx preference and supplier instability are current headwinds
    - medium
    - Explains why the model may scale more slowly than a headline TAM suggests
    - Request closed-won / lost reasons, payback thresholds, and sales-cycle data
  notes: Null cells represent private-company metrics that were not disclosed publicly and should not be backfilled from guesswork.
