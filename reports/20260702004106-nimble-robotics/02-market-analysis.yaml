- id: FM004
  title: Adoption path and gating flow
  type: flow
  layout: wide
  summary: Nimble’s market path starts with service pain and pilotable economics, then either compounds through proof and partner leverage or stalls on integration, supplier-trust, and safety concerns.
  data:
    nodes:
    - id: pain
      label: Service + labor pain surfaces
      detail: E-commerce brands face labor volatility, faster-delivery pressure, and returns complexity.
      tone: neutral
    - id: pilot
      label: Managed-service pilot becomes plausible
      detail: No-fixed-cost and low-friction entry can reframe the discussion away from heavy upfront robotics capex.
      tone: positive
    - id: proof
      label: Integration and operating proof required
      detail: Buyer now tests ramp speed, WMS/WCS burden, SLA consistency, and actual cost per order.
      tone: warning
    - id: partner
      label: Partner or multi-node scale unlocks expansion
      detail: FedEx-like channels can widen reach if Nimble proves network and returns value.
      tone: positive
    - id: risk
      label: Market headwinds can freeze progression
      detail: Tariffs, supplier instability, brownfield bias, and labor-trust issues slow decisions.
      tone: warning
    - id: scale
      label: Durable adoption only after full-system trust
      detail: The market ultimately rewards reliable service delivery, not robotics theater.
      tone: neutral
    edges:
    - from: pain
      to: pilot
      label: ROI and service gap create urgency
    - from: pilot
      to: proof
      label: customer asks for live evidence
    - from: proof
      to: partner
      label: good proof can widen route to market
    - from: proof
      to: risk
      label: weak proof or vendor doubts delay purchase
    - from: partner
      to: scale
      label: network trust compounds
    - from: risk
      to: scale
      label: only resolved by credible operating proof
  approximationNotes: This flow is a synthesized market logic map based on retained evidence, not a disclosed Nimble sales funnel or pipeline conversion report.
