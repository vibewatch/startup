tables:
- id: TM001
  title: Market definition table
  columns:
  - Lens / segment
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Nimble
  rows:
  - - Global warehouse automation
    - Warehouse hardware, software, and services across industries and applications
    - Non-warehouse industrial automation, pure parcel transport, and generic labor-only 3PL spend
    - Warehouse ops, engineering, automation, and capex owners
    - Useful directional TAM, but far broader than Nimble’s outsourced fulfillment wedge
  - - North America e-commerce warehouse market
    - Fulfillment-center operations, storage, value-added services, and automation levels in NA e-commerce warehouses
    - Non-e-commerce warehousing, non-NA geographies, and upstream manufacturing automation
    - Retailers, brands, 3PLs, and supply-chain operators
    - Best public upper-bound service lens because Nimble sells fulfillment capacity, not only robots
  - - Robotic picking market
    - Manipulation robots moving packages, cases, and eaches between warehouse workflows
    - Storage systems, transport management, and warehouse labor/services outside robotic picking
    - Warehouse engineering and automation buyers
    - Closest technology overlap, but too narrow for Nimble’s bundled service model
  - - Returns / reverse-logistics automation
    - Inspection, triage, and handling work inside warehouse returns zones
    - Linehaul transport and consumer-facing parcel services
    - Returns leaders, supply-chain ops, and partner networks
    - Important adjacency because FedEx scale and Nimble economics both benefit from returns density
  - - Nimble practical SAM
    - North America outsourced autonomous fulfillment for e-commerce and omnichannel brands needing fast launch, multi-node reach, and robotics-enabled service levels
    - Captive Amazon/internal automation, manual-only 3PL contracts, and unrelated pallet-only automation projects
    - Ops leaders plus COO / finance where service economics reshape the network
    - Underwrite as a service-layer slice that lives between the broad warehouse TAM and the narrow robotic-picking core
  notes: Rows mix third-party market definitions with author boundary logic; the Nimble practical SAM row is an evidence-constrained framing lens rather than a company-disclosed segment.
