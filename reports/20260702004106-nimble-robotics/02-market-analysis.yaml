- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  - Why Nimble fits / does not fit
  rows:
  - - Growth DTC brands
    - Founder, ops lead, or fulfillment manager
    - Warehouse / fulfillment ops team
    - COO, finance, or founder
    - Parcel fulfillment with volatile volume and fast-SLA pressure
    - Need 2-day reach without building internal robotics
    - Strong fit because Nimble claims no fixed costs and pilot-style entry; weaker if volumes are too low or assortment too unusual
  - - Mid-market omnichannel brands
    - Supply-chain or ecommerce operations leader
    - Fulfillment, inventory, and customer-ops teams
    - COO or supply-chain budget owner
    - Distributed inventory and mixed direct-to-consumer demand
    - Need multi-node reach and carrier optimization
    - Good fit when transportation plus fulfillment economics matter more than asset ownership
  - - Large enterprise retailers / brands
    - VP supply chain or network design lead
    - Site ops, integration, and procurement teams
    - Cross-functional capex / opex committee with finance
    - Complex multi-node fulfillment and returns programs
    - Need network redesign, resilience, and service lift
    - Proof burden is highest because integration, compliance, and continuity matter as much as labor savings
  - - Returns-heavy merchants
    - Returns or reverse-logistics leader
    - Returns ops and warehouse supervisors
    - Supply-chain or operations finance owner
    - Inspection, repack, and re-entry workflows
    - Need lower touch-cost and protected outbound capacity
    - Relevant adjacency because FedEx scale and Mordor returns growth both make reverse logistics strategically important
  - - Strategic platform / carrier partner
    - Partner GM or fulfillment business leader
    - Program, network, and commercial teams
    - Business-unit leadership
    - Channel expansion and outsourced-node enablement
    - Need broader reach without building all capacity internally
    - FedEx proves this path exists, but few partners are publicly disclosed today
  notes: Buyer, user, and payer fields are inferred from Nimble positioning, FedEx framing, and automation ROI literature rather than from disclosed customer procurement org charts.
