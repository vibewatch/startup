  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: pricing-model
    missingEvidence: Buyer-level win-rate and contract data separating CapEx, RaaS, and managed-service procurement across Nimble-relevant warehouse cohorts.
    whyItMatters: Public sources conflict on whether service-style pricing lowers friction or whether buyers now prefer owned assets, which changes how credible Nimble’s go-to-market advantage really is.
    diligencePath: Request a 2025-2026 pipeline breakdown by contract structure and interview won/lost prospects against CapEx and RaaS alternatives.
    relatedQuestionRefs:
    - QM017
  - type: private-evidence-only
    severity: material
    topic: nimble-sam
    missingEvidence: Node-level revenue mix, customer mix, order profile, and geographic concentration needed to translate broad market lenses into a credible Nimble SAM.
    whyItMatters: Public TAM frames are too broad or too narrow without knowing which categories, order sizes, and node types Nimble can actually serve at scale today.
    diligencePath: Request revenue and volume by customer segment, by node, and by product category plus the share tied to apparel, beauty, electronics, and returns.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: realized-economics
    missingEvidence: Live-site utilization, throughput, launch-time, payback, and contract-duration data from Nimble-operated facilities.
    whyItMatters: The market case ultimately depends on whether Nimble clears integration, safety, and supplier-trust hurdles in production, not just in narrative form.
    diligencePath: Run reference calls with one live customer and one operating partner, and request pre/post metrics on cost per order, launch time, SLA performance, and renewal behavior.
    relatedQuestionRefs:
    - QM024
