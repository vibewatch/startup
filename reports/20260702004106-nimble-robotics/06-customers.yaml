- id: adoption-trajectory-and-proof-quality
  title: Adoption Trajectory and Proof Quality
  body: The adoption story is strongest where Nimble's public proof is specific about operational pain. TA3 says it turned
    to Nimble because manual fulfillment had become expensive and difficult to scale, and the company was able to launch within
    weeks before its peak summer season (CU005). FedEx says the alliance will let it scale FedEx Fulfillment across North
    America using Nimble's autonomous 3PL model, which is a much larger proof point because it links Nimble to an operator
    with 130-plus warehouses and 475 million returns annually (CU007, CU008). Nimble also publicly anchors the offer around
    96%+ U.S. coverage in one to two days, pilot programs with no-penalty outs, on-demand pricing, and plug-and-play integrations,
    all of which are adoption devices rather than pure technology claims (CU011, CU012, CU013, CU014). Even so, the proof-quality
    funnel narrows quickly. Many named logos come only from company-authored lists or title-only customer stories, and the
    strongest independent corroboration in the public record sits with FedEx rather than with a broad base of self-disclosing
    customers (CU017, CU019, CU031). The result is a customer set that looks commercially promising but still carries a reference-quality
    gradient between FedEx and the rest of the book (CU033, CU035).
  claimRefs:
