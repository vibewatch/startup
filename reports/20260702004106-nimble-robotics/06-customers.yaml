- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Observed signal
  - Impact
  - Diligence path
  rows:
  - - Pilot + no-penalty-out motion
    - Homepage lowers entry friction for new customers
    - Helps land accounts cheaply
    - Request pilot conversion and expansion rates
  - - Task-based on-demand pricing
    - Customers pay only for tasks performed and can flex volume
    - Supports gradual wallet-share growth
    - Request gross margin by volume tier and by customer segment
  - - FedEx channel leverage
    - Alliance may expose Nimble to SMB merchants via FedEx Fulfillment
    - Can accelerate distribution beyond direct sales
    - Clarify whether FedEx is reseller, operator, customer, or all three by workflow
  - - Evidence concentration
    - FedEx and TA3 are the only relationships with quoted operational rationale
    - Book quality may be less diversified than logo list suggests
    - Request reference calls from at least three non-FedEx customers
  - - Integration / go-live risk
    - Independent automation sources say many projects fail on integration and optimization
    - Can delay expansion after initial sale
    - Request post-launch ramp timelines and exception-handling metrics
  - - Labor / safety scrutiny
    - Warehouse automation still faces labor pushback and ergonomic oversight
    - Can slow adoption or require heavier change management
    - Review customer onboarding, training, and safety playbooks
  - - Vertical concentration
    - Most visible proof clusters in consumer and DTC categories outside FedEx
    - May limit cross-vertical pricing power and resilience
    - Request pipeline and active-customer mix by vertical
  notes: This table blends upside drivers and concentration risks because Nimble's current go-to-market relies on the same
    mechanisms—easy pilots, channel leverage, and referenceability—that also create dependency risk when evidence is thin.
