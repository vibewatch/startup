- id: retention-durability-and-missing-data
  title: Retention, Durability, and Missing Data
  body: 'Public durability proof is materially weaker than adoption proof. No reviewed source discloses NRR, GRR, logo churn,
    renewal rate, average contract term, or post-2024 customer-count updates, and no source surfaces per-customer revenue
    or seat count data either (CU029, CU030, CU036). In practical terms, that means the public record can answer whether Nimble
    can win early customers but not whether those customers deepen usage, renew, or drive concentrated revenue risk. Some
    indirect signals are positive: the homepage claims a pilot structure with no-penalty outs and elastic task-based pricing,
    which can reduce switching friction at the start and support gradual expansion (CU012, CU013). But those same commercial
    features do not tell us whether customers remain after the pilot, whether they consolidate volumes into Nimble over time,
    or whether a single relationship like FedEx dominates future demand (CU029, CU030). The strongest retention-adjacent conclusion
    available today is therefore negative rather than positive: the company has not yet published the metrics that would let
    an outside investor validate customer durability with confidence (CU029, CU036).'
  claimRefs:
  - CU012
  - CU013
  - CU029
  - CU030
  - CU036
  tableRefs:
  - TU004
- id: expansion-and-channel-leverage
  title: Expansion and Channel Leverage
  body: 'FedEx changes the shape of Nimble''s customer story because it is more than a simple reference account. Supply Chain
    Dive says FedEx Fulfillment is built to serve ecommerce and inventory-management needs for SMB merchants, which means
    the alliance potentially gives Nimble access to customer acquisition leverage beyond direct brand sales (CU033). Combined
    with Nimble''s own ecommerce integrations, the emerging go-to-market motion looks like a hybrid: direct selling to brands,
    plus channel distribution through a large logistics platform (CU014, CU034). The public evidence also suggests Nimble
    has learned to make the first step easy. The pilot program, no-penalty out clause, on-demand pricing, and rapid onboarding
    narrative all reduce the cost of customer experimentation (CU012, CU013, CU014). Where the expansion story becomes less
    clear is in cross-vertical depth. Outside of FedEx, the visible proof remains concentrated in consumer-oriented categories,
    and many logos are still company-authored rather than customer-authored (CU019, CU032). That means the best current expansion
    evidence is structural rather than statistical: the motion looks scalable, but published win-rate, expansion-rate, and
    post-launch volume data are still missing (CU030, CU036). FedEx''s own fulfillment page further supports the channel view
    by showing that the partner already sells outsourced ecommerce fulfillment as a merchant service, which makes Nimble more
    than a back-end robot vendor inside the relationship (CU037). Independent warehouse and fulfillment statistics also reinforce
    that the addressable customer pool remains active because merchants still face labor, service-level, and throughput pressure
    that favors outsourced automation-backed fulfillment options (CU038, CU039).'
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU019
  - CU032
  - CU033
  - CU034
  - CU036
  - CU037
  - CU038
  - CU039
  tableRefs:
  - TU005
- id: adoption-risks-and-adverse-signals
  title: Adoption Risks and Adverse Signals
  body: 'The adverse evidence does not say customers are failing, but it does show why scaling customer adoption could be
    harder than winning the first logo. BCG says many warehouse automation pilots never scale or miss ROI, and PeakLogix argues
    that most logistics transformation projects underdeliver because of poor integration, weak training, and lack of ongoing
    optimization (CU024, CU025). VOA''s reporting on port-worker resistance demonstrates that automation remains politically
    and socially contested, which matters because large warehouse customers still need to manage labor acceptance and process
    change even when the business case is attractive (CU026). The OSHA actions against Amazon make the risk more concrete:
    ergonomics and worker safety remain live regulatory issues for automated warehouse networks, which means customers will
    care not just about labor savings but about whether a vendor can operate safely at scale (CU027, CU028). For Nimble specifically,
    the main adoption risk is therefore not absence of interest; it is that the public record still leaves too much of the
    post-go-live story unmeasured. Buyers can see why the offer is attractive, but outsiders cannot yet see enough about durability,
    safety outcomes, or large-scale system performance to know how sticky the customer base will be (CU024, CU025, CU028,
    CU036).'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU036
  - CU040
