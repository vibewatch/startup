figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Nimble's public customer journey starts with low-friction pilot entry, then scales through outsourced-node usage
    and, in the strongest case, through a platform partner such as FedEx.
  data:
    items:
    - id: stage-1
      label: 'Stage 1: Manual-fulfillment pain surfaces'
      actor: Brand founder or ops lead
      touchpoint: Rising labor cost, slow onboarding, and 2-day delivery pressure
      outcome: Customer starts evaluating automated 3PL alternatives
    - id: stage-2
      label: 'Stage 2: Low-friction pilot'
      actor: Brand operations team
      touchpoint: Pilot with fraction of volume and no-penalty out clause
      outcome: Customer can test Nimble without capex or full migration
    - id: stage-3
      label: 'Stage 3: Go-live inside Nimble node'
      actor: Customer commerce + Nimble ops
      touchpoint: Integration into ecommerce systems and assignment to one or more nodes
      outcome: Orders begin flowing through robotic fulfillment
    - id: stage-4
      label: 'Stage 4: Volume flex and broader category handling'
      actor: Brand supply-chain team
      touchpoint: Use robots-on/off and category breadth to absorb peak demand
      outcome: Customer relies on Nimble as operating capacity rather than overflow
    - id: stage-5
      label: 'Stage 5: Channel amplification'
      actor: FedEx / broader platform partner
      touchpoint: FedEx Fulfillment alliance extends route to more merchants
      outcome: Nimble can win customers through a distribution partner, not only direct sales
    - id: stage-6
      label: 'Stage 6: Durable expansion (publicly unproven)'
      actor: Existing customer account
      touchpoint: Renewal, expanded volume, and more nodes
      outcome: This is where the public evidence becomes sparse today
  approximationNotes: The journey is reconstructed from homepage commercial terms, the TA3 launch story, the FedEx alliance,
    and practitioner commentary; Nimble does not publish an official funnel or cohort diagram.
