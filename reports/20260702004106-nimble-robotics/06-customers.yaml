company:
  name: Nimble Robotics
chapter:
  number: 6
  title: Customers
  summary: 'Nimble Robotics has credible but still uneven customer proof. The strongest public evidence is the FedEx alliance,
    which validates that a large logistics incumbent is willing to use Nimble''s technology and fully autonomous 3PL model
    at North American scale, while the TA3 SWIM launch shows the system can be sold into fast-growing DTC brands that need
    quick implementation and lower manual-fulfillment cost. The rest of the proof set is real but thinner: official materials
    name other recognizable brands and additional 2024 case-study titles, yet the public record still lacks updated customer
    counts, contract values, retention metrics, or independent post-deployment performance data, leaving concentration and
    durability harder to underwrite than initial adoption.'
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'The visible customer base clusters around ecommerce brands and the operators that serve them. Nimble sells robotic
    fulfillment as an outsourced service rather than as customer-owned infrastructure, which means the buyer is typically
    a brand operations or supply-chain owner, the daily user is the operations team running orders through Nimble nodes, and
    the payer is the merchant or enterprise outsourcing fulfillment (CU001, CU004). Public customer segmentation is strongest
    in consumer-oriented categories. Nimble and independent coverage explicitly name apparel, footwear, health and beauty,
    electronics, consumer packaged goods, general merchandise, and pharmaceuticals (CU015, CU016). The clearest production-style
    brand story is TA3 SWIM, while the clearest enterprise-scale relationship is FedEx. Beyond those, the company highlights
    additional DTC story titles and several recognizable retail logos, but the evidence gets shallower fast: many accounts
    are named without contract, usage-depth, or outcome disclosure (CU017, CU018, CU019). The homepage claim of 15 customers
    with more than $100 million in sales suggests the company has penetrated meaningful brand scale, but because the statement
    is unaudited and unsegmented, it does not reveal how much revenue comes from each cohort or whether those customers are
    concentrated in one vertical (CU002, CU030, CU032).'
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU015
  - CU016
