schemaVersion: report-v2
artifact: financials
slug: psiquantum
runDate: '2026-05-18'
company:
  name: PsiQuantum
chapter:
  number: 4
  title: Financials
  summary: >-
    PsiQuantum's public financial story is dominated by financing rather than operating disclosure.
    Official and independent sources confirm a $1 billion Series E, large Australian and Illinois
    public support packages, and a $10.8 million AFRL contract, but they do not disclose cash on
    hand, burn, gross margin, or a public price sheet for PsiQuantum's products. The underwriting
    question is therefore not whether capital has been raised, but whether public evidence is rich
    enough to convert that capital story into a credible revenue and margin model; today it is not.
sections:
  - id: revenue-model
    title: Revenue Model and Public Monetization Status
    body: >-
      PsiQuantum's public revenue picture is better described as undeclared than established.
      The company has announced large capital inflows — $1 billion of Series E equity, Australia's
      A$940 million co-investment package, Illinois grants and tax incentives, and a $10.8 million
      AFRL contract — but most of those dollars are financing inputs, not evidence of recurring
      commercial demand. The one clearly disclosed contract-like monetization item is the AFRL
      firm-fixed-price award, which funds chip delivery, BTO phase shifters, and software support
      through May 2027. Separately, PsiQuantum markets Construct, a fault-tolerant quantum
      algorithm platform for enterprises, governments, and researchers, but access is gated
      through an application form and the page publishes no public price, contract term, or paid
      user count. That leaves a likely three-layer revenue model: first, government or defense R&D
      contracts and potentially grant accounting; second, selective software or pilot engagements
      around Construct; and third, eventual site-scale compute or service contracts once Brisbane
      and Chicago move beyond prototypes. Public sources support the existence of each layer, but
      only the AFRL contract has a disclosed dollar amount tied to deliverables. From an
      underwriting perspective, the crucial distinction is between capital support, contract
      revenue, and future compute monetization; today's public disclosures are rich on financing
      and poor on realized recurring revenue.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI009
      - CI010
      - CI011
      - CI016
      - CI032
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-gtm
    title: Pricing Transparency, GTM Motion, and Traction Proxies
    body: >-
      Pricing transparency is effectively absent. PsiQuantum does not publish a QCaaS tariff,
      reserved-capacity rate, software subscription price, or hardware list price. Construct is
      positioned as software for enterprises, governments, and researchers, yet it is "currently
      available to only a limited set of expert users" with no guarantee of broader access timing.
      That suggests a negotiated enterprise or government sales motion rather than self-serve cloud
      commerce. Public traction proxies are therefore indirect: PitchBook flags the company as
      "Generating Revenue" and lists 544 employees, while Startup Daily and SmartCompany describe a
      global team of more than 500 people and a new test-and-assembly footprint for 300mm BTO
      wafers. None of these sources disclose customer count, contract backlog, ARR, or the rate at
      which site announcements convert into billable revenue. The likely go-to-market path is a
      long-cycle sovereign and strategic-enterprise procurement process in which customer-specific
      contracts, validation milestones, and infrastructure readiness matter more than marketing-led
      funnel metrics. CAC, payback, and utilization may exist internally, but public evidence only
      reveals a bespoke and technically intensive enterprise motion. That is acceptable for a
      frontier hardware company, but it means traditional software-style underwriting cannot yet be
      performed from public materials.
    claimRefs:
      - CI003
      - CI005
      - CI017
      - CI018
      - CI020
      - CI032
      - CI033
    tableRefs:
      - TI002
    figureRefs: []
  - id: unit-economics
    title: Unit Economics and Public Benchmark Corridor
    body: >-
      Direct unit economics are not publicly calculable. PsiQuantum's long-run thesis is attractive
      on paper: standardized high-volume foundry output, photonic networking over conventional
      fiber, and rack-like cryogenic architecture should be structurally more manufacturable than
      bespoke lab systems if yields and integration work. But the public benchmark corridor for the
      sector remains harsh. D-Wave's FY25 10-K reports $24.6 million of revenue against a $355.1
      million net loss and $72.0 million of operating cash outflow. DatacenterDynamics reports
      IonQ at $130 million of FY25 revenue with a $510.4 million annual net loss and Rigetti at
      $7.1 million of revenue with a $216.1 million net loss. These are not direct modality comps,
      but they are still the best public evidence for how much revenue quantum companies generate
      before scale and how persistent losses remain even after commercialization begins. For
      PsiQuantum, the missing fields are exactly the ones needed to test whether foundry leverage
      becomes economic advantage: gross margin, cost of revenue, utilization, working capital,
      sales cycle, and recognized revenue by product or contract type. Until those are disclosed,
      the best public "unit economics" view is a hybrid of company manufacturing claims plus peer
      public loss corridors.
    claimRefs:
      - CI024
      - CI025
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI038
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: capital-adequacy
    title: Capital Adequacy and Capital Intensity
    body: >-
      Capital support is visible, but adequacy is not. Publicly disclosed inputs include the
      $1 billion Series E, Australia's A$940 million package with approximately A$470 million in
      equity and loans from each government, a $99 million Illinois grant for cryoplant
      infrastructure, a $20 million Cook County cryogenic grant, long-dated MICRO tax benefits,
      and the $10.835 million AFRL contract. The Chicago tax-credit agreement also requires
      154 new full-time jobs by December 2029, while the public copy redacts the minimum capital-
      improvement commitment. PsiQuantum's own Chicago groundbreaking release says the site will be
      built in phases, financed partly by Blue Owl Capital funds, and will first host the company's
      largest intermediate-scale test system before later phases deploy the first U.S. million-
      qubit system. All of this points to unusually high capital intensity: cryogenic plants,
      dedicated test systems, phased facilities, and supplier scale-up arrive before public revenue
      disclosures do. What outside investors still cannot see is the denominator — cash on hand,
      monthly burn, timing of vendor payments, and how much of total site capex remains PsiQuantum's
      burden after grants, tax credits, and public infrastructure support.
    claimRefs:
      - CI006
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI026
      - CI034
      - CI037
      - CI039
    tableRefs:
      - TI004
    figureRefs:
      - FI003
      - FI004
  - id: verdict-gaps
    title: Underwriting Gaps and Financial Verdict
    body: >-
      The underwriting conclusion is straightforward: PsiQuantum may have enough publicly visible
      backing to remain in the race, but public evidence is still inadequate for a normal revenue
      or margin model. The company has credible financing signals and official government partners,
      yet the same evidence set also shows why the business remains hard to price. Fast Company
      notes PsiQuantum has not yet built a complete quantum computer despite its $7 billion
      valuation, and TechSpot frames the 2027 million-qubit jump as part of a market of bold
      promises and record valuations. That skepticism matters because today's cash inflows mostly
      de-risk infrastructure and technical validation rather than confirming recurring customer
      demand. Management would need to disclose at least six things to make this underwritable:
      current cash, burn, recognized revenue by source, pricing or contract structure, site-level
      capex budgets, and gross margin or cost-of-service data. Until then, the financial verdict is
      not "weak" so much as "opaque": the business may be strategically important and very well
      financed, but public materials support only a capital-intensity thesis, not a dependable
      operating model.
    claimRefs:
      - CI018
      - CI021
      - CI022
      - CI023
      - CI035
      - CI036
      - CI040
    tableRefs:
      - TI005
    figureRefs: []
