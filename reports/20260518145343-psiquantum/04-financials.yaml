  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-opacity
      missingEvidence: Current cash on hand, monthly burn, and management runway forecast.
      whyItMatters: Without liquidity data, investors cannot test whether existing funding reaches Brisbane's 2027 target without another raise.
      diligencePath: Request the latest board-approved cash forecast, monthly burn bridge, and covenant or restricted-cash schedule.
      relatedQuestionRefs: [QI016]
    - type: missing-source
      severity: material
      topic: revenue-recognition-gap
      missingEvidence: Revenue recognition split across contracts, grants, capital support, and any pilot or software revenue.
      whyItMatters: Revenue quality cannot be judged if government support and commercial sales are mixed in public narratives.
      diligencePath: Request audited FY25/FY26 revenue by category and deferred-revenue schedule.
      relatedQuestionRefs: [QI005]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency-gap
      missingEvidence: Sales-cycle length, CAC, payback, pipeline stages, and customer conversion metrics.
      whyItMatters: PsiQuantum appears to sell through a long-cycle negotiated motion, so fundraising needs depend on commercial efficiency.
      diligencePath: Request CRM pipeline export, signed backlog, and go-to-market KPI pack.
      relatedQuestionRefs: [QI008]
    - type: private-evidence-only
      severity: material
      topic: cost-structure-gap
      missingEvidence: Gross margin, cost of revenue, working-capital profile, and supplier-payment timing.
      whyItMatters: The foundry and cryogenic thesis cannot be tested financially without cost structure and cash-conversion data.
      diligencePath: Request product/service gross margin bridge, inventory policy, and accounts-payable aging.
      relatedQuestionRefs: [QI009]
    - type: missing-source
      severity: material
      topic: capex-budget-gap
      missingEvidence: Brisbane and Chicago capex budgets by phase, including cryogenic infrastructure, buildings, chip integration, and network equipment.
      whyItMatters: Public grants and incentives offset only part of site cost, so investors still need the company-funded capex burden.
      diligencePath: Request phased site budget, funding waterfall, and vendor milestone schedule.
      relatedQuestionRefs: [QI025]
    - type: missing-source
      severity: material
      topic: pricing-opacity
      missingEvidence: Price cards, reserved-capacity terms, pilot contract economics, and any paid Construct agreements.
      whyItMatters: Without price and contract structure, the bridge from technical milestones to revenue cannot be modeled.
      diligencePath: Request sample contracts for Construct, sovereign site access, and any current paid pilot customers.
      relatedQuestionRefs: [QI005, QI025]
