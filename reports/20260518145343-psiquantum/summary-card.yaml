summary:
  headline: >-
    PsiQuantum has the most credible photonic FTQC thesis and strongest government backing in the sector,  but the $7B
    entry price is wholly speculative on a 2027 milestone that has no independent validation  and carries critical
    timeline and execution risk.
  overallScore: 5.5
