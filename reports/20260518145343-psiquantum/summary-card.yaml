  topStrengths:
    - >-
      Silicon photonics on GlobalFoundries CMOS fab is the only FTQC approach that credibly targets billion-qubit scale
      through industrial semiconductor manufacturing.
    - >-
      Government co-investment of $820M+ from Australia, Illinois, DARPA, and AFRL provides multi-year runway certainty
      and sovereign validation of technical feasibility.
    - >-
      DARPA US2QC Phase 2 finalist status (alongside Microsoft only) is the strongest public signal that the US
      government views PsiQuantum's photonic approach as viable.
    - >-
      The Omega chip Nature paper (Feb 2025) established a verified 99.98% SPAM fidelity milestone, the strongest public
      hardware proof point in the company's history.
    - >-
      Construct platform creates pre-hardware commercial relationships with Airbus, Lockheed Martin, NCCJ, and
      Mitsubishi Chemical, demonstrating ecosystem development ahead of system delivery.
  topRisks:
    - >-
      The 2027 Brisbane system operational target is 13+ years ahead of BCG's consensus forecast for FTQC; no
      independent technical validation exists for this timeline.
    - >-
      Leadership is in transition — Victor Peng is Interim CEO as of May 2026 with no permanent appointment announced;
      Jeremy O'Brien's move to Executive Chairman adds execution uncertainty.
    - >-
      GlobalFoundries single-source fab dependency creates critical supply chain risk; any deprioritization by GF would
      materially delay or halt progress.
    - >-
      $7B valuation with zero revenue and no path to commercial revenue before 2028-2030 means the entry price is
      entirely option-value pricing on unproven technical milestones.
    - >-
      Australian and Illinois government co-investments are milestone-contingent; failure to deliver Brisbane system
      could trigger partial clawback of up to $620M in government capital.
  unresolvedGaps:
    - >-
      No public disclosure of burn rate, cash runway, cost structure, or annual operating budget; the financial model is
      ununderwritable without these inputs.
    - >-
      No independent technical validation of the 2027 Brisbane operational target; only internal company estimates and
      government co-investment criteria support this date.
    - >-
      Permanent CEO has not been identified or announced as of May 2026; the leadership gap at the top represents an
      unresolved governance risk.
    - >-
      Terms of Australian government co-investment (milestone structure, recourse, equity vs. grant/loan split) are not
      fully public; concentrated clawback risk is unquantifiable.
    - >-
      No commercial revenue, customer commitments, or pricing model exists for post-Brisbane access; the SAM and SOM
      beyond government co-investment are speculative.
