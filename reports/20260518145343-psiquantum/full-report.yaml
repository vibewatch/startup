  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Stage
      - Reported valuation / market value
      - Revenue / traction anchor
      - Why it matters
      - Limitation
    rows:
      - - PsiQuantum
        - Private, pre-commercial FTQC builder
        - $7B valuation (Series E, Sep 2025)
        - No public recurring revenue; product access and partnerships but no disclosed commercial backlog
        - Subject company benchmark
        - Current operating data are too thin for normal multiples
      - - Quantinuum
        - Private, commercial trapped-ion leader
        - $10B pre-money after $600M raise
        - Helios launched with named enterprise customers
        - Closest premium private benchmark with better visible commercialization
        - Different modality and Honeywell legacy support
      - - IonQ
        - Public trapped-ion company
        - ~$1.8B market cap per Sacra reference point
        - FY25 revenue $130M; still large annual loss
        - Shows revenue-bearing public quantum premium corridor
        - Public-market marks move sharply with sentiment and M&A
      - - D-Wave
        - Public annealing / gate-model hybrid player
        - ~$4.93B June 2025 non-affiliate market value in 10-K
        - FY25 revenue $24.6M; >135 customers
        - Shows that public quantum equity can still trade richly with small revenues
        - Technology stack is not a direct FTQC analog
      - - Rigetti
        - Public superconducting company
        - ~$0.2B market cap per Sacra reference point
        - FY25 revenue $7.1M; annual net loss $216.1M
        - Demonstrates downside if execution and scale lag narratives
        - Much weaker capital position and different architecture
      - - Xanadu
        - Public photonic peer after SPAC
        - ~$302M capital from public listing transaction
        - Aurora prototype announcement and public-market access
        - Direct photonic context at far smaller financing scale
        - SPAC proceeds are not the same as a fully market-tested steady-state valuation
    notes: >-
      Coverage is intentionally partial: it includes the best-documented public pure plays and the most visible private
      photonic/trapped-ion comparables with usable 2025-2026 valuation anchors.
