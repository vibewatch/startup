        title: Execution and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Execution risk rose materially when PsiQuantum shifted from a founder-led research narrative to a
              two-campus deployment narrative. Victor Peng's appointment as Interim CEO in February 2026 adds proven
              semiconductor operating experience, but it also highlights that the company is in a leadership transition
              while trying to deliver Brisbane and then Chicago. Public incentive and progress documents show that site
              execution is not abstract: job creation, investment pacing, and buildout milestones matter to incentive
              capture and to the credibility of the scale story. The hardest operational question is whether PsiQuantum
              can turn a photonics R&D organization into a disciplined systems-delivery organization without publicly
              disclosing the internal KPI stack, alternate-foundry readiness, or full program-management structure.

              Site and partner execution add more risk than the photonic brand suggests. Brisbane and IQMP both require
              cryogenic plant installation, utilities, facilities integration, vendor coordination, and secure program
              management on top of chip performance. DARPA and AFRL support are confidence signals, but they also
              confirm that PsiQuantum remains in a government validation-and-deliverables environment rather than in
              routine commercial operations. The dependency map is therefore broader than foundry access alone:
              leadership stability, public co-investment capture, cryogenic/site execution, and partner compliance all
              sit on the same critical path.
