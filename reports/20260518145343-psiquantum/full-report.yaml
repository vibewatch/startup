              PsiQuantum should be treated as a high-upside, high-fragility option on fault-tolerant photonic quantum
              computing rather than as a normal late-stage growth investment. The positive side of the case is real: the
              company has just raised $1 billion at a $7 billion mark, has sovereign and local-government support around
              Brisbane and Chicago, and carries meaningful U.S. government technical validation through DARPA and AFRL.
              Its photonic architecture, BTO switch manufacturing, and foundry-led scaling story also remain
              differentiated inside a sector that still struggles to move from lab devices to manufacturable systems.
              But the anti-thesis is equally material. Public evidence still does not show recurring revenue, public
              pricing, or a complete operating quantum computer, while adverse sources directly question the speculative
              character of the subsidy package and the integrity of the Australian selection process. At the current
