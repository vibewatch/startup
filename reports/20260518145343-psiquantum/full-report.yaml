  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical and Engineering Risks
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's core technical risk is schedule compression. Public sources confirm that Brisbane is targeted
              for operation by the end of 2027 and that the company itself calls the plan aggressive, yet the strongest
              independent technical evidence in public is still component and sub-system validation rather than an
              operating logical machine. Nature's Omega paper is an important de-risking event because it shows
              manufacturable photonic sources, detectors, interconnects, and fusion operations on a 300 mm platform, but
              it does not demonstrate a continuously operating fault-tolerant computer. That leaves a large gap between
              proving the building blocks and proving that millions of physical photonic qubits can be networked with
              acceptable loss, yield, switching, cryogenic reliability, and decoding overhead on a utility- scale
              system.

              The technical choke points are also tightly coupled. FBQC is explicitly designed for modular photonic
              systems, but its practicality still depends on stringent loss and error budgets, high-quality
              single-photon generation, low-loss switching, and high-efficiency SNSPD-based detection. Public technical
              literature continues to treat source indistinguishability and loss control as first-order constraints,
              while PsiQuantum's own materials show that the system still depends on cryogenic modules, fiber attach,
              packaging, and foundry-compatible integration. Because GlobalFoundries is the only publicly named foundry
              ecosystem at equivalent scale, technical risk is not isolated to physics; it is embedded in
              manufacturability and supplier concentration.
            claimRefs:
