      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The key growth drivers for the quantum computing market relevant to PsiQuantum are: (1) Government
              sovereign quantum strategies — the US National Quantum Initiative, UK National Quantum Strategy,
              Australian National Quantum Strategy, and EU Quantum Flagship collectively commit tens of billions to
              quantum R&D over the decade, providing non-market demand. BCG estimates public sector support is likely to
              exceed $10 billion globally over the next 3–5 years. (2) Post-quantum cryptography deadline pressure —
              NIST finalized its first three post-quantum cryptography standards in August 2024 (FIPS 203, 204, 205).
              The Y2Q "Q-Day" risk — when quantum computers break RSA encryption — motivates governments and critical
              infrastructure operators to invest in both PQC migration and quantum-safe hardware. The PQC market is
              projected to grow to $2.84 billion by 2030 at a 46% CAGR. (3) FTQC semiconductor manufacturing
              feasibility: PsiQuantum's Omega Nature paper (Feb 2025) and the GlobalFoundries manufacturing partnership
              demonstrate that photonic quantum chips can be produced at wafer scale in a commercial fab, reducing the
              historically assumed capital cost to deploy quantum hardware. (4) AI-quantum convergence: NVIDIA's
              collaboration with PsiQuantum and the CUDA-Q integration signal growing enterprise appetite to combine
              GPU-accelerated simulation with quantum processing. The critical adoption constraints are: (1) Timeline
              uncertainty — BCG's 2024 consensus view places full-scale fault tolerance after 2040; PsiQuantum's 2027
              target is a minimum 13-year departure from analyst consensus. No independent expert has validated the 2027
              timeline. (2) "Harvest now decrypt later" threat model — while a quantum threat to encryption is real, PQC
              software migration (not quantum hardware) is the near-term response, reducing direct urgency for FTQC
              hardware in security applications. (3) Capital intensity — each utility-scale quantum system is expected
              to require multi-hundred-million-dollar deployment budgets, limiting early adopters to governments. (4)
              Classical AI competition — AI has surpassed expectations in molecular simulation, drug discovery, and
              financial optimization, eroding some projected quantum advantage windows in the NISQ era.
            claimRefs:
