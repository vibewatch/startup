  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct FTQC Rivals
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's most material direct rivals are the vendors that are already building enterprise
              relationships around gate-model quantum computers while publicly claiming a path to fault tolerance. IBM
              is the clearest incumbent threat: it has the broadest current fleet, the most transparent packaging, and a
              specific 2029 Starling target for 200 logical qubits and 100 million gates. Google remains formidable on
              device quality and error-correction science, but its 2026 Willow access model is still a selective
              research program rather than a broad commercial service. Microsoft is dangerous because it can distribute
              through Azure and because a successful topological architecture would be structurally powerful, but the
              program still carries scientific controversy and is not packaged like a mainstream hardware product today.
              Quantinuum and IonQ are the strongest commercial challengers to PsiQuantum in the near term because both
              already sell access through multiple channels and both describe credible fault-tolerance paths, even if
              their largest roadmap claims are still future-facing. The strategic implication is that PsiQuantum is not
              competing only on eventual machine quality; it is competing against rivals that are already building
              customer trust, developer familiarity, and procurement history.
