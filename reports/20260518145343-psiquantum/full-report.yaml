  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Architecture
        - Photonic qubits, BTO switches, and foundry-style manufacturing offer a plausible scaling path
        - No complete machine is public; manufacturability claims still sit far ahead of delivered system evidence
        - Independent milestone disclosure on integrated system performance and site install readiness
      - - Capital stack
        - $1B Series E and public support provide unusual runway certainty
        - Public support is politically controversial and could amplify downside if milestones slip
        - Visibility into support draw conditions, clawbacks, and remaining private-funding needs
      - - Government validation
        - DARPA and AFRL indicate the approach is taken seriously by U.S. defense stakeholders
        - Government programs validate technical relevance, not commercial readiness or unit economics
        - Evidence that government validation converts into durable contracts or commercial demand
      - - Commercial proof
        - Construct, applications work, and industry partnerships support real-world use-case interest
        - No public price card, no disclosed recurring revenue, and MOUs are not purchase orders
        - Named paid contracts, pricing, backlog, and customer usage data
      - - Relative valuation
        - Premium can be rational if PsiQuantum becomes the first sovereign-backed FTQC system builder
        - >-
          Quantinuum already has a richer commercial proof stack, while public peers show how violently quantum marks
          can compress
        - A clearer reason why PsiQuantum deserves its premium over public comps beyond timing optimism
    notes: >-
      The anti-thesis is not that PsiQuantum lacks technical ambition; it is that current price requires investors to
      prepay for milestones that are still disputed or undisclosed.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
