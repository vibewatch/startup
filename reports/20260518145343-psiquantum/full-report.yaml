      - number: '7.5'
        title: Competitive and Market Risks
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum is exposed to two competitive clocks. The first is technical: Google and IBM continue to
              publish named roadmaps, spec sheets, and access models that give customers tangible alternatives while
              PsiQuantum remains pre-hardware for external users. The second is economic: AI, HPC, and cloud-aggregated
              quantum access continue improving the substitute set for buyers who want learning, experimentation, or
              near-term workflow value before utility-scale FTQC arrives. That does not prove PsiQuantum's photonic
              thesis is wrong, but it does mean timing itself is a competitive variable. A company that arrives later
              than promised can lose mindshare, partner momentum, and pricing power even if its eventual architecture is
              better.

              The market implication is that PsiQuantum's risk profile should be read as an integrated system, not a
              checklist. Competitive pressure, milestone discipline, export-control clarity, leadership stability, and
              financing transparency all interact. The thesis can survive manageable delays and ordinary policy
              friction, but it becomes fragile if the company enters 2027 without clearer system benchmarks, clearer
              compliance mappings, or clearer capital disclosure. Those are the monitorable pre-commitment signals that
              distinguish a hard but still fundable execution problem from a thesis-break.
