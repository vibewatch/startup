  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Monetization Status
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's public revenue picture is better described as undeclared than established. The company has
              announced large capital inflows — $1 billion of Series E equity, Australia's A$940 million co-investment
              package, Illinois grants and tax incentives, and a $10.8 million AFRL contract — but most of those dollars
              are financing inputs, not evidence of recurring commercial demand. The one clearly disclosed contract-like
              monetization item is the AFRL firm-fixed-price award, which funds chip delivery, BTO phase shifters, and
              software support through May 2027. Separately, PsiQuantum markets Construct, a fault-tolerant quantum
              algorithm platform for enterprises, governments, and researchers, but access is gated through an
              application form and the page publishes no public price, contract term, or paid user count. That leaves a
              likely three-layer revenue model: first, government or defense R&D contracts and potentially grant
              accounting; second, selective software or pilot engagements around Construct; and third, eventual
              site-scale compute or service contracts once Brisbane and Chicago move beyond prototypes. Public sources
              support the existence of each layer, but only the AFRL contract has a disclosed dollar amount tied to
              deliverables. From an underwriting perspective, the crucial distinction is between capital support,
              contract revenue, and future compute monetization; today's public disclosures are rich on financing and
              poor on realized recurring revenue.
