      - number: '5.5'
        title: Technical Risks and Limitations
        blocks:
          - type: paragraph
            body: >-
              The most important limitation is that PsiQuantum has demonstrated building blocks, not yet a public
              fault-tolerant computer. Omega is impressive because it closes the loop across sources, detectors,
              switching, interference, fusion, and networking, but the published metrics are benchmark results on
              component and sub-system operations rather than an end-to-end logical machine. The gap from
              feature-complete components to a utility-scale, continuously operating computer still includes
              manufacturing yield, packaging density, cryogenic reliability, error- correction overhead, and full system
              software orchestration.

              Photonic quantum computing also preserves some difficult physics even as it avoids others. Photons are
              attractive because of low noise and fiber compatibility, but scalable operation still depends on
              indistinguishable single photons, low-loss routing, and near-unit-efficiency detection. Nature explicitly
              frames fast, low-loss switching as essential for large optical networks, while MIT and Science sources
              show how demanding the source-indistinguishability and efficiency requirements are in photonic systems
              generally. PsiQuantum's architecture tolerates materially higher operating temperatures than
              superconducting qubits, but it does not become a room-temperature datacenter appliance; its detectors and
              integrated modules still require 2-4 K cryogenic infrastructure.

              Commercial maturity is similarly constrained. Construct is available only to a limited set of expert
              users, no public self-serve hardware access or uptime/SLA metrics are disclosed, and public partner
              evidence is still co-development oriented. Taken together, the product should be viewed as technically
              differentiated and meaningfully de-risked at the component level, but not yet operationally de-risked at
              utility scale.
