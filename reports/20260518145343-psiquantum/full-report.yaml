      - number: '8.3'
        title: Comparable Valuation and Market Positioning
        blocks:
          - type: paragraph
            body: >-
              Comparable work shows why PsiQuantum is difficult to call cheap. Public pure-play peers are much smaller
              in market value, but they also provide far more revenue evidence than PsiQuantum does today. D-Wave, IonQ,
              and Rigetti all show the same pattern: modest or still-early revenue, very large losses, and equity values
              that remain mostly option value. That means public multiples do not directly justify $7 billion, but they
              do show how much capital markets are willing to capitalize future technical leadership. Among private
              peers, Quantinuum is the clearest upper anchor because its reported $10 billion valuation sits alongside
              named enterprise customers and a launched commercial system. Xanadu is the closest photonic peer, but its
              recent public-capital event is far smaller than PsiQuantum’s round. The comparative read-through is that
              PsiQuantum is priced ahead of most peers on visible commercialization and is therefore relying on schedule
              credibility, not current economics, to defend the mark.
            claimRefs:
