      - number: '8.5'
        title: Final Diligence Asks and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The final diligence work is mostly financial and contractual rather than scientific. Public evidence is
              sufficient to say that PsiQuantum is well financed, heavily subsidized, and technically non-trivial; it is
              not sufficient to say what a new investor actually owns in downside cases or how quickly current capital
              is being consumed. The minimum blocking asks are therefore straightforward: current cash and monthly burn;
              a full cap table and liquidation-preference stack; a site-by-site critical path for Brisbane and Chicago;
              the amount, timing, and nature of any paid commercial pipeline; and the exact recourse terms attached to
              public support packages. If management can close those gaps and keep 2027 milestones credible, the
              recommendation can improve. If not, the present mark should be treated as a watchlist price rather than as
              a buyable margin of safety.
