      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: BCG and Analyst Consensus Puts FTQC After 2040 — 13 Years Behind PsiQuantum
            body: >-
              BCG's 2024 forecast explicitly describes full-scale fault tolerance as a post-2040 development. PsiQuantum
              claims a utility-scale FTQC system operational in Brisbane by end of 2027. No independent analyst
              publication validates the 2027 timeline. If the Brisbane system is not demonstrated on schedule,
              government co-investment covenants may trigger recourse provisions, and commercial partner confidence
              could deteriorate materially.
            calloutType: risk
            claimRefs:
              - CM009
              - CM031
              - CM032
          - type: callout
            title: Government Spend Is the Only Near-Term Market; Commercial Revenue Is Post-2028
            body: >-
              BCG estimates government orders already support more than half of the current quantum computing market.
              For PsiQuantum specifically, all committed revenue and co-investment through 2028 is government-funded.
              The company's commercial market entry is entirely contingent on demonstrating utility-scale fault-tolerant
              computation first — making the 2027 Brisbane target the single most important near-term commercial
              milestone.
            calloutType: insight
            claimRefs:
              - CM013
              - CM023
              - CM025
              - CM026
          - type: callout
            title: FTQC Provider Market Potentially $90–170B by 2040; PsiQuantum Has First-Mover Positioning
            body: >-
              If PsiQuantum achieves FTQC at scale even 5–10 years before competitors, it would capture meaningful share
              of what BCG projects as a $90–170B hardware and software provider market by 2040. Government co-investors
              are effectively purchasing an option on this outcome. Quantum computing's "winner-take-most" technology
              dynamics — akin to semiconductor nodes — could amplify first-mover advantage significantly.
