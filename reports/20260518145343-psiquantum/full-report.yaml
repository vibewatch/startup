            body: >-
              Direct unit economics are not publicly calculable. PsiQuantum's long-run thesis is attractive on paper:
              standardized high-volume foundry output, photonic networking over conventional fiber, and rack-like
              cryogenic architecture should be structurally more manufacturable than bespoke lab systems if yields and
              integration work. But the public benchmark corridor for the sector remains harsh. D-Wave's FY25 10-K
              reports $24.6 million of revenue against a $355.1 million net loss and $72.0 million of operating cash
              outflow. DatacenterDynamics reports IonQ at $130 million of FY25 revenue with a $510.4 million annual net
              loss and Rigetti at $7.1 million of revenue with a $216.1 million net loss. These are not direct modality
              comps, but they are still the best public evidence for how much revenue quantum companies generate before
              scale and how persistent losses remain even after commercialization begins. For PsiQuantum, the missing
              fields are exactly the ones needed to test whether foundry leverage becomes economic advantage: gross
              margin, cost of revenue, utilization, working capital, sales cycle, and recognized revenue by product or
              contract type. Until those are disclosed, the best public "unit economics" view is a hybrid of company
              manufacturing claims plus peer public loss corridors.
