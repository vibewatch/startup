      - number: '5.4'
        title: Critical Dependencies and Supply Chain
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's technology stack is less vertically integrated than its branding may initially suggest. The
              company owns the photonic architecture, software environment, and integration strategy, but critical
              execution depends on outside manufacturing and infrastructure partners. The most important dependency is
              the silicon-photonics foundry layer. PsiQuantum's own materials emphasize commercial foundry
              manufacturing, and GlobalFoundries' silicon photonics platform advertises exactly the capabilities
              PsiQuantum needs: monolithic photonic and CMOS integration, advanced packaging, flexible fiber attach,
              photonics PDKs, and high-volume 300 mm production. That manufacturing ecosystem is a major strategic
              advantage, but it is also a concentration risk because no alternative supplier is publicly disclosed at
              equivalent scale.

              The rest of the stack has similar choke points. Nature and company launch materials show that detector
              performance, optical switching, and cryogenic packaging are not optional peripherals; they are core
              product modules. Reuters further ties the company to cryogenic quantum-module development with U.S.
              Department of Energy/SLAC support, reinforcing that even a photonic machine still lives or dies on
              refrigeration, electronics integration, and module-level reliability. Packaging and networking matter
              because utility-scale photonic systems require many packages networked by fiber and control signals, not
              just better chips.

              Customer value delivery also depends on non-chip dependencies. Brisbane and Chicago require site
              construction, power, cryogenic plant installation, control-system integration, and customer program
              management. Construct reduces some timing pressure by creating a pre-hardware customer workflow, but it
              does not eliminate dependency on the eventual hardware and facilities stack. In practice, any delay in
              foundry access, switching maturity, detector yield, cryogenic cabinet readiness, or campus build-out
              pushes out the commercial realization of the product.
