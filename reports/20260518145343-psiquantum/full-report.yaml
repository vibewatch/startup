      - number: '2.2'
        title: Market Sizing — TAM, SAM, SOM
        blocks:
          - type: paragraph
            body: >-
              Analyst estimates for the total quantum computing market vary widely depending on whether NISQ cloud
              services, enterprise software, and supply-chain components are included, and whether the estimate reflects
              near-term infrastructure spending or long-term value creation. Grand View Research estimated the global
              market at $1.42 billion in 2024, growing to $4.24 billion by 2030 at a 20.5% CAGR. MarketsandMarkets
              projects the market grows from $3.52 billion in 2025 to $20.20 billion by 2030, an aggressive 41.8% CAGR.
              Precedence Research pegged the 2025 market at $1.44 billion, growing to $19.44 billion by 2035 at a 29.73%
              CAGR. BCG's 2024 update projects the provider market at $1–2 billion by 2030 (near-term, NISQ era) and
              $90–170 billion in hardware and software provider revenue by 2040 (fault-tolerant era), against $450–850
              billion in total economic value created. PsiQuantum's relevant TAM is the FTQC sub-segment: the portion of
              the $90–170B 2040 market attributable to hardware systems and quantum access for fault-tolerant
              applications. The SAM is constrained by geography (Australia and US in the initial deployment phase),
              application maturity (pharma molecular simulation, defense, financial optimization), and platform
              readiness. PsiQuantum's near-term SOM is defined almost entirely by government and defense contracts: the
              $620M Australian co-investment, the $200M Illinois IQMP incentive, and US federal programs (DARPA, AFRL).
              Speculative commercial SOM from 2028 onwards is estimated in the tens of millions per year per installed
              system if the 2027 Brisbane deployment succeeds. All headline TAM figures are subject to significant
              contradictions and methodology variation; diligence buyers should treat multiple lenses as complementary,
              not authoritative.
