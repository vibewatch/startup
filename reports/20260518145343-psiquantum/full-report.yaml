      - number: '5.2'
        title: 'Current Products: Omega Chip and Construct Platform'
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's current commercial product story has two layers: Omega as the core hardware platform and
              Construct as the software environment that partners can use before utility-scale hardware is live. Omega
              is described by PsiQuantum as a manufacturable chipset for photonic quantum computing, and the Nature
              paper plus launch materials support that framing with quantitative results. The system benchmarked
              path-encoded qubits at 99.98% +/- 0.01% SPAM fidelity, reported 99.72% +/- 0.04% chip-to-chip qubit
              interconnect fidelity, and achieved 99.22% +/- 0.12% Bell-fusion fidelity on dual-rail qubits. These are
              not full-system fault- tolerant results, but they are meaningful demonstrations that the component chain
              needed for FBQC has been integrated and benchmarked on one manufacturable platform.

              Construct is the nearer-term product customers can actually engage with. The platform bundles Workbench,
              Qubricks, Circuit Designer, and Resource Analyzer into a managed environment for fault-tolerant algorithm
              development. The software supports Python-based workflow design, modular algorithmic building blocks, and
              resource-estimation analysis against hardware constraints. In March 2026 PsiQuantum added NVIDIA CUDA-Q
              integration, claiming 8x to 450x speedups for GPU-accelerated state-vector simulation of large-scale
              algorithms. That matters because PsiQuantum's current go-to-market wedge is not remote access to a
              commercial quantum computer; it is pre-hardware algorithm design, validation, and resource planning.

              Publicly disclosed partnerships support that interpretation. Airbus is using PsiQuantum for aerospace FTQC
              work including CFD-oriented algorithms; Lockheed Martin is focused on aerospace and defense use cases;
              National Cancer Center Japan is targeting oncology and drug-discovery applications; and the University of
              Tokyo plus Mitsubishi Chemical partnership extends Construct into workforce development. These are
              credible indicators that the software layer is being used in real domain workflows, but Construct remains
              limited-access and expert-only, so the product is still better described as an early enterprise
              co-development platform than as a broad self-serve software business.
