      - CV024
      - CV031
      - CV032
  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Key assumptions
      - 2028 value
      - Return vs $7B entry
      - Probability signal
      - Key risks
    rows:
      - - Bull
        - >-
          Brisbane operational by late 2027; DARPA/AFRL validation deepens; first commercial or sovereign contracts
          become visible
        - 15-25B
        - ~2.1x-3.6x
        - Low-to-medium
        - Execution chain is sequential and any site slip can break the upside
      - - Base
        - Brisbane delivered but 12-18 months late; government support remains intact; customer ramp remains slow
        - 5-10B
        - ~0.7x-1.4x
        - Medium
        - Flat or modest step-up outcome if technical proof lags valuation narrative
      - - Bear
        - >-
          Brisbane materially misses; support weakens or is delayed; next financing reprices risk before first-system
          proof
        - 1-3B
        - ~0.1x-0.4x
        - Material tail risk
        - Down-round, program slippage, and loss of narrative premium compound quickly
    notes: >-
      Ranges are analyst scenario estimates, not company guidance. They reflect milestone probability, comparable
      positioning, and the fact that PsiQuantum still lacks public revenue or margin disclosure.
