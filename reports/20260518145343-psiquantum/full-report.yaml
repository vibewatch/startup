  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Adjacent Markets
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum competes in the quantum computing hardware and systems market, specifically in the
              fault-tolerant quantum computing (FTQC) sub-segment. The relevant market scope includes: fault-tolerant
              quantum computer hardware systems (processors, cryogenic infrastructure, control electronics), FTQC
              systems integration and installation, quantum algorithm development services and software platforms
              (analogous to PsiQuantum's Construct suite), and government-funded quantum programs. Excluded from
              PsiQuantum's addressable market are: noisy intermediate-scale quantum (NISQ) cloud computing services
              (dominated by IBM Quantum, AWS Braket, Google Quantum AI, Quantinuum, IonQ), quantum networking and
              quantum key distribution (separate hardware category), quantum sensing (separate application domain), and
              post-quantum cryptography (PQC) software migration services (defense against quantum threats, not quantum
              hardware). The status-quo substitute for quantum computing in molecular simulation is classical
              high-performance computing (HPC) and AI-accelerated simulation; in finance, classical optimization solvers
              and AI; in cryptography, classical post-quantum algorithms without quantum hardware. IonQ (trapped ions,
              Nasdaq-listed), Quantinuum (trapped ions, Honeywell subsidiary), IBM Quantum (superconducting), Google
              Quantum AI (superconducting), and Microsoft (topological, Azure Quantum) compete in overlapping market
              segments but differ in qubit modality, timeline to fault tolerance, and business model. Only PsiQuantum
              and Microsoft (with its topological qubit approach) are pursuing full fault tolerance as a
              first-principles hardware design objective without a NISQ commercial offering today.
            claimRefs:
              - CM001
              - CM002
