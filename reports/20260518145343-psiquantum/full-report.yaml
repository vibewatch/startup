      - number: '1.2'
        title: Funding History and Investor Base
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum has raised more than $1.7 billion in total capital since its founding, making it the world's
              most capitalized private quantum computing company by reported funding. The company raised approximately
              $215 million across early rounds before its July 2021 Series D of $450 million led by BlackRock, which
              brought total raised to $665 million at a $3.15 billion valuation. In April 2024, the Australian
              Commonwealth and Queensland governments co-invested A$940 million (approximately USD $620 million) through
              a package of equity, grants, and loans, in exchange for PsiQuantum committing to build the world's first
              utility-scale quantum computer in Brisbane, Queensland by end of 2027. In March 2025, Reuters reported
              PsiQuantum was raising at least $750 million at a $6 billion valuation. In September 2025, PsiQuantum
              closed a $1 billion Series E at a $7 billion valuation, led by affiliates of BlackRock with participation
              from Temasek, Baillie Gifford, Macquarie Capital, Ribbit Capital, NVentures (NVIDIA's venture arm), Qatar
              Investment Authority, Adage Capital, Morgan Stanley's Counterpoint Global, and others. PsiQuantum's core
              investor base is anchored by BlackRock, Baillie Gifford, and M12 (Microsoft's venture fund), all of which
              participated in multiple rounds. The company remains pre-revenue and has not disclosed its revenue
              run-rate or burn rate, relying on equity and government funding for operations.
