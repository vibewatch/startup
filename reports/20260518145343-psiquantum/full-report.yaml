  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold event
      - Transmission to thesis
      - Action implication
    rows:
      - - Brisbane schedule break
        - Public or investor-verified slip of >18 months versus current path
        - Collapses timing premium and stresses subsidy capture plus next-round pricing
        - Move immediately to bear-case underwriting; do not add capital without full re-baseline
      - - Validation erosion
        - DARPA/AFRL status weakens materially or key government support terms are renegotiated negatively
        - Removes an important non-market credibility pillar from the story
        - Treat as thesis break unless replaced by equivalent customer proof
      - - Down-round financing
        - New capital raised below the current $7B mark before first-system operation
        - Shows the market is repricing execution risk faster than management can close it
        - Pause investment and re-underwrite to distressed or reset outcomes
      - - Leadership instability
        - Interim structure persists without credible long-term operating leadership during site execution
        - Raises risk that systems delivery lags architecture ambition
        - Require governance plan and operating ownership before proceeding
      - - Commercial proof failure
        - No meaningful paid contracts or pricing clarity emerge even after technical milestones
        - Leaves valuation dependent on science-story alone
        - Downgrade to avoid for mainstream investors
    notes: >-
      Triggers are meant to be monitorable and portfolio-actionable, not abstract risks. Each one directly affects the
      rationale for paying a premium before revenue is visible.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Cash and burn
        - Current cash balance, monthly burn, and site-level capex schedule
        - Without it, runway adequacy cannot be tested against Brisbane and Chicago spend
        - Request board pack or CFO cash bridge under NDA
      - - Cap table and preferences
        - Full capitalization table, liquidation preferences, anti-dilution, and seniority
        - Downside recovery math at a $7B entry depends on preference overhang
        - Request investor-ready cap table and side-letter summary
      - - Commercial pipeline
        - Named paid pilots, contract values, pricing terms, and backlog conversion timing
        - Separates genuine demand from non-binding partnership signaling
        - Review customer contracts, reservation agreements, and pricing models
      - - Brisbane critical path
        - Integrated milestone chart covering foundry, BTO, cabinets, cryogenics, and site delivery
        - The entire valuation rests on timing discipline
        - Request program-management dashboard and critical-path owner map
      - - Public-support recourse
        - Exact draw conditions, clawbacks, and default mechanics for Australia and Illinois support
        - Government support is a major part of downside containment
        - Review executed agreements and any compliance notices
      - - Government-validation economics
        - How DARPA/AFRL milestones map to revenue, cost recovery, or future procurement
        - Technical validation is valuable only if it creates durable economic leverage
        - Request contract milestone schedules and pipeline from federal stakeholders
    notes: >-
      These asks are ordered by what most directly changes downside underwriting. Items 1-3 are blocking for any
      conviction investment at current valuation.
    claimRefs:
      - CV027
      - CV028
      - CV039
      - CV040
      - CV045
