companyProfile:
  summary: >-
    PsiQuantum is a silicon photonics company building utility-scale fault-tolerant quantum computers (FTQC)  using a
    foundry-based manufacturing approach on GlobalFoundries' 300mm CMOS photonics process. Founded  in 2016 in Palo
    Alto, the company has secured $1B+ in private capital and $820M+ in government co-investment  from Australia,
    Illinois, and US federal agencies. Its core thesis is that only FTQC at scale — not NISQ-era  devices — will deliver
    quantum advantage, and that silicon photonics uniquely enables the qubit density and  interconnect needed to achieve
    it. The company targets first utility-scale system operation in Brisbane,  Australia by end of 2027. It is
    pre-revenue with zero commercial customers as of May 2026.
  foundedDate: '2016-01-01'
  founders:
