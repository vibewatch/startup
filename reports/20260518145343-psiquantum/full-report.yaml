      - number: '7.3'
        title: Regulatory, Legal, and Geopolitical Risks
        blocks:
          - type: paragraph
            body: >-
              Quantum computing is increasingly treated as a national-security-sensitive technology area, and that
              changes PsiQuantum's risk posture. BIS's 2024 interim final rule explicitly added controls on quantum
              computing and other advanced technologies, while NSM-10 frames quantum leadership and migration away from
              vulnerable cryptography as cyber, economic, and national-security policy. CISA urges
              critical-infrastructure operators to prepare for post-quantum migration, and NSA goes further by warning
              that it does not recommend QKD/QC for National Security Systems unless known limitations are overcome. For
              PsiQuantum, this means cross-border collaboration between the U.S. and Australia sits inside a tightening
              environment for export controls, security governance, government-customer diligence, and
              technology-transfer review.

              Legal/IP risk is also meaningful rather than existentially clear-cut. Public patent records show
              PsiQuantum has real granted photonic quantum IP, but they also show a broader field of photonic quantum
              patents from other institutions, which argues for a crowded and evolving freedom-to- operate landscape
              rather than for a totally unchallenged moat. Government-support disclosures are clearer on amounts, jobs,
              and public rationale than on the exact recourse mechanics if Brisbane misses major milestones, so the
              public record still leaves unresolved questions on export classification, Australia-specific default
              terms, and the practical constraints on moving people, designs, and know-how across jurisdictions.
            claimRefs:
              - CR017
