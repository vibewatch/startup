      - number: '7.4'
        title: Financial and Capital Risks
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's financial risk is less about access to capital today than about the conditionality and
              opacity attached to that capital. Independent skeptical coverage notes that the company reached a
              multi-billion-dollar valuation before building a complete public quantum computer, and public documents
              still do not disclose cash on hand, monthly burn, runway, or site-level capex. That makes it impossible
              for outside investors to know whether the current capital base is ample, merely adequate, or still short
              of what Brisbane and Chicago require. Government co-investment is valuable, but it does not eliminate
              risk; it ties more of the upside and downside to milestone delivery and to the continuity of public-policy
              support.

              The key financial transmission path starts with technical delay. If Brisbane slips, PsiQuantum does not
              just lose time; it risks weaker public-support capture, harder next-round pricing, slower Chicago
              sequencing, and reduced partner confidence. Public peer data reinforces the point: even quantum companies
              with disclosed revenue still post large losses, so investors should not assume sector-scale burn falls
              quickly once commercialization begins. The real financial question is therefore whether PsiQuantum can hit
              enough technical and program milestones before the market reprices timeline risk again.
