  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Silicon Photonic Architecture and FBQC Approach
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's technical thesis is that useful fault-tolerant quantum computing should be built with
              telecom-band single photons on high-volume semiconductor infrastructure rather than with bespoke low-yield
              qubit fabrication. On the company's account and in its 2025 Nature paper, the photonic stack already
              integrates the minimum building blocks needed for a fusion-based quantum computer: on-chip photon
              generation, path-encoded qubit preparation and measurement, chip-to-chip optical interconnects, two-photon
              interference, and Bell-fusion entangling measurements. The underlying computational model is fusion-based
              quantum computing (FBQC), a measurement-first architecture in which entangling measurements on small
              resource states do the logical work that unitary gate sequences do in more conventional circuit
              formulations.

              The hardware implementation is unusually manufacturing-centric. PsiQuantum's technology page, Omega launch
              materials, and third-party optical trade coverage all emphasize that the company has introduced low-loss
              silicon nitride waveguides, superconducting nanowire single-photon detectors (SNSPDs), and barium titanate
              electro-optic switching into a commercial foundry process. Nature reports a fully integrated 300 mm
              process and a cryogenic assembly containing a photonic die, electronic PCB, and 100-channel
              telecommunications fiber attach unit. That is materially different from a lab-only photonics stack: the
              product concept already assumes packaging, fiber connectivity, and manufacturable cryogenic infrastructure
              as part of the system boundary.

              The architectural upside is clear. Photons are naturally compatible with fiber interconnects, low-noise
              propagation, and wafer-scale photonic integration; FBQC is explicitly designed to exploit probabilistic
              photonic processes through heralding and fusion. But the same sources also define the hard engineering
              budgets: scalable photonic computing still requires extremely high source purity, near-unit detection
              efficiency, low accumulated optical loss, and very fast, low-loss switching. Nature states that FBQC can
              tolerate on the order of 10% total loss between emission and detection and roughly 1% per-qubit
              fusion-network errors, which means PsiQuantum's manufacturable stack is credible only insofar as it keeps
              those budgets under control at system scale.
            claimRefs:
