      - number: '2.5'
        title: Sizing Contradictions, Adverse Perspectives, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Market sizing for quantum computing exhibits some of the widest analyst disagreement of any technology
              sector. The 2025 market is estimated at $1.44B (Precedence), $3.52B (M&M), or $1.42B (Grand View) with no
              consensus on scope or methodology. For 2030, estimates range from $4.24B (Grand View at 20.5% CAGR) to
              $20.20B (M&M at 41.8% CAGR) — a 5x spread. BCG's $1–2B near-term provider market is the most conservative.
              These contradictions reflect (a) different scope inclusions (some include quantum cryptography and
              sensing; others only hardware and software), (b) different time assumptions for quantum advantage onset,
              and (c) vendor-commissioned reports with optimistic assumptions. The most significant adverse perspective
              on PsiQuantum's market positioning is BCG's explicit statement that full-scale fault tolerance arrives
              "after 2040" — a 13-year gap versus the company's 2027 target — and that NISQ limitations have materially
              disappointed prior market forecasts. Several BCG authors note that AI has exceeded expectations in domains
              previously reserved for quantum advantage (molecular simulation, optimization), raising the quantum
              advantage threshold further. The New Yorker article, while not directly financial analysis, captures the
              broader scientific skepticism: "Today's quantum computers are 'noisy', meaning that they fail at almost
              everything they attempt." Independent assessment of PsiQuantum's specific claim — that photonic FTQC at
              scale is achievable by end of 2027 — does not exist in published analyst literature; the closest proxy is
              the DARPA US2QC program's ongoing (undisclosed) evaluation.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
