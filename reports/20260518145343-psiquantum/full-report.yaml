      - number: '5.3'
        title: 'System Roadmap: Brisbane and Chicago'
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum's hardware roadmap is now framed around two named utility-scale deployments rather than an
              abstract long-range research program. The first is Brisbane, where PsiQuantum and the Australian and
              Queensland governments announced a A$940 million package of equity, grants, and loans tied to building
              what the company calls the world's first utility-scale, fault-tolerant quantum computer. Company materials
              describe the Brisbane site as targeted for operation by the end of 2027 and explicitly characterize the
              plan as aggressive. That target should be read as a roadmap commitment rather than as a de-risked delivery
              date.

              Chicago is the U.S. follow-on deployment. Illinois named PsiQuantum the anchor tenant at the Illinois
              Quantum and Microelectronics Park (IQMP) on the former U.S. Steel South Works site, with an incentive
              package valued at $200 million and a minimum company investment commitment of $1.09 billion. In product
              terms, the Chicago site matters because it shows PsiQuantum is not designing Omega as a one-off scientific
              demonstrator; the company is planning repeatable, campus-scale deployment of photonic packages, cryogenic
              modules, control electronics, and customer-facing application programs.

