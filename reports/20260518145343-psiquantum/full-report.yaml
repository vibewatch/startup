              PsiQuantum's most material customer-adjacent relationships are not classic software accounts; they are
              sovereign co-investment, infrastructure, and validation programs. Australia is the single biggest example.
              Department of Industry and BusinessWire materials say the Australian and Queensland governments committed
              almost A$1 billion / A$940 million to build a utility-scale, fault-tolerant quantum computer in Brisbane,
              with the company also expected to establish its Asia-Pacific headquarters, create local jobs, and develop
              research and supply-chain links. Illinois is the second major anchor. The State of Illinois named
              PsiQuantum the anchor tenant at the Illinois Quantum and Microelectronics Park and disclosed a $200
              million incentive package, $1.09 billion minimum company investment, and a plan to work with customers
              including Fortune 500 companies on future fault-tolerant algorithms. DARPA and UK government relationships
              deepen the pattern: DARPA is evaluating PsiQuantum's utility-scale system design and use cases through
              US2QC, while UK government and UKRI materials frame the Daresbury relationship as infrastructure and
              ecosystem support around cryogenics and R&D. Together, these are powerful adoption signals because real
              governments are underwriting sites, facilities, and technical validation. But they are still closer to
              strategic sponsorship and future procurement preparation than to conventional recurring revenue from
