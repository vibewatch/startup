company:
  name: PsiQuantum
chapter:
  number: 1
  title: Company Overview
  summary: >-
    PsiQuantum is a Palo Alto-based quantum computing company founded in 2016 by UK academics
    Jeremy O'Brien, Terry Rudolph, Pete Shadbolt, and Mark Thompson. The company pursues
    a silicon photonic approach to fault-tolerant quantum computing, has raised over $1.7 billion
    including a $1 billion Series E in September 2025 at a $7 billion valuation, and has secured
    major government co-investment from Australia (A$940M/$620M USD) and the United States
    (Illinois, DARPA) to build the world's first utility-scale quantum computers in Brisbane and
    Chicago. As of May 2026, Victor Peng serves as Interim CEO while co-founder Jeremy O'Brien
    holds the Executive Chairman role.

sections:
  - id: identity-founding
    title: Identity, Founding, and Mission
    body: >-
      PsiQuantum, Corp. is a privately held quantum computing hardware company headquartered
      at 700 Hansen Way, Palo Alto, California 94304. The company's stated mission is to build
      and deploy the world's first useful, fault-tolerant quantum computers capable of solving
      commercially relevant problems at scale. PsiQuantum was founded in 2016 by four academics
      who had previously conducted foundational photonic quantum computing research at the
      University of Bristol and Imperial College London in the United Kingdom. The founding team
      comprises Jeremy O'Brien (Co-Founder and Executive Chairman, formerly CEO), Terry Rudolph
      (Co-Founder and Chief Architect), Pete Shadbolt (Co-Founder and Chief Scientific Officer),
      and Mark Thompson (Co-Founder and Chief Technology Officer). In early 2026, Victor Peng,
      a veteran semiconductor executive and former President of AMD who led Xilinx through its
      $49 billion acquisition by AMD, was appointed Interim CEO to oversee day-to-day operations
      and utility-scale deployment. The company operates under the hypothesis that photonic qubits—
      encoding quantum information into particles of light—combined with high-volume semiconductor
      manufacturing infrastructure, offer the most scalable and practical path to one-million-qubit
      fault-tolerant quantum computers. PsiQuantum's approach is rooted in the insight that only
      the semiconductor foundry ecosystem can manufacture the billions of photonic components
      needed for useful quantum computation.
