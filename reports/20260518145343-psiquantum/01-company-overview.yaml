  - id: milestones-adverse
    title: Key Milestones, Leadership Changes, and Critical Perspectives
    body: >-
      PsiQuantum's trajectory has been marked by a series of landmark funding events, product
      announcements, and strategic partnerships. The company published its Omega silicon photonics
      chipset in Nature in February 2025, demonstrating beyond-state-of-the-art photonic component
      performance including 99.98% dual-rail qubit state preparation and measurement fidelity,
      making the paper one of the most-cited in its field within months. In September 2025, Construct,
      PsiQuantum's software suite for fault-tolerant algorithm development, was formally launched.
      Lip-Bu Tan, Intel's CEO, joined the PsiQuantum board in April 2026, reinforcing the company's
      semiconductor manufacturing relationships. Victor Peng replaced Jeremy O'Brien as CEO in
      early 2026, with O'Brien moving to Executive Chairman and long-term strategy; the transition
      reflects the company entering a large-scale deployment and operations phase that demands
      industrial execution experience. Critics and independent analysts point to the 2027 Brisbane
      operational target as highly aggressive: building a million-qubit fault-tolerant quantum
      computer by end of 2027 from a baseline of prototype-scale test systems represents a
      multi-order-of-magnitude scaling challenge that no quantum hardware company in any modality
      has come close to achieving. The Australian Financial Review described the A$940M government
      co-investment as a "bold bet," signaling the speculative nature of the timeline. The company
      is pre-revenue with no commercial hardware product available, and its runway depends entirely
      on continued government and private investor capital.
