  - id: government-defense-relationships
    title: Government and Defense Relationships
    body: >-
      PsiQuantum has established a substantial portfolio of government and defense partnerships
      that underpin both its financing model and strategic positioning as a national-security-
      relevant quantum computing platform. In 2023, DARPA selected PsiQuantum (alongside Microsoft)
      to advance to Phase 2 of its Underexplored Systems for Utility-Scale Quantum Computing
      (US2QC) program, which evaluates less-conventional approaches to utility-scale operation.
      The two companies were tasked with developing and defending a system design for a fault-tolerant
      prototype. PsiQuantum also holds a $22.5 million Phase 2 contract with the US Air Force
      Research Laboratory (AFRL) in Rome, New York, to deliver BTO (barium titanate) electro-optic
      phase shifters and comparative quantum circuit designs on PsiQuantum's tapeout platform. A
      joint $25 million federal R&D grant to PsiQuantum and GlobalFoundries was awarded in 2022
      by the US government to advance quantum chip manufacturing. In November 2025, PsiQuantum
      signed an MOU with Lockheed Martin to develop fault-tolerant quantum algorithms for aerospace
      and defense. The company maintains a Government Advisory Board including former Deputy
      Secretary of State Stephen Biegun and former Under Secretary of Defense Ellen Lord. Australia's
      investment includes bilateral commitment to host a strategic quantum computing asset, a
      government advisory layer, and a test and validation laboratory near Brisbane Airport.
    claimRefs:
