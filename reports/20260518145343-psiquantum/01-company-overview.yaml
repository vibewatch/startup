  - id: operations-facilities
    title: Global Operations and Facility Footprint
    body: >-
      PsiQuantum maintains operations across six locations spanning three continents. The Palo Alto
      headquarters at 700 Hansen Way houses chip design, pre-alpha system development, and testing.
      PsiFactory in Milpitas, California, expands manufacturing scale-up and assembly of the
      company's largest intermediate-scale test systems. PsiLabs is located at the STFC Daresbury
      Laboratories in Daresbury, United Kingdom, where unique cryogenic infrastructure supports
      testing of prototype cryogenic cabinets; the UK government provided funding for this R&D
      centre when Secretary of State Michelle Donelan opened it in September 2023. GlobalFoundries'
      Fab 8 in Malta, New York, serves as the semiconductor manufacturing partner, producing
      thousands of 300-millimeter silicon photonic wafers on PsiQuantum's proprietary Omega chipset
      platform. Two planned utility-scale deployment sites will anchor major government-co-funded
      quantum campuses: Brisbane Airport in Queensland, Australia (targeting end-of-2027 operational
      date), and the Illinois Quantum and Microelectronics Park (IQMP) at the former US Steel South
      Works site on Chicago's South Side. Illinois committed a $200 million incentive package
      requiring PsiQuantum to invest at least $1.09 billion and create 154+ full-time jobs at IQMP.
      The Chicago site provides 128 acres immediately available plus 312 acres for expansion, with
      access to Lake Michigan for cooling water and proximity to the University of Chicago and
      national laboratories.
