callouts:
  - calloutType: strength
    title: "Unprecedented Government-Backed Capitalization"
    body: >-
      PsiQuantum's combination of $1B+ Series E at $7B valuation, Australian government
      A$940M co-investment, and US government (Illinois + DARPA + AFRL) support makes it
      the best-capitalized private quantum computing company globally, with multi-sovereign
      commitment to its success distinguishing it from peers that rely solely on VC funding.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO026
      - CO028

  - calloutType: risk
    title: "Aggressive 2027 Operational Timeline Poses Execution Risk"
    body: >-
      PsiQuantum's stated target of having a million-qubit fault-tolerant quantum computer
      operational in Brisbane by end of 2027 is widely viewed as highly aggressive. Independent
      analysts and the broader quantum community note that no company in any qubit modality
      has built error-corrected systems at anywhere near this scale. Government investment
      covenants may be tied to milestone delivery, creating financial and reputational risk
      if timelines slip.
    claimRefs:
      - CO036
      - CO037
      - CO038

  - calloutType: insight
    title: "Leadership Transition Signals Deployment Phase"
    body: >-
      The appointment of Victor Peng as Interim CEO in early 2026, replacing co-founder
      Jeremy O'Brien who moves to Executive Chairman, reflects a deliberate transition
      from research-oriented founding leadership to industrial operations and deployment
      execution. Peng's background managing Xilinx through a $49B acquisition brings
      supply chain, large-scale manufacturing, and corporate operations credibility
      precisely when PsiQuantum needs those competencies most.
    claimRefs:
      - CO007
      - CO008
      - CO033

