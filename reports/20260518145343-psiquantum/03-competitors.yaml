- id: adjacent-and-substitute-alternatives
  title: Adjacent and Substitute Alternatives
  body: 'PsiQuantum also faces serious pressure from adjacent architectures and from substitutes that can satisfy buyer needs before universal FTQC exists. D-Wave does not compete on the same algorithmic destination, but for optimization-heavy buyers it competes on what matters now: uptime, production-grade workflows, and signed system contracts. QuEra''s neutral-atom approach is more direct because it pairs room-temperature atom arrays with Braket access, on-prem HPC integration, and a roadmap that already discusses logical qubits. Xanadu is the closest photonic analog to PsiQuantum, because it shares a fiber-networked photonic story and openly argues that modularity can scale to millions of qubits. But Xanadu is still managing optical-loss constraints, and its current Aurora machine is far smaller than PsiQuantum''s utility-scale ambition. Rigetti remains relevant as a superconducting full-stack player with both cloud history and a sellable on-prem QPU. Finally, AWS Braket and NVIDIA represent
    substitute layers rather than direct hardware rivals: Braket lowers vendor lock-in by aggregating modalities under one cloud workflow, while NVIDIA frames useful quantum computing as a hybrid AI/HPC problem. Together they reduce the urgency for buyers to bet early on any one vendor.'
