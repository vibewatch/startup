callouts:
- calloutType: strength
  title: Foundry-scale photonics is still a real differentiator
  body: PsiQuantum is still unusual in insisting that commercially useful FTQC has to look like a semiconductor and fiber-networking problem, not just a better qubit problem. That thesis remains differentiated versus IBM's cryogenic modularity, Quantinuum's trapped-ion fidelity narrative, and D-Wave's optimization-first approach.
  claimRefs:
  - CP001
  - CP002
  - CP039
- calloutType: risk
  title: The biggest near-term moat problem is access, not physics
  body: IBM, Quantinuum, IonQ, D-Wave, QuEra, and Rigetti all let buyers run workloads or install hardware today. PsiQuantum's lack of public compute access preserves focus and secrecy, but it also means rivals collect more customer feedback, build more developer familiarity, and create earlier procurement lock-in.
  claimRefs:
  - CP003
  - CP015
  - CP019
  - CP024
  - CP026
  - CP036
- calloutType: risk
  title: Modularity is no longer a unique story
  body: IEEE Spectrum's 2025 reporting shows that IBM, IonQ, and Xanadu all increasingly frame the road to useful quantum systems around linking processors together. PsiQuantum still has a distinctive fiber-native implementation, but not a monopoly on the modularity narrative.
  claimRefs:
  - CP032
  - CP035
  - CP040
- calloutType: insight
  title: Cloud marketplaces cap switching costs before FTQC
  body: Amazon Braket, Azure distribution, IBM plans, and IonQ/Quantinuum cloud packaging let customers experiment across modalities without choosing one permanent architecture. That keeps competition focused on credibility and access rather than durable lock-in until error-corrected systems become production-critical.
  claimRefs:
  - CP014
  - CP018
  - CP030
  - CP038
