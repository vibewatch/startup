- id: commercial-access-packaging
  title: Commercial Access, Packaging, and Switching Friction
  body: The most important competitive fact for 2026 is not qubit count alone but who already has a productized access path. IBM exposes the cleanest commercial ladder, from free credits to pay-as-you-go, annual premium capacity, and on-prem systems. Quantinuum offers direct subscriptions, Azure distribution, grants, and now Helios in cloud and on-prem form. IonQ combines on-demand cloud usage, reserved time, and a rack-based Forte Enterprise system that fits typical data centers. D-Wave is even more commercial in practice for optimization buyers because Leap provides real-time answers, high uptime, and on-prem purchase options that have already converted into signed hardware revenue. QuEra similarly lets users start in Amazon Braket, move to premium direct access, and graduate to on-prem HPC integration. Against that backdrop, PsiQuantum has a software suite and high-value sovereign projects, but no public compute access or self-serve price signal. That absence may be rational while hardware
    is immature, yet it means switching costs remain low for prospective buyers because they can sample multiple modalities through cloud marketplaces and partner channels before making a deep commitment to one architecture.
