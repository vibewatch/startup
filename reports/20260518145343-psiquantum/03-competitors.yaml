- id: moat-durability-and-risks
  title: Moat Durability and Competitive Risks
  body: 'PsiQuantum''s moat is real but not yet fully durable. The company still owns a differentiated narrative around foundry- scale silicon photonics, standard fiber networking, and higher-temperature cabinet architecture, and Construct gives it a fault-tolerant software co-design layer that many competitors only partially mirror. Those are substantive advantages, especially if million-qubit systems really do reward manufacturability and networking over monolithic heroic devices. But three risks materially compress that moat. First, commercial access risk: IBM, Quantinuum, IonQ, D-Wave, QuEra, and even Rigetti are already gathering customer data, developer mindshare, and procurement relationships. Second, narrative convergence risk: IEEE Spectrum''s reporting shows modular interconnect is now a shared industry answer, not a unique PsiQuantum answer. Third, adjacent-architecture risk: QuEra can challenge the infrastructure-efficiency story from neutral atoms, Xanadu can challenge the photonic
    story from inside the same modality, and Microsoft still carries a step-function upside if topological qubits become real. The result is a durable technical differentiation, but only a medium-strength commercial moat until PsiQuantum converts that differentiation into accessible systems, ecosystem adoption, or undeniable execution at Brisbane and Chicago.'
