      quantum computing market. For PsiQuantum specifically, all committed revenue
      and co-investment through 2028 is government-funded. The company's commercial
      market entry is entirely contingent on demonstrating utility-scale fault-tolerant
      computation first — making the 2027 Brisbane target the single most important
      near-term commercial milestone.
