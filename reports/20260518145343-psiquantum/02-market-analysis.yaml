    body: >-
      If PsiQuantum achieves FTQC at scale even 5–10 years before competitors, it would
      capture meaningful share of what BCG projects as a $90–170B hardware and software
      provider market by 2040. Government co-investors are effectively purchasing an option
      on this outcome. Quantum computing's "winner-take-most" technology dynamics — akin
      to semiconductor nodes — could amplify first-mover advantage significantly.
