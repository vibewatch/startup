  - id: segment-buyer-analysis
    title: Buyer Segmentation and Adoption Path
    body: >-
      PsiQuantum's commercial go-to-market strategy identifies five primary verticals with
      fault-tolerant quantum advantage: pharmaceutical and life sciences (drug discovery via
      quantum molecular simulation), financial services (portfolio optimization, derivatives
      pricing, fraud detection at scale), energy and materials (battery chemistry, solar
      cell simulation, catalysis), defense and national security (post-quantum algorithm
      development, secure communications modeling), and aerospace and transport (computational
      fluid dynamics, trajectory optimization). Current and near-term buyers are governments
      and defense agencies that co-fund the infrastructure required to deploy the first
      utility-scale systems. Enterprise buyers — pharma, finance, and energy — are in early
      research and algorithm pre-development stages: BCG tracked over 100 active proof-of-concept
      projects among Fortune 500 companies in 2023, representing approximately $300 million in
      total enterprise investment. For PsiQuantum specifically, three commercial partnership
      categories exist as of May 2026: algorithm development MOUs (Lockheed Martin for defense,
      Airbus for CFD), software platform pilots (Construct with National Cancer Center Japan,
      Mitsubishi Chemical for materials), and government research co-funding (DARPA, AFRL).
      The budget owner differs sharply by segment: in defense, procurement budgets (R&D appropriations);
      in pharma, a dedicated quantum R&D line item emerging under Chief Science Officers;
      in finance, a hybrid technology and risk budget controlled by CTO offices. The adoption
      trigger for commercial quantum is consistently described as demonstrated "quantum advantage"
      — the ability to solve a problem faster or better than classical + AI alternatives, which
      PsiQuantum asserts requires fault tolerance at scale rather than NISQ-era approaches.
