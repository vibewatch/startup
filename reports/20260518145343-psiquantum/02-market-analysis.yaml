chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The quantum computing market sits at approximately $1.4–3.5 billion globally in 2025,
    growing toward $4–20 billion by 2030 depending on scope and analyst methodology. PsiQuantum
    targets the fault-tolerant quantum computing (FTQC) sub-segment, which most analysts project
    does not generate meaningful commercial revenue until the early-to-mid 2030s — directly
    challenging the company's 2027 Brisbane operational claim. The relevant TAM for FTQC-enabled
    applications across pharma, finance, defense, materials, and energy is estimated at $90–170
    billion in hardware/software revenue by 2040 (BCG) or $450–850 billion in total economic
    value. PsiQuantum's near-term serviceable market is defined almost entirely by government
    co-investment and defense contracts, with commercial enterprise buyers entering only after
    demonstrated utility-scale performance. The critical adoption constraint is timeline: every
    analyst forecast that does not rely on PsiQuantum's own roadmap projects FTQC arriving after
    2030, making the 2027 target a meaningful outlier that warrants independent validation.

sections:
  - id: market-boundary
    title: Market Boundary, Scope, and Adjacent Markets
    body: >-
      PsiQuantum competes in the quantum computing hardware and systems market, specifically
      in the fault-tolerant quantum computing (FTQC) sub-segment. The relevant market scope
      includes: fault-tolerant quantum computer hardware systems (processors, cryogenic
      infrastructure, control electronics), FTQC systems integration and installation,
      quantum algorithm development services and software platforms (analogous to PsiQuantum's
      Construct suite), and government-funded quantum programs. Excluded from PsiQuantum's
      addressable market are: noisy intermediate-scale quantum (NISQ) cloud computing services
      (dominated by IBM Quantum, AWS Braket, Google Quantum AI, Quantinuum, IonQ), quantum
      networking and quantum key distribution (separate hardware category), quantum sensing
      (separate application domain), and post-quantum cryptography (PQC) software migration
      services (defense against quantum threats, not quantum hardware). The status-quo
      substitute for quantum computing in molecular simulation is classical high-performance
      computing (HPC) and AI-accelerated simulation; in finance, classical optimization
      solvers and AI; in cryptography, classical post-quantum algorithms without quantum
      hardware. IonQ (trapped ions, Nasdaq-listed), Quantinuum (trapped ions, Honeywell
      subsidiary), IBM Quantum (superconducting), Google Quantum AI (superconducting), and
      Microsoft (topological, Azure Quantum) compete in overlapping market segments but
      differ in qubit modality, timeline to fault tolerance, and business model. Only PsiQuantum
      and Microsoft (with its topological qubit approach) are pursuing full fault tolerance
      as a first-principles hardware design objective without a NISQ commercial offering today.
