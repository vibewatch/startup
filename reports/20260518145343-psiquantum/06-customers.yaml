artifact: customers
slug: psiquantum
runDate: "2026-05-18"
company:
  name: PsiQuantum
chapter:
  number: 6
  title: Customers
  summary: >-
    PsiQuantum has assembled an unusually strong set of named public counterparties for a pre-hardware
    quantum company, but the proof quality is still mostly pre-commercial. The disclosed customer base is
    led by government co-investment and validation relationships in Australia, Illinois, DARPA, and the
    UK, while enterprise evidence centers on limited-access Construct collaborations with Airbus,
    Lockheed Martin, National Cancer Center Japan, and Mitsubishi Chemical / the University of Tokyo.
    Public adoption breadth is improving across geographies and verticals, yet there are still no
    disclosed production customers, public prices, renewal metrics, or enterprise contract values, which
    keeps concentration and conversion risk high.
sections:
  - id: government-co-investment-partners
    title: Government Co-Investment Partners
    body: >-
      PsiQuantum's most material customer-adjacent relationships are not classic software accounts; they
      are sovereign co-investment, infrastructure, and validation programs. Australia is the single
      biggest example. Department of Industry and BusinessWire materials say the Australian and
      Queensland governments committed almost A$1 billion / A$940 million to build a utility-scale,
      fault-tolerant quantum computer in Brisbane, with the company also expected to establish its
      Asia-Pacific headquarters, create local jobs, and develop research and supply-chain links. Illinois
      is the second major anchor. The State of Illinois named PsiQuantum the anchor tenant at the
      Illinois Quantum and Microelectronics Park and disclosed a $200 million incentive package,
      $1.09 billion minimum company investment, and a plan to work with customers including Fortune 500
      companies on future fault-tolerant algorithms. DARPA and UK government relationships deepen the
      pattern: DARPA is evaluating PsiQuantum's utility-scale system design and use cases through US2QC,
      while UK government and UKRI materials frame the Daresbury relationship as infrastructure and
      ecosystem support around cryogenics and R&D. Together, these are powerful adoption signals because
      real governments are underwriting sites, facilities, and technical validation. But they are still
      closer to strategic sponsorship and future procurement preparation than to conventional recurring
      revenue from deployed quantum workloads.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU021, CU025, CU043]
    tableRefs: [TU001]
    figureRefs: []
  - id: commercial-rd-partnerships
    title: Commercial R&D Partnerships
    body: >-
      The enterprise customer story is strongest when read as application co-development rather than as
      closed revenue conversion. Airbus is using PsiQuantum to develop and test fault-tolerant quantum
      algorithms for computational fluid dynamics and aircraft-aerodynamics problems, with public proof in
      both PsiQuantum and third-party coverage. Lockheed Martin's own page says the two companies formed
      a strategic collaboration to build aerospace and defense applications and integrate those workflows
      onto Construct, explicitly describing deployment as something that will matter once the technology
      matures. National Cancer Center Japan signed a collaborative research agreement aimed at oncology,
      healthcare R&D, and future drug discovery workflows, again using Construct as the near-term working
      surface. The Japan workforce partnership adds Mitsubishi Chemical and the University of Tokyo,
      where the immediate "customer" behavior is education and application design, not production
      compute: participants use Construct, learn FTQC methods, and then move into chemistry and materials
      R&D phases. This gives PsiQuantum real named logos across aerospace, defense, healthcare, and
      industrial chemistry. It does not yet give public proof of live paid workloads, contractual renewal,
      or production deployment. The important diligence distinction is therefore between strategic
      reference accounts and monetized customers: PsiQuantum clearly has the former, but public evidence
      does not yet prove the latter.
    claimRefs: [CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU023, CU024, CU041, CU042]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: customer-journey-and-adoption-trajectory
    title: Customer Journey and Adoption Trajectory
    body: >-
      Publicly visible adoption follows a consistent sequence. First, PsiQuantum wins a sponsor,
      ecosystem, or lighthouse relationship around a future use case or site. Second, it exposes the
      counterparty to Construct, where fault-tolerant algorithms, resource estimates, and workflow design
      can happen before hardware is available. Third, it uses that collaboration to develop quantum-native
      application logic in a narrow domain such as aerospace fluid dynamics, defense workflows, oncology,
      or chemistry. Only after that would the relationship plausibly graduate into paid utility-scale
      system usage at Brisbane, Chicago, or a later site. The chronology matters. Reuters and UK sources
      show the earlier stage was ecosystem and infrastructure build-out in 2023; Australia and Illinois in
      2024 shifted the story toward sovereign deployment; and the 2025-2026 Airbus, Lockheed, NCC Japan,
      and Japan workforce announcements show broader vertical-specific application work. What is still
      missing is the denominator that normally proves adoption: public customer count, active users,
      workloads run, compute hours, reserved capacity, or recurring revenue. That means the adoption curve
      is visible in breadth and specificity, but not in utilization. For diligence purposes, the company
      should be described as having a widening top-of-funnel of named high-value counterparties and a more
      sophisticated pre-hardware journey, not a publicly proven base of scaled production customers.
    claimRefs: [CU011, CU012, CU021, CU022, CU023, CU024, CU026, CU036, CU037, CU042, CU043, CU044]
    tableRefs: [TU002]
    figureRefs: [FU001, FU002]
  - id: customer-concentration-and-commercial-risk
    title: Customer Concentration and Commercial Risk
    body: >-
      The central customer risk is that disclosed value remains overwhelmingly government-led while
      commercial proof remains pre-revenue. Australia and Illinois are the only public relationships in
      this chapter with large disclosed dollar values, and both are milestone-driven public support
      packages rather than straightforward market-priced usage contracts. Enterprise announcements are more
      specific than generic logo slides, but they still use the language of collaboration, MOU,
      partnership, training, and research agreement. Public sources expose no NRR, GRR, churn, NPS,
      renewal rate, price card, or production SLA. The strongest durability proxies are program horizons:
      Brisbane's end-2027 target, Illinois' multi-year capex and jobs obligations, and the Japan
      workforce program's six-month cohort plus two-year follow-on R&D. Adverse Australian commentary goes
      further and argues that the public process around the Brisbane package was politically driven and
      speculative, underscoring that government enthusiasm should not be mistaken for verified market
      demand. The right underwriting conclusion is therefore balanced. PsiQuantum has credible named
      counterparties, meaningful geographic spread, and improving use-case specificity. But until at least
      one enterprise relationship becomes a disclosed paid deployment or recurring software engagement, the
      customer base should be treated as strategically promising, commercially early, and highly exposed to
      concentration and conversion risk.
    claimRefs: [CU024, CU025, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU038, CU039, CU040]
    tableRefs: [TU004, TU005]
    figureRefs: [FU004]
