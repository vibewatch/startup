figures:
  - id: FU001
    title: Customer Journey Map
    type: flow
    summary: >-
      PsiQuantum's visible customer motion starts with sponsor or design-partner engagement, moves through
      limited-access Construct co-development, and only later points toward utility-scale deployment.
    data:
      nodes:
        - { id: sponsor, label: "Sponsor / lighthouse identified" }
        - { id: usecase, label: "Use case framed with government or enterprise counterparty" }
        - { id: construct, label: "Construct limited-access algorithm design" }
        - { id: validation, label: "Pilot / benchmark / training workflow" }
        - { id: deployment, label: "Utility-scale site or system deployment" }
        - { id: expansion, label: "Repeat scope / broader industry adoption" }
      edges:
        - { from: sponsor, to: usecase }
        - { from: usecase, to: construct }
        - { from: construct, to: validation }
        - { from: validation, to: deployment }
        - { from: deployment, to: expansion }
    approximationNotes: >-
      The map is a synthesized journey inferred from public announcements; it reflects the sequence shown
      in disclosed relationships, not an internally published sales-process diagram.
    claimRefs: [CU011, CU016, CU018, CU036, CU037]
  - id: FU002
    title: Adoption / Deployment Funnel
    type: funnel
    summary: >-
      Public evidence shows many named engagements at the top of the funnel, fewer explicit software or
      algorithm programs, and zero disclosed production customers at the bottom.
    data:
      items:
        - { label: "Named public counterparties", value: 8 }
        - { label: "Named application / algorithm programs", value: 5 }
        - { label: "Named flagship site programs", value: 2 }
        - { label: "Public production customers", value: 0 }
    approximationNotes: >-
      Counts are derived from the named public counterparties and programs explicitly disclosed in this
      chapter's sources. They are relationship counts, not billable-account counts.
    claimRefs: [CU021, CU022, CU023, CU026, CU044]
  - id: FU003
    title: Customer Proof Matrix
    type: matrix
    summary: >-
      Proof quality is highest on named use-case specificity and lowest on disclosed revenue and
      production maturity.
    data:
      columns: ["Customer-side proof", "Use-case specificity", "Dollar disclosure", "Production evidence", "Repeat / duration visibility"]
      rows:
        - label: "Airbus"
          values: ["Medium", "High", "None", "No", "Low"]
        - label: "Lockheed Martin"
          values: ["High", "Medium", "None", "No", "Low"]
        - label: "NCC Japan"
          values: ["Medium", "High", "None", "No", "Low"]
        - label: "Australia / Illinois"
          values: ["High", "High", "High", "No", "Medium"]
        - label: "UTokyo / Mitsubishi"
          values: ["Medium", "Medium", "None", "No", "High"]
    approximationNotes: >-
      Matrix labels are qualitative assessments derived from the underlying claims: customer-side proof
      asks whether the counterparty itself or an official non-company source confirms the relationship,
      while repeat-visibility asks whether a public program horizon or follow-on phase is disclosed.
    claimRefs: [CU014, CU018, CU028, CU034, CU035, CU041, CU042]
  - id: FU004
    title: Retention / Repeat Cohort
    type: range
    summary: >-
      Because PsiQuantum does not disclose renewal or churn cohorts, the closest public durability proxy
      is the length of the stated engagement horizon by cohort.
    data:
      items:
        - { label: "Australia sovereign program", low: 24, base: 36, high: 44 }
        - { label: "Illinois site / incentive program", low: 36, base: 48, high: 65 }
        - { label: "Japan workforce + R&D program", low: 6, base: 18, high: 30 }
        - { label: "Enterprise MOU / pilot relationships", low: 6, base: 12, high: 24 }
    approximationNotes: >-
      Values are approximate months of publicly visible engagement horizon inferred from disclosed
      milestones, program durations, or follow-on phases; they are not contractual retention percentages.
    claimRefs: [CU028, CU029, CU038, CU040]
