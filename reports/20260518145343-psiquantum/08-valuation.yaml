- id: bull-base-bear-scenario-analysis
  title: Bull / Base / Bear Scenario Analysis
  body: 'The scenario spread is wide because timing itself is the asset. In the bull case, PsiQuantum translates today’s sovereign
    capital and government validation into an operational Brisbane system by late 2027, keeps Chicago on a visible follow-on
    path, and turns that proof into first commercial or sovereign access contracts. In that world, the current $7 billion
    mark can compound into a $15-25 billion outcome and generate venture-grade returns. The base case is much less dramatic:
    Brisbane arrives but slips by roughly a year, public support remains intact, and customer conversion stays slower than
    the current narrative implies. That yields a roughly $5-10 billion value range, which is near breakeven to modest upside
    from today’s entry. The bear case is not a sector collapse; it is company-specific execution failure. If Brisbane materially
    misses, financing resets, or the support stack weakens, valuation could compress to roughly $1-3 billion, implying severe
    impairment for investors buying at the current mark.'
