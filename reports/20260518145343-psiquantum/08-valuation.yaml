  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: Full cap table, liquidation preferences, side letters, anti-dilution provisions, and any senior security
      terms for the current preferred stack.
    whyItMatters: Return distributions in any flat, base, or bear outcome depend heavily on preference overhang, and public
      snippets are not sufficient to model investor recovery.
    diligencePath: Request the current investor cap table package and latest financing documents under NDA from management
      or lead investors.
  - type: private-evidence-only
    severity: material
    topic: burn-and-runway
    missingEvidence: Current cash balance, monthly burn, committed capex by site, and milestone-linked draw schedule against
      public support packages.
    whyItMatters: Without current burn and committed spend, investors cannot know whether the existing capital stack is ample,
      merely adequate, or still short of the Brisbane and Chicago buildout.
    diligencePath: Obtain CFO cash bridge, board KPI pack, and site capex schedule before underwriting any new capital deployment.
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: Reliable disclosed valuation and revenue anchors for every private quantum peer such as IQM, QuEra, and
      Pacific Fusion on a like-for-like 2025-2026 basis.
    whyItMatters: Private quantum markets are opaque, so the comparable set can only cover the best-documented names rather
      than the full population of relevant startups.
    diligencePath: Expand the comp set with proprietary database access, investor letters, and transaction docs if a formal
      investment committee memo requires exhaustive coverage.
    relatedTableRefs:
    - TV004
