- id: thesis-break-and-action-triggers
  title: Thesis-Break Criteria and Action Triggers
  body: 'The valuation thesis breaks before the technology necessarily fails. The first stop signal is schedule: if Brisbane
    drifts well past the current public target window, the lost time does not merely delay upside; it threatens government-support
    capture, makes the next financing much harder to price, and weakens the company’s premium versus better-documented peers.
    The second stop signal is external validation erosion. DARPA and AFRL are part of the credibility stack, so any material
    weakening there would remove an important defense against pure-hype narratives. The third stop signal is financial: a
    new round below the current $7 billion mark before a live system or clear commercial contract proof would crystallize
    the market’s judgment that timeline risk was underpriced. These triggers are intentionally concrete because a company
    at this stage is too easy to narrate around unless investors pre-commit to what failure looks like.'
  claimRefs:
