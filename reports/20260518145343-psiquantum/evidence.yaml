evidenceGaps:
  - type: missing-source
    severity: material
    topic: exact-burn-rate-and-runway
    missingEvidence: >-
      PsiQuantum's annual cash burn rate, current runway, and capital deployment schedule across Brisbane and Chicago
      sites
    whyItMatters: >-
      Without burn rate data, investors cannot assess whether the $1B Series E plus government grants are sufficient to
      reach first utility-scale hardware milestones
    diligencePath: >-
      Request management accounts or investor pack from company; financial analysis of disclosed government grant
      disbursement schedules from Australian/Illinois filings
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: australian-investment-covenants
    missingEvidence: >-
      Detailed contractual terms of the A$940M Australian investment including equity stake percentages,
      milestone-linked disbursement conditions, and default/clawback provisions
    whyItMatters: >-
      The terms of the Australian co-investment directly affect PsiQuantum's operational flexibility and financial risk
      if the 2027 Brisbane operational target is missed
    diligencePath: >-
      Review Australian government parliamentary disclosures and Freedom of Information requests; the MICRO Act
      agreement for Illinois has public release precedent
    relatedQuestionRefs:
      - QO011
  - type: missing-source
    severity: minor
    topic: board-composition-TO002
    missingEvidence: >-
      Complete PsiQuantum board composition including investor-designated directors, independent directors, and board
      committee structure; Leadership and Founder Table (TO002) covers named C-suite and co-founders but excludes
      board-level directors
    whyItMatters: Board composition determines governance quality, investor control, and CEO accountability mechanisms
    diligencePath: Request from company investor relations; review Delaware corporate filings
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: exact-headcount
    missingEvidence: Current precise employee headcount and geographic distribution as of May 2026
    whyItMatters: Headcount trend indicates whether the company is on track for site build-out hiring requirements
    diligencePath: >-
