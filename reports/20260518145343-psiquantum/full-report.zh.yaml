      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的护城河真实存在，但还没有完全耐久。公司仍拥有一个差异化叙事：晶圆代工规模硅光子、标准光纤网络，以及更高温度的机柜架构；Construct
              也给它一层容错软件协同设计能力，许多竞争者只能部分复制。尤其是在百万量子比特系统确实奖励可制造性和网络能力、而不是单体英雄式器件时，这些都是实质优势。但三类风险会明显压缩这条护城河。第一，商业访问风险：IBM、Quantinuum、IonQ、D-Wave、QuEra
              甚至 Rigetti 都已在收集客户数据、开发者心智和采购关系。第二，叙事趋同风险：IEEE Spectrum 的报道显示，模块化互连已经成为行业共同答案，不再是 PsiQuantum
              独有答案。第三，相邻架构风险：QuEra 可以用中性原子挑战基础设施效率叙事，Xanadu 可以从同一路线内部挑战光子叙事，Microsoft
              若拓扑量子比特成真，仍有阶跃式上行空间。结果是，技术差异化具备耐久性；但在 PsiQuantum 把这种差异转化为可访问系统、生态采用，或 Brisbane 和 Chicago
              无可否认的执行成果之前，商业护城河只属中等强度。
