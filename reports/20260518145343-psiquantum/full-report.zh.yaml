      - CU021
      - CU022
      - CU023
      - CU026
      - CU044
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    summary: 证据质量在具名用例的具体程度上最高，在收入披露和生产成熟度上最低。
    data:
