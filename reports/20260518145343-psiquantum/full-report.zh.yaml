  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 硅光子架构与 FBQC 路线
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的技术论点是：有用的容错量子计算，应该用电信波段单光子和大规模半导体基础设施来构建，而不是依赖定制、低良率的量子比特制造。按公司说法以及其 2025 年 Nature
              论文，光子堆栈已经集成融合型量子计算所需的最低限度构件：片上光子生成、路径编码量子比特制备与测量、芯片间光互连、双光子干涉，以及 Bell
              融合纠缠测量。底层计算模型是融合型量子计算（FBQC），这是一种测量优先架构；小型资源态上的纠缠测量，承担了更传统电路表述中酉门序列完成的逻辑工作。

              硬件实现异常偏制造。PsiQuantum 的技术页面、Omega
              发布材料和第三方光学行业报道都强调，公司已把低损耗氮化硅波导、超导纳米线单光子探测器（SNSPD），以及钛酸钡电光开关引入商业晶圆代工工艺。Nature 报道了一个完整集成的 300mm
              工艺，以及一个低温组件，其中包含光子 die、电子 PCB 和 100 通道电信光纤连接单元。这与只停留在实验室的光子堆栈有实质不同：产品概念已经把封装、光纤连接和可制造的低温基础设施纳入系统边界。

              架构上行空间很清楚。光子天然兼容光纤互连、低噪声传播和晶圆级光子集成；FBQC 也明确为利用带 heralding 和 fusion
              的概率性光子过程而设计。但同样的来源也划出了硬工程预算：可扩展光子计算仍需要极高的光源纯度、接近 1 的探测效率、很低的累积光损耗，以及极快、低损耗的开关。Nature 称，FBQC 可容忍从发射到探测约 10%
              量级的总损耗，以及约 1% 的单量子比特融合网络错误；这意味着，PsiQuantum 的可制造堆栈只有在系统规模下守住这些预算时才可信。
