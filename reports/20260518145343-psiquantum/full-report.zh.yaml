        - 资本实力弱得多，架构也不同
      - - Xanadu
        - SPAC 后的上市光子同行
        - 通过上市交易获得约 $302M 资本
        - Aurora 原型公告和公开市场通道
        - 直接光子参照，但融资规模小得多
        - SPAC 募资不等同于经过市场充分检验的稳态估值
