      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的商业 go-to-market
              策略锁定五个可能出现容错量子优势的核心垂直：医药和生命科学（借助量子分子模拟做药物发现）、金融服务（组合优化、衍生品定价、大规模欺诈检测）、能源和材料（电池化学、太阳能电池模拟、催化）、国防和国家安全（后量子算法开发、安全通信建模），以及航空航天和交通（计算流体力学、轨迹优化）。当前和近期买方是政府与国防机构，它们共同出资建设部署首批实用规模系统所需基础设施。企业买方——医药、金融和能源——还处在早期研究和算法预开发阶段：BCG
              追踪到 2023 年 Fortune 500 公司中有 100 多个活跃概念验证项目，企业总投资约 $300M。就 PsiQuantum 而言，截至 2026 年 5 月，商业合作分为三类：算法开发
              MOU（Lockheed Martin 面向国防，Airbus 面向 CFD）、软件平台试点（Construct 与 National Cancer Center Japan、Mitsubishi
              Chemical 面向材料），以及政府研究共同资助（DARPA、AFRL）。预算所有者因细分市场而显著不同：国防是采购预算（R&D 拨款）；医药是在 Chief Science Officers
              之下出现的专门量子 R&D 科目；金融则是 CTO 办公室控制的技术与风险混合预算。商业量子采用触发点始终被描述为已证明的“量子优势”——比经典 + AI 替代方案更快或更好地解决问题的能力；PsiQuantum
              认为，这需要规模化容错，而不是 NISQ 时代路线。
