    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与使命
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum, Corp. 是一家私营量子计算硬件公司，总部位于加州 Palo Alto, 700 Hansen Way,
              94304。公司宣称的使命，是打造并部署全球第一批有用的容错量子计算机，以规模化求解具备商业相关性的问题。PsiQuantum 由四名学者于 2016 年创立，他们此前在英国 University of
              Bristol 和 Imperial College London 开展过基础性的光子量子计算研究。创始团队包括 Jeremy O'Brien（联合创始人兼执行董事长，前 CEO）、Terry
              Rudolph（联合创始人兼首席架构师）、Pete Shadbolt（联合创始人兼首席科学官）和 Mark Thompson（联合创始人兼首席技术官）。2026 年初，资深半导体高管、前 AMD 总裁
              Victor Peng 出任临时 CEO；他曾带领 Xilinx 完成被 AMD 以 $49B
              收购，现负责日常运营与实用规模部署。公司押注这样一个假设：用光粒子编码量子信息的光子量子比特，叠加大规模半导体制造基础设施，是通向百万量子比特容错量子计算机最可扩展、也最务实的路径。PsiQuantum
              的路线根植于一个判断：只有半导体代工生态，才能制造有用量子计算所需的数十亿个光子组件。
