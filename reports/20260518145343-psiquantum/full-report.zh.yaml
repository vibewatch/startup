      - number: '4.3'
        title: 单位经济与公开基准走廊
        blocks:
          - type: paragraph
            body: >-
              直接单位经济无法从公开信息计算。PsiQuantum
              的长期论点在纸面上有吸引力：标准化的大规模晶圆代工产出、通过传统光纤实现光子网络，以及类似机架的低温架构；如果良率和集成跑通，结构上应比定制实验室系统更容易制造。但行业公开基准走廊依然严酷。D-Wave FY25
              10-K 报告显示，收入 $24.6M，对应净亏损 $355.1M、经营现金流出 $72.0M。DatacenterDynamics 报道 IonQ FY25 收入 $130M，年度净亏损
              $510.4M；Rigetti 收入 $7.1M，净亏损 $216.1M。这些不是直接路线可比公司，但仍是量子公司在规模化前能产生多少收入、以及商业化开始后亏损会多持久的最佳公开证据。对 PsiQuantum
              来说，缺失字段恰恰是检验晶圆代工杠杆能否转化为经济优势所必需的字段：毛利率、收入成本、利用率、营运资本、销售周期，以及按产品或合同类型确认的收入。披露这些之前，最好的公开“单位经济”视图，只能是公司制造主张与同行公开亏损走廊的混合。
