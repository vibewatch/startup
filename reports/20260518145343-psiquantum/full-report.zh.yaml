      - number: '2.2'
        title: 市场规模测算 — TAM、SAM、SOM
        blocks:
          - type: paragraph
            body: >-
              分析师对量子计算总市场的估算差异很大，取决于是否纳入 NISQ 云服务、企业软件和供应链组件，也取决于估算反映的是近期基础设施支出，还是长期价值创造。Grand View Research 估计，2024
              年全球市场为 $1.42B，到 2030 年增至 $4.24B，CAGR 为 20.5%。MarketsandMarkets 预计市场从 2025 年的 $3.52B 增至 2030 年的
              $20.20B，对应激进的 41.8% CAGR。Precedence Research 将 2025 年市场定为 $1.44B，到 2035 年增至 $19.44B，CAGR 为 29.73%。BCG 2024
              年更新预测，2030 年供应商市场为 $1–2B（近期、NISQ 时代），2040 年硬件和软件供应商收入为 $90–170B（容错时代），对应总经济价值创造 $450–850B。PsiQuantum 的相关
              TAM 是 FTQC 子赛道：2040 年 $90–170B 市场中，由硬件系统和容错应用量子访问贡献的部分。SAM
              受地理范围（初始部署阶段在澳大利亚和美国）、应用成熟度（药物分子模拟、国防、金融优化）和平台就绪度限制。PsiQuantum 的近期 SOM 几乎完全由政府和国防合同定义：$620M 澳大利亚共同投资、$200M
              Illinois IQMP 激励，以及美国联邦项目（DARPA、AFRL）。如果 2027 年 Brisbane 部署成功，2028 年以后来自商业的推测性 SOM 可按每套已安装系统每年数千万美元估算。所有头部
