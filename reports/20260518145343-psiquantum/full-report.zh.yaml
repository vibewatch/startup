    rows:
      - - 政府主权量子战略（US NQI、UK NQSP、AU 国家量子战略、EU Quantum Flagship）
        - 顺风
        - 当前至 2030 年后持续有效
        - PsiQuantum 近期主要收入 / 资金来自主权任务；即使没有商业 QC 优势，也能提供非市场需求
        - 核实 PsiQuantum 在澳大利亚 / 伊利诺伊州之外的政府管线；跟踪预算拨款状态
      - - NIST 后量子密码标准（FIPS 203/204/205，2024 年 8 月）
        - 顺风（紧迫性驱动）
        - 2024–2030 迁移窗口已启动
        - 强化政府为 FTQC 硬件买单的意愿，把它视为长期量子安全基础设施；PQC 迁移为合作伙伴创造近期需求
        - 跟踪 PsiQuantum 如何定位 Construct 与 PQC 算法共同开发的关系
      - - NVIDIA CUDA-Q / GPU-QPU 集成趋势
        - 顺风
        - 2025–2028 年活跃
        - NVIDIA 合作围绕 PsiQuantum 的 QPU 建起软件生态；硬件就绪后，企业切换成本会降低
        - 验证 CUDA-Q 集成深度：只是联合营销，还是共同开发？
      - - AI 推进经典模拟（药物发现、优化）
        - 逆风
        - 当前有效——还在加速
        - AI 在医药、金融、材料等原本最期待量子优势的领域超出预期；抬高量子优势门槛；BCG 明确将其列为下调近期市场预测的原因
        - 评估哪些 PsiQuantum 用例具备不易被 AI 替代的量子优势
      - - BCG 共识：FTQC 在 2040 年后到来
        - 逆风（时间线）
        - 2024 年分析师共识 vs. PsiQuantum 2027 年说法
        - PsiQuantum 的 2027 年 Brisbane 目标比分析师共识早 13+ 年；若错过，会在企业买方和共同投资方那里引发可信度风险
