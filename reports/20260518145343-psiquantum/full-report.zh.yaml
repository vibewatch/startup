      - CU037
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    summary: 公开证据显示，漏斗顶部有许多具名合作，明确的软件或算法项目较少，底部没有披露任何生产客户。
    data:
      items:
        - label: 公开具名对手方
          value: 8
        - label: 具名应用 / 算法项目
          value: 5
        - label: 具名旗舰场址项目
          value: 2
        - label: 公开生产客户
          value: 0
    approximationNotes: 计数来自本章来源中明确披露的具名公开对手方和项目；这是关系数量，不是可计费账户数量。
