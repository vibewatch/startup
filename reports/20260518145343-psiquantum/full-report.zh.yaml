  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与工程风险
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的核心技术风险是时间表被压缩。公开来源确认 Brisbane 目标是在 2027
              年底前投运，公司自己也称计划激进；但公开领域最强的独立技术证据仍是组件和子系统验证，而不是运行中的逻辑机器。Nature 的 Omega
              论文是重要去风险事件，因为它展示了可制造光子光源、探测器、互连和融合操作落在 300 mm
              平台上；但它没有演示一台连续运行的容错计算机。因此，从证明构件可行到证明数百万个物理光子量子比特能以可接受的损耗、良率、开关、低温可靠性和解码开销联网成实用规模系统，中间仍有很大缺口。

              技术卡点也彼此紧密耦合。FBQC 明确为模块化光子系统而设计，但其实用性仍取决于严格的损耗和错误预算、高质量单光子生成、低损耗开关，以及基于 SNSPD
              的高效率探测。公开技术文献继续把光源不可区分性和损耗控制视为一阶约束；PsiQuantum 自身材料也显示，系统仍依赖低温模块、光纤连接、封装和代工兼容集成。GlobalFoundries
              是公开具名的唯一同等规模代工生态，因此技术风险并不局限于物理；它嵌在可制造性和供应商集中度里。
