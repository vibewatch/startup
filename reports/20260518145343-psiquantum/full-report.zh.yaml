          - type: paragraph
            body: >-
              PsiQuantum 面对两只竞争时钟。第一只是技术时钟：Google 和 IBM 持续发布具名路线图、规格表和访问模式，让客户在 PsiQuantum
              对外部用户仍处于硬件前阶段时，已经有可触摸的替代选择。第二只是经济时钟：AI、HPC 和云聚合量子访问持续改善替代集合，服务那些在实用规模 FTQC 到来之前就想学习、实验或获得近期工作流价值的买方。这不能证明
              PsiQuantum 的光子逻辑是错的，但意味着时间本身就是竞争变量。即使最终架构更好，只要公司晚于承诺抵达，也可能失去心智份额、伙伴动能和定价权。

              市场含义是，PsiQuantum 的风险画像应被看作一个集成系统，而不是清单。竞争压力、里程碑纪律、出口管制清晰度、领导层稳定性和融资透明度彼此作用。可控延误和普通政策摩擦不会必然击穿投资逻辑；但如果公司进入
              2027 年时仍没有更清楚的系统基准、更清楚的合规映射或更清楚的资本披露，投资逻辑就会变脆。这些是可监测的预承诺信号，用来区分「困难但仍可融资的执行问题」和「投资逻辑破裂」。
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
              - CR040
      - number: '7.6'
        title: 证据展项
        blocks:
          - type: callout
            title: Brisbane 2027 是总风险
            body: 如果 Brisbane 明显滑期，损害不只停留在时间线观感；它会传导到公共支持获取、下一轮融资、Chicago 排序和客户信心。
