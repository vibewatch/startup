      - - 公用事业级 QC 部署资本强度
        - 逆风（准入）
        - 2026–2030 扩张阶段
        - 每次部署需要 $500M–$1B+ 的系统加基础设施成本；早期买方仅限政府和主权财富基金；2030 年前商业 SOM 受限
        - 建模 Brisbane 的每量子比特成本和总系统成本路径
      - - 经典 HPC / 超算竞争（GPU 集群、exascale）
        - 逆风
        - 当前至 2030 年后持续有效
        - 最新 GPU 集群和 AI 加速器继续抬高量子优势门槛；Frontier（exascale，1.2 EFlops）及后续系统压缩量子优势窗口
        - 评估哪些具体 PsiQuantum 用例相对 2026 年经典 HPC 基准能展示量子优势
      - - 先收割后解密（HNDL）对加密的量子威胁
        - 顺风（安全紧迫性）
        - 2024–2035 迁移紧迫窗口
        - 推动政府投资量子能力，包括用于加密和安全通信保障的 FTQC；带动 PsiQuantum 的国防合同（AFRL、DARPA）
        - 监测 CNSA Suite 2.0 和 CISA 迁移时间线
    notes: 方向从 PsiQuantum 视角判断（顺风 = 加速采用 / 融资；逆风 = 形成阻力）。时间为近似值，依据截至 2026 年 5 月的公开路线图和分析师估算。
