      - number: '1.4'
        title: 政府与国防关系
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 已建立一组厚实的政府与国防合作关系，既支撑融资模式，也把公司定位成具有国家安全意义的量子计算平台。2023 年，DARPA 选择 PsiQuantum（以及 Microsoft）进入
              Underexplored Systems for Utility-Scale Quantum Computing（US2QC）项目 Phase
              2；该项目评估通向实用规模运行的非常规路线。两家公司需要开发并论证一个容错原型系统设计。PsiQuantum 还持有一份与美国 Air Force Research Laboratory（AFRL）Rome,
              New York 实验室签订的 $22.5M Phase 2 合同，用于在 PsiQuantum 的 tapeout 平台上交付 BTO（钛酸钡）电光相位调制器和对比量子电路设计。2022 年，美国政府向
              PsiQuantum 和 GlobalFoundries 授予一笔 $25M 联邦 R&D 联合补助，用于推进量子芯片制造。2025 年 11 月，PsiQuantum 与 Lockheed Martin 签署
              MOU，共同开发用于航空航天和国防的容错量子算法。公司还设有 Government Advisory Board，成员包括前副国务卿 Stephen Biegun 和前国防部副部长 Ellen
              Lord。澳大利亚投资包含几层承诺：承载一项战略量子计算资产、设置政府顾问层，并在 Brisbane Airport 附近建设测试与验证实验室。
