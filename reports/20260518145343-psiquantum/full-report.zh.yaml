      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              与 PsiQuantum 相关的量子计算市场关键增长驱动包括：（1）政府主权量子战略——美国 National Quantum Initiative、英国 National Quantum
              Strategy、澳大利亚 National Quantum Strategy 和 EU Quantum Flagship 合计承诺在未来十年向量子 R&D 投入数百亿美元，提供非市场需求。BCG 估计，未来
              3–5 年全球公共部门支持可能超过 $10B。（2）后量子密码期限压力——NIST 于 2024 年 8 月敲定首批三个后量子密码标准（FIPS 203、204、205）。Y2Q “Q-Day”
              风险，即量子计算机攻破 RSA 加密，推动政府和关键基础设施运营方同时投资 PQC 迁移和量子安全硬件。PQC 市场预计到 2030 年增至 $2.84B，CAGR 为 46%。（3）FTQC
              半导体制造可行性：PsiQuantum 的 Omega Nature 论文（2025 年 2 月）和 GlobalFoundries
              制造合作证明，光子量子芯片可以在商业晶圆厂按晶圆规模生产，降低过去假定的量子硬件部署资本成本。（4）AI-量子融合：NVIDIA 与 PsiQuantum 的合作以及 CUDA-Q 集成，显示企业把 GPU
              加速模拟与量子处理结合的兴趣正在升温。关键采用约束包括：（1）时间表不确定——BCG 2024 年共识认为，完整规模容错要到 2040 年之后；PsiQuantum 的 2027 年目标至少偏离分析师共识 13
              年。没有独立专家验证 2027 年时间表。（2）“先收割、后解密”威胁模型——量子对加密的威胁真实存在，但近期应对方式是 PQC 软件迁移（不是量子硬件），因此安全应用对 FTQC
              硬件的直接紧迫性下降。（3）资本强度——每套实用规模量子系统预计都需要数亿美元部署预算，早期采用者被限制在政府范围内。（4）经典 AI 竞争——AI 在分子模拟、药物发现和金融优化中的表现超过预期，侵蚀了
              NISQ 时代部分原本预测的量子优势窗口。
