      - number: '1.2'
        title: 融资历史与投资者基础
        blocks:
          - type: paragraph
            body: >-
              自成立以来，PsiQuantum 已累计融资超过 $1.7B。按已报道融资额计，它是全球资本最充足的私营量子计算公司。公司在早期轮次中约融资 $215M；2021 年 7 月由 BlackRock 领投的
              $450M Series D 轮完成后，累计融资达到 $665M，估值为 $3.15B。2024 年 4 月，澳大利亚联邦政府和 Queensland 政府通过股权、补助和贷款组合共同投资 A$940M（约
              $620M），换取 PsiQuantum 承诺于 2027 年底前在 Queensland 的 Brisbane 建成全球第一台实用规模量子计算机。2025 年 3 月，Reuters 报道 PsiQuantum
              正以 $6B 估值融资至少 $750M。2025 年 9 月，PsiQuantum 完成 $1B Series E 轮，估值 $7B，由 BlackRock 关联方领投，Temasek、Baillie
              Gifford、Macquarie Capital、Ribbit Capital、NVentures（NVIDIA 的风险投资部门）、Qatar Investment Authority、Adage
              Capital、Morgan Stanley 的 Counterpoint Global 等参投。PsiQuantum 的核心投资者由 BlackRock、Baillie Gifford 和
              M12（Microsoft 风投基金）锚定，这些机构都参与过多轮融资。公司仍处于营收前阶段，没有披露营收 run-rate 或烧钱速度，运营依赖股权和政府资金。
