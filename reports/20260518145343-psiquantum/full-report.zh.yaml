        - 仓位规模应反映二元进度风险和商业化风险
      - - 估值立场
        - 对主流成长投资而言偏高；只有按战略 FTQC 期权才算合理
        - 中
        - 没有新证明点前，避免继续加价
      - - 为什么不直接回避
        - 主权背书、DARPA/AFRL 验证和差异化光子制造仍保留上行空间
        - 中
        - 维持主动尽调，而不是直接否定公司
      - - 主要上调触发点
        - 可信的 2027 Brisbane 路径，加上首个付费商业证明
        - 中
        - 只有技术证据和变现证据同步改善时才上调
      - - 主要下行触发点
        - 进度破裂，或融资在当前标记以下重置
        - 中
        - 立即按悲观情景重新定价
    notes: 投资建议明确对价格敏感：$7B 只有在投资者愿意承保 2027–2028 年执行期权价值时才可能成立，不适合要求当下运营证据的投资者。
