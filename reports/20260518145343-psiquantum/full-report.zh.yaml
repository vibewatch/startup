      - number: '7.3'
        title: 监管、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              量子计算越来越被视为涉及国家安全的技术领域，这会改变 PsiQuantum 的风险姿态。BIS 的 2024 年临时最终规则 明确把量子计算和其他先进技术纳入管制；NSM-10
              则把量子领导力和摆脱脆弱密码体系的迁移，放在网络、经济和国家安全政策框架下。CISA 敦促关键基础设施运营者为后量子迁移做准备；NSA 更进一步警告，除非已知限制被克服，否则不建议 National
              Security Systems 采用 QKD/QC。对 PsiQuantum 来说，这意味着美国与 Australia 之间的跨境合作，处在出口管制、安全治理、政府客户尽调和技术转让审查不断收紧的环境中。

              法律 / IP 风险也有意义，并非已经清楚到无关生死。公开专利记录显示 PsiQuantum 确有已授权的光子量子
              IP，但也显示其他机构拥有更广泛的光子量子专利；这更像一个拥挤且不断演进的自由实施格局，而不是毫无争议的护城河。政府支持披露在金额、岗位和公共理由上更清楚，但如果 Brisbane
              错过重大里程碑，具体追索机制并不清楚。因此，公开记录仍留下未解问题：出口分类、Australia 特定违约条款，以及人员、设计和技术诀窍跨司法辖区流动的实际约束。
