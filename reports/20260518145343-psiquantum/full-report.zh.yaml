      - number: '4.5'
        title: 承销缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              承销结论很直接：PsiQuantum 公开可见的背书，可能足以让它留在赛道中，但公开证据仍不足以支撑正常的收入或利润率模型。公司有可信融资信号和官方政府伙伴；但同一组证据也解释了为什么这家公司仍难以定价。Fast
              Company 指出，尽管估值 $7B，PsiQuantum 还没有建成一台完整量子计算机；TechSpot 则把 2027
              年百万量子比特跃迁放在一个充满大胆承诺和创纪录估值的市场中解读。这种怀疑很重要，因为今天的现金流入大多是在给基础设施和技术验证去风险，而不是确认经常性客户需求。管理层至少需要披露六件事，才能让业务可承销：当前现金、烧钱速度、按来源确认的收入、定价或合同结构、站点级
              capex 预算，以及毛利率或服务成本数据。到那时之前，财务结论与其说是“弱”，不如说是“不透明”：业务可能具备战略重要性，且融资极其充足，但公开材料只支持资本强度论点，无法支撑可靠的经营模型。
