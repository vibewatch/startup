      - number: '1.3'
        title: 全球运营与设施布局
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 在三大洲六个地点运营。位于 700 Hansen Way 的 Palo Alto 总部承载芯片设计、pre-alpha 系统开发和测试。加州 Milpitas 的 PsiFactory
              扩大制造爬坡和公司最大中等规模测试系统的组装能力。PsiLabs 位于英国 Daresbury 的 STFC Daresbury Laboratories，那里独特的低温基础设施支持原型低温机柜测试；英国国务大臣
              Michelle Donelan 于 2023 年 9 月揭幕该中心时，英国政府为这个 R&D 中心提供了资金。GlobalFoundries 位于纽约州 Malta 的 Fab 8 是半导体制造伙伴，在
              PsiQuantum 专有 Omega 芯片组平台上生产数千片 300mm 硅光子晶圆。两个规划中的实用规模部署地点，将支撑大型政府共同资助的量子园区：澳大利亚 Queensland 的 Brisbane
              Airport（目标 2027 年底投入运行），以及 Chicago South Side 原 US Steel South Works 场址上的 Illinois Quantum and
              Microelectronics Park（IQMP）。Illinois 承诺提供 $200M 激励方案，要求 PsiQuantum 至少投资 $1.09B，并在 IQMP 创造 154+
              个全职岗位。Chicago 场址有 128 英亩可立即使用土地和 312 英亩扩展空间，可取用 Lake Michigan 冷却水，并靠近 University of Chicago 和国家实验室。
