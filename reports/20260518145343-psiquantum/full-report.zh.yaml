      - number: '4.2'
        title: 定价透明度、GTM 动作与牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              定价透明度实际上不存在。PsiQuantum 没有公布 QCaaS 费率、预留容量价格、软件订阅价或硬件标价。Construct
              被定位为面向企业、政府和研究人员的软件，但“目前只向一小部分专家用户开放”，也不保证更广泛访问的时间。这意味着它更像一套议价式企业或政府销售动作，而不是自助云商业。公开牵引力代理指标因此都是间接的：PitchBook
              将公司标记为“Generating Revenue”，并列出 544 名员工；Startup Daily 和 SmartCompany 则描述公司拥有超过 500 人的全球团队，并为 300mm BTO
              晶圆建立了新的测试与组装布局。这些来源都没有披露客户数、合同 backlog、ARR，或站点公告转化为可计费收入的速度。可能的 go-to-market
              路径，是长周期主权和战略企业采购流程，其中客户定制合同、验证里程碑和基础设施就绪度，比营销驱动的漏斗指标更重要。CAC、回本周期和利用率可能在内部存在，但公开证据只显示一种定制化、技术密集型企业动作。对前沿硬件公司来说，这可以接受；但也意味着传统软件式承销还无法仅凭公开材料完成。
