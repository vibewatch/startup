  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与相邻市场
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 竞争的市场是量子计算硬件和系统市场，更具体地说，是容错量子计算（FTQC）子赛道。相关市场范围包括：容错量子计算机硬件系统（处理器、低温基础设施、控制电子）、FTQC
              系统集成与安装、量子算法开发服务和软件平台（类似 PsiQuantum 的 Construct 套件），以及政府资助的量子项目。不属于 PsiQuantum
              可服务市场的包括：噪声中等规模量子（NISQ）云计算服务（由 IBM Quantum、AWS Braket、Google Quantum AI、Quantinuum、IonQ
              主导）、量子网络和量子密钥分发（独立硬件类别）、量子传感（独立应用领域），以及后量子密码（PQC）软件迁移服务（防御量子威胁，而不是量子硬件）。在分子模拟中，量子计算的现状替代品是经典高性能计算（HPC）和 AI
              加速模拟；在金融中，是经典优化求解器和 AI；在密码学中，是不依赖量子硬件的经典后量子算法。IonQ（离子阱，Nasdaq 上市）、Quantinuum（离子阱，Honeywell 子公司）、IBM
              Quantum（超导）、Google Quantum AI（超导）和 Microsoft（拓扑，Azure Quantum）都在重叠细分市场竞争，但量子比特路线、走向容错的时间表和商业模式不同。今天，只有
              PsiQuantum 和 Microsoft（拓扑量子比特路线）把完整容错作为第一性原理硬件设计目标，并且没有 NISQ 商业产品。
