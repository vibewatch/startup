            body: >-
              PsiQuantum 从创始人主导的研究叙事转向双园区部署叙事后，执行风险实质上升。Victor Peng 2026 年 2 月出任临时
              CEO，带来经过验证的半导体运营经验；但这也凸显公司正处于领导层过渡期，同时还要交付 Brisbane，然后是
              Chicago。公开激励和进展文件显示，站点执行并不抽象：岗位创造、投资节奏和建设里程碑都会影响激励获取，也影响规模叙事的可信度。最难的运营问题是，PsiQuantum 能否在不公开内部 KPI
              栈、替代代工准备度或完整项目管理结构的情况下，把一家光子 R&D 组织变成纪律化的系统交付组织。

              站点和伙伴执行带来的风险比光子品牌暗示的更大。Brisbane 和 IQMP 都需要在芯片性能之外完成低温设施安装、公用工程、设施集成、供应商协调和安全项目管理。DARPA 和 AFRL 支持是信心信号，但也确认
              PsiQuantum 仍处在政府验证与交付物环境中，而不是常规商业运营中。因此依赖地图比代工厂访问更宽：领导层稳定性、公共共同投资获取、低温 / 站点执行和伙伴合规，都在同一条关键路径上。
