      - number: '8.5'
        title: 最终尽调问题与开放问题
        blocks:
          - type: paragraph
            body: >-
              最后的尽调工作主要是财务和合同，而不是科学。公开证据足以说明 PsiQuantum
              融资充足、补贴很重、技术不简单；但不足以说明新投资者在下行情景里实际拥有什么，或当前资本消耗有多快。因此，最低限度的阻断性问题很直接：当前现金和月度烧钱速度；完整股权结构表和清算优先权堆叠；Brisbane 与
              Chicago 分站点关键路径；任何付费商业管线的金额、时间和性质；以及公共支持包附带的确切追索条款。如果管理层能补齐这些缺口并维持 2027
              年里程碑可信，建议可以上调。否则，当前标记应被视为观察名单价格，而不是可以买入的安全边际。
