  - id: FU004
    title: 留存 / 重复队列
    type: range
    summary: 由于 PsiQuantum 不披露续约或流失队列，公开材料里最接近耐久性的代理指标，是各队列所述合作周期的长度。
    data:
      items:
        - label: 澳大利亚主权项目
          low: 24
          base: 36
          high: 44
        - label: 伊利诺伊场址 / 激励项目
          low: 36
          base: 48
          high: 65
        - label: 日本人才 + 研发项目
          low: 6
          base: 18
          high: 30
        - label: 企业 MOU / 试点关系
          low: 6
          base: 12
          high: 24
    approximationNotes: 这些值是公开可见合作周期的大约月数，根据已披露里程碑、项目期限或后续阶段推断；不是合同留存率。
    claimRefs:
      - CU028
      - CU029
      - CU038
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 剩余风险视角显示，最高暴露集中在进度、集中度和资本不透明度，而不是任何单一法律纠纷。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 关键严重性
          values:
            - ''
            - GlobalFoundries 单一来源依赖（DEP-01）
            - 布里斯班 2027 年集成未达标（OPS-01）；下一轮融资前资本不透明
        - label: 高严重性
          values:
            - IP 拥挤 / 政策审查
            - 政府支持被俘获风险（REG-02）；临时领导层执行缺口（PEO-01）
            - 光子损耗和系统规模纠错开销（OPS-02）；场址和低温装置集成延误（OPS-05）
        - label: 中等严重性
          values:
            - QKD/QC 营销或采购错配（REG-05）
            - AI/HPC 替代风险
            - 安全和技术转让合规负担
    claimRefs:
      - CR037
  - id: FR002
    title: 风险传导图
    type: flow
    layout: wide
    summary: 最主要的下行连锁反应从技术延误传导到里程碑落空，再到融资压力、估值压缩和伙伴信心走弱。
    data:
      nodes:
        - id: n1
          label: 技术扩展缺口
        - id: n2
          label: 布里斯班进度延误
        - id: n3
          label: 公开里程碑落空
        - id: n4
          label: 需要追加资本
        - id: n5
          label: 估值受损
        - id: n6
          label: 伙伴 / 客户犹豫
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n2
          to: n6
        - from: n6
          to: n5
    claimRefs:
      - CR038
  - id: FR003
    title: 依赖图
    type: flow
    layout: wide
    summary: PsiQuantum 的交付路径取决于少数伙伴、公共出资方、设施和领导节点；这些节点必须同时撑住。
    data:
      nodes:
        - id: d1
          label: GlobalFoundries
        - id: d2
          label: 光子良率 / 开关 / 探测器
        - id: d3
          label: 低温模块和场址建设
        - id: d4
          label: 澳大利亚方案
        - id: d5
          label: 伊利诺伊方案
        - id: d6
          label: 领导层和项目管理
        - id: d7
          label: 商用系统交付
      edges:
        - from: d1
          to: d2
        - from: d2
          to: d3
        - from: d4
          to: d7
        - from: d5
          to: d7
        - from: d3
          to: d7
        - from: d6
          to: d3
        - from: d6
          to: d7
    claimRefs:
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策链从融资实力和主权验证出发，最终落到「观察」建议；但收入不透明和进度疑虑压住了结论。
    data:
      nodes:
        - id: n1
          label: $1B Series E 轮、估值 $7B，证明仍能拿到资本
        - id: n2
          label: 主权 + 地方补贴降低早期场址资本开支风险
        - id: n3
          label: DARPA / AFRL 提供技术验证
        - id: n4
          label: 未披露收入、定价或运行中机器
        - id: n5
          label: 反向来源称补贴 / 时间表仍具推测性
        - id: n6
          label: 建议：观察 / 当前价格下仅有条件参与
      edges:
        - from: n1
          to: n6
          label: 支持继续跟踪
        - from: n2
          to: n6
          label: 拉长现金跑道
        - from: n3
          to: n6
          label: 增加可信度
        - from: n4
          to: n6
          label: 压低确信度
        - from: n5
          to: n6
          label: 迫使严格执行入场纪律
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV035
      - CV036
      - CV048
  - id: FV002
    title: 估值敏感性
    type: matrix
    layout: standard
    summary: 敏感性网格展示时间、合同证明和融资情绪如何改变 2028 年估值区间。
    data:
      columns:
        - 布里斯班进度
        - 商业证明
        - 资本市场基调
        - 2028 年估值信号
        - 投资者解读
      rows:
        - label: 乐观
          values:
            - 按时 / 2027 年底
            - 首批付费合同可见
            - 量子融资窗口打开
            - 15-25B
            - 当前 $7B 入场可行
        - label: 基准
          values:
            - 延误 12-18 个月
            - 有试点兴趣，但定价清晰度有限
            - 只有选择性后续资本
            - 5-10B
            - 持平至小幅上行
        - label: 悲观
          values:
            - 重大落空 / 重新定基准
            - 无付费需求证明
            - 估值压缩 / 降价融资风险
            - 1-3B
            - 严重受损
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV031
      - CV032
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 2028 年悲观、基准和乐观情景下的低、中、高估值结果。
    data:
      items:
        - label: 悲观情景（2028 年价值，$B）
          low: 1
          base: 2
          high: 3
        - label: 基准情景（2028 年价值，$B）
          low: 5
          base: 7
          high: 10
        - label: 乐观情景（2028 年价值，$B）
          low: 15
          base: 20
          high: 25
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 风格对 PsiQuantum 打分，覆盖评估当前估值时最关键的维度。
    data:
      items:
        - label: 市场机会
          value: 8
          note: 如果 FTQC 落地，量子和 HPC 上行空间很大
        - label: 技术证明
          value: 6
          note: 架构工作扎实，但尚无完整公开机器
        - label: 商业证明
          value: 3
          note: 未披露经常性收入或公开定价
        - label: 主权资本支持
          value: 8
          note: 公共共同投资组合异常强
        - label: 竞争地位
          value: 6
          note: 光子路线差异化强，但 Quantinuum 如今更商业化
        - label: 估值支撑
          value: 4
          note: $7B 更多靠时间表可信度支撑，而非经济性
        - label: 证据质量
          value: 5
          note: 融资证据不错；烧钱速度和股权结构表证据偏弱
        - label: 下行控制
          value: 4
          note: 支持方案有帮助，但下行仍取决于未知条款
    claimRefs:
      - CV006
      - CV007
      - CV017
      - CV035
      - CV036
      - CV038
      - CV048
