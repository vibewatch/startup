companyProfile:
  summary: >-
    PsiQuantum 是一家硅光子公司，正用 GlobalFoundries 的 300mm CMOS 光子工艺，走晶圆代工制造路线，打造实用规模容错量子计算机（FTQC）。公司 2016 年创立于 Palo Alto，已获得
    $1B+ 私人资本，以及澳大利亚、Illinois 和美国联邦机构合计 $820M+ 政府共同投资。它的核心判断是：只有规模化 FTQC，而不是 NISQ
    时代设备，才能带来量子优势；硅光子路线最有希望给出所需量子比特密度和互连能力。公司目标是在 2027 年底前让首个实用规模系统在澳大利亚 Brisbane 运行。截至 2026 年 5 月，公司尚无营收，也没有商业客户。
