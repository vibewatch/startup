      - number: '8.2'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              情景区间很宽，因为时间本身就是资产。乐观情景下，PsiQuantum 把今天的主权资本和政府验证转化为 2027 年底前运行的 Brisbane 系统，让 Chicago
              保持可见的后续路径，并把这份证明转成首批商业或主权访问合同。在那种世界里，当前 $7 billion 标记可能复利到 $15-25 billion
              结果，产生成长投资级回报。基准情景没有那么戏剧化：Brisbane 交付但大约滑期一年，公共支持保持完整，客户转化慢于当前叙事暗示。这对应大约 $5-10 billion
              价值区间，相比今天入场接近打平到小幅上行。悲观情景不是行业崩塌，而是公司特定执行失败。如果 Brisbane 明显失约、融资重置，或支持栈走弱，估值可能压缩到大约 $1-3
              billion，意味着按当前标记买入的投资者将遭受严重减值。
