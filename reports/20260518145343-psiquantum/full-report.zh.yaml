  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与投资逻辑
        blocks:
          - type: paragraph
            body: >-
              应把 PsiQuantum 看作容错光子量子计算上的高上行、高脆弱性期权，而不是普通后期成长投资。正向逻辑真实存在：公司刚以 $7 billion 标记融资 $1 billion，围绕 Brisbane 和
              Chicago 获得主权与地方政府支持，并通过 DARPA 和 AFRL 拿到有意义的美国政府技术验证。它的光子架构、BTO
              开关制造和代工驱动扩展叙事，在一个仍难从实验室设备走向可制造系统的行业里，也保持差异化。但反向逻辑同样重要。公开证据仍没有显示经常性收入、公开定价或完整运行的量子计算机；反向来源还直接质疑补贴方案的投机性，以及澳大利亚遴选流程的完整性。按当前价格，合理动作是跟踪，或只在硬里程碑纪律下投资，而不是带着
              高确信买入的热情进场。
