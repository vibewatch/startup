      - number: '5.5'
        title: 技术风险与限制
        blocks:
          - type: paragraph
            body: >-
              最重要的限制是，PsiQuantum 展示的是构件，还不是公开的容错计算机。Omega
              打通了光源、探测器、开关、干涉、融合和联网闭环，因此令人印象深刻；但已发布指标是组件和子系统操作的基准结果，不是端到端逻辑机器。从功能完整的组件走到实用规模、连续运行的计算机，中间仍有制造良率、封装密度、低温可靠性、纠错开销和全系统软件编排这些关口。

              光子量子计算避开了一些难题，也保留了另一些困难物理问题。光子因低噪声和光纤兼容性而有吸引力，但可扩展运行仍取决于不可区分的单光子、低损耗路由和近单位效率探测。Nature
              明确把高速、低损耗开关列为大型光网络的必需条件；MIT 和 Science 来源也显示，一般光子系统对光源不可区分性和效率的要求有多苛刻。PsiQuantum
              的架构允许的工作温度显著高于超导量子比特，但它不会变成室温数据中心设备；探测器和集成模块仍需要 2-4 K 低温基础设施。

              商业成熟度同样受限。Construct 只向少数专家用户开放，没有披露公开自助硬件访问或正常运行时间 / SLA
              指标，公开伙伴证据也仍以联合开发为主。合起来看，产品在技术上差异化明显，组件层面的风险已实质下降；但在实用规模运营层面，还没有完成去风险。
