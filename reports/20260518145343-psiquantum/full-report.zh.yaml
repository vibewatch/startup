      - number: '8.3'
        title: 可比估值与市场定位
        blocks:
          - type: paragraph
            body: >-
              可比分析显示，PsiQuantum 很难被称为便宜。上市纯量子标的市值小得多，但它们今天提供的收入证据也远多于 PsiQuantum。D-Wave、IonQ 和 Rigetti
              都呈现同一模式：收入不大或仍早期、亏损很大、股权价值主要还是期权价值。这意味着公开市场倍数不能直接支撑 $7 billion，但它们说明资本市场愿意为未来技术领导力资本化多少。私有同业中，Quantinuum
              是最清楚的上沿锚点，因为据报道其 $10 billion 估值旁边有具名企业客户和已上线商业系统。Xanadu 是最接近的光子同业，但其近期公共资本事件规模远小于 PsiQuantum
              这一轮。可比读数是，PsiQuantum 在可见商业化上比大多数同业定价更靠前，因此要靠时间表可信度，而不是当前经济性，来守住这个标记。
