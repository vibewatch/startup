        title: 直接 FTQC 对手
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 最重要的直接对手，是那些已经围绕门模型量子计算机建立企业关系、同时公开宣称有路径走向容错的厂商。IBM 是最清晰的现有威胁：它拥有当前最广的设备队列、最透明的产品包装，并给出 2029 年
              Starling 目标，即 200 个逻辑量子比特和 1 亿个门。Google 在器件质量和纠错科学上仍然强大，但 2026 年 Willow 访问模式仍是选择性研究项目，而不是广泛商业服务。Microsoft
              的危险之处在于它能借 Azure 分发；如果拓扑架构成功，结构性力量很强，但该项目仍有科学争议，也还没有被包装成主流硬件产品。Quantinuum 和 IonQ 是 PsiQuantum
              近期最强商业挑战者，因为两家公司已经通过多种渠道销售访问，并且都描述了可信的容错路径，即便其最大路线图主张仍面向未来。战略含义是，PsiQuantum
              不只是在比拼最终机器质量；它还要对抗那些已经在建立客户信任、开发者熟悉度和采购历史的竞争者。
