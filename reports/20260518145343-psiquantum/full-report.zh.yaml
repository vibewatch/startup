      - number: '8.4'
        title: 投资逻辑破裂标准与行动触发器
        blocks:
          - type: paragraph
            body: >-
              估值逻辑会先于技术本身破裂。第一个停损信号是时间表：如果 Brisbane
              明显漂出当前公开目标窗口，丢失的时间不只是推迟上行；它会威胁政府支持获取，让下一轮融资更难定价，并削弱公司相对证据更充分同业的溢价。第二个停损信号是外部验证侵蚀。DARPA 和 AFRL
              是可信度栈的一部分，那里任何实质走弱，都会拿走抵御纯炒作叙事的重要防线。第三个停损信号是财务：在运行中系统或清晰商业合同证明出现之前，如果新一轮低于当前 $7 billion
              标记，就会坐实市场判断：时间线风险此前被低估。这些触发器刻意设得具体，因为这个阶段的公司太容易被叙事包裹，投资者必须预先承诺失败长什么样。
            claimRefs:
              - CV010
