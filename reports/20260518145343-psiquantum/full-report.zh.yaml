      - number: '5.3'
        title: 系统路线图：Brisbane 和 Chicago
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的硬件路线图现在围绕两个具名的实用规模部署展开，不再是抽象的长期研究计划。第一个是 Brisbane，PsiQuantum 与澳大利亚、Queensland 政府宣布 A$940
              million 的一揽子方案，包含股权、拨款和贷款，用于建设公司所称的全球首台实用规模容错量子计算机。公司材料称 Brisbane 站点目标是在 2027
              年底前投运，并明确说这个计划很激进。这个目标应被理解为路线图承诺，而不是已经去风险的交付日期。

              Chicago 是美国的后续部署。Illinois 将 PsiQuantum 指定为 Illinois Quantum and Microelectronics Park（IQMP）的锚定租户，园区位于原
              U.S. Steel South Works 地块；激励方案价值 $200 million，公司承诺最低投资 $1.09 billion。放到产品语境里，Chicago 的意义在于它说明 PsiQuantum
              并不是把 Omega 设计成一次性科学演示机；公司计划把光子封装、低温模块、控制电子和面向客户的应用项目，重复部署到园区级站点。

              路线图成熟度仍然参差。底层光子原语已有同行评审证据；Construct 已面向限量用户上线，并借助 GPU 仿真加速；但还没有公开客户在商业 PsiQuantum 量子系统上跑过工作，Chicago 也没有像
              Brisbane 2027 年底目标那样具体的公开部署里程碑。因此路线图内部顺序是可信的——组件验证、软件联合开发、首个实用规模站点、第二个站点——但系统集成层仍有很大的交付风险。
