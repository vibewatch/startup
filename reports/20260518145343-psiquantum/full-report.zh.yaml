  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 改变判断的证据
    rows:
      - - 架构
        - 光子量子比特、BTO 开关和代工式制造，给出一条看似可行的扩展路径
        - 完整机器尚未公开；可制造性主张仍远领先于已交付系统证据
        - 独立披露集成系统性能和站点安装就绪度里程碑
      - - 资本结构
        - $1B Series E 和公共支持带来少见的现金跑道确定性
        - 公共支持存在政治争议；里程碑若延误，下行会被放大
        - 看清支持提款条件、追回条款和剩余私募融资需求
      - - 政府验证
        - DARPA 和 AFRL 表明，美国国防利益相关方认真看待这条路线
        - 政府项目验证的是技术适配性，不是商业就绪度或单位经济性
        - 政府验证转化为持久合同或商业需求的证据
      - - 商业证明
        - Construct、应用工作和行业合作显示真实世界用例兴趣
        - 没有公开价目表，也没有披露的经常性收入；MOU 不是采购订单
        - 具名付费合同、定价、积压订单和客户使用数据
      - - 相对估值
        - 如果 PsiQuantum 成为首个有主权背书的 FTQC 系统建造者，溢价可以成立
        - Quantinuum 已经有更丰富的商业证明栈，而上市同行显示量子估值标记可能剧烈压缩
        - 需要更清楚说明：除了时间乐观之外，PsiQuantum 为什么应该较上市可比公司享有溢价
    notes: 反向逻辑不是 PsiQuantum 缺少技术野心；问题在于当前价格要求投资者预付那些仍有争议或未披露的里程碑。
