            body: >-
              PsiQuantum
              的财务风险，与其说是今天能否拿到资本，不如说是资本附带的条件和不透明度。独立怀疑性报道指出，公司在建成完整公开量子计算机之前就达到数十亿美元估值；公开文件仍没有披露现金余额、月度烧钱速度、现金跑道或站点级资本开支。外部投资者因此无法判断，当前资本基础对
              Brisbane 和 Chicago 的需求而言是充足、勉强够用，还是仍有缺口。政府共同投资有价值，但不能消除风险；它把更多上行和下行都绑在里程碑交付和公共政策支持的连续性上。

              关键财务传导路径从技术延期开始。如果 Brisbane 滑期，PsiQuantum 损失的不只是时间；它还可能削弱公共支持获取、让下一轮融资定价更难、拖慢 Chicago
              排序，并降低伙伴信心。公开可比公司数据也强化了这一点：即便量子公司已有披露收入，仍在录得大额亏损，所以投资者不应假设商业化开始后行业级烧钱会很快下降。真正的财务问题是，PsiQuantum
              能否在市场再次重估时间线风险之前，打中足够多的技术和项目里程碑。
