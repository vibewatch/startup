  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 营收模式与公开变现状态
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的公开营收图景，与其说已经建立，不如说尚未说明。公司宣布了大额资本流入——$1B Series E 股权融资、澳大利亚 A$940M 共同投资方案、Illinois 补助和税收激励，以及
              $10.8M AFRL 合同——但这些资金大多是融资输入，不是经常性商业需求的证据。唯一明确披露、接近合同式变现的项目，是 AFRL 固定总价合同；它为截至 2027 年 5 月的芯片交付、BTO
              相位调制器和软件支持提供资金。另一路，PsiQuantum 面向企业、政府和研究人员推广 Construct
              这个容错量子算法平台，但访问需要申请表，页面没有公开价格、合同期限或付费用户数。因此，可能的营收模型分三层：第一，政府或国防 R&D 合同，以及可能的补助会计处理；第二，围绕 Construct
              的选择性软件或试点项目；第三，当 Brisbane 和 Chicago 超越原型后，出现站点级算力或服务合同。公开来源支持每一层的存在，但只有 AFRL
              合同披露了与交付物绑定的金额。从承销视角看，关键区分在于资本支持、合同收入和未来算力变现；今天的公开披露融资信息丰富，已实现经常性收入信息稀缺。
