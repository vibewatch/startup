  - id: TV005
    title: 投资逻辑破裂与终止触发器表
    columns:
      - 触发器
      - 阈值事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Brisbane 进度破裂
        - 相对当前路径，公开或经投资者验证的延误超过 18 个月
        - 时间溢价坍塌，并压迫补贴兑现和下一轮定价
        - 立即转向悲观情景承保；没有完整重设基准前，不追加资本
      - - 验证削弱
        - DARPA/AFRL 状态显著走弱，或关键政府支持条款被负面重谈
        - 故事失去一个重要的非市场可信度支柱
        - 除非由同等客户证明替代，否则视为投资逻辑破裂
      - - 降价轮融资
        - 首个系统运行前，新资本以低于当前 $7B 标记募集
        - 显示市场重新定价执行风险的速度快于管理层化解风险的速度
        - 暂停投资，按困境或重置结果重新承保
      - - 领导层不稳定
        - 站点执行期间临时架构持续，且没有可信的长期运营领导
        - 提高系统交付落后于架构野心的风险
        - 继续推进前，要求治理计划和运营责任人
      - - 商业证明失败
        - 即便达成技术里程碑，仍没有有意义的付费合同或清晰定价
        - 估值只能依赖科学故事
        - 对主流投资者下调至回避
    notes: 触发器必须可监控、能直接触发组合动作，而不是抽象风险。每个触发器都会直接影响在收入可见前支付溢价的理由。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 现金与烧钱速度
        - 当前现金余额、月度烧钱速度和站点级资本开支排期
        - 没有这些，就无法用 Brisbane 和 Chicago 支出去压测现金跑道是否足够
        - 在 NDA 下索取董事会材料或 CFO 现金桥
      - - 股权结构表与优先权
        - 完整股权结构表、清算优先权、反稀释条款和优先级
        - $7B 入场估值下的下行回收测算，取决于优先权包袱
        - 索取投资人版股权结构表和附函摘要
      - - 商业管线
        - 已具名付费试点、合同金额、定价条款和 backlog 转化时间
        - 区分真实需求和无约束力的合作信号
        - 审阅客户合同、预订协议和定价模型
      - - Brisbane 关键路径
        - 覆盖代工厂、BTO、机柜、低温系统和场地交付的一体化里程碑图
        - 整个估值都压在时间纪律上
        - 索取项目管理仪表盘和关键路径负责人图
      - - 公共支持追索
        - 澳大利亚和伊利诺伊州支持的具体提款条件、追回条款和违约机制
        - 政府支持是下行保护的核心部分
        - 审阅已签署协议及所有合规通知
      - - 政府验证的经济性
        - DARPA/AFRL 里程碑如何对应收入、成本回收或未来采购
        - 技术验证只有转成持久经济杠杆才有价值
        - 向联邦利益相关方索取合同里程碑排期和管线
    notes: 这些尽调请求按对下行承销影响的直接程度排序。第 1–3 项会卡住当前估值下任何有确信度的投资。
    claimRefs:
      - CV027
      - CV028
      - CV039
      - CV040
      - CV045
