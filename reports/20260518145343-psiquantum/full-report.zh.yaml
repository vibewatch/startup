      - number: '5.4'
        title: 关键依赖与供应链
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的技术栈没有品牌叙事初看起来那么垂直整合。公司掌握光子架构、软件环境和集成策略，但关键执行依赖外部制造和基础设施伙伴。最重要的依赖是硅光子代工层。PsiQuantum
              自身材料强调商业代工制造，GlobalFoundries 的硅光子平台宣传的能力正好对应 PsiQuantum 需要的东西：单片光子与 CMOS 集成、先进封装、灵活光纤连接、光子 PDK，以及高产量 300
              mm 生产。这套制造生态是重大战略优势，但也是集中度风险，因为公开信息没有披露同等规模的替代供应商。

              栈的其余部分也有类似卡点。Nature 和公司发布材料显示，探测器性能、光开关和低温封装不是可有可无的外设，而是核心产品模块。Reuters 还把公司与 美国能源部 / SLAC
              支持的低温量子模块开发联系起来，进一步说明即便是光子机器，也要靠制冷、电子集成和模块级可靠性决定成败。封装和网络同样关键，因为实用规模光子系统需要许多封装通过光纤和控制信号联网，而不只是更好的芯片。

              客户价值交付也依赖非芯片环节。Brisbane 和 Chicago 需要站点建设、电力、低温设施安装、控制系统集成和客户项目管理。Construct
              通过建立硬件上线前的客户工作流，缓解了一部分时间压力，但它不能消除最终硬件和设施栈的依赖。实践中，代工厂访问、开关成熟度、探测器良率、低温机柜就绪度或园区建设，任何一项延迟都会推迟产品的商业兑现。
