      - number: '5.2'
        title: 当前产品：Omega 芯片与 Construct 平台
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 当前的商业产品叙事有两层：Omega 是核心硬件平台；Construct 是实用规模硬件上线前，合作伙伴可以先用的软件环境。PsiQuantum 把 Omega
              描述为可制造的光子量子计算芯片组，Nature 论文和发布材料用量化结果支撑了这个定位。该系统在路径编码量子比特上跑出 99.98% +/- 0.01% 的 SPAM 保真度，报告了 99.72% +/-
              0.04% 的芯片间量子比特互连保真度，并在双轨量子比特上达到 99.22% +/- 0.12% 的 Bell 融合保真度。这些还不是完整系统的容错结果，但足以说明 FBQC
              需要的组件链条已经集成到一个可制造平台上，并完成了基准测试。

              Construct 是客户近期真正能接触的产品。平台把 Workbench、Qubricks、Circuit Designer 和 Resource Analyzer
              打包进托管环境，用于容错算法开发。软件支持基于 Python 的工作流设计、模块化算法构件，以及针对硬件约束的资源估算分析。2026 年 3 月，PsiQuantum 加入 NVIDIA CUDA-Q
              集成，并称大型算法的 GPU 加速状态向量仿真可提速 8x 到 450x。重要性在于，PsiQuantum 当前的商业切口不是远程访问商业量子计算机，而是硬件上线前的算法设计、验证和资源规划。

              已公开的合作支持这一判断。Airbus 正用 PsiQuantum 做航空航天 FTQC 工作，包括面向 CFD 的算法；Lockheed Martin 聚焦航空航天与防务用例；National Cancer
              Center Japan 瞄准肿瘤学和药物发现应用；University of Tokyo 与 Mitsubishi Chemical 的合作则把 Construct
              延伸到人才培养。这些都是可信信号，说明软件层已进入真实领域工作流；但 Construct 仍是限量访问、专家专用，因此这个产品更像早期企业联合开发平台，而不是广泛自助的软件业务。
