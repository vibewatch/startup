      - number: '1.5'
        title: 关键里程碑、领导层变化与批判视角
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 的发展轨迹由一系列标志性融资、产品发布和战略合作串起。公司于 2025 年 2 月在 Nature 发表 Omega 硅光子芯片组，展示了超越当时先进水平的光子组件性能，包括 99.98%
              双轨量子比特状态制备与测量保真度；该论文数月内即成为该领域被引用最多的论文之一。2025 年 9 月，PsiQuantum 的容错算法开发软件套件 Construct 正式发布。2026 年 4 月，Intel
              CEO Lip-Bu Tan 加入 PsiQuantum 董事会，进一步强化公司的半导体制造关系。2026 年初，Victor Peng 接替 Jeremy O'Brien 出任 CEO，O'Brien
              转任执行董事长并负责长期战略；这次交接显示公司进入大规模部署和运营阶段，需要工业化执行经验。批评者和独立分析师认为，2027 年 Brisbane 运行目标极其激进：从原型级测试系统起步，到 2027
              年底建成百万量子比特容错量子计算机，意味着跨越多个数量级的扩展挑战；任何量子硬件公司、任何路线都还远未接近这一尺度。Australian Financial Review 将 A$940M
              政府共同投资称为一场“大胆押注”，凸显时间表的投机性。公司仍无营收，也没有可用的商业硬件产品，续航完全取决于政府和私人投资者继续出资。
