      - number: '3.3'
        title: 相邻与替代方案
        blocks:
          - type: paragraph
            body: >-
              PsiQuantum 还面临来自相邻架构和替代方案的严肃压力；这些方案可能在通用 FTQC 出现前就满足买方需求。D-Wave
              不在同一个算法终点竞争，但对优化密集型买方而言，它竞争的是眼下真正重要的东西：uptime、生产级工作流和已签系统合同。QuEra 的中性原子路线更直接，因为它把室温原子阵列与 Braket 访问、本地 HPC
              集成，以及已经讨论逻辑量子比特的路线图结合起来。Xanadu 是最接近 PsiQuantum 的光子类比对象，因为它同样讲光纤联网光子路线，并公开主张模块化可以扩展到数百万量子比特。但 Xanadu
              仍在处理光损耗约束，目前 Aurora 机器规模也远小于 PsiQuantum 的实用规模雄心。Rigetti 作为超导全栈玩家仍有相关性，既有云端历史，也有可销售的本地 QPU。最后，AWS Braket 和
              NVIDIA 代表替代层，而非直接硬件对手：Braket 把多种路线聚合到一个云工作流中，降低供应商锁定；NVIDIA 则把有用量子计算框定为一个混合 AI/HPC
              问题。合在一起，它们降低了买方早早押注单一供应商的紧迫性。
