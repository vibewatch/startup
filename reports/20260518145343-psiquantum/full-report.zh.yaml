      - number: '2.5'
        title: 规模测算矛盾、反向视角与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              量子计算的市场规模测算，是科技行业中分析师分歧最大的领域之一。2025 年市场被估为 $1.44B（Precedence）、$3.52B（M&M）或 $1.42B（Grand View），范围和方法都没有共识。到
              2030 年，估算从 $4.24B（Grand View，20.5% CAGR）到 $20.20B（M&M，41.8% CAGR）不等，跨度达 5 倍。BCG 的 $1–2B
              近期供应商市场最保守。这些矛盾来自：（a）纳入范围不同（有些包括量子密码和传感，另一些只包括硬件和软件）；（b）量子优势出现时间假设不同；（c）厂商委托报告带有乐观假设。对 PsiQuantum
              市场定位最重要的反向视角，是 BCG 明确表示完整规模容错会在“2040 年之后”到来——比公司 2027 年目标晚 13 年——并指出 NISQ 局限已让此前市场预测显著落空。多位 BCG 作者指出，AI
              在过去被留给量子优势的领域（分子模拟、优化）表现超预期，进一步抬高量子优势门槛。The New Yorker
              的文章虽不是直接财务分析，却捕捉了更广泛的科学界怀疑：“今天的量子计算机是‘有噪声的’，意思是它们几乎什么尝试都会失败。” 对 PsiQuantum 具体主张——规模化光子 FTQC 可在 2027
              年底前实现——公开分析师文献中没有独立评估；最接近的代理，是 DARPA US2QC 项目正在进行但未披露的评估。
