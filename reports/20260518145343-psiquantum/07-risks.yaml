callouts:
  - calloutType: risk
    title: "Brisbane 2027 is the master risk"
    body: >-
      If Brisbane slips materially, the damage is not limited to timeline optics; it flows through
      public-support capture, next-round financing, Chicago sequencing, and customer confidence.
    claimRefs: [CR001, CR002, CR028, CR029, CR038]

  - calloutType: risk
    title: "Government money lowers immediate financing pressure but raises milestone discipline risk"
    body: >-
      Australia and Illinois materially de-risk capital needs in the near term, but they also make the
      investment case more sensitive to public milestone compliance and to the visibility of execution.
    claimRefs: [CR011, CR012, CR022, CR028]

  - calloutType: risk
    title: "GlobalFoundries is both the strongest scale advantage and the clearest single point of failure"
    body: >-
      PsiQuantum's manufacturability narrative is hard to separate from the GlobalFoundries ecosystem,
      which means supplier concentration remains one of the few risks that can break both schedule and
      credibility at once.
    claimRefs: [CR007, CR008, CR037, CR039]

