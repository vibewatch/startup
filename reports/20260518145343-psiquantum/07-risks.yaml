artifact: risks
slug: psiquantum
runDate: "2026-05-18"
company:
  name: PsiQuantum
chapter:
  number: 7
  title: Risks
  summary: >-
    PsiQuantum's risk profile is dominated by one coupled loop: a very aggressive end-2027 Brisbane
    delivery target must survive photonic-loss and integration physics, single-source foundry and
    site-build dependencies, leadership transition, export-control scrutiny, and capital opacity.
    The company has unusually strong external support — government co-investment, foundry access,
    DARPA/AFRL engagement, and peer-reviewed component evidence — but those same supports make the
    downside transmission path sharper if milestones slip. The material underwriting question is not
    whether PsiQuantum has technical promise; it is whether the company can convert manufacturable
    photonic building blocks into a utility-scale, policy-compliant, financeable system before IBM,
    Google, and other substitutes reset customer expectations.

sections:
  - id: technical-and-engineering-risks
    title: Technical and Engineering Risks
    body: >-
      PsiQuantum's core technical risk is schedule compression. Public sources confirm that Brisbane
      is targeted for operation by the end of 2027 and that the company itself calls the plan
      aggressive, yet the strongest independent technical evidence in public is still component and
      sub-system validation rather than an operating logical machine. Nature's Omega paper is an
      important de-risking event because it shows manufacturable photonic sources, detectors,
      interconnects, and fusion operations on a 300 mm platform, but it does not demonstrate a
      continuously operating fault-tolerant computer. That leaves a large gap between proving the
      building blocks and proving that millions of physical photonic qubits can be networked with
      acceptable loss, yield, switching, cryogenic reliability, and decoding overhead on a utility-
      scale system.

      The technical choke points are also tightly coupled. FBQC is explicitly designed for modular
      photonic systems, but its practicality still depends on stringent loss and error budgets,
      high-quality single-photon generation, low-loss switching, and high-efficiency SNSPD-based
      detection. Public technical literature continues to treat source indistinguishability and loss
      control as first-order constraints, while PsiQuantum's own materials show that the system still
      depends on cryogenic modules, fiber attach, packaging, and foundry-compatible integration.
      Because GlobalFoundries is the only publicly named foundry ecosystem at equivalent scale,
      technical risk is not isolated to physics; it is embedded in manufacturability and supplier
      concentration.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR037]
    tableRefs: [TR002]
    figureRefs: [FR001]

  - id: execution-and-operational-risks
    title: Execution and Operational Risks
    body: >-
      Execution risk rose materially when PsiQuantum shifted from a founder-led research narrative to
      a two-campus deployment narrative. Victor Peng's appointment as Interim CEO in February 2026
      adds proven semiconductor operating experience, but it also highlights that the company is in a
      leadership transition while trying to deliver Brisbane and then Chicago. Public incentive and
      progress documents show that site execution is not abstract: job creation, investment pacing,
      and buildout milestones matter to incentive capture and to the credibility of the scale story.
      The hardest operational question is whether PsiQuantum can turn a photonics R&D organization
      into a disciplined systems-delivery organization without publicly disclosing the internal KPI
      stack, alternate-foundry readiness, or full program-management structure.

      Site and partner execution add more risk than the photonic brand suggests. Brisbane and IQMP
      both require cryogenic plant installation, utilities, facilities integration, vendor
      coordination, and secure program management on top of chip performance. DARPA and AFRL support
      are confidence signals, but they also confirm that PsiQuantum remains in a government
      validation-and-deliverables environment rather than in routine commercial operations. The
      dependency map is therefore broader than foundry access alone: leadership stability, public
      co-investment capture, cryogenic/site execution, and partner compliance all sit on the same
      critical path.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR014, CR015, CR016, CR039]
    tableRefs: [TR003, TR004]
    figureRefs: [FR003]

  - id: regulatory-legal-and-geopolitical-risks
    title: Regulatory, Legal, and Geopolitical Risks
    body: >-
      Quantum computing is increasingly treated as a national-security-sensitive technology area, and
      that changes PsiQuantum's risk posture. BIS's 2024 interim final rule explicitly added controls
      on quantum computing and other advanced technologies, while NSM-10 frames quantum leadership and
      migration away from vulnerable cryptography as cyber, economic, and national-security policy.
      CISA urges critical-infrastructure operators to prepare for post-quantum migration, and NSA goes
      further by warning that it does not recommend QKD/QC for National Security Systems unless known
      limitations are overcome. For PsiQuantum, this means cross-border collaboration between the U.S.
      and Australia sits inside a tightening environment for export controls, security governance,
      government-customer diligence, and technology-transfer review.

      Legal/IP risk is also meaningful rather than existentially clear-cut. Public patent records show
      PsiQuantum has real granted photonic quantum IP, but they also show a broader field of photonic
      quantum patents from other institutions, which argues for a crowded and evolving freedom-to-
      operate landscape rather than for a totally unchallenged moat. Government-support disclosures are
      clearer on amounts, jobs, and public rationale than on the exact recourse mechanics if Brisbane
      misses major milestones, so the public record still leaves unresolved questions on export
      classification, Australia-specific default terms, and the practical constraints on moving people,
      designs, and know-how across jurisdictions.
    claimRefs: [CR017, CR018, CR019, CR020, CR021, CR022, CR023]
    tableRefs: [TR001]
    figureRefs: []

  - id: financial-and-capital-risks
    title: Financial and Capital Risks
    body: >-
      PsiQuantum's financial risk is less about access to capital today than about the conditionality
      and opacity attached to that capital. Independent skeptical coverage notes that the company
      reached a multi-billion-dollar valuation before building a complete public quantum computer, and
      public documents still do not disclose cash on hand, monthly burn, runway, or site-level capex.
      That makes it impossible for outside investors to know whether the current capital base is ample,
      merely adequate, or still short of what Brisbane and Chicago require. Government co-investment is
      valuable, but it does not eliminate risk; it ties more of the upside and downside to milestone
      delivery and to the continuity of public-policy support.

      The key financial transmission path starts with technical delay. If Brisbane slips, PsiQuantum
      does not just lose time; it risks weaker public-support capture, harder next-round pricing,
      slower Chicago sequencing, and reduced partner confidence. Public peer data reinforces the point:
      even quantum companies with disclosed revenue still post large losses, so investors should not
      assume sector-scale burn falls quickly once commercialization begins. The real financial question
      is therefore whether PsiQuantum can hit enough technical and program milestones before the market
      reprices timeline risk again.
    claimRefs: [CR024, CR025, CR026, CR027, CR028, CR029, CR038]
    tableRefs: [TR005]
    figureRefs: [FR002]

  - id: competitive-and-market-risks
    title: Competitive and Market Risks
    body: >-
      PsiQuantum is exposed to two competitive clocks. The first is technical: Google and IBM continue
      to publish named roadmaps, spec sheets, and access models that give customers tangible
      alternatives while PsiQuantum remains pre-hardware for external users. The second is economic:
      AI, HPC, and cloud-aggregated quantum access continue improving the substitute set for buyers who
      want learning, experimentation, or near-term workflow value before utility-scale FTQC arrives.
      That does not prove PsiQuantum's photonic thesis is wrong, but it does mean timing itself is a
      competitive variable. A company that arrives later than promised can lose mindshare, partner
      momentum, and pricing power even if its eventual architecture is better.

      The market implication is that PsiQuantum's risk profile should be read as an integrated system,
      not a checklist. Competitive pressure, milestone discipline, export-control clarity, leadership
      stability, and financing transparency all interact. The thesis can survive manageable delays and
      ordinary policy friction, but it becomes fragile if the company enters 2027 without clearer
      system benchmarks, clearer compliance mappings, or clearer capital disclosure. Those are the
      monitorable pre-commitment signals that distinguish a hard but still fundable execution problem
      from a thesis-break.
    claimRefs: [CR030, CR031, CR032, CR033, CR034, CR035, CR036, CR040]
    tableRefs: []
    figureRefs: []

