companyProfile:
  summary: >-
    PsiQuantum is a silicon photonics company building utility-scale fault-tolerant quantum computers (FTQC) 
    using a foundry-based manufacturing approach on GlobalFoundries' 300mm CMOS photonics process. Founded 
    in 2016 in Palo Alto, the company has secured $1B+ in private capital and $820M+ in government co-investment 
    from Australia, Illinois, and US federal agencies. Its core thesis is that only FTQC at scale — not NISQ-era 
    devices — will deliver quantum advantage, and that silicon photonics uniquely enables the qubit density and 
    interconnect needed to achieve it. The company targets first utility-scale system operation in Brisbane, 
    Australia by end of 2027. It is pre-revenue with zero commercial customers as of May 2026.
  foundedDate: '2016-01-01'
  founders:
    - name: Jeremy O'Brien
      role: Co-Founder and Executive Chairman
      background: >-
        Professor of quantum physics at Imperial College London and University of Bristol; pioneered 
        experimental photonic quantum computing; transitioned from CEO to Executive Chairman in early 2026.
      claimRefs: [CO001, CO002]
    - name: Terry Rudolph
      role: Co-Founder and Chief Architect
      background: >-
        Professor of quantum physics; architect of fusion-based quantum computing (FBQC) framework that 
        underpins PsiQuantum's architectural approach; son of physicist Anton Zeilinger.
      claimRefs: [CO001, CO004]
    - name: Pete Shadbolt
      role: Co-Founder and Chief Scientific Officer
      background: >-
        Completed PhD in experimental photonic quantum computing at University of Bristol; 
        leads quantum science strategy and algorithm development at PsiQuantum.
      claimRefs: [CO001, CO005]
    - name: Mark Thompson
      role: Co-Founder and Chief Technology Officer
      background: >-
        Background in photonics manufacturing processes; oversees technology and manufacturing 
        partnerships including GlobalFoundries collaboration.
      claimRefs: [CO001, CO006]
  foundingLocation: Palo Alto, California, USA
  headquarters: Palo Alto, California (700 Hansen Way)
  productSummary: >-
    PsiQuantum offers the Construct software platform for fault-tolerant quantum algorithm development 
    (pre-hardware access layer) and is developing the Omega silicon photonics chipset demonstrated in 
    Nature (Feb 2025) as the hardware foundation for utility-scale systems. The Brisbane (Australia) and 
    Chicago (Illinois) systems are the first planned FTQC deployments, targeting end-2027 operation.
  customerFocus: >-
    Government defense and intelligence agencies (DARPA, AFRL, US2QC program); sovereign co-investors 
    (Australian and Illinois governments); defense primes (Lockheed Martin); aerospace (Airbus); 
    pharmaceutical (National Cancer Center Japan); materials (Mitsubishi Chemical).
  businessModel: >-
    Pre-commercial. Anticipated revenue model: quantum access as a service (ISP-model), government 
    contracts (DARPA/AFRL), algorithm licensing, and enterprise access subscriptions. No revenue as of May 2026.
  stage: late-stage private
  fundingStatus: >-
