    led by BlackRock affiliates and joined by Temasek, Baillie Gifford, NVentures (NVIDIA), Qatar Investment 
    Authority, Macquarie Capital, and Ribbit Capital. Total disclosed capital raised exceeds $1.7 billion.
  claimRefs: [CO001, CO003, CO011, CO014, CO016, CO017, CO022, CO031]
summary:
  headline: >-
    PsiQuantum has the most credible photonic FTQC thesis and strongest government backing in the sector, 
    but the $7B entry price is wholly speculative on a 2027 milestone that has no independent validation 
    and carries critical timeline and execution risk.
