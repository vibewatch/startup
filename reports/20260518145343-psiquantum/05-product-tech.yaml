callouts:
  - calloutType: strength
    title: "Omega has crossed from lab physics into manufacturable system engineering"
    body: >-
      PsiQuantum's strongest product signal is not a qubit-count claim; it is that the Nature paper
      and launch materials show sources, detectors, switching, SPAM, fusion, and chip-to-chip
      interconnect on a single manufacturable photonic stack.
    claimRefs: [CE006, CE007, CE008, CE009]

  - calloutType: strength
    title: "Construct gives PsiQuantum a pre-hardware commercial wedge"
    body: >-
      Airbus, Lockheed Martin, National Cancer Center Japan, and Japanese workforce-development
      partners are all engaging PsiQuantum through algorithm and workflow development before a public
      commercial quantum computer exists.
    claimRefs: [CE013, CE015, CE018, CE019, CE020, CE021, CE048]

  - calloutType: strength
    title: "Photonic cryogenic cabinets could scale more like datacenter infrastructure"
    body: >-
      PsiQuantum argues that operating at 2-4 K with cryogenic cabinets rather than millikelvin
      dilution-fridge stacks gives it a more manufacturable systems path if chip and package yields
      hold up.
    claimRefs: [CE025, CE026]

  - calloutType: risk
    title: "GlobalFoundries and packaging remain concentrated dependencies"
    body: >-
      PsiQuantum's foundry-centric strategy is a source of scale advantage, but the absence of a
      publicly disclosed equivalent alternate source means any process, allocation, or packaging
      disruption directly hits the product roadmap.
    claimRefs: [CE027, CE041, CE047]

  - calloutType: risk
    title: "Public evidence still stops short of a utility-scale operating machine"
    body: >-
      Building-block validation is real, but public evidence still centers on component metrics,
      limited-access software, and roadmap sites rather than an operating fault-tolerant computer.
    claimRefs: [CE031, CE032, CE033, CE043]

