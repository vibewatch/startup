company:
  name: PsiQuantum
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    PsiQuantum's product stack combines a silicon-photonic hardware architecture, the Omega
    manufacturable chipset, and the Construct pre-hardware software environment for developing
    fault-tolerant quantum applications ahead of system deployment. The core architecture uses
    telecom-band single photons, fusion-based quantum computing (FBQC), integrated sources,
    detectors, and switching on a 300 mm foundry process, with cryogenic cabinets rather than
    millikelvin dilution-refrigerator-heavy architectures. Product maturity is uneven: Omega's
    building blocks are peer-reviewed and Construct is in limited-access use with aerospace,
    healthcare, and workforce-development partners, while Brisbane and Chicago remain roadmap-stage
    utility-scale deployments. Key dependencies are GlobalFoundries silicon photonics, advanced
    optical switching, high-efficiency detectors, cryogenic packaging, and site build-out.

sections:
  - id: silicon-photonic-architecture
    title: Silicon Photonic Architecture and FBQC Approach
    body: >-
      PsiQuantum's technical thesis is that useful fault-tolerant quantum computing should be built
      with telecom-band single photons on high-volume semiconductor infrastructure rather than with
      bespoke low-yield qubit fabrication. On the company's account and in its 2025 Nature paper,
      the photonic stack already integrates the minimum building blocks needed for a fusion-based
      quantum computer: on-chip photon generation, path-encoded qubit preparation and measurement,
      chip-to-chip optical interconnects, two-photon interference, and Bell-fusion entangling
      measurements. The underlying computational model is fusion-based quantum computing (FBQC), a
      measurement-first architecture in which entangling measurements on small resource states do
      the logical work that unitary gate sequences do in more conventional circuit formulations.

      The hardware implementation is unusually manufacturing-centric. PsiQuantum's technology page,
      Omega launch materials, and third-party optical trade coverage all emphasize that the company
      has introduced low-loss silicon nitride waveguides, superconducting nanowire single-photon
      detectors (SNSPDs), and barium titanate electro-optic switching into a commercial foundry
      process. Nature reports a fully integrated 300 mm process and a cryogenic assembly containing
      a photonic die, electronic PCB, and 100-channel telecommunications fiber attach unit. That is
      materially different from a lab-only photonics stack: the product concept already assumes
      packaging, fiber connectivity, and manufacturable cryogenic infrastructure as part of the
      system boundary.

      The architectural upside is clear. Photons are naturally compatible with fiber interconnects,
      low-noise propagation, and wafer-scale photonic integration; FBQC is explicitly designed to
      exploit probabilistic photonic processes through heralding and fusion. But the same sources
      also define the hard engineering budgets: scalable photonic computing still requires extremely
      high source purity, near-unit detection efficiency, low accumulated optical loss, and very
      fast, low-loss switching. Nature states that FBQC can tolerate on the order of 10% total loss
      between emission and detection and roughly 1% per-qubit fusion-network errors, which means
      PsiQuantum's manufacturable stack is credible only insofar as it keeps those budgets under
      control at system scale.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE009, CE010, CE011, CE027, CE028, CE029, CE030, CE031, CE034, CE035, CE036, CE041, CE044, CE046, CE047]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: omega-and-construct
    title: "Current Products: Omega Chip and Construct Platform"
    body: >-
      PsiQuantum's current commercial product story has two layers: Omega as the core hardware
      platform and Construct as the software environment that partners can use before utility-scale
      hardware is live. Omega is described by PsiQuantum as a manufacturable chipset for photonic
      quantum computing, and the Nature paper plus launch materials support that framing with
      quantitative results. The system benchmarked path-encoded qubits at 99.98% +/- 0.01% SPAM
      fidelity, reported 99.72% +/- 0.04% chip-to-chip qubit interconnect fidelity, and achieved
      99.22% +/- 0.12% Bell-fusion fidelity on dual-rail qubits. These are not full-system fault-
      tolerant results, but they are meaningful demonstrations that the component chain needed for
      FBQC has been integrated and benchmarked on one manufacturable platform.

      Construct is the nearer-term product customers can actually engage with. The platform bundles
      Workbench, Qubricks, Circuit Designer, and Resource Analyzer into a managed environment for
      fault-tolerant algorithm development. The software supports Python-based workflow design,
      modular algorithmic building blocks, and resource-estimation analysis against hardware
      constraints. In March 2026 PsiQuantum added NVIDIA CUDA-Q integration, claiming 8x to 450x
      speedups for GPU-accelerated state-vector simulation of large-scale algorithms. That matters
      because PsiQuantum's current go-to-market wedge is not remote access to a commercial quantum
      computer; it is pre-hardware algorithm design, validation, and resource planning.

      Publicly disclosed partnerships support that interpretation. Airbus is using PsiQuantum for
      aerospace FTQC work including CFD-oriented algorithms; Lockheed Martin is focused on aerospace
      and defense use cases; National Cancer Center Japan is targeting oncology and drug-discovery
      applications; and the University of Tokyo plus Mitsubishi Chemical partnership extends
      Construct into workforce development. These are credible indicators that the software layer is
      being used in real domain workflows, but Construct remains limited-access and expert-only, so
      the product is still better described as an early enterprise co-development platform than as a
      broad self-serve software business.
    claimRefs: [CE006, CE007, CE008, CE009, CE013, CE014, CE015, CE016, CE017, CE018, CE019, CE020, CE021, CE032, CE043, CE045, CE048]
    tableRefs: [TE001, TE002]
    figureRefs: [FE002]

  - id: system-roadmap
    title: "System Roadmap: Brisbane and Chicago"
    body: >-
      PsiQuantum's hardware roadmap is now framed around two named utility-scale deployments rather
      than an abstract long-range research program. The first is Brisbane, where PsiQuantum and the
      Australian and Queensland governments announced a A$940 million package of equity, grants, and
      loans tied to building what the company calls the world's first utility-scale, fault-tolerant
      quantum computer. Company materials describe the Brisbane site as targeted for operation by
      the end of 2027 and explicitly characterize the plan as aggressive. That target should be read
      as a roadmap commitment rather than as a de-risked delivery date.

      Chicago is the U.S. follow-on deployment. Illinois named PsiQuantum the anchor tenant at the
      Illinois Quantum and Microelectronics Park (IQMP) on the former U.S. Steel South Works site,
      with an incentive package valued at $200 million and a minimum company investment commitment of
      $1.09 billion. In product terms, the Chicago site matters because it shows PsiQuantum is not
      designing Omega as a one-off scientific demonstrator; the company is planning repeatable,
      campus-scale deployment of photonic packages, cryogenic modules, control electronics, and
      customer-facing application programs.

      Roadmap maturity remains mixed. The underlying photonic primitives now have peer-reviewed
      evidence; Construct is live with limited-access users and accelerating with GPU-based
      simulation; but no public customer has yet run work on a commercial PsiQuantum quantum system,
      and no public deployment milestone for Chicago is as concrete as Brisbane's end-2027 target.
      The roadmap therefore has a plausible internal sequence—component validation, software
      co-development, first utility-scale site, second site—but still contains substantial delivery
      risk at the system-integration layer.
    claimRefs: [CE015, CE018, CE019, CE020, CE021, CE022, CE023, CE024, CE032, CE033, CE042, CE043, CE048]
    tableRefs: [TE005]
    figureRefs: []

  - id: dependencies-and-supply-chain
    title: Critical Dependencies and Supply Chain
    body: >-
      PsiQuantum's technology stack is less vertically integrated than its branding may initially
      suggest. The company owns the photonic architecture, software environment, and integration
      strategy, but critical execution depends on outside manufacturing and infrastructure partners.
      The most important dependency is the silicon-photonics foundry layer. PsiQuantum's own
      materials emphasize commercial foundry manufacturing, and GlobalFoundries' silicon photonics
      platform advertises exactly the capabilities PsiQuantum needs: monolithic photonic and CMOS
      integration, advanced packaging, flexible fiber attach, photonics PDKs, and high-volume 300 mm
      production. That manufacturing ecosystem is a major strategic advantage, but it is also a
      concentration risk because no alternative supplier is publicly disclosed at equivalent scale.

      The rest of the stack has similar choke points. Nature and company launch materials show that
      detector performance, optical switching, and cryogenic packaging are not optional peripherals;
      they are core product modules. Reuters further ties the company to cryogenic quantum-module
      development with U.S. Department of Energy/SLAC support, reinforcing that even a photonic
      machine still lives or dies on refrigeration, electronics integration, and module-level
      reliability. Packaging and networking matter because utility-scale photonic systems require
      many packages networked by fiber and control signals, not just better chips.

      Customer value delivery also depends on non-chip dependencies. Brisbane and Chicago require
      site construction, power, cryogenic plant installation, control-system integration, and
      customer program management. Construct reduces some timing pressure by creating a pre-hardware
      customer workflow, but it does not eliminate dependency on the eventual hardware and facilities
      stack. In practice, any delay in foundry access, switching maturity, detector yield, cryogenic
      cabinet readiness, or campus build-out pushes out the commercial realization of the product.
    claimRefs: [CE011, CE012, CE025, CE026, CE027, CE030, CE041, CE042, CE046, CE047]
    tableRefs: [TE004]
    figureRefs: [FE003]

  - id: technical-risks-limitations
    title: Technical Risks and Limitations
    body: >-
      The most important limitation is that PsiQuantum has demonstrated building blocks, not yet a
      public fault-tolerant computer. Omega is impressive because it closes the loop across sources,
      detectors, switching, interference, fusion, and networking, but the published metrics are
      benchmark results on component and sub-system operations rather than an end-to-end logical
      machine. The gap from feature-complete components to a utility-scale, continuously operating
      computer still includes manufacturing yield, packaging density, cryogenic reliability, error-
      correction overhead, and full system software orchestration.

      Photonic quantum computing also preserves some difficult physics even as it avoids others.
      Photons are attractive because of low noise and fiber compatibility, but scalable operation
      still depends on indistinguishable single photons, low-loss routing, and near-unit-efficiency
      detection. Nature explicitly frames fast, low-loss switching as essential for large optical
      networks, while MIT and Science sources show how demanding the source-indistinguishability and
      efficiency requirements are in photonic systems generally. PsiQuantum's architecture tolerates
      materially higher operating temperatures than superconducting qubits, but it does not become a
      room-temperature datacenter appliance; its detectors and integrated modules still require
      2-4 K cryogenic infrastructure.

      Commercial maturity is similarly constrained. Construct is available only to a limited set of
      expert users, no public self-serve hardware access or uptime/SLA metrics are disclosed, and
      public partner evidence is still co-development oriented. Taken together, the product should be
      viewed as technically differentiated and meaningfully de-risked at the component level, but not
      yet operationally de-risked at utility scale.
    claimRefs: [CE016, CE028, CE029, CE030, CE031, CE032, CE033, CE036, CE043, CE047, CE048]
    tableRefs: []
    figureRefs: [FE004]


