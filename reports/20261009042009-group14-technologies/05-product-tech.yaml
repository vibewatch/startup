callouts:
  - calloutType: "strength"
    title: "Drop-in Compatibility Eliminates Gigafactory Retooling Barriers"
    body: "The core commercial strength of SCC55 is its drop-in compatibility with legacy lithium-ion battery manufacturing equipment. Cell makers can substitute SCC55 into standard slurry and slot-die coating processes, achieving up to 50 percent capacity improvements without multi-billion-dollar factory overhauls."
    claimRefs:
      - "CE001"
      - "CE004"
  - calloutType: "risk"
    title: "Upstream Silane Precursor Dependency Poses Bottleneck Risk"
    body: "Producing thousands of tons of silicon-carbon composite requires commensurate quantities of hazardous silane gas. Until Group14 commissions its domestic Moses Lake silane factory and restarts Schmid Silicon in Germany, commercial scaling remains dependent on merchant silane supply chains historically dominated by Chinese producers."
    claimRefs:
      - "CE003"
      - "CE008"
      - "CE011"
