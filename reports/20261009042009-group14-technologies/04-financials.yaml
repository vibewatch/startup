chapter:
  number: 4
  title: "Financials"
  summary: >-
    Public evidence supports an SCC55 material-sales model, meaningful customer adoption, and
    substantial access to equity capital, but it does not disclose realized pricing, audited
    revenue, gross margin, cash, burn, or runway. A reported BAM-2 delay and workforce reduction
    make factory-ramp execution and forward capital adequacy the central underwriting questions.
sections:
  - id: "revenue-model-and-traction"
    title: "Revenue Model and Commercial Traction"
    body: >-
      The evidenced revenue mechanism is the sale and delivery of SCC55 battery material to cell
      manufacturers. Group14 announced commercial deliveries from BAM-1 to ATL in 2023, while later
      disclosures describe more than 150 customers and shipments from BAM-3. Those signals establish
      customer engagement and physical product movement, but they do not establish recognized
      revenue: GeekWire described BAM-3 material as shipping for customer testing, and none of the
      eight assigned sources discloses contract units, realized price, or a separate licensing or
      services stream. The company's claim that SCC55 has enabled more than 25 million devices is a
      useful downstream adoption indicator, not a revenue measure. Underwriting should therefore
      model one verified stream—SCC55 material sales—while requiring a customer-by-customer bridge
      from qualification shipments to contracted volume, invoicing, and recognized revenue.
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI012"
      - "CI014"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-unit-economics"
    title: "Pricing and Unit-Economics Disclosure"
    body: >-
      Public financial disclosure is too thin to calculate unit economics. LeadIQ estimates annual
      revenue at $100 million to $250 million as of August 2026, but the methodology is not provided
      and the range is neither audited revenue nor company guidance. No assigned source states
      SCC55 list pricing, realized price per mass unit, minimum purchase commitments, discounts, or
      the share of testing shipments that become paid production volume. The same evidence set lacks
      audited revenue, gross margin, cash, burn, and runway. Consequently, revenue per tonne,
      contribution margin, plant-level utilization, customer-acquisition payback, working-capital
      needs, and service-delivery costs remain uncalculable rather than merely low-confidence.
      Management diligence should begin with audited statements and contract cohorts, then reconcile
      shipped tonnes, accepted tonnes, invoiced tonnes, and recognized revenue by factory and customer.
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
    tableRefs:
      - "TI002"
  - id: "capital-and-capacity"
    title: "Capital Adequacy and Manufacturing Commitments"
    body: >-
      Group14 closed a $463 million Series D in August 2025 and public sources place cumulative equity
      raised above $1 billion. The company said the new funds would scale SCC55 manufacturing in the
      United States and South Korea, and the transaction also transferred the remaining 75% of the
      Korean joint venture to Group14. These facts demonstrate financing access and asset control;
      they do not reveal cash available after the acquisition, current burn, debt, or remaining
      construction commitments. Execution risk is material. GeekWire reported that BAM-2's production
      start moved from late 2024 to early 2026 and that an undisclosed number of workers were laid off
      in 2025. The current homepage labels 10 GWh online while separately presenting a 20 GWh
      Washington factory, so the latter should be treated as stated capacity rather than operating
      output until commissioning, yield, and utilization are verified.
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "financial-verdict"
    title: "Financial Verdict and Underwriting Blockers"
    body: >-
      The financial case is promising but not presently underwritable from public data. Commercial
      deliveries, a broad reported customer base, operating Korean capacity, and repeated strategic
      financing reduce technology-market and near-term fundraising risk. They do not answer whether
      Group14 earns an attractive spread over precursor, energy, labor, qualification, depreciation,
      and logistics costs. The BAM-2 delay and layoffs show that announced capacity can arrive later
      than planned, while the official news archive acknowledges that Chinese manufacturers are
      already deploying silicon-carbon technology at scale as American startups continue
      commercializing. The investment case therefore depends on private proof: audited revenue and
      gross margin, factory-level yield and utilization, customer concentration, signed take-or-pay
      volume, remaining capex, cash, debt, burn, and a downside runway plan. Funding raised must not
      be treated as cash available, and adoption or testing shipments must not be treated as revenue.
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI006"
      - "CI009"
      - "CI010"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI016"
