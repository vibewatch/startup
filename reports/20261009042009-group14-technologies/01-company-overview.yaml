callouts:
  - calloutType: insight
    title: Strategic Dual-Geography Manufacturing and Supply Chain Integration
    body: >-
      Group14's acquisition of 100% ownership of the Korean BAM-3 manufacturing plant provides an operational bridgehead
      in Asia adjacent to tier-one cell makers. This operating asset balances project execution risks and construction
      delays at the domestic BAM-2 facility in Moses Lake.
    claimRefs:
      - CO003
      - CO004
      - CO006
  - calloutType: risk
    title: Macroeconomic Headwinds and Capital Expenditure Dependencies
    body: >-
      The combination of federal clean-technology subsidy retrenchment, electric vehicle adoption plateaus, and schedule
      slippage at BAM-2 underscores significant execution vulnerability. While $463M in Series D proceeds extends
      runway, high ongoing capital expenditure demands disciplined commercial conversion.
    claimRefs:
      - CO006
      - CO007
