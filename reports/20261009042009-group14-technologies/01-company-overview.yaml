company:
  name: Group14 Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Group14 Technologies is an advanced silicon-carbon composite battery materials manufacturer that has raised over
    $1.1B in equity to commercialize its proprietary SCC55 anode input for lithium-ion cells. While the company has
    deployed operational capacity in South Korea through its Series D acquisition of a formerly joint-venture
    manufacturing plant, its domestic roadmap faces delays at its flagship Moses Lake BAM-2 facility and broader
    clean-energy macroeconomic headwinds. This chapter establishes the baseline corporate identity, capitalization
    structure, executive leadership, and manufacturing scale that subsequent diligence chapters build upon.
sections:
  - id: company-identity-and-mission
    title: Corporate Identity, Mission, and Core Silicon-Carbon Technology
    body: >-
      Group14 Technologies, Inc. is a materials science and battery storage technology company founded in 2015 and
      headquartered in Woodinville, Washington. The company was founded by Rick Luebbe, Dr. Rick Costantino, and Aaron
      Feaver as a spin-out from EnerG2, an advanced carbon materials enterprise acquired by BASF in 2016. Group14 was
      formed to engineer high-capacity composite materials capable of replacing conventional graphite anodes in
      rechargeable lithium-ion batteries. The company's core commercial offering is SCC55, a micron-scale silicon-carbon
      composite engineered to mitigate silicon's historic volumetric expansion while enabling up to 50% volumetric
      energy density gains and sub-ten-minute extreme fast charging. Group14 operates as an input materials supplier
      selling directly to lithium-ion cell manufacturers across electric mobility, consumer electronics, and grid-scale
      data center energy storage markets.
    claimRefs:
      - CO001
      - CO008
      - CO009
    tableRefs:
      - TO001
  - id: executive-leadership-and-governance
    title: Executive Leadership, Technical Pedigree, and Operational Governance
    body: >-
      Group14 is governed by an executive management team combining serial clean-technology entrepreneurship, advanced
      materials synthesis pedigree, and public capital markets governance. Chief Executive Officer and co-founder Rick
      Luebbe previously led EnerG2 from inception through its trade sale to BASF, providing seasoned perspective on
      advanced material scaling and commercialization. Chief Technology Officer and co-founder Dr. Rick Costantino
      brings over two decades of biochemical and chemical engineering product development from MIT, Alkermes, Genentech,
      and EnerG2, holding foundational patents covering the synthesis of SCC55. The executive bench is reinforced by
      Chief Financial Officer Mike Willis, who previously managed public markets capital structure at Nasdaq-listed Gevo
      and Westport Fuel Systems, and Dr. Kiseon Park, former CEO of SK Materials Group14, who oversees Asian
      manufacturing operations. Key-person dependency remains concentrated in the two co-founders who control
      proprietary technical architecture and strategic vision.
    claimRefs:
      - CO001
      - CO012
    tableRefs:
      - TO002
  - id: capitalization-and-strategic-investors
    title: Capitalization Trajectory, Strategic Syndicates, and Private Valuation Dynamics
    body: >-
      Group14 has completed four primary institutional and strategic equity rounds, raising an aggregate of $1.11B in
      paid-in capital alongside substantial nondilutive federal grant commitments. Its early equity financing
      encompassed an $18M Series A round led by Amperex Technology Limited (ATL) and a $17M Series B round led by South
      Korean conglomerate SK Inc. In May 2022, Group14 secured a $400M initial Series C tranche (subsequently expanded
      to $614M) led by German automaker Porsche AG with participation from OMERS Capital Markets, Decarbonization
      Partners, and Microsoft Climate Innovation Fund. In August 2025, Group14 closed a $463M Series D round led by SK
      Inc., simultaneous with buying out SK's 75% equity interest in their South Korean battery active materials plant.
      Although private secondary marketplaces such as EquityZen actively facilitate pre-IPO liquidity, the company has
      refrained from disclosing an official Series D post-money valuation, leaving third-party valuation models reliant
      on secondary market indicators.
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO011
      - CO013
    tableRefs:
      - TO003
  - id: manufacturing-scale-delays-and-macro-headwinds
    title: Manufacturing Assets, Production Delays, and Macroeconomic Headwinds
    body: >-
      Group14's physical production infrastructure spans domestic and international manufacturing assets. The company
      launched its initial commercial plant, BAM-1, in Woodinville, Washington in April 2021, providing 120 tons per
      year of pilot and commercial qualification capacity. International volume scaling is anchored by BAM-3 in Sangju,
      South Korea, an operating 10 GWh facility now wholly owned following the SK joint venture buyout, which ships
      qualification materials to over 150 customer programs. However, domestic expansion at BAM-2 in Moses Lake,
      Washington has encountered schedule slippage, extending initial commercial start dates from late 2024 to early
      2026. These production delays have coincided with workforce layoffs, shifting federal clean-technology policy
      priorities, and broader electric vehicle adoption moderations. To safeguard input availability, Group14 secured an
      award negotiation for up to $200M from the U.S. Department of Energy to construct an adjacent silane precursor
      facility.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO010
      - CO014
    figureRefs:
      - FO001
