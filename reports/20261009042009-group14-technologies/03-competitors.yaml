company:
  name: "Group14 Technologies"
chapter:
  number: 3
  title: "Competitors"
  summary: "Group14's disclosed competitive edge is a combination of claimed drop-in compatibility and manufacturing scale, but the evidence is asymmetric: the assigned pool provides current operating and delay evidence for Group14 while leaving peer capabilities, pricing, and qualification results largely undisclosed. BAM-2's repeated schedule movement to 2027 narrows the practical advantage until capacity is commissioned."
sections:
  - id: "landscape-and-substitutes"
    title: "Landscape and Buyer Alternatives"
    body: >-
      The public landscape spans direct silicon-anode specialists, incumbent graphite, scaled
      Chinese silicon-carbon suppliers, and customer-controlled development. The assigned evidence
      names Sila and OneD as the closest regional peers: in June 2025, GeekWire reported that Sila
      was commissioning a Moses Lake facility while OneD had reportedly stopped its local pilot.
      Traditional graphite remains the baseline that Group14 says SCC55 replaces without production-line
      retooling. Group14's own news index also warns that Chinese manufacturers are already deploying
      silicon-carbon technology at scale. Internal development by cell or vehicle manufacturers remains
      a plausible buyer alternative, but this source set provides no named program, scale, or performance
      evidence; it is therefore shown as unknown rather than scored as a proven competitor.
    claimRefs:
      - CP001
      - CP008
      - CP011
    tableRefs:
      - TP001
  - id: "capability-and-scale"
    title: "Capability, Scale, and Execution"
    body: >-
      Group14 frames SCC55 as a direct replacement for graphite and says existing lithium-ion lines
      need no retooling. Its homepage reports a 10 GWh factory in Sangju, South Korea as online and
      claims more than 25 million enabled devices, providing a stronger commercialization signal than
      the assigned evidence offers for Sila or OneD. The advantage is not yet uniform across regions.
      BAM-2's expected production date moved from the second quarter of 2025, to early 2026, and then
      to 2027 on Group14's current facility page. The same page describes an initial 2,000 tons, or
      10 GWh, per module. Manufacturing capacity is therefore both the central differentiator and the
      most visible execution dependency in Group14's competitive position.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: "commercial-terms-and-distribution"
    title: "Commercial Terms and Distribution Power"
    body: >-
      Public pricing is not comparable across the reviewed set. None of the assigned Group14 pages
      discloses a list price, price per kilogram, realized contract price, discount schedule, minimum
      order, or qualification charge; the assigned independent articles likewise do not provide peer
      pricing. Procurement decisions therefore cannot be underwritten from a headline price matrix.
      Distribution evidence is somewhat stronger: GeekWire reported in June 2025 that Group14's South
      Korean plant was expected to reach full capacity the following month and could serve Chinese
      customers without U.S. tariffs. Group14 also claimed more than 150 customers and patent coverage
      across jurisdictions representing more than 90% of battery-material consumption. Those are useful
      reach indicators, but they do not establish customer concentration, contractual lock-in, or
      realized economics.
    claimRefs:
      - CP006
      - CP007
      - CP009
      - CP012
    tableRefs:
      - TP003
  - id: "moat-and-displacement-risk"
    title: "Moat Durability and Displacement Risk"
    body: >-
      Group14's defensibility rests on three linked claims: drop-in compatibility lowers adoption
      friction, patents constrain imitation, and operating capacity turns technical differentiation
      into supply assurance. The first and third have visible public signals, while patent quality,
      enforceability, comparative cell performance, and switching costs are not independently tested
      in this pool. Execution risk is concrete. Group14 laid off an undisclosed number of U.S. workers
      in July 2025 after citing demand shifts and trade uncertainty, and BAM-2's latest 2027 target
      follows multiple prior dates. Meanwhile, company-issued material says Chinese suppliers are
      already deploying silicon-carbon at scale. The moat should therefore be treated as promising
      but conditional on commissioning, qualification data, and durable customer commitments rather
      than on patent count or announced capacity alone.
    claimRefs:
      - CP003
      - CP006
      - CP010
      - CP011
      - CP013
      - CP014
