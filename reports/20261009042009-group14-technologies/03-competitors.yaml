          description: "Included as a buyer option, with no named program in the assigned pool"
    approximationNotes: "Ordinal 1-3 analytical scale: readiness 1=unknown or paused, 2=commissioning/planned, 3=operating or described as scaled; compatibility 1=not evidenced, 2=limited disclosure, 3=incumbent baseline or explicit drop-in claim. Scores reflect disclosure, not measured performance."
