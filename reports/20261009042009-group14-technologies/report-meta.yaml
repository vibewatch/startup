  topStrengths:
    - Real commercial manufacturing footprint with operational Korean capacity and established customer activity.
    - Strong strategic capital base, including the August 2025 Series D and more than $1.1B of cumulative equity.
    - Differentiated silicon-carbon product with a clear drop-in use case and meaningful patent coverage.
  topRisks:
    - Moses Lake BAM-2 execution remains delayed, keeping domestic scale-up and utilization uncertain.
    - Public disclosure on pricing, audited financials, cash, and margins is still too thin for full underwriting.
    - Customer concentration, retention, and contract conversion remain largely opaque despite broad reported adoption.
  unresolvedGaps:
    - >-
      Exact Series D post-money valuation remains undisclosed; the headline valuation is still a secondary-market
      estimate.
    - Audited revenue, gross margin, cash, burn, and runway figures remain unavailable.
    - BAM-2 commissioning date, yield ramp, and contracted utilization still need verification.
    - Customer retention, renewal cohorts, and OEM-level concentration are not publicly disclosed.
    - Final disposition of the DOE-backed silane award and long-term silane supply security remain unresolved.
