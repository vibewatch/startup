  - id: TV002
    title: 多头 / 空头论点表
    columns:
      - 视角
      - 核心论点
      - 支持证据
      - 改变判断的因素
    rows:
      - - 投资论点
        - 已验证的即插即用硅负极技术
        - SCC55 将充电时间缩短至 10 分钟以内，能量密度最高比石墨高 43%
        - 商业电芯失效、循环衰减严重，或失去 OEM 测试合作
      - - 投资论点
        - Tier-1 战略支持与资产直接控制
        - SK Inc. 领投的 $463M Series D，同时整合取得 Sangju BAM-3 工厂 100% 所有权
        - 主要汽车和电子行业战略方退出投资，或供应商被绕过
      - - 投资论点
        - 广泛的知识产权护城河
        - 全球超过 170 项专利事项，在主要司法辖区保护材料组成和制造方法
        - 不利的专利无效裁决，或未缓解的知识产权盗用
      - - 反向论点
        - 国内扩产执行延误
        - Moses Lake BAM-2 商业生产从 2024 年末推迟至 2026 年初，同时华盛顿州出现裁员
        - BAM-2 按期投产，并达到铭牌利用率和良率目标
      - - 反向论点
        - 宏观与政策脆弱性
        - 联邦清洁技术资金回撤及关税不确定性影响国内供应链
        - 具有约束力的双边包销协议，使材料利润率免受政策变化影响
    notes: 汇总公开记录中识别出的竞争优势与运营脆弱性。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键运营假设
      - 估值与回报逻辑
      - 关键下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - BAM-2 于 2026 年初顺利投产；Sangju BAM-3 实现持续合同包销；硅烷供应得到保障
        - 反映收入高速增长及潜在上市准备度的高端特种材料估值倍数
        - 新兴硅碳同行快速技术商品化，或合成石墨获得补贴
        - 中等；取决于国内工厂投产问题能否迅速解决
      - - 基准情景
        - BAM-3 作为主要收入驱动来源运营，BAM-2 则在 2026 年逐步爬坡，初期利润率温和
        - 估值仍锚定私有 Series D 水平，价值持平至温和增值
        - 国内产量延误及持续的清洁技术宏观逆风挤压营运资金
        - 高；反映当前已验证的运营版图和客户测试轨迹
      - - 悲观情景
        - BAM-2 投产障碍长期持续；客户转向竞争对手硅负极供应商；硅烷投入短缺
        - 估值倍数大幅压缩，后续融资需求持平或以降价轮完成
        - 失去 Tier-1 汽车项目纳入资格，并进行稀释性资产负债表重组
        - 低至中等；$463M Series D 的资产负债表流动性和 SK 战略协同可缓解
    notes: 情景框架预测全球制造设施的运营结果。
