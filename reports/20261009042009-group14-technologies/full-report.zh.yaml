  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              可投资边界是能够在锂离子电芯制造中替代石墨的硅碳负极活性材料。Group14 表示 SCC55 服务于电动交通、消费 设备、数据中心和电动航空，但这些下游应用只是需求邻接市场，不能直接算入 Group14
              的市场收入。除非证据显示 Group14 能捕获相关支出，否则电芯制造、电池包、车辆、设备、正极、电解液和充电基础设施均应排除。上游硅烷
              是制造投入品，天然及人造石墨，以及电芯制造商内部的硅配方，则是替代品。这样的边界能避免把广义电动车或 AI 基础设施支出误标为公司的可服务负极材料市场。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
