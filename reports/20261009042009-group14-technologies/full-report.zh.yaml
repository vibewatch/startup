      - number: '3.3'
        title: 商业条款与分销能力
        blocks:
          - type: paragraph
            body: >-
              在审阅的公司中，公开定价无法比较。指定的 Group14 页面没有披露目录价、每公斤价格、实际合同价格、折扣安排、
              最低订单量或验证费用；指定的独立文章也没有提供同行定价。因此，不能仅凭价格矩阵标题来评估采购决策。分销 证据相对更强：GeekWire 于 2025 年 6 月报道，Group14
              的韩国工厂预计次月达到满产，可在不承担美国关税的情况下 服务中国客户。Group14 还声称拥有超过 150 个客户，以及覆盖占电池材料消费量超过 90% 的司法辖区的专利。这些
              都是有用的触达指标，但不能证明客户集中度、合同锁定或实际经济性。
            claimRefs:
              - CP006
