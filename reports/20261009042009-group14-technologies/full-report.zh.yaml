chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与核心硅碳技术
        blocks:
          - type: paragraph
            body: >-
              Group14 Technologies, Inc. 是一家材料科学与电池储能技术公司，2015 年成立，总部位于华盛顿州 Woodinville。 公司由 Rick Luebbe、Rick Costantino
              博士和 Aaron Feaver 创立，源自 EnerG2 的分拆；EnerG2 是一家先进碳材料 企业，于 2016 年被 BASF 收购。Group14
              的成立目标，是研发高容量复合材料，在可充电锂离子电池中替代传统 石墨负极。公司的核心商业产品 SCC55 是一种微米级硅碳复合材料，旨在缓解硅历来存在的体积膨胀，同时实现 最高 50%
              的体积能量密度提升和十分钟以内的极快充电。Group14 作为输入材料供应商运营，直接向电动车、 消费电子以及电网级数据中心储能市场的锂离子电芯制造商销售。
            claimRefs:
              - CO001
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO010
              - CO012
              - CO013
      - number: '1.2'
        title: 管理层、技术积淀与运营治理
        blocks:
          - type: paragraph
            body: >-
              Group14 的管理团队融合了连续创业经验、先进材料合成积淀和公开资本市场治理能力。CEO 兼联合创始人 Rick Luebbe 此前从创立起带领 EnerG2，直至其被 BASF
              通过交易收购；他对先进材料规模化和商业化都很熟悉。CTO 兼联合创始人 Rick Costantino 博士拥有二十多年生化与化学工程产品开发经验，曾任职于 MIT、Alkermes、 Genentech 和
              EnerG2，并持有覆盖 SCC55 合成工艺的基础专利。CFO Mike Willis 进一步增强了管理层实力； 他曾在纳斯达克上市公司 Gevo 和 Westport Fuel Systems
              负责公开市场资本结构。前 SK Materials Group14 CEO Kiseon Park 博士负责亚洲制造业务。关键人物依赖仍集中在两位联合创始人身上，他们掌握专有技术架构和 战略愿景。
            claimRefs:
              - CO001
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO012
      - number: '1.3'
        title: 资本化轨迹、战略投资者联盟与私募估值动态
        blocks:
          - type: paragraph
            body: >-
              Group14 已完成四轮机构及战略股权融资，累计获得 $1.11B 实缴资本，另有规模可观的非稀释性联邦拨款承诺。 早期股权融资包括由 Amperex Technology Limited（ATL）领投的
              $18M A 轮，以及由韩国财阀 SK Inc. 领投的 $17M B 轮。2022 年 5 月，Group14 获得 $400M 的 C 轮首期融资，随后扩大至 $614M；该轮由德国车企 Porsche AG
              领投，OMERS Capital Markets、Decarbonization Partners 和 Microsoft Climate Innovation Fund 参与。 2025 年 8
              月，Group14 完成由 SK Inc. 领投的 $463M D 轮融资，同时买断 SK 在其韩国电池活性材料工厂中 持有的 75% 股权。尽管 EquityZen 等私募二级市场积极促成 IPO
              前流动性，公司仍未披露正式的 D 轮投后估值， 因此第三方估值模型只能依赖二级市场指标。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO011
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO010
              - CO011
      - number: '1.4'
        title: 制造资产、生产延期与宏观逆风
        blocks:
          - type: paragraph
            body: >-
              Group14 的实体生产基础设施覆盖美国本土和海外制造资产。公司于 2021 年 4 月在华盛顿州 Woodinville 启动首座商业工厂 BAM-1，提供年产 120
              吨的试点及商业验证产能。国际规模化生产以韩国 Sangju 的 BAM-3 为核心：这座在运的 10 GWh 工厂在收购 SK 合资企业后已完全归 Group14 所有，并向超过 150 个客户项目发运
              验证材料。然而，华盛顿州 Moses Lake 的 BAM-2 本土扩建出现进度滑坡，初始商业化投产时间从 2024 年末推迟 至 2026
              年初。这些生产延误与裁员、联邦清洁技术政策重点转移以及电动车普及放缓同时发生。为保障投入品供应， Group14 获得了美国能源部最高 $200M 奖励的谈判资格，用于建设相邻的硅烷前体工厂。
            claimRefs:
              - CO005
