  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 规模化与运营执行
        blocks:
          - type: paragraph
            body: >-
              BAM-2 的进度执行是目前最显著的可观察风险。GeekWire 于 2025 年 8 月报道，Moses Lake 投产时间已从 2024 年末 推迟至 2026 年初，且 Group14
              在前一个月进行了未披露规模的裁员。Mercom 和 GeekWire 报道的 $463 million D 轮融资
              提升了爬坡的融资能力，但募资额不等于可用现金，指定证据也没有披露现金、消耗速度、剩余建设成本、良率、利用率 或客户验证产量。公开产能描述还使用了不可比的单位和时点：公司当前主页称 10 GWh 已上线，并描述一座
              20 GWh 的华盛顿工厂，而 Battery-Tech Network 列出 Moses Lake 产能为 4,000 吨、2025 年完工。在没有管理层数据之前，
              这些数字不应被换算或强行调和。如果尽调无法证明 BAM-2 持续产出达到客户验证、良率可接受，并且在此前报道的 2026 年初目标之后仍有资金支持签约利用率，投资逻辑就应被否定。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
