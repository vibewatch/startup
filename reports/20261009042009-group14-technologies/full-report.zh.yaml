      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有数据只能支持运营代理指标，而非美元口径的市场模型。Group14 当前主页声称已有 10 GWh 上线、赋能超过 2,500 万台设备，并另列韩国 10 GWh、华盛顿州 20 GWh 以及德国最高
              1,000 吨硅烷产能。其资源页面声称拥有 超过 150 个客户。这些数字的单位、分母和商业含义各不相同：名义产能不等于产量，设备数不等于年出货量，客户 不等于付费项目，任何一项都不等于收入。GeekWire
              报道的 BAM-2 此前延期，也进一步提醒我们不能把列示产能当作 可供货产能。没有指定来源提供兼容的市场分母、美元口径 TAM/SAM/SOM 或 CAGR。
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
