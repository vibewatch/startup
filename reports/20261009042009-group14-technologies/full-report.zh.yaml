          - type: callout
            title: 上游硅烷前体依赖带来瓶颈风险
            body: 生产数千吨硅碳复合材料，需要相应数量的危险硅烷气体。在 Group14 调试位于 Moses Lake 的本土硅烷工厂并重启 德国 Schmid 工厂之前，商业化扩张仍依赖历史上由中国生产商主导的商用硅烷供应链。
            calloutType: risk
            claimRefs:
              - CE003
