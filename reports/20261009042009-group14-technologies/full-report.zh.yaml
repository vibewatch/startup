      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Group14 的防御力建立在三个相互关联的主张上：即插即用兼容性降低采用阻力，专利限制模仿，运营产能把技术差异
              化变成供应保障。前者和后者都有可见的公开信号，但这组材料并未独立检验专利质量、可执行性、相对电芯性能和 切换成本。执行风险是实在的。Group14 以需求变化和贸易不确定性为由，于 2025 年 7
              月在美国裁减了未披露数量的 员工，而 BAM-2 最新的 2027 年目标是在此前多个日期之后提出的。与此同时，公司发布的材料称，中国供应商已经
              在大规模部署硅碳。因此，护城河应被视为有潜力但有条件，前提是完成调试、取得验证数据并保持稳定的客户承诺， 而不能只看专利数量或宣布的产能。
