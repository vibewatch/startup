  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流整合
        blocks:
          - type: paragraph
            body: >-
              Group14 Technologies 生产 SCC55®，这是一种工程化硅碳复合粉末，用于在商业锂离子电池负极中直接替代或 掺混人造和天然石墨。在标准电芯制造流程中，采用纯硅负极曾因元素硅在嵌锂期间膨胀最高达
              300 percent 而导致灾难性 机械失效，颗粒粉化并迅速破坏固体电解质界面（SEI）。Group14 把非晶纳米硅嵌入工程化刚性多孔碳骨架，
              以绕开这一退化。碳框架在内部吸收嵌锂体积应变，同时保持导电性并形成稳定的外部 SEI 层。由于 SCC55 作为物理上的即插即用粉末替代品，电芯制造商可以将其直接接入现有的浆料制备、狭缝涂布、辊压以及卷绕或叠片
              工艺，无需昂贵的资本改造或新建电芯装配线。由此产生的即插即用化学体系可将电池包能量容量提高最高 50 percent， 并支持极快充电（XFC），让电动交通和消费设备电芯在短至 90 秒内从 0 充至 100
              percent，同时在 1,000 至 3,000 次充放电循环中保持循环耐久性。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
