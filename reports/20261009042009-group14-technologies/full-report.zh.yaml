  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流 / 基线
      - 公司方案
      - 可量化收益
      - 技术局限 / 权衡
    rows:
      - - 优化电动车电芯能量密度
        - 传统天然 / 人造石墨负极（理论容量约 372 mAh/g）
        - 将即插即用的 SCC55 复合粉末混入现有浆料线或替代其中部分材料
        - 电池包容量最高提升 50%；1 吨 SCC55 可替代约 5 吨石墨
        - 需要调校粘结剂和电解液添加剂；每公斤高级原材料成本更高
      - - 极致快充（XFC）
        - 石墨负极的充电倍率受限于 0.5C-2C，以避免析锂和枝晶生长
        - 纳米硅碳结构支持快速离子扩散，同时避免析锂风险
        - 客户电芯测试据报可在 90 秒内从 0%-100% 充电（相当于传统锂离子电池的 50x）
        - 极致快充循环期间会产生更高热量，热管理必须应对
      - - 消费电子体积能量密度
        - 以石墨为主的方形和软包电芯限制设备续航和轻薄度
        - 将 SCC55 集成到高密度电芯，用于智能手机和可穿戴设备
        - 电芯体积能量密度提升超过 43%；已部署于 25m+ 台设备
