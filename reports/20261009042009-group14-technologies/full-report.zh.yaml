      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 战略性双地域制造与供应链整合
            body: Group14 收购韩国 BAM-3 制造工厂的 100% 所有权，在亚洲一级电芯制造商附近建立了运营桥头堡。这项在运资产 抵消了 Moses Lake 本土 BAM-2 工厂的项目执行风险和建设延误。
            calloutType: insight
