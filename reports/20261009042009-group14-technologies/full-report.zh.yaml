        title: 展示项
        blocks:
          - type: callout
            title: 即插即用兼容性消除了超级工厂改造障碍
            body: SCC55 的核心商业优势，是与传统锂离子电池制造设备的即插即用兼容性。电芯制造商可以把 SCC55 替换进标准浆料 和狭缝涂布工艺，在无需数十亿美元工厂改造的情况下，实现最高 50 percent 的容量提升。
            calloutType: strength
            claimRefs:
              - CE001
