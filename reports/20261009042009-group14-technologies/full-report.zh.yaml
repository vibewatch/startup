companyProfile:
  summary: >-
    Group14 Technologies 是一家私营先进电池材料公司，研发并制造 SCC55，这是一种旨在替代或补充锂离子电芯中石墨的 硅碳复合负极材料。公司 2015 年从 EnerG2 分拆成立，总部位于华盛顿州
    Woodinville，如今将美国研发与韩国商业化 制造结合起来。它的公开定位更像规模化材料供应商，而不是电芯制造商：公司通过电芯制造商和 OEM，向电动车、消费电子
    及其他锂离子项目供货，同时仍面临美国本土扩产和公开披露方面的重大执行风险。
