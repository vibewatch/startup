              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: 所有权、合作伙伴与需求集中度
        blocks:
          - type: paragraph
            body: >-
              收购 SK Inc. 的 75% 股权后，Group14 完全拥有 Sangju 合资企业，同时 SK 还领投了 D 轮融资。完全控制可能简化 运营决策，但也意味着工厂经济性和交割执行直接落在 Group14
              身上；指定来源没有披露收购对价、承接的负债，或 BAM-3 的良率和利用率。GeekWire 报道，BAM-3 于 2025 年 8 月向客户测试发运材料，这证明存在活动，但不能证明
              有经常性商业需求。同样，公司声称服务超过 150 个客户，GeekWire 报道有 150 个注册客户，但都没有披露付款方 集中度、生产与试点的构成、留存、数量或签约收入。与 Forge Nano
              的合作证明存在一条本土整合路径，却不能证明 多方本土供应链已具备规模化验证。尽调应把失去锚定验证项目、测试转生产延迟，或 Sangju 持续利用不足视为 投资逻辑破坏信号。
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: 政策、法律与知识产权风险
        blocks:
          - type: paragraph
            body: >-
              公开政策支持对披露的建设历程很重要，但当前是否仍可获得，无法由这组材料证明。Wikipedia 记录公司曾宣布 2022 年获得 $100 million 能源部奖励，并于 2024 年入选最高 $200
              million 奖励的谈判名单；GeekWire 后续则将 联邦清洁技术削减、关税不确定性和电动车市场前景放缓描述为逆风。这些是不同的资金阶段和时期，因此在没有奖励
              文件的情况下，任何一笔都不应视为当前现金或未提取承诺。知识产权上，公司 2026 年 3 月的新闻稿称 Group14 已超过 170 项已授权专利事项，而当前公司主页称其获得超过 200
              项专利支持。指标名称和日期不同，应保持区分。 公司还公开了美国国际贸易委员会关于公共利益的声明，说明执法和贸易保护是正在发生的关注点。指定来源中没有任何
              法院、监管机构、专利局、环境、安全或事故记录；因此，诉讼、许可、安全、隐私和执法结果仍未验证，而不是已被 证明不存在。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 监测与投资终止标准
        blocks:
          - type: paragraph
            body: >-
              风险监测应聚焦能改变投资判断的证据，而不是没有依据的点估计。运营方面，应按每座工厂要求每月提供建设完成度、 调试、良率、报废、验证、出货和签约利用率数据，并用吨数和 GWh
              两种口径核对。财务方面，应取得经审计的现金、 受限现金、拨款应收款、剩余资本开支、消耗速度、营运资本和契约数据；D 轮融资所得本身不能证明资金续航。商业
              持续性方面，应要求客户层面的生产状态、集中度、续约或重复订单证据以及取消权。法律和政策风险方面，应核实已 执行的 DOE
              奖励条款、当前拨款和追回条件、重大专利及自由实施意见、环境和安全许可、诉讼、事故及保险。终止 标准包括：无法证明客户验证的经济良率生产；完成工厂所需的资金丧失或重大延迟；阻断关键市场的不利知识产权或
              监管结果；以及客户集中和取消订单导致已披露产能没有签约需求。如果指定证据无法量化概率，登记表会将风险标为 未评分，而不是制造虚假的精确度。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR010
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把融资等同于执行风险已解除
            body: $463 million D 轮融资是融资事件，不是资金续航、调试完成、经济良率或签约利用率的证据。在把资金可用性视为 BAM-2 执行风险的缓释因素之前，应要求工厂级里程碑和经审计的流动性数据。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反投资逻辑
        blocks:
          - type: paragraph
            body: >-
              Group14 Technologies 的核心投资逻辑，建立在其作为 SCC55 硅碳复合电池材料商业供应商的市场地位之上 [CV001]。 Group14
              的专有材料可作为即插即用替代品，相比传统石墨显著提升锂离子电池能量密度，同时缩短快充时间 [CV006, CV008]。SK Inc.、Porsche Investments 和 ATL
              的战略支持，以及其合资制造资产向全球电池客户发运硅电池材料， 证明了商业验证 [CV001, CV007, CV009]。但反投资逻辑来自资本密集型本土制造规模化的执行阻力：Moses Lake BAM-2
              的商业调试从 2024 年末推迟到 2026 年初，华盛顿州启动裁员，清洁技术政策逆风带来宏观不确定性 [CV004, CV005,
              CV010]。如果没有经过验证的长期客户利润和持续单位盈利能力，激进的估值扩张将面临重大阻力 [CV012]。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              Group14 自 2015 年成立以来累计融资超过 $1.1B，资本储备充足 [CV002, CV003, CV011]。2025 年 8 月 20 日，公司完成关键的 D 轮融资，由 SK Inc.
              领投，Porsche Investments、Microsoft Climate Innovation Fund、OMERS 和 Decarbonization Partners 继续参与，共注入 $463M
              新股权 [CV001, CV007, CV013]。Group14 随后用交易所得向 SK Inc. 收购韩国 Sangju BAM-3 制造工厂剩余的 75% 股权，对这处主要亚洲制造基地取得 100%
              直接运营所有权 [CV001, CV009, CV014]。这一战略里程碑虽已落地，官方公告始终未披露确切的投后股权估值；历史二级市场估值与第三方追踪数据库记载的融资轮次和未经验证的价格标记也不一致
              [CV002, CV003, CV015]。由于缺少经审计的收入运行率、毛利率披露和确定的承购合同定价，若不承担重大估算风险，就无法根据公开信息可靠推算估值倍数 [CV012, CV015]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: 情景分析、退出路径与投资判断
        blocks:
          - type: paragraph
            body: >-
              评估 Group14 的投资判断，需要在技术先发优势与运营执行、供应安全之间权衡 [CV006, CV008, CV010]。在乐观情景中， BAM-3 在亚洲电芯伙伴中实现高利用率，BAM-2 按计划于
              2026 年初完成调试，联邦硅烷基础设施计划保障前体本土供应， 公司便可能在未来获得公开市场流动性时享有溢价倍数 [CV001, CV005, CV009]。在悲观情景中，BAM-2 延期加剧、贸易
              限制或前体关税，以及替代硅负极平台竞争加剧，都会侵蚀定价权，并在后续股权融资中制造下轮融资风险 [CV004, CV005,
              CV010]。综合这些因素，整体建议是以高风险评级和公允估值立场持续跟踪该资产；在商业承购量和工厂经济性 经独立审计验证前，不作投资承诺 [CV004, CV012]。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV010
              - CV012
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 先进电池材料领域，纪律优先于投机
            body: >-
              尽管 Group14 的 $463M D 轮融资和亚洲制造控制权使其领先于大多数尚未收入的清洁技术同行，投资判断纪律仍要求 采取跟踪建议。在投入新的增长资本之前，投资者应等待 Moses Lake
              的商业规模良率和经审计生产经济性得到运营证据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV012
