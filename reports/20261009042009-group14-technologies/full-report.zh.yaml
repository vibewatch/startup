            body: 联邦清洁技术补贴收缩、电动车普及停滞以及 BAM-2 进度滑坡叠加，凸显出显著的执行脆弱性。尽管 $463M D 轮 融资所得延长了资金续航，高额持续资本开支仍要求公司严控商业转化。
            calloutType: risk
