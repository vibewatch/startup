              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与验证
        blocks:
          - type: paragraph
            body: >-
              Group14 的招聘披露将汽车 OEM、消费电子龙头和全球电芯制造商列为商业伙伴，但并未说明所有项目是否由同一 付款方承担。电芯制造商可能采购负极材料，而 OEM
              或设备品牌负责指定性能并批准验证。观察到的采用路径，是从 技术讨论和规格匹配，经过联合开发协议、取样、电芯验证、验证里程碑，最终到商业交付。面向中国的岗位信息还 增加了 A/B/C 样品关卡、APQP/PPAP
              要求、工厂审核和跨职能问题解决。这些步骤削弱了简单终端市场需求预测的 参考价值：预算授权、验证周期和供应合同转化都必须逐项目核实。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Group14 的采用逻辑建立在更高能量密度、更快充电、广泛的形态和化学体系兼容性，以及可直接接入现有锂离子生产
              设备之上。这些特性可以降低改造阻力，但不能消除客户验证、资本执行或竞争时点风险。公司自身招聘披露显示， 大型资本项目需要明确的范围、进度、预算和风险控制。其精选新闻页面还强调，中国制造商已在大规模部署硅碳技术；
              GeekWire 则报道清洁技术政策削减、关税不确定性、电动车预测放缓、裁员以及 BAM-2 延期超过一年。因此，需求 信号不能与合格订单、产能利用率或持久市场份额混为一谈。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 即插即用的产品主张降低改造阻力，但不减少验证工作
            body: >-
              Group14 称 SCC55 可以在不改动生产设备的情况下替代石墨粉；但其招聘披露仍然描述了 JDA、取样、电芯验证、
              测试协议和客户验证里程碑。差别很关键：工艺兼容性可以降低工厂改造成本，却不能证明销售周期短，也不能自动 获得 OEM 批准。
            calloutType: insight
            claimRefs:
              - CM006
              - CM009
              - CM010
          - type: callout
            title: 列示产能尚不是市场份额指标
            body: 由于指定证据缺少产量、利用率、签约承购量、定价和兼容市场分母，名义产能、在线产能、客户数和赋能设备数无法换算出有说服力的市场份额。GeekWire 报道的 BAM-2 延期，使这种区别直接影响运营判断。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场参与者与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              公开市场覆盖直接的硅负极专家、现有石墨供应商、规模化中国硅碳供应商，以及由客户自行控制的研发。指定证据将 Sila 和 OneD 列为最接近的区域同行：GeekWire 于 2025 年 6 月报道，Sila
              正在调试 Moses Lake 工厂，而 OneD 据报道已停止本地试点。传统石墨仍是 Group14 所称 SCC55 无需改造生产线即可替代的基线。Group14 自己的新闻
              索引也警告，中国制造商已经在大规模部署硅碳技术。电芯或汽车制造商内部研发仍是合理的买方替代方案，但这组 来源没有提供具体项目、规模或性能证据，因此应标为未知，而非已证实的竞争对手。
            claimRefs:
              - CP001
              - CP008
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP008
              - CP011
      - number: '3.2'
        title: 能力、规模与执行
        blocks:
          - type: paragraph
            body: >-
              Group14 将 SCC55 定位为石墨的直接替代品，并称现有锂离子产线无需改造。其主页报告韩国 Sangju 有一座 10 GWh 工厂在运，并声称赋能超过 2,500 万台设备，这一商业化信号强于指定证据对
              Sila 或 OneD 的支持。但这种优势在 各地区尚未一致体现。Group14 当前工厂页面显示，BAM-2 的预计投产时间从 2025 年第二季度推迟到 2026 年初， 再推迟到 2027
              年。同一页面称每个模块初始产能为 2,000 吨，即 10 GWh。因此，制造产能既是 Group14 竞争 差异化的核心，也是其竞争地位中最明显的执行依赖。
            claimRefs:
              - CP002
