              - CE006
      - number: '5.2'
        title: 全球制造网络与前体供应整合
        blocks:
          - type: paragraph
            body: >-
              扩大硅碳电池材料的商业化生产，需要持续、大量供应硅烷气体（SiH4）；这是将纳米硅沉积到多孔碳骨架中的关键 气态前体。中国历史上控制着全球超过 90 percent
              的加工负极石墨供应，也是全球商用硅烷气体的主要生产国，使 西方电池制造产线暴露于严重的地缘政治供应中断风险。为建立供应链韧性并消除单一进口节点风险，Group14
              运营多座电池活性材料（BAM）工厂，并配套上游化学合成。商业化规模生产于 2021 年在 Woodinville 的 BAM-1 工厂开始，该厂自 2021
              年起以吨级规模运营。为服务亚洲大型电池制造商，Group14 与 SK materials 合资建设了 韩国 Sangju 的 EV 规模工厂，年产 2,000 公吨（约 10
              GWh），现已完成全面商业调试。在美国，Group14 正在 华盛顿州 Moses Lake 建设 BAM-2，规划首期年产能为 4,000 公吨（20 GWh）。为在无外国依赖的情况下供应这些
              工厂，Group14 收购了德国硅烷制造商 Schmid Silicon Technology Holding，并获美国能源部选中，就依据《两党 基础设施法》最高 $200 million 的奖励进行谈判，用于在
              Moses Lake 建设一座 7,200 公吨的本土硅烷工厂，目标 是把化学前体交付与材料合成放在同一地点。
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE008
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
              - CE008
      - number: '5.3'
        title: 技术架构、知识产权保护与运营风险
        blocks:
          - type: paragraph
            body: >-
              Group14 的技术护城河由广泛的全球专利组合加固，专利保护其双阶段制造合成工艺和底层材料复合结构。公司 2015 年从多孔碳专家 EnerG2 分拆，控制着 170 至 200
              项已授权专利，覆盖美国、欧洲、韩国、日本和中国等 主要电池制造司法辖区。其专有合成工艺先将调配好的有机前体热碳化为多孔碳基体，再对其进行硅烷气体化学气相 沉积（CVD）。然而，尽管技术成熟度较高，且已向 100
              至 160 多个全球客户验证发货，商业部署仍面临重大的技术 和运营依赖。Moses Lake 的 BAM-2 扩建和本土硅烷合成需要大量资本开支、及时的设备交付和联邦拨款最终落地。 此外，由于 Group14
              生产的是中间态散装活性粉末，而不是完整电芯，面对高镍、LFP 和 LMFP 等不同客户化学体系时， 电芯验证周期可能持续 12 至 24 个月。公司没有公开的软件开发者 API
              生态，严格作为一家先进材料企业运营，采用 传统的企业客户测试协议。
            claimRefs:
              - CE009
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
