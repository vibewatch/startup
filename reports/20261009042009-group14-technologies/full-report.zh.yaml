  - id: FU001
    title: SCC55 客户采用生命周期与扩张路径
    type: journey-map
    summary: 可视化展示电芯制造商和汽车 OEM 经历测试、工厂认证和产量扩张的结构化进程，并突出 BAM-2 的阻力点。
    data:
      items:
        - label: 阶段 1：初步筛选与取样
          touchpoints:
            - 对照标准石墨基准进行台架级材料评估
            - 以 1,500 至 3,000 次循环为目标验证循环寿命
            - 在现有卷对卷设备上测试浆料兼容性
        - label: 阶段 2：电芯级原型
          touchpoints:
            - 软包和圆柱电芯原型（例如 Farasis 330 Wh/kg、Sionic 400 Wh/kg）
            - 即插即用混配校准（硅负载量 5% 至 100%）
            - 第三方验证 10 分钟以内的快充速率
        - label: 阶段 3：工厂认证与包销
          touchpoints:
            - 多年包销合同谈判（8 家制造商合计 $750M+）
            - BAM-3 Sangju 工厂供应认证（100+ 活跃客户）
            - 针对西方知识产权和商业秘密防护的供应链审计
        - label: 阶段 4：批量生产爬坡
          touchpoints:
            - 向消费电子商业供应电芯（已赋能 25M+ 台设备）
            - 与 Porsche AG 等战略领头客户进行汽车电池包集成
            - 从全资 Sangju 工厂交付吨级产量
        - label: 阶段 5：国内规模化与供应链闸门
          touchpoints:
            - 闸门因素：克服 BAM-2 Moses Lake 的建设暂停和停薪休假
            - 经济阻力：与定价低于 $10/kg 的合成石墨竞争
            - 解决硅烷进料气体和美国国内制造激励问题
        - label: 阶段 6：长期车队扩张与留存
          touchpoints:
            - 监测多年队列续约和 NRR 指标
            - 拓展至固定式电网储能和动态 AI 数据中心备份
            - 将初步包销意向书转化为正式且有约束力的采购订单
    approximationNotes: 路径阶段代表汽车和电池材料认证周期中记录的标准化商业化路径。
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU007
      - CU008
      - CU011
      - CU014
