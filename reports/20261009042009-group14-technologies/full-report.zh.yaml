            - 微米粉末批量封装与物流
            - 电化学质量控制与计量
            - 防潮抗氧化密封
        - label: 工程化纳米复合材料层
          detail: 为即插即用替代石墨而设计的 SCC55 硅碳复合微米粉末
          modules:
            - 非晶纳米硅活性材料
