company:
  name: Group14 Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Group14's defensible market boundary is silicon-carbon anode active material used
    inside lithium-ion cells, not downstream battery, vehicle, device, or data-center
    spend. The assigned evidence supports operating-scale and adoption proxies, but
    not a defensible dollar TAM, SAM, SOM, market CAGR, utilization rate, or contracted
    revenue conversion.
sections:
  - id: market-boundary
    title: Market Boundary and Substitutes
    body: >-
      The investable boundary is silicon-carbon anode active material that can replace
      graphite in lithium-ion cell manufacturing. Group14 describes SCC55 as serving
      electric mobility, consumer devices, data centers, and electric aviation, but
      those downstream applications are demand adjacencies rather than revenue that
      can be counted in Group14's market. Cell manufacturing, packs, vehicles, devices,
      cathodes, electrolytes, and charging infrastructure are excluded unless evidence
      shows Group14 captures that spend. Upstream silane is a manufacturing input, while
      natural and synthetic graphite and cell makers' internal silicon formulations are
      substitutes. This boundary prevents broad EV or AI infrastructure spending from
      being mislabeled as the company's addressable anode-material market.
    claimRefs:
      - CM001
      - CM002
      - CM005
      - CM006
      - CM007
    tableRefs:
      - TM001
    figureRefs:
      - FM001
  - id: evidence-constrained-sizing
    title: Evidence-Constrained Sizing
    body: >-
      The available pool supports operating proxies rather than a dollar market model.
      Group14's current homepage claims 10 GWh online and more than 25 million devices
      enabled, and separately lists 10 GWh in South Korea, 20 GWh in Washington State,
      and up to 1,000 tonnes of silane capacity in Germany. Its resources page claims
      more than 150 customers. These figures have different units, denominators, and
      commercial meanings: nameplate capacity is not production, devices are not annual
      shipments, customers are not paying programs, and none is revenue. GeekWire's
      report of a prior BAM-2 delay further cautions against treating listed capacity
      as available supply. No assigned source provides a compatible market denominator,
      dollar TAM/SAM/SOM, or CAGR.
    claimRefs:
      - CM003
      - CM004
      - CM012
      - CM013
      - CM014
      - CM016
    tableRefs:
      - TM002
  - id: buyers-and-adoption-path
    title: Buyers, Users, Payers, and Qualification
    body: >-
      Group14's careers disclosures identify automotive OEMs, consumer-electronics
      leaders, and global cell manufacturers as commercial partners, but they do not
      establish a single payer across programs. A cell maker may procure anode material
      while an OEM or device brand specifies performance and approves qualification.
      The observed adoption path runs from technical discussions and specification
      matching through joint development agreements, sampling, cell qualification,
      validation milestones, and commercial delivery. China-focused roles add A/B/C
      sample gates, APQP/PPAP requirements, factory audits, and cross-functional issue
      resolution. These steps reduce the usefulness of a simple end-market demand
      forecast: budget authority, qualification time, and supply-contract conversion
      must be verified program by program.
    claimRefs:
      - CM008
      - CM009
      - CM010
    tableRefs:
      - TM003
  - id: drivers-and-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      Group14's adoption thesis rests on higher energy density, faster charging, broad
      format and chemistry compatibility, and direct use in existing lithium-ion
      production equipment. Those attributes can lower retooling friction, but they do
      not remove customer validation, capital execution, or competitive timing risk.
      The company's own hiring disclosures show that large capital projects require
      explicit scope, schedule, budget, and risk control. Its curated news page also
      highlights Chinese manufacturers deploying silicon-carbon technology at scale,
      while GeekWire reported clean-tech policy cuts, tariff uncertainty, slower EV
      projections, layoffs, and a more-than-one-year BAM-2 delay. Demand signals are
      therefore not interchangeable with qualified orders, utilization, or durable
      market share.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM011
      - CM014
      - CM015
