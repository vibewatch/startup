callouts:
  - calloutType: insight
    title: Drop-in Claims Reduce Retooling Friction, Not Qualification Work
    body: >-
      Group14 says SCC55 can replace graphite powder without production-equipment
      changes, while its hiring disclosures still describe JDAs, sampling, cell
      qualification, testing protocols, and customer validation milestones. The
      distinction matters: process compatibility can lower plant-change costs without
      proving a short sales cycle or automatic OEM approval.
    claimRefs:
      - CM006
      - CM009
      - CM010
  - calloutType: risk
    title: Listed Capacity Is Not Yet a Market-Share Measure
    body: >-
      Nameplate capacity, online capacity, customer counts, and enabled devices cannot
      be divided into a defensible share because the assigned evidence lacks production,
      utilization, contracted offtake, pricing, and a compatible market denominator.
      GeekWire's reported BAM-2 delay makes that distinction operationally material.
    claimRefs:
      - CM003
      - CM004
      - CM012
      - CM013
      - CM014
      - CM016
