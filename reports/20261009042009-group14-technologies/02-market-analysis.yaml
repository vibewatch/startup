figures:
  - id: FM001
    title: Evidence Hierarchy for the Silicon-Carbon Anode Opportunity
    type: pyramid
    summary: >-
      A boundary-to-proof hierarchy that separates the broad application set from
      Group14-specific deployment indicators without presenting a fabricated TAM/SAM/SOM.
    data:
      nodes:
        - label: Downstream demand adjacencies
          value: EV, consumer, data center, aviation
          detail: End-market spending is excluded from the core anode-material boundary.
        - label: Core material category
          value: Silicon-carbon anode active material
          detail: SCC55 is positioned to replace or supplement graphite in lithium-ion cells.
        - label: Compatible cell formats
          value: 3 disclosed formats
          detail: Pouch, prismatic, and cylindrical formats are named in the executive interview.
        - label: Compatible chemistry pathways
          value: 3 disclosed pathways
          detail: NMC, LFP, and solid-state compatibility is company-claimed.
        - label: Company operating-capacity indicator
          value: 10 GWh online
          detail: Current homepage claim; utilization and output period are not supplied.
        - label: Company deployment indicator
          value: 25M+ devices enabled
          detail: Current homepage claim without a shipment period or revenue denominator.
    approximationNotes: >-
      Pyramid order represents analytical narrowing, not proportional scale or conversion;
      text categories, counts, GWh, and device totals use different denominators.
    claimRefs:
