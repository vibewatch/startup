company:
  name: "Group14 Technologies"
chapter:
  number: 6
  title: "Customers"
  summary: "Group14 commercializes its SCC55 silicon-carbon anode material across more than 150 battery-manufacturing and OEM customers, reporting $750M+ in multi-year offtake commitments with eight leading cell makers across automotive and consumer electronics. However, customer traction remains divided between commercial shipments from its wholly owned Korean factory and severe adoption friction in the United States, where delayed commissioning and furloughs at BAM-2 leave commitments unconverted into public revenue while synthetic graphite pricing below $10/kg dampens near-term volume ramp."
sections:
  - id: "customer-segmentation-and-buyer-dynamics"
    title: "Customer Segmentation and Buyer Dynamics Across Mobility and Devices"
    body: "Group14 segments its customer base across electric mobility, consumer electronics, electric aviation, and emerging data center power applications. In electric mobility, strategic automaker partners such as Porsche AG and cell manufacturers qualify SCC55 as a direct drop-in replacement to boost pack energy density by up to 50% and reduce vehicle charging times below 10 minutes. In portable devices and consumer electronics, cell manufacturers including Amperex Technology Limited (ATL) and Sionic Energy evaluate or deploy silicon-carbon formulations to achieve thinner form factors and elevated volumetric energy storage, reaching 25+ million devices enabled with SCC55. Across all verticals, the economic buyer is typically an automotive OEM or battery cell producer seeking energy density improvements, while the technical user is the cell engineering team requiring drop-in compatibility on standard slurry and coating lines without factory retooling."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-qualification-friction"
    title: "Commercial Adoption Trajectory, Factory Ramp, and Qualification Friction"
    body: "Adoption of SCC55 is structured around a multi-stage qualification cycle spanning material synthesis, multi-month cell cyclability testing, and automotive pack validation. Group14 reports customer evaluation data demonstrating 1,500 to over 3,000 charge cycles, answering a critical historical objection regarding silicon particle expansion. The company acquired full 100% ownership of its joint-venture battery active materials (BAM) factory in Sangju, South Korea, in August 2025, operating an initial 2,000 tons per year (approximately 10 GWh) capacity supplying over 100 battery manufacturing customers. However, commercial adoption in North America faces persistent friction: the flagship BAM-2 production facility in Moses Lake, Washington, encountered project slowdowns and repeated worker furloughs in July 2025 and January 2026, delaying domestic volume production and shifting operational execution to Asia."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU013"
      - "CU014"
    tableRefs:
      - "TU002"
  - id: "customer-proof-concentration-and-retention"
    title: "Named Customer Proof, Offtake Commitments, and Concentration Risks"
    body: "Public proof of customer adoption includes cell-level validation by Farasis Energy, which demonstrated 330 Wh/kg and a 25% energy boost across 1,000+ cycles, and Sionic Energy, which targeted 400 Wh/kg using a 100% SCC55 anode formulation. Furthermore, Group14 secured agreements with eight leading EV and consumer electronics cell makers totaling more than $750M in offtake commitments. Despite these named proof points, substantial diligence gaps persist regarding revenue conversion and customer concentration. The reported $750M comprises non-binding or volume-contingent offtake agreements rather than recognized sales, while specific net revenue retention (NRR), gross renewal rates, and OEM customer concentration percentages remain entirely undisclosed. In addition, falling synthetic graphite prices below $10/kg test customer willingness to pay an estimated $50/kg premium for silicon anodes during EV market pullbacks."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU015"
    tableRefs:
      - "TU003"
