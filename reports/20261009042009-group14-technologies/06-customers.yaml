callouts:
  - calloutType: "risk"
    title: "The Offtake Conversion Gap and Synthetic Graphite Headwinds"
    body: "While Group14 has assembled $750M+ in offtake agreements across eight leading cell manufacturers, these agreements represent procurement intent rather than guaranteed purchase contracts. With synthetic graphite trading below $10/kg and electric vehicle sales growth cooling, battery makers face diminished margin tolerance for an estimated $50/kg silicon premium, compounding the revenue risk of delayed domestic factory ramp-up."
    claimRefs:
      - "CU007"
      - "CU012"
      - "CU014"
  - calloutType: "insight"
    title: "Geographic Realignment Toward Asian Manufacturing Hubs"
    body: "Group14's acquisition of 100% ownership in the Sangju, South Korea factory from SK Inc. marks a pivotal geographic realignment. With BAM-2 in Moses Lake delayed by over a year and hit by furloughs, Group14's commercial customer delivery engine has effectively shifted to Korea, allowing the company to supply over 100 battery customers while domestic U.S. manufacturing remains paused at 90% construction."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU013"
      - "CU014"
