evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-and-revenue-metrics
    missingEvidence: >-
      Audited financial statements, precise Series D post-money valuation, and GAAP revenue or commercial shipment gross
      margin figures.
    whyItMatters: >-
      Without official company disclosure or audited financials, underwriting depends on secondary market pricing
      estimates and undisclosed commercial agreement terms.
    diligencePath: >-
      Request confidential disclosure schedule, audited financial statements, and customer shipment billing records
      under NDA during formal diligence.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map-completeness
    missingEvidence: >-
      Full capitalization table detailing exact ownership percentages, liquidation preferences, and secondary
      transaction volumes across all syndicate participants.
    whyItMatters: >-
      Public announcements highlight lead strategic and growth investors but omit smaller syndicate participants, option
      pool allocations, and exact voting thresholds.
    diligencePath: Review certified capitalization table and investor rights agreements during confirmatory diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing gap
    missingEvidence: >-
      Independent silicon-carbon anode demand, price, and volume estimates with a consistent period, geography,
      chemistry boundary, and methodology.
    whyItMatters: >-
      Without a compatible denominator, Group14 capacity and deployment claims cannot be translated into dollar TAM,
      SAM, SOM, CAGR, or market share.
    diligencePath: >-
      Obtain dated third-party anode-material forecasts and reconcile tonnes, GWh, silicon loading, price per kilogram,
      geography, and application assumptions.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial conversion
    missingEvidence: >-
      Customer-level qualification status, binding offtake, pricing, contracted volume, utilization, concentration,
      cancellations, and recognized revenue.
    whyItMatters: >-
      Public customer and device counts do not show how much demand is qualified, contracted, delivered, or economically
      attractive.
    diligencePath: >-
      Review the customer pipeline by program, signed supply agreements, shipment records, backlog, utilization reports,
      pricing schedules, and revenue cohorts.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: execution timing
    missingEvidence: >-
      Current BAM-2 commissioning date, qualified output, yield, utilization, and commercial shipment status as of the
      2026-10-09 run date.
    whyItMatters: >-
      A 2025 report described an early-2026 target, but the assigned evidence does not independently establish whether
      production started or reached qualified scale.
    diligencePath: >-
      Obtain commissioning certificates, monthly output and yield records, customer acceptance data, and current plant
      operating disclosures.
    relatedQuestionRefs:
      - QM006
      - QM008
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Matched price-per-kilogram quotations, volume tiers, qualification charges, rebates, and realized contract terms
      for Group14 and direct peers.
    whyItMatters: >-
      Without comparable commercial terms, the analysis cannot test whether technical gains support a premium or whether
      graphite parity is achievable.
    diligencePath: >-
      Request redacted customer quotations and contracts at matched specification, geography, volume, and delivery
      terms.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitor-coverage
    missingEvidence: >-
      Current primary evidence on Sila, OneD, named Chinese silicon-carbon suppliers, graphite incumbents, and customer
      captive-development programs.
    whyItMatters: >-
      The assigned pool is centered on Group14 and cannot establish an exhaustive market roster or symmetric capability
      comparison.
    diligencePath: >-
      Obtain current competitor technical documents, facility records, customer qualification evidence, and matched
      third-party benchmarks.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP003
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level qualification duration, dual-sourcing rights, renewal behavior, minimum purchase commitments, and
      supplier-change costs.
    whyItMatters: >-
      Public compatibility and customer-count claims do not quantify lock-in, multi-homing, distribution power, or
      concentration.
    diligencePath: >-
      Review qualification files and contracts for the largest customers, then interview procurement and
      cell-engineering teams.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
