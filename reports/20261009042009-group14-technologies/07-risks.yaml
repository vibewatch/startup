callouts:
  - calloutType: "risk"
    title: "Do not equate financing with de-risked execution"
    body: >-
      The $463 million Series D is a financing event, not evidence of cash runway, completed
      commissioning, economic yield, or contracted utilization. Require plant-level milestones and
      audited liquidity before treating capital availability as mitigation of BAM-2 execution risk.
    claimRefs:
      - "CR001"
      - "CR003"
