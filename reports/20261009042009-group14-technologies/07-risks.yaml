company:
  name: "Group14 Technologies"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    The clearest evidenced risk is execution: independent reporting documented a more-than-one-year
    BAM-2 production delay and an undisclosed workforce reduction, while current factory yield,
    utilization, and customer-qualified output remain undisclosed. Fresh equity and full control of
    the Korean plant are mitigants, but they do not resolve policy, concentration, IP-enforcement,
    or financial-model gaps.
sections:
  - id: "scale-up-and-operating-execution"
    title: "Scale-up and operating execution"
    body: >-
      BAM-2 schedule execution is the leading observable risk. GeekWire reported in August 2025 that
      the Moses Lake production start had moved from late 2024 to early 2026 and that Group14 had
      made an undisclosed workforce reduction the prior month. The $463 million Series D reported by
      Mercom and GeekWire increases financing capacity for the ramp, but funding raised is not the
      same as cash available, and the assigned evidence does not disclose cash, burn, remaining
      construction cost, yield, utilization, or customer-qualified output. Public capacity
      descriptions also use non-comparable units and vintages: the current company home page says
      10 GWh is online and describes a 20 GWh Washington factory, while Battery-Tech Network listed
      4,000 tonnes for Moses Lake with 2025 completion. Those figures should not be converted or
      reconciled without management data. The investment thesis should break if diligence cannot
      demonstrate sustained customer-qualified BAM-2 output, acceptable yield, and a funded path to
      contracted utilization after the previously reported early-2026 target.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "ownership-partners-and-demand"
    title: "Ownership, partners, and demand concentration"
    body: >-
      The acquisition of SK Inc.'s 75% interest gave Group14 full ownership of the Sangju venture
      while SK also led the Series D. Full control may simplify operating decisions, but it also
      places plant economics and transition execution directly with Group14; the assigned sources do
      not disclose purchase consideration, liabilities assumed, or BAM-3 yield and utilization.
      GeekWire reported that BAM-3 was shipping material for customer testing in August 2025, which
      is evidence of activity rather than proof of recurring commercial demand. Likewise, the
      company's statement that it serves more than 150 customers and GeekWire's report of 150
      sign-ups do not disclose payer concentration, production-versus-pilot mix, retention, volumes,
      or contracted revenue. The Forge Nano collaboration is evidence of a domestic integration
      route, not proof that a multi-party domestic supply chain is qualified at scale. Diligence
      should treat a loss of an anchor qualification program, delayed conversion from testing to
      production, or sustained underutilization at Sangju as thesis-break signals.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR008"
      - "CR009"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "policy-legal-and-ip-exposure"
    title: "Policy, legal, and IP exposure"
    body: >-
      Public-policy support is material to the disclosed build-out history but its current
      availability is not established by this pool. Wikipedia records company announcements of a
      $100 million Department of Energy award in 2022 and selection for negotiation of an award of
      up to $200 million in 2024; GeekWire later described federal clean-tech cuts, tariff
      uncertainty, and a slowing EV-market outlook as headwinds. These are different funding stages
      and periods, so neither amount should be treated as current cash or an undrawn commitment
      without award documents. On IP, a March 2026 company release said Group14 had surpassed 170
      issued patent matters, while the current company home page says it is supported by more than
      200 patents. The metric names and dates differ and should remain separate. The company also
      publicized a U.S. International Trade Commission public-interest statement, indicating that
      enforcement and trade protection are active concerns. None of the assigned sources is a court,
      regulator, patent-office, environmental, safety, or incident record; therefore litigation,
      licensing, safety, privacy, and enforcement outcomes remain unverified rather than absent.
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "monitoring-and-investment-kill-criteria"
    title: "Monitoring and investment kill criteria"
    body: >-
      Risk monitoring should emphasize evidence that can change the underwriting view rather than
      unsupported point estimates. For operations, request monthly construction completion,
      commissioning, yield, scrap, qualification, shipment, and contracted-utilization data for each
      plant, reconciled in both tonnes and GWh. For finance, obtain audited cash, restricted cash,
      grant receivables, remaining capital expenditure, burn, working capital, and covenant data;
      the Series D proceeds alone cannot establish runway. For commercial durability, require
      customer-level production status, concentration, renewal or repeat-order evidence, and
      cancellation rights. For legal and policy exposure, verify executed DOE award terms, current
      disbursement and clawback conditions, material patents and freedom-to-operate opinions,
      environmental and safety permits, litigation, incidents, and insurance. Kill criteria are:
      failure to evidence customer-qualified production at economic yield; loss or material delay of
      funding essential to complete a plant; an adverse IP or regulatory outcome that blocks key
      markets; or customer concentration and cancellations that leave disclosed capacity without
      contracted demand. Where the assigned evidence cannot quantify likelihood, the registers mark
      the risk unscored instead of implying false precision.
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR004"
      - "CR008"
      - "CR010"
      - "CR013"
