        title: Capability, Scale, and Execution
        blocks:
          - type: paragraph
            body: >-
              Group14 frames SCC55 as a direct replacement for graphite and says existing lithium-ion lines need no
              retooling. Its homepage reports a 10 GWh factory in Sangju, South Korea as online and claims more than 25
              million enabled devices, providing a stronger commercialization signal than the assigned evidence offers
              for Sila or OneD. The advantage is not yet uniform across regions. BAM-2's expected production date moved
