            tableRef: TO002
            claimRefs:
              - CO001
              - CO012
      - number: '1.3'
        title: Capitalization Trajectory, Strategic Syndicates, and Private Valuation Dynamics
        blocks:
          - type: paragraph
            body: >-
              Group14 has completed four primary institutional and strategic equity rounds, raising an aggregate of
              $1.11B in paid-in capital alongside substantial nondilutive federal grant commitments. Its early equity
              financing encompassed an $18M Series A round led by Amperex Technology Limited (ATL) and a $17M Series B
              round led by South Korean conglomerate SK Inc. In May 2022, Group14 secured a $400M initial Series C
              tranche (subsequently expanded to $614M) led by German automaker Porsche AG with participation from OMERS
              Capital Markets, Decarbonization Partners, and Microsoft Climate Innovation Fund. In August 2025, Group14
              closed a $463M Series D round led by SK Inc., simultaneous with buying out SK's 75% equity interest in
              their South Korean battery active materials plant. Although private secondary marketplaces such as
              EquityZen actively facilitate pre-IPO liquidity, the company has refrained from disclosing an official
              Series D post-money valuation, leaving third-party valuation models reliant on secondary market
              indicators.
