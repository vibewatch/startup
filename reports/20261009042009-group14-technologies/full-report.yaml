          - type: paragraph
            body: >-
              The available pool supports operating proxies rather than a dollar market model. Group14's current
              homepage claims 10 GWh online and more than 25 million devices enabled, and separately lists 10 GWh in
              South Korea, 20 GWh in Washington State, and up to 1,000 tonnes of silane capacity in Germany. Its
              resources page claims more than 150 customers. These figures have different units, denominators, and
