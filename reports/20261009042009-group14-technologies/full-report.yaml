      - number: '4.2'
        title: Pricing and Unit-Economics Disclosure
        blocks:
          - type: paragraph
            body: >-
              Public financial disclosure is too thin to calculate unit economics. LeadIQ estimates annual revenue at
              $100 million to $250 million as of August 2026, but the methodology is not provided and the range is
              neither audited revenue nor company guidance. No assigned source states SCC55 list pricing, realized price
