  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              The public landscape spans direct silicon-anode specialists, incumbent graphite, scaled Chinese
              silicon-carbon suppliers, and customer-controlled development. The assigned evidence names Sila and OneD
              as the closest regional peers: in June 2025, GeekWire reported that Sila was commissioning a Moses Lake
