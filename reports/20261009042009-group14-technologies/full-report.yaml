        - >-
          BAM-2 commissions cleanly in early 2026; Sangju BAM-3 achieves sustained contract off-take; silane supply
          secured
        - Premium specialty materials multiple reflecting high revenue expansion and potential public listing readiness
        - Rapid technological commoditization by emerging silicon-carbon peers or synthetic graphite subsidies
