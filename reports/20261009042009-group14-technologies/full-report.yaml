  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is silicon-carbon anode active material that can replace graphite in lithium-ion
              cell manufacturing. Group14 describes SCC55 as serving electric mobility, consumer devices, data centers,
              and electric aviation, but those downstream applications are demand adjacencies rather than revenue that
              can be counted in Group14's market. Cell manufacturing, packs, vehicles, devices, cathodes, electrolytes,
              and charging infrastructure are excluded unless evidence shows Group14 captures that spend. Upstream
              silane is a manufacturing input, while natural and synthetic graphite and cell makers' internal silicon
              formulations are substitutes. This boundary prevents broad EV or AI infrastructure spending from being
              mislabeled as the company's addressable anode-material market.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
