  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Workflow / Baseline
      - Company Solution
      - Measurable Benefit
      - Technical Limitation / Trade-off
    rows:
      - - EV Cell Energy Density Optimization
        - Traditional natural/synthetic graphite anodes (theoretical capacity ~372 mAh/g)
        - Drop-in SCC55 composite powder blended or substituted into existing slurry lines
        - Up to 50% increase in battery pack capacity; 1 ton SCC55 replaces ~5 tons graphite
        - Requires binder and electrolyte additive tuning; premium raw material cost per kilogram
      - - Extreme Fast Charging (XFC)
        - Graphite anode limits charge rates to 0.5C-2C to avoid lithium plating and dendrite growth
        - Nano-silicon carbon structure supports rapid ionic diffusion without plating risk
        - Customer cell tests report 0-100% recharge in 90 seconds (50x traditional Li-ion)
        - Thermal management must handle elevated heat generation during extreme fast-charge cycles
      - - Consumer Electronics Volumetric Density
        - Graphite-dominant prismatic and pouch cells limiting device run-time and slimness
        - SCC55 integrated into high-density cells for smartphones and wearables
        - Over 43% boost in cell volumetric energy density; deployed in 25M+ devices
        - High-silicon formulations require strict cell pressure packaging to maintain contact over lifespan
      - - Critical Mineral Supply Chain De-risking
        - Over 90% dependence on Chinese natural and synthetic graphite supply
        - Localized North American and South Korean silicon-carbon manufacturing footprint
        - Drastic reduction in graphite dependency; alignment with domestic content procurement
        - Creates upstream dependency on localized silane gas precursor synthesis and handling infrastructure
    notes: >-
      Baseline comparisons reflect conventional graphite anode standards versus customer-validated test results reported
      by Group14, Molicel, and Sionic Energy.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE007
      - CE008
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Role & Mechanism
      - Dependency
      - Identified Risk & Mitigant
    rows:
      - - Upstream Silane Gas Precursor (SiH4)
        - Source material for chemical vapor deposition of nano-silicon into carbon pores
        - Schmid Silicon plant in Germany; planned 7,200 mt Moses Lake plant; merchant suppliers
        - >-
          Global silane supply concentrated in China; mitigated by acquiring Schmid and securing $200M DOE grant
          negotiation
      - - Porous Carbon Scaffold Matrix
        - Engineered structural scaffold with internal pores designed to absorb silicon expansion
        - High-purity organic polymer precursors and controlled carbonization thermal reactors
        - Thermal process consistency risk; mitigated by EnerG2 legacy patent estate and 10+ years synthesis know-how
      - - Chemical Vapor Deposition (CVD)
        - In-situ deposition of non-crystalline amorphous silicon into nano-porous carbon matrix
        - Specialized CVD fluid bed reactors operating under tight temperature and gas pressure control
        - >-
          Precursor conversion efficiency and reactor fouling; mitigated by proprietary reactor designs protected by
          patents
      - - External Surface Passivation / Coating
        - Forms stable interface preventing direct liquid electrolyte contact with active silicon
        - Surface treatment chemicals and post-processing coating equipment
        - First-cycle coulombic efficiency losses; mitigated by tuned protective surface barrier
      - - Cell Integration & Formulation
        - Electrode formulation, conductive carbon blending, water-based or solvent-based binder systems
        - Customer battery engineering teams and compatibility with LFP, LMFP, and high-nickel cathodes
        - >-
          12-24 month customer qualification cycles; mitigated by joint validation programs with ATL, Molicel, and
          Porsche
    notes: Operating architecture mapped from public patent disclosures, technical papers, and regulatory filings.
