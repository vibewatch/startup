              - CU005
              - CU006
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Offtake Conversion Gap and Synthetic Graphite Headwinds
            body: >-
              While Group14 has assembled $750M+ in offtake agreements across eight leading cell manufacturers, these
              agreements represent procurement intent rather than guaranteed purchase contracts. With synthetic graphite
              trading below $10/kg and electric vehicle sales growth cooling, battery makers face diminished margin
              tolerance for an estimated $50/kg silicon premium, compounding the revenue risk of delayed domestic
              factory ramp-up.
            calloutType: risk
            claimRefs:
              - CU007
              - CU012
              - CU014
          - type: callout
            title: Geographic Realignment Toward Asian Manufacturing Hubs
            body: >-
              Group14's acquisition of 100% ownership in the Sangju, South Korea factory from SK Inc. marks a pivotal
              geographic realignment. With BAM-2 in Moses Lake delayed by over a year and hit by furloughs, Group14's
              commercial customer delivery engine has effectively shifted to Korea, allowing the company to supply over
              100 battery customers while domestic U.S. manufacturing remains paused at 90% construction.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Scale-up and operating execution
        blocks:
          - type: paragraph
            body: >-
              BAM-2 schedule execution is the leading observable risk. GeekWire reported in August 2025 that the Moses
              Lake production start had moved from late 2024 to early 2026 and that Group14 had made an undisclosed
              workforce reduction the prior month. The $463 million Series D reported by Mercom and GeekWire increases
              financing capacity for the ramp, but funding raised is not the same as cash available, and the assigned
              evidence does not disclose cash, burn, remaining construction cost, yield, utilization, or
              customer-qualified output. Public capacity descriptions also use non-comparable units and vintages: the
              current company home page says 10 GWh is online and describes a 20 GWh Washington factory, while
              Battery-Tech Network listed 4,000 tonnes for Moses Lake with 2025 completion. Those figures should not be
              converted or reconciled without management data. The investment thesis should break if diligence cannot
              demonstrate sustained customer-qualified BAM-2 output, acceptable yield, and a funded path to contracted
              utilization after the previously reported early-2026 target.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
