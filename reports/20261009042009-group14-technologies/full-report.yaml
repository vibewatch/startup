  - id: FU001
    title: Customer Adoption Lifecycle and Expansion Journey for SCC55
    type: journey-map
    summary: >-
      Visualizes the structured progression of cell manufacturers and automotive OEMs through testing, factory
      qualification, and volume expansion, emphasizing friction points at BAM-2.
    data:
      items:
        - label: 'Stage 1: Initial Screening & Sampling'
          touchpoints:
            - Bench-scale material evaluation against standard graphite baselines
            - Cycle life verification targeting 1,500 to 3,000 cycles
            - Slurry compatibility testing on existing roll-to-roll equipment
        - label: 'Stage 2: Cell-Level Prototyping'
          touchpoints:
            - Pouch and cylindrical cell prototyping (e.g. Farasis 330 Wh/kg, Sionic 400 Wh/kg)
            - Drop-in blending calibration (5% to 100% silicon loading)
            - Third-party validation of fast charge rates below 10 minutes
        - label: 'Stage 3: Factory Qualification & Offtake'
          touchpoints:
            - Multi-year offtake contract negotiation ($750M+ aggregate across 8 makers)
            - Supply qualification from BAM-3 Sangju facility (100+ active customers)
            - Supply chain auditing against Western IP and trade secret defenses
        - label: 'Stage 4: Volume Production Ramp'
          touchpoints:
            - Commercial cell supply into consumer electronics (25M+ devices enabled)
            - Automotive pack integration with strategic leads such as Porsche AG
            - Delivering tonnage from wholly owned Sangju factory
        - label: 'Stage 5: Domestic Scale & Supply Chain Gating'
          touchpoints:
            - 'Gating factor: overcoming BAM-2 Moses Lake construction pauses and furloughs'
            - 'Economic friction: competing against synthetic graphite priced below $10/kg'
            - Resolving silane feed gas and domestic US manufacturing incentives
        - label: 'Stage 6: Long-Term Fleet Expansion & Retention'
          touchpoints:
            - Monitoring multi-year cohort renewals and NRR metrics
            - Expanding into stationary grid storage and dynamic AI data center backup
            - Converting preliminary offtake letters of intent into firm binding purchase orders
    approximationNotes: >-
      Journey stages represent the standardized commercialization path documented across automotive and battery
      materials qualification cycles.
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU007
      - CU008
      - CU011
      - CU014
