      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Group14's adoption thesis rests on higher energy density, faster charging, broad format and chemistry
              compatibility, and direct use in existing lithium-ion production equipment. Those attributes can lower
              retooling friction, but they do not remove customer validation, capital execution, or competitive timing
              risk. The company's own hiring disclosures show that large capital projects require explicit scope,
              schedule, budget, and risk control. Its curated news page also highlights Chinese manufacturers deploying
              silicon-carbon technology at scale, while GeekWire reported clean-tech policy cuts, tariff uncertainty,
              slower EV projections, layoffs, and a more-than-one-year BAM-2 delay. Demand signals are therefore not
              interchangeable with qualified orders, utilization, or durable market share.
