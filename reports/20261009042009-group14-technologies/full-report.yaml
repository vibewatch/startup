      - number: '3.3'
        title: Commercial Terms and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Public pricing is not comparable across the reviewed set. None of the assigned Group14 pages discloses a
              list price, price per kilogram, realized contract price, discount schedule, minimum order, or
              qualification charge; the assigned independent articles likewise do not provide peer pricing. Procurement
