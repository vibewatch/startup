      - - Base Case
        - >-
          BAM-3 operates as principal revenue driver while BAM-2 ramps gradually through 2026 with modest initial
          margins
        - Valuation remains anchored to private Series D levels with flat to moderate value accretion
        - Working capital strain from delayed domestic volume and sustained clean-tech macro headwinds
