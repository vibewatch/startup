  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Group14 Technologies produces SCC55®, an engineered silicon-carbon composite powder developed to directly
              replace or blend with synthetic and natural graphite in commercial lithium-ion battery anodes. In standard
              cell manufacturing workflows, adopting pure silicon anodes historically triggered catastrophic mechanical
              failure because elemental silicon expands up to 300 percent during lithiation, pulverizing particles and
              rapidly degrading the solid electrolyte interphase (SEI). Group14 circumvents this degradation by creating
              an amorphous nano-silicon structure embedded within an engineered, rigid porous carbon scaffold. This
              carbon framework mechanically accommodates the volumetric lithiation strain internally while maintaining
              electrical conductivity and establishing a stable external SEI layer. Because SCC55 functions as a
              physical drop-in powder replacement, battery cell manufacturers integrate the material directly into
              existing slurry preparation, slot-die coating, calendering, and winding or stacking processes without
              requiring expensive capital retooling or new cell assembly lines. The resulting drop-in chemistry provides
              up to a 50 percent increase in battery pack energy capacity and enables extreme fast charging (XFC),
              allowing electric mobility and consumer device cells to recharge from 0 to 100 percent in as little as 90
              seconds while sustaining cycle durability across 1,000 to 3,000 charge-discharge cycles.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
      - number: '5.2'
        title: Global Manufacturing Network and Precursor Supply Integration
        blocks:
          - type: paragraph
            body: >-
              Scaling commercial production of silicon-carbon battery materials requires massive, uninterrupted access
              to silane gas (SiH4), the essential gaseous precursor used to deposit nano-silicon into porous carbon
              scaffolds. China historically controls more than 90 percent of global processed anode graphite supply and
              represents the predominant global producer of merchant silane gas, exposing Western battery manufacturing
              lines to severe geopolitical supply disruptions. To establish supply chain resilience and eliminate
              single-point import risks, Group14 operates a multi-facility Battery Active Materials (BAM) manufacturing
              footprint coupled with upstream chemical synthesis. Commercial-scale production began at the BAM-1 plant
              in Woodinville, Washington, operating at ton-scale since 2021. To serve high-volume Asian battery makers,
              Group14 partnered with SK materials in a joint venture to build a 2,000 metric ton per year (approximately
              10 GWh) EV-scale facility in Sangju, South Korea, which has achieved full commercial commissioning. In the
              United States, Group14 is constructing BAM-2 in Moses Lake, Washington, planned for 4,000 metric tons (20
              GWh) of initial annual capacity. To supply these facilities without foreign dependence, Group14 acquired
              German silane manufacturer Schmid Silicon Technology Holding and secured selection by the U.S. Department
              of Energy for an award negotiation of up to $200 million under the Bipartisan Infrastructure Law to
              construct a 7,200 metric ton domestic silane plant in Moses Lake, intended to co-locate chemical precursor
              delivery with material synthesis.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE008
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
              - CE008
      - number: '5.3'
        title: Technology Architecture, IP Protection, and Operating Risks
        blocks:
          - type: paragraph
            body: >-
              Group14's technological moat is fortified by an extensive global patent portfolio protecting its
              dual-stage manufacturing synthesis and underlying material composite structures. Originally spun out from
              porous carbon specialist EnerG2 in 2015, the company controls over 170 to 200 issued patents across key
              battery manufacturing jurisdictions including the United States, Europe, South Korea, Japan, and China.
              The proprietary synthesis involves thermal carbonization of tuned organic precursors into porous carbon
              matrices followed by chemical vapor deposition (CVD) of silane gas. However, despite strong technological
              maturity and validated shipments to over 100 to 160 global customers, commercial deployment faces material
              technical and operational dependencies. The Moses Lake BAM-2 expansion and domestic silane synthesis
              require extensive capital expenditure, timely equipment deliveries, and federal grant finalization.
              Furthermore, because Group14 produces intermediate bulk active powders rather than completed battery
              cells, cell qualification testing cycles can span 12 to 24 months across varying customer chemistries
              including high-nickel, LFP, and LMFP formulations. The company maintains no public software developer API
              ecosystem, operating strictly as an advanced materials enterprise with traditional enterprise customer
              testing protocols.
            claimRefs:
              - CE009
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE011
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Drop-in Compatibility Eliminates Gigafactory Retooling Barriers
            body: >-
              The core commercial strength of SCC55 is its drop-in compatibility with legacy lithium-ion battery
              manufacturing equipment. Cell makers can substitute SCC55 into standard slurry and slot-die coating
              processes, achieving up to 50 percent capacity improvements without multi-billion-dollar factory
              overhauls.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
          - type: callout
            title: Upstream Silane Precursor Dependency Poses Bottleneck Risk
            body: >-
              Producing thousands of tons of silicon-carbon composite requires commensurate quantities of hazardous
              silane gas. Until Group14 commissions its domestic Moses Lake silane factory and restarts Schmid Silicon
              in Germany, commercial scaling remains dependent on merchant silane supply chains historically dominated
              by Chinese producers.
            calloutType: risk
            claimRefs:
              - CE003
              - CE008
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Dynamics Across Mobility and Devices
        blocks:
          - type: paragraph
            body: >-
              Group14 segments its customer base across electric mobility, consumer electronics, electric aviation, and
              emerging data center power applications. In electric mobility, strategic automaker partners such as
              Porsche AG and cell manufacturers qualify SCC55 as a direct drop-in replacement to boost pack energy
              density by up to 50% and reduce vehicle charging times below 10 minutes. In portable devices and consumer
              electronics, cell manufacturers including Amperex Technology Limited (ATL) and Sionic Energy evaluate or
              deploy silicon-carbon formulations to achieve thinner form factors and elevated volumetric energy storage,
              reaching 25+ million devices enabled with SCC55. Across all verticals, the economic buyer is typically an
              automotive OEM or battery cell producer seeking energy density improvements, while the technical user is
              the cell engineering team requiring drop-in compatibility on standard slurry and coating lines without
              factory retooling.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU011
