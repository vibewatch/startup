              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Policy, legal, and IP exposure
        blocks:
          - type: paragraph
            body: >-
              Public-policy support is material to the disclosed build-out history but its current availability is not
              established by this pool. Wikipedia records company announcements of a $100 million Department of Energy
              award in 2022 and selection for negotiation of an award of up to $200 million in 2024; GeekWire later
              described federal clean-tech cuts, tariff uncertainty, and a slowing EV-market outlook as headwinds. These
              are different funding stages and periods, so neither amount should be treated as current cash or an
              undrawn commitment without award documents. On IP, a March 2026 company release said Group14 had surpassed
              170 issued patent matters, while the current company home page says it is supported by more than 200
              patents. The metric names and dates differ and should remain separate. The company also publicized a U.S.
              International Trade Commission public-interest statement, indicating that enforcement and trade protection
              are active concerns. None of the assigned sources is a court, regulator, patent-office, environmental,
              safety, or incident record; therefore litigation, licensing, safety, privacy, and enforcement outcomes
              remain unverified rather than absent.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Monitoring and investment kill criteria
        blocks:
          - type: paragraph
            body: >-
              Risk monitoring should emphasize evidence that can change the underwriting view rather than unsupported
              point estimates. For operations, request monthly construction completion, commissioning, yield, scrap,
              qualification, shipment, and contracted-utilization data for each plant, reconciled in both tonnes and
              GWh. For finance, obtain audited cash, restricted cash, grant receivables, remaining capital expenditure,
              burn, working capital, and covenant data; the Series D proceeds alone cannot establish runway. For
              commercial durability, require customer-level production status, concentration, renewal or repeat-order
              evidence, and cancellation rights. For legal and policy exposure, verify executed DOE award terms, current
              disbursement and clawback conditions, material patents and freedom-to-operate opinions, environmental and
              safety permits, litigation, incidents, and insurance. Kill criteria are: failure to evidence
              customer-qualified production at economic yield; loss or material delay of funding essential to complete a
              plant; an adverse IP or regulatory outcome that blocks key markets; or customer concentration and
              cancellations that leave disclosed capacity without contracted demand. Where the assigned evidence cannot
              quantify likelihood, the registers mark the risk unscored instead of implying false precision.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR010
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate financing with de-risked execution
            body: >-
              The $463 million Series D is a financing event, not evidence of cash runway, completed commissioning,
              economic yield, or contracted utilization. Require plant-level milestones and audited liquidity before
              treating capital availability as mitigation of BAM-2 execution risk.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Group14 Technologies rests on its market position as a commercial supplier
              of SCC55 silicon-carbon composite battery materials [CV001]. Group14's proprietary material functions as a
              drop-in replacement that boosts lithium-ion battery energy density significantly compared to traditional
              graphite while cutting fast-charging durations [CV006, CV008]. Commercial validation is demonstrated by
              strategic backing from SK Inc., Porsche Investments, and ATL, with silicon battery material shipping from
              its joint-venture manufacturing asset to global battery customers [CV001, CV007, CV009]. However, the
              anti-thesis is driven by execution friction in scaling capital-intensive domestic manufacturing:
              commercial commissioning at the Moses Lake BAM-2 facility slipped past late 2024 into early 2026,
              workforce reductions were initiated in Washington state, and clean-tech policy headwinds create
              macroeconomic uncertainty [CV004, CV005, CV010]. Without verified long-term customer margins and sustained
              unit profitability, aggressive valuation expansion faces substantial headwinds [CV012].
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Group14 has established a well-funded capitalization structure, securing over $1.1B in cumulative capital
              since inception in 2015 [CV002, CV003, CV011]. The pivotal August 20, 2025 Series D financing round
              delivered $463M in fresh equity led by SK Inc. with continued participation from Porsche Investments,
              Microsoft Climate Innovation Fund, OMERS, and Decarbonization Partners [CV001, CV007, CV013]. Crucially,
              Group14 utilized transaction proceeds to acquire the remaining 75% stake in the Sangju, South Korea BAM-3
              manufacturing facility from SK Inc., establishing 100% direct operational ownership over its primary Asian
              manufacturing base [CV001, CV009, CV014]. Despite this strategic milestone, exact post-money equity
              valuation was withheld across official announcements, while historical secondary marks and third-party
              tracker databases register differing historical rounds and unverified price marks [CV002, CV003, CV015].
              In the absence of audited revenue run-rates, gross margin disclosures, and firm off-take contract pricing,
              public valuation multiples cannot be reliably imputed without substantial estimation risk [CV012, CV015].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.3'
        title: Scenario Analysis, Exit Pathways, and Underwriting Decision
        blocks:
          - type: paragraph
            body: >-
              Evaluating Group14's underwriting profile requires balancing its technological head start against
              operational execution and supply security [CV006, CV008, CV010]. In a bull scenario, BAM-3 achieves high
              utilization across Asian cell partners, BAM-2 commissioning completes on schedule in early 2026, and
              federal silane infrastructure initiatives secure precursor domestic supply, justifying a premium multiple
              upon potential public liquidity [CV001, CV005, CV009]. In a bear scenario, extended delay at BAM-2, trade
              restrictions or precursor tariffs, and heightened competition from alternative silicon anode platforms
              erode pricing power, creating down-round risk on subsequent equity financings [CV004, CV005, CV010].
              Weighing these factors yields an overall recommendation to track the asset with a high risk rating and
              fair valuation stance, reserving underwriting commitment until verified commercial off-take volumes and
              plant economics are independently audited [CV004, CV012].
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV010
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Discipline Over Speculation in Advanced Battery Materials
            body: >-
              While Group14's $463M Series D round and Asian manufacturing control place it ahead of most pre-revenue
              clean-tech peers, underwriting discipline dictates a track recommendation. Investors should await
              operational proof of commercial-scale yields and audited production economics at Moses Lake before
              deploying fresh growth capital.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV012
