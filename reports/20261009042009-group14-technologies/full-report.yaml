        title: Buyers, Users, Payers, and Qualification
        blocks:
          - type: paragraph
            body: >-
              Group14's careers disclosures identify automotive OEMs, consumer-electronics leaders, and global cell
              manufacturers as commercial partners, but they do not establish a single payer across programs. A cell
              maker may procure anode material while an OEM or device brand specifies performance and approves
