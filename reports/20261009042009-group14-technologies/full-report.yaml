companyProfile:
  summary: >-
    Group14 Technologies is a privately held advanced battery-materials company that develops and manufactures SCC55, a
    silicon-carbon composite anode material intended to replace or supplement graphite in lithium-ion cells. The company
    was founded in 2015 as a spin-out from EnerG2, is headquartered in Woodinville, Washington, and now pairs U.S.
    development with commercial manufacturing in South Korea. Its public posture is that of a scaled materials supplier
    rather than a cell maker: it sells into EV, consumer-electronics, and other lithium-ion programs through cell
    manufacturers and OEMs, while still carrying meaningful execution risk around domestic expansion and public
    disclosure.
