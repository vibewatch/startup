              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: Ownership, partners, and demand concentration
        blocks:
          - type: paragraph
            body: >-
              The acquisition of SK Inc.'s 75% interest gave Group14 full ownership of the Sangju venture while SK also
              led the Series D. Full control may simplify operating decisions, but it also places plant economics and
              transition execution directly with Group14; the assigned sources do not disclose purchase consideration,
              liabilities assumed, or BAM-3 yield and utilization. GeekWire reported that BAM-3 was shipping material
              for customer testing in August 2025, which is evidence of activity rather than proof of recurring
              commercial demand. Likewise, the company's statement that it serves more than 150 customers and GeekWire's
              report of 150 sign-ups do not disclose payer concentration, production-versus-pilot mix, retention,
              volumes, or contracted revenue. The Forge Nano collaboration is evidence of a domestic integration route,
              not proof that a multi-party domestic supply chain is qualified at scale. Diligence should treat a loss of
              an anchor qualification program, delayed conversion from testing to production, or sustained
              underutilization at Sangju as thesis-break signals.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
