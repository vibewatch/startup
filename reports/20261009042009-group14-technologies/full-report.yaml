  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              The evidenced revenue mechanism is the sale and delivery of SCC55 battery material to cell manufacturers.
              Group14 announced commercial deliveries from BAM-1 to ATL in 2023, while later disclosures describe more
              than 150 customers and shipments from BAM-3. Those signals establish customer engagement and physical
              product movement, but they do not establish recognized revenue: GeekWire described BAM-3 material as
