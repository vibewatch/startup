chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Core Silicon-Carbon Technology
        blocks:
          - type: paragraph
            body: >-
              Group14 Technologies, Inc. is a materials science and battery storage technology company founded in 2015
              and headquartered in Woodinville, Washington. The company was founded by Rick Luebbe, Dr. Rick Costantino,
              and Aaron Feaver as a spin-out from EnerG2, an advanced carbon materials enterprise acquired by BASF in
              2016. Group14 was formed to engineer high-capacity composite materials capable of replacing conventional
              graphite anodes in rechargeable lithium-ion batteries. The company's core commercial offering is SCC55, a
              micron-scale silicon-carbon composite engineered to mitigate silicon's historic volumetric expansion while
              enabling up to 50% volumetric energy density gains and sub-ten-minute extreme fast charging. Group14
              operates as an input materials supplier selling directly to lithium-ion cell manufacturers across electric
              mobility, consumer electronics, and grid-scale data center energy storage markets.
            claimRefs:
              - CO001
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO010
              - CO012
              - CO013
      - number: '1.2'
        title: Executive Leadership, Technical Pedigree, and Operational Governance
        blocks:
          - type: paragraph
            body: >-
              Group14 is governed by an executive management team combining serial clean-technology entrepreneurship,
              advanced materials synthesis pedigree, and public capital markets governance. Chief Executive Officer and
              co-founder Rick Luebbe previously led EnerG2 from inception through its trade sale to BASF, providing
              seasoned perspective on advanced material scaling and commercialization. Chief Technology Officer and
              co-founder Dr. Rick Costantino brings over two decades of biochemical and chemical engineering product
              development from MIT, Alkermes, Genentech, and EnerG2, holding foundational patents covering the synthesis
              of SCC55. The executive bench is reinforced by Chief Financial Officer Mike Willis, who previously managed
              public markets capital structure at Nasdaq-listed Gevo and Westport Fuel Systems, and Dr. Kiseon Park,
              former CEO of SK Materials Group14, who oversees Asian manufacturing operations. Key-person dependency
              remains concentrated in the two co-founders who control proprietary technical architecture and strategic
              vision.
            claimRefs:
              - CO001
              - CO012
