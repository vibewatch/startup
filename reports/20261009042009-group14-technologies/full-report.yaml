      - number: '6.2'
        title: Commercial Adoption Trajectory, Factory Ramp, and Qualification Friction
        blocks:
          - type: paragraph
            body: >-
              Adoption of SCC55 is structured around a multi-stage qualification cycle spanning material synthesis,
              multi-month cell cyclability testing, and automotive pack validation. Group14 reports customer evaluation
              data demonstrating 1,500 to over 3,000 charge cycles, answering a critical historical objection regarding
              silicon particle expansion. The company acquired full 100% ownership of its joint-venture battery active
              materials (BAM) factory in Sangju, South Korea, in August 2025, operating an initial 2,000 tons per year
              (approximately 10 GWh) capacity supplying over 100 battery manufacturing customers. However, commercial
              adoption in North America faces persistent friction: the flagship BAM-2 production facility in Moses Lake,
              Washington, encountered project slowdowns and repeated worker furloughs in July 2025 and January 2026,
              delaying domestic volume production and shifting operational execution to Asia.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
              - CU013
              - CU014
      - number: '6.3'
        title: Named Customer Proof, Offtake Commitments, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Public proof of customer adoption includes cell-level validation by Farasis Energy, which demonstrated 330
              Wh/kg and a 25% energy boost across 1,000+ cycles, and Sionic Energy, which targeted 400 Wh/kg using a
              100% SCC55 anode formulation. Furthermore, Group14 secured agreements with eight leading EV and consumer
              electronics cell makers totaling more than $750M in offtake commitments. Despite these named proof points,
              substantial diligence gaps persist regarding revenue conversion and customer concentration. The reported
              $750M comprises non-binding or volume-contingent offtake agreements rather than recognized sales, while
              specific net revenue retention (NRR), gross renewal rates, and OEM customer concentration percentages
              remain entirely undisclosed. In addition, falling synthetic graphite prices below $10/kg test customer
              willingness to pay an estimated $50/kg premium for silicon anodes during EV market pullbacks.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
