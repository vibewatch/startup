              - CI007
              - CI008
              - CI009
              - CI010
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI013
              - CI015
      - number: '4.4'
        title: Financial Verdict and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is promising but not presently underwritable from public data. Commercial deliveries, a
              broad reported customer base, operating Korean capacity, and repeated strategic financing reduce
              technology-market and near-term fundraising risk. They do not answer whether Group14 earns an attractive
              spread over precursor, energy, labor, qualification, depreciation, and logistics costs. The BAM-2 delay
              and layoffs show that announced capacity can arrive later than planned, while the official news archive
              acknowledges that Chinese manufacturers are already deploying silicon-carbon technology at scale as
              American startups continue commercializing. The investment case therefore depends on private proof:
              audited revenue and gross margin, factory-level yield and utilization, customer concentration, signed
              take-or-pay volume, remaining capex, cash, debt, burn, and a downside runway plan. Funding raised must not
              be treated as cash available, and adoption or testing shipments must not be treated as revenue.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do Not Convert Funding or Adoption into Financial Performance
            body: >-
              More than $1 billion of equity raised and more than 25 million reported devices enabled are evidence of
              financing access and adoption, respectively; neither establishes cash available, revenue, or gross margin.
            calloutType: risk
            claimRefs:
              - CI002
              - CI006
              - CI013
          - type: callout
            title: Gate Underwriting on Factory-Level Evidence
            body: >-
              Require audited financials, contract cohorts, accepted tonnes, realized price, yield, utilization,
              spend-to-complete, cash, debt, and runway before assigning a margin or capital-adequacy case.
            calloutType: recommendation
            claimRefs:
              - CI009
