              Group14 says SCC55 replaces without production-line retooling. Group14's own news index also warns that
              Chinese manufacturers are already deploying silicon-carbon technology at scale. Internal development by
              cell or vehicle manufacturers remains a plausible buyer alternative, but this source set provides no named
              program, scale, or performance evidence; it is therefore shown as unknown rather than scored as a proven
              competitor.
