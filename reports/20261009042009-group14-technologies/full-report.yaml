      - number: '1.4'
        title: Manufacturing Assets, Production Delays, and Macroeconomic Headwinds
        blocks:
          - type: paragraph
            body: >-
              Group14's physical production infrastructure spans domestic and international manufacturing assets. The
              company launched its initial commercial plant, BAM-1, in Woodinville, Washington in April 2021, providing
              120 tons per year of pilot and commercial qualification capacity. International volume scaling is anchored
              by BAM-3 in Sangju, South Korea, an operating 10 GWh facility now wholly owned following the SK joint
              venture buyout, which ships qualification materials to over 150 customer programs. However, domestic
              expansion at BAM-2 in Moses Lake, Washington has encountered schedule slippage, extending initial
              commercial start dates from late 2024 to early 2026. These production delays have coincided with workforce
              layoffs, shifting federal clean-technology policy priorities, and broader electric vehicle adoption
              moderations. To safeguard input availability, Group14 secured an award negotiation for up to $200M from
              the U.S. Department of Energy to construct an adjacent silane precursor facility.
