      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Group14's defensibility rests on three linked claims: drop-in compatibility lowers adoption friction,
              patents constrain imitation, and operating capacity turns technical differentiation into supply assurance.
              The first and third have visible public signals, while patent quality, enforceability, comparative cell
              performance, and switching costs are not independently tested in this pool. Execution risk is concrete.
              Group14 laid off an undisclosed number of U.S. workers in July 2025 after citing demand shifts and trade
              uncertainty, and BAM-2's latest 2027 target follows multiple prior dates. Meanwhile, company-issued
              material says Chinese suppliers are already deploying silicon-carbon at scale. The moat should therefore
              be treated as promising but conditional on commissioning, qualification data, and durable customer
              commitments rather than on patent count or announced capacity alone.
