evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-arr
    missingEvidence: >-
      Audited 2024 through 2026 GAAP financial statements, verified ARR bridge beyond the $200M milestone, and workload
      net revenue retention (NRR) cohorts.
    whyItMatters: >-
      Without audited financial disclosures, revenue progression relies on third-party analyst estimates like GetLatka
      ($304.3M) rather than verified commercial figures.
    diligencePath: >-
      Request confidential management financial pack, audited income statements, and verified ARR roll-forward reports
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: funding-valuation
    missingEvidence: >-
      Fully diluted capitalization table, preferred stock liquidation preferences, senior debt schedules, and current
      2026 409A common stock valuation reports.
    whyItMatters: >-
      The $2 billion valuation anchor dates to the April 2021 Series H round, and Forge Global reports limited secondary
      market liquidity with no clearing price tape.
    diligencePath: >-
      Obtain updated 409A appraisal reports, shareholder rights agreements, and recent secondary transaction bid-ask
      records from private market brokers.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: workforce-distribution
    missingEvidence: >-
      Granular breakdown of Druva's employee headcount across R&D in Pune, commercial sales in North America, customer
      support, and general administrative functions.
    whyItMatters: >-
      Public sources report conflicting headcount bands (501-1,000 employees on FundedIQ versus approximately 1,100 on
      Affluense), limiting operational efficiency analysis.
    diligencePath: >-
      Request human resources headcount census segmented by department, geographical office location, and engineering
      functional role.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current independent category-spend estimate with geography, included products, buyer denominator, forecast
      period, and methodology, plus Druva revenue by workload.
    whyItMatters: >-
      Without consistent category and company denominators, TAM, SAM, SOM, penetration, and market-share claims would be
      unsupported.
    diligencePath: >-
      Obtain current analyst market data and management revenue splits, reconcile category definitions, and build a
      bottom-up model using eligible buyers, workload volumes, pricing, win rates, and retention.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-ownership
    missingEvidence: >-
      Verified payer, budget owner, approver, user, buying-cycle duration, channel, and win-loss evidence by workload
      and customer segment.
    whyItMatters: >-
      Functional workload mappings do not establish who controls budget, how adoption proceeds, or whether Druva
      displaces another product or creates incremental spend.
    diligencePath: >-
      Review CRM opportunity data and conduct buyer interviews segmented by endpoint, SaaS, cloud-workload,
      cyber-resilience, and public-sector use cases.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: performance-benchmarks
    missingEvidence: >-
      Third-party, multi-vendor empirical restore speed benchmarks testing multi-petabyte disaster recovery across Druva
      and on-premises physical backup appliances.
    whyItMatters: >-
      Enterprise infrastructure buyers require verified RTO metrics to evaluate whether cloud-direct restore satisfies
      stringent recovery SLAs during major ransomware events.
    diligencePath: >-
      Request customer proof-of-concept benchmark telemetry and independent test lab data comparing Druva Curated
      Recovery against Rubrik and Veeam on-premises appliances.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited gross margin percentage, hosting COGS breakdowns, and cohort net revenue retention figures.
    whyItMatters: >-
      Gross margin and retention metrics dictate whether Druva's unit economics expand sustainably against underlying
      AWS compute and storage costs.
    diligencePath: >-
      Obtain confidential management accounts or audited financial statements detailing cost of goods sold and net
      retention cohorts.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balances, monthly cash burn, debt and credit facilities, and projected runway.
    whyItMatters: >-
      Without verified cash position or burn rate, an underwriter cannot assess forward solvency or dilution risk in the
      absence of primary equity raises since 2021.
    diligencePath: Request latest board financial package and debt compliance certificates from company management.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: minor
    topic: revenue-mix
    missingEvidence: Revenue contribution breakdown between direct enterprise sales, MSPs, and public cloud marketplaces.
    whyItMatters: Channel concentration and MSP discount structures affect realized net pricing and sales efficiency.
    diligencePath: Review sales pipeline reports and partner distribution agreements during commercial diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: Incident history and public SLA performance
    missingEvidence: >-
      Independent, historical uptime logs, verified MTTR metrics, and root-cause analyses for Druva Cloud Platform
      service disruptions during 2024-2026.
    whyItMatters: >-
      Because Druva positions itself as an enterprise cyber-resilience backbone, uncorroborated reliability claims
      prevent rigorous underwriting of downtime and recovery risks during major cloud or regional outages.
    diligencePath: >-
      Request customer-facing SLA credit histories, audit SOC 2 Type II incident reporting logs, and review cross-region
      disaster recovery drill records with production customers.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: Agentic AI token economics and Bedrock compute overhead
    missingEvidence: >-
      Specific cost of goods sold breakdown for DruAI Bedrock inference and Dru MetaGraph graph queries per protected
      terabyte.
    whyItMatters: >-
      Druva bundles DruAI capabilities without unbundled line-item charges, leaving uncertainty over gross margin
      compression as agentic query volumes scale.
    diligencePath: >-
      Request management model of gross margin impact from AWS Bedrock API consumption across heavy enterprise forensic
      investigations.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: Net Revenue Retention and Cohort Churn Rates
    missingEvidence: >-
      Audited net revenue retention (NRR), gross retention rate (GRR), and cohort renewal figures for 2024–2026 across
      enterprise and commercial tiers.
    whyItMatters: >-
      Without verified NRR and cohort renewal disclosures, long-term customer lifetime value and expansion durability
      cannot be reliably measured against public SaaS peers.
    diligencePath: >-
      Request verified cohort retention matrices, gross churn data, and annual contract value expansion history under
      diligence NDA.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: minor
    topic: Comprehensive Enterprise Reference Account Deployment Telemetry
    missingEvidence: >-
      Full census of active enterprise customer workloads, telemetry, and contract values beyond published marketing
      case studies.
    whyItMatters: >-
      Public case studies highlight successful Fortune 500 implementations but do not reflect representative churn or
      under-utilized enterprise licenses.
    diligencePath: >-
      Examine customer reference telemetry, support ticket escalation logs, and customer health scores during detailed
      commercial review.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory-record
    missingEvidence: Current regulator, court, claims, enforcement, certification-exception, and audit-management records.
    whyItMatters: Company and partner capability claims cannot establish whether material legal matters or control exceptions exist.
    diligencePath: >-
      Obtain counsel-confirmed litigation and regulator schedules, current audit reports, certification scopes, and
      management letters.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-and-recovery-performance
    missingEvidence: >-
      Current incident history, service-level telemetry, achieved RPO and RTO distributions, failed-job rates, and
      independent recovery tests.
    whyItMatters: >-
      Product feature descriptions do not establish operating effectiveness or the probability of successful clean
      recovery.
    diligencePath: >-
      Review five years of material incidents and SLA credits, then witness representative ransomware and
      regional-failover exercises.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-nrr
    missingEvidence: >-
      Audited GAAP financial statements verifying 2024-2026 revenue, ARR growth bridge, gross margin, and net revenue
      retention.
    whyItMatters: >-
      Without certified financial statements, enterprise valuation multiples cannot be reliably benchmarked against
      public peers.
    diligencePath: >-
      Request audited consolidated income statements, balance sheets, and ARR bridge reports directly from Druva CFO or
      investor relations.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-liquidation-preferences
    missingEvidence: >-
      Fully diluted cap table schedule detailing senior liquidation preferences, participation rights, and recent 409A
      common stock marks.
    whyItMatters: >-
      Senior preference overhangs across ten historical rounds could impair common and junior preferred equity returns
      in moderate exit scenarios.
    diligencePath: >-
      Review the company's certificate of incorporation, preference waterfall schedule, and independent 409A valuation
      reports.
    relatedQuestionRefs:
      - QV008
