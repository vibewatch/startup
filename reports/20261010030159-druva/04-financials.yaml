callouts:
  - calloutType: "risk"
    title: "Capital Adequacy and Valuation Realization Uncertainty"
    body: "Druva has operated without a documented primary equity funding round since its April 2021 Series H at a $2.0B valuation. While the company achieved scaled commercial traction exceeding $200M in revenue, secondary market platforms explicitly caution that private company valuations experience substantial fluctuations, shares are illiquid, and investors face the possibility of total capital loss. Without audited income statements or verified cash balances, underwriters must treat capital adequacy and forward exit realization as material diligence risks."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI013"
      - "CI014"
