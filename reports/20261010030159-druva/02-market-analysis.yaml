figures:
  - id: "FM001"
    title: "Evidence-constrained market sizing ladder"
    type: "pyramid"
    summary: "A qualitative boundary ladder separates broad enterprise data activity from Druva-addressable workloads and an unquantified obtainable share."
    data:
      items:
        - label: "Enterprise data estate"
          valueNote: "Not quantified"
          detail: "Endpoints, SaaS applications, cloud workloads, data-center systems, identities, and production data; much of this spend is outside backup."
        - label: "Backup and data protection"
          valueNote: "Not quantified"
          detail: "Backup, protected retention, disaster recovery, and governance rather than primary applications or primary storage."
        - label: "Cloud-delivered data protection"
          valueNote: "Not quantified"
          detail: "Managed cloud backup and recovery; historical forecasts indicate migration direction but not current market value."
        - label: "Druva-addressable workload families"
          valueNote: "Not quantified"
          detail: "Endpoints, SaaS applications, cloud and data-center workloads, plus current cyber- and identity-resilience positioning."
        - label: "Serviceable procurement routes"
          valueNote: "Not quantified"
          detail: "Quote-based enterprise contracts and public-sector framework access where security, retention, migration, and service requirements fit."
        - label: "Obtainable Druva share"
          valueNote: "Unknown"
          detail: "Requires current category spend, eligible buyer counts, workload mix, win rates, retention, and current Druva revenue by segment."
    approximationNotes: "No numeric area, proportion, TAM, SAM, SOM, or market share is implied; the assigned pool supports a boundary sequence only."
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM016"
callouts:
  - calloutType: "insight"
    title: "Pricing evidence is useful for budgeting, not TAM"
    body: "Vendr's observed annual contract ranges establish plausible deal sizes, but the retained source does not disclose the number of addressable buyers, transaction sample size, or total category spend. Multiplying those ranges into a market estimate would require unsupported buyer-count and penetration assumptions."
    claimRefs:
      - "CM005"
      - "CM016"
  - calloutType: "risk"
    title: "Current share and hybrid-market fit remain unverified"
    body: "The source pool lacks current audited Druva revenue by workload and independent 2026 category spend. Built In raises hybrid and on-premises fit concerns, but its page is explicitly generated from LLM responses and unreviewed, so the issue should be tested through win/loss data and buyer interviews rather than treated as established market fact."
    claimRefs:
      - "CM011"
      - "CM015"
      - "CM016"
