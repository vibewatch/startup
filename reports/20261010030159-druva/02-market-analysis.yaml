company:
  name: "Druva"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Druva addresses cloud-delivered backup, disaster recovery, cyber resilience, and governance across endpoints, cloud workloads, SaaS applications, and selected identity systems. The retained evidence supports workload, procurement, and contract-value lenses, but it does not support a current independent TAM, SAM, SOM, or Druva market-share estimate."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Status-Quo Substitutes"
    body: >
      Druva's evidenced market boundary is narrower than all enterprise storage or cybersecurity spending. Current company and partner materials place it in managed backup, disaster recovery, data resilience, identity resilience, and governance for endpoints, public-cloud workloads, data-center workloads, and SaaS applications. The relevant status quo is customer-managed backup infrastructure and software, while adjacent but excluded budgets include primary application licenses, primary storage, endpoint detection, and broad security analytics. This distinction matters because Druva's claimed advantage is removing backup infrastructure and maintenance, not replacing every system that creates, stores, or monitors enterprise data. Historical acquisitions expanded the workload envelope, but the pool does not quantify the revenue attached to each workload.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM001"
  - id: "sizing-evidence"
    title: "Evidence-Constrained Sizing and Adoption Signals"
    body: >
      The assigned evidence does not contain a current independent aggregate estimate for Druva's addressable market, so a precise TAM/SAM/SOM would be false precision. The strongest quantitative lenses are instead buyer contract values, a historical public-cloud growth forecast, and a historical forecast for cloud-based replacement of traditional backup applications. Vendr reports annual contract values from $25,000 to more than $500,000 for mid-market and enterprise deployments, but it does not disclose the number of relevant buyers or total category spend. A 2021 Druva-issued announcement quoted Gartner forecasts of 20.7% cloud-adoption CAGR and 40% backup replacement or supplementation by 2022; these are historical adoption signals, not current market-size measurements.
    claimRefs:
      - "CM005"
      - "CM009"
      - "CM010"
      - "CM015"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-procurement"
    title: "Buyer Segments, Budget Mechanics, and Adoption Path"
    body: >
      Workload scope provides a more defensible segmentation basis than unsupported buyer-title claims. Endpoint and SaaS protection involve per-endpoint, per-user, application, or data-volume economics; server and cloud-workload protection is more closely tied to protected capacity, workload type, retention, and recovery needs. Vendr reports quote-based pricing, negotiated annual or multi-year terms, and additional exposure from overages, migration services, premium support, compliance configurations, and large restores. UK G-Cloud evidence adds a public-sector route through a reseller and publishes contract-value discounts, but the listing does not prove Druva's global realized pricing. Exact budget ownership, approval authority, buying-cycle duration, and channel mix remain management-diligence questions rather than verified facts.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
    tableRefs:
      - "TM003"
  - id: "drivers-and-constraints"
    title: "Growth Drivers, Adoption Constraints, and Valuation Relevance"
    body: >
      Demand is supported by cloud and SaaS workload expansion, ransomware recovery requirements, identity-aware recovery, and a preference for managed services that reduce customer-operated infrastructure. Druva also says Gartner placed it in the Leaders quadrant in June 2026, although the retained pages are Druva-issued or syndicated company communications and Gartner's own disclaimer says the designation is opinion rather than endorsement. Adoption constraints are equally material: quote-based pricing complicates early budgeting, data growth and retention can increase cost, long commitments trade flexibility for discounts, and an AI-generated Built In page flags weaker fit for some hybrid or on-premises environments. That last source is explicitly unreviewed, so it identifies a diligence hypothesis rather than an independently verified market benchmark.
    claimRefs:
      - "CM006"
      - "CM008"
      - "CM011"
      - "CM012"
      - "CM015"
