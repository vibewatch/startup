company:
  name: "Druva"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2008, Druva is a cloud-native SaaS data resilience platform that protects enterprise workloads across cloud, on-premises, and AI workspaces. Having surpassed $200M in SaaS ARR in August 2023 with a peak $2B valuation anchor in 2021, the company protects nearly 7,500 customers while facing private operating losses and unverified 2026 secondary liquidity."
sections:
  - id: "corporate-identity-and-founding"
    title: "Corporate Identity, Founding Roots, and Architectural Pivot"
    body: "Druva was established in 2008 by co-founders Jaspreet Singh, Milind Borate, and Ramani Kothandaraman, maintaining dual operational centers in Pune, India and corporate headquarters in Santa Clara and Sunnyvale, California. The company originally operated as a traditional on-premises backup software and hardware appliance vendor. Between 2013 and 2014, executive leadership executed a decisive business model pivot, walking away from $10 million in existing annual recurring revenue to reconstruct the entire product suite as a 100% cloud-native Software-as-a-Service architecture hosted on Amazon Web Services. This architectural transition eliminated the procurement, maintenance, and patch overhead associated with legacy storage appliances, delivering estimated total cost of ownership reductions between 30% and 50% for modern enterprise IT organizations."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO013"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Architecture"
    body: "Druva's executive leadership structure is centered on Founder and Chief Executive Officer Jaspreet Singh, who has guided corporate strategy, technical roadmap development, and capital allocation across eighteen years of operational scaling. Co-founder Milind Borate contributed foundational architectural expertise in distributed storage systems and enterprise data resilience. On the operational and financial side, Chief Operating and Financial Officer Mahesh Patel orchestrated the commercial transition from perpetual licensing to consumption-based pay-as-you-go pricing, aligning customer spend with data ingestion volume. While executive retention remains stable across the core leadership bench, strategic decision-making and public evangelism exhibit substantial key-person concentration in the founding CEO."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization Structure, Investor Syndicate, and Strategic Alliances"
    body: "Druva has raised approximately $475 million in lifetime institutional venture capital and private equity financing across eight disclosed investment rounds since 2010. The company achieved unicorn status in June 2019 following a $130 million Series G financing led by Viking Global Investors at an $870 million valuation. In April 2021, Druva secured a $147 million Series H round co-led by Caisse de dépôt et placement du Québec (CDPQ) and Neuberger Berman, establishing a post-money valuation benchmark exceeding $2 billion. Beyond financial sponsors, Druva maintains critical strategic alliances with Amazon Web Services, upon whose infrastructure the entire platform operates, and Dell Technologies, which embeds Druva Cloud Platform as the underlying operational engine for its Dell APEX Backup Services."
    claimRefs:
      - "CO005"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "scale-metrics-and-resilience-evolution"
    title: "Operating Scale, Financial Trajectory, and AI Resilience Evolution"
    body: "Druva announced surpassing $200 million in SaaS annual recurring revenue in August 2023, accompanied by 30% year-over-year customer expansion and over six billion annualized backup operations. Third-party research by GetLatka estimated Druva's revenue run-rate at $304.3 million in late 2024, although the company has not published audited GAAP financial statements. Independent Indian entity filings compiled by Affluense indicate that Druva incurred negative net profit and negative operating margins through FY23 due to global R&D and go-to-market expenditures. In July 2026, Druva expanded its platform into agentic cybersecurity by launching AI Resilience capabilities protecting Microsoft Copilot, Claude Code, Druva Model Context Protocol (MCP), and the Dru SRE Agent across nearly 7,500 enterprise customers."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO006"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO001"
