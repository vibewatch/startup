chapter:
  number: 5
  title: "Product & Technology"
  summary: "Druva delivers a cloud-native SaaS cyber resilience platform built natively on Amazon Web Services, consolidating endpoint, virtual machine, and enterprise SaaS application protection into a tenant-isolated metadata graph (Dru MetaGraph) with supervised AI operational agents (DruAI)."
sections:
  - id: "platform-overview-and-workload-coverage"
    title: "Platform Overview and Workload Coverage"
    body: "Druva provides a fully managed SaaS data protection and cyber resilience platform designed to eliminate dedicated on-premises backup hardware and media servers. The platform covers four major enterprise workload categories: endpoint devices (laptops and desktops via inSync), virtualized data center environments (VMware vSphere, Microsoft Hyper-V, and Nutanix AHV via Phoenix), cloud-native infrastructure (Amazon EC2, Amazon RDS, Amazon EFS, and Azure VMs), and enterprise SaaS productivity suites including Microsoft 365, Google Workspace, and Salesforce. Historically founded with endpoint protection, Druva expanded its architectural breadth through strategic technology acquisitions, adding AWS disaster recovery through CloudRanger, edge-to-cloud performance capabilities via CloudLanes, and granular Salesforce data protection through sfApex. Channel partners and managed service providers administer these capabilities through unified tenant policies, establishing baseline backup, retention, and ransomware recovery workflows across heterogeneous client infrastructure."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE010"
      - "CE012"
    tableRefs:
      - "TE001"
  - id: "cloud-native-architecture-and-operating-model"
    title: "Cloud-Native Architecture and Operating Model"
    body: "The core engine of the Druva Cloud Platform is architected as a multi-tenant Software-as-a-Service system hosted entirely within Amazon Web Services. Rather than requiring customer-managed storage arrays, Druva ingests customer data using lightweight local or cloud proxies. For on-premises VMware environments, an open virtual appliance (OVA) proxy registers with vCenter, deduplicates data source-side, and securely transmits encrypted blocks to Druva's cloud. Ingested data is tiered automatically across Amazon Simple Storage Service (Amazon S3) for immediate operational recovery and Amazon S3 Glacier Deep Archive for long-term compliance retention. For disaster recovery scenarios, Druva Phoenix orchestrates one-click automated failover: an in-cloud EC2 proxy spins up live Amazon EC2 virtual machines directly from Amazon Elastic Block Store (EBS) snapshots inside the customer's dedicated AWS account, providing cross-environment recovery without standing standby infrastructure."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE007"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "ai-resilience-and-metadata-intelligence"
    title: "AI Resilience, Metadata Graph, and Autonomous Agents"
    body: "In response to escalating cyber threats and unmanageable enterprise data sprawl, Druva introduced Dru MetaGraph to serve as the intelligence backbone of its Resilience Cloud. Unlike traditional data protection platforms that rely exclusively on periodic flat indexes or vector embeddings, Dru MetaGraph structures backup metadata into a living, tenant-isolated relationship graph. This graph continuously maps connections across user identities, file access permissions, workloads, and point-in-time snapshots to accelerate blast-radius identification and suspicious access tracing during incidents. Operating over this metadata layer is DruAI, an intelligent multi-agent system running on Amazon Bedrock foundation models. Rather than relying on a single monolithic language model, DruAI employs specialized functional agents—Data Agents for retrieval, Help Agents for administrative guidance, In-depth Analysis Agents for complex investigations, Generative UX Agents for report creation, and Action Agents for remediation—coordinated by supervisor agents under strict human-in-the-loop approval controls for high-impact restore actions."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE002"
  - id: "security-governance-and-technical-risks"
    title: "Security Controls, API Integration, and Technical Risks"
    body: "Security and compliance governance in Druva are enforced through tenant isolation, envelope encryption, and role-based access management. Druva provides integration capabilities through REST APIs secured via OAuth 2.0 credentials managed in its Integration Center, allowing external security operations platforms such as Google SecOps (Chronicle) to ingest backup audit trails, restore activities, and security alerts via Cloud Run functions. Druva previously obtained FedRAMP authorization, validating its controls for sensitive government deployments. However, the architecture presents specific technical risks: deep single-cloud hyperscaler dependency on AWS for storage and compute creates structural availability concentration; reliance on Amazon S3 Glacier Deep Archive introduces retrieval latency considerations for large-scale cold data hydration; and public documentation lacks independent third-party audit metrics verifying historical platform SLA adherence across multi-region cloud outages."
    claimRefs:
      - "CE009"
      - "CE013"
      - "CE014"
