              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Druva-issued material claims support for GDPR, CCPA, HIPAA, FedRAMP, SOC, ISO 27001, and PCI DSS, and a
              Cyber Advisors article repeats compliance and GovCloud positioning. Those statements describe product
              capabilities and claimed certifications; they do not establish the current scope, exceptions, audit
              findings, or operating effectiveness of each control. The evidence also describes legal hold, eDiscovery,
              retention, and defensible deletion features, which are relevant mitigations but create execution
              obligations across jurisdictions and customer configurations. Before underwriting low regulatory risk,
              diligence should obtain current audit reports, certification boundaries, data residency maps,
              subprocessors, DPA terms, material claims or enforcement history, and evidence that deletion and
              legal-hold workflows work as represented.
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR015
      - number: '7.3'
        title: Operational, security, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Druva's architecture transfers appliance maintenance to a managed SaaS provider, but it also concentrates
              recovery outcomes in Druva's control plane, cloud operations, and workload integrations. Product material
              describes seven-day rollback for deleted backup data and encryption, immutability, anomaly detection, and
              clean-recovery workflows. These are meaningful mitigations, not proof of achieved recovery objectives
              under a material attack. Financially, Forrester's composite model shows subscription fees increasing from
              $152,640 in Year 1 to $203,626 in Year 3 as storage grows; the model is illustrative, commissioned, and
              not Druva corporate revenue or margin disclosure. Investors should separate customer ROI modeling from
              Druva's own unit economics, cash needs, and runway.
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR011
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR008
              - CR011
              - CR013
              - CR015
      - number: '7.4'
        title: Dependencies, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Historical company-issued material says the platform is built on AWS, while current product material
              describes Microsoft Storage for the Backup Express option and partner commentary emphasizes the
              shared-responsibility model. These dependencies are ordinary for cloud software but material for a
              resilience vendor because regional cloud failures, API changes, throttling, identity compromise, or
              unfavorable infrastructure economics can affect service quality and gross margin at the same time. Monthly
              diligence should monitor recovery-test pass rates, achieved RPO and RTO by workload, material incidents,
              support escalations, cloud concentration, storage growth, renewal pricing, and certification exceptions. A
              failed independent recovery test, an unresolved material control incident, or unacceptable AWS or
              Microsoft resilience terms should break a low-residual-risk thesis.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR009
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break conditions
            body: >-
              Do not underwrite low residual risk if an independent recovery exercise misses contracted objectives, a
              material control incident remains unresolved, or cloud-platform terms no longer support acceptable
              resilience and economics.
            calloutType: risk
            claimRefs:
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Our investment thesis acknowledges Druva as an established, cloud-native pioneer in the cyber resilience,
              backup, and automated threat recovery market. Founded in Pune in 2008 and headquartered in Santa Clara,
              Druva demonstrated substantial operational scale by reaching an estimated $304.3M annual recurring revenue
              run rate by late 2024, building upon an authentic enterprise footprint encompassing over 1,300 personnel
              and multiple global operating entities. The company's architectural commitment to fully managed
              Resilience-as-a-Service on Amazon Web Services removes on-premises appliance friction, positioning it
              advantageously as enterprises transition hybrid workloads, endpoints, Microsoft 365, and AI models to
              cloud environments. Conversely, the anti-thesis centers on extreme valuation opacity and extended
              illiquidity. Druva's last equity financing milestone occurred in April 2021 via a $147M Series H round led
              by CDPQ at a $2.0B post-money valuation. More than five years have elapsed without verified secondary
              clearing benchmarks, 409A common stock valuations, or audited GAAP filings, leaving public markets without
              proof that historical enterprise value multiples remain defensible amid heightened competition from public
              players like Rubrik and private consolidators like Cohesity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
      - number: '8.2'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Druva's capital capitalization history reflects $475M in cumulative equity raised across ten rounds since
              inception, progressing from early venture tranches through a $130M Series G at a $1.0B valuation in June
              2019 led by Viking Global Investors to the $147M Series H in April 2021 at $2.0B post-money. That Series H
              transaction established an implied revenue multiple of roughly 10x to 15x trailing revenue during a
              historic peak in cloud software valuation multiples. However, contemporary private company aggregators and
              secondary observations reveal a total absence of recent price discovery. Without transparent liquidation
              preference schedules, senior preferred participation rights, or updated revenue growth bridges, the $2.0B
              headline benchmark must be treated with substantial skepticism. The absence of public filings leaves
              external analysts reliant on third-party estimates such as GetLatka's $304.3M estimate and Indian
              statutory filings for Druva Data Solutions Private Limited, which reported FY25 revenue between ₹100 Cr
              and ₹500 Cr alongside 753 India-based personnel. This bifurcated global structure indicates significant
              offshore engineering leverage but does not provide consolidated GAAP audited net retention or gross margin
              transparency.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: Valuation Scenarios and Comparable Benchmarking
        blocks:
          - type: paragraph
            body: >-
              To establish disciplined entry parameters, we evaluate three forward valuation scenarios benchmarked
              against relevant public and private peers, most notably Rubrik (which completed its IPO with $553M raised
              and substantial market capitalization), Veeam, and Cohesity. In our Bull scenario, Druva demonstrates
              accelerated SaaS resilience adoption across cloud-native databases, endpoint fleets, and emerging AI
              workloads, generating sustained 20% annual ARR expansion toward $365M and commanding a 6.0x forward ARR
              multiple equivalent to approximately $2.19B enterprise value. Our Base scenario reflects steady enterprise
              backup maintenance in mid-market environments, expanding at a moderate 10% rate to $335M ARR but subject
              to multiple contraction down to 3.5x ARR, yielding a fair enterprise value of $1.17B. In our Bear
              scenario, competitive encroachment from hyperscaler-native backup utilities and integrated platform
              competitors restricts revenue growth to low single digits while legacy preferred share liquidation
              overhangs compress common equity value, resulting in a distressed 2.0x multiple and a $600M valuation.
              Consequently, current secondary pricing expectations must account for a significant discount relative to
              the 2021 Series H benchmark.
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Recommendation, Decision Logic, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Synthesizing product resilience against severe disclosure gaps, our recommendation is track with medium
              confidence, accompanied by a high risk rating and a fair-to-uncertain valuation stance. Druva's core
              technology and AWS-native architecture provide genuine utility to mid-market and enterprise IT
              organizations seeking simplified ransomware recovery and cyber defense. However, entering an equity
              position without primary cap-table visibility, verified churn figures, or certified 2024-2026 revenue
              bridges would violate fundamental underwriting discipline. We outline strict diligence asks before any
              capital deployment: first, production of audited consolidated financial statements detailing GAAP revenue,
              gross margin, and net retention; second, a complete schedule of preferred share liquidation preferences
              and 409A valuation reports; third, verified unit economics and AWS hosting gross margins; and fourth,
              customer concentration metrics across channel partners and MSPs. Any sign of growth deceleration below 10%
              or senior preference overhang exceeding total enterprise value constitutes an immediate thesis-break
              trigger.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Discipline Requires Fresh Primary Disclosures
            body: >-
              Investors should refrain from purchasing secondary shares based on Druva's historical $2.0B Series H
              valuation. Until management shares audited GAAP revenue bridges, NRR metrics, and liquidation preferences,
              underwriting must assume peer multiple compression.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV015
          - type: callout
            title: Extended Liquidity Latency and Capital Overhang
            body: >-
              Having raised $475M across ten rounds over an 18-year operating lifespan without an IPO filing or
              definitive exit event, Druva presents meaningful duration and liquidity risk for late-stage investors.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV012
