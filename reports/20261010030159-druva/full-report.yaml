        title: Growth Drivers, Adoption Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >
              Demand is supported by cloud and SaaS workload expansion, ransomware recovery requirements, identity-aware
              recovery, and a preference for managed services that reduce customer-operated infrastructure. Druva also
