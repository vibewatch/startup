      - number: '4.2'
        title: Cost Structure, Hosting Overhead, and Unit Economics Gaps
        blocks:
          - type: paragraph
            body: >-
              Druva positions its cloud-native architecture as a mechanism to slash customer operational costs by up to
              40% to 50% relative to legacy hardware-based backup solutions like Commvault or Veritas. Because Druva
              delivers its fully managed resilience platform entirely on Amazon Web Services infrastructure, its cost of
              goods sold is heavily exposed to underlying AWS compute, telemetry ingestion, and S3 storage economics.
              The company does not publish audited gross margins, gross revenue retention, or net revenue retention
              cohorts. This absence of disclosed unit retention and customer acquisition cost payback leaves
              underwriters unable to verify whether pricing realization outpaces underlying cloud infrastructure
              consumption and partner distribution commissions.
