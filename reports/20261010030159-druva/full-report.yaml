  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Druva's evidenced market boundary is narrower than all enterprise storage or cybersecurity spending.
              Current company and partner materials place it in managed backup, disaster recovery, data resilience,
              identity resilience, and governance for endpoints, public-cloud workloads, data-center workloads, and SaaS
              applications. The relevant status quo is customer-managed backup infrastructure and software, while
              adjacent but excluded budgets include primary application licenses, primary storage, endpoint detection,
              and broad security analytics. This distinction matters because Druva's claimed advantage is removing
              backup infrastructure and maintenance, not replacing every system that creates, stores, or monitors
              enterprise data. Historical acquisitions expanded the workload envelope, but the pool does not quantify
              the revenue attached to each workload.
            claimRefs:
