figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Key operational, technical, financing, and product milestones from founding in 2008 through the 2026 AI Resilience
      launch.
    data:
      items:
        - label: '2008: Company Founding in Pune'
          date: '2008'
          detail: >-
            Jaspreet Singh, Milind Borate, and Ramani Kothandaraman found Druva as an enterprise storage and backup
            software provider.
          tone: neutral
        - label: '2010: Series A Financing'
          date: 2010-04
          detail: Druva secures $5M Series A funding from Nexus Venture Partners to expand enterprise backup software.
          tone: positive
        - label: '2013-2014: Architectural Pivot to Cloud SaaS'
          date: '2013'
          detail: Management abandons $10M ARR on-premises appliance business to pivot 100% to cloud-native SaaS on AWS.
          tone: positive
        - label: '2019: Unicorn Status with Series G'
          date: 2019-06
          detail: >-
            Druva raises $130M Series G led by Viking Global Investors, reaching an $870M valuation and surpassing $100M
            revenue run-rate.
          tone: positive
        - label: '2021: $147M Series H at $2B Valuation'
          date: 2021-04
          detail: Raises $147M Series H led by CDPQ and Neuberger Berman, valuing Druva at over $2B.
          tone: positive
        - label: '2022: Dell Technologies Strategic Alliance'
          date: '2022'
          detail: >-
            Dell selects Druva Cloud Platform to power its Dell APEX Backup Services multicloud data protection
            solution.
          tone: positive
        - label: '2023: $200M SaaS ARR Milestone'
          date: 2023-08
          detail: >-
            Druva officially announces surpassing $200M in SaaS annual recurring revenue with over 5,000 enterprise
            customers.
          tone: positive
        - label: '2026: AI Resilience & Agentic Protection Launch'
          date: 2026-07
          detail: >-
            Launches Druva AI Resilience platform protecting Microsoft Copilot, Claude Code, Druva MCP, and introducing
            Dru SRE Agent.
          tone: positive
    approximationNotes: Milestones reflect publicly announced funding rounds, product launches, and strategic partnership agreements.
