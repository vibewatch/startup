      - number: '4.3'
        title: Historical Capitalization, Secondary Clearing, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Druva raised an aggregate of approximately $475 million across ten private funding rounds, culminating in
              an April 2021 Series H round of $147 million led by Caisse de dépôt et placement du Québec alongside
              Neuberger Berman, Viking Global Investors, and Atreides Management. While the Series H transaction
              established an official $2.0 billion post-money equity valuation, Druva has announced no subsequent
              primary equity or structured credit financing through 2026. Secondary market trading venues including
              Nasdaq Private Market, EquityZen, and UpMarket reflect illiquidity, significant private valuation
              fluctuations, and platform-level transfer constraints. Without disclosed balance sheet cash balances,
              operating cash burn, or debt covenants, Druva's forward runway and standalone capital adequacy remain
              unresolved diligence blockers.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Adequacy and Valuation Realization Uncertainty
            body: >-
              Druva has operated without a documented primary equity funding round since its April 2021 Series H at a
              $2.0B valuation. While the company achieved scaled commercial traction exceeding $200M in revenue,
              secondary market platforms explicitly caution that private company valuations experience substantial
              fluctuations, shares are illiquid, and investors face the possibility of total capital loss. Without
              audited income statements or verified cash balances, underwriters must treat capital adequacy and forward
              exit realization as material diligence risks.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI013
