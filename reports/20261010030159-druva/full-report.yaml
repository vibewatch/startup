  - id: FE001
    title: Druva Resilience Cloud Architecture Stack
    type: stack
    summary: >-
      Six-tier architectural stack illustrating data flow from workload clients and proxies through AWS storage tiers to
      Dru MetaGraph and supervised DruAI agents.
    data:
      layers:
        - label: Application & Interface Layer
          modules:
            - Druva Cloud Platform Management Console
            - DruAI Conversational Assistant Interface
            - Google SecOps & SIEM REST API Exporters
        - label: Agentic AI Execution Layer
          modules:
            - Data Agents for Content Aggregation
            - Action Agents with User Confirmation Gates
            - Supervisor Agent for Multi-Capability Coordination
        - label: Metadata Intelligence Layer
          modules:
            - Dru MetaGraph Tenant-Isolated Graph Database
            - Identity & Permission Relationship Index
            - Cross-Workload Blast-Radius Analysis
        - label: Security & Control Plane
          modules:
            - OAuth 2.0 Integration Center
            - Role-Based Access Control (Admin vs Read-Only)
            - Envelope Encryption & Key Management
        - label: Ingestion & Hybrid Proxy Layer
          modules:
            - VMware On-Premises Backup Proxy (OVA)
            - AWS In-VPC EC2 Proxy for Cloud Workloads
            - Endpoint InSync Client Agents
        - label: Cloud Storage Foundation
          modules:
            - Amazon S3 Standard Storage Tier
            - Amazon S3 Glacier Deep Archive Tier
            - Live Failover to Amazon EC2 from EBS Snapshots
