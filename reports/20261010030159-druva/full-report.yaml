        title: Capitalization Structure, Investor Syndicate, and Strategic Alliances
        blocks:
          - type: paragraph
            body: >-
              Druva has raised approximately $475 million in lifetime institutional venture capital and private equity
              financing across eight disclosed investment rounds since 2010. The company achieved unicorn status in June
              2019 following a $130 million Series G financing led by Viking Global Investors at an $870 million
              valuation. In April 2021, Druva secured a $147 million Series H round co-led by Caisse de dépôt et
              placement du Québec (CDPQ) and Neuberger Berman, establishing a post-money valuation benchmark exceeding
              $2 billion. Beyond financial sponsors, Druva maintains critical strategic alliances with Amazon Web
              Services, upon whose infrastructure the entire platform operates, and Dell Technologies, which embeds
              Druva Cloud Platform as the underlying operational engine for its Dell APEX Backup Services.
            claimRefs:
