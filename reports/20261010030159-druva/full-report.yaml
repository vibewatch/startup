        title: Operating Scale, Financial Trajectory, and AI Resilience Evolution
        blocks:
          - type: paragraph
            body: >-
              Druva announced surpassing $200 million in SaaS annual recurring revenue in August 2023, accompanied by
              30% year-over-year customer expansion and over six billion annualized backup operations. Third-party
              research by GetLatka estimated Druva's revenue run-rate at $304.3 million in late 2024, although the
