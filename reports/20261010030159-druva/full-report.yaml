      - number: '2.3'
        title: Buyer Segments, Budget Mechanics, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Workload scope provides a more defensible segmentation basis than unsupported buyer-title claims. Endpoint
              and SaaS protection involve per-endpoint, per-user, application, or data-volume economics; server and
              cloud-workload protection is more closely tied to protected capacity, workload type, retention, and
              recovery needs. Vendr reports quote-based pricing, negotiated annual or multi-year terms, and additional
              exposure from overages, migration services, premium support, compliance configurations, and large
              restores. UK G-Cloud evidence adds a public-sector route through a reseller and publishes contract-value
              discounts, but the listing does not prove Druva's global realized pricing. Exact budget ownership,
              approval authority, buying-cycle duration, and channel mix remain management-diligence questions rather
              than verified facts.
