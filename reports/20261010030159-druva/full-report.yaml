        - No verified primary rounds or institutional clearing marks in over 5 years
        - Consolidated audit showing >30% YoY growth and high gross margins justifying $2B+
      - - Anti-Thesis (Governance)
        - Opaque private ownership structure obscures preferred liquidation preferences and returns
        - Ten funding rounds and multiple entity registrations without public S-1 disclosure
        - Full cap-table disclosure demonstrating common share equity alignment
    notes: Comparative thesis matrix contrasting operational product strengths against private equity structure risks.
