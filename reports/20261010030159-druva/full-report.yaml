  - id: FM001
    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: >-
      A qualitative boundary ladder separates broad enterprise data activity from Druva-addressable workloads and an
      unquantified obtainable share.
    data:
      items:
        - label: Enterprise data estate
          valueNote: Not quantified
          detail: >-
            Endpoints, SaaS applications, cloud workloads, data-center systems, identities, and production data; much of
            this spend is outside backup.
        - label: Backup and data protection
          valueNote: Not quantified
          detail: >-
            Backup, protected retention, disaster recovery, and governance rather than primary applications or primary
            storage.
        - label: Cloud-delivered data protection
          valueNote: Not quantified
          detail: >-
            Managed cloud backup and recovery; historical forecasts indicate migration direction but not current market
            value.
        - label: Druva-addressable workload families
          valueNote: Not quantified
          detail: >-
            Endpoints, SaaS applications, cloud and data-center workloads, plus current cyber- and identity-resilience
            positioning.
        - label: Serviceable procurement routes
          valueNote: Not quantified
          detail: >-
            Quote-based enterprise contracts and public-sector framework access where security, retention, migration,
            and service requirements fit.
        - label: Obtainable Druva share
          valueNote: Unknown
          detail: >-
            Requires current category spend, eligible buyer counts, workload mix, win rates, retention, and current
            Druva revenue by segment.
    approximationNotes: >-
      No numeric area, proportion, TAM, SAM, SOM, or market share is implied; the assigned pool supports a boundary
      sequence only.
    claimRefs:
      - CM001
      - CM005
      - CM016
  - id: FP001
    title: 'Competitive Positioning: Cloud-Native Simplicity vs. Enterprise Workload Depth'
    type: quadrant
    summary: >-
      Ordinal positioning of enterprise data protection vendors mapping operational lightness against hybrid enterprise
      workload depth.
    approximationNotes: >-
      Vendor coordinates represent evidence-backed ordinal scores on a 1-10 scale synthesizing SaaS architectural
      lightness and hybrid workload coverage.
    claimRefs:
      - CP001
      - CP002
      - CP009
      - CP013
      - CP014
    data:
      points:
        - label: Druva
          x: 9
          'y': 7.5
          tone: positive
          detail: >-
            100% SaaS delivery on AWS with zero customer-managed backup infrastructure; leader in endpoint and M365
            protection.
        - label: Rubrik
          x: 4.5
          'y': 8.5
          tone: neutral
          detail: High cyber resilience and API automation, but requires customer cluster infrastructure and higher TCO.
        - label: Cohesity
          x: 4
          'y': 8.2
          tone: neutral
          detail: >-
            Hyperconverged secondary storage platform consolidating backup and analytics; substantial footprint to
            manage.
        - label: Veeam
          x: 3.5
          'y': 8
          tone: neutral
          detail: >-
            Market incumbent with deep virtualization capabilities; requires customer-supplied hardware, proxies, and
            storage.
        - label: Commvault
          x: 3
          'y': 8.8
          tone: neutral
          detail: >-
            Extensive enterprise workload coverage across legacy databases and tape, offset by operational configuration
            complexity.
        - label: Bacula Enterprise
          x: 2
          'y': 6.5
          tone: opportunity
          detail: >-
            Modular open-core platform with zero capacity-based fees, appealing to technically sophisticated Linux
            environments.
