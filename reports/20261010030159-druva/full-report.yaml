chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Architectural Pivot
        blocks:
          - type: paragraph
            body: >-
              Druva was established in 2008 by co-founders Jaspreet Singh, Milind Borate, and Ramani Kothandaraman,
              maintaining dual operational centers in Pune, India and corporate headquarters in Santa Clara and
              Sunnyvale, California. The company originally operated as a traditional on-premises backup software and
              hardware appliance vendor. Between 2013 and 2014, executive leadership executed a decisive business model
              pivot, walking away from $10 million in existing annual recurring revenue to reconstruct the entire
              product suite as a 100% cloud-native Software-as-a-Service architecture hosted on Amazon Web Services.
              This architectural transition eliminated the procurement, maintenance, and patch overhead associated with
              legacy storage appliances, delivering estimated total cost of ownership reductions between 30% and 50% for
              modern enterprise IT organizations.
            claimRefs:
              - CO001
              - CO002
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Architecture
        blocks:
          - type: paragraph
            body: >-
              Druva's executive leadership structure is centered on Founder and Chief Executive Officer Jaspreet Singh,
              who has guided corporate strategy, technical roadmap development, and capital allocation across eighteen
              years of operational scaling. Co-founder Milind Borate contributed foundational architectural expertise in
              distributed storage systems and enterprise data resilience. On the operational and financial side, Chief
              Operating and Financial Officer Mahesh Patel orchestrated the commercial transition from perpetual
              licensing to consumption-based pay-as-you-go pricing, aligning customer spend with data ingestion volume.
              While executive retention remains stable across the core leadership bench, strategic decision-making and
              public evangelism exhibit substantial key-person concentration in the founding CEO.
