  - id: FU001
    title: 'Customer Journey Map: Land-and-Expand Resilience Lifecycle'
    type: journey-map
    summary: >-
      Customer progression from single-workload SaaS and endpoint backup to cross-cloud data resilience and autonomous
      AI governance.
    data:
      items:
        - label: Discovery & Procurement
          stage: Discovery & Procurement
          touchpoints:
            - Evaluation of SaaS backup for Microsoft 365 and Google Workspace
            - Cloud marketplace procurement via AWS Marketplace or regional MSP
          actor: IT Infrastructure Manager
          barrier: Legacy backup contracts and backup appliance amortization
        - label: Initial Deployment (Land)
          stage: Initial Deployment (Land)
          touchpoints:
            - Configuration of cloud-native agentless backup
            - Endpoint protection rollout across laptop and remote worker fleets
          actor: Systems Administrator
          barrier: Network bandwidth throttling and initial data indexing time
        - label: Operational Integration
          stage: Operational Integration
          touchpoints:
            - Integration with enterprise identity (SSO, SCIM) and SIEM tools
            - Customer Success Engineer onboarding and troubleshooting
          actor: Customer Success & Security Ops
          barrier: Complex hybrid infrastructure (Hyper-V, VMware on-premises)
        - label: Workload Expansion
          stage: Workload Expansion
          touchpoints:
            - Addition of cloud infrastructure workloads (AWS EC2, RDS, S3, Azure)
            - Salesforce and unstructured NAS file protection deployment
          actor: Cloud Architect
          barrier: Budget allocation across disparate infrastructure and application owners
        - label: Cyber Resilience & DR
          stage: Cyber Resilience & DR
          touchpoints:
            - Threat hunting and ransomware recovery testing
            - Air-gapped cyber recovery orchestration
          actor: CISO & Security Incident Response
          barrier: Testing frequency constraints and multi-party signoff
        - label: AI Governance & Autonomous Resilience
          stage: AI Governance & Autonomous Resilience
          touchpoints:
            - Deployment of Claude and Microsoft 365 Copilot governance
            - DruAI multi-agent investigation and recovery assistance
          actor: VP of Enterprise AI & Chief Compliance Officer
          barrier: Uncertain enterprise AI governance policies and model trust
    approximationNotes: >-
      Journey stages represent common enterprise progression patterns observed across Druva deployments and analyst
      frameworks.
    claimRefs:
      - CU005
      - CU011
      - CU012
  - id: FR001
    title: Risk heatmap — consequence, evidence, and mitigation maturity
    type: matrix
    summary: >-
      Residual severity remains highest where Druva documents controls but current independent operating evidence is
      absent.
    data:
      columns:
        - label: Impact
        - label: Evidence on likelihood
        - label: Mitigation maturity
      rows:
        - label: Independent assurance gap
          values:
            - label: High
              tone: high
            - label: Unknown
              tone: warning
              detail: No regulator, court, incident, or current independent recovery record is in the assigned pool.
            - label: Partial
              tone: warning
              detail: Commissioned analyst and partner material supplements company assertions.
        - label: Recovery and control failure
          values:
            - label: Critical
              tone: critical
            - label: Unknown
              tone: warning
              detail: Product controls are described without a current failure-rate denominator.
            - label: Documented
              tone: medium
              detail: Immutability, anomaly detection, audit logging, and rollback are represented.
        - label: Cloud and workload dependency
          values:
            - label: High
              tone: high
            - label: Medium
              tone: medium
              detail: AWS and Microsoft dependencies are documented, while concentration is not quantified.
            - label: Partial
              tone: warning
              detail: Failover performance and contractual protections require diligence.
        - label: Financial-model opacity
          values:
            - label: High
              tone: high
            - label: Unknown
              tone: warning
              detail: Historical financing and customer ROI modeling do not disclose current company economics.
            - label: Low visibility
              tone: high
              detail: Current cash, burn, margin, runway, and dependency cost shares are unavailable.
        - label: Regulatory operating effectiveness
          values:
            - label: High
              tone: high
            - label: Unknown
              tone: warning
              detail: Claimed frameworks are not accompanied by current audit findings in the assigned pool.
            - label: Documented claims
              tone: medium
              detail: Company and partner material describe certifications, policies, and governance features.
        - label: Autonomous AI operational drift
          values:
            - label: High
              tone: high
            - label: Emerging
              tone: warning
              detail: Druva identifies over-permissioned and misconfigured agents as machine-speed risks.
            - label: Conceptual
              tone: warning
              detail: The pool contains product positioning rather than independent production outcomes.
    approximationNotes: >-
      Qualitative heatmap based only on assigned prefetched evidence; it does not estimate incident frequency or loss
      magnitude.
    claimRefs:
