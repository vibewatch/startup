schemaVersion: "report-v2"
artifact: risks
slug: druva
runDate: 2026-10-10
company:
  name: Druva
chapter:
  number: 7
  title: Risks
  summary: >-
    Druva documents meaningful technical mitigations for backup integrity, recovery, access control,
    and compliance, but the retained evidence is dominated by company-issued, partner-authored, and
    company-commissioned material. The highest residual exposures are therefore independent assurance,
    cloud-platform concentration, recovery-performance verification, and private-company financial opacity.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The central diligence risk is not that the retained evidence proves a control failure; it is that
      most control assertions cannot be independently tested from this pool. Druva describes a fully
      managed SaaS model, immutable and air-gapped backups, anomaly detection, and rollback controls,
      while a commissioned Forrester study reports customer benefits and operating efficiencies.
      However, the study aggregates four interviewees into a composite and expressly is not a competitive
      analysis. Severity below therefore combines potential consequence with evidence quality rather than
      treating the absence of an incident record as evidence that no incident occurred. Independent
      recovery tests, service-level telemetry, control reports, and current incident history remain the
      decisive evidence for reducing residual risk.
    claimRefs: [CR001, CR002, CR006, CR008, CR011, CR015]
    figureRefs: [FR001]
  - id: regulatory-legal-and-governance
    title: Regulatory, legal, and governance exposure
    body: >-
      Druva-issued material claims support for GDPR, CCPA, HIPAA, FedRAMP, SOC, ISO 27001, and PCI DSS,
      and a Cyber Advisors article repeats compliance and GovCloud positioning. Those statements describe
      product capabilities and claimed certifications; they do not establish the current scope, exceptions,
      audit findings, or operating effectiveness of each control. The evidence also describes legal hold,
      eDiscovery, retention, and defensible deletion features, which are relevant mitigations but create
      execution obligations across jurisdictions and customer configurations. Before underwriting low
      regulatory risk, diligence should obtain current audit reports, certification boundaries, data
      residency maps, subprocessors, DPA terms, material claims or enforcement history, and evidence that
      deletion and legal-hold workflows work as represented.
    claimRefs: [CR003, CR004, CR008, CR015]
    tableRefs: [TR001]
  - id: operational-security-and-model-risk
    title: Operational, security, and financial-model risk
    body: >-
      Druva's architecture transfers appliance maintenance to a managed SaaS provider, but it also
      concentrates recovery outcomes in Druva's control plane, cloud operations, and workload integrations.
      Product material describes seven-day rollback for deleted backup data and encryption, immutability,
      anomaly detection, and clean-recovery workflows. These are meaningful mitigations, not proof of
      achieved recovery objectives under a material attack. Financially, Forrester's composite model shows
      subscription fees increasing from $152,640 in Year 1 to $203,626 in Year 3 as storage grows; the model
      is illustrative, commissioned, and not Druva corporate revenue or margin disclosure. Investors should
      separate customer ROI modeling from Druva's own unit economics, cash needs, and runway.
    claimRefs: [CR001, CR002, CR007, CR008, CR011, CR013, CR015]
    tableRefs: [TR002]
  - id: dependencies-monitoring-and-kill-criteria
    title: Dependencies, monitoring, and thesis-break triggers
    body: >-
      Historical company-issued material says the platform is built on AWS, while current product material
      describes Microsoft Storage for the Backup Express option and partner commentary emphasizes the
      shared-responsibility model. These dependencies are ordinary for cloud software but material for a
      resilience vendor because regional cloud failures, API changes, throttling, identity compromise, or
      unfavorable infrastructure economics can affect service quality and gross margin at the same time.
      Monthly diligence should monitor recovery-test pass rates, achieved RPO and RTO by workload, material
      incidents, support escalations, cloud concentration, storage growth, renewal pricing, and certification
      exceptions. A failed independent recovery test, an unresolved material control incident, or unacceptable
      AWS or Microsoft resilience terms should break a low-residual-risk thesis.
    claimRefs: [CR004, CR005, CR009, CR012, CR014, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Rule or area
      - Jurisdiction
      - Evidence status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Privacy, security, and data residency
        - Global and customer-specific
        - Company material claims GDPR, CCPA, HIPAA, FedRAMP, SOC, ISO 27001, and PCI DSS support
        - Medium
        - High
        - Encryption, regional storage, governance policies, and audit logging are described
        - Current scope, exceptions, subprocessors, and operating effectiveness are not independently verified
        - Obtain current SOC reports, certification letters, data maps, subprocessors, DPAs, and exception logs
      - - Legal hold, eDiscovery, and defensible deletion
        - Litigation and regulatory discovery regimes
        - Product capabilities are described in Druva-issued material
        - Medium
        - High
        - Legal hold, chain of custody, federated search, and deletion workflows are represented
        - Configuration or workflow failure could impair preservation, production, or deletion obligations
        - Run counsel-led hold, export, chain-of-custody, and deletion tests on representative workloads
      - - Claims, enforcement, and certification disputes
        - United States and other operating jurisdictions
        - No regulator, court, or enforcement record is present in the assigned evidence pool
        - Unknown
        - High
        - Public compliance positioning and commissioned assurance material provide limited mitigation
        - Absence from this pool is not evidence of absence; undisclosed matters could change the risk view
        - Request litigation and regulator schedules, audit-management letters, and five-year incident attestations
    notes: >-
      Partial enumeration of material legal and regulatory areas supported by the assigned source pool;
      likelihood reflects evidence quality, not a finding that a violation or proceeding occurred.
    enumerationScope:
      coverage: partial
      basis: >-
        Material regulatory and legal areas visible in the eight assigned prefetched sources as of 2026-10-10.
    claimRefs: [CR003, CR004, CR008, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Recovery controls fail or restore contaminated data during a material attack
        - Unknown
        - Critical
        - Documented product controls, but no independent current test evidence in the pool
        - High until workload-level clean-recovery tests and achieved RPO/RTO are reviewed
        - Independent recovery results, exception rates, and attack-simulation evidence
      - - Druva control-plane, identity, or operator compromise impairs backup access
        - Unknown
        - High
        - Encryption, immutability, anomaly detection, audit logs, and rollback are described
        - Medium-high because operating effectiveness and incident telemetry are not independently verified
        - Current SOC exceptions, privileged-access review, incident history, and rollback test results
      - - SaaS or workload integration changes cause backup gaps or throttling
        - Medium
        - High
        - Druva describes auxiliary services, policy automation, and centralized monitoring
        - Medium because Microsoft and other workload behavior remains outside Druva's sole control
        - Backup-success distributions, API-throttling history, disconnected-agent rates, and SLA credits
      - - Storage growth and implementation needs raise customer economics
        - Medium
        - Medium
        - Consumption pricing and managed operations can reduce hardware work
        - Medium because the commissioned composite's subscription costs rise with stored data
        - Cohort pricing, storage growth, renewal uplifts, implementation overruns, and gross-margin sensitivity
    notes: >-
      Severity and likelihood are analytical assessments constrained by company and commissioned evidence;
      no incident frequency denominator or current SLA-performance series was available.
    claimRefs: [CR001, CR002, CR005, CR007, CR008, CR011, CR013, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Public-cloud infrastructure
        - AWS
        - Historical company material says the platform is built on AWS
        - Material but not quantified
        - Regional failure, identity compromise, service change, or unfavorable unit economics
        - High
        - SaaS operations, air-gapped design claims, and multi-region diligence
        - Current architecture, failover evidence, contracts, and cost concentration are undisclosed
      - - Microsoft workload and storage ecosystem
        - Microsoft
        - APIs, Microsoft 365 workloads, Entra ID, and Backup Express storage
        - Material for covered Microsoft workloads; revenue share is unknown
        - API throttling, permission drift, service change, or storage-bound recovery constraint
        - High
        - Auxiliary services, policy controls, alternate recovery workflows, and customer choice are described
        - Achieved workload-level RPO/RTO and dependency economics are not independently verified
      - - Route-to-market and proof channels
        - Advisors, commissioned analysts, and ecosystem partners
        - Demand generation, implementation, and external validation
        - Unknown
        - Promotional evidence overstates repeatable outcomes or partner execution varies
        - Medium
        - Named customer interviews and direct contract sampling can test claims
        - Current partner-sourced revenue, concentration, service quality, and churn are unavailable
    notes: >-
      Dependency concentration is qualitative because the assigned evidence discloses architecture and
      workload relationships but not counterparty revenue shares, contract terms, or concentration percentages.
    claimRefs: [CR004, CR006, CR008, CR009, CR012, CR014, CR015]
figures:
  - id: FR001
    title: Risk heatmap — consequence, evidence, and mitigation maturity
    type: matrix
    summary: >-
      Residual severity remains highest where Druva documents controls but current independent operating evidence is absent.
    data:
      columns:
        - label: Impact
        - label: Evidence on likelihood
        - label: Mitigation maturity
      rows:
        - label: Independent assurance gap
          values:
            - label: High
              tone: high
            - label: Unknown
              tone: warning
              detail: No regulator, court, incident, or current independent recovery record is in the assigned pool.
            - label: Partial
              tone: warning
              detail: Commissioned analyst and partner material supplements company assertions.
        - label: Recovery and control failure
          values:
            - label: Critical
              tone: critical
            - label: Unknown
              tone: warning
              detail: Product controls are described without a current failure-rate denominator.
            - label: Documented
              tone: medium
              detail: Immutability, anomaly detection, audit logging, and rollback are represented.
        - label: Cloud and workload dependency
          values:
            - label: High
              tone: high
            - label: Medium
              tone: medium
              detail: AWS and Microsoft dependencies are documented, while concentration is not quantified.
            - label: Partial
              tone: warning
              detail: Failover performance and contractual protections require diligence.
        - label: Financial-model opacity
          values:
            - label: High
              tone: high
            - label: Unknown
              tone: warning
              detail: Historical financing and customer ROI modeling do not disclose current company economics.
            - label: Low visibility
              tone: high
              detail: Current cash, burn, margin, runway, and dependency cost shares are unavailable.
        - label: Regulatory operating effectiveness
          values:
            - label: High
              tone: high
            - label: Unknown
              tone: warning
              detail: Claimed frameworks are not accompanied by current audit findings in the assigned pool.
            - label: Documented claims
              tone: medium
              detail: Company and partner material describe certifications, policies, and governance features.
        - label: Autonomous AI operational drift
          values:
            - label: High
              tone: high
            - label: Emerging
              tone: warning
              detail: Druva identifies over-permissioned and misconfigured agents as machine-speed risks.
            - label: Conceptual
              tone: warning
              detail: The pool contains product positioning rather than independent production outcomes.
    approximationNotes: >-
      Qualitative heatmap based only on assigned prefetched evidence; it does not estimate incident frequency or loss magnitude.
    claimRefs: [CR002, CR005, CR007, CR008, CR009, CR011, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Thesis-break conditions
    body: >-
      Do not underwrite low residual risk if an independent recovery exercise misses contracted objectives,
      a material control incident remains unresolved, or cloud-platform terms no longer support acceptable
      resilience and economics.
    claimRefs: [CR016]
