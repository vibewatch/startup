companyProfile:
  summary: >-
    Druva is a private cloud-native data protection and cyber-resilience platform that serves enterprise backup,
    disaster recovery, governance, and SaaS protection workloads across endpoints, cloud infrastructure, and
    collaboration suites. The company combines a fully managed AWS-hosted SaaS architecture with managed recovery and
    AI-resilience features, but private-company disclosure opacity still limits confidence in current margins,
    retention, and valuation.
