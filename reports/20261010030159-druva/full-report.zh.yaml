      - number: '7.4'
        title: 依赖、监控与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              历史公司材料称平台构建在 AWS 上，而当前产品材料介绍 Backup Express 选项使用 Microsoft
              Storage，合作伙伴评论则强调共同责任模型。这些依赖对云软件很常见，但对韧性供应商影响重大：区域云故障、API
              变更、限流、身份泄露或不利的基础设施经济性，可能同时影响服务质量和毛利率。每月尽调应监测恢复测试通过率、按工作负载统计的实际 RPO 和
              RTO、重大事故、支持升级、云集中度、存储增长、续约定价和认证例外。若独立恢复测试失败、重大控制事故未解决，或 AWS、Microsoft 的韧性条款不可接受，就应打破低剩余风险论点。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
              - CR014
              - CR016
