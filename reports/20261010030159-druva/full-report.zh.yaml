figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从 2008 年创立到 2026 年 AI Resilience 发布期间的关键运营、技术、融资和产品里程碑。
    data:
      items:
        - label: 2008：在 Pune 创立公司
          date: '2008'
          detail: Jaspreet Singh、Milind Borate 和 Ramani Kothandaraman 创立 Druva，提供企业存储和备份软件。
          tone: neutral
        - label: 2010：A 轮融资
          date: 2010-04
          detail: Druva 获得 Nexus Venture Partners 的 $5M A 轮融资，用于扩展企业备份软件。
          tone: positive
        - label: 2013-2014：架构转向云 SaaS
          date: '2013'
          detail: 管理层放弃 ARR 为 $10M 的本地设备业务，100% 转向 AWS 上的云原生 SaaS。
          tone: positive
        - label: 2019：凭 G 轮融资成为独角兽
          date: 2019-06
          detail: Druva 完成由 Viking Global Investors 领投的 $130M G 轮融资，估值达到 $870M，收入运行率超过 $100M。
          tone: positive
        - label: 2021：$147M H 轮融资，估值 $2B
          date: 2021-04
          detail: 完成由 CDPQ 和 Neuberger Berman 领投的 $147M H 轮融资，Druva 估值超过 $2B。
          tone: positive
        - label: 2022：与 Dell Technologies 建立战略联盟
          date: '2022'
          detail: Dell 选择 Druva Cloud Platform，为其 Dell APEX Backup Services 多云数据保护方案提供支持。
          tone: positive
        - label: 2023：SaaS ARR 达到 $200M 里程碑
          date: 2023-08
          detail: Druva 正式宣布 SaaS 年经常性收入超过 $200M，企业客户超过 5,000 家。
          tone: positive
        - label: 2026：发布 AI Resilience 与智能代理保护
          date: 2026-07
          detail: 发布 Druva AI Resilience 平台，保护 Microsoft Copilot、Claude Code、Druva MCP，并推出 Dru SRE Agent。
          tone: positive
    approximationNotes: 里程碑反映公开宣布的融资轮次、产品发布和战略合作协议。
    claimRefs:
      - CO013
      - CO014
      - CO015
  - id: FM001
    title: 受证据约束的市场规模阶梯
    type: pyramid
    summary: 定性的边界阶梯，将广泛的企业数据活动与 Druva 可触达的工作负载及未量化的可获取份额区分开。
    data:
      items:
        - label: 企业数据资产
          valueNote: 未量化
          detail: 终端、SaaS 应用、云工作负载、数据中心系统、身份和生产数据；其中大部分支出不属于备份。
        - label: 备份与数据保护
          valueNote: 未量化
          detail: 备份、受保护留存、灾难恢复和治理，而非主应用或主存储。
        - label: 云交付的数据保护
          valueNote: 未量化
          detail: 托管云备份和恢复；历史预测显示迁移方向，但不代表当前市场价值。
        - label: Druva 可触达的工作负载类别
          valueNote: 未量化
          detail: 终端、SaaS 应用、云和数据中心工作负载，以及当前的网络与身份韧性定位。
        - label: 可服务的采购路径
          valueNote: 未量化
          detail: 在安全、留存、迁移和服务要求匹配时，通过报价制企业合同和公共部门框架进入。
        - label: 可获取的 Druva 份额
          valueNote: Unknown
          detail: 需要当前品类支出、符合条件的买家数量、工作负载组合、赢单率、留存率及 Druva 当前分部收入。
    approximationNotes: 这不代表任何数值面积、比例、TAM、SAM、SOM 或市场份额；指定证据池仅支持边界序列。
