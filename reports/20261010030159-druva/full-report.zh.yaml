companyProfile:
  summary: >-
    Druva 是一家私有云原生数据保护与网络韧性平台，服务于企业备份、灾难恢复、治理和 SaaS 保护场景，覆盖终端、云基础设施和协作套件。公司将完全托管、由 AWS 承载的 SaaS 架构与托管恢复及 AI
    韧性功能结合起来，但私营公司披露不透明，仍限制了对当前利润率、留存率和估值的判断。
