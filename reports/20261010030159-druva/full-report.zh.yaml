chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创办根基与架构转型
        blocks:
          - type: paragraph
            body: >-
              Druva 由 Jaspreet Singh、Milind Borate 和 Ramani Kothandaraman 于 2008 年共同创办，在印度 Pune 设有运营中心，并将公司总部设于加州 Santa
              Clara 和 Sunnyvale。公司最初是传统的本地部署备份软件及硬件设备供应商。2013 至 2014 年间，管理层果断转型，放弃已有的 $10 million 年度经常性收入，将整个产品套件重构为运行在
              Amazon Web Services 上的 100% 云原生软件即服务架构。这次架构转型消除了传统存储设备相关的采购、维护和打补丁负担，为现代企业 IT 组织带来了预计 30% 至 50% 的总拥有成本降幅。
            claimRefs:
              - CO001
              - CO002
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: 高管领导、治理与关键人物架构
        blocks:
          - type: paragraph
            body: >-
              Druva 的高管体系以创始人兼首席执行官 Jaspreet Singh 为核心；在十八年的运营扩张中，他一直主导公司战略、技术路线和资本配置。联合创始人 Milind Borate
              为分布式存储系统和企业数据韧性贡献了基础架构能力。在运营和财务端，首席运营及财务官 Mahesh Patel
              主导了从永久许可到按用量付费定价的商业转型，使客户支出与数据摄入量相匹配。核心领导层整体留任稳定，但战略决策和对外布道仍高度集中在创始人 CEO 身上。
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: 资本结构、投资者联盟与战略合作
        blocks:
          - type: paragraph
            body: >-
              自 2010 年以来，Druva 已通过八轮披露的投资融资累计筹得约 $475 million 的机构风险资本和私募股权融资。2019 年 6 月，公司在 Viking Global Investors 领投的
              $130 million Series G 融资后达到独角兽地位，估值为 $870 million。2021 年 4 月，Druva 获得由 Caisse de dépôt et placement du
              Québec (CDPQ) 和 Neuberger Berman 共同领投的 $147 million Series H 融资，形成超过 $2 billion 的投后估值基准。除财务投资者外，Druva 还与
              Amazon Web Services 维持关键战略联盟，整个平台均运行在其基础设施上；同时与 Dell Technologies 合作，将 Druva Cloud Platform 作为 Dell APEX
              Backup Services 的底层运营引擎。
            claimRefs:
              - CO005
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO005
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: 运营规模、财务轨迹与 AI 韧性演进
        blocks:
          - type: paragraph
            body: >-
              Druva 宣布 2023 年 8 月 SaaS 年度经常性收入超过 $200 million，同时客户同比增长 30%，年化备份操作量超过 60 亿次。第三方研究机构 GetLatka 估计，Druva
              2024 年底的收入运行率为 $304.3 million，但公司尚未公布经审计的 GAAP 财务报表。Affluense 汇总的印度独立实体申报显示，由于全球研发和市场拓展支出，Druva 直到 FY23
              都处于净利润为负、经营利润率为负的状态。2026 年 7 月，Druva 推出 AI Resilience 能力，将平台扩展到代理式网络安全，保护 Microsoft Copilot、Claude
              Code、Druva Model Context Protocol (MCP) 以及 Dru SRE Agent，覆盖近 7,500 家企业客户。
            claimRefs:
