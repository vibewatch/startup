          - type: paragraph
            body: >-
              Druva 发布的材料声称支持 GDPR、CCPA、HIPAA、FedRAMP、SOC、ISO 27001 和 PCI DSS，Cyber Advisors 的文章也重复了合规和 GovCloud
              定位。这些说法描述的是产品能力和声称具备的认证，并不能证明每项控制当前的范围、例外、审计发现或运营有效性。证据还描述了法律保留、电子取证、留存和可辩护删除功能；这些是相关缓解措施，但会在不同司法辖区和客户配置下产生执行义务。在评估低监管风险之前，应取得最新审计报告、认证边界、数据驻留地图、子处理方、DPA
              条款、重大索赔或执法历史，并验证删除和法律保留工作流是否按描述运行。
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR015
          - type: table
