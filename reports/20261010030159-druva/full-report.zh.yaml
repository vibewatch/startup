      - number: '7.3'
        title: 运营、安全与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Druva 的架构将设备维护转移给托管 SaaS 提供商，但也把恢复结果集中到 Druva
              的控制平面、云运营和工作负载集成上。产品材料描述了已删除备份数据的七天回滚，以及加密、不可变性、异常检测和干净恢复工作流。这些是有意义的缓解措施，但不能证明重大攻击下已经实现恢复目标。财务上，Forrester
              综合模型显示，随着存储增长，订阅费从第 1 年的 $152,640 增至第 3 年的 $203,626；该模型是示意性的、受委托编制的，不是 Druva 的公司收入或利润率披露。投资者应将客户 ROI 模型与
              Druva 自身的单位经济、现金需求和现金跑道分开。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR011
              - CR013
              - CR015
