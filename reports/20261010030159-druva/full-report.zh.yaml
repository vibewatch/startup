    claimRefs:
      - CP001
      - CP002
      - CP009
      - CP013
      - CP014
    data:
      points:
        - label: Druva
          x: 9
          'y': 7.5
          tone: positive
          detail: 在 AWS 上 100% 交付 SaaS，客户无需管理备份基础设施；终端和 M365 保护能力领先。
        - label: Rubrik
          x: 4.5
          'y': 8.5
          tone: neutral
          detail: 网络韧性和 API 自动化能力强，但需要客户集群基础设施，且总拥有成本更高。
        - label: Cohesity
          x: 4
          'y': 8.2
          tone: neutral
          detail: 融合备份与分析的超融合二级存储平台；需要管理较大的基础设施足迹。
        - label: Veeam
          x: 3.5
          'y': 8
          tone: neutral
          detail: 市场成熟厂商，虚拟化能力深厚；需要客户提供硬件、代理和存储。
        - label: Commvault
          x: 3
          'y': 8.8
          tone: neutral
          detail: 覆盖传统数据库和磁带等广泛企业工作负载，但运营配置复杂。
        - label: Bacula Enterprise
          x: 2
          'y': 6.5
          tone: opportunity
          detail: 模块化开放核心平台，不收取按容量计费，适合技术能力强的 Linux 环境。
  - id: FI001
    title: Druva 客户活动到毛利转换桥
    type: flow
    summary: 概念性流程展示企业数据生成如何通过 Druva SaaS 订阅转化为毛贡献利润率。
    data:
