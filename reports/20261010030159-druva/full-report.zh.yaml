              MetaGraph 将备份元数据组织成持续运行、租户隔离的关系图。该图谱持续映射用户身份、文件访问权限、工作负载和时点快照之间的连接，加快事件期间的影响范围识别与可疑访问追踪。运行在这层元数据之上的是
