        title: 展示项
        blocks:
          - type: callout
            title: 论点破坏条件
            body: 如果独立恢复演练未达到合同目标、重大控制事故仍未解决，或云平台条款不再支持可接受的韧性和经济性，就不要将剩余风险评估为低。
            calloutType: risk
