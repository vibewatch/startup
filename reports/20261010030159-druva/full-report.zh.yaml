  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              我们的投资论点认可 Druva 是网络韧性、备份和自动化威胁恢复市场中已站稳脚跟的云原生先行者。Druva 2008 年创立于 Pune、总部位于 Santa Clara；截至 2024
              年底，估计年度经常性收入运行率达到 $304.3M，真实企业客户基础超过 1,300 名员工，并拥有多个全球运营实体。公司坚持在 Amazon Web Services 上提供完全托管的
              Resilience-as-a-Service，消除了本地设备摩擦，使其在企业将混合工作负载、终端、Microsoft 365 和 AI
              模型迁移到云环境时占据有利位置。反论点则集中在极度不透明的估值和长期缺乏流动性。Druva 最近一次股权融资发生在 2021 年 4 月，由 CDPQ 领投的 $147M Series H，投后估值为
              $2.0B。五年多来，公司没有经验证的二级清算基准、409A 普通股估值或经审计 GAAP 申报，因此公开市场没有证据证明，在 Rubrik 等上市玩家和 Cohesity
              等私营整合者竞争加剧之际，历史企业价值倍数仍然站得住。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              Druva 的资本化历史显示，自成立以来通过十轮融资累计筹得 $475M：从早期风险资本轮，到 2019 年 6 月 Viking Global Investors 领投、估值 $1.0B 的 $130M
              Series G，再到 2021 年 4 月投后估值 $2.0B 的 $147M Series H。Series H 交易隐含的收入倍数约为 10x 至
              15x，处于云软件估值倍数的历史高峰。然而，当前私营公司聚合平台和二级市场观察显示，近期完全没有价格发现。在缺乏透明的清算优先权安排、高级优先股参与权或最新收入增长桥接数据时，$2.0B
              名义基准必须高度审慎看待。缺少公开申报使外部分析师只能依赖 GetLatka 的 $304.3M 估计，以及 Druva Data Solutions Private Limited 的印度法定申报；后者报告
              FY25 收入介于 ₹100 Cr 和 ₹500 Cr 之间，并有 753 名印度员工。这种全球结构分化说明公司能够利用大量离岸工程资源，但无法提供合并口径 GAAP 经审计净留存率或毛利率透明度。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: 估值情景与可比基准
        blocks:
          - type: paragraph
            body: >-
              为设定有纪律的进入参数，我们基于相关上市和私营同业评估三个前瞻估值情景，重点参考 Rubrik（其 IPO 筹得 $553M 并获得较高市值）、Veeam 和 Cohesity。在乐观情景中，Druva
              在云原生数据库、终端群和新兴 AI 工作负载中加速采用 SaaS 韧性方案，ARR 持续以 20% 的年增长率扩张至 $365M，并以 6.0x 的前瞻 ARR 倍数交易，对应约 $2.19B
              企业价值。基准情景假设中端市场企业备份维持稳定，ARR 以适度 10% 的速度增长至 $335M，但倍数收缩至 3.5x ARR，得到 $1.17B
              的公允企业价值。悲观情景下，超大规模云厂商原生备份工具和集成平台竞争者不断侵蚀市场，将收入增长限制在低个位数；同时，历史优先股清算悬置压缩普通股价值，导致处于困境的 2.0x 倍数和 $600M
              估值。因此，当前二级市场定价预期必须相对于 2021 年 Series H 基准计入显著折价。
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 建议、决策逻辑与尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合评估产品韧性与严重披露缺口，我们建议以中等信心维持跟踪，同时给予高风险评级，估值判断为公允至不确定。Druva 的核心技术和 AWS 原生架构，确实能为寻求简化勒索软件恢复和网络防御的中端市场及企业 IT
              组织提供价值。然而，在没有一级股权结构透明度、经验证的流失数据或经认证的 2024—2026
              年收入桥接数据前进入股权投资，将违背基本投资评估纪律。在部署任何资本前，我们提出严格的尽调要求：第一，提供经审计的合并财务报表，详细列示 GAAP 收入、毛利率和净留存率；第二，提供完整的优先股清算优先权安排和
              409A 估值报告；第三，提供经验证的单位经济及 AWS 托管毛利率；第四，提供渠道伙伴和 MSP 的客户集中度指标。任何增长放缓至 10%
              以下的迹象，或高级优先权悬置超过企业总价值，都构成即时的论点破坏触发条件。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 估值纪律需要最新一级披露
            body: 投资者不应仅凭 Druva 历史上的 $2.0B Series H 估值买入老股。管理层尚未披露经审计的 GAAP 收入桥接、NRR 指标和清算优先权之前，投资判断必须假设可比公司估值倍数会压缩。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV015
          - type: callout
            title: 流动性迟滞与资本悬垂
            body: Druva 运营 18 年、十轮融资共募得 $475M，却既未提交 IPO 申请，也没有明确的退出事件；对后期投资者而言，持有期和流动性风险都很高。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV012
