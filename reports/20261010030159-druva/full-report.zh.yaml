  - id: FE001
    title: Druva Resilience Cloud 架构栈
    type: stack
    summary: 六层架构栈展示数据如何从工作负载客户端和代理，经 AWS 存储层流向 Dru MetaGraph 及受监督的 DruAI 代理。
    data:
      layers:
        - label: 应用与界面层
          modules:
            - Druva Cloud Platform 管理控制台
            - DruAI 对话式助手界面
            - Google SecOps 与 SIEM REST API 导出器
        - label: 智能代理 AI 执行层
          modules:
            - 内容聚合数据代理
            - 带用户确认闸门的行动代理
            - 多能力协调监督代理
        - label: 元数据智能层
          modules:
            - Dru MetaGraph 租户隔离图数据库
            - 身份与权限关系索引
            - 跨工作负载爆炸半径分析
        - label: 安全与控制平面
          modules:
            - OAuth 2.0 集成中心
            - 基于角色的访问控制（管理员与只读）
            - 信封加密与密钥管理
        - label: 摄取与混合代理层
          modules:
            - VMware 本地备份代理（OVA）
            - 面向云工作负载的 AWS VPC 内 EC2 代理
            - 终端 InSync 客户端代理
        - label: 云存储基础层
          modules:
            - Amazon S3 Standard 存储层
            - Amazon S3 Glacier Deep Archive 存储层
            - 从 EBS 快照实时故障切换至 Amazon EC2
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图：落地并扩张的韧性生命周期
    type: journey-map
    summary: 客户从单一工作负载 SaaS 和终端备份，逐步扩展到跨云数据韧性和自主 AI 治理。
    data:
      items:
        - label: 发现与采购
          stage: 发现与采购
          touchpoints:
            - 评估 Microsoft 365 和 Google Workspace 的 SaaS 备份
            - 通过 AWS Marketplace 或区域 MSP 进行云市场采购
          actor: IT 基础设施经理
          barrier: Legacy backup contracts and backup appliance amortization
        - label: 初始部署（落地）
          stage: 初始部署（落地）
          touchpoints:
            - 配置云原生无代理备份
            - 在笔记本电脑和远程员工群体中部署终端保护
          actor: 系统管理员
          barrier: Network bandwidth throttling and initial data indexing time
        - label: 运营集成
          stage: 运营集成
          touchpoints:
            - 与企业身份（SSO、SCIM）和 SIEM 工具集成
            - 客户成功工程师负责入职和故障排查
          actor: 客户成功与安全运营
          barrier: Complex hybrid infrastructure (Hyper-V, VMware on-premises)
        - label: 工作负载扩张
          stage: 工作负载扩张
          touchpoints:
            - 增加云基础设施工作负载（AWS EC2、RDS、S3、Azure）
            - 部署 Salesforce 和非结构化 NAS 文件保护
          actor: 云架构师
          barrier: Budget allocation across disparate infrastructure and application owners
        - label: 网络韧性与灾难恢复
          stage: 网络韧性与灾难恢复
          touchpoints:
            - 威胁狩猎和勒索软件恢复测试
            - 气隙网络恢复编排
          actor: CISO 与安全事件响应
          barrier: Testing frequency constraints and multi-party signoff
        - label: AI 治理与自主韧性
          stage: AI 治理与自主韧性
          touchpoints:
            - 部署 Claude 和 Microsoft 365 Copilot 治理
            - DruAI 多代理调查与恢复辅助
          actor: 企业 AI 副总裁与首席合规官
          barrier: Uncertain enterprise AI governance policies and model trust
    approximationNotes: 旅程阶段代表在 Druva 部署和分析师框架中观察到的常见企业演进模式。
    claimRefs:
      - CU005
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图——后果、证据与缓解成熟度
    type: matrix
    summary: 在 Druva 已记录控制措施但缺乏当前独立运营证据的领域，残余严重性最高。
    data:
      columns:
        - label: 影响
        - label: 关于可能性的证据
        - label: 缓解措施成熟度
      rows:
        - label: 独立保证缺口
          values:
            - label: 高
              tone: high
            - label: Unknown
              tone: warning
              detail: 指定证据池中没有监管机构、法院、事件或当前独立恢复记录。
            - label: 部分
              tone: warning
              detail: 委托分析师和伙伴材料补充了公司主张。
        - label: 恢复与控制失效
          values:
            - label: 严重
              tone: critical
            - label: Unknown
              tone: warning
              detail: 已描述产品控制，但没有当前失败率分母。
            - label: 已记录
              tone: medium
              detail: 已体现不可变性、异常检测、审计日志和回滚。
        - label: 云与工作负载依赖
          values:
            - label: 高
              tone: high
            - label: 中
              tone: medium
              detail: AWS 和 Microsoft 依赖已有记录，但集中度未量化。
            - label: 部分
              tone: warning
              detail: 故障切换表现和合同保护措施仍需尽调。
        - label: 财务模型不透明
          values:
            - label: 高
              tone: high
            - label: Unknown
              tone: warning
              detail: 历史融资和客户 ROI 模型未披露当前公司经济性。
            - label: 可见性低
              tone: high
              detail: 当前现金、烧钱、利润率、现金跑道和依赖成本分摊不可得。
        - label: 监管运营有效性
          values:
            - label: 高
              tone: high
            - label: Unknown
              tone: warning
              detail: 指定证据池中，所称框架没有当前审计发现相伴。
            - label: 已记录的主张
              tone: medium
              detail: 公司和伙伴材料描述了认证、政策和治理功能。
        - label: 自主 AI 运营漂移
          values:
            - label: 高
              tone: high
            - label: 新出现
              tone: warning
              detail: Druva 将权限过宽和配置错误的代理识别为机器速度下的风险。
            - label: 概念性
              tone: warning
              detail: 证据池包含产品定位，而非独立的生产环境结果。
    approximationNotes: 定性热力图仅基于指定的预取证据；不估计事件频率或损失规模。
    claimRefs:
