chapter:
  number: 2
  title: Market Analysis
  summary: |
    The global Managed Detection and Response (MDR) market is a high-growth segment of enterprise
    cybersecurity services, estimated by analysts at $3.46–$6.28 billion in revenue in 2026 and
    forecast to reach $8.57–$19.01 billion by 2030–2031 at CAGRs ranging from 15% to 25% depending
    on scope and methodology. Conflicting estimates reflect boundary disagreements—primarily whether
    Managed XDR, SOC-as-a-Service, and adjacent managed security services are included—and the
    absence of audited public revenue for most private-company vendors. Three structural demand
    drivers are converging to accelerate adoption: a global cybersecurity talent deficit of
    approximately 4.8 million unfilled roles, a broadening regulatory compliance mandate (CMMC,
    HIPAA, SEC cyber rules, PCI DSS 4.0), and the shift to AI/automation-enabled security operations
    that allow MDR providers to deliver enterprise-grade outcomes at mid-market price points.
    Deepwatch targets the commercial mid-market and enterprise segments with a SIEM-agnostic
    Bring Your Own Technology (BYOT) model covering Splunk, Microsoft Sentinel, Google SecOps, and
    Securonix—a positioning that reduces switching friction and addresses the SIEM capability gap,
    but excludes the federal-grade tier requiring FedRAMP authorization and U.S.-citizen analyst
    staffing constraints.

sections:
  - id: s1
    title: Market Definition and Scope
    body: |
      Managed Detection and Response (MDR) is a contracted, remotely delivered security operations
      service that provides continuous threat monitoring, detection, investigation, and active
      response—including threat containment and mitigation—on behalf of the subscriber organization.
      The defining characteristic, emphasized by Gartner in its October 2025 Market Guide, is that
      true MDR is human-led: skilled analysts investigate and respond in context, distinguishing MDR
      from pure tool management or alert forwarding. Technology—EDR/XDR platforms, SIEM, UEBA,
      automation playbooks—is necessary but not sufficient; MDR value requires analyst judgment,
      threat-hunting cadences, and business-contextualized findings.

      The MDR market boundary includes revenues from 24/7 threat monitoring and investigation,
      detection engineering, incident response and containment, threat hunting, and managed threat
      exposure functions delivered as an outsourced service. It excludes standalone endpoint
      detection products (e.g., raw EDR licenses sold without managed analyst coverage), managed
      SIEM licensing without response capability, pure professional services engagements such as
      standalone incident response retainers, and in-house SOC labor costs. The boundary matters
      for sizing: market research firms differ on whether Managed XDR (MXDR) and SOC-as-a-Service
      are sub-segments of MDR or separate categories, which is a primary reason for the wide
      spread in published market-size estimates.

      Status-quo alternatives—what buyers do instead of MDR—include building an internal Security
      Operations Center (staffed 24/7 at a floor cost of $1.2M–$1.8M per year in labor alone plus
      technology), engaging a traditional Managed Security Service Provider (MSSP) for log
      forwarding and alert generation without active response, platform-led managed services bundled
      with an EDR vendor (e.g., CrowdStrike Falcon Complete, SentinelOne Vigilance Respond), and
      doing nothing—accepting incomplete after-hours coverage. MDR is differentiated from MSSP by
      the human-led response obligation; MSSP contracts typically include alert notification but
      not containment.
