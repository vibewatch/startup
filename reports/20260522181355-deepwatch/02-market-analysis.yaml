  - id: s2
    title: Market Sizing — Multiple Lenses and Evidence Gaps
    body: |
      Published estimates for the MDR market vary substantially because of differing scope
      definitions and methodologies. The Business Research Company places the 2025 market at
      $3.46 billion growing to $4.16 billion in 2026 at a CAGR of 20.3%, and $8.57 billion
      by 2030 at a CAGR of 19.8%. Mordor Intelligence is notably higher, estimating $4.19 billion
      in 2025 growing to $5.09 billion in 2026 and $13.45 billion by 2031 at a CAGR of 21.45%.
      MarketsandMarkets is the most aggressive, projecting $6.28 billion in 2026 and $19.01 billion
      by 2031 at a CAGR of 24.8%. Precedence Research is the most conservative, estimating
      $3.40 billion in 2025, $3.92 billion in 2026, and $13.90 billion by 2035 at a CAGR of
      15.12%. Expert Insights' 2025 data compilation cites $4.32 billion in 2024 and $15.3 billion
      projected by 2030 at a CAGR of 23.5%.

      The North America regional market is consistently reported as the largest geography, with
      share estimates ranging from 36.7% (MarketsandMarkets for 2026) to 45.78% (Mordor for 2025)
      to 46% (Precedence Research for 2025). Asia-Pacific is universally identified as the
      fastest-growing region, with Mordor reporting a 25.48% CAGR through 2031. Vertical
      concentration is consistent across sources: Banking, Financial Services, and Insurance (BFSI)
      holds the largest share (28.74% per Mordor for 2025), followed by IT and Telecom. Healthcare
      is identified as the fastest-growing vertical by Mordor (23.60% CAGR through 2031).

      A SAM and SOM estimate for Deepwatch's specific position cannot be reliably constructed
      from public data: no analyst firm publicly disaggregates the MDR market by vendor tier
      (federal-grade, enterprise, mid-market, SMB), pricing model, or SIEM-agnostic vs.
      platform-led architecture. Deepwatch's own ARR and customer count are not disclosed.
      Evidence gaps on the SAM and SOM are material and are documented in the evidenceGaps
      section below.
