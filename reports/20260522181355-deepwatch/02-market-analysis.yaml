callouts:
  - calloutType: insight
    title: Market sizing disagreement is structural, not statistical
    body: >-
      The $3.92B–$6.28B spread in 2026 MDR market size estimates reflects competing definitions
      of market scope—not measurement error. Analysts who include MXDR, SOC-as-a-Service, and
      managed vulnerability management report a significantly larger market. Deepwatch's internal
      TAM likely mirrors the broader MXDR definition given the Dassana CTEM acquisition and
      NEXA AI ecosystem positioning, but no public source quantifies this precisely.
    claimRefs:
      - CM006
      - CM007
      - CM008

  - calloutType: risk
    title: Federal-grade tier is structurally inaccessible without FedRAMP
    body: >-
      CMMC enforcement is creating one of the fastest-growing demand pools in MDR: the defense
      supply chain requires 24/7 SOC and proactive threat hunting by October 2026. Deepwatch
      lacks FedRAMP authorization as of the research date, structurally excluding it from this
      segment. Without a FedRAMP roadmap, Deepwatch's TAM ceiling is capped below the total
      MDR market.
    claimRefs:
      - CM023
      - CM029
      - CM036

  - calloutType: strength
    title: BYOT strategy reduces switching friction across the largest SIEM platforms
    body: >-
      By supporting Splunk, Microsoft Sentinel, Google SecOps, and Securonix, Deepwatch
      addresses customers who have already made SIEM investments. This reduces the primary
      objection to MDR adoption (displacement of existing investment) and positions Deepwatch
      as SIEM-agnostic infrastructure rather than a competing platform vendor.
    claimRefs:
      - CM038
      - CM039

