summary:
  headline: >
    Deepwatch has credible AI-native MDR product-market fit and enterprise customer proof, but pervasive financial
    opacity, three CEOs in under two years, and workforce reductions that targeted core MDR delivery staff make this a
    high-risk tracking position rather than an actionable buy until financial and leadership clarity improves.
