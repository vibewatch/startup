      - number: '7.3'
        title: 运营与平台集中风险
        blocks:
          - type: paragraph
            body: >
              Deepwatch 的 Trust 页面明确称，其云基础设施完全托管在 Amazon Web Services（AWS）上。AWS 提供行业领先的正常运行时间 SLA 和多个可用区，但单一云依赖意味着 AWS
              宕机、配置错误或安全事件可能同时中断所有客户的 24/7 MDR 覆盖——对核心承诺是持续检测和响应的 MDR 服务商来说，这是最坏场景。Deepwatch 拥有 AWS Level 1 MSSP
              Competency，并借助 AWS 原生工具；集成更深，锁定效应也更深。公开资料没有记录多云故障切换或云无关架构。

              CrowdStrike 依赖同样显著。2024 年 9 月，Deepwatch 推出五个与 CrowdStrike Falcon 共同开发的 MDR 模块，使 Falcon 成为其托管检测产品中相当一部分的底层
              EDR 遥测层。2024 年 7 月 CrowdStrike Falcon 传感器宕机说明，超大规模 EDR 厂商也可能发生灾难性故障；类似事件会直接削弱 Deepwatch 面向 Falcon 客户的 MDR
              准确度。Splunk 仍是 Deepwatch 客户装机基础中的主导 SIEM；Deepwatch 现在也支持 Sentinel、Google SecOps 和 Securonix，但多数案例研究仍指向
              Splunk 环境。2025 年 2 月收购 Dassana 带来 CTEM 能力，也带来整合风险：Dassana 团队和代码库必须并入 NEXA AI 生态，同时还要交付商业 CTEM
              产品。收购后未公开发现任何生产环境 CTEM 客户案例研究。
