              CMMC 执法正在创造 MDR 中增长最快的需求池之一：到 2026 年 10 月，国防供应链需要 24/7 SOC 和主动威胁狩猎。截至研究日期， Deepwatch 缺少 FedRAMP
              授权，因此在结构上被排除在该细分市场之外。没有 FedRAMP 路线图，Deepwatch 的 TAM 上限会低于整个 MDR 市场。
