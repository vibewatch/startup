  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Deepwatch 的收入机制是订阅制、经常性管理安全服务，通过 Guardian MDR Platform 交付。企业客户支付年度合同费，覆盖 24x7x365 SOC 值守、检测工程、威胁狩猎，以及通过
              NEXA Agentic AI Ecosystem 进行的自动化调查。服务部署在客户既有 SIEM 之上——Splunk、Microsoft Sentinel、Google SecOps 或
              Securonix——让 Deepwatch 具备平台无关的「自带技术栈」（Bring Your Own Technology）定位，避免把客户锁进自有数据栈，也扩大可触达潜在客户池。


              平台分层包括 Core、Advanced、Enterprise 三版，各自增加增强响应深度、攻击面管理、扩展合作伙伴集成等能力；但 Deepwatch
              不在官网或任何公开文件披露标价。所有企业合同都通过销售主导动作直接议价，这符合上中端和大型企业 MDR 细分市场惯例。Vendr 的采购基准平台显示，Deepwatch 买方年度合同中位数约
              $315,000，观察到的交易规模约 $124,000 到 $476,000/年。这些数字体现标价到实际合同的波动，不是公开价目表；实际条款取决于席位数、所选服务、合同期限和谈判筹码。


              收入质量信号只能间接观察。Deepwatch 披露 2022 年销售同比增长 100%——也就是 Series C 前一年——并称同期超过三分之二客户扩展了服务，这是当时 NRR 高于 100%
              的强代理指标。2022 年之后留存和扩张率是延续还是压缩，公开渠道不得而知。Deepwatch 委托 Forrester Consulting 为其 MDR 平台制作 Total Economic Impact
              研究；企业 SaaS/服务公司常用这种方式为销售周期取得第三方 ROI 背书，但该研究不构成独立财务披露。MDR 服务的订阅/经常性属性、企业安全市场多年合同惯例，以及来自 SIEM
              集成的高切换成本，表明收入质量在结构上较高；但官方 ARR、流失率或 NRR 仍未披露。
