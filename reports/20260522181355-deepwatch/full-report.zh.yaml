  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 人员、领导层与劳动力执行风险
        blocks:
          - type: paragraph
            body: >
              Deepwatch 在不到两年内经历三任 CEO，这种高管更替速度即便按私募股权支持的 SaaS 标准也不寻常。Scott Thomas 带领公司完成 Series C 和初始扩张阶段。John DiLullo
              于 2024 年 7 月出任 CEO，被定位为转向企业 GTM 加速；任期不到一年。Brian Dhatt 曾任 DigitalOcean CTO 和 Okta VP Engineering，于 2026 年 5
              月 4 日被任命为 CEO，公告将这一过渡定位为转向「规模化自治 SOC」和 AI 主导交付。Dhatt 背景偏工程，与 NEXA 智能体 AI 路线图一致，但不同于 DiLullo 带来的 GTM 取向画像。

              最具运营意义的风险是 2025 年 11 月裁员 60–80 人，约占 Deepwatch 约 250 人团队的 25–30%。TechCrunch 报道裁员目标是分析师和运营岗位——正是支撑 Deepwatch
              差异化「具名分析师小队」交付模式的职能。官方理由是把资本转向 AI 投资，但 2026 年 1 月一条带反向语气的 Gartner Peer Insights 评论称裁员后出现内部服务中断。未发现公开 SLA
              违约、具名客户流失或分析师流失披露，但结构性敞口真实存在：Deepwatch 销售的是连续的人类 + AI 安全运营，人力层任何退化都会被客户直接看到。投资者必须在尽调中验证裁员后分析师/客户比和 SLA
              达成率。
