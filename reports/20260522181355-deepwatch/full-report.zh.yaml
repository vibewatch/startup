      - number: '2.5'
        title: Deepwatch 在 MDR、XDR 与 SOC 即服务中的定位
        blocks:
          - type: paragraph
            body: |
              Deepwatch 竞争所在的市场，被 Quzara 2026 MDR 市场指南划分为「商业平台无关 MDR」，同行包括 Arctic Wolf、
              eSentire、Red Canary、Expel、Pondurance 和 ReliaQuest。平台无关模式用平台主导供应商的紧密集成（CrowdStrike Falcon Complete、
              SentinelOne Vigilance）换取技术栈灵活性；对多 SIEM 企业，或不想标准化到单一安全平台供应商的企业来说，这是关键差异点。
              Deepwatch 在 2026 年 2 月新增 Securonix 支持，将 BYOT 策略扩展到四个 SIEM 平台，直接扩大了目标客户池：这些潜在客户已经投资主流
              SIEM，却缺少运营覆盖。

              相邻的扩展检测与响应（XDR）市场比 MDR 更宽，因为它统一端点、网络、云、身份和 OT/IoT 遥测；MarketsandMarkets
              预测该市场将从 2025 年 $7.92 billion 增至 2030 年 $30.86 billion，CAGR 为 31.2%。Deepwatch 2025 年 2 月收购 Dassana，
              由此获得持续威胁暴露管理（CTEM）能力，使平台站在 MDR 和主动式 XDR 的交叉点，也符合 Gartner 的预测：
              到 2028 年，50% 的 MDR 发现将包含威胁暴露细节。CTEM 能力是 MDR 层级中的一个差异点，但 Deepwatch 不是唯一追求 MXDR 邻近定位的平台。

              一个关键证据缺口是，公开分析师覆盖没有给出 Deepwatch 在 MDR 类别中的具体市场份额或收入排名。Gartner 2025 年 10 月 Market Guide for MDR
              列出代表性供应商，但不打分；Deepwatch 出现在名单上，说明市场有识别度，但不能量化份额。Deepwatch 在 2026 年 $4B–$6B MDR 市场中的 SAM，
              取决于商业（非联邦）价格点下、BYOT/不绑定 SIEM 供应商可触达的份额，而没有公开来源量化这一子分层。投资者应把本章市场规模数字视为宏观背景，
              而不是衡量 Deepwatch 渗透率的可靠分母。
