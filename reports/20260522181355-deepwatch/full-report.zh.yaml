          - type: callout
            title: BYOT 策略降低最大 SIEM 平台之间的切换摩擦
            body: >-
              通过支持 Splunk、Microsoft Sentinel、Google SecOps 和 Securonix，Deepwatch 覆盖了已经投入 SIEM 的客户。该策略降低了 MDR
              采用的首要反对理由（替换既有投资），并把 Deepwatch 定位成不绑定 SIEM 的基础设施，而不是一个竞争性平台供应商。
