      - number: '7.4'
        title: 财务不透明与投资风险
        blocks:
          - type: paragraph
            body: >
              Deepwatch 是私营公司，没有义务披露财务指标。截至本报告运行日，公司未公开发布 ARR、收入、毛利率、EBITDA、客户数、GRR、NRR、NPS 或流失率数据。公司 2023 年 2 月从
              Francisco Partners、Vista Credit Partners 和 ABS Capital 融资 $180M。此后未公开披露后续融资、老股交易或 IPO 路径。Growjo
              等聚合器给出的收入估计（约 $113–114M ARR）来自员工数和互动代理指标，而非经验证财务数据，只能作为未经验证的方向性信号。

              在 2025 年 11 月裁员背景下，留存指标完全缺失尤其关键。分析师和运营岗位出现如此规模的人员缩减，又叠加 CEO 交接，会让客户评估续约选项。没有 GRR、NRR
              或队列数据，投资者无法独立判断客户韧性是否守得住。$180M Series C 暗示融资时估值在数亿美元区间，但公司没有发布融资后的任何更新。如果 Growjo 估计方向正确且增长延续，Deepwatch
              可能接近盈利或流动性事件；但不透明度是全方位的，只有 NDA 下尽调才能解开。
