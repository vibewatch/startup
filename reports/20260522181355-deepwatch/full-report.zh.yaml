      - number: '2.2'
        title: 市场规模测算——多重口径与证据缺口
        blocks:
          - type: paragraph
            body: |
              已发布的 MDR 市场估计差异很大，原因在于范围定义和方法论不同。The Business Research Company 将 2025 年市场规模
              估为 $3.46 billion，2026 年以 20.3% CAGR 增至 $4.16 billion，并在 2030 年以 19.8% CAGR 达到 $8.57 billion。
              Mordor Intelligence 明显更高，估计 2025 年为 $4.19 billion，2026 年增至 $5.09 billion，2031 年以 21.45% CAGR
              达到 $13.45 billion。MarketsandMarkets 最激进，预测 2026 年为 $6.28 billion，2031 年以 24.8% CAGR 达到
              $19.01 billion。Precedence Research 最保守，估计 2025 年为 $3.40 billion，2026 年为 $3.92 billion，2035 年以
              15.12% CAGR 达到 $13.90 billion。Expert Insights 的 2025 年数据汇编引用 2024 年 $4.32 billion，并预测 2030 年
              以 23.5% CAGR 达到 $15.3 billion。

              北美区域市场被一致报告为最大地理区域，份额估计从 36.7%（MarketsandMarkets 对 2026 年的估计）到 45.78%
              （Mordor 对 2025 年的估计），再到 46%（Precedence Research 对 2025 年的估计）。亚太被普遍认定为增长最快地区，
              Mordor 报告至 2031 年 CAGR 为 25.48%。垂直行业集中度在各来源中一致：银行、金融服务与保险（BFSI）占最大份额
              （Mordor 对 2025 年的估计为 28.74%），其后是 IT 和电信。Mordor 认定医疗是增长最快垂直行业（至 2031 年 CAGR
              为 23.60%）。

              Deepwatch 具体位置的 SAM 和 SOM 无法凭公开数据可靠构建：没有分析机构公开按供应商层级（联邦级、企业级、中端市场、SMB）、
              定价模式，或不绑定 SIEM 与平台主导架构拆分 MDR 市场。Deepwatch 自身 ARR 和客户数也未披露。SAM 和 SOM 的证据缺口
              具有实质性，并在下方 evidenceGaps 部分记录。
