        - CISO / 安全副总裁（买方）；SOC 分析师（用户）；CFO / CRO（付款方）
        - 24/7 托管 SOC、威胁检测、告警分诊、合规证据、网络保险定位
        - 中大型企业；100–10,000+ 名员工；一家具名客户拥有 200,000+ 个端点
        - 具名案例研究中出现最多的垂直行业；多份材料都提到合规和保险 ROI 驱动
        - 未披露精确收入占比；未发布分群客户数
      - - 医疗健康与生命科学
        - CISO / IT 安全总监（买方 / 用户）；采购 / 财务（付款方）
        - 24/7 威胁检测、HIPAA 合规支持、攻击面收缩、漏洞管理
        - 从区域医疗系统到全国性康复和诊断公司
        - 多个具名材料（Premise Health、康复服务商、医疗机构）；该行业 MDR 需求在增长
        - 无分群 ARR 或客户数；HIPAA 专项 SLA 条款未公开披露
      - - 制造业和工业分销
        - CISO 或 IT 总监（买方 / 用户）；CPO / CFO（付款方）
        - 替换 SOC、24/7 监控贴近 OT 的 IT 环境、Splunk SIEM 管理
        - 从拥有数十万个端点的全球制造商（Genuine Parts）到中型工业企业
        - 具名证据强（Genuine Parts、两家未具名全球制造商）；OT 风险推动 MDR 采用
        - 未记录 OT 专项检测覆盖范围；OT 原生案例研究有限
      - - 技术和云服务
        - 安全负责人 / CISO（买方 / 用户）；财务（付款方）
        - 大规模漏洞管理、云原生监控（AWS 容器）、董事会可用报告
        - 从拥有 100+ 个工程团队的云原生公司（Informatica）到中端市场 SaaS 服务商
        - Informatica 和最大保险 SaaS 服务商具名；云和 SaaS 分群与 BYOT 策略一致
        - 无 ARR 拆分；云专项 SLA 和共同责任条款未发布
      - - 零售和消费
        - CISO / IT 安全经理（买方 / 用户）；CFO（付款方）
        - 跨多个业务单元的 24/7 MDR；网络保险资格
        - 拥有 10+ 个业务单元、PCI DSS 义务复杂的多单元零售商
        - 具名一家拥有 10 个业务单元的领先零售公司；推荐语提到大型便利店连锁
        - 具名客户匿名化；无行业层面收入数据
      - - 电信 / REIT 和关键基础设施
        - IT 安全总监（买方 / 用户）；CTO / CFO（付款方）
        - 提升 SOC 成熟度、降低误报、对标网络韧性
        - 塔楼基础设施运营商（SBA Communications）、全国性能源公用事业公司（NW Natural Gas）
        - SBA Communications 是完整具名且有归属的案例研究，并量化 Security Index；NW Natural Gas 在推荐语中具名
        - 覆盖能源和电信，说明垂直策略更像机会型，而非聚焦型
    notes: >
      分群边界和证据质量基于公司发布的案例研究，以及 CaseStudies.com、FeaturedCustomers.com 和 Deepwatch 官方客户页面的推荐语。公司未公开披露按分群划分的客户数、ARR 或收入构成。相较
      MDR 市场通常的垂直行业组合，金融服务在具名证据中占比过高，可能说明真实市场集中，也可能是公开案例研究的选择效应。「规模」和「收入 / 战略价值」列反映案例研究证据和行业推断，不是已披露财务数据。
