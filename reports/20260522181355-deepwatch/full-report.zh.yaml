      - number: '8.2'
        title: 公开可比倍数与私募市场基准
        blocks:
          - type: paragraph
            body: >
              在财务数据未披露的情况下，估值必须锚定公开可比公司和已获取分析师报告中的私募市场基准。

              公开网络安全可比公司。CrowdStrike（CRWD）在财年收入（截至 2026 年 1 月的 FY）达到 $4.81 billion，毛利率约 75%，并接近 GAAP 经营盈利。其交易倍数约为 18.6x
              NTM EV/Revenue，溢价反映平台宽度、已验证的交叉销售和规模。SentinelOne（S）收入首次突破 $1 billion，毛利率 74%，但 GAAP 经营亏损约 30%；其交易倍数约为 3.5x
              NTM EV/Revenue，反映市场对盈利时间表仍不确定。Rapid7（RPD）LTM 收入 $852 million，已盈利（EBITDA $156M，19% 利润率），交易倍数约 0.9x LTM
              EV/Revenue——明显压缩，反映市场怀疑其长期差异化。Palo Alto Networks（PANW）报告 LTM 收入 $11B、EV $201B，意味着约 18x LTM
              EV/Revenue；其规模和盈利水平 Deepwatch 无法接近。

              行业中位数基准。Windsor Drake Q4 2025 报告引用 Houlihan Lokey Cybersecurity Quarterly Update Q2
              2025，将公开可比组分段：高增长厂商（收入增长中位数 >21.9%）取得 15.5x EV/2025E 收入中位数；中增长厂商（增长中位数 14.7%）为 4.7x；低增长厂商（增长中位数 4.5%）为
              2.6x。Solganick 的 MSSP M&A YTD 2025 报告发现，一些表现最佳的 MSP 平台在竞争流程中录得约 20x EBITDA 退出倍数；更典型的 MSSP 交易落在 8x–14x
              EBITDA 区间。SecurityWeek 统计 2025 年网络安全 M&A 交易 426 起，披露总价值 $92.5 billion，其中 125 起属于 MSSP 类别。

              私营 MDR 估值锚点。两笔超级交易——Google 以 $32B 收购 Wiz、Palo Alto Networks 以 $25B 收购
              CyberArk——都是离群值，反映云安全和身份类别在规模化后的领导地位。更直接可比的是收入 $100M–$999M 层级的私营 MDR/MSSP 交易。Finro 2025 年中对 250
              多家网络安全公司的分析，将 MDR / Threat Intelligence / Incident Response 识别为一个估值由增长率、经常性收入质量和 AI 差异化驱动的细分领域——这与
              Deepwatch 的价值主张一致。将行业中增长倍数（4.7x）应用于 IT-Harvest $91M 估计，得到 $428M；高增长（15.5x）得到 $1.41B。IT-Harvest 的
              $1.27B–$1.72B 区间内部等同于对 $91M 使用 14x–19x 收入倍数；只有在持续高增长、强留存和清晰 AI 差异化溢价成立时才合理，而这些目前都无法由公开证据验证。
