      - number: '5.4'
        title: CTEM 模块与 Dassana 集成
        blocks:
          - type: paragraph
            body: >
              Deepwatch 的 Continuous Threat Exposure Management（CTEM）能力来自 2025 年 2 月收购 Dassana。Dassana
              是安全情报解决方案提供商，带来了上下文化 ETL 能力、网络安全数据网格和智能体工作流自动化。Dassana 数据网格把企业安全栈中孤立、碎片化的安全数据统一成单一规范视图；CPO Anand
              Ramanathan 称，这让 Deepwatch 能够「在事件发生前帮助客户预测、衡量并降低暴露」。

              CTEM 作为核心 MDR 订阅的附加模块销售，不是独立产品。它与 MDR 双向集成：CTEM 向 MDR 提供以风险为中心、按业务影响排序的数据，帮助聚焦检测；MDR 则把实时威胁和事件数据回传
              CTEM，动态更新风险画像和暴露评分。CTEM 模块还提供合规证据链、自动化审计报告，以及「前三优先级」框架，把最重要风险推到高管审阅层。NEXA CTEM Agent
              将这一数据层运营化，把技术暴露指标翻译成董事会级业务影响语言。运营透明度是反复出现的营销主张：Deepwatch 称客户可以看到哪些检测被触发、分析师如何与 SIEM
              数据互动，以及哪名分析师正在处理某张工单。没有公开可得的独立第三方基准或审计来验证 CTEM 效果；能力只能由公司声明以及 DBTA、vmblog 对 Dassana 收购的分析式报道交叉印证。
