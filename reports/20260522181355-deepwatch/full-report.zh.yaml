          - type: callout
            title: ISO 42001 作为先发合规信号
            body: >
              2026 年 5 月为 NEXA AI 生态取得 ISO/IEC 42001:2023 认证，使 Deepwatch 成为最早拥有外部验证 AI
              治理的网络安全公司之一。对于受监管行业买方（金融服务、医疗、政府），这可能加速采购决策；但认证范围只覆盖 AI 管理流程，不覆盖模型准确性、偏见或输出质量。
            calloutType: insight
            claimRefs:
              - CE026
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与企业目标画像
        blocks:
          - type: paragraph
            body: >
              Deepwatch 瞄准中大型企业：这些企业的安全团队缺少人手，无法自建 24/7 SOC。公司将主要买方描述为「负责管理分布式企业安全运营的企业安全领导者（CISO）」。官方营销称 Deepwatch 服务
              Fortune 500 和 Global 2000 公司，MSSP Alert 也独立佐证「数百家全球组织使用 Deepwatch 的 MDR 平台」。公司未公布精确客户数；About 页面称客户基础「每年接近
              75% 增长」，但该数字没有日期，仅来自 Deepwatch 营销文案，缺少第三方验证。

              具名案例和推荐最集中在金融服务（银行、保险 SaaS、金融科技、经纪交易商），医疗和制造业也各有多个具名引用。零售、云/技术、通信/REIT、本地政府各至少出现在一个具名案例中。Deepwatch
              博客明确瞄准受监管行业——金融服务（SOX、PCI DSS、GDPR）、医疗（HIPAA）和关键基础设施——这些行业的合规义务和精简安全团队，形成对共同管理 MDR 的结构性需求。Deepwatch
              将客户归为两类宽泛买方画像：一类是替换既有内部 SOC 或整合碎片化供应商栈的企业；另一类是在不扩编情况下建设企业级 MDR 的成长型组织。所有获客都通过 Deepwatch 100% 只走渠道的
              Xcelerate partner program，该计划自公司 2019 年创立以来运行，采用 Silver/Gold/Platinum 分层，并保证合作伙伴在续约时获得利润率。
