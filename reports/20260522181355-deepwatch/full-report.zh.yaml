      - number: '5.2'
        title: NEXA Agentic AI 生态
        blocks:
          - type: paragraph
            body: >
              NEXA 于 2025 年 11 月 4 日推出，是 Deepwatch 位于检测和数据基础设施之上的智能体 AI 层。公司称它是 MDR 市场首个协作式智能体 AI
              生态。生态包含六个专用智能体，分为两个功能层。SOC 层有三个智能体：Investigative Agent 自动完成数据丰富和调查编排；Narrative Agent
              将调查输出综合成白话威胁摘要；Response Agent 协调遏制和修复动作。Customer 层再增加三个智能体：CTEM Agent 关联安全栈内信号，生成实时暴露洞察和董事会级报告；Detection
              Advisor Agent 将检测覆盖映射到 MITRE ATT&CK，并识别相对真实威胁行为者的缺口；Ticket Analyzer Agent 对历史和活跃工单进行深度分析，浮现模式。

              自然语言交互是关键架构选择：安全分析师和非技术业务领导者都能用纯英文查询平台，无需 SQL 或自定义查询语言能力。高风险动作保留人在回路控制——主机和端点隔离需要明确人类批准，防止完全自治的遏制。NEXA
              Dynamic Risk Scoring 抑制低优先级告警，回应客户有记录的告警疲劳痛点。该生态在 2025 年 Q4 正式 GA。2026 年 5 月 21 日，Deepwatch 宣布专门针对 NEXA AI
              Management System 获得 ISO/IEC 42001:2023 认证，使其跻身首批拥有外部验证 AI 治理资质的网络安全公司。Xactly CISO Matthew K. Sharp
              是研究时唯一公开具名的 NEXA 客户引用。
