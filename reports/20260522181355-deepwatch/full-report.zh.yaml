      - number: '1.3'
        title: 融资形成、投资方与治理信号
        blocks:
          - type: paragraph
            body: |
              Deepwatch 公开三轮融资累计 $256 million。Series A（$23 million，2019 年 4 月）由 ABS Capital Partners
              领投，使 ABS 成为持有时间最长的机构支持者。Series B（$53 million，2020 年）由 Goldman Sachs 领投，
              ABS Capital 参投。2023 年 2 月的 Series C 规模最大，为 $180 million；该轮结合 Springcoast Capital Partners、
              Splunk Ventures 和早期投资人的股权融资，以及 Vista Equity Partners 子公司 Vista Credit Partners 的信贷融资。
              Springcoast 的 Holger Staude 随 Series C 加入董事会。

              LeadIQ 公司资料把总成长资本描述为「超过 $275 million」，并列出 Goldman Sachs、Vista Equity Partners、
              Springcoast、Splunk Ventures 和 ABS Capital 等支持方。$256 million 与 $275+ million 之间的差距，
              可能来自 Vista Credit 的结构化融资；不同数据库未必都把它按纯股权记录。尽调应澄清 Vista Credit 是否持有
              股权认股权证，以及该信贷层带有什么契约或治理权利。

              2023 年 2 月之后，公司没有公开宣布新融资轮。公司未披露任何轮次的投后估值，第三方估计跨度很大
              （一家二级市场聚合商给出 $1.3 billion 至 $1.7 billion），但缺少一手来源。本任务提示中的 $2.6 billion
              估值，在本次研究找到的新闻稿、分析师报告或可信数据库条目中均没有支持。后续章节不应把 $2.6 billion
              当作已验证估值锚点。

              最近一次 CEO 公告（2026 年 5 月 4 日）将支持方列为「Springcoast Partners、Goldman Sachs、ABS Capital
              and Splunk Ventures」，明显漏掉 Vista Credit。Vista 是否已获偿还，或是否已转为股权，需要直接确认。
