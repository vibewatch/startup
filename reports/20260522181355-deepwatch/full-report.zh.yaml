        title: 附录
        blocks:
          - type: callout
            title: 不到两年三任 CEO
            body: >
              从 Scott Thomas 到 John DiLullo（2024 年 7 月）再到 Brian Dhatt（2026 年 5 月），Deepwatch 平均每年更换一任
              CEO。这是公开记录中最醒目的单一负面信号。Dhatt 偏工程的背景（DigitalOcean CTO、Okta VP Engineering）可能加速 NEXA AI 路线图，但在关键增长拐点上也留下未经验证的
              GTM 画像。投资者在投入资本前，应要求董事会解释每次交接，并给出 Dhatt 任内最新 ARR 轨迹。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR009
          - type: callout
            title: FedRAMP 沉默构成重大缺口
            body: >
              Deepwatch 通过 Carahsoft 向政府相邻 SLED 客户分销，但没有公开 FedRAMP 列名。CMMC Phase 1 自 2025 年 11
              月开始执行后，服务国防承包商的托管安全服务商面临越来越大压力，需要持有或正在申请联邦云授权。截至 2026 年 5 月，marketplace.fedramp.gov 上没有任何 In-Process
              列名，这对任何建模联邦或国防相邻收入增长的投资者都是阻断性尽调事项。
            calloutType: insight
