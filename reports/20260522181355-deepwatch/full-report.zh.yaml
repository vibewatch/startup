      - number: '3.2'
        title: 平台主导型竞争对手——CrowdStrike Falcon Complete 与 SentinelOne Vigilance
        blocks:
          - type: paragraph
            body: >
              CrowdStrike Falcon Complete 是市场上最知名的平台主导 MDR，通过 CrowdStrike Falcon 平台交付智能体 MDR，把确定性自动化、

              AI 智能体和 24/7 人工监督结合起来。CrowdStrike 报告的中位遏制时间（MTTC）为 1 分钟，每月修复 2.7 million 个检测结果，

              并由其精英 OverWatch 威胁狩猎团队支持。覆盖范围延伸到端点、身份、云工作负载、网络边界、电子邮件、SSO，以及通过

              CrowdStrike Falcon Next-Gen SIEM 接入的第三方遥测。CrowdStrike 为符合条件的客户提供数据泄露保证。Falcon Complete MDR

              定价约为每端点每月 $25–$45，叠加在 Falcon EDR 授权之上，企业最低门槛通常要求 250+ 端点。


              Falcon Complete 的核心限制是强制要求 CrowdStrike Falcon EDR agent，形成紧密平台锁定。使用 Microsoft Defender、SentinelOne

              或多厂商 EDR 策略的组织，若不替换端点技术栈或并行运行两套 EDR 方案，就无法使用 Falcon Complete；这会带来授权重复和集成复杂度。

              Falconer Security 的 2026 MDR 买方指南明确将 CrowdStrike 标为「专有技术栈 MDR」，后果是已经标准化到 Microsoft 安全体系的

              组织会为端点保护支付两次。


              SentinelOne 在 2025–2026 年把 MDR 服务从 Vigilance Respond 更名为 Wayfinder MDR。Wayfinder 通过 Singularity Platform
              原生运行，

              提供 24/7/365 检测、调查和响应，并集成 Google Threat Intelligence；SentinelOne 称其为「最全面、及时且可运营的威胁情报」。

              服务层级包括 Wayfinder MDR（持续监控）、MDR Elite（专属威胁顾问和交钥匙式上线）以及 IRR（事件响应保留服务）。

              和 Falcon Complete 一样，Wayfinder 与 SentinelOne Singularity 平台深度绑定，对没有现有 SentinelOne 部署的组织吸引力有限。

              SentinelOne MDR 叠加服务定价为 $7–$25/endpoint/month，作为基础 Singularity 授权的附加项。
