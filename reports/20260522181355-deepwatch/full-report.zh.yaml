    title: 买方分群图——各客群和行业的 MDR 采用驱动因素
    type: matrix
    layout: wide
    summary: 这个矩阵按买方规模（列）与核心需求驱动因素（行）映射 MDR 采用强度；单元格标示该驱动因素在各客群中的适用性，以及 Deepwatch 的可覆盖程度。
