      - number: '4.3'
        title: 单位经济、利润率基准与员工数信号
        blocks:
          - type: paragraph
            body: >
              Deepwatch 不公开披露单位经济——CAC、LTV、回本周期或 NRR。毛利率同样未披露。作为结构性代理，公开和半公开市场的 MSSP 及平台主导 MDR
              提供商，在平台利用自动化降低每条告警分析师时间后，通常能达到 50–55% 毛利率；这个来自公开公司 MDR 可比项的基准，是建模 Deepwatch
              成本结构的最佳可用参照，但如果裁员后的人员减少尚未完全降低老客户队列服务交付成本，它可能高估 Deepwatch 毛利率。2022 年数据唯一可用的单位经济代理——超过三分之二客户扩展服务——与当期 NRR 高于
              100% 相符，但之后客户队列行为未知。


              第三方收入跟踪器给出的估计区间为 $91M–$114M。LATKA 将 2023 年收入列为 $111M ARR；Growjo 和 Compworth 预计 2026 年约 $113.7M；IT-Harvest
              在二级来源中流传约 $91M TTM 的估计。这些估计方法不同——有的来自融资倍数，有的来自员工数-收入外推——且没有任何一项获得 Deepwatch 确认。取中点意味着收入运行率约
              $100M–$112M；按第三方估计的 239–250 名员工计算，隐含人均收入约 $400K–$470K，高于 MSSP 通常
              $200K–$300K/人的基准，可能说明经济性较好，也可能说明收入估计偏高。若合同价值中位数估计为 $315K，需要 320–360 个企业客户才能达到 $100M ARR；客户数未披露。


              2025 年 11 月裁员从约 250 人团队中裁掉 60–80 人，降幅约 30%。分析师数据库显示截至 2026 年初员工数同比增长为负 5%，确认净人员收缩。MDR 公司最主要的服务交付成本驱动是 SOC
              分析师人数；如果裁员集中在分析师（据报道如此），短期毛利率应随 AI 自动化吸收告警分诊而改善，但客户 SLA 和服务质量承诺为人员配置设定下限，跌破后产品会退化。TechCrunch
              引述匿名员工质疑，以当前成熟度，AI 工具能否实质替代分析师判断；这给降本逻辑叠加了执行风险。
