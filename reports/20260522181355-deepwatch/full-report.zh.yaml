      - number: '6.5'
        title: 留存、耐久性与集中度风险
        blocks:
          - type: paragraph
            body: >
              Deepwatch 不公开披露 GRR、NRR、客户流失率、NPS 或任何队列级数据。唯一方向性指标来自公司归因主张和定性客户语言。About 页面声称客户「平均每年安全项目成熟度提升
              25%+」；若可持续，这会成为强留存驱动，但该指标为自报，未经外部审计。推荐语经常提到多年关系，并将 Deepwatch 称为「战略伙伴」或「团队延伸」，这些语言与高留存一致，但不能替代定量队列证据。

              公开证据中识别的最重要近期留存风险，是 2025 年 11 月裁员。TechCrunch 报道 Deepwatch 从约 250 人团队中裁掉 60 至 80 人——约 25–30% 员工——以「加速 AI
              投资」。一名现员工匿名表达了对 AI 理由的质疑。Deepwatch 的 Squad Delivery Model 为每个客户分配具名分析师、工程师和威胁猎手团队；SOC
              人员任何实质减少，都可能拉低分析师/客户比、拖慢响应，或加剧分析师倦怠，进而把续约置于风险中。未发现与裁员相关的公开 SLA 违约或服务连续性事件，但鉴于服务交付高度依赖人，这一风险合理且重要。

              按垂直行业看，客户集中度是可见风险：金融服务主导具名案例，说明收入可能集中在一个采购周期集中、MDR
              竞争加剧、且监管驱动供应商评估要求上升的行业。没有任何具名客户被描述为贡献了不成比例的收入——Deepwatch
              案例名册覆盖广泛公司规模和地区——但客户数和收入构成未披露，限制了量化头部客户或行业集中风险的能力。第二个集中风险是渠道依赖：所有收入都通过合作伙伴流入，若关键 Platinum-tier
              渠道合作伙伴流失或恶化，Deepwatch 没有直销安全阀，交易流会被压制。尽调应要求提供 NRR、GRR、流失率、裁员后分析师人员配置比，以及前 10 大客户收入集中度。
