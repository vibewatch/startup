      - number: '8.3'
        title: 乐观、基准与悲观估值情景
        blocks:
          - type: paragraph
            body: >
              财务完全不透明，因此下列三个情景以 IT-Harvest 的 $91M LTM
              收入估计为参考基础，并对收入倍数和收入水平做敏感性。任何情景都不应解读为股票交易价格；它们反映的是不同增长和倍数假设下的企业价值区间。所有情景都假设 Vista Credit 债务部分（估计
              $30M–$100M，本金未披露）优先于股权，估算股权价值时必须扣除。

              乐观情景。受 NEXA 智能体 AI 采用和交叉销售推动，收入已从 $91M（IT-Harvest 2025 年 11 月）增长到 2026 年中约 $105M–$115M。净收入留存率高于 110%（与
              2022 年披露的扩张数据一致）、ISO 42001 认证，以及新 CEO 的工程背景，共同推动战略收购方溢价。倍数：15x 收入。企业价值：$1.575B（中点）。扣除 Vista Credit 债务（估计
              $50M–$100M）：股权价值约 $1.475B–$1.525B。概率信号：低到中（需要确认收入增长、NRR 高于 110%，并有可信收购方出价或 IPO）。

              基准情景。收入约 $91M–$100M，温和增长；NRR 在 100%–110% 之间；AI 转型部分抵消分析师人数减少。倍数：8x–10x
              收入（低于行业中位数，反映不透明折价、领导层不稳定和裁员风险）。企业价值：$730M–$1.0B。扣除 Vista Credit 债务：股权价值约
              $630M–$950M。概率信号：中（在无法尽调的情况下最可行；与 IT-Harvest 下限一致）。基准建议：持有，前提是确认 ARR 和留存。

              悲观情景。收入持平或下滑（裁员后客户流失、AI 叙事未转化为合同、领导层扰动）。倍数：在 $80M–$91M 估计上使用 4x–5x 收入。企业价值：$320M–$455M。扣除 Vista Credit
              债务和优先股堆叠：股权价值约 $220M–$405M——显著低于累计股权投入（$76M+ 股权轮）。悲观情景意味着 Series C 股权部分可能会因清算瀑布而处于水下。概率信号：中到低，但三任 CEO
              更替和分析师 / 运营核心约 30% 裁员抬高了概率。
