      - number: '6.3'
        title: 同行评审平台评分与满意度证据
        blocks:
          - type: paragraph
            body: >
              Deepwatch 在三个同行评审平台上保持活跃且有实质内容的评分。Gartner Peer Insights（MDR 市场类别）截至 2025 年中显示 60 条已验证评论，整体评分 4.2/5：44%
              五星、46% 四星、8% 三星、2% 一星、零二星。服务能力、规划与转型、交付与执行、客户体验等子维度分数集中在 4.3–4.4。Gartner Peer Insights 还将 Deepwatch 列入
              Managed Security Services 市场，并给出单独 5.0/5 平均分，但截至本文撰写时仅反映一条已发布评论。2026 年 1 月，一条来自未具名组织的反向 Gartner Peer
              Insights
              评论称，评论者「相比市场上类似公司看不到太多价值」，并提到「未能交付关键合同点」——包括提交给高管批准的合同据称不同于已达成一致的版本。这只是单一数据点，但对评估服务交付一致性的投资者构成有意义的反向信号。

              G2 在 Fall 2025 Grid Report for System Security 中将 Deepwatch Guardian MDR Platform 评为高表现者；约 17–18
              条已验证用户评论支撑这一认定。G2 社区反馈亮点包括响应速度快、24/7
              持续监控、专家团队深度和实施便利。负面反馈包括实时支持沟通延迟、与合作伙伴系统的开箱即用集成有限、重日志搜索时偶发变慢，以及大型组织上线导入复杂。多个 G2 评论者提到，依赖 ServiceNow
              作为工单界面带来导航摩擦。

              FeaturedCustomers 基于其策划的 55 条引用资料中 1,104 个引用评分形成的 4.8/5 分数，授予 Deepwatch Managed Detection and Response 类别
              Spring 2026 Top Performer 称号。PeerSpot 显示一条来自支付网关公司（Simplifyvms）高级软件开发者的正面评论，提到事件响应时间降低
              40–60%，威胁检测准确性显著提升，并提供 24/7 非工作时间监控。Forrester Consulting 完成了 Deepwatch 委托的独立 Total Economic Impact 研究，用来构建
              Deepwatch MDR 的 ROI 案例；完整财务发现需要填表获取，未登录来源中没有公开确认具体数字。
