          label: 可比区间：收入的 4x–15.5x；IT-Harvest 估计 $1.27B–$1.72B
        - id: recommendation
          label: 谨慎：基准 EV $730M–$1.0B；受尽调闸门约束；不要锚定 $2.6B
      edges:
        - from: market
          to: position
          label: 行业有利
        - from: position
          to: funding
          label: 资本历史
        - from: funding
          to: opacity
          label: Series C 后无披露
        - from: opacity
          to: comps
          label: 仅靠类比估值
        - from: risks
          to: comps
          label: 下行折价
        - from: comps
          to: recommendation
          label: 区间锚定
        - from: opacity
          to: recommendation
          label: 尽调要求
  - id: FV002
    title: 估值敏感性
    type: bar
    notes: >
      柱状条展示将不同收入倍数套用在 IT-Harvest 的 $91M LTM 估计上得到的隐含企业价值。「行业高增长中位数」柱（15.5x）代表 Houlihan Lokey 2025 年 Q2
      针对高增长厂商的基准。「IT-Harvest 中值」柱（16.5x）代表 IT-Harvest 的 $1.27B–$1.72B 估计中点除以 $91M 收入。所有数值都是示意性估计；Deepwatch
      官方收入或估值均未得到确认。
    claimRefs:
      - CV007
      - CV008
      - CV019
      - CV020
      - CV021
      - CV040
    data:
      items:
        - label: 2.6x（低增长中位数）
          value: 237
        - label: 4.7x（中增长中位数）
          value: 428
        - label: 5x（悲观情景）
          value: 455
        - label: 8x（基准情景低位）
          value: 728
        - label: 10x（基准情景高位）
          value: 910
        - label: 13.1x（2025 年 Q3 高增长中位数）
          value: 1192
        - label: 15.5x（行业高增长中位数）
          value: 1411
        - label: 16.5x（IT-Harvest 中位隐含）
          value: 1502
  - id: FV003
    title: 估值 / 回报区间
    type: range
    notes: >
      区间展示三种情景下企业价值（EV）的低位、基准和高位。条形底部的股权价值已扣除估计 $50M–$100M 的 Vista Credit 本金（未披露；仅为假设）。$2.6B
      这个「常被引用的数字」作为缺少支撑的数据点列示，用于参考和对比。所有数字均由公开可比公司数据和 IT-Harvest 分析师估计推导；Deepwatch 没有披露任何财务数据。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV033
      - CV040
    data:
      items:
        - label: 悲观
          low: 320
          mid: 390
          high: 455
          note: 4x–5x 收入；假设裁员后服务受扰动
        - label: 基准
          low: 730
          mid: 865
          high: 1000
          note: 8x–10x 收入；计入信息不透明折价；与 IT-Harvest 下限一致
        - label: 乐观
          low: 1300
          mid: 1500
          high: 1720
          note: 14x–19x 收入；战略买家出价；IT-Harvest 上限
        - label: 未获支撑参考值（$2.6B）
          low: 2600
          mid: 2600
          high: 2600
          note: 可追溯到 Axonius Series E（不是 Deepwatch）；仅供参考
  - id: FV004
    title: 投资 KPI
    type: kpi
    notes: |
      面向投委会的七项投资维度评分。分数为 1–5（1=弱，5=强）。证据质量反映现有公开证据的深度；证据质量低，意味着若取得尽调访问，评分可能大幅变化。权重仅作示意。
    claimRefs:
      - CV007
      - CV008
      - CV019
      - CV022
      - CV028
      - CV034
      - CV036
    data:
      items:
        - label: 市场
          score: 4
          rationale: MDR market $4.19B, 21.95% CAGR; secular tailwinds confirmed by multiple analyst sources
          evidenceQuality: high
        - label: 产品 / 验证
          score: 3
          rationale: >-
            NEXA AI platform with ISO 42001; Dassana CTEM; no performance metrics or customer case study confirming AI
            offset
          evidenceQuality: medium
        - label: 护城河
          score: 3
          rationale: >-
            Enterprise switching cost from SIEM integration; named-squad model; CrowdStrike dependency is also
            concentration risk
          evidenceQuality: medium
        - label: 经济性
          score: 1
          rationale: No ARR, NRR, EBITDA, or margin data disclosed; IT-Harvest $91M revenue estimate unverified
          evidenceQuality: low
        - label: 风险
          score: 2
          rationale: Three CEOs in <2 years; 30% workforce reduction; Vista Credit debt unknowns; leadership churn adverse
          evidenceQuality: medium
        - label: 估值
          score: 2
          rationale: No confirmed post-money mark; $2.6B figure unsupported; IT-Harvest $1.27B–$1.72B is only named estimate
          evidenceQuality: low
        - label: 证据质量
          score: 1
          rationale: All financial figures are third-party estimates; no company-disclosed metrics; total opacity
          evidenceQuality: low
