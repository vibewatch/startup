      - number: '7.5'
        title: 声誉风险、AI 治理与投资逻辑破裂场景
        blocks:
          - type: paragraph
            body: >
              截至本报告运行日前的十二个月，Deepwatch 的声誉风险画像小幅恶化。2025 年 11 月裁员引发至少七家科技和网络安全媒体负面报道，其中覆盖面最高的 TechCrunch
              引用匿名高管称此前战略是「bullshit」；若该表述被具名归属，会损害企业买家信心。Gartner Peer Insights 至少有一条 2026 年 1
              月的负面评论，提到裁员后的服务中断。未发现具名客户终止合同、公开监管投诉或诉讼；不过，证据缺失部分源于私营信息环境。

              AI 治理正成为新的风险向量。Deepwatch 于 2026 年 5 月 21 日为其 NEXA 智能体 AI 生态取得 ISO/IEC 42001 认证；按公司新闻稿称，这是首家取得该认证的 MDR
              公司。ISO 42001 是 AI 治理的管理体系标准（流程、问责、风险监控），但不保证算法准确、可解释或输出无幻觉。如果 NEXA
              在客户处产生假阴性（漏报威胁）或假阳性（错误升级），并导致重大泄露或运营中断，Deepwatch 将同时面临声誉和潜在合同责任。未发现 NEXA
              分诊逻辑的公开可解释性文档。投资逻辑破裂场景是：高管持续流失、裁员已削弱 SLA 达成率的证据、以及被归因于 NEXA AI
              失误的高知名度客户泄露事件同时出现。这些风险彼此独立；其中两个或更多汇合，将成为投资逻辑的重大负面信号。
