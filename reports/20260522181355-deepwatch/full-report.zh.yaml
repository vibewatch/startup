      - number: '8.5'
        title: 证据缺口、最终尽调要求与建议
        blocks:
          - type: paragraph
            body: >
              关于 Deepwatch 估值，最重要的事实是未知项：公开渠道没有 ARR、NRR、GRR、EBITDA 或现金流数据。IT-Harvest（$91M LTM）、Growjo（约 $113M）和
              IncFact（$100M–$500M 区间）的收入估计，都是基于信号推断的未经验证聚合器估计，而非经审计账目。缺少这些数据，任何估值区间都只能由可比类推得出，而非来自基本面本身，置信区间很宽。

              阻断尽调的缺口包括：（1）$180M Series C 内部的股权 / 债务拆分，以及 Vista Credit 的具体条款（利率、期限、契约）；（2）Deepwatch Series C 后的 ARR
              进度表，显示增长率和客户队列数据；（3）FY2024 和 FY2025 的 GRR 与 NRR；（4）裁员后的分析师人数和 SLA 达成率，直接关系到 25–30%
              人员缩减是否削弱人力交付模式；（5）Dassana CTEM 模块的商业状态和 ARR 贡献；以及（6）Brian Dhatt 上任后的战略计划，确认或修改 NEXA 智能体 AI 路线图。

              总体建议：谨慎。Deepwatch 所处 MDR 市场结构性吸引力强，企业端位置有防御性；但财务不透明、流传中的 $2.6B 估值缺乏支撑、三任 CEO 序列带来动荡、2025 年 11 月分析师核心裁员，以及
              Vista Credit 债务条款未知，已经形成足够尽调风险。在无法获得 NDA 门槛后的上述事项前，任何具体价格都无法支撑投资逻辑。基于当前证据，$730M–$1.0B
              的基准企业价值区间是最可辩护的公开锚点。考虑战略收购的买方应在确认 NRR 和 ARR 轨迹后，再施加额外 10%–30% 控制权溢价。
