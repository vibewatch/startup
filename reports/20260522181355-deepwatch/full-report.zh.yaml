      - number: '1.4'
        title: 封面指标、规模信号与披露边界
        blocks:
          - type: paragraph
            body: |
              Deepwatch 对财务承销最关键的指标披露很薄。没有公开来源给出绝对 ARR、收入、客户数或经确认的投后估值。
              最具体的规模信号来自 2023 年 Series C 新闻稿：Deepwatch 报告 2022 年销售额同比增长 100%，且超过三分之二
              客户扩展了服务。创始 CEO 交接公告称，Thomas 任内客户基础增长十倍，但这是相对表述，没有披露起点或终点数量。
              新闻材料中反复出现 Fortune 100 和 Global 2000 客户表述，并附有 Ezer Group、Genuine Parts Company 和
              Stifel 的具名证言。

              员工数只能近似估计。2025 年 11 月裁员被描述为影响约 250 人中的 60 至 80 人，意味着裁员后员工数约 170 至
              190 人。LeadIQ 列出 201–500 人区间，看起来是裁员前数据。官方未公布当前员工数。二级来源流传 IT-Harvest
              对 TTM 收入约 $91 million 的估计，但 Deepwatch 未确认；本章将其按低置信度处理，若无直接验证，不建议采用。

              合规方面，信任 FAQ 页面确认 SOC 2 Type 2 认证和 TRUSTe 认证。公司于 2026 年 5 月 21 日为 NEXA Agentic AI
              Ecosystem 取得 ISO/IEC 42001:2023 认证，把自身放在少数拥有外部验证 AI 治理的网络安全公司之列。
              Deepwatch 还连续四年获得 Great Place to Work 认证至 2024 年，并在 2022 至 2025 年获得 Forbes Top Startup
              认可。
