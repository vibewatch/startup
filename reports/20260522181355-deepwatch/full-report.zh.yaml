      - number: '1.5'
        title: 里程碑、负面事件与章节事实基线
        blocks:
          - type: paragraph
            body: |
              后续章节应复用的时间线始于 2016 年 GuidePoint vSOC，一直延伸到 2026 年 5 月领导层交接和 ISO 42001 认证。
              最强的可验证锚点包括：2019 年 4 月正式独立（Series A）、2020 年 $53 million Series B、2023 年 2 月
              $180 million Series C、2025 年 2 月收购 Dassana、2025 年 6 月总部迁至 Palo Alto，以及 2026 年 5 月 4 日
              Dhatt/Ramanathan 领导层公告。

              两个负面事件具有实质性。第一，2025 年 11 月裁员约三分之一。官方说法是加速 AI 投资；TechCrunch 引述一名
              匿名现员工，对 AI 理由表示怀疑，称听起来「像胡扯」。裁员主要影响安全分析师和运营人员；对 MDR
              业务而言，SOC 分析师深度是服务质量信号，因此这引出运营风险问题。第二，CEO 快速接替——2024 年 7 月
              Thomas 到 DiLullo，再到 2026 年 5 月 DiLullo 到 Dhatt——提出战略连续性和董事会一致性问题，单靠公开来源无法回答。

              后续章节可以视为事实基线的内容包括：（1）Deepwatch 是一家私营 MDR 公司，当前高管总部位于 Palo Alto, CA；
              （2）已披露累计融资为 $256 million；（3）截至报告运行日 CEO 为 Brian Dhatt；（4）平台是 Guardian MDR Platform，
              搭配 NEXA Agentic AI，并支持 BYOT SIEM；（5）收购 Dassana 和 ISO 42001 认证在报告运行日前 12 个月扩展了
              平台和合规姿态。
