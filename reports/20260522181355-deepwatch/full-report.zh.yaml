companyProfile:
  summary: |
    Deepwatch 是一家私营托管检测与响应（MDR）公司，业务根源可追溯到 2016 年 GuidePoint Security
    内部的虚拟 SOC 服务；2018 年末，公司正式作为独立实体注册，并在 2019 年 4 月完成首轮外部融资
    （Series A，$23M）。公司三轮融资累计 $256 million，投资方包括 ABS Capital Partners、
    Goldman Sachs、Springcoast Capital、Vista Credit Partners（结构化非稀释债务）和 Splunk Ventures。
    2025 年 6 月，公司总部从 Tampa, FL 迁至 Palo Alto, CA。当前产品是 Guardian MDR Platform
    和 NEXA Agentic AI Ecosystem——六个协作式 AI 智能体（Investigative、Narrative、Response、
    CTEM、Detection Advisor 和 Reporting）——并采用不绑定 SIEM 的 Bring Your Own Technology 模式，
    支持 Splunk、Microsoft Sentinel、Google SecOps 和 Securonix。Deepwatch 于 2025 年 2 月收购
    Dassana，补上持续威胁暴露管理能力。截至报告运行日，公司不到两年内已进入第三任 CEO
    （Brian Dhatt，2026 年 5 月 4 日任命），并在 2025 年 11 月完成约 30% 裁员。
  foundedDate: '2018-12-31'
  founders:
    - name: Charlie Thomas
      role: 创始 CEO（任至 2024 年 7 月 2 日）
      background: |
        Thomas 带领 Deepwatch 从 GuidePoint Security 拆分出来，并一路完成 Series C 融资；2024 年 7 月
        他离任，由 John DiLullo 接任，这是董事会计划内交接的一部分。
      claimRefs:
        - CO012
  foundingLocation: Tampa, FL, USA
  headquarters: Palo Alto, CA, USA
  productSummary: |
    Guardian MDR Platform 搭配 NEXA Agentic AI Ecosystem：由六个 AI 智能体（Investigative、Narrative、
    Response、CTEM、Detection Advisor、Reporting）支撑的 24/7/365 托管检测与响应。不绑定 SIEM 的
    BYOT 策略支持 Splunk、Microsoft Sentinel、Google SecOps 和 Securonix。通过收购 Dassana 获得的
    CTEM 模块提供持续威胁暴露管理。AI 治理通过 ISO/IEC 42001:2023 认证（2026 年 5 月取得）。
    服务层级：Core、Advanced、Enterprise。
  customerFocus: |
    面向受监管垂直行业中的 Fortune 500 和 Global 2000 企业——金融服务（SOX、PCI DSS、GDPR）、
    医疗（HIPAA）、制造和零售。公司只通过 Xcelerate Partner Program 下的渠道合作伙伴（VAR、MSSP）
    销售。
  businessModel: |
    按年订阅的经常性托管安全服务；分层 SKU（Core、Advanced、Enterprise）；自创立以来 100% 只走渠道分销；
    合同中位数约 $315,000/年（Vendr 基准，未按当前定价验证）。
  stage: Series C (growth)
  fundingStatus: |
    已披露累计融资 $256M：Series A $23M（ABS Capital，2019 年 4 月），Series B $53M（Goldman Sachs 领投，
    2020 年 10 月），Series C $180M，结合股权（Springcoast Capital、Splunk Ventures）和非稀释结构化信贷
    （Vista Credit Partners），时间为 2023 年 2 月。Series C 后未宣布新一轮融资。公司未公开披露任何投后估值。
