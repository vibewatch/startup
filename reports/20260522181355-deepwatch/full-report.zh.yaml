          values:
            - label: 高——有能力配置部分 SOC，但 MDR 补齐覆盖缺口
            - label: 关键——无法以经济可行的成本自建 24/7 SOC
            - label: 高——完全没有安全人员，MDR 是唯一选择
            - label: 中——联邦机构能招聘，但要和私营部门抢人
        - label: 监管合规（CMMC / HIPAA / PCI DSS / SEC）
          values:
            - label: 高——SEC 披露、PCI DSS 4.0、SOX ITGC
            - label: 高——HIPAA、CMMC、PCI；合规触发是首要采用驱动
            - label: 中——收卡中小企业面临 PCI；医疗中小企业面临 HIPAA
            - label: 关键——CMMC Level 2/3 要求 24/7 SOC 和威胁狩猎
        - label: AI / 自动化与结果导向 MDR 需求
          values:
