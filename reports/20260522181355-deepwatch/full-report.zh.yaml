            title: ISO 42001 是差异化 AI 治理信号
            body: >
              Deepwatch 于 2026 年 5 月 21 日为 NEXA 智能体 AI 生态取得 ISO/IEC 42001 认证，据称是首家做到这一点的 MDR 公司。在 CISO 越来越要求部署 AI
              辅助分诊前先具备成文 AI 治理的企业销售周期里，这确实是差异化因素。ISO 42001 建立的是管理体系监督（不是算法认证），但作为第三方审计信号，它可信地表明 Deepwatch 重视 AI 治理。
