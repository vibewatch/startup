  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、所有权结构与估值不透明
        blocks:
          - type: paragraph
            body: >
              Deepwatch 公开披露的累计融资为 $256 million，分三轮：Series A（$23.4 million，2019 年 4 月，由 ABS Capital Partners 领投）、Series
              B（$53 million，2020 年 10 月，由 Goldman Sachs 领投，ABS Capital 参与）以及 Series C（$180 million，2023 年 2 月 15
              日宣布）。Series C 由 Springcoast Capital Partners（成长股权）和 Splunk Ventures（战略方）的股权投资，加上 Vista Equity Partners
              旗下信贷投资子公司 Vista Credit Partners 的一笔「非稀释性战略融资」组成。Deepwatch、其投资方或任何可访问数据平台均未披露 Series C 投后估值。PitchBook
              面向公众的资料列出了该轮融资，但投后估值在付费墙后；CB Insights 财务页显示融资历史，却没有投后数字；Tracxn 在 2026 年将 Deepwatch 归为「minicorn」（低于 $1
              billion 门槛）。

              Vista Credit Partners 这一笔在结构上重要且不寻常。作为信贷工具——截至 2025 年 9 月 30 日已部署 $15.4 billion、管理 AUM 超过 $10
              billion——Vista Credit 通常发放市场利率的高级担保贷款和次级债，而不是持有纯股权。Series C 公告明确用「非稀释性」描述 Vista Credit
              的资本；如果准确，这部分不会以清算优先权形式进入 Deepwatch 股权结构表，但会产生债务服务义务（利息支付、潜在契约、到期日）。该融资工具的利率、期限、契约和本金余额从未公开披露。Vista Credit
              的 SEC 注册 BDC 文件（Vista Credit Strategic Lending Corp，Form 10-Q，2025 年 6 月 30 日）确认，其投资对象是收入 $25M–$2.5B 的企业软件
              / 科技公司，并对私人组合持仓使用 Level 3 公允价值会计（不可观察输入）——这与持有 Deepwatch 信贷头寸相符。

              仅股权资本基础——Series A 至 B 股权（$76M）加上 Series C 中 Springcoast / Splunk 股权部分——大概率在 $76M–$130M 区间（不确定，因为 $180M
              Series C 内部的股权 / 信贷拆分未披露）。因此，没有股权结构表请求，就无法知道总股权稀释和优先股堆叠。Deepwatch 在 Tracxn 的法律实体数据显示两个活跃美国实体：「Deepwatch
              inc」（CIN: 38-4056947，2014 年 12 月 31 日成立）和「DEEPWATCH, INC.」（同一 CIN，活跃，截至 2024 年 12 月 31 日 280 名员工）。Series C
              之后 27 个多月，未公开披露额外融资轮、老股交易或 M&A 公告。
