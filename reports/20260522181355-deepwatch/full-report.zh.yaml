      - number: '3.5'
        title: Deepwatch 竞争位置——差异化、胜负模式与护城河耐久性
        blocks:
          - type: paragraph
            body: >
              Deepwatch 与 SIEM 解耦的 BYOT 策略，是它最核心的结构性差异化。它在四个 SIEM（Splunk、Microsoft Sentinel、Google
              SecOps、Securonix）上交付相同 SOC 结果：由 NEXA Agentic AI 驱动的 Precision MDR、24/7 专家分析师、具名分析师透明度、即开即用运营化。目标客户是已投入
              SIEM、但受制于 SIEM 能力缺口而无法满负荷运营的企业；所谓能力缺口，是技术理论能力与内部团队现实交付之间的距离。Deepwatch 称，其集成能绕开自管部署通常需要的 6–12 个月 SIEM
              调优周期，从第一天起提供检测工程、自动化告警调查，以及 NEXA AI 增强的威胁分析。平台借助 NEXA Dynamic Risk Scoring 将误报最多降低 98%，在升级前把告警映射到 MITRE
              ATT&CK，并显示哪些检测被触发、哪名分析师处理每条告警，从而提供运营透明度。


              Deepwatch 在三类竞争评估中主要胜出：（1）已有 SIEM 投资（Splunk、Sentinel、Securonix）的中大型和企业客户，希望在不被供应商锁定的情况下最大化 SIEM
              ROI；（2）受监管行业（金融服务、医疗、保险），需要合规级日志、分析师文档和可审计性，SIEM 无关 MDR 比平台主导的捆绑方案交付得更干净；（3）混合或多云 IT 环境，单一供应商 EDR
              叠加层需要替换异构终端上的代理。


              Deepwatch 在绿地 MDR 机会中容易输：买方没有既有 SIEM，想要摩擦最低、最快见效的部署（通常由 CrowdStrike Falcon Complete、Arctic Wolf 或 Sophos
              MDR 赢得）。预算受限的 SMB 和低端中端市场买方，如果想要单一 SKU、总成本低于 $50K/year，Huntress、Blackpoint Cyber 或 Arctic Wolf
              的低档价格更适合。Deepwatch 也缺少 Arctic Wolf 的渠道宽度（100% 渠道、5,500+ 客户）和 Sophos MDR 的原始装机基数营销力量（26,000 客户）。


              既有部署完成集成后，切换成本在结构上利好 Deepwatch：替换 MDR 提供商需要技术迁移（重配 SIEM
              集成、重建处置剧本、移植历史事件数据）、承担合同惩罚（多年协议、自动续约、最低消费承诺），还会损失关系资本（具名分析师掌握客户环境的部落知识）。但 Deepwatch 的 BYOT
              模式也降低了买方反向切换成本——客户保有 SIEM 和底层数据，离开 Deepwatch 比离开掌控数据摄取层的平台型捆绑供应商更容易。由此形成不对称护城河：BYOT
              降低采用门槛（竞争优势），也削弱售后锁定效应。


              Deepwatch 2025 年 2 月通过收购 Dassana 获得 CTEM 能力，构成一条主动威胁暴露管理护城河，并契合 Gartner 对 2028 年的预测。截至研究日期，没有发现
              CrowdStrike Falcon Complete、Expel 或 eSentire 在标准 MDR 合同内提供集成 CTEM 的证据。Deepwatch 的 NEXA 获得 ISO/IEC 42001
              认证，作为负责任 AI 框架，是受监管行业采购中的差异化因素。截至 2026 年 5 月，Arctic Wolf 及其他具名同业尚未公开宣布同等 AI 治理认证。
