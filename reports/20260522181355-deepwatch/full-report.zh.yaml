  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: |
      分层展示 Deepwatch Guardian MDR Platform：从客户自有数据源，到 OSDA 数据层、NEXA AI 引擎、人工 SOC，再到面向客户的体验。
    data:
      layers:
        - label: 客户体验与报告
          detail: 面向客户的门户（Security Center）用于工单管理和分析师协作；三类专门的 NEXA AI Agent 呈现暴露洞察、检测缺口分析和工单模式情报。
          items:
            - Deepwatch Security Center（门户）：工单管理、分析师协作、报告
            - NEXA CTEM Agent：实时暴露洞察、董事会级业务影响报告
            - NEXA Detection Advisor Agent：MITRE ATT&CK 覆盖缺口分析、检测优化
            - NEXA Ticket Analyzer Agent：历史 / 活跃工单模式分析
        - label: NEXA AI 生态（SOC 运营）
          detail: 四个智能体 AI 组件分别自动完成数据富集、生成自然语言威胁叙事、辅助响应编排，并动态评估告警风险；所有遏制动作都保留人工在环审批。
          items:
            - NEXA Investigative Agent：自动数据富集与调查编排
            - NEXA Narrative Agent：面向分析师的自然语言威胁摘要
            - NEXA Response Agent：AI 辅助遏制，并设置人在环审批闸门
            - NEXA Dynamic Risk Scoring：告警优先级排序与噪声压制
        - label: 人工 SOC 层
          detail: 24/7/365 人工分析师小队负责告警验证、威胁狩猎和 SIEM 工程。具名分析师分配让每位客户都有稳定联系人，这是区别于标准化 MDR 供应商的差异点。
          items:
            - 24/7/365 SOC 分析师小队：告警验证、复杂威胁调查
            - SIEM 工程专家：SIEM 调优、检测规则管理
            - 威胁猎手：跨客户遥测主动狩猎威胁
            - 具名分析师分配：客户知道哪位分析师负责自己的账户
        - label: 检测平台与 OSDA
          detail: >-
            在 Open Security Data Architecture（OSDA）上叠加自研检测引擎，用于多 SIEM 编排和联邦搜索；Dassana 驱动的 CTEM 引擎负责暴露面管理，Cribl
            负责数据规范化和管道路由。
          items:
            - 检测引擎：自研检测规则和告警关联
            - Open Security Data Architecture（OSDA）：多 SIEM 编排、联邦搜索
            - CTEM 引擎（Dassana）：数据网格、ETL 上下文补齐、暴露面管理
            - Cribl 数据管道：Stream、Edge、Search、Lake、Cloud，用于数据规范化
        - label: BYOT SIEM / 数据源层
          detail: >-
            自带技术（BYOT）SIEM 层支持 Splunk、Microsoft Sentinel、Google SecOps 和 Securonix，让企业保留既有 SIEM 投入。CrowdStrike Falcon
            可作为 EDR/XDR 数据源接入。
          items:
            - Splunk：SIEM（创始集成；Splunk Ventures 为投资方）
            - Microsoft Sentinel：SIEM（2024 年 4 月新增）
            - Google SecOps：SIEM + SOAR + 威胁情报（2025 年 7 月新增）
            - Securonix：SIEM（2026 年 2 月新增）
            - CrowdStrike Falcon：EDR/XDR 数据源
        - label: 基础设施（AWS）
          detail: >-
            Deepwatch 运行在 AWS 上，静态数据采用 AES-256 KMS 加密，传输中使用 TLS 1.2，按客户隔离 VPC，并持有 AWS Level 1 MSSP Competency
            和面向容器化工作负载的 Modern Compute Specialization。
          items:
            - AWS EBS / EC2 / S3：计算与存储，采用 AES-256 KMS 加密
            - 客户隔离 VPC：按客户做网络分段
            - AWS Level 1 MSSP Competency：面向容器化工作负载的 Modern Compute Specialization
            - TLS 1.2：传输中数据加密
    approximationNotes: >
      架构根据官方新闻稿、Deepwatch 信任中心以及 SecurityInfoWatch 对 OSDA 的报道推断。未发现公开架构图或 API 文档。Cribl、SIEM 和 EDR 集成由具名新闻稿确认；相对位置和内部 API
      机制未公开披露。
    claimRefs:
      - CE001
      - CE003
      - CE019
      - CE020
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: |
      说明一次客户威胁事件如何从原始遥测，经 Deepwatch 平台流转到事件关闭，展示人机协作模型。
    data:
      nodes:
        - id: n1
          label: 客户环境生成遥测
          description: 日志、告警和事件从终端、身份、云和网络来源流入客户自有 SIEM（Splunk / Sentinel / Google SecOps / Securonix）
        - id: n2
          label: SIEM 摄取与关联
          description: 客户 SIEM 摄取并规范化遥测；Deepwatch SIEM 工程通过 OSDA 层维护检测规则和调优
        - id: n3
          label: 检测引擎触发告警
          description: Deepwatch 自研检测规则在 SIEM 中生成告警；NEXA Dynamic Risk Scoring 压制低优先级噪声，并升级高保真信号
        - id: n4
          label: NEXA Investigative Agent 补充上下文
          description: 自动数据富集拉入威胁情报、资产上下文、用户行为和历史事件，拼出完整调查包
        - id: n5
          label: NEXA Narrative Agent 汇总威胁
          description: 调查数据转成通俗威胁摘要；SOC 分析师和客户干系人无需查询语言专长也能读懂
        - id: n6
          label: SOC 分析师验证并分诊
          description: Deepwatch 分析师审阅 AI 丰富后的摘要，验证发现并确定响应优先级；所有升级决策都保留人工判断
        - id: n7
          label: Response Agent 提议遏制动作
          description: 自动化响应（阻断、隔离）场景下，NEXA Response Agent 生成建议动作；主机 / 终端隔离需要客户明确批准
        - id: n8
          label: 客户批准或否决
          description: 客户干系人或 CISO 通过门户批准遏制动作；高风险决策保留人在环
        - id: n9
          label: 事件关闭；数据回流 CTEM
          description: 已解决事件的数据回流 CTEM 模块，更新暴露分数、风险画像和董事会级报告；持续反馈闭环完成
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n7
          to: n8
        - from: n8
          to: n9
        - from: n9
          to: n2
          label: 持续反馈闭环
    approximationNotes: >
      工作流根据 NEXA 产品文档、MSSP Alert 对 Deepwatch Senior Director 的访谈，以及 CTEM 产品页重构。内部系统交接和 API
      机制没有公开文档；本流程代表营销和编辑来源描述的逻辑顺序，不是已验证的技术序列图。
    claimRefs:
