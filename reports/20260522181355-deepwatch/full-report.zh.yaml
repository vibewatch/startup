  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: MDR 竞争格局——原型与市场结构
        blocks:
          - type: paragraph
            body: |
              MDR 市场不是单一整体：六类结构不同的提供商在重叠但不完全相同的买方细分中竞争。Efros 2026 年 5 月 MDR 提供商对比分类法
              将其识别为：（1）EDR 厂商 MDR 叠加服务，即端点保护平台供应商在自家技术栈上交付托管检测（CrowdStrike Falcon Complete、
              SentinelOne Vigilance/Wayfinder、Microsoft Defender Experts、Palo Alto Cortex MDR）；（2）纯服务主导 MDR，即跨客户现有
              技术栈集成的供应商无关服务（Arctic Wolf、eSentire、Red Canary、Expel、Huntress）；（3）MSSP/MDR 混合型，MDR 与 SIEM 运营、
              合规和 vCISO 服务并列为一个产品（Rapid7、Secureworks、Deepwatch、Optiv、区域 MSSP）；（4）云原生 MDR，聚焦云工作负载和
              SaaS 遥测（Lacework、Wiz Defend、Sumo Logic）；（5）SMB 层级渠道 MDR，按低于 250 名员工组织的需求调整，价格为 $10–$30/endpoint/month
              （Huntress、Blackpoint Cyber、Field Effect）；（6）专业化 MDR，面向 OT/ICS、威胁情报或事后事件环境（Dragos、Mandiant、
              GuidePoint Security）。

              Deepwatch 明确瞄准 MSSP/MDR 混合原型中的中端市场和商业企业细分，并以平台无关作为差异化。Efros 将 Deepwatch 与 Rapid7、
              Secureworks 和 Optiv 一起归为 MSSP/MDR 混合供应商，服务那些希望把统一安全运营、战略和事件响应放在单一合同下的组织。
              但 Quzara 2026 买方指南把 Deepwatch 定位为商业平台无关 MDR 玩家，同行是 Arctic Wolf、eSentire、Red Canary、Expel 和
              ReliaQuest——这个同业组更强调 SIEM 和 EDR 独立性，而不是 MSSP 标签。双重定位反映了 Deepwatch 的 BYOT 模式，它同时覆盖
              服务主导的不绑定 SIEM 交付和 MSSP 级广度。Gartner 2025 年 10 月 Managed Detection and Response Services Market Guide
              （作者 Pete Shoard、Andrew Davies 和 Angel Berrios）将成功 MDR 供应商定义为专注高保真威胁检测、调查和缓解响应，并提供
              可由人理解、聚焦业务报告的供应商。Gartner 预计到 2028 年，50% 的 MDR 交付物将包含威胁暴露发现（高于 2025 年约 20%）；
              这一转向利好已经整合 CTEM 能力的供应商，包括 Deepwatch。
