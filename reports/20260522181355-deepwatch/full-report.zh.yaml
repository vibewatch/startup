  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动 / 风险因素
      - 集中风险
      - 影响评估
      - 尽调路径
    rows:
      - - 靠附加模块实现先落地再扩张（CTEM、Dark Web Monitoring、Managed Endpoint DR、Managed Firewall、Vulnerability Management）
        - 单客户层面低；若 CTEM 采用慢则高
        - NRR 扩张需要把客户增购到 Dassana CTEM 模块；产品宽度支撑增购，但 2025 年 2 月收购 Dassana 后，整合仍在成熟
        - 索取 CTEM 附加率，以及各队列平均合同价值提升幅度
      - - 金融服务垂直行业集中
        - 高：具名证据以金融服务为主；该行业是案例组合中最大的板块
        - 对金融行业 MDR 采购周期、监管变化（SEC、DORA）以及来自 CrowdStrike、Palo Alto、Microsoft 等既有 MDR 厂商竞争的敞口集中
        - 索取按垂直行业拆分的收入；判断金融服务是否超过 ARR 的 40%
      - - 渠道合作伙伴依赖（100% 仅渠道）
        - 高：全部收入管线流经 Xcelerate 合作伙伴
        - 若 Platinum 级合作伙伴流失或表现不佳，且没有直销兜底，交易流可能受压；销售时客户关系掌握在合作伙伴手中
        - 索取前 5 大渠道合作伙伴收入集中度和留存率；核实 Deepwatch 是否与头部企业客户保持直接高管关系
      - - 裁员对 SOC 产能的影响（2025 年 11 月裁员）
        - 中：裁撤 60–80 人（约员工数的 25–30%），削弱 24/7 分析师覆盖的人力缓冲
        - MDR 是重人力服务；人员减少可能拉低分析师 / 客户比例、拖慢 MTTR，并在续约时引发 SLA 讨论
        - 索取当前分析师 / 客户比例与裁员前比例对比；确认裁员前后的 SLA 违约率
      - - 单一 SIEM 客户迁移风险
        - 中低：BYOT 策略降低锁定风险
        - 使用单一 SIEM 的客户可在 SIEM 续约时更换 MDR 服务商；但具名小队熟悉度和 CTEM 集成会制造切换成本
        - 索取平均合同期限和提前终止条款结构
    notes: |
      扩张和集中风险评估基于公开案例分布、公司渠道模式文档和 2025 年 11 月裁员事件推断。没有内部财务数据可直接量化垂直行业、合作伙伴或客户集中度。渠道依赖与裁员风险是近期最重要的两个担忧，应在尽调中做压力测试。
