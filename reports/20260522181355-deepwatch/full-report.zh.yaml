  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: |
      Deepwatch 客户生命周期中的客户分层、采用触点和扩张闭环。
    data:
      nodes:
        - id: js1
          label: 发现
          description: >-
            潜在客户因网络保险要求、合规审计或内部人手不足，确认需要共管 SOC。Deepwatch 只通过 Xcelerate 渠道合作伙伴触达买家（Silver / Gold / Platinum
            层级）。主要买家是金融服务、医疗、制造、零售或科技行业中大型企业的 CISO 或安全 VP。
        - id: js2
          label: 评估
          description: >-
            CISO 牵头 RFP 或概念验证；Deepwatch 靠不绑定 SIEM 的 BYOT 模式（Splunk、Sentinel、Google SecOps、Securonix）、 具名小队交付和 Security
            Index 基准来区分自身。Gartner Peer Insights（60 条评价，4.2/5）、G2（High Performer，约 17 条评价）和 FeaturedCustomers（4.8/5，1,104
            条参考评分）补充合作伙伴背书。竞品集合包括 CrowdStrike Falcon Complete、Arctic Wolf、Rapid7、Expel。
        - id: js3
          label: 采购与签约
          description: >-
            年度或多年订阅合同通过渠道合作伙伴谈判。Deepwatch 保证续约时保留既有合作伙伴利润率（CRN 称这在 MDR 领域独一份）。合同条款和 SLA 细节未公开；一条 Gartner 负面评价（2026 年 1
            月）称合同版本存在差异。
        - id: js4
          label: 上线与部署
          description: >-
            Deepwatch 称典型上线周期为 6 周（Genuine Parts 被列为样板；200,000+ 个端点）。公司会分配具名分析师小队，并完成 SIEM 集成、检测规则调优和 Security Index
            基线设定。G2 反馈指出，大型或多系统环境里的上线流程可能复杂。
        - id: js5
          label: 活跃生产部署
          description: >-
            24/7/365 监控；NEXA AI 生态负责分诊；Deepwatch Experts 处理告警调查、威胁狩猎和事件升级。客户通过 Security Center 门户交互。Security Index
            每季度做基准评估。公司声称平均每年安全成熟度提升 25%+（公司说法，未经审计）。
        - id: js6
          label: 扩张
          description: >-
            CTEM 模块（Dassana）、Dark Web Monitoring、Managed Endpoint DR、Vulnerability Management 和 Managed Firewall
            可作为付费附加产品。扩张由合规缺口、 数据量增长或 M&A 集成驱动（Artera Services 案例）。CTEM 附加购买率未披露。
        - id: js7
          label: 续约与推荐
          description: >-
            续约锚定 Security Index 改善和既有合作伙伴保护。具名客户会受邀加入 Guardians Program，参与同行社区并反馈产品。GRR、NRR 和流失率未公开披露；
            定性证据显示多个具名账户维持多年关系。
    approximationNotes: |
      旅程阶段根据案例研究叙述、渠道合作伙伴计划文档和官方产品页面重建。没有内部转化漏斗或流失数据。评估到扩张的时间线从案例研究措辞推断，未用定量队列数据验证。扩张产品附加购买率未披露。
