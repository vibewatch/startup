            title: 2025 年 11 月裁员后的人员配置风险
            body: >
              Deepwatch 在 2025 年 11 月裁掉约 30% 员工，把资源转向 AI 投资。24/7 人类 SOC 是 Guardian MDR Platform 的核心运营承诺；如果分析师人数减少速度快于
              NEXA 自动化吸收能力，高流量或复杂事件场景中的 SLA 退化风险会上升。裁员后未披露更新后的员工数或分析师/客户比。
            calloutType: risk
