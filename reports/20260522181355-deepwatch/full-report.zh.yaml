      - number: '1.6'
        title: 要点图表
        blocks:
          - type: callout
            title: 专有 SOC 数据和智能体 AI 支撑出可防守的差异化叙事
            body: |
              Deepwatch 2026 年 5 月的信息口径强调，十多年真实 SOC 遥测和运营数据是 NEXA Agentic AI Ecosystem 的基础。
              如果该数据集确如公司所称那样专有且纵深足够，它就会成为有意义的模仿壁垒；新进入 MDR 的玩家缺少同等规模和
              多样性的已标注安全运营数据。2026 年 2 月 Securonix 集成和 ISO 42001 认证强化了平台叙事，使其不再只是
              Splunk 原生 MDR。
            calloutType: strength
            claimRefs:
              - CO018
              - CO019
              - CO030
              - CO031
              - CO037
          - type: callout
            title: 不到两年三次 CEO 更替，是超常规治理信号
            body: |
              2024 年 7 月 Charlie Thomas 交棒 John DiLullo，2026 年 5 月 DiLullo 又交棒 Brian Dhatt；对一家尚未退出的
              私营公司来说，这个接替速度很快。再叠加 2025 年 11 月裁员——约三分之一员工被裁，且明确影响安全分析师队伍——
              治理图景带有明显执行风险。Dhatt 的技术平台背景不同于企业 MDR 买方通常期待的网络安全原生高管画像。
              尽调应直接要求董事会解释 DiLullo 任期、11 月裁员的决策时间线，以及在公司还没有时间大规模证明自主 SOC
              逻辑之前更换 CEO 的战略理由。
            calloutType: risk
            claimRefs:
              - CO013
              - CO015
              - CO022
              - CO023
              - CO024
          - type: callout
            title: 融资基础扎实，但 2023 年后的轨迹不透明
            body: |
              Deepwatch 已披露融资 $256 million，对一家 MDR 公司来说资本底座不弱。但 2023 年 2 月后没有新一轮融资，
              且缺少任何公开估值锚点，投资者无法仅凭公开来源对当前股权结构表或稀释堆叠进行基准比较。任务简报中提示的
              $2.6 billion 估值，没有得到本次研究找到的任何一手或二手来源佐证。Vista Credit 的结构化融资部分进一步增加了
              股权图景复杂度；建立估值框架前，必须先理解这部分安排。
            calloutType: insight
