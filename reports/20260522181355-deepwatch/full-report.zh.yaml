              - CM038
              - CM039
              - CM040
              - CM041
      - number: '2.6'
        title: 要点图表
        blocks:
          - type: callout
            title: 市场规模分歧是结构性的，不是统计误差
            body: >-
              2026 年 MDR 市场规模估计的 $3.92B–$6.28B 差距，反映的是市场边界定义相互竞争，而不是测量误差。把 MXDR、SOC-as-a-Service
              和托管漏洞管理纳入范围的分析师，会报告显著更大的市场。考虑到 Dassana CTEM 收购和 NEXA AI 生态系统定位，Deepwatch 内部 TAM 可能更接近更宽的 MXDR
              定义，但没有公开来源精确量化这一点。
