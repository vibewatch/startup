      - number: '3.4'
        title: MSSP/混合型与渠道 MDR 竞争对手——Rapid7 MDR 与 Sophos MDR
        blocks:
          - type: paragraph
            body: |
              Rapid7 MDR 在 Rapid7 Insight 生态内属于平台主导型，提供 24/7 人主导监控，并由 Agentic AI 模型增强；同时包含不限次数的数字取证和
              事件响应（DFIR），以及内置漏洞和风险管理，以呈现整体安全态势。Rapid7 引用 Gartner 的预测：到 2028 年，50% 的 MDR 交付物将包含
              威胁暴露发现。Rapid7 MDR 的实质限制是集成广度：eSentire 的正面对比显示 Rapid7 支持 29 个集成，而 eSentire 支持 300+，反映出 Rapid7
              偏好自有 Insight agent 和平台。Rapid7 MDR 约有 100 名 SOC 人员。Rapid7 生态之外的买方——尤其是运行最佳组合 SIEM 或 EDR 技术栈的买方——
              若采用 Rapid7 MDR，需要承担有意义的平台迁移成本。

              Sophos MDR 是具名竞争对手中按客户数最大的 MDR 服务，截至 2026 年 1 月全球达到 26,000 名客户，较 2024 年增加 37%。Sophos MDR 获得多项
              分析师认可：2024 年被评为 IDC MarketScape MDR 领导者、Frost & Sullivan Frost Radar 领导者、连续第二年获得 Gartner Peer Insights
              MDR 客户之选，并获得 SC Awards 最佳托管检测与响应服务奖。该服务截至 2024 年 Q3 在 Gartner Peer Insights
              获得 4.9/5（344 条评论）。Sophos 的主要 MDR 差异点是不限事件响应小时数且不额外收费，包括完整根因分析、恶意构件清除和攻击者驱逐。
              Sophos MDR Complete 层级包含数据泄露保护保证，覆盖最高 $1M IR 费用。Sophos 已投资第三方集成（包括 Microsoft O365、Acronis、
              Rubrik 和 Veeam），并报告有超过 9,000 名客户使用其 Microsoft O365 MDR 集成。Sophos 的母公司资金来自 Thoma Bravo，后者于 2019 年以
              $3.9 billion 收购 Sophos；FY2025 公司整体收入估计约 $1B。

              Sophos MDR 的结构性动态不同于纯玩家同行：Sophos 的 MDR 服务由其遥测基础中 600,000+ 组织的威胁情报（Sophos X-Ops）支持，这形成了
              小型同行无法获得的网络效应情报优势。但拥有现有非 Sophos 端点技术栈的组织会面对集成负担；尽管 Sophos MDR 具备第三方集成能力，
              其核心商业架构仍主要以 Sophos 端点为中心。
