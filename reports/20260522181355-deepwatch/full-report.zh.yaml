      - number: '1.2'
        title: 创始人、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: |
              以同一代私营成长型公司衡量，Deepwatch 的领导层轨迹异常动荡。多个来源将 Charlie Thomas 识别为
              创始 CEO。2024 年 7 月 CEO 交接公告称，在 Thomas 任内，公司客户基础增长十倍。2024 年 7 月 2 日，
              John DiLullo 被任命为 CEO，Thomas 转任董事会主席。DiLullo 有 30 年网络安全经验，曾领导 LiveVox
              和 Lastline（2020 年被 VMware 收购），任务是放大平台并推动下一阶段增长。在 2026 年 5 月 4 日由
              Brian Dhatt 接任之前，他推动了 Dassana 收购、总部迁至 Palo Alto，以及 2025 年 11 月裁员。DiLullo
              之后保留顾问身份。

              现任 CEO Brian Dhatt 带来的是企业技术平台扩张经验，而不是纯网络安全背景。他曾任 BigCommerce 和
              Borderfree CTO，两家公司都在其任内完成 IPO。Anand Ramanathan 同日从首席产品与技术官升任总裁，
              拥有 20+ 年安全产品领导经验，履历覆盖 McAfee、Proofpoint、Cisco 和 Skyhigh Security，为交接提供
              领域连续性。Bill Phelps 在 2026 年 5 月公开列为董事会主席。Chad Cragle 是 CISO，出现在 2026 年 5 月
              ISO 42001 公告中。Springcoast Capital 的 Holger Staude 在 2023 年 Series C 后加入董事会。

              关键人物风险并不单向。不到两年三任 CEO 是一个有分量的治理信号，值得尽调：投资者应追问 DiLullo
              到 Dhatt 的交接是计划内还是被动反应，以及 DiLullo 的短任期对董事会与高管团队战略一致性意味着什么。
              Ramanathan 升任总裁，在产品和客户侧提供了一定连续性。如果公司需要穿越复杂的企业安全评估，
              而 CEO 不是安全原生背景，Dhatt 的履历会放大风险。
