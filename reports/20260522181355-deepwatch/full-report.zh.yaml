      - number: '7.2'
        title: 监管、法律与隐私暴露
        blocks:
          - type: paragraph
            body: >
              Deepwatch 所在赛道正同时承受多路监管加压。CMMC Phase 1 已于 2025 年 11 月 10 日开始执行，要求国防承包商及其供应链证明符合 NIST SP 800-171
              控制项。Deepwatch 通过 Carahsoft 向 Clark County School District、Dallas ISD、Fairfax County、Frisco ISD
              等政府相邻客户分销平台。不过，Deepwatch 尚未公开披露任何云服务产品取得 FedRAMP 授权。服务国防承包商的托管安全服务商，越来越需要在 CMMC 下拿到 FedRAMP Moderate
              授权。marketplace.fedramp.gov 上没有任何公开 FedRAMP 列名，这对评估联邦及 SLED 收入潜力的投资者构成重大尽调缺口。

              隐私侧，修订后的 CCPA 规则已于 2026 年 1 月 1 日生效，其中新增要求企业将 Global Privacy Control（GPC）信号视为有效的个人信息出售和共享退出选择。Greenberg
              Traurig 的分析确认，受覆盖企业必须更新数据流映射，自动响应 GPC 信号，并更新隐私通知。Deepwatch 2026 年 5 月 1
              日的隐私政策将「客户数据」——即根据服务协议代表客户处理的数据——排除在个人数据主体权利（访问、删除、更正）之外。B2B SaaS 合同通常这样处理，但它把隐私合规义务集中到 Deepwatch
              的企业客户身上；如果 GDPR 或 CCPA 数据主体请求被转给 Deepwatch 而不是数据控制者，可能引发合同争议。NIS2 Directive（2024 年 10 月起在欧盟成员国生效）对
              Deepwatch 的欧洲客户施加了类似义务。SEC 2023 年网络安全披露规则要求 Deepwatch 的上市公司客户披露重大网络事件，也给 Deepwatch
              施加压力，必须交付快速且有文档留痕的事件响应。未发现针对 Deepwatch 的执法行动、监管处分或重大投诉。
