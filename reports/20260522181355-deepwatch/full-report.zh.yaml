      - number: '6.4'
        title: 渠道动作与获客
        blocks:
          - type: paragraph
            body: >
              Deepwatch 自 2019 年创立以来一直只走渠道：100% 收入通过合作伙伴流入，使它成为少数在这一规模上完全依赖间接模式的纯 MDR 提供商之一。Xcelerate Channel Partner
              Program 采用 Silver/Gold/Platinum
              分层，合作伙伴通过达到收入门槛、专业化或培训认证组合来晋级。财务激励包括市场开发基金（MDF）、交易报备保护、新客户成交销售激励返利，以及最有区别的一点——续约时保证在位合作伙伴利润率。

              CRN 证实 Deepwatch 是 MDR 领域「唯一保证合作伙伴利润率的公司」，在位保护确保原始合作伙伴获得高于任何新进入者的续约利润率。长期 Deepwatch 合作伙伴 Defy Security 的
              CEO Justin Domachowski 形容在位保护：「看到这一点令人鼓舞，因为我认为它会持续积累信任。」Deepwatch Academy 为合作伙伴提供安全基础和 Deepwatch
              专属解决方案培训，包括 DEEP-cx 认证路径（DEEP – Certified Influencer 和 DEEP – Certified Advisor）。Xcelerate 计划支持
              MSSP、经销商、解决方案提供商和技术提供商，向终端客户交付 MDR、端点检测与响应、漏洞管理、托管防火墙和 MXDR 产品。

              只走渠道模式对客户基础有两个战略含义：第一，Deepwatch 的销售足迹和区域覆盖主要取决于合作伙伴覆盖和能力，而不是 Deepwatch 直销团队；第二，依赖合作伙伴获客意味着 Deepwatch
              在销售时与终端客户的直接关系有限，若合作伙伴关系恶化，客户粘性可能受影响。Deepwatch
              的在位保护意在通过续约锁定原始合作伙伴的经济利益，从而缓释这一风险；但客户侧账户管理对合作伙伴的结构性依赖，仍是任何评估客户集中度和流失风险的投资者都要尽调的事项。
