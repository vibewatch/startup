            - label: 高——AI 分诊压低成本；买方重视结果透明度
            - label: 中——成熟度较低；结果指标不如成本重要
            - label: 低——联邦买方把合规和主权置于 AI 功能之前
        - label: BYOT / SIEM 无关的平台灵活性
