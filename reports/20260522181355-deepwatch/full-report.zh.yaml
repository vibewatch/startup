  - id: TP004
    title: 护城河耐久性与竞争风险登记表 — Deepwatch MDR
    columns:
      - 护城河主张
      - 威胁性质
      - 严重性
      - 时间线
      - 缓释措施 / 尽调问题
    rows:
      - - 不绑定 SIEM 的 BYOT 差异化，相对锁定型厂商
        - CrowdStrike 和 SentinelOne 扩展原生 SIEM 连接器；整合潮之后，买方把工具栈收敛到一个平台
        - 中 — 平台型厂商在新建场景赢单；对既有 SIEM 客户群威胁没那么即时
        - XDR 市场成熟后 2–3 年
        - 跟踪 CrowdStrike Falcon Next-Gen SIEM 采用率；监测 Deepwatch BYOT 管线转化率与新建场景流失率
      - - NEXA 智能体 AI 与动态风险评分
        - 所有 MDR 同行（CrowdStrike、Arctic Wolf、SentinelOne）都在投入智能体 AI；核心能力可能在 12–18 个月内趋同
        - 中 — AI 治理（ISO 42001）的先发优势短期撑得住；AI 能力差距会随时间收窄
        - 核心分诊自动化在 12–18 个月内可能趋同
        - 向企业安全采购团队验证 Deepwatch 的 AI 认证优势；跟踪 NEXA 专利和 IP 归属
      - - 靠 SIEM 深度和专属分析师关系留住客户
        - Deepwatch 分析师流失，或 Arctic Wolf 礼宾式服务人员流失，会削弱关系型护城河
        - 中 — 专属分析师留存有人力资本风险；行业级分析师短缺是结构性问题
        - 持续存在
        - 索取 Deepwatch 分析师任期和流失率数据；将平均客户留存时间与同行 NPS/CSAT 对比
      - - CTEM 集成（通过 Dassana 收购）作为暴露管理差异化
        - Rapid7 已在 MDR 中纳入漏洞和风险管理；Sophos MDR 有托管风险附加项；其他同行可能加速追赶
        - 低-中 — CTEM 集成目前确实构成差异化；同行投入后优势会收窄
        - 18–24 个月后，多数一线同行可能补齐集成 CTEM
        - 验证 Dassana 集成完整度；索取 CTEM 能力路线图和客户采用指标
      - - 不绑定 SIEM 的模式也削弱 Deepwatch 售后锁定
        - 非对称护城河：BYOT 降低采用摩擦（优势），也降低部署后从 Deepwatch 切走的成本
        - 重大 — 买方知道锁定弱，续约时可能采用多厂商策略，或更强势地重新议价
        - 当前 — 合同结构已可见
        - 审查合同退出条款和数据可移植性条款；将续约率与切换成本更高的平台型同行对比
      - - 渠道和生态广度
        - Arctic Wolf 的 100% 渠道模式和 Sophos MDR 的渠道合作伙伴生态远大于 Deepwatch 的渠道覆盖；中端市场触达存在规模劣势
        - 高 — 渠道覆盖规模差距限制 TAM 触达；没有证据表明 Deepwatch 已匹配 Arctic Wolf 的 5,500+ 客户广度
        - 当前存在，若不刻意投入渠道还会扩大
        - 索取 Deepwatch 渠道合作伙伴数量和收入结构（直销 vs. 合作伙伴）；对比 Arctic Wolf 渠道经济性
