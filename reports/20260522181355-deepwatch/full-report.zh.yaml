      - number: '6.2'
        title: 具名客户证据与部署结果
        blocks:
          - type: paragraph
            body: >
              Deepwatch 的客户证据层在私营 MDR 公司中明显更深：CaseStudies.com 汇总 25 个具名案例，附有 CISO 或安全总监署名引用；FeaturedCustomers 列出 55
              个总引用，包括 27 条推荐、25 个案例和 3 个客户视频。所有案例结果均由公司发布材料自报；未发现对所称指标的独立第三方审计。

              最高可见度部署包括 Genuine Parts Company（全球汽车/工业零部件分销商，200,000+ 端点），六周完成上线导入；Global Security Program Director
              Damian Apone 的引述是「我这辈子从没见过执行得这么完美的事情。」City National Bank of Florida（CISO Brian Fricke）实现网络保险保费降低近
              80%，审计准备从数天缩短到数分钟。SBA Communications（通信/REIT 基础设施）达到 9.64 的 Deepwatch Security
              Index——高于行业平均——并在两年部署期间零已声明事件。Informatica 将漏洞管理扩展到 100+ 工程团队，每年节省 $77,000 已退役内部管道成本，用实时董事会可用仪表板替代人工报告。Ezer
              Group（金融服务）在 90 天内把告警从 17,000 降到 8。一个未具名大型美国金属和塑料分销商声称网络风险降低 70%，同时节省数百万人员成本、降低保险保费，并与 NIST CSF 对齐。

              医疗和公共部门客户也有生产级引用：Premise Health（医疗服务）、一家全国知名康复服务提供商，以及一家本地政府安全提供商，都在 CaseStudies.com
              上有署名案例。拥有具名高管引用的金融服务客户包括 R.J. O'Brien（CISO John Woods）、PJTC Holdings（ISO Matt Lawson），以及一家报告告警保真度提升 82%
              的领先银行。Deepwatch About 页面上的其他具名推荐包括 QuidelOrtho（医疗诊断）、NW Natural Gas、Stifel（金融服务）和
              Brightline（医疗），均可归因到具名高管。证据质量全部由公司策划；所有案例 PDF 都需要留资才能获取，没有客户背调电话就无法独立复现具体指标主张。
