  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: 截至 2026 年 5 月，Deepwatch 的身份、平台、资本和关键依赖如何串成一张完整公司图景。
    data:
      nodes:
        - id: n1
          label: 企业安全团队
          description: 目标买家缺少内部 24x7 SOC 能力或 SIEM 专业能力，难以把自有技术栈跑起来；覆盖 Fortune 100 到中端市场。
        - id: n2
          label: Guardian MDR Platform 平台
          description: Deepwatch 的核心托管检测与响应服务；不绑定 SIEM（Splunk、Sentinel、Google SecOps、Securonix）；用 24x7 SOC 人员把客户 SIEM 跑满。
        - id: n3
          label: NEXA 智能体 AI 生态系统
