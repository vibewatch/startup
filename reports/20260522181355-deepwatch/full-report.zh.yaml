      - CR041
  - id: TV001
    title: 建议摘要表
    notes: |
      所有数字均为基于公开可比对象推导的估计值。Deepwatch 未公开披露任何投后估值或经审计财务指标。这里的信心是投资阶段信心（能否建仓），不是对任何具体结果的确定性。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV028
      - CV037
    columns:
      - 维度
      - 评估
      - 支撑证据
    rows:
      - - 建议
        - 谨慎 / 尽调完成前暂缓
        - ARR、NRR 或 Series C 后估值均未确认；三任 CEO 轮换；裁员 30%
      - - 信心
        - 低（估值）/ 中（市场逻辑）
        - 市场顺风已确认；单家公司财务不透明
      - - 风险评级
        - 高（财务不透明、领导层不稳、债务压力未知）
        - IT-Harvest 估值 $1.27B–$1.72B；Vista Credit 债务条款未披露
      - - 估值立场
        - 基准：$730M–$1.0B EV；乐观：$1.3B–$1.6B；悲观：$320M–$455M
        - 由 $91M IT-Harvest 估计收入套用 4x–15x 收入倍数推导
      - - 决策含义
        - 把入场条件设为 NDA 下披露 ARR/NRR/EBITDA 和股权结构表
        - PitchBook 投后估值被权限门控；公开市场没有老股交易数据
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    notes: |
      每行代表一个论点及会改变观点的可观察条件。投资逻辑和反向逻辑都不是确定性的；两者都需要尽调确认。
    claimRefs:
      - CV003
      - CV007
      - CV009
      - CV015
      - CV019
      - CV022
      - CV027
      - CV028
    columns:
      - 论点
      - 类型
      - 改变观点的条件
    rows:
      - - MDR 市场以 21.95% CAGR 增长；Deepwatch 平台在结构上占位有利
        - 正向逻辑
        - 市场增长放缓、MDR 商品化，或大型平台玩家夺走份额
      - - NEXA 智能体 AI 生态系统拥有 ISO 42001 认证，可能获得战略溢价
        - 正向逻辑
        - ISO 42001 是管理体系认证，不是性能证明；NEXA 准确率未经验证
      - - 经常性订阅收入叠加企业高切换成本，支撑稳定 ARR
        - 正向逻辑
        - 若确认裁员后客户流失或 NRR 下滑，将推翻这一点
      - - Vista Credit 债务不稀释股权；股权结构表可能比担心的更干净
        - 正向逻辑
        - 债务条款（契约、到期日）可能约束运营，或迫使公司在不利时点出售
      - - $2.6B 估值数字不能归属于 Deepwatch；IT-Harvest 估计为 $1.27B–$1.72B
        - 反向逻辑
        - 独立老股交易或更高估值融资会验证更高数字
      - - 不到两年三任 CEO，显示关键 AI 转型期存在战略漂移
        - 反向逻辑
        - Brian Dhatt 稳住领导层；裁员后留存 KPI 保持
      - - 2025 年 11 月裁员 60–80 人（约占员工数 30%），目标是 MDR 交付核心岗位：分析师和运营
        - 反向逻辑
        - NEXA AI 自动化可证明抵消分析师减少，且 SLA 没有降级
      - - ARR、留存或盈利数据均未公开；所有估值只能类比
        - 反向逻辑
        - 公司披露经审计指标，确认 ARR 超过 $100M 且 NRR > 110%
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    notes: |
      企业价值为区间的示意性中点。股权价值需要扣除 Vista Credit 债务（本金估计但未披露）以及各轮股权带来的任何优先权压力。概率信号为定性；反映分析师基于当前公开证据对情景可能性的判断，不是概率模型。
    claimRefs:
      - CV007
      - CV008
      - CV019
      - CV020
      - CV021
      - CV033
      - CV036
      - CV040
    columns:
      - 情景
      - 收入假设
      - 适用倍数
      - 隐含 EV（中点）
      - 关键假设
      - 概率信号
    rows:
      - - 乐观
        - $105M–$115M（相对 $91M 基准增长 10–15%）
        - 14x–15x（高增长 MDR 溢价；战略竞购）
        - ~$1.50B
        - NRR > 110%、AI 差异化获确认、战略收购方
        - 低-中；需要尽调确认增长和留存
      - - 基准
        - $91M–$100M（持平至温和增长）
        - 8x–10x（相对 15.5x 行业中位数，因不透明和领导层折价）
        - ~$865M
        - NRR 100–110%、NEXA 转型按计划推进、没有进一步客户流失
        - 中；最符合 IT-Harvest 下限和当前证据
      - - 悲观
        - $80M–$91M（裁员扰动后持平或小幅下滑）
        - 4x–5x（困境倍数；低于行业中位数；不透明风险）
        - ~$390M
        - 裁员后服务降级、领导层真空、留存下滑
        - 中-低；CEO 轮换和 30% 裁员推高该风险
  - id: TV004
    title: 可比估值表
    notes: >
      所有上市公司指标来自已抓取的分析师来源；Deepwatch 指标来自 IT-Harvest（经 BankInfoSecurity）和聚合工具（Growjo、IncFact）的估计。Deepwatch
      收入数字未获官方确认。可比收入倍数按可得口径为 EV/NTM 或 EV/LTM；私有 M&A 倍数来自 Solganick/Finro/Windsor Drake 报告。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV025
      - CV033
    columns:
      - 可比对象
      - 收入（LTM/估计）
      - EV 或交易价值
      - EV/收入倍数
      - 与 Deepwatch 的相关性
      - 局限
    rows:
      - - CrowdStrike (CRWD)
        - $4.81B（FY Jan 2026）
        - ~$165B 市值
        - 18.6x NTM EV/收入
        - 平台型 MDR/XDR，配 AI 原生 SOC；可作规模参照
        - 规模（$4.81B 对比 ~$91M）和盈利性不可比；只能作为上行锚点
      - - SentinelOne (S)
        - $1.0B+（FY Jan 2026）
        - ~$5.6B 市值
        - 3.5x NTM EV/收入
        - 相似的 AI 驱动检测定位；较小规模可比
        - 仍在亏损；MDR 不是 SentinelOne 的主产品；模式不同
      - - Rapid7 (RPD)
        - $852M LTM
        - ~$768M EV
        - 0.9x LTM EV/收入
        - MDR 和漏洞管理有重叠；显示倍数压缩风险
        - Rapid7 已盈利（19% EBITDA 利润率），但市场仍存疑；Deepwatch 是否盈利未知
      - - Palo Alto Networks (PANW)
        - $11B LTM
        - $201B EV
        - ~18x LTM EV/收入
        - 平台安全，包含托管 SOC 组件；规模上限
        - 规模不可比，收入超过 $9B，不能作为私有 MDR 可比对象
      - - 高增长网络安全中位数（Houlihan Lokey Q2 2025）
        - '>21.9% 增长；非单一公司'
        - 中位数 15.5x EV/2025E 收入
        - 15.5x
        - 若 Deepwatch 增长 >20% 且能提供文件证明，则适用
        - 增长率未确认；若低于 20%，适用中等增长桶（4.7x）
      - - MSSP 顶级平台 M&A（Solganick YTD 2025）
        - 多家公司；$100M+ ARR 档
        - 顶级平台约 20x EBITDA
        - N/A（基于 EBITDA）
        - 优质战略退出潜力的参照
        - Deepwatch EBITDA 未知；20x EBITDA 假设公开记录中缺失的盈利性
      - - 私有 MSSP 优质资产（Finro/Windsor Drake 2025）
        - 估计 ARR $80M–$200M
        - 8x–10x 收入（优质资产）；AI 差异化资产为 10x–15x
        - 8x–15x EV/收入
        - 私有 MDR M&A 退出区间的直接可比
        - 区间很宽；实际倍数取决于留存、增长率、AI 证明
      - - IT-Harvest 估计（Deepwatch，2025 年 11 月）
        - $91M LTM（估计）
        - $1.27B–$1.72B（估计）
        - 14x–19x 隐含
        - 仅有针对 Deepwatch 具名的分析师估计
        - 方法不透明；估计可能过时，或基于不完整信号数据
    enumerationScope:
      coverage: partial
      basis: >-
        Includes the four most commonly cited public cybersecurity comparables (CrowdStrike, SentinelOne, Rapid7, PANW)
        plus direct MDR/MSSP peers; excludes smaller-cap pure-plays due to limited data availability.
  - id: TV005
    title: 投资逻辑破裂和叫停触发因素表
    notes: |
      每个触发因素都是可观察、有时间边界的事件。「传导」描述该触发因素如何传导到投资逻辑。行动针对尽调阶段投资者；不是交割后的监控触发因素。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV027
      - CV028
      - CV034
      - CV038
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 三年四任 CEO
        - 2027 年前再次更换 CEO
        - 证实领导层结构性不稳；收购方折价或直接放弃
        - 立即击穿投资逻辑；退出，或仅在董事会层面治理修复后持有
      - - 裁员后 NRR 低于 95%
        - 尽调发现 FY2025 GRR 或 NRR 低于 95%
        - 分析师减少损伤交付模型；收入很可能收缩
        - 估值倍数下调 30–50%；悲观情景变为基准情景
      - - Vista Credit 债务契约违约
        - Vista Credit 触发违约或重组条款
        - 被迫以困境估值出售；股权劣后于债务回收
        - 投资逻辑破裂；股权价值实质受损
      - - Series C 至 2026 年中没有收入增长
        - 收入相对 2023 年基线持平或下滑
        - 资本部署无效；Series C 未带动增长
        - 倍数压缩至 Rapid7 区间（低于 1x）；悲观情景确认
      - - CrowdStrike 生态解绑或定价调整
        - CrowdStrike 终止 MDR 经销协议或重新定价
        - Deepwatch 失去六项 MDR 产品依赖中的五项；服务中断
        - 即时运营威胁；需要危机退出或战略出售
      - - NEXA AI 准确率事故（假阴性导致重大入侵）
        - 公开披露具名 Deepwatch 客户因 AI 导致安全失败
        - 平台可信度被摧毁；企业客户基础面临风险
        - 潜在客户流失；收入倍数压缩至 4x 以下
  - id: TV006
    title: 最终尽调问题表
    notes: |
      事项按阻断严重性排序。「阻断」事项会阻止任何投资逻辑成形。「重大」事项显著影响估值区间。「建议」事项确认或收紧假设，但不改变核心建议方向。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV028
      - CV030
      - CV039
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Series C 股权 / 债务拆分和 Vista Credit 条款
        - Vista Credit 部分的本金余额、利率、到期日、契约、提前还款条款
        - 没有债务条款，就无法判断股权企业价值和下行保护；契约违约是潜在的投资逻辑破裂点
        - 在 NDA 下向 Deepwatch CFO 和 Vista Credit Partners 索取
      - - 经审计 ARR 和收入明细（FY2023–FY2025）
        - 过去三个财年的经审计或管理层认证 ARR、按队列 MRR 和年度收入
        - IT-Harvest 的 $91M 估计未经验证；增长率和轨迹是主要估值驱动
        - 在 NDA 下向 Deepwatch 财务团队索取；与第三方估计对账
      - - 总留存率和净留存率（GRR/NRR，FY2024–FY2025）
        - FY2024 和 FY2025 按队列的美元加权 GRR 和 NRR，最好分裁员前后
        - NRR 决定经常性收入质量；GRR 低于 95% 会击穿投资逻辑
        - 向 Deepwatch 财务 / CS 团队索取；与 2022 年披露的「三分之二客户扩张」对标
      - - 裁员后分析师人数和 SLA 达成情况
        - 当前分析师人数、分析师 / 客户比、2025 年 11 月裁员前后的 MTTD/MTTR
        - Deepwatch 的交付模型依赖人工分析师小队；AI 抵消说法未经验证
        - 在 NDA 下向 Deepwatch COO 和运营领导层索取
      - - 股权结构表和清算优先权瀑布
        - 当前股权所有权明细、期权池规模、各轮优先权条款
        - 没有瀑布就无法评估股权价值；多轮融资叠加潜在 Vista Credit 股权认股权证
        - 在 NDA 下向 Deepwatch 法务索取；用 PitchBook/Tracxn 融资轮数据校验
      - - Dassana CTEM 商业化状态和 ARR
        - 商业 GA 日期、生产客户数、Dassana CTEM 模块贡献的 ARR
        - Dassana 收购是 2025 年主要产品扩张主张；收入贡献未确认
        - 在 NDA 下向 Deepwatch 产品和收入团队索取
      - - EBITDA 和经营现金流（FY2024–FY2025）
        - 过去两个财年的 EBITDA、调整后 EBITDA 和经营现金流
        - 用于套用 EBITDA 可比倍数，并评估 Vista Credit 融资工具的债务服务覆盖
        - 在 NDA 下索取经审计或审阅的财务报表
      - - Brian Dhatt 上任后的战略计划和 2026 ARR 指引
        - 展示 FY2026 ARR 目标和关键假设的内部投资者材料或董事会材料
        - Dhatt 任命意味着 AI / 工程转向；战略方向直接影响增长轨迹
        - 在 NDA 下向 Deepwatch CEO / 董事会索取；评估其与 NEXA 路线图是否一致
