  - id: FI001
    title: 收入模型桥接图——Deepwatch 如何把客户活动转成收入和毛利
    type: flow
    layout: wide
    summary: 展示企业客户从初始销售接触到持续平台交付，如何端到端为 Deepwatch 产生订阅收入和毛利。
    data:
      nodes:
        - id: n1
          label: 企业潜在客户（Fortune 2000 目标）
          description: 中大型企业缺少全职 24x7 SOC 能力或 SIEM 管理专长。痛点：告警量、人手短缺、监管压力。
        - id: n2
          label: 企业直销动作
          description: 方案工程驱动、销售主导的交易周期。没有自助服务；合同中位数约 $315K/年（Vendr 数据）。新增客户的典型 MDR 销售周期为 3–9 个月。
        - id: n3
          label: 年度订阅合同（ACV）
          description: 签署多年期企业协议，覆盖 Guardian MDR 平台层级（Core、Advanced 或 Enterprise）。收入在合同期内按比例确认。
        - id: n4
          label: 平台交付（Guardian MDR + NEXA AI）
          description: 24x7 SOC 运营、检测工程、威胁狩猎、自动化告警分诊。主要成本驱动：SOC 分析师人数 + 云基础设施。
        - id: n5
          label: 扩张与续约（增购 / NRR）
          description: 2022 年数据点：>2/3 的客户扩大了服务。扩张 ARR 来自 MXDR 附加模块、CTEM/Dassana 层，以及新的 SIEM 平台覆盖。暗示 NRR 高于 100%。
        - id: n6
          label: 订阅收入与毛利
          description: 经常性收入按比例确认。毛利 = 收入减去 SOC 人力、云和分包商成本。平台主导型 MDR 的行业基准毛利率为 50–55%；Deepwatch 专属毛利率未披露。
      edges:
        - from: n1
          to: n2
          label: 潜在客户接触
        - from: n2
          to: n3
          label: 签署合同
        - from: n3
          to: n4
          label: 平台交付义务
        - from: n4
          to: n5
          label: 服务质量驱动留存
        - from: n5
          to: n3
          label: 续约 / 增购形成新 ACV
        - from: n3
          to: n6
          label: 按比例确认收入
