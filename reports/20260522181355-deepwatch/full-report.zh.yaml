  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 不用 Deepwatch
      - Deepwatch 方案
      - 声称收益
      - 限制
    rows:
      - - 24/7 威胁监控
        - 需要内部 SOC 团队；告警量导致分析师疲劳
        - Guardian MDR Platform + NEXA Investigative Agent 方案
        - 不增加员工数即可获得 24/7/365 覆盖
        - 性能 SLA 未公开披露；一条客户评论提到，高告警量环境中告警疲劳仍然存在
      - - 威胁调查
        - 用 SIEM 查询语言手工搜索日志；每个事件耗时数小时
        - NEXA Investigative Agent 与 Narrative Agent 自动丰富数据并汇总
        - 营销说法：洞察从数小时缩短到数秒
        - 无第三方 MTTD/MTTR 基准；一名 AWS Marketplace 客户称 MTTR 改善 40-60%
      - - SIEM 运营化
        - SIEM 部署后需要 6-12 个月调优周期
        - 借助 BYOT 策略即时启用 SOC；包含 SIEM 工程专家
        - 现有 SIEM 投资更快产生价值
        - 营销说法；客户具体调优周期未获公开验证
      - - 暴露优先级排序
        - 手工漏洞扫描，风险评分以工具为中心
        - CTEM 模块，结合 Dassana 数据网格 + 双向 MDR 数据流
        - 按业务影响排出 Top-3 优先级
        - 附加成本；未与独立 CTEM 厂商做独立对比
      - - 董事会汇报
        - CISO 手工用分散工具数据拼出的幻灯片
        - NEXA CTEM Agent 生成实时董事会级风险报告
        - 非技术干系人可用自然语言查询安全态势
        - 输出格式和报告频率未公开说明
      - - 数据管道管理
        - 按 SIEM 摄取；新增数据源迁移成本高
        - 集成 Cribl，支持原位搜索、规范化和数据湖路由
        - 数据主权和可移植性增强；摄取成本降低
        - Cribl 集成依赖合作伙伴关系；客户需单独购买 Cribl 许可
      - - 合规证据收集
        - SOC 2 / PCI 审计需手工收集证据
        - CTEM 自动生成审计轨迹并收集证据
        - 审计工作量下降，合规周期缩短
        - 自动化证据收集范围未获外部审计
    notes: >
      「声明收益」列中的收益来自官方来源，是公司归因的说法；「限制」列反映独立来源和一条 AWS Marketplace 客户评论中的缺口、限定条件或矛盾。MTTD/MTTR
