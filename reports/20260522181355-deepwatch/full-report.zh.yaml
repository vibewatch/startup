      - number: '5.3'
        title: BYOT 集成与合作伙伴生态
        blocks:
          - type: paragraph
            body: >
              Deepwatch 的集成策略围绕四个 SIEM 关系和两个基础设施合作展开。SIEM 方面，Splunk 是最初支持的平台，并通过 Splunk Ventures 参与 Series
              C，仍是核心投资方。Microsoft Sentinel 支持于 2024 年 4 月加入，随后 CrowdStrike 作为 EDR/XDR 数据源加入，Google SecOps 则于 2025 年 7
              月通过 Google Cloud MSSP Initiative 接入。Securonix 支持——第四个具名 SIEM——在 2026 年 2 月 24 日宣布，将可触达市场扩展到 Securonix
              的企业客户群。Deepwatch 表示会继续根据客户需求评估更多 SIEM 集成，说明 BYOT 路线图尚未封闭。

              数据基础设施方面，Cribl 合作支持完整 Cribl 产品套件（Stream、Edge、Search、Lake、Cloud），把它作为数据规范化和路由层。这让客户保留数据主权、无需迁移即可原地搜索，并降低每
              GB 摄取成本。云基础设施方面，Deepwatch 持有 AWS Level 1 MSSP Competency Partnership，并具备覆盖 Amazon EKS 容器化工作负载的 Modern
              Compute Specialization。CloudFormation 集成模板（GitHub 上的 aws-ia/cfn-abi-deepwatch-mdr）自动化部署 AWS 环境中的 Deepwatch
              MDR 集成；截至研究日期，该 GitHub 仓库社区牵引很小（1 star、8 watchers），更符合 Deepwatch 闭源、服务交付模式，而不是开发者可扩展平台。公开注册表或文档门户中未发现公开
              API 文档或开发者 SDK，说明技术集成由 Deepwatch 自己的 SIEM 工程团队管理，而非客户自助。
