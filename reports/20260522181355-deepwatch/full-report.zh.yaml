  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Guardian MDR Platform 与 Open Security Data Architecture
        blocks:
          - type: paragraph
            body: >
              Deepwatch 把 Guardian MDR Platform 定位为 "Precision MDR" 服务，把 AI 驱动的威胁检测与 24/7/365 人类专家监督结合起来。公司没有打造单体自有
              SIEM，而是选择 2024 年 3 月推出的 Open Security Data Architecture（OSDA）作为核心架构。OSDA 旨在同时支持多个 SIEM、数据湖、XDR
              平台和关联引擎，让客户保留既有安全投资，同时由 Deepwatch 接手运营化。该架构支持对原生数据位置进行联合搜索、多模态生成式 AI 分析，以及自研超自动化，在分散数据源之间编排响应动作。

              平台的 BYOT（Bring Your Own Technology）策略，是相对于依赖单一 SIEM 的 MDR 竞争对手的主要差异化。截至 2026 年 2 月，支持的 SIEM 包括
              Splunk、Microsoft Sentinel、Google SecOps 和 Securonix。Securonix 集成于 2026 年 2 月 24 日宣布，明确瞄准「SIEM 能力缺口」——企业
              SIEM 理论上能做什么，与内部团队现实能交付什么之间的距离。Deepwatch 将 BYOT 模式定位为可实现「即开即用 SOC」，绕开典型 6-12 个月 SIEM 调优周期。Cribl 合作（2024 年
              6 月）通过加入 Cribl Stream、Edge、Search、Lake 和 Cloud，扩展了 OSDA 的数据管道选项，支持数据规范化、无需迁移的原地搜索，以及更广的数据湖支持。所有生产基础设施都托管在
              AWS 上，位于客户专属隔离 VPC 内。
