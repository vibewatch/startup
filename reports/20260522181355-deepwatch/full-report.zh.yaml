      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: |
              四股汇合的结构性力量推动 MDR 市场增长。第一，网络安全人才短缺是系统性的，而且还在加深。Programs.com 的 2026 年统计汇编显示，
              全球约有 4.8 million 个网络安全岗位空缺，需要员工规模增加 87% 才能满足需求。ISACA 的 2025 State of Cybersecurity 调查发现，
              55% 的网络安全团队人手不足，65% 有未填补职位，只有 29% 的企业为非安全员工转岗到安全岗位提供培训——低于上一年的 41%。
              ISC2 2025 Cybersecurity Workforce Study 基于 16,029 名从业者，认定预算削减和招聘冻结是主要约束，说明短缺不仅是人才管道问题，
              也是经济问题。对 MDR 提供商来说，人员压力是直接收入驱动：无法招聘 SOC 分析师的组织必须外包。

              第二，监管合规要求正在创造非自由裁量需求。CMMC 最终规则于 2025 年 11 月 10 日生效；到 2026 年 10 月 31 日，
              所有涉及联邦合同信息（FCI）或受控非密信息（CUI）的新 DoD 合同，都要求
              CMMC Level 2 或 Level 3 认证。CMMC Level 3 明确要求 24/7 SOC 能力（IR.L3-3.6.1e）和主动威胁狩猎（RA.L3-3.11.2e），
              实际上要求国防供应链使用 MDR 或等价方案。HIPAA 提议的 2024 Security Rule 更新要求 72 小时内恢复关键系统并强化审计控制。
              PCI DSS 4.0 自 2025 年 3 月 31 日起强制执行，要求自动化审计日志审查和 24/7 安全事件人员可用性。SEC 网络安全事件披露规则
              要求上市公司在数日内通报重大网络事件，并证明风险管理成熟。这些要求共同把 MDR 从可选风险投资推成受监管行业的合规经营成本。

              第三，AI 和自动化通过降低每名分析师的覆盖成本，正在扩展 MDR 经济性。bitsIO 2025 年分析引用行业调查称，在安全运营中使用 AI
              的组织报告节省最高可达 $1.9M。Gartner 预测，到 2026 年，50% 的 SOC 将部署基于 AI 的决策支持。SOC 运营转向智能体 AI——
              AI 在人工监督下分诊、补充信息并发起响应——让 MDR 提供商每名分析师可服务更多客户，并可能把可服务市场扩展到过去服务起来不经济的
              更小组织。Deepwatch 的 NEXA Agentic AI Ecosystem 正是围绕这种模式设计。

              第四，BYOT 和不绑定 SIEM 的需求降低了 MDR 采用的切换门槛。已经投资 Splunk、Microsoft Sentinel、Google SecOps 或 Securonix
              的组织面对一个典型能力缺口：它们拥有强大的分析平台，却缺少 24/7 人员来运营。Deepwatch 称之为「SIEM 能力缺口」——
              技术能做到什么与内部团队现实能交付什么之间的距离。平台无关 MDR 把客户现有 SIEM 运营起来，相比平台主导或自建路径所需的
              6–12 个月 SIEM 调优，能把实现价值时间缩短到「即开即用」。

              采用约束包括预算压力（ISACA 2025 调查中 53% 受访者报告安全预算不足）、对第三方访问敏感环境缺乏信任、异构技术栈中的集成复杂度，
              以及当提供商在专有黑盒中控制检测逻辑时产生的 MDR 锁定风险。Deepwatch 的透明定位——「没有黑箱」——直接回应了信任和锁定担忧。
              Deepwatch 自身的一个结构性约束是联邦级层级：没有 FedRAMP 授权和美国公民分析师要求，Deepwatch 在结构上被排除在 DoD/联邦采购管道之外，
              而这正是监管驱动需求池中增长最快的一块。
