chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与总部历史
        blocks:
          - type: paragraph
            body: |
              Deepwatch 自称是 AI 驱动、人主导安全运营的领导者，并把当前产品定位为自主 SOC 平台。
              商业模式是托管检测与响应：公司运营一个 24x7/365 SOC，由安全分析师值守，并由 NEXA Agentic AI
              Ecosystem 支撑；对缺少内部资源或专业能力、无法规模化运营完整安全运营中心的企业安全团队来说，
              Deepwatch 相当于外部延伸。客户选择自己的 SIEM——Splunk、Microsoft Sentinel、Google SecOps
              或 Securonix——Deepwatch 再用 Guardian MDR Platform 将其运营起来，把检测工程、威胁狩猎和
              自动化告警调查组合在一起。2025 年 2 月收购 Dassana 后，平台新增持续威胁暴露管理和 AI 驱动的
              风险优先级排序，能力边界从纯 MDR 向外延伸。

              公司地理沿革重要，因为数据库对总部仍有分歧。Deepwatch 起源于 Tampa Bay 地区，2016 年开始是
              GuidePoint Security 内部的虚拟 SOC 服务。2019 年 4 月，公司正式注册并拆分为 Deepwatch，同时完成
              $23 million Series A 融资。Deepwatch 自己的联系页面和 2024 年 2 月之后的新闻稿都把公司放在 Tampa，
              但 2025 年 6 月的一份新闻稿宣布公司总部迁至 250 Cambridge Avenue, Palo Alto, California，并描述了
              保留 Tampa 运营能力的双海岸模式。2026 年 5 月 CEO 任命公告确认了 Palo Alto 的发稿地。截至研究日期，
              官方联系页面还列出印度 Bengaluru 办公室。第三方数据库（LeadIQ、Tracxn 以及部分地理聚合网站）
              仍列出 Tampa、St. Petersburg 或 Denver 地址；这些都不能反映当前官方总部。尽调应把 Palo Alto 视为
              当前法务和高管总部地址，把 Tampa 视为运营枢纽，并将第三方地点数据视为过时。
