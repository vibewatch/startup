            body: >
              2025 年 11 月裁员 60–80 人（约占总员工 25–30%）是最重要的近期客户风险。Deepwatch
              的价值主张建立在具名、重人力的分析师小队模式之上；分析师/客户比或响应时间一旦恶化，可能触发企业续约审查。未发现与裁员相关的公开 SLA 违约或客户流失，但结构性风险真实存在，尽调中必须验证。
