      - number: '5.5'
        title: 信任、合规与安全架构
        blocks:
          - type: paragraph
            body: >
              Deepwatch 的安全姿态以公开信任中心（security.deepwatch.com）和多认证合规栈为锚。SOC 2 Type
              II（Security、Availability、Confidentiality）自成立以来每年维持。ISO/IEC 27001:2022 认证于 2024 年首次获得，覆盖信息安全管理体系。PCI DSS
              Level 1 Service Provider 认证自成立以来一直维持，尽管 Deepwatch 并不直接处理持卡人数据。GDPR 和 TRUSTe Data Governance
              认证覆盖数据隐私义务。2026 年 5 月，Deepwatch 为 NEXA 生态增加 ISO/IEC 42001:2023——AI 管理体系标准——这是外部验证的 AI 治理资质，公司描述其作用类似 ISO
              27001 之于信息安全。Deepwatch 还维持 CSA STAR Registry Level 1 列名（CAIQ，2022 年 11 月）。

              架构安全控制包括：所有静态数据在 EBS volumes、EC2 instances 和 S3 buckets 中使用 AWS KMS 管理的 AES-256 加密；所有传输中数据使用 TLS 1.2；每客户隔离
              VPC；所有员工生产访问通过零信任应用，提供点到点、应用层连接。身份与访问通过 IAM 提供商管理，并由 HRIS 触发自动配置，按季度审计凭证。所有平台账户强制单点登录和 MFA。AWS Marketplace
              上的客户反馈提到 MTTR 降低 40-60%、误报降低 30-40%，但也指出高流量环境中的告警疲劳、常见威胁模式自动化处置剧本有限等改进点。这些是个别客户观察，不是供应商发布的性能指标，只能作为方向性信号。
