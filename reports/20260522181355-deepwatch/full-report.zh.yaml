  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: |
              托管检测与响应（MDR）是一种签约式、远程交付的安全运营服务，代表订阅组织提供持续威胁监控、检测、调查和
              主动响应——包括威胁遏制和缓解。Gartner 在 2025 年 10 月 Market Guide 中强调，真正的 MDR 核心特征是
              人主导：熟练分析师在语境中调查并响应，这把 MDR 与单纯工具管理或告警转发区分开来。技术——EDR/XDR 平台、
              SIEM、UEBA、自动化剧本——是必要条件，但不够；MDR 价值还需要分析师判断、威胁狩猎节奏，以及带业务语境的发现。

              MDR 市场边界包括以外包服务方式交付的 24/7 威胁监控和调查、检测工程、事件响应和遏制、威胁狩猎，以及托管威胁暴露功能收入。
              它排除独立端点检测产品（例如没有托管分析师覆盖的原始 EDR 授权）、没有响应能力的托管 SIEM 授权、独立事件响应保留服务
              等纯专业服务项目，以及内部 SOC 人力成本。边界会影响规模测算：市场研究机构对托管 XDR（MXDR）和 SOC 即服务（SOC-as-a-Service）
              究竟是 MDR 子板块还是独立类别看法不同，这是已发布市场规模估计差异很大的主要原因。

              现状替代方案——买方不买 MDR 时会怎么做——包括自建内部安全运营中心（SOC；仅人力底线成本每年 $1.2M–$1.8M，
              另加技术成本）、聘请传统托管安全服务提供商（MSSP）做日志转发和告警生成但不做主动响应、
              采用 EDR 厂商打包的平台主导托管服务（例如 CrowdStrike Falcon Complete、SentinelOne Vigilance Respond），
              或者什么都不做——接受非工作时段覆盖不完整。MDR 与 MSSP 的差异在于人主导响应义务；MSSP 合同通常包含告警通知，
              但不包含遏制。
