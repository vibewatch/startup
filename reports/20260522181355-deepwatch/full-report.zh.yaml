      - number: '4.2'
        title: 融资历史、资本结构与资金充足性
        blocks:
          - type: paragraph
            body: >
              Deepwatch 已在三轮公开融资中披露累计融资 $256 million。Series A（$23 million，2019 年 4 月）由 ABS Capital Partners
              领投；它也是贯穿三轮、持有时间最长的机构支持者。Series B（$53 million，2020 年 10 月）由 Goldman Sachs 领投，ABS Capital 参投。Series C（$180
              million，2023 年 2 月 15 日）由 Springcoast Capital Partners 和 Splunk Ventures 的股权投资，加上 Vista Equity Partners
              旗下信用投资部门 Vista Credit Partners 的「战略融资」分档组成。这轮合计 $180 million，是公司最大单笔资本事件，也把 Vista Credit 超过 $10B AUM
              的信贷能力带入股权结构表。


              Series C 的股权/债务构成没有公开披露。Vista Credit Partners
              明确把其产品描述为「非稀释性信贷解决方案」，说明其部分更像债务工具而非股权；但契约、到期日，以及任何认股权证或转换条款均未公开。LeadIQ 的公司资料显示总成长资本「超过 $275 million」，比官方
              $256 million 公告高出 $19 million；差额很可能来自 Vista Credit
              部分按完整承诺授信规模统计，而不是按已披露的股权等价口径统计。这一差异不代表存在额外未披露股权轮，而是不同数据库分类信贷工具的方法不同。


              截至运行日期（2026 年 5 月），自 2023 年 2 月以来没有宣布新融资轮——间隔约 27 个月。2025 年 11 月裁员约 30%，与在既有资本基础上延长现金跑道相符，尽管管理层把裁员归因于 AI
              驱动的效率提升，而非现金压力。尚无 Deepwatch IPO、SPAC 或被收购报道。账面现金、月度烧钱速度、Series C
              剩余现金跑道均未公开，使资金充足性成为关键尽调缺口。没有新一轮融资的含义并不清晰：可能代表资本效率（2023 年融资提供足够现金跑道），也可能代表在私营网络安全公司信用环境趋紧时，无法以有吸引力条款融资。
