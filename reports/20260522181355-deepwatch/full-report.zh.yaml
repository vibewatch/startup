      - number: '8.4'
        title: 战略 M&A、IPO 与退出准备度
        blocks:
          - type: paragraph
            body: >
              Deepwatch 的退出背景同时受运营和市场因素约束。MDR 市场结构性顺风很强：Mordor Intelligence 估计全球 MDR 市场 2025 年为 $4.19 billion，到 2030 年以
              21.95% CAGR 增至 $11.30 billion，与 Deepwatch 的价值主张一致。2025 年网络安全 M&A 创历史交易量（426 起交易，披露总价值 $92.5B），按 KPMG
              统计战略买家占交易量 60% 以上。Momentum Cyber、Windsor Drake 和 Solganick 均明确将 MDR、SOC 自动化和 AI 驱动检测平台列为头部收购目标。对定位良好的 MDR
              厂商来说，这是有利环境。

              但 Deepwatch 自身退出准备度存在障碍。对于 IPO，Strategy of Security 的 2026 年管线分析认为，网络安全 IPO 候选公司需要类别领导者规模——通常为 $400M+
              ARR、高增长，并接近 GAAP 盈利。Deepwatch 估计收入 $91M–$113M，盈利能力未知，2026 年不在 IPO 区间内，2027 年也大概率不在。对于战略 M&A，公司对
              CrowdStrike 模块的集中度（六个 MDR 产品中五个依赖 CrowdStrike）、单一云 AWS 架构，以及三任 CEO 的高管更替，限制了理性战略收购方名单——主要是 CrowdStrike
              本身、寻求 MDR 能力的大型 MSSP，或 PE 平台整合方。

              Vista Credit Partners 的姿态会影响退出时点。2025 年 7 月，Vista 募集 $5.6B 延续基金以继续持有 Cloud Software Group
              而不是退出，释放出愿意延长组合持有期的信号。Vista Credit AUM 增至 $10B+（2025 年 9 月），成立以来投资超过 700 项、部署超过 $15.4B；Deepwatch
              信贷头寸只是其中之一。Private Equity Wire 报道的 PE 退出环境截至 2025 年仍受约束，Vista 通过扩展债务承销在退出放缓期间创造费用收入。上述背景表明，短期内 Vista
              Credit 更可能延展而非强制出售 Deepwatch 债务头寸，降低贱卖风险，但也移除了 IPO 压力。股权投资者（Springcoast、ABS Capital、Goldman、Splunk）通常有 5–8
              年持有窗口，把回报实现的主要压力放在 2025–2028 年框架内。
