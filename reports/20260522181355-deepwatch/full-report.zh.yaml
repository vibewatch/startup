  - id: TU003
    title: 具名客户证据表
    enumerationScope:
      coverage: sample
      basis: >
        Deepwatch lists 25 named case studies on CaseStudies.com and 25 on its own website. The six rows below represent
        publicly attributed deployments with named executive contacts and quantified outcomes. Anonymized customers
        (e.g., "Leading Retail Company") are excluded because outcome claims cannot be independently cross-checked
        without a named reference. The sample prioritizes cases where at least one named executive quote and one
        quantified metric are available from at least two independent sources.
    columns:
      - 客户
      - 分群
      - 部署 / 用例
      - 生产 / 试点
      - 声明结果
      - 证据限制
    rows:
      - - Genuine Parts Company
        - 制造 / 全球分销（200,000+ 个端点）
        - Deepwatch Guardian MDR Platform；Splunk SIEM 管理；24/7 SOC，替换既有供应商
        - 生产；多年期；全球
        - 6 周上线；立即实现价值；Damian Apone（Global Security Program Director）称：“我这辈子从没见过执行得这么完美的事情”
        - 结果为定性描述；公开来源没有把量化 MTTD/MTTR 或成本数字归因到该客户
      - - City National Bank of Florida（客户）
        - 金融服务（区域银行）
        - 24/7/365 MDR + 托管防火墙，与 Splunk 集成；全托管 SOC
        - 生产；多年期；引用归属 CISO Brian Fricke
        - 网络保险保费下降约 80%；审计准备从数天缩短到数分钟；通过渗透测试验证安全态势，并缩短驻留时间
        - 指标来自公司发布的案例研究 PDF（Dec 2025）；未经独立审计；保险保费下降除 MDR 外也可能受市场环境影响
      - - SBA Communications
        - 电信 / REIT（塔楼基础设施）
        - Guardian MDR Platform；MITRE ATT&CK 对齐；双向工单；自动化工作流
        - 生产；连续 2+ 年；引用归属 Ryan Hay（Director IT Security）
        - 两年内零已声明事件；Security Index 9.64（高于行业和客户平均）；网络保险保费下降；误报显著减少
        - Security Index 是自有指标；“零已声明事件”可能反映可见性受抑，也可能反映检测强——需要尽调；仅有公司发布来源
      - - Informatica
        - 云数据管理 / 技术（100+ 个工程团队）
        - Guardian MDR Platform 用于规范化漏洞管理；容器化工作负载归因；定制威胁情报集成
        - 生产；引用归属 Nikhil Singh（Sr. Security Engineering Manager）；Feb 2026 案例研究
        - 退役内部管道每年节省 $77K 运营成本；实时董事会可用仪表盘；构建阶段修复更快
        - 节省数字仅来自公司案例研究；未经独立验证；相较总安全预算，$77K 节省幅度不大，可能被选择性突出
      - - Ezer Group
        - 金融服务（私募股权 / 资产管理）
        - Deepwatch MDR 平台；检测调优；定制化告警
        - 生产；Justin Smith（CEO）和 Gus Ghiarello（COO）均被引用
        - 90 天内告警量从 17,000 降至 8；COO 称：“凭借这种定制化水平，Deepwatch 能抓到其他机构抓不到的告警”
        - 17,000 降至 8 的告警降幅很大，与 Dynamic Risk Scoring 抑制噪声的逻辑一致；未提供基线日志量或告警保真度测量
      - - R.J. O'Brien（客户）
        - 金融服务（期货经纪交易商）
        - 借助 Deepwatch MDR 获得 24/7 威胁检测、更强安全态势和成本节省
        - 生产；引用归属 John Woods（Global CISO）
        - 安全态势增强并节省成本；具体数字未公开披露
        - 公开来源没有量化指标；仅 CaseStudies.com 将说法归属到具名 CISO
    notes: >
      所有结果数据来自公司发布的案例研究页面（deepwatch.com 资源页）和 CaseStudies.com 聚合方，后者转载 Deepwatch 提供的内容。FeaturedCustomers
      参考材料佐证了这些客户关系存在。任何一行都没有独立审计、第三方基准测试或经验证客户数指标。「生产 / 试点」判断根据案例研究中显示多年持续部署的语言推断；
      没有客户明确给出生产上线日期。尽调在依赖结果指标构建投资逻辑前，应至少与两家具名客户做客户访谈。
