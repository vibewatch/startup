      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: |
              MDR 买方可以拆成四个结构上不同的层级，它们在合规要求、预算权力和供应商选择标准上各不相同。大型企业（收入高于约 $1B、
              Fortune 500/Global 2000）按 Mordor 2025 年数据贡献约 57.65% 的 MDR 支出。它们采用 MDR 的触发点通常是董事会层面的
              网络风险要求或保险要求，预算所有者是 CISO，并受董事会监督；评估供应商时，它们看检测工程深度、集成灵活性和治理透明度。
              中端市场（收入 $50M–$1B）是按单位数量增长最快的买方类别；这个层级的组织规模大到不能忽视复杂攻击，但通常没有资源组建
              24/7 内部 SOC。eSentire 估计，中端市场组织若要建立最低限度的内部 SOC，仅人力每年就需要 $1.2M–$1.8M，因此外包 MDR
              在经济上有吸引力。

              中小企业（SME）预计至 2031 年以 27.02% CAGR 扩张（Mordor），是规模分段中增长率最高的一类。SME 尤其偏好云原生、
              订阅式 MDR，因为月度成本可预测、集成负担低。公共部门是独立第四层：联邦和 DoD 买方要求 FedRAMP Marketplace 授权、
              美国公民分析师配置，并遵守 CMMC、FISMA 和 NIST SP 800-53；这形成结构性门槛，多数商业 MDR 供应商没有专用联邦基础设施
              就无法满足。Deepwatch 当前平台定位于商业企业和中端市场买方；截至研究日期，它没有公开持有 FedRAMP 授权。

              垂直行业集中度会影响 GTM。BFSI、医疗、政府和国防、IT 和电信是采用度最高的垂直领域。医疗机构同时承受 HIPAA Security Rule
              执法、勒索软件攻击（医疗占各行业全部勒索软件攻击的 17%）和长期人员短缺压力。BFSI 买方面临 SEC 披露规则和 PCI DSS 4.0
              强制要求。国防承包商面临 CMMC。中端市场 MDR 买方的典型采用路径包括合规触发（CMMC、HIPAA 或网络保险审计）、
              同行推荐或分析师候选名单、概念验证或 90 天试用，随后签订多年订阅合同。从初始评估到签约，典型买方旅程为三至六个月。
