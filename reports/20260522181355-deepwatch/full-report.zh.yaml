  - id: FM001
    title: MDR 市场规模金字塔 — TAM、SAM 和 SOM 视角（2026）
    type: pyramid
    layout: standard
    summary: 三层测算：全球 MDR TAM 来自公开分析师估计；商业非联邦 SAM 由北美 + 西欧平台无关 MDR 估算；Deepwatch SOM 区间承认缺少公开厂商份额数据。
    data:
      items:
        - label: TAM — 全球 MDR 市场（2026，共识区间）
          value: $4–6B revenue (2026)
          note: 分析师区间：Precedence $3.92B（窄口径）到 MarketsandMarkets $6.28B（宽 MXDR 口径）；中点约 ~$4.8B
          layer: 1
          claimRef: CM008
        - label: SAM — 商业非联邦 MDR（北美 + 西欧）
          value: ~$2.0–2.5B (est.)
          note: 北美约占 TAM 的 36–46% = $1.4–2.9B；剔除联邦级层级（按 Quzara 结构估计为北美市场 10–15%）后，得到商业平台无关玩家的粗略 SAM。该估计是分析师推导，不是已发布数字。
          layer: 2
          claimRef: CM014
        - label: SOM — Deepwatch 可获取份额
          value: Not quantifiable from public data
          note: Deepwatch ARR 和客户数未披露。没有分析师机构按 BYOT/平台无关 vs. 平台主导拆分 MDR。SOM 估计需要私下尽调。
          layer: 3
          claimRef: CM041
    approximationNotes: >-
      TAM 中点（$4.8B）是 Precedence Research（$3.92B）和 MarketsandMarkets（$6.28B）2026 年估计的算术平均。SAM 是一种推导：套用北美收入份额（40% 中点）并剔除估计
      15% 的联邦级组成；这不是来自任何一手分析师来源的近似值，只能视为方向性参考。由于缺少 Deepwatch 收入数据，SOM 明确不量化。
    claimRefs:
      - CM008
      - CM014
      - CM041
