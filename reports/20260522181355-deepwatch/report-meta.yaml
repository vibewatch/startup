  productSummary: |
    Guardian MDR Platform with NEXA Agentic AI Ecosystem: 24/7/365 managed detection and
    response backed by six AI agents (Investigative, Narrative, Response, CTEM, Detection
    Advisor, Reporting). SIEM-agnostic BYOT strategy supports Splunk, Microsoft Sentinel,
    Google SecOps, and Securonix. Dassana-acquired CTEM module provides Continuous Threat
    Exposure Management. ISO/IEC 42001:2023-certified AI governance (achieved May 2026).
    Service tiers: Core, Advanced, and Enterprise.
  customerFocus: |
    Fortune 500 and Global 2000 enterprises in regulated verticals — financial services
    (SOX, PCI DSS, GDPR), healthcare (HIPAA), manufacturing, and retail. Sold exclusively
    through channel partners (VARs, MSSPs) via the Xcelerate Partner Program.
  businessModel: |
    Annual subscription recurring managed security services; tiered SKUs (Core, Advanced,
    Enterprise); 100% channel-only distribution since founding; median contract approximately
    $315,000 per year (Vendr benchmark, unverified for current pricing).
  stage: "Series C (growth)"
  fundingStatus: |
    $256M total disclosed: Series A $23M (ABS Capital, April 2019), Series B $53M (Goldman
    Sachs lead, October 2020), Series C $180M combining equity (Springcoast Capital, Splunk
    Ventures) and non-dilutive structured credit (Vista Credit Partners), February 2023. No
    new round announced since Series C. No post-money valuation has been publicly disclosed.
  disclosureProfile: private-undisclosed
