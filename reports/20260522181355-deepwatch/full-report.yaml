      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vista Credit debt terms and covenant risk are the highest-severity undisclosed financial item
            body: |
              The $180M Series C combines equity from Springcoast and Splunk Ventures with a non-dilutive
              credit facility from Vista Credit Partners. Vista Credit explicitly describes its product as
              debt, not equity. The face value of the credit tranche, interest rate, maturity date, financial
              maintenance covenants (e.g., minimum ARR or cash balance triggers), and any attached warrants
              or conversion rights are all private. If covenants include revenue or ARR floors, a slowdown
              in growth could trigger accelerated repayment obligations that constrain Deepwatch's ability
              to reinvest in the platform or raise follow-on equity on favorable terms. Any investor in a
              new round must treat the Vista Credit terms as a priority diligence item.
