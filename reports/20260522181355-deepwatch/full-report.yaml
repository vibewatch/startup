      - number: '8.2'
        title: Public Comparable Multiples and Private Market Benchmarks
        blocks:
          - type: paragraph
            body: >
              In the absence of disclosed financials, valuation must be anchored to public comparables and private
              market benchmarks sourced from fetched analyst reports.

              Public cybersecurity comps. CrowdStrike (CRWD) generated $4.81 billion in fiscal-year revenue (FY ended
              Jan 2026), with gross margins of ~75% and approaching GAAP operating profitability. It trades at
              approximately 18.6x NTM EV/Revenue—a premium reflecting platform breadth, proven cross-sell, and scale.
              SentinelOne (S) crossed $1 billion in revenue for the first time with 74% gross margins but a GAAP
              operating loss of ~30%; it trades at approximately 3.5x NTM EV/Revenue, reflecting uncertainty about its
              profitability timeline. Rapid7 (RPD) carries $852 million LTM revenue, is profitable (EBITDA $156M, 19%
              margin), and trades at ~0.9x LTM EV/Revenue—a stark compression reflecting market skepticism about
              long-term differentiation. Palo Alto Networks (PANW) reported $11B LTM revenue and $201B EV, implying ~18x
              LTM EV/Revenue at a scale and profitability level Deepwatch cannot approach.

              Sector median benchmarks. Windsor Drake's Q4 2025 report, citing Houlihan Lokey's Cybersecurity Quarterly
              Update Q2 2025, segmented the public comp set: high-growth vendors (>21.9% median revenue growth) achieved
              a median of 15.5x EV/2025E revenue; medium-growth vendors (14.7% median growth) achieved 4.7x; low-growth
              vendors (4.5% median growth) achieved 2.6x. Solganick's MSSP M&A YTD 2025 report found that some
              top-performing MSP platforms recorded ~20x EBITDA exit multiples in competitive processes; more typical
              MSSP transactions fell in the 8x–14x EBITDA range. SecurityWeek cataloged 426 cybersecurity M&A deals in
              2025 with a total disclosed value of $92.5 billion, including 125 MSSP-category deals.

              Private MDR valuation anchors. The two mega-deals—Google's $32B acquisition of Wiz and Palo Alto Networks'
              $25B acquisition of CyberArk—are outliers reflecting cloud security and identity category leadership at
              scale. More directly comparable are private MDR/MSSP transactions at the $100M–$999M revenue tier. Finro's
              mid-2025 analysis of 250+ cybersecurity companies distinguishes MDR/Threat Intelligence/Incident Response
              as a niche with valuation driven by growth rate, recurring revenue quality, and AI
              differentiation—identical to Deepwatch's value proposition. Applying the sector's medium-growth multiple
              (4.7x) to IT-Harvest's $91M estimate yields $428M; high-growth (15.5x) yields $1.41B. The IT-Harvest band
              of $1.27B–$1.72B is internally consistent with a 14x–19x revenue multiple applied to $91M—which would only
              be justified by sustained high growth, strong retention, and a clear AI-differentiation premium, none of
              which can currently be verified from public evidence.
            claimRefs:
              - CV015
              - CV016
              - CV017
