  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: MDR Competitive Landscape — Archetypes and Market Structure
        blocks:
          - type: paragraph
            body: |
              The MDR market is not monolithic: six structurally distinct provider archetypes compete for
              overlapping but non-identical buyer segments. Efros's May 2026 MDR provider comparison
              taxonomy identifies these as: (1) EDR-vendor MDR overlays, where the endpoint protection
              platform vendor delivers managed detection on its own stack (CrowdStrike Falcon Complete,
              SentinelOne Vigilance/Wayfinder, Microsoft Defender Experts, Palo Alto Cortex MDR);
              (2) pure-play service-led MDR, vendor-agnostic services that integrate across the customer's
              existing stack (Arctic Wolf, eSentire, Red Canary, Expel, Huntress); (3) MSSP/MDR hybrid,
              where MDR is one offering alongside SIEM operations, compliance, and vCISO services
              (Rapid7, Secureworks, Deepwatch, Optiv, regional MSSPs); (4) cloud-native MDR, focused
              on cloud workload and SaaS telemetry (Lacework, Wiz Defend, Sumo Logic); (5) SMB-tier
              channel MDR, right-sized for organizations under 250 employees at $10–$30/endpoint/month
              (Huntress, Blackpoint Cyber, Field Effect); and (6) specialized MDR, for OT/ICS, threat
              intelligence, or post-incident environments (Dragos, Mandiant, GuidePoint Security).

              Deepwatch explicitly targets the mid-market and enterprise commercial segment within the
              MSSP/MDR hybrid archetype with a platform-agnostic differentiation. Efros categorizes
              Deepwatch alongside Rapid7, Secureworks, and Optiv as MSSP/MDR hybrids serving
              organizations that want unified security operations, strategy, and incident response
              under a single contract. However, Quzara's 2026 buyers' guide positions Deepwatch as
              a commercial platform-agnostic MDR player alongside Arctic Wolf, eSentire, Red Canary,
              Expel, and ReliaQuest—a peer group that emphasizes SIEM and EDR independence over the
              MSSP label. The dual positioning reflects Deepwatch's BYOT model, which spans both service-
              led SIEM-agnostic delivery and MSSP-grade breadth. The Gartner October 2025 Market Guide
              for Managed Detection and Response Services (by Pete Shoard, Andrew Davies, and Angel
              Berrios) defines successful MDR vendors as those focused on high-fidelity threat detection,
              investigation, and mitigation response with human-interpretable, business-focused reporting.
              By 2028, Gartner projects 50% of MDR deliverables will include threat exposure findings
              (up from ~20% in 2025), a shift that favors vendors—including Deepwatch—that have
              already integrated CTEM capability.
