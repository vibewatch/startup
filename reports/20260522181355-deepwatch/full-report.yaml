companyProfile:
  summary: |
    Deepwatch is a private managed detection and response (MDR) company that traces its
    operational roots to a virtual SOC offering within GuidePoint Security in 2016, formally
    incorporated as an independent entity in late 2018 and completing its first external funding
    round (Series A, $23M) in April 2019. The company raised $256 million across three rounds
    from ABS Capital Partners, Goldman Sachs, Springcoast Capital, Vista Credit Partners
    (structured non-dilutive debt), and Splunk Ventures. It relocated its headquarters from
    Tampa, FL to Palo Alto, CA in June 2025. The current product is the Guardian MDR Platform
    with the NEXA Agentic AI Ecosystem — six collaborative AI agents (Investigative, Narrative,
    Response, CTEM, Detection Advisor, and Reporting) — and a SIEM-agnostic Bring Your Own
    Technology model supporting Splunk, Microsoft Sentinel, Google SecOps, and Securonix.
    Deepwatch acquired Dassana in February 2025 to add Continuous Threat Exposure Management.
    As of the run date the company is operating under its third CEO in under two years (Brian
    Dhatt, appointed May 4, 2026) and completed a ~30% workforce reduction in November 2025.
