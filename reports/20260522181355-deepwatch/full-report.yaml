            ~$4.8B
          layer: 1
          claimRef: CM008
        - label: SAM — Commercial non-federal MDR (North America + W. Europe)
          value: ~$2.0–2.5B (est.)
          note: >-
            North America ~36–46% of TAM = $1.4–2.9B; removing federal-grade tier (estimated 10–15% of NA market per
            Quzara structuring) yields rough SAM for commercial platform-agnostic players. Estimate is analyst-derived
            inference, not a published figure.
