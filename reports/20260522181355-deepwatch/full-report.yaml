      - number: '7.3'
        title: Operational and Platform Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Deepwatch's Trust page explicitly states that its cloud infrastructure is hosted exclusively on Amazon Web
              Services (AWS). While AWS offers industry-leading uptime SLAs and multiple availability zones,
              single-cloud dependency means that an AWS outage, configuration error, or security incident could suspend
              24/7 MDR coverage simultaneously for all customers—the worst-case scenario for an MDR provider whose core
              promise is continuous detection and response. Deepwatch holds AWS Level 1 MSSP Competency and leverages
              AWS-native tooling, which deepens the integration but also deepens the lock-in. No multi-cloud failover or
              cloud-agnostic architecture has been documented publicly.

              CrowdStrike dependency is equally significant. In September 2024, Deepwatch launched five MDR modules
              co-developed with CrowdStrike Falcon, making Falcon the underlying EDR telemetry layer for a substantial
              subset of its managed detection offering. The July 2024 CrowdStrike Falcon sensor outage demonstrates that
              hyperscale EDR vendors are not immune to catastrophic failure; Deepwatch's MDR fidelity for Falcon-based
              customers would be directly impaired in an analogous event. Splunk remains the dominant SIEM in
              Deepwatch's customer install base; while Deepwatch now supports Sentinel, Google SecOps, and Securonix,
              the majority of case studies reference Splunk environments. The February 2025 acquisition of Dassana
              introduced CTEM capability but also integration risk: the Dassana team and codebase must be absorbed into
              the NEXA AI ecosystem while simultaneously shipping commercial CTEM offerings. No production CTEM customer
              case study has been publicly identified post-acquisition.
