            title: Market sizing disagreement is structural, not statistical
            body: >-
              The $3.92B–$6.28B spread in 2026 MDR market size estimates reflects competing definitions of market
              scope—not measurement error. Analysts who include MXDR, SOC-as-a-Service, and managed vulnerability
              management report a significantly larger market. Deepwatch's internal TAM likely mirrors the broader MXDR
              definition given the Dassana CTEM acquisition and NEXA AI ecosystem positioning, but no public source
              quantifies this precisely.
