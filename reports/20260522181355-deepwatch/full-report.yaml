      - number: '5.4'
        title: CTEM Module and Dassana Integration
        blocks:
          - type: paragraph
            body: >
              Deepwatch's Continuous Threat Exposure Management (CTEM) capability derives from its February 2025
              acquisition of Dassana, a provider of security intelligence solutions that brought contextualization ETL
              capabilities, a cybersecurity data mesh, and agentic workflow automation. The Dassana data mesh unifies
              siloed, fragmented security data across an enterprise's security stack into a single normalized view,
              which the CPO Anand Ramanathan described as enabling Deepwatch to "help customers anticipate, measure, and
              reduce exposure before an incident occurs."

              CTEM is sold as an add-on to the core MDR subscription, not as a standalone product. Its bidirectional MDR
              integration means that CTEM feeds risk-centric, business-impact-prioritized data to MDR to sharpen
              detection focus, while MDR returns real-time threat and incident data to CTEM to dynamically update risk
              profiles and exposure scores. The CTEM module also provides compliance evidence trails, automated audit
              reporting, and a "top-3 prioritization" framework to surface the most material risks for executive review.
              The NEXA CTEM Agent operationalizes this data layer, translating technical exposure metrics into
              board-level business impact language. Operational transparency is a recurring marketing claim: Deepwatch
              states customers can see exactly which detections fire, how analysts interact with SIEM data, and which
              analyst is handling a given ticket. No independent third-party benchmark or audit of CTEM effectiveness is
              publicly available; capabilities are corroborated only by company statements and the DBTA and vmblog
              analyst-style coverage of the Dassana acquisition.
            claimRefs:
