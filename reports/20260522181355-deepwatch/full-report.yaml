      - number: '2.3'
        title: Buyer Segmentation and Adoption Paths
        blocks:
          - type: paragraph
            body: |
              The MDR buyer universe breaks into four structurally distinct tiers that differ on
              compliance requirements, budget authority, and vendor selection criteria. Large enterprises
              (revenues above ~$1B, Fortune 500/Global 2000) account for approximately 57.65% of MDR
              spending per Mordor's 2025 figures. Their adoption trigger is typically a board-level
              cyber risk mandate or an insurance requirement, their budget owner is the CISO with board
              oversight, and they evaluate vendors on detection engineering depth, integration flexibility,
              and governance transparency. The mid-market (revenues $50M–$1B) is the fastest-growing
              buyer class by unit count; organizations at this tier are too large to ignore sophisticated
              attacks but typically lack the resources to staff a 24/7 in-house SOC. eSentire estimates
              mid-market organizations would need $1.2M–$1.8M per year in labor alone to build a minimal
              internal SOC, making outsourced MDR economically compelling.

              Small and medium enterprises (SMEs) are projected to expand at a CAGR of 27.02% through
              2031 (Mordor), the highest growth rate among size segments. SMEs are particularly attracted
              to cloud-native, subscription-based MDR with predictable monthly costs and low integration
              overhead. The public sector is a distinct fourth tier: federal and DoD buyers require
              FedRAMP Marketplace authorization, U.S.-citizen analyst staffing, and compliance with CMMC,
              FISMA, and NIST SP 800-53, creating a structural barrier that most commercial MDR vendors
              cannot satisfy without dedicated federal infrastructure. Deepwatch's current platform is
              positioned for commercial enterprise and mid-market buyers; it does not publicly hold
              FedRAMP authorization as of the research date.

              Vertical concentration matters for GTM. BFSI, Healthcare, Government and Defense, and IT
              and Telecom are the highest-adoption verticals. Healthcare organizations face simultaneous
              pressure from HIPAA Security Rule enforcement, ransomware targeting (healthcare accounts for
              17% of all ransomware attacks across industries), and chronic staffing shortages. BFSI buyers
              face SEC disclosure rules and PCI DSS 4.0 mandates. Defense contractors face CMMC. The
              adoption path for mid-market MDR buyers typically involves a compliance trigger (CMMC, HIPAA,
              or cyber insurance audit), a peer-referral or analyst shortlist, a proof-of-concept or
              90-day trial, followed by a multi-year subscription contract. The typical buyer journey
              from initial evaluation to contract is three to six months.
