            title: Staffing Risk Following November 2025 Workforce Reduction
            body: >
              Deepwatch laid off approximately 30% of its workforce in November 2025 to redirect resources toward AI
              investment. A 24/7 human SOC is the core operational commitment of the Guardian MDR Platform; any
              reduction in analyst headcount that outpaces NEXA automation increases the risk of SLA degradation in
              high-volume or complex incident scenarios. No updated headcount or analyst-to-customer ratio has been
              disclosed post-reduction.
