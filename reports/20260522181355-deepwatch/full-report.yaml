  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: |
              Deepwatch's revenue mechanism is subscription-based recurring managed security services
              delivered through the Guardian MDR Platform. Enterprise customers pay an annual contract fee
              that covers 24x7x365 SOC coverage, detection engineering, threat hunting, and automated
              investigation through the NEXA Agentic AI Ecosystem. Service is delivered across the
              customer's existing SIEM of choice—Splunk, Microsoft Sentinel, Google SecOps, or Securonix—
              giving Deepwatch a platform-agnostic "Bring Your Own Technology" positioning that avoids
              locking customers into a proprietary data stack and widens the addressable prospect base.

              Platform tiers exist—Core, Advanced, and Enterprise editions—each adding capabilities such as
              enhanced response depth, attack surface management, and expanded partner integrations; however,
              Deepwatch does not publish list pricing on its website or in any public filing. All enterprise
              contracts are negotiated directly through a sales-led motion typical of the upper-mid and large
              enterprise MDR segment. Vendr's procurement benchmarking platform reports that the median
              annual buyer contract for Deepwatch is approximately $315,000, with observed deal sizes ranging
              from roughly $124,000 to $476,000 per year. These figures represent list-to-realized contract
              variability rather than a published price schedule, and actual terms depend on seat count,
              selected services, contract duration, and negotiation leverage.

              Revenue quality signals are available only indirectly. Deepwatch disclosed 100% year-over-year
              sales growth in 2022—the year immediately before the Series C—and stated that more than
              two-thirds of customers expanded their service during that period, which is a strong proxy for
              net revenue retention above 100% at the time. Whether retention and expansion rates have
              sustained or compressed since 2022 is not publicly known. Deepwatch commissioned Forrester
              Consulting to produce a Total Economic Impact study for its MDR platform, a common approach
              for enterprise SaaS/services companies seeking third-party ROI validation for sales cycles, but
              the study does not constitute independent financial disclosure. The subscription/recurring
              nature of MDR services, multi-year contract norms in the enterprise security market, and high
              switching costs from SIEM integration suggest that revenue quality is structurally high, but
              official ARR, churn, or NRR figures remain withheld.
