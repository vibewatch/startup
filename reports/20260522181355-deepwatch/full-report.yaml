  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: People, Leadership, and Workforce Execution Risk
        blocks:
          - type: paragraph
            body: >
              Deepwatch has cycled through three CEOs in fewer than two years, a rate of executive turnover that is
              unusual even by private-equity-backed SaaS standards. Scott Thomas led the company through its Series C
              and initial scaling phase. John DiLullo was named CEO in July 2024, framed as a pivot toward enterprise
              GTM acceleration; his tenure lasted under a year. Brian Dhatt—previously CTO of DigitalOcean and VP
              Engineering at Okta—was appointed CEO on May 4, 2026, with the announcement positioning the transition as
              a shift toward "scaled autonomous SOC" and AI-led delivery. Dhatt's background is engineering-heavy,
              consistent with the NEXA agentic-AI roadmap, but represents a departure from the GTM-oriented profile
              DiLullo brought.

              The most operationally significant risk is the November 2025 workforce reduction of 60–80 employees,
              representing approximately 25–30% of Deepwatch's roughly 250-person workforce. TechCrunch reported the
              layoff targeted analyst and operations roles—the very functions that underpin Deepwatch's differentiated
              "named analyst squad" delivery model. The stated rationale was to redirect capital toward AI investment,
              but an adversely-toned Gartner Peer Insights review from January 2026 alleged internal service disruptions
              following the reduction. No public SLA breach, named customer loss, or analyst attrition disclosure has
              been identified, but the structural exposure is real: Deepwatch sells continuous human-plus-AI security
              operations, and any degradation in the human layer is directly customer-visible. Investors must validate
              post-layoff analyst-to-customer ratios and SLA attainment rates in diligence.
