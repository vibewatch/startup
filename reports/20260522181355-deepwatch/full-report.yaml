  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Enterprise Target Profile
        blocks:
          - type: paragraph
            body: >
              Deepwatch targets mid-to-large enterprises whose security teams lack the headcount to run a 24/7 in-house
              SOC. The company describes its primary buyer as an "enterprise security leader (CISO) responsible for
              managing security operations for a distributed enterprise." Official marketing positions Deepwatch as
              serving Fortune 500 and Global 2000 companies, and MSSP Alert independently corroborates that "hundreds of
              global organizations use Deepwatch's MDR platform." No precise customer count is published; the company's
              About page describes the customer base as "growing at nearly 75% annually," but this figure is undated and
              sourced solely from Deepwatch marketing copy without third-party validation.

              Named case studies and testimonials are most heavily concentrated in financial services (banks, insurance
              SaaS, financial technology, broker-dealers), with healthcare and manufacturing each generating multiple
              named references. Retail, cloud/technology, telco/REIT, and local government each appear in at least one
              named case study. The Deepwatch blog explicitly targets regulated industries—financial services (SOX, PCI
              DSS, GDPR), healthcare (HIPAA), and critical infrastructure—where compliance obligations and lean security
              teams create structural demand for co-managed MDR. Deepwatch clusters customers into two broad buyer
              archetypes: enterprises replacing an existing internal SOC or consolidating a fragmented vendor stack; and
              growing organizations building enterprise-grade MDR without expanding headcount. All customer acquisition
              flows through Deepwatch's 100% channel-only Xcelerate partner program, which has operated since the
              company's 2019 founding and uses a Silver/Gold/Platinum tier framework with guaranteed partner margin at
              renewal.
