      - number: '8.4'
        title: Strategic M&A, IPO, and Exit Readiness
        blocks:
          - type: paragraph
            body: >
              Exit context for Deepwatch is constrained by both operational and market factors. The MDR market's
              structural tailwinds are strong: Mordor Intelligence places the global MDR market at $4.19 billion in 2025
              growing at 21.95% CAGR to $11.30 billion by 2030, consistent with Deepwatch's value proposition.
              Cybersecurity M&A reached historic volume in 2025 (426 deals, $92.5B total disclosed value), with
              strategic buyers dominating 60%+ of deal volume per KPMG. MDR, SOC automation, and AI-driven detection
              platforms are explicitly named as top acquisition targets by Momentum Cyber, Windsor Drake, and Solganick.
              This is a favorable environment for a well-positioned MDR vendor.

              However, Deepwatch's specific exit readiness has barriers. For an IPO, Strategy of Security's 2026
              pipeline analysis identifies cybersecurity IPO candidates as requiring category-leader scale—typically
              $400M+ ARR, high growth, and approaching GAAP profitability. At an estimated $91M–$113M revenue and
              unknown profitability, Deepwatch is not in the IPO range in 2026 or likely 2027. For strategic M&A, the
              company's CrowdStrike module concentration (five of six MDR products depend on CrowdStrike), single-cloud
              AWS architecture, and three-CEO executive churn limit the list of rational strategic acquirers—primarily
              CrowdStrike itself, large MSSPs seeking MDR capability, or PE platform consolidators.

              Vista Credit Partners' posture matters for exit timing. In July 2025, Vista raised a $5.6B continuation
              vehicle to hold Cloud Software Group rather than exit, signaling willingness to extend holding periods
              across its portfolio. Vista Credit's AUM grew to $10B+ (Sep 2025) with 700+ investments since inception
              and $15.4B+ deployed; the Deepwatch credit position is one of many. The PE exit environment as reported by
              Private Equity Wire has remained constrained through 2025, with Vista expanding into debt underwriting to
              generate fees amid the exit slowdown. This context suggests Vista Credit is likely to extend rather than
              force a sale of its Deepwatch debt position in the near term, reducing fire-sale risk but also removing
              IPO pressure. The equity investors (Springcoast, ABS Capital, Goldman, Splunk) have typical 5–8 year hold
              windows, placing primary pressure on return realization in the 2025–2028 frame.
            claimRefs:
