      - number: '2.5'
        title: Deepwatch's Positioning Within MDR, XDR, and SOC-as-a-Service
        blocks:
          - type: paragraph
            body: |
              Deepwatch competes in what Quzara's 2026 MDR market guide segments as "commercial
              platform-agnostic MDR," alongside Arctic Wolf, eSentire, Red Canary, Expel, Pondurance, and
              ReliaQuest. The platform-agnostic model trades the tight integration of a platform-led vendor
              (CrowdStrike Falcon Complete, SentinelOne Vigilance) for stack flexibility—a key differentiator
              for enterprises that are multi-SIEM or that do not want to standardize on a single security
              platform vendor. Deepwatch's February 2026 addition of Securonix support, expanding its BYOT
              strategy to four SIEM platforms, directly extends its addressable pool of prospects who have
              already invested in a major SIEM but lack operational coverage.

              The adjacent market for Extended Detection and Response (XDR)—broader than MDR in that it
              unifies telemetry across endpoints, network, cloud, identity, and OT/IoT—is projected by
              MarketsandMarkets to grow from $7.92 billion in 2025 to $30.86 billion by 2030 at a CAGR
              of 31.2%. Deepwatch's Dassana acquisition in February 2025 and the resulting Continuous
              Threat Exposure Management (CTEM) capability position the platform at the intersection of
              MDR and proactive XDR, aligned with the Gartner prediction that 50% of MDR findings will
              include threat exposure detail by 2028. This CTEM capability is a differentiator within
              the MDR tier, though Deepwatch is not the only platform pursuing MXDR-adjacent positioning.

              A key evidence gap is the absence of public analyst coverage of Deepwatch's specific market
              share or revenue rank within the MDR category. Gartner's October 2025 Market Guide for MDR
              lists representative vendors but does not score them; Deepwatch's presence on that list is
              one indicator of market recognition but does not quantify share. The company's SAM within
              the $4B–$6B MDR market in 2026 depends on the share addressable by BYOT/SIEM-agnostic
              vendors at commercial (non-federal) price points, a sub-segmentation that no public source
              quantifies. Investors should treat the market-size figures in this chapter as macro context
              rather than a reliable denominator for Deepwatch's penetration rate.
