          - type: paragraph
            body: >
              Deepwatch maintains active and substantive ratings across three peer-review platforms. Gartner Peer
              Insights (MDR market category) shows 60 verified reviews with an overall 4.2/5 rating as of mid-2025: 44%
              five-star, 46% four-star, 8% three-star, 2% one-star, and zero two-star reviews. Sub-dimension scores
              cluster between 4.3 and 4.4 across service capabilities, planning and transition, delivery and execution,
              and customer experience. Gartner Peer Insights also lists Deepwatch in its Managed Security Services
              market with a separate 5.0/5 average, though this reflects only one published review as of this writing.
              One adverse Gartner Peer Insights review dated January 2026 from an unnamed organization stated the
              reviewer "doesn't see a lot of value compared to similar companies in the marketplace" and cited "failure
              to deliver on key contractual points"—including a contract submitted for executive approval that allegedly
              differed from the agreed-upon version. This review is a single data point but represents meaningful
              adverse signal for investors evaluating service delivery consistency.

              G2 named the Deepwatch Guardian MDR Platform a High Performer in its Fall 2025 Grid Report for System
              Security; approximately 17–18 verified user reviews underpin this designation. G2 community feedback
              highlights include fast response times, 24/7 continuous monitoring, expert staff depth, and ease of
              implementation. Reported negatives include communication delays in real-time support, limited
              out-of-the-box integrations with partner systems, occasional slowdowns during heavy log searches, and
              onboarding complexity in large organizations. Reliance on ServiceNow as the ticketing interface is cited
              by multiple G2 reviewers as a navigation friction point.

              FeaturedCustomers awarded Deepwatch a Spring 2026 Top Performer designation in Managed Detection and
              Response, based on a 4.8/5 score derived from 1,104 reference ratings across its curated 55-reference
              profile. PeerSpot shows a positive review from a senior software developer at a payment-gateway company
              (Simplifyvms) noting a 40–60% reduction in incident response time and significantly improved threat
              detection accuracy with 24/7 post-business-hours monitoring. Forrester Consulting completed an independent
              Total Economic Impact study commissioned by Deepwatch, which frames an ROI case for Deepwatch MDR; the
              full financial findings are gated behind a form and specific numbers are not publicly confirmed in ungated
              sources.
