    title: Final diligence asks table
    notes: >
      Items are ordered by blocking severity. "Blocking" items prevent any investment thesis from being formed.
      "Material" items significantly affect valuation range. "Advisory" items confirm or tighten assumptions but do not
      change the core recommendation direction.
