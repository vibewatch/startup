  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >
      Layered view of the Deepwatch Guardian MDR Platform from customer-owned data sources through the OSDA data layer,
      NEXA AI engine, human SOC, to customer-facing experience.
    data:
      layers:
        - label: Customer Experience & Reporting
          detail: >-
            Customer-facing portal (Security Center) for ticket management and analyst collaboration, plus three
            specialized NEXA AI agents surfacing exposure insights, detection gap analysis, and ticket pattern
            intelligence.
          items:
            - 'Deepwatch Security Center (portal): ticket management, analyst collaboration, reporting'
            - 'NEXA CTEM Agent: real-time exposure insights, board-level business-impact reports'
            - 'NEXA Detection Advisor Agent: MITRE ATT&CK coverage gap analysis, detection optimization'
            - 'NEXA Ticket Analyzer Agent: historical/active ticket pattern analysis'
        - label: NEXA AI Ecosystem (SOC Operations)
          detail: >-
            Four agentic AI components that automate data enrichment, generate natural-language threat narratives,
            assist with response orchestration, and dynamically score alert risk—all with human-in-the-loop approval for
            containment actions.
          items:
            - 'NEXA Investigative Agent: automated data enrichment and investigation orchestration'
            - 'NEXA Narrative Agent: natural-language threat summaries for analysts'
            - 'NEXA Response Agent: AI-assisted containment with human-in-the-loop approval gates'
            - 'NEXA Dynamic Risk Scoring: alert prioritization and noise suppression'
        - label: Human SOC Layer
          detail: >-
            24/7/365 human analyst squads providing alert validation, threat hunting, and SIEM engineering. Named
            analyst assignment gives each customer a consistent point of contact—a differentiator from commodity MDR
            providers.
          items:
            - '24/7/365 SOC analyst squads: alert validation, complex threat investigation'
            - 'SIEM engineering experts: SIEM tuning, detection rule management'
            - 'Threat hunters: proactive threat hunting across customer telemetry'
            - 'Named analyst assignment: customers know which analyst handles their account'
        - label: Detection Platform & OSDA
          detail: >-
            Proprietary detection engine layered on the Open Security Data Architecture (OSDA) for multi-SIEM
            orchestration and federated search, the Dassana-powered CTEM engine for exposure management, and Cribl for
            data normalization and pipeline routing.
          items:
            - 'Detection engine: proprietary detection rules and alert correlation'
            - 'Open Security Data Architecture (OSDA): multi-SIEM orchestration, federated search'
            - 'CTEM engine (Dassana): data mesh, ETL contextualization, exposure management'
            - 'Cribl data pipeline: Stream, Edge, Search, Lake, Cloud for data normalization'
        - label: BYOT SIEM / Data Source Layer
          detail: >-
            Bring-Your-Own-Technology SIEM layer supporting Splunk, Microsoft Sentinel, Google SecOps, and
            Securonix—allowing enterprises to retain their existing SIEM investment. CrowdStrike Falcon is supported as
            an EDR/XDR data source.
          items:
            - 'Splunk: SIEM (founding integration; Splunk Ventures investor)'
            - 'Microsoft Sentinel: SIEM (added April 2024)'
            - 'Google SecOps: SIEM + SOAR + threat intel (added July 2025)'
            - 'Securonix: SIEM (added February 2026)'
            - 'CrowdStrike Falcon: EDR/XDR data source'
        - label: Infrastructure (AWS)
          detail: >-
            Deepwatch operates on AWS with AES-256 KMS encryption at rest, TLS 1.2 in transit, per-customer VPC
            isolation, and holds AWS Level 1 MSSP Competency with Modern Compute Specialization for containerized
            workloads.
          items:
            - 'AWS EBS / EC2 / S3: compute and storage with AES-256 KMS encryption'
            - 'Customer-isolated VPCs: per-customer network segmentation'
            - 'AWS Level 1 MSSP Competency: Modern Compute Specialization for containerized workloads'
            - 'TLS 1.2: data-in-transit encryption'
    approximationNotes: >
      Architecture inferred from official press releases, the Deepwatch trust center, and SecurityInfoWatch coverage of
      OSDA. No public architecture diagram or API documentation was found. Cribl, SIEM, and EDR integrations are
      confirmed by named press releases; relative positioning and internal API mechanisms are not publicly disclosed.
    claimRefs:
      - CE001
      - CE003
      - CE019
      - CE020
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >
      How a customer threat event moves from raw telemetry through the Deepwatch platform to a resolved incident,
      illustrating the human-AI collaboration model.
    data:
      nodes:
        - id: n1
          label: Customer environment generates telemetry
          description: >-
            Logs, alerts, and events flow from endpoint, identity, cloud, and network sources into the customer-owned
            SIEM (Splunk / Sentinel / Google SecOps / Securonix)
        - id: n2
          label: SIEM ingestion and correlation
          description: >-
            Customer SIEM ingests and normalizes telemetry; Deepwatch SIEM engineering maintains detection rules and
            tuning via OSDA layer
        - id: n3
          label: Detection engine fires alert
          description: >-
            Deepwatch proprietary detection rules produce alerts in the SIEM; NEXA Dynamic Risk Scoring suppresses
            low-priority noise and escalates high-fidelity signals
        - id: n4
          label: NEXA Investigative Agent enriches context
          description: >-
            Automated data enrichment pulls in threat intelligence, asset context, user behavior, and prior incident
            history to build a full investigation package
        - id: n5
          label: NEXA Narrative Agent summarizes threat
          description: >-
            Investigation data is converted to a plain-language threat summary; both SOC analysts and customer
            stakeholders can consume it without query-language expertise
        - id: n6
          label: SOC analyst validates and triages
          description: >-
            Deepwatch analyst reviews AI-enriched summary, validates finding, and determines response priority; human
            judgment is preserved for all escalation decisions
        - id: n7
          label: Response Agent proposes containment action
          description: >-
            For automated responses (block, isolate), NEXA Response Agent generates recommended action; host/endpoint
            isolation requires explicit customer approval
        - id: n8
          label: Customer approves or overrides
          description: >-
            Customer stakeholder or CISO approves containment actions via portal; human-in-the-loop maintained for
            high-risk decisions
        - id: n9
          label: Incident closed; data fed back to CTEM
          description: >-
            Resolved incident data feeds back into CTEM module to update exposure scores, risk profiles, and board-level
            reporting; continuous feedback loop closes
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n7
          to: n8
        - from: n8
          to: n9
        - from: n9
          to: n2
          label: Continuous feedback loop
    approximationNotes: >
      Workflow reconstructed from NEXA product documentation, MSSP Alert interview with Deepwatch Senior Director, and
      CTEM product page. Internal system handoffs and API mechanisms are not publicly documented; this flow represents
      the logical sequence described in marketing and editorial sources, not a verified technical sequence diagram.
