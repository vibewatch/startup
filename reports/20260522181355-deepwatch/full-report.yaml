      - number: '5.5'
        title: Trust, Compliance, and Security Architecture
        blocks:
          - type: paragraph
            body: >
              Deepwatch's security posture is anchored by a published trust center (security.deepwatch.com) and a
              multi-certification compliance stack. SOC 2 Type II (Security, Availability, Confidentiality) has been
              maintained annually since inception. ISO/IEC 27001:2022 certification was first achieved in 2024 and
              covers the information security management system. PCI DSS Level 1 Service Provider certification has been
              maintained since inception, even though Deepwatch does not directly handle cardholder data. GDPR and
              TRUSTe Data Governance certifications address data privacy obligations. In May 2026 Deepwatch added
              ISO/IEC 42001:2023—the AI management systems standard—for the NEXA ecosystem, an externally validated AI
              governance credential described as analogous to the role ISO 27001 plays for information security.
              Deepwatch also maintains a CSA STAR Registry Level 1 listing (CAIQ, November 2022).

              Architectural security controls include AWS KMS-managed AES-256 encryption for all data at rest across EBS
              volumes, EC2 instances, and S3 buckets; TLS 1.2 for all data in transit; per-customer isolated VPCs; and a
              zero-trust application for all employee production access providing point-to-point, application-level
              connectivity. Identity and access is managed via an IAM provider with HRIS-triggered automated
              provisioning and quarterly credential audits. Single sign-on and MFA are mandatory for all platform
              accounts. Customer feedback on AWS Marketplace cited MTTR reduction of 40-60% and false positive reduction
              of 30-40%, but also flagged alert fatigue in high-volume environments and limited automated playbooks for
              common threat patterns as areas needing improvement. These are individual customer observations, not
              vendor-published performance metrics, and should be treated as directional signals only.
