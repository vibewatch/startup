chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and headquarters history
        blocks:
          - type: paragraph
            body: |
              Deepwatch describes itself as the leader in AI-driven, human-led security operations and
              positions its current offering as an autonomous SOC platform. The business model is managed
              detection and response: the company operates a 24x7/365 SOC staffed by security analysts and
              backed by its NEXA Agentic AI Ecosystem, acting as an extension of enterprise security teams
              that lack the in-house resources or expertise to run a full security operations center at
              scale. Customers choose their own SIEM—Splunk, Microsoft Sentinel, Google SecOps, or
              Securonix—and Deepwatch operationalizes it through the Guardian MDR Platform, which
              combines detection engineering, threat hunting, and automated alert investigation. The
              Dassana acquisition in February 2025 added continuous threat exposure management and
              AI-powered risk prioritization, extending the platform beyond pure MDR.

              The company's geographic history is relevant because databases still disagree on
              headquarters. Deepwatch originated in the Tampa Bay area as a virtual SOC offering
              inside GuidePoint Security starting in 2016. It formally incorporated and spun out as
              Deepwatch in April 2019 with a $23 million Series A. The company's own contact page and
              press releases from February 2024 onward placed the company in Tampa, but a June 2025 press
              release announced the relocation of corporate headquarters to 250 Cambridge Avenue, Palo
              Alto, California, describing a dual-coast model that kept Tampa operational. The May 2026 CEO
              announcement confirmed the Palo Alto dateline. A Bengaluru, India office was also listed on
              the official contact page as of the research date. Third-party databases (LeadIQ, Tracxn, and
              some geographic aggregators) still list Tampa, St. Petersburg, or Denver addresses; none of
              those reflect the current official headquarters. Diligence should treat Palo Alto as the
              current legal and executive headquarters address, Tampa as the operations hub, and third-party
              location data as stale.
