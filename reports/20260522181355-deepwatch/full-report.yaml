      - number: '7.2'
        title: Regulatory, Legal, and Privacy Exposure
        blocks:
          - type: paragraph
            body: >
              Deepwatch operates in a sector facing escalating regulatory pressure from multiple directions. CMMC Phase
              1 enforcement became effective November 10, 2025, requiring defense contractors and their supply chain to
              demonstrate compliance with NIST SP 800-171 controls. Deepwatch distributes its platform through Carahsoft
              to named government-adjacent customers including Clark County School District, Dallas ISD, Fairfax County,
              and Frisco ISD. However, Deepwatch has not publicly disclosed FedRAMP authorization for any cloud service
              offering. For managed security service providers serving defense contractors, FedRAMP Moderate
              authorization is increasingly expected under CMMC. The absence of any public FedRAMP listing on
              marketplace.fedramp.gov is a material diligence gap for any investor evaluating federal and SLED revenue
              potential.

              On the privacy front, revised CCPA regulations took effect January 1, 2026, including a new requirement
              that businesses honor Global Privacy Control (GPC) signals as valid opt-out of personal information sale
              and sharing. Greenberg Traurig's analysis confirms that covered businesses must update data-flow mapping,
              honor GPC signals automatically, and update privacy notices. Deepwatch's May 1, 2026 privacy policy carves
              out "customer data"—data processed on behalf of customers under service agreements—from individual data
              subject rights (access, deletion, correction). This carve-out is standard in B2B SaaS contracts, but it
              concentrates privacy compliance obligation on Deepwatch's enterprise customers, creating potential
              contract disputes if GDPR or CCPA data subject requests are routed to Deepwatch rather than the data
              controller. The NIS2 Directive (effective October 2024 across EU member states) imposes similar
              obligations on Deepwatch's European customers. SEC cybersecurity disclosure rules (2023) require
              Deepwatch's public-company customers to disclose material cyber incidents, creating pressure on Deepwatch
              to deliver rapid, documented incident response. No enforcement action, regulatory citation, or material
              complaint against Deepwatch has been identified.
