          - type: callout
            title: Federal-grade tier is structurally inaccessible without FedRAMP
            body: >-
              CMMC enforcement is creating one of the fastest-growing demand pools in MDR: the defense supply chain
              requires 24/7 SOC and proactive threat hunting by October 2026. Deepwatch lacks FedRAMP authorization as
              of the research date, structurally excluding it from this segment. Without a FedRAMP roadmap, Deepwatch's
              TAM ceiling is capped below the total MDR market.
