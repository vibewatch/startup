  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Guardian MDR Platform and Open Security Data Architecture
        blocks:
          - type: paragraph
            body: >
              Deepwatch positions the Guardian MDR Platform as a "Precision MDR" service that combines AI-powered threat
              detection with human expert oversight operating 24/7/365. Rather than building a monolithic proprietary
              SIEM, the company's core architectural choice is the Open Security Data Architecture (OSDA), introduced in
              March 2024. OSDA is designed to support multiple SIEMs, data lakes, XDR platforms, and correlation engines
              simultaneously, allowing customers to keep existing security investments while Deepwatch operationalizes
              them. The architecture supports federated search of native data locations, multimodal generative AI
              analytics, and proprietary hyperautomation to orchestrate response actions across disparate data sources.

              The platform's BYOT (Bring Your Own Technology) strategy is its primary differentiation against
              single-SIEM-dependent MDR competitors. As of February 2026 the supported SIEM list encompasses Splunk,
              Microsoft Sentinel, Google SecOps, and Securonix. The Securonix integration, announced February 24, 2026,
              explicitly targets the "SIEM capability gap"—the distance between what an enterprise SIEM can
              theoretically do and what internal teams can realistically deliver. Deepwatch positions the BYOT model as
              enabling an "instant-on SOC" that bypasses the typical 6-12 month SIEM tuning cycle. The Cribl partnership
              (June 2024) extended OSDA by adding Cribl Stream, Edge, Search, Lake, and Cloud to the data pipeline
              options, enabling data normalization, in-place search without migration, and expanded data-lake support.
              All production infrastructure is hosted on AWS within customer-specific isolated VPCs.
