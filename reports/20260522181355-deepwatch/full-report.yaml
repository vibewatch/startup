        - NRR drives recurring revenue quality; below 95% GRR is a thesis-break
        - Request from Deepwatch finance/CS team; benchmark against 2022 disclosed "two-thirds of customers expanded"
      - - Post-layoff analyst headcount and SLA attainment
        - Current analyst headcount, analyst-to-customer ratio, MTTD/MTTR before and after November 2025 reduction
