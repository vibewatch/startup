      - - Audited ARR and revenue schedule (FY2023–FY2025)
        - Audited or management-certified ARR, MRR by cohort, and annual revenue for last three fiscal years
        - IT-Harvest's $91M estimate is unverified; growth rate and trajectory are the primary valuation driver
        - Request from Deepwatch finance team under NDA; reconcile to third-party estimates
      - - Gross and net revenue retention (GRR/NRR, FY2024–FY2025)
