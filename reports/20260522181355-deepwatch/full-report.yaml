        - Equity value cannot be assessed without waterfall; multiple rounds plus potential Vista Credit equity warrants
        - Request from Deepwatch counsel under NDA; validate against PitchBook/Tracxn round data
      - - Dassana CTEM commercial status and ARR
        - Commercial GA date, production customer count, and ARR attribution for Dassana CTEM module
        - Dassana acquisition is the primary 2025 product expansion claim; revenue contribution unconfirmed
        - Request from Deepwatch product and revenue team under NDA
      - - EBITDA and operating cash flow (FY2024–FY2025)
        - EBITDA, adjusted EBITDA, and operating cash flow for last two fiscal years
        - Required to apply EBITDA-based comps and assess debt-service coverage for Vista Credit facility
        - Request audited or reviewed financials under NDA
      - - Post-Brian Dhatt strategic plan and 2026 ARR guidance
        - Internal investor presentation or board materials showing FY2026 ARR target and key assumptions
        - Dhatt's appointment signals AI/engineering pivot; strategic direction directly affects growth trajectory
        - Request from Deepwatch CEO/board under NDA; assess consistency with NEXA roadmap
