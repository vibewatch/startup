callouts:
- type: risk
  title: Workforce Reduction Service-Continuity Risk
  body: >
    The November 2025 layoff of 60–80 employees (~25–30% of total workforce) is the most
    material near-term customer risk. Deepwatch's value proposition rests on a named,
    human-intensive analyst squad model; any degradation in analyst-to-customer ratios or
    response times could trigger enterprise renewal reviews. No public SLA breach or customer
    loss tied to the layoffs has been identified, but the structural risk is real and should
    be validated in diligence.
  claimRefs:
  - CU042
- type: risk
  title: Undisclosed Retention Metrics
  body: >
    Deepwatch does not publish GRR, NRR, churn, or NPS. For a $180M-funded MDR company
    positioning for premium valuation, this is a material evidence gap. Investors should
    treat all qualitative retention language ("partner we trust," "extension of our team")
    as unsubstantiated without quantitative cohort data.
  claimRefs:
  - CU040
- type: strength
  title: Deep Named Customer Evidence Relative to MDR Peers
  body: >
    Deepwatch's 25 named case studies and 55 FeaturedCustomers references—with executive-level
    attribution and specific outcome metrics—represent above-average customer proof depth for
    a private MDR company. The breadth of named CISO and security-director quotes across
    verticals provides meaningful reference quality for enterprise prospects.
  claimRefs:
  - CU022
  - CU023

