- id: channel-and-customer-motion
  title: Channel Motion and Customer Acquisition
  body: >
    Deepwatch has been a channel-only company since its 2019 founding: 100% of revenue flows
    through partners, making it one of the few pure-play MDR providers to rely entirely on an
    indirect model at this scale. The Xcelerate Channel Partner Program uses a Silver/Gold/Platinum
    tier framework where partners advance by meeting a combination of revenue thresholds and
    specialization or training certifications. Financial incentives include market development
    funds (MDF), deal registration protection, sales incentive rebates for new-customer closes,
    and—most distinctively—guaranteed margin for incumbent partners at renewal.

    CRN confirmed that Deepwatch is "the only company that guarantees margin for the partner" in
    the MDR space, with incumbency protection ensuring that the originating partner receives
    higher renewal margin than any new entrant. Justin Domachowski, CEO of long-standing Deepwatch
    partner Defy Security, described incumbency protection as "it's encouraging to see that because
    I think that just builds the trust capacity." Deepwatch Academy provides partner training in
    both security fundamentals and Deepwatch-specific solutions, including a DEEP-cx certification
    path (DEEP – Certified Influencer and DEEP – Certified Advisor). The Xcelerate program supports
    MSSPs, resellers, solution providers, and technology providers delivering MDR, endpoint detection
    and response, vulnerability management, managed firewall, and MXDR products to end customers.

    The channel-only model has two strategic implications for the customer base: first, Deepwatch's
    sales footprint and regional reach are largely a function of partner coverage and competency,
    not Deepwatch's direct field force; second, partner-dependent acquisition means Deepwatch has
    limited direct relationships with end customers at the point of sale, which may affect customer
    stickiness if a partner relationship sours. Deepwatch's incumbency protection is designed to
    mitigate this risk by locking in the originating partner's economic interest through renewal,
    but the structural dependency on partners for customer-facing account management is a
    diligence item for any investor evaluating customer concentration and churn risk.
