figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: >
    Customer segments, adoption surfaces, and expansion loops across the Deepwatch customer lifecycle.
  data:
    nodes:
    - id: js1
      label: Discovery
      description: "Prospect identifies need for co-managed SOC; triggered by cyber insurance requirement, compliance audit, or internal headcount constraint. Deepwatch reaches buyers exclusively through Xcelerate channel partners (Silver / Gold / Platinum tiers). Primary buyer: CISO or VP Security at mid-to-large enterprise in financial services, healthcare, manufacturing, retail, or technology."
    - id: js2
      label: Evaluation
      description: "CISO-led RFP or proof-of-concept; Deepwatch differentiates on SIEM-agnostic BYOT model (Splunk, Sentinel, Google SecOps, Securonix), named squad delivery, and Security Index benchmarking. Gartner Peer Insights (60 reviews, 4.2/5), G2 (High Performer, ~17 reviews), and FeaturedCustomers (4.8/5, 1,104 reference ratings) supplement partner references. Competitive set: CrowdStrike Falcon Complete, Arctic Wolf, Rapid7, Expel."
    - id: js3
      label: Purchase and Contracting
      description: "Annual or multi-year subscription contract negotiated through channel partner. Deepwatch guarantees incumbent partner margin at renewal (unique in MDR space per CRN). Contract terms and SLA details not public; one adverse Gartner review (Jan 2026) alleged a contract version discrepancy."
    - id: js4
      label: Onboarding and Deployment
      description: "Deepwatch claims typical go-live in 6 weeks (Genuine Parts cited as exemplary; 200,000+ endpoints). Named analyst squad assigned; SIEM integration, detection rule tuning, and Security Index baselining completed. G2 feedback notes onboarding can be complex in large or multi-system environments."
    - id: js5
      label: Active Production Deployment
      description: "24/7/365 monitoring; NEXA AI ecosystem triage; Deepwatch Experts handle alert investigation, threat hunting, and incident escalation. Customer interacts via Security Center portal. Security Index benchmarked quarterly. Claimed average: 25%+ annual security maturity improvement (company claim, unaudited)."
    - id: js6
      label: Expansion
      description: "CTEM module (Dassana), Dark Web Monitoring, Managed Endpoint DR, Vulnerability Management, and Managed Firewall available as paid add-ons. Expansion driven by compliance gaps, growing data volumes, or M&A integration (Artera Services example). CTEM attach rate not disclosed."
    - id: js7
      label: Renewal and Advocacy
      description: "Renewal anchored by Security Index improvement and partner incumbency protection. Named customers invited into Guardians Program for peer community and product feedback. GRR, NRR, and churn not publicly disclosed; qualitative evidence describes multi-year relationships across multiple named accounts."
  approximationNotes: >
    Journey stages are reconstructed from case study narratives, channel partner program documentation,
    and official product pages. No internal conversion funnel or churn data is available. Timeline
    from evaluation to expansion is inferred from case study language and not validated by
    quantitative cohort data. Expansion product attach rates are not disclosed.
  claimRefs:
  - CU006
  - CU018
  - CU034
  - CU038
  - CU039

