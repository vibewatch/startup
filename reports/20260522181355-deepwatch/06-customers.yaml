chapter:
  number: 6
  title: Customers
  summary: >
    Deepwatch's publicly documented customer base spans Fortune 500 and Global 2000 enterprises
    across financial services, healthcare, manufacturing, retail, technology, and telco/REIT sectors,
    with financial services the most heavily represented vertical in named case studies. CaseStudies.com
    lists 25 named case studies including Genuine Parts Company, City National Bank of Florida, SBA
    Communications, Informatica, and R.J. O'Brien. Gartner Peer Insights shows 60 verified reviews
    averaging 4.2/5; FeaturedCustomers awards a Spring 2026 Top Performer designation with a 4.8/5
    score from 1,104 reference ratings. Customer-claimed outcomes are striking—up to 80% reduction
    in cyber insurance premiums, 70% risk reduction, and 98% false-positive reduction—but these
    figures originate exclusively from company-published case studies or customer self-reports and
    have not been independently audited. Deepwatch does not publicly disclose total customer count,
    gross or net revenue retention, NPS, or quantitative cohort data. The November 2025 layoff of
    60–80 staff (~25–30% of the ~250-person workforce) is a credible adverse signal for service
    continuity at scale. All customer acquisition flows through the 100% channel-only Xcelerate
    partner program, creating a meaningful partner-concentration dependency that has not been
    publicly stress-tested.

sections:
- id: customer-segmentation
  title: Customer Segmentation and Enterprise Target Profile
  body: >
    Deepwatch targets mid-to-large enterprises whose security teams lack the headcount to run
    a 24/7 in-house SOC. The company describes its primary buyer as an "enterprise security
    leader (CISO) responsible for managing security operations for a distributed enterprise."
    Official marketing positions Deepwatch as serving Fortune 500 and Global 2000 companies,
    and MSSP Alert independently corroborates that "hundreds of global organizations use
    Deepwatch's MDR platform." No precise customer count is published; the company's About
    page describes the customer base as "growing at nearly 75% annually," but this figure
    is undated and sourced solely from Deepwatch marketing copy without third-party validation.

    Named case studies and testimonials are most heavily concentrated in financial services
    (banks, insurance SaaS, financial technology, broker-dealers), with healthcare and
    manufacturing each generating multiple named references. Retail, cloud/technology, telco/REIT,
    and local government each appear in at least one named case study. The Deepwatch blog
    explicitly targets regulated industries—financial services (SOX, PCI DSS, GDPR), healthcare
    (HIPAA), and critical infrastructure—where compliance obligations and lean security teams
    create structural demand for co-managed MDR. Deepwatch clusters customers into two
    broad buyer archetypes: enterprises replacing an existing internal SOC or consolidating
    a fragmented vendor stack; and growing organizations building enterprise-grade MDR without
    expanding headcount. All customer acquisition flows through Deepwatch's 100% channel-only
    Xcelerate partner program, which has operated since the company's 2019 founding and uses
    a Silver/Gold/Platinum tier framework with guaranteed partner margin at renewal.
