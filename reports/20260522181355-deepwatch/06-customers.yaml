- id: FU003
  title: Customer evidence quality matrix by proof dimension
  type: matrix
  layout: wide
  summary: >-
    Compares the independence, freshness, and limitations of Deepwatch's main customer-proof channels across marketing claims, named case studies, and third-party review platforms.
  data:
    columns:
    - Named evidence
    - Independent corroboration
    - Quantified signal
    - Freshness
    - Primary diligence caveat
    rows:
    - label: Customer count and growth disclosure
      values:
      - Partial – official About page claims Fortune 500 / Global 2000 reach and nearly 75% annual customer-base growth
      - Partial – MSSP Alert independently says hundreds of global organizations use the platform
      - Weak – no exact customer count, segment denominator, or growth methodology is published
      - Current – official and news references were live at the 2026 run date
      - Need exact active customer count, segment mix, and timeframe behind the growth claim
    - label: Named case study depth
      values:
      - Strong – 25 named case studies plus an official customer page with attributed testimonials
      - Medium – CaseStudies.com and FeaturedCustomers corroborate roster depth but mostly republish vendor-provided material
      - Medium – multiple case studies contain numerical outcomes and deployment details
      - Current – most visible customer proof dates from 2025–2026
      - Quantified outcomes are vendor-curated and unaudited
    - label: Attributed executive references
      values:
      - Strong – named CISO and security-leader quotes appear across multiple customers
      - Medium – third-party aggregators reproduce the same references but add limited new verification
      - Medium – quotes are attributable, though most do not include audited operating metrics
      - Current – attributed references remain present on current customer pages and listings
      - Need live reference calls to validate deployment depth, renewal posture, and outcome reproducibility
    - label: Gartner Peer Insights review signal
      values:
      - N/A – not company-authored marketing evidence
      - Strong – high-reputation platform with reviewer-role verification
      - Strong – 60 reviews, 4.2/5 overall, plus visible distribution and sub-scores
      - Recent – chapter evidence is anchored to mid-2025 / 2026 Gartner pages
      - Gartner verifies reviewer identity more than production scope or current contract status
    - label: G2 and FeaturedCustomers signal
      values:
      - Mixed – G2 recognition is promoted by Deepwatch; FeaturedCustomers also accepts vendor-submitted references
      - Medium – both are external platforms, but with lighter verification than Gartner
      - Medium – High Performer badge on ~17–18 G2 reviews and 4.8/5 from 1,104 FeaturedCustomers ratings
      - Current – badges and counts are from 2025/2026 snapshots
      - Low G2 review counts and FeaturedCustomers' vendor-curated methodology limit statistical confidence
    - label: Adverse customer signal
      values:
      - Absent on official channels – negative feedback is not surfaced by the company
      - Medium – Gartner likes/dislikes and G2 negatives expose concrete service-delivery complaints
      - Partial – isolated critical review plus recurring themes around onboarding, integrations, and support communication
      - Current – Jan 2026 Gartner review and 2025/2026 platform feedback
      - Need churn, loss, or escalation data to determine whether adverse feedback translated into attrition
  approximationNotes: >-
    This matrix scores the chapter's customer-proof channels rather than individual customers. It distinguishes vendor-curated evidence from higher-independence review signals and highlights where public proof still lacks denominators, audited outcomes, or churn evidence.
