- id: named-customer-evidence
  title: Named Customer Evidence and Deployment Outcomes
  body: >
    Deepwatch's customer evidence layer is unusually deep for a private MDR company: CaseStudies.com
    aggregates 25 named case studies with attributed CISO or security-director quotes, and
    FeaturedCustomers lists 55 total references including 27 testimonials, 25 case studies, and
    3 customer videos. All case-study outcomes are self-reported via company-published materials;
    no independent third-party audit of claimed metrics has been identified.

    The highest-visibility deployments include Genuine Parts Company (global automotive/industrial
    parts distributor, 200,000+ endpoints), which completed onboarding in six weeks—with Global
    Security Program Director Damian Apone quoted as saying "I've never seen anything executed
    to such perfection in my life." City National Bank of Florida (CISO Brian Fricke) achieved
    nearly 80% reduction in cyber insurance premiums and reduced audit preparation from days to
    minutes. SBA Communications (telco/REIT infrastructure) reached a Deepwatch Security Index
    of 9.64—above industry average—with zero declared incidents over a two-year deployment.
    Informatica scaled vulnerability management across 100+ engineering teams, saving $77,000
    annually in retired internal pipelines, with real-time board-ready dashboards replacing
    manual reporting. Ezer Group (financial services) reduced alerts from 17,000 to 8 in 90 days.
    A large unnamed U.S. metals and plastics distributor claims 70% cyber risk reduction along
    with millions in staffing cost savings, lower insurance premiums, and NIST CSF alignment.

    Healthcare and public-sector customers also appear with production-level references: Premise
    Health (healthcare services), a nationally recognized rehabilitation provider, and a local
    government security provider each have attributed case studies on CaseStudies.com. Financial
    services customers with named executive references include R.J. O'Brien (CISO John Woods),
    PJTC Holdings (ISO Matt Lawson), and a leading bank reporting 82% improvement in alert
    fidelity. Other named testimonials on the Deepwatch About page include QuidelOrtho (healthcare
    diagnostics), NW Natural Gas, Stifel (financial services), and Brightline (healthcare)—all
    attributable to named executives. Evidence quality is uniformly company-curated; none of the
    case study PDFs are available without gating, making independent reproduction of specific
    metric claims infeasible without customer reference calls.
