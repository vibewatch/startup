    severity: material
    topic: No public record of named churn, cancellation, or deployment failure events
    missingEvidence: Named churn cases, renewal losses, terminated contracts, or litigation/complaint records tied to delivery failure.
    whyItMatters: Without negative outcome data, downside customer durability and competitive loss risk cannot be calibrated.
