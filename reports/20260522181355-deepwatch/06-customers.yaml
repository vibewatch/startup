    status: answered
    finding: >
      No public evidence of a specific SLA breach, analyst-to-customer ratio change, or
      customer complaint citing staffing degradation post-November 2025 was found. The structural
      risk is real: a ~30% headcount reduction in a human-intensive SOC service is unusual and
      warrants quantitative validation in diligence.
    sourceRefs: [SU018, SU019]
    contentRequirementIndex: 3

    targets:
    - contentRequirements/3
  - id: QU027
    type: adverse
    question: "Does Deepwatch's channel-only model create concentration or service-continuity risk from partner dependency?"
    status: answered
    finding: >
      The channel-only model creates structural dependency on Xcelerate partners for all
      customer relationships. Incumbency protection limits direct competition at renewal,
      but the end-customer relationship is partner-owned. Loss or underperformance of
      Platinum-tier partners could suppress deal flow without a direct-sales backstop.
      No information on partner concentration (top-5 partners' share of revenue) is public.
    sourceRefs: [SU008, SU025, SU024]
    contentRequirementIndex: 4

    targets:
    - contentRequirements/4
  evidenceGaps:
  - id: EGU001
    type: missing-source
    severity: blocking
    topic: Quantitative customer retention metrics (GRR, NRR, churn, NPS) not publicly disclosed
    missingEvidence: Audited GRR, NRR, churn, NPS, and cohort-level retention data by fiscal year.
    whyItMatters: Without quantitative retention data, customer durability and renewal quality cannot be independently assessed.
    diligencePath: Request audited GRR, NRR, and dollar-weighted churn by fiscal year under NDA.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - id: EGU002
    type: missing-source
    severity: material
    topic: Exact total customer count not disclosed
    missingEvidence: Exact active customer count plus a segment, geography, and channel mix breakdown.
    whyItMatters: Without a denominator, the published growth claim and case-study representation cannot be validated.
    diligencePath: Request ARR and customer count by cohort vintage under NDA.
    relatedTableRefs:
    - TU002
  - id: EGU003
    type: private-evidence-only
    severity: material
    topic: Forrester TEI study financial findings are gated; no ungated ROI numbers confirmed
    missingEvidence: The full Forrester TEI study, including ROI multiplier, payback period, and composite customer profile.
    whyItMatters: The TEI study is the main third-party ROI signal, but no public financial outputs are available to verify the benefit case.
    diligencePath: Request the full Forrester TEI study and composite customer profile.
    relatedQuestionRefs:
    - QU011
    relatedTableRefs:
    - TU002
  - id: EGU004
    type: missing-source
    severity: material
    topic: No customer retention cohort data available to construct a retention cohort figure
    missingEvidence: Time-bucketed cohort retention percentages or renewal curves by customer vintage.
    whyItMatters: Without cohort data, the chapter cannot quantify durability or render the planned retention cohort figure.
    diligencePath: Obtain cohort retention data under NDA and build the cohort figure during diligence.
    relatedTableRefs:
    - TU004
  - id: EGU005
    type: missing-source
    severity: material
    topic: Analyst-to-customer ratio and SLA performance data not disclosed post-November 2025 layoffs
    missingEvidence: Current analyst headcount, analyst-to-customer coverage ratios, SLA attainment, and breach rates before and after the layoffs.
    whyItMatters: The service-continuity effect of the workforce reduction cannot be quantified without staffing and SLA data.
    diligencePath: Request current analyst headcount, analyst-to-customer ratios, and SLA breach rates before and after the November 2025 reduction.
    relatedTableRefs:
    - TU005
  - id: EGU006
    type: missing-source
    severity: minor
    topic: Channel partner revenue concentration (top-5 partners' share of ARR) not disclosed
    missingEvidence: Top-partner revenue share, renewal mix, and channel concentration metrics.
    whyItMatters: The 100% channel model cannot be stress-tested without understanding partner concentration.
    diligencePath: Request top-5 partner revenue concentration and annual churn rate among Platinum-tier partners.
    relatedTableRefs:
    - TU005
  - id: EGU007
    type: missing-source
    severity: material
    topic: Named customer proof table is a sample of vendor-curated evidence, not an exhaustive independently verified roster
    missingEvidence: An exhaustive independent list of production deployments plus direct customer reference calls.
    whyItMatters: TU003 is intentionally a sample of the public customer-proof universe and cannot be treated as exhaustive without independent reconciliation.
    diligencePath: Request the full reference roster and at least two live customer calls; reconcile the official customer page against CaseStudies.com and FeaturedCustomers.
    relatedTableRefs:
