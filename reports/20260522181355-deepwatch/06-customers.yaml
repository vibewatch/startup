  - id: EGU008
    type: missing-source
    severity: material
    topic: Security Index methodology behind the 25%+ annual maturity-improvement claim is not disclosed
    missingEvidence: Security Index methodology, sample size, score distribution, and any third-party audit of the 25%+ annual improvement claim.
    whyItMatters: Without methodology disclosure, the maturity-improvement claim cannot be relied on as evidence of customer satisfaction or retention.
    diligencePath: Request the Security Index methodology and audited score distribution across the customer base.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
