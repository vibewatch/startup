  - id: s5
    title: Milestones, adverse events, and chapter ground truth
    body: |
      The chronology that later chapters should reuse begins in 2016 with the GuidePoint vSOC
      and runs through the May 2026 leadership transition and ISO 42001 certification. The
      strongest verifiable anchors are: formal independence in April 2019 (Series A), $53 million
      Series B in 2020, $180 million Series C in February 2023, Dassana acquisition in February
      2025, HQ relocation to Palo Alto in June 2025, and the Dhatt/Ramanathan leadership
      announcement on May 4, 2026.

      Two adverse events are material. First, the November 2025 layoffs eliminated roughly one
      in three employees. The official framing was AI-investment acceleration; an anonymous
      current employee quoted in TechCrunch called the AI rationale skeptical, describing it as
      sounding "like bullshit." The cuts primarily affected security analysts and operations
      staff, which creates an operational risk question for an MDR business where SOC analyst
      depth is a quality-of-service signal. Second, the rapid CEO succession—Thomas to DiLullo
      in July 2024, then DiLullo to Dhatt in May 2026—raises questions about strategic
      continuity and board alignment that are not answerable from public sources alone.

      What later chapters can treat as ground truth: (1) Deepwatch is a private MDR company
      with its current executive headquarters in Palo Alto, CA; (2) its total disclosed funding
      is $256 million; (3) the CEO as of the run date is Brian Dhatt; (4) the platform is the
      Guardian MDR Platform with NEXA Agentic AI and BYOT SIEM support; (5) an acquisition
      (Dassana) and a certification (ISO 42001) expanded the platform and compliance posture in
      the 12 months before the run date.
