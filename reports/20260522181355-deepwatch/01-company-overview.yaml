  - id: s3
    title: Capital formation, investors, and governance signals
    body: |
      Deepwatch has raised a disclosed total of $256 million across three public rounds. The
      Series A ($23 million, April 2019) was led by ABS Capital Partners, making ABS the
      longest-tenured institutional backer. The Series B ($53 million, 2020) was led by Goldman
      Sachs with ABS Capital participating. The February 2023 Series C of $180 million was the
      largest round; it combined equity from Springcoast Capital Partners, Splunk Ventures, and
      earlier investors with credit financing from Vista Credit Partners, a subsidiary of Vista
      Equity Partners. Holger Staude of Springcoast joined the board as part of the Series C.

      The LeadIQ company profile describes total growth capital as "over $275 million" and lists
      Goldman Sachs, Vista Equity Partners, Springcoast, Splunk Ventures, and ABS Capital as
      backers. The gap between $256 million and $275+ million likely reflects the Vista Credit
      structured financing, which may not be recorded as pure equity in all databases.
      Diligence should clarify whether Vista Credit holds equity warrants, and what covenants
      or governance rights the credit tranche carries.

      No funding round has been publicly announced since February 2023. The company has not
      published a post-money valuation from any round, and third-party estimates range widely
      ($1.3 billion to $1.7 billion per one secondary-market aggregator) without a primary
      source. The task-level hint of a $2.6 billion valuation is not supported by any press
      release, analyst report, or credible database entry found during this research. Later
      chapters should not treat $2.6 billion as a verified valuation anchor.

      The most recent CEO announcement (May 4, 2026) listed backers as "Springcoast Partners,
      Goldman Sachs, ABS Capital and Splunk Ventures," notably omitting Vista Credit. Whether
      Vista has been repaid or has converted to equity should be confirmed directly.
