  - id: s4
    title: Cover metrics, scale signals, and disclosure limits
    body: |
      Deepwatch's public disclosures are thin on the metrics that matter most for financial
      underwriting. No public source provides absolute ARR, revenue, customer count, or a
      confirmed post-money valuation. The most concrete scale signal is from the 2023 Series C
      press release: Deepwatch reported 100% year-over-year sales growth in 2022 with more than
      two-thirds of customers expanding their service. The founding CEO transition announcement
      noted that the customer base had grown ten-fold under Thomas, but this is a relative
      statement with no disclosed base or end count. Fortune 100 and Global 2000 customer
      mentions appear throughout press materials alongside named testimonials from Ezer Group,
      Genuine Parts Company, and Stifel.

      Headcount data is approximate. The November 2025 layoffs were described as affecting
      60 to 80 employees out of approximately 250, implying a post-layoff range of 170 to 190.
      LeadIQ lists a 201–500 employee range, which appears to be a pre-layoff data point.
      No official current headcount has been published. The IT-Harvest revenue estimate of
      approximately $91 million TTM circulated in secondary sources but was not confirmed by
      Deepwatch; this chapter treats it as low-confidence and cannot recommend its use without
      direct verification.

      On compliance, the trust FAQ page confirms SOC 2 Type 2 certification and TRUSTe
      certification. The company achieved ISO/IEC 42001:2023 certification for its NEXA
      Agentic AI Ecosystem on May 21, 2026, positioning itself among a small group of
      cybersecurity companies with externally validated AI governance. Deepwatch also earned
      Great Place to Work certification four consecutive years through 2024, and Forbes
      Top Startup recognition in 2022 through 2025.
