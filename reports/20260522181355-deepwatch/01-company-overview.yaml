  - id: s2
    title: Founders, leadership, and key-person dependence
    body: |
      Deepwatch's leadership trajectory has been unusually turbulent for a private growth company
      of its vintage. Charlie Thomas is identified as the founding CEO in multiple sources. Under
      Thomas, the company scaled its customer base ten-fold according to the July 2024 CEO
      transition announcement. Thomas became chairman of the board when John DiLullo was
      appointed CEO on July 2, 2024. DiLullo, a 30-year cybersecurity veteran who had previously
      led LiveVox and Lastline (acquired by VMware in 2020), was tasked with scaling the
      platform and driving the next phase of growth. He oversaw the Dassana acquisition, the
      HQ relocation to Palo Alto, and the November 2025 workforce reduction before being
      succeeded by Brian Dhatt on May 4, 2026. DiLullo remained as an advisor.

      Brian Dhatt, the current CEO, brings enterprise technology platform scaling experience
      rather than a pure cybersecurity background. He previously served as CTO at BigCommerce
      and Borderfree, both of which completed IPOs during his tenure. Anand Ramanathan, who was
      promoted from Chief Product and Technology Officer to President on the same date, has 20+
      years of security product leadership at McAfee, Proofpoint, Cisco, and Skyhigh Security and
      provides domain continuity across the transition. Bill Phelps is publicly identified as
      Chairman of the Board as of May 2026. Chad Cragle is the CISO, visible in the May 2026
      ISO 42001 announcement. Holger Staude of Springcoast Capital joined the board as part of
      the 2023 Series C.

      The key-person risk picture is mixed. Three CEOs in under two years is a meaningful
      governance signal that warrants diligence: investors should ask whether the transition from
      DiLullo to Dhatt was planned or reactive, and what DiLullo's short tenure implies about
      strategic alignment between the board and executive team. The promotion of Ramanathan to
      President provides some continuity on the product and customer side. Dhatt's non-security
      background is a risk amplifier if the company needs to navigate complex enterprise security
      evaluations without a security-native CEO.
