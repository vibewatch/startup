  - id: s4
    title: MSSP/Hybrid and Channel MDR Competitors — Rapid7 MDR and Sophos MDR
    body: |
      Rapid7 MDR is platform-led within the Rapid7 Insight ecosystem, offering 24/7 human-led
      monitoring augmented by its Agentic AI model, unlimited digital forensics and incident
      response (DFIR), and built-in vulnerability and risk management for a holistic security
      posture view. Rapid7 cites alignment with Gartner's projection that 50% of MDR deliverables
      will include threat exposure findings by 2028. Rapid7 MDR's material limitation is
      integration breadth: eSentire's head-to-head comparison identifies 29 supported integrations
      for Rapid7 versus 300+ for eSentire, reflecting Rapid7's preference for its own Insight
      agent and platform. Rapid7 MDR operates with approximately 100 SOC personnel. Buyers outside
      the Rapid7 ecosystem—particularly those running best-of-breed SIEM or EDR stacks—face
      meaningful platform migration costs to adopt Rapid7 MDR.

      Sophos MDR is the largest MDR service by customer count among named competitors, reaching
      26,000 customers globally as of January 2026—a 37% increase from 2024. Sophos MDR has
      generated multiple analyst accolades: named IDC MarketScape Leader for MDR in 2024, Frost
      & Sullivan Frost Radar leader, Gartner Peer Insights Customers' Choice for MDR for the
      second consecutive year, and SC Awards winner for Best Managed Detection and Response Service.
      The service scored 4.9/5 (344 reviews) on Gartner Peer Insights as of Q3 2024. Sophos's
      primary MDR differentiator is unlimited incident response hours with no incremental charge,
      including full root cause analysis, removal of malicious artifacts, and adversary ejection.
      The Sophos MDR Complete tier includes a breach protection warranty covering up to $1M in IR
      expenses. Sophos has invested in third-party integrations (including Microsoft O365, Acronis,
      Rubrik, and Veeam) and reports over 9,000 customers using its Microsoft O365 MDR integration.
      Sophos's parent funding is Thoma Bravo, which acquired Sophos for $3.9 billion in 2019;
      FY2025 company-wide revenue is estimated at approximately $1B.

      Sophos MDR's structural dynamic differs from pure-play peers: Sophos's MDR service is
      supported by threat intelligence from 600,000+ organizations in its telemetry base (Sophos
      X-Ops), which creates a network-effect intelligence advantage unavailable to smaller peers.
      However, organizations with existing non-Sophos endpoint stacks face integration overhead,
      and Sophos MDR's core commercial architecture is primarily Sophos-endpoint-centric despite
      third-party integration capabilities.
