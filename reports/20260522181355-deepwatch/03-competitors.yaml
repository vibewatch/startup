  - id: s2
    title: Platform-Led Competitors — CrowdStrike Falcon Complete and SentinelOne Vigilance
    body: |
      CrowdStrike Falcon Complete is the market's highest-profile platform-led MDR, delivering
      agentic MDR that unites deterministic automation, AI agents, and 24/7 human oversight
      through the CrowdStrike Falcon platform. CrowdStrike reports a 1-minute median time-to-
      contain (MTTC) and remediation of 2.7 million detections monthly, supported by its elite
      OverWatch threat hunting team. Coverage extends across endpoints, identities, cloud
      workloads, network perimeter, email, SSO, and third-party telemetry via CrowdStrike
      Falcon Next-Gen SIEM. CrowdStrike includes a breach warranty for qualified customers.
      Pricing for Falcon Complete MDR runs approximately $25–$45 per endpoint per month on top
      of the Falcon EDR license, with enterprise minimums typically requiring 250+ endpoints.

      Falcon Complete's core limitation is its hard requirement for the CrowdStrike Falcon EDR
      agent, creating tight platform lock-in. Organizations running Microsoft Defender, SentinelOne,
      or a multi-vendor EDR strategy cannot use Falcon Complete without replacing their endpoint
      stack or running two parallel EDR solutions, creating license duplication and integration
      complexity. Falconer Security's 2026 MDR buyers' guide explicitly labels CrowdStrike as
      "proprietary-stack MDR" with the consequence that organizations standardized on Microsoft
      security would pay twice for endpoint protection.

      SentinelOne rebranded its MDR service from Vigilance Respond to Wayfinder MDR in 2025–2026.
      Wayfinder provides 24/7/365 detection, investigation, and response operating natively through
      the Singularity Platform, integrating Google Threat Intelligence—described by SentinelOne as
      "the most comprehensive, timely, and operational threat intelligence available." The service
      tiers include Wayfinder MDR (continuous monitoring), MDR Elite (dedicated threat advisor and
      turn-key onboarding), and IRR (incident response retainer). Like Falcon Complete, Wayfinder
      is tightly coupled to the SentinelOne Singularity platform, limiting its appeal to
      organizations without existing SentinelOne deployments. Pricing for SentinelOne MDR overlays
      runs in the $7–$25/endpoint/month range as an add-on to the base Singularity license.
