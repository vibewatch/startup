  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Deepwatch win rate against named competitors
      missingEvidence: >-
        No public source discloses Deepwatch's competitive win rate against CrowdStrike Falcon
        Complete, Arctic Wolf, eSentire, or any other named MDR vendor. Win/loss data is a
        critical input for assessing Deepwatch's differentiation claims and is unavailable from
        public sources.
      diligencePath: >-
        Request Deepwatch's CRM-based win/loss analysis by named competitor for the trailing
        4 quarters; ask for both ARR won and customer count won; compare pipeline-sourced vs.
        channel-sourced wins.
      relatedQuestionRefs:
        - QP022
        - QP023

    - type: private-evidence-only
      severity: material
      topic: Deepwatch ARR, customer count, and pricing schedule
      missingEvidence: >-
        Deepwatch's ARR, customer count, average contract value, and pricing schedule are not
        publicly disclosed. These are essential for comparing scale, GTM efficiency, and unit
        economics against peers (Arctic Wolf $541M ARR / 5,500+ customers; Sophos 26,000
        customers; Red Canary $100M ARR / ~1,000 customers; eSentire ~$170M revenue).
      diligencePath: >-
        Obtain Deepwatch's audited or management-reported ARR, customer count, average ACV,
        and revenue mix (direct vs. channel) in due diligence; request pricing schedule or
        benchmark contracts with representative enterprise and mid-market customers.
      relatedQuestionRefs:
        - QP022
        - QP024

    - type: private-evidence-only
      severity: material
      topic: MDR vendor public pricing schedules
      missingEvidence: >-
        No MDR vendor in the named peer set publishes binding list prices. Third-party pricing
        intelligence (MDRCost.com, Vendr, Falconer Security) provides indicative ranges, but
        actual contracted prices depend on scope, SLA, negotiation leverage, and partner channel
        margin. Comparative pricing analysis is necessarily approximate.
      diligencePath: >-
        Benchmark Deepwatch pricing against Vendr/MDRCost buyer-reported data; request sample
        contracts and pricing matrix from Deepwatch under NDA; run a reference check on ACV
        with 3–5 named customers in comparable segments.
      relatedTableRefs:
        - TP003
      relatedQuestionRefs:
        - QP008
        - QP012

    - type: missing-source
      severity: minor
      topic: eSentire revenue confirmation
      missingEvidence: >-
        eSentire's revenue estimate of $165–$170M is derived from employee count (~600) times
        estimated revenue per employee (~$259K) per Growjo and Tracxn third-party estimates,
        not from company-disclosed financials. eSentire is private and does not publicly report
        revenue. The estimate carries low confidence for any valuation-level analysis.
      diligencePath: >-
        Request eSentire financial summary from Warburg Pincus portfolio disclosures; compare
        with company-reported figures if available in vendor due diligence context.
      relatedQuestionRefs:
        - QP009
        - QP013

    - type: missing-source
      severity: minor
      topic: Deepwatch CTEM customer adoption and integration completeness
      missingEvidence: >-
        The Dassana CTEM acquisition (February 2025) is confirmed but no public source discloses
        the degree of CTEM integration within Deepwatch's standard MDR contract, customer
        adoption rate, or a head-to-head comparison with Rapid7's integrated vulnerability
        management offering.
      diligencePath: >-
        Request Deepwatch product roadmap and CTEM customer adoption metrics; ask Dassana
        integration status and pipeline contribution; compare Deepwatch CTEM vs. Rapid7 MDR
        vulnerability integration in a product-level demo.
      relatedQuestionRefs:
        - QP025

