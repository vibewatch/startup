company:
  name: Deepwatch
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Deepwatch's product centers on the Guardian MDR Platform, a SIEM-agnostic managed detection and
    response service combining 24/7 human SOC analysts with the NEXA Agentic AI Ecosystem—six collaborative
    agents covering both SOC operations and customer experience. The Open Security Data Architecture
    underpins a Bring Your Own Technology (BYOT) model currently supporting Splunk, Microsoft Sentinel,
    Google SecOps, and Securonix, with Cribl as the data-pipeline partner. The Dassana acquisition added
    a Continuous Threat Exposure Management (CTEM) module with bidirectional MDR integration. Platform
    infrastructure runs on AWS with AES-256 encryption, VPC isolation, and a zero-trust employee access
    model; certifications include SOC 2 Type II, ISO 27001:2022, PCI DSS, and ISO 42001:2023 for the
    NEXA AI system. Key evidence gaps remain: no public API documentation, limited third-party technical
    benchmarks, and closed-source architecture with proprietary detection logic.

sections:
  - id: platform-architecture
    title: Guardian MDR Platform and Open Security Data Architecture
    body: >
      Deepwatch positions the Guardian MDR Platform as a "Precision MDR" service that combines AI-powered
      threat detection with human expert oversight operating 24/7/365. Rather than building a monolithic
      proprietary SIEM, the company's core architectural choice is the Open Security Data Architecture
      (OSDA), introduced in March 2024. OSDA is designed to support multiple SIEMs, data lakes, XDR
      platforms, and correlation engines simultaneously, allowing customers to keep existing security
      investments while Deepwatch operationalizes them. The architecture supports federated search of
      native data locations, multimodal generative AI analytics, and proprietary hyperautomation to
      orchestrate response actions across disparate data sources.

      The platform's BYOT (Bring Your Own Technology) strategy is its primary differentiation against
      single-SIEM-dependent MDR competitors. As of February 2026 the supported SIEM list encompasses
      Splunk, Microsoft Sentinel, Google SecOps, and Securonix. The Securonix integration, announced
      February 24, 2026, explicitly targets the "SIEM capability gap"—the distance between what an
      enterprise SIEM can theoretically do and what internal teams can realistically deliver. Deepwatch
      positions the BYOT model as enabling an "instant-on SOC" that bypasses the typical 6-12 month
      SIEM tuning cycle. The Cribl partnership (June 2024) extended OSDA by adding Cribl Stream, Edge,
      Search, Lake, and Cloud to the data pipeline options, enabling data normalization, in-place search
      without migration, and expanded data-lake support. All production infrastructure is hosted on AWS
      within customer-specific isolated VPCs.
