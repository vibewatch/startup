  evidenceGaps:
    - id: GE001
      topic: No public technical architecture documentation or API specification
      description: >
        Deepwatch does not publish a technical architecture document, API reference, or integration
        specification. The platform's internal data flows, detection logic, and AI model architecture
        are proprietary and undisclosed. This limits independent auditability of the platform's
        correctness, latency, and security claims.
      severity: high
      relatedQuestionRefs:
        - QE010

    - id: GE002
      topic: No vendor-published SLA or MTTD/MTTR benchmarks
      description: >
        Deepwatch does not publish formal SLA commitments, mean time to detect (MTTD), or mean
        time to respond (MTTR) benchmarks. The only performance data available is a single
        unverified AWS Marketplace customer review reporting 40-60% MTTR reduction. Due diligence
        should request signed SLA documentation and historical performance data under NDA.
      severity: high
      relatedQuestionRefs:
        - QE020

    - id: GE003
      topic: Post-reduction analyst headcount and SOC capacity undisclosed
      description: >
        Following the November 2025 workforce reduction of approximately 30% (~60-80 employees),
        Deepwatch has not disclosed the current analyst count, analyst-to-customer ratio, or how
        NEXA automation compensates for reduced human capacity. This is material for assessing
        whether 24/7/365 SOC SLAs can be maintained without degradation.
      severity: high
      relatedQuestionRefs:
        - QE021

    - id: GE004
      topic: NEXA AI model architecture and performance undisclosed
      description: >
        The NEXA AI agents' underlying model architecture (LLM choice, fine-tuning approach,
        training data sources, retraining cadence) is not publicly disclosed. ISO 42001 covers
        AI management governance process, not model accuracy, bias, or output quality. No
        independent technical evaluation of NEXA AI quality has been published.
      severity: medium
      relatedQuestionRefs:
        - QE019
        - QE025

    - id: GE005
      topic: Dassana integration maturity not independently assessed
      description: >
        The CTEM module from the February 2025 Dassana acquisition has been in integration for
        approximately 15 months. No independent technical assessment of integration depth,
        potential technical debt, or data mesh completeness has been published. Coverage gaps
        in the Dassana ecosystem integrations are not publicly documented.
      severity: medium
      relatedQuestionRefs:
        - QE024


    - id: GE007
      topic: No independent third-party benchmark for NEXA or detection platform
      description: >
        No MITRE ATT&CK Evaluations, CREST assessment, or third-party analyst technical benchmark
        (analogous to SE Labs or AV-Comparatives for endpoint products) was found for the
        Deepwatch detection platform or NEXA AI agents. All performance claims are self-reported
        or from a single customer review.
      severity: medium
      relatedQuestionRefs:
        - QE025

