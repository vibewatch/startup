  - id: nexa-ai-ecosystem
    title: NEXA Agentic AI Ecosystem
    body: >
      NEXA, launched November 4, 2025, is Deepwatch's agentic AI layer sitting above the detection
      and data infrastructure. It is described as the first collaborative agentic AI ecosystem in the
      MDR market. The ecosystem comprises six purpose-built agents divided into two functional tiers.
      The SOC tier has three agents: the Investigative Agent automates data enrichment and investigation
      orchestration; the Narrative Agent synthesizes investigation outputs into plain-language threat
      summaries; and the Response Agent coordinates containment and remediation actions. The Customer
      tier adds three agents: the CTEM Agent correlates signals across the security stack to produce
      real-time exposure insights and board-level reports; the Detection Advisor Agent maps detection
      coverage to MITRE ATT&CK and identifies gaps against real-world threat actors; and the Ticket
      Analyzer Agent performs deep analysis across historical and active tickets to surface patterns.

      A defining architectural choice is natural-language interaction: both security analysts and
      non-technical business leaders can query the platform in plain English without SQL or custom
      query language expertise. Human-in-the-loop control is maintained for high-risk actions—host
      and endpoint isolation require explicit human approval, preventing fully autonomous containment.
      NEXA Dynamic Risk Scoring suppresses low-priority alerts, addressing a documented customer pain
      point of alert fatigue. The ecosystem became generally available in Q4 2025. On May 21, 2026
      Deepwatch announced ISO/IEC 42001:2023 certification specifically for the NEXA AI Management
      System, placing it among the first cybersecurity companies to hold externally validated AI
      governance credentials. Xactly CISO Matthew K. Sharp is the only named public customer reference
      for NEXA at the time of research.
