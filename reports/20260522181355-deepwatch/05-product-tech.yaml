  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >
      How a customer threat event moves from raw telemetry through the Deepwatch platform
      to a resolved incident, illustrating the human-AI collaboration model.
    data:
      nodes:
        - id: n1
          label: Customer environment generates telemetry
          description: "Logs, alerts, and events flow from endpoint, identity, cloud, and network sources into the customer-owned SIEM (Splunk / Sentinel / Google SecOps / Securonix)"
        - id: n2
          label: SIEM ingestion and correlation
          description: "Customer SIEM ingests and normalizes telemetry; Deepwatch SIEM engineering maintains detection rules and tuning via OSDA layer"
        - id: n3
          label: Detection engine fires alert
          description: "Deepwatch proprietary detection rules produce alerts in the SIEM; NEXA Dynamic Risk Scoring suppresses low-priority noise and escalates high-fidelity signals"
        - id: n4
          label: NEXA Investigative Agent enriches context
          description: "Automated data enrichment pulls in threat intelligence, asset context, user behavior, and prior incident history to build a full investigation package"
        - id: n5
          label: NEXA Narrative Agent summarizes threat
          description: "Investigation data is converted to a plain-language threat summary; both SOC analysts and customer stakeholders can consume it without query-language expertise"
        - id: n6
          label: SOC analyst validates and triages
          description: "Deepwatch analyst reviews AI-enriched summary, validates finding, and determines response priority; human judgment is preserved for all escalation decisions"
        - id: n7
          label: Response Agent proposes containment action
          description: "For automated responses (block, isolate), NEXA Response Agent generates recommended action; host/endpoint isolation requires explicit customer approval"
        - id: n8
          label: Customer approves or overrides
          description: "Customer stakeholder or CISO approves containment actions via portal; human-in-the-loop maintained for high-risk decisions"
