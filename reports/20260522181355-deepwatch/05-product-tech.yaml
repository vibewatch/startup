  - id: byot-integrations
    title: BYOT Integrations and Partner Ecosystem
    body: >
      Deepwatch's integration strategy pivots on four SIEM relationships and two infrastructure
      partnerships. On the SIEM side, Splunk was the original supported platform and remains a core
      investor through its Splunk Ventures participation in the Series C. Microsoft Sentinel support
      was added in April 2024, followed by CrowdStrike as an EDR/XDR data source and Google SecOps
      in July 2025 via the Google Cloud MSSP Initiative. Securonix support—the fourth named SIEM—
      was announced February 24, 2026, expanding the addressable market to Securonix's enterprise
      customer base. Deepwatch states it will continue evaluating additional SIEM integrations based
      on customer demand, suggesting the BYOT roadmap is not closed.

      On the data infrastructure side, the Cribl partnership supports the full Cribl product suite
      (Stream, Edge, Search, Lake, Cloud) as a data normalization and routing layer. This allows
      customers to retain data sovereignty, search in place without migration, and reduce per-gigabyte
      ingestion costs. On the cloud infrastructure side, Deepwatch holds AWS Level 1 MSSP Competency
      Partnership with a Modern Compute Specialization covering containerized workloads on Amazon EKS.
      A CloudFormation integration template (aws-ia/cfn-abi-deepwatch-mdr on GitHub) automates
      deployment of the Deepwatch MDR integration in AWS environments; the repo has minimal community
      traction (1 star, 8 watchers as of research date), consistent with Deepwatch's closed-source,
      service-delivery model rather than a developer-extensible platform. No public API documentation
      or developer SDK was found in public registries or documentation portals, indicating that
      technical integration is managed by Deepwatch's own SIEM engineering team rather than
      self-served by customers.
