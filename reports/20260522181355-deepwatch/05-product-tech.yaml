callouts:
  - calloutType: strength
    title: SIEM-Agnostic BYOT Architecture
    body: >
      Deepwatch's Open Security Data Architecture is a genuine technical differentiator: four named
      SIEM platforms with more roadmap-committed, Cribl as a data pipeline, and AWS as a cloud
      infrastructure layer. This multi-SIEM model reduces platform lock-in risk compared to
      single-SIEM MDR providers and allows Deepwatch to address a broader enterprise TAM.
    claimRefs:
      - CE012
      - CE014

  - calloutType: risk
    title: Closed-Source Architecture with No Public API
    body: >
      Deepwatch's platform is entirely closed-source with no public API documentation, developer
      SDK, or Splunkbase-listed integration add-on. The only public developer artifact is a
      CloudFormation template on GitHub with minimal community traction (1 star, 8 watchers). This
      limits customer ability to independently extend, audit, or switch providers—creating
      operational dependency on Deepwatch's professional services team for any integration changes.
    claimRefs:
      - CE033
      - CE034

  - calloutType: risk
    title: Staffing Risk Following November 2025 Workforce Reduction
    body: >
      Deepwatch laid off approximately 30% of its workforce in November 2025 to redirect resources
      toward AI investment. A 24/7 human SOC is the core operational commitment of the Guardian MDR
      Platform; any reduction in analyst headcount that outpaces NEXA automation increases the risk
      of SLA degradation in high-volume or complex incident scenarios. No updated headcount or
      analyst-to-customer ratio has been disclosed post-reduction.
    claimRefs:
      - CE001
      - CE003

  - calloutType: insight
    title: ISO 42001 as First-Mover Compliance Signal
    body: >
      Achieving ISO/IEC 42001:2023 certification in May 2026 for the NEXA AI ecosystem places
      Deepwatch among the earliest cybersecurity companies with externally validated AI governance.
      For regulated-sector buyers (financial services, healthcare, government) this may accelerate
      procurement decisions, but the scope covers only AI management process, not model accuracy,
      bias, or output quality.
    claimRefs:
      - CE026

