callouts:
  - calloutType: risk
    title: Vista Credit debt terms and covenant risk are the highest-severity undisclosed financial item
    body: |
      The $180M Series C combines equity from Springcoast and Splunk Ventures with a non-dilutive
      credit facility from Vista Credit Partners. Vista Credit explicitly describes its product as
      debt, not equity. The face value of the credit tranche, interest rate, maturity date, financial
      maintenance covenants (e.g., minimum ARR or cash balance triggers), and any attached warrants
      or conversion rights are all private. If covenants include revenue or ARR floors, a slowdown
      in growth could trigger accelerated repayment obligations that constrain Deepwatch's ability
      to reinvest in the platform or raise follow-on equity on favorable terms. Any investor in a
      new round must treat the Vista Credit terms as a priority diligence item.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI009
      - CI036
      - CI037

  - calloutType: risk
    title: 27-month gap since last funding round leaves capital adequacy opaque
    body: |
      Deepwatch last raised capital in February 2023. As of May 2026—a gap of over 27 months—no
      new round, secondary transaction, or debt refinancing has been announced. The November 2025
      layoffs reduced headcount by ~30%, which is consistent with a cash preservation posture even
      if management attributed the action to AI strategy. Without official cash or burn data, it is
      impossible to determine whether Deepwatch is fully self-funded on the 2023 raise, approaching
      the end of its runway, or quietly in a new fundraising process. Diligence must prioritize
      obtaining a 12-month cash flow statement and a burn-rate timeline to the next round trigger.
    claimRefs:
      - CI010
      - CI038
      - CI039
      - CI040
      - CI041

  - calloutType: insight
    title: Third-party revenue estimates imply capital efficiency above MSSP median but cannot be confirmed
    body: |
      Third-party trackers (LATKA, Growjo, IT-Harvest) converge in the $91M–$114M revenue range
      for Deepwatch. At $256M total capital raised against a ~$111M midpoint estimate, the implied
      revenue-to-capital ratio is approximately 43%—above the MSSP median for companies at this
      stage and consistent with the 2022 disclosure of 100% YoY sales growth and strong customer
      expansion. However, all third-party estimates use indirect methodologies (funding multiples,
      headcount extrapolation) and none are confirmed by Deepwatch. Until official ARR is disclosed,
      the efficiency narrative should be treated as directional hypothesis rather than verified fact.
    claimRefs:
      - CI001
      - CI012
      - CI024
      - CI025
      - CI026
      - CI027

