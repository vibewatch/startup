figures:
  - id: FI001
    title: Revenue model bridge — how Deepwatch customer activity converts to revenue and gross profit
    type: flow
    layout: wide
    summary: >-
      Illustrates the end-to-end mechanism by which an enterprise customer generates subscription
      revenue and gross profit for Deepwatch, from initial sales contact through ongoing platform
      delivery.
    data:
      nodes:
        - id: n1
          label: Enterprise prospect (Fortune 2000 target)
          description: >-
            Mid-to-large enterprise lacking full-time 24x7 SOC capacity or SIEM management
            expertise. Pain point: alert volume, staffing shortage, regulatory pressure.
        - id: n2
          label: Direct enterprise sales motion
          description: >-
            Solution-engineered, sales-led deal cycle. No self-serve; median contract ~$315K/yr
            (Vendr data). Typical MDR sales cycle is 3–9 months for new logos.
        - id: n3
          label: Annual subscription contract (ACV)
          description: >-
            Signed multi-year enterprise agreement covering Guardian MDR platform tier (Core,
            Advanced, or Enterprise). Revenue recognized ratably over contract term.
        - id: n4
          label: Platform delivery (Guardian MDR + NEXA AI)
          description: >-
            24x7 SOC operations, detection engineering, threat hunting, automated alert triage.
            Primary cost driver: SOC analyst headcount + cloud infrastructure.
        - id: n5
          label: Expansion and renewal (upsell / NRR)
          description: >-
            2022 data point: >2/3 of customers expanded service. Expansion ARR from MXDR add-ons,
            CTEM/Dassana layer, and new SIEM platform coverage. NRR above 100% implied.
        - id: n6
          label: Subscription revenue and gross profit
          description: >-
            Recurring revenue recognized ratably. Gross profit = revenue minus SOC labor, cloud,
            and subcontractor costs. Industry benchmark gross margin 50–55% for platform-led MDR;
            Deepwatch-specific margin not disclosed.
      edges:
        - from: n1
          to: n2
          label: prospect engagement
        - from: n2
          to: n3
          label: signed contract
        - from: n3
          to: n4
          label: platform delivery obligation
        - from: n4
          to: n5
          label: service quality drives retention
        - from: n5
          to: n3
          label: renewal / upsell to new ACV
        - from: n3
          to: n6
          label: ratable revenue recognition
    approximationNotes: >-
      Sales cycle length and gross margin are industry-benchmarked proxies, not Deepwatch-
      confirmed figures. NRR above 100% is inferred from the 2022 customer expansion data
      point and is not an official metric.
    claimRefs:
      - CI017
      - CI018
      - CI020
      - CI022
      - CI042

  - id: FI002
    title: Unit economics bridge — qualitative cost and value nodes (inputs unavailable publicly)
    type: flow
    layout: standard
    summary: >-
      Maps the unit-economics logic chain from customer acquisition through lifetime value for
      Deepwatch MDR; all numeric inputs are unavailable publicly and nodes carry qualitative
      approximation labels only.
    data:
      nodes:
        - id: n1
          label: S&M spend (undisclosed)
          description: >-
            Sales and marketing investment per period. Not disclosed. MDR sales cycles are
            long (3–9 months) and require technical pre-sales resources; CAC is therefore
            expected to be high relative to SMB SaaS.
        - id: n2
          label: New logo acquisition (CAC unknown)
          description: >-
            Cost to acquire one new enterprise customer. Not calculable from public data.
            Estimated ACV of ~$315K suggests CAC payback under 24 months is commercially
            viable if gross margin is 50%+.
        - id: n3
          label: Deployment and onboarding
          description: >-
            SIEM integration, SOC tuning, and detection rule customization for new customer.
            One-time service delivery cost; labor-intensive but partially offset by recurring
            subscription premium.
        - id: n4
          label: Annual contract value (~$315K median, Vendr)
          description: >-
            Recurring annual revenue per customer. Expansion through MXDR, CTEM, and additional
            SIEM coverage adds incremental ACV each renewal cycle.
        - id: n5
          label: "LTV (NRR proxy: >2/3 customer expansion, 2022)"
          description: >-
            Lifetime value driven by ACV × average contract length × NRR. All inputs are
            unavailable or estimated; LTV calculation not possible from public data alone.
            SOC analyst staffing is the largest variable cost against which LTV is earned.
      edges:
        - from: n1
          to: n2
          label: investment drives acquisition
        - from: n2
          to: n3
          label: signed customer enters delivery
        - from: n3
          to: n4
          label: deployed customer generates ACV
        - from: n4
          to: n5
          label: renewal and expansion build LTV
    approximationNotes: >-
      All numeric inputs are unavailable from public sources. ACV median is from Vendr buyer
      benchmarks (third-party), not Deepwatch. NRR proxy is a single 2022 data point from the
      Series C press release. CAC, LTV, and payback period cannot be calculated; this figure
      shows structure only and all value cells should be treated as unknown.
    claimRefs:
      - CI020
      - CI044
      - CI045

