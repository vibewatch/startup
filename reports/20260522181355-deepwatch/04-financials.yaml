  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: burn rate and runway
      missingEvidence: >-
        Monthly cash burn rate, current cash on hand, and remaining runway from the February 2023
        Series C. No public filing, press release, or management statement provides this data.
      whyItMatters: >-
        Without burn and runway, it is impossible to assess whether Deepwatch is self-funding on
        existing capital, approaching a forced raise, or in a position of financial strength. It is
        the single most time-sensitive capital adequacy input for any new investor.
      diligencePath: >-
        Request 12-month trailing P&L, cash flow statement, and bank balance certification from
        CFO. Ask for a projected runway model showing months to zero cash at current burn.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: material
      topic: Vista Credit Partners debt terms
      missingEvidence: >-
        Complete Vista Credit Partners credit agreement including facility size, drawn amount,
        interest rate or PIK structure, maturity date, financial maintenance covenants (ARR floor,
        cash balance trigger), and any attached equity warrants or conversion rights.
      whyItMatters: >-
        Debt covenants tied to revenue or cash thresholds could constrain future equity raises,
        force a sale, or restrict operational flexibility. Conversion rights would dilute future
        equity investors. The credit terms are essential inputs to any capitalization model.
      diligencePath: >-
        Request full credit agreement from management data room. Engage legal counsel to review
        covenant package and any cross-default provisions. Confirm whether Vista Credit has
        converted or repaid any portion since 2023.
      relatedQuestionRefs:
        - QI028
      relatedTableRefs:
        - TI004
        - TI005

    - type: private-evidence-only
      severity: material
      topic: ARR and revenue official disclosure
      missingEvidence: >-
        Official ARR, total revenue, and revenue-by-product-tier breakdown from Deepwatch
        management or a regulatory filing. Third-party estimates span $91M–$114M with no
        confirmed anchor.
      whyItMatters: >-
        Without confirmed ARR, any valuation multiple is applied to an unverified number.
        A $23M spread in third-party estimates (~25% of midpoint) is too wide for a meaningful
        ARR-based valuation range and exposes any model to systematic error.
      diligencePath: >-
        Request audited or management-certified ARR schedule for trailing 8 quarters by service
        tier. Obtain NRR, gross churn, and new-logo ARR broken out separately.
      relatedQuestionRefs:
        - QI027
      relatedTableRefs:
        - TI003
        - TI005

    - type: private-evidence-only
      severity: material
      topic: unit economics
      missingEvidence: >-
        CAC, payback period, LTV, gross margin, and net revenue retention rate; none of these
        metrics have been publicly disclosed or reliably estimated from available sources.
      whyItMatters: >-
        Unit economics determine whether Deepwatch's growth is capital-efficient and whether the
        business can achieve sustainable profitability. A 50% gross margin with a 12-month payback
        is a very different investment than a 30% gross margin with a 36-month payback at the same
        ARR level.
      diligencePath: >-
        Request fully-loaded COGS waterfall (SOC labor, cloud infrastructure, Dassana amortization,
        subcontractor costs) and sales & marketing spend for trailing 8 quarters. Derive CAC and
        payback from new-logo bookings data.
      relatedQuestionRefs:
        - QI027
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: post-Series-C valuation
      missingEvidence: >-
        An official or credible analyst-confirmed post-money valuation since the February 2023
        Series C close. No press release, secondary transaction data, or mark-to-market has
        been published.
      whyItMatters: >-
        Any new investment must establish its own valuation reference. Without a 2023 or later
        anchor, the pricing of a new round is unconstrained, and prior investors may hold stale
        preferences that create negotiation friction.
      diligencePath: >-
        Request 409A valuation as of most recent option grant. Review any secondary share
        transactions since February 2023 to extract implied valuation. Commission an independent
        mark-to-market if no 409A is available.
      relatedQuestionRefs:
        - QI027

    - type: missing-source
      severity: minor
      topic: Dassana acquisition consideration
      missingEvidence: >-
        Acquisition price, form of consideration (cash, equity, or earnout), purchase price
        allocation, and intangible asset amortization schedule for the February 2025 Dassana
        acquisition.
      whyItMatters: >-
        If the acquisition was all-cash, it reduced the runway from the Series C materially.
        If it included equity, it diluted the cap table. Either form affects the capital adequacy
        analysis and the goodwill/intangible amortization in the P&L going forward.
      diligencePath: >-
        Request the acquisition agreement or a summary term sheet from the data room, along with
        the opening balance sheet post-acquisition showing goodwill and identified intangibles.
      relatedTableRefs:
        - TI005

    - type: missing-source
      severity: minor
      topic: additional debt or credit facilities
      missingEvidence: >-
        Any revolving credit facility, equipment lease obligations, real estate financing, or
        additional debt instruments beyond the Vista Credit component of the Series C.
      whyItMatters: >-
        Undisclosed debt obligations would add to total interest expense and capital structure
        complexity; they would also affect covenant analysis and priority waterfall in a downside
        scenario.
      diligencePath: >-
        Request a complete schedule of debt and capital lease obligations from the CFO. Run a
        UCC search in Delaware and California for Deepwatch, Inc. through a commercial lien
        search provider.
      relatedQuestionRefs:
        - QI028
      relatedTableRefs:
        - TI005
