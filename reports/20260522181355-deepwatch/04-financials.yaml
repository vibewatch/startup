  - id: s3
    title: Unit economics, margin benchmarks, and headcount signals
    body: |
      Deepwatch discloses no unit economics—CAC, LTV, payback period, or net revenue retention—
      publicly. Gross margin is similarly withheld. As a structural proxy, MSSP and platform-led
      MDR providers in the public and semi-public market typically achieve gross margins in the
      50–55% range once the platform leverages automation to reduce per-alert analyst time; this
      benchmark from public-company MDR comparables is the best available reference for modeling
      Deepwatch's cost structure, but it may overstate Deepwatch's margin if the post-layoff
      workforce reductions have yet to fully reduce service delivery costs on legacy customer
      cohorts. The one unit-economics proxy available from 2022 data—over two-thirds of customers
      expanding service—is consistent with net revenue retention above 100% in that period, but
      customer cohort behavior since then is unknown.

      Third-party revenue trackers produce estimates in a $91M–$114M range. LATKA placed 2023
      revenue at $111M ARR; Growjo and Compworth project approximately $113.7M for 2026; IT-Harvest
      circulated an estimate of approximately $91M TTM in secondary sources. These estimates use
      different methodologies—some derived from funding multiples, others from headcount-revenue
      extrapolation—and none are confirmed by Deepwatch. Taking the midpoint implies approximately
      $100M–$112M run-rate revenue; at the third-party headcount estimate of 239–250 employees, the
      implied revenue per employee is approximately $400K–$470K, which is above the typical MSSP
      benchmark of $200K–$300K per head and could indicate favorable economics or overstated
      revenue estimates. At the estimated $315K median contract value, 320–360 enterprise customers
      would be required to reach $100M ARR; customer count is not disclosed.

      The November 2025 layoffs removed 60–80 employees from a ~250-person workforce, representing
      a ~30% reduction. Analyst databases show a negative 5% year-over-year headcount growth as of
      early 2026, confirming the net workforce contraction. The primary service-delivery cost driver
      for an MDR company is SOC analyst headcount; if the layoffs concentrated on analysts (as
      reported), near-term gross margin should improve as AI automation absorbs alert triage, though
      customer SLAs and service quality commitments create a floor below which staffing cannot fall
      without degrading the product. An anonymous employee quoted in TechCrunch expressed skepticism
      that AI tooling could substantively replace analyst judgment at current maturity, adding an
      execution risk overlay to the cost-reduction thesis.
