  - id: s2
    title: Capital history, structure, and adequacy
    body: |
      Deepwatch has raised a disclosed total of $256 million across three public rounds. The Series A
      ($23 million, April 2019) was led by ABS Capital Partners, which has remained the longest-
      tenured institutional backer across all three rounds. The Series B ($53 million, October 2020)
      was led by Goldman Sachs, with ABS Capital participating. The Series C ($180 million, February
      15, 2023) combined equity investments from Springcoast Capital Partners and Splunk Ventures
      with a "strategic financing" tranche from Vista Credit Partners, the credit-investing arm of
      Vista Equity Partners. The combined $180 million round was the largest single capital event and
      brought AUM of $10B+ in credit capacity from Vista Credit into the cap table.

      The equity-versus-debt composition of the Series C is not publicly disclosed. Vista Credit
      Partners explicitly describes its offering as "non-dilutive credit solutions," indicating their
      tranche was structured as a debt facility rather than equity, though covenants, maturity, and
      any warrant or conversion features are private. LeadIQ's company profile shows total growth
      capital as "over $275 million," a figure $19 million above the official $256 million
      announcement; the gap likely reflects the Vista Credit component being reported at its full
      committed facility size rather than the disclosed equity-equivalent. This discrepancy does not
      indicate an additional undisclosed equity round; it signals a structural difference in how
      different databases classify credit facilities.

      As of the run date (May 2026), no new financing round has been announced since February 2023—
      a gap of approximately 27 months. The November 2025 layoffs, which reduced headcount by
      approximately 30%, are consistent with extending runway on the existing capital base, though
      management attributed the cuts to AI-driven efficiency acceleration rather than cash pressure.
      No IPO, SPAC, or acquisition of Deepwatch has been reported. Cash on hand, monthly burn rate,
      and remaining runway from the Series C are not publicly disclosed, leaving capital adequacy
      as a key diligence gap. The absence of a new round is ambiguous: it could reflect capital
      efficiency (adequate runway from the 2023 raise) or an inability to raise at attractive terms
      in a tighter credit environment for private cybersecurity companies.
