  - id: s4
    title: Financial evidence limits, corporate registry, and underwriting blockers
    body: |
      Deepwatch is a private U.S. company not subject to SEC reporting requirements and has made no
      voluntary public disclosure of financial statements, balance sheets, or income statements. The
      corporate registry evidence is limited but confirmable: DEEPWATCH, INC. is incorporated in
      Delaware with entity number 6639920 per OpenCorporates registry data. The Florida Division of
      Corporations (SunBiz) is an official state-level registry where the company previously
      maintained a presence during its Tampa, FL headquarters period; direct Florida entity lookup
      was not completed due to portal navigation constraints, but the official registry portal was
      accessed and confirmed as operational. No UCC lien filings, security interests, or debt
      covenants related to the Vista Credit Partners structured financing component are publicly
      visible in the registries and databases accessed for this analysis.

      The absence of any financial filings means that fundamental underwriting inputs—gross margin,
      EBITDA, cash burn, runway, customer count, ARR, and NRR—must be sourced from management
      disclosure (unavailable publicly), secondary transaction data (none identified), or third-party
      estimates (low confidence). The Vista Credit structured component adds a layer of credit risk
      that cannot be sized without knowing the facility amount, interest rate, maturity date, any
      covenants tied to ARR or cash flow thresholds, and whether equity warrants or conversion rights
      attach. The five explicit evidence gaps identified for this chapter—burn/runway, unit economics,
      Vista Credit terms, post-Series-C valuation, and Dassana acquisition consideration—are
      individually material and collectively render traditional DCF or ARR-multiple valuation
      underwriting impossible without direct management access and confidential data room disclosure.
    claimRefs:
