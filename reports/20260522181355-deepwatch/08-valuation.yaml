  - id: EGV007
    type: enumeration-incomplete
    severity: material
    topic: 'TV004 comparable valuation table: private MDR peers and recent exits not fully enumerated'
    missingEvidence: >
      Valuation multiples for private MDR peers (Arctic Wolf, Expel, eSentire, Secureworks) and for completed MSSP acquisitions
      (2023–2025) with disclosed consideration. Also missing: audited revenue figures for any comp to confirm multiples are
      applied to consistent revenue definitions.
    whyItMatters: >
      The TV004 comparable set covers only publicly traded companies. Private MDR peers trade at meaningfully different multiples
      given different growth profiles, profitability, and strategic buyer demand. Excluding them understates the range of
      applicable multiples.
    diligencePath: >
      Source private MDR peer transaction data from Momentum Cyber, Solganick, or Houlihan Lokey MDR-specific deal databases.
      Request PitchBook comparable transactions analysis for private MDR exits 2023–2025.
