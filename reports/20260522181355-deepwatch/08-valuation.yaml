    - id: recommendation
      label: "Cautious: base EV $730M–$1.0B; diligence-gated; do not anchor on $2.6B"
    edges:
    - from: market
      to: position
      label: "favorable sector"
    - from: position
      to: funding
      label: "capital history"
    - from: funding
      to: opacity
      label: "no post-C disclosure"
    - from: opacity
      to: comps
      label: "analogy-only valuation"
    - from: risks
      to: comps
