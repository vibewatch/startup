- id: evidence-gaps-recommendation
  title: Evidence Gaps, Final Diligence Asks, and Recommendation
  body: >
    The single most important fact about Deepwatch's valuation is what is not known: there is no
    publicly available ARR, NRR, GRR, EBITDA, or cash-flow figure. Revenue estimates from
    IT-Harvest ($91M LTM), Growjo (~$113M), and IncFact ($100M–$500M range) are all
    unverified aggregator estimates derived from signal inference rather than audited accounts.
    Without these, any valuation range is derived by analogy from comparables—not from
    fundamentals—and carries wide confidence intervals.

    Diligence-blocking gaps include: (1) the equity/debt split within the $180M Series C
    and Vista Credit's specific terms (rate, maturity, covenants); (2) Deepwatch's post-Series-C
    ARR schedule, showing growth rate and customer cohort data; (3) GRR and NRR for FY2024 and
    FY2025; (4) post-layoff analyst headcount and SLA attainment, directly relevant to whether
    the 25–30% workforce reduction degraded the human-delivery model; (5) the Dassana CTEM
    module commercial status and ARR contribution; and (6) post-Brian Dhatt strategic plan
    confirming or modifying the NEXA agentic AI roadmap.

    Overall recommendation: Cautious. Deepwatch operates in a structurally attractive MDR market
    with a defensible enterprise position, but the opacity of its financials, the $2.6B
    unsupported valuation figure in circulation, the destabilizing three-CEO sequence, the
    November 2025 layoffs in the analyst core, and the unknown Vista Credit debt terms create
    sufficient diligence risk that no investment thesis is supportable at any specific price
    without NDA-gated access to the items above. The base-case enterprise value range of
    $730M–$1.0B is the most defensible public anchor given current evidence. Buyers considering
    a strategic acquisition should apply an additional 10%–30% control premium, conditional on
    confirming NRR and ARR trajectory.
