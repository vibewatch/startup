- id: scenarios
  title: Bull, Base, and Bear Valuation Scenarios
  body: >
    Given total financial opacity, the three scenarios below use IT-Harvest's $91M LTM revenue
    estimate as the reference base, with sensitivity to revenue multiple and revenue level. No
    scenario should be interpreted as a price at which shares would trade; they reflect
    enterprise value ranges under different growth and multiple assumptions. All scenarios assume
    the Vista Credit debt tranche ($30M–$100M estimated, undisclosed principal) is senior to
    equity and must be subtracted to estimate equity value.

    Bull case. Revenue has grown from $91M (IT-Harvest Nov 2025) to approximately $105M–$115M
    by mid-2026 driven by NEXA agentic-AI adoption and cross-sell. Net revenue retention above
    110% (consistent with 2022 disclosed expansion data), ISO 42001 certification, and the new
    CEO's engineering pedigree drive a strategic acquirer's premium. Multiple: 15x revenue.
    Enterprise value: $1.575B (midpoint). Less Vista Credit debt (estimated $50M–$100M):
    equity value approximately $1.475B–$1.525B. Probability signal: low-medium (requires
    confirmed revenue growth, NRR above 110%, and a credible acquirer bid or IPO).

    Base case. Revenue is approximately $91M–$100M with moderate growth; NRR between 100%–
    110%; AI transition partially offsets analyst headcount loss. Multiple: 8x–10x revenue
    (below sector median, reflecting opacity discount, leadership instability, and layoff risk).
    Enterprise value: $730M–$1.0B. Less Vista Credit debt: equity value approximately
    $630M–$950M. Probability signal: medium (most plausible without diligence access;
    consistent with IT-Harvest lower bound). Recommendation at base: hold, conditional on ARR
    and retention confirmation.

    Bear case. Revenue is flat or declining (post-layoff customer churn, AI narrative not
    converting to contracts, leadership disruption). Multiple: 4x–5x revenue on $80M–$91M
    estimate. Enterprise value: $320M–$455M. Less Vista Credit debt and preference stack: equity
    value approximately $220M–$405M—materially below total equity invested ($76M+ equity
    rounds). The bear case implies the Series C equity tranches would be underwater depending on
    the preference waterfall. Probability signal: medium-low but elevated by three-CEO turnover
    and ~30% workforce reduction in the analyst/operations core.
