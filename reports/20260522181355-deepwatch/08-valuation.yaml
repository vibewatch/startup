    - from: opacity
      to: recommendation
      label: "diligence requirement"

- id: FV002
  title: Valuation sensitivity
  type: bar
  notes: >
    Bars show implied enterprise value under different revenue multiples applied to IT-Harvest's
    $91M LTM estimate. The "Sector high-growth median" bar (15.5x) represents Houlihan Lokey's
    Q2 2025 benchmark for high-growth vendors. The "IT-Harvest mid" bar (16.5x) represents
    the midpoint of IT-Harvest's $1.27B–$1.72B estimate divided by $91M revenue. All values
    are illustrative estimates; no official Deepwatch revenue or valuation has been confirmed.
