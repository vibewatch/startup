  researchQuestions:
  - id: QV001
    type: verification
    question: "What is the total disclosed funding raised by Deepwatch and the structure of each round?"
    status: answered
    finding: >
      Deepwatch has publicly disclosed $256M across three rounds: Series A ($23.4M, April 2019,
      ABS Capital); Series B ($53M, October 2020, Goldman Sachs + ABS Capital); Series C ($180M,
      February 15, 2023, Springcoast + Splunk Ventures equity + Vista Credit Partners debt).
    sourceRefs: [SV001, SV004, SV005, SV025]
    targets:
    - contentRequirements/2
    - plannedTables/recommendation-summary-table

  - id: QV002
    type: verification
    question: "What is the composition of the Series C (equity vs. debt) and what are Vista Credit's terms?"
    status: partial
    finding: >
      The Series C announcement explicitly describes Vista Credit's portion as "non-dilutive
      strategic financing"—indicating a credit structure rather than pure equity. The exact split
      between Springcoast/Splunk equity and Vista Credit debt, plus specific loan terms (rate,
      maturity, covenants), has never been disclosed publicly.
    sourceRefs: [SV001, SV020, SV022]
    targets:
    - contentRequirements/2
    - plannedTables/final-diligence-asks-table

  - id: QV003
    type: verification
    question: "Has Deepwatch disclosed its post-money Series C valuation anywhere publicly?"
    status: answered
    finding: >
      No. PitchBook's public-facing profile hides post-money valuation; CB Insights shows funding
      history but no post-money mark; Tracxn classifies Deepwatch as a "minicorn" (below $1B).
      No investor press release or company announcement has disclosed the Series C post-money
      valuation.
    sourceRefs: [SV005, SV006, SV004]
    targets:
    - contentRequirements/2
    - plannedTables/recommendation-summary-table

  - id: QV004
    type: quantification
    question: "What revenue-based valuation range results from applying public MDR/cybersecurity comp multiples to Deepwatch's
      estimated revenue?"
    status: answered
    finding: >
      Applying the range of public comps to IT-Harvest's $91M estimate: bear (4x–5x) = $364M–$455M;
      base (8x–10x) = $728M–$910M; bull (14x–15.5x) = $1.27B–$1.41B. These are consistent with
      IT-Harvest's $1.27B–$1.72B range under high-growth assumptions.
    sourceRefs: [SV003, SV010, SV011, SV015]
    targets:
    - contentRequirements/3
    - plannedTables/bull-base-bear-scenario-table

  - id: QV005
    type: quantification
    question: "What is IT-Harvest's most recent valuation estimate for Deepwatch and what methodology does it imply?"
    status: answered
    finding: >
      IT-Harvest estimated Deepwatch generated $91M LTM revenue as of November 2025 and valued it
      at $1.27B–$1.72B, implying a 14x–19x revenue multiple. The methodology uses workforce
      signals, funding history, and sector comps; it is the only named public analyst estimate.
    sourceRefs: [SV003]
    targets:
    - contentRequirements/3
    - plannedTables/comparable-valuation-table

  - id: QV006
    type: quantification
    question: "How does Deepwatch's estimated ARR compare to public cybersecurity comp revenue bases?"
    status: answered
    finding: >
      At $91M–$113M estimated, Deepwatch is approximately 5% of Rapid7 ($852M), 9%–11% of
      SentinelOne ($1B+), and <2% of CrowdStrike ($4.81B). It is a mid-tier private company,
      well below IPO-scale comparables.
    sourceRefs: [SV003, SV013, SV014, SV015, SV008]
    targets:
    - contentRequirements/4
    - plannedTables/comparable-valuation-table

  - id: QV007
    type: comparison
    question: "How do CrowdStrike, SentinelOne, Rapid7, and PANW revenue multiples compare to each other?"
    status: answered
    finding: >
      CrowdStrike: 18.6x NTM EV/Rev (profitable, dominant platform). SentinelOne: 3.5x NTM
      (loss-making, smaller scale). Rapid7: 0.9x LTM (profitable but low-growth, skepticism).
      PANW: ~18x LTM (scale/profitability leader). The 19x gap between top and bottom of comp
      set reflects that multiple is primarily driven by growth rate and profitability, not size alone.
    sourceRefs: [SV015, SV013, SV014, SV011]
    targets:
    - contentRequirements/4
    - plannedTables/comparable-valuation-table

  - id: QV008
    type: comparison
    question: "How do private MSSP M&A acquisition multiples compare to Deepwatch's estimated revenue?"
    status: answered
    finding: >
      Solganick found ~20x EBITDA for top MSSP platforms; 8x–14x EBITDA for typical quality assets.
      Revenue multiples of 8x–15x EV/revenue are cited for quality private MSSP assets. Applying
      10x to $91M yields $910M EV; applying 15x yields $1.37B. Deepwatch's bear risk compresses
      this significantly if NRR is declining.
    sourceRefs: [SV012, SV010, SV011]
    targets:
    - contentRequirements/4
    - plannedTables/comparable-valuation-table

  - id: QV009
    type: comparison
    question: "How does Deepwatch's financing structure compare to MDR peers like Arctic Wolf?"
    status: answered
    finding: >
      Arctic Wolf has raised ~$1.3B in pure venture equity and is repeatedly cited as an IPO
      candidate with publicly discussed ARR above $300M. Deepwatch's mixed equity/credit structure
      from Vista Credit is unusual vs. pure-play MDR peers; the credit tranche creates debt-service
      obligations rather than equity dilution, but also imposes financial covenants not typical
      of venture-backed growth companies.
    sourceRefs: [SV019, SV001, SV022]
    targets:
    - contentRequirements/2
    - plannedTables/thesis-anti-thesis-table

  - id: QV010
    type: adverse
    question: "What evidence challenges the thesis that Deepwatch deserves a premium cybersecurity multiple?"
    status: answered
    finding: >
      Adverse evidence includes: (1) IT-Harvest headcount data showing 19% and 9% headcount
      declines in 2024 and 2025 before the November layoffs; (2) total financial opacity (no ARR,
      NRR, or EBITDA disclosed); (3) three CEO changes in under two years; (4) Tracxn classifying
      Deepwatch as a minicorn rather than unicorn. These factors support a below-sector multiple
      until diligence confirms otherwise.
    sourceRefs: [SV003, SV004, SV023]
    targets:
    - contentRequirements/1
    - plannedTables/thesis-anti-thesis-table

  - id: QV011
    type: adverse
    question: "What is the risk of a down-round or forced exit given leadership instability and layoffs?"
    status: answered
    finding: >
      No evidence of an impending down-round exists, but the conditions for one are present:
      27 months without new financing, declining headcount, three CEO changes, and a credit
      facility with undisclosed covenants. Vista Credit's continuation vehicle approach (Cloud
      Software Group $5.6B, July 2025) signals willingness to hold rather than force a sale,
      but this may not apply to a credit position.
    sourceRefs: [SV003, SV021, SV023]
    targets:
    - contentRequirements/1
    - plannedTables/thesis-break-and-kill-triggers-table

