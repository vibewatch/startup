company:
  name: Deepwatch
chapter:
  number: 8
  title: Valuation
  summary: >
    Deepwatch's valuation is structurally opaque. No post-money Series C valuation has been publicly
    disclosed by the company, its investors, or any data platform accessible without a paid
    subscription. The widely cited $2.6 billion figure is directly traceable to Axonius's Accel-led
    Series E, not to Deepwatch—an important distinction confirmed by the BankInfoSecurity source
    that was frequently cited to support the higher number. IT-Harvest, the only identifiable
    analyst source to publish an explicit estimate, placed Deepwatch's valuation at $1.27 billion–
    $1.72 billion and its LTM revenue at approximately $91 million as of November 2025. Applying
    current public-market cybersecurity comp multiples (CrowdStrike 18.6x NTM EV/Rev; SentinelOne
    3.5x; Rapid7 0.9x; PANW ~18x LTM) and the Houlihan Lokey Q2 2025 benchmarks (high-growth:
    15.5x median; medium-growth: 4.7x; low-growth: 2.6x) to Deepwatch's revenue estimate yields
    a $455M–$1.37B range under conservative to optimistic assumptions—consistent with IT-Harvest's
    band. A strategic M&A premium (10x–15x revenue) reflecting MDR sector momentum and Deepwatch's
    platform breadth lifts the midpoint toward $910M–$1.37B, but cannot be supported without
    confirming current ARR, retention, and profitability. The financing structure—Vista Credit
    Partners' debt tranche (non-dilutive per the Series C announcement) combined with equity from
    Springcoast and Splunk Ventures—creates preference and debt-service unknowns that further
    cloud the equity value picture. The verdict is conservative: Deepwatch is a credible MDR
    platform in a fast-growing market, but the combination of three CEO changes in under two years,
    a ~30% workforce reduction, total financial opacity, and an unconfirmed valuation anchor
    prevents any high-confidence valuation mark. The chapter recommends against anchoring on the
    $2.6B figure and advises diligence-gated investment conditioned on ARR, retention, and
    post-Series-C financials disclosure.

sections:
- id: financing-context
  title: Financing Context, Ownership Structure, and Valuation Opacity
  body: >
    Deepwatch has raised a publicly disclosed total of $256 million across three rounds: Series A
    ($23.4 million, April 2019, led by ABS Capital Partners), Series B ($53 million, October 2020,
    led by Goldman Sachs with ABS Capital participating), and Series C ($180 million, announced
    February 15, 2023). The Series C was structured as a combination of equity investments from
    Springcoast Capital Partners (growth equity) and Splunk Ventures (strategic), plus a
    "non-dilutive strategic financing" tranche from Vista Credit Partners, the credit-investing
    subsidiary of Vista Equity Partners. No post-money Series C valuation has been disclosed by
    Deepwatch, its investors, or any accessible data platform. PitchBook's public-facing profile
    lists the round but hides post-money valuation behind a paywall; CB Insights' financial page
    shows funding history but no post-money figure; Tracxn classifies Deepwatch as a "minicorn"
    (below $1 billion threshold) in 2026.

    The Vista Credit Partners tranche is structurally material and unusual. As a credit vehicle—
    deployed $15.4 billion and managing $10+ billion AUM as of September 30, 2025—Vista Credit
    typically originates senior secured loans and subordinated debt at market interest rates
    rather than taking pure equity positions. The Series C announcement explicitly used the phrase
    "non-dilutive" for Vista Credit's capital, which, if accurate, means this portion does not
    appear on Deepwatch's cap table as a liquidation preference but does create debt-service
    obligations (interest payments, potential covenants, maturity). The interest rate, maturity,
    covenants, and principal balance of this facility have never been publicly disclosed. Vista
    Credit's SEC-registered BDC filing (Vista Credit Strategic Lending Corp, Form 10-Q, June 30,
    2025) confirms it invests in enterprise software/technology companies with $25M–$2.5B revenue
    and uses Level 3 fair value accounting (unobservable inputs) for private portfolio holdings—
    consistent with holding a Deepwatch credit position.

    The equity-only capital base—combining Series A through B equity ($76M), and the Springcoast/
    Splunk equity portion of Series C—is likely in the range of $76M–$130M (uncertain because the
    equity/credit split within the $180M Series C has not been disclosed). Total equity dilution
    and preference stack are therefore unknown without a cap table request. Deepwatch's legal
    entity data in Tracxn shows two active US entities: "Deepwatch inc" (CIN: 38-4056947,
    incorporated December 31, 2014) and "DEEPWATCH, INC." (same CIN, active, 280 employees as of
    December 31, 2024). No additional financing rounds, secondary transactions, or M&A
    announcements have been publicly disclosed in the 27+ months since the Series C.
