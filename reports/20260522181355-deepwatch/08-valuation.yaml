- id: TV002
  title: Thesis / anti-thesis table
  notes: >
    Each row represents one argument and the observable condition that would change the view.
    Neither the thesis nor the anti-thesis is deterministic; both require diligence confirmation.
  claimRefs:
  - CV003
  - CV007
  - CV009
  - CV015
  - CV019
  - CV022
  - CV027
  - CV028
  columns:
  - Argument
  - Type
  - What would change the view
  rows:
  - - MDR market growing at 21.95% CAGR; Deepwatch's platform is structurally positioned
    - Pro-thesis
    - Market growth slows, MDR commoditizes, or large platform players capture share
  - - NEXA agentic AI ecosystem with ISO 42001 certification may command strategic premium
    - Pro-thesis
    - ISO 42001 is management-system certification, not performance proof; NEXA accuracy unverified
  - - Recurring subscription revenue with high enterprise switching cost supports steady ARR
    - Pro-thesis
    - Confirmed post-layoff customer churn or declining NRR would reverse this
  - - Vista Credit's debt is non-dilutive; equity cap table may be cleaner than feared
    - Pro-thesis
    - Debt terms (covenants, maturity) could constrain operations or force a sale at unfavorable timing
  - - The $2.6B valuation figure is not attributable to Deepwatch; IT-Harvest estimates $1.27B–$1.72B
    - Anti-thesis
    - Independent secondary sale or financing at higher mark would validate higher figure
  - - Three CEOs in under two years indicates strategic drift at critical AI pivot
    - Anti-thesis
    - Brian Dhatt stabilizes leadership; retention KPIs hold post-layoff
  - - November 2025 layoff of 60–80 (~30% of workforce) targeted analyst and operations roles central to MDR delivery
    - Anti-thesis
    - NEXA AI automation demonstrably offsets analyst reduction with no SLA degradation
  - - No ARR, retention, or profitability data is publicly available; all valuation is by analogy
    - Anti-thesis
    - Company discloses audited metrics confirming $100M+ ARR and NRR > 110%

