    finding: >
      Tracxn shows two active US legal entities: "Deepwatch inc" (CIN: 38-4056947, incorporated
      December 31, 2014) and "DEEPWATCH, INC." (same CIN, active, 280 employees as of Dec 31,
      2024). These are registry/company-database records, not SEC filings or state-issued
      certificates. Florida Division of Corporations registry (dos.fl.gov/sunbiz/) is the public
      search portal for any Florida entity registration, but no Deepwatch-specific filing was
      returned in a live search.
    sourceRefs: [SV004, SV029]
    targets:
    - contentRequirements/2
    - plannedTables/final-diligence-asks-table

  - id: QV016
    type: quantification
    question: "What EBITDA multiple would apply if Deepwatch were acquired by a strategic buyer vs. a PE sponsor?"
    status: partial
    finding: >
      Without disclosed EBITDA, direct EBITDA-multiple analysis is not possible. Solganick cites
      ~20x EBITDA for top MSSP platforms in strategic processes; Finro's mid-2025 data indicates
      8x–14x EBITDA for quality assets. A strategic acquirer (e.g., CrowdStrike, Palo Alto,
      ServiceNow) would likely pay at the high end for distribution and customer overlap,
      while a PE sponsor would anchor closer to 8x–10x EBITDA with EBITDA confirmable only
      through diligence.
    sourceRefs: [SV012, SV010, SV016]
    targets:
    - contentRequirements/4
    - plannedTables/bull-base-bear-scenario-table

  - id: QV017
    type: comparison
    question: "How does Deepwatch's IPO readiness compare to cybersecurity IPO candidates like Arctic Wolf and Abnormal Security?"
    status: answered
    finding: >
      Strategy of Security's 2026 IPO pipeline analysis cites candidates with $400M+ ARR, high
      growth, and AI differentiation as viable. Arctic Wolf reportedly targets $300M+ ARR;
      Abnormal Security raised Series D at $5.1B with $250M disclosed. Deepwatch at $91M–$113M
      estimated revenue is well below IPO threshold and is not named in the 2026 IPO pipeline
      by any source fetched.
    sourceRefs: [SV019, SV017]
    targets:
    - contentRequirements/5
    - plannedTables/thesis-break-and-kill-triggers-table

  - id: QV018
    type: verification
    question: "What exit options are available to Vista Credit Partners for its Deepwatch position?"
    status: partial
    finding: >
      Vista Credit holds a credit/debt position (not pure equity). Exit options include loan
      repayment (at Deepwatch's option if refinanced or acquired), sale of the credit instrument
      to another lender, conversion to equity (if warrants were included—undisclosed), or
      acceleration/workout in a default scenario. Vista Credit's continuation vehicle approach
      (Cloud Software Group, $5.6B) signals flexibility on timeline, but credit instruments
      have defined maturity dates unlike equity.
    sourceRefs: [SV021, SV022, SV020]
    targets:
    - contentRequirements/5
    - plannedTables/thesis-break-and-kill-triggers-table

  - id: QV019
    type: verification
    question: "What is the MDR market size and growth rate, and how does it support valuation premiums?"
    status: answered
    finding: >
      Mordor Intelligence places the global MDR market at $4.19B in 2025, growing at 21.95% CAGR
      to $11.30B by 2030. This positions MDR among the fastest-growing cybersecurity sub-sectors,
      consistent with a premium multiple for high-growth players. Windsor Drake's Q4 2025 report
      notes that AI-driven MDR platforms are explicitly named among top acquisition targets.
    sourceRefs: [SV018, SV011, SV017]
    targets:
    - contentRequirements/1
    - plannedTables/thesis-anti-thesis-table

  - id: QV020
    type: comparison
    question: "How does cybersecurity M&A activity in 2025 compare to historical norms?"
    status: answered
    finding: >
      SecurityWeek tracked 426 deals in 2025 (up 5% from 2024; total disclosed value $92.5B, up
      ~82% YoY). Google–Wiz ($32B) and Palo Alto–CyberArk ($25B) drove headline value. MSSP
      sector logged 125 deals. Windsor Drake notes strategic buyers dominated 60%+ of deal volume.
      This is a structurally favorable exit environment for MDR assets.
    sourceRefs: [SV016, SV011, SV017]
    targets:
    - contentRequirements/4
    - plannedTables/comparable-valuation-table

  - id: QV021
    type: adverse
    question: "What valuation impairment risk exists from Deepwatch's continued financial opacity?"
    status: answered
    finding: >
      Financial opacity imposes an "opacity discount" in private M&A: buyers underprice to
      account for unknown liabilities. Finro and Windsor Drake both note that private MSSP buyers
      in 2025 focused on recurring revenue predictability and scalability; opacity on ARR, NRR,
      and EBITDA directly reduces acquirer confidence and compresses achievable multiples.
      Without diligence access, the gap between IT-Harvest's estimate and a buyer's own model
      could produce a 20–40% valuation gap.
    sourceRefs: [SV010, SV011, SV006]
    targets:
    - contentRequirements/1
    - plannedTables/thesis-anti-thesis-table

  - id: QV022
    type: quantification
    question: "What probability-weighted valuation range can be derived from the three scenarios?"
    status: answered
    finding: >
      Assigning tentative probabilities (bull 20%, base 50%, bear 30%): probability-weighted EV
      ≈ (0.20 × $1.50B) + (0.50 × $865M) + (0.30 × $390M) = $300M + $433M + $117M = $850M.
      This is broadly consistent with the IT-Harvest lower bound and suggests the base case
      anchors the probability-weighted estimate near $850M–$900M.
    sourceRefs: [SV003, SV010, SV011]
    targets:
    - contentRequirements/3
    - plannedTables/bull-base-bear-scenario-table

  - id: QV023
    type: verification
    question: "What is Deepwatch's current regulatory and financial disclosure posture?"
    status: answered
    finding: >
      Deepwatch is a privately held company with no SEC reporting obligation (the Vista Credit BDC
      is a separate entity). It has not disclosed any financial data in press releases, investor
      communications, or third-party filings accessible without subscription. SOC 2 Type 2 and
      ISO 42001 certifications are the only independently verified operational disclosures.
    sourceRefs: [SV001, SV005, SV006, SV020]
    targets:
    - contentRequirements/2
    - plannedTables/final-diligence-asks-table

  - id: QV024
    type: adverse
    question: "What operational indicators signal adverse valuation trends for Deepwatch?"
    status: answered
    finding: >
      Per IT-Harvest data cited by BankInfoSecurity: headcount declined 19% in 2024 and 9% in 2025
      before the November layoffs. 94% of employees are US-based and 80%+ are focused on
      engineering/IT—an unusual concentration signaling under-investment in sales and customer
      success. Three CEO changes in under two years compound the signal of strategic instability.
    sourceRefs: [SV003, SV023]
    targets:
    - contentRequirements/1
    - plannedTables/thesis-break-and-kill-triggers-table

  - id: QV025
    type: quantification
    question: "Under what assumptions would the IT-Harvest valuation estimate of $1.27B–$1.72B be justified?"
    status: answered
    finding: >
      IT-Harvest's band implies a 14x–19x revenue multiple on $91M. This multiple is in the
      "high-growth" sector range (Houlihan Lokey median 15.5x). For it to be justified, Deepwatch
      would need: NRR >110%, ARR growth >20%, visible NEXA AI differentiation, and/or a strategic
      acquirer's bid. None of these conditions can be verified from public sources alone.
    sourceRefs: [SV003, SV011, SV015]
    targets:
    - contentRequirements/3
    - plannedTables/comparable-valuation-table

  - id: QV026
    type: comparison
    question: "How do Vista Equity Partners' recent exit patterns affect Deepwatch's exit timeline?"
    status: answered
    finding: >
      Vista raised a $5.6B continuation vehicle for Cloud Software Group in July 2025 to extend
      the holding period rather than exit. Private Equity Wire reported Vista expanding into debt
      underwriting to generate fee income amid a PE exit slowdown. This pattern suggests Vista
      Credit's Deepwatch position may similarly be extended rather than forced to an early exit,
      reducing fire-sale risk but also removing time pressure that could accelerate a liquidity
      event for equity holders.
    sourceRefs: [SV021, SV022]
    targets:
    - contentRequirements/5
    - plannedTables/thesis-break-and-kill-triggers-table

  - id: QV027
    type: verification
    question: "Is there any secondary market evidence, cap table data, or independent valuation mark for Deepwatch?"
    status: answered
    finding: >
      No secondary market transaction, cap table filing, or independent valuation mark for
      Deepwatch has been found in any publicly accessible source. PitchBook's post-money
      valuation is paywalled. Tracxn, CB Insights, and ZoomInfo all decline to publish a
      specific figure. There is no evidence of any Regulation CF or Regulation A+ filing,
      state blue-sky registration, or Form D amendment that would disclose valuation terms.
    sourceRefs: [SV005, SV006, SV004, SV009]
    targets:
    - contentRequirements/2
    - plannedTables/final-diligence-asks-table

  - id: QV028
    type: enumeration
    question: What distinct cybersecurity sector valuation benchmarks are available for MDR or MSSP vendors from 
      independent analyst sources?
    status: answered
    finding: >
      Finro mid-2025 (250+ companies, MDR niche), Windsor Drake Q4 2025 (Houlihan Lokey Q2 2025 benchmarks: 15.5x/4.7x/2.6x
      by growth tier), Solganick MSSP M&A 2025 (~20x EBITDA for top platforms), SecurityWeek 2025 ($92.5B value, 426 deals),
      and multiples.vc public comps (Rapid7 0.9x, SentinelOne 3.5x, PANW 18x, CrowdStrike 18.6x) form the complete enumerable
      set of independent analyst benchmarks.
    sourceRefs:
    - SV010
    - SV011
    - SV012
    - SV013
    - SV014
    - SV015
    - SV016
    targets:
    - contentRequirements/3
  - id: QV029
    type: mechanism
    question: What mechanism connects Vista Credit Partners non-dilutive debt to Deepwatch equity value and potential 
      exit constraints?
    status: answered
    finding: >
      Vista Credit Partners provided non-dilutive strategic financing (per Series C press release), meaning debt service does
      not dilute the equity cap table but does create cash flow obligations. Vista Credit Strategic Lending Corp's 10-Q (Q2
      2025) confirms Level 3 fair value classification for private portfolio investments. A buyer in an M&A scenario would
      need to retire or refinance the credit facility, reducing equity proceeds by the outstanding principal plus any make-whole
      premiums. The undisclosed terms prevent quantification of this mechanism, but the direction (EV-positive, equity-negative)
      is clear.
    sourceRefs:
    - SV001
    - SV020
    - SV022
    targets:
    - contentRequirements/2
  - id: QV030
    type: freshness
    question: How current is the IT-Harvest $91M revenue and $1.27B–$1.72B valuation estimate for Deepwatch, and what 
      refresh cycle applies?
    status: answered
    finding: >
      The IT-Harvest estimate was reported by BankInfoSecurity in November 2025, approximately 6 months before the chapter
      run date of May 2026. IT-Harvest uses workforce signal analysis and sector comps rather than audited financials; estimates
      can shift materially between cycles. The 19% (2024) and 9% (2025) headcount declines reported in the same article suggest
      the revenue trajectory may be flat or declining. The estimate should be treated as moderately stale and given a 15–20%
      uncertainty margin.
    sourceRefs:
    - SV003
    - SV008
    - SV007
    targets:
    - contentRequirements/3
  evidenceGaps:
  - id: EGV001
    type: private-evidence-only
    severity: blocking
    topic: Post-money Series C valuation not publicly disclosed
    missingEvidence: >
      Confirmed post-money valuation for the February 2023 Series C from Deepwatch, its investors,
      or a data platform with verified access to deal terms.
    whyItMatters: >
      Without a confirmed valuation anchor, all estimates are derived by analogy and carry a
      20–40% uncertainty band. The unsupported $2.6B figure in circulation risks anchoring
      investment decisions at a level approximately 1.5x–2x the most defensible public estimate.
    diligencePath: >
      Request the Series C term sheet or investor rights agreement under NDA; crosscheck against
      Springcoast Capital's fund performance report or ABS Capital investor filings.
    relatedQuestionRefs:
    - QV003
    - QV013
    relatedTableRefs:
    - TV001

  - id: EGV002
    type: missing-source
    severity: blocking
    topic: ARR, revenue growth rate, and retention metrics not disclosed
    missingEvidence: >
      Audited or management-certified ARR schedule, annual revenue for FY2023–FY2025, and
      dollar-weighted GRR/NRR for the same period.
    whyItMatters: >
      Revenue level and growth rate are the primary drivers of any revenue-multiple valuation.
      IT-Harvest's $91M estimate is unverified. The difference between $91M growing at 5% and
      $91M growing at 25% changes the applicable multiple range from 4.7x to 15.5x—a 3x spread.
    diligencePath: >
      Request ARR schedule, bookings data, and cohort NRR from Deepwatch finance under NDA.
      Reconcile against IT-Harvest, Growjo, and IncFact estimates.
    relatedQuestionRefs:
    - QV001
    - QV004
    - QV022
    relatedTableRefs:
    - TV006

  - id: EGV003
    type: missing-source
    severity: blocking
    topic: Vista Credit debt terms, principal, and covenants undisclosed
    missingEvidence: >
      Interest rate, principal balance, maturity date, financial covenants, and any equity kickers
      (warrants) associated with the Vista Credit Partners credit facility.
    whyItMatters: >
      Debt service obligations reduce free cash flow available to equity; covenants could restrict
      M&A or IPO options; equity warrants could dilute cap table. Without this information, equity
      value cannot be estimated even if EV is known.
    diligencePath: >
      Request credit agreement, amendments, and compliance certificates from Deepwatch CFO and
      Vista Credit Partners' portfolio management under NDA.
    relatedQuestionRefs:
