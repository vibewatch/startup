      EBITDA and adjusted EBITDA for FY2024 and FY2025; operating cash flow and burn rate.
    whyItMatters: >
      EBITDA multiples (8x–20x cited for MSSP acquisitions) cannot be applied without a
      confirmed EBITDA figure. Also required to assess debt-service coverage on Vista Credit
      facility and runway adequacy without new capital.
