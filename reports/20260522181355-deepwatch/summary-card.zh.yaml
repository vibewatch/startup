  shortDescription: |
    Deepwatch is a private AI-driven managed detection and response (MDR) company offering the
    Guardian MDR Platform and NEXA Agentic AI Ecosystem as an autonomous SOC-as-a-service.
    Formally incorporated in late 2018 with operational roots in 2016; $256M total funding;
    100% channel-only distribution; relocated headquarters from Tampa, FL to Palo Alto, CA in
    June 2025; acquired Dassana (CTEM) in February 2025; and entered a period of leadership
    and workforce transition as of the run date.
