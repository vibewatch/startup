  - id: EGR007
    type: private-evidence-only
    severity: material
    topic: SOC 2 Type 2 scope report not publicly available
    missingEvidence: >
      Full SOC 2 Type 2 report including service commitments, system descriptions, test
      procedures, and any qualified opinions or exceptions.
    whyItMatters: >
      SOC 2 Type 2 scope and any exceptions are critical inputs for enterprise procurement
      decisions. Without reviewing the full report, the investor cannot determine whether
      NEXA AI, CTEM, or government customer data processing are within scope.
