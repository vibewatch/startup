- id: regulatory-legal
  title: Regulatory, Legal, and Privacy Exposure
  body: >
    Deepwatch operates in a sector facing escalating regulatory pressure from multiple directions.
    CMMC Phase 1 enforcement became effective November 10, 2025, requiring defense contractors
    and their supply chain to demonstrate compliance with NIST SP 800-171 controls. Deepwatch
    distributes its platform through Carahsoft to named government-adjacent customers including
    Clark County School District, Dallas ISD, Fairfax County, and Frisco ISD. However,
    Deepwatch has not publicly disclosed FedRAMP authorization for any cloud service offering.
    For managed security service providers serving defense contractors, FedRAMP Moderate
    authorization is increasingly expected under CMMC. The absence of any public FedRAMP
    listing on marketplace.fedramp.gov is a material diligence gap for any investor evaluating
    federal and SLED revenue potential.

    On the privacy front, revised CCPA regulations took effect January 1, 2026, including a new
    requirement that businesses honor Global Privacy Control (GPC) signals as valid opt-out of
    personal information sale and sharing. Greenberg Traurig's analysis confirms that covered
    businesses must update data-flow mapping, honor GPC signals automatically, and update privacy
    notices. Deepwatch's May 1, 2026 privacy policy carves out "customer data"—data processed
    on behalf of customers under service agreements—from individual data subject rights (access,
    deletion, correction). This carve-out is standard in B2B SaaS contracts, but it concentrates
    privacy compliance obligation on Deepwatch's enterprise customers, creating potential contract
    disputes if GDPR or CCPA data subject requests are routed to Deepwatch rather than the data
    controller. The NIS2 Directive (effective October 2024 across EU member states) imposes
    similar obligations on Deepwatch's European customers. SEC cybersecurity disclosure rules
    (2023) require Deepwatch's public-company customers to disclose material cyber incidents,
    creating pressure on Deepwatch to deliver rapid, documented incident response. No enforcement
    action, regulatory citation, or material complaint against Deepwatch has been identified.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  tableRefs:
  - TR001
  figureRefs: []

- id: operational-platform
  title: Operational and Platform Concentration Risk
  body: >
    Deepwatch's Trust page explicitly states that its cloud infrastructure is hosted exclusively
    on Amazon Web Services (AWS). While AWS offers industry-leading uptime SLAs and multiple
    availability zones, single-cloud dependency means that an AWS outage, configuration error,
    or security incident could suspend 24/7 MDR coverage simultaneously for all customers—the
    worst-case scenario for an MDR provider whose core promise is continuous detection and
    response. Deepwatch holds AWS Level 1 MSSP Competency and leverages AWS-native tooling,
    which deepens the integration but also deepens the lock-in. No multi-cloud failover or
    cloud-agnostic architecture has been documented publicly.

    CrowdStrike dependency is equally significant. In September 2024, Deepwatch launched five
    MDR modules co-developed with CrowdStrike Falcon, making Falcon the underlying EDR telemetry
    layer for a substantial subset of its managed detection offering. The July 2024 CrowdStrike
    Falcon sensor outage demonstrates that hyperscale EDR vendors are not immune to catastrophic
    failure; Deepwatch's MDR fidelity for Falcon-based customers would be directly impaired in
    an analogous event. Splunk remains the dominant SIEM in Deepwatch's customer install base;
    while Deepwatch now supports Sentinel, Google SecOps, and Securonix, the majority of case
    studies reference Splunk environments. The February 2025 acquisition of Dassana introduced
    CTEM capability but also integration risk: the Dassana team and codebase must be absorbed
    into the NEXA AI ecosystem while simultaneously shipping commercial CTEM offerings. No
    production CTEM customer case study has been publicly identified post-acquisition.
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
