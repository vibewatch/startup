- id: financial-opacity
  title: Financial Opacity and Investment Risk
  body: >
    Deepwatch is a private company with no obligation to disclose financial metrics. As of the
    run date, no ARR, revenue, gross margin, EBITDA, customer count, GRR, NRR, NPS, or churn
    figure has been publicly released. The company raised $180M in February 2023 from Francisco
    Partners, Vista Credit Partners, and ABS Capital. No subsequent fundraising, secondary sale,
    or IPO pathway has been publicly disclosed. Revenue estimates from aggregators such as Growjo
    (~$113–114M ARR) are derived from employee count and engagement proxies rather than verified
    financials and should be treated as unverified directional signals only.

    The complete absence of retention metrics is particularly material in the context of the
    November 2025 layoffs. A workforce reduction of this magnitude in analyst and operations
    roles—combined with the simultaneous CEO transition—creates conditions under which customers
    may evaluate renewal options. Without GRR, NRR, or cohort data, the investor cannot
    independently assess whether customer durability is holding. The $180M Series C implies a
    valuation in the hundreds of millions at the time of the raise, but no post-round update has
    been issued. If Growjo's estimate is directionally correct and growth has continued, Deepwatch
    could be approaching profitability or a liquidity event; but the opacity is total and
    diligence under NDA is the only path to resolution.
  claimRefs:
