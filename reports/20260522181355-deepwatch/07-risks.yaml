  - id: EGR008
    type: missing-source
    severity: minor
    topic: Absence of lawsuits and enforcement actions not independently confirmed by legal database search
    missingEvidence: >
      Independent legal database search (PACER, state court records, FTC, state AG) for
      any litigation, regulatory citation, or enforcement action against Deepwatch or its
      subsidiaries.
    whyItMatters: >
      Public web search cannot definitively confirm the absence of litigation; only a formal
      legal database search can rule out undisclosed proceedings.
    diligencePath: >
      Commission a litigation search through PACER and major state court databases for
      Deepwatch Inc. and the Dassana LLC entities.
