    - QR004
    - QR007
    - QR014
    - QR017
    - QR020
    relatedTableRefs:
    - TR004

  - id: EGR003
    type: missing-source
    severity: material
    topic: Financial metrics (ARR, GRR, NRR, churn) not disclosed
    missingEvidence: >
      Audited ARR, gross revenue retention, net revenue retention, dollar-weighted churn,
      EBITDA, and cash flow data for FY2024 and FY2025.
    whyItMatters: >
      Total financial opacity prevents valuation anchoring and makes the $180M Series C
      valuation impossible to assess relative to current performance. Growjo's estimate is
      unverified and may be stale.
    diligencePath: >
