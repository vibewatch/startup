- id: reputational-thesis
  title: Reputational Risk, AI Governance, and Thesis-Break Scenarios
  body: >
    Deepwatch's reputational risk profile has deteriorated modestly in the twelve months
    preceding the run date. The November 2025 layoffs generated adverse coverage across at
    least seven technology and cybersecurity news outlets, with TechCrunch (the highest-reach
    outlet) reporting an anonymous executive quote calling the prior strategy "bullshit"—a
    statement that, if attributed, would damage enterprise buyer confidence. Gartner Peer
    Insights carries at least one adverse review from January 2026 that references service
    disruption following the layoffs. No named customer termination, public regulatory
    complaint, or litigation has been identified; however, the absence of evidence is partly
    a function of the private information environment.

    AI governance is an emerging risk vector. Deepwatch achieved ISO/IEC 42001 certification
    for its NEXA agentic AI ecosystem on May 21, 2026—the first MDR company to do so, per the
    company's own press release. ISO 42001 is a management-system standard for AI governance
    (processes, accountability, risk monitoring) but does not guarantee algorithm accuracy,
    explainability, or hallucination-free outputs. If NEXA generates a false-negative (missed
    threat) or false-positive (incorrect escalation) at a customer that leads to a material
    breach or operational disruption, Deepwatch faces both reputational and potential contractual
    liability. No published explainability documentation for NEXA's triage logic has been
    identified. The thesis-break scenario is a combination of continued executive turnover,
    proof that layoffs degraded SLA attainment, and a high-profile customer breach attributed
    to a NEXA AI failure. These are independent risks; the convergence of two or more would be
    a material adverse signal for the investment thesis.
