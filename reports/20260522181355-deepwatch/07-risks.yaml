  - id: EGR006
    type: missing-source
    severity: material
    topic: NIS2 compliance posture for EU customers not documented
    missingEvidence: >
      NIS2 applicability assessment for Deepwatch as a critical sub-supplier to EU entities,
      and any contractual NIS2 compliance commitments in EU customer contracts.
    whyItMatters: >
      NIS2 imposes supply-chain security obligations on EU critical entity customers. Without
      public NIS2 documentation, EU-based prospects cannot assess compliance fit, potentially
      limiting European market expansion.
    diligencePath: >
      Request NIS2 applicability analysis, EU customer DPA templates, and any Article 21
      compliance documentation under NDA.
