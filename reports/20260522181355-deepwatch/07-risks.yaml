    missingEvidence: >
      Published precision/recall metrics, false-negative rates, and explainability
      documentation for NEXA's agentic AI triage logic.
    whyItMatters: >
      ISO 42001 governs management-system process, not algorithmic accuracy. Without
      documented detection performance metrics, the investor cannot assess whether NEXA
      genuinely offsets reduced analyst headcount or introduces unquantified AI failure risk.
    diligencePath: >
      Request NEXA AI performance benchmarks, false-negative/false-positive rates,
