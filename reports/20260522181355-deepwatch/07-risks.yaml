company:
  name: Deepwatch
chapter:
  number: 7
  title: Risks
  summary: >
    Deepwatch's risk profile combines leadership instability, regulatory exposure, operational
    concentration, and financial opacity into a layered threat posture that warrants deep diligence.
    Three CEOs in under two years—Scott Thomas, John DiLullo (July 2024), and Brian Dhatt (May 4,
    2026)—signal strategic drift at a critical growth juncture, compounded by the November 2025
    layoff of 60–80 employees (~25–30% of a ~250-person workforce) that directly targeted the
    analyst and operations roles central to Deepwatch's human-intensive MDR value proposition.
    On the regulatory front, CMMC Phase 1 enforcement began November 10, 2025, and Deepwatch
    has not publicly disclosed FedRAMP authorization, creating a gap for the government-adjacent
    customer base distributed through Carahsoft. The January 1, 2026 CCPA regulations
    (including mandatory Global Privacy Control opt-out) add compliance friction; Deepwatch's
    updated privacy policy carves customer data out of individual data subject rights entirely.
    Operationally, single-cloud AWS hosting, CrowdStrike module concentration across five MDR
    offerings, and an unproven Dassana CTEM integration compound service-continuity risk.
    Financial opacity is total—no ARR, churn, or retention metrics are disclosed—leaving
    investors reliant on unverified aggregator estimates (~$113M). No public lawsuits,
    regulatory enforcement actions, or material data breaches have been identified; this
    absence is itself an evidence limitation, not a clean bill of health.

sections:
- id: leadership-churn
  title: People, Leadership, and Workforce Execution Risk
  body: >
    Deepwatch has cycled through three CEOs in fewer than two years, a rate of executive
    turnover that is unusual even by private-equity-backed SaaS standards. Scott Thomas
    led the company through its Series C and initial scaling phase. John DiLullo was named
    CEO in July 2024, framed as a pivot toward enterprise GTM acceleration; his tenure lasted
    under a year. Brian Dhatt—previously CTO of DigitalOcean and VP Engineering at Okta—was
    appointed CEO on May 4, 2026, with the announcement positioning the transition as a shift
    toward "scaled autonomous SOC" and AI-led delivery. Dhatt's background is engineering-heavy,
    consistent with the NEXA agentic-AI roadmap, but represents a departure from the
    GTM-oriented profile DiLullo brought.

    The most operationally significant risk is the November 2025 workforce reduction of 60–80
    employees, representing approximately 25–30% of Deepwatch's roughly 250-person workforce.
    TechCrunch reported the layoff targeted analyst and operations roles—the very functions that
    underpin Deepwatch's differentiated "named analyst squad" delivery model. The stated rationale
    was to redirect capital toward AI investment, but an adversely-toned Gartner Peer Insights
    review from January 2026 alleged internal service disruptions following the reduction. No
    public SLA breach, named customer loss, or analyst attrition disclosure has been identified,
    but the structural exposure is real: Deepwatch sells continuous human-plus-AI security
    operations, and any degradation in the human layer is directly customer-visible. Investors
    must validate post-layoff analyst-to-customer ratios and SLA attainment rates in diligence.
