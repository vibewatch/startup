    missingEvidence: >
      Commercial GA date, production customer case study, and integration completion report
      for the Dassana CTEM module within the NEXA AI ecosystem.
    whyItMatters: >
      The Dassana acquisition is the primary product expansion claim in 2025. Without evidence
      of commercial launch or customer adoption, the CTEM revenue contribution thesis cannot
      be verified.
