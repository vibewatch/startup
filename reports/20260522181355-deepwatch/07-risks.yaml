callouts:
- type: risk
  title: Three CEOs in Under Two Years
  body: >
    From Scott Thomas to John DiLullo (July 2024) to Brian Dhatt (May 2026), Deepwatch has
    averaged one CEO per year. This is the single most visible adverse signal in the public
    record. Dhatt's engineering-heavy background (DigitalOcean CTO, Okta VP Engineering) may
    accelerate the NEXA AI roadmap but creates an unproven GTM profile at a critical growth
    inflection. Investors should demand board-level explanation of each transition and a current
    ARR trajectory under Dhatt before committing capital.
  claimRefs:
  - CR001
  - CR002
  - CR009
- type: risk
  title: FedRAMP Silence Is a Material Gap
  body: >
    Deepwatch distributes to government-adjacent SLED customers through Carahsoft but has no
    public FedRAMP listing. With CMMC Phase 1 enforcement effective November 2025, managed
    security providers serving defense contractors face increasing pressure to hold or be
    on-path-to federal cloud authorizations. The absence of any In-Process listing on
    marketplace.fedramp.gov as of May 2026 is a blocking diligence item for any investor
    modeling federal or defense-adjacent revenue growth.
  claimRefs:
  - CR011
  - CR012
- type: strength
  title: ISO 42001 as Differentiated AI Governance Signal
  body: >
    Deepwatch achieved ISO/IEC 42001 certification for the NEXA agentic AI ecosystem on
    May 21, 2026—reportedly the first MDR company to do so. This is a genuine differentiator
    in enterprise sales cycles where CISOs increasingly require documented AI governance before
    deploying AI-assisted triage. ISO 42001 establishes management-system oversight (not
    algorithm certification), but it is a credible, third-party-audited signal that Deepwatch
    takes AI governance seriously.
  claimRefs:
  - CR027
  - CR040

