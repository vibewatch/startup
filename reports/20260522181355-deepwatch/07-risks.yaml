  researchQuestions:
  - id: QR001
    type: verification
    question: "Has Deepwatch disclosed its FedRAMP authorization status anywhere in official or third-party sources, and does it appear on marketplace.fedramp.gov?"
    status: answered
    finding: >
      No. As of May 2026, Deepwatch does not appear on marketplace.fedramp.gov (neither
      Authorized nor In-Process). Deepwatch's privacy policy makes no mention of FedRAMP,
      CUI, or DoD Impact Level authorization.
    sourceRefs: [SR014, SR002]
    targets:
    - contentRequirements/1
    - plannedTables/regulatory-legal-risk-register

  - id: QR002
    type: verification
    question: "Can Deepwatch's three CEO appointments since 2024 be independently verified with official announcement dates and sources?"
    status: answered
    finding: >
      Yes. John DiLullo appointment: July 2024 per BusinessWire (SR020) and official
      Deepwatch PR (SR016). Brian Dhatt appointment: May 4, 2026 per Deepwatch PR (SR007)
      and Security Boulevard (SR008). Scott Thomas's departure is inferred from DiLullo's
      appointment; no explicit Thomas departure press release found.
    sourceRefs: [SR007, SR008, SR016, SR020]
    targets:
    - contentRequirements/0
    - plannedTables/people-execution-risk-register

  - id: QR003
    type: verification
    question: "Does Deepwatch's privacy policy explicitly carve out customer data from individual data subject rights such as access, deletion, and correction?"
    status: answered
    finding: >
      Yes. The May 1, 2026 privacy policy states that Customer Data is excluded from the
      policy's scope. Data processed on behalf of enterprise customers under service agreements
      is not subject to individual consumer DSR handling by Deepwatch directly.
    sourceRefs: [SR002]
    targets:
    - contentRequirements/1

  - id: QR004
    type: adverse
    question: "What service continuity risks arose from the November 2025 layoff of 60-80 employees, and is there evidence of actual SLA degradation or customer loss?"
    status: partial
    finding: >
      TechCrunch, BankInfoSecurity, SC World, and four additional outlets confirm the
      60-80 layoff figure. TechCrunch confirms analyst and operations roles were targeted.
      A January 2026 Gartner review references service disruption. No named customer loss
      or public SLA breach identified—absence of evidence, not confirmed continuity.
      Analyst-to-customer ratio post-layoff is undisclosed.
    sourceRefs: [SR009, SR019, SR003, SR004, SR026]
    targets:
    - contentRequirements/2
    - plannedTables/operational-quality-security-risk-register

  - id: QR005
    type: adverse
    question: "What is the risk to Deepwatch customers if AWS experiences a major outage, given Deepwatch's single-cloud hosting dependency?"
    status: answered
    finding: >
      Deepwatch's Trust Center confirms exclusive AWS hosting. A major AWS multi-AZ outage
      would suspend 24/7 MDR coverage for all customers simultaneously—the worst-case
      failure mode for an MDR provider. The July 2024 CrowdStrike global outage validates
      this class of hyperscale vendor failure risk as real.
    sourceRefs: [SR001, SR010]
    targets:
    - contentRequirements/2
    - plannedTables/operational-quality-security-risk-register

  - id: QR006
    type: adverse
    question: "What regulatory penalties could Deepwatch's MDR clients face if CMMC compliance is inadequate, and does Deepwatch's non-FedRAMP status create contractor disqualification risk?"
    status: answered
    finding: >
      CMMC Phase 1 (effective Nov 10, 2025) can result in contract termination and False
      Claims Act exposure for defense contractors with inadequate security practices. If
      Deepwatch's MDR offering is not FedRAMP-authorized, defense contractor customers
      may face compliance gaps when using Deepwatch as part of their CMMC supply chain.
    sourceRefs: [SR006, SR012, SR013, SR014]
    targets:
    - contentRequirements/1
    - plannedTables/regulatory-legal-risk-register

  - id: QR007
    type: quantification
    question: "What percentage of Deepwatch's workforce was eliminated in the November 2025 layoffs, and what is the best estimate of post-layoff headcount?"
    status: answered
    finding: >
      TechCrunch reported 60-80 employees out of approximately 250 total, equating to 24-32%
      of the workforce. Post-layoff headcount is estimated at 170-190. Analyst and operations
      roles were disproportionately targeted; the engineering and product organization was
      reportedly preserved for the NEXA AI roadmap.
    sourceRefs: [SR009, SR007]
    targets:
    - contentRequirements/2
    - plannedTables/people-execution-risk-register

  - id: QR008
    type: quantification
    question: "How many MDR modules depend primarily on CrowdStrike Falcon as the underlying EDR platform?"
    status: answered
    finding: >
      Deepwatch announced five co-developed MDR modules with CrowdStrike in September 2024.
      These five modules use Falcon as the primary EDR telemetry layer. Customers not using
      CrowdStrike Falcon are unaffected; the exposure is proportional to CrowdStrike's share
      of Deepwatch's customer EDR install base, which is undisclosed.
    sourceRefs: [SR021, SR020]
    targets:
    - contentRequirements/3
    - plannedTables/partner-dependency-risk-register

  - id: QR009
    type: quantification
    question: "What is Deepwatch's estimated annual recurring revenue and what is the basis for that estimate?"
    status: answered
    finding: >
      Growjo estimates approximately $113-114M ARR based on employee count and engagement
      proxies—an unverified figure. No other independent ARR estimate with documented
      methodology has been identified. Deepwatch has not disclosed revenue in any public filing.
    sourceRefs: [SR023]
    targets:
    - contentRequirements/4

  - id: QR010
    type: quantification
    question: "What share of Deepwatch's customer base consists of CMMC-regulated defense contractors or SLED entities with federal compliance requirements?"
    status: answered
    finding: >
      Carahsoft confirms named SLED procurement relationships with Clark County SD, Dallas ISD,
      Fairfax County, and Frisco ISD. No total SLED or defense-adjacent customer count or ARR
      share is disclosed. The government-adjacent customer mix is directionally real but
      quantitatively unknown.
    sourceRefs: [SR017]
    targets:
    - contentRequirements/1
    - plannedTables/regulatory-legal-risk-register

  - id: QR011
    type: mechanism
    question: "By what mechanism does AWS single-cloud dependency create MDR service continuity risk?"
    status: answered
    finding: >
      All Deepwatch data processing, detection logic, NEXA AI inference, and customer portal
      access run on AWS infrastructure. An AWS outage above availability zone scope would
      simultaneously disable all of these components, suspending 24/7 MDR coverage with no
      backup pathway. Unlike on-premise SIEM deployments, cloud-native MDR has no local fallback.
    sourceRefs: [SR001, SR025]
    targets:
    - contentRequirements/2
    - plannedTables/operational-quality-security-risk-register

  - id: QR012
    type: mechanism
    question: "How does the customer data carve-out in Deepwatch's privacy policy create compliance risk for customers?"
    status: answered
    finding: >
      By carving out customer data from DSR rights at Deepwatch, the policy directs individual
      data subjects to contact the enterprise customer directly. If the enterprise customer is
      not prepared to handle these requests—or if Deepwatch's data processing creates CCPA or
      GDPR obligations for the customer—the carve-out may be insufficient without comprehensive
      DPAs and sub-processor disclosures, creating contract and regulatory disputes.
    sourceRefs: [SR002, SR015]
    targets:
    - contentRequirements/1

  - id: QR013
    type: mechanism
    question: "Through what process does CrowdStrike Falcon dependency translate into MDR service quality risk?"
    status: answered
    finding: >
      The five co-developed MDR modules ingest CrowdStrike Falcon telemetry as their primary
      detection data source. If Falcon fails, is misconfigured, or suffers a sensor outage
      (as occurred globally in July 2024), the detection fidelity of those five modules degrades
      to zero until the sensor is restored, creating a window of undetected attacker activity.
    sourceRefs: [SR020, SR021, SR009]
    targets:
    - contentRequirements/3
    - plannedTables/partner-dependency-risk-register

  - id: QR014
    type: mechanism
    question: "How does executive instability affect Deepwatch's long-term product roadmap continuity and customer retention?"
    status: answered
    finding: >
      Each CEO transition introduces a 6-12 month integration period during which roadmap
      priorities may shift, sales leadership may turn over, and enterprise customers reassess
      renewal posture. DiLullo's GTM-led mandate differed from Dhatt's engineering-led mandate.
      The NEXA AI ecosystem direction may shift in ways not yet visible in the public record.
    sourceRefs: [SR007, SR016, SR026]
    targets:
    - contentRequirements/0
    - plannedTables/people-execution-risk-register

  - id: QR015
    type: comparison
    question: "How does Deepwatch's CMMC compliance positioning compare to Arctic Wolf, Rapid7, or other MDR peers with documented FedRAMP or CMMC credentials?"
    status: answered
    finding: >
      Rapid7 holds FedRAMP Moderate authorization for its Insight Platform. Arctic Wolf's
      FedRAMP status as of May 2026 is not confirmed in this chapter's evidence set. Deepwatch
      has no public FedRAMP listing. This gap is material for defense-contractor customers
      evaluating CMMC supply-chain compliance.
    sourceRefs: [SR006, SR014, SR012]
    targets:
    - contentRequirements/1
    - plannedTables/regulatory-legal-risk-register

  - id: QR016
    type: comparison
    question: "How does Deepwatch's privacy policy compare to those of comparable MDR peers in terms of data subject rights and customer data handling?"
    status: answered
    finding: >
      The customer-data carve-out in Deepwatch's policy is standard B2B SaaS practice.
      Arctic Wolf, Rapid7, and CrowdStrike maintain similar separation of consumer privacy
      rights from enterprise customer data processing. The diligence gap is whether adequate
      DPAs are in place for EU and California enterprise customers.
    sourceRefs: [SR002, SR015]
    targets:
    - contentRequirements/1

  - id: QR017
    type: comparison
    question: "How does CEO tenure at Deepwatch compare to tenure at other private MDR companies of similar scale such as Arctic Wolf, Expel, and Huntress?"
    status: answered
    finding: >
      Arctic Wolf's CEO Brian NeSmith has led the company since its 2018 founding. Expel's
      Dave Merkel and Huntress's Kyle Hanslovan are co-founders who continue to lead their
      respective companies. Deepwatch's three-CEO cycle in under two years is anomalous
      relative to peers at similar stage.
    sourceRefs: [SR007, SR016, SR020]
    targets:
    - contentRequirements/0
    - plannedTables/people-execution-risk-register

  - id: QR018
    type: freshness
    question: "Has Deepwatch disclosed any updated FedRAMP or CMMC compliance status since CMMC Phase 1 enforcement began on November 10, 2025?"
    status: answered
    finding: >
      No update identified. Deepwatch's Trust Center, press releases, and privacy policy as
      of May 2026 make no mention of FedRAMP authorization or CMMC compliance status. No
      In-Process FedRAMP listing is visible on marketplace.fedramp.gov.
    sourceRefs: [SR001, SR014, SR002]
    targets:
    - contentRequirements/1
    - plannedTables/regulatory-legal-risk-register

  - id: QR019
    type: freshness
    question: "Has Deepwatch published an updated privacy policy reflecting CCPA 2026 GPC requirements effective January 1, 2026?"
    status: answered
    finding: >
      Deepwatch's privacy policy was last updated effective May 1, 2026 and acknowledges
      California rights under CCPA/CPRA. Whether GPC signal-honoring has been technically
      implemented on deepwatch.com is not determinable from the policy text alone; GPC
      compliance requires web-layer implementation, not just policy language.
    sourceRefs: [SR002, SR015]
    targets:
    - contentRequirements/1

  - id: QR020
    type: freshness
    question: "What is Deepwatch's current leadership bench depth following the Brian Dhatt CEO transition in May 2026?"
    status: partial
    finding: >
      Dhatt's appointment announcement does not disclose the current executive team
      composition. The CRO, CFO, and CPO identities and tenures are unknown from public
      records. The Deepwatch leadership page was not captured in a form permitting full
      executive team reconstruction.
    sourceRefs: [SR007, SR008]
    targets:
    - contentRequirements/0
    - plannedTables/people-execution-risk-register

  - id: QR021
    type: verification
    question: "Does Deepwatch's ISO 42001 certification apply to the full Guardian MDR platform or only to the NEXA AI ecosystem component?"
    status: answered
    finding: >
      The certification scope is explicitly described as the "Deepwatch NEXA Agentic AI
      Ecosystem" in all press materials. The certification does not cover the full Guardian
      MDR platform or detection engineering more broadly—it covers the AI management
      system layer specifically.
    sourceRefs: [SR005, SR021, SR022]
    targets:
    - contentRequirements/2

  - id: QR022
    type: adverse
    question: "What is the litigation and enforcement risk if a Deepwatch NEXA AI-generated alert causes a missed breach at an enterprise customer?"
    status: answered
    finding: >
      ISO 42001 establishes management-system governance but does not limit Deepwatch's
      contractual or tort liability for AI-generated outputs. MDR service contracts typically
      include liability caps, but the scope in Deepwatch's agreements is not publicly disclosed.
      A missed breach at a publicly traded customer could trigger SEC disclosure and
      reputational damage exceeding contractual caps.
    sourceRefs: [SR005, SR022, SR026]
    targets:
    - contentRequirements/1
    - plannedTables/operational-quality-security-risk-register

  - id: QR023
    type: mechanism
    question: "How does the Dassana acquisition integration timeline interact with the November 2025 workforce reduction?"
    status: answered
    finding: >
      Dassana was acquired in February 2025; nine months later, Deepwatch executed a 25-30%
      workforce reduction targeting operations and analyst roles. If Dassana integration
      engineers were in the operations category, the layoff may have disrupted integration
      velocity. No public disclosure of Dassana team retention or integration staffing has
      been identified.
    sourceRefs: [SR024, SR009]
    targets:
    - contentRequirements/3
    - plannedTables/partner-dependency-risk-register

  - id: QR024
    type: quantification
    question: "What is Deepwatch's estimated financial runway from the February 2023 $180M raise, given available headcount and burn rate proxies?"
    status: partial
    finding: >
      At roughly 200-250 employees pre-layoff and typical enterprise SaaS burn rates for a
      growth-stage cybersecurity company, the $180M raise would support 3-5 years of runway
      (2023-2026/2028). The November 2025 workforce reduction to ~170-190 employees likely
      extended runway. Without verified revenue or burn rate data, this estimate is speculative.
    sourceRefs: [SR023, SR009]
    targets:
    - contentRequirements/4

  - id: QR025
    type: comparison
    question: "How does Deepwatch's financial opacity compare to public MDR players that report metrics, and what does it imply for valuation diligence?"
    status: answered
    finding: >
      Public comparables (CrowdStrike, Rapid7, Palo Alto Networks) report ARR and NRR
      quarterly. Private peers such as Arctic Wolf pre-IPO disclosed ARR publicly to build
      profile ahead of a liquidity event. Deepwatch's total silence on all financial metrics
      is unusual for a $180M-funded company at this stage and may signal either deliberate
      opacity or challenges that make public metrics unfavorable.
    sourceRefs: [SR023]
    targets:
    - contentRequirements/4

  - id: QR026
    type: verification
    question: "Has any regulatory body cited, fined, or investigated Deepwatch for compliance, privacy, or AI-related violations?"
    status: answered
    finding: >
      No. No regulatory citation, fine, SEC investigation, FTC action, state AG inquiry, or
      AI-specific regulatory action against Deepwatch has been identified in publicly available
      sources as of May 2026. This is an evidence limitation (private proceedings may be
      undisclosed), not a confirmed clean record.
    sourceRefs: [SR028, SR029, SR026]
    targets:
    - contentRequirements/1
    - plannedTables/regulatory-legal-risk-register

  - id: QR027
    type: freshness
    question: "What is the status of the Dassana CTEM integration as of May 2026, and has it been commercially launched with customer case studies?"
    status: partial
    finding: >
      As of May 2026, the Dassana CTEM module is referenced in Deepwatch's product documentation
      as part of the NEXA AI ecosystem but no production customer case study has been publicly
      identified for the CTEM capability post-acquisition. Commercial availability appears to
      be in early stages; GA launch timeline is undisclosed.
    sourceRefs: [SR024]
    targets:
    - contentRequirements/3
    - plannedTables/partner-dependency-risk-register

  - id: QR028
    type: mechanism
    question: "How does Deepwatch's 100% channel model create dependency concentration risk at renewal?"
    status: answered
    finding: >
      All Deepwatch customer revenue flows through Xcelerate channel partners (Silver/Gold/
      Platinum tiers), with Carahsoft as the sole identified government/SLED distributor. If
      a top-tier Platinum partner exits the program or is acquired, a significant share of ARR
      could be at risk. Deepwatch's incumbency protection (guaranteed partner margin at renewal)
      partially mitigates this, but underlying ARR concentration by partner is not disclosed.
    sourceRefs: [SR017]
    targets:
    - contentRequirements/3
    - plannedTables/partner-dependency-risk-register

  - id: QR029
    type: adverse
    question: "What is the risk that Deepwatch's NEXA agentic AI triage produces incorrect conclusions that harm customer security posture?"
    status: partial
    finding: >
      NEXA is designed to auto-triage alerts and potentially initiate automated responses.
      ISO 42001 governs the management system around this AI but does not certify the
      underlying model's accuracy. No published false-negative rate, precision/recall metrics,
      or explainability documentation for NEXA's triage logic has been identified. The risk
      is real but unquantifiable from public evidence alone.
    sourceRefs: [SR022, SR005, SR026]
    targets:
    - contentRequirements/2
    - plannedTables/operational-quality-security-risk-register

  - id: QR030
    type: quantification
    question: "What are Deepwatch's SOC 2 Type 2 scope boundaries, and which product modules are covered by the current certification?"
    status: partial
    finding: >
      trustlists.org and Deepwatch's Trust Center confirm SOC 2 Type 2 certification.
      The specific scope boundaries are not publicly disclosed. The SOC 2 report is a
      restricted document typically shared under NDA during diligence; Deepwatch's Trust
      Center offers a Request SOC 2 option.
    sourceRefs: [SR001, SR029]
    targets:
    - contentRequirements/1
    - plannedTables/regulatory-legal-risk-register

  evidenceGaps:
  - id: EGR001
    type: missing-source
    severity: blocking
    topic: FedRAMP authorization status undisclosed
    missingEvidence: >
      FedRAMP ATO documentation, In-Process listing, or written exception rationale covering
      Deepwatch's cloud services for CMMC-regulated and federal/SLED customer deployments.
    whyItMatters: >
      Without FedRAMP authorization, Deepwatch cannot be used by customers subject to federal
      cloud security requirements, and its SLED customer base distributed through Carahsoft
      faces growing compliance friction under CMMC. This is a blocking diligence item for any
      federal or SLED revenue thesis.
    diligencePath: >
      Request FedRAMP authorization status (Authorized, In-Process, or exception) and any
      DoD Impact Level authorization documentation under NDA.
    relatedQuestionRefs:
    - QR001
    - QR015
    - QR018
    relatedTableRefs:
    - TR001

  - id: EGR002
    type: missing-source
    severity: material
    topic: Post-layoff analyst headcount and SLA attainment not disclosed
    missingEvidence: >
      Current analyst headcount, analyst-to-customer ratio, and SLA attainment rates
      (MTTD, MTTR) before and after the November 2025 workforce reduction.
    whyItMatters: >
      Deepwatch's premium pricing depends on human-intensive named squad delivery. Without
      SLA data, the investor cannot determine whether the workforce reduction degraded service
      quality or was fully offset by NEXA AI automation.
    diligencePath: >
      Request analyst headcount, analyst-to-customer ratio, and SLA attainment (MTTD/MTTR)
      data for the 6 months before and 6 months after November 2025 under NDA.
