  evidenceGaps:
  - type: missing-source
    severity: material
    topic: export-control
    missingEvidence: Product-level ECCN matrix, country exposure, and licensing history for shipped robots, controllers, and model-training tooling.
    whyItMatters: Export-control scope can delay delivery, restrict end markets, and create approval risk around Germany-China supply chains.
    diligencePath: Request internal export-classification memo and destination-level approval logs from compliance counsel.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: ai-act
    missingEvidence: Management mapping of each deployed workflow to EU AI Act risk categories and implementation timetable.
    whyItMatters: High-risk AI obligations could add documentation, monitoring, and customer-assurance cost that is not visible in public materials.
    diligencePath: Request compliance roadmap, designated responsible owner, and any notified-body or legal-adviser workstreams.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Commercial terms with Google DeepMind, Deutsche Telekom, and NVIDIA, including termination rights and exclusivity if any.
    whyItMatters: The thesis assumes partner access remains durable; hidden exclusivity or termination clauses could sharply increase residual risk.
    diligencePath: Review executed agreements or management redlines under NDA.
    relatedQuestionRefs:
    - QR029
  - type: missing-source
    severity: material
    topic: field-reliability
    missingEvidence: Fleet-wide uptime, recall, near-miss, and safety incident reporting for shipped robots and integrated production lines.
    whyItMatters: Risk ranking for operations and product safety is much weaker without real-world failure-rate data.
    diligencePath: Ask for quality dashboard extracts, warranty claims, and major incident post-mortems.
    relatedQuestionRefs:
    - QR030
  - type: conflicting-data
    severity: minor
    topic: governance-scrutiny
    missingEvidence: Definitive regulatory position on prior foreign-ownership concerns raised in the Franka process.
    whyItMatters: Public criticism can linger into customer diligence even if no formal block occurred.
    diligencePath: Request counsel letter summarizing any FDI or foreign-trade review outcomes on Franka and later acquisitions.
