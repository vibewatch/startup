- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Export-control escalation
    - New licensing requirement, blocked shipment, or customer end-use restriction
    - Two or more strategic shipments delayed or denied in a quarter
    - Pause underwriting of cross-border upside until destination controls are mapped
  - - AI Act compliance lag
    - No named owner, no risk mapping, or no implementation plan before 2027 budget cycle
    - Management cannot show product-level compliance workstream
    - Treat valuation upside from AI-enabled expansion as unproven
  - - Acquisition integration miss
    - Krause / Franka / idealworks miss customer commitments or show leadership churn
    - Major OEM delay, brand reversal, or disclosed restructuring inside 12 months
    - Downgrade industrial-synergy thesis and assume lower revenue multiple
  - - Cloud / model partner dependency crystallizes
    - Partner contract changes, compute bottlenecks, or no fallback stack
    - Material training slowdown or exclusivity constraint appears
    - Re-rate Agile as a systems integrator with weaker AI optionality
  - - Safety / quality incident
    - Recall, serious incident, or rising warranty trend surfaces
    - One major safety event or repeated field failure across flagship products
    - Stop underwriting rapid humanoid ramp until root-cause evidence is reviewed
  notes: Triggers are practical diligence gates rather than legal certainty tests; each is framed to signal whether the investment thesis should be paused or repriced.
