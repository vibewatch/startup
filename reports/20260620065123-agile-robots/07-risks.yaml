chapter:
  number: 7
  title: Risks
  summary: 'Agile Robots enters 2026 with meaningful industrial scale, but the public evidence points to a stacked risk profile: integration of acquired assets, export-control and AI-governance obligations, and deep dependency on external model and cloud partners. Quality and safety milestones are real mitigants, yet the residual exposure remains high until management discloses partner contracts, compliance workstreams, and fleet reliability data.'
sections:
- id: severity-ranked-risks
  title: Severity-ranked risk picture
  body: Agile Robots enters 2026 with an unusually dense stack of simultaneous execution demands. The company is not merely selling more units; it is integrating Franka after insolvency, converting thyssenkrupp Automation Engineering into Krause Automation, consolidating idealworks, and layering DeepMind, NVIDIA, and Deutsche Telekom dependencies into its next product cycle. Public evidence shows real scale—roughly €200 million of 2024 revenue, more than 2,500 employees, and more than 20,000 deployed robotic systems—but that scale also amplifies the blast radius of any operational miss. The highest-severity risks are therefore not single-product defects; they are system risks in which integration slippage, partner dependency, and compliance workload can transmit into delivery misses, margin compression, and a weaker valuation narrative. The risk heatmap and transmission map below illustrate why the thesis should be underwritten as an integration-and-controls story, not only as a robotics
    growth story.
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR026
  - CR028
  - CR034
  - CR044
  tableRefs:
