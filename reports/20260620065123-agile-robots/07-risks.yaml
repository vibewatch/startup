- id: investment-implications
  title: Mitigations, monitoring, and thesis-break criteria
  body: 'The investment implication is not that Agile is uninvestable; it is that diligence has to move from slogan-level AI ambition to operating proof. Public mitigations exist: retained local production for Franka, legal counsel on large transactions, certified safety milestones, European cloud positioning, and a Munich R&D base investing more than €80 million a year. Those steps justify continued engagement. But the residual exposure remains high until management can show contract durability with model and compute partners, product-level export classifications, AI Act workstreams, and field-reliability dashboards. Investors should treat the five kill criteria below as mandatory monitoring gates. If export-control friction appears, if AI Act ownership remains vague, if Krause / Franka / idealworks integration slips, or if a material safety incident emerges, the right response is not merely to trim the position—it is to re-underwrite the entire AI-premium multiple. That is the core lesson
    from this chapter: Agile''s upside is real, but so is the cost of underestimating operational control risk.'
  claimRefs:
  - CR017
  - CR020
