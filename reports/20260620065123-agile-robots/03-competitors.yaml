- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Force-control and dexterity lead
    - Flexiv and Franka target similar high-sensitivity manipulation needs
    - High
    - Closest feature overlap with Agile's best-supported wedge
    - Ask for third-party cycle-time and task-success proof in tactile assembly
  - - AI-led differentiation
    - Incumbents increasingly bundle AI, simulation, and software into broader stacks
    - High
    - AI narrative can commoditize if not tied to measurable workflow improvement
    - Request production KPI deltas tied to Agile-specific AI functions
  - - European industrial positioning
    - Dobot and other Chinese exporters compress collaborative-arm pricing
    - High
    - Price pressure can narrow willingness to pay for premium arms
    - Request realized ASPs and win/loss data by geography and task
  - - Research lineage credibility
    - Franka already owns much of the public research and developer mindshare
    - Medium
    - Developer preference can influence pilot selection and ecosystem tools
    - Test how often buyers require FCI/ROS-style openness in production accounts
  - - Precision-manipulation strength
    - ABB, KUKA, FANUC, and UR have stronger distribution, service, and plant standards
    - High
    - Capability wins may still lose to incumbent procurement and support habits
    - Quantify integration-time savings and service model competitiveness
  - - Category novelty
    - Market is broadening toward autonomy, AI-first robotics, and humanoids
    - Medium
    - New entrants or adjacent platforms can redefine comparison sets quickly
    - Monitor whether Agile wins on current arms before betting on broader humanoid narratives
  notes: Severity reflects strategic underwriting risk, not observed failure rates; every row is a diligence lens derived from reviewed sources rather than a definitive market outcome.
