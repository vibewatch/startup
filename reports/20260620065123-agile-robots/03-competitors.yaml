- id: TP003
  title: Pricing / Packaging and Switching-Cost Comparison
  columns:
  - Vendor / class
  - Public pricing signal
  - Packaging / channel model
  - Switching-cost driver
  - Implication
  rows:
  - - Agile Robots
    - No broad public list pricing on reviewed surfaces
    - Sales-led industrial solution motion
    - Needs proprietary workflow proof to justify vendor change
    - Competitive win must come from capability, not transparent low price
  - - Universal Robots
    - $30k-$60k range in third-party 2026 guide
    - Marketplace kits, training, accessories, certified partners
    - UR+ ecosystem and operator familiarity
    - Sticky once a plant standardizes on UR accessories and training
  - - ABB
    - $40k-$75k range in third-party 2026 guide
    - Integrator- and enterprise-led automation sale
    - Service network and broader automation stack
    - Pricing sits inside larger plant standardization decisions
  - - FANUC
    - $35k to $90k+ in third-party 2026 guide
    - Industrial platform sale with controllers, software, service
    - Software, simulation, installed base, service routines
    - Difficult to displace in uptime-critical plants
  - - Dobot / Chinese exporters
    - $15k-$40k budget framing in third-party guide
    - Partner-heavy export motion
    - Low upfront price can offset lower lock-in depth
    - Downward pressure on collaborative-arm pricing expectations
  - - Market average
    - $25k-$60k base for standard cobots before tooling/integration
    - Tooling, compliance, vision, and training often separate
    - Integration costs can exceed raw arm comparison
    - Sticker price alone understates total competitive friction
  notes: Pricing figures are low-confidence third-party 2026 comparables rather than official vendor list prices; they are used as directional signals about buyer expectations and budget bands, not as audited ASPs or quoted contracts.
