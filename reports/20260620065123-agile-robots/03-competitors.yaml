  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized average selling prices, discounting behavior, and service-bundle economics by vendor and channel.
    whyItMatters: Public list-price proxies overstate comparability and can hide whether Agile wins or loses on all-in cost after integration and support.
    diligencePath: Request recent win/loss sheets, quote stacks, and post-integration TCO cases across Agile, UR, ABB, and FANUC opportunities.
    relatedQuestionRefs:
    - QP022
  - type: enumeration-incomplete
    severity: material
    topic: channel-density
    missingEvidence: Direct reseller, certified integrator, and field-service headcount counts by region for key competitors.
    whyItMatters: Distribution density often decides pilot conversion and after-sales comfort, especially when technical capability is close.
    diligencePath: Collect partner-directory counts, region-by-region service maps, and reference calls with integrators in Germany, North America, and China.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Observed post-deployment multi-homing, migration costs, and revalidation burden when customers switch robot platforms.
    whyItMatters: Competitive wins depend not just on technical superiority but on whether buyers can justify changing training, safety, software, and accessories.
    diligencePath: Interview recent customers and integrators about line-change projects, staff retraining, and safety recertification timelines.
    relatedQuestionRefs:
    - QP024
