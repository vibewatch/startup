company:
  name: Agile Robots AG
chapter:
  number: 3
  title: Competitors
  summary: Agile Robots competes in a crowded industrial-robotics field where buyers can choose broad incumbent automation stacks from ABB, FANUC, KUKA, and Universal Robots; dexterity- and force-control specialists such as Flexiv and Franka; or lower-cost Chinese exporters such as Dobot. The evidence suggests Agile's strongest wedge is not install-base or service breadth but dexterous force control, AI-led manipulation, and research-grade control lineage. That wedge is real, but it is surrounded by stronger incumbent distribution, opaque but material pricing competition, and fast-moving price pressure from Asia.
sections:
- id: landscape-and-buyer-alternatives
  title: Landscape and Buyer Alternatives
  body: 'Agile Robots is not competing inside a neat single-category box. Its public positioning sits at the intersection of collaborative automation, force-controlled manipulation, AI-enabled robotics, and higher-mix production workflows. That means the buyer can solve the same job through at least four alternative routes. First are broad collaborative automation leaders such as Universal Robots, ABB, KUKA, and FANUC, which combine arms with software, training, service, and integration support. Second are dexterity- and force-control specialists such as Flexiv and Franka, where the main selling point is sensitive manipulation rather than catalog breadth. Third are lower-cost exporters such as Dobot, which use price, partner reach, and broad entry-level product coverage to widen adoption. Fourth are buyer-side substitutes: staying with manual work longer, mixing integrator-selected components, or choosing a broader industrial automation vendor whose robotics suite sits inside a larger plant
    standardization project. Industry data also matters. IFR, VDMA, and multiple market-research firms all point to a large and still-growing robotics market, but they also show that buyer attention is increasingly pulled toward scaled global vendors, Asian supply, and AI-heavy narratives rather than a clean standalone "cobot" segment.'
