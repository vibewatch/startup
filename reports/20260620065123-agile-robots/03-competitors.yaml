callouts:
- calloutType: risk
  title: Moat is capability-led, not channel-led
  body: Agile appears strongest where sensitive force control and AI-led manipulation matter immediately. It looks weaker where buyers primarily optimize for incumbent service depth, platform standardization, or lowest-cost collaborative deployment.
  claimRefs:
  - CP037
  - CP038
  - CP040
- calloutType: insight
  title: Price opacity is itself a competitive fact
  body: Public sticker prices are scarce across scaled incumbents, so buyers often compare total deployed systems rather than base-arm list prices. That favors vendors with strong ecosystems, training, and lifecycle support.
  claimRefs:
  - CP032
  - CP033
  - CP037
