- id: incumbent-profiles-and-capability-comparison
  title: Incumbent Profiles and Capability Comparison
  body: 'The most important competitor fact pattern is asymmetry of breadth. Universal Robots emphasizes simplicity, repeatability, and a large UR+ ecosystem, which makes it a strong default for collaborative deployment even when its payload range does not directly match every industrial task. ABB and KUKA approach the market more like factory-automation platforms: they bundle collaborative robots into broader portfolios that include articulated arms, specialty robots, software, controllers, peripherals, and service reach. FANUC is broader still on pure hardware breadth, with heavy payload coverage, collaborative CRX exposure, large software libraries, and simulation tooling. Against that backdrop, Flexiv and Franka matter because they overlap more closely with Agile''s dexterity story. Flexiv explicitly markets adaptive robots that blend industrial-grade force control with AI. Franka remains the research-first reference platform with strong community pull and fine-motion credibility. Agile
    therefore competes best when the buying criterion is sensitive force interaction, direct teachability, or higher-precision manipulation in constrained environments. It is on less favorable ground when the buyer prioritizes installed base, global support density, or broad platform standardization across many robot categories.'
