tables:
- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor / class
  - Category
  - Scale / footprint signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Agile Robots
    - Dexterous AI-enabled automation entrant
    - 20,000+ solutions installed worldwide per company claims
    - High-mix industrial automation in automotive, electronics, healthcare, and service workflows
    - Force control, dexterity, and AI-led manipulation narrative anchored by Diana 7
    - Smaller public install-base and service evidence than incumbents
  - - Universal Robots
    - Collaborative-robot specialist
    - 75,000+ cobots in 50+ countries per third-party guide; 500+ UR+ items on official site
    - SME to enterprise collaborative automation
    - Ease of deployment, training surface, large accessory ecosystem
    - Less obvious wedge in force-control research and high-payload heavy industrial range
  - - ABB
    - Broad industrial automation incumbent
    - Large global automation group with $1.318bn 2025 R&D at group level
    - Enterprises standardizing across multiple robot types
    - Very broad portfolio and service network
    - Can be heavier-weight and more integrator-led than point cobot entrants
  - - KUKA
    - Automotive and factory-automation incumbent
    - Global incumbent spanning robots, controllers, peripherals, and mobile solutions
    - Automotive, logistics, and HRC deployments requiring system integration
    - Breadth across cobots, mobile solutions, and industrial robots
    - Programming and integration complexity can be higher than simpler cobot-first platforms
  - - FANUC
    - Scaled industrial robot incumbent
    - 1M+ installed robots per third-party guide; 21 series and 100+ models on official site
    - High-uptime manufacturing, automotive, electronics, heavy material handling
    - Largest hardware breadth plus software, simulation, and service
    - Not optimized for low-friction self-serve adoption
  - - Flexiv
    - Adaptive-force specialist
    - Focused deep-tech positioning rather than mass-market catalog breadth
    - Complex tasks requiring force-sensitive adaptation
    - Industrial-grade force control fused with AI
    - Less evidence of incumbent-like global service scale
  - - Franka Robotics
    - Research-first manipulation platform
    - Strong academic and AI-community identity
    - Research labs and developers prioritizing direct control and tactile behavior
    - Reference platform and community credibility
    - Narrower industrial breadth than ABB, FANUC, or KUKA
  - - Dobot
    - Low-cost collaborative and educational exporter
    - 100,000+ robots sold; 350+ partners; 100+ countries/regions served
    - Budget-conscious factories, education, and entry collaborative automation
    - Aggressive price / partner reach and broad starter catalog
    - Quality, support, and advanced capability breadth can vary by application
  notes: Profile rows summarize what is visible from official product surfaces, parent/investor materials, and credible market overviews as of 2026-06-20; scale signals mix public company facts, company claims, and third-party summaries where audited competitor-specific data is unavailable.
