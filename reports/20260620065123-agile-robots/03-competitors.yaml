- id: TP002
  title: Capability and Strategic-Direction Comparison
  columns:
  - Vendor
  - Core capability signal
  - Software / ecosystem signal
  - Strategic direction
  - Why it matters vs. Agile
  rows:
  - - Universal Robots
    - Collaborative arms from 3 kg to 35 kg with strong repeatability
    - UR+, training, marketplace, application kits
    - Simplify adoption and expand through partner ecosystem
    - Strong default option when simplicity outranks force-control depth
  - - ABB
    - Portfolio breadth across articulated, collaborative, delta, SCARA, paint, and palletizing
    - Broader service network and wider automation stack
    - Keep robotics inside a multi-category automation platform
    - Hard to displace where customers want one scaled vendor
  - - KUKA
    - Traditional robots, cobots, mobile solutions, software, controllers, peripherals
    - System-level integration orientation
    - Blend HRC, mobile, and industrial automation under one brand
    - Competes for sophisticated factory-standardization budgets
  - - FANUC
    - 2.3-ton max payload range plus collaborative CRX options
    - 250+ software functions and ROBOGUIDE
    - Push AI, IoT, and supply resilience into industrial automation
    - Raises the bar on installed-base trust and lifecycle support
  - - Flexiv
    - Adaptive robot with industrial-grade force control
    - AI-centric but narrower catalog
    - Win tasks that need responsive force interaction
    - Closest overlap with Agile's manipulation narrative
  - - Franka
    - Research-led direct-control platform
    - Developer and academic community gravity
    - Stay the reference platform for robotics and AI professionals
    - Strong substitute when buyer prioritizes openness and research lineage
  - - Dobot
    - Broad low-to-mid market collaborative catalog
    - Partner network and cloud/controller hooks
    - Scale exports through affordability and breadth
    - Pressures pricing expectations below premium European/Japanese levels
  notes: 'This table is strategic rather than exhaustive: each row emphasizes the vendor angle most relevant to Agile Robots rather than listing every product family.'
