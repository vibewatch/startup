  topStrengths:
    - 真实工业规模清晰可见：部署系统 >20,000 套，披露 2024 年收入约 EUR200 million，并已形成多国运营足迹。
    - 公司把 DLR 衍生的机器人技术厚度，与制造、系统集成和合作伙伴杠杆结合起来，而不是只靠演示支撑叙事。
    - SoftBank、BMW/idealworks、Google DeepMind、Deutsche Telekom 和 NVIDIA 等战略关系，实质增强了市场进入能力和技术可信度。
    - 收购 Franka、BÄR、idealworks 和 thyssenkrupp Automation Engineering 后，Agile 的产品和客户基础比单一机械臂机器人初创公司更宽。
  topRisks:
    - 当前估值、利润率结构、烧钱速度、现金跑道和清算优先权均未披露，无法形成有把握的承销判断。
    - 多项收购叠加新的人形机器人项目，抬高了整合复杂度、资本强度和管理层带宽风险。
    - 公开收入、员工数和部署指标仍是新闻稿级别口径，不是审计或监管文件级披露。
    - 德国-中国跨境运营与先进 AI/机器人研发，带来地缘政治、出口管制和合规暴露。
    - 如果当前势头不能转化为耐久经济性，人形机器人和物理 AI 的上行空间可能已经先于可验证的工业 ROI 被计入价格。
  unresolvedGaps:
    - 2021 年独角兽基准之后的当前定价估值或二级市场证据
    - 经审计的收入质量、毛利率、运营支出、资本开支、烧钱速度和现金跑道披露
    - 主要融资轮次的股权结构表、董事会控制权和优先股堆叠细节
    - 客户留存、集中度、续约质量，以及软件 / 服务变现证据
    - Franka、idealworks、BÄR 和 thyssenkrupp Automation Engineering 资产的并购后整合 KPI
