company:
  name: Agile Robots AG
chapter:
  number: 1
  title: Company Overview
  summary: Agile Robots has evolved from a 2018 DLR-rooted robotics spinout into a Munich-headquartered industrial automation consolidator with public claims of >20,000 deployments, ~EUR200m 2024 revenue, and a fast-expanding acquisition stack. The evidence supports real industrial scale and partner quality, but still leaves important gaps on audited metrics, governance control, and post-merger integration performance.
sections:
- id: identity-footprint
  title: Identity, footprint, and operating profile
  body: 'Agile Robots presents itself as a Munich-headquartered provider of AI-powered automation rather than a single-product robot vendor. The official corporate surfaces consistently describe a stack that combines robot hardware, sensors, computer vision, force control, and software, and they place the company across automotive, consumer electronics, healthcare, logistics, and service workflows. The historical through-line is the founders’ DLR pedigree: Zhaopeng Chen and Peter Meusel built the company in 2018 out of force-controlled robotics and intelligent manipulation research, then expanded it into a multi-site manufacturing and R&D footprint. Public operating-footprint evidence is strong on geography and weaker on audited scale. Munich is the governance and R&D center, Kaufbeuren is a public production anchor, and official pages list additional operations in China, India, and the United States. That footprint matters because later strategic claims about physical AI, humanoids, and
    factory-scale deployments depend on having in-house manufacturing, integration capability, and industrial customer access across multiple geographies.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO008
  - CO036
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: leadership-governance
  title: Leadership and governance signals
  body: 'Leadership evidence is strongest around the founders and around the 2024 legal-form conversion, and much thinner on public board disclosure. Chen and Meusel are not generic commercial founders; the company and third-party profiles repeatedly tie them to DLR’s robotics work, which helps explain why Agile Robots’ public narrative emphasizes dexterity, force control, and advanced perception rather than labor-only automation. The governance record shows a meaningful formal step in March 2024 when Agile Robots changed from an AG into an SE, a structure more consistent with a company that expects pan-European growth, cross-border operations, and a wider institutional profile. Quality and operating-system signals are supportive: ISO 9001 certification and repeated references to in-house manufacturing reinforce that Agile Robots wants to be perceived as production-grade. What remains unresolved is ownership-control detail. There is no filing-grade public cap table, no clearly published
    board map, and no detailed debt or control-right disclosure in the available sources, so leadership quality is easier to assess than governance transparency.'
  claimRefs:
  - CO001
  - CO006
  - CO007
  - CO017
  - CO037
  tableRefs:
  - TO002
- id: capital-stakeholders
  title: Funding history and stakeholder map
  body: 'Public funding evidence shows a familiar deep-tech arc: early rounds from China-linked venture investors, then a prominent SoftBank Vision Fund 2-backed Series C that anchored Agile Robots’ unicorn positioning. The company’s own funding releases let us reconstruct the sequence from angel and seed support into pre-A, then an eight-figure Series A, then a US$220 million Series C. That is enough to establish capital availability, investor quality, and a clear willingness from backers to fund capital-intensive robotics scaling. It is not enough to reconstruct control rights or current ownership percentages. The stakeholder picture is broader than equity capital alone. BMW remained strategically relevant through idealworks, while Google DeepMind became an intelligence-layer partner in 2026. Those relationships matter because Agile Robots’ execution model depends on ecosystem leverage as much as pure fundraising. The downside is disclosure opacity: valuation, headcount, and revenue signals
    appear in press releases and interviews, but the company still behaves like a private enterprise that selectively discloses momentum metrics when strategically useful.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO031
  - CO035
  tableRefs:
  - TO003
- id: milestones-manda-risk
  title: Milestones, acquisitions, and integration risk
  body: The 2023–2026 milestone pattern is the heart of the current company story. Agile Robots did not simply scale an original cobot line; it assembled a broader industrial platform through acquisitions and adjacent partnerships. Franka added distressed-but-valuable robotics IP and a research platform, BÄR added transport and automation know-how, idealworks added intralogistics software and AMR exposure, and thyssenkrupp Automation Engineering materially increased industrial depth and OEM relationships. By early 2026 the company layered a Google DeepMind partnership on top of that acquired industrial base, explicitly pushing toward autonomous and reasoning-heavy physical AI. This sequence supports the thesis that Agile Robots is becoming a consolidator and systems integrator, not only a device maker. It also creates real execution risk. Franka came out of insolvency, post-acquisition operating KPIs remain thin, and public scale claims around employees, deployments, and revenue are still
    press-level rather than audited. The overall milestone record is therefore impressive but still dependent on successful integration across very different assets, customer bases, and technical stacks.
