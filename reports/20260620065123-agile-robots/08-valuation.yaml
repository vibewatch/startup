- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Indicative EV range
  - Probability signal
  - Key downside / upside driver
  rows:
  - - Bull
    - AI partnerships convert into durable software / service monetization, humanoid ramp lands, and integration succeeds
    - €1.2B-€1.6B
    - Requires strong data-room evidence beyond public sources
    - AI optionality converts into repeatable industrial ROI
  - - Base
    - Industrial growth continues, acquisitions settle, but economics stay mixed and investors demand discipline
    - €0.8B-€1.2B
    - Most consistent with current public evidence
    - Execution is credible but not yet enough for premium pricing
  - - Bear
    - Humanoid economics lag, integration drags, and market sentiment compresses toward conventional automation
    - €0.6B-€0.8B
    - Plausible if current disclosure gaps hide weak margins or heavy dilution
    - Multiple compression and higher funding needs
