- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public-status / filing signal
  - Relevance to Agile
  - Limitation
  rows:
  - - ABB Robotics
    - Public incumbent with broad articulated and collaborative robot portfolio
    - Shows how diversified industrial leaders frame robotics breadth and customer coverage
    - Far more diversified than Agile and not a clean pure-play multiple
  - - KUKA
    - Public European robotics and automation operator
    - Useful for Germany / factory-automation reference points
    - Mix includes heavier systems integration and established automotive exposure
  - - FANUC
    - Public Japanese incumbent with integrated report history
    - Relevant for scale, reporting discipline, and industrial installed-base benchmarking
    - Margin structure and regional mix differ materially from Agile
  - - Teradyne / Universal Robots
    - Public parent filing history plus cobot exposure through Universal Robots
    - Useful for a robotics-adjacent public-market governance and disclosure benchmark
    - Parent includes semiconductor test and broader businesses beyond collaborative robotics
  - - Universal Robots product cadence
    - Official news feed shows continued cobot innovation
    - Highlights competitive pressure in collaborative / industrial automation
    - Not a standalone public valuation reference
  notes: The comp set is intentionally qualitative because fetched public filings/pages give coverage and disclosure anchors, but not a current clean peer-multiple dataset for Agile.
  enumerationScope:
    coverage: sample
    basis: Covers the main public robotics incumbents and proxy parent disclosures that are most relevant to Agile's industrial automation positioning.
