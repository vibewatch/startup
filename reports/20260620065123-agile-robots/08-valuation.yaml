- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Public support
  - What would change the view
  rows:
  - - AI-enabled industrial platform with real scale
    - 20,000+ deployed systems, €200M revenue datapoint, DeepMind and NVIDIA-linked momentum
    - Need disclosed margins, customer retention, and present-day price to upgrade
  - - Germany-rooted robotics champion with expanding global footprint
    - Munich HQ, €80M+ German R&D spend, manufacturing across Europe/China/India
    - Need evidence that cross-border complexity is producing margin leverage rather than cost sprawl
  - - 'Anti-thesis: valuation may be pricing hype faster than proof'
    - Current private mark is undisclosed and humanoid economics remain contested
    - A current priced round plus unit-economics disclosure could narrow this gap
  - - 'Anti-thesis: acquisitions and platform breadth dilute focus'
    - Franka, idealworks, Krause, humanoids, and AI cloud all compete for capital and execution bandwidth
    - Evidence of successful integration and steady cash conversion would weaken the anti-thesis
  notes: Arguments are intentionally paired with reversal conditions so the recommendation remains evidence-sensitive rather than narrative-driven.
