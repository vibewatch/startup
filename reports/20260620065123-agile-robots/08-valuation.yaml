  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-valuation
    missingEvidence: Current priced round, secondary transaction, or internal mark after the 2021 unicorn milestone and 2022 follow-on capital.
    whyItMatters: A price-sensitive recommendation is impossible to underwrite confidently without knowing today's implied entry valuation.
    diligencePath: Request the latest cap table, board-approved valuation mark, and any recent secondary or bridge financing terms.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Gross margin, cash burn, working capital profile, and capex split across humanoid, industrial, and acquisition programs.
    whyItMatters: Without unit economics and burn, valuation ranges can only be scenario estimates rather than investment-grade conclusions.
    diligencePath: Request monthly management accounts and board reporting for the last 12 months.
    relatedQuestionRefs:
    - QV030
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Liquidation preferences, participating preferred terms, anti-dilution protections, and employee option pool size.
    whyItMatters: Exit outcomes for new investors can diverge sharply from enterprise value if the stack is heavy or senior.
    diligencePath: Review charter, financing documents, and latest cap-table waterfall model.
  - type: missing-source
    severity: material
    topic: commercial-durability
    missingEvidence: Cohort retention, customer concentration, and recurring software attach rates by product family.
    whyItMatters: Public deployment and headcount scale do not prove durable monetization quality.
    diligencePath: Ask for cohort tables, top-customer share, and ARR / service attach by product line.
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable-set boundary
    missingEvidence: Current clean peer-multiple dataset for private AI-heavy robotics companies directly comparable to Agile.
    whyItMatters: The comparable table is intentionally qualitative because public incumbents are imperfect proxies for a private integrated platform.
    diligencePath: Request banker comp deck or build a bespoke peer set with current trading multiples and cap-table adjustments.
    relatedTableRefs:
    - TV004
