company:
  name: Agile Robots AG
chapter:
  number: 8
  title: Valuation
  summary: Agile Robots has enough public scale and strategic momentum to remain investable, but not enough current pricing or economics disclosure to support a high-conviction buy call. The chapter therefore lands on a track / research-more stance, with a fair-to-stretched public-evidence valuation view and explicit bull, base, and bear ranges driven by scenario assumptions rather than an observed 2026 private mark.
sections:
- id: recommendation
  title: Recommendation and underwriting stance
  body: 'Public evidence supports taking Agile Robots seriously as a scaled industrial robotics platform, but it does not yet support underwriting the company as a clean buy at an unspecified premium valuation. The company has real assets: more than 20,000 deployed systems, a public ~€200 million revenue datapoint, a large employee base, manufacturing in multiple countries, and momentum around DeepMind, NVIDIA, Deutsche Telekom, and Munich''s AI ecosystem. Those are not cosmetic signals. The problem is price sensitivity. Fetched sources disclose historical rounds and the 2021 unicorn milestone, but they do not disclose a current 2026 mark, liquidation stack, or operating economics. That means the right near-term stance is track or research-more: stay close, collect the data room, and refuse to convert narrative momentum into a premium entry price without proof on margins, burn, and commercial durability. The recommendation table and logic figure below show why scale alone is not enough.
    That disclosure gap is exactly why patience matters at entry.'
  claimRefs:
  - CV004
  - CV014
  - CV016
  - CV017
  - CV035
  - CV039
  - CV040
  - CV041
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: financing-and-comparables
  title: Financing context and comparable set
  body: 'Agile''s funding history is impressive and long-dated enough to matter. The company progressed from an 8-figure early round to a 2019 pre-A, to a SoftBank-led 2021 Series C, and third-party profiles point to a 2022 follow-on round as well. That history supports the claim that venture investors have repeatedly funded the platform. It does not, however, tell us what the company is worth today. Public comparable coverage is also mixed. ABB, KUKA, FANUC, and Teradyne / Universal Robots are useful reference points for disclosure quality, scale, and competitive breadth, but none is a neat apples-to-apples comp for a still-private, AI-heavy, acquisition-active platform like Agile. The safest use of comparables here is qualitative: they show that incumbents are broad, well-capitalized, and publicly accountable, which raises the bar for any private-company valuation premium. The comp table below therefore focuses on comparability limits rather than pretending public peer multiples are directly
    transferable.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV006
  - CV007
  - CV028
