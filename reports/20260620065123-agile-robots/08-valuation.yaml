  - TV004
- id: scenario-framing
  title: Bull, base, and bear framing
  body: 'Because the current private valuation is undisclosed, scenario analysis is the only defensible way to translate evidence into value. The last public revenue datapoint of roughly €200 million lets us sketch a rough range rather than a precise target. In the base case, Agile looks like a large, growing, but still opaque industrial robotics platform that deserves respect yet not unchecked AI scarcity pricing. That yields a rough €0.8 billion to €1.2 billion range. The bull case requires more than headlines: it needs proof that DeepMind-enabled intelligence, in-house humanoid production, and acquired platforms convert into durable revenue quality and margin expansion. The bear case is equally plausible if humanoid economics remain promotional, if integration load compresses margins, or if new capital arrives on terms that favor insiders over new common investors. In other words, the scenario spread is wide because disclosure is thin, not because the market opportunity is small.'
  claimRefs:
  - CV014
  - CV023
  - CV024
  - CV033
  - CV035
  - CV036
  - CV037
  - CV038
  - CV043
  - CV044
  tableRefs:
  - TV003
  figureRefs:
  - FV002
  - FV003
- id: final-diligence
  title: Final diligence asks and thesis-break triggers
  body: 'The diligence burden for Agile is explicit and manageable, but it must be cleared before any committee should elevate the recommendation. First, investors need current pricing evidence: the latest round, a board mark, or a real secondary print. Second, they need economics, including gross margin, opex, capex, and cash burn by major program. Third, they need the preference stack and waterfall because enterprise value can look healthy while common-equity outcomes remain poor. Fourth, they need proof that deployment scale is translating into sticky customers and software or service monetization. Until those asks are answered, the right behavior is to monitor kill triggers rather than chase upside headlines. If series production slips, if integration breaks, if AI partners become concentration risks, or if the company raises highly structured new capital, the valuation should compress toward a conventional automation supplier rather than an AI-premium platform.'
  claimRefs:
  - CV012
  - CV021
