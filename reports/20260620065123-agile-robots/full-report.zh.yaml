chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图与运营画像
        blocks:
          - type: paragraph
            body: >-
              Agile Robots 对外呈现的是一家总部位于慕尼黑、提供 AI
              驱动自动化的公司，而不是单一产品机器人厂商。官方公司页面反复描述一套结合机器人硬件、传感器、计算机视觉、力控和软件的技术栈，并把公司放在汽车、消费电子、医疗健康、物流和服务流程之中。历史主线来自创始人的 DLR
              背景：Zhaopeng Chen 和 Peter Meusel 2018
              年从力控机器人和智能操作研究出发创办公司，随后扩张为多地制造和研发网络。公开运营版图证据在地理分布上较强，在经审计规模上较弱。慕尼黑是治理和研发中心，Kaufbeuren
              是公开的生产锚点，官方页面还列出中国、印度和美国的运营。这个版图很关键，因为后续关于具身 AI、人形机器人和工厂级部署的战略主张，都需要公司在多地拥有内部制造、集成能力和工业客户入口。
