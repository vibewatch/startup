            - CV024
            - CV026
        - label: 商业证明
          value: 4 / 5
          detail: 20,000+ 部署和约 €200M 公开收入指向真实规模。
          claimRefs:
            - CV014
            - CV017
        - label: 战略可选性
          value: 4 / 5
          detail: DeepMind、NVIDIA、Telekom 和 Munich AI factory 打开上行路径。
          claimRefs:
            - CV015
            - CV016
        - label: 经济性可见度
          value: 2 / 5
          detail: 当前估值、利润率、烧钱速度和资本结构仍不透明。
          claimRefs:
            - CV035
            - CV039
        - label: 风险 / 复杂度
          value: 2 / 5
          detail: 人形机器人、收购和资本强度都会抬高执行负担。
          claimRefs:
            - CV021
            - CV033
            - CV043
        - label: 建议成熟度
          value: 2 / 5
          detail: 公开数据支持监测和尽调，不支持确信度足够的入场定价。
          claimRefs:
            - CV039
            - CV040
