  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入细分
        blocks:
          - type: paragraph
            body: >-
              本章最大的分析错误，是引用一个巨大的「机器人」TAM 后就停下。Agile Robots
              的公开版图既不是广义消费机器人，也不只是某一类工业机械臂。保留下来的证据支持一个更窄、更可投资的边界：面向工厂及相邻物流的集成工业自动化，包括固定机械臂、协作机器人、工业软件、移动自动化，以及能解决真实生产任务的新兴人形机器人流程。这个边界与公司自己的应用页面一致，后者强调装配、机床上下料、搬运、检测和厂内物流，而不是消费或家庭场景。它也解释了相邻软件和移动能力为何重要。AgileCore
              面向系统集成商和运营方，BÄR 与 idealworks 相关的移动机器人层则把产品组合延伸到 AMR、AGV 和移动操作项目。结果是一个基于证据、运营上自洽的市场定义，比无差别的机器人支出标题有用得多。
