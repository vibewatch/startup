      - number: '3.2'
        title: 既有厂商画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争事实模式，是广度不对称。Universal Robots 强调简单、可重复和庞大的 UR+ 生态，即便载荷范围不能直接匹配每个工业任务，它仍是协作部署的强默认选择。ABB 和 KUKA
              更像工厂自动化平台来切入市场：它们把协作机器人打包进更广的产品组合，后者包括多关节机械臂、专用机器人、软件、控制器、外设和服务触达。FANUC 在纯硬件广度上更宽，覆盖重载、协作
              CRX、大型软件库和仿真工具。在这个背景下，Flexiv 和 Franka 重要，因为它们与 Agile 的灵巧叙事重叠更近。Flexiv 明确营销把工业级力控与 AI 融合的自适应机器人。Franka
              仍是研究优先的参考平台，社区牵引和精细运动可信度较强。因此，当采购标准是敏感力交互、直接示教或受限环境中的更高精度操作时，Agile
              最有竞争力。当买方优先考虑装机基础、全球支持密度或跨多类机器人实现广泛平台标准化时，它的处境就不那么有利。
