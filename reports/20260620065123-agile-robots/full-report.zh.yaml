            body: >-
              投资含义不是 Agile 不能投，而是尽调必须从口号式 AI 愿景转向运营证据。公开缓释措施确实存在：Franka
              保留本地生产，大额交易配备法律顾问，安全认证里程碑已经拿到，欧洲云定位明确，慕尼黑研发基地每年投入超过 €80
              million。这些动作足以支持继续跟进。但在管理层证明模型与算力伙伴的合同韧性、产品级出口分类、AI Act
              工作流和现场可靠性看板之前，剩余风险仍然很高。投资者应把下方五项否决标准视为强制监控闸门。如果出口管制摩擦出现，AI Act 责任仍含糊，Krause / Franka / idealworks
              集成滑坡，或重大安全事件浮现，正确反应不只是减仓，而是重新承保整个 AI 溢价倍数。这就是本章的核心教训：Agile 的上行空间真实存在，低估运营控制风险的代价也同样真实。
