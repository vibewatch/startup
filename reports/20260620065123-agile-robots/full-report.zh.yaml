      - number: '4.3'
        title: 算力依赖与运营效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Agile Robots 的不同寻常之处还在于，公开资本故事如今包括 AI 基础设施，而不只是机器人和工厂。公司承诺从 2026 年开始在 Deutsche Telekom 和 NVIDIA 的
              Industrial AI Cloud 上训练基础模型，并另行公开称已提前接入 NVIDIA Cosmos 3 用于仿真。公司自己对 Industrial AI Cloud
              的解释把取舍说得很清楚：通用机器人智能需要大数据集、强云基础设施和可扩展训练循环。换句话说，模型雄心在成为收入线之前，先变成运营成本线。公开资料没有披露预留 GPU
              容量、云支出或模型训练单位经济性，因此投资人无法判断算力是可管理的差异化因素，还是拖累现金跑道的隐性负担。公开资料中唯一具体的运营效率代理指标来自采购侧：Amazon Business 引用 Agile
              Robots 采购负责人称，一些电子品类已经实现成本降低，同时可得性和交期改善。这证明供应链纪律在组织内部重要，但仍是狭窄代理指标，不能证明强毛利率或 CAC 效率。
