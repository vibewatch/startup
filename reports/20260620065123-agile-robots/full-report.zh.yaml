      - number: '2.2'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              公开工业机器人市场规模在方向上偏多，但数字并不一致。这种不一致本身就是发现，而不是噪音。Mordor、MarketsandMarkets、Verified Market Research 和 Future
              Market Insights 都显示多年增长可观，但它们对 2026 年绝对基数和隐含斜率分歧很大。保留的最低 2026 年估计约为 USD15.5 billion；最高为 USD65.1
              billion。这个跨度太大，不能把任何一家发布方当成标准答案。方法论似乎驱动了差异：有些发布方更接近核心机器人硬件，另一些则纳入软件、集成、协作系统或更广的自动化层。尽调中更稳的结论是需求结构性真实存在，但
              Agile Robots 的自下而上市场模型必须受产品匹配度和买方证据约束，而不能只靠自上而下 TAM 幻灯片。VDMA 背景有助于理解周期性：德国仍是自动化领导者，但本地行业机构仍把 2026
              年环境描述为困难，提醒我们采用节奏会随制造业周期波动，而不是一条平滑 CAGR 曲线。
