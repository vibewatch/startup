      - number: '3.3'
        title: 定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >-
              公开定价仍是这个市场最不透明的部分之一，但现有证据在方向上有用。第三方 2026 年指南把标准协作机器人的基础区间大致放在 $25,000 至 $60,000，尚未计入工具、视觉、合规工作和集成；高级配置则超过
              $90,000。同一批指南把 Universal Robots、ABB 和 FANUC 放在重叠但差异明显的价格带，而 Dobot
              等中国品牌则被描述为低成本挑战者。即便这些数字不等于真实标价，它们仍显示买方已经习惯预期的竞争压力。分销和切换成本比标价本身更重要。Universal Robots 用 UR+、培训和应用套件加速部署。ABB
              强调服务网络广度。FANUC
              卖的不只是机械臂，还包括控制器、软件、仿真、维护和长生命周期支持。一旦工厂在其中一个环境上实现标准化，替换就不只是换机械臂。通常还意味着重新培训员工、重新验证安全、调整集成，并可能重写工具流程。因此，Agile
              需要足够强的操作和 AI 边缘，让买方愿意承担改变技术栈假设的成本，而不是购买最省事的既有厂商扩展。
