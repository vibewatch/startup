      - number: '5.4'
        title: 信任、质量与成熟度风险
        blocks:
          - type: paragraph
            body: >-
              信任故事可信但不均衡。Agile 可以指向 ISO 9001 质量管理认证、经 TÜV SÜD 认证且按 IEC 61508 评估的 Safety Core，以及 Yu 5 Industrial 通过 TÜV
              SÜD 对 IEC 61508、ISO 13849-1 和 ISO 10218-1 的认证。这些都是有意义的信号，说明公司投入了正式质量和安全流程，而不是把 AI
              与机器人当作纯软件实验。生产控制也变得更清楚：Kaufbeuren 已从巴伐利亚重启 Franka 发货，Agile 称关键产品由内部制造。同一批证据也显示成熟度仍未完全证明。Agile ONE
              在战略上令人兴奋，但公开记录仍由发布信息、Hannover 演示和基础设施公告主导，而不是广泛现场数据。整个技术栈的公开正常运行时间、MTBF、现场事故和安全治理披露仍稀少。DLR Agile Justin
              血脉有助于解释为什么力控、触觉感知和全身 AI 反复作为优势出现，但血脉不等于商业可靠性。因此，投资人应把当前产品故事视为架构强、生态整合有前景、规模化工业运营证据只被部分证明。
