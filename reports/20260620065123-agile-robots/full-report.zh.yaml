  - id: TV005
    title: 论点破裂与终止触发点表
    columns:
      - 触发点
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 无披露却要求溢价估值
        - 管理层寻求明显高于公开独角兽基准的价格，但没有当前经济性材料包
        - 动能变成未定价的不透明
        - 拒绝，或要求进入下一步前开放数据室透明度
      - - 人形机器人商业化停滞
        - 量产推迟，或到 2026 年 ROI 证据仍停留在个案
        - 牛情景可选性塌缩成成本中心
        - 只使用基准 / 熊区间，并削减战略溢价
      - - 被收购单元整合失手
        - 出现重大客户流失、重组或交付延迟
        - 平台论点变成复杂性论点
        - 重新定价到更接近传统自动化，并降低兴趣
      - - AI 伙伴依赖收紧
        - 没有备用算力 / 模型路径，或出现不利合同条款
        - 可选性变成集中风险
        - 要求合同尽调并压低进入价格
      - - 资本需求加速
        - 新融资带有惩罚性优先权或重度稀释
        - 即便企业增长，普通股上行也可能收缩
        - 任何投资决定前重建 waterfall
    notes: 这些终止触发点设计用于第一次会面到最终 IC 批准之间的监测，而不只是投后监测。
