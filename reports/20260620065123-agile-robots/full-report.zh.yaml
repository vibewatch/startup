        title: 按严重度排序的风险图景
        blocks:
          - type: paragraph
            body: >-
              Agile Robots 进入 2026 年时，同时背负的执行要求异常密集。公司不只是卖出更多设备；它还要整合破产后的 Franka，把 thyssenkrupp Automation Engineering
              转为 Krause Automation，整合 idealworks，并把 DeepMind、NVIDIA 和 Deutsche Telekom 依赖叠进下一轮产品周期。公开证据显示规模真实存在——2024
              年收入约 €200 million、超过 2,500 名员工、已部署超过 20,000
              套机器人系统——但规模也会放大任何运营失误的冲击半径。因此，最高严重度风险不是单一产品缺陷，而是系统性风险：整合滑坡、伙伴依赖和合规工作量可能传导为交付失误、利润率压缩和估值叙事变弱。下方风险热力图和传导图说明，投资论点应按整合与控制故事来承销，而不只是机器人增长故事。
