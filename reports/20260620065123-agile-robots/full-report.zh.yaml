      - number: '8.4'
        title: 最终尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Agile
              的尽调负担很明确，也可操作，但任何委员会上调建议前都必须把这些问题清掉。第一，投资者需要当前定价证据：最新融资轮、董事会估值或真实二级交易价格。第二，需要经济性，包括毛利率、运营开支、资本开支以及主要项目的现金消耗。第三，需要清算优先栈和分配瀑布，因为企业价值看起来健康时，普通股结果仍可能很差。第四，需要证明部署规模正在转化为粘性客户，以及软件或服务变现。在这些要求得到回答前，正确动作是监控否决触发器，而不是追逐上行标题。如果量产滑坡、集成破裂、AI
              伙伴变成集中风险，或公司以高度结构化条款融资，估值就应向传统自动化供应商压缩，而不是按 AI 溢价平台定价。
