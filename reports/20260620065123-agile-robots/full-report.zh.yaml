        title: 架构、控制与开发者界面
        blocks:
          - type: paragraph
            body: >-
              Agile 的公开架构故事在继承或连接 Franka 研究技术栈的地方最强。Diana 7 有最清晰的技术规格界面：七轴扭矩传感、7 kg 载荷、923 mm 臂展、±0.05 mm 重复定位精度，以及 0.5
              N 力控精度。关键产品开发动作是加入 Franka Control Interface 支持，暴露 1 kHz 实时控制，并把 Diana 7 接入 libfranka、ROS、ROS 2、MATLAB 和
              Simulink 生态。这是一座有意义的技术桥梁，因为它让 Agile 从纯工业叙事进入研究和开发者流程，而该流程已经拥有工具和社区预期。GitHub 证据强化了这一点。libfranka
              明确是低层级、实时的；franka_ros2 明确处于活跃开发中，并以 ROS 2 Humble 为中心。与此同时，Agile Hand 暴露自己的 1 kHz 通信路径和 C++ / Python / ROS
              兼容性，而 AgileCore 走向相反方向，用自然语言任务创建、基于 RAG 的设置指导和自优化行为来抽象控制。合在一起，这些来源指向双层架构：面向高级用户的低层级直接控制可信度，以及面向更广部署的高层级 AI
              抽象层。这很有吸引力，但也意味着公司必须同时维护硬核控制保真度和易用编排。
