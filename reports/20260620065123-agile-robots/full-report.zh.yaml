      - number: '4.2'
        title: 规模、收购与资本建设
        blocks:
          - type: paragraph
            body: >-
              公司的公开战略明确是规模优先且资本密集。员工数引用从 2024 年 3 月的超过 1,700 人，升至 2026 年 Amazon Business 案例研究中的超过 2,300 人，以及 2025 年末 /
              2026 年报道中的超过 2,500 人；仅 thyssenkrupp 交易就增加约 650 名专家和约 10
              个地点。这种扩张不只是有机增长：它由一轮有意的并购整合推动，收购对象包括困境资产、战略资产和能力增厚资产。Franka 在破产后保住了敏感机器人装机基础；BÄR 增加系统集成传承；idealworks 增加带有
              BMW 可信度的规模化厂内物流生态；tkAE / Krause 增加工厂工程纵深和长期 OEM 关系。独立物流报道还称，Agile Robots 每年在德国投入超过 €80 million 研发，并已落地超过
              10,000 个自动化解决方案。与此同时，Agile One 生产、Kaufbeuren 的 Franka
              重启，以及横跨欧洲、中国和印度的生产运营，都意味着沉重的制造和集成负担。如果收入质量跟上，这一战略可以形成强护城河；但它也意味着资本正同时被招聘、收购、制造和算力消耗，而不是流向单一可控项目。
