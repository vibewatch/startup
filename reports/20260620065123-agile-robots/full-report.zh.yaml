  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户流程
        blocks:
          - type: paragraph
            body: >-
              Agile Robots 已不再像单一机械臂厂商。公开产品组合覆盖精密协作机器人、力控研究友好型机械臂、移动机器人、人形机器人系统，以及一个用于协调这些系统的 AI
              软件层。放到客户流程里，公司卖的是智能生产系统的想法，而不是彼此割裂的机器人单元：机械臂处理操作，移动平台处理工位之间的移动和编排，AgileCore
              处理配置和优化，更新的基础模型界面承诺随着时间推移减少手工编程。最高确信度证据仍来自具体硬件页面。Diana 7 明确定位在力敏感、高精度操作；Yu 5 Industrial 强调视觉驱动协作自动化；Thor
              产品线覆盖更广载荷和臂展区间；Agile Hand 把技术栈延伸到灵巧末端执行器；移动机器人页面展示机械臂如何与伙伴 AMR 或 AGV 平台组合。这种广度有战略价值，因为 Agile
              可以向工厂推销一整套集成自动化项目，而不是一次卖一台机器人。它也提高了执行门槛，因为每一层都必须与技术栈其余部分可靠协同。
