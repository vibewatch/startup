  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Agile Robots 并不在一个整齐的单一品类盒子里竞争。它的公开定位落在协作自动化、力控操作、AI 驱动机器人和高混线生产流程的交叉点。这意味着买方至少可以用四条替代路径解决同一任务。第一类是
              Universal Robots、ABB、KUKA、FANUC 等广义协作自动化领导者，它们把机械臂与软件、培训、服务和集成支持打包。第二类是 Flexiv 和 Franka
              等灵巧与力控专家，主要卖点是敏感操作，而不是目录广度。第三类是 Dobot
              等低成本出口商，靠价格、伙伴触达和广泛入门级产品覆盖拉宽采用。第四类是买方侧替代：继续延长人工流程、混合使用集成商选择的组件，或选择更宽的工业自动化供应商，让机器人套件嵌入更大的工厂标准化项目。行业数据也重要。IFR、VDMA
              和多家市场研究公司都指向庞大且仍在增长的机器人市场，但也显示买方注意力越来越被全球规模厂商、亚洲供应和 AI 重叙事牵引，而不是一个干净独立的「协作机器人」细分。
