appendices:
  - id: A
    title: 最终尽调问题
    blocks:
      - type: list
        title: 投委会升级前必须补齐的事项
        items:
          - 当前价格锚：最新轮次、董事会估值或真实二级市场成交
          - 单位经济性：毛利率、服务收入占比、支持负担和资本开支强度
          - 资本结构：优先权堆栈、反稀释条款和控制权图谱
          - 商业质量：按主要客户群组拆分的续约、集中度和扩张证据
          - 被收购业务的整合评分卡，以及人形机器人投入保持纪律的证明
        claimRefs:
          - CV035
          - CV039
          - CV040
          - CV041
          - CV043
