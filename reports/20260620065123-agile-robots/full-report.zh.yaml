  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是多元自动化技术栈，而不是单一产品业务。Agile Robots 营销机器人硬件、控制软件和应用 AI；2023-2026 年的收购增加了互补界面：Franka
              扩展研究和敏感机械臂系统，idealworks 增加 AMR 硬件以及车队软件和仿真，thyssenkrupp Automation Engineering / Krause
              增加交钥匙产线工程和安装。这构成了硬件收入、软件或支持收入、项目型集成收入的合理组合。难点在于，公开申报没有披露每个界面的收入占比、收入如何确认，软件是单独货币化还是被打包。最强公开收入信号是
              Manufacturing Dive 引用公司口径称，2024 年收入约 €200 million，且同比翻倍。装机基础信号也很重要：BMW 提到生产中的 600 台、随后 850+ 台
              iw.hubs，物流行业报道则称 Agile Robots 已交付超过 10,000 个自动化解决方案。这些都是可观的商业线索，但仍弱于经审计分部报告。因此，收入问题不是 Agile Robots
              是否有商业活动——它显然有——而是收入组合是否足够经常性、高毛利且持久，足以支撑溢价机器人估值。
