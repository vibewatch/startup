            body: >-
              传统留存指标没有出现在公开记录中。已审阅资料均未披露客户数、NRR、GRR、流失率、续约率或合同期限。这意味着客户耐久性必须从运营行为而不是财务指标推断。最好的耐久性代理指标是 BMW：Agile 收购
              idealworks 全部股权后，BMW Group 仍是长期伙伴，装机基础还在按地域扩张。第二个耐久性代理指标是 Franka：2023 年破产相关中断后，2024
              年恢复生产，研究生态看起来仍完整，具名机构仍被引用为活跃用户。MoldTecs 等 idealworks 外部案例显示，受制于母公司之外也可能具备一定可复制性，尽管公开证据仍浅。扩张动态也高度依赖渠道。Agile
              越来越通过被收购生态触达客户——厂内物流中的 idealworks、研究中的 Franka、系统集成中的 BÄR，以及偏 OEM 自动化中的
