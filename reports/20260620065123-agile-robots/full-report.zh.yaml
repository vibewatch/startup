      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求逻辑很容易看到：市场报告持续把智能制造、AI、IIoT、更高劳动力成本和工厂效率压力列为机器人行业的持久顺风。ResearchAndMarkets 更进一步，把市场描述为从自动化转向自主化，这与 Agile
              Robots 的具身 AI 叙事高度吻合。但约束对估值同样重要。MarketsandMarkets 强调，协作机器人高成本、集成复杂和互操作性有限仍是持续障碍。这些障碍对 Agile Robots
              尤其相关，因为公司的系统价值越来越取决于整合硬件、软件、数据和被收购业务线，而不是销售一台孤立的机械臂。因此，切换成本很可能只有在客户把完整技术栈运营起来之后才会出现。这可以成为护城河，但也意味着实施风险高，商业化扩张需要耐心的证据点。公开定价仍缺席，所以回收期和单位经济性仍靠推断。投资人应把这个品类按战略重要且可能很大的市场来承销，但还不能把它视作一条测量清晰、无摩擦的采用曲线。
