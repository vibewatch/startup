            body: >-
              公开融资证据呈现出熟悉的深科技路径：早期由中国相关创投投资，随后 SoftBank Vision Fund 2 领投的高能见度 Series C 奠定了 Agile Robots
              的独角兽定位。公司自己的融资公告可以让我们还原从天使和种子支持，到 Pre-A，再到八位数 Series A，最后到 US$220 million Series C
              的序列。这足以证明资本可得性、投资人质量，以及投资方愿意为资本密集型机器人扩张继续输血。但这些信息不足以还原控制权或当前持股比例。利益相关方图景不止股权资本。BMW 通过 idealworks
              仍具战略相关性，Google DeepMind 则在 2026 年成为智能层伙伴。这些关系重要，因为 Agile Robots
              的执行模式既依赖生态杠杆，也依赖融资本身。缺点是披露不透明：估值、员工数和收入信号出现在新闻稿和访谈里，但公司仍像一家私营企业，只在战略上有用时选择性披露动能指标。
