      - number: '5.3'
        title: 工业 AI 技术栈与生态依赖
        blocks:
          - type: paragraph
            body: >-
              Agile 的产品叙事越来越像基础模型叙事。Google DeepMind 合作明确把 Gemini Robotics 模型与 Agile 硬件和真实部署数据相连。Industrial AI Cloud
              界面更进一步，主张真实工业数据、合成仿真数据和人类示范数据会汇入一个专有机器人基础模型，并在 NVIDIA 和 Deutsche Telekom 基础设施上训练。NVIDIA 在多个层面都重要：Agile
              称自己多年使用 NVIDIA 工具，正在测试 Cosmos 3 用于仿真和数据生成，并出现在 NVIDIA 自己列出、使用 Cosmos、Isaac Sim 和 Isaac Lab
              的人形机器人建设者名单中。生态也通过 Franka 和 GTC 演示循环，Agile 在那里围绕双臂 Diana 7
              设置展示遥操作和数据采集。这套架构可能成为真实优势，因为它把现有部署转成模型改进飞轮。风险同样清楚。产品智能并非完全自给自足。它依赖外部模型伙伴、外部算力平台和一条公众无法独立审计的大数据管线。这使伙伴可靠性、数据治理和训练经济性成为核心产品问题，而不是边缘议题。
