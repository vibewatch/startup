  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采用界面
        blocks:
          - type: paragraph
            body: >-
              对一家仍为私营的机器人公司来说，Agile Robots
              面向的客户界面异常宽。产品组合覆盖协作机械臂、敏感研究机器人、AMR、编排软件、仿真，如今还包括人形机器人系统。这种广度至少形成五个公开客户簇：汽车制造与厂内物流、非汽车制造与仓储、研究 /
              学术、电子与精密装配，以及新兴、可承接人形机器人的工厂流程。最强分层证据来自 idealworks 和 Franka，而不是大量公开的 Agile 核心品牌终端客户名单。BMW
              是规模化汽车使用的锚定参考账户；MoldTecs 和其他 idealworks 故事证明了非汽车仓储和制造相关性；Franka 和 Diana 7
              则通过点名机构建立了单独的研究与学术细分。产品组合还反复提到电子和精密装配，并由 Amazon Business
              的采购证据和公司材料中的行业引用间接支撑。这种广度是优势，因为它降低了对单一产品形态的依赖；但它也让披露挑战更难：公开记录显示 Agile Robots 能卖到哪里，却没有显示每个细分贡献多少收入。
