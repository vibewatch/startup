      - number: '4.4'
        title: 财务可见度缺口与结论
        blocks:
          - type: paragraph
            body: >-
              决定性尽调问题不是 Agile Robots 是否在扩张，而是公开证据是否足以判断扩张质量。答案是否定的。已审阅资料披露了历史融资、法律形式变更、收购逻辑、部署规模以及部分招聘 /
              研发代理指标。它们没有披露当前现金、月度烧钱、现金跑道、毛利率、库存强度、应收账款、订单积压转化、重大收购价格、债务义务或实际定价。即便找到的一条类似申报的线索，也只是前身 AG
              的注册摘录供应商结果，不含账目。这种不透明比通常更重要，因为公司正同时整合多项业务，维持巴伐利亚和亚洲制造，并叠加算力密集型 AI 项目。因此，财务结论是混合的：Agile Robots
              有足够公开证据显示市场牵引和工业雄心，值得继续尽调；但常规财务披露不足，无法承销收入质量、利润率路径或资本充足性。任何投资判断都必须依赖直接进入 data room，而不能只靠公开叙事。
