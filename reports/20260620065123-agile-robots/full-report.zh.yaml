      - number: '8.3'
        title: 牛市、基准与熊市框架
        blocks:
          - type: paragraph
            body: >-
              当前私有估值未披露，场景分析是把证据转成价值的唯一可辩护方法。最后一个公开收入数据点约 €200 million，可用来勾勒粗略区间，而不是精确目标。基准情形下，Agile
              更像一个规模较大、仍在增长、但披露不透明的工业机器人平台，值得尊重，却不该获得不受约束的 AI 稀缺性定价。对应粗略区间为 €0.8 billion 至 €1.2 billion。牛市情形不能只靠标题，需要证明
              DeepMind
              加持的智能、自研人形机器人生产和并入平台能转化为持久收入质量与利润率扩张。熊市情形同样合理：人形机器人经济性若仍停留在宣传层面，集成负荷若压缩利润率，或新资本以偏向内部人的条款进入，都可能触发下行。换句话说，场景区间宽，是因为披露薄，不是因为市场机会小。
