      - number: '1.4'
        title: 里程碑、收购与整合风险
        blocks:
          - type: paragraph
            body: >-
              2023-2026 年的里程碑模式是当前公司故事的核心。Agile Robots 并不只是放大原有协作机器人产品线；它通过收购和相邻合作拼出一个更宽的工业平台。Franka 带来陷入困境但仍有价值的机器人 IP
              和研究平台，BÄR 带来运输与自动化经验，idealworks 带来厂内物流软件和 AMR 暴露，thyssenkrupp Automation Engineering 则显著加深了工业纵深和 OEM 关系。到
              2026 年初，公司在这一被收购的工业底座之上叠加 Google DeepMind 合作，明确推进自主、重推理的具身 AI。这一序列支持一个判断：Agile Robots
              正在成为整合者和系统集成商，而不只是设备制造商。但执行风险也真实存在。Franka 来自破产程序，收购后的运营 KPI
              仍稀薄，围绕员工、部署量和收入的公开规模主张仍是新闻稿级别而非经审计。整体里程碑记录因此令人印象深刻，但仍取决于公司能否把差异很大的资产、客户群和技术栈整合成功。
