      - number: '2.3'
        title: 买方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              保留资料指向一个多角色采购过程。汽车、电子、物流和相邻工业运营商是主要终端市场，但买方不总是终端用户。工厂工程和运营团队掌握流程痛点，采购和供应链团队感受可得性和交期压力，物流负责人关心厂内物流效率；涉及
              AgileCore 或异构车队时，系统集成商也很关键。产品级证据进一步细化了买方图谱。Diana 7 和 Yu 5 服务对灵巧性和协作敏感的任务。移动机器人服务运输和厂内物流。Agile ONE
              把故事延伸到跨工位劳动力替代或增强，但仍在工厂和物流内部，而不是消费场景。DeepMind 合作报道通过点名电子、汽车、数据中心和物流作为初始目标，强化了工业优先路径。ARENA2036 和工业 AI
              云又提供了额外证据：采用可以通过研究、试点和数据合作来中介，而不只是直接一次性设备销售。
