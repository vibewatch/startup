      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Agile 的护城河真实存在，但有条件。证据支持它围绕灵巧力控、研究级控制保真度和 AI 优先操作形成差异化位置。但这个护城河不等于免疫对手回应。ABB、FANUC、KUKA 和 UR
              拥有更大的装机基础、更强的分销肌肉和更成熟的软件服务循环。Flexiv 直接在自适应力控话语上竞争。Franka 仍把研究与开发者社区表面做得有吸引力。Dobot
              和其他中国出口商压低协作机器人价格栈底部。同时，第三方行业报道越来越把这个行业描述为从基础自动化走向自主化、AI 驱动机器人，并最终走向人形或通用系统，这会扩大未来进入者和相邻替代品清单。结果是，Agile
              不能只靠品类新鲜感。它在精度要求高、触觉强、高混线制造任务中应最强，因为力控和学习能力会立刻发挥作用。当买方想要低前期成本、全球现场服务，或希望一家供应商已经掌握工厂更广自动化标准时，它应最弱。
