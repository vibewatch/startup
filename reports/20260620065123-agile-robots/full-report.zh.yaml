              监管 / 法律负担很重，因为 Agile 结合了实体机器人、工业软件、跨境生产和模型训练基础设施。欧盟 dual-use 和美国 EAR 框架并不能证明 Agile
              目前每一笔出货都需要许可，但它们确立了一个事实：先进机器人硬件、软件和技术援助可能因目的地和最终用途而受控。另行看，AI Act
              已在欧洲施加基于风险的制度，禁止性做法已经生效，高风险义务也接近实施里程碑。公开证据足以说明合规成本和文档负担正在上升，但不足以显示逐产品准备情况。遗留收购资产问题也重要。Franka 经历破产，Munich
              Startup 报道了围绕收购的补贴欺诈调查，Franka 出售还引发德国 - 中国审查公开关注。这种组合提高了客户、贷款方和监管机构要求比标准自动化供应商更扎实尽调包的概率。
