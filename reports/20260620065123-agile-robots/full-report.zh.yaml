            body: >-
              本章最强的直接客户证据是 BMW / idealworks。BMW 先在 2023 年披露厂内物流流程中有超过 600 台 iw.hubs；2025-2026 年 idealworks 证据集把这一数字推进到全球
              BMW 生产基地的 850+ 台机器人，每天约 30,000 次任务，98% 可用性。这些是强运营指标，尤其因为它们绑定具名工厂和持续生产环境，而不是会议
              demo。非汽车证据不那么丰富，但仍真实存在：idealworks 的客户故事页面点名 MoldTecs，并称其 Sonneberg 工厂运行八台 iw.hubs，每天约 1,700 次任务。Amazon
              Business 提供另一类具名证据——不是产品收入，而是一个实时供应商关系，Agile 报告电子件成本降低、交期改善。Franka 又增加一层证据：2023 年破产后，Agile 从 Kaufbeuren
              重启发货，并引用 MIT、Stanford、ETH Zurich、Max Planck 和 NVIDIA 的持续使用。结果是，部署和连续性证据可信，但 Agile 品牌工业机器人仍缺少广泛公开的具名生产买方名单。
