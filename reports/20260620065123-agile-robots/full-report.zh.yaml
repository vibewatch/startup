      - number: '1.2'
        title: 领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              领导层证据最集中在创始人和 2024 年法律形式转换，公开董事会披露则薄得多。Chen 和 Meusel 不是泛泛的商业创始人；公司和第三方资料反复把他们与 DLR 的机器人工作相连，这也解释了 Agile
              Robots 的公开叙事为什么强调灵巧、力控和先进感知，而不是单纯替代人力。治理记录显示，2024 年 3 月 Agile Robots 从 AG 转为
              SE，这是一个有意义的正式动作，更符合一家预期开展泛欧洲增长、跨境运营并扩大机构形象的公司。质量和运营体系信号也有支撑：ISO 9001 认证和反复提到的内部制造，都强化了 Agile Robots
              希望被视为生产级公司的定位。未解的问题是所有权和控制权细节。可用资料中没有申报级公开股权表，没有清晰披露的董事会图谱，也没有详细债务或控制权披露，因此领导层质量比治理透明度更容易评估。
