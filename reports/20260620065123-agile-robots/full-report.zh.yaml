  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与承保立场
        blocks:
          - type: paragraph
            body: >-
              公开证据足以让投资者认真看待 Agile Robots：它已经是一家有规模的工业机器人平台。但这些证据还不足以支持在未说明的高溢价估值上把公司承保为明确买入。公司确实有硬资产：超过 20,000
              套已部署系统、公开约 €200 million 收入数据点、庞大员工规模、多国制造能力，以及围绕 DeepMind、NVIDIA、Deutsche Telekom 和慕尼黑 AI
              生态的势能。这些不是表面信号。问题在价格敏感性。已抓取来源披露了历史融资轮次和 2021 年独角兽里程碑，却没有披露 2026 年当前估值、清算优先栈或运营经济性。因此，近期正确立场是跟踪 /
              继续研究：保持贴近，拿到资料室，在毛利、烧钱和商业韧性得到证明前，不把叙事势能折算成溢价入场价。下方建议表和逻辑图说明，单靠规模还不够。这个披露缺口正是入场需要耐心的原因。
