      - number: '8.2'
        title: 融资背景与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              Agile 的融资历史亮眼，而且跨度够长，值得重视。公司从早期 8 位数融资推进到 2019 年 pre-A，再到 SoftBank 领投的 2021 年 Series C，第三方档案还指向 2022
              年后续融资。这段历史支撑了一个判断：风险投资人反复为这个平台出资。但它并没有告诉我们公司今天值多少钱。公开可比公司覆盖也不干净。ABB、KUKA、FANUC、Teradyne / Universal Robots
              可以作为披露质量、规模和竞争广度的参照，但没有一家能与 Agile 这种仍为私营、AI
              权重高、收购活跃的平台做严格同类对比。这里最安全的可比用法是定性：它们说明在位者业务宽、资本充足、还要接受公开市场问责，这会抬高任何私营公司估值溢价的门槛。因此，下方可比表聚焦可比性边界，而不是假装上市同业倍数可以直接平移。
