      - 可监测触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 出口管制升级
        - 新增许可要求、出货受阻，或客户最终用途受限
        - 一个季度内两个或更多战略出货延迟或被拒
        - 在目的地管制被梳理清楚前，暂停承销跨境上行空间
      - - AI Act 合规滞后
        - 2027 年预算周期前没有具名负责人、风险映射或落地计划
        - 管理层无法展示产品级合规工作流
        - 将 AI 赋能扩张带来的估值上行视为未经验证
      - - 收购整合失手
        - Krause / Franka / idealworks 未兑现客户承诺，或出现领导层流失
