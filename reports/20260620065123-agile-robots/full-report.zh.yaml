companyProfile:
  summary: >-
    Agile Robots AG 由 Zhaopeng Chen、Peter Meusel 等 DLR 机器人研究人员于 2018
    年创立，已成长为一家总部位于慕尼黑的工业机器人平台，覆盖机械臂、灵巧操作、自动化工程、厂内物流软件和新的人形机器人项目。公开资料显示，公司业务靠 AI
    驱动硬件和系统集成支撑，而不是纯软件经济性，运营横跨德国、中国、印度和美国。战略动能真实存在：SoftBank 投资了 2021 年 Series C，BMW 和 idealworks 拓宽了工业入口，Franka 与
    thyssenkrupp Automation Engineering 扩大了资产底盘，Google DeepMind 以及与 NVIDIA 相关的 AI 基础设施强化了具身 AI
    叙事。主要尽调约束在披露质量：收入、员工数、部署量和估值信号仍停留在新闻稿级别，而非申报级别；当前利润率、烧钱速度、现金跑道和控制权安排均未公开。
