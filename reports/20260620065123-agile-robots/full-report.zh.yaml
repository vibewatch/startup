        - 下调工业协同论点，并假设更低收入倍数
      - - 云 / 模型伙伴依赖兑现成风险
        - 伙伴合同变化、算力瓶颈，或没有备用技术栈
        - 出现重大训练放缓或排他性约束
        - 将 Agile 重新定价为系统集成商，AI 可选性更弱
      - - 安全 / 质量事故
