evidenceGaps:
  - type: missing-source
    severity: material
    topic: ownership
    missingEvidence: Current cap table, board composition, and investor control-right disclosures.
    whyItMatters: Control and downside-protection terms affect refresh-risk, exit path, and governance assessment.
    diligencePath: Request the latest cap table, board observer list, shareholder agreement summary, and any debt documents.
    relatedQuestionRefs:
      - QO034
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated internal headcount bridge reconciling public references above 1,900, 2,300, and 2,500 employees.
    whyItMatters: People scale is central to cost structure, post-merger integration scope, and operating leverage.
    diligencePath: Ask management for month-end employee counts for 2024-2026 and acquisition-adjusted organic headcount.
    relatedQuestionRefs:
      - QO018
      - QO019
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: integration-risk
    missingEvidence: >-
      Post-acquisition KPIs for Franka, idealworks, and thyssenkrupp Automation Engineering, including revenue
      retention, backlog, and attrition.
    whyItMatters: The investment case increasingly depends on successful integration rather than only on original product traction.
    diligencePath: >-
      Request integration scorecards, retained-customer lists, backlog conversion data, and management attrition since
      close.
    relatedQuestionRefs:
      - QO025
      - QO031
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: A current, public board-and-management roster beyond the founders and named executive directors.
    whyItMatters: Leadership continuity and board independence influence key-person risk and scaling discipline.
    diligencePath: Request governance materials, current management org chart, and any SE supervisory structure documentation.
    relatedQuestionRefs:
      - QO034
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: Product-level pricing, package mix, and win-rate data needed to calculate a constrained Agile-specific SAM.
    whyItMatters: >-
      Top-down market estimates are too inconsistent to support a high-confidence revenue opportunity model by
      themselves.
    diligencePath: >-
      Request list pricing or realized ASP ranges, vertical revenue mix, and attach-rate data for software and mobility
      modules.
    relatedQuestionRefs:
      - QM025
      - QM030
  - type: private-evidence-only
    severity: material
    topic: roi
    missingEvidence: Named customer payback periods, implementation costs, and uptime/productivity deltas by workflow.
    whyItMatters: Without direct ROI evidence, adoption timing and sales-efficiency assumptions remain inference-driven.
    diligencePath: Request case studies with pre/post labor, defect, and cycle-time metrics plus deployment timelines.
    relatedQuestionRefs:
      - QM017
      - QM032
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Methodology notes reconciling what each analyst includes in market value (hardware only vs. software, integration,
      and services).
    whyItMatters: Different definitions can overstate or understate the relevant opportunity by several multiples.
    diligencePath: Obtain methodology excerpts or full reports for the retained market pages and normalize to a common scope.
    relatedQuestionRefs:
      - QM006
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: buyer-mix
    missingEvidence: Actual current revenue split across automotive, electronics, logistics, healthcare, and integrator channels.
    whyItMatters: Public product emphasis does not guarantee commercial concentration in the same segments.
    diligencePath: Ask management for booked revenue, pipeline, and deployment mix by end-market and product family.
    relatedQuestionRefs:
      - QM028
      - QM031
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized average selling prices, discounting behavior, and service-bundle economics by vendor and channel.
    whyItMatters: >-
      Public list-price proxies overstate comparability and can hide whether Agile wins or loses on all-in cost after
      integration and support.
    diligencePath: >-
      Request recent win/loss sheets, quote stacks, and post-integration TCO cases across Agile, UR, ABB, and FANUC
      opportunities.
    relatedQuestionRefs:
      - QP022
  - type: enumeration-incomplete
    severity: material
    topic: channel-density
    missingEvidence: Direct reseller, certified integrator, and field-service headcount counts by region for key competitors.
    whyItMatters: >-
      Distribution density often decides pilot conversion and after-sales comfort, especially when technical capability
      is close.
    diligencePath: >-
      Collect partner-directory counts, region-by-region service maps, and reference calls with integrators in Germany,
      North America, and China.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Observed post-deployment multi-homing, migration costs, and revalidation burden when customers switch robot
      platforms.
    whyItMatters: >-
      Competitive wins depend not just on technical superiority but on whether buyers can justify changing training,
      safety, software, and accessories.
    diligencePath: >-
      Interview recent customers and integrators about line-change projects, staff retraining, and safety
      recertification timelines.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: cash-runway-gap
    missingEvidence: Current cash balance, monthly burn, runway, and downside covenant triggers.
    whyItMatters: Capital adequacy and next-round dependence cannot be judged from public evidence.
    diligencePath: Request latest board package, cash waterfall, and monthly operating plan.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-gap
    missingEvidence: Gross margin, contribution margin, and service-delivery cost by hardware, software, and integration business line.
    whyItMatters: Without margin data the company could be scaling low-quality revenue behind attractive growth headlines.
    diligencePath: Request segment P&L, standard-cost build, and margin bridge for the last six quarters.
    relatedQuestionRefs:
      - QI014
      - QI016
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Top-customer pricing waterfall, renewal terms, and discounting policy by product family.
    whyItMatters: Pricing power and contract quality drive valuation far more than shipment counts alone.
    diligencePath: Review top 20 contracts, price realization data, and renewal rate deck.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
      - TI005
  - type: missing-source
    severity: minor
    topic: filing-visibility
    missingEvidence: Direct, current official registry extracts or filed annual accounts for the SE entity.
    whyItMatters: Registry visibility would improve legal-entity confidence but still would not replace operating metrics.
    diligencePath: Obtain Handelsregister and Bundesanzeiger extracts for Agile Robots SE / HRB trail.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: integration-risk
    missingEvidence: Purchase consideration, assumed liabilities, and synergy targets for Franka, idealworks, and tkAE.
    whyItMatters: Roll-up economics determine whether growth is accretive or cash-destructive.
    diligencePath: Request SPA summaries, integration budgets, and 24-month synergy scorecards.
    relatedQuestionRefs:
      - QI017
      - QI021
    relatedTableRefs:
      - TI004
      - TI006
  - type: private-evidence-only
    severity: minor
    topic: debt-obligations
    missingEvidence: Debt schedule, leases, guarantees, or project-finance exposure attached to manufacturing and acquired businesses.
    whyItMatters: Hidden obligations can shorten runway even when equity funding appears ample.
    diligencePath: Review debt register, lease commitments, and contingent-liability schedule.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: public-proof-gap
    missingEvidence: Public uptime, MTBF, field-incident, scrap, and cycle-time metrics for Diana 7, Yu 5, Thor, and Agile ONE.
    whyItMatters: >-
      The product story is currently much stronger on specifications and certifications than on operational production
      proof, which is what ultimately determines underwriting confidence.
    diligencePath: >-
      Request customer references, installation-level KPI dashboards, and field-service incident logs for the last 12
      months.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: >-
      Detailed security, privacy, data-rights, and model-governance controls for the Industrial AI Cloud and
      foundation-model pipeline.
    whyItMatters: >-
      Once robotics performance depends on training data and external compute, governance and data segregation become
      product risks rather than back-office issues.
    diligencePath: >-
      Ask for architecture reviews, cloud security attestations, red-team results, and customer data-handling contracts
      covering training use.
    relatedQuestionRefs:
      - QE023
  - type: enumeration-incomplete
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Direct Agile-owned public repositories, SDK usage metrics, issue velocity, and documentation analytics beyond the
      Franka developer surfaces.
    whyItMatters: >-
