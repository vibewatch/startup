- id: drivers-constraints
  title: Growth drivers, constraints, and valuation relevance
  body: 'The demand case is easy to see: market reports consistently cite smart manufacturing, AI, IIoT, higher labor costs, and factory-efficiency pressure as durable robotics tailwinds. ResearchAndMarkets goes further by framing the market as a shift from automation toward autonomy, which maps cleanly onto Agile Robots’ physical-AI narrative. Still, the constraints matter just as much for valuation. MarketsandMarkets highlights high cobot cost, integration complexity, and limited interoperability as persistent barriers. Those are especially relevant for a company like Agile Robots, whose system value increasingly depends on integrating hardware, software, data, and acquired business lines rather than on selling an isolated manipulator. Switching costs are therefore likely to appear only after customers operationalize the full stack. That can be a moat, but it also means implementation risk is high and commercial scaling requires patient proof points. Public pricing remains absent, so payback
    and unit economics are still inference-driven. Investors should underwrite the category as strategically important and plausibly large, but not yet as a cleanly measured, frictionless adoption curve.'
