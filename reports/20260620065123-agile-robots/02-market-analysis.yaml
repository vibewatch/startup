chapter:
  number: 2
  title: Market Analysis
  summary: Agile Robots operates in a structurally growing but methodologically messy industrial-automation market where flexible arms, software orchestration, mobility, and emerging humanoids are converging. The strongest public evidence points to buyer fit in automotive, electronics, and intralogistics, but SAM precision is still blocked by missing pricing and mix disclosures.
sections:
- id: boundary-and-segments
  title: Market boundary and included segments
  body: 'The biggest analytical mistake in this chapter would be to cite a giant “robotics” TAM and stop there. Agile Robots’ public footprint is not broad consumer robotics, nor is it only one industrial arm class. The retained evidence supports a narrower, more investable boundary: integrated industrial automation for factories and adjacent logistics, including fixed robot arms, collaborative robots, industrial software, mobile automation, and emerging humanoid workflows where they solve real production tasks. That boundary is consistent with the company’s own application pages, which emphasize assembly, machine tending, handling, inspection, and intralogistics rather than consumer or household use cases. It also explains why adjacent software and mobility matter. AgileCore addresses system integrators and operators, while the BÄR and idealworks-linked mobile robotics layer extends the product set into AMR, AGV, and mobile-manipulation programs. The result is a market definition that is
    evidence-based, operationally coherent, and much more useful than undifferentiated robotics spending headlines.'
  claimRefs:
