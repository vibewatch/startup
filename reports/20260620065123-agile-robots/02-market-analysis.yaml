    - Ask which deployments need software pull-through vs. stand-alone hardware
  - - Labor cost pressure and reshoring economics
    - Tailwind
    - Current
    - Improves robotics ROI in higher-cost production geographies
    - Test where Agile has strongest economics by geography and vertical
  - - Collaborative robots as a high-growth subsegment
    - Tailwind
    - Current and medium-term
    - Benefits flexible, lighter-payload automation use cases
    - Measure conversion from pilots to repeat programs for Yu 5 and Diana
  - - Humanoid systems moving from pilots toward industrial use
    - Tailwind but early
    - 2026 onward
    - Creates option value if Agile ONE proves reliability
    - Request pilot pipeline, failure rates, and cycle-time benchmarks
  - - High upfront cost of cobots and system integration
    - Headwind
    - Current
    - Can delay adoption and compress SME demand
    - Request pricing, implementation cost, and payback case studies
  - - Integration complexity and interoperability gaps
    - Constraint
    - Current
    - Raises deployment friction and lengthens sales cycles
    - Ask for average time-to-production and integration staffing needs
  - - Cyclical weakness in German automation demand
    - Headwind
    - '2026'
    - Can damp local order timing even in a structurally attractive sector
    - Break backlog by geography and industry
  - - Lack of public pricing transparency
    - Constraint
    - Current
    - Makes SAM and ROI models low confidence from public evidence alone
    - Request product-level ASPs, gross margin ranges, and contract structures
  notes: Driver and constraint timing is qualitative; the table mixes top-down market signals with company-specific adoption implications because valuation depends on both demand and implementation friction.
