  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: Product-level pricing, package mix, and win-rate data needed to calculate a constrained Agile-specific SAM.
    whyItMatters: Top-down market estimates are too inconsistent to support a high-confidence revenue opportunity model by themselves.
    diligencePath: Request list pricing or realized ASP ranges, vertical revenue mix, and attach-rate data for software and mobility modules.
    relatedQuestionRefs:
    - QM025
    - QM030
  - type: private-evidence-only
    severity: material
    topic: roi
    missingEvidence: Named customer payback periods, implementation costs, and uptime/productivity deltas by workflow.
    whyItMatters: Without direct ROI evidence, adoption timing and sales-efficiency assumptions remain inference-driven.
    diligencePath: Request case studies with pre/post labor, defect, and cycle-time metrics plus deployment timelines.
    relatedQuestionRefs:
    - QM017
    - QM032
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: Methodology notes reconciling what each analyst includes in market value (hardware only vs. software, integration, and services).
    whyItMatters: Different definitions can overstate or understate the relevant opportunity by several multiples.
    diligencePath: Obtain methodology excerpts or full reports for the retained market pages and normalize to a common scope.
    relatedQuestionRefs:
    - QM006
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
