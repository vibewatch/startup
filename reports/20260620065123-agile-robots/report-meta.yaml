companyProfile:
  summary: >-
    Agile Robots AG was founded in 2018 by DLR robotics researchers including
    Zhaopeng Chen and Peter Meusel and has grown into a Munich-headquartered
    industrial robotics platform spanning robot arms, dexterous manipulation,
    automation engineering, intralogistics software, and a new humanoid program.
    Public sources show a business built on AI-enabled hardware and systems
    integration rather than software-only economics, with operations in Germany,
    China, India, and the United States. Strategic momentum is real: SoftBank
    backed the 2021 Series C, BMW and idealworks broadened industrial access,
    Franka and thyssenkrupp Automation Engineering expanded the asset base, and
    Google DeepMind plus NVIDIA-linked AI infrastructure strengthen the physical-AI
    narrative. The main diligence constraint is disclosure quality: revenue,
    headcount, deployment, and valuation signals are press-level rather than
    filing-grade, and current margins, burn, runway, and control rights are not
    public.
  foundedDate: '2018-01-01'
  founders:
    - name: Dr. Zhaopeng Chen
      role: Founder & CEO
      background: >-
        Former DLR robotics researcher and the central founder-operator behind
        Agile Robots' force-control and industrial physical-AI expansion.
      claimRefs: [CO001]
    - name: Peter Meusel
      role: Co-founder
      background: >-
        Former DLR senior scientist with deep torque-sensor and manipulation
        expertise that anchors the company's technical origin story.
      claimRefs: [CO001]
  foundingLocation: Munich, Germany
  headquarters: Munich, Germany
  productSummary: >-
    Agile Robots sells AI-enabled industrial robot systems including Diana 7,
    Yu 5 Industrial, Agile Hand, AgileCore, AMR/AGV and automation offerings,
    acquired engineering capabilities, and the Agile ONE humanoid roadmap.
  customerFocus: >-
    Automotive, consumer electronics, logistics, healthcare, and industrial
    manufacturing customers that need contact-rich automation and systems
    integration.
  businessModel: >-
    Hardware, automation-system integration, software/control stack, service,
    and manufacturing-led commercialization rather than pure recurring software.
  stage: Private (late stage)
  fundingStatus: >-
    Public funding history runs from early angel/seed and pre-A rounds to an
    eight-figure Series A in 2020 and a US$220 million Series C in 2021 that
    marked Agile as a unicorn. Public profiles also reference a later 2022
    follow-on round, but current valuation and financing terms are not disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO005, CO008, CO011, CO012, CO020, CO021, CO031, CO035, CO036]
summary:
  headline: >-
    Agile Robots is a credible, scaled industrial robotics platform with real
    manufacturing depth and strong strategic partners, but the current entry case
    remains blocked by private-company opacity on pricing, margins, burn, and
    post-acquisition execution quality.
