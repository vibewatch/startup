  topStrengths:
    - >-
      Real industrial scale is visible in >20,000 deployed systems, ~EUR200 million 2024 revenue disclosure, and a
      multi-country operating footprint.
    - >-
      The company combines DLR-derived robotics depth with manufacturing, systems-integration, and partner leverage
      rather than relying on demos alone.
    - >-
      Strategic relationships with SoftBank, BMW/idealworks, Google DeepMind, Deutsche Telekom, and NVIDIA materially
      strengthen market access and technical credibility.
    - >-
      Acquisitions of Franka, BÄR, idealworks, and thyssenkrupp Automation Engineering give Agile a broader product and
      customer base than a single-arm robotics startup.
  topRisks:
    - >-
      Current valuation, margin structure, burn, runway, and liquidation preferences are undisclosed, preventing
      conviction underwriting.
    - >-
      Multiple acquisitions plus a new humanoid program increase integration complexity, capital intensity, and
      management bandwidth risk.
    - >-
      Public revenue, headcount, and deployment metrics are press-level claims rather than audited or filing-grade
      disclosures.
    - >-
      Cross-border Germany-China operations and advanced AI/robotics work add geopolitical, export-control, and
      compliance exposure.
    - >-
      Humanoid and physical-AI upside may be priced ahead of provable industrial ROI if current momentum does not
      translate into durable economics.
  unresolvedGaps:
    - Current priced valuation or secondary-market evidence after the 2021 unicorn benchmark
    - Audited revenue quality, gross margin, opex, capex, burn, and runway disclosures
    - Cap-table, board-control, and preference-stack details across major funding rounds
    - Customer retention, concentration, renewal quality, and software/service monetization evidence
    - Post-acquisition integration KPIs for Franka, idealworks, BÄR, and thyssenkrupp Automation Engineering assets
