- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing Private Metric
  - Impact
  - Exact Diligence Path
  rows:
  - - Revenue mix by hardware / software / integration
    - Cannot judge revenue quality or cyclicality
    - Request 2024-2026 revenue bridge by business line and geography
  - - Gross margin by line
    - Cannot distinguish scalable software economics from low-margin integration work
    - Request monthly gross margin and service-delivery cost by product family
  - - Cash, burn, and runway
    - Cannot assess dependence on next equity round or debt
    - Request latest cash balance, burn bridge, and downside runway case
  - - Working capital / inventory / receivables
    - Cannot size manufacturing cash lock-up or milestone-payment exposure
    - Request inventory turns, receivable aging, deferred revenue, and payables terms
  - - M&A purchase consideration and liabilities
    - Roll-up economics are opaque; integration cost cannot be modeled
    - Request signed SPA economics, integration budget, and synergies plan
  - - Customer pricing / contract structure
    - Cannot infer realized pricing power or discounting
    - Request top 20 contracts, renewal terms, and price waterfall
  notes: Each row is a material diligence blocker. Public evidence is strongest on scale and strategy, weakest on quality-of-revenue and balance-sheet visibility.
