- id: compute-and-operating-efficiency
  title: Compute Dependence and Operating-Efficiency Proxies
  body: 'Agile Robots is also unusual in that its public capital story now includes AI infrastructure, not just robots and factories. The company has committed to train foundation models on Deutsche Telekom and NVIDIA''s Industrial AI Cloud starting in 2026, and it separately publicizes early access to NVIDIA Cosmos 3 for simulation. The company''s own explanation of the Industrial AI Cloud makes the trade-off clear: generalized robot intelligence requires large datasets, powerful cloud infrastructure, and scalable training loops. In other words, model ambition becomes an operating-cost line even before it is a revenue line. Public sources do not disclose reserved GPU capacity, cloud spending, or unit economics for model training, so investors cannot tell whether compute is a manageable differentiator or a hidden drag on runway. The only concrete operating-efficiency proxy located in public sources is on the procurement side: Amazon Business quotes Agile Robots'' procurement head saying
    some electronics categories have already seen lower costs plus better availability and lead times. That is useful evidence that supply-chain discipline matters inside the organization, but it is still a narrow proxy rather than proof of strong gross margin or CAC efficiency.'
  claimRefs:
  - CI023
  - CI024
  - CI025
  - CI026
