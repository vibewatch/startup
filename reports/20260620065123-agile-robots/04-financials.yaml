- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit / Buyer
  - Current Value / Status
  - Quality
  - Diligence Ask
  rows:
  - - Robot hardware (Diana, Yu, Franka, Thor, Agile Hand)
    - One-time hardware sale plus integration/support
    - Industrial manufacturers; research labs for Franka
    - Active; product families publicly marketed, but no disclosed hardware revenue split
    - Medium — product existence is clear, monetization detail is opaque
    - Request 2024-2026 hardware revenue and gross margin by family
  - - Automation software (AgileCore / AI stack)
    - Software bundled with deployments; potential license/support revenue
    - System integrators and operators
    - Active platform, but no stand-alone pricing or software ARR disclosed
    - Low-to-medium — platform role is clear, contract model is not
    - Request software license structure and attach rate
  - - AMR / intralogistics ecosystem (idealworks)
    - AMR hardware, fleet software, simulation, and services
    - BMW plus external logistics / warehousing customers
    - Scaled installed base with 600+ then 850+ iw.hubs; external customer base expanding
    - High on deployment proof, low on revenue conversion
    - Request idealworks revenue, recurring software share, and customer mix
  - - Turnkey plant integration (Krause / thyssenkrupp AE)
    - Project engineering, system integration, turnkey automation lines
    - Automotive, electronics, medtech, logistics customers
    - Acquisition closed in 2026; brings long-standing customer relationships
    - Medium — customer relevance clear, contract economics undisclosed
    - Request backlog, margin profile, and milestone-payment structure
  - - Procurement / supply-chain efficiency
    - Indirect cost savings rather than revenue stream
    - Internal operations, especially electronics categories
    - Amazon Business case shows lower costs and better lead times
    - Medium as cost proxy, not revenue evidence
    - Quantify annual savings and working-capital impact
  notes: Rows separate evidenced business lines from internal efficiency levers. Public sources confirm products, deployments, and acquisitions, but not revenue mix or recognition policy.
