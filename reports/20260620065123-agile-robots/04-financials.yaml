  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway-gap
    missingEvidence: Current cash balance, monthly burn, runway, and downside covenant triggers.
    whyItMatters: Capital adequacy and next-round dependence cannot be judged from public evidence.
    diligencePath: Request latest board package, cash waterfall, and monthly operating plan.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-gap
    missingEvidence: Gross margin, contribution margin, and service-delivery cost by hardware, software, and integration business line.
    whyItMatters: Without margin data the company could be scaling low-quality revenue behind attractive growth headlines.
    diligencePath: Request segment P&L, standard-cost build, and margin bridge for the last six quarters.
    relatedQuestionRefs:
    - QI014
    - QI016
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Top-customer pricing waterfall, renewal terms, and discounting policy by product family.
    whyItMatters: Pricing power and contract quality drive valuation far more than shipment counts alone.
    diligencePath: Review top 20 contracts, price realization data, and renewal rate deck.
