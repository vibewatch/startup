company:
  name: Agile Robots AG
chapter:
  number: 4
  title: Financials
  summary: 'Agile Robots shows unusually strong public scale signals for a private robotics company — a disclosed US$220M Series C, a reported ~€200M 2024 revenue proxy, 2,300-2,500+ employees in 2025-2026 references, and a capital-intensive roll-up of Franka, idealworks, and thyssenkrupp Automation Engineering. But that scale signal is not matched by conventional disclosure: no cash, burn, runway, gross margin, working-capital, backlog, or acquisition-price data is public, leaving revenue quality and capital adequacy materially under-evidenced.'
sections:
- id: revenue-model-and-public-traction
  title: Revenue Model and Public Traction
  body: 'Public evidence supports a diversified automation stack rather than a single-product business. Agile Robots markets robot hardware, control software, and applied AI; the 2023-2026 acquisitions add complementary surfaces: Franka extends research and sensitive-arm systems, idealworks adds AMR hardware plus fleet software and simulation, and thyssenkrupp Automation Engineering / Krause adds turnkey line engineering and installation. That creates a plausible mix of hardware revenue, software or support revenue, and project-based integration revenue. The challenge is that public filings do not disclose what share comes from each surface, how revenue is recognized, or whether software is separately monetized versus bundled. The strongest public top-line signal is Manufacturing Dive''s company-cited figure of about €200 million revenue in 2024 after year-over-year doubling. Installed-base signals are also material: BMW references 600 then 850+ iw.hubs in production, and logistics trade
    coverage says Agile Robots has already delivered more than 10,000 automation solutions. Those are substantial commercial breadcrumbs, but they are still weaker than audited segment reporting. The revenue question is therefore not whether Agile Robots has commercial activity — it clearly does — but whether the mix is recurring, high-margin, and durable enough to justify a premium robotics valuation.'
