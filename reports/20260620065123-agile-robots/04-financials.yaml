    - Industrial AI Cloud and simulation programs are public; cost commitments are not
    - Compute may become a growing cash-consumption line
    - Request contracted cloud spend and GPU reservation terms
  notes: This table separates what is truly disclosed from what remains opaque. It should be read as a financing-dependency checklist, not a balance sheet.
