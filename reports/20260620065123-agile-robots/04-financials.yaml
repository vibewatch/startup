  - CI016
  - CI020
  - CI021
- calloutType: risk
  title: Opacity on margin and runway is the main blocker
  body: The absence of cash, burn, gross-margin, pricing, and acquisition-price disclosure means the public record cannot distinguish a high-quality robotics platform from a capital-hungry roll-up with weak unit economics. This is the central blocker for valuation work.
