callouts:
- calloutType: strength
  title: Industrial scale is real, not hypothetical
  body: 'Even with weak financial disclosure, the company''s public evidence base is stronger than many private robotics peers: BMW AMR scale, 10,000+ deployments, 2,300-2,500+ employees, 650 incoming tkAE staff, and >€80M annual Germany R&D spend all point to a business already operating at industrial weight.'
  claimRefs:
