    - Named institutions continue to rely on Franka tactile capabilities; shipments resumed after 2023 distress
    - No unit counts or renewal data
  notes: Table is intentionally partial because the company does not publish a full named-customer roster. The strongest direct proof is BMW; Franka research users are named but not quantified.
