- id: retention-durability-and-expansion
  title: Retention, Durability, and Expansion Dynamics
  body: 'Traditional retention metrics are absent from the public record. No reviewed source discloses customer count, NRR, GRR, churn, renewal rates, or contract length. That means customer durability has to be inferred from operational behavior rather than from finance metrics. The best durability proxy is BMW: the Group remains a long-term partner after Agile acquired all of idealworks, and the installed base keeps expanding geographically. A second durability proxy is Franka: after insolvency-related disruption in 2023, production resumed in 2024 and the research ecosystem appears intact, with named institutions still cited as active users. idealworks'' external cases such as MoldTecs suggest some repeatability beyond a captive parent, though the public proof remains shallow. Expansion dynamics are also channel-heavy. Agile increasingly reaches customers through acquired ecosystems — idealworks in intralogistics, Franka in research, BÄR in system integration, and Krause in OEM-heavy
    automation — rather than through publicly disclosed direct-sales funnels. That makes expansion plausible, but it also means the cross-sell thesis is hard to validate without CRM and cohort data.'
