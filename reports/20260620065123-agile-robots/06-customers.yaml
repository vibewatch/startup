- id: TU006
  title: Public Customer Blind Spots Table
  columns:
  - Missing Metric
  - Why It Matters
  - Exact Diligence Path
  rows:
  - - Customer count
    - Without it, 20,000 deployments cannot be translated into account breadth
    - Request active-customer count by product and geography
  - - Top-customer revenue concentration
    - BMW visibility may mask dependence
    - Request top-10 account revenue, gross margin, and renewal schedule
  - - Pilot-to-production conversion
    - Current funnel lacks denominators
    - Request opportunity, pilot, and production cohorts by quarter
  - - Retention / churn
    - No public renewal evidence for direct commercial accounts
    - Request NRR, GRR, churn, and expansion by cohort
  - - Contract length / pricing
    - Durability and pricing power cannot be inferred from deployment counts
    - Request sample contracts and pricing waterfall
  - - Acquired-unit customer overlap
    - Cross-sell thesis depends on overlap and attach rate
    - Review CRM dedupe, overlap map, and cross-sell pipeline
  notes: These blind spots matter because Agile Robots has credible deployment proof but thin public revenue-quality disclosure at the customer layer.
