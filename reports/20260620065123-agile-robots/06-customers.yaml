- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - BMW / idealworks reference account
    - High
    - Anchor account validates product but can dominate narrative and pipeline credibility
    - Request top-10 customer concentration and BMW revenue share
  - - External idealworks customers
    - Moderate
    - Shows non-captive adoption in manufacturing / warehousing
    - Request full named-customer list and annual recurring service revenue
  - - Research ecosystem (Franka / Diana 7)
    - Moderate
    - Strong ecosystem can seed future developers and buyers
    - Request lab-to-commercial conversion cases and reorder rates
  - - Acquired channel expansion (BÄR, Krause, Franka)
    - Moderate-to-high
    - Growth depends on integrating distinct channels and support teams
    - Review post-acquisition customer-retention and cross-sell scorecards
  - - Humanoid / Physical AI expansion
    - High execution risk
    - Could open new workflows but public customer proof remains pre-scale
    - Request paid pilots, backlog, and conversion rates by use case
  - - Procurement efficiency partnership
    - Low direct concentration, low direct revenue proof
    - Supports operations but does not diversify customer revenue
    - Quantify savings versus any direct revenue impact
  notes: Concentration is evaluated on evidence quality, not only account count. BMW dominates the strongest public proof even though external expansion is underway.
