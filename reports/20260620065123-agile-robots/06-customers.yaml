- id: concentration-risk-and-verdict
  title: Concentration Risk, Blind Spots, and Verdict
  body: 'The customer verdict is encouraging but incomplete. Agile Robots clearly has more than slideware: BMW / idealworks is scaled, MoldTecs is operational, Amazon is a live enterprise relationship, and Franka shows a durable research installed base that survived a distress event. Yet BMW dominates the public evidence quality by a wide margin. The strongest proof points, the densest metrics, and the cleanest named-account references all come from the same orbit, which raises concentration risk even if actual revenue concentration eventually proves lower. At the same time, the public record says little about retention, pricing power, contract structure, or top-account economics. The company also repeatedly cites electronics and precision assembly as strategic end markets, but named end-customer proof there remains thin. The right diligence conclusion is therefore balanced: customer traction is real and multi-segment, but revenue durability and concentration still require data-room evidence.
    In a sell-side process, the missing customer-metrics package would likely matter almost as much as the product narrative.'
