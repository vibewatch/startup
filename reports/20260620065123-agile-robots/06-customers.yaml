company:
  name: Agile Robots AG
chapter:
  number: 6
  title: Customers
  summary: 'Agile Robots has credible customer proof, but it is unevenly distributed: BMW / idealworks provides the clearest scaled production evidence, Franka provides a resilient research installed base, Amazon Business offers a procurement-efficiency reference, and idealworks adds non-automotive customer stories such as MoldTecs. What remains missing is the classic diligence layer — direct customer count, NRR / GRR, top-customer concentration, pilot-to-production conversion, and contract terms — so public evidence supports traction but not yet full durability underwriting.'
sections:
- id: segmentation-and-adoption-surface
  title: Customer Segmentation and Adoption Surface
  body: 'Agile Robots sells into an unusually broad customer surface for a still-private robotics company. The portfolio spans collaborative arms, sensitive research robots, AMRs, orchestration software, simulation, and now humanoid systems. That breadth creates at least five public customer clusters: automotive manufacturing and intralogistics, non-automotive manufacturing and warehousing, research / academia, electronics and precision assembly, and emerging humanoid-ready factory workflows. The strongest segmentation evidence comes through idealworks and Franka rather than through a large public roster of core Agile-branded end customers. BMW is the anchor reference account for scaled automotive use; MoldTecs and other idealworks stories demonstrate non-automotive warehousing and manufacturing relevance; Franka and Diana 7 establish a separate research and academia segment with named institutions. The portfolio also repeatedly cites electronics and precision assembly, supported indirectly
    by procurement evidence from Amazon Business and by sector references in corporate materials. This breadth is a strength because it reduces dependence on a single product form factor, but it also makes the disclosure challenge harder: the public record shows where Agile Robots can sell, not how much revenue comes from each segment.'
