- id: TU003
  title: Named Customer Proof Table
  enumerationScope:
    coverage: partial
    basis: Covers the principal publicly named 2024-2026 customer and user references for Agile Robots, idealworks, and Franka that are specific enough to evaluate deployment maturity and outcome quality; direct named end customers for core Agile-branded industrial robots remain sparse.
