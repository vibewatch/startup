- id: TU001
  title: Customer Segmentation Table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use Case
  - Scale
  - Revenue / Strategic Value
  - Gap
  rows:
  - - Automotive manufacturing / intralogistics
    - BMW production and logistics leadership / plant operators / BMW budget owner
    - AMR fleet orchestration, component movement, mixed-traffic logistics
    - 600+ iw.hubs in 2023; 850+ by 2025 across BMW sites
    - Best named scaled production proof; cornerstone reference account
    - No disclosed revenue share or contract duration
  - - Manufacturing / warehousing outside automotive
    - Operations and supply-chain teams / plant users / enterprise ops budgets
    - AMR workflows, warehousing, production supply
    - Named idealworks customers beyond BMW, incl. MoldTecs; external base described as growing
    - Evidence of marketability beyond captive spin-off history
    - Customer list is partial and revenue contribution undisclosed
  - - Research / academia
    - Lab leads / researchers / grant or institutional budgets
    - Force-sensitive robot research, AI, HRI, control experiments
    - MIT, Stanford, ETH Zurich, Max Planck, NVIDIA cited as users
    - Strong installed-base signal for Franka and research-grade controls
    - No spend per institution or renewal data
  - - Electronics and precision assembly
    - Manufacturing engineering / operator / capex owner
    - Precision assembly and smart vision applications
    - Sector repeatedly cited in corporate materials; procurement efficiency evidence in electronics
    - Supports industrial relevance and margin upside if scaled
    - Little public named end-customer proof
  - - Logistics / warehousing / service robotics
    - Warehouse ops / plant logistics / enterprise ops budgets
    - AMR fleets and emerging humanoid workflows
    - idealworks and Agile ONE materials target this segment directly
    - Major adjacency for cross-sell and future software attach
    - Humanoid deployments remain pre-scale and customer proof is thin
  notes: Segmentation combines direct named customer proof with sector-level evidence. Scale cells prioritize deployment proof over undisclosed revenue estimates.
