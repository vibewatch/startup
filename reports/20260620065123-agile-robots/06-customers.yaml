- id: named-customer-proof-and-outcomes
  title: Named Customer Proof and Outcome Evidence
  body: 'The chapter''s strongest direct customer proof is BMW / idealworks. BMW first disclosed more than 600 iw.hubs in intralogistics workflows in 2023, and the 2025-2026 idealworks evidence set moves that to 850+ robots across BMW production sites worldwide, with roughly 30,000 missions per day and 98% availability. Those are strong operating metrics, especially because they are tied to named plants and ongoing production environments rather than conference demos. Non-automotive proof is less abundant but still real: idealworks'' customer-stories page names MoldTecs and says its Sonneberg site runs eight iw.hubs for about 1,700 missions each day. Amazon Business provides a different kind of named proof — not product revenue, but a live vendor relationship where Agile reports lower electronics costs and better lead times. Franka adds another evidence layer: after the 2023 insolvency, Agile restarted shipments from Kaufbeuren and cites continued usage by MIT, Stanford, ETH Zurich, Max
    Planck, and NVIDIA. The result is credible proof of deployment and continuity, but not yet a broad public roster of named production buyers for Agile-branded industrial robots.'
