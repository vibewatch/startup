- id: trust-quality-and-maturity-risks
  title: Trust, Quality, and Maturity Risks
  body: 'The trust story is credible but uneven. Agile can point to ISO 9001 quality management certification, a TÜV SÜD-certified Safety Core assessed to IEC 61508, and TÜV SÜD certification of Yu 5 Industrial to IEC 61508, ISO 13849-1, and ISO 10218-1. Those are meaningful signals that the company has invested in formal quality and safety processes rather than treating AI and robotics as pure software experimentation. Production control is also becoming clearer: Kaufbeuren restarted Franka shipments from Bavaria, and Agile says it manufactures key products in-house. The same evidence also shows where maturity remains less proven. Agile ONE is strategically exciting, but the public record is still dominated by launch messaging, Hannover demos, and infrastructure announcements rather than broad field data. Public uptime, MTBF, field incident, and security-governance disclosure remains sparse across the stack. The DLR Agile Justin lineage helps explain why force control, tactile sensing,
    and whole-body AI appear as recurring strengths, but lineage is not the same thing as commercial reliability. Investors should therefore treat the current product story as strong on architecture, promising on ecosystem integration, and only partially proven on scaled industrial operating evidence.'
