    - idealworks + BÄR ecosystem expands beyond fixed-arm cells
    - Partner dependency and ownership boundaries complicate product accountability
  - - Agile ONE
    - Longer-horizon industrial humanoid buyer
    - Launch / demo stage in public evidence
    - Layered AI, dexterous hands, real-world industrial training data
    - Public proof still skewed toward launch and demo content rather than operating metrics
