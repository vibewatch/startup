  - - Agile Hand
    - Dexterous manipulation / research buyer
    - Shipping specialist end effector
    - 21 joints, haptics, 1 kHz communication, ROS and API support
    - Commercial attach rate to broader Agile systems not public
  - - AgileCore
    - System integrator / operator
    - Software platform actively marketed
    - Natural-language programming, RAG-based setup help, self-optimization
    - No public benchmarks on setup-time reduction or model accuracy
