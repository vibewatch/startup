company:
  name: Agile Robots AG
chapter:
  number: 5
  title: Product & Technology
  summary: 'Agile Robots presents an unusually broad industrial robotics stack for a private company: dexterous arms (Diana 7, Thor, Yu 5 Industrial), a humanoid program (Agile ONE), a multi-fingered hand, mobile-robotics partnerships, and an AI software layer in AgileCore. The strongest public technical evidence clusters around force-control and research-grade interfaces, especially Diana 7, FCI, Agile Hand, and the Franka developer ecosystem. The core product risk is not lack of ambition but proof depth: public specs, certifications, and partner announcements are abundant, while public uptime, security-governance, and production-performance evidence remains thin.'
sections:
- id: portfolio-and-customer-workflow
  title: Portfolio and Customer Workflow
  body: 'Agile Robots no longer looks like a single-arm vendor. Its public portfolio spans precision cobots, force-controlled research-friendly arms, mobile robotics, humanoid systems, and an AI software layer that is meant to coordinate them. In customer workflow terms, the company sells the idea of an intelligent production system rather than a disconnected robot cell: robotic arms handle manipulation, mobile platforms handle movement and orchestration across stations, AgileCore handles configuration and optimization, and newer foundation-model surfaces promise less manual programming over time. The highest-confidence proof is still on the concrete hardware pages. Diana 7 is clearly positioned for force-sensitive, high-precision manipulation; Yu 5 Industrial emphasizes vision-enabled collaborative automation; the Thor line covers broader payload and reach bands; Agile Hand extends the stack into dexterous end effectors; and the mobile-robotics pages show how arms can be combined with partner
    AMR or AGV platforms. That breadth is strategically valuable because it lets Agile pitch an integrated automation program to factories rather than one robot at a time. It also raises the bar on execution because each layer has to work reliably with the rest of the stack.'
