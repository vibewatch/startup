  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-proof-gap
    missingEvidence: Public uptime, MTBF, field-incident, scrap, and cycle-time metrics for Diana 7, Yu 5, Thor, and Agile ONE.
    whyItMatters: The product story is currently much stronger on specifications and certifications than on operational production proof, which is what ultimately determines underwriting confidence.
    diligencePath: Request customer references, installation-level KPI dashboards, and field-service incident logs for the last 12 months.
    relatedQuestionRefs:
    - QE022
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: Detailed security, privacy, data-rights, and model-governance controls for the Industrial AI Cloud and foundation-model pipeline.
    whyItMatters: Once robotics performance depends on training data and external compute, governance and data segregation become product risks rather than back-office issues.
    diligencePath: Ask for architecture reviews, cloud security attestations, red-team results, and customer data-handling contracts covering training use.
    relatedQuestionRefs:
    - QE023
  - type: enumeration-incomplete
    severity: minor
    topic: developer-signal
    missingEvidence: Direct Agile-owned public repositories, SDK usage metrics, issue velocity, and documentation analytics beyond the Franka developer surfaces.
    whyItMatters: Current developer signal is strong around the Franka research ecosystem, but it is less clear how much of that momentum transfers to AgileCore or the broader product stack.
    diligencePath: Collect internal SDK adoption metrics, developer portal analytics, and any public package or documentation traffic statistics.
    relatedQuestionRefs:
    - QE024
