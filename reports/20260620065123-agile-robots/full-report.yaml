  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Agile Robots is not competing inside a neat single-category box. Its public positioning sits at the
              intersection of collaborative automation, force-controlled manipulation, AI-enabled robotics, and
              higher-mix production workflows. That means the buyer can solve the same job through at least four
              alternative routes. First are broad collaborative automation leaders such as Universal Robots, ABB, KUKA,
              and FANUC, which combine arms with software, training, service, and integration support. Second are
              dexterity- and force-control specialists such as Flexiv and Franka, where the main selling point is
              sensitive manipulation rather than catalog breadth. Third are lower-cost exporters such as Dobot, which
              use price, partner reach, and broad entry-level product coverage to widen adoption. Fourth are buyer-side
              substitutes: staying with manual work longer, mixing integrator-selected components, or choosing a broader
              industrial automation vendor whose robotics suite sits inside a larger plant standardization project.
              Industry data also matters. IFR, VDMA, and multiple market-research firms all point to a large and
              still-growing robotics market, but they also show that buyer attention is increasingly pulled toward
              scaled global vendors, Asian supply, and AI-heavy narratives rather than a clean standalone "cobot"
              segment.
