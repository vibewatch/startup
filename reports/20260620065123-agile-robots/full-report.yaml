            body: >-
              Agile Robots is also unusual in that its public capital story now includes AI infrastructure, not just
              robots and factories. The company has committed to train foundation models on Deutsche Telekom and
              NVIDIA's Industrial AI Cloud starting in 2026, and it separately publicizes early access to NVIDIA Cosmos
              3 for simulation. The company's own explanation of the Industrial AI Cloud makes the trade-off clear:
              generalized robot intelligence requires large datasets, powerful cloud infrastructure, and scalable
              training loops. In other words, model ambition becomes an operating-cost line even before it is a revenue
