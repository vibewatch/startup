              training, so investors cannot tell whether compute is a manageable differentiator or a hidden drag on
              runway. The only concrete operating-efficiency proxy located in public sources is on the procurement side:
              Amazon Business quotes Agile Robots' procurement head saying some electronics categories have already seen
