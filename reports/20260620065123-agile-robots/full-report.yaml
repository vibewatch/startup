  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              Agile Robots enters 2026 with an unusually dense stack of simultaneous execution demands. The company is
              not merely selling more units; it is integrating Franka after insolvency, converting thyssenkrupp
              Automation Engineering into Krause Automation, consolidating idealworks, and layering DeepMind, NVIDIA,
              and Deutsche Telekom dependencies into its next product cycle. Public evidence shows real scale—roughly
              €200 million of 2024 revenue, more than 2,500 employees, and more than 20,000 deployed robotic systems—but
              that scale also amplifies the blast radius of any operational miss. The highest-severity risks are
              therefore not single-product defects; they are system risks in which integration slippage, partner
              dependency, and compliance workload can transmit into delivery misses, margin compression, and a weaker
              valuation narrative. The risk heatmap and transmission map below illustrate why the thesis should be
              underwritten as an integration-and-controls story, not only as a robotics growth story.
