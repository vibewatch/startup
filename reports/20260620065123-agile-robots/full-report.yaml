      - number: '1.2'
        title: Leadership and governance signals
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is strongest around the founders and around the 2024 legal-form conversion, and much
              thinner on public board disclosure. Chen and Meusel are not generic commercial founders; the company and
              third-party profiles repeatedly tie them to DLR’s robotics work, which helps explain why Agile Robots’
              public narrative emphasizes dexterity, force control, and advanced perception rather than labor-only
              automation. The governance record shows a meaningful formal step in March 2024 when Agile Robots changed
              from an AG into an SE, a structure more consistent with a company that expects pan-European growth,
              cross-border operations, and a wider institutional profile. Quality and operating-system signals are
              supportive: ISO 9001 certification and repeated references to in-house manufacturing reinforce that Agile
              Robots wants to be perceived as production-grade. What remains unresolved is ownership-control detail.
              There is no filing-grade public cap table, no clearly published board map, and no detailed debt or
              control-right disclosure in the available sources, so leadership quality is easier to assess than
              governance transparency.
