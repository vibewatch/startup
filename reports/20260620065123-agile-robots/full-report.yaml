      - number: '8.2'
        title: Financing context and comparable set
        blocks:
          - type: paragraph
            body: >-
              Agile's funding history is impressive and long-dated enough to matter. The company progressed from an
              8-figure early round to a 2019 pre-A, to a SoftBank-led 2021 Series C, and third-party profiles point to a
              2022 follow-on round as well. That history supports the claim that venture investors have repeatedly
              funded the platform. It does not, however, tell us what the company is worth today. Public comparable
              coverage is also mixed. ABB, KUKA, FANUC, and Teradyne / Universal Robots are useful reference points for
              disclosure quality, scale, and competitive breadth, but none is a neat apples-to-apples comp for a
              still-private, AI-heavy, acquisition-active platform like Agile. The safest use of comparables here is
              qualitative: they show that incumbents are broad, well-capitalized, and publicly accountable, which raises
              the bar for any private-company valuation premium. The comp table below therefore focuses on comparability
              limits rather than pretending public peer multiples are directly transferable.
