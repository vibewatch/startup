              The decisive diligence issue is not whether Agile Robots is scaling; it is whether the public evidence is
              sufficient to judge the quality of that scaling. It is not. The reviewed sources disclose historical
              fundraising, legal-form change, acquisition logic, deployment scale, and some hiring / R&D proxies. They
              do not disclose current cash, monthly burn, runway, gross margin, inventory intensity, receivables,
              backlog conversion, purchase prices for major acquisitions, debt obligations, or realized pricing. Even
              the one filing-like breadcrumb located is only a registry-excerpt vendor result for the predecessor AG and
              offers no accounts. That opacity matters more than usual because the company is simultaneously integrating
              multiple businesses, maintaining manufacturing in Bavaria and Asia, and adding compute-intensive AI
              programs. The financial verdict is therefore mixed: Agile Robots has enough public evidence of market
              traction and industrial ambition to justify continued diligence, but not enough conventional financial
              disclosure to underwrite revenue quality, margin path, or capital adequacy. Any investment case must hinge
