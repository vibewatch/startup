  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Premium valuation ask without disclosure
        - Management seeks a price well above public unicorn benchmark but with no current economics package
        - Turns momentum into unpriced opacity
        - Decline or require data-room transparency before proceeding
      - - Humanoid commercialization stalls
        - Series production slips or ROI evidence stays anecdotal through 2026
        - Bull case optionality collapses into cost center
        - Use base/bear range only and cut strategic premium
      - - Integration miss across acquired units
        - Material customer loss, restructuring, or delayed delivery emerges
        - Platform thesis becomes complexity thesis
        - Re-rate closer to conventional automation and reduce appetite
      - - AI partner dependence tightens
        - No fallback compute / model path or adverse contract terms surface
        - Optionality becomes concentration risk
        - Demand contractual diligence and lower entry price
      - - Capital need accelerates
        - New financing arrives with punitive preferences or heavy dilution
        - Common-equity upside can shrink despite enterprise growth
        - Rebuild waterfall before any investment decision
    notes: >-
      These kill triggers are designed to be monitored between first meeting and final IC approval, not only after
      investment.
    claimRefs:
      - CV012
      - CV016
      - CV035
      - CV039
      - CV040
      - CV041
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current valuation
        - Latest priced round, secondary, or board mark
        - Entry discipline depends on today's price, not the 2021 unicorn label
        - CFO / board materials
      - - Margins and burn
        - Gross margin, opex, capex, and cash runway by product family
        - Determines whether AI and humanoid optionality is value-accretive or dilutive
        - Finance data room
      - - Preference stack
        - Liquidation stack and anti-dilution terms
        - Common-equity outcomes can diverge sharply from enterprise value
        - Legal / financing docs
      - - Commercial durability
        - Retention, concentration, and software attach
        - Validates whether deployment scale converts into recurring economics
        - Revenue ops / customer analytics
    notes: >-
      Every diligence ask is tied to an evidence gap that keeps the recommendation from moving above track /
      research-more on public evidence alone.
    claimRefs:
      - CV035
      - CV039
      - CV040
