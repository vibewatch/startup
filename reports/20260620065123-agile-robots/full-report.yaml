  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and underwriting stance
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports taking Agile Robots seriously as a scaled industrial robotics platform, but it
              does not yet support underwriting the company as a clean buy at an unspecified premium valuation. The
              company has real assets: more than 20,000 deployed systems, a public ~€200 million revenue datapoint, a
              large employee base, manufacturing in multiple countries, and momentum around DeepMind, NVIDIA, Deutsche
              Telekom, and Munich's AI ecosystem. Those are not cosmetic signals. The problem is price sensitivity.
              Fetched sources disclose historical rounds and the 2021 unicorn milestone, but they do not disclose a
              current 2026 mark, liquidation stack, or operating economics. That means the right near-term stance is
              track or research-more: stay close, collect the data room, and refuse to convert narrative momentum into a
              premium entry price without proof on margins, burn, and commercial durability. The recommendation table
              and logic figure below show why scale alone is not enough. That disclosure gap is exactly why patience
              matters at entry.
            claimRefs:
              - CV004
              - CV014
              - CV016
              - CV017
              - CV035
