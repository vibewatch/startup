companyProfile:
  summary: >-
    Agile Robots AG was founded in 2018 by DLR robotics researchers including Zhaopeng Chen and Peter Meusel and has
    grown into a Munich-headquartered industrial robotics platform spanning robot arms, dexterous manipulation,
    automation engineering, intralogistics software, and a new humanoid program. Public sources show a business built on
    AI-enabled hardware and systems integration rather than software-only economics, with operations in Germany, China,
    India, and the United States. Strategic momentum is real: SoftBank backed the 2021 Series C, BMW and idealworks
    broadened industrial access, Franka and thyssenkrupp Automation Engineering expanded the asset base, and Google
    DeepMind plus NVIDIA-linked AI infrastructure strengthen the physical-AI narrative. The main diligence constraint is
    disclosure quality: revenue, headcount, deployment, and valuation signals are press-level rather than filing-grade,
    and current margins, burn, runway, and control rights are not public.
