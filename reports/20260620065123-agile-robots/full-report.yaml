      - number: '3.4'
        title: Moat Durability and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Agile's moat is real but conditional. The evidence supports a differentiated position around dexterous
              force control, research-style control fidelity, and AI-forward manipulation. But that moat is not
              equivalent to being insulated from response. ABB, FANUC, KUKA, and UR have larger installed bases,
              stronger distribution muscle, and more mature software-and-service loops. Flexiv competes directly on
              adaptive force-control language. Franka keeps the research and developer community surface attractive.
              Dobot and other Chinese exporters pressure the lower end of the collaborative-robot price stack.
              Meanwhile, third-party industry coverage increasingly frames the sector as moving from basic automation
              toward autonomy, AI-driven robots, and eventually humanoid or generalist systems, which expands the list
              of future entrants and adjacent substitutes. The result is that Agile cannot rely on category novelty
              alone. Its position should be strongest in precision-heavy, tactile, high-mix manufacturing tasks where
