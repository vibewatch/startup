      - number: '2.3'
        title: Buyer map and adoption path
        blocks:
          - type: paragraph
            body: >-
              The retained sources point to a multi-role buying process. Automotive, electronics, logistics, and
              adjacent industrial operators are the primary end markets, but the buyer is not always the end user. Plant
              engineering and operations teams own workflow pain, procurement and supply-chain teams feel availability
              and lead-time pressure, logistics owners care about intralogistics efficiency, and system integrators
              matter where AgileCore or heterogeneous fleets are involved. Product-level evidence sharpens the buyer map
              further. Diana 7 and Yu 5 serve dexterity-sensitive and collaborative tasks. Mobile robotics serves
              transport and intralogistics. Agile ONE extends the story into cross-workstation labor substitution or
              augmentation, but still inside factories and logistics rather than in consumer settings. The DeepMind
              partnership coverage reinforces this industrial-first path by naming electronics, automotive, data
              centers, and logistics as initial targets. ARENA2036 and the industrial AI cloud provide additional proof
              that adoption can be mediated through research, pilots, and data partnerships rather than only through
              direct one-shot equipment sales.
