      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              Because the current private valuation is undisclosed, scenario analysis is the only defensible way to
              translate evidence into value. The last public revenue datapoint of roughly €200 million lets us sketch a
              rough range rather than a precise target. In the base case, Agile looks like a large, growing, but still
              opaque industrial robotics platform that deserves respect yet not unchecked AI scarcity pricing. That
              yields a rough €0.8 billion to €1.2 billion range. The bull case requires more than headlines: it needs
              proof that DeepMind-enabled intelligence, in-house humanoid production, and acquired platforms convert
              into durable revenue quality and margin expansion. The bear case is equally plausible if humanoid
              economics remain promotional, if integration load compresses margins, or if new capital arrives on terms
              that favor insiders over new common investors. In other words, the scenario spread is wide because
              disclosure is thin, not because the market opportunity is small.
            claimRefs:
              - CV014
