chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating profile
        blocks:
          - type: paragraph
            body: >-
              Agile Robots presents itself as a Munich-headquartered provider of AI-powered automation rather than a
              single-product robot vendor. The official corporate surfaces consistently describe a stack that combines
              robot hardware, sensors, computer vision, force control, and software, and they place the company across
              automotive, consumer electronics, healthcare, logistics, and service workflows. The historical
              through-line is the founders’ DLR pedigree: Zhaopeng Chen and Peter Meusel built the company in 2018 out
              of force-controlled robotics and intelligent manipulation research, then expanded it into a multi-site
              manufacturing and R&D footprint. Public operating-footprint evidence is strong on geography and weaker on
              audited scale. Munich is the governance and R&D center, Kaufbeuren is a public production anchor, and
              official pages list additional operations in China, India, and the United States. That footprint matters
              because later strategic claims about physical AI, humanoids, and factory-scale deployments depend on
              having in-house manufacturing, integration capability, and industrial customer access across multiple
              geographies.
