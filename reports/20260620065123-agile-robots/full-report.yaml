      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory/legal burden is material because Agile combines physical robots, industrial software,
              cross-border production, and model-training infrastructure. EU dual-use and U.S. EAR frameworks do not
              prove that Agile currently needs licenses for every shipment, but they do establish that advanced robotics
              hardware, software, and technical assistance can become controlled depending on destination and end use.
              Separately, the AI Act now imposes a risk-based regime in Europe, with prohibited practices already
              effective and high-risk obligations approaching implementation milestones. Public evidence is strong
              enough to say compliance cost and documentation load are rising, but not strong enough to show
              product-by-product readiness. Legacy acquired-asset issues also matter. Franka came through insolvency,
              Munich Startup reported a subsidy-fraud investigation around the takeover, and the Franka sale attracted
              public Germany-China scrutiny. That combination raises the odds that customers, lenders, and regulators
              demand a more robust diligence package than a standard automation vendor would face.
            claimRefs:
              - CR001
