      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              Public industrial-robotics market sizes are directionally bullish but numerically inconsistent. That
              inconsistency is itself a finding, not a nuisance. Mordor, MarketsandMarkets, Verified Market Research,
              and Future Market Insights all show meaningful multi-year growth, yet they disagree sharply on the
              absolute 2026 base and the implied slope. The lowest retained 2026 estimate is roughly USD15.5 billion;
              the highest is USD65.1 billion. The spread is too large to treat any one publisher as canonical.
              Methodology appears to drive the divergence: some publishers seem closer to core robot hardware, while
              others fold in software, integration, collaborative systems, or broader automation layers. For diligence
              purposes, the more durable conclusion is that demand is structurally real, but bottom-up market modeling
              for Agile Robots must be constrained by product-fit and buyer evidence, not only by top-down TAM slides.
              The VDMA context helps on cyclicality: Germany remains an automation leader, but the local industry body
              still describes 2026 conditions as difficult, reminding us that adoption timing will move with
              manufacturing cycles rather than a perfectly smooth CAGR curve.
