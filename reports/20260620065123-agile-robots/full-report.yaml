      - number: '1.4'
        title: Milestones, acquisitions, and integration risk
        blocks:
          - type: paragraph
            body: >-
              The 2023–2026 milestone pattern is the heart of the current company story. Agile Robots did not simply
              scale an original cobot line; it assembled a broader industrial platform through acquisitions and adjacent
              partnerships. Franka added distressed-but-valuable robotics IP and a research platform, BÄR added
              transport and automation know-how, idealworks added intralogistics software and AMR exposure, and
              thyssenkrupp Automation Engineering materially increased industrial depth and OEM relationships. By early
              2026 the company layered a Google DeepMind partnership on top of that acquired industrial base, explicitly
              pushing toward autonomous and reasoning-heavy physical AI. This sequence supports the thesis that Agile
              Robots is becoming a consolidator and systems integrator, not only a device maker. It also creates real
              execution risk. Franka came out of insolvency, post-acquisition operating KPIs remain thin, and public
              scale claims around employees, deployments, and revenue are still press-level rather than audited. The
              overall milestone record is therefore impressive but still dependent on successful integration across very
              different assets, customer bases, and technical stacks.
