      - number: '1.3'
        title: Funding history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Public funding evidence shows a familiar deep-tech arc: early rounds from China-linked venture investors,
              then a prominent SoftBank Vision Fund 2-backed Series C that anchored Agile Robots’ unicorn positioning.
              The company’s own funding releases let us reconstruct the sequence from angel and seed support into pre-A,
              then an eight-figure Series A, then a US$220 million Series C. That is enough to establish capital
              availability, investor quality, and a clear willingness from backers to fund capital-intensive robotics
              scaling. It is not enough to reconstruct control rights or current ownership percentages. The stakeholder
              picture is broader than equity capital alone. BMW remained strategically relevant through idealworks,
              while Google DeepMind became an intelligence-layer partner in 2026. Those relationships matter because
              Agile Robots’ execution model depends on ecosystem leverage as much as pure fundraising. The downside is
              disclosure opacity: valuation, headcount, and revenue signals appear in press releases and interviews, but
              the company still behaves like a private enterprise that selectively discloses momentum metrics when
              strategically useful.
