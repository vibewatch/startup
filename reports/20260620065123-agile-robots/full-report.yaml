      - number: '7.3'
        title: Operational and partner dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Agile has public proof of quality milestones and restarted production, but the disclosure
              set still leaves large blind spots. ISO 9001 and TÜV certificates help on process credibility, and the
              Kaufbeuren production restart shows that Agile could stabilize Franka quickly enough to resume shipments.
              Even so, there is no public fleet-wide uptime, warranty, or incident dataset. That matters because the
              2026 roadmap leans heavily on partner infrastructure: DeepMind for foundation models, Deutsche Telekom and
              NVIDIA for industrial AI cloud capacity, and acquired entities such as Krause Automation and idealworks
              for route-to-market and installed-base expansion. Each dependency is rational on its own, yet the
              aggregate stack creates a coupled system in which one contract problem, one compute bottleneck, or one
              integration miss can interrupt multiple revenue lines at once. The dependency map below is therefore a
              practical underwriting tool: it identifies where a seemingly commercial partnership can become a hard
              execution constraint.
