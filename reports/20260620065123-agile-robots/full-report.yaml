        title: Portfolio and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Agile Robots no longer looks like a single-arm vendor. Its public portfolio spans precision cobots,
              force-controlled research-friendly arms, mobile robotics, humanoid systems, and an AI software layer that
              is meant to coordinate them. In customer workflow terms, the company sells the idea of an intelligent
              production system rather than a disconnected robot cell: robotic arms handle manipulation, mobile
              platforms handle movement and orchestration across stations, AgileCore handles configuration and
              optimization, and newer foundation-model surfaces promise less manual programming over time. The
              highest-confidence proof is still on the concrete hardware pages. Diana 7 is clearly positioned for
              force-sensitive, high-precision manipulation; Yu 5 Industrial emphasizes vision-enabled collaborative
              automation; the Thor line covers broader payload and reach bands; Agile Hand extends the stack into
              dexterous end effectors; and the mobile-robotics pages show how arms can be combined with partner AMR or
              AGV platforms. That breadth is strategically valuable because it lets Agile pitch an integrated automation
              program to factories rather than one robot at a time. It also raises the bar on execution because each
              layer has to work reliably with the rest of the stack.
