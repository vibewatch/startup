      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The diligence burden for Agile is explicit and manageable, but it must be cleared before any committee
              should elevate the recommendation. First, investors need current pricing evidence: the latest round, a
              board mark, or a real secondary print. Second, they need economics, including gross margin, opex, capex,
              and cash burn by major program. Third, they need the preference stack and waterfall because enterprise
              value can look healthy while common-equity outcomes remain poor. Fourth, they need proof that deployment
              scale is translating into sticky customers and software or service monetization. Until those asks are
              answered, the right behavior is to monitor kill triggers rather than chase upside headlines. If series
              production slips, if integration breaks, if AI partners become concentration risks, or if the company
              raises highly structured new capital, the valuation should compress toward a conventional automation
              supplier rather than an AI-premium platform.
            claimRefs:
