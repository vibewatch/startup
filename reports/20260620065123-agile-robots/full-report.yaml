      - number: '3.3'
        title: Pricing, Distribution, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Public pricing remains one of the least transparent parts of this market, but the available evidence is
              directionally useful. Third-party 2026 guides place standard cobots broadly in a base range around $25,000
              to $60,000 before tooling, vision, compliance work, and integration, with advanced configurations moving
              above $90,000. Those same guides place Universal Robots, ABB, and FANUC in overlapping but meaningfully
              different pricing bands, while Chinese brands such as Dobot are framed as lower-cost challengers. Even if
              these numbers are not list-price truth, they still show the competitive pressure buyers are conditioned to
              expect. Distribution and switching cost matter more than sticker price alone. Universal Robots uses UR+,
              training, and application kits to accelerate deployment. ABB stresses service-network breadth. FANUC sells
              not just arms but controllers, software, simulation, maintenance, and long-lifecycle support. Once a
              factory standardizes on one of these environments, replacement is not simply a matter of swapping arms. It
              usually means retraining staff, revalidating safety, adjusting integrations, and potentially rewriting
              tooling workflows. Agile therefore needs its manipulation and AI edge to be strong enough that buyers will
              accept the cost of changing stack assumptions rather than buying the easiest incumbent extension.
            claimRefs:
              - CP008
              - CP010
              - CP016
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
