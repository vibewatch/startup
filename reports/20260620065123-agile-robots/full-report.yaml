      - number: '5.2'
        title: Architecture, Control, and Developer Surface
        blocks:
          - type: paragraph
            body: >-
              The public architecture story is strongest where Agile inherits or interfaces with the Franka research
              stack. Diana 7 has the cleanest technical specification surface: seven-axis torque sensing, 7 kg payload,
              923 mm reach, ±0.05 mm repeatability, and 0.5 N force-control accuracy. The key product-development step
              is the addition of Franka Control Interface support, which exposes 1 kHz real-time control and links Diana
              7 into libfranka, ROS, ROS 2, MATLAB, and Simulink ecosystems. That is a meaningful technical bridge
              because it takes Agile from a purely industrial narrative into a research and developer workflow that
              already has tooling and community expectations. The GitHub evidence reinforces this. libfranka is
              explicitly low-level and real-time; franka_ros2 is explicitly under active development and ROS 2
              Humble-centric. Meanwhile Agile Hand exposes its own 1 kHz communication path and C++ / Python / ROS
              compatibility, while AgileCore pushes the opposite direction by abstracting control through
              natural-language task creation, RAG-based setup guidance, and self-optimizing behavior. Together these
              sources suggest a two-layer architecture: low-level direct-control credibility for advanced users and a
              higher-level AI abstraction layer for broader deployment. That is attractive, but it also means the
              company must maintain both hardcore control fidelity and easy-to-use orchestration at the same time.
