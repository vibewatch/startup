  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              FINN's relevant market is the provision of vehicles through recurring subscriptions with a bundled monthly
              payment, digital selection, and provider-managed administrative and operating services. The offer sits
              between buying, traditional leasing, and rental: TechCrunch's syndicated account describes subscriptions
              as an alternative to buying or leasing, while NAVIT describes the model as a flexible alternative to both.
              The included spend is the vehicle plus the contractually bundled services; fuel or charging is generally
              excluded. The boundary should not be expanded into all mobility spending, ride-hailing, public transit, or
              every fleet-management service. The closest substitutes are ownership, leasing, rental, and other
              subscription providers such as Sixt+, Like2Drive, ViveLeCar, MyEuropcar, and Stellantis car subscription.
              Because the sources are provider- or media-level descriptions, they establish category mechanics and
              substitutes, not category-wide share.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing and growth
        blocks:
          - type: paragraph
            body: >-
              The retained evidence provides operating-scale lenses rather than a reconciled market forecast. FINN
              reported more than 50,000 active subscriptions and more than €300 million of ARR around the June 24, 2026
              Series D announcement, while earlier reporting documented 25,000 subscriptions and €160 million of ARR in
              the Germany and United States business. Those figures are company scale indicators, not market totals, and
              the periods, currencies, and source postures differ. The 2023 evidence adds a US price range of
              $570–$1,399 per month, 23,000 global active subscriptions, and approximately $174 million ARR, but it is
              historical and not directly comparable with the 2026 figures. The market-wide TAM, SAM, SOM, category
              penetration, and conversion from ownership or leasing remain unverified in this pool. Valuation relevance
              therefore depends on proving durable utilization, pricing, residual-value, and retention economics rather
              than applying a generic mobility-market multiple.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
