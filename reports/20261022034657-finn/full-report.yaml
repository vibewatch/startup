      - number: '3.2'
        title: Capability, packaging, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a comparison on buying criteria, not a claim that every competitor has been
              benchmarked on identical terms. FINN offers a fully online selection and delivery flow, bundled insurance,
              registration, maintenance, and taxes in recent partner material, and more than 25 brands. Earlier
              reporting describes six- or 12-month terms, monthly prices of $570-$1,399 in the United States, and
              business fleet services; NAVIT reports German examples from EUR449 to EUR1,489 per month and a possible
              deposit for some models. These observations are not directly comparable across geographies, dates, vehicle
              classes, tax regimes, or included services. FINN's channel advantage is a low-friction digital funnel plus
              investor and media-for-equity support, while incumbents can bring existing fleet, brand, OEM, or dealer
              relationships. Unsupported competitor pricing and service cells remain unknown rather than being inferred
              from category labels.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              FINN has evidence of scale: UVC Partners reports more than 50,000 active subscriptions and ARR above
              EUR300 million in June 2026, while the same announcement says the Series D included nearly EUR100 million
              of equity and more than EUR40 million of debt. Tracxn reports 11 active competitors and identifies FINN as
              first among them, but this is a vendor ranking rather than an independent market-share measure. The more
              durable advantage is operational coordination: vehicle sourcing, financing, delivery, servicing,
              remarketing, and a repeatable digital customer flow. That advantage can compound with volume, but it is
              capital-dependent and contestable. Tech387's reproduction of TechCrunch reporting describes Fair.com's
              collapse, Onto's bankruptcy, and Cazoo's exit from subscriptions, adverse evidence that the category can
              destroy capital when demand or unit economics disappoint. The same reproduced reporting also shows
              dependence on OEM access: Germany covered more than 80% of popular makes and models, while U.S. OEM
              discussions were slower to convert into deals. This makes supplier access, residual values, service
              quality, and debt availability the principal tests of whether scale becomes a moat rather than a larger
              exposure.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale can reinforce the operating flywheel
            body: >-
              FINN's reported subscription and ARR scale can support sourcing, financing, and service density, but the
              evidence does not yet prove that scale produces superior retention or returns.
            calloutType: strength
            claimRefs:
              - CP010
              - CP011
          - type: callout
            title: Asset intensity keeps competition financially unforgiving
            body: >-
              Category failures and FINN's reliance on debt-backed fleet acquisition show that competitor resilience
              depends on residual values, funding access, and service execution as much as on customer experience.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              FINN monetizes access to vehicles through fixed-term subscriptions sold to consumers and businesses. The
              offer bundles the vehicle with insurance, registration, maintenance and related services, while users
              generally pay fuel or charging separately. Public descriptions distinguish list pricing from realized
              revenue: Auto Finance News reported six- or 12-month U.S. terms priced from $570 to $1,399 per month,
              while NAVIT described model-specific German prices and a possible collection fee. These are published
              price points, not a disclosed revenue mix or margin schedule. B2B is financially important: TechCrunch
              described a target segment of companies with 15 to 100 vehicles, and Auto Finance News reported that more
              than half of German subscriptions were from businesses subscribing to multiple cars at once. The resulting
              underwriting question is whether bundled pricing consistently covers depreciation, servicing, insurance,
              delivery and remarketing costs across cohorts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
