            body: >-
              The available evidence consistently names six founders: Maximilian Wühr, Nikolai Schröder, Andreas Stryz,
              Max Beyer, Hans-Peter Ringer, and Max-Josef Meier. Wühr is identified as CEO and co-founder in the Series
              C coverage, while Schröder is identified as COO and co-founder in reporting on the ABS financing. A 2025
              M&A intelligence excerpt reports the appointment of Florian Drabeck as CFO and frames the hire as
              preparation for stronger finance processes and a possible eventual IPO, while also saying an IPO remained
              years away. Planet First Partners' Nathan Medlock was reported as joining the board with the Series C. The
              sources do not provide a complete current board register, ownership table, or key-person succession plan,
