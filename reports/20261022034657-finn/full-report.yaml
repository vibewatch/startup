  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Impact and likelihood are highest for fleet funding, residual values, and integrated service execution.
    data:
      columns:
        - Medium impact
        - High impact
      rows:
        - label: High likelihood
          values:
            - Service and delivery monitoring gap
            - No public cohort economics or service-loss series
        - label: Medium likelihood
          values:
            - Cross-border data and compliance visibility
            - Funding, residual-value, and vehicle-supply dependence
        - label: Low likelihood
          values:
            - No current public incident established
            - Regulatory or covenant event could impair scale
        - label: High impact
          values:
            - Unknown current compliance inventory
            - Funding interruption or covenant breach
        - label: Medium impact
          values:
            - Complaint and repair-cost visibility gap
            - Supplier allocation or exit-channel pressure
        - label: Low impact
          values:
            - No public adverse enforcement finding
            - Historical metrics require current refresh
    approximationNotes: >-
      Qualitative placement based on disclosed dependencies and evidence gaps; it is not a statistically calibrated
      probability model.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and financing support the thesis, while undisclosed economics and fleet risk cap the recommendation
      at track.
    data:
      nodes:
        - id: scale
          label: Reported scale
          detail: More than 50,000 active subscriptions and ARR above EUR 300 million are reported.
        - id: financing
          label: Financing access
          detail: The 2026 Series D is reported at EUR 140 million, including equity and debt.
        - id: risks
          label: Unresolved economics
          detail: Audited margins, residual values, retention, leverage, and preference terms are not public.
        - id: downside
          label: Downside triggers
          detail: A down round, punitive refinancing, or residual-value deterioration would weaken equity returns.
        - id: evidence
          label: Required evidence
          detail: Audited accounts, cohort data, financing documents, and fleet cash-conversion data remain diligence asks.
        - id: recommendation
          label: Track
          detail: Wait for primary evidence or a more disciplined entry price.
      edges:
        - from: scale
          to: financing
        - from: financing
          to: risks
        - from: risks
          to: downside
        - from: downside
          to: evidence
        - from: evidence
          to: recommendation
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV013
      - CV017
      - CV018
      - CV019
      - CV020
