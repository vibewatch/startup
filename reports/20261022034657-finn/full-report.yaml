chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              FINN was founded in Germany in 2019 and is headquartered in Munich. Its core proposition is a digital,
              multi-brand car subscription: customers select a vehicle online and pay a recurring fee for bundled access
              and administration rather than buying or signing a conventional long lease. Independent descriptions
              identify insurance, maintenance, taxes, registration, and wear-related administration as included
              elements, while fuel or charging remains the user's responsibility. The model serves both individual
              customers and businesses, including fleet use, and the company's recruiting material describes B2C, B2B,
              and B2B2C operating areas. This is a concrete mobility-service model, not merely a vehicle marketplace,
              but the available sources do not provide audited current revenue, margin, churn, or cohort economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
