figures:
  - id: FO001
    title: FINN milestone timeline
    type: timeline
    summary: >-
      Reported milestones show a progression from 2019 launch through multi-stage equity and asset-backed financing,
      U.S. expansion, and 2026 scale claims.
    data:
      items:
        - date: '2019'
          label: Founded in Germany
          details: FINN was founded in Germany and later described as a Munich-based car-subscription company.
          tone: neutral
          claimRefs:
            - CO001
            - CO006
        - date: '2020-12-08'
          label: Series A
          details: PhocusWire reported a €20 million Series A backed by existing and new investors.
          tone: positive
          claimRefs:
            - CO011
        - date: '2022'
          label: U.S. expansion
          details: The company began operations in the United States, according to 2023 financing coverage.
          tone: positive
          claimRefs:
            - CO004
            - CO012
        - date: 2023-01
          label: B2B fleet services
          details: FINN launched business-to-business fleet services with six- to 12-month terms.
          tone: positive
          claimRefs:
            - CO005
        - date: '2023-07-06'
          label: Asset-backed facility and scale disclosure
          details: >-
            Auto Finance News reported a $27.2 million facility, about 23,000 global active subscriptions, and
            approximately $174 million ARR.
          tone: positive
          claimRefs:
            - CO012
            - CO015
        - date: '2024-01-11'
          label: Series C
          details: >-
            The assigned Series C report described €100 million raised at a €600 million post-money valuation and
            approximately €160 million ARR.
          tone: positive
          claimRefs:
            - CO013
        - date: '2025-02-10'
          label: ABS II financing
          details: >-
            Tech Funding News reported a €1 billion ABS program and more than €1 billion in prior debt financing and
            leasing agreements.
          tone: positive
          claimRefs:
            - CO014
        - date: '2025-10-13'
          label: CFO appointment reported
          details: >-
