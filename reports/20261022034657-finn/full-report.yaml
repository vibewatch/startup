        title: Public traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction has grown materially but is not presented on a single audited basis. Auto Finance News
              reported about 23,000 active subscriptions globally and approximately $174 million of ARR in July 2023,
              while ProSiebenSat.1 reported ARR above €300 million in June 2026. Those figures are company or
              partner-reported snapshots with different dates and currencies, so they should not be treated as a
              like-for-like growth series without underlying accounts. The same sources provide useful operating
              proxies: 85% of customers reportedly chose 12-month terms in 2023, and FINN described a digital ordering
              process with delivery. TechCrunch reported 2,000 U.S. vehicles on the ground and a B2B portal planned for
              customers to acquire and manage vehicles. CAC, payback, churn, NRR, contribution margin and cohort
              retention are not disclosed in the assigned evidence.
            claimRefs:
              - CI005
