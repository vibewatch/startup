      - number: '4.3'
        title: Fleet funding and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              FINN’s model is asset-intensive: it purchases vehicles, carries them during subscriptions and depends on
              debt or securitization to fund inventory. Auto Finance News reported a $27.2 million asset-backed facility
              with Avellinia Capital in 2023, while Tech Funding News reported a €1 billion ABS II program backed by
              Citi and Jefferies in 2025. The 2023 article also said FINN could finance 100% of vehicle cost through a
              revolving facility expiring at the end of 2025, a historical term that requires current confirmation.
              ProSiebenSat.1 reported a June 2026 financing round with around €100 million of new equity and €40 million
              of debt financing, but financing raised is not equivalent to cash available or runway. The assigned
              evidence does not disclose current cash, debt covenants, collateral tests, maturities, liquidity headroom,
              or realized vehicle-sale proceeds. A lender should therefore underwrite fleet funding, residual-value risk
              and refinancing dependence separately from operating burn.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a scalable subscription mechanism and substantial reported traction, but it
              does not establish durable company-level profitability or cash generation. Tech387 reported that the core
              product was profitable while FINN overall was not yet profitable in early 2024; that distinction is
              important because fleet financing, service delivery, depreciation and remarketing can sit outside a narrow
              product contribution view. The same source reported that FINN bought new cars directly from OEMs in bulk
              and arranged retailer purchases after subscriptions ended, making purchase discipline and residual-value
              realization part of the economic result. Adverse market context is also material: the article cited
              Fair.com’s collapse, Onto’s bankruptcy filing and Cazoo’s decision to sunset its subscription business.
              Before underwriting, request audited revenue and gross profit by cohort, vehicle-level contribution
              economics, residual-value and remarketing data, cash-flow forecasts, debt documents, covenant headroom,
              churn and customer concentration.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bundled recurring billing has operating scale
            body: >-
              Public sources report substantial subscription and ARR scale, and the B2B channel can create multi-vehicle
              accounts rather than relying only on individual consumers.
            calloutType: strength
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: callout
            title: Fleet financing is a core dependency
            body: >-
              Vehicle purchases, debt facilities and residual-value realization determine whether reported subscription
              growth converts into cash and sustainable returns.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI012
          - type: callout
            title: Underwrite contribution economics and liquidity separately
            body: >-
              Obtain audited cohort economics, fleet cash conversion, debt terms and current liquidity before relying on
              reported ARR or a recent financing headline.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              FINN's customer proposition is a bundled mobility workflow rather than a standalone software product.
              Public descriptions show a web or app entry point, vehicle and configuration selection, account
              registration, subscription-term choice, payment, delivery, and ongoing service administration. The bundle
              generally includes insurance, registration, maintenance, taxes, and roadside or related support, while
              energy or refuelling remains the subscriber's responsibility in the independent NAVIT description. A
              separate implementation case study describes catalogues, filtering, role-based authentication, checkout
              and subscription billing, loyalty features, API schemas, CI/CD, and DevOps automation; because that case
              study is a vendor project description, it is useful evidence of the surfaced workflow but not proof of
              FINN's current production architecture or performance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
