              - CM007
              - CM008
              - CM009
              - CM019
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map has at least two distinct demand paths. Consumers select a vehicle online and receive a
              delivered, bundled service; businesses can subscribe to multiple vehicles for employee or fleet use. Auto
              Finance News reported that more than half of FINN's German subscriptions came from businesses subscribing
              to multiple cars in 2023, while the same source described fleet partners and an organic expansion path
              from one or two vehicles. The core adoption trigger is administrative simplicity and flexibility: one
              monthly payment combines vehicle access with insurance, registration, maintenance, taxes, or roadside
              services depending on the cited product and period. Constraints are equally material. Fleet inventory
              requires debt or asset-backed financing, residual-value and remarketing execution, OEM access, and service
              capacity. TechCrunch reported slower OEM deal conversion in the United States, and Auto Finance News
              described vehicle resale to dealer groups after subscription periods. These dependencies make capital
              availability, supply access, utilization, and customer retention central to market penetration and
              valuation.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Sizing and adoption gaps
        blocks:
          - type: paragraph
            body: >-
              The current evidence does not establish the addressable vehicle population, total category spend, market
              share, or a comparable geography-by-geography growth rate. It also does not disclose a clean
              consumer-versus-business revenue split, renewal or churn cohorts, price elasticity, contribution margin by
              segment, or realized residual values. A credible SAM would require a defined geography, eligible new and
              used vehicle supply, target customer and fleet populations, and a spend denominator that excludes leasing,
              rental, and ownership double counting. A credible SOM would additionally require channel capacity, OEM
              allocation, financing headroom, delivery and service throughput, and retention assumptions. Until those
              inputs are disclosed or independently reconstructed, the appropriate conclusion is that FINN has
              demonstrated meaningful company-level scale in a category with plausible flexibility and digitization
              drivers, but the market size and adoption ceiling remain open diligence questions.
            claimRefs:
              - CM019
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is evidenced; market share is not
            body: >-
              FINN has disclosed meaningful company-level subscription and ARR scale, but the assigned sources do not
              establish the eligible market denominator or comparable category share.
            calloutType: insight
            claimRefs:
              - CM005
              - CM008
              - CM019
          - type: callout
            title: Fleet economics constrain the addressable opportunity
            body: >-
              Vehicle financing, OEM access, residual values, remarketing, and service throughput can limit adoption
              even when customer interest and subscription volume are growing.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
              - CM016
          - type: callout
            title: Treat external TAM claims as an open diligence item
            body: >-
              Use the reported category estimate only as an unverified secondary lens until its methodology, geography,
              and spend denominator are independently documented.
            calloutType: recommendation
            claimRefs:
              - CM009
              - CM019
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and customer alternatives
        blocks:
          - type: paragraph
            body: >-
              FINN's relevant competitive set extends beyond named subscription startups. NAVIT describes FINN as one of
              the leading providers alongside Like2Drive, while listing Sixt+, ViveLeCar, MyEuropcar, and Stellantis car
              subscription as alternatives. Tracxn separately lists Cluno, ViveLaCar, movA, Driveit, ePilot Mobility,
              and other German platforms, but its rankings are a discovery signal rather than proof of comparable
              operating scale. The practical alternatives are therefore (1) direct multi-brand subscriptions, (2)
              incumbent rental, leasing, and automaker-backed mobility offers, (3) buying a vehicle, and (4) internal
              fleet procurement for business users. FINN's proposition is strongest where buyers value a digital,
              bundled, time-bounded access product; it is less clearly advantaged for customers prioritizing the lowest
              total cost over flexibility or who already have procurement and service infrastructure.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
