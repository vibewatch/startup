      - number: '5.2'
        title: Fleet and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The operating model combines a digital marketplace layer with physical fleet procurement, delivery,
              maintenance coordination, and remarketing. Auto Finance News reports that FINN purchases vehicles from
              suppliers, uses debt facilities to finance vehicle purchases, pre-sells vehicles to dealer groups when
              subscriptions end, and delivers vehicles for both consumer and business subscriptions. The same report
              says vehicles are offered on six- or twelve-month terms and that monthly payments cover maintenance,
              registration, and roadside assistance. Leaping AI's partner case study adds a concrete automation layer:
              FINN's automation engineers design conversation flows, integrate systems, monitor performance, and use
              voice agents for workshop coordination and former-customer outreach. This is a plausible architecture of
              customer, fleet, service-partner, and finance dependencies, but the public record does not expose system
              boundaries, APIs, uptime, or reconciliation controls.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE009
              - CE012
      - number: '5.3'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              FINN's demonstrated maturity is strongest at the customer workflow and operating scale layers: independent
              coverage describes a five-to-ten-minute online ordering process, delivery to the customer's address, and a
              multi-brand catalogue, while 2023 trade coverage described approximately 23,000 active subscriptions and a
              stated ambition to reach one million cars on the road by 2030. The technology differentiation is therefore
              operational execution, catalogue and checkout convenience, data-assisted vehicle and price decisions, and
              automation of service interactions rather than a publicly documented proprietary platform. The principal
              diligence risks are hidden integration complexity, service quality as fleet volume grows, dependence on
              OEM and dealer data, vehicle financing and remarketing interfaces, and unverified security, privacy,
              resilience, and incident controls. FINN's partner-reported 5% reactivation rate is explicitly early-stage
              and should not be treated as a durable product KPI.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated physical-digital workflow
            body: >-
              FINN links online vehicle selection and subscription administration to delivery, maintenance, insurance,
              registration, and fleet-finance operations; this is a broader execution surface than a simple vehicle
              marketplace.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE006
          - type: callout
            title: Architecture and control-plane opacity
            body: >-
              Public sources describe user-facing workflows and selected automation use cases, but do not substantiate
              core infrastructure, uptime, security controls, privacy governance, or failure-handling performance.
            calloutType: risk
            claimRefs:
              - CE008
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              FINN's public materials describe two principal customer motions: individual consumers selecting a vehicle
              online and businesses subscribing to multiple cars for employees or fleet use. The customer proposition is
              a bundled monthly payment covering the vehicle and operating services, while fuel or electricity remains
              with the user. This separates the buyer and user in some B2B cases, where an employer purchases mobility
              and employees operate the vehicles. Public evidence documents Germany and the United States as operating
              markets during 2023-2024, but a 2026 secondary article says US operations were later retracted to focus on
              Europe. The pool provides neither a current segment revenue split nor a verified active-customer
              denominator by geography, so the segmentation reflects observed service design rather than current
              commercial mix.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The available evidence shows adoption progressing from a small US launch fleet to more than 1,200 US
              subscribers in a Cheesecake Labs case study, while Auto Finance News reported approximately 23,000 global
              active subscriptions and a doubling of active subscriptions in the first six months of 2023. Business
              Insider separately reported more than 25,000 subscriptions across Germany and the US in early 2024. These
              figures are not directly comparable because they have different dates, geographies, and publishers, and
              none establishes current retention or net revenue retention. The evidence supports real adoption and
              operating scale, but it does not prove that customers renew, expand, or remain profitable after the
              initial term. A low-reputation 2026 secondary article reports more than 50,000 active subscriptions, while
              another 2026 secondary article reports that 70% of subscribers take an additional subscription. Neither
              article provides a cohort definition, denominator, measurement period, or primary dataset, so these
              figures are directional rather than underwritten retention evidence. The sources also conflict on current
              geography: 2024 reporting described Germany and US operations, whereas a 2026 article says FINN retracted
              its US operations to focus on Europe. Adoption is credible, but current footprint and durability remain
              unresolved.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named proof, expansion, and concentration limits
        blocks:
          - type: paragraph
            body: >-
              Named customer evidence is thinner than logo-level or aggregate-count evidence. The Cheesecake Labs case
              study documents a US operational deployment and reports more than 1,200 current subscribers at the time of
              publication, while Auto Finance News reports 36 fleet partners and says that more than half of German
              subscriptions came from businesses subscribing to multiple cars. The same source describes business
              accounts starting with one or two vehicles and growing as customers replace lease cars with subscriptions.
              This is evidence of a plausible land-and-expand motion, not proof of account-level retention. There is no
              public customer list, top-ten concentration percentage, cohort table, churn series, or independent outcome
              study in the assigned pool; those omissions are material for underwriting durability and downside
              exposure.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU012
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real operating adoption is evidenced
            body: >-
              Multiple dated external sources report tens of thousands of subscriptions or a material US subscriber
              base, supporting a conclusion that FINN moved beyond a pilot-stage product.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU008
          - type: callout
            title: Durability is the central customer gap
            body: >-
              A secondary-source repeat-subscription figure lacks its cohort and denominator, while churn, NRR, cohort
              retention, and concentration remain undisclosed; adoption therefore cannot yet be translated into durable
              unit economics.
            calloutType: risk
            claimRefs:
              - CU009
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The highest-consequence risk is balance-sheet and fleet funding dependence. Auto Finance News reported
              that FINN had raised $935.4 million through equity and debt by July 2023, with about $770 million from
              asset-backed securities, while also describing a revolving facility that financed vehicle purchases. That
              structure can accelerate growth, but it makes liquidity, collateral eligibility, maturities, advance
              rates, residual values, and lender appetite central to operating resilience. A second risk is execution at
              scale: the company planned to add 11,500 vehicles in 2026, while public sources describe more than 50,000
              subscriptions and more than €300 million of ARR. The public record does not provide audited margin, loss,
              cohort, or cash-conversion data to show that growth converts into durable economics. These risks are
              material rather than merely theoretical because the vehicle is the principal operating asset and
              subscription service quality depends on logistics, insurance, maintenance, remarketing, and financing
              working together.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR012
      - number: '7.2'
        title: Legal, regulatory, and disclosure exposure
        blocks:
          - type: paragraph
            body: >-
              The available pool does not establish a current enforcement action, license breach, privacy incident, or
              litigation outcome against FINN. That absence is a disclosure limitation, not evidence that the risks are
              absent. FINN operates across Germany and the United States, bundles insurance, registration, maintenance,
              taxes, and roadside or service obligations, and handles vehicle delivery and customer contracts. The model
              therefore spans consumer-protection, insurance distribution, vehicle safety, data, employment, tax, and
              cross-border operating requirements. Public profiles also describe a planned US operation and a mixed
              fleet, but do not provide a current jurisdiction-by-jurisdiction compliance map, complaint-rate series,
              incident history, or certification inventory. The practical risk is that an adverse event could interrupt
              deliveries or raise service cost before investors can observe it in public financial reporting.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR009
              - CR012
      - number: '7.3'
        title: Operational, partner, and customer dependencies
        blocks:
          - type: paragraph
            body: >-
              FINN's proposition depends on reliable access to vehicles, insurers, lenders, service networks, delivery
              providers, and remarketing channels. The company sources vehicles from manufacturers and, according to
              Auto Finance News, pre-sells vehicles to dealership groups when subscriptions end. That creates dependency
              on OEM allocation, used-vehicle demand, dealer takeout capacity, and the timing of vehicle exits. The
              consumer proposition also creates service expectations: one monthly payment covers multiple components, so
              a failure in maintenance, registration, insurance, or delivery can become a customer-retention and
              reputation problem even when the vehicle itself is available. B2B and consumer demand diversify the buyer
              base, but public sources do not disclose churn, concentration, service-level performance, or the share of
              revenue tied to any counterparty. Monitoring should focus on delivery delays, repair cycle time, claims,
              cancellations, remarketing discounts, lender concentration, and customer concentration.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Mitigations, kill criteria, and diligence path
        blocks:
          - type: paragraph
            body: >-
              FINN has visible mitigants: it combines equity with asset-backed debt, has institutional investors, sells
              subscriptions to both individuals and businesses, and has built a digital ordering flow. Those are
              operating capabilities, not proof that residual risk is low. The decisive diligence items are monthly
              fleet contribution margin by cohort, realized versus underwritten residual values, ABS and
              revolving-facility covenants, lender and insurer concentration, claims and repair cost, customer churn and
              renewal, and the economics of the 2026 fleet expansion. A thesis-break would be a covenant breach or loss
              of committed fleet funding; sustained realized residual values below underwriting; rising cancellations or
              service incidents without price recovery; or regulatory action that materially restricts bundled
              subscriptions in a key market. Until those indicators are disclosed and independently corroborated, the
              appropriate posture is to treat growth claims as scale evidence but not as evidence of low execution risk.
            claimRefs:
              - CR002
              - CR003
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The funding stack is a core operating risk
            body: >-
              Asset-backed debt can fund fleet growth efficiently, but public disclosure does not show covenant
              headroom, maturities, advance rates, or realized residual-value performance.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: No incident finding is not a clean bill of health
            body: >-
              The assigned evidence did not establish a current enforcement, outage, breach, or litigation outcome; the
              correct conclusion is an evidence gap requiring targeted diligence.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              FINN's thesis is that a digitally distributed, all-inclusive car subscription can convert fragmented
              vehicle access into a recurring service with consumer and B2B demand. Current coverage reports more than
              50,000 active subscriptions, ARR above EUR 300 million, and a June 2026 Series D that crossed a EUR 1
              billion valuation. Earlier reporting also described a financing structure designed to fund vehicle
              purchases with debt, which can preserve equity for operating growth. The anti-thesis is capital intensity
              and uncertain durability: the model depends on fleet financing, vehicle residual values, remarketing,
              service execution, and sustained demand at a valuation that now embeds strong growth. Historical reporting
              on Fair.com, Onto, and Cazoo shows that adjacent subscription models have failed or retrenched, while
              earlier FINN reporting explicitly noted that the company was not yet profitable and that US scale and OEM
              access were harder than in Germany. The evidence supports a differentiated growth asset, not certainty
              that the latest price is attractive.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV017
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV013
              - CV014
              - CV016
              - CV017
              - CV018
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest financing context is material but incomplete. Beinsure and M&A Insights provide complementary
              details: Beinsure reports that the round crossed a EUR 1 billion valuation, while M&A Insights reports EUR
              100 million of equity and EUR 40 million of debt. The current coverage labels ARR as more than EUR 300
              million, while the older TechCrunch-sourced report recorded a roughly EUR 600 million post-money Series C
              valuation. Those observations show a higher reported valuation alongside substantial reported scale, but
              ARR is not audited revenue, and the sources do not establish whether ARR is comparable across periods or
              how debt, leases, asset-backed facilities, liquidation preferences, or dilution affect equity value. Auto
              Finance News reported that FINN had raised USD 935.4 million through equity and debt by July 2023 and that
              vehicle debt funding could cover 100% of vehicle cost, illustrating both access to capital and
              balance-sheet exposure. Entry discipline therefore requires verified cap-table terms, debt covenants,
              realized vehicle economics, and a price that still works after financing and residual-value stress.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
              - CV017
              - CV018
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV011
              - CV013
              - CV016
              - CV018
              - CV020
      - number: '8.3'
        title: Scenarios, comparables, and downside
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single target value because public evidence supplies
              operating scale but not the margin, churn, cohort, or cash-conversion inputs needed for a conventional
              DCF. The bull case assumes the reported subscription and ARR scale converts into durable contribution
              profit, debt remains available on acceptable terms, and European expansion increases utilization without
              damaging residual values or service quality. The base case assumes growth continues but the company
              remains exposed to fleet capital, customer-support costs, and financing conditions; the current unicorn
              valuation is then a demanding price for execution. The bear case assumes multiple compression, weaker
              used-car residuals, higher funding costs, or commercialization friction; the history of Fair.com, Onto,
              and Cazoo demonstrates that adjacent models can lose access to capital or cease operations. Available
              comparison evidence is directional rather than a clean public-company comparable set: Global Finance cites
              Onto and Carvolution as other venture-backed subscription businesses, while Tech387 records failures and
              retrenchment among adjacent models. None of these sources provides a like-for-like EV/ARR,
              contribution-margin, or liquidation-preference benchmark for FINN.
            claimRefs:
              - CV002
              - CV003
              - CV013
              - CV014
              - CV017
              - CV018
      - number: '8.4'
        title: Recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The evidence-sensitive recommendation is track with medium confidence and a stretched valuation stance.
              This is not a judgment that FINN lacks a viable business: the financing round, reported customer scale,
              and all-inclusive product are meaningful positives. It is a judgment that the public record cannot yet
              underwrite a buy at a valuation above EUR 1 billion because audited revenue and gross margin, cohort
              retention, customer concentration, fleet cash conversion, residual-value outcomes, debt covenants, and
              preference-stack detail are not disclosed in the assigned evidence. A move toward buy would require
              primary confirmation that core product contribution is sustainably positive, fleet leverage remains
              resilient through a used-car downturn, and international growth does not require disproportionate equity.
              Thesis-break triggers are a down round or punitive refinancing, persistent negative contribution after
              fleet and service costs, material deterioration in residual values or utilization, or evidence that churn
              and customer concentration make ARR less durable than the headline suggests. Exit readiness is therefore
              conditional on audited accounts, financing documents, and a transparent path from ARR to free cash flow.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV013
              - CV017
              - CV018
              - CV019
              - CV020
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track at current evidence quality
            body: >-
              The reported scale and financing are investable signals, but the absence of audited operating economics
              and transaction terms makes a buy recommendation too price-insensitive.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV017
          - type: callout
            title: Fleet financing is both enabler and exposure
            body: >-
              Debt-funded vehicle acquisition can preserve equity for growth, but it leaves returns exposed to
              covenants, funding costs, utilization, and realized residual values.
            calloutType: risk
            claimRefs:
              - CV010
              - CV018
