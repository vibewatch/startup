  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: Independent market-wide TAM, SAM, and SOM estimates for car subscriptions with defined geography, period, population, and spend denominator.
      whyItMatters: Without a market denominator, FINN's reported subscriptions and ARR cannot be converted into share, penetration, or a defensible category growth rate.
      diligencePath: Obtain a current analyst or industry-association dataset that separates subscription spend from ownership, leasing, rental, and broader mobility revenue.
      relatedQuestionRefs: [QM002, QM003]
    - type: private-evidence-only
      severity: material
      topic: adoption-economics
      missingEvidence: Cohort retention, churn, renewal, contribution margin, and price-elasticity data split between consumer and business subscribers.
      whyItMatters: Subscription volume and ARR can grow through fleet expansion without demonstrating durable demand or attractive unit economics.
      diligencePath: Request cohort-level monthly retention, utilization, gross contribution, service cost, and acquisition-payback schedules by customer segment.
      relatedQuestionRefs: [QM005, QM006, QM008]
    - type: missing-source
      severity: material
      topic: supply-and-capital
      missingEvidence: Current OEM allocation, debt capacity, residual-value realization, and remarketing performance by geography and vehicle type.
      whyItMatters: Fleet access and asset financing constrain the quantity and economics of subscriptions that can be delivered.
      diligencePath: Review financing agreements, fleet aging, disposal proceeds, lender covenants, OEM contracts, and delivery/service capacity.
      relatedQuestionRefs: [QM007]
    - type: conflicting-data
      severity: minor
      topic: scale-measurement
      missingEvidence: A reconciled time series explaining differences among the 2023, 2024, and 2026 subscription and ARR figures.
      whyItMatters: Different periods, currencies, and company-reported definitions can otherwise create false growth comparisons.
      diligencePath: Reconcile management KPI definitions, reporting dates, geography, ARR methodology, and active-subscription counts.
      relatedQuestionRefs: [QM004]
