companyProfile:
  summary: >-
    FINN is a Munich-based digital car-subscription company founded in 2019. It offers bundled vehicle access to
    consumers and businesses through recurring subscriptions that include services such as insurance, registration,
    maintenance, and administration. The business has reported substantial subscription and ARR scale and has funded
    fleet growth with both equity and asset-backed debt, but public evidence does not establish audited profitability,
    cohort retention, residual-value performance, or current liquidity.
