      - [Vehicle breadth, "More than 25 brands; NAVIT describes 40 models", Unknown for named peers, "Catalogue count varies by date and market"]
      - [Bundled operating costs, "Insurance, registration, maintenance, taxes in recent UVC material", "Category generally bundles core costs", "Included services differ by contract and source date"]
      - [Delivery, "Doorstep delivery described by NAVIT and TechCrunch", Unknown for named peers, "Service radius and delivery SLA are not comparable"]
      - [Business fleet use, "B2B fleet services and 36 fleet partners reported in 2023", Unknown for named peers, "Historical disclosure; current mix is not public"]
      - [Electric mix, "40% inventory in 2024 report; target 80% by 2028", Unknown for named peers, "Historical target, not a current audited mix"]
    notes: "Unknown cells are intentionally retained because the assigned pool lacks equivalent current competitor disclosures; FINN descriptions are company-reported or secondary reporting, not an independent benchmark."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offer or market, Published price or model, Included or excluded items, Decision implication]
    rows:
      - [FINN Germany, "EUR449-EUR1,489/month examples", "Insurance, maintenance, taxes, and registration generally included; fuel/electricity excluded", "Transparent bundle supports convenience comparison"]
      - [FINN United States, "$570-$1,399/month in 2023 report", "Maintenance, registration, and roadside assistance included", "Older geography-specific range; not current European pricing"]
      - [FINN term structure, "Six- or 12-month terms in 2023 US reporting", "85% of customers reportedly chose 12 months", "Longer commitments may improve fleet economics but reduce flexibility"]
      - [FINN deposit / exit, "Up to three months' hire for some models; EUR199 collection fee", "Deposit and collection terms vary", "Headline monthly price is not a complete switching-cost measure"]
      - [Ownership or lease substitute, "No common price stated", "Upfront equity, financing, maintenance, or contract terms vary", "A total-cost comparison requires customer-specific assumptions"]
    notes: "Price points come from NAVIT and Auto Finance News at different dates and in different markets; they are illustrative list or reported prices, not realized revenue or a normalized competitor price index."
    claimRefs: [CP006, CP007, CP008, CP009]
figures:
  - id: FP001
    title: Competitive positioning by same-job overlap and evidence depth
    type: quadrant
    summary: The map separates explicitly named same-job alternatives from substitutes and shows how thin the assigned public evidence is for most peers; it is not a quality or market-share ranking.
    data:
      xAxis: "Same-job overlap (ordinal: 1 adjacent, 5 explicitly named car-subscription alternative)"
      yAxis: "Retained-source mentions in the assigned pool (count: 1-8)"
      points:
        - {label: FINN, x: 5, y: 8, note: "Reference company; discussed by all eight retained sources"}
        - {label: Sixt+, x: 5, y: 3, note: "Explicit alternative or competitor in three retained sources"}
        - {label: Cluno, x: 5, y: 2, note: "Explicit category competitor in two retained sources"}
        - {label: ViveLaCar / ViveLeCar, x: 5, y: 2, note: "Explicit alternative in two retained sources, with spelling variation"}
        - {label: Like2Drive, x: 5, y: 1, note: "Explicit direct peer in one retained source"}
        - {label: Buying / leasing, x: 4, y: 3, note: "Same mobility job but a structurally different ownership or contract model"}
    approximationNotes: "The x-axis is a disclosed category-overlap rubric, not a performance score; y-values are counts of retained assigned-pool sources that mention each label, with ViveLaCar/ViveLeCar consolidated as one peer."
    claimRefs: [CP001, CP002, CP003, CP011, CP013]
callouts:
  - calloutType: strength
    title: Scale can reinforce the operating flywheel
    body: FINN's reported subscription and ARR scale can support sourcing, financing, and service density, but the evidence does not yet prove that scale produces superior retention or returns.
    claimRefs: [CP010, CP011]
  - calloutType: risk
    title: Asset intensity keeps competition financially unforgiving
    body: Category failures and FINN's reliance on debt-backed fleet acquisition show that competitor resilience depends on residual values, funding access, and service execution as much as on customer experience.
    claimRefs: [CP012, CP013, CP014]
