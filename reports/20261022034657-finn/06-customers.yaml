chapter:
  number: 6
  title: Customers
  summary: >-
    FINN serves consumers and businesses through a digital, all-inclusive car-subscription model, with public evidence of meaningful German and US adoption but incomplete current disclosure on retention, cohort durability, and customer concentration. The strongest adoption evidence is historical and mixed between company-reported metrics and partner case-study reporting, so the customer thesis is credible but not fully underwritten.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      FINN's public materials describe two principal customer motions: individual consumers selecting a vehicle online and businesses subscribing to multiple cars for employees or fleet use. The customer proposition is a bundled monthly payment covering the vehicle and operating services, while fuel or electricity remains with the user. This separates the buyer and user in some B2B cases, where an employer purchases mobility and employees operate the vehicles. Public evidence documents Germany and the United States as operating markets during 2023-2024, but a 2026 secondary article says US operations were later retracted to focus on Europe. The pool provides neither a current segment revenue split nor a verified active-customer denominator by geography, so the segmentation reflects observed service design rather than current commercial mix.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      The available evidence shows adoption progressing from a small US launch fleet to more than 1,200 US subscribers in a Cheesecake Labs case study, while Auto Finance News reported approximately 23,000 global active subscriptions and a doubling of active subscriptions in the first six months of 2023. Business Insider separately reported more than 25,000 subscriptions across Germany and the US in early 2024. These figures are not directly comparable because they have different dates, geographies, and publishers, and none establishes current retention or net revenue retention. The evidence supports real adoption and operating scale, but it does not prove that customers renew, expand, or remain profitable after the initial term.
      A low-reputation 2026 secondary article reports more than 50,000 active subscriptions, while another 2026 secondary article reports that 70% of subscribers take an additional subscription. Neither article provides a cohort definition, denominator, measurement period, or primary dataset, so these figures are directional rather than underwritten retention evidence. The sources also conflict on current geography: 2024 reporting described Germany and US operations, whereas a 2026 article says FINN retracted its US operations to focus on Europe. Adoption is credible, but current footprint and durability remain unresolved.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU016]
    tableRefs: [TU002]
  - id: named-proof-and-expansion
    title: Named proof, expansion, and concentration limits
    body: >-
      Named customer evidence is thinner than logo-level or aggregate-count evidence. The Cheesecake Labs case study documents a US operational deployment and reports more than 1,200 current subscribers at the time of publication, while Auto Finance News reports 36 fleet partners and says that more than half of German subscriptions came from businesses subscribing to multiple cars. The same source describes business accounts starting with one or two vehicles and growing as customers replace lease cars with subscriptions. This is evidence of a plausible land-and-expand motion, not proof of account-level retention. There is no public customer list, top-ten concentration percentage, cohort table, churn series, or independent outcome study in the assigned pool; those omissions are material for underwriting durability and downside exposure.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
