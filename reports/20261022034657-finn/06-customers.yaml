    rows:
      - ["US subscribers", "Consumer and business", "FINN US subscription service", "Production service", "More than 1,200 subscribers reported by implementation partner", "No named end-customer roster or independent outcome metric"]
      - ["FINN fleet partners", "Business", "Six- to twelve-month fleet subscriptions with delivery and pickup", "Production service", "36 fleet partners reported in 2023", "Partner identities and account-level expansion are not disclosed"]
      - ["German business subscribers", "Business", "Multiple-car subscriptions replacing lease cars", "Production service", "More than half of German subscriptions reportedly came from businesses", "No denominator, retention, or concentration data"]
    notes: "This is a partial public-proof sample, not an exhaustive customer enumeration. Logos or aggregate partner counts do not establish renewal, profitability, or customer satisfaction."
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
figures:
  - id: FU001
    title: Customer journey from discovery to expansion
    type: journey-map
    summary: Public evidence supports a digital selection-to-delivery workflow and a possible B2B expansion loop, while retention and renewal remain unverified.
    data:
      nodes:
        - id: discover
          label: Discover
          title: Flexible alternative
          body: Consumers and businesses encounter car subscription as an alternative to purchase or long-term leasing.
          touchpoints: [Online marketplace, Fleet-service proposition]
        - id: select
          label: Select
          title: Configure online
          body: Users choose a vehicle, brand, and subscription term through a digital ordering flow.
          touchpoints: [Vehicle catalogue, Digital order]
        - id: subscribe
          label: Subscribe
          title: Bundled monthly payment
          body: The subscription bundles vehicle access with insurance, registration, maintenance, taxes, and related services in the reported offering.
          touchpoints: [Single monthly fee, Service administration]
        - id: deliver
          label: Deliver
          title: Doorstep handoff
          body: FINN delivers the vehicle to the customer and supports the operating workflow.
          touchpoints: [Delivery, Registration, Maintenance]
        - id: use
          label: Use
          title: Personal or business use
          body: Public sources describe both personal and business use cases, but current geography and retention remain unclear.
          touchpoints: [Consumer mobility, Employee fleet]
        - id: expand
          label: Expand
          title: Account growth hypothesis
          body: Business accounts may start with one or two vehicles and grow as lease cars are replaced, but renewal and expansion rates are not public.
          touchpoints: [Additional vehicles, Renewal diligence]
    claimRefs: [CU001, CU002, CU012, CU015]
callouts:
  - calloutType: strength
    title: Real operating adoption is evidenced
    body: Multiple dated external sources report tens of thousands of subscriptions or a material US subscriber base, supporting a conclusion that FINN moved beyond a pilot-stage product.
    claimRefs: [CU005, CU006, CU008]
  - calloutType: risk
    title: Durability is the central customer gap
    body: A secondary-source repeat-subscription figure lacks its cohort and denominator, while churn, NRR, cohort retention, and concentration remain undisclosed; adoption therefore cannot yet be translated into durable unit economics.
    claimRefs: [CU009, CU014]
