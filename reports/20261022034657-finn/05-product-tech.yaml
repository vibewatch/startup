  evidenceGaps:
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Public documentation of FINN's software architecture, security certifications, privacy controls, uptime, incident history, and recovery procedures.
      whyItMatters: The product joins payments, identity, vehicle telemetry or service data, and physical delivery, so control-plane failures could affect customers and fleet economics.
      diligencePath: Request current architecture and security documentation, penetration-test summaries, incident register, service-level objectives, and disaster-recovery test results.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: automation-performance
      missingEvidence: Longitudinal, independently verifiable outcomes for voice automation, workshop coordination, and customer reactivation.
      whyItMatters: The only quantified public automation result is an early partner-reported 5% reactivation rate with no denominator or retention outcome.
      diligencePath: Obtain cohort-level contact, conversion, retention, escalation, quality, and cost data for automated and human-handled interactions.
      relatedQuestionRefs: [QE004]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public repository, API, package, or practitioner-community evidence showing engineering cadence and external developer adoption.
      whyItMatters: Partner case studies evidence implementation work but do not establish an externally inspectable developer platform or sustained engineering cadence.
      diligencePath: Request a current integration catalogue, API documentation, release history, and selected engineering or reliability metrics.
      relatedQuestionRefs: [QE007]
