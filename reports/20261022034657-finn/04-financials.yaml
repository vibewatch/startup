company:
  name: FINN
chapter:
  number: 4
  title: Financials
  summary: FINN has a bundled vehicle-subscription revenue model with meaningful reported scale, but fleet financing and vehicle residual-value exposure make capital structure and cash conversion central underwriting questions. Public sources provide historical pricing, ARR, subscription and financing snapshots, while audited margins, churn, realized residuals, and current runway remain unavailable.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      FINN monetizes access to vehicles through fixed-term subscriptions sold to consumers and businesses. The offer bundles the vehicle with insurance, registration, maintenance and related services, while users generally pay fuel or charging separately. Public descriptions distinguish list pricing from realized revenue: Auto Finance News reported six- or 12-month U.S. terms priced from $570 to $1,399 per month, while NAVIT described model-specific German prices and a possible collection fee. These are published price points, not a disclosed revenue mix or margin schedule. B2B is financially important: TechCrunch described a target segment of companies with 15 to 100 vehicles, and Auto Finance News reported that more than half of German subscriptions were from businesses subscribing to multiple cars at once. The resulting underwriting question is whether bundled pricing consistently covers depreciation, servicing, insurance, delivery and remarketing costs across cohorts.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: traction-and-efficiency
    title: Public traction and sales-efficiency proxies
    body: >-
      Public traction has grown materially but is not presented on a single audited basis. Auto Finance News reported about 23,000 active subscriptions globally and approximately $174 million of ARR in July 2023, while ProSiebenSat.1 reported ARR above €300 million in June 2026. Those figures are company or partner-reported snapshots with different dates and currencies, so they should not be treated as a like-for-like growth series without underlying accounts. The same sources provide useful operating proxies: 85% of customers reportedly chose 12-month terms in 2023, and FINN described a digital ordering process with delivery. TechCrunch reported 2,000 U.S. vehicles on the ground and a B2B portal planned for customers to acquire and manage vehicles. CAC, payback, churn, NRR, contribution margin and cohort retention are not disclosed in the assigned evidence.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-intensity-and-financing
    title: Fleet funding and capital adequacy
    body: >-
      FINN’s model is asset-intensive: it purchases vehicles, carries them during subscriptions and depends on debt or securitization to fund inventory. Auto Finance News reported a $27.2 million asset-backed facility with Avellinia Capital in 2023, while Tech Funding News reported a €1 billion ABS II program backed by Citi and Jefferies in 2025. The 2023 article also said FINN could finance 100% of vehicle cost through a revolving facility expiring at the end of 2025, a historical term that requires current confirmation. ProSiebenSat.1 reported a June 2026 financing round with around €100 million of new equity and €40 million of debt financing, but financing raised is not equivalent to cash available or runway. The assigned evidence does not disclose current cash, debt covenants, collateral tests, maturities, liquidity headroom, or realized vehicle-sale proceeds. A lender should therefore underwrite fleet funding, residual-value risk and refinancing dependence separately from operating burn.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The public record supports a scalable subscription mechanism and substantial reported traction, but it does not establish durable company-level profitability or cash generation. Tech387 reported that the core product was profitable while FINN overall was not yet profitable in early 2024; that distinction is important because fleet financing, service delivery, depreciation and remarketing can sit outside a narrow product contribution view. The same source reported that FINN bought new cars directly from OEMs in bulk and arranged retailer purchases after subscriptions ended, making purchase discipline and residual-value realization part of the economic result. Adverse market context is also material: the article cited Fair.com’s collapse, Onto’s bankruptcy filing and Cazoo’s decision to sunset its subscription business. Before underwriting, request audited revenue and gross profit by cohort, vehicle-level contribution economics, residual-value and remarketing data, cash-flow forecasts, debt documents, covenant headroom, churn and customer concentration.
    claimRefs: [CI013, CI014, CI015, CI016]
callouts:
  - calloutType: strength
    title: Bundled recurring billing has operating scale
    body: Public sources report substantial subscription and ARR scale, and the B2B channel can create multi-vehicle accounts rather than relying only on individual consumers.
    claimRefs: [CI004, CI005, CI006]
  - calloutType: risk
    title: Fleet financing is a core dependency
    body: Vehicle purchases, debt facilities and residual-value realization determine whether reported subscription growth converts into cash and sustainable returns.
    claimRefs: [CI009, CI010, CI012]
  - calloutType: recommendation
    title: Underwrite contribution economics and liquidity separately
    body: Obtain audited cohort economics, fleet cash conversion, debt terms and current liquidity before relying on reported ARR or a recent financing headline.
    claimRefs: [CI013, CI014, CI016]
