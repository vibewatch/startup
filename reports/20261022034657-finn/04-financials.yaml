      - [B2B fleet subscriptions, "Businesses subscribe to multiple vehicles", "More than half of German subscriptions reportedly came from businesses subscribing to multiple cars", "Company-reported through trade coverage; request B2B revenue mix and concentration"]
      - [Vehicle services bundle, "Insurance, registration, maintenance and related vehicle costs included in monthly fee", "Included-cost structure described by NAVIT and ProSiebenSat.1", "Bundle scope differs by source and market; reconcile service cost per vehicle"]
      - [Remarketing / vehicle exit, "Vehicle pre-sale or sale after subscription", "FINN reportedly pre-sold vehicles to dealership groups after 12-18 months", "Historical reported mechanism; request realized residual values and sale proceeds"]
    notes: "Sources describe mechanisms and selected public price points, not audited revenue mix. Null or unavailable fields would mean the assigned sources did not disclose them."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization observations
    columns: [Metric, Published observation, Basis, Diligence implication]
    rows:
      - [U.S. monthly subscription price, "$570-$1,399", "Auto Finance News; 2023; varies by term, vehicle and state tax", "Separate list price from realized net revenue and vehicle-level margin"]
      - [German example price, "€449-€1,489/month examples", "NAVIT; model and equipment dependent", "Request current country/model price book and discounts"]
      - [Subscription term, "Six or 12 months in U.S. coverage", "Auto Finance News; 2023", "Test renewal, early-return and remarketing assumptions"]
      - [Collection fee, "€199 reported for some cancellations", "NAVIT consumer overview", "Confirm whether fee is current and how often it is collected"]
    notes: "All amounts are source-reported list or example prices, not realized revenue. Currency, geography, date and product configuration differ."
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, "$174m reported in 2023; >€300m reported in June 2026", "Medium; different sources and periods", "Indicates scale but is not audited revenue or cash", "Provide ARR bridge, recognition policy and cohort reconciliation"]
      - [Active subscriptions, "About 23,000 globally in 2023", "Medium; reported by company spokesperson through trade coverage", "Provides volume context", "Provide current active base, churn and renewal cohorts"]
      - [Gross margin, null, "Unavailable in assigned sources", "Determines whether growth creates contribution", "Provide audited gross margin by market and vehicle cohort"]
      - [CAC and payback, null, "Unavailable in assigned sources", "Tests acquisition efficiency", "Provide channel CAC, payback and marketing allocation"]
      - [Residual value realization, null, "Unavailable in assigned sources", "Drives fleet cash conversion and loss severity", "Provide vehicle-level sale proceeds, depreciation and loss history"]
      - [Cash runway, null, "Unavailable in assigned sources", "Tests financing dependency", "Provide cash, burn, debt maturities and covenant headroom"]
    notes: "Nulls are evidence gaps, not zeroes or estimates. Reported ARR and subscription values have different dates, currencies and source relationships."
    claimRefs: [CI005, CI006, CI009, CI010, CI012, CI013, CI016]
