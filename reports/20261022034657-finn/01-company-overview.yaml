company:
  name: FINN
chapter:
  number: 1
  title: Company Overview
  summary: FINN is a Munich-founded car-subscription platform whose model bundles vehicle access with insurance, registration, maintenance, and related administration for consumers and businesses. The evidence shows a rapid scale-up financed with substantial equity and asset-backed debt, but current valuation, profitability, fleet economics, and leadership disclosures remain partly dependent on company statements or secondary reporting.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      FINN was founded in Germany in 2019 and is headquartered in Munich. Its core proposition is a digital, multi-brand car subscription: customers select a vehicle online and pay a recurring fee for bundled access and administration rather than buying or signing a conventional long lease. Independent descriptions identify insurance, maintenance, taxes, registration, and wear-related administration as included elements, while fuel or charging remains the user's responsibility. The model serves both individual customers and businesses, including fleet use, and the company's recruiting material describes B2C, B2B, and B2B2C operating areas. This is a concrete mobility-service model, not merely a vehicle marketplace, but the available sources do not provide audited current revenue, margin, churn, or cohort economics.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      The available evidence consistently names six founders: Maximilian Wühr, Nikolai Schröder, Andreas Stryz, Max Beyer, Hans-Peter Ringer, and Max-Josef Meier. Wühr is identified as CEO and co-founder in the Series C coverage, while Schröder is identified as COO and co-founder in reporting on the ABS financing. A 2025 M&A intelligence excerpt reports the appointment of Florian Drabeck as CFO and frames the hire as preparation for stronger finance processes and a possible eventual IPO, while also saying an IPO remained years away. Planet First Partners' Nathan Medlock was reported as joining the board with the Series C. The sources do not provide a complete current board register, ownership table, or key-person succession plan, so governance completeness and founder dependence remain diligence gaps.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: financing-scale-and-risks
    title: Financing, scale, and unresolved exposure
    body: >-
      FINN's financing history spans an initial €20 million Series A reported in December 2020, a €100 million Series C at a reported €600 million post-money valuation in January 2024, and a reported €140 million Series D above a €1 billion valuation in June 2026. Debt is material to the operating model: the 2023 coverage described a $27.2 million asset-backed facility and roughly $770 million of ABS financing within a larger equity-and-debt total, while later coverage described more than €1 billion of debt financing and leasing agreements. The same fleet-financing structure can release equity for growth but increases sensitivity to residual values, refinancing, collateral, and remarketing performance. Current reported scale has reached more than 50,000 subscriptions and more than €300 million ARR in a 2026 secondary account, but audited financial statements and debt terms were not available in the assigned sources.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
