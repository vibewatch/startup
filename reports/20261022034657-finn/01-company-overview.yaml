callouts:
  - calloutType: strength
    title: Financing supports fleet growth
    body: >-
      The reported combination of equity and asset-backed debt is designed to finance vehicles while preserving equity for operating growth, a potentially useful capital-allocation advantage if residual values and utilization remain resilient.
    claimRefs: [CO012, CO014]
  - calloutType: risk
    title: Scale claims do not close the economics gap
    body: >-
      Current reported ARR and subscription counts are not accompanied by audited revenue, gross margin, churn, residual-value, or debt-covenant disclosure in the assigned evidence, so scale should not be read as proof of durable free-cash economics.
    claimRefs: [CO015, CO016]
