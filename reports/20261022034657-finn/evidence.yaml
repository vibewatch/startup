evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited current revenue, gross margin, contribution margin, churn, cohort retention, and free-cash-flow data.
    whyItMatters: >-
      Reported ARR and subscription counts cannot establish durable unit economics or cash profitability without
      definitions and reconciliations.
    diligencePath: >-
      Request audited financial statements, monthly cohort data, ARR-to-revenue bridge, and unit-economics schedules
      from management.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: debt
    missingEvidence: Debt covenants, collateral tests, maturities, advance rates, residual-value assumptions, and lender concentration.
    whyItMatters: >-
      Fleet growth is financed with asset-backed debt, so refinancing and used-vehicle values can materially change
      equity risk.
    diligencePath: >-
      Obtain facility agreements, ABS offering documents, borrowing-base reports, covenant compliance, and
      residual-value stress tests.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A current board, executive, ownership, and succession register.
    whyItMatters: >-
      The assigned evidence identifies several leaders but does not establish current governance coverage or key-person
      mitigation.
    diligencePath: Request the current cap table, board minutes, executive roster, delegated authorities, and succession plans.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A single dated source reconciling reported subscription, ARR, equity, debt, and valuation figures.
    whyItMatters: >-
      The figures span different periods, currencies, and definitions, so they should not be combined into a current
      capitalization or revenue conclusion.
    diligencePath: >-
      Request a dated KPI pack with metric definitions, currency conventions, cohort boundaries, and reconciliation to
      audited accounts.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: >-
      Primary evidence on lawsuits, regulatory actions, sanctions, outages, recalls, or material customer incidents
      through 2026.
    whyItMatters: >-
      The assigned adverse search returned no retained direct source, so absence of a cited event is not evidence that
      no event occurred.
    diligencePath: >-
      Run a dedicated legal, regulatory, court, recall, and incident review using primary registries and management
      representations.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent market-wide TAM, SAM, and SOM estimates for car subscriptions with defined geography, period,
      population, and spend denominator.
    whyItMatters: >-
      Without a market denominator, FINN's reported subscriptions and ARR cannot be converted into share, penetration,
      or a defensible category growth rate.
    diligencePath: >-
      Obtain a current analyst or industry-association dataset that separates subscription spend from ownership,
      leasing, rental, and broader mobility revenue.
    relatedQuestionRefs:
      - QM002
      - QM003
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Cohort retention, churn, renewal, contribution margin, and price-elasticity data split between consumer and
      business subscribers.
    whyItMatters: >-
      Subscription volume and ARR can grow through fleet expansion without demonstrating durable demand or attractive
      unit economics.
    diligencePath: >-
      Request cohort-level monthly retention, utilization, gross contribution, service cost, and acquisition-payback
      schedules by customer segment.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: supply-and-capital
    missingEvidence: >-
      Current OEM allocation, debt capacity, residual-value realization, and remarketing performance by geography and
      vehicle type.
    whyItMatters: Fleet access and asset financing constrain the quantity and economics of subscriptions that can be delivered.
    diligencePath: >-
      Review financing agreements, fleet aging, disposal proceeds, lender covenants, OEM contracts, and delivery/service
      capacity.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: minor
    topic: scale-measurement
    missingEvidence: A reconciled time series explaining differences among the 2023, 2024, and 2026 subscription and ARR figures.
    whyItMatters: Different periods, currencies, and company-reported definitions can otherwise create false growth comparisons.
    diligencePath: Reconcile management KPI definitions, reporting dates, geography, ARR methodology, and active-subscription counts.
    relatedQuestionRefs:
      - QM004
  - type: enumeration-incomplete
    severity: material
    topic: enumeration-gap
    missingEvidence: >-
      A current, like-for-like competitor census with market share, active fleet, pricing, retention, and geography for
      direct and incumbent alternatives.
    whyItMatters: >-
      Named competitor lists and vendor rankings do not show whether FINN leads on share, economics, or customer
      retention.
    diligencePath: >-
      Obtain current competitor fleet, cohort, pricing, and channel data from management, procurement references, and
      independent market research.
    relatedQuestionRefs:
      - QP001
      - QP004
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing-comparability
    missingEvidence: >-
      Comparable current offers for Sixt+, Like2Drive, ViveLeCar, MyEuropcar, and Stellantis by vehicle, term, deposit,
      mileage, insurance, maintenance, and exit fees.
    whyItMatters: >-
      FINN's reported price points cannot establish price leadership or customer savings across markets and vehicle
      classes.
    diligencePath: Collect dated quote sheets or mystery-shop comparable vehicles and terms across Germany and the United States.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Competitor-level churn, utilization, residual values, service costs, financing terms, and customer acquisition
      economics.
    whyItMatters: >-
      Operational scale may be a moat or may amplify asset and funding exposure; public evidence cannot distinguish the
      two.
    diligencePath: >-
      Request cohort economics, fleet turns, residual-value realization, debt covenants, and competitor win-loss data
      under NDA.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: missing-source
    severity: minor
    topic: regulatory-posture
    missingEvidence: Current comparable evidence on competitor regulatory, insurance, safety, and consumer-protection posture.
    whyItMatters: Trust and compliance can affect enterprise procurement and the cost of scaling a multi-market fleet.
    diligencePath: Review competitor security, insurance, compliance, complaint, and regulator records in each operating market.
    relatedQuestionRefs:
      - QP003
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Audited revenue recognition, contribution margin, CAC payback, churn, NRR and cohort-level vehicle economics.
    whyItMatters: >-
      Reported ARR and subscription counts do not show whether each cohort covers depreciation, service delivery and
      acquisition cost.
    diligencePath: >-
      Request audited statements plus monthly cohort and vehicle-level contribution schedules for Germany and the United
      States.
    relatedQuestionRefs:
      - QI004
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash, operating burn, debt maturities, collateral tests, covenant headroom and committed fleet facilities.
    whyItMatters: >-
      The business funds physical inventory and may depend on continued debt-market access; financing raised is not cash
      available.
    diligencePath: Obtain a current liquidity bridge, debt agreements, borrowing-base reports and downside runway scenarios.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: residual-values
    missingEvidence: Vehicle-level depreciation, realized residual values, remarketing proceeds and losses by model and term.
    whyItMatters: Residual-value variance can reverse apparent subscription contribution and drive refinancing needs.
    diligencePath: Request fleet vintages, sale ledger, impairment policy and realized-versus-underwritten residual-value history.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: controls
    missingEvidence: >-
      Public documentation of FINN's software architecture, security certifications, privacy controls, uptime, incident
      history, and recovery procedures.
    whyItMatters: >-
      The product joins payments, identity, vehicle telemetry or service data, and physical delivery, so control-plane
      failures could affect customers and fleet economics.
    diligencePath: >-
      Request current architecture and security documentation, penetration-test summaries, incident register,
      service-level objectives, and disaster-recovery test results.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: automation-performance
    missingEvidence: >-
      Longitudinal, independently verifiable outcomes for voice automation, workshop coordination, and customer
      reactivation.
    whyItMatters: >-
      The only quantified public automation result is an early partner-reported 5% reactivation rate with no denominator
      or retention outcome.
    diligencePath: >-
      Obtain cohort-level contact, conversion, retention, escalation, quality, and cost data for automated and
      human-handled interactions.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public repository, API, package, or practitioner-community evidence showing engineering cadence and external
      developer adoption.
    whyItMatters: >-
      Partner case studies evidence implementation work but do not establish an externally inspectable developer
      platform or sustained engineering cadence.
    diligencePath: >-
      Request a current integration catalogue, API documentation, release history, and selected engineering or
      reliability metrics.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Cohort-level gross retention, net retention, renewal, cancellation, and churn data by customer segment and
      geography.
    whyItMatters: >-
      Subscription adoption can coexist with weak durability or high service costs, so counts alone do not establish
      recurring customer economics.
    diligencePath: >-
      Request monthly cohort tables, contract terms, cancellation reasons, renewal rates, and reconciliations to billed
      revenue for the last 24 months.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer and channel concentration by revenue, active vehicles, geography, and partner.
    whyItMatters: >-
      B2B expansion and fleet financing may create exposure to a small number of accounts or channels even when
      aggregate subscriptions grow.
    diligencePath: >-
      Obtain anonymized customer-level revenue and vehicle schedules, top-10 shares, renewal status, and counterparty
      credit limits.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: stale
    severity: material
    topic: adoption
    missingEvidence: >-
      A current 2026 active-customer and active-subscription count with a consistent definition across Germany and the
      United States.
    whyItMatters: >-
