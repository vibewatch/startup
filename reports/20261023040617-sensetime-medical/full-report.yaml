      - number: '4.2'
        title: Capital needs and cost drivers
        blocks:
          - type: paragraph
            body: >-
              The company has raised meaningful strategic capital, including a reported RMB 500 million financing in
              2026 and a separate report of more than RMB 500 million subscription for a Series A process. These are
              financing amounts, not cash available to the subsidiary, and the sources do not disclose proceeds
              received, ownership, tranches, cash balance, debt, or use-of-proceeds reconciliation. The CEO interview
              says the company was close to break-even in the prior year and that the latest financing exceeded its
              then-current funding need; this is a company-reported operating assertion rather than audited evidence.
              The cost base is likely exposed to clinical validation, hospital implementation, model training,
              regulatory work, and specialist personnel, but public sources do not quantify those drivers. Until
              management provides monthly cash-flow and cohort data, runway and financing dependency remain unresolved.
            claimRefs:
              - CI005
