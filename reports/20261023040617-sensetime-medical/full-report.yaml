            body: >-
              The available evidence describes SenseTime Medical as a hospital-oriented platform rather than a single
              diagnostic SKU. Yicai reports nearly 100 clinical auxiliary diagnosis and treatment tools, full-cycle
              patient-service systems, and medical-research agents, while 36Kr describes applications spanning clinical
              diagnosis and treatment, decision-making, patient services, and medical research. The stated workflow runs
              from clinical assessment and imaging interpretation through reporting, decision support, patient services,
              and research. That breadth is strategically useful for a hospital buyer seeking fewer vendors, but the
              public record does not separate generally available products from pilots, nor does it provide module-level
              deployment counts, uptime, or outcome denominators.
