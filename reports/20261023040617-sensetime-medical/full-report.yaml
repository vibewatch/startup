  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical describes a broad platform spanning imaging, clinical decision support, patient
              services, and research, while the available independent evidence is mostly sector-level rather than
              subsidiary-level. The World Health Organization describes large multi-modal models as able to accept
              different data types and generate outputs beyond the input type, but explicitly says it is not yet proven
              that they can accomplish a wide range of tasks and purposes. That uncertainty is material when a medical
              platform moves from workflow assistance toward diagnosis, medication consultation, or clinical decision
              support. FDA's fetched page is a device-list resource rather than evidence that SenseTime Medical holds a
              specific authorization, so public evidence does not establish product-by-product approval status. The
              practical mitigation is a product register linking each module to intended use, jurisdiction, model
              version, validation population, human override, post-market monitoring, and approval or exemption status.
              Until that register and prospective performance evidence are produced, regulatory and patient-safety
              exposure should remain high rather than being inferred away from the company's platform narrative.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR010
              - CR013
      - number: '7.2'
        title: Operational, security, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The company-reported strategy emphasizes whole-hospital deployments, a dual platform for model and agent
              production, flexible deployment, and an ecosystem of industrial and financial partners. Those features can
              improve integration value but create a larger operational attack surface: data interfaces, deployment
              configuration, model updates, partner access, and hospital change management all become control points.
              PwC's care-ecosystem discussion highlights data sharing among providers, payors, health-tech companies,
              and life-science firms as an enabler of proactive care, which also illustrates why permissions,
              provenance, and continuity controls matter. The fetched pool contains no verified SenseTime Medical
              breach, outage, recall, or security certification; that absence is a diligence gap, not evidence that no
              incident occurred. The operating control to request is a deployment-by-deployment map with uptime,
              rollback, incident response, access logs, backup, vendor and subprocessor inventories, and named owners
              for clinical escalation.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Capital, commercialization, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              36Kr reports that SenseTime Medical said its Series A subscription exceeded RMB500 million and that
              post-investment valuation exceeded RMB3 billion; a separate Fineline brief reports RMB500 million-plus and
              USD73.3 million, but presents forward-looking commercial and regulatory statements. These are reported
              financing figures, not cash available, revenue, runway, or proof of returns. The same 36Kr account says
              the company is pursuing large whole-hospital digitization projects while radiating standardized modules to
              primary hospitals, and cites Kiang Wu Hospital as having purchased more than a dozen products over time.
              That is useful evidence of commercial ambition and one named deployment relationship, but it does not
              establish renewal, margin, customer concentration, or independent outcome measurement. The thesis
              therefore breaks if the company cannot demonstrate module-level clinical validation, repeatable
              implementation economics, clean governance separation from the parent, or enough liquidity to fund long
              hospital sales cycles. Management should supply subsidiary financial statements, financing terms, customer
              cohort and renewal data, implementation backlog, and a dated regulatory roadmap before a higher-conviction
              investment view.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more before underwriting
            body: >-
              Public evidence supports a high residual-risk posture because the core unknowns are control and outcome
              measures, not merely narrative detail: module-level approvals, validation, security incidents, governance
              separation, renewal economics, and runway are not established by the assigned sources.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case rests on a platform rather than a single diagnostic feature. 36Kr reports that
              SenseTime Medical has pursued whole-hospital deployment since 2018, combines the Da Yi healthcare
              large-language model with multimodal medical-image models, and has commercialized applications across
              diagnosis, decision support, patient services, and research. The same source says Kiang Wu Hospital in
              Macau purchased more than a dozen products over time, which is a useful account-expansion signal but not a
              disclosed recurring-revenue measure. The anti-thesis is that the financing narrative is materially
              stronger than the operating disclosure: neither the financing reports nor the market materials establish
              subsidiary revenue, gross margin, renewal, concentration, cash burn, or a defensible valuation multiple. A
              broad product matrix can increase implementation scope and switching costs, but it can also increase
              services intensity, regulatory burden, and capital needs.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV009
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest retained financing evidence is internally consistent on the broad headline but not on every
              round label. Fineline reports a Q1 2026 Series A of more than RMB 500 million, described as US$73.3
              million, led by Raffles Healthcare Growth Fund and Lion Partners Capital. 36Kr reports a strategic Pre-A+
              financing of hundreds of millions of yuan, says the company had launched its Series A, and reports a
              post-investment valuation above RMB 3 billion with subscription above RMB 500 million. Crunchbase
              separately lists SenseTime in its April 2026 healthcare unicorn coverage at a US$1 billion valuation and
              explains that its board records post-money priced-round valuations, not internal 409A marks. These are
              financing and mark signals, not evidence of current fair value. An investment decision should require the
              signed term sheet, cap table, liquidation preferences, option-pool treatment, debt or project finance,
              related-party agreements with SenseTime Group, and audited subsidiary revenue and cash-flow data before
              accepting a price.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenarios, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more reliable here when expressed as evidence thresholds than as a fabricated
              discounted-cash-flow output. The bull case requires conversion of hospital breadth into repeatable
              software revenue, strong gross margins, renewal evidence, and financing terms that do not transfer
              disproportionate downside to new investors. The base case assumes continued strategic financing and
              product adoption but keeps the recommendation at research-more because the operating denominator is
              unknown. The bear case is a repricing or down-round if commercialization remains project-led, regulatory
              or clinical validation slows deployment, or parent-company and investor rights constrain exit economics.
              Exit readiness is therefore conditional: a buyer or later-stage investor would need auditable cohort,
              margin, safety, and governance evidence rather than only a large financing headline. The immediate
              diligence path is to reconcile the financing chronology, obtain the full capitalization and preference
              stack, and test whether product breadth produces durable account economics. Three assigned benchmark and
              policy links did not provide usable valuation inputs: MarketsandMarkets resolved to a broad report-search
              page, the TechCrunch search page contained no usable SenseTime Medical article text, and the State Council
              policy URL resolved to a generic homepage. These retrieval outcomes are evidence gaps, not zero values or
              negative proof.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research-more; the reported valuation is not sufficiently supported by public operating data to justify a
              high-conviction buy.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV010
              - CV013
          - type: callout
            title: Thesis-break trigger
            body: >-
              A down-round, preference stack that materially subordinates new capital, or evidence that hospital
              deployments do not renew on software-like economics would break the current platform thesis.
            calloutType: risk
            claimRefs:
              - CV010
              - CV012
