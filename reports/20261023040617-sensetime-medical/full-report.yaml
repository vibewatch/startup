      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The platform thesis could support expansion within a hospital if additional modules and
              institution-specific agents are purchased, but the public record does not disclose renewal, GRR, NRR,
              churn, contract length, attach rates, or top-customer revenue concentration. The reported Kiang Wu
              relationship is evidence of repeat product purchasing, not proof of recurring revenue or durable
              retention. Hospital procurement also creates implementation, validation, and budget-cycle friction: a
              customer may value flexible deployment while still requiring evidence for each workflow. The absence of a
              customer denominator is material because it prevents testing whether the named deployment is
              representative or an outlier.
            claimRefs:
              - CU009
              - CU010
              - CU011
