  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical's customer motion is hospital-led rather than a simple software self-serve funnel. The
              clearest reported buyer is a hospital seeking a broad, extensible supplier: 36Kr says Kiang Wu Hospital
              purchased more than a dozen artificial-intelligence products over time. The reported commercialization
              path combines large whole-hospital digitalization projects with standardized modules for primary
              hospitals, implying different procurement sizes and implementation burdens. The buyer is the hospital or
              health system, users span clinicians and patients, and the payer or budget owner is not publicly
              separated. This segmentation is analytically useful, but public evidence does not disclose revenue by
              segment, geography, channel, or payer.
