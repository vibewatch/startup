              - CI006
              - CI007
          - type: callout
            title: Revenue quality remains the gating unknown
            body: >-
              The assigned evidence does not disclose recognized revenue, gross margin, renewal, concentration, pricing,
              or implementation recovery; those gaps prevent a reliable valuation or capital-need conclusion.
            calloutType: risk
