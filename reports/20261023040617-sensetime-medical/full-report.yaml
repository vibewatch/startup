              - CI008
              - CI009
              - CI013
      - number: '4.3'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial picture is strategically credible but numerically thin. Independent reporting supports the
              existence of strategic financing, a valuation above RMB 3 billion after investment, and a platform
              strategy; it does not provide audited revenue, ARR, gross margin, customer concentration, collections, or
              renewal data. A market-report page in the pool is not usable as company-specific traction evidence, and a
              general healthcare outlook cannot substitute for SenseTime Medical unit economics. The adverse signal is
              that the company's own ecosystem narrative acknowledges pure technology is not a durable barrier, which
              raises the importance of repeatable implementation economics and partner conversion. The appropriate
              stance is research-more: underwrite only after obtaining subsidiary financial statements, customer-level
              revenue bridges, pricing schedules, implementation cost data, cash and debt schedules, and financing
              documents.
