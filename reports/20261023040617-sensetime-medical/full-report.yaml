    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              SenseTime Medical is presented as a healthcare-AI company based in China, focused on hospital solutions,
              medical research, and international markets. The available reporting describes DaYi as the core medical
              language model and SenseCare as an integrated hospital solution spanning clinical care, patient services,
              and research support. The company's positioning is therefore broader than a single imaging product: it
              combines model infrastructure, clinical modules, and hospital implementation. Public evidence does not
              establish a standalone founding date, headquarters city, legal-entity history, pricing, or
              recurring-revenue model, so those items remain diligence gaps rather than inferred facts.
            claimRefs:
