            body: >-
              The technical architecture described by the sources has three connected layers: a foundation-model layer,
              application and agent-production tooling, and hospital-facing clinical modules. 36Kr attributes
              perception, reasoning, and planning capabilities to DaYi and says the imaging model group supports
              detection, segmentation, and classification across radiology and pathology, including limited-sample and
              weak-annotation training. The same article describes a dual-platform approach intended to let hospitals
              develop domain-specific models and agents, which suggests flexible deployment and local customization.
              These are company or media descriptions, not a reproducible technical evaluation; no public API
              documentation, model cards, benchmark protocol, latency, integration standard, or change log was found in
              the assigned pool.
