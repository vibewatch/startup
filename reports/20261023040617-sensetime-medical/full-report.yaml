      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports product breadth and at least one named hospital deployment, but it does not
              establish a verified active-account count, repeat purchase rate, production utilization, or clinical
              outcome. The 36Kr account describes practical applications across clinical diagnosis and treatment,
              intelligent decision-making, patient services, and medical research, while also describing more than a
              dozen products purchased by Kiang Wu Hospital. A separate financing brief describes an integrated platform
              spanning imaging, surgical planning, pathology, and multimodal training, but its commercial assertions are
              not independently audited. The adoption trajectory should therefore be read as deployment evidence and
              management-reported scope, not as a measured customer funnel.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
