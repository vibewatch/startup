      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat customer traction as investable evidence, not verified scale
            body: >-
              The evidence supports further diligence on hospital expansion, but a conviction upgrade requires
              site-level production status, renewal cohorts, module attach, customer concentration, and outcomes with
              denominators.
            calloutType: recommendation
            claimRefs:
              - CU001
