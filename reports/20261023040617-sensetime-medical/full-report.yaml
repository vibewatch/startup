              The strongest available leadership evidence comes from a 2026 industry account that identifies Zhang
              Shaoting as founder and CEO and names a broader executive bench including a chief medical officer, chief
              operating officer, chief financial officer, chief strategy officer, and research leader. Zhang's academic
