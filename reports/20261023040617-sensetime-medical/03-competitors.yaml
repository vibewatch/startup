callouts:
  - calloutType: strength
    title: Breadth is the clearest observable differentiator
    body: SenseTime Medical's retained evidence consistently emphasizes hospital integration, multiple clinical workflows, and extensible model or agent deployment rather than a single diagnostic module.
    claimRefs: [CP001, CP002, CP005]
  - calloutType: risk
    title: Technical breadth is not yet a durable moat
    body: The assigned evidence lacks independent head-to-head performance, realized pricing, renewal, and customer concentration data, while the company's CEO is quoted as cautioning that pure technology is difficult to sustain as a long-term barrier.
    claimRefs: [CP011, CP012, CP015]
  - calloutType: recommendation
    title: Underwrite deployment economics before competitive advantage
    body: The next diligence step should compare implementation time, clinical validation, module attach, portability, and realized contract economics against named peers and incumbent hospital systems.
    claimRefs: [CP009, CP013, CP016]

