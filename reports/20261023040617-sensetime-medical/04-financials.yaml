company:
  name: SenseTime Medical
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a platform-led hospital AI commercialization model and substantial strategic financing, but it does not disclose subsidiary revenue, gross margin, cash, burn, runway, or realized pricing. The underwriting case therefore depends more on validating monetization and capital efficiency than on the headline financing amount.
sections:
  - id: monetization-and-commercial-model
    title: Monetization and commercial model
    body: SenseTime Medical describes a whole-hospital platform spanning clinical diagnosis, patient services, research, and hospital management rather than a single diagnostic SKU. The available reporting identifies a dual-platform operating model for agent development and model production, plus standardized software modules for primary hospitals. That architecture can support several revenue mechanisms, but the evidence does not establish the mix of license, subscription, implementation, usage, or procedure fees actually recognized by the subsidiary. A hospital may buy a broad deployment while the vendor absorbs material integration, validation, and support work, so product breadth should not be treated as recurring revenue quality. The clearest diligence task is to reconcile signed contract value, recognized revenue, implementation fees, renewal terms, and module attach by customer cohort.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-needs-and-cost-drivers
    title: Capital needs and cost drivers
    body: The company has raised meaningful strategic capital, including a reported RMB 500 million financing in 2026 and a separate report of more than RMB 500 million subscription for a Series A process. These are financing amounts, not cash available to the subsidiary, and the sources do not disclose proceeds received, ownership, tranches, cash balance, debt, or use-of-proceeds reconciliation. The CEO interview says the company was close to break-even in the prior year and that the latest financing exceeded its then-current funding need; this is a company-reported operating assertion rather than audited evidence. The cost base is likely exposed to clinical validation, hospital implementation, model training, regulatory work, and specialist personnel, but public sources do not quantify those drivers. Until management provides monthly cash-flow and cohort data, runway and financing dependency remain unresolved.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: underwriting-verdict-and-gaps
    title: Underwriting verdict and diligence blockers
    body: >-
      The financial picture is strategically credible but numerically thin. Independent reporting supports the existence of strategic financing, a valuation above RMB 3 billion after investment, and a platform strategy; it does not provide audited revenue, ARR, gross margin, customer concentration, collections, or renewal data. A market-report page in the pool is not usable as company-specific traction evidence, and a general healthcare outlook cannot substitute for SenseTime Medical unit economics. The adverse signal is that the company's own ecosystem narrative acknowledges pure technology is not a durable barrier, which raises the importance of repeatable implementation economics and partner conversion. The appropriate stance is research-more: underwrite only after obtaining subsidiary financial statements, customer-level revenue bridges, pricing schedules, implementation cost data, cash and debt schedules, and financing documents.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: []
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit or payer, Current value or status, Quality, Diligence ask]
    rows:
      - [Whole-hospital platform, "Integrated clinical, patient-service, research, and hospital-management deployment", Hospital or hospital group, "Commercial model described; recognized revenue undisclosed", "Company and third-party reported strategy", "Provide contract-to-revenue bridge and implementation versus recurring split"]
      - [Standardized software modules, "Modules radiated to primary hospitals", Hospital or department, "Planned or described route; price and volume undisclosed", "Company-reported", "Provide SKU list, list and realized pricing, attach, renewal, and deployment counts"]
      - [Medical AI model and agent platforms, "Agent creation and model production infrastructure", Hospital or clinical team, "Capabilities described; monetization not disclosed", "Company-reported", "Provide license, subscription, usage, and support terms"]
      - [Clinical and surgical workflow solutions, "Imaging, pathology, and surgery-support applications", Hospital or clinical service line, "Applications reported; revenue attribution undisclosed", "Third-party reported and company claims", "Provide module-level gross margin, validation cost, and payer evidence"]
    notes: "Sources are mixed company-reported and independent reporting; current value means publicly described status, not recognized revenue, and nulls denote unavailable subsidiary evidence."
    claimRefs: [CI001, CI003, CI004, CI010]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing element, Public evidence, List versus realized, Confidence, Diligence ask]
    rows:
      - [Platform license, "No public price identified in the assigned successful sources", null, low, "Provide executed pricing schedule and contract duration"]
      - [Subscription or SaaS fee, "No public price or billing cadence identified", null, low, "Provide recurring billing, renewal, and cancellation terms"]
      - [Per-case or per-procedure fee, "A third-party brief describes this as a possible model, but does not evidence a SenseTime Medical contract", "Not established", low, "Verify whether any payer or hospital contract uses case-based pricing"]
      - [Implementation and services, "Whole-hospital deployments imply delivery work, but fees and cost recovery are undisclosed", "Not established", medium, "Provide implementation invoices, staffing assumptions, and gross-margin treatment"]
    notes: "This is an evidence inventory, not a price list; no realized pricing, discounting, or revenue-recognition conclusion is inferred from product descriptions."
    claimRefs: [CI002, CI003, CI011, CI012]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, null, low, "Determines scale and revenue quality", "Provide audited subsidiary revenue by stream and customer cohort"]
      - [Gross margin, null, low, "Tests whether implementation and model costs scale", "Provide gross-margin bridge by module and period"]
      - [Cash and runway, null, low, "Tests financing dependency and next-round timing", "Provide latest cash balance, monthly burn, debt, and 24-month plan"]
      - ["CAC, payback, or sales efficiency", null, low, "Tests whether strategic distribution converts economically", "Provide pipeline, win rate, sales cycle, CAC proxy, and payback"]
      - [Break-even status, "CEO said the company was close to break-even last year", medium, "Could indicate lower near-term financing need but is unaudited and undefined", "Provide management accounts, definition, and reconciliation to cash flow"]
    notes: "Nulls are unavailable public inputs; the break-even statement is a company-reported qualitative signal and is not a substitute for audited profitability or cash-burn data."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: The disclosed commercial logic runs from hospital workflow deployment through platform and module usage to potential recurring or usage-linked revenue, with economics still unverified.
    data:
      nodes:
        - id: hospital-need
          label: Hospital workflow need
          detail: Clinical, patient-service, research, and management workflows
        - id: platform-deployment
          label: Platform deployment
          detail: Whole-hospital platform and dual model-production infrastructure
        - id: modules
          label: Modules and agents
          detail: Imaging, pathology, surgery, research, and agent applications
        - id: contract
          label: Contracted service
          detail: License, subscription, implementation, or usage terms are not publicly disclosed
        - id: recognized-revenue
          label: Recognized revenue
          detail: Subsidiary revenue, mix, and recognition policy are unavailable
        - id: gross-profit
          label: Gross profit
          detail: Delivery, validation, compute, and support costs are unavailable
      edges:
        - [hospital-need, platform-deployment]
        - [platform-deployment, modules]
        - [modules, contract]
        - [contract, recognized-revenue]
        - [recognized-revenue, gross-profit]
    approximationNotes: "The sequence is an evidence-backed operating model, not a quantified bridge; no conversion rate, revenue amount, margin, or cumulative total is inferred."
    claimRefs: [CI001, CI002, CI003, CI011, CI013]
callouts:
  - calloutType: insight
    title: Strategic capital is not operating liquidity
    body: Reported financing validates investor interest and may add distribution partners, but it does not establish cash on hand, runway, or funds available to SenseTime Medical.
    claimRefs: [CI005, CI006, CI007]
  - calloutType: risk
    title: Revenue quality remains the gating unknown
    body: The assigned evidence does not disclose recognized revenue, gross margin, renewal, concentration, pricing, or implementation recovery; those gaps prevent a reliable valuation or capital-need conclusion.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
