callouts:
  - calloutType: insight
    title: Platform breadth is commercially relevant but not yet a sizing proof
    body: "A broad hospital platform may increase account expansion potential, but the public record does not disclose attach rates, recurring revenue, pricing, renewal, or customer concentration needed to convert breadth into a defensible SAM or valuation input."
    claimRefs: [CM002, CM004, CM014]
  - calloutType: risk
    title: The bottleneck is deployment proof, not category demand
    body: "Healthcare AI demand is supported by digital-care trends, but adoption remains gated by local validation, integration, regulation, reimbursement, and measurable workflow ROI."
    claimRefs: [CM009, CM010, CM011, CM012]
