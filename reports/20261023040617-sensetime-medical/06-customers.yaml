    claimRefs: [CU001, CU005, CU009, CU010]
callouts:
  - calloutType: recommendation
    title: Treat customer traction as investable evidence, not verified scale
    body: The evidence supports further diligence on hospital expansion, but a conviction upgrade requires site-level production status, renewal cohorts, module attach, customer concentration, and outcomes with denominators.
    claimRefs: [CU001, CU009, CU010, CU012]
