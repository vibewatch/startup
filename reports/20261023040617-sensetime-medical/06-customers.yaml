    rows:
      - ["Kiang Wu Hospital, Macau", "Hospital", "More than a dozen SenseTime Medical AI products purchased over time", "Purchase reported; production utilization not independently verified", "Repeat purchasing is a positive expansion signal", "No contract value, renewal, utilization, or outcome data"]
      - ["Large hospitals and hospital networks", "Hospital / network", "Whole-hospital digitalization projects", "Commercialization route reported; individual deployments not named", "Potential strategic value from broad workflow coverage", "No customer list, win rate, or production denominator"]
      - ["Primary hospitals", "Hospital", "Standardized software modules", "Commercialization route reported; deployment status not named", "Potential lower-complexity expansion path", "No module attach, pricing, channel, or retention data"]
    notes: "This is a partial enumeration. Only Kiang Wu Hospital is named in the fetched customer evidence; the other rows are reported customer cohorts and are not proof of specific deployments."
    claimRefs: [CU001, CU002, CU003, CU005, CU009, CU011]
