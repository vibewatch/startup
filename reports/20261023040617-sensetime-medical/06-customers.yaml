company:
  name: SenseTime Medical
chapter:
  number: 6
  title: Customers
  summary: SenseTime Medical has credible evidence of hospital-oriented adoption and a platform strategy, but public evidence remains concentrated in company-linked or financing coverage. The strongest named deployment is Kiang Wu Hospital in Macau; retention, utilization, customer concentration, and outcome denominators remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      SenseTime Medical's customer motion is hospital-led rather than a simple software
      self-serve funnel. The clearest reported buyer is a hospital seeking a broad,
      extensible supplier: 36Kr says Kiang Wu Hospital purchased more than a dozen
      artificial-intelligence products over time. The reported commercialization path
      combines large whole-hospital digitalization projects with standardized modules
      for primary hospitals, implying different procurement sizes and implementation
      burdens. The buyer is the hospital or health system, users span clinicians and
      patients, and the payer or budget owner is not publicly separated. This
      segmentation is analytically useful, but public evidence does not disclose
      revenue by segment, geography, channel, or payer.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and named proof
    body: Public evidence supports product breadth and at least one named hospital deployment, but it does not establish a verified active-account count, repeat purchase rate, production utilization, or clinical outcome. The 36Kr account describes practical applications across clinical diagnosis and treatment, intelligent decision-making, patient services, and medical research, while also describing more than a dozen products purchased by Kiang Wu Hospital. A separate financing brief describes an integrated platform spanning imaging, surgical planning, pathology, and multimodal training, but its commercial assertions are not independently audited. The adoption trajectory should therefore be read as deployment evidence and management-reported scope, not as a measured customer funnel.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion
    title: Retention, expansion, and concentration
    body: >-
      The platform thesis could support expansion within a hospital if additional
      modules and institution-specific agents are purchased, but the public record does
      not disclose renewal, GRR, NRR, churn, contract length, attach rates, or
      top-customer revenue concentration. The reported Kiang Wu relationship is
      evidence of repeat product purchasing, not proof of recurring revenue or durable
      retention. Hospital procurement also creates implementation, validation, and
      budget-cycle friction: a customer may value flexible deployment while still
      requiring evidence for each workflow. The absence of a customer denominator is
      material because it prevents testing whether the named deployment is
      representative or an outlier.
    claimRefs: [CU009, CU010, CU011, CU012]
    callouts:
      - calloutType: risk
        title: Customer proof is promising but not yet cohort-grade
        body: The evidence supports a hospital-platform adoption thesis, but not a quantified retention or concentration thesis. Request a customer-level schedule showing active sites, production versus pilot status, module attach, renewal cohorts, revenue bands, and outcome denominators.
        claimRefs: [CU009, CU010, CU011, CU012]
