runDate: 2026-10-23
company:
  name: SenseTime Medical
chapter:
  number: 8
  title: Valuation
  summary: SenseTime Medical has credible financing momentum and a reported post-money valuation above RMB 3 billion, but public evidence does not disclose subsidiary revenue, margins, retention, terms, or preferences. The evidence therefore supports research-more rather than a high-conviction buy, with entry discipline focused on verified operating metrics and financing rights.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investment case rests on a platform rather than a single diagnostic
      feature. 36Kr reports that SenseTime Medical has pursued whole-hospital
      deployment since 2018, combines the Da Yi healthcare large-language model
      with multimodal medical-image models, and has commercialized applications
      across diagnosis, decision support, patient services, and research. The
      same source says Kiang Wu Hospital in Macau purchased more than a dozen
      products over time, which is a useful account-expansion signal but not a
      disclosed recurring-revenue measure. The anti-thesis is that the financing
      narrative is materially stronger than the operating disclosure: neither
      the financing reports nor the market materials establish subsidiary
      revenue, gross margin, renewal, concentration, cash burn, or a defensible
      valuation multiple. A broad product matrix can increase implementation
      scope and switching costs, but it can also increase services intensity,
      regulatory burden, and capital needs.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The latest retained financing evidence is internally consistent on the
      broad headline but not on every round label. Fineline reports a Q1 2026
      Series A of more than RMB 500 million, described as US$73.3 million, led
      by Raffles Healthcare Growth Fund and Lion Partners Capital. 36Kr reports
      a strategic Pre-A+ financing of hundreds of millions of yuan, says the
      company had launched its Series A, and reports a post-investment
      valuation above RMB 3 billion with subscription above RMB 500 million.
      Crunchbase separately lists SenseTime in its April 2026 healthcare
      unicorn coverage at a US$1 billion valuation and explains that its board
      records post-money priced-round valuations, not internal 409A marks.
      These are financing and mark signals, not evidence of current fair value.
      An investment decision should require the signed term sheet, cap table,
      liquidation preferences, option-pool treatment, debt or project finance,
      related-party agreements with SenseTime Group, and audited subsidiary
      revenue and cash-flow data before accepting a price.
    claimRefs: [CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV003]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and thesis breaks
    body: >-
      A scenario framework is more reliable here when expressed as evidence
      thresholds than as a fabricated discounted-cash-flow output. The bull
      case requires conversion of hospital breadth into repeatable software
      revenue, strong gross margins, renewal evidence, and financing terms that
      do not transfer disproportionate downside to new investors. The base case
      assumes continued strategic financing and product adoption but keeps the
      recommendation at research-more because the operating denominator is
      unknown. The bear case is a repricing or down-round if commercialization
      remains project-led, regulatory or clinical validation slows deployment,
      or parent-company and investor rights constrain exit economics. Exit
      readiness is therefore conditional: a buyer or later-stage investor would
      need auditable cohort, margin, safety, and governance evidence rather than
      only a large financing headline. The immediate diligence path is to
      reconcile the financing chronology, obtain the full capitalization and
      preference stack, and test whether product breadth produces durable
      account economics. Three assigned benchmark and policy links did not
      provide usable valuation inputs: MarketsandMarkets resolved to a broad
      report-search page, the TechCrunch search page contained no usable
      SenseTime Medical article text, and the State Council policy URL resolved
      to a generic homepage. These
      retrieval outcomes are evidence gaps, not zero values or negative proof.
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: Research-more; the reported valuation is not sufficiently supported by public operating data to justify a high-conviction buy.
    claimRefs: [CV008, CV010, CV013]
  - calloutType: risk
    title: Thesis-break trigger
    body: A down-round, preference stack that materially subordinates new capital, or evidence that hospital deployments do not renew on software-like economics would break the current platform thesis.
    claimRefs: [CV010, CV012]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a buy without operating and term-sheet evidence]
      - [Confidence, medium, Financing signals are credible but subsidiary economics remain undisclosed]
      - [Risk rating, high, "Commercialization, regulatory, governance, and liquidity risks remain material"]
      - [Valuation stance, stretched, Reported marks require revenue and preference-stack reconciliation]
    notes: "Assessment is based on retained financing and market sources; no public subsidiary income statement or cap table was retained."
    claimRefs: [CV008, CV010, CV013]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - [Platform breadth can support account expansion, "36Kr reports more than a dozen products at Kiang Wu Hospital", "Audited module attach and renewal cohorts"]
      - [Strategic capital can accelerate distribution, "Reported investors include healthcare and technology funds", "Signed channel economics and customer-level conversion"]
      - [A billion-dollar mark may be difficult to defend, "Crunchbase reports a US$1bn valuation while operating denominators are absent", "Verified revenue, margin, retention, and comparable transaction set"]
      - [Parent separation may improve focus but create governance complexity, "36Kr describes independent market-oriented operations after the 1+X strategy", "Intercompany contracts, board rights, and related-party disclosure"]
    notes: "The table separates reported signals from the diligence evidence needed to convert them into an investable thesis."
    claimRefs: [CV002, CV004, CV007, CV009]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Hospital deployments convert to recurring software revenue with strong renewals and margin", "A verified revenue multiple could support or exceed the reported mark", "Low-to-medium until cohorts and margins are disclosed", "Renewal or margin evidence fails"]
      - [Base, "Strategic financing continues and product adoption expands, but economics remain opaque", "Maintain research-more; price only after cap table and operating data", "Medium", "Terms or operating data remain unavailable"]
      - [Bear, "Projects remain services-heavy or validation and regulation delay adoption", "Down-round risk and limited liquidity make the reported mark unreliable", "Medium", "Down-round, preference overhang, or stalled commercialization"]
      - [Diligence gate, "Obtain audited subsidiary financials, cap table, terms, cohorts, and quality evidence", "No underwriting conclusion before the gate is met", "High priority", "Any material contradiction in financing or governance records"]
    notes: "No probability-weighted valuation is presented because revenue, margin, cash-flow, and financing-right inputs are not publicly established in the retained evidence."
    claimRefs: [CV010, CV011, CV012, CV013]
