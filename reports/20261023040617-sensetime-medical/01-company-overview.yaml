company:
  name: SenseTime Medical
chapter:
  number: 1
  title: Company Overview
  summary: SenseTime Medical is a hospital-focused healthcare-AI spin-off built around the DaYi medical language model and the SenseCare platform. Public evidence supports a fast financing and commercialization trajectory, but private-company disclosure leaves governance, profitability, and capitalization details unresolved.
sections:
  - id: identity-and-business
    title: Identity and business model
    body: >-
      SenseTime Medical is presented as a healthcare-AI company based in China, focused on hospital solutions, medical research, and international markets. The available reporting describes DaYi as the core medical language model and SenseCare as an integrated hospital solution spanning clinical care, patient services, and research support. The company's positioning is therefore broader than a single imaging product: it combines model infrastructure, clinical modules, and hospital implementation. Public evidence does not establish a standalone founding date, headquarters city, legal-entity history, pricing, or recurring-revenue model, so those items remain diligence gaps rather than inferred facts.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-dependence
    title: Leadership and key-person dependence
    body: >-
      The strongest available leadership evidence comes from a 2026 industry account that identifies Zhang Shaoting as founder and CEO and names a broader executive bench including a chief medical officer, chief operating officer, chief financial officer, chief strategy officer, and research leader. Zhang's academic and medical-AI background is relevant to the company's hospital workflow ambition, while the reported presence of former hospital, research-lab, and parent-company investment executives suggests functional coverage across clinical validation, operations, finance, and strategy. The same evidence indicates roughly 100 employees and more than 70% in research and product roles, but no independent disclosure confirms the roster, retention, or board rights.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, scale, and disclosure
    body: >-
      Public reporting indicates at least US$141 million raised over the six months discussed in December 2025, followed by a reported Pre-A+ round whose subscription exceeded RMB500 million and whose post-money valuation exceeded RMB3 billion. A later account describes a Series A of more than RMB500 million, while a July 2026 report describes a Series B of more than US$100 million and a post-money valuation above RMB10 billion. These figures are press-reported and are not a substitute for audited subsidiary financials: exact proceeds, ownership, dilution, revenue, margins, burn, runway, and capitalization remain unavailable in the retained evidence.
    claimRefs: [CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Milestones and diligence implications
    body: >-
      The company appears to have moved from a medical-AI business inside SenseTime toward an independently financed platform with hospital and international ambitions. Reported milestones include the DaYi and SenseCare platform build-out, more than 40 clinical AI modules, partnerships involving Ruijin Hospital and Roche, Singapore medical-device registration, Indonesia projects, and successive financing rounds. The evidence is encouraging on product breadth and strategic momentum, but it also highlights a diligence asymmetry: benchmark leadership claims are self-constructed, commercialization economics are not disclosed, and the retained adverse evidence is limited. Investors should verify legal separation, board and related-party arrangements, clinical validation, and financing terms directly.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Platform breadth with early international validation
    body: >-
      The retained reporting links SenseCare and DaYi to hospital workflows, more than 40 clinical modules, Roche-related research support, and Singapore registration, providing a broader operating base than a single point solution.
    claimRefs: [CO003, CO013, CO014]
  - calloutType: risk
    title: Momentum is better evidenced than standalone economics
    body: >-
      Financing and valuation milestones are visible, but the retained sources do not disclose subsidiary revenue, profitability, ownership, or exact financing terms; the valuation case therefore remains sensitive to private-company information asymmetry.
    claimRefs: [CO012, CO016]
