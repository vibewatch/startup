  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: Audited subsidiary revenue, gross margin, cash burn, runway, and a reconciled financing ledger.
      whyItMatters: Financing momentum cannot establish sustainable economics or support a valuation without operating and cash-flow evidence.
      diligencePath: Obtain management accounts, monthly cash-flow reporting, round documents, and a capitalization table under NDA.
      relatedQuestionRefs: [QO001, QO005, QO007, QO008, QO009]
    - type: private-evidence-only
      severity: material
      topic: governance-TO002
      missingEvidence: Board composition, reserved matters, parent-company agreements, and related-party financing terms.
      whyItMatters: The spin-off structure may affect control, economics, and the durability of SenseTime Group support.
      diligencePath: Review articles of association, shareholder agreements, board minutes, and material related-party contracts.
      relatedQuestionRefs: [QO003, QO009]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: financing
      missingEvidence: Primary round announcements reconciling the reported US$141 million, RMB500-million-plus Series A, and later Series B figures and dates.
      whyItMatters: Public reports use different periods, currencies, and round labels, so cumulative funding and valuation cannot safely be added.
      diligencePath: Request signed term sheets, closing notices, investor confirmations, and a currency/date-normalized financing schedule.
      relatedQuestionRefs: [QO004, QO007]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: material
      topic: adverse
      missingEvidence: Independent records covering litigation, sanctions, regulatory actions, outages, recalls, and leadership departures at the subsidiary level.
      whyItMatters: The current pool contains limited direct adverse evidence, so absence of a reported incident is not proof of absence.
      diligencePath: Commission legal, regulatory, and sanctions searches across China and each target expansion market.
      relatedQuestionRefs: [QO007]
