callouts:
  - calloutType: risk
    title: Research-more before underwriting
    body: >-
      Public evidence supports a high residual-risk posture because the core unknowns are control and outcome measures, not merely narrative detail: module-level approvals, validation, security incidents, governance separation, renewal economics, and runway are not established by the assigned sources.
    claimRefs: [CR003, CR007, CR012, CR015]
