      - [AI-enabled medical-device authorization, "United States / export markets", "FDA source is a device-list page; no SenseTime authorization was verified in the fetched text", Medium, High, "Map every module to jurisdiction, predicate, filing, and post-market obligation", High]
      - [Patient data governance and model training, "China / cross-border", "Data-governance controls and permissions were not disclosed in assigned evidence", High, High, "Provide data lineage, consent/legal basis, retention, access, localization, and subprocessor controls", High]
      - [Clinical decision-support liability, "Hospital contracting jurisdictions", "Product claims include clinical decision-support scenarios; liability allocation was not evidenced", Medium, High, "Review contracts, escalation rules, audit trails, and insurer coverage by module", Medium-high]
    notes: "Rows synthesize the assigned WHO, FDA, 36Kr, and company-brief evidence; null or unverified status means the fetched pool did not establish the fact, not that the exposure is absent."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented regulatory and legal exposures identified from assigned 2026 refresh evidence, not a complete jurisdictional legal inventory."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Model error or drift in diagnosis support, High, High, "Not evidenced at subsidiary level", High, "Module-level sensitivity, specificity, calibration, drift, and rollback metrics"]
      - [Data-interface or deployment failure across hospitals, Medium-high, High, "Flexible deployment is described; control evidence is absent", High, "Deployment architecture, uptime, rollback tests, and incident records"]
      - [Unauthorized access or privacy incident, Medium, High, "No assigned source verifies certification or incident controls", High, "Pen-test summaries, access logs, DPA/subprocessor list, breach playbook"]
      - [Implementation and change-management failure, High, Medium-high, "Platform strategy and partner ecosystem are described; delivery KPIs are absent", Medium-high, "Backlog aging, implementation cycle time, support ratios, and escalation ownership"]
    notes: "Likelihood and severity are risk judgments anchored to the documented use cases and missing control evidence; they are not incident counts or probabilities."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Parent relationship and governance, SenseTime Group, "Spinoff and strategic operating relationship", "Not disclosed", "Shared systems, contracts, IP, or controls create governance or separation friction", High, "Provide related-party agreements, IP ownership, service levels, and board rights", High]
      - [Hospital implementation channel, Hospital networks and public hospitals, "Whole-hospital digitization and module deployment", "Potentially concentrated; denominator unavailable", "Procurement delays or weak renewals slow revenue conversion", High, "Provide cohort, renewal, backlog, implementation margin, and concentration metrics", High]
      - [Strategic capital and ecosystem, Named strategic and financial investors, "Funding and commercial ecosystem", "Terms unavailable", "Capital or partner support does not translate into cash runway or distribution", Medium-high, "Provide financing terms, use of proceeds, runway, and partner-sourced pipeline", Medium-high]
      - [Data and technology ecosystem, Hospital and external data providers, "Training, integration, and model production", "Unknown", "Access, quality, or permission changes degrade model performance", High, "Provide data-source inventory, SLAs, provenance, and fallback datasets", High]
    notes: "Counterparty roles are drawn from the assigned reporting; concentration, terms, and failure probabilities remain open where denominators or contracts were not published."
    claimRefs: [CR009, CR010, CR011, CR012, CR013]
