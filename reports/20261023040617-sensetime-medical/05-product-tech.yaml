company:
  name: SenseTime Medical
chapter:
  number: 5
  title: Product & Technology
  summary: SenseTime Medical presents a hospital-wide platform built around the DaYi medical large language model, multimodal imaging models, and agent/model production tooling. Public material supports a broad workflow and product map, but independent validation of clinical performance, production reliability, security controls, and regulatory status remains limited.
sections:
  - id: product-workflow
    title: Product surface and hospital workflow
    body: >-
      The available evidence describes SenseTime Medical as a hospital-oriented platform rather than a single diagnostic SKU. Yicai reports nearly 100 clinical auxiliary diagnosis and treatment tools, full-cycle patient-service systems, and medical-research agents, while 36Kr describes applications spanning clinical diagnosis and treatment, decision-making, patient services, and medical research. The stated workflow runs from clinical assessment and imaging interpretation through reporting, decision support, patient services, and research. That breadth is strategically useful for a hospital buyer seeking fewer vendors, but the public record does not separate generally available products from pilots, nor does it provide module-level deployment counts, uptime, or outcome denominators.
    claimRefs: [CE001, CE002, CE003, CE004, CE015]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-and-maturity
    title: Architecture, deployment, and maturity
    body: >-
      The technical architecture described by the sources has three connected layers: a foundation-model layer, application and agent-production tooling, and hospital-facing clinical modules. 36Kr attributes perception, reasoning, and planning capabilities to DaYi and says the imaging model group supports detection, segmentation, and classification across radiology and pathology, including limited-sample and weak-annotation training. The same article describes a dual-platform approach intended to let hospitals develop domain-specific models and agents, which suggests flexible deployment and local customization. These are company or media descriptions, not a reproducible technical evaluation; no public API documentation, model cards, benchmark protocol, latency, integration standard, or change log was found in the assigned pool.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
  - id: trust-and-diligence
    title: Differentiation, controls, and diligence gaps
    body: >-
      The proposed moat is an integrated product matrix and hospital ecosystem, not a demonstrated model score. 36Kr quotes the CEO that technology may provide an early-mover advantage but a broad product portfolio and capital-supported ecosystem are harder to replicate; Fineline similarly characterizes the platform as spanning imaging, surgical planning, pathology, and multimodal training. The sources also state that the company is pursuing hospital-wide projects and standardized modules for primary hospitals. However, the pool contains no technical security or privacy documentation, independent clinical trial results, certification records, incident history, service-level commitments, or evidence that described AI outputs are safely supervised in care delivery. Those omissions are material implementation and patient-safety risks.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014]
    tableRefs: []
