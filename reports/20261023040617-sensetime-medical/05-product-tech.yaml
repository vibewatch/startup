figures:
  - id: FE001
    title: SenseTime Medical product architecture map
    type: stack
    summary: Public descriptions place foundation models beneath agent production and hospital-facing clinical workflows.
    data:
      layers:
        - label: Foundation data and models
          detail: Medical knowledge data plus multimodal medical images, text, and biological information.
          items:
            - label: SenseTime foundation model
              detail: Reported basis for DaYi; training scale and evaluation protocol are not independently disclosed.
            - label: Multimodal imaging models
              detail: Detection, segmentation, and classification across described radiology and pathology tasks.
        - label: Medical intelligence layer
          detail: DaYi is described as providing perception, reasoning, and planning.
          items:
            - label: DaYi medical LLM
              detail: Supports self-diagnosis, medication consultation, structured imaging reports, and decision support.
        - label: Production and customization
          detail: Dual platforms are described for agent development and model application production.
          items:
            - label: Agent development
              detail: Hospitals can reportedly create domain-specific agents.
            - label: Model application production
              detail: Hospitals can reportedly produce specialized models and applications.
        - label: Clinical workflow modules
          detail: Applications are described across diagnosis, treatment, patient services, and research.
          items:
            - label: Imaging and pathology
              detail: Imaging interpretation and pathology use cases are described; deployment evidence is incomplete.
            - label: Surgical planning
              detail: Listed in financing coverage; clinical validation and approval status are not shown.
        - label: Hospital operating model
          detail: Whole-hospital digitalization and standardized modules are described as commercialization paths.
          items:
            - label: Hospital-wide projects
              detail: Large-scale projects are described as a focus.
            - label: Primary-hospital modules
              detail: Standardized software modules are described as a route to broader scale.
        - label: Oversight and assurance
          detail: Public evidence in this pool does not establish the controls needed for clinical deployment.
          items:
            - label: Clinical supervision
              detail: Human oversight, safety monitoring, and escalation controls are not documented.
            - label: Security and compliance
              detail: Security, privacy, certification, and incident evidence are not available in the assigned pool.
    claimRefs: [CE005, CE006, CE007, CE010, CE012, CE015]
callouts:
  - calloutType: strength
    title: Integrated hospital workflow thesis
    body: A broad matrix covering clinical, patient-service, and research workflows could reduce hospital vendor fragmentation if modules are genuinely interoperable and clinically validated.
    claimRefs: [CE001, CE002, CE009]
  - calloutType: risk
    title: Technical maturity is not independently demonstrated
    body: The assigned evidence describes capabilities and product breadth but does not provide reproducible benchmarks, safety controls, production reliability, or regulatory records.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
