  evidenceGaps:
    - type: missing-source
      severity: material
      topic: clinical-validation
      missingEvidence: Independent prospective clinical studies and modality-specific benchmark results for DaYi and imaging modules.
      whyItMatters: Product breadth and reported capabilities do not establish diagnostic safety, accuracy, or clinical impact.
      diligencePath: Obtain study protocols, held-out test results, regulatory submissions, and named hospital references for each material module.
      relatedQuestionRefs: [QE004, QE008]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Security, privacy, audit, human-override, incident, and certification documentation.
      whyItMatters: Hospital deployment exposes protected health information and patient-safety decisions to model and integration risk.
      diligencePath: Request current security architecture, access-control matrix, audit logs, incident register, certifications, and clinical escalation procedures.
      relatedQuestionRefs: [QE007]
    - type: enumeration-incomplete
      severity: material
      topic: deployment
      missingEvidence: A module-level inventory distinguishing production, pilot, roadmap, and discontinued products.
      whyItMatters: Nearly 100 tools and a broad product matrix may overstate deployed maturity if status is not separated.
      diligencePath: Reconcile SKU list, hospital contracts, active sites, usage volumes, renewal status, and release history.
      relatedQuestionRefs: [QE001, QE004]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public API, package, repository, release, or practitioner-community evidence for the medical platform.
      whyItMatters: External technical signals would help test maintenance activity and integration readiness.
      diligencePath: Request a customer-facing developer portal, integration catalog, release notes, or permitted technical demonstration.
      relatedQuestionRefs: [QE008]
