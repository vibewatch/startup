      - ["Landvault monetization modules", "Hosting plus ad/ecommerce modules; no public module pricing disclosed", "No realized pricing disclosed", "Take rate, ad yield, and client minimums unknown", "Napster press release and GamesBeat coverage (Jul 2024)"]
      - ["Obsess storefront offering", "Commercial terms not publicly disclosed", "No list or realized pricing disclosed", "Integration pricing and customer migration terms unknown", "CXM Today coverage (Jan 2025)"]
    notes: "Rows distinguish public product descriptions from absent contract economics; unknown means the assigned sources did not disclose price realization."
    claimRefs: ["CI005", "CI006", "CI007", "CI008", "CI010", "CI011"]
  - id: "TI003"
    title: "Unit economics table"
    columns:
      ["Metric", "Value", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Reported revenue (2024)", 75000000, "medium", "Anchors current scale but not quality of earnings", "Request audited 2024 income statement and revenue bridge"]
      - ["Reported revenue (2023)", 50000000, "medium", "Provides a baseline for rough growth math", "Request audited 2023 comparator and monthly revenue trend"]
      - ["Implied 2023-2024 growth", "50% estimated", "low", "Suggests momentum if figures are comparable, but source quality is limited", "Request organic vs acquisition-driven growth split"]
      - ["July 2024 financing mix", "$350M equity; not debt", "high", "Supports liquidity optics but not current runway", "Request cash waterfall, restrictions, and board-approved use-of-funds plan"]
      - ["Disclosed 2024 M&A deployment", "$800M transaction value", "high", "Shows capital intensity and integration burden", "Request cash vs stock consideration, earnouts, and integration budget"]
      - ["Implied dilution from disclosed rounds", "~7% (Jul 2024) and ~24% (Jan 2025)", "low", "Shows how much ownership may have been exchanged for financing", "Request actual cap table, option pool changes, and share counts by round"]
      - ["Gross margin", null, "low", "Core underwriting metric is absent from public evidence", "Request gross margin by product, services, and acquired platform line"]
      - ["CAC / payback", null, "low", "Sales efficiency cannot be underwritten from the public record", "Request pipeline, win-rate, CAC, and payback cohorts"]
      - ["Current unrestricted cash / runway", null, "low", "Capital adequacy cannot be verified from announced fundraises alone", "Request month-end cash, burn, debt schedule, and 12-18 month runway plan"]
      - ["Verified profitability / EBITDA", null, "medium", "No verified profitability figure was found in the assigned public evidence", "Request audited EBITDA, free cash flow, and cash-conversion bridge"]
    notes: "Null means the assigned prefetched sources did not disclose the metric publicly; estimated rows are explicitly marked."
    claimRefs: ["CI002", "CI003", "CI012", "CI013", "CI014", "CI016"]
