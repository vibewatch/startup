        - Unaudited company figure and not a SAM / SOM measure.
    notes: >-
      This chapter preserves non-comparable lenses on purpose: sector TAM, company valuation,
      financing, and revenue each describe a different denominator and should not be collapsed into
      one market-size claim.
    claimRefs: [CM003, CM009, CM010, CM011]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Global brands and retailers
        - Brand, ecommerce, or digital-merchandising leader
        - Ecommerce, creative, and campaign teams
        - Retail or brand-marketing budget
        - Launch 3D stores, branded experiences, and conversion-led merchandising
        - CMO or head of ecommerce
        - Better engagement and conversion without giving up customer data ownership
      - - Enterprise and public-sector programs
        - Innovation, operations, or transformation sponsor
        - Experience builders, agency partners, and program teams
        - Program or transformation budget
        - Build digital twins, hosted environments, and measured immersive experiences
        - CIO, digital transformation lead, or program executive
        - Need for custom hosting, measurement, monetization, or stakeholder engagement
      - - Creators, artists, and media rights holders
        - Creator business team, label, league, or broadcaster
        - Fans, communities, and content operators
        - Rights-holder or partner-marketing budget
        - Create audience-owned listening, fan, or content spaces
        - Head of partnerships, audience, or digital media
        - Desire to monetize owned audiences instead of renting distribution
      - - Developers, agencies, and solution partners
        - Technical lead or delivery partner
        - Designers, developers, and 3D content teams
        - Client-delivery or platform budget
        - Publish browser-based immersive projects with reusable platform tooling and AI assistance
        - VP engineering, digital product, or agency principal
        - Faster deployment of differentiated immersive experiences for clients or internal teams
    notes: >-
      Buyer / user / payer roles are inferred from use cases, named customers, and management
      language in the assigned sources; no source in the pool discloses contract-level pricing or
      average deal size by segment.
    claimRefs: [CM002, CM006, CM007, CM012, CM015]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The evidence narrows from a broad company-stated sector narrative toward progressively tighter
      company-specific scale and adoption proofs.
    data:
      items:
        - label: Company-stated immersive opportunity
          displayValue: Nearly $1T by 2030
          note: Company projection for the global immersive technology market; methodology is not disclosed in the assigned pool.
          claimRefs: [CM003]
        - label: Latest private valuation
          displayValue: $12.25B
          note: Jan. 2025 valuation from the funding round; a pricing signal, not a TAM estimate.
          claimRefs: [CM009]
        - label: Reported 2024 revenue
          displayValue: $75M
          note: Secondary compilation attributed to Forbes on Silicon Valley Invest Club.
          claimRefs: [CM010]
        - label: Enterprise / government delivery proof
          displayValue: 200+ clients
          note: Landvault said it had helped over 200 clients enter virtual worlds, including government and Fortune 500 organizations.
          claimRefs: [CM006]
        - label: Brand-commerce deployment proof
          displayValue: 400+ 3D stores
          note: Obsess had launched over 400 3D digital stores and experiences before acquisition.
          claimRefs: [CM007]
        - label: AI-enabled adjacency expansion
          displayValue: $500M Touchcast deal
          note: SiliconANGLE said the AI stack would extend use cases across Napster, brands, and small businesses.
          claimRefs: [CM015]
    approximationNotes: >-
      This is not a proportional TAM / SAM / SOM stack. It intentionally layers different evidence
      lenses — sector narrative, company valuation, revenue, and deployment proof — to show how the
      public record narrows from broad aspiration to supportable operating evidence.
    claimRefs: [CM003, CM006, CM007, CM009, CM010, CM015]
callouts:
  - calloutType: risk
    title: Independent market sizing is still missing
    body: >-
      The pool contains company-issued TAM language, private-market valuation snapshots, and a few
      operating proof points, but it does not contain an independent report that isolates Infinite
      Reality's SAM or pricing-backed SOM. That limits how confidently the market case can be tied
      to underwriting assumptions.
    claimRefs: [CM003, CM009, CM010, CM011, CM013]
  - calloutType: insight
    title: The budget line is workflow-led, not metaverse-led
    body: >-
      The retained evidence points to budgets tied to commerce conversion, first-party data
      ownership, digital twins, media engagement, and AI-assisted service or selling. That is a
      more concrete go-to-market frame than treating the addressable market as one undifferentiated
      "metaverse" category.
    claimRefs: [CM004, CM005, CM012, CM015]
