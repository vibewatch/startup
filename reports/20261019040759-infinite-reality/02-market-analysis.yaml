  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: An independent market study or public-company disclosure that isolates Infinite Reality's SAM or SOM by workflow, budget owner, and geography.
      whyItMatters: Without a workflow-specific SAM or SOM, valuation and TAM claims cannot be tied cleanly to an underwriting capture model.
      diligencePath: Obtain analyst or public-company market studies for immersive commerce, digital twins, and AI-assisted experience software, then map only the overlapping slices to Infinite Reality's current product scope.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: pricing-and-roi
      missingEvidence: Pricing, contract values, conversion uplift, retention, and segment-level win evidence for iR Studio, Landvault, Obsess, and Touchcast-enabled offers.
      whyItMatters: Market adoption is easier to believe when budgets, payback, and repeatability are quantified rather than described qualitatively.
      diligencePath: Request customer case studies with baseline-vs-lift metrics, sales collateral with packaging and pricing, and cohort or renewal data by segment.
      relatedQuestionRefs: [QM005, QM008]
      relatedTableRefs: [TM003]
