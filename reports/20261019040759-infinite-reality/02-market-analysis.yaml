        - Global private capital markets
        - $12.25B latest valuation
        - n/a
        - Latest disclosed financing valuation snapshot
        - Medium
        - Valuation is an investor pricing signal, not market size.
      - - Financing accumulation lens
        - Caplight / accessed 2026
        - Global private capital markets
        - $3.4B total raised
        - n/a
        - Cumulative capital formation around the company
