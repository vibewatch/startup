callouts:
  - calloutType: risk
    title: Kill criteria before new capital is underwritten
    body: >-
      The investment case should break if management cannot produce documentary closure on the
      failed 2025 financing episode, a reconciled cap table, and current liquidity proof.
      A second break point is the inability to show asset-level integration KPIs for the 2024-2025
      roll-up; without that, each new acquisition increases surface area faster than it increases
      verified earning power.
    claimRefs: [CR003, CR004, CR010, CR013, CR014]
