  evidenceGaps:
    - type: missing-source
      severity: material
      topic: liquidity-opacity
      missingEvidence: Current unrestricted cash balance, debt schedule, covenant package, and a board-approved runway bridge.
      whyItMatters: Financing credibility cannot be re-underwritten from the public record without knowing how much real cash remains after the failed 2025 round narrative.
      diligencePath: Request the latest cash reconciliation, debt agreements, monthly burn bridge, and management's downside liquidity case.
      relatedQuestionRefs: [QR005, QR008]
    - type: missing-source
      severity: material
      topic: unresolved-liabilities
      missingEvidence: Documentary closure on the failed 2025 financing episode, including rescission mechanics, indemnities, and any regulator or litigation correspondence.
      whyItMatters: Residual legal or governance liabilities could impair future financing, delay a public-market path, or create surprise obligations for new investors.
      diligencePath: Obtain outside-counsel summaries, board minutes, rescission paperwork, and any notices tied to the financing reversal.
      relatedQuestionRefs: [QR002, QR008]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: integration-kpis
      missingEvidence: Asset-level integration KPIs covering customer retention, revenue mix, cost synergies, and product-consolidation milestones for the 2024-2025 acquisitions.
      whyItMatters: The biggest non-legal risk is that the acquisition engine broadens the story faster than it broadens durable earning power.
      diligencePath: Request post-close dashboards by acquired asset, segment revenue bridge, headcount-retention data, and product-roadmap consolidation checkpoints.
      relatedQuestionRefs: [QR003, QR004, QR008]
      relatedTableRefs: [TR002, TR003]
