company:
  name: "Infinite Reality"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Infinite Reality competes less as a single-purpose software vendor than as an acquisition-led bundle spanning immersive commerce, virtual-world production, and AI engagement tooling. The assigned source pool supports real capability breadth and named enterprise proof in acquired businesses, but it also shows that pricing, trust posture, and moat durability remain materially under-documented in public evidence.
sections:
  - id: "landscape-and-solution-classes"
    title: "Landscape and solution classes"
    body: >-
      The assigned evidence suggests Infinite Reality is trying to win a broad “immersive digital experience” budget rather than a narrow point-solution line item. Official and profile-style sources consistently describe iR Studio as a browser-based creation product and iR Enterprise as a services layer, while the 2024–2025 acquisition trail added specialist depth in immersive commerce (Obsess), virtual-world infrastructure and digital twins (Landvault), and AI avatar / agent capabilities (Touchcast). That means the practical competitive set is mixed: direct immersive-commerce tools, virtual-experience builders, AI engagement layers, and the status-quo alternative of keeping branded commerce on conventional 2D web surfaces or building custom immersive workflows internally. Caplight’s comparable list adds three externally tagged peers — BrandLab360, Journee Technologies, and Emperia — but the assigned pool does not contain enough direct operating evidence to profile those names beyond their appearance as business-model analogs.
    claimRefs: ["CP001", "CP002", "CP006", "CP008", "CP013", "CP014"]
    tableRefs: ["TP001"]
  - id: "capability-distribution-and-packaging"
    title: "Capability, distribution, and packaging comparison"
    body: >-
      Infinite Reality’s strongest public differentiation claim is bundle breadth. Obsess brought 400-plus launched 3D storefronts and cross-platform commerce deployment; Landvault added virtual-world buildout, local/custom hosting, first-party data control, monetization modules, and a client base that spans brands and government organizations; Touchcast added AI-avatar and interactive-video capabilities. In combination, the company can argue for a fuller stack than a single specialist. The tradeoff is that the public evidence is much richer on capabilities than on packaging. Across the assigned source pool, none of Infinite Reality, Obsess, Landvault, Touchcast, or the Caplight-listed analogs disclose enough public pricing detail for a durable apples-to-apples rate-card comparison. The same opacity affects trust posture: the pool supports product and customer-name claims, but it does not provide independent compliance, security, or regulatory proof that would make trust a demonstrated buying advantage.
    claimRefs: ["CP003", "CP004", "CP005", "CP007", "CP009", "CP010", "CP015"]
    tableRefs: ["TP002", "TP003"]
  - id: "durability-and-displacement-risk"
    title: "Durability and displacement risk"
    body: >-
      The central strategic question is whether Infinite Reality’s breadth compounds into durable distribution power or simply assembles adjacent specialist products under one corporate shell. The evidence supports real enterprise proof in acquired assets, but it also shows a roll-up profile: acquisitions rather than disclosed organic product traction appear to explain much of the category coverage. GamesBeat’s headcount snapshot and Road to VR’s skepticism both point in the same direction: the company’s story is unusual because it is stitching together immersive infrastructure, commerce, media, and AI pieces unusually quickly. That can reduce buyer vendor-management friction if integration works, yet it also leaves room for displacement by focused specialists, incumbent 2D commerce stacks, or internal builds where a buyer values control more than a bundled platform. On current public evidence, Infinite Reality has breadth, but its moat still looks integration-dependent rather than independently proven.
    claimRefs: ["CP008", "CP011", "CP012", "CP014"]
    figureRefs: ["FP001"]
