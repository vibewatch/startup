callouts:
  - calloutType: "insight"
    title: "The competitive story is bundle-first"
    body: >-
      Infinite Reality’s clearest public differentiation is not a single breakthrough product; it is the breadth created by stitching together specialists in commerce, immersive infrastructure, and AI engagement.
    claimRefs: ["CP002", "CP008", "CP013"]
  - calloutType: "risk"
    title: "Moat durability still depends on integration quality"
    body: >-
      Public evidence shows real acquired capabilities, but it does not yet prove that the combined platform is harder to replace than focused specialists, incumbent 2D stacks, or internal builds.
    claimRefs: ["CP007", "CP011", "CP015"]
