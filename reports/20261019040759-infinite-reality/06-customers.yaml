schemaVersion: report-v2
artifact: customers
slug: infinite-reality
runDate: 2026-10-19
company:
  name: Infinite Reality
chapter:
  number: 6
  title: Customers
  summary: >-
    Infinite Reality has credible evidence of completed work for global brands and government
    entities, but the strongest scale metrics combine acquired Landvault and Obsess activity with
    company-issued engagement counts. Public evidence supports customer breadth and project
    delivery more clearly than organic iR Studio adoption, retention, or revenue concentration.
sections:
  - id: customer-segments
    title: Enterprise brands dominate the evidenced customer mix
    body: >-
      The retained evidence points to a serviceable customer base across retail and consumer
      brands, entertainment and media properties, government entities, and smaller creators or
      businesses targeted by iR Studio. Enterprise marketing, ecommerce, innovation, and public
      agency teams appear to be the economic buyers, while shoppers, fans, trainees, and citizens
      are the end users. CaseStudies.com lists 11 success-story titles, and company materials name
      brands such as Crate & Barrel, L'Oréal, Vodafone, Warner Bros. Discovery, and Swarovski.
      These references demonstrate breadth, but the sources do not provide a dated roster of
      paying accounts or revenue by segment, so logos should not be treated as proof of current
      recurring relationships.
    claimRefs: [CU001, CU002, CU004]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Reported usage is substantial but not a customer-count metric
    body: >-
      Infinite Reality reported more than 150 million consumer interactions across nearly 500
      immersive experiences as of April 2025. The company defined interactions broadly to include
      product-image clicks, games, cart activity, loyalty sign-ups, AI-agent chats, video views,
      sharing, and navigation, so the number measures events rather than unique consumers,
      contracted customers, revenue, or retention. It also explicitly included activity from
      acquired Obsess and Landvault platforms while excluding iR Studio, Napster, and work on
      third-party platforms such as Roblox. The three disclosed outcome examples are encouraging,
      but the customers are anonymous and the source does not provide sample sizes, measurement
      windows, or independently audited baselines.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-deployment-proof
    title: Acquired portfolios provide the clearest production evidence
    body: >-
      Landvault and Obsess supply the strongest evidence that completed deployments exist.
      Company releases said Landvault had served more than 200 clients and built over 1.2 million
      square feet of virtual experiences, with named work for Mastercard, Standard Chartered,
      Hershey, and a Heineken campaign with Dentsu. Independent coverage from CXM Today reported
      that Obsess had launched more than 400 digital stores and experiences for brands including
      Ralph Lauren, L'Oréal, Crate & Barrel, e.l.f. Cosmetics, J.Crew, and Disney Music Group.
      The words "built" and "launched" are stronger than logo-only evidence, but none of these
      sources establishes which relationships remained active after acquisition or migrated onto
      a common Infinite Reality platform.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Retention, concentration, and organic expansion remain unverified
    body: >-
      No retained source reports NRR, GRR, churn, contract length, renewal rates, top-customer
      revenue share, or customer revenue concentration. The adoption narrative therefore depends
      on a blend of management disclosures and inherited customer books rather than a transparent
      cohort of organic iR Studio accounts. That distinction matters because nearly 500
      experiences and more than 150 million interactions can coexist with low recurring revenue,
      one-off project work, or customer attrition. Silicon Valley Investclub also flags the
      company's claimed January 2025 valuation as disputed and cites reporting about unpaid bills
      and lawsuits; while that does not disprove customer activity, it raises the required standard
      for independently validating commercial claims before underwriting durability.
    claimRefs: [CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale or proof
      - Strategic value
      - Evidence gap
    rows:
      - - Enterprise retail and consumer brands
        - Brand, ecommerce, and marketing teams buy; shoppers use; the enterprise pays.
        - Web-based 3D stores, showrooms, product discovery, and campaign experiences.
        - Named examples include Crate & Barrel, L'Oréal, J.Crew, e.l.f. Cosmetics, Swarovski,
          Mastercard, and Hershey.
        - Provides recognizable reference accounts and commerce-oriented use cases.
        - Active-account count, contract value, and renewal status are not disclosed.
      - - Entertainment and media properties
        - Rights holders and media teams buy; fans and viewers use; the sponsor pays.
        - Interactive fan events, games, video, merchandise, and branded worlds.
        - The case-study index lists titles including Breaking Bad, Fortnite, Redbox, and ESPN
          Valorant Invitational.
        - Extends the platform beyond retail into fandom, content, and merchandise.
        - The index does not distinguish current contracts, pilots, or historical productions.
      - - Government and public-sector entities
        - Ministries and public agencies buy and use; government entities pay.
        - Digital twins, interactive training, safety demonstrations, and public experiences.
        - Company materials cite the UAE Ministry of Finance and projects in the MENA region.
        - Supports a public-sector and geographic-expansion thesis.
        - Procurement status, budget, duration, and repeat work are not public.
      - - Creators, developers, and smaller businesses
        - Creators and business operators are intended buyers and users.
        - No-code creation and publication of immersive websites through iR Studio.
        - A company-issued release describes a target range from small businesses to Fortune 500
          companies.
        - Could broaden distribution beyond bespoke enterprise projects.
        - No paid-account count, conversion rate, or retention cohort is disclosed.
    notes: >-
      Segments synthesize the assigned source pool; named logos and company positioning do not
      establish current account status, segment revenue, or recurring-contract quality.
    claimRefs: [CU001, CU002, CU004, CU013]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Period
      - Issuer
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - Consumer interactions
        - More than 150 million
        - Through 2025-04-08
        - Infinite Reality
        - Medium
        - Shows material engagement volume across deployed immersive experiences.
        - Events are not unique consumers, paying accounts, revenue, or retained customers.
      - - Immersive experiences represented in the interaction total
        - Nearly 500
        - Through 2025-04-08
        - Infinite Reality
        - Medium
        - Indicates a sizable cumulative deployment footprint.
        - The total includes acquired Obsess and Landvault work and does not identify active sites.
      - - Landvault client footprint
        - More than 200 clients
        - Reported 2024-07-09
        - Infinite Reality releases; GamesBeat corroborated named work
        - Medium
        - The acquisition brought an established enterprise project base.
        - Post-acquisition retention, overlap, and recurring revenue are undisclosed.
      - - Obsess deployment footprint
        - More than 400 3D stores and experiences
        - Reported 2025-01-27
        - CXM Today
        - Medium
        - The acquisition added a substantial commerce deployment history.
        - The source does not state how many deployments or contracts were active at acquisition.
    notes: >-
      Values retain their original units and dates; interactions, experiences, clients, and stores
      are not comparable stages of one funnel and should not be summed.
    claimRefs: [CU003, CU004, CU006, CU010, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment or use case
      - Production vs pilot
      - Reported outcome or proof
      - Limitation
    rows:
      - - Crate & Barrel
        - Retail and ecommerce
        - Immersive commerce experience associated with Obsess and Infinite Reality.
        - Obsess is reported to have launched stores, but the customer's current status is unknown.
        - Named by both company materials and independent Obsess acquisition coverage.
        - Contract value, duration, and renewal are not disclosed.
      - - L'Oréal
        - Beauty and consumer products
        - Immersive brand or commerce experience.
        - Completed work is indicated, but production scope is not quantified.
        - Appears in both the company portfolio list and CXM Today's Obsess coverage.
        - Current activity and business impact are not customer-verified.
      - - Mastercard
        - Financial services
        - Landvault-built virtual experience.
        - Company materials describe completed work.
        - Named across company releases and GamesBeat's acquisition coverage.
        - It is not disclosed whether the relationship continued after acquisition.
      - - Hershey
        - Consumer packaged goods
        - Landvault immersive work, including a Decentraland activation.
        - Company materials describe completed work.
        - Repeatedly named in Landvault acquisition coverage.
        - No current contract status or measured commercial outcome is public.
      - - Heineken with Dentsu
        - Beverage and agency-led marketing
        - Award-winning immersive campaign delivered by Landvault with Dentsu.
        - Completed campaign work is indicated.
        - Company releases identify the Cannes Lion-winning campaign.
        - A completed campaign does not establish recurring platform revenue.
      - - UAE Ministry of Finance
        - Government
        - Digital-twin work for interactive training and safety demonstrations.
        - The company describes a deployed collaboration.
        - Provides a named public-sector reference in the MENA expansion.
        - Procurement value, duration, and independent outcome evidence are absent.
    notes: >-
      This sample includes only named references in the assigned sources; it is not a customer
      register and does not establish that every relationship was active on the run date.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative named deployments found in the eight retained sources, selected to span
        retail, consumer goods, financial services, agency-led campaigns, and government.
    claimRefs: [CU004, CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Evidence supports a project-led path from enterprise demand to engagement, while renewal and
      account expansion remain undisclosed.
    data:
      nodes:
        - label: Buyer need
          detail: Brand, media, or government teams define an immersive commerce, engagement, or
            training objective.
          touchpoints:
            - Enterprise brief
            - Public-sector use case
        - label: Build path
          detail: Delivery occurs through enterprise services, acquired Obsess or Landvault teams,
            or the intended self-serve iR Studio path.
          touchpoints:
            - Obsess stores
            - Landvault projects
            - iR Studio positioning
        - label: Experience launch
          detail: Public proof includes launched stores and built virtual experiences rather than
            only a logo list.
          touchpoints:
            - More than 400 Obsess stores and experiences
            - More than 1.2 million virtual square feet from Landvault
        - label: End-user engagement
          detail: Consumers click products, play games, add items to carts, enroll in loyalty
            programs, chat with AI agents, view video, and share content.
          touchpoints:
            - More than 150 million interactions
            - Nearly 500 experiences
        - label: Reported outcome
          detail: Company examples cite conversion, order-value, add-to-cart, and merchandise
            improvements without naming the customers or publishing audit methods.
          touchpoints:
            - Luxury fashion conversion and AOV
            - Toy add-to-cart rate
            - Music merchandise conversion
        - label: Renewal and expansion
          detail: The public trail does not provide retention, contract expansion, or concentration
            data needed to verify a durable land-and-expand loop.
          touchpoints:
            - NRR and GRR unavailable
            - Top-customer share unavailable
    approximationNotes: >-
      This is an evidence-based sequence, not a conversion funnel; the sources disclose no common
      population, stage conversion rates, or uniform time basis.
    claimRefs: [CU001, CU005, CU007, CU008, CU009, CU015]
callouts:
  - calloutType: risk
    title: Engagement volume does not establish recurring customer quality
    body: >-
      More than 150 million interactions and nearly 500 experiences demonstrate delivery and usage,
      but the disclosed population blends acquired platforms and omits the retention, account, and
      concentration denominators required to underwrite durable software economics.
    claimRefs: [CU003, CU004, CU006, CU014, CU015]
