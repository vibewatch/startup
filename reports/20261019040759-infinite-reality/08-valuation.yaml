  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Current cap table, liquidation preferences, participation terms, and any side letters for the 2025 financing paper.
      whyItMatters: Without knowing where preferred or structured claims sit, a headline valuation does not translate cleanly into common-equity upside.
      diligencePath: Request the latest cap table, executed term sheets, investor-rights summaries, and any secondary sale documents for the 2025 round.
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited 2025 revenue, gross margin, operating cash burn, and a bridge showing how acquired businesses contribute to reported results.
      whyItMatters: Scenario valuation work currently leans on vendor estimates and acquisition headlines rather than audited operating proof.
      diligencePath: Request audited financial statements or a lender-quality board package with segment revenue, gross margin, cash flow, and acquisition integration KPIs.
      relatedQuestionRefs: [QV002, QV005]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: Banker mandate, tender/secondary volume data, or an actual registration filing that shows the path to liquidity.
      whyItMatters: Exit timing and liquidity are central to underwriting a late-stage private valuation, especially when public price discovery is weak.
      diligencePath: Request current capital-markets workstreams, any draft filing timeline, and broker records showing repeatable secondary-market demand.
      relatedQuestionRefs: [QV004, QV008]
