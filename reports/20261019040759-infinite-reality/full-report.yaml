companyProfile:
  summary: >-
    Infinite Reality is a private immersive-technology and digital-media platform that began in 2019 in Connecticut and
    expanded through a rapid series of stock-funded acquisitions, including Ethereal Engine, Stakes, the Drone Racing
    League, LandVault, Napster, and Touchcast. The company sells enterprise 3D experiences, virtual commerce and brand
    spaces, media/IP assets, and newer AI persona products under the Napster banner, but most public scale claims remain
    unaudited and heavily acquisition-derived.
