              - CE007
              - CE009
              - CE011
              - CE013
      - number: '5.3'
        title: Maturity, expansion, and differentiation
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's differentiation case relies less on one breakthrough technical proof point than on
              acquired capability density. Landvault contributes enterprise digital-twin production, local hosting, and
              monetization tooling; Obsess contributes a virtual-store platform with hundreds of prior launches; and the
              company says its Google Cloud and media partnerships support scaling and immersive live experiences. The
              evidence therefore supports product-market breadth across ecommerce, enterprise activation, and immersive
              media, but it does not yet show which module is the dominant adoption engine or whether the acquired
              components have been fully rationalized into a coherent, productized stack.
            claimRefs:
              - CE004
              - CE005
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Product and technical risks
        blocks:
          - type: paragraph
            body: >-
              The largest technology diligence risk is not whether Infinite Reality has assembled meaningful assets; it
              is whether the assembled stack is governed and operated like a mature platform. Across the assigned
              evidence, the company makes repeated claims about data ownership, control, and scale, but there is no
              public confirmation of security certifications, privacy controls, uptime disclosure, incident reporting,
              or developer/community traction for the core platform. Investors should therefore treat architecture
              breadth as proven, but production readiness, operating quality, and sustainable technical adoption as
              still under-documented and requiring direct diligence.
            claimRefs:
              - CE011
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Acquisition breadth is real
            body: >-
              The evidence supports a genuine multi-asset immersive stack, especially after Landvault and Obsess, rather
              than a purely promotional shell around one thin product.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
          - type: callout
            title: Control narrative exceeds verified controls
            body: >-
              Public materials repeatedly emphasize data ownership, custom hosting, and scale, but the assigned pool
              does not verify enterprise security, privacy, uptime, or developer-signal proof.
            calloutType: risk
            claimRefs:
              - CE011
              - CE013
