  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise brands dominate the evidenced customer mix
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a serviceable customer base across retail and consumer brands,
              entertainment and media properties, government entities, and smaller creators or businesses targeted by iR
              Studio. Enterprise marketing, ecommerce, innovation, and public agency teams appear to be the economic
              buyers, while shoppers, fans, trainees, and citizens are the end users. CaseStudies.com lists 11
              success-story titles, and company materials name brands such as Crate & Barrel, L'Oréal, Vodafone, Warner
              Bros. Discovery, and Swarovski. These references demonstrate breadth, but the sources do not provide a
              dated roster of paying accounts or revenue by segment, so logos should not be treated as proof of current
              recurring relationships.
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU013
      - number: '6.2'
        title: Reported usage is substantial but not a customer-count metric
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality reported more than 150 million consumer interactions across nearly 500 immersive
              experiences as of April 2025. The company defined interactions broadly to include product-image clicks,
              games, cart activity, loyalty sign-ups, AI-agent chats, video views, sharing, and navigation, so the
              number measures events rather than unique consumers, contracted customers, revenue, or retention. It also
              explicitly included activity from acquired Obsess and Landvault platforms while excluding iR Studio,
              Napster, and work on third-party platforms such as Roblox. The three disclosed outcome examples are
              encouraging, but the customers are anonymous and the source does not provide sample sizes, measurement
              windows, or independently audited baselines.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU008
              - CU009
              - CU015
      - number: '6.3'
        title: Acquired portfolios provide the clearest production evidence
        blocks:
          - type: paragraph
            body: >-
              Landvault and Obsess supply the strongest evidence that completed deployments exist. Company releases said
              Landvault had served more than 200 clients and built over 1.2 million square feet of virtual experiences,
              with named work for Mastercard, Standard Chartered, Hershey, and a Heineken campaign with Dentsu.
              Independent coverage from CXM Today reported that Obsess had launched more than 400 digital stores and
              experiences for brands including Ralph Lauren, L'Oréal, Crate & Barrel, e.l.f. Cosmetics, J.Crew, and
              Disney Music Group. The words "built" and "launched" are stronger than logo-only evidence, but none of
              these sources establishes which relationships remained active after acquisition or migrated onto a common
              Infinite Reality platform.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Retention, concentration, and organic expansion remain unverified
        blocks:
          - type: paragraph
            body: >-
              No retained source reports NRR, GRR, churn, contract length, renewal rates, top-customer revenue share, or
              customer revenue concentration. The adoption narrative therefore depends on a blend of management
              disclosures and inherited customer books rather than a transparent cohort of organic iR Studio accounts.
              That distinction matters because nearly 500 experiences and more than 150 million interactions can coexist
              with low recurring revenue, one-off project work, or customer attrition. Silicon Valley Investclub also
              flags the company's claimed January 2025 valuation as disputed and cites reporting about unpaid bills and
              lawsuits; while that does not disprove customer activity, it raises the required standard for
              independently validating commercial claims before underwriting durability.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Engagement volume does not establish recurring customer quality
            body: >-
              More than 150 million interactions and nearly 500 experiences demonstrate delivery and usage, but the
              disclosed population blends acquired platforms and omits the retention, account, and concentration
              denominators required to underwrite durable software economics.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and capital-markets risk remains the highest-severity issue
        blocks:
          - type: paragraph
            body: >-
              The largest downside is not product obsolescence but financing credibility. In this pool, the cleanest
              valuation anchor is still the July 2024 $350 million minority investment that valued Infinite Reality at
              $5.1 billion, while Sacra says the later January 2025 announcement of a $3 billion investment was
              ultimately exposed as a hoax and that shares issued into the transaction were rescinded after the
              purported investor was indicted. That sequence leaves investors underwriting a much lower verified
              baseline than the company later publicized, while also reopening diligence on the cap table,
              representations made around the failed round, and whether the still-pending SPAC path is genuinely
              financeable. The residual risk is high because the current public record in this assigned pool still does
              not close out contingent liability, governance, or liquidity questions created by the failed financing
              episode.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR012
              - CR014
              - CR016
      - number: '7.2'
        title: Serial acquisitions expanded capability, but also expanded execution surface
        blocks:
          - type: paragraph
            body: >-
              The second major risk is integration discipline. By July 2024, independent reporting and the company's own
              release already pointed to roughly $800 million of year-to-date transaction value across Drone Racing
              League, Ethereal Engine, Action Face, Stakes, and Landvault. The pace continued in 2025 through Obsess,
              Napster, Touchcast, and Zappar. That strategy can broaden product scope and distribution, but it also asks
              one management team to unify different code bases, customer sets, operating models, and go-to-market
              promises into a coherent platform before public evidence shows that the combined entity has durable
              profitability or a stable post-2025 capital base. The result is a classic roll-up tradeoff: more
              capability and optionality, but also more integration, prioritization, and reporting risk if synergy
              claims materialize slower than the acquisition cadence.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR009
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Counterparty and platform dependencies still need direct diligence
        blocks:
          - type: paragraph
            body: >-
              Even if the platform thesis is directionally right, the current pool still implies meaningful dependency
              risk. Capital-markets dependence has not disappeared just because the company rescinded the invalid 2025
              shares; investors still need a fully verified replacement financing story, a reconciled cap table, and
              updated liquidity visibility. The product stack is also becoming more partner-dependent: SiliconANGLE says
              Touchcast's core AI offering is built on OpenAI and delivered through Microsoft Azure, while the company's
              public-market route remains tied to a SPAC process that Sacra says has faced ongoing delays. These are
              tractable risks only if management can show current cash, governance controls, integration KPIs by
              acquired asset, and clear conversion from acquired capabilities into repeatable software or services
              revenue rather than acquisition-led narrative inflation.
            claimRefs:
              - CR004
              - CR008
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR008
              - CR012
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before new capital is underwritten
            body: >-
              The investment case should break if management cannot produce documentary closure on the failed 2025
              financing episode, a reconciled cap table, and current liquidity proof. A second break point is the
              inability to show asset-level integration KPIs for the 2024-2025 roll-up; without that, each new
              acquisition increases surface area faster than it increases verified earning power.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and decision logic
        blocks:
          - type: paragraph
            body: |-
              The valuation chapter ends with a price-sensitive avoid call rather than a judgment
              that the business has no strategic value. Public evidence does support that Infinite
              Reality assembled a broad portfolio, raised large headline financings, and kept
              advertising a route to public markets. What it does not support is that outside
              investors today can confidently pay anywhere near the latest quoted marks without
              first seeing audited operating proof, cleaner financing reconciliation, and cap-table
              terms that explain where common equity sits beneath any structured or preferred paper.

              The headline progression from $5.1 billion in July 2024 to $12.25 billion in January
              2025 and then a low-confidence $16 billion vendor mark looks impressive, but each
              successive step is harder to verify with independent market-clearing evidence. Forge
              still shows limited market activity and no available matched price, while QuantLogix
              explicitly labels its current valuation confidence as low. That combination means the
              public record is good enough to frame scenarios, but not good enough to justify an
              aggressive entry price.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: What the public valuation record does and does not prove
        blocks:
          - type: paragraph
            body: |-
              The strongest confirmed historical mark in this source set is the July 2024 company
              announcement of a $350 million minority equity investment at a $5.1 billion valuation,
              accompanied by a $450 million all-stock Landvault acquisition. From there, trade press
              and vendor pages describe a January 2025 jump to $12.25 billion after a purported
              $3 billion raise, and later vendor coverage extends the narrative to a $16 billion
              2025-Q2 mark tied to an October 2025 secondary round. Those sources together show that
              the market story being sold is scale through financing plus acquisitions, not a slow
              climb backed by audited disclosures.

              The problem is that the same public sources disagree on basic financing totals and
              still leave real trading support opaque. Silicon Valley Invest Club lists $3.4 billion
              raised to date, while QuantLogix says total raised is $1.4 billion; Forge still cannot
              show a matched secondary price or even a last funding-round detail. That does not prove
              the higher marks are false, but it does mean the public record cannot yet distinguish
              between a robust institutional price and a valuation narrative built on sparse, possibly
              structured, paper.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario ranges and entry discipline
        blocks:
          - type: paragraph
            body: |-
              The bull case is straightforward: if the 2025 financing marks reflect real third-party
              demand, if the acquired asset stack converts into defensible cross-sell revenue, and if
              public-market preparation becomes concrete, then Infinite Reality could plausibly defend
              a low-teens valuation range and treat today's skepticism as a disclosure lag. The base
              case is less generous. Public evidence today supports that large marks were discussed,
              but it also shows low-confidence vendor pricing, limited secondary-market activity, and
              unresolved tension between the financing totals different sources report.

              The bear case matters most for underwriting. Silicon Valley Invest Club's public revenue
              estimate and QuantLogix's later valuation estimate imply very high revenue multiples even
              before accounting for dilution, liquidation preferences, or integration drag. If those
              operating assumptions weaken or if the later financings prove more structured than the
              headlines suggest, downside can be severe for common-equity buyers even without a formal
              business collapse. Entry discipline therefore has to anchor below the loudest marks until
              diligence closes the financing and operating gaps.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: |-
              Exit readiness remains weak in the public file. QuantLogix says no S-1 is on file as of
              the run date and still frames an IPO only as rumored, while Forge shows limited market
              activity rather than an active pre-IPO price tape. That combination means investors are
              being asked to underwrite valuation progression before the exit path, liquidity profile,
              and price discovery process are visible enough to haircut with confidence.

              The diligence path is therefore specific. Before paying anywhere close to the current
              headline marks, an investor should demand audited 2025 revenue and gross margin, current
              unrestricted cash and burn, the exact cap table and preference stack for the 2025 paper,
              and evidence that the acquisition program is generating real operating leverage instead
              of only narrative breadth. The thesis breaks if those materials either do not exist in a
              clean form or show that the latest marks sit above what the underlying operating business
              can support on ordinary-growth software or media multiples.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Avoid until the mark becomes underwritable
            body: >-
              Public evidence can frame scenarios, but it still cannot show that a common-equity buyer is paying into a
              clean, liquid, and fully disclosed valuation stack.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
          - type: callout
            title: The price can only improve if the paperwork improves
            body: >-
              A cleaner call would require audited financials, reconciled financing history, and cap-table terms that
              show where downside sits beneath any preferred or structured paper.
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
