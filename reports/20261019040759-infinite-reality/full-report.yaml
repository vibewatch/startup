chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Public identity materials consistently describe Infinite Reality as a private immersive technology company
              serving brands, creators, and enterprises through a mix of spatial computing, digital media, ecommerce,
              and AI-enabled products. Registry-style profiles agree that the company was founded in 2019 and place its
              corporate office in Norwalk, Connecticut, while company-controlled profile surfaces describe a broader
              operating footprint that includes New York and Boca Raton. That mismatch does not by itself prove a
              governance problem, but it does mean later diligence should confirm the legal headquarters, executive
              operating center, and which portfolio assets are consolidated into the current company perimeter.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO011
              - CO012
              - CO015
              - CO016
      - number: '1.2'
        title: Leadership, founders, and control points
        blocks:
          - type: paragraph
            body: >-
              The public record centers heavily on co-founder and CEO John Acunto, who appears as the principal
              spokesperson across financing and acquisition announcements, with co-founder and chief business officer
              Amish Shah repeatedly framing the M&A strategy. Elliott Jobe appears in funding registries as a founder,
              but the assigned evidence provides much less detail on his current operating role than it does on Acunto
              and Shah. The January 2025 Obsess deal also brought founder Neha Singh into the company as Chief
              Innovation Officer, adding commerce-product depth but also reinforcing that Infinite Reality's leadership
              bench is being extended through acquisitions rather than disclosed through a stable board or governance
              narrative.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO007
              - CO008
              - CO009
              - CO013
      - number: '1.3'
        title: Funding velocity versus operating transparency
        blocks:
          - type: paragraph
            body: >-
              The best-supported financing event remains the July 2024 announcement of a $350 million minority equity
              investment that management said valued Infinite Reality at $5.1 billion and sat outside its SPAC plans.
              Registry-style profiles later recorded a January 2025 $3.0 billion round and a $12.25 billion valuation,
              while an adverse independent outlet stressed that such a single-investor structure is unusual and still
              opaque on the investor's identity. Scale signals remain materially weaker than financing signals: public
              materials do not provide audited financial statements, current customer counts, or a clean post-deal cap
              table, and even headcount indicators range from an exact 173 to a 101-250 band to roughly 140 employees in
              mid-2024 reporting.
            claimRefs:
              - CO008
              - CO010
              - CO011
              - CO012
              - CO016
      - number: '1.4'
        title: Acquisition-led milestones and what remains unverified
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality's operating narrative is dominated by acquisitions. The July 2024 Landvault transaction
              expanded enterprise and Middle East coverage; the January 2025 Obsess deal added 3D commerce tooling and
              leadership talent; SiliconANGLE then reported Napster and Touchcast acquisitions in March and April 2025,
              alongside another step-up in claimed valuation to $15.5 billion. What remains missing is the connective
              tissue investors usually need in a roll-up of this pace: evidence on integration economics, segment
              revenue contribution, customer retention across acquired platforms, board oversight, and whether the
              headline valuation steps reflect realized cash, stock consideration, or seller-friendly marks that have
              not yet been independently pressure-tested.
            claimRefs:
              - CO009
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO007
