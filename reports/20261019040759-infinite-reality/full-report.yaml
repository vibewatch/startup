              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI011
      - number: '4.2'
        title: Capital formation is equity-led and heavily acquisition-driven
        blocks:
          - type: paragraph
            body: >-
              Public financing disclosures are large relative to the limited operating disclosures. Infinite Reality's
              January 2025 announcement said it had raised $3 billion at a $12.25 billion valuation, while the July 2024
              round was described as a $350 million minority investment that was entirely equity, not debt, and separate
              from its SPAC plans. The same July announcement paired financing with a $450 million all-stock acquisition
              of Landvault and said year-to-date transaction value had reached $800 million. The assigned evidence
              therefore points to a strategy in which capital raised and equity value are being used to expand
              capabilities through acquisitions faster than the company is disclosing internally generated operating
              leverage. The tear sheet's dilution estimates reinforce that external financing remains central to the
              model.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI016
      - number: '4.3'
        title: Public traction data exists, but underwriting metrics remain thin
        blocks:
          - type: paragraph
            body: >-
              The public traction datapoints that do exist are directional rather than sufficient. Forbes reported that
              the company described itself as a $75 million revenue startup when announcing the January 2025 fundraise,
              and the Silicon Valley Invest Club tear sheet reported $75 million of 2024 revenue versus $50 million in
              2023. At the same time, CXM Today described Obsess as having launched more than 400 3D digital stores and
              experiences, which suggests the company is acquiring assets with real deployment histories. Those figures
              still fall well short of underwriteable unit economics because the assigned evidence does not disclose
              gross margin, profitability, customer concentration, sales efficiency, cash conversion, or current
              unrestricted cash.
            claimRefs:
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: 'Verdict: the revenue mechanism is plausible, but financing quality is the blocker'
        blocks:
          - type: paragraph
            body: >-
              The financial takeaway is not that Infinite Reality lacks commercial surfaces; it has multiple ones. The
              blocker is that almost every underwriting-critical metric still sits behind private evidence. Public
              sources support a company-claimed monetization stack and a willingness to fund growth through large equity
              rounds and stock-funded M&A, but they do not show whether those surfaces convert into durable gross profit
              or efficient payback. The adverse signal is also material: Forbes reported that Sterling Equities' general
              counsel denied Sterling Equities was part of the announced $3 billion investor group, which weakens
              confidence in the financing narrative's clarity even before cash, burn, and profitability are examined
              directly.
            claimRefs:
              - CI001
              - CI011
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The company looks broader than a single SaaS SKU
            body: >-
              Public evidence points to a bundle of software, custom-build, storefront, hosting, and monetization
              surfaces rather than a one-product revenue story.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: callout
            title: Funding scale is visible, but financing quality is still under-documented
            body: >-
              Large announced rounds and acquisition prices do not substitute for verified cash, margin, or
              investor-quality disclosure.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and module map
        blocks:
          - type: paragraph
            body: >-
              Public company-controlled and independent descriptions consistently frame Infinite Reality as an
              immersive-web and ecommerce platform aimed at brands, creators, and enterprises rather than as a narrow
              standalone app. The clearest product-level claim is that iR Studio converts existing 2D web properties
              into immersive 3D environments, while the broader company portfolio still includes media, production, and
              marketing assets. That matters for diligence because product breadth is real, but so is integration
              complexity: the current offer spans internally described platform modules, acquired immersive-commerce
              assets, and service businesses that likely affect implementation scope and repeatability across customers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE012
