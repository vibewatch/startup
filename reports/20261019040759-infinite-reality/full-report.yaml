      - number: '5.2'
        title: Operating architecture and workflow
        blocks:
          - type: paragraph
            body: >-
              The best-supported architecture view is a web-first immersive stack. Company disclosures say iR Studio
              sits on a proprietary iR Engine with AI assistance, while independent coverage of Landvault adds local
              hosting, measurement, monetization, and ecommerce modules, and Road to VR describes WebXR and multi-user
              browser support. In practice, the product workflow appears to start with converting or extending an
              existing website, then layering immersive environments, commerce logic, and audience data capture on top.
              That design is more deployable than a closed virtual world, but it also implies dependencies on cloud
              infrastructure, acquired modules, and partner integrations for enterprise-scale delivery.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE007
              - CE011
