    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Avoid at current headline marks
        - Do not underwrite the quoted decacorn narrative from public evidence alone.
      - - Confidence
        - Medium-low
        - >-
          Multiple sources confirm that big marks were discussed, but they conflict on financing totals and liquidity
          support.
      - - Risk rating
        - Critical
        - >-
          Common-equity downside is dominated by opaque cap-table terms, acquisition execution, and weak price
          discovery.
      - - Valuation stance
        - Expensive / under-supported
        - The public record supports scenario work but not conviction that current headline marks are investable.
    notes: >-
      Public valuation evidence mixes company releases, trade press, and vendor estimates; the table summarizes
      underwriting implications rather than a quoted market clearing price.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV011
      - CV012
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Current evidence
      - What would change the view
    rows:
      - - Thesis
        - >-
          Large financings and repeated acquisitions show that counterparties have at least engaged with Infinite
          Reality at scale.
        - >-
          Audited evidence that the acquired portfolio is translating into recurring revenue and gross-margin
          durability.
      - - Thesis
        - >-
          Public valuation references moved from $5.1B to $12.25B and later to a $16B vendor mark, so strategic scarcity
          may exist.
        - >-
          A priced institutional round or liquid secondary prints that validate the later marks rather than just
          restating them.
      - - Anti-thesis
        - >-
          Public sources disagree on total capital raised and still do not reveal the full cap table or preference
          stack.
        - >-
          Signed round documents, investor-rights summaries, and a current cap table that reconcile the financing
          history.
      - - Anti-thesis
        - >-
          IPO readiness and secondary liquidity remain weak, so investors cannot rely on a near-term exit to validate
          entry price.
        - >-
          A filed registration statement, named bankers, or a consistently quoted secondary market with observable
          clears.
    notes: >-
      This table separates strategic upside from underwriting proof; absent audited financials and capital-structure
      documents, the anti-thesis still outweighs the thesis.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
    rows:
      - - Bull
        - >-
          The 2025 financing marks reflect genuine third-party demand and acquisitions convert into durable platform
          revenue.
        - ~$12.25B-$16B is only defendable if audited results and liquid market evidence catch up to the headline marks.
        - Real priced paper from new outside investors plus audited growth and margin disclosure.
      - - Base
        - The July 2024 $5.1B mark is real but later marks remain weakly proven and disclosures stay incomplete.
        - >-
          Entry discipline should anchor below the loudest decacorn claims until diligence confirms how much of the
          step-up belongs to common equity.
        - Continued vendor references without a filed S-1, matched secondary price, or reconciled financing history.
      - - Bear
        - >-
          Later marks prove structured or illiquid, integration benefits disappoint, and the exit window remains mostly
          narrative.
        - >-
          Common equity faces down-round or structured-paper risk below the last fully described historical mark, with
          severe upside impairment for late buyers.
        - Missing auditeds, preference overhang, weak liquidity, and continued dependence on acquisition announcements.
    notes: >-
      Ranges are underwriting scenarios anchored to published marks and disclosure quality, not a claim that public
      evidence establishes a precise intrinsic value.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
      - CV012
