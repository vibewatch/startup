  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Evidence supports a project-led path from enterprise demand to engagement, while renewal and account expansion
      remain undisclosed.
    data:
      nodes:
        - label: Buyer need
          detail: Brand, media, or government teams define an immersive commerce, engagement, or training objective.
          touchpoints:
            - Enterprise brief
            - Public-sector use case
        - label: Build path
          detail: >-
            Delivery occurs through enterprise services, acquired Obsess or Landvault teams, or the intended self-serve
            iR Studio path.
          touchpoints:
            - Obsess stores
            - Landvault projects
            - iR Studio positioning
        - label: Experience launch
          detail: Public proof includes launched stores and built virtual experiences rather than only a logo list.
          touchpoints:
            - More than 400 Obsess stores and experiences
            - More than 1.2 million virtual square feet from Landvault
        - label: End-user engagement
          detail: >-
            Consumers click products, play games, add items to carts, enroll in loyalty programs, chat with AI agents,
            view video, and share content.
          touchpoints:
            - More than 150 million interactions
            - Nearly 500 experiences
        - label: Reported outcome
          detail: >-
            Company examples cite conversion, order-value, add-to-cart, and merchandise improvements without naming the
            customers or publishing audit methods.
          touchpoints:
            - Luxury fashion conversion and AOV
            - Toy add-to-cart rate
            - Music merchandise conversion
        - label: Renewal and expansion
          detail: >-
            The public trail does not provide retention, contract expansion, or concentration data needed to verify a
            durable land-and-expand loop.
          touchpoints:
            - NRR and GRR unavailable
            - Top-customer share unavailable
