      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
        - Evidence quality
        - Kill-criteria proximity
      rows:
        - label: Invalidated 2025 financing
          values:
            - Very high
            - Critical
            - Partial
            - Critical
            - Mixed
            - Immediate if documentary closure is missing
        - label: SPAC route slippage
          values:
            - High
            - High
            - Low
            - High
            - Thin
            - Near-term if no fallback financing exists
        - label: Serial M&A integration
          values:
            - Very high
            - Critical
            - Partial
            - Critical
            - Mixed
            - High if asset-level KPIs remain absent
        - label: Revenue-quality opacity
          values:
            - High
            - High
            - Low
            - High
            - Thin
            - High if cash and profitability proof stay unavailable
        - label: AI / platform dependency
          values:
            - Medium
            - Medium
            - Partial
            - Medium
            - Moderate
            - Medium if portability and cost terms are weak
    approximationNotes: Impact and likelihood buckets are analyst syntheses anchored in the cited claims, not source-native probabilities.
