company:
  name: Infinite Reality
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Infinite Reality presents a broad immersive-commerce stack rather than a single software SKU:
    the core pitch is iR Studio plus iR Engine, expanded by acquired assets such as Landvault and
    Obsess. The strongest public evidence supports web-based immersive storefronts, digital-twin and
    monetization tooling, and service-heavy delivery, but public proof for security controls,
    reliability, and developer traction remains thin.
sections:
  - id: product-scope
    title: Product scope and module map
    body: >-
      Public company-controlled and independent descriptions consistently frame Infinite Reality as an
      immersive-web and ecommerce platform aimed at brands, creators, and enterprises rather than as
      a narrow standalone app. The clearest product-level claim is that iR Studio converts existing
      2D web properties into immersive 3D environments, while the broader company portfolio still
      includes media, production, and marketing assets. That matters for diligence because product
      breadth is real, but so is integration complexity: the current offer spans internally described
      platform modules, acquired immersive-commerce assets, and service businesses that likely affect
      implementation scope and repeatability across customers.
    claimRefs: [CE001, CE002, CE003, CE009, CE012]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: operating-architecture
    title: Operating architecture and workflow
    body: >-
      The best-supported architecture view is a web-first immersive stack. Company disclosures say
      iR Studio sits on a proprietary iR Engine with AI assistance, while independent coverage of
      Landvault adds local hosting, measurement, monetization, and ecommerce modules, and Road to VR
      describes WebXR and multi-user browser support. In practice, the product workflow appears to
      start with converting or extending an existing website, then layering immersive environments,
      commerce logic, and audience data capture on top. That design is more deployable than a closed
      virtual world, but it also implies dependencies on cloud infrastructure, acquired modules, and
      partner integrations for enterprise-scale delivery.
    claimRefs: [CE001, CE002, CE004, CE006, CE007, CE011]
    tableRefs: [TE002, TE003]
  - id: maturity-and-differentiation
    title: Maturity, expansion, and differentiation
    body: >-
      Infinite Reality's differentiation case relies less on one breakthrough technical proof point
      than on acquired capability density. Landvault contributes enterprise digital-twin production,
      local hosting, and monetization tooling; Obsess contributes a virtual-store platform with
      hundreds of prior launches; and the company says its Google Cloud and media partnerships
      support scaling and immersive live experiences. The evidence therefore supports product-market
      breadth across ecommerce, enterprise activation, and immersive media, but it does not yet show
      which module is the dominant adoption engine or whether the acquired components have been fully
      rationalized into a coherent, productized stack.
    claimRefs: [CE004, CE005, CE008, CE009, CE010, CE011, CE012]
  - id: risks-and-diligence-gaps
    title: Product and technical risks
    body: >-
      The largest technology diligence risk is not whether Infinite Reality has assembled meaningful
      assets; it is whether the assembled stack is governed and operated like a mature platform.
      Across the assigned evidence, the company makes repeated claims about data ownership, control,
      and scale, but there is no public confirmation of security certifications, privacy controls,
      uptime disclosure, incident reporting, or developer/community traction for the core platform.
      Investors should therefore treat architecture breadth as proven, but production readiness,
      operating quality, and sustainable technical adoption as still under-documented and requiring
      direct diligence.
    claimRefs: [CE011, CE013, CE014]
