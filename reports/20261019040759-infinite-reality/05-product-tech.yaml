  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: trust-controls
      missingEvidence: Security architecture, privacy/compliance documentation, uptime history, incident disclosure process, and any SOC 2 or ISO-style attestations for the customer-facing platform.
      whyItMatters: Product breadth is investable only if the platform can be trusted to run customer data and commerce workloads at enterprise quality.
      diligencePath: Request the latest security packet, privacy addenda, uptime SLAs, incident-response policy, and any third-party audit reports from management.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer-signal or practitioner proxy evidence for release cadence, docs quality, integration community activity, or repository/package usage.
      whyItMatters: Without developer or practitioner signal, it is difficult to distinguish a marketable platform story from an actively adopted technical ecosystem.
      diligencePath: Ask for GitHub or package telemetry, API/docs analytics, integrator references, and public technical talks or community artifacts.
    - type: private-evidence-only
      severity: material
      topic: module-adoption
      missingEvidence: Product-level customer counts, usage concentration, retention, and cross-sell metrics by iR Studio, Landvault, and Obsess modules.
      whyItMatters: The chapter can show asset breadth, but not which modules actually drive durable adoption or support the claimed integrated platform.
      diligencePath: Request module-level bookings, active-customer counts, churn/renewal, and post-acquisition migration metrics.
