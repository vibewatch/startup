      - Role
      - Dependency
      - Risk
    rows:
      - ["Experience creation layer", "iR Studio and acquired storefront/world-building tools create immersive environments", "Depends on coherent productization of legacy and acquired authoring tools", "Potential overlap between iR Studio, Obsess, and other acquired creation surfaces"]
      - ["Runtime / engine layer", "iR Engine and browser-delivered immersive rendering underpin the customer experience", "Depends on web standards support and ongoing engine maintenance", "Public technical documentation depth is not verified in the assigned evidence"]
      - ["Hosting / data control layer", "Local hosting, custom hosting, and first-party data capture are part of the value proposition", "Depends on infrastructure operations and customer environment integration", "Public evidence does not verify security certifications, uptime commitments, or privacy controls"]
      - ["Monetization / commerce layer", "Landvault monetization SDK and Obsess commerce workflows support transactional use cases", "Depends on integration among commerce modules and customer systems", "No public post-acquisition evidence shows how these modules are packaged or governed together"]
    notes: >-
      This table synthesizes company-issued architecture claims with independent descriptions of
      acquired capabilities; it is a diligence map, not a reverse-engineered system diagram.
    claimRefs: [CE002, CE004, CE006, CE007, CE009, CE011, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product story stacks web-first immersive creation on top of engine, hosting, data,
      and monetization modules assembled through acquisitions.
    data:
      layers:
        - label: Experience and storefront layer
          detail: Customer-facing immersive websites, branded spaces, and live-event surfaces
          modules:
            - iR Studio public beta
            - Obsess 3D digital stores
            - FIM SGP-VERSE / immersive media experiences
        - label: Creation and engine layer
          detail: Authoring and rendering stack for immersive web delivery
          modules:
            - Proprietary iR Engine
            - AI assistance for 3D site creation
            - WebXR and multi-user browser support
        - label: Hosting and data-control layer
          detail: Deployment architecture emphasizing customer control of hosting and data
          modules:
            - Local hosting options
            - Custom hosting options
            - First-party data ownership positioning
        - label: Cloud and partner integration layer
          detail: External infrastructure and partnership dependencies that support scale
          modules:
            - Google Cloud partnership
            - Enterprise website integration
            - Middle East delivery partnerships
        - label: Monetization and services layer
          detail: Revenue-enablement and service modules wrapped around software delivery
          modules:
            - Landvault monetization SDK
            - Ecommerce modules
            - Production / marketing / activation services
        - label: Portfolio activation layer
          detail: Non-software assets used to extend reach and audience engagement
          modules:
            - Drone Racing League media property
            - Thunder Studios production capability
            - Fearless Media / TalentX services
    approximationNotes: >-
      This is a synthesized architecture view built from public descriptions of named modules and
      acquired capabilities; Infinite Reality has not published a formal reference architecture in
      the assigned pool.
    claimRefs: [CE002, CE004, CE006, CE008, CE009, CE011, CE012]
callouts:
  - calloutType: insight
    title: Acquisition breadth is real
    body: >-
      The evidence supports a genuine multi-asset immersive stack, especially after Landvault and
      Obsess, rather than a purely promotional shell around one thin product.
    claimRefs: [CE003, CE004, CE005, CE009]
  - calloutType: risk
    title: Control narrative exceeds verified controls
    body: >-
      Public materials repeatedly emphasize data ownership, custom hosting, and scale, but the
      assigned pool does not verify enterprise security, privacy, uptime, or developer-signal proof.
    claimRefs: [CE011, CE013, CE014]
