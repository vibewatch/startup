evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, cap table, and governance-rights disclosure for the major financings and acquisitions.
    whyItMatters: >-
      Without board and control data, diligence cannot tell whether valuation marks came with concentrated voting
      rights, protective provisions, or related-party risk.
    diligencePath: Request the latest board list, financing term sheets, and post-close capitalization table from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A management-certified headcount, site footprint, and segment-level operating snapshot after the 2025
      acquisitions.
    whyItMatters: >-
      Headcount and location drift make it hard to judge true scale, integration complexity, and whether the company is
      growing organically or mainly through deal announcements.
    diligencePath: Ask for an as-of-date org/headcount report broken out by business line and geography.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited financial statements, ARR or recurring-revenue disclosure, customer counts, and acquisition-level revenue
      contribution.
    whyItMatters: >-
      The valuation narrative moved from $5.1B to $15.5B in public storytelling, but the retained evidence still does
      not show the operating fundamentals needed to underwrite those marks.
    diligencePath: Request audited financials, board materials, and segment KPI packs covering legacy and acquired businesses.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market study or public-company disclosure that isolates Infinite Reality's SAM or SOM by workflow,
      budget owner, and geography.
    whyItMatters: >-
      Without a workflow-specific SAM or SOM, valuation and TAM claims cannot be tied cleanly to an underwriting capture
      model.
    diligencePath: >-
      Obtain analyst or public-company market studies for immersive commerce, digital twins, and AI-assisted experience
      software, then map only the overlapping slices to Infinite Reality's current product scope.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-roi
    missingEvidence: >-
      Pricing, contract values, conversion uplift, retention, and segment-level win evidence for iR Studio, Landvault,
      Obsess, and Touchcast-enabled offers.
    whyItMatters: >-
      Market adoption is easier to believe when budgets, payback, and repeatability are quantified rather than described
      qualitatively.
    diligencePath: >-
      Request customer case studies with baseline-vs-lift metrics, sales collateral with packaging and pricing, and
      cohort or renewal data by segment.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Customer-ready pricing sheets, contract minimums, implementation fees, and discount practices for Infinite Reality
      and the most likely specialist alternatives.
    whyItMatters: >-
      Without comparable pricing mechanics, it is impossible to underwrite whether bundle breadth produces economic
      advantage or simply hides expensive services work.
    diligencePath: >-
      Request current quote templates, sample MSAs/SOWs, and recent customer proposals from management and triangulate
      with customer references.
  - type: missing-source
    severity: material
    topic: trust-proof-gap
    missingEvidence: Independent security, compliance, uptime, or regulatory records for Infinite Reality and the listed comparables.
    whyItMatters: >-
      Enterprise buyers in immersive commerce and digital engagement often evaluate data handling and reliability before
      expanding deployments.
    diligencePath: >-
      Collect current trust-center materials, compliance certificates, major-customer security questionnaires, and any
      regulator-facing disclosures.
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Independent win/loss evidence, customer-retention data, or side-by-side case studies showing when buyers choose
      Infinite Reality over specialists or incumbents.
    whyItMatters: >-
      Product breadth does not by itself prove that the combined platform wins deals or retains customers better than
      focused alternatives.
    diligencePath: Obtain customer reference calls, churn/cohort data, and CRM-coded competitive-loss data segmented by product line.
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current unrestricted cash, monthly burn, debt or covenant schedule, and a 12-18 month runway plan.
    whyItMatters: >-
      Announced equity rounds and stock-funded acquisitions do not reveal how much cash is actually available to fund
      operations or how quickly it is being consumed.
    diligencePath: >-
      Request the latest monthly cash bridge, board-approved budget, debt schedule, and sources-and-uses reconciliation
      for each disclosed financing round.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      A current price book, sample order forms or SOWs, rev-share terms, and realized discount data for iR Studio,
      services, Landvault modules, and Obsess storefronts.
    whyItMatters: >-
      Without price realization data, the chapter can underwrite revenue mechanism but cannot assess ARPA, gross profit
      per deployment, or commercial negotiating power.
    diligencePath: >-
      Request current SKU pricing, executed commercial templates, discount approvals, and a recent bookings-to-billings
      bridge.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by line, CAC and payback, retention or churn, services utilization, and customer concentration.
    whyItMatters: >-
      Revenue scale alone does not show whether the acquisition-led platform generates durable margins or efficient
      payback.
