  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 指定证据中的序数评分显示，Infinite Reality 是覆盖最广的组合；最清晰的 交付证明集中在被收购的专业公司，而非单一原生产品线。
    xAxis:
      label: 产品范围广度
      min: 1
      max: 5
      low: Single-purpose specialist
      high: Multi-capability bundle
      description: Ordinal analyst score anchored to cited product-scope evidence
      scale: ordinal
    yAxis:
      label: 公开交付证明
      min: 1
      max: 5
      low: Thin public proof
      high: Multiple named customers / deployments
      description: Ordinal analyst score anchored to named brands, clients, and deployment evidence in the assigned pool
      scale: ordinal
    data:
      points:
        - label: Infinite Reality 平台
          x: 5
          'y': 4
          tone: positive
          note: 广度来自 iR Studio 以及收购的商业、世界构建和 AI 层；最有力的证明来自 被收购业务的客户证据。
        - label: Obsess 专业公司
          x: 3
          'y': 5
          tone: neutral
          note: 400+ 家已上线 3D 商店和明确列名的全球品牌提供了较强公开证明，但产品范围窄于 组合平台。
        - label: Landvault 专业公司
          x: 4
          'y': 5
          tone: neutral
          note: 200+ 家客户、政府项目、托管和变现工具构成了较强交付证明。
        - label: Touchcast AI 层
          x: 2
          'y': 3
          tone: warning
          note: 证据显示其 AI 数字人专业性强，但范围更窄，跨品类交付证明也少于 商业或世界构建专业公司。
        - label: 现状 2D 网络
          x: 1
          'y': 4
          tone: medium
          note: 这是 Infinite Reality 和 Obsess 描述过时 2D 电商流程时隐含攻击的替代方案。
        - label: 内部 / 定制沉浸式构建
          x: 4
          'y': 2
          tone: risk
          note: 这是根据本地 / 定制托管和浏览器创建主张推断的：灵活，但公开部署证明仍按买方个案存在， 而非打包成标准方案。
    approximationNotes: 图表使用 1–5 序数评分，而非实测市场份额数据。评分是对指定资料池中可见解决方案类型的范围广度和公开交付证明作出的、有证据支撑的判断， 不是经验证的基准排名。
