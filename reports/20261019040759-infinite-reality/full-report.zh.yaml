      - number: '1.3'
        title: 融资速度与经营透明度
        blocks:
          - type: paragraph
            body: >-
              证据最充分的融资事件仍是 2024 年 7 月宣布的 $350 million 少数股权投资。管理层称该交易将 Infinite Reality 估值定为 $5.1 billion，且不纳入其 SPAC
              计划。登记资料类档案后来记录了 2025 年 1 月一轮 $3.0 billion 融资及 $12.25 billion
              估值；但一家持负面观点的独立媒体强调，这种单一投资者结构不寻常，投资者身份仍不透明。规模信号明显弱于融资信号：公开资料没有经审计财报、当前客户数或清晰的交易后股权结构表；即便员工数也从精确的 173 人，到
              101-250 人区间，再到 2024 年中报道的约 140 人不等。
            claimRefs:
              - CO008
              - CO010
              - CO011
              - CO012
              - CO016
      - number: '1.4'
        title: 收购驱动的里程碑与仍未验证之处
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 的经营叙事几乎被收购主导。2024 年 7 月收购 Landvault，扩大了企业客户和中东覆盖；2025 年 1 月收购 Obsess，增加了 3D
              商业工具和管理人才；SiliconANGLE 随后报道公司在 2025 年 3 月和 4 月收购 Napster 与 Touchcast，并将自报估值进一步推高至 $15.5
              billion。真正缺失的是投资者通常需要、而这种并购整合体必须交代的连接层：整合经济性、分部收入贡献、被收购平台的客户留存、董事会监督，以及这些核心估值
              估值上升究竟反映已实现现金、股票对价，还是尚未经过独立压力测试、对卖方更有利的估值标记。
