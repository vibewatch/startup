  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，Infinite Reality 试图争夺的是广义“沉浸式数字体验”预算，而不是狭窄的单点解决方案预算项。官方及资料类来源一致将 iR Studio 描述为基于浏览器的创作产品、将 iR
              Enterprise 描述为服务层；2024-2025 年的收购又增加了沉浸式商业（Obsess）、虚拟世界基础设施和数字孪生（Landvault），以及 AI
              虚拟人／智能体能力（Touchcast）。因此，实际竞争集合是混合的：直接沉浸式商业工具、虚拟体验搭建商、AI 互动层，以及把品牌商业留在传统 2D 网页或内部自建沉浸式工作流的现状替代方案。Caplight
              的可比公司列表还增加了 BrandLab360、Journee Technologies 和 Emperia 三家外部标记的同行，但现有资料不足以对它们进行超出商业模式类比的运营画像。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP013
