            body: >-
              现有公开经营数据只能提供方向，远远不够。Forbes 报道称，公司在宣布 2025 年 1 月融资时将自己描述为收入 $75 million 的初创企业；Silicon Valley Invest Club
              的投资摘要则报告 2024 年收入 $75 million、2023 年收入 $50 million。与此同时，CXM Today 称 Obsess 已上线超过 400 家 3D
              数字商店和体验，说明公司收购的资产确有部署历史。但这些数字仍不足以支撑可投资评估的单位经济性，因为现有证据没有披露毛利率、盈利能力、客户集中度、销售效率、现金转化或当前不受限制现金。
