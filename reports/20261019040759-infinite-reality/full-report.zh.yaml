        - 高
        - 高
        - 部分
        - 管理层注意力可能被并购牵着走，而不是聚焦客户或产品。
        - 需要组织架构变化、交割后的整合负责人，以及关键技术和商业团队的留存数据。
      - - 收入质量和盈利能力不透明
        - Silicon Valley Invest Club 的资料披露了收入数字，但称未找到经核实的盈利数据；保留的来源池也没有披露当前现金或跑道。
