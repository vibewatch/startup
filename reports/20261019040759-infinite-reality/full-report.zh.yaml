      - number: '3.3'
        title: 持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              核心战略问题是，Infinite Reality
              的广度能否积累成持久的分销能力，还是只是在一个公司外壳下拼装相邻专业产品。证据支持被收购资产确有企业级案例，也显示出典型的并购整合体形态：类别覆盖的很大一部分似乎来自收购，而不是已披露的自然增长产品牵引。GamesBeat
              的员工数快照和 Road to VR 的怀疑都指向同一方向：公司的故事之所以异常，是因为它以极快速度把沉浸式基础设施、商业、媒体和 AI
              部件拼在一起。如果整合顺利，这能减少买家的供应商管理摩擦；但只要买家更看重控制权而非打包平台，公司也会面临专业厂商、既有 2D 商业技术栈或内部自建方案的替代。按当前公开证据，Infinite Reality
              有广度，但护城河仍依赖整合，尚未得到独立证明。
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
