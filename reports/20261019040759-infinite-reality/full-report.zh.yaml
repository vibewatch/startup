  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - 2025 年融资估值反映真实的第三方需求，且并购能够转化为持久的平台 收入。
        - ~只有经审计业绩和流动性市场证据追上 核心估值，$12.25B-$16B 才站得住脚。
        - 新外部投资人的真实定价融资，加上经审计的增长和利润率披露。
      - - 基准
        - 2024 年 7 月的 $5.1B 估值真实存在，但后续估值仍缺乏有力证明，披露也不完整。
        - 在尽调确认这次跃升有多少属于普通股之前，入场纪律应锚定在最激进的十角兽估值说法之下。
        - 厂商继续引用这些估值，但没有已提交的 S-1、可匹配的二级市场价格或经勾稽的融资历史。
      - - 悲观
        - 后续估值被证明是结构化或缺乏流动性的，并购整合收益不及预期，退出窗口基本仍停留于叙事。
        - 普通股可能在最后一个完整披露的历史估值以下面临降价轮或结构化证券风险，晚期买方的 上行空间将严重受损。
        - 缺少经审计财务数据、优先权悬置、流动性偏弱，并继续依赖并购公告。
    notes: 这些区间是锚定已发布估值和披露质量的投资判断情景，不是声称公开证据已经确立 精确内在价值。
