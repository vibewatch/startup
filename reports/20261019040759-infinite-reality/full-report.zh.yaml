              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 公开估值记录证明了什么，又没有证明什么
        blocks:
          - type: paragraph
            body: >-
              这组来源中最强的历史确认估值，是公司在 2024 年 7 月宣布以 $350 million 少数股权投资对应 $5.1 billion 估值，同时以全股票方式收购 Landvault，交易金额为 $450
              million。此后，行业媒体和供应商页面描述了 2025 年 1 月在据称募资 $3 billion 后跳升至 $12.25 billion；更晚的供应商报道又将叙事延伸到与 2025 年 10
              月二级交易相关的 2025-Q2 $16 billion 估值。这些来源共同显示，市场销售的故事是靠融资加收购做大规模，而不是由经审计披露支撑的缓慢爬升。


              问题在于，同一批公开来源对融资总额这一基本事实都存在分歧，真实交易支撑仍然不透明。Silicon Valley Invest Club 列出累计融资 $3.4 billion，QuantLogix 则称累计融资
              $1.4 billion；Forge 甚至无法展示撮合的二级交易价格，或最近一轮融资的详情。这不能证明更高估值是假的，但意味着公开记录还无法区分稳健的机构价格，和建立在稀疏、可能结构化的纸面证券之上的估值叙事。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.3'
        title: 情景区间与入场纪律
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：如果 2025 年融资估值反映真实的第三方需求，被收购资产组合能转化为可防守的交叉销售收入，且上市准备变得具体，那么 Infinite Reality
              有可能守住十几亿美元的低位估值区间，并把今天的怀疑解释为披露滞后。基准情景没有那么乐观。当前公开证据支持市场讨论过大额估值，但也显示供应商定价置信度低、二级市场活动有限，不同来源报告的融资总额之间仍存在未解决的矛盾。


              对投资评估而言，悲观情景最重要。Silicon Valley Invest Club 的公开收入估计和 QuantLogix
              后来的估值估计，意味着极高的收入倍数，而且还没计入稀释、清算优先权或整合拖累。如果经营假设走弱，或后续融资被证明比核心估值
              所暗示的更结构化，即使业务没有正式崩溃，普通股买方也可能面临严重下行。因此，在尽调解决融资和经营缺口前，入场纪律必须锚定在最喧闹估值之下。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              公开文件显示退出准备度仍然很弱。QuantLogix 称截至本次运行日期没有 S-1 文件，IPO 仍只被描述为传闻；Forge 展示的是有限市场活动，而不是活跃的 IPO
              前价格记录。投资者需要在退出路径、流动性状况和价格发现机制尚未清晰到足以有把握打折之前，先评估估值进展。


              因此，尽调路径应当非常具体。在为接近当前核心估值的价格买入前，投资者应要求经审计的 2025 年收入和毛利率、当前不受限制现金及消耗、2025
              年证券的完整股权结构表与优先股堆叠，以及并购计划正在产生真实经营杠杆、而不只是叙事广度的证据。如果这些材料不存在清晰版本，或显示最新估值高于底层经营业务按普通增长软件或媒体倍数所能支撑的水平，投资论点就会失效。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 在估值具备投资评估条件前回避
            body: 公开证据可以搭建情景，但仍无法证明普通股买方是在一个干净、流动且充分披露的估值体系中买入。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
          - type: callout
            title: 只有文件质量改善，价格判断才会改善
            body: 更清晰的判断需要经审计财报、对账后的融资历史，以及能说明任何优先级或结构化证券之下下行风险归属的股权结构表条款。
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
