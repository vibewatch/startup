            body: >-
              公开身份资料一致将 Infinite Reality 描述为一家私有沉浸式技术公司，依靠空间计算、数字媒体、电商和 AI 产品服务品牌、创作者与企业。登记资料类档案均称公司成立于 2019
              年，并将公司办公室列在康涅狄格州诺沃克；公司控制的资料则显示其运营版图更广，还包括纽约和博卡拉顿。这一差异本身不能证明治理有问题，但意味着后续尽调必须确认法定总部、管理层实际办公中心，以及哪些资产已并入当前公司边界。
