        title: 展示项
        blocks:
          - type: callout
            title: 独立市场规模仍然缺失
            body: 现有资料包含公司发布的 TAM 说法、私募市场估值快照和一些经营验证点，但没有独立报告单独测算 Infinite Reality 的 SAM 或由定价支撑的 SOM。因此，市场判断很难有把握地对应到投资评估假设。
            calloutType: risk
            claimRefs:
