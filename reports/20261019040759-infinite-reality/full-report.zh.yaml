  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代逻辑
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的市场边界，比以头显为中心的 VR 更宽，却比笼统的“互联网未来”叙事更窄。Infinite Reality 一贯将自身定位为由 XR、AI 和沉浸式技术驱动的数字媒体与电商基础设施；Road to
              VR 和 GamesBeat 则描述了基于浏览器的 3D
              体验、白标网页部署和企业服务，而非封闭的消费者平台。实际来看，公司进入的是几个相邻预算池：品牌商业体验、企业和公共部门数字孪生、沉浸式粉丝／媒体产品，以及创作者或开发者工具。现状替代方案包括 2D
              电商网站、标准营销微型网站、一次性体验搭建机构，以及不包含沉浸式呈现、托管或变现层的通用网页或 AI 工具。
