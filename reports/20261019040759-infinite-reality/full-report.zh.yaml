  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 当前证据
      - 什么会改变判断
    rows:
      - - 正方
        - 大额融资和连续并购表明，交易对手至少曾以一定规模与 Infinite Reality 接触。
        - 经审计的证据证明，收购组合正在转化为经常性收入，并能维持 毛利率。
      - - 正方
        - 公开估值引用从 $5.1B 升至 $12.25B，后来又出现厂商给出的 $16B 估值，因此战略稀缺性 可能存在。
        - 一轮有明确价格的机构融资，或有流动性的二级市场成交，能够验证后来的估值，而不只是 重复这些数字。
      - - 反方
        - 公开来源对累计融资额说法不一，也仍未披露完整股权结构表或优先股堆叠。
        - 已签署的融资文件、投资人权利摘要，以及能够勾稽融资 历史的最新股权结构表。
      - - 反方
        - IPO 准备度和二级流动性仍然偏弱，投资人不能依靠近期退出验证 入场价格。
        - 已提交的注册声明、已披露姓名的承销商，或有可观察成交价且报价持续的 二级市场。
    notes: 本表把战略上行空间与投资判断所需的证明分开；在缺少经审计财务数据和资本结构 文件的情况下，反方仍压过正方。
