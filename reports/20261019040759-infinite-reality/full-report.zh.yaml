              估值章节的结论是基于价格敏感性的回避，而不是认定这项业务没有战略价值。公开证据确实支持 Infinite Reality 已经拼出广泛资产组合、完成大额并购
              融资，并持续宣传进入公开市场的路径。但在看到经审计经营证明、更清晰的融资对账，以及能解释普通股位于任何结构化或优先级证券之下何处的股权结构表条款之前，公开证据不足以支持外部投资者今天有把握地接近最新报价。


              从 2024 年 7 月的 $5.1 billion，到 2025 年 1 月的 $12.25 billion，再到低置信度的 $16 billion 供应商估值，核心估值
