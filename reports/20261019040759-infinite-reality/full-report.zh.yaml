              - CM013
          - type: callout
            title: 预算围绕工作流，而非元宇宙
            body: 保留的证据显示，预算更多对应商业转化、第一方数据所有权、数字孪生、媒体互动，以及 AI 辅助服务或销售。这比把可服务市场视为一个不加区分的“元宇宙”类别，更接近具体的市场进入框架。
