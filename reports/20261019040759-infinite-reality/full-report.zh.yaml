      - number: '1.2'
        title: 管理层、创始人与控制要点
        blocks:
          - type: paragraph
            body: >-
              公开记录高度围绕联合创始人兼 CEO John Acunto 展开；他在融资和收购公告中几乎都是主要发言人，联合创始人兼首席商务官 Amish Shah 则反复阐述并购策略。Elliott Jobe
              在融资登记中被列为创始人，但现有证据对其当前运营角色的描述远少于对 Acunto 和 Shah 的描述。2025 年 1 月 Obsess 交易还将创始人 Neha Singh
              带入公司，担任首席创新官；这补充了电商产品能力，却也进一步说明 Infinite Reality 的领导班子主要靠收购延展，而不是由稳定的董事会或治理叙事来呈现。
