  summary: >-
    Infinite Reality 是一家私有沉浸式技术和数字媒体平台，2019 年在康涅狄格州起步，随后通过一系列以股票支付的快速收购扩张，包括 Ethereal Engine、Stakes、Drone Racing
    League、LandVault、Napster 和 Touchcast。公司销售企业级 3D 体验、虚拟商业和品牌空间、媒体／IP 资产，以及以 Napster 品牌推出的新型 AI
    数字人产品；但其大多数公开规模说法未经审计，而且高度依赖收购得来。
