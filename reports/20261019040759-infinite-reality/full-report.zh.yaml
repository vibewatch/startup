      - number: '4.2'
        title: 资本形成由股权主导，并强烈依赖收购
        blocks:
          - type: paragraph
            body: >-
              公开融资披露相对于有限的经营披露显得很大。Infinite Reality 在 2025 年 1 月公告中称已以 $12.25 billion 估值募资 $3 billion；2024 年 7
              月一轮融资则被描述为完全股权、非债务的 $350 million 少数股权投资，且独立于 SPAC 计划。同一份 7 月公告还将融资与以全股票支付的 $450 million Landvault
              收购联系起来，并称年初至今交易价值已达 $800
              million。因此，现有证据指向一种策略：公司用募资和股权价值通过收购扩张能力，速度快于其披露内部生成经营杠杆的速度。投资摘要中的稀释估算也强化了外部融资在模式中的核心地位。
