      - number: '3.2'
        title: 能力、分销与产品打包对比
        blocks:
          - type: paragraph
            body: >-
              Infinite Reality 最强的公开差异化主张是产品组合的广度。Obsess 带来了已上线的 400 多家 3D 店面及跨平台商业部署；Landvault
              增加了虚拟世界搭建、本地／定制托管、第一方数据控制、变现模块，以及横跨品牌和政府机构的客户群；Touchcast 增加了 AI
              虚拟人和互动视频能力。组合起来，公司可以主张自己拥有比单一专业厂商更完整的技术栈。代价是，公开证据对能力的描述远多于对产品打包的描述。在现有来源池中，Infinite
              Reality、Obsess、Landvault、Touchcast 以及 Caplight
              列出的类比公司，都没有披露足够公开定价细节，无法形成持久、可比的价目表比较。同样的不透明也影响信任定位：资料支持产品和客户名称相关说法，却没有独立的合规、安全或监管证据，能证明信任本身已经成为买家优势。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP015
