      - number: '2.2'
        title: 公开市场规模证据真实但不完整
        blocks:
          - type: paragraph
            body: >-
              市场规模的数字论证仍受证据约束。现有资料中最强的自上而下数字来自公司自身：Infinite Reality 称沉浸式技术市场到 2030 年可能接近 $1
              trillion，但现有来源没有披露方法论、类别拆分，也没有说明其中多少属于软件、服务、商业赋能或媒体应用。独立市场证据更多支持公司融资代理指标，而非可服务需求：Caplight 显示最近估值为 $12.25
              billion、累计融资 $3.4 billion；Silicon Valley Invest Club 列出 Forbes 报道的 2024 年收入 $75 million 和 2023 年收入 $50
              million。这些数字说明投资者有兴趣，公司也有一定经营规模，但无法为任何单一购买流程推导出有来源支撑的 SAM 或 SOM。
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: 买家地图、采用触发点与仍在拖慢采用的因素
        blocks:
          - type: paragraph
            body: >-
              买家结构是多边的。品牌和零售团队似乎购买沉浸式店面及体验驱动的商品展示；企业和公共部门项目购买数字孪生、托管、衡量和变现基础设施；创作者、艺术家和媒体权利人购买自有受众空间与互动内容；开发者或机构则使用底层工具层。反复出现的采用逻辑并不只是新奇，而是控制权：管理层一再强调第一方数据所有权、客户所有权，以及转化率或变现能力的提升。主要约束是可验证成果不够密集。Road
              to VR 指出，尽管融资规模可观，Infinite Reality 在 XR 圈仍不算知名；公开记录也缺少定价、合同金额、留存和独立验证的 ROI
              数据，无法证明公司能把收购带来的业务广度转化为可重复获取的预算。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM012
              - CM015
