      edges:
        - from: Brands / creators
          to: iR tools + services
          label: iR Studio、定制构建、店面资产
        - from: iR tools + services
          to: Immersive experiences
          label: Skybox、品牌世界、店面部署
        - from: Immersive experiences
          to: Audience engagement + data
