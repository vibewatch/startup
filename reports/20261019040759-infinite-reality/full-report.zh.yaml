  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 证据支持一条由项目驱动、从企业需求走向互动的路径，但续约和账户扩张 仍未披露。
    data:
      nodes:
        - label: 买方需求
          detail: 品牌、媒体或政府团队提出沉浸式商业、互动或培训目标。
          touchpoints:
            - Enterprise brief
            - Public-sector use case
        - label: 构建路径
          detail: 交付通过企业服务、收购的 Obsess 或 Landvault 团队，或计划中的自助式 iR Studio 路径完成。
          touchpoints:
            - Obsess stores
            - Landvault projects
            - iR Studio positioning
        - label: 体验上线
          detail: 公开证明包括已上线商店和已构建的虚拟体验，而不只是 标志清单。
          touchpoints:
            - More than 400 Obsess stores and experiences
            - More than 1.2 million virtual square feet from Landvault
        - label: 终端用户互动
          detail: 消费者点击商品、玩游戏、把商品加入购物车、加入忠诚度计划、与 AI 代理聊天、 观看视频并分享内容。
          touchpoints:
            - More than 150 million interactions
            - Nearly 500 experiences
        - label: 据报道的结果
          detail: 公司案例提到转化率、订单金额、加购和商品表现改善，但没有点名客户，也没有公布 审计方法。
          touchpoints:
            - Luxury fashion conversion and AOV
            - Toy add-to-cart rate
            - Music merchandise conversion
        - label: 续约与扩张
          detail: 公开线索没有提供验证持久的落地扩张循环所需的留存、合同扩张或集中度数据。
          touchpoints:
            - NRR and GRR unavailable
            - Top-customer share unavailable
    approximationNotes: 这是基于证据排列的流程，不是转化漏斗；来源没有披露统一样本、阶段 转化率或统一时间口径。
