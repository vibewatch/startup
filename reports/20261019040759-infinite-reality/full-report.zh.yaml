  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式很宽，但定价质量不可见
        blocks:
          - type: paragraph
            body: >-
              现有来源显示，Infinite Reality 并非只卖一个狭窄 SKU。公开资料将 iR Studio 描述为低代码／无代码 SaaS 产品，将服务与咨询业务描述为定制开发，并将 Skybox
              等沉浸式环境描述为可变现的受众产品。Landvault 和 Obsess
              交易又增加了电商、托管和变现模块，把同一逻辑延伸到客户店面和品牌虚拟环境。缺失的是商业转化层：审阅材料解释了公司声称客户如何把受众变现，却没有披露标价、实际成交价、折扣或合同期限。因此，公开证据支持的是收入机制，而不是收入质量。
