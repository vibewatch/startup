  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开产品叙事以 Web 优先的沉浸式创作为顶层，下接通过并购拼出的引擎、托管、数据和变现 模块。
    data:
      layers:
        - label: 体验与店面层
          detail: 面向客户的沉浸式网站、品牌空间和现场活动界面
          modules:
            - iR Studio 公测版
            - Obsess 3D 数字商店
            - FIM SGP-VERSE / 沉浸式媒体体验
        - label: 创建与引擎层
          detail: 用于交付沉浸式网页的创作与渲染技术栈
          modules:
            - 专有 iR Engine
            - 用于创建 3D 网站的 AI 辅助
            - WebXR 与多用户浏览器支持
        - label: 托管与数据控制层
          detail: 强调客户掌控托管和数据的部署架构
          modules:
            - 本地托管选项
            - 定制托管选项
            - 第一方数据所有权定位
        - label: 云与合作伙伴集成层
          detail: 支撑规模化的外部基础设施与合作伙伴依赖
          modules:
            - Google Cloud 合作关系
            - 企业网站集成
            - 中东交付合作关系
        - label: 变现与服务层
          detail: 围绕软件交付提供收入支持的服务模块
          modules:
            - Landvault 变现 SDK
            - 电商模块
            - 制作 / 营销 / 激活服务
        - label: 组合激活层
          detail: 用于扩大触达和受众互动的非软件资产
          modules:
