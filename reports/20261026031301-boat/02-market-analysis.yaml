chapter:
  number: 2
  title: Market Analysis
  summary: >-
    IDC tracker evidence puts India's volume opportunity in personal audio and connected
    wearables, but shows a mature, uneven market: overall wearable shipments declined in
    both 2024 and 2025, with smartwatch volumes weaker than earwear. A low-confidence
    secondary FY23 rupee estimate is not comparable to shipment counts, and public sources
    do not support a defensible current TAM/SAM/SOM or boAt-specific capture estimate.
sections:
  - id: market-boundary
    title: Market boundary and spend perimeter
    body: >-
      The relevant India market is consumer personal audio (earwear) plus connected
      wearables, not all consumer electronics or every product boAt sells. Case-study
      sources describe boAt's range across earphones, headphones, speakers, accessories,
      and smartwatches; IDC's tracker reports separate shipment measures and defines
      wristwear as digitally processing band or watch devices, excluding traditional
      analog and digital watches. These categories should not be merged into one revenue
      pool: public tracker releases provide unit volumes and selected average selling
      prices, not company-specific sales value, channel margin, or obtainable share.
      Charging products and cables remain adjacent spend until a consistent denominator
      is available. The first table separates measured categories from those adjacencies.
    claimRefs:
      - CM001
      - CM002
      - CM015
    tableRefs:
      - TM001
  - id: shipment-sizing
    title: Shipment evidence and market shape
    body: >-
      Published IDC-derived measurements show a downturn, not a validated revenue curve.
      CNBC TV18 and Entrackr report IDC's estimate of 119.0 million India wearable
      shipments in 2024, down 11.3% year over year; Communications Today says the market
      fell 4.0% in 2025 to 114.2 million. IDC's direct mid-2025 update reports 51.6 million
      units in 1H25, down 6.3%, and 26.7 million in 2Q25, down 9.4%; these are different
      windows and must not be added to annual readings. Composition also diverges:
      IDC-attributed reporting shows earwear growing while smartwatch volumes fell in
      2024, and IDC's 2Q25 update shows smartwatch contraction steeper than earwear.
      Chandan Kumar's FY23 rupee estimate is a separate, weakly documented lens rather
      than a conversion of those shipment figures. No CAGR or currency TAM is inferred.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM014
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-and-purchase-path
    title: Buyer, payer, and route to market
    body: >-
      Available buyer evidence is qualitative rather than a customer panel: case-study
      sources position boAt products around affordability, style, and durability, but do
      not allocate spending by age, income, replacement cycle, or budget owner. The
      reasonable underwriting frame is a consumer buyer and user for personal devices;
      gift and household-payer splits remain unknown, not measured market size. IDC's
      2025 channel reporting gives one adoption signal: offline shipments grew while
      online shipments declined, but the public release does not establish channel
      margins, conversion, or boAt-specific sell-through. The buyer map therefore
      distinguishes product workflow from payer and marks unsupported details
      explicitly.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM013
      - CM015
    tableRefs:
      - TM003
  - id: adoption-drivers-and-constraints
    title: Adoption drivers and constraints
    body: >-
      Volume readings show an adoption constraint as well as an opportunity: full-year
      wearable shipments contracted in both 2024 and 2025, while 2Q25 smartwatch
      contraction outpaced earwear. IDC attributes smartwatch weakness to demand fatigue
      and saturation in entry-level products; its 2025 tracker also reports falling
      smartwatch shipments alongside modest earwear growth. Offline share expanded even
      as online shipments fell, so distribution is shifting rather than simply
      expanding. A separate growth teardown argues that ODM parity and easily replicated
      specifications make brand differentiation expensive to defend; this is an
      analyst's view, not an independent market-share benchmark. Valuation should not use
      a generic hardware TAM proxy: category and channel unit economics, actual ASP and
      gross margin, warranty cost, and customer replacement data are needed before
      shipment counts can support a revenue or durability case.
    claimRefs:
      - CM004
      - CM005
      - CM007
      - CM012
      - CM013
      - CM014
      - CM016
