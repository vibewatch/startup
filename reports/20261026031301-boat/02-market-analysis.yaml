  evidenceGaps:
    - type: missing-source
      severity: material
      topic: spend-based-market-sizing
      missingEvidence: >-
        A transparent India dataset with category-specific annual sales value, ASP by
        segment and channel, eligible customer spend, and a defensible serviceable-share
        filter for boAt.
      whyItMatters: >-
        Shipment counts and aggregate ASPs do not establish addressable revenue or a
        realizable SAM/SOM; applying a generic consumer-electronics estimate would
        overstate the opportunity.
      diligencePath: >-
        Obtain full IDC or Counterpoint tables and reconcile them to boAt SKU-level
        sell-through, net ASP, and channel data before constructing a spend-based model.
      relatedQuestionRefs:
        - QM002
        - QM009
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: buyer-and-payer-segmentation
      missingEvidence: >-
        Buyer-panel or transaction evidence by age, income, use case, payer, purchase
        channel, willingness to pay, and replacement or repeat-purchase cycle.
      whyItMatters: >-
        Qualitative brand narratives cannot show who controls the budget, how much
        customers will pay, or whether adoption is expanding beyond early or promotional
        buyers.
      diligencePath: >-
        Request anonymized customer cohorts and retailer sell-through, then validate
        segment and price sensitivity through a representative India consumer panel.
      relatedQuestionRefs:
        - QM005
      relatedTableRefs:
        - TM003
    - type: private-evidence-only
      severity: material
      topic: category-unit-economics
      missingEvidence: >-
        boAt category-level contribution margins, returns and warranty costs, channel
        economics, and repeat-purchase or retention cohorts.
      whyItMatters: >-
        Without these private operating measures, market growth and reported market share
        cannot establish customer lifetime value, profitable scale, or valuation
        durability.
      diligencePath: >-
        Review audited segment economics and cohort data by product family and online
        versus offline channel, including promotion and warranty adjustments.
      relatedQuestionRefs:
        - QM007
        - QM008
      relatedTableRefs:
        - TM003
