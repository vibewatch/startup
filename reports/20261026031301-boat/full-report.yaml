      - number: '6.2'
        title: Adoption scale is visible; unique customers are not
        blocks:
          - type: paragraph
            body: >-
              IPO Central reports more than 34 million units sold in FY25, a measure of product volume rather than
              unique buyers. The same source reports 71% of revenue from online channels, while Business Standard gives
              70.6% of total sales; the small numerical difference is consistent with rounding, but the different
              denominator labels remain as published. Business Standard also reports over 12,000 retailers across 25
              states and five union territories, supported by 112 distributors, while IPO Central reports 12,000 stores
              and 112 distributors nationwide. StartupTalky separately repeats a community claim of more than 3 million
              "boAtheads," without a count date or definition. None of these figures can be converted into
              active-customer growth, purchase frequency, or retention. The journey figure shows the reported
              acquisition and access surfaces, then marks later customer behavior as unmeasured; it is not a conversion
              funnel.
            claimRefs:
