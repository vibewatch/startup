chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and leadership
        blocks:
          - type: paragraph
            body: >-
              Imagine Marketing Limited is the legal entity behind boAt, a product-sales business spanning personal
              audio, wearables, and mobile accessories. The available profiles place the business in Gurugram, Haryana,
              while Tracxn separately lists Mumbai as the legal entity's incorporation address. Tracxn gives the
              entity's incorporation date as 1 November 2013; Warburg Pincus describes boAt as launched in 2016, so the
              brand's launch should not be confused with the company's incorporation. Warburg and Lapaas identify Aman
              Gupta and Sameer Mehta as co-founders. Lapaas reports that in September 2025 Gupta moved from CMO to
              non-executive director, Mehta from CEO to executive director, and COO Gaurav Nayyar to CEO; ETRetail
              separately describes Mehta as co-founder and executive director in October 2025. These reports establish a
              leadership transition, not a complete current org chart or board composition. The founder-only table is
              therefore partial; public evidence reviewed here does not resolve current board oversight or key-person
              succession.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.2'
        title: Financing history and investor visibility
        blocks:
          - type: paragraph
            body: >-
              Public financing records show a Warburg Pincus affiliate investment of approximately $100 million in
              January 2021, a Qualcomm Ventures round recorded by Tracxn in April 2021, and a later October 2022 round
              involving Warburg Pincus and Malabar Investments. Tracxn and Lapaas publish different cumulative funding
              totals and round counts, and Tracxn and Multiples.vc also differ on the October 2022 post-money valuation.
              These are database-reported historical figures, not a reconciled cap table, cash balance, or current
              valuation. The proposed IPO distinguishes a fresh issue from an offer for sale: the former would raise
              money for the issuer, while the latter represents shares sold by existing holders. The public materials
              reviewed do not establish current ownership percentages, preference rights, secondary history, or proceeds
              already available to the company.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Reported scale and financial baseline
        blocks:
          - type: paragraph
            body: >-
              The FY25 financial figures are reported on more than one basis and should remain distinct. ETRetail
              reproduces a company media release reporting consolidated revenue of ₹3,097.8 crore and standalone revenue
              of ₹3,089.6 crore; Business Standard rounds FY25 revenue to ₹3,100 crore. ET Edge reports UDRHP figures of
              ₹610.8 million net profit, while ETRetail reports consolidated net profit above ₹60 crore and standalone
              net profit of ₹64.2 crore. The same release reports consolidated EBITDA above ₹142 crore; EBITDA is not
              net income or operating cash flow. Although these figures point to a return to profitability, they do not
              establish FY26 results, ARR, cash available, customer count, or a comparable current headcount. Tracxn and
              Inc42 display employee figures with different dates or scope, so a single workforce number should not be
              inferred from them.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
      - number: '1.4'
        title: Milestones and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone record spans legal incorporation, brand launch, disclosed financing, and the renewed IPO
              process. Moneycontrol reports SEBI observations on the confidential DRHP in August 2025; ET Edge says the
              updated DRHP filed on 28 October 2025 proposed a ₹1,500 crore IPO, split between a ₹500 crore fresh issue
              and up to ₹1,000 crore of offer for sale. IPO Central reports that as of October 2026 no price band or
              issue dates had been announced. That is a reported status update, not evidence that an offering will or
              will not proceed. The next diligence step is to reconcile current regulatory filings and the final
              prospectus against the published terms, and to obtain the company's current cap table, FY26 financial
              statements, and board roster. The timeline shows dated events without treating a financing announcement as
              cash on hand or an intended IPO as a completed listing.
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
              - CO014
              - CO015
