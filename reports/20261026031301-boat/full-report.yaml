      - number: '7.2'
        title: Cost-led recovery and customer concentration
        blocks:
          - type: paragraph
            body: >-
              UnlistedZone's FY2026 analysis reports standalone revenue from operations of ₹2,928.08 crore, down 4.4%
              from FY2025, while profit for the year rose 43.5% to ₹92.15 crore. The same analysis attributes the
              improvement partly to lower advertising and warranty expense, so the profit increase should not be treated
              as evidence of sustained demand growth or cash generation. It also reports that two unnamed customers
              represented ₹1,692 crore, or 58% of sales. That is a meaningful concentration signal, but the source does
              not identify the customers or their channel, contract, renewal, or payment terms. Inc42's profile displays
              a separate FY2025 revenue figure without stating the accounting basis in the excerpt; reconcile
              definitions before using it as a trend comparator.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR013
              - CR014
