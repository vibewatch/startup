        - label: Subsidiary liquidity
          values:
            - Unknown after FY2024
            - High if liabilities remain unsupported
            - No current resolution evidence
        - label: Customer concentration
          values:
            - Not quantified; two customers were 58% of FY2026 sales
            - High if a major relationship changes
            - Contracts and renewals undisclosed
        - label: Manufacturing dependency
          values:
            - Not quantified
            - Material to production continuity
            - Alternate-source controls not evidenced
        - label: Product reliability and warranty
          values:
            - Unverified; one commercially interested source
            - Material if company-wide
            - Claims and retention cohorts not independently validated
        - label: Cost-led profitability
          values:
            - Not quantified; FY2026 revenue declined
            - High if cost cuts mask weaker demand
            - Expense reductions reported; durability unproven
