  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and spend perimeter
        blocks:
          - type: paragraph
            body: >-
              The relevant India market is consumer personal audio (earwear) plus connected wearables, not all consumer
              electronics or every product boAt sells. Case-study sources describe boAt's range across earphones,
              headphones, speakers, accessories, and smartwatches; IDC's tracker reports separate shipment measures and
              defines wristwear as digitally processing band or watch devices, excluding traditional analog and digital
              watches. These categories should not be merged into one revenue pool: public tracker releases provide unit
              volumes and selected average selling prices, not company-specific sales value, channel margin, or
              obtainable share. Charging products and cables remain adjacent spend until a consistent denominator is
              available. The first table separates measured categories from those adjacencies.
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: Shipment evidence and market shape
        blocks:
          - type: paragraph
            body: >-
              Published IDC-derived measurements show a downturn, not a validated revenue curve. CNBC TV18 and Entrackr
              report IDC's estimate of 119.0 million India wearable shipments in 2024, down 11.3% year over year;
              Communications Today says the market fell 4.0% in 2025 to 114.2 million. IDC's direct mid-2025 update
              reports 51.6 million units in 1H25, down 6.3%, and 26.7 million in 2Q25, down 9.4%; these are different
              windows and must not be added to annual readings. Composition also diverges: IDC-attributed reporting
              shows earwear growing while smartwatch volumes fell in 2024, and IDC's 2Q25 update shows smartwatch
              contraction steeper than earwear. Chandan Kumar's FY23 rupee estimate is a separate, weakly documented
              lens rather than a conversion of those shipment figures. No CAGR or currency TAM is inferred.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM014
      - number: '2.3'
        title: Buyer, payer, and route to market
        blocks:
          - type: paragraph
            body: >-
              Available buyer evidence is qualitative rather than a customer panel: case-study sources position boAt
              products around affordability, style, and durability, but do not allocate spending by age, income,
              replacement cycle, or budget owner. The reasonable underwriting frame is a consumer buyer and user for
              personal devices; gift and household-payer splits remain unknown, not measured market size. IDC's 2025
              channel reporting gives one adoption signal: offline shipments grew while online shipments declined, but
              the public release does not establish channel margins, conversion, or boAt-specific sell-through. The
              buyer map therefore distinguishes product workflow from payer and marks unsupported details explicitly.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Volume readings show an adoption constraint as well as an opportunity: full-year wearable shipments
              contracted in both 2024 and 2025, while 2Q25 smartwatch contraction outpaced earwear. IDC attributes
              smartwatch weakness to demand fatigue and saturation in entry-level products; its 2025 tracker also
              reports falling smartwatch shipments alongside modest earwear growth. Offline share expanded even as
              online shipments fell, so distribution is shifting rather than simply expanding. A separate growth
              teardown argues that ODM parity and easily replicated specifications make brand differentiation expensive
              to defend; this is an analyst's view, not an independent market-share benchmark. Valuation should not use
              a generic hardware TAM proxy: category and channel unit economics, actual ASP and gross margin, warranty
              cost, and customer replacement data are needed before shipment counts can support a revenue or durability
              case.
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM012
              - CM013
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Category leaders and adjacent alternatives
        blocks:
          - type: paragraph
            body: >-
              Competition is segmented rather than one league table. CNBC-TV18's IDC-based coverage reports boAt at
              27.6% of Indian wearables in calendar 2024, up from 26.0%; IDC's direct 2Q25 release reports 28.0%, up
              from 26.7% in 2Q24. These annual and quarterly views are not one like-for-like series. In 2Q25, IDC
              reports boAt at 31.9% of TWS against Boult at 14.9%, Noise leading smartwatches at 30.9% with boAt second
              at 13.7%, and Samsung at 80.6% of wristbands. IDC also identifies Ultrahuman, Gabit, and Aabo as
              smart-ring specialists with 65% combined share of 75,000 shipments. The profile table is a partial
              landscape: Apple is named as a wearables comparator, while status-quo and internal-build alternatives are
              not evidenced in this pool.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP009
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
      - number: '3.2'
        title: Product scope, channels, and comparative evidence
        blocks:
          - type: paragraph
            body: >-
              boAt's product perimeter spans audio, wearables, charging, grooming, and mobile accessories in Republic
              World's account of the FY2025 filing. Malkari describes marketplaces, the direct website, offline
              retailers, and distributors; a VCCircle-carried company release adds quick commerce, exports, and claims
              more than 70% of FY25 volume was domestically produced. These are evidence of product and route-to-market
              breadth, not proof of exclusive distribution or supplier leverage. InvestDawn calls boAt affordable and
              youth-oriented, while ET Edge names Apple, Samsung, and Noise as wearables competitors; neither article
              supplies matched product tests or peer prices. The two comparison tables therefore distinguish documented
              claims from unknowns rather than infer parity.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP013
              - CP015
      - number: '3.3'
        title: Durability, commoditization, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              Market leadership has not insulated the category from contraction: IDC-based 2024 coverage reports Indian
              wearable shipments down 11.3% to 119.0 million units, and IDC reports a 6.3% decline to 51.6 million in
              1H25. IDC separately records smartwatch shipment weakness and expects low-single-digit earwear growth in
              2025; its white-label smartwatch momentum statement is a forecast, not observed share. This supports
              pressure from mature demand and lower-cost alternatives, not a claim that boAt itself lost share. Inc42's
              profile lists company-level FY25 revenue and funding, but comparable scale for Noise, Boult, or global
              brands is absent; funding raised is not cash available. No retained evidence quantifies repeat purchase,
              switching costs, or multi-homing, so share leadership is a scale signal rather than demonstrated lock-in.
            claimRefs:
              - CP001
              - CP002
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Share leadership is not yet a pricing moat
            body: >-
              The market-share snapshots are category- and period-specific; category contraction and missing matched
              prices, retention, and peer unit economics leave durability and value capture unproven.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP013
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue engine and reported performance
        blocks:
          - type: paragraph
            body: >-
              boAt monetizes consumer hardware sales across audio, wearables and accessories; the assigned sources do
              not provide a reconciled revenue split by product category. Business Standard, citing the updated draft
              prospectus, reports FY25 revenue of ₹3,100 crore and online-channel sales of ₹2,166 crore, or 70.6% of
              total sales. It also describes a large offline network, but retailer and distributor counts measure reach
              rather than sell-through, collections or contribution margin. These sales figures are revenue, not ARR,
              and should not be read as recurring software revenue. ET Edge reports FY25 revenue of ₹30,978 million and
              net profit of ₹610.8 million; the company-level profit recovery is encouraging, but it does not disclose
              what proportion came from audio, wearables, accessories, or any services. A useful bridge therefore begins
              with the known product and channel footprint and stops before unreported category economics, cash
              realization and margin attribution. StartupTalky reports FY24 revenue of ₹3,121.6 crore and net loss of
              ₹81.7 crore; ET Edge reports a FY24 net loss of ₹796.8 million. The cited coverage does not reconcile the
              reporting bases, so these figures should not be silently combined.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI015
      - number: '4.2'
        title: Pricing, channel economics and unit economics
        blocks:
          - type: paragraph
            body: >-
              The available evidence is not sufficient to underwrite realized pricing or unit economics. ITD GrowthLabs
              states that Amazon and Flipkart represented 60–70% of revenue, but gives no measurement period or
              underlying dataset; this estimate is not interchangeable with Business Standard's FY25 measure of
              online-channel sales, which also has a different stated scope. Neither figure reveals marketplace fees,
              discounts, returns, customer-acquisition cost or the split between the company's own site and third-party
              platforms. The missing metrics are material: without SKU-level net realized prices, landed costs, warranty
              expense, channel deductions and repeat-purchase cohorts, neither gross profit per unit nor CAC payback can
              be estimated reliably. The tables distinguish disclosed company-level facts from third-party estimates and
              private-data gaps.
            claimRefs:
              - CI003
              - CI004
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI007
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI015
      - number: '4.3'
        title: Proposed capital plan and financial controls
        blocks:
          - type: paragraph
            body: >-
              ET Edge reports that Imagine Marketing's October 2025 updated draft prospectus contemplated a ₹1,500 crore
              IPO: ₹500 crore of fresh issuance and ₹1,000 crore of offer-for-sale shares. The reported intended uses of
              fresh proceeds were ₹225 crore for working capital and ₹150 crore for brand and marketing, with the
              balance for general corporate purposes. These are proposed financing terms, not evidence that proceeds
              were raised or remain available in October 2026; the assigned sources do not establish current cash, debt,
              burn, runway, or subsequent financing status. Financial Express and NewsBytes separately report audit
              disclosures that bank submissions did not match the FY23–FY25 books and that short-term borrowings funded
              longer-term subsidiary needs in FY23 and FY24. Financial Express also reports subsidiary-liability
              uncertainty and statutory-dues arrears. These disclosures do not establish current default or unresolved
              remediation, but they raise the bar for reconciling lender reporting, intercompany funding and compliance
              before relying on reported earnings as available liquidity.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Underwriting verdict and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The public record supports scale and a reported FY25 profitability rebound, not a complete underwriting
              case. Business Standard also reports double-digit gains and a 6.6% EBITDA margin in the June quarter of
              FY26, but the cited coverage does not reconcile that quarterly measure to audited annual cash generation.
              Positive net income is not cash burn, cash on hand, or runway; funding raised and a proposed fresh issue
              are not cash available. The base case should therefore remain conditional on audited category and channel
              contribution, working-capital conversion, warranty and returns costs, and documented closure of audit
              findings. Before sizing capital needs, request the latest audited and monthly management accounts,
              bank-to-ledger reconciliations, subsidiary cash and debt schedules, inventory aging, channel settlement
              data, and SKU-level gross-margin and marketing-payback cohorts. Without those records, revenue quality and
              capital sufficiency remain materially underdetermined.
            claimRefs:
              - CI006
              - CI010
              - CI011
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Profitability is not proof of capital sufficiency
            body: >-
              Reported FY25 net profit does not establish operating cash flow, cash on hand or runway. Audit disclosures
              concerning bank submissions and subsidiary funding make current lender and intercompany reconciliations a
              priority diligence item.
            calloutType: risk
            claimRefs:
              - CI002
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and maturity
        blocks:
          - type: paragraph
            body: >-
              The reviewed material describes boAt as a consumer-electronics portfolio rather than a single software
              product: audio devices range from wired and wireless earphones to TWS, headphones, speakers and soundbars,
              alongside smartwatches and accessories. CompanyCheck lists specific models including Airdopes 181 Pro,
              Rockerz 255 Pro+, Storm Call 3 Plus and Stone 350, but its profile does not establish current sales,
              installed base or model-level lifecycle status. IDC's 2Q25 tracker separately identifies boAt across
              overall wearables, TWS, over-ear audio and smartwatches, giving independent category-level evidence of
              active market presence. The product matrix therefore distinguishes reported availability from verified
              maturity, product outcomes and proprietary differentiation; those deeper measures are not established by
              the retained sources.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE011
              - CE012
      - number: '5.2'
        title: Customer workflows and feature claims
        blocks:
          - type: paragraph
            body: >-
              Public descriptions map the range to familiar consumer jobs: listening on the move, portable or home
              audio, smartwatch-based notifications and health tracking, and gaming audio. These are plausible use cases
              for the named device classes, not evidence of measured customer benefit. Altius describes features
              including active noise cancellation, low latency, Bluetooth calling and AMOLED displays; StartupTalky
              lists wireless speakers, earbuds, headphones and earphones in its product overview. Neither source
              supplies independent test results, compatibility matrices, battery-life protocols, health-sensor accuracy,
              latency measurements or field reliability data. The workflow table records the described function
              alongside what remains unverified, avoiding conversion of marketing feature language into a performance
              benchmark.
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE012
      - number: '5.3'
        title: Engineering and operating model
        blocks:
          - type: paragraph
            body: >-
              Neoma Capital's August 2026 research characterizes boAt's strength as branding, marketing and distribution
              rather than proprietary manufacturing technology, and describes reliance on third-party contract
              manufacturers, predominantly in China. These are secondary-source descriptions, not audited disclosures of
              engineering headcount, supplier concentration or factory controls. Separately, Inc42 reported that Imagine
              Marketing signed an agreement to acquire KaHa/Cove and outlined design, firmware, algorithm and mobile-app
              capabilities intended to augment wearables. The available material does not establish how much of that
              capability is currently deployed in shipping products. The architecture exhibit is consequently a map of
              reported product and capability layers, not a verified bill of materials or software architecture.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE007
              - CE009
              - CE011
              - CE015
      - number: '5.4'
        title: Product proof, trust and diligence limits
        blocks:
          - type: paragraph
            body: >-
              IDC's market data provides useful external context but not product-level validation: in 2Q25 it reported
              category contractions alongside boAt's vendor shares, without testing device quality or customer outcomes.
              The retained company and secondary descriptions do not provide a comparable public record for deployment
              reliability, support resolution, returns, warranty cost, safety testing, privacy/security controls or
              product certifications. Nor does this pool contain a public developer-signal or practitioner-community
              proxy; for this consumer-hardware business, recruiting, engineering talks or integration-partner evidence
              would be more relevant than software repository activity. These absences are evidence gaps, not proof that
              controls or incidents do not exist. Diligence should request current product specifications, reliability
              and service cohorts, test/certification records, security ownership, and supplier/quality-control detail.
            claimRefs:
              - CE005
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architecture and quality remain under-evidenced
            body: >-
              The available sources describe product categories and selected features but do not disclose current
              product-level architecture, supplier controls, reliability outcomes or security/certification evidence.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and routes to market
        blocks:
          - type: paragraph
            body: >-
              boAt's public customer profile is best segmented by product and route to market, not by a disclosed
              customer roster. Business Standard and IPO Central describe audio, wearables, and charging products, with
              more than 250 products or SKUs reported for June 2025; MarkHub24 and afaqs describe a young audience and
              affordable, design-led positioning. These are published descriptions, not measured buyer demographics.
              Channel evidence is more quantitative: Business Standard reports online channels as 70.6% of FY25 total
              sales, while IPO Central reports 71% of FY25 revenue. The labels differ, so they should not be treated as
              a reconciled metric. Neither source splits who purchases versus uses, average spend, category-level
              customer counts, or top-account shares; stores and marketplaces are routes to market, not named
              end-customer references.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU014
              - CU015
