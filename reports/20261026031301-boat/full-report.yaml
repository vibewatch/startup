            title: Unit volume is not customer durability
            body: >-
              FY25 units sold and reported distribution coverage establish reach, but do not establish unique customers,
              repeat buying, satisfaction, or low concentration. Request cohort-level repurchase and returns data before
              treating reach as durable demand.
            calloutType: risk
