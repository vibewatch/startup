              - CR015
      - number: '7.3'
        title: Supplier, product, and customer-experience exposure
        blocks:
          - type: paragraph
            body: >-
              The FY2026 analysis describes production through contract manufacturers and a 50:50 Dixon Technologies
              joint venture outside Imagine Marketing's balance sheet. That asset-light structure can leave execution
              dependent on partner capacity, quality control, and continuity; public evidence here does not quantify
              supplier concentration or alternate-source readiness. Altius Investech's undated company profile flags
              India concentration and limited product diversification, but it does not establish a current supply
              interruption. Separately, Dyrect's July 2026 article alleges early product failures and a fall in repeat
              purchase, but provides no cohort methodology or denominator and its founder promotes a warranty-services
              business. Treat the assertions as a low-confidence signal, not measured company-wide performance.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR015
