      - number: '6.3'
        title: Customer proof is mostly aggregate or method-limited
        blocks:
          - type: paragraph
            body: >-
              The closest customer-level evidence in the assigned pool is an IJNRD questionnaire study describing 50
              boAt-product users in Noida, including students, selected through convenience sampling. The paper states
              that its scope is regional and that it relies on participant- provided responses; the fetched text does
              not provide a usable response distribution for independently quantifying satisfaction. It therefore offers
              a limited user signal, not a representative customer study or a named reference. StartupTalky's
              "boAtheads" figure is also an unattributed community claim rather than an individually verifiable customer
              list. The reported unit volume and retail network establish commercial scale, but the reviewed sources do
              not identify production references, customer-specific outcomes, or renewal histories.
