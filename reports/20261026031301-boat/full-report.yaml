  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Financial controls and regulatory readiness
        blocks:
          - type: paragraph
            body: >-
              The clearest high-severity risk is disclosure and control quality ahead of any public-market process.
              Business Standard reports that auditors identified mismatches between lender submissions and the books for
              FY2023–FY2025; NDTV Profit separately describes repeated record-keeping lapses over the same period. Both
              also report short-term borrowings used for long-term subsidiary requirements and material uncertainty
              about liabilities at two subsidiaries for FY2023–FY2024. These are auditor observations, not proof of
              fraud or a current default. Business Standard says the filing describes corrective steps on some matters,
              but the available sources do not establish complete remediation. Until reconciliations, controls testing,
              and subsidiary liquidity evidence are reviewed, public-market readiness remains a material residual risk.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
