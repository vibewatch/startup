      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break tests
        blocks:
          - type: paragraph
            body: >-
              The updated draft prospectus described by ET Edge in October 2025 proposed ₹500 crore of fresh issuance
              and up to ₹1,000 crore of offer-for-sale shares, with ₹225 crore of fresh proceeds earmarked for working
              capital and ₹150 crore for brand and marketing. These are dated proposed terms, not confirmation of the
              current transaction or available cash. A practical underwriting gate is to obtain current audited
              lender-to-ledger reconciliations, subsidiary-liability support, named-customer revenue and contract data,
              and warranty/return cohorts split by channel. Repeated unexplained audit mismatches, persistent
              concentration without contractual protection, or failure to produce reproducible service and retention
              metrics would warrant pausing the thesis rather than assuming management controls have closed the risks.
              The matrix shows evidence gates, not probability estimates.
            claimRefs:
