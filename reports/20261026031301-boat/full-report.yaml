  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              boAt's public-market story has two supported sides: reporting describes a proposed valuation well above an
              earlier financing mark, while later sources report a return to profit and a higher 2024 wearables share.
              Those positives do not establish an investable entry price. TechCrunch reported a $300 million Series B
              valuation and, a year later, an IPO valuation target of $1.5 billion or more attributed to an unnamed
              investor (CV001, CV002). Moneycontrol later described a ₹13,000 crore target as reported, not as a final
              offer price (CV006). Given the secondary evidence and missing transaction terms, the recommendation is
              track / research more, with low confidence and high risk; no buy call or numeric return target is
              supportable.
            claimRefs:
              - CV001
              - CV002
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: Financing headlines versus earnings evidence
        blocks:
          - type: paragraph
            body: >-
              FY25 results are an encouraging but unresolved earnings signal. Inc42's profile lists FY25 revenue at
              ₹3,089.6 crore+, while ET Edge reports revenue of ₹30,978 million for the year ended March 2025 and net
              profit of ₹610.8 million, following net losses in FY24 and FY23 (CV008, CV009, CV010). The FY25 revenue
              figures use different units and sources and are not reconciled here; they should not be silently
              normalized into one audited metric. ET Edge also describes a proposed ₹1,500 crore issue, comprising ₹500
              crore of fresh shares and up to ₹1,000 crore of offer for sale (CV007). Offer size is not company
              valuation. Neither that article nor Moneycontrol's reported target establishes final pricing or investor
              preference rights.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Operating evidence and directional cases
        blocks:
          - type: paragraph
            body: >-
              Market evidence supports brand scale but not a proven durable premium. CNBC TV18's account of IDC data
              records India's wearable shipments down 11.3% year over year to 119.0 million units in 2024, while boAt's
              reported overall share increased from 26.0% in 2023 to 27.6% in 2024 (CV011, CV012). Entrackr relays the
              same IDC tracker: smartwatch shipments fell 34.4% to 35.0 million units, while earwear shipments rose 3.8%
              to 83.5 million and TWS reached 70.9% of earwear (CV013). These are category and share indicators, not
              peer valuation multiples; the outlets are reporting the same underlying tracker rather than independent
              benchmarks. TechCrunch also reproduces the company's historical disclosure that its top two online
              marketplaces accounted for 83.72% of revenue from operations in FY2021 and 75.02% in the six months ended
              September 30, 2021 (CV003); current channel mix remains a diligence item.
            claimRefs:
              - CV003
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: Diligence gates and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The bull case requires the FY25 profit recovery to persist and boAt to retain category leadership despite
              the 2024 market contraction; the bear case is a further decline in demand or average selling prices
              combined with channel concentration and weak earnings conversion (CV003, CV010, CV011, CV012, CV013).
              Re-underwrite if the next audited year is loss-making, current market-share data reverses the reported
              2024 gain, or final IPO terms imply a price unsupported by verified earnings and cash generation. Before
              entry, obtain the final offer document and fully diluted cap table, net debt and cash-flow detail, segment
              margins, warranty costs, repeat-purchase evidence, current channel mix, and a dated comparable set. Until
              those are available, scenario probabilities and valuation ranges would be invented rather than
              evidence-led.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
