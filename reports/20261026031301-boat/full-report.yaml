      - number: '6.4'
        title: Durability and concentration remain diligence gaps
        blocks:
          - type: paragraph
            body: >-
              CIIM characterizes marketplace dependence and price competition as risks, and identifies discounting and
              category commoditization as pressure on margins. These are source-level assessments, not measured customer
              price elasticity or churn. More broadly, the assigned public evidence contains no cohort series for repeat
              purchase, retention, renewal, returns, or complaint closure, and does not show customer concentration by
              platform, distributor, retailer, or end buyer. Consequently, scale is clearer than lifetime value,
              satisfaction, or channel resilience. Underwriting durability requires an anonymized cohort file linking
              unique purchasers to category, channel, order frequency, returns, and warranty outcomes, plus revenue and
              contribution shares for the largest channels and counterparties.
            claimRefs:
              - CU010
              - CU011
