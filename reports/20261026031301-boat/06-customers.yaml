      - ["Online channel share", "70.6% of total sales; 71% of revenue (rounded)", "FY25", "Business Standard and IPO Central; high confidence in the separately attributed figures", "Online is the larger reported route", "The sources use different denominator labels; no marketplace, D2C, or buyer split"]
      - ["Offline distribution", "Over 12,000 retailers; 112 distributors", "FY25 reporting; exact as-of date for the footprint is not separately stated", "Business Standard and IPO Central; high confidence in the separately attributed figures", "Reported physical reach", "No outlet sell-through, productivity, active-store count, or retailer concentration"]
      - ["Customer community", "More than 3 million 'boAtheads' / customers", "StartupTalky article dated 2025-04-08; count date not stated", "StartupTalky; low confidence", "A secondary-source brand-community claim", "No unique, active, or paying-customer definition and no counting method"]
      - ["Repeat purchase, retention, churn, or renewal", null, "Not reported in the assigned public evidence", "Evidence gap", "No durability conclusion can be drawn", "Null means no measure found in the assigned evidence, not zero"]
    notes: "Reported values retain their original metric names and periods; units, sales, distribution coverage, and the unattributed community count have different denominators and are not interchangeable."
    claimRefs: [CU001, CU002, CU003, CU007, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Evidence item
      - Named customer
      - Segment or use
      - Production versus pilot
      - Reported outcome
      - Limitation
    rows:
      - ["FY25 unit sales and channel reporting", "No end customer is named in the reviewed sources", "Retail consumers across online and offline channels", "Aggregate commercial sales; not a named deployment", "Over 34 million units sold in FY25", "No unique-buyer count, reference outcome, or repeat-purchase measure"]
      - ["Noida questionnaire study", "Respondents are not individually named", "50 boAt-product users in Noida, including students", "Survey of existing users; not a customer case study", "The paper presents broad satisfaction conclusions", "Convenience sample, regional scope, participant-provided responses, and no usable response distribution in the fetched text"]
      - ["'boAtheads' community claim", "No individual customer is named", "Claimed consumer community", "Brand-community claim; production or pilot status is not applicable", "StartupTalky reports more than 3 million customers", "No count date, unique/active definition, methodology, or customer outcomes"]
    notes: "This sample inventories the available proof surfaces, not a named-customer register; aggregate volume, a local survey, and a community claim do not establish referenceable deployments or retention."
    enumerationScope:
      coverage: sample
      basis: "Sample of customer evidence in the assigned successful-source pool; it is not a complete customer list or exhaustive deployment register."
    claimRefs: [CU001, CU007, CU008, CU009, CU013, CU014]
