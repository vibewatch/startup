company:
  name: boAt
chapter:
  number: 6
  title: Customers
  summary: >-
    FY25 unit sales and channel disclosures indicate substantial commercial reach, but they
    measure units and sales rather than unique customers. The assigned evidence does not
    establish named customer outcomes, repeat purchase, retention, or customer concentration.
sections:
  - id: customer-segments
    title: Customer segments and routes to market
    body: >-
      boAt's public customer profile is best segmented by product and route to market, not by a
      disclosed customer roster. Business Standard and IPO Central describe audio, wearables, and
      charging products, with more than 250 products or SKUs reported for June 2025; MarkHub24
      and afaqs describe a young audience and affordable, design-led positioning. These are
      published descriptions, not measured buyer demographics. Channel evidence is more
      quantitative: Business Standard reports online channels as 70.6% of FY25 total sales,
      while IPO Central reports 71% of FY25 revenue. The labels differ, so they should not be
      treated as a reconciled metric. Neither source splits who purchases versus uses, average
      spend, category-level customer counts, or top-account shares; stores and marketplaces are
      routes to market, not named end-customer references.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU014, CU015]
    tableRefs: [TU001]
  - id: adoption-scale
    title: Adoption scale is visible; unique customers are not
    body: >-
      IPO Central reports more than 34 million units sold in FY25, a measure of product volume
      rather than unique buyers. The same source reports 71% of revenue from online channels,
      while Business Standard gives 70.6% of total sales; the small numerical difference is
      consistent with rounding, but the different denominator labels remain as published.
      Business Standard also reports over 12,000 retailers across 25 states and five union
      territories, supported by 112 distributors, while IPO Central reports 12,000 stores and
      112 distributors nationwide. StartupTalky separately repeats a community claim of more
      than 3 million "boAtheads," without a count date or definition. None of these figures can
      be converted into active-customer growth, purchase frequency, or retention. The journey
      figure shows the reported acquisition and access surfaces, then marks later customer
      behavior as unmeasured; it is not a conversion funnel.
    claimRefs: [CU001, CU002, CU003, CU007, CU013, CU014]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: customer-proof
    title: Customer proof is mostly aggregate or method-limited
    body: >-
      The closest customer-level evidence in the assigned pool is an IJNRD questionnaire study
      describing 50 boAt-product users in Noida, including students, selected through convenience
      sampling. The paper states that its scope is regional and that it relies on participant-
      provided responses; the fetched text does not provide a usable response distribution for
      independently quantifying satisfaction. It therefore offers a limited user signal, not a
      representative customer study or a named reference. StartupTalky's "boAtheads" figure is
      also an unattributed community claim rather than an individually verifiable customer list.
      The reported unit volume and retail network establish commercial scale, but the reviewed
      sources do not identify production references, customer-specific outcomes, or renewal
      histories.
    claimRefs: [CU001, CU007, CU008, CU009, CU013, CU014]
    tableRefs: [TU003]
  - id: durability-risks
    title: Durability and concentration remain diligence gaps
    body: >-
      CIIM characterizes marketplace dependence and price competition as risks, and identifies
      discounting and category commoditization as pressure on margins. These are source-level
      assessments, not measured customer price elasticity or churn. More broadly, the assigned
      public evidence contains no cohort series for repeat purchase, retention, renewal, returns,
      or complaint closure, and does not show customer concentration by platform, distributor,
      retailer, or end buyer. Consequently, scale is clearer than lifetime value, satisfaction,
      or channel resilience. Underwriting durability requires an anonymized cohort file linking
      unique purchasers to category, channel, order frequency, returns, and warranty outcomes,
      plus revenue and contribution shares for the largest channels and counterparties.
    claimRefs: [CU010, CU011, CU013, CU014]
callouts:
  - calloutType: risk
    title: Unit volume is not customer durability
    body: >-
      FY25 units sold and reported distribution coverage establish reach, but do not establish
      unique customers, repeat buying, satisfaction, or low concentration. Request cohort-level
      repurchase and returns data before treating reach as durable demand.
    claimRefs: [CU001, CU002, CU003, CU013, CU014]
