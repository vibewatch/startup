company:
  name: boAt
chapter:
  number: 3
  title: Competitors
  summary: >-
    IDC-reported market snapshots place boAt among the leaders in Indian
    wearables and TWS, while Noise leads smartwatches and Boult is a measured
    TWS challenger. The evidence supports category-level reach, but not
    comparable pricing, customer lock-in, or a durable pricing moat.
sections:
  - id: category-landscape
    title: Category leaders and adjacent alternatives
    body: >-
      Competition is segmented rather than one league table. CNBC-TV18's
      IDC-based coverage reports boAt at 27.6% of Indian wearables in calendar
      2024, up from 26.0%; IDC's direct 2Q25 release reports 28.0%, up from
      26.7% in 2Q24. These annual and quarterly views are not one like-for-like
      series. In 2Q25, IDC reports boAt at 31.9% of TWS against Boult at 14.9%,
      Noise leading smartwatches at 30.9% with boAt second at 13.7%, and
      Samsung at 80.6% of wristbands. IDC also identifies Ultrahuman, Gabit,
      and Aabo as smart-ring specialists with 65% combined share of 75,000
      shipments. The profile table is a partial landscape: Apple is named as a
      wearables comparator, while status-quo and internal-build alternatives
      are not evidenced in this pool.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP009, CP016]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: product-and-route-to-market
    title: Product scope, channels, and comparative evidence
    body: >-
      boAt's product perimeter spans audio, wearables, charging, grooming, and
      mobile accessories in Republic World's account of the FY2025 filing.
      Malkari describes marketplaces, the direct website, offline retailers,
      and distributors; a VCCircle-carried company release adds quick commerce,
      exports, and claims more than 70% of FY25 volume was domestically
      produced. These are evidence of product and route-to-market breadth, not
      proof of exclusive distribution or supplier leverage. InvestDawn calls
      boAt affordable and youth-oriented, while ET Edge names Apple, Samsung,
      and Noise as wearables competitors; neither article supplies matched
      product tests or peer prices. The two comparison tables therefore
      distinguish documented claims from unknowns rather than infer parity.
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP015]
    tableRefs: [TP002, TP003]
  - id: durability-and-displacement
    title: Durability, commoditization, and diligence limits
    body: >-
      Market leadership has not insulated the category from contraction:
      IDC-based 2024 coverage reports Indian wearable shipments down 11.3% to
      119.0 million units, and IDC reports a 6.3% decline to 51.6 million in
      1H25. IDC separately records smartwatch shipment weakness and expects
      low-single-digit earwear growth in 2025; its white-label smartwatch
      momentum statement is a forecast, not observed share. This supports
      pressure from mature demand and lower-cost alternatives, not a claim that
      boAt itself lost share. Inc42's profile lists company-level FY25 revenue
      and funding, but comparable scale for Noise, Boult, or global brands is
      absent; funding raised is not cash available. No retained evidence
      quantifies repeat purchase, switching costs, or multi-homing, so share
      leadership is a scale signal rather than demonstrated lock-in.
    claimRefs: [CP001, CP002, CP013, CP014, CP015, CP016]
callouts:
  - calloutType: risk
    title: Share leadership is not yet a pricing moat
    body: >-
      The market-share snapshots are category- and period-specific; category
      contraction and missing matched prices, retention, and peer unit
      economics leave durability and value capture unproven.
    claimRefs: [CP001, CP002, CP013, CP015, CP016]
