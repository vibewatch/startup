company:
  name: boAt
chapter:
  number: 8
  title: Valuation
  summary: >-
    Secondary reporting supports boAt's scale, FY25 profit recovery and a proposed IPO,
    but the assigned evidence does not establish a final entry price, comparable multiple
    or return range. Track and request current primary financial and offering disclosures
    before underwriting an investment.
sections:
  - id: decision-and-price-discipline
    title: Decision and price discipline
    body: >-
      boAt's public-market story has two supported sides: reporting describes a proposed
      valuation well above an earlier financing mark, while later sources report a return
      to profit and a higher 2024 wearables share. Those positives do not establish an
      investable entry price. TechCrunch reported a $300 million Series B valuation and,
      a year later, an IPO valuation target of $1.5 billion or more attributed to an
      unnamed investor (CV001, CV002). Moneycontrol later described a ₹13,000 crore
      target as reported, not as a final offer price (CV006). Given the secondary evidence
      and missing transaction terms, the recommendation is track / research more, with
      low confidence and high risk; no buy call or numeric return target is supportable.
    claimRefs:
      - CV001
      - CV002
      - CV006
    tableRefs:
      - TV001
  - id: financing-and-earnings
    title: Financing headlines versus earnings evidence
    body: >-
      FY25 results are an encouraging but unresolved earnings signal. Inc42's profile
      lists FY25 revenue at ₹3,089.6 crore+, while ET Edge reports revenue of ₹30,978
      million for the year ended March 2025 and net profit of ₹610.8 million, following
      net losses in FY24 and FY23 (CV008, CV009, CV010). The FY25 revenue figures use
      different units and sources and are not reconciled here; they should not be silently
      normalized into one audited metric. ET Edge also describes a proposed ₹1,500 crore
      issue, comprising ₹500 crore of fresh shares and up to ₹1,000 crore of offer for
      sale (CV007). Offer size is not company valuation. Neither that article nor
      Moneycontrol's reported target establishes final pricing or investor preference
      rights.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
    tableRefs:
      - TV002
  - id: operating-cases
    title: Operating evidence and directional cases
    body: >-
      Market evidence supports brand scale but not a proven durable premium. CNBC TV18's
      account of IDC data records India's wearable shipments down 11.3% year over year
      to 119.0 million units in 2024, while boAt's reported overall share increased from
      26.0% in 2023 to 27.6% in 2024 (CV011, CV012). Entrackr relays the same IDC
      tracker: smartwatch shipments fell 34.4% to 35.0 million units, while earwear
      shipments rose 3.8% to 83.5 million and TWS reached 70.9% of earwear (CV013).
      These are category and share indicators, not peer valuation multiples; the outlets
      are reporting the same underlying tracker rather than independent benchmarks.
      TechCrunch also reproduces the company's historical disclosure that its top two
      online marketplaces accounted for 83.72% of revenue from operations in FY2021 and
      75.02% in the six months ended September 30, 2021 (CV003); current channel mix
      remains a diligence item.
    claimRefs:
      - CV003
      - CV011
      - CV012
      - CV013
    tableRefs:
      - TV003
    figureRefs:
      - FV001
  - id: diligence-and-thesis-breaks
    title: Diligence gates and thesis breaks
    body: >-
      The bull case requires the FY25 profit recovery to persist and boAt to retain
      category leadership despite the 2024 market contraction; the bear case is a further
      decline in demand or average selling prices combined with channel concentration
      and weak earnings conversion (CV003, CV010, CV011, CV012, CV013). Re-underwrite
      if the next audited year is loss-making, current market-share data reverses the
      reported 2024 gain, or final IPO terms imply a price unsupported by verified
      earnings and cash generation. Before entry, obtain the final offer document and
      fully diluted cap table, net debt and cash-flow detail, segment margins, warranty
      costs, repeat-purchase evidence, current channel mix, and a dated comparable set.
      Until those are available, scenario probabilities and valuation ranges would be
      invented rather than evidence-led.
    claimRefs:
      - CV003
      - CV010
      - CV011
      - CV012
      - CV013
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision item
      - Current assessment
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - Wait for final IPO terms and primary financial disclosures before entry.
      - - Confidence
        - Low
        - Valuation targets are reported estimates; the assigned material does not establish a final price.
      - - Risk rating
        - High
        - Category contraction, historical marketplace concentration and unverified earnings quality remain material.
      - - Valuation stance
        - Not underwritable
        - No final offer price, comparable multiple or fully diluted share count is provided in the assigned evidence.
      - - Return target
        - Not quantified
        - Do not infer a target return without entry price, cap table, net debt and cash-flow evidence.
    notes: >-
      This is an evidence-sensitive decision framework, not a priced valuation; the
      reported IPO targets are not final offer prices.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence in the assigned source set
      - What would change the view
    rows:
      - - Supportive thesis
        - FY25 net profit is reported after FY23 and FY24 losses, and boAt's reported overall share rose in 2024.
        - Verify the recovery in audited filings and show it persists with segment margins and operating cash conversion.
      - - Anti-thesis
        - India's wearable shipments contracted in 2024; historical filings cited by TechCrunch show high marketplace concentration.
        - Reassess if current IDC data shows category recovery and company disclosures demonstrate lower channel dependence.
      - - Entry test
        - 2025 sources report valuation targets and a proposed issue structure, not a final offer price or comparable valuation set.
        - Require the final price band, fully diluted share count, preference terms, net debt and dated peer / transaction evidence.
    notes: >-
      Financial and market figures are publisher-reported; the assigned sources do not
      reconcile FY25 revenue definitions or supply a primary comparable set.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull, base and bear underwriting cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Downside trigger and probability signal
    rows:
      - - Bull
        - FY25 profitability persists and boAt retains its reported 2024 share gain as demand stabilizes.
        - No numeric range until final price, audited earnings, cash conversion and peer multiples are verified.
        - Failure to sustain profit or reverse share gains weakens the case; probability is not assigned.
      - - Base
        - FY25 profit recovery coexists with a 2024 market contraction and mixed category trends.
        - Track / research more; the sources do not support a return estimate or fair-value range.
        - Re-underwrite on current shipment, margin and channel data; probability is not assigned.
      - - Bear
        - Wearable demand or smartwatch pricing weakens further while marketplace concentration remains material.
        - Avoid assigning a downside value without current earnings, net debt, share count and transaction terms.
        - Loss-making audited results or an unsupported IPO price is a thesis break; probability is not assigned.
    notes: >-
      Cases are directional, not forecasts. Numeric valuation ranges and probabilities
      are omitted because final price, cap table, current cash flow and comparable
      multiples are not established by the assigned evidence.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
