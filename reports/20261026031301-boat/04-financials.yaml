company:
  name: boAt
chapter:
  number: 4
  title: Financials
  summary: >-
    Public reporting describes a roughly ₹3.1k crore FY25 revenue business and a return
    to reported net profit, but does not establish category-level margins, cash conversion,
    or current runway. The proposed IPO structure and disclosed audit exceptions make
    source-level financial diligence essential before treating accounting profitability
    as capital adequacy.
sections:
  - id: revenue-engine
    title: Revenue engine and reported performance
    body: >-
      boAt monetizes consumer hardware sales across audio, wearables and accessories;
      the assigned sources do not provide a reconciled revenue split by product category.
      Business Standard, citing the updated draft prospectus, reports FY25 revenue of
      ₹3,100 crore and online-channel sales of ₹2,166 crore, or 70.6% of total sales.
      It also describes a large offline network, but retailer and distributor counts
      measure reach rather than sell-through, collections or contribution margin. These
      sales figures are revenue, not ARR, and should not be read as recurring software
      revenue. ET Edge reports FY25 revenue of ₹30,978 million and net profit of ₹610.8
      million; the company-level profit recovery is encouraging, but it does not disclose
      what proportion came from audio, wearables, accessories, or any services. A useful
      bridge therefore begins with the known product and channel footprint and stops
      before unreported category economics, cash realization and margin attribution.
      StartupTalky reports FY24 revenue of ₹3,121.6 crore and net loss of ₹81.7 crore;
      ET Edge reports a FY24 net loss of ₹796.8 million. The cited coverage does not
      reconcile the reporting bases, so these figures should not be silently combined.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI014]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing, channel economics and unit economics
    body: >-
      The available evidence is not sufficient to underwrite realized pricing or unit
      economics. ITD GrowthLabs states that Amazon and Flipkart represented 60–70% of
      revenue, but gives no measurement period or underlying dataset; this estimate is
      not interchangeable with Business Standard's FY25 measure of online-channel
      sales, which also has a different stated scope. Neither figure reveals marketplace
      fees, discounts, returns, customer-acquisition cost or the split between the
      company's own site and third-party platforms. The missing metrics are material:
      without SKU-level net realized prices, landed costs,
      warranty expense, channel deductions and repeat-purchase cohorts, neither gross
      profit per unit nor CAC payback can be estimated reliably. The tables distinguish
      disclosed company-level facts from third-party estimates and private-data gaps.
    claimRefs: [CI003, CI004, CI007]
    tableRefs: [TI002, TI003]
  - id: capital-and-controls
    title: Proposed capital plan and financial controls
    body: >-
      ET Edge reports that Imagine Marketing's October 2025 updated draft prospectus
      contemplated a ₹1,500 crore IPO: ₹500 crore of fresh issuance and ₹1,000 crore
      of offer-for-sale shares. The reported intended uses of fresh proceeds were
      ₹225 crore for working capital and ₹150 crore for brand and marketing, with the
      balance for general corporate purposes. These are proposed financing terms, not
      evidence that proceeds were raised or remain available in October 2026; the
      assigned sources do not establish current cash, debt, burn, runway, or subsequent
      financing status. Financial Express and NewsBytes separately report audit
      disclosures that bank submissions did not match the FY23–FY25 books and that
      short-term borrowings funded longer-term subsidiary needs in FY23 and FY24.
      Financial Express also reports subsidiary-liability uncertainty and statutory-dues
      arrears. These disclosures do not establish current default or unresolved
      remediation, but they raise the bar for reconciling lender reporting, intercompany
      funding and compliance before relying on reported earnings as available liquidity.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence priorities
    body: >-
      The public record supports scale and a reported FY25 profitability rebound, not
      a complete underwriting case. Business Standard also reports double-digit gains
      and a 6.6% EBITDA margin in the June quarter of FY26, but the cited coverage does
      not reconcile that quarterly measure to audited annual cash generation. Positive
      net income is not cash burn, cash on hand, or runway; funding raised and a proposed
      fresh issue are not cash available. The base case should therefore remain
      conditional on audited category and channel contribution, working-capital
      conversion, warranty and returns costs, and documented closure of audit findings.
      Before sizing capital needs, request the latest audited and monthly management
      accounts, bank-to-ledger reconciliations, subsidiary cash and debt schedules,
      inventory aging, channel settlement data, and SKU-level gross-margin and
      marketing-payback cohorts. Without those records, revenue quality and capital
      sufficiency remain materially underdetermined.
    claimRefs: [CI006, CI010, CI011, CI015]
tables:
  - id: TI001
    title: Revenue streams and public traction
    columns:
      - Stream or measure
      - Evidence in assigned sources
      - Underwriting interpretation
    rows:
      - - Product sales
        - Audio, wearables and accessories are described; no reconciled category revenue split is reported in the cited coverage.
        - Request audited revenue by category, SKU and period, including returns and channel rebates.
      - - FY25 total revenue
        - Business Standard reports ₹3,100 crore; Inc42 lists ₹3,089.6 crore+ for FY25.
        - Approximate company revenue, not ARR; reconcile reporting basis and consolidation.
      - - FY25 net profit
        - ET Edge reports ₹610.8 million; it also reports net losses of ₹796.8 million in FY24 and ₹1,294.5 million in FY23.
        - Accounting profit does not establish operating cash flow or cash available.
      - - FY25 online-channel sales
        - Business Standard reports ₹2,166 crore, or 70.6% of total sales.
        - Obtain net realized sales after discounts, platform fees, returns and settlement timing.
      - - Offline distribution
        - Business Standard reports more than 12,000 retailers across 25 states and five union territories, supported by 112 distributors.
        - Network size is not proof of active doors, sell-through, collection speed or margin.
    notes: >-
      Figures are attributed to the named third-party reports; several cite Imagine
      Marketing's prospectus. Revenue is not ARR. The online-channel value is reported
      as sales, while retailer and distributor counts are footprint indicators, not
      revenue or utilization measures. The cited sources do not reconcile these bases.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing and channel-monetization evidence
    columns:
      - Metric
      - Public evidence retained
      - Status and diligence request
    rows:
      - - List price by SKU and price band
        - No current, directly attributable price schedule is established by the retained sources.
        - Gap; obtain dated SKU-level list prices by channel and product family.
      - - Realized price, promotions and returns
        - No net realized price or discount/return reconciliation is reported in the retained sources.
        - Gap; reconcile gross billings to net sales by SKU, channel and quarter.
      - - Online channel mix
        - Business Standard reports FY25 online sales of ₹2,166 crore, or 70.6% of total sales.
        - Reported company-level channel measure; request channel-specific net sales, fees and contribution.
      - - Marketplace concentration estimate
        - ITD GrowthLabs states Amazon and Flipkart account for 60–70% of revenue; period and calculation are not supplied.
        - Unverified third-party estimate; obtain audited channel mix and platform settlement records.
      - - Sales efficiency
        - No CAC, payback, cohort retention or marketing-attributed contribution is quantified.
        - Gap; request channel-level acquisition spend, orders, repeat cohorts and contribution after fees.
    notes: >-
      The FY25 online-sales share and ITD GrowthLabs' marketplace estimate have different
      scopes and unspecified comparability; do not add, average or treat them as the
      same metric. List pricing is not realized revenue.
    claimRefs: [CI004, CI007]
  - id: TI003
    title: Unit economics and capital-conversion gaps
    columns:
      - Metric
      - Value in assigned evidence
      - Why it matters
      - Specific diligence request
    rows:
      - - Gross margin by category and channel
        - null
        - Shows whether product sales cover platform deductions, warranty and marketing costs.
        - Obtain audited category/channel gross-profit bridges with freight, duties, discounts and returns.
      - - Landed product cost and supplier terms
        - null
        - Determines pricing flexibility, inventory exposure and sensitivity to sourcing conditions.
        - Obtain SKU-level bills of materials, landed-cost schedules, supplier terms and purchase commitments.
      - - CAC, contribution margin and payback
        - null
        - Tests whether continued acquisition spend creates profitable repeat customers.
        - Obtain channel-level cohort economics, attributed spend, repeat rates and contribution after fees.
      - - Warranty, returns and service-delivery cost
        - null
        - Can materially reduce hardware contribution after sale.
        - Obtain return rates, warranty claims, reserve methodology, repair costs and closure times by SKU.
      - - Inventory turns and working-capital cycle
        - null
        - Drives cash requirements despite reported accounting profit.
        - Obtain monthly inventory aging, purchase commitments, receivable/payable aging and cash-conversion cycle.
      - - Operating cash flow, cash balance and runway
        - null
        - Determines actual capital adequacy; neither net income nor proposed IPO proceeds substitute for cash.
        - Obtain latest bank-confirmed cash, debt maturities, undrawn facilities, monthly burn and a reconciled cash-flow forecast.
    notes: >-
      null means the metric is not quantified in the assigned public evidence, not zero.
      No estimates are supplied because the retained sources do not provide consistent
      denominators or a usable company-level cost bridge.
    claimRefs: [CI006, CI007, CI015]
