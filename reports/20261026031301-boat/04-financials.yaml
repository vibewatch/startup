callouts:
  - calloutType: risk
    title: Profitability is not proof of capital sufficiency
    body: >-
      Reported FY25 net profit does not establish operating cash flow, cash on hand or
      runway. Audit disclosures concerning bank submissions and subsidiary funding make
      current lender and intercompany reconciliations a priority diligence item.
    claimRefs: [CI002, CI010, CI011]
