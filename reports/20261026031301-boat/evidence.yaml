evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled financing schedule, fully diluted capitalization table, security classes, conversion terms, and
      secondary-sale history.
    whyItMatters: >-
      Public database totals and historical valuation estimates differ and do not show current ownership or cash
      available.
    diligencePath: >-
      Reconcile the audited financing ledger and cap table with the latest UDRHP and obtain investor-side confirmation
      of outstanding preferences and transfers.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board and committee roster, promoter voting rights, executive reporting lines, and succession
      arrangements.
    whyItMatters: >-
      Founder role transitions are reported, but the evidence does not establish current board oversight or key-person
      dependence.
    diligencePath: >-
      Request the latest board materials, governance policies, current organization chart, and documented succession
      plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: FY26 audited financial statements, cash-flow statement, segment margins, and working-capital reconciliation.
    whyItMatters: FY25 profit and EBITDA are not substitutes for current cash generation, margin durability, or FY26 performance.
    diligencePath: >-
      Obtain FY26 audited statements and monthly management accounts, reconciling them to the final prospectus and
      inventory records.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: customer-metrics
    missingEvidence: Dated active-customer counts, repeat-purchase cohorts, and complaint-closure data.
    whyItMatters: Public evidence does not establish customer durability or distinguish buyers, shipped units, and registered users.
    diligencePath: Request a cohort export with metric definitions, period, deduplication rules, and return/refund treatment.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: spend-based-market-sizing
    missingEvidence: >-
      A transparent India dataset with category-specific annual sales value, ASP by segment and channel, eligible
      customer spend, and a defensible serviceable-share filter for boAt.
    whyItMatters: >-
      Shipment counts and aggregate ASPs do not establish addressable revenue or a realizable SAM/SOM; applying a
      generic consumer-electronics estimate would overstate the opportunity.
    diligencePath: >-
      Obtain full IDC or Counterpoint tables and reconcile them to boAt SKU-level sell-through, net ASP, and channel
      data before constructing a spend-based model.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-and-payer-segmentation
    missingEvidence: >-
      Buyer-panel or transaction evidence by age, income, use case, payer, purchase channel, willingness to pay, and
      replacement or repeat-purchase cycle.
    whyItMatters: >-
      Qualitative brand narratives cannot show who controls the budget, how much customers will pay, or whether adoption
      is expanding beyond early or promotional buyers.
    diligencePath: >-
      Request anonymized customer cohorts and retailer sell-through, then validate segment and price sensitivity through
      a representative India consumer panel.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: category-unit-economics
    missingEvidence: >-
      boAt category-level contribution margins, returns and warranty costs, channel economics, and repeat-purchase or
      retention cohorts.
    whyItMatters: >-
      Without these private operating measures, market growth and reported market share cannot establish customer
      lifetime value, profitable scale, or valuation durability.
    diligencePath: >-
      Review audited segment economics and cohort data by product family and online versus offline channel, including
      promotion and warranty adjustments.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: peer-pricing-and-capabilities
    missingEvidence: >-
      Dated matched-SKU prices, discounts, included features, technical test results, warranty terms, and return rates
      for boAt, Noise, Boult, and global alternatives.
    whyItMatters: >-
      Without comparable commercial and capability evidence, an accessible-price position cannot establish relative
      value, price elasticity, or a defensible performance advantage.
    diligencePath: >-
      Capture same-date SKU and package details across online and offline retailers, then request realized-price,
      warranty, return, and category-level product-test data.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-switching-and-retention
    missingEvidence: >-
      Repeat purchase, customer retention, multi-homing, switching reasons, and complaint-closure metrics by product
