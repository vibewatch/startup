company:
  name: boAt
chapter:
  number: 7
  title: Risks
  summary: Public reporting points to material financial-control and concentration risks, while FY26 profitability improved as revenue and selected expenses declined. Reported warranty complaints and outsourced manufacturing are diligence signals rather than independently quantified operating outcomes; current remediation, legal status, and customer durability remain unverified.
sections:
  - id: controls-and-governance
    title: Financial controls and regulatory readiness
    body: >-
      The clearest high-severity risk is disclosure and control quality ahead of any
      public-market process. Business Standard reports that auditors identified
      mismatches between lender submissions and the books for FY2023–FY2025; NDTV
      Profit separately describes repeated record-keeping lapses over the same
      period. Both also report short-term borrowings used for long-term subsidiary
      requirements and material uncertainty about liabilities at two subsidiaries
      for FY2023–FY2024. These are auditor observations, not proof of fraud or a
      current default. Business Standard says the filing describes corrective
      steps on some matters, but the available sources do not establish complete
      remediation. Until reconciliations, controls testing, and subsidiary
      liquidity evidence are reviewed, public-market readiness remains a material
      residual risk.
    claimRefs: [CR003, CR004, CR005, CR006, CR007]
    tableRefs: [TR001]
  - id: financial-and-concentration
    title: Cost-led recovery and customer concentration
    body: >-
      UnlistedZone's FY2026 analysis reports standalone revenue from operations
      of ₹2,928.08 crore, down 4.4% from FY2025, while profit for the year rose
      43.5% to ₹92.15 crore. The same analysis attributes the improvement partly
      to lower advertising and warranty expense, so the profit increase should
      not be treated as evidence of sustained demand growth or cash generation.
      It also reports that two unnamed customers represented ₹1,692 crore, or
      58% of sales. That is a meaningful concentration signal, but the source
      does not identify the customers or their channel, contract, renewal, or
      payment terms. Inc42's profile displays a separate FY2025 revenue figure
      without stating the accounting basis in the excerpt; reconcile definitions
      before using it as a trend comparator.
    claimRefs: [CR001, CR002, CR008, CR013, CR014]
    tableRefs: [TR002]
  - id: operating-resilience
    title: Supplier, product, and customer-experience exposure
    body: >-
      The FY2026 analysis describes production through contract manufacturers
      and a 50:50 Dixon Technologies joint venture outside Imagine Marketing's
      balance sheet. That asset-light structure can leave execution dependent on
      partner capacity, quality control, and continuity; public evidence here
      does not quantify supplier concentration or alternate-source readiness.
      Altius Investech's undated company profile flags India concentration and
      limited product diversification, but it does not establish a current
      supply interruption. Separately, Dyrect's
      July 2026 article alleges early product failures and a fall in repeat
      purchase, but provides no cohort methodology or denominator and its
      founder promotes a warranty-services business. Treat the assertions as a
      low-confidence signal, not measured company-wide performance.
    claimRefs: [CR009, CR010, CR011, CR015]
    tableRefs: [TR003]
  - id: monitoring-and-diligence
    title: Mitigations, monitoring, and thesis-break tests
    body: >-
      The updated draft prospectus described by ET Edge in October 2025 proposed
      ₹500 crore of fresh issuance and up to ₹1,000 crore of offer-for-sale
      shares, with ₹225 crore of fresh proceeds earmarked for working capital
      and ₹150 crore for brand and marketing. These are dated proposed terms,
      not confirmation of the current transaction or available cash. A practical
      underwriting gate is to obtain current audited lender-to-ledger
      reconciliations, subsidiary-liability support, named-customer revenue and
      contract data, and warranty/return cohorts split by channel. Repeated
      unexplained audit mismatches, persistent concentration without contractual
      protection, or failure to produce reproducible service and retention
      metrics would warrant pausing the thesis rather than assuming management
      controls have closed the risks. The matrix shows evidence gates, not
      probability estimates.
    claimRefs: [CR012, CR016]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Issue
      - Jurisdiction and status
      - Likelihood / severity
      - Mitigation evidence
      - Residual exposure and diligence path
    rows:
      - ["Lender submissions did not match books", "India; auditor observations covered FY2023–FY2025", "Recurrence: unknown; severity: high for listing readiness", "Business Standard reports that the filing described improved reporting accuracy", "High until lender returns are reconciled to audited ledgers and the auditor's follow-up is reviewed"]
      - ["Short-term borrowings used for long-term subsidiary requirements", "India; reported for FY2023 and FY2024", "Current likelihood: unknown; severity: high for liquidity controls", "No specific remediation is established in the reviewed reporting", "Obtain entity-level borrowing schedules, maturity matching, and current lender confirmations"]
      - ["Uncertainty over liabilities at two subsidiaries", "Kaha Pte Ltd and Imagine Marketing Singapore Pte Ltd; FY2023–FY2024", "Current likelihood: unknown; severity: high pending current solvency evidence", "No current resolution evidence in the reviewed sources", "Review subsequent audited accounts, cash support, guarantees, and intercompany balances"]
      - ["Other audit and compliance observations", "Director-remuneration limits, statutory dues, electronic backups, and asset verification were reported in the UDRHP coverage", "Current likelihood: unknown; severity: material", "Business Standard reports shareholder approval for excess remuneration and some reporting improvements", "Confirm each issue's closure with filings, board approvals, dues receipts, and tested India-based backup controls"]
    notes: >-
      Partial register of matters described in Business Standard and NDTV Profit
      coverage of the updated draft prospectus; it is not an exhaustive litigation
      or regulatory search. Risk ratings are analytical judgments, not source-assigned
      scores. Current remediation is not established where stated as unknown.
    enumerationScope:
      coverage: partial
      basis: Publicly reported audit and compliance matters in FY2025 UDRHP coverage; not a complete legal-case inventory.
    claimRefs: [CR003, CR004, CR005, CR006, CR007]
  - id: TR002
    title: Operational, quality, and financial risk register
    columns:
      - Failure mode
      - Evidence and period
      - Likelihood / severity
      - Mitigation maturity
      - Residual exposure and diligence ask
    rows:
      - ["Revenue contraction with cost-led profit growth", "Standalone FY2026 revenue from operations fell 4.4%; profit rose 43.5% as selected expenses declined", "Likelihood: medium; severity: high if cost reductions mask weakening demand", "Cost controls are visible in the reported FY2026 figures; durability is unproven", "Review subsequent revenue, segment contribution, cash conversion, and inventory turns"]
      - ["Customer concentration", "Two unnamed customers accounted for ₹1,692 crore (58%) of sales in the FY2026 analysis", "Likelihood: medium; severity: high if a major customer reduces purchases", "No contract or renewal protections are described in the source", "Identify customers, contract terms, receivables, and current top-customer shares"]
      - ["Product reliability and warranty experience", "Dyrect alleges product failures within 6–7 months and a second-order cohort decline from 42% in FY2021 to 29% in FY2023", "Likelihood: unverified; severity: material if company-wide", "No independently validated warranty or cohort data in the reviewed evidence", "Request claims, repair/replace rates, resolution times, returns, and repeat cohorts by sales channel"]
      - ["Manufacturing and supply continuity", "FY2026 analysis says hardware is made by contract manufacturers and describes a 50:50 Dixon joint venture; Altius flags India concentration and limited diversification", "Likelihood: unknown; severity: material", "Partner structure is reported, but capacity, quality, and alternate-source controls are not evidenced", "Review supplier concentration, service-level agreements, quality escapes, and contingency plans"]
    notes: >-
      FY2026 financial and customer figures are those reported by UnlistedZone,
      which states its company figures are standalone unless otherwise stated.
      Dyrect's warranty and cohort allegations have no disclosed denominator or
      methodology and come from an author promoting warranty services; they are
      diligence leads, not verified rates.
    claimRefs: [CR001, CR002, CR008, CR009, CR010, CR011, CR013, CR015]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Disclosed role or exposure
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - ["Contract manufacturers and Dixon joint venture", "UnlistedZone says contract manufacturers make the hardware and a 50:50 Dixon joint venture handles the Make in India element", "Capacity, quality, or partner disruption affects production or deliveries", "High operational relevance; probability not quantified", "Verify supplier concentration, contractual remedies, ownership of tooling, and alternate capacity"]
      - ["Two largest customers", "UnlistedZone reports two unnamed customers accounted for 58% of FY2026 sales", "A lost or repriced relationship materially reduces revenue or delays cash collection", "High concentration exposure; counterparty-specific risk unknown", "Obtain customer identities, contract renewal dates, payment performance, and channel mix"]
      - ["Public-market funding and offer execution", "ET Edge reports proposed 2025 UDRHP terms of ₹500 crore fresh issue and up to ₹1,000 crore OFS", "Delay or repricing changes planned working-capital and marketing funding", "Material; current transaction status and cash runway are unverified", "Reconcile current filing, use-of-proceeds plan, and runway without treating proposed proceeds as cash available"]
    notes: >-
      The available material does not identify the two largest customers or
      establish that they are marketplaces. The IPO terms are proposals reported
      from the October 2025 UDRHP, not verified current terms.
    claimRefs: [CR008, CR009, CR012, CR015]
figures:
  - id: FR001
    title: Qualitative risk heatmap
    type: matrix
    summary: Qualitative impact and mitigation signals distinguish reported risks from unverified likelihood and remediation.
    data:
      columns: ["Likelihood", "Impact", "Mitigation maturity"]
      rows:
        - label: Audit and reporting controls
          values: ["Not quantified", "High for listing readiness", "Partial actions reported; closure unverified"]
        - label: Subsidiary liquidity
          values: ["Unknown after FY2024", "High if liabilities remain unsupported", "No current resolution evidence"]
        - label: Customer concentration
          values: ["Not quantified; two customers were 58% of FY2026 sales", "High if a major relationship changes", "Contracts and renewals undisclosed"]
        - label: Manufacturing dependency
          values: ["Not quantified", "Material to production continuity", "Alternate-source controls not evidenced"]
        - label: Product reliability and warranty
          values: ["Unverified; one commercially interested source", "Material if company-wide", "Claims and retention cohorts not independently validated"]
        - label: Cost-led profitability
          values: ["Not quantified; FY2026 revenue declined", "High if cost cuts mask weaker demand", "Expense reductions reported; durability unproven"]
    approximationNotes: Qualitative analyst triage from assigned public evidence; likelihood is unquantified and categories are not benchmark scores.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR008, CR009, CR010, CR011, CR016]
