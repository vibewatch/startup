company:
  name: boAt
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    boAt is a consumer-electronics brand spanning personal audio and wearables, with
    secondary reporting emphasizing brand-led positioning and outsourced manufacturing.
    Public evidence in this assigned source set is much stronger on product categories
    and market position than on product-level architecture, reliability, security,
    certification, or manufacturing controls.
sections:
  - id: portfolio
    title: Product portfolio and maturity
    body: >-
      The reviewed material describes boAt as a consumer-electronics portfolio rather
      than a single software product: audio devices range from wired and wireless
      earphones to TWS, headphones, speakers and soundbars, alongside smartwatches and
      accessories. CompanyCheck lists specific models including Airdopes 181 Pro,
      Rockerz 255 Pro+, Storm Call 3 Plus and Stone 350, but its profile does not
      establish current sales, installed base or model-level lifecycle status. IDC's
      2Q25 tracker separately identifies boAt across overall wearables, TWS, over-ear
      audio and smartwatches, giving independent category-level evidence of active
      market presence. The product matrix therefore distinguishes reported
      availability from verified maturity, product outcomes and proprietary
      differentiation; those deeper measures are not established by the retained
      sources.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: use-cases
    title: Customer workflows and feature claims
    body: >-
      Public descriptions map the range to familiar consumer jobs: listening on the
      move, portable or home audio, smartwatch-based notifications and health tracking,
      and gaming audio. These are plausible use cases for the named device classes,
      not evidence of measured customer benefit. Altius describes features including
      active noise cancellation, low latency, Bluetooth calling and AMOLED displays;
      StartupTalky lists wireless speakers, earbuds, headphones and earphones in its
      product overview.
      Neither source supplies independent test results, compatibility matrices,
      battery-life protocols, health-sensor accuracy, latency measurements or field
      reliability data. The workflow table records the described function alongside
      what remains unverified, avoiding conversion of marketing feature language into
      a performance benchmark.
    claimRefs: [CE003, CE006, CE007, CE012, CE013]
    tableRefs: [TE002]
  - id: operating-model
    title: Engineering and operating model
    body: >-
      Neoma Capital's August 2026 research characterizes boAt's strength as branding,
      marketing and distribution rather than proprietary manufacturing technology,
      and describes reliance on third-party contract manufacturers, predominantly
      in China. These are secondary-source descriptions, not audited disclosures of
      engineering headcount, supplier concentration or factory controls. Separately,
      Inc42 reported that Imagine Marketing signed an agreement to acquire KaHa/Cove
      and outlined design, firmware, algorithm and mobile-app capabilities intended
      to augment wearables. The available material does not establish how much of
      that capability is currently deployed in shipping products. The architecture
      exhibit is consequently a map of reported product and capability layers, not
      a verified bill of materials or software architecture.
    claimRefs: [CE008, CE009, CE010, CE011, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: proof-gaps
    title: Product proof, trust and diligence limits
    body: >-
      IDC's market data provides useful external context but not product-level
      validation: in 2Q25 it reported category contractions alongside boAt's vendor
      shares, without testing device quality or customer outcomes. The retained
      company and secondary descriptions do not provide a comparable public record
      for deployment reliability, support resolution, returns, warranty cost,
      safety testing, privacy/security controls or product certifications. Nor does
      this pool contain a public developer-signal or practitioner-community proxy;
      for this consumer-hardware business, recruiting, engineering talks or
      integration-partner evidence would be more relevant than software repository
      activity. These absences are evidence gaps, not proof that controls or
      incidents do not exist. Diligence should request current product specifications,
      reliability and service cohorts, test/certification records, security ownership,
      and supplier/quality-control detail.
    claimRefs: [CE005, CE013, CE014, CE015]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module or product family, User and status evidence, Reported differentiation, Diligence gap]
    rows:
      - [Personal audio, "Earphones, headphones and TWS are described as offered products; IDC tracked boAt in earwear in 2Q25.", "ANC and low-latency features are described by a secondary overview; independent product tests are not provided.", "Confirm current SKUs, lifecycle status, technical specifications and model-level sales."]
      - [Wearables, "Smartwatches appear in the company profile and IDC's vendor tracking; current deployment by model is not disclosed here.", "Bluetooth calling, health tracking and AMOLED displays are listed in secondary product descriptions.", "Request sensor accuracy, supported platforms, software-update policy and active-use data."]
      - [Speakers and home audio, "Portable speakers and soundbars appear in secondary portfolio descriptions.", "The sources identify product categories but do not substantiate audio-quality or durability comparisons.", "Request model specifications, warranty/return cohorts and independent acoustic tests."]
      - [Gaming and mobile accessories, "Gaming headsets and peripherals, chargers and cables are included in secondary portfolio descriptions.", "Low latency is a reported feature claim; no benchmark or interoperability matrix is supplied.", "Verify current product availability, compatibility and category-level economics."]
      - [Cove / KaHa capabilities, "Inc42 reported an agreement to acquire KaHa/Cove; current integration into shipping products is not established.", "The report describes design, firmware, algorithms and Android/iOS applications as capabilities intended to augment wearables.", "Confirm transaction/integration status, IP ownership, shipped implementations and ongoing support."]
    notes: >-
      Product and capability descriptions come from CompanyCheck, Altius, Neoma
      Capital, IDC and Inc42; statements are not a complete current SKU inventory.
      “Not disclosed” means absent from the assigned sources, not absent in the
      company. Secondary feature claims are not independent test results.
    claimRefs: [CE002, CE003, CE007, CE011, CE012]
  - id: TE002
    title: Workflow and use-case evidence
    columns: [User job, Current workflow, Reported boAt solution, Measurable benefit and limitation]
    rows:
      - [Listen while mobile, "Use wired or wireless earphones/headphones for personal audio.", "The portfolio includes earbuds, headphones and TWS products.", "No comparative sound, ANC, battery-life or comfort test is present in the assigned sources."]
      - [Track activity and stay reachable, "Use a smartwatch for health-tracking functions and calls.", "Secondary product descriptions list health tracking and Bluetooth calling.", "No sensor-accuracy, call-quality or sustained-use evidence is provided."]
      - [Choose a personal-audio format, "Select among wireless speakers, earbuds, headphones or earphones for listening.", "StartupTalky lists these product categories in its overview.", "The source provides no comparative performance or customer-outcome evidence."]
      - [Play games with responsive audio, "Use a gaming headset or other low-latency audio device.", "A secondary company overview lists low latency among feature examples and gaming headsets in the portfolio.", "No latency benchmark, supported-game list or independent user test is available."]
    notes: >-
      Use cases synthesize source-described products and features; no quantified
      customer benefit is inferred. Claims about features remain company/product
      descriptions unless independently tested.
    claimRefs: [CE003, CE006, CE007, CE012]
  - id: TE003
    title: Technology and operating architecture evidence
    columns: [Layer or process, Reported role, Dependency or risk, Evidence limit]
    rows:
      - [Product positioning, "Neoma Capital says the company's strength is in branding, marketing, and distribution, not proprietary manufacturing technology.", "Brand-led differentiation may not create a proprietary technology advantage.", "No audited engineering organization, R&D spend, design ownership or technical roadmap is supplied."]
      - [Device functions, "Secondary descriptions cite ANC, low latency, Bluetooth calling, AMOLED displays and navigation features.", "Features vary by SKU and may rely on third-party components or software.", "No bill of materials, firmware map, benchmark, compatibility test or update policy is supplied."]
      - [Wearable software and IP, "Inc42 reported KaHa/Cove capabilities spanning design, firmware, algorithms and Android/iOS applications.", "The report does not establish current integration, IP transfer scope or ongoing dependence on the acquired team.", "Confirm completed integration and identify live products using these capabilities."]
      - [Manufacturing and quality, "Neoma Capital says production relies on third-party contract manufacturers, predominantly in China.", "Supplier concentration, cross-border logistics and outsourced quality controls require verification.", "No supplier list, audit results, defect rates, certifications or traceability data are provided."]
    notes: >-
      This is an evidence map, not an independently verified architecture diagram.
      Product-positioning and manufacturing descriptions are attributed to secondary
      research; missing details are diligence requests rather than assumed controls.
    claimRefs: [CE008, CE009, CE010, CE013]
