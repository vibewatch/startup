    nrrPct: null
    totalRaisedUsdM: null
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      boAt holds substantial reported shares in Indian wearables and TWS categories, with IDC reporting growth in its
      overall-wearables share between 2023 and 2024.
    - >-
      Public reporting indicates FY2025 profitability after losses in the preceding two reported fiscal years, although
      cash conversion remains unproven.
    - The brand spans audio, wearables, and accessories and is distributed through online and offline channels.
  topRisks:
    - >-
      Auditors reportedly identified lender-submission and bookkeeping mismatches across FY2023–FY2025, alongside
      subsidiary-liability and borrowing-use concerns.
    - >-
      A FY2026 analysis reports that two unnamed customers represented 58% of sales, while public evidence does not
      disclose their identities or contract terms.
    - >-
      Wearable-device shipments contracted in 2024 and 2025, and product commoditization and pricing pressure could
      limit durable margins.
    - >-
      Final IPO pricing, current capitalization, cash generation, and remediation evidence are not sufficiently
      established for an entry valuation.
  unresolvedGaps:
    - >-
      Obtain current audited lender-to-ledger reconciliations, subsidiary-liability support, and evidence that disclosed
      control concerns have been remediated.
    - >-
      Reconcile operating cash flow, working-capital needs, inventory turns, net debt, and cash conversion to reported
      earnings.
    - >-
      Obtain product- and channel-level contribution margins, including returns, warranty costs, discounts, and
      customer-acquisition costs.
    - >-
      Identify the two reported concentrated customers and review their channel, contract, renewal, and payment terms;
      obtain representative repeat-purchase and complaint-closure data.
    - Review final IPO terms and a fully diluted cap table before assessing valuation, dilution, or preference overhang.
