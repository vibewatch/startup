  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Prove 的市场不应定义成整个网络安全，甚至也不应定义成整个
              IAM。更窄也更可辩护的边界，是用于高信任数字交互的身份核验和认证基础设施：企业必须判断一个人是否真实、在场，并且可以安全交易。这个边界包括开户、账户开立、无密码或低摩擦登录、高风险交易批准、账户恢复、呼叫中心身份核验，以及仍与身份绑定的生命周期欺诈防控。Prove
              当前平台语言支撑这种框定，因为它把验证、认证、监控和欺诈策略合在一起，而不是只卖一个纯证件步骤。


              被排除的类别同样重要。纯边界 IAM、通用反恶意软件、只做交易的欺诈工具，以及没有可复用身份上下文的独立证件采集，都只是相邻而非同类。宽泛 IAM 市场仍会影响竞争侵入，尤其是 Okta/Auth0 这类
              CIAM 厂商向外部用户认证推进时，但不应计入 Prove 的直接 TAM。这个区分能让后续估值工作更诚实，也避免把公司放进一个不现实、没有形状的超大市场里承销。
