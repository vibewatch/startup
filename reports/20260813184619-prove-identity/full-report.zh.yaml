  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: 最强的公开里程碑显示，Prove 从 Payfone 时代起步，走向 2026 年具有独角兽画像的身份平台。
    data:
      items:
        - date: '2008'
          label: Payfone 创立
          detail: 经营脉络从这里开始
          tone: positive
        - date: '2015'
          label: Trust Score / SIM 换卡发布
          detail: 欺诈与声誉信号成为核心
          tone: positive
        - date: '2017'
