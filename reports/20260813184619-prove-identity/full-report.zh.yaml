  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Prove
              的公开证据足以让投资者认真关注。它身处庞大且增长中的身份核验和认证市场，有差异化的以手机号为中心的信任叙事，并展示了对私营公司来说异常具体的具名客户证据。这些正面因素重要。它们说明公司具有战略相关性，而不是纯投机。在拥挤的身份市场里，这已经是一个有意义门槛：许多厂商都能描述品类机会，但能拿出具名银行和工作流级证据，并配有可衡量运营结果的更少。


              但战略相关性不等于明确买入。反向逻辑很直接：公开记录在决定价格的运营指标上仍太薄。没有经审计收入，没有公开现金或烧钱速度，没有留存披露，也没有清晰集中度数据。这让价格敏感的建议不可避免。基于公开证据，正确判断因此是继续研究或观察：保持跟进，但不要只凭叙事承销溢价。这个区别重要，因为许多强风险投资支持的基础设施公司值得密切跟踪，即便它们在隐含标记下还不值得买入；在安全和身份品类尤其如此，叙事往往跑在披露的运营数据前面。
