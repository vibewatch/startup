      - number: '7.2'
        title: 运营与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Prove 依赖快速、准确且持续可用的身份信号。这既是产品核心强项，也是核心脆弱点。运营商 / MNO 输入、设备信号、API
              可靠性和实时评分质量，都必须足够好，让客户能减少摩擦而不抬高欺诈损失。审阅材料显示，公司有意缓释 SIM
              换卡、社会工程和账户接管风险，但没有提供公开可用性报告或详细失效模式披露。这让外部很难判断：当某个信号源消失或欺诈模式突然变化时，系统是否会优雅降级。


              依赖风险同样重要。Prove 依赖运营商质量数据、客户输入质量，也依赖 AWS 和 Amazon Connect
              等更广泛云或生态关系。任何依赖退化，都可能在客户最需要系统隐形且可靠的时刻，迅速表现为通过率下降、更多 OTP
              回退或更弱客户结果。这就是为什么公开可靠性不透明很重要：最严重的失效模式很容易描述，但从公司外部还不容易衡量。
