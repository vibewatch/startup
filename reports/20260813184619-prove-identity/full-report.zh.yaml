      - number: '7.3'
        title: 财务、执行与投资逻辑击穿风险
        blocks:
          - type: paragraph
            body: >-
              公开财务风险图景更多由缺失项定义，而不是由披露项定义。当前没有公开现金、烧钱速度、现金跑道、留存或定价兑现数据。投资者因此无法判断公司能吸收多少运营压力，也无法判断如果更广的身份栈补上差距，定价会有多韧性。客户价值中有多少来自少数旗舰项目、有多少来自小型部署长尾，外部可见度也有限，这进一步放大了不确定性。Sacra
              的悲观论点在这里相关，因为它框定了一种战略风险：移动信任差异化最终变成更商品化平台市场中的一层。


              执行宽度又增加一层风险。Prove 一边支持受监管核心产品，一边扩展到服务、bot 防御和 AI
              智能体信任。如果公司排序得当，这可能变成真实优势；如果新项目跑在客户证据前面，也可能分散焦点。公司同时追逐的行业和工作流变体越多，路线图纪律和产品排序就越重要。正确回应不是直接否定公司，而是在承销溢价估值或高置信上行情景之前，定义硬监控指标和击穿标准。这种纪律很重要。换句话说，只有尽调过程把这些定性风险叙事转化为可衡量运营阈值，Prove
              才看起来可投资。
