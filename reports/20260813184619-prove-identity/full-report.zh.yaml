      - number: '1.3'
        title: 融资历史、估值锚点与里程碑
        blocks:
          - type: paragraph
            body: >-
              最干净的公开融资锚点是 2023 年 10 月那轮融资。TechCrunch 报道融资 $40 million，估值超过 $1 billion；Tracxn 则记录了一轮约 $43.9 million 的
              Series F，投后估值 $1 billion。两个来源足够一致，可以把 2023 年末视为最后一个强证据支持的新股估值事件。更早的里程碑同样有意义：2020 年更名伴随 Apax Digital 领投的
              $100 million 投资，以及帮助公司重新定位为更广义数字身份平台的战略收购。官方时间线随后补上产品里程碑，例如 2015 年的 Trust Score、2017 年的 Pre-Fill，以及 2019 年
              Prove Identity Network 的开发。


              资本历史的注脚在于累计融资。Tracxn 和 GetLatka 分歧很大，一个指向约 $268
              million，另一个明显更低。由于这些追踪器方法不够透明，单靠公开证据无法调和，后续财务工作应把累计融资视为方向性较大，但精确数额未定。今天更有支撑的投资结论更窄：Prove
              是一家后期、仍未上市的身份公司，有清晰的 $1 billion+ 新股估值锚点，也有可信证据显示它在 2026 年仍具相关性。
