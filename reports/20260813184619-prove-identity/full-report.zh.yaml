      - number: '3.3'
        title: 定价不透明、切换成本与分销能力
        blocks:
          - type: paragraph
            body: >-
              这一品类的公开定价普遍薄弱。审阅过的大多数厂商页面都把买方推向联系销售或合作伙伴主导流程，而不是公开清晰的自助价目表。这让外部很难只凭公开来源比较总定价权。它也意味着，分销和实施速度比一张标价表更重要。Prove
              的合作伙伴计划、Temenos marketplace 存在感和渠道信息表明，管理层正在借助嵌入式分销，更高效触达受监管买方。


              切换成本真实存在，但可能不是绝对。一旦 Prove 接入开户、恢复和欺诈策略，就有一定工作流深度和数据历史可守。但多供应商并用仍然可行，因为企业常把
              CIAM、证件、消息和欺诈编排等独立系统打包在一起。最佳解读是，Prove 的切换成本可能高于商品化 API，低于一整套全覆盖企业身份套件。这个中间地带让竞争仍然持续。
