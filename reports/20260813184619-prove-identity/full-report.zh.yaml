      - number: '2.4'
        title: 约束、碎片化与未解问题
        blocks:
          - type: paragraph
            body: >-
              市场显然真实，但并不轻松。Mordor 列出的制约因素——监管碎片化、deepfake 升级、集成成本和数据主权问题——值得认真对待。以手机号为基础的身份还带有品类特有的质疑：如果电话号码被用作持久标识符，SIM
              换卡、号码回收、电信欺诈和运营商流程弱点就会成为风险模型的结构性部分。这就是为什么本章需要纳入反向第三方来源。它们不会推翻这个品类，但会说明买方为什么可能要求比产品营销暗示更多的旁证。


              碎片化有两面。Mordor 认为没有单一供应商控制超过 15% 的收入，这意味着聚焦型新进入者和 Prove
              这样的专门方法仍有空间。但这也意味着公司必须同时防守多组重叠对手：以证件为中心的专门厂商、垂直整合的风险平台、以电信为中心的验证方，以及 CIAM
              既有厂商。最大未解问题是精度。公开来源足以显示市场吸引力，但仍太弱，无法高置信度揭示 Prove 特定 SAM、定价或可能拿到的份额。
