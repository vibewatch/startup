      - number: '8.3'
        title: 可比公司、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              可比公司集有帮助，但今天在这里只能适度使用。Okta 和 Twilio
              等公开身份与通信可比公司，可以框定投资者如何看待软件经济性与用量驱动基础设施经济性，但二者都不是干净的一对一匹配。市场增长报告也支持强劲的品类顺风，但 TAM
              不能替代持久经济性的证据。大市场可以支撑有吸引力的结果，也可能吸引更多竞争和比证据基础更丰富的定价。私营公司追踪器适合用于时间线和市场背景，不适合用来放行价格。


              退出准备度看起来有希望，但不完整。Prove
              持续的市场存在、行业内容、活动参与和客户证据，支持它是一个严肃的品类资产，而不是安静的小众供应商。不过，最终尽调负担仍高。投资前，投资者需要故事背后的数学：经审计财务、留存、模块扩张、集中度、运营商依赖和商业条款。对纪律型投资者来说，这个负担在这里不可回避。在那之前，审慎估值立场是，假设叙事溢价中有一部分应因信息缺失而折价。这并不意味着公司缺乏上行；它意味着上行应靠尽调证据挣出来，而不是在入场价里预设。
