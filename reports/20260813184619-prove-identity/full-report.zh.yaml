  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局、相邻领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              Prove 身处拥挤的数字身份格局，但拥挤并不等于同质。直接重叠集合包括 Jumio、Entrust/Onfido 等身份核验专门厂商，也包括 Socure 这类更宽的身份与风险平台。相邻重叠来自
              Telesign，它在多渠道验证和运营商交付上更强；也来自 Okta/Auth0，它们从 CIAM 和无密码认证切入，而不是从以手机号为根的证明切入。替代集合同样重要：许多企业仍把
              OTP、KBA、人工审核和独立欺诈工具拼在一起，而不是采购一个一体化平台。


              这意味着 Prove 并不在赢家通吃市场里竞争。买方可以多供应商并用、打包，或把部分工作流留在内部。这个现实应压低任何简单护城河说法。与此同时，碎片化对 Prove
              并非天然坏事。它可能帮助聚焦型供应商拿下定义很窄的工作流——那里低摩擦和移动信任比通用企业身份栈更重要。
