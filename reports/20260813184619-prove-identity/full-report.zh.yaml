  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 最高剩余风险集中在监管、运营商依赖和不透明运营证据的交叉处。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
