  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Prove 切入身份密集场景，并可沿客户生命周期扩张。
    data:
      nodes:
        - id: j1
          label: 潜在客户 / 申请人
          detail: 手机号输入、预填、身份验证
        - id: j2
          label: 已开户用户
          detail: 认证绑定、信任评分、账户访问
        - id: j3
          label: 服务 / 找回
          detail: 找回、呼叫中心认证、联系方式补全
        - id: j4
          label: 持续信任
          detail: 高风险交易、欺诈检查、扩张模块
    claimRefs:
      - CU001
      - CU015
      - CU019
      - CU020
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 具名客户故事显示，路径通常从欺诈或摩擦痛点开始，再进入生产部署和模块扩张。
    data:
      nodes:
        - id: a1
          label: 高摩擦或高欺诈工作流
        - id: a2
          label: 以手机号为中心的身份试点 / 评估
        - id: a3
          label: 在开户或找回场景生产部署
        - id: a4
          label: 可衡量结果（转化、欺诈、支持）
        - id: a5
          label: 可能扩展到更多工作流
      edges:
        - from: a1
          to: a2
        - from: a2
          to: a3
        - from: a3
          to: a4
        - from: a4
          to: a5
    claimRefs:
