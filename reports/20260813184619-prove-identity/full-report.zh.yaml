  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与货币化机制
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一个多模块收入模型，围绕身份核验、开户、认证和欺诈决策事件搭建。Prove 的产品集覆盖 Pre-Fill、Identity Verify、Unified Auth、AirKey、Human
              Assurance 和 Identity Manager，强烈暗示收入绑定工作流用量，而不是单一整体订阅。审阅过的页面反复围绕申请开始、登录、账户恢复、欺诈决策和高风险交易来描述价值——这些单位天然适合 API
              或按交易计费。


              与此同时，公开足迹看起来偏企业销售，而非自助。审阅页面上没有广泛可访问的价目表，银行和市场平台定位也暗示会采用协商式、按账户打包。最佳解读是，Prove
              可能结合最低承诺、模块打包和按事件计费，但具体组合并不公开可见。这一不确定性很重要，因为它留下了关键问题：收入中有多少是经常性最低承诺软件支出，有多少是波动型事件量。如果用量集中在少数客户工作流，或绑定波动的欺诈事件，收入画像可能比通用
              SaaS 倍数暗示的更颠簸。这也意味着，表面上的平台宽度未必已经转化为同样宽的收入；有些模块今天可能仍主要是扩张选项，而不是有实质规模的独立业务线。
