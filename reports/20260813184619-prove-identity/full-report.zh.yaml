      - number: '8.2'
        title: 估值背景与情景
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据给 Prove 估值，最难之处在于已知估值锚点和已知运营锚点精度不匹配。TechCrunch 给出一个硬的 2023 年融资锚点，估值超过 $1 billion。AInvest 给出更软的 2025
              年估计，接近 $1.93 billion。GetLatka 给出方向性收入估计，约 $63
              million。这些输入足以搭建情景，但不足以认可一个精确入场价。因此，纪律不在于假装知道小数点级公允价值，而在于识别哪些证据能让区间收窄。


              如果收入估计方向正确，2023 年硬标记和 2025
              年软标记之间隐含的倍数区间已经不便宜。这不意味着公司缺乏吸引力；它意味着现在的上行很大程度取决于私有尽调对留存、利润率、集中度和附加购买揭示什么。正确纪律是使用乐观、基准和悲观情景，而不是今天押注一个英雄式单点估计。当一个数据点是定价轮，另一个是软追踪器标记，而两者之间的运营桥梁对投资者仍不完整时，情景框架尤其重要。
