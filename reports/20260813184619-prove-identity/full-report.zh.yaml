  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              Prove 处在法律敏感的运营区域，因为它代表企业客户处理个人信息、手机号关联身份数据、制裁 / PEP 检查和其他受监管信任信号。公开材料明确表示，客户负责同意或通知，Prove
              则强调隐私权利、最小化，以及大多数实时客户提交数据的有限留存。这是正面的缓释叙事，但也凸显了失败最要命的地方：隐私法执行、制裁筛查准确性，以及客户向用户承诺的内容与底层系统实际行为之间的错配风险。在信任基础设施中，小的政策或实施缺口可能变成大的商业问题，因为客户采用这些工具正是为了避免声誉损害。


              审阅记录没有确认 Prove 自身直接获得 FedRAMP 授权。如果政府不是核心市场，这不伤害当前商业论点；但如果公共部门扩张是上行情景的一部分，它就会变成真实阻碍。投资者还应注意，Prove
              通过服务条款语言严密控制其文档和比较分析，这可以理解，但限制了轻松的外部验证。因此，在任何严肃承销中，法律和技术尽调必须协同推进，而不是两张分开的清单。
