      - number: '1.4'
        title: 画像缺口、指标冲突与尽调提醒
        blocks:
          - type: paragraph
            body: >-
              Prove 的公开画像足以支撑后续章节，但不足以抹掉不确定性。员工数最典型。GetLatka 估计为 573 人，Tracxn 给的是更宽的 200-499 公司区间，只在若干法律实体上给出更具体计数。2023
              年新股轮之后的收入和估值估计也呈现同样模式：有方向性信号表明公司已经增长，并可能在二级市场式模型中升值，但这些应作为低置信度背景，而不是硬封面事实。


              另一个重要缺口是政府级安全姿态。尽管更广泛市场有 FedRAMP 和公共部门动能，本次审阅的来源集没有给出 Prove 自身已获 FedRAMP
              授权的直接证据。这一缺失应视为尽调点，不能从一般身份行业趋势里静默假设出来。再加上公开董事会控制披露有限、累计融资的追踪器总额冲突，这些缺口意味着第 1
              章可以自信确立身份、规模和时间线，但还不能给出承销所需的每一项指标。
