        title: 领导层班底与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Rodger Desai 仍是关键人物和重心。他是创始人兼首席执行官，公开证据也把公司历史和当前产品叙事都系在他的领导上。不过，领导层页面显示，运营班底比“只有创始人”的故事更厚。Prove
              披露了负责财务、产品、客户运营、法务、人力、营收和业务发展的具名高管，足以支持一个判断：这家公司已有制度化管理层，而不是单一产品初创团队。可见的外部领导层名单也重要：Opus Capital、Apax
              Digital、Relay Ventures、TransUnion 和 MassMutual Ventures 的代表仍公开关联在公司的董事会或领导层界面上。


              正式治理仍不透明。公开材料没有解释委员会结构、投票控制权、二级所有权变化，也没有说明当前董事会代表是否与可见领导层名单完全一致。对后期私营公司来说，这并不罕见，但很重要。成长型投资者可以从公开来源确认 Prove
              有真实高管和可信背书方，却无法在没有直接尽调的情况下推断硬性控制权或接班准备度。
