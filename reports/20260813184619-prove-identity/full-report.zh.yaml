      - CU016
      - CU017
      - CU020
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: 最强客户证据来自具名部署和量化结果，但整体留存可见度仍弱。
    data:
      columns:
        - 具名客户
        - 量化结果
        - 生产部署清晰度
        - 留存可见度
        - 交叉销售证据
      rows:
