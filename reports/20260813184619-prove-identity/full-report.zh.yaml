      - number: '6.3'
        title: 持久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              公开证据在持久性上远弱于初始采用。没有公开
              NRR、GRR、流失或续约披露，也没有按头部客户或头部垂直划分的清晰集中度数据。即便如此，工作流本身暗示有一定粘性，因为嵌入开户、恢复和欺诈流程的供应商并不容易替换。最佳扩张逻辑也可信：客户可以从开户或验证开始，然后逐步增加认证、服务或其他信任模块。从这个意义上，客户章节支持更广的平台论点，尽管今天仅靠公开数据还不能完全证明货币化深度。


              关键风险是，强银行参考可能掩盖经济集中度。Prove 可能有很多 logo，却仍从较少数大型企业项目中获得大部分价值。这很重要，因为失去一两个大型项目可能同时打击收入和被感知的市场可信度，把下行放大到远超
              logo
              数本身。公开客户证据因此支持平台的商业相关性，但还不能证明收入基础的韧性或多元化。这就是证明产品市场匹配和证明组合级客户经济性的区别。对投资者来说，下一步是把这组有说服力的证据转化为队列、续约和集中度数学。
