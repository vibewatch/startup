chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台范围和规模信号
        blocks:
          - type: paragraph
            body: >-
              Prove Identity 应视为原 Payfone 业务的现代运营名称。公开演进脉络最清楚的一条，从 2008 年创立，到 2020 年伴随新资本和战略收购的更名，再到 2023 年把公司估值重新推回 $1
              billion 以上的融资事件。这条弧线重要，因为它解释了 Prove 为什么不再把自己讲成一个狭窄的运营商计费或一次性认证工具。现在的平台叙事更宽：Prove
              用源自手机号的身份、设备和欺诈信号验证用户、认证老客户，并在开户和敏感生命周期事件中管理风险。


              公开规模信号有分量，但必须把时间戳处理清楚。官方和合作伙伴材料支撑了当前叙事：2,500+ 家公司、美国前 20 大银行中的 19 家、2.5B+ 已知身份，以及 30B+ 年度认证；TechCrunch
              则保留了一个更低的 2023 年时点快照，大约 1,000 家企业客户和美国前 10 大银行中的 9 家。两者合在一起指向真实增长，但也意味着后续章节应区分当前营销说法和较早历史快照，不能压平成一个永恒指标。
