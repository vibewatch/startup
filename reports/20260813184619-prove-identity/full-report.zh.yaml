      - number: '4.3'
        title: 资本充足性与承销缺口
        blocks:
          - type: paragraph
            body: >-
              2023 年 10 月那轮是最硬的公开锚点。TechCrunch 报道融资 $40 million、估值超过 $1 billion，并称管理层计划投资市场扩张、新产品和 AI
              相关身份能力。这支持一个判断：Prove 仍能获得成长资本，投资者信心也还在。但它没有回答今天真正影响承销的关键问题：手头现金、烧钱速度、现金跑道、客户集中度、留存或分产品利润率。


              这个区别很重要。私营公司上一轮可以很亮眼，但如果当前运营数据不可得，仍很难承销。Prove
              的情况中，最大公开阻碍不是缺少战略叙事，而是缺少经审计财务和核心私营公司运营指标。公开证据也不足以厘清收入在头部银行、金融科技公司或大型合作伙伴之间有多集中；这很关键，因为一家以手机号为基础的身份公司可能从
              logo
              数看似分散，却在经济上依赖较少数的大型项目。集中度问题不仅影响下行风险，也影响续约时的谈判杠杆，以及遭遇客户或市场冲击时的销售计划韧性。审慎立场是，公开证据支持一个有前景的财务模型，但不足以在精确价格上完成完整承销决定。
