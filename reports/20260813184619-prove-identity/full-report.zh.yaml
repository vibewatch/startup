      - number: '2.2'
        title: 规模测算视角、买方组合与可服务楔子
        blocks:
          - type: paragraph
            body: >-
              保留的公开市场估计方向一致，即便不足以证明一个精确 TAM。Mordor 将身份核验市场放在 2026 年 USD 15.78 billion，此前 2025 年基数为 USD 14.19 billion。FMI
              给出的 2026 年身份核验数字几乎相同，为 USD 14.1 billion，并把曲线延伸到 2036 年 USD 42.8 billion。MarketsandMarkets 把该品类框定为 2025 年
              USD 14.34 billion、2030 年 USD 29.32 billion。这些数字足够接近，可以说市场有实质规模；但差异仍足够大，报告应保留区间，而不是挑一个假精确的中点当成事实地基。


              可服务楔子比标题数字更重要。BFSI 在 Mordor 和 FMI 中都约占需求的三分之一，云交付占主导，大型企业拿走大部分份额。这指向一个市场：受监管银行、金融科技公司和其他规模化数字业务比长尾 SMB
              更重要。当游戏、医疗、加密和市场平台买方需要快速数字转化且不想被人工审核拖慢时，Prove 的楔子也会延伸进去。
