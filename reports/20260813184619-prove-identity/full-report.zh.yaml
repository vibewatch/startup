  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Prove 不只是一个身份核验 API。公开界面现在描述的是更宽的信任平台，覆盖开户、身份核验、无密码或低摩擦认证、账户开立、持续服务、bot 防御、可复用身份，甚至更新的 AI
              智能体商业原语。这种宽度重要，因为它改变了投资者看待产品成熟度的方式：最老的部分似乎是身份核验、Pre-Fill 和认证，而最新可见延伸包括 Human Assurance 和 Agentic Suite。


              这张模块地图也澄清了商业模式。Prove
              围绕具体工作流任务搭建，而不是围绕抽象安全品类。账户开立、认证并交易、信任与安全、合规、数字资产和医疗开户，都显示同一底层信任层被打包给不同买方痛点。这个模式比一个泛泛首页更能证明平台真实存在。它也暗示产品管理正在围绕可复用信任原语组织公司，这些原语可以跨行业重新组合，而不是为每个
              logo 从头重建。身份软件里这种架构模式尤其重要，因为底层信任检查相似，但买方问题会因工作流不同而变化。战略上这很有吸引力，因为它应能缩短进入新垂直领域的时间，即便每个新细分仍需要一些策略、数据和工作流调校。
