      - number: '4.2'
        title: 牵引力代理、客户 ROI 与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开收入记录很薄，但运营价值主张更容易看清。Temenos 和 Alloy 都把 Prove 描述为提升批准率、降低放弃率、减少欺诈的工具；Identity Manager
              声称可以减少呼叫中心处理量，并提高登录通过率。对银行、金融科技公司和市场平台来说，这些都是有经济意义的结果。Prove 自己的平台页面还声称有 2.5B 已知身份和 30B
              年度认证；如果方向上正确，这描述的是一个庞大的活动基数，适配用量挂钩的货币化。


              可能的成本结构也更像软件加数据，而不是资本密集型业务。没有硬件制造或库存迹象。相反，利润率应取决于运营商和第三方数据成本、云 / API
              基础设施、欺诈模型维护以及企业支持。这仍可能产生有吸引力的毛利率，但不一定具备纯按席位 SaaS
              厂商那种干净经济性。关键尽调问题是，数据和运营商输入是否大致随用量线性扩张，还是定价杠杆和模型复用会在规模上升时扩大贡献利润率。没有这个答案，投资者无法负责任地承销最终利润率天花板。
