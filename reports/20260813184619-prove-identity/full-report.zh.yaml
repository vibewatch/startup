      - number: '5.2'
        title: 架构、部署与依赖
        blocks:
          - type: paragraph
            body: >-
              从公开材料看，最可辩护的解读是：Prove 的架构是一个 API 驱动的信任层，把 PII、电话号码数据、设备上下文、运营商 / MNO 输入，以及行为或纵向信号连接起来，做实时身份和风险决策。API
              Studio 尤其有用，因为它暴露了 Identity、Trust Score、Contact Enrichment 和 Mobile Auth
              这些具体构件，超出泛泛营销语言。authenticate-and-transact 和 trust-and-safety 页面进一步显示这些能力如何组合成不同流程，从静默认证到增强恢复或欺诈防御。


              与此同时，重要架构细节仍然隐藏。开发者门户显然存在，但很大一部分需要登录。这意味着外部投资者可以验证开发者界面存在，却仍无法在没有尽调权限的情况下检查深度、完整性、SDK
              质量或运营严谨性。产品也实质依赖运营商数据，以及 AWS 和 Amazon Connect
              等更广泛生态集成。这些依赖可以放大分销和能力，但也带来集中度和可靠性问题，公开页面没有完全回答。Ping、Auth0、Jumio 和 Socure
              的可比竞品页面进一步说明，该品类正在冲向更广泛的编排，因此隐藏的实施质量与可见营销界面同样重要。换句话说，下一步尽调不是读更多营销文案，而是测试 Prove 的集成和控制在生产环境中是否可衡量地更易用或更安全。
