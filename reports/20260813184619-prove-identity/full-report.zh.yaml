      - number: '3.4'
        title: 护城河持久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              最可信的护城河候选项是数据访问、渠道匹配和工作流复利。如果 Prove
              确实能更好访问与手机号相关的信任信号，并以低摩擦方式把这些信号用于开户和认证，那就有意义。银行可信度也重要，因为受监管信任工作流很难打进去。但公开证据也让主要风险很明显。以证件为中心的竞争对手可以满足许多相同开户需求；CIAM
              厂商可以吸收认证预算；以电信为中心的玩家可以在全球验证交付上竞争；大型身份或数据既有厂商可以围绕现有企业关系打包信任产品。


              这就是为什么反向来源重要。Sacra
              的悲观论点不只是噪音：它直接点出一种风险，即基于手机号的方法最终只是多层体系中的一个有用层，而不是赢家。投资者在承销护城河持久性之前，应要求看到续约、附加购买、定价和替换方面的证据，而不只是产品宽度或 logo
              数量。
