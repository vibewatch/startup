      - number: '6.2'
        title: 具名客户证据与采用质量
        blocks:
          - type: paragraph
            body: >-
              对一家私营基础设施公司来说，Prove 的具名客户证据异常具体。Bilt 讨论了为超过 90% 的用户验证手机号所有权和持有，同时实现有意义的预填。Gusto
              量化了更快账户恢复、更高自助成功率、更少支持工单，以及 Prove 验证会话中的零 ATO。College Ave 描述了证件请求减少超过 90%、90%
              申请实现实时决策，以及多周人工审核的结束。这些不是泛泛引用，而是绑定具体工作流的运营结果主张。这种具体性在身份基础设施中尤其重要，因为许多厂商都能摆出漂亮 logo 墙，但能发布可衡量前后运营结果的少得多。


              话虽如此，证据集并不完美。客户数量说法在公司不同界面上不一致，并非每个案例都有同样深度或新鲜度。有些页面仍更像经过策划的营销证据，而不是独立运营披露。正确结论是，采用显然真实，但确切规模和持久性仍需更深验证。投资者还应区分厂商策划的成功故事和独立衡量的全组合客户质量。用实际尽调语言说，Prove
              已经跨过“这是否在生产中使用？”这道门槛，但还没有跨过“这本客户账有多持久、多分散？”这道门槛。
