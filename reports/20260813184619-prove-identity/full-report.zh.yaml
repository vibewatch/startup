  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              公开客户记录显示，Prove 的重心清楚落在受监管或对欺诈敏感的数字业务上。银行、金融科技、贷款、市场平台、游戏和信任密集型数字体验，反复出现在 Prove
              的行业页面、博客表述和案例研究记录中。这符合产品逻辑：在开户速度、账户安全、欺诈损失和支持成本同时重要的场景，以手机号为中心的身份最有价值。


              重要的是，客户足迹并非完全单一维度。医疗系统案例显示，它在经典金融科技之外也有真实使用；多个具名客户页面证明，同一个信任层可以适配不同运营任务。这种宽度重要，因为它暗示 Prove
              卖的是可复用信任工作流，而不是一次性小众点解决方案；这正是投资者在押注更广平台扩张前希望看到的模式。不过，组合似乎仍偏向金融服务式用例，这在战略上有吸引力，但也意味着投资者应仔细检查集中度。公司可以从具名客户数上看似分散，却在经济上锚定少数共享相似购买周期和监管触发因素的类别。
