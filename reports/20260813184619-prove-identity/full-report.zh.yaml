      - number: '2.3'
        title: 增长驱动因素与市场压力
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动不是泛泛的数字化口号，而是欺诈、监管和客户体验经济学的变化。Prove 自身研究和独立报道都强调，deepfake、AI 驱动欺诈和 MFA 绕过正在削弱视觉或一次性身份检查的可信度。NIST 在
              2025 年从 SP 800-63-3 转向 SP 800-63-4，说明公共标准仍在演进；这很重要，因为受监管买方不想要停滞的身份架构。FIDO 推动 passkey
              也利好该品类：企业离开密码之后，仍需要强账户开立、账户恢复和生命周期信任系统，先决定谁有资格拿到凭证。


              另一个关键驱动是速度。在游戏、医疗、加密和主流银行场景，用户放弃成本很高，而且往往即时发生。因此，低摩擦开户和强自动批准率可以赢得预算，即便安全团队不是唯一买方。这就是为什么身份核验越来越站在欺诈、增长、合规和产品经济学的交汇处，而不是只躲在一个孤立的安全预算里。
