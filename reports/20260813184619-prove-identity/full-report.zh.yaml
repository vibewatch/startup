      - number: '3.2'
        title: 能力重叠与差异化
        blocks:
          - type: paragraph
            body: >-
              公开证据中，Prove 差异化最强的论点并不是它与同行没有功能重叠。重叠显然存在。Jumio 也营销身份图谱、生物识别、AML 筛查和广义身份情报。Socure
              呈现的信任与风险层同样宽。只要问题由客户认证和开发者工具主导，Okta/Auth0 就很强。相反，Prove
              的边缘在于它把决策扎根在以手机号为中心的信号上：持有、所有权、信誉、设备连续性和移动端关联行为。这与证件优先、无密码优先或消息优先的供应商起点不同。


              Prove 扩展得似乎也比传统 Payfone 印象更快。公开产品页面现在覆盖账户开立、统一认证、Human Assurance、AirKey、Verified User
              以及更大的平台外壳。这不能证明护城河不可攻破，但确实说明管理层理解，如果被困在单一狭窄点解决方案品类里，会带来竞争风险。
