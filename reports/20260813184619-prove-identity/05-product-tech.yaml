chapter:
  number: 5
  title: Product & Technology
  summary: Public evidence shows Prove as a real, API-led identity and authentication platform rather than a one-feature vendor. Its clearest technical differentiation is a phone-centric trust layer combining possession, ownership, reputation, device, and carrier signals across onboarding, login, servicing, and fraud workflows. The platform is broader than its historical Payfone-era image, but key operational details—API depth, uptime, carrier coverage, and model behavior—still require private diligence.
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'Prove is not just one identity-verification API. The public surface now describes a wider trust platform spanning onboarding, identity verification, passwordless or low-friction authentication, account opening, ongoing servicing, bot defense, reusable identity, and even newer AI-agent commerce primitives. That breadth matters because it changes how investors should think about product maturity: the oldest pieces appear to be identity verification, pre-fill, and authentication, while the newest visible extensions include Human Assurance and the Agentic Suite.


    This module map also clarifies the business model. Prove is building around concrete workflow jobs, not abstract security categories. Account opening, authenticate-and-transact, trust-and-safety, compliance, digital assets, and healthcare onboarding all show the same underlying trust layer being packaged for different buyer pain points. That pattern is stronger evidence of a real platform than a generic homepage alone would provide. It also suggests product management is organizing the company around reusable trust primitives that can be remixed across industries rather than rebuilt from scratch for every logo. That architecture pattern is especially important in identity software because buyer problems differ by workflow even when the underlying trust checks rhyme. That is strategically attractive because it should shorten time-to-market for new verticals, even if every new segment still needs some policy, data, and workflow tuning.'
