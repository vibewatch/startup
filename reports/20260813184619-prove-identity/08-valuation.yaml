chapter:
  number: 8
  title: Valuation
  summary: Prove looks like a serious, strategically relevant identity asset, but the public evidence does not yet justify a premium valuation with high confidence. The last hard round anchor is >$1B in 2023, while softer tracker marks push the company toward ~$1.9B by 2025; against the public ~$63M ARR estimate, that range already implies demanding multiples. The disciplined call is to keep Prove active in diligence with a research-more / track recommendation and strict entry-price discipline.
sections:
- id: thesis-antithesis-and-call
  title: Thesis, anti-thesis, and recommendation
  body: 'Prove has enough public proof to warrant serious investor attention. It operates in a large and growing identity-verification and authentication market, has a differentiated phone-centric trust narrative, and shows unusually concrete named-customer evidence for a private company. Those positives matter. They argue that the company is strategically relevant rather than speculative. In a crowded identity market, that is already a meaningful threshold: many vendors can describe a category opportunity, but fewer can point to named bank- and workflow-level proof with measurable operational outcomes.


    But strategic relevance is not the same thing as a clear buy. The anti-thesis is straightforward: the public record is still too thin on the operating metrics that should determine price. There is no audited revenue, no public cash or burn, no retention disclosure, and no clear concentration data. That makes a price-sensitive recommendation unavoidable. The right public-evidence call is therefore research-more or track: stay engaged, but do not underwrite a premium on narrative alone. The distinction matters because many strong venture-backed infrastructure companies are worth following closely even when they are not yet worth buying at the implied mark, especially in security and identity categories where narratives can outrun disclosed operating data.'
