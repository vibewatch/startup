- id: valuation-context-and-scenarios
  title: Valuation context and scenarios
  body: 'The hardest part of valuing Prove from public evidence is that the known mark anchors and the known operating anchors are mismatched in precision. TechCrunch gives a hard 2023 financing anchor above $1 billion. AInvest provides a much softer 2025 estimate near $1.93 billion. GetLatka offers a directional revenue estimate around $63 million. Those inputs are enough to frame scenarios, but not enough to bless a precise entry price. The resulting discipline is less about pretending to know fair value to the decimal and more about identifying what evidence would justify narrowing the range.


    If the revenue estimate is directionally right, the implied multiple range between the 2023 hard mark and the 2025 soft mark is already demanding. That does not make the company unattractive; it means upside now depends heavily on what private diligence reveals about retention, margins, concentration, and attach. The right discipline is to work with bull, base, and bear cases rather than with a single heroic point estimate today. Scenario framing is especially important when one data point is a priced round, another is a soft tracker mark, and the operating bridge between them is still incomplete for investors today.'
