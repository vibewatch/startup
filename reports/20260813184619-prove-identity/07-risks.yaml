- id: financial-execution-and-kill-criteria
  title: Financial, execution, and thesis-break risk
  body: 'The public financial risk picture is defined more by what is missing than by what is disclosed. There is no current public cash, burn, runway, retention, or pricing-realization data. That leaves investors unable to judge how much operational stress the company can absorb or how resilient pricing is if broader identity stacks close the gap. That uncertainty is compounded by limited visibility into how much of customer value comes from a few flagship programs versus a long tail of smaller deployments. Sacra’s bear case is relevant here because it frames the strategic risk that mobile-trust differentiation becomes one layer inside a more commoditized platform market.


    Execution breadth adds another layer of risk. Prove is supporting regulated core products while also broadening into servicing, bot defense, and AI-agent trust. That could become a real advantage if the company sequences well. It could also diffuse focus if new initiatives outrun customer proof. The more industries and workflow variants the company pursues simultaneously, the more important roadmap discipline and product sequencing become. The right response is not to reject the company outright, but to define hard monitorables and kill criteria before underwriting a premium valuation or high-confidence upside scenario. That discipline matters. In other words, Prove looks investable only if the diligence process converts these qualitative risk narratives into measurable operational thresholds.'
