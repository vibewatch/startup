chapter:
  number: 7
  title: Risks
  summary: Prove’s public risk profile is manageable but not light. The most material exposures are privacy/compliance execution, carrier-signal and platform dependency, opaque operational reliability, customer concentration uncertainty, and execution stretch as the company broadens into newer categories like agentic commerce. There is no obvious public scandal in the reviewed pack, but this is precisely the kind of trust infrastructure business where hidden failures could transmit quickly into customers, revenue, and valuation.
sections:
- id: legal-and-regulatory-risk
  title: Legal and regulatory risk
  body: 'Prove sits in a legally sensitive operating zone because it processes personal information, phone-linked identity data, sanctions/PEP checks, and other regulated trust signals on behalf of enterprise customers. The public materials make clear that clients are responsible for consent or notice, and Prove emphasizes privacy rights, minimization, and limited retention for most real-time client-submitted data. That is a positive mitigation narrative, but it also highlights where failure would matter most: privacy-law execution, sanctions-screening accuracy, and the mismatch risk between what customers promise users and what the underlying system actually does. In trust infrastructure, small policy or implementation gaps can become large commercial problems because customers adopt these tools specifically to avoid reputational damage.


    The reviewed record did not establish direct FedRAMP authorization for Prove itself. That does not hurt the current commercial thesis if government is not core, but it becomes a real blocker if public-sector expansion is part of the upside case. Investors should also note that Prove tightly controls its documentation and comparative analysis through terms-of-service language, which is understandable yet limits easy external verification. As a result, legal and technical diligence have to work together rather than as separate checklists in any serious underwrite.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-dependency-risk
  title: Operational and dependency risk
  body: 'Operationally, Prove depends on fast, accurate, and consistently available identity signals. That is the core strength of the product—and the core vulnerability. Carrier/MNO inputs, device signals, API reliability, and real-time scoring quality all need to work well enough that customers can remove friction without raising fraud losses. The reviewed materials show strong mitigation intent around SIM swaps, social engineering, and account takeovers, but they do not provide public uptime reporting or detailed failure-mode disclosure. That makes it difficult to judge whether the system degrades gracefully when one signal source goes missing or a fraud pattern changes abruptly.


    Dependency risk is equally important. Prove depends on carrier-quality data, on customer input quality, and on broader cloud or ecosystem relationships such as AWS and Amazon Connect. Any degradation in those dependencies could show up quickly as lower pass rates, more OTP fallbacks, or weaker customer outcomes at the exact moments when customers most need the system to be invisible and dependable. That is why public reliability opacity matters: the most serious failure modes are easy to describe but not yet easy to measure from outside the company.'
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
