  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-power
    missingEvidence: Public price cards, ACVs, and workflow-specific packaging detail for Prove and peers.
    whyItMatters: Without pricing evidence, it is hard to tell whether feature overlap translates into real margin pressure.
    diligencePath: Request sample proposals, minimum commits, and renewal uplifts versus competitors.
    relatedQuestionRefs:
    - QP011
    - QP022
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: renewal-and-churn
    missingEvidence: Relative retention, churn, and module attachment by cohort versus competitors.
    whyItMatters: Public logo lists say little about how durable the installed base really is.
    diligencePath: Request retention, expansion, and replacement data by product and vertical.
    relatedQuestionRefs:
    - QP023
    - QP025
  - type: private-evidence-only
    severity: material
    topic: data-source-durability
    missingEvidence: Contractual durability or exclusivity of the telecom and partner data sources that support Prove’s edge.
    whyItMatters: If those inputs are non-exclusive or easy to replicate, the moat shrinks materially.
    diligencePath: Request carrier-partner coverage, exclusivity terms, and fallback behavior when signal quality drops.
    relatedQuestionRefs:
    - QP014
    - QP020
    - QP021
  - type: missing-source
    severity: minor
    topic: government-competition
    missingEvidence: More direct public evidence on how Prove competes in government or public-sector identity versus specialized vendors.
    whyItMatters: Public-sector go-to-market may matter later even if it is not the core current wedge.
    diligencePath: Request sector pipeline and win stories if government becomes part of the thesis.
    relatedQuestionRefs:
    - QP024
  - type: conflicting-data
    severity: minor
    topic: competitor-overlap
    missingEvidence: A standardized apples-to-apples benchmark across feature breadth, implementation time, and fraud outcomes.
    whyItMatters: Public pages are marketing documents and can overstate parity or differentiation.
    diligencePath: Commission a structured product bake-off with defined workflows and outcome metrics.
    relatedQuestionRefs:
    - QP004
    - QP012
    - QP013
    - QP025
    relatedTableRefs:
    - TP002
