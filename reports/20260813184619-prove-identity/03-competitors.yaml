chapter:
  number: 3
  title: Competitors
  summary: Prove competes in a fragmented landscape that includes direct identity-verification peers like Jumio, Entrust/Onfido, and Socure, plus adjacent players such as Telesign and Okta/Auth0. Its clearest public differentiation is phone-centric identity and low-friction workflow depth, but many peers now market graph, orchestration, passwordless, or multichannel trust capabilities too. The moat case is plausible on data access and banking fit, yet still incomplete without pricing, retention, and displacement evidence.
sections:
- id: landscape-and-substitutes
  title: Landscape, adjacency, and substitutes
  body: 'Prove operates inside a crowded digital-identity landscape, but the crowd is segmented rather than uniform. The direct overlap set includes identity-verification specialists such as Jumio and Entrust/Onfido, as well as broader identity-and-risk platforms like Socure. Adjacent overlap comes from Telesign, which is stronger in multichannel verification and carrier delivery, and from Okta/Auth0, which leads from CIAM and passwordless authentication rather than from phone-rooted proofing. The substitute set is just as important: many enterprises still stitch together OTPs, KBA, manual review, and separate fraud tools instead of buying one integrated platform.


    This means Prove is not competing in a winner-take-all market. Buyers can multi-home, bundle, or keep part of the workflow in-house. That reality should temper any simplistic moat claim. At the same time, fragmentation is not inherently bad for Prove. It can help a focused vendor win narrowly defined workflows where low friction and mobile trust matter more than a generic enterprise identity stack.'
