- id: capability-overlap-and-differentiation
  title: Capability overlap and differentiation
  body: 'The strongest public case for Prove’s differentiation is not that it has no feature overlap with peers. It clearly does. Jumio also markets an identity graph, biometrics, AML screening, and broad identity intelligence. Socure presents an equally expansive trust-and-risk layer. Okta/Auth0 is powerful anywhere customer authentication and developer tooling dominate the problem. Instead, Prove’s edge is the way it roots decisions in phone-centric signals: possession, ownership, reputation, device continuity, and mobile-linked behavior. That is a different starting point from a document-first, passwordless-first, or messaging-first vendor.


    Prove also appears to be broadening faster than the legacy Payfone perception suggests. Public product pages now span account opening, unified auth, human assurance, airkey, verified user, and a larger platform wrapper. That does not prove an unassailable moat, but it does show management understands the competitive risk of staying trapped inside one narrow point solution category.'
