- id: pricing-switching-and-distribution
  title: Pricing opacity, switching costs, and distribution power
  body: 'Public pricing is weak across this category. Most of the vendor pages reviewed push buyers into contact-sales or partner-led motions rather than exposing a clean self-serve rate card. That makes it hard to compare gross pricing power from public sources alone. It also means distribution and implementation velocity matter more than a spreadsheet of list prices. Prove’s partner program, Temenos marketplace presence, and channel messaging suggest management is leaning on embedded distribution to reach regulated buyers more efficiently.


    Switching costs are real but probably not absolute. Once Prove is wired into onboarding, recovery, and fraud policy, there is some workflow depth and data history to defend. But multi-homing remains plausible because enterprises often bundle separate systems for CIAM, documents, messaging, and fraud orchestration. The best interpretation is that Prove’s switching cost is probably higher than a commodity API’s and lower than an all-encompassing enterprise identity suite’s. That middle ground keeps the competitive fight alive.'
  claimRefs:
  - CP014
  - CP025
