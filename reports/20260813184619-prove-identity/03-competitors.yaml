- id: moat-durability-and-competitive-risk
  title: Moat durability and competitive risk
  body: 'The most plausible moat candidates are data access, channel fit, and workflow compounding. If Prove genuinely has better access to phone-linked trust signals and can use them across onboarding and authentication with low friction, that is meaningful. Banking credibility also matters, because regulated trust workflows are hard to break into. But the public evidence also makes the main risks obvious. Document-centric competitors can meet many of the same onboarding needs; CIAM vendors can absorb authentication budgets; telecom-centric players can compete on global verification delivery; and big identity or data incumbents can bundle trust products around existing enterprise relationships.


    That is why the adverse sources matter. Sacra’s bear case is not just noise: it directly names the risk that a phone-based approach becomes one useful layer among many instead of the winner. Before underwriting moat durability, an investor should demand proof on renewal, attachment, pricing, and displacement—not just product breadth or logo count.'
