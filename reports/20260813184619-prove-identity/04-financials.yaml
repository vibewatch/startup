- id: capital-adequacy-and-underwriting-gaps
  title: Capital adequacy and underwriting gaps
  body: 'The October 2023 round is the best hard public anchor. TechCrunch reports $40 million raised at a valuation above $1 billion and says management planned to invest in market expansion, new products, and AI-linked identity capabilities. That supports the idea that Prove had continued access to growth capital and investor confidence. But it does not answer the key underwriting questions that matter today: cash on hand, burn, runway, customer concentration, retention, or margin by product.


    That distinction matters. A private company can have an impressive last round and still be difficult to underwrite if current operating data is unavailable. In Prove’s case, the biggest public blockers are not lack of strategic narrative—they are lack of audited financials and absence of core private-company operating metrics. There is also no public evidence strong enough to settle how concentrated revenue is across top banks, fintechs, or large partners, which is crucial because a phone-based identity company could look diversified by logo count while still depending economically on a smaller set of very large programs. That concentration question affects not only downside risk, but also negotiating leverage at renewal time and sales-planning resilience during adverse customer or market shocks. The prudent stance is that public evidence supports a promising financial model, but not a full underwriting decision at a precise price.'
