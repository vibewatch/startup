chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a hybrid enterprise identity-infrastructure model in which Prove likely monetizes onboarding, verification, authentication, and fraud-decision events via negotiated enterprise packaging. Customer and partner evidence shows clear ROI levers—higher approvals, lower abandonment, less fraud, and lower support cost—but public underwriting gaps remain large. The 2023 $40M round is a hard capital anchor, yet cash, burn, margin, pricing realization, and retention remain undisclosed.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization mechanics
  body: 'Public evidence points to a multi-module revenue model built around identity-proofing, onboarding, authentication, and fraud-decision events. Prove’s product set spans Pre-Fill, Identity Verify, Unified Auth, AirKey, Human Assurance, and Identity Manager, which strongly suggests revenue is attached to workflow usage rather than to a single monolithic subscription. The pages reviewed repeatedly frame value around application starts, logins, account recovery, fraud decisions, and high-risk transactions—units that naturally lend themselves to API- or transaction-based pricing.


    At the same time, the public footprint looks enterprise-oriented, not self-serve. There is no broadly accessible price card on the reviewed pages, and the banking and marketplace positioning implies negotiated, account-based packaging. The best reading is that Prove probably combines minimum commitments, module packaging, and event-based usage, but the exact mix is not publicly visible. That uncertainty matters because it leaves open important questions about how much revenue is recurring minimum-commit software spend versus bursty event volume. If usage is concentrated in a few customer workflows or tied to volatile fraud events, the revenue profile could be choppier than a generic SaaS multiple suggests. It also means that apparent platform breadth may not translate into equally broad revenue today; some modules could still function primarily as expansion options rather than material standalone lines.'
  claimRefs:
