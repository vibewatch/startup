  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              Prove’s market should not be defined as all cybersecurity or even all IAM. The narrower and more
              defensible boundary is identity verification plus authentication infrastructure used in high-trust digital
              interactions where a business must decide whether a person is real, present, and safe to transact with.
              That includes onboarding, account opening, passwordless or low-friction sign-in, high-risk transaction
              approval, account recovery, call-center identity checks, and lifecycle fraud prevention that stays tied to
              identity. Prove’s current platform language supports this framing because it unifies verification,
              authentication, monitoring, and fraud policy rather than selling one document-only step.


              The excluded categories matter just as much. Pure perimeter IAM, generic anti-malware, transaction-only
              fraud tools, and standalone document capture without reusable identity context are adjacent, not
              identical. The broad IAM market can still matter for competitive encroachment, especially when CIAM
              vendors like Okta/Auth0 push into external-user authentication, but it should not be counted as direct
              Prove TAM. That distinction keeps later valuation work honest and prevents the company from being
              underwritten against an unrealistically large, shapeless market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM021
              - CM029
              - CM040
