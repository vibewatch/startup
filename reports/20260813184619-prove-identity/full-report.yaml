      - number: '5.2'
        title: Architecture, deployment, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The most defensible public reading of Prove’s architecture is an API-led trust layer that joins PII,
              phone-number data, device context, carrier/MNO inputs, and behavioral or longitudinal signals to make
              real-time identity and risk decisions. API Studio is especially useful because it exposes specific
              building blocks—Identity, Trust Score, Contact Enrichment, and Mobile Auth—in a way that goes beyond
              generic marketing language. The authenticate-and-transact and trust-and-safety pages further show how
              those capabilities combine into different flows, from silent authentication to step-up recovery or fraud
              defense.


              At the same time, important architecture details remain hidden. The developer portal is clearly present,
              but much of it is login-gated. That means an outside investor can verify that a developer surface exists,
              yet still cannot inspect depth, completeness, SDK quality, or operational rigor without diligence access.
              The product also depends materially on carrier data and on broader ecosystem integrations such as AWS and
              Amazon Connect. Those dependencies can be powerful distribution and capability multipliers, but they also
              create concentration and reliability questions that public pages do not fully answer. Comparable
              competitor pages from Ping, Auth0, Jumio, and Socure reinforce that the category is racing toward broader
              orchestration, so hidden implementation quality matters just as much as the visible marketing surface. In
              other words, the next diligence step is not reading more marketing copy; it is testing whether Prove’s
              integrations and controls are measurably easier or safer in production.
