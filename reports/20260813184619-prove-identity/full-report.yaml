      - number: '7.2'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Prove depends on fast, accurate, and consistently available identity signals. That is the
              core strength of the product—and the core vulnerability. Carrier/MNO inputs, device signals, API
              reliability, and real-time scoring quality all need to work well enough that customers can remove friction
              without raising fraud losses. The reviewed materials show strong mitigation intent around SIM swaps,
              social engineering, and account takeovers, but they do not provide public uptime reporting or detailed
              failure-mode disclosure. That makes it difficult to judge whether the system degrades gracefully when one
              signal source goes missing or a fraud pattern changes abruptly.


              Dependency risk is equally important. Prove depends on carrier-quality data, on customer input quality,
              and on broader cloud or ecosystem relationships such as AWS and Amazon Connect. Any degradation in those
              dependencies could show up quickly as lower pass rates, more OTP fallbacks, or weaker customer outcomes at
              the exact moments when customers most need the system to be invisible and dependable. That is why public
              reliability opacity matters: the most serious failure modes are easy to describe but not yet easy to
              measure from outside the company.
