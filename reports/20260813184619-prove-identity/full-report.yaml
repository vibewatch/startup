  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, adjacency, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Prove operates inside a crowded digital-identity landscape, but the crowd is segmented rather than
              uniform. The direct overlap set includes identity-verification specialists such as Jumio and
              Entrust/Onfido, as well as broader identity-and-risk platforms like Socure. Adjacent overlap comes from
              Telesign, which is stronger in multichannel verification and carrier delivery, and from Okta/Auth0, which
              leads from CIAM and passwordless authentication rather than from phone-rooted proofing. The substitute set
              is just as important: many enterprises still stitch together OTPs, KBA, manual review, and separate fraud
              tools instead of buying one integrated platform.


              This means Prove is not competing in a winner-take-all market. Buyers can multi-home, bundle, or keep part
              of the workflow in-house. That reality should temper any simplistic moat claim. At the same time,
              fragmentation is not inherently bad for Prove. It can help a focused vendor win narrowly defined workflows
              where low friction and mobile trust matter more than a generic enterprise identity stack.
