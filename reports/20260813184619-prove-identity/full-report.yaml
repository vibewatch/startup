            body: >-
              The public evidence is much weaker on durability than on initial adoption. There is no public NRR, GRR,
              churn, or renewal disclosure, and no clear concentration data by top customer or top vertical. Even so,
              the workflows themselves imply some stickiness because vendors embedded in onboarding, recovery, and fraud
              flows are not trivial to swap out. The best expansion logic also looks believable: customers can start
              with onboarding or verification and then add authentication, servicing, or other trust modules over time.
              In that sense, the customer chapter supports the broader platform thesis even though it cannot fully prove
              monetization depth from public data alone today.


              The key risk is that strong banking references can mask economic concentration. Prove may have many logos
              while still deriving a large share of value from a smaller number of major enterprise programs. That
              matters because loss of one or two large programs could hit both revenue and perceived market credibility
              at the same time, amplifying downside far beyond logo count alone. Public customer evidence therefore
              supports the commercial relevance of the platform, but not yet the resilience or diversification of its
              revenue base. That is the difference between proving product-market fit and proving portfolio-quality
              customer economics. For investors, the next step is to convert this compelling proof set into cohort,
