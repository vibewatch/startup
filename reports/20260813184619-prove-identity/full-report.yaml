      - number: '4.2'
        title: Traction proxies, customer ROI, and cost structure
        blocks:
          - type: paragraph
            body: >-
              The public revenue record is thin, but the operating value proposition is easier to see. Temenos and Alloy
              both frame Prove as a tool that increases approvals, reduces abandonment, and cuts fraud, while Identity
              Manager claims it can reduce call-center handling and improve login pass rates. Those are economically
              meaningful outcomes for banks, fintechs, and marketplaces. Prove’s own platform page also claims 2.5B
              known identities and 30B annual authentications, which—if directionally correct—describe a large activity
              base that fits usage-linked monetization.


              The likely cost structure also looks more like software-plus-data than a capital-intensive business. There
              is no sign of hardware manufacturing or inventory. Instead, margin should depend on carrier and
              third-party data costs, cloud/API infrastructure, fraud-model upkeep, and enterprise support. That can
              still produce attractive gross margins, but not necessarily the pristine economics of a pure seat-based
              SaaS vendor. A key diligence question is whether data and carrier inputs scale roughly linearly with usage
              or whether pricing leverage and model reuse expand contribution margin as volume rises. Without that
              answer, investors cannot responsibly underwrite the eventual margin ceiling.
