    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Prove Identity should be treated as the modern operating name for the business formerly known as Payfone.
              The strongest public chronology runs from a 2008 founding through a 2020 rebrand that coincided with new
              capital and strategic acquisitions, then into a 2023 funding event that put the company back above the $1
              billion valuation threshold. That arc matters because it explains why Prove no longer presents itself as a
              narrow carrier-billing or one-off authentication utility. The current platform narrative is broader: Prove
              uses phone-derived identity, device, and fraud signals to verify users, authenticate returning customers,
              and manage risk across onboarding and sensitive lifecycle events.


              The public scale signals are meaningful but should be handled with dating discipline. Official and partner
              materials support a current story of 2,500+ companies, 19 of the top 20 U.S. banks, 2.5B+ known
              identities, and 30B+ annual authentications, while TechCrunch preserves a lower 2023 point-in-time
              snapshot of roughly 1,000 business customers and 9 of the top 10 U.S. banks. That combination points to
              real growth, but it also means later chapters should distinguish current marketing claims from older
              historical snapshots rather than flattening them into one timeless metric.
