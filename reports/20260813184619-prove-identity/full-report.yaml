        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              The public customer record shows a clear center of gravity in regulated or fraud-sensitive digital
              businesses. Banking, fintech, lending, marketplaces, gaming, and trust-heavy digital experiences appear
              repeatedly across Prove’s industry pages, blog language, and case-study record. That fits the product
              logic: phone-centric identity is most valuable where onboarding speed, account security, fraud losses, and
              support costs all matter at once.


              Importantly, the customer footprint is not purely one-dimensional. The healthcare-system story shows real
              use outside classic fintech, and multiple named customer pages demonstrate that the same trust layer can
              be adapted to different operational jobs. That breadth matters because it suggests Prove sells a reusable
              trust workflow rather than a one-off niche point solution, which is exactly the sort of pattern investors
              want to see before betting on broader platform expansion. Still, the mix appears skewed toward
              financial-services-style use cases, which is strategically attractive but also means investors should
              examine concentration carefully. A company can appear diversified by named customer count while still
              being economically anchored by a few categories that share similar buying cycles and regulatory triggers.
