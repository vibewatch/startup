      - number: '1.2'
        title: Leadership bench and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Rodger Desai is still the key-person center of gravity. He is founder and chief executive officer, and the
              public evidence ties both company history and current product narrative to his leadership. The leadership
              page nonetheless shows a broader operator bench than a founder-only story would suggest. Prove exposes
              named executives for finance, product, customer operations, legal, people, revenue, and business
              development, which is enough to support a view that the business has an institutional management layer
              rather than a single-product startup team. The visible external leadership names also matter:
              representatives from Opus Capital, Apax Digital, Relay Ventures, TransUnion, and MassMutual Ventures are
              still publicly associated with the company’s board or leadership surface.


              What remains opaque is formal governance. Public materials do not explain committee structure, voting
              control, secondary ownership shifts, or whether current board representation exactly matches the visible
              leadership roster. That is not unusual for a late-stage private company, but it is material. A growth
              investor can establish that Prove has real executives and credible backers from public sources, yet cannot
              infer hard control rights or succession readiness without direct diligence.
