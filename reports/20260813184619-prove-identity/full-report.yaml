      - number: '1.3'
        title: Funding history, valuation anchors, and milestones
        blocks:
          - type: paragraph
            body: >-
              The cleanest public funding anchor is the October 2023 raise. TechCrunch reported a $40 million financing
              at a valuation above $1 billion, while Tracxn records a roughly $43.9 million Series F at a $1 billion
              post-money mark. Those two sources line up well enough to treat late 2023 as the last strongly supported
              primary valuation event. Earlier milestones are also meaningful: the 2020 rebrand was accompanied by a
              $100 million investment led by Apax Digital and strategic acquisitions that helped reposition the company
              as a broader digital identity platform. The official timeline then fills in product milestones such as
              Trust Score in 2015, Pre-Fill in 2017, and Prove Identity Network development in 2019.


              The capital-history caveat is total funding. Tracxn and GetLatka disagree materially, with one suggesting
              around $268 million total and the other materially less. Because those tracker methodologies are not
              transparent enough to reconcile from public evidence alone, later financial work should treat total raised
              as directionally large but not precisely settled. The better-supported investment conclusion today is
              narrower: Prove is a late-stage, still-private identity company with a clear $1 billion-plus primary
              valuation anchor and credible evidence of continued relevance in 2026.
