  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Prove sits in a legally sensitive operating zone because it processes personal information, phone-linked
              identity data, sanctions/PEP checks, and other regulated trust signals on behalf of enterprise customers.
              The public materials make clear that clients are responsible for consent or notice, and Prove emphasizes
              privacy rights, minimization, and limited retention for most real-time client-submitted data. That is a
              positive mitigation narrative, but it also highlights where failure would matter most: privacy-law
              execution, sanctions-screening accuracy, and the mismatch risk between what customers promise users and
              what the underlying system actually does. In trust infrastructure, small policy or implementation gaps can
              become large commercial problems because customers adopt these tools specifically to avoid reputational
              damage.


              The reviewed record did not establish direct FedRAMP authorization for Prove itself. That does not hurt
              the current commercial thesis if government is not core, but it becomes a real blocker if public-sector
              expansion is part of the upside case. Investors should also note that Prove tightly controls its
              documentation and comparative analysis through terms-of-service language, which is understandable yet
              limits easy external verification. As a result, legal and technical diligence have to work together rather
              than as separate checklists in any serious underwrite.
