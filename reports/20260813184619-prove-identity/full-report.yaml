companyProfile:
  summary: >-
    Prove Identity is the modern operating name of Payfone, a 2008-founded New York identity company led by founder-CEO
    Rodger Desai. The company now presents itself as a phone-centric trust platform spanning onboarding, identity
    verification, authentication, servicing, fraud controls, and newer AI-agent trust products. Public evidence supports
    real customer and product depth, but the business still requires caveats on audited financial disclosure, customer
    concentration, retention, and the exact durability of its carrier- and phone-signal advantage.
