  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization mechanics
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a multi-module revenue model built around identity-proofing, onboarding,
              authentication, and fraud-decision events. Prove’s product set spans Pre-Fill, Identity Verify, Unified
              Auth, AirKey, Human Assurance, and Identity Manager, which strongly suggests revenue is attached to
              workflow usage rather than to a single monolithic subscription. The pages reviewed repeatedly frame value
              around application starts, logins, account recovery, fraud decisions, and high-risk transactions—units
              that naturally lend themselves to API- or transaction-based pricing.


              At the same time, the public footprint looks enterprise-oriented, not self-serve. There is no broadly
              accessible price card on the reviewed pages, and the banking and marketplace positioning implies
              negotiated, account-based packaging. The best reading is that Prove probably combines minimum commitments,
              module packaging, and event-based usage, but the exact mix is not publicly visible. That uncertainty
              matters because it leaves open important questions about how much revenue is recurring minimum-commit
              software spend versus bursty event volume. If usage is concentrated in a few customer workflows or tied to
              volatile fraud events, the revenue profile could be choppier than a generic SaaS multiple suggests. It
              also means that apparent platform breadth may not translate into equally broad revenue today; some modules
              could still function primarily as expansion options rather than material standalone lines.
