      - number: '2.4'
        title: Constraints, fragmentation, and open questions
        blocks:
          - type: paragraph
            body: >-
              The market is clearly real, but it is not easy. Mordor’s restraint list—fragmented regulation, deepfake
              escalation, integration cost, and data-sovereignty issues—deserves to be taken seriously. Phone-based
              identity also carries a category-specific objection: if phone numbers are used as durable identifiers,
              then SIM swaps, number recycling, telecom fraud, and carrier-process weakness become a structural part of
              the risk model. That is why adverse third-party sources matter in this chapter. They do not invalidate the
              category, but they show why buyers may demand more corroboration than product marketing alone suggests.


              Fragmentation cuts both ways. Mordor’s view that no single provider controls more than 15% of revenue
              suggests there is room for focused entrants and specialized approaches like Prove’s. But it also means the
              company must defend itself against several overlap sets at once: document-centric specialists, vertically
              integrated risk platforms, telecom-centric verifiers, and CIAM incumbents. The biggest unresolved issue is
              precision. Public sources are good enough to show market attractiveness, yet still too weak to reveal
              Prove-specific SAM, pricing, or likely share capture with high confidence.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
