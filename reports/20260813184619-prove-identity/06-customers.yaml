- id: named-customer-proof-and-adoption-quality
  title: Named customer proof and adoption quality
  body: 'Prove’s named-customer proof is unusually concrete for a private infrastructure company. Bilt discusses validating phone ownership and possession for more than 90% of users while enabling meaningful pre-fill. Gusto quantifies faster account recovery, higher self-service success, fewer support cases, and zero ATOs in Prove-verified sessions. College Ave describes more than 90% fewer document requests, real-time decisions on 90% of applications, and the end of multi-week manual reviews. These are not generic references; they are operational outcome claims attached to specific workflows. That specificity is especially important in identity infrastructure, where many vendors can produce an impressive logo wall but far fewer publish measured before-and-after operating results.


    That said, the proof set is not perfect. Customer-count claims vary across company surfaces, and not every story has the same depth or freshness. Some pages are still more like curated marketing evidence than independent operating disclosure. The right conclusion is that adoption is clearly real, but exact scale and durability still need deeper validation. Investors should also distinguish vendor-curated success stories from independently measured portfolio-wide customer quality. In practical diligence terms, Prove has already cleared the ''is this used in production?'' hurdle, but it has not yet cleared the ''how durable and diversified is the book?'' hurdle.'
