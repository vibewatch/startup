company:
  name: Prove Identity
chapter:
  number: 2
  title: Market Analysis
  summary: Prove’s most defensible market is not all IAM but the narrower identity-verification and low-friction authentication layer used in regulated, fraud-sensitive digital workflows. Retained public market reports place core identity verification around USD 14-16 billion in 2025-2026, with BFSI taking roughly one-third of demand and cloud delivery dominating. AI-driven fraud, deepfakes, and customer-experience pressure are strong demand tailwinds, but telecom dependence, regulatory fragmentation, and absent Prove-specific SAM disclosure still limit valuation precision.
sections:
- id: market-boundary-and-included-spend
  title: Market boundary and included spend
  body: 'Prove’s market should not be defined as all cybersecurity or even all IAM. The narrower and more defensible boundary is identity verification plus authentication infrastructure used in high-trust digital interactions where a business must decide whether a person is real, present, and safe to transact with. That includes onboarding, account opening, passwordless or low-friction sign-in, high-risk transaction approval, account recovery, call-center identity checks, and lifecycle fraud prevention that stays tied to identity. Prove’s current platform language supports this framing because it unifies verification, authentication, monitoring, and fraud policy rather than selling one document-only step.


    The excluded categories matter just as much. Pure perimeter IAM, generic anti-malware, transaction-only fraud tools, and standalone document capture without reusable identity context are adjacent, not identical. The broad IAM market can still matter for competitive encroachment, especially when CIAM vendors like Okta/Auth0 push into external-user authentication, but it should not be counted as direct Prove TAM. That distinction keeps later valuation work honest and prevents the company from being underwritten against an unrealistically large, shapeless market.'
  claimRefs:
  - CM001
  - CM002
  - CM003
