- id: sizing-lenses-and-buyer-mix
  title: Sizing lenses, buyer mix, and serviceable wedge
  body: 'The retained public market estimates are directionally aligned even if they do not justify one exact TAM. Mordor places identity verification at USD 15.78 billion in 2026 after a USD 14.19 billion 2025 base. FMI gives a nearly identical 2026 identity-verification figure at USD 14.1 billion and extends the curve to USD 42.8 billion by 2036. MarketsandMarkets frames the category at USD 14.34 billion in 2025 and USD 29.32 billion by 2030. This is close enough to say the market is meaningfully large, but still different enough that a report should preserve range rather than pick a fake-precision midpoint as if it were ground truth.


    The serviceable wedge is more important than the headline. BFSI shows up as roughly one-third of demand in both Mordor and FMI, while cloud delivery dominates and large enterprises take most share. That points to a market where regulated banks, fintechs, and other scaled digital businesses matter more than long-tail SMBs. Prove’s wedge also extends into gaming, healthcare, crypto, and marketplaces when those buyers need fast digital conversion without manual-review drag.'
