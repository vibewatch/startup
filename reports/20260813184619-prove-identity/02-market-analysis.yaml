tables:
- id: TM001
  title: Market definition table
  columns:
  - Category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Why it matters
  rows:
  - - Consumer identity proofing and onboarding
    - Identity verification, pre-fill, account opening, document or device-backed approval automation
    - Generic CRM or payments processing disconnected from identity
    - Risk, fraud, compliance, product
    - Core Prove entry wedge
  - - Authentication and account protection
    - Passwordless login, high-risk transaction approval, account recovery, call-center verification
    - Standalone SSO or workforce IAM without external-user proofing
    - Security plus product / digital channels
    - Critical adjacency because Prove unifies verification and auth
  - - Identity-linked fraud prevention
    - SIM-swap checks, synthetic identity defense, account-takeover prevention, risk policy
    - Transaction-only fraud scoring with no identity context
    - Fraud and risk teams
    - Extends spend beyond day-one KYC
  - - Vertical-specific trust workflows
    - Healthcare access, gaming onboarding, crypto account approval, marketplace trust
    - Sector software with no identity proofing layer
    - Operations and product leaders
    - Shows why TAM is multi-vertical rather than bank-only
  - - Broader IAM and CIAM adjacency
    - Only the CIAM or authentication share that overlaps with external-user identity decisions
    - Workforce directory management, endpoint security, privilege tooling
    - IT / security
    - Relevant for competitive pressure, not full direct TAM
  - - Excluded status-quo substitutes
    - N/A
    - Manual review, KBA, OTP-only flows, point tools, legacy fraud ops
    - Existing operations budget
    - Real alternatives but not additive TAM
  notes: Boundary is intentionally narrower than broad IAM and broader than document-only KYC; the point is to isolate monetizable identity workflows.
