- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI-generated fraud and deepfakes
    - Driver
    - Current / structural
    - Pushes buyers toward adaptive, context-rich identity stacks
    - Ask which attack categories most often trigger product expansion
  - - Passkey and passwordless adoption
    - Driver
    - Current / structural
    - Raises the importance of strong enrollment, recovery, and lifecycle identity
    - Ask how often Prove displaces OTP-only stacks
  - - Remote onboarding economics
    - Driver
    - Current / structural
    - Conversion and labor savings help identity spend win product budget
    - Request quantified conversion lift by workflow
  - - Sector-specific fraud losses
    - Driver
    - Current / structural
    - Banking, gaming, and crypto all face urgent trust needs
    - Request vertical mix and revenue contribution
  - - Fragmented regulation
    - Constraint
    - Current / structural
    - Slows global expansion and raises compliance cost
    - Request geo-specific compliance burden and roadmap
  - - Telecom dependence and SIM-swap weakness
    - Constraint
    - Current / structural
    - Phone-based systems must prove resilience, not just speed
    - Request false-positive rates and fallback rules
  - - Integration cost and data-sovereignty barriers
    - Constraint
    - Current / near-term
    - Cloud advantage is real but not universal
    - Request implementation cycle and data-residency exceptions
  - - No public Prove-specific SAM or pricing transparency
    - Constraint
    - Current
    - Limits valuation precision despite category growth
    - Request pricing, attach-rate, and cohort disclosures
  notes: The most relevant constraints are not whether the category exists, but whether Prove can convert demand into defensible, price-supported share.
