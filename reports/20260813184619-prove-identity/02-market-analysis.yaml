- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Economic buyer
  - Workflow
  - Why Prove fits
  - Constraint
  rows:
  - - Banks and sponsor banks
    - Risk, fraud, compliance, digital account-opening owner
    - KYC, onboarding, account protection, call center
    - BFSI is the largest vertical and phone-centric signals fit fraud-sensitive flows
    - Heavy procurement and policy scrutiny
  - - Fintechs and neobanks
    - Head of risk, product, or operations
    - Fast approvals, low-friction onboarding, account recovery
    - Need growth without manual-review drag
    - Budget pressure and vendor sprawl
  - - Crypto exchanges and wallets
    - Trust and safety, fraud, compliance
    - Global onboarding, account takeover prevention
    - Mobile-first global users and severe fraud stakes
    - Regulation and reputation volatility
  - - Gaming and wagering
    - Product plus fraud teams
    - Pre-game onboarding, age or account verification
    - Seconds of friction can suppress revenue
    - High abuse pressure and regulatory variance
  - - Healthcare and patient access
    - Digital experience and security leaders
    - Patient login, portal access, account recovery
    - Low-friction identity is key to the digital front door
    - Privacy and consent expectations are strict
  - - Marketplaces and ecommerce platforms
    - Trust and safety, growth, payments risk
    - Seller / buyer verification and high-risk events
    - Need trust without deterring good users
    - Fraud economics differ by vertical
  notes: The buyer map emphasizes monetizable workflows and budget ownership rather than a vague “anyone needing trust” narrative.
