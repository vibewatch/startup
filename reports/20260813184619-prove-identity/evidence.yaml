evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: A definitive cap-table or management-verified total capital raised figure.
    whyItMatters: Tracker disagreement can distort dilution, runway, and valuation-underwriting work in later chapters.
    diligencePath: Ask management for a round-by-round financing schedule and reconcile it against tracker methodologies.
    relatedQuestionRefs:
      - QO010
      - QO011
      - QO024
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current consolidated employee count across the Prove group.
    whyItMatters: Headcount is often used as a proxy for burn, go-to-market scale, and operating maturity.
    diligencePath: >-
      Request current headcount by geography and function, plus the legal-entity reconciliation behind the public
      tracker figures.
    relatedQuestionRefs:
      - QO019
      - QO023
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: government-status
    missingEvidence: Direct proof of FedRAMP or other government-cloud authorization, if it exists.
    whyItMatters: Government-market claims are materially different if Prove has not yet cleared public-sector security gates.
    diligencePath: Search the FedRAMP marketplace live and ask management for authorization packages or agency references.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: governance-and-milestone-completeness
    missingEvidence: Board committees, voting rights, observer rights, and succession planning detail.
    whyItMatters: Visible executives are not a substitute for governance quality in a late-stage private company.
    diligencePath: Request board materials, committee charters, and an ownership/control summary during management diligence.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO004
  - type: stale
    severity: minor
    topic: customer-count-time-series
    missingEvidence: A dated annual series reconciling 2023 customer counts to 2026 marketing claims.
    whyItMatters: >-
      Growth claims are more credible when the company exposes clean time-series disclosure rather than isolated
      snapshots.
    diligencePath: Ask for annual customer-count, logo-retention, and product-attachment data by year.
    relatedQuestionRefs:
      - QO012
      - QO020
  - type: missing-source
    severity: material
    topic: prove-specific-sam
    missingEvidence: A Prove-specific serviceable market and share baseline with dated assumptions.
    whyItMatters: Without a company-specific SAM, valuation work risks over-anchoring to broad third-party TAM claims.
    diligencePath: Ask management for pipeline, segment revenue, and serviceable-wedge assumptions by vertical.
    relatedQuestionRefs:
      - QM021
      - QM025
  - type: missing-source
    severity: material
    topic: pricing-visibility
    missingEvidence: Public pricing, ACV, or workflow-level monetization data for identity verification buyers.
    whyItMatters: Headline TAM matters less if no one can map price capture or contract structure.
    diligencePath: Request sample contracts, minimum commits, and per-workflow pricing logic.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion-by-vertical
    missingEvidence: Win-rate, sales-cycle, and deployment data by vertical and buyer type.
    whyItMatters: A market can be large while still being operationally hard to penetrate.
    diligencePath: Request go-to-market funnel metrics by banking, fintech, gaming, healthcare, and crypto.
    relatedQuestionRefs:
      - QM009
      - QM011
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-estimate-dispersion
    missingEvidence: A directly comparable methodology across retained market-report publishers.
    whyItMatters: Different forecast windows and category definitions create fake precision if blended carelessly.
    diligencePath: Preserve ranges publicly and request management’s internal TAM bridge privately.
    relatedQuestionRefs:
      - QM022
      - QM024
    relatedTableRefs:
