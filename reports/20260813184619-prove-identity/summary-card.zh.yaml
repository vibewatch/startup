  topStrengths:
    - 具名客户证据强，包括 Bilt、Gusto、College Ave，以及一个大型医疗系统部署，且有可量化的工作流改善。
    - 产品深度清晰，覆盖开户、认证、风险评分和服务流程，不只是一个狭窄单点工具。
    - 身份验证、欺诈控制和低摩擦认证都处在大品类顺风里。
    - 后期融资记录可信，包括 2023 年以超过 $1B 估值完成的 $40M 融资。
    - 银行和受监管工作流相关性强；只要经济性站得住，企业部署粘性就有支撑。
  topRisks:
    - 经审计财务、留存、客户集中度、实际定价、现金和烧钱速度仍未公开。
    - 护城河很大程度靠运营商、手机号和信号质量优势支撑，但外部无法完整测试。
    - 公开追踪器标记相对偏软的 ARR 估算已经隐含较高倍数，估值很容易买贵。
    - 隐私、制裁筛查和信任工作流一旦执行失误，监管和声誉代价会被放大。
    - 产品线宽度和新的 AI agent 计划提高了优先级排序和执行风险。
  unresolvedGaps:
    - 经审计收入、毛利率、现金消耗、现金跑道和资产负债表细节。
    - 客户集中度、NRR / GRR、续约行为和模块 attach 队列。
    - 商业条款、实际定价，以及由伙伴贡献的收入占比。
    - 按地区和客群拆分的运营商 / MNO 覆盖、回退机制和信号质量耐久性。
    - 任何直接的政府安全授权证据；若公共部门扩张重要，也包括 FedRAMP 范围。
