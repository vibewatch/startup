- id: profile-gaps-and-cautions
  title: Profile gaps, metric conflict, and diligence cautions
  body: 'Prove’s public profile is strong enough to support later chapter work, but not strong enough to erase uncertainty. Headcount is the clearest example. GetLatka estimates 573 employees, while Tracxn shows a looser 200-499 company band and more specific counts only at some legal entities. Revenue and valuation estimates beyond the 2023 primary round show the same pattern: there are directional signals that the company has grown and may have appreciated in secondary-style models, yet these should be used as low-confidence context rather than as hard cover facts.


    The other important gap is government-grade security posture. Despite the broader market’s FedRAMP and public-sector momentum, the reviewed source set does not provide direct evidence that Prove itself has FedRAMP authorization. That absence should be treated as a diligence point, not quietly assumed away from general identity-industry trends. Combined with limited public board-control disclosure and conflicting tracker totals for capital raised, these gaps mean chapter 1 can confidently establish identity, scale, and chronology, but not every metric needed for an underwrite.'
