companyProfile:
  summary: >-
    Prove Identity is the modern operating name of Payfone, a 2008-founded New York identity company led by founder-CEO Rodger Desai.
    The company now presents itself as a phone-centric trust platform spanning onboarding, identity verification, authentication,
    servicing, fraud controls, and newer AI-agent trust products. Public evidence supports real customer and product depth, but the
    business still requires caveats on audited financial disclosure, customer concentration, retention, and the exact durability of
    its carrier- and phone-signal advantage.
  foundedDate: '2008-01-01'
  founders:
    - name: Rodger Desai
      role: Founder and CEO
      claimRefs: [CO005]
  foundingLocation: >-
    Public sources in this run confirm 2008 founding under the Payfone name, but do not provide a single crisp founding-city citation.
  headquarters: >-
    New York is the strongest current headquarters signal in the reviewed public sources.
  productSummary: >-
    Prove’s platform combines phone ownership, possession, reputation, device, and carrier signals across modules such as Pre-Fill,
    Identity Verify, Unified Auth, Identity Manager, Human Assurance, and newer Agentic Suite products.
  customerFocus: >-
    Banks, fintechs, lenders, marketplaces, merchants, gaming operators, healthcare systems, and other digital businesses where
    onboarding friction, fraud losses, and account security matter simultaneously.
  businessModel: >-
    Enterprise contracts plus workflow- and usage-linked pricing across onboarding, verification, authentication, servicing, and
    fraud-prevention modules, with partner ecosystems widening distribution.
  stage: Late-stage private / later-stage VC
  fundingStatus: >-
    Last strongly supported primary valuation event is the October 2023 financing above $1B. Later valuation estimates exist, but
    public evidence still does not resolve current cap-table terms, preference structure, or present cash position.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO005, CO009, CO016, CO023, CO024, CV007]
summary:
  headline: >-
    Prove looks like a serious identity infrastructure company with credible customer and product proof, but the price and evidence
    gap still argue for research-more rather than a clean buy call.
  overallScore: 6.2
  recommendation: research-more
  confidence: medium
