  topStrengths:
    - Strong named customer proof including Bilt, Gusto, College Ave, and a major healthcare-system deployment with measurable workflow outcomes.
    - Clear product depth across onboarding, authentication, risk scoring, and servicing rather than a single narrow point product.
    - Large category tailwinds in identity verification, fraud control, and low-friction authentication.
    - Credible late-stage financing history, including a $40M round at more than a $1B valuation in 2023.
    - Meaningful bank and regulated-workflow relevance, which can support sticky enterprise deployments if economics hold.
  topRisks:
    - Audited financials, retention, customer concentration, pricing realization, cash, and burn remain unavailable publicly.
    - The moat depends materially on carrier-, phone-, and signal-quality advantages that are not fully externally testable.
    - Valuation can be easy to overpay for because public tracker marks already imply demanding multiples versus the soft ARR estimate.
    - Privacy, sanctions-screening, and trust-workflow execution failures would have outsized regulatory and reputational consequences.
    - Product breadth and newer AI-agent initiatives increase prioritization and execution risk.
  unresolvedGaps:
    - Audited revenue, gross margin, cash burn, runway, and balance-sheet detail.
    - Customer concentration, NRR/GRR, renewal behavior, and module-attach cohorts.
    - Commercial terms, pricing realization, and partner-attributed revenue share.
    - Carrier/MNO coverage, fallback behavior, and signal-quality durability by region and segment.
    - Any direct government-security authorization evidence, including FedRAMP scope if public-sector expansion matters.
