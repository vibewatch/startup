evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-disclosure
    missingEvidence: >-
      Current valuation, cumulative capital raised, investor roster, secondary activity, debt facilities, and covenant
      terms.
    whyItMatters: >-
      These datapoints shape valuation stance, downside protection, and control analysis, but the assigned public
      evidence does not verify them.
    diligencePath: >-
      Request the latest cap table, financing history deck, shareholder register, and debt agreements directly from the
      company or lead investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Current board composition, independent directors, governance committees, and a reliable public source on any
      recent leadership transition.
    whyItMatters: >-
      Founder continuity is clear, but oversight quality and succession resilience cannot be judged from the retained
      public evidence alone.
    diligencePath: Request an org chart, board deck, governance memo, and any recent executive-change communications or board bios.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: minor
    topic: scale-reconciliation
    missingEvidence: A current audited employee count, office footprint, and a like-for-like total customer definition.
    whyItMatters: >-
      Public scale claims are directionally strong, but inconsistent denominators can misstate growth, operating
      leverage, or customer breadth.
    diligencePath: >-
      Ask management for the latest HRIS headcount, office list, and customer definition bridge separating total
      accounts from product-specific active brands.
    relatedQuestionRefs:
