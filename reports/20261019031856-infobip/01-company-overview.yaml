artifact: company-overview
slug: infobip
runDate: 2026-10-19
company:
  name: Infobip
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Infobip presents as a scaled global CPaaS and customer-engagement platform with
    founder-led continuity, broad carrier connectivity, and fresh 2026 partner and
    recognition signals. The evidence pack also leaves material disclosure gaps around
    valuation, funding, debt, board composition, and even the precise headquarters and
    employee-count framing, so later chapters should reuse the company identity while
    keeping financing and governance precision explicitly qualified.
sections:
  - id: identity-footprint
    title: Identity, product scope, and operating footprint
    body: >-
      Infobip’s current official narrative is consistent on what the company sells: a
      cloud communications platform spanning programmable channels, omnichannel
      engagement, identity and authentication, contact centre workflows, and newer
      AI-led orchestration layers. The strongest current scale signal is network reach
      rather than revenue disclosure: official 2026 materials repeat capacity to reach
      more than seven billion devices through 10k+ connections, including 800+ direct
      operator relationships. Public footprint metrics are directionally large but not
      perfectly harmonized. The company page currently cites 3,500+ employees, 75+
      offices, and presence in 190+ countries, while IDC’s older vendor profile cited
      more than 3,700 employees and more than 70 offices. That means later chapters can
      treat Infobip as a scaled, global operator, but should not present one precise
      current headcount or customer total as audited fact.
    claimRefs: [CO001, CO003, CO004, CO005, CO006, CO007, CO013]
    tableRefs: [TO001]
  - id: leadership-ecosystem
    title: Leadership, ecosystem, and governance signals
    body: >-
      The retained 2026 evidence remains founder-centric. Multiple current official
      pages still identify Silvio Kutić and Izabel Jelenić as the co-founders leading
      the company, which supports continuity but also implies meaningful key-person
      dependence at the top of product and strategy. IDC’s profile adds useful context
      on how Infobip scales through partnerships rather than only direct selling: it
      described a broad channel, technology, product, consulting, and telco ecosystem,
      with more than 280 channel partners already in place by 2021. Current partnership
      evidence with SAP shows that ecosystem logic continuing into 2026. Governance
      transparency is weaker than operating scale transparency, however. The assigned
      source pool does not provide a current public board list, control-rights summary,
      or a reliable public source on recent leadership transitions, so those topics
      remain diligence asks rather than settled chapter facts.
    claimRefs: [CO002, CO008, CO009, CO014, CO015, CO016]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence-flags
    title: Milestones, external validation, and diligence flags
    body: >-
      The chapter can date Infobip’s operating evolution much better than it can date
      financing history. IDC’s historical profile shows a pattern of capability-building
      acquisitions around U.S. coverage, MNO security, and developer ecosystem reach,
      while 2025-2026 official materials emphasize market recognition and an AI-first
      repositioning layered on top of the core CPaaS stack. The October 2026 SAP
      partnership is particularly important because it places Infobip inside a larger
      enterprise workflow rather than only at the API edge. The main caution comes from
      the thin independent adverse record in the assigned pool: the available review
      aggregation is enough to flag support-responsiveness and pricing-friction checks,
      but not enough to prove a broader operational failure. Financing, capital
      structure, and debt disclosure remain the larger unresolved diligence holes.
    claimRefs: [CO009, CO010, CO011, CO012]
    figureRefs: [FO001]
tables:
