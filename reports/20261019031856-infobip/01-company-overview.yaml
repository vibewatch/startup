callouts:
  - calloutType: insight
    title: Scaled operator, but with disclosure slippage
    body: >-
      Infobip is clearly large enough to matter in global CPaaS, yet the assigned public
      evidence still leaves key identity and scale datapoints qualified rather than cleanly auditable.
    claimRefs: [CO005, CO006, CO013, CO016]
  - calloutType: risk
    title: Adverse evidence is thinner than operating claims
    body: >-
      The strongest retained negative signal is review-aggregation feedback on support
      responsiveness and pricing friction, so customer-reference work is more important than headline recognitions.
    claimRefs: [CO011, CO012]
