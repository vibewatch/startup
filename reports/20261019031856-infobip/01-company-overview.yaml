    title: Snapshot KPI table
    columns: [Metric, Value / status, Date, Confidence, Gap]
    rows:
      - [Founded, "2006", "2026 official boilerplate", high, null]
      - [Operating footprint, "3,500+ employees; 75+ offices; 190+ countries", "Current company page", medium, "Public scale figures are company-claimed rather than audited."]
      - [Network reach, ">7bn devices; 10k+ connections; 800+ direct operator connections", "2026 official news pages", high, null]
      - [Headquarters framing, "Vodnjan, Croatia in 2026 release datelines; London, U.K. in IDC 2022 profile", "Mixed 2022-2026", medium, "Operating base versus corporate headquarters is not fully reconciled in the assigned pool."]
      - [Customer count, null, "Mixed 2022-2026", low, "IDC cited around 7,500 enterprises in 2022, while a 2026 RCS release cites 7.3k unique brands in one workflow; these are not directly comparable."]
      - [Valuation / total raised / debt, null, "2026 evidence pack", low, "No retained source in this chapter’s assigned pool provides current valuation, cumulative capital raised, investor roster, or debt/covenant detail."]
    notes: >-
      Snapshot uses the freshest retained public evidence in this pool; null means the
      chapter lacks a verifiable current number rather than implying zero.
    claimRefs: [CO002, CO003, CO005, CO006, CO013, CO015, CO016]
  - id: TO002
    title: Leadership and founder table
    columns: [Person, Role, Background / evidence, Founder-market fit or coverage, Key-person dependency]
    rows:
      - ["Silvio Kutić", "CEO and co-founder", "Named in multiple 2026 official Infobip pages and releases.", "Commercial and company-building continuity from 2006 founding through current AI-first repositioning.", high]
      - ["Izabel Jelenić", "CTO and co-founder", "Named in 2026 official boilerplate as current co-founder leader.", "Technical and platform-architecture continuity across CPaaS, identity, and AgentOS-era product scope.", high]
      - ["Dave Boddington", "RCS Business Unit Head", "Quoted in the July 2026 RCS growth release.", "Signals functional depth in a major growth product line beyond the founders.", medium]
    notes: >-
      Public evidence names only a narrow slice of leadership; absence of board and wider
      executive disclosure should not be read as absence of those roles.
    enumerationScope:
      coverage: partial
      basis: "Rows include only leaders explicitly named in the retained 2026 public materials and assigned historical analyst profile."
    claimRefs: [CO002, CO006, CO014]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    rows:
      - ["Silvio Kutić", "CEO / co-founder", "Public face of strategy and scaling; likely key influence on financing and commercial direction.", "Confirm current ownership, board rights, and succession depth."]
      - ["Izabel Jelenić", "CTO / co-founder", "Anchors product and technical continuity across the core platform and AI positioning.", "Confirm delegated engineering leadership and platform resiliency beyond founder oversight."]
      - ["Telecom operator partners", "Connectivity suppliers and route partners", "800+ direct operator connections and broader network access underpin delivery economics and moat claims.", "Test concentration, pricing power, and contract durability across top operator relationships."]
      - ["Channel and technology partners", "Indirect distribution and solution ecosystem", "IDC described 280+ channel partners plus major software and product alliances.", "Quantify active partner contribution, margin profile, and partner churn."]
      - ["SAP", "Enterprise workflow partner", "October 2026 partnership embeds Infobip’s RCS channel in SAP Engagement Cloud and makes Infobip the managed-service layer.", "Measure whether the partnership is strategic proof, pipeline source, or material revenue driver."]
    notes: >-
      This is a stakeholder map rather than a cap table because the assigned source pool
      does not provide verifiable current investor, debt, or preference-stack disclosure.
    enumerationScope:
      coverage: partial
      basis: "Rows capture the most decision-relevant stakeholders named in retained public sources, not an exhaustive investor or governance register."
    claimRefs: [CO006, CO008, CO009, CO014]
