figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning suggests Infobip sits at the high-breadth, lower-transparency end of the
      market, while regional specialists and developer-first incumbents can look commercially
      simpler but narrower in this evidence set.
    data:
      xAxis:
        title: Breadth of channel, workflow, and infrastructure coverage (ordinal 1-5)
      yAxis:
        title: Commercial accessibility and self-service clarity (ordinal 1-5)
      points:
        - label: Infobip
          x: 5
          y: 2
          note: Broadest stack in the pool, but complete TCO still depends on quote-led modules, discounts, and services.
        - label: Twilio / Vonage-style incumbents
          x: 4
          y: 4
          note: Treated as the self-service benchmark in the review evidence, with less EU-governance differentiation for sensitive buyers.
        - label: Kaleyra / Tata
          x: 3
          y: 2
          note: Multichannel peer with meaningful feature depth, but pricing and implementation still lean quote-led.
        - label: LINK Mobility / websms
          x: 2
          y: 4
          note: Narrower public breadth in this pool, but starting commercial signals are clearer in published regional plans.
        - label: Oracle/SAP/telco hybrids
          x: 3
          y: 2
          note: Bundle leverage and installed-base access matter, but stand-alone competitive shape is less visible in public evidence.
        - label: Internal build / point solution
          x: 1
          y: 4
          note: Simpler for narrow workloads, but weaker on integrated omnichannel, routing, and carrier depth.
    approximationNotes: >-
      Scores are an evidence-backed ordinal synthesis of public breadth and commercial clarity, not
      measured market share, win rate, or benchmark output. Unsupported rival cells were kept low
      precision rather than being normalized into faux certainty.
    claimRefs: [CP001, CP003, CP004, CP006, CP007, CP008, CP009, CP014]
callouts:
  - calloutType: strength
    title: Infrastructure and workflow breadth are the core moat
    body: >-
      The evidence supports a moat built on direct operator reach, telco products, multichannel
      orchestration, and adjacent modules rather than on one API alone. That bundle is hardest to
      replicate for enterprises that need cross-border delivery, regulated messaging, and multiple
      workflows in one vendor stack.
    claimRefs: [CP003, CP004, CP011, CP012]
  - calloutType: risk
    title: Simpler rivals can win where procurement prioritizes clarity over scope
    body: >-
      Infobip's recurring competitive risk in this pool is not missing channels but commercial and
      operational complexity. Quote-led TCO, onboarding effort, and mixed support sentiment give
      regional specialists and developer-first incumbents room to win lighter or more cost-sensitive
      workloads.
    claimRefs: [CP008, CP009, CP010, CP013, CP014]
