      - ["Kaleyra / Tata", "Usage-based CPaaS with prepaid or quoted enterprise pricing by channel and destination", "Core multichannel CPaaS plus verify, chatbot, and flow layers", "Concrete destination tariffs and enterprise discounts are not public", "Direct pricing comparison with Infobip is possible in structure, but not with confidence on all-in contract cost"]
      - ["LINK Mobility / websms", "Usage-based messaging with published regional setup, monthly, deposit, or portal-plan entry prices in some offers", "SMS-centric and multichannel portal or CPaaS access depending on package", "Full enterprise omnichannel contracts and many cross-border rates remain custom", "Regional buyers may get a clearer starting budget than they do from Infobip, even if long-run TCO still depends on traffic mix"]
      - ["Oracle/SAP/telco hybrids", "Not directly itemized in this pool; likely bundled, contract, or adjacent-service led depending on account", "Channel delivery embedded into a broader suite, carrier, or voice stack", "Public head-to-head pricing is not supported by the assigned evidence", "Their threat is bundle leverage and installed-base access more than transparent stand-alone pricing"]
      - ["Internal build / point solution", "Engineering time, registration work, and vendor pass-throughs dominate, but the assigned pool does not quantify a standard price curve", "Narrower control or single-channel coverage rather than a full integrated stack", "No standardized public TCO benchmark is present in the assigned pool", "Internal build can look simpler for narrow use cases, but it weakens Infobip's main integrated-platform comparison rather than disproving it"]
    notes: >-
      This table preserves where public evidence stops. It compares commercial structure and
      visibility, not realized net price, and uses Unknown or narrative caveats when the pool lacks
