    notes: >-
      This is a public-evidence classification table rather than a complete market census.
      Scale, funding, and pricing are preserved only where the assigned pool explicitly supports
      them; unknown or mixed account roles are left as narrative limitations rather than guessed.
    claimRefs: [CP001, CP004, CP005, CP006, CP007, CP011, CP014]
