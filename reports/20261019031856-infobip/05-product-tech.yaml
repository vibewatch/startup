schemaVersion: "report-v2"
artifact: product-tech
slug: infobip
runDate: "2026-10-19"
company:
  name: Infobip
chapter:
  number: 5
  title: Product & Technology
  summary: Infobip combines channel APIs, orchestration, managed carrier operations, and engagement applications in a broad CPaaS stack. Current evidence shows credible RCS deployment scale and enterprise integration breadth, while independently verified reliability history, control scope, and developer-community depth remain material diligence gaps.
sections:
  - id: product-surface-and-workflows
    title: Product surface and customer workflows
    body: >-
      Infobip is delivered as a communications platform rather than a single messaging
      SKU. The reviewed product material spans programmable channels, identity and
      authentication, contact-center tooling, workflow orchestration, and managed
      deployment support. CPaaS X is the clearest infrastructure-oriented surface:
      granular APIs automate provisioning, campaign registration, and client-level
      reporting, while the Messages API sequences channels and applies failover.
      At the application layer, the SAP integration makes RCS a native engagement
      channel with rich media, verified senders, and two-way interactions. This
      breadth can consolidate vendors and accelerate launches, but it also increases
      implementation, governance, and module-selection work for buyers.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: architecture-and-delivery-model
    title: Architecture and delivery model
    body: >-
      The public architecture resolves into six functional layers: enterprise
      applications, engagement products, orchestration, channel APIs, managed
      deployment operations, and carrier connectivity. The strongest disclosed
      differentiator is operational control over routing and launch work rather than
      a novel protocol. Infobip says it has more than 800 direct operator connections
      within more than 10,000 total connections, and it positions itself as both the
      RCS aggregator and managed-service provider. That arrangement can reduce the
      customer's need to coordinate carriers, registration, sender verification, and
      performance reporting separately. Public material does not expose enough
      topology, regional failover, or tenancy detail to validate how these layers
      behave under failure.
    claimRefs: [CE002, CE003, CE005, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity and differentiation
    body: >-
      RCS provides the clearest current maturity signal. Infobip reported 169.3%
      traffic growth between the first halves of 2025 and 2026, more than 7,300
      unique brands submitting registration requests, and 14,000 successful agent
      launches in 2026. Those are company-issued operating measures, not independently
      audited market share or customer-retention data, but they indicate repeatable
      launch operations beyond pilot-only positioning. Gartner Peer Insights showed
      a 4.6 rating across 113 ratings at retrieval, which supports product acceptance
      while remaining a self-selected review sample. AgentOS and CXOP extend the
      roadmap toward AI-led orchestration, but evidence of production adoption and
      measurable automation outcomes was not present in the assigned sources.
    claimRefs: [CE007, CE008, CE009, CE010, CE014]
  - id: reliability-trust-and-diligence
    title: Reliability, trust, and diligence priorities
    body: >-
      Reliability and trust evidence is materially weaker than the product-breadth
      evidence. A comparison page reports that Infobip markets 99.9% uptime and
      operates a public status page, but its methodology is not an independent
      benchmark and the assigned pool contains no incident history, SLA-credit terms,
      audit reports, or certification-scope documents. Gartner Peer Insights also
      includes a complaint that technical support was not prompt, showing that
      implementation quality cannot be inferred from the aggregate rating alone.
      The public GitHub organization yielded only one visible repository in the
      fetched text, last updated in November 2024, so it is a weak proxy for current
      SDK or contributor momentum. Underwriting should require control reports,
      regional architecture, incident statistics, support SLAs, and private developer
      telemetry before treating reliability or security as differentiated.
    claimRefs: [CE011, CE012, CE015, CE016]
callouts:
  - calloutType: strength
    title: Managed RCS execution is the most evidenced product advantage
    body: Infobip combines native enterprise-channel integration with registration, sender verification, reachability assessment, campaign support, and reporting; its 2026 launch counts indicate operational repetition at scale, subject to company-reporting risk.
    claimRefs: [CE004, CE005, CE008, CE009]
  - calloutType: risk
    title: Trust claims outrun the available verification package
    body: The assigned evidence does not establish certification scope, independent uptime history, breach history, or contractual recovery terms, so those controls remain diligence requirements rather than verified strengths.
    claimRefs: [CE011, CE015, CE016]
