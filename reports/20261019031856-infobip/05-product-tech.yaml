      - [CPaaS X, Platforms serving their own customers, Public product with provisioning and reporting APIs, Multi-tenant client configuration and operational automation, Production adoption and API-level SLA]
      - [RCS Business Messaging, Enterprise marketing and service teams, "7.3k registration-request brands and 14k launches reported for 2026", Managed carrier onboarding and verified interactive messaging, Audited launch success and active-production denominators]
      - [AgentOS and CXOP, Customer-experience and service operators, Announced AI-orchestration layer, AI-to-human handoff across communications channels, Production usage and automation accuracy]
      - [Identity authentication and contact center, Security product and service teams, Included in current platform description, Shared communications infrastructure across adjacent workflows, SKU boundaries control scope and attach rates]
    notes: Company-issued product descriptions and operating metrics are separated from review evidence; maturity signals are not audited and private metrics remain diligence gaps.
    claimRefs: [CE001, CE002, CE004, CE006, CE007, CE008, CE009, CE014]
  - id: TE002
    title: Workflow and use-case assessment
    columns: [User job, Current workflow, Infobip solution, Measurable public signal, Limitation]
    rows:
      - [Launch a client messaging capability, Manually provision resources and register campaigns, CPaaS X provisioning and campaign APIs, Faster operation is claimed but not quantified, No public implementation-time benchmark]
      - [Add resilient omnichannel delivery, Build separate channel integrations and fallback logic, Messages API sequencing and failover, No public delivery-rate denominator in assigned evidence, Regional routing behavior is undisclosed]
      - [Activate branded RCS in enterprise engagement, Coordinate channel vendor carrier and campaign systems, Native SAP Engagement Cloud channel plus managed RCS operations, "14k successful agent launches reported in 2026", Metric is company-issued and not tied to retained usage]
      - [Automate customer service conversations, Combine bots channel routing and human escalation, AgentOS supports AI interaction and transfer to an agent, Use cases described but adoption not quantified, Accuracy safety and production-volume evidence missing]
    notes: Benefits are limited to the exact workflow mechanisms in reviewed sources; missing baselines, adoption denominators, and outcome measures are not estimated.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE009]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or component, Role, Dependency, Principal risk]
    rows:
      - [Enterprise integrations, Connect SAP and customer systems to engagement channels, Partner APIs and enterprise data models, Connector changes and implementation complexity]
      - [Orchestration and client controls, Sequence channels configure clients and report consumption, CPaaS X and Messages API, Configuration sprawl and opaque failure behavior]
      - [Channel services, Deliver SMS RCS chat apps email and voice interactions, Carrier and platform-specific channel rules, Uneven market availability and compliance obligations]
      - [Managed RCS operations, Register brands verify senders assess reachability and support campaigns, Operators registries and local launch processes, Manual coordination and launch-time variance]
      - [Connectivity and routing, Reach devices through direct and indirect operator connections, Carrier relationships and routing infrastructure, Concentration outages and unverified failover design]
      - [Trust and operations, Monitor service and govern data handling, Private controls audit scope and support process, Public evidence does not establish certification scope or incident performance]
    notes: This is a functional model derived from reviewed product descriptions, not a verified physical topology; dependencies and risks identify diligence boundaries.
    claimRefs: [CE001, CE002, CE003, CE005, CE013, CE015, CE016]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: A source-derived functional stack from enterprise workflow surfaces down to carrier connectivity, with managed operations bridging product and network layers.
    data:
      layers:
        - label: Enterprise applications
          detail: Customer systems and partner suites consume Infobip capabilities as embedded communications workflows.
          modules: [SAP Engagement Cloud, Customer applications]
        - label: Engagement products
          detail: Business-user products package communications functions into service, identity, and AI-assisted experiences.
          modules: [Contact center, Identity and authentication, AgentOS]
        - label: Orchestration
          detail: Shared controls provision clients, sequence channels, and apply fallback behavior.
          modules: [CPaaS X client controls, Messages API sequencing, Failover logic]
        - label: Channel APIs
          detail: Programmable interfaces expose communications channels to customer and partner applications.
          modules: [SMS, RCS, WhatsApp and chat apps, Email and voice]
        - label: Managed deployment operations
          detail: Operational services coordinate the launch and ongoing execution of enterprise RCS programs.
          modules: [Brand registration, Sender verification, Reachability assessment, Campaign support and reporting]
        - label: Connectivity
          detail: Carrier relationships and routing infrastructure provide device reach beneath the application stack.
          modules: [Direct operator connections, Broader carrier connections]
    approximationNotes: Conceptual functional layering only; the sources do not disclose physical topology, data flows, regional tenancy, or failover implementation.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE013]
