  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk-register
      missingEvidence: >-
        Jurisdiction-by-jurisdiction ownership, approval, and escalation records for major SMS,
        WhatsApp, and RCS registrations across Infobip's largest markets.
      whyItMatters: >-
        Public materials establish that registration ownership and country rules matter, but they
        do not show where portability or approval risk is highest in practice.
      diligencePath: >-
        Request a market-by-market register covering 10DLC, sender IDs, WABA ownership, RCS
        agents, fallback channels, and exception-handling timelines for top enterprise markets.
      relatedQuestionRefs:
        - QR002
        - QR009
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: reliability-disclosure
      missingEvidence: >-
        Public uptime, incident, support-severity, and SLA-credit data by product line, region,
        and customer cohort.
      whyItMatters: >-
        Independent review signals point to support friction, but there is no hard public series
        showing whether reliability or response times are improving as channel scale grows.
      diligencePath: >-
        Request 12- to 24-month incident logs, customer-severity trends, SLA misses, and support
        response-time dashboards for SMS, RCS, and orchestration products.
      relatedQuestionRefs:
        - QR003
        - QR008
        - QR009
    - type: private-evidence-only
      severity: material
      topic: financing-and-concentration
      missingEvidence: >-
        Covenant headroom, liquidity buffers, maturity profile detail, and top-customer or
        top-partner concentration metrics.
      whyItMatters: >-
        The refinancing and profitability inflection look constructive, but the downside case
        cannot be fully underwritten without knowing how much financial or customer concentration
        cushion actually exists.
      diligencePath: >-
        Request lender covenant definitions, quarterly headroom, cash-minimum policies, customer
        concentration by revenue, and partner-sourced pipeline or bookings mix.
