company:
  name: Infobip
chapter:
  number: 7
  title: Risks
  summary: >-
    Infobip's main risks are not generic startup risks but scaled CPaaS execution risks:
    channel-registration portability, cross-border compliance, U.S./RCS concentration, and
    reliance on private-credit financing while public disclosure remains thin. The strongest
    visible mitigants are direct carrier relationships, provisioning/failover tooling, and broader
    ecosystem distribution, but those mitigants do not fully remove dependency, service-quality,
    or disclosure risk.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      The highest-conviction risk is channel and registration portability. Infobip's own migration
      guidance says a CPaaS vendor can control 10DLC registrations, WhatsApp Business Account
      setup, RCS agent definitions, email reputation, and even the multi-tenant provisioning model
      that customers run on. That matters because Infobip is simultaneously pushing harder into
      RCS and broader orchestration: a fast-growing channel mix increases the cost of any
      provisioning error, registration delay, or platform-quality slip. The second risk cluster is
      concentration. Public reporting says the U.S. already generates more than half of group
      revenue, while Infobip's own 2026 RCS update highlights the U.S. as the fastest-growing RCS
      market on its platform. The third cluster is financial resilience and disclosure. Profitability
      improved sharply in 2025, but reported net profit was still thin in absolute terms and the
      latest refinancing increases dependence on private-credit lenders whose covenant headroom is
      not publicly disclosed.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR011
    figureRefs:
      - FR001
  - id: regulatory-and-operational-execution
    title: Regulatory and operational execution
    body: >-
      The public evidence supports a view that Infobip's operating risk is mainly execution and
      compliance risk, not product absence. International SMS and RCS are explicitly described as
      country-specific, registration-heavy workflows that depend on sender identity, carrier
      routing, and ongoing operational support. Infobip's own product messaging frames CPaaS X as
      automation for provisioning, campaign registration, and failover, which is helpful but also a
      signal that those workflows are important enough to automate. Independent buyer signals are
      mixed rather than cleanly positive: one directory profile describes enterprise-led sales,
      negotiated pricing, and weaker U.S. brand recognition versus larger peers, while an
      independent comparison page says support responsiveness and pricing friction recur in public
      reviews. That combination implies durable scale and coverage, but also a nontrivial risk
      that service quality, onboarding friction, or routing complexity can weigh on expansion if
      channel growth outpaces operating discipline.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR009
      - CR010
      - CR013
      - CR014
      - CR015
    tableRefs:
      - TR001
      - TR002
  - id: dependency-financing-and-kill-criteria
    title: Dependency, financing, and kill criteria
    body: >-
      The residual investment risk is that Infobip's scale advantages come bundled with meaningful
      dependencies. IDC's sector view says CPaaS is becoming more competitive and more
      commoditized as vendors converge across CPaaS, CCaaS, and adjacent stacks, so Infobip
      cannot rely on breadth alone. Management's visible mitigation is to deepen ecosystem ties,
      especially around SAP and RCS, and to use direct-operator coverage plus tooling to protect
      reliability and compliance. That helps, but it also makes partner execution material: if SAP
      adoption underwhelms, if RCS registration quality slips, or if private-credit covenants and
      liquidity buffers prove tighter than public reporting suggests, the equity story weakens
      quickly. The practical kill criteria are therefore measurable: deterioration in support or
      routing quality, weaker-than-expected U.S. growth conversion, renewed losses or cash strain,
      or evidence that partner and registration ownership make diversification materially harder
      for large customers than Infobip's sales case implies.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR011
      - CR012
      - CR013
      - CR014
    tableRefs:
      - TR003
