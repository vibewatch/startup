callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      The risk case becomes materially worse if public or customer evidence shows persistent
      support-quality deterioration, channel-registration bottlenecks that slow large launches,
      renewed losses or covenant pressure after the refinancing, or a heavier-than-expected
      dependence on the U.S. or a small set of partner-led channels.
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR008
      - CR010
  - calloutType: insight
    title: Why the risks are manageable but not trivial
    body: >-
      Infobip's direct-operator footprint, global compliance support, and provisioning/failover
      tooling are real mitigants, but the same evidence also shows how operationally dense the
      product stack has become. The company looks more de-risked than an early-stage CPaaS
      vendor, yet still exposed enough that execution, disclosure, and concentration need close
      monitoring.
    claimRefs:
      - CR002
      - CR003
      - CR012
      - CR014
