  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 经营证明和市场顺风支持继续尽调，但当前条款缺失限制了判断确信度。
    data:
      nodes:
        - label: 2025 年盈利拐点
          detail: 收入达到 23.4 亿美元，调整后 EBITDA 达到 2.006 亿美元，经营现金流达到 1.444 亿美元。
        - label: 品类需求顺风
          detail: Gartner 采用情况和分析师增长参考仍指向不断扩大的 CPaaS 需求。
        - label: 分销与产品证明
          detail: SAP、White Label 和 AgentOS 带来企业分销及工作流上行空间信号。
        - label: 规模护城河
          detail: Infobip 仍以 800+ 个直连运营商连接和广泛国际触达作为卖点。
        - label: 价格不透明与摩擦
          detail: 企业定价仍依赖报价，当前私募估值条款也未披露。
        - label: 继续研究建议
          detail: 保持接触，但在将买入纳入投资判断前，要求披露股权结构表、优先权和契约条款。
      edges:
        - from: 2025 profitability inflection
          to: Research-more recommendation
          label: 正面证明但仍不足
        - from: Category demand tailwind
          to: Research-more recommendation
          label: 支持继续尽调
        - from: Distribution and product proof
          to: Research-more recommendation
          label: 上行期权
        - from: Scale moat
          to: Research-more recommendation
          label: 支持质量判断
        - from: Price opacity and friction
          to: Research-more recommendation
          label: 限制判断确信度
