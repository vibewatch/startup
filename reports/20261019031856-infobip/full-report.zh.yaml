              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 默认立场
            body: 继续研究 / 跟踪。Infobip 有足够运营证据留在候选池中，但公开记录仍缺少支撑估值买入决定所需的当前条款。
            calloutType: recommendation
            claimRefs:
