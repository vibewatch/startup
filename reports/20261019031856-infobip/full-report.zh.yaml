          - type: callout
            title: 升级触发条件
            body: 要升级判断，需要披露当前估值、股份数、优先权条款、契约余量和客户质量数据，以确认 2025 年盈利可以在没有 隐性稀释或再融资压力的情况下持续复合增长。
            calloutType: assumption
            claimRefs:
