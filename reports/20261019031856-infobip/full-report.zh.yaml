        title: 领导层、生态与治理信号
        blocks:
          - type: paragraph
            body: >-
              保留的 2026 年证据仍以创始人为中心。多份当前官方页面仍将 Silvio Kutić 和 Izabel Jelenić 列为领导公司的
              联合创始人，这支持了连续性，但也意味着产品和战略高层存在明显的关键人物依赖。IDC 的资料补充了 Infobip 如何通过合作伙伴而非仅靠直销实现规模化：截至 2021
              年，公司已建立广泛的渠道、技术、产品、咨询和电信 生态，渠道合作伙伴超过 280 家。当前与 SAP 的合作证据表明，这套生态逻辑延续到了 2026 年。不过，治理
              透明度弱于运营规模透明度。指定来源池没有提供当前公开董事会名单、控制权摘要，或关于近期领导层变动的 可靠公开来源，因此这些仍是尽调问题，而不是本章已确定的事实。
