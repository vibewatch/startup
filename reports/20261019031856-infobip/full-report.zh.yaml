  - id: FI001
    title: 从基础设施到毛利转化的收入模式桥接
    type: flow
    summary: 公开证据支持分层变现栈，而不是一份已披露且经审计的收入桥接表。
    data:
      nodes:
        - id: network
          label: 运营商与渠道接入
          detail: 800+ 家运营商、800+ 个直连运营商连接，以及 9,700+ 个全球连接
        - id: traffic
          label: 可编程流量
          detail: SMS、RCS、WhatsApp、语音、邮件和视频均按使用量计费
        - id: modules
          label: 软件模块
          detail: 可选的互动、聊天机器人、联络中心和编排订阅
        - id: services
          label: 上线与托管服务
          detail: 集成、实施、培训、上线和合作伙伴支持
        - id: spend
          label: 客户支付给 Infobip 的支出
          detail: 流量费用、模块订阅费和范围限定的服务费组合
        - id: gross-profit
          label: 毛利转化
          detail: 受渠道组合、运营商转付、支持负荷和区域复杂度影响
      edges:
        - from: network
          to: traffic
          label: 支撑
        - from: traffic
          to: modules
          label: 延伸至
        - from: modules
          to: services
          label: 需要
        - from: services
          to: spend
          label: 变现为
        - from: spend
          to: gross-profit
          label: 转化为
    approximationNotes: 这是根据公开产品和采购证据综合出的定性经营桥接；公司没有在指定来源中披露数字化收入或毛利率瀑布图。
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI011
      - CI013
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 这是一套源自公开资料的功能栈，从企业工作流界面一路到底层运营商连接，由托管运营衔接产品层和网络层。
    data:
      layers:
        - label: 企业应用
          detail: 客户系统和合作伙伴套件将 Infobip 能力作为嵌入式通信工作流使用。
          modules:
            - SAP Engagement Cloud
            - 客户应用
        - label: 互动产品
          detail: 面向业务用户的产品将通信功能封装进服务、身份和 AI 辅助体验。
          modules:
            - 联络中心
            - 身份与认证
            - AgentOS
        - label: 编排
          detail: 共享控制项为客户开通服务、编排渠道顺序，并应用回退机制。
          modules:
            - CPaaS X 客户控制项
            - Messages API 编排
            - 故障切换逻辑
        - label: 渠道 API
          detail: 可编程接口向客户和合作伙伴应用开放通信渠道。
          modules:
            - SMS
            - RCS
            - WhatsApp 与聊天应用
            - 邮件与语音
        - label: 托管部署运营
          detail: 运营服务协调企业 RCS 项目的上线和持续执行。
          modules:
            - 品牌注册
            - 发件人验证
            - 可达性评估
            - 活动支持与报告
        - label: 连接能力
          detail: 运营商关系和路由基础设施在应用栈之下提供设备触达。
          modules:
            - 直连运营商连接
            - 更广泛的运营商连接
    approximationNotes: 仅为概念性的功能分层；来源没有披露物理拓扑、数据流、区域租户安排或故障切换实现。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，Infobip 从渠道接入延伸到编排、报告和按地域扩张。
    data:
      items:
        - label: 评估覆盖和合规
          actor: 企业买方或平台运营方
          segment: Multi-country messaging programs
          touchpoints:
            - 比较渠道触达、运营商连接和本地合规支持
            - 验证现有 CRM 或联络中心栈能否继续保留
          note: 早期筛选取决于地域覆盖和现有系统，而不只是 API 价格。
          tone: neutral
        - label: 从具体渠道项目起步
          actor: 消息或产品运营
          segment: RCS / SMS / MMS use cases
          touchpoints:
            - 在一到两个渠道上线品牌消息或身份验证
            - 尽可能复用现有 API，降低迁移成本
          note: 北美 RCS 上线凸显了现有客户的升级路径。
          tone: positive
        - label: 集成进企业工作流
          actor: CX 平台负责人
          segment: SAP-led enterprise environments
          touchpoints:
            - 将 RCS、SMS 和 WhatsApp 加入互动编排
            - 使用 Infobip 获得注册、验证和活动执行支持
          note: 在当前样本中，SAP 是公开资料里最清晰、且有明确名称的工作流界面。
          tone: positive
        - label: 增加报告和客户级控制
          actor: 平台 / ISV 运营
          segment: Embedded CPaaS customers
          touchpoints:
            - 自动化开通、活动注册和报告
            - 分别配置各个客户，而不是采用一个共享部署
          note: CPaaS X 的定位聚焦单客户规模与运营效率。
          tone: positive
        - label: 扩大地域或相邻渠道
          actor: 区域项目负责人
          segment: Cross-border and voice-enabled accounts
          touchpoints:
            - 增加本地市场支持、语音和更广泛的全渠道路由
            - 利用继承自 Peerless 的触达能力拓展美国市场
          note: 公开证据更强调扩张广度，而不是留存指标。
          tone: positive
        - label: 续约和集中度仍披露不足
          actor: 投资人 / 尽调团队
          segment: Durability assessment
          touchpoints:
            - 索取 NRR、GRR、流失率、合同期限和头部客户构成
            - 将渠道使用增长与持久的 cohort 经济性分开
          note: 公开来源没有披露完成闭环所需的续约质量指标。
          tone: warning
    approximationNotes: null
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
