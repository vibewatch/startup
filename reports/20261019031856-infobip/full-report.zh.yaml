  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方动向
        blocks:
          - type: paragraph
            body: >-
              相关市场边界从核心 CPaaS 基础设施开始——消息、语音、邮件、认证和路由 API——但公开证据显示，买方正越来越 多地采购围绕这些管道的更广泛编排层。CX Today 总结的 Gartner CPaaS
              定义覆盖语音、短信、邮件、消息应用、 视频、安全、认证和自动化；Infobip 自己的互动材料则把产品栈定位为一套围绕渠道和客户数据管理客户旅程的
              软件套件。从尽调角度看，市场不只是交易型消息量，也包括帮助企业团队跨渠道设计、触发和治理对话的 工作流软件。因此，买方不再局限于开发者，还包括企业 CX、营销、服务及受监管运营负责人；他们对合规、
              编排和上线速度的重视，不亚于对原始 API 访问的重视。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
      - number: '2.2'
        title: 市场规模视角与细分结构
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持 CPaaS 存在真实的 TAM，但不足以精确估算 Infobip 专属的 SAM 或 SOM。CX Today 基于 Gartner 的整理显示，2025 年市场规模为 $14.88
              billion，预计 2026 年增至 $17.03 billion；Grand View Research 则预计 2030 年达到 $86.26 billion，2025—2030 年 CAGR 为
              28.7%。这些数字适合作为方向性视角，而不是串成一条 单一瀑布：它们来自不同年份和方法论，且两个来源都没有拆出能与 Infobip 地域组合、渠道优势或产品模块清晰
              对应的支出子集。更有决策价值的是市场内部的细分结构。Grand View 称解决方案已经占据大部分支出，大型企业 仍是最大买方群体，最快增长来自中小企业采用和医疗等垂直行业。做估值时，这种结构比重复一个宽泛的
              TAM 数字更重要。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM016
      - number: '2.3'
        title: 采用驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              Infobip 的采用逻辑在企业需要更丰富渠道、更低集成成本以及跨多系统的工作流控制时最强。公司自己的 CPaaS X 材料强调自动配置、渠道编排和故障切换；与 SAP
              的合作则显示，这套基础设施可以嵌入更广泛的企业互动软件。 RCS 是近期最清晰的需求驱动因素：Juniper 预计 Apple 支持 RCS 将提升富媒体流量的价值主张，Infobip 自己 2026 年 7
              月的公告也称 RCS 流量和上线量大幅增长。不过，买方摩擦仍然明显。客户评价指出支持响应延迟、 运营可见性不完善；独立定价评价显示，完整 TCO 仍取决于报价折扣、实施投入和模块打包，而不是透明的统一标价。
              结果是：市场规模大、增长有依据，但变现取决于企业执行质量和打包工作流的采用，而不只是无差别的消息量。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 市场叙事为何影响估值
            body: Infobip 的上行空间不在于证明 CPaaS 是大市场，而在于把企业编排、RCS 和受监管工作流需求转化为持久的软件与 流量支出。
            calloutType: insight
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM015
          - type: callout
            title: 为何仅看 TAM 会高估确定性
            body: 公开来源没有披露 Infobip 专属的 SAM 或 SOM，买方经济性仍取决于实施投入、支持质量和报价驱动的打包方式。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局覆盖直接同业、既有厂商、套件与替代方案
        blocks:
          - type: paragraph
            body: >-
              指定来源显示，Infobip 竞争的并非狭窄的短信 API 利基。IDC 将其与 Twilio、MessageBird、Bandwidth、Sinch 和 CM.com 等 CPaaS
              纯玩家并列，也将其与软件、电信和 VoIP 提供商放在一起；这些厂商在同一客户账户中可能从 合作伙伴变成供应商，再变成竞争对手。第三方评价证据进一步支持这一判断：它把 Infobip 描绘成 Twilio、
              Vonage 和 MessageBird 的欧洲替代方案，而不只是另一个区域网关。实际买方的选项包括全球开发者领域既有厂商、 区域消息专业厂商、套件内置渠道供应商、内部自建路径以及现有单渠道工具，而不只是知名
              CPaaS 厂商。
            claimRefs:
              - CP001
              - CP002
              - CP014
