chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营版图
        blocks:
          - type: paragraph
            body: >-
              Infobip 当前官方叙述对产品范围保持一致：公司销售的是云通信平台，覆盖可编程渠道、全渠道互动、身份与认证、 联络中心工作流及新兴的 AI 驱动编排层。当前最强的规模信号来自网络触达，而非收入披露：2026
              年官方材料 多次称其可通过 10k+ 条连接触达超过 70 亿台设备，其中包括 800+ 个直连运营商关系。公开版图指标总体很大， 但并未完全统一。公司页面目前称有 3,500+ 名员工、75+ 间办公室，覆盖
              190+ 个国家；IDC 较早的厂商资料则 称员工超过 3,700 人、办公室超过 70 间。因此，后续章节可以把 Infobip 视为具规模的全球运营商，但不应把
              某一个精确的当前员工数或客户总数当作经审计事实。
