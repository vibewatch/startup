          x: 5
          'y': 2
          note: 这组样本中产品栈最广，但完整 TCO 仍取决于按报价定价的模块、折扣和服务。
        - label: Twilio / Vonage 式既有厂商
          x: 4
          'y': 4
          note: 在评价证据中被视为自助服务基准，但对敏感买方而言，欧盟治理差异化较弱。
        - label: Kaleyra / Tata
          x: 3
          'y': 2
          note: 功能深度可观的多渠道同业，但定价和实施仍主要依赖报价。
        - label: LINK Mobility 与 websms
          x: 2
          'y': 4
          note: 在这组样本中公开覆盖面较窄，但已发布的区域方案让初步商业信号更清晰。
        - label: Oracle/SAP/电信混合厂商
          x: 3
          'y': 2
          note: 捆绑销售杠杆和既有客户基础触达很重要，但公开证据较难看清其独立竞争形态。
        - label: 内部自建 / 点解决方案
          x: 1
          'y': 4
          note: 适合窄场景工作负载，操作更简单，但在整合式全渠道、路由和运营商深度上较弱。
    approximationNotes: 分数是基于证据对公开覆盖面和商业清晰度的序数综合，并非实测市场份额、赢单率或基准结果。缺乏支持的竞品单元保持低精度，没有被强行规范成虚假的确定性。
