            title: 运营规模已成型，但披露存在缺口
            body: Infobip 的规模足以成为全球 CPaaS 市场的重要参与者，但指定公开证据仍把关键身份和规模数据留在带限定的状态， 尚未达到清晰可审计的程度。
            calloutType: insight
