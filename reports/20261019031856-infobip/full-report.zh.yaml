      - number: '1.3'
        title: 里程碑、外部验证与尽调提示
        blocks:
          - type: paragraph
            body: >-
              本章对 Infobip 运营演进的时间线梳理，远比对融资历史的梳理完整。IDC 的历史资料显示，公司围绕美国覆盖、 MNO 安全和开发者生态触达进行了一系列能力建设型收购；2025—2026
              年官方材料则强调市场认可，以及在核心 CPaaS 栈之上推进 AI 优先的重新定位。2026 年 10 月与 SAP 的合作尤其重要，因为它把 Infobip 放进了更大的 企业工作流，而不只是停留在 API
              边缘。主要风险来自指定来源池中薄弱的独立负面记录：现有评价汇总足以提醒 我们检查支持响应和定价摩擦，但不足以证明更广泛的运营失败。融资、资本结构和债务披露仍是更大的未解尽调缺口。
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
