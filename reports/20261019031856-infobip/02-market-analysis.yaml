chapter:
  number: 2
  title: "Market Analysis"
  summary: "Infobip operates inside a broad CPaaS category that now bleeds into engagement, identity, and contact-centre workflows rather than a narrow developer-API niche. Public sizing lenses support a large and fast-growing global market, but the strongest valuation-relevant evidence sits in enterprise, RCS, and workflow-specific adoption filters rather than a clean public SAM or SOM for Infobip."
sections:
  - id: "market-boundary"
    title: "Market boundary and buyer motion"
    body: >-
      The relevant market boundary starts with core CPaaS infrastructure—messaging, voice, email, authentication, and routing APIs—but public evidence shows buyers increasingly procure a wider orchestration layer around those pipes. Gartner’s CPaaS definition, as summarized by CX Today, spans voice, SMS, email, messaging apps, video, security, authentication, and automation, while Infobip’s own engagement materials position the product stack as a software suite that manages journeys across channels and customer data. For diligence, that means the market is not just transactional message volume; it also includes workflow software that helps enterprise teams design, trigger, and govern conversations across channels. The buyer set therefore extends beyond developers into enterprise CX, marketing, service, and regulated-operations owners who care about compliance, orchestration, and time-to-launch as much as raw API access.
    claimRefs: ["CM001", "CM002", "CM008", "CM009", "CM010", "CM012"]
    tableRefs: ["TM001", "TM003"]
  - id: "sizing-lenses"
    title: "Sizing lenses and segment mix"
    body: >-
      Public market data supports a real CPaaS TAM, but not a precise Infobip-specific SAM or SOM. CX Today’s Gartner-based rundown frames a 2025 market of $14.88 billion growing to a forecast $17.03 billion in 2026, while Grand View Research projects $86.26 billion by 2030 at a 28.7% CAGR from 2025 to 2030. Those figures are useful directional lenses, not a single waterfall: they come from different vintages and methodologies, and neither source breaks out the subset of spend that maps cleanly to Infobip’s geographic mix, channel strengths, or product modules. More decision-useful is the segment mix inside the market. Grand View says solutions already account for most spend, large enterprises remain the largest buyer cohort, and the fastest growth comes from SME adoption and verticals such as healthcare. For valuation work, that mix matters more than repeating one broad TAM number.
    claimRefs: ["CM003", "CM004", "CM005", "CM006", "CM007", "CM015", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "drivers-and-constraints"
    title: "Adoption drivers, constraints, and valuation relevance"
    body: >-
      Infobip’s adoption case is strongest where enterprises need richer channels, lower integration effort, and workflow control across multiple systems. The company’s own CPaaS X materials emphasize automated provisioning, channel orchestration, and failover, and the SAP partnership shows how that infrastructure can be embedded inside broader enterprise engagement software. RCS is the clearest near-term demand vector: Juniper expects Apple’s support for RCS to expand the value proposition for rich media traffic, and Infobip’s own July 2026 release reported sharp RCS traffic and launch growth. Even so, buyer friction remains meaningful. Customer reviews point to support-response delays and imperfect operational visibility, while independent pricing reviews show that full TCO still depends on quote-driven discounts, implementation effort, and module packaging rather than a single transparent list price. The result is a large market with credible growth, but one where monetization depends on enterprise execution quality and packaged workflow adoption rather than undifferentiated message volume alone.
    claimRefs: ["CM010", "CM011", "CM012", "CM013", "CM014", "CM015"]
