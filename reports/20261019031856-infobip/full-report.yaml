  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans direct peers, incumbents, suites, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned sources show that Infobip does not compete in a narrow SMS API niche. IDC places it against
              direct CPaaS pure plays such as Twilio, MessageBird, Bandwidth, Sinch, and CM.com, but also against
              software, telco, and VoIP providers whose role can shift from partner to supplier to competitor in the
              same account. Third-party review evidence reinforces that framing by presenting Infobip as a European
              alternative to Twilio, Vonage, and MessageBird rather than just another regional gateway. In practice,
              that means the buyer's realistic option set includes global developer incumbents, regional messaging
              specialists, suite-native channel providers, internal build paths, and status-quo single-channel tools,
              not just named CPaaS vendors.
            claimRefs:
              - CP001
              - CP002
              - CP014
