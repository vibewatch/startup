      - number: '1.3'
        title: Milestones, external validation, and diligence flags
        blocks:
          - type: paragraph
            body: >-
              The chapter can date Infobip’s operating evolution much better than it can date financing history. IDC’s
              historical profile shows a pattern of capability-building acquisitions around U.S. coverage, MNO security,
              and developer ecosystem reach, while 2025-2026 official materials emphasize market recognition and an
              AI-first repositioning layered on top of the core CPaaS stack. The October 2026 SAP partnership is
              particularly important because it places Infobip inside a larger enterprise workflow rather than only at
              the API edge. The main caution comes from the thin independent adverse record in the assigned pool: the
              available review aggregation is enough to flag support-responsiveness and pricing-friction checks, but not
              enough to prove a broader operational failure. Financing, capital structure, and debt disclosure remain
              the larger unresolved diligence holes.
            claimRefs:
