chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Infobip’s current official narrative is consistent on what the company sells: a cloud communications
              platform spanning programmable channels, omnichannel engagement, identity and authentication, contact
              centre workflows, and newer AI-led orchestration layers. The strongest current scale signal is network
              reach rather than revenue disclosure: official 2026 materials repeat capacity to reach more than seven
              billion devices through 10k+ connections, including 800+ direct operator relationships. Public footprint
              metrics are directionally large but not perfectly harmonized. The company page currently cites 3,500+
              employees, 75+ offices, and presence in 190+ countries, while IDC’s older vendor profile cited more than
              3,700 employees and more than 70 offices. That means later chapters can treat Infobip as a scaled, global
              operator, but should not present one precise current headcount or customer total as audited fact.
