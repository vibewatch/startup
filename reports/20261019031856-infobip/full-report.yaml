      - number: '4.3'
        title: Public traction is visible in RCS growth, but core financial disclosure is not
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction data in the assigned evidence comes from one product wedge: RCS. Infobip
              said RCS for Business traffic grew 169.3% from H1 2025 to H1 2026, with 7.3k unique brands processing
              registration requests and 14k successful launches over the same period. The SAP announcement also shows
              that Infobip is not only selling channel access, but packaging RCS, SMS, and WhatsApp into a partner
              workflow where enterprise orchestration and managed-service support can expand wallet share. What remains
              missing is the bridge from those activity signals to company-level financial outcomes. Across the official
              evidence retained for this chapter, Infobip highlights infrastructure, product breadth, and services
              rather than current financial statements, so public traction is real but not yet convertible into
              disclosed revenue quality, margin, or liquidity confidence.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI016
      - number: '4.4'
        title: Margin path may improve with mix, but liquidity and realized economics remain blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, the positive case is straightforward: Infobip appears to own enough carrier access, workflow
              breadth, and implementation depth to monetize more than raw message throughput, which should create
              optionality for higher-value software and service attach over time. The negative case is equally clear:
              the public record still does not show how much of revenue is pass-through traffic, what gross margins
              those channels earn, how expensive deployment and support are, or whether current liquidity is ample for
              the next investment cycle. Because pricing and package detail remain partly quote-dependent, and because
              third-party buyer commentary still flags support and billing friction, this chapter supports revenue-model
              credibility but not full underwriting confidence. The right diligence posture is to treat Infobip as
              commercially scaled yet financially under-disclosed until management provides current management accounts,
              retention and cohort data, and a debt-and-runway view.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution breadth should support monetization breadth
            body: >-
              Carrier access, partner embedding, and module breadth suggest Infobip can sell deeper workflow value than
              raw traffic alone, especially in enterprise and telecom channels.
            calloutType: strength
            claimRefs:
              - CI007
              - CI010
              - CI011
          - type: callout
            title: Liquidity underwriting is still blocked
            body: >-
              Public evidence does not reveal current revenue mix, gross margin, cash, burn, or debt capacity, while
              third-party buyer commentary still flags pricing and support friction.
            calloutType: risk
            claimRefs:
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Infobip is delivered as a communications platform rather than a single messaging SKU. The reviewed product
              material spans programmable channels, identity and authentication, contact-center tooling, workflow
              orchestration, and managed deployment support. CPaaS X is the clearest infrastructure-oriented surface:
              granular APIs automate provisioning, campaign registration, and client-level reporting, while the Messages
              API sequences channels and applies failover. At the application layer, the SAP integration makes RCS a
              native engagement channel with rich media, verified senders, and two-way interactions. This breadth can
              consolidate vendors and accelerate launches, but it also increases implementation, governance, and
              module-selection work for buyers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
