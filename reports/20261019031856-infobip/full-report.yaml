  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Operating proof and market tailwinds support continued diligence, but missing current terms cap conviction.
    data:
      nodes:
        - label: 2025 profitability inflection
          detail: >-
            Revenue reached $2.34 billion, adjusted EBITDA reached $200.6 million, and operating cash flow reached
            $144.4 million.
        - label: Category demand tailwind
          detail: Gartner adoption and analyst-growth references still point to expanding CPaaS demand.
        - label: Distribution and product proof
          detail: SAP, White Label, and AgentOS create enterprise distribution and workflow-upside signals.
        - label: Scale moat
          detail: Infobip still markets 800+ direct operator connections and broad international reach.
        - label: Price opacity and friction
          detail: Enterprise pricing remains quote-dependent and current private valuation terms are undisclosed.
        - label: Research-more recommendation
          detail: Stay engaged, but require disclosed cap-table, preference, and covenant terms before underwriting a buy.
      edges:
        - from: 2025 profitability inflection
          to: Research-more recommendation
          label: positive proof but not sufficient
        - from: Category demand tailwind
          to: Research-more recommendation
          label: supports continued diligence
        - from: Distribution and product proof
          to: Research-more recommendation
          label: upside optionality
        - from: Scale moat
          to: Research-more recommendation
          label: supports quality
        - from: Price opacity and friction
          to: Research-more recommendation
          label: caps conviction
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
      - CV012
      - CV015
