    claimRefs:
      - CM003
      - CM004
      - CM006
      - CM007
      - CM016
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning suggests Infobip sits at the high-breadth, lower-transparency end of the market, while
      regional specialists and developer-first incumbents can look commercially simpler but narrower in this evidence
      set.
    data:
      xAxis:
        title: Breadth of channel, workflow, and infrastructure coverage (ordinal 1-5)
      yAxis:
        title: Commercial accessibility and self-service clarity (ordinal 1-5)
      points:
        - label: Infobip
          x: 5
          'y': 2
          note: Broadest stack in the pool, but complete TCO still depends on quote-led modules, discounts, and services.
        - label: Twilio / Vonage-style incumbents
          x: 4
          'y': 4
          note: >-
            Treated as the self-service benchmark in the review evidence, with less EU-governance differentiation for
            sensitive buyers.
        - label: Kaleyra / Tata
          x: 3
          'y': 2
          note: Multichannel peer with meaningful feature depth, but pricing and implementation still lean quote-led.
        - label: LINK Mobility / websms
          x: 2
          'y': 4
          note: >-
            Narrower public breadth in this pool, but starting commercial signals are clearer in published regional
            plans.
        - label: Oracle/SAP/telco hybrids
          x: 3
          'y': 2
          note: >-
            Bundle leverage and installed-base access matter, but stand-alone competitive shape is less visible in
            public evidence.
        - label: Internal build / point solution
          x: 1
          'y': 4
          note: Simpler for narrow workloads, but weaker on integrated omnichannel, routing, and carrier depth.
    approximationNotes: >-
      Scores are an evidence-backed ordinal synthesis of public breadth and commercial clarity, not measured market
      share, win rate, or benchmark output. Unsupported rival cells were kept low precision rather than being normalized
      into faux certainty.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP006
      - CP007
      - CP008
      - CP009
      - CP014
  - id: FI001
    title: Revenue model bridge from infrastructure to gross-profit conversion
    type: flow
    summary: Public evidence supports a layered monetization stack rather than a disclosed audited revenue bridge.
    data:
      nodes:
        - id: network
          label: Carrier and channel access
          detail: 800+ carriers, 800+ direct operator connections, and 9,700+ global connections
        - id: traffic
          label: Programmable traffic
          detail: Usage-based billing across SMS, RCS, WhatsApp, voice, email, and video
        - id: modules
          label: Software modules
          detail: Optional engagement, chatbot, contact-centre, and orchestration subscriptions
        - id: services
          label: Onboarding and managed services
          detail: Integration, implementation, training, onboarding, and partner support
        - id: spend
          label: Customer spend to Infobip
          detail: Blend of traffic fees, module subscriptions, and scoped service fees
        - id: gross-profit
          label: Gross-profit conversion
          detail: Sensitive to channel mix, carrier pass-through, support load, and regional complexity
      edges:
        - from: network
          to: traffic
          label: enables
        - from: traffic
          to: modules
          label: expands into
        - from: modules
          to: services
          label: requires
        - from: services
          to: spend
          label: monetized as
        - from: spend
          to: gross-profit
          label: converts into
    approximationNotes: >-
      This is a qualitative operating bridge synthesized from public product and procurement evidence; the company does
      not publish a numeric revenue or gross-margin waterfall in the assigned sources.
