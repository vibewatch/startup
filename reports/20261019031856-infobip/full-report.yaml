      - number: '3.3'
        title: Switching costs and channel access strengthen the moat more than price transparency does
        blocks:
          - type: paragraph
            body: >-
              The evidence points to durability that comes less from public list prices and more from operating depth.
              IDC says Infobip sells direct, through partners, and through self-service, while also maintaining a large
              telco, platform, and channel ecosystem; the SAP announcement extends that picture into current suite
              integration. Once a customer standardizes on multiple channels, sender assets, country-specific
              registrations, routing logic, and CRM or contact center integrations, migration becomes more than a tariff
              comparison. Review evidence on Infobip, Kaleyra, and LINK Mobility all emphasizes implementation effort,
              number or sender setup, and channel-specific onboarding, which makes multi-homing possible but not
              costless.
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP015
      - number: '3.4'
        title: Durability is credible, but commoditization and execution risk are real
        blocks:
          - type: paragraph
            body: >-
              Infobip's moat looks most credible where buyers need regulated, cross-border, omnichannel delivery and
              want fewer stitched-together point solutions. The same sources, however, show why that advantage is not
              absolute. EuropeanPurpose says the platform can feel overbuilt for simpler teams and less self-serve than
              Twilio-style alternatives, while both RFP comparison pages flag support, pricing, and implementation
              opacity as recurring buyer checks. Recent company materials show continued AI and platform investment, but
              the pool still lacks independent 2026 win-rate, churn, or displacement data versus named rivals, so moat
              durability should be judged as infrastructure- and workflow-led rather than as conclusively proven
              market-share momentum. A current third-party chronology corroborates the February 2026 AgentOS launch, but
              product cadence alone does not establish competitive share gains.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure and workflow breadth are the core moat
            body: >-
              The evidence supports a moat built on direct operator reach, telco products, multichannel orchestration,
              and adjacent modules rather than on one API alone. That bundle is hardest to replicate for enterprises
              that need cross-border delivery, regulated messaging, and multiple workflows in one vendor stack.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
          - type: callout
            title: Simpler rivals can win where procurement prioritizes clarity over scope
            body: >-
              Infobip's recurring competitive risk in this pool is not missing channels but commercial and operational
              complexity. Quote-led TCO, onboarding effort, and mixed support sentiment give regional specialists and
              developer-first incumbents room to win lighter or more cost-sensitive workloads.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is broad, but disclosed only through product and pricing surfaces
        blocks:
          - type: paragraph
            body: >-
              Infobip's public materials support a multi-layer monetization model rather than a single-message commodity
              business. The company positions the platform as one stack spanning programmable channels,
              customer-engagement software, identity, and contact centre workflows, while operator-facing materials add
              monetization consultancy, partnership models, and network-enablement offers. That breadth matters because
              it implies multiple potential revenue streams—traffic, subscriptions, implementation, and partner
              programs—even though the company does not break out segment revenue in the assigned evidence. The pricing
              evidence is directionally useful: a third-party procurement review describes pay-as-you-go channel billing
              plus optional monthly software subscriptions, but also says exact enterprise discounts and some packaging
              details still require a quote. The result is a credible top-line architecture with limited visibility into
              mix, realized pricing, or gross-to-net conversion.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
