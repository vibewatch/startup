      - number: '4.2'
        title: GTM looks enterprise- and partner-led, with service intensity embedded in delivery
        blocks:
          - type: paragraph
            body: >-
              The cost-to-serve picture looks more like enterprise infrastructure software than pure self-serve API
              vending. CPaaS X emphasizes automated provisioning, campaign registration, onboarding, and per-customer
              reporting, while Infobip separately markets professional services, CX consultancy, and managed-service
              support inside partner integrations such as SAP Engagement Cloud. Those cues suggest a GTM motion that can
              monetize complex deployments and embed deeper into customer workflows, but also one that carries
              onboarding, solution-engineering, compliance, and support labor. Distribution breadth should help: the
              company says it works with more than 800 carriers, 18+ channels, and 9,700+ global connections, which can
              support routing quality and enterprise coverage. Even so, buyer reviews still cite support responsiveness
              and pricing friction, which means the commercial model likely trades simplicity for flexibility as account
              complexity rises.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI011
