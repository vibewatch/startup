      - number: '1.2'
        title: Leadership, ecosystem, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The retained 2026 evidence remains founder-centric. Multiple current official pages still identify Silvio
              Kutić and Izabel Jelenić as the co-founders leading the company, which supports continuity but also
              implies meaningful key-person dependence at the top of product and strategy. IDC’s profile adds useful
              context on how Infobip scales through partnerships rather than only direct selling: it described a broad
              channel, technology, product, consulting, and telco ecosystem, with more than 280 channel partners already
              in place by 2021. Current partnership evidence with SAP shows that ecosystem logic continuing into 2026.
              Governance transparency is weaker than operating scale transparency, however. The assigned source pool
              does not provide a current public board list, control-rights summary, or a reliable public source on
              recent leadership transitions, so those topics remain diligence asks rather than settled chapter facts.
