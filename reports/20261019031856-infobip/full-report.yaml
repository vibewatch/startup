      - number: '5.2'
        title: Architecture and delivery model
        blocks:
          - type: paragraph
            body: >-
              The public architecture resolves into six functional layers: enterprise applications, engagement products,
              orchestration, channel APIs, managed deployment operations, and carrier connectivity. The strongest
              disclosed differentiator is operational control over routing and launch work rather than a novel protocol.
              Infobip says it has more than 800 direct operator connections within more than 10,000 total connections,
              and it positions itself as both the RCS aggregator and managed-service provider. That arrangement can
              reduce the customer's need to coordinate carriers, registration, sender verification, and performance
              reporting separately. Public material does not expose enough topology, regional failover, or tenancy
              detail to validate how these layers behave under failure.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE013
