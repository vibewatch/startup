  - id: FM001
    title: CPaaS market sizing lenses
    type: pyramid
    summary: >-
      Public evidence supports a broad, growing CPaaS TAM, but the strongest growth and valuation signals sit in
      specific buyer and vertical filters rather than a clean public SAM for Infobip.
    data:
      items:
        - label: Global CPaaS market, 2025
          displayValue: $14.88B
