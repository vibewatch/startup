        - Public sources show financing history but not today's private valuation, share count, or preference stack.
        - Latest cap table, debt summary, and any recent primary or secondary transaction terms.
      - - 'Anti-thesis: commercial friction can compress realized value'
        - Independent review sources still cite quote-dependent pricing and support or onboarding friction.
        - Renewal, churn, NRR, and customer-support quality data by cohort and segment.
    notes: >-
      Rows separate company-quality arguments from priceability arguments; missing commercial and capital-structure data
      is treated as a diligence gap rather than filled with estimated values.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV012
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          2025 profitability compounds while SAP and partner distribution deepen enterprise adoption and AI-led
          workflows scale.
        - >-
          Only supportable if disclosed terms imply upside from profitable growth rather than a fully priced late-stage
          premium.
        - Execution on AgentOS monetization and no hidden dilution or covenant stress.
        - Evidence improves if 2026 disclosures show sustained cash generation and clean terms.
      - - Base
        - Operating quality stays solid but current private terms remain undisclosed.
        - >-
          Business quality can justify continued diligence but not a numeric underwriting range from public evidence
          alone.
        - Entry multiple may already absorb much of the operating improvement.
        - Most likely while valuation and preference data stay private.
      - - Bear
        - >-
          Growth slows or refinancing and preference complexity absorb more enterprise value than the headline operating
          trend suggests.
        - Downside is hardest to quantify publicly because liquidation order and covenant headroom are not disclosed.
        - Down-round risk, slower partner conversion, customer-quality slippage, or delayed exit window.
        - Becomes more plausible if profitability stalls or disclosures reveal aggressive stack terms.
    notes: >-
      Scenario logic is qualitative because public evidence supports operating and market direction better than current
      price terms; no numeric valuation range is claimed without a current cap table or transaction reference.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV013
      - CV014
      - CV015
