company:
  name: Infobip
chapter:
  number: 6
  title: Customers
  summary: >-
    Infobip's public customer evidence supports a broad enterprise and platform-buyer base
    with visible RCS adoption and cross-sell paths into SAP and Peerless accounts, but the
    proof set is still weighted toward company-authored launches rather than disclosed
    retention, concentration, or logo-level production references.
sections:
  - id: customer-base-and-segments
    title: Customer base and buyer segments
    body: >-
      The retained public evidence points to three visible customer motions. First, Infobip
      sells a broad omnichannel engagement stack to enterprise CX, marketing, and service
      teams that need SMS, voice, chat apps, email, authentication, and contact-center
      functions on one platform. Second, CPaaS X is clearly positioned for platform and ISV
      buyers that need per-client onboarding, provisioning, and reporting instead of a
      single-brand console. Third, the Peerless acquisition shows a cross-sell motion into
      an inherited U.S. voice base rather than only net-new self-serve developers. External
      market commentary reinforces that Infobip's go-to-market is more enterprise-outcome
      oriented than purely developer-led, which matters for larger regulated or multi-country
      buyers that prioritize managed execution and compliance support over lowest-friction
      signup.
    claimRefs: [CU001, CU002, CU003, CU009, CU011, CU014, CU015]
    tableRefs: [TU001]
  - id: adoption-and-public-proof
    title: Adoption signals and public proof
    body: >-
      Public adoption proof is strongest around RCS and partner-led distribution surfaces.
      Infobip disclosed 169.3% growth in RCS for Business traffic between H1 2025 and H1
      2026, plus more than 7.3k unique brands processed for RCS registration and 14k
      successful RCS agent launches in 2026. The North America RCS launch adds a specific
      conversion path for existing SMS and MMS customers, while the SAP Engagement Cloud
      integration makes Infobip a native messaging layer inside a major enterprise workflow.
      These are real usage and distribution signals, but they are still channel-specific.
      The public proof does not convert cleanly into disclosed recurring-customer counts,
      production win rates, or retention outcomes by segment.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU012, CU013]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration risks
    body: >-
      The customer thesis is expansion-led, but the durability proof is incomplete. Infobip's
      public materials emphasize channel breadth, geographic reach, compliance help, and
      partner integrations that can expand wallet share over time. External review evidence
      also suggests buyers value the API breadth and implementation quality, yet deeper setup
      can require expert help and support experiences are mixed. More importantly, none of
      the retained public customer sources in this chapter disclose NRR, GRR, churn, contract
      length, top-customer concentration, or channel-partner dependency. That leaves the
      expansion story plausible but not fully underwritten for investment-grade durability
      analysis.
    claimRefs: [CU010, CU013, CU015]
    calloutRefs: []
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale or strategic value
      - Gap
    rows:
      - - Enterprise CX and service teams
        - "Buyer: digital CX / CRM leaders; user: service and marketing ops; payer: enterprise software budget"
        - Omnichannel customer engagement, authentication, and contact-center workflows
        - SAP integration and homepage positioning show enterprise workflow relevance across multiple regulated industries
        - Public win count, ACV, and segment mix are undisclosed
      - - Platforms and ISVs
        - "Buyer: product / platform operators; user: developer and partner operations; payer: platform P&L owner"
        - Embed messaging channels with per-client provisioning, campaign registration, and usage reporting
        - CPaaS X is explicitly designed for client-by-client onboarding and reporting
        - Attach rates and customer mix versus direct enterprise accounts are undisclosed
      - - RCS-first brands
        - "Buyer: messaging and lifecycle teams; user: campaign and CRM operators; payer: channel or growth budget"
        - Upgrade SMS / MMS programs into richer branded messaging
        - Public RCS metrics show thousands of brands and launches, especially in the U.S.
        - Revenue contribution, repeat usage, and gross retention are not disclosed
      - - Voice and telecom installed-base accounts
        - "Buyer: telecom / UCaaS operators; user: network and customer-engagement teams; payer: communications budget"
        - Add Infobip CPaaS to Peerless voice customers and add Peerless voice reach to Infobip clients
        - Acquisition created a concrete installed-base cross-sell path in the U.S.
        - Customer logos and post-acquisition conversion data are not public
    notes: Public segment view synthesized from official product pages, partner launch evidence, and the Peerless acquisition announcement.
    claimRefs: [CU001, CU002, CU003, CU008, CU009, CU011, CU014, CU015]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / period
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - RCS for Business traffic growth
        - 169.3%
        - H1 2025 to H1 2026
        - Business Wire / Infobip
        - Medium
        - Shows fast channel-specific adoption among active senders
        - No revenue, gross profit, or active-customer base attached
      - - Unique brands processed for RCS registration
        - 7.3k+
        - 2026
        - Business Wire / Infobip
        - Medium
        - Indicates a meaningful top-of-funnel and onboarding volume for RCS programs
        - Not disclosed how many became recurring paying production accounts
      - - Successful RCS agent launches
        - 14k
        - 2026
        - Business Wire / Infobip
        - Medium
        - Suggests operational execution at scale, not just pilot messaging
        - Launch count is not the same as unique retained customers or annual spend
      - - U.S. voice footprint added through Peerless
        - 98% of Americans across 49 states
        - At acquisition close
        - One Equity Partners
        - Medium
        - Improves U.S. customer reach and cross-sell potential for voice-led accounts
        - No disclosed retention or revenue from inherited accounts
    notes: Company- and deal-issued adoption signals are useful directional evidence, but they do not disclose cohort quality or revenue retention.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / evidence
      - Limitation
    rows:
      - - SAP Engagement Cloud
        - Enterprise software ecosystem / large enterprise users
        - Native RCS Business Messaging plus SMS and WhatsApp inside SAP Engagement Cloud
        - Production-ready partner integration, not a disclosed named end-customer rollout
        - Shows Infobip can land inside an existing enterprise orchestration stack
        - No tenant count, spend, or named end customers disclosed
      - - North American brand senders
        - Large messaging brands upgrading from SMS / MMS
        - A2P RCS API, portal, editor, and upgrade path from existing integrations
        - Live channel launch evidence, but named logos are not disclosed
        - Supports a concrete migration path from existing Infobip messaging traffic into richer channels
        - No brand names, retention, or conversion metrics disclosed
      - - Peerless Network customer base
        - Fortune 500 companies, MNOs, MVNOs, and VoIP providers
        - Add Infobip CPaaS to a U.S. voice installed base after acquisition close
        - Inherited production customer base rather than a greenfield pilot
        - Creates a measurable cross-sell surface and local-market entry point
        - Individual customer names and post-close conversion rates are not public
    notes: This is a partial public-proof list limited to verifiable partner, launch, and installed-base evidence in the assigned source pool.
    enumerationScope:
      coverage: partial
      basis: Filtered to assigned-pool sources that identify a named partner, live channel launch, or inherited installed base with customer relevance.
    claimRefs: [CU002, CU004, CU007, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence suggests Infobip expands from channel access into orchestration, reporting, and geography-specific scale.
    data:
      items:
        - label: Evaluate coverage and compliance
          actor: Enterprise buyer or platform operator
          segment: Multi-country messaging programs
          touchpoints:
            - Compare channel reach, operator connectivity, and local compliance support
            - Validate whether existing CRM or contact-center stack can stay in place
          note: Early qualification is tied to geography coverage and existing systems, not just API price.
          tone: neutral
        - label: Start with a concrete channel program
          actor: Messaging or product operations
          segment: RCS / SMS / MMS use cases
          touchpoints:
            - Launch branded messaging or authentication on one or two channels
            - Reuse existing APIs where possible to reduce migration effort
          note: The North America RCS launch highlights upgrade paths for existing customers.
          tone: positive
        - label: Integrate into enterprise workflow
          actor: CX platform owner
          segment: SAP-led enterprise environments
          touchpoints:
            - Add RCS, SMS, and WhatsApp into engagement orchestration
            - Use Infobip for registration, verification, and campaign execution support
          note: SAP is the clearest named public workflow surface in the current pool.
          tone: positive
        - label: Add reporting and client-level controls
          actor: Platform / ISV operations
          segment: Embedded CPaaS customers
          touchpoints:
            - Automate provisioning, campaign registration, and reporting
            - Configure individual clients rather than one shared deployment
          note: CPaaS X is positioned around per-client scale and operational efficiency.
          tone: positive
        - label: Expand geography or adjacent channels
          actor: Regional program owner
          segment: Cross-border and voice-enabled accounts
          touchpoints:
            - Add local-market support, voice, and broader omnichannel routing
            - Use inherited Peerless reach for U.S. expansion
          note: Public evidence emphasizes expansion breadth more than retention metrics.
          tone: positive
        - label: Renewal and concentration remain under-disclosed
          actor: Investor / diligence team
          segment: Durability assessment
          touchpoints:
            - Request NRR, GRR, churn, contract length, and top-customer mix
            - Separate channel usage growth from durable cohort economics
          note: Public sources do not disclose the renewal-quality metrics needed to close the loop.
          tone: warning
    approximationNotes: null
    claimRefs: [CU003, CU004, CU007, CU008, CU014, CU015]
callouts:
  - calloutType: strength
    title: Visible enterprise and platform distribution surfaces
    body: >-
      SAP distribution, CPaaS X platform tooling, and the Peerless installed base give
      Infobip more visible enterprise customer-entry points than a pure self-serve API
      story.
    claimRefs: [CU001, CU003, CU008, CU009]
  - calloutType: insight
    title: RCS is the clearest public adoption surface
    body: >-
      The strongest disclosed customer motion is migration from SMS / MMS into RCS, where
      Infobip published both launch-volume and traffic-growth evidence.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Durability is not publicly underwritten
    body: >-
      Public sources do not disclose NRR, GRR, churn, contract length, or concentration, so
      growth evidence cannot yet be converted into a durable cohort-quality conclusion.
    claimRefs: [CU010, CU013]
