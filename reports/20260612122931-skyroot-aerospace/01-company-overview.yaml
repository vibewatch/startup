  name: Skyroot Aerospace
chapter:
  number: 1
  title: Company Overview
  summary: Skyroot Aerospace is a Hyderabad-based private launch company founded in 2018 by former ISRO scientists Pawan Kumar Chandana and Naga Bharath Daka. By June 2026 it had become India’s first space-tech unicorn on the strength of a $60 million round and a still-unflown Vikram-1 orbital launcher, giving the company unusually strong capital backing but leaving its commercial proof point in front of it. The chapter’s main conclusion is that Skyroot’s identity, funding history, and industrial footprint are well evidenced, while revenue, named customers, and orbital execution remain materially under-disclosed.
sections:
- id: identity-footprint-and-product-scope
  title: Identity, footprint, and product scope
  body: 'Skyroot Aerospace is best understood as India’s leading private launch startup rather than as a diversified space platform. The company was founded in 2018 in Hyderabad by former ISRO scientists Pawan Kumar Chandana and Naga Bharath Daka, incubated through the Telangana startup ecosystem, and built around the proposition of dedicated, customizable launch services for small satellites. The official website frames the business as on-demand access to orbit, while independent reporting shows a concrete vehicle roadmap: the already-flown Vikram-S suborbital demonstrator, the near-term Vikram-1 orbital rocket, and the larger Vikram-2 with a cryogenic upper stage. The industrial footprint is no longer a garage-stage story. Public sources point to an earlier 60,000 square foot integrated development facility near Hyderabad airport and a later Infinity Campus/Max-Q manufacturing footprint measured at roughly 250,000 square feet in Hyderabad. That physical scale matters because launch startups
    usually fail not on concept quality but on the ability to industrialize hardware, testing, and launch operations fast enough to support cadence. Skyroot’s identity case is therefore strong on geography, founders, product category, and physical build-out, but still early on proven mission cadence.'
