  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: A current revenue bridge, launch-service pricing schedule, and run-rate or backlog disclosure for 2026.
    whyItMatters: Without a denominator, the 1.1B valuation cannot be tested against real operating traction.
    diligencePath: Request management financial pack, backlog by mission, and customer-contracted launch schedule.
    relatedQuestionRefs:
    - QO020
  - type: private-evidence-only
    severity: material
    topic: customer-backlog
    missingEvidence: Named paying orbital customers, signed payload contracts, and launch-manifest detail for Vikram-1 and post-maiden missions.
    whyItMatters: Customer opacity makes it impossible to judge whether demand is contracted or mostly aspirational.
    diligencePath: Obtain launch manifest, contract summary, and customer reference list from the company.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: launch-confirmation
    missingEvidence: A direct official or independent confirmation that Vikram-1 launched successfully, including date, payloads, and mission outcome.
    whyItMatters: Orbital success is the main technical milestone separating a funded hardware builder from a commercial launch provider.
    diligencePath: Check company newsroom, ISRO/IN-SPACe releases, and tier-one space press after the run date.
    relatedQuestionRefs:
    - QO017
    - QO022
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: vehicle-specs
    missingEvidence: A single current technical spec sheet clarifying whether older Vikram-1 and Vikram-2 payload numbers have been superseded.
    whyItMatters: Specification drift does not break the thesis, but it can confuse comparisons in later chapters.
    diligencePath: Request latest payload-performance sheet or investor deck from the company.
    relatedQuestionRefs:
    - QO004
  - type: private-evidence-only
    severity: minor
    topic: TO002 leadership table completeness
    missingEvidence: A complete current board roster, committee map, and precise title history for senior leaders and investor representatives.
    whyItMatters: The leadership enumeration is useful for diligence, but public sources disclose only selective additions and not a full governance chart.
    diligencePath: Request an org chart, board list, and governance deck from the company or lead investors.
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: Ownership percentages, preference stack, secondary transactions, debt facilities, and governance rights associated with each major round.
    whyItMatters: Headline valuation and total capital raised do not reveal the real economics of the latest financing.
    diligencePath: Review cap table, financing documents, and investor rights agreements under NDA.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
