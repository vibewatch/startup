- id: leadership-governance-and-key-person-risk
  title: Leadership, governance, and key-person risk
  body: 'Leadership concentration is both one of Skyroot’s strengths and one of its underwriting risks. The founders remain the public operating face of the business: Chandana serves as CEO and is commonly described as the technical leader, while Daka leads operations and launch commercialization. That founder-market fit is real because both men came from ISRO and built the company around India’s post-2020 private-space opening. Governance has matured as the company raised larger rounds. Series A reporting noted board seats for Greenko founders and Solar Industries, the 2022 GIC-led round added GIC India managing director Mayank Rawat, and the 2026 unicorn round brought Ram Shriram onto the board. Those additions matter because they show the cap table moving from angel-plus-founder control toward an investor-backed aerospace board. At the same time, public disclosure of the full board, committee structure, and voting rights remains thin, which is normal for a private Indian startup but still
    a diligence limitation. A softer governance signal is the company’s public whistleblower page, which emphasizes confidentiality, anti-retaliation, and investigation procedures. That is positive as a control surface, but its prominence also suggests management is deliberately signaling conduct oversight before scaled operations and larger international counterparties arrive.'
