- id: milestones-current-status-and-open-proof-points
  title: Milestones, current status, and open proof points
  body: The milestone record shows a company that has de-risked pieces of the stack, but not yet the central commercial mission. The decisive technical proof point to date is Vikram-S, which launched in November 2022 and established that a privately built Indian rocket could reach space from Sriharikota. Since then the company has accumulated infrastructure, propulsion tests, government relationships, and partnerships such as Axiom Space and Exolaunch. The April 2026 shipment of the first Vikram-1 to Sriharikota, plus company statements that launch would follow within weeks, marked the transition from narrative to operational countdown. Yet as of the run date there is still no widely accessible confirmation that Vikram-1 has launched successfully, and public reporting still does not identify named paying orbital customers, booked backlog, current revenue, or a clean headcount figure. The adverse evidence is therefore not scandal; it is execution gap and disclosure gap. The Space Review’s
    2024 assessment remains relevant because it argued that Indian private launch companies could find themselves short of customers even after achieving orbit, particularly with ISRO’s SSLV and global rideshare alternatives applying competitive pressure. That means Skyroot’s next proof point is not another fundraising event. It is a successful orbital mission followed by evidence that commercial demand is real rather than aspirational.
