  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Skyroot should not be valued against the entire Indian or global space economy. Its real market boundary
              is much narrower: launch services for small satellites that need dedicated, customized, or
              schedule-sensitive access to specific low-Earth or sun-synchronous orbits. That boundary includes
              commercial Earth-observation constellations, defense and civil payloads that value orbit choice or
              schedule control, and international customers that cannot or do not want to wait for generic rideshare
              windows. It excludes most satellite manufacturing, downstream geospatial analytics, human spaceflight,
              large geostationary launch, and the broader “space economy” narratives often used in venture storytelling.
              The status-quo substitutes are well defined. At the cheapest end sits SpaceX rideshare, which is hard to
              beat on raw price. At the premium dedicated end sit Rocket Lab Electron and Firefly Alpha, both of which
              sell responsiveness and mission control. In India, the most immediate substitutes are ISRO’s SSLV and
              Agnikul’s emerging Agnibaan, both of which compete for national attention, launch infrastructure, and the
              same small-payload customer set. Market analysis therefore has to begin with service substitution logic,
              not macro space-economy rhetoric.
