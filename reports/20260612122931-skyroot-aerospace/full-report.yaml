  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitution logic
        blocks:
          - type: paragraph
            body: >-
              Skyroot is not competing against one neat peer set. It faces at least four distinct alternatives: SpaceX
              rideshare as the cheapest disclosed access path for payloads that can tolerate shared manifests; Rocket
              Lab and Firefly as higher-heritage dedicated launch providers; SSLV and Agnikul as the most relevant
              Indian substitutes for sovereign or locally aligned buyers; and European entrants such as Isar, RFA, and
              HyImpulse that sell the same schedule-control and sovereignty story to another geography. That structure
              matters because buyers do not compare all providers on one metric. A payload owner that values schedule
              certainty and orbit specificity may pay up for dedicated launch, but a budget-constrained customer can
              still be pushed toward rideshare when the mission can tolerate generic insertion. Skyroot therefore wins
              only when mission control, domestic alignment, or responsiveness outweigh the price floor and heritage
              advantages already available elsewhere. In practice, this means Skyroot is competing for a narrower
              mission subset than headline space-economy rhetoric suggests.
