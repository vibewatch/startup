  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Proven customer archetypes and the current evidence floor
        blocks:
          - type: paragraph
            body: >-
              The strongest customer evidence for Skyroot is still historical and suborbital. Mission Prarambh in
              November 2022 flew three customer payloads and named them publicly: BAZOOMQ Armenia, Space Kidz India, and
              N-Space Tech India. That matters because it proves three things at once. First, real third parties
              entrusted hardware to Skyroot before orbital capability existed. Second, those third parties were not all
              the same kind of buyer: Space Kidz represents education and STEM sponsorship, N-Space Tech represents an
              Indian startup technology-demonstration buyer, and BAZOOMQ represents an international research-lab
              relationship. Third, the proof is explicitly customer-level rather than logo-wall marketing; the payloads
              were attached to a real mission outcome.


              What this does not prove is just as important. None of these disclosed customers are paying orbital
              reference accounts, and none of them provide evidence of repeat usage, renewal, or scaled constellation
              demand. The public record therefore supports only a narrow conclusion: Skyroot can attract early-risk,
              mission-tolerant payload owners for milestone flights. That is valuable because it shows some willingness
              to buy into the company’s launch story before full flight heritage exists, but it is still materially
              weaker than proof of recurring orbital demand from commercial operators with meaningful payload value or
              schedule sensitivity.
            claimRefs:
