      - number: '4.3'
        title: Capital intensity, manufacturing footprint, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Skyroot’s funding history matters less here as chronology and more as evidence of how expensive the next
              phase will be. By May 2026 the company had raised about $160 million, including a fresh $60 million round
              at a $1.1 billion valuation, and multiple sources say those proceeds are being used to raise Vikram-1
              launch cadence, expand manufacturing, and accelerate Vikram-2. The manufacturing footprint shows why
              financing dependency remains central. Satellite Today says the Hyderabad Max-Q and Infinity facilities
              together amount to roughly 250,000 square feet and are meant to support a 72-hour assembly-to-launch
              ambition; Machinist says the new Infinity Campus alone is about 200,000 square feet and sized for one
              orbital-class rocket a month. Hans India adds a 55,000-square-foot Max-Q predecessor and quotes management
              saying Skyroot plans more than Rs 1,000 crore of additional near-term investment. Outside Hyderabad,
              Andhra Pradesh has allotted roughly 300 acres near Tirupati for an integrated rocket manufacturing,
              assembly, testing, and storage campus tied to a Rs 400 crore investment. Those commitments are
              strategically logical because the company is trying to move from R&D cadence to production cadence, but
              economically they mean Skyroot is carrying launch-company capex, factory capex, and ecosystem-build capex
              before public disclosure of cash on hand or runway. Put simply, the 2026 financing bought time and
              industrial capacity, not proof that the company has already crossed into self-funding operations. The next
              round trigger is therefore likely tied to mission reliability, conversion of advances into recurring
              launch bookings, and demonstrated throughput from the Hyderabad and Tirupati footprint.
