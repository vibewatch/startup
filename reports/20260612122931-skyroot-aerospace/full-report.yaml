  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The valuation call runs through a simple chain: real funding and industrial progress are visible, but the launch
      denominator and proof points are not yet visible enough to make the current mark attractive.
    data:
      nodes:
        - id: round
          label: Real unicorn round
          detail: May 2026 financing cleared at $1.1B with blue-chip investors.
        - id: bridge
          label: Bridge revenue exists
          detail: FY26 public revenue came from Space Systems before launch commercialization.
        - id: proof
          label: Launch proof pending
          detail: Commercial launch revenue, cadence, and realized ASP remain largely prospective.
        - id: denominator
          label: Denominator missing
          detail: No public launch margin, backlog quality, or contract-term bridge exists.
        - id: comp
          label: Comps support possibility
          detail: Firefly, Isar, and Rocket Lab show that launch narratives can command large marks.
        - id: call
          label: Current call
          detail: Stretched valuation; keep on track list, but wait for proof or better disclosure.
      edges:
        - from: round
          to: bridge
          label: helps validate
        - from: bridge
          to: proof
          label: does not replace
        - from: proof
          to: denominator
          label: keeps
        - from: denominator
          to: call
          label: drives
        - from: comp
          to: call
          label: prevents outright pass
    approximationNotes: >-
      This flow is decision logic, not a process map; it shows why a real funding round still produces only a
      stretched-not-cheap verdict on public evidence.
    claimRefs:
      - CV001
      - CV010
      - CV016
      - CV034
      - CV038
      - CV049
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The biggest valuation sensitivities are proof and disclosure rather than TAM rhetoric.
    data:
      items:
        - label: Orbital mission success
          value: 10
          tone: positive
          note: Largest single driver because it converts narrative into proof.
        - label: Repeat launch cadence
          value: 9
          tone: positive
          note: Cadence decides whether capex becomes moat or burden.
        - label: Disclosed launch ASP + margin
          value: 9
          tone: positive
          note: Missing denominator is the main analytical blocker today.
        - label: Firm backlog / named customers
          value: 8
          tone: positive
          note: Demand quality matters more than generic interest or MOUs.
        - label: SpaceX / SSLV price pressure
          value: 7
          tone: warning
          note: Price floor and domestic substitute constrain upside narratives.
        - label: Preference / dilution overhang
          value: 6
          tone: warning
          note: A strong company can still be a weak entry if terms are heavy.
    approximationNotes: Values are committee-style importance weights from 1 to 10, not statistical betas or regression outputs.
    claimRefs:
      - CV016
      - CV017
      - CV019
      - CV023
      - CV026
      - CV031
      - CV040
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Return outcomes from the current mark are highly asymmetric: base case is close to hold value, while real upside
      requires a bull-case milestone path.
    data:
      items:
        - label: Bear value / current mark
          low: 0.36
          high: 0.64
          unit: x
          detail: Down-round style outcome if orbital proof or backlog conversion disappoints.
        - label: Base value / current mark
          low: 0.82
          high: 1.18
          unit: x
          detail: Current mark can hold if Vikram-1 succeeds, but upside stays limited without deeper disclosure.
        - label: Bull value / current mark
          low: 1.45
          high: 2.18
          unit: x
          detail: Meaningful upside exists only if cadence, backlog, and unit economics all sharpen quickly.
    approximationNotes: >-
      Return bands are derived from the scenario valuation ranges divided by the current $1.1B mark; they are
      milestone-sensitive and not based on a clean revenue multiple.
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Skyroot scores best on strategic wedge and capital access, and weakest on public economics disclosure and proof
      maturity.
    data:
      items:
        - label: Strategic / sovereign wedge
          score: 8
          note: Domestic narrative is real, but not exclusive because SSLV exists.
        - label: Technical proof today
          score: 4
          note: The critical commercial orbital proof point is still pending.
        - label: Industrial build-out
          score: 7
          note: Capex and facilities are visible enough to matter.
        - label: Economic disclosure quality
          score: 3
          note: Launch ASP, gross margin, and backlog quality remain weakly disclosed.
        - label: Comparable valuation support
          score: 7
          note: Global launch comps prove investors will pay for scarcity and scale narratives.
        - label: Competitive pressure
          score: 4
          note: SpaceX rideshare, SSLV, and global dedicated peers keep pressure high.
        - label: Current entry attractiveness
          score: 4
          note: At $1.1B, upside requires bull-case execution rather than base-case holding power.
    approximationNotes: Scores are internal committee judgments on a 1-10 scale where higher is better for investability.
    claimRefs:
      - CV007
      - CV014
      - CV019
      - CV023
      - CV026
      - CV032
      - CV043
      - CV049
