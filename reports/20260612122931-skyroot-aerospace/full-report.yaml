          - type: paragraph
            body: >-
              The adverse evidence argues against any simplistic moat story. Firefly, Isar, and RFA all show that launch
              startups can have real engineering talent, significant funding, and compelling national narratives yet
              still get delayed or fail on the road to repeatable operations. Rocket Lab demonstrates what the positive
              version looks like: heritage, launch infrastructure, adjacent mission products, and customer trust
              reinforce one another. SSLV shows that a state-backed domestic alternative can recover quickly from an
              early miss and return with a commercially relevant offer. Skyroot’s real advantages are narrower. It
              remains well positioned to sell an Indian sovereign-access narrative, and if Vikram-1 flies successfully
              before some European peers settle into cadence it can still own a meaningful local first-mover position.
              But the company is currently disadvantaged on disclosed pricing, booked-customer transparency, and orbital
              proof. Until those gaps close, its moat is better described as plausible than durable.
