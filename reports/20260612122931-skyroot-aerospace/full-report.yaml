  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          The risk stack is still pre-orbit: Skyroot has proof of engineering progress but not proof of an operable
          launch franchise
        blocks:
          - type: paragraph
            body: >-
              Skyroot enters the risks chapter with one genuine mitigation and one overwhelming limitation. The
              mitigation is that this is no longer a pure slide-deck launcher. Mission Prarambh flew, Raman-II has been
              tested at an ISRO facility, and the company has physically shipped Vikram-1 hardware to Sriharikota. That
              matters because it reduces the zero-to-one risk around whether Skyroot can build and light hardware at
              all. But the limitation is more important for underwriting: by Skyroot’s own description, the first
              Vikram-1 orbital mission is still a test flight whose main job is data collection rather than fully
              bankable commercial execution. Management also says first-time orbital launches rarely succeed without
              iterative learning.


              That framing means the company’s biggest risk is not one isolated launch event. It is a compound
              transition from technical milestone company to repeatable service company. The first launch still depends
              on approvals and readiness, payload partners remain unnamed, cadence targets are aspirational rather than
              delivered, and the valuation has already stepped to unicorn status before orbital revenue exists. In other
              words, Skyroot has moved far enough to make the opportunity real, but not far enough to de-risk
              reliability, insurance access, order-book quality, or financing resilience if the first orbital campaign
              slips or fails.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR014
              - CR045
