      - number: '4.4'
        title: Disclosure limits and the exact diligence blockers
        blocks:
          - type: paragraph
            body: >-
              For a private Indian launcher, some opacity is normal; for an investor underwriting a billion-dollar
              valuation, the remaining opacity is still material. The reviewed sources are good enough to establish
              capital raised, manufacturing scale, launch ambition, and the existence of bridge revenue from Space
              Systems. They are not good enough to underwrite ARR, recurring launch backlog, customer concentration,
              gross margin, cash runway, debt obligations, or realized launch pricing. Filing-adjacent aggregators such
              as QuickCompany, Tracxn, and Inc42 show that a public corporate-record trail exists, but they mostly offer
              stale or range-bound snapshots rather than current primary financial statements. Tracxn shows a current
              ROC Hyderabad registration and last AGM date, while Inc42 rounds FY24 revenue and total funding
              differently from the May 2026 company-backed total, illustrating how secondary datasets can lag real
              events. That is useful as a disclosure-quality signal, but not as a substitute for audited statements. The
              adverse evidence is not fraud or accounting stress; it is that demand, cadence, and margin claims still
              run ahead of public proof. The Space Review explicitly warned that Indian private launch startups could
              remain strapped for customers even after successful orbital flights, and Via Satellite’s interview makes
              clear that management itself sees cadence and reliability as the commercial unlock. The financial verdict
              is therefore conditional. Skyroot has enough funding and industrial build-out to justify serious
              diligence, but not enough public operating disclosure to support a clean underwriting model without direct
              access to contracts, margins, cash, and customer concentration data.
