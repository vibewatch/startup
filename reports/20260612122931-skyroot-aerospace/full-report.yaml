      - number: '4.2'
        title: Unit economics, cadence assumptions, and burn logic
        blocks:
          - type: paragraph
            body: >-
              The investability question is not whether Skyroot can tell a plausible launch story; it is whether the
              implied unit economics survive the jump from prototype to cadence. The public proxies are directionally
              positive but still too incomplete for hard underwriting. TechStory and Asianet Newsable both report
              management-linked figures of roughly $5 million in revenue per launch and $2 million to $3 million in
              build cost per rocket, which suggests a gross spread before launch operations, insurance, rework,
              amortized capex, and corporate overhead. Via Satellite adds a more operationally useful lens: management
              says it has already invested the capex needed to manufacture 12 rockets a year, while the near-term goal
              is four to six launches in the current financial year and eventually faster follow-up missions once
              reliability is proven. That is precisely where the risk sits. Entrackr’s provisional FY26 figures show
              negative EBITDA of Rs 130.3 crore, employee expense of Rs 95.5 crore, and operating and administrative
              expense of Rs 88.2 crore. Those numbers are consistent with a business still funding engineering depth,
              test infrastructure, and commercialization overhead ahead of real launch cadence. The bridge revenue from
              Space Systems reduces the starkness of the burn story, but it does not yet prove attractive contribution
              margins in launch. Nor does the public record disclose gross margin by business line, launch-insurance
              cost, refurbishment or scrap risk, cash conversion timing, or the proportion of customer advances that
              represent cancellable interest versus firm contracted payloads. The right reading is that Skyroot may have
              an economically workable product if it hits cadence, but the present public evidence supports only a
              scenario model, not a completed unit-economics case.
