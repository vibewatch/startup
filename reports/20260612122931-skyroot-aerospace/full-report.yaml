      - number: '5.4'
        title: Roadmap, cadence claims, and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              The roadmap story is ambitious and partially evidenced. On propulsion alone, Skyroot’s public trail shows
              a progression from Raman-1 and Dhawan-1 milestones on the company timeline to ISRO-backed Raman-II testing
              and the 2026 Dhawan-III methalox hot-fire. That is enough to say Skyroot is building a genuine propulsion
              family rather than a one-off demonstrator. It is not enough to treat Vikram-II’s cryogenic branch as
              commercially ready. Public Vikram-II capacity numbers already diverge between 900 kg and roughly 1,100 kg
              to LEO, and no integrated upper-stage or flight-like vehicle test has been disclosed. The cryogenic line
              is therefore a roadmap asset, not yet a bankable product.


              Mission cadence is even more clearly a claim rather than a delivered capability. Management has talked
              about four to six launches in the current financial year, 12 rockets per year of manufacturing capacity,
              and even monthly launches by 2027. Those targets are directionally consistent with the Infinity Campus
              build-out and the dedicated-plus-rideshare model, but Via Satellite also records the caveats that matter
              most: launch-port availability, manufacturing readiness, and first-flight observations. Until Skyroot
              posts one successful orbital launch, returns quickly for a second, and reconciles its payload/user-guide
              data, the core technical risk is not whether the company can build impressive hardware. It is whether the
              company can convert that hardware into a repeatable, insurable, specification-stable launch service.
