      - number: '7.2'
        title: >-
          Regulatory and facility risk is structural because India still intermediates authorization, liability, and
          launch-site access
        blocks:
          - type: paragraph
            body: >-
              Skyroot is not operating in a deregulated commercial launch market. IN-SPACe remains the authorizing and
              supervising body for private launch vehicles and explicitly controls how non-governmental entities access
              Department of Space and ISRO infrastructure. The integrated launch manifesto makes the practical
              consequence clear: Vikram-1 timelines are tentative and still subject to techno-commercial contracts plus
              approvals and authorization by IN-SPACe. That creates a direct schedule and counterparty risk that does
              not disappear even if Skyroot’s vehicle hardware is flight-ready.


              Facility concentration amplifies the policy layer. India’s current commercial and private launch activity
              still runs through Sriharikota, where ISRO missions, NSIL missions, defense payloads, human-spaceflight
              work, and private launches all compete for finite launch and test capacity. NSIL is not just background
              infrastructure; it already markets its own launch services from the same public system. On top of that,
              international-space-law obligations do not sit with Skyroot alone. India remains the responsible and
              liable state for non-governmental launches and must register launched objects. That structure makes
              regulatory approvals, indemnity terms, and payload clearance more than paperwork: they are part of the
              actual bottleneck to cadence.
            claimRefs:
