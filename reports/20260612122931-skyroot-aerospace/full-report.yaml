  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and what is actually public
        blocks:
          - type: paragraph
            body: >-
              Skyroot’s public financial story is unusual because the company reached unicorn status before it openly
              disclosed a mature launch-services P&L. The official website still sells a proposition rather than a price
              card: on-demand, customizable launch for small satellites. That matters because it confirms the intended
              monetization model, but it does not tell an investor what customers actually pay, what utilization
              assumptions sit behind the model, or whether early contracts are dedicated launches, rideshares,
              engineering services, or some blend. The strongest newly public datapoint is Entrackr’s June 2026 report
              on provisional FY26 financials, which says Skyroot crossed Rs 100.6 crore of operating revenue before
              Vikram-1 commercial launches began and that the entire figure came from the Space Systems business. In
              other words, pre-orbital Skyroot is not a pure pre-revenue launch startup any more, but it is still
              pre-scale in the actual launch business that anchors valuation. Public reporting in January and March 2026
              adds two usable but still management-framed pricing proxies: about $2 million to $3 million to build a
              rocket and about $5 million of revenue per launch. Those numbers are helpful for rough unit-economics
              framing, but the company still does not publish an official rate card, realized ASP, discount structure,
              insurance pass-through, or contract template. Revenue quality therefore looks mixed but improving:
              component and systems sales give Skyroot a bridge revenue line, while the core underwriting case still
              depends on turning launch intent into repeatable mission revenue.
