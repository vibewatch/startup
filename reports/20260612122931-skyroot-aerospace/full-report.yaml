      - number: '8.5'
        title: 'Final judgment: investors can explain the mark, but public evidence still says stretched'
        blocks:
          - type: paragraph
            body: >-
              The public-evidence verdict is therefore price-sensitive, not company-dismissive. Skyroot is not obviously
              overhyped in the sense of having no industrial reality: it has real capital, a real manufacturing story, a
              plausible sovereign-access wedge, and a bridge business in Space Systems. But it also lacks the exact
              launch-business proof that would make a $1.1 billion mark look comfortable. The most important missing
              items are realized launch price, contribution margin, conversion of customer interest into firm backlog,
              round-term overhang, and current cash runway. Without those, the base case does not offer enough visible
              upside from the current mark to justify a strong affirmative call on public evidence alone. The best
              synthesis is that the mark looks stretched rather than outright expensive: it is defensible in a bullish
              milestone frame, but not yet attractive on disclosed operating proof. The right posture is to keep Skyroot
              on the active track list, push hard on diligence, and wait for orbital proof plus denominator disclosure
              before treating the current valuation as investable on its own merits.
