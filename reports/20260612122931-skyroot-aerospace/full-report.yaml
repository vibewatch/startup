      - number: '1.3'
        title: Funding history, cap table, and valuation logic
        blocks:
          - type: paragraph
            body: >-
              Skyroot’s funding history is unusually important because it is the clearest public proxy for external
              confidence in the company before recurring launch revenue exists. The company disclosed a $1.5 million
              seed round in 2018, an $11 million Series A in 2021, a $4.5 million bridge round in early 2022, a $51
              million GIC-led Series B in September 2022, a $27.5 million pre-Series C led by Temasek in October 2023,
              and a $60 million round announced on 7 May 2026. The latest round set a reported $1.1 billion valuation
              and made Skyroot India’s first space-tech unicorn. Multiple sources corroborate that the 2026 syndicate
              included Sherpalo Ventures, GIC, BlackRock-managed funds, Playbook Partners, Shanghvi Family Office,
              Greenko founders, and Arkam Ventures, while Ram Shriram joined the board. The strongest tension in the
              chapter sits here: recent reporting often repeats lower historical totals such as roughly $95 million or
              $115 million, yet the company-backed 2026 figure is $160 million total raised. The better reading is that
              older figures became stale after the 2023 and 2026 rounds, not that the company is misstating the latest
              total. What investors are underwriting is not current disclosed revenue, but the probability that Vikram-1
              reaches orbit and turns industrial capability into a launch-services business with enough cadence to
              matter.
