chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product scope
        blocks:
          - type: paragraph
            body: >-
              Skyroot Aerospace is best understood as India’s leading private launch startup rather than as a
              diversified space platform. The company was founded in 2018 in Hyderabad by former ISRO scientists Pawan
              Kumar Chandana and Naga Bharath Daka, incubated through the Telangana startup ecosystem, and built around
              the proposition of dedicated, customizable launch services for small satellites. The official website
              frames the business as on-demand access to orbit, while independent reporting shows a concrete vehicle
              roadmap: the already-flown Vikram-S suborbital demonstrator, the near-term Vikram-1 orbital rocket, and
              the larger Vikram-2 with a cryogenic upper stage. The industrial footprint is no longer a garage-stage
              story. Public sources point to an earlier 60,000 square foot integrated development facility near
              Hyderabad airport and a later Infinity Campus/Max-Q manufacturing footprint measured at roughly 250,000
              square feet in Hyderabad. That physical scale matters because launch startups usually fail not on concept
              quality but on the ability to industrialize hardware, testing, and launch operations fast enough to
              support cadence. Skyroot’s identity case is therefore strong on geography, founders, product category, and
              physical build-out, but still early on proven mission cadence.
