      - number: '3.3'
        title: Pricing, positioning, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is sparse across the dedicated-launch set, which itself is a competitive signal.
              The only clean 2026 price anchor in the retained corpus is SpaceX rideshare, whose disclosed baseline
              makes clear how hard it is for any dedicated launcher to compete on raw dollars per kilogram. By contrast,
              Rocket Lab, Firefly, Isar, RFA, Agnikul, and Skyroot mostly market orbit control, schedule leverage, or
              custom mission design rather than a universally published dollar card. That creates a consistent buyer
              trade-off. If a mission needs a precise orbit, local policy alignment, or a faster slot, dedicated launch
              remains defensible. If not, rideshare becomes the default benchmark and compresses margin for everyone
              else. For Skyroot, the implication is harsh but clear: even if Vikram-1 reaches orbit, the company must
              prove that its Indian location, mission control, and responsiveness justify choosing it over both the
              cheapest shared option and more proven dedicated providers.
