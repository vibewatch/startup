      - number: '8.2'
        title: Why sophisticated investors may still support the $1.1 billion round
        blocks:
          - type: paragraph
            body: >-
              The investor logic is not hard to reconstruct even though the denominator is weak. First, Skyroot sits in
              a scarce category: a private Indian orbital-launch player with domestic policy tailwinds,
              founder-technical credibility, and visible manufacturing build-out. Official company surfaces keep pushing
              the same sell: on-demand, customizable launch for a global small-satellite market. Second, management and
              supportive coverage keep framing Skyroot as an infrastructure rather than app-style bet. SpaceNews quoted
              Sherpalo’s Ram Shriram saying the firm sees Skyroot as foundational infrastructure with an attractive
              cost-to-performance ratio, while Via Satellite documented that capex has already been invested for a
              12-rockets-a-year manufacturing capability once reliability is proven. Third, sector comps show that
              investors will back launch companies on strategic scarcity and serial-production narratives well before
              mature earnings arrive. If a fund believes India will support more than one commercial launch path and
              that sovereign or defense demand can offset some pure-price competition, paying up ahead of orbital proof
              becomes understandable even if it is not yet comfortable.
