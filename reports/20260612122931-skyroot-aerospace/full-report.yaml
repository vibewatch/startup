      - number: '7.4'
        title: >-
          Customer and backlog risk remains high because demand is mostly a pipeline story while market structure
          already favors rideshare scale
        blocks:
          - type: paragraph
            body: >-
              Skyroot’s customer story is directionally credible but still thin where an investor most needs
              specificity. The company has an interest pipeline, an Exolaunch integration partner, and an Axiom
              memorandum of understanding, and it is openly selling both dedicated and rideshare missions through its
              launch workflow. But it has not publicly named Vikram-1 payload partners, disclosed a firm orbital order
              book, or shown which announced relationships are binding commercial launch contracts versus ecosystem
              cooperation. That makes current backlog quality hard to value. A first launch with unnamed payloads can
              still be a real milestone, yet it does not tell an outsider how much revenue is contractual, cancellable,
              channel-led, or dependent on partner integration.


              The broader market is not forgiving while Skyroot figures that out. SpaceX rideshare already moves
              triple-digit payload counts per mission, and independent market commentary plus launch-industry quotes
              keep coming back to the same point: small launchers struggle to match rideshare on price per kilogram.
              Even Rocket Lab’s proven position required a 21-launch record year, while other small-launch developers
              tell SpaceNews they need six to 20 launches annually just to break even. Skyroot is therefore selling into
              a market where reliability and schedule control can justify a premium, but only after the company has
              established them with real flights and named customer repeats.
