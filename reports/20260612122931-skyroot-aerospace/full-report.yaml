      - number: '7.5'
        title: >-
          Funding and dilution risk is real because capex is scaling ahead of orbital proof, so thesis-break triggers
          must be explicit
        blocks:
          - type: paragraph
            body: >-
              Skyroot has clearly attracted capital, but that is not the same as having de-risked financing. The company
              raised $160 million by May 2026, reached a $1.1 billion valuation before first orbital revenue, and
              previously used preference-share financing structures in its Series B. At the same time, it is layering
              new physical scale onto the operating plan: Infinity Campus, Max-Q, a Tirupati manufacturing-and-storage
              site, and management commentary about more than Rs 1,000 crore of future investment to achieve rapid and
              on-demand launch capability. That is exactly the kind of pre-scale capex posture that can look visionary
              if cadence arrives on time and painful if launch learning loops take longer than planned.


              The right way to underwrite this is to define kill criteria in advance rather than after a disappointing
              launch. If Vikram-1 slips again because approvals or readiness do not close, if the first flight produces
              a long investigation cycle, if named orbital customers still are not disclosed after launch, or if fresh
              capital is required before reliability and repeat cadence are established, the valuation story should be
              marked down sharply. Conversely, a successful first orbital mission followed by a quick second flight,
              named repeat customers, and evidence that insurers and partners are treating the system as real commercial
              infrastructure would materially reduce today’s risk stack.
            claimRefs:
              - CR008
