      - number: '8.4'
        title: Scenario analysis should be milestone-based, not denominator-based
        blocks:
          - type: paragraph
            body: >-
              Because the public denominator is missing, a clean multiple is false precision. The more defensible
              approach is milestone-based scenario analysis anchored to comparable valuation outcomes and downside
              mechanics. In the bear case, Skyroot remains mostly a Space Systems revenue company while orbital proof
              slips, first-flight learning drags, or customer conversions remain MoU-level; in that world the valuation
              can revisit the sub-unicorn private-launch band suggested by Agnikul and Skyroot’s own prior round
              references. In the base case, Vikram-1 reaches orbit, early launch cadence begins, and investor confidence
              holds, but disclosed launch economics still lag what a hard-underwriting process would require; that
              leaves the current mark closer to hold value than to obvious upside. In the bull case, Skyroot clears
              first-flight risk quickly, demonstrates repeat launches, discloses credible backlog and unit economics,
              and turns Vikram-2 progress into a larger platform narrative; then the Firefly and Isar comparisons start
              to matter more seriously. The common conclusion is that upside from here is concentrated in milestone
              delivery, while downside arrives quickly if proof and disclosure remain incomplete.
