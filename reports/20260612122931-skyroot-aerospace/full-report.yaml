      - number: '2.3'
        title: Buyer, payer, and adoption workflow
        blocks:
          - type: paragraph
            body: >-
              Skyroot’s buyer map is heterogeneous, which makes the market more complex than a single-launch-price table
              implies. The likely commercial buyers are smallsat operators, constellation builders, and international
              mission aggregators that care about orbit, launch timing, and integration flexibility. The likely Indian
              institutional buyers or enabling counterparties are ISRO-linked entities, defense or civil agencies, and
              ecosystem partners that use IN-SPACe’s regulatory pathway to access private launch. The payer is therefore
              not one thing. In commercial missions it is the spacecraft operator or mission prime; in sovereign or
              strategic cases it can be a government program office or a national-space budget. The adoption workflow
              also creates friction. Buyers must move from mission need to launcher selection, then into regulatory
              authorization, payload compatibility, integration, range scheduling, and insurance or mission-assurance
              checks. That favors providers that can credibly offer not only low-cost launch but also process clarity
              and responsiveness. The official positioning of Agnikul, Rocket Lab, Firefly, and Isar all emphasizes some
              version of the same thing—schedule control, tailored orbits, or dedicated service—which suggests the
              market has already converged on a common value proposition. Skyroot is therefore not inventing a new
              demand category; it is trying to win within an existing service logic where proof of reliability and
              cadence matters more than slogans.
