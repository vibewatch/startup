companyProfile:
  summary: |
    Skyroot Aerospace is a Hyderabad-based private launch company founded in 2018 by former ISRO
    scientists Pawan Kumar Chandana and Naga Bharath Daka. Public evidence shows a real launch-platform
    story rather than a paper concept: Skyroot completed the Vikram-S suborbital mission in 2022,
    markets the Vikram-1 and Vikram-2 orbital vehicles, and has expanded to a large Hyderabad industrial
    footprint while raising about $160 million in disclosed capital, including a May 2026 round at a
    reported $1.1 billion valuation. At the same time, the company still lacks public proof of a completed
    orbital launch, named paying orbital customers, and transparent launch-business economics.
