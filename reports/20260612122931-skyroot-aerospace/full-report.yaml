      - number: '2.2'
        title: Sizing lenses and policy backdrop
        blocks:
          - type: paragraph
            body: >-
              The usable sizing lens for Skyroot is evidence-constrained because the broadest published numbers describe
              the total space economy, not dedicated small-launch demand. Public reporting still references India’s
              ambition to grow its space-economy share dramatically by 2033 and notes that the country has over 200
              space startups, but those figures are strategic policy markers rather than a Skyroot-ready TAM. More
              decision-useful are the policy and activity markers that explain why the market exists at all: IN-SPACe’s
              creation in 2020 as a single-window private-space enabler, the 2025 Technology Adoption Fund, India’s
              rising commercial-space rhetoric, and a global launch environment that recorded 317 successful orbital
              launches in 2025. Those facts do not tell an investor how many payloads Skyroot can win, but they do show
              that supply, policy, and investor attention are structurally higher than they were in the monopoly-ISRO
              era. The important contradiction is that none of these broad sizing markers eliminate the core
              microeconomics problem. If a customer can wait for rideshare, price wins; if a customer needs a precise
              orbit, bespoke integration path, or sovereign alternative, dedicated launch remains defensible. That is
              why a disciplined market chapter must preserve the failed sizing paths rather than pretending the
              space-economy headline is the same thing as Skyroot’s serviceable market.
