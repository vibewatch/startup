  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-orbital-backlog-quality
    missingEvidence: Signed Vikram-1 and follow-on launch contracts with named customers, cancellation terms, payment milestones, and contract-versus-LOI distinction.
    whyItMatters: Backlog quality is central to revenue timing, concentration risk, and whether partner announcements reflect real launch demand.
    diligencePath: Request the current manifest by customer, mission, contract form, payment status, and probability-to-launch.
    relatedQuestionRefs:
    - QR008
    - QR028
  - type: private-evidence-only
    severity: material
    topic: launch-insurance-access
    missingEvidence: Broker or underwriter indications showing post-flight insurance pricing, exclusions, and minimum reliability thresholds for Skyroot missions.
    whyItMatters: Skyroot itself says customer demand depends on insurance access, so insurance terms are a direct adoption gate, not a side detail.
    diligencePath: Obtain broker memos, indicative premium ranges, and underwriter requirements for flight one and flight two.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: material
    topic: post-series-c-cap-table
    missingEvidence: Exact post-Series-C ownership percentages, preference stack, board rights, and liquidation-preference terms.
    whyItMatters: Without the updated cap table, dilution risk and downside recovery for new investors cannot be modeled precisely.
    diligencePath: Request the latest cap table, term sheet summary, and any seniority or protective-provision side letters.
    relatedQuestionRefs:
    - QR029
  - type: missing-source
    severity: material
    topic: export-control-component-mapping
    missingEvidence: Component-level mapping of which imported parts or customer scenarios trigger export, re-export, or payload-screening approvals.
    whyItMatters: High-level treaty and regime participation show possible friction but do not quantify whether specific customer geographies or suppliers are blocked.
    diligencePath: Request a legal memo mapping SCOMET, MTCR, Wassenaar, and customer-country restrictions to Skyroot's actual component bill and manifest pipeline.
    relatedQuestionRefs:
    - QR023
  - type: missing-source
    severity: material
    topic: license-and-indemnity-terms
    missingEvidence: The exact IN-SPACe authorization conditions, insurance minimums, indemnity obligations, and any open closeout items for Vikram-1.
    whyItMatters: The regulatory gate is one of the most immediate schedule and legal risks, but the decisive terms are not public.
    diligencePath: Request the executed authorization letter, annexes, insurance certificates, and any launch-specific regulator correspondence.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
