- id: technical-first-flight-and-cadence-risk
  title: Technical risk now concentrates in orbital first-flight reliability, post-failure recovery, and the gap between capacity and cadence
  body: |-
    Small launch history argues against treating a first orbital attempt as a routine event. India’s own SSLV maiden mission failed on its kick stage despite the lower stages working, Isar’s first Spectrum launch lost attitude control within seconds and then required a corrective investigation cycle, and Kairos has now failed repeatedly across multiple attempts. Those examples do not prove Vikram-1 will fail, but they do show why a first-flight anomaly has to be modelled as a live base-case risk for a small launcher that is still pre-orbit. The underwriting issue is not just mission loss. A failure can trigger months of investigation, requalification, new regulator work, and a reset in customer confidence.

    That matters because Skyroot’s public cadence story is already stretched. Earlier financing language pointed to commercial operations in 2023, while the 2026 discussion is still about the first orbital attempt. Management now talks about one-rocket-per-month production capability and four-to-six launches, but Via Satellite and ET both qualify those ambitions with the same caveats: launch-port availability, first-flight observations, and mission success. The operational risk therefore sits at the intersection of launch reliability and manufacturing throughput. Skyroot may be able to build hardware quickly, but it still must prove that hardware can clear integration, authorization, launch, recovery, and customer rebooking in a repeatable cycle.
