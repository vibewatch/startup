- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - First-flight technical failure
    - Orbital outcome and post-flight timeline
    - Any loss of mission or investigation cycle that pushes reflight beyond one planning window
    - Treat as a thesis-break unless capital, schedule, and reflight proof are refreshed quickly.
  - - Authorization drag
    - IN-SPACe and range closeout timing
    - Launch-window announcement slips again because approvals or authorization remain open
    - Assume public-infrastructure dependency is binding and haircut cadence assumptions.
  - - Customer opacity
    - Named manifest / contract disclosure
    - No named repeatable commercial customers disclosed after the first orbital mission
    - Reclassify demand as pipeline rather than backlog.
  - - Insurance friction
    - Broker / underwriter feedback
    - Premiums or conditions remain punitive after launch one
    - Cut addressable demand assumptions for schedule-sensitive customers.
  - - Capital intensity overshoot
    - Fresh financing need
    - New capital required before two successful orbital launches or before backlog quality improves
    - Assume further dilution and lower confidence in the unicorn valuation.
  - - Rideshare pressure
    - Win-rate on dedicated missions
    - Customers continue to prefer rideshare despite successful demo flights
    - Rebase TAM capture and margin assumptions toward a smaller premium niche.
  notes: These are underwriting triggers, not management goals; each one is observable from future launches, disclosures, or financing events.
