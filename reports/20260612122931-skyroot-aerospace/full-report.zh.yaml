  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与已飞行验证的基线
        blocks:
          - type: paragraph
            body: >-
              Skyroot 的产品不再是泛泛的“航天初创公司”故事；它是围绕 Vikram-I 的具体发射服务流程。公司配置器现在面向客户展示的流程会询问轨道、倾角、载荷质量、发射周期和搭乘类型，这意味着 Skyroot
              销售的是任务档期，而不只是技术开发叙事。供给明确是双轨：面向排期敏感卫星的专属任务，以及面向愿意用独占性换低成本客户的拼车任务。这个产品框定很重要，因为它明显领先于公司 2022 年的位置；当时 Vikram-S
              仍是验证运载器，而不是可销售的轨道服务。


              这个故事下面最强的硬证据仍是 Mission Prarambh。Vikram-S 给 Skyroot 带来真实飞行履历，覆盖遥测、复合材料结构、航空电子和轨迹控制；ISRO 自己的记录也确认该任务获得
              IN-SPACe 授权。但这个流程在一个关键意义上仍处于运营前阶段。目前只有 LEO 被标记为可发射，更高能轨道仍是“即将推出”；第一次 Vikram-I
              轨道尝试的实际发射窗口授予，在运行日期仍未公开具名。实际上，Skyroot 已有可见客户旅程和可信的轨道前履历，但还没有完全标准化、已经飞行的服务边界。
