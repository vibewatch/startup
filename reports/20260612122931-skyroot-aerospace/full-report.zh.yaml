      - number: '6.3'
        title: 轨道证明缺口、任务清单不透明与公开披露仍未显示的内容
        blocks:
          - type: paragraph
            body: >-
              Skyroot 最大的客户问题不是需求生成，而是披露质量。截至运行日期，已审阅来源仍未公开具名 Vikram-1
              的付费轨道客户。相反，管理层反复表示，第一次轨道任务只会搭载较小一组客户卫星，因为优先事项是验证而不是最大化载荷；更完整任务清单会在临近发射时公布。这是理性的首飞姿态，但对尽调来说，当前证据仍处于任务清单前、合同细节前。公开记录没有识别载荷运营方、舱位数量、预订条款，也没有说明哪些账户是确定合同，哪些只是更软的预留或意向书。


              实际后果是，订单质量还无法承销。没有具名账户，投资人无法测试首批客户是主权买方、大学、高风险技术验证项目、商业成像运营方，还是时间敏感的星座部署方。没有合同形式，就无法判断 Skyroot
              拿到的是可承销收入承诺，还是只是一条令人鼓舞的销售漏斗。没有留存数据，也无法区分一次性里程碑参与和经常性轨道业务的起点。因此，公司客户叙事在结构和愿景上可信，但在判断发射任务清单耐久性所需的具体证明上仍然很薄。
