  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险堆栈仍停留在入轨前：Skyroot 已证明工程在推进，但尚未证明自己能运营发射业务
        blocks:
          - type: paragraph
            body: >-
              进入风险章节时，Skyroot 有一个真正的缓释因素，也有一个压倒性的限制。缓释因素在于，它已不再是纯 PPT 火箭公司。Mission Prarambh 飞过，Raman-II 在 ISRO
              设施完成测试，Vikram-1 硬件也已实物运往 Sriharikota。这很重要，因为它降低了 Skyroot 能否造出并点火硬件的从零到一风险。但对承销判断来说，更重要的是限制：按 Skyroot
              自己的说法，首次 Vikram-1 轨道任务仍是一次试飞，主要任务是收集数据，而不是完整、可融资的商业执行。管理层也表示，首次轨道发射很少能不经过迭代学习就成功。


              因此，公司最大的风险不是某一次孤立的发射事件，而是从技术里程碑公司转成可复制服务公司的复合跃迁。首次发射仍取决于审批和准备状态；载荷合作伙伴尚未具名；发射节奏目标更像愿景而非已交付结果；在轨道收入出现之前，估值已经进入独角兽区间。换句话说，Skyroot
              已经走到足以让机会变得真实的位置，但还没走到足以消除可靠性、保险可得性、订单质量，或首轮轨道发射推迟 / 失败后融资韧性风险的位置。
