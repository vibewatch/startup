      - number: '1.4'
        title: 里程碑、当前状态与待验证证明点
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司已经降低了技术栈部分环节的风险，但核心商业任务还没有完成。迄今决定性的技术证明点是 Vikram-S：它在 2022 年 11 月发射，证明印度私营制造火箭可以从 Sriharikota
              进入太空。此后，公司积累了基础设施、推进测试、政府关系，以及 Axiom Space 和 Exolaunch 等合作。2026 年 4 月首枚 Vikram-1 运抵
              Sriharikota，加上公司称发射将在数周内进行，标志着叙事进入运营倒计时。但截至运行日期，仍没有广泛可取得的确认信息显示 Vikram-1
              已成功发射；公开报道仍未识别具名付费轨道客户、已签订单、当前收入或干净员工数。反向证据因此不是丑闻，而是执行缺口和披露缺口。The Space Review 2024
              年评估仍然相关，因为它指出，印度私营发射公司即便入轨后也可能缺客户，尤其当 ISRO 的 SSLV 和全球拼车替代方案施加竞争压力时。也就是说，Skyroot
              的下一个证明点不是再融资，而是一次成功轨道任务，随后拿出商业需求真实存在、而非停留在愿景里的证据。
