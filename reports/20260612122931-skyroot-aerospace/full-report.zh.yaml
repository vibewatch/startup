      - number: '4.3'
        title: 资本密集度、制造版图与融资依赖
        blocks:
          - type: paragraph
            body: >-
              在这里，Skyroot 的融资历史与其说是时间线，不如说是下一阶段有多昂贵的证据。到 2026 年 5 月，公司已融资约 $160 million，其中包括一轮新 $60 million、估值 $1.1
              billion 的融资；多方来源称，这些资金正用于提升 Vikram-1 发射节奏、扩大制造并加速 Vikram-2。制造版图说明为什么融资依赖仍是核心。Satellite Today 称，Hyderabad 的
              Max-Q 和 Infinity 设施合计约 250,000 square feet，目标支撑 72 小时从组装到发射；Machinist 称，新 Infinity Campus 单独约 200,000
              square feet，按每月一枚轨道级火箭设计。Hans India 又补充了 55,000-square-foot 的 Max-Q 前身，并引用管理层称 Skyroot 计划近期追加超过 Rs 1,000
              crore 投资。Hyderabad 之外，Andhra Pradesh 已在 Tirupati 附近划拨约 300 acres，用于一个与 Rs 400 crore
              投资相关的一体化火箭制造、组装、测试和存储园区。这些投入在战略上合理，因为公司正试图从 R&D 节奏转向生产节奏；但在经济上，它们意味着 Skyroot
              在公开披露手头现金或现金跑道之前，就背着发射公司资本开支、工厂资本开支和生态建设资本开支。简单说，2026
              年融资买来的是时间和工业产能，而不是公司已经跨入自我造血运营的证明。因此，下一轮融资触发因素很可能与任务可靠性、把预付款转化为经常性发射订单，以及 Hyderabad 和 Tirupati 版图展现吞吐能力有关。
