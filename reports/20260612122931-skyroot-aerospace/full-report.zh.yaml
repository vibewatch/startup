        title: 渠道信号、买方结构与 Skyroot 称接下来服务谁
        blocks:
          - type: paragraph
            body: >-
              当前 GTM 故事比公开客户名单更可信。Skyroot
              的实时预订流程已经区分拼车和专属任务，并询问轨道、倾角、载荷质量、高度、发射周期和公司详情。这说明公司已搭好流程，可以筛选几类不同买方：想要专属通道、对排期敏感的运营方；愿意共享火箭、对成本敏感的小卫星或星座客户；以及需要结构化询价路径、而非通用联系表单的机构用户。管理层
              2026 年 3 月接受 Via Satellite 采访时进一步把图景说清：需求大致应为三分之一国内、三分之二国际，Southeast Asia、Japan、United States 和 Europe
              都在视野内。


              Exolaunch 是支撑这一定位的最清晰已披露渠道证明。2025 年 10
              月战略合作不是模糊备忘录；它明确覆盖卫星集成、部署硬件、拼车栈、发射活动规划，以及面向全球商业、机构和政府客户的任务执行。实际来看，Exolaunch 是 Skyroot
              火箭与全球载荷运营方之间唯一具名桥梁。这是正面信号，因为它降低了海外买方的集成摩擦，并暗示通往星座和拼车需求的真实路径。它也提醒我们：当前可见国际客户通道更多依赖合作伙伴基础设施，而不是已发布的 Skyroot
              直接轨道账户名单。
