chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、版图与产品范围
        blocks:
          - type: paragraph
            body: >-
              Skyroot Aerospace 更应被理解为印度领先的私营发射初创公司，而不是多元化航天平台。公司 2018 年在 Hyderabad 创立，创始人是前 ISRO 科学家 Pawan Kumar
              Chandana 和 Naga Bharath Daka；它从 Telangana
              创业生态中孵化出来，核心主张是为小卫星提供专属、可定制的发射服务。官网把业务定义为按需进入轨道；独立报道则展示出具体运载器路线图：已飞行的 Vikram-S 亚轨道验证器、近期 Vikram-1
              轨道火箭，以及配备低温上面级的更大型 Vikram-2。工业版图已不再是车库阶段故事。公开来源显示，公司早期在 Hyderabad 机场附近拥有 60,000 square foot 一体化研发设施，后来在
              Hyderabad 建成 Infinity Campus / Max-Q 制造版图，面积大约 250,000 square
              feet。这个物理规模很关键，因为发射初创公司通常不是败在概念质量，而是卡在能否足够快地把硬件、测试和发射运营工业化，从而支撑发射节奏。因此，Skyroot
              在地理位置、创始人、产品类别和实体建设上身份叙事很强，但在已验证任务节奏上仍处早期。
