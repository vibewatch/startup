companyProfile:
  summary: >
    Skyroot Aerospace 是一家位于 Hyderabad 的私营发射公司，2018 年由前 ISRO 科学家 Pawan Kumar Chandana 和 Naga Bharath Daka
    创立。公开证据显示，它不是纸面概念，而是一个真实的发射平台故事：Skyroot 在 2022 年完成 Vikram-S 亚轨道任务，面向市场推出 Vikram-1 和 Vikram-2 轨道运载器，并在 Hyderabad
    扩大到大规模工业版图，同时已披露融资约 $160 million，其中包括 2026 年 5 月一轮融资，据报道估值 $1.1 billion。与此同时，公司仍缺少完成轨道发射、具名付费轨道客户，以及透明发射业务经济性的公开证据。
