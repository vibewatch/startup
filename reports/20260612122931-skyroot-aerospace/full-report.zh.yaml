  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the comparable set explicitly requested for this chapter plus the most relevant economic floor and
        domestic substitute available in reviewed public evidence through 2026-06-12.
    columns:
      - 可比对象
      - 状态
      - 估值 / 定价 / 状态锚点
      - 运营标志
      - 重要性
      - 主要限制
    rows:
      - - Rocket Lab
        - 上市
        - 据 StockAnalysis，2026-06-12 市值约 $61.26B
        - 2026 Q1 收入 >$200M；积压订单 >$2.2B；Electron 300 kg LEO
        - 展示公开市场愿意为已飞行验证的发射能力叠加空间系统规模支付什么价格。
        - 相比 Skyroot，Rocket Lab 验证更充分、业务更多元，因此是情绪上限锚点，而非直接可比公司。
      - - Firefly Aerospace
        - 私营 / IPO 路径
        - 2024 年 Series D 融资 $175M；私营估值 >$2B；2025 年 IPO 营销估值最高 $6.04B
        - Alpha 扩产叠加 Elytra / MLV 叙事；2025 年目标发射 4-6 次 Alpha
        - 显示在长期利润历史出现前，投资者也愿意为响应式空间叙事付费。
        - 美国防务邻近性和资本市场深度都超过 Skyroot 所处环境。
      - - Isar Aerospace
        - 私营
        - 2026 年 EUR 270M Series D；据报道估值参照为 EUR 2.0B-2.2B
        - 首飞失败后的恢复、全球扩张、目标年产 40 枚运载器
        - 表明即便重复节奏尚未形成，主权发射稀缺性也能支撑大额估值。
        - 欧洲主权需求动态与印度有实质差异。
      - - Agnikul Cosmos
        - 私营
        - 2025 年以约 $500M 估值融资约 $17M
        - 印度私营发射同行，仍在扩大生产和回收技术
        - 印度私营发射商在形成节奏前最接近的本地估值锚点。
        - 资本基础更小，技术验证阶段也不同。
      - - SpaceX 拼车发射
        - 经济底线，不是股权可比对象
        - 2026 年，前 50 kg 至 SSO 收费 $350k，增量 $7k/kg
        - 按已公布的表价经济性，500 kg 等效舱位约 $3.5M
        - 为每一家专用小型发射商划定价格底线；要跨过去，只能靠灵活性或主权属性。
        - 不是估值可比对象，也不是专用发射服务。
      - - SSLV / ISRO / NSIL
        - 国家支持的本土替代方案
        - 没有私募股权估值类比；背景是官方按需发射商业化
        - 最高 500 kg LEO，主打快速周转和工业化生产
        - 约束“Skyroot 默认拿下印度响应式发射需求”的投资逻辑。
        - 国家支持项目的经济性不能直接映射到风险投资估值。
    notes: 这张表有意把股权可比对象和一个非股权经济底线放在一起；发射创业公司的估值，一部分看资本市场愿意付多少，另一部分看任务买家付得起多少。
