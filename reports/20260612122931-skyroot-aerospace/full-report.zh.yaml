      - number: '5.2'
        title: Vikram-I 架构与推进栈
        blocks:
          - type: paragraph
            body: >-
              Skyroot 当前供给的技术核心，是 Vikram-I 的混合架构：三段固体级提供强劲上升能量，再叠加液体推进层完成轨道精度控制。独立技术摘要和 Skyroot 相关报道中，运载器都稳定呈现为
              Kalam-1200 / Kalam-250 / Kalam-100 栈，由 Raman 液体系统处理入轨或控制任务。这个设计选择契合管理层反复强调的卖点：Skyroot
              能把固体发动机易存储、制造快的优势，与液体推进的轨道精度结合起来。它也解释了 Skyroot 为什么持续强调碳复合材料和增材制造是差异化点：公司声称靠这些杠杆实现更轻结构、更少零部件和更短周期。


              不够干净的是公开规格面。Skyroot 自有页面和第三方报道中的载荷数字差异很大，连 Raman 命名也不一致。官网仍宣传 LEO 350 kg、SSO 260 kg；实时预订流程把数字抬到 400
              kg，另一处甚至写到 500 kg；Gunter 技术摘要列出 480 kg 到 500 km LEO，以及 290 kg 到 500 km SSO；Times of India
              则称早期测试发射只会携带部分载荷，之后才接近 300 kg 满载。因此，架构方向上可信，但面向客户的权威公开数据包仍弱于工程叙事。
