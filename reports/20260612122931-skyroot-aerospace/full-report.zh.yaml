      - number: '2.3'
        title: 买方、付款方与采用流程
        blocks:
          - type: paragraph
            body: >-
              Skyroot 的买方图谱很杂，这让市场比单一发射价格表暗示的更复杂。可能的商业买方是小卫星运营方、星座建设方和国际任务聚合方，它们关心轨道、发射时点和集成灵活性。可能的印度机构买方或赋能交易对手，是 ISRO
              相关实体、国防或民用机构，以及借助 IN-SPACe
              监管路径使用私营发射的生态伙伴。因此，付款方并不是一种。在商业任务中，付款方是航天器运营方或任务总包；在主权或战略场景中，付款方可能是政府项目办公室或国家航天预算。采用流程也会制造摩擦。买方必须从任务需求走到发射器选择，再进入监管授权、载荷兼容、集成、靶场排期，以及保险或任务保障检查。这有利于那些不仅能提供低成本发射，还能可信提供流程清晰度和响应速度的供应商。Agnikul、Rocket
              Lab、Firefly 和 Isar 的官方定位都强调某种相同主张——排期控制、定制轨道或专属服务——说明市场已经收敛到共同价值主张。Skyroot
              因此不是在发明新的需求类别；它是在既有服务逻辑里争胜，而可靠性和节奏证明比口号更重要。
