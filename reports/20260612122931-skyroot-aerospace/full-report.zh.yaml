      - number: '6.4'
        title: 买方经济性、集中度风险与没有具名轨道付款方的含义
        blocks:
          - type: paragraph
            body: >-
              Skyroot 公开披露的经济模型能勾勒机会，却看不清客户底盘。管理层称，造一枚火箭大约需要 $2–3 million，每次发射可带来约 $5 million 收入；公司还计划 2026 年按季度发射，2027
              年按月发射。这些信息告诉投资人，模型不只需要偶尔跑出有声量的任务，更需要稳定装满发射清单、快速复用制造产能。但从客户质量看，最关键的指标仍未披露：拼车每座价格、市场首发客户折扣、取消条款、保险负担、头部客户集中度，以及预期收入有多大比例绑定单一主权或商业买方。


              这正是反向解读有意义的地方。Moneycontrol 的评论文章抓住了重点：独角兽头衔之后，真正的考验才开始——反复入轨成功、稳定发射节奏、制造纪律，以及达到出口级别的经常性需求。Via Satellite
              又补上一条尤其重要的客户侧提醒：可靠性和保险可得性必须靠多次成功飞行来证明。在 Skyroot
              公布付费轨道客户，并证明这些客户会复购、扩量或按细分市场分散之前，正确结论不是需求不存在，而是公司尚未给出足够公开证据，证明一条有希望的发射前收入管线，已经变成耐久、可复制的轨道客户业务。
