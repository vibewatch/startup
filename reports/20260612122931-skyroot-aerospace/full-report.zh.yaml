      - number: '7.4'
        title: 客户和积压订单风险仍然很高，因为需求大多还是管线故事，而市场结构已经偏向拼车规模
        blocks:
          - type: paragraph
            body: >-
              Skyroot 的客户故事方向上可信，但在投资人最需要具体信息的地方仍然单薄。公司有兴趣管线、Exolaunch 集成合作伙伴和 Axiom 谅解备忘录，也在发射流程中公开销售专属任务和拼车任务。但它尚未公开点名
              Vikram-1
              载荷合作伙伴，没有披露确定的轨道订单簿，也没有说明已宣布关系中哪些是有约束力的商业发射合同，哪些只是生态合作。这让当前积压订单质量很难估值。一次搭载未具名载荷的首飞仍可能是真实里程碑，却无法告诉外部人有多少收入是合同化的、可取消的、渠道驱动的，或依赖合作伙伴集成的。


              在 Skyroot 厘清这些问题时，外部市场并不宽容。SpaceX 拼车单次任务已经可以运送三位数载荷；独立市场评论和发射行业人士引述反复回到同一点：小型运载火箭很难在每公斤价格上匹敌拼车。即使是 Rocket
              Lab 的已验证地位，也需要靠 21 次发射的年度纪录支撑；其他小型发射开发商则告诉 SpaceNews，他们每年需要六到 20 次发射才刚能盈亏平衡。因此，Skyroot
              正在一个市场里销售：可靠性和进度控制可以支撑溢价，但前提是公司先用真实飞行和具名客户复购把两者建立起来。
