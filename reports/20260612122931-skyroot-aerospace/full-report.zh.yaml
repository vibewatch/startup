      - number: '5.3'
        title: 制造系统与发射赋能
        blocks:
          - type: paragraph
            body: >-
              Skyroot 的制造和交付系统比幻灯片初创公司更扎实。PM India 和多篇 2025–2026 年报道把 Infinity Campus 描述为约 200,000 square
              feet，并具备每月建造一枚轨道火箭的能力；Analytics India 则补充了尽调真正关心的具体生产细节：自动化纤维缠绕、CNC 加工和复合材料洁净室。招聘页面进一步说明，这不是外包营销语言。Skyroot
              正在积极招聘复合材料制造、航空电子、低温测试、阀门工程和任务关键采购岗位，强烈暗示其围绕推进、结构和发射硬件采取垂直整合建设思路。


              话虽如此，产品仍与印度公共航天栈深度交织。ISRO 承载 Raman 和 Kalam 测试；Mission Prarambh 使用 Satish Dhawan Space Centre；IN-SPACe
              发布的一体化发射任务清单仍把 Vikram-I 时间线标记为暂定，取决于合同和授权。Skyroot 还通过 Exolaunch
              增加了外部商业依赖，后者意在为专属和拼车客户提供部署硬件和发射活动支持。运营层面的结论是，Skyroot 的赋能技术不只是火箭，而是自有复合材料 / 制造能力、ISRO 测试和发射基础设施、IN-SPACe
              监管通道，以及合作伙伴载荷集成工具的组合。
