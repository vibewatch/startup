      - number: '1.3'
        title: 融资历史、股权结构表与估值逻辑
        blocks:
          - type: paragraph
            body: >-
              Skyroot 的融资历史异常重要，因为在经常性发射收入出现前，它是外部信心最清晰的公开代理指标。公司披露 2018 年完成 $1.5 million 种子轮，2021 年完成 $11 million
              Series A，2022 年初完成 $4.5 million 过桥轮，2022 年 9 月完成 GIC 领投的 $51 million Series B，2023 年 10 月完成 Temasek 领投的
              $27.5 million pre-Series C，并在 2026 年 5 月 7 日宣布一轮 $60 million 融资。最新一轮据报道带来 $1.1 billion 估值，并让 Skyroot
              成为印度第一家航天科技独角兽。多方来源相互印证，2026 年财团包括 Sherpalo Ventures、GIC、BlackRock 管理基金、Playbook Partners、Shanghvi Family
              Office、Greenko 创始人和 Arkam Ventures，Ram Shriram 同时进入董事会。本章最强张力就在这里：近期报道常重复较低历史总额，例如大约 $95 million 或 $115
              million，但公司背书的 2026 年口径是累计融资 $160 million。更合理的读法是，旧数字在 2023 年和 2026
              年轮次后已经过时，而不是公司错报最新总额。投资人真正承销的不是当前已披露收入，而是 Vikram-1 入轨并把工业能力转化为发射服务业务的概率，而且发射节奏要足够重要。
