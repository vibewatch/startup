  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值标记是真实的，但运营分母仍缺失
        blocks:
          - type: paragraph
            body: >-
              Skyroot 在 2026 年 5 月确实完成了一轮真实市场出清的私募估值：多家媒体称该轮规模约 $60 million，投前估值 $1.1 billion，由 GIC 和 Sherpalo
              共同领投，BlackRock 管理的基金也在新投资方之列。这让估值本身具有新闻价值，但没有解决核心承销问题。最干净的公开运营数据点直到后来才出现在 Entrackr 的 FY26 临时回顾中：Skyroot
              在商业发射运营开始前，运营收入已超过 Rs 100.6 crore，且全部来自 Space Systems 业务，而不是 Vikram 发射。因此，公开发射经济性仍只是代理经济性：与管理层相关的报道引用每次发射约
              $5 million 收入、$2 million 到 $3 million 建造成本，但仍没有公开已实现发射
              ASP、任务组合、退款条款、毛利率，或已签客户桥接。换句话说，当前估值并非没有资本形成支撑；但投资人通常用来判断十亿美元估值是否合理的那个精确运营分母，仍没有支撑它。
