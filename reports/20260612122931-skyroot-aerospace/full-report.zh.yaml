  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: 公开旅程从能承受风险的载荷所有方开始，随后进入预订、伙伴集成、以验证为核心的首飞，之后才可能转向重复入轨需求。
