      - number: '4.2'
        title: 单位经济学、发射节奏假设与烧钱逻辑
        blocks:
          - type: paragraph
            body: >-
              可投资性问题不是 Skyroot 能否讲出一个看似合理的发射故事，而是隐含单位经济学能否扛住从原型到节奏化运营的跃迁。公开代理指标方向上正面，但仍太不完整，无法硬承销。TechStory 和 Asianet
              Newsable 都报道了与管理层相关的数字：每次发射收入约 $5 million，每枚火箭制造成本 $2 million 到 $3
              million；这暗示在发射运营、保险、返工、摊销资本开支和公司管理费用之前存在毛差。Via Satellite 又提供了更有运营价值的视角：管理层称已经投入制造每年 12
              枚火箭所需资本开支，近期目标是在当前财年完成四到六次发射，并在可靠性验证后最终实现更快的后续任务。风险恰恰就在这里。Entrackr 的 FY26 临时数字显示，EBITDA 为负 Rs 130.3
              crore，员工费用 Rs 95.5 crore，运营和行政费用 Rs 88.2 crore。这些数字与一家仍在为工程深度、测试基础设施和商业化开销投入资金、等待真实发射节奏的公司相符。Space Systems
              的过渡收入削弱了烧钱故事最尖锐的部分，但还没有证明发射业务具备有吸引力的贡献利润率。公开记录也没有披露分业务线毛利率、发射保险成本、翻修或报废风险、现金转化时点，或客户预付款中可取消意向与确定合同载荷的比例。正确读法是，如果
              Skyroot 跑出节奏，它可能拥有经济上可行的产品；但当前公开证据只支持情景模型，而不是已完成的单位经济学案例。
