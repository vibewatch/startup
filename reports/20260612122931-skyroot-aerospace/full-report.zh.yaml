      - number: '8.5'
        title: 最终判断：投资人能解释这个估值，但公开证据仍显示它偏高
        blocks:
          - type: paragraph
            body: >-
              因此，基于公开证据的判断是价格敏感，而不是否定公司。Skyroot 并非明显被过度炒作到没有工业现实：它有真实资本、真实制造故事、合理的主权准入切口，以及 Space Systems 这项桥接业务。但它也缺少让
              $1.1 billion
              估值显得舒服的精确发射业务证明。最重要的缺失项包括已实现发射价格、贡献利润率、客户兴趣转化为确定积压订单、轮次条款包袱，以及当前现金跑道。没有这些，基准情景没有提供足够可见的上行，无法仅凭公开证据就支持强烈正面判断。最好的综合结论是，这个估值看起来偏高，而不是彻底昂贵：放在乐观里程碑框架里可以辩护，但在已披露运营证明上还不具备吸引力。正确姿态是把
              Skyroot 留在主动跟踪名单上，深入尽调，并等到轨道证明和分母披露出现后，再把当前估值视为凭自身条件可投资。
            claimRefs:
              - CV010
              - CV016
              - CV034
              - CV035
              - CV036
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
              - CV049
              - CV050
          - type: table
            tableRef: TV006
            claimRefs:
              - CV016
              - CV034
              - CV035
              - CV040
              - CV041
              - CV044
              - CV045
              - CV049
      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 不要把真实融资事件和完整估值论证混为一谈
            body: Skyroot 完成了独角兽轮，但已披露运营证据仍更像一项桥接业务在融资支持发射投资逻辑，而不是一个已被证明、且收入已经匹配估值的发射业务。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV034
              - CV049
          - type: callout
            title: 为什么这个估值并非不理性
            body: 主权发射稀缺性、可见的工业扩建，以及全球投资人对发射平台叙事的偏好，给成熟投资人提供了一个合理理由：可以在成熟盈利出现之前承销 Skyroot。
            calloutType: strength
            claimRefs:
              - CV015
              - CV023
              - CV026
              - CV035
              - CV038
              - CV041
          - type: callout
            title: 一个失败里程碑就可能迅速压缩估值
            body: 由于发射分母仍缺失，一次延迟、异常或疲弱的积压订单披露，都可能让 Skyroot 比独角兽标签暗示的更快从战略平台故事退回硬件收入故事。
            calloutType: risk
            claimRefs:
              - CV016
              - CV032
              - CV042
              - CV046
