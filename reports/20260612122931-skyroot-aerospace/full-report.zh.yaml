      - number: '7.3'
        title: 技术风险现在集中在首次轨道飞行可靠性、失败后恢复，以及产能与节奏之间的缺口
        blocks:
          - type: paragraph
            body: >-
              小型发射历史不支持把首次轨道尝试看成常规事件。印度自己的 SSLV 首飞虽然低级级段工作正常，但末级失败；Isar 的首次 Spectrum 发射在数秒内失去姿态控制，随后需要一轮纠偏调查；Kairos
              已经在多次尝试中连续失败。这些案例不能证明 Vikram-1
              会失败，但足以说明，对仍处于入轨前阶段的小型运载火箭来说，首次飞行异常必须被建模为现实存在的基准情景风险。承销问题也不只是任务损失。一次失败可能触发数月调查、重新鉴定、新一轮监管工作，以及客户信心重置。


              这很关键，因为 Skyroot 公开讲述的发射节奏已经被拉得很紧。早期融资表述指向 2023 年商业运营，而 2026 年的讨论仍围绕首次轨道尝试。管理层现在谈到每月一枚火箭的生产能力和四到六次发射，但 Via
              Satellite 和 ET 都用相同前提限定这些目标：发射港可用性、首次飞行观测结果和任务成功。因此，运营风险落在发射可靠性与制造吞吐量的交叉点上。Skyroot
              也许能快速造出硬件，但仍必须证明这些硬件可以在一个可复制循环里完成集成、授权、发射、恢复和客户续订。
