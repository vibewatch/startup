  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 已验证客户类型与当前证据底线
        blocks:
          - type: paragraph
            body: >-
              Skyroot 最强的客户证据仍是历史性的、亚轨道层面的。2022 年 11 月 Mission Prarambh 搭载三件客户载荷，并公开具名：BAZOOMQ Armenia、Space Kidz India
              和 N-Space Tech India。这很重要，因为它同时证明三件事。第一，在轨道能力存在之前，真实第三方已经把硬件托付给 Skyroot。第二，这些第三方并非同一种买方：Space Kidz 代表教育和
              STEM 赞助，N-Space Tech 代表印度初创技术验证买方，BAZOOMQ 代表国际研究实验室关系。第三，这一证明明确落在客户层面，而不是 logo 墙营销；这些载荷绑定了真实任务结果。


              同样重要的是它没有证明什么。上述已披露客户都不是付费轨道参考账户，也没有提供重复使用、续约或规模化星座需求的证据。因此，公开记录只支持一个狭窄结论：Skyroot
              能为里程碑飞行吸引愿意承受早期风险、任务容忍度较高的载荷所有方。这有价值，因为它显示在完整飞行履历出现前，已有买方愿意买入公司发射故事；但这仍明显弱于来自拥有高价值载荷或排期敏感性的商业运营方的经常性轨道需求证明。
