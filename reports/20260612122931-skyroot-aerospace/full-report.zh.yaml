      - number: '2.2'
        title: 规模测算视角与政策背景
        blocks:
          - type: paragraph
            body: >-
              对 Skyroot 可用的规模测算视角受证据约束，因为最宽泛的已发布数字描述的是整体航天经济，而不是专属小型发射需求。公开报道仍引用印度到 2033 年大幅提升航天经济份额的雄心，也提到该国已有 200
              多家航天初创公司，但这些数字是战略政策标记，不是可直接用于 Skyroot 的 TAM。更有决策价值的是解释市场为何存在的政策和活动标记：IN-SPACe 在 2020 年作为私营航天单一窗口赋能方成立、2025
              年 Technology Adoption Fund、印度日益高涨的商业航天话语，以及 2025 年全球发射环境录得 317 次成功轨道发射。这些事实不能告诉投资人 Skyroot
              能赢下多少载荷，但它们显示供给、政策和投资人关注度都比 ISRO
              垄断时代结构性更高。关键矛盾在于，这些宽口径规模标记都没有消除核心微观经济学问题。客户如果能等拼车，价格会赢；客户如果需要精确轨道、定制集成路径或主权替代方案，专属发射仍有防守性。因此，严谨的市场章节必须保留失败的规模测算路径，而不是假装航天经济大标题就等同于
              Skyroot 的可服务市场。
