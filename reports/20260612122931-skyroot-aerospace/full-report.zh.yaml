      - number: '7.2'
        title: 监管与设施风险是结构性的，因为印度仍中介审批、责任和发射场准入
        blocks:
          - type: paragraph
            body: >-
              Skyroot 并不在一个去监管化的商业发射市场里运营。IN-SPACe 仍是私人运载火箭的授权和监督机构，并明确控制非政府实体如何使用 Department of Space 和 ISRO
              基础设施。综合发射清单把实际后果说得很清楚：Vikram-1 时间表只是暂定，仍取决于技术商业合同，以及 IN-SPACe 的批准和授权。即使 Skyroot
              的火箭硬件已具备飞行条件，这也会直接带来进度和交易对手风险。


              设施集中进一步放大了政策层。印度当前商业和私人发射活动仍通过 Sriharikota 运转；ISRO 任务、NSIL 任务、国防载荷、载人航天工作和私人发射，都要争夺有限的发射与测试能力。NSIL
              不只是背景基础设施；它已经在同一公共体系内销售自己的发射服务。再叠加国际空间法义务，责任也不只落在 Skyroot
              身上。印度仍是非政府发射的责任国和赔偿责任国，并必须登记发射物体。这种结构意味着，监管审批、赔偿条款和载荷许可不只是文书工作，而是发射节奏的真实瓶颈之一。
