      - number: '4.4'
        title: 披露限制与具体尽调卡点
        blocks:
          - type: paragraph
            body: >-
              对一家印度私营发射公司来说，一定不透明度正常；但对承销十亿美元估值的投资人来说，剩余不透明度仍然重大。已审阅来源足以确认融资额、制造规模、发射雄心，以及 Space Systems 过渡收入的存在。它们不足以承销
              ARR、经常性发射订单、客户集中度、毛利率、现金跑道、债务义务或已实现发射定价。QuickCompany、Tracxn 和 Inc42
              等接近备案的聚合平台显示，公开公司记录线索存在，但它们大多提供过时或区间化快照，而不是当前一手财务报表。Tracxn 显示当前 ROC Hyderabad 注册和最近 AGM 日期；Inc42 对 FY24
              收入和累计融资的取整，与 2026 年 5
              月公司背书总额不同，说明二级数据集会滞后于真实事件。这是有用的披露质量信号，但不能替代经审计报表。反向证据不是欺诈或会计压力，而是需求、节奏和利润率主张仍跑在公开证明前面。The Space Review
              明确警告，印度私营发射初创公司即便轨道飞行成功后也可能仍缺客户；Via Satellite 采访也清楚显示，管理层自己把节奏和可靠性视为商业解锁点。因此，财务结论是有条件的。Skyroot
              有足够资金和工业建设，值得认真尽调；但公开运营披露仍不足，不能在不直接获取合同、利润率、现金和客户集中度数据的情况下支撑干净承销模型。
