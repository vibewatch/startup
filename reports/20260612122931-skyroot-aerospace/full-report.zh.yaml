  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与真正公开的信息
        blocks:
          - type: paragraph
            body: >-
              Skyroot 的公开财务故事不寻常，因为公司在公开披露成熟发射服务 P&L
              前就已达到独角兽状态。官网仍在销售主张，而不是价目表：为小卫星提供按需、可定制发射。这很重要，因为它确认了公司想要的变现模式，但没有告诉投资人客户实际支付多少、模型背后的利用率假设是什么，或早期合同到底是专属发射、拼车、工程服务，还是某种混合。最强的新公开数据点是
              Entrackr 2026 年 6 月关于 FY26 临时财务的报道，称 Skyroot 在 Vikram-1 商业发射开始前运营收入超过 Rs 100.6 crore，且全部来自 Space Systems
              业务。换句话说，轨道前 Skyroot 已不再是纯粹无收入发射初创公司，但在支撑估值的实际发射业务上，它仍未规模化。2026 年 1 月和 3 月的公开报道又提供了两个可用但仍由管理层框定的定价代理：造一枚火箭约
              $2 million 到 $3 million，每次发射收入约 $5 million。这些数字有助于粗略搭建单位经济学框架，但公司仍未发布官方价目表、实现
              ASP、折扣结构、保险转嫁安排或合同模板。因此，收入质量看起来混合但在改善：部件和系统销售给 Skyroot 提供过渡收入线，而核心承销案例仍取决于能否把发射意向变成可重复任务收入。
