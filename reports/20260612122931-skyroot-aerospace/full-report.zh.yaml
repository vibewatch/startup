      - 看多论点
      - 反驳 / 反向逻辑
      - 何种证据会改变判断
    rows:
      - - 国内战略楔子
        - 印度可能重视本土私营轨道发射商，以及它带来的主权准入可选性。
        - SSLV 已经削弱国内稀缺性叙事，并可吸收部分国家导向需求。
        - 在泛泛的主权叙事之外，拿出差异化客户胜单证据。
      - - 产业建设
        - Capex、园区和宣称的年产 12 枚火箭能力，说明 Skyroot 正在建设真实基础设施。
        - 没有飞行节奏的工厂规模，可能变成固定成本负担，而非护城河。
        - 证明吞吐能转化为可重复商业任务。
      - - 投资者质量信号
        - GIC、Sherpalo 和 BlackRock 管理基金意味着严肃尽调和长期信念。
        - 名望投资者不能替代缺失的单位经济披露，也不能消除首飞风险。
        - 公布发射 ASP、利润率桥接和合同质量。
      - - 板块估值支撑
        - Firefly 和 Isar 表明，成熟利润出现之前，投资者也会支持数十亿美元级发射估值。
        - 这些同行要么处在更大的防务生态中，要么披露了更强的生产 / 融资叙事。
        - 拿出可比证据，证明 Skyroot 也能赢得类似战略或主权预算。
      - - 过渡收入
        - Space Systems 收入削弱了纯粹「收入前」的看空论点。
        - 过渡业务不等于证明独角兽估值下以发射为主导的经济性。
        - 拆出分部利润率，以及从组件业务转化为发射服务的路径。
    notes: 各行说明为什么当前估值可以解释，但尚不能被最终证明公平；每条投资逻辑都有独立反向逻辑，因为估值支撑对里程碑高度敏感。
