      - number: '8.2'
        title: 为什么成熟投资人仍可能支持 $1.1 billion 轮
        blocks:
          - type: paragraph
            body: >-
              尽管分母偏弱，投资人逻辑并不难重建。第一，Skyroot
              所在类别稀缺：它是印度私人轨道发射玩家，拥有本土政策顺风、创始人技术可信度和可见的制造扩建。公司官方界面反复推同一个卖点：面向全球小卫星市场的按需、可定制发射。第二，管理层和支持性报道一直把 Skyroot
              框定为基础设施押注，而不是应用式押注。SpaceNews 引述 Sherpalo 的 Ram Shriram 称，该机构把 Skyroot 视为基础性基础设施，且成本性能比有吸引力；Via Satellite
              也记录称，一旦可靠性得到证明，公司已经投入资本开支，形成一年 12
              枚火箭的制造能力。第三，行业可比公司显示，在成熟盈利到来之前，只要有战略稀缺性和系列化生产叙事，投资人就会支持发射公司。如果基金相信印度会支持不止一条商业发射路径，并且主权或国防需求可以抵消部分纯价格竞争，那么在轨道证明之前高价下注就可以理解，哪怕还谈不上舒服。
