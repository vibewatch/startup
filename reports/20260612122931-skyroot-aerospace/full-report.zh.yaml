      - number: '5.4'
        title: 路线图、节奏主张与仍未证明的部分
        blocks:
          - type: paragraph
            body: >-
              路线图故事雄心很大，也有部分证据支撑。仅看推进，Skyroot 公开线索显示，公司从时间线上的 Raman-1 和 Dhawan-1 里程碑，推进到 ISRO 支持的 Raman-II 测试和 2026 年
              Dhawan-III methalox 热试车。这足以说明 Skyroot 在打造真正的推进家族，而不是一次性验证器。但这不足以把 Vikram-II 的低温分支视为商业就绪。公开 Vikram-II
              运力数字已经在 LEO 900 kg 与约 1,100 kg 之间分歧，而且没有披露一体化上面级或接近飞行状态的运载器测试。因此，低温路线是路线图资产，还不是可承销产品。


              任务节奏更明显仍是主张，而非已交付能力。管理层谈过当前财年四到六次发射、每年 12 枚火箭制造产能，甚至 2027 年按月发射。这些目标与 Infinity Campus 建设和专属加拼车模式方向一致，但 Via
              Satellite 也记录了最关键的保留条件：发射港可用性、制造准备度和首飞观察结果。在 Skyroot 发布一次成功轨道发射、迅速完成第二次，并统一载荷 /
              用户指南数据之前，核心技术风险不是公司能否造出令人印象深刻的硬件，而是能否把硬件转化为可重复、可投保、规格稳定的发射服务。
