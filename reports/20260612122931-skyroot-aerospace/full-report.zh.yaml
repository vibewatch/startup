  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Skyroot
              放在整个印度或全球航天经济里估值。它真正的市场边界窄得多：为需要专属、定制化或对排期敏感的小卫星提供进入特定低地球轨道或太阳同步轨道的发射服务。这个边界包括商业地球观测星座、重视轨道选择或排期控制的国防与民用载荷，以及不能或不愿等待通用拼车窗口的国际客户。它不包括大多数卫星制造、下游地理空间分析、载人航天、大型地球同步发射，以及风险叙事里常见的更宽泛“航天经济”故事。现状替代方案很清晰。最低价一端是
              SpaceX 拼车，单看裸价很难击败。高端专属一端是 Rocket Lab Electron 和 Firefly Alpha，二者销售的是响应速度和任务控制。在印度，最直接的替代方是 ISRO 的 SSLV 和
              Agnikul 新兴的 Agnibaan，它们争夺国家关注、发射基础设施和同一批小载荷客户。因此，市场分析必须从服务替代逻辑开始，而不是从宏观航天经济话术开始。
