        blocks:
          - type: callout
            title: 确实有客户证明，只是还不是轨道商业证明
            body: Skyroot 并非从零开始。Prarambh 公开点名了三家载荷客户，其中包括一家国际客户，这比泛泛的发射兴趣声明更有力。真正的问题是，这类早期风险客户证明能否转化为具名的付费轨道账户。
