      - number: '7.5'
        title: 融资和稀释风险是真实的，因为资本开支先于轨道证明扩张，投资逻辑失效触发点必须明确
        blocks:
          - type: paragraph
            body: >-
              Skyroot 显然已经吸引资本，但这不等于融资风险已经解除。截至 2026 年 5 月，公司累计融资 $160 million，在首次轨道收入之前达到 $1.1 billion 估值，且此前在 Series B
              中使用过优先股融资结构。与此同时，它又把新的实体规模叠加到运营计划上：Infinity Campus、Max-Q、Tirupati 制造与仓储基地，以及管理层关于未来投入超过 Rs 1,000
              crore、以实现快速和按需发射能力的表述。这正是典型的规模化前资本开支姿态：如果发射节奏按时到来，会显得有远见；如果发射学习循环比计划更久，就会很痛。


              正确承销方式，是在令人失望的发射发生之前就先定义止损标准。如果 Vikram-1
              因审批或准备状态未闭环而再次推迟，如果首飞带来漫长调查周期，如果发射后仍未披露具名轨道客户，或如果公司在建立可靠性和重复节奏之前就需要新资金，估值故事就应大幅下调。反过来，成功完成首次轨道任务后迅速进行第二次飞行，出现具名复购客户，并有证据显示保险公司和合作伙伴已把该系统视为真实商业基础设施，则会实质性降低今天的风险堆栈。
