  - id: TV005
    title: 投资逻辑破裂与止损触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 轨道验证再次延后
        - Vikram-1 在下一段可见周期内仍未完成具备商业可信度的轨道任务。
        - 当前估值失去最主要的前瞻催化剂支撑，回到私人公司尚未形成发射节奏前的逻辑。
        - 暂停新增资本，按悲观情景重新承销。
      - - 首飞异常后没有快速学习
        - 失败或部分成功的任务之后，公司长期停飞，而不是跑出清晰纠偏闭环。
        - 发射节奏叙事变弱，固定成本负担加重。
        - 假设资本回收更慢，降价融资风险更高。
      - - 客户积压订单继续不透明
        - 没有具名客户、没有确定积压订单桥接，也没有从意向转为合同的证据。
        - 战略叙事不再转化为需求证明。
        - 对管理层的需求说法大幅打折。
      - - 已披露发射利润率低于预期
        - 实际发射 ASP 或利润率明显低于当前报道隐含的代理经济性。
        - 估值失去通向有吸引力发射现金生成的路径。
        - 将基准情景重切到更接近硬件业务的逻辑。
      - - 融资条款显示沉重优先权或稀释包袱
        - 优先股堆叠、债务或反稀释条款显著压低普通股上行。
        - 即使公司执行成功，这个进入价格也未必转化为风险投资回报。
        - 领投前要求看清条款清单。
    notes: 这些是投委会级别的止损标准，不是泛泛而谈的风险；每一项都会直接削弱支撑 $1.1 billion 估值所需的逻辑。
    claimRefs:
      - CV015
      - CV016
      - CV032
      - CV036
      - CV040
      - CV041
      - CV042
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 发射收入分母
        - 已签发射合同、实际定价，以及专用发射与拼车发射的任务结构。
        - 没有这些，当前估值就无法对应到投资者实际在定价的业务。
        - 索取合同级项目管线、实际 ASP 和取消条款。
      - - 发射单位经济性
        - 贡献利润率桥接，包含保险、发射运营、储备和折旧。
        - $2M-$3M 的制造成本代理值，不足以承销现金生成能力。
        - 获取前三次飞行的任务级成本瀑布。
      - - 积压订单质量
        - 具名客户、可退还与确定存款，以及积压订单转收入的证据。
        - 需求质量决定发射节奏是真实存在，还是只是愿景。
        - 检查积压订单账龄、里程碑排期和大客户集中度。
      - - 资本结构
        - 优先股堆叠、清算条款、债务，以及任何围绕设施的结构化融资。
        - 好公司如果条款不对，也可能是差投资。
        - 审阅完整股权结构表、最新条款清单和债务明细表。
      - - 现金跑道与烧钱速度
        - 当前现金余额、月度净烧钱速度和触发融资的里程碑。
        - 如果轨道验证比计划更久，下一轮融资时点很关键。
        - 索取最新管理账和 18 个月现金跑道计划。
      - - 战略需求证明
        - SpaceX 拼车发射和 SSLV 尚未覆盖的、具体国防、主权或可出口本土应用场景。
        - 主权溢价是乐观情景的核心。
        - 用客户访谈和采购路径验证，不只听管理层叙事。
    notes: 这些尽调问题有意收窄范围：每一项都补上一个目前阻碍更强估值判断的缺口。
    claimRefs:
      - CV016
      - CV034
      - CV035
      - CV040
      - CV041
      - CV044
      - CV045
      - CV049
