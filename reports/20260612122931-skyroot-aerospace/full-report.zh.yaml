      - number: '8.3'
        title: 可比锚点：Rocket Lab、Firefly、Isar、Agnikul、SpaceX 和 SSLV
        blocks:
          - type: paragraph
            body: >-
              可比公司结论是双向的。SpaceX 拼车是最严苛的经济地板，因为 2026 年公布的基准价格为 50 公斤 $350,000、额外每公斤 $7,000，折算一个 500 公斤等效舱位约 $3.5
              million，低于 Skyroot 自己与管理层相关的每次发射 $5 million 收入代理。Rocket Lab 展示的是投资逻辑的正面版本：一旦小型发射公司证明发射节奏，并叠加 Space Systems
              规模，市场可以支撑远高于私募发射节奏前标记的估值。Firefly 和 Isar 是更相关的私人锚点，因为两者都表明，发射投资人会为多十亿美元区间的规模化叙事买单，尤其当战略或主权需求存在时。Agnikul 和
              SSLV 则是纠偏锚点。Agnikul 在 2025 年约 $500 million 的估值，是更本地的发射节奏前参考点；SSLV 则证明，Skyroot 不会独占印度响应式发射故事。这些对比并不意味着
              Skyroot 的估值不可能成立；它们只是说明，在 $1.1 billion 水平上，公司被当作一个新兴发射平台来估值，而不是一个已披露硬件收入的业务。
