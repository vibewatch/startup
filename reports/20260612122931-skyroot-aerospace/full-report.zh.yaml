  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开证据质量在历史具名载荷客户上最强，在入轨收入耐久性上最弱。
    data:
      columns:
        - 具名账户可见度
        - 任务结果具体度
        - 入轨商业相关性
        - 重复 / 留存可见度
      rows:
        - label: Prarambh 具名载荷客户
          values:
            - 强
            - 中等
            - 弱
            - None
        - label: 当前 Skyroot 预订流程
          values:
            - None
            - 弱
            - 中等
            - None
        - label: Exolaunch 入轨渠道证明
          values:
            - 无终端客户名称
            - 中等
            - 强
            - None
        - label: Vikram-1 首飞客户组
          values:
            - None
            - 中等
            - 中等
            - None
        - label: 主权需求叙事
          values:
            - None
            - 弱
            - 中等
            - None
    approximationNotes: 该矩阵比较的是证据质量，不是客户质量。强 / 中等 / 弱 / 无描述每一层有多少硬公开证明。
    claimRefs:
      - CU001
      - CU012
      - CU015
      - CU018
      - CU028
      - CU031
      - CU038
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 在根据当前缓释措施和公开证据调整后，对 Skyroot 最重要风险领域进行序数排序的矩阵。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 首次入轨失败或部分成功
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 监管 / 授权拖延
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 客户积压不透明
          values:
            - 高
            - 高
            - 中低
            - 高
        - label: 拼车发射价格压力
          values:
            - 高
            - 中高
            - 低
            - 中高
        - label: 航天港 / 基础设施瓶颈
          values:
            - 中高
            - 高
            - 中低
            - 高
        - label: 融资与稀释压力
          values:
            - 中高
            - 高
            - 中低
            - 高
    approximationNotes: 该矩阵使用从留存证据综合出的序位承销评分，而非数值概率。
    claimRefs:
      - CR003
      - CR014
      - CR021
      - CR031
      - CR038
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 首飞异常或延期如何层层传导，带来保险摩擦、订单储备疲软、发射节奏放慢和融资压力。
    data:
      nodes:
        - id: R1
          label: 首次试飞
          detail: Vikram-1 仍被定位为收集数据的测试任务。
          tone: risk
        - id: R2
          label: 发射异常或长期延期
          detail: 失败、部分成功，或进度反复后移。
          tone: risk
        - id: R3
          label: 可靠性证明缺口
          detail: 客户仍缺少多次成功入轨案例作为参照。
          tone: risk
        - id: R4
          label: 保险摩擦
          detail: 经纪商和承保方会犹豫，或大幅抬价。
          tone: risk
        - id: R5
          label: 未披露客户的订单储备偏软
          detail: 意向管线转成已签发射清单的速度偏慢。
          tone: risk
        - id: R6
          label: 交付节奏走低
          detail: 靶场准入和复飞时点比工厂口径推进更慢。
          tone: risk
        - id: R7
          label: 现金消耗拉长
          detail: Capex 和团队规模跑在发射服务现金生成之前。
          tone: risk
        - id: R8
          label: 更多资本或更弱条款
          detail: 运营证明完全闭环之前，新融资先到。
          tone: risk
        - id: R9
          label: 既有技术证明
          detail: Vikram-S 和 Raman-II 降低了纯粹从零到一的风险。
          tone: positive
      edges:
        - from: R1
          to: R2
          label: 可能变成
        - from: R2
          to: R3
          label: 拉大
        - from: R3
          to: R4
          label: 抬高
        - from: R3
          to: R5
          label: 放慢
        - from: R2
          to: R6
          label: 后移
        - from: R5
          to: R7
          label: 限制
        - from: R6
          to: R7
          label: 拉长
        - from: R7
          to: R8
          label: 迫使
        - from: R9
          to: R3
          label: 部分抵消
    claimRefs:
      - CR003
      - CR031
      - CR035
      - CR045
      - CR047
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 关键机构和合作伙伴依赖，决定 Skyroot 能否把硬件就绪转成可重复的商业发射服务。
    data:
      nodes:
        - id: D1
          label: Skyroot 发射服务
          detail: Vikram-1 及后续发射运营。
          tone: neutral
        - id: D2
          label: IN-SPACe 授权
          detail: 私营发射的单一窗口监管与监督机构。
          tone: risk
        - id: D3
          label: ISRO / Sriharikota 基础设施
          detail: 测试、靶场、发射台和发射运营支持。
          tone: risk
        - id: D4
          label: NSIL 公共发射供给
          detail: 有国家背书的专用发射和拼车发射替代方案。
          tone: risk
        - id: D5
          label: Exolaunch 集成层
          detail: 面向全球部署和拼车发射栈的合作伙伴渠道。
          tone: neutral
        - id: D6
          label: Axiom / 生态 MoU
          detail: 带来可信度和未来任务讨论，而不是硬订单储备。
          tone: neutral
        - id: D7
          label: 全球小卫星客户
          detail: 需要可靠性、保险准入和排期确定性。
          tone: risk
        - id: D8
          label: SpaceX 拼车发射基准
          detail: Falcon 9 拼车发射带来的价格和规模压力。
          tone: risk
        - id: D9
          label: Tirupati / Infinity 制造
          detail: 重 Capex 生产体系仍在扩张。
          tone: risk
      edges:
        - from: D2
          to: D1
          label: 授权
        - from: D3
          to: D1
          label: 支撑
        - from: D4
          to: D7
          label: 竞争
        - from: D5
          to: D7
          label: 连接
        - from: D6
          to: D7
          label: 向其释放信号
        - from: D7
          to: D1
          label: 预订
        - from: D8
          to: D7
          label: 对标定价
        - from: D9
          to: D1
          label: 供应
        - from: D3
          to: D9
          label: 约束节奏
    claimRefs:
      - CR001
      - CR015
      - CR018
      - CR036
      - CR043
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 估值判断沿着一条简单链条展开：真实融资和产业进展已经可见，但发射业务的分母和证明点还不够清晰，当前估值因此不够有吸引力。
    data:
      nodes:
        - id: round
          label: 真实独角兽轮次
          detail: 2026 年 5 月融资以 $1.1B 估值完成，投资方包含蓝筹机构。
        - id: bridge
          label: 桥接收入存在
          detail: FY26 公开收入来自 Space Systems，早于发射商业化。
        - id: proof
          label: 发射证明待补
          detail: 商业发射收入、节奏和实际 ASP 仍大体停留在预期层面。
        - id: denominator
          label: 分母缺失
          detail: 公开材料没有给出发射利润率、订单储备质量或合同条款桥接。
        - id: comp
          label: 可比公司支撑可能性
          detail: Firefly、Isar 和 Rocket Lab 证明，发射叙事可以拿到较高估值。
        - id: call
          label: 当前判断
          detail: 估值偏紧；继续跟踪，但等待证明或更好披露。
      edges:
        - from: round
          to: bridge
          label: 帮助验证
        - from: bridge
          to: proof
          label: 不能替代
        - from: proof
          to: denominator
          label: 维持
        - from: denominator
          to: call
          label: 推动
        - from: comp
          to: call
          label: 避免直接否决
    approximationNotes: 这条流程是决策逻辑，不是过程图；它说明为什么在公开证据下，即便融资真实，结论仍只是估值偏紧、不便宜。
    claimRefs:
      - CV001
      - CV010
      - CV016
      - CV034
      - CV038
      - CV049
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值最大的敏感项是证明和披露，而不是 TAM 叙事。
    data:
      items:
        - label: 入轨任务成功
          value: 10
          tone: positive
          note: 最大单一驱动项，因为它把叙事转成证明。
        - label: 重复发射节奏
          value: 9
          tone: positive
          note: 节奏决定 Capex 是护城河还是负担。
        - label: 披露的发射 ASP + 利润率
          value: 9
          tone: positive
          note: 分母缺失是今天最大的分析卡点。
        - label: 确定订单储备 / 具名客户
          value: 8
          tone: positive
          note: 需求质量比泛泛意向或 MoU 更重要。
        - label: SpaceX / SSLV 价格压力
          value: 7
          tone: warning
          note: 价格底线和国内替代方案压住上行叙事。
        - label: 优先权 / 稀释包袱
          value: 6
          tone: warning
          note: 条款过重时，好公司也可能不是好入口。
    approximationNotes: 数值是委员会式 1 到 10 重要性权重，不是统计 beta 或回归输出。
    claimRefs:
      - CV016
      - CV017
      - CV019
      - CV023
      - CV026
      - CV031
      - CV040
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以当前估值进入，回报结果高度不对称：基准情形接近守住价值，真正上行需要走出牛市情形的里程碑路径。
    data:
      items:
        - label: 熊市价值 / 当前估值
          low: 0.36
          high: 0.64
          unit: x
          detail: 如果入轨证明或订单储备转化不及预期，结果会类似下轮降估值。
        - label: 基准价值 / 当前估值
          low: 0.82
          high: 1.18
          unit: x
          detail: Vikram-1 成功后，当前估值可以守住；但没有更深入披露，上行仍有限。
        - label: 牛市价值 / 当前估值
          low: 1.45
          high: 2.18
          unit: x
          detail: 只有发射节奏、订单储备和单位经济性都快速变清晰，才有可观上行。
    approximationNotes: 回报区间来自各情景估值范围除以当前 $1.1B 估值；它们对里程碑敏感，并非基于清晰收入倍数。
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Skyroot 在战略切入点和资本获取上得分最高，在公开经济性披露和证明成熟度上最弱。
    data:
      items:
        - label: 战略 / 主权切入点
          score: 8
          note: 本土叙事真实存在，但并非独占，因为 SSLV 也在场。
        - label: 当前技术证明
          score: 4
          note: 关键的商业入轨证明点仍未落地。
        - label: 产业建设
          score: 7
          note: Capex 和设施已经足够可见，足以影响判断。
        - label: 经济性披露质量
          score: 3
          note: 发射 ASP、毛利率和订单储备质量披露仍偏弱。
        - label: 可比估值支撑
          score: 7
          note: 全球发射可比公司证明，投资者愿意为稀缺性和规模叙事付费。
        - label: 竞争压力
          score: 4
          note: SpaceX 拼车发射、SSLV 和全球专用发射同行让压力维持在高位。
        - label: 当前进入吸引力
          score: 4
          note: $1.1B 估值下，上行需要牛市情形执行，而不是基准情形的守值能力。
    approximationNotes: 分数是内部委员会按 1-10 分给出的判断，分数越高，投资吸引力越强。
    claimRefs:
      - CV007
      - CV014
      - CV019
      - CV023
      - CV026
      - CV032
      - CV043
      - CV049
