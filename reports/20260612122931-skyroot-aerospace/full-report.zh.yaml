  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图与替代逻辑
        blocks:
          - type: paragraph
            body: >-
              Skyroot 面对的不是一个整齐的同业集合。它至少面对四类不同替代方案：SpaceX 拼车，是能够容忍共享任务清单的载荷最低价已披露通道；Rocket Lab 和
              Firefly，是履历更强的专属发射供应商；SSLV 和 Agnikul，是主权或本地对齐买方最相关的印度替代；Isar、RFA 和 HyImpulse
              等欧洲进入者，则向另一个地理市场销售同样的排期控制和主权故事。这种结构很重要，因为买方不会用一个指标比较所有供应商。重视排期确定性和轨道特定性的载荷所有方可能愿意为专属发射付溢价，但如果任务能容忍通用入轨，预算受限客户仍会被推向拼车。因此，只有当任务控制、国内对齐或响应速度压过价格底线和其他地方已有履历优势时，Skyroot
              才会赢。实际来看，这意味着 Skyroot 争夺的任务子集，比航天经济大标题话术暗示的更窄。
