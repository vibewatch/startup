      - number: '8.4'
        title: 情景分析应以里程碑为核心，而不是以分母为核心
        blocks:
          - type: paragraph
            body: >-
              由于公开分母缺失，干净倍数只是虚假精确。更站得住脚的方法，是以可比估值结果和下行情境机制为锚，做基于里程碑的情景分析。在悲观情景下，如果轨道证明推迟、首飞学习周期拖长，或客户转化仍停留在 MoU
              层面，Skyroot 仍主要是一家 Space Systems 收入公司；在这个世界里，估值可能回到 Agnikul 和 Skyroot 自身上一轮参考所暗示的非独角兽私人发射区间。在基准情景下，Vikram-1
              入轨、早期发射节奏启动、投资人信心维持，但已披露发射经济性仍落后于硬承销流程要求；这会让当前估值更接近持有价值，而不是明显上行。在乐观情景下，Skyroot
              快速越过首飞风险，证明可重复发射，披露可信积压订单和单位经济性，并把 Vikram-2 进展转化为更大的平台叙事；到那时，Firefly 和 Isar
              对比才会真正更有分量。共同结论是，从这里往上的空间集中在里程碑交付上；如果证明和披露仍不完整，下行会很快到来。
