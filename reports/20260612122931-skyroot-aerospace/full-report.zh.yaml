            title: 首次轨道任务仍像验证清单，不像成熟的已签账本
            body: 管理层自己的表述——载荷规模较小、先验证、稍后公布详细清单——在技术上合理，但在商业上偏弱。在客户名称和合同形式出现之前，订单积压质量大体仍要靠信念支撑。
            calloutType: risk
