      items:
        - id: demo-need
          label: 寻找能承受任务风险的发射方
          actor: 初创公司、实验室、学校或小卫星运营商
          description: 客户最初更看重时间表接入和任务参与，而不是完全验证过的入轨履历。
          channels:
            - 媒体报道
            - 创始人网络
            - 直接触达
        - id: qualify
          label: 任务资格确认
          actor: Skyroot 商务团队 + 载荷所有方
          description: Skyroot 通过预订工作流收集轨道、倾角、载荷质量、发射窗口和搭乘类型。
          channels:
            - Get-to-Orbit 表单
            - 销售跟进
        - id: integrate
          label: 集成载荷
          actor: 载荷所有方 + Exolaunch / Skyroot
          description: 已披露的入轨交付路径现在依赖 Exolaunch 提供集成和部署硬件。
          channels:
            - 伙伴规划
            - 发射任务集成
        - id: validate
          label: 执行验证任务
          actor: 首飞客户
          description: 首批入轨客户进入规模较小的发射清单；该清单更侧重运载火箭验证，而不是最大化载荷收入。
