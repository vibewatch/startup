      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              领导层集中既是 Skyroot 的优势，也是承销风险之一。两位创始人仍是公司公开运营门面：Chandana 担任 CEO，通常被描述为技术负责人；Daka
              负责运营和发射商业化。这种创始人与市场的匹配是真实的，因为二人都来自 ISRO，并围绕印度 2020 年后私营航天开放窗口搭建公司。公司融资轮次变大后，治理也在成熟。Series A 报道提到 Greenko
              创始人和 Solar Industries 获得董事会席位；2022 年 GIC 领投轮引入 GIC India 董事总经理 Mayank Rawat；2026 年独角兽轮则让 Ram Shriram
              进入董事会。这些新增席位很重要，因为它们显示股权结构表正从天使加创始人控制，走向投资人支持的航天董事会。与此同时，完整董事会、委员会结构和投票权的公开披露仍然很薄；这对印度私营初创公司很常见，但仍是尽调限制。更柔性的治理信号是公司公开的举报人页面，强调保密、反报复和调查程序。这是控制面的正面信号，但其突出程度也说明管理层在规模化运营和更大的国际交易对手到来前，刻意释放行为监督信号。
