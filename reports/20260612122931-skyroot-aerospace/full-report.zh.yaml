      - number: '2.4'
        title: 增长驱动、约束与反向市场信号
        blocks:
          - type: paragraph
            body: >-
              Skyroot 最强的需求侧驱动在于，小型发射市场在标价之外的维度仍然结构性供给不足。SpaceX 的绝对主导制造了一个悖论：它压低价格，但也让许多客户想要替代发射窗口、主权选项或更定制化的入轨。印度 2020
              年后的监管自由化是第二个驱动，因为它让这种需求变成国内初创公司可以合法、可运营追求的机会。但约束同样真实。The Space Review 2024 年分析指出，Skyroot 和 Agnikul
              都尚未披露已确认的轨道飞行载荷客户，并警告在已经极其残酷的市场中，低发射节奏会让生存变难。其他地方的首发风险强化了这个警告。Isar 首次 Spectrum 发射失败，Firefly
              即便运营历史长得多，可靠性记录仍有波动；甚至 ISRO 的 SSLV 也在首次尝试失败后才后续成功。第二个反向信号来自资本市场：2022–2024
              年小型发射洗牌显示，风投支持的发射公司筹集乐观预期的速度，可能快于积累可靠飞行履历的速度。因此，市场支持对 Skyroot
              的兴趣，但不支持自满。任何专属发射器如果不能把政策顺风转化为可重复、有客户背书的轨道服务，单靠市场规模救不了它。
