callouts:
- calloutType: strength
  title: Grounded hardware story, not just aspirational branding
  body: Skyroot already has a real suborbital mission, ISRO-backed static and liquid-engine tests, and a visible composite-manufacturing footprint. That combination is much stronger than a pre-hardware startup narrative, even if it still stops short of proving orbital service reliability.
  claimRefs:
  - CE001
  - CE019
  - CE021
  - CE026
- calloutType: risk
  title: Spec inconsistency is a real diligence issue
  body: The most important customer facts—payload capacity, liquid-stage naming, and exact first-flight timing—still move across Skyroot surfaces and third-party reporting. That does not negate the engineering work, but it does mean investors should ask for a current payload guide and mission architecture note before underwriting demand.
  claimRefs:
  - CE011
  - CE016
  - CE024
- calloutType: insight
  title: The bottleneck is conversion from test-rich program to insurable service
  body: Skyroot’s next value inflection is not another promising component test. It is one successful orbital launch followed quickly by a second, with stable payload definitions and visible authorization cadence. Until then, the product thesis remains credible but not fully bankable.
  claimRefs:
  - CE037
  - CE044
  - CE045
