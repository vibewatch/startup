chapter:
  number: 5
  title: Product & Technology
  summary: 'Skyroot has credible pre-orbital hardware evidence: Vikram-S flew, Kalam and Raman subsystems have been tested with ISRO support, and Infinity Campus gives the company a real composite-manufacturing base. But the current customer product still rests on evolving payload specs, tentative launch windows, and unproven cadence and reliability claims; the cryogenic Dhawan branch remains roadmap rather than flight heritage.'
sections:
- id: product-definition-and-flight-proven-baseline
  title: Product definition and the flight-proven baseline
  body: |-
    Skyroot’s product is no longer a generic “space startup” story; it is a specific launch-services workflow centered on Vikram-I. The customer-facing flow now exposed on the company’s configurator asks for orbit, inclination, payload mass, launch period, and ride type, which means Skyroot is selling a mission slot rather than just a technology-development narrative. The offer is explicitly dual-track: dedicated missions for schedule-sensitive satellites and rideshare missions for customers willing to trade exclusivity for lower cost. That product framing matters because it is materially ahead of the company’s 2022 position, when Vikram-S was still a proof vehicle rather than a sellable orbital service.

    The strongest hard evidence underneath that story is still Mission Prarambh. Vikram-S gives Skyroot real flight heritage on telemetry, composite structures, avionics, and trajectory control, and ISRO’s own record confirms that the mission was authorized by IN-SPACe. But the workflow remains pre-operational in a crucial sense. Only LEO is marked as ready-to-launch today, while higher-energy orbits remain “coming soon,” and the actual launch-window award for the first Vikram-I orbital attempt was still not publicly named at run date. In effect, Skyroot has a visible customer journey and credible pre-orbital heritage, but not yet a fully standardized, already-flying service envelope.
