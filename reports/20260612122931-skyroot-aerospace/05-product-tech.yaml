  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: vikram-i-payload-spec
    missingEvidence: An authoritative Vikram-I payload user guide or signed customer datasheet that reconciles current 300 kg, 350/260 kg, 400-500 kg, and 480/290 kg public numbers.
    whyItMatters: Payload performance is the core product spec for launch customers, underwriting demand, insurance, and comparison versus global small-launch peers.
    diligencePath: Request the latest Vikram-I payload user guide, mission envelope sheet, and any launch-campaign note defining payload by orbit, inclination, and first-flight configuration.
    relatedQuestionRefs:
    - QE004
    relatedTableRefs:
    - TE001
    - TE003
  - type: conflicting-data
    severity: material
    topic: raman-stage-configuration
    missingEvidence: A current propulsion architecture note that names each Raman variant, its thrust class, propellants, and exact role on Vikram-I.
    whyItMatters: Liquid insertion and attitude-control capability sit at the center of orbital mission precision, but public disclosures currently mix Raman-I, Raman-II, and Raman-1 nomenclature.
    diligencePath: Request Skyroot’s latest stage architecture diagram or propulsion subsystem brief, then reconcile it with ISRO test records and customer mission documentation.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: launch-window-award
    missingEvidence: A public launch-window notice or authorization update from Skyroot, ISRO, or IN-SPACe naming the first Vikram-I orbital attempt date.
    whyItMatters: Cadence, customer readiness, and insurance planning remain hypothetical until the first orbital window is formally allocated.
    diligencePath: Monitor IN-SPACe and ISRO notices, Skyroot newsroom posts, and launch-manifest updates for a dated window announcement or NOTAM-linked mission notice.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: cryogenic-stage-integration
    missingEvidence: Integrated-stage or vehicle-level public test evidence linking Dhawan-class cryogenic engines to a flight-like Vikram-II upper stage.
    whyItMatters: Engine hot-fire milestones are necessary but not sufficient to underwrite Vikram-II capacity claims or any reusable upper-stage ambitions.
    diligencePath: Request an integrated upper-stage test plan, vehicle configuration note, or updated Vikram-II payload guide that ties Dhawan-III to a specific mission architecture.
    relatedQuestionRefs:
    - QE021
    - QE020
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: orbital-reliability-proof
    missingEvidence: Insurance-ready reliability evidence such as a first orbital success, post-flight anomaly report, and a second consecutive launch executed close behind it.
    whyItMatters: Skyroot’s entire cadence and cost thesis depends on moving from suborbital and static-test success to repeatable orbital operations with insurable outcomes.
    diligencePath: After the first Vikram-I flight, review mission result data, any board of inquiry or anomaly report, insurer posture, and time-to-next-launch before treating cadence claims as bankable.
    relatedQuestionRefs:
    - QE024
    - QE025
