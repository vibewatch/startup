  rows:
  - - Kalam-1200 first stage
    - Primary ascent thrust off the pad
    - ISRO static test named 11 m monolithic composite motor with 30 t propellant
    - ISRO test infrastructure at SDSC
    - Public evidence does not yet tie static success to orbital mission performance
  - - Kalam-250 second stage
    - Mid-course solid propulsion and staging energy
