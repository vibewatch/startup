    - Integration, countdown, launch pad access, and formal permission to fly
    - SDSC integration campaign, IN-SPACe manifesto, and ISRO/PIB documentation
    - ISRO launch infrastructure and IN-SPACe approvals
    - Port availability and authorization timing can delay cadence even if hardware is ready
