- id: vikram-i-architecture-and-propulsion-stack
  title: Vikram-I architecture and propulsion stack
  body: |-
    The technical heart of Skyroot’s current offer is Vikram-I’s hybrid architecture: three solid stages for brute ascent energy plus a liquid propulsion layer for orbital precision. Across independent technical summaries and Skyroot-adjacent reporting, the vehicle consistently appears as a Kalam-1200 / Kalam-250 / Kalam-100 stack with a Raman liquid system handling orbital insertion or control tasks. That design choice aligns with management’s repeated pitch that Skyroot can combine the storage simplicity and manufacturing speed of solid motors with the orbital accuracy of liquid propulsion. It also explains why Skyroot keeps highlighting carbon composites and additive manufacturing as differentiators: those are the levers by which it claims lighter structures, fewer parts, and lower cycle time.

    What is less clean is the public specification surface. Payload numbers vary widely across Skyroot’s own pages and third-party coverage, and even Raman nomenclature is inconsistent. The official home page still advertises 350 kg to LEO and 260 kg to SSO; the live booking flow elevates that to 400 kg and even 500 kg in another line; Gunter’s technical summary lists 480 kg to 500 km LEO and 290 kg to 500 km SSO; and Times of India says early test launches will carry only partial payloads before later approaching a 300 kg full payload. The architecture is therefore directionally credible, but the authoritative public data package for customers is still weaker than the engineering narrative.
