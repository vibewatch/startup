- id: manufacturing-system-and-launch-enablement
  title: Manufacturing system and launch enablement
  body: |-
    Skyroot’s manufacturing and delivery system is more substantial than a slide-deck startup. PM India and multiple 2025-2026 reports place the Infinity Campus at roughly 200,000 square feet with the capacity to build one orbital rocket per month, while Analytics India adds the concrete production details that matter for diligence: automated filament winding, CNC machining, and composite cleanrooms. The careers page reinforces that this is not outsourced marketing language. Skyroot is actively staffing composite manufacturing, avionics, cryogenic test, valve engineering, and mission-critical procurement roles, which strongly suggests a vertically integrated build philosophy around propulsion, structures, and launch hardware.

    That said, the product is still deeply intertwined with the Indian public-space stack. ISRO hosted Raman and Kalam tests; Mission Prarambh used Satish Dhawan Space Centre; and the integrated launch manifesto published by IN-SPACe still marks Vikram-I timelines as tentative pending contracts and authorization. Skyroot also adds an external commercial dependency through Exolaunch, which is meant to supply deployment hardware and campaign support for dedicated and rideshare customers. The operational takeaway is that Skyroot’s enabling technology is not just the rocket. It is the combination of in-house composite/manufacturing capability, ISRO test and launch infrastructure, IN-SPACe regulatory access, and partner payload-integration tooling.
