    - Public nomenclature and exact role remain inconsistent
  - - Carbon-composite structures and fairing
    - Mass reduction, faster manufacturing, structural backbone
    - Vikram-S flight loads, Infinity Campus equipment, and multiple 2026 summaries
    - Composite design, winding, and quality-control processes
    - Yield, repair, and recurring production scrap data are not public
  - - Avionics and telemetry
    - Vehicle guidance, monitoring, and mission data return
