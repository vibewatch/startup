tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Skyroot
  rows:
  - - Dedicated smallsat launch
    - Mission-specific launch services to LEO and SSO, payload integration, range access, and mission assurance
    - Downstream satellite operations and analytics
    - Satellite operators, constellation builders, mission primes
    - Core commercial market for Vikram-1
  - - Responsive sovereign launch
    - National-security, civil-space, and strategic payload launches needing timing or sovereign control
    - Long-term station programs or deep-space exploration budgets
    - Government agencies, defense-linked programs, public-space entities
    - Potential higher-value niche if India backs domestic launch options
  - - Lead / shared dedicated missions
    - Shared missions with some schedule or orbital control rather than fully generic rideshare
    - Bulk commodity rideshare with no orbit customization
    - Aggregators, rideshare brokers, smallsat clusters
    - Useful intermediate offer versus full dedicated launch
  - - Status-quo rideshare substitute
    - Low-cost access on larger rockets such as Falcon 9 Transporter
    - Dedicated launch economics or custom mission design
    - Budget-sensitive smallsat operators
    - Main price-floor substitute that can cap Skyroot margins
  - - Domestic public substitute
    - ISRO / NSIL SSLV or other state-backed launch services
    - Heavy-lift and crewed-space programs
    - Indian public-sector payload owners and some commercial missions
    - Important because it competes on national access and existing infrastructure
  notes: 'The market boundary is intentionally narrow: this chapter treats Skyroot as a launch-service supplier, not as a proxy for the entire Indian space economy.'
