  - - India private-space ecosystem expansion
    - Positive
    - Current to medium term
    - Improves supplier, investor, and talent density around launch startups
    - Validate how much of ecosystem growth translates into real launch demand
  - - SpaceX rideshare price floor
    - Negative
    - Current
    - Pressures margin and commodity demand for dedicated launchers
    - Estimate which customer segments truly pay for orbit and schedule control
  - - Need for schedule certainty and bespoke orbit
    - Positive
    - Current
    - Preserves value proposition for dedicated launch providers
    - Seek customer evidence that this need is contracted, not just asserted
  - - Domestic substitute from SSLV
    - Negative / mixed
    - Current
    - Raises competition while also validating local demand for small launch
    - Compare SSLV pricing, cadence, and booking friction versus private launchers
  - - First-launch reliability risk
    - Negative
    - Near term
    - Any maiden orbital mission can fail and delay commercialization materially
