- id: growth-drivers-constraints-and-adverse-market-signals
  title: Growth drivers, constraints, and adverse market signals
  body: 'The strongest demand-side driver for Skyroot is that the small-launch market remains structurally underserved on dimensions other than list price. SpaceX’s sheer dominance creates a paradox: it compresses pricing, but it also leaves many customers wanting alternative launch windows, sovereign options, or more tailored orbital insertion. India’s post-2020 regulatory liberalization is the second driver because it turns that demand into something domestic startups can legally and operationally pursue. Yet the constraints are just as real. The Space Review’s 2024 analysis argued that neither Skyroot nor Agnikul had yet disclosed confirmed payload customers for orbital flights and warned that low cadence could make survival difficult in an already cutthroat market. First-launch risk elsewhere reinforces that warning. Isar’s initial Spectrum launch failed, Firefly’s record still shows reliability volatility despite far more operational history, and even ISRO’s SSLV failed on its first
    attempt before later succeeding. A second adverse signal comes from capital markets: the 2022–2024 small-launch shakeout showed that venture-backed launchers can raise optimism faster than they raise reliable flight history. The market therefore supports interest in Skyroot, but not complacency. Market size alone will not save any dedicated launcher that cannot translate policy tailwinds into repeatable, customer-backed orbital service.'
