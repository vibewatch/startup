chapter:
  number: 2
  title: Market Analysis
  summary: 'Skyroot Aerospace sells into a narrow but strategically important market: dedicated and customizable launch access for small satellites, not the whole space economy. The market setup is favorable in one sense—India’s policy liberalization, rising private-space startup formation, and persistent demand for schedule control create room for challengers—but difficult in another because SpaceX rideshare sets a harsh price floor while incumbents and new entrants compete on reliability, orbit precision, and cadence. The chapter’s main conclusion is that Skyroot’s realistic addressable market is evidence-constrained and adoption depends less on headline TAM than on whether the company can prove responsive, repeatable launch service in a crowded small-launch field.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and status-quo substitutes
  body: 'Skyroot should not be valued against the entire Indian or global space economy. Its real market boundary is much narrower: launch services for small satellites that need dedicated, customized, or schedule-sensitive access to specific low-Earth or sun-synchronous orbits. That boundary includes commercial Earth-observation constellations, defense and civil payloads that value orbit choice or schedule control, and international customers that cannot or do not want to wait for generic rideshare windows. It excludes most satellite manufacturing, downstream geospatial analytics, human spaceflight, large geostationary launch, and the broader “space economy” narratives often used in venture storytelling. The status-quo substitutes are well defined. At the cheapest end sits SpaceX rideshare, which is hard to beat on raw price. At the premium dedicated end sit Rocket Lab Electron and Firefly Alpha, both of which sell responsiveness and mission control. In India, the most immediate substitutes
    are ISRO’s SSLV and Agnikul’s emerging Agnibaan, both of which compete for national attention, launch infrastructure, and the same small-payload customer set. Market analysis therefore has to begin with service substitution logic, not macro space-economy rhetoric.'
