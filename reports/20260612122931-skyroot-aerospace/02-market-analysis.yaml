  - - FDI cap and funding constraints
    - Negative
    - Current to medium term
    - Can limit how aggressively Indian launch startups scale versus foreign peers
    - Clarify capital-structure flexibility and future fundraising pathways
  - - Capital-market skepticism after launch-startup failures
    - Negative
    - Current
    - Makes future rounds harder if cadence or contracts lag expectations
    - Test whether investors will keep funding before revenue proof appears
