  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: arr-disclosure
    missingEvidence: Current ARR recurring-contract revenue and contract duration by business line.
    whyItMatters: Without recurring-revenue disclosure investors cannot separate one-off systems sales from repeatable contracted revenue.
    diligencePath: Request monthly revenue by line renewal assumptions contract tenor and backlog aging from management.
    relatedQuestionRefs: [QI020]
    relatedTableRefs: [TI005]
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Gross margin and contribution margin split for Space Systems dedicated launch and rideshare missions.
    whyItMatters: The public revenue bridge is insufficient to tell whether scaling revenue will improve or worsen cash generation.
    diligencePath: Obtain FY25-FY26 gross margin bridge launch-ops cost per mission and depreciation policy for facilities and tooling.
    relatedQuestionRefs: [QI020, QI025]
    relatedTableRefs: [TI003, TI005]
  - type: missing-source
    severity: blocking
    topic: cash-runway
    missingEvidence: Latest cash balance unrestricted cash net burn and runway months after the May 2026 financing.
    whyItMatters: Runway is the core determinant of whether Skyroot can absorb launch delays without a punitive financing event.
    diligencePath: Request monthly cash bridge post-round cash balance minimum liquidity threshold and downside runway model.
    relatedQuestionRefs: [QI021, QI025]
    relatedTableRefs: [TI004, TI005]
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Named paying customers top-customer concentration and the share of customer advances attributable to the largest counterparties.
    whyItMatters: A concentrated early backlog could magnify mission delay risk and make revenue quality far weaker than topline advances imply.
    diligencePath: Request customer cohort table top-10 exposure cancellation rights and advance-to-revenue conversion history.
    relatedQuestionRefs: [QI018, QI024]
    relatedTableRefs: [TI001, TI005]
  - type: private-evidence-only
    severity: material
    topic: realised-pricing
    missingEvidence: Signed mission pricing discounting insurance pass-through and mission-mix assumptions behind the 5 USD mn per-launch proxy.
    whyItMatters: List-like pricing proxies can overstate economics if early customers receive steep discounts or bundled engineering support.
    diligencePath: Review executed contracts quote templates and gross-to-net reconciliation for early payload customers.
    relatedQuestionRefs: [QI003, QI004]
    relatedTableRefs: [TI002, TI005]
  - type: missing-source
    severity: material
    topic: debt-and-project-finance
    missingEvidence: Any debt facilities government support terms equipment financing guarantees or project-finance commitments tied to Hyderabad or Tirupati assets.
    whyItMatters: Undisclosed financing obligations could materially change runway collateral flexibility and downside recovery assumptions.
    diligencePath: Request debt schedule covenant package subsidy agreements and asset-ownership structure for all major facilities.
    relatedQuestionRefs: [QI021]
    relatedTableRefs: [TI004, TI005]
