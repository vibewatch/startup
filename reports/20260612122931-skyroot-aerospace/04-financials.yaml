- id: TI004
  title: Capital adequacy table
  enumerationScope:
    coverage: partial
    basis: Focuses on the capital structure capex commitments and disclosed financing signals that matter for underwriting Skyroot as of 2026-06-12.
  columns: [Item, Public value / status, Evidence, Implication, Diligence ask]
  rows:
