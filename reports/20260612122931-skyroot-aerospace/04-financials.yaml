company:
  name: Skyroot Aerospace
chapter:
  number: 4
  title: Financials
  summary: Skyroot’s public financial record improved materially in June 2026 because provisional FY26 revenue, EBITDA, and customer-advance datapoints finally surfaced, but the launch-services model underwriting the $1.1 billion valuation is still only partially disclosed. Bridge revenue from Space Systems and a large manufacturing footprint make the company more than a concept-stage launcher, yet the decisive missing items remain gross margin, cash runway, realized launch pricing, and customer concentration.
sections:
- id: revenue-model-pricing-and-disclosure
  title: Revenue model, pricing, and what is actually public
  body: |-
    Skyroot’s public financial story is unusual because the company reached unicorn status before it openly disclosed a mature launch-services P&L. The official website still sells a proposition rather than a price card: on-demand, customizable launch for small satellites. That matters because it confirms the intended monetization model, but it does not tell an investor what customers actually pay, what utilization assumptions sit behind the model, or whether early contracts are dedicated launches, rideshares, engineering services, or some blend. The strongest newly public datapoint is Entrackr’s June 2026 report on provisional FY26 financials, which says Skyroot crossed Rs 100.6 crore of operating revenue before Vikram-1 commercial launches began and that the entire figure came from the Space Systems business. In other words, pre-orbital Skyroot is not a pure pre-revenue launch startup any more, but it is still pre-scale in the actual launch business that anchors valuation. Public reporting in January and March 2026 adds two usable but still management-framed pricing proxies: about $2 million to $3 million to build a rocket and about $5 million of revenue per launch. Those numbers are helpful for rough unit-economics framing, but the company still does not publish an official rate card, realized ASP, discount structure, insurance pass-through, or contract template. Revenue quality therefore looks mixed but improving: component and systems sales give Skyroot a bridge revenue line, while the core underwriting case still depends on turning launch intent into repeatable mission revenue.
  claimRefs: [CI001, CI002, CI004, CI005, CI006, CI007, CI008, CI013, CI015, CI041, CI046, CI048]
  tableRefs: [TI001, TI002]
  figureRefs: [FI001]
- id: unit-economics-cadence-and-burn
  title: Unit economics, cadence assumptions, and burn logic
  body: |-
    The investability question is not whether Skyroot can tell a plausible launch story; it is whether the implied unit economics survive the jump from prototype to cadence. The public proxies are directionally positive but still too incomplete for hard underwriting. TechStory and Asianet Newsable both report management-linked figures of roughly $5 million in revenue per launch and $2 million to $3 million in build cost per rocket, which suggests a gross spread before launch operations, insurance, rework, amortized capex, and corporate overhead. Via Satellite adds a more operationally useful lens: management says it has already invested the capex needed to manufacture 12 rockets a year, while the near-term goal is four to six launches in the current financial year and eventually faster follow-up missions once reliability is proven. That is precisely where the risk sits. Entrackr’s provisional FY26 figures show negative EBITDA of Rs 130.3 crore, employee expense of Rs 95.5 crore, and operating and administrative expense of Rs 88.2 crore. Those numbers are consistent with a business still funding engineering depth, test infrastructure, and commercialization overhead ahead of real launch cadence. The bridge revenue from Space Systems reduces the starkness of the burn story, but it does not yet prove attractive contribution margins in launch. Nor does the public record disclose gross margin by business line, launch-insurance cost, refurbishment or scrap risk, cash conversion timing, or the proportion of customer advances that represent cancellable interest versus firm contracted payloads. The right reading is that Skyroot may have an economically workable product if it hits cadence, but the present public evidence supports only a scenario model, not a completed unit-economics case.
  claimRefs: [CI007, CI008, CI009, CI010, CI011, CI016, CI017, CI018, CI020, CI021, CI022, CI043, CI047]
  tableRefs: [TI003]
  figureRefs: [FI002, FI003]
- id: capital-intensity-and-financing-dependency
  title: Capital intensity, manufacturing footprint, and financing dependency
  body: |-
    Skyroot’s funding history matters less here as chronology and more as evidence of how expensive the next phase will be. By May 2026 the company had raised about $160 million, including a fresh $60 million round at a $1.1 billion valuation, and multiple sources say those proceeds are being used to raise Vikram-1 launch cadence, expand manufacturing, and accelerate Vikram-2. The manufacturing footprint shows why financing dependency remains central. Satellite Today says the Hyderabad Max-Q and Infinity facilities together amount to roughly 250,000 square feet and are meant to support a 72-hour assembly-to-launch ambition; Machinist says the new Infinity Campus alone is about 200,000 square feet and sized for one orbital-class rocket a month. Hans India adds a 55,000-square-foot Max-Q predecessor and quotes management saying Skyroot plans more than Rs 1,000 crore of additional near-term investment. Outside Hyderabad, Andhra Pradesh has allotted roughly 300 acres near Tirupati for an integrated rocket manufacturing, assembly, testing, and storage campus tied to a Rs 400 crore investment. Those commitments are strategically logical because the company is trying to move from R&D cadence to production cadence, but economically they mean Skyroot is carrying launch-company capex, factory capex, and ecosystem-build capex before public disclosure of cash on hand or runway. Put simply, the 2026 financing bought time and industrial capacity, not proof that the company has already crossed into self-funding operations. The next round trigger is therefore likely tied to mission reliability, conversion of advances into recurring launch bookings, and demonstrated throughput from the Hyderabad and Tirupati footprint.
  claimRefs: [CI024, CI025, CI026, CI028, CI029, CI030, CI031, CI033, CI034, CI035, CI045, CI050]
  tableRefs: [TI004]
  figureRefs: [FI004]
- id: disclosure-limits-and-diligence-blockers
  title: Disclosure limits and the exact diligence blockers
  body: |-
    For a private Indian launcher, some opacity is normal; for an investor underwriting a billion-dollar valuation, the remaining opacity is still material. The reviewed sources are good enough to establish capital raised, manufacturing scale, launch ambition, and the existence of bridge revenue from Space Systems. They are not good enough to underwrite ARR, recurring launch backlog, customer concentration, gross margin, cash runway, debt obligations, or realized launch pricing. Filing-adjacent aggregators such as QuickCompany, Tracxn, and Inc42 show that a public corporate-record trail exists, but they mostly offer stale or range-bound snapshots rather than current primary financial statements. Tracxn shows a current ROC Hyderabad registration and last AGM date, while Inc42 rounds FY24 revenue and total funding differently from the May 2026 company-backed total, illustrating how secondary datasets can lag real events. That is useful as a disclosure-quality signal, but not as a substitute for audited statements. The adverse evidence is not fraud or accounting stress; it is that demand, cadence, and margin claims still run ahead of public proof. The Space Review explicitly warned that Indian private launch startups could remain strapped for customers even after successful orbital flights, and Via Satellite’s interview makes clear that management itself sees cadence and reliability as the commercial unlock. The financial verdict is therefore conditional. Skyroot has enough funding and industrial build-out to justify serious diligence, but not enough public operating disclosure to support a clean underwriting model without direct access to contracts, margins, cash, and customer concentration data.
  claimRefs: [CI013, CI014, CI036, CI037, CI038, CI039, CI040, CI042, CI043, CI044, CI045, CI050]
  tableRefs: [TI005]
  figureRefs: []
tables:
- id: TI001
  title: Revenue streams table
  enumerationScope:
    coverage: partial
    basis: Covers the revenue lines and monetization paths that are explicitly visible in reviewed public sources through 2026-06-12, including disclosed unknowns.
  columns: [Stream, Mechanism, Current public value/status, Revenue-quality read, Diligence ask]
  rows:
  - [Space Systems products, Sale of composite structures and propulsion-related aerospace components, FY26 operating revenue of Rs 100.6 crore came entirely from this business, Bridge revenue exists before launch services but customer mix and gross margin are undisclosed, Break out FY26 revenue gross margin and repeat-customer share by product family]
  - [Dedicated Vikram-1 launches, Single-mission launch service for schedule-sensitive payloads, Commercial launch revenue had not yet started in the reviewed FY26 disclosure set, Core valuation driver remains prospective rather than evidenced by reported revenue, Provide signed contracts launch backlog cancellation terms and post-flight conversion pipeline]
  - [Rideshare launches, Shared-manifest missions to improve cadence and utilization, Via Satellite says rideshare missions are planned but no public booked value is disclosed, Could improve utilization but price realization and mission mix are opaque, Provide rideshare pricing bands slot-allocation logic and broker economics]
  - [Future Vikram-2 launch services, Larger vehicle aimed at heavier or more cost-effective missions, Use of proceeds explicitly includes Vikram-2 acceleration and no revenue yet, Future monetization path rather than current evidence, Show development budget expected price curve and target-customer discussions]
  - [Customer advances and order conversion, Advance payments and pre-bookings ahead of delivery, Customer advances exceeded Rs 252 crore as of March 2026, Useful demand signal but advance quality and refundability are undisclosed, Split advances into firm contracts refundable deposits and milestone-linked collections]
  notes: Rows separate bridge revenue launch revenue and demand proxies; unknowns reflect missing private disclosure rather than zero activity.
