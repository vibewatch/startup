  - [Cash on hand, Undisclosed publicly, No reviewed source provides cash balance, Runway cannot be underwritten from public evidence, Share latest cash restricted cash and debt headroom]
  - [Debt or project finance obligations, Not publicly identified in reviewed sources, No reviewed source names debt facilities or project finance, Absence of disclosure is not proof of absence of obligations, Provide debt schedule covenants guarantees and collateral package]
  notes: The table deliberately separates disclosed financing facts from material unknowns; missing cash and debt data are underwriting blockers rather than minor omissions.
  claimRefs: [CI024, CI025, CI026, CI028, CI031, CI034, CI045]
- id: TI005
  title: Public financial gaps table
  enumerationScope:
    coverage: partial
    basis: Lists the private-company metrics that remain unavailable or insufficiently evidenced in the reviewed public corpus and that most affect financial underwriting.
  columns: [Missing metric, Current public state, Impact on analysis, Exact diligence path]
  rows:
  - [ARR / recurring revenue, No public ARR figure identified, Prevents software-like or contracted-recurring underwriting shortcuts, Request monthly recurring revenue by line renewal profile and contract duration]
  - [Gross margin by business line, No public segment margin disclosed, Cannot tell whether Space Systems bridge revenue is economically attractive, Request FY25-FY26 gross margin split for launch systems and services]
  - [Cash on hand and runway months, No current public cash balance or runway statement identified, Impossible to judge urgency of next financing, Obtain latest cash monthly burn and minimum-liquidity policy]
  - [Customer concentration, No named paying launch customers or concentration percentages disclosed publicly, Backlog quality and counterparty risk remain opaque, Request top-10 customers booked launch backlog and percent of advances by customer]
  - [Realised launch price and discounts, Only management-linked estimates and no official rate card or realised ASP data, List price economics may materially overstate actual launch yield, Request signed contracts and realised price bridge by mission type]
  - [Debt guarantees or project finance, No public schedule identified in reviewed sources, Off-balance-sheet obligations could distort runway and asset value, Request debt maturity ladder guarantees and government-support terms]
  - [Insurance and mission-failure reserve, No public insurance cost or reserve policy identified, Launch economics are incomplete without failure-cost assumptions, Request insurance premium assumptions and first-flight reserve policy]
  - [Advance quality and cancellation rights, Advances disclosed but refundability not described, Working-capital support may be overstated if advances are cancellable, Request advance aging refund policy and conversion history]
  notes: These are not cosmetic asks; each missing metric materially changes valuation runway or revenue-quality underwriting.
  claimRefs: [CI020, CI037, CI040, CI044, CI045, CI046]
figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: standard
  summary: Today’s public revenue bridge runs from customer interest and advances into Space Systems revenue first, with launch revenue still contingent on cadence proof.
  data:
    nodes:
    - id: demand
      label: Customer demand
      detail: Domestic and international payload demand plus early mission interest.
    - id: advances
      label: Advances / commitments
      detail: Advance collections exist but contract firmness is undisclosed.
    - id: systems
      label: Space Systems sales
      detail: FY26 bridge revenue came from components and related aerospace products.
    - id: launch
      label: Launch services
      detail: High-value revenue stream after Vikram-1 reaches repeatable commercial cadence.
    - id: cashflow
      label: Operating cash generation
      detail: Still unproven publicly because margins and cash conversion are undisclosed.
    edges:
    - {from: demand, to: advances, label: pre-booking interest}
    - {from: advances, to: launch, label: should convert after reliability}
    - {from: demand, to: systems, label: already monetized in FY26}
    - {from: systems, to: cashflow, label: bridge revenue}
    - {from: launch, to: cashflow, label: future margin engine}
  approximationNotes: The flow distinguishes current monetized lines from future launch monetization; it is a business-model bridge rather than a booked-revenue ledger.
  claimRefs: [CI002, CI005, CI013, CI020, CI048]
- id: FI002
  title: Unit economics bridge
  type: flow
  layout: standard
  summary: Public unit economics are only a bridge model; cost proxy and revenue proxy exist, but cadence insurance and overhead still decide whether a launch becomes attractive cash flow.
  data:
    nodes:
    - {id: buildcost, label: Build cost proxy, detail: 2-3 USD mn per rocket in 2026 coverage.}
    - {id: launchprice, label: Revenue proxy, detail: About 5 USD mn revenue per launch in management-linked reporting.}
    - {id: cadence, label: Cadence utilization, detail: Economics depend on moving from first flight to repeat launches.}
    - {id: overheads, label: Overheads and reserves, detail: Insurance launch ops depreciation and failure reserve remain undisclosed.}
    - {id: margin, label: Contribution margin, detail: Potentially positive but not publicly proven.}
    edges:
    - {from: buildcost, to: margin, label: sets floor}
    - {from: launchprice, to: margin, label: sets ceiling}
    - {from: cadence, to: margin, label: improves fixed-cost absorption}
    - {from: overheads, to: margin, label: can compress outcome}
    - {from: cadence, to: overheads, label: scales launch operations}
  approximationNotes: This figure is intentionally qualitative because the public record does not disclose insurance launch-ops cost or depreciation by mission.
  claimRefs: [CI007, CI008, CI010, CI011, CI016, CI017]
- id: FI003
  title: Financial estimate range
  type: range
  layout: standard
  summary: The strongest public numeric points are still proxies and ranges rather than a complete audited launch-services model.
  data:
    items:
    - {label: Per-rocket build cost, low: 2.0, high: 3.0, unit: USD mn, detail: Management-linked proxy cited by two 2026 reports.}
    - {label: Per-launch revenue target, low: 5.0, high: 5.0, unit: USD mn, detail: Management-linked target rather than realized ASP.}
    - {label: FY25 revenue range, low: 10.0, high: 50.0, unit: INR cr, detail: Wide range from Tracxn proxy data underscoring disclosure limits.}
    - {label: FY26 operating revenue, low: 100.6, high: 100.6, unit: INR cr, detail: Entrackr provisional FY26 figure from Space Systems only.}
    - {label: Customer advances, low: 252.0, high: 252.0, unit: INR cr, detail: March 2026 advances exceeded this level but quality is unknown.}
    - {label: FY26 EBITDA loss, low: 130.3, high: 130.3, unit: INR cr, detail: Negative EBITDA from Entrackr provisional FY26 coverage.}
  approximationNotes: Rows mix ranges point estimates and lower-bound disclosures; they should be read as underwriting anchors rather than a full financial model.
  claimRefs: [CI002, CI007, CI008, CI016, CI020, CI038]
- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: "Skyroot’s cash needs sit across multiple layers at once: launch vehicle execution, plant build-out, working capital, and the still-undisclosed runway between funding rounds."
  data:
    columns: [Cash intensity, Disclosure quality, Near-term timing, Why it matters]
    rows:
    - label: Vikram-1 cadence build-out
      values: [High, Medium, Current, Needed to convert first-flight success into repeat revenue]
    - label: Vikram-2 development
      values: [High, Medium, Current-to-medium term, Absorbs fresh funding before launch economics are proven]
    - label: Hyderabad campuses
      values: [High, Medium, Current, Fixed-cost base supports cadence but raises break-even level]
    - label: Tirupati integrated facility
      values: [High, High, Medium term, Rs 400 crore site expands capacity and strategic proximity to Sriharikota]
    - label: Working capital from advances
      values: [Potential offset, Low, Current, Helpful only if advances are firm collectible and nonrefundable]
    - label: Cash runway / debt service
      values: [Unknown, Low, Current, Largest underwriting blind spot because cash and obligations are undisclosed]
  approximationNotes: The matrix is qualitative because the public record does not disclose cash balance debt schedule or capex phasing with enough precision for a waterfall.
  claimRefs: [CI025, CI026, CI028, CI031, CI034, CI045, CI050]
callouts:
- calloutType: strength
  title: Space Systems revenue prevents the cleanest bear case
  body: Skyroot is no longer a pure hope certificate. The Space Systems line, customer advances, and expanding manufacturing footprint show that some monetization and industrial execution already exist before orbital launch cadence is proven.
  claimRefs: [CI002, CI020, CI028, CI048]
- calloutType: risk
  title: The billion-dollar valuation still outruns public operating proof
  body: Public evidence now supports the funding story and the factory story better than the margin story. Without disclosed cash, gross margin, named customers, or realized launch pricing, the next financing trigger still appears tied to reliability and cadence proof rather than to already visible earnings power.
  claimRefs: [CI024, CI025, CI044, CI045, CI050]
- calloutType: assumption
  title: Cadence is the real financial unlock
  body: "Most of the reviewed evidence points to the same hinge: if Skyroot can turn first-flight success into repeated launches and convert advances into firm booked missions, the capital intensity looks strategic; if not, the same footprint becomes an expensive fixed-cost burden."
  claimRefs: [CI010, CI011, CI020, CI031, CI035, CI050]
