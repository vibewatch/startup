  - id: orbital-proof-gap-and-disclosure-limits
    title: Orbital proof gap, manifest opacity, and what public disclosure still does not show
    body: |-
      Skyroot’s biggest customer problem is not demand generation but disclosure quality. As of the run date, reviewed sources still do not publicly name paying orbital customers for Vikram-1. Instead, management repeatedly says the first orbital mission will carry only a smaller set of customer satellites because the priority is validation rather than payload maximization, and that a fuller manifest will be announced closer to launch. That is a rational first-flight posture, but for diligence it means current evidence remains pre-manifest and pre-contract-detail. The public record does not identify payload operators, slot counts, booking terms, or which accounts are firm contracts versus softer reservations or letters of intent.

      The practical consequence is that backlog quality cannot yet be underwritten. Without named accounts, investors cannot test whether first customers are sovereign buyers, universities, high-risk tech demos, commercial imaging operators, or time-sensitive constellation deployers. Without contract form, it is impossible to tell whether Skyroot has bankable revenue commitments or simply an encouraging top-of-funnel. And without retention data, there is no way to separate one-time milestone participation from the beginnings of a recurring orbital business. The company’s customer narrative is therefore credible on structure and aspiration, but still thin on the exact proof needed to judge launch manifest durability.
    claimRefs:
