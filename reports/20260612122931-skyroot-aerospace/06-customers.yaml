  - id: channel-signals-and-target-mix
    title: Channel signals, buyer mix, and who Skyroot says it serves next
    body: |-
      The current go-to-market story is more credible than the public customer roster. Skyroot’s live booking workflow already distinguishes rideshare from dedicated missions and asks for orbit, inclination, payload mass, altitude, launch period, and company details. That suggests the company is set up to qualify several distinct buyers: schedule-sensitive operators that want dedicated access, cost-sensitive smallsat or constellation customers willing to share a rocket, and institutional users that need a structured inquiry path rather than a generic contact form. Management’s March 2026 interview with Via Satellite sharpens that picture further by saying demand should be roughly one-third domestic and two-thirds international, with Southeast Asia, Japan, the United States, and Europe all in view.

      Exolaunch is the clearest disclosed channel proof behind that positioning. The October 2025 strategic partnership is not a vague memorandum; it specifically covers satellite integration, deployment hardware, rideshare stacks, campaign planning, and mission execution for commercial, institutional, and government customers worldwide. In practical terms, Exolaunch is the one named bridge between Skyroot’s rocket and global payload operators. That is a positive signal because it reduces integration friction for foreign buyers and implies a real pathway into constellation and rideshare demand. It is also a reminder that visible international customer access currently depends more on partner infrastructure than on a published list of direct Skyroot orbital accounts.
