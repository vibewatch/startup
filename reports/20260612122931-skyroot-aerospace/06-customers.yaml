    title: Customer segmentation table
    columns:
      - segment
      - buyer / user / payer
      - use case
      - scale / proof
      - revenue / strategic value
      - gap
    rows:
      - - Education / STEM payload sponsors
        - 'Buyer: Space Kidz or school sponsor; user: students / outreach teams; payer: sponsor or institution'
        - Low-mass suborbital demonstration payloads
        - One named payload (Fun-Sat) flew on Mission Prarambh
        - Strategic proof that Skyroot can win mission-tolerant, publicity-rich payloads
        - No public evidence of repeat missions, contract value, or conversion into orbital demand
      - - Indian startup tech-demo payload owners
        - 'Buyer: domestic startup; user: internal engineering team; payer: startup or sponsor'
        - Sensor / technology demonstration on first private Indian rocket
        - N-Space Tech publicly disclosed as a Prarambh payload customer
        - Shows local startup willingness to accept early launch risk
        - No public post-flight outcome, repeat booking, or orbit-level upgrade path
      - - Foreign research-lab or diaspora-linked experimental payloads
        - 'Buyer: foreign research lab; user: research team; payer: institution'
        - International technology demonstration payload
        - BAZOOMQ Armenia publicly disclosed on Prarambh
        - Important as the first disclosed international customer proof
        - Still only suborbital and too small to prove durable export demand
      - - Commercial smallsat operators needing dedicated access
        - Buyer / user / payer likely the satellite operator
        - Dedicated launch with custom orbital requirements
        - Publicly targeted in Skyroot booking flow and Exolaunch materials, but no named orbital customer disclosed
        - Potentially highest ACV segment if full-rocket contracts close
        - No named paying operator, no public contract form, and no manifest disclosure
      - - Cost-sensitive rideshare / constellation customers
        - 'Buyer may be satellite operator or integrator; user is payload owner; payer may be operator or rideshare broker'
        - Shared-launch access using EXOtube stacks
        - Exolaunch partnership explicitly supports rideshare and multi-payload use cases
        - Could improve rocket utilization and fill early cadence
        - No per-seat price, no disclosed anchor customer, and no public mix between direct and channel sales
      - - Domestic sovereign / institutional missions
        - 'Buyer: government department / agency; user: public mission team; payer: state budget'
        - Small satellites needing domestic launch availability
        - Via Satellite says Skyroot sees large future Indian government smallsat demand
        - Strategically important for India and could smooth domestic demand
        - No disclosed signed sovereign launch contracts or agency-specific bookings
    notes: Rows separate proven suborbital customer archetypes from forward-looking orbital target segments; strategic value is not the same as disclosed revenue.
