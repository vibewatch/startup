figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: The public journey starts with a risk-tolerant payload owner, then moves through booking, partner integration, a validation-focused first flight, and only later to repeat orbital demand.
    data:
      items:
        - id: demo-need
          label: Find a mission-tolerant launcher
          actor: Startup, lab, school, or smallsat operator
          description: The customer first values schedule access and mission participation over fully proven orbital heritage.
          channels:
            - Media coverage
            - Founder network
            - Direct outreach
        - id: qualify
          label: Qualify mission
          actor: Skyroot business team + payload owner
          description: Skyroot collects orbit, inclination, payload mass, launch window, and ride type through its booking workflow.
          channels:
            - Get-to-Orbit form
            - Sales follow-up
        - id: integrate
          label: Integrate payload
          actor: Payload owner + Exolaunch / Skyroot
          description: The disclosed orbital delivery path now relies on Exolaunch for integration and deployment hardware.
          channels:
            - Partner planning
            - Campaign integration
        - id: validate
          label: Fly validation mission
          actor: Maiden-flight customer
          description: First orbital customers join a smaller manifest optimized for vehicle validation rather than maximum payload revenue.
          channels:
            - Vikram-1 campaign
        - id: earn-trust
          label: Earn reliability trust
          actor: Insurers, operators, sovereign buyers
          description: Follow-on demand depends on successful launches, insurability, and faster return to the pad.
          channels:
            - Post-flight performance
            - Insurance market
        - id: repeat-expand
          label: Repeat / expand
          actor: Commercial operator or government mission office
          description: Only after named repeat bookings appear does Skyroot become a durable customer franchise rather than a milestone provider.
          channels:
            - Repeat contracts
            - Multi-mission manifests
    approximationNotes: Stages synthesize retained sources about historical customer proof, the live booking workflow, Exolaunch integration, and management emphasis on first-flight validation and later reliability.
