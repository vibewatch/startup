  - id: buyer-economics-concentration-and-judgment
    title: Buyer economics, concentration risk, and the implications of no named orbital payers
    body: |-
      Skyroot’s public economics frame the opportunity but not the customer base. Management has said a rocket costs roughly $2–3 million to build and could generate about $5 million of revenue per launch, while the company also targets quarterly launches in 2026 and monthly launches by 2027. Those disclosures tell investors that the model needs consistent manifest fill and fast reuse of manufacturing capacity, not just occasional prestige missions. But they do not reveal the metrics that matter most from a customer-quality perspective: per-seat rideshare pricing, discounts for market-debut customers, cancellation terms, insurance burden, top-account exposure, or the share of expected revenue tied to any single sovereign or commercial buyer.

      That gap is why the adverse reading is meaningful. Moneycontrol’s opinion piece is right that the real test starts after the unicorn headline: repeated orbital success, dependable cadence, manufacturing discipline, and export-grade recurring demand. Via Satellite adds an especially important customer-side caveat by saying reliability and insurance access must be established through multiple successful flights. Until Skyroot names paying orbital customers and shows whether they return, expand, or diversify by segment, the right conclusion is not that demand is absent. It is that the company has not yet provided enough public evidence to distinguish a promising pre-revenue launch pipeline from a durable, repeatable orbital customer franchise.
