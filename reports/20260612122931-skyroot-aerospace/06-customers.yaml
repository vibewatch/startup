        - No breakdown by dedicated vs rideshare customer
        - Request average selling price by mission type
      - - Rocket build cost
        - Management says $2–3M build cost per rocket
        - Skyroot has room to discount early flights while still chasing contribution margin
        - Cost figure is management-provided and unverified in contracts
        - Request gross margin bridge and launch-campaign cost detail
      - - Rideshare seat economics
        - null
        - Cost-sensitive operators may be a major target audience
        - No public per-seat pricing or volume discount schedule
        - Request rideshare rate card and minimum booking size
      - - Launch cadence target
        - Quarterly in 2026 and monthly by 2027 in management commentary
        - Customer value proposition depends on fast availability and repeat launches
        - Cadence is aspirational until multiple orbital flights succeed
        - Request mission schedule, pad allocation, and post-flight turnaround assumptions
      - - Switching value versus foreign providers
        - Long waits and expensive foreign alternatives are part of the sales story
        - Domestic and regional buyers may accept first-flight risk in exchange for schedule access
        - No public win-loss data against SpaceX, PSLV, SSLV, or other launchers
        - Request competitor pricing comparisons and customer reasons for choosing Skyroot
