callouts:
  - calloutType: strength
    title: There is real customer proof — just not yet orbital commercial proof
    body: Skyroot does not start from zero. Prarambh publicly named three payload customers, including an international one, which is stronger than generic launch-interest claims. The real question is whether that early-risk customer proof now converts into named paying orbital accounts.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU018
  - calloutType: risk
    title: The first orbital mission still looks like a validation manifest, not a mature booked ledger
    body: Management’s own framing — smaller payload set, validation first, detailed manifest later — is sensible technically but weak commercially. Until account names and contract forms appear, backlog quality remains mostly an article of faith.
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU018
  - calloutType: insight
    title: Exolaunch is the clearest positive signal and also the clearest visible dependency
    body: The Exolaunch partnership is the best evidence that Skyroot can reach global payload operators in a professionalized way. It is also a reminder that the public customer story currently leans more on partner infrastructure than on disclosed direct end-customer wins.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU033
