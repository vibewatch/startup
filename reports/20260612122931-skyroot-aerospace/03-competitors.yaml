- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Indian first-mover private launch brand
    - SSLV already offers a domestic state-backed substitute and Agnikul sells a similar Indian private narrative
    - High
    - Get hard evidence on customer preference between startup flexibility and state-backed assurance
  - - Dedicated orbit and timing control
    - SpaceX rideshare wins whenever the mission can tolerate shared timing and generic insertion
    - High
    - Request Skyroot win/loss data showing customers paying up for control
  - - Engineering moat from launch technology
    - Firefly, Isar, and RFA show that technical depth does not prevent launch failures or multi-quarter delays
    - High
    - Demand a detailed Vikram-1 readiness gate review and contingency plan
  - - Potential sovereign-customer alignment
    - Government or defense demand may still choose SSLV / NSIL for assurance and infrastructure reasons
    - Medium
    - Clarify which missions Skyroot can actually win that SSLV cannot
  - - Future cadence advantage after first orbit
    - Rocket Lab already links heritage, infrastructure, and adjacent products into a broader trust flywheel
    - High
    - Ask how Skyroot funds cadence, range access, and post-first-flight customer conversion
  - - Novelty appeal versus emerging peers
    - European entrants and Agnikul all pitch flexibility, so messaging alone can commoditize quickly
    - Medium
    - Separate what is patented or operationally unique from what is now category-standard sales language
  notes: The durability question is whether Skyroot can turn a credible dedicated-launch narrative into repeatable trust, cadence, and customer conversion before the market treats it as one more flexible-launch story.
