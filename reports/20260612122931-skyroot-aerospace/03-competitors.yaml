tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Payload / readiness marker
  - Target buyer
  - Differentiation
  - Main limitation
  rows:
  - - Skyroot Aerospace
    - Indian private dedicated launcher
    - Vikram family marketed as rapid, precise, customizable smallsat launch; orbital proof still pending
    - Indian and international smallsat operators needing dedicated access
    - Domestic policy alignment plus dedicated mission-control pitch
    - No public orbital success, no public list pricing, and limited customer disclosure
  - - Agnikul Agnibaan
    - Indian private dedicated launcher
    - Configurable orbital-class launcher; SOrTeD flew in 2024 and 4-engine cluster test completed in 2026
    - Payload owners prioritizing flexible mission design and India-based launch
    - Configurable architecture, mobile launch concept, and single-piece 3D-printed engines
    - Still pre-orbital and commercially unproven at full scale
  - - SpaceX rideshare
    - Shared-manifest substitute
    - Published 2026 rideshare baseline of $350k for first 50 kg to SSO plus $7k/kg incremental
    - Budget-sensitive customers that can tolerate predetermined orbit and timing
    - Lowest disclosed price benchmark and unmatched manifest scale
    - Little control over dedicated timing and insertion specifics
  - - Rocket Lab Electron
    - Proven dedicated small launcher
    - 88 launches, 260+ satellites, 300 kg to LEO, dedicated and responsive mission positioning
    - Customers who value tailored orbit, schedule control, and heritage
    - Strongest operational proof in the small dedicated set
    - Dedicated missions are sold on premium control, not public bargain pricing
  - - Firefly Alpha
    - Heavier dedicated launcher
    - 1,030 kg to LEO / 630 kg to SSO and return to flight in March 2026
    - Defense, tech-demo, and larger smallsat missions
    - Higher payload class than Skyroot and strong U.S. mission adjacency
    - Reliability record remains volatile despite recent recovery
  - - ISAR Spectrum
    - European sovereign launcher
    - Dedicated / lead / rideshare sales model, but April 2026 qualification attempt scrubbed after 2025 first-flight failure
    - European payload owners seeking sovereign access and launch flexibility
    - Clear commercial packaging and sovereign narrative
    - Still working through first-flight learning and launch-abort risk
  - - SSLV / NSIL / ISRO
    - State-backed Indian substitute
    - 500 kg to 500 km LEO launch-on-demand vehicle with first dedicated commercial mission slated for 2026
    - Indian or allied payload owners valuing state-backed domestic access
    - Existing launch infrastructure and completed corrective-action cycle after D1 miss
    - State system may not deliver the same startup-style customization story
  - - RFA ONE
    - European sovereign launcher
    - 1,300 kg to 500 km SSO with summer 2026 orbital attempt target after 2024 test explosion
    - Customers wanting heavier sovereign European dedicated or rideshare options
    - Large payload class and dedicated plus rideshare configurations
    - Major redesign and schedule reset show execution fragility
  - - HyImpulse SL1
    - Early-stage European entrant
    - 600 kg to LEO design with orbital commercialization projected after SR75 customer flights
    - Customers attracted to hybrid propulsion and flexible future service
    - Novel hybrid propulsion and flexible-taxi positioning
    - Orbital service trails the rest of the set in public readiness
  notes: Rows compare the explicit peer set requested for this chapter; payload and readiness markers come from retained official pages and recent independent reporting, while public customer and pricing transparency remain uneven across the field.
