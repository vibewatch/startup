- id: peer-profiles-readiness-and-capability
  title: Peer profiles, readiness, and capability
  body: The competitor profiles show why Skyroot cannot yet be underwritten as a category leader. Rocket Lab already operates from multiple pads, publishes a mature payload guide, and has enough launch history to make cadence part of its sales argument. Firefly brings a meaningfully larger payload class, but its reliability record remains mixed even after its March 2026 return to flight. Agnikul is the closest Indian private analog because it also sells customized, on-demand launch and has already flown a suborbital demonstrator from a private launchpad, yet it too is still chasing its first full orbital proof point. ISAR and RFA remain highly relevant because they prove sovereign-launch funding does not remove first-flight risk, while HyImpulse still appears earlier in commercial maturity with orbital service projected after Skyroot’s current window. SSLV is the most uncomfortable domestic comparator because it already has a successful corrective-action loop and an identified first dedicated
    commercial mission.
