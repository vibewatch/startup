company:
  name: Skyroot Aerospace
chapter:
  number: 3
  title: Competitors
  summary: Skyroot Aerospace competes in a crowded small-launch market where buyers can already choose SpaceX rideshare for the lowest disclosed price, Rocket Lab for the strongest proven dedicated-launch track record, Firefly for heavier payload, SSLV/ISRO for a state-backed Indian alternative, and emerging peers such as Agnikul, Isar, RFA, and HyImpulse for sovereign or flexible-launch narratives. The decisive conclusion is that Skyroot still has a credible domestic and schedule-control wedge, but it remains execution-behind the leaders because its core orbital proof point is still pending while multiple rivals have already translated hardware into either flight heritage or a clearer published commercial posture.
sections:
- id: landscape-and-substitution-logic
  title: Landscape and substitution logic
  body: 'Skyroot is not competing against one neat peer set. It faces at least four distinct alternatives: SpaceX rideshare as the cheapest disclosed access path for payloads that can tolerate shared manifests; Rocket Lab and Firefly as higher-heritage dedicated launch providers; SSLV and Agnikul as the most relevant Indian substitutes for sovereign or locally aligned buyers; and European entrants such as Isar, RFA, and HyImpulse that sell the same schedule-control and sovereignty story to another geography. That structure matters because buyers do not compare all providers on one metric. A payload owner that values schedule certainty and orbit specificity may pay up for dedicated launch, but a budget-constrained customer can still be pushed toward rideshare when the mission can tolerate generic insertion. Skyroot therefore wins only when mission control, domestic alignment, or responsiveness outweigh the price floor and heritage advantages already available elsewhere. In practice, this
    means Skyroot is competing for a narrower mission subset than headline space-economy rhetoric suggests.'
