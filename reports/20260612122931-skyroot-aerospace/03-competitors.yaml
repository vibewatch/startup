callouts:
- calloutType: strength
  title: Skyroot still has a credible domestic wedge
  body: Skyroot does not need to beat SpaceX on price or Rocket Lab on heritage to matter. It needs to prove that Indian and schedule-sensitive buyers will pay for a local dedicated option once Vikram-1 is real.
  claimRefs:
  - CP024
  - CP025
  - CP034
  - CP035
- calloutType: risk
  title: The biggest handicap is proof, not branding
  body: Competitors have already shown that launch startups can raise money and market flexibility while still stumbling on orbital execution. Until Vikram-1 flies successfully, Skyroot remains one proof point behind the leaders and only one setback away from being grouped with the still-emerging set.
  claimRefs:
  - CP008
  - CP016
  - CP018
  - CP023
  - CP033
  - CP039
- calloutType: insight
  title: Price is the floor, but control is the real sale
  body: Across Agnikul, Rocket Lab, Isar, HyImpulse, and Skyroot, the recurring commercial pitch is not lowest cost; it is schedule certainty, orbit specificity, and flexibility. That convergence means Skyroot must prove those promises operationally, not just narratively.
  claimRefs:
