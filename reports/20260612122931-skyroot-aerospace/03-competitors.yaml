  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: skyroot-list-pricing
    missingEvidence: A current public or diligence-room price card for Vikram-1 dedicated launch, including payload bands, orbit options, and contractual inclusions.
    whyItMatters: Without a real Skyroot list or quoted price benchmark, it is impossible to judge whether the company is competing primarily on price, control, or subsidy expectation.
    diligencePath: Request current commercial quoting materials, recent proposal examples, and any realized launch-pricing comps from management.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: first-orbital-customers
    missingEvidence: Named committed paying payload customers, booked manifests, or contract structures for Skyroot and Agnikul first orbital campaigns.
    whyItMatters: The distinction between technical readiness and commercial readiness is central to underwriting whether launch capability converts into revenue.
    diligencePath: Request signed launch-service agreements, non-binding LOIs by mission, and customer reference calls for first-flight manifests.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP001
  - type: stale
    severity: minor
    topic: peer-price-opacity
    missingEvidence: Current public or semi-public dedicated-launch price sheets for Skyroot, Agnikul, Rocket Lab, Firefly, Isar, RFA, and SSLV missions.
    whyItMatters: Pricing opacity hides whether buyers are truly paying a premium for control or simply negotiating ad hoc around the same SpaceX anchor.
    diligencePath: Build a live quote-comparison set from management proposals, brokered payload offers, and customer procurement records.
    relatedQuestionRefs:
