- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bullish argument
  - Counterpoint / anti-thesis
  - What would change the view
  rows:
  - - Domestic strategic wedge
    - India may value an indigenous private orbital launcher with sovereign-access optionality.
    - SSLV already narrows the domestic scarcity story and can absorb some state-aligned demand.
    - Evidence of differentiated customer wins beyond generic sovereignty rhetoric.
  - - Industrial build-out
    - Capex, campuses, and a stated 12-rockets-a-year capability show Skyroot is building real infrastructure.
    - Factory scale without flight cadence can become fixed-cost burden rather than moat.
    - Proof that throughput converts into repeat commercial missions.
  - - Investor quality signal
    - GIC, Sherpalo, and BlackRock-managed funds imply serious diligence and long-duration belief.
    - Prestigious investors do not replace missing unit-economics disclosure or eliminate first-flight risk.
    - Publication of launch ASP, margin bridge, and contract quality.
  - - Sector valuation support
    - Firefly and Isar show investors will support multi-billion launch marks before mature profits.
    - Those peers either sit in larger defense ecosystems or have stronger disclosed production/financing narratives.
    - Comparable proof that Skyroot can win similar strategic or sovereign budgets.
  - - Bridge revenue
    - Space Systems revenue prevents the pure pre-revenue bear case.
    - The bridge business is not the same as proving launch-led economics at unicorn valuation.
    - Breakout of segment margin and conversion from components to launch services.
  notes: Rows frame why the current mark is explainable but still not conclusively fair; each thesis row has a distinct anti-thesis because valuation support is milestone-sensitive.
