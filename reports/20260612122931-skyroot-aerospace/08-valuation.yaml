- id: comparable-anchors-and-the-price-floor
  title: 'Comparable anchors: Rocket Lab, Firefly, Isar, Agnikul, SpaceX, and SSLV'
  body: 'The comp set cuts both ways. SpaceX rideshare is the harshest economic floor because the 2026 published baseline of $350,000 for 50 kilograms plus $7,000 per extra kilogram implies roughly $3.5 million for a 500 kilogram equivalent slot, which is lower than Skyroot’s own management-linked $5 million per-launch revenue proxy. Rocket Lab shows the positive version of the thesis: once a small-launch company proves launch cadence and layers in space-systems scale, the market can support a valuation far beyond private pre-cadence marks. Firefly and Isar are the more relevant private anchors because both show that launch investors will fund scale narratives into the multi-billion range, especially when there is strategic or sovereign demand. Agnikul and SSLV are the corrective anchors. Agnikul’s roughly $500 million 2025 valuation is a more local pre-cadence reference point, while SSLV proves that Skyroot will not own the Indian responsive-launch story uncontested. Those comparisons do
    not make Skyroot’s mark impossible; they simply show that at $1.1 billion the company is being valued as an emerging launch platform, not as a disclosed hardware-revenue business.'
