  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: launch-margin-disclosure
    missingEvidence: Mission-level launch margin disclosure, including insurance, launch-operations cost, reserves, and depreciation allocation.
    whyItMatters: Without it, the current mark cannot be tested against actual launch cash generation.
    diligencePath: Request internal contribution-margin waterfall for the first three commercial missions.
    relatedQuestionRefs:
    - QV008
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: 2026 term sheet showing liquidation preferences, ratchets, dilution mechanics, and any structured-finance links.
    whyItMatters: A strong company can still produce weak common-equity returns if the preference stack is heavy.
    diligencePath: Obtain the latest financing documents and fully diluted cap table.
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: runway-and-debt
    missingEvidence: Current cash balance, debt schedule, covenant package, and management runway plan.
    whyItMatters: Timing of the next fundraise changes downside risk materially if launch proof takes longer than planned.
    diligencePath: Review monthly cash reporting, debt instruments, and 18-month liquidity forecast.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: backlog-quality
    missingEvidence: Named customers, contract firmness, deposit refundability, and backlog conversion by mission.
    whyItMatters: Demand quality is the hinge between strategic narrative and monetizable cadence.
    diligencePath: Inspect customer-level backlog schedule and reference calls for launch buyers.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable valuation table intentionally samples milestone anchors rather than every possible global launch comp
    missingEvidence: A broader standardized global launch comparable set with matched revenue, cadence, and term transparency.
    whyItMatters: The table is sufficient for today's judgment but still a partial sample because private-launch disclosures are inconsistent.
    diligencePath: Extend the comp set with direct term sheets, public filings, and matched cadence disclosures if deeper pricing work is needed.
    relatedTableRefs:
    - TV004
