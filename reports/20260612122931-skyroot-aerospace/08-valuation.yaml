- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Launch revenue denominator
    - Signed launch contracts, realized pricing, and mission mix by dedicated vs rideshare.
    - Without it, the current mark cannot be tied to the business investors are actually valuing.
    - Request contract-level pipeline, realized ASP, and cancellation terms.
  - - Launch unit economics
    - Contribution margin bridge including insurance, launch ops, reserves, and depreciation.
    - The $2M-$3M build-cost proxy is not enough to underwrite cash generation.
    - Obtain mission-level cost waterfall for first three flights.
  - - Backlog quality
    - Named customers, refundable vs firm deposits, and backlog-to-revenue conversion evidence.
    - Demand quality decides whether cadence is real or merely aspirational.
    - Inspect backlog aging, milestone schedule, and top-customer concentration.
  - - Capital structure
    - Preference stack, liquidation terms, debt, and any structured financing around facilities.
    - A good company can still be a weak investment at the wrong terms.
    - Review full cap table, latest term sheet, and debt schedule.
  - - Runway and burn
    - Current cash balance, monthly net burn, and funding trigger milestones.
    - The next round timing matters if orbital proof takes longer than planned.
    - Request latest management accounts and 18-month runway plan.
  - - Strategic demand proof
    - Concrete defense, sovereign, or exportable domestic-use cases that SpaceX rideshare and SSLV do not already cover.
    - The sovereignty premium is central to the bull case.
    - Validate with customer references and procurement pathways, not only management narrative.
  notes: 'These diligence asks are intentionally narrow: each one closes a gap that currently blocks a stronger valuation call.'
