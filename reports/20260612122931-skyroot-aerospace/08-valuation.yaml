chapter:
  number: 8
  title: Valuation
  summary: 'Skyroot''s May 2026 $1.1 billion mark is understandable as a strategic scarcity and milestone-financing bet, but public evidence still supports only a milestone-based valuation framework rather than a clean operating multiple. The decisive missing denominator is launch-specific revenue and margin disclosure: public FY26 revenue came from Space Systems, while the launch business that anchors the unicorn narrative still lacks realized ASP, gross margin, backlog quality, and cadence proof, so the current mark looks stretched rather than obviously cheap.'
sections:
- id: mark-context-and-missing-denominator
  title: The mark is real, but the operating denominator is still missing
  body: 'Skyroot did achieve a real market-clearing private mark in May 2026: multiple outlets place the round at roughly $60 million and a $1.1 billion pre-money valuation, with GIC and Sherpalo co-leading and BlackRock-managed funds among the new backers. That makes the valuation newsworthy, but it does not solve the core underwriting problem. The cleanest public operating datapoint arrived only later through Entrackr’s provisional FY26 review, which said Skyroot crossed Rs 100.6 crore of operating revenue before commercial launch operations started and that the entire figure came from the Space Systems business rather than Vikram launches. Public launch economics are therefore still proxy economics: management-linked coverage cites about $5 million of revenue per launch and $2 million to $3 million of build cost, but there is still no public realized launch ASP, mission mix, refundability profile, gross margin, or booked-customer bridge. Put differently, the current valuation is not unsupported
    by capital formation, but it is still unsupported by the exact operating denominator an investor would normally use to decide whether a billion-dollar mark is fair.'
