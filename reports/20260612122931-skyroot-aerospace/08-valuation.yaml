- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Orbital proof slips again
    - Vikram-1 does not achieve a commercially credible orbital mission in the next visible cycle.
    - The current mark loses its main forward-catalyst support and reverts toward private pre-cadence logic.
    - Pause new capital and re-underwrite from bear case.
  - - First-flight anomaly is not followed by fast learning
    - A failed or partial mission is followed by a long stand-down rather than a clear corrective loop.
    - Cadence narrative weakens and fixed-cost burden grows.
    - Assume slower capital recycling and higher down-round risk.
  - - Customer backlog stays opaque
    - No named customers, no firm backlog bridge, and no conversion evidence from interest to contracts.
    - Strategic narrative stops translating into demand proof.
    - Discount management demand claims heavily.
  - - Disclosed launch margin disappoints
    - Realized launch ASP or margin lands well below the implied proxy economics from current reporting.
    - The valuation loses its path to attractive launch cash generation.
    - Re-cut base case closer to hardware-business logic.
  - - Round terms reveal heavy preference or dilution overhang
    - Preference stack, debt, or ratchets materially subordinate common-equity upside.
    - Even successful execution may not translate into venture returns from this entry.
    - Require term-sheet visibility before leading capital.
  notes: These are IC-level kill criteria, not generic risks; each one directly weakens the logic required to defend a $1.1 billion mark.
