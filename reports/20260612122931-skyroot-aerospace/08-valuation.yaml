- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers the comparable set explicitly requested for this chapter plus the most relevant economic floor and domestic substitute available in reviewed public evidence through 2026-06-12.
  columns:
  - Comparable
  - Status
  - Valuation / pricing / status anchor
  - Operating marker
  - Why it matters
  - Main limitation
  rows:
  - - Rocket Lab
    - Public
    - Market cap about $61.26B on 2026-06-12 per StockAnalysis
    - Q1 2026 revenue >$200M; backlog >$2.2B; Electron 300 kg LEO
    - Shows what public markets can pay for flight-proven launch plus space-systems scale.
    - Far more proven and diversified than Skyroot, so it is an upper-bound sentiment anchor rather than a direct comp.
  - - Firefly Aerospace
    - Private / IPO path
    - $175M Series D in 2024; >$2B private valuation; 2025 IPO marketing up to $6.04B
    - Alpha scale-up plus Elytra / MLV narrative; 4-6 Alpha launches targeted in 2025
    - Shows investor willingness to pay for responsive-space narratives before long profit history.
    - U.S. defense adjacency and capital-market depth exceed Skyroot's context.
  - - Isar Aerospace
    - Private
    - EUR 270M Series D in 2026; reported EUR 2.0B-2.2B valuation references
    - Post-first-flight-failure recovery, global expansion, target of 40 vehicles a year
    - Shows sovereign-launch scarcity can sustain large marks even before repeat cadence.
    - European sovereign-demand dynamics differ materially from India.
  - - Agnikul Cosmos
    - Private
    - About $17M raised in 2025 at about $500M valuation
    - Indian private launch peer still scaling production and recovery tech
    - Closest local pre-cadence valuation anchor for a private Indian launcher.
    - Smaller capital base and different stage of technical proof.
  - - SpaceX rideshare
    - Economic floor, not equity comp
    - $350k for first 50 kg to SSO plus $7k/kg incremental in 2026
    - Approx. $3.5M for 500 kg equivalent slot at published list economics
    - Defines the price floor that every dedicated small launcher must overcome with flexibility or sovereignty.
    - Not a valuation comp and not dedicated-launch service.
  - - SSLV / ISRO / NSIL
    - State-backed domestic substitute
    - No private-equity valuation analogue; official launch-on-demand commercialization context
    - Up to 500 kg LEO, quick-turnaround, industrial-production positioning
    - Constrains any thesis that Skyroot owns Indian responsive-launch demand by default.
    - State-backed program economics do not map directly into venture valuation.
  notes: The table mixes equity comps and one non-equity economic floor intentionally; valuation work for launch startups is partly about what capital markets pay and partly about what mission buyers can pay.
