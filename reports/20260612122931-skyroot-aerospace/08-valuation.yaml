- id: FV001
  title: Recommendation logic
  type: flow
  layout: standard
  summary: 'The valuation call runs through a simple chain: real funding and industrial progress are visible, but the launch denominator and proof points are not yet visible enough to make the current mark attractive.'
  data:
    nodes:
    - id: round
      label: Real unicorn round
      detail: May 2026 financing cleared at $1.1B with blue-chip investors.
    - id: bridge
      label: Bridge revenue exists
      detail: FY26 public revenue came from Space Systems before launch commercialization.
    - id: proof
      label: Launch proof pending
      detail: Commercial launch revenue, cadence, and realized ASP remain largely prospective.
    - id: denominator
      label: Denominator missing
      detail: No public launch margin, backlog quality, or contract-term bridge exists.
    - id: comp
      label: Comps support possibility
      detail: Firefly, Isar, and Rocket Lab show that launch narratives can command large marks.
    - id: call
      label: Current call
      detail: Stretched valuation; keep on track list, but wait for proof or better disclosure.
    edges:
    - from: round
      to: bridge
      label: helps validate
    - from: bridge
      to: proof
      label: does not replace
    - from: proof
      to: denominator
      label: keeps
    - from: denominator
      to: call
      label: drives
    - from: comp
      to: call
      label: prevents outright pass
  approximationNotes: This flow is decision logic, not a process map; it shows why a real funding round still produces only a stretched-not-cheap verdict on public evidence.
