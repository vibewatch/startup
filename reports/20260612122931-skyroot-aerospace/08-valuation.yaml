tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Public-evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research more / wait for proof
    - Current public evidence explains why investors funded Skyroot but does not yet underwrite the launch business cleanly.
    - Do not treat the May 2026 mark as self-justifying.
  - - Confidence
    - Medium
    - The funding round, comp set, and bridge revenue are visible, but launch ASP, margin, backlog quality, and round terms remain opaque.
    - Maintain active diligence rather than a conviction call.
  - - Risk rating
    - High
    - First-orbital-launch risk, cadence risk, customer-conversion risk, and disclosure risk all still sit ahead of the company.
    - Downside can materialize quickly if milestones slip.
  - - Valuation stance
    - Stretched
    - The price can be defended only through milestone delivery and strategic scarcity, not through a disclosed operating denominator today.
    - Base-case upside from the current mark looks limited.
  - - IC posture
    - Track closely, do not anchor on unicorn label
    - The label says something about capital formation, not about fair value on disclosed launch economics.
    - Wait for orbital proof, backlog disclosure, or materially better terms.
  notes: This table intentionally separates valuation stance from company quality; the recommendation is driven by missing launch-business disclosure, not by a claim that Skyroot lacks strategic merit.
