company:
  name: Opentrons Labworks
chapter:
  number: 1
  title: Company Overview
  summary: 'Opentrons Labworks is a New York laboratory-automation company built around affordable, programmable liquid-handling robots and an increasingly broader software, protocol, and partner ecosystem. Public evidence is strongest on product identity, leadership transition, and financing chronology: the company raised a $200 million Series C in 2021 at a disclosed $1.8 billion post-money valuation, filed a new Form D in December 2025 after a reported $20.1 million Series C extension, and by 2026 was describing itself as the execution layer for AI-driven autonomous science. The main diligence gaps are current valuation, true headcount, exact founding date, and the bridge from the 2021 unicorn narrative to present-day operating scale.'
sections:
- id: identity-and-platform-scope
  title: Identity, mission, and platform scope
  body: 'Opentrons still frames its identity around democratizing lab automation for scientists who would otherwise spend too much time doing manual pipetting. The current homepage emphasizes fewer bottlenecks, reconfigurable hardware, and an open platform rather than a closed proprietary stack. The mission page and Y Combinator profile keep the older formulation intact: robots should free biologists from repetitive benchwork and create a shared protocol layer that improves reproducibility across labs. What has changed since the OT-2 era is scope. The 2024 and 2026 product-news stream shows a company that now sells not only benchtop liquid handlers but also protocol-authoring software, a protocol library, an automation marketplace, compliance-ready software for regulated environments, and AI-linked execution infrastructure. In other words, Opentrons is no longer best described as a single low-cost robot vendor. The stronger public description is an open laboratory automation platform whose
    core products are still the OT-2 and Flex, but whose commercial ambition now includes software, partner integrations, and an execution layer for AI-driven lab work.'
