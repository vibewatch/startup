  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-completeness
    missingEvidence: A full current board roster and committee map sourced from Opentrons or a primary filing.
    whyItMatters: Governance visibility is limited even though the company has raised a large amount of private capital and changed CEOs.
    diligencePath: Request the current board list, observer rights, and any committee structure directly from management or from the latest investor materials.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount-and-revenue
    missingEvidence: A management-confirmed current employee count and current revenue run-rate or audited revenue.
    whyItMatters: Directory estimates conflict, and capital intensity cannot be judged cleanly without scale metrics.
    diligencePath: Request current headcount by function, 2025 revenue, 2026 YTD revenue, and any ARR or hardware-versus-services mix from management.
    relatedQuestionRefs:
    - QO022
    - QO023
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: The price, terms, and post-money valuation of the 2025 financing activity or any later secondary marks from primary holders.
    whyItMatters: The gap between the 2021 unicorn valuation and later secondary-market skepticism is one of the central underwriting uncertainties.
    diligencePath: Obtain the 2025 round documents, 409A history, cap table, and any institutional fair-value marks from current investors.
    relatedQuestionRefs:
    - QO013
    - QO014
    - QO024
    relatedTableRefs:
    - TO001
    - TO003
    - TO004
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: A primary-source corporate history that states the exact founding date and distinguishes prototype work from legal incorporation.
    whyItMatters: Public sources split between 2013 and 2014, which can distort milestone timing and investor-history narratives.
    diligencePath: Confirm the legal incorporation date, first commercial shipment date, and management-designated founding year with the company.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO001
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: partial-enumeration
    missingEvidence: A fuller public roster of all current directors, advisors, and all material investors beyond the most visible names.
    whyItMatters: The chapter intentionally prioritizes the most relevant people and investors, but it does not claim exhaustive coverage.
    diligencePath: Expand the roster from investor materials, cap-table documents, and any board-consent or governance summaries during live diligence.
    relatedQuestionRefs:
    - QO009
    - QO015
    relatedTableRefs:
    - TO002
    - TO003
