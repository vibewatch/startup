- id: capital-history-and-financing-dependency
  title: Capital history, adequacy, and financing dependency
  body: 'The cleanest part of the financial record is fundraising chronology. Opentrons’ own 2021 announcement describes a $200 million Series C led by SoftBank Vision Fund 2 with Khosla Ventures participating, and more importantly explains what the cash was meant to fund: new robotic tools, an expanded biofoundry, new diagnostic tests, and additional diagnostic labs. That matters because it indicates a capital plan that extended far beyond ordinary sales expansion for a benchtop hardware vendor. Later public sources are less complete but directionally consistent. Tracxn and CB Insights both record fresh late-2025 capital and still point back to the 2021 $1.8 billion valuation anchor, while the SEC filing confirms financing activity via a December 5, 2025 Form D. What remains missing is just as important: no primary source reviewed here discloses the 2025 proceeds’ intended use, the post-money price, cash on hand, burn rate, or runway. The only defensible interpretation is that Opentrons
    retained financing dependency after the SoftBank round, but public evidence is insufficient to say whether that reflected opportunistic top-up funding or a tighter runway.'
