- id: TI004
  title: Capital adequacy table
  columns:
  - Cash on hand / burn / runway / use of funds
  - Current value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2021 Series C amount
    - ${200M} announced
    - high
    - Last large primary financing anchor
    - Confirm remaining proceeds history and major uses
  - - 2021 planned uses
    - New robotic tools, expanded biofoundry, new diagnostic tests, additional diagnostic labs
    - high
    - Shows capital intensity beyond simple GTM scaling
    - Reconcile those plans with current operating footprint
  - - Late-2025 financing event
    - $20.1M reported in databases; Form D filed 2025-12-05
    - medium
    - Signals fresh capital dependency or optionality
    - Obtain executed financing docs and cap table impact
  - - Cash on hand
    - 'null'
    - high
    - Primary runway denominator
    - Request current cash and restricted cash balances
  - - Monthly burn
    - 'null'
    - high
    - Required for adequacy and next-round timing
    - Request trailing 12-month operating cash burn
  - - Runway months
    - 'null'
    - high
    - Determines financing urgency
    - Calculate after management provides cash and burn
  - - Debt / project-finance obligations
    - Not publicly surfaced in reviewed sources
    - medium
    - Can distort apparent runway
    - Request debt schedules, leases, and guarantees
  - - Next-round trigger
    - Not publicly surfaced in reviewed sources
    - medium
    - Links performance to financing dependency
    - Ask management for trigger metrics and downside plan
  notes: The table preserves what can be verified and leaves core adequacy metrics null where the public record is silent.
