- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metrics
  - Impact
  - Exact diligence path
  rows:
  - - Recognized revenue by product line
    - Without it, no credible mix or growth analysis exists
    - Request monthly revenue by hardware, consumables, software, services, and subsidiaries
  - - Gross margin by stream
    - Hardware growth is low quality if service burden erodes contribution margin
    - Request COGS allocation and contribution margin by category
  - - Cash, burn, and runway
    - Financing dependency cannot be assessed precisely
    - Request current cash, trailing burn, and scenario runway model
  - - Installed-base activity and reorder rates
    - 10,000 deployed systems matter only if they are active and buying
    - Request active robots, consumables reorder curves, and churn by cohort
  - - 2025 financing terms and price
    - Cap-table and valuation implications remain opaque
    - Review financing documents, share price, liquidation preferences, and investor rights
  - - Customer concentration and channel mix
    - Enterprise reach may not equal revenue diversity
    - Request top-customer exposure, direct vs partner sales, and geography mix
  notes: These are the minimum private datasets needed before making a conviction call on revenue quality or runway.
