company:
  name: Opentrons Labworks
chapter:
  number: 4
  title: Financials
  summary: 'Public financial evidence on Opentrons is lopsided: fundraising history and product monetization surfaces are relatively visible, but revenue quality, margins, burn, and runway are still opaque. The strongest supported facts are that Opentrons raised a $200 million SoftBank-led Series C in 2021, filed a late-2025 Form D after a reported $20.1 million extension/C-II round, publicly sells hardware with a listed Flex starting price of $24,950 and required installation, and has added software and compliance layers that could improve mix over time. The weakest areas are the ones investors care about most for underwriting: current revenue, gross margin, cash on hand, and the exact economics of the 2025 financing. The defensible conclusion is that Opentrons has a diversified monetization surface and continuing access to capital, but its true financial quality still depends on private diligence rather than public disclosures.'
sections:
- id: revenue-model-and-monetization-surface
  title: Revenue streams, pricing, and the visible monetization surface
  body: 'Opentrons is no longer best described as a single robot sale. The public product and launch record shows a layered monetization surface: base robots, pipettes and modules, preferred tips and labware, required on-site installation, protocol and app surfaces that reduce friction, partner-marketplace attachments, and a compliance-oriented software layer for regulated discovery teams. The strongest evidence is on what exists rather than on how much it contributes. Flex is publicly listed starting at $24,950, but installation is mandatory and geographic pricing varies, implying real realized ASPs should be higher than the sticker price once services are included. The OT-2 product page pushes Opentrons-branded tips and compatibility logic that can support recurring consumables pull-through. The protocol library, app, and marketplace add commercial surface area, even if the reviewed record does not disclose standalone SaaS pricing or partner take rates. Overall, the visible revenue model
    looks more like hardware plus services plus ecosystem attach than like a pure one-time equipment purchase.'
