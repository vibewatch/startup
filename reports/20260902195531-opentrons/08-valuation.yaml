company:
  name: Opentrons Labworks
chapter:
  number: 8
  title: Valuation
  summary: Opentrons still has a credible company-level case—real installed-base claims, a broadening product stack, an active Merck channel, and evidence of continued late-2025 financing support—but public evidence does not cleanly support paying the 2021 unicorn price today. The last clearly disclosed primary valuation remains the $1.8 billion September 2021 Series C led by SoftBank Vision Fund 2. A November 2025 follow-on round and December 2025 Form D show capital activity continued, yet no public source in this review provides a later verified post-money valuation, cap-table bridge, or recurring-revenue disclosure. Public comparable companies in lab automation and adjacent life-science tools mostly trade in the low-single-digit sales range, while much richer multiples are reserved for larger or software-like automation platforms such as Symbotic. Thin secondary dashboards now surface far lower implied marks, but their methodology is too opaque to treat as fair value. The most defensible
    stance is therefore research-more at the 2021 anchor, with interest preserved only if diligence proves stronger recurring revenue, better mix, and materially cleaner current pricing than the public record shows.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'The public record supports a differentiated company, not a confidently underwritten unicorn entry price. Opentrons has a real installed-base story, an unusually open product ecosystem, a credible 2025 Merck commercialization relationship, and a 2026 compliance-oriented software launch that shows management is trying to move beyond low-cost academic automation. Those are not cosmetic signals. They matter because they suggest the company can still convert affordable robot adoption into higher-value software, consumables, and regulated-workflow revenue over time. But valuation is where the case breaks from company quality. The last clearly disclosed primary valuation is still the September 2021 $1.8 billion Series C. The late-2025 financing evidence proves continued investor support, yet it does not publicly disclose the new post-money price, preference structure, or revenue milestones that would justify carrying forward the 2021 mark. Because public operating data remain thin and
    conflicting, the recommendation must be price-sensitive: research-more at or near the unicorn anchor, track at a large discount, and upgrade only if diligence shows durable recurring economics rather than mostly hardware-style revenue.'
