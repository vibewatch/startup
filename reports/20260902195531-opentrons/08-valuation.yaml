- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Covers five public-market or public-data reference points that bracket automation and adjacent life-science-tool valuations relevant to Opentrons. It omits private secondary trades with insufficient transparency and private incumbents such as Hamilton that do not disclose comparable market-value data.
  columns:
  - Comparable
  - Public metric
  - Multiple / valuation status
  - Relevance to Opentrons
  - Limitation
  rows:
  - - Tecan
    - 2025 revenue 882.48M; Sep-2026 market cap 2.42B to 2.96B
    - ~2.7x to ~3.4x sales
    - Best clean public lab-automation anchor for automated liquid handling
    - Far larger, public, and more mature than Opentrons
  - - Azenta
    - FY2025 revenue 593.82M; Sep-2026 market cap 1.39B
    - ~2.3x sales
    - Adjacent automation/sample-management comp showing low-single-digit public band
    - Broader portfolio than liquid handling and not a direct pipetting peer
  - - Standard BioTools
    - 2025 revenue 85.33M; Sep-2026 market cap 264.32M
    - ~3.1x sales
    - Small-cap life-science tools reference at a scale closer to Opentrons than Danaher
    - Not a pure automation comp and equity-market sentiment is depressed
  - - Danaher
    - 2025 revenue 24.57B; Sep-2026 market cap 147.56B
    - ~6.0x sales
    - Shows premium awarded to scaled diversified life-science platforms
    - Conglomerate structure makes it an upper-bound context, not a direct multiple anchor
  - - Symbotic
    - FY2025 revenue 2.25B; Sep-2026 market cap 24.11B
    - ~10.7x sales
    - Illustrates public reward for scaled automation platforms with strong growth expectations
    - Different end market and scale; too rich to use as a base-case Opentrons analogue
  notes: Rows are ordered from most directly useful base-case anchor to least directly applicable premium context.
