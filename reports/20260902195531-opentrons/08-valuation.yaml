- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Support for thesis
  - Anti-thesis / what would change the view
  rows:
  - - Installed-base wedge
    - 2026 official materials claim 10,000+ systems and strong academic/biopharma reach
    - Installed base alone is not monetized fleet proof; need active-robot, repeat-purchase, and utilization data
  - - Product expansion
    - Flex, open-source software, and CRS suggest a broader platform than a single low-cost robot
    - OT-2 remains explicitly non-GMP/IVD validated, so upmarket conversion may be slower than platform rhetoric implies
  - - Commercialization path
    - Merck partnership and AAW launch show partner-led workflow packaging beyond academia
    - Channel economics and sell-through are undisclosed; one strong partner relationship can overstate market breadth
  - - Financing durability
    - Late-2025 financing activity shows investors did not abandon the company after 2021
    - No public source in this review discloses a later verified post-money price or preference stack
  - - Valuation upside
    - If Opentrons proves recurring software/consumables mix, public comp set could expand above hardware-style bands
    - Without that proof, low-single-digit sales comps dominate and the 2021 price looks difficult to defend
  notes: A buy case is possible only if the anti-thesis items are answered with private diligence evidence rather than narrative extrapolation.
