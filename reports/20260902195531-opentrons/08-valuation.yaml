- id: scenario-analysis-and-return-range
  title: Scenario analysis and return range
  body: 'A scenario frame is more honest than false precision because both Opentrons’ revenue base and mix remain publicly unresolved. In the bear case, the company behaves like a capital-intensive hardware and workflow vendor with uneven enterprise conversion, modest attach, and another financing event on tougher terms; using low revenue and low-single-digit multiples yields a value range that overlaps the more adverse secondary-style dashboards. The base case assumes Opentrons continues shipping robots, expands through Merck and related workflow channels, and monetizes part of its installed base without proving a true software re-rating; that case still lands far below the 2021 unicorn anchor. The bull case assumes Flex, CRS, consumables, and partner-packaged workflows materially improve revenue quality and push the business toward a higher recurring-revenue mix. Even then, public evidence struggles to reach $1.8 billion unless revenue is materially above external estimates or the company
    can show software-like retention and margin characteristics. That asymmetry makes today’s most supportable public conclusion straightforward: upside exists, but the old price is a stretch unless private diligence produces much stronger economics than the web record currently reveals.'
