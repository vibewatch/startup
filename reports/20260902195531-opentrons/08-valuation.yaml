- id: comparable-set-and-public-multiple-brackets
  title: Comparable set and public multiple brackets
  body: 'The cleanest public anchor is Tecan, because it is a real lab-automation company rather than a general life-science conglomerate. Using 2025 revenue and September 2026 market-value snapshots, Tecan sits around the high-2x to low-3x sales range, depending on the market-cap source used. Azenta, an adjacent but broader life-science automation and sample-management company, screens near the low-2x range. Standard BioTools, a much smaller and weaker-growth life-science tools company, screens around low-3x sales despite substantial equity-market pressure. Danaher sits materially richer, but that valuation reflects scale, diversification, and a portfolio far broader than automated liquid handling. Symbotic sits in a different bracket altogether, with a double-digit sales multiple driven by public growth, larger scale, and platform expectations. The synthesis matters: the public market does contain automation companies that deserve premiums, but those premiums generally require clearer
    recurring economics, larger revenue bases, or both. On public evidence alone, Opentrons looks closer to a low-single-digit sales underwriting problem than to a software-style platform that deserves a preserved 2021 venture multiple.'
