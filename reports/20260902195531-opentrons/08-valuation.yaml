  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: Private-company comparables such as Hamilton and any credible direct secondary prices for Opentrons that disclose methodology, date, and transaction context.
    whyItMatters: The comparable table brackets public-market context well enough for directionality, but it does not fully solve the private-company pricing question.
    diligencePath: Request brokered secondary indications, cap-table history, and management’s internal comparable set; supplement with proprietary databases during diligence.
    relatedQuestionRefs:
    - QV013
    - QV019
    - QV029
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: current-financing-economics
    missingEvidence: The actual share price, post-money valuation, preference stack, investor rights, and dilution terms of the late-2025 financing.
    whyItMatters: These terms directly determine whether the company’s current value is closer to the 2021 anchor, a flat extension, or a concealed reset.
    diligencePath: Review financing documents, updated cap table, board consents, and any 409A or fairness materials.
    relatedQuestionRefs:
    - QV003
    - QV004
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited revenue by segment, recurring-revenue attach, gross margin by line, cohort retention, and installed-base utilization.
    whyItMatters: Without revenue quality, the company cannot be distinguished confidently from a hardware-style or workflow-services-style business.
    diligencePath: Request audited financials, ARR or repeat-purchase cohorts, SKU-level gross-margin bridge, and active-fleet telemetry dashboards.
    relatedQuestionRefs:
    - QV024
    - QV025
    - QV029
