  topStrengths:
    - 在平价实验室自动化领域，品牌和装机覆盖扎实；2026 年官方口径称已部署系统超过 10,000 台。
    - 产品面不止一台机器人，覆盖 Flex、OT-2、软件、protocols、modules，以及更新的合规导向层。
    - 2025 年底仍有投资者活动，说明公司在 2021 年独角兽轮之后依然能融到钱。
    - Merck 合作、AAW 工作站打包和 CRS，为更丰富的工作流变现提供了一条可信路径。
    - 开源和平价定位仍是差异化切入口，可对抗许多传统既有厂商。
  topRisks:
    - 没有公开的已审计收入、毛利率、留存或股权结构细节，无法支撑精确估值判断。
    - 当前定价不透明；最后一次披露的一级市场估值来自 2021 年，而信息较薄的二级市场类看板暗示估值大幅走低。
    - 硬件和服务敞口可能使其估值倍数低于软件式自动化叙事所暗示的水平。
    - 受监管工作流转化的公开证据更新、更薄，弱于装机故事。
    - 2025 年底融资条款、清算优先权和稀释影响在公开资料中并不清楚。
  unresolvedGaps:
    - 按硬件、软件、服务和耗材拆分的已审计收入桥接。
    - 当前投后估值、股价和清算瀑布。
    - 活跃机队利用率、复购行为和升级率。
    - CRS 采用、续费和受监管客户背书能力。
    - 合作伙伴渠道销售落地与收入集中度经济性。
