      - number: '5.4'
        title: Product maturity, roadmap signals, and technical risks
        blocks:
          - type: paragraph
            body: >-
              The technical maturity picture is good, but uneven. The evidence is strongest for accessible automation,
              documented APIs, modular accessories, and a continuing release cadence into 2025 and 2026. The weakest
              areas appear where users try to push the platform toward edge performance or enterprise assurance.
              Academic extensions show that OT-2 can be adapted far beyond stock use cases, including nanoliter liquid
              handling and camera-guided colony picking, but those same papers reveal the hidden cost of openness:
              advanced performance often requires custom hardware, 3D-printed parts, new software layers, or external
              monitoring. The AEGIS work sharpens this point by highlighting sensing limitations that higher-end systems
              may handle natively. The public verdict is therefore balanced. Opentrons has real product depth and active
              roadmap momentum, but part of its technical value proposition assumes a customer base willing to
              co-create, customize, and accept more implementation responsibility than they would with classic high-end
              incumbents. That makes implementation support, documentation quality, and version-management discipline
              central parts of the product, not just auxiliary functions.
