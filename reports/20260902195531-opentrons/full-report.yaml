      - number: '8.2'
        title: Financing context and public price signals
        blocks:
          - type: paragraph
            body: >-
              Financing evidence is stronger than revenue evidence, but it still leaves a large valuation gap.
              Opentrons’ own 2021 press release and multiple third-party trackers align on the key anchor facts: a $200
              million Series C led by SoftBank Vision Fund 2, participation from Khosla Ventures, and a disclosed $1.8
              billion valuation. Tracxn, SEC EDGAR, VCBacked, and Company Check together show that capital activity
              continued into late 2025 through a roughly $20.1 million follow-on and a December 5, 2025 Form D filing.
              What they do not show is at least as important. Public sources disagree on round naming, total dollars
              raised, and even employee or revenue estimates. Some low-transparency dashboards now imply marks far below
              the 2021 price, but they openly admit pricing-signal scarcity or expose only teaser data. The right
              reading is neither “the unicorn is intact” nor “the company is definitely worth $136 million.” It is that
              current pricing is opaque, and that opaque pricing should push an investor toward deeper diligence and
              stricter entry discipline rather than toward carrying forward an old headline valuation by default.
            claimRefs:
