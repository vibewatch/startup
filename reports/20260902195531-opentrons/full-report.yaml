  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and the visible adoption footprint
        blocks:
          - type: paragraph
            body: >-
              Opentrons’ customer base is best understood as a multi-segment research platform, not a single
              lab-equipment niche. Public customer stories and partner releases place the company across university
              research labs, teaching labs, genomics cores, synthetic-biology groups, biopharma and reagent partners,
              startup platforms, and some clinical or public-health-adjacent work. The broadest public adoption claims
              come from 2025–2026 company-distributed materials: more than 10,000 systems deployed globally,
              installations at every top-20 U.S. research university, and use by 14 of the top 15 global biopharma
              companies. Those are powerful reach indicators, but they should be read as coverage, not revenue
              concentration. The more useful lens is buyer-user-payer separation. In academia, principal investigators,
              core facilities, or educators often buy; students, technicians, and researchers use; and departmental or
              grant budgets pay. In pharma and partner channels, procurement and assay teams may buy while scientists
              and operators use. That split helps explain why Opentrons can land in many environments while still having
              highly uneven monetization quality across accounts.
