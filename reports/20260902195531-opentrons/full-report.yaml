      - number: '7.3'
        title: Dependency, competition, and financing risk
        blocks:
          - type: paragraph
            body: >-
              The dependency map is broader than it first appears. On the positive side, Merck’s partnership and the AAW
              workstation reduce some commercialization risk by validating a channel-led path into higher-value assay
              workflows. On the negative side, that same pattern creates partner-dependence risk if only a small set of
              commercial relationships matter. Competitive risk is equally two-sided. At the high end, Hamilton, Tecan,
              and Beckman/Danaher have deeper enterprise service depth, integration maturity, and regulated credibility.
              At the low-to-mid end, INTEGRA and Formulatrix narrow the space Opentrons can own on accessibility alone.
              Financially, the risk is not a proven insolvency problem but a visibility problem with teeth:
              low-transparency secondary-mark sources now imply marks far below the 2021 unicorn valuation, and
              SoftBank’s own macro risk profile adds an indirect overhang to the flagship historical round. Public
              information is enough to say Opentrons can still raise and ship products; it is not enough to say future
              capital, dilution, or partner concentration risk is comfortably contained.
