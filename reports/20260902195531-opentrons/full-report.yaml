      - number: '2.4'
        title: Adoption constraints, maturity limits, and preserved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The bullish market story is real, but the constraints are equally material. Recent technical literature
              shows that self-driving labs are still mostly bespoke systems rather than plug-and-play infrastructure,
              and that the hardest problems are often software, interoperability, and workflow design rather than robot
              mechanics alone. Market reports echo that point by calling out compatibility, integration, and
              implementation complexity as real drags on adoption. Validation time is especially important for pharma,
              diagnostics, and any workflow that depends on regulated records or audit trails. Budget structure is
              another meaningful constraint: NIH's long-run scale supports academic demand, yet the 2026 award slowdown
              highlighted by AAMC shows how capital timing can interrupt purchasing even when top-line budgets remain
              large. The biggest remaining analytical gap is that no reviewed public source isolates a clean SAM for
              affordable programmable benchtop automation with a regulated-discovery option. That does not invalidate
              the opportunity, but it means diligence should underwrite segment focus, adoption friction, and conversion
              mechanics instead of simply inheriting a broad TAM slide.
