      - number: '1.5'
        title: Milestones, adverse checks, and what is still unresolved
        blocks:
          - type: paragraph
            body: >-
              The milestone record from 2023 through 2026 shows a company broadening from affordable automation into a
              fuller operating stack. The Flex launched in 2023, the protocol library and automation marketplace landed
              in early 2024, Flex Prep expanded the no-code entry point later in 2024, and 2026 brought both
              NVIDIA-linked autonomous-science positioning and compliance-ready software aligned to 21 CFR Part 11-style
              controls. Those launches make the company look more mature than a single-instrument startup. The harder
              question is whether that maturity has preserved the 2021 unicorn valuation. Here the public record turns
              adverse. Current official sources do not disclose revenue, current valuation, or a verified headcount.
              Third-party directories disagree meaningfully on employee count, and private-market tracking sites now
              surface implied values or share prices far below the 2021 mark, though their methodologies are thin and
              should not be mistaken for liquid market-clearing prices. The right overview judgment is therefore
              balanced: Opentrons still has real product breadth, a recognizable investor base, and credible deployment
              scale, but investors should treat current valuation, cap-table terms, and operating efficiency as live
              diligence questions rather than inherited truths from the 2021 SoftBank round.
