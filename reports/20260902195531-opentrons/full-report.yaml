      - number: '1.3'
        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is one of the cleaner parts of the public record. James Atwood joined the company in
              April 2023 to run the robotics business unit and had already assumed the CEO role in July 2025 before the
              promotion was publicly announced in January 2026. The current about page shows a compact but functional
              bench under him, including Leslie Mitchell in science, Greg Cole in engineering, Gavin Bogart in finance,
              Brian O'Sullivan in commercial leadership, Boris Mindzak in legal, and Censia Pottorf in HR. Chiu Chau
              still appears as a co-founder on the official leadership surface, while Myrtle Potter remains the most
              visible board-level figure in current materials. The key-person question is less about whether the company
              has named leaders and more about whether the transition from Jonathan Brennan-Badal to Atwood reflects a
              deliberate product-and-commercial shift toward AI-linked robotics. Public evidence suggests it does:
              Atwood's 2023 hiring focused on scaling commercialization of OT-2 and the next generation of robots, and
              the 2026 messaging under his leadership leans heavily into autonomous science, NVIDIA integration, and
              regulated workflow expansion. Governance remains only partially transparent, however, because public
              materials do not provide a full current board roster, ownership map, or committee structure.
