      - number: '4.3'
        title: Traction proxies, unit-economics logic, and cost structure
        blocks:
          - type: paragraph
            body: >-
              The public traction story is stronger on deployment breadth than on recognized revenue. In 2026, citybiz
              and Instrument Business Outlook repeated company claims of more than 10,000 systems deployed globally,
              every top-20 U.S. research university, and fourteen of the top fifteen global biopharma companies. Those
              are meaningful reach metrics because they imply a real installed base for future consumables, software,
              and services pull-through. But they are not the same thing as revenue quality. Directory estimates on
              revenue and headcount conflict meaningfully, with Usearch posting $135.8 million revenue and 278 employees
              while Tracxn reported 190 employees as of late 2024. Public sources likewise do not disclose gross margin,
              cohort expansion, renewal, utilization, or CAC payback. The best financial logic available from public
              evidence is therefore structural rather than measured: software and compliance layers should carry better
              incremental margins than robot hardware, while historical investments in PRL, Neochromosome, and related
              platform ambitions likely raised fixed costs and capital intensity. Investors can see the shape of the
              model, but not the actual unit economics.
