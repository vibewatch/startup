  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports a differentiated company, not a confidently underwritten unicorn entry price.
              Opentrons has a real installed-base story, an unusually open product ecosystem, a credible 2025 Merck
              commercialization relationship, and a 2026 compliance-oriented software launch that shows management is
              trying to move beyond low-cost academic automation. Those are not cosmetic signals. They matter because
              they suggest the company can still convert affordable robot adoption into higher-value software,
              consumables, and regulated-workflow revenue over time. But valuation is where the case breaks from company
              quality. The last clearly disclosed primary valuation is still the September 2021 $1.8 billion Series C.
              The late-2025 financing evidence proves continued investor support, yet it does not publicly disclose the
              new post-money price, preference structure, or revenue milestones that would justify carrying forward the
              2021 mark. Because public operating data remain thin and conflicting, the recommendation must be
              price-sensitive: research-more at or near the unicorn anchor, track at a large discount, and upgrade only
              if diligence shows durable recurring economics rather than mostly hardware-style revenue.
            claimRefs:
