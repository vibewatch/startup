      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is not about finding one more flattering article; it is about resolving a short list of
              valuation-critical unknowns. First, management must bridge the company from the 2021 round to the present
              with audited revenue, gross margin, hardware-versus-software mix, and cohort-level repeat-purchase or
              subscription data. Second, investors need the actual economics of the late-2025 financing: round
              documents, liquidation preferences, option-pool changes, and whether the price stepped up, held flat, or
              reset relative to 2021. Third, the company must show how much of the claimed installed base is active,
              monetized, and expandable into Flex, CRS, consumables, or partner workflows. Without those answers, the
              prudent posture is to monitor rather than to pay for narrative optionality. The thesis should break if
              another financing round prices far below management’s internal narrative, if regulated-workflow adoption
              stays thin, or if installed-base breadth fails to translate into recurring revenue. The thesis can improve
              only if Opentrons proves it is becoming a higher-quality automation platform rather than simply a widely
              known low-cost robot brand.
