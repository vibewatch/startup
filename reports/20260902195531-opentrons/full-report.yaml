  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing, and the visible monetization surface
        blocks:
          - type: paragraph
            body: >-
              Opentrons is no longer best described as a single robot sale. The public product and launch record shows a
              layered monetization surface: base robots, pipettes and modules, preferred tips and labware, required
              on-site installation, protocol and app surfaces that reduce friction, partner-marketplace attachments, and
              a compliance-oriented software layer for regulated discovery teams. The strongest evidence is on what
              exists rather than on how much it contributes. Flex is publicly listed starting at $24,950, but
              installation is mandatory and geographic pricing varies, implying real realized ASPs should be higher than
              the sticker price once services are included. The OT-2 product page pushes Opentrons-branded tips and
              compatibility logic that can support recurring consumables pull-through. The protocol library, app, and
              marketplace add commercial surface area, even if the reviewed record does not disclose standalone SaaS
              pricing or partner take rates. Overall, the visible revenue model looks more like hardware plus services
              plus ecosystem attach than like a pure one-time equipment purchase.
