      - number: '1.4'
        title: Capital base, investor map, and operating scale signals
        blocks:
          - type: paragraph
            body: >-
              The funding record anchors the company much more firmly than operating metrics do. Opentrons' own 2021
              release announced a $200 million Series C led by SoftBank Vision Fund 2 with Khosla Ventures participating
              and described concrete uses of funds across robotics, diagnostics, and biofoundry expansion. Third-party
              funding databases, despite access and methodology limitations, broadly corroborate the larger chronology:
              roughly $261 million raised across seven rounds, a disclosed $1.8 billion post-money valuation in
              September 2021, and a new $20.1 million Series C extension dated November 20, 2025 in Tracxn alongside a
              December 5, 2025 SEC Form D filing. That does not prove the 2025 extension closed on the same date or at
              the same economics as the 2021 round, but it does show continued capital activity rather than a frozen cap
              table. The investor map also reveals why Opentrons still matters strategically: Khosla appears as a
              long-duration backer, SoftBank delivered the unicorn round, and the company remains tied to the YC, HAX,
              SOSV, and Lerer Hippeau networks. Public scale signals reinforce the story. By 2026 Opentrons was claiming
              more than 10,000 deployed systems and installations across every top-20 U.S. research university and 14 of
              the top 15 global biopharma companies. Those are strong reach indicators, even if revenue conversion and
              utilization remain opaque.
