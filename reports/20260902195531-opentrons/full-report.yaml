  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market definition for Opentrons starts with the job to be done, not with the largest available
              lab-automation headline. Buyers use Opentrons to automate repetitive liquid handling, make protocols
              reproducible, connect software to instruments, and in some cases bridge into outsourced or remotely
              mediated execution. That means the core market includes benchtop automation hardware, protocol and control
              software, reusable workflow content, and selected service adjacencies that remove manual bench labor. It
              does not include every dollar of analytical instrumentation, hospital care delivery, or enterprise
              software inside life sciences. The practical substitutes are also narrower and more concrete than generic
              'competition': manual pipetting and spreadsheet coordination, partial workflow software without robotics,
              and legacy automation that many labs view as too expensive or too rigid. The cloud-lab literature and
              Opentrons' own public comments further widen the frame by showing that some labs may consume automation as
              a service rather than by owning every system outright. So the market is best viewed as layered, with a
              narrow liquid-handling core inside a broader automation and outsourced-workflow envelope.
