  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Public evidence shows Opentrons as a layered platform running from physical robot hardware up through protocol
      tooling and compliance software.
    data:
      layers:
        - label: Physical platform
          detail: OT-2 and Flex robots with deck, gantry, mounts, enclosure, and onboard controls
        - label: Motion + liquid-handling layer
          detail: Swappable pipettes, gripper, and robot movement primitives
        - label: Accessory layer
          detail: Thermocycler, temperature, heater-shaker, HEPA/UV, stacker, and other modules
        - label: Control layer
          detail: Touchscreen, Opentrons App, protocol execution, and multi-robot management
        - label: Developer layer
          detail: Python Protocol API, HTTP API, Jupyter/SSH, labware definitions, GitHub repos, PyPI package
        - label: Workflow assurance layer
          detail: Protocol Library, verified protocols, and 2026 CRS compliance controls
    claimRefs:
      - CE001
      - CE003
      - CE010
      - CE013
      - CE017
      - CE020
      - CE024
      - CE038
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      The user path starts with workflow selection and setup, moves through protocol authoring or import, and then
      compounds through accessories and compliance add-ons.
    data:
      nodes:
        - id: w1
          label: Choose workflow
          detail: NGS, extraction, purification, assay, or custom research task
        - id: w2
          label: Select robot + accessories
          detail: OT-2 or Flex plus pipettes, modules, labware, and gripper/stacker if needed
        - id: w3
          label: Author or import protocol
          detail: Use Protocol Library, Protocol Designer, Python API, or imported code
        - id: w4
          label: Run and monitor
          detail: Use app or touchscreen; advanced users may use Jupyter/SSH and logs
        - id: w5
          label: Expand / validate
          detail: Add modules, custom labware, or CRS for higher-assurance workflows
      edges:
        - from: w1
          to: w2
        - from: w2
          to: w3
        - from: w3
          to: w4
        - from: w4
          to: w5
    claimRefs:
      - CE010
      - CE012
      - CE013
      - CE015
      - CE016
      - CE024
      - CE025
      - CE034
