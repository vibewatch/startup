  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct, adjacent, and substitute competitors'
        blocks:
          - type: paragraph
            body: >-
              The first mistake in this market is treating every lab-automation company as a like-for-like hardware
              peer. Buyers are actually choosing across at least three layers. The first is liquid-handling hardware,
              where Hamilton, Tecan, Beckman, INTEGRA, FORMULATRIX, and Opentrons sit most directly. The second is
              orchestration and workflow software, where Synthace and Automata shape how experiments are designed,
              connected, and executed across heterogeneous devices. The third is the broader integration and
              autonomous-lab layer, where the real battle is increasingly about who owns the control plane, APIs, and
              data model rather than who sells the most precise pipetting head. That is why some companies show up as
              partners and competitors at the same time. Synthace integrates with Tecan, Hamilton, Beckman Echo, and
              FORMULATRIX. Automata sells its own hardware-linked LINQ platform but also pitches open connectivity. For
              Opentrons, the useful competitive frame is therefore layered: enterprise incumbents above it on scale and
              regulated maturity, specialist or affordable vendors beside it on narrower workflows, and orchestration
              vendors around it on software abstraction.
