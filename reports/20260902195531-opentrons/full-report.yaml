            body: >-
              Public retention data are almost nonexistent, so durability has to be inferred from behavior. The best
              signals are repeat orders, multi-year partner launches, and customers explaining that robots became part
              of everyday lab operations. Emory is the clearest example: three OT-2s integrated since 2018, daily use
              across assays, and later two more robots ordered. Northwestern describes the robot displacing manual
              glove-box plate setup entirely, while Gencove uses Opentrons at the front of a high-throughput sequencing
