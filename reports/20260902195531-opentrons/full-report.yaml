  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack and the laboratory jobs it serves
        blocks:
          - type: paragraph
            body: >-
              Opentrons delivers a layered lab-automation product, not a single benchtop robot. Public materials show
              two core robotic families in active use: OT-2 as the legacy low-cost liquid handler and Flex as the newer
              modular platform. Around those robots sits a practical operating surface that matters for adoption: the
              Opentrons App, touchscreen control on Flex, the open Protocol Library, interchangeable pipettes, accessory
              modules, and compatible labware. The core job-to-be-done is routine liquid handling, but the public
              workflow footprint is wider than basic transfer steps. Verified and community protocols span extraction,
              NGS prep, protein purification, ELISA, and cell-based assays. Flex adds newer capacity for gripper-based
              movement, higher-throughput accessories, and regulated-workflow controls. The right product view is
              therefore workflow-centric: Opentrons sells a programmable lab workstation whose value compounds when a
              lab standardizes protocols, accessories, and operator habits around it.
