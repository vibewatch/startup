      - CV027
      - CV028
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Current valuation reset
        - A new financing or tender clearly prices far below management’s implied internal mark
        - Collapses the argument that 2021 valuation can be carried forward with minor discounting
        - Re-underwrite to latest clean price and assume preference-stack pressure
      - - Weak recurring-economics proof
        - Management cannot show software/consumables attachment, retention, or gross-margin improvement
        - Turns platform thesis back into a hardware/workflow thesis
        - Cap entry multiple near public comp floor
      - - Regulated-workflow stall
        - CRS adoption remains narrative with no validated or referenceable accounts
        - Removes major bull-case path toward richer revenue quality
        - Treat Flex/CRS as strategic option, not realized de-risking
      - - Installed-base monetization gap
        - 10,000+ deployment claim does not translate into active fleet, repeat orders, or upgrades
        - Suggests brand reach without economic depth
        - Discount customer-proof arguments and tighten downside case
      - - Partner concentration
        - Merck or other channel relationships account for too much perceived traction without diversified sell-through
        - Raises dependence risk and weakens exit narrative
        - Require direct-customer expansion evidence before investing
    notes: These are monitorable events that should change price discipline, not abstract worries.
    claimRefs:
      - CV015
      - CV017
      - CV018
      - CV035
      - CV036
      - CV037
      - CV041
      - CV042
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited revenue bridge
        - FY2023-FY2025 revenue, growth, and gross margin by hardware, consumables, services, and software
        - Without this, any revenue multiple is mostly guesswork
        - CFO, auditor, board materials
      - - Late-2025 financing economics
        - Round documents, post-money valuation, share price, liquidation preferences, and option-pool changes
        - Determines whether the 2025 capital was supportive, flat, or a hidden reset
        - CFO, legal counsel, financing data room
      - - Installed-base quality
        - Active-robot counts, cohort usage, upgrade rates, and repeat-purchase behavior
        - Separates marketing reach from monetizable fleet economics
        - Ops dashboard, CRM cohorts, service data
      - - CRS and regulated pipeline
        - Reference accounts, attach rate, validation cycle time, and renewal data
        - Tests the main bull-case route toward richer revenue quality
        - Commercial leader, QA/regulatory, customer references
      - - Partner channel economics
        - Revenue share, sell-through, pipeline mix, and concentration by Merck/AAW or similar partners
        - Shows whether channel partnerships diversify or concentrate the business
        - BD lead, partner contracts, board reporting
      - - Cap table and secondaries
        - Current ownership, liquidation waterfall, 409A history, and any secondary price discovery
        - Essential for return math and employee/investor alignment
        - CFO, counsel, cap-table provider
    notes: All six asks are decision-critical; none can be safely inferred from public web materials.
    claimRefs:
      - CV005
      - CV006
      - CV035
      - CV039
      - CV040
      - CV041
      - CV042
