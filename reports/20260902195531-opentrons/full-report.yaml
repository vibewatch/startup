  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Opentrons typically lands on a concrete workflow, then expands only if the customer can operationalize protocols,
      accessories, or broader organizational use.
    data:
      nodes:
        - id: j1
          label: Discover need
          detail: Lab identifies repetitive manual pipetting, throughput, or teaching bottleneck
          tone: neutral
        - id: j2
          label: First robot / first protocol
          detail: OT-2 or Flex is bought for one assay, course, or workflow
          tone: neutral
        - id: j3
          label: Operationalization
          detail: Team calibrates, imports/writes protocols, and fits robot into daily lab process
          tone: neutral
        - id: j4
          label: Expansion
          detail: Customer adds more robots, modules, partner kits, or new workflows
          tone: positive
        - id: j5
          label: Durability test
          detail: Value depends on uptime, documentation, support, and whether use survives staff changes
          tone: risk
        - id: j6
          label: Renew / standardize
          detail: Robot becomes part of routine operations, curriculum, or partner-channel product
          tone: positive
