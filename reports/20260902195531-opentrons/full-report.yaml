        title: Sizing lenses, segment mix, and why boundary choice changes the number
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is directionally useful but not precise enough to collapse into one number. At the
              broadest level, 2026 lab-automation estimates from reviewed sources land between about $6.6 billion and
              $8.95 billion, with both publishers describing a market driven by throughput, digitization, robotics, and
              life-sciences research demand. A more relevant middle layer is liquid handling and modular lab automation,
              where one source projects a $5.10 billion market in 2025 growing to $7.48 billion by 2030, another places
              automated liquid handling at $4.49 billion in 2026, and a narrower estimate lands at $1.55 billion. These
              differences are not noise; they reflect different category boundaries. Some publishers include
              semi-automated systems, consumables, or broader laboratory workflow equipment, while others isolate
              automated platforms more narrowly. Adjacent outsourced-lab markets are much larger still, with laboratory
              products and outsourcing services above $50 billion in 2026 and pharma CRO or CDMO spending far larger
              than that. The key lesson for diligence is that Opentrons does not need the broadest TAM, but later
              valuation work must preserve the boundary logic behind every cited figure.
