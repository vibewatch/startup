        - 480-1080
        - Regulated discovery adoption, stronger repeat-purchase data, and visible recurring revenue attach
        - Gross margins or retention fail to improve despite platform broadening
      - - 2021 anchor test
        - >-
          To support $1.8B cleanly, Opentrons likely needs much higher revenue and/or software-style recurring metrics
          than public evidence shows today
        - 1800+
        - Audited revenue, retention, and margin data materially exceed external estimates
        - Any credible current round priced far below the unicorn anchor
    notes: >-
      Ranges are analyst estimates derived from public comp brackets and public revenue estimates; they are not
      management guidance.
