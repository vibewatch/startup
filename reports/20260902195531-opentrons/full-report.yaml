companyProfile:
  summary: >-
    Opentrons is a Brooklyn-based laboratory automation company founded in 2013 that built its reputation on affordable,
    programmable liquid-handling robots and then expanded into a broader product stack spanning Flex, OT-2, protocol
    software, open-source tooling, compliance-oriented features, and partner-packaged workflows. Its core thesis is
    democratized automation for research labs, with a later push toward higher-value regulated and enterprise-adjacent
    use cases.
  foundedDate: '2013-01-01'
  founders:
    - name: Will Canine
      role: Co-founder
      background: >-
        Early co-founder and company builder associated with the push to make automation affordable and usable for
        working biologists.
      claimRefs: []
    - name: Chiu Chau
      role: Co-founder
      background: >-
        Technical co-founder associated with the company’s original open-source automation vision and early robotics
        development.
      claimRefs: []
  foundingLocation: Brooklyn, New York, USA
  headquarters: Brooklyn, New York, USA
  productSummary: >-
    OT-2 and Flex robots anchored by software control, protocol tooling, labware and accessories, open-source developer
    surfaces, and newer compliance-ready features for more controlled workflows.
  customerFocus: >-
    Academic labs, biotech startups, biopharma companies, hospitals, government labs, and partner-distributed workflow
    buyers.
  businessModel: Hardware sales with software, protocol, consumables, accessory, and partner-workflow monetization layers.
  stage: late-stage private
