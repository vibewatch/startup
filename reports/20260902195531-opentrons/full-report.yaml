  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The top regulatory issue is fit-for-purpose validation, not an observed enforcement event. U.S. FDA Part
              11 rules require validated systems, controlled access, time-stamped audit trails, record retention,
              training, and documentation controls for regulated electronic records. Opentrons’ 2026 CRS launch is
              important because it directly acknowledges that regulated labs had a credibility gap with accessible
              automation. But CRS is explicitly scoped to non-GMP environments and still leaves SOPs, validation
              protocols, and data governance to the customer. That narrows the risk without removing it. The legal stack
              creates a second layer of exposure. Privacy and license terms contemplate data flows back to Opentrons for
              updates, error reports, and usage data; the EULA restricts reverse engineering and competitor-facing
              derivative use; and the sale terms sharply bound warranty coverage, liability, and timing of defect
              claims. None of this is unusual for hardware-plus-software vendors, but it matters more here because
              Opentrons sells openness and affordability to customers that may assume more flexibility or support
              coverage than the formal documents actually guarantee.
