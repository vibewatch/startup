      - number: '1.2'
        title: Founding window, headquarters, and company framing
        blocks:
          - type: paragraph
            body: >-
              Basic identity facts are public, but not perfectly clean. Multiple third-party profiles place Opentrons in
              Brooklyn and list 20 Jay Street as the supplier or company address, while recent official releases
              simplify the description to 'New York' and one 2024 launch release datelines the company from Long Island
              City. The practical conclusion is that Opentrons is clearly a New York City company, but the exact current
              operating address and headquarters wording vary by source. Founding-year evidence is similarly mixed.
              Tracxn and The Company Check say 2013; Inc and several narrative founder stories point to 2014; SOSV's
              founder profile reconciles the disagreement by showing Chiu Chau building the early robot in 2013, Will
              Canine becoming the first customer and then co-founder, and the team reaching HAX, Kickstarter, and later
              Y Combinator as the company took shape. Because the current official Opentrons pages do not foreground a
              canonical founding year, the most defensible diligence framing is a 2013-2014 founding window with 2013
              attached to pre-company prototyping and 2014 to the thesis, Kickstarter, and company-launch phase.
