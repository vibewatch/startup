    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Opentrons still frames its identity around democratizing lab automation for scientists who would otherwise
              spend too much time doing manual pipetting. The current homepage emphasizes fewer bottlenecks,
              reconfigurable hardware, and an open platform rather than a closed proprietary stack. The mission page and
              Y Combinator profile keep the older formulation intact: robots should free biologists from repetitive
              benchwork and create a shared protocol layer that improves reproducibility across labs. What has changed
              since the OT-2 era is scope. The 2024 and 2026 product-news stream shows a company that now sells not only
              benchtop liquid handlers but also protocol-authoring software, a protocol library, an automation
              marketplace, compliance-ready software for regulated environments, and AI-linked execution infrastructure.
              In other words, Opentrons is no longer best described as a single low-cost robot vendor. The stronger
              public description is an open laboratory automation platform whose core products are still the OT-2 and
              Flex, but whose commercial ambition now includes software, partner integrations, and an execution layer
              for AI-driven lab work.
