      - number: '3.4'
        title: Software, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The deeper competitive story is shifting upward from hardware into software, workflow reuse, and the cost
              of changing systems. Synthace and Automata matter because they show buyers do not have to accept the robot
              vendor as the permanent owner of experimental logic. Synthace markets design-of-experiments software and
              AI-ready data across multiple hardware brands, while Automata sells orchestration, browser-based
              management, SDKs, and open integration as first-class products. Recent autonomous-lab writing and SLAS
              2026 coverage reinforce the point: interoperability and control-plane ownership are becoming procurement
              questions, not just engineering afterthoughts. That creates both a moat and a risk for Opentrons. Its
              protocol library, open APIs, and compliance-ready add-ons are real differentiation points, but they are
              not invulnerable if competitors also claim openness or if customers decide to buy a separate orchestration
              layer above whichever robot they choose. In this category, lock-in comes from validated workflows,
              accessories, trained staff, and data connections far more than from the robot chassis itself. The right
              diligence view is that Opentrons has a credible competitive wedge, but not a durable monopoly on openness
              or flexibility.
