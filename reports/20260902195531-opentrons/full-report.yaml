  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Public comp sales multiples cluster far below the level implied by carrying forward the 2021 Opentrons unicorn
      valuation against common external revenue estimates.
    data:
      items:
        - label: Tecan implied sales multiple
          value: 2.7
          detail: 2.42B market cap / 882.48M 2025 revenue
        - label: Azenta implied sales multiple
          value: 2.3
          detail: 1.39B market cap / 593.82M FY2025 revenue
        - label: Standard BioTools implied sales multiple
          value: 3.1
          detail: 264.32M market cap / 85.33M 2025 revenue
        - label: Danaher implied sales multiple
          value: 6
          detail: 147.56B market cap / 24.57B 2025 revenue
        - label: Symbotic implied sales multiple
          value: 10.7
          detail: 24.11B market cap / 2.25B FY2025 revenue
        - label: Opentrons 2021 price / $80M revenue reference
          value: 22.5
          detail: 1.8B divided by midpoint of common external $40M-$80M range
    approximationNotes: >-
      All values are analyst calculations from cited public revenue and market-cap sources. Opentrons revenue reference
      is illustrative because audited public revenue is unavailable.
    claimRefs:
      - CV020
      - CV022
      - CV024
      - CV026
      - CV027
      - CV029
      - CV030
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Bear and base cases remain well below the 2021 unicorn anchor; only a stronger recurring-revenue outcome
      materially narrows the gap.
    data:
      items:
        - label: Bear case
          low: 60
          mid: 105
          high: 150
          detail: $40M-$60M revenue and 1.5x-2.5x sales
        - label: Base case
          low: 180
          mid: 290
          high: 400
          detail: $60M-$80M revenue and 3x-5x sales
        - label: Bull case
          low: 480
          mid: 780
          high: 1080
          detail: $80M-$120M revenue and 6x-9x sales
        - label: 2021 disclosed anchor
          low: 1800
          mid: 1800
          high: 1800
          detail: Last public primary valuation; shown as reference, not validated fair value
    approximationNotes: >-
      Scenario ranges are analyst estimates anchored to public comps and publicly discussed external revenue estimates.
      They should be replaced by data-room evidence before any investment decision.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV038
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: The chapter is driven less by headline brand recognition than by a handful of missing valuation-critical metrics.
    data:
      items:
        - label: Last disclosed primary valuation
          value: $1.8B
          note: September 2021 Series C
        - label: Late-2025 financing activity
          value: 'Yes'
          note: Tracxn follow-on plus Dec. 5, 2025 Form D
        - label: Current public post-money disclosed?
          value: 'No'
          note: No clean later primary valuation found in this review
        - label: Installed base claim
          value: 10,000+ systems
          note: Official 2026 company claim
        - label: Public comp band
          value: ~2x-6x sales
          note: Tecan/Azenta/Standard BioTools/Danaher bracket; Symbotic is richer outlier
        - label: Adverse secondary signal
          value: $136.5M
          note: Low-transparency dashboard mark; cautionary, not decisive fair value
    approximationNotes: >-
      KPI strip mixes disclosed facts with valuation context. The adverse secondary signal is included as a monitor, not
      as a definitive fair-value conclusion.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV010
      - CV015
      - CV028
      - CV042
