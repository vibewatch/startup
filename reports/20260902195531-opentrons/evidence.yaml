evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-completeness
    missingEvidence: A full current board roster and committee map sourced from Opentrons or a primary filing.
    whyItMatters: >-
      Governance visibility is limited even though the company has raised a large amount of private capital and changed
      CEOs.
    diligencePath: >-
      Request the current board list, observer rights, and any committee structure directly from management or from the
      latest investor materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount-and-revenue
    missingEvidence: A management-confirmed current employee count and current revenue run-rate or audited revenue.
    whyItMatters: Directory estimates conflict, and capital intensity cannot be judged cleanly without scale metrics.
    diligencePath: >-
      Request current headcount by function, 2025 revenue, 2026 YTD revenue, and any ARR or hardware-versus-services mix
      from management.
    relatedQuestionRefs:
      - QO022
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: >-
      The price, terms, and post-money valuation of the 2025 financing activity or any later secondary marks from
      primary holders.
    whyItMatters: >-
      The gap between the 2021 unicorn valuation and later secondary-market skepticism is one of the central
      underwriting uncertainties.
    diligencePath: >-
      Obtain the 2025 round documents, 409A history, cap table, and any institutional fair-value marks from current
      investors.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO024
    relatedTableRefs:
      - TO001
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: >-
      A primary-source corporate history that states the exact founding date and distinguishes prototype work from legal
      incorporation.
    whyItMatters: Public sources split between 2013 and 2014, which can distort milestone timing and investor-history narratives.
    diligencePath: >-
      Confirm the legal incorporation date, first commercial shipment date, and management-designated founding year with
      the company.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: partial-enumeration
    missingEvidence: >-
      A fuller public roster of all current directors, advisors, and all material investors beyond the most visible
      names.
    whyItMatters: >-
      The chapter intentionally prioritizes the most relevant people and investors, but it does not claim exhaustive
      coverage.
    diligencePath: >-
      Expand the roster from investor materials, cap-table documents, and any board-consent or governance summaries
      during live diligence.
    relatedQuestionRefs:
      - QO009
      - QO015
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: serviceable-market-size
    missingEvidence: >-
      A public source that isolates the market for affordable programmable benchtop liquid handling with meaningful
      software or compliance overlays.
    whyItMatters: >-
      Without a price-tier and workflow-specific denominator, SAM and SOM estimates remain heuristic rather than
      investable market math.
    diligencePath: >-
      Request segmented win-loss data, price-band market studies, and internal pipeline splits by customer type, budget
      owner, and validation requirement.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-boundary-disagreement
    missingEvidence: >-
      A reconciled explanation from publishers or primary buyers for why automated liquid handling ranges from roughly
      $1.55 billion to $4.49 billion or more in 2026.
    whyItMatters: Boundary slippage can produce large valuation differences if investors mix incompatible TAM lenses.
    diligencePath: >-
      Normalize category definitions across reports and map them to Opentrons product modules, pricing tiers, and
      customer segments before using them in comp work.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-conversion
    missingEvidence: >-
      Evidence showing how often apparent demand converts into paid fleet deployments, software attach, consumables
      pull-through, or outsourced-services revenue by segment.
    whyItMatters: Large TAMs do not matter if adoption stalls at pilot scale or remains concentrated in low-ACV use cases.
    diligencePath: >-
      Request cohort conversion data from first robot sale to expansion, plus software, services, and consumables attach
      rates.
    relatedQuestionRefs:
      - QM010
      - QM016
  - type: missing-source
    severity: important
    topic: academic-budget-timing
    missingEvidence: >-
      A cleaner public dataset linking 2026 NIH obligation slowdowns to capital-equipment purchasing behavior in
      university and translational labs.
    whyItMatters: Academic demand may remain structurally large while near-term purchasing pauses distort pipeline timing.
    diligencePath: >-
      Compare university procurement cycles, core-facility budgets, and grant-award timing against Opentrons academic
      pipeline data.
    relatedQuestionRefs:
      - QM019
      - QM026
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: material
    topic: like-for-like-enterprise-pricing
    missingEvidence: >-
      Public, current, apples-to-apples configured pricing for Hamilton, Tecan, and Beckman systems with comparable
      modules, software, and service terms.
    whyItMatters: >-
      Without configuration-matched quotes, price comparisons remain directional and can overstate or understate the
      true affordability gap.
    diligencePath: >-
      Request vendor quotes for matched NGS, extraction, and general liquid-handling bundles including software and
      service.
    relatedQuestionRefs:
      - QP010
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: important
    topic: benchmarked-throughput-comparison
    missingEvidence: >-
