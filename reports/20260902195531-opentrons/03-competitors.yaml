  title: Pricing / packaging comparison
  columns:
  - Vendor / platform
  - Public price or contract model
  - Included capabilities
  - Unknowns / limits
  - Implication
  rows:
  - - Opentrons Flex
    - $24,950 starting price publicly listed; installation required
    - Base robot plus configurable pipettes, app and API control; modular add-ons
    - Final quote still varies by modules, territory, and services
    - Lowest-friction initial price signal in the peer set
  - - Hamilton STAR V
    - Quote required; LabX cites roughly $100K-$200K+
    - Enterprise hardware, integration breadth, VENUS software context
    - Actual configured pricing and service bundle undisclosed
    - High entry barrier but enterprise fit for complex labs
  - - Tecan Fluent
    - Quote required; six-figure range discussed in independent comparisons
    - Large-deck hardware, FluentControl, regulated options, device integrations
    - Like-for-like quote hard to benchmark publicly
    - Competes on capability, not transparent price
  - - Beckman Biomek i7
    - Quote required; six-figure range discussed in independent comparisons
    - Configurable workstation, software, compliance support, application kits
    - Public pricing absent and official product page text partly gated
    - Likely enterprise-capex sale rather than impulse purchase
  - - INTEGRA ASSIST PLUS
    - Public list price not identified in reviewed sources
    - Robot reuses installed pipettes and automates routine tasks
    - Configuration and accessory pricing not surfaced here
    - Potentially attractive for routine workflows without full platform switch
  - - FORMULATRIX systems
    - Public list price not identified in reviewed sources
    - Specialist dispensers and liquid handlers with specific low-volume strengths
    - System-specific pricing and service model not surfaced here
    - Can win niche workflows despite thinner public pricing visibility
  - - Automata / Synthace
    - Bundled solution or subscription-style discussion; quote only
    - Orchestration, workflow software, integrations, support
    - Total cost depends on workcell scope, seats, and integrations
    - May be bought alongside hardware rather than instead of it
  notes: Public pricing evidence is asymmetrical and strongest for Opentrons; most other platforms force a quote-driven procurement path.
