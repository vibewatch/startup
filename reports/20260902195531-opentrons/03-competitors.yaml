- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Affordable transparency
    - INTEGRA and specialists can still undercut narrow workflows; enterprise buyers may not care about list price
    - medium
    - Quantify win rates by budget band and workflow complexity
  - - Open integration
    - Rivals now also market open architecture, open platforms, APIs, and orchestration layers
    - high
    - Separate real integration effort from marketing language in proof-of-concept deals
  - - Protocol library and workflow reuse
    - Vendor-agnostic software layers can abstract hardware differences over time
    - high
    - Measure whether protocol reuse drives retention or whether logic moves into third-party software
  - - Regulated discovery wedge
    - Incumbents already have deeper validation history and broader service networks
    - high
    - Request evidence of CRS adoption, validation timelines, and competitive replacements
  - - Low-friction adoption
    - Custom-code burden can turn openness into customer work and services risk
    - medium-high
    - Track time-to-first-run, time-to-integration, and support hours by deployment type
  notes: The moat question is less about raw pipetting precision and more about how much buyer pain Opentrons removes relative to the alternatives.
