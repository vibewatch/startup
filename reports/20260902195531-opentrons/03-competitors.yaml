  rows:
  - - Hamilton Microlab STAR V
    - Enterprise hardware
    - Private incumbent; 75+ years and 3,000+ employees per IntuitionLabs/Hamilton framing
    - Pharma, diagnostics, high-throughput genomics, integrated workcells
    - High throughput, broad device integration, CO-RE II, MagPip, large-deck flexibility
    - Quote-only pricing and higher-complexity enterprise motion
  - - Tecan Fluent
    - Enterprise hardware
    - Public Swiss incumbent; CHF 934M 2024 sales cited by IntuitionLabs
    - Pharma, biotech, clinical, regulated labs
    - Open architecture, multiple arms, FluentControl, Fluent Gx, high walkaway capacity
    - Quote-driven procurement and enterprise-style implementation complexity
  - - Beckman Biomek i-Series / i7
    - Enterprise hardware
    - Danaher operating company with broad life-sciences installed base
    - Mid- to high-throughput genomics, drug discovery, regulated workflows
    - Open-platform design, configurable heads, compliance support, workflow breadth
    - Public text access to product specifics is partly hindered by bot-gated pages
  - - Opentrons Flex
    - Accessible hardware
    - Private venture-backed platform; public starting price
    - Academic, startup, biotech, price-sensitive research and emerging regulated discovery
    - Price transparency, modularity, open APIs, touchscreen/app workflow, growing compliance story
    - Lower enterprise maturity and more customer-side integration work in some cases
  - - INTEGRA ASSIST PLUS
    - Routine benchtop automation
    - Established pipetting vendor extending installed pipette base
    - Routine assay setup, serial dilutions, reformatting, small to mid-size labs
    - Affordable automation using existing VIAFLO/VOYAGER pipettes
    - Not a full multi-instrument workcell platform
  - - FORMULATRIX FLO i8 / Mantis
    - Specialist hardware
    - Private specialist vendor focused on research automation niches
    - Miniaturized assays, low-volume dispensing, flexible bench automation
    - Positive displacement, ultra-low-volume dispensing, open API, reagent efficiency
    - Narrower workflow scope than large enterprise decks
  - - Automata LINQ
    - Hardware + orchestration
    - Growth-stage automation platform; software-defined positioning
    - Labs wanting configurable workcells and cloud-native orchestration
    - Browser-based orchestration, SDKs, API integrations, AI-linked run management
    - Custom full-solution sale rather than transparent list-price instrument purchase
  - - Synthace
    - Orchestration software
    - Software-first automation and DOE platform
    - Drug discovery teams with heterogeneous instruments
    - Vendor-agnostic workflow layer, data standardization, DOE and training services
    - Depends on existing hardware and customer willingness to buy another software layer
  notes: Rows separate true large-deck hardware incumbents from accessible hardware plays and orchestration-layer vendors so the buyer does not confuse very different products.
