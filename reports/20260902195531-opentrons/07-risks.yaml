- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Support / quality scaling risk
    - Onboarding failure and support queue trend
    - Return rate rises, repeat-purchase rate falls, or support SLA materially degrades
    - Pause bullish underwriting until active-fleet quality data improves
  - - Regulated-conversion risk
    - CRS validation and renewal evidence
    - No credible validated customer references or slow/no August-2026 onward adoption
    - Treat CRS as narrative rather than de-risking product
  - - Partner concentration risk
    - Merck sell-through and partner revenue share
    - One partner dominates growth or partner program stalls
    - Discount channel multiple and require diversification plan
  - - Valuation / financing risk
    - Next financing terms or secondary marks
    - Down-round, punitive preferences, or large further markdown vs 2021 anchor
    - Underwrite dilution and reset return thresholds
  - - Competitive upmarket risk
    - Win/loss reasons in regulated or enterprise deals
    - Losses consistently cite reliability, service depth, or validation comfort
    - Assume gross-margin and ASP upside will be slower than plan
  notes: Kill criteria are framed as observable operating or financing events rather than narrative concerns.
