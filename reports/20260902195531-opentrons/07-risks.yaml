  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-roster
    missingEvidence: Complete history of lawsuits, regulator inquiries, field corrective actions, recalls, and major warranty disputes involving Opentrons products.
    whyItMatters: The public web surface is not sufficient to conclude that legal or quality incident history is clean.
    diligencePath: Run court-docket, regulator, and insurance-claims diligence and request internal CAPA / return logs.
    relatedQuestionRefs:
    - QR026
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: active-fleet-quality
    missingEvidence: Field failure rate, return rate, mean-time-to-repair, and support burden by robot generation, module, geography, and customer segment.
    whyItMatters: This is the single best way to test whether accessibility scales into durable enterprise-quality adoption.
    diligencePath: Request service and RMA dashboard, failure-code distribution, and cohort uptime metrics.
    relatedQuestionRefs:
    - QR008
    - QR009
    - QR030
  - type: private-evidence-only
    severity: material
    topic: regulated-conversion
    missingEvidence: Validated CRS customer count, time-to-go-live, renewal rate, and regulated win/loss reasons.
    whyItMatters: CRS is a major strategic mitigation, but its commercial and compliance conversion value is not yet public.
    diligencePath: Request reference accounts, validation evidence, pipeline conversion, and churn reasons for regulated prospects.
    relatedQuestionRefs:
    - QR003
    - QR023
    - QR030
  - type: private-evidence-only
    severity: material
    topic: partner-channel-economics
    missingEvidence: Sell-through, margins, revenue share, support load, and concentration across Merck and any other OEM/partner channels.
    whyItMatters: A credible channel can de-risk growth or hide concentrated dependence; the economics determine which.
    diligencePath: Request partner P&Ls, pipeline reports, and contract summaries with support obligations.
    relatedQuestionRefs:
    - QR015
    - QR024
    - QR030
  - type: private-evidence-only
    severity: material
    topic: financing-resilience
    missingEvidence: Current cash, burn, runway, debt or preference overhang, and contingency plan if future fundraising occurs below prior valuation anchors.
    whyItMatters: Valuation opacity becomes a real risk only when combined with short runway or punitive financing structures.
    diligencePath: Request board deck, financing plan, cap table preferences, and scenario analysis under flat or down-round outcomes.
