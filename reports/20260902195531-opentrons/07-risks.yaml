tables:
- id: TR001
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: partial
    basis: Covers the material regulatory and contractual risks recoverable from public legal pages, legal PDFs, product disclosures, and current regulatory texts. It does not replace formal docket, CAPA, or customer-contract review.
  columns:
  - Rule / license / case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - 21 CFR Part 11 / closed-system controls
    - U.S. FDA-regulated environments
    - Applies where customers rely on electronic records and signatures
    - medium
    - critical
    - CRS adds audit-trail, access-control, and record-integrity tooling on Flex
    - high because CRS is non-GMP and customer validation remains required
    - Request validated customer deployments, IQ/OQ/PQ or CSA packages, and QA references for CRS accounts
  - - OT-2 / base-platform regulated-use gap
    - Clinical, GMP, and contamination-sensitive contexts
    - OT-2 is not certified/validated for IVD or GMP and is not itself a sterile environment
    - medium
    - high
    - Flex accessories and CRS narrow fit gap for some use cases
    - medium-high because legacy installed base may not translate into regulated conversions
    - Request segment split of OT-2 vs Flex in regulated pipeline and reasons for loss to incumbents
  - - Data privacy / usage-data transmission
    - Cross-border / customer data governance
    - Privacy policy and EULA contemplate collection, sharing, international transfer, and automatic product communications
    - medium
    - high
    - Privacy policy, customer agreements, and local data retention on CRS are partial mitigants
    - medium because enterprise and regulated customers may require stricter DPA and data-flow clarity
    - Review DPA, subprocessors, telemetry controls, retention windows, and customer opt-out posture
  - - Warranty and liability limitations
    - Commercial contracting
    - Terms of sale cap warranty duration, impose timing/usage conditions, and shift many responsibilities to buyer
    - high
    - medium-high
    - Published warranty and support process create a clear formal framework
    - medium because support expectations may exceed the narrow legal remedy
    - Review actual MSA/SOW deviations, return rates, and whether enterprise accounts negotiate stronger coverage
  - - IP / license restrictions versus open-customization expectations
    - Commercial software and integration use
    - EULA permits open-source components but restricts reverse engineering, bypassing protections, and competitive derivative works
    - medium
    - medium
    - Open-source notices and public repositories give some flexibility
    - medium because advanced customers may still hit gray zones around modification or competitive reuse
    - Review top customer integration patterns and any disputes over custom code or shared workflows
  notes: Rows are ordered by how directly the risk can block enterprise or regulated expansion, not by legal novelty.
