companyProfile:
  summary: Opentrons is a Brooklyn-based laboratory automation company founded in 2013 that built its reputation on affordable, programmable liquid-handling robots and then expanded into a broader product stack spanning Flex, OT-2, protocol software, open-source tooling, compliance-oriented features, and partner-packaged workflows. Its core thesis is democratized automation for research labs, with a later push toward higher-value regulated and enterprise-adjacent use cases.
  foundedDate: '2013-01-01'
