  productSummary: OT-2 and Flex robots anchored by software control, protocol tooling, labware and accessories, open-source developer surfaces, and newer compliance-ready features for more controlled workflows.
  customerFocus: Academic labs, biotech startups, biopharma companies, hospitals, government labs, and partner-distributed workflow buyers.
  businessModel: Hardware sales with software, protocol, consumables, accessory, and partner-workflow monetization layers.
  stage: late-stage private
