  topStrengths:
  - Strong brand and installed-base reach in affordable lab automation, with 2026 official claims of more than 10,000 deployed systems.
  - Product surface is broader than a single robot, spanning Flex, OT-2, software, protocols, modules, and newer compliance-oriented layers.
  - Continued investor activity into late 2025 shows the company remained financeable after the 2021 unicorn round.
  - Merck partnership, AAW workstation packaging, and CRS provide a plausible path toward richer workflow monetization.
  - Open-source and affordability positioning still create a differentiated wedge against many legacy incumbents.
  topRisks:
  - No public audited revenue, gross margin, retention, or cap-table detail to support a precise valuation call.
  - Current pricing is opaque; the last disclosed primary valuation is from 2021, while thin secondary-style dashboards imply much lower marks.
  - Hardware and services exposure may justify lower multiples than software-style automation narratives suggest.
  - Public evidence of regulated-workflow conversion remains newer and thinner than the installed-base story.
  - Late-2025 financing terms, liquidation preferences, and dilution impact are not publicly clear.
  unresolvedGaps:
  - Audited revenue bridge by hardware, software, services, and consumables.
  - Current post-money valuation, share price, and liquidation waterfall.
  - Active-fleet utilization, repeat-purchase behavior, and upgrade rates.
  - CRS adoption, renewal, and regulated customer referenceability.
  - Partner-channel sell-through and revenue concentration economics.
