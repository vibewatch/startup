- id: trust-quality-and-compliance-controls
  title: Trust, quality, and compliance controls
  body: Trust in this category comes from a mix of hardware quality, software controls, and how clearly the vendor defines what the product does not yet guarantee. Opentrons is relatively explicit on both sides. OT-2 lists mainstream equipment and quality certifications, but also says it is not itself a sterile environment and is not validated for IVD or GMP use. Flex pushes farther up the trust stack through accessory contamination controls and through Compliance Ready Software, which adds authentication, role-based access, signed audit trails, and system-level electronic-record integrity for Part 11-oriented non-GMP workflows. Importantly, Opentrons does not claim CRS alone solves validation; the product page says customer SOPs, validation protocols, and data-management practices still matter. That is the correct framing. Public evidence supports a credible quality-and-compliance wedge for research and preclinical environments, but not a blanket claim that the platform is turnkey for every
    regulated lab.
