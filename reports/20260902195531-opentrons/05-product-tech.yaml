- id: software-architecture-and-open-platform
  title: Software architecture, extensibility, and the open platform thesis
  body: The differentiator most consistently visible in public evidence is software openness. Opentrons documentation ties the robot experience together through a Python Protocol API, app control, protocol-design tooling, robot-server and HTTP APIs, shared labware definitions, and public source code on GitHub. The docs are unusually explicit about repository layout, release distribution, and advanced operations such as SSH, Jupyter, and direct package installation. That transparency matters because it lowers the cost of customization for capable labs and has enabled a visible long tail of community protocols, hardware modifications, and academic extensions. It also creates a structural trade-off versus legacy enterprise automation. Opentrons shifts more agency to the end user, which is a strength for research labs that want flexibility, but can become an implementation burden in labs that expect turnkey validation, fixed applications, or vendor-owned integration work. The platform is open
    in a technically meaningful way, but not frictionless. That distinction shows up clearly in the documentation.
