- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Opentrons solution
  - Measurable benefit
  - Limitation
  rows:
  - - Routine liquid transfers
    - Manual or semi-manual pipetting
    - OT-2 or Flex with protocol execution
    - Lower hands-on time and better reproducibility
    - Base robot still needs calibration, labware setup, and protocol logic
  - - NGS and extraction prep
    - Kit-specific repetitive pipetting
    - Protocol Library plus modules and verified workflows
    - Faster onboarding via reusable protocols
    - Protocol coverage does not prove every lab can validate immediately
  - - Protein purification / ELISA / cell assays
    - Bench workflows with repetitive wash/incubation steps
    - Flex with modules and app/API control
    - Consistent step timing and easier scale-up
    - Some workflows need add-on modules or custom labware support
  - - Higher-throughput plate and tip handling
    - Manual restocking or transfers
    - Flex Gripper and Stacker
    - Less operator intervention and better deck economy
    - Older Flex units may need upgrades for newer accessories
  - - Regulated preclinical or discovery runs
    - Manual logging or enterprise-grade alternatives
    - Flex + CRS
    - Audit trail and access control on lower-cost platform
    - Customer must still supply SOPs and validation evidence
  - - Specialized research automation
    - Highly custom academic setups
    - Python API, SSH/Jupyter, open hardware docs
    - Strong extensibility for novel methods
    - Customization burden shifts to technically capable users
  notes: Benefits are workflow-level and qualitative because public sources do not provide broad independent benchmark datasets for every use case.
