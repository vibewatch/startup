chapter:
  number: 5
  title: Product & Technology
  summary: 'Opentrons'' product stack is broader and more technically mature than a cheap-liquid-handler caricature suggests. Public evidence supports a real platform view: OT-2 and Flex hardware, swappable pipettes and modules, the Opentrons App, Python and HTTP APIs, an open protocol ecosystem, and a 2026 compliance layer for regulated R&D. The deepest moat is not proprietary chemistry or a closed workflow, but accessible automation plus an unusually open developer surface. That openness is also the main technical risk: advanced use cases often rely on custom protocols, custom labware, or third-party modifications, so product success depends on documentation quality, integration discipline, and customer technical capacity as much as on robot hardware itself.'
sections:
- id: product-stack-and-user-jobs
  title: Product stack and the laboratory jobs it serves
  body: 'Opentrons delivers a layered lab-automation product, not a single benchtop robot. Public materials show two core robotic families in active use: OT-2 as the legacy low-cost liquid handler and Flex as the newer modular platform. Around those robots sits a practical operating surface that matters for adoption: the Opentrons App, touchscreen control on Flex, the open Protocol Library, interchangeable pipettes, accessory modules, and compatible labware. The core job-to-be-done is routine liquid handling, but the public workflow footprint is wider than basic transfer steps. Verified and community protocols span extraction, NGS prep, protein purification, ELISA, and cell-based assays. Flex adds newer capacity for gripper-based movement, higher-throughput accessories, and regulated-workflow controls. The right product view is therefore workflow-centric: Opentrons sells a programmable lab workstation whose value compounds when a lab standardizes protocols, accessories, and operator habits
    around it.'
