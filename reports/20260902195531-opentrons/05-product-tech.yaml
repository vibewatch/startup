- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Robot hardware (OT-2 / Flex)
    - Executes physical pipetting and movement
    - Mechanical calibration, modules, pipettes, deck layout
    - Hardware limits or sensing gaps can surface in edge workflows
  - - Pipettes / gripper / modules
    - Adds liquid range, movement, thermal, clean-air, and plate-handling functions
    - Accessory compatibility and firmware/software support
    - Portfolio complexity and cross-generation compatibility gaps
  - - Opentrons App + touchscreen
    - Operator control, setup, and run management
    - Host computer for app, onboard screen for Flex
    - UI changes and multi-robot management can affect deployment consistency
  - - Python Protocol API / Protocol Designer
    - Workflow authoring surfaces
    - Documentation quality and versioning
    - Power users can succeed; novices may hit complexity cliffs
  - - Robot server / HTTP API / shared data
    - Execution and machine control backbone
    - Versioned software stack, release discipline, labware definitions
    - Breakage or undocumented changes can disrupt custom integrations
  - - GitHub / PyPI / community repos
    - Developer distribution and extension layer
    - Maintainer cadence and community health
    - Openness raises support expectations and exposes rough edges quickly
  notes: The architecture table focuses on dependencies that can affect implementation or reproducibility, not only on feature marketing.
