- id: durability-expansion-and-support-realities
  title: Durability, expansion, and support realities
  body: 'Public retention data are almost nonexistent, so durability has to be inferred from behavior. The best signals are repeat orders, multi-year partner launches, and customers explaining that robots became part of everyday lab operations. Emory is the clearest example: three OT-2s integrated since 2018, daily use across assays, and later two more robots ordered. Northwestern describes the robot displacing manual glove-box plate setup entirely, while Gencove uses Opentrons at the front of a high-throughput sequencing pipeline. These are stronger than vanity-logo evidence because they imply operational dependence. But the public record is not uniformly positive. Customer-review evidence and some official interviews show calibration friction, occasional software instability, connectivity issues, and the need for support involvement during setup. That is not unusual for automation hardware, but it matters because Opentrons sells accessibility. If onboarding is smooth only for highly technical
    labs, expansion quality could be narrower than the brand suggests.'
