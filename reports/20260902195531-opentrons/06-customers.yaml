- id: concentration-gaps-and-underwriting-limits
  title: Concentration risk, channel exposure, and remaining underwriting gaps
  body: The main underwriting problem is not lack of customer evidence; it is lack of economic resolution. Public sources show many credible users, but almost never reveal contract size, renewal status, usage intensity, or what portion of revenue comes from a handful of strategic accounts. Merck is clearly important, yet public sources do not show whether partner channels dominate incremental growth or simply complement direct sales. Review aggregators and case-study directories further support breadth, but they should not be mistaken for proof of durable ARR. The same issue applies to marquee academic names in launch materials. Argonne, Mayo Clinic, Harvard, MIT, and University of Michigan are strategically meaningful references, but public evidence does not fully distinguish pilot, research-tool, curriculum, or scaled fleet relationships. The safest verdict is that Opentrons has achieved broad adoption and enough named proof to validate relevance, while the critical diligence work still
    lies in revenue concentration, fleet activeness, renewal quality, and how often first robot purchases expand into recurring multi-system accounts.
