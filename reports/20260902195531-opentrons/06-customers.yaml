  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-roster
    missingEvidence: Full enumeration of named Opentrons customers with deployment status, contract scale, and whether each logo represents pilot, curriculum use, research-tool use, or scaled production adoption.
    whyItMatters: Public customer stories prove relevance, but they do not show how representative the listed accounts are of the broader installed base or revenue mix.
    diligencePath: Request complete named-customer roster with segment, geography, deployment status, spend band, and expansion history for the accounts behind top-university and top-biopharma claims.
    relatedQuestionRefs:
    - QU005
    - QU020
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: revenue-concentration
    missingEvidence: Top-customer concentration, spend bands, and share of revenue from partner channels versus direct customers.
    whyItMatters: Broad adoption can still hide fragile economics if a few channels or institutions drive most revenue.
    diligencePath: Request customer revenue concentration table, partner revenue share, and top-20 account expansion history.
    relatedQuestionRefs:
    - QU020
    - QU025
  - type: private-evidence-only
    severity: material
    topic: cohort-retention
    missingEvidence: NRR, GRR, churn, robot-return rates, and active-fleet retention by cohort or segment.
    whyItMatters: Public case studies show initial fit but do not prove durable recurring revenue or long-term satisfaction.
    diligencePath: Request cohort retention and active-robot metrics for OT-2, Flex, and module/software attach.
    relatedQuestionRefs:
    - QU012
    - QU016
    - QU025
  - type: private-evidence-only
    severity: material
    topic: fleet-activeness
    missingEvidence: Of the reported installed base, how many robots are actively used monthly and how usage intensity differs by segment.
    whyItMatters: Deployed systems are not equivalent to active customers or healthy recurring revenue.
    diligencePath: Request MAU/WAU-style robot activity, protocol runs per robot, and consumables reorder behavior.
    relatedQuestionRefs:
    - QU003
    - QU012
    - QU025
