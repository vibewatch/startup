- id: named-customer-proof-and-outcomes
  title: Named customer proof and what it says about production usage
  body: 'The named-customer record is strongest when a source describes a concrete workflow, an outcome, and whether usage is repeated rather than experimental. On that standard, Opentrons has better evidence than many early-stage hardware companies. Merck’s 2025 multi-year partnership and subsequent AAW workstation launch show partner-led commercialization for assay workflows. Emory, Northwestern, Gencove, DAMP Lab, and MilliporeSigma provide even more useful proof because they describe specific day-to-day usage: automated genotyping and blood processing, glove-box organic chemistry, saliva-to-sequencing preparation, fee-for-service biofoundry operations, and ELISA support. Education stories at Imperial College and Cold Spring Harbor show a different kind of durability: repeated curricular use, multiple student cohorts, and the platform becoming part of workforce training rather than a one-off demo. The main caveat is that production significance still varies. Some of these are mission-critical
    research workflows, some are curriculum and enablement cases, and some are partner channels that may matter more strategically than economically.'
