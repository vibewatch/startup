- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - First robot proves workflow value
    - Many accounts may stop at a single low-ARPA instrument
    - Installed-base breadth may overstate revenue depth
    - Request distribution of robots per account and module/software attach by cohort
  - - Partner channels such as Merck
    - A few strategic partners could dominate growth narrative
    - Channel shifts or weak sell-through could hit expectations quickly
    - Request partner revenue share, pipeline, and sell-through metrics
  - - Academic ecosystem and protocol sharing
    - High logo density may monetize weakly
    - Great awareness may not equal durable gross margin
    - Request account-level annual spend and consumables reorder behavior
  - - Move up-market with Flex and CRS
    - Validation-heavy customers may have slower sales cycles and lower conversion than research labs
    - Growth mix could lag the product roadmap
    - Request pipeline stage conversion and time-to-go-live for CRS-enabled deals
  - - Review/community enthusiasm
    - Happy power users can mask pain among low-technical-support customers
    - Expansion quality may bifurcate by technical sophistication
    - Request segmentation of support load, returns, and renewals by customer type
  notes: The central customer risk is not demand scarcity but uncertain conversion of broad usage into concentrated, durable, high-quality revenue.
