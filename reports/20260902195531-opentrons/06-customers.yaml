- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - Merck / MilliporeSigma
    - Partner + biopharma
    - Custom Flex workstations and AAW automated assay platform
    - Commercialized partner channel
    - Verified workflows, plug-and-play positioning, mid-2025 ordering and July 2025 launch
    - Public sources do not show actual sales volume or renewal quality
  - - Emory University Yerkes National Primate Research Center
    - Academic research
    - Automated genotyping, sequencing, immunological assays, and blood processing with OT-2 fleet
    - Production / daily lab operations
    - Three OT-2s in lab, later two more ordered, throughput scaled to otherwise unrealistic levels
    - Economic value to Opentrons per lab is undisclosed
  - - Northwestern University
    - Academic research
    - Glove-box organic chemistry and high-throughput photoredox workflows on OT-2
    - Production research workflow
    - Throughput improved from roughly one 96-well day to 300 reactions/day with better safety
    - Single-lab story; not necessarily generalizable
  - - Gencove
    - Startup genomics platform
    - Automated saliva handling at front of sequencing pipeline
    - Production pipeline component
    - Two people process 400-500 samples/day with OT-One S as first step
    - Older robot generation and startup economics may differ from present mix
  - - MilliporeSigma / Annabel Shang
    - Biopharma / reagent R&D
    - ELISAs and purity testing on OT-2
    - Repeated operational use
    - About two hours saved per assay with higher accuracy and fewer repeats
    - Also reported calibration issue requiring sensor replacement
  - - Imperial College London
    - Education + academic research
    - OT-2 and Flex used in chemistry curriculum and autonomous-workflow research
    - Repeated curricular usage
    - Multiple courses, multiple student cohorts, and student-to-robot ratios disclosed
    - Strategically useful but not obviously large-ticket revenue
  - - Cold Spring Harbor Laboratory DNALC
    - Education / community science
    - OT-2 for internships, DNA barcoding, and biocoding camp workflows
    - Repeated programmatic use
    - Students and interns automate real tasks, including hundreds of sample-tube conversions
    - Education proof does not by itself prove enterprise monetization
  notes: Rows prioritize workflow-specific customer proof over logos alone; the economic significance of each deployment still varies materially.
