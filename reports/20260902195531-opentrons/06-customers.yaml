tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Academic research labs
    - PI or core buys; researchers use; grant/department pays
    - Sequencing, sample prep, organic chemistry, biofoundry, proteomics
    - Strong named proof across Emory, Northwestern, DAMP, Dana-Farber, Gencove-adjacent research
    - Important installed-base and protocol-creation engine
    - Public spend per lab and expansion rates are not disclosed
  - - Teaching and workforce-training labs
    - Educator or program lead buys; students use; institution pays
    - Hands-on automation instruction, coding, chemistry, DNA barcoding
    - Imperial, DNALC, and NCSU offer detailed deployment stories
    - High strategic value for future user acquisition and brand imprinting
    - Often strategically important but not obviously large-ticket revenue
  - - Biopharma / biotech R&D
    - Procurement or assay teams buy; scientists and technicians use; enterprise budget pays
    - ELISA, assay automation, sample prep, discovery workflows
    - Merck/MilliporeSigma, BioMarin, and company-wide top-biopharma claims
    - Potentially highest-value commercial segment
    - Named logo evidence exceeds public contract-value detail
  - - Partner / OEM channel
    - Partner organization buys and repackages; end lab uses; partner budget or end-customer budget pays
    - Custom or plug-and-play workstations and assay kits
    - Merck partnership and AAW workstation are the clearest examples
    - Can accelerate distribution and trust
    - Partner margin structure and concentration are private
  - - Clinical / public-health-adjacent labs
    - Operations leads buy; technicians use; institutional/public budget pays
    - COVID testing, genomics, regulated preclinical-adjacent workflows
    - Historical PRL context plus case-list references and CRS messaging
    - Expands TAM and validates more demanding workflows
    - Current active customer list and regulatory depth remain unclear
  - - Startup platforms / service labs
    - Founder or technical lead buys; small team uses; startup budget pays
    - Sequencing, remote biofoundry, custom pipelines
    - Gencove and DAMP provide concrete examples
    - Helpful proof that low-cost automation lands in resource-constrained environments
    - Startup logos may be high-usage but low-ARPA
  notes: Segments distinguish who buys from who uses because procurement and adoption behavior differ sharply across lab types.
