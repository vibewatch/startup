company:
  name: Opentrons Labworks
chapter:
  number: 6
  title: Customers
  summary: 'Public customer evidence suggests Opentrons has genuine breadth across academia, biotech, pharma, education, and some public-health or clinical-adjacent workflows, but the quality of proof varies widely by segment. The strongest evidence is not logos alone; it is workflow-specific customer testimony showing repeat use, expansion, or measured productivity gains. That evidence is especially credible in academic and research environments, where customers explain exactly how OT-2 or Flex fits into sequencing, assay automation, organic chemistry, teaching, or biofoundry work. The weakest areas are revenue quality and concentration: public sources rarely disclose contract values, renewal terms, or which marquee logos are pilots versus material spenders. The defensible conclusion is that Opentrons has real adoption and product-market resonance, but public evidence still underspecifies how durable and monetizable that footprint is.'
sections:
- id: customer-segments-and-adoption-footprint
  title: Customer segments and the visible adoption footprint
  body: 'Opentrons’ customer base is best understood as a multi-segment research platform, not a single lab-equipment niche. Public customer stories and partner releases place the company across university research labs, teaching labs, genomics cores, synthetic-biology groups, biopharma and reagent partners, startup platforms, and some clinical or public-health-adjacent work. The broadest public adoption claims come from 2025–2026 company-distributed materials: more than 10,000 systems deployed globally, installations at every top-20 U.S. research university, and use by 14 of the top 15 global biopharma companies. Those are powerful reach indicators, but they should be read as coverage, not revenue concentration. The more useful lens is buyer-user-payer separation. In academia, principal investigators, core facilities, or educators often buy; students, technicians, and researchers use; and departmental or grant budgets pay. In pharma and partner channels, procurement and assay teams may
    buy while scientists and operators use. That split helps explain why Opentrons can land in many environments while still having highly uneven monetization quality across accounts.'
