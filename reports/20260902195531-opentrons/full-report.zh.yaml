      - number: '5.3'
        title: 信任、质量与合规控制
        blocks:
          - type: paragraph
            body: >-
              这个品类里的信任来自硬件质量、软件控制，以及供应商是否清楚界定产品尚不能保证什么。Opentrons 在两面都相对明确。OT-2 列出主流设备和质量认证，但也说明它本身不是无菌环境，也没有为 IVD 或 GMP
              用途验证。Flex 通过配件污染控制，以及 Compliance Ready Software，把信任栈往上推；后者增加认证、基于角色的访问、签名审计追踪，以及面向 Part 11 非 GMP
              工作流的系统级电子记录完整性。重要的是，Opentrons 没有声称只靠 CRS 就能解决验证；产品页说，客户
              SOP、验证方案和数据管理实践仍然重要。这是正确表述。公开证据支持其在研究和临床前环境中具备可信的质量与合规楔子，但不支持泛化为平台可交钥匙式 进入每一个受监管实验室。
