      - number: '1.2'
        title: 创立窗口、总部与公司表述
        blocks:
          - type: paragraph
            body: >-
              基本身份事实是公开的，但并不完全干净。多家第三方资料把 Opentrons 放在 Brooklyn，并把 20 Jay Street 列为供应商或公司地址；近期官方发布则把描述简化为 “New York”，一份
              2024 年发布稿还以 Long Island City 为公司发稿地。务实结论是，Opentrons 显然是一家 New York City
              公司，但当前准确办公地址和总部表述因来源而异。创立年份的证据也混杂。Tracxn 和 The Company Check 写 2013；Inc 和几篇创始人叙事指向 2014；SOSV
              的创始人资料把分歧串起来：Chiu Chau 在 2013 年搭建早期机器人，Will Canine 先成为第一位客户、之后成为联合创始人，团队随后进入 HAX、Kickstarter，再到 Y
              Combinator，公司逐步成形。由于 Opentrons 当前官方页面没有突出一个标准创立年份，尽调中最稳妥的表述是 2013-2014 的创立窗口：2013 对应公司前原型阶段，2014
              对应逻辑、Kickstarter 和公司启动阶段。
