  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、定价与可见变现表面
        blocks:
          - type: paragraph
            body: >-
              Opentrons 已不能再被描述为只卖一台机器人。公开产品和发布记录显示，它的变现表面是分层的：基础机器人、移液器和模块、优选吸头 与实验器具、必需的现场安装、降低摩擦的实验方案和 App
              界面、合作伙伴市场平台附件，以及面向受监管发现团队的合规型软件层。最强证据在于「存在哪些东西」，而不是「各自贡献多少」。Flex 公开标价从 $24,950
              起，但安装是强制项，地理区域定价也不同，意味着把服务纳入后，实际实现 ASP 应高于标价。OT-2 产品页推动 Opentrons 品牌吸头和兼容性逻辑，可支撑经常性耗材带动。实验方案库、App
              和市场平台增加商业表面积，即便经审阅记录没有披露独立 SaaS 定价或合作伙伴抽成率。整体看，可见收入模型更像「硬件 + 服务 + 生态附着」，而不是纯一次性设备购买。
