chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与平台范围
        blocks:
          - type: paragraph
            body: >-
              Opentrons 仍把身份放在「让实验室自动化民主化」上：科学家本来会把太多时间耗在手工移液，公司要把这部分工作自动化。当前首页强调更少瓶颈、可重构硬件和开放平台，而不是封闭自研栈。使命页和 Y
              Combinator 资料保留了更早的表述：机器人应把生物学家从重复台面实验中解放出来，并搭出共享实验方案层，提高跨实验室可复现性。OT-2 时代之后，变化在于范围。2024 和 2026
              年的产品新闻流显示，公司现在不只卖台式液体处理设备，也卖实验方案编写软件、实验方案库、自动化市场平台、面向受监管环境的合规就绪软件，以及连接 AI 的执行基础设施。换句话说，Opentrons
              已不适合再被定义为单一低成本机器人供应商。更强的公开描述是：一家开放式实验室自动化平台，核心产品仍是 OT-2 和 Flex，但商业野心已经延伸到软件、合作伙伴集成，以及 AI 驱动实验工作的执行层。
