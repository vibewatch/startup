      - number: '8.4'
        title: 情景分析与回报区间
        blocks:
          - type: paragraph
            body: >-
              情景框架比虚假的精确估值更诚实，因为 Opentrons
              的收入基数和结构仍未在公开信息中跑清。悲观情景下，公司更像资本开支较重的硬件和工作流供应商：企业转化不稳定、附加收入有限，还要在更苛刻条款下再融资；按偏低收入和低个位数倍数估算，估值区间会落到那些更负面的二级市场式看板附近。基准情景假设
              Opentrons 继续出货机器人，借 Merck 等工作流渠道扩张，并从部分装机基数中变现，但仍未证明自己能获得真正的软件重估；即便如此，估值仍远低于 2021 年独角兽估值锚点。乐观情景假设
              Flex、CRS、耗材和合作伙伴打包的工作流显著改善收入质量，把业务推向更高经常性收入占比。即便如此，除非收入大幅高于外部估算，或公司能拿出接近软件公司的留存和利润率特征，否则公开证据很难撑到 18
              亿美元。这种不对称让今天最能站得住脚的公开结论很直接：上行空间存在，但除非私下尽调发现比网页记录强得多的经济性，旧估值很难成立。
