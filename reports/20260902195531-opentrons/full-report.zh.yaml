      - number: '4.2'
        title: 资本历史、充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              财务记录里最干净的一块是融资脉络。Opentrons 自己 2021 年公告描述了一轮由 SoftBank Vision Fund 2 领投、Khosla Ventures 参投的 $200 million
              Series
              C；更重要的是，公告解释了这笔现金要投向哪里：新机器人工具、扩张生物铸造平台、新诊断测试，以及更多诊断实验室。这很关键，因为它说明资本计划远远超出普通台式硬件供应商的销售扩张。后续公开来源不完整，但方向一致。Tracxn
              和 CB Insights 都记录了 2025 年末新资本，并继续指向 2021 年 $1.8 billion 估值锚；SEC 备案则通过 2025 年 12 月 5 日 Form D
              确认融资活动。缺失信息同样重要：本文审阅的主要来源没有披露 2025 年融资用途、投后价格、账上现金、烧钱速度或现金跑道。唯一稳妥解释是，SoftBank 轮之后 Opentrons
              仍保留融资依赖，但公开证据不足以判断这是机会型补充资金，还是现金跑道更紧。
