      - number: '1.3'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              领导层能见度是公开记录里相对干净的一块。James Atwood 于 2023 年 4 月加入公司，负责机器人业务单元；在 2026 年 1 月公开宣布晋升之前，他已于 2025 年 7 月接任 CEO。当前
              about 页面显示，他下面有一支紧凑但可运转的班底，包括负责科学的 Leslie Mitchell、工程的 Greg Cole、财务的 Gavin Bogart、商业领导的 Brian
              O'Sullivan、法务的 Boris Mindzak，以及 HR 的 Censia Pottorf。Chiu Chau 仍以联合创始人身份出现在官方领导层页面，Myrtle Potter
              则仍是当前材料中最可见的董事会层面人物。关键人问题不在于公司有没有命名领导者，而在于 Jonathan Brennan-Badal 到 Atwood 的交接，是否代表公司有意把产品和商业重心转向 AI
              连接机器人。公开证据显示确实如此：Atwood 2023 年入职的重点是扩大 OT-2 和下一代机器人的商业化；他领导下的 2026 年叙事则明显押向自主科学、NVIDIA
              集成和受监管工作流扩张。不过，治理仍只部分透明，因为公开材料没有给出完整的当前董事会名单、所有权图谱或委员会结构。
