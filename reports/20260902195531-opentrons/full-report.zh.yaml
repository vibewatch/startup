      - number: '8.2'
        title: 融资背景与公开价格信号
        blocks:
          - type: paragraph
            body: >-
              融资证据强于收入证据，但仍留下很大估值缺口。Opentrons 自己的 2021 年新闻稿和多家第三方追踪平台，在关键锚点事实上保持一致：SoftBank Vision Fund 2 领投 $200
              million Series C，Khosla Ventures 参投，披露估值 $1.8 billion。Tracxn、SEC EDGAR、VCBacked 和 Company Check
              合起来显示，资本活动延续到 2025 年末，包括大约 $20.1 million 的追加融资和 2025 年 12 月 5 日 Form D
              备案。它们没有显示的东西至少同样重要。公开来源在轮次命名、累计融资额，甚至员工或收入估计上分歧明显。一些低透明度看板 现在暗示估值远低于 2021
              年价格，但它们也公开承认价格信号稀缺，或只暴露预览式数据。正确解读既不是「独角兽完好无损」，也不是「公司肯定只值 $136
              million」。正确解读是当前定价不透明，而不透明定价应把投资者推向更深尽调和更严格入场纪律，而不是默认沿用旧标题估值。
            claimRefs:
              - CV001
