  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录支持的是一家差异化公司，而不是一个可以被自信承销的独角兽入场价。Opentrons 有真实装机基础叙事、异常开放的产品生态、可信的 2025 年 Merck 商业化关系，以及 2026
              年面向合规的软件发布，显示管理层正在尝试越过低成本学术自动化。这些不是装饰性信号。它们重要，是因为它们暗示公司仍可能把低价机器人采用，逐步转成价值更高的软件、耗材和受监管工作流收入。但估值正是公司质量与投资案例分开的地方。最后一次清晰披露的主要估值仍是
              2021 年 9 月 $1.8 billion Series C。2025 年末融资证据证明投资人仍支持公司，却没有公开披露新的投后价格、优先权结构，或足以支撑沿用 2021
              年标记的收入里程碑。由于公开运营数据仍薄且互相冲突，建议必须对价格敏感：接近独角兽锚点时应继续研究，大幅折价时观察；只有尽调证明耐久经常性经济性，而不是主要硬件式收入后，才应上调。
