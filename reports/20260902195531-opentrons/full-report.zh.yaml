      - number: '6.3'
        title: 耐久性、扩张与支持现实
        blocks:
          - type: paragraph
            body: >-
              公开留存数据几乎不存在，因此只能从行为推断耐久性。最好的信号是重复订单、多年伙伴发布，以及客户说明机器人已成为日常实验室运营的一部分。Emory 是最清楚的例子：自 2018 年起集成三台
              OT-2，跨检测日常使用，之后又订购两台机器人。Northwestern 说机器人完全替代了手工手套箱 孔板设置；Gencove 则把 Opentrons 放在高通量测序流程 前端。这些证据强于门面
              logo，因为它们暗示运营依赖。但公开记录并非一致正面。客户评论证据和部分官方访谈显示，校准摩擦、偶发软件不稳定、连接问题，以及安装过程中需要支持介入。这对自动化硬件并不罕见，但对 Opentrons
              很重要，因为它卖的是可及性。如果上手导入只有高度技术型实验室才顺畅，扩张质量可能比品牌暗示的更窄。
