  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              定义 Opentrons 的市场，起点应该是客户要完成的工作，而不是最大的实验室自动化标题。买方用 Opentrons
              自动化重复液体处理、让实验方案可复现、把软件接到仪器上，并在部分场景中接入外包或远程中介执行。因此，核心市场包括台式自动化硬件、实验方案和控制软件、可复用工作流内容，以及部分能替代手工台面劳动的服务邻接。它不包括生命科学里每一美元分析仪器、医院照护交付或企业软件支出。实际替代品也比泛泛的「竞争」更窄、更具体：手工移液和电子表格协调、没有机器人的局部工作流软件，以及很多实验室认为太贵或太僵硬的传统自动化。云实验室文献和
              Opentrons 自己的公开评论又把边界稍微放宽：一些实验室可能以服务形式消费自动化，而不是买下每套系统。因此，这个市场最好看成分层结构：更宽的自动化和外包工作流外壳中，包着一个较窄的液体处理核心。
