      - number: '2.4'
        title: 采用约束、成熟度上限与保留的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              乐观的市场故事是真实的，约束同样重要。近期技术文献显示，自驱动实验室
              多数仍是定制系统，而不是即插即用基础设施；最难的问题往往是软件、互操作性和工作流设计，不只是机器人机械本身。市场报告也呼应了这一点，把兼容性、集成和实施复杂度列为真实的采用阻力。验证时间对
              制药、诊断，以及任何依赖受监管记录或审计追踪的工作流尤其关键。预算结构是另一个重要约束：NIH 的长期规模支撑学术需求，但 AAMC 提到的 2026
              年拨款放缓说明，即便总预算仍大，资本支出时点也可能打断采购。最大剩余分析缺口在于，经审阅公开来源没有为「带受监管发现选项的低价可编程台式自动化」单独隔离出干净
              SAM。这不否定机会，但意味着尽调应承销细分聚焦、采用摩擦和转化机制，而不是直接继承一页宽口径 TAM。
