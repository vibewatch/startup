      - number: '1.4'
        title: 资本基础、投资人图谱与运营规模信号
        blocks:
          - type: paragraph
            body: >-
              融资记录比运营指标更能把公司钉住。Opentrons 自己在 2021 年发布稿中宣布，由 SoftBank Vision Fund 2 领投、Khosla Ventures 参投的 $200 million
              Series C，并明确说明资金将投向机器人、诊断和生物铸造平台扩张。尽管第三方融资数据库有访问和方法论限制，但大体印证了更长的融资脉络：七轮融资合计大约 $261 million，2021 年 9
              月披露投后估值 $1.8 billion，Tracxn 还列出一笔日期为 2025 年 11 月 20 日的新 $20.1 million Series C 追加轮，旁边是 2025 年 12 月 5 日的
              SEC Form D 备案。这不能证明 2025 年追加轮与 2021 年那轮在同一天或相同经济条件下完成，但足以说明资本活动仍在继续，而不是股权结构表完全冻结。投资人图谱也解释了 Opentrons
              为什么仍有战略意义：Khosla 是长期支持者，SoftBank 给了独角兽轮，公司还与 YC、HAX、SOSV 和 Lerer Hippeau 网络保持连接。公开规模信号继续支撑这个故事。到 2026
              年，Opentrons 声称已部署超过 10,000 套系统，并覆盖美国前 20 所研究型大学全部、全球前 15 大生物制药公司中的 14 家。即便收入转化和利用率仍不透明，这些都是很强的触达指标。
