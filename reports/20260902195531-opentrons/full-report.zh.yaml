      - number: '6.4'
        title: 集中度风险、渠道暴露与剩余承销缺口
        blocks:
          - type: paragraph
            body: >-
              主要承销问题不是缺少客户证据，而是缺少经济分辨率。公开来源显示有许多可信用户，但几乎从不披露合同规模、续约状态、使用强度，或收入中有多少来自少数战略账户。Merck
              显然重要，但公开来源没有说明合作伙伴渠道是主导增量增长，还是只是补充直销。评论聚合器和案例研究目录进一步支持客户宽度，但不应误当成耐久 ARR 证据。发布材料中的明星学术名称也有同样问题。Argonne、Mayo
              Clinic、Harvard、MIT 和 University of Michigan 是有战略意义的背书，但公开证据没有完全区分试点、研究工具、课程使用或规模化机群关系。最安全结论是：Opentrons
              已实现广泛采用，并有足够具名证据验证相关性；关键尽调工作仍在于收入集中度、机群活跃度、续约质量，以及首台机器人采购转化为经常性多系统账户的频率。
