      - number: '2.2'
        title: 规模测算视角、细分组合，以及边界为何改变数字
        blocks:
          - type: paragraph
            body: >-
              公开市场规模测算有方向价值，但不精确到可以压成一个数字。在最宽口径下，经审阅来源给出的 2026 年实验室自动化估计落在约 $6.6 billion 到 $8.95 billion
              之间，两家发布方都把吞吐量、数字化、机器人和生命科学研究需求列为驱动因素。更相关的中间层是液体处理和模块化实验室自动化：一个来源预计 2025 年市场为 $5.10 billion，到 2030 年增至
              $7.48 billion；另一个把 2026 年自动化液体处理市场放在 $4.49 billion；更窄估计则为 $1.55
              billion。这些差异不是噪声，而是品类边界不同的结果。有些发布方纳入半自动系统、耗材或更宽的实验室工作流设备；另一些则更窄地隔离自动化平台。邻近的外包实验室市场还要大得多，2026 年实验室产品和外包服务超过
              $50 billion，制药 CRO 或 CDMO 支出远高于此。对尽调最关键的教训是：Opentrons 不需要最宽的 TAM，但后续估值工作必须保留每个引用数字背后的边界逻辑。
