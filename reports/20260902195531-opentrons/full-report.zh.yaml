      - number: '8.5'
        title: 最终尽调问题与投资假设破裂触发点
        blocks:
          - type: paragraph
            body: >-
              剩下的工作不是再找一篇好看的文章，而是解开一小组直接影响估值的未知数。第一，管理层必须用经审计收入、毛利率、硬件与软件收入结构，以及按客户批次拆分的复购或订阅数据，把公司从 2021
              年融资轮一路桥接到今天。第二，投资人需要 2025 年末融资的真实经济条款：轮次文件、清算优先权、期权池变化，以及价格相对 2021
              年是上调、持平还是重置。第三，公司必须说明其声称的装机基数中，有多少仍活跃、已变现，并能继续扩展到
              Flex、CRS、耗材或合作伙伴工作流。拿不到这些答案，审慎姿态就应是跟踪，而不是为叙事可选性付费。如果下一轮融资定价远低于管理层内部叙事，或受监管工作流采用仍然单薄，或广泛装机基数无法转化为经常性收入，投资假设就应破裂。只有当
              Opentrons 证明自己逐步变成更高质量的自动化平台，而不只是一个知名低成本机器人品牌时，投资假设才会改善。
