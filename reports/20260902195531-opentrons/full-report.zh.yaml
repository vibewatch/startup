      - number: '5.2'
        title: 软件架构、可扩展性与开放平台逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据里最稳定可见的差异化，是软件开放性。Opentrons 文档通过 Python Protocol API、App 控制、实验方案设计工具、robot-server 与 HTTP
              API、共享实验器具定义，以及 GitHub 上的公开源码，把机器人体验串在一起。文档对代码库 布局、发布分发和
              SSH、Jupyter、直接安装软件包等高级操作说明得异常明确。这种透明度很重要，因为它降低了有能力实验室的定制成本，并催生了可见的长尾社区实验方案、硬件改造和学术扩展。它也相对传统企业级自动化形成结构性取舍。Opentrons
              把更多主动权交给终端用户；研究实验室想要灵活性时，这是强项，但实验室如果期待交钥匙式 验证、固定应用或供应商包办集成，它就会变成实施负担。平台在技术上确实开放，但并非零摩擦。文档把这个差异表现得很清楚。
