  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 为何重要
    rows:
      - - 广义实验室自动化外壳
        - 研究和检测实验室中的机器人、仪器控制、软件、工作流编排和自动化
        - 通用生命科学 IT、医院护理交付和无关分析仪器预算
        - 研究实验室、诊断和制药运营预算
        - 可作外层 TAM，但太宽，不能等同于 Opentrons 的 SAM
      - - 液体处理与样本制备核心
        - 台式移液机器人、模块化液体处理器、协议执行和样本制备工作流
        - 大规模工厂自动化或无关分析仪
        - 实验室运营、核心设施、R&D 和检测开发预算
        - 最接近 OT-2 和 Flex 的核心市场
      - - 软件和协议层
        - 机器人控制软件、协议设计、API、可复用协议库和数字工作流内容
        - 与仪器执行无关的独立企业信息系统
        - 自动化负责人、科学家和 PI 控制的软件预算
        - 重要，因为 Opentrons 卖的是工作流可及性，不只是运动硬件
      - - 外包或云实验室邻近市场
        - 远程执行、实验室服务，以及面向没有完整本地自动化团队的合作伙伴工作流
        - 研究自动化之外的一般 CRO 开发或制造工作
        - 项目预算、外包服务负责人和创业公司 R&D 团队
        - 战略上有意义的邻近市场，拓宽需求，但也模糊市场测算
      - - 受监管研发发现切入口
        - 符合 Part 11 要求的记录、基于角色的访问、审计追踪，以及面向非 GMP 发现阶段的验证自动化
        - 完整 GMP 生产系统和工业规模医院诊断
        - QA、实验室运营、临床前、CRO / CDMO 或医疗器械 R&D 预算
        - Opentrons 试图上探的高价值切入口
      - - 排除支出
        - n/a
        - 疗法收入、通用医院运营预算，以及所有外包开发或制造支出
        - CIO、支付方和工作流执行之外的企业预算
        - 它们会驱动品类需求，但 Opentrons 不能直接捕获收入
    notes: 本表区分 Opentrons 可能捕获的支出，和只会间接影响采用的更大邻近预算。
