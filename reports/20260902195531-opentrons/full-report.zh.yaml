figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从早期创始人形成，到独角兽融资，再到后来的 AI / 合规重新定位。
    data:
      items:
        - date: '2013'
          label: 原型根源
          detail: Chiu Chau 逆向拆解液体处理概念，后来成了 Opentrons 的起源叙事。
