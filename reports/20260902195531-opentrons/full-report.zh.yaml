  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              头号监管问题是用途适配验证，而不是已经观察到的执法事件。美国 FDA Part 11 规则要求受监管电子记录使用经验证系统、受控访问、带时间戳的审计追踪、记录留存、培训和文档控制。Opentrons 2026 年
              CRS 发布很重要，因为它直接承认，可及性自动化在受监管实验室里曾有可信度缺口。但 CRS 明确限定在非 GMP 环境，且仍把
              SOP、验证方案和数据治理留给客户。这收窄了风险，但没有消除风险。法律栈带来第二层暴露。隐私和许可条款设想数据回流 Opentrons，用于更新、错误报告和使用数据；EULA
              限制逆向工程和面向竞争者的衍生使用；销售条款则严格限定保修覆盖、责任和缺陷索赔时点。这些对硬件加软件供应商并不罕见，但在这里更重要，因为 Opentrons
              向客户销售开放性和价格可负担性，而这些客户可能以为自己能获得比正式文件实际承诺更多的灵活性或支持覆盖。
