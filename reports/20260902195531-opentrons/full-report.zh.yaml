  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分与可见采用足迹
        blocks:
          - type: paragraph
            body: >-
              Opentrons
              的客户基础最好理解为多细分研究平台，而不是单一实验室设备小众市场。公开客户故事和合作伙伴发布把公司放在大学研究实验室、教学实验室、基因组学核心设施、合成生物学团队、生物制药与试剂合作伙伴、初创平台，以及部分临床或公共卫生邻近工作中。最宽的公开采用说法来自
              2025–2026 年公司分发材料：全球部署超过 10,000 套系统，进入美国前 20 所研究型大学全部，并被全球前 15 大生物制药公司中的 14
              家使用。这些是有力触达指标，但应读作覆盖，而不是收入集中度。更有用的镜头是买方、用户、付款方分离。在学术界，PI、核心设施或教师常常负责购买；学生、技术员和研究人员使用；院系或经费
              预算付款。在制药和合作伙伴渠道里，采购与检测团队可能下单，科学家和操作员使用。这种分裂解释了为什么 Opentrons 可以落地许多环境，但不同账户的变现质量仍高度不均。
