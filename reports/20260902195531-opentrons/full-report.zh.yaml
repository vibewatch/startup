      - number: '7.4'
        title: 缓释、监测与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              正确投资框架应是有条件的，而不是二元判断。几项风险已有部分缓释：CRS 改善了受监管工作流姿态，Merck
              提供可信商业化渠道，支持和保修界面存在，开放文档也给有能力实验室一条从产品限制中恢复的路径。但这些缓释都没有完全闭合承销回路。决定性尽调问题是：支持能否规模化，受监管客户是否验证并续约，渠道伙伴能否转成多元化
              终端动销，而不是集中叙事，以及未来融资是强势发生还是被估值下调压力推动。对投资者而言，投资逻辑不应因单个投诉出现就失效，而应在可衡量模式出现时失效：退货或失败率更高、CRS
              采用停滞、伙伴收缩、无法展示活跃机群使用，或又一轮融资暗示的压缩深度超过管理层愿意披露的程度。只有这些监测指标朝正确方向走，Opentrons 才仍看起来可投资。
