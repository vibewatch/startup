      - number: '3.2'
        title: 企业级硬件在位厂商：Hamilton、Tecan 与 Beckman
        blocks:
          - type: paragraph
            body: >-
              当买方问到吞吐量、设备集成和监管就绪度时，Hamilton、Tecan 和 Beckman 就定义了 Opentrons 需要对标的高端在位厂商层。Hamilton STAR V 强调高通量灵活性、CO-RE
              II 工具、MagPip 性能，以及面向集成工作单元的 270 度接入。Tecan Fluent 强调开放架构、多机械臂、第三方设备支持、无人值守自动化，以及面向受监管实验室的 Gx 软件。Beckman 的
              Biomek i-Series
              位于同一高端层，围绕开放平台集成、可配置移液头和合规支持组织。三家公司都瞄准那些需要更大台面、更宽配件生态，以及比低成本台式机器人通常能提供的更完整企业验证叙事的实验室。这个层级的共同弱点不是能力，而是购买摩擦。公开价格通常缺失或按报价给出，要比较系统之间差异，往往需要漫长销售流程。这种不透明给了
              Opentrons 简化首次购买的空间，即便它不能抹掉在位厂商在装机基础、服务深度或受监管信任上的优势。
