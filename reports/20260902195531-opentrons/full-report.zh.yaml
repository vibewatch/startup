      - number: '8.3'
        title: 可比公司组与公开倍数区间
        blocks:
          - type: paragraph
            body: >-
              最干净的公开锚点是 Tecan，因为它是真正的实验室自动化公司，而不是泛生命科学集团。用 2025 年收入和 2026 年 9 月市场价值快照，Tecan 的销售倍数大约落在高 2x 到低
              3x，取决于所用市值来源。Azenta 是相邻但更宽的生命科学自动化和样本管理公司，筛出来接近低 2x。Standard BioTools
              是规模更小、增长更弱的生命科学工具公司，即便承受显著股票市场压力，销售倍数也在低 3x 左右。Danaher 明显更贵，但估值反映的是规模、多元化，以及远宽于自动化液体处理的组合。Symbotic
              则完全在另一个区间，公开增长、更大规模和平台预期共同推动其销售倍数达到双位数。综合结论很关键：公开市场确实有自动化公司配得上溢价，但这些溢价通常要求更清晰的经常性经济性、更大的收入基础，或二者兼具。仅凭公开证据，Opentrons
              更像一个低个位数销售倍数承销问题，而不是一个应保留 2021 年风投倍数的软件式平台。
