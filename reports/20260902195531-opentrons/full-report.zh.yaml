  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接、邻近和替代竞争者
        blocks:
          - type: paragraph
            body: >-
              这个市场里，第一个错误是把所有实验室自动化公司都当成一一对应的硬件同行。买方实际上至少在三层之间选择。第一层是液体处理硬件，Hamilton、Tecan、Beckman、INTEGRA、FORMULATRIX 和
              Opentrons 最直接地位于这里。第二层是编排和工作流软件，Synthace 和 Automata
              影响实验如何被设计、连接并跨异构设备执行。第三层是更宽的集成和自主实验室层，真正的战斗越来越转向谁拥有控制平面、API
              和数据模型，而不是谁卖出了最精确的移液头。因此，一些公司会同时作为伙伴和竞争者出现。Synthace 与 Tecan、Hamilton、Beckman Echo 和 FORMULATRIX 集成。Automata
              销售自有硬件连接的 LINQ 平台，也强调开放连接。对 Opentrons
              而言，更有用的竞争框架是分层：上方是规模和受监管成熟度更强的企业级在位厂商；旁边是聚焦更窄工作流的专业或低价供应商；周围是用软件抽象包围它的编排厂商。
