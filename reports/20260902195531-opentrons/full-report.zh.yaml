  customerFocus: 学术实验室、生物技术初创公司、生物制药公司、医院、政府实验室，以及由合作伙伴分发工作流的买方。
  businessModel: 硬件销售叠加软件、实验方案、耗材、配件和合作伙伴工作流变现层。
