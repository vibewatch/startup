      - number: '1.5'
        title: 里程碑、反向核查与未解问题
        blocks:
          - type: paragraph
            body: >-
              2023 到 2026 年的里程碑记录显示，公司从价格可负担的自动化，扩展到更完整的运营栈。Flex 在 2023 年发布；实验方案库和自动化市场平台于 2024 年初落地；Flex Prep 在 2024
              年晚些时候扩大了无代码入口；2026 年又带来连接 NVIDIA 的自主科学定位，以及对齐 21 CFR Part 11
              式控制的合规就绪软件。这些发布让公司看起来比单一仪器初创公司更成熟。更难的问题是，这种成熟度是否撑住了 2021
              年独角兽估值。公开记录在这里转为反向。当前官方来源没有披露收入、当前估值或经验证员工数。第三方名录对员工数分歧很大；私募市场追踪网站现在给出的隐含价值或股价也远低于 2021
              年水平，尽管它们的方法论很薄，不能误当成流动市场清算价。因此，概览判断应保持平衡：Opentrons
              仍有真实产品宽度、可识别投资人基础和可信部署规模，但投资者应把当前估值、股权结构条款和运营效率当作仍需尽调的活问题，而不是继承自 2021 年 SoftBank 轮的既成事实。
