            body: >-
              Opentrons 交付的是分层实验室自动化产品，不是一台单独的台式机器人。公开材料显示，两条核心机器人产品族仍在活跃使用：OT-2 是传统低成本液体处理器，Flex
              是较新的模块化平台。围绕这些机器人，还有一层对采用很重要的实际操作界面：Opentrons App、Flex 上的触屏控制、开放 Protocol
              Library、可互换移液器、配件模块和兼容实验器具。要完成的核心工作是常规液体处理，但公开工作流足迹比基础转移步骤更宽。已验证和社区实验方案覆盖提取、NGS 制备、蛋白纯化、ELISA 和细胞实验。Flex
              还增加了更新能力，包括基于夹爪的移动、更高通量配件和受监管工作流控制。正确产品视角应以工作流为中心：Opentrons 卖的是可编程实验室工作站；当实验室围绕它标准化实验方案、配件和操作员习惯时，价值会复利。
