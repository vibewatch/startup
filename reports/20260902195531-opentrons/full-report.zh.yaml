      - number: '3.3'
        title: 易用型与专业型挑战者：Opentrons、INTEGRA 与 FORMULATRIX
        blocks:
          - type: paragraph
            body: >-
              企业级层级之下，竞争框架更微妙。Opentrons 是最清晰的可及性打法：它公布起售价，采用可自助更换的硬件模块，并强调触屏控制、App 驱动工作流和开源 API。INTEGRA
              从另一个但相邻的角度竞争，用更简单、更便宜的机器人自动化常规移液任务，并延长既有移液器装机基础寿命。FORMULATRIX 又处在不同位置，提供 Mantis 和 FLO i8
              等专业低体积、正位移系统，服务于试剂效率、小型化和灵活性比最大台面规模更重要的工作流。这些供应商解决的工作并不完全相同，但它们压缩了高端在位厂商 可以无争议占有的楔子。对 Opentrons
              来说，这组公司同时代表机会和风险：公司可以拿下逃离手工劳动或六位数标价冲击的买方，也可能在窄用例里被专业供应商压价，或被质疑其开放性仍让客户承担了企业级供应商藏在服务和应用支持里的集成工作。
