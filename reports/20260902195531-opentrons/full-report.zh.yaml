            body: >-
              公开牵引力故事在部署宽度上强于确认收入。2026 年，citybiz 和 Instrument Business Outlook 重复了公司说法：全球部署超过 10,000 套系统，覆盖美国前 20
              所研究型大学全部，并进入全球前 15 大生物制药公司中的 14
              家。这些是有意义的触达指标，因为它们暗示未来耗材、软件和服务拉动有真实装机基础。但它们不是收入质量。名录类估计在收入和员工数上明显冲突：Usearch 给出 $135.8 million 收入和 278
              名员工，而 Tracxn 报告 2024 年末员工数为 190。公开来源同样没有披露毛利率、队列扩张、续约、利用率或 CAC
              回本周期。因此，公开证据能支持的最佳财务逻辑是结构性而非实测：软件和合规层的增量毛利率应优于机器人硬件；与此同时，历史上对 PRL、Neochromosome
              和相关平台野心的投入，可能抬高了固定成本和资本强度。投资者能看到模型形状，但看不到真实单位经济。
