      - number: '7.3'
        title: 依赖、竞争与融资风险
        blocks:
          - type: paragraph
            body: >-
              依赖图谱比第一眼看到的更宽。正面看，Merck 伙伴关系和 AAW 工作站通过验证一条进入更高价值检测
              工作流的渠道主导路径，降低了部分商业化风险。负面看，如果真正重要的商业关系只有少数几个，同样模式也会制造伙伴依赖风险。竞争风险也有两面。高端市场里，Hamilton、Tecan 和 Beckman/Danaher
              拥有更深企业服务能力、更成熟集成和更强受监管可信度。中低端市场里，INTEGRA 和 Formulatrix 缩小了 Opentrons
              仅靠可及性可以占有的空间。财务上，风险不是已被证明的偿付危机，而是带牙齿的能见度问题：低透明度二级市场来源现在暗示的估值远低于 2021 年独角兽水平，SoftBank
              自身宏观风险画像也给历史旗舰轮增加了间接阴影。公开信息足以说明 Opentrons 仍能融资和出货；不足以说明未来资本、稀释或伙伴集中度风险已经被稳妥控制。
