companyProfile:
  summary: >-
    Opentrons 是一家总部位于 Brooklyn 的实验室自动化公司，成立于 2013 年。它先靠价格可负担、可编程的液体处理机器人建立声誉，之后扩展成更宽的产品栈，覆盖
    Flex、OT-2、实验方案软件、开源工具、偏合规场景功能，以及合作伙伴打包工作流。公司的核心逻辑是让研究实验室更容易用上自动化，后续又推向价值更高的受监管场景和近企业级用例。
  foundedDate: '2013-01-01'
  founders:
    - name: Will Canine
      role: 联合创始人
      background: 早期联合创始人和公司搭建者，推动自动化变得更便宜、更适合一线生物学家使用。
      claimRefs: []
    - name: Chiu Chau
