  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers five public-market or public-data reference points that bracket automation and adjacent life-science-tool
        valuations relevant to Opentrons. It omits private secondary trades with insufficient transparency and private
        incumbents such as Hamilton that do not disclose comparable market-value data.
    columns:
      - 可比公司
      - 公开指标
      - 倍数 / 估值状态
      - 与 Opentrons 的相关性
      - 局限
    rows:
      - - Tecan
        - 2025 年收入 882.48M；Sep-2026 市值 2.42B 至 2.96B
        - ~2.7x 至 ~3.4x 销售额
        - 自动化液体处理领域最干净的公开实验室自动化锚点
        - 规模远大于 Opentrons，且已上市、更成熟
      - - Azenta
        - FY2025 收入 593.82M；Sep-2026 市值 1.39B
        - ~2.3x 销售额
        - 相邻自动化 / 样本管理可比公司，显示公开市场低个位数区间
        - 组合比液体处理更宽，不是直接移液可比公司
      - - Standard BioTools
        - 2025 年收入 85.33M；Sep-2026 市值 264.32M
        - ~3.1x 销售额
        - 小盘生命科学工具参照，规模比 Danaher 更接近 Opentrons
        - 不是纯自动化可比公司，且股票市场情绪低迷
      - - Danaher
        - 2025 年收入 24.57B；Sep-2026 市值 147.56B
        - ~6.0x 销售额
        - 显示市场给规模化、多元化生命科学平台的溢价
        - 集团结构让它只能作为上限语境，而不是直接倍数锚点
      - - Symbotic
        - FY2025 收入 2.25B；Sep-2026 市值 24.11B
        - ~10.7x 销售额
        - 展示公开市场如何奖赏增长预期强的规模化自动化平台
        - 终端市场和规模不同；估值太高，不适合作为 Opentrons 基准情景类比
    notes: 各行按对基准情景最有用的直接锚点到最不直接适用的溢价语境排序。
