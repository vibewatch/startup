      - number: '6.2'
        title: 具名客户证据及其对生产使用的含义
        blocks:
          - type: paragraph
            body: >-
              具名客户记录在来源描述具体工作流、结果以及使用是否重复而非实验性时最强。按这个标准，Opentrons 的证据优于许多早期硬件公司。Merck 的 2025 年多年合作，以及之后的 AAW
              工作站发布，展示了面向检测工作流的伙伴主导商业化。Emory、Northwestern、Gencove、DAMP Lab 和 MilliporeSigma
              给出了更有用的证据，因为它们描述了具体日常使用：自动化基因分型和血液处理、手套箱 有机化学、唾液到测序准备、收费服务型生物铸造平台运营，以及 ELISA 支持。Imperial College 和 Cold
              Spring Harbor 的教育故事显示另一种耐久性：重复课程使用、多届学生队列，以及平台成为劳动力培训的一部分，而不是一次性演示。主要注意点
              是，生产重要性仍不相同。有些是任务关键型研究工作流，有些是课程和赋能案例，还有些是合作伙伴渠道，战略意义可能大于经济意义。
