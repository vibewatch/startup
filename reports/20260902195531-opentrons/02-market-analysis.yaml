- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - High-throughput screening demand
    - positive
    - current
    - Pushes labs toward automated sample prep and repeatable execution
    - Which customer workflows are volume-constrained today?
  - - Labor scarcity and manual-bench fatigue
    - positive
    - current
    - Makes automation a staffing lever rather than a convenience purchase
    - How acute are customer staffing shortages by segment?
  - - Pharma R&D cost pressure
    - positive
    - current
    - Rising drug-development costs make throughput and error reduction more valuable
    - Can Opentrons show ROI in discovery-cycle time or failure reduction?
  - - Protocol/software reuse
    - positive
    - current
    - Reusable workflows can shorten onboarding and widen appeal beyond expert coders
    - What portion of new usage comes from protocol-library or no-code entry points?
  - - NIH and extramural research base
    - positive
    - current
    - Large academic research budgets keep universities and institutes relevant buyers
    - Which academic subsegments have the healthiest capital and grant access?
  - - Integration and interoperability friction
    - negative
    - current
    - Compatibility with existing tools can delay or shrink deployments
    - How much pre-sales and services work is needed per deployment?
  - - Validation and implementation burden
    - negative
    - current
    - Regulated or standardized workflows adopt more slowly even when ROI is clear
    - How much time and support are required to reach production use?
  - - 2026 grant and funding volatility
    - negative
    - current
    - Academic buyers may defer purchases despite long-run demand
    - How much exposure does the pipeline have to grant-timing risk?
  notes: Drivers and constraints are strongest when tied to segment-specific budget owners and deployment timing rather than treated as abstract industry talking points.
