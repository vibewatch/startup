tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Broad lab automation shell
    - Robotics, instrument control, software, workflow orchestration, and automation across research and testing labs
    - General life-sciences IT, hospital care delivery, and unrelated analytical instrumentation budgets
    - Research-lab, diagnostics, and pharma operations budgets
    - Useful outer TAM but too broad to equal Opentrons SAM
  - - Liquid handling and sample-prep core
    - Benchtop pipetting robots, modular liquid handlers, protocol execution, and sample-prep workflows
    - Large-scale factory automation or unrelated analyzers
    - Lab operations, core facilities, R&D, and assay-development budgets
    - Closest core market to OT-2 and Flex
  - - Software and protocol layer
    - Robot control software, protocol design, APIs, reusable protocol libraries, and digital workflow content
    - Standalone enterprise informatics unrelated to instrument execution
    - Automation leads, scientists, and PI-controlled software budgets
    - Important because Opentrons sells workflow accessibility, not just motion hardware
  - - Outsourced or cloud-lab adjacency
    - Remote execution, lab services, and partner workflows for teams without full on-prem automation
    - General CRO development or manufacturing work outside research automation
    - Project budgets, outsourced-services owners, and startup R&D teams
    - Strategically relevant adjacency that broadens demand but blurs market math
  - - Regulated discovery wedge
    - Part 11-aligned records, role-based access, audit trails, and validated automation for non-GMP discovery settings
    - Full GMP production systems and hospital diagnostics at industrial scale
    - QA, lab operations, preclinical, CRO and CDMO, or med-device R&D budgets
    - High-value wedge where Opentrons is trying to move up-market
  - - Excluded spend
    - n/a
    - Therapy revenue, general hospital operating budgets, and all outsourced development or manufacturing spend
    - CIO, payer, and corporate budgets outside workflow execution
    - Demand drivers for the category, but not direct Opentrons revenue capture
  notes: The table distinguishes the spend Opentrons can plausibly capture from larger adjacent budgets that only influence adoption indirectly.
