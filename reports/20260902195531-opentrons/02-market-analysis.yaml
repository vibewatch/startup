chapter:
  number: 2
  title: Market Analysis
  summary: 'Opentrons sits inside several overlapping markets rather than one neat TAM: broad lab automation, narrower liquid-handling systems, and adjacent outsourced or cloud-lab services. Reviewed 2025-2026 sources place broad lab automation around $6.6-$8.95 billion in 2026 and automated liquid handling anywhere from about $1.55 billion to $4.49 billion or more depending on category scope. The buyers are clear—pharma and biotech R&D teams, CROs and CDMOs, research institutes, diagnostics, and academic labs—but adoption is governed less by headline market size than by throughput needs, labor constraints, software interoperability, validation burden, and budget timing. The most defensible diligence conclusion is that the market is big enough, but Opentrons still needs to win a specific accessibility-plus-compliance wedge rather than ''lab automation'' in the abstract.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and status-quo substitutes
  body: 'The right market definition for Opentrons starts with the job to be done, not with the largest available lab-automation headline. Buyers use Opentrons to automate repetitive liquid handling, make protocols reproducible, connect software to instruments, and in some cases bridge into outsourced or remotely mediated execution. That means the core market includes benchtop automation hardware, protocol and control software, reusable workflow content, and selected service adjacencies that remove manual bench labor. It does not include every dollar of analytical instrumentation, hospital care delivery, or enterprise software inside life sciences. The practical substitutes are also narrower and more concrete than generic ''competition'': manual pipetting and spreadsheet coordination, partial workflow software without robotics, and legacy automation that many labs view as too expensive or too rigid. The cloud-lab literature and Opentrons'' own public comments further widen the frame by showing
    that some labs may consume automation as a service rather than by owning every system outright. So the market is best viewed as layered, with a narrow liquid-handling core inside a broader automation and outsourced-workflow envelope.'
