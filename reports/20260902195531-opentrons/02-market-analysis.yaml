  evidenceGaps:
  - type: missing-source
    severity: material
    topic: serviceable-market-size
    missingEvidence: A public source that isolates the market for affordable programmable benchtop liquid handling with meaningful software or compliance overlays.
    whyItMatters: Without a price-tier and workflow-specific denominator, SAM and SOM estimates remain heuristic rather than investable market math.
    diligencePath: Request segmented win-loss data, price-band market studies, and internal pipeline splits by customer type, budget owner, and validation requirement.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-boundary-disagreement
    missingEvidence: A reconciled explanation from publishers or primary buyers for why automated liquid handling ranges from roughly $1.55 billion to $4.49 billion or more in 2026.
    whyItMatters: Boundary slippage can produce large valuation differences if investors mix incompatible TAM lenses.
    diligencePath: Normalize category definitions across reports and map them to Opentrons product modules, pricing tiers, and customer segments before using them in comp work.
    relatedQuestionRefs:
    - QM005
    - QM006
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-conversion
    missingEvidence: Evidence showing how often apparent demand converts into paid fleet deployments, software attach, consumables pull-through, or outsourced-services revenue by segment.
    whyItMatters: Large TAMs do not matter if adoption stalls at pilot scale or remains concentrated in low-ACV use cases.
    diligencePath: Request cohort conversion data from first robot sale to expansion, plus software, services, and consumables attach rates.
    relatedQuestionRefs:
    - QM010
    - QM016
