      - number: '4.4'
        title: 财务判断与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              签约容量、涨价机制和迁移阻力可能带来持续流入，FY2025 业绩也显示出可观的经营盈利，因此收入质量总体有吸引力。反面是先建设后爬坡的模式：容量新增会在利用率和收入完全提升前吸收资本。ICRA
              明确将债务融资资本开支和中期资本回报率中等视为信用挑战；若 DSCR 持续低于 1.5x 或债务 / EBITDA 超过
              4x，评级将承压。因此，现有证据支持正面的运营模式，但不足以形成完整的股权投资判断。投资委员会在为预测增长估值，或把承诺资本视为可用跑道前，应要求经审计合并财务报表、园区层面利用率和贡献利润率、客户集中及合同明细、债务和契约明细，以及交易后的现金流桥接。
