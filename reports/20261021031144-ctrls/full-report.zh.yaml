      - CR013
      - CR014
  - id: TR003
    title: 合作方 / 依赖风险登记表
    columns:
      - 依赖项
      - 交易对手或渠道
      - 集中度或承诺
      - 失败情景
      - 严重性
      - 缓释措施
      - 残余暴露
    rows:
      - - 客户现金流
        - 前十大客户
        - 约占 FY2025 合并经营收入的 62%。
        - 不续约、缩减规模或爬坡延迟会削弱覆盖能力。
        - High
        - 中长期合同和较高的转换成本。
        - 客户层面的收入、期限、续约和信用质量未披露。
      - - 增长资本
        - CPP Investments
        - 直接股权投资与园区合资项目合计最高 INR 70 billion。
        - 先决条件或提款延迟会拖慢扩张。
        - High
        - 已披露承诺的大型机构合作方。
        - 提款计划、条件、救济措施以及 CtrlS 的配套资本未公开。
      - - 合资治理
        - CPP Investments 与 CtrlS
        - 持股比例为 48% / 52%。
        - 僵局或不同的回报门槛会推迟园区决策。
        - High
        - CtrlS 保留多数股权。
        - 保留事项、退出权和运营控制未披露。
      - - 债务可获得性
        - 债权人和项目融资机构
        - ICRA 预计 FY2026-FY2028 资本开支需要 Rs. 3,000-3,500 crore 债务融资。
        - 成本、契约或资金可得性变化，都会让项目资金不足。
        - 高
        - 长期限、按租赁收入折现的借款，以及合作伙伴股权。
        - 当前债务计划和交易后的契约余量尚未公开。
    notes: 集中度和承诺融资保留了来源中的期间与分母；已承诺资金不等于 CtrlS 已经可以动用的现金。
    claimRefs:
