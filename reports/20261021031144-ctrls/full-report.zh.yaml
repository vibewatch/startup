chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              CtrlS Datacenters Limited 是一家总部位于 Hyderabad 的托管及基础设施管理服务运营商。成立标签虽不一致，但运营历史较清楚：VCCircle 称公司成立于 2007 年，ICRA
              则称其于 2008 年成立，并于 2009 年开始运营首座 Hyderabad 数据中心。正式发布前仍应以公司注册记录厘清这一差异，但这不改变 CtrlS 自 2009
              年起运营数据中心基础设施的证据。其模式将客户自有设备放置在 CtrlS 设施中，并叠加托管主机、存储、备份、监控、采购和网络配置服务。这是资产密集型的经常性合同模式，而非纯软件订阅业务。
            claimRefs:
              - CO001
              - CO002
              - CO003
