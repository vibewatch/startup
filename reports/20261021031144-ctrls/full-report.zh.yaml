      - number: '1.3'
        title: 资本结构与所有权拐点
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月与 CPP Investments 的合作改变了所有权和融资结构。CPP 以 INR 40 billion 承诺获得 8.2% 的直接持股，并为独立超大规模园区合资企业 48% 的权益承诺最多
              INR 30 billion，CtrlS 保留该载体 52% 的权益。这是两项独立承诺，不应合并为母公司可用现金。VCCircle 报道的投前估值约为 INR 44,824 crore，与其他来源约 US$4.8
              billion 的报道大体一致。8 月，Nikhil Kamath 和 Sreeram Reddy Vanga 分别追加 INR 200 crore 和 INR 50
              crore。这些交易带来新资本，但现有来源无法可靠汇总股权、债务、回购历史股份及合资企业后的累计融资额。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
      - number: '1.4'
        title: 治理、财务姿态与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Sridhar Pinnapureddy 仍是融资、建设战略、容量主张及国际扩张的核心公开决策者。Tracxn 列出 9 名现任董事，包括 Pinnapureddy 和 8
              名独立董事，但现有证据无法确认当前委员会架构、投资者同意权或 CPP 提名安排。财务方面，ICRA 报告 FY2025 临时营业收入为 INR 1,567 crore，增长约 17%，营业利润率为
              49.6%。同一评级分析预计 FY2026-FY2028 资本开支为 INR 4,500-4,600
              crore，且主要由债务融资，并提示竞争及资本回报率中等。创始人主导的运营模式已实现规模化，但投资者应将治理权利、继任梯队、资本开支控制和客户集中视为相互关联的尽调重点。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO015
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 机构资本分布在母公司与项目载体之间
            body: >-
              CPP 的核心承诺包括 INR 40 billion 的母公司直接股权，以及向独立持有的园区合资企业投入最多 INR 30 billion。尽调应分别建模各实体的控制权、现金可得性和回报，而不是把 INR 70
              billion 视为一笔不受限制的融资。
            calloutType: insight
            claimRefs:
              - CO008
              - CO009
          - type: callout
            title: 规模主张超过了披露可比性
            body: 从 2025 年 8 月的 130 MW 运营容量到 2026 年超过 370 MW 的实时或托管容量，可能反映投产及口径变化，但指定来源没有提供衔接表。仍需取得站点层面的 IT 负载、利用率、所有权和签约容量。
            calloutType: risk
            claimRefs:
              - CO005
              - CO006
              - CO007
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              CtrlS
              通过托管、托管主机及规划中的超大规模园区参与印度数据中心基础设施市场。核心市场边界是连同电力、物理空间、连接和运营服务出售的第三方容量；托管存储、备份、监控、采购和网络配置属于可扩大钱包份额的相邻服务。可再生能源发电、冷却设备、建设和熟练劳动力是赋能投入，而非数据中心服务收入。公有云服务既是需求来源，也是替代方案：超大规模云厂商可以租用外部容量，企业则可选择云容量、内部机房或外包托管。这样的边界避免把整个数字经济都算作
              CtrlS 可服务的支出，并将买方决策锚定在容量、可靠性、本地化和托管运营上。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              来源集合没有提供可比的收入 TAM，而是给出定义和期间不同的容量视角。一篇报道转述管理层估计称，印度五年内可能需要 18–20 GW；另一篇行业文章援引 Wood Mackenzie 称，AI 专用容量将从
              2025 年的 275 MW 增至 2030 年的 6.5 GW。公司规模数据也不一致：2026 年报道描述 370 MW 活跃容量及 4 GW 新增容量目标，而 ICRA 在 2025 年 8 月测得约 130
              MW 运营容量。这些数字可能反映增长、IT 负载与更宽泛容量定义的差异，或资产组合范围不同，但来源没有完成核对。图表仅为展示将 MW 统一为 GW，不将这些数值相加，也不把它们视为嵌套的 TAM/SAM/SOM
              层级。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              有证据支持的需求基础覆盖超大规模云厂商、云服务商、BFSI、企业、电商、电信、政府、IT
              公司和中小企业。不同细分市场的采购方式不同：超大规模云厂商和云服务商购买大额签约容量，受监管企业则更看重可靠性、本地化和托管运营。潜在预算负责人可能是基础设施、技术或运营团队，但公开来源没有说明 CtrlS
              客户的审批链、合同规模或采购周期；这些字段仍是分析推断，并非已验证事实。中长期合同，以及客户投入和停机风险带来的高迁移成本，有助于推动采用。同样的黏性也可能拉长初次销售和迁移周期，因为工作负载、控制措施和网络架构必须在不中断的情况下迁移。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM014
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素总体强劲：CPP Investments 指向超大规模云、国内云和 AI 需求，ICRA 还提到数据增长、移动及互联网渗透率、电商、5G、本地化和政策支持。但容量不会自动转化为优良经济性。ICRA
              预计 CtrlS 将主要依靠债务为 FY2026–FY2028 的大规模建设融资，提醒利用率可能落后于新增容量，并指出新进入者及现有企业扩张带来的激烈竞争。Accenture
              则单独强调行业普遍面临电力、人才、供应链和监管瓶颈。估值的关键投资判断变量是签约利用率、单位容量的实际价格、电力可得性与成本、建设时点和杠杆，而不是最宽泛的全国预测。在取得可比收入和利用率数据前，这些变量比
              表面市场规模倍数更有决策价值。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 容量预测不是可用于融资的需求
            body: 债务融资建设、利用率滞后、新进入者、电力约束以及未核对的容量定义，可能让大额需求预测与疲弱的项目回报并存。投资判断应要求取得签约利用率、电力可得性和项目层面的经济性。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              直接运营商集合较广，并非二选一竞争。Mordor Intelligence 将 NTT、STT GDC、Nxtra、Sify 和 Equinix 列为行业领先者，并称市场集中度中等；BrokerChooser
              则将 CtrlS 与 NTT、Equinix 和 STT Telemedia
              并列为印度四大运营商之一。买方还可以选择批发或零售托管、超大规模云厂商自有设施、企业自建、传统本地机房，或延后迁移。这些替代方案的经济性不同：运营商出售容量和服务，而自建则以所有权和控制权替代资本密集度及执行风险。因此，现有资料支持竞争者类别地图，但不足以给出确定的市场份额排名。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
