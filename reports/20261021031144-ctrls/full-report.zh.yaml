      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              当客户重视避免迁移、长期合同、地域覆盖，以及供应商能在需求前提前建设容量时，CtrlS 的护城河最强；当容量、可再生电力、液冷和交付速度成为标准化采购条件时，护城河最弱。ICRA
              明确提示大型新增容量、新进入者和现有企业扩张带来的激烈竞争；Mordor
              则描述竞争者使用规模资本、电信自有需求、可再生能源挂钩合同和改造计划。对最大买方而言，超大规模云厂商自建是另一种替代方案。证据支持存量客户的迁移成本优势持久，但不支持新容量拥有永久的定价或技术护城河。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 存量客户迁移成本是最清晰的护城河证据
            body: ICRA 将客户黏性归因于客户投入、停机风险，以及带有明确涨价机制的中长期合同；这比泛泛的规模或可靠性主张更有力。
            calloutType: strength
            claimRefs:
              - CP013
              - CP014
          - type: callout
            title: 扩张资本不能消除竞争性执行风险
