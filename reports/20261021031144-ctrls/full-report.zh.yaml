      - number: '1.2'
        title: 规模、需求暴露与指标核对
        blocks:
          - type: paragraph
            body: >-
              多份 2026 年报道称，公司在印度九个市场运营 19 座数据中心。容量则难以直接比较。ICRA 在 2025 年 8 月测得约 130 MW 的运营容量，而 2026
              年报道及一次创始人访谈称，实时或托管容量超过 370 MW，在建项目超过 4 GW。时间差可能解释部分跃升，但各来源没有核对 IT
              负载、设施电力、自有与托管容量，或已投产与已签约兆瓦数。因此，开发储备更应理解为公司披露的目标，而非已交付容量。客户广度也只通过部分群体呈现：公司称服务超过 60 家 Fortune 500
              企业及七大超大规模云厂商中的五家；ICRA 则称前十大客户约贡献 FY2025 合并营业收入的 62%。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO013
