      - 可能性
      - 严重性
      - 缓释成熟度
      - 残余暴露
      - 尽调路径
    rows:
      - - 跨实体担保
        - ICRA 报告称，两家全资运营子公司的贷款存在担保。
        - Medium
        - High
        - 部分；已有合并评级分析，但担保明细未公开。
        - 公司声称的母公司流动性与债权人债权，可能跨运营实体相互关联。
        - 按贷款方取得担保、抵押、契约和交叉违约条款。
      - - CPP 园区合资治理
        - CPP Investments 将持有 48%，CtrlS 持有 52%；保留事项和僵局权利未披露。
        - Medium
        - High
        - 早期；资金承诺和持股比例公开，但已签署的治理条款未公开。
        - 项目进度和资本调用可能取决于协商后的合作方批准。
        - 审阅已签署的合资、股东、开发、管理和退出协议。
      - - 数据、安全、许可和事件合规
        - 指定公开来源池无法证明当前许可证、认证、诉讼程序或事件历史。
        - Unknown
        - High
        - 在保留的公开证据中未验证。
        - 重大事件可能影响受监管客户、正常运行时间义务和扩张许可。
        - 取得监管机构往来文件、许可登记册、审计、认证、数据泄露与停机日志以及保险理赔记录。
    notes: 截至 2026-10-21 的部分公开证据登记表；可能性和严重性是结合已披露暴露作出的分析师评估，未知的法律、安全和许可状态被列为缺口，而不是事件发生的证据。
    enumerationScope:
