          x: 2
          'y': 1
          detail: 被列为开展改造活动的行业领导者；未保留总扩张量和服务细节。
    approximationNotes: 序数分数是透明的证据可得性指标，不是实测表现；指标无法匹配且竞争对手披露不足，因此无法进行量化的市场定位比较。
    claimRefs:
      - CP003
      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: 合同驱动的收入与再投资流
    type: flow
    summary: 公开证据将客户需求、合同服务、营业利润和再投资串联起来；但没有披露毛利或客户层面的单位经济模型。
    data:
      nodes:
        - id: customer-demand
          label: 超大规模、企业和 BFSI 需求
          detail: 前十大客户约占 FY2025 营业收入的 62%。
        - id: contracts
          label: 中长期合同
          detail: 明确的涨价机制和切换摩擦支撑经常性流入。
        - id: delivery
          label: 托管机房和托管主机
          detail: 机架容量与可选基础设施及托管服务组合销售。
        - id: rental-inflows
          label: 稳定的类年金流入
          detail: ICRA 将合同现金流描述为稳定；实际定价属于非公开信息。
        - id: operating-income
          label: FY2025 营业收入
          value: ₹1,567 crore
          detail: ICRA 初步合并营业收入，较 FY2024 高约 17%。
        - id: operating-profit
          label: FY2025 OPBDIT/OI
          value: 49.6%
          detail: 扣除折旧、利息和税费前的经营盈利；毛利率未披露。
        - id: reinvestment
          label: 容量再投资
          detail: 内部留存收益和计划债务支持 FY2026-FY2028 资本开支。
    approximationNotes: 这是有证据支撑的机制流，不是按比例绘制的财务桥接，也不是毛利调节表。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI007
      - CI008
  - id: FE001
    title: 受来源约束的产品架构图
    type: stack
    summary: 该分层区分客户需求、服务界面、设施交付、物理系统、控制措施和扩张，不暗示未经验证的组件设计。
    data:
      layers:
        - label: 客户需求
          items:
            - 企业和 BFSI 工作负载
            - 超大规模、云和 AI 工作负载
          detail: 需求通过合同容量或客户基础设施要求进入。
        - label: 商业服务界面
          items:
            - 托管机房和定制建设
            - 托管主机、边缘和连接
          detail: 公开证据支持这些服务类别，但不支持模块层面的经济性判断。
        - label: 部署与运营
          items:
            - 机架和园区交付
            - 监控、备份、恢复和配置
          detail: 运营工具、支持 KPI 和交付周期均未公开。
        - label: 物理基础设施
          items:
            - 电力和冗余系统
            - 按工作负载和站点配置的风冷或液冷
          detail: 指定来源未提供园区级物料清单或拓扑结构。
        - label: 信任与韧性控制
          items:
            - 物理与网络安全
            - 可用性和恢复治理
          detail: SLA 和安全声明没有独立控制证据支撑。
        - label: 容量扩张
          items:
            - 预租赁的年度新增容量
            - 超大规模合资项目和多吉瓦管线
          detail: 融资和管线证据不能证明项目已投产或具备技术就绪度。
    approximationNotes: 这里只是概念层级排序；不主张未披露的组件供应商、拓扑结构、容量分配或控制有效性。
    claimRefs:
      - CE003
      - CE005
      - CE007
      - CE011
      - CE014
      - CE015
  - id: FU001
    title: 客户获取、交付与扩张路径
    type: journey-map
    summary: 公开证据支持一条从监管或算力需求走向合同容量和长期运营的路径，但不支持客户层面的转化率或留存率。
    data:
      nodes:
        - label: 需求触发
          detail: AI、云、数字化工作负载以及境内数据驻留要求，共同带来基础设施需求。
          touchpoints:
            - Enterprise infrastructure planning
            - Compliance and data-residency assessment
        - label: 客群与站点选择
          detail: 超大规模客户、BFSI、政府、电信、电商、IT 和 SMB 买家选择服务与地理位置。
          touchpoints:
            - Power and connectivity diligence
            - Procurement and compliance review
        - label: 服务配置
          detail: 客户选择托管机房或托管主机服务，包括存储、备份、监控、采购和网络配置。
          touchpoints:
            - Rack or facility requirements
            - Managed-service scope
        - label: 合同与预租赁
          detail: ICRA 报告存在带涨价机制的中长期合同，计划新增容量已全部预租赁。
          touchpoints:
            - Contract term and escalation
            - Reserved capacity
        - label: 生产运营
          detail: 工作负载部署后，切换相关停机风险和客户投入可能提高客户黏性。
          touchpoints:
            - Reliability and support
            - Operational continuity
        - label: 扩张或集中
          detail: 新增园区和服务可以扩大客户关系，但前十大客户集中度和电网约束会限制其持久性。
          touchpoints:
            - Additional capacity
            - Concentration and power monitoring
    approximationNotes: 这条有序路径是定性的；公开证据没有提供各阶段转化率、客户数量或耗时。
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
      - CU011
      - CU012
      - CU013
      - CU016
  - id: FR001
    title: 基于证据的风险热力图
    type: matrix
    summary: 六项已披露或有直接证据支持的风险暴露，按定性可能性、影响和缓释成熟度排序；标签是分析判断，不是统计概率。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 根据已披露风险暴露和来源敏感度作出的定性评估。
        - id: impact
          label: 影响
          detail: 对债务覆盖、交付或客户义务的潜在影响。
        - id: mitigation
          label: 缓释成熟度
          detail: 有公开证据的控制措施或结构性抵消因素的强度。
      rows:
        - id: debt-funded-expansion
          label: 债务融资扩张
          note: ICRA 对资本开支和杠杆的敏感性判断。
          values:
            - value: High
              detail: 大规模已承诺建设计划已经排定。
            - value: High
              detail: 如果交付或爬坡延期，杠杆和覆盖能力可能减弱。
            - value: Partial
              detail: 长期限债务、现金流和 CPP 资本提供缓冲。
        - id: utilization-ramp
          label: 利用率与爬坡
          note: 明确的负面评级敏感性。
          values:
            - value: Medium
              detail: 合同支撑需求，但园区层面的转化情况未披露。
            - value: High
              detail: 利用率下降会直接挤压盈利和债务指标。
            - value: Partial
              detail: 预租赁和高黏性合同可以缓释风险，但无法消除风险。
        - id: customer-concentration
          label: 客户集中度
          note: 前十大客户占 FY2025 营业收入的比例。
          values:
            - value: Medium
              detail: 集中度已有量化，但客户层面质量不可见。
            - value: High
              detail: 大客户流失可能影响经常性现金流。
            - value: Partial
              detail: 切换成本和中长期合同提供支撑。
        - id: power-and-cooling
          label: 电力与制冷
          note: 行业约束，加上公司已报道的制冷选择。
          values:
            - value: Medium
              detail: 电力可得性是整个行业的交付约束。
            - value: High
              detail: 没有可靠且经济的电力与制冷，容量就无法变现。
            - value: Partial
              detail: 有报道称公司开展可再生能源开发并签订购买协议，但证据并不完整。
        - id: partner-governance
          label: 合作伙伴与合资治理
          note: CPP 持有新园区合资项目 48% 的股权。
          values:
            - value: Medium
              detail: 尽管 CtrlS 持有多数股权，重大决策仍可能需要双方协调一致。
            - value: High
              detail: 僵局或融资延迟可能影响扩张节奏。
            - value: Early
              detail: 股权和承诺已公开；治理保护条款未公开。
        - id: competition
          label: 竞争容量
          note: ICRA 指出竞争激烈。
          values:
            - value: High
              detail: 新进入者和既有企业扩张已经可见。
            - value: Medium
              detail: 供给过剩会挤压利用率、定价和回报。
            - value: Partial
              detail: 过往记录和地域多元化提供一定优势。
    approximationNotes: 定性类别综合了引用事实；它们不是测量所得的概率或基准分数，也不主张每项行业约束都已在 CtrlS 身上发生。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR008
      - CR012
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 六步链条说明，强劲的需求证据为何仍不足以抵消价格和融资风险。
    data:
      nodes:
        - id: demand
          label: 合同需求
          detail: 据报道，新增大容量已预租给一家超大规模客户。
        - id: scale
          label: 快速扩张
          detail: 运营容量预计从 FY2026 的 150 MW 增至 FY2029 的 950-1,000 MW。
        - id: capital
          label: 巨额资本需求
          detail: FY2027-FY2028 资本开支预计为 ₹13,000-13,500 crore。
        - id: leverage
          label: 杠杆与再融资
          detail: 债务 / OPBDITA 可能超过 4x，项目债务包含三年期一次性还本安排。
        - id: price
          label: 完整价格锚点
          detail: 最新机构交易参考价约为 ₹44,824-45,000 crore。
        - id: recommendation
          label: 跟踪
          detail: 只有在价格折扣，或现金流和资本结构保护得到验证时，才继续推进。
      edges:
        - from: demand
          to: scale
        - from: scale
          to: capital
        - from: capital
          to: leverage
        - from: leverage
          to: price
        - from: price
          to: recommendation
    approximationNotes: 该流程是决策逻辑，不是量化估值模型；数值保留原始期间和分母。
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
