            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与质量
        blocks:
          - type: paragraph
            body: >-
              CtrlS 主要通过托管和托管主机获利：客户可以把自有机架式服务器放入共享或专用机架，也可以购买存储、备份、监控、采购和网络配置等托管服务。ICRA
              将这些流入描述为带明确涨价机制的中长期合同下的类年金收入流，这提高了收入可见性，也使存量容量成为核心商业资产。但客户集中削弱了这一质量：前十大客户约贡献 FY2025 合并营业收入的
              62%。公开来源没有披露机架标价或实际价格、签约电力费率、折扣、销售周期、流失、续约率，或托管与托管主机之间的收入构成。因此，该模式看起来具有经常性，但公开证据不足以支持对定价权和净收入留存率作投资判断。
