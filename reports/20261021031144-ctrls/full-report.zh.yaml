      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              扩张计划高度资本密集。ICRA 预计 FY2026-FY2028 资本开支为 ₹4,500-4,600 crore，其中 ₹3,000-3,500 crore 由债务融资，其余来自内部应计资金；预计中期总债务 /
              OPBDIT 为 3.5-4.0x，DSCR 为 1.6-1.9x。最近一次披露的流动性快照显示，截至 2025 年 3 月 31 日有 ₹204 crore 未受限制现金，而 FY2026 计划偿还债务为
              ₹200 crore，因此这不是当前资金跑道指标。另据披露，CPP Investments 为 8.2% 持股承诺 INR 40 billion，并为园区合资企业 48% 的权益承诺最多 INR 30
              billion；这是交易承诺，并不证明全部金额都是 CtrlS 资产负债表上的不受限制现金。2026 年 8 月的 ₹250-crore
              投资增加了资本，但公开证据仍未核对资金来源与用途、债务提款、契约、项目融资义务或当前现金可得性。
            claimRefs:
              - CI008
