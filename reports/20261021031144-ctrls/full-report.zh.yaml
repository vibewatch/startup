              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 投资论点、反论点与资本结构
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在签约需求和经营杠杆上。ICRA 预计运营容量将从 FY2026 的 150 MW 增至 FY2029 的 950-1,000 MW，并称新增的大容量已预租给一家超大规模云厂商；还预计 FY2026
              营业收入为 ₹1,900 crore，营业利润率为 50-52%。反论点是，同一建设计划需要 FY2027-FY2028 资本开支 ₹13,000-13,500 crore，其中 60-65% 预计来自债务，未来
              12-18 个月可能将债务 / OPBDITA 推高至 4x 以上。项目定期贷款含三年期一次性偿还安排，在新增容量仍处早期执行阶段时形成再融资暴露。₹7,000 crore 的 CPP 资金包 也分为两部分——向
              CtrlS 投入 ₹4,000 crore，以及向 52:48 合资企业投入最多 ₹3,000 crore——因此不能把融资额视为母公司不受限制的现金。后续 ₹250 crore
              投资增加资本，但仍需审阅优先权、契约、担保和未来稀释。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景、退出准备度与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              公开证据支持有条件的情景，而非精确的终值。乐观情景要求预租赁容量按时交付、收入持续增长 20-25%、利润率接近 ICRA 预期的 50-52%，且 DSCR 保持在预计 1.9-2.3x
              区间内；只有这样，估值高于最新一轮才有依据。基准情景将最新 ₹44,824-45,000 crore 参考值视为尽调上限，直到审阅经审计 FY2026
              业绩、项目层面现金流和完整债务明细。若交付延迟、利用率走弱、债务 / EBITDA 保持在 4x 以上，或一次性偿还债务无法再融资，悲观情景应相对该参考值大幅折价；公开记录无法支持数值底线。管理层讨论过一至三年内
              IPO，但尚未开始准备，因此退出时点仍是愿景而非投资判断。只有在披露股权结构表权利、合资经济性、签约订单、园区利用率、债务到期和下行流动性后，投资才应推进。
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
