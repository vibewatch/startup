      - number: '4.2'
        title: 已报告的盈利能力与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              ICRA 报告 FY2025 临时合并营业收入为 ₹1,567 crore，较 FY2024 增长约 17%，并计算 OPBDIT 占营业收入 49.6%，高于上年 46.7%。临时 PAT 为 ₹251
              crore，PAT 利润率为 16.0%，略低于经审计 FY2024 的 ₹256 crore 和 19.1%。BrokerChooser 另报 FY2025 营业收入 ₹1,561.8 crore、净利润
              ₹248.1 crore，并将其归因于 Ministry of Corporate Affairs 申报；在没有底层报表前，这些接近但不相同的数值不应合并。EMIS 还报告 2025 年净销售额增长
              16.64%、EBITDA 增长 23.75%，同时指出净利润率下降 2.61 个百分点。这些指标支持经营杠杆判断，但没有披露毛利率、按园区划分的利用率、每 MW 能源成本、维护资本开支或营运资本转化。
