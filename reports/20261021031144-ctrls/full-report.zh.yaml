      - 证据
      - 可能性
      - 严重性
      - 缓释成熟度
      - 残余暴露
    rows:
      - - 债务支持的建设跑在投产前面
        - ICRA 预计 FY2026-FY2028 资本开支为 Rs. 4,500-4,600 crore，其中 Rs. 3,000-3,500 crore 由债务融资。
        - High
        - High
        - 部分；长期债务和签约容量支撑覆盖能力。
        - 爬坡延迟可能压低资本回报和债务保障。
      - - 利用率不达预期
        - ICRA 将现有或新站点利用率下降列为负面评级因素。
        - Medium
        - High
        - 部分；中长期合同和预租提供一定保护。
        - 公司声称的汇总管线规模并未披露园区层面的入住率或签约电力转化率。
      - - 电力、冷却和环境约束
        - 行业证据提示电力约束；据报道的管理层评论称风冷能耗高，且传统淡水使用有限。
        - Medium
        - High
        - 部分；已有可再生能源项目和购电谈判的报道。
        - 电网可用性、能源成本和水资源约束仍因园区而异。
      - - 人才与设备瓶颈
        - Accenture 将人才短缺和供应链压力列为 2026 年数据中心约束。
        - Medium
        - Medium
        - 对 CtrlS 未验证；没有保留园区层面人员配置或关键设备计划。
        - 即使融资到位，投产日期也可能延后。
      - - 竞争性过度建设
        - ICRA 指出新进入者和现有运营商扩张带来的激烈竞争。
        - High
        - Medium
        - 部分；既有运营和城市多元化是缓释因素。
        - 如果供给先于需求到位，定价、利用率和回报可能承压。
    notes: 各行结合公司特定评级证据与明确标注的行业约束；没有任何一行把行业风险视为 CtrlS 已经发生故障的证据。
    claimRefs:
