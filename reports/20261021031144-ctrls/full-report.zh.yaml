      - number: '7.4'
        title: 交易对手、缓释措施与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              CPP 交易引入了重要资本伙伴：CPP Investments 承诺最多投入 INR 70 billion，分别用于取得 8.2% 的直接股权和设立独立合资企业。2026
              年新增股权融资也明确用于基础设施扩张。这些承诺降低了近期融资风险，但现金提款条件、CtrlS 的配套出资义务、债务契约和延期补救措施均未披露。若 DSCR 持续低于 1.5、总债务 / EBITDA 持续高于
              4、利用率明显下降、新站点未达到通电或预租赁里程碑，或大客户敞口上升却没有更强的合同保护，就应暂停投资判断。监测指标应包括季度杠杆与偿债覆盖率、签约容量与已投运容量、前十大客户收入集中度、合作方资金提款进度、重大停机、监管通知和管理层整改日期。
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 论点失效纪律
            body: 将 DSCR 持续低于 1.5、总债务 / EBITDA 高于 4、利用率显著下降、错过通电或预租赁里程碑，或重大安全及监管事件未解决，视为暂停条件，直到有整改证据。
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议是持续跟踪，而不是买入。CPP Investments 的直接投资提供了可信的市场成交参考：VCCircle 报道以 ₹44,824 crore 投前估值、₹4,000 crore 获得 8.2%；Mint
              则称交易估值为 $4.8 billion，即约 ₹45,000 crore。这比无依据的模型标记强得多，但不能证明新投资者能以同一价格获得有吸引力的回报。将 ₹45,000 crore 的表面价值除以
              FY2025 ₹1,562 crore 营业收入，得到 28.8x 的示意性市值 / 营业收入比；这不是 EBITDA
              或股权回报倍数，也未调整净债务、独立合资企业、优先权或稀释。只有预租赁容量按时交付并转化为现金流且不损害偿付覆盖，这一溢价才可能成立。因此，公开证据支持偏高的估值判断、中等建议置信度和高执行 /
              融资风险，而非精确的目标回报。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
