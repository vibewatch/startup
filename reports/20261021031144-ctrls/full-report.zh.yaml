      - CR009
      - CR010
      - CR011
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 市场上存在真实的机构交易价格，但公开回报测算所需信息仍不完整。
        - 在完成入场条款和债务尽调前，不要为新仓位做投资判断。
      - - 信心
        - 中等
        - 交易价值和经审计的 FY2025 指标可见；股权结构表权利和项目现金流不可见。
        - 使用有条件的里程碑，而不是单点目标。
      - - 风险评级
        - 高
        - 扩张高度依赖债务，并暴露于执行风险和三年期一次性再融资压力。
        - 要求审查契约、到期结构和下行情景下的流动性。
      - - 估值立场
        - 偏高
        - 标题估值约为 FY2025 营业收入的 28.8 倍，这是一个示意性的非 EBITDA 比率。
        - 要求折价，或拿出合同现金流转化的证据。
    notes: 评估采用 2026 年 6 月融资参考价和 FY2025 营业收入；示意性比率不含净债务、优先权和合资经济利益。
    claimRefs:
      - CV001
      - CV006
      - CV009
      - CV010
      - CV012
      - CV015
  - id: TV002
    title: 正反论点
    columns:
      - 立场
      - 论点
      - 证据
      - 会改变判断的因素
    rows:
      - - 正方
        - 合同容量可以推动快速扩张。
        - ICRA 预计容量将从 FY2026 的 150 MW 增至 FY2029 的 950-1,000 MW，新增大容量项目已有预租赁。
        - 租户质量、可执行的照付不议条款和交付里程碑，会强化这一判断。
      - - 正方
        - 经营杠杆可能支撑债务偿付。
        - ICRA 预计 FY2026 营业收入为 ₹1,900 crore，经营利润率为 50-52%。
        - 经审计的 FY2026 现金转化达到或超过该估计值，将提升信心。
      - - 反方
        - 资本密集度可能吞噬股权上行空间。
        - FY2027-FY2028 资本开支预计为 ₹13,000-13,500 crore，其中 60-65% 由债务融资。
        - 降低债务占比，或获得大额租户预付款，都能降低风险。
      - - 反方
        - 执行和再融资可能击穿这套逻辑。
        - ICRA 指出执行仍处早期，并存在三年期一次性还本压力。
        - 将债务展期、落实已承诺但尚未提款的授信额度，并按时交付，可降低风险。
    notes: 前瞻数据均为 ICRA 估计，仍取决于合同容量、执行进度、融资可得性和客户表现。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观、中性和悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 概率信号
      - 下行或上行触发因素
    rows:
      - - 乐观
        - 预租赁容量按时交付；收入增长 20-25%；经营利润率维持在 50-52% 附近；DSCR 保持 1.9-2.3x。
        - 只有现金流转化得到验证后，超过 ₹44,824-45,000 crore 轮次参考价的估值才有支撑；公开信息无法合理证明上限。
        - 里程碑由外部明确设定，但在计划规模上尚未得到验证。
        - 经审计的交付和现金转化，且杠杆没有恶化。
      - - 中性
        - 增长延续，但新容量爬坡期间，资本开支和杠杆仍处高位。
        - 将最新轮次参考价视为尽调上限，而不是回报目标；要求入场折价或更优权利。
        - 与现有稳定评级和披露的融资计划最为一致。
        - FY2026 审计、项目现金流、股权结构表和完整债务计划。
      - - 悲观
        - 交付延期、利用率下降，或再融资条款恶化。
        - 必须相对最新轮次大幅折价；公开证据无法支持一个数值下限。
        - ICRA 明确指出执行、再融资和杠杆降级触发因素。
        - DSCR 持续低于 1.5x，或债务 / EBITDA 持续高于 4x。
    notes: 这些是围绕最新披露交易的条件估值区间，不是按概率加权的预测；由于入场权利、净债务和退出假设缺失，无法精确计算回报区间。
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
