      - number: '3.2'
        title: CtrlS 定位与差异化持久性
        blocks:
          - type: paragraph
            body: >-
              当前 2026 年报道称，CtrlS 在印度九个市场运营 19 座数据中心，管理超过 370 MW 的容量，并推进处于不同执行阶段的 4.4 GW 项目。这些数字不能直接与 ICRA 关于 2025 年 8
              月运营容量约 130 MW 的较窄表述互换。最有力的防御性证据来自运营而非宣传：ICRA
              提到多元化城市布局、中长期合同、明确的涨价机制及与停机相关的迁移成本。这会形成客户黏性，但合同到期时并不能消除多云部署或重新竞标。CPP Investments
              的资本支持强化了扩张路径，但本身不能证明交付、利用率或回报更优。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.3'
        title: 能力、产品组合与定价证据
        blocks:
          - type: paragraph
            body: >-
              保留的公开证据支持 CtrlS 将托管与托管主机结合，但没有提供 CtrlS
              或指定竞争者可比的印度标价、实际合同费率、服务等级抵扣、交叉连接费、电力转嫁费或折扣表。因此，矩阵区分已支持事实与未知单元格，而不是把缺失数据转换成评分。大型容量公告衡量的对象也不同：当前托管或运营容量、预融资项目、定制建设新增容量及未来版图目标。采购尽调应先统一
              IT 负载、投产日期、冗余等级、电力成本、机架密度、合同期限和总成本，再判断哪家运营商更便宜或更有能力。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
