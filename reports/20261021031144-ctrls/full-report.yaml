  - id: FM001
    title: Non-additive capacity sizing ladder
    type: pyramid
    summary: >-
      Six same-unit capacity points show the scale difference between national forecasts, AI-only forecasts, and CtrlS
      figures without presenting them as a revenue TAM/SAM/SOM.
    data:
      items:
        - label: India total need, upper bound
          value: 20
          unit: GW
          detail: Management estimate reported for the five years following June 2026.
        - label: India total need, lower bound
          value: 18
          unit: GW
          detail: Lower endpoint of the same management estimate.
        - label: India AI-dedicated forecast
          value: 6.5
          unit: GW
          detail: Wood Mackenzie projection for 2030 as cited by ET DataCenter.
        - label: CtrlS additional-capacity target
          value: 4
          unit: GW
          detail: Company target reported by BrokerChooser; not delivered capacity.
        - label: CtrlS active capacity
          value: 0.37
          unit: GW
          detail: 370 MW reported in 2026 coverage.
        - label: India AI-dedicated baseline
          value: 0.275
          unit: GW
          detail: 275 MW for 2025 as cited by ET DataCenter.
    approximationNotes: >-
      The 370 MW and 275 MW values are divided by 1,000 to display GW. Endpoints, periods, issuers, and definitions
      remain distinct; the descending layout indicates scale only and does not imply nesting, additivity, or conversion.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM016
  - id: FP001
    title: Evidence-backed competitive positioning map
    type: quadrant
    summary: >-
      Ordinal placement reflects only the expansion and service-breadth evidence in the assigned pool; it is not market
      share, quality, price or customer preference.
    data:
      xAxis:
        label: Publicly evidenced India expansion signal (ordinal)
        min: 0
        max: 5
        lowLabel: Limited retained signal
        highLabel: Large retained signal
        description: Analyst ordinal from quantified India capacity commitments or targets in retained sources.
      yAxis:
        label: Publicly evidenced service breadth (ordinal)
        min: 0
        max: 5
        lowLabel: Not detailed in pool
        highLabel: Multiple services evidenced
        description: Analyst ordinal from services explicitly described in retained sources, not assumed capability.
      points:
        - label: CtrlS
          x: 5
          'y': 5
          detail: 4.4 GW project pipeline; colocation and managed hosting explicitly described.
        - label: NTT
          x: 4
          'y': 1
          detail: 500 MW Mumbai signal; service breadth not detailed in the retained pool.
        - label: STT GDC
          x: 3
          'y': 1
          detail: 100 MW Chennai build-to-suit signal; service breadth not detailed.
        - label: Nxtra
          x: 4
          'y': 1
          detail: 800 MW 2028 target; service breadth not detailed.
        - label: Equinix
          x: 1
          'y': 1
          detail: Named industry leader; no quantified India expansion or service detail retained.
        - label: Sify
          x: 2
          'y': 1
          detail: Named industry leader with retrofit activity; total expansion and service detail not retained.
    approximationNotes: >-
      Ordinal scores are transparent evidence-availability indicators, not measured performance; unmatched metrics and
      missing competitor disclosures prevent a quantitative market-position comparison.
    claimRefs:
