      Operating history progressed from a founder-led Hyderabad launch to institutional financing and a multi-gigawatt
      company-reported development pipeline.
    data:
      items:
        - date: '2007'
          label: Founding date reported
          detail: VCCircle reports CtrlS was founded in 2007; another source describes establishment in 2008.
          tone: neutral
          claimRefs:
            - CO001
            - CO002
        - date: '2009'
          label: First data centre begins operations
          detail: ICRA and VCCircle place the first operating data centre in Hyderabad in 2009.
          tone: positive
          claimRefs:
            - CO002
        - date: 2025-08
          label: ICRA measures 130 MW operational
          detail: ICRA reports about 130 MW of operational capacity as of August 2025.
          tone: neutral
          claimRefs:
            - CO005
        - date: '2025-09-30'
          label: Credit rating upgraded
          detail: >-
            ICRA upgrades the long-term rating to AA (Stable) while identifying debt-funded capex and competition as
            challenges.
          tone: warning
          claimRefs:
            - CO012
            - CO013
            - CO014
        - date: '2026-06-17'
          label: CPP takes direct minority stake
          detail: CPP commits INR 40 billion for an 8.2% direct equity interest in CtrlS.
          tone: positive
          claimRefs:
            - CO008
        - date: '2026-06-17'
          label: Hyperscale campus JV announced
          detail: CPP commits up to INR 30 billion for 48% of a JV in which CtrlS retains 52%.
          tone: positive
          claimRefs:
            - CO009
        - date: '2026-08-19'
          label: Founder-investor financing closes
