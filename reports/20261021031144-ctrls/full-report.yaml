              - CU004
              - CU014
              - CU015
              - CU016
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              ICRA's September 2025 rating rationale provides the clearest durability evidence: it characterizes
              retention as healthy, attributes stickiness to customer investments and switching-related downtime risk,
              and describes an annuity-like stream supported by medium-to-long-term contracts. However, it reports no
              NRR, GRR, churn, renewal rate, cohort curve, or customer-satisfaction measure. The same source says the
              top ten customers generated about 62% of FY2025 consolidated operating income, making concentration
              material even though customer names and individual shares remain private. Expansion can occur through
              pre-leased capacity, additional sites, and managed services, but demand claims in company and investor
              releases are not substitutes for signed backlog or realized utilization. A 2026 independent analysis also
              warns that grid availability could constrain delivery, linking customer expansion to site-level power
              access rather than capital alone.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU009
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU011
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pre-leasing is the strongest adoption signal
            body: >-
              ICRA reported that planned 40-45 MW annual additions over the following three years were completely
              pre-leased, a more decision-useful indicator than logo or capacity claims.
            calloutType: strength
            claimRefs:
              - CU007
          - type: callout
            title: Concentration is material but opaque
            body: >-
              The top ten customers generated about 62% of FY2025 consolidated operating income, but neither individual
              customer shares nor current renewal and churn metrics are public.
            calloutType: risk
            claimRefs:
              - CU004
              - CU014
