chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              CtrlS Datacenters Limited is a Hyderabad-based operator of colocation and managed infrastructure services.
              The operating history is clear even though the founding label is not: VCCircle describes the company as
              founded in 2007, while ICRA says it was established in 2008 and began operating its first Hyderabad data
              centre in 2009. The distinction should be resolved against incorporation records before publication-grade
              use, but it does not alter the evidence that CtrlS has operated data-centre infrastructure since 2009. Its
              model combines customer-owned equipment housed in CtrlS facilities with managed hosting, storage, backup,
              monitoring, procurement, and network-configuration services. This is an asset-heavy, recurring-contract
              model rather than a pure software subscription business.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO016
      - number: '1.2'
        title: Scale, demand exposure, and metric reconciliation
        blocks:
          - type: paragraph
            body: >-
              Multiple 2026 reports put the footprint at 19 operating data centres across nine Indian markets. Capacity
              is less comparable. ICRA measured about 130 MW of operational capacity in August 2025, whereas 2026
              coverage and a founder interview describe more than 370 MW of live or managed capacity and more than 4 GW
              in development. Timing may explain part of the jump, but the sources do not reconcile IT load, facility
              power, owned versus managed capacity, or commissioned versus contracted megawatts. The development
              pipeline is therefore best read as a company-reported ambition, not delivered capacity. Customer breadth
              is also presented only through selected cohorts: the company says it serves over 60 Fortune 500 companies
              and five of the seven largest hyperscalers, while ICRA reports that the top ten customers generated about
              62% of FY2025 consolidated operating income.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO013
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
              - CO014
      - number: '1.3'
        title: Capital structure and ownership inflection
        blocks:
          - type: paragraph
            body: >-
              The June 2026 CPP Investments partnership changed the ownership and financing profile. CPP committed INR
              40 billion for an 8.2% direct stake and up to INR 30 billion for 48% of a separate hyperscale-campus joint
              venture, with CtrlS retaining 52% of that vehicle. These are distinct commitments and should not be
              collapsed into cash available to the parent. VCCircle reported an approximately INR 44,824 crore pre-money
              valuation, broadly consistent with separate reporting of about US$4.8 billion. In August, Nikhil Kamath
              and Sreeram Reddy Vanga added INR 200 crore and INR 50 crore respectively. Those transactions provide
              fresh capital, but the available sources do not produce a reliable cumulative raised figure across equity,
              debt, repurchased historical stakes, and the JV.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
      - number: '1.4'
        title: Governance, financial posture, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Founder and CEO Sridhar Pinnapureddy remains the central public decision-maker across financing, build
              strategy, capacity claims, and international expansion. Tracxn lists nine active directors, including
              Pinnapureddy and eight independent directors, but the accessible evidence does not establish the current
              committee structure, investor consent rights, or the CPP nominee arrangement. Financially, ICRA reported
              provisional FY2025 operating income of INR 1,567 crore, up about 17%, alongside a 49.6% operating margin.
              The same rating analysis projected INR 4,500-4,600 crore of FY2026-FY2028 capex, substantially
              debt-funded, and flagged competition and moderate returns on capital. The founder-led operating model has
              delivered scale, but investors should treat governance rights, succession depth, capex controls, and
              customer concentration as linked diligence priorities.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional capital is split across parent and project vehicles
            body: >-
              CPP's headline commitment contains INR 40 billion of direct parent equity and up to INR 30 billion for a
              separately owned campus joint venture. Diligence should model control, cash access, and returns at each
              entity rather than treating INR 70 billion as one unrestricted raise.
            calloutType: insight
            claimRefs:
              - CO008
              - CO009
          - type: callout
            title: Scale claims outrun disclosure comparability
            body: >-
              The move from 130 MW operational in August 2025 to more than 370 MW live or managed in 2026 may reflect
              commissioning and scope changes, but assigned sources do not provide a bridge. Site-level IT load,
              utilization, ownership, and contracted capacity are required.
            calloutType: risk
            claimRefs:
              - CO005
              - CO006
              - CO007
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              CtrlS participates in Indian data-center infrastructure through colocation, managed hosting, and planned
              hyperscale campuses. The core market boundary is third-party capacity sold with power, physical space,
              connectivity, and operating services; managed storage, backup, monitoring, procurement, and network
              configuration are adjacent services that can expand wallet share. Renewable generation, cooling equipment,
              construction, and skilled labor are enabling inputs rather than data-center service revenue. Public-cloud
              services are both a demand source and a substitute: hyperscalers may lease external capacity, while
              enterprises can choose cloud capacity, internal server rooms, or outsourced colocation. This boundary
              avoids counting the entire digital economy as CtrlS-addressable spend and keeps buyer decisions tied to
              capacity, reliability, localization, and managed operations.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM013
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The source set does not provide a comparable revenue TAM. Instead, it offers capacity lenses with
              different definitions and periods. One report relays a management estimate that India may need 18–20 GW
              within five years, while an industry article cites Wood Mackenzie for AI-dedicated capacity rising from
              275 MW in 2025 to 6.5 GW by 2030. Company-scale figures also diverge: 2026 reports describe 370 MW active
              capacity and a 4 GW additional-capacity target, whereas ICRA measured about 130 MW operational in August
              2025. These figures may reflect growth, IT-load versus broader capacity definitions, or portfolio scope,
              but the sources do not reconcile them. The chart normalizes MW to GW only for display; it does not treat
              the values as additive or as nested TAM/SAM/SOM layers.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidenced demand base spans hyperscalers, cloud providers, BFSI, enterprises, e-commerce, telecom,
              government, IT firms, and smaller businesses. Procurement differs by segment: hyperscalers and cloud
              providers buy large contracted capacity, while regulated enterprises emphasize reliability, localization,
              and managed operations. The likely budget owners are infrastructure, technology, or operations teams, but
              the public sources do not identify CtrlS customers' approval chains, contract sizes, or procurement
              cycles; those fields remain analytical inferences rather than verified facts. Adoption is helped by
              medium-to-long-term contracts and high switching costs created by customer investment and downtime risk.
              The same stickiness can lengthen initial sales and migration because workloads, controls, and network
              architecture must move without interruption.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM014
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are directionally strong: CPP Investments points to hyperscale, domestic cloud, and AI
              demand, while ICRA adds data growth, mobile and internet penetration, e-commerce, 5G, localization, and
              policy support. Capacity does not convert automatically into attractive economics. ICRA expects CtrlS to
              fund a large FY2026–FY2028 build largely with debt, warns that utilization can lag additions, and
              identifies stiff competition from entrants and incumbent expansion. Accenture separately highlights power,
              talent, supply-chain, and regulatory bottlenecks across the sector. For valuation, the critical
              underwriting variables are contracted utilization, realized price per unit of capacity, power availability
              and cost, build timing, and leverage—not the broadest national forecast. Those variables remain more
              decision-useful than a headline market-size multiple until comparable revenue and utilization data are
              obtained.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity forecasts are not bankable demand
            body: >-
              Debt-funded build, utilization lag, new entry, power constraints, and unreconciled capacity definitions
              can make a large demand forecast coexist with weak project returns. Underwriting should require contracted
              utilization, power availability, and project-level economics.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The direct operator set is broad rather than binary. Mordor Intelligence identifies NTT, STT GDC, Nxtra,
              Sify and Equinix among industry leaders and describes the market as moderately concentrated, while
              BrokerChooser places CtrlS among India's top four operators alongside NTT, Equinix and STT Telemedia.
              Buyers can also choose wholesale or retail colocation, hyperscaler-owned facilities, enterprise
              self-builds, legacy on-premise estates, or delay migration. These alternatives compete on different
              economics: operators sell capacity and services, whereas self-build substitutes ownership and control for
              capital intensity and execution risk. The retained pool therefore supports a competitor-class map, not a
              definitive market-share ranking.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
