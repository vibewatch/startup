              - CE015
      - number: '5.4'
        title: Reliability, controls, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              CtrlS's industry profile states a 99.995% uptime SLA and "military-grade, 9-zone" security, but the
              assigned evidence contains no independent availability series, incident register, penetration-test result,
              control audit, certification scope, or recovery exercise. These remain company claims rather than verified
              operating outcomes. Roadmap ambition is substantial: current reporting cites a 4.4 GW project pipeline,
              and the CPP Investments partnership adds capital and a joint-venture vehicle for hyperscale campuses.
              Execution risk rises with that scale. ICRA expects continuous capacity additions, a lag before ramp-up,
              and moderate returns on capital during the build cycle. Product diligence should therefore test whether
              designs, operating teams, commissioning controls, and security governance can scale at the same pace as
              announced capacity, not infer technical readiness from financing or pipeline size.
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is supported more strongly than proprietary technology
            body: >-
              Public evidence supports an operating portfolio spanning colocation, managed infrastructure, hyperscale,
              edge, connectivity, and AI-oriented capacity, reinforced by contracted demand and a long operating
              footprint.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE014
          - type: callout
            title: Technical assurance remains mostly private
            body: >-
              The retained sources do not independently verify architecture, facility-level efficiency, security
              certifications, incident history, realized uptime, or support performance, so technical readiness should
              be tested through a data-room review.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              The public record points to a multi-segment infrastructure customer base rather than a single-industry
              colocation business. VCCircle describes global cloud providers, large enterprises, small and medium
              businesses, technology companies, and BFSI customers, while ICRA adds hyperscalers, e-commerce, telecom,
              government, and IT firms. Those buyers can purchase either colocation, where customers place their own
              servers in shared or dedicated racks, or managed hosting services such as storage, backup, monitoring,
              procurement, and network configuration. KPMG's sector analysis adds a demand mechanism: data-localisation
              and procurement requirements increase the need for domestic infrastructure and compliance support. This
              breadth reduces dependence on one vertical, but public sources do not show revenue by segment, geography,
              service line, or customer size, so the table is a market map rather than a revenue mix.
            claimRefs:
              - CU001
              - CU002
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption and reference quality
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is strongest at the capacity-contract level and weakest at the named-customer level.
              ICRA reported that CtrlS's planned annual capacity additions were completely pre-leased and that customers
              used medium-to-long-term contracts with defined escalations. CPP Investments separately described
              significant contracted capacity, long-term customer relationships, and a growing development pipeline. An
              executive interview published by MIT Sloan Management Review India says CtrlS serves more than 60 Fortune
              500 companies and five of the world's top seven hyperscalers, but the customers are not named and the
              statement is not independently customer-confirmed. Likewise, the 2026 footprint of 19 data centres, nine
              markets, and more than 370 MW indicates delivery scale, not utilization, active usage, production status,
              or customer outcomes. No retained source supports converting that installed capacity into a customer
              count.
            claimRefs:
              - CU003
              - CU005
              - CU007
              - CU008
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
