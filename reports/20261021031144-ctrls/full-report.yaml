  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk view
        blocks:
          - type: paragraph
            body: >-
              The highest-evidence residual risk is financing and delivery of the expansion program, not a documented
              compliance event. ICRA expects Rs. 4,500-4,600 crore of capex during FY2026-FY2028, funded with Rs.
              3,000-3,500 crore of debt plus internal accruals, and expects returns on capital to remain moderate while
              new capacity ramps. Its explicit downside markers are sustained DSCR below 1.5 times or total debt/EBITDA
              above 4 times. Customer concentration is also material: the top ten customers represented about 62% of
              FY2025 consolidated operating income. These facts make utilization, leverage, construction delivery, and
              renewals the primary monitoring stack. The heatmap ranks exposure from disclosed metrics; it does not
              imply that the public record establishes probability estimates for incidents that have not been disclosed.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR008
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Publicly retained evidence does not establish a current lawsuit, enforcement action, breach, outage,
              certification failure, or license deficiency. That absence is an evidence gap rather than proof that no
              such event exists. The confirmed structural exposures are cross-entity and partnership-related: ICRA
              reports corporate guarantees for loans of two subsidiaries, while CPP Investments will own 48% of a new
              campus joint venture and CtrlS 52%. The announcement does not disclose reserved matters, deadlock
              mechanisms, construction guarantees, data-protection controls, or allocation of environmental and
              permitting liabilities. Investment diligence should therefore obtain the current litigation and regulator
              schedule, security incident register, certifications, insurance limits, material permits, guarantee
              schedule, and executed JV documents before treating the legal and governance risk as mitigated.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR016
      - number: '7.3'
        title: Operational and financial execution
        blocks:
          - type: paragraph
            body: >-
              CtrlS is attempting to scale from an already large footprint into a multi-gigawatt pipeline.
              Company-originated reporting describes 19 facilities, more than 370 MW of capacity, and 4.4 GW of projects
              at various stages, while the 2025 ICRA rating analysis used a narrower operational-capacity measure and
              highlighted lagged returns during commissioning. Industry evidence adds power availability, scarce
              technical talent, supply-chain pressure, and regulatory friction to the delivery risk set. BrokerChooser
              also reported management's acknowledgement that newer air-cooled installations are energy-intensive and
              that the earliest facilities retain legacy freshwater cooling. Mitigation should be tested campus by
              campus through energization dates, contracted power, equipment lead times, pre-leasing, commissioning
              performance, water intensity, and operating-incident records rather than inferred from aggregate pipeline
              size.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Counterparties, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The CPP transaction provides a meaningful capital partner: CPP Investments committed up to INR 70 billion,
              split between an 8.2% direct stake and a separate joint venture. Additional 2026 equity was explicitly
              earmarked for infrastructure expansion. Those commitments reduce near-term funding risk but do not
              disclose cash-draw conditions, CtrlS's matching-capital obligation, debt covenants, or remedies for
              delays. The investment thesis should be paused if sustained DSCR falls below 1.5 times, total debt/EBITDA
              remains above 4 times, utilization materially declines, new sites miss energization or pre-lease
              milestones, or top-customer exposure rises without stronger contractual protection. Monitoring should
              combine quarterly leverage and coverage, signed-versus-live capacity, top-ten revenue concentration,
              partner funding drawdowns, material outages, regulatory notices, and management remediation dates.
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break discipline
            body: >-
              Treat sustained DSCR below 1.5 times, total debt/EBITDA above 4 times, materially lower utilization,
              missed energization or pre-lease milestones, or an unresolved material security or regulatory event as a
              pause condition pending remediation evidence.
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track rather than buy. CPP Investments' direct investment supplies a credible
              market-clearing reference: VCCircle reported ₹4,000 crore for 8.2% at a ₹44,824 crore pre-money valuation,
              while Mint described the transaction as a $4.8 billion, roughly ₹45,000 crore valuation. That is
              substantially stronger evidence than an unsupported model mark, but it is not proof that a new investor
              can earn an attractive return at the same price. Using the ₹45,000 crore headline value against FY2025
              operating income of ₹1,562 crore produces an illustrative 28.8x price-to-operating-income ratio; this is
              not an EBITDA or equity-return multiple and does not adjust for net debt, the separate joint venture,
              preferences, or dilution. The premium can work only if pre-leased capacity is delivered on time and
              converts into cash flow without impairing coverage. Public evidence therefore supports a stretched stance,
              medium recommendation confidence, and high execution/financing risk, not a precise target return.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV010
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Thesis, anti-thesis, and capital structure
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on contracted demand and operating leverage. ICRA expects operational capacity to rise
              from 150 MW in FY2026 to 950-1,000 MW by FY2029 and says the incremental large capacity is pre-leased to a
              hyperscaler. It also estimates FY2026 operating income of ₹1,900 crore with 50-52% operating margins. The
              anti-thesis is that the same build-out requires ₹13,000-13,500 crore of FY2027-FY2028 capital expenditure,
              with 60-65% expected from debt, and could push debt/OPBDITA above 4x over the next 12-18 months. Project
              term loans include three-year bullet repayments, creating refinancing exposure while new capacity remains
              in early execution. The ₹7,000 crore CPP package also has two distinct components—₹4,000 crore into CtrlS
              and up to ₹3,000 crore into a 52:48 joint venture—so funding raised must not be treated as unrestricted
              parent-company cash. A later ₹250 crore investment adds capital but does not remove the need to inspect
              preferences, covenants, security, and future dilution.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports conditional scenarios, not precise terminal values. The bull case requires
              on-time delivery of pre-leased capacity, sustained 20-25% revenue growth, margins near ICRA's 50-52%
              expectation, and DSCR remaining within the projected 1.9-2.3x range; only then would a value above the
              latest round be defensible. The base case holds the latest ₹44,824-45,000 crore reference as a ceiling for
              diligence until audited FY2026 results, project-level cash flows, and the full debt schedule are reviewed.
              The bear case is a material discount to that reference if delivery slips, utilization weakens, debt/EBITDA
              stays above 4x, or bullet debt cannot be refinanced; the public record cannot support a numeric floor.
              Management has discussed an IPO in one to three years but had not begun preparations, so exit timing is
              aspirational rather than underwritten. Investment should advance only after cap-table rights, JV
              economics, contracted backlog, campus utilization, debt maturities, and downside liquidity are disclosed.
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment decision
            body: >-
              Track pending audited FY2026 results, complete debt and cap-table terms, project-level contracted cash
              flows, and an entry price that compensates for execution and refinancing risk.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV012
              - CV015
