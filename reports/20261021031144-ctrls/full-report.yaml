      - number: '3.2'
        title: CtrlS positioning and differentiation durability
        blocks:
          - type: paragraph
            body: >-
              Current 2026 reporting describes CtrlS as operating 19 data centers across nine Indian markets, managing
              more than 370 MW of capacity and pursuing 4.4 GW of projects at different execution stages. Those figures
              are not directly interchangeable with ICRA's narrower statement that operational capacity was about 130 MW
              in August 2025. The strongest defensibility evidence is operational rather than promotional: ICRA cites a
              diversified city footprint, medium-to-long-term contracts, defined escalations and downtime-related
              switching costs. That creates customer stickiness, but does not eliminate multi-homing or recompetition
              when contracts expire. Capital backing from CPP Investments strengthens the expansion path; it does not
              itself prove superior delivery, utilization or returns.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.3'
        title: Capability, packaging and pricing evidence
        blocks:
          - type: paragraph
            body: >-
              Publicly retained evidence supports CtrlS's combination of colocation and managed hosting, but it does not
              provide comparable India list prices, realized contract rates, service-level credits, cross-connect fees,
              power pass-throughs or discount schedules for CtrlS or the named competitors. The matrix therefore
              distinguishes supported facts from unknown cells rather than converting missing data into scores. Large
              capacity announcements also measure different things: current managed or operational capacity, pre-funded
              projects, build-to-suit additions and future footprint targets. Procurement diligence should normalize IT
              load, commissioned dates, redundancy tier, power cost, rack density, contract tenor and total cost before
              concluding that any operator is cheaper or more capable.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              CtrlS's moat is strongest where customers value migration avoidance, long contracts, geographic coverage
              and a provider able to fund capacity ahead of demand. It is weakest where capacity, renewable power,
              liquid cooling and delivery speed become standardized procurement criteria. ICRA explicitly flags stiff
              competition from large additions, new entrants and incumbent expansion, while Mordor describes competitors
              using scale capital, captive telco demand, renewable-linked contracts and retrofit programs. Hyperscaler
              self-builds are a further substitute for the largest buyers. The evidence supports a durable
              switching-cost advantage at the installed base, but not a permanent pricing or technology moat for new
              capacity.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Installed-base switching costs are the clearest moat evidence
            body: >-
              ICRA links customer stickiness to customer investment, downtime risk and medium-to-long-term contracts
              with defined escalations; this is stronger evidence than generic claims of scale or reliability.
            calloutType: strength
            claimRefs:
              - CP013
              - CP014
          - type: callout
            title: Expansion capital does not remove competitive execution risk
            body: >-
              ICRA flags large capacity additions, new entrants and incumbent expansion as stiff competition, so the
              CPP-backed build-out must still convert into timely, well-utilized capacity at acceptable returns.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and quality
        blocks:
          - type: paragraph
            body: >-
              CtrlS principally earns through colocation and managed hosting: customers either place their own
              rack-mounted servers in shared or dedicated racks, or buy managed services such as storage, backup,
              monitoring, procurement and network configuration. ICRA describes the resulting inflows as an annuity-like
              stream under medium-to-long-term contracts with defined escalations, which improves revenue visibility and
              makes installed capacity the central commercial asset. That quality is tempered by concentration: the top
              ten customers generated about 62% of consolidated FY2025 operating income. Public sources do not disclose
              list or realized rack pricing, contracted power rates, discounts, sales cycles, churn, renewal rates or
              the mix between colocation and managed services. The model therefore appears recurring, but pricing power
              and net revenue retention cannot be underwritten from public evidence.
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
