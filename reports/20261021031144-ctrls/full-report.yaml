        - Audited FY2026 cash conversion at or above the estimate would strengthen confidence.
      - - Anti-thesis
        - Capital intensity can absorb equity upside.
        - FY2027-FY2028 capex is projected at ₹13,000-13,500 crore with 60-65% debt funding.
        - Lower debt share or substantial tenant prepayments would reduce risk.
      - - Anti-thesis
        - Execution and refinancing can break the thesis.
        - ICRA identifies nascent execution and three-year bullet repayment exposure.
        - Termed-out debt, committed undrawn facilities, and on-time handovers would reduce risk.
    notes: >-
      Forward figures are ICRA estimates and remain conditional on contracted capacity, execution timing, financing
      availability, and customer performance.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation and return logic
      - Probability signal
      - Downside or upside trigger
    rows:
      - - Bull
        - >-
          Pre-leased capacity is delivered on time; revenue grows 20-25%; operating margin stays near 50-52%; DSCR
          remains 1.9-2.3x.
        - >-
          A value above the ₹44,824-45,000 crore round reference becomes supportable only after cash-flow conversion; no
          public upper bound is defensible.
        - Milestones are externally specified but not yet demonstrated at the planned scale.
        - Audited delivery and cash conversion without leverage deterioration.
      - - Base
        - Growth continues but capex and leverage remain elevated while new capacity ramps.
        - >-
          Treat the latest round reference as a diligence ceiling, not a return target; require entry discount or
          superior rights.
        - Most consistent with the available stable rating and disclosed financing plan.
        - FY2026 audit, project cash flows, cap table, and full debt schedule.
      - - Bear
        - Delivery slips, utilization falls, or refinancing occurs on adverse terms.
        - A material discount to the latest round is required; public evidence does not support a numeric floor.
        - ICRA explicitly identifies execution, refinancing, and leverage downgrade triggers.
        - DSCR below 1.5x or debt/EBITDA above 4x on a sustained basis.
    notes: >-
      These are conditional valuation bands around the latest disclosed transaction, not probability-weighted forecasts;
      missing entry rights, net debt, and exit assumptions preclude precise return ranges.
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
