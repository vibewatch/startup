      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: Contract-led revenue and reinvestment flow
    type: flow
    summary: >-
      Public evidence traces customer demand through contracted services to operating profit and reinvestment; it does
      not disclose gross profit or customer-level unit economics.
    data:
      nodes:
        - id: customer-demand
          label: Hyperscaler, enterprise and BFSI demand
          detail: The top ten customers represented about 62% of FY2025 operating income.
        - id: contracts
          label: Medium-to-long-term contracts
          detail: Defined escalations and switching friction support recurring inflows.
        - id: delivery
          label: Colocation and managed hosting
          detail: Rack capacity is paired with optional infrastructure and managed services.
        - id: rental-inflows
          label: Stable annuity-like inflows
          detail: ICRA characterizes the contracted cash stream as stable; realized pricing is private.
        - id: operating-income
          label: FY2025 operating income
          value: ₹1,567 crore
          detail: ICRA provisional consolidated operating income, about 17% above FY2024.
        - id: operating-profit
          label: FY2025 OPBDIT/OI
          value: 49.6%
          detail: Operating profitability before depreciation, interest and tax; gross margin was not disclosed.
        - id: reinvestment
          label: Capacity reinvestment
          detail: Internal accruals and planned debt support FY2026-FY2028 capex.
    approximationNotes: This is an evidence-backed mechanism flow, not a proportional financial bridge or a gross-profit reconciliation.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI007
      - CI008
  - id: FE001
    title: Source-bounded product architecture map
    type: stack
    summary: >-
      The stack distinguishes customer demand, service surfaces, facility delivery, physical systems, controls, and
      expansion rather than implying unverified component designs.
    data:
      layers:
        - label: Customer demand
          items:
            - Enterprise and BFSI workloads
            - Hyperscale, cloud, and AI workloads
          detail: Demand enters through contracted capacity or customer infrastructure requirements.
        - label: Commercial service surface
          items:
            - Colocation and build-to-suit
            - Managed hosting, edge, and connectivity
          detail: Public evidence supports the service categories but not module economics.
        - label: Deployment and operations
          items:
            - Rack and campus delivery
            - Monitoring, backup, restoration, and configuration
          detail: Operational tooling, support KPIs, and delivery lead times are not public.
        - label: Physical infrastructure
          items:
            - Power and redundancy systems
            - Air or liquid cooling by workload and site
          detail: Assigned sources do not provide a campus-level bill of materials or topology.
        - label: Trust and resilience controls
          items:
            - Physical and cyber security
            - Availability and recovery governance
          detail: SLA and security statements are not accompanied by independent control evidence.
        - label: Capacity expansion
          items:
            - Pre-leased annual additions
            - Hyperscale joint venture and multi-gigawatt pipeline
          detail: Financing and pipeline evidence do not establish commissioning or technical readiness.
    approximationNotes: >-
      Conceptual layer ordering only; it does not assert undisclosed component vendors, topology, capacity allocation,
      or control effectiveness.
    claimRefs:
      - CE003
      - CE005
      - CE007
      - CE011
      - CE014
      - CE015
  - id: FU001
    title: Customer acquisition, delivery, and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports a path from regulatory or compute demand to contracted capacity and long-term operation,
      but not customer-level conversion or retention rates.
    data:
      nodes:
        - label: Demand trigger
          detail: AI, cloud, digital workloads, and domestic data-residency requirements create infrastructure demand.
          touchpoints:
            - Enterprise infrastructure planning
            - Compliance and data-residency assessment
        - label: Segment and site selection
          detail: Hyperscalers, BFSI, government, telecom, e-commerce, IT, and SMB buyers select service and geography.
          touchpoints:
            - Power and connectivity diligence
            - Procurement and compliance review
        - label: Service configuration
          detail: >-
            Customers choose colocation or managed hosting services such as storage, backup, monitoring, procurement,
            and network configuration.
          touchpoints:
            - Rack or facility requirements
            - Managed-service scope
        - label: Contract and pre-lease
          detail: ICRA reports medium-to-long-term contracts with escalations and completely pre-leased planned additions.
          touchpoints:
            - Contract term and escalation
            - Reserved capacity
        - label: Production operation
          detail: Switching-related downtime risk and customer investment can increase stickiness once workloads are deployed.
          touchpoints:
            - Reliability and support
            - Operational continuity
        - label: Expansion or concentration
          detail: >-
            Additional campuses and services can expand relationships, while top-ten concentration and grid constraints
            limit durability.
          touchpoints:
            - Additional capacity
            - Concentration and power monitoring
    approximationNotes: >-
      The ordered journey is qualitative; public evidence does not provide stage conversion rates, customer counts, or
      elapsed times.
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU007
      - CU011
      - CU012
      - CU013
      - CU016
  - id: FR001
    title: Evidence-based risk heatmap
    type: matrix
    summary: >-
      Six disclosed or directly evidenced exposures ranked by qualitative likelihood, impact, and mitigation maturity;
      labels are analytical judgments, not statistical probabilities.
    data:
      columns:
        - id: likelihood
          label: Likelihood
          detail: Qualitative assessment from disclosed exposure and source sensitivity.
        - id: impact
          label: Impact
          detail: Potential effect on debt coverage, delivery, or customer obligations.
        - id: mitigation
          label: Mitigation maturity
          detail: Strength of publicly evidenced controls or structural offsets.
      rows:
        - id: debt-funded-expansion
          label: Debt-funded expansion
          note: ICRA capex and leverage sensitivities.
          values:
            - value: High
              detail: Large committed build program is already planned.
            - value: High
              detail: Leverage and coverage can weaken if delivery or ramp slips.
            - value: Partial
              detail: Long-tenured debt, cash flow, and CPP capital offer offsets.
        - id: utilization-ramp
          label: Utilization and ramp
          note: Explicit negative rating sensitivity.
          values:
            - value: Medium
              detail: Contracting supports demand, but campus-level conversion is undisclosed.
            - value: High
              detail: Lower utilization directly pressures earnings and debt metrics.
            - value: Partial
              detail: Pre-leasing and sticky contracts mitigate without eliminating risk.
        - id: customer-concentration
          label: Customer concentration
          note: Top ten share of FY2025 operating income.
          values:
            - value: Medium
              detail: Concentration is quantified but customer-level quality is not.
            - value: High
              detail: Large-customer loss can affect recurring cash flow.
            - value: Partial
              detail: Switching costs and medium-to-long-term contracts provide support.
        - id: power-and-cooling
          label: Power and cooling
          note: Industry constraint plus reported company cooling choices.
          values:
            - value: Medium
              detail: Power availability is a sector-wide delivery constraint.
            - value: High
              detail: Capacity cannot monetize without reliable, economic power and cooling.
            - value: Partial
              detail: Renewable development and purchase agreements were reported, not fully evidenced.
        - id: partner-governance
          label: Partner and JV governance
          note: CPP owns 48% of the new campus venture.
          values:
            - value: Medium
              detail: Material decisions may require alignment despite CtrlS majority ownership.
            - value: High
              detail: Deadlock or funding delay could affect expansion cadence.
            - value: Early
              detail: Ownership and commitment are public; governance protections are not.
        - id: competition
          label: Competitive capacity
          note: ICRA identifies stiff competition.
          values:
            - value: High
              detail: New entrants and incumbent expansion are already visible.
            - value: Medium
              detail: Overbuild can pressure utilization, pricing, and returns.
            - value: Partial
              detail: Track record and geographic diversity provide some advantage.
    approximationNotes: >-
      Qualitative categories synthesize cited facts; they are not measured probabilities, benchmark scores, or a claim
      that every sector constraint has occurred at CtrlS.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR008
      - CR012
      - CR013
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: A six-step chain shows why strong demand proof does not yet overcome price and financing risk.
    data:
      nodes:
        - id: demand
          label: Contracted demand
          detail: Incremental large capacity is reported as pre-leased to a hyperscaler.
        - id: scale
          label: Rapid scale
          detail: Operational capacity is expected to rise from 150 MW in FY2026 to 950-1,000 MW by FY2029.
        - id: capital
          label: Heavy capital need
          detail: FY2027-FY2028 capex is projected at ₹13,000-13,500 crore.
        - id: leverage
          label: Leverage and refinancing
          detail: Debt/OPBDITA may exceed 4x and project debt includes three-year bullet repayments.
        - id: price
          label: Full price anchor
          detail: The latest institutional reference is approximately ₹44,824-45,000 crore.
        - id: recommendation
          label: Track
          detail: Proceed only with a price discount or verified cash-flow and capital-structure protection.
      edges:
        - from: demand
          to: scale
        - from: scale
          to: capital
        - from: capital
          to: leverage
        - from: leverage
          to: price
        - from: price
          to: recommendation
    approximationNotes: >-
      The flow is decision logic, not a quantitative valuation model; values retain their original periods and
      denominators.
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
