          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.2'
        title: Reported profitability and operating leverage
        blocks:
          - type: paragraph
            body: >-
              ICRA reported provisional consolidated FY2025 operating income of ₹1,567 crore, about 17% above FY2024,
              and calculated OPBDIT at 49.6% of operating income versus 46.7% a year earlier. Provisional PAT was ₹251
              crore and PAT margin was 16.0%, slightly below ₹256 crore and 19.1% in audited FY2024. BrokerChooser
              separately reported ₹1,561.8 crore of FY2025 operating revenue and ₹248.1 crore of net profit, attributing
              those figures to Ministry of Corporate Affairs filings; the close but non-identical values should not be
              merged without the underlying statements. EMIS also reported 16.64% net-sales growth and 23.75% EBITDA
              growth in 2025, while noting a 2.61 percentage-point decline in net profit margin. These indicators
              support operating leverage, but they do not disclose gross margin, utilization by campus, energy cost per
              MW, maintenance capex or working-capital conversion.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The expansion plan is highly capital intensive. ICRA projected ₹4,500-4,600 crore of capex during
              FY2026-FY2028, financed with ₹3,000-3,500 crore of debt and the balance from internal accruals. It
              expected medium-term total debt/OPBDIT of 3.5-4.0x and DSCR of 1.6-1.9x. The last disclosed liquidity
              snapshot was ₹204 crore of unencumbered cash at March 31, 2025 against ₹200 crore of scheduled FY2026 debt
              repayment, so it is not a current runway measure. Separately, CPP Investments committed INR 40 billion for
              an 8.2% stake and up to INR 30 billion for 48% of a campus joint venture; these are transaction
              commitments, not evidence that the entire amount is unrestricted cash on CtrlS's balance sheet. The August
              2026 ₹250-crore investment adds capital, but public evidence still does not reconcile sources and uses,
              debt drawdowns, covenants, project-finance obligations or current cash availability.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is directionally attractive because contracted capacity, escalators and switching friction
              can produce durable inflows, while FY2025 results show meaningful operating profitability. The
              counterweight is a build-ahead model in which capacity additions absorb capital before utilization and
              revenue fully ramp. ICRA explicitly identified debt-funded capex and moderate medium-term returns on
              capital as credit challenges, with rating pressure if sustained DSCR falls below 1.5x or debt/EBITDA
              exceeds 4x. The available evidence therefore supports a positive operating model but not a complete equity
              underwriting case. Investment committee work should require audited consolidated financials, campus-level
              utilization and contribution margins, customer concentration and contract schedules, a debt and covenant
              schedule, and a post-transaction cash-flow bridge before assigning value to forecast growth or treating
              committed capital as available runway.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract visibility supports revenue quality
            body: >-
              Medium-to-long-term contracts, defined escalators and customer switching costs support annuity-like
              inflows, although contract-level pricing and renewal data remain unavailable.
            calloutType: strength
            claimRefs:
              - CI005
              - CI006
          - type: callout
            title: Growth remains financing-dependent
            body: >-
              Planned capex is predominantly debt funded, while the latest public cash balance predates the 2026
              transactions and does not establish current unrestricted liquidity or runway.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The core customer workflow begins with physical placement: an enterprise or cloud provider puts
              customer-owned servers into shared or dedicated rack space, or contracts for a larger build-to-suit
              deployment. CtrlS then extends the physical product with managed hosting functions that third-party
              coverage describes as storage, backup and restoration, performance monitoring, hardware and software
              procurement, and network configuration. The broader portfolio also markets edge data centers,
              connectivity, and AI-ready managed services. This makes CtrlS a facility-and-operations platform rather
              than a pure real-estate lessor, but public evidence does not disclose module attach rates, service-level
              economics, standard deployment lead times, or the exact boundary between contracted managed services and
              customer-operated infrastructure.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE008
              - CE012
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE011
              - CE012
              - CE014
              - CE015
      - number: '5.2'
        title: Footprint and deployment maturity
        blocks:
          - type: paragraph
            body: >-
              Multiple 2026 sources report 19 operating facilities across nine Indian markets and more than 370 MW of
              capacity, while ICRA reported 130 MW across 17 facilities as of August 2025. The difference is
              directionally consistent with rapid additions, but the sources do not publish a common definition of
              operational capacity, critical IT load, commissioned utility power, or controlled versus joint-venture
              assets. Maturity is stronger than a greenfield pipeline alone would imply: CPP Investments refers to
              contracted capacity and long-term customer relationships, and ICRA reported the next three years of 40-45
              MW annual additions as completely pre-leased. Underwriting still requires a site-by-site commissioning and
              utilization schedule rather than treating every announced megawatt as ready for customer workloads.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE014
      - number: '5.3'
        title: Architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              The available architecture evidence is descriptive rather than auditable. Reporting attributed to
              management says newer CtrlS facilities use air-cooled designs, while a market-data publisher describes
              high-density computing and liquid-cooling capability. Those statements suggest a portfolio that may span
              conventional enterprise loads and denser AI deployments, but they do not identify rack-density envelopes,
              cooling topology by campus, redundancy paths, network fabric, component vendors, or measured efficiency.
              Competitor Yotta publicly specifies immersion and chilled-water cooling, dual utility feeds, UPS and
              generator redundancy, and sovereign workload controls; that disclosure is a useful diligence benchmark,
              not proof that CtrlS has equivalent systems. CtrlS's defensible differentiation is therefore more clearly
              supported by footprint, contracted demand, service breadth, and execution history than by publicly
              verifiable proprietary technology.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
