  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: >-
        Segment-level revenue, contracted and utilized MW, price per MW, geographic
        eligibility, win rates, and a documented bridge from national capacity to
        CtrlS-addressable and obtainable revenue.
      whyItMatters: >-
        Without these inputs, national capacity forecasts cannot be converted into a
        defensible revenue SAM or SOM or used safely as a valuation denominator.
      diligencePath: >-
        Obtain the operating model, campus-level contracted and utilized capacity,
        segment pricing, customer pipeline, and management's bottom-up TAM/SAM/SOM
        bridge; reconcile each input to audited revenue.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: company-capacity
      missingEvidence: >-
        A dated facility-by-facility reconciliation of ICRA's 130 MW operational
        figure for August 2025 with 2026 reports of 370 MW active or managed capacity.
      whyItMatters: >-
        Capacity definition and commissioning status affect market share, utilization,
        capital efficiency, and the credibility of expansion targets.
      diligencePath: >-
        Request a campus schedule separating commissioned IT load, gross utility
        capacity, contracted capacity, managed capacity, and projects under execution.
      relatedQuestionRefs: [QM006]
      relatedTableRefs: [TM002]
