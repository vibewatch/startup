  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: entry-terms
      missingEvidence: Complete cap table, liquidation preferences, anti-dilution rights, governance rights, and the price and security terms available to a new investor.
      whyItMatters: The disclosed headline valuation does not establish the proceeds, ownership, or downside protection available at a prospective entry.
      diligencePath: Obtain the CPP and friends-and-family financing documents plus a fully diluted cap table from company counsel.
      relatedQuestionRefs: [QV005, QV010]
    - type: private-evidence-only
      severity: material
      topic: debt
      missingEvidence: Lender-by-lender debt schedule, interest rates, bullet maturities, security package, covenants, and committed versus undrawn facilities.
      whyItMatters: Refinancing and covenant headroom determine whether operating growth accrues to equity.
      diligencePath: Review facility agreements, covenant certificates, maturity ladders, and downside refinancing cases with management and lenders.
      relatedQuestionRefs: [QV003, QV005, QV010]
    - type: conflicting-data
      severity: material
      topic: capacity
      missingEvidence: Reconciled definitions and dates for commissioned, active IT load, installed, contracted, and under-construction megawatts.
      whyItMatters: Capacity is a core denominator for execution progress, utilization, capital intensity, and valuation.
      diligencePath: Obtain a campus-level capacity bridge with commissioning dates, utilization, tenants, and contracted power.
      relatedQuestionRefs: [QV002, QV006, QV010]
    - type: missing-source
      severity: material
      topic: return-underwriting
      missingEvidence: Audited FY2026 cash flow, campus-level project returns, customer contract economics, net debt, and a supportable exit multiple or sale precedent.
