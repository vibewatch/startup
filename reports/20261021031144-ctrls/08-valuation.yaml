artifact: valuation
slug: ctrls
runDate: 2026-10-21
company:
  name: CtrlS
chapter:
  number: 8
  title: Valuation
  summary: >-
    CtrlS has a current institutional price anchor near ₹44,824-45,000 crore, but that price
    already capitalizes a rapid, debt-intensive expansion before the public record establishes
    execution, refinancing, or exit returns. The appropriate stance is track, with medium
    confidence, high risk, and a stretched valuation until entry terms and audited forward
    economics are available.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is track rather than buy. CPP Investments' direct investment supplies
      a credible market-clearing reference: VCCircle reported ₹4,000 crore for 8.2% at a
      ₹44,824 crore pre-money valuation, while Mint described the transaction as a $4.8 billion,
      roughly ₹45,000 crore valuation. That is substantially stronger evidence than an
      unsupported model mark, but it is not proof that a new investor can earn an attractive
      return at the same price. Using the ₹45,000 crore headline value against FY2025 operating
      income of ₹1,562 crore produces an illustrative 28.8x price-to-operating-income ratio;
      this is not an EBITDA or equity-return multiple and does not adjust for net debt, the
      separate joint venture, preferences, or dilution. The premium can work only if pre-leased
      capacity is delivered on time and converts into cash flow without impairing coverage.
      Public evidence therefore supports a stretched stance, medium recommendation confidence,
      and high execution/financing risk, not a precise target return.
    claimRefs: [CV001, CV002, CV003, CV006, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-anti-thesis-and-capital-structure
    title: Thesis, anti-thesis, and capital structure
    body: >-
      The thesis rests on contracted demand and operating leverage. ICRA expects operational
      capacity to rise from 150 MW in FY2026 to 950-1,000 MW by FY2029 and says the incremental
      large capacity is pre-leased to a hyperscaler. It also estimates FY2026 operating income
      of ₹1,900 crore with 50-52% operating margins. The anti-thesis is that the same build-out
      requires ₹13,000-13,500 crore of FY2027-FY2028 capital expenditure, with 60-65% expected
      from debt, and could push debt/OPBDITA above 4x over the next 12-18 months. Project term
      loans include three-year bullet repayments, creating refinancing exposure while new
      capacity remains in early execution. The ₹7,000 crore CPP package also has two distinct
      components—₹4,000 crore into CtrlS and up to ₹3,000 crore into a 52:48 joint venture—so
      funding raised must not be treated as unrestricted parent-company cash. A later ₹250 crore
      investment adds capital but does not remove the need to inspect preferences, covenants,
      security, and future dilution.
    claimRefs: [CV004, CV005, CV008, CV009, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit readiness, and diligence gates
    body: >-
      Public evidence supports conditional scenarios, not precise terminal values. The bull case
      requires on-time delivery of pre-leased capacity, sustained 20-25% revenue growth, margins
      near ICRA's 50-52% expectation, and DSCR remaining within the projected 1.9-2.3x range; only
      then would a value above the latest round be defensible. The base case holds the latest
      ₹44,824-45,000 crore reference as a ceiling for diligence until audited FY2026 results,
      project-level cash flows, and the full debt schedule are reviewed. The bear case is a
      material discount to that reference if delivery slips, utilization weakens, debt/EBITDA
      stays above 4x, or bullet debt cannot be refinanced; the public record cannot support a
      numeric floor. Management has discussed an IPO in one to three years but had not begun
      preparations, so exit timing is aspirational rather than underwritten. Investment should
      advance only after cap-table rights, JV economics, contracted backlog, campus utilization,
      debt maturities, and downside liquidity are disclosed.
    claimRefs: [CV002, CV008, CV009, CV010, CV011, CV012, CV013, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Track, "A real institutional price exists but public return inputs remain incomplete.", "Do not underwrite a new position before entry terms and debt diligence."]
      - [Confidence, Medium, "Transaction value and audited FY2025 metrics are visible; cap table rights and project cash flows are not.", "Use conditional milestones rather than a point target."]
      - [Risk rating, High, "Expansion is debt intensive and includes execution and three-year bullet-refinancing exposure.", "Require covenant, maturity, and downside-liquidity review."]
      - [Valuation stance, Stretched, "Headline value is about 28.8x FY2025 operating income, an illustrative non-EBITDA ratio.", "Demand a discount or proof of contracted cash-flow conversion."]
    notes: >-
      Assessment uses the June 2026 financing reference and FY2025 operating income; the
      illustrative ratio excludes net debt, preferences, and joint-venture economics.
    claimRefs: [CV001, CV006, CV009, CV010, CV012, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Evidence, What would change the view]
    rows:
      - [Thesis, "Contracted capacity can drive rapid scale.", "ICRA expects 150 MW in FY2026 to reach 950-1,000 MW by FY2029, with incremental large capacity pre-leased.", "Tenant quality, enforceable take-or-pay terms, and delivery milestones would strengthen the case."]
      - [Thesis, "Operating leverage may support debt service.", "ICRA estimates FY2026 operating income of ₹1,900 crore and 50-52% operating margins.", "Audited FY2026 cash conversion at or above the estimate would strengthen confidence."]
      - [Anti-thesis, "Capital intensity can absorb equity upside.", "FY2027-FY2028 capex is projected at ₹13,000-13,500 crore with 60-65% debt funding.", "Lower debt share or substantial tenant prepayments would reduce risk."]
      - [Anti-thesis, "Execution and refinancing can break the thesis.", "ICRA identifies nascent execution and three-year bullet repayment exposure.", "Termed-out debt, committed undrawn facilities, and on-time handovers would reduce risk."]
    notes: >-
      Forward figures are ICRA estimates and remain conditional on contracted capacity,
      execution timing, financing availability, and customer performance.
    claimRefs: [CV008, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation and return logic, Probability signal, Downside or upside trigger]
    rows:
      - [Bull, "Pre-leased capacity is delivered on time; revenue grows 20-25%; operating margin stays near 50-52%; DSCR remains 1.9-2.3x.", "A value above the ₹44,824-45,000 crore round reference becomes supportable only after cash-flow conversion; no public upper bound is defensible.", "Milestones are externally specified but not yet demonstrated at the planned scale.", "Audited delivery and cash conversion without leverage deterioration."]
      - [Base, "Growth continues but capex and leverage remain elevated while new capacity ramps.", "Treat the latest round reference as a diligence ceiling, not a return target; require entry discount or superior rights.", "Most consistent with the available stable rating and disclosed financing plan.", "FY2026 audit, project cash flows, cap table, and full debt schedule."]
      - [Bear, "Delivery slips, utilization falls, or refinancing occurs on adverse terms.", "A material discount to the latest round is required; public evidence does not support a numeric floor.", "ICRA explicitly identifies execution, refinancing, and leverage downgrade triggers.", "DSCR below 1.5x or debt/EBITDA above 4x on a sustained basis."]
    notes: >-
      These are conditional valuation bands around the latest disclosed transaction, not
      probability-weighted forecasts; missing entry rights, net debt, and exit assumptions
      preclude precise return ranges.
    claimRefs: [CV001, CV008, CV009, CV010, CV011, CV012, CV013, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: A six-step chain shows why strong demand proof does not yet overcome price and financing risk.
    data:
      nodes:
        - id: demand
          label: Contracted demand
          detail: Incremental large capacity is reported as pre-leased to a hyperscaler.
        - id: scale
          label: Rapid scale
          detail: Operational capacity is expected to rise from 150 MW in FY2026 to 950-1,000 MW by FY2029.
        - id: capital
          label: Heavy capital need
          detail: FY2027-FY2028 capex is projected at ₹13,000-13,500 crore.
        - id: leverage
          label: Leverage and refinancing
          detail: Debt/OPBDITA may exceed 4x and project debt includes three-year bullet repayments.
        - id: price
          label: Full price anchor
          detail: The latest institutional reference is approximately ₹44,824-45,000 crore.
        - id: recommendation
          label: Track
          detail: Proceed only with a price discount or verified cash-flow and capital-structure protection.
      edges:
        - from: demand
          to: scale
        - from: scale
          to: capital
        - from: capital
          to: leverage
        - from: leverage
          to: price
        - from: price
          to: recommendation
    approximationNotes: >-
      The flow is decision logic, not a quantitative valuation model; values retain their
      original periods and denominators.
    claimRefs: [CV001, CV009, CV010, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: Investment decision
    body: >-
      Track pending audited FY2026 results, complete debt and cap-table terms, project-level
      contracted cash flows, and an entry price that compensates for execution and refinancing risk.
    claimRefs: [CV001, CV008, CV009, CV010, CV012, CV015]
