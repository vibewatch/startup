callouts:
  - calloutType: insight
    title: Institutional capital is split across parent and project vehicles
    body: >-
      CPP's headline commitment contains INR 40 billion of direct parent equity and up to INR 30
      billion for a separately owned campus joint venture. Diligence should model control, cash
      access, and returns at each entity rather than treating INR 70 billion as one unrestricted raise.
    claimRefs: [CO008, CO009]
  - calloutType: risk
    title: Scale claims outrun disclosure comparability
    body: >-
      The move from 130 MW operational in August 2025 to more than 370 MW live or managed in 2026
      may reflect commissioning and scope changes, but assigned sources do not provide a bridge.
      Site-level IT load, utilization, ownership, and contracted capacity are required.
    claimRefs: [CO005, CO006, CO007]
