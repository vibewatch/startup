company:
  name: CtrlS
chapter:
  number: 1
  title: Company Overview
  summary: >-
    CtrlS is a Hyderabad-based data-centre operator whose reported footprint reached 19 facilities
    across nine Indian markets in 2026. Its June 2026 CPP Investments transaction supplied both
    direct equity and a separately structured campus joint venture, while rapid capacity expansion
    and customer concentration leave leverage, metric-definition, governance, and disclosure risks.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      CtrlS Datacenters Limited is a Hyderabad-based operator of colocation and managed
      infrastructure services. The operating history is clear even though the founding label is
      not: VCCircle describes the company as founded in 2007, while ICRA says it was established in
      2008 and began operating its first Hyderabad data centre in 2009. The distinction should be
      resolved against incorporation records before publication-grade use, but it does not alter
      the evidence that CtrlS has operated data-centre infrastructure since 2009. Its model combines
      customer-owned equipment housed in CtrlS facilities with managed hosting, storage, backup,
      monitoring, procurement, and network-configuration services. This is an asset-heavy,
      recurring-contract model rather than a pure software subscription business.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: operating-scale
    title: Scale, demand exposure, and metric reconciliation
    body: >-
      Multiple 2026 reports put the footprint at 19 operating data centres across nine Indian
      markets. Capacity is less comparable. ICRA measured about 130 MW of operational capacity in
      August 2025, whereas 2026 coverage and a founder interview describe more than 370 MW of live
      or managed capacity and more than 4 GW in development. Timing may explain part of the jump,
      but the sources do not reconcile IT load, facility power, owned versus managed capacity, or
      commissioned versus contracted megawatts. The development pipeline is therefore best read as
      a company-reported ambition, not delivered capacity. Customer breadth is also presented only
      through selected cohorts: the company says it serves over 60 Fortune 500 companies and five
      of the seven largest hyperscalers, while ICRA reports that the top ten customers generated
      about 62% of FY2025 consolidated operating income.
    claimRefs: [CO004, CO005, CO006, CO007, CO013, CO016]
    figureRefs: [FO001]
  - id: capital-and-ownership
    title: Capital structure and ownership inflection
    body: >-
      The June 2026 CPP Investments partnership changed the ownership and financing profile. CPP
      committed INR 40 billion for an 8.2% direct stake and up to INR 30 billion for 48% of a
      separate hyperscale-campus joint venture, with CtrlS retaining 52% of that vehicle. These are
      distinct commitments and should not be collapsed into cash available to the parent. VCCircle
      reported an approximately INR 44,824 crore pre-money valuation, broadly consistent with
      separate reporting of about US$4.8 billion. In August, Nikhil Kamath and Sreeram Reddy Vanga
      added INR 200 crore and INR 50 crore respectively. Those transactions provide fresh capital,
      but the available sources do not produce a reliable cumulative raised figure across equity,
      debt, repurchased historical stakes, and the JV.
    claimRefs: [CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: governance-and-financial-posture
    title: Governance, financial posture, and key-person risk
    body: >-
      Founder and CEO Sridhar Pinnapureddy remains the central public decision-maker across
      financing, build strategy, capacity claims, and international expansion. Tracxn lists nine
      active directors, including Pinnapureddy and eight independent directors, but the accessible
      evidence does not establish the current committee structure, investor consent rights, or the
      CPP nominee arrangement. Financially, ICRA reported provisional FY2025 operating income of
      INR 1,567 crore, up about 17%, alongside a 49.6% operating margin. The same rating analysis
      projected INR 4,500-4,600 crore of FY2026-FY2028 capex, substantially debt-funded, and flagged
      competition and moderate returns on capital. The founder-led operating model has delivered
      scale, but investors should treat governance rights, succession depth, capex controls, and
      customer concentration as linked diligence priorities.
    claimRefs: [CO012, CO013, CO014, CO015]
    tableRefs: [TO002]
