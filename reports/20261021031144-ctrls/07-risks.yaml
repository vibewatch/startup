        unresolved in the nine-source assigned pool as of the run date.
    claimRefs: [CR007, CR008, CR009, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
    rows:
      - - Debt-supported construction outruns commissioning
        - ICRA expects Rs. 4,500-4,600 crore of FY2026-FY2028 capex, with Rs. 3,000-3,500 crore of debt.
        - High
        - High
        - Partial; long-tenured debt and contracted capacity support coverage.
        - Ramp delays can depress return on capital and debt protection.
      - - Utilization underperforms
        - ICRA names lower utilization of existing or new sites as a negative rating factor.
        - Medium
        - High
        - Partial; medium-to-long-term contracts and pre-leasing provide some protection.
        - Aggregate pipeline claims do not disclose campus-level occupancy or contracted power conversion.
      - - Power, cooling, and environmental constraints
        - Industry evidence flags power constraints; reported management comments describe energy-intensive air cooling and limited legacy freshwater use.
        - Medium
        - High
        - Partial; renewable projects and power-purchase negotiations were reported.
        - Grid availability, energy cost, and water constraints remain campus-specific.
      - - Talent and equipment bottlenecks
        - Accenture identifies talent shortages and supply-chain pressure as 2026 data-center constraints.
        - Medium
        - Medium
        - Unverified for CtrlS; no campus-level staffing or critical-equipment schedule was retained.
        - Commissioning dates may slip even if financing is available.
      - - Competitive overbuild
        - ICRA identifies stiff competition from new entrants and expansion by existing operators.
        - High
        - Medium
        - Partial; established operations and city diversity are mitigating factors.
        - Pricing, utilization, and returns may compress if supply arrives ahead of demand.
    notes: >-
      Rows combine company-specific rating evidence with clearly labelled industry constraints;
      no row treats sector risk as proof that CtrlS has experienced a failure.
    claimRefs: [CR001, CR002, CR005, CR006, CR012, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or channel
      - Concentration or commitment
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Customer cash flows
        - Top ten customers
        - Approximately 62% of FY2025 consolidated operating income.
        - Non-renewal, downsizing, or delayed ramp weakens coverage.
        - High
        - Medium-to-long-term contracts and high switching costs.
        - Customer-level revenue, tenor, renewal, and credit quality are undisclosed.
      - - Growth capital
        - CPP Investments
        - Up to INR 70 billion across direct equity and the campus JV.
        - Conditions precedent or delayed drawdowns slow expansion.
        - High
        - Large institutional partner with disclosed commitment.
        - Draw schedule, conditions, remedies, and CtrlS matching capital are not public.
      - - JV governance
        - CPP Investments and CtrlS
        - 48% / 52% ownership.
        - Deadlock or differing return thresholds delay campus decisions.
        - High
        - CtrlS retains majority ownership.
        - Reserved matters, exit rights, and operating control are undisclosed.
      - - Debt availability
        - Lenders and project-finance providers
        - ICRA expects Rs. 3,000-3,500 crore of debt for FY2026-FY2028 capex.
        - Cost, covenant, or availability changes leave projects underfunded.
        - High
        - Long-tenured lease-rental-discounted borrowings and partner equity.
        - Current debt schedule and post-transaction covenant headroom are not public.
    notes: >-
      Concentration and commitments preserve the source periods and denominators; committed
      funding is not treated as cash already available to CtrlS.
    claimRefs: [CR001, CR002, CR004, CR008, CR009, CR010, CR011]
figures:
  - id: FR001
    title: Evidence-based risk heatmap
    type: matrix
    summary: >-
      Six disclosed or directly evidenced exposures ranked by qualitative likelihood, impact,
      and mitigation maturity; labels are analytical judgments, not statistical probabilities.
    data:
      columns:
        - id: likelihood
          label: Likelihood
          detail: Qualitative assessment from disclosed exposure and source sensitivity.
        - id: impact
          label: Impact
          detail: Potential effect on debt coverage, delivery, or customer obligations.
        - id: mitigation
          label: Mitigation maturity
          detail: Strength of publicly evidenced controls or structural offsets.
      rows:
        - id: debt-funded-expansion
          label: Debt-funded expansion
          note: ICRA capex and leverage sensitivities.
          values:
            - value: High
              detail: Large committed build program is already planned.
            - value: High
              detail: Leverage and coverage can weaken if delivery or ramp slips.
            - value: Partial
              detail: Long-tenured debt, cash flow, and CPP capital offer offsets.
        - id: utilization-ramp
          label: Utilization and ramp
          note: Explicit negative rating sensitivity.
          values:
            - value: Medium
              detail: Contracting supports demand, but campus-level conversion is undisclosed.
            - value: High
              detail: Lower utilization directly pressures earnings and debt metrics.
            - value: Partial
              detail: Pre-leasing and sticky contracts mitigate without eliminating risk.
        - id: customer-concentration
          label: Customer concentration
          note: Top ten share of FY2025 operating income.
          values:
            - value: Medium
              detail: Concentration is quantified but customer-level quality is not.
            - value: High
              detail: Large-customer loss can affect recurring cash flow.
            - value: Partial
              detail: Switching costs and medium-to-long-term contracts provide support.
        - id: power-and-cooling
          label: Power and cooling
          note: Industry constraint plus reported company cooling choices.
          values:
            - value: Medium
              detail: Power availability is a sector-wide delivery constraint.
            - value: High
              detail: Capacity cannot monetize without reliable, economic power and cooling.
            - value: Partial
              detail: Renewable development and purchase agreements were reported, not fully evidenced.
        - id: partner-governance
          label: Partner and JV governance
          note: CPP owns 48% of the new campus venture.
          values:
            - value: Medium
              detail: Material decisions may require alignment despite CtrlS majority ownership.
            - value: High
              detail: Deadlock or funding delay could affect expansion cadence.
            - value: Early
              detail: Ownership and commitment are public; governance protections are not.
        - id: competition
          label: Competitive capacity
          note: ICRA identifies stiff competition.
          values:
            - value: High
              detail: New entrants and incumbent expansion are already visible.
            - value: Medium
              detail: Overbuild can pressure utilization, pricing, and returns.
            - value: Partial
              detail: Track record and geographic diversity provide some advantage.
    approximationNotes: >-
      Qualitative categories synthesize cited facts; they are not measured probabilities,
      benchmark scores, or a claim that every sector constraint has occurred at CtrlS.
    claimRefs: [CR001, CR003, CR004, CR006, CR008, CR012, CR013, CR014]
callouts:
  - calloutType: risk
    title: Thesis-break discipline
    body: >-
      Treat sustained DSCR below 1.5 times, total debt/EBITDA above 4 times, materially lower
      utilization, missed energization or pre-lease milestones, or an unresolved material
      security or regulatory event as a pause condition pending remediation evidence.
    claimRefs: [CR003, CR005, CR016]
