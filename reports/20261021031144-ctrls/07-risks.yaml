    title: Regulatory / legal risk register
    columns:
      - Risk or obligation
      - Evidence and status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Cross-entity guarantees
        - ICRA reports guarantees for loans of two wholly owned operating subsidiaries.
        - Medium
        - High
        - Partial; consolidated rating analysis exists, but the guarantee schedule is not public.
        - Parent liquidity and creditor claims may be linked across operating entities.
        - Obtain lender-by-lender guarantees, security, covenants, and cross-default provisions.
      - - CPP campus joint-venture governance
        - CPP Investments will own 48% and CtrlS 52%; reserved matters and deadlock rights are undisclosed.
        - Medium
        - High
        - Early; funding commitment and ownership are public, executed governance terms are not.
        - Project timing and capital calls may depend on negotiated partner approvals.
        - Review executed JV, shareholder, development, management, and exit agreements.
      - - Data, security, permits, and incident compliance
        - The assigned public pool does not establish current licenses, certifications, proceedings, or incident history.
        - Unknown
        - High
        - Unverified in retained public evidence.
        - A material event could affect regulated customers, uptime obligations, and expansion permits.
        - Obtain regulator correspondence, permit register, audits, certifications, breach and outage logs, and insurance claims.
    notes: >-
      Partial public-evidence register as of 2026-10-21; likelihood and severity are analyst
      assessments tied to disclosed exposure, while unknown legal, security, and permit status
      is presented as a gap rather than evidence of an incident.
    enumerationScope:
      coverage: partial
      basis: >-
