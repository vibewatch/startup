schemaVersion: "report-v2"
artifact: risks
slug: ctrls
runDate: 2026-10-21
company:
  name: CtrlS
chapter:
  number: 7
  title: Risks
  summary: >-
    CtrlS's principal disclosed risk is execution of a large, debt-supported capacity build-out:
    ICRA expects Rs. 4,500-4,600 crore of FY2026-FY2028 capex and identifies utilization,
    leverage, customer concentration, and competition as the key credit sensitivities. The
    CPP Investments partnership adds substantial capital and a 48/52 campus joint venture,
    but public evidence remains insufficient on current covenants, cybersecurity incidents,
    regulatory compliance, and JV governance protections.
sections:
  - id: ranked-risk-view
    title: Ranked residual risk view
    body: >-
      The highest-evidence residual risk is financing and delivery of the expansion program,
      not a documented compliance event. ICRA expects Rs. 4,500-4,600 crore of capex during
      FY2026-FY2028, funded with Rs. 3,000-3,500 crore of debt plus internal accruals, and
      expects returns on capital to remain moderate while new capacity ramps. Its explicit
      downside markers are sustained DSCR below 1.5 times or total debt/EBITDA above 4 times.
      Customer concentration is also material: the top ten customers represented about 62%
      of FY2025 consolidated operating income. These facts make utilization, leverage,
      construction delivery, and renewals the primary monitoring stack. The heatmap ranks
      exposure from disclosed metrics; it does not imply that the public record establishes
      probability estimates for incidents that have not been disclosed.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006]
    figureRefs: [FR001]
  - id: regulatory-legal-and-governance
    title: Regulatory, legal, and governance exposure
    body: >-
      Publicly retained evidence does not establish a current lawsuit, enforcement action,
      breach, outage, certification failure, or license deficiency. That absence is an
      evidence gap rather than proof that no such event exists. The confirmed structural
      exposures are cross-entity and partnership-related: ICRA reports corporate guarantees
      for loans of two subsidiaries, while CPP Investments will own 48% of a new campus joint
      venture and CtrlS 52%. The announcement does not disclose reserved matters, deadlock
      mechanisms, construction guarantees, data-protection controls, or allocation of
      environmental and permitting liabilities. Investment diligence should therefore obtain
      the current litigation and regulator schedule, security incident register, certifications,
      insurance limits, material permits, guarantee schedule, and executed JV documents before
      treating the legal and governance risk as mitigated.
    claimRefs: [CR007, CR008, CR009, CR016]
    tableRefs: [TR001]
  - id: operational-and-financial-execution
    title: Operational and financial execution
    body: >-
      CtrlS is attempting to scale from an already large footprint into a multi-gigawatt
      pipeline. Company-originated reporting describes 19 facilities, more than 370 MW of
      capacity, and 4.4 GW of projects at various stages, while the 2025 ICRA rating analysis
      used a narrower operational-capacity measure and highlighted lagged returns during
      commissioning. Industry evidence adds power availability, scarce technical talent,
      supply-chain pressure, and regulatory friction to the delivery risk set. BrokerChooser
      also reported management's acknowledgement that newer air-cooled installations are
      energy-intensive and that the earliest facilities retain legacy freshwater cooling.
      Mitigation should be tested campus by campus through energization dates, contracted
      power, equipment lead times, pre-leasing, commissioning performance, water intensity,
      and operating-incident records rather than inferred from aggregate pipeline size.
    claimRefs: [CR001, CR005, CR006, CR012, CR013, CR014, CR015]
    tableRefs: [TR002]
  - id: counterparties-and-kill-criteria
    title: Counterparties, mitigations, and thesis-break triggers
    body: >-
      The CPP transaction provides a meaningful capital partner: CPP Investments committed up
      to INR 70 billion, split between an 8.2% direct stake and a separate joint venture.
      Additional 2026 equity was explicitly earmarked for infrastructure expansion. Those
      commitments reduce near-term funding risk but do not disclose cash-draw conditions,
      CtrlS's matching-capital obligation, debt covenants, or remedies for delays. The
      investment thesis should be paused if sustained DSCR falls below 1.5 times, total
      debt/EBITDA remains above 4 times, utilization materially declines, new sites miss
      energization or pre-lease milestones, or top-customer exposure rises without stronger
      contractual protection. Monitoring should combine quarterly leverage and coverage,
      signed-versus-live capacity, top-ten revenue concentration, partner funding drawdowns,
      material outages, regulatory notices, and management remediation dates.
    claimRefs: [CR003, CR004, CR008, CR009, CR010, CR011]
    tableRefs: [TR003]
tables:
