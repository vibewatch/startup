  topStrengths:
    - Contracted demand, medium-to-long-term agreements, and reported pre-leasing support revenue visibility.
    - A nationwide footprint and institutional partnership provide scale and access to growth capital.
    - FY2025 operating performance shows meaningful profitability and fixed-cost absorption.
  topRisks:
    - >-
      Debt-intensive construction and bullet-refinancing exposure can impair equity value if delivery or utilization
      slips.
    - The top ten customers represented about 62% of FY2025 operating income.
    - Campus economics, current liquidity, debt terms, joint-venture rights, and incident history remain undisclosed.
  unresolvedGaps:
    - Audited FY2026 financial statements, current cash flow, and campus-level utilization and returns
    - Lender-by-lender debt schedule, covenants, security, guarantees, and refinancing plan
    - Customer identities, concentration by account, contract tenors, renewals, churn, and backlog conversion
    - Fully diluted cap table, investor rights, CPP funding conditions, and executed joint-venture governance terms
    - Reconciled commissioned, live, contracted, managed, and development capacity by campus
