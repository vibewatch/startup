companyProfile:
  summary: >-
    CtrlS is a Hyderabad-based private operator of colocation and managed infrastructure services. Public reporting
    describes 19 data centers across nine Indian markets, while CPP Investments' 2026 direct stake and separate campus
    joint venture provide institutional capital for a rapid expansion program. The model benefits from
    medium-to-long-term contracts and pre-leasing, but customer concentration, debt-funded construction, capacity metric
    inconsistencies, and limited private-company disclosure constrain underwriting confidence.
