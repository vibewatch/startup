    rows:
      - [CtrlS, "Domestic multi-city operator", "19 sites across nine markets; >370 MW described as managed capacity; 4.4 GW project pipeline", "Hyperscalers, enterprises and BFSI", "Colocation plus managed hosting; contracted demand and switching costs", "130 MW operational capacity at August 2025 uses a narrower basis than 2026 capacity reporting"]
      - [NTT, "Global incumbent", "500 MW pre-funded in Mumbai", "Large-scale India demand", "Scale capital and Mumbai presence", "Retained evidence does not disclose comparable pricing, utilization or service scope"]
      - ["STT GDC", "Global/regional incumbent", "100 MW Chennai build-to-suit addition", "Large contracted deployments", "Build-to-suit capacity", "Retained evidence does not disclose comparable pricing, utilization or service scope"]
      - [Nxtra, "Telco-backed platform", "Targeting an 800 MW footprint by 2028", "Airtel-linked and external demand", "Captive demand channel", "Target is not current commissioned capacity"]
      - [Equinix, "Global incumbent", "Named as an industry leader; no comparable India capacity figure in the pool", "Interconnection-led enterprise and cloud demand", "Global platform signal only", "India pricing, scale and feature evidence are absent from the retained pool"]
      - [Sify, "Domestic incumbent", "Named as an industry leader; retrofit spending referenced without a total footprint", "Enterprise and modernization demand", "Legacy-hall retrofit activity", "Comparable current capacity, pricing and utilization are not disclosed in the retained pool"]
    notes: "Partial profile based only on retained 2025-2026 sources; capacity signals use different definitions and dates, and unknown cells are not negative findings."
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP009, CP010, CP011, CP012, CP013, CP014, CP015]
  - id: TP002
    title: Evidence-bounded capability matrix
    columns:
      - Buying criterion
      - CtrlS
      - NTT
      - STT GDC
      - Nxtra
      - Sify
      - Evidence boundary
    rows:
      - ["India expansion signal", "4.4 GW projects at various execution stages", "500 MW pre-funded in Mumbai", "100 MW added in Chennai", "800 MW footprint target by 2028", "Retrofit activity noted; footprint not quantified", "Announcements and targets are not commissioned-capacity market share"]
      - ["Current operating footprint", "19 data centers across nine markets reported in 2026", Unknown, Unknown, Unknown, Unknown, "No like-for-like facility and IT-load inventory was retained"]
      - ["Service breadth", "Colocation and managed hosting supported", Unknown, Unknown, Unknown, Unknown, "Competitor product catalogs were not present in the assigned pool"]
      - ["Customer lock-in evidence", "Medium-to-long-term contracts and downtime-related switching costs supported", Unknown, Unknown, Unknown, Unknown, "No competitor retention or churn benchmark was retained"]
      - ["Distribution or capital access", "CPP Investments transaction and campus joint-venture capital supported", "Large pre-funded Mumbai build", "Build-to-suit demand signal", "Airtel captive-demand channel", Unknown, "Signals are qualitatively different and are not a rank order"]
    notes: "Supported means the retained source states the capability or signal; Unknown means the assigned evidence pool cannot substantiate the cell."
    claimRefs: [CP001, CP003, CP009, CP010, CP011, CP012, CP014, CP015]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Buyer option
      - Publicly supported package
      - Comparable public price
      - Key unknowns
      - Diligence implication
    rows:
      - [CtrlS, "Colocation and managed hosting", Unknown, "Rack or MW rate, power pass-through, cross-connects, SLA credits, discounts and tenor", "Request matched bids and executed-contract cohorts"]
      - ["Global operators: NTT, STT GDC, Equinix", "Operator presence supported; package detail not retained", Unknown, "Same-unit India pricing, certification scope and delivery dates", "Run a site-by-site RFP rather than infer from global brand"]
      - ["Telco-backed Nxtra", "Captive-demand channel and expansion target supported", Unknown, "Bundling, network discounts, wholesale terms and external-customer economics", "Separate channel advantage from facility economics"]
      - ["Self-build or internal infrastructure", "Ownership/control substitute", Unknown, "Land, power, construction, staffing, utilization and financing cost", "Compare full lifecycle cost and time-to-capacity against colocation"]
    notes: "No retained source discloses comparable realized India pricing; Unknown is an evidence gap, not a claim that a product or fee is absent."
    claimRefs: [CP006, CP007, CP009, CP010, CP011, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning map
    type: quadrant
    summary: >-
      Ordinal placement reflects only the expansion and service-breadth evidence in the
      assigned pool; it is not market share, quality, price or customer preference.
    data:
      xAxis:
        label: "Publicly evidenced India expansion signal (ordinal)"
        min: 0
        max: 5
        lowLabel: "Limited retained signal"
        highLabel: "Large retained signal"
        description: "Analyst ordinal from quantified India capacity commitments or targets in retained sources."
      yAxis:
        label: "Publicly evidenced service breadth (ordinal)"
        min: 0
        max: 5
        lowLabel: "Not detailed in pool"
        highLabel: "Multiple services evidenced"
        description: "Analyst ordinal from services explicitly described in retained sources, not assumed capability."
      points:
        - label: CtrlS
          x: 5
          y: 5
          detail: "4.4 GW project pipeline; colocation and managed hosting explicitly described."
        - label: NTT
          x: 4
          y: 1
          detail: "500 MW Mumbai signal; service breadth not detailed in the retained pool."
        - label: "STT GDC"
          x: 3
          y: 1
          detail: "100 MW Chennai build-to-suit signal; service breadth not detailed."
        - label: Nxtra
          x: 4
          y: 1
          detail: "800 MW 2028 target; service breadth not detailed."
        - label: Equinix
          x: 1
          y: 1
          detail: "Named industry leader; no quantified India expansion or service detail retained."
        - label: Sify
          x: 2
          y: 1
          detail: "Named industry leader with retrofit activity; total expansion and service detail not retained."
    approximationNotes: "Ordinal scores are transparent evidence-availability indicators, not measured performance; unmatched metrics and missing competitor disclosures prevent a quantitative market-position comparison."
    claimRefs: [CP003, CP008, CP009, CP010, CP011, CP012]
callouts:
  - calloutType: strength
    title: Installed-base switching costs are the clearest moat evidence
    body: >-
      ICRA links customer stickiness to customer investment, downtime risk and
      medium-to-long-term contracts with defined escalations; this is stronger evidence
      than generic claims of scale or reliability.
    claimRefs: [CP013, CP014]
  - calloutType: risk
    title: Expansion capital does not remove competitive execution risk
    body: >-
      ICRA flags large capacity additions, new entrants and incumbent expansion as stiff
      competition, so the CPP-backed build-out must still convert into timely,
      well-utilized capacity at acceptable returns.
    claimRefs: [CP015, CP016]
