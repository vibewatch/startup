      contracted, and live capacity.
    whyItMatters: Unreconciled scopes can overstate operating scale, financing available to the parent, and valuation comparability.
    diligencePath: >-
      Obtain a CFO-certified KPI bridge, cap table, financing ledger, customer roll-forward, workforce roster, and
      site-level MW schedule.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
