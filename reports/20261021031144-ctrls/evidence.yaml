evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, complete board biographies, committee assignments, investor nominees, reserved matters,
      and succession plan.
    whyItMatters: >-
      Founder concentration and new institutional capital make oversight, continuity, and minority-protection rights
      material.
    diligencePath: >-
      Request the latest organization chart, board register, committee charters, shareholder agreement, and written
      succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
