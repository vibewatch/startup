  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "security-controls"
      missingEvidence: "Current independent control attestations, certification scope, penetration-test summaries, privacy controls, and incident-response test results."
      whyItMatters: "Marketing language and an SLA do not establish whether controls operate effectively across all facilities and managed-service layers."
      diligencePath: "Review SOC or ISO reports, certification scope statements, recent penetration-test executive summaries, privacy maps, and remediation logs in the data room."
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: "missing-source"
      severity: "material"
      topic: "developer-signal"
      missingEvidence: "A public developer surface or a credible practitioner-community proxy for implementation quality."
      whyItMatters: "The assigned pool contains no repository, package, engineering talk, integration forum, practitioner review, or equivalent signal that tests delivery capability."
      diligencePath: "Request public or private API documentation, engineering talks, integration references, operations hiring data, and named practitioner interviews."
      relatedQuestionRefs: [QE010]
      relatedTableRefs: [TE002]
    - type: "conflicting-data"
      severity: "material"
      topic: "operating-footprint"
      missingEvidence: "A site-level bridge reconciling ICRA's 130 MW in August 2025 with the 370 MW reported by multiple sources in 2026."
      whyItMatters: "Different definitions of live, operational, controlled, and critical IT capacity could materially change maturity and utilization conclusions."
      diligencePath: "Obtain a campus schedule listing ownership, commissioning date, utility power, critical IT load, sold capacity, installed racks, and current utilization."
      relatedQuestionRefs: [QE004, QE005]
      relatedTableRefs: [TE001]
    - type: "private-evidence-only"
      severity: "material"
      topic: "reliability"
      missingEvidence: "Facility-level uptime history, outage and near-miss logs, SLA-credit records, recovery-test results, and support performance."
      whyItMatters: "A contractual SLA and security description cannot verify realized resilience or the operating burden of rapid expansion."
      diligencePath: "Review three years of incident data, maintenance windows, SLA credits, recovery exercises, ticket response metrics, and post-incident remediation."
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE002, TE003]
