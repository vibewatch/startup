company:
  name: "CtrlS"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    CtrlS combines colocation and managed infrastructure with hyperscale, AI-ready, edge,
    and connectivity offerings across a reported 19-site, 370 MW footprint. The public
    evidence supports breadth and expansion maturity, but does not independently establish
    facility-level architecture, SLA performance, security controls, or readiness of the
    announced 4.4 GW pipeline.
sections:
  - id: "product-and-customer-workflow"
    title: "Product and customer workflow"
    body: >-
      The core customer workflow begins with physical placement: an enterprise or cloud
      provider puts customer-owned servers into shared or dedicated rack space, or contracts
      for a larger build-to-suit deployment. CtrlS then extends the physical product with
      managed hosting functions that third-party coverage describes as storage, backup and
      restoration, performance monitoring, hardware and software procurement, and network
      configuration. The broader portfolio also markets edge data centers, connectivity,
      and AI-ready managed services. This makes CtrlS a facility-and-operations platform
      rather than a pure real-estate lessor, but public evidence does not disclose module
      attach rates, service-level economics, standard deployment lead times, or the exact
      boundary between contracted managed services and customer-operated infrastructure.
    claimRefs: [CE001, CE002, CE003, CE008]
    tableRefs: [TE001, TE002]
  - id: "footprint-and-deployment-maturity"
    title: "Footprint and deployment maturity"
    body: >-
      Multiple 2026 sources report 19 operating facilities across nine Indian markets and
      more than 370 MW of capacity, while ICRA reported 130 MW across 17 facilities as of
      August 2025. The difference is directionally consistent with rapid additions, but the
      sources do not publish a common definition of operational capacity, critical IT load,
      commissioned utility power, or controlled versus joint-venture assets. Maturity is
      stronger than a greenfield pipeline alone would imply: CPP Investments refers to
      contracted capacity and long-term customer relationships, and ICRA reported the next
      three years of 40-45 MW annual additions as completely pre-leased. Underwriting still
      requires a site-by-site commissioning and utilization schedule rather than treating
      every announced megawatt as ready for customer workloads.
    claimRefs: [CE004, CE006, CE007, CE014]
  - id: "architecture-and-differentiation"
    title: "Architecture and differentiation"
    body: >-
      The available architecture evidence is descriptive rather than auditable. Reporting
      attributed to management says newer CtrlS facilities use air-cooled designs, while a
      market-data publisher describes high-density computing and liquid-cooling capability.
      Those statements suggest a portfolio that may span conventional enterprise loads and
      denser AI deployments, but they do not identify rack-density envelopes, cooling
      topology by campus, redundancy paths, network fabric, component vendors, or measured
      efficiency. Competitor Yotta publicly specifies immersion and chilled-water cooling,
      dual utility feeds, UPS and generator redundancy, and sovereign workload controls;
      that disclosure is a useful diligence benchmark, not proof that CtrlS has equivalent
      systems. CtrlS's defensible differentiation is therefore more clearly supported by
      footprint, contracted demand, service breadth, and execution history than by publicly
      verifiable proprietary technology.
    claimRefs: [CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "reliability-controls-and-roadmap"
    title: "Reliability, controls, and roadmap risk"
    body: >-
      CtrlS's industry profile states a 99.995% uptime SLA and "military-grade, 9-zone"
      security, but the assigned evidence contains no independent availability series,
      incident register, penetration-test result, control audit, certification scope, or
      recovery exercise. These remain company claims rather than verified operating
      outcomes. Roadmap ambition is substantial: current reporting cites a 4.4 GW project
      pipeline, and the CPP Investments partnership adds capital and a joint-venture vehicle
      for hyperscale campuses. Execution risk rises with that scale. ICRA expects continuous
      capacity additions, a lag before ramp-up, and moderate returns on capital during the
      build cycle. Product diligence should therefore test whether designs, operating teams,
      commissioning controls, and security governance can scale at the same pace as announced
      capacity, not infer technical readiness from financing or pipeline size.
    claimRefs: [CE005, CE009, CE010, CE015, CE016]
