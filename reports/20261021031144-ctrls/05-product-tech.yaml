    columns: ["Module or asset", "Primary user", "Public maturity signal", "Supported differentiation", "Diligence gap"]
    rows:
      - ["Enterprise colocation", "Enterprises, BFSI, government, and technology firms", "Operating service across the reported portfolio", "Customer-owned servers can use shared or dedicated rack space", "Campus-level occupancy, realized SLA, pricing, and contract terms are not public"]
      - ["Managed hosting and infrastructure", "Enterprises seeking outsourced operations", "Operating service described by independent reporting", "Storage, backup, monitoring, procurement, and network configuration extend the rack product", "Attach rates, support staffing, tooling, margins, and service boundaries are undisclosed"]
      - ["Hyperscale build-to-suit campuses", "Hyperscalers and large cloud providers", "Contracted capacity and a growing development pipeline are reported", "Pre-leasing and long-term relationships reduce some demand risk", "Commissioning schedule, customer concentration, design standard, and utilization by campus are missing"]
      - ["AI-ready, edge, and connectivity portfolio", "AI, cloud, latency-sensitive, and distributed workloads", "Marketed and under expansion; technical proof is limited", "Reported high-density, liquid-cooling, edge, and connectivity capabilities broaden the offer", "Rack-density envelope, cooling design by site, benchmarks, certifications, and live customer results are missing"]
    notes: "Statuses and differentiation are limited to the retained public sources; absence of a disclosed metric is shown as a diligence gap, not as evidence that the capability is absent."
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE008, CE012, CE014]
  - id: "TE002"
    title: "Customer workflow and use-case table"
    columns: ["User job", "Prior or customer-owned layer", "CtrlS delivery", "Measurable benefit in evidence", "Limitation"]
    rows:
      - ["Place mission-critical servers", "Customer supplies rack-mountable hardware", "Shared rack or complete-rack colocation", "No product-specific measured benefit disclosed", "No public deployment time, occupancy, price, or realized-availability series"]
      - ["Operate enterprise infrastructure", "Customer retains workload and application ownership", "Storage, backup, restoration, monitoring, procurement, and network configuration", "No product-specific measured benefit disclosed", "No attach rate, service boundary, ticket metric, or support response data"]
      - ["Deploy at hyperscale", "Customer forecasts large power and space requirement", "Build-to-suit campus capacity supported by a new development joint venture", "Contracted capacity and long-term relationships are reported", "No campus-by-campus contract tenor, delivery schedule, or acceptance criteria"]
      - ["Run dense AI or distributed workloads", "Customer brings compute demand and application stack", "AI-ready infrastructure, high-density cooling, edge sites, and connectivity", "No independently measured workload result for CtrlS in the assigned pool", "No rack-density, thermal, network-latency, or AI-customer benchmark"]
    notes: "The table separates described service mechanisms from outcomes; public sources did not provide comparable customer performance measurements."
    claimRefs: [CE002, CE003, CE011, CE012, CE014, CE015]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns: ["Layer or process", "Role", "Publicly supported evidence", "Critical dependency", "Principal risk"]
    rows:
      - ["Customer and service interface", "Match enterprise, hyperscale, cloud, AI, and edge workloads to a delivery model", "Colocation, managed hosting, build-to-suit, AI-ready, edge, and connectivity products are described", "Accurate workload forecasting and contract specifications", "A broad catalog can obscure module maturity and accountability"]
      - ["White space and managed operations", "House, monitor, restore, and configure customer infrastructure", "Rack placement plus storage, backup, monitoring, procurement, and network configuration are reported", "Skilled operations staff, spares, procedures, and customer change control", "No public support KPIs, incident history, or operating-tool evidence"]
      - ["Power and thermal plant", "Provide continuous power and remove heat across conventional and dense racks", "Newer air-cooled designs are reported; liquid-cooling capability is described by market coverage", "Grid capacity, renewable supply, chillers or air systems, generators, UPS, water, and commissioning", "Designs are not disclosed by campus and pipeline delivery is capital intensive"]
      - ["Security, resilience, and compliance", "Protect physical access, systems, and continuity", "A 99.995% SLA and 9-zone security are company claims", "Audited controls, tested recovery plans, monitoring, response teams, and certification scope", "No independent control attestation, outage series, or incident-response evidence was retained"]
    notes: "Architecture is a source-bounded operating model, not an engineering schematic; undisclosed components and controls remain diligence requests."
    claimRefs: [CE001, CE002, CE003, CE009, CE010, CE011, CE012, CE016]
figures:
  - id: "FE001"
    title: "Source-bounded product architecture map"
    type: "stack"
    summary: "The stack distinguishes customer demand, service surfaces, facility delivery, physical systems, controls, and expansion rather than implying unverified component designs."
    data:
      layers:
        - label: "Customer demand"
          items: ["Enterprise and BFSI workloads", "Hyperscale, cloud, and AI workloads"]
          detail: "Demand enters through contracted capacity or customer infrastructure requirements."
        - label: "Commercial service surface"
          items: ["Colocation and build-to-suit", "Managed hosting, edge, and connectivity"]
          detail: "Public evidence supports the service categories but not module economics."
        - label: "Deployment and operations"
          items: ["Rack and campus delivery", "Monitoring, backup, restoration, and configuration"]
          detail: "Operational tooling, support KPIs, and delivery lead times are not public."
        - label: "Physical infrastructure"
          items: ["Power and redundancy systems", "Air or liquid cooling by workload and site"]
          detail: "Assigned sources do not provide a campus-level bill of materials or topology."
        - label: "Trust and resilience controls"
          items: ["Physical and cyber security", "Availability and recovery governance"]
          detail: "SLA and security statements are not accompanied by independent control evidence."
        - label: "Capacity expansion"
          items: ["Pre-leased annual additions", "Hyperscale joint venture and multi-gigawatt pipeline"]
          detail: "Financing and pipeline evidence do not establish commissioning or technical readiness."
    approximationNotes: "Conceptual layer ordering only; it does not assert undisclosed component vendors, topology, capacity allocation, or control effectiveness."
    claimRefs: [CE003, CE005, CE007, CE011, CE014, CE015]
callouts:
  - calloutType: "strength"
    title: "Breadth is supported more strongly than proprietary technology"
    body: >-
      Public evidence supports an operating portfolio spanning colocation, managed
      infrastructure, hyperscale, edge, connectivity, and AI-oriented capacity, reinforced
      by contracted demand and a long operating footprint.
    claimRefs: [CE001, CE002, CE004, CE014]
  - calloutType: "risk"
    title: "Technical assurance remains mostly private"
    body: >-
      The retained sources do not independently verify architecture, facility-level
      efficiency, security certifications, incident history, realized uptime, or support
      performance, so technical readiness should be tested through a data-room review.
    claimRefs: [CE009, CE010, CE011, CE012, CE016]
