      - ["FY2026-FY2028 capex", "₹4,500-4,600 crore expected; ₹3,000-3,500 crore debt funded", Medium, "Expansion is structurally dependent on financing and execution", "Sources-and-uses plan, draw conditions and project-level returns"]
