callouts:
  - calloutType: strength
    title: Contract visibility supports revenue quality
    body: >-
      Medium-to-long-term contracts, defined escalators and customer switching costs support
      annuity-like inflows, although contract-level pricing and renewal data remain unavailable.
    claimRefs: [CI005, CI006]
  - calloutType: risk
    title: Growth remains financing-dependent
    body: >-
      Planned capex is predominantly debt funded, while the latest public cash balance predates the
      2026 transactions and does not establish current unrestricted liquidity or runway.
    claimRefs: [CI008, CI009, CI010, CI011, CI012]
