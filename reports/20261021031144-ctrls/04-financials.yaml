slug: ctrls
runDate: 2026-10-21
company:
  name: CtrlS
chapter:
  number: 4
  title: Financials
  summary: >-
    CtrlS has a contract-led colocation and managed-hosting model with strong reported FY2025
    operating profitability, but the investment case is inseparable from debt-funded capacity
    expansion. Public evidence supports revenue, margin, leverage and concentration benchmarks;
    realized pricing, unit economics, current cash burn and post-financing liquidity remain private.
sections:
  - id: revenue-model-and-quality
    title: Revenue model and quality
    body: >-
      CtrlS principally earns through colocation and managed hosting: customers either place their
      own rack-mounted servers in shared or dedicated racks, or buy managed services such as
      storage, backup, monitoring, procurement and network configuration. ICRA describes the
      resulting inflows as an annuity-like stream under medium-to-long-term contracts with defined
      escalations, which improves revenue visibility and makes installed capacity the central
      commercial asset. That quality is tempered by concentration: the top ten customers generated
      about 62% of consolidated FY2025 operating income. Public sources do not disclose list or
      realized rack pricing, contracted power rates, discounts, sales cycles, churn, renewal rates
      or the mix between colocation and managed services. The model therefore appears recurring,
      but pricing power and net revenue retention cannot be underwritten from public evidence.
    claimRefs: [CI005, CI006, CI007]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: reported-profitability
    title: Reported profitability and operating leverage
    body: >-
      ICRA reported provisional consolidated FY2025 operating income of ₹1,567 crore, about 17%
      above FY2024, and calculated OPBDIT at 49.6% of operating income versus 46.7% a year earlier.
      Provisional PAT was ₹251 crore and PAT margin was 16.0%, slightly below ₹256 crore and 19.1%
      in audited FY2024. BrokerChooser separately reported ₹1,561.8 crore of FY2025 operating
      revenue and ₹248.1 crore of net profit, attributing those figures to Ministry of Corporate
      Affairs filings; the close but non-identical values should not be merged without the
      underlying statements. EMIS also reported 16.64% net-sales growth and 23.75% EBITDA growth in
      2025, while noting a 2.61 percentage-point decline in net profit margin. These indicators
      support operating leverage, but they do not disclose gross margin, utilization by campus,
      energy cost per MW, maintenance capex or working-capital conversion.
    claimRefs: [CI001, CI002, CI003, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      The expansion plan is highly capital intensive. ICRA projected ₹4,500-4,600 crore of capex
      during FY2026-FY2028, financed with ₹3,000-3,500 crore of debt and the balance from internal
      accruals. It expected medium-term total debt/OPBDIT of 3.5-4.0x and DSCR of 1.6-1.9x. The last
      disclosed liquidity snapshot was ₹204 crore of unencumbered cash at March 31, 2025 against
      ₹200 crore of scheduled FY2026 debt repayment, so it is not a current runway measure.
      Separately, CPP Investments committed INR 40 billion for an 8.2% stake and up to INR 30
      billion for 48% of a campus joint venture; these are transaction commitments, not evidence
      that the entire amount is unrestricted cash on CtrlS's balance sheet. The August 2026
      ₹250-crore investment adds capital, but public evidence still does not reconcile sources and
      uses, debt drawdowns, covenants, project-finance obligations or current cash availability.
    claimRefs: [CI008, CI009, CI010, CI011, CI012]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      Revenue quality is directionally attractive because contracted capacity, escalators and
      switching friction can produce durable inflows, while FY2025 results show meaningful
      operating profitability. The counterweight is a build-ahead model in which capacity additions
      absorb capital before utilization and revenue fully ramp. ICRA explicitly identified
      debt-funded capex and moderate medium-term returns on capital as credit challenges, with
      rating pressure if sustained DSCR falls below 1.5x or debt/EBITDA exceeds 4x. The available
      evidence therefore supports a positive operating model but not a complete equity
      underwriting case. Investment committee work should require audited consolidated financials,
      campus-level utilization and contribution margins, customer concentration and contract
      schedules, a debt and covenant schedule, and a post-transaction cash-flow bridge before
      assigning value to forecast growth or treating committed capital as available runway.
    claimRefs: [CI004, CI005, CI006, CI009, CI016]
