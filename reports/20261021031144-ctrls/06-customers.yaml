artifact: customers
slug: ctrls
runDate: "2026-10-21"
company:
  name: CtrlS
chapter:
  number: 6
  title: Customers
  summary: >-
    CtrlS has credible evidence of demand across hyperscalers, enterprises, BFSI,
    government, telecom, e-commerce, IT, and smaller businesses, including pre-leased
    capacity and medium-to-long-term contracts. The strongest disclosed durability
    signal is also the central risk: ICRA reported that the top ten customers generated
    about 62% of FY2025 consolidated operating income, while named-account, renewal,
    churn, and cohort data remain undisclosed.
sections:
  - id: buyer-and-use-case-segmentation
    title: Buyer and use-case segmentation
    body: >-
      The public record points to a multi-segment infrastructure customer base rather
      than a single-industry colocation business. VCCircle describes global cloud
      providers, large enterprises, small and medium businesses, technology companies,
      and BFSI customers, while ICRA adds hyperscalers, e-commerce, telecom, government,
      and IT firms. Those buyers can purchase either colocation, where customers place
      their own servers in shared or dedicated racks, or managed hosting services such
      as storage, backup, monitoring, procurement, and network configuration. KPMG's
      sector analysis adds a demand mechanism: data-localisation and procurement
      requirements increase the need for domestic infrastructure and compliance support.
      This breadth reduces dependence on one vertical, but public sources do not show
      revenue by segment, geography, service line, or customer size, so the table is a
      market map rather than a revenue mix.
    claimRefs: [CU001, CU002, CU011, CU012]
    tableRefs: [TU001]
  - id: adoption-and-reference-quality
    title: Adoption and reference quality
    body: >-
      Adoption evidence is strongest at the capacity-contract level and weakest at the
      named-customer level. ICRA reported that CtrlS's planned annual capacity additions
      were completely pre-leased and that customers used medium-to-long-term contracts
      with defined escalations. CPP Investments separately described significant
      contracted capacity, long-term customer relationships, and a growing development
      pipeline. An executive interview published by MIT Sloan Management Review India
      says CtrlS serves more than 60 Fortune 500 companies and five of the world's top
      seven hyperscalers, but the customers are not named and the statement is not
      independently customer-confirmed. Likewise, the 2026 footprint of 19 data centres,
      nine markets, and more than 370 MW indicates delivery scale, not utilization,
      active usage, production status, or customer outcomes. No retained source supports
      converting that installed capacity into a customer count.
    claimRefs: [CU003, CU005, CU007, CU008, CU010, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      ICRA's September 2025 rating rationale provides the clearest durability evidence:
      it characterizes retention as healthy, attributes stickiness to customer
      investments and switching-related downtime risk, and describes an annuity-like
      stream supported by medium-to-long-term contracts. However, it reports no NRR,
      GRR, churn, renewal rate, cohort curve, or customer-satisfaction measure. The same
      source says the top ten customers generated about 62% of FY2025 consolidated
      operating income, making concentration material even though customer names and
      individual shares remain private. Expansion can occur through pre-leased capacity,
      additional sites, and managed services, but demand claims in company and investor
      releases are not substitutes for signed backlog or realized utilization. A 2026
      independent analysis also warns that grid availability could constrain delivery,
      linking customer expansion to site-level power access rather than capital alone.
    claimRefs: [CU004, CU005, CU006, CU009, CU013, CU014, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and purchasing map
    columns:
      - Segment
      - Buyer / user / payer
      - Evidenced use case
      - Scale or strategic value
      - Public-evidence gap
    rows:
      - - Hyperscalers and global cloud providers
        - Infrastructure and cloud platform teams
        - Colocation and AI-ready capacity
        - Named as a core segment by ICRA; CtrlS says it serves five of the top seven hyperscalers
        - Customers, contracted MW, utilization, and revenue share are undisclosed
      - - BFSI and large enterprises
        - CIO, infrastructure, risk, and compliance teams
        - Colocation, managed hosting, backup, monitoring, and data residency
        - BFSI is explicitly identified by both VCCircle and ICRA
        - Segment revenue, renewal rate, and workload outcomes are undisclosed
      - - Government and public-sector entities
        - Procurement, sovereign infrastructure, and agency technology teams
        - Domestic hosting and regulated-data infrastructure
        - ICRA identifies government entities as a customer segment
        - No named procurement record or contract value appears in the retained evidence
      - - Telecom, e-commerce, and IT firms
        - Network, platform, and infrastructure operators
        - Low-latency hosting, storage, and network configuration
        - ICRA identifies all three verticals
        - No customer-level production status or outcome is disclosed
      - - Small and medium businesses
        - Business owners and outsourced IT teams
        - Shared-rack colocation and managed infrastructure
        - VCCircle identifies small and medium businesses in the customer mix
        - Customer count, pricing, churn, and channel contribution are undisclosed
    notes: "Segment map combines public customer-category disclosures; it is not a revenue mix and contains no inferred segment shares."
    claimRefs: [CU001, CU002, CU003, CU011, CU012]
  - id: TU002
    title: Customer adoption and commercial-demand signals
    columns:
      - Metric or signal
      - Value
      - Period
      - Evidence quality
      - Implication
      - Missing denominator or limitation
    rows:
      - - Operational capacity
        - Around 130 MW
        - August 2025
        - ICRA rating analysis
        - Demonstrates an operating base serving contracted customers
        - Does not disclose utilization, customers, racks, or revenue per MW
      - - Planned annual capacity additions
        - 40-45 MW annually, described as completely pre-leased
        - Next three years from September 2025
        - ICRA rating analysis
        - Provides direct forward-demand evidence
        - No customer, price, cancellation, or commissioning schedule
      - - Publicly reported footprint
        - 19 data centres in nine markets and more than 370 MW
        - August 2026 reporting
        - Multiple trade and financial-news reports
        - Shows rapid physical expansion
        - Capacity is not equivalent to active use or customer adoption
      - - Enterprise cohort claim
        - More than 60 Fortune 500 companies
        - Public interview available in 2026
        - Company executive statement in an independent publication
        - Suggests large-enterprise reference depth
        - No names, contract status, outcomes, or denominator
      - - Hyperscaler cohort claim
        - Five of the world's top seven hyperscalers
        - Public interview available in 2026
        - Company executive statement in an independent publication
        - Suggests relevance to the largest cloud buyers
        - No names, workloads, contracted capacity, or revenue contribution
    notes: "Periods and denominators follow the cited sources; capacity, pre-leasing, customer cohorts, and realized utilization are not treated as interchangeable metrics."
    claimRefs: [CU003, CU007, CU008, CU010, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or cohort
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - More than 60 Fortune 500 companies, unnamed
        - Large enterprise
        - Data-centre infrastructure
        - Not disclosed
        - Customer-cohort scale claimed by CtrlS's CEO
        - No customer confirmation, name, contract date, or measured outcome
      - - Five of the world's top seven hyperscalers, unnamed
        - Hyperscaler / cloud
        - AI and cloud infrastructure
        - Not disclosed
        - Hyperscaler-cohort penetration claimed by CtrlS's CEO
        - No customer confirmation, name, contracted MW, or workload detail
      - - Top ten customers, unnamed
        - Cross-segment concentration cohort
        - Colocation and managed infrastructure
        - Operating relationships implied by FY2025 revenue
        - About 62% of consolidated operating income
        - No customer names, individual shares, renewals, or current-period update
    notes: "Partial inventory of publicly disclosed customer cohorts through 2026-10-21; no retained source names a customer and cohort claims are not treated as customer-confirmed case studies."
    enumerationScope:
      coverage: partial
      basis: "Publicly retained CtrlS customer evidence reviewed through the report run date; private contracts and undisclosed accounts are excluded."
    claimRefs: [CU003, CU004, CU014, CU015, CU016]
figures:
  - id: FU001
    title: Customer acquisition, delivery, and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports a path from regulatory or compute demand to contracted
      capacity and long-term operation, but not customer-level conversion or retention rates.
    data:
      nodes:
        - label: Demand trigger
          detail: "AI, cloud, digital workloads, and domestic data-residency requirements create infrastructure demand."
          touchpoints:
            - "Enterprise infrastructure planning"
            - "Compliance and data-residency assessment"
        - label: Segment and site selection
          detail: "Hyperscalers, BFSI, government, telecom, e-commerce, IT, and SMB buyers select service and geography."
          touchpoints:
            - "Power and connectivity diligence"
            - "Procurement and compliance review"
        - label: Service configuration
          detail: "Customers choose colocation or managed hosting services such as storage, backup, monitoring, procurement, and network configuration."
          touchpoints:
            - "Rack or facility requirements"
            - "Managed-service scope"
        - label: Contract and pre-lease
          detail: "ICRA reports medium-to-long-term contracts with escalations and completely pre-leased planned additions."
          touchpoints:
            - "Contract term and escalation"
            - "Reserved capacity"
        - label: Production operation
          detail: "Switching-related downtime risk and customer investment can increase stickiness once workloads are deployed."
          touchpoints:
            - "Reliability and support"
            - "Operational continuity"
        - label: Expansion or concentration
          detail: "Additional campuses and services can expand relationships, while top-ten concentration and grid constraints limit durability."
          touchpoints:
            - "Additional capacity"
            - "Concentration and power monitoring"
    approximationNotes: "The ordered journey is qualitative; public evidence does not provide stage conversion rates, customer counts, or elapsed times."
    claimRefs: [CU001, CU005, CU006, CU007, CU011, CU012, CU013, CU016]
callouts:
  - calloutType: strength
    title: Pre-leasing is the strongest adoption signal
    body: >-
      ICRA reported that planned 40-45 MW annual additions over the following three years
      were completely pre-leased, a more decision-useful indicator than logo or capacity claims.
    claimRefs: [CU007]
  - calloutType: risk
    title: Concentration is material but opaque
    body: >-
      The top ten customers generated about 62% of FY2025 consolidated operating income,
      but neither individual customer shares nor current renewal and churn metrics are public.
    claimRefs: [CU004, CU014, CU016]
