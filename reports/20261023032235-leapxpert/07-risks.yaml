        - label: Growth financing and execution
          values: [Medium, High, Partial, High, "Valuation undisclosed"]
    claimRefs: [CR001, CR005, CR009, CR012, CR016]
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Treat the thesis as impaired if independent testing finds material
      capture gaps; a critical archive or channel incident lacks timely
      reconciliation; a regulator or major customer identifies noncompliant
      retention; or expansion requires materially higher burn without disclosed
      improvement in recurring revenue, retention, and gross margin.
    claimRefs: [CR001, CR005, CR009, CR012, CR016]
  - calloutType: recommendation
    title: Risk-adjusted diligence priority
    body: >-
      Before underwriting a premium growth valuation, request current assurance
      reports, incident and uptime history, channel dependency terms, customer
      concentration and renewal cohorts, implementation references, and complete
      financing economics. Public sources support category relevance, not a
      conclusion that residual risk is low.
    claimRefs: [CR002, CR006, CR010, CR011]
