    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction, Likelihood, Severity, Mitigation evidence, Residual exposure, Diligence path]
    rows:
      - [Off-channel electronic communications recordkeeping, "US securities markets", High, Critical, "SEC enforcement and LeapXpert capture/archiving design", "Capture completeness and supervisory effectiveness are unverified", "Obtain independent capture-completeness testing, retention configuration evidence, and regulator-response references"]
      - [Privacy and cross-border processing of message content and metadata, "Multi-jurisdiction enterprise deployments", Medium, High, "Company states GDPR and CCPA compliance and offers retention/export controls; WeChat publishes jurisdiction-specific terms", "No current DPA, subprocessors, transfer mechanism, or audit report was retained", "Review current DPA, subprocessors, data residency, deletion, legal-hold, and subject-rights procedures"]
      - ["Legal hold, eDiscovery, and evidentiary integrity failure", "Customer and regulator proceedings", Medium, High, "Company describes tamper-evident records, audit trail, legal hold, and eDiscovery readiness", "No independent chain-of-custody or restoration test is public", "Run a customer-specific litigation-hold and export test with chain-of-custody sign-off"]
      - [Channel policy or platform terms change, "Consumer messaging channels", Medium, High, "Platform supports multiple channels and integration methods", "Terms, APIs, and native capture methods can change outside LeapXpert's control", "Obtain channel-by-channel fallback matrix, notice periods, and contractual allocation of change risk"]
    notes: "Rows synthesize regulator evidence and company-described controls; likelihood and residual exposure are analytical judgments pending customer and assurance testing."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented regulatory, privacy, evidentiary, and channel exposures reviewed for this 2026-10-23 chapter refresh"
    claimRefs: [CR001, CR002, CR003, CR004, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Incomplete capture or dropped messages, Medium, Critical, "Design claims include capture across channels and timestamps", "A single missing record can defeat the compliance use case", "No public uptime, capture-rate, latency, or reconciliation metrics"]
      - ["Misconfigured policy, DLP, ethical wall, or identity control", Medium, High, "Real-time controls and verifiable identity are described", "Configuration and change-management errors can create silent exceptions", "Obtain control-testing results, privileged-access logs, and customer change procedures"]
      - [Archive or surveillance export failure, Medium, High, "EML, SMTP/SFTP, XML, and REST integrations are described", "Downstream reconciliation and recovery performance are unquantified", "Test failed exports, replay, reconciliation, alerting, and recovery-time objectives"]
      - [Security incident or unauthorized access to sensitive conversations, Medium, Critical, "Encryption, role-based access, and policy retention are described", "No current incident history or independent assurance report is in the assigned evidence", "Review SOC 2 Type 2 report, penetration-test scope, incidents, and breach-notification history"]
    notes: "Company web pages describe controls and integrations; the pool contains no independent service-level or incident dataset, so residual exposure remains material."
    claimRefs: [CR005, CR006, CR007, CR008, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Consumer messaging APIs and channel behavior, "WhatsApp, iMessage, Signal, WeChat and other channels", "External communication transport", "Potentially concentrated by customer channel mix", "API, policy, or access change interrupts capture or client communication", High, "Multi-channel coverage and stated integration methods", "Fallback quality and contractual protections are not public"]
      - [Enterprise collaboration and archive integrations, "Microsoft Teams, Slack, Leap Work and archive/surveillance vendors", "User interface and downstream compliance record", "Customer-specific and implementation-dependent", "Connector outage or schema change breaks workflow or record export", High, "Open ecosystem, connectors, and REST APIs are described", "No dependency map, version policy, or restoration metrics are public"]
      - [Growth capital and senior leadership expansion, "Riverwood Capital and existing investors", "Funding and scaling support", "2026 growth round is a major disclosed financing event", "Expansion outruns controls, hiring, or unit economics", Medium, "Company says proceeds support AI, market expansion, and leadership hiring", "Valuation, burn, runway, margins, and governance terms are undisclosed"]
      - [Regulated-enterprise implementation and renewal, "Financial institutions, government agencies, and large enterprises", "Adoption, references, and recurring revenue", "Customer concentration and renewal are not disclosed", "A large customer or segment delays, exits, or fails to deploy", High, "Company reports hundreds of organizations and financial-services traction", "Obtain cohort, renewal, concentration, implementation-time, and reference data"]
    notes: "The counterparty and concentration fields reflect public descriptions, not a verified customer or contract census; private economics remain an explicit gap."
    claimRefs: [CR009, CR010, CR011, CR012]
