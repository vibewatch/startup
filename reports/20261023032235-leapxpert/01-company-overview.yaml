company:
  name: LeapXpert
chapter:
  number: 1
  title: Company Overview
  summary: LeapXpert is a privately held governed-communications software company founded in 2017 and headquartered in New York, with a platform that captures, governs, and operationalizes communications across consumer messaging channels. Public evidence supports a $180 million Riverwood-led growth round in June 2026 and meaningful regulated-enterprise traction, but current revenue, valuation, retention, and concentration metrics remain undisclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: >-
      LeapXpert describes its product as a governed communications platform for enterprise conversations that occur on consumer channels. Its current product surface spans channel enablement, governance and security controls, recordkeeping and compliance, communication intelligence, and workflow automation. The company says it supports WhatsApp, iMessage, WeChat, Signal, Telegram, SMS, RCS, and LINE, with access through native apps and enterprise collaboration tools. The product architecture is strategically coherent: capture creates an auditable enterprise record, governance applies policy and security controls, and intelligence and workflows seek to convert that record into operational value. The main qualification is attribution: the breadth, customer-user scale, and compliance certifications in the current product pages are company claims, not independently verified operating metrics.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Public records identify Dima Gutzeit as co-founder and chief executive officer and Avi Pardo as co-founder and chief business officer. Pardo describes financial services as the company's initial proving ground, while Government Technology reports that public sector is now its fastest-growing segment. Riverwood Capital managing partner Jeff Parks joined the board in connection with the 2026 financing, according to UC Today. These disclosures show founder-led commercial and product continuity plus sponsor participation, but they do not establish the full board, executive bench depth, succession plan, or the extent to which enterprise relationships depend on the founders. Key-person dependence therefore remains a material diligence question rather than a proven defect.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-and-milestones
    title: Capitalization, stakeholders, and milestones
    body: >-
      LeapXpert's June 2026 financing is described by Government Technology and UC Today as a $180 million growth round led by Riverwood Capital, with existing investor Portage Ventures participating. A Tracxn profile reports $236 million of total funding across five rounds, including a Series C dated June 30, 2026, but its displayed funding table masks several round values and valuation fields; those masked fields should not be reverse-engineered. The company says the new capital is intended to support public-sector and financial-services growth, leadership hiring, and platform development. External regulatory context strengthens the problem thesis: the SEC's 2024 enforcement action describes widespread off-channel recordkeeping failures at 26 firms, but it is not evidence that LeapXpert itself committed a violation. The timeline and stakeholder map should thus be read as a financing and market-relevance record, not as proof of profitability or valuation.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
