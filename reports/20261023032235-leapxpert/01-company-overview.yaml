callouts:
  - calloutType: strength
    title: Regulatory relevance is tangible
    body: The SEC's documented off-channel recordkeeping enforcement provides independent evidence that the compliance problem LeapXpert addresses is material in regulated finance, while company and third-party coverage indicate expansion into government and broader enterprise use.
    claimRefs: [CO006, CO012, CO013]
  - calloutType: risk
    title: Economics remain opaque
    body: The latest financing is substantial, but the assigned public evidence does not establish post-money valuation, revenue, ARR, retention, gross margin, customer concentration, or the primary-versus-secondary mix.
    claimRefs: [CO010, CO014, CO015]
