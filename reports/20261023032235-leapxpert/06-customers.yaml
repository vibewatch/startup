          claimRefs: [CU004, CU013]
        - id: govern
          label: "Govern and capture"
          detail: "Policy enforcement, DLP, immutable records, retention, and archive export are the core control surface."
          claimRefs: [CU010, CU014]
        - id: prove
          label: "Deployment-specific proof"
          detail: "A public case-study profile describes 15,000 front-end employees at a Tier 1 financial institution."
          claimRefs: [CU009]
        - id: intelligence
          label: "Intelligence and workflows"
          detail: "Signals, Maxen, and Communication Workflows are positioned as expansion surfaces."
          claimRefs: [CU011, CU012]
        - id: diligence
          label: "Renewal and concentration diligence"
          detail: "NRR, churn, contract length, customer concentration, and production outcomes are not public."
          claimRefs: [CU015, CU016]
    claimRefs: [CU001, CU009, CU011, CU015]
callouts:
  - calloutType: strength
    title: Regulated workflow fit
    body: The clearest customer proof aligns the product with compliance-heavy messaging and archiving workflows, especially in financial services.
    claimRefs: [CU001, CU009, CU010]
  - calloutType: risk
    title: Retention is not public
    body: Public adoption signals do not disclose NRR, GRR, churn, contract duration, or customer concentration, so durability remains unverified.
    claimRefs: [CU007, CU015, CU016]
  - calloutType: recommendation
    title: Request account-level cohort evidence
    body: Diligence should request customer cohorts, renewal and expansion data, top-account revenue shares, and production-versus-pilot status for named proof.
    claimRefs: [CU008, CU009, CU015]
