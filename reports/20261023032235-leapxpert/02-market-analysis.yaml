    claimRefs: [CM007, CM008, CM013, CM014]
callouts:
  - calloutType: insight
    title: Compliance is the evidenced wedge
    body: >-
      Regulatory recordkeeping and supervision provide the clearest adoption
      trigger; intelligence and workflow products may expand spend, but public
      evidence does not quantify that expansion.
    claimRefs: [CM004, CM013, CM016]
  - calloutType: risk
    title: The numeric market case is not underwriting-ready
    body: >-
      The retained $1.95 billion projection lacks disclosed methodology, while
      pricing, penetration, segment budgets, and attainable share remain unknown.
    claimRefs: [CM007, CM008]
