  - id: FE001
    title: LeapXpert product architecture map
    type: stack
    summary: >-
      The product stack moves from external channel access through governance and capture into intelligence and workflow
      action.
    data:
      layers:
        - id: channels
          label: Enable
          detail: Connect employees and clients through supported consumer and enterprise messaging surfaces.
          items:
            - label: Consumer messaging
              detail: WhatsApp, iMessage, WeChat, Signal, Telegram, SMS, RCS, and LINE
            - label: Enterprise surfaces
              detail: Microsoft Teams, Slack, Leap Work, and WeCom
        - id: governance
          label: Govern
          detail: Apply policy and security controls at the point of communication.
          items:
            - label: Policy controls
              detail: Policy enforcement, DLP, ethical walls, information barriers, anti-virus, and identity
        - id: capture
          label: Capture
          detail: Create governed records and deliver them to enterprise compliance systems.
          items:
            - label: Recordkeeping
              detail: Timestamped records, metadata, retention, legal hold, audit trail, and eDiscovery readiness
            - label: Archive integrations
              detail: EML, SMTP/SFTP, XML, and REST API exports
        - id: intelligence
          label: Understand
          detail: Turn governed communication data into signals and client context.
          items:
            - label: Signals
              detail: Compliance, cyber, and business signals across channels, teams, and clients
            - label: Maxen
              detail: Client context, history, themes, and risks from governed messaging
        - id: action
          label: Act
          detail: Trigger recorded business workflows from communication context.
          items:
            - label: Communication workflows
              detail: Onboarding, follow-ups, notifications, and escalations
        - id: assurance
          label: Assure
          detail: Apply retention, auditability, and security evidence across the stack.
          items:
            - label: Trust controls
              detail: Retention, audit trail, encryption, access controls, and stated compliance credentials
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
      - CE013
      - CE014
