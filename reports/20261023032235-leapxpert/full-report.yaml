        blocks:
          - type: paragraph
            body: >-
              LeapXpert's June 2026 financing is described by Government Technology and UC Today as a $180 million
              growth round led by Riverwood Capital, with existing investor Portage Ventures participating. A Tracxn
              profile reports $236 million of total funding across five rounds, including a Series C dated June 30,
              2026, but its displayed funding table masks several round values and valuation fields; those masked fields
