              - CE005
              - CE006
              - CE013
              - CE014
      - number: '5.2'
        title: Architecture, capture, and integration model
        blocks:
          - type: paragraph
            body: >-
              The documented operating model is a federated communication layer rather than a replacement for every
              enterprise system. LeapXpert describes governed and native interaction modes, a centralized record with
              timestamps and metadata, policy controls such as DLP and information barriers, and exports to archiving,
              surveillance, and eDiscovery platforms through EML, SMTP/SFTP, XML, and REST APIs. Its 2022 launch
              announcement also described Microsoft Teams integration, iMessage capture, voice recording, and an open
              ecosystem with Microsoft, BlackBerry, MobileIron, and OpenFin. These are useful architectural signals, but
              the public material does not disclose throughput, latency, data-residency choices, recovery objectives,
              test results, or the technical boundaries of each connector.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
      - number: '5.3'
        title: Maturity, trust, and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              Product maturity has company-reported support in a 2019 platform origin and subsequent expansion into
              voice and intelligence. Two independent profiles offer only indirect scale signals: GetLatka estimates
              $20.9 million of annual revenue as of June 2024, while FundedIQ reports three of the ten largest global
              banks and tens of thousands of users; neither metric verifies technical performance. The public GitHub
              organization shows 22 repositories but no public members, and its visible repository list includes forks,
              so it is a developer signal rather than proof of the production stack. LeapXpert's recordkeeping page
              describes encrypted logs, role-based access, retention controls, and audit support, but no retained
              independent audit report or incident history verifies control effectiveness. External messaging services
              also remain dependencies: Signal and WeChat reserve rights to interrupt, change, suspend, or discontinue
              services or features.
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
              - CE012
              - CE016
      - number: '5.4'
        title: Product and technology verdict
        blocks:
          - type: paragraph
            body: >-
              LeapXpert has a coherent product wedge: it converts uncontrolled client messaging into a governed
              enterprise data stream, then sells additional intelligence and workflow value on top of that stream. Its
              differentiation is strongest where channel access, compliance recordkeeping, and existing archive
              integration must coexist; the 2025 WhatsApp-to-Teams calling launch illustrates continued extension into a
              high-friction channel. The public record is weaker on independent proof of uptime, security assurance
              scope, integration implementation time, and customer-level outcomes. Investment diligence should request
              current audit reports and bridge letters, architecture and data-flow diagrams, channel-by-channel support
              matrices, service-level and recovery metrics, penetration-test summaries, and evidence that Signals,
              Maxen, and workflows are deployed rather than only marketed.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent wedge
            body: >-
              LeapXpert links channel access, governance, recordkeeping, and downstream intelligence in one operating
              model rather than treating compliance as a separate archive product.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE013
          - type: callout
            title: Technical proof gap
            body: >-
              Public materials do not establish channel-level reliability, audit scope, recovery performance,
              integration effort, or production outcomes for the newer intelligence modules.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
