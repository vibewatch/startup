chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              LeapXpert describes its product as a governed communications platform for enterprise conversations that
              occur on consumer channels. Its current product surface spans channel enablement, governance and security
              controls, recordkeeping and compliance, communication intelligence, and workflow automation. The company
              says it supports WhatsApp, iMessage, WeChat, Signal, Telegram, SMS, RCS, and LINE, with access through
              native apps and enterprise collaboration tools. The product architecture is strategically coherent:
              capture creates an auditable enterprise record, governance applies policy and security controls, and
              intelligence and workflows seek to convert that record into operational value. The main qualification is
              attribution: the breadth, customer-user scale, and compliance certifications in the current product pages
              are company claims, not independently verified operating metrics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
