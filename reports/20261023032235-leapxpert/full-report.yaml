      - number: '4.2'
        title: Cost structure and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              The platform is positioned for regulated enterprises and integrates with existing archive, surveillance,
              eDiscovery, and collaboration systems. Those capabilities can support expansion revenue, but they also
              imply implementation, integration, compliance, support, and ongoing channel-maintenance costs. The
              assigned evidence provides no gross margin, CAC, sales-cycle, payback, deployment-cost, uptime, or
              support-cost disclosure. A 2026 report says the company plans to deepen AI, expand into financial
              services, public sector, and the broader enterprise market, and add senior leadership; these are stated
              uses of capital, not evidence of operating leverage. Underwriting should therefore model separate software
              subscription, services, and AI investment pools rather than assume SaaS margins.
            claimRefs:
              - CI002
              - CI008
              - CI010
              - CI011
              - CI006
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI011
              - CI012
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              LeapXpert announced a $180 million growth investment led by Riverwood Capital with participation from
              existing investor Portage Ventures. Coverage consistently says proceeds are intended for AI and
              governed-conversation capabilities, expansion across financial services, the public sector and broader
              enterprise markets, and senior-leadership hiring. The financing improves near-term capital capacity, but
              neither the company nor the independent coverage in this pool discloses cash on hand, burn, runway, debt,
              primary-versus-secondary mix, or post-money valuation. Dealroom reports a $900 million valuation for the
              June 2026 financing, while contemporaneous coverage says valuation and other financial terms were not
              disclosed; this is a material verification issue, not a settled valuation fact. The verdict is
              research-more: financing risk appears reduced, while revenue quality, margin path, and price paid remain
              underwriting blockers.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital capacity improved
            body: >-
              The $180 million Riverwood-led growth investment is a meaningful disclosed financing signal and is
              earmarked for product and market expansion.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
          - type: callout
            title: Economics remain private
            body: >-
              No assigned source discloses revenue, gross margin, retention, burn, runway, or realized pricing, so
              financing size cannot substitute for an operating model.
            calloutType: risk
            claimRefs:
              - CI003
              - CI006
              - CI011
          - type: callout
            title: Underwrite the contract base
            body: >-
              Request product-level bookings and revenue, cohort retention, implementation cost, cash and burn, debt,
              and financing terms before assigning a premium valuation.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI011
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              LeapXpert's product is positioned around a concrete enterprise workflow: an employee communicates with a
              client in the client's preferred channel, while the organization applies policy, captures the exchange,
              and routes governed data into existing systems. The platform lists WhatsApp, iMessage, WeChat, Signal,
              Telegram, SMS, RCS, and LINE, with employee access through native applications, Microsoft Teams, Slack,
              Leap Work, or WeCom. This is more than a channel connector: the current platform description separates
              Enable, Govern, Capture, Understand, and Act layers, adding Signals, Maxen client intelligence, and
              communication workflows to the original messaging-and-archive proposition. The breadth is
              company-described rather than independently benchmarked, so deployment coverage and feature parity by
              channel remain diligence items.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
