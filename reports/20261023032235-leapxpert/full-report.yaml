        title: Leadership, governance, and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              Public records identify Dima Gutzeit as co-founder and chief executive officer and Avi Pardo as co-founder
              and chief business officer. Pardo describes financial services as the company's initial proving ground,
              while Government Technology reports that public sector is now its fastest-growing segment. Riverwood
              Capital managing partner Jeff Parks joined the board in connection with the 2026 financing, according to
              UC Today. These disclosures show founder-led commercial and product continuity plus sponsor participation,
              but they do not establish the full board, executive bench depth, succession plan, or the extent to which
              enterprise relationships depend on the founders. Key-person dependence therefore remains a material
              diligence question rather than a proven defect.
