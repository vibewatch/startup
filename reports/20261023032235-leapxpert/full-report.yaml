              strengthens the problem thesis: the SEC's 2024 enforcement action describes widespread off-channel
              recordkeeping failures at 26 firms, but it is not evidence that LeapXpert itself committed a violation.
              The timeline and stakeholder map should thus be read as a financing and market-relevance record, not as
