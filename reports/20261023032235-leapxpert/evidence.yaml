evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Current ARR or revenue run-rate, growth, gross margin, retention, burn, and runway.
    whyItMatters: The financing size alone cannot establish commercial quality, efficiency, or valuation support.
    diligencePath: Request the latest management KPI pack, audited financials, cohort retention, bookings, and budget.
    relatedQuestionRefs:
      - QO006
      - QO007
      - QO010
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Post-money valuation, cap table, liquidation preferences, and primary versus secondary mix for the June 2026
      round.
    whyItMatters: Return potential and investor alignment depend on entry valuation and security terms, not gross funding alone.
    diligencePath: Request the executed financing term sheet, capitalization table, and preference stack under NDA.
    relatedQuestionRefs:
      - QO006
      - QO010
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete executive and board roster, succession coverage, and founder-linked customer or revenue concentration.
    whyItMatters: A founder-led enterprise sales motion can create execution and continuity risk as the company scales.
    diligencePath: Obtain the current organization chart, board materials, succession plan, and revenue-by-owner analysis.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: Verified dates and outcomes for partnerships, FedRAMP progress, acquisitions, and operating-office expansion.
    whyItMatters: These milestones would clarify public-sector execution and the durability of the expansion narrative.
    diligencePath: >-
      Request a dated corporate milestone register and independently verify material partnership and authorization
      claims.
    relatedQuestionRefs:
      - QO008
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: A complete current cap table and verified list of all debt, equity, and secondary stakeholders.
    whyItMatters: The partial investor map cannot establish ownership, control, dilution, or economic alignment.
    diligencePath: Request the latest capitalization table, financing agreements, and investor rights schedule under NDA.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: >-
      Comparable independent market revenue, CAGR, pricing, and share data for a consistently defined
      governed-communications category.
    whyItMatters: >-
      The retained broad estimate lacks enough methodology to convert category relevance into TAM, SAM, SOM, or
      valuation support.
    diligencePath: >-
      Obtain current analyst market models and public-vendor revenue disclosures with matching category boundaries and
      geographic scope.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyers
    missingEvidence: >-
      Segment-level budget ownership, annual contract value, implementation duration, procurement conversion, renewal,
      and expansion data.
    whyItMatters: >-
      The buyer map cannot establish serviceable demand, sales-cycle friction, or attainable share without commercial
      denominators.
    diligencePath: Request anonymized pipeline, win-loss, cohort, ACV, implementation, renewal, and expansion data by segment.
    relatedQuestionRefs:
      - QM006
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: adjacencies
    missingEvidence: >-
      Independent evidence of public-sector and healthcare procurement volume, completed authorizations, and
      referenceable deployments.
    whyItMatters: Regulatory adjacency does not itself establish product fit, timing, or funded demand.
    diligencePath: >-
      Verify authorizations, awarded contracts, procurement vehicles, deployments, and segment revenue with primary
      documents.
    relatedQuestionRefs:
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable price cards, realized discounts, renewal terms, and implementation costs for LeapXpert, Smarsh, Global
      Relay, and adjacent vendors.
    whyItMatters: >-
      Without commercial terms, feature differentiation cannot be translated into price power, payback, or switching
      economics.
    diligencePath: Request anonymized proposals and renewal cohorts from management and at least two competitive losses.
    relatedQuestionRefs:
      - QP005
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: durability
    missingEvidence: Independent win-rate, retention, deployment-duration, and customer-concentration evidence.
    whyItMatters: >-
      These measures determine whether integrations and regulated workflow fit create a durable moat rather than a
      feature wedge.
    diligencePath: >-
      Obtain cohort retention, competitive displacement, implementation timelines, and top-account concentration under
      NDA.
    relatedQuestionRefs:
      - QP006
      - QP010
    relatedTableRefs:
      - TP002
      - TP003
  - type: access-blocked
    severity: minor
    topic: competitor
    missingEvidence: Readable Theta Lake product and pricing material.
    whyItMatters: An adjacent unified-communications capture competitor cannot be compared on the same evidence basis.
    diligencePath: Retrieve a first-party product brief or demonstration through an approved source review.
    relatedQuestionRefs:
      - QP001
      - QP010
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: private-financials
    missingEvidence: >-
      Current revenue or ARR, growth, gross margin, net retention, churn, CAC, payback, cash, burn, runway, debt, and
      working-capital data.
    whyItMatters: >-
      Without operating metrics, the financing size and product breadth cannot establish revenue quality, margin path,
      or capital efficiency.
    diligencePath: >-
      Request monthly management accounts, ARR bridge, cohort retention, sales-efficiency schedules, cash forecast, debt
      schedule, and board-approved plan.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Signed financing documents or investor/company confirmation of the June 2026 valuation and
      primary-versus-secondary mix.
    whyItMatters: >-
      A third-party $900 million valuation conflicts with contemporaneous reports that financial terms were undisclosed
      and materially changes return analysis.
    diligencePath: >-
      Obtain the term sheet, cap table, preferred-rights summary, and confirmation of post-money valuation from
      management or lead investor.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Public or management evidence on implementation cost, support burden, sales cycle, and renewal economics.
    whyItMatters: >-
      Integration-heavy regulated deployments may have materially different gross margin and payback than a pure
      self-serve SaaS model.
    diligencePath: >-
      Request representative contracts, implementation statements of work, deployment timelines, support tickets, and
      cohort-level CAC/payback.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: material
    topic: trust
    missingEvidence: Current SOC 2 Type 2 report, ISO certification scope, bridge letter, and recent penetration-test summary.
    whyItMatters: >-
      The company states compliance credentials, but scope and control effectiveness determine whether regulated
      customers receive the promised assurance.
    diligencePath: Request current audit and certification reports, control exceptions, bridge letters, and remediation status.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Channel-level uptime, recovery point and recovery time objectives, incident history, and service-level
      performance.
    whyItMatters: A multi-channel regulated communications layer can fail operationally even when feature descriptions are credible.
    diligencePath: Obtain the last 12 months of SLO dashboards, incident postmortems, DR tests, and contractual SLA credits.
    relatedQuestionRefs:
      - QE008
      - QE010
  - type: private-evidence-only
    severity: material
    topic: intelligence
    missingEvidence: Independent customer evidence for Signals, Maxen, and Communication Workflows in production.
    whyItMatters: >-
      The newer modules drive the expansion thesis, but public descriptions do not prove deployment, accuracy, or
      incremental value.
    diligencePath: >-
      Request anonymized usage, deployment counts, reference calls, evaluation methodology, and outcome metrics by
      module.
    relatedQuestionRefs:
      - QE005
      - QE009
      - QE010
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Production-relevant public engineering artifacts, release history, or practitioner references linked to the
      platform.
    whyItMatters: >-
      The GitHub organization is a weak external signal and does not establish that public repositories represent the
      core product.
    diligencePath: >-
      Request a product repository map, release cadence, dependency inventory, and engineering quality metrics under
      NDA.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Cohort-level NRR, GRR, churn, renewal, contract-length, and expansion data by customer segment.
    whyItMatters: Adoption signals and testimonials do not establish recurring durability or net expansion.
    diligencePath: >-
      Request anonymized cohort tables for the last eight quarters, including logo retention, dollar retention, gross
      churn, renewals, and expansion.
    relatedQuestionRefs:
      - QU004
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: customer-proof
    missingEvidence: A complete named-customer and deployment register with production-versus-pilot status and outcomes.
    whyItMatters: Public proof is partly anonymized and cannot support customer concentration or repeatability analysis.
    diligencePath: Obtain a referenceable customer list, deployment stage, go-live dates, use cases, and verified outcomes under NDA.
    relatedQuestionRefs:
      - QU003
      - QU006
      - QU009
    relatedTableRefs:
