callouts:
  - calloutType: "insight"
    title: "Demand evidence is stronger than share evidence"
    body: "The OpenAI capacity commitment, AWS distribution arrangement, and rapid cloud-and-services growth demonstrate commercial pull. None of the retained sources establishes what proportion of broad AI hardware spend is technically suitable, economically attractive, or competitively obtainable by Cerebras."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM016"
  - calloutType: "risk"
    title: "Concentration can mimic market breadth"
    body: "Large contracts can create revenue visibility without demonstrating diversified adoption. The 2025 concentration reported for MBZUAI and G42 makes customer-level utilization, renewal economics, and margin conversion more decision-useful than applying a top-down market share assumption."
    claimRefs:
      - "CM015"
      - "CM016"
