company:
  name: "Cerebras Systems"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Cerebras addresses a narrow, capital-intensive slice of AI infrastructure: wafer-scale systems and cloud capacity for large-model training and latency-sensitive inference. Published 2030 market forecasts span more than $200 billion for AI accelerators to nearly $250 billion for broader AI hardware, but neither source discloses enough methodology to derive a defensible Cerebras SAM or SOM; the strongest current demand evidence is instead the company's disclosed customer commitments and revenue mix."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Substitutes"
    body: >-
      Cerebras competes in AI compute infrastructure rather than in the whole semiconductor or
      software market. The included spend is dedicated accelerator hardware, integrated
      supercomputing systems, and cloud-delivered training or inference capacity for large AI
      workloads. General-purpose CPUs, end-user devices, model-development software, data
      labeling, and ordinary cloud storage sit outside this boundary. The company sells both
      on-premises systems and cloud access, so the relevant buyer choice spans capital purchases,
      reserved infrastructure capacity, and usage-based services rather than a single chip budget.
      Status-quo substitutes include GPU clusters, hyperscaler-owned accelerators, and conventional
      cloud AI services. Cerebras is therefore not entitled to the whole AI hardware forecast:
      its practical opportunity is the subset of workloads for which latency, model scale, or
      programming simplicity offsets ecosystem familiarity, switching cost, power, and facility
      requirements. That boundary also separates a technically addressable workload from spend
      Cerebras can realistically capture.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM011"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Sizing Lenses and Demand Evidence"
    body: >-
      Two third-party forecasts provide broad upper bounds, not a reconciled market model.
      KoalaGains projects the AI accelerator market at more than $200 billion by 2030 with growth
      above 30% CAGR, while Sacra projects the broader AI hardware market at nearly $250 billion
      by 2030. The category definitions, base years, geographies, and calculation methods are not
      disclosed in the fetched text, so the endpoints should not be averaged or relabeled as
      Cerebras TAM. Company-scale evidence is more concrete but answers a different question:
      Cerebras reported $193.4 million of Q1 2026 GAAP revenue, split between $110.6 million of
      hardware and $82.8 million of cloud and other services, and disclosed an OpenAI agreement
      for 750 MW valued above $20 billion. These figures demonstrate demand and route-to-market
      expansion, but a customer contract is not market size and recognized revenue is not SAM.
      No retained source isolates the spend pool addressable by wafer-scale systems or provides
      adoption probabilities needed for a defensible SOM.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM008"
      - "CM009"
      - "CM010"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyers, Users, Payers, and Adoption Path"
    body: >-
      The evidence supports several buyer groups but does not disclose most internal budget
      owners. Frontier model developers and hyperscalers buy or distribute dedicated inference
      capacity; national laboratories, research institutions, and sovereign programs purchase
      integrated systems for large scientific or national-scale workloads; enterprises and
      application developers can access the architecture through cloud services without owning
      hardware. The likely economic buyer is therefore an infrastructure, research, or technology
      executive, while day-to-day users are model engineers, researchers, and application teams.
      The route to adoption differs by segment: a laboratory can procure an appliance, a frontier
      lab can reserve multi-year capacity, a hyperscaler can integrate Cerebras into a broader
      service, and an enterprise can begin with cloud trials. Exact signatories, approval
      thresholds, sales-cycle length, and budget-line ownership remain private. Those omissions
      matter because technical users may value speed while finance and facilities teams evaluate
      total cost, power, utilization, and vendor risk.
    claimRefs:
      - "CM002"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM012"
      - "CM014"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation"
    title: "Growth Drivers, Adoption Constraints, and Valuation Relevance"
    body: >-
      The central demand thesis is that interactive and agentic applications increase the value
      of tokens delivered with low latency. An investor letter carried by Yahoo Finance describes
      fast inference as a rapidly growing compute subsegment, and Cerebras's OpenAI and AWS
      arrangements provide customer and distribution signals consistent with that thesis. The
      counterweight is a demanding adoption equation. GPU software ecosystems and hyperscaler
      breadth remain the default; on-premises systems carry multi-million-dollar pricing and
      specialized power requirements; cloud expansion requires data-center capacity and capital;
      and customer concentration can turn a large commitment into counterparty and execution
      exposure. Wikipedia reports that MBZUAI and G42 represented 62% and 24% of 2025 revenue,
      respectively, while KoalaGains independently describes more than 85% concentration in two
      customers. For valuation, the broad market forecasts justify a growth-market framing but
      not a precise share assumption. Underwriting should instead test contract conversion,
      diversified utilization, switching economics, and gross profit after infrastructure costs.
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM011"
      - "CM013"
      - "CM014"
      - "CM015"
      - "CM016"
