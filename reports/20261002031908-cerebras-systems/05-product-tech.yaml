company:
  name: "Cerebras Systems"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Cerebras delivers wafer-scale AI compute through on-premises systems and cloud services, with the current stack centered on WSE-3, CS-3, and the announced three-wafer CS-4. The evidence supports a differentiated data-locality architecture and an AWS prefill/decode integration, but public proof of CS-4 field reliability, standardized security controls, and independently comparable performance remains incomplete."
sections:
  - id: "portfolio-and-customer-workflow"
    title: "Product Portfolio and Customer Workflow"
    body: "Cerebras packages the same core computing approach into several delivery forms rather than a single appliance. SEC-filed company material and an independent company profile describe both on-premises systems and cloud APIs, allowing a buyer either to deploy hardware or consume hosted inference and training capacity. CS-3 is the installed system referenced in the AWS architecture, while Sacra and Venture Atlas describe CS-4 as an announced rack built from three WSE-3 Turbo processors. Sacra also identifies CSoft and associated services as parts of the offer. The practical diligence distinction is maturity: CS-3 and cloud services have stated operating use, whereas the assigned evidence records CS-4 shipment guidance rather than independently verified production acceptance."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "architecture-and-differentiation"
    title: "Architecture and Technical Differentiation"
    body: "The architectural thesis is to reduce cross-chip movement by using an entire wafer as the processor. Wikipedia's synthesis describes WSE-3 as a 215 mm-square wafer-scale semiconductor using switched fabric and SRAM; it attributes lower latency and fewer interconnect bottlenecks to that layout. The same source reports material trade-offs, including a 25 kW power draw and a price as high as $3 million per node, so the integration advantage cannot be separated from facility and capital requirements. Cerebras engineering job material further indicates that product execution spans RTL, synthesis, design-for-test, silicon bring-up, third-party IP, networking, storage, and physical deployment. The resulting stack is vertically integrated, but public evidence does not expose wafer yield, defect rates, or field failure data."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-integration-and-roadmap"
    title: "Deployment, Integration, Reliability, and Roadmap"
    body: "The clearest integration design in the retained evidence is the AWS partnership announced in Cerebras's SEC-filed Q1 2026 release: Trainium 3 performs prompt prefill and CS-3 performs decode. This separates stages with different compute characteristics, but it also creates a cross-vendor orchestration and deployment dependency that is not resolved by chip specifications alone. A Cerebras-authored infrastructure job listing describes rack layouts, bills of materials, power allocations, cable maps, deployment-readiness reviews, validation checks, and root-cause analysis, which is evidence of intended operating discipline rather than proof of achieved reliability. CS-4 adds roadmap upside, but independent acceptance tests, service-level history, and named shipment verification were not available in this pool."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE008"
      - "CE009"
      - "CE013"
    tableRefs:
      - "TE002"
  - id: "performance-software-and-trust-risks"
    title: "Performance, Software Adoption, and Trust Controls"
    body: "Cerebras reports more than 1,000 tokens per second for Codex-Spark and says Kimi K2.6 approached 1,000 tokens per second in an Artificial Analysis measurement, while Gemma 4 31B ran an order of magnitude faster based on that index. These are named results, but the company's own website cautions that performance comparisons may rely on third-party benchmarking or internal testing and vary by workload, configuration, date, and model. Sacra separately identifies developer dependence on Nvidia's mature CUDA ecosystem as a software-adoption risk for Cerebras's bespoke stack. The assigned pool does not establish security certifications, privacy controls, a public status history, support SLAs, or formal quality attestations; that is a diligence gap, not evidence that such controls are absent."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE014"
      - "CE016"
