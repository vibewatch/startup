company:
  name: "Cerebras Systems"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Cerebras has broadened from sovereign, research, and enterprise hardware users
    toward large inference commitments with OpenAI and AWS, but the evidence still
    shows material counterparty concentration. Public proof is strongest for named
    contracts, trials, and selected integrations; active-customer, retention, and
    cohort-expansion metrics remain undisclosed in the assigned evidence.
sections:
  - id: "customer-segments"
    title: "Customer Segments and Buying Motions"
    body: >-
      Cerebras reaches buyers through several distinct motions rather than one
      homogeneous customer funnel. Its historical base includes national laboratories,
      sovereign AI organizations, and life-sciences or industrial enterprises using
      on-premises systems for large scientific and model workloads. The newer inference
      motion addresses frontier-model developers and hyperscalers: OpenAI has a large
      direct capacity agreement, while AWS is intended to distribute Cerebras-backed
      inference to startups and enterprises. A third surface consists of enterprise and
      developer integrations such as Notion and Cline. Contract form differs by surface:
      the allocated evidence describes outright system purchases with renewable software
      subscriptions, reserved cloud capacity under take-or-pay terms, and on-demand usage.
      Those channels identify buyer and user groups, but they do not establish how many
      active paying customers Cerebras has in each segment.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU009"
      - "CU014"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-and-proof"
    title: "Adoption Signals and Named-Customer Proof"
    body: >-
      The clearest current adoption signals are contracted capacity, services revenue,
      announced trials, and specific integrations rather than a disclosed customer
      count. Cerebras reported $82.8 million of GAAP cloud and other services revenue
      for the quarter ended March 31, 2026, up 178% year over year. OpenAI agreed to
      deploy 750 megawatts of high-speed inference compute under a multi-year deal
      valued above $20 billion, and Cerebras announced a multi-year AWS partnership.
      The status labels matter: Kimi K2.6 and Gemma 4 were described as enterprise
      customer trials, while the AWS announcement describes a distribution and
      deployment plan rather than evidence of realized end-customer usage. Sacra
      separately reports deployed enterprise surfaces at Notion and Cline, but the
      allocated pool contains no primary customer documents for those outcomes.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-and-concentration"
    title: "Durability, Expansion, and Concentration"
    body: >-
      Counterparty concentration remains the central customer-quality risk. BBAE and
      Wikipedia report that MBZUAI and G42 represented approximately 62% and 24% of
      2025 revenue, respectively, or 86% in aggregate. The 2026 OpenAI and AWS
      relationships broaden the named-customer set, but Cerebras itself still lists
      OpenAI, G42, MBZUAI, and AWS among the significant customers on which it depends.
      This is not the same as demonstrated diversification: the allocated sources do
      not disclose recognized revenue by those newer relationships, deployment
      milestones, cancellation protections, or the share of capacity already utilized.
      Simply Wall St further frames under-filled capacity or changed OpenAI and AWS
      deployment choices as risks to utilization and margins. Renewable subscriptions
      and take-or-pay cloud terms can improve contractual durability, but no public
      NRR, GRR, churn, renewal, or cohort data in the assigned pool tests realized
      retention.
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
  - id: "diligence-implications"
    title: "What the Evidence Does and Does Not Prove"
    body: >-
      The named relationships provide credible evidence that Cerebras can sell to
      sophisticated AI laboratories, cloud platforms, sovereign institutions, national
      laboratories, and enterprises. They do not yet prove a broad, durable revenue
      base. User-base figures attached to Notion or Cline describe the distribution
      surface of those products, not the number of paying Cerebras customers or the
      amount of Cerebras-attributable usage. Likewise, agreement value and megawatts
      are commitments, not recognized revenue, customer retention, or capacity
      utilization. Investment diligence should therefore reconcile contract schedules
      to recognized revenue, request segment-level active account and renewal cohorts,
      separate pilots from production traffic, and quantify top-one and top-five
      customer exposure after the OpenAI and AWS ramps.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU010"
      - "CU011"
      - "CU016"
