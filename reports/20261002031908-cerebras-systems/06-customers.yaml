callouts:
  - calloutType: "risk"
    title: "Diversification Is Not Yet Demonstrated"
    body: >-
      OpenAI and AWS expand the roster of strategic counterparties, but Cerebras still
      identifies a limited set of significant customers and the allocated evidence
      does not show post-ramp revenue shares. The prior 86% concentration in MBZUAI and
      G42 can therefore be described as historical evidence of concentration, not as a
      risk already resolved by newer contract announcements.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU007"
      - "CU008"
      - "CU013"
  - calloutType: "insight"
    title: "Customer Proof Has Uneven Strength"
    body: >-
      Contracted megawatts and reported revenue are stronger commercial evidence than
      trials, logos, user-base reach, or marketplace availability. Diligence should
      preserve those distinctions and request production traffic, recognized revenue,
      renewal, and cohort data before treating the visible customer roster as durable
      recurring adoption.
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU010"
      - "CU011"
      - "CU016"
