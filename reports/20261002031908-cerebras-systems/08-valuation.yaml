callouts:
  - calloutType: "risk"
    title: "Accounting Distortion in Headline GAAP Profitability"
    body: "Investors anchoring on Cerebras' 2025 GAAP net income of $237.8 million face severe optical distortion. This reported profit was almost entirely generated by a non-recurring, non-cash gain of $363.3 million resulting from the extinguishment of a forward contract liability related to G42's initial investment. Stripping away this accounting event, Cerebras generated a GAAP operating loss of $145.9 million and a non-GAAP net loss of $75.7 million in 2025. Evaluating CBRS on a standard trailing P/E basis (222x) relies on non-repeatable financial engineering rather than operating cash flow."
    claimRefs:
      - "CV005"
      - "CV007"
  - calloutType: "insight"
    title: "The Strategic Importance of the OpenAI 750MW Agreement"
    body: "Cerebras' agreement with OpenAI represents a transformative commercial endorsement, committing 750 megawatts of high-speed wafer-scale inference compute valued at over $20 billion through 2028. Beyond commercial revenue, OpenAI provided a $1 billion working capital advance in early 2026 and holds warrants for up to 33.4 million shares tied to compute deployment milestones. While this solidifies Cerebras as a premier AI inference provider alongside AWS, it cements extreme counterparty dependence on OpenAI's infrastructure roadmap."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV006"
