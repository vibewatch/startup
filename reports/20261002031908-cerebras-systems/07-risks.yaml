callouts:
  - calloutType: risk
    title: Correlated execution risk is the central diligence issue
    body: >-
      A customer delay can strand data-center investment, a manufacturing shortfall can impair delivery,
      and either can extend negative margins. Underwrite the contract, capacity, foundry, and liquidity
      schedules together rather than treating concentration, operations, and financing as separate risks.
    claimRefs: [CR005, CR006, CR009, CR011, CR012, CR013, CR014, CR015]
