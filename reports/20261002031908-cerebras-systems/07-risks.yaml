        independent discussion of the earlier CFIUS-sensitive IPO process.
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence and period
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - "Single-foundry manufacturing interruption"
        - "Current public summary identifies TSMC as the only company able to manufacture Cerebras chips."
        - "Medium"
        - "Severe"
        - "Longstanding process collaboration, but no qualified second source is evidenced."
        - "High"
        - "Foundry allocation, geographic continuity plan, buffer inventory, and second-source feasibility."
      - - "Wafer yield or ramp shortfall"
        - "Independent analysis describes a specialized, defect-tolerant process and warns of bottlenecks if demand outpaces capacity."
        - "Medium"
        - "Severe"
        - "Proprietary redundancy and compiler methods are described, but yield history is undisclosed."
        - "High"
        - "Yield by generation, scrap cost, cycle time, wafer allocation, and ramp acceptance criteria."
      - - "Power, facility, or deployment-capacity delay"
        - "A public summary reports 25 kW power draw and cost of as much as $3 million per node; Cerebras flags data-center capacity as a risk."
        - "Medium"
        - "High"
        - "Capital has been raised and partners announced, but site-by-site readiness is not public."
        - "High"
        - "Power reservations, interconnect dates, permits, commissioning milestones, and customer acceptance tests."
      - - "Product reliability / warranty escalation"
        - "Q1 2026 cash-flow reconciliation includes a $4.590 million product-warranty provision."
        - "Unknown"
        - "High"
        - "A warranty reserve exists, but no shipped-unit, claim-rate, severity, or cohort denominator is disclosed."
        - "Medium to high"
        - "Warranty claims by product generation, field-failure rate, downtime, recall policy, and root-cause closure."
    notes: >-
      Values retain the source period and units; no failure probability, wafer yield, or warranty rate is inferred
      from the reported provision, and qualitative ratings are analyst assessments.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency / counterparty
      - Role and concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
      - Monitor / kill criterion
    rows:
      - - "OpenAI"
        - "750 MW compute commitment valued by Cerebras at more than $20 billion; independent analysis calls it the dominant growth vector."
        - "Cancellation, deployment delay, financing dispute, or alternative capacity reduces utilization and expected growth."
        - "Severe"
        - "Stage capacity, enforce minimum purchases, and diversify contracted demand."
        - "High"
        - "Kill criterion: material cancellation or repeated slippage without replacement contracted demand."
      - - "MBZUAI / G42"
        - "Independent public summary attributes 62% and 24% of 2025 revenue, respectively."
        - "Policy, funding, national-security, or procurement change disrupts revenue or market access."
        - "Severe"
        - "Reduce combined share, ring-fence governance rights, and maintain export-control approvals."
        - "High"
        - "Kill criterion: renewed regulatory restriction or failure to reduce customer concentration."
      - - "AWS"
        - "Distribution and disaggregated inference partner; Cerebras also lists AWS among significant customers."
        - "Launch delay, weak demand, or AWS preference for internal silicon limits channel scale."
        - "High"
        - "Contractual launch milestones and additional direct / cloud channels."
        - "Medium to high"
        - "Monitor production availability, paid usage, gross margin, and renewal economics."
      - - "Capital and data-center providers"
        - "Cerebras reported a Q1 2026 GAAP operating loss; full-year core operating-margin outlook was negative 28% to 32%."
        - "Capacity spending runs ahead of accepted demand, compressing liquidity and requiring incremental financing."
        - "High"
        - "Milestone-gated capex, customer prepayments, committed facilities, and downside liquidity covenants."
        - "High"
        - "Kill criterion: unfunded committed buildout or sustained negative margins without a credible breakeven bridge."
    notes: >-
      Contract value is not recognized revenue or cash; customer percentages use 2025 revenue as the denominator,
      and financial outlook figures are company-issued non-GAAP guidance rather than realized results.
    claimRefs: [CR009, CR010, CR011, CR012, CR013, CR014, CR015]
