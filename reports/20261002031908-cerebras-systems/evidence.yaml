evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-and-founder-table governance
    missingEvidence: >-
      A current board roster, committee assignments, voting-control schedule, succession plan, and complete executive
      reporting lines.
    whyItMatters: >-
      Founder continuity is a strength, but board independence and succession capacity determine whether key-person risk
      is mitigated.
    diligencePath: >-
      Review the latest proxy statement, charter documents, committee charters, employment agreements, and board
      minutes.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map
    missingEvidence: >-
      A fully diluted cap table with preference terms, warrants, voting rights, debt draws, and current beneficial
      ownership.
    whyItMatters: >-
      The sample identifies material parties but cannot establish control, liquidation priority, dilution, or covenant
      exposure.
    diligencePath: >-
      Reconcile the latest proxy and 10-Q ownership tables with financing agreements, warrant schedules, and the credit
      agreement.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: cover metrics
    missingEvidence: >-
      Company-primary current customer count, employee count, operating-location count, and an authoritative cumulative
      private-funding total.
    whyItMatters: Without consistent denominators, scale and operating leverage cannot be compared reliably across periods.
    diligencePath: >-
      Use the latest 10-Q, proxy, investor-relations supplement, and management diligence materials to reconcile each
      metric separately.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: An issuer-primary record resolving whether Cerebras was founded in 2015 or 2016.
    whyItMatters: >-
      The one-year difference is not valuation-critical but should not be silently harmonized in canonical company
      identity.
    diligencePath: Check the certificate of incorporation and issuer prospectus cover or corporate-history section.
    relatedQuestionRefs:
      - QO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A transparent independent model that isolates wafer-scale-addressable training and inference spend by geography,
      workload, deployment model, and year.
    whyItMatters: >-
      Without comparable denominators and methodology, broad AI hardware forecasts cannot support a defensible Cerebras
      SAM or SOM.
    diligencePath: >-
      Obtain underlying analyst models and rebuild a bottom-up workload and capacity model using disclosed price,
      utilization, power, and adoption assumptions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Customer procurement files identifying economic buyers, budget lines, approval thresholds, sales-cycle length, and
      renewal criteria by segment.
    whyItMatters: >-
      Technical demand does not establish that payer budgets, procurement timing, and renewal economics support scalable
      adoption.
    diligencePath: >-
      Review customer contracts and interview infrastructure procurement leaders across frontier labs, hyperscalers,
      national programs, and enterprises.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent workload-level total-cost benchmarks including price, utilization, power, software migration,
      reliability, and support.
    whyItMatters: >-
      Tokens-per-second claims alone cannot determine whether buyers earn an acceptable return after switching and
      infrastructure costs.
    diligencePath: >-
      Commission matched-workload proof-of-concept tests against current GPU and hyperscaler alternatives with fully
      loaded costs.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM001
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable current funding, installed-base, customer-count, revenue, and strategic-direction data for AMD, Intel,
      Groq, SambaNova, Graphcore, and hyperscaler captive accelerators.
    whyItMatters: >-
      Without matched scale data, the profile table cannot establish which alternatives have the capacity and
      balance-sheet support to displace Cerebras.
    diligencePath: >-
      Obtain current filings, official capacity disclosures, and customer procurement records for each named competitor
      using the same period and unit definitions.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing-comparability
    missingEvidence: >-
      Matched realized pricing, service levels, power, utilization, and support costs for Cerebras, GPU clouds, merchant
      accelerators, and hyperscaler captive silicon.
    whyItMatters: >-
      List prices and workload-specific speed claims cannot establish total cost of ownership or buyer savings across
      unlike deployments.
    diligencePath: >-
      Request anonymized bids and invoices for the same model, throughput, latency, term, and availability requirement,
      then normalize costs per delivered token.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Customer migration effort, renewal, multi-homing, reliability, and production-utilization evidence for Cerebras
      deployments.
    whyItMatters: >-
      Distribution partnerships may lower initial adoption friction without proving retention, switching cost, or
      durable production economics.
    diligencePath: >-
      Interview production customers and review workload-level migration plans, incident logs, utilization, renewals,
      and spend allocation across accelerator vendors.
    relatedQuestionRefs:
      - QP005
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing-and-sales-efficiency
    missingEvidence: >-
      Current realized hardware and cloud pricing, discounts, sales cycle, CAC, channel fees, and gross-profit payback
      by go-to-market motion.
    whyItMatters: Segment revenue growth does not show whether new contracts produce efficient, repeatable acquisition economics.
    diligencePath: >-
      Request the current price book, contract cohort export, CRM funnel, commissions, channel agreements, and
      CAC-payback schedule.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      System yield, bill of materials, warranty cost, cloud utilization, energy and hosting cost, support cost, and
      contribution margin by product and customer cohort.
    whyItMatters: The gap between GAAP and core margins prevents a durable unit-return conclusion from public figures alone.
    diligencePath: >-
      Obtain product-level cost ledgers, utilization telemetry, customer-warrant schedules, and cohort
      contribution-margin reconciliations.
    relatedQuestionRefs:
      - QI004
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, committed capex, undrawn facility availability, loan covenants, customer-financing offsets, and
      contract-level deployment obligations.
    whyItMatters: Reported liquidity, restricted cash, debt capacity, and RPO have different availability and funding implications.
    diligencePath: >-
      Review bank statements, debt agreements, covenant calculations, board-approved capex plans, and customer contract
      funding schedules.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI010
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Current security certifications, privacy controls, public status history, support SLAs, incident process, and
      quality-management attestations.
    whyItMatters: >-
      Enterprise and regulated buyers need independently verifiable controls before placing sensitive workloads on
      hosted infrastructure.
    diligencePath: >-
      Request the trust package, audit reports, penetration-test summary, data-processing terms, status history, and
      support policy under NDA.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: benchmark-comparability
    missingEvidence: >-
      Independent matched-workload benchmarks with model, precision, context, batch, latency distribution, power,
      quality, and total-cost denominators.
    whyItMatters: >-
      Token-rate claims alone cannot establish a generalized performance or economic advantage across customer
      workloads.
    diligencePath: Commission reproducible side-by-side tests against named GPU configurations and obtain raw benchmark logs.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: cs4-field-reliability
    missingEvidence: >-
      CS-4 shipment acceptance records, uptime, thermal telemetry, failure rates, service events, and named production
      references.
    whyItMatters: >-
      The announced three-wafer system increases deployment complexity, and public specifications do not prove
      production reliability.
    diligencePath: >-
      Review acceptance tests and operating telemetry from initial customers and reconcile them to warranty and support
      obligations.
    relatedQuestionRefs:
      - QE004
      - QE007
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: manufacturing-quality
    missingEvidence: Current wafer yield, defect-bypass utilization, packaging scrap, unit cost, and supply-allocation data.
    whyItMatters: Manufacturing quality and sole-foundry dependence affect gross margin, delivery capacity, and resilience.
    diligencePath: Request foundry and manufacturing scorecards, yield trends, supply agreements, and approved contingency plans.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention and durability
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rates, contract duration by segment, and customer-cohort expansion for hardware,
      software, and cloud services.
    whyItMatters: >-
      Contract announcements and usage volumes cannot establish whether customers renew, expand, or migrate away after
      initial deployment.
    diligencePath: >-
      Request board reporting and audited cohort schedules by customer segment, then reconcile renewals and expansion to
      invoices and recognized revenue.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
