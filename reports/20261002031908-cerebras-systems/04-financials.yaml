company:
  name: "Cerebras Systems"
chapter:
  number: 4
  title: "Financials"
  summary: "Cerebras entered the second half of 2026 with fast cloud growth and $8.6 billion of reported cash, restricted cash, and short-term investments, but its GAAP and core results diverge sharply. The underwriting case depends on converting $25.4 billion of remaining performance obligations into revenue while funding a capacity buildout whose public disclosures do not reveal realized pricing, utilization, CAC, or contract-level returns."
sections:
  - id: "revenue-mix-and-recognition"
    title: "Revenue Mix and Recognition"
    body: >-
      Cerebras reports two operating revenue categories rather than ARR: hardware and
      cloud and other services. In Q2 2026, GAAP revenue was $180.1 million, comprising
      $54.1 million of hardware and $126.0 million of cloud and other services. Core
      revenue was $209.9 million because the company removes data-center pass-through
      revenue and adds back non-cash customer-warrant amortization; the resulting core
      measure is therefore not interchangeable with GAAP revenue. Cloud was the growth
      engine, but public disclosure does not separate recurring API usage, reserved
      capacity, professional services, or other services within that category. The
      company also reported $25.4 billion of remaining performance obligations. That
      contracted amount is evidence of demand, not recognized revenue, and conversion
      depends on customer deployment choices, build schedules, and the company's ability
      to deliver capacity.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI011"
    tableRefs:
      - "TI001"
  - id: "monetization-and-gtm"
    title: "Monetization and Go-to-Market Evidence"
    body: >-
      The public evidence supports a mixed hardware-and-cloud model but not a complete
      pricing model. Hardware is recognized through system sales, while cloud activity
      reaches customers through Cerebras-operated capacity and large partner or customer
      commitments. The disclosed OpenAI arrangement and the 600 MW capacity program
      indicate an enterprise, negotiated-contract motion rather than a transparent
      self-serve price book. Historical concentration also matters: a secondary source
      reports that MBZUAI and G42 represented 62% and 24% of 2025 revenue, respectively.
      New contracts may diversify that base, but no allocated source quantifies current
      concentration, sales cycles, CAC, commissions, discounts, renewal behavior, or
      channel economics. The fetched Private Shares Fund profile and Seeking Alpha text
      add no usable current financial detail, so they cannot close those gaps.
    claimRefs:
      - "CI008"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI002"
  - id: "margin-and-cash-economics"
    title: "Margin, Cost Structure, and Cash Economics"
    body: >-
      Q2 demonstrates why GAAP and cash measures must remain separate. GAAP gross margin
      fell to 14.2%, versus 40.6% on the company's core basis; the reconciliation removes
      pass-through effects and adds back customer-warrant amortization and stock-based
      compensation. GAAP operating loss was $477.2 million, while core operating loss was
      $33.6 million, with $377.0 million of stock-based compensation in the reconciliation.
      Neither loss measure is cash burn. For the six months ended June 30, operating cash
      outflow was $47.5 million, while purchases of property and equipment were $548.9
      million and total investing cash outflow was $1.31 billion. These figures show that
      infrastructure investment, more than operating cash use alone, is the central
      near-term capital demand. Per-system cost, utilization, and contribution margin
      remain private.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI009"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: >-
      Cerebras reported $8.6 billion of cash, restricted cash, and short-term investments
      at June 30, 2026, alongside $918.2 million of working-capital-loan liabilities and
      $850 million of stated debt capacity. Restricted cash and borrowing capacity are
      not equivalent to freely deployable cash. The historical financing chronology is
      addressed in Company Overview; for forward adequacy, the relevant facts are the
      current liquidity mix, the 600 MW buildout, and management's raised full-year core
      outlook of $880 million to $890 million of revenue with a negative 19% to negative
      17% core operating margin. Sacra separately estimates roughly $3 billion of burn
      across 2026-2027, but that is an external forecast rather than company guidance.
      The financial verdict is therefore conditional: revenue growth and liquidity are
      strong, yet revenue quality, unit returns, customer concentration, and unrestricted
      capital after committed infrastructure spend remain material diligence blockers.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI010"
      - "CI012"
      - "CI013"
      - "CI014"
    figureRefs:
      - "FI001"
