  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Structural Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Cerebras Systems rests on its proprietary Wafer Scale Engine architecture,
              which eliminates interconnect latency bottlenecks by integrating an entire silicon wafer into a single
              processor. With WSE-3 delivering 4 trillion transistors and 900,000 AI-optimized cores, Cerebras provides
              10x to 20x speed advantages in AI inference workloads compared to legacy GPU clusters. This hardware
              differentiation enabled Cerebras to secure a transformative multi-year compute agreement with OpenAI for
              750MW valued at more than $20 billion, expanding remaining performance obligations to $24.6 billion as of
              year-end 2025. Conversely, the structural anti-thesis emphasizes that headline profitability remains
              distorted by non-cash items, while operating losses persisted at $145.9 million in 2025 and $15.0 million
              in Q1 2026. Furthermore, extreme customer concentration across OpenAI, G42, MBZUAI, and AWS creates acute
              counterparty sensitivity, where any regulatory intervention, deployment delay, or commercial renegotiation
              would directly impair revenue run rates.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV013
      - number: '8.2'
        title: Valuation Context, Multiple Realities, and Investment Stance
        blocks:
          - type: paragraph
            body: >-
              Cerebras' private-to-public trajectory represents one of the steepest multiple expansions in semiconductor
              history. The company raised a $1.1 billion Series G in September 2025 at an $8.1 billion post-money
              valuation, followed rapidly by a $1.0 billion Series H in February 2026 led by Tiger Global at a $23.0
              billion post-money valuation. In May 2026, Cerebras priced 30 million Class A common shares at $185 each
              in its Nasdaq IPO, raising $5.55 billion in gross proceeds and opening at $350 per share before
              stabilizing around $242 per share, representing a $53 billion market capitalization. At this valuation
              level, CBRS trades at approximately 222x trailing 2025 earnings, though GAAP net income of $237.8 million
              was driven by a non-recurring $363.3 million non-cash gain from extinguishing forward contract liabilities
              rather than sustained core profitability. Operating margin guidance of negative 28% to 32% for full-year
              2026 highlights ongoing infrastructure buildout costs. Given these valuation dynamics, we maintain a
              Research-More stance with medium confidence, a high risk rating, and a stretched valuation assessment.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario Analysis, Downside Triggers, and Thesis-Break Criteria
        blocks:
          - type: paragraph
            body: >-
              Evaluating Cerebras requires modeling contrasting scenarios across multi-year infrastructure delivery and
              commercial conversion. In our bull case, Cerebras executes smoothly on its 750MW OpenAI deployment, scales
              AWS Bedrock adoption for disaggregated prefill/decode architectures, successfully ramps the CS-4 system
              built on 5nm process technology, and converts its $24.6 billion backlog at healthy core gross margins
              approaching 50%, supporting an implied valuation of $75 billion. In our base case, infrastructure
              deliveries face typical datacenter power and cooling constraints, with full-year 2026 core revenue landing
              near guidance of $855 million to $865 million and 2028 revenue scaling toward $4.5 billion, supporting a
              fair equity value of $42 billion to $48 billion. In our bear case, customer concentration backfires
              through delayed OpenAI cluster rollouts, G42 regulatory headwinds resurface under CFIUS oversight, and
              capital expenditure burn consumes available cash, compressing multiples toward $22 billion. Crucial
              diligence priorities include auditing WSE-3 wafer yield economics with TSMC, tracking non-G42/non-OpenAI
              customer diversification, and monitoring cash burn against the $3.3 billion cash reserve.
            claimRefs:
              - CV003
              - CV005
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Accounting Distortion in Headline GAAP Profitability
            body: >-
              Investors anchoring on Cerebras' 2025 GAAP net income of $237.8 million face severe optical distortion.
              This reported profit was almost entirely generated by a non-recurring, non-cash gain of $363.3 million
              resulting from the extinguishment of a forward contract liability related to G42's initial investment.
              Stripping away this accounting event, Cerebras generated a GAAP operating loss of $145.9 million and a
              non-GAAP net loss of $75.7 million in 2025. Evaluating CBRS on a standard trailing P/E basis (222x) relies
              on non-repeatable financial engineering rather than operating cash flow.
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
          - type: callout
            title: The Strategic Importance of the OpenAI 750MW Agreement
            body: >-
              Cerebras' agreement with OpenAI represents a transformative commercial endorsement, committing 750
              megawatts of high-speed wafer-scale inference compute valued at over $20 billion through 2028. Beyond
              commercial revenue, OpenAI provided a $1 billion working capital advance in early 2026 and holds warrants
              for up to 33.4 million shares tied to compute deployment milestones. While this solidifies Cerebras as a
              premier AI inference provider alongside AWS, it cements extreme counterparty dependence on OpenAI's
              infrastructure roadmap.
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV006
