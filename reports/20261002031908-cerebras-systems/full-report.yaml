      - number: '7.2'
        title: Regulatory, legal, IP, and security posture
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse regulatory precedent in the assigned evidence is the reported CFIUS scrutiny
              surrounding the earlier G42-linked IPO process. That event is historical, but it demonstrates that
              customer identity, governance rights, export controls, and national-security review can affect financing
              and market access. The 2026 underwriting agreement contains company representations that required legal
              proceedings were disclosed, that no security breach or notice had occurred, and that no material written
              IP challenge was pending or threatened. Those are useful disclosure controls, not independent proof that
              incidents, claims, or vulnerabilities are absent. Residual exposure remains material until counsel,
              security auditors, and management provide current jurisdiction-by-jurisdiction records, incident logs,
              export-control analyses, and an IP ownership/retention map.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
