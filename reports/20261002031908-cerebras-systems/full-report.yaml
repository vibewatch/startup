        title: Milestones, Partnerships, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The 2026 expansion rests on a company-announced multi-year OpenAI agreement for 750 megawatts of compute
              valued at more than $20 billion, alongside an AWS distribution partnership described in the Q1 release.
              The same filing warns that Cerebras depends on a limited number of significant customers, including
