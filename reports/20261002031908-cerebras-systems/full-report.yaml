  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Cerebras competes in AI compute infrastructure rather than in the whole semiconductor or software market.
              The included spend is dedicated accelerator hardware, integrated supercomputing systems, and
              cloud-delivered training or inference capacity for large AI workloads. General-purpose CPUs, end-user
              devices, model-development software, data labeling, and ordinary cloud storage sit outside this boundary.
              The company sells both on-premises systems and cloud access, so the relevant buyer choice spans capital
              purchases, reserved infrastructure capacity, and usage-based services rather than a single chip budget.
              Status-quo substitutes include GPU clusters, hyperscaler-owned accelerators, and conventional cloud AI
              services. Cerebras is therefore not entitled to the whole AI hardware forecast: its practical opportunity
              is the subset of workloads for which latency, model scale, or programming simplicity offsets ecosystem
              familiarity, switching cost, power, and facility requirements. That boundary also separates a technically
              addressable workload from spend Cerebras can realistically capture.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM013
              - CM014
      - number: '2.2'
        title: Sizing Lenses and Demand Evidence
        blocks:
          - type: paragraph
            body: >-
              Two third-party forecasts provide broad upper bounds, not a reconciled market model. KoalaGains projects
              the AI accelerator market at more than $200 billion by 2030 with growth above 30% CAGR, while Sacra
              projects the broader AI hardware market at nearly $250 billion by 2030. The category definitions, base
              years, geographies, and calculation methods are not disclosed in the fetched text, so the endpoints should
              not be averaged or relabeled as Cerebras TAM. Company-scale evidence is more concrete but answers a
              different question: Cerebras reported $193.4 million of Q1 2026 GAAP revenue, split between $110.6 million
              of hardware and $82.8 million of cloud and other services, and disclosed an OpenAI agreement for 750 MW
              valued above $20 billion. These figures demonstrate demand and route-to-market expansion, but a customer
              contract is not market size and recognized revenue is not SAM. No retained source isolates the spend pool
              addressable by wafer-scale systems or provides adoption probabilities needed for a defensible SOM.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The evidence supports several buyer groups but does not disclose most internal budget owners. Frontier
              model developers and hyperscalers buy or distribute dedicated inference capacity; national laboratories,
              research institutions, and sovereign programs purchase integrated systems for large scientific or
              national-scale workloads; enterprises and application developers can access the architecture through cloud
              services without owning hardware. The likely economic buyer is therefore an infrastructure, research, or
              technology executive, while day-to-day users are model engineers, researchers, and application teams. The
              route to adoption differs by segment: a laboratory can procure an appliance, a frontier lab can reserve
              multi-year capacity, a hyperscaler can integrate Cerebras into a broader service, and an enterprise can
              begin with cloud trials. Exact signatories, approval thresholds, sales-cycle length, and budget-line
              ownership remain private. Those omissions matter because technical users may value speed while finance and
              facilities teams evaluate total cost, power, utilization, and vendor risk.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
              - CM014
      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The central demand thesis is that interactive and agentic applications increase the value of tokens
              delivered with low latency. An investor letter carried by Yahoo Finance describes fast inference as a
              rapidly growing compute subsegment, and Cerebras's OpenAI and AWS arrangements provide customer and
              distribution signals consistent with that thesis. The counterweight is a demanding adoption equation. GPU
              software ecosystems and hyperscaler breadth remain the default; on-premises systems carry
              multi-million-dollar pricing and specialized power requirements; cloud expansion requires data-center
              capacity and capital; and customer concentration can turn a large commitment into counterparty and
              execution exposure. Wikipedia reports that MBZUAI and G42 represented 62% and 24% of 2025 revenue,
              respectively, while KoalaGains independently describes more than 85% concentration in two customers. For
              valuation, the broad market forecasts justify a growth-market framing but not a precise share assumption.
              Underwriting should instead test contract conversion, diversified utilization, switching economics, and
              gross profit after infrastructure costs.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand evidence is stronger than share evidence
            body: >-
              The OpenAI capacity commitment, AWS distribution arrangement, and rapid cloud-and-services growth
              demonstrate commercial pull. None of the retained sources establishes what proportion of broad AI hardware
              spend is technically suitable, economically attractive, or competitively obtainable by Cerebras.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM016
          - type: callout
            title: Concentration can mimic market breadth
            body: >-
              Large contracts can create revenue visibility without demonstrating diversified adoption. The 2025
              concentration reported for MBZUAI and G42 makes customer-level utilization, renewal economics, and margin
              conversion more decision-useful than applying a top-down market share assumption.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer can choose an incumbent platform, a specialist accelerator, or no new vendor
        blocks:
          - type: paragraph
            body: >-
              Cerebras does not face one clean peer set. Hardware buyers can remain with Nvidia, evaluate AMD or Intel,
              test specialist architectures from Groq, SambaNova, or Graphcore, or procure captive silicon through AWS,
              Google, and Microsoft. Cloud buyers can also buy managed compute from AWS, Azure, Google Cloud, Oracle, or
              CoreWeave instead of owning an accelerator system. Internal GPU clusters and continued use of existing
              cloud capacity remain status-quo substitutes. Sacra estimates Nvidia holds approximately 85% of the AI
              accelerator market, so Cerebras is challenging an installed platform rather than entering an open field.
              Public evidence in the assigned pool does not provide comparable funding, installed-base, or contract data
              for every named competitor; those cells remain explicitly unknown.
            claimRefs:
              - CP001
              - CP002
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP015
      - number: '3.2'
        title: Wafer scale removes interconnect work, but architectural uniqueness is narrowing
        blocks:
          - type: paragraph
            body: >-
              Cerebras concentrates compute and memory on a wafer-scale processor, reducing the chip-to-chip
              communication and distributed-software burden found in clustered GPU systems. Independent and
              user-generated sources consistently describe this as the core differentiation, while Cerebras-oriented
              commentary reports strong inference performance on selected models. The counterpoint is important: a
              former Cerebras technical staffer wrote that several original design properties are no longer unique and
              that chiplets trade some runtime communication cost for better yield and incremental upgrades. Nvidia's
              CUDA software support also makes the competitive comparison broader than raw throughput. The evidence
              therefore supports a workload-specific advantage, not a universal platform lead.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP010
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP010
              - CP013
              - CP016
      - number: '3.3'
        title: Cerebras is using both systems and cloud distribution to lower adoption friction
        blocks:
          - type: paragraph
            body: >-
              Publicly reported Cerebras packaging spans expensive systems and metered inference. One independent report
              places a CS-3 at roughly $2 million to $3 million list price and quotes Llama 3.1 405B inference at $6 per
              million input tokens and $12 per million output tokens; realized enterprise terms are not disclosed.
              Wikipedia separately describes nodes costing as much as $3 million and drawing 25kW. AWS distribution can
              reduce procurement and integration friction: Cerebras announced a disaggregated design in which Trainium 3
              performs prefill and CS-3 performs decode. That heterogeneous model may enable multi-homing rather than
              requiring a full replacement, but the pool contains no customer-level migration, retention, or switching
              cost evidence.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Capacity, ecosystem control, and buyer concentration can erode benchmark-led differentiation
        blocks:
          - type: paragraph
            body: >-
              Distribution is improving, yet execution risk remains central. Simply Wall St reported a planned European
              footprint and a Flex-supported target to increase CS-3 production capacity sevenfold, while Cerebras
              disclosed an OpenAI agreement for 750 megawatts valued above $20 billion. Those commitments may validate
              demand but also increase delivery and counterparty leverage. A September 2026 Seeking Alpha author argued
              that WSE-3's memory bandwidth is offset by limited capacity and rapid Nvidia advances. Cerebras itself
              warns that dependence on a small number of significant customers, data-center capacity, and effective
              competition are material uncertainties. The moat is therefore conditional: it lasts only if performance
              converts into reliable capacity, competitive economics, and a broader software and customer base before
              incumbents narrow the gap.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Benchmark leadership is not the same as platform power
            body: >-
              The decisive diligence test is whether Cerebras can sustain a workload-level speed advantage while
              matching incumbent availability, software support, and commercial leverage. Current evidence does not
              establish that outcome.
            calloutType: risk
            claimRefs:
              - CP003
              - CP013
              - CP014
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Mix and Recognition
        blocks:
          - type: paragraph
            body: >-
              Cerebras reports two operating revenue categories rather than ARR: hardware and cloud and other services.
              In Q2 2026, GAAP revenue was $180.1 million, comprising $54.1 million of hardware and $126.0 million of
              cloud and other services. Core revenue was $209.9 million because the company removes data-center
              pass-through revenue and adds back non-cash customer-warrant amortization; the resulting core measure is
              therefore not interchangeable with GAAP revenue. Cloud was the growth engine, but public disclosure does
              not separate recurring API usage, reserved capacity, professional services, or other services within that
              category. The company also reported $25.4 billion of remaining performance obligations. That contracted
              amount is evidence of demand, not recognized revenue, and conversion depends on customer deployment
              choices, build schedules, and the company's ability to deliver capacity.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
      - number: '4.2'
        title: Monetization and Go-to-Market Evidence
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a mixed hardware-and-cloud model but not a complete pricing model. Hardware
              is recognized through system sales, while cloud activity reaches customers through Cerebras-operated
              capacity and large partner or customer commitments. The disclosed OpenAI arrangement and the 600 MW
              capacity program indicate an enterprise, negotiated-contract motion rather than a transparent self-serve
              price book. Historical concentration also matters: a secondary source reports that MBZUAI and G42
              represented 62% and 24% of 2025 revenue, respectively. New contracts may diversify that base, but no
              allocated source quantifies current concentration, sales cycles, CAC, commissions, discounts, renewal
              behavior, or channel economics. The fetched Private Shares Fund profile and Seeking Alpha text add no
              usable current financial detail, so they cannot close those gaps.
            claimRefs:
              - CI008
              - CI015
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI008
      - number: '4.3'
        title: Margin, Cost Structure, and Cash Economics
        blocks:
          - type: paragraph
            body: >-
              Q2 demonstrates why GAAP and cash measures must remain separate. GAAP gross margin fell to 14.2%, versus
              40.6% on the company's core basis; the reconciliation removes pass-through effects and adds back
              customer-warrant amortization and stock-based compensation. GAAP operating loss was $477.2 million, while
              core operating loss was $33.6 million, with $377.0 million of stock-based compensation in the
              reconciliation. Neither loss measure is cash burn. For the six months ended June 30, operating cash
              outflow was $47.5 million, while purchases of property and equipment were $548.9 million and total
              investing cash outflow was $1.31 billion. These figures show that infrastructure investment, more than
              operating cash use alone, is the central near-term capital demand. Per-system cost, utilization, and
              contribution margin remain private.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Cerebras reported $8.6 billion of cash, restricted cash, and short-term investments at June 30, 2026,
              alongside $918.2 million of working-capital-loan liabilities and $850 million of stated debt capacity.
              Restricted cash and borrowing capacity are not equivalent to freely deployable cash. The historical
              financing chronology is addressed in Company Overview; for forward adequacy, the relevant facts are the
              current liquidity mix, the 600 MW buildout, and management's raised full-year core outlook of $880 million
              to $890 million of revenue with a negative 19% to negative 17% core operating margin. Sacra separately
              estimates roughly $3 billion of burn across 2026-2027, but that is an external forecast rather than
              company guidance. The financial verdict is therefore conditional: revenue growth and liquidity are strong,
              yet revenue quality, unit returns, customer concentration, and unrestricted capital after committed
              infrastructure spend remain material diligence blockers.
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
              - CI008
              - CI011
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Backlog is not liquidity
            body: >-
              The $25.4 billion RPO balance signals contracted demand, but it does not establish timing, margin,
              collectability, or the capital required to deliver more than 600 MW of capacity.
            calloutType: risk
            claimRefs:
              - CI008
              - CI011
          - type: callout
            title: Use cash flow, not net loss, for burn
            body: >-
              Q2 GAAP operating loss included major non-cash stock compensation; H1 operating cash outflow was $47.5
              million, while $548.9 million of capex better exposes the infrastructure funding burden.
            calloutType: insight
            claimRefs:
              - CI004
