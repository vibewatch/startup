  - id: TV002
    title: Core Investment Thesis Versus Structural Anti-Thesis
    columns:
      - Pillar
      - Bull Thesis Argument
      - Bear Anti-Thesis Argument
      - Thesis-Break Indicator
    rows:
      - - Architecture & Speed
        - >-
          Wafer Scale Engine delivers 10x-20x inference speed advantage over standard GPUs, capturing agentic AI
          workloads.
        - Giant 25kW power draw and $3M per-node cost limit addressable market to specialized hyperscale clusters.
        - Adoption of competitive multi-die GPU packaging eliminating wafer-scale latency premium.
      - - Commercial Backlog
        - Contracted $24.6B backlog provides nearly 50x forward coverage over 2025 revenue base ($510M).
        - Revenue concentration in top 4 accounts (OpenAI, AWS, G42, MBZUAI) exceeds 90% of forward pipeline.
        - Cancellation or material volume reduction in OpenAI 750MW deployment agreement.
      - - Earnings Quality
        - Core gross margins of 47% in Q1 2026 demonstrate expanding software and cloud services margin contribution.
        - >-
          Reported 2025 net income was inflated by a $363.3M non-cash liability extinguishment; core operations lost
          $145.9M.
        - Core gross margins falling below 35% during CS-4 datacenter scaling phase.
      - - Capital & Balance Sheet
        - Robust $3.3B cash and short-term investments post-IPO provides multi-year runway for datacenter deployment.
        - Company projected to burn approximately $3B across 2026-2027 to build out 750MW infrastructure.
        - Cash balance declining below $1.0B prior to achieving positive quarterly free cash flow.
    notes: Core financial metrics exclude non-cash warrant amortization, stock-based compensation, and pass-through costs.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV013
