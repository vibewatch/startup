      - number: '1.3'
        title: Capitalization, Liquidity, and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              Cerebras entered the public market after two large private financings. Sources report a $1.1 billion
              Series G at an $8.1 billion post-money valuation in September or October 2025, followed by a $1.0 billion
              Series H at a $23 billion post-money valuation in January or February 2026. The month differences are
              retained rather than harmonized. Cerebras then reported $6.4 billion of gross IPO proceeds in Q2 2026 and
              an April revolving credit facility of up to $850 million. These amounts are not a single "total raised":
              equity proceeds, debt capacity, and cash available are different measures. At March 31, 2026, the company
              reported $3.3 billion of cash, cash equivalents, restricted cash, and short-term investments. Q1 GAAP
              revenue was $193.406 million, up 94% year over year, while Trefis showed a $25.5 billion market
              capitalization at a $168.86 share price on October 1, 2026.
