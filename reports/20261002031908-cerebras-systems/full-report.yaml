chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Cerebras Systems Inc. is a Nasdaq-listed AI-infrastructure company headquartered in Sunnyvale, California.
              Its commercial model combines on-premises wafer-scale supercomputers with cloud inference and training
              services, so the company participates in both equipment sales and usage-based compute. The current product
              line includes systems based on its Wafer-Scale Engine architecture; third-party histories record the CS-4
              introduction in August 2026. The founding year is not fully reconciled: Wikipedia and The CODEW report
              2015, while Sacra and note.com report 2016. The five named founders are Andrew Feldman, Gary Lauterbach,
              Michael James, Sean Lie, and Jean-Philippe Fricker. The discrepancy is immaterial to product identity but
              should be resolved against the issuer's charter or prospectus before treating either year as definitive.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
