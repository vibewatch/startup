      - number: '7.3'
        title: Operational, quality, and capital-execution risk
        blocks:
          - type: paragraph
            body: >-
              Wafer-scale differentiation creates a coupled operational risk: the architecture depends on a specialized
              manufacturing process, high-power systems, and adequate data-center capacity. Independent sources flag
              supply bottlenecks and technological obsolescence, while the public company filing records a $4.590
              million product-warranty provision for the three months ended March 31, 2026. That accounting provision is
              not a failure-rate measure because the assigned evidence does not disclose units shipped, claims
              frequency, severity, or yield. Financial execution also remains exposed: Cerebras reported a Q1 GAAP
              operating loss and projected deeply negative core operating margins for Q2 and full-year 2026 while an
              analyst estimates substantial 2026-2027 cash consumption. Liquidity raised is not equivalent to cash
              available for every commitment, so deployment milestones and restricted uses require reconciliation.
            claimRefs:
              - CR005
              - CR006
              - CR007
