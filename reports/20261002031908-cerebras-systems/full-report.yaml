  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Cerebras packages the same core computing approach into several delivery forms rather than a single
              appliance. SEC-filed company material and an independent company profile describe both on-premises systems
              and cloud APIs, allowing a buyer either to deploy hardware or consume hosted inference and training
              capacity. CS-3 is the installed system referenced in the AWS architecture, while Sacra and Venture Atlas
              describe CS-4 as an announced rack built from three WSE-3 Turbo processors. Sacra also identifies CSoft
              and associated services as parts of the offer. The practical diligence distinction is maturity: CS-3 and
              cloud services have stated operating use, whereas the assigned evidence records CS-4 shipment guidance
              rather than independently verified production acceptance.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE013
      - number: '5.2'
        title: Architecture and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              The architectural thesis is to reduce cross-chip movement by using an entire wafer as the processor.
              Wikipedia's synthesis describes WSE-3 as a 215 mm-square wafer-scale semiconductor using switched fabric
              and SRAM; it attributes lower latency and fewer interconnect bottlenecks to that layout. The same source
              reports material trade-offs, including a 25 kW power draw and a price as high as $3 million per node, so
              the integration advantage cannot be separated from facility and capital requirements. Cerebras engineering
              job material further indicates that product execution spans RTL, synthesis, design-for-test, silicon
              bring-up, third-party IP, networking, storage, and physical deployment. The resulting stack is vertically
              integrated, but public evidence does not expose wafer yield, defect rates, or field failure data.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE015
      - number: '5.3'
        title: Deployment, Integration, Reliability, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              The clearest integration design in the retained evidence is the AWS partnership announced in Cerebras's
              SEC-filed Q1 2026 release: Trainium 3 performs prompt prefill and CS-3 performs decode. This separates
              stages with different compute characteristics, but it also creates a cross-vendor orchestration and
              deployment dependency that is not resolved by chip specifications alone. A Cerebras-authored
              infrastructure job listing describes rack layouts, bills of materials, power allocations, cable maps,
              deployment-readiness reviews, validation checks, and root-cause analysis, which is evidence of intended
              operating discipline rather than proof of achieved reliability. CS-4 adds roadmap upside, but independent
              acceptance tests, service-level history, and named shipment verification were not available in this pool.
            claimRefs:
              - CE002
              - CE003
              - CE008
              - CE009
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
