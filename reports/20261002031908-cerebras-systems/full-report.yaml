  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buying Motions
        blocks:
          - type: paragraph
            body: >-
              Cerebras reaches buyers through several distinct motions rather than one homogeneous customer funnel. Its
              historical base includes national laboratories, sovereign AI organizations, and life-sciences or
              industrial enterprises using on-premises systems for large scientific and model workloads. The newer
              inference motion addresses frontier-model developers and hyperscalers: OpenAI has a large direct capacity
              agreement, while AWS is intended to distribute Cerebras-backed inference to startups and enterprises. A
              third surface consists of enterprise and developer integrations such as Notion and Cline. Contract form
              differs by surface: the allocated evidence describes outright system purchases with renewable software
              subscriptions, reserved cloud capacity under take-or-pay terms, and on-demand usage. Those channels
              identify buyer and user groups, but they do not establish how many active paying customers Cerebras has in
              each segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
