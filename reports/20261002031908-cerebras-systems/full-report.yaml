              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: Partner dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Mitigation maturity is mixed. AWS distribution broadens the route to market, and IPO proceeds improve
              financing capacity, but neither removes OpenAI deployment concentration, Gulf-linked historical
              concentration, TSMC dependence, or the need to fund capacity before demand is converted into recognized
              revenue and cash. The diligence standard should therefore be contractual and measurable: obtain revenue
              concentration by customer, termination and minimum-purchase terms, capacity acceptance schedules, foundry
              allocation and yield history, warranty cohorts, security audit results, and downside liquidity forecasts.
              Thesis-break triggers are cancellation or material deferral of the OpenAI rollout, failure to reduce
              single-customer revenue dependence, repeated misses against capacity milestones, persistent negative
              operating margins without a funded path to breakeven, or an export-control, cybersecurity, IP, or quality
              event that restricts deployment.
            claimRefs:
