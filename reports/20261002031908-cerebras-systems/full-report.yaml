      - number: '6.2'
        title: Adoption Signals and Named-Customer Proof
        blocks:
          - type: paragraph
            body: >-
              The clearest current adoption signals are contracted capacity, services revenue, announced trials, and
              specific integrations rather than a disclosed customer count. Cerebras reported $82.8 million of GAAP
              cloud and other services revenue for the quarter ended March 31, 2026, up 178% year over year. OpenAI
              agreed to deploy 750 megawatts of high-speed inference compute under a multi-year deal valued above $20
              billion, and Cerebras announced a multi-year AWS partnership. The status labels matter: Kimi K2.6 and
              Gemma 4 were described as enterprise customer trials, while the AWS announcement describes a distribution
              and deployment plan rather than evidence of realized end-customer usage. Sacra separately reports deployed
              enterprise surfaces at Notion and Cline, but the allocated pool contains no primary customer documents for
              those outcomes.
