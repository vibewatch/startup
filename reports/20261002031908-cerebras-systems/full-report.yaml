      - number: '5.4'
        title: Performance, Software Adoption, and Trust Controls
        blocks:
          - type: paragraph
            body: >-
              Cerebras reports more than 1,000 tokens per second for Codex-Spark and says Kimi K2.6 approached 1,000
              tokens per second in an Artificial Analysis measurement, while Gemma 4 31B ran an order of magnitude
              faster based on that index. These are named results, but the company's own website cautions that
              performance comparisons may rely on third-party benchmarking or internal testing and vary by workload,
              configuration, date, and model. Sacra separately identifies developer dependence on Nvidia's mature CUDA
              ecosystem as a software-adoption risk for Cerebras's bespoke stack. The assigned pool does not establish
              security certifications, privacy controls, a public status history, support SLAs, or formal quality
              attestations; that is a diligence gap, not evidence that such controls are absent.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distinct hardware-to-cloud delivery model
            body: >-
              Cerebras can place wafer-scale compute behind both on-premises systems and hosted services, while the
              announced AWS design assigns prefill and decode to different accelerator families.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Benchmark and production proof remain narrower than the claims
            body: >-
              Named speed results are qualified by workload and configuration, while CS-4 shipment acceptance, field
              reliability, security attestations, and public support history remain open diligence items.
            calloutType: risk
            claimRefs:
              - CE003
              - CE014
