      - number: '6.3'
        title: Durability, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Counterparty concentration remains the central customer-quality risk. BBAE and Wikipedia report that
              MBZUAI and G42 represented approximately 62% and 24% of 2025 revenue, respectively, or 86% in aggregate.
              The 2026 OpenAI and AWS relationships broaden the named-customer set, but Cerebras itself still lists
              OpenAI, G42, MBZUAI, and AWS among the significant customers on which it depends. This is not the same as
              demonstrated diversification: the allocated sources do not disclose recognized revenue by those newer
              relationships, deployment milestones, cancellation protections, or the share of capacity already utilized.
              Simply Wall St further frames under-filled capacity or changed OpenAI and AWS deployment choices as risks
              to utilization and margins. Renewable subscriptions and take-or-pay cloud terms can improve contractual
              durability, but no public NRR, GRR, churn, renewal, or cohort data in the assigned pool tests realized
              retention.
            claimRefs:
              - CU007
              - CU008
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: What the Evidence Does and Does Not Prove
        blocks:
          - type: paragraph
            body: >-
              The named relationships provide credible evidence that Cerebras can sell to sophisticated AI laboratories,
              cloud platforms, sovereign institutions, national laboratories, and enterprises. They do not yet prove a
              broad, durable revenue base. User-base figures attached to Notion or Cline describe the distribution
              surface of those products, not the number of paying Cerebras customers or the amount of
              Cerebras-attributable usage. Likewise, agreement value and megawatts are commitments, not recognized
              revenue, customer retention, or capacity utilization. Investment diligence should therefore reconcile
              contract schedules to recognized revenue, request segment-level active account and renewal cohorts,
              separate pilots from production traffic, and quantify top-one and top-five customer exposure after the
              OpenAI and AWS ramps.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
              - CU011
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diversification Is Not Yet Demonstrated
            body: >-
              OpenAI and AWS expand the roster of strategic counterparties, but Cerebras still identifies a limited set
              of significant customers and the allocated evidence does not show post-ramp revenue shares. The prior 86%
              concentration in MBZUAI and G42 can therefore be described as historical evidence of concentration, not as
              a risk already resolved by newer contract announcements.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU013
          - type: callout
            title: Customer Proof Has Uneven Strength
            body: >-
              Contracted megawatts and reported revenue are stronger commercial evidence than trials, logos, user-base
              reach, or marketplace availability. Diligence should preserve those distinctions and request production
              traffic, recognized revenue, renewal, and cohort data before treating the visible customer roster as
              durable recurring adoption.
            calloutType: insight
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU010
              - CU011
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implication
        blocks:
          - type: paragraph
            body: >-
              The risk profile is dominated by correlated dependencies rather than a single isolated failure mode.
              Cerebras itself identifies a limited set of significant customers, including OpenAI, G42, MBZUAI, and AWS,
              while an independent summary attributes 62% and 24% of 2025 revenue to MBZUAI and G42, respectively. The
              announced OpenAI commitment adds scale but does not by itself diversify counterparty exposure: it shifts
              more execution risk toward one large deployment, its financing arrangements, and the infrastructure
              required to serve it. Manufacturing risk is also concentrated because the available evidence describes
              TSMC as the only capable manufacturer and the process as unusually specialized. The heatmap therefore
              ranks customer, deployment-capital, and foundry/yield risks as the most consequential residual exposures.
              Ratings are analyst judgments based on the cited public evidence, not measured probabilities.
            claimRefs:
