      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Correlated execution risk is the central diligence issue
            body: >-
              A customer delay can strand data-center investment, a manufacturing shortfall can impair delivery, and
              either can extend negative margins. Underwrite the contract, capacity, foundry, and liquidity schedules
              together rather than treating concentration, operations, and financing as separate risks.
            calloutType: risk
