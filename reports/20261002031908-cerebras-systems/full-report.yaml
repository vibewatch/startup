      - number: '1.2'
        title: Leadership, Founder Fit, and Governance Gaps
        blocks:
          - type: paragraph
            body: >-
              Andrew Feldman remains the chief executive, with Robert Komin as chief financial officer, Sean Lie as
              chief technology officer, and Dhiraj Mallick as chief operating officer in the current third-party roster.
              Founder-market fit is unusually direct: the founding group had worked together at SeaMicro, whose
              microserver architecture addressed data-movement and efficiency constraints before AMD acquired the
              company for $334 million in 2012. That continuity supports execution in hardware-software co-design, but
              it also concentrates institutional knowledge and strategic relationships in a small group. The assigned
              evidence does not establish a complete current board roster, committee composition, succession plan, or
              founder voting control. Leadership continuity is therefore supportable; governance depth and independence
              are not.
            claimRefs:
              - CO004
              - CO005
