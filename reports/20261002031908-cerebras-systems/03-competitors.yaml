      - Cerebras
      - Nvidia / merchant GPUs
      - Specialist accelerators
      - Hyperscaler captive silicon
      - Status quo / internal build
    rows:
      - ["Architecture", "Single wafer-scale processor", "Clusters of discrete accelerators", "Alternative ASIC, streaming, or chiplet designs; exact architectures vary", "Cloud-designed accelerators", "Existing heterogeneous fleet"]
      - ["Communication model", "Reduces off-chip communication", "Requires networking and distributed execution across chips", "Unknown on a comparable basis", "Unknown across providers", "Depends on installed topology"]
      - ["Software ecosystem", "Bespoke stack; cloud APIs can abstract some complexity", "CUDA has widespread support", "Unsupported in assigned evidence", "Integrated into each cloud platform", "Highest continuity with existing tools"]
      - ["Workload fit", "Evidence favors large, communication-bound and latency-sensitive models", "Broad training and inference coverage", "Specialized workload fit", "Provider-selected workloads", "Known workloads without migration"]
      - ["Deployment path", "System purchase, Cerebras cloud, or AWS-linked disaggregation", "On premises and broad cloud availability", "Vendor or partner-specific", "Native cloud service", "No new vendor required"]
      - ["Evidence quality", "Reported metrics are workload-specific and often vendor-originated", "Market-share and ecosystem evidence, but no matched benchmark in pool", "No matched benchmark in pool", "No matched benchmark in pool", "Customer-specific and private"]
    notes: >-
      This is a qualitative capability matrix, not an independent benchmark. Unknown or unsupported
      comparisons are stated explicitly, and vendor performance claims are not treated as verified.
