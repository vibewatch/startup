  - id: TP003
    title: Public pricing and packaging comparison
    columns:
      - Option
      - Public price or contract model
      - Included capability
      - Discount or unknown
      - Buyer implication
    rows:
      - ["Cerebras CS-3 system", "Approximately $2M-$3M per system at list", "Owned or colocated wafer-scale system", "Realized price, support, and volume discounts unavailable", "High initial commitment; dedicated capacity"]
      - ["Cerebras Inference", "$6 per million input tokens and $12 per million output tokens for Llama 3.1 405B", "Hosted API inference for the named model", "Other model tiers and negotiated terms unavailable", "Usage pricing lowers initial hardware commitment"]
      - ["Cerebras via AWS disaggregation", "Price unavailable", "Trainium 3 prefill with CS-3 decode", "Launch economics and customer terms unavailable", "Potentially lowers integration friction and supports heterogeneous deployment"]
      - ["Merchant GPU cloud or systems", "Comparable price unavailable in assigned evidence", "Broad training and inference ecosystem", "No matched unit, model, service level, or contract term", "Cannot infer cost advantage from speed claims alone"]
      - ["Hyperscaler captive silicon or internal build", "Customer- and provider-specific; unavailable", "Integrated cloud service or internally operated stack", "Utilization, engineering, power, and migration costs unknown", "Status quo may win when switching costs exceed workload gains"]
    notes: >-
      Cerebras prices are third-party reported public figures, not realized contract economics.
      Competitor prices are left unknown because the assigned evidence lacks matched units and terms.
    claimRefs: [CP006, CP007, CP008, CP009, CP010]
figures:
  - id: FP001
    title: "Competitive positioning: architectural specialization versus ecosystem control"
    type: quadrant
    summary: >-
      Cerebras scores high on architectural specialization but below incumbent and hyperscaler
      platforms on ecosystem control; values are evidence-backed ordinal judgments, not benchmarks.
    data:
      points:
        - label: Cerebras
          x: 5
          y: 2
          detail: "Wafer-scale specialization; smaller software and capacity footprint than incumbent platforms."
        - label: Nvidia
          x: 2
          y: 5
          detail: "Broad GPU platform with estimated market leadership and widespread CUDA support."
        - label: "AMD / Intel"
          x: 2
          y: 3
          detail: "Merchant accelerator alternatives with broader conventional-chip compatibility."
        - label: "Groq / SambaNova / Graphcore"
          x: 4
          y: 2
          detail: "Specialist architectures; comparable scale and economics are not available in the pool."
        - label: "Hyperscaler captive silicon"
          x: 3
          y: 5
          detail: "Provider-owned accelerators benefit from cloud distribution and integrated procurement."
        - label: "Internal build / status quo"
          x: 1
          y: 3
          detail: "Low architectural novelty but high continuity with existing tools, contracts, and staff."
    approximationNotes: >-
      Ordinal 1-5 analyst synthesis as of 2026-10-02. X represents architectural specialization
      and Y represents ecosystem/distribution control; scores are directional, not measured shares
      or performance ratios, and unsupported competitor economics remain unknown.
    claimRefs: [CP002, CP003, CP005, CP010, CP013, CP016]
