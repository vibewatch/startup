  - number: 7
    title: 核心风险
    sections:
      - number: '7.1'
        title: 风险优先级排序与投资考量
        blocks:
          - type: paragraph
            body: >-
              整体风险特征主要表现为环环相扣的链式依赖，而非孤立单一的单点失效。Cerebras 自身已承认对少数关键客户的依赖，包括 OpenAI、G42、MBZUAI 与 AWS；第三方汇总亦指出 MBZUAI 与 G42
              分别占据 2025 年营收的 62% 和 24%。新公布的 OpenAI
              订单虽拉升了业务体量，却并未从本质上分散交易对手风险：它反而将更多交付风险捆绑于单一超大规模部署、配套融资架构以及保障供应所需的基础设施。代工制造风险同样高度集中，既有公开资料表明 TSMC
              是业内唯一具备生产能力的晶圆代工厂，且生产工艺极度特殊。风险热力图因而将客户集中度、交付资本开支以及晶圆代工/良率列为最具破坏力的潜在敞口。各项评级均属分析师基于公开证据做出的主观研判，非精确概率测算。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
