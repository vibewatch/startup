              列为公司赖以维系的重要客户。这并不能直接等同于客群已实现多元化：所涉信源均未披露新客户贡献的已确认收入、交付里程碑、单方面解约保护条款或现存算力的实际开动率。Simply Wall St 进一步警示，机位闲置或
