      - number: '2.2'
        title: 测算视角与需求证据
        blocks:
          - type: paragraph
            body: >-
              两份第三方预测仅提供了大致的上限参考，而非经调和统一的市场模型。KoalaGains 预计到 2030 年 AI 加速器市场将超过 $200 billion，复合年增长率逾 30%；Sacra 则预测到 2030
              年更宽泛的 AI 硬件市场将接近 $250 billion。抓取的文本中未披露品类定义、基准年、地域划分及测算方法，因而不能将终值取平均数，更不能将其直接冠以 Cerebras 的
              TAM。公司披露证据虽更具体，回答的却是另一维度问题：Cerebras 公布 2026 年 Q1 GAAP 营收为 $193.4 million，其中硬件为 $110.6 million，云与其他服务为
              $82.8 million；同时披露了一份价值超过 $20 billion、涉及 750 MW 的 OpenAI 协议。这些数据证实了客户需求与商业化渠道的拓展，但单笔客户合同不等于市场空间，已确认收入亦非
              SAM。现有资料均未单独剥离出晶圆级系统可触达的支出池，亦未给出推导严密 SOM 所需的采纳概率。
