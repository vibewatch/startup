              在既有资料中，集成设计最清晰的案例当属 Cerebras 在其 SEC 备案的 2026 年 Q1 新闻稿中宣布的 AWS 合作：由 Trainium 3 执行 Prompt Prefill，CS-3 负责
              Decode。这种做法把计算特性迥异的两个阶段拆分开来，却也带来了跨厂商协同调度与部署依赖，光凭芯片纸面参数无法化解。Cerebras 发布的基建工程招聘信息详细列出了机柜布局、BOM
              清单、电力分配、布线图、上线就绪度审查、验证测试以及根因分析，这仅能佐证公司有意建立规范的运营流程，不能当作已具备高可靠性的实证。CS-4 带来了路线图层面的想象空间，但独立验收测试、SLA
              履约记录以及可追溯的出货核验在此次尽调资料中均未获取到。
