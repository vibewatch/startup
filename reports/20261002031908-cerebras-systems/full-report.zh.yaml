  - id: TR003
    title: 合作伙伴 / 外部依赖风险登记册
    columns:
      - 依赖项 / 交易对手
      - 角色与集中度
      - 失效情景
      - 严重程度
      - 缓解措施
      - 残留风险敞口
      - 监控 / 止损标准
    rows:
      - - OpenAI
        - 750 MW 算力承诺经 Cerebras 自述估值超 $20 billion；独立分析称其为主导性增长引擎。
        - 订单取消、部署延期、融资争议或转向替代算力将降低产能利用率并压低预期增速。
        - 严重
        - 分期释放产能、执行最低采购保底并推动签约需求多元化。
        - 高
        - 止损标准：出现重大取消或反复延期且未见替代签约需求补位。
      - - MBZUAI / G42
        - 独立公开摘要显示其分别占 2025 年营收的 62% 与 24%。
        - 政策、资金、国家安全或采购调整中断营收或市场准入。
        - 严重
        - 降低合计营收占比、设立公司治理防火墙并维持出口管制合规许可。
        - 高
        - 止损标准：监管限制重现或未能实质压降客户集中度。
      - - AWS
        - 分销与解耦推理合作伙伴；Cerebras 亦将 AWS 列为重要客户。
        - 上线推迟、需求疲软或 AWS 优先自研芯片将制约该渠道规模。
        - 高
        - 设定合同上线里程碑，并拓展其他直销或云渠道。
        - 中至高
        - 密切跟踪生产环境可用性、付费使用量、毛利率及续约商业条款。
      - - 资本与数据中心基础设施提供商
        - Cerebras 报告 2026 年 Q1 GAAP 营业亏损；全年核心营业利润率预期为 -28% 至 -32%。
        - 产能建设支出超出已验收需求，将挤压流动性并迫使寻求额外融资。
        - 高
        - 按里程碑分批释放资本开支、收取客户预付款、落实已承诺信贷额度并设置流动性下行底线契约。
        - 高
        - 止损标准：已承诺扩建项目缺乏资金支撑，或持续负利润率且缺乏可信盈亏平衡路径。
    notes: 合同总额并不等同于已确认营收或现金；客户占比以 2025 年营收为分母，财务展望数据属于公司发布的 non-GAAP 指引而非实际兑现业绩。
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
  - id: TV001
    title: 投资建议与风险立场总览
    columns:
      - 维度
      - 评估结论
      - 决策含义
    rows:
      - - 投资评级
        - 持续深入调研
        - 暂缓新增股权配置，直至营业利润确立拐点且数据中心落地得到验证。
      - - 置信度
        - 中
        - 得到 SEC 季度申报文件与经核实在手订单支持，但受制于晶圆级制造在商用规模下未经证实的良率水平。
      - - 风险评级
        - 高
        - 极高的客户集中度以及对过往主权交易对手的监管审查带来不对称下行风险。
      - - 估值立场
        - 偏高
        - 按 $53B 市值与约 222x 历史市盈率计，股价已透支 $24.6B 在手订单将毫无阻碍全额转化的乐观预期。
    notes: 评估结论纳入 2026 年 Q1 财务披露（Form 8-K / EX-99.1）及 2026 年 5 月 Nasdaq IPO 后的交易数据。
