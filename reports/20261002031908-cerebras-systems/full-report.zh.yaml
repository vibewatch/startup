chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、发展阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Cerebras Systems Inc. 是一家在 Nasdaq 上市的 AI 基础设施公司，总部位于加利福尼亚州
              Sunnyvale。其商业模式将本地部署的晶圆级超级计算机与云端推理及训练服务相结合，兼具设备销售与按用量计费的算力业务。现有产品线涵盖基于 Wafer-Scale Engine 架构的系统；第三方历史记录显示
              CS-4 于 2026 年 8 月推出。成立年份尚未完全统一：Wikipedia 与 The CODEW 报道为 2015 年，Sacra 与 note.com 则报道为 2016 年。五位署名创始人为
              Andrew Feldman、Gary Lauterbach、Michael James、Sean Lie 和 Jean-Philippe
              Fricker。该分歧虽不影响产品本身定性，但在将任一年份确认为最终结论前，仍须对照发行人公司章程或招股书加以核实。
