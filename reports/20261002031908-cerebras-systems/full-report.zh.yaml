              2026 年的扩张立足于公司公布的一项与 OpenAI 签署的多年期协议——涉及 750 megawatts 算力、总价值超过 $20 billion，同时依托 Q1 财报披露的 AWS
              分销伙伴关系。该文件同时警示，Cerebras 依赖少数几家重要客户，包括 OpenAI、G42、MBZUAI 与 AWS。Trefis 报道称，三家客户贡献了 Q2 营收的 76%。此外，该机构指出 Q2
