            body: >-
              Cerebras 官方宣称其运行 Codex-Spark 可突破每秒 1,000 Token；在 Artificial Analysis 的实测中，Kimi K2.6 运行速度逼近每秒 1,000
              Token；根据该榜单数据，Gemma 4 31B
              亦实现了数量级的速度飞跃。这些跑分均有具体模型背书，但公司官网上同样特意注明：性能对比可能基于第三方基准测试或内部自测，且随工作负载、硬件配置、测试日期与模型版本而异。Sacra 则明确指出，开发者对成熟的
              Nvidia CUDA 生态高度依赖，这会拖慢 Cerebras 自研专有软件栈的采用。在分配到的资料库中，未能检索到安全认证、隐私控制规范、公开的服务状态历史、技术支持 SLA
              或正式的质量检验报告；这些都是尽调信息缺口，并不等同于公司绝对缺乏此类管控。
            claimRefs:
