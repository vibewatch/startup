            body: >-
              交易对手高度集中依然是客户质量维度的核心隐患。BBAE 与 Wikipedia 报道称，MBZUAI 和 G42 分别贡献了 2025 年营收的约 62% 与 24%，合计高达 86%。2026 年拓展的
