  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Cerebras 竞争的赛道是 AI 算力基础设施，而非整个半导体或软件市场。纳入界定的支出涵盖专用加速硬件、集成超级计算系统，以及面向大规模 AI 工作负载的云端训练或推理算力。通用
              CPU、终端设备、模型开发软件、数据标注和普通云存储均在界线外。公司兼售本地部署系统与云端访问权限，买方的决策因而贯穿资本化采购、基础设施预留算力与按量计费服务，并非单一的芯片预算。现状替代方案包括 GPU
              集群、超大规模云厂商自研加速芯片以及传统云端 AI 服务。Cerebras 显然无法全盘通吃整个 AI
              硬件预测市场：其实际商业机会仅限于特定负载子集——其低延迟、模型规模或编程简易度足以弥补客户对成熟生态的依赖、切换成本、电力与机房设施门槛。这一边界也将技术上可支撑的工作负载与公司现实中能吃到的支出份额明确区分开来。
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM013
              - CM014
