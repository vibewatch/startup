  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 营收结构与确认规则
        blocks:
          - type: paragraph
            body: >-
              Cerebras 财报并未披露 ARR，而是划分出两大主营收入板块：硬件，以及云与其他服务。2026 年 Q2，GAAP 营收为 $180.1 million，包括 $54.1 million 的硬件营收与
              $126.0 million 的云与其他服务营收。核心营收为 $209.9 million，剔除了数据中心代收代付（pass-through）收入，并加回非现金客户认股权证摊销；由此得出的核心指标不可与 GAAP
              营收混为一谈。云业务是主要增长引擎，但公开披露并未进一步拆分订阅式 API 调用、预留算力、专业咨询或该项下的其他杂项服务。公司同时公布了 $25.4 billion
              的剩余履约义务（RPO）。该合同储备金额反映了旺盛需求，却非已确认收入，最终转化取决于客户的部署节奏、建设工期以及公司自身的算力交付能力。
            claimRefs:
              - CI001
