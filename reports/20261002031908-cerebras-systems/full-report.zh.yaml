        title: 附图与数据
        blocks:
          - type: callout
            title: 环环相扣的执行风险是尽调的核心命题
            body: >-
              单一客户延期可能导致巨额数据中心投资沉没，生产制造端出现短板会直接阻碍产品交付，两者均会拖长利润转负的周期。对合同条款、机房产能、代工良率与流动性资金链的核查必须统一建模推进，绝不可把客户集中、运营执行与融资安排割裂来看。
