              Cerebras 披露截至 2026 年 6 月 30 日持有 $8.6 billion 现金、受限现金与短期投资，同时存在 $918.2 million 的营运资金借款负债以及 $850 million
              的名义信贷额度。受限现金与授信额度并不能等同于可自由调用的活期资金。历史融资沿革已在“公司概览”中述及；展望后续资金充裕度，关键现实取决于当前的流动性结构、600 MW
              扩产推进，以及管理层上调后的全年核心业绩指引——核心营收 $880 million 至 $890 million，核心营业利润率为 -19% 至 -17%。Sacra 另行估算 2026-2027 年间资金消耗约
