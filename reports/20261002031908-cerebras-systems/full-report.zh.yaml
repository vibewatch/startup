      - number: '3.3'
        title: Cerebras 兼顾整机销售与云端分销以降低采纳摩擦
        blocks:
          - type: paragraph
            body: >-
              公开报道显示，Cerebras 的商业交付兼具昂贵整机与按量计费的推理服务。一份独立报告指出，CS-3 的官方目录标价大致在 $2 million 至 $3 million 之间，Llama 3.1 405B
              推理报价为每百万输入 Token 收费 $6、每百万输出 Token 收费 $12；但企业客户实际成交条款未见公开。Wikipedia 另有记载称，其单节点售价高达 $3 million，功耗达 25kW。AWS
              的分销渠道有望缓解客户采购与系统集成的摩擦成本：Cerebras 发布了一种解耦设计方案，由 Trainium 3 承担 Prompt Prefill 阶段，CS-3 负责 Decode
              阶段。这种异构搭配模式或许支持客户多云混用，而不必整体彻底替代，但现有材料并未包含任何客户层面的系统迁移、留存或切换成本数据。
