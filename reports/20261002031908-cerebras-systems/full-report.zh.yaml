      - number: '3.4'
        title: 产能瓶颈、生态掌控力与客户集中度恐将削弱跑分领先优势
        blocks:
          - type: paragraph
            body: >-
              渠道铺设有所改善，但交付执行仍是核心风险。Simply Wall St 报道了其进军欧洲的规划，以及在 Flex 支持下将 CS-3 产能提升七倍的目标；Cerebras 亦披露了与 OpenAI 达成价值超
              $20 billion、规模达 750 megawatts 的合作协议。此类订单承诺固然印证了下游需求，但也放大了交付履约与对手方敞口风险。Seeking Alpha 一位作者于 2026 年 9
              月撰文指出，WSE-3 的显存带宽优势正被有限的容量以及 Nvidia 的快速迭代所抵消。Cerebras
              自身也发出警示，对少数核心客户的依赖、数据中心电力容量不足以及市场激烈竞争均构成重大不确定性。护城河因而存在前置条件：唯有在行业先头部队缩小差距前，将性能优势转化为充沛可靠产能、具备竞争力的经济性，以及更广泛的软件与客群生态，壁垒方能持久。
            claimRefs:
              - CP011
