  - number: 8
    title: 估值与投资研判
    sections:
      - number: '8.1'
        title: 核心投资逻辑与结构性反面逻辑
        blocks:
          - type: paragraph
            body: >-
              Cerebras Systems 的核心投资逻辑建立在其专有的 Wafer Scale Engine 晶圆级架构之上，该架构将整片晶圆集成于单颗处理器内部，破除了片间互联的延迟瓶颈。WSE-3 拥有 4
              trillion 晶体管与 900,000 个针对 AI 优化的核心，在 AI 推理负载下相比传统 GPU 集群可实现 10x 至 20x 的推理速度跃升。该硬件的显著代差促成 Cerebras 与 OpenAI
              敲定了一项里程碑式的多年期算力大单——规模达 750MW、总值逾 $20 billion，推动截至 2025 年底的剩余履约义务（RPO）激增至 $24.6
              billion。相反，结构性反面逻辑指出，报表账面利润严重受到非现金项目的扰动，而公司实际经营持续亏损——2025 年营业亏损达 $145.9 million，2026 年 Q1 营业亏损达 $15.0
              million。更严峻的是，高度集中于 OpenAI、G42、MBZUAI 与 AWS 的客群结构带来了极高的对手方脆弱性，任何监管干预、交付推迟或商务条款重组，都将直接削减其年化营收跑道。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV013
      - number: '8.2'
        title: 估值坐标、倍数偏离与投资立场
        blocks:
          - type: paragraph
            body: >-
              Cerebras 从私募走向公开市场的跨越，堪称半导体史上估值倍数攀升最陡峭的案例之一。公司于 2025 年 9 月以 $8.1 billion 投后估值完成 $1.1 billion G 轮融资，旋即于
              2026 年 2 月由 Tiger Global 领投完成 $1.0 billion H 轮融资，投后估值飙升至 $23.0 billion。2026 年 5 月，Cerebras 在 Nasdaq IPO 发行
              30 million 股 Class A 普通股，定价每股 $185，募资总额达 $5.55 billion；上市首日开盘价达每股 $350，随后企稳在每股约 $242 附近，折合总市值达 $53
              billion。在此估值水位下，CBRS 按 2025 年收益计算的静态市盈率约为 222x，但其 $237.8 million 的 GAAP 净利润主要依靠平仓与 G42 初始投资绑定的远期合约负债所产生的一笔
              $363.3 million 一次性非现金收益所推动，并非来自可持续的主营造血能力。2026 全年营业利润率指引定为 -28% 至
              -32%，进一步印证了前期基础设施搭建的沉重开支。基于上述估值博弈现状，我们维持“深入跟踪（Research-More）”立场，评定为中等置信度、高风险评级，并给出估值偏高（stretched）的判断。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景推演、下行诱因与逻辑破裂准则
        blocks:
          - type: paragraph
            body: >-
              评估 Cerebras 必须对跨周期的基础设施交付与商业转化建立多情景推演。在乐观情景下，Cerebras 顺利推进 750MW 的 OpenAI 集群交付，AWS Bedrock 对
              Prefill/Decode 解耦架构的采用规模化放量，基于 5nm 制程的 CS-4 系统成功实现量产放量，并将 $24.6 billion 在手储备订单以接近 50%
              的健康核心毛利率稳步转化，支撑其隐含估值达到 $75 billion。在基准情景下，基建交付遭遇数据中心常规的电力与散热掣肘，2026 全年核心营收落在官方指引附近的 $855 million 至 $865
              million，2028 年营收向 $4.5 billion 迈进，计入合理股权公允价值 $42 billion 至 $48 billion。在悲观情景下，客户集中反噬爆发：OpenAI 集群交付受阻延期，G42
              在 CFIUS 严格审查下面临新的监管阻力，资本开支加速蚕食账面现金，估值倍数承压回落至 $22 billion 附近。核心尽调任务必须覆盖：联合 TSMC 穿透审计 WSE-3 晶圆良率成本模型、追踪 G42
              与 OpenAI 之外的客群多元化进展，并紧盯账面 $3.3 billion 现金储备的真实消耗速率。
            claimRefs:
              - CV003
              - CV005
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 附图与数据
        blocks:
          - type: callout
            title: 报表口径 GAAP 净利润所隐藏的会计失真
            body: >-
              若投资者单纯锚定 Cerebras 2025 年 $237.8 million 的 GAAP 净利润，将陷入极大的视觉误区。该利润几乎全额来自冲销与 G42 早期投资绑定的远期合约负债所带来的 $363.3
              million 一次性非现金收益。剥离这一特殊账务处理后，Cerebras 在 2025 年实际产生 GAAP 营业亏损 $145.9 million，Non-GAAP 净亏损达 $75.7 million。以
              222x 的传统静态市盈率评估 CBRS，依托的仅是不可复制的财务技巧，而非真实日常经营现金流。
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
          - type: callout
            title: 与 OpenAI 签署 750MW 大单的战略深意
            body: >-
              Cerebras 与 OpenAI 签署的协议堪称一次极具分量的商业背书，约定在 2028 年前交付价值超 $20 billion、总容量达 750 megawatts
              的高速晶圆级推理算力。除商业营收外，OpenAI 还在 2026 年初提供了 $1 billion 的流动资金垫付款，并持有与算力交付节点挂钩的高达 33.4 million 股认股权证。这一布局虽促使
              Cerebras 跻身与 AWS 并驾齐驱的顶级 AI 推理供应商行列，却也使其与 OpenAI 的基础设施演进路线深度捆绑，承担了极高的对手方依赖风险。
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV006
