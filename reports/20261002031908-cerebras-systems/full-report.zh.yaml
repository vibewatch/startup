      - - 网络安全与隐私保护 —— 多司法辖区
        - 公司陈述未发生数据泄露或收到书面泄露通知，并声明在重大性限定范围内合规履行隐私义务。
        - Unknown
        - 高
        - 仅有制度性陈述；证据库中无独立审计、渗透测试结果或安全事件台账。
        - 中至高
