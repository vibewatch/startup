              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.3'
        title: 运营落地、产品良率与资本开支执行风险
        blocks:
          - type: paragraph
            body: >-
              晶圆级芯片的独特优势催生了复杂的运营连锁风险：该架构深度依附于特殊的先进制程、高功耗系统与充裕的数据中心电力。独立信源多次提示供应链瓶颈与技术迭代过快风险，而公司公开财报显示，截至 2026 年 3 月 31
              日的三个月内，计提了 $4.590 million 的产品保修准备金。该会计准备金并不能真实反映故障率，因为现有材料并未披露实际出货量、索赔频次、故障严重度或晶圆良率。财务层面的执行压力同样显著：Cerebras
              财报称 Q1 GAAP 营业亏损，并预计 2026 年 Q2 与全年的核心营业利润率将深度承压为负值，分析师亦估算 2026-2027
              年间将产生巨额现金消耗。筹集到的账面资金不等于可随意支配的活钱，工程交付节点与受限资金用途亟待全盘核验对齐。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
