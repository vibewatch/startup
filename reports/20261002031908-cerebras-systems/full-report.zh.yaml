        title: 产品矩阵与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Cerebras 将同一套核心计算架构封装为多种交付形态，而非局限于单一整机。SEC 备案文件与第三方企业分析均描述了本地部署系统与云端 API
              两种形态，买方既能自行购置硬件，亦可直接调用托管的推理与训练算力。CS-3 是 AWS 架构中提及的实际在役系统；Sacra 与 Venture Atlas 则将 CS-4 描述为由三颗 WSE-3 Turbo
              处理器构建的已发布机柜系统。Sacra 另指出 CSoft 软件栈与配套服务也是整体方案的一部分。在尽调实践中，关键区分点在于成熟度：CS-3 与云服务已具备明确的在役商用记录，而现有材料对 CS-4
              仅记录了出货指引，尚缺乏经第三方独立验证的产线交付验收依据。
