  - id: TV002
    title: 核心投资逻辑与结构性反向论点对比
    columns:
      - 核心支柱
      - 看多逻辑论据
      - 看空反向论据
      - 逻辑失效指标
    rows:
      - - 架构与速度
        - Wafer Scale Engine 相比标准 GPU 具备 10x-20x 推理速度优势，抢占智能体 AI 工作负载。
        - 单节点高达 25kW 功耗与 $3M 采购成本将潜在市场局限于专用的超大规模集群。
        - 具竞争力的多裸晶 GPU 先进封装获广泛采用，消除晶圆级芯片的低延迟溢价。
      - - 商业在手订单
        - 已签约的 $24.6B 在手订单对 2025 年营收基数（$510M）提供近 50x 的远期覆盖。
        - 前四大客户（OpenAI、AWS、G42、MBZUAI）在远期储备项目中的营收集中度超过 90%。
        - OpenAI 750MW 部署协议出现取消或大幅缩减采购量。
      - - 盈利质量
        - 2026 年 Q1 达 47% 的核心毛利率展现出软件与云服务毛利贡献的持续扩张。
        - 财报所列 2025 年净利润因 $363.3M 非现金负债消除收益而失真；核心主营业务实际亏损 $145.9M。
        - CS-4 数据中心扩容期间核心毛利率降至 35% 以下。
      - - 资金与资产负债表
        - IPO 后充裕的 $3.3B 现金与短期投资为数据中心部署提供跨越数年的资金跑道。
        - 预计公司在 2026 至 2027 年间将消耗约 $3B 资金以建设 750MW 基础设施。
        - 单季度自由现金流转正前，现金余额跌破 $1.0B。
    notes: 核心财务指标剔除非现金权证摊销、股权激励费用及代收代付成本。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV013
