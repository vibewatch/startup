  - id: FV001
    title: 决策框架与估值投资建议逻辑
    type: flow
    summary: 导向对 Cerebras Systems 给出“继续研究”投资建议的推导分析逻辑。
    data:
      nodes:
        - label: 架构护城河
          detail: Wafer Scale Engine 3 集成整颗晶圆，相较标准 GPU 确有 10x-20x 的推理速度优势
        - label: 商业在手订单
          detail: OpenAI 的 750MW 大单（$20B+）结合 AWS 合作，将剩余履约义务推升至 $24.6B
        - label: 客户集中度
          detail: 前几大交易对手方（OpenAI、G42、AWS、MBZUAI）占未来在手订单 90% 以上，带来单一买家风险
        - label: 运营失血
          detail: 2025 年 GAAP 营业亏损达 $145.9M，且 2026-2027 年预计需要 $3B 数据中心资本支出，极为依赖持续融资
        - label: 估值评估
          detail: 在 $53B 上市市值下，股票对应 ~222x 历史市盈率，远期估值倍数已将完美预期计入股价
        - label: 建议立场
          detail: 继续研究：在核心运营利润得到证实、商业客户结构走向多元化之前，暂不建立多头敞口
    approximationNotes: 流程图梳理了架构验证、在手订单扩张、财务风险与投资立场之间的因果推导关系。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV010
      - CV011
      - CV012
