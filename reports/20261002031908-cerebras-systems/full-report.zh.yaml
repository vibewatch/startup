      - number: '1.3'
        title: 资本化结构、流动性与经营规模
        blocks:
          - type: paragraph
            body: >-
              Cerebras 在经历两轮大规模私募融资后走向公开市场。多方信源报道称，公司在 2025 年 9 月或 10 月以 $8.1 billion 投后估值完成 $1.1 billion G 轮融资，随后在 2026
              年 1 月或 2 月以 $23 billion 投后估值完成 $1.0 billion H 轮融资。各信源在月份上的差异在此如实保留，未作强行合并。Cerebras 随后公布 2026 年 Q2 的 IPO
              总募资额为 $6.4 billion，并在 4 月获得最高 $850 million 的循环信贷额度。上述数额不可简单归并为单一的“累计融资”：股权募集款、债权授信额度与可用现金属于不同维度的指标。截至 2026
              年 3 月 31 日，公司报告拥有 $3.3 billion 现金、现金等价物、受限现金与短期投资。Q1 GAAP 营收为 $193.406 million，同比增长 94%；Trefis 显示，截至 2026
              年 10 月 1 日，以每股 $168.86 股价计算，公司市值达 $25.5 billion。
