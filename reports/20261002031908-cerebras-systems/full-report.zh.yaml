      - number: '2.3'
        title: 买方、使用者、出资人与采纳路径
        blocks:
          - type: paragraph
            body: >-
              现有材料证实了若干买方客群，但多数内部预算负责人未予披露。前沿模型开发团队与超大规模云厂商采购或分销专用推理算力；国家级实验室、科研机构与主权项目采购一体化整机系统，用于大型科学运算或国家级工作负载；企业与应用开发者则无需购置硬件，通过云服务即可使用该架构。实际出资人大概率为基础设施、研发或技术高管，日常使用者则是模型工程师、研究员和应用团队。各客群的采纳路径各有不同：实验室倾向于采购单体整机，前沿实验室多锁定多年期预留算力，超大规模厂商把
              Cerebras
              集成至更广泛的服务体系中，企业客户则多从云端试用切入。确切的签署人级别、审批门槛、销售周期长度以及预算科目归属依然未公开。此类信息的缺失十分关键，盖因技术人员注重极致速度，财务与基建团队则更看重综合成本、功耗、利用率与供应商风险。
