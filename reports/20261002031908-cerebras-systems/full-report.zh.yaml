      - number: '4.3'
        title: 利润率、成本结构与现金流状况
        blocks:
          - type: paragraph
            body: >-
              Q2 财报直观表明为何必须将 GAAP 指标与现金流指标区别对待。GAAP 毛利率降至 14.2%，而公司核心口径下为
              40.6%；在会计勾稽调节中，公司剔除了转付费用影响，加回了客户认股权证摊销与股权激励。GAAP 营业亏损达 $477.2 million，核心营业亏损则为 $33.6 million，调节项中包含了
              $377.0 million 的股权激励支出。这两种口径的亏损均不能直接等同于现金消耗。截至 6 月 30 日的六个月内，经营活动现金净流出为 $47.5 million，而购置固定资产支出达 $548.9
              million，投资活动现金净流出总计 $1.31 billion。这些数据表明，相较于纯粹的日常运营现金开支，重资产的基础设施扩建才是近期资金需求的大头。单台系统的硬件成本、机位利用率以及边际贡献率仍未见公开。
