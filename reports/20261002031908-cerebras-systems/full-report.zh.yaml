      - number: '1.2'
        title: 领导层、创始人契合度与治理盲区
        blocks:
          - type: paragraph
            body: >-
              在现有的第三方名单中，Andrew Feldman 仍担任首席执行官，Robert Komin 担任首席财务官，Sean Lie 担任首席技术官，Dhiraj Mallick
              担任首席运营官。创始人与市场的契合度极为直接：创业团队此前在 SeaMicro 共事，该公司的微服务器架构曾致力于解决数据传输与能效瓶颈，后于 2012 年被 AMD 以 $334 million
              收购。这种延续性固然有助于软硬件协同设计的执行落地，但也把组织知识与战略关系高度绑定在少数核心成员手中。现有材料无法证实完整的现任董事会名单、委员会构成、接班人计划或创始人投票权控制架构。管理层的连续性因而有据可依；治理深度与独立性则尚无充分支撑。
