            body: >-
              公开材料印证了软硬件兼备的商业模式，但尚未呈现完整的定价机制。硬件板块依靠整机销售确认收入，云业务则依托 Cerebras 自建算力以及大客户/合作伙伴的采购承诺触达市场。已披露的 OpenAI 大单与 600
              MW 扩产规划表明，其商务拓展以大企业深度谈判合同为主，而非公开透明的自助式价目表。历史上的客户集中度同样不容忽视：二手材料指出，MBZUAI 与 G42 分别贡献了 2025 年营收的 62% 与
              24%。新签约合同有望分散客户结构，但既有资料并未量化当前的集中度水平、销售周期、CAC、销售佣金、折扣幅度、续费留存或渠道分成机制。提取到的 Private Shares Fund 档案及 Seeking
              Alpha 报道并未补充实用的即期财务明细，无法弥合上述信息断层。
