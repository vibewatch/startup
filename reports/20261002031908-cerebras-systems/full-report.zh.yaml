          x: 3
          'y': 5
          detail: 云厂商自有加速芯片得益于云分销网络与一体化采购。
        - label: 自建内部方案 / 维持现状
          x: 1
          'y': 3
          detail: 架构创新性偏低，但与现有工具链、采购合同及人员技能高度兼容衔接。
    approximationNotes: 截至 2026-10-02 的 1-5 级序数分析综合。X 轴代表架构专用化程度，Y 轴代表生态 / 分销控制力；评分为方向性研判，非实测市场份额或性能比率，缺少证据支撑的竞争对手财务数据仍属未知。
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP010
      - CP013
      - CP016
  - id: FI001
    title: 营收模式传导链：从签约需求到现金流结果
    type: flow
    summary: 本传导链清晰拆解签约需求、产能投入、GAAP 确认、管理层调整项及现金流消耗。
    data:
      nodes:
        - label: 签约需求
          description: $25.4B 未履约合同义务（RPO）；非当期营收。
        - label: 产能承诺
          description: 截至 2027 年底已投产或签约待交付算力超 600 MW。
        - label: 制造与机房建设
          description: 公司计划 2026 年将制造产能提升 10x 以上。
        - label: 硬件交付或云服务
          description: 客户验收、实际用量与部署方式决定确认节点。
        - label: GAAP 营收
          description: 2026 年 Q2 包含 $54.119M 硬件与 $125.991M 云与其他服务。
        - label: GAAP 毛利润
          description: 2026 年 Q2 为 $25.559M，对应 14.2% 毛利率。
        - label: 核心调整项
          description: 经代收代付成本、客户权证及股权激励调整后，核心毛利率为 40.6%。
        - label: 现金流结果
          description: 上半年经营性现金净流出 $47.488M，资本开支为 $548.873M。
    approximationNotes: 各项金额为标明期间所报告的 GAAP 或公司定义核心指标；顺序流程不意味着所有 RPO 均按固定时间表转化。
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI008
      - CI011
  - id: FE001
    title: 产品架构图谱
    type: stack
    summary: 从客户接入层至物理数据中心部署的有据功能技术栈。
    data:
      layers:
        - label: 应用与 API 接入层
          detail: 通过本地部署或云端接入交付的客户训练与推理工作负载
        - label: 模型服务编排层
          detail: 预填充与解码解耦分区，涵盖已公布的 AWS Trainium 3 与 CS-3 混合架构
        - label: 软件与服务层
          detail: Sacra 所载的 CSoft 及配套落地实施服务
        - label: 系统平台层
          detail: CS-3 系统及已公布的三晶圆 CS-4 Nexus 机柜
        - label: 晶圆级计算层
          detail: WSE-3 SRAM、片上交换矩阵与晶圆级处理单元
        - label: 物理部署层
          detail: 机架、供电、散热、存储、网络、布线与站点定制化集成
    approximationNotes: 本内容为基于公开证据的分析综合，非官方披露的物料清单（BOM）或安全架构。
    claimRefs:
      - CE015
  - id: FU001
    title: 已观察到的客户采纳路径
    type: journey-map
    summary: 基于证据梳理的六类采纳路径，涵盖专用部署、签约算力及云分销渠道，不代表已测算的转化率。
    data:
      nodes:
        - label: 科研与主权 AI 部署
          detail: 国家实验室、G42、MBZUAI 及专用型企业的历史本地部署用例。
          touchpoints:
            - Direct system procurement
            - Research and sovereign AI workloads
        - label: 企业级评测验证
          detail: 明确将 Kimi K2.6 与 Gemma 4 列为企业客户试用案例。
          touchpoints:
            - Model trial
            - Performance evaluation
        - label: 本地商业化合同
          detail: 系统采购订单与可续期软件订阅捆绑。
          touchpoints:
            - Hardware purchase
            - Software and support renewal
        - label: 预留或按需云端使用
          detail: 云端买家可通过照付不议（take-or-pay）条款预留容量，或按实际用量付费。
          touchpoints:
            - Capacity reservation
            - Usage-based access
        - label: 超大规模云厂商分销
          detail: 规划由 AWS 采用 Trainium 3 搭配 Cerebras CS-3 分销解耦推理算力。
          touchpoints:
            - AWS infrastructure
            - Startup and enterprise distribution
        - label: 大规模扩容
          detail: OpenAI 多年期 750MW 承诺代表庞大的扩容空间，其实际产能利用率未予公开。
          touchpoints:
            - Multi-year deployment
            - Utilization and revenue monitoring
    approximationNotes: 对已观察到的签约与部署路径的概念性综合。各节点并非实测转化漏斗，亦不共享同一客户群体或时间基准，不推导转化率或暗示每位客户均遵循相同路径。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU009
      - CU014
  - id: FR001
    title: 残留风险热力图
    type: matrix
    summary: 即使引入已知缓解措施，客户、制造与部署资本依赖仍属最高残留风险。
    data:
      columns:
        - id: likelihood
