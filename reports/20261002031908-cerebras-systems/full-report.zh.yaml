      - number: '7.4'
        title: 伙伴依存度、风险对冲与逻辑破损触发条件
        blocks:
          - type: paragraph
            body: >-
              各项风险缓释措施的成效参差不齐。AWS 的分销渠道打开了更宽的市场路径，IPO 募集资金增强了资产负债表底气，但两者均未消除 OpenAI 的交付集中度、中东地区历史客户集中度、对 TSMC
              代工的单一依赖，亦未能摆脱在需求真正转化为账面收入与现金前回本周期漫长的问题。尽调标准因而必须立足合同与可量化指标：穿透各客户的实际收入占比、提前解约与保底采购条款、机房交付验收表、代工产能配额与历史良率曲线、保修追溯群组、网络安全审计结果及压力测试下的流动性底线预测。核心投资逻辑的破损触发条件包括：OpenAI
              部署计划取消或大幅延期、单一客户收入依赖未能有效缓解、机位交付节点屡次落空、营业利润率持续为负且缺乏清晰的盈亏平衡路径，或是遭遇出口管制限制、网络安全事件、IP 纠纷或严重质量缺陷而导致部署叫停。
