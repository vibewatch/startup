      - number: '5.2'
        title: 底层架构与技术差异化
        blocks:
          - type: paragraph
            body: >-
              其架构设计的核心立论在于：直接将整片晶圆制成处理器，从根本上削减跨芯片的数据搬运损耗。Wikipedia 汇总资料显示，WSE-3 是一颗边长 215 mm
              的正方形晶圆级半导体，采用交换式互联网络（Switched Fabric）与片上 SRAM；该架构借此压低了延迟并破除了互连瓶颈。同一信源亦指出了显著的工程代价，包括单节点功耗高达 25 kW、售价高达 $3
              million，说明集成优势无法脱离机房配套与资本开支单独成立。Cerebras 工程招聘信息进一步透露，其产品工程覆盖 RTL、逻辑综合、可测性设计、芯片点亮、第三方
              IP、网络、存储及机房物理部署。由此形成的软硬件栈固然高度垂直整合，但公开信息从未披露其实际晶圆良率、缺陷率或外场故障统计。
            claimRefs:
              - CE005
