            body: >-
              上述标杆客户名单提供了可信证据，表明 Cerebras 具备向顶尖 AI 实验室、云平台、主权基金机构、国家实验室及大企业拿单的能力。然而，这尚未证明公司拥有广泛而稳固的经常性收入底盘。Notion 或
              Cline 宣传的用户基数仅代表其产品自身的受众规模，不能等同于 Cerebras 付费客户体量或由其贡献的实际调用量。同样，协议总额与 Megawatt
              规模仅代表意向承诺，不能直接视同已确认营收、客户留存率或机房稼动率。投资尽调应当将合同交付时间表与账面确认收入逐项勾稽，调取各客群的活跃账户数与留存队列，严格区分测试流量与正式生产环境调用，并测算在 OpenAI
              与 AWS 订单放量后前一大及前五大客户的实际敞口。
