      - number: '3.2'
        title: 晶圆级消除了互连损耗，但架构独特性正在收窄
        blocks:
          - type: paragraph
            body: >-
              Cerebras 将算力与存储高度集成在整片晶圆级处理器上，降低了 GPU 集群固有的片间通信损耗与分布式软件开销。第三方机构与行业讨论普遍将其视作核心差异化优势，针对 Cerebras
              的市场评述亦指出其在特定模型上展现出强劲的推理性能。然而，另一面的反思同样值得重视：一位 Cerebras 前技术人员发文指出，公司最初的多项设计特性如今已不再独有，而 Chiplet
              虽牺牲了部分运行期通信开销，却换取了更出色的良率与渐进式升级能力。此外，Nvidia 庞大的 CUDA
              软件生态让竞争维度的较量远超出单纯的峰值吞吐量。现验证据表明，公司具备的是特定工作负载下的比较优势，而非通用平台层面的全面领先。
            claimRefs:
              - CP003
