        - 中
        - 严重
        - 文献记载其专有冗余与编译器方法，但历史良率从未公开。
        - 高
        - 各代产品良率、报废成本、周期时间、晶圆配额与爬坡验收标准。
      - - 电力、场地或部署容量交付延期
        - 公开摘要显示单节点功耗达 25 kW 且成本高达 $3 million；Cerebras 将数据中心机房容量列为风险。
        - 中
        - 高
        - 已募集资金并公布合作伙伴，但各站点交付就绪度尚未公开。
        - 高
        - 电力预留、电网互连节点、合规许可、调试里程碑及客户验收测试。
      - - 产品可靠性 / 保修索赔激增
        - 2026 年 Q1 现金流对账包含 $4.590 million 产品保修计提。
        - Unknown
        - 高
        - 已计提保修准备金，但未公开出货台数、索赔率、严重性或对应批次基数。
        - 中至高
        - 分产品代次的保修索赔、现场故障率、宕机时间、召回政策及根因归零情况。
    notes: 各项数值保留原始统计期间与单位；未从已报告计提中推断故障概率、晶圆良率或保修率，定性评级属分析师研判。
