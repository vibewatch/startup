      - number: '7.2'
        title: 监管合规、法律、知识产权与安全态势
        blocks:
          - type: paragraph
            body: >-
              在既有资料中，最明确的负面监管先例是此前伴随 G42 关联 IPO 进程而引发的 CFIUS
              审查。该事件虽已过去，却敲响了警钟：客户背景、公司治理表决权、出口管制及国家安全审查均可能直接冲击融资节奏与市场准入。2026
              年的承销协议中包含公司陈述保证，声称应披露的法律诉讼均已披露，未曾遭遇数据安全泄露或接到违规通知，亦无重大书面 IP
              侵权指控处于未决或受威胁状态。这些陈述属于合规信披把控，并不能独立证明绝对不存在潜在漏洞、事故或权利主张。在法律顾问、安全审计团队与管理层出具详尽的分司法管辖区档案、安全事件日志、出口管制排查以及清晰的知识产权权属图谱前，剩余风险依然不可轻视。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
