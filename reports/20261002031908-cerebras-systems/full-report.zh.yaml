      - number: '2.4'
        title: 增长动能、采纳瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              核心需求逻辑在于：交互式与 Agent 应用大幅推高了低延迟 Token 的商业价值。Yahoo Finance 刊载的一封投资人信件将高速推理描述为增长迅猛的算力细分赛道，Cerebras 与
              OpenAI、AWS 的合作便提供了契合这一逻辑的客户与渠道佐证。但掣肘因素构成了严峻的采纳门槛：GPU
              软件生态与超大规模云厂商的覆盖深度依然是行业默认首选；本地部署系统售价数百万美元且有严苛电力要求；云端扩张亟需数据中心机位与巨额资本；客户集中度更可能把大额订单承诺转化为对手方履约风险。Wikipedia
              报道称，MBZUAI 与 G42 分别贡献了 2025 年营收的 62% 与 24%，KoalaGains 亦独立指出前两大客户集中度超过
              85%。估值推演上，宽泛的行业预测仅能支撑成长性叙事，却无法证明确切的市场份额假设。投资测算理应重点推演合同转化率、客群多元化后的利用率、迁移经济性以及扣除基础设施成本后的实际毛利。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 附图与数据
        blocks:
          - type: callout
            title: 需求端证据明显强于份额端证据
            body: >-
              OpenAI 的算力承诺、AWS 的分销合作以及云与服务业务的爆发式增长，印证了强劲的商业拉动力。但在现有材料中，并无任何信源能确证全行业 AI 硬件支出中，究竟有多大比例在技术上适配、经济上划算且能被
              Cerebras 凭借竞争优势真正拿下。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM016
          - type: callout
            title: 集中度往往会掩盖真实的市场广度
            body: >-
              大额合同固然能拉高营收可见度，却不代表已被多元化客群广泛采纳。鉴于 2025 年 MBZUAI 与 G42
              带来的高集中度，比起直接套用自上而下的市场份额假定，针对单客利用率、续约经济模型与利润率转化的审查对投资决策更具实质价值。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方的抉择：现有主流平台、专用加速器，抑或不引入新供应商
        blocks:
          - type: paragraph
            body: >-
              Cerebras 面对的并非单一纯粹的同业群体。硬件买方既可留守 Nvidia，也可评估 AMD 或 Intel，或是试用 Groq、SambaNova、Graphcore 等专用架构，亦能直接通过
              AWS、Google 和 Microsoft 采购其自研芯片。云端买方同样无需自建加速硬件系统，直接采买 AWS、Azure、Google Cloud、Oracle 或 CoreWeave
              的托管算力即可。企业内部既有的 GPU 集群及已采购的云端算力仍是显而易见的现状替代方案。Sacra 估算 Nvidia 占据约 85% 的 AI 加速器市场，可见 Cerebras
              是在撼动根基深厚的成熟平台，而非切入一片空白市场。所给公开资料并未提供每一家竞对在融资额、装机量或订单合同上的横向对比数据；这些栏目目前依然属于明确的未知状态。
            claimRefs:
              - CP001
              - CP002
              - CP015
