              Cerebras 通过数条差异化的商务触点获客，并非依赖单一同质的漏斗通道。其过往的基本盘主要是国家级实验室、主权 AI
              实体，以及在生命科学或工业领域利用本地系统执行复杂科学计算与大模型任务的大型企业。近期发力的推理业务则重点面向前沿模型开发团队与超大规模云厂商：OpenAI 直接签署了巨额算力长协，AWS
              则计划面向初创团队与成熟企业分销由 Cerebras 驱动的推理服务。第三类触点则是 Notion、Cline
              等企业级与开发者软件集成。各类业务的合同形式各异：既有附带可续订软件订阅的整机买断，也有采用照付不议（take-or-pay）条款的预留云算力合同，以及纯粹的按需计费。这些渠道虽勾勒出了买方与使用者轮廓，却未确证
              Cerebras 在各细分市场究竟有多少活跃付费客户。
