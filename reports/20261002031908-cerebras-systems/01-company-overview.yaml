company:
  name: "Cerebras Systems"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Cerebras is now a public AI-infrastructure company built around wafer-scale systems and cloud inference, with a current platform spanning on-premises hardware and hosted services. Its 2026 scale-up is supported by an OpenAI agreement, public-equity proceeds, and debt capacity, but founding-date discrepancies, incomplete governance evidence, customer concentration, and a large Q2 GAAP loss qualify the snapshot."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Stage, and Business Model"
    body: >-
      Cerebras Systems Inc. is a Nasdaq-listed AI-infrastructure company headquartered in
      Sunnyvale, California. Its commercial model combines on-premises wafer-scale
      supercomputers with cloud inference and training services, so the company participates
      in both equipment sales and usage-based compute. The current product line includes
      systems based on its Wafer-Scale Engine architecture; third-party histories record the
      CS-4 introduction in August 2026. The founding year is not fully reconciled: Wikipedia
      and The CODEW report 2015, while Sacra and note.com report 2016. The five named founders
      are Andrew Feldman, Gary Lauterbach, Michael James, Sean Lie, and Jean-Philippe Fricker.
      The discrepancy is immaterial to product identity but should be resolved against the
      issuer's charter or prospectus before treating either year as definitive.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Founder Fit, and Governance Gaps"
    body: >-
      Andrew Feldman remains the chief executive, with Robert Komin as chief financial
      officer, Sean Lie as chief technology officer, and Dhiraj Mallick as chief operating
      officer in the current third-party roster. Founder-market fit is unusually direct:
      the founding group had worked together at SeaMicro, whose microserver architecture
      addressed data-movement and efficiency constraints before AMD acquired the company
      for $334 million in 2012. That continuity supports execution in hardware-software
      co-design, but it also concentrates institutional knowledge and strategic relationships
      in a small group. The assigned evidence does not establish a complete current board
      roster, committee composition, succession plan, or founder voting control. Leadership
      continuity is therefore supportable; governance depth and independence are not.
    claimRefs:
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization, Liquidity, and Operating Scale"
    body: >-
      Cerebras entered the public market after two large private financings. Sources report
      a $1.1 billion Series G at an $8.1 billion post-money valuation in September or October
      2025, followed by a $1.0 billion Series H at a $23 billion post-money valuation in
      January or February 2026. The month differences are retained rather than harmonized.
      Cerebras then reported $6.4 billion of gross IPO proceeds in Q2 2026 and an April
      revolving credit facility of up to $850 million. These amounts are not a single
      "total raised": equity proceeds, debt capacity, and cash available are different
      measures. At March 31, 2026, the company reported $3.3 billion of cash, cash
      equivalents, restricted cash, and short-term investments. Q1 GAAP revenue was
      $193.406 million, up 94% year over year, while Trefis showed a $25.5 billion market
      capitalization at a $168.86 share price on October 1, 2026.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "milestones-and-risk-signals"
    title: "Milestones, Partnerships, and Adverse Signals"
    body: >-
      The 2026 expansion rests on a company-announced multi-year OpenAI agreement for 750
      megawatts of compute valued at more than $20 billion, alongside an AWS distribution
      partnership described in the Q1 release. The same filing warns that Cerebras depends
      on a limited number of significant customers, including OpenAI, G42, MBZUAI, and AWS.
      Trefis reports that three customers represented 76% of Q2 revenue. It also reports a
      $450.5 million Q2 GAAP net loss, with $386.6 million attributed to non-cash stock-based
      compensation; that accounting loss should not be described as cash burn. Regulatory
      history remains relevant: independent analyses say CFIUS scrutiny of G42 delayed the
      first IPO process until G42's voting rights were removed. The resulting profile is
      scaled and well-capitalized, but still dependent on concentrated counterparties and
      capital-intensive delivery.
    claimRefs:
      - "CO008"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
