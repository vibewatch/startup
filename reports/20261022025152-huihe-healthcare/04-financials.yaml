      - [Gross margin, null, low, "Separates device economics from R&D and commercialization cost", "COGS by SKU including manufacturing, scrap, royalties, and service"]
      - [CAC or sales cost per hospital, null, low, "Tests whether adoption requires a capital-intensive field force", "Sales headcount, distributor fees, training spend, and wins by cohort"]
      - [Payback period, null, low, "Links acquisition cost to contribution margin and repeat use", "Hospital-level contribution cohorts and repeat utilization"]
      - [Working-capital cycle, null, low, "Medical-device inventory and receivables can consume financing", "Inventory turns, receivable aging, consignment, and payment terms"]
    notes: "Null means the assigned successful sources do not disclose the metric; each null has a concrete diligence request. Comparator product pages are directional context, not Huihe measurements."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Capital adequacy and financing dependency
    columns: [Input, Public evidence, Financial interpretation, Confidence, Diligence ask]
    rows:
      - [Latest reported financing, "Several hundred million yuan D-round reported in December 2025", "Confirms a financing event, not cash available", medium, "Signed financing documents, proceeds, fees, share class, and closing date"]
      - [Post-money valuation, null, "Cannot underwrite the reported valuation from the assigned sources", low, "Cap table and round valuation"]
      - [Cash on hand, null, "Runway cannot be calculated", low, "Latest balance sheet and bank reconciliation"]
      - [Operating burn, null, "Capital consumption is unknown", low, "Monthly cash-flow statement and burn bridge"]
      - [Debt/project finance, null, "Leverage and covenants are unknown", low, "Debt schedule, guarantees, and covenant package"]
      - [IPO liquidity path, "IPO status terminated in September 2026; October 2026 registry notice reports withdrawal after site inspection", "Public-market funding path is currently unavailable on the cited record", medium, "Regulatory correspondence, remaining private financing plan, and liquidity timetable"]
    notes: "The financing headline is reported by news and industry sources; the registry record supplies corporate-status and IPO-status signals. No source supplies cash, burn, runway, or debt figures."
    claimRefs: [CI009, CI010, CI011, CI012, CI015]
