company:
  name: Huihe Healthcare
chapter:
  number: 6
  title: Customers
  summary: Huihe has credible clinical-use evidence for K-Clip, including a 96-patient multicenter study and named hospital procedures, but public evidence remains centered on selected cases and company-sponsored studies rather than a disclosed commercial cohort. The customer thesis is therefore promising but not yet underwritten on repeat use, payer realization, retention, or concentration.
sections:
  - id: buyer-and-use-case
    title: Buyer, user, and clinical-use segmentation
    body: |
      Huihe's customer is not a single entity. The immediate user is a structural-heart team operating in a hospital, while the economic buyer and clinical gatekeeper are shaped by the hospital's procurement, cardiac-center leadership, and multidisciplinary heart team. The 2022 TriStar registry describes patients with severe or worse tricuspid regurgitation who are at high surgical risk and expected to benefit from repair, while the 2026 randomized protocol broadens the intended population to adults with severe or greater disease and moderate or high surgical risk. This indicates a specialist, referral-driven workflow rather than a self-serve device sale. The Qingdao case shows the operational buying unit: cardiology, cardiac surgery, cardiac ultrasound, anesthesiology, and the operating room coordinated around one complex patient. China Med Device's summary of revised NMPA manufacturing rules and standards also makes quality-system compliance an ongoing procurement dependency. These sources do not establish recurring purchase volume, reimbursement realization, procurement cycle, or activated-hospital count.
    claimRefs: [CU001, CU002, CU003, CU004, CU015]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and clinical proof
    body: |
      The strongest public adoption signal is clinical use, not a reported revenue cohort. The peer-reviewed 30-day study enrolled 39 intermediate- or high-risk patients and reported successful implantation in all cases, while the later TriStar publication reports 96 patients, a 97.9% implantation success rate, and one-year follow-up. These are meaningful proof points for physician willingness to use the system and for an evidence-generation pathway, but they should not be converted into active customers, paid accounts, or repeat utilization. The official trial record also shows that the earlier confirmatory study was sponsored by Huihe and had no results posted in the registry record; the later publication supplies results but remains a company-funded study. A newer 132-patient randomized trial was listed as recruiting in February 2026, suggesting continued clinical expansion, yet its results are not available. The public record therefore supports procedural adoption and outcome evaluation, while leaving the commercial adoption curve, site activation pace, and repeat-case frequency unresolved.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named customer proof, expansion, and concentration
    body: |
      Named proof is strongest where a source identifies a hospital, procedure, and patient-use context. Qingdao Municipal Hospital provides one detailed example involving a 70-year-old patient with severe comorbidity and a reported reduction in tricuspid regurgitation from 6+ to 3+ after three K-Clip devices. The VCBeat profile adds a company-reported global total of more than 300 clinical surgeries by December 2025 and says nearly 10% were overseas, but it is a secondary article that reproduces company-provided figures and does not disclose the denominator by hospital, paid status, repeat use, or follow-up completeness. The same source says K-Clip entered hospitals in the United States and Canada, which is a useful international reference signal but not proof of commercial scale. Evidence on retention, contract length, renewal, channel dependence, top-account concentration, and reimbursement is absent from the assigned pool. An investor should treat the customer base as clinically validated but commercially opaque until Huihe provides site-level utilization, paid-vs-sponsored case counts, and cohort retention.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: customer-diligence
    title: Customer diligence priorities
    body: |
      The customer case can support a research-more stance rather than a conclusion of durable commercial traction. Clinical outcomes and named hospital use reduce the risk that K-Clip is merely a laboratory concept, but the evidence does not establish how many hospitals have converted from evaluation to routine use or whether procedures generate attractive contribution margins after training, imaging, inventory, and support costs. The central diligence questions are operational: obtain a hospital-by-hospital installed and active-site list, monthly procedures and repeat utilization, paid versus trial cases, average selling price and gross margin by product, reimbursement and tender status, and the share of procedures attributable to the largest accounts or physician champions. A second layer should test durability using 12- and 24-month site cohorts, adverse-event reporting, reintervention, physician learning curves, and reasons for inactive sites. Until those data are supplied, the public evidence supports clinical demand and early referenceability but not a quantified net-retention or concentration claim.
    claimRefs: [CU014, CU015, CU016]
    tableRefs: []
