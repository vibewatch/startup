evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: funding-gap
    missingEvidence: >-
      Primary Series D closing announcement, term sheet, cap table, exact proceeds, post-money valuation, and cash
      balance.
    whyItMatters: >-
      A financing headline cannot establish valuation, dilution, or the resources available to complete clinical and
      manufacturing plans.
    diligencePath: >-
      Request signed financing documents, investor confirmation, latest management accounts, and a sources-and-uses
      schedule.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: commercial-scale-gap
    missingEvidence: >-
      Audited revenue, product-level shipments, customer and hospital counts, reimbursement realization, gross margin,
      and runway.
    whyItMatters: Clinical evidence and headcount do not demonstrate repeatable commercial demand or economic durability.
    diligencePath: >-
      Obtain monthly revenue and shipment cohorts, top-customer concentration, receivables aging, and cash forecast
      under base and downside cases.
    relatedQuestionRefs:
      - QO006
      - QO009
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Current executive biographies, founder roles, board committees, independence, and succession plan.
    whyItMatters: >-
      The registry names personnel but does not show whether the company has sufficient operating and governance depth
      for a regulated global-device business.
    diligencePath: >-
      Request the current organization chart, board minutes, committee charters, biographies, and key-person continuity
      plan.
    relatedQuestionRefs:
      - QO005
  - type: access-blocked
    severity: material
    topic: adverse-ipo
    missingEvidence: Primary exchange notice, prospectus withdrawal explanation, and updated financing or listing strategy.
    whyItMatters: >-
      The reported IPO withdrawal may reflect timing, diligence, market conditions, or substantive readiness issues;
      secondary reporting cannot distinguish them.
    diligencePath: Obtain the exchange disclosure, sponsor correspondence, latest prospectus version, and management explanation.
    relatedQuestionRefs:
      - QO008
      - QO010
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: Complete current leadership and director enumeration with biographies and founder-market-fit evidence.
    whyItMatters: The table is based on a commercial registry snapshot and may omit changes or key technical and commercial leaders.
    diligencePath: Reconcile the registry against current corporate filings, employment records, and investor board materials.
    relatedTableRefs:
      - TO002
      - TO003
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: minor
    topic: product-portfolio
    missingEvidence: Current product-by-product regulatory status, manufacturing sites, and commercial launch dates beyond K-Clip.
    whyItMatters: >-
      Portfolio breadth and regulatory maturity determine whether Huihe is a single-product clinical story or a scalable
      platform.
    diligencePath: Request the product master, NMPA certificates, overseas registrations, manufacturing licenses, and launch plan.
    relatedQuestionRefs:
      - QO001
      - QO007
  - type: missing-source
    severity: blocking
    topic: market-sizing
    missingEvidence: >-
      A reconciled China and international market model with prevalence, eligible anatomy, annual procedures,
      reimbursement, realized price and serviceable hospital count.
    whyItMatters: >-
      Without a commercial denominator, clinical enrollment and private-company valuation marks cannot support
      TAM/SAM/SOM or penetration assumptions.
    diligencePath: >-
      Request regulator- or payer-backed procedure volumes, reimbursement schedules, hospital ASP and
      contribution-margin data, then reconcile them to eligible-patient epidemiology.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-constraints
    missingEvidence: Hospital procurement, payer coverage, realized procedure price, repeat-use and customer-concentration evidence.
    whyItMatters: These variables determine whether clinical evidence converts into recurring commercial demand and cash generation.
    diligencePath: Obtain anonymized hospital-level procedure, pricing, reimbursement and utilization cohorts under confidentiality.
    relatedQuestionRefs:
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: private-market-data
    missingEvidence: Verified funding, valuation and commercialization records from Huihe, investors, filings or a regulator.
    whyItMatters: >-
      Private databases report inconsistent funding and valuation figures, so market comparables and valuation relevance
      are uncertain.
    diligencePath: >-
      Reconcile capitalization-table extracts, round announcements, audited accounts and regulatory filings before using
      private-market marks.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: missing-source
    severity: minor
    topic: adverse-evidence
    missingEvidence: Primary court and regulatory records explaining the reported litigation entries and their current status.
    whyItMatters: A low-reputation database flags proceedings but does not establish materiality, outcome or operating impact.
    diligencePath: Review official Chinese court and corporate-registry records and obtain management representation on each matter.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: pricing-comparison
    missingEvidence: >-
      Realized device price, procedure cost, reimbursement, discounts, and hospital contracting terms for K-Clip and
      named alternatives.
    whyItMatters: >-
      Pricing and payer economics determine whether a clinically differentiated device converts into durable adoption
      and margin.
    diligencePath: Request executed hospital contracts, reimbursement records, tender prices, and center-level procedure economics.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: commercial-evidence
    missingEvidence: Hospital-level utilization, repeat-use cohorts, customer concentration, and onboarding or training data.
    whyItMatters: These data determine switching friction, distribution power, and whether early clinical adoption is repeatable.
    diligencePath: Obtain center-level utilization logs, installed-base cohort data, training records, and customer references.
    relatedQuestionRefs:
      - QP005
      - QP007
  - type: access-blocked
    severity: minor
    topic: competitor-benchmarking
    missingEvidence: Accessible independent clinical and pricing evidence for named direct transcatheter competitors.
    whyItMatters: Without comparable rival data, the positioning map cannot support a superiority or share conclusion.
    diligencePath: >-
      Collect regulator filings, trial registries, peer-reviewed studies, and procurement disclosures for each named
      rival.
    relatedQuestionRefs:
      - QP002
      - QP007
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      A current named census of global and Chinese edge-to-edge repair, replacement, annuloplasty, and other
      transcatheter tricuspid devices.
    whyItMatters: >-
      A partial landscape cannot establish relative clinical maturity, product breadth, physician preference, or entrant
      risk.
    diligencePath: >-
      Obtain current NMPA and global regulatory product lists, tender records, and cath-lab interviews, then map each
      named device by indication and evidence stage.
    relatedQuestionRefs:
      - QP001
      - QP007
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: adverse-primary-records
    missingEvidence: >-
      Primary exchange termination records, the IPO withdrawal rationale, and docket-level documents for the
      enterprise-database legal signals.
    whyItMatters: Secondary summaries cannot distinguish routine matters from governance, disclosure, or financing risks.
    diligencePath: >-
      Retrieve Shanghai Stock Exchange notices, the latest filing record, and primary documents for each identified
      legal matter.
    relatedQuestionRefs:
      - QP008
      - QP009
  - type: missing-source
    severity: blocking
    topic: revenue
    missingEvidence: Audited or management-reconciled revenue by product, period, geography, and customer type.
    whyItMatters: Without recognized revenue and mix, growth quality and valuation cannot be underwritten.
    diligencePath: Request monthly revenue bridge, invoices, shipment records, returns, and revenue-recognition policy.
    relatedQuestionRefs:
      - QI002
      - QI008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized net price, tender discounts, distributor economics, reimbursement collections, and gross margin by SKU.
    whyItMatters: Approval and list pricing do not show contribution margin or cash conversion.
    diligencePath: Request representative contracts, tender awards, invoices, rebate schedules, and SKU-level COGS.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: D-round proceeds and terms, cash balance, monthly burn, debt schedule, runway, and post-IPO financing plan.
    whyItMatters: The company may be financing-dependent despite having raised a reported round.
    diligencePath: >-
      Request latest management accounts, bank statements, cap table, financing documents, debt agreements, and 24-month
      model.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: minor
    topic: financing
    missingEvidence: A directly accessible, original filing or official announcement for the reported D-round terms.
    whyItMatters: The available reports corroborate the headline but do not expose full terms or primary documents.
    diligencePath: Obtain the executed financing announcement or investor/company confirmation and reconcile it to the cap table.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: blocking
    topic: operating-risk
    missingEvidence: >-
      Audited quality-system, manufacturing-capacity, yield, lot-release, and field-performance records for each
