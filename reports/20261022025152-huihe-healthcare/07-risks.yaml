callouts:
  - calloutType: risk
    title: Commercial approval does not close the evidence gap
    body: >-
      The reported March 2025 approval and commercial use must be reconciled with stale public trial
      statuses, missing posted results, and unavailable post-market safety metrics before adoption
      or durability assumptions are underwritten.
    claimRefs: [CR001, CR002, CR003, CR005, CR013]
  - calloutType: recommendation
    title: Gate capital on four document rooms
    body: >-
      Require clinical and vigilance files, audited liquidity and financing terms, case-level legal
      records, and partner/customer contracts. Any material undisclosed safety, regulatory,
      accounting, or liquidity defect should stop the process.
    claimRefs: [CR014, CR015, CR016]
