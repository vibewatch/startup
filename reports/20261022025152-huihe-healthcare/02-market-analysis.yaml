callouts:
  - calloutType: insight
    title: The market is clinically legible but commercially unmeasured
    body: The assigned evidence supports a defined structural-heart use case and a visible clinical adoption pathway, but it does not support a numeric market-size claim. The next underwriting step is to obtain procedure volume, reimbursement, realized ASP, eligible-patient conversion, and hospital economics.
    claimRefs: [CM001, CM005, CM013, CM015]
  - calloutType: risk
    title: Clinical progress is not commercial penetration
    body: Small and improving K-Clip cohorts reduce technical uncertainty, but they do not establish payer coverage, repeat hospital demand, pricing power, or a share-of-market denominator.
    claimRefs: [CM006, CM007, CM014]
