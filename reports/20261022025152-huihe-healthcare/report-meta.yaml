    Develops and commercializes interventional cardiovascular devices for structural-heart treatment and
    coronary-calcification intervention, including the K-Clip system.
  customerFocus: Hospitals, interventional cardiologists, and healthcare systems adopting cardiovascular procedures.
  businessModel: >-
    Regulated medical-device development, manufacturing, and sales through clinical adoption, hospital access, and
    procedure utilization.
