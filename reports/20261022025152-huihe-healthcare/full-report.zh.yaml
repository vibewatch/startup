  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户与临床使用分层
        blocks:
          - type: paragraph
            body: >
              Huihe 的客户并非单一实体。直接用户是医院内操作的结构性心脏病团队，经济买方和临床把关者则由医院采购、心脏中心管理层和多学科心脏团队共同决定。2022 年 TriStar
              登记描述了重度或更严重三尖瓣反流、外科风险高且预计可从修复中获益的患者；2026
              年随机方案则把目标人群扩大到重度或更严重疾病且具有中高外科风险的成年人。这说明它是专业化、依赖转诊的流程，而不是自助式器械销售。Qingdao
              案例展示了运营层面的采购单元：心内科、心外科、心脏超声、麻醉科和手术室围绕一名复杂患者协同。China Med Device 对修订后的 NMPA
              制造规则和标准的总结，也说明质量体系合规是持续的采购依赖。这些来源无法证明经常性采购量、报销实现率、采购周期或已启用医院数量。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
              - CU015
      - number: '6.2'
        title: 采用轨迹与临床证明
        blocks:
          - type: paragraph
            body: >
              最强的公开采用信号是临床使用，而不是据报道的收入客户队列。同行评审的 30 天研究纳入 39 名中高风险患者，并报告所有病例均成功植入；随后 TriStar 发表的研究报告 96 名患者、97.9%
              的植入成功率和一年随访。这些是医生愿意使用该系统以及持续生成证据的重要证明，但不能转化为活跃客户、付费账户或重复使用。官方试验记录还显示，较早的确证性研究由 Huihe
              赞助，登记记录没有公布结果；后续发表提供了结果，但仍是公司资助的研究。较新的 132 人随机试验于 2026 年 2
              月列为招募中，说明临床覆盖仍在扩大，但结果尚不可用。因此，公开记录支持手术采用和结果评估，但商业采用曲线、站点启动速度和重复病例频率仍无法确定。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.3'
        title: 已命名客户证明、扩张与集中度
        blocks:
          - type: paragraph
            body: >
              当来源同时指出医院、手术和患者使用场景时，命名客户证明最有力。Qingdao Municipal Hospital 提供了一个详细案例：一名 70 岁且合并严重疾病的患者使用三枚 K-Clip
              后，三尖瓣反流据报道从 6+ 降至 3+。VCBeat 资料页补充称，截至 2025 年 12 月，公司据报道累计完成超过 300 台临床手术，其中近 10%
              在海外；但该资料是转载公司数据的二手文章，没有披露按医院划分的分母、付费状态、重复使用或随访完整性。同一来源称 K-Clip
              已进入美国和加拿大的医院，这是有用的国际参考信号，但不是商业规模证明。指定证据池没有提供留存、合同期限、续约、渠道依赖、头部账户集中度或报销信息。在 Huihe
              提供站点级使用量、付费与赞助病例拆分及队列留存前，投资者应将客户基础视为临床已验证、商业仍不透明。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: 客户尽调重点
        blocks:
          - type: paragraph
            body: >
              客户案例支持继续研究，而不是得出商业化进展持久的结论。临床结果和具名医院使用降低了 K-Clip
              只是实验室概念的风险，但证据没有证明有多少医院已经从评估转为常规使用，也没有证明在培训、影像、库存和支持成本之后手术能否产生有吸引力的贡献利润。核心尽调问题是运营性的：取得逐医院的装机和活跃站点清单、月度手术量和重复使用、付费与试用病例、按产品拆分的平均售价和毛利率、报销与招标状态，以及最大账户或医生意见领袖贡献的手术占比。第二层应通过
              12 个月和 24 个月站点队列、不良事件报告、再干预、医生学习曲线和站点停用原因测试持久性。在这些数据提供前，公开证据支持临床需求和早期参考性，但不支持量化净留存或集中度主张。
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              证据支持四条优先尽调线。第一，临床证据执行影响很高，因为一项赞助方提交的 K-Clip 研究仍显示 2022 年更新且没有结果，另一条记录显示状态未知且没有结果；这些记录与公司联合发布的 2025 年 3
              月获批和大规模商业使用说法并不协调。第二，资本获取是高残余风险，因为一篇独立文章报告了 RMB1.11 billion IPO 计划被撤回，而后续 D
              轮融资只被描述为数亿元人民币，不能作为现金可用的证据。法律案件细节和合作伙伴集中度也很重要，但目前更难量化。投资应继续以经审计的流动性、当前试验结果、上市后监测、逐案法律审查和合同级渠道证据为前提。
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR009
              - CR012
