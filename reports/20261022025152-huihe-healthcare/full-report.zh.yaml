  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              这里的市场并非全部心血管医疗，而是临床上显著的三尖瓣反流及相邻结构性心脏病的微创治疗所对应的器械和手术支出，包括部署经导管修复系统所需的递送、影像、医院和随访流程。保守药物治疗和开放手术是现状替代方案；经导管缘对缘修复、瓣环成形和瓣膜置换则是相邻治疗方式，会争夺同一批专科医生、医院和支付方的决策。Huihe
              的可用描述显示其凭借 K-Clip 及相关介入项目位于结构性心脏病修复领域，但未披露逐产品收入拆分或手术量。因此，这一市场边界足以支持战略相关性判断，却不足以得出精确支出分母。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              多个证据角度都指向一个真实但仍处早期的市场。一份临床试验记录显示，K-Clip 有一项 67 人的确证性研究，设置五年随访指标；另一项后来启动招募的随机研究计划入组 132
              人，并将经导管夹闭系统与指南指导的药物治疗进行比较。已发表的 K-Clip 研究分别报告观察性队列 39 人和一年期研究 96
              人，说明了手术和临床终点，但不能作为商业需求证明。这些是采用和证据信号，不是市场规模分母。公开公司资料对 Huihe
              的融资和估值记录也存在分歧，进一步说明不能把私营公司数据库当作市场收入的替代指标。由于患病率、适合治疗的解剖条件、年度手术量、报销和实际定价没有被共同披露，数字化 TAM/SAM/SOM 仍无法确定。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
