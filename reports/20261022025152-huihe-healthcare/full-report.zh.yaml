      - number: '7.3'
        title: 运营、质量与技术执行
        blocks:
          - type: paragraph
            body: >-
              Huihe
              描述了整合研发、制造、商业化、输送系统、精密制造、仿真和自动化生产的能力，但审阅过的主页本身没有提供质量体系证书、良率数据、投诉趋势、召回历史、网络安全控制或上市后事件率。这是披露缺口，不是证明没有事件。AiQicha
              报告 94
              名参保员工，公司所述平台覆盖面很广，但公开员工规模指标有限，因此规模化风险同样重要。缓释措施应要求站点级审计证据、供应商资质和双来源地图、批次放行及现场失效趋势、经验证的制造能力，以及医疗器械安全与警戒工作的明确负责人。任何严重且未整改的质量问题，或器械相关事件率上升，都应打破投资逻辑。
