        - label: 持久性
          title: Longer-term follow-up
          description: TriStar 论文报告了一年期结果；注册方案定义了更长期的随访指标。
          touchpoints:
            - 六个月复查
            - 一年复查
        - label: 扩张
          title: Repeat site use and regional referrals
          description: 指定证据未披露重复使用、活跃中心转化或医院扩张。
          touchpoints:
            - 待尽调事项
  - id: FR001
    title: 剩余风险与验证矩阵
    type: matrix
    summary: 基于证据的定性筛查显示，最大的验证负担在于临床证据、上市后安全性和资本获取，而不是证明每项不良结果都已发生。
    data:
      columns:
        - label: 可能性 / 证据信号
          note: 根据指定公开证据观察到、推断得出或未知
        - label: 潜在影响
          note: 风险确认后的投资影响
        - label: 缓释成熟度
          note: 有公开证据支持的缓释措施，不是管理层保证
      rows:
        - label: 临床结果透明度
