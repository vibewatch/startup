  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现可见度
        blocks:
          - type: paragraph
            body: >-
              现有报道将 Huihe 描述为心血管介入器械开发商、制造商和商业化公司，而不是经常性收入软件企业。据报道，2025 年 3 月取得的微创三尖瓣修复产品 NMPA
              批准，建立了潜在的产品到收入路径，但批准不等于发货、手术量、实际价格、报销回款或确认收入。一个资料页将医疗设备和用品制造列为行业，并报告 94 项专利；登记记录则显示公司拥有 II 类和 III
              类器械生产及销售许可。这些事实支持受监管的硬件商业化模式，但不能证明收入基础的规模或质量。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
