        title: 投资判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务案例更适合描述为受证据约束的商业化投资判断问题，而不是已被证明的增长或利润率故事。Huihe 拥有合理的受监管器械收入机制、据报道取得的产品批准、据报道完成的融资，以及包含 II 类和 III
              类生产销售许可的公司记录。反过来，指定证据无法证明收入规模、收入组合、实际价格、毛利转化、营运资金需求、客户集中度、现金跑道，或 IPO
              失败路径的财务影响。眼下的尽调重点，是建立一份可勾稽的月度模型，把手术量和器械数量连接到实际净价、毛利率、回款时间、库存与应收账款、固定研发和监管支出，以及融资跑道。
