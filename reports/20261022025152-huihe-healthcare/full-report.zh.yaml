          values:
            - label: Unknown
              tone: neutral
            - label: 确认后为高
              tone: negative
            - label: Unknown
              tone: neutral
        - label: IPO 与流动性获取
          note: 据报道撤回申请，且现金跑道未披露
          values:
            - label: 已观察到的获取事件
              tone: negative
            - label: 高
              tone: negative
            - label: 公开证据少
              tone: negative
        - label: 法律案件暴露
          note: 只有注册信息中的数量，没有案件实体审理结果
          values:
            - label: 中等信号
              tone: warning
            - label: 待审查，中等
              tone: warning
            - label: Unknown
              tone: neutral
        - label: 投资者与渠道依赖
          note: 据称拥有战略资源；集中度未披露
          values:
            - label: 中
              tone: warning
            - label: 中到高
              tone: warning
            - label: 中
