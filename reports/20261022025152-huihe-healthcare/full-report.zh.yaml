  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、商业模式与临床平台
        blocks:
          - type: paragraph
            body: >-
              公开登记信息和公司报道显示，Huihe 是一家总部位于上海、成立于 2019
              年的心血管介入器械开发商。报道称其模式涵盖结构性心脏病及其他介入器械的研发、制造与商业化，而不是软件或服务业务。最有力的外部临床记录来自 Shanghai Huihe Medical Technology
              Co., Ltd. 赞助的 TriStar 研究；ClinicalTrials.gov 将其描述为一项单组介入研究，评估 K-Clip 经导管三尖瓣环成形系统治疗重度或更严重三尖瓣反流，预计入组 67 人；截至
              2022 年 4 月最近更新时，状态为尚未招募。随后一篇同行评审报告分析了同一研究的 96 名患者，并报告 97.9%
              的植入成功率，但这些结果不能视为公司整体商业化进展。由此，公司拥有可追溯的临床锚点，但更广泛的产品组合以及各产品的收入贡献仍是开放问题。
