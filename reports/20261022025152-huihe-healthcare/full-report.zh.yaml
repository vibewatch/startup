  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - K-Clip 完成开发，证明收益持久，获得监管放行，并实现医院重复采用。
        - 只有在收入、利润率、稀释和可比倍数输入披露后，才能论证上行空间。
        - 临床失败、报销阻力、制造规模和稀释。
        - 低至中等；若干里程碑仍未核实。
      - - 基准
        - 临床进展继续，但商业化与融资仍不确定。
        - 估值应以里程碑为基础，不应将未披露收入或估值资本化。
        - 结果延迟、资本密集度和医院转化缓慢。
        - 中等；与当前公开证据一致。
      - - 悲观
        - 结果延迟或疲弱，监管 / 商业里程碑推迟，或融资条款具有惩罚性。
        - 下行包括稀释、较低融资参考点或战略选择权丧失。
        - 安全性、疗效、法律 / 公司治理和流动性风险。
        - 重大；试验规模小且没有发布结果。
      - - 尽调门槛
        - 取得试验结果、监管状态、融资文件、使用情况、定价和财务报表。
        - 在核心输入核实前，没有可辩护的目标区间。
        - 证据仍属私有或相互矛盾。
        - 投资级估值前必须完成。
    notes: 这些是条件式情景信号，不是概率或估值估计；该证据池没有公开估值输入可支持数值区间。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
