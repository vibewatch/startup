  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户流程
        blocks:
          - type: paragraph
            body: >-
              Huihe 的产品用于专业心血管和介入流程，而不是作为通用软件平台销售。官方产品页将 K-Clip 描述为用于三尖瓣反流的经导管三尖瓣环成形系统，采用微创血管穿刺方式，并称平均手术时间为 30 分钟。页面还列出
              C-Wave 外周及冠脉血管内碎石系统、用于经动脉化疗栓塞的 Vispearl 栓塞微球，以及 S-wan 可调式输送鞘。产品页将 C-Wave 和 S-wan 的开发归于 Huihe 子公司 Zhonghui
              Medical 或 H&H Medical，并指出冠脉 C-Wave 系统于 2024 年、S-wan 于 2023 年取得 NMPA
              证书。这些是公司表面描述，因此买方应区分预期用途和注册情况，与已证明的结果、采用和实际手术经济性。
