        - Unknown
        - 如存在则为高
        - 没有公开证据
        - 潜在患者伤害与监管行动
        - 取得投诉、警戒、不良事件、召回和 CAPA 日志；若严重趋势未整改则退出
      - - 临床证据无法支撑商业化叙事
        - 高证据缺口可能性
        - 高
        - 据报道已获批准；当前公开结果不完整
        - 采用与适应症扩展假设仍很脆弱
        - 核对试验记录、已批准标签、研究报告和真实世界结果
      - - 制造扩产或质量体系失效
        - 中等
        - 高
        - 公司称具备精密制造和自动化能力；缺少独立审计
        - 良率、供应商、灭菌和产能风险仍未量化
