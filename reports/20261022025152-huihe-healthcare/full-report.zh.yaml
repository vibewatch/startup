              临床记录比单独的营销页面提供了更多 K-Clip 运行机制细节。较早的 TriStar 记录描述了一项单组介入研究，预计入组 67 人，在超声心动图引导下经颈静脉 /
              上腔静脉路径定位夹子和锚定件，以缩小三尖瓣环周长。计划终点包括一年死亡率和三尖瓣反流分级变化，并在五年内增加超声心动图、功能和生活质量指标；记录称结果尚不可用。较新的 ClinicalTrials.gov
              记录正在招募预计 132 名参与者，开展与指南指导药物治疗的 2:1 随机比较，预计主要完成时间为 2027 年，研究完成时间为 2031 年。这一进展证明临床验证路径仍在推进，但不证明比较疗效或长期安全性。
