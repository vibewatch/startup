              - CM010
              - CM013
      - number: '2.3'
        title: 买方、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              初始经济买方是医院的结构性心脏病项目：多学科心脏团队筛选患者，医生操作器械；支付方最终决定手术能否突破早期采用者。试验入组标准将重度或更严重反流、症状或右心室功能受损，以及中高外科风险列为临床触发条件。这缩小了初始可服务人群，也让采用路径更清晰。采用还需要操作者培训、影像支持、导管室容量、采购审批、持久疗效证据和报销。随机研究的主动对照是指南指导的药物治疗，因此相对于持续保守治疗的临床和经济优势是核心门槛。证据尚未证明支付方覆盖、手术价格、重复使用频率或医院贡献利润，因此规模和估值敏感性仍未确定。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              最强的市场驱动力，是一条治疗不足且风险较高的患者路径：微创介入可与药物治疗和手术进行比较。临床证据正在改善：2024 年一年期研究报告 97.9% 的植入成功率以及三尖瓣反流分级持续下降，2023
              年研究报告短期功能改善。这些结果可以支持医生采用，但同一证据基础也暴露出限制：队列小、一项被引用研究由公司资助、需要长期随访、存在解剖和准入排除条件，以及没有公开报销或实际价格数据。因此，市场判断应把监管和临床去风险与商业渗透分开估值。在公开证据把适合治疗患者数量连接到付费手术和医院重复使用之前，市场更支持继续研究，而不是支持量化增长假设。
            claimRefs:
              - CM006
              - CM007
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场在临床上清晰，但商业规模尚未量化
            body: 指定证据支持一个明确的结构性心脏病应用场景和可见的临床采用路径，但不足以支持数字化市场规模主张。下一步投资判断应取得手术量、报销、实际 ASP、适合治疗患者的转化率和医院经济性。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM013
              - CM015
          - type: callout
            title: 临床进展不等于商业渗透
            body: K-Clip 队列虽小且在改善，降低了技术不确定性，但不能证明支付方覆盖、医院重复需求、定价能力或市场份额分母。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与临床替代方案
        blocks:
          - type: paragraph
            body: >-
              Huihe 的主要竞争领域是重度三尖瓣反流的经导管治疗，但买方选择并不只是器械之间的比较。当前试验记录描述了一项随机比较：Huihe
              的经导管三尖瓣夹闭系统加指南指导的药物治疗，对比单独的指南指导药物治疗，预计入组 132
              人，并观察一年期复合终点。这使药物管理成为真正的现状对照，而不是无关紧要的退路。手术和其他经导管修复方式仍是临床上合理的替代方案，但指定来源没有为每个竞争者提供当前且可直接比较的价格、安全性或疗效数据。因此，Huihe
              拥有产品类别定位和临床开发路径，但尚未证明在该品类中形成垄断。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP008
              - CP015
      - number: '3.2'
        title: 能力、证据与分销比较
        blocks:
          - type: paragraph
            body: >-
              公开差异化最强的部分在于手术流程和平台能力。一篇 PubMed 报告显示，39 名中高外科风险患者均成功植入 K-Clip，且所有患者在 30 天时三尖瓣反流至少下降一个等级；报告同时披露该研究由 Huihe
              资助。这是有用的临床证明，但不是独立的正面基准。2026 年 ClinicalTrials.gov 记录显示，公司正推进一项多中心随机研究；如果完成并公布结果，比较可信度可能提高。相比之下，Insight
              Lifetech 展示了相邻的心血管器械模式：拥有 11 款已上市产品，覆盖 IVUS、FFR、血管通路和电生理，并完成
              IPO。其披露说明，产品广度、监管里程碑和融资渠道可以增强分销和平台韧性，但不能证明其在三尖瓣修复上更优。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP011
              - CP014
      - number: '3.3'
        title: 护城河持久性、切换成本与反向证据
        blocks:
          - type: paragraph
            body: >-
              Huihe
              的潜在护城河来自临床流程、器械递送和制造诀窍、医生培训、监管证据，以及医院和融资渠道准入。中心采用一套流程后，这些资产可能形成切换摩擦，但指定证据没有量化培训时间、重复使用率、医院采购集中度、报销实现率或合同锁定。公开记录还包含反向尽调信号：一份企业信息页面报告五条立案记录、六条开庭通知和三条诉讼关系，但未解释其内容或结果。另一篇由
              Synapse 托管的文章称，Huihe
              在被选中接受现场检查后撤回了科创板申请，但指定证据池不含交易所一手记录或撤回理由。这些是尽调线索，不是违规证明。因此，竞争持久性取决于长期结果、监管执行、医生采用，以及现有企业或更广泛的心血管平台能否复制其临床流程。融资新闻和公司或分销商的描述支持战略势头，但不应当作持久护城河的独立证据。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP008
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: paragraph
            body: >-
              展示项将观察到的证据与公司或赞助方发布的定位分开。定价、合同条款、客户集中度和竞争对手临床结果未知，属于有意保留的缺口。临床试验仍在招募，观察性证据由公司资助，因此两者都不能替代竞争对手控制的基准。买方或投资者应在赋予持久竞争溢价前，索取可比总手术成本、按适应症拆分的报销、中心级使用量、不良事件随访，以及可重复采用的证据。
            claimRefs:
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 临床概念成立，下一步证据路径可信
            body: Huihe 已有获批的 K-Clip 产品和一项正在招募的多中心随机研究，为公司从早期观察性证据走向比较验证提供了路径。
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: 差异化尚未成为已验证的护城河
            body: 公开来源没有证明实际定价、医院份额、重复使用经济性、长期结果或正面比较优势，因此竞争溢价仍取决于后续证据。
            calloutType: risk
            claimRefs:
              - CP010
              - CP014
              - CP015
          - type: callout
            title: 评估证据和渠道转化，而非宣传定位
            body: 下一步尽调应测试中心级采用、报销、总手术成本，以及相对于药物治疗、手术和明确列出的经导管竞争者的比较结果。
            calloutType: recommendation
