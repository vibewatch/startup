              两篇 2025 年 12 月的报道称，公司完成了数亿元人民币的 D 轮或 D 轮融资，由 Taiping Medical Health Fund 领投，Sherpa Healthcare Partners
              继续参与。由于报道未说明确切融资额、投后估值、证券类型或现金余额，这轮融资只能证明据报道发生了融资活动，不能证明估值或可用现金。工商登记摘录显示公司 2019 年成立、地址位于上海松江、有 94
