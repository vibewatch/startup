  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Huihe 的平台投资逻辑成立于一定可能性：公司描述了覆盖输送系统、精密制造、仿真建模和自动化生产的能力，而公开试验记录确认 K-Clip
              正被研究为治疗中重度或更严重三尖瓣反流的介入方案。心血管疾病在中国造成的负担很大，因此临床目标具有商业相关性，但疾病负担不等于器械收入或报销。反向逻辑在于证据深度：ClinicalTrials.gov
              报告了一项预计入组 10 人的单组可行性研究，尚未公布结果，因此产品市场匹配、安全性、持久性和定价仍未经证明。若估值假设快速规模化，就会对试验完成、监管批准、医院采用和现金需求高度敏感。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              指定证据无法独立证明 Huihe
              最近一轮融资的规模、投后估值、资金用途、资本结构、清算优先权、收入或利润率。公司来源和登记类来源提供经营与公司层面的信号，但不能替代股权结构表或经审计财务报表。一篇关于另一家中国心血管器械发行人的融资报道显示
              IPO 可以提供市场参考，但它不是可直接类比的 Huihe
              估值；在收入、增长、产品组合和批准状态未经标准化前，也不应把它用作估值倍数。入场纪律应以里程碑为基础：先核实监管状态和结果，再用已披露价格和稀释模型评估采用和单位经济性。在这些输入可用前，给出精确目标价只会制造虚假的精确感。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求 K-Clip
              开发成功、临床获益持久、取得监管批准、医院重复使用，以及避免惩罚性稀释的融资路径。基准情景是一个技术上可信但仍处临床阶段的平台，其价值取决于更多证据和资本。悲观情景则是证据包能力不足或延迟，再叠加商业化摩擦、融资压力，或不利的公司
              /
              法律发现。试验记录的预计主要完成日期和未公布结果，使下一步尽调变得可观察而非投机：取得当前方案状态、结果、监管申报、融资文件和医院层面使用量。指定来源没有证明退出准备度；在为激进终局结果支付估值前，投资者应要求一条有文件支持的战略合作、IPO
              或产生现金规模化路径。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV009
              - CV012
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律
            body: 继续研究：公开记录支持期权价值，但不支持已验证价格。在评估更高估值前，要求临床、监管、融资和商业化证据。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV012
