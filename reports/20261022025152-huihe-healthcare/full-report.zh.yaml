      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开报道称，Huihe 于 2025 年 12 月完成数亿元人民币的 D 轮融资，由 Taiping Healthcare Fund 作为战略投资者，现有股东跟投。登记记录另显示，Huihe 在 2025
              年年报记录中仍是有 94 名员工的非上市经营公司，并记录了 2026 年 9 月 IPO 申请终止，以及随后 2026 年 10 月撤回 IPO
              现场检查通知。这些来源均未披露融资额、投后估值、现金余额、经营烧钱速度、债务、项目融资义务或现金跑道。因此，融资只能证明公司有资本获取能力，不能证明有可用于运营的现金或足够的现金跑道。
