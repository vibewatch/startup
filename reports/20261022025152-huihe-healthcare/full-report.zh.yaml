      - number: '1.3'
        title: 里程碑、治理与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              证据链从 2019 年成立、2021 年登记 TriStar 研究，延伸到研究于 2022 年更新状态、2024 年发表一年期结果、据报道于 2025 年 3 月取得产品批准，以及 2025 年 12 月完成 D
              轮融资。这是一条有意义的开发路径，但不能替代当前监管产品组合或销售台账。指定的反向来源报道称，Huihe 于 2026 年 9 月撤回了科创板申请，原计划融资 RMB1.11
              billion，用于生产、新产品开发、海外临床工作和营运资金；该报道还指出，产品销售疲弱和研发支出高企可能推迟盈利。竞争对手发布的公告称，另一家中国心血管器械公司 Insight Lifetech 于 2026
              年 2 月完成科创板上市；这可作为退出路径背景，但不能证明 Huihe 本可完成上市。登记摘录列出五条立案记录、六条开庭通知和三条诉讼关系，但案件细节不足以评估重要性。当前 CEO
              继任、董事会独立性、融资条款、逐产品监管状态，以及 IPO 撤回的商业影响，均需查阅一手文件。
