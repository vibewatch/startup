              - CR016
      - number: '7.2'
        title: 监管、临床与法律风险
        blocks:
          - type: paragraph
            body: >-
              公开临床登记对研究层面的状态已经过时，但仍有参考价值。NCT05173233 显示 NOT_YET_RECRUITING，最近更新为 2022 年 4 月，预计入组 67 人，预计完成时间为 2027 年 5
              月，且没有公布结果。NCT05770648 显示 UNKNOWN 状态，已知最近状态为 NOT_YET_RECRUITING，更新于 2023 年 3 月，也没有公布结果。这些记录并不否定据报道取得的 NMPA
              批准；相反，它们要求在登记、研究执行和商业说法之间进行勾稽。另据 AiQicha
              报告，立案、开庭和诉讼关系数量均有记录，但没有案件实体信息。否决标准是存在重大未披露的监管执法、安全、知识产权或产品责任事项，或无法把获批适应症与当前临床和上市后证据对应起来。
