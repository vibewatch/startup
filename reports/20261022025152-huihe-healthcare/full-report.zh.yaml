      - number: '4.2'
        title: 定价、销售动作与单位经济性
        blocks:
          - type: paragraph
            body: >-
              指定来源中没有任何可靠来源提供 Huihe
              的目录价、合同价、经销商毛利、医院招标价、手术层面的报销实现率、销售周期、获客成本、回本周期、毛利率或服务交付成本。因此，最稳妥的判断是分阶段商业化模式：临床采用、医院准入、医生培训、监管覆盖，以及耗材或植入物使用量共同决定收入转化。对标公司展示了心血管器械企业如何强调临床证据、培训、销售代表和商业化植入物，但这些只是行业经营信号，不是
              Huihe 的专项指标。在管理层提供客户队列和合同证据前，财务投资判断应把 Huihe 的所有单位经济性输入视为不可用。
