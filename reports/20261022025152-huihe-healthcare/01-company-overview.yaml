  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: funding-gap
      missingEvidence: "Primary Series D closing announcement, term sheet, cap table, exact proceeds, post-money valuation, and cash balance."
      whyItMatters: "A financing headline cannot establish valuation, dilution, or the resources available to complete clinical and manufacturing plans."
      diligencePath: "Request signed financing documents, investor confirmation, latest management accounts, and a sources-and-uses schedule."
      relatedQuestionRefs: [QO004]
    - type: missing-source
      severity: material
      topic: commercial-scale-gap
      missingEvidence: "Audited revenue, product-level shipments, customer and hospital counts, reimbursement realization, gross margin, and runway."
      whyItMatters: "Clinical evidence and headcount do not demonstrate repeatable commercial demand or economic durability."
      diligencePath: "Obtain monthly revenue and shipment cohorts, top-customer concentration, receivables aging, and cash forecast under base and downside cases."
      relatedQuestionRefs: [QO006, QO009]
    - type: missing-source
      severity: material
      topic: governance-gap
      missingEvidence: "Current executive biographies, founder roles, board committees, independence, and succession plan."
      whyItMatters: "The registry names personnel but does not show whether the company has sufficient operating and governance depth for a regulated global-device business."
      diligencePath: "Request the current organization chart, board minutes, committee charters, biographies, and key-person continuity plan."
      relatedQuestionRefs: [QO005]
    - type: access-blocked
      severity: material
      topic: adverse-ipo
      missingEvidence: "Primary exchange notice, prospectus withdrawal explanation, and updated financing or listing strategy."
      whyItMatters: "The reported IPO withdrawal may reflect timing, diligence, market conditions, or substantive readiness issues; secondary reporting cannot distinguish them."
      diligencePath: "Obtain the exchange disclosure, sponsor correspondence, latest prospectus version, and management explanation."
      relatedQuestionRefs: [QO008, QO010]
    - type: enumeration-incomplete
      severity: material
      topic: leadership-and-founder-table
      missingEvidence: "Complete current leadership and director enumeration with biographies and founder-market-fit evidence."
      whyItMatters: "The table is based on a commercial registry snapshot and may omit changes or key technical and commercial leaders."
      diligencePath: "Reconcile the registry against current corporate filings, employment records, and investor board materials."
      relatedTableRefs: [TO002, TO003]
      relatedQuestionRefs: [QO005]
    - type: missing-source
      severity: minor
      topic: product-portfolio
      missingEvidence: "Current product-by-product regulatory status, manufacturing sites, and commercial launch dates beyond K-Clip."
      whyItMatters: "Portfolio breadth and regulatory maturity determine whether Huihe is a single-product clinical story or a scalable platform."
      diligencePath: "Request the product master, NMPA certificates, overseas registrations, manufacturing licenses, and launch plan."
      relatedQuestionRefs: [QO001, QO007]
