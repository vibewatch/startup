company:
  name: Huihe Healthcare
chapter:
  number: 1
  title: Company Overview
  summary: Huihe Healthcare is a Shanghai cardiovascular-device company founded in 2019 whose disclosed platform centers on structural-heart intervention, especially the K-Clip transcatheter tricuspid annuloplasty system. The evidence supports clinical activity and a reported December 2025 Series D, but proceeds, valuation, revenue, customer concentration, and current leadership depth remain incompletely disclosed.
sections:
  - id: identity-and-platform
    title: Identity, business model, and clinical platform
    body: >-
      Public registry and company-related reporting identify Huihe as a Shanghai-based
      cardiovascular-intervention device developer founded in 2019. The reported model
      combines research, manufacturing, and commercialization of structural-heart and
      other interventional devices, rather than a software or services business. The
      strongest external clinical record is the TriStar study sponsored by Shanghai Huihe
      Medical Technology Co., Ltd.; ClinicalTrials.gov describes a single-group,
      interventional study of the K-Clip transcatheter tricuspid annuloplasty system for
      severe or worse tricuspid regurgitation, with estimated enrollment of 67 and a
      status of not yet recruiting when last updated in April 2022. A later peer-reviewed
      report of the same study analyzed 96 patients and reported a 97.9% implantation
      success rate, but those outcomes should not be treated as company-wide commercial
      traction. The company therefore has a traceable clinical anchor, while its broader
      product portfolio and revenue contribution by product remain open questions.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: capital-and-scale
    title: Capitalization and operating scale
    body: >-
      Two December 2025 reports describe completion of a Series D or D-round financing
      worth hundreds of millions of yuan, led by Taiping Medical Health Fund with
      continued participation from Sherpa Healthcare Partners. Because the reports do not
      state the exact proceeds, post-money valuation, security, or cash balance, the round
      is evidence of reported financing activity rather than a verified valuation or
      available-cash figure. A business-registry extract gives a 2019 incorporation date,
      a Songjiang, Shanghai address, 94 insured employees, and named legal and board
      personnel, but it is a commercial database rather than an audited filing and its
      snapshot date is not explicit. No assigned source provides current revenue, ARR,
      gross margin, runway, customer count, installed base, or a complete cap table.
      Those omissions materially limit an investor's ability to distinguish research
      scale from commercial scale.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
    tableRefs:
      - TO002
      - TO003
  - id: milestones-and-open-risks
    title: Milestones, governance, and diligence gaps
    body: >-
      The evidence trail runs from the 2019 founding and the 2021 registration of the
      TriStar study to the study's 2022 status update, 2024 publication of one-year
      outcomes, the reported March 2025 product approval, and the December 2025 Series D.
      This is a meaningful development sequence, but it is not a substitute for a
      current regulatory portfolio or sales ledger. The assigned adverse source reports
      that Huihe withdrew a planned STAR Market application in September 2026 and had
      planned to raise RMB 1.11 billion for production, new-product development,
      overseas clinical work, and working capital; that report also repeats a risk that
      weak product sales and high R&D spending could delay profitability. A
      competitor-issued release reports that Insight Lifetech, another Chinese
      cardiovascular-device company, completed a STAR Market listing in February 2026;
      that is useful exit-path context, not evidence that Huihe could have completed its
      own listing. A registry
      extract lists five case-filing records, six hearing notices, and three litigation
      relationships, without enough case detail to assess materiality. Current CEO
      succession, board independence, financing terms, product-by-product regulatory
      status, and the commercial effect of the IPO withdrawal require primary documents.
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO011
    figureRefs: []
callouts:
  - calloutType: strength
    title: Clinical anchor is visible
    body: The K-Clip program has a registered sponsor record and a peer-reviewed one-year outcomes publication, providing more than a purely promotional product narrative.
    claimRefs:
      - CO003
      - CO004
  - calloutType: risk
    title: Financing is reported, not fully underwritten
    body: The Series D reports establish a round and lead investor, but not exact proceeds, valuation, security terms, or cash available; the 2026 IPO withdrawal adds a separate exit and funding-path risk.
    claimRefs:
      - CO006
      - CO007
      - CO013
  - calloutType: recommendation
    title: Request primary corporate and regulatory records
    body: Before underwriting scale, obtain the current cap table, audited financials, product approvals, IPO withdrawal filing, litigation dockets, and a product-level customer and revenue bridge.
    claimRefs:
      - CO009
      - CO010
      - CO015
