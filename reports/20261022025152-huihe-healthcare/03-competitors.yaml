      - [Guideline-directed medical therapy, status quo, patients with severe tricuspid regurgitation managed medically, "ClinicalTrials.gov lists medical therapy as the active comparator in Huihe's randomized trial", "Not a device substitute for every patient; comparative clinical result is not yet available"]
      - [Surgical tricuspid repair, invasive alternative, high-risk or operable patients evaluated by a heart team, "Clinical trial eligibility requires heart-team assessment of surgical risk and expected benefit from edge-to-edge repair", "No assigned source supplies current procedure cost, outcomes, or selection thresholds for surgery"]
      - [Other transcatheter tricuspid repair systems, direct/adjacent devices, structural-heart centers, "PubMed identifies other transcatheter approaches as an active field and cites related repair studies", "The assigned evidence does not support a current head-to-head ranking or price comparison"]
      - [Insight Lifetech, adjacent cardiovascular platform, hospitals performing precision coronary intervention, "PRNewswire reports 11 marketed products across IVUS, FFR, vascular access, and electrophysiology", "Coronary diagnosis and intervention are adjacent rather than direct tricuspid-repair competition"]
    notes: "Coverage is a source-constrained sample of clinically plausible alternatives and one adjacent platform; it is not an exhaustive global competitor census. Unknown cells are not zero or evidence of absence."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented alternatives and one adjacent cardiovascular platform available in the assigned 2026 refresh source pool"
    claimRefs: [CP001, CP002, CP003, CP007, CP008]
  - id: TP002
    title: Capability and buying-criteria comparison
    columns: [buying criterion, Huihe evidence, adjacent or incumbent signal, investor implication]
    rows:
      - [Clinical evidence, "39-patient single-center observational K-Clip study with 30-day outcomes", "ClinicalTrials.gov records a planned randomized multicenter study", "Evidence is promising but still dependent on future comparative readout"]
      - [Regulatory maturity, "Drugdu and ByDrug report NMPA approval in March 2025", "Insight Lifetech reports NMPA and CE MDR milestones for IVUS and FFR", "Approval is a threshold; it does not establish share or reimbursement"]
      - [Product breadth, "Sources describe cardiovascular intervention platforms and structural-heart products", "Insight Lifetech reports 11 marketed products in several cardiovascular categories", "Broader portfolios may cross-sell and absorb fixed commercial costs more effectively"]
      - [Distribution access, "China Taiping Healthcare Fund is described as bringing insurance-channel and medical-network resources", "No independent source quantifies hospital access for either company", "Channel leverage is plausible but unmeasured and company-issued"]
      - [Pricing and contracting, null, null, "List price, procedure economics, discounts, and hospital contracts remain evidence gaps"]
    notes: "Qualitative comparison only. No assigned source provides comparable realized price, gross margin, customer count, or hospital-level share."
    claimRefs: [CP005, CP006, CP008, CP011, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [offer, unit or contract model, public price, included capability, implication]
    rows:
      - [Huihe K-Clip, "Not disclosed", "Not disclosed", "Transcatheter annuloplasty device and delivery workflow", "Gross-to-net economics and reimbursement require diligence"]
      - [Huihe clipping system, "Investigational; commercial model not disclosed", "Not disclosed", "Clipping device plus guideline-directed medical therapy in the trial arm", "No current commercial pricing conclusion is supportable"]
      - [Guideline-directed medical therapy, "Drug regimen; exact regimen and payer terms not disclosed", "Not disclosed", "Active comparator in the randomized trial", "Sets a non-device adoption threshold, not a comparable device price"]
      - [Insight IVUS and FFR, "Product and procedure economics not disclosed", "Not disclosed", "Intravascular imaging and physiology systems", "Adjacent public-company scale does not establish direct price pressure"]
    notes: "No retained source discloses list price, realized price, discounts, contract terms, or reimbursement amounts. The table records evidence gaps and does not infer zeros."
    claimRefs: [CP001, CP008, CP014]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Huihe has a differentiated structural-heart focus, while evidence maturity and platform breadth remain less established than the adjacent listed comparator.
    data:
      xAxis:
        label: "Public evidence maturity (ordinal)"
        min: 1
        max: 5
        low: "Mention or no results"
        high: "Approved, marketed, or established"
        scale: ordinal
      yAxis:
        label: "Platform breadth and commercial optionality (ordinal)"
        min: 1
        max: 5
        low: "Single modality"
        high: "Multi-product platform"
        scale: ordinal
      points:
        - {label: "Huihe K-Clip", x: 4, y: 2, note: "Reported approval and early observational evidence; structural-heart focus"}
        - {label: "Huihe clipping system", x: 2, y: 2, note: "Recruiting randomized trial with no posted results"}
        - {label: "Medical therapy", x: 3, y: 1, note: "Established comparator in the registered randomized study; not a device platform"}
        - {label: "Surgical repair", x: 4, y: 2, note: "Established clinical alternative, but not directly comparable in the assigned evidence"}
        - {label: "Other transcatheter repair", x: 2, y: 3, note: "Active technology class; named rival metrics unavailable in the assigned pool"}
        - {label: "Insight Lifetech", x: 4, y: 5, note: "Adjacent cardiovascular platform with 11 marketed products and IPO disclosure"}
    approximationNotes: "Coordinates are analyst-assigned ordinal judgments, not measured performance, efficacy, revenue, market share, or valuation. X uses retained evidence from mention or no results through recruiting study, observational evidence, and approved, marketed, or established status; Y uses documented product breadth. Equal coordinates do not imply equivalent outcomes."
    claimRefs: [CP002, CP005, CP007, CP008, CP015]
callouts:
  - calloutType: strength
    title: Clinical concept with a credible next evidence step
    body: Huihe has an approved K-Clip product and a recruiting randomized multicenter study, giving the company a path from early observational evidence toward comparative validation.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Differentiation is not yet a verified moat
    body: Public sources do not establish realized pricing, hospital share, repeat-use economics, long-term outcomes, or head-to-head superiority, so the competitive premium remains conditional.
    claimRefs: [CP010, CP014, CP015]
  - calloutType: recommendation
    title: Underwrite evidence and channel conversion, not promotional positioning
    body: The next diligence step is to test center-level adoption, reimbursement, total procedure cost, and comparative outcomes against medical therapy, surgery, and named transcatheter rivals.
    claimRefs: [CP002, CP009, CP014]
