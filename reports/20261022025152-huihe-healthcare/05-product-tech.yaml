figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Huihe's public product and evidence stack runs from interventional devices through clinical
      validation and regulatory/commercial execution.
    data:
      layers:
        - label: Device portfolio
          detail: Publicly listed interventional devices and delivery assets.
          items:
            - name: K-Clip
              detail: Transcatheter tricuspid annuloplasty system
            - name: C-Wave
              detail: Peripheral and coronary intravascular lithotripsy systems
            - name: Vispearl
              detail: Radiopaque embolic microspheres for TACE
            - name: S-wan
              detail: Adjustable curved delivery sheath
        - label: Clinical mechanism and validation
          detail: Imaging-guided mechanism and registered clinical studies.
          items:
            - name: Imaging-guided access
              detail: Echocardiography-guided venous positioning is described for K-Clip
            - name: Clinical studies
              detail: Single-group and randomized study records are publicly registered
        - label: Regulatory and operating layer
          detail: Registration milestones, production platforms, and commercialization evidence.
          items:
            - name: NMPA milestones
              detail: Public page states milestones for K-Clip, coronary C-Wave, and S-wan
            - name: Production and commercialization
              detail: Public directory and financing coverage describe manufacturing and commercialization activity
        - label: Evidence and quality layer
          detail: Public registries define study designs and endpoints; quality-system evidence is not retained.
          items:
            - name: Trial endpoints
              detail: Mortality, regurgitation grade, functional measures, and quality-of-life measures are registered
            - name: Quality controls
              detail: Product-specific manufacturing and post-market controls remain a diligence gap
            - name: Capital-to-product execution
              detail: Planned IPO uses included production, product development, and overseas clinical work before the application was withdrawn
        - label: Deployment layer
          detail: Hospital adoption, support, reliability, and repeat-use evidence remain incomplete.
          items:
            - name: Physician workflow
              detail: Specialist teams and imaging-guided access are required by the documented use cases
            - name: Commercial repeatability
              detail: Public evidence does not provide installed-base or repeat-use denominators
        - label: Risk-review layer
          detail: Key technical risks requiring diligence before underwriting.
          items:
            - name: Reliability
              detail: Field-failure, complaint, and CAPA data are not publicly retained
            - name: Security and privacy
              detail: No product-specific cybersecurity or privacy control record is publicly retained
    approximationNotes: >-
      The stack is a reader-facing organization of documented product and process layers, not a
      claim that every layer is fully validated or vertically integrated.
    claimRefs: [CE001, CE003, CE005, CE006, CE009, CE011, CE012, CE015]
