  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: operating-risk
      missingEvidence: Audited quality-system, manufacturing-capacity, yield, lot-release, and field-performance records for each marketed or trial product.
      whyItMatters: Complex cardiovascular devices can fail underwriting despite strong clinical narratives if production consistency, reliability, or post-market controls are weak.
      diligencePath: Request ISO 13485 and NMPA quality records, manufacturing-site audit results, complaint and CAPA logs, field-failure rates, and sterilization validation.
      relatedQuestionRefs: [QE005, QE006, QE007, QE008]
    - type: private-evidence-only
      severity: material
      topic: product-commercialization
      missingEvidence: Hospital-level deployment, procedure volume, repeat-use, training burden, reimbursement realization, and customer support data.
      whyItMatters: Regulatory approval and trial registration do not show whether physicians adopt the devices economically or repeatedly.
      diligencePath: Obtain anonymized site-level utilization, reorder, procedure-time, conversion, and support-ticket cohorts with denominators and periods.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: cybersecurity
      missingEvidence: Product-specific privacy, cybersecurity, software, connectivity, and incident-control documentation.
      whyItMatters: The public product record does not show whether connected or data-generating components create additional hospital compliance or safety exposure.
      diligencePath: Request device software bills of materials, threat models, penetration-test summaries, incident history, and hospital security questionnaires.
      relatedQuestionRefs: [QE005, QE008]
    - type: stale
      severity: minor
      topic: clinical-maturity
      missingEvidence: Updated results and status for the earlier TriStar study, including completed enrollment and follow-up.
      whyItMatters: The retained registry snapshot is historical and explicitly lacks results, limiting assessment of the earlier validation step.
      diligencePath: Reconcile registry history with the sponsor's final clinical report and any peer-reviewed publication.
      relatedQuestionRefs: [QE004, QE005, QE008]
    - type: access-blocked
      severity: material
      topic: independent-technical-evidence
      missingEvidence: The assigned PubMed and VCBeat pages did not yield the underlying article text needed to assess K-Clip imaging practice or independently verify the C-Wave approval claim.
