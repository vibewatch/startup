  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Platform capability", "Company describes delivery, manufacturing, simulation, and automation capabilities.", "Independent product approvals, customer utilization, and repeat-order evidence."]
      - ["Clinical option value", "K-Clip is registered as an interventional single-group feasibility study.", "Posted safety, efficacy, and durability outcomes at meaningful follow-up."]
      - ["Large need", "China CVD burden is estimated at approximately 330 million affected individuals.", "Evidence linking the addressable burden to reimbursed, adoptable Huihe procedures."]
      - ["Capital-market risk", "Comparable Chinese cardiovascular-device financing and listing outcomes can reset entry references.", "Verified Huihe financing terms, cap table, and a credible liquidity path."]
    notes: "Rows combine company-issued, registry, medical-literature, and market-context evidence; comparability to Huihe is explicitly limited."
    claimRefs: [CV001, CV002, CV003, CV006]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "K-Clip completes development, demonstrates durable benefit, clears regulation, and achieves repeat hospital adoption.", "Upside can be justified only after revenue, margin, dilution, and comparable-multiple inputs are disclosed.", "Clinical failure, reimbursement friction, manufacturing scale, and dilution.", "Low-to-medium; several milestones remain unverified."]
      - [Base, "Clinical progress continues but commercialization and financing remain uncertain.", "Value should be milestone-based and should not capitalize undisclosed revenue or valuation.", "Delayed results, capital intensity, and slow hospital conversion.", "Medium; consistent with current public evidence."]
      - [Bear, "Results are delayed or weak, regulatory/commercial milestones slip, or financing terms are punitive.", "Downside includes dilution, a lower financing reference, or loss of strategic optionality.", "Safety, efficacy, legal/corporate, and liquidity risks.", "Material; the trial is small and has no posted results."]
      - [Diligence gate, "Obtain trial results, regulatory status, financing documents, utilization, pricing, and financial statements.", "No defensible target range until core inputs are verified.", "Evidence remains private or contradictory.", "Required before an investment-grade valuation."]
    notes: "These are conditional scenario signals, not probabilities or valuation estimates; no public valuation input in this pool supports numerical ranges."
    claimRefs: [CV009, CV010, CV011, CV012]

