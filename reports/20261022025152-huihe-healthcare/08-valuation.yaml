  name: Huihe Healthcare
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a technically credible cardiovascular-device platform and meaningful clinical-development option value, but it does not support underwriting the reported valuation with confidence. The appropriate stance is research-more until financing terms, commercialization, and trial outcomes are independently verified.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Huihe has a plausible platform thesis: the company describes capabilities spanning delivery
      systems, precision manufacturing, simulation modeling, and automated production, while the
      public trial record confirms that K-Clip is being studied as an interventional treatment for
      moderate-severe or worse tricuspid regurgitation. The clinical target is commercially
      relevant because cardiovascular disease imposes a large burden in China, but disease burden
      is not the same as device revenue or reimbursement. The anti-thesis is evidence depth:
      ClinicalTrials.gov reports a single-group feasibility study with an estimated enrollment of
      10 and no posted results, so product-market fit, safety, durability, and pricing remain
      unproven. A valuation that assumes rapid scale would therefore be sensitive to trial
      completion, regulatory clearance, hospital adoption, and cash needs.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: valuation-discipline
    title: Financing context and entry discipline
    body: >-
      The assigned evidence does not independently establish Huihe's latest round size,
      post-money valuation, proceeds, capitalization, liquidation preferences, revenue, or
      margins. Company and registry-style sources provide operating and corporate signals, but
      they are not substitutes for a cap table or audited financial statements. A financing
      report about another Chinese cardiovascular-device issuer shows that an IPO can provide a
      market reference, but it is not a directly comparable Huihe valuation and should not be
      used as a multiple without normalized revenue, growth, product mix, and approval status.
      Entry discipline should therefore be milestone-based: verify regulatory status and results,
      then underwrite adoption and unit economics using a disclosed price and dilution model.
      Until those inputs are available, a precise target price would create false precision.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV003]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: >-
      The bull case requires successful K-Clip development, durable clinical benefit, regulatory
      clearance, repeat hospital use, and a financing path that avoids punitive dilution. The base
      case is a technically credible but still clinical-stage platform whose value depends on
      additional evidence and capital. The bear case combines an underpowered or delayed evidence
      package with commercialization friction, financing pressure, or adverse corporate/legal
      findings. The trial record's estimated primary completion date and absence of posted results
      make the next diligence step observable rather than speculative: obtain the current protocol
      status, results, regulatory submissions, financing documents, and hospital-level utilization.
      Exit readiness is not demonstrated by the assigned sources; investors should require a
      documented path to strategic partnership, IPO, or cash-generative scale before paying for
      an aggressive terminal outcome.
    claimRefs: [CV009, CV010, CV011, CV012]
    figureRefs: [FV001]

