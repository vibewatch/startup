      - number: '5.3'
        title: Differentiation and operating risks
        blocks:
          - type: paragraph
            body: >-
              The plausible differentiation is a multi-product interventional platform and localized device development,
              not a publicly demonstrated software moat. A business-directory snapshot reports 165 patent records and
              111 registered trademarks, while describing four operating platforms covering delivery-system research and
              production, clinical technology, precision manufacturing, and global marketing; those descriptions are not
              an independent patent-quality or freedom-to-operate opinion. The financing report says K-Clip and C-Wave
              were being prepared for commercialization after a confirmatory clinical study in China. Separately, a 2026
              Synapse article reports that Huihe withdrew its STAR Market application after planning RMB 1.11 billion
              for production, product development, overseas clinical work, and working capital. A competitor-issued
              release says Insight Lifetech had 11 marketed products and China and CE MDR approvals for core systems,
              illustrating the proof burden for a scaled cardiovascular-device platform rather than independently
              benchmarking Huihe. Public evidence still omits manufacturing yield, field-failure, service,
              reimbursement, cybersecurity, and repeat-use data.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
