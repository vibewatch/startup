          value: Repeat hospital use
        - id: valuation
          label: Valuation
          value: Price only after inputs are verified
      edges:
        - - need
          - platform
        - - platform
          - trial
        - - trial
          - regulatory
        - - regulatory
          - adoption
        - - adoption
          - valuation
    claimRefs:
