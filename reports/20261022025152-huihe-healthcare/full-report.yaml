  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Huihe's public product and evidence stack runs from interventional devices through clinical validation and
      regulatory/commercial execution.
    data:
      layers:
        - label: Device portfolio
          detail: Publicly listed interventional devices and delivery assets.
          items:
            - name: K-Clip
              detail: Transcatheter tricuspid annuloplasty system
            - name: C-Wave
              detail: Peripheral and coronary intravascular lithotripsy systems
            - name: Vispearl
              detail: Radiopaque embolic microspheres for TACE
            - name: S-wan
              detail: Adjustable curved delivery sheath
        - label: Clinical mechanism and validation
          detail: Imaging-guided mechanism and registered clinical studies.
          items:
            - name: Imaging-guided access
              detail: Echocardiography-guided venous positioning is described for K-Clip
            - name: Clinical studies
              detail: Single-group and randomized study records are publicly registered
        - label: Regulatory and operating layer
          detail: Registration milestones, production platforms, and commercialization evidence.
          items:
            - name: NMPA milestones
              detail: Public page states milestones for K-Clip, coronary C-Wave, and S-wan
            - name: Production and commercialization
              detail: Public directory and financing coverage describe manufacturing and commercialization activity
        - label: Evidence and quality layer
          detail: Public registries define study designs and endpoints; quality-system evidence is not retained.
          items:
            - name: Trial endpoints
              detail: Mortality, regurgitation grade, functional measures, and quality-of-life measures are registered
            - name: Quality controls
              detail: Product-specific manufacturing and post-market controls remain a diligence gap
            - name: Capital-to-product execution
              detail: >-
                Planned IPO uses included production, product development, and overseas clinical work before the
                application was withdrawn
        - label: Deployment layer
          detail: Hospital adoption, support, reliability, and repeat-use evidence remain incomplete.
          items:
            - name: Physician workflow
              detail: Specialist teams and imaging-guided access are required by the documented use cases
            - name: Commercial repeatability
              detail: Public evidence does not provide installed-base or repeat-use denominators
        - label: Risk-review layer
          detail: Key technical risks requiring diligence before underwriting.
          items:
            - name: Reliability
              detail: Field-failure, complaint, and CAPA data are not publicly retained
            - name: Security and privacy
              detail: No product-specific cybersecurity or privacy control record is publicly retained
    approximationNotes: >-
      The stack is a reader-facing organization of documented product and process layers, not a claim that every layer
      is fully validated or vertically integrated.
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
      - CE009
      - CE011
      - CE012
      - CE015
  - id: FU001
    title: Customer journey from referral to expansion
    type: journey-map
    summary: >-
      Public evidence supports a specialist clinical journey from severe-TR referral through multidisciplinary procedure
      and follow-up, while commercial conversion and expansion remain unverified.
    data:
      items:
        - label: Referral
          title: Severe TR and high surgical risk
          description: Trial eligibility centers on severe or worse tricuspid regurgitation, symptoms, and elevated surgical risk.
          touchpoints:
            - Tertiary hospital referral
            - Heart-team screening
        - label: Evaluation
          title: Imaging and anatomy review
          description: Clinical records describe echocardiography, CTA or core-laboratory evaluation before implantation.
          touchpoints:
            - TEE/TTE
            - Multidisciplinary planning
        - label: Procedure
          title: K-Clip implantation
          description: >-
            The device is delivered through venous access with imaging guidance and one to three devices in reported
            studies.
          touchpoints:
            - Cardiology
            - Cardiac surgery
            - Anesthesia
        - label: Early outcome
          title: TR reduction and symptom review
          description: Published studies evaluate TR grade, NYHA class, walking distance, quality of life, and adverse events.
          touchpoints:
            - Echocardiography
            - 30-day follow-up
        - label: Durability
          title: Longer-term follow-up
          description: The TriStar publication reports one-year outcomes; registry protocols define longer follow-up measures.
          touchpoints:
            - Six-month review
            - One-year review
        - label: Expansion
          title: Repeat site use and regional referrals
          description: The assigned evidence does not disclose repeat utilization, active-site conversion, or hospital expansion.
          touchpoints:
            - Open diligence item
  - id: FR001
    title: Residual risk and validation matrix
    type: matrix
    summary: >-
      Qualitative evidence-based screening shows the largest validation burden in clinical evidence, post-market safety,
      and capital access rather than proving that each adverse outcome has occurred.
    data:
      columns:
        - label: Likelihood / evidence signal
          note: Observed, inferred, or unknown from assigned public evidence
        - label: Potential impact
          note: Investment impact if the risk is confirmed
        - label: Mitigation maturity
          note: Publicly evidenced mitigation, not management assurance
      rows:
        - label: Clinical-results transparency
          note: Stale public study updates and no posted results
          values:
            - label: High evidence gap
              tone: negative
            - label: High
              tone: negative
            - label: Low public evidence
              tone: negative
        - label: Post-market safety visibility
          note: No usable post-market dataset in the assigned pool
          values:
            - label: Unknown
              tone: neutral
            - label: High if confirmed
              tone: negative
            - label: Unknown
              tone: neutral
        - label: IPO and liquidity access
          note: Reported withdrawal plus undisclosed runway
          values:
            - label: Observed access event
              tone: negative
            - label: High
              tone: negative
            - label: Low public evidence
              tone: negative
        - label: Legal case exposure
          note: Registry counts without case merits
          values:
            - label: Medium signal
              tone: warning
            - label: Medium pending review
              tone: warning
            - label: Unknown
              tone: neutral
        - label: Investor and channel dependency
          note: Strategic resources are claimed; concentration is undisclosed
          values:
            - label: Medium
              tone: warning
            - label: Medium to high
              tone: warning
            - label: Medium
              tone: warning
        - label: Manufacturing scale-up capacity
          note: Broad platform claim with limited independent operating evidence
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: negative
            - label: Unknown
              tone: neutral
    approximationNotes: >-
      Qualitative categories synthesize cited public evidence and explicit gaps; they are not frequencies,
      probabilities, incident counts, or independently verified management controls.
    claimRefs:
      - CR009
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Clinical proof and commercialization milestones determine whether Huihe's platform option value can support an
      investable valuation.
    data:
