      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Public reporting says Huihe completed a D-round financing of several hundred million yuan in December
              2025, with Taiping Healthcare Fund as strategic investor and an existing shareholder following on. The
              registry record separately shows Huihe remained an operating, non-listed company with 94 employees in its
              2025 annual-report record, and it records an IPO application termination in September 2026 followed by an
              October 2026 IPO-site inspection withdrawal notice. None of these sources discloses proceeds, post-money
              valuation, cash balance, operating burn, debt, project-finance obligations, or runway. The financing
              therefore demonstrates access to capital, not cash available for operations or proof of adequate runway.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is better described as an evidence-constrained commercialization underwriting problem
              than as a demonstrated growth or margin story. Huihe has a plausible regulated-device revenue mechanism,
              reported product approval, a reported financing event, and a company record that includes Class II and
              Class III production and sales permissions. Conversely, the assigned evidence cannot establish revenue
              scale, revenue mix, price realization, gross-profit conversion, working-capital needs, customer
              concentration, cash runway, or the financial effect of the failed IPO path. The immediate diligence
              priority is a reconciled monthly model linking procedures and units to realized net price, gross margin,
              collection timing, inventory and receivables, fixed R&D and regulatory spend, and financing runway.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Huihe's products are used in specialist cardiovascular and interventional workflows rather than sold as a
              general-purpose software platform. The official product page describes K-Clip as a transcatheter tricuspid
              annuloplasty system for tricuspid regurgitation, with a minimally invasive vascular-puncture approach and
              an average procedure time stated as 30 minutes. It also lists C-Wave peripheral and coronary intravascular
              lithotripsy systems, Vispearl embolic microspheres for transarterial chemoembolization, and S-wan
              adjustable delivery sheaths. The product page attributes C-Wave and S-wan development to Huihe's
              subsidiary Zhonghui Medical or H&H Medical and identifies NMPA certificates for the coronary C-Wave system
              in 2024 and S-wan in 2023. These are company-surface descriptions, so a buyer should distinguish intended
              use and registration from demonstrated outcomes, adoption, and realized procedure economics.
            claimRefs:
              - CE001
