  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and clinical-use segmentation
        blocks:
          - type: paragraph
            body: >
              Huihe's customer is not a single entity. The immediate user is a structural-heart team operating in a
              hospital, while the economic buyer and clinical gatekeeper are shaped by the hospital's procurement,
              cardiac-center leadership, and multidisciplinary heart team. The 2022 TriStar registry describes patients
              with severe or worse tricuspid regurgitation who are at high surgical risk and expected to benefit from
              repair, while the 2026 randomized protocol broadens the intended population to adults with severe or
              greater disease and moderate or high surgical risk. This indicates a specialist, referral-driven workflow
              rather than a self-serve device sale. The Qingdao case shows the operational buying unit: cardiology,
              cardiac surgery, cardiac ultrasound, anesthesiology, and the operating room coordinated around one complex
              patient. China Med Device's summary of revised NMPA manufacturing rules and standards also makes
              quality-system compliance an ongoing procurement dependency. These sources do not establish recurring
              purchase volume, reimbursement realization, procurement cycle, or activated-hospital count.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
              - CU015
      - number: '6.2'
        title: Adoption trajectory and clinical proof
        blocks:
          - type: paragraph
            body: >
              The strongest public adoption signal is clinical use, not a reported revenue cohort. The peer-reviewed
              30-day study enrolled 39 intermediate- or high-risk patients and reported successful implantation in all
              cases, while the later TriStar publication reports 96 patients, a 97.9% implantation success rate, and
              one-year follow-up. These are meaningful proof points for physician willingness to use the system and for
              an evidence-generation pathway, but they should not be converted into active customers, paid accounts, or
              repeat utilization. The official trial record also shows that the earlier confirmatory study was sponsored
              by Huihe and had no results posted in the registry record; the later publication supplies results but
              remains a company-funded study. A newer 132-patient randomized trial was listed as recruiting in February
              2026, suggesting continued clinical expansion, yet its results are not available. The public record
              therefore supports procedural adoption and outcome evaluation, while leaving the commercial adoption
              curve, site activation pace, and repeat-case frequency unresolved.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.3'
        title: Named customer proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >
              Named proof is strongest where a source identifies a hospital, procedure, and patient-use context. Qingdao
              Municipal Hospital provides one detailed example involving a 70-year-old patient with severe comorbidity
              and a reported reduction in tricuspid regurgitation from 6+ to 3+ after three K-Clip devices. The VCBeat
              profile adds a company-reported global total of more than 300 clinical surgeries by December 2025 and says
              nearly 10% were overseas, but it is a secondary article that reproduces company-provided figures and does
              not disclose the denominator by hospital, paid status, repeat use, or follow-up completeness. The same
              source says K-Clip entered hospitals in the United States and Canada, which is a useful international
              reference signal but not proof of commercial scale. Evidence on retention, contract length, renewal,
              channel dependence, top-account concentration, and reimbursement is absent from the assigned pool. An
              investor should treat the customer base as clinically validated but commercially opaque until Huihe
              provides site-level utilization, paid-vs-sponsored case counts, and cohort retention.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Customer diligence priorities
        blocks:
          - type: paragraph
            body: >
              The customer case can support a research-more stance rather than a conclusion of durable commercial
              traction. Clinical outcomes and named hospital use reduce the risk that K-Clip is merely a laboratory
              concept, but the evidence does not establish how many hospitals have converted from evaluation to routine
              use or whether procedures generate attractive contribution margins after training, imaging, inventory, and
              support costs. The central diligence questions are operational: obtain a hospital-by-hospital installed
              and active-site list, monthly procedures and repeat utilization, paid versus trial cases, average selling
              price and gross margin by product, reimbursement and tender status, and the share of procedures
              attributable to the largest accounts or physician champions. A second layer should test durability using
              12- and 24-month site cohorts, adverse-event reporting, reintervention, physician learning curves, and
              reasons for inactive sites. Until those data are supplied, the public evidence supports clinical demand
              and early referenceability but not a quantified net-retention or concentration claim.
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implications
        blocks:
          - type: paragraph
            body: >-
              The evidence supports four priority diligence tracks. First, clinical-evidence execution is high impact
              because one sponsor-submitted K-Clip study still displays a 2022 update and no results, while a second
              record displays unknown status and no results; those records sit uneasily beside syndicated company claims
              of March 2025 approval and large-scale commercial use. Second, capital access is a high residual risk
              because an independent article reports a withdrawn RMB1.11 billion IPO plan, while the later Series D
              amount is described only as several hundred million renminbi and is not cash-availability evidence.
              Legal-case detail and partner concentration are material but presently less quantifiable. Investment
              should remain conditional on audited liquidity, current trial results, post-market surveillance,
              case-level legal review, and contract-level channel evidence.
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, clinical, and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The public clinical registry is useful but stale at the study level. NCT05173233 displays
              NOT_YET_RECRUITING, a last update in April 2022, estimated enrollment of 67, an estimated May 2027
              completion, and no posted results. NCT05770648 displays UNKNOWN status, a last-known NOT_YET_RECRUITING
              status, a March 2023 update, and no posted results. These records do not negate the reported NMPA
              approval; they instead create a reconciliation requirement between registration, study execution, and
              commercial claims. Separately, AiQicha reports filing, hearing, and litigation-relationship counts without
              case merits. The kill criterion is a material undisclosed enforcement, safety, IP, or product-liability
              matter, or inability to reconcile approved indications with current clinical and post-market evidence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR008
              - CR010
              - CR011
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR010
              - CR011
              - CR013
              - CR015
      - number: '7.3'
        title: Operational, quality, and technical execution
        blocks:
          - type: paragraph
            body: >-
              Huihe describes integrated research, manufacturing, commercialization, delivery-system,
              precision-manufacturing, simulation, and automated-production capabilities, but the reviewed homepage does
              not itself supply quality-system certificates, yield data, complaint trends, recall history, cybersecurity
              controls, or post-market event rates. That is a disclosure gap, not evidence that incidents are absent.
              Scale-up risk also matters because AiQicha reports 94 insured employees, a limited public workforce
              indicator relative to the breadth of the claimed platform. Mitigation should require site-level audit
              evidence, supplier qualification and dual-sourcing maps, lot-release and field-failure trends, validated
              manufacturing capacity, and named owners for medical-device security and vigilance. A serious unremediated
              quality finding or rising device-related event rate should break the thesis.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR013
      - number: '7.4'
        title: Capital, commercialization, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              The Series D adds financing support but should not be treated as disclosed cash on hand. VCBeat's
              company-sourced account identifies Taiping Healthcare Fund as strategic lead and Sherpa as a follow-on
              investor, while a second industry site reports only that proceeds were several hundred million renminbi.
              The same company-sourced account says the investors bring insurance channels and medical-institution
              resources, creating potential channel value and dependency at the same time. A competitor's 2026 STAR
              Market listing demonstrates that a public exit can be available to scaled Chinese cardiovascular-device
              companies, but it is not a benchmark proving Huihe's readiness. Require bank-verified cash, monthly burn,
              runway, financing terms, channel contracts, customer concentration, reimbursement evidence, and a funded
              plan independent of any renewed IPO before underwriting expansion.
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial approval does not close the evidence gap
            body: >-
              The reported March 2025 approval and commercial use must be reconciled with stale public trial statuses,
              missing posted results, and unavailable post-market safety metrics before adoption or durability
              assumptions are underwritten.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR013
          - type: callout
            title: Gate capital on four document rooms
            body: >-
              Require clinical and vigilance files, audited liquidity and financing terms, case-level legal records, and
              partner/customer contracts. Any material undisclosed safety, regulatory, accounting, or liquidity defect
              should stop the process.
            calloutType: recommendation
            claimRefs:
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Huihe has a plausible platform thesis: the company describes capabilities spanning delivery systems,
              precision manufacturing, simulation modeling, and automated production, while the public trial record
              confirms that K-Clip is being studied as an interventional treatment for moderate-severe or worse
              tricuspid regurgitation. The clinical target is commercially relevant because cardiovascular disease
              imposes a large burden in China, but disease burden is not the same as device revenue or reimbursement.
              The anti-thesis is evidence depth: ClinicalTrials.gov reports a single-group feasibility study with an
              estimated enrollment of 10 and no posted results, so product-market fit, safety, durability, and pricing
              remain unproven. A valuation that assumes rapid scale would therefore be sensitive to trial completion,
              regulatory clearance, hospital adoption, and cash needs.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not independently establish Huihe's latest round size, post-money valuation,
              proceeds, capitalization, liquidation preferences, revenue, or margins. Company and registry-style sources
              provide operating and corporate signals, but they are not substitutes for a cap table or audited financial
              statements. A financing report about another Chinese cardiovascular-device issuer shows that an IPO can
              provide a market reference, but it is not a directly comparable Huihe valuation and should not be used as
              a multiple without normalized revenue, growth, product mix, and approval status. Entry discipline should
              therefore be milestone-based: verify regulatory status and results, then underwrite adoption and unit
              economics using a disclosed price and dilution model. Until those inputs are available, a precise target
              price would create false precision.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case requires successful K-Clip development, durable clinical benefit, regulatory clearance,
              repeat hospital use, and a financing path that avoids punitive dilution. The base case is a technically
              credible but still clinical-stage platform whose value depends on additional evidence and capital. The
              bear case combines an underpowered or delayed evidence package with commercialization friction, financing
              pressure, or adverse corporate/legal findings. The trial record's estimated primary completion date and
              absence of posted results make the next diligence step observable rather than speculative: obtain the
              current protocol status, results, regulatory submissions, financing documents, and hospital-level
              utilization. Exit readiness is not demonstrated by the assigned sources; investors should require a
              documented path to strategic partnership, IPO, or cash-generative scale before paying for an aggressive
              terminal outcome.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV009
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline
            body: >-
              Research-more: the public record supports option value, not a verified price. Require clinical,
              regulatory, financing, and commercialization evidence before underwriting a higher valuation.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV012
