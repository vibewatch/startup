chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and clinical platform
        blocks:
          - type: paragraph
            body: >-
              Public registry and company-related reporting identify Huihe as a Shanghai-based
              cardiovascular-intervention device developer founded in 2019. The reported model combines research,
              manufacturing, and commercialization of structural-heart and other interventional devices, rather than a
              software or services business. The strongest external clinical record is the TriStar study sponsored by
              Shanghai Huihe Medical Technology Co., Ltd.; ClinicalTrials.gov describes a single-group, interventional
              study of the K-Clip transcatheter tricuspid annuloplasty system for severe or worse tricuspid
              regurgitation, with estimated enrollment of 67 and a status of not yet recruiting when last updated in
              April 2022. A later peer-reviewed report of the same study analyzed 96 patients and reported a 97.9%
              implantation success rate, but those outcomes should not be treated as company-wide commercial traction.
              The company therefore has a traceable clinical anchor, while its broader product portfolio and revenue
              contribution by product remain open questions.
