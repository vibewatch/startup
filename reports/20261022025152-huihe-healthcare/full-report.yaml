      - number: '1.3'
        title: Milestones, governance, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence trail runs from the 2019 founding and the 2021 registration of the TriStar study to the
              study's 2022 status update, 2024 publication of one-year outcomes, the reported March 2025 product
              approval, and the December 2025 Series D. This is a meaningful development sequence, but it is not a
              substitute for a current regulatory portfolio or sales ledger. The assigned adverse source reports that
              Huihe withdrew a planned STAR Market application in September 2026 and had planned to raise RMB 1.11
              billion for production, new-product development, overseas clinical work, and working capital; that report
              also repeats a risk that weak product sales and high R&D spending could delay profitability. A
              competitor-issued release reports that Insight Lifetech, another Chinese cardiovascular-device company,
              completed a STAR Market listing in February 2026; that is useful exit-path context, not evidence that
              Huihe could have completed its own listing. A registry extract lists five case-filing records, six hearing
              notices, and three litigation relationships, without enough case detail to assess materiality. Current CEO
              succession, board independence, financing terms, product-by-product regulatory status, and the commercial
              effect of the IPO withdrawal require primary documents.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
              - CO011
