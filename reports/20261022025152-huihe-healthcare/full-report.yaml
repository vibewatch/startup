      - number: '5.2'
        title: Clinical mechanism and maturity
        blocks:
          - type: paragraph
            body: >-
              The clinical record provides more detail on K-Clip's operating mechanism than the marketing page alone.
              The earlier TriStar record describes a single-group interventional study with an estimated enrollment of
              67, using echocardiography guidance and a jugular-vein/superior vena-cava route to position a clamp and
              anchor that reduce the tricuspid-annulus perimeter. Its planned endpoints include one-year mortality and
              change in tricuspid-regurgitation grade, with additional echocardiographic, functional, and
              quality-of-life measures through five years; the record states that results were not available. A newer
              ClinicalTrials.gov record is recruiting an estimated 132 participants in a randomized 2:1 comparison
              against guideline-directed medical therapy, with an estimated primary completion in 2027 and study
              completion in 2031. This progression is evidence of a continuing clinical-validation path, not proof of
              comparative efficacy or long-term safety.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
