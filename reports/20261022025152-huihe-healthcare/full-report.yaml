      - number: '4.2'
        title: Pricing, sales motion, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No assigned successful source provides a Huihe list price, contract price, distributor margin, hospital
              tender price, procedure-level reimbursement realization, sales-cycle duration, customer-acquisition cost,
              payback period, gross margin, or service-delivery cost. The most defensible view is therefore a staged
              commercialization model in which clinical adoption, hospital access, physician training, regulatory
              coverage, and consumable or implant utilization determine revenue conversion. Comparator surfaces show how
              cardiovascular-device companies emphasize clinical evidence, training, sales representatives, and
              commercial implants, but those are industry operating signals rather than Huihe-specific metrics.
              Financial underwriting should treat every Huihe unit-economics input as unavailable until management
              supplies cohort and contract evidence.
            claimRefs:
