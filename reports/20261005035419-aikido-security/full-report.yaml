      - number: '3.2'
        title: Capability Breadth Versus Detection Depth
        blocks:
          - type: paragraph
            body: >
              Aikido's strongest documented proposition is consolidation: one workflow spanning several
              application-security domains, with company-claimed AI triage, reachability, and automated remediation. A
              competitor describes much of the model as orchestration and de-duplication over established open-source
              scanners; another competitor argues that direct-dependency reachability, large-repository performance, and
              enterprise controls become constraints at scale. These are relevant adverse hypotheses, not independent
              technical findings. RFP.wiki likewise describes broad AST coverage while advising buyers to validate
              advanced testing depth and integration maturity on their own stack. A proof of concept should therefore
              measure coverage, scan latency, false-positive disposition, transitive reachability, and remediation
              acceptance on identical repositories. Until such a benchmark exists, neither Aikido's claimed noise
              reduction nor competitors' superiority claims should be treated as verified comparative performance.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
