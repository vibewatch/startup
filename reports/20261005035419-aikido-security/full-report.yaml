            body: >-
              Commercial traction for Aikido accelerated sharply through fiscal 2025, culminating in private comp
              reports recording approximately $13 million in annual revenue alongside five-fold year-over-year revenue
              growth. Company announcements confirm that its active customer base nearly tripled over the same period,
              reaching more than 100,000 teams registered or using the platform globally across freemium and commercial
              tiers. Geographic revenue distribution demonstrates notable concentration, with North America and
              particularly the United States accounting for approximately half of all company sales. Despite these
              top-line growth indicators, audited GAAP financial statements, detailed annual recurring revenue (ARR)
              breakdowns, net revenue retention (NRR), and gross revenue retention (GRR) metrics remain entirely
