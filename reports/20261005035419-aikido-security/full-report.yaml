      - number: '3.3'
        title: Distribution, Pricing, and Switching
        blocks:
          - type: paragraph
            body: >
              Distribution power differs by route to the buyer. GitHub Advanced Security is embedded where GitHub-native
              teams already review code, whereas Aikido asks the buyer to adopt an additional platform in exchange for
              broader consolidation. Checkmarx is positioned toward governance-heavy enterprise programs; Snyk
              emphasizes developer workflow; and self-managed open-source tools offer control without a vendor workflow
              layer. Public commercial evidence is not directly comparable: RFP.wiki reports an Aikido free tier and
              public monthly pricing but also custom higher tiers and repository, user, or usage caps, while Aikido's
              own comparison describes rivals using contributor, active-committer, lines-of-code, and module-based
              units. These are list-model observations, not realized contract prices. Multi-homing remains plausible
              because specialist supply-chain or runtime products can complement rather than replace SAST/SCA, which
              limits lock-in but increases integration and governance work.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >
              The available evidence points to workflow design, breadth, and product velocity as Aikido's current
              differentiation; it does not establish a proprietary detection advantage. The company says its SAST engine
              runs on every commit and pairs deterministic detection with AI triage and AutoFix, while its syndicated
              announcement describes expansion into AI penetration testing and self-securing software. Incumbents can
              copy workflow features, native platforms can bundle security into existing developer seats, and
              specialists can attack depth gaps. Regulated buyers also require controls beyond vulnerability scanning:
              Aikido's own HIPAA guide discusses access control, audit logging, encryption, risk analysis, policies, and
              business-associate agreements, and explicitly notes that no government-issued HIPAA software certification
              exists. Durable advantage therefore depends on proving comparable detection quality and enterprise control
              depth without losing Aikido's lower-friction experience.
            claimRefs:
              - CP004
              - CP005
              - CP010
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Comparative claims require a controlled proof of concept
            body: >-
              Aikido's noise-reduction claims and competitors' assertions about reachability, scale, and governance come
              from interested issuers. A buyer should run identical codebases, policies, and remediation workflows
              across shortlisted products before assigning detection or total-cost superiority.
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Mechanics, and GTM Motion
        blocks:
          - type: paragraph
            body: >-
              Aikido Security operates as a commercial B2B developer-first cybersecurity software provider delivering
              application security posture management (ASPM) across code, cloud, and runtime environments. The business
              monetizes via subscription tiers that combine developer-led inbound adoption with commercial SaaS seat and
              repository packages. Market data lists its core commercial motion as subscription-based B2B software,
              scaling from automated self-serve discovery into enterprise accounts. Industry analysis highlights that
              Aikido pursues a bottom-up developer-led go-to-market model backed by inbound demand, while also competing
              aggressively for enterprise displacement contracts by offering substantial switching discounts against
              established incumbents. Customer adoption has broadened across high-profile technology teams including
              Revolut, Niantic, and SoundCloud, expanding commercial contract scope across multiple scanning modules.
            claimRefs:
