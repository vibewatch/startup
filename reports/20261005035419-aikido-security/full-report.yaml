  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Categories, and Spend Taxonomy
        blocks:
          - type: paragraph
            body: >
              The addressable software security landscape spans disjointed spending categories: traditional Application
              Security Testing (AST)—comprising Static Application Security Testing (SAST), Dynamic Application Security
              Testing (DAST), and Software Composition Analysis (SCA)—alongside Infrastructure as Code (IaC) scanning,
              Cloud Security Posture Management (CSPM), and emerging agentic penetration testing. Historically,
              enterprise procurement routed these capabilities to specialized point vendors, requiring engineering
              organizations to purchase, integrate, and maintain separate scanners for static source analysis,
              open-source dependency auditing, and external network scanning. This operational fragmentation generated
              high total cost of ownership through duplicative licensing, connector maintenance overhead, and severe
              alert fatigue across engineering departments.


              Aikido Security positions itself as an integrated, developer-centric platform that unifies AST, cloud
              posture scanning, and runtime verification within a single subscription. The addressable spend boundary
              includes core DevSecOps testing suites, repository-level vulnerability management, software supply chain
              security budgets, and third-party penetration testing line items. Conversely, the addressable scope
              excludes traditional Governance, Risk, and Compliance (GRC) enterprise software platforms, Security
              Information and Event Management (SIEM) log data lakes, endpoint detection and response (EDR), and
              dedicated network firewalls. These adjacent categories are treated as downstream integration targets
              rather than native platform modules.


              A critical boundary dispute in modern AppSec procurement is whether Application Security Posture
              Management (ASPM) functions as an independent consolidation layer atop third-party scanners or whether
              native scanning suites will absorb ASPM correlation directly. While competitors such as Cycode emphasize
              broad connector ecosystems (120+ integrations) to correlate disparate third-party alerts, Aikido advocates
              for full-lifecycle native scanner ownership spanning code, cloud, and runtime. This strategic distinction
              shifts buyer expenditure from aggregation middleware toward all-in-one developer guardrails.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing, Category Penetration, and Diligence Constraints
        blocks:
          - type: paragraph
            body: >
              Quantifying the total market size for developer-first security requires evaluating multiple distinct
              segment lenses rather than relying on a single top-line projection. The global Application Security market
              is traditionally partitioned into Static Application Security Testing, Software Composition Analysis,
              Cloud-Native Application Protection, and Penetration Testing services. In open-source dependency auditing,
              independent engagement analytics from PeerSpot indicate that Aikido held a 2.6% category mindshare in
              Software Composition Analysis as of October 2026 (up from 1.5% in the prior year), ranking 6th overall
              behind entrenched incumbents including Snyk, Veracode, and Black Duck. Across related buyer evaluation
              tracks, Aikido ranked 4th in SAST and DAST, and 5th in ASPM, demonstrating broadening peer evaluation
              footprint across mid-market and enterprise buyers.


              At the corporate scale layer, Aikido announced a $60 million Series B round in January 2026 led by DST
              Global at a $1 billion valuation, reporting roughly fivefold year-over-year revenue growth and a customer
              base spanning more than 100,000 teams. However, public market sizing disclosures lack audited Annual
              Recurring Revenue (ARR), net revenue retention (NRR) rates, and geographical customer concentration
              splits. Analyst recognitions, including Frost & Sullivan's 2026 Customer Value Leadership Award in ASPM,
              cite strong enterprise adoption and scanner consolidation; however, total addressable market penetration
              remains constrained by large enterprise procurement inertia and multi-year legacy contracts with legacy
              code-scanning vendors.


              To reflect institutional diligence discipline, market sizing must be stratified into Total Addressable
              Market (TAM), Serviceable Addressable Market (SAM), and Serviceable Obtainable Market (SOM). While the
              broader cybersecurity tooling and compliance market exceeds $30 billion globally, the developer-first AST
              and ASPM consolidation layer represents an estimated SAM of $6.5 billion, constrained by cloud-native
              development practices and GitHub/GitLab-centric engineering workflows. Aikido's SOM is bounded by
              commercial development teams willing to displace point scanners with all-in-one platforms, representing an
              estimated addressable opportunity of $900 million.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
