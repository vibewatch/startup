      - number: '2.3'
        title: Buyer Personas, Procurement Dynamics, and Budget Friction
        blocks:
          - type: paragraph
            body: >
              Adoption of developer-first security platforms is governed by a dual-persona dynamic: technical evaluation
              is driven by software developers and engineering leads, whereas contractual signing and budget
              authorization reside with the Chief Information Security Officer (CISO), Head of AppSec, or VP of
              Engineering. In mid-market and enterprise environments, the primary adoption catalyst is alert fatigue and
              cross-repository policy sprawl. Security teams choose developer-first platforms to embed automated
              reachability gating and pull-request triage into CI/CD pipelines without slowing sprint velocity. Verified
              user sentiment highlights that automated ticketing integration, pull-request autofixes, and reachability
              filtering reduce triage backlogs that previously went unaddressed for years.


              However, customer reviews on G2 and AWS Marketplace expose sharp pricing friction across buyer tiers.
              Aikido offers a free-forever tier for small codebases, but individual practitioners and micro-teams report
              substantial budget hurdles when scaling, citing a steep pricing jump from free usage to commercial
              packages (e.g. €300/month to approximately $700/month). Solo software engineers and early-stage
              development shops explicitly express demand for an intermediate sub-tier (around €50/month) covering 15–20
              repositories. For larger enterprise deployments, buyer reviews on RFP.wiki and marketplace benchmarks
              indicate that total cost of ownership scales with monitored developer headcount and AI compute
              consumption, requiring custom quotation and professional services negotiations that slow transaction
              velocity.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Catalysts for Acceleration and Structural Adoption Headwinds
        blocks:
          - type: paragraph
            body: >
              Market demand for unified developer security is propelled by three primary tailwinds: the explosion of
              AI-generated code, stringent regulatory compliance mandates, and the shift from periodic penetration tests
              to continuous verification. The widespread deployment of AI coding assistants has accelerated code release
              volume, making manual code review impractical and increasing the risk of subtle business logic flaws such
              as Broken Access Control and Insecure Direct Object References (IDOR). To address this, organizations
              layer static rules, pull-request reasoning, repository audits, and autonomous agentic penetration testing.
              Furthermore, regulatory frameworks including HIPAA/HITECH, SOC 2, and ISO 42001 mandate rigorous technical
              safeguards—such as access control logging, vulnerability management, and Business Associate Agreement
              (BAA) enforcement—turning automated scanning from an engineering luxury into a non-negotiable procurement
              requirement.


              Conversely, adoption encounters material constraints. In enterprise accounts, switching costs remain high
              when organizations have invested years configuring custom AST rule sets, integrating proprietary ticketing
              pipelines, or negotiating multi-product enterprise discount agreements with legacy vendors. Additionally,
              while AI-powered exploitability validation cuts false positives, customer evaluations note that autonomous
              pentesting and agentic autofixes require stable authentication, production-equivalent staging
              environments, and ongoing engineering oversight to prevent breaking operational code. These constraints
              create an extended proof-of-concept phase for enterprise buyers.
            claimRefs:
              - CM003
              - CM004
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Consolidation Imperative vs. Enterprise Inertia
            body: >-
              The core commercial proposition of developer-first security platforms is replacing fragmented point
              solutions with an all-in-one platform spanning code, cloud, and runtime. While this resonates strongly
              with mid-market teams facing alert fatigue, enterprise adoption faces friction from multi-year legacy
              contracts, complex procurement processes, and custom ASPM integrations.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: callout
            title: Pricing Cliff at the Bottom of the Funnel
            body: >-
              User reviews across G2 and AWS Marketplace reveal a sharp pricing cliff between Aikido's free-forever tier
              and commercial packages starting at €300 to $700 per month. Without an entry-level tier for individual
              consultants and micro-startups, the vendor risks stalling self-serve conversion loops.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >
              Aikido is not competing in one narrow SAST category. Its declared code, cloud, runtime, triage, and
              remediation scope places it against legacy enterprise suites such as Checkmarx, GitHub's native security
              stack, developer-first products such as Snyk, custom-rule tools such as Semgrep, reachability specialists
              such as Endor Labs, and cloud-context entrants such as Wiz Code. Buyers can also assemble Semgrep, Trivy,
              Syft, and related open-source tools internally, retain several point products, or continue manual AppSec
              triage. Those alternatives solve different jobs: native platforms minimize deployment friction, enterprise
              suites emphasize governance, specialists argue for deeper analysis, and internal builds trade licensing
              expense for engineering effort. The evidence therefore supports a segmented landscape rather than a single
              ordinal league table. Scale data for most rivals was not available in the assigned pool and is marked
              unknown rather than estimated.
            claimRefs:
              - CP001
              - CP006
              - CP007
