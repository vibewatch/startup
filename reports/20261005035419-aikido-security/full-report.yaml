            body: >-
              Aikido Security was founded in Belgium in 2022 and is described by an independent company profile as
              headquartered in Ghent. Its current official About page lists operating offices in Chicago, London,
              Singapore, and Boston, giving it a visible international footprint without resolving which legal entity
              employs staff in each location. The product proposition is a unified application-security system spanning
              code, cloud, runtime, supply-chain protection, and automated penetration testing. That breadth is the core
              business-model claim: Aikido sells consolidation and developer workflow integration rather than a single
              scanner. The retained review evidence confirms the breadth of the pitch, but it does not independently
