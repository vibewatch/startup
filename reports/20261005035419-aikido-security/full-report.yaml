  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Definition, Core Modules, and Operating Architecture
        blocks:
          - type: paragraph
            body: >
              Aikido Security operates as a unified application security posture management (ASPM) and developer
              security platform designed to replace fragmented legacy point solutions across the software development
              lifecycle. Rather than forcing development teams to manage disjointed vulnerability scanners for code,
              cloud infrastructure, and runtime environments, Aikido consolidates these functions into an integrated
              security engine with automated triage and developer-centric workflows. The product spans static
              application security testing (SAST), software composition analysis (SCA) for open-source dependencies and
              software supply chain integrity, infrastructure-as-code (IaC) verification, secrets scanning, container
              image inspection, dynamic application security testing (DAST), and autonomous AI penetration testing.


              Architecturally, the platform employs a hybrid deployment model that decouples the central cloud
              management plane from the scanning execution layer. Development teams integrate Aikido into their source
              code management (SCM) systems via read-only APIs across GitHub, GitLab, and Bitbucket, as well as CI/CD
              continuous integration pipelines, local developer environments via command-line tooling, and cloud
              infrastructure platforms. The scanning subsystem utilizes specialized static and runtime parsers that feed
              findings into a centralized risk graph. This graph correlates code findings with live cloud runtime
              exposure, reachability paths, and asset metadata to prioritize real, exploitable security defects over
              non-actionable alerts.


              For offensive security validation, Aikido introduced Aikido Attack and its continuous counterpart Aikido
              Infinite. The AI pentesting architecture splits planning and reasoning from target execution. An
              autonomous control plane orchestrates multi-agent test execution plans while individual worker agents
              operate within isolated, scoped execution sandboxes. These sandboxes enforce strict guardrails: agents
              have no open outbound internet access, mitigating prompt injection and exfiltration risks, and execute
              rate-limited, load-aware requests against explicitly allow-listed staging and target environments. For
              customers subject to strict data residency mandates or operating in isolated VPCs, Aikido Machine allows
              the continuous AI pentesting engine to run entirely on-premises inside the customer's private network
              without requiring cloud connectivity.
            claimRefs:
