  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Legacy Workflow
      - Company Solution
      - Measurable Benefit
      - Limitation / Edge Case
    rows:
      - - Pre-merge code security review in pull requests
        - >-
          Developers review static analysis scanner outputs containing hundreds of false positives; security teams
          manually review diffs.
        - >-
          Aikido Deep PR Review and AI AutoFix deliver inline comments and contextual code patches directly in
          GitHub/GitLab PRs.
        - Reduces alert triage backlog; automates contextual fix suggestions at code-authoring time.
        - >-
          Complex custom architectural patterns and legacy monolithic frameworks may generate edge-case false flags
          requiring manual rule overrides.
      - - Third-party open-source risk and SBOM management
        - >-
          Periodic scheduled SCA scans generating unranked lists of vulnerable dependencies regardless of runtime
          invocation.
        - >-
          Reachability-aware SCA scanning that checks if vulnerable package functions are actually called by the
          application.
        - Eliminates alerts for unused dependency code, cutting reported vulnerable backlog by up to 90%.
        - >-
          Reachability analysis precision depends on dynamic language runtime bindings and reflection patterns in
          dynamic languages.
      - - Periodic compliance and pre-release penetration testing
        - >-
          Annual or quarterly manual penetration testing engagements costing tens of thousands of dollars and taking 2
          to 4 weeks.
        - >-
          Aikido Attack deploys autonomous agents executing whitebox testing in hours with verifiable PoC exploit
          chains.
        - >-
          Tyro Payments benchmark achieved test completion in ~5.5 hours versus ~15 days for human testers, finding 30
          issues vs 5.
        - >-
          Auditors in highly rigid legacy frameworks (e.g. strict PCI DSS 11.4 manual clauses) may still mandate a human
          tester signature.
      - - Continuous offensive security for rapid deployment cycles
        - >-
          Security testing skipped between release cycles because manual penetration testing cannot match daily/weekly
          deploy frequency.
        - >-
          Aikido Infinite runs continuous autonomous tests as code ships, automatically retesting identified
          vulnerabilities upon patch deployment.
        - Ensures continuous coverage for high-velocity teams where 76% deploy weekly and 40% deploy daily.
        - Requires staging environments that accurately mirror production configurations and test data sanitization.
    notes: >-
      Workflow benefits and limitations based on customer benchmarks, AST comparison analyses, and stated platform
