  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Aikido Security operates in a developer-first application security testing and posture management domain
              governed by tightening international data privacy, cybersecurity resilience, and healthcare compliance
              statutes. Foremost among these is the architectural friction between build-time provenance requirements
              and static dependency parsing. Emerging software supply chain regulations, including the European Union
              Cyber Resilience Act and federal procurement standards, increasingly require verifiable records of
              packages actually fetched and executed during software builds rather than declarative lists parsed from
              repository manifests and lockfiles. Because Aikido primarily builds its software dependency map from
              manifests and lockfiles, enterprise customers subject to rigorous supply chain audits face technical
              compliance deficits unless supplemental build-level telemetry or package proxies are deployed alongside
              the platform. In addition, customers deploying software across regulated domains such as U.S. healthcare
              encounter strict statutory liability under the Health Insurance Portability and Accountability Act (HIPAA)
              as modified by the Health Information Technology for Economic and Clinical Health (HITECH) Act. Under
              HITECH, software vendors and business associates handling protected health information (PHI) face direct
              statutory liability for technical safeguards, mandatory breach disclosures, and administrative audit
              compliance. Violations carry tiered statutory penalties ranging from $100 up to $1.5 million per violation
              category annually for willful neglect, alongside severe reputational damage. While Aikido has obtained AI
              governance certification under ISO 42001, healthcare and enterprise SaaS deployments demand continuous
              proof of data isolation, granular audit logging, and signed Business Associate Agreements that constrain
              rapid self-serve adoption.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
