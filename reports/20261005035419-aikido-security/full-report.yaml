      - number: '4.4'
        title: 'Financial Verdict: Valuation Multiple Stretch and Diligence Blockers'
        blocks:
          - type: paragraph
            body: >-
              At a $1 billion valuation negotiated during the January 2026 Series B round, Aikido commands an implied
              valuation multiple of 76.9x against its $13 million reported revenue. Market analysis notes that this
              represents extreme multiple expansion, requiring sustained quadruple-digit ARR expansion and significant
              gross margin leverage to justify in public market liquidity scenarios. Furthermore, adverse signals
              including aggressive competitor discounting to win displacement deals threaten gross margin realization
              and net pricing power. Until management provides consolidated audited financials, customer cohort churn,
              and cash burn schedules, institutional underwriting must treat forward revenue quality with heightened
              conservatism.
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Elevated Valuation Multiple and Competitive Pricing Pressures
            body: >-
              Aikido's $1 billion Series B valuation represents a 76.9x multiple on its last reported $13 million
              revenue. While a 5x growth trajectory demonstrates strong customer traction, market evidence of aggressive
              price discounting to displace legacy AppSec vendors indicates potential margin compression and pricing
              fragility as large incumbents respond.
            calloutType: risk
            claimRefs:
              - CI005
              - CI014
              - CI015
          - type: callout
            title: Capital Efficiency Balanced Against US Go-to-Market Burn
            body: >-
              Raising $60 million in fresh capital at unicorn status provides Aikido with multiple years of liquidity to
