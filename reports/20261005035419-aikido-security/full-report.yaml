      - number: '7.2'
        title: Operational Reliability and Technical Execution Risks
        blocks:
          - type: paragraph
            body: >-
              The operational integrity of Aikido Security's unified platform depends on high-throughput vulnerability
              scanning across source code, cloud configurations, container images, and continuous automated penetration
              testing. A central technical failure mode arises from scanner breadth versus deep domain specialization:
              by combining static analysis (SAST), software composition analysis (SCA), secrets detection,
              infrastructure as code (IaC), container scanning, and dynamic penetration testing across a single
              dashboard, the platform risks surfacing false negatives or unvalidated exploitability paths when compared
              against dedicated niche scanners. In automated penetration testing and runtime agent execution, improper
              exploit validation or overly aggressive automated remediation scripts can cause unexpected operational
              disruption or service degradation within client continuous integration pipelines. Furthermore,
              developer-first adoption exposes Aikido to severe false-positive fatigue if reachability filtering fails
              to suppress non-exploitable vulnerabilities, which historically causes developer bypass of security gates
              or uncoordinated scanner deactivation. The platform's automated agentic workflows, such as multi-agent
              penetration testing and AutoFix pull-request generation, also introduce non-deterministic code
              modification risks that require human review before production deployment. While independent user reviews
              indicate positive developer sentiment regarding triage noise reduction and rapid setup, enterprise
              evaluators frequently report that younger platform capabilities, export limitations, and immature
              governance workflows require complementary scanners to achieve exhaustive operational assurance.
