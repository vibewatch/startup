company:
  name: "Aikido Security"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Aikido Security is a Belgian-founded developer-security platform that says it has raised $85 million and that independent reporting valued at $1 billion in its January 2026 Series B. Public evidence supports rapid product and financing expansion, but paid-customer count, recurring revenue, profitability, capitalization terms, and governance remain material diligence gaps."
sections:
  - id: "identity-and-product"
    title: "Identity and Product Model"
    body: >-
      Aikido Security was founded in Belgium in 2022 and is described by an independent
      company profile as headquartered in Ghent. Its current official About page lists
      operating offices in Chicago, London, Singapore, and Boston, giving it a visible
      international footprint without resolving which legal entity employs staff in each
      location. The product proposition is a unified application-security system spanning
      code, cloud, runtime, supply-chain protection, and automated penetration testing.
      That breadth is the core business-model claim: Aikido sells consolidation and
      developer workflow integration rather than a single scanner. The retained review
      evidence confirms the breadth of the pitch, but it does not independently validate
      product efficacy, false-positive reduction, or customer outcomes.
    claimRefs:
      - "CO001"
      - "CO002"
    tableRefs:
      - "TO001"
  - id: "funding-and-scale"
    title: "Funding and Reported Scale"
    body: >-
      Aikido's official About page states that the company has raised $85 million, while
      independent coverage reports a $60 million Series B in January 2026 at a $1 billion
      valuation. The round was led by DST Global with participation from PSG Equity,
      Notion Capital, and Singular. Operating scale is less settled. The About page claims
      more than 350 employees and more than 150,000 teams protected, while the homepage
      separately says more than 50,000 organizations and 100,000 developers. Those are
      not disclosed as paying-customer counts and their denominators are not reconciled.
      AInvest reports $13 million of 2025 revenue, but that secondary figure is not ARR,
      audited revenue, cash on hand, or evidence of profitability.
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      The retained evidence identifies Willem Delbare as chief executive and names Roeland
      Delrue and Felix Garriau alongside him as founders. It also identifies Madeline
      Lawrence as co-founder and chief growth officer, with a public role explaining the
      Root acquisition and its open-source patching commitment. Public sources do not
      establish the current board, investor observer rights, voting control, founder
      ownership, executive reporting lines, or succession arrangements. That makes
      key-person dependence a diligence question rather than a quantified conclusion.
      The visible founding bench and acquisition-led expansion show functional breadth,
      but private corporate records are still needed to assess who controls strategic,
      financing, and product decisions.
    claimRefs:
      - "CO012"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "milestones-and-risk-signals"
    title: "Milestones and Risk Signals"
    body: >-
      The public chronology moves from the 2022 founding through a reported $17 million
      Series A in May 2024, three product-expanding acquisitions in 2025, the January 2026
      unicorn financing, and the June 2026 acquisition of Root. Aikido later published a
      claim that it had achieved ISO 42001 certification covering several AI-enabled
      products. The pace indicates substantial capital and integration ambition, not
      proven operating leverage. The most explicit adverse retained analysis says the
      company is not yet profitable and frames sales-and-marketing burn and aggressive
      switching discounts as risks to margin improvement. Those statements are external
      analysis rather than company financial disclosure, so the core issue is the absence
      of audited statements, burn data, retention metrics, and acquisition-integration
      reporting.
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
