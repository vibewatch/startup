chapter:
  number: 3
  title: Competitors
  summary: Aikido competes on consolidation and developer workflow against enterprise suites, GitHub-native security, specialist reachability vendors, adjacent supply-chain products, and self-managed open-source stacks. The retained evidence supports breadth and ease-of-use positioning, but it does not provide an independent head-to-head benchmark of detection depth, false-positive reduction, or realized pricing.
sections:
  - id: landscape-and-buyer-alternatives
    title: Landscape and Buyer Alternatives
    body: |
      Aikido is not competing in one narrow SAST category. Its declared code, cloud, runtime, triage, and remediation scope places it against legacy enterprise suites such as Checkmarx, GitHub's native security stack, developer-first products such as Snyk, custom-rule tools such as Semgrep, reachability specialists such as Endor Labs, and cloud-context entrants such as Wiz Code. Buyers can also assemble Semgrep, Trivy, Syft, and related open-source tools internally, retain several point products, or continue manual AppSec triage. Those alternatives solve different jobs: native platforms minimize deployment friction, enterprise suites emphasize governance, specialists argue for deeper analysis, and internal builds trade licensing expense for engineering effort. The evidence therefore supports a segmented landscape rather than a single ordinal league table. Scale data for most rivals was not available in the assigned pool and is marked unknown rather than estimated.
    claimRefs:
      - CP001
      - CP006
      - CP007
      - CP008
      - CP009
      - CP013
      - CP014
    tableRefs:
      - TP001
  - id: capability-and-differentiation
    title: Capability Breadth Versus Detection Depth
    body: |
      Aikido's strongest documented proposition is consolidation: one workflow spanning several application-security domains, with company-claimed AI triage, reachability, and automated remediation. A competitor describes much of the model as orchestration and de-duplication over established open-source scanners; another competitor argues that direct-dependency reachability, large-repository performance, and enterprise controls become constraints at scale. These are relevant adverse hypotheses, not independent technical findings. RFP.wiki likewise describes broad AST coverage while advising buyers to validate advanced testing depth and integration maturity on their own stack. A proof of concept should therefore measure coverage, scan latency, false-positive disposition, transitive reachability, and remediation acceptance on identical repositories. Until such a benchmark exists, neither Aikido's claimed noise reduction nor competitors' superiority claims should be treated as verified comparative performance.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP010
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: distribution-pricing-and-switching
    title: Distribution, Pricing, and Switching
    body: |
      Distribution power differs by route to the buyer. GitHub Advanced Security is embedded where GitHub-native teams already review code, whereas Aikido asks the buyer to adopt an additional platform in exchange for broader consolidation. Checkmarx is positioned toward governance-heavy enterprise programs; Snyk emphasizes developer workflow; and self-managed open-source tools offer control without a vendor workflow layer. Public commercial evidence is not directly comparable: RFP.wiki reports an Aikido free tier and public monthly pricing but also custom higher tiers and repository, user, or usage caps, while Aikido's own comparison describes rivals using contributor, active-committer, lines-of-code, and module-based units. These are list-model observations, not realized contract prices. Multi-homing remains plausible because specialist supply-chain or runtime products can complement rather than replace SAST/SCA, which limits lock-in but increases integration and governance work.
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP009
      - CP011
      - CP012
    tableRefs:
      - TP003
  - id: moat-and-displacement-risk
    title: Moat Durability and Displacement Risk
    body: |
      The available evidence points to workflow design, breadth, and product velocity as Aikido's current differentiation; it does not establish a proprietary detection advantage. The company says its SAST engine runs on every commit and pairs deterministic detection with AI triage and AutoFix, while its syndicated announcement describes expansion into AI penetration testing and self-securing software. Incumbents can copy workflow features, native platforms can bundle security into existing developer seats, and specialists can attack depth gaps. Regulated buyers also require controls beyond vulnerability scanning: Aikido's own HIPAA guide discusses access control, audit logging, encryption, risk analysis, policies, and business-associate agreements, and explicitly notes that no government-issued HIPAA software certification exists. Durable advantage therefore depends on proving comparable detection quality and enterprise control depth without losing Aikido's lower-friction experience.
    claimRefs:
      - CP004
      - CP005
      - CP010
      - CP013
      - CP015
      - CP016
