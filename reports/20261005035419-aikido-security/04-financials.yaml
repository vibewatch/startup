      - "CI014"
      - "CI015"
  - calloutType: "insight"
    title: "Capital Efficiency Balanced Against US Go-to-Market Burn"
    body: "Raising $60 million in fresh capital at unicorn status provides Aikido with multiple years of liquidity to expand in the United States, which already contributes roughly half of its revenue. However, converting high growth into sustainable operating profitability depends heavily on whether consolidated platform breadth translates into durable enterprise contract expansion."
