company:
  name: "Aikido Security"
chapter:
  number: 4
  title: "Financials"
  summary: "Aikido Security achieved unicorn status in January 2026 following a $60 million Series B round led by DST Global at a $1 billion post-money valuation. While private comps and market coverage record 2025 revenue of approximately $13 million reflecting a five-fold annual expansion, the company faces severe valuation multiple stretch (76.9x revenue multiple), negative operating profitability, aggressive competitor displacement discounting, and completely undisclosed consolidated unit economics."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model, Monetization Mechanics, and GTM Motion"
    body: "Aikido Security operates as a commercial B2B developer-first cybersecurity software provider delivering application security posture management (ASPM) across code, cloud, and runtime environments. The business monetizes via subscription tiers that combine developer-led inbound adoption with commercial SaaS seat and repository packages. Market data lists its core commercial motion as subscription-based B2B software, scaling from automated self-serve discovery into enterprise accounts. Industry analysis highlights that Aikido pursues a bottom-up developer-led go-to-market model backed by inbound demand, while also competing aggressively for enterprise displacement contracts by offering substantial switching discounts against established incumbents. Customer adoption has broadened across high-profile technology teams including Revolut, Niantic, and SoundCloud, expanding commercial contract scope across multiple scanning modules."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-growth-scale"
    title: "Public Traction, Revenue Scale, and Market Concentration"
    body: "Commercial traction for Aikido accelerated sharply through fiscal 2025, culminating in private comp reports recording approximately $13 million in annual revenue alongside five-fold year-over-year revenue growth. Company announcements confirm that its active customer base nearly tripled over the same period, reaching more than 100,000 teams registered or using the platform globally across freemium and commercial tiers. Geographic revenue distribution demonstrates notable concentration, with North America and particularly the United States accounting for approximately half of all company sales. Despite these top-line growth indicators, audited GAAP financial statements, detailed annual recurring revenue (ARR) breakdowns, net revenue retention (NRR), and gross revenue retention (GRR) metrics remain entirely undisclosed private data, preventing independent verification of recurring contract stability."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs: []
    figureRefs: []
  - id: "capital-adequacy-and-burn"
    title: "Capital Adequacy, Financing Dependency, and Cost Structure"
    body: "Aikido closed a $60 million Series B financing round in January 2026 led by DST Global, bringing cumulative equity capital raised to approximately $85 million. The injection provides substantial near-term liquidity and cash runway to support global product engineering and US commercial expansion. However, the company remains unprofitable and maintains an aggressive operational cash burn to sustain its high-velocity research and development and North American go-to-market footprint. Furthermore, operating cost structure details including hosting compute intensity, third-party scanner licensing obligations, gross margins, and customer acquisition costs (CAC) are withheld from public disclosure, creating underwriting blockers for late-stage investors."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
    tableRefs:
      - "TI003"
    figureRefs: []
  - id: "financial-verdict-and-underwriting"
    title: "Financial Verdict: Valuation Multiple Stretch and Diligence Blockers"
    body: "At a $1 billion valuation negotiated during the January 2026 Series B round, Aikido commands an implied valuation multiple of 76.9x against its $13 million reported revenue. Market analysis notes that this represents extreme multiple expansion, requiring sustained quadruple-digit ARR expansion and significant gross margin leverage to justify in public market liquidity scenarios. Furthermore, adverse signals including aggressive competitor discounting to win displacement deals threaten gross margin realization and net pricing power. Until management provides consolidated audited financials, customer cohort churn, and cash burn schedules, institutional underwriting must treat forward revenue quality with heightened conservatism."
    claimRefs:
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs: []
    figureRefs: []
