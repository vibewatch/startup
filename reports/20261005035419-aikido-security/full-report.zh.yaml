      - number: '2.2'
        title: 市场规模、类别渗透与尽调限制
        blocks:
          - type: paragraph
            body: >-
              要量化面向开发者的安全市场，必须从多个不同的细分视角评估，不能依赖单一的总量预测。全球应用安全市场通常分为静态应用安全测试、软件成分分析、云原生应用保护和渗透测试服务。在开源依赖审计领域，PeerSpot
              的独立参与度分析显示，截至 2026 年 10 月，Aikido 在软件成分分析中的类别心智份额为 2.6%（上一年为 1.5%），总体排名第 6，落后于 Snyk、Veracode 和 Black Duck
              等成熟厂商。在相关买方评估轨道中，Aikido 的 SAST 和 DAST 均排名第 4，ASPM 排名第 5，说明其在中型市场和企业买方中的同行评估覆盖面正在扩大。

              从公司规模看，Aikido 宣布于 2026 年 1 月由 DST Global 领投完成 $60 million B 轮融资，估值 $1 billion，并报告收入同比约增长五倍、客户基础覆盖超过
              100,000 个团队。然而，公开市场规模披露缺少经审计的年度经常性收入（ARR）、净收入留存率（NRR）和客户地域集中度拆分。Frost & Sullivan 2026 年 ASPM
              客户价值领导力奖等分析师认可提到强劲的企业采用和扫描器整合，但大型企业采购惯性和与传统代码扫描厂商签订的多年期合同，仍限制了总可服务市场的渗透。

              为体现机构尽调纪律，市场规模必须拆分为总可服务市场（TAM）、可服务市场（SAM）和可获得市场（SOM）。更广泛的网络安全工具与合规市场在全球超过 $30 billion，而面向开发者的 AST 和 ASPM
              整合层代表的 SAM 估计为 $6.5 billion，受云原生开发实践及以 GitHub / GitLab 为中心的工程工作流约束。Aikido 的 SOM
              受限于愿意用一体化平台替代单点扫描器的商业开发团队，对应估计可服务机会为 $900 million。
            claimRefs:
              - CM002
