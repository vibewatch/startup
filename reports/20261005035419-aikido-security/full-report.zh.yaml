      - number: '2.3'
        title: 买方画像、采购动态与预算摩擦
        blocks:
          - type: paragraph
            body: >-
              面向开发者的安全平台采用受双重角色驱动：技术评估由软件开发者和工程负责人主导，而合同签署和预算授权通常由首席信息安全官（CISO）、AppSec
              负责人或工程副总裁负责。在中型市场和企业环境中，主要采用催化剂是告警疲劳和跨仓库的策略泛滥。安全团队选择面向开发者的平台，把自动化可达性门禁和拉取请求分流嵌入 CI/CD
              流水线，同时不拖慢迭代速度。已验证的用户反馈显示，自动工单集成、拉取请求自动修复和可达性过滤，减少了过去多年无人处理的分流积压。

              然而，G2 和 AWS Marketplace 的客户评论显示，不同买方层级之间存在明显的价格摩擦。Aikido
              为小型代码库提供永久免费层，但个人从业者和微型团队称规模扩大时预算压力很大，原因是免费使用到商业套餐之间价格陡升（例如从 €300/月升至约
              $700/月）。单人软件工程师和早期开发工作室明确希望增加中间子套餐（约 €50/月），覆盖 15–20 个仓库。对于更大型的企业部署，RFP.wiki 的买方评论和市场基准显示，总拥有成本会随受监控开发者人数和
              AI 算力消耗上升，需要定制报价和专业服务谈判，从而拖慢交易速度。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
