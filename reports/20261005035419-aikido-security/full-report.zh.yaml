      - number: '6.3'
        title: 留存持久性、扩张闭环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Aikido 商业关系的长期持久性受到软件模块、开发者席位和多云环境等自然扩张面支持，但也受到缺少 cohort 留存数据这一结构性阻力影响。Aikido 的 land-and-expand
              动作通常从静态应用安全测试（SAST）、软件成分分析（SCA）或密钥检测开始，再扩展到云安全态势管理（CSPM）、运行时容器保护和智能体 AI 渗透测试。在 Visma 和 PSG Equity
              等多公司控股结构中，初始试点子公司验证节省时间后，会横向扩展，促使集中式平台团队接入更多投资组合实体。然而，RFP.wiki 的独立软件评估基准显示，Aikido 虽拥有较强用户口碑（234 条评论平均 4.7
              / 5 星）和 4.4 / 5.0
              的功能评分，但平台仍较年轻，缺少传统套件的治理、定制报告深度，以及可公开审计的正常运行时间、收入或净推荐值（NPS）记录。活跃招聘记录显示，随着公司地域扩张，客户成功和留存管理是关键投资重点；例如，Aikido
              在澳大利亚明确招聘专门的 Customer Success Engineer，以接触“有流失风险的账户”，防止流失并守住客户价值实现。从投资风险角度看，缺少公开 NRR、GRR 和 logo
              流失数字，造成信息缺口，使 Aikido $1 billion 估值的持久性依赖于私下审计对客户续约经济性及其赞助方支持的股权投资组合潜在合同集中度的验证。
