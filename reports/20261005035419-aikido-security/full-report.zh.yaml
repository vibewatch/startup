  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可服务类别与支出分类
        blocks:
          - type: paragraph
            body: >-
              可服务的软件安全市场横跨多个彼此分散的支出类别：传统应用安全测试（AST），包括静态应用安全测试（SAST）、动态应用安全测试（DAST）和软件成分分析（SCA）；基础设施即代码（IaC）扫描；云安全态势管理（CSPM）；以及新兴的智能体渗透测试。过去，企业采购通常把这些能力交给专业的单点厂商，工程组织需要分别购买、集成和维护静态源代码分析、开源依赖审计和外部网络扫描工具。这种运营割裂带来了高昂的总拥有成本：许可证重复、连接器维护负担，以及工程部门普遍严重的告警疲劳。

              Aikido Security 将自己定位为一体化、以开发者为中心的平台，在单一订阅中统一 AST、云态势扫描和运行时验证。可服务支出边界包括核心 DevSecOps
              测试套件、仓库级漏洞管理、软件供应链安全预算和第三方渗透测试费用。相反，可服务范围不包括传统治理、风险与合规（GRC）企业软件平台、安全信息与事件管理（SIEM）日志数据湖、端点检测与响应（EDR）以及专用网络防火墙。这些相邻类别被视为下游集成目标，而非平台原生模块。

              现代 AppSec 采购中的关键边界争议在于：应用安全态势管理（ASPM）究竟是叠加在第三方扫描器之上的独立整合层，还是原生扫描套件会直接吸收 ASPM 的关联能力。Cycode 等竞争对手强调通过 120+
              个集成连接不同第三方告警；Aikido 则主张由原生扫描器覆盖代码、云和运行时的完整生命周期。这一战略差异把买方支出从聚合中间件转向一体化开发者防护。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
