              - CM013
              - CM014
      - number: '2.4'
        title: 加速催化剂与结构性采用阻力
        blocks:
          - type: paragraph
            body: >-
              统一开发者安全的市场需求主要由三股顺风推动：AI 生成代码爆发、监管合规要求趋严，以及从定期渗透测试转向持续验证。AI
              编程助手大规模部署后，代码发布量加速增长，人工代码审查变得不现实，也提高了业务逻辑缺陷的风险，例如访问控制失效和不安全的直接对象引用（IDOR）。为应对这些风险，组织会叠加静态规则、拉取请求推理、仓库审计和自主智能体渗透测试。此外，HIPAA/HITECH、SOC
              2 和 ISO 42001 等监管框架要求严格的技术防护措施，包括访问控制日志、漏洞管理和商业伙伴协议（BAA）执行，使自动化扫描从工程上的可选项变成采购上的硬要求。

              反过来，采用也面临实质约束。企业若已花费多年配置定制 AST 规则集、接入专有工单流水线，或与传统厂商谈妥多产品企业折扣协议，切换成本仍然很高。此外，AI
              驱动的可利用性验证虽然能减少误报，但客户评估指出，自主渗透测试和智能体自动修复需要稳定的身份验证、等同生产环境的预发布环境以及持续的工程监督，以免破坏运营代码。这些约束会拉长企业买方的概念验证周期。
            claimRefs:
              - CM003
              - CM004
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 整合势在必行，但企业采购仍有惯性
            body: 面向开发者的安全平台的核心商业主张，是用覆盖代码、云和运行时的一体化平台替代分散的单点方案。它对受告警疲劳困扰的中型市场团队很有吸引力，但企业采用仍会受到多年期传统合同、复杂采购流程和定制 ASPM 集成的阻碍。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: callout
            title: 漏斗底部的价格断崖
            body: >-
              G2 和 AWS Marketplace 的用户评论显示，Aikido 的永久免费层与商业套餐之间存在明显价格断崖，后者起价为每月 €300 至
              $700。若没有面向个人顾问和微型初创公司的入门层，厂商可能会卡住自助转化闭环。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Aikido 参与的并非一个狭窄的 SAST 类别。其声明覆盖代码、云、运行时、分流和修复，因此竞争对象包括 Checkmarx、GitHub 原生安全栈等传统企业套件，Snyk
              等面向开发者的产品，Semgrep 等自定义规则工具，Endor Labs 等可达性专家，以及 Wiz Code 等云环境背景的新进入者。买方也可以在内部组合 Semgrep、Trivy、Syft
              等开源工具，保留多个单点产品，或继续手动处理 AppSec
              分流。这些替代方案解决的任务不同：原生平台降低部署摩擦，企业套件强调治理，专业厂商主张更深分析，内部构建则以工程投入换取许可证成本。证据因此支持一个分层市场，而不是单一的排名表。大多数竞争对手的规模数据在指定资料池中不可得，因此标记为未知，而非估算。
