  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方动态
        blocks:
          - type: paragraph
            body: >-
              Aikido Security
              将商业采用和开放采用分为三个不同客户层级：高速增长的科技公司和数字原生企业、私募股权软件并购平台及控股集团，以及正在扩大合规驱动安全项目的中型市场组织。在数字原生和高速度工程领域，买方通常是工程负责人、首席技术官或应用安全负责人，希望避免传统安全套件造成的开发者摩擦和告警疲劳。工作流自动化平台
              n8n、金融科技供应商 Revolut 和空间计算平台 Niantic 等代表性客户，将 Aikido
              部署到代码仓库、容器构建和基础设施配置中，以维持发布速度。在私募股权和集团投资组合层级，买方处于高管或投资组合运营层面，在数十家独立运营子公司中部署
              Aikido，以建立标准化可见性，同时不增加沉重的手工实施负担。Visma 在超过 200 家投资组合公司、6,000 多名开发者中部署 Aikido，Providence Strategic
              Growth（PSG）Equity 也按结构化企业入场模式在 130 家投资组合公司中推广该平台，这正是该模式的例子。在第三个层级，中型企业和专业服务公司使用 Aikido 统一漏洞发现，并满足 SOC
              2、ISO 42001 等审计框架要求，将发现结果直接路由到 Linear、Jira 和 Slack
              频道等问题跟踪系统。不过，不同层级的商业合同条款差异很大：自助团队使用透明的分层定价和免费入门层，而控股集团和大型企业部署会谈判定制的模块化套餐，其实际合同金额、最低承诺和平台折扣仍属私有信息。
