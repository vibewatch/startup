    title: 投资论点 / 反论点表
    columns:
      - 立场
      - 论点
      - 公开证据
      - 哪些事实会改变判断
    rows:
      - - 投资论点
        - 快速商业动能可以支撑进一步扩张
        - 公司披露收入增长五倍；独立报道也称增长相近
        - 经审计的收入桥接和持久的 cohort 留存将强化该论点
      - - 投资论点
        - 独角兽融资前已能看到开发者驱动的采用
        - 2024 年证据显示超过 3,000 家组织和 6,000 名个人开发者
        - 2024 至 2026 年的付费客户桥接将验证转化质量
      - - 投资论点
        - 资本获取支持产品和地域扩张
        - $1B 估值的 $60M B 轮融资，以及之后报道的 $70M Root 收购
        - 披露收购对价和交易后流动性将显示其承受能力
      - - 反论点
        - 使用量 headline 无法证明变现
        - 2026 年的说法是 100,000+ 个团队，分母不同于客户或组织
        - 付费客户数量、ACV、GRR、NRR 和集中度将补上这一缺口
      - - 反论点
        - 竞争可能压低价格和利润率
        - 独立分析指出供应商拥挤、激进的转移折扣和平台吸收风险
        - 稳定的实际成交价格和毛利率扩张将削弱这一担忧
    notes: 公司披露的团队、客户、组织和开发者保持为不同分母；不对它们进行相互换算。
