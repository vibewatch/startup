      - number: '3.3'
        title: 分销、定价与切换
        blocks:
          - type: paragraph
            body: >-
              不同买方路径带来的分销能力不同。GitHub Advanced Security 嵌入已经采用 GitHub 原生工具的团队代码审查流程，而 Aikido
              则要求买方额外采用一个平台，以换取更广泛的整合。Checkmarx 面向重治理的企业项目；Snyk
              强调开发者工作流；自管开源工具则在没有厂商工作流层的情况下提供控制力。公开商业证据并不具有直接可比性：RFP.wiki 报告了 Aikido
              的免费层和公开月费，也提到定制的更高层级及仓库、用户或用量上限；Aikido
              自己的对比则称竞争对手按贡献者、活跃提交者、代码行和模块计费。这些是价目模型观察，不是实际合同价格。多平台并用仍有可能，因为专业的软件供应链或运行时产品可以补充而非替代
              SAST/SCA；这会限制锁定，却增加集成和治理工作。
