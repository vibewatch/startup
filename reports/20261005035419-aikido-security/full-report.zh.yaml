      - number: '5.2'
        title: 开发者工作流集成、修复与实际成果
        blocks:
          - type: paragraph
            body: >-
              平台的运营理念是把安全直接嵌入日常工程工具，尽量减少对开发者的干扰。传统应用安全测试（AST）套件经常向开发者倾倒数百条未经验证的告警，其中绝大多数代表无法到达的代码路径或没有即时威胁的理论问题。Aikido
              通过上下文去重、可达性分析和自动分流应对告警疲劳，声称误报率估计下降 90%。除标记漏洞外，Aikido 还通过 AI AutoFix
              提供自动化修复指导，生成结合上下文的代码片段、拉取请求评论和针对具体应用框架的直接修复建议。

              上游代码防护由 Code Security Audit 提供，它在代码部署前分析完整仓库中的架构和逻辑缺陷；Deep PR Review
              则检查增量拉取请求中的访问控制失效（BAC）和业务逻辑漏洞。当软件进入预发布或生产环境后，自主 AI
              渗透测试会部署多智能体探针，发现语法静态分析无法检测的复杂漏洞，例如不安全的直接对象引用（IDOR）和授权绕过。发现结果附带经过验证的概念验证（PoC）及分步骤复现说明。

              外部基准和比较评估显示出切实的效率提升，同时也说明平台仍在成熟。在 APRA 监管的 Tyro Payments 银行部署中，Aikido 的 AI 渗透测试约 5.5 小时完成，而人工渗透测试团队预计需要 15
              天；前者发现 30 个问题（包括 9 个高严重性发现），人工评估则发现 5 个问题（包括 1 个高严重性发现）。但独立技术评审指出，Aikido
              虽然部署速度突出、拉取请求工作流对开发者友好、扫描覆盖面广，但与成熟的传统企业套件相比，企业定制、本地部署稳定性和深度治理报告仍在演进。
            claimRefs:
              - CE003
