      - number: '6.2'
        title: 采用轨迹与具名部署证据
        blocks:
          - type: paragraph
            body: >-
              Aikido 的客户采用轨迹呈现快速的多渠道势头，公司称全球团队数已超过 100,000，2025 年收入约增长五倍，客户基础接近增长三倍。第三方行业分析师 Frost & Sullivan 授予 Aikido
              2026 年应用安全态势管理（ASPM）全球客户价值领导力认可，并指出 Aikido 在 2025
              年上半年年度经常性收入增长超过一倍，同时持续从传统应用安全测试厂商手中赢得竞争性替代。独立软件追踪数据库和技术画像审计也印证了显著的企业采用，记录了 Visma、Supermetrics 和 n8n
              等组织的多年期部署。部署证据显示，客户组织通常能快速获得运营价值：由于原生集成 Git 提供商、CI/CD 流水线和云环境，扫描经常在数小时内覆盖仓库，而非需要数月。例如，n8n 报告安全告警噪声约下降
              92%，并将发现结果集成到 Linear 工单中，以执行修复服务级协议；Supermetrics 报告称，把自动分流嵌入构建流水线和 Slack 通知后，噪声约下降
              75%。此外，英国政府内阁办公室等公共部门实体也已开始评估或部署
              Aikido。尽管存在这些高知名度生产部署，公开指标仍缺少明确的活跃开发者席位数、每日活跃流水线使用率和已验证的合同量分布，因而无法精确区分自助免费团队与高 ARR 企业账户。
