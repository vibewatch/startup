      - CV012
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 说明性估值敏感性
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 2025 年 $13M 收入估算得到核实；披露的五倍增长转化为持久的付费 cohort，且并购整合成功
        - $455M-$1.0B，即 $13M 收入估算的约 35 倍至 76.9 倍
        - 只有经审计的增长质量、留存、利润率和现金转化得到验证后才会增强
        - 增长仍停留在 headline 使用量，缺少付费客户或留存证明
      - - 基准
        - 增长仍然强劲但趋于正常化；定价压力限制倍数的持久性
        - $286M-$455M，即 $13M 收入估算的约 22 倍至 35 倍
        - 实际成交价格保持稳定，且主要财务数据与估算对账后，信号会增强
        - 折扣扩大，或整合使有机增长难以辨认
      - - 悲观
        - 收入估算被高估，或增长质量走弱，同时竞争和整合成本上升
        - $130M-$286M，即 $13M 收入估算的约 10 倍至 22 倍
        - 出现 down round、留存疲弱或惩罚性融资条款时，信号会增强
        - 现金需求或优先权把下行风险转嫁给普通股和次级投资者
    notes: >-
      仅为机械敏感性分析。10 倍、22 倍、28 倍和 35 倍锚点来自低信誉画像中的 Tenable（2018 年）、CrowdStrike（2019 年）、Okta（2017 年）和 SentinelOne（2021 年）历史
      IPO 市销率；它们不是当前交易倍数，也不是可直接比较的估值。
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
