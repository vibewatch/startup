      - number: '7.3'
        title: 合作伙伴、交易对手与平台依赖
        blocks:
          - type: paragraph
            body: >-
              Aikido Security 在架构和运营上高度依赖第三方云基础设施供应商、版本控制平台以及公开的开源软件包注册 库。平台通过 GitHub、GitLab
              和主要云服务商提供的集成应用程序接口（API），直接接入开发者的软件开发 生命周期。平台 API 发生破坏性变更、受到速率限制，或代码托管垄断者突然调整政策，都会立即卡住客户的扫描
              编排和拉取请求自动化。在软件供应链一侧，Aikido 的威胁情报引擎持续监控 npm、PyPI、Cargo 等开源包
              仓库，寻找恶意组件和拼写仿冒包。如果无法对每天数十万次包发布实时摄取并维护威胁情报源，企业客户就 可能在自动检测规则同步前暴露于零日供应链植入。竞争和交易对手层面，Aikido 的统一自助定价模式——付费
              商业层级每月起价 $350——在高端企业采购中，面对 Legit Security 等应用安全态势管理厂商的激烈竞争。
              这些老牌厂商采用定制报价的企业订阅模式，提供定制专业服务、深度的旧扫描器编排和专属客户成功经理。 企业买方在复杂混合云环境中评估总拥有成本时，除非 Aikido 能证明其定制连接器深度、旧扫描器编排和严格的
              企业服务级别协议达到同等水平，否则可能被采购流程排除。
