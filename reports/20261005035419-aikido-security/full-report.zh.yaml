            body: >-
              Aikido 有后期阶段信号，但没有公开的退出准备度。独角兽轮融资、Frost & Sullivan 的认可，以及据报道 $70 million 收购
              Root，都说明它能获得资本、也有战略野心；但这些不能证明其已准备好 IPO、现金可用、收购资金 结构清晰，或已达到盈利规模。公开描述显示，Root 是 Aikido 在一年多时间里的第四笔收购，因此更需要检验
              整合经济性和有机留存。投资判断前，投资者应取得审计报表、收入到 ARR 的对账、队列 GRR 和 NRR、客户集中度、 现金与续航、收购对价、B
