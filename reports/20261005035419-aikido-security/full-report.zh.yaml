  - id: FE001
    title: 产品架构图
    type: stack
    summary: Aikido Security 开发者安全平台分层的软件与运营架构，覆盖源码集成、分析引擎、自主执行沙箱和合规治理。
    approximationNotes: 逻辑架构表示，依据官方产品文档、白盒渗透测试架构披露和 ISO 42001 治理备案整理。
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE007
      - CE008
      - CE012
      - CE014
      - CE016
    data:
      layers:
        - label: 开发者界面与工具链集成
          detail: 只读集成连接 SCM 仓库（GitHub、GitLab、Bitbucket）、CI/CD 构建流水线、IDE 扩展和通知钩子（Slack、Jira、Linear），用于内嵌 PR 反馈和 AutoFix 建议。
        - label: 静态分析与依赖验证引擎
          detail: 核心 AST 扫描引擎覆盖 SAST、SCA 依赖映射、SBOM/XBOM 生成、容器检查、机密检测和 IaC 验证，支持现代语言（JS/TS、Python、Go、Java、.NET、PHP）。
        - label: 上下文风险图与可达性关联器
          detail: 多维图数据库将静态代码库漏洞与云基础设施暴露面、容器运行时遥测和实时网络可达性关联起来，消除不可达告警噪声。
        - label: 自主智能体渗透测试平面（Aikido Attack 与 Infinite）
          detail: 编排式多智能体攻防测试引擎，部署数百个自主智能体执行白盒 Web/API 漏洞利用、攻击路径绘制和经验证的 PoC 验证，并逐步复现。
        - label: 执行沙箱与技术护栏（Aikido Machine）
          detail: 隔离式沙箱环境执行严格的网络层面范围控制，完全禁止开放互联网访问，按负载限流，并支持可选的本地内网隔离部署。
        - label: 治理、可审计性与合规框架
          detail: 通过 ISO 42001 认证的 AI 治理管理系统、不可篡改的请求审计日志、不使用客户代码训练的保证，以及针对 SOC 2、ISO 27001 和 HIPAA 的自动化合规映射。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示 Aikido Security 平台生命周期中的客户采用触点、扩张循环和潜在流失阻力点。
    data:
      items:
        - label: 1. 落地与发现
          description: 开发者通过免费层或自助式 CI/CD 流水线集成试用产品，扫描最初接入的代码仓库，寻找高优先级漏洞。
          touchpoints:
            - GitHub / GitLab 仓库连接器
            - 免费层自动扫描
            - IDE 插件（VS Code / JetBrains）
        - label: 2. 降噪与分诊
          description: 工程团队使用可达性分析和 AI AutoTriage，消除多达 85-92% 的不可利用漏洞告警。
          touchpoints:
            - 实时漏洞仪表板
            - Slack / Teams 通知路由
            - Linear / Jira 自动建单
        - label: 3. 嵌入工作流
          description: 安全与 DevOps 负责人要求执行拉取请求门禁，并为 SOC 2 和 ISO 标准自动收集合规证据。
          touchpoints:
            - PR 阻断与自动修复
            - Drata / Vanta 合规同步
            - 共享 Slack 支持频道
        - label: 4. 多模块扩张
          description: 客户将合同范围从 SAST/SCA 扩展到云安全态势（CSPM）、容器运行时安全和 AI 渗透测试。
          touchpoints:
            - 多云基础设施连接器
            - 容器注册表扫描
            - 智能体渗透测试执行
        - label: 5. 企业与组合推广
          description: 中央平台团队或私募股权运营团队通过结构化上线流程，将 Aikido 部署到所有运营子公司。
          touchpoints:
            - 企业集团管理控制台
            - 定制 SLA 与政策治理
            - 专属客户成功工程师
        - label: 6. 续约与流失风险
          description: 年度合同续约要看开发者生产力、工单解决速度，以及相较于传统套件的总拥有成本。
          touchpoints:
            - 高管报告审阅
            - 风险账户跟进
            - 采购合同续签
    approximationNotes: 综合厂商工作流架构、客户案例实施情况和客户成功岗位招聘要求整理。
    claimRefs:
