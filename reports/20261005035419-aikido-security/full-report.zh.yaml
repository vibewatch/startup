              Aikido 将自主智能体推理与可选白盒代码访问结合，以此区分其进攻性安全工具。厂商研究称，这种组合比单独使用灰盒测试多发现最多 7x 的漏洞。在 Tyro Payments
              等真实企业评估中，平台把数周的人工测试压缩为 5.5 小时，同时发现多 6x 的漏洞，并提供可执行的复现步骤。
