  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              Aikido Security
              处于面向开发者的应用安全测试和态势管理领域，受日益严格的国际数据隐私、网络安全韧性和医疗合规法规约束。其中最突出的是构建时来源要求与静态依赖解析之间的架构摩擦。包括欧盟网络韧性法案和联邦采购标准在内的新兴软件供应链法规，越来越要求可验证地记录软件构建期间实际获取和执行的包，而不是只解析仓库清单和锁文件中的声明式列表。由于
              Aikido
              主要根据清单和锁文件建立软件依赖图，受严格供应链审计约束的企业客户若不在平台旁部署额外的构建级遥测或包代理，就会面临技术合规缺口。此外，在受监管领域（如美国医疗行业）部署软件的客户，还要承担经《健康信息技术促进经济和临床健康法案》（HITECH）修订的《健康保险流通与责任法案》（HIPAA）所规定的严格法定责任。根据
              HITECH，处理受保护健康信息（PHI）的软件厂商和商业伙伴，对技术防护、强制违规披露和行政审计合规承担直接法定责任。违规会产生分级法定处罚；在故意疏忽情形下，每个违规类别每年罚款从 $100 到 $1.5
              million 不等，并伴随严重声誉损害。尽管 Aikido 已获得 ISO 42001 AI 治理认证，医疗和企业 SaaS
              部署仍要求持续证明数据隔离、细粒度审计日志和签署商业伙伴协议，这些要求会限制快速自助采用。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
