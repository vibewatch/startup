  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义、核心模块与运行架构
        blocks:
          - type: paragraph
            body: >-
              Aikido Security
              是一个统一的应用安全态势管理（ASPM）和开发者安全平台，旨在贯穿软件开发生命周期，替代分散的传统单点方案。它不要求开发团队分别维护代码、云基础设施和运行时环境的漏洞扫描器，而是把这些功能整合进一个带自动分流和开发者工作流的安全引擎。产品覆盖静态应用安全测试（SAST）、面向开源依赖和软件供应链完整性的软件成分分析（SCA）、基础设施即代码（IaC）验证、密钥扫描、容器镜像检查、动态应用安全测试（DAST）和自主
              AI 渗透测试。

              从架构上看，平台采用混合部署模式，将中央云管理平面与扫描执行层解耦。开发团队通过 GitHub、GitLab 和 Bitbucket 的只读 API，将 Aikido 接入源代码管理（SCM）系统；同时也可接入
              CI/CD
              持续集成流水线、通过命令行工具接入本地开发环境，以及接入云基础设施平台。扫描子系统使用专门的静态和运行时解析器，把发现结果送入集中式风险图谱。该图谱将代码发现与实时云运行时暴露、可达路径和资产元数据关联起来，优先处理真实且可利用的安全缺陷，而不是无行动价值的告警。

              为进行进攻性安全验证，Aikido 推出了 Aikido Attack 及其持续运行版本 Aikido Infinite。AI
              渗透测试架构把规划和推理与目标执行分开。自主控制平面编排多智能体测试执行计划，各工作智能体则在隔离且范围受限的执行沙箱中运行。这些沙箱执行严格护栏：智能体没有开放的出站互联网访问，以降低提示注入和数据外泄风险；它们只向明确列入允许列表的预发布和目标环境发出受速率限制、考虑负载的请求。对于受严格数据驻留要求约束或运行在隔离
              VPC 中的客户，Aikido Machine 可让持续 AI 渗透测试引擎完全在客户私有网络内本地运行，无需云连接。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
