      - number: '3.2'
        title: 能力广度与检测深度
        blocks:
          - type: paragraph
            body: >-
              Aikido 最有力的已记录主张是整合：一套工作流覆盖多个应用安全领域，并由公司自称具备 AI
              分流、可达性分析和自动化修复。一家竞争对手将其模式大部分描述为在成熟开源扫描器之上做编排和去重；另一家竞争对手则认为，直接依赖可达性、大型仓库性能和企业控制会在规模化时成为约束。这些是值得检验的负面假设，并非独立的技术结论。RFP.wiki
              同样描述其 AST 覆盖广泛，但建议买方在自己的技术栈上验证高级测试深度和集成成熟度。因此，概念验证（PoC）应在相同仓库上测量覆盖率、扫描延迟、误报处置、传递依赖可达性和修复接受率。在有此类基准之前，既不能把
              Aikido 所称的噪声下降，也不能把竞争对手关于自身优势的主张当作已验证的比较性能。
