  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前遗留工作流
      - 公司方案
      - 可量化收益
      - 局限 / 边界情况
    rows:
      - - 拉取请求合并前的代码安全审查
        - 开发者审阅含数百个误报的静态分析扫描结果；安全团队手动审查差异。
        - Aikido Deep PR Review 和 AI AutoFix 直接在 GitHub/GitLab PR 中提供行内评论与带上下文的代码补丁。
        - 减少告警分诊积压；在编写代码时自动给出带上下文的修复建议。
        - 复杂的定制架构模式和遗留单体框架可能产生边界误报，需要手动覆盖规则。
      - - 第三方开源风险与 SBOM 管理
        - 定期执行 SCA 扫描，不论运行时是否调用，都会生成未排序的漏洞依赖清单。
        - 具备可达性感知的 SCA 扫描，检查应用是否实际调用了存在漏洞的软件包函数。
        - 消除未使用依赖代码的告警，将报告中的漏洞积压最多削减 90%。
        - 可达性分析精度取决于动态语言的运行时绑定与反射模式。
      - - 定期合规与发布前渗透测试
        - 每年或每季度进行人工渗透测试，成本达数万美元，耗时 2 至 4 周。
        - Aikido Attack 部署自主代理，在数小时内执行白盒测试，并提供可验证的 PoC 漏洞利用链。
        - Tyro Payments 基准测试显示，测试在约 5.5 小时内完成；人工测试员需约 15 天，分别发现 30 个与 5 个问题。
        - 高度严格的遗留框架（如 PCI DSS 11.4 的严格人工条款）中的审计员仍可能要求人工测试员签字。
      - - 面向快速发布周期的持续攻防安全
        - 由于人工渗透测试跟不上每日 / 每周发布频率，发布周期之间会跳过安全测试。
        - Aikido Infinite 随代码发布持续运行自主测试，并在补丁部署后自动复测已识别漏洞。
        - 为高速度团队提供持续覆盖；这些团队中 76% 每周发布，40% 每日发布。
        - 需要准确镜像生产配置的预发布环境，并对测试数据进行脱敏。
    notes: 工作流收益与局限基于客户基准、AST 比较分析及平台自述能力。
