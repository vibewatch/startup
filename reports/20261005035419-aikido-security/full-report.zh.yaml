      - number: '7.2'
        title: 运营可靠性与技术执行风险
        blocks:
          - type: paragraph
            body: >-
              Aikido Security 的统一平台要维持运营完整性，必须在源代码、云配置、容器镜像上高吞吐扫描漏洞，并持续
              自动化渗透测试。核心技术风险在于扫描覆盖面与领域深度之间的取舍：平台把静态分析（SAST）、软件成分 分析（SCA）、密钥检测、基础设施即代码（IaC）、容器扫描和动态渗透测试集中到一个仪表盘后，相比专门
              的细分扫描器，更可能报出假阴性，或暴露未经验证的可利用路径。自动化渗透测试和运行时代理执行中， 漏洞利用验证不当，或自动修复脚本过于激进，都可能让客户的持续集成流水线意外中断或降级。开发者优先
              的采用路径还带来严重的误报疲劳：一旦可达性过滤无法压掉不可利用漏洞，开发者历来就可能绕过安全门禁， 或未经协调地停用扫描器。平台的自动代理工作流，例如多代理渗透测试和 AutoFix 拉取请求生成，也会引入
              非确定性的代码修改风险，生产部署前必须人工复核。独立用户评价显示，开发者认可其减少分诊噪声、上手 快；但企业评估者经常指出，平台较新的能力、导出限制和不成熟的治理流程，仍需搭配其他扫描器才能做到 全面的运营保障。
