company:
  name: "Aikido Security"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Aikido's January 2026 Series B set a $1 billion valuation after the company
    reported fivefold revenue growth, but the assigned public evidence does not
    disclose audited revenue, ARR, margins, retention, cash, burn, or preference
    terms. The price therefore screens as stretched and supports a track /
    research-more recommendation rather than an invest decision.
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and Price Discipline"
    body: >-
      The recommendation is track / research more, with medium-low confidence,
      high underwriting risk, and a stretched valuation stance. Aikido announced
      a $60 million Series B at a $1 billion valuation in January 2026, and
      independent coverage repeated the financing terms. The same evidence set
      reports rapid growth, but it does not provide audited revenue, ARR, gross
      margin, retention, cash, burn, or the security and preference terms needed
      to price a late-stage investment. AInvest's third-party $13 million 2025
      revenue figure implies about 76.9x revenue at the round mark; it is not ARR
      and is not company-audited. Until management reconciles that estimate to
      primary financials, the headline price is a financing mark rather than a
      defensible intrinsic-value conclusion.
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV015"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The thesis rests on unusually fast reported commercial adoption and a
      consolidated developer-security proposition. Aikido said revenue grew
      fivefold and its customer base more than tripled during the year before the
      Series B; its 2024 Series A evidence also shows that the developer-led motion
      had already reached thousands of organizations. The anti-thesis is that the
      public denominators are not comparable: 3,000 customers or organizations in
      2024 cannot be bridged to more than 100,000 "teams" in 2026, and neither
      figure establishes paying customers, cohort retention, or contract value.
      Independent commentary also identifies crowded competition, aggressive
      switching discounts, and platform-absorption risk. Those factors could turn
      adoption into weak pricing power even if top-line growth remains strong.
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV011"
      - "CV012"
      - "CV016"
    tableRefs:
      - "TV002"
    figureRefs: []
  - id: "valuation-scenarios-and-comparables"
    title: "Valuation Scenarios and Comparable Context"
    body: >-
      Public evidence supports a sensitivity analysis, not a point valuation.
      One low-reputation profile lists historical P/S-at-IPO reference points of
      about 10x for Tenable, 22x for CrowdStrike, 28x for Okta, and 35x for
      SentinelOne, while explicitly stating that Aikido's EV/Rev was not
      disclosed. Applying those dated, non-comparable markers to AInvest's $13
      million revenue figure produces a broad $130 million to $455 million
      sensitivity; extending the upper bound to the $1 billion round mark spans
      roughly 35x to 76.9x revenue. These are mechanical reference ranges, not
      appraisals: the companies, IPO vintages, growth profiles, accounting bases,
      and security terms differ. The bull case therefore requires primary proof
      that growth quality can sustain an outlier multiple, while the base and bear
      cases emphasize multiple compression rather than invented forecasts.
    claimRefs:
      - "CV001"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV015"
    tableRefs:
      - "TV003"
    figureRefs: []
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness, Dilution Risk, and Final Diligence"
    body: >-
      Aikido has late-stage signaling but not public exit readiness. The unicorn
      round, recognition from Frost & Sullivan, and a reported $70 million Root
      acquisition demonstrate access to capital and strategic ambition; they do
      not prove IPO readiness, cash availability, acquisition funding mix, or
      profitable scale. The Root transaction was described as Aikido's fourth
      acquisition in just over a year, increasing the need to test integration
      economics and organic retention. Before underwriting, investors should
      obtain audited statements, a revenue-to-ARR reconciliation, cohort GRR and
      NRR, customer concentration, cash and runway, acquisition consideration,
      the post-Series-B cap table, liquidation preferences, anti-dilution rights,
      and secondary components. Thesis-break triggers are a down round, worsening
      discounting, failed cohort retention, or acquisition costs that outpace
      verified operating leverage.
    claimRefs:
      - "CV001"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs: []
    figureRefs: []
