        - "Audited revenue bridge and durable cohort retention would strengthen the thesis"
      - - "Thesis"
        - "Developer-led adoption was visible before the unicorn round"
        - "2024 evidence reported more than 3,000 organizations and 6,000 individual developers"
        - "A paid-customer bridge from 2024 to 2026 would validate conversion quality"
      - - "Thesis"
        - "Capital access supports product and geographic expansion"
        - "$60M Series B at $1B and a later reported $70M Root acquisition"
        - "Disclosure of acquisition consideration and post-deal liquidity would show capacity"
      - - "Anti-thesis"
        - "Headline usage does not establish monetization"
        - "The 2026 claim is 100,000+ teams, a different denominator from customers or organizations"
        - "Paying-customer count, ACV, GRR, NRR, and concentration would resolve the gap"
      - - "Anti-thesis"
        - "Competition can compress price and margins"
        - "Independent analysis cites crowded vendors, aggressive switching discounts, and platform absorption"
        - "Stable realized pricing and gross-margin expansion would weaken this concern"
    notes: >-
      Company-reported teams, customers, organizations, and developers are kept
      as distinct denominators; no conversion between them is assumed.
