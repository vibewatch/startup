  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Case"
      - "Explicit assumptions"
      - "Illustrative valuation sensitivity"
      - "Probability signal"
      - "Downside trigger"
    rows:
      - - "Bull"
        - "The $13M 2025 revenue estimate is verified; reported fivefold growth converts into durable paid cohorts and acquisition integration succeeds"
        - "$455M-$1.0B, or about 35x-76.9x the $13M revenue estimate"
        - "Strengthens only with audited growth quality, retention, margins, and cash conversion"
        - "Growth remains headline usage without paid-customer or retention proof"
      - - "Base"
        - "Growth remains strong but normalizes; pricing pressure limits multiple durability"
        - "$286M-$455M, or about 22x-35x the $13M revenue estimate"
        - "Strengthens if realized pricing holds and primary financials reconcile to the estimate"
        - "Discounting expands or integration obscures organic growth"
      - - "Bear"
        - "The revenue estimate is overstated or growth quality weakens while competition and integration costs rise"
        - "$130M-$286M, or about 10x-22x the $13M revenue estimate"
        - "Strengthens if a down round, weak retention, or punitive financing terms appear"
        - "Cash needs or preferences transfer downside to common and junior investors"
    notes: >-
      Mechanical sensitivity only. The 10x, 22x, 28x, and 35x anchors are
      historical P/S-at-IPO figures for Tenable (2018), CrowdStrike (2019), Okta
      (2017), and SentinelOne (2021) from a low-reputation profile; they are not
      current trading multiples or directly comparable valuations.
    claimRefs:
      - "CV001"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV015"
