evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-capitalization
    missingEvidence: >-
      Current board roster, founder ownership and voting control, option pool, financing preferences, secondary
      transactions, debt facilities, succession plans, and Root consideration terms.
    whyItMatters: >-
      These terms determine control, dilution, downside protection, key-person exposure, and the true cash impact of
      financing and acquisitions.
    diligencePath: >-
      Obtain the fully diluted cap table, charter and voting agreements, board minutes and roster, financing documents,
      debt schedule, succession plan, and Root purchase agreement.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: adoption-scale
    missingEvidence: >-
      A dated reconciliation of organizations, teams, developers, paying customers, and active customers using one
      reporting perimeter.
    whyItMatters: >-
      The public counts use different denominators, so none can be treated as a verified paid-customer count or
      retention indicator.
    diligencePath: >-
      Request a customer cohort schedule showing paid logos, active users, free accounts, additions, churn, and
      denominator definitions by quarter.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: >-
      Audited or management financial statements, ARR bridge, revenue recognition, gross margin, net retention, cash
      balance, accounting loss, and monthly net cash burn.
    whyItMatters: >-
      Revenue is not ARR, accounting loss is not cash burn, and funding raised does not establish current cash or
      runway.
    diligencePath: >-
      Review monthly financial statements, bank statements, revenue cohort schedules, ARR and retention bridges, and
      board-approved operating plan.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited Annual Recurring Revenue (ARR), customer retention rates (NRR/GRR), and detailed enterprise contract
      distribution.
    whyItMatters: >-
      Without audited revenue metrics, the sustainability of Aikido's $1 billion valuation relative to addressable
      market spend cannot be verified independently.
    diligencePath: >-
      Review confidential management presentation, auditor financial statements, and customer cohort expansion data
      under NDA.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: independent-comparative-benchmark
    missingEvidence: >-
      An arms-length head-to-head benchmark of Aikido and shortlisted alternatives using identical repositories,
      policies, scan modes, and remediation acceptance criteria.
    whyItMatters: >-
      The retained performance, reachability, and governance comparisons are issued by Aikido or its competitors and
      cannot establish relative detection quality.
    diligencePath: >-
      Run a controlled proof of concept and retain raw findings, false-positive dispositions, scan-duration logs,
      transitive call-path evidence, and accepted remediation outcomes.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-switching
    missingEvidence: >-
      Comparable enterprise quotes, discount schedules, implementation costs, renewal terms, win-loss data, and customer
      migration evidence.
    whyItMatters: >-
      Public pricing units are heterogeneous and cannot establish realized total cost, switching friction, or
      displacement rates.
    diligencePath: >-
      Obtain normalized quotes for the same repositories and users, then reference-check customers that adopted,
      expanded, replaced, or multi-homed each platform.
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Consolidated audited income statement, balance sheet, and statement of cash flows for FY2024 and FY2025.
    whyItMatters: >-
      Essential to verify exact GAAP revenue recognition, recognized gross margin, cloud infrastructure hosting costs,
      and operating burn rate.
    diligencePath: Obtain consolidated management financial packages under non-disclosure agreement during formal investor diligence.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: Historical Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and customer cohort churn curves.
    whyItMatters: >-
      Determines whether explosive 5x top-line growth is driven by recurring platform stickiness or temporary one-time
      onboarding wins.
    diligencePath: Request customer cohort retention and account expansion schedules from company finance leadership.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: contract-discounting
    missingEvidence: >-
      Schedule of enterprise contract discounts, list vs. realized average contract values (ACVs), and multi-year
      renewal terms.
    whyItMatters: >-
      Identifies whether reported contract wins depend on aggressive switching discounts that compress unit gross
      margins.
    diligencePath: >-
      Review sales commission schedules, enterprise discount authorization matrices, and representative master services
      agreements.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer signal metrics from public package repositories, open-source rule repositories, or developer
      community forums evaluating technical ergonomics and scanner CLI adoption.
    whyItMatters: >-
      Developer adoption and bottom-up developer sentiment are central to Aikido's self-securing software thesis and
      ASPM market positioning.
    diligencePath: >-
      Review public GitHub repository release cadence, VS Code / JetBrains marketplace plugin download statistics, and
      practitioner discussions on Reddit or Hacker News.
    relatedQuestionRefs:
      - QE008
  - id: EG002
    type: conflicting-data
    severity: minor
    topic: independent-benchmarks
    missingEvidence: >-
      Third-party, audited head-to-head detection accuracy benchmarks comparing Aikido SAST, DAST, and AI Pentesting
      against Snyk, Checkmarx, and specialized penetration testing tools.
    whyItMatters: >-
      Current performance claims (e.g. 7x vulnerability discovery in whitebox mode, 90% noise reduction) are
      vendor-published and have not been validated by independent academic or testing labs.
    diligencePath: >-
      Request customer proof-of-concept benchmark data, OWASP Benchmark suite execution scores, or blinded third-party
      efficacy evaluations.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention and cohort durability
    missingEvidence: >-
      Audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn rates across enterprise and
      self-serve customer tiers.
    whyItMatters: >-
      Without verified retention metrics, customer lifetime value and the durability of the $1 billion valuation cannot
      be confirmed independently.
    diligencePath: >-
      Request confidential SaaS cohort retention tables, customer expansion waterfalls, and historical logo renewal logs
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table
    missingEvidence: >-
      Exhaustive roster of enterprise customer contracts, annual recurring revenue distribution, and customer
      concentration percentages.
    whyItMatters: >-
      Public case studies highlight successful production deployments but omit failed pilots, POC conversion ratios, and
      customer concentration.
    diligencePath: >-
      Inspect commercial sales pipeline reports and top-20 customer ARR contribution schedules during management
      diligence.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: build-time-provenance-telemetry
    missingEvidence: >-
      Technical documentation or benchmark testing detailing whether Aikido plans native runtime package proxy
      interception to satisfy Cyber Resilience Act build provenance requirements.
    whyItMatters: >-
      Regulated enterprise buyers subject to EU CRA or federal software supply chain mandates may disqualify static
      manifest-based scanners.
    diligencePath: Request confidential architectural roadmap on build-step provenance and proxy-based egress validation.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: minor
    topic: enterprise-churn-and-bypass-telemetry
    missingEvidence: Aggregated enterprise client statistics on security gate override frequency and developer exception rates.
    whyItMatters: High gate-override frequency indicates residual developer friction that undermines platform stickiness.
    diligencePath: >-
      Obtain anonymized telemetry on CI/CD gate block rates versus developer manual override rates across enterprise
      accounts.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: primary-financials
    missingEvidence: >-
      Audited revenue and ARR bridge, gross margin, GRR, NRR, customer concentration, operating cash flow, cash balance,
      and runway.
    whyItMatters: >-
      The public revenue estimate and growth claims cannot establish valuation support, capital efficiency, or target
      returns.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, billing exports, cohort schedules, bank statements, and
      board-approved forecasts.
    relatedQuestionRefs:
      - QV010
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Post-Series-B cap table, security type, primary-versus-secondary split, liquidation preferences, participation,
      anti-dilution, and pro-rata rights.
    whyItMatters: Headline valuation does not reveal dilution, preference overhang, or proceeds available to the company.
    diligencePath: Review the signed term sheet, capitalization table, charter, investor-rights agreement, and funds-flow statement.
    relatedQuestionRefs:
      - QV007
      - QV010
  - type: missing-source
    severity: material
    topic: comparable-valuation
    missingEvidence: >-
      Current audited operating metrics and transaction-level private comparable terms for genuinely similar
