companyProfile:
  summary: >
    Aikido Security is a Belgium-founded developer-security platform that unifies code, cloud, runtime, supply-chain,
    and automated penetration-testing workflows into one B2B SaaS offering. It says it has raised $85 million in total,
    and January 2026 reporting placed its Series B at a $1 billion valuation. Retained public evidence shows fast growth
    and broad product breadth, but the company still does not disclose enough operating economics to underwrite ARR,
    margins, cash burn, or capitalization terms with confidence.
