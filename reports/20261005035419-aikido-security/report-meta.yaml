    - Paid-customer denominator and customer concentration
    - Gross margin, NRR/GRR, and services-versus-subscription mix
    - Post-Series-B cap table, liquidation preferences, and investor control terms
    - Benchmark evidence and operational parity for AI pentesting and on-premises deployments
