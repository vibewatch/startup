  topStrengths:
    - Unified developer-first security suite spanning code, cloud, runtime, supply chain, and AI pentesting.
    - Rapid scaling, with reported fivefold revenue growth and a January 2026 $1 billion Series B.
    - Strong enterprise credibility from named customer logos, ISO 42001 certification, and broad product breadth.
  topRisks:
    - The implied valuation multiple is stretched relative to retained public revenue evidence.
    - ARR, margins, NRR, burn, and capitalization terms remain undisclosed.
    - >-
      Platform, hosting, and compliance dependencies can create execution and delivery risk as the product surface
      expands.
    - Paid-customer counts and customer concentration remain ambiguous, limiting cohort-quality underwriting.
  unresolvedGaps:
