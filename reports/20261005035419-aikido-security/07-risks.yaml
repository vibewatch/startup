chapter:
  number: 7
  title: "Risks"
  summary: "Aikido Security faces critical architectural and compliance exposures stemming from manifest-only dependency resolution under emerging European regulations such as the Cyber Resilience Act, alongside severe liability risks under HIPAA and enterprise procurement friction where custom-quoted incumbents like Legit Security contest large contracts. While the company has achieved rapid commercial scale and ISO 42001 certification, high technical dependencies on underlying cloud hosting, code-hosting platforms, and unvalidated third-party package ecosystems create acute operational vulnerabilities."
sections:
  - id: "regulatory-and-legal-risks"
    title: "Regulatory and Legal Compliance Risks"
    body: "Aikido Security operates in a developer-first application security testing and posture management domain governed by tightening international data privacy, cybersecurity resilience, and healthcare compliance statutes. Foremost among these is the architectural friction between build-time provenance requirements and static dependency parsing. Emerging software supply chain regulations, including the European Union Cyber Resilience Act and federal procurement standards, increasingly require verifiable records of packages actually fetched and executed during software builds rather than declarative lists parsed from repository manifests and lockfiles. Because Aikido primarily builds its software dependency map from manifests and lockfiles, enterprise customers subject to rigorous supply chain audits face technical compliance deficits unless supplemental build-level telemetry or package proxies are deployed alongside the platform. In addition, customers deploying software across regulated domains such as U.S. healthcare encounter strict statutory liability under the Health Insurance Portability and Accountability Act (HIPAA) as modified by the Health Information Technology for Economic and Clinical Health (HITECH) Act. Under HITECH, software vendors and business associates handling protected health information (PHI) face direct statutory liability for technical safeguards, mandatory breach disclosures, and administrative audit compliance. Violations carry tiered statutory penalties ranging from $100 up to $1.5 million per violation category annually for willful neglect, alongside severe reputational damage. While Aikido has obtained AI governance certification under ISO 42001, healthcare and enterprise SaaS deployments demand continuous proof of data isolation, granular audit logging, and signed Business Associate Agreements that constrain rapid self-serve adoption."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
    tableRefs:
      - "TR001"
  - id: "operational-and-technical-risks"
    title: "Operational Reliability and Technical Execution Risks"
    body: "The operational integrity of Aikido Security's unified platform depends on high-throughput vulnerability scanning across source code, cloud configurations, container images, and continuous automated penetration testing. A central technical failure mode arises from scanner breadth versus deep domain specialization: by combining static analysis (SAST), software composition analysis (SCA), secrets detection, infrastructure as code (IaC), container scanning, and dynamic penetration testing across a single dashboard, the platform risks surfacing false negatives or unvalidated exploitability paths when compared against dedicated niche scanners. In automated penetration testing and runtime agent execution, improper exploit validation or overly aggressive automated remediation scripts can cause unexpected operational disruption or service degradation within client continuous integration pipelines. Furthermore, developer-first adoption exposes Aikido to severe false-positive fatigue if reachability filtering fails to suppress non-exploitable vulnerabilities, which historically causes developer bypass of security gates or uncoordinated scanner deactivation. The platform's automated agentic workflows, such as multi-agent penetration testing and AutoFix pull-request generation, also introduce non-deterministic code modification risks that require human review before production deployment. While independent user reviews indicate positive developer sentiment regarding triage noise reduction and rapid setup, enterprise evaluators frequently report that younger platform capabilities, export limitations, and immature governance workflows require complementary scanners to achieve exhaustive operational assurance."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "partner-and-dependency-risks"
    title: "Partner, Counterparty, and Platform Dependencies"
    body: "Aikido Security maintains fundamental architectural and operational dependencies on third-party cloud infrastructure providers, version control platforms, and public open-source software package registries. The platform connects directly into developer software development lifecycles via integration application programming interfaces (APIs) provided by GitHub, GitLab, and major cloud service providers. Any breaking changes to platform APIs, rate-limiting constraints, or sudden policy shifts by code-hosting monopolists pose immediate operational bottlenecks for customer scan orchestration and pull-request automation. On the software supply chain front, Aikido's threat intelligence engine continuously monitors open-source package repositories including npm, PyPI, and Cargo for malicious components and typosquats. Inability to maintain real-time ingestion and threat intelligence feeds across hundreds of thousands of daily package releases leaves enterprise clients exposed to zero-day supply chain insertions before automated detection rules synchronize. From a competitive and counterparty perspective, Aikido's flat self-serve pricing model—starting at $350 per month on paid commercial tiers—faces aggressive friction in upmarket enterprise procurement against incumbent application security posture management vendors such as Legit Security. Incumbents deploy custom-quote enterprise subscription models with bespoke professional services, deep legacy scanner orchestration, and dedicated customer success managers. When enterprise buyers evaluate total cost of ownership across complex hybrid-cloud estates, Aikido risks procurement exclusion unless it successfully demonstrates parity in custom connector depth, legacy scanner orchestration, and strict enterprise service level agreements."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
