callouts:
  - calloutType: "insight"
    title: "Portfolio Rollout Architecture as an Enterprise GTM Force Multiplier"
    body: "Aikido's rapid scaling into enterprise-tier seat volumes is uniquely powered by private equity and holding company sponsorships. Rather than acquiring enterprise accounts through protracted individual RFP cycles, partnerships with groups like Visma (200+ software subsidiaries) and PSG Equity (130+ portfolio companies) enable Aikido to onboard thousands of developers through structured, top-down onboarding programs. This model compresses customer acquisition cost and accelerates ASPM platformization across fragmented developer environments."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU007"
  - calloutType: "risk"
    title: "Retention Opacity and Mid-Market Account Churn Vulnerabilities"
    body: "While top-of-funnel indicators highlight over 100,000 teams and 3x customer growth, the absence of public Net Revenue Retention (NRR) and logo retention benchmarks remains a diligence vulnerability. Third-party evaluations from RFP.wiki highlight that Aikido's platform is young and lacks legacy-suite reporting depth, while active hiring for Australia Customer Success Engineers to explicitly manage 'accounts at risk' demonstrates that proactive intervention is required to defend against churn in fast-evolving development environments."
    claimRefs:
      - "CU010"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
