  title: "Customers"
  summary: "Aikido Security demonstrates rapid adoption across developer-centric technology organizations, private equity software portfolios, and mid-market engineering teams, supported by verifiable reductions in alert noise and streamlined compliance workflows. However, while top-line growth indicators claim over 100,000 teams and portfolio-wide deployments across Visma and PSG Equity, contractual retention metrics (NRR/GRR), churn rates, and customer concentration figures remain undisclosed private metrics."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Customer Segmentation and Buyer Dynamics"
    body: "Aikido Security segments its commercial and open adoption across three distinct customer tiers: high-growth technology companies and digital natives, private equity software rollups and holding groups, and mid-market organizations scaling compliance-driven security programs. In the digital-native and high-velocity engineering segment, buyers are typically heads of engineering, chief technology officers, or application security leads seeking to prevent developer friction and alert fatigue caused by legacy security suites. Representative adopters such as workflow automation platform n8n, financial technology provider Revolut, and spatial computing platform Niantic deploy Aikido across code repositories, container builds, and infrastructure configurations to maintain deployment speed. In the private equity and group portfolio tier, buyers operate at an executive or portfolio-wide operating level, deploying Aikido across dozens of independent operating subsidiaries to establish standardized visibility without imposing heavy manual implementation overhead. Exemplifying this model, Visma deployed Aikido across more than 200 portfolio companies encompassing over 6,000 developers, and Providence Strategic Growth (PSG) Equity rolled out the platform across 130 portfolio companies using a structured enterprise onboarding model. In the third segment, mid-market enterprises and professional services firms utilize Aikido to unify vulnerability discovery and satisfy audit frameworks such as SOC 2 and ISO 42001, routing findings directly into issue tracking systems like Linear, Jira, and Slack channels. However, commercial contract terms differ markedly across these segments: self-serve teams utilize transparent tier-based pricing with a free entry tier, whereas holding groups and large enterprise deployments negotiate custom modular packages whose realized contract values, minimum commitments, and platform discounts remain private."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-proof"
    title: "Adoption Trajectory and Named Deployment Evidence"
    body: "Aikido's customer adoption trajectory exhibits rapid multi-channel momentum, highlighted by company claims of reaching over 100,000 teams globally and achieving roughly fivefold revenue expansion alongside a near-tripling of its customer base during 2025. Third-party industry analyst Frost & Sullivan recognized Aikido with the 2026 Global Customer Value Leadership Recognition in Application Security Posture Management (ASPM), noting that Aikido more than doubled its annual recurring revenue in the first half of 2025 and sustained significant competitive replacements against traditional application security testing vendors. Independent software tracking databases and technographic audits corroborate substantial enterprise adoption, recording multi-year deployments at organizations including Visma, Supermetrics, and n8n. Deployment evidence highlights that customer organizations achieve rapid operational time-to-value, frequently deploying scanning across repositories within hours rather than months due to native integrations with Git providers, CI/CD pipelines, and cloud environments. For instance, n8n reported an approximate 92% reduction in security alert noise and integrated findings into Linear tickets to enforce remediation service-level agreements, while Supermetrics reported an approximate 75% noise reduction when embedding automated triage into build pipelines and Slack notifications. Furthermore, public sector interest has surfaced, with governmental entities such as the Cabinet Office of the United Kingdom evaluating or deploying Aikido. Despite these high-profile production deployments, public metrics lack clear active developer seat counts, daily active pipeline utilization rates, and verified contract volume distributions, obscuring the precise boundary between self-serve free teams and high-ARR enterprise accounts."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-concentration-risks"
    title: "Retention Durability, Expansion Loops, and Concentration Risks"
    body: "The long-term durability of Aikido's commercial relationships is supported by natural expansion surfaces across software modules, developer seats, and multi-cloud environments, but faces structural headwinds from lack of disclosed cohort retention data. Aikido's land-and-expand motion typically initiates with static application security testing (SAST), software composition analysis (SCA), or secrets detection before expanding into cloud security posture management (CSPM), runtime container protection, and agentic AI penetration testing. In multi-company holding structures such as Visma and PSG Equity, expansion occurs horizontally as initial pilot subsidiaries validate time savings and prompt centralized platform teams to onboard additional portfolio entities. However, independent software evaluation benchmarks from RFP.wiki indicate that while Aikido holds strong user sentiment (averaging 4.7 out of 5 stars across 234 reviews) and achieves a 4.4 out of 5.0 feature score, the platform remains young and lacks legacy-suite governance, custom reporting depth, and publicly auditable uptime, revenue, or net promoter score (NPS) records. Operational evidence from active hiring records indicates that customer success and retention management are critical investment priorities as the firm expands geographically; for example, Aikido explicitly opened dedicated Customer Success Engineer roles in Australia to engage with 'accounts at risk' to prevent churn and protect customer value realization. From an investment risk perspective, the absence of public net revenue retention (NRR), gross revenue retention (GRR), and logo churn figures creates an information gap, leaving the durability of Aikido's $1 billion valuation dependent on private audit verification of customer renewal economics and potential contract concentration within its sponsor-backed equity portfolios."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
