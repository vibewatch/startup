  - id: channel-enterprise-reach
    title: Microsoft, AWS, and Partner Channel Enterprise Reach
    body: >
      XBOW's enterprise addressability has expanded materially in 2026 through two distribution partnerships
      that make the platform accessible through channels enterprises already use.

      In March 2026, XBOW announced integration with Microsoft Security Copilot and Microsoft Sentinel data
      lake, available as a public preview at RSAC 2026. The integration was built in collaboration with Microsoft
      and enables global enterprises to discover, validate, and prioritize vulnerabilities from within Microsoft
      consoles without configuring a separate vendor workflow. The solution includes three components: the
      XBOW Pentest Manager Agent (initiates and manages pentests from Security Copilot), the XBOW Sentinel
      Connector (ingests validated findings into Sentinel data lake custom tables), and the XBOW Pentest Analysis
      Agent (analyzes XBOW findings alongside Sentinel telemetry to identify detection gaps). The integration
      is available via the Microsoft Security Store, Microsoft Marketplace, and the Security Copilot agent
      gallery. Microsoft Corporate VP for Security Platform & AI Shawn Bice stated: "By integrating XBOW's
      autonomous penetration testing into Microsoft Security Copilot and Microsoft Sentinel data lake, we're
      helping our customers across industries connect offensive insights directly into their existing workflows."
      This integration directly addresses the gap between AppSec testing and SecOps workflows that has historically
      limited continuous penetration testing adoption.

      In May 2026, XBOW joined the AWS ISV Accelerate Program, a co-sell program that directly connects
      participating ISVs with AWS field sellers globally. The acceptance requires a comprehensive architectural
      and security review, and XBOW submitted proof of customer excellence as part of the evaluation. The
      company's Chief Revenue Officer Niroshan Rajadurai stated: "AWS customers facing AI-driven attackers
      can now adopt XBOW's autonomous, AI-driven security testing through their existing AWS channels." This
      co-sell arrangement provides XBOW with warm pipeline introduction to the large AWS enterprise customer
      base without requiring XBOW to build its own field sales organization at the same pace as its product expansion.

      The Accenture investment partnership (May 2026) embeds XBOW in Accenture Cyber.AI, Accenture's
      managed security service offering. This creates a system-integrator-mediated distribution channel in
      which XBOW reaches enterprise clients who procure offensive security services through Accenture rather
      than as a direct SaaS subscription. Samsung's role as preferred reseller in South Korea, bolstered by
      DNX Ventures' Asia-Pacific network from the Series C Extension, gives XBOW its first dedicated distribution
      channel in a high-growth APAC market.

      Together these three channel arrangements — Microsoft (platform embed), AWS (co-sell), and Accenture
      (SI distribution) — could materially accelerate customer acquisition in regulated enterprise verticals
      where direct sales cycles for a two-year-old product would otherwise be protracted. None of these
      arrangements has yet produced publicly cited customer deployments that came through the channel, so
      the incremental impact on customer count remains an open question.
