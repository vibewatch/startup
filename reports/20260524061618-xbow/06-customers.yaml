      whyItMatters: >-
        Enterprise buyers evaluate XBOW against established RBVM and automated pen-test vendors.
        If Pentera or Horizon3.ai have substantially more named enterprise references or disclosed
        retention metrics, XBOW's relative market positioning may be weaker than marketing materials imply.
      diligencePath: >-
        Review Pentera and Horizon3.ai investor materials, G2 profiles, and case study libraries for
