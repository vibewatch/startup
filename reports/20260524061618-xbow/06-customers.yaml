        Samsung has sourced any customer wins through this channel since the arrangement was announced.
      whyItMatters: >-
        Reseller-channel economics differ materially from direct sales; if Samsung takes a large
        margin cut or if the arrangement is non-exclusive and under-resourced, its contribution to
