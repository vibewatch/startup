chapter:
  number: 6
  title: Customers
  summary: >-
    XBOW discloses 100+ enterprise customers globally as of May 2026, with publicly named deployments at
    Moderna, Seznam, PuppyGraph, and BloomPath AI, supplemented by investor-customers including
    SentinelOne, Samsung, and Accenture. Three published case studies confirm production deployments
    with specific technical outcomes, and XBOW's 4.8/5.0 FeaturedCustomers rating from 47 references
    signals early satisfaction. Channel expansion through Microsoft Security Copilot, AWS ISV Accelerate,
    and Accenture Cyber.AI broadens enterprise addressability, but customer proof remains thin: only two
    independent non-investor named customers exist, no NRR/GRR is disclosed, and critic sources identify
    trust barriers and scope limitations that create real adoption friction for regulated enterprise buyers.

sections:
  - id: customer-base-segmentation
    title: Customer Base, Ideal Customer Profile, and Segmentation
    body: >
      XBOW serves more than 100 enterprise customers globally as of May 2026, a figure disclosed
      consistently across the Series C ($120M, March 2026) and Series C Extension ($35M, May 2026)
      funding announcements. The company provides no breakdown by geography, vertical, or tier, making
      detailed segmentation analysis dependent on inference from named customers and investor-customers.

      The publicly named independent customers — Moderna and Seznam — span two very different archetypes.
      Moderna is a Fortune 500 biopharmaceutical company with complex multi-cloud application estates and
      strict life-sciences regulatory exposure; its deployment signals XBOW's viability in regulated, large-enterprise
      environments where software supply chain security is a board-level concern. Seznam is a Czech internet
      company colloquially known as the Google of the Czech Republic; its deployment signals XBOW's
      reach into European technology-sector organizations managing large, publicly-facing web application portfolios.
      No case study details for either Moderna or Seznam have been published, limiting depth of proof for these flagship reference names.

      Published case studies cover two additional customers. PuppyGraph — a developer-first, real-time
      graph query engine serving regulated-industry customers including Coinbase and Clarivate — adopted
      XBOW after it identified a critical authentication bypass and two RCE vulnerabilities missed by their
      prior pentesting provider. BloomPath AI — an AI productivity platform handling sensitive enterprise
      data — used XBOW for a rapid SOC 2 compliance engagement completed in days rather than the
      industry-standard six-week manual process. Both represent early-to-growth-stage technology companies
      whose security needs track closely with XBOW's web application testing strengths.

      The investor-customer overlap is commercially significant. SentinelOne (cybersecurity platform),
      Samsung (global consumer and enterprise technology), and Accenture (global IT services and consulting)
      are all confirmed to be customers of the XBOW platform in addition to investing in the Series C
      Extension. This overlap validates XBOW's mission-critical positioning within enterprise security stacks
      but also introduces a question of representativeness: demand from large, globally sophisticated technology
      buyers is qualitatively different from broad commercial adoption in compliance-driven verticals such as
      financial services or healthcare, where trust barriers and procurement complexity are substantially higher.
