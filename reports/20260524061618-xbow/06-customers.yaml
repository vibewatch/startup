  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-count
      missingEvidence: >-
        Revenue or account breakdown by customer tier, industry vertical, and geography; growth
        trajectory showing when each 25/50/75/100 threshold was crossed.
      whyItMatters: >-
        Without segment-level data, it is impossible to assess whether the 100+ customer count
        represents diverse enterprise adoption or concentration in a narrow buyer profile. Investment
        thesis depends on trajectory, not just current count.
      diligencePath: >-
        Request management deck with ARR breakdown by tier and cohort data showing customer count
        at Q-end for the last 4-6 quarters. Confirm independently with references in each tier.
      relatedQuestionRefs:
        - QU003
        - QU018
        - QU025

    - type: private-evidence-only
      severity: blocking
      topic: retention
      missingEvidence: >-
        NRR, GRR, logo churn rate, and cohort-level revenue retention metrics for any trailing period.
      whyItMatters: >-
        For a subscription/continuous security product operating at a loss, NRR is the primary
        indicator of whether land-and-expand is working and whether ARR is growing organically
        from the existing base. Absence of disclosed NRR is a blocking diligence gap.
      diligencePath: >-
        Request NRR/GRR by cohort and revenue tier from management. Cross-reference with
        renewal invoices or usage data for the named customer set.
      relatedQuestionRefs:
        - QU017
        - QU012
        - QU026

    - type: missing-source
      severity: material
      topic: named-customers
      missingEvidence: >-
        A published case study, executive quote, or quantified security outcome for Moderna —
        the most credible and prominent named enterprise customer.
      whyItMatters: >-
        Moderna's mention without substantive proof limits its value as a reference. A Fortune 500
        biopharmaceutical customer with quantified outcomes would significantly strengthen the
        enterprise-credibility narrative.
      diligencePath: >-
        Request a Moderna reference call or written case study from XBOW management. Alternatively,
        search Moderna investor relations materials for any XBOW mention.
      relatedQuestionRefs:
        - QU006
      relatedTableRefs:
        - TU002

    - type: missing-source
      severity: material
      topic: trust-barriers
      missingEvidence: >-
        XBOW's own platform compliance posture — SOC 2 Type II certification, HIPAA BAA availability,
        data residency options, and scope containment contractual protections for regulated industries.
      whyItMatters: >-
        For healthcare, financial services, and government customers, vendor compliance certification
        is a hard gate in procurement. XBOW's public Trust Center does not confirm SOC 2 Type II;
        confirming or denying this matters for regulated-vertical TAM addressability.
      diligencePath: >-
        Request SOC 2 Type II report and HIPAA BAA template from XBOW. Review xbow.com/security-policy
        and xbow.com/trust-center for any published certifications.
      relatedQuestionRefs:
        - QU014
        - QU023

    - type: enumeration-incomplete
      severity: material
      topic: vertical-concentration
      missingEvidence: >-
        Any named customer in financial services, healthcare, government, or critical infrastructure.
        Current named customer set is entirely concentrated in technology, AI, and cybersecurity verticals.
      whyItMatters: >-
        Regulated verticals are the highest-ACV, longest-contract customers in enterprise security.
        Absence of a single named regulated-industry customer outside of Moderna (no case study)
        leaves XBOW's regulated-vertical TAM as claimed but unproven.
      diligencePath: >-
        Ask XBOW management for 2-3 customer references in regulated verticals. If none exist, adjust
        TAM addressability assumptions for financial services and healthcare downward.
      relatedQuestionRefs:
        - QU023
        - QU024
      relatedTableRefs:
        - TU001

    - type: stale
      severity: minor
      topic: microsoft-channel
      missingEvidence: >-
        Confirmation of Microsoft Security Copilot integration status (generally available vs. still
        public preview) and number of enterprise customers acquired through the Microsoft channel
        since the March 2026 RSAC announcement.
      whyItMatters: >-
        If the integration remains in extended public preview, pipeline conversion to paid customers
        through the Microsoft channel may be slower than the announcement implied.
      diligencePath: >-
        Check Microsoft Security Copilot agent gallery for current status (preview vs. GA).
        Ask XBOW management for pipeline metrics from the Microsoft co-sell channel.
      relatedQuestionRefs:
        - QU019
        - QU020


    - type: missing-source
      severity: minor
      topic: seznam-independent-verification
