        structure between XBOW and Accenture.
      whyItMatters: >-
        If Accenture is XBOW's primary enterprise distribution mechanism, the commercial terms of
        that arrangement substantially affect XBOW's effective enterprise ACV and gross margin
        on SI-channeled revenue.
      diligencePath: >-
        Request the XBOW-Accenture partnership agreement term sheet. Seek Accenture Cyber.AI
        public references for enterprise clients where XBOW was the offensive testing tool.
      relatedQuestionRefs:
