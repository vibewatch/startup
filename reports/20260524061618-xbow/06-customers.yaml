acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TU002 (Named Customer Proof Table) is a factual enumeration of public customer disclosures
      with no estimated or derived cells; notes field documents the partial-coverage caveat as required.
  - dimension: figureType
    reason: >-
      FU004 uses the cohort type as planned, but all values are estimated due to XBOW's non-disclosure
      of NRR/GRR data; approximationNotes document the estimation basis. The cohort figure is retained
      because it illustrates the structural retention signal available from qualitative evidence and
      makes the data gap explicit rather than omitting the retention dimension entirely.
