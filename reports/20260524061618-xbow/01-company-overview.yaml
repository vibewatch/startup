company:
  name: XBOW
chapter:
  number: 1
  title: Company Overview
  summary: >-
    XBOW is a Seattle-registered autonomous offensive security company founded in January 2024 by Oege de Moor,
    creator of GitHub Copilot. The company achieved unicorn status in March 2026 after raising $120M in a Series C
    led by DFJ Growth and Northzone, then added $35M from strategic investors including NVIDIA, Accenture, and Samsung
    in May 2026, bringing total capital raised to over $272M. With 250+ employees, 100+ enterprise customers including
    Moderna, and validated performance as the #1-ranked hacker on HackerOne's global leaderboard, XBOW leads a nascent
    autonomous penetration-testing category while facing dual-use concerns and an acknowledged current operating loss.
sections:
  - id: identity-mission-product
    title: Identity, Mission, and Operating Model
    body: >
      XBOW is an autonomous offensive security company that uses swarms of AI agents to perform continuous,
      machine-speed penetration testing against enterprise software applications. The company is incorporated with
      its registered headquarters at a mailbox address inside a Pioneer Square coworking space in Seattle, WA,
      reflecting a fully remote, globally distributed operating model. Founder and CEO Oege de Moor resides in
      Malta, and the more than 250 employees are distributed across the United States, Europe, and Asia. XBOW's
      formal Seattle designation is primarily relevant for how venture funding rounds are tallied in regional capital
      statistics rather than for physical operations or decision-making.

      The company was founded in January 2024 with the explicit mission "to defeat the bad actors before they
      strike, using AI to revolutionize how we approach offensive security." Its commercial thesis is that
      traditional human-led penetration testing—periodic, expensive, and bounded by human capacity—cannot keep
      pace with AI-enabled attackers who now probe targets continuously at machine scale. XBOW replaces the
      point-in-time engagement model with an always-on platform that deploys thousands of short-lived, narrowly
      scoped AI agents orchestrated by a persistent coordinator and validated through deterministic logic, producing
      verified vulnerabilities rather than theoretical flags or scanner noise.

      The platform architecture comprises three distinct layers: a Coordinator that ingests a target URL and scope,
      maps endpoints, scores attack surface, and distributes tasks; Solver agents with bounded iteration budgets
      that test specific hypotheses using real security tooling including headless-browser capabilities and
      out-of-band exfiltration servers; and a Validator layer that uses automated deterministic logic to confirm
      every finding before it surfaces. This separation of discovery from validation underlies XBOW's claim of a
      near-zero false-positive rate. The company launched its Pentest On-Demand product in November 2025, making
      this capability accessible to enterprises at varying integration depths. The platform is available through
      Microsoft Security Copilot and Sentinel as of March 2026, and through AWS co-sell channels as of May 2026.
    claimRefs:
