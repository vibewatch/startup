callouts:
  - calloutType: strength
    title: Unique AI-security founder pedigree
    body: >-
      Oege de Moor's simultaneous track record in AI software development (GitHub Copilot) and code security
      (Semmle/GitHub Advanced Security) is rare and directly maps to XBOW's product thesis. This background
      aided early capital access, engineering recruitment, and the company's ability to build a credible
      autonomous system in under two years.
    claimRefs:
      - CO002
      - CO003
  - calloutType: risk
    title: Dual-use risk and operating loss require diligence
    body: >-
      XBOW's autonomous attack capability raises dual-use concerns documented by independent analysts: the same
      technology that defends can be misused or accidentally triggered. The CEO's on-record acknowledgment of
      current financial losses means the platform's long-term sustainability depends on continued enterprise
      revenue growth and capital access, both of which are unverified at this stage.
    claimRefs:
      - CO034
      - CO035
      - CO033

