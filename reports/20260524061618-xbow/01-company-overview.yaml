  - id: capital-investors-milestones
    title: Capital Structure, Investors, and Strategic Milestones
    body: >
      XBOW has executed a compressed fundraising trajectory since founding. Sequoia Capital led the Seed round and
      co-led the Series A with Nat Friedman. In June 2025, the company closed a $75M Series B led by Altimeter
      Capital, bringing lifetime capital to $117M. That announcement coincided with XBOW demonstrating its
      platform reaching the #1 position on HackerOne's US leaderboard—the first autonomous system ever to do so—
      and subsequently the #1 position globally.

      In March 2026, XBOW closed its $120M Series C led by DFJ Growth and Northzone at a valuation of over
      $1 billion, bringing lifetime capital to $237M. The round also included Sofina, Alkeon Capital, and
      continued participation from Altimeter, NFDG Ventures, and Sequoia. DFJ Growth's thesis was built around
      XBOW's real-world validation: commercial deployment, HackerOne rank, and Fortune 500 customer traction.

      In May 2026, XBOW added a $35M extension from strategic investors: NVIDIA (NVentures), Accenture Ventures,
      Samsung Ventures, SentinelOne S Ventures, DNX Ventures, and Liberty Global Tech Ventures. Several of these
      investors are simultaneously active customers—a pattern that reinforces the platform's mission-critical
      positioning within enterprise security stacks. The extension brings total Series C to $155M and lifetime
      capital to over $272M.

      Alongside capital raises, XBOW has progressed on ecosystem integrations. In March 2026, it embedded its
      continuous penetration testing into Microsoft Security Copilot and Sentinel (public preview at RSAC 2026).
      In May 2026, it joined the AWS ISV Accelerate Program. The company discloses 100+ customers globally as of
      May 2026, including Moderna and Seznam. Revenue and profitability are not disclosed; the CEO acknowledged
      on record that the platform currently operates at a financial loss, consistent with aggressive hiring and
      international expansion. No litigation, regulatory sanctions, or material governance disputes have been
      identified in public sources as of the run date.
