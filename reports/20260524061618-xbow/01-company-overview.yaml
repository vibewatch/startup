  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: XBOW revenue, ARR, burn rate, runway, and unit economics
      whyItMatters: >-
        Without revenue data, burn rate, and margin profile, it is impossible to evaluate the company's
        path to profitability or how long current capital will support operations.
      diligencePath: >-
        Request financial statements or data-room access; triangulate from headcount and funding burn
        through secondary market data providers.
      relatedQuestionRefs:
        - QO017

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Exact ownership percentages, cap table, and governance rights across all investors
      whyItMatters: >-
        Without the full cap table, it is not possible to assess dilution, liquidation preference stacks,
        pro-rata rights, or the relative influence of financial vs. strategic investors.
      diligencePath: >-
        Obtain cap table and investor rights agreement from company; review board composition and voting
        rights in shareholder agreement.
      relatedQuestionRefs:
        - QO003
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: minor
      topic: competitive-landscape
      missingEvidence: Objective comparative metrics for XBOW vs. Pentera, Synack, Cobalt, Horizon3.AI
      whyItMatters: >-
        Without financial, customer-count, and performance data for named competitors, it is not possible
        to assess XBOW's market share or relative defensibility.
      diligencePath: >-
        Pull competitor funding histories and publicly available revenue estimates from Pitchbook, Crunchbase,
        and independent analyst reports; compare HackerOne ranking histories where available.
      relatedQuestionRefs:
        - QO016

    - type: missing-source
      severity: minor
      topic: governance
      missingEvidence: Full board composition, charter documents, voting rights, and formal governance framework
      whyItMatters: >-
        Key-person risk centered on de Moor is unquantified without visibility into board independence,
        succession provisions, and investor governance rights.
      diligencePath: >-
        Obtain board charter, articles of incorporation, and investor rights agreement from company.
      relatedTableRefs:
        - TO002

    - type: missing-source
      severity: material
      topic: regulatory-risk
      missingEvidence: >-
        Formal regulatory framework, liability standards, or legal precedent governing autonomous
        offensive security tools
      whyItMatters: >-
        No established legal or regulatory framework specifically addresses autonomous AI pentesting.
        If a XBOW agent causes unintended damage or unauthorized access, liability exposure is unclear
        and could create material business risk.
      diligencePath: >-
        Monitor CISA, NIST, and EU AI Act developments; review XBOW's customer contract terms for
        indemnification and scope limitations; consult legal counsel on the regulatory trajectory.
      relatedQuestionRefs:
        - QO025

    - type: enumeration-incomplete
      severity: minor
      topic: funding-history
      missingEvidence: Exact amounts and dates for Seed and Series A rounds
      whyItMatters: >-
        The milestone table and investor map contain approximate figures for early rounds; exact terms
        would improve the accuracy of the lifetime capital and dilution analysis.
      diligencePath: >-
        Request historical funding documentation from company or via Pitchbook; cross-reference law
        firm (Gunderson Dettmer) announcements for confirmation.
      relatedTableRefs:
        - TO004
