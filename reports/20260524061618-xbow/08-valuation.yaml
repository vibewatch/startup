company:
  name: XBOW
chapter:
  number: 8
  title: Valuation
  summary: >-
    XBOW achieved a $1B+ unicorn valuation in March 2026 via a $120M Series C, followed by a $35M strategic
    extension in May 2026, bringing lifetime capital to $272M+. No ARR or revenue has been publicly
    disclosed, forcing all valuation analysis to rely on inferred multiples anchored to comparable peers:
    Pentera ($117M ARR at $1B, ~8.5-10x), Horizon3.ai (102% ARR growth, ~$50-80M ARR), and public
    platform comps (CrowdStrike 31.9x, SentinelOne 5.4x LTM). At 21.2x AI-native SaaS median multiple,
    $1B implies ~$47M ARR; at 10x it implies ~$100M ARR — a plausible but unverified range. The
    valuation is priced on growth narrative and AI-security premium, not on disclosed revenue. Bull,
    base, and bear scenarios span $245M to $2.7B implied value by 2027, with the base case roughly flat
    to entry. The recommendation is Research-more / Track, pending ARR disclosure or observable
    commercial proof that justifies the premium over peers with disclosed fundamentals.

sections:
  - id: financing-and-valuation-context
    title: Financing Context and $1B+ Valuation Anchor
    body: >
      XBOW reached a $1B+ post-money valuation in March 2026 after closing a $120M Series C led by DFJ
      Growth and Northzone, with participation from Sofina, Alkeon Capital, Altimeter, NFDG Ventures,
      and Sequoia Capital. In May 2026, the company extended the Series C by $35M from NVIDIA NVentures,
      Accenture Ventures, Samsung Ventures, SentinelOne S Ventures, DNX Ventures, and Liberty Global
      Tech Ventures, bringing the total Series C to $155M and lifetime capital to over $272M. Several
      extension investors—including Samsung, Accenture, and SentinelOne—are also XBOW customers,
      creating a customer-investor alignment that anchors enterprise credibility.

      DFJ Growth's Barry Schuler publicly stated that XBOW "proved market demand" and credited the
      company's AI-reasoning approach for bringing "the autonomous hacker to life." Northzone's Sanjot
      Malhi described XBOW as "rapidly emerging as a category leader, with Fortune 500 and global
      enterprises already relying on the platform as a mission-critical layer." These endorsements are
      consistent with the Series C being priced on strategic narrative and forward growth expectations
      rather than disclosed revenue metrics. No investor cited ARR, revenue, or profitability in any
      public rationale statement.

      The $155M Series C provides an estimated 18–36 months of runway at projected burn, giving XBOW
      a window to either reach an ARR milestone that attracts a growth round at a higher valuation or
      to generate enough proof for a strategic exit. The company's financing velocity—$272M+ in 16
      months—is exceptional even by AI-native cybersecurity standards, and the strategic investor set
      creates latent channel optionality through Accenture's Cyber.AI managed-security product and
      Samsung's Asia-Pacific distribution.

      The post-money valuation is anchored entirely on investor-negotiated private-market pricing with
      no independently verifiable revenue metric. Applying AI-native SaaS VC-round median multiples
      (21.2x, per SaaSRise Q1 2026 data cited in the financials chapter) implies ~$47M ARR; the
      private-market M&A midpoint of 8–15x implies a wide $67–125M range. The central inferred ARR
      band is $47–$100M, which is plausible but entirely unconfirmed.
