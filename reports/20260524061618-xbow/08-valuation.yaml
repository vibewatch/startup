  - id: revenue-multiple-sensitivity
    title: Revenue Multiple Sensitivity and Implied ARR Scenarios
    body: >
      Because XBOW has not disclosed ARR or revenue, all valuation analysis must operate in reverse—
      applying observed market multiples to the $1B+ post-money to infer what ARR level the current
      price implies. The exercise is constrained by multiple uncertainty: market multiples for
      AI-native cybersecurity startups span 8x to 30x+ depending on growth velocity, gross margin,
      retention profile, and platform optionality. FinRof's mid-2025 survey of 250+ cybersecurity
      companies confirms this wide spread across niches.

      The most parsimonious anchors are: (1) Pentera's implied ~8.5–10x at Series D, giving a
      Pentera-parity ARR of $100–118M; (2) the SaaSRise AI-native SaaS VC median of 21.2x, giving an
      implied ARR of ~$47M; and (3) a conservative 5x legacy benchmark implying $200M ARR, which is
      clearly implausible for a company in its first two commercial years. At 15x (the midpoint of
      private M&A range per FinRof), the implied ARR is $67M. This sensitivity exercise establishes
      the range of the chapter's core uncertainty: XBOW's ARR is plausibly $47–$100M but is not
      publicly confirmed.

      The Windsor Drake Q1 2026 report shows the cybersecurity sector trades at a premium of ~25%
      above the broader software industry, with global IT spending projected at $6.08 trillion in 2026.
      This sector tailwind partially supports the AI-premium applied to XBOW. The FinRof data and
      TIKR analysis both note that platform premium and AI-native differentiation drive the upper end
      of the multiple range, while point solutions compress toward 3–6x in a market rotating toward
      consolidation. XBOW's position—web-application focused, with Microsoft and AWS integrations—is
      meaningfully different from Pentera (network/AD/validation) and Horizon3.ai (MSSP-served,
      broad-enterprise), making direct ARR-multiple transfer imprecise.
