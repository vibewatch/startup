callouts:
  - calloutType: risk
    title: Revenue Opacity Prevents Conviction
    body: >-
      XBOW's $1B+ valuation is unanchored by any disclosed ARR or revenue metric. The closest private
      peer, Pentera, disclosed ~$117M ARR at its $1B Series D — if XBOW's ARR is materially below this
      level, the $1B price implies a premium that requires higher growth, superior margin, or platform
      optionality arguments that cannot yet be independently verified. Investors entering at this price
      accept blind trust in the investor syndicate's private DDR findings.
    claimRefs:
      - CV039
      - CV009
      - CV017

  - calloutType: insight
    title: Strategic Investor Extension Signals Customer Validation
    body: >-
      The May 2026 $35M Series C extension from NVIDIA, Accenture, Samsung, and SentinelOne — all
      XBOW customers — is the single strongest observable signal of enterprise adoption. Customer-investor
      alignment typically implies mission-critical deployment, multi-year contract intent, and channel
      leverage. This partially compensates for the revenue opacity in the base case.
    claimRefs:
      - CV002
      - CV027
      - CV028

  - calloutType: assumption
    title: AI-Native Premium Assumes Sustained Technical Differentiation
    body: >-
      The 10–21x implied ARR multiple assigned by the market to XBOW's $1B+ valuation is defensible
      only if AI-native exploit-chain capability remains competitively uncatchable for 3–5 years. If
      Horizon3.ai (MSSP-scale customer base), Hadrian (agentic launch March 2026), or incumbent AI
      investment (Rapid7 Kenzo acquisition) closes the technical gap faster than expected, the premium
      compresses toward Pentera's ~8.5–10x — implying a down-round risk at the next financing.
    claimRefs:
      - CV013
      - CV014
      - CV021
      - CV025

