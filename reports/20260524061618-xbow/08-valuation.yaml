  - id: comparable-valuation-analysis
    title: Comparable Valuation Analysis
    body: >
      The most relevant private comparable is Pentera—an automated security validation company that
      raised a $60M Series D in March 2025 at a $1B+ valuation. Pentera's publicly reported ARR of
      ~$117.4M (GetLatka, November 2025 update) implies an EV/ARR multiple of approximately 8.5–10x
      at the $1B mark. Pentera had also grown ARR by over 300% in four years, serves 1,100+
      customers, and quadrupled its average deal size to ~$100,000. This creates a defensible
      valuation anchor: if XBOW has achieved Pentera-equivalent ARR at the time of its Series C, the
      $1B price is well-supported; if XBOW's ARR is materially below $100M, the premium requires
      additional justification from higher growth rates, larger deal sizes, or superior technology.

      Horizon3.ai (NodeZero) reported 102% year-over-year ARR growth in FY2026, with 5,200+
      customers globally, 125% net dollar retention, and 94% gross dollar retention. GetLatka data
      (updated September 2025) placed Horizon3.ai at $50.7M ARR with an implied market valuation of
      $152.1M by GetLatka's model—substantially below its actual private market implied value post
      Series D. TechCrunch reported in May 2025 that Horizon3.ai was raising $100M, with NEA leading
      the round. Horizon3.ai's scale (5,200 customers vs XBOW's 100+) underscores the volume
      distribution advantage of the MSSP channel model versus XBOW's direct enterprise motion.

      On the public side, the valuation landscape is starkly bifurcated. CrowdStrike trades at ~31.9x
      LTM EV/Revenue as of Q1 2026 per Multiples.vc, reflecting its status as a multi-billion-dollar
      platform consolidator. SentinelOne reported Q1 FY2026 revenue of $229M (+23% YoY) and $948M
      ARR, with an LTM EV/Revenue multiple of approximately 5.4x. Rapid7 delivered Q1 2026 revenue
      of $210M (-0.3% YoY) and $832M ARR (-0.6% YoY), with a still-lower market multiple, reflecting
      multiple compression for decelerating vendors. The Windsor Drake Q1 2026 Cybersecurity Valuation
      Report notes a stark divide: platform companies (Identity + Cloud + Endpoint unified) command
      12x+ EV/NTM revenue, while legacy point solutions struggle to break 5x.

      Cymulate, the closest BAS/XSPM category analog, raised a $70M Series D in 2022 at approximately
      $500M valuation, providing a historical anchor for BAS-adjacent offense/validation tools. At the
      XBOW price point, the premium over Cymulate's 2022 valuation is justified only if XBOW's
      web-application exploit-chain capability and AI-native design are treated as categorically
      superior, which the HackerOne leaderboard evidence partially supports.
