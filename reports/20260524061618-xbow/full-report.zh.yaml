      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 收入不透明削弱投资确信度
            body: >-
              XBOW 的 $1B+ 估值没有任何已披露 ARR 或收入指标作锚。最接近的私有市场同行 Pentera，在其 $1B Series D 时披露约 $117M ARR——如果 XBOW 的 ARR
              明显低于这个水平，$1B 价格就意味着一种溢价，需要更高增长、更好利润率或平台选择权论据来解释，而这些目前还无法独立验证。以这个价格入场的投资人，等于盲目信任投资人财团的私下尽调结论。
            calloutType: risk
            claimRefs:
              - CV039
              - CV009
              - CV017
          - type: callout
            title: 战略投资人延伸轮释放客户验证信号
            body: >-
              2026 年 5 月，来自 NVIDIA、Accenture、Samsung 和 SentinelOne 的 $35M Series C 延伸轮——这些机构同时都是 XBOW
              客户——是企业采用最强的可观察信号。客户-投资人绑定通常意味着任务关键部署、多年合同意向和渠道杠杆。这部分弥补了基准情景中的收入不透明。
            calloutType: insight
            claimRefs:
              - CV002
              - CV027
              - CV028
          - type: callout
            title: AI 原生溢价假设技术差异化能持续
            body: >-
              市场给 XBOW $1B+ 估值配上的 10–21x 隐含 ARR 倍数，只有在 AI 原生利用链能力未来 3–5 年仍让竞争者追不上时才站得住。如果 Horizon3.ai（MSSP
              规模客户基础）、Hadrian（2026 年 3 月推出智能体产品）或在任厂商 AI 投资（Rapid7 收购 Kenzo）比预期更快补上技术差距，溢价会压缩到 Pentera 的约
              8.5–10x——意味着下一轮融资存在降价轮风险。
            calloutType: assumption
            claimRefs:
              - CV013
