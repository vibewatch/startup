      - number: '2.4'
        title: 增长驱动与市场约束
        blocks:
          - type: paragraph
            body: >
              渗透测试市场增长的首要结构性驱动是监管要求扩张。PCI DSS 4.0、DORA 和 NIS2 合计创造了一个估计覆盖全球 300,000–500,000
              家企业的强制需求池，其中目前不到一半拥有系统性年度测试项目。仅合规补课就代表多年绿地需求。在监管之上，是 AI 驱动的攻击面扩张：云基础设施采用使企业攻击面估计每年扩大 40%，而 2026 年由 AI
              赋能的威胁行为者正大规模部署自动化攻击工具，提高对抗性探测的频率和复杂度。2026 年平均攻击者驻留时间为 24 天（低于 2021 年的 60 天），说明检测与修复窗口正在收缩，持续测试比年度测试更紧迫。

              供给侧最大的单一增长杠杆，是认证渗透测试人才短缺：62% 企业安全团队把这一短缺列为对自动化渗透测试工具感兴趣的主要原因。XBOW
              平台把人员约束转化为需求催化剂——正是阻止企业扩展人工测试的稀缺性，让自主替代方案更有吸引力。Accenture 对 XBOW 的战略投资，以及 Microsoft 和 AWS 生态集成，把 XBOW
              分发延伸到能降低冷启动销售周期的渠道。

              约束也很实质。预算压缩已有记录：47% CISO 表示 2026 年安全预算持平或下降，新平台支出必须相对既有工具续费证明合理性。企业渗透测试采购中，合格管线第一年只有 12–15%
              转为已签合同；自主平台评估周期为 60–180 天。直接竞争对手 Horizon3.AI 已发布买家指南，明确教育潜在客户如何评估，这提高了买家比较流程的成熟度，也拉长了 XBOW
              的销售周期。传统供应商也在扩展自动化功能，带来价格压力。这些逆风真实存在，但偏阶段性：监管要求和 AI 驱动的攻击面扩张是长期趋势，会在结构上扩张市场，不受短期预算压缩左右。
