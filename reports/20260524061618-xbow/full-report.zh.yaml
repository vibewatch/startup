      - number: '3.5'
        title: BAS 与相邻替代品：AttackIQ、SafeBreach、Cymulate、XM Cyber
        blocks:
          - type: paragraph
            body: >
              入侵与攻击模拟（BAS）平台——以 AttackIQ、SafeBreach、Cymulate 和 XM Cyber 为代表——占据相邻的自动化攻击模拟市场。BAS 平台会重放映射到 MITRE ATT&CK
              的已知攻击技术，验证现有安全控制能否检测并阻断已记录威胁行为者行为。它们不发现新漏洞，也不生成新利用链；相反，它们测试已知攻击是否会成功。这个架构差异把 BAS 与 XBOW 的真实利用发现能力区分开来。

              Omdia 2026 年 3 月分析认为 BAS 市场面临逆风：实施资源密集、集成复杂度高，很多组织无法维持真正持续控制监测所需节奏。AEV 品类正在成为继任范式，把
              BAS、自动化渗透测试和红队合并为统一方案。AttackIQ、Cymulate 和 XM Cyber 等厂商明确转向 CTEM 和暴露管理，这加剧了 XBOW 来自相邻玩家的竞争压力。

              XBOW 对 BAS 平台应强调的关键差异，是利用链完整性：BAS 工具验证防御能否捕捉已知攻击，XBOW 则发现未知可利用路径是否存在。足够成熟、能理解这一区别的买家，是 XBOW
              的主要采用者。聚焦合规验证和控制监测的买家可能认为 BAS 平台已足够，这代表一个 XBOW 以当前定位无法赢下的市场分层。
