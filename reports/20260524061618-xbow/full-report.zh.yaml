      - number: '5.4'
        title: 基准测试、第三方验证与真实世界结果
        blocks:
          - type: paragraph
            body: >-
              XBOW 最强的技术能力证据来自实时 HackerOne 表现和结构化基准。2025 年 2 月至 6 月，XBOW 向 HackerOne 提交了 1,060 多份漏洞报告，登上美国排行榜第
              1——这是首个有记录做到这一点的自主系统。HackerOne 后来把人类和机器排名拆开，也反映了这次冲击的量级。三个月窗口内的严重性分布为：54 个严重、242 个高危、524 个中危、65 个低危发现。132
              个漏洞由项目所有者确认并修复；303 个进入分诊。XBOW 安全负责人指出，所有发现都完全自动化，但提交前有人类员工审核，以符合 HackerOne 的 AI 工具政策——这个限定值得保留。在一个自研的 104
              挑战新颖基准上，XBOW 用 28 分钟达到 85% 通过率，而资深人类渗透测试员需要 40 小时。平台执行了一条 48 步自主漏洞利用链，并在 17.5 分钟内通过 padding oracle 攻击破解
              AES-128 CBC 加密 cookie——这个结果让 NYU Offensive Security 讲师 Brendan Dolan-Gavitt 形容自己“震惊”。XBOW 还自主发现
              CVE-2025-49493，这是 Akamai CloudTest 中的 XXE 漏洞，影响由活跃漏洞赏金项目公司运营的部署。独立第三方技术评审（vmsoit.blogspot.com，2026 年 4
              月）评估 XBOW 在所有 HackerOne 项目上的整体准确率约
              37.5%，并指出复杂业务逻辑缺陷和盲注场景仍是持续局限。该评审还指出，平台“增强而不是取代熟练安全专业人员”，且排行榜成绩受益于瞄准漏洞披露计划，而不只是付费赏金项目。
