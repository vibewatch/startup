      - number: '4.2'
        title: 收入、ARR 与定价架构
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，XBOW 尚未公开披露任何 ARR 或收入数字。GetLatka 的公司跟踪器更新至 2025 年 10 月，确认未记录收入数字。CEO
              公开承认经营亏损，是公共领域唯一的一手财务信号。DFJ Growth 投资论点备忘录称 XBOW 已「证明市场需求」，并「部署到超过 100 家客户且快速扩张」，这确认公司已经产生商业收入，但没有给出数字锚点。

              公司采用三层定价模型。On-Demand Plus 测试单个应用，每次 $4,000，覆盖范围相当于两周人工渗透测试。On-Demand Premium 面向流程复杂的多模块应用，每次
              $8,000，相当于四周人工项目。Enterprise 层按定制报价（「请求报价」），为成熟应用组合提供组织级持续安全覆盖。企业合同预计会转为年度订阅或点数包结构。竞争对手 Escape.tech 的分析称
              XBOW 按需定价从每次 $6,000 起，企业定价围绕点数包设计；这与 XBOW 公布的标价部分冲突，可能反映捆绑或区域定价差异。

              从 $1B+ 投后估值倒推，并套用 SaaSRise 2026 年 Q1 调查中的 AI 原生 SaaS 可比倍数（VC 轮 EV/Revenue 中位数 21.2x），隐含 ARR 约为 $47M。私募市场
              M&A 中点倍数（8–15x，来自 FE International 和 Acquiry 数据）在低端倍数下隐含 ARR 区间为 $67M–$125M。若采用较低的 10x 倍数，则隐含 ARR 为
              $100M。合并来看，ARR 的中心推断区间约为 $30M–$80M；考虑到 XBOW 2025 年中才开始商业运营，这一范围有一定合理性，但高度不确定。

              若客户超过 100 家企业，要达到 $30M–$80M ARR 池，隐含平均合同价值为每年 $300K–$800K。每年 $500K–$1M+ 的企业合同与该品类相符：最接近的已披露可比对象
              Horizon3.ai NodeZero 报告 ARR 同比增长 102%，并在 2026 年被 5,200 个组织使用，说明持续渗透测试市场速度强劲，但客户数量画像差异很大（广度相较于 XBOW
              表面上的高端深度策略）。
