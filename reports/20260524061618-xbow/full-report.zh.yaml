      - number: '7.2'
        title: 监管、法律与双重用途风险
        blocks:
          - type: paragraph
            body: >-
              XBOW 的法律面异常重要，因为公司出售自主进攻能力，却发布了消费者式责任框架。公开 Terms of Use 将累计责任上限定为
              $100；如果平台被用于大型企业环境且出现问题，这个上限明显不匹配。同时，底层产品品类处在移动的政策边界内。Wassenaar 自 2013 年起就把入侵软件视为双重用途管制问题，但政策评论仍把现代 SaaS
              交付的进攻工具视为解释灰区，而非已经确定的豁免。EU 2025 双重用途清单更新继续保留网络入侵管制，EU AI Act 现在也施加至少部分文档、风险管理和监督预期，即便 2026 年 5
              月的指南草案降低了许多系统的即时 Annex III 压力。XBOW
              隐私政策又叠加一层更普通但仍重要的风险：一旦账户、使用和设备数据被处理，隐私合规就变成持续运营义务。合起来，这些因素形成真实风险：法律尽调、出口筛查、授权设计和采购审查，可能在正式执法行动出现之前很久就拖慢
              XBOW。
