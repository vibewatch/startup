      - number: '3.7'
        title: 反向证据：市场拥挤、功能趋同与既有厂商响应
        blocks:
          - type: paragraph
            body: >
              自主渗透测试和 AEV 市场正在出现有记录的功能趋同和竞争拥挤，对 XBOW 长期定价权和利润率构成有意义的风险。PeerSpot 2026 年 5 月心智份额数据显示，Horizon3.ai（从 15.1%
              降至 11.0%）和 Pentera（从 14.7% 降至
              9.1%）在渗透测试服务品类中都在下滑——这表明无论纯自主还是自动化验证厂商，都没有在整合市场份额；相反，买家正分散到越来越多平台上。市场更像在拥挤化，而非集中化。

              Escape.tech 2026 年 4 月竞争分析明确把 XBOW 定位为局限于周期性、按次付费的 web 应用评估，并把连续、始终在线的替代方案（Escape、Aikido
              Security）呈现为更适合需要代码原生、API 优先、开发者集成覆盖的组织。这一批评有技术基础：XBOW 当前产品没有提供现代 DevSecOps 买家期待的一流应用安全工具所具备的 CI/CD 集成、基于
              bug bounty 数据的回归测试，或开发者 IDE 嵌入。相对开发者中心替代方案，这是一个真实产品缺口，而不只是定位争议。

              既有厂商正在响应。NetSPI 的 $80M 以上收购策略明确瞄准 AI 能力，以对抗自主平台。Rapid7 收购 Kenzo Security 获取智能体式 AI。Bishop Fox 开发了 Cosmos
              持续测试平台。Mandiant/Google 的规模和威胁情报访问，使其拥有自建或收购自主能力的技术资源。在这些既有厂商复制 XBOW 的自主利用链能力之前，2–3 年窗口真实存在；但如果 Microsoft
              集成不能变成真正平台护城河，如果 XBOW 不能把覆盖扩展到内部网络和 AD 横向移动——也就是 Horizon3.ai 与 Pentera 当前主导的领域——这种窗口并不能无限防守。
