  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可服务范围
        blocks:
          - type: paragraph
            body: >
              渗透测试涵盖一类服务和平台：它们主动模拟针对企业软件、网络和基础设施的对抗性攻击，在威胁行为者利用漏洞前暴露可被利用的弱点。市场分为三种主要交付模式：由人工测试员执行的传统按时计费项目；以按需或订阅方式交付测试能力的渗透测试即服务（PTaaS）平台；以及以自动化方式持续重放已知攻击技术的入侵与攻击模拟（BAS）工具。XBOW
              最直接竞争的是 PTaaS 品类，但当买家希望以更低单次测试成本获得持续覆盖时，它也会替代传统项目。

              影响 XBOW 总可服务机会的相邻支出品类包括攻击面管理（ASM）和漏洞管理（VM）。ASM 持续发现并评分互联网暴露资产；VM
              汇总扫描器发现并排列修复优先级。这些相邻品类是上游和下游流程伙伴，不是直接替代品，但会形成预算竞争，也可能成为收购或集成路径。$15.93B 的 VM 市场远大于核心渗透测试市场，说明如果 XBOW
              从测试扩展到暴露管理，长期天花板会显著高于眼前的 PTaaS SAM。

              XBOW 平台的现状替代品包括通过 NCC Group、Rapid7 或 Cobalt 等公司采购的年度或季度人工项目，大型企业内部红队，以及 Cymulate 或 AttackIQ 等传统 BAS
              平台。每类替代品都留下实质覆盖缺口：人工项目周期性强且受人才约束；内部红队昂贵且稀缺；BAS 平台重放已知技术，并不真正发现漏洞。XBOW 把自主 AI
              智能体定位为填补这一缺口的方式：用机器级速度、持续、真实利用替代模拟。市场边界存在争议，因为部分分析师把自动化 DAST 和扫描器收入计入渗透测试总量，抬高
              TAM；另一些则把范围限制在真正具备利用能力的测试，压低口径。下表保留了两种惯例。
