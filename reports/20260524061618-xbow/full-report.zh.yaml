      - number: '6.3'
        title: Microsoft、AWS 与合作伙伴渠道的企业触达
        blocks:
          - type: paragraph
            body: >
              2026 年，XBOW 通过两个分销合作显著扩大了企业可触达面，使平台进入企业已在使用的渠道。

              2026 年 3 月，XBOW 宣布与 Microsoft Security Copilot 和 Microsoft Sentinel 数据湖集成，并在 RSAC 2026 以公开预览形式上线。该集成与
              Microsoft 共同构建，让全球企业无需配置独立供应商工作流，就能在 Microsoft 控制台内发现、验证并优先排序漏洞。方案包含三个组件：XBOW Pentest Manager Agent（从
              Security Copilot 发起并管理渗透测试）、XBOW Sentinel Connector（把已验证发现写入 Sentinel 数据湖自定义表）、XBOW Pentest Analysis
              Agent（将 XBOW 发现与 Sentinel 遥测一起分析，以识别检测缺口）。集成可通过 Microsoft Security Store、Microsoft Marketplace 和 Security
              Copilot agent gallery 获取。Microsoft Security Platform & AI 企业副总裁 Shawn Bice 表示：“通过把 XBOW 的自主渗透测试集成进
              Microsoft Security Copilot 和 Microsoft Sentinel 数据湖，我们正在帮助各行业客户把进攻洞察直接接入现有工作流。” 该集成直接回应了 AppSec 测试和 SecOps
              工作流之间的缺口，这个缺口长期限制了连续渗透测试采用。

              2026 年 5 月，XBOW 加入 AWS ISV Accelerate Program，这是一个联合销售计划，可把参与 ISV 直接连接到全球 AWS 一线销售。入选需要全面架构和安全审查，XBOW
              也在评估中提交了客户卓越证明。公司 Chief Revenue Officer Niroshan Rajadurai 表示：“面对 AI 驱动攻击者的 AWS 客户，现在可以通过现有 AWS 渠道采用 XBOW
              的自主、AI 驱动安全测试。” 这项联合销售安排让 XBOW 无需以与产品扩张同等速度自建一线销售组织，就能获得通向庞大 AWS 企业客户群的暖线销售管线。

              Accenture 投资合作（2026 年 5 月）把 XBOW 嵌入 Accenture Cyber.AI，也就是 Accenture 的托管安全服务产品。这形成了系统集成商中介的分销渠道：企业客户通过
              Accenture 采购进攻安全服务，而不是直接购买 SaaS 订阅。Samsung 在韩国作为首选经销商的角色，加上 Series C 延期轮中 DNX Ventures 的亚太网络，使 XBOW 在高增长
              APAC 市场获得了第一个专门分销渠道。

              合起来看，Microsoft（平台嵌入）、AWS（联合销售）和 Accenture（SI 分销）三类渠道安排，可能显著加速 XBOW
              在受监管企业垂直行业中的获客；对一个成立两年的产品而言，直接销售周期本会很长。但这些安排尚未产生公开引用的渠道客户部署，因此对客户数量的增量影响仍是开放问题。
