chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              XBOW 是一家自主进攻安全公司，用 AI 智能体集群对企业软件应用做持续、机器级速度的渗透测试。公司注册总部设在 WA 州 Seattle Pioneer Square
              一家联合办公空间内的邮箱地址，实际对应的是完全远程、全球分布式的运营模式。创始人兼 CEO Oege de Moor 居住在 Malta，超过 250 名员工分布在美国、欧洲和亚洲。XBOW 形式上的
              Seattle 身份，主要影响区域风投资金统计如何计入融资轮，而非实体运营或决策地点。

              公司成立于 2024 年 1 月，明确使命是「to defeat the bad actors before they strike, using AI to revolutionize how we
              approach offensive security」。它的商业判断是：传统人工渗透测试周期性、昂贵且受人力上限约束，已经跟不上由 AI 加速、能以机器规模持续探测目标的攻击者。XBOW
              用始终在线的平台替代一次性项目制测试，部署数千个短生命周期、范围很窄的 AI 智能体，由一个持久协调器编排，并用确定性逻辑验证，产出的是已验证漏洞，而非理论标记或扫描器噪音。

              平台架构分为三层：Coordinator 接收目标 URL 和范围，映射端点、评估攻击面并分发任务；Solver
              智能体在有限迭代预算内，用真实安全工具测试具体假设，包括无头浏览器能力和带外渗出服务器；Validator 层用自动化确定性逻辑确认每一项发现后再展示。发现与验证分离，支撑了 XBOW 近乎零误报率的主张。公司在
              2025 年 11 月推出 Pentest On-Demand 产品，让不同集成深度的企业都能使用该能力。到 2026 年 3 月，平台已接入 Microsoft Security Copilot 和
              Sentinel；到 2026 年 5 月，又进入 AWS 联合销售渠道。
