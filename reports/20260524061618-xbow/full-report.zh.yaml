  - id: TV006
    title: 投资逻辑失效与终止触发器
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 停滞
        - 达到 $100M 里程碑前，ARR 同比增速跌破 40%
        - 意味着企业市场无法放大到支撑 $1B+ 叙事
        - 下调至回避；观察降估值融资信号
      - - 大客户流失
        - 流失一个占推断 ARR >15% 的锚定企业客户
        - 收入集中风险兑现；基准情景坍塌
        - 立即重评投资逻辑；若持有则退出
      - - 降估值融资
        - 下一轮投后估值低于 $1B
        - 市场已重定价叙事；前轮投资人账面亏损
        - 避免跟投；按新的出清价格重新评估
      - - 竞争趋同
        - Horizon3.ai、Hadrian 或既有厂商（Rapid7 Kenzo、Palo Alto）在 Web 应用漏洞利用链能力上追平
        - 护城河被侵蚀；收入溢价和倍数向 Pentera 水平压缩
        - 将目标倍数降至 8–10x；下修基准情景
      - - 渠道收入缺口
        - 到 2027 年 Q4，Accenture/Samsung/SentinelOne 渠道仍没有可衡量 ARR
        - 战略投资人价值逻辑失效；增长回到纯直销
        - 下调乐观情景概率；将 ARR 预测修正为基准 / 悲观
    notes: 触发器由分析师根据可观察信号事件构建；阈值为示意。“降估值融资”的终止触发器是二元判断；其他均为方向性信号，需要结合当时语境。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV036
  - id: TV007
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与收入披露
        - 无公开 ARR、收入运行率或合同金额数据
        - 这是所有基于倍数估值最关键的输入；没有它，$1B+ 估值缺少锚点
        - 公司 DDR（VDR）；附财务附录的投资人信
      - - 清算优先权与股权结构表
        - Series C 优先权条款和保护性条款未披露
        - 决定退出或降估值融资场景下普通股回收价值
        - 法律 DDR；Sequoia/Altimeter/DFJ Growth 历史条款清单
      - - 客户名单与合同条款
        - 已确认 100+ 客户，但名称未披露；合同金额未知
        - 验证 ARR 集中度、平均客单价，以及企业客户与 SMB 的结构
        - 客户访谈；DDR 中匿名 ARR 队列分析
      - - 烧钱速度与现金余额
        - 烧钱速度未披露；现金跑道只能根据已融资金估算
        - 验证 18–36 个月现金跑道估计；判断下一轮融资时点
        - 财务 DDR；CFO（Adam Wright）访谈
      - - 渠道收入贡献
        - 没有数据说明 Accenture、Samsung、SentinelOne 渠道是否带来付费合同
        - 这是区分乐观与基准情景的关键；战略投资人价值取决于该逻辑成立
        - 合作伙伴协议审阅；DDR 中 2026 年 Q3 新增客户归因
    notes: 所有尽调清单均指向公开不可得的信息，只能通过正式 DDR 流程或直接投资人访问取得。五项均无法仅凭公开来源解决。
    claimRefs:
      - CV039
      - CV040
      - CV041
