            title: 监管驱动的强制需求构成持久 TAM 底线
            body: >-
              PCI DSS 4.0、DORA 和 NIS2 合计要求全球估计 300,000–500,000 家企业开展渗透测试，其中多数尚未建立系统性项目。合规补课是独立于经济周期的长期需求驱动，为 XBOW
              可服务市场在企业安全预算中可自由支配部分之下提供结构稳定的底线。
