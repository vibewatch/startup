  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础、理想客户画像与分层
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，XBOW 在全球服务超过 100 家企业客户；这个数字在 Series C（$120M，2026 年 3 月）和 Series C 延期轮（$35M，2026 年 5
              月）融资公告中口径一致。公司没有按地域、垂直行业或层级拆分，因此详细分层分析只能依赖命名客户和投资人兼客户推断。

              公开命名的独立客户——Moderna 和 Seznam——横跨两种非常不同的原型。Moderna 是 Fortune 500 生物制药公司，应用资产复杂、多云部署，并暴露在严格生命科学监管之下；它的部署说明
              XBOW 可进入受监管的大型企业环境，在那里软件供应链安全是董事会级议题。Seznam 是捷克互联网公司，常被称为捷克的 Google；它的部署说明 XBOW 触达了欧洲科技组织，这类组织管理着大型、面向公众的
              Web 应用组合。Moderna 和 Seznam 都没有发布案例研究细节，限制了这些旗舰参考名称的证明深度。

              已发布案例研究覆盖另外两家客户。PuppyGraph 是面向开发者的实时图查询引擎，服务 Coinbase、Clarivate 等受监管行业客户；在 XBOW 发现一个严重认证绕过和两个此前渗透测试供应商漏掉的
              RCE 漏洞后，PuppyGraph 采用了 XBOW。BloomPath AI 是处理敏感企业数据的 AI 生产力平台；它用 XBOW 完成快速 SOC 2
              合规项目，几天内交付，而非行业标准的六周人工流程。两者都代表早期到成长阶段科技公司，其安全需求与 XBOW 的 Web 应用测试优势高度贴合。

              投资人兼客户重合具有商业意义。SentinelOne（网络安全平台）、Samsung（全球消费和企业技术）、Accenture（全球 IT 服务与咨询）除了投资 Series C 延期轮，也都已确认是 XBOW
              平台客户。这种重合验证了 XBOW
              在企业安全栈中的任务关键定位，但也引出代表性问题：来自大型、全球化且高度成熟科技买家的需求，和合规驱动垂直行业（如金融服务或医疗）中的广泛商业采用并不等同；后者的信任门槛和采购复杂度高得多。
