  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 产品与技术风险
        blocks:
          - type: paragraph
            body: >-
              XBOW 的公开技术证明足以让公司进入相关讨论，但同一组证据也界定了当前产品边界。CEO 关于 0-10% 误报的说法方向上正面，但独立评审约 1,060 份 HackerOne
              提交后发现，一旦把重复、informative 提交和 N/A 结果计入，仍有相当比例不可行动内容。公开报道也把狭义漏洞利用执行和业务影响推理区分开：Michiel Prins 明确表示 XBOW
              不擅长业务影响判断，raw.pm 则认为排行榜结果受益于报告量和 VDP 组合。企业买家关心的不是数量，而是是否漏掉少数真正伤害收入或信任的上下文漏洞，因此这一点重要。OWASP APTS
              又进一步抬高标准：它在八个域中定义 173 项要求，意味着企业级自动化不只是模型质量，而是耐久的流程质量。结果是，XBOW
              技术风险画像清晰：公司确实有能力，但仍暴露在业务逻辑漏报、不断扩大的控制面义务，以及自身平台缺少可见第三方保证之下。
