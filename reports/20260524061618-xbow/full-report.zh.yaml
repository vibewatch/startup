      - number: '5.2'
        title: 产品 SKU、覆盖范围与用例
        blocks:
          - type: paragraph
            body: >-
              XBOW 提供两种主要交付模式。XBOW Lightspeed 是按需渗透测试服务，承诺以机器速度交付专家级结果：每次测试起价
              $4,000，在测试开始后五个工作日内交付合规就绪报告。底层平台也作为连续企业订阅销售，面向希望对整个应用组合持续、按计划测试的团队。两种模式都覆盖 Web 应用及其集成
              API。目标必须能通过互联网访问，或配置为将 XBOW 公布的八个 IP 地址加入白名单；位于 VPN 或限制性防火墙之后、固定会话超时、或不兼容 Chrome 浏览器的应用不适用。独立 API
              测试和移动应用测试是 2026 年路线图项目。网络和云基础设施渗透测试不在当前产品范围内。XBOW 文档称其报告输出满足 40 多个合规框架的渗透测试要求，包括 SOC 2、ISO 27001:2022、ISO
              27017、ISO 27018、HIPAA、CMMC Levels 1–3、EU DORA、NIS 2、NIST CSF 2.0、GDPR、CCPA/CPRA、AWS FTR 等。XBOW Public API
              已在 2026 年进入公开预览，支持以编程方式访问评估、发现、资产、报告和 webhook，并提供带版本、分页、限速的端点和公开 OpenAPI 规范。
