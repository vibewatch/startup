      - number: '3.4'
        title: 大型企业既有厂商：Mandiant/Google、NetSPI、Rapid7
        blocks:
          - type: paragraph
            body: >
              大型专业服务和平台既有厂商的买家动作不同于自主平台，但它们掌控大规模企业采购，并正在积极投资自动化以守住位置。

              Google Mandiant（通过 Google Cloud）交付定制化、情报主导的渗透测试，覆盖外部 / 内部网络、web 应用、云、社会工程、嵌入式设备和 ICS/SCADA 环境。Mandiant
              的测试由一线事件响应情报支撑，面向风险成熟度最高的组织设计。Mandiant 的品牌权威和威胁情报集成，使其成为关键基础设施和政府的高端选择；它在价格或部署速度上不是 XBOW
              近期直接竞争对手，但代表了企业买家衡量任何新进入者时对标的「金标准」。

              NetSPI 获得 KKR 和 Sunstone Partners 的 $500M 支持，并在 2026 年寻求 $80M 以上收购，以扩展 AI 能力。CEO Aaron Shilts 于 2026 年 4
              月确认，公司目标是收购收入 $80–100M 的企业，补强技术人才和产品能力，包括 AI 集成。NetSPI
              明确的混合哲学——把自动化与人类专家结合来处理复杂业务逻辑——把它定位为正在向自动化升级的既有厂商，而不是纯自主竞争对手。其在 Fortune 500 账户中的分发优势，以及这些账户为 SOC 2 和 PCI
              审计合规需要人工验证，给它相对完全自动化替代方案的结构性留存优势。

              Rapid7 2026 年 Q1 披露总收入 $210M、ARR $832M，其中专业服务（包括渗透测试）贡献该季度约 $5.6M，约占总收入 2.7%。Rapid7 于 2026 年 3 月收购 Kenzo
              Security，以加速 Exposure Command 平台内 AI 驱动的风险优先级排序。Rapid7 的渗透测试只是更广泛漏洞管理和 MDR 捆绑包的一部分；已经使用 Rapid7
              平台的买家，常把渗透测试服务作为附加项购买。这种捆绑动作形成分发竞争，纯自主平台很难在买家总价值上匹配。
