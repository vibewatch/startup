      - number: '3.2'
        title: 直接自主渗透测试对手：Horizon3.ai、Pentera 和 Hadrian
        blocks:
          - type: paragraph
            body: >
              最直接可比的三家自主或高度自动化渗透测试平台是 Horizon3.ai（NodeZero）、Pentera 和 Hadrian。

              Horizon3.ai 是 XBOW 最强的自主竞争对手。它由美国国家安全领域前从业者于 2019 年创立，通过 NodeZero 平台瞄准内部网络和 Active Directory 暴露，迄今已完成超过
              100,000 次自主渗透测试。公司 FY2025 收入同比增长 101%，2026 年 3 月披露 ARR 增长 102%，客户超过 3,000 家，其中 80% 由 MSSP 服务。2026 年 5
              月，NodeZero 在 DoD Tradewinds Marketplace 获得「Awardable」状态，给 Horizon3.ai 在美国政府 / 国防领域带来 XBOW
              尚未匹配的明确分发优势。NodeZero 架构是无智能体的（客户基础设施无需安装软件），擅长凭证利用、Active Directory 路径发现和横向移动模拟——在这一领域，XBOW 以 web/API
              为重点的架构相对更弱。

              Pentera 创立于 2015 年（原名 Pcysys），专注于覆盖内部网络、AD、勒索软件模拟和云暴露的自动化安全验证。它在 2025 年 3 月以 $1B+ 估值完成 $60M Series
              D，使总融资达到 $250M。Pentera 服务 1,100 多家客户，平均合同规模约 $100,000，ARR 接近 $100M。截至 2026 年 4 月，PeerSpot 用户对 Pentera
              的功能集评分低于 NodeZero，但在成本效益和部署易用性上更高。不同于 XBOW，Pentera 并不主张发现全新的 web 应用利用链；它的模型重放并验证已知攻击路径，更接近 BAS。

              Hadrian 于 2026 年 3 月 24 日推出其智能体式渗透测试方案 Nova，与 XBOW 在 RSAC 2026 公布 Microsoft 集成处于同一周。Nova
              聚焦外部攻击面管理，并结合按需智能体式渗透测试，采用按单次测试定价，声称能消除 99.5% 误报。Hadrian 直接对准 XBOW 的外部 web/API 测试领域，因此在应用层覆盖上，比 Pentera 或
              NodeZero 更像正面对手。
