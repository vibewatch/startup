      - number: '5.5'
        title: 信任、安全、合规与运营控制
        blocks:
          - type: paragraph
            body: >-
              XBOW
              的安全架构围绕一个原则设计：自主进攻能力需要同等严格的封控。行动前安全检查器会在攻击智能体执行前审查每个拟议行动；如果无法验证某个行动在既定目标范围内安全，就不会运行。所有自主活动都受到约束、可观察，并在发现浮出前经过审查。验证逻辑是确定性的、可审计的，意味着发现不能只靠概率式
              AI 推理晋升。漏洞利用验证使用受控挑战，在不修改持久数据、不扰乱系统的情况下确认可利用性——例如，XSS
              验证用无头浏览器在隔离环境执行载荷，而不是在实时生产会话中执行。客户指定智能体应该测试和不应该测试的范围，XBOW 从一开始就在网络层执行这些政策，而不是作为下游过滤器。合规方面，XBOW Lightspeed
              报告明确设计为满足 SOC 2、ISO 27001:2022、HIPAA、CMMC、EU DORA、NIS 2 以及 40
              多个其他框架的渗透测试证据要求，降低了合规驱动型客户的负担；这些客户过去每个审计周期都要委托定制渗透测试。部署选项被描述为可满足客户安全、隔离和合规要求，但截至运行日期，XBOW 尚未公开自己的 SOC 2
              Type II 报告或 ISO 27001 证书，因此其自身安全态势仍是尽调缺口。
            claimRefs:
              - CE005
              - CE006
              - CE022
              - CE038
              - CE039
              - CE040
      - number: '5.6'
        title: 技术限制、范围边界与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              XBOW 当前技术范围受到几项结构性限制。第一，平台只测试可互联网访问的 Web 应用及其集成 API；网络层、云基础设施、独立 API 和移动测试都不在生产产品中。第二，目标必须支持基于 Chrome
              的交互；依赖非标准认证流程、固定会话超时，或 WAF 规则无法将 XBOW IP 加入白名单的应用不兼容。第三，独立评审提到约 37.5%
              的整体准确率——而样本组合包含漏洞披露计划——说明在加固过、付费漏洞赏金目标上转化率会更低。第四，复杂业务逻辑缺陷仍是有文档记录的弱项，因为这类问题需要上下文理解，而当前智能体架构处理得并不稳定。第五，HackerOne
              排行榜指标部分受提交量和 VDP 选择偏差干扰，且每次提交在平台交付前都经过人类预审。第六，XBOW 自身安全态势（SOC 2 Type II
              证明、自身基础设施渗透测试）尚未公开披露；对有供应链风险要求的企业买家，这是实质缺口。第七，平台大规模依赖 GPU 推理，形成一种成本结构；CEO
              已承认当前定价下公司处于财务亏损，说明定价和毛利率路径仍不确定。第八，第三方评审提到自主进攻 AI 智能体一旦在 XBOW
              受控环境之外运行会带来双重用途风险；截至运行日期，该风险没有公开安全认证或独立红队审计覆盖。
