      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >
              三家独立分析机构发布的 2026 年渗透测试市场估算分别为 $2.42B（Mordor Intelligence，13.9% CAGR）、$2.80B（Fortune Business
              Insights，11.6% CAGR）和 $3.09B（MarketsandMarkets，16.4% CAGR）。$670M 的差距反映的是真实范围差异，而非测量误差：MarketsandMarkets
              计入部分自动化安全工具；Mordor Intelligence 把范围限制在人工配置和 PTaaS 项目。三家都同意该市场增速高于更广义网络安全支出；Gartner 估计 2026 年网络安全支出为
              $240B，约 15% 同比增长。在渗透测试内部，PTaaS 是增长最快的子板块：MarketsandMarkets 估算其 2026 年规模为 $720M，并以 22.6% CAGR 到 2031 年增至
              $1.98B，增速接近传统项目服务的三倍。

              BAS 市场按 Research and Markets 口径，2026 年规模为 $1.08B、CAGR 为 27%；它在技术上不同于渗透测试，但买家和预算越来越重叠。购买 BAS 的企业通常会并行使用
              PTaaS，因此 PTaaS+BAS 重叠板块对应的进攻测试预算池接近 $1.8B。再加上更广义渗透测试 TAM 的中位口径（三项估算平均 $2.76B），XBOW 的一阶可服务市场在计入 ASM 和 VM
              相邻品类前约为 $4.6B。TM002 保留了相互矛盾的估算；Mordor 的 $2.42B 应作为保守底线，MarketsandMarkets 的 $3.09B
              应作为上限。尽调提示：三家机构都把全文报告置于付费墙后，本文引用数字来自新闻稿和公开摘要，而非底层方法论文件。
