      - number: '4.3'
        title: 成本结构、烧钱速度与现金跑道
        blocks:
          - type: paragraph
            body: >
              XBOW 没有披露成本结构、烧钱速度或现金余额。本节所有估算都来自自下而上的模型，依据公开员工数和行业基准推导；在独立核验之前，不应视为事实。

              最大成本项是人员。公司有 250+ 名员工，分布在工程、安全研究、销售、市场和 G&A；考虑到高级 AI 工程师和顶尖进攻安全人才占比较高，按这类公司画像，每名员工 $200K–$260K
              的全包混合成本是合理假设。由此得到年度人员费用 $50M–$65M。AI 推理成本——持续运行数千个自主智能体攻击客户环境——相对典型 SaaS 公司会显著抬高基础设施开支；GPU 计算和模型推理开销很可能在每年
              $5M–$15M。企业 GTM 正在快速扩张（CRO、CMO 和区域 GM 入职），销售和市场预计每年贡献 $8M–$18M 成本。G&A、法务和合规再增加 $3M–$7M。合计估计年度运营运行率为
              $66M–$105M，约每月 $5.5M–$8.8M。这是收入前视角；企业合同确认的收入会降低实际净烧钱速度。

              如果 $155M Series C 尚未动用，在中高烧钱情景下大约提供 18 至 28 个月现金跑道。考虑到公司在 Series C 前已部署 $117M，且很可能带着 Series B 留下的实质现金垫进入
              Series C，2026 年 5 月延期轮交割后的有效现金跑道应明显超过 18 个月。下一次资本触发点最可能绑定两类事件：一是 ARR
              里程碑证明可持续增长，让下一轮成长融资更有吸引力；二是六家战略投资者之一发起战略并购，其中多家同时也是企业客户，并已有活跃集成路线图。

              订阅模式的营运资本动态有利，但按需测试仍不确定。如果企业客户按年预付，递延收入会正向贡献营运资本。按需测试交易（$4K–$8K）很可能按测试计费，并采用标准账期。双模式结构会带来收入确认复杂度；当前规模下影响不大，但企业收入基数扩大后，需要干净的会计处理。
