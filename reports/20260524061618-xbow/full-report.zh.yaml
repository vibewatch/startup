  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与 $1B+ 估值锚点
        blocks:
          - type: paragraph
            body: >
              XBOW 在 2026 年 3 月完成由 DFJ Growth 和 Northzone 领投的 $120M Series C 后，投后估值达到 $1B+；Sofina、Alkeon
              Capital、Altimeter、NFDG Ventures 和 Sequoia Capital 参投。2026 年 5 月，公司又从 NVIDIA NVentures、Accenture
              Ventures、Samsung Ventures、SentinelOne S Ventures、DNX Ventures 和 Liberty Global Tech Ventures 获得 $35M
              Series C 延伸轮，使 Series C 总额达到 $155M，累计融资超过 $272M。包括 Samsung、Accenture 和 SentinelOne 在内的若干延伸轮投资方同时也是 XBOW
              客户，这种客户-投资人绑定为企业可信度提供了锚。

              DFJ Growth 的 Barry Schuler 公开表示，XBOW「证明了市场需求」，并把「让自主黑客成为现实」归功于公司的 AI 推理方法。Northzone 的 Sanjot Malhi 称 XBOW
              「正迅速成为类别领导者，Fortune 500 和全球企业已经把该平台作为任务关键层使用」。这些背书与 Series C
              的定价逻辑一致：价格押注的是战略叙事和未来增长预期，而不是已披露的收入指标。没有投资人在公开理由中引用 ARR、收入或盈利能力。

              $155M Series C 按预计烧钱速度估算，提供 18–36 个月现金跑道，给 XBOW 留出窗口：要么达到能支撑更高估值增长轮的 ARR 里程碑，要么积累足够证据促成战略退出。公司融资速度——16
              个月超过 $272M——即便放在 AI 原生网络安全公司里也很罕见；战略投资人组合还通过 Accenture 的 Cyber.AI 托管安全产品和 Samsung 的亚太分发，带来潜在渠道选择权。

              投后估值完全锚在投资人谈判形成的私有市场价格上，没有可独立验证的收入指标。若套用 AI 原生 SaaS VC 轮次中位数倍数（21.2x，见财务章节引用的 SaaSRise Q1 2026 数据），隐含 ARR
              约为 $47M；私有市场 M&A 8–15x 的中点口径则对应很宽的 $67–125M 区间。核心反推 ARR 区间为 $47–$100M，逻辑上说得通，但完全未经确认。
