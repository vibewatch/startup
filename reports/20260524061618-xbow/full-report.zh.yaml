      - number: '7.4'
        title: 企业集中度与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              财务风险故事不在于 XBOW 缺资本，而在于资本可能是在覆盖不确定性，而不是消除不确定性。公开来源支持超过 $272 million 融资和 100 多家企业客户，但没有披露
              ARR、留存、毛利率、收入集中度或现金烧钱结构。这让投资者只能承销一家技术上令人印象深刻、但缺少判断可复制性所需运营数据的公司。最反向的公开数据点是创始人承认计算成本超过 HackerOne
              收入，且公司当前亏损运营。如果模型推理和攻击执行成本持续结构性偏高，规模扩大可能在定价追上之前先恶化经济性。公开 GTM 证明也偏向战略投资人和标杆参考，这有价值，但不等同于广泛、高效获客。残余问题是：XBOW
              正在打造一家耐久的软件公司，还是一个昂贵的高端服务，只有在叙事动能和伙伴支持持续时经济性才改善。因此，否决标准和传导图聚焦可衡量运营事件，而不是抽象乐观的品类创造。
