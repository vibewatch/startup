      - number: '8.2'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              最相关的私有市场可比公司是 Pentera——一家自动化安全验证公司，2025 年 3 月以 $1B+ 估值完成 $60M Series D。Pentera 公开披露的 ARR 约
              $117.4M（GetLatka，2025 年 11 月更新），意味着在 $1B 节点上的 EV/ARR 倍数约为 8.5–10x。Pentera 的 ARR 还在四年内增长超过 300%，服务 1,100+
              客户，并把平均客单价提高到约 $100,000。这给出一个可辩护的估值锚：如果 XBOW 在 Series C 时已经达到 Pentera 等量级 ARR，$1B 价格就有支撑；如果 XBOW 的 ARR
              明显低于 $100M，这个溢价就需要更高增长率、更大客单价或更强技术来解释。

              Horizon3.ai（NodeZero）报告 FY2026 ARR 同比增长 102%，全球客户 5,200+，净美元留存率 125%，总美元留存率 94%。GetLatka 数据（2025 年 9
              月更新）显示 Horizon3.ai ARR 为 $50.7M，并按 GetLatka 模型给出 $152.1M 的隐含市场估值——显著低于其 Series D 后真实私有市场隐含价值。TechCrunch
              2025 年 5 月报道称，Horizon3.ai 正在融资 $100M，由 NEA 领投。Horizon3.ai 的规模（5,200 个客户，而 XBOW 为 100+）凸显了 MSSP 渠道模式相对于
              XBOW 直营企业销售动作的数量分布优势。

              上市公司一侧，估值图景明显分化。按 Multiples.vc Q1 2026 数据，CrowdStrike 的 LTM EV/Revenue 约为
              31.9x，反映其作为数十亿美元级平台整合者的地位。SentinelOne 披露 Q1 FY2026 收入 $229M（同比 +23%）和 $948M ARR，LTM EV/Revenue 倍数约
              5.4x。Rapid7 Q1 2026 收入 $210M（同比 -0.3%）、ARR $832M（同比 -0.6%），市场倍数更低，体现了增速放缓厂商的倍数压缩。Windsor Drake Q1 2026
              Cybersecurity Valuation Report 指出分化很强：平台公司（Identity + Cloud + Endpoint 一体化）可拿到 12x+ EV/NTM 收入，而传统单点方案很难突破
              5x。

              Cymulate 是最接近的 BAS/XSPM 类别参照，2022 年以约 $500M 估值完成 $70M Series D，为 BAS 相邻的进攻 / 验证工具提供了历史锚点。站在 XBOW 的价格点上，只有当
              XBOW 的 Web 应用利用链能力和 AI 原生设计被视为类别级领先时，相比 Cymulate 2022 年估值的溢价才说得通；HackerOne 排行榜证据只能部分支持这一点。
