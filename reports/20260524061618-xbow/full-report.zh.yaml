      - number: '6.2'
        title: 命名客户证明、案例研究与推荐语
        blocks:
          - type: paragraph
            body: >
              XBOW 的公开客户证据基座由三份正式案例研究和五条经验证推荐语构成，FeaturedCustomers 汇总显示截至 2026 年 5 月，47 个参考评分给出
              4.8/5.0。xbow.com/customer-stories 索引的客户故事覆盖 PuppyGraph（2025 年 12 月）、Seznam（2025 年 12 月）和 BloomPath AI（2025
              年 11 月），各自代表不同部署画像。

              PuppyGraph 案例研究是目前最具技术颗粒度的证据。2025 年 1 月 31 日，XBOW 自主识别出一个严重认证绕过——失败登录尝试同时返回错误信息和有效 JWT token 的边缘案例——随后又在
              2025 年 3 月 7 日发现两个严重 RCE 漏洞。PuppyGraph 之前的渗透测试供应商漏掉了这三个问题。CTO Danfeng Xu 表示：“与 XBOW
              合作之后，我们很清楚，他们的安全方法更适合我们的需求……我们决定把所有渗透测试需求都迁到 XBOW，并从周期性评估转向更贴合发布周期的连续测试方式。”
              后续一次发布前的完整渗透测试在不到两天内完成。PuppyGraph 是面向开发者的产品，服务 Coinbase、Clarivate 和 Prevalent AI 等受监管行业客户。

              BloomPath AI 案例研究展示了 XBOW 的 SOC 2 合规用例。BloomPath 是处理敏感企业数据的 AI 生产力平台，需要 SOC 2 证明才能赢得企业合同。XBOW
              用几天完成了完整项目——配置、测试、验证和审计员就绪报告——而行业标准的人工渗透测试需要六周。Security Advisor Priscilla Fong 表示：“XBOW 大幅加快了我们达到 SOC 2
              就绪的路径。” CTO Hazim Macky 补充：“与 XBOW 合作让我们看到现代安全测试应该如何运转：快速、彻底，并与开发周期紧密对齐。” BloomPath 正计划后续白盒项目，显示续约意图。

              Seznam 客户故事页面位于 xbow.com/customers/seznam，但抓取时只返回极少可读内容，确认 URL 存在，却没有提供案例研究文本。一段题为《AI 对安全测试的真实影响 | XBOW &
              Seznam》（2025 年 12 月）的 YouTube 视频记录了客户对话，但没有提供可独立验证的技术结果细节。

              案例研究之外，SentinelOne 企业发展董事 Alex Krongold 表示，“每个 XBOW 智能体都像我们内部红队的延伸，让我们以前所未有的速度和深度扩大进攻测试规模。” 一位 Samsung
              Ventures 代表确认 Samsung 是“客户”，并且已经“体验到该平台以速度和精度浮现真实世界风险的能力”。来自 Leo Golovyrin（Application Security
              Lead）的独立署名推荐语称：“即便已经过去 1 年，我仍不知道在智能体渗透测试方面，有哪家公司至少接近 XBOW。” 第二条来自 Weimo Liu（CEO，未命名公司）的署名表示：“与 XBOW
              合作之前，我们依赖另一家渗透测试供应商。他们的发现缺乏深度。关键漏洞一直没被发现，让我们产生了虚假的安全感。”

              净画像是正向但偏浅：三份案例研究、五条署名推荐语，以及两家投资人兼客户验证了运营使用。Moderna——XBOW 引用的最知名企业品牌——没有公开案例研究、没有高管引语，也没有任何公开来源中的量化结果。
