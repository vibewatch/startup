      - number: '7.3'
        title: 竞争与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              XBOW 当前最强的外部验证，同时也是依赖。Microsoft 公开在 Security Copilot 和 Sentinel 中营销该产品，帮助企业发现
              XBOW，并给公司一个蓝筹分销切口；但这也意味着一个伙伴会影响合法性、工作流位置，以及相对捆绑替代品的比较框架。市场其余部分正在整合，这会放大风险。Palo Alto Networks 推进收购 Protect
              AI，CrowdStrike 收购 Pangea；RSAC 报道显示，大型供应商正沿着既有平台版图对 AI 安全发起激进动作。因此，XBOW
              竞争的不只是漏洞利用质量，还包括买家会偏好同类最佳的进攻工具，还是偏好捆绑平台关系。战略投资人部分缓解了这一风险，因为他们验证需求；但也制造集中度问题：如果客户兼投资人提供了不成比例的证明点，那么这些渠道之外的可复制性仍未充分测试。因此，依赖图不只是技术基础设施图，更是
