      - number: '7.5'
        title: 治理、关键人和成熟度风险
        blocks:
          - type: paragraph
            body: >-
              XBOW 的治理风险，不在于已经浮出水面的丑闻，而在于投资人和客户目前必须把多少信任押在一家年轻、创始人中心化的组织上。公开资料仍把 XBOW 描绘成一家分布式公司；公司的身份高度绑定 Oege de Moor
              的可信度——他是 GitHub Copilot 的创建者。这种集中有利于融资和类别叙事，但也让战略、招聘和公共信任都暴露在关键人风险下。与此同时，企业买家要信任一个自主进攻系统，但 XBOW
              自身的公开保障材料仍很少：审阅资料中没有发现公开 VDP、公开漏洞赏金、公开 SOC 2 或 ISO 27001，也没有独立发布的安全评估。可见的缓释因素确实存在——新融资、人类复核、Microsoft
              分发和有文档的控制——但这些还不能证明治理成熟。尽调在直接检验董事会深度、继任计划、出口筛查流程和内部安全控制之前，治理仍会放大本章每一个其他问题的剩余风险。
