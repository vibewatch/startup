  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与攻击引擎
        blocks:
          - type: paragraph
            body: >-
              XBOW 的平台建立在四组件架构之上，有意把创造性探索与确定性验证分开。Coordinator
              是持久化编排引擎，维护目标环境的全局视图，把边界很窄的任务分配给并行攻击智能体，复盘输出，并用确定性逻辑细化发现、排序下一步行动。Attack Agents 是短生命周期、独立推理的 AI
              工作者；每个智能体都带着全新上下文和聚焦目标启动，任务结束即退役，以避免累积偏差或上下文坍塌。这个设计直接针对单智能体、长周期系统中观察到的失败模式。Attack Machine 提供共享执行环境，包含可控的
              headless Chrome 浏览器、行业标准进攻安全工具（扫描器、fuzzer、exploit 框架），以及支持多步 exploit 链接的智能体协作服务。Validator Engines
              用受控、非破坏性挑战独立确认可利用性——headless 浏览器执行 XSS 的 JavaScript payload，程序化检查验证注入结果——之后才把任何发现推到报告界面。XBOW 把这种分离概括为“创造性
              AI 负责发现，确定性逻辑判断什么是真的”；架构明确围绕零误报设计，通过要求每个报告发现都有客观 exploit 证明来落地。平台使用“model alloys”技术运行 LLM
              推理，在同一对话线程中动态调用多个基础模型（包括 GPT-5 和 Opus 4.6）；集成 GPT-5
              后，基准表现提升超过一倍。验证器设计还包含行动前安全检查器，在执行前审查每个智能体行动，并在网络层强制范围控制，确保任何无法验证为在既定目标边界内安全的行动都不会运行。
