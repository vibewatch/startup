      - number: '6.4'
        title: 留存、耐久性与扩张信号
        blocks:
          - type: paragraph
            body: >
              XBOW 没有公开披露净留存率（NRR）、总留存率（GRR）或客户流失指标。现有留存证据完全是定性的、轶事性的，来自案例研究中的后续意图和推荐语，而不是队列统计。

              正向留存信号包括：（1）PuppyGraph 在初始严重漏洞被发现后，从一次性交易项目转向连续、持续的渗透测试模式；CTO Danfeng Xu 表达了扩大 XBOW
              在其安全栈中角色的意图。（2）BloomPath AI CTO Hazim Macky 明确表示，公司“正在基于这次经验采用连续渗透测试模式”，并计划后续白盒项目。（3）Enterprise
              连续层按年度订阅或点数包结构定价，对大客户而言在结构上嵌入了多周期关系。（4）至少三家投资人兼客户（SentinelOne、Samsung、Accenture）在运营使用之外还作出财务承诺，为持续部署创造了强对齐激励。

              扩张杠杆存在，但公开证据仍不充分。Samsung 在韩国的经销商角色、Accenture Cyber.AI 嵌入、AWS
              联合销售安排，分别代表从单一买方关系扩展到平台级或分销级触达的潜在路径。在单个客户层面，“先落地再扩张”模式可见（按需 Plus/Premium → Enterprise
              continuous），但没有扩张率或增购转化的汇总数据。

              客户集中风险实质存在。公司只有两个独立命名的非投资人客户（Moderna 和
              Seznam），且没有收入或账户分布拆分，预订额中相当比例可能集中在少数企业账户。投资人兼客户重合（Accenture、Samsung、SentinelOne）进一步压缩了需求信号的有效独立性。截至运行日期，公开来源没有发现被公开引用的离开、流失账户、失败部署或续约降级，但在一家只披露摘要级客户指标的公司语境下，没有反向证据并不等于留存强劲。
