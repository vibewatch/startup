  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: standard
    summary: 五节点链条从市场机会出发，经过产品证明和牵引力，到估值不透明，最终落到继续研究 / 观察建议。
    data:
      nodes:
        - id: market
          label: 大规模 TAM（渗透测试 + BAS 合计 $4.6B+）
          detail: 渗透测试 $2.4B；PTaaS $720M；BAS $1.08B；ASM 相邻市场 $1.25B
          tone: positive
        - id: product
          label: '已验证 AI 能力（HackerOne #1 排名）'
          detail: 自主漏洞利用链；约 0% 误报；Microsoft + AWS 生态
          tone: positive
        - id: traction
          label: 100+ 企业客户；累计融资 $272M+
          detail: Moderna、Samsung、Accenture 为客户；战略投资者一致
          tone: positive
        - id: opacity
          label: ARR/收入零披露；CEO 确认经营亏损
          detail: 无 ARR、无收入运行率；GetLatka 未找到收入记录（2025 年 10 月）
          tone: warning
        - id: valuation
          label: 隐含 10–21x ARR 倍数；相对 Pentera 可比公司偏高
          detail: Pentera ARR $117M、约 8.5-10x；按 $1B+ 估值反推 XBOW ARR 为 $47–100M
          tone: warning
        - id: rec
          label: 建议：继续研究 / 观察
          detail: 若披露 ARR > $80M 且 NRR > 110%，上调至买入；若出现下轮降估值融资，下调至回避
          tone: neutral
      edges:
        - from: market
          to: product
          label: 创造需求
        - from: product
          to: traction
          label: 转化为客户
        - from: traction
          to: opacity
          label: 但财务未披露
        - from: opacity
          to: valuation
          label: 估值无锚
        - from: valuation
          to: rec
          label: 证据门槛下的判断
    claimRefs:
      - CV001
      - CV005
      - CV017
      - CV018
      - CV039
  - id: FV002
    title: $1B 估值下，不同倍数情景隐含的 XBOW ARR
    type: bar
    layout: standard
    summary: 在 $1B+ 入场估值下，隐含 ARR 从 $48M（21.2x AI 原生 VC 中位数）到 $200M（5x 传统底部）不等。可投资区间为 $48–$125M；若低于 $48M，即使用前瞻增长假设，估值也站不住。
    data:
      items:
        - label: 传统底部（5x）
          value: 200
        - label: 私有市场 M&A 低位（8x）
          value: 125
        - label: 与 Pentera 持平（10x）
          value: 100
        - label: 私有市场 M&A 高位（15x）
          value: 67
        - label: AI 原生 VC 中位数（21x）
          value: 48
    approximationNotes: 所有数值都用相应倍数从 $1B 投后估值反推。XBOW 尚未披露 ARR；这些数值代表支撑各倍数所需的隐含 ARR。
    claimRefs:
      - CV017
      - CV018
      - CV021
      - CV022
  - id: FV003
    title: XBOW 各情景估值区间（2027 年退出隐含价值）
    type: range
    layout: standard
    summary: 2027 年隐含退出价值预期从 $245M（悲观）到 $2,700M（乐观）不等；基准情景为 $1.1B–$1.7B，相对 $1B+ 入场价大致持平至 1.7x 回报。
    data:
      items:
        - label: 悲观情景（ARR <$40M，7x 倍数）
          low: 175
          high: 280
        - label: 基准情景（ARR $80–120M，14x 倍数）
          low: 1120
          high: 1680
        - label: 乐观情景（ARR $150M+，18x 倍数）
          low: 2200
          high: 3200
    approximationNotes: 所有数值都是分析师基于 ARR 假设和可比倍数给出的估计。XBOW 没有公开披露财务数据。区间反映 ARR 和倍数两方面的不确定性。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV036
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: compact
    summary: 面向投委会的七维评分显示，XBOW 市场和产品基本面强，但财务不透明、估值偏高，仍把建议锚定在继续研究。
    data:
      items:
        - label: 市场机会
          value: 8/10 — $4.6B+ TAM, 22.6% CAGR, regulatory mandate cohort
        - label: 产品与技术
          value: '9/10 — HackerOne #1 rank, Microsoft/AWS integration, novel exploit chain'
        - label: 客户证明
          value: 5/10 — 100+ enterprise customers, unnamed majority; Moderna/Samsung visible
        - label: 财务透明度
          value: 1/10 — No ARR, no revenue, CEO confirmed operating loss
        - label: 相对同业估值
          value: 4/10 — $1B+ vs Pentera $1B at $117M ARR; premium unsubstantiated
        - label: 执行风险
          value: 5/10 — Strong team, but single-founder concentration and revenue opacity
        - label: 退出可选性
          value: 6/10 — M&A targets (Palo Alto, Microsoft, CrowdStrike) credible; IPO 3+ years out
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV017
      - CV039
