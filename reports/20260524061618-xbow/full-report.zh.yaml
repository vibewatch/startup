              XBOW 六家 Series C 延期轮投资者中，有三家——Accenture、Samsung、SentinelOne——已确认是运营客户，并在活跃部署之外作出财务承诺。SentinelOne 认可 XBOW
              “像我们内部红队的延伸一样运行”，提供了来自企业安全买家的第三方验证，而这个买家能直接接触竞争替代品。这种投资人兼客户动态增强了其他企业采购团队眼中的可信度，并释放出任务关键使用而非探索性使用的信号。
