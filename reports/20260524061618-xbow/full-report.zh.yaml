  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              XBOW 进入的是一个多层竞争市场，买家可以把不同层作为自主进攻安全的替代品或补充。第一层是传统人工渗透测试（Mandiant/Google、Bishop Fox、NetSPI、Rapid7
              Services）：这些公司拥有深厚企业关系、合规记录和可审计交付物。它们享有高切换成本，并在企业采购名单上占据优选供应商地位。第二层是 PTaaS
              平台（Cobalt、Synack），用平台管理的持续或按需专家测试替代一次性项目，通常把人类研究员与 AI 辅助分诊结合。第三层是自动化安全验证和 BAS 厂商（Pentera、Horizon3.ai
              NodeZero、AttackIQ、SafeBreach、Cymulate、XM Cyber），自动化攻击模拟以验证安全控制。第四层，也是最早期的一层，正是 XBOW
              的定位：完全自主的利用链发现，在没有人类参与测试闭环的情况下，以机器速度发现真实、全新的漏洞。

              Gartner 把第二至第四层合并到「Adversarial Exposure Validation」（AEV，对抗性暴露验证）之下，预计合并市场到 2026 年达到 $2.5B，CAGR 为 35%，并预计到
              2027 年 40% 企业会把暴露验证项目正式化。这种合并同时带来顺风（买家正在主动采用）和逆风（功能趋同、既有厂商 AI 投入、买家对品类边界混淆）。XBOW
              的具体论点是，只有完整自主利用链能力——而不是重放攻击场景或人工辅助验证——才能跟上 AI 加速的对手。2026 年 RSAC 公布的 Microsoft Security Copilot 与 Sentinel
              集成，是 XBOW 的主要进入市场切入点，也是截至运行日期没有竞争对手复制的分发差异化。
