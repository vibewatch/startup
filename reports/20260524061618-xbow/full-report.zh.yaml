  - id: FE001
    title: XBOW 平台架构栈
    type: stack
    layout: standard
    summary: 四层架构把 AI 发现（Agents）和确定性验证（Validators）分开，由持久化 Coordinator 编排，并用真实攻击性安全工具落地。
    data:
      layers:
        - id: coordinator
          label: Coordinator（编排与决策）
          detail: 持久维护全局攻击面视图；分派任务并汇总智能体复盘；用确定性逻辑把漏洞发现升级；在攻击周期之间重排优先级
        - id: agents
          label: 攻击智能体（AI 推理工作单元）
          detail: 短生命周期、窄范围的并行工作单元；每次任务都用新上下文——不累积偏差；借助 LLM 模型组合做人类式创意推理；任务完成后退役
        - id: attack-machine
          label: 攻击机器（执行环境）
          detail: 沙箱化无头 Chrome 浏览器；标准与定制攻击性安全工具；智能体间协作服务；用 SimHash 和 imagehash 去重
        - id: validators
          label: 验证器引擎（确定性验证）
          detail: 受控、非破坏性的漏洞利用挑战；通过无头浏览器执行载荷验证 XSS；通过程序化响应检查验证注入；通过逐字节 padding oracle 提取验证密码学问题
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
  - id: FE002
    title: XBOW 客户工作流：从范围到报告的运行流程
    type: flow
    layout: standard
    summary: 五步自主流程从客户设置开始，经过并行智能体攻击执行，最终交付已验证报告；同时保留可选 API 与 CI/CD 集成路径。
