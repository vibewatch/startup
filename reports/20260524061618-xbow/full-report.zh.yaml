      - number: '1.3'
        title: 资本结构、投资方与战略里程碑
        blocks:
          - type: paragraph
            body: >
              XBOW 创立后融资节奏高度压缩。Sequoia Capital 领投 Seed 轮，并与 Nat Friedman 共同领投 Series A。2025 年 6 月，公司完成 Altimeter Capital
              领投的 $75M Series B，累计融资达到 $117M。该公告与 XBOW 展示其平台登上 HackerOne 美国榜单第 1 名同时发生——这是自主系统首次做到这一点——随后又登上全球第 1 名。

              2026 年 3 月，XBOW 完成由 DFJ Growth 和 Northzone 领投的 $120M Series C，估值超过 $1B，累计融资达到 $237M。该轮还包括 Sofina、Alkeon
              Capital，以及 Altimeter、NFDG Ventures 和 Sequoia 的继续参与。DFJ Growth 的投资论点建立在 XBOW 的真实世界验证之上：商业部署、HackerOne 排名和
              Fortune 500 客户牵引。

              2026 年 5 月，XBOW 又获得战略投资方 $35M 延伸轮：NVIDIA（NVentures）、Accenture Ventures、Samsung Ventures、SentinelOne S
              Ventures、DNX Ventures 和 Liberty Global Tech Ventures。其中几家投资方同时也是活跃客户，这一模式强化了平台在企业安全栈中的任务关键定位。延伸轮使 Series C
              总额达到 $155M，累计融资超过 $272M。

              除融资外，XBOW 也推进了生态集成。2026 年 3 月，它把持续渗透测试嵌入 Microsoft Security Copilot 和 Sentinel（RSAC 2026 公开预览）。2026 年 5
              月，公司加入 AWS ISV Accelerate Program。公司披露截至 2026 年 5 月全球客户超过 100 家，包括 Moderna 和 Seznam。收入和盈利能力未披露；CEO
              公开承认平台目前处于财务亏损状态，这与激进招聘和国际扩张相符。截至运行日期，公开来源未发现诉讼、监管处罚或重大治理争议。
