      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >
              XBOW 创始团队与 AI 编码和代码安全生态有异常直接的传承关系。Oege de Moor 拥有 University of Oxford 计算机科学 DPhil 学位，并曾就读于 Utrecht
              University，之后创办代码分析与安全公司 Semmle；Semmle 被 GitHub 收购后，成为 GitHub Advanced Security 的基础。在 GitHub 和
              Microsoft，他随后主导创建了 GitHub Copilot，这是史上采用最广的 AI 编码工具之一。他同时具备 AI 软件开发和代码安全背景，是 XBOW 产品论点的智力基础；最初的核心工程团队也大多来自
              Copilot 项目。

              XBOW 的 CISO Nico Waisman 在公司创立时从 Lyft 加入，曾任 Lyft CISO。他组建了一支精英人类黑客团队，包括知名 HackerOne 研究员 Diego Dorado 和
              Joel Noguera，为自主系统提供训练数据和提交前复核。Albert Ziegler 负责 AI 研究，Andy Rice 负责工程。商业侧，Jonaki Egenolf 加入担任 CMO，带来 Snyk
              和 Veracode 经验；Niro Rajadurai 担任 CRO，Dean Breda 担任总法律顾问。

              董事会按明确节奏补强。Databricks 前 CRO Ron Gabrisko 于 2025 年 12 月加入，在董事会层面支持收入扩张。Series C 中，DFJ Growth Venture
              Partner、Sumo Logic 前 CEO Ramin Sayar 也加入董事会。2026 年 1 月，WonLae Lee 被任命为韩国总经理，这是 XBOW 亚太战略中第一个市场级任命。

              关键人风险集中在 de Moor 身上。战略、融资、技术可信度和公司对外叙事，都与他作为 GitHub Copilot 创建者的个人履历紧密绑定。2026
              年投资人阵容在董事会层面补充了企业可信度，但考虑到公司仍处早期且身份高度围绕创始人，独立治理深度仍需审视。CISO 角色也可能成为自主攻击系统负责任部署中的单点故障。
