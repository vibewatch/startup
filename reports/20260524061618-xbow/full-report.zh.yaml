      - number: '5.3'
        title: 生态集成与云合作
        blocks:
          - type: paragraph
            body: >-
              XBOW 有意推进集成策略，把自主进攻引擎嵌入企业已经运行的安全栈。2026 年 3 月，XBOW 宣布与 Microsoft 合作，将连续渗透测试集成进 Microsoft Security Copilot 和
              Microsoft Sentinel，并在 RSAC 2026 以公开预览形式上线。集成包含三个组件：XBOW Pentest Manager Agent（在 Security Copilot
              内发起并管理评估）、XBOW Pentest Analysis Agent（分析哪些攻击活动被检测到或漏检，以突出检测缺口）、XBOW Sentinel Connector（把已验证发现作为结构化记录写入
              Sentinel 数据湖）。目标是在 AppSec 和 SecOps 之间形成连续反馈回路：进攻发现成为检测和响应工作流的实时输入，运营遥测再反过来影响后续测试优先级。Microsoft Security
              Platform & AI 企业副总裁 Shawn Bice 称，该集成“帮助各行业客户把进攻洞察直接接入现有工作流”。2026 年 5 月，XBOW 加入 AWS ISV Accelerate
              Program，可通过 AWS Sales 联合销售，并让已经运行在 AWS 平台上的企业通过现有 AWS 渠道获得 XBOW。Accenture 对 XBOW
              作出战略投资，明确用于推进连续进攻安全测试和暴露管理。Microsoft Security Store 将 XBOW Sentinel Connector
              列为合作伙伴解决方案，提供了独立第三方参照，说明该集成已经上线并联合营销。
