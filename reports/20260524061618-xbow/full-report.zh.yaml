      - number: '6.5'
        title: 反向证据——采用障碍、信任缺口与证明局限
        blocks:
          - type: paragraph
            body: >
              若干独立且持怀疑态度的来源指出了有意义的采用挑战，而正面案例研究叙事并未回应这些问题。

              范围和连续性限制：Escape.tech 的 2026 年市场分析把 XBOW 描述为“为起价 $6,000 / 次渗透测试的周期性红队式项目而建”，并称其“不是为连续测试而设计”——这与 XBOW 对
              Enterprise 层的自身定位直接矛盾。文章识别出客户摩擦点，包括缺少独立 API 测试覆盖（2026 年进入路线图）、没有原生回归测试，以及季度扫描时点数包消耗风险。Escape 指出，潜在 XBOW
              评估者经常会问：“它能测试我们的 API 吗？它能确保同一漏洞不会再次出现吗？季度扫描会不会烧完我们的点数？” 这些问题反映了真实采购摩擦，尤其会拖慢或阻断 DevSecOps 成熟、需要 API
              优先连续覆盖的组织交易。

              从业者承认的技术范围局限：安全社区一篇广泛阅读的 Medium 文章（2025 年 7 月）承认 XBOW 在常规漏洞类别上自主表现很强，但列出有文档记录的盲点：业务逻辑漏洞、多步漏洞利用链、环境特定
              bug、社会工程，以及带真实世界上下文的风险优先级排序。Reddit 和 LinkedIn 社区声音确认：“它很擅长低垂果实，但会漏掉更深层问题”，以及“XBOW
              的表现很惊艳，但别假装它正在取代专家渗透测试员”。同一文章指出，“内部人士和从业者称”发现提交到漏洞赏金项目前仍会人工验证——这限定了“完全自主”的说法。

              信任和双重用途障碍：企业部署自主进攻安全工具，必须授权 XBOW 智能体访问生产或预发布应用环境。对受监管行业（医疗、金融服务、关键基础设施）而言，数据驻留、范围封控和自主测试执行可审计性都是采购前提。XBOW
              没有公开披露自身平台的 SOC 2 Type II 认证、HIPAA Business Associate Agreement 可用性，或针对评估期间处理的受监管行业数据的具体合同保护。

              披露稀薄：没有任何可独立验证的收入指标，未发布客户数随时间增长情况，旗舰客户名称又集中在投资人名单（Accenture、Samsung、SentinelOne）而非保持臂距的企业买家，这些都削弱了客户证明的证据强度。只有两家命名企业客户（Moderna、Seznam）真正独立于
              XBOW 投资人基础，且两者都没有带量化结果的公开案例研究。
