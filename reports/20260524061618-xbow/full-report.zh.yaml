      所有数值都由定性信号构建（PuppyGraph 转向连续模式；BloomPath 计划后续项目；Enterprise 连续订阅档意味着跨期关系；没有披露已流失客户）。XBOW 不披露 NRR、GRR
      或队列级留存。截至运行日期，2025 H1 的 M+12 以及 2025 H2 的 M+6/M+12 尚未走完；这些数值是前瞻估计，不是已观测留存。所有数值只说明可能的留存预期，不是实证测量。
    claimRefs:
      - CU012
      - CU027
      - CU030
      - CU038
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 按可能性与严重性审视 XBOW 的主要风险可以看到，责任错配、自身平台信任和伙伴依赖落在综合风险最高的格子里。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重性极高
          values:
            - label: EU AI Act 突变
              tone: warning
              detail: 短期 Annex III 时间压力缓解，但未来若重新分类，影响会很大。
            - label: 出口管制执法
              tone: warning
              detail: 政策模糊确实存在，但正式执法仍是尾部事件。
            - label: 责任 / 信任错配
              tone: adverse
              detail: $100 上限加上保障材料稀疏，已是当前企业异议点。
        - label: 高严重性
          values:
            - label: APTS 成熟度缺口
              tone: warning
              detail: 平台范围扩大后，控制负担上升。
            - label: 自身平台安全缺口
              tone: adverse
              detail: 未发现公开 VDP 或证明文件。
            - label: Microsoft 依赖
              tone: adverse
              detail: 分发和可信度都贴近一个主要伙伴。
        - label: 中等严重性
          values:
            - label: 叙事夸大
              tone: neutral
              detail: 排行榜覆盖可能跑在企业现实前面。
            - label: 客户集中度不透明
              tone: warning
              detail: 披露 100+ 客户，但没有结构或续约细节。
            - label: 业务逻辑漏报风险
              tone: warning
              detail: 已知弱项可能带来代价高昂的漏报。
    claimRefs:
      - CR009
      - CR010
      - CR012
      - CR017
      - CR022
      - CR031
      - CR039
      - CR045
      - CR047
