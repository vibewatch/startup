  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资时间线与资本结构
        blocks:
          - type: paragraph
            body: >
              XBOW 走出了网络安全史上最快的资本积累轨迹之一，创立后 16 个月内累计融资达到 $272M+。公司完成了四个具名轮次中的五个融资事件：2024 年 7 月由 Sequoia Capital 领投的 Seed
              轮（约 $20M）；2024 年 10 月由 Sequoia 和 Nat Friedman 共同领投的 Series A（约 $22.5M）；2025 年 6 月由 Altimeter 的 Apoorv
              Agrawal 领投的 Series B（$75M，使累计融资达到 $117M）；2026 年 3 月由 DFJ Growth 和 Northzone 领投的初始 Series C（$120M，跨过 $1B
              估值门槛）；以及 2026 年 5 月的 Series C 延伸轮（来自 NVIDIA NVentures、Accenture Ventures、Samsung Ventures、SentinelOne S
              Ventures、DNX Ventures 和 Liberty Global Tech Ventures 的 $35M），使 Series C 总额达到 $155M，累计融资超过 $272M。

              早期轮次（Seed 至 Series A，合计约 $42.5M）资助平台研发，以及在未具名大型金融机构和科技公司中的初始设计伙伴部署。$75M Series B 跟随公司登上 HackerOne 全球榜单第 1
              的成绩，并与产品全面可用发布同步，标志着公司从概念验证转向商业运营。Series C 资助规模化：加速企业采用、深化产品创新并推进国际扩张；DFJ Growth 的 Ramin Sayar
              加入董事会，支持企业进入市场执行。

              Series C 延伸轮投资方值得注意，因为 Samsung、Accenture 和 SentinelOne 等几家同时也是 XBOW 客户，形成客户-投资人一致性，传递出任务关键采用信号。Accenture
              明确宣布会把 XBOW 嵌入其 Cyber.AI 托管安全产品，提供潜在大规模渠道。各笔投资条款未公开披露，因此外部尽调无法获取精确股权稀释、清算优先权和保护性条款。

              XBOW 将总部列为 WA 州 Seattle，因此其融资轮被计入 Seattle 区域风投资本总额。GeekWire 报道称，$120M 初始 Series C 对 Seattle 2026 年 Q1 69
              笔交易、合计 $1.5B 风投活动贡献显著；尽管公司在 Seattle 的实体存在只是一个联合办公邮箱，250 多名员工中的大多数分布在全球。
