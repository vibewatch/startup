      - number: '2.3'
        title: 买家分层与决策机制
        blocks:
          - type: paragraph
            body: >
              约 71% 企业中，渗透测试预算归 CISO 所有；其余由 IT 运维和合规职能分担。因此在多数交易中，CISO 同时是技术评估者和财务决策者，相比买方角色分离的企业 SaaS
              品类，评估周期被压缩。500–5,000 名员工的中型企业，是 PTaaS 采用增速最高的板块：它们需要满足 PCI DSS 4.0、SOC 2，以及欧洲 DORA 和 NIS2
              的强制合规义务，却缺乏搭建完整内部红队的预算或人员深度。该板块最常见的采用触发点不是主动安全投资，而是合规审计发现、网络保险续约要求或监管检查压力。

              金融服务是强制监管需求最大的单一垂直行业：DORA 的威胁主导渗透测试（TLPT）要求自 2025 年 1 月生效，覆盖超过 22,000 家欧盟金融实体；PCI DSS 4.0 从 2024 年 3
              月起，把强制年度渗透测试要求扩展到更广泛的卡数据环境。医疗和科技行业是后续两大买家群体，分别受 HIPAA/HITECH 义务和 SaaS 供应商 SOC 2
              审计要求驱动。政府和国防则是独立的合规驱动板块（FISMA、CMMC 2.0），采购周期更长，预算结构偏向成熟供应商，给 XBOW 这类新自主平台带来时间滞后。Scantist 2026 年竞争分析把
              XBOW、Pentera 和 Horizon3.AI 列为争夺该买家基础的前三大自主测试平台。
