chapter:
  number: 4
  title: Financials
  summary: >-
    XBOW has raised $272M+ across five rounds since January 2024, achieving unicorn status in March 2026 via
    a $120M Series C at over $1B valuation, then extending with $35M from strategic investors (NVIDIA,
    Accenture, Samsung, SentinelOne) in May 2026. No ARR or revenue figure has been publicly disclosed,
    and the CEO acknowledged operating at a loss; applying AI-native SaaS valuation multiples (10x–21x)
    implies an ARR range of $47M–$100M, but this is entirely inferred. The $155M Series C provides an
    estimated 18–36 months of runway, with enterprise go-to-market still ramping. The absence of any
    financial disclosure prevents independent verification of whether the $1B+ valuation is justified.

sections:
  - id: funding-chronology-capital-structure
    title: Funding Chronology and Capital Structure
    body: >
      XBOW executed one of the fastest capital accumulation trajectories in cybersecurity history, reaching
      $272M+ in aggregate capital raised within 16 months of founding. The company completed five distinct
      financing events across four named rounds: a Seed round in July 2024 led by Sequoia Capital (~$20M),
      a Series A in October 2024 co-led by Sequoia and Nat Friedman (~$22.5M), a Series B in June 2025 led
      by Altimeter's Apoorv Agrawal ($75M, bringing the cumulative total to $117M), an initial Series C in
      March 2026 led by DFJ Growth and Northzone ($120M, crossing the $1B valuation threshold), and a Series C
      extension in May 2026 ($35M from NVIDIA NVentures, Accenture Ventures, Samsung Ventures, SentinelOne
      S Ventures, DNX Ventures, and Liberty Global Tech Ventures), bringing total Series C to $155M and
      lifetime capital above $272M.

      The early rounds (Seed through Series A, totaling approximately $42.5M) funded platform R&D and initial
      design-partner deployments at unnamed major financial institutions and technology firms. The $75M Series B
      followed the company's achievement of the #1 HackerOne global leaderboard rank and coincided with the
      product's general availability launch, signaling the transition from proof-of-concept to commercial
      operation. The Series C funded scale-out: accelerating enterprise adoption, deepening product innovation,
      and executing international expansion, with DFJ Growth's Ramin Sayar joining the board to support
      enterprise go-to-market execution.

      The Series C extension investors are notable because several—Samsung, Accenture, and SentinelOne—are
      simultaneously XBOW customers, creating a customer-investor alignment that signals mission-critical
      adoption. Accenture explicitly announced it will embed XBOW in its Cyber.AI managed security product,
      providing a potential volume channel. The terms of each investment were not publicly disclosed, leaving
      the precise equity dilution, liquidation preferences, and protective provisions inaccessible to external
      diligence.

      XBOW lists Seattle, WA as its headquarters, and consequently its funding rounds are counted in Seattle's
      regional venture capital totals. GeekWire reported that the $120M initial Series C contributed meaningfully
      to Seattle's $1.5B in Q1 2026 VC activity across 69 deals, even though the company's physical presence
      in Seattle is a coworking mailbox, with the majority of its 250+ employees distributed globally.
