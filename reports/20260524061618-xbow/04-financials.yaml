  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-opacity
      missingEvidence: >-
        XBOW's ARR, revenue run rate, gross margin percentage, net revenue retention rate, and
        average contract value — none of which are publicly disclosed.
      whyItMatters: >-
        Without ARR and margin data, external parties cannot independently verify the $1B+ valuation,
        assess capital adequacy relative to actual burn, or benchmark enterprise adoption vs. category peers.
        This is the primary diligence blocker for any investment or strategic decision.
      diligencePath: >-
        Request ARR, NRR, and ACV data under NDA directly from XBOW's CFO or CRO during a formal
        due diligence engagement. Cross-reference against Salesforce or similar CRM data snapshots
        if available.
      relatedQuestionRefs:
        - QI003
        - QI010
        - QI020

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: >-
        Actual cash position, monthly burn rate, and current runway based on XBOW's internal financials.
      whyItMatters: >-
        The burn rate estimate in this chapter is bottom-up and unverified. Actual burn could be higher
        (if XBOW is investing more aggressively in AI compute) or lower (if enterprise contract revenue
        is already partially covering costs), materially affecting runway and next-round timing assessments.
      diligencePath: >-
        Request management accounts (P&L, cash flow statement) through a controlled NDA data-room process.
      relatedQuestionRefs:
        - QI005
        - QI022

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >-
        XBOW's gross margin structure, including how AI inference costs, human hacker review fees,
        and platform overhead are allocated between COGS and operating expenses.
      whyItMatters: >-
        Gross margin is a critical indicator of unit economics and scalability in an AI-agent business
        where compute costs scale with usage. Low gross margins would significantly compress the defensible
        valuation multiple and imply a need for substantial architectural cost reduction before XBOW can
        reach SaaS-class margins.
      diligencePath: >-
        Request gross margin disclosure in the NDA due diligence process; benchmark against competitor
        gross margins once Horizon3.ai's metrics are disclosed publicly.
      relatedQuestionRefs:
        - QI022

    - type: private-evidence-only
      severity: material
      topic: CAC-LTV
      missingEvidence: >-
        Customer acquisition cost, payback period, and LTV:CAC ratio for XBOW's enterprise go-to-market,
        distinguishing between self-service on-demand test channels and enterprise direct sales.
      whyItMatters: >-
        GTM efficiency is the primary forward valuation driver after revenue base; without CAC:LTV data,
        the sustainability of XBOW's enterprise land-and-expand motion cannot be assessed, and the
        Accenture and AWS channel contributions cannot be modeled.
      diligencePath: >-
        Request sales cohort data, average time-to-close, contract expansion rates, and GTM unit
        economics through due diligence data room.
      relatedQuestionRefs:
        - QI020

