  - id: cost-structure-burn-runway
    title: Cost Structure, Burn Rate, and Runway
    body: >
      XBOW does not disclose cost structure, burn rate, or cash position. All estimates in this section are
      bottom-up models derived from publicly available headcount data and industry benchmarks; they should
      not be treated as factual until independently verified.

      The largest cost driver is personnel. With 250+ employees distributed across engineering, security
      research, sales, marketing, and G&A, and given the concentration of senior AI engineers and elite
      offensive security talent, a blended fully-loaded cost of $200K–$260K per employee is plausible for a
      company with this profile. This yields an annual personnel expense of $50M–$65M. AI inference costs—
      operating thousands of autonomous agents continuously against customer environments—represent an
      elevated infrastructure cost relative to typical SaaS companies; GPU compute and model inference
      overhead are likely in the range of $5M–$15M per year. Sales and marketing is ramping rapidly given
      the enterprise go-to-market push (CRO, CMO, and regional GM hires), contributing an estimated
      $8M–$18M annually. G&A, legal, and compliance add $3M–$7M. Combined, the estimated annual operating
      run rate is $66M–$105M, or approximately $5.5M–$8.8M per month. This is a pre-revenue view; actual
      net burn is reduced by revenue recognized from enterprise contracts.

      The $155M Series C, if all unspent, provides approximately 18 to 28 months of runway at the
      mid-to-high burn scenario. Given the company had deployed $117M before the Series C and likely entered
      the Series C with a material cash cushion from Series B, the effective runway from the May 2026
      extension close is comfortably greater than 18 months. The next capital trigger is most likely tied
      to either an ARR milestone demonstrating sustainable growth (making another growth round attractive)
      or a strategic M&A event from one of the six strategic investors, several of whom are also enterprise
      customers with active integration roadmaps.

      Working capital dynamics are favorable for a subscription model but uncertain for on-demand tests.
      If enterprise customers pay annually in advance, deferred revenue will be a positive working capital
      contributor. On-demand test transactions ($4K–$8K) are likely billed per test with standard payment
      terms. The dual-model structure creates recognition complexity that is immaterial at current scale
      but will require clean accounting as the enterprise revenue base grows.
