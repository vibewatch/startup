callouts:
  - calloutType: risk
    title: Complete Revenue Opacity — Principal Diligence Blocker
    body: >-
      XBOW has not publicly disclosed any ARR, revenue, gross margin, NRR, or operating cash flow figure.
      The CEO's acknowledgment of operating losses is the only first-party financial signal. TechStackIPO's
      Grade C IPO Readiness Score and the complete absence of data from revenue tracking platforms (GetLatka,
      PitchBook free tier) reflect this opacity. External investors in secondary markets, strategic acquirers,
      and distribution partners (including the Accenture Cyber.AI integration) are all negotiating against
      a blank financial disclosure canvas. Any material valuation decision requires ARR and NRR data under
      NDA as a precondition.
    claimRefs:
      - CI009
      - CI026
      - CI027
      - CI052

  - calloutType: strength
    title: Customer-Investor Alignment Validates Mission-Critical Adoption
    body: >-
      The six strategic investors in the Series C extension (NVIDIA, Accenture, Samsung, SentinelOne,
      DNX Ventures, Liberty Global) are either confirmed or publicly described XBOW customers.
      SentinelOne's director of Corporate Development described each XBOW agent as "an extension of our
      in-house red team." Accenture announced XBOW integration into its Cyber.AI product. This dual
      customer-investor signal is a stronger demand-quality indicator than a single headline ARR number,
      suggesting revenue quality (enterprise mission-critical stickiness) even where the quantity is
      not disclosed.
    claimRefs:
      - CI004
      - CI017
      - CI038

  - calloutType: assumption
    title: ARR Range Assumes AI-Native Valuation Multiple; Elevated Froth Risk
    body: >-
      The $47M–$100M implied ARR range assumes XBOW is priced at market-rate AI-native multiples
      (10x–21x). If investor enthusiasm has applied a temporal premium—common in rapid-succession
      rounds during AI enthusiasm cycles—the actual ARR could be materially lower than the $47M base
      case. The Escape.tech competitor analysis and TechStackIPO Grade C readiness score, while not
      authoritative, both suggest caution about projecting revenue maturity that matches the funding velocity.
    claimRefs:
      - CI018
      - CI027
      - CI028
      - CI050

