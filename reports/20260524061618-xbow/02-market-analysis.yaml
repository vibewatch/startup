  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: XBOW-revenue-validation
      missingEvidence: >-
        No publicly disclosed ARR, revenue, or customer ACV data that would independently validate XBOW's
        $1B+ valuation against objective market penetration metrics; all revenue indications are investor
        language without underlying financial disclosures.
      whyItMatters: >-
        Without revenue benchmarks, XBOW's valuation multiple relative to the PTaaS SAM ($720M) cannot be
        assessed; the implied revenue multiple at $1B+ valuation and $720M SAM leaves limited ceiling for
        further appreciation unless SAM expands or XBOW captures an outsized market share.
      diligencePath: >-
        Request ARR and ACV data under NDA during due diligence; benchmark against Pentera's disclosed
        revenue metrics if publicly available.
      relatedQuestionRefs:
        - QM014

    - type: missing-source
      severity: minor
      topic: PTaaS-growth-differential
      missingEvidence: >-
        No primary analyst report explains the structural mechanism driving PTaaS CAGR (22.6%) above
        the broader cybersecurity market CAGR (~15%) in granular terms; the differential is observable
        but the causal attribution relies on inferences from budget and regulatory trend data.
      whyItMatters: >-
        Understanding whether PTaaS outperformance is regulatory-driven, talent-shortage-driven, or
        cloud-adoption-driven affects the durability of the growth premium and XBOW's positioning thesis.
      diligencePath: >-
        Review MarketsandMarkets full PTaaS report methodology chapter (paywalled); seek analyst briefing
        to attribute the CAGR differential to specific demand drivers.
      relatedQuestionRefs:
        - QM026

    - type: enumeration-incomplete
      severity: minor
      topic: buyer-segmentation
      missingEvidence: >-
        The buyer segment map (TM003) covers five major verticals but excludes energy, utilities, education,
        and logistics sectors, which face distinct regulatory frameworks (NERC CIP, FERPA) and may represent
        meaningful second-wave demand cohorts for XBOW.
      whyItMatters: >-
        If regulatory frameworks in excluded verticals create mandatory pen test requirements, the addressable
        market estimate of 300,000–500,000 mandatory buyers may be understated.
      diligencePath: >-
        Search NERC CIP and FERPA compliance guidance for pen testing requirements; review energy-sector CISO
        survey data from E-ISAC or equivalent.
      relatedTableRefs:
        - TM003
      relatedQuestionRefs:
        - QM005
