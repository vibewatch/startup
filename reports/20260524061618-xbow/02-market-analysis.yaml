callouts:
  - calloutType: strength
    title: Regulation-driven mandatory demand creates durable TAM floor
    body: >-
      PCI DSS 4.0, DORA, and NIS2 collectively mandate penetration testing for an estimated 300,000–500,000
      enterprises globally, most of which have not yet established systematic programs. This regulatory
      backfill represents a secular demand driver that is independent of economic cycles, providing
      XBOW's addressable market with a structurally stable floor beneath the discretionary portion of
      enterprise security budgets.
    claimRefs:
      - CM024
      - CM025
      - CM026
      - CM031
      - CM041
  - calloutType: risk
    title: Estimate spread and scope ambiguity complicate XBOW valuation benchmarking
    body: >-
      The 28% spread between the Mordor Intelligence ($2.42B) and MarketsandMarkets ($3.09B) penetration
      testing TAM estimates reflects genuine methodological differences rather than a converging consensus.
      Investors benchmarking XBOW's valuation against a TAM multiple should apply the narrower PTaaS SAM
      ($720M) as the defensible baseline rather than the broadest pen testing aggregate, or risk
      overestimating the realistic addressable opportunity at current product scope.
    claimRefs:
      - CM002
      - CM003
      - CM006
      - CM010

