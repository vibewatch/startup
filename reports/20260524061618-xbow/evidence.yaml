evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: XBOW revenue, ARR, burn rate, runway, and unit economics
    whyItMatters: >-
      Without revenue data, burn rate, and margin profile, it is impossible to evaluate the company's path to
      profitability or how long current capital will support operations.
    diligencePath: >-
      Request financial statements or data-room access; triangulate from headcount and funding burn through secondary
      market data providers.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Exact ownership percentages, cap table, and governance rights across all investors
    whyItMatters: >-
      Without the full cap table, it is not possible to assess dilution, liquidation preference stacks, pro-rata rights,
      or the relative influence of financial vs. strategic investors.
    diligencePath: >-
      Obtain cap table and investor rights agreement from company; review board composition and voting rights in
      shareholder agreement.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: competitive-landscape
    missingEvidence: Objective comparative metrics for XBOW vs. Pentera, Synack, Cobalt, Horizon3.AI
    whyItMatters: >-
      Without financial, customer-count, and performance data for named competitors, it is not possible to assess XBOW's
      market share or relative defensibility.
    diligencePath: >-
      Pull competitor funding histories and publicly available revenue estimates from Pitchbook, Crunchbase, and
      independent analyst reports; compare HackerOne ranking histories where available.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Full board composition, charter documents, voting rights, and formal governance framework
    whyItMatters: >-
      Key-person risk centered on de Moor is unquantified without visibility into board independence, succession
      provisions, and investor governance rights.
    diligencePath: Obtain board charter, articles of incorporation, and investor rights agreement from company.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: regulatory-risk
    missingEvidence: Formal regulatory framework, liability standards, or legal precedent governing autonomous offensive security tools
    whyItMatters: >-
      No established legal or regulatory framework specifically addresses autonomous AI pentesting. If a XBOW agent
      causes unintended damage or unauthorized access, liability exposure is unclear and could create material business
      risk.
    diligencePath: >-
      Monitor CISA, NIST, and EU AI Act developments; review XBOW's customer contract terms for indemnification and
      scope limitations; consult legal counsel on the regulatory trajectory.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: funding-history
    missingEvidence: Exact amounts and dates for Seed and Series A rounds
    whyItMatters: >-
      The milestone table and investor map contain approximate figures for early rounds; exact terms would improve the
      accuracy of the lifetime capital and dilution analysis.
    diligencePath: >-
      Request historical funding documentation from company or via Pitchbook; cross-reference law firm (Gunderson
      Dettmer) announcements for confirmation.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: XBOW-revenue-validation
    missingEvidence: >-
      No publicly disclosed ARR, revenue, or customer ACV data that would independently validate XBOW's $1B+ valuation
      against objective market penetration metrics; all revenue indications are investor language without underlying
      financial disclosures.
    whyItMatters: >-
      Without revenue benchmarks, XBOW's valuation multiple relative to the PTaaS SAM ($720M) cannot be assessed; the
      implied revenue multiple at $1B+ valuation and $720M SAM leaves limited ceiling for further appreciation unless
      SAM expands or XBOW captures an outsized market share.
    diligencePath: >-
      Request ARR and ACV data under NDA during due diligence; benchmark against Pentera's disclosed revenue metrics if
      publicly available.
    relatedQuestionRefs:
      - QM014
  - type: missing-source
    severity: minor
    topic: PTaaS-growth-differential
    missingEvidence: >-
      No primary analyst report explains the structural mechanism driving PTaaS CAGR (22.6%) above the broader
      cybersecurity market CAGR (~15%) in granular terms; the differential is observable but the causal attribution
      relies on inferences from budget and regulatory trend data.
    whyItMatters: >-
      Understanding whether PTaaS outperformance is regulatory-driven, talent-shortage-driven, or cloud-adoption-driven
      affects the durability of the growth premium and XBOW's positioning thesis.
    diligencePath: >-
      Review MarketsandMarkets full PTaaS report methodology chapter (paywalled); seek analyst briefing to attribute the
      CAGR differential to specific demand drivers.
    relatedQuestionRefs:
      - QM026
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-segmentation
    missingEvidence: >-
      The buyer segment map (TM003) covers five major verticals but excludes energy, utilities, education, and logistics
      sectors, which face distinct regulatory frameworks (NERC CIP, FERPA) and may represent meaningful second-wave
      demand cohorts for XBOW.
    whyItMatters: >-
      If regulatory frameworks in excluded verticals create mandatory pen test requirements, the addressable market
      estimate of 300,000–500,000 mandatory buyers may be understated.
    diligencePath: >-
      Search NERC CIP and FERPA compliance guidance for pen testing requirements; review energy-sector CISO survey data
      from E-ISAC or equivalent.
    relatedTableRefs:
      - TM003
    relatedQuestionRefs:
      - QM005
