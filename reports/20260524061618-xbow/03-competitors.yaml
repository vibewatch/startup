  evidenceGaps:
    - type: private-evidence-only
      severity: minor
      topic: xbow-pricing
      missingEvidence: >-
        Hadrian Nova's exact per-test pricing, Horizon3.ai's MSSP-pass-through pricing, and XBOW's
        enterprise subscription tiers are not publicly disclosed; the $6,000 per-test reference from
        Escape.tech is a third-party estimate, not an official XBOW price sheet.
      whyItMatters: >-
        Without vendor-confirmed pricing for XBOW and Hadrian, the direct per-test pricing comparison
        rests on a single adverse-stance third-party estimate; true competitive pricing displacement
        cannot be quantified.
      diligencePath: >-
        Obtain XBOW's current pricing deck and deal log from management; request Hadrian Nova pricing
        from a channel partner or direct sales inquiry to cross-validate the estimate.
      relatedQuestionRefs:
        - QP016

    - type: private-evidence-only
      severity: material
      topic: synack-profile
      missingEvidence: >-
        Synack's current total revenue, ARR, and customer count are not publicly disclosed; only
        funding total (~$112M) and select platform metrics are available from press releases.
      whyItMatters: >-
        Without Synack's revenue or customer scale, XBOW cannot be directly benchmarked against
        Synack's market penetration in regulated enterprise and government segments.
      diligencePath: >-
        Request revenue and customer data in XBOW's competitive intelligence briefings; cross-check
        against channel partner references and government procurement databases.
      relatedQuestionRefs:
        - QP007

    - type: private-evidence-only
      severity: material
      topic: market-crowding
      missingEvidence: >-
        Independent buyer survey data on enterprise preferences for autonomous vs. PTaaS vs. BAS in
        2026 procurement decisions; the PeerSpot mindshare decline may reflect platform consolidation
        rather than category-level decline.
      whyItMatters: >-
        Without buyer intent data, the interpretation of declining Pentera/NodeZero mindshare as
        "crowding" vs. "maturing consolidation" is uncertain, affecting the severity assessment of
        XBOW's competitive risk from feature convergence.
      diligencePath: >-
        Obtain Gartner Market Guide for AEV (if available), 2026 buyer surveys from Omdia or Forrester,
        or conduct primary buyer interviews across XBOW's target verticals.
      relatedQuestionRefs:
        - QP022
        - QP024

    - type: missing-source
      severity: material
      topic: xbow-vs-competitors
      missingEvidence: >-
        Head-to-head competitive win/loss rate for XBOW vs. Horizon3.ai and Pentera in enterprise
        accounts; no independent benchmark comparing XBOW's exploit-chain depth against NodeZero on
        a standard test corpus is publicly available.
      whyItMatters: >-
        Without win/loss data or a common test benchmark, XBOW's claim of superior autonomous
        exploit-chain capability compared to NodeZero and Pentera cannot be independently verified.
      diligencePath: >-
        Request competitive win/loss reports from XBOW management; seek independent security researcher
        benchmark studies (e.g., from academic labs or third-party testers).
      relatedQuestionRefs:
        - QP014
        - QP023

    - type: missing-source
      severity: material
      topic: xbow-limitations
      missingEvidence: >-
        XBOW's product roadmap for internal network, AD lateral movement, and infrastructure testing
        coverage; public sources do not confirm whether and when XBOW plans to compete in Pentera's
        and NodeZero's core domain.
      whyItMatters: >-
        If XBOW does not expand to internal/AD coverage, its total addressable enterprise pentest
        market is substantially smaller than the autonomous pentesting market as a whole.
      diligencePath: >-
        Review XBOW's product roadmap in due diligence; assess whether the Microsoft Sentinel integration
        provides any internal network telemetry that could seed an internal testing capability.
      relatedQuestionRefs:
        - QP025

    - type: private-evidence-only
      severity: minor
      topic: netspi-profile
      missingEvidence: >-
        NetSPI's revenue, ARR, customer count, and gross margins are not publicly disclosed; the
        $500M funding does not reveal operating scale.
      whyItMatters: >-
        Understanding NetSPI's commercial scale would sharpen the assessment of whether its
