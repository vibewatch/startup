  - id: bas-substitutes
    title: "BAS and Adjacent Substitutes: AttackIQ, SafeBreach, Cymulate, XM Cyber"
    body: >
      Breach and Attack Simulation (BAS) platforms—led by AttackIQ, SafeBreach, Cymulate, and XM
      Cyber—occupy the adjacent automated attack simulation market. BAS platforms replay known attack
      techniques mapped to MITRE ATT&CK to validate whether existing security controls detect and block
      documented threat actor behaviors. They do not discover novel vulnerabilities or generate new
      exploit chains; rather, they test whether a known attack would succeed. This architectural
      difference separates BAS from XBOW's genuine exploit-discovery capability.

      Omdia's March 2026 analysis finds the BAS market facing headwinds: implementations are
      resource-intensive, integration complexity is high, and many organizations cannot sustain the
      cadence needed for truly continuous control monitoring. The AEV category is emerging as the
      successor paradigm, merging BAS, automated pentest, and red teaming into unified solutions.
      Vendors like AttackIQ, Cymulate, and XM Cyber are explicitly repositioning toward CTEM and
      exposure management, which intensifies competitive pressure on XBOW from these adjacent players.

      The key differentiation XBOW should emphasize against BAS platforms is exploit-chain completeness:
      BAS tools verify whether defenses catch known attacks, while XBOW discovers whether unknown
      exploitable paths exist at all. Buyers sophisticated enough to appreciate this distinction are
      XBOW's primary adopters. Buyers focused on compliance validation and control monitoring may
      find BAS platforms sufficient, representing a market segmentation XBOW cannot win with its
      current positioning.
    claimRefs:
