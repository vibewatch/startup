callouts:
- calloutType: risk
  title: Trust mismatch is the cleanest underwriting red flag
  body: XBOW asks enterprises to trust an autonomous offensive system, yet the public posture still combines a $100 liability cap with no public VDP, no visible third-party assurance artifact, and no independently disclosed security assessment of XBOW itself.
  claimRefs:
  - CR001
  - CR008
  - CR015
  - CR031
  - CR038
  - CR045
- calloutType: insight
  title: The best GTM mitigant is also a dependency amplifier
  body: Microsoft distribution, strategic customer-investors, and fresh capital all reduce immediate go-to-market risk, but they also mean XBOW's public proof of durability is unusually entangled with a small set of powerful partners.
  claimRefs:
  - CR018
  - CR019
  - CR029
  - CR039
  - CR041
  - CR046
- calloutType: recommendation
  title: Kill criteria should be evidence-based, not narrative-based
  body: The most important diligence asks are an export-control memo, partner-term visibility, own-platform assurance evidence, and a clear unit-economics path; if management cannot produce those, the risk story worsens even if leaderboard headlines stay strong.
  claimRefs:
