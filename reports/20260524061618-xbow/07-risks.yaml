  rows:
  - - Regulatory / export ambiguity
    - Export-control or AI-governance friction
    - Customer diligence fails because XBOW cannot show screening, oversight, or documentation controls
    - Pause conviction and require legal-control remediation before underwriting international scale
  - - Own-platform trust gap
    - Assurance maturity
    - No third-party security attestation, no VDP, and no disclosed incident track record in diligence
    - Discount enterprise durability and treat trust as a thesis risk rather than a sales objection
  - - Microsoft dependency
    - Partner leverage
    - Integration is deprioritized, terms worsen, or Microsoft-backed alternatives overtake the workflow slot
    - Cut distribution assumptions and widen revenue-risk discount
  - - Unit economics
    - Cost-to-serve
    - Inference or compute costs stay above pricing power and management cannot show improving gross margin
    - Treat growth as value-destructive and shift stance toward capital-consumption risk
  - - Proof quality and concentration
    - Customer diversification
    - Management cannot show independent customer breadth beyond strategic backers or marquee references
    - Reduce repeatability assumptions and require stronger cohort evidence before paying platform multiples
  notes: Kill criteria are framed as externally monitorable diligence asks so they can be updated in refresh work without private-model assumptions.
