- id: enterprise-concentration-financial
  title: Enterprise concentration and financial-model risk
  body: The financial-risk story is not that XBOW lacks capital; it is that capital may be covering uncertainty rather than resolving it. Public sources support more than $272 million of funding and 100-plus enterprise customers, but they do not disclose ARR, retention, gross margin, revenue concentration, or cash-burn structure. That leaves investors to underwrite a technically impressive company without the operating data needed to judge repeatability. The most adverse public datapoint is the founder's admission that compute costs exceed HackerOne earnings and that the company is currently operating at a loss. If model-inference and attack-execution costs remain structurally high, scale can worsen the economics before pricing catches up. Public GTM proof is also skewed toward strategic investors and marquee references, which is valuable but not identical to broad, efficient customer acquisition. The residual question is whether XBOW is building a durable software business or an expensive
    premium service whose economics improve only with continued narrative momentum and partner support. That is why the kill criteria and transmission map focus on measurable operational events, not on abstract optimism about category creation.
