company:
  name: XBOW
chapter:
  number: 7
  title: Risks
  summary: XBOW's highest public risks are a trust-and-liability mismatch around an autonomous offensive platform, unresolved dual-use and export-control interpretation, and dependence on Microsoft-led distribution and customer-investor references despite sparse disclosure on unit economics and its own security maturity. Technical proof is real, but public evidence still shows noise, business-logic limits, and incomplete enterprise-assurance artifacts.
sections:
- id: product-technical-risk
  title: Product and technical risk
  body: 'XBOW''s public technical proof is strong enough to make the company relevant, but the same evidence defines the limits of the current product. The CEO''s 0-10% false-positive claim is directionally positive, yet independent review of the roughly 1,060 HackerOne submissions suggests meaningful non-actionable volume once duplicates, informative submissions, and N/A outcomes are counted. Public reporting also separates narrow exploit execution from business-impact reasoning: Michiel Prins explicitly said XBOW does not excel at business impact, and raw.pm argues the leaderboard result benefited from report volume and VDP mix. That matters because enterprise buyers care less about volume than about missing the few contextual flaws that actually damage revenue or trust. OWASP APTS raises the bar further by defining 173 requirements across eight domains, implying that enterprise-grade automation is not just model quality but durable process quality. The result is a technical-risk profile
    where XBOW is clearly capable, yet still exposed to false negatives on business logic, expanding control-surface obligations, and a visible lack of third-party assurance for its own platform.'
  claimRefs:
