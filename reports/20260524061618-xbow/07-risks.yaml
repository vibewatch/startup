  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: own-platform-assurance
    missingEvidence: A current SOC 2 or ISO certificate, third-party penetration-test summary, VDP or bug-bounty policy, and any incident history for XBOW's own platform.
    whyItMatters: Enterprise buyers are being asked to trust an autonomous offensive-security vendor without the standard assurance artifacts typically used in supply-chain review.
    diligencePath: Request trust-center package, independent assessment summary, incident log, and vulnerability-disclosure workflow during diligence.
    relatedQuestionRefs:
    - QR007
    - QR027
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top customers, renewal rates, expansion rates, and the share of demand attributable to strategic investors or partner-led channels.
    whyItMatters: Public customer count and logo quality do not show whether XBOW has diversified repeatability or hidden concentration risk.
    diligencePath: Request top-10 customer ARR schedule, renewal cohort data, and pipeline-sourcing split between partner-led and direct channels.
    relatedQuestionRefs:
    - QR019
    - QR024
  - type: missing-source
    severity: material
    topic: export-control-program
    missingEvidence: A legal memo or formal policy explaining how XBOW classifies its product under export-control and dual-use regimes, including customer screening and restricted geographies.
    whyItMatters: Wassenaar and EU dual-use ambiguity can become a real sales or enforcement bottleneck once XBOW scales internationally.
    diligencePath: Request product-counsel memo, denied-party screening SOP, and escalation workflow for restricted-country or sanctioned-customer cases.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin trend, inference cost per assessment, pricing realization by product tier, and evidence that cost curves improve with scale.
    whyItMatters: The founder's public admission of operating losses could reflect either temporary market capture or a structurally difficult cost model.
    diligencePath: Request cohort-level unit economics, GPU or model-provider spend trend, and pricing waterfall by customer segment.
    relatedQuestionRefs:
    - QR020
    - QR021
    - QR023
  - type: private-evidence-only
    severity: material
    topic: governance-succession
    missingEvidence: Board committee structure, succession plan, delegated decision rights, and evidence of repeatable operating cadence beyond the founder.
    whyItMatters: Founder-centric organizations can scale well until a regulation, security event, or execution miss demands broader governance depth than public narrative reveals.
    diligencePath: Request board deck, committee charters, executive-bench map, and succession scenario planning during management diligence.
    relatedQuestionRefs:
    - QR025
    - QR026
    relatedTableRefs:
    - TR004
