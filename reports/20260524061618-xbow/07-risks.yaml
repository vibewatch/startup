- id: governance-key-person-maturity
  title: Governance, key-person, and maturity risk
  body: 'Governance risk at XBOW is less about an identified scandal than about how much trust must currently be placed in a young, founder-centric organization. Public profiles still present a distributed company whose identity is tightly bound to Oege de Moor''s credibility as the creator of GitHub Copilot. That concentration is useful for fundraising and category narrative, but it also creates key-person exposure in strategy, recruiting, and public trust. Meanwhile, the enterprise buyer is being asked to trust an autonomous offensive system even though public assurance artifacts about XBOW itself remain sparse: no public VDP, no public bug bounty, no public SOC 2 or ISO 27001, and no independently published security assessment were identified in the reviewed sources. The visible mitigants are real—fresh capital, human review, Microsoft distribution, and documented controls—but they do not yet prove governance maturity. Until diligence can test board depth, succession planning, export-screening
    process, and internal security controls directly, governance remains a residual risk amplifier for every other issue in the chapter.'
