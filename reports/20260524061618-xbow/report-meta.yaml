  foundingLocation: Seattle, Washington, USA
  headquarters: Seattle, Washington, USA
  productSummary: XBOW sells autonomous penetration testing software that deploys AI agents to discover, exploit, and validate vulnerabilities continuously, then routes findings into enterprise remediation workflows and partner security platforms.
  customerFocus: Enterprise security teams, especially large organizations with cloud-native applications, regulated environments, and continuous assurance requirements.
  businessModel: Software pricing per pentest plus enterprise contracts for continuous coverage, with additional distribution through strategic partners and cloud channels.
  stage: Series C
  fundingStatus: XBOW last raised a $120M Series C at over $1B valuation in March 2026 and added a $35M strategic extension in May 2026, bringing total capital to more than $272M.
