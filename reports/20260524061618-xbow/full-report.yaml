      - number: '5.2'
        title: Product SKUs, Coverage, and Use Cases
        blocks:
          - type: paragraph
            body: >-
              XBOW offers two primary delivery modes. XBOW Lightspeed is an on-demand penetration testing service that
              promises expert-quality results at machine speed: starting at $4,000 per test, it delivers a
              compliance-ready report within five business days of testing commencement. The underlying platform is also
              sold as a continuous enterprise subscription for teams that want ongoing, scheduled testing across their
              entire application portfolio. Both modes cover web applications and their integrated APIs. Targets must be
              internet-accessible or configured to allowlist XBOW's eight published IP addresses; applications behind
              VPN or restrictive firewalls, those with fixed session timeouts, or those lacking Chrome browser
              compatibility are incompatible. Standalone API testing and mobile application testing are documented
              roadmap items for 2026. Network and cloud infrastructure pentesting are not part of the current offering.
              XBOW's report output is documented as meeting penetration testing requirements for over 40 compliance
              frameworks, including SOC 2, ISO 27001:2022, ISO 27017, ISO 27018, HIPAA, CMMC Levels 1–3, EU DORA, NIS 2,
              NIST CSF 2.0, GDPR, CCPA/CPRA, and AWS FTR, among others. The XBOW Public API, in public preview as of
              2026, enables programmatic access to assessments, findings, assets, reports, and webhooks, with versioned,
