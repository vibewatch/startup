      - number: '5.5'
        title: Trust, Safety, Compliance, and Operational Controls
        blocks:
          - type: paragraph
            body: >-
              XBOW's safety architecture is designed around the principle that autonomous offensive capabilities require
              equally rigorous containment. The pre-action safety checker vets every action proposed by an attack agent
              before it executes; if an action cannot be verified as safe within the defined target scope, it does not
              run. All autonomous activity is constrained, observable, and reviewed before findings are surfaced.
              Validation logic is deterministic and auditable, meaning findings cannot be promoted by probabilistic AI
              reasoning alone. Exploit validation uses controlled challenges that confirm exploitability without
              modifying persistent data or disrupting systems—for example, XSS validation uses a headless browser to
              execute the payload in isolation, not in live production sessions. Customers specify what the agent should
              and should not test, and XBOW enforces those policies at the network level from the outset, not as a
              downstream filter. On compliance, XBOW Lightspeed reports are explicitly designed to satisfy penetration
              testing evidence requirements for SOC 2, ISO 27001:2022, HIPAA, CMMC, EU DORA, NIS 2, and more than 40
              other frameworks, reducing the overhead for compliance-driven customers who previously had to commission
              bespoke pentests for each audit cycle. Deployment options are described as designed to meet customer
              security, isolation, and compliance requirements, though XBOW has not published its own SOC 2 Type II
              report or ISO 27001 certificate as of the runDate, leaving a diligence gap on its own security posture.
            claimRefs:
              - CE005
              - CE006
              - CE022
              - CE038
              - CE039
              - CE040
      - number: '5.6'
        title: Technical Limitations, Scope Boundaries, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Several structural limitations bound XBOW's current technical scope. First, the platform tests only
              internet-accessible web applications and their integrated APIs; network layer, cloud infrastructure,
              standalone API, and mobile testing are absent from the production offering. Second, targets must support
              Chrome-based interaction; applications relying on non-standard authentication flows, fixed session
              timeouts, or WAF rules that cannot allowlist XBOW IPs are incompatible. Third, the ~37.5% overall accuracy
              rate noted by independent reviewers—against a portfolio that included Vulnerability Disclosure
              Programs—suggests that conversion rates on hardened, bounty-paying targets would be lower. Fourth, complex
              business logic flaws remain a documented area of weakness, as these require contextual understanding that
              current agent architectures handle inconsistently. Fifth, the HackerOne leaderboard metric is partly
              confounded by submission volume and VDP selection bias, and every submission underwent human pre-review
              before platform delivery. Sixth, XBOW's own security posture (SOC 2 Type II attestation, penetration test
              of its own infrastructure) has not been publicly disclosed, which is a material gap for enterprise buyers
              with supply-chain risk requirements. Seventh, the platform's compute dependency on GPU inference at scale
              creates a cost structure that the CEO has acknowledged runs at a financial loss at current pricing,
              suggesting pricing and gross margin paths remain uncertain. Eighth, the dual-use risk of autonomous
              offensive AI agents operating outside XBOW's controlled environment is noted by third-party reviewers but
              is not subject to published safety certifications or independent red-team audits as of the runDate.
            claimRefs:
              - CE016
