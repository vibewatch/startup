  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Addressable Universe
        blocks:
          - type: paragraph
            body: >
              Penetration testing encompasses services and platforms that deliberately simulate adversarial attacks
              against enterprise software, networks, and infrastructure to surface exploitable vulnerabilities before
              threat actors can use them. The market divides into three primary delivery models: traditional
              time-and-materials engagements staffed by human testers, penetration-testing-as-a-service (PTaaS)
              platforms that deliver on-demand or subscription access to testing capacity, and breach-and-attack
              simulation (BAS) tools that continuously replay known attack techniques in automated fashion. XBOW
              competes most directly in the PTaaS category but also displaces traditional engagements when buyers seek
              continuous coverage at lower per-test cost.

              Adjacent spend categories that inform XBOW's total addressable opportunity include attack surface
              management (ASM), which continuously discovers and scores internet-exposed assets, and vulnerability
              management (VM), which aggregates scanner findings and prioritizes remediation. These adjacencies are
              upstream and downstream workflow partners rather than direct substitutes, but they create budget
              competition and potential acquisition or integration paths. The $15.93B VM market dwarfs the core pen
              testing market, signaling that XBOW's long-term ceiling—if it expands beyond testing into exposure
              management—is substantially larger than the immediate PTaaS SAM.

              Status-quo substitutes for XBOW's platform include annual or quarterly human-led engagements through firms
              such as NCC Group, Rapid7, or Cobalt, in-house red teams at large enterprises, and traditional BAS
              platforms such as Cymulate or AttackIQ. Each substitute leaves a material coverage gap: human engagements
              are periodic and talent-constrained, in-house red teams are expensive and rare, and BAS platforms replay
              known techniques without genuine vulnerability discovery. XBOW's autonomous AI agents are positioned to
              close this gap with machine-speed, continuous, genuine exploitation rather than simulation. Market
              boundary disputes arise because some analysts include automated DAST and scanner revenue in pen test
              totals, inflating the TAM, while others restrict scope to true exploitation-capable testing, reducing it.
              Both conventions are represented in the table below.
