      - number: '6.5'
        title: Adverse Evidence — Adoption Barriers, Trust Gaps, and Proof Limitations
        blocks:
          - type: paragraph
            body: >
              Several independent and skeptical sources identify meaningful adoption challenges that the positive case
              study narrative does not address.

              Scope and continuity limitations: Escape.tech's 2026 market analysis characterizes XBOW as "built for
              periodic red-team-style engagements starting at $6,000 per pentest" and "not designed for continuous
              testing" — a direct contradiction of XBOW's own positioning for its Enterprise tier. The article
              identifies customer friction points including lack of standalone API testing coverage (entering roadmap in
              2026), no native regression testing, and credit-pack consumption risk on quarterly scans. Escape notes
              that potential XBOW evaluators frequently ask: "Can it test our APIs? Can it ensure the same vulnerability
              does not appear again? Will we burn through credits on quarterly scans?" These questions reflect real
              procurement friction that would slow or block deals, particularly in DevSecOps-mature organizations
              requiring API-first continuous coverage.

              Technical scope limitations acknowledged by practitioners: A widely-read Medium post in the security
              community (July 2025) acknowledged XBOW's strong autonomous performance on routine vulnerability classes
              but identified documented blind spots: business logic vulnerabilities, multi-step exploit chaining,
              environment-specific bugs, social engineering, and risk prioritization with real-world context. Community
              voices from Reddit and LinkedIn confirmed: "It's great at low-hanging fruit, but misses deeper issues" and
              "XBOW's performance is amazing, but let's not pretend it's replacing expert pentesters." The same article
              notes that "insiders and practitioners suggest" that findings are still manually validated before
              submission to bug bounty programs — qualifying the "fully autonomous" claim.

              Trust and dual-use barriers: Enterprises deploying an autonomous offensive security tool must grant XBOW
              agents authorized access to production or staging application environments. For regulated industries
              (healthcare, financial services, critical infrastructure), data residency, scope containment, and
