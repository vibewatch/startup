      - number: '8.4'
        title: Bull, Base, and Bear Valuation Scenarios
        blocks:
          - type: paragraph
            body: >
              Three scenarios bracket the expected value range for XBOW investors entering at the $1B+ Series C.

              In the bull case, XBOW achieves $150M+ ARR by end of 2027, sustaining 100%+ ARR growth through its
              Microsoft Azure integration, Accenture Cyber.AI embedding, and Samsung Asia-Pacific distribution. At an
              AI-native platform multiple of 18x, this implies a $2.7B valuation — 2.7x return on entry. The bull case
              requires the GTM leverage of strategic investors to materially accelerate organic sales, the Microsoft and
              AWS channels to translate to paid enterprise contracts, and enterprise deal sizes to scale toward
              $500K–$1M annually per customer.

              In the base case, XBOW reaches $60–80M ARR by end of 2026 and $120M by end of 2027, reflecting 75% ARR
              growth roughly consistent with Pentera's early trajectory. At a 14x forward multiple on 2027E ARR, this
              implies a $1.05–1.68B exit valuation — essentially flat to 1.7x return on entry. The base case assumes
              enterprise adoption continues but is not accelerated by strategic channels, and that competitive pressure
              from Horizon3.ai (maturing web-app coverage), Hadrian, and incumbent AI investment limits market share
              expansion.

              In the bear case, ARR falls below $40M by end of 2026 or growth decelerates below 50% annually. This
              scenario implies the market has not validated XBOW's enterprise proposition beyond the initial
              design-partner cohort, and that revenue from on-demand pricing (~$4K–$8K per test) has not converted to
              high-value enterprise subscription contracts. At 7x on $35M ARR, the implied valuation is $245M — a severe
              markdown from the $1B+ entry price. The bear trigger is a combination of narrow customer breadth
              (concentrated in <20 paying accounts), failure to convert strategic investors into revenue-generating
              channel deals, and a market rotation that compresses AI-native multiples.

              The Microsoft Azure integration and AWS ISV Accelerate partnerships are the most material differentiated
              growth driver that separates the bull from the base case. XBOW's 100+ customer count and
              multi-strategic-investor backing signal real, if early, demand — but the revenue concentration risk of a
              sub-100-customer base means any single customer departure materially shifts all ARR scenario outcomes.
