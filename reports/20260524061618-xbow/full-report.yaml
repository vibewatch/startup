      - number: '1.2'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >
              XBOW's founding team carries an unusually direct lineage from the AI-coding and code-security ecosystem.
              Oege de Moor holds a DPhil in Computer Science from the University of Oxford and studied at Utrecht
              University before founding Semmle, a code analysis and security company acquired by GitHub that became the
              foundation for GitHub Advanced Security. At GitHub and Microsoft he then led the creation of GitHub
              Copilot, one of the most widely adopted AI coding tools in history. His concurrent background in AI
              software development and code security is the intellectual foundation for XBOW's product thesis, and the
              original core engineering team is largely drawn from the Copilot project.

              Nico Waisman, XBOW's CISO, joined the company at founding from Lyft, where he served as CISO. He has
              assembled a team of elite human hackers—including prominent HackerOne researchers Diego Dorado and Joel
              Noguera—who provide training data and pre-submission review for the autonomous system. Albert Ziegler
              leads AI research and Andy Rice heads engineering. On the commercial side, Jonaki Egenolf joined as CMO
              bringing experience from Snyk and Veracode, Niro Rajadurai serves as CRO, and Dean Breda is General
              Counsel.

              The board has been strengthened in a deliberate sequence. Ron Gabrisko, formerly CRO of Databricks, joined
              in December 2025 to support revenue scaling at the board level. As part of the Series C, Ramin
              Sayar—Venture Partner at DFJ Growth and former CEO of Sumo Logic—also joined the board. WonLae Lee was
              named General Manager for South Korea in January 2026, the first market-level appointment in XBOW's
              Asia-Pacific strategy.

              Key-person risk is concentrated in de Moor. Strategy, fundraising, technical credibility, and the
              company's public narrative are all closely associated with his profile as GitHub Copilot's creator. The
              2026 investor cohort adds enterprise credibility at the board level, but the depth of independent
              governance still warrants scrutiny given the company's early stage and its founder-centric identity. The
              CISO role is also a potential single point of failure for responsible deployment of autonomous attack
              systems.
