      - number: '6.2'
        title: Named Customer Proof, Case Studies, and Testimonials
        blocks:
          - type: paragraph
            body: >
              XBOW's public customer evidence base is anchored by three formal case studies and five verified
              testimonials as aggregated on FeaturedCustomers (4.8/5.0 from 47 reference ratings as of May 2026). The
              customer stories indexed at xbow.com/customer-stories cover PuppyGraph (December 2025), Seznam (December
              2025), and BloomPath AI (November 2025), each representing a distinct deployment profile.

              The PuppyGraph case study is the most technically granular evidence available. XBOW autonomously
              identified a critical authentication bypass on January 31, 2025 — an edge case where failed login attempts
              returned both an error message and a valid JWT token — and subsequently discovered two critical RCE
              vulnerabilities on March 7, 2025. PuppyGraph's prior pentesting provider had missed all three. CTO Danfeng
              Xu stated: "After working with XBOW, it was clear that their approach to security was a much better fit
              for our needs… we've decided to move all our pentesting needs to XBOW and shift from periodic assessments
              to a more continuous testing approach aligned with our release cycles." A full penetration test ahead of a
              subsequent release was completed in under two days. PuppyGraph is a developer-first product serving
              regulated-industry customers including Coinbase, Clarivate, and Prevalent AI.

              The BloomPath AI case study demonstrates XBOW's SOC 2 compliance use case. BloomPath is an AI productivity
              platform that handled sensitive enterprise data and needed SOC 2 attestation to win enterprise contracts.
              XBOW completed the full engagement — configuration, testing, validation, and auditor-ready report — in a
              few days, compared to the industry-standard six weeks for a manual penetration test. Security Advisor
              Priscilla Fong stated: "XBOW dramatically accelerated our path to SOC 2 readiness." CTO Hazim Macky added:
              "Working with XBOW showed us how modern security testing should work: fast, thorough, and tightly aligned
              with our development cycles." BloomPath is planning a follow-on whitebox engagement, signaling intent to
              renew.

              The Seznam customer story page exists at xbow.com/customers/seznam but returned minimal readable content
              via fetch, confirming the URL is live but providing no case study text. A YouTube video titled "The Real
              Impact of AI on Security Testing | XBOW & Seznam" (December 2025) documents a customer conversation but
              provides no independently verifiable technical outcome details.

              Beyond case studies, SentinelOne Director of Corporate Development Alex Krongold stated that "each XBOW
              agent operates like an extension of our in-house red team, allowing us to scale offensive testing with
              speed and depth that was previously out of reach." A Samsung Ventures representative confirmed Samsung is
              "a customer" that has "experienced the platform's ability to surface real-world risks with speed and
              precision." An independently attributed testimonial from Leo Golovyrin (Application Security Lead) states:
              "Even right now after 1 year, I don't know any other company that is at least close to XBOW in terms of
