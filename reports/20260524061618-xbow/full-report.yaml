    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR and revenue disclosure
        - No public ARR, revenue run-rate, or contract value data
        - Most critical input to all multiple-based valuation; without it the $1B+ is unanchored
        - Company DDR (VDR); investor letter with financial appendix
      - - Liquidation preferences and cap table
        - Series C preference terms and protective provisions not disclosed
        - Determines common equity recovery value in exit or down-round scenarios
        - Legal DDR; historical term sheets from Sequoia/Altimeter/DFJ Growth
      - - Customer roster and contract terms
        - 100+ customers confirmed but names withheld; contract value unknown
        - Validates ARR concentration, average deal size, and enterprise vs. SMB mix
        - Customer reference calls; anonymized ARR cohort analysis in DDR
      - - Burn rate and cash balance
        - Burn rate undisclosed; cash runway estimated only from raised capital
        - Validates 18–36 month runway estimate; informs next-round timing
        - Financial DDR; CFO (Adam Wright) interview
      - - Channel revenue contribution
        - No data on whether Accenture, Samsung, SentinelOne channels are generating paid contracts
        - Critical to separating bull from base case; strategic investor value is thesis-dependent
        - Partner agreement review; Q3 2026 customer add attribution in DDR
    notes: >-
      All diligence asks target information that is not publicly available and would be available only through a formal
      DDR process or direct investor access. None of the five items can be resolved through public sources alone.
    claimRefs:
      - CV039
      - CV040
      - CV041
