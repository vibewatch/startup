      - number: '2.2'
        title: Market Sizing and Growth Trajectory
        blocks:
          - type: paragraph
            body: >
              Three independent analyst firms published estimates of the 2026 penetration-testing market at $2.42B
              (Mordor Intelligence, 13.9% CAGR), $2.80B (Fortune Business Insights, 11.6% CAGR), and $3.09B
              (MarketsandMarkets, 16.4% CAGR). The $670M spread reflects genuine differences in scope inclusion rather
              than measurement error: MarketsandMarkets counts some automated security tooling; Mordor Intelligence
              restricts scope to human-staffed and PTaaS engagements. All three agree the market grows faster than the
              broader cybersecurity spend, which Gartner estimates at $240 billion in 2026 at roughly 15% year-over-year
              growth. Within pen testing, PTaaS is the fastest-growing sub-segment: MarketsandMarkets sizes it at $720
              million in 2026 with a 22.6% CAGR to $1.98B by 2031, nearly three times the growth rate of traditional
              engagement services.

              The BAS market, at $1.08B in 2026 with a 27% CAGR per Research and Markets, is technically distinct from
              pen testing but increasingly overlaps in buyer and budget. Enterprises that buy BAS often run it alongside
              PTaaS, making the combined offensive-testing budget pool closer to $1.8B for the PTaaS+BAS overlap
              segment. Adding the broader pen testing TAM at its midpoint ($2.76B average across the three estimates),
              XBOW's first-order addressable market is approximately $4.6B before factoring in ASM and VM adjacencies.
              Contradictory estimates are preserved in TM002; the $2.42B Mordor figure should be treated as a
              conservative floor and the $3.09B MarketsandMarkets figure as a ceiling. A diligence note: all three firms
              sell full-text reports under paywall; the figures cited derive from press releases and public abstracts,
              not the underlying methodology documents.
