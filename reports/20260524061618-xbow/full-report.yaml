      - number: '6.4'
        title: Retention, Durability, and Expansion Signals
        blocks:
          - type: paragraph
            body: >
              XBOW does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or customer
              churn metrics. The available retention evidence is entirely qualitative and anecdotal, derived from case
              study follow-on intent and testimonials rather than cohort statistics.

              Positive retention signals include: (1) PuppyGraph converted from a transactional engagement to a
              continuous, ongoing pentesting model after the initial critical vulnerabilities were found; CTO Danfeng Xu
              expressed intent to expand XBOW's role in their security stack. (2) BloomPath AI CTO Hazim Macky
              explicitly stated the company is "now building on that experience by adopting a continuous pentesting
              model" and is planning a follow-on whitebox engagement. (3) The Enterprise continuous tier is priced as an
              annual subscription or credit-pack structure, structurally embedding multi-period relationships for large
              customers. (4) At least three investor-customers (SentinelOne, Samsung, Accenture) have made financial
              commitments alongside operational use, creating a strong alignment incentive for continued deployment.

              Expansion levers are present but underdeveloped from a public-evidence standpoint. Samsung's reseller role
              in South Korea, Accenture's Cyber.AI embed, and the AWS co-sell arrangement each represent potential
              expansion vectors from single-buyer relationships to platform-level or distribution-level reach. The
              "land-and-expand" pattern is visible at the individual customer level (on-demand Plus/Premium → Enterprise
              continuous), but no aggregate data on expansion rate or upsell conversion is available.

              Customer concentration risk is material. With only two independently named non-investor customers (Moderna
              and Seznam), and no revenue or account distribution breakdown, a significant share of bookings could be
              concentrated in a handful of enterprise accounts. The investor-customer overlap (Accenture, Samsung,
              SentinelOne) further compresses effective independence of the demand signal. No publicly cited departure,
              churned account, failed deployment, or renewal downgrade has been identified in public sources as of the
              run date, but absence of evidence is not evidence of strong retention in the context of a company that
              discloses only summary-level customer metrics.
