      - number: '7.2'
        title: Regulatory, legal, and dual-use risk
        blocks:
          - type: paragraph
            body: >-
              XBOW's legal surface is unusually important because the company sells autonomous offensive capability
              while publishing a consumer-style liability framework. The public Terms of Use cap aggregate liability at
              $100, a stark mismatch if the platform is used inside large enterprise environments and something goes
              wrong. At the same time, the underlying product category lives inside a moving policy perimeter. Wassenaar
              has treated intrusion software as a dual-use control problem since 2013, yet policy commentary still
              treats modern SaaS-delivered offensive tooling as an interpretive gray zone rather than a settled
              carve-out. The EU's 2025 dual-use list update keeps cyber-intrusion controls alive, and the EU AI Act now
              imposes at least some documentation, risk-management, and oversight expectations even if the May 2026
              draft guidance lowers immediate Annex III pressure for many systems. XBOW's privacy policy adds a more
              mundane but still material layer: once account, usage, and device data are processed, privacy compliance
              becomes a continuous operating obligation. Together these factors create a real risk that legal diligence,
              export screening, authorization design, and procurement review slow XBOW well before a formal enforcement
              action appears.
