      - number: '2.3'
        title: Buyer Segmentation and Decision Dynamics
        blocks:
          - type: paragraph
            body: >
              Budget ownership for penetration testing resides with the CISO in approximately 71% of enterprises, with
              the remainder split between IT operations and compliance functions. The CISO is therefore simultaneously
              the technical evaluator and the financial decision-maker in most deals, compressing the evaluation cycle
              relative to enterprise SaaS categories with separated buyer roles. Mid-market enterprises with 500–5,000
              employees represent the highest-growth segment for PTaaS adoption: they face mandatory compliance
              obligations under PCI DSS 4.0, SOC 2, and in Europe under DORA and NIS2, but lack the budget or staffing
              depth for a full in-house red team. The adoption trigger in this segment is most commonly a compliance
              audit finding, a cyber-insurance renewal requirement, or regulatory examination pressure—not a proactive
              security investment.

              Financial services is the largest single vertical by mandatory regulatory demand: DORA's threat-led
              penetration testing (TLPT) requirements apply to over 22,000 EU financial entities effective January 2025,
              and PCI DSS 4.0 expanded the mandatory annual pen test requirement to a broader set of card data
              environments from March 2024 onward. Healthcare and technology sectors follow as the next largest buyer
              cohorts, driven by HIPAA/HITECH obligations and SOC 2 audit requirements for SaaS vendors respectively.
              Government and defense represent a distinct compliance-driven segment (FISMA, CMMC 2.0) with longer
              procurement cycles and budget structures that favor established vendors, creating a timing lag for newer
              autonomous platforms like XBOW. Scantist's 2026 competitive analysis identifies XBOW, Pentera, and
              Horizon3.AI as the top three autonomous testing platforms competing for this buyer base.
