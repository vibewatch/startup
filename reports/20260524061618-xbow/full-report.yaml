  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and Attack Engine
        blocks:
          - type: paragraph
            body: >-
              XBOW's platform is built on a four-component architecture that deliberately separates creative exploration
              from deterministic verification. The Coordinator is a persistent orchestration engine that maintains a
              global view of the target environment, assigns narrowly-scoped tasks to parallel attack agents, debriefs
              their outputs, and applies deterministic logic to refine findings and prioritise next actions. Attack
              Agents are short-lived, independently-reasoned AI workers that each start with a fresh context and a
              focused objective; they are retired after each mission to prevent accumulated bias or context collapse, a
              design choice that directly addresses the failure modes observed in single-agent, long-horizon systems.
              The Attack Machine provides a shared execution environment with a steerable headless Chrome browser,
              industry-standard offensive security tools (scanners, fuzzers, exploit frameworks), and inter-agent
              collaboration services for multi-step exploit chaining. Validator Engines independently confirm
              exploitability using controlled, non-destructive challenges—a headless browser executes JavaScript
              payloads for XSS, programmatic checks verify injection outcomes—before any finding is promoted to the
              reporting surface. XBOW describes this separation as "Creative AI discovers. Deterministic logic decides
              what's real," and the architecture is explicitly designed to deliver zero false positives by enforcing
              objective proof-of-exploit for every reported finding. The platform runs LLM inference using a "model
              alloys" technique, where multiple foundation models (including GPT-5 and Opus 4.6) are called dynamically
              within a single conversation thread; integrating GPT-5 more than doubled benchmark performance. The
              validator design also includes a pre-action safety checker that vets every agent action before execution
              and enforces scope control at the network layer, ensuring that no action runs if it cannot be verified as
              safe within the defined target boundary.
