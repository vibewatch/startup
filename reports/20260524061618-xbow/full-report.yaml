      - number: '3.2'
        title: 'Direct Autonomous Pentest Rivals: Horizon3.ai, Pentera, and Hadrian'
        blocks:
          - type: paragraph
            body: >
              The three most directly comparable autonomous or highly automated pentesting platforms are Horizon3.ai
              (NodeZero), Pentera, and Hadrian.

              Horizon3.ai is XBOW's most formidable autonomous competitor. Founded in 2019 by former U.S. national
              security veterans, it targets internal network and Active Directory exposures through its NodeZero
              platform, which completed more than 100,000 autonomous pentests to date. The company achieved 101% YoY
              revenue growth in FY2025 and 102% ARR growth reported in March 2026, with 3,000+ customers of which 80%
              are served by MSSPs. In May 2026 NodeZero received "Awardable" status in the DoD Tradewinds Marketplace,
              giving Horizon3.ai a distinct distribution advantage in the US government/defense sector that XBOW has not
              yet matched. NodeZero's architecture is agentless (no software installation required on customer
              infrastructure), and it excels at credential exploitation, Active Directory path discovery, and lateral
              movement simulation—a domain where XBOW's web/API-focused architecture is comparatively weaker.

              Pentera, founded 2015 (originally Pcysys), focuses on automated security validation spanning internal
              networks, AD, ransomware simulation, and cloud exposure. It raised a $60M Series D in March 2025 at a $1B+
              valuation, bringing total funding to $250M. Pentera serves 1,100+ customers with an average deal size of
              approximately $100,000 and ARR approaching $100M. PeerSpot users as of April 2026 rate Pentera lower than
              NodeZero on feature set but higher on cost-effectiveness and ease of deployment. Unlike XBOW, Pentera does
              not claim novel web application exploit-chain discovery—its model replays and validates known attack
              paths, which is more comparable to BAS.

              Hadrian launched Nova, its agentic pentesting solution, on March 24, 2026—the same week as XBOW's
              Microsoft integration announcement at RSAC 2026. Nova focuses on external attack surface management
              combined with on-demand agentic pentesting, with per-test pricing and a claimed 99.5% false positive
              elimination rate. Hadrian positions directly against XBOW's external web/API testing domain, making it a
              closer head-to-head rival than Pentera or NodeZero on application-layer coverage.
