            body: >-
              XBOW's public technical proof is strong enough to make the company relevant, but the same evidence defines
              the limits of the current product. The CEO's 0-10% false-positive claim is directionally positive, yet
              independent review of the roughly 1,060 HackerOne submissions suggests meaningful non-actionable volume
              once duplicates, informative submissions, and N/A outcomes are counted. Public reporting also separates
              narrow exploit execution from business-impact reasoning: Michiel Prins explicitly said XBOW does not excel
              at business impact, and raw.pm argues the leaderboard result benefited from report volume and VDP mix.
              That matters because enterprise buyers care less about volume than about missing the few contextual flaws
              that actually damage revenue or trust. OWASP APTS raises the bar further by defining 173 requirements
              across eight domains, implying that enterprise-grade automation is not just model quality but durable
              process quality. The result is a technical-risk profile where XBOW is clearly capable, yet still exposed
              to false negatives on business logic, expanding control-surface obligations, and a visible lack of
