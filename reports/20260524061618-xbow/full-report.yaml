    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR stagnation
        - ARR growth falls below 40% YoY before $100M milestone
        - Implies enterprise market not scaling to justify $1B+ narrative
        - Downgrade to Avoid; monitor for down-round signal
      - - Major customer departure
        - Loss of anchor enterprise account representing >15% of inferred ARR
        - Revenue concentration risk crystallizes; base case collapses
        - Immediate thesis reassessment; exit if held
      - - Down-round financing
        - Next round priced below $1B post-money
        - Market has repriced the narrative; prior investors under water
        - Avoid follow-on; re-evaluate at new clearing price
      - - Competitive convergence
        - Horizon3.ai, Hadrian, or incumbent (Rapid7 Kenzo, Palo Alto) achieves web-app exploit-chain parity
        - Moat erosion; revenue premium and multiple compress toward Pentera levels
        - Reduce target multiple to 8–10x; revise base case down
      - - Channel revenue gap
        - No measurable ARR from Accenture/Samsung/SentinelOne channels by Q4 2027
        - Strategic investor value thesis fails; growth reverts to direct-sales only
        - Downgrade bull-case probability; revise ARR forecast to base/bear
    notes: >-
      Triggers are analyst-constructed based on observable signaling events; thresholds are illustrative. Kill trigger
      for "down-round" is binary; all others are directional and require context at the time.
