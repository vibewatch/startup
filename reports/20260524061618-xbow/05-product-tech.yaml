- id: technical-limitations-gaps
  title: Technical Limitations, Scope Boundaries, and Diligence Gaps
  body: Several structural limitations bound XBOW's current technical scope. First, the platform tests only internet-accessible
    web applications and their integrated APIs; network layer, cloud infrastructure, standalone API, and mobile testing are
    absent from the production offering. Second, targets must support Chrome-based interaction; applications relying on non-standard
    authentication flows, fixed session timeouts, or WAF rules that cannot allowlist XBOW IPs are incompatible. Third, the
    ~37.5% overall accuracy rate noted by independent reviewers—against a portfolio that included Vulnerability Disclosure
    Programs—suggests that conversion rates on hardened, bounty-paying targets would be lower. Fourth, complex business logic
    flaws remain a documented area of weakness, as these require contextual understanding that current agent architectures
    handle inconsistently. Fifth, the HackerOne leaderboard metric is partly confounded by submission volume and VDP selection
    bias, and every submission underwent human pre-review before platform delivery. Sixth, XBOW's own security posture (SOC
    2 Type II attestation, penetration test of its own infrastructure) has not been publicly disclosed, which is a material
    gap for enterprise buyers with supply-chain risk requirements. Seventh, the platform's compute dependency on GPU inference
    at scale creates a cost structure that the CEO has acknowledged runs at a financial loss at current pricing, suggesting
    pricing and gross margin paths remain uncertain. Eighth, the dual-use risk of autonomous offensive AI agents operating
    outside XBOW's controlled environment is noted by third-party reviewers but is not subject to published safety certifications
    or independent red-team audits as of the runDate.
