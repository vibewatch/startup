- id: trust-safety-compliance
  title: Trust, Safety, Compliance, and Operational Controls
  body: XBOW's safety architecture is designed around the principle that autonomous offensive capabilities require equally
    rigorous containment. The pre-action safety checker vets every action proposed by an attack agent before it executes;
    if an action cannot be verified as safe within the defined target scope, it does not run. All autonomous activity is constrained,
    observable, and reviewed before findings are surfaced. Validation logic is deterministic and auditable, meaning findings
    cannot be promoted by probabilistic AI reasoning alone. Exploit validation uses controlled challenges that confirm exploitability
    without modifying persistent data or disrupting systems—for example, XSS validation uses a headless browser to execute
    the payload in isolation, not in live production sessions. Customers specify what the agent should and should not test,
    and XBOW enforces those policies at the network level from the outset, not as a downstream filter. On compliance, XBOW
    Lightspeed reports are explicitly designed to satisfy penetration testing evidence requirements for SOC 2, ISO 27001:2022,
    HIPAA, CMMC, EU DORA, NIS 2, and more than 40 other frameworks, reducing the overhead for compliance-driven customers
    who previously had to commission bespoke pentests for each audit cycle. Deployment options are described as designed to
    meet customer security, isolation, and compliance requirements, though XBOW has not published its own SOC 2 Type II report
    or ISO 27001 certificate as of the runDate, leaving a diligence gap on its own security posture.
  claimRefs:
