  body: As of May 2026, XBOW tests only internet-accessible web applications and their integrated APIs. Network layer, cloud
    infrastructure, standalone API, and mobile testing are absent or roadmap-only. Enterprises with mixed attack surfaces
    must supplement XBOW with other tools, and the ~37.5% accuracy on live bug bounty programs—combined with known business
    logic limitations—suggests human augmentation remains necessary for complex scenarios.
  claimRefs:
  - CE016
  - CE031
  - CE032
  - CE042
- calloutType: insight
  title: Microsoft Integration Creates Network-Effect Lock-In Opportunity
  body: The March 2026 Microsoft Security Copilot and Sentinel integration moves XBOW from a standalone pentest tool to a
    native component in the security operations workflow of enterprises already invested in the Microsoft security stack.
    If enterprise security teams habitually initiate and manage assessments from within Copilot, switching costs increase
    materially beyond pure technical capability comparisons.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
