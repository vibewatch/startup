- id: ecosystem-integrations
  title: Ecosystem Integrations and Cloud Partnerships
  body: 'XBOW has pursued a deliberate integration strategy to embed its autonomous offensive engine into the security stacks
    that enterprises already operate. In March 2026, XBOW announced a collaboration with Microsoft integrating continuous
    penetration testing into Microsoft Security Copilot and Microsoft Sentinel, made available as a public preview at RSAC
    2026. The integration includes three components: the XBOW Pentest Manager Agent (initiates and manages assessments from
    within Security Copilot), the XBOW Pentest Analysis Agent (analyses which attack activities were detected or missed to
    highlight detection gaps), and the XBOW Sentinel Connector (ingests validated findings into Sentinel''s data lake as structured
    records). The goal is a continuous feedback loop between AppSec and SecOps: offensive findings become live inputs to detection
    and response workflows, while operational telemetry informs subsequent testing priority. Microsoft''s Corporate Vice President
    for Security Platform & AI, Shawn Bice, cited the integration as "helping customers across industries connect offensive
    insights directly into their existing workflows." In May 2026 XBOW joined the AWS ISV Accelerate Program, enabling co-sell
    through AWS Sales and making XBOW available through existing AWS channels for enterprises already operating on the platform.
    Accenture made a strategic investment in XBOW specifically to advance continuous offensive security testing and exposure
    management. The Microsoft Security Store lists the XBOW Sentinel Connector as a partner solution, providing an independent
    third-party reference that the integration is live and co-marketed.'
