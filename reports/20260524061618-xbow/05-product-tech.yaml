chapter:
  number: 5
  title: Product & Technology
  summary: XBOW is an autonomous offensive security platform whose architecture couples thousands of short-lived AI attack
    agents with a persistent coordinator and deterministic validator engines, delivering near-zero false-positive penetration
    tests at machine speed. The platform focuses on web applications and their integrated APIs; third-party benchmarks and
    live HackerOne results confirm capabilities that materially outperform human testers on speed and scale, while independent
    reviews surface a ~37.5% accuracy ceiling across all programs and recognised limitations on business logic flaws, network
    layer coverage, and mandatory internet accessibility. The March 2026 Microsoft Security Copilot / Sentinel integration
    and May 2026 AWS ISV Accelerate entry signal an accelerating ecosystem footprint, but cloud and mobile coverage remain
    roadmap-only.
sections:
- id: platform-architecture
  title: Platform Architecture and Attack Engine
  body: XBOW's platform is built on a four-component architecture that deliberately separates creative exploration from deterministic
    verification. The Coordinator is a persistent orchestration engine that maintains a global view of the target environment,
    assigns narrowly-scoped tasks to parallel attack agents, debriefs their outputs, and applies deterministic logic to refine
    findings and prioritise next actions. Attack Agents are short-lived, independently-reasoned AI workers that each start
    with a fresh context and a focused objective; they are retired after each mission to prevent accumulated bias or context
    collapse, a design choice that directly addresses the failure modes observed in single-agent, long-horizon systems. The
    Attack Machine provides a shared execution environment with a steerable headless Chrome browser, industry-standard offensive
    security tools (scanners, fuzzers, exploit frameworks), and inter-agent collaboration services for multi-step exploit
    chaining. Validator Engines independently confirm exploitability using controlled, non-destructive challenges—a headless
    browser executes JavaScript payloads for XSS, programmatic checks verify injection outcomes—before any finding is promoted
    to the reporting surface. XBOW describes this separation as "Creative AI discovers. Deterministic logic decides what's
    real," and the architecture is explicitly designed to deliver zero false positives by enforcing objective proof-of-exploit
    for every reported finding. The platform runs LLM inference using a "model alloys" technique, where multiple foundation
    models (including GPT-5 and Opus 4.6) are called dynamically within a single conversation thread; integrating GPT-5 more
    than doubled benchmark performance. The validator design also includes a pre-action safety checker that vets every agent
    action before execution and enforces scope control at the network layer, ensuring that no action runs if it cannot be
    verified as safe within the defined target boundary.
