tables:
- id: TE001
  title: XBOW Platform Module / Component Matrix
  columns:
  - Component
  - Role
  - Implementation Detail
  - Differentiation
  - Diligence Gap
  rows:
  - - Coordinator (Orchestration Engine)
    - Persistent; maintains global attack-surface view, assigns tasks, debriefs agents, prioritises next actions
    - Deterministic logic; never relies on AI output alone for decision promotion
    - Eliminates context collapse seen in single-agent long-horizon systems
    - Architecture spec not independently audited; internal design not fully public
  - - Attack Agents
    - Short-lived, narrowly-scoped workers running creative AI reasoning in parallel
    - Retired after each mission; no accumulated context; thousands run simultaneously
    - Fresh-context design prevents bias accumulation and compounding errors
    - Agent count limits and rate caps under load not publicly disclosed
  - - Attack Machine (Tooling Layer)
    - Shared execution environment providing browser, standard tools, exploit frameworks
    - Steerable headless Chrome browser; inter-agent collaboration services; sandboxed
    - Production-safe tool execution within defined scope boundary
    - Tool version matrix and dependency update cadence not published
  - - Validator Engines
    - Independently confirm exploitability via controlled non-destructive challenges
    - 'XSS: headless browser payload execution; injections: programmatic checks; padding oracle: byte-by-byte extraction'
    - Zero false positives — findings only surface when proof-of-exploit is confirmed
    - Validator coverage for edge-case vuln classes (e.g., business logic) not documented
  - - Model Alloys (LLM Layer)
    - Multiple foundation models called dynamically to power agent reasoning
    - GPT-5 and Opus 4.6 integrations confirmed; single conversation thread abstraction
    - Model upgrade path (GPT-5 doubled benchmark performance) is a competitive accelerant
    - LLM provider dependency concentration; model versioning and rollback policy unpublished
