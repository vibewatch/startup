  title: XBOW Platform Architecture Stack
  type: stack
  layout: standard
  summary: Four-layer architecture separating AI discovery (Agents) from deterministic validation (Validators), orchestrated
    by a persistent Coordinator and grounded by real offensive tooling.
  data:
    layers:
    - id: coordinator
      label: Coordinator (Orchestration & Decision)
      detail: Persistent global attack-surface view; task assignment and agent debriefing; deterministic finding promotion
        logic; priority re-ranking between attack cycles
    - id: agents
      label: Attack Agents (AI Reasoning Workers)
      detail: Short-lived, narrowly-scoped parallel workers; fresh context per mission — no accumulated bias; creative human-like
        reasoning with LLM model alloys; retired after task completion
    - id: attack-machine
      label: Attack Machine (Execution Environment)
      detail: Sandboxed headless Chrome browser; standard and custom offensive security tools; inter-agent collaboration services;
        SimHash and imagehash for deduplication
    - id: validators
      label: Validator Engines (Deterministic Verification)
      detail: Controlled non-destructive exploit challenges; XSS via headless browser payload execution; injections via programmatic
        response checks; cryptographic via byte-by-byte padding oracle extraction
