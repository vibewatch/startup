callouts:
  - calloutType: "risk"
    title: "Debt Is Visible; Debt Service Is Not"
    body: "The $100 million debt portion of the Series D first close is confirmed, but the reviewed sources do not disclose rate, maturity, amortization, security, or covenants. Treating the full $233 million as available runway would therefore overstate financial flexibility."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI015"
  - calloutType: "recommendation"
    title: "Do Not Assign Software Economics Without the Revenue Bridge"
    body: "Mujin's productization strategy may improve repeatability, but public evidence does not show recognized software revenue, ARR, gross margin, or retention. Underwriting should require an audited revenue bridge and product-level contribution margins before applying a software-led multiple."
    claimRefs:
      - "CI006"
      - "CI008"
      - "CI015"
