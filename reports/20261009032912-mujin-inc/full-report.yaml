      - number: '5.2'
        title: System Architecture, Middleware, and Digital Twin Infrastructure
        blocks:
          - type: paragraph
            body: >-
              The Mujin technical architecture is structured into four functional layers spanning physical interfaces,
              dynamic digital twins, autonomous motion planning, and high-level enterprise execution. At the base layer,
              the Mujin Controller communicates with industrial robot arms (including Fanuc, Yaskawa, ABB, and KUKA) and
              industrial sensors through vendor-opened core control protocols, while vision systems capture
              high-resolution 3D point clouds. Above the hardware layer, the digital twin continuously models physical
              geometry, collision envelopes, and cell kinematics. The MujinMI intelligence engine applies real-time
              obstacle avoidance, dynamic path optimization, and grasp planning without requiring human intervention.
              Enterprise warehouse execution systems (WES) and manufacturing execution systems (MES) interface with the
              Mujin Controller via standardized APIs to communicate order fulfillment and SKU manifests. Engineering job
              postings for documentation engineers and technical writers confirm that Mujin is actively strengthening
              its plugin architecture, Docs-as-Code tooling, and SDKs to support external developers and certified
              system integrators.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
