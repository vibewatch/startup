chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Commercial Stage, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Mujin, Inc. is a robotics platform developer founded on July 6, 2011, by Carnegie Mellon University
              robotics researcher Rosen (Ross) Diankov and industrial sales engineer Issei Takino. Operating from dual
              headquarters in Tokyo, Japan, and Atlanta (Suwanee), Georgia, Mujin specializes in non-humanoid physical
              artificial intelligence designed to automate logistics and manufacturing environments. Rather than
              manufacturing physical robot arms, Mujin develops machine intelligence software, proprietary 3D vision
              perception systems, robot hands, QR grid automated guided vehicles (AGVs), and industrial controllers that
              interface with hardware from major original equipment manufacturers including ABB, Fanuc, KUKA, Yaskawa,
              Kawasaki, and Mitsubishi Electric. The company's flagship platform, MujinOS, functions as an operational
              execution architecture that integrates robot motion planning, real-time digital twins, warehouse execution
              systems (WES), and fleet management without manual teaching or custom robot coding. Entering a commercial
              expansion phase following its December 2025 Series D financing, Mujin is pivoting from custom
              system-by-system engineering integration toward standardized, productized automation workcells and
              software subscriptions distributed through certified system integrator networks.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
