      - number: '3.2'
        title: Capability, Distribution, and Switching Economics
        blocks:
          - type: paragraph
            body: >-
              Mujin's clearest claimed distinction is breadth: sources describe a no-code system that links industrial
              robots, automated guided vehicles, storage, vision, and warehouse execution through a real-time digital
              twin. A 2023 company representative also said the controller can translate WMS, WES, and MES information
              for robot systems. That proposition attacks the engineering burden of integrating each subsystem
              separately, while hardware independence may let customers retain multiple robot brands rather than lock
              into one arm vendor. Distribution is not purely direct, however. The 2025 partner announcement named eight
              North American integrators and described training plus continuing technical support from Mujin. This model
              can expand implementation capacity, but it also makes deployment quality, sales priority, and customer
              access partly dependent on partners. Public evidence does not quantify recertification cost, downtime,
              renewal behavior, or multi-homing, so switching-cost strength remains a diligence hypothesis rather than
              an established moat.
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP012
              - CP015
      - number: '3.3'
        title: Commercial Visibility and Durability Verdict
        blocks:
          - type: paragraph
            body: >-
              Capital and organizational scale improve Mujin's ability to compete, but they do not establish
              product-market leadership. Robotics 24/7 reported an $85 million Series C in 2023 and quoted management at
              roughly 300 employees globally at that time. Automated Warehouse later reported a $233 million Series D
              first close, comprising $133 million of equity and $100 million of debt, more than 400 employees, and $411
              million raised to date. The same coverage described a shift toward a scalable, product-driven model and a
              certified-integrator network. The commercial evidence remains incomplete: none of the eight assigned
              sources discloses list price, license unit, realized contract value, discounting, direct-peer price, win
              rate, renewal rate, or deployment gross margin. Funding raised is not cash available, and reported
              headcount is not market share. The defensibility case is therefore strongest at the architecture level and
              weakest at the independently benchmarked economics layer; underwriting should remain conditional on
              customer-level competitive and pricing data.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Moat Evidence Stops Before Commercial Proof
            body: >-
              Mujin's architecture and partner strategy are visible, but the assigned public record does not establish
              direct-peer win rates, price realization, renewal behavior, deployment margin, or switching cost. Treat
              the moat as technically plausible and commercially unproven until customer-level evidence closes those
              gaps.
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture Is Plausible, but Not Quantified
        blocks:
          - type: paragraph
            body: >-
              Public materials describe MujinOS as a standardized platform spanning perception, motion planning, digital
              twins, device control, and warehouse orchestration across multiple robot manufacturers and applications.
              They also describe a transition toward a scalable, product-driven business and identify a consulting
              practice that helps customers scope warehouse and factory automation. Those disclosures support several
              plausible commercial components: platform or controller software, application deployments, implementation
              and consulting, and ongoing service. They do not establish how Mujin recognizes revenue across those
              components, whether software is sold perpetually or on subscription, or what portion of revenue is
              recurring. No reviewed source publishes list or realized pricing. Accordingly, the model should be treated
              as an offering map rather than a verified revenue mix, and no ARR, software-share, or gross-margin
              conclusion is supportable from the public record.
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI015
