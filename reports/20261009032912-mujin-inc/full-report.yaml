      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Mujin's executive governance is anchored by its two co-founders: CEO Ross Diankov, who created the
              open-source OpenRAVE motion-planning framework during his doctoral work at Carnegie Mellon University, and
              Representative Director Issei Takino, who previously built industrial sales and tooling expertise at
              Berkshire Hathaway subsidiary Iscar. The technical and commercial division between Diankov's
              motion-planning architecture and Takino's production engineering insight constitutes the foundation of the
              firm's competitive differentiation, creating notable key-person dependence on both founders. In February
              2019, Takino and Diankov executed a management buyout (MBO) by acquiring all equity held by early venture
              investor University of Tokyo Edge Capital (UTEC), backed by a 7.5 billion JPY bank credit facility,
              deliberately consolidating founder control. To institutionalize regional operations and expand
              distribution, Mujin has broadened executive depth by appointing regional leadership in North America and
              Europe, establishing a specialized consulting arm at Mujin Japan, and partnering with global systems
              integrators.
            claimRefs:
