              - CE006
              - CE007
              - CE009
              - CE010
      - number: '5.3'
        title: Application Portfolio, Subscription Evolution, and Integrator Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Mujin's commercial software application portfolio spans discrete material handling workflows including
              Single SKU Palletizing, mixed-case palletizing, depalletizing, bin picking, truck unloading (TruckBot),
              and mobile robot (AGV/AMR) fleet coordination. Historically sold as capital-intensive automation equipment
              bundled with perpetual software licensing, Mujin announced in April 2026 a strategic shift toward a
              recurring software subscription model for MujinOS. Initially launched for Single SKU Palletizing with
              Standard and Premium support tiers, the subscription program provides continuous software upgrades,
              algorithmic vision improvements, customer portal dashboards, and field engineering monitoring. To scale
              delivery across North America and Europe, Mujin launched a formal partner program with automation
              integrators including Honeywell Intelligrated, Applied Manufacturing Technologies, Convergix, and
              Conveyco, delegating physical commissioning while retaining recurring software platform value.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
