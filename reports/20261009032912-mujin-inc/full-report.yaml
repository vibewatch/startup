  - id: TV002
    title: Strategic Thesis versus Anti-Thesis Evaluation
    columns:
      - Diligence Pillar
      - Investment Thesis (Bull Driver)
      - Anti-Thesis (Bear Counterpoint)
      - What Would Change the Diligence View
    rows:
      - - Platform Architecture & Moat
        - >-
          Hardware-agnostic MujinOS eliminates manual robot coding via real-time digital twin perception across all
          major OEMs.
        - >-
          Turnkey deployments historically required heavy custom engineering, custom grippers, and on-site integration
          consulting.
        - Demonstrated inflection in pure recurring software subscription revenue and zero-touch integrator deployment.
      - - Capital & Corporate Backing
        - >-
          Backed by tier-one strategic leaders including NTT Group, Qatar Investment Authority, Salesforce Ventures, and
          Accenture.
        - >-
          $100 million in debt financing creates senior balance sheet leverage ahead of proven consolidated operating
          profitability.
        - Verification that operating cash flows comfortably exceed debt interest and principal repayment obligations.
      - - Global Commercial Expansion
        - >-
          Expanding into Europe and North America via certified integrator network (Honeywell Intelligrated, AMT,
          Conveyco).
        - >-
          US warehouse customer conversions remain unannounced; channel integrators may face technical onboarding
          friction.
        - >-
          Public reference customer announcements and contract size disclosures across US retail and 3PL distribution
          networks.
      - - Exit Readiness & Liquidity
        - Targeting public listing by 2030 with potential dual-track New York or Tokyo stock exchange listings.
        - >-
          Financial opacity and lack of standard public audits could extend IPO timeline and impair regulatory
          readiness.
        - >-
          Engagement of global Big Four auditing firm and publication of audited multi-year consolidated financial
          statements.
