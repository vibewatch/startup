      - number: '7.2'
        title: Regulatory, Compliance, and Safety Governance
        blocks:
          - type: paragraph
            body: >-
              Industrial robotics deployments are subject to strict machinery directives, regional functional safety
              standards, and occupational safety regulations. Mujin's controllers command industrial manipulators
              handling payloads exceeding several hundred kilograms at speeds up to 1,400 cases per hour, operating in
              proximity to human warehouse workers and autonomous mobile robots. Compliance with standards such as ISO
              10218-1/2, ISO 13849-1, and ANSI/RIA R15.06 requires rigorous functional safety programming, interlock
              controls, and emergency stop validation. While no active product liability litigation, regulatory
              sanctions, or formal enforcement actions have been identified in public court databases as of October
              2026, the absence of recorded public violations does not eliminate liability risk in multi-device
              brownfield warehouse environments where third-party integrators configure safety fences and optical
              sensors.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Operational, Supply Chain, and Channel Partner Dependencies
        blocks:
          - type: paragraph
            body: >-
              Mujin's hardware-agnostic platform architecture creates acute counterparty dependencies across three
              distinct layers: industrial robot manufacturers, automation systems integrators, and strategic alliance
              partners. Because Mujin does not manufacture robot arms, it relies on open API access and motion
              controller interfaces from legacy Japanese and European robot OEMs including Kawasaki, FANUC, and Yaskawa.
              In North America, Mujin has transitioned from direct project execution to third-party distribution via an
              integrator partner network encompassing Applied Manufacturing Technologies, Convergix, CRG Automation,
              Mesh Automation, RG Group, C&B Material Handling, Conveyco, and Honeywell Intelligrated. If certified
              integrators face field engineering bottlenecks, turnover, or misconfigurations during complex mixed-SKU
              depalletizing or WES installations, project delays and commissioning overruns will directly impair Mujin's
              enterprise reputation and subscription adoption.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
