      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pivoting GTM from Bespoke Engineering to Integrator Channel Leverage
            body: >-
              Mujin's strategic launch of its North American partner program in August 2025 represents an essential
              operational pivot. By equipping established material handling and robotics integrators (Honeywell
              Intelligrated, Conveyco, AMT) with MujinOS, Mujin transitions from a high-touch, engineering-constrained
              systems integrator into a scalable automation software and controller platform.
            calloutType: insight
            claimRefs:
              - CU005
              - CU010
              - CU012
          - type: callout
            title: Complete Public Absence of Quantitative Retention and Cohort Metrics
            body: >-
              Despite high-profile enterprise logos and over 2,000 global deployments, Mujin does not disclose net
              revenue retention (NRR), gross renewal rates, or customer cohort churn. Diligence teams cannot
              independently verify whether early installations generate ongoing recurring software revenue or face high
              maintenance overhead and post-pilot abandonment.
            calloutType: risk
            claimRefs:
              - CU007
