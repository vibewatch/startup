figures:
  - id: FO001
    title: Mujin Corporate Development and Strategic Financing Timeline (2011-2026)
    type: timeline
    summary: >-
      Key chronological milestones spanning founding, technology breakthroughs, management buyout, strategic alliances,
      and multi-hundred-million-dollar funding rounds.
    data:
      items:
        - date: 2011-07
          label: Founding in Tokyo
          detail: Rosen Diankov and Issei Takino incorporate Mujin at University of Tokyo Entrepreneur Plaza.
        - date: 2012-08
          label: Series A Seed Financing
          detail: Secures 75 million JPY investment from University of Tokyo Edge Capital (UTEC).
        - date: 2014-08
          label: Series B Venture Funding
          detail: Raises approx. 600 million JPY from JAFCO and UTEC to advance motion-planning controller.
        - date: 2015-01
          label: PickWorker Controller Launch
          detail: Releases world's first teachless robot controller for random bulk parts bin picking.
        - date: 2019-02
          label: Management Buyout (MBO)
          detail: Founders buy out UTEC's entire equity stake and secure 7.5B JPY credit line from SMBC.
        - date: 2019-11
          label: Fast Retailing Global Alliance
          detail: Partners with Uniqlo parent company to deploy AI-driven picking robots in apparel distribution.
        - date: 2021-09
          label: North America Expansion
          detail: Establishes US operational headquarters in Suwanee, Georgia to target American logistics.
        - date: 2023-09
          label: Series C Round ($85M)
          detail: Raises $85 million led by SBI Investment with participation from Accenture and Pegasus Tech Ventures.
        - date: 2024-01
          label: Accenture Alpha Automation JV
          detail: Establishes joint venture (70% Accenture, 30% Mujin) connecting factory data with enterprise IT.
        - date: 2025-08
          label: North American Integrator Program
          detail: Onboards Honeywell Intelligrated, Conveyco, and AMT as certified deployment partners for MujinOS.
        - date: 2025-12
          label: Series D First Close ($233M)
          detail: Secures $133M equity led by NTT Group and QIA, alongside $100M in debt financing.
        - date: 2026-06
          label: Targeted 2030 IPO Roadmap
          detail: Media reports indicate company is valued over $1B ahead of planned public listing by 2030.
    approximationNotes: All dates represent calendar years and months verified against press releases and corporate filings.
    claimRefs:
      - CO001
      - CO008
      - CO010
      - CO011
      - CO012
      - CO013
