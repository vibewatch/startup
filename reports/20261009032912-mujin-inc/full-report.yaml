  - id: FE001
    title: MujinOS Autonomous Robotics Technology Stack
    type: stack
    summary: Six-tier architectural hierarchy from physical hardware interfaces to enterprise systems orchestration.
    data:
      layers:
        - label: Enterprise Orchestration & WES/MES Integration Layer
          detail: >-
            Connects robotic cells with WMS/WES and MES systems for continuous manifest ingest, operational analytics,
            and production telemetry.
        - label: Customer Operations & Remote Support Portal Layer
          detail: >-
            Provides real-time system monitoring, ticket tracking, remote troubleshooting, and managed software upgrade
            dispatch.
        - label: Platform Services & Developer SDK Layer
          detail: >-
            Provides plugin architecture, client SDKs, REST APIs, and Docs-as-Code tooling for certified integrator
            customization.
        - label: MujinMI Intelligence & Motion Planning Layer
          detail: >-
            Executes real-time perception, obstacle avoidance, grasp calculation, and collision-free dynamic trajectory
            planning.
        - label: Real-Time Digital Twin & Synchronization Layer
          detail: >-
            Maintains a continuously updating virtual model of cell kinematics, physical geometry, parcel orientations,
            and environment states.
        - label: Hardware Abstraction & Sensor Driver Layer
          detail: >-
            Interfaces with industrial robot manipulators, 3D vision cameras, safety interlocks, and end-of-arm tooling
            across multiple OEMs.
    approximationNotes: >-
      Conceptual functional decomposition based on Mujin technical announcements and published engineering
      specifications.
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE009
      - CE010
  - id: FU001
    title: Mujin Enterprise Customer Journey and Partner Expansion Map
    type: journey-map
    summary: >-
      Visual mapping of customer adoption stages from initial site consulting to certified integrator multi-site fleet
      expansion.
    data:
      nodes:
        - label: 1. Site Assessment & Consulting
          detail: >-
            Mujin Japan or regional consulting teams analyze client warehouse bottlenecks, SKU dimensions, and WMS
            integration points.
        - label: 2. Digital Twin Workcell Simulation
          detail: >-
            MujinOS constructs a virtual digital twin of the cell to simulate collision-free kinematic trajectories and
            verify throughput.
        - label: 3. Integrator Solution Engineering
          detail: >-
            Certified RSI/MHI partners (e.g. Honeywell, AMT, Conveyco) engineer physical cell layouts, safety guarding,
            and conveyor feeds.
        - label: 4. No-Code Commissioning & Go-Live
          detail: >-
            Pre-calibrated Mujin Controller connects to OEM robot arms (Fanuc, Yaskawa, ABB) enabling teachless
            operation on day one.
        - label: 5. Production Ramp & Real-Time Orchestration
          detail: >-
            MujinOS dynamically coordinates multi-SKU palletizing, picking, and AGV transit, updating motion plans as
            parcel shapes shift.
        - label: 6. Facility Fleet Scaling & Software Updates
          detail: >-
            Enterprises scale automation across sister facilities via standardized partner playbooks and continuous
            MujinOS updates.
    approximationNotes: >-
      Journey stages model the operational workflow from initial engineering evaluation to multi-site enterprise fleet
      rollout under Mujin's certified integrator delivery architecture.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU007
