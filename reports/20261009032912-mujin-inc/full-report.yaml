              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Subscription Transition De-risks Customer Adoption but Shifts Working Capital
            body: >-
              Mujin's April 2026 launch of a recurring subscription model for MujinOS Single SKU Palletizing shifts
              robotics software procurement from capital expenditure to operating expenditure. While lowering upfront
              friction for warehouse operators and ensuring continuous software upgrades, it requires Mujin to build
              dedicated customer support portals and proactive field engineering operations.
            calloutType: insight
            claimRefs:
              - CE011
              - CE012
              - CE013
          - type: callout
            title: Dependency on Hardware Vendor Openness and Integrator Execution
            body: >-
              Mujin's hardware-agnostic value proposition relies on industrial robot OEMs keeping their controller
              protocols accessible. Furthermore, scaling North American deployments depends heavily on third-party
              automation integrators successfully commissioning cells without requiring high-touch intervention from
              Mujin's engineering staff.
            calloutType: risk
            claimRefs:
              - CE006
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Workflows
        blocks:
          - type: paragraph
            body: >-
              Mujin's customer base spans high-volume distribution, e-commerce retail logistics, consumer packaged goods
              (CPG), automotive parts manufacturing, and pharmaceutical wholesale. Across these sectors, Mujin targets
              operations executives and logistics engineering heads burdened by severe manual labor shortages, ergonomic
              injuries, and rising warehouse wage rates. Unlike consumer software or lightweight SaaS platforms,
              industrial automation sales require high capital commitments and deep operational integration into
              facility workflows. In its mature Japanese domestic business, Mujin operates both as a direct solutions
              provider and an intelligent technology partner, delivering automated palletizing, piece picking, and AGV
              fleet coordination directly to major corporations such as Fast Retailing, PALTAC, and JD.com. In North
              America and Europe, Mujin is accelerating customer acquisition by segmenting its go-to-market motion
              between direct strategic accounts and a certified ecosystem of robotics system integrators (RSIs) and
              material handling integrators (MHIs). This segmentation allows Mujin to focus core engineering on MujinOS,
              motion-planning algorithms, and standardized hardware units like TruckBot, while external integrators
              manage brownfield installation, electrical safety, and physical cell commissioning.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
