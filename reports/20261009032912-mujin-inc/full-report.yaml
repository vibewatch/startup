      - number: '1.3'
        title: Capitalization History, Investor Base, and Debt Financing
        blocks:
          - type: paragraph
            body: >-
              Mujin has secured $411 million in cumulative capital through equity rounds, debt financing, and credit
              facilities since its 2011 inception. After early venture backing from UTEC and JAFCO between 2012 and
              2014, the company operated without primary venture equity for nine years until its September 2023 Series C
              round, which raised $85 million led by SBI Investment with participation from Pegasus Tech Ventures,
              Accenture, and Toyota research executive Dr. James Kuffner, later expanded by a $18 million (2.7 billion
              JPY) extension in December 2023. In December 2025, Mujin concluded the first close of its Series D round,
              securing $233 million comprising $133 million in equity co-led by NTT Group and Qatar Investment Authority
              (QIA), alongside Mitsubishi HC Capital Realty and Salesforce Ventures, coupled with $100 million in debt
              financing from major Japanese financial institutions. While Bloomberg reported in June 2026 that Mujin
              achieved an estimated private valuation exceeding $1 billion ahead of a targeted 2030 IPO, post-money
              valuation, shareholding percentages, and revenue multiples remain undisclosed by the company.
