      - number: '6.3'
        title: Named Customer Proof, Retention Gaps, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Publicly verified customer references provide concrete evidence of Mujin's production capabilities in
              demanding logistics and supply chain environments. Fast Retailing established a global strategic
              partnership with Mujin in November 2019 to automate picking operations across UNIQLO distribution
              warehouses, specifically addressing the complex manipulation of flexible apparel items. Similarly,
              e-commerce giant JD.com deployed Mujin intelligent picking and controller technology within its highly
              automated fulfillment centers in China, while major Japanese cosmetics firm Fancl and consumer goods
              wholesaler PALTAC integrated Mujin robotics into primary logistics hubs. In August 2025, Mujin formalized
              a strategic North American partner program onboarding an initial cohort of eight automation integrators:
              robotics system integrators Applied Manufacturing Technologies (AMT), Convergix, CRG Automation, Mesh
              Automation, and RG Group, alongside material handling leaders C&B Material Handling, Conveyco, and
              Honeywell Intelligrated. However, significant diligence gaps persist: customer-level net revenue retention
              (NRR), gross revenue retention (GRR), exact annual churn rates, and individual customer revenue
              concentration percentages remain closely held private company secrets. Furthermore, heavy reliance on
              large enterprise contracts and emerging channel integrators introduces channel execution exposure if
              partner onboarding lags.
            claimRefs:
