  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Summary and Severity Ranking
        blocks:
          - type: paragraph
            body: >-
              Evaluating Mujin's risk profile reveals a capital-intensive deep-tech robotics provider undergoing a
              critical strategic transition from bespoke engineering deployments to a standardized software platform
              (MujinOS). Despite raising $133 million in equity alongside $100 million in debt during its Series D first
              close in December 2025, bringing total funding to $411 million, Mujin remains unlisted and maintains
              private-undisclosed financials with no publicly audited revenue, cash burn, or gross margin figures. The
              $100 million syndicated debt facility introduces material fixed balance-sheet service obligations before
              positive operating cash flow is proven. Furthermore, the company's aggressive North American expansion
              from its Atlanta hub depends on newly formed systems integrator alliances, creating execution friction and
              partner delivery exposure. Technological integration risks remain salient as Mujin does not produce robot
              arms, instead operating as a multi-vendor software brain layered across industrial OEMs such as FANUC,
              Yaskawa, Kawasaki, and Mitsubishi Electric.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
