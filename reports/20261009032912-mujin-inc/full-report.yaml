      - number: '6.2'
        title: Adoption Trajectory, Operating Footprint, and Field Scale
        blocks:
          - type: paragraph
            body: >-
              Mujin's operating trajectory demonstrates a transition from specialized early-stage robotic workcells
              toward widespread industrial infrastructure adoption. Industry disclosures and company reports confirm
              that MujinOS has powered thousands of robotic systems globally, with over 2,000 successful implementations
              spanning industrial manufacturing facilities and distribution centers. Rather than remaining in
              experimental proof-of-concept (PoC) stages, these installations operate in daily production lines for
              leading global enterprises. Following an $85 million Series C financing round in 2023, Mujin expanded its
              U.S. presence from its North American headquarters in Suwanee, Georgia, growing its U.S. workforce to
              approximately 60 employees out of a global headcount of over 300 to 450 personnel across Japan, North
              America, Europe, and China. In December 2025, Mujin closed the first tranche of its Series D round
              totaling $233 million (36.4 billion yen), with NTT Group and the Qatar Investment Authority acting as
              co-lead investors. Company executives have articulated that Series D proceeds are dedicated to shifting
              from bespoke site-by-site engineering toward standardized, scalable MujinOS products, expanding certified
              integrator networks, and driving operational expansion across Western markets ahead of an anticipated
              initial public offering by 2030.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
