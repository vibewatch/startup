evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: consolidated-financials
    missingEvidence: >-
      Audited consolidated revenue, software ARR, gross margins, and EBITDA/operating profit for the Mujin Group across
      fiscal years 2024 through 2026.
    whyItMatters: >-
      Without consolidated group financials, it is impossible to evaluate company cash burn, subscription software gross
      margins, or enterprise valuation multiples.
    diligencePath: >-
      Obtain formal access to Mujin's confidential pre-IPO data room or review audited statements provided by
      underwriters.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: post-money-valuation
    missingEvidence: Official company statement or regulatory filing verifying post-money valuation at the Series D first close.
    whyItMatters: >-
      Media reports cite a $1B+ unicorn valuation, but absence of formal valuation confirmation hinders accurate pricing
      and dilution analysis.
    diligencePath: >-
      Verify share issuance price and cap table structure in commercial registry filings (Tokibo) or private placement
      memorandum.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: software-subscription-arr
    missingEvidence: Disclosure of Mujin's software-only ARR, recurring license contract terms, and pure software gross margins.
    whyItMatters: Essential for isolating software valuation multiples from turnkey hardware pass-through integration revenues.
    diligencePath: >-
      Request software subscription revenue breakdowns and average contract values (ACV) from the private company data
      room.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: direct-peer-benchmark
    missingEvidence: >-
      Named direct robotics-software peers with comparable product scope, installed-base scale, funding, customer
      segments, pricing, and independent performance benchmarks.
    whyItMatters: Without a like-for-like peer set, the durability of Mujin's claimed technical differentiation cannot be ranked.
    diligencePath: Obtain recent competitive RFPs, customer reference calls, independent benchmarks, and management win-loss records.
    relatedQuestionRefs:
      - QP001
      - QP002
      - QP003
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      Mujin and peer list prices, realized contract values, software-versus-hardware mix, discounts, channel fees,
      deployment gross margin, and renewal terms.
    whyItMatters: >-
      Architecture breadth cannot be translated into buyer ROI, pricing power, or durable software economics without
      contract-level evidence.
    diligencePath: >-
      Review customer contracts, price books, integrator agreements, renewal cohorts, and contribution margins by
      deployment.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-channel
    missingEvidence: >-
      Measured migration cost, downtime, recertification burden, multi-homing rate, partner-sourced pipeline, partner
      concentration, and implementation quality.
    whyItMatters: >-
      These data determine whether integrations create defensible lock-in or expose Mujin to channel substitution and
      inconsistent delivery.
    diligencePath: >-
      Analyze renewal and migration cases, partner scorecards, pipeline attribution, deployment SLAs, and customer
      reference interviews.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited recognized revenue by software, hardware, integration, consulting, support, geography, and billing model.
    whyItMatters: The public offering map cannot establish scale, recurrence, concentration, or the appropriate valuation framework.
    diligencePath: >-
      Obtain audited statements, revenue-recognition policies, contract schedules, deferred revenue, and ARR
      reconciliations in the data room.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Product and project gross margins, deployment labor, warranty cost, CAC, sales cycle, payback, retention, and
      partner economics.
    whyItMatters: These inputs determine whether productization is improving margin and growth efficiency.
    diligencePath: Review product-level contribution margins and customer cohorts reconciled to the general ledger.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, working capital, capex, downside runway, and the next financing trigger.
    whyItMatters: Gross funds raised do not measure current liquidity or the period before additional capital is required.
    diligencePath: Obtain the latest balance sheet, monthly cash-flow history, operating plan, and base/downside runway model.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: debt-obligations
    missingEvidence: >-
      Interest rate, maturity, amortization, security, covenants, and lender remedies for the $100 million debt
      financing.
    whyItMatters: Debt claims can reduce financial flexibility even when the headline financing amount appears large.
    diligencePath: Review executed credit agreements, covenant compliance certificates, repayment schedules, and security documents.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: Customer Retention and Cohort Metrics
    missingEvidence: >-
      Quantitative customer retention data including Net Revenue Retention (NRR), Gross Revenue Retention (GRR), annual
      customer logo churn, and multi-year cohort dollar expansion curves.
    whyItMatters: >-
      Without retention and cohort metrics, investors cannot verify whether early enterprise deployments generate
      recurring expansion revenue or suffer from pilot fatigue and high post-deployment maintenance friction.
    diligencePath: >-
      Request confidential customer cohort retention tables, annual maintenance contract renewal rates, and software
      license expansion figures under NDA within the financial data room.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: Customer Concentration and Revenue Share
    missingEvidence: >-
      Customer concentration percentages revealing the proportion of historical revenue derived from the top 3, 5, and
      10 corporate accounts (e.g. Fast Retailing / UNIQLO, JD.com, PALTAC).
    whyItMatters: >-
      High revenue concentration in a handful of Japanese corporate giants exposes Mujin to sudden revenue volatility if
      an anchor client pauses automation CapEx or shifts to internal development.
    diligencePath: >-
      Review audited revenue breakdowns by customer account and signed master service agreements (MSAs) during
      commercial due diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: financial-burn-margin
    missingEvidence: >-
      Audited financial statements detailing Mujin's annual recurring revenue, gross margins on software vs hardware
      integration, and cash burn rate.
    whyItMatters: >-
      Assessing creditworthiness and debt service sustainability for the $100M facility requires primary financial
      statements.
    diligencePath: Request confidential disclosure from management or review data room financials under NDA.
    relatedQuestionRefs:
      - QR005
      - QR006
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register-verification
    missingEvidence: >-
      Direct primary safety certification records and comprehensive regulatory audit filings across international
      operating jurisdictions.
    whyItMatters: >-
      Validating that functional safety, CE marking, and ANSI/RIA standards are fully certified across all multi-vendor
      robot configurations.
    diligencePath: Review OSHA inspection databases, CE declaration files, and third-party NRTL functional safety certificates.
    relatedQuestionRefs:
