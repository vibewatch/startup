      - number: '1.3'
        title: 资本化历程、投资者基础与债务融资
        blocks:
          - type: paragraph
            body: >-
              自 2011 年成立以来，Mujin 通过股权轮次、债务融资和授信额度累计获得 $411 million。2012 至 2014 年获得 UTEC 和 JAFCO
              早期风险投资后，公司连续九年没有新增主要风险股权，直到 2023 年 9 月的 Series C 融资；该轮由 SBI Investment 领投，Pegasus Tech Ventures、Accenture
              和 Toyota 研究高管 Dr. James Kuffner 参与，融资 $85 million，随后在 2023 年 12 月追加 $18 million（2.7 billion JPY）。2025 年 12
              月，Mujin 完成 Series D 首次交割，获得 $233 million，其中 $133 million 股权由 NTT Group 和 Qatar Investment
              Authority（QIA）联合领投，Mitsubishi HC Capital Realty 和 Salesforce Ventures 参与，另有日本主要金融机构提供 $100 million
              债务融资。Bloomberg 于 2026 年 6 月报道称，在计划于 2030 年 IPO 前，Mujin 的估计非上市估值已超过 $1 billion，但公司未披露投后估值、持股比例和收入倍数。
