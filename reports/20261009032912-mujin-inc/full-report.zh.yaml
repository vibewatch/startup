      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本策略：创始人自主权与均衡债务结构
            body: >-
              不同于经历多轮激进稀释的典型风险投资软件初创公司，Mujin 在 2019 年进行管理层收购，重新取得最初机构风险投资股权的 100%。2023 年以 $85M Series C、2025 年以 $233M
              Series D 重返机构资本市场时，公司用 $100M 大额非稀释银行债务搭配 NTT、Accenture 和 QIA
              的战略企业支持。这一结构在为资本密集型硬件和全球集成商部署提供资金的同时，保留了运营独立性。
