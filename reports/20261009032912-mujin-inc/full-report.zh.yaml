          to: capital-alliances
        - from: capital-alliances
          to: debt-burden
        - from: debt-burden
          to: financial-opacity
        - from: financial-opacity
          to: us-channel-risk
        - from: us-channel-risk
          to: track-verdict
    approximationNotes: 基于技术优势、财务风险和披露边界推导出的逻辑决策序列。
