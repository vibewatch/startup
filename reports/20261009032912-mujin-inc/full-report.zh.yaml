  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高管风险摘要与严重性排序
        blocks:
          - type: paragraph
            body: >-
              对 Mujin 风险画像的评估显示，这是一家资本密集型深科技机器人供应商，正经历从定制工程部署转向标准化软件平台（MujinOS）的关键战略转型。尽管公司在 2025 年 12 月 Series D
              首次交割中获得 $133 million 股权和 $100 million 债务，使总融资达到 $411 million，Mujin 仍未上市，财务数据保持私有且未披露经公开审计的收入、现金消耗或毛利率。$100
              million 银团债务在正向经营现金流得到证明前，带来重大的固定资产负债表偿付义务。此外，公司从 Atlanta 枢纽激进扩张北美，依赖新成立的系统集成商联盟，产生执行摩擦和伙伴交付暴露。由于 Mujin
              不生产机械臂，而是作为覆盖 FANUC、Yaskawa、Kawasaki 和 Mitsubishi Electric 等工业 OEM 的多厂商软件大脑运行，技术集成风险仍然突出。
