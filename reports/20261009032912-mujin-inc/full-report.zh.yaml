  - id: FE001
    title: MujinOS 自主机器人技术栈
    type: stack
    summary: 从物理硬件接口到企业系统编排的六层架构。
    data:
      layers:
        - label: 企业编排与 WES/MES 集成层
          detail: 连接机器人工作单元与 WMS/WES、MES 系统，持续接收清单、开展运营分析并采集生产遥测数据。
        - label: 客户运营与远程支持门户层
          detail: 提供实时系统监控、工单跟踪、远程故障排查及托管软件升级派发。
        - label: 平台服务与开发者 SDK 层
          detail: 提供插件架构、客户端 SDK、REST API 与 Docs-as-Code 工具，支持认证集成商定制。
        - label: MujinMI 智能与运动规划层
          detail: 执行实时感知、避障、抓取计算与无碰撞动态轨迹规划。
        - label: 实时数字孪生与同步层
          detail: 持续更新工作单元运动学、物理几何、包裹朝向与环境状态的虚拟模型。
        - label: 硬件抽象与传感器驱动层
          detail: 对接多个 OEM 的工业机器人机械手、3D 视觉相机、安全联锁与末端工具。
    approximationNotes: 基于 Mujin 技术公告与已发布工程规格的概念性功能拆解。
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE009
      - CE010
  - id: FU001
    title: Mujin 企业客户旅程与合作伙伴扩张图
    type: journey-map
    summary: 可视化呈现从初始站点咨询到认证集成商多站点车队扩张的客户采用阶段。
    data:
      nodes:
        - label: 1. 站点评估与咨询
          detail: Mujin Japan 或区域咨询团队分析客户仓库瓶颈、SKU 尺寸与 WMS 集成点。
        - label: 2. 数字孪生工作单元仿真
          detail: MujinOS 构建工作单元虚拟数字孪生，仿真无碰撞运动学轨迹并验证吞吐量。
        - label: 3. 集成商方案工程
          detail: 认证 RSI/MHI 合作伙伴（如 Honeywell、AMT、Conveyco）设计实体工作单元布局、安全防护与输送线供料。
        - label: 4. 无代码调试与上线
          detail: 预校准 Mujin Controller 连接 OEM 机器人机械臂（Fanuc、Yaskawa、ABB），首日即可实现无需示教运行。
        - label: 5. 生产爬坡与实时编排
          detail: MujinOS 动态协调多 SKU 码垛、拣选与 AGV 转运，并随包裹形状变化更新运动规划。
        - label: 6. 设施车队扩张与软件更新
          detail: 企业借助标准化合作伙伴操作手册与持续的 MujinOS 更新，将自动化扩展到姊妹设施。
    approximationNotes: 旅程阶段模拟 Mujin 认证集成商交付架构下，从初始工程评估到企业多站点车队落地的运营流程。
