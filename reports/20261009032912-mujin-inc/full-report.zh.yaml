              - CV012
      - number: '8.2'
        title: 资本结构、债务负担与非上市二级定价
        blocks:
          - type: paragraph
            body: >-
              Mujin 于 2025 年 12 月完成 Series D 首次交割，通过 $133 million 风险股权和 $100 million 债务融资获得 $233 million；债务来自包括 Mizuho
              Bank、Sumitomo Mitsui Trust Bank 和 Aozora Bank 在内的日本主要金融机构银团。该交易使累计融资达到 $411 million（约 59.6 billion
              JPY）。股权部分提供了大量流动性，可支持全球员工超过 400 人，并支持 Atlanta、Tokyo、Guangzhou 和欧洲的工程设施；但 $100 million
              债务负担在未经审计的资产负债表上带来不可回避的现金利息和本金摊还义务。2026 年 6 月媒体报道，在追加交割和计划于 2030 年 IPO 前，Mujin 的非上市独角兽估值超过 $1
              billion；但公司没有确认正式投后估值、股价或清算优先权。此外，EquityZen 等 IPO 前二级平台允许合格投资者获取流动性，说明外部存在 IPO
              前流动性需求，却没有透明的交易量或市场出清价格数据。在缺乏已验证收入倍数的情况下，机构投资者必须严格控制入场纪律。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
