      - number: '5.2'
        title: 系统架构、中间件与数字孪生基础设施
        blocks:
          - type: paragraph
            body: >-
              Mujin 技术架构分为四个功能层：物理接口、动态数字孪生、自主运动规划和高层企业执行。底层 Mujin Controller 通过厂商开放的核心控制协议与工业机械臂（包括 Fanuc、Yaskawa、ABB 和
              KUKA）及工业传感器通信，视觉系统同时采集高分辨率 3D 点云。硬件层之上，数字孪生持续建模实体几何、碰撞包络和工作单元运动学。MujinMI
              智能引擎无需人工介入即可执行实时避障、动态路径优化和抓取规划。企业仓库执行系统（WES）和制造执行系统（MES）通过标准化 API 与 Mujin Controller 对接，传递订单履约和 SKU
              清单。文档工程师和技术写作者的招聘信息表明，Mujin 正积极强化插件架构、Docs-as-Code 工具和 SDK，以支持外部开发者及认证系统集成商。
