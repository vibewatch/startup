      - number: '7.2'
        title: 监管、合规与安全治理
        blocks:
          - type: paragraph
            body: >-
              工业机器人部署受严格机械指令、区域功能安全标准和职业安全法规约束。Mujin 控制器操纵工业机械手，以最高每小时 1,400 箱的速度搬运数百公斤以上负载，并与仓库工人和自主移动机器人近距离作业。遵守 ISO
              10218-1/2、ISO 13849-1 和 ANSI/RIA R15.06 等标准，需要严格的功能安全编程、联锁控制和急停验证。截至 2026 年 10
              月，公开法院数据库没有发现正在进行的产品责任诉讼、监管制裁或正式执法行动，但没有记录到公开违规，并不能消除多设备棕地仓库环境中的责任风险；在这些环境里，第三方集成商会配置安全围栏和光学传感器。
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 运营、供应链与渠道合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Mujin 的硬件无关平台架构在三层形成尖锐的交易对手依赖：工业机器人制造商、自动化系统集成商和战略联盟伙伴。由于 Mujin 不制造机械臂，公司依赖 Kawasaki、FANUC、Yaskawa
              等日本和欧洲传统机器人 OEM 的开放 API 访问及运动控制器接口。在北美，Mujin 已从直接项目执行转向通过集成商伙伴网络进行第三方分销，该网络包括 Applied Manufacturing
              Technologies、Convergix、CRG Automation、Mesh Automation、RG Group、C&B Material Handling、Conveyco 和 Honeywell
              Intelligrated。若认证集成商在复杂混合 SKU 拆垛或 WES 安装中出现现场工程瓶颈、人员流失或配置错误，项目延期和调试超支将直接损害 Mujin 的企业声誉和订阅采用。
            claimRefs:
