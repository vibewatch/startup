  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Mujin 开发并商业化 MujinOS 和 Mujin
              Controller，这是一套面向物流、制造和供应链运营的智能操作系统，用于自动化工业机器人。传统机器人自动化中，每台工业机器人都需要繁琐的人工示教、专门的机器人编程和固定工作单元布局；SKU
              尺寸或码垛模式一变，系统就会失效。MujinOS
              将实时感知、运动规划和机器智能（MujinMI）组合成集成控制层，直接运行于棕地和绿地配送中心。仓库操作员无需编写固定坐标路径，而是通过无代码图形界面配置码垛、拆垛、料箱拣选和移动车队自动化。系统核心是持续同步的实时数字孪生，它追踪实体库存、机器人运动学约束和环境变化，让机器人能动态适应意外包裹朝向及非结构化物流挑战。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
