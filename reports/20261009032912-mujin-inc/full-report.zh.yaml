      - - 全球商业扩张
        - 通过认证集成商网络（Honeywell Intelligrated、AMT、Conveyco）拓展欧洲与北美。
        - 美国仓库客户转化仍未公布；渠道集成商可能面临技术接入摩擦。
        - 公开发布美国零售与 3PL 分销网络的参考客户及合同规模。
      - - 退出准备度与流动性
        - 目标在 2030 年前上市，可能采取纽约或东京证券交易所双轨上市。
        - 财务不透明且缺乏标准公开审计，可能拉长 IPO 时间线并削弱监管准备度。
        - 聘请全球四大审计机构，并发布经审计的多年合并财务报表。
    notes: 论点评估在技术平台优势与商业交付限制、披露缺口之间权衡。
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
      - CV012
  - id: TV003
    title: 情景分析：看多、基准与看空投资判断情景
    columns:
      - 情景
      - 概率权重
      - 运营与商业假设
      - 隐含估值逻辑（2030 年视角）
      - 下行情景触发因素与终止信号
    rows:
      - - 乐观情景
        - 25%
        - MujinOS 订阅 ARR 出现拐点；北美集成商快速规模化；NTT 联盟带来巨大的计算协同。
        - $2.5B - $3.5B（高利润率软件按 >10x ARR 倍数估值，成功在纽约或东京 IPO）。
        - 集成商渠道冲突、调试周期拉长，或更优端到端基础模型出现。
      - - 基准情景
        - 50%
        - 在日本与亚洲稳步扩张；北美采用程度中等；收入由软件、硬件与工程服务混合构成。
        - $1.0B - $1.5B（混合收入按 3x-5x 的温和增长倍数估值；最终在东京国内交易所上市）。
        - 收入无法与员工人数增长脱钩，导致经营利润率停滞在约 10-15%。
      - - 悲观情景
        - 25%
        - 美国客户转化停滞；定制工程成本持续；$100M 债务负担迫使公司困境再融资或资本重组。
        - 低于 $600M（折价轮导致估值压缩、二级股份缺乏流动性，或困境出售）。
        - 债务契约违约、Diankov 或 Takino 离任，或商业客户严重流失。
    notes: 情景概率与隐含估值期限反映分析师的投资判断模型。估值数据代表 2030 年前的目标退出期限。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: Mujin 公司发展与战略融资时间线（2011-2026）
    type: timeline
    summary: 涵盖创立、技术突破、管理层收购、战略联盟及数亿美元融资轮次的关键时间里程碑。
    data:
      items:
        - date: 2011-07
          label: 在东京创立
          detail: Rosen Diankov 与 Issei Takino 在 University of Tokyo Entrepreneur Plaza 注册成立 Mujin。
        - date: 2012-08
          label: A 轮种子融资
          detail: 从 University of Tokyo Edge Capital（UTEC）获得 75 million JPY 投资。
        - date: 2014-08
          label: B 轮风险融资
          detail: 从 JAFCO 与 UTEC 筹集 approx. 600 million JPY，用于推进运动规划控制器。
        - date: 2015-01
          label: PickWorker 控制器发布
          detail: 发布全球首款无需示教的机器人控制器，用于随机散装零件料箱拣选。
        - date: 2019-02
          label: 管理层收购（MBO）
          detail: 创始人买下 UTEC 全部股权，并从 SMBC 获得 7.5B JPY 授信额度。
        - date: 2019-11
          label: Fast Retailing 全球联盟
          detail: 与 Uniqlo 母公司合作，在服装分销中部署 AI 驱动的拣选机器人。
        - date: 2021-09
          label: 北美扩张
          detail: 在佐治亚州 Suwanee 设立美国运营总部，开拓美国物流市场。
        - date: 2023-09
          label: C 轮融资（$85M）
          detail: 由 SBI Investment 领投并获 Accenture 与 Pegasus Tech Ventures 参与，筹集 $85 million。
        - date: 2024-01
          label: Accenture Alpha Automation 合资公司
          detail: 成立合资公司（Accenture 70%、Mujin 30%），连接工厂数据与企业 IT。
        - date: 2025-08
          label: 北美集成商计划
          detail: 引入 Honeywell Intelligrated、Conveyco 与 AMT，作为 MujinOS 认证部署合作伙伴。
        - date: 2025-12
          label: D 轮首轮交割（$233M）
          detail: 获得由 NTT Group 与 QIA 领投的 $133M 股权融资，另有 $100M 债务融资。
        - date: 2026-06
          label: 目标 2030 年 IPO 路线图
          detail: 媒体报道称，公司在计划于 2030 年上市前的估值已超过 $1B。
    approximationNotes: 所有日期均为经新闻稿与公司申报文件核实的日历年与月份。
    claimRefs:
      - CO001
      - CO008
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO016
  - id: FM001
    title: Mujin 可服务市场规模层级
    type: pyramid
    summary: 从全球工业自动化市场支出到 Mujin 可切入的软件与工作单元细分市场的分层拆解。
