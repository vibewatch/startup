chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、商业阶段与业务模式
        blocks:
          - type: paragraph
            body: >-
              Mujin, Inc. 是一家机器人平台开发商，由 Carnegie Mellon University 机器人研究员 Rosen (Ross) Diankov 和工业销售工程师 Issei Takino 于
              2011 年 7 月 6 日创立。公司总部设在日本东京和佐治亚州 Atlanta（Suwanee），专注于用非人形实体人工智能自动化物流和制造环境。Mujin 不制造实体机械臂，而是开发机器智能软件、专有 3D
              视觉感知系统、机器人手爪、二维码网格自动导引车（AGV）和工业控制器，使其能接入 ABB、Fanuc、KUKA、Yaskawa、Kawasaki、Mitsubishi Electric
              等主要原始设备制造商的硬件。公司的旗舰平台 MujinOS 是一套运营执行架构，将机器人运动规划、实时数字孪生、仓库执行系统（WES）和车队管理整合起来，无需人工示教或定制机器人编码。继 2025 年 12
              月完成 Series D 融资后，Mujin 进入商业扩张阶段，正从逐系统定制工程集成转向标准化、产品化的自动化工作单元，并通过认证系统集成商网络分发软件订阅。
