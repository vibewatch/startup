            body: >-
              公开材料将 MujinOS
              描述为标准化平台，覆盖感知、运动规划、数字孪生、设备控制和仓库编排，可适配多家机器人制造商及多种应用。材料还描述公司向可扩展、产品驱动业务转型，并指出咨询团队帮助客户规划仓库和工厂自动化。这些披露支持若干合理的商业组成：平台或控制器软件、应用部署、实施与咨询，以及持续服务。但它们无法说明
              Mujin 如何在这些组成之间确认收入、软件是永久授权还是订阅销售，或收入中有多少属于经常性收入。经审阅来源没有公布标价或实际价格。因此，该模型只能视为产品供给地图，而非已验证的收入组合，公开记录也不足以支持
