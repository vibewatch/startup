      - number: '1.4'
        title: 运营规模、战略联盟与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Mujin 已将运营版图扩展至日本、美国、中国（广州）和荷兰，全球员工超过 400 人，其中佐治亚州 Suwanee 北美基地有 60 多名员工。亚洲客户案例包括 Fast
              Retailing（Uniqlo）、药品批发商 Paltac 和电商平台 JD.com 的高吞吐量生产部署；Paltac 报告称用工需求下降 90%，码垛吞吐量翻倍。2025 年 8 月，Mujin 在北美与
              Honeywell Intelligrated、Conveyco 和 Applied Manufacturing Technologies 等系统集成商启动合作伙伴计划，以加快 MujinOS
              在零售和消费物流中的部署。2024 年 1 月，Mujin 与 Accenture 成立合资企业 Accenture Alpha Automation（Accenture 持股 70%，Mujin 持股
              30%），将运营机器人数据接入企业管理系统。尽管商业势头强劲，Mujin 既未披露集团合并收入、ARR、毛利率，也未披露客户留存队列，形成需要通过私人数据室核实的重大尽调缺口。
