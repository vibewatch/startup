      - number: '8.3'
        title: 情景投资判断、估值敏感性与尽调路线图
        blocks:
          - type: paragraph
            body: >-
              由于缺少经审计的历史收入和现金流数据，量化估值判断需要以战略执行里程碑为锚，进行情景化概率建模，而不是套用未经验证的静态倍数。乐观情景下，Mujin 通过北美集成商网络（Honeywell
              Intelligrated、AMT、Conveyco）成功扩大 MujinOS，加快经常性软件订阅，将 NTT 联盟转化为大规模计算基础设施部署，并在 2030 年前完成纽约或东京双轨 IPO，企业估值达到
              $2.5B 至 $3.5B。基准情景下，日本国内物流需求和咨询项目推动公司稳定实现两位数增长，但北美软件转型较慢，在承担债务偿付成本的同时，估值处于 $1.0B 至 $1.5B
              区间。悲观情景下，客户集中度衰减、定制集成成本持续上升，以及实体 AI 基础模型竞争加剧，触发稀释性重组或下轮融资，将估值压低至 $600M
              以下。因此，建议投资姿态为跟踪，估值立场未知、风险评级高，等待通过私人数据室获取经验证的合并财务、流失队列和债务契约。
            claimRefs:
              - CV006
              - CV013
              - CV014
              - CV015
              - CV016
