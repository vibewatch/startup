        title: 展示项
        blocks:
          - type: callout
            title: 投资姿态：等待已验证财务披露后跟踪
            body: >-
              我们以中等信心将 Mujin 的投资建议定为跟踪，估值立场为未知。Mujin 的运动规划技术以及与 NTT、Accenture 和 QIA 的企业合作处于顶级水平，但在没有经审计合并财务报表、ARR
              可见度和债务契约条款前，不能以超过 $1 billion 的传闻独角兽估值作出机构投资判断。
            calloutType: recommendation
            claimRefs:
