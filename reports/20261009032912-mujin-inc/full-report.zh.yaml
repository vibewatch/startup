      - number: '1.2'
        title: 高管领导、治理结构与关键人物暴露
        blocks:
          - type: paragraph
            body: >-
              Mujin 的高管治理由两位联合创始人支撑：CEO Ross Diankov 在 Carnegie Mellon University 攻读博士期间创建了 OpenRAVE 开源运动规划框架；代表董事 Issei
              Takino 此前在 Berkshire Hathaway 旗下 Iscar 积累了工业销售和工装经验。Diankov 的运动规划架构与 Takino
              的生产工程洞察构成公司的竞争差异化基础，也使公司明显依赖两位创始人。2019 年 2 月，Takino 和 Diankov 通过管理层收购（MBO）收购早期风险投资人 University of Tokyo
              Edge Capital（UTEC）持有的全部股权，交易由 7.5 billion JPY 银行授信支持，刻意集中创始人控制权。为固化区域运营并扩大分销，Mujin 通过任命北美和欧洲区域负责人、在 Mujin
              Japan 设立专业咨询部门以及与全球系统集成商合作来加强管理层梯队。
