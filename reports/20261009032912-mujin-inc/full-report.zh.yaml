              Mujin 虽宣传 Uniqlo、JD.com、Paltac 等知名客户并累计融资 $411 million，但集团对经审计的合并收入、毛利率结构、软件订阅 ARR
              和单元流失率仍完全不透明。依赖部分子公司数据（例如 Mujin Japan 2024 年收入 3.6B JPY）可能在正式获得 IPO 前数据室权限前，误导对集团总现金消耗和运营利润率可持续性的判断。
