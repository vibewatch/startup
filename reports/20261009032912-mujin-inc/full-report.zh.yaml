        blocks:
          - type: paragraph
            body: >-
              Mujin 的客户基础覆盖高吞吐分销、电商零售物流、消费包装品（CPG）、汽车零部件制造和药品批发。在这些行业中，Mujin
              面向运营高管和物流工程负责人，他们承受严重人工短缺、工效学伤害和仓库工资上涨压力。不同于消费软件或轻量 SaaS 平台，工业自动化销售需要高额资本承诺，并深度嵌入设施工作流。在成熟的日本国内业务中，Mujin
              同时是直接解决方案提供商和智能技术伙伴，直接为 Fast Retailing、PALTAC 和 JD.com 等大企业提供自动码垛、件拣选和 AGV 车队协调。在北美和欧洲，Mujin 通过把 GTM
              分为直接战略客户以及认证机器人系统集成商（RSI）和物料搬运集成商（MHI）生态，加速客户获取。这样，Mujin 可将核心工程集中在 MujinOS、运动规划算法和 TruckBot
              等标准化硬件单元，棕地安装、电气安全和实体工作单元调试则由外部集成商负责。
