      - number: '3.2'
        title: 能力、分销与切换经济性
        blocks:
          - type: paragraph
            body: >-
              来源所称 Mujin 最明显的差异在于覆盖广度：无代码系统通过实时数字孪生连接工业机器人、自动导引车、仓储、视觉和仓库执行。2023 年一位公司代表还称，控制器可以为机器人系统翻译 WMS、WES 和 MES
              信息。该能力降低了分别集成各子系统的工程负担；硬件独立性也可能让客户保留多个机器人品牌，而不被锁定在单一机械臂供应商。分销并非完全直销。2025 年合作伙伴公告列出八家北美集成商，并说明 Mujin
              提供培训和持续技术支持。该模式能扩大实施能力，但也让部署质量、销售优先级和客户触达部分依赖合作伙伴。公开证据没有量化再认证成本、停机时间、续约行为或多归属，因此切换成本强度仍是尽调假设，而非已确立的护城河。
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
