  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可服务类别与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              工业自动化市场正从固定序列的硬件操作，结构性转向软件定义、无需示教的实体人工智能。过去，工业机器人支出主要用于购买 FANUC、Yaskawa、ABB 和 KUKA
              等机械臂等重型硬件，并配套定制工程服务。传统部署要求人工示教，机器人动作还要在刚性的文本控制板上逐步编程。Mujin
              将市场边界定义在智能机器人控制器软件、实时数字孪生编排和多设备感知，而非标准机械臂制造。其可服务领域覆盖智能仓库自动化、物流拣选、码垛、拆垛和工厂物料搬运。现状替代方案包括人工、传统单用途输送机、固定分拣基础设施，以及把客户锁定在单一供应商环境中的
              OEM 专有示教器。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模口径、TAM/SAM/SOM 边界与细分预测
        blocks:
          - type: paragraph
            body: >-
              要估算 Mujin 的可服务市场，先把广义工业自动化与专门机器人应用分开。第三方分析师估计显示，Mujin 聚焦的特定物料搬运流程正在快速扩张。Research and Markets 估计，全球码垛机器人市场在
              2022 至 2027 年间可能增加 $1.7 billion，复合年增长率（CAGR）为 6.71%；Fact.MR 预计到 2033 年市场达到 $10.1 billion，CAGR 为
              9.4%。在更广的工厂和仓库市场，零售、消费包装品（CPG）、电商和第三方物流（3PL）的企业需求激增，推动市场扩张。然而，把自动化潜力外推到数百 trillion yen
              的非上市公司估值和供应商演示，反映的是不受约束的理论上限，而非可服务的地址预算。实际可服务支出会受棕地设施布局、仓库执行系统（WES）兼容性和认证系统集成商供给限制。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
