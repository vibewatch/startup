  - id: FP001
    title: 受证据约束的竞争定位图
    type: quadrant
    summary: 序数型原型定位比较跨厂商广度与编排范围；并非经过测量的厂商基准。
    data:
      xAxis:
        label: 跨厂商广度（1=单一技术栈，3=多厂商）
        min: 1
        max: 3
      yAxis:
        label: 编排范围（1=任务，3=站点）
        min: 1
        max: 3
      points:
        - label: Mujin / MujinOS
          x: 3
          'y': 3
          detail: 公司自称的多厂商控制能力，覆盖机器人、移动、仓储、视觉与 WES。
        - label: OEM 原生控制
          x: 1
          'y': 1
          detail: 该原型定位反映以设备制造商为中心的控制；当前 OEM 软件未进行基准比较。
        - label: 集成商主导项目
          x: 3
          'y': 3
          detail: 项目范围可以覆盖整个站点并涉及多个厂商，但结果取决于所选实施方案。
        - label: 内部工程
          x: 2
          'y': 2
          detail: 买方定制集成可跨越多个系统，广度与范围取决于内部能力。
        - label: 任务专用工作单元
          x: 2
          'y': 1
          detail: 该原型解决边界明确的工作流，而非建立站点运营层。
        - label: 手工 / 传统现状
          x: 1
          'y': 1
          detail: 基线不构成通用软件控制层。
    approximationNotes: 分数是分析师基于 1-3 量表编制的序数型原型分类，不代表实测性能、市场份额或厂商质量。只有 Mujin 的定位使用了指定产品证据；其他定位均需尽调。
    claimRefs:
      - CP010
      - CP013
      - CP014
      - CP015
  - id: FI001
    title: 受证据约束的收入与毛利桥
    type: flow
    summary: 运营流程清晰可见，但价格、确认收入及毛利转化尚无公开量化数据。
    data:
      nodes:
        - id: need
          label: 客户自动化需求
          detail: 站点条件、目标工作流、设备与性能要求
        - id: scope
          label: 咨询与方案范围界定
          detail: 概念开发与需求定义；公开收费模式不可得
        - id: configure
          label: MujinOS 与应用配置
          detail: 感知、运动规划、数字孪生与编排；许可条款不可得
        - id: deploy
          label: 控制器、设备与站点部署
          detail: 与机器人及设施系统集成；硬件与人工成本不可得
        - id: operate
          label: 服务与支持
          detail: 区域团队与集成商支持部署和正常运行；合同经济性不可得
        - id: recognize
          label: 收入与毛利实现
          detail: 收入确认时点、经常性收入占比、定价与毛利率未公开披露
    approximationNotes: 仅为概念性运营流程；不含推断的价格、转化率、收入数值或利润率数值。
