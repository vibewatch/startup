      - number: '2.3'
        title: 买方分层、预算归属与集成渠道
        blocks:
          - type: paragraph
            body: >-
              智能自动化系统的采购动态因地域和运营规模而异。在日本和东亚，Fast Retailing（Uniqlo）、Paltac、JD.com
              等大型企业的管理层率先推动采用，因为它们把供应链速度和替代人工视为生死攸关的竞争优先事项。在北美，采购路径高度依赖认证机器人系统集成商（RSI）和物料搬运集成商（MHI）。制造和仓储企业很少在内部搭建自动化架构，因此
              Applied Manufacturing Technologies、Honeywell Intelligrated、Conveyco、Convergix、CRG Automation、Mesh
              Automation 和 RG Group 等系统集成商是主要商业渠道。预算通常归供应链副总裁、物流工程负责人或工厂总经理掌握，资本开支审批受回本周期和集成时间约束。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、采用约束与技术瓶颈
        blocks:
          - type: paragraph
            body: >-
              Mujin 智能机器人平台的首要宏观驱动是严重的劳动力短缺。根据 Ministry of Land, Infrastructure, Transport and Tourism 数据，日本物流劳动力估计每年减少
              1%。与此同时，日本传统工业机器人采用率仍很低（估计每 100 名工业工人仅有 1 台机器人），原因有三：不同硬件厂商的编程接口不兼容、人工示教复杂，以及难以与 3D
              视觉、扭矩传感器和动态仓库执行系统集成。Mujin 以软件为中心的方案能取消人工示教并提供多厂商互操作，但企业采用仍受高额前期资本需求、现场物理布局约束，以及多设备车队集成可能造成仓库吞吐中断的运营风险限制。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从硬件中心集成转向标准化现场 OS
            body: 工业机器人采用过去一直受 OEM 软件碎片化和定制编程高昂成本限制。Mujin 将感知、运动规划和数字孪生打包进 MujinOS，把机器人智能与机械臂制造解耦，形成可由独立系统集成商扩展的平台模式。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM010
          - type: callout
            title: 棕地自动化的资本密集度与延长销售周期
            body: 尽管劳动力短缺带来强劲需求，企业仓库自动化仍需要大量资本开支、与旧有 WMS/MES 系统复杂集成以及广泛测试。经济不确定性或合作集成商的集成延迟，可能拉长企业销售周期并推迟收入确认。
            calloutType: risk
            claimRefs:
              - CM003
              - CM011
              - CM016
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 买方替代方案与竞争边界
        blocks:
          - type: paragraph
            body: >-
              证据支持的是原型层面的市场图景，而非完整的具名供应商排名。Mujin 不制造机械臂；其平台被定位为位于 FANUC、Yaskawa Electric、Mitsubishi Electric、Kawasaki
              Heavy Industries、ABB 和 KUKA
              等制造商设备之上的智能与编排层。因此，这些制造商的原生控制栈处在竞争边界两侧：它们既提供兼容硬件，也代表控制机器人工作单元的现有路径。系统集成商同样具有双重角色。Mujin
              的北美合作伙伴名单表明集成商可以分销并实施 MujinOS，但买方也可以委托集成商主导自动化项目而不采用 Mujin。内部工程、既有 PLC/WMS/MES
              连接、特定任务工作单元和持续人工操作构成完整替代集合。已分配来源未识别或基准比较直接独立的机器人软件同业，因此表格将其规模、融资和相对能力标为未知，而非臆测。
            claimRefs:
              - CP002
