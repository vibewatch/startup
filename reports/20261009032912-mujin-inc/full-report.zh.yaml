      - number: '3.3'
        title: 商业可见度与持久性判断
        blocks:
          - type: paragraph
            body: >-
              资本和组织规模提升了 Mujin 的竞争能力，但不能证明其产品市场领先。Robotics 24/7 报道 2023 年 $85 million Series C，并称当时管理层披露全球约 300
              名员工。Automated Warehouse 后来报道 $233 million Series D 首次交割，包括 $133 million 股权和 $100 million 债务，员工超过 400
              人，累计融资 $411
              million。同一报道描述公司转向可扩展、产品驱动模式并建立认证集成商网络。但商业证据仍不完整：八个指定来源均未披露标价、许可单位、实际合同金额、折扣、直接同业价格、赢单率、续约率或部署毛利率。已募集资金不等于可用现金，员工数也不等于市场份额。因此，架构层的防御性最强，经济性层最弱；在获得客户竞争和定价数据前，投资判断应保持有条件。
