            title: 资产负债表杠杆与偿债风险
            body: >-
              Series D 首次交割以 $133 million 股权配套 $100 million 债务融资，带来不可回避的现金利息、本金摊还和契约义务。在没有经审计 EBITDA
              或经营现金流披露的情况下，仓库自动化资本开支的任何宏观放缓，都可能在 MujinOS 软件订阅达到自我维持规模前造成流动性压力。
            calloutType: risk
