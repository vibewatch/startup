            title: 固定杠杆与偿债负担
            body: Mujin 从日本金融机构获得的 $100m Series D 债务银团融资，带来了刚性的现金摊还要求。如果全球宏观逆风或北美客户采用延迟，固定偿债支出可能在软件 许可收入达到自我造血盈利前耗尽流动性股权储备。
            calloutType: risk
            claimRefs:
              - CV007
