  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、战略反论点与商业护城河
        blocks:
          - type: paragraph
            body: >-
              从投资尽调角度评估 Mujin，会看到结构性技术领先与严重财务不透明之间的鲜明对照。支持投资的论点是：Mujin 通过 MujinOS
              建立了硬件无关的机器智能平台，充当主流工业机械手的运行大脑，利用实时数字孪生和动态运动规划取消人工示教。公司与 NTT Group、Qatar Investment
              Authority（QIA）、Salesforce Ventures 和 Mitsubishi HC Capital Realty 的战略资本联盟，以及与 Accenture 的合资企业 Accenture
              Alpha Automation，验证了企业对工厂和仓库物流非人形实体人工智能的需求。反论点则是完全缺乏经审计的公开合并财务报表。Mujin
              从未公开披露集团合并收入、年度经常性收入（ARR）、毛利率或现金消耗，现有披露仅限于 Mujin Japan 等子公司的申报数据，例如 FY2024 收入 3.6 billion
              JPY（$23-25M）。此外，客户集中度、新生的软件订阅转型，以及新成立的北美系统集成商渠道中的执行摩擦，都会带来显著运营和商业化障碍。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
