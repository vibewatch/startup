figures:
  - id: "FU001"
    title: "Mujin Enterprise Customer Journey and Partner Expansion Map"
    type: "journey-map"
    summary: "Visual mapping of customer adoption stages from initial site consulting to certified integrator multi-site fleet expansion."
    data:
      nodes:
        - label: "1. Site Assessment & Consulting"
          detail: "Mujin Japan or regional consulting teams analyze client warehouse bottlenecks, SKU dimensions, and WMS integration points."
        - label: "2. Digital Twin Workcell Simulation"
          detail: "MujinOS constructs a virtual digital twin of the cell to simulate collision-free kinematic trajectories and verify throughput."
        - label: "3. Integrator Solution Engineering"
          detail: "Certified RSI/MHI partners (e.g. Honeywell, AMT, Conveyco) engineer physical cell layouts, safety guarding, and conveyor feeds."
        - label: "4. No-Code Commissioning & Go-Live"
          detail: "Pre-calibrated Mujin Controller connects to OEM robot arms (Fanuc, Yaskawa, ABB) enabling teachless operation on day one."
        - label: "5. Production Ramp & Real-Time Orchestration"
          detail: "MujinOS dynamically coordinates multi-SKU palletizing, picking, and AGV transit, updating motion plans as parcel shapes shift."
        - label: "6. Facility Fleet Scaling & Software Updates"
          detail: "Enterprises scale automation across sister facilities via standardized partner playbooks and continuous MujinOS updates."
    approximationNotes: "Journey stages model the operational workflow from initial engineering evaluation to multi-site enterprise fleet rollout under Mujin's certified integrator delivery architecture."
