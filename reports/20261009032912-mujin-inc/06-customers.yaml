company:
  name: "Mujin, Inc."
chapter:
  number: 6
  title: "Customers"
  summary: "Mujin has deployed over 2,000 intelligent robotic systems globally across marquee Asian enterprises including UNIQLO (Fast Retailing), JD.com, PALTAC, and Fancl. To scale its North American footprint and alleviate high-touch deployment bottlenecks, Mujin launched an automation partner program in August 2025 onboarding eight robotics and material handling integrators including Honeywell Intelligrated, Conveyco, and AMT. Despite massive capital backing and proven production use cases, customer cohort retention rates, NRR, and quantitative churn metrics remain entirely undisclosed."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Customer Base Segmentation and Target Workflows"
    body: "Mujin's customer base spans high-volume distribution, e-commerce retail logistics, consumer packaged goods (CPG), automotive parts manufacturing, and pharmaceutical wholesale. Across these sectors, Mujin targets operations executives and logistics engineering heads burdened by severe manual labor shortages, ergonomic injuries, and rising warehouse wage rates. Unlike consumer software or lightweight SaaS platforms, industrial automation sales require high capital commitments and deep operational integration into facility workflows. In its mature Japanese domestic business, Mujin operates both as a direct solutions provider and an intelligent technology partner, delivering automated palletizing, piece picking, and AGV fleet coordination directly to major corporations such as Fast Retailing, PALTAC, and JD.com. In North America and Europe, Mujin is accelerating customer acquisition by segmenting its go-to-market motion between direct strategic accounts and a certified ecosystem of robotics system integrators (RSIs) and material handling integrators (MHIs). This segmentation allows Mujin to focus core engineering on MujinOS, motion-planning algorithms, and standardized hardware units like TruckBot, while external integrators manage brownfield installation, electrical safety, and physical cell commissioning."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-scale"
    title: "Adoption Trajectory, Operating Footprint, and Field Scale"
    body: "Mujin's operating trajectory demonstrates a transition from specialized early-stage robotic workcells toward widespread industrial infrastructure adoption. Industry disclosures and company reports confirm that MujinOS has powered thousands of robotic systems globally, with over 2,000 successful implementations spanning industrial manufacturing facilities and distribution centers. Rather than remaining in experimental proof-of-concept (PoC) stages, these installations operate in daily production lines for leading global enterprises. Following an $85 million Series C financing round in 2023, Mujin expanded its U.S. presence from its North American headquarters in Suwanee, Georgia, growing its U.S. workforce to approximately 60 employees out of a global headcount of over 300 to 450 personnel across Japan, North America, Europe, and China. In December 2025, Mujin closed the first tranche of its Series D round totaling $233 million (36.4 billion yen), with NTT Group and the Qatar Investment Authority acting as co-lead investors. Company executives have articulated that Series D proceeds are dedicated to shifting from bespoke site-by-site engineering toward standardized, scalable MujinOS products, expanding certified integrator networks, and driving operational expansion across Western markets ahead of an anticipated initial public offering by 2030."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-evidence-and-ecosystem-durability"
    title: "Named Customer Proof, Retention Gaps, and Concentration Risk"
    body: "Publicly verified customer references provide concrete evidence of Mujin's production capabilities in demanding logistics and supply chain environments. Fast Retailing established a global strategic partnership with Mujin in November 2019 to automate picking operations across UNIQLO distribution warehouses, specifically addressing the complex manipulation of flexible apparel items. Similarly, e-commerce giant JD.com deployed Mujin intelligent picking and controller technology within its highly automated fulfillment centers in China, while major Japanese cosmetics firm Fancl and consumer goods wholesaler PALTAC integrated Mujin robotics into primary logistics hubs. In August 2025, Mujin formalized a strategic North American partner program onboarding an initial cohort of eight automation integrators: robotics system integrators Applied Manufacturing Technologies (AMT), Convergix, CRG Automation, Mesh Automation, and RG Group, alongside material handling leaders C&B Material Handling, Conveyco, and Honeywell Intelligrated. However, significant diligence gaps persist: customer-level net revenue retention (NRR), gross revenue retention (GRR), exact annual churn rates, and individual customer revenue concentration percentages remain closely held private company secrets. Furthermore, heavy reliance on large enterprise contracts and emerging channel integrators introduces channel execution exposure if partner onboarding lags."
    claimRefs:
