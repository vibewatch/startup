callouts:
  - calloutType: "insight"
    title: "Subscription Transition De-risks Customer Adoption but Shifts Working Capital"
    body: "Mujin's April 2026 launch of a recurring subscription model for MujinOS Single SKU Palletizing shifts robotics software procurement from capital expenditure to operating expenditure. While lowering upfront friction for warehouse operators and ensuring continuous software upgrades, it requires Mujin to build dedicated customer support portals and proactive field engineering operations."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
  - calloutType: "risk"
    title: "Dependency on Hardware Vendor Openness and Integrator Execution"
    body: "Mujin's hardware-agnostic value proposition relies on industrial robot OEMs keeping their controller protocols accessible. Furthermore, scaling North American deployments depends heavily on third-party automation integrators successfully commissioning cells without requiring high-touch intervention from Mujin's engineering staff."
    claimRefs:
      - "CE006"
      - "CE014"
      - "CE016"
