chapter:
  number: 5
  title: "Product & Technology"
  summary: "Mujin provides MujinOS, an intelligent operating system combining perception, real-time digital twins, and autonomous motion planning to power industrial robot arms, mobile units, and entire facilities without manual robot teaching. In April 2026, Mujin introduced a software subscription model for Single SKU Palletizing, marking an architectural transition from one-off capital deployment to recurring managed automation software."
sections:
  - id: "product-definition-and-operating-model"
    title: "Product Definition and Customer Workflow"
    body: "Mujin develops and commercializes MujinOS and the Mujin Controller, an intelligent operating system designed to automate industrial robotics across logistics, manufacturing, and supply chain operations. In traditional robotic automation, each industrial robot requires tedious manual teaching, specialized robotic programming, and fixed cell layouts that break whenever SKU dimensions or palletizing patterns vary. MujinOS transforms this workflow by combining real-time perception, motion planning, and machine intelligence (MujinMI) into an integrated control layer that operates directly within brownfield and greenfield distribution centers. Rather than programming fixed coordinate paths, warehouse operators configure palletizing, depalletizing, bin picking, and mobile fleet automation through no-code graphical interfaces. At the core of the system is a continuously synchronized real-time digital twin that tracks physical inventory, robot kinematic constraints, and environmental changes, enabling robots to dynamically adapt to unexpected parcel orientations and unstructured logistics challenges."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE002"
  - id: "architecture-and-technical-stack"
    title: "System Architecture, Middleware, and Digital Twin Infrastructure"
    body: "The Mujin technical architecture is structured into four functional layers spanning physical interfaces, dynamic digital twins, autonomous motion planning, and high-level enterprise execution. At the base layer, the Mujin Controller communicates with industrial robot arms (including Fanuc, Yaskawa, ABB, and KUKA) and industrial sensors through vendor-opened core control protocols, while vision systems capture high-resolution 3D point clouds. Above the hardware layer, the digital twin continuously models physical geometry, collision envelopes, and cell kinematics. The MujinMI intelligence engine applies real-time obstacle avoidance, dynamic path optimization, and grasp planning without requiring human intervention. Enterprise warehouse execution systems (WES) and manufacturing execution systems (MES) interface with the Mujin Controller via standardized APIs to communicate order fulfillment and SKU manifests. Engineering job postings for documentation engineers and technical writers confirm that Mujin is actively strengthening its plugin architecture, Docs-as-Code tooling, and SDKs to support external developers and certified system integrators."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "modules-subscription-and-gtm-integration"
    title: "Application Portfolio, Subscription Evolution, and Integrator Ecosystem"
    body: "Mujin's commercial software application portfolio spans discrete material handling workflows including Single SKU Palletizing, mixed-case palletizing, depalletizing, bin picking, truck unloading (TruckBot), and mobile robot (AGV/AMR) fleet coordination. Historically sold as capital-intensive automation equipment bundled with perpetual software licensing, Mujin announced in April 2026 a strategic shift toward a recurring software subscription model for MujinOS. Initially launched for Single SKU Palletizing with Standard and Premium support tiers, the subscription program provides continuous software upgrades, algorithmic vision improvements, customer portal dashboards, and field engineering monitoring. To scale delivery across North America and Europe, Mujin launched a formal partner program with automation integrators including Honeywell Intelligrated, Applied Manufacturing Technologies, Convergix, and Conveyco, delegating physical commissioning while retaining recurring software platform value."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE001"
