companyProfile:
  summary: >-
    Mujin is a Tokyo-based robotics software company founded in 2011 by Ross Diankov and Issei Takino. Its flagship
    MujinOS platform provides hardware-agnostic motion planning, digital-twin orchestration, and industrial controller
    software for warehouses and factories, while partner programs and consulting services support deployment across
    Japan, North America, Europe, and China. The company has raised substantial capital and expanded to 400+ employees,
    but it still does not disclose consolidated revenue, ARR, or margin data.
