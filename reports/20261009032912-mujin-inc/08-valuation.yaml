      - "CV006"
      - "CV007"
      - "CV012"
  - id: "TV003"
    title: "Scenario Analysis: Bull, Base, and Bear Underwriting Cases"
    columns:
      - "Scenario Case"
      - "Probability Weighting"
      - "Operating & Commercial Assumptions"
      - "Implied Valuation Logic (2030 Horizon)"
      - "Downside Triggers & Kill Signals"
    rows:
      - - "Bull Case"
        - "25%"
        - "MujinOS subscription ARR inflects; North American integrators scale rapidly; NTT alliance yields massive computing synergy."
        - "$2.5B - $3.5B (successful New York or Tokyo IPO driven by high-margin software multiple >10x ARR)."
        - "Integrator channel conflict, prolonged commissioning cycles, or emergence of superior end-to-end foundation models."
      - - "Base Case"
        - "50%"
        - "Steady expansion in Japan and Asia; moderate North American adoption; hybrid revenue mix of software, hardware, and engineering."
        - "$1.0B - $1.5B (modest growth multiple 3x-5x on hybrid revenue; eventual Tokyo domestic exchange listing)."
        - "Inability to de-link revenue from headcount expansion, resulting in stagnant operating margins around 10-15%."
      - - "Bear Case"
        - "25%"
        - "US customer conversion stalls; bespoke engineering costs persist; $100M debt burden forces distressed refinancing or recapitalization."
        - "Below $600M (down-round valuation compression, secondary share illiquidity, or distressed trade sale)."
        - "Debt covenant default, key-person departure of Diankov or Takino, or severe commercial customer churn."
    notes: "Scenario probabilities and implied valuation horizons reflect analyst underwriting models. Valuation figures represent target exit horizons by 2030."
