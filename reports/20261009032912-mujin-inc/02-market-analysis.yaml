callouts:
  - calloutType: "insight"
    title: "Shift from Hardware-Centric Integration to Standardized Field OS"
    body: "Industrial robotics adoption has historically been limited by fragmented OEM software and the prohibitive cost of custom programming. By packaging perception, motion planning, and digital twins into MujinOS, Mujin decouples robot intelligence from hardware arm manufacturing, creating a platform model that can scale through independent systems integrators."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM010"
  - calloutType: "risk"
    title: "Capital Intensity and Extended Sales Cycles in Brownfield Automation"
    body: "Despite intense demand driven by labor shortages, enterprise warehouse automation requires substantial capital expenditure, complex integration with legacy WMS/MES systems, and extensive testing. Economic uncertainty or integration delays at partner integrators can lengthen enterprise sales cycles and delay revenue realization."
    claimRefs:
      - "CM003"
      - "CM011"
      - "CM016"
