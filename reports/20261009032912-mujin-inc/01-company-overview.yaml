company:
  name: "Mujin, Inc."
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2011 in Tokyo by Ross Diankov and Issei Takino, Mujin develops hardware-agnostic machine-intelligence software, digital-twin orchestration, and industrial controllers under its flagship MujinOS platform. The company has raised $411 million in cumulative capital through its Series D first close to scale global warehouse and factory automation across Japan, North America, and Europe while maintaining financial opacity around valuation and revenue."
sections:
  - id: "identity-and-founding"
    title: "Company Identity, Commercial Stage, and Business Model"
    body: "Mujin, Inc. is a robotics platform developer founded on July 6, 2011, by Carnegie Mellon University robotics researcher Rosen (Ross) Diankov and industrial sales engineer Issei Takino. Operating from dual headquarters in Tokyo, Japan, and Atlanta (Suwanee), Georgia, Mujin specializes in non-humanoid physical artificial intelligence designed to automate logistics and manufacturing environments. Rather than manufacturing physical robot arms, Mujin develops machine intelligence software, proprietary 3D vision perception systems, robot hands, QR grid automated guided vehicles (AGVs), and industrial controllers that interface with hardware from major original equipment manufacturers including ABB, Fanuc, KUKA, Yaskawa, Kawasaki, and Mitsubishi Electric. The company's flagship platform, MujinOS, functions as an operational execution architecture that integrates robot motion planning, real-time digital twins, warehouse execution systems (WES), and fleet management without manual teaching or custom robot coding. Entering a commercial expansion phase following its December 2025 Series D financing, Mujin is pivoting from custom system-by-system engineering integration toward standardized, productized automation workcells and software subscriptions distributed through certified system integrator networks."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "governance-and-leadership"
    title: "Executive Leadership, Governance Structure, and Key-Person Exposure"
    body: "Mujin's executive governance is anchored by its two co-founders: CEO Ross Diankov, who created the open-source OpenRAVE motion-planning framework during his doctoral work at Carnegie Mellon University, and Representative Director Issei Takino, who previously built industrial sales and tooling expertise at Berkshire Hathaway subsidiary Iscar. The technical and commercial division between Diankov's motion-planning architecture and Takino's production engineering insight constitutes the foundation of the firm's competitive differentiation, creating notable key-person dependence on both founders. In February 2019, Takino and Diankov executed a management buyout (MBO) by acquiring all equity held by early venture investor University of Tokyo Edge Capital (UTEC), backed by a 7.5 billion JPY bank credit facility, deliberately consolidating founder control. To institutionalize regional operations and expand distribution, Mujin has broadened executive depth by appointing regional leadership in North America and Europe, establishing a specialized consulting arm at Mujin Japan, and partnering with global systems integrators."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization History, Investor Base, and Debt Financing"
    body: "Mujin has secured $411 million in cumulative capital through equity rounds, debt financing, and credit facilities since its 2011 inception. After early venture backing from UTEC and JAFCO between 2012 and 2014, the company operated without primary venture equity for nine years until its September 2023 Series C round, which raised $85 million led by SBI Investment with participation from Pegasus Tech Ventures, Accenture, and Toyota research executive Dr. James Kuffner, later expanded by a $18 million (2.7 billion JPY) extension in December 2023. In December 2025, Mujin concluded the first close of its Series D round, securing $233 million comprising $133 million in equity co-led by NTT Group and Qatar Investment Authority (QIA), alongside Mitsubishi HC Capital Realty and Salesforce Ventures, coupled with $100 million in debt financing from major Japanese financial institutions. While Bloomberg reported in June 2026 that Mujin achieved an estimated private valuation exceeding $1 billion ahead of a targeted 2030 IPO, post-money valuation, shareholding percentages, and revenue multiples remain undisclosed by the company."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "operational-footprint-and-milestones"
    title: "Operational Scale, Strategic Alliances, and Diligence Gaps"
    body: "Mujin has scaled its operational footprint across Japan, the United States, China (Guangzhou), and the Netherlands, employing more than 400 professionals globally, including over 60 staff members at its North American facility in Suwanee, Georgia. The company's customer references in Asia include high-volume production deployments with Fast Retailing (Uniqlo), pharmaceutical wholesaler Paltac, and e-commerce platform JD.com, with Paltac reporting a 90% reduction in labor requirements and doubled palletizing throughput. In North America, Mujin launched an integrator partner program in August 2025 with systems integrators such as Honeywell Intelligrated, Conveyco, and Applied Manufacturing Technologies to accelerate MujinOS deployments across retail and consumer logistics. In January 2024, Mujin formed a joint venture with Accenture named Accenture Alpha Automation (owned 70% by Accenture and 30% by Mujin) to integrate operational robotic data with enterprise management systems. Despite commercial momentum, Mujin discloses neither consolidated group revenue, ARR, gross margins, nor customer retention cohorts, creating material diligence gaps that require private data-room verification."
    claimRefs:
      - "CO004"
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO016"
