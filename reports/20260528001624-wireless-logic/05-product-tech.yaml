    - label: "eSIM/iSIM/RSP (SGP.02/22/32)"
      values:
      - High
      - 12+ years claimed; Thales bootstrap partner; u-blox OEM integration
      - eSIM scale figures company-stated only; SGP.32 ecosystem maturity still emerging
    - label: Carrier core (Conexa)
      values:
      - High
      - GSMA-certified; launched 2022; IoT Platform of Year 2024
      - Internal core architecture not publicly documented; no published uptime SLA
    - label: "Security framework (Defend/Detect/React)"
      values:
      - Medium
      - Public 12-page brochure; Cloud Secure/IoT SAFE described; regulatory awareness confirmed
      - No ISO 27001 cert ID or SOC 2 report publicly surfaced
    - label: "Anomaly and Threat Detection (AI/ML)"
      values:
      - Medium
      - Product page and solution guide describe capability; partnership with Shield-IoT referenced
      - Detection accuracy benchmarks and false-positive rates not disclosed
    - label: Low-code platform (Kheiron)
      values:
      - Low-medium
      - Described on developer page; listed as product offering
      - Very limited public documentation; no public SDK or repository
    - label: "Satellite-cellular hybrid (Blue Wireless)"
      values:
      - Medium
      - Starlink reseller since April 2024; Blue Wireless operations in 70+ countries
      - SLA detail and Starlink integration depth not publicly specified
    - label: "North America platform (Zipit integration)"
      values:
      - Low
      - Acquisition completed August 2025; integration in progress
      - No public integration roadmap or timeline disclosed
  approximationNotes: Maturity levels are analyst estimates based on public evidence depth, not internal audits.
