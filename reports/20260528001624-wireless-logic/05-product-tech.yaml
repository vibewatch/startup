- id: platform-architecture
  title: Platform architecture and orchestration control plane
  body: |-
    The Conexa control plane differentiates Wireless Logic from pure MVNO resellers. As an independent carrier with its own GSMA-certified core network, the company controls the full stack from SIM identity (IMSI) through mobile core (HLR/HSS, GGSN/PGW), management platform (SIMPro), and security overlay. This vertical integration — compared to a reseller that merely white-labels capacity from a single MNO — allows Wireless Logic to: (a) offer multi-network failover and carrier switching without depending on an MNO's cooperation; (b) enforce SIM-level security policies such as IMEI locking, private APN/VPN, white/blacklisting; (c) provide local data breakout in-country for data sovereignty compliance; and (d) operate a 24/7 global NOC/SOC service.

    SIMPro is architected as a cloud-based SaaS platform with no software download requirement and role-based access via browser or REST API. The REST API layer allows integration of SIM management into customer IT workflows — activation, suspension, usage reporting, alerting, connectivity diagnostics, and two-way SMS management. The Kheiron IoT Suite adds a low-code development environment for customers who want to build digital twins, monitor IoT applications in real time, and connect OT/IT data streams, using pre-built device libraries and application templates.

    The DevicePro module extends monitoring beyond SIM to device layer: remote firmware OTA updates, health telemetry, configuration management. The Anomaly and Threat Detection module applies AI/ML to baseline device and network behavior, flagging deviations (unexpected connection endpoints, abnormal data volumes, zero-data anomalies) with automated isolation or countermeasure capability. Cloud Secure with IoT SAFE adds certificate management using on-SIM applets for zero-touch cloud onboarding and device identity enforcement.

    The platform was recognized as 'IoT Platform of the Year' at the 2024 Mobile Breakthrough Awards specifically for Conexa, and Wireless Logic has been named a Gartner Magic Quadrant Leader in Managed IoT Connectivity Services for the fourth consecutive year (2025 edition), the only independent MVNO in the Leaders quadrant.
