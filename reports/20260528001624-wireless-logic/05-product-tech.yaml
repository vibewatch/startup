- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Wireless Logic solution
  - Measurable benefit
  - Limitation
  rows:
  - - Deploy IoT fleet globally with single SKU
    - Source country-specific SIMs; manage multiple MNO contracts; swap SIMs physically
    - Global eSIM with RSP (SGP.02/22/32), single SKU, zero-touch OTA provisioning
    - Eliminates country-SIM SKU proliferation; reduces logistics overhead
    - eSIM module compatibility testing required; upfront cost structure can be higher than standard SIM
  - - Manage millions of SIMs from single dashboard
    - Manual per-carrier portals; disparate reporting; slow troubleshooting
    - SIMPro portal + REST API with real-time session data, usage analytics, geolocation
    - Reduces operational overhead; enables automation via API integration
    - Public SLA for SIMPro dashboard availability is not disclosed
  - - Avoid permanent roaming restrictions in regulated markets
    - SIM stuck on visitor network; risk of regulatory block; manual profile re-issue
    - Local breakout via Conexa geo-distributed core; profile swap via RSP to in-country operator
    - Regulatory compliance in-country without device replacement
    - Local operator relationships and data sovereignty guarantees vary by market; details require diligence
  - - Detect and respond to IoT security breaches
    - Manual log review; slow detection; limited automation
    - AI-driven anomaly and threat detection at mobile core (agentless) + automated isolation
    - Reduces breach dwell time; no device-side agent required
    - Detection quality benchmarks not publicly published; false-positive rate not disclosed
  - - Secure cloud onboarding and certificate management
    - Manual certificate provisioning; risk of spoofing or unauthorised access
    - Cloud Secure + IoT SAFE on-SIM applet for automated certificate issuance and rotation
    - Zero-touch onboarding; SIM-anchored device identity
    - Requires IoT SAFE-compatible SIM and cloud-side infrastructure alignment
  - - Add satellite connectivity for remote sites
    - Separate satellite provider, no cellular-satellite integration, multiple contracts
    - Blue Wireless LEO+LTE/5G hybrid managed service with Starlink reseller capability
    - Single-provider hybrid connectivity with SLA guarantees in 70+ countries
    - Starlink performance subject to SpaceX service terms; Blue Wireless integration layer adds dependency
  notes: Benefits are directional claims drawn from official materials and partner announcements; no independently audited ROI figures are available.
