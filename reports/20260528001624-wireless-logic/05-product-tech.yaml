- id: esim-rsim-global
  title: eSIM, remote SIM provisioning, and global roaming
  body: |-
    The eSIM and remote SIM provisioning (RSP) capability is the technical differentiator Wireless Logic highlights most prominently. The core value proposition is that a device manufacturer or solution provider can ship a single device SKU anywhere in the world, with an eSIM or iSIM already embedded, and then provision or swap the connectivity profile over-the-air without physically touching the hardware. This eliminates the logistics overhead of country-specific SIM SKUs and allows mid-deployment shifts in carrier or profile — useful both for entering new markets and for resolving permanent roaming restrictions (regulatory constraints that prevent a SIM registered to a foreign operator from roaming on a host network indefinitely).

    Wireless Logic's multi-IMSI capability is complementary: a single SIM carries multiple network identities, allowing rules-based automatic failover between MNOs without OTA profile swap. The on-SIM control functions detect network degradation and initiate failover to an alternative radio or core network, with the aim of zero-interruption operation for safety-critical or high-uptime deployments.

    The Thales partnership (March 2025) is a useful independent validation of platform fitness: Thales selected Wireless Logic's Conexa bootstrap profile to pre-load onto Thales Adaptive Connect eSIMs (SGP.32-based) during manufacturing, meaning Thales customers get instant global connectivity on first power-up via Wireless Logic's Conexa and roaming partner networks. Similarly, Wireless Logic's Conexa eSIM was incorporated into u-blox's SARA-R10001DE LTE Cat-1 BIS module (November 2024), with u-blox explicitly citing bundled-connectivity cost savings and single-SKU simplicity as the commercial driver.

    The company was also appointed Starlink-authorised reseller in April 2024, integrating LEO satellite connectivity with cellular for hybrid deployments in remote or challenging environments, delivered through subsidiary Blue Wireless with guaranteed SLAs in 70+ countries. This extends the addressable use cases to mining, maritime, construction, and agriculture sites where terrestrial cellular is absent.
