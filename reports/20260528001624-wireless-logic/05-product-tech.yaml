chapter:
  number: 5
  title: Product & Technology
  summary: |-
    Wireless Logic's product is built around three interlocking layers: Conexa, a GSMA-certified proprietary IoT core network launched in 2022; SIMPro, a REST-API-driven SIM and device management platform; and a security suite (IoT Security Framework, Cloud Secure, anomaly/threat detection) that together form a vertically integrated connectivity stack supporting eSIM, iSIM, multi-IMSI, and remote SIM provisioning across 750+ networks in 165+ countries. Independent analyst recognition (Gartner MQ Leader for fourth consecutive year in 2025, IoT Platform of the Year 2024 Mobile Breakthrough, Overall IoT Company of the Year IoT Breakthrough Awards 2025 and 2026) and major OEM/SIM-vendor partnerships (Thales, u-blox, STMicroelectronics) corroborate platform maturity. The main diligence gaps are public SLA/uptime data, certification pack detail, internal architecture depth, and whether platform integration cohesion from ten-plus acquisitions has been fully realised.
sections:
- id: product-definition
  title: Product definition and connectivity stack
  body: |-
    Wireless Logic's primary customer proposition is end-to-end managed IoT connectivity: it sources SIM/eSIM cards, provides its own carrier-grade core network (Conexa), operates a SIM and device management platform (SIMPro), and wraps those layers in security and application services. The result is a single-provider stack that an enterprise IoT deployer uses from factory provisioning through in-field lifecycle management, without having to contract separately with each mobile network operator in each country.

    Conexa, launched March 2022, is the company's defining platform asset. It is GSMA-certified, described as a "carrier-grade mobile network built specifically for the IoT" and operates as an independent carrier, aggregating radio access from 50+ direct MNO partners and reach into 750+ networks across 165+ countries. Conexa's architecture includes geo-distributed mobile core nodes, local breakout capability for data-sovereignty compliance, and dual-redundant core with automatic failover designed for mission-critical uptime. The platform supports all major cellular bearers: 4G/LTE, LTE-M, NB-IoT, Cat-1 BIS, 5G, and LPWAN, plus satellite (via Starlink reseller agreement and Blue Wireless subsidiary for LEO-hybrid deployments).

    On the SIM form-factor side, Wireless Logic supports the full matrix: standard SIM (2FF/3FF/4FF), MFF2, embedded eSIM (eUICC), and iSIM. Crucially, it supports all three GSMA remote SIM provisioning standards — SGP.02, SGP.22, and SGP.32 — the last being the newest standard enabling seamless profile switching for large-scale IoT. The company claims 4 million physical eSIMs deployed globally, 12+ years of eSIM experience, and deployment across 2 million global business applications. These figures are company-stated and unaudited externally.

    SIMPro is the management layer surfaced to customers. It is a web-based portal plus REST API that provides SIM activation/suspension/termination, real-time session visibility, usage analytics, geolocation, anomaly alerting, bulk operations, and role-based access. Integration with DevicePro extends management to device firmware OTA and health telemetry. The platform is available to all SIM subscribers with no software download required; REST APIs allow integration into customer IT/ERP/CRM systems.
