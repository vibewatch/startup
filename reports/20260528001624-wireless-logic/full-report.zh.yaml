  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已验证融资背景与价格纪律
        blocks:
          - type: paragraph
            body: >-
              2025 年两起重大融资事件锚定 Wireless Logic 当前估值。2025 年 5 月，General Atlantic 通过其 BeyondNetZero 气候成长股权基金，以确认交易估值 £3.5
              billion（$4.6 billion）取得少数股权。Montagu Private Equity 仍是多数股东，并与 General Atlantic 一同再投资。交易需满足惯常交割条件，预计于 2025 年
              Q3 完成。六个月后，2025 年 11 月，Montagu 关闭 €2 billion（$2.3 billion）单一资产延续基金（SACV）——市场参与者称其为当年欧洲完成的最大 SACV——由 TPG GP
              Solutions 担任牵头投资人，CVC Secondary Partners 和 Partners Group 担任联合牵头。该工具被描述为大幅超额认购，并重申 £3.5 billion
              估值标记。Montagu 正执行罕见的“CV-squared”结构，把其在上一只延续基金中的权益滚入这个新工具。

              支撑这些交易的财务数据来自 Companies House 文件。Wireless Logic Group Limited（公司编号 07033895）于 2025 年 1 月提交截至 2024 年 4 月 30
              日年度的合并账目，并于 2025 年 12 月提交截至 2025 年 4 月 30 日年度的合并账目。2024 年 4 月文件确认，Blue Holdco（母集团）收入为 £256.7 million、基础
              EBITDA 为 £102.3 million，并在计入 £141 million 并购相关费用后录得 £222.3 million 税前亏损。CEO Oliver Tucker 确认该期收入和利润同比增长
              20%。Montagu 的 Ed Shuckburgh 后来称，截至 2025 年 11 月，业务年增长“约 30%”。

              估值算术很直接。以 £3.5 billion 和已确认 FY2024 收入 £256.7 million 计算，隐含收入倍数为 13.6x。按 20% 增长估算 FY2025 收入（£308
              million），倍数为 11.4x；按 30% 增长（£334 million）则为 10.5x。第三方分析师估计 FY2024 收入为 £467 million，对应 7.5x 倍数，但这一数字未由
              Companies House 文件验证，可能代表纳入 M&A 管线的前瞻或运行率估计。基于已确认数字的基础 EBITDA 倍数约 34x——即便对高增长 SaaS
              资产也偏高。关键估值锚是超额认购的延续基金：审阅了 Montagu 保密资料的机构二级买方仍然完成交易，构成对大致该估值标记的独立第三方验证。官方 FY2025 集团收入将是关键核验关口。
