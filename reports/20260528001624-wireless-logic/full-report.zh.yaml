        - 要求提供前 10 大客户 / 合作伙伴收入占比；评估排他或最低用量条款
      - - 客户收入集中
        - 未披露 Herfindahl 指数或头部客户收入占比；Montagu 将客户多元化列为优先事项
        - 未知，但可能具有实质性影响
        - 取得前 10 大客户收入占总收入比例；评估最大账户的断崖式流失风险
      - - 竞争性双供应
        - Kaleido 调查：42% 将多供应商关系列为挑战；Transforma 指出没有单一最佳 CSP——Vodafone、Eseye、KORE 是关键垂直的替代方案
