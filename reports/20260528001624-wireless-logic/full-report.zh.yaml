    title: 监管 / 法律风险登记表
    layout: wide
    enumerationScope:
      coverage: partial
      basis: >-
        Major UK and EU-level regulations, national data-localisation regimes, and identifiedlegal exposures affecting
        Wireless Logic's IoT MVNO and platform operations, identified from publicregulatory, legal, and industry sources
        as of May 2026. Undisclosed regulator correspondence,in-market subsidiary obligations, or private settlements
