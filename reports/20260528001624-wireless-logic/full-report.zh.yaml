  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: 从市场验证、财务规模、估值溢价和关键风险，推导出 Wireless Logic 在 £3.5 billion 估值下的最终“继续研究”建议。
    data:
      nodes:
        - id: market
          label: IoT 市场顺风
          detail: 2025 年联网设备 21.1B；蜂窝 IoT 同比增长 16%
        - id: proof
          label: 运营验证
          detail: Gartner MQ 领导者 4 年；25K 客户；自 2018 年以来收入 6x
        - id: price
          label: 入场价格
          detail: £3.5B 估值 = 已确认收入 10–14x；底层 EBITDA 34x
        - id: comps
          label: 可比公司差距
          detail: KORE 2.5x 收入；私营 SaaS 中位数 4.8x；公开市场中位数 6–7x
        - id: gaps
          label: 证据缺口
          detail: FY2025 收入未确认；杠杆未披露；NRR 未公开
        - id: rec
          label: 继续研究 / 观察
          detail: 若 FY2025 收入 ≥£380M、NRR >110%、杠杆 ≤4x，则升级为买入
      edges:
        - from: market
          to: proof
          label: 支撑
        - from: proof
          to: price
          label: 定价于
        - from: comps
          to: price
          label: 对标
        - from: price
          to: gaps
          label: 引出
        - from: gaps
          to: rec
          label: 决定
        - from: comps
          to: rec
          label: 约束
    claimRefs:
      - CV001
      - CV017
      - CV042
      - CV051
