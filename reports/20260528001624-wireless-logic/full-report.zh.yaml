        title: 客户基础、细分与地理分布
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的付费客户覆盖 13 个具名行业垂直——农业、消费设备、能源、环境、医疗健康、工业与制造、物流、公共部门、零售、安全、智能建筑、智慧城市和交通——通过企业直销、OEM
              嵌入和系统集成商渠道服务 165 个国家。买方几乎总是需要为分布式 IoT 资产提供始终在线、SIM 管理、私有 APN 连接的企业 IT、运营或工程团队；使用者是设备或设备群运营方；付款方是基于
              Wireless Logic SIM 资产构建产品的企业或 OEM。披露客户数从 2018 年 Montagu 收购期约 6500 个引用客户，增长到 2025 年 11 月的 25,000+ 家企业，意味着
              Montagu 持有期间不同客户关系大约扩大了四倍。Nordic Semiconductor 合作伙伴资料、IoT Insider 和 Montagu 延续基金公告分别独立确认了 25,000+
              家企业数字，期内设备数超过 1400–1800 万。从地理看，公开案例包偏重英国和北欧，西班牙、丹麦、拉美（通过 Arqia）以及全球漫游部署有新兴证据。组合里同时出现 SME、中型市场 OEM
