        - 确认 SIMPro 是否作为独立 SaaS 销售，还是始终打包
      - - 托管服务附加项
        - 设备管理、eSIM 配置、安全分析、异常检测
        - 按服务 / 按设备，或固定服务费
        - 定性 — 官网有描述；未披露收入拆分
        - 中 — 有潜在增购利润率，但无贡献数据
        - 量化托管服务收入占比和毛利率，并与通信流量对比
      - - MVNO 通信流量转售
        - 从 53 家 MNO 合作伙伴批发采购通信流量，再加价转售
        - 按 MB/GB 变动的销货成本
        - 嵌在订阅 ARPU 中；未披露独立通信流量利润率
        - 低 — 通信流量商品化；Analysys Mason 预计 ARPU 到 2032 年降至 $0.30
        - 披露通信流量成本占订阅收入比例及趋势
      - - 专业服务 / 上线导入
        - 大型企业部署的实施、集成和 SIM 物流
        - 按项目或按工时材料
        - 定性 — 列为产品服务；无收入归因
        - 低 — 通常低毛利；用于先落地再扩张
        - 确认专业服务单独收费还是被吸收
      - - 地域扩张收入（新兴市场）
        - 收购后来自 Arqia（巴西）和 Webbing（美国 / 以色列）的收入
        - 每 SIM / 每月 — 本地资费
        - Arqia 增加约 3M 连接；未单独披露收入贡献
        - 中 — 有增长可选性；汇率和监管敞口未量化
        - 披露 Arqia 收入运行率和 R$200M 投资支取计划
