      - number: '1.3'
        title: 所有权历史与投资人图谱
        blocks:
          - type: paragraph
            body: >-
              自 2002 年以来，Wireless Logic 经历四个私募股权所有权阶段，每次转换估值都显著抬高。Peter Jones 的 Phones International Group 于 2002
              年收购公司；2011 年，联合创始人 Oliver Tucker 和 Philip Cole 在 ECI Partners 支持下以 £35 million 买回公司。CVC Capital Partners 于
              February 2015 完成约 £255 million 二级买断，期间 ECI 披露其 Arkessa 投资回报为 210%（ECI 同期也支持了 Wireless Logic 本身）。Montagu
              Private Equity 于 June 2018 在 CVC 退出时投资，金额未披露，由此开启公司历史上收购最密集的阶段。


              May 2025，Montagu 通过 General Atlantic 的 BeyondNetZero 气候增长股权基金引入其作为少数股东，估值 £3.5 billion——较 2011 年回购价格增长近
              100 倍。Montagu 同时再投资。3 November 2025，Montagu 完成 €2 billion 单一资产延续基金（SACV）募集，被描述为 2025 年欧洲完成的最大 SACV；TPG GP
              Solutions 为领投方，CVC Secondary Partners 和 Partners Group 为联合领投方。Partners Group 自 2021 年起已通过 Montagu 的 M+
              Fund 投资 Wireless Logic。


              以 April 2024 收入 £256.7 million 计算，£3.5 billion 估值意味着约 13.6x 企业价值 / 收入倍数——这一溢价与高增长 IoT
              平台公司相符，但相对传统连接转售商偏高，反映市场对 Wireless Logic 经常性收入模型、20% YoY 增长和平台差异化的信心。详细资本结构、债务水平和投资人确切持股比例均未公开披露。
