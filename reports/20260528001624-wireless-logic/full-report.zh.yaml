  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动 / 风险因素
      - 描述
      - 影响
      - 尽调路径
    rows:
      - - SIM 资产自然增长
        - 客户设备规模扩大后，单客户 SIM 数量和数据支出随之增长；无需新合同，也能在账户内继续扩张
        - 正面：无需销售成本即可带来经常性收入增长
        - 核验第 1 年 vs 第 3 年的平均客户 ARR；要求提供 ACV 扩张指标
      - - 托管服务增购
        - Conexa eSIM、SIMPro 分析、OTA 固件更新、私有 APN 向基础数据 SIM 客户增售
        - 正面：ARPU 更高，锁定更深
        - 确认收购账户 vs 自然获客账户的托管服务附着率
      - - 通过收购做地域扩张
        - Arqia（巴西，3M 连接）和此前收购打开了存在永久漫游禁令的市场
        - 正面增长杠杆；存在整合风险
        - 确认收购后 Arqia 客户群留存；检查整合后 ANATEL 合规
