      - number: '6.4'
        title: 扩张驱动、集中风险与合作伙伴渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的先落地再扩张路径有两条：随着客户设备群增长，在既有账户内加深 SIM 资产；以及把托管服务（Conexa eSIM、SIMPro 分析、私有 APN、VPN、OTA
              更新）交叉销售给最初只购买数据 SIM 的客户。巴西 Arqia 收购（300 万连接、仅有 15 张 ANATEL MVNO 牌照之一）显示，地理扩张也是实质杠杆；每新增一个境内
              MVNO，就能移除一个永久漫游障碍，并打开本地企业需求。集中度方面，公司没有按客户、垂直或地理公开披露收入结构；Montagu
              公告把“客户多元化”描述为优先投资主题，隐含承认集中风险存在。合作伙伴渠道——系统集成商、VAR、把 SIM 嵌入硬件的 OEM——是主要放量通道，成功案例组合也体现这一点（多数具名客户是 OEM
              或产品公司，而不是独立购买连接的直接企业终端用户）。Nordic Semiconductor 的 Wireless Logic 合作伙伴资料确认了 OEM / 系统集成商导向。Kaleido
              Intelligence 对 1,000 名 IoT 采用者的调查发现，42% 将管理多重连接关系列为首要挑战，这创造了采购整合机会，也带来风险：如果关键 OEM
              经销商切换平台，大块设备连接会随之迁移。Transforma Insights 将 Wireless Logic 列入 IoT 连接和 IoT 服务双 Top
              10，但指出不存在“单一最佳”CSP，意味着客户可能因具体垂直需求双源采购，或流失到 Vodafone、Eseye、KORE。
