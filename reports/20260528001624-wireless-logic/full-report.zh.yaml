      - number: '8.4'
        title: 投资建议、投资逻辑与尽调问题
        blocks:
          - type: paragraph
            body: >-
              投资建议为继续研究 / 观察。Wireless Logic 是一家可信且增长中的 IoT 连接平台，具备真实的市场领导力证据：连续四年入选 Gartner 魔力象限领导者（领导者象限中唯一独立
              MVNO）、25,000+ 家企业客户、165 个国家 1800 万+ 台连接设备、Montagu 持有期间完成 15 起并购并带来 2018 年以来收入 6x 和 EBITDA 7x
              增长，以及一只获得成熟机构二级投资人大幅超额认购的延续基金。这些都是实质优势。

              但当前价格要求接受 10–14x 收入倍数和约 34x 基础 EBITDA 倍数——这些基准高于所有公开和私有 IoT 可比公司，也显著高于所有私有 SaaS 中位数。唯一上市纯 IoT MVNO（KORE
              Wireless）以 2.5x 收入被私有化。£3.5 billion 标记中的溢价只有在以下条件成立时才站得住：(1) FY2025 收入确认 ≥£350 million；(2) 基础 EBITDA
              利润率保持或扩张（未被整合成本侵蚀）；(3) 披露净债务且杠杆率处在可管理范围；(4) 客户留存指标确认稳健。这四项条件没有任何一项能从公开来源验证。

              反向逻辑很直接：Wireless Logic FY2024 因并购驱动的摊销和整合成本产生 £222.3M 税前亏损，反映真实资本消耗。CV-squared 所有权结构——Montagu
              将其权益滚入第二只延续基金——限制 LP 流动性，并在定价上制造潜在利益冲突。CEO 已明确提醒，国际扩张所需时间是预期三倍、成本也是三倍。KORE 以 2.5x 收入出售的结果说明，缺乏强经常性 SaaS
              特征的 IoT MVNO 业务在公开市场面临结构性更低倍数。最后，2025 年 4 月财务账目已经提交但尚未公开摘要，关键收入核验关口仍然打开。

              若 FY2025 收入确认 ≥£330 million，且披露债务 / 杠杆为净债务 / EBITDA ≤4x，建议可上调至观察。若 FY2025 收入确认 ≥£380 million，且 NRR 经独立验证高于
              110%，建议可上调至买入。若 FY2025 收入低于 £290 million，或 FY2025 资产负债表出现并购整合减值，建议下调至回避。
