            body: >-
              Wireless Logic 的资本结构反映了跨三代所有权的私募股权买入并建设模式。CVC Growth Partners 于 2015 年收购公司，融资来自 £75 million Ares/GE
              Capital 融资安排，包括 £65 million unitranche 和 £10 million 营运资本额度。Montagu Private Equity 于 June 2018 以未披露对价从 CVC
              手中收购该业务，并在 June 2021 与管理层一起买断 CVC 的剩余少数股权。Montagu 旗下，公司到 November 2025 完成十五笔收购，包括 Arkessa（December 2020，超过
              1 million 个订阅）、Com4（2021）、Jola（2022）、IoThink Solutions（2022）、Mobius Networks（July 2022）、Blue
              Wireless（March 2023，第九笔收购）、Webbing（late 2023）、Arqia（April 2025，Brazil 最大 IoT MVNO，3 million 个连接）和
              Comms365（February 2026）。收购节奏显著消耗现金和融资能力：仅 FY2024 的 £141 million 收购相关费用就把法定税前亏损推至 £222.3 million。November
              2025 的 €2 billion 单一资产延续基金——由 TPG GP Solutions 领投，CVC Secondary Partners 和 Partners Group 联合领投，并获 Montagu
              背书——重置了赞助方退出窗口，并以机构级定价验证了该资产。Brazil 的 Arqia 交易包括一项计划中的 R$200 million
              对被收购业务投资；融资工具、提款时间表和回报画像均未公开披露。没有公开来源披露当前利息覆盖率、未偿优先债务规模，或新 SACV 结构下的合并净杠杆。员工数自 2018 年以来增长超过
              7×，结合收入基础，意味着每员工收入约 £342,000——这符合一家拥有显著技术杠杆的托管服务企业，但并非轻资产经济性。
