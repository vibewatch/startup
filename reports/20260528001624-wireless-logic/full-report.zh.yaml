  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 及其 IoT MVNO 同业在 2026–27 年面对一组格外密集的监管义务汇流，合规成本和潜在罚款暴露都很高。UK Product Security and
              Telecommunications Infrastructure Act 2022（PSTI）自 2024 年 4 月 29 日起生效；罚款可达 £10 million 或全球营业额 4%，由 Office
              for Product Safety and Standards 执法。EU Cyber Resilience Act 于 2024 年 12 月 10 日生效：漏洞和事件报告义务自 2026 年 9 月 11
              日适用，完整产品符合性义务自 2027 年 12 月 11 日适用，罚款最高 €15 million 或全球年营业额 2.5%。NIS2 Directive 要求重大事件在 24 小时内报告；德国是
              Wireless Logic 最大欧洲市场之一，已在 2025 年 12 月登记其 NIS2 国内法，并自 2026 年 3 月强制运营商注册。除网络安全外，Transforma Insights
              发现巴西、中国、印度和若干中东法域的数据本地化要求现在要求 IoT 数据留在国境内，直接约束 Wireless Logic 的云平台集中化模式。ICO 于 2025 年 6 月发布首份 IoT
              数据保护指南草案，涵盖数据最小化、知情同意和用户权利，增加了产品集成商的 UK GDPR 合规负担。Bratby Law 提醒，许多 IoT 平台运营商误以为自己不受英国电信监管，因为
              Communications Act 2003 的测试是功能性而非类别性。截至 2026 年 5 月，未识别出涉及 Wireless Logic
              的公开执法行动、监管罚款或诉讼，因此当前监管风险是前瞻性但重要，而非已经兑现。
