      - number: '7.4'
        title: 赞助方治理与退出风险
        blocks:
          - type: paragraph
            body: >-
              Montagu 2025 年 12 月 €2 billion CV-on-CV 延续基金——由 TPG GP Solutions 领投，CVC Secondary Partners 和 Partners
              Group 联合领投——是一次重要治理事件。延续基金把所有权拉长到典型 4–6 年 PE 基金周期之外，以协商 NAV 将既有 LP 权益滚入新工具。该结构表明 Montagu 对 Wireless Logic
              投资逻辑有信心，并偏好长期持有而不是近期 IPO 或出售给战略买家，但也降低原基金投资人的流动性选择，并随着 LP 名册变化提高治理复杂度。2025 年 5 月 General Atlantic 少数股权交易和
              2025 年 12 月延续基金隐含的 £3.5 billion 估值，相比 Blue Holdco 截至 2024 年 4 月披露的底层税前亏损，入场价格有显著溢价。Bloomberg
              将该结构描述为“CV-squared”交易，即一个延续基金的 LP 滚入第二个延续基金，这是一种罕见机制，使公司进一步远离常规 IPO 或竞价退出。董事会构成较强：Vittorio Colao（前
              Vodafone CEO、General Atlantic EMEA VP）和 Sir Michael Rake（前 BT Chairman）为公司未来 IPO 铺路，但截至 2026 年 5 月未识别到 S-1
              或已提交招股说明书。对投资人而言，风险在于延续结构压缩退出窗口，并可能出现公司被持有到下一轮延续周期，或市场条件发生根本变化后被迫出售的情景。
