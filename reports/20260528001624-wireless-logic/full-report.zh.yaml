        - 公开 SaaS EV/Revenue 中位数（Windsor Drake 2026 更新）
        - 6.0–7.0x EV/Revenue 倍数
        - 有经常性收入的增长型软件底部基准
        - SaaS 中位数包含增长更慢的公司；未反映 IoT 基础设施溢价
      - - 私有 SaaS 最高四分位
        - NRR 和增长较强的 PE 支持 SaaS 交易（SaaS Capital，2025）
        - 最高四分位 8.3x EV/Revenue；中位数 4.8x
        - 高端私有软件上限基准
        - 不包含 IoT 网络效应或国际物理基础设施
      - - IT 行业 M&A EV/EBITDA 中位数（2025）
        - PitchBook 2025 年 Q2 全球 M&A 报告
        - EV/EBITDA 中位数 13.2x
        - 技术资产的行业级 M&A 参照
        - 离散度很高；Wireless Logic 的 34x EBITDA 几乎是该中位数 3x
      - - Semtech / Sierra Wireless 收购
        - Sierra Wireless IoT 硬件 / 连接；$1B+ 交易
        - 未公开披露；按规模估计为收入 1–5x
        - 蜂窝 IoT 连接可比对象——硬件权重高于 Wireless Logic
        - 硬件主导模式压低倍数；与纯连接业务可比性有限
      - - 企业 IoT M&A 中位数（2020–2025 年 Q1）
        - 2,290 笔交易，总额 $376B（Jahani & Associates）
        - EV/EBITDA 中位数 12x；区间 1x–353x；高增长标的收入倍数 10–55x
        - 广泛的 IoT 行业 M&A 参照基底
        - 包含硬件交易；未单独隔离纯 MVNO 子赛道
    notes: >-
      倍数来自已披露交易、PitchBook 2025 年 Q2 数据、Windsor Drake 2026 SaaS 基准和 IoT Analytics 研究。Wireless Logic EBITDA
      倍数按调整后（收购成本前）EBITDA 计算；按报告亏损口径，倍数没有意义。
