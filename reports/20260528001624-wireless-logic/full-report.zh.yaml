companyProfile:
  summary: >-
    Wireless Logic 是一家英国创立的托管 IoT 连接公司，把全球 SIM 资产、自有 Conexa IoT 核心网络、SIMPro
    管理平台，以及面向企业设备集群的增值安全和设备服务组合在一起。公开证据支持一个已经规模化的平台：25,000+ 企业客户、18M+ 连接设备、覆盖 165 个国家和 750+ 个网络，以及一条长期收购记录，推动公司进入
    Brazil、North America、APAC 和相邻无线服务领域。核心投资争论不在于 Wireless Logic 是否具备战略相关性，而在于缺少 FY2025 收入、杠杆、毛利率和留存质量的更新披露时，May 2025 的
