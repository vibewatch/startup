      - number: '5.5'
        title: 差异化、路线图与技术债
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 相比纯 MVNO 经销商最清晰的差异化，是几项能力叠加：(a) 用于端到端控制的自研运营商级核心网（Conexa）；(b) 支持多标准 RSP（SGP.02/22/32）；(c)
              统一的 SIM 到应用管理栈（SIMPro → DevicePro → Kheiron → Anomaly Detection）；(d) 由并购驱动、快速扩张的地理覆盖（Arkessa、Things
              Mobile、Mobius Networks、Com4、Blue Wireless、Webbing、IoThink Solutions、Arqia、Zipit Wireless、Comms365——2020
              年以来超过十起）。Gartner 将其定位为连续四年领导者象限中唯一的独立 MVNO，是执行能力的独立信号。


              新闻和合作伙伴释放的路线图信号集中在：(i) 加速采用 SGP.32，用于受监管市场合规和生命周期管理；(ii) 通过整合 Zipit Wireless 深入北美市场（计费、与
              Verizon/AT&T/Rogers 的多运营商关系）；(iii) 借 Arqia 拓展拉美（巴西，当地最大的独立授权 MVNO）；(iv) 借 Blue Wireless 和 Starlink 协议推进卫星
              - 蜂窝混合成熟；(v) 设备队列进入 10–15 年运营周期后，用 AI 驱动生命周期管理。


              技术债和尽调担忧是结构性的。第一，把十多家被收购公司整合成连贯平台，会带来实质整合风险——公司营销材料把 SIMPro、Kheiron、DevicePro
              和安全叠加层描述为统一栈，但支持无缝互操作的独立证据有限。第二，SIMPro 和 Conexa 是闭源自研平台，除 REST API 参考外没有公开开发者文档，限制了独立安全或架构审计。第三，Trustpilot
              的反向信号（升级后 30 小时中断、服务差投诉）虽然样本很小，但让人质疑关键任务部署中的升级管理质量。第四，运营商依赖仍在：即便拥有 Conexa，Wireless Logic 的实际无线接入仍依靠 50+ 张
              MNO 无线网络，暴露在 MNO 网络变化、漫游监管调整和商业重新谈判中。第五，M2M SIM 服务商评测网站（2026 年 3 月核验）称公司管理 1400 万连接，而 2025 年 8 月 Zipit
              收购新闻稿引用的是 1800 万，说明两个数据点可能存在时点差异或聚合方法差异，尽调需要澄清。
