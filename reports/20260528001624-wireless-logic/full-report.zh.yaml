  - id: TV005
    title: 投资逻辑破裂和否决触发条件
    columns:
      - 触发条件
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - FY2025 收入低于基准
        - Companies House 合并账目显示 2025 年 4 月期间收入 <£290M
        - 确认市场无法用可防守倍数支撑 £3.5B；乐观情景坍塌
        - 下调至回避；估值存在 ≥30% 下调风险
      - - FY2025 资产负债表出现商誉减值
        - FY2025 或 FY2026 账目中 15 笔收购带来的任何商誉减记
        - 显示收购支付过高；压低股权内在价值；CV² 投资人重新定价
        - 下调至回避；追问减值资产细节
      - - 未披露杠杆显著高于 5x EBITDA
        - 2026–2027 年 IPO 招股书、贷款方披露或再融资公告显示净债务 / EBITDA >5x
        - 股权安全垫被压缩；利息负担限制投资能力；退出倍数收缩
        - 降低确信度；任何投资前都要明确建模杠杆回报
      - - 收入增速降至 15% 以下
        - 连续两个六个月期间，订阅 / 连接收入 YoY 增长 <15%
        - 运营进入平台期；IoT 连接定价商品化的逻辑开始兑现
        - 转为回避；收入倍数可能压缩至 5–7x
      - - 披露单一客户集中度 >20%
        - 尽调或公开文件显示单一客户 >20% 集团收入
        - 收入集中风险改写分散化逻辑；单一客户流失会危及公司
        - 继续研究：作出任何承诺前获取客户集中度数据
      - - CEO 继任或关键交易发起人离任
        - 宣布 Oliver Tucker 离任，但未确认继任梯队深度
        - 创始人 CEO 集中风险，尤其在执行密集型收购策略中更突出
        - 行动前先观察对管线和文化的影响
    notes: 触发条件关联研究问题 QV024–QV030。所有阈值都可通过 Companies House 文件、IPO 招股书或直接管理层尽调观察或发现。
    claimRefs:
      - CV006
      - CV009
      - CV044
      - CV045
      - CV046
      - CV047
      - CV052
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - FY2025 已确认收入
        - Blue Holdco 截至 2025 年 4 月 30 日年度的合并账目（2025 年 12 月提交至 Companies House）
        - 决定正确倍数基准是 7.5x 还是 10–14x；最关键验证关口
        - 从 Companies House 获取已提交合并账目，或直接向 Montagu/Wireless Logic IR 索取
      - - 净债务和杠杆比率
        - 2018 年 LBO 债务，加任何再融资或增量收购债务；未公开披露
        - 必须准确建模股权回报；IPO 时杠杆 >5x 会是重大风险
        - 向 Montagu 索取；与任何债券 / 贷款新闻稿或 Bloomberg DLMI 数据交叉核对
      - - 客户级 NRR 与留存队列
        - 按签约年份队列拆分订阅留存、扩张与收缩、分客群流失率
        - 溢价倍数需要 NRR >110%；否则 10x 收入倍数站不住
        - 作为管理层材料直接索取；第三方客户访谈
      - - 按收入类型拆分毛利率
        - 连接服务、托管服务、硬件毛利率拆分
        - 需要分清 SaaS 式利润率与低毛利连接转售
        - 索取经审计的分部损益表；与 Gartner Magic Quadrant 讨论交叉核对
      - - Arqia 整合状态与收入贡献
        - 收购 Arqia（2025 年 4 月）后 LATAM 收入贡献；整合成本运行率
        - Arqia 带来巴西 M2M 设备，但巴西是最复杂市场之一；CEO 已提示国际执行风险
        - 索取收购后期间的管理账；访谈 Arqia 管理层
      - - 关键人物继任计划
        - CEO Oliver Tucker 的继任梯队，以及联合创始人 Philip Cole 2019 年离职后的状态
        - 并购驱动业务存在创始人集中风险；关键人物离开会削弱交易发掘能力
        - 审查董事会构成；评估管理层梯队厚度
      - - CV² 投资者赎回权
        - €2B SACV 中 LP 转让限制、估值推翻触发条件和管理人冲突相关条款
        - CV² 结构限制未来流动性，也可能把治理冲突嵌进定价
        - 审阅有限合伙协议条款；就卢森堡 SACV 结构寻求法律顾问意见
    notes: 尽调问题按其对当前估值立场的重要性排序。第 1、2 项是从继续研究上调至观察或买入的阻断项。
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV048
      - CV049
      - CV050
      - CV051
