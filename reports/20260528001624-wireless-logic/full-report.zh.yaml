          - type: callout
            title: 尽调应聚焦已实现经济性和整合质量
            body: 要求公司提供相对既有运营商的赢单 / 输单数据、收购后服务指标、流失 / NRR，以及按部署类型拆分的价格桥接。这些缺失证明，决定 Wireless Logic 的中等护城河能否转化为高确信承销案例。
