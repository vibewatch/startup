  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与连接栈
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的核心客户主张是端到端托管 IoT 连接：它采购 SIM/eSIM 卡，提供自有运营商级核心网（Conexa），运营 SIM
              和设备管理平台（SIMPro），并在这些层之上叠加安全和应用服务。企业 IoT 部署方拿到的是单一供应商栈，从出厂配置到现场全生命周期管理都能覆盖，不必在每个国家分别与各家移动网络运营商签约。


              2022 年 3 月推出的 Conexa，是最能定义公司平台身份的资产。它通过 GSMA 认证，被描述为“专为 IoT 打造的运营商级移动网络”，并以独立运营商身份运行，聚合 50+ 直接 MNO
              合作伙伴的无线接入，覆盖 165+ 个国家的 750+ 张网络。Conexa
              架构包括地理分布式移动核心节点、支持数据主权合规的本地分流能力，以及为关键任务可用性设计的双冗余核心与自动故障切换。平台支持所有主要蜂窝承载：4G/LTE、LTE-M、NB-IoT、Cat-1 BIS、5G 和
              LPWAN，并通过 Starlink 经销商协议和 Blue Wireless 子公司支持卫星（面向 LEO 混合部署）。


              在 SIM 形态上，Wireless Logic 覆盖完整矩阵：标准 SIM（2FF/3FF/4FF）、MFF2、嵌入式 eSIM（eUICC）和 iSIM。关键在于，它支持全部三项 GSMA 远程 SIM
              配置标准——SGP.02、SGP.22 和 SGP.32；最后一项是最新标准，可让大规模 IoT 无缝切换配置文件。公司称全球已部署 400 万张实体 eSIM，拥有 12+ 年 eSIM 经验，并落地于 200
              万个全球商业应用。这些数字来自公司口径，未经外部审计。


              SIMPro 是面向客户呈现的管理层。它由网页门户和 REST API 组成，支持 SIM 激活 / 暂停 / 终止、实时会话可视化、用量分析、地理定位、异常告警、批量操作和基于角色的访问控制。接入
              DevicePro 后，管理范围延伸到设备固件 OTA 和健康遥测。平台面向所有 SIM 订阅用户开放，无需下载软件；REST API 可接入客户的 IT/ERP/CRM 系统。
