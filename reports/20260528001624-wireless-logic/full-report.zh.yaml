      - number: '4.4'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              证据在模型层面支持清晰的财务结论，但 P&L 仍严重信息不足。Wireless Logic 是一家真实且在增长的公司：£256.7 million 已披露收入、40% 基础 EBITDA 利润率、£3.5
              billion 机构估值，以及自 2018 年以来超过六倍收入增长，都得到 Companies House 备案、PE 机构沟通和新闻报道等多个独立来源交叉印证。£222.3 million
              法定税前亏损是收购会计产物，不是现金基础上的困境信号，应与 £102.3 million 基础利润一起看。关键尽调卡点是结构性的，而非信号性的：Wireless Logic
              不披露合并毛利率、现金头寸或烧钱速度、营运资本指标、净杠杆率，也不披露 ARPU 或 MVNO 成本结构数据。对 Companies Act 下的 UK
              私营集团来说，这很正常；但这意味着，要判断盈利正常化、资本强度和单位经济性，必须拿到管理账。值得跟踪的反向信号包括：相对 MNO 和更新商品化 MVNO 的溢价定价定位（根据 SWOT
              分析数据）；十五笔异质收购可能带来的整合碎片化；Arqia Brazil 投资的未披露规模和条款；以及行业层面上，通信服务商品化导致每 IoT 连接 ARPU 下行的逆风。SACV 结构和 General
              Atlantic 的 BeyondNetZero 基金授权还引入 ESG
              和治理叠加层，而公开财务披露尚未反映这些因素。合在一起，公开记录支持一个收入质量判断：订阅经常性、中等资本强度；但在承销之前，利润率路径和资本充足性仍需要私下验证。
