      - number: '2.2'
        title: 买方画像、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              企业 IoT 托管连接的主要买方，是依赖连接设备群交付产品或服务的公司里的运营或技术决策者。Wireless Logic
              已确认的行业覆盖农业、医疗、制造、交通、能源和公用事业、智慧城市和零售；这些行业对应不同买方原型，预算归属、采用触发点和评估标准差异很大。


              在工业制造和能源中，买方通常是 OT/工程或数字化转型负责人，使用资本开支或运营技术预算采购；触发点是流程自动化、预测性维护或智能计量要求。医疗领域，买方是医疗设备 OEM
              或医院集团，为远程监测设备采购连接；监管合规（HIPAA、MDR、CRA）影响评估，付款方是把连接打包进产品经济性的设备制造商。智能出行和微出行（电动滑板车、共享车辆）中，买方是车队运营商，采购追踪溯源和 OTA
              更新能力，通常把按设备计的月服务费嵌入 SaaS 定价。农业领域，买方是精准农业供应商或农业科技公司，往往为低功耗广域传感器网络选择 NB-IoT 或 LTE-M。


              所有企业细分都共享一个采购动态：连接通常作为托管服务嵌入较长期合同（12–36 months），由直销企业销售推进，并辅以 OEM 和渠道合作伙伴动作。Wireless Logic 与 Thales
              的合作——后者是设备安全和 eSIM 硬件提供商——体现了 OEM 渠道：Thales 在 eSIM 上预载 Wireless Logic 的引导配置文件，把设备级激活导向 Wireless Logic 的
              Connexa 平台。这种 OEM 嵌入模式形成设备级锁定，并把付款方从终端企业转移到 OEM；OEM 再把连接成本分摊进硬件或平台定价。Ultra-Protect 案例研究（NHS/TfL/Surrey
              Fire）展示了直销企业买方路径：垂直 SaaS 提供商按传感器购买 NB-IoT 连接，并把月费嵌入客户合同。预算归属在服务提供商的 CTO 或产品团队，而不是专门的连接采购职能；这正是较小型 IoT
              原生客户的典型特征。
