      - number: '6.3'
        title: 留存信号、满意度与耐久性缺口
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 从未公开披露 NRR、GRR 或流失率。最接近的公开代理指标是 Gartner Peer Insights：公司在 45 条企业评价中得分 4.6/5，其中 62% 为五星、33%
              为四星，没有一星或二星。这与企业 B2B 买方满意度高相一致。相反，Trustpilot 在 11 条多为消费者或 SME 的评价中得分
              2.7/5，主题集中在支持响应、计费清晰度和合同条款。两个平台之间的差距符合一种细分分化：大型企业账户有运营客户经理和定制 SLA，而较小或 SME 客户可能得到更交易型的服务。SIMPro
              平台在结构上抬高切换成本——一旦客户 SIM 资产被导入 SIMPro，并配置自定义 APN、资费结构和数据池规则，迁移到竞争对手就需要重新配置每张 SIM、重写私有 APN
              路由，并重新接入计费。这种“托管资产”锁定效应是隐含留存驱动因素，但尚未量化。合同期限未披露；ElectrAssure 五年计划和 Just Eat 多年 Orderpad 推广，是唯一公开可见的合同周期。Red
              Squirrel Consulting v Wireless Logic Ltd 纠纷（2011 年代理协议）说明，公司与渠道代理的商业条款在历史上复杂到需要法院介入，不过 Wireless Logic
              成功抗辩了简易判决申请。
