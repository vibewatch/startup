      - number: '2.3'
        title: 需求驱动、采用约束与反向证据
        blocks:
          - type: paragraph
            body: >-
              主要需求驱动来自连接设备资产持续扩张、监管要求抬升，以及支撑技术标准成熟。Ericsson 估计，到 end-2025 蜂窝 IoT 连接总数约 4.5 billion，并以约 10% CAGR 增至 2031
              年 8 billion，形成一个庞大且仍在扩张的设备基数，需要托管连接。EU Cyber Resilience Act（CRA，Regulation (EU) 2024/2847）增加了结构性监管驱动：在 EU
              销售的连接产品制造商必须从 September 11, 2026 起报告被主动利用的漏洞，并在 December 11, 2027 前实现完全符合。违规罚款最高 €15 million 或全球年营业额的
              2.5%。这会把合规需求拉向能够证明生命周期安全、SIM 级加密和事件报告流程的托管连接提供商。同样，欧洲和亚太的数据主权要求正在推高本地化 SIM 配置需求——Wireless Logic 高管称，这是进入
              2026 年的关键竞争要求。


              SGP.32 eSIM 标准（面向 IoT 的远程 SIM
              配置）既是驱动，也是约束。它支持大规模远程切换配置文件，企业在更换网络或地理区域时不必更换硬件——这对拥有大型、跨地域设备群的企业是真正的运营收益。不过，Wireless Logic
              自家产品负责人也提醒，“eSIM 只是连接的交付载体，不一定是什么独角兽级新产品”，而且 SGP.32 会降低进入门槛，把面向消费者的 MVNO 带进 IoT——可能加剧价格竞争。Transforma
              Insights 的 2025 CSP 基准评估突出价格侵蚀是“压倒性的关键主题”，CSP
              正围绕六个维度（Software、Supply、Scale、Services、Solutions、Systems）寻找维持利润率的机制。


              反向证据也很实质。2024 年企业 IoT 支出仅增长 10%，是十多年来最慢增速（IoT Analytics），硬件细分下滑 8%；制造业和欧洲受到的冲击更大。行业调查显示，60–80% 的 IoT
              项目在进入生产前失败，只有 20–30% 被认为完全成功，说明部署复杂度长期存在，并限制市场兑现。ABI Research 记录了 LPWA 网络增长和破坏性定价如何压低连接 ARPU，迫使 MVNO
              寻找增值服务收入——但整个 MVNO 行业到 2030 年的 VAS 收入预计只有 $1.9 billion（服务收入的 44%），相对于其声称的托管连接收入规模并不大。实际含义是：Wireless Logic
              所处市场增长快，但纯连接的单位经济性在恶化；其防御力取决于托管平台深度、垂直客户锁定，以及向 25,000 客户基础交叉销售 VAS 的能力。
