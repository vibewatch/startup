            title: 具名证明几乎全由供应商撰写；NRR 与流失率完全未披露
            body: >-
              Wireless Logic 公开发布的 60+ 篇案例研究均由 Wireless Logic 自己制作；未发现客户独立撰写的案例研究、带具名部署的 G2/Capterra 评价或第三方证言。NRR、GRR
              和平均合同期限均未公开披露。来自 SME 和消费者相邻买方的 Trustpilot 评分 2.7/5（11 条评价，“差”）增加了一个反向信号，其结构上不同于企业 Gartner
              评分，说明服务质量可能分层，并不统一。
            calloutType: risk
            claimRefs:
              - CU023
              - CU024
              - CU041
              - CU042
          - type: callout
            title: SIMPro 托管资产形成结构性切换成本，但未量化
            body: >-
              一旦客户的 SIM 资产接入 SIMPro，并配置自定义私有 APN、数据池协议、VPN 路由和汇总计费，切换到竞争对手就需要在现场重新配置每张 SIM、重新谈判 APN
              路由、重映射计费——对大型或地理分散资产而言，成本估计显著。这是 Gartner 满意度分数高、但公开流失率或 NRR 数据极少同时存在时最合理的解释。
            calloutType: insight
            claimRefs:
              - CU009
