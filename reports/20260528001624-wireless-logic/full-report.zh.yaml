      - number: '7.3'
        title: 并购整合与财务风险
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 在 Montagu 持有期间自 2018 年以来完成超过 15 起并购，包括 Arkessa、Eseye、Comms365、Zipit Wireless 和
              Arqia。每一笔后续交易都会增加 HR、IT 系统、产品平台和商业化动作的整合复杂度。2025 年 4 月 Arqia 收购是迄今整合风险最高的交易：Arqia 在巴西运营，管理约 300
              万连接，并持有该国仅有 15 张 ANATEL 授权 MVNO 牌照之一。巴西的数据本地化要求、葡萄牙语员工队伍和独特监管体系都会带来实质文化与运营摩擦。CEO Oliver Tucker
              承认，国际扩张通常花费的时间是原计划三倍、资本也是三倍。财务方面，Blue Holdco（Wireless Logic 的直接母公司）截至 2024 年 4 月年度收入为 £256.7 million，基础
              EBITDA 为 £102.3 million，但因 £141 million 并购相关成本录得 £222.3 million 税前亏损。鉴于 EBITDA
              表现，这一会计亏损不代表运营困境，但说明快速并购留下的债务和摊销堆叠仍然重要。整合中的 IoT MVNO 市场提供了结构性背景：Telenor IoT 发现该市场碎片化程度约为传统 B2B
              市场的五倍，意味着继续并购式增长在运营上必要，却资本密集，且整合执行风险会随每笔交易累积。
