      - number: '7.2'
        title: 运营商依赖与技术风险
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的 GSMA 认证 Conexa 多 MNO 核心网，是公司主要技术差异点，可在覆盖 165 个国家的 50+
              家移动与卫星运营商合作网络之间自动切换运营商。这一架构显著降低单一运营商风险，但不能消除风险：无线接入仍依赖底层 MNO 基础设施；若某一地理区域多家运营商同时中断，仍会级联影响所有已连接 IoT 设备。2025
              年 8 月 Verizon 无线中断影响约 23,000 名用户，说明即便 MVNO 具备多网络回退，MNO 基础设施故障仍会传导到 MVNO 和企业 IoT 设备群。欧洲集团董事总经理 Cyril
              Deschanel 在 2026 年 1 月承认，2025 年一整年的高关注度中断要求行业从覆盖转向韧性和安全。技术风险还包括竞争替代：SGP.32 标准允许远程 eSIM 配置、无需实体 SIM 更换，降低了新
              IoT 连接供应商进入门槛；同时，全球私有 5G/LTE 网络部署创造了完全绕开公共 MVNO 基础设施的替代路径。IoT For All 数据显示，MVNO 市场在 2025 年达到 2.9
              亿托管连接，新低成本进入者压缩价格；增值服务仍只占 MVNO 收入的一小部分，商品化压力高。MVNO Index 指出，随着国际扩张增加多地理计费复杂度，对账和收入保障正成为关键失效点。Wireless
              Logic 的 Starlink 经销商协议又增加了卫星依赖，成为新的合同和技术整合层。
