      - number: '4.2'
        title: 财务表现、增长轨迹与规模指标
        blocks:
          - type: paragraph
            body: >-
              公开观察者能看到的最清晰财务窗口，是覆盖截至 April 2024 年度合并集团的 Blue Holdco Companies House 备案。备案披露收入 £256.7
              million，扣除利息、税项和收购成本前的基础利润 £102.3 million，利润率约 40%。法定税前亏损为 £222.3 million，完全由 £141 million 收购相关费用解释——主要是
              Montagu 旗下激进买入并建设策略带来的商誉摊销和交易费用。CEO Oliver Tucker 曾公开表示，FY2024 收入和利润均同比增长约 20%，这与约 £214 million 的隐含上一年收入、约
              £85 million 的基础 EBITDA 相符。Montagu 官方沟通确认，自 2018 年收购以来，收入增长超过 6×，EBITDA 增长超过 7×，意味着 2018 年基础收入约 £40-43
              million、基础 EBITDA 约 £15 million。这一轨迹符合一家同时依靠有机增长和持续收购计划复合增长的公司。Growjo 等第三方估算方把当前年化收入放在约 USD 107
              million——显著低于已披露的 £256.7 million——反映外部很难为一家高增长、且 M&A 大幅重塑边界的私营公司建模。备案期之后最重要的财务事件，是 May 2025 General
              Atlantic 以据报 £3.5 billion 企业价值进行少数股投资，意味着约 34× 过去 12 个月基础 EBITDA。November 2025 完成的 €2 billion
              SACV——有记录以来最大 IoT 连接延续基金——提供了独立机构估值锚。Arqia 之后（April 2025），公司管理超过 18 million 个 IoT 设备连接，覆盖 25,000 企业客户。
