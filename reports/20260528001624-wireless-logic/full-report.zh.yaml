  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与测算逻辑
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的相关市场不能用单一总可用市场（TAM）标题数字概括，必须先划清边界再自下而上构建。最宽口径下，IoT 年支出预计到 2026 年超过 $1 trillion，连接数到 2030
              年预计达到 38.7 billion（StartUs Insights 引用 GSMA Intelligence）；仅工业 IoT 在 2026 年就预计达到 $214 billion（Coherent
              Market Insights）。这些数字涵盖硬件、芯片、传感器、软件平台、应用和服务，口径过宽，不能为连接优先型提供商的定价或竞争定位提供锚点。


              更有信息量的边界是托管蜂窝 IoT 连接层。IoT 连接管理平台（CMP）市场——覆盖用于管理设备连接、SIM 生命周期、网络可视性和分析的平台——2026 年估计为 $12.23 billion，并以
              20.3% CAGR 增长至 2030 年 $25.71 billion（The Business Research Company）。其下是更窄的 IoT MVNO 市场（提供蜂窝 IoT
              通信服务和增值服务的虚拟运营商），PS Market Research 估计 2026 年为 $5.2 billion、CAGR 18.5%；Kaleido Intelligence 则预计 MVNO 管理的蜂窝
              IoT 连接将在 2026 年达到 670 million（24% CAGR），连接和增值服务（VAS）收入达到 $9.1 billion——这一汇总更高，因为它纳入了非 MVNO
              的连接管理收入。最窄一层是作为独立产品类别的“托管 IoT 连接服务”，2026 年规模为 $2 billion，到 2035 年以 20% CAGR 增至 $11.15 billion（Market
              Research Intellect）。这三组嵌套估计不能相加；它们反映的是相互竞争的边界定义。


              Wireless Logic 的可服务市场最好理解为面向企业的托管蜂窝 IoT 连接层——即 Kaleido/PS Market Research 口径——考虑到其 25,000 企业客户基础覆盖 165
              个国家、管理 14 million 台 IoT 设备，欧洲权重更高的提供商在 2026 年的实用 SAM 约为 $1.5–3 billion。可比公司 KORE Wireless 的企业价值已确认为 $726
              million（其 FY2025 收入为 $286 million、连接数约 20.9 million），为可变现连接规模提供外部锚点。广义分析师给出的估计从 $2 billion 到 $12 billion
              不等，这些矛盾凸显：市场边界选择才是任何测算的首要决定因素。
