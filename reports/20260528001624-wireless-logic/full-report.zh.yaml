      - number: '7.5'
        title: 执行、网络安全与人员风险
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的公开客户评价记录带来执行和服务质量风险，与其企业级定位不成比例。Trustpilot 评分为 2.7/5（差），基于 11 条评价，近期有多条反向记录：一名 2026 年 2
              月评价者称“服务糟糕，不理解客户，员工频繁变动——像躲瘟疫一样避开”；一名 2025 年 11 月评价者称平台升级后网络中断 30
              小时且没有支持响应；第三名评价者称自己被锁定在昂贵合同里；还有一名长期客户称“SIMPro 不工作，也不给我任何有用数据”，并称“WL
              已承认，像我这样小的客户拿不到专门客户服务”。虽然评价量低限制了统计推断，但这一模式符合快速扩张超过 SME 细分市场服务和平台质量的情况。人员风险方面，联合创始人 Philip Cole 于 2019
              年离开；CEO Oliver Tucker 是唯一仍在任的创始人，也是关键人依赖。General Atlantic 少数股权投资没有披露管理层保证。从网络安全角度看，Wireless Logic 的
              Security Management Framework 文件列出了防御、检测和响应控制，包括 IoT SAFE 证书身份、SIM 级异常检测和加密通信。公司承认 2021 年 H1 有 15 亿次 IoT
              设备攻击，是背景威胁语境。未识别到公开泄露或确认事件，但缺少公开 SOC 2 或 ISO 27001 披露，限制了独立验证。NIST 2026 年 4 月对 NIST IR 8259r1 的更新增加了上市后
              IoT 安全生命周期义务，将影响 Wireless Logic 的 OEM 和企业客户基础。
