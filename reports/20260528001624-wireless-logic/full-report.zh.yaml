        - Analysys Mason 对托管 MVNO 细分的外部估计；非 Wireless Logic 专属
        - 到 2032 年降至 $0.30；混合所有层级和市场
        - Analysys Mason IoT 定价研究（SI022）
      - - 隐含年收入 / SIM：按基准 ARPU 约 $4.20
        - 基于 18M 连接 × $0.35/月 × 12 推导估计；管理层未确认
