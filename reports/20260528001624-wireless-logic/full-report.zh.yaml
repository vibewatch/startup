        - 约为报告收入的 40%（估计）
        - 中 — 从文件推导；EBITDA 定义可能不同
        - 相比技术赋能服务同行，现金转换能力较强
        - 要求管理层定义「基础」EBITDA，并提供与 GAAP 的桥接
      - - 法定税前亏损（FY2024）
        - '-£222.3 million（计入 £141M 收购相关费用后）'
        - 高 — Companies House 文件
        - 显示并购驱动的会计亏损；不是现金口径困境指标
        - 确认 £141M 摊销计划及对未来年度的影响
      - - 同比收入增长（FY2024）
        - 约 20%（CEO 口头指引确认）
        - 中 — 公司口径；没有上一年度文件可直接比较
        - 与 2018 年基数以来 6× 增长一致；验证有机 + 并购混合增长
        - 要求提供 FY2023 法定收入数字以直接比较
      - - 自 2018 年 Montagu 投资以来的收入 CAGR
        - 约 6 年收入增长 6×（Montagu 确认）
        - 高 — Montagu 官方沟通和 CEO 引述确认
        - 隐含约 33% 混合 CAGR；对托管连接业务而言异常强劲
        - 对齐有机增长与并购贡献；要求按年瀑布图
      - - 自 2018 年 Montagu 投资以来的 EBITDA CAGR
        - 约 6 年 EBITDA 增长 7×（Montagu 确认）
        - 高 — Montagu 官方沟通确认
        - EBITDA 增长快于收入，意味着经营杠杆或利润率扩张
        - 要求提供从 2018 到 FY2024 的分年度 EBITDA 桥接
      - - 自 2018 年以来员工数增长
        - 7× 员工数（Montagu 已确认）
        - 中 — 公司口径；未确认绝对人数
        - 员工数与 EBITDA 同步增长，说明公司在扩张托管服务，而不是纯 SaaS
        - 索取当前员工数，以及按职能拆分的 FTE（技术 vs. 运营 vs. 销售）
