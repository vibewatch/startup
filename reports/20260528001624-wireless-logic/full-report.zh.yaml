      - number: '8.3'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要几项条件同时成立。收入必须保持 30%+ 年增长，且 FY2025 集团账目必须确认收入约 £350 million 或以上。在 £350 million 收入下，£3.5 billion 估值隐含
              10x 前瞻收入倍数；对于一家具备强经常性收入、40% 基础 EBITDA 利润率和长期 IoT 顺风的 Gartner 魔力象限领导者，这一倍数可以解释。在该情景中，Rule of 40 分数（30% 增长 +
              40% EBITDA 利润率 = 70%）超过顶级十分位 SaaS 的溢价门槛，2028–2029 年 IPO 或战略出售可能在当前标记上带来 1.5–2x 加价。IoT 市场到 2025 年底达到 211
              亿台设备，并到 2030 年增至 390 亿台，支持结构性长期需求逻辑。

              基准情景假设 FY2025 收入增长 20% 至约 £308 million，整合带来的 M&A 成本拖累持续，并且公司在 2027–2028 年仍为私有持有。按这条轨迹，公司 FY2027 收入可达
              £450–500 million；届时若以 8–10x 收入退出（位于高端 SaaS/IoT 基础设施倍数区间内），企业价值约为 £3.6–5 billion——大体支撑当前标记。该情景的关键风险在于，未披露
              LBO 杠杆的债务服务会吃掉 EBITDA 增长的相当一部分，压缩股权回报。Partners Group 自 2021 年以来已投资，并已进入第二个延续基金结构，说明近期流动性受限且持有期会延续多年。

              悲观情景围绕执行风险和估值压缩。如果国际扩张（CEO 自己承认“时间是三倍、成本是三倍”）导致利润率侵蚀，或 2025 年账目显示并购消化延迟造成收入增长低于预期，10–14x
              收入倍数就站不住。Bloomberg 对 PE 延续基金的报道强调了治理担忧：GP 把资产从一只基金卖给自己管理的另一工具，天然存在定价冲突；二级买方也可能是在乐观 GP 预测下被定价。假设 2027
              年退出时出现 down-round，若收入增长放缓至 10–15%、倍数压缩至 6x，企业价值将为 £2.0–2.5 billion——较当前标记下调 30–40%。
