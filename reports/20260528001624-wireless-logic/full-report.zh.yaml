      - number: '8.2'
        title: 公开与私有可比基准
        blocks:
          - type: paragraph
            body: >-
              最直接可比的上市公司是 KORE Wireless（NYSE: KORE），一家全球纯 IoT 连接供应商。KORE 报告 FY2025 收入 $285.9 million，调整后 EBITDA $63.3
              million。2026 年 2 月，Searchlight Capital Partners 和 Abry Partners 同意以每股 $9.25 的全现金交易收购 KORE，对公司估值约 $726
              million（含债务）——约为 2.5x 收入、11.5x EBITDA。相比 Wireless Logic 隐含 10.5–13.6x 收入倍数，这是重大估值差距，尽管 KORE
              收入增长持平、硬件占比更高，可以解释部分折价。

              更广泛的 SaaS 基准说明了市场环境。Windsor Drake 2026 年更新显示，上市 SaaS 中位数为 6–7x EV/Revenue，私有中低端市场 SaaS 相比上市同业折价
              30–50%，股权支持公司的中位数约 4.8–5.3x。前四分位私有 SaaS 交易可达到 8.3x。PitchBook 2025 年 Q2 数据显示，IT 行业 M&A 的 EV/EBITDA 中位数为
              13.2x。Raisek 估值基准确认私有 SaaS EV/Revenue 为 4.8–5.3x，表现强的公司最高可达 8.3x。Ful.io 2025 年 SaaS 分析将 6.0x 作为上市 SaaS
              倍数中点，AI 原生垂直 SaaS 可达 8–12x。按所有公开可得的可比基准，Wireless Logic 10–14x 收入倍数都显著偏高。

              在 IoT M&A 版图中，Jahani & Associates 的企业 IoT 设备解决方案 M&A 分析（2020–2025 年 Q1）覆盖 2,290 笔交易、总额 $376 billion，发现行业
              EV/Revenue 区间为 1x 至 51x，大型交易（$1B+）通常为 1–5x，小型高增长标的可达 10–55x。Wireless Logic 估值 £3.5
              billion，属于大型交易类别，但定价位于其规模段的溢价端。IoT Analytics 确认，全球蜂窝 IoT 市场 2024 年由 41 亿连接创造 $18.4 billion 收入（同比
              +16%），支撑这一溢价背后的结构性顺风。然而，唯一纯 IoT MVNO 上市可比公司 KORE 的交易和收购倍数，只有 Wireless Logic 隐含倍数的一小部分。
