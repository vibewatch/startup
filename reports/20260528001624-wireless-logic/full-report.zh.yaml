      - number: '5.4'
        title: 安全、合规与信任态势
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 的 IoT 安全框架是一个公开阐述的 360 度模型，围绕防御、检测和响应三层展开。防御层覆盖身份管理（基于 SIM 的认证）、IMEI 锁定、私有 APN/VPN、白名单 /
              黑名单和 SIM 内安全应用。检测层依托 AI 驱动的 Anomaly and Threat Detection
              平台；该平台在移动核心网侧无代理运行——设备上无需软件代理——并监控行为基线，标记异常连接目标、数据量激增和运营模式偏离。响应层可自动采取反制措施（设备隔离），并支持运营商合规报告。


              Cloud Secure with IoT SAFE 是零接触接入产品：它使用 SIM 内 SAFE applet 安全发放和轮换证书，在建立连接时执行设备身份校验，防止身份冒用或勒索软件。该框架明确提到遵循
              EU Cyber Resilience Act、UK PSTI Act 和 US IoT Cybersecurity Improvement Act。


              在监管态势上，Wireless Logic 的 Cyril Deschanel（2026 年 3 月）称，SGP.32 正“越来越成为监管合规的使能因素”，真正的数据主权需要本地流量分流加境内数据处理，而
              Conexa 的地理分布式核心正是为支持这一点而设计。2026 IoT Breakthrough award 语境中也引用了 DORA 和 NIS2 韧性要求。


              公开信任层面的限制在于，Wireless Logic 没有在公开页面披露具体 ISO 认证编号（如 ISO 27001 证书 ID 或范围）或 SOC 2 报告。Security Management
              Framework 手册是公开的（一份 12 页 PDF），说明了框架结构，但没有给出经审计的控制证据。Trustpilot 在 11 条评价中的评分为 2.7/5（样本很小），其中一条 2026
              年评价称平台升级后出现 30 小时连接中断，另一条称服务“糟糕”。这些是来自有限公开样本的重要反向信号。
