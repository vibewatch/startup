      - number: '1.2'
        title: 领导层、治理与关键人物评估
        blocks:
          - type: paragraph
            body: >-
              联合创始人兼 CEO Oliver Tucker 自 2000 年创立以来一直领导 Wireless Logic，2026 年仍是公司最核心的战略人物和公开代表。他 26 年任期，再加上 2025
              年披露的联合创始人 Philip Cole 离开公司这一事实（Cole 于 2019 年离任，后来创办 Hyper Logical），使 Tucker 形成实质性的关键人物集中度。May 2025，Tucker
              确认国际扩张成本约为最初预期的三倍，既显示野心，也暴露公司 LATAM/APAC 推进中的执行风险。


              董事会治理由一位高知名度非执行主席支撑：Sir Michael Rake，于 1 June 2019 生效任命。他曾任 BT Group、Worldpay Group、KPMG（UK and
              International）、easyJet 主席，以及 Confederation of British Industry 总裁。May 2025，General Atlantic EMEA 副主席
              Vittorio Colao——曾任 Vodafone Group CEO 和意大利技术创新部长——加入董事会，显著加深公司的电信运营商网络。Cyril Deschanel 同时被任命为欧洲区董事总经理，带来
              Vodafone 和 Tele2 的 IoT 领导经验。


              高管团队包括 CFO Richard Miller、首席产品官 Matt Thomas、首席运营官 Matthew Tate，以及产品与营销董事总经理 John Dillion。由于 Wireless Logic
              为私营公司，董事会层面的治理细节（委员会结构、观察员权利、GP/LP 同意门槛）未公开；这是这一阶段 PE 持有公司常见的尽调缺口。
