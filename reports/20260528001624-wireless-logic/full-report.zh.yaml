      - number: '3.2'
        title: 直接同业画像
        blocks:
          - type: paragraph
            body: >-
              最强的直接同业组合横跨几种模式。Eseye 是全托管全球 eSIM 编排上最接近的同类挑战者：其 AnyNet+ 和 Infinity 定位与 Wireless Logic 想占据的价值主张高度相似，包括
              multi-IMSI 回退、监管本地化和运营商赋能。Transatel 和 Tele2 IoT 代表更电信原生的变体，依托直接运营商经济性、全核心网或电信级运营模式，以及单一平台的全球合同。Aeris 和
              KORE 重要，是因为它们是少数拥有公开规模信号的大型提供商；尤其 Aeris 在已披露连接数上已经明显高于 Wireless Logic。


              其他直接同业从同一问题的不同层面发起攻击。POND 强调故障切换和路由控制，emnify 强调云原生控制和制造业优先的导入，1NCE 则用极简预付费经济性攻打低数据细分。Eseye 似乎也仍保持独立，而不是被
              Wireless Logic 吸收：已审阅的 Wireless Logic 新闻档案列出其他收购，而 Eseye 到 2026 年仍以自有品牌发布产品更新。
            claimRefs:
