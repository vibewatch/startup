  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 靠收购搭出的地域广度和渠道入口
        - 收购资产存在整合欠账，或客户体验不均
        - 高
        - 尽调平台统一度、支持交接指标，以及按收购队列拆分的交叉销售成效
      - - 运营商中立平台和庞大 SIM 存量
        - eSIM 降低迁移摩擦，多归属削弱绝对锁定
        - 中
        - 要求提供全球存量客户的流失、NRR、API 粘性和迁移成本证据
      - - 合规和本地化经验
        - 监管变化快过漫游聚合商的适配速度
        - 高
        - 核验本地配置文件覆盖、合法监听准备度和逐国漫游限制
      - - 托管服务和安全层
        - Aeris、Tele2、Vodafone 和 Deutsche Telekom 正把安全与托管运营叠进产品
        - 中
        - 将私有 APN/VPN、NOC、威胁响应和 SLA 承诺与具名同行对标
      - - 宽横向覆盖
        - Cubic、ORBCOMM 等专精厂商会赢下汽车或远程工业负载
        - 中
        - 按垂直行业拆分胜率，验证横向广度在哪些场景胜过专精深度
      - - PE 支持的资本和收购能力
        - 如果并购带来的广度没有转成更高毛利的平台使用，价格压缩会跑赢价值创造
        - 中
        - 按服务层检查利润率桥接，不只看连接数增长或收购收入
      - - 询价主导的企业定价
        - 1NCE 和 Hologram 的透明报价会把采购预期往下锚定
        - 高
        - 按用例审查实际成交价，说明托管合规 / 支持在哪些场景赚到溢价
      - - 跨国企业单一供应商便利性
        - Vodafone 和 Deutsche Telekom 可依托自有网络讲出类似的单一责任故事
        - 高
        - 压测监管行业或大型企业账户中，相对既有运营商主导交易的赢 / 输数据
    notes: 本清单评估的是 Wireless Logic 护城河主张的耐久性，而非通用市场风险。严重性反映的是若未缓释，相关威胁压缩定价权或在目标账户中替代 Wireless Logic 的可能程度。
