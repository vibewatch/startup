  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 对 WL 的影响
      - 尽调问题
    rows:
      - - 欧盟《网络韧性法案》（CRA）
        - 驱动因素
        - 2026 年 9 月（报告），2027 年 12 月（全面实施）
        - 企业需要能覆盖全生命周期安全的连接提供商；合规要求会撬动采购
        - WL 平台是否提供符合 CRA 要求的漏洞和事件报告工具？
      - - SGP.32 eSIM 远程配置标准
        - 双重——既是驱动也是风险
        - 2026 年采用爬坡
        - 支持全球设备部署；也降低消费移动玩家入场门槛
        - WL 在 SGP.32 生态中的位置；与 Thales 的合作能否证明先发优势
      - - 蜂窝 IoT 连接增长（4.5B → 8B，至 2031）
        - 驱动因素
        - 2025-2031
        - 设备越多，可触达的车队管理机会越大
        - 相比纯电信 MVNO 竞争对手，WL 能拿下多少新增连接份额
      - - 数据主权和本地化规则
        - 驱动因素
        - 在 EU/APAC 已生效且仍在收紧
        - 跨国企业需要能合规本地化连接的提供商
        - WL 在目标市场的法律实体布局和本地 MVNO 牌照
      - - 5G 专网和边缘计算
        - 驱动因素
        - 2026-2028 爬坡
        - 打开需要超低时延的 IIoT 场景；WL 必须提供 5G SA 连接
        - WL 的 5G SA 能力路线图，以及通过 MNO 合作伙伴实现的当前 5G 覆盖
      - - ARPU 下滑 / 连接商品化
        - 约束
        - 持续（结构性）
        - 纯 SIM 连接利润率被侵蚀；需要扩展 VAS 才能守住单客户收入
        - WL 的 VAS 附加率，以及收入结构从连接向平台 / 服务迁移的进度
      - - IoT 项目失败率（60-80%）
        - 约束
        - 持续
        - 高失败率压低企业新部署意愿；客户项目延期或取消会拖累 WL
        - WL 直接企业客户的流失数据和部署成功率
      - - 2024 年企业 IoT 支出放缓
        - 约束
        - 周期性，但 2024 年影响实质
        - 硬件下滑 8%；欧洲制造业受冲击最重——正是 WL 本土市场
        - WL 2024 年收入表现，相比连接服务市场 +17.7% 的基准
      - - 网络标准碎片化（2G/3G 退网、NB-IoT、LTE-M、5G）
        - 约束
        - 2025-2027 持续迁移
        - 仍使用传统 2G/3G 的客户被迫迁移；带来流失和重新部署成本
        - WL 在 50 家 MNO 合作伙伴中对 NB-IoT 和 LTE-M 的产品覆盖
      - - 供应商锁定 / 切换成本担忧
        - 混合
        - 持续
        - 帮 WL 留住现有客户，但也让既有电信运营商阻挡新客赢单
        - WL 的 SIM 可携性和多网络 SIM 策略能否构成差异化
    notes: >-
      方向分类以 IoT MVNO / 托管连接提供商为参照。ARPU 下滑和项目失败率来自 ABI Research 与 IoT Analytics；监管时间线来自 Hogan Lovells 和 Mend.io 对 CRA
      的分析。
    claimRefs:
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
      - CM034
      - CM035
  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 相比 Wireless Logic 的局限
    rows:
      - - Wireless Logic
        - 直营托管 IoT 聚合商
        - 18M+ 台设备；165 个国家；750+ 张网络；估值 £3.5bn
        - 覆盖多个垂直行业的企业 IoT
        - 覆盖广度、并购驱动的布局、专门打造的平台
        - 定价不公开，公开财务披露有限
      - - Eseye
        - 直营托管 eSIM 平台
        - 800+ 张网络；190+ 个国家；私营公司
        - 全球企业 IoT 和运营商赋能
        - AnyNet+ + Infinity；接近 100% 的在线率；eSIM 编排能力强
        - 披露规模低于 Aeris/KORE，并购足迹更窄
      - - Transatel
        - 直营 IoT MVNO + MVNE
        - 120+ 家 MVNO；管理 3M 张 SIM；200+ 个国家
        - 全球企业 IoT 和 MVNO 赋能
        - 完整核心网、运营商直签、单一合同 / 发票 / 平台
        - 托管服务差异化不如 Wireless Logic 明确
      - - Tele2 IoT
        - 电信运营商背书的直营托管 IoT
        - 数百万台设备；数千客户；190+ 个国家
        - 汽车、公用事业、政府、企业
        - Cisco Control Center、APN/VPN 安全、24/7 NOC
        - 平台依赖 Cisco 技术栈；定价不公开
      - - POND IoT
        - 直营韧性导向挑战者
        - 200+ 个国家；900+ 张网络；私营公司
        - 分布式设备、支付、EV 充电、智慧基础设施
        - Multi-IMSI 故障切换、路由控制、集中式 APN
        - 公开规模证据较少，披露的客户案例更少
      - - emnify
        - 直营云原生挑战者
        - 190+ 个国家；私营公司
        - 需要云原生控制的 OEM 和企业
        - 自有移动核心网、非转向接入、工厂优先 eSIM
        - 未公开定价，披露规模低于 Aeris/KORE
      - - Aeris
        - 直营规模化托管 IoT 平台
        - 100M+ 台联网设备
        - 汽车、MNO 合作伙伴、企业 IoT
        - 自有核心网可视性、Watchtower 安全、Mobility Suite
        - 可能更像超大规模平台在竞争，而不是灵活聚合商
      - - KORE
        - 直营上市对标
        - 21.9M 个连接；2026 年 Q1 收入 $65.8M
        - 企业 IoT 连接、解决方案和分析
        - 上市对标、广泛市场存在、连接规模
        - 连接增长下仍能看到收入压力
      - - 1NCE
        - 直营低数据量定价颠覆者
        - 22M 件联网产品；20k+ 用户
        - 大规模低带宽部署
        - 10 年预付固定费率模式
        - 对高接触度托管编排强调较少
      - - Hologram
        - 开发者优先的替代平台
        - 5,000+ 客户；公开标价
        - 工程团队主导的车队和较小规模部署
        - 透明定价、API 优先自助服务、动态配置文件切换
        - 不是一一对应的白手套企业托管服务
      - - Cubic Telecom
        - 相邻汽车专业厂商
        - 23M 辆联网汽车；200+ 个国家
        - 汽车、交通运输、农业 OEM
        - 软件定义汽车渠道、OEM 分析、SGP.32 就绪度
        - 横向企业覆盖更窄
      - - ORBCOMM
        - 相邻卫星-蜂窝混合专业厂商
        - 500+ 全球合作伙伴；聚焦关键任务工业场景
        - 远程资产、海事、能源、农业
        - 卫星-蜂窝混合连接和 D2D 韧性
        - 不是宽口径通用企业 CMP
      - - Telit
        - 相邻“模块 + 连接”供应商
        - 连接入门套件；灵活套餐
        - 工业 OEM 和设备制造商
        - 将连接打包进模块设计周期
        - 连接挂在硬件销售动作上，不是纯托管服务
      - - Pelion
        - 相邻托管连接平台
        - 1,000+ 家联网企业；600+ 张网络；150+ 个国家
        - SMB 到中端市场的联网企业
        - 门户、共享流量套餐、eUICC、99.995% 可靠性主张
