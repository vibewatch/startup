    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Wireless Logic 方案
      - 可衡量收益
      - 限制
    rows:
      - - 用单一 SKU 全球部署 IoT 设备群
        - 采购各国专用 SIM；管理多个 MNO 合同；实体更换 SIM
        - 全球 eSIM + RSP（SGP.02/22/32）、单一 SKU、零接触 OTA 配置
        - 消除国家 SIM SKU 膨胀；降低物流开销
        - 需要测试 eSIM 模块兼容性；前期成本结构可能高于标准 SIM
      - - 从单一看板管理数百万张 SIM
        - 手工登录各运营商门户；报表割裂；排障慢
        - SIMPro 门户 + REST API，提供实时会话数据、用量分析和地理定位
        - 降低运营开销；通过 API 集成实现自动化
        - SIMPro 看板可用性的公开 SLA 未披露
      - - 规避受监管市场的永久漫游限制
        - SIM 卡停在访客网络；存在被监管封锁风险；手工重发配置文件
        - 通过 Conexa 地理分布式核心网做本地分流；借助 RSP 切换配置文件到本国运营商
        - 无需更换设备，即可在本国满足监管合规
        - 本地运营商关系和数据主权保证因市场而异；细节需要尽调
      - - 发现并响应 IoT 安全入侵
        - 手工审阅日志；发现慢；自动化有限
        - 移动核心网中的 AI 驱动异常和威胁检测（无代理）+ 自动隔离
        - 缩短入侵停留时间；无需设备侧代理
        - 检测质量基准未公开发布；误报率未披露
      - - 保障云端接入和证书管理安全
        - 手工配置证书；存在伪冒或未授权访问风险
        - Cloud Secure + IoT SAFE SIM 端小程序，自动签发和轮换证书
        - 零接触接入；设备身份锚定在 SIM
        - 需要兼容 IoT SAFE 的 SIM，并与云侧基础设施对齐
      - - 为远程站点增加卫星连接
        - 单独采购卫星提供商；蜂窝与卫星不集成；合同多头
        - Blue Wireless LEO + LTE/5G 混合托管服务，具备 Starlink 经销能力
        - 单一提供商交付混合连接，并在 70+ 个国家提供 SLA 保证
        - Starlink 性能受 SpaceX 服务条款约束；Blue Wireless 集成层增加依赖
    notes: 收益是来自官方材料和合作伙伴公告的方向性主张；没有独立审计的 ROI 数据。
