  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价与货币化
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 本质上是一家基于订阅的 IoT 连接托管服务提供商。收入来自向企业客户按 SIM 或按设备反复收取连接和平台访问费用，在 53 份 MNO 合作协议下叠加 165 个国家的 750+
              移动网络。公司不公布标价；所有商业条款都直接与企业账户谈判，据称会按部署规模、垂直行业和地理足迹定制。SIMPro 连接管理平台提供设备管理、流量分析、安全仪表盘、eSIM
              配置和异常检测，并以不额外收费的方式打包进订阅，这使其区别于单纯通信服务转售。实际效果是，Wireless Logic 捕捉更宽的一段连接价值栈——从 SIM
              物流、实时流量管理到安全告警——同时把客户锚定在自有管理层。SIMPro 核心之外的增值模块，包括安全分析和高级 eSIM 编排，提供潜在增购路径，但没有公开披露能确认其对综合 ARPU 的贡献。Analysys
              Mason 的行业基准估计，托管 MVNO 细分的综合 IoT 连接 ARPU 约为 USD 0.35/每 SIM 每月，随着通信服务商品化，到 2032 年降至 USD 0.30；按当前费率，对应每连接每年
              USD 4.20。Arqia 之后超过 18 million 个连接下，这一基准支持约 USD 75 million 以上的连接层收入运行率粗略代理——显著低于已披露的 £256.7
              million，说明平台和托管服务叠加贡献很大。外部观察者看不清其定价架构，但高续约订阅模型、嵌入式平台切换成本和 25,000 企业客户共同提供了稳定的合约收入基础，交易波动较低。
