      - number: '3.4'
        title: 能力与定价比较
        blocks:
          - type: paragraph
            body: >-
              比较这个市场，最清晰的方式是看五个维度：网络广度、编排深度、本地化与合规、支持与安全、价格透明度。Wireless Logic
              在前四项表现不错。它具备实质规模、靠收购构建的广泛足迹，以及围绕安全全球管理塑造的平台叙事。但第五项上，它看起来和多数企业级同业一样：公开定价基本缺席。Eseye、Transatel、POND、emnify、KORE
              和 Aeris 也是如此。


              这种不透明很重要，因为透明挑战者会创造价格锚。1NCE 公开宣传预付费低数据方案，Hologram 发布开发者定价，明确列出每 MB 和每 SIM
              收费。它们并不是全托管全球设备资产的完全可比替代品，但确实会让采购更仔细审视：企业报价中的支持、合规处理和编排到底凭什么定价。Tele2、Pelion 和 Telit
              位于中间地带，展示试用、套件或灵活套餐，但不提供完整可比标价。换句话说，这个市场的价格发现仍高度依赖买方语境和谈判式打包，而不是公开价目表。
