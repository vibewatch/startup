      - number: '2.4'
        title: 市场结构、整合信号与基于证据的展望
        blocks:
          - type: paragraph
            body: >-
              IoT 托管连接市场正在围绕三层整合：(1) 以全球 MNO 为锚的平台（Vodafone、AT&T、Verizon、Deutsche Telekom），把网络所有权和运营商规模的连接管理软件结合起来；(2)
              专业 IoT MVNO 和托管连接提供商（Wireless Logic、KORE、Aeris、emnify、Eseye、Soracom），聚合 30–190
              个国家的网络接入，并在垂直专业能力、平台深度和托管服务上差异化；(3) 低成本、只做连接的提供商（1NCE 等），为高容量、低复杂度 IoT 场景打价格战。Kaleido Intelligence 发现，2021
              年前 10 大 IoT MVNO 占 68% 的连接量和 71% 的收入份额，说明这个表面分散的市场已高度集中。


              整合正在加速。Aeris 收购 Ericsson 的 IoT Accelerator 和 Connected Vehicle Cloud 业务（December 2022 宣布），托管设备数超过 100
              million，企业客户超过 7,000。KORE Group Holdings 于 February 2026 签署合并协议，企业价值 $726 million（与 Searchlight Capital
              私有化），承认公开市场低估了成熟 IoT 连接收入基础。Transforma Insights（2025 基准评估）把 Wireless Logic 列入全球 CSP 第一梯队，指出其能力改善包括通过 Arqia
              收购实现的提升，并与 Vodafone、AT&T、Verizon、Deutsche Telekom IoT 和 Telefónica 并列。


              到 2030 年，托管连接平台细分仍有增长支撑，但增长伴随战略分化：仍停留在纯连接转售的提供商将面临结构性 ARPU
              逆风；能够自建或收购垂直专长、生命周期工具、安全服务和分析平台的公司，更有机会扩张收入。CRA、Data Act 和 GDPR 合规复杂度预计会让欧洲 IoT 市场成为受影响最直接的地区——这为拥有 EU
              司法辖区既有监管经验的本土托管连接提供商创造结构性优势。Wireless Logic 已确认 50 家 MNO 关系和 165 国覆盖，有条件同时捕捉全球企业部署和 EU
              合规驱动的整合；不过，与北美企业交易量相比，欧洲企业 IoT 客单规模较小，仍会约束其 SAM。
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
