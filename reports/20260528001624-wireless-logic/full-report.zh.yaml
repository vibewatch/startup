chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与全球覆盖
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 是领先的独立全球 IoT 连接和托管服务平台提供商，于 19 November 1999 在 England 注册成立，Companies House 编号 03880663，SIC
              代码 61200（无线电信活动）。公司最初名为 @U Media Publishing Limited，January 2001 更名为 MYWASP Limited，October 2001 成为
              Wireless Logic Limited。当前注册办公室位于 4th Floor, The Davidson Building, The Forbury, Reading, England；运营层面，公司常与
              Surrey 的 Guildford 和 Maidenhead 一带联系在一起。联合创始人 Oliver Tucker 和 Philip Cole 创办这家公司，是为了填补移动网络与需要专门 M2M/IoT
              托管服务层的组织之间的空白——官方 our-story 页面中的表述是：“从一开始，Wireless Logic 的主张就不只是连接本身。”


              公司核心产品 Conexa 平台提供专为 IoT 连接设计的运营商级网络，客户可以从一个管理界面跨任何网络和地域连接、控制并保护 IoT 设备。产品覆盖移动网络（multi-SIM、eSIM/eUICC、通过
              SGP.32 做嵌入式 SIM 配置）、卫星（自 April 2024 授权转售 Starlink LEO）、专网、异常检测和 AI 驱动的安全分析。Wireless Logic 覆盖 13+
              个垂直行业，包括农业、医疗、能源、工业 4.0、交通、物流、安防、智能楼宇、智慧城市、零售、公共部门、环境和消费设备。


              截至 May 2025，Wireless Logic 通过 750+ 个全球网络，在 165 个国家连接超过 18 million 台 IoT 设备，服务 25,000+ 企业和商业客户。公司与 53
              家移动网络运营商合作，为从医疗监测器到智能交通系统的关键任务应用提供 IoT 连接。这种规模让 Wireless Logic 成为欧洲市场领先的独立 IoT 连接平台；其连续第四次进入 2025 Gartner
              托管 IoT 连接服务魔力象限，并且是领导者象限中唯一独立 IoT MVNO，也验证了这一位置。
