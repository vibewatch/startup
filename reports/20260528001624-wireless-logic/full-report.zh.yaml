      - number: '8.5'
        title: 证据展项
        blocks:
          - type: callout
            title: £3.5 billion 估值下继续研究 / 观察
            body: >-
              Wireless Logic 是真正的 IoT 平台领导者，规模可验证，机构背书强。但 £3.5 billion 估值对应已确认 FY2024 收入 10–14x 和约 34x
              EBITDA，相比所有公开和私有可比对象都偏高。上调至买入需要从经审计管理账目确认 FY2025 收入 ≥£380M、净债务 ≤4x EBITDA、NRR >110%。不要基于未经验证的前瞻预测按当前标记承销。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV017
              - CV042
              - CV051
          - type: callout
            title: CV-squared 结构带来治理与流动性担忧
            body: >-
              Montagu 针对 Wireless Logic 设立的第二只延续基金，是罕见的 CV-squared 结构，同一 GP 在两只连续延续基金之间为资产定价。Bloomberg
              将这种做法列为投资人担心定价冲突和价值兑现延迟的来源。该结构限制 LP 流动性，并把定价权交给 GP，而不是公平交易市场。二级买方（TPG、CVC、Partners
              Group）完成尽调，提供了一定验证，但治理风险仍然重要，需要跟踪。
            calloutType: risk
            claimRefs:
              - CV048
