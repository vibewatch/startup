  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic 位于一个拥挤但分层的托管 IoT 连接市场。最相关的直接对比对象不只是其他 UK 或欧洲 IoT
              MVNO；买方也可以选择电信支持的聚合商、公共超大规模云连接平台、汽车专用厂商、卫星蜂窝混合方案，以及更简单的开发者优先 SIM 工具。因此，实际采购问题不是“还有谁卖
              SIM？”而是“谁能为这种具体部署形态管理合规、韧性、支持和成本？”


              Wireless Logic 的竞争姿态先从广度开始。公司称连接超过 18 million 台设备，覆盖 165 个国家和 750+
              个网络，并靠收购拓宽区域覆盖和平台深度。这让它在足迹和本地服务密度上领先小型挑战者，但并没有消除替代压力：Vodafone 和 Deutsche Telekom
              现在也能承诺受监管的本地配置文件和卫星延伸，Hologram 和 1NCE 则把价格敏感客户拉向更简单的方案。市场仍然分散，因为没有一家供应商能同时最适合汽车 OEM、远程工业资产、低数据传感器和全球企业资产。
