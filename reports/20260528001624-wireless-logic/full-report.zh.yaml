    columns:
      - 规则 / 事项
      - 司法辖区
      - 状态 / 时间线
      - WL 面临概率
      - 严重性
      - 缓释措施
      - 剩余风险
      - 尽调路径
    rows:
      - - PSTI Act 2022——IoT 产品安全义务与 OPSS 执法
        - 英国
        - 2024 年 4 月 29 日生效；OPSS 自 2024 年下半年起主动执法
        - 中-高
        - 高
        - Conexa IoT 安全框架；SIM 级身份；客户入驻控制
        - 不合规连接产品最高面临 £10m 或全球营业额 4% 的罚款敞口
        - 取得 OPSS 合规证明；审查 PSTI 下分销合作伙伴义务
      - - EU Cyber Resilience Act——产品合规与事件报告
        - 欧盟 / 欧洲经济区
        - 2026 年 9 月 11 日起报告漏洞；2027 年 12 月 11 日起全面合规
        - 高
        - 高
        - 需要 CRA 准备计划；与 2025 年 8 月 1 日生效的 Radio Equipment Directive 有重叠
        - 最高罚款 €15m 或全球营业额 2.5%；不合规产品禁止进入欧盟市场
        - 按 CRA 风险类别映射产品组合；任命欧盟合规负责人
      - - NIS2 Directive——事件报告与关键基础设施义务
        - 欧盟成员国（含德国、法国、荷兰）
        - 德国 NIS2 法 2025 年 12 月；2026 年 3 月起注册；其他国家正在转化为国内法
        - 高
