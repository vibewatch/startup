      - number: '5.2'
        title: eSIM、远程 SIM 配置与全球漫游
        blocks:
          - type: paragraph
            body: >-
              eSIM 和远程 SIM 配置（RSP）能力，是 Wireless Logic 最突出强调的技术差异点。核心价值在于，设备制造商或方案商可以把单一设备 SKU 发往全球任何地方，设备内已嵌入 eSIM 或
              iSIM，之后再通过空中写入配置或切换连接配置文件，无需接触硬件。这省掉了按国家准备 SIM SKU
              的物流负担，也允许部署中途更换运营商或配置文件——既有助于进入新市场，也能处理永久漫游限制（监管约束禁止注册在外国运营商名下的 SIM 无限期漫游到所在国网络）。


              Wireless Logic 的 multi-IMSI 能力与之互补：单张 SIM 携带多个网络身份，可按规则在 MNO 之间自动故障切换，不必 OTA 切换配置文件。SIM
              内控制功能会识别网络劣化，并切向替代无线或核心网，目标是在安全关键或高可用部署中实现零中断运行。


              Thales 合作（2025 年 3 月）是对平台适配度的有用独立验证：Thales 选择 Wireless Logic 的 Conexa bootstrap profile，在制造环节预装到 Thales
              Adaptive Connect eSIM（基于 SGP.32）上，意味着 Thales 客户首次上电即可通过 Wireless Logic 的 Conexa 与漫游伙伴网络获得全球连接。类似地，Wireless
              Logic 的 Conexa eSIM 被嵌入 u-blox 的 SARA-R10001DE LTE Cat-1 BIS 模块（2024 年 11 月），u-blox 明确把捆绑连接的成本节省和单一 SKU
              简化列为商业驱动因素。


              公司还在 2024 年 4 月获任 Starlink 授权经销商，把 LEO 卫星连接与蜂窝网络整合，用于偏远或复杂环境下的混合部署；交付由子公司 Blue Wireless 承担，并在 70+
              个国家提供有保障的 SLA。可服务用例因此延伸到矿业、海事、建筑和农业等地面蜂窝缺失的场景。
