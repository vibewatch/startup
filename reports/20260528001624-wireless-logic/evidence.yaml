evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: >-
      Full board composition of Wireless Logic Group including all non-executive director seats, Montagu observer seats,
      and any management incentive scheme trustee appointments is not publicly disclosed.
    whyItMatters: >-
      Incomplete board visibility makes it impossible to assess concentration of independent oversight, potential
      related-party conflicts among PE board nominees, and alignment between management incentives and LP economics.
    diligencePath: >-
      Request board composition schedule from Montagu; review Companies House officer filings for director
      appointment/resignation history on Wireless Logic Group Limited (07033895).
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      The exact percentage stake acquired by General Atlantic in the May 2025 transaction has not been disclosed;
      Montagu's remaining stake percentage is also undisclosed.
    whyItMatters: >-
      Stake sizes govern control rights, anti-dilution provisions, and secondary market pricing against the £3.5B
      valuation; unknown stakes make governance and exit scenario analysis speculative.
    diligencePath: >-
      Request term sheet or side letter from Montagu or General Atlantic; inspect regulatory filings if Wireless Logic
      Group files full accounts disclosing shareholder register.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      The group's debt/leverage structure, interest burden, and covenant terms are not publicly disclosed; FY April 2025
      Blue Holdco accounts are not yet available.
    whyItMatters: >-
      The €2B SACV and two investment rounds in 2025 likely involve significant leverage; interest costs at elevated
      rates could reduce free cash flow materially and affect the 20% YoY growth sustainability.
    diligencePath: >-
      Request full group capital structure from Montagu; review Blue Holdco April 2025 accounts when filed with
      Companies House (due January 2027).
    relatedQuestionRefs:
      - QO030
  - type: conflicting-data
    severity: minor
    topic: scale
    missingEvidence: >-
      Workforce analytics platform Revelio Labs estimates ~495 employees at end-2025 while investor materials and media
      references imply approximately 1,000 employees across the group including subsidiaries.
    whyItMatters: >-
      Headcount is a proxy for operational leverage and integration capacity; a group with 1,000 employees is a
      different integration risk profile from one with 500.
    diligencePath: >-
      Request group headcount breakdown by entity and geography from management; cross-reference with LinkedIn employee
      counts per subsidiary.
    relatedQuestionRefs:
      - QO013
  - type: enumeration-incomplete
    severity: minor
    topic: acquisitions
    missingEvidence: >-
      Five acquisitions completed in the 2018-2019 period in Denmark, UK, Germany, and the Netherlands were mentioned in
      the 2019 chairman announcement but have not been individually named in public press releases.
    whyItMatters: >-
      These undisclosed acquisitions form part of the 15 strategic acquisitions count; the technologies and any
      contingent liabilities associated with them cannot be assessed without names and deal terms.
    diligencePath: >-
      Request full M&A schedule from Montagu; check target-country company registries for Wireless Logic Group
      subsidiary entities.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO004
