  topStrengths:
    - >-
      Wireless Logic has real scaled proof rather than pilot-stage narrative: 25,000+ customers, 18M+ devices,
      165-country reach, and 750+ network relationships support enterprise relevance.
    - >-
      The platform is more than connectivity resale: Conexa, SIMPro, eSIM capabilities, and security tooling create a
      higher-value control plane than a basic MVNO airtime business.
    - >-
      FY2024 Companies House data and sponsor communications support strong economics for a private infrastructure-like
      software asset, including £256.7M revenue, £102.3M underlying EBITDA, and 20% growth commentary.
  topRisks:
    - >-
      The May 2025 £3.5B valuation implies premium multiples on confirmed FY2024 revenue and EBITDA, while FY2025
      revenue, leverage, and cap-table details remain insufficiently disclosed.
    - >-
      Wireless Logic still depends on external carrier partners, roaming rules, and tightening IoT cyber/data
      regulation, so outage, pricing, or compliance shocks could transmit directly into customers and margins.
    - >-
      The acquisition-led expansion strategy has created integration and accounting complexity, reflected in large
      statutory losses and unresolved questions around gross margin mix, retention, and concentration.
  unresolvedGaps:
    - >-
      FY2025 consolidated revenue, net debt, leverage, and any updated sponsor-clearing valuation support are still the
      biggest blockers to clean underwriting.
    - >-
      No public source retained in this run discloses Wireless Logic's NRR, GRR, churn, customer concentration, or
      average contract duration.
    - >-
      Gross margin by connectivity pass-through versus platform or managed-services revenue is not public, so the right
      long-term comp set remains partly unresolved.
    - >-
      The exact economics and governance implications of the 2025 continuation-vehicle structure still require
      fund-level diligence materials rather than public summaries alone.
