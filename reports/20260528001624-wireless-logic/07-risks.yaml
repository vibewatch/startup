- id: execution-cybersecurity-and-people-risk
  title: Execution, cybersecurity, and people risk
  body: "Wireless Logic's public customer review record introduces execution and service-quality risk\
 that is disproportionate to the company's enterprise positioning. The Trustpilot rating is 2.7/5\
 (Poor) based on 11 reviews, with multiple recent adverse entries: a February 2026 reviewer describes\
 'appalling service, no understanding of the customer, changing staff — avoid like the plague'; a\
 November 2025 reviewer reports a 30-hour network outage with no support response after a platform\
 upgrade; a third reviewer describes being locked into an expensive contract; and a long-term customer\
 reports that 'SIMPro doesn't work and doesn't give me any useful data' and that 'WL have confessed\
 that customers as small as me don't get specific customer service'. While the low review volume limits\
 statistical inference, the pattern is consistent with rapid scaling outpacing service and platform\
 quality at the SME segment. On people risk, co-founder Philip Cole departed in 2019; CEO Oliver Tucker\
 is the sole active founder and a key-person dependency. General Atlantic's minority investment does\
 not include disclosed management guarantees. From a cybersecurity standpoint, Wireless Logic's Security\
 Management Framework document outlines defend, detect and react controls including IoT SAFE certificate\
 identity, SIM-level anomaly detection and encrypted communications. The company acknowledges 1.5 billion\
 IoT device attacks in H1 2021 as the background threat context. No public breach or confirmed incident\
 was identified, but the absence of a public SOC 2 or ISO 27001 disclosure limits independent verification.\
 NIST's April 2026 update to NIST IR 8259r1 adds post-market IoT security lifecycle obligations that\
 will affect Wireless Logic's OEM and enterprise customer base."
