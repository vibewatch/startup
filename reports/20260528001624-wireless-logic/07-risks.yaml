company:
  name: Wireless Logic
chapter:
  number: 7
  title: Risks
  summary: "Wireless Logic's risk profile is shaped by four interlocking vectors: a rapidly tightening\
 regulatory environment (PSTI, EU CRA, NIS2, permanent-roaming bans, data-localisation mandates) that\
 converges on IoT connectivity platforms in 2026-27; structural carrier and technology dependency on\
 MNO wholesale partners whose outages cascade to all MVNO customers; a high-velocity acquisition programme\
 (15+ deals under Montagu) that has created the Blue Holdco pre-tax loss of £222m and substantial integration\
 risk anchored by the April 2025 Arqia/Brazil deal; and a Montagu CV-on-CV continuation vehicle at\
 £3.5bn valuation that constrains exit flexibility and investor liquidity. Adverse customer reviews,\
 SIMPro platform instability, and a CEO key-person dependency add execution texture. No material litigation,\
 enforcement action or confirmed data breach was identified, which keeps residual risk high but not crystallised."
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: "Wireless Logic and its IoT MVNO peers face a uniquely dense convergence of regulatory obligations\
 in 2026-27 that carry significant compliance cost and potential penalty exposure. The UK Product Security\
 and Telecommunications Infrastructure Act 2022 (PSTI) has been in force since 29 April 2024; penalties\
 reach £10 million or 4% of global turnover and are enforced by the Office for Product Safety and\
 Standards. The EU Cyber Resilience Act entered into force on 10 December 2024: vulnerability and incident\
 reporting obligations apply from 11 September 2026 and full product-conformity obligations from 11\
 December 2027, with fines up to €15 million or 2.5% of worldwide annual turnover. The NIS2 Directive\
 requires significant incident reports within 24 hours; Germany, one of Wireless Logic's largest European\
 markets, registered its NIS2 national law in December 2025 with mandatory operator registration from\
 March 2026. Beyond cybersecurity, Transformainsights finds that data-localisation mandates across Brazil,\
 China, India, and several Middle East jurisdictions now require IoT data to remain within national borders,\
 directly constraining Wireless Logic's cloud-platform centralisation model. The ICO published its first\
 draft IoT data-protection guidance in June 2025, covering data minimisation, informed consent and user\
 rights, adding UK GDPR compliance overhead for product integrators. Bratby Law warns that many IoT\
 platform operators incorrectly assume they fall outside UK telecoms regulation since the Communications\
 Act 2003 test is functional not categorical. No public enforcement action, regulatory fine or litigation\
 involving Wireless Logic was identified as of May 2026, which positions current regulatory risk as\
 prospective but material rather than already crystallised."
