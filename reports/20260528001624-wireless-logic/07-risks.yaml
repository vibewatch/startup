- id: carrier-dependency-and-technology-risk
  title: Carrier dependency and technology risk
  body: "Wireless Logic's GSMA-certified Conexa multi-MNO core is the company's primary technical\
 differentiator, providing automatic carrier switching across 50+ mobile and satellite operator\
 partnerships covering 165 countries. This architecture meaningfully reduces single-carrier risk but\
 does not eliminate it: radio access remains dependent on underlying MNO infrastructure, and a\
 simultaneous outage across multiple carriers in a geography would still cascade to all connected\
 IoT devices. The August 2025 Verizon wireless outage, which affected approximately 23,000 users,\
 demonstrated how MNO infrastructure failures propagate through MVNOs and enterprise IoT fleets even\
 when the MVNO has multi-network fallback. Group MD Europe Cyril Deschanel acknowledged in January 2026\
 that a year of high-profile outages in 2025 required the industry to move beyond coverage toward\
 resilience and security. Technology risk extends to competitive displacement: the SGP.32 standard\
 lowers the barrier to entry for new IoT connectivity providers by enabling remote eSIM provisioning\
 without physical SIM swaps, while global private 5G/LTE network deployments create an alternative\
 path that bypasses public MVNO infrastructure entirely. IoT For All data shows that the MVNO market\
 reached 290 million managed connections in 2025 with new low-cost entrants compressing pricing;\
 value-added services still constitute a small share of MVNO revenue, leaving commoditisation pressure\
 high. MVNO Index notes that reconciliation and revenue assurance are becoming critical failure points\
 as international expansion adds multi-geography billing complexity. Wireless Logic's Starlink reseller\
 agreement adds satellite dependency as a new contract and technology integration layer."
