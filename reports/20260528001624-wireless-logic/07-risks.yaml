- id: acquisition-integration-and-financial-risk
  title: Acquisition integration and financial risk
  body: "Wireless Logic has completed over 15 acquisitions under Montagu ownership since 2018, including\
 Arkessa, Eseye, Comms365, Zipit Wireless, and Arqia. Each successive deal adds integration complexity\
 across HR, IT systems, product platforms, and go-to-market motions. The April 2025 Arqia acquisition\
 is the highest-integration-risk transaction to date: Arqia operates in Brazil with approximately 3\
 million managed connections and holds one of only 15 ANATEL-authorised MVNO licences in the country.\
 Brazil's data-localisation requirements, Portuguese-language workforce, and distinct regulatory regime\
 all create meaningful cultural and operational friction. CEO Oliver Tucker acknowledged that international\
 expansion typically takes three times as long and three times as much capital as originally planned.\
 On the financial side, Blue Holdco (Wireless Logic's immediate parent entity) reported revenues of\
 £256.7 million and underlying EBITDA of £102.3 million for the year to April 2024, but a pre-tax loss\
 of £222.3 million driven by £141 million in acquisition-related costs. This accounting loss does not\
 signal operational distress given the EBITDA profile, but it does indicate that the debt-and-amortisation\
 stack from rapid acquisition remains material. The consolidating IoT MVNO market adds a structural\
 backdrop: Telenor IoT found the market is approximately five times more fragmented than conventional\
 B2B markets, meaning continued acquisitive growth is operationally necessary but capital-intensive,\
 and integration execution risk accumulates with each transaction."
