- id: sponsor-governance-and-exit-risk
  title: Sponsor governance and exit risk
  body: "Montagu's December 2025 €2 billion CV-on-CV continuation vehicle — led by TPG GP Solutions\
 with CVC Secondary Partners and Partners Group as co-leads — is a significant governance event. A\
 continuation vehicle extends ownership beyond the typical 4-6 year PE fund cycle, rolling existing\
 LP interests into a new vehicle at a negotiated NAV. The structure signals Montagu's conviction in\
 the Wireless Logic thesis and preference for a longer hold over a near-term IPO or trade sale, but\
 it also reduces liquidity options for original fund investors and increases governance complexity as\
 the LP register changes. The £3.5 billion valuation implied by the May 2025 General Atlantic minority\
 stake and the December 2025 continuation vehicle prices entry at a significant premium to the\
 underlying Blue Holdco pre-tax loss disclosed for April 2024. Bloomberg described the structure as\
 a 'CV-squared' deal in which LPs of one continuation vehicle roll into a second, a rare mechanism\
 that adds further distance from a conventional IPO or auction exit. Board composition is strong:\
 Vittorio Colao (ex-Vodafone CEO, EMEA VP General Atlantic) and Sir Michael Rake (ex-BT Chairman)\
 position the company for an eventual IPO, but no S-1 or filed prospectus was identified as of May 2026.\
 The risk for an investor is that the continuation structure compresses the exit window and creates a\
 scenario where the company is held until the next continuation cycle or a fundamental change in market\
 conditions forces a sale."
