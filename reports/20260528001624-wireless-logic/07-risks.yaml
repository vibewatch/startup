  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-leverage
    missingEvidence: "Blue Holdco audited FY2025 financials, net debt schedule, debt-to-EBITDA leverage\
 multiple, interest coverage ratio, and covenant terms associated with the acquisition credit facility."
    whyItMatters: "The Blue Holdco pre-tax loss of £222m in FY2024 demonstrates the scale of\
 acquisition-related leverage; without the debt schedule and coverage ratios, the financial-stress\
 risk cannot be quantified and the monitoring thresholds in TR005 cannot be calibrated."
    diligencePath: "Request Blue Holdco audited FY2025 annual report, financing agreements, and\
 board-approved leverage policy; obtain independent QoE covering EBITDA bridge, net debt, and\
 interest coverage."
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: "SOC 2 Type II report, ISO 27001 certificate, GSMA FS.15 attestation, penetration\
 test summary, subprocessor register, and incident history from a trust portal or due-diligence\
 package."
    whyItMatters: "Wireless Logic's Security Management Framework is a marketing leaflet, not an\
 independent assurance report. Without the underlying certifications, investors cannot verify the\
 maturity of cybersecurity controls or incident-response readiness — material given the EU CRA and\
 NIS2 obligations that apply from September 2026."
    diligencePath: "Request third-party assurance package covering SOC 2, ISO 27001 and any GSMA\
 security certifications; obtain penetration-test letter and incident-response policy."
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
  - type: access-blocked
    severity: material
    topic: arqia-integration-status
    missingEvidence: "Post-acquisition Arqia revenue and margin contribution, ANATEL licence continuity\
 confirmation, and integration KPI milestones for the Brazil operation since April 2025."
    whyItMatters: "The Arqia deal closed in April 2025 — 13 months before this report date. Its\
 financial and operational performance is not yet visible in the FY2024 Blue Holdco accounts. Brazil\
 is a restricted-roaming market with only 15 ANATEL licences, making this an undiversifiable\
 regulatory dependency."
    diligencePath: "Obtain Arqia standalone P&L from closing date; confirm ANATEL licence transfer\
 or assignment to Wireless Logic entity; review integration-milestone tracker."
    relatedQuestionRefs:
    - QR011
    - QR026
    relatedTableRefs:
    - TR003
    - TR004
