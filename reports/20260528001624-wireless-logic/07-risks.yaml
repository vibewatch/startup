    severity: material
    topic: regulatory-compliance-status
    missingEvidence: "Internal CRA product-portfolio mapping, NIS2 operator registration status per\
 EU subsidiary, PSTI self-assessment records, and any correspondence with OPSS, ICO or national\
 data-protection authorities."
    whyItMatters: "With CRA reporting obligations starting September 2026 and NIS2 German\
 registration from March 2026, Wireless Logic's regulatory readiness posture is not publicly\
 verifiable. Non-compliance risk is high given the convergent timeline and multi-jurisdiction scope."
    diligencePath: "Request regulatory compliance roadmap covering CRA, NIS2, PSTI and Data Act;\
 confirm NIS2 registration filing status per EU member state of operation."
