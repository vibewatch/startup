- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Acquisition-built geographic breadth and channel access
    - Integration debt or uneven customer experience across acquired assets
    - High
    - Diligence platform unification, support handoff metrics and cross-sell success by acquired cohort
  - - Carrier-agnostic platform and large SIM estate
    - eSIM lowers migration friction and multi-homing makes absolute lock-in weaker
    - Medium
    - Request evidence of churn, NRR, API stickiness and migration cost for global estates
  - - Compliance and localisation know-how
    - Regulation changes faster than roaming aggregators can adapt
    - High
    - Test local-profile coverage, lawful intercept readiness and country-by-country roaming restrictions
  - - Managed service and security layer
    - Aeris, Tele2, Vodafone and Deutsche Telekom are layering security and managed operations into their offers
    - Medium
    - Benchmark private APN/VPN, NOC, threat response and SLA commitments against named peers
  - - Broad horizontal footprint
    - Specialists such as Cubic and ORBCOMM win automotive or remote-industrial workloads
    - Medium
    - Segment win rates by vertical to verify where horizontal breadth beats specialist depth
  - - PE-backed capital and acquisition capacity
    - Price compression can outpace value creation if M&A breadth does not translate into higher-margin platform usage
    - Medium
    - Inspect margin bridge by service layer, not just connection growth or acquired revenue
  - - Quote-led enterprise pricing
    - Transparent offers from 1NCE and Hologram anchor procurement expectations downward
    - High
    - Review realised pricing by use case and show where managed compliance/support earns a premium
  - - Single-supplier convenience for multinationals
    - Vodafone and Deutsche Telekom can pitch similar single-accountability stories from owned-network positions
    - High
    - Pressure-test win/loss data versus incumbent-led deals in regulated or large-enterprise accounts
  notes: This register assesses durability of Wireless Logic’s moat claims, not generic market risks. Severity reflects potential to compress pricing power or displace Wireless Logic in target accounts if not mitigated.
