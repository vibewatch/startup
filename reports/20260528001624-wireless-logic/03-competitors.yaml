  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realised Wireless Logic pricing, support-tier uplift, discount schedules and blended ARPU by deployment shape are not public.
    whyItMatters: The chapter can identify price anchors and quote opacity, but not whether Wireless Logic earns a justified premium versus 1NCE, Hologram or incumbent-led alternatives.
    diligencePath: Request anonymised price books, cohort-level realised price data and a competitor-by-competitor win/loss pricing analysis for top verticals.
    relatedQuestionRefs:
    - QP017
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost-quantification
    missingEvidence: Public sources do not provide Wireless Logic churn, NRR, implementation timelines or measured migration costs for large estates.
    whyItMatters: Moat durability hinges on whether portal, compliance and support workflows translate into durable retention rather than soft preference.
    diligencePath: Ask for churn cohorts, migration case studies, NRR by geography and evidence of how long it takes customers to move multi-country fleets between providers.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: customer-overlap
    missingEvidence: Named-customer overlap by vertical and geography between Wireless Logic and Aeris, KORE, Eseye, Transatel and Tele2 is only partially visible in public materials.
    whyItMatters: Overlap data would clarify whether competitors are colliding in the same budget lines or mostly solving adjacent deployment patterns.
    diligencePath: Build a customer logo overlap sheet from CRM, RFP records and disclosed case studies for transport, utilities, healthcare and industrial accounts.
