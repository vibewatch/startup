company:
  name: Wireless Logic
chapter:
  number: 3
  title: Competitors
  summary: Wireless Logic competes in a large but segmented managed IoT connectivity market where no single rival dominates every deployment type. The strongest direct peers combine global reach with orchestration or security depth, incumbents such as Vodafone and Deutsche Telekom narrow the substitute gap through local-profile and satellite-capable offers, and transparent-price challengers such as 1NCE and Hologram anchor the low end of the market. Wireless Logic’s breadth, platform and acquisition cadence are meaningful strengths, but the moat remains medium durability because pricing is opaque, eSIM lowers hard lock-in and workload specialists can still beat it in automotive or remote-industrial niches.
sections:
- id: landscape-overview
  title: Landscape overview
  body: |-
    Wireless Logic sits in a crowded but segmented market for managed IoT connectivity. The most relevant direct comparisons are not just other UK or European IoT MVNOs; buyers can also choose telco-backed aggregators, public hyperscale connectivity platforms, automotive specialists, satellite-cellular hybrids and simpler developer-first SIM tools. The practical buying question is therefore not “who else sells SIMs?” but “who can manage compliance, resilience, support and cost for this specific deployment shape?”

    Wireless Logic’s competitive posture starts from breadth. The company says it connects more than 18 million devices across 165 countries and 750+ networks and has used acquisitions to widen regional coverage and platform depth. That puts it ahead of smaller challengers on footprint and local service density, but it does not eliminate substitute pressure because Vodafone and Deutsche Telekom can now promise regulated local profiles and satellite extensions, while Hologram and 1NCE pull price-sensitive customers toward simpler offers. The market remains fragmented because no one vendor is simultaneously best for automotive OEMs, remote industrial assets, low-data sensors and global enterprise estates.
