- id: capability-pricing
  title: Capability and pricing comparison
  body: |-
    The cleanest way to compare this market is along five dimensions: network breadth, orchestration depth, localisation and compliance, support and security, and price transparency. Wireless Logic scores well on the first four. It has meaningful scale, a broad acquisition-built footprint and a platform story shaped around secure global management. Yet the company looks like most enterprise peers on the fifth dimension: public pricing is largely absent. The same is true for Eseye, Transatel, POND, emnify, KORE and Aeris.

    That opacity matters because transparent challengers create anchor points. 1NCE broadcasts a prepaid low-data offer and Hologram publishes developer pricing with explicit per-MB and per-SIM charges. Those are not apples-to-apples substitutes for a fully managed global estate, but they do sharpen procurement scrutiny on what support, compliance handling and orchestration actually justify in enterprise quotes. Tele2, Pelion and Telit sit in the middle, showing trials, kits or flexible plans but not a full, comparable list price. In other words, price discovery in this market still depends heavily on buyer context and negotiated packaging, not on a public rack rate.
