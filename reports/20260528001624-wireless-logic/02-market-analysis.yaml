      "id": "buyer-payer-segmentation",
      "title": "Buyer personas, budget owners, and procurement paths",
      "body": "The primary buyer of enterprise IoT managed connectivity is an operations or technology decision-maker at a company that depends on connected device fleets to deliver its product or service. Wireless Logic's confirmed sectors span agriculture, healthcare, manufacturing, transport, energy and utilities, smart cities, and retail; these map to distinct buyer archetypes whose budget ownership, adoption triggers, and evaluation criteria differ sharply.\n\nIn industrial manufacturing and energy, the buyer is typically an OT/engineering or digital transformation lead buying under capex or operational technology budgets; their trigger is process automation, predictive maintenance, or smart metering mandates. In healthcare, the buyer is a medical device OEM or hospital group procuring connectivity for remote monitoring equipment; regulatory compliance (HIPAA, MDR, CRA) shapes the evaluation and the payer is the device manufacturer who bundles connectivity into product economics. In smart mobility and micro-mobility (e-scooters, shared vehicles), the buyer is a fleet operator procuring track-and-trace and OTA update capability, typically with per-device monthly service fees embedded in their SaaS pricing. In agriculture, precision farming vendors or agri-tech companies are the buyers, often selecting NB-IoT or LTE-M for low-power, wide-area sensor networks.\n\nAll enterprise segments share a common procurement dynamic: connectivity is typically a managed service embedded into a longer-term contract (12–36 months), sold through direct enterprise sales supplemented by OEM and channel partner motions. Wireless Logic's partnership with Thales — a device security and eSIM hardware provider — exemplifies the OEM channel: Thales preloads Wireless Logic's bootstrap profile on eSIMs, directing device-level activations toward Wireless Logic's Connexa platform. This OEM-embedded model creates device-level lock-in and shifts the payer from the end enterprise to the OEM who distributes the connectivity cost within hardware or platform pricing. The Ultra-Protect case study (NHS/TfL/Surrey Fire) illustrates the direct enterprise buyer path: a vertical SaaS provider buys NB-IoT connectivity per sensor, embedding monthly fees in customer contracts. Budget ownership sits with the service provider's CTO or product team rather than a dedicated connectivity procurement function, which is characteristic of smaller IoT-native customers.",
      "claimRefs": ["CM013", "CM014", "CM015", "CM016", "CM017", "CM018", "CM019", "CM020", "CM021"],
      "tableRefs": ["TM003"],
      "figureRefs": ["FM003"]
    },
    {
      "id": "demand-drivers-and-constraints",
      "title": "Demand drivers, adoption constraints, and adverse evidence",
      "body": "The primary demand drivers are the continued expansion of connected device estates, escalating regulatory requirements, and the maturation of enabling technology standards. Ericsson estimates total cellular IoT connections at approximately 4.5 billion by end-2025 growing toward 8 billion by 2031 at roughly 10% CAGR, establishing a large and expanding base of devices requiring managed connectivity. The EU Cyber Resilience Act (CRA, Regulation (EU) 2024/2847) adds a structural regulatory driver: manufacturers of connected products sold in the EU must begin reporting actively exploited vulnerabilities by September 11, 2026 and achieve full conformity by December 11, 2027. Non-compliance carries fines of up to €15 million or 2.5% of global annual turnover. This creates a compliance-pull toward managed connectivity providers who can demonstrate lifecycle security, SIM-level encryption, and incident reporting workflows. Similarly, data-sovereignty mandates in Europe and Asia-Pacific are increasing demand for localised SIM provisioning — a capability Wireless Logic executives cite as a key competitive requirement entering 2026.\n\nThe SGP.32 eSIM standard (IoT-specific remote SIM provisioning) is both a driver and a constraint. It enables remote profile switching at scale, reducing the need for hardware replacement when changing network or geography — a genuine operational benefit for enterprises with large, geographically-distributed fleets. However, Wireless Logic's own product leadership cautions that 'eSIM is just a delivery vehicle for connectivity, not necessarily a unicorn new product,' and that SGP.32 will lower barriers to entry, bringing consumer-focused MVNOs into IoT — potentially intensifying price competition. Transforma Insights' 2025 CSP benchmarking highlights price erosion as the 'overriding key theme,' with CSPs pursuing mechanisms across six dimensions (Software, Supply, Scale, Services, Solutions, Systems) to maintain margins.\n\nAdverse evidence is material. Enterprise IoT spending grew only 10% in 2024, the slowest rate in over a decade (IoT Analytics), with hardware segments declining 8%; the manufacturing sector and Europe were disproportionately affected. Industry surveys suggest that 60–80% of IoT projects fail before reaching production, and only 20–30% are judged fully successful, pointing to persistent deployment complexity that constrains market realisation. ABI Research documents that LPWA network growth and disruptive pricing have deflated connectivity ARPU, forcing MVNOs to seek value-added service revenue — but VAS revenues for the whole MVNO sector are forecast at only $1.9 billion by 2030 (44% of service revenues), modest relative to the scale of managed connectivity revenues claimed. The practical implication is that Wireless Logic competes in a high-growth market with deteriorating unit economics for pure connectivity; its defensibility depends on managed platform depth, vertical customer lock-in, and cross-selling VAS to its 25,000-customer base.",
      "claimRefs": ["CM022", "CM023", "CM024", "CM025", "CM026", "CM027", "CM028", "CM029", "CM030", "CM031", "CM032", "CM033", "CM034", "CM035"],
