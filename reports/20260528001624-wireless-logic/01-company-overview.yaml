  - id: "leadership-governance-and-key-persons"
    title: "Leadership, Governance, and Key-Person Assessment"
    body: "Oliver Tucker, co-founder and CEO, has led Wireless Logic since its founding in 2000 and remains the dominant strategic figure and public face of the business in 2026. His 26-year tenure, combined with the 2025 departure of co-founder Philip Cole from the company (Cole left in 2019 and later founded Hyper Logical), creates a material key-person concentration around Tucker. In May 2025, Tucker confirmed that international expansion costs approximately three times as much as initially expected, signalling both ambition and execution risk in the company's LATAM/APAC thrust.\n\nBoard governance is supported by a high-profile non-executive chairman: Sir Michael Rake, appointed effective 1 June 2019, who brings experience as former Chairman of BT Group, Worldpay Group, KPMG (UK and International), easyJet, and President of the Confederation of British Industry. In May 2025, General Atlantic's Vice Chairman of EMEA Vittorio Colao — former CEO of Vodafone Group and former Italian Minister for Technological Innovation — joined the board, materially deepening the company's telecoms-operator network. Cyril Deschanel was simultaneously appointed Managing Director for Europe, bringing IoT leadership experience from Vodafone and Tele2.\n\nThe senior management team includes Richard Miller as CFO, Matt Thomas as Chief Product Officer, Matthew Tate as Chief Operations Officer, and John Dillion as Managing Director of Product and Marketing. Board-level governance detail (committee structure, observer rights, GP/LP consent thresholds) is not publicly available given Wireless Logic's private status; this constitutes a standard diligence gap for PE-backed companies at this stage."
