company:
  name: "Wireless Logic"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Wireless Logic is a UK-founded IoT connectivity platform founded in 2000 by Oliver Tucker and Philip Cole that pivoted to M2M/IoT in 2007 and has compounded under successive private-equity owners — ECI Partners (2011), CVC Capital Partners (2015), and Montagu PE (2018) — into Europe's leading independent IoT managed-connectivity provider. As of May 2025 it carries a £3.5 billion valuation anchored by General Atlantic's minority investment alongside a €2 billion Montagu continuation vehicle, with revenues of £256.7 million (year ending April 2024) and a 20% YoY growth rate confirmed by the CEO, offset by a statutory pre-tax loss of £222.3 million driven by £141 million in acquisition costs. With 25,000+ enterprise customers, 18 million+ connected devices, 165 countries, and 15+ acquisitions under Montagu alone, the company is the only independent IoT MVNO in the 2025 Gartner Magic Quadrant Leaders quadrant."

sections:
  - id: "identity-product-and-global-footprint"
    title: "Identity, Product, and Global Footprint"
    body: "Wireless Logic is a leading independent global Internet of Things connectivity and managed-services platform provider, legally incorporated in England on 19 November 1999 under Companies House number 03880663 and registered under SIC code 61200 (Wireless telecommunications activities). The company was originally named @U Media Publishing Limited, renamed MYWASP Limited in January 2001, and became Wireless Logic Limited in October 2001. The current registered office is at 4th Floor, The Davidson Building, The Forbury, Reading, England; operationally the company is commonly associated with the Guildford and Maidenhead area of Surrey. Co-founders Oliver Tucker and Philip Cole established the business to fill a gap between mobile networks and organisations requiring a dedicated M2M/IoT managed-services layer — a vision laid out on the official our-story page: \"From the very beginning, Wireless Logic's proposition went beyond mere connectivity.\"\n\nThe company's core product, the Conexa platform, provides a purpose-built carrier-grade IoT connectivity network enabling customers to connect, control, and secure IoT devices across any network and geography from a single management interface. The offering spans mobile (multi-SIM, eSIM/eUICC, embedded SIM provisioning via SGP.32), satellite (Starlink LEO via authorised reseller agreement since April 2024), private networking, anomaly detection, and AI-driven security analytics. Wireless Logic operates across 13+ vertical sectors including agriculture, healthcare, energy, industry 4.0, transport, logistics, security, smart buildings, smart cities, retail, public sector, environment, and consumer devices.\n\nAs of May 2025, Wireless Logic connects more than 18 million IoT devices across 165 countries through over 750 global networks, serving more than 25,000 enterprise and business customers. The company partners with 53 mobile network operators and provides IoT connectivity for mission-critical applications ranging from medical monitors to smart traffic systems. This scale makes Wireless Logic the market-leading European independent IoT connectivity platform, a position validated by its fourth consecutive appearance in the 2025 Gartner Magic Quadrant for Managed IoT Connectivity Services as the only independent IoT MVNO in the Leaders quadrant."
