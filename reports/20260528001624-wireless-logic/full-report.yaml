  - id: TV005
    title: Thesis-break and kill triggers
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - FY2025 revenue below base
        - Companies House consolidated accounts show <£290M revenue for April 2025 period
        - Confirms market cannot support £3.5B at defensible multiple; bull case collapses
        - Downgrade to avoid; mark at risk of ≥30% markdown
      - - Goodwill impairment on FY2025 balance sheet
        - Any write-down of goodwill from 15 acquisitions on FY2025 or FY2026 accounts
        - Signals acquisition overpayment; reduces intrinsic equity value; CV² investors re-price
        - Downgrade to avoid; seek details on impaired assets
      - - Undisclosed leverage materially above 5x EBITDA
        - Net debt/EBITDA >5x revealed through IPO prospectus, lender disclosure, or refinancing announcement 2026–2027
        - Equity cushion compressed; interest burden constrains investment capacity; exit multiple shrinks
        - Reduce conviction; model levered returns explicitly before any investment
      - - Revenue growth deceleration below 15%
        - Two consecutive six-month periods showing <15% YoY growth in subscription/connectivity revenue
        - Operational plateau; IoT connectivity pricing commoditisation thesis begins to manifest
        - Move to avoid; multiple compression to 5–7x revenue is likely
      - - Customer concentration revealed >20% in single account
        - Diligence or public filing reveals one client >20% of group revenue
        - Revenue concentration risk transforms diversification thesis; churn of one account is existential
        - 'Research-more: obtain customer concentration data before any commitment'
      - - Leadership succession at CEO or exit of key deal originators
        - Oliver Tucker departure announced without successor bench depth confirmed
        - Founder-CEO concentration risk, especially in execution-heavy acquisition strategy
        - Track impact on pipeline and culture before acting
    notes: >-
      Triggers linked to research questions QV024–QV030. All thresholds are observable or discoverable through Companies
      House filings, IPO prospectus, or direct management diligence.
    claimRefs:
      - CV006
      - CV009
      - CV044
      - CV045
      - CV046
      - CV047
      - CV052
  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - FY2025 confirmed revenue
        - Blue Holdco consolidated accounts for year ending 30 April 2025 (filed Dec 2025 at Companies House)
        - Determines whether 7.5x or 10–14x is the correct multiple basis; most critical verification gate
        - Obtain filed consolidated accounts from Companies House or directly from Montagu/Wireless Logic IR
      - - Net debt and leverage ratio
        - LBO debt from 2018 plus any refinancings or incremental acquisition debt; not publicly disclosed
        - Must model equity returns correctly; leverage >5x at IPO would be a material risk
        - Request from Montagu; cross-check against any bond/loan press releases or Bloomberg DLMI data
      - - Customer-level NRR and retention cohort
        - Subscription retention by vintage cohort, expansion vs contraction, churn by segment
        - Premium multiple requires NRR >110%; without it, 10x revenue is not defensible
        - Request directly as part of management presentation; third-party customer interviews
      - - Gross margin by revenue type
        - Connectivity vs. managed services vs. hardware gross margin breakdown
        - Need to distinguish SaaS-like margin profile from lower-margin connectivity pass-through
        - Request audited segmented P&L; cross-check against Gartner Magic Quadrant discussion
      - - Arqia integration status and revenue contribution
        - LATAM revenue contribution post-Arqia (acquired April 2025); integration cost run-rate
        - Arqia adds M2M devices in Brazil but is one of most complex markets; CEO flagged international execution risk
        - Request management accounts for post-acquisition period; interview Arqia management
      - - Key-person succession plan
        - Succession depth for CEO Oliver Tucker and co-founder Philip Cole status post 2019 departure
        - Founder concentration risk in M&A-driven business; departure would reduce deal origination capacity
        - Board composition review; management bench strength assessment
      - - CV² investor redemption rights
        - Terms of the €2B SACV regarding LP transfer restrictions, valuation override triggers, and manager conflicts
        - CV-squared structure limits future liquidity and may embed governance conflicts in pricing
        - Review limited partnership agreement terms; seek legal counsel on Luxembourg SACV structure
    notes: >-
      Diligence asks ordered by materiality to current valuation stance. Items 1 and 2 are blocking for any upgrade from
      research-more to track or buy.
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV048
