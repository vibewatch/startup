      - number: '2.3'
        title: Demand drivers, adoption constraints, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The primary demand drivers are the continued expansion of connected device estates, escalating regulatory
              requirements, and the maturation of enabling technology standards. Ericsson estimates total cellular IoT
              connections at approximately 4.5 billion by end-2025 growing toward 8 billion by 2031 at roughly 10% CAGR,
              establishing a large and expanding base of devices requiring managed connectivity. The EU Cyber Resilience
              Act (CRA, Regulation (EU) 2024/2847) adds a structural regulatory driver: manufacturers of connected
              products sold in the EU must begin reporting actively exploited vulnerabilities by September 11, 2026 and
              achieve full conformity by December 11, 2027. Non-compliance carries fines of up to €15 million or 2.5% of
              global annual turnover. This creates a compliance-pull toward managed connectivity providers who can
              demonstrate lifecycle security, SIM-level encryption, and incident reporting workflows. Similarly,
              data-sovereignty mandates in Europe and Asia-Pacific are increasing demand for localised SIM provisioning
              — a capability Wireless Logic executives cite as a key competitive requirement entering 2026.


              The SGP.32 eSIM standard (IoT-specific remote SIM provisioning) is both a driver and a constraint. It
              enables remote profile switching at scale, reducing the need for hardware replacement when changing
              network or geography — a genuine operational benefit for enterprises with large,
              geographically-distributed fleets. However, Wireless Logic's own product leadership cautions that 'eSIM is
              just a delivery vehicle for connectivity, not necessarily a unicorn new product,' and that SGP.32 will
              lower barriers to entry, bringing consumer-focused MVNOs into IoT — potentially intensifying price
              competition. Transforma Insights' 2025 CSP benchmarking highlights price erosion as the 'overriding key
              theme,' with CSPs pursuing mechanisms across six dimensions (Software, Supply, Scale, Services, Solutions,
              Systems) to maintain margins.


              Adverse evidence is material. Enterprise IoT spending grew only 10% in 2024, the slowest rate in over a
              decade (IoT Analytics), with hardware segments declining 8%; the manufacturing sector and Europe were
              disproportionately affected. Industry surveys suggest that 60–80% of IoT projects fail before reaching
              production, and only 20–30% are judged fully successful, pointing to persistent deployment complexity that
              constrains market realisation. ABI Research documents that LPWA network growth and disruptive pricing have
              deflated connectivity ARPU, forcing MVNOs to seek value-added service revenue — but VAS revenues for the
              whole MVNO sector are forecast at only $1.9 billion by 2030 (44% of service revenues), modest relative to
              the scale of managed connectivity revenues claimed. The practical implication is that Wireless Logic
              competes in a high-growth market with deteriorating unit economics for pure connectivity; its
              defensibility depends on managed platform depth, vertical customer lock-in, and cross-selling VAS to its
              25,000-customer base.
