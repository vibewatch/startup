      - number: '8.3'
        title: Bull, base, and bear scenario analysis
        blocks:
          - type: paragraph
            body: >-
              The bull case requires several conditions to hold simultaneously. Revenue must be growing at 30%+ annually
              and the FY2025 group accounts must confirm revenue of approximately £350 million or above. At £350
              million, the £3.5 billion valuation implies a 10x forward revenue multiple—justifiable for a Gartner Magic
              Quadrant Leader with strong recurring revenue, 40% underlying EBITDA margins, and a secular IoT tailwind.
              In this scenario, the Rule of 40 score (30% growth + 40% EBITDA margin = 70%) exceeds the premium
              threshold for top-decile SaaS, and a 2028-2029 IPO or strategic sale could deliver a 1.5–2x markup on the
              current mark. The IoT market reaching 21.1 billion devices by end-2025 and growing to 39 billion by 2030
              supports the structural long-term demand case.

              The base case assumes 20% revenue growth in FY2025 to approximately £308 million, ongoing M&A-driven cost
              drag from integration, and continued private ownership through 2027–2028. At this trajectory, the company
              could reach £450–500 million in revenue by FY2027, at which point an exit at 8–10x revenue (within the
              range of premium SaaS/IoT infrastructure multiples) would yield approximately £3.6–5 billion in enterprise
              value— broadly supporting the current mark. The key risk in this case is that debt service on undisclosed
              LBO leverage consumes a meaningful share of EBITDA growth, compressing equity returns. Partners Group has
              been invested since 2021 and is already in its second continuation vehicle structure, suggesting a
              multi-year hold with constrained near-term liquidity.

              The bear case centers on execution risk and valuation compression. If international expansion (CEO's own
              admission: "three times as long and costs three times as much") leads to margin erosion, or if 2025
              accounts reveal slower-than-expected revenue growth due to acquisition digestion delays, the 10-14x
              revenue multiple becomes unjustifiable. Bloomberg's coverage of PE continuation vehicles highlights
              governance concerns: GPs selling from one fund to another vehicle they manage inherently creates pricing
              conflict, and secondary buyers may have been priced under optimistic GP projections. A down-round scenario
              in a hypothetical 2027 exit, if revenue growth slows to 10–15% and multiples compress to 6x, would yield
              £2.0–2.5 billion enterprise value— a 30–40% markdown from current marks.
            claimRefs:
