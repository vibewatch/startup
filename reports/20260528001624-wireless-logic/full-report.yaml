  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic and its IoT MVNO peers face a uniquely dense convergence of regulatory obligationsin
              2026-27 that carry significant compliance cost and potential penalty exposure. The UK Product Securityand
              Telecommunications Infrastructure Act 2022 (PSTI) has been in force since 29 April 2024; penaltiesreach
              £10 million or 4% of global turnover and are enforced by the Office for Product Safety andStandards. The
              EU Cyber Resilience Act entered into force on 10 December 2024: vulnerability and incidentreporting
              obligations apply from 11 September 2026 and full product-conformity obligations from 11December 2027,
              with fines up to €15 million or 2.5% of worldwide annual turnover. The NIS2 Directiverequires significant
              incident reports within 24 hours; Germany, one of Wireless Logic's largest Europeanmarkets, registered its
              NIS2 national law in December 2025 with mandatory operator registration fromMarch 2026. Beyond
              cybersecurity, Transformainsights finds that data-localisation mandates across Brazil,China, India, and
              several Middle East jurisdictions now require IoT data to remain within national borders,directly
              constraining Wireless Logic's cloud-platform centralisation model. The ICO published its firstdraft IoT
              data-protection guidance in June 2025, covering data minimisation, informed consent and userrights, adding
              UK GDPR compliance overhead for product integrators. Bratby Law warns that many IoTplatform operators
              incorrectly assume they fall outside UK telecoms regulation since the CommunicationsAct 2003 test is
              functional not categorical. No public enforcement action, regulatory fine or litigationinvolving Wireless
              Logic was identified as of May 2026, which positions current regulatory risk asprospective but material
              rather than already crystallised.
