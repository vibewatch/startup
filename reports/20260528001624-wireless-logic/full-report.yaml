      - number: '8.4'
        title: Investment recommendation, thesis, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The investment recommendation is research-more / track. Wireless Logic is a credible, growing IoT
              connectivity platform with genuine market-leadership evidence: four consecutive Gartner Magic Quadrant
              Leader appearances (the only independent MVNO in the Leaders quadrant), 25,000+ enterprise customers, 18
              million+ connected devices across 165 countries, 15 acquisitions completed under Montagu ownership
              delivering 6x revenue and 7x EBITDA growth since 2018, and a continuation vehicle that was heavily
              oversubscribed by sophisticated institutional secondary investors. These are material strengths.

              However, the current price requires accepting a 10–14x revenue multiple and ~34x underlying EBITDA
              multiple—benchmarks that exceed every public and private IoT comparable and exceed all private SaaS
              medians by a material margin. The only public pure-play IoT MVNO (KORE Wireless) was taken private at 2.5x
              revenue. The premium embedded in the £3.5 billion mark is only defensible if: (1) FY2025 revenue confirms
              ≥£350 million; (2) the underlying EBITDA margin is being sustained or expanding (not eroded by integration
              costs); (3) net debt is disclosed and the leverage ratio is within manageable bounds; and (4) customer
              retention metrics are confirmed as robust. None of these four conditions can be verified from public
              sources.

              The anti-thesis is straightforward: Wireless Logic's pre-tax losses in FY2024 (£222.3M) from
              acquisition-driven amortization and integration costs reflect genuine capital consumption. The CV-squared
              ownership structure—where Montagu is rolling over its stake into a second continuation vehicle—limits LP
              liquidity and creates potential conflicts of interest in pricing. International expansion has been
              explicitly flagged by the CEO as taking three times as long and costing three times as much as projected.
              KORE's fate at 2.5x revenue illustrates that IoT MVNO businesses without strong recurring SaaS
              characteristics face structurally lower multiples in public markets. Finally, the April 2025 financial
              accounts have been filed but are not yet publicly summarized, leaving the key revenue verification gate
              open.

              The recommendation would upgrade to track if FY2025 revenue confirms ≥£330 million and debt/leverage is
              disclosed at ≤4x net debt/EBITDA. It would upgrade to buy if FY2025 revenue confirms ≥£380 million and NRR
              is independently verified above 110%. It would downgrade to avoid if FY2025 revenue comes in below £290
              million or if acquisition integration impairments appear on the FY2025 balance sheet.
            claimRefs:
