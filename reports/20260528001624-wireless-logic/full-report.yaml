        - Enterprise IoT across many verticals
        - Breadth, acquisition-led footprint, purpose-built platform
        - Private pricing and limited public financial disclosure
      - - Eseye
        - Direct managed eSIM platform
        - 800+ networks; 190+ countries; private
        - Global enterprise IoT and operator enablement
        - AnyNet+ + Infinity; near-100% uptime; strong eSIM orchestration
