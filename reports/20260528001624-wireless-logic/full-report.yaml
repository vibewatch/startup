      - number: '5.4'
        title: Security, compliance, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic's IoT Security Framework is a publicly articulated 360-degree model structured around
              Defend, Detect, and React. The Defend layer covers identity management (SIM-based authentication), IMEI
              locking, private APN/VPN, white/blacklisting, and on-SIM security applications. The Detect layer relies on
              the AI-driven Anomaly and Threat Detection platform, which operates agentlessly at the mobile core — no
              software agent on devices — and monitors behavioral baselines to flag unusual connection targets,
              data-volume spikes, and operation pattern deviations. The React layer enables automated countermeasures
              (device isolation) and supports operator compliance reporting.


              Cloud Secure with IoT SAFE is the zero-touch onboarding product: it uses on-SIM SAFE applets for secure
              certificate provisioning and rotation, enforcing device identity and preventing spoofing or ransomware at
              the point of connectivity establishment. The framework explicitly references compliance with EU Cyber
              Resilience Act, UK PSTI Act, and US IoT Cybersecurity Improvement Act.


              From a regulatory posture, Wireless Logic's Cyril Deschanel stated (March 2026) that SGP.32 is "becoming
              increasingly important as an enabler of regulatory compliance" and that true data sovereignty requires
              local traffic breakout plus in-country data processing, which Conexa's geo-distributed core is designed to
              support. DORA and NIS2 resilience requirements are also cited in the 2026 IoT Breakthrough award context.


              The public trust limitation is that Wireless Logic does not surface specific ISO certification numbers
              (e.g. ISO 27001 certificate ID or scope) or SOC 2 reports on its public-facing pages. The Security
              Management Framework brochure is public (a 12-page PDF) and describes the framework's structure, but does
              not provide audited control evidence. Trustpilot shows a 2.7/5 rating across 11 reviews (small sample),
              with one 2026 review describing a 30-hour connectivity outage following a platform upgrade and another
              describing "appalling service". These are material adverse signals from a limited public sample.
