      - number: '6.3'
        title: Retention signals, satisfaction, and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic has never publicly disclosed NRR, GRR, or churn. The closest public proxy is Gartner Peer
              Insights, where the company holds a 4.6 out of 5 rating across 45 enterprise reviews, with 62% five-star
              and 33% four-star and no one- or two-star reviews. This is consistent with high satisfaction among
              enterprise B2B buyers. In contrast, Trustpilot shows 2.7 out of 5 across 11 largely consumer-or-SME
              reviews with themes of support responsiveness, billing clarity, and contract terms. The gap between the
              two platforms is consistent with a segment split: large enterprise accounts have operational account
              management and bespoke SLAs, while smaller or SME customers may experience a more transactional service.
              The SIMPro platform raises switching costs structurally — once a customer's SIM estate is ingested into
              SIMPro with custom APNs, tariff structures, and data-pooling rules, re-migration to a competitor requires
              re-provisioning each SIM, rewriting private APN routes, and re-integrating billing. This "managed estate"
              lock-in is an implicit retention driver but has not been quantified. Contract durations have not been
              disclosed; the ElectrAssure five-year programme and Just Eat's multi-year Orderpad rollout are the only
              publicly known contractual horizons. The Red Squirrel Consulting v Wireless Logic Ltd dispute (2011 agency
              agreement) demonstrates that commercial terms with channel agents have historically been complex enough to
              require court intervention, though Wireless Logic successfully defended the summary-judgment application.
