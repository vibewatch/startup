        title: Financial performance, growth trajectory, and scale metrics
        blocks:
          - type: paragraph
            body: >-
              The clearest financial window available to public observers is the Blue Holdco Companies House filing,
              which covers the consolidated group for the year ending April 2024. The filing reports £256.7 million of
              revenue and £102.3 million of underlying profit before interest, tax, and acquisition costs, a margin of
              approximately 40 percent. Statutory pre-tax loss was £222.3 million, entirely explained by £141 million of
              acquisition-related charges — primarily goodwill amortisation and deal expenses from the company's
              aggressive buy-and-build strategy under Montagu. CEO Oliver Tucker has stated publicly that both revenue
              and profit grew by approximately 20 percent year on year in FY2024, which is consistent with implied
              prior-year revenue of roughly £214 million and underlying EBITDA of roughly £85 million. Montagu's
              official communications confirm that since the 2018 acquisition, revenue has grown more than 6× and EBITDA
              more than 7×, implying a 2018 base revenue of approximately £40-43 million and base EBITDA of
              approximately £15 million. This trajectory is consistent with a company that has compounded through both
              organic growth and a sustained acquisition programme. Third-party estimators such as Growjo place current
              annualised revenue at approximately USD 107 million — materially below the disclosed £256.7 million —
              reflecting the difficulty of external modelling for a high-growth private company with significant M&A
              reshaping the perimeter. The most financially significant event since the filing period is the May 2025
              General Atlantic minority investment at a reported £3.5 billion enterprise value, implying roughly 34×
              trailing underlying EBITDA. The November 2025 €2 billion SACV close — the largest IoT connectivity
              continuation vehicle on record — provides an independent institutional valuation anchor. Post-Arqia (April
              2025), the company manages more than 18 million IoT device connections across 25,000 enterprise customers.
