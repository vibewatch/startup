      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a clear financial verdict at the model level but leaves the P&L materially
              under-specified. Wireless Logic is a real and growing business: the £256.7 million disclosed revenue, 40%
              underlying EBITDA margin, £3.5 billion institutional valuation, and six-times-plus revenue growth since
              2018 are all corroborated by multiple independent sources including Companies House filings, PE firm
              communications, and news coverage. The statutory pre-tax loss of £222.3 million is an acquisition
              accounting artefact, not a cash-basis distress signal, and should be read alongside the £102.3 million
              underlying profit figure. The key diligence blockers are structural rather than signal-based: Wireless
              Logic discloses no consolidated gross margin, no cash position or burn rate, no working-capital metrics,
              no net leverage ratio, and no ARPU or MVNO cost-structure data. This is normal for a UK private group
              under the Companies Act, but it means that profitability normalisation, capital-intensity sizing, and
              unit-economics underwriting require access to management accounts. Adverse signals worth monitoring
              include: the premium pricing positioning relative to both MNOs and newer commodity MVNOs (according to
              SWOT analysis data); potential integration fragmentation across fifteen heterogeneous acquisitions; the
              undisclosed quantum and terms of the Arqia Brazil investment; and the sector-level headwind of declining
              ARPU per IoT connection as airtime commoditises. The SACV structure and General Atlantic's BeyondNetZero
              fund mandate also introduce ESG and governance overlays that are not yet reflected in public financial
              disclosures. Taken together, the public record supports a revenue-quality assessment of
              subscription-recurring with moderate capital intensity, but the margin path and capital adequacy require
              private-side verification before underwriting.
