      - number: '8.2'
        title: Public and private comparable benchmarks
        blocks:
          - type: paragraph
            body: >-
              The most directly comparable public company is KORE Wireless (NYSE: KORE), a global pure-play IoT
              connectivity provider. KORE reported FY2025 revenues of $285.9 million and adjusted EBITDA of $63.3
              million. In February 2026, Searchlight Capital Partners and Abry Partners agreed to acquire KORE for $9.25
              per share in an all-cash transaction valuing the company at approximately $726 million inclusive of debt—
              representing roughly 2.5x revenue and 11.5x EBITDA. This is a major valuation gap versus Wireless Logic's
              implied 10.5–13.6x revenue multiple, though KORE's flat revenue growth and higher hardware mix justify
              some discount.

              Broader SaaS benchmarks illustrate the market environment. Windsor Drake's 2026 update cites public SaaS
              median at 6–7x EV/Revenue, with private lower-middle-market SaaS transacting at a 30–50% discount to
              public peers and a median around 4.8–5.3x for equity-backed companies. Top-quartile private SaaS deals
              clear 8.3x. PitchBook data for Q2 2025 shows IT sector M&A at a median EV/EBITDA of 13.2x. Raisek
              valuation benchmarks confirm private SaaS at 4.8–5.3x EV/Revenue with strong performers commanding up to
              8.3x. The Ful.io SaaS analysis for 2025 identifies 6.0x as the midpoint public SaaS multiple, with
              AI-native vertical SaaS reaching 8–12x. On every publicly available comparable benchmark, Wireless Logic
              at 10-14x revenue screens as a meaningful premium.

              Within the IoT M&A landscape, Jahani & Associates' enterprise IoT device solutions M&A analysis (2020–Q1
              2025) covering $376 billion across 2,290 transactions found sector EV/Revenue ranging from 1x to 51x, with
              larger deals ($1B+) typically at 1–5x and smaller high-growth targets reaching 10–55x. Wireless Logic at
              £3.5 billion falls in the larger-deal category but is priced at the premium end for its size. IoT
              Analytics confirms the global cellular IoT market generated $18.4 billion from 4.1 billion connections in
              2024 (+16% YoY), underscoring the structural tailwind behind the premium. However, the only pure-play
              public IoT MVNO comparable—KORE— traded and was acquired at a fraction of Wireless Logic's implied
              multiple.
