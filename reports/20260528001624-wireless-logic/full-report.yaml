      - number: '7.4'
        title: Sponsor governance and exit risk
        blocks:
          - type: paragraph
            body: >-
              Montagu's December 2025 €2 billion CV-on-CV continuation vehicle — led by TPG GP Solutionswith CVC
              Secondary Partners and Partners Group as co-leads — is a significant governance event. Acontinuation
              vehicle extends ownership beyond the typical 4-6 year PE fund cycle, rolling existingLP interests into a
              new vehicle at a negotiated NAV. The structure signals Montagu's conviction inthe Wireless Logic thesis
              and preference for a longer hold over a near-term IPO or trade sale, butit also reduces liquidity options
              for original fund investors and increases governance complexity asthe LP register changes. The £3.5
              billion valuation implied by the May 2025 General Atlantic minoritystake and the December 2025
              continuation vehicle prices entry at a significant premium to theunderlying Blue Holdco pre-tax loss
              disclosed for April 2024. Bloomberg described the structure asa 'CV-squared' deal in which LPs of one
              continuation vehicle roll into a second, a rare mechanismthat adds further distance from a conventional
              IPO or auction exit. Board composition is strong:Vittorio Colao (ex-Vodafone CEO, EMEA VP General
              Atlantic) and Sir Michael Rake (ex-BT Chairman)position the company for an eventual IPO, but no S-1 or
              filed prospectus was identified as of May 2026.The risk for an investor is that the continuation structure
              compresses the exit window and creates ascenario where the company is held until the next continuation
              cycle or a fundamental change in marketconditions forces a sale.
