  - id: TM004
    title: Growth drivers and adoption constraints
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for WL
      - Diligence ask
    rows:
      - - EU Cyber Resilience Act (CRA)
        - Driver
        - Sep 2026 (reporting), Dec 2027 (full)
        - Enterprises need connectivity providers with lifecycle security; compliance creates procurement impetus
        - Does WL's platform provide CRA-compliant vulnerability and incident reporting tooling?
      - - SGP.32 eSIM remote provisioning standard
        - Dual — driver and risk
        - 2026 adoption ramp
        - Enables global device deployment; lowers barriers for new entrants from consumer mobile
        - WL position in SGP.32 ecosystem; Thales partnership as evidence of first-mover advantage
      - - Cellular IoT connection growth (4.5B → 8B by 2031)
        - Driver
        - 2025-2031
        - More devices = larger addressable fleet management opportunity
        - What share of new connections WL captures vs. pure-play telco MVNO competitors
      - - Data-sovereignty and localisation rules
        - Driver
        - Active and tightening in EU/APAC
        - Multi-country enterprises need providers who can localise connections compliantly
        - WL's legal entity presence and local MVNO licences in target markets
      - - 5G private networks and edge compute
        - Driver
        - 2026-2028 ramp
        - Opens IIoT use cases requiring ultra-low latency; WL must offer 5G SA connectivity
        - WL 5G SA capability roadmap and current 5G coverage by MNO partnerships
      - - ARPU decline / connectivity commoditisation
        - Constraint
        - Ongoing (structural)
        - Margins on pure SIM connectivity eroding; VAS expansion required to maintain revenue per customer
        - WL VAS attach rate and revenue mix shift from connectivity to platform/services
      - - IoT project failure rates (60-80%)
        - Constraint
        - Persistent
        - >-
          High failure reduces enterprise appetite for new deployments; WL affected by customer project delays or
          cancellations
        - WL churn data and deployment success rate among direct enterprise customers
      - - Enterprise IoT spending slowdown in 2024
        - Constraint
        - Cyclical but material in 2024
        - Hardware weakened 8%; European manufacturing was hardest hit — WL's home market
        - WL revenue performance in 2024 vs. connectivity services market benchmark of +17.7%
      - - Fragmented network standards (2G/3G sunset, NB-IoT, LTE-M, 5G)
        - Constraint
        - Active transition 2025-2027
        - Customers on legacy 2G/3G face forced migration; creates churn and re-deployment cost
        - WL portfolio coverage of NB-IoT and LTE-M across 50 MNO partners
      - - Vendor lock-in / switching cost concerns
        - Mixed
        - Persistent
        - Creates retention for WL's existing customers but blocks new customer wins from entrenched telcos
        - WL SIM portability and multi-network SIM strategy as differentiator
    notes: >-
      Direction classifications are relative to IoT MVNO/managed connectivity providers. ARPU decline and project
      failure rates sourced from ABI Research and IoT Analytics; regulatory timeline from Hogan Lovells and Mend.io CRA
      analysis.
