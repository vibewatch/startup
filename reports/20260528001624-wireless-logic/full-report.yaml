  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Verified financing context and price discipline
        blocks:
          - type: paragraph
            body: >-
              Two major financing events in 2025 anchor Wireless Logic's current valuation. In May 2025, General
              Atlantic—through its BeyondNetZero climate growth equity fund—took a minority stake at a confirmed
              transaction valuation of £3.5 billion ($4.6 billion). Montagu Private Equity remained the majority
              shareholder and reinvested alongside General Atlantic. The deal was subject to customary closing
              conditions and expected to close in Q3 2025. Six months later, in November 2025, Montagu closed a €2
              billion ($2.3 billion) single-asset continuation vehicle (SACV)— described by market participants as the
              largest SACV completed in Europe that year— with TPG GP Solutions as lead investor and CVC Secondary
              Partners and Partners Group as co-leads. The vehicle was described as heavily oversubscribed, and it
              reaffirms the £3.5 billion mark. Montagu is executing a rare "CV-squared" structure, rolling over its
              stake from a prior continuation fund into this new vehicle.

              The financial data underpinning these transactions comes from Companies House filings. Wireless Logic
              Group Limited (company number 07033895) filed consolidated accounts for the year ending 30 April 2024 in
              January 2025, and for the year ending 30 April 2025 in December 2025. The April 2024 filings confirm that
              Blue Holdco (the parent group) posted revenues of £256.7 million, underlying EBITDA of £102.3 million, and
              a pre-tax loss of £222.3 million after accounting for £141 million in acquisition-related charges. CEO
              Oliver Tucker confirmed 20% year-on-year revenue and profit growth for that period. Montagu's Ed
              Shuckburgh later stated the business was growing at "roughly 30%" annually as of November 2025.

              The valuation arithmetic is stark. At £3.5 billion and confirmed FY2024 revenue of £256.7 million, the
              implied revenue multiple is 13.6x. At estimated FY2025 revenue assuming 20% growth (£308 million), the
              multiple is 11.4x; at 30% growth (£334 million) it is 10.5x. A third-party analyst estimated FY2024
              revenue at £467 million yielding a 7.5x multiple, but this is unverified against the Companies House
              filings and likely represents a forward or run-rate estimate incorporating M&A pipeline. The underlying
              EBITDA multiple on confirmed figures is approximately 34x—elevated even for high-growth SaaS assets. The
              key valuation anchor is the oversubscribed continuation vehicle: institutional secondary buyers who
              reviewed confidential information from Montagu still cleared the transaction, representing independent
              third-party validation at roughly this mark. The official FY2025 group revenue will be the critical
              verification gate.
            claimRefs:
