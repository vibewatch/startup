  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and sizing logic
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic's relevant market must be built up from a clear boundary rather than a single headline TAM.
              At the broadest level, total IoT annual spending is projected to surpass $1 trillion by 2026 with 38.7
              billion connections expected by 2030 (StartUs Insights, citing GSMA Intelligence); Industrial IoT alone is
              forecast at $214 billion in 2026 (Coherent Market Insights). These figures encompass hardware, silicon,
              sensors, software platforms, applications, and services, making them too wide to anchor pricing or
              competitive positioning for a connectivity-first provider.


              A more informative boundary focuses on the managed cellular IoT connectivity layer. The IoT Connectivity
              Management Platform (CMP) market — covering platforms used to manage device connectivity, SIM lifecycle,
              network visibility, and analytics — is estimated at $12.23 billion in 2026, growing at 20.3% CAGR to
              $25.71 billion by 2030 (The Business Research Company). Below this sits the narrower IoT MVNO market
              (virtual operators providing cellular IoT airtime and value-added services), which PS Market Research
              sizes at $5.2 billion in 2026 growing at 18.5% CAGR, while Kaleido Intelligence projects that cellular IoT
              connections managed by MVNOs will reach 670 million in 2026 (24% CAGR) with connectivity and value-added
              services (VAS) revenues hitting $9.1 billion — a somewhat higher aggregate because it includes non-MVNO
              connectivity management revenues. The narrowest layer — 'managed IoT connectivity services' as a discrete
              product category — is sized at $2 billion in 2026, rising to $11.15 billion by 2035 at 20% CAGR (Market
              Research Intellect). These three nested estimates are not additive; they reflect competing boundary
              definitions.


              Wireless Logic's serviceable addressable market is best understood as the enterprise-facing, managed
              cellular IoT connectivity layer — the Kaleido/PS Market Research segment — with a practical SAM for a
              European-weighted provider of roughly $1.5–3 billion in 2026 given its 25,000 enterprise customer base
              across 165 countries and management of 14 million IoT devices. The company's confirmed $726 million
              enterprise value for comparable KORE Wireless (which reported $286 million in FY2025 revenue from roughly
              20.9 million connections) provides an external anchor on monetizable connectivity scale. Contradictory
              estimates from broad analysts quoting figures ranging from $2 billion to $12 billion underscore that
              market boundary choice is the primary determinant of any sizing exercise.
