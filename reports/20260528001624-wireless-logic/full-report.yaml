  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape overview
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic sits in a crowded but segmented market for managed IoT connectivity. The most relevant
              direct comparisons are not just other UK or European IoT MVNOs; buyers can also choose telco-backed
              aggregators, public hyperscale connectivity platforms, automotive specialists, satellite-cellular hybrids
              and simpler developer-first SIM tools. The practical buying question is therefore not “who else sells
              SIMs?” but “who can manage compliance, resilience, support and cost for this specific deployment shape?”


              Wireless Logic’s competitive posture starts from breadth. The company says it connects more than 18
              million devices across 165 countries and 750+ networks and has used acquisitions to widen regional
              coverage and platform depth. That puts it ahead of smaller challengers on footprint and local service
              density, but it does not eliminate substitute pressure because Vodafone and Deutsche Telekom can now
              promise regulated local profiles and satellite extensions, while Hologram and 1NCE pull price-sensitive
              customers toward simpler offers. The market remains fragmented because no one vendor is simultaneously
              best for automotive OEMs, remote industrial assets, low-data sensors and global enterprise estates.
            claimRefs:
