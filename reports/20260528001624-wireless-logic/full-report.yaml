      - number: '2.4'
        title: Market structure, consolidation signals, and evidence-based outlook
        blocks:
          - type: paragraph
            body: >-
              The IoT managed connectivity market is consolidating around three tiers: (1) global MNO-anchored platforms
              (Vodafone, AT&T, Verizon, Deutsche Telekom) that combine network ownership with connectivity management
              software at carrier scale; (2) specialist IoT MVNOs and managed connectivity providers (Wireless Logic,
              KORE, Aeris, emnify, Eseye, Soracom) that aggregate network access across 30–190 countries and
              differentiate on vertical expertise, platform depth, and managed services; and (3) low-cost
              connectivity-only providers (1NCE and others) that compete on price for high-volume, low-complexity IoT
              use cases. Kaleido Intelligence finds that the top 10 IoT MVNOs held 68% of connection volume and 71% of
              revenue share in 2021, indicating significant concentration despite an ostensibly fragmented market.


              Consolidation is accelerating. Aeris acquired Ericsson's IoT Accelerator and Connected Vehicle Cloud
              businesses (announced December 2022), bringing its managed device count to over 100 million and enterprise
              customers to over 7,000. KORE Group Holdings entered a merger agreement in February 2026 at a $726 million
              enterprise value (going private with Searchlight Capital), recognising that the public markets undervalued
              a mature IoT connectivity revenue base. Transforma Insights (2025 benchmarking) places Wireless Logic in
              the top tier of CSPs globally, noting capability improvements including through its Arqia acquisition,
              alongside Vodafone, AT&T, Verizon, Deutsche Telekom IoT, and Telefónica.


              The outlook through 2030 supports continued growth in the managed connectivity platform segment, but
              growth comes with strategic bifurcation: providers that remain pure-play connectivity resellers will face
              structural ARPU headwinds, while those that build or acquire vertical expertise, lifecycle tooling,
              security services, and analytics platforms are better positioned for revenue expansion. Europe's IoT
              market is expected to be the region most directly affected by CRA, Data Act, and GDPR compliance
