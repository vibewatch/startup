      - Argument
      - Direction
      - What would change the view
    rows:
      - - Gartner MQ Leader 4 consecutive years, only independent MVNO in Leaders quadrant
        - Thesis
        - Loss of Leaders placement or emergence of better-funded independent rival
      - - 25,000+ enterprise customers, 165 countries, 18M+ connected devices—demonstrated scale
        - Thesis
        - Evidence of significant customer churn or contract non-renewals at scale
      - - 6x revenue, 7x EBITDA growth under Montagu since 2018; 15 acquisitions integrated
        - Thesis
        - FY2025 accounts showing goodwill impairment or acquisition-related pre-tax losses persisting >3 years
      - - €2B SACV oversubscribed—sophisticated secondary buyers cleared due diligence at ~£3.5B mark
        - Thesis
        - Discovery that SACV pricing relied on optimistic GP revenue projections above confirmed filings
      - - 'IoT secular tailwind: 18.5B devices in 2024, growing to 21.1B in 2025, 39B by 2030'
        - Thesis
        - Commoditisation of cellular IoT driving pricing pressure and margin compression
      - - Pre-tax loss of £222.3M in FY2024 reflects acquisition costs, not operating weakness
        - Thesis
        - FY2025 or FY2026 accounts showing recurring operating losses independent of acquisition costs
      - - 10–14x revenue multiple far exceeds public IoT comps (KORE 2.5x) and private SaaS median (4.8x)
        - Anti-thesis
        - FY2025 revenue confirms ≥£380M at 48%+ growth, closing gap to 9x or below
      - - CV² structure creates GP self-dealing risk; Montagu prices its own asset across two continuations
        - Anti-thesis
        - Independent price discovery process (e.g., IPO filing, strategic sale) at comparable or higher valuation
      - - Undisclosed LBO leverage from 2018 plus acquisition debt not visible to external investors
        - Anti-thesis
        - Transparent net debt disclosure showing leverage at ≤4x EBITDA
      - - International expansion explicitly flagged by CEO as 3x harder and 3x more expensive than projected
        - Anti-thesis
        - Successful profitable contribution from LATAM and APAC within 18 months of entry
    notes: >-
      Thesis and anti-thesis arguments sourced from official filings, company statements, and independent analyst
      benchmarks. Rows ordered from strongest thesis point to most material risk.
