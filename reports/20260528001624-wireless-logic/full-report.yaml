      - number: '3.2'
        title: Direct peer profiles
        blocks:
          - type: paragraph
            body: >-
              The strongest direct peer set spans several models. Eseye is the cleanest like-for-like challenger on
              fully managed global eSIM orchestration: its AnyNet+ and Infinity positioning closely resembles the value
              proposition Wireless Logic is trying to own, including multi-IMSI fallback, regulatory localisation and
              operator enablement. Transatel and Tele2 IoT represent a more telecom-native variant, leaning on direct
              carrier economics, full-core or telco-grade operating models and single-platform global contracts. Aeris
              and KORE matter because they are among the few large providers with public scale signals; Aeris in
              particular is already well above Wireless Logic on disclosed connections.


              Other direct peers attack different layers of the same problem. POND emphasises failover and routing
              control, emnify emphasises cloud-native control and manufacturing-first onboarding, and 1NCE attacks the
              low-data segment with radically simple prepaid economics. Eseye also appears to remain independent rather
              than absorbed into Wireless Logic: the reviewed Wireless Logic news archive lists other acquisitions,
              while Eseye continued publishing product updates under its own brand in 2026.
