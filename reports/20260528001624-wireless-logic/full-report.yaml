      - number: '4.3'
        title: Capital structure, acquisition programme, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic's capital structure reflects a private-equity-driven buy-and-build model spanning three
              ownership generations. CVC Growth Partners acquired the company in 2015, financed with a £75 million
              Ares/GE Capital facility comprising a £65 million unitranche and £10 million working-capital line. Montagu
              Private Equity acquired the business from CVC in June 2018 for an undisclosed consideration and
              subsequently bought out CVC's residual minority stake alongside management in June 2021. Under Montagu,
              the company completed fifteen acquisitions by November 2025, including Arkessa (December 2020, one
              million-plus subscriptions), Com4 (2021), Jola (2022), IoThink Solutions (2022), Mobius Networks (July
              2022), Blue Wireless (March 2023, the ninth acquisition), Webbing (late 2023), Arqia (April 2025, Brazil's
              largest IoT MVNO with three million connections), and Comms365 (February 2026). The acquisition pace has
              been a significant consumer of cash and financing capacity: £141 million of acquisition-related charges in
              FY2024 alone drove the statutory pre-tax loss to £222.3 million. The November 2025 €2 billion single-asset
              continuation vehicle — structured with TPG GP Solutions as lead and CVC Secondary Partners and Partners
              Group as co-leads, and endorsed by Montagu — resets the sponsor's exit horizon and validates the asset at
              institutional-grade pricing. The Arqia transaction in Brazil includes a planned R$200 million investment
              in the acquired business; the financing instrument, draw schedule, and return profile are not publicly
              disclosed. No public source reveals current interest-coverage ratios, senior-debt quantum outstanding, or
              consolidated net leverage under the new SACV structure. Headcount has grown more than 7× since 2018,
              which, combined with the revenue base, implies a revenue-per-employee of approximately £342,000 —
              consistent with a managed-services business with significant technology leverage but not asset-light
              economics.
