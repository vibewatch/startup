      - number: '2.2'
        title: Buyer personas, budget owners, and procurement paths
        blocks:
          - type: paragraph
            body: >-
              The primary buyer of enterprise IoT managed connectivity is an operations or technology decision-maker at
              a company that depends on connected device fleets to deliver its product or service. Wireless Logic's
              confirmed sectors span agriculture, healthcare, manufacturing, transport, energy and utilities, smart
              cities, and retail; these map to distinct buyer archetypes whose budget ownership, adoption triggers, and
              evaluation criteria differ sharply.


              In industrial manufacturing and energy, the buyer is typically an OT/engineering or digital transformation
              lead buying under capex or operational technology budgets; their trigger is process automation, predictive
              maintenance, or smart metering mandates. In healthcare, the buyer is a medical device OEM or hospital
              group procuring connectivity for remote monitoring equipment; regulatory compliance (HIPAA, MDR, CRA)
              shapes the evaluation and the payer is the device manufacturer who bundles connectivity into product
              economics. In smart mobility and micro-mobility (e-scooters, shared vehicles), the buyer is a fleet
              operator procuring track-and-trace and OTA update capability, typically with per-device monthly service
              fees embedded in their SaaS pricing. In agriculture, precision farming vendors or agri-tech companies are
              the buyers, often selecting NB-IoT or LTE-M for low-power, wide-area sensor networks.


              All enterprise segments share a common procurement dynamic: connectivity is typically a managed service
              embedded into a longer-term contract (12–36 months), sold through direct enterprise sales supplemented by
              OEM and channel partner motions. Wireless Logic's partnership with Thales — a device security and eSIM
              hardware provider — exemplifies the OEM channel: Thales preloads Wireless Logic's bootstrap profile on
              eSIMs, directing device-level activations toward Wireless Logic's Connexa platform. This OEM-embedded
              model creates device-level lock-in and shifts the payer from the end enterprise to the OEM who distributes
              the connectivity cost within hardware or platform pricing. The Ultra-Protect case study (NHS/TfL/Surrey
              Fire) illustrates the direct enterprise buyer path: a vertical SaaS provider buys NB-IoT connectivity per
              sensor, embedding monthly fees in customer contracts. Budget ownership sits with the service provider's
              CTO or product team rather than a dedicated connectivity procurement function, which is characteristic of
              smaller IoT-native customers.
