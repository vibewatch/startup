companyProfile:
  summary: >-
    Wireless Logic is a UK-founded managed IoT connectivity company that combines a global SIM estate, its own Conexa
    IoT core network, the SIMPro management platform, and value-added security and device services for enterprise
    fleets. Public evidence supports a real scaled platform: 25,000+ enterprise customers, 18M+ connected devices,
    coverage across 165 countries and 750+ networks, and a long acquisition record that expanded the company into
    Brazil, North America, APAC, and adjacent wireless services. The core investment debate is not whether Wireless
    Logic is strategically relevant, but whether the May 2025 £3.5 billion valuation can be justified without fresher
    disclosure on FY2025 revenue, leverage, gross margin, and retention quality.
