      - number: '1.3'
        title: Ownership History and Investor Map
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic has passed through four private-equity ownership stages since 2002, with each transition at
              a materially higher valuation. Peter Jones's Phones International Group acquired the company in 2002; in
              2011 co-founders Oliver Tucker and Philip Cole bought it back for £35 million with backing from ECI
              Partners. CVC Capital Partners completed a secondary buyout for approximately £255 million in February
              2015, during which ECI reported a 210% return on its Arkessa investment (ECI had also backed Wireless
              Logic itself in the same period). Montagu Private Equity invested in June 2018 on CVC's exit for an
              undisclosed sum, beginning the most acquisitive phase of the company's history.


              In May 2025, Montagu brought in General Atlantic as a minority shareholder through its BeyondNetZero
              climate growth equity fund at a £3.5 billion valuation — a nearly 100-fold increase from the 2011 buyback
              price. Montagu simultaneously reinvested. On 3 November 2025, Montagu closed a €2 billion single-asset
              continuation vehicle (SACV) described as the largest SACV completed in Europe in 2025, with TPG GP
              Solutions as lead investor and CVC Secondary Partners and Partners Group as co-leads. Partners Group had
              been an investor in Wireless Logic through Montagu's M+ Fund since 2021.


              The £3.5 billion valuation implies an enterprise-value-to-revenue multiple of approximately 13.6x on the
              April 2024 revenues of £256.7 million — a premium consistent with high-growth IoT platform companies but
              elevated relative to traditional connectivity resellers, reflecting the market's confidence in Wireless
              Logic's recurring-revenue model, 20% YoY growth, and platform differentiation. Detailed capital structure,
              debt levels, and exact investor stake percentages are not publicly disclosed.
