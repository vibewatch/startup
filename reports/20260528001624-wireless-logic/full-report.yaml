chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Global Footprint
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic is a leading independent global Internet of Things connectivity and managed-services
              platform provider, legally incorporated in England on 19 November 1999 under Companies House number
              03880663 and registered under SIC code 61200 (Wireless telecommunications activities). The company was
              originally named @U Media Publishing Limited, renamed MYWASP Limited in January 2001, and became Wireless
              Logic Limited in October 2001. The current registered office is at 4th Floor, The Davidson Building, The
              Forbury, Reading, England; operationally the company is commonly associated with the Guildford and
              Maidenhead area of Surrey. Co-founders Oliver Tucker and Philip Cole established the business to fill a
              gap between mobile networks and organisations requiring a dedicated M2M/IoT managed-services layer — a
              vision laid out on the official our-story page: "From the very beginning, Wireless Logic's proposition
              went beyond mere connectivity."


              The company's core product, the Conexa platform, provides a purpose-built carrier-grade IoT connectivity
              network enabling customers to connect, control, and secure IoT devices across any network and geography
              from a single management interface. The offering spans mobile (multi-SIM, eSIM/eUICC, embedded SIM
              provisioning via SGP.32), satellite (Starlink LEO via authorised reseller agreement since April 2024),
              private networking, anomaly detection, and AI-driven security analytics. Wireless Logic operates across
              13+ vertical sectors including agriculture, healthcare, energy, industry 4.0, transport, logistics,
              security, smart buildings, smart cities, retail, public sector, environment, and consumer devices.


              As of May 2025, Wireless Logic connects more than 18 million IoT devices across 165 countries through over
              750 global networks, serving more than 25,000 enterprise and business customers. The company partners with
              53 mobile network operators and provides IoT connectivity for mission-critical applications ranging from
              medical monitors to smart traffic systems. This scale makes Wireless Logic the market-leading European
              independent IoT connectivity platform, a position validated by its fourth consecutive appearance in the
              2025 Gartner Magic Quadrant for Managed IoT Connectivity Services as the only independent IoT MVNO in the
              Leaders quadrant.
