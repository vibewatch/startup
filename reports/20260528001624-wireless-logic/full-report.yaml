      - number: '7.5'
        title: Execution, cybersecurity, and people risk
        blocks:
          - type: paragraph
            body: >-
              Wireless Logic's public customer review record introduces execution and service-quality riskthat is
              disproportionate to the company's enterprise positioning. The Trustpilot rating is 2.7/5(Poor) based on 11
              reviews, with multiple recent adverse entries: a February 2026 reviewer describes'appalling service, no
              understanding of the customer, changing staff — avoid like the plague'; aNovember 2025 reviewer reports a
              30-hour network outage with no support response after a platformupgrade; a third reviewer describes being
              locked into an expensive contract; and a long-term customerreports that 'SIMPro doesn't work and doesn't
              give me any useful data' and that 'WL have confessedthat customers as small as me don't get specific
              customer service'. While the low review volume limitsstatistical inference, the pattern is consistent with
              rapid scaling outpacing service and platformquality at the SME segment. On people risk, co-founder Philip
              Cole departed in 2019; CEO Oliver Tuckeris the sole active founder and a key-person dependency. General
              Atlantic's minority investment doesnot include disclosed management guarantees. From a cybersecurity
              standpoint, Wireless Logic's SecurityManagement Framework document outlines defend, detect and react
              controls including IoT SAFE certificateidentity, SIM-level anomaly detection and encrypted communications.
              The company acknowledges 1.5 billionIoT device attacks in H1 2021 as the background threat context. No
              public breach or confirmed incidentwas identified, but the absence of a public SOC 2 or ISO 27001
              disclosure limits independent verification.NIST's April 2026 update to NIST IR 8259r1 adds post-market IoT
              security lifecycle obligations thatwill affect Wireless Logic's OEM and enterprise customer base.
