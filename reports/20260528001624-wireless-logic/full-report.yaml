        - Less explicit managed-service differentiation than Wireless Logic
      - - Tele2 IoT
        - Direct telco-backed managed IoT
        - Millions of devices; thousands of customers; 190+ countries
        - Automotive, utilities, governments, enterprise
        - Cisco Control Center, APN/VPN security, 24/7 NOC
        - Platform dependence on Cisco stack; pricing not public
      - - POND IoT
        - Direct resiliency-focused challenger
        - 200+ countries; 900+ networks; private
