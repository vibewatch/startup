  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        Public and private IoT/SaaS companies with subscription connectivity or platform revenue ≥$100M, drawn from
        disclosed M&A transactions and public market data through May 2026. Hardware-heavy or consumer IoT excluded.
    columns:
      - Comparable
      - Metric
      - EV / Multiple
      - Relevance to Wireless Logic
      - Limitation
    rows:
      - - 'KORE Wireless (NYSE: KORE)'
        - FY2025 revenue $285.9M; EBITDA $63.3M
        - ~2.5x EV/Revenue; ~11.5x EV/EBITDA at $726M buyout (Feb 2026)
        - Most direct public pure-play IoT MVNO
        - Flat revenue growth, mixed hardware/service model, US-centric; Wireless Logic grows faster
      - - Wireless Logic (May 2025 transaction)
        - FY2024 confirmed revenue £256.7M; EBITDA £102.3M
        - 13.6x EV/Revenue; 34.2x EV/EBITDA at £3.5B valuation
        - Subject of this analysis
        - FY2025 revenue unconfirmed; underlying EBITDA multiple before acquisition amortisation
      - - Public SaaS median (mid-2025)
        - Median public SaaS EV/Revenue (Windsor Drake 2026 update)
        - 6.0–7.0x EV/Revenue
        - Floor benchmark for growth software with recurring revenue
        - SaaS median includes slower-growing names; does not reflect IoT infrastructure premium
      - - Private SaaS top quartile
        - PE-backed SaaS transactions with strong NRR and growth (SaaS Capital, 2025)
        - 8.3x EV/Revenue top quartile; 4.8x median
        - Ceiling benchmark for premium private software
        - Does not include IoT network effect or international physical infrastructure
      - - IT sector M&A median EV/EBITDA (2025)
        - PitchBook Q2 2025 Global M&A Report
        - 13.2x median EV/EBITDA
        - Sector-level M&A reference for technology assets
        - Wide dispersion; Wireless Logic at 34x EBITDA is nearly 3x this median
      - - Semtech / Sierra Wireless acquisition
        - Sierra Wireless IoT hardware/connectivity; $1B+ transaction
        - Not publicly disclosed; estimated 1–5x revenue given scale
        - Cellular IoT connectivity comparable—hardware-heavier than Wireless Logic
        - Hardware-dominated model suppresses multiples; limited comparability to pure connectivity
      - - Enterprise IoT M&A median (2020–Q1 2025)
        - 2,290 transactions totalling $376B (Jahani & Associates)
        - Median EV/EBITDA 12x; range 1x–353x; high-growth targets 10–55x revenue
