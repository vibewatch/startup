  - id: TV003
    title: Bull, base, and bear scenario
    columns:
      - Scenario
      - Revenue assumption (FY2025)
      - Multiple assumption
      - Implied enterprise value
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - £400M+ (56% growth, M&A-augmented)
        - 10x EV/Revenue on exit 2028–2029
        - £4.0–5.0B exit EV
        - Growth proves durable; leverage manageable; IPO opens
        - Possible if Arqia and APAC add >£80M to group revenue
      - - Base
        - £308–334M (20–30% organic growth)
        - 8–10x on £500M exit revenue (FY2027)
        - £4.0–5.0B exit EV if multiples hold; £3.5B mark broadly supported
        - Leverage and integration costs constrain equity returns; no near-term IPO
        - Most likely given CEO 20% growth quote and Montagu 30% claim
      - - Bear
        - £270–290M (<15% growth, digest year)
        - 6x on stagnant £280–300M revenue
        - £1.7–1.8B exit EV—40%+ markdown from £3.5B mark
        - PE down-round; acquisition impairments; CV² governance scrutiny
        - 10–20% probability; requires material execution failure
    notes: >-
      Revenue projections are inferred from management growth-rate claims and FY2024 confirmed baseline. Exit multiples
      referenced against 2025 public SaaS and IoT sector benchmarks. No audited FY2025 accounts available as of runDate.
