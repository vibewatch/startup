    body: >-
      ElectrAssure/National Grid (1,500+ EV chargers, 5-year programme), Scangrid/Energinet (Denmark's grid stability virtual power plant), and the UK Environment Agency (replacing national PSTN/GSM with IoT cellular for remote telemetry) represent unusually high-assurance reference quality — government-linked, multi-year, critical-infrastructure deployments that are structurally difficult to unwind once embedded.
