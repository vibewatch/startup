  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-gap
      missingEvidence: NRR, GRR, annual churn rate, and average contract length by customer vertical and channel
      whyItMatters: Without retention economics, it is impossible to distinguish a high-quality recurring-revenue business from a high-churn SIM commodity sold on price. The entire investment thesis depends on whether 25,000 customers are retained, expanded, or churning.
      diligencePath: Request audited cohort data for the three most recent fiscal years from Wireless Logic's CFO or data room; also ask for top-10 customer revenue concentration and OEM partner dependency metrics.
      relatedQuestionRefs:
        - QU015
        - QU021
    - type: enumeration-incomplete
      severity: material
      topic: named-proof
      missingEvidence: Independent customer-authored references, G2/Capterra reviews linked to named deployments, and procurement tender records for government deployments
      whyItMatters: All 60+ published case studies are Wireless Logic-authored; the absence of any independent third-party customer validation means reference quality is systematically lower than for peers with G2 profiles or public Gartner named-customer evidence.
      diligencePath: Solicit independent reference calls from at least three named enterprise customers across different verticals; check government tender databases (UK Contracts Finder, OJEU) for Environment Agency or other public-sector contracts.
      relatedQuestionRefs:
        - QU023
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Revenue share of top-10 customers, top-5 OEM/partner relationships, and vertical revenue breakdown
      whyItMatters: Concentration risk is unquantified; if a single large OEM (e.g., a national EV charging operator) migrates platform, a significant SIM estate migrates with it. Montagu explicitly lists customer diversification as a priority, implying current concentration.
      diligencePath: "Request from Wireless Logic or Montagu data room: Herfindahl index or top-customer revenue share; check for minimum-volume contract clauses with key OEM partners."
      relatedQuestionRefs:
        - QU021
      relatedTableRefs:
        - TU005
    - type: stale
      severity: minor
      topic: named-proof
      missingEvidence: Updated deployment status for older case studies (ERT, Just Eat, Environment Agency, ENGIE) that predate 2023
      whyItMatters: Several named production deployments are documented in case studies that are 3–6 years old with no refresh; the customer may have churned, expanded, or switched platforms in the interval.
      diligencePath: Request updated customer references directly from Wireless Logic account management; search for recent announcements or press releases from the named customers about their IoT connectivity arrangements.
      relatedQuestionRefs:
        - QU011
    - type: missing-source
      severity: minor
      topic: agriculture
      missingEvidence: Any production-grade customer case study for Wireless Logic in the agriculture vertical
      whyItMatters: Agriculture appears in Wireless Logic's 13 marketed verticals and is cited as a growth segment by IoT Business News, but no named agricultural IoT customer has been identified in publicly available materials.
      diligencePath: Request from Wireless Logic a named agricultural IoT deployment with outcome data; search for precision-farming or smart-irrigation case studies on European agri-IoT platforms citing Wireless Logic.
      relatedQuestionRefs:
        - QU001
acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The planned Retention / repeat cohort figure (type cohort) requires time-bucketed retention percentages (0–100) that are not publicly available for Wireless Logic; NRR, GRR, and cohort data are completely absent from all public sources. A sector vertical coverage matrix (FU004) has been substituted to maintain the artifact count while providing equivalent analytical coverage.
