chapter:
  number: 6
  title: Customers
  summary: >-
    Wireless Logic has a broad, multi-vertical enterprise customer base with over 25,000 organisations and 18 million connected devices across 165 countries as of late 2025, anchored by more than 60 published case studies spanning EV/energy, healthcare, smart grid, vending, transport, and public sector. Named proof is almost entirely vendor-authored, NRR and churn data are not publicly disclosed, and the Trustpilot score of 2.7/5 on 11 reviews highlights a residual consumer-facing service perception risk. The strongest adoption evidence comes from ElectrAssure/National Grid, Scangrid/Energinet, ERT clinical trials, and Just Eat, each showing production-grade, multi-year deployments with quantified operational outcomes.
sections:
  - id: customer-segments
    title: Customer base, segments, and geographies
    body: >-
      Wireless Logic's paying customer universe spans 13 named industry verticals — agriculture, consumer devices, energy, environment, healthcare, industry and manufacturing, logistics, public sector, retail, security, smart buildings, smart cities, and transport — served across 165 countries through direct enterprise sales, OEM embeds, and system-integrator channels. The buyer is almost always an enterprise IT, operations, or engineering team that needs always-on, SIM-managed, private-APN connectivity for distributed IoT assets; the user is the device or fleet operator; and the payer is the enterprise or OEM building the product on top of Wireless Logic's SIM estate. Disclosed customer count has grown from roughly 6,500 references in the 2018 Montagu acquisition period to 25,000+ enterprises by November 2025, implying a roughly fourfold expansion in distinct customer relationships under Montagu's ownership. The Nordic Semiconductor partner profile, IoT Insider, and the Montagu continuation-vehicle announcement each independently confirm the 25,000+ enterprise figure with devices exceeding 14–18 million across the period. Geographically, the published case-study pack is weighted toward the UK and Northern Europe, with emerging proof in Spain, Denmark, Latin America (via Arqia), and globally roaming deployments. SMEs, mid-market OEMs, and global enterprises all appear in the portfolio; no revenue breakdown by segment or size band has been publicly disclosed, and named verticals often reflect marketing positioning rather than audited revenue mix.
