      - CU011
      - CU012
  - calloutType: risk
    title: Named proof almost entirely vendor-authored; NRR and churn completely undisclosed
    body: >-
      Wireless Logic's 60+ published case studies are all produced by Wireless Logic itself; no independent customer-authored case studies, G2/Capterra reviews with named deployments, or third-party testimonials have been found. NRR, GRR, and average contract length are not publicly disclosed. The Trustpilot score of 2.7/5 (11 reviews, "Poor") from SME and consumer-adjacent buyers adds an adverse signal that is structurally different from the enterprise Gartner score, suggesting service quality may be tiered and not uniform.
    claimRefs:
      - CU023
      - CU024
      - CU041
      - CU042
  - calloutType: insight
    title: SIMPro managed-estate creates structural switching costs but is not quantified
    body: >-
      Once a customer's SIM estate is onboarded into SIMPro with custom private APNs, data-pooling agreements, VPN routes, and billing aggregation, switching to a competitor requires reprovisioning each SIM in-field, renegotiating APN routes, and remapping billing — costs estimated to be significant for large or geographically dispersed estates. This is the most plausible reason for high Gartner satisfaction scores alongside very thin public churn or NRR data.
    claimRefs:
      - CU009
      - CU041
      - CU044
