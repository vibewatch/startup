    title: Customer journey map — segments, adoption surfaces, and expansion loops
    type: journey-map
    layout: standard
    summary: >-
      Illustrates how Wireless Logic enterprise customers move from initial discovery through proof-of-concept to production deployment and managed-service expansion.
    data:
      nodes:
        - id: discovery
          label: Discovery and initial contact
          description: >-
            OEM embed (hardware with pre-loaded SIM), partner referral (system integrator / VAR), direct enterprise sales (industry events, Nordic Semi programme, analyst mentions)
        - id: evaluation
          label: Technical evaluation and PoC
          description: >-
            Coverage testing, SIMPro trial, private-APN configuration, security assessment (VPN/IPSec), tariff scoping; Wireless Logic provides pre-configured routers shipped within 5 business days
        - id: deployment
          label: Production deployment
          description: >-
            Multi-SIM rollout, SIMPro onboarding, private APN activation, data-pool setup, billing aggregation; customer fleet managed centrally
        - id: expansion
          label: Managed-service expansion
          description: >-
            Upsell to Conexa eSIM for remote SIM provisioning and multi-network switching; SIMPro analytics; OTA firmware update; cross-border roaming upgrade; additional verticals added
        - id: renewal
          label: Long-term contract and lock-in
          description: >-
            Multi-year contracts (ElectrAssure 5-year confirmed); SIMPro switching costs from ingested APNs, data-pooling rules, and VPN routes; account management for enterprise accounts
    claimRefs:
