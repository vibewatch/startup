  - id: expansion-risk
    title: Expansion drivers, concentration risks, and partner channel dependence
    body: >-
      The land-and-expand motion at Wireless Logic works through two routes: deepening the SIM estate within an existing account as a customer's device fleet grows, and cross-selling managed services (Conexa eSIM, SIMPro analytics, private APN, VPN, OTA updates) onto customers that initially bought only data SIMs. The Arqia acquisition in Brazil (3 million connections, one of only 15 ANATEL MVNO licences) shows that geographic expansion is also a material lever, with each new in-country MVNO removing a permanent-roaming barrier and opening local enterprise demand. On the concentration side, no revenue breakdown by customer, vertical, or geography has been publicly disclosed; Montagu's announcement describes "customer diversification" as a priority investment theme, implicitly acknowledging that concentration risk exists. The partner channel — system integrators, VARs, OEMs embedding SIMs into their hardware — is the primary volume channel, as reflected by the success-story mix (most named customers are OEMs or product companies, not direct enterprise end-users buying connectivity independently). Nordic Semiconductor's partner profile for Wireless Logic confirms the OEM/system-integrator orientation. A Kaleido Intelligence survey of 1,000 IoT adopters found that 42% cite managing multiple connectivity relationships as a top challenge, which creates a procurement-consolidation opportunity but also a risk: if a key OEM reseller switches platforms, a large slice of device connections migrates with it. Transforma Insights places Wireless Logic in the top 10 for both IoT connectivity and IoT services, but notes "no single best" CSP exists, meaning customers may dual-source or churn to Vodafone, Eseye, or KORE for specific vertical needs.
