  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver / risk factor
      - Description
      - Impact
      - Diligence path
    rows:
      - - Organic SIM estate growth
        - As customer device fleets scale, per-customer SIM count and data spend grow; land-and-expand within account without new contract
        - "Positive: recurring revenue growth without sales cost"
        - Verify average ARR per customer at Year 1 vs Year 3; request ACV expansion metrics
      - - Managed-service upsell
        - Conexa eSIM, SIMPro analytics, OTA firmware update, private APN sold onto base data-SIM customers
        - "Positive: higher ARPU, deeper lock-in"
        - Confirm attach rate of managed services on acquired vs organic accounts
      - - Geographic expansion via acquisition
        - Arqia (Brazil, 3M connections) and prior acquisitions open markets with permanent-roaming bans
        - Positive growth lever; integration risk
        - Confirm customer retention post-acquisition in Arqia's base; check ANATEL compliance post-integration
      - - OEM / VAR channel concentration
        - Majority of named proof is OEM-embedded (ElectrAssure, ART, Scangrid, Silence); if a key OEM switches platform, mass device migration follows
        - High churn risk if top-3 OEM exits
        - Request revenue share from top-10 customers/partners; assess exclusivity or minimum-volume terms
      - - Customer revenue concentration
        - No Herfindahl index or top-customer revenue share disclosed; Montagu named customer diversification as priority
        - Unknown but potentially material
        - Obtain top-10 customer revenue concentration as % of total; assess cliff-risk on largest account
      - - Competitive dual-sourcing
        - "Kaleido survey: 42% cite multiple provider relationships as a challenge; Transforma notes no single-best CSP — Vodafone, Eseye, KORE are alternatives in key verticals"
        - "Medium: price pressure and partial account losses likely"
        - Assess win/loss ratio in competitive deals; identify verticals where Wireless Logic loses most frequently
    notes: >-
      Expansion drivers and risk factors are derived from public case studies, survey data, and analyst commentary. Customer concentration data is not publicly available.
