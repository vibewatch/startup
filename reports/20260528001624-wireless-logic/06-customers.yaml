  - id: named-proof
    title: Named customer deployments and vertical use-case evidence
    body: >-
      The strongest production-grade proof spans five use-case clusters. In EV and energy infrastructure, ElectrAssure is Wireless Logic's sole supplier for National Grid's five-year programme of 1,500+ EV chargers across 290+ sites, using Conexa eSIM with remote SIM provisioning (RSP) to enable desk-based fault clearance and disaster-recovery network switching within hours. Osprey, UK's top-rated EV charging network, relies on Wireless Logic for 100% payment uptime. In smart-grid and clean energy, Scangrid deploys IPsec-VPN SIMs to operate Denmark's Energinet-contracted virtual power plant — a government-linked critical-infrastructure deployment. In healthcare, ERT (global ePRO platform used in 95%+ protocol-compliant clinical trials) migrated its multi-country SIM estate to SIMPro, resolving data-security risks and enabling transparent cost control. In food delivery, Just Eat embedded Wireless Logic SIMs in tens of thousands of restaurant Orderpad units across 13 countries, growing per-device data from 3 MB to 20 MB per month as SIMPro scaled with it. In smart buildings and energy analytics, ENGIE's UK and European smart-buildings programme (hospitals, local government, enterprise, retail) relies on Wireless Logic 4G with private APNs and aggregated data pools, with its Smart Buildings Director explicitly quoting seamless operations. Additionally, Automated Retail Technologies improved hot-vending machine uptime from 70% to 99% in its UK expansion. Most case studies are vendor-authored; independent external corroboration for specific named deployments is limited to the Gartner Peer Insights aggregate and Transforma Insights benchmark rankings.
