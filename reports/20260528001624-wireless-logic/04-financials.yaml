      - - Statutory pre-tax loss (FY2024)
        - -£222.3 million (after £141M acquisition-related expenses)
        - High — Companies House filing
        - Signals M&A-driven accounting losses; not a cash-basis distress indicator
        - Confirm amortisation schedule for £141M and impact on future years
      - - YoY revenue growth (FY2024)
        - ~20% (CEO-confirmed verbal guidance)
        - Medium — company-claimed; no prior-year filing for direct comparison
        - Consistent with 6× growth from 2018 base; validates organic + M&A blended growth
        - Request FY2023 statutory revenue figure for direct comparison
      - - Revenue CAGR since 2018 Montagu investment
        - "6× revenue growth over ~6 years (Montagu-confirmed)"
        - High — confirmed by Montagu official communications and CEO quote
        - Implies ~33% blended CAGR; exceptionally strong for managed connectivity
        - Reconcile with organic vs M&A attribution; request waterfall by year
      - - EBITDA CAGR since 2018 Montagu investment
        - "7× EBITDA growth over ~6 years (Montagu-confirmed)"
        - High — confirmed by Montagu official communications
        - EBITDA growing faster than revenue implies operating leverage or margin expansion
        - Request vintage-year EBITDA bridge from 2018 to FY2024
      - - Headcount growth since 2018
        - "7× headcount (Montagu-confirmed)"
        - Medium — company-sourced; no absolute count confirmed
        - Headcount parity with EBITDA growth suggests managed services scale-up, not pure SaaS
        - Request current headcount and FTE split by function (tech vs. ops vs. sales)
      - - Implied revenue per employee
        - "~£342K (estimated: £256.7M / ~750 estimated FTE)"
        - Low — headcount estimate is unconfirmed; FTE count not publicly disclosed
        - Consistent with managed-services profile; below pure SaaS but above field-service
        - Confirm employee count; calculate sales efficiency ratio (ARR per sales FTE)
      - - Consolidated gross margin
        - Not disclosed (private company)
        - null — private metric
        - Critical for underwriting airtime cost vs. platform margin contribution
        - Request gross margin bridge by revenue stream (airtime vs. managed services)
      - - Net leverage / interest coverage
        - Not disclosed (private company)
        - null — private metric
        - Determines serviceability of acquisition debt and SACV financing obligations
        - Request net debt, EBITDA bridge, and interest coverage covenant levels
      - - Cash burn / runway
        - Not disclosed (private company; no apparent external cash constraint signal)
        - null — private metric
        - Material for Arqia R$200M investment adequacy assessment
        - Request consolidated cash position, free cash flow, and planned capex schedule
    notes: "Revenue and EBITDA figures are from Blue Holdco Companies House filing (FY2024, year ending April 2024). Margin percentages and per-employee estimates are derived. Null entries represent undisclosed private metrics requiring data room access. Currency is GBP unless stated. FY2024 CAGR estimates use 2018 as the base year per Montagu communications."
