company:
  name: Wireless Logic
chapter:
  number: 4
  title: Financials
  summary: "Wireless Logic's financial profile is unusually legible for a private UK company of its scale. Blue Holdco's Companies House filing for the year ending April 2024 discloses £256.7 million of group revenue and £102.3 million of underlying profit before interest, tax, and acquisition costs — implying a roughly 40% underlying EBITDA margin — alongside a statutory pre-tax loss of £222.3 million attributable to £141 million of acquisition-related charges. CEO Oliver Tucker confirmed 20 percent year-on-year revenue and profit growth in FY2024, and Montagu's own communications state that revenue has grown more than six times and EBITDA more than seven times since its 2018 investment. The May 2025 General Atlantic minority transaction set an enterprise value of £3.5 billion, implying approximately 34× trailing underlying EBITDA. The November 2025 €2 billion single-asset continuation vehicle close — led by TPG GP Solutions with CVC Secondary Partners and Partners Group as co-leads — confirms sustained LP appetite for the asset at premium multiples. Material diligence gaps remain: no public consolidated gross margin, no cash burn or runway disclosure, no working-capital or interest-coverage metrics, and no realized ARPU data. The Arqia acquisition in Brazil requires a planned R$200 million investment, the financing structure and payback of which is unconfirmed. Public data is sufficient to outline the business model and flag capital intensity, but not to normalize profitability or underwrite unit economics without a private data room."
sections:
  - id: revenue-model-and-pricing
    title: Revenue model, pricing, and monetization
    body: "Wireless Logic is fundamentally a subscription-based IoT connectivity managed service provider. Revenue is generated by charging enterprise customers a recurring per-SIM or per-device fee for connectivity and platform access, layered across 750-plus mobile networks in 165 countries under 53 MNO partnership agreements. The company does not publish a list price; all commercial terms are negotiated directly with enterprise accounts and reportedly customised to deployment scale, vertical, and geographic footprint. The SIMPro connectivity management platform — which provides device management, traffic analytics, security dashboards, eSIM provisioning, and anomaly detection — is bundled into the subscription at no additional charge, a positioning that differentiates the offering from raw airtime resale. The practical effect is that Wireless Logic captures a wider share of the connectivity value stack — from SIM logistics through real-time traffic management to security alerting — while anchoring customers to a proprietary management layer. Value-added modules beyond the SIMPro core, including security analytics and advanced eSIM orchestration, provide potential upsell vectors, though no public disclosure confirms their contribution to blended ARPU. Industry benchmarks from Analysys Mason estimate a blended IoT connectivity ARPU of roughly USD 0.35 per SIM per month across the managed MVNO segment, declining toward USD 0.30 by 2032 as airtime commoditises, which implies revenue per connection of USD 4.20 annually at current rates. At 18-plus million connections post-Arqia, that benchmark supports a rough proxy of USD 75-plus million in run-rate connection-level revenue — materially below the disclosed £256.7 million, confirming that platform and managed-services layering contributes substantially. The pricing architecture is opaque to external observers, but the combination of a high-renewal subscription model, embedded platform switching costs, and 25,000 enterprise customers provides a stable contractual revenue base with low transactional volatility."
