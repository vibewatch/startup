    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - IoT connectivity subscription
        - Per-SIM or per-device recurring fee for access to 750+ networks globally
        - Per SIM / per month
        - Core revenue driver; £256.7M group revenue FY2024
        - High — recurring, contractual, multi-year
        - Disclose blended ARPU, churn rate, and renewal term distribution
      - - SIMPro platform licence (bundled)
        - Included with connectivity subscription; no separate charge disclosed
        - Bundled — no unit price
        - Revenue uplift embedded in connectivity ARPU; not separately disclosed
        - Medium — switching-cost value; no standalone pricing benchmark
        - Confirm whether SIMPro is sold as a standalone SaaS or always bundled
      - - Managed services add-ons
        - Device management, eSIM provisioning, security analytics, anomaly detection
        - Per service / per device or flat retainer
        - Qualitative — described on official site; no revenue split disclosed
        - Medium — potential upsell margin, but no contribution data
        - Quantify managed-services revenue share and gross margin versus airtime
      - - MVNO airtime resale
        - Wholesale airtime purchased from 53 MNO partners and resold with markup
        - Variable cost of goods per MB/GB
        - Embedded in subscription ARPU; no standalone airtime margin disclosed
        - Low — airtime commoditising; Analysys Mason projects ARPU decline to $0.30 by 2032
        - Disclose airtime cost as percentage of subscription revenue and trend
      - - Professional services / onboarding
        - Implementation, integration, SIM logistics for large enterprise deployments
        - Project-based or time-and-materials
        - Qualitative — listed as offering; no revenue attribution
        - Low — typically low-margin; serves as land-and-expand motion
        - Confirm whether professional services are separately charged or absorbed
      - - Geographic expansion revenue (emerging markets)
        - Revenue from Arqia (Brazil) and Webbing (US/Israel) post-acquisition
        - Per SIM / per month — local tariffs
        - Arqia adds ~3M connections; revenue contribution not separately disclosed
        - Medium — growth optionality; FX and regulatory exposure not quantified
        - Disclose Arqia's run-rate revenue and R$200M investment draw schedule
    notes: "Revenue streams are reconstructed from official product pages, press releases, and Companies House filings. No management-provided revenue breakdown by stream is publicly available. ARPU, retention, and per-stream margin are all undisclosed private metrics."
