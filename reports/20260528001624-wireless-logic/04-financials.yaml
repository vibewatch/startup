  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on diligence
      - Exact diligence path
    rows:
      - - Consolidated gross margin (by stream)
        - Cannot separate airtime cost from managed-services contribution; cannot assess scalability
        - Request management P&L with gross margin bridge by revenue stream from CFO
      - - ARPU and churn by cohort
        - Cannot assess revenue quality, net retention, or pricing durability under ARPU compression
        - Request per-SIM revenue and churn table for latest 3 annual cohorts
      - - Net debt and interest-coverage ratio
        - Cannot assess acquisition debt serviceability under SACV financing or rising-rate scenario
