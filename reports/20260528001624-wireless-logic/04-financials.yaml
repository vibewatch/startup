callouts:
  - calloutType: strength
    title: "High disclosed EBITDA margin at scale"
    body: "Wireless Logic's £102.3 million underlying EBITDA on £256.7 million revenue represents a roughly 40% margin — exceptionally strong for a managed-services provider at this revenue scale. Combined with 6× revenue and 7× EBITDA growth since 2018, this is consistent with significant operating leverage from platform bundling and MVNO scale economics."
    claimRefs:
      - CI002
      - CI003
      - CI007
      - CI008

  - calloutType: risk
    title: "Statutory loss driven by acquisition accounting"
    body: "The £222.3 million FY2024 statutory pre-tax loss is entirely explained by £141 million in acquisition-related charges. While this is an accounting rather than a cash-basis risk, the recurring nature of Wireless Logic's buy-and-build strategy means acquisition charges will persist in future filings, complicating statutory profitability comparisons and potentially affecting covenant calculations if debt facilities reference statutory EBITDA."
    claimRefs:
      - CI004
      - CI006

  - calloutType: risk
    title: "ARPU compression and airtime commoditisation"
    body: "Analysys Mason forecasts that blended IoT connectivity ARPU will decline from approximately $0.35 to $0.30 per SIM per month by 2032 as airtime commoditises. Wireless Logic's managed platform and switching costs provide partial insulation, but any degradation in premium ARPU positioning — particularly in segments where newer MVNOs compete on price — would apply direct pressure to revenue-per-connection and margin."
    claimRefs:
      - CI018
      - CI036
      - CI037

  - calloutType: insight
    title: "€2B SACV provides institutional valuation anchor and extends runway"
    body: "The November 2025 continuation vehicle is the largest single-asset IoT connectivity fund vehicle on record and validates Wireless Logic's private market valuation at institutional scale. The SACV structure extends Montagu's investment horizon, removes near-term IPO pressure, and provides GP Solutions and secondary LP capital as financial backstops for continued acquisition activity and the Arqia Brazil build-out."
    claimRefs:
      - CI011
      - CI015
      - CI033

  - calloutType: recommendation
    title: "Priority data-room requests for financial underwriting"
    body: "Three deliverables would move the financial assessment from indicative to underwritten: (1) a consolidated gross-margin bridge by revenue stream (airtime vs. managed services vs. platform), (2) a net-debt schedule with EBITDA covenant levels and refinancing timeline under the SACV structure, and (3) the Arqia Brazil standalone P&L and R$200 million investment draw schedule with FX hedge documentation."
    claimRefs:
      - CI038
      - CI030

