callouts:
  - calloutType: recommendation
    title: Research-more / Track at £3.5 billion
    body: >-
      Wireless Logic is a genuine IoT platform leader with verifiable scale and strong
      institutional validation. But the £3.5 billion valuation at 10–14x confirmed FY2024
      revenue and ~34x EBITDA is stretched relative to every public and private comparable.
      The upgrade path to buy requires confirming FY2025 revenue ≥£380M, net debt ≤4x EBITDA,
      and NRR >110% from audited management accounts. Do not underwrite at the current
      mark on unverified forward projections.
    claimRefs:
      - CV001
      - CV017
      - CV042
      - CV051

  - calloutType: risk
    title: CV-squared structure is a governance and liquidity concern
    body: >-
      Montagu's second continuation vehicle for Wireless Logic is a rare CV-squared structure
      where the same GP prices an asset across two successive continuation funds. Bloomberg
      identified this practice as a source of investor concern about pricing conflicts and
      delayed value crystallisation. The structure limits LP liquidity and places pricing
      authority with the GP rather than an arm's-length market. Secondary buyers (TPG, CVC,
      Partners Group) cleared due diligence, providing some validation, but the governance
      risk remains material and should be tracked.
    claimRefs:
      - CV048
      - CV049
      - CV050

