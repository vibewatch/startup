chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              FieldAI 是一家位于加州 Irvine 的机器人 AI 软件公司，2023 年由 NASA Jet Propulsion Laboratory（JPL）老兵 Ali Agha
              创立。公司的核心判断是，工业机器人普及的卡点不在硬件，而在智能：机器人缺少适应性强、能感知风险的自主能力，无法在无结构真实环境里稳定作业。FieldAI 的解法是打造 Field Foundation
              Models（FFMs），这是一类「物理优先」基础模型，训练数据来自真实物理部署中的传感器，而不是互联网文本或图像。FFMs 充当通用软件大脑，可以装到多种机器人平台上——四足机器人、人形机器人、轮式
              rover、履带车和乘客级自动驾驶车辆——不需要为每个平台重新编程，也不依赖预建地图、GPS 或云连接。机器人完全在边缘端实时决策。FieldAI
              把平台卖给建筑、能源、采矿、制造、物流、城市配送、巡检和国防领域的企业工业客户。公司明确不造机器人；它是纯 AI 软件供应商，与机器人 OEM
              合作，把软件部署到客户自有或第三方机器人硬件上。这个不绑定硬件的模式把 FieldAI 放在机器人技术栈的「大脑层」，类似企业计算里用 OS 或中间件抽象底层硬件。Bill Gates
              对公司的描述很直接：FieldAI「为其他公司的机器人开发 AI 软件，让它们能感知环境、在没有 GPS 的情况下导航，甚至相互通信」。主要收入来自 B2B
              软件授权和硬件集成服务；据报道，订阅费用按部署规模不同，从数万美元到每年 $500,000 不等。截至 2026 年 4 月，知情人士称公司已签约收入超过 $100 million，并与大型工业客户建立合作。
