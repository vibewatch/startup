      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              FieldAI 的财务画像是一家资本充足、早期有收入的软件公司，增长快到能在 24 个月内吸引 $405M 融资，但对外部承销仍过于不透明。 $2B
              估值完全由投资人信号、增长轨迹和团队履历支撑，而不是经验证的财务基本面。如果 $140M ARR 估计准确，且同比增长 50–100%， 这一估值对一家创造新品类的 AI 软件公司仍在合理区间；如果 ARR
              明显更低或增长更慢，倍数就很难辩护。前瞻资本充足度看起来稳健： $405M 融资对应的是纯软件运营模型（没有硬件制造资本开支、没有库存融资），再加上披露的 >$100M 预订收入，意味着下一轮融资前至少有 2–3
              年运营跑道。 最大的尽调风险不是偿付能力，而是信息不对称——公开可验证内容与承销估值所需内容之间的缺口，对一家 $2B 公司而言异常宽。
            claimRefs:
              - CI030
              - CI031
              - CI032
