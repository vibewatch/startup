        - Spot 夜间自主巡检 → 每日 3D 进度报告并接入 BIM
        - 巡检 / 文档时间减少 90%+（Boston Dynamics 新闻稿）
        - 主张未获独立第三方验证；单一供应商来源
      - - 工业设备巡检
        - 受训技师在危险区域人工巡检
