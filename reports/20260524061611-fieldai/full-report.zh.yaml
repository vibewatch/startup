      - number: '6.3'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >
              Big-D Construction 和 DPR Construction 是 FieldAI 两个完全具名、已生产部署且公开归因结果的客户。Big-D 是一家在商业建筑领域有 25+ 年经验的美国承包商， 截至
              2026 年 4 月已活跃部署超过两年。C-level 高管 Shaun Orr 描述了一个突破时刻：机器人实时走遍项目现场，连接 BIM 模型和项目进度，
              识别缺失工作和安全问题，并把发现关联回公司的项目管理平台——这种能力单个真人团队无法独立复制。Orr 预计“每个项目都会以某种形式使用 FieldAI 工具”。 Big-D 项目主管 Bronson Dupaix
              描述，用机器人替代了手持相机和扫描仪进行的五小时人工巡场。Big-D 总监 Chantelle Menlove 也独立提到，
              一名现场主管在一个工地见过机器人后，打电话要求在下一个工地使用，显示出自下而上的有机需求。

              DPR Construction 是美国十大承包商之一（专长于数据中心和医疗设施），截至 2025 年 11 月，已在加州 Santa Clara 一个数据中心工地托管 FieldAI 机器人约 1.5 年。
              机器人拍摄 45,000+ 张照片，行走 100+ 英里，扫描 500,000 平方英尺室内空间和 125,000 平方英尺屋面。项目主管 Justin Schreiner 表示，
              该系统通过移除琐碎文档任务、让团队专注关键工作，“让我们把事情做得更好”。

              Certis Group 是新加坡最大的安防和运营公司，2026 年 2 月宣布与 FieldAI 建立战略合作，将在全球运营中部署自主安防机器人。 Certis 的 Mozart 编排平台与 FieldAI 的
              FFM 集成，在多场地安防环境中执行自主巡逻、事件检测和人机协同。Certis 总裁 Ng Tian Beng 确认， 该合作面向“实时、任务关键环境”。这不是直接客户销售，而是渠道 / OEM
              式安排：Certis 既是合作伙伴，也是安防垂直中的运营方客户。

              2026 年 3 月 FieldAI / NVIDIA 新闻稿引用了一位未具名全球工业制造高管的话，称某流程“过去需要三个半月，现在只需十二小时”——提升 200×。
              客户未具名，指标无法验证，但该引述由具名公司高管（CEO Ali Agha）在正式新闻稿中归因。另有两家未具名 ENR 前 10 公司出现在 robotsinconstruction.com 独立跟踪中，
              拥有确认生产部署，但没有披露结果。
