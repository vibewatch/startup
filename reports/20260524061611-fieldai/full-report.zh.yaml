        - 监测 Spot 价格趋势，以及 FieldAI 与 OEM 合作伙伴的授权费 / 收入分成模式
      - - 资本开支周期与 ROI 验证要求
        - 约束
        - 负向
        - 持续
        - 企业采购委员会扩量前要求多年 ROI 证明；拖慢收入确认
        - FieldAI 有多少试点转为多年企业合同？平均销售周期多长？
      - - 集成复杂度与遗留 OT/IT 系统
