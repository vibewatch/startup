      - number: '3.4'
        title: 差异化持久性、护城河分析与反向证据
        blocks:
          - type: paragraph
            body: >
              FieldAI 宣称的护城河建立在四根支柱上：(1) 物理优先、风险感知的基础模型，训练于自有真实部署数据；(2) 不依赖云或 GPS 的边缘端部署，能进入云优先竞争者无法触达的市场；(3)
              跨建筑、能源、采矿和国防不断增长的机队形成数据飞轮；(4) 由 Boston Dynamics、Certis Group 和 Carnegie Mellon Robotics Innovation Center
              锚定的合作伙伴生态。现阶段独立评估这条护城河结构上很难：部署数据量和模型性能基准未公开，不绑定硬件的定位是优势，也意味着竞争者可以争取同样的机器人伙伴。几个反向信号值得关注。第一，Physical
              Intelligence 正以 $11 billion 估值融资——是 FieldAI 的 5.5×——尽管没有商业产品。如果 Pi 在 FieldAI 建立主导数据优势前商业化，更强的资本基础可能压缩
              FieldAI 的差异化窗口。第二，Google/Intrinsic/Fanuc 集成（1.1 million 台已部署机器人获得 AI 升级）代表一种 FieldAI
              无法有机复制的装机基础杠杆。第三，UpsideList 2026 年 3 月分析给出一个 50% 概率的悲观情景：NVIDIA Isaac 或 Boston Dynamics 内化自主层，通过降价融资抹掉
              FieldAI 普通股价值。关键在于，FieldAI 最显眼的合作伙伴 Boston Dynamics 本身运营 Orbit 软件平台，背后有 Google Gemini
              支持，也可能选择开发竞争性自主能力。第四，针对 Covariant 这一仓储 AI 类比公司的独立分析，把其数据护城河评为「窄，不宽」，理由是 Physical Intelligence、Nimble 和
              Amazon 都在竞争性积累数据；同样逻辑适用于任何具身 AI 平台。基础模型商品化风险真实存在：随着 VLA 模型通过开源发布（Pi 已开源早期模型）和超大规模云 API
              扩散，物理优先差异化可能从结构性护城河压缩成商业秘密。FieldAI 的防务垂直（FieldAI Federal，由前 DARPA PM Eric Krotkov 领导）和无 GPS
              边缘部署要求，可能是最可防守的细分，因为它们需要硬件认证和安全许可，形成独立于模型质量的监管切换成本。
