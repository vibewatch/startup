      - number: '1.4'
        title: 规模、合作伙伴与里程碑时间线
        blocks:
          - type: paragraph
            body: >
              FieldAI 自 2023 年创立以来增长很陡。公司在 2024 年底约有 30 名员工，到 2025 年 8 月融资公告时增至约 130 人；LinkedIn 在 2026 年初显示员工数为 201–500
              人，与其到 2025 年底把员工数翻倍至约 260 人的计划一致。2025 年底，公司从 Mission Viejo 约 13,000 平方英尺办公空间迁入 Irvine Spectrum 的 3
              Morgan，建立 41,000 平方英尺 R&D 总部，驱动力是招聘和实验室扩张。FieldAI
              的生产部署如今覆盖三大洲——北美、欧洲和亚太（包括日本）——在数百个站点完成数千次任务。公司已吸引建筑、能源、制造、城市配送、安防和国防领域数十家大型企业客户，并成立 FieldAI Federal
              子公司服务政府和军事应用。2026 年初宣布了两项重大战略合作：2 月，Certis Group（新加坡领先的综合安防服务商）与 FieldAI 合作，在全球部署自主安防机器人；2026 年 3 月，Boston
              Dynamics 与 FieldAI 宣布合作，把 Spot 的机动能力与 FieldAI 的 FFMs 结合，服务建筑和其他动态环境。Boston Dynamics 创始人 Marc Raibert
              通过引用他们在 2020 DARPA SubT 的胜利来为公司背书：「自从 Ali 和他的团队用 Spot 机器人赢得 DARPA Subterranean Challenge 的
              Urban-circuit，并为 NASA 处理类似挑战以来，我们就认识他们。」Construction Dive 记录的一个关键风险指标是：受访承包商中的活跃机器人部署比例从 2024 年的 65% 降至
              2025 年的 46%，尽管正面评价达到 95%——这表明行业在意愿和实际采用之间存在摩擦，也会成为 FieldAI 近期商业化规模目标的逆风。
