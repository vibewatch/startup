        - 中 — 取决于训练算力；10²⁶ FLOP 门槛可能尚未达到
        - 中 — 单次违规最高 $1M；举报人保护启动
        - 模型扩展时跟踪训练算力报告义务
        - 低-中 — 现在可能尚未触发，但模型增长后可能越过门槛
        - 获取训练算力估计，以及 SB 53 适用性的法律意见
      - - AI 产品责任（EU PLD / 美国州侵权法）
        - 美国 / 欧盟
        - 判例法到 2026 年仍在演进；EU PLD 最晚 2026 年 12 月完成转置
        - 高 — 工业机器人场景中的人身伤害因果关系直接且可预见
        - 严重 — 设计缺陷、警示不足、供应链上游严格责任
        - 产品责任保险；安全文档；系统护栏；客户赔偿条款
        - 高 — 未发现已发布的安全认证、DPA 或独立审计
