      - number: '5.2'
        title: 架构与技术设计
        blocks:
          - type: paragraph
            body: >
              FFM 平台由三层模型组件构成。核心 FFM 利用视觉、LiDAR、文本和音频等多模态传感器流，处理感知、世界建模和决策。Dynamics Foundation Model（DFM）
              是子模型，整合机器人的内在运动学和动力学特性，让同一个认知层能够驱动机械形态不同的机器人本体。Multiagent Foundation Model（MFM）是协调层，
              让机群中的多台机器人共享环境表征，并在场地尺度上集体推理——把机器人群变成分布式自主系统，而不是一组孤立工具。

              架构上，FieldAI 在“信念空间”中运行：系统持续跟踪环境状态的概率分布，而不是假设信息完美。这一设计脉络可以追溯到 CEO Ali Agha 在 FIRM（Feedback-based
              Information RoadMap）信念空间规划上的学术工作，以及赢得 DARPA SubT 挑战赛第二阶段的 NeBula 系统。 这种概率方法意味着机器人可以在无
              GPS、低可见度和传感器退化条件下工作。FFM 遇到不熟悉情境时，会明确放慢速度或选择更保守路线——公司承认这会牺牲吞吐量，
              但把它视为安全特性。真实世界数据飞轮意味着每次部署都会随时间提升模型表现，形成复利式数据优势。

              NVIDIA 集成让工程栈更深。FieldAI 使用 NVIDIA Omniverse NuRec，从机器人日常作业顺带采集的传感器数据中重建高保真 3D 数字孪生。 这些数字孪生会加载到 NVIDIA
              Isaac Sim 和 Isaac Lab，用于机器人策略训练和验证；FieldAI 还在通过 Microsoft Azure 采用 NVIDIA Physical AI Data Factory
              Blueprint，使用 NVIDIA Cosmos 开放世界基础模型和 NVIDIA OSMO 自动化合成数据流水线。 公司的 GitHub 组织（field-ai）维护多个机器人基础设施库的活跃
              fork——Spot SDK、rosbridge_suite、spconv、unitree_sdk2—— 最近提交截至 2026 年 4 月，为平台集成面提供了开发者侧证据，但公司未公开自有模型权重或 SDK
              文档。私有 Squarespace 发布说明页面进一步限制了外部审计已交付能力的空间。
