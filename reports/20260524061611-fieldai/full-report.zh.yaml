        - 欧盟 / 全球
        - 义务自 2026 年 8 月起适用（若 Digital Omnibus 通过，最终期限延至 2027 年 12 月）
        - 高 — FieldAI 在欧盟市场的工业自主部署很可能被认定为高风险
        - 严重 — 市场准入被阻断，罚款最高达 €35M 或全球收入的 7%
        - 准备合规计划；技术文档；CE 标志流程
