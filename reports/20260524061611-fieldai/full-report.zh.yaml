  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: wide
    summary: |
      从证据质量到估值判断，再到最终 TRACK 建议的决策逻辑；展示哪些证据升级会改变结论。
    data:
      nodes:
        - id: team
          label: 创始团队信号
          detail: Ali Agha（DARPA SubT/JPL）、Omidshafiei（DeepMind）、Fan（DARPA RACER）→ 强正向
        - id: investors
          label: 投资方质量信号
          detail: Bezos Expeditions、Khosla、NVentures、Temasek、Intel Capital → 超额认购 → 强正向
        - id: technology
          label: 技术差异化
          detail: 物理优先 FFM；硬件无关；边缘推理 <100ms；联邦学习 → 中强正向
        - id: revenue
          label: 收入证据质量
          detail: 未验证：$5M–$140M 区间；OCBJ 匿名来源；无审计财务 → 重大缺口
        - id: valuation
          label: 估值评估
          detail: $2B 下，未验证的 $100–140M ARR = 14–20x；若 $5M = ~400x；收入若真实，估值偏高但仍在可比区间内
        - id: governance
          label: 治理不透明
          detail: 无董事会披露；运营实体没有 Form D；无股权结构表细节 → 显著风险
        - id: recommendation
          label: 建议：TRACK
          detail: 强投资逻辑 + 顶级投资方，被未验证收入和估值拉伸抵消 → 先 TRACK，等验证点出现
        - id: upgrade_path
          label: 升级至 BUY 路径
          detail: 已审计 ARR ≥$100M + GM ≥60% + NRR ≥110% → 在或接近 $2B 时升级至 BUY
      edges:
        - from: team
          to: recommendation
          label: +
        - from: investors
          to: recommendation
          label: +
        - from: technology
          to: recommendation
          label: +
        - from: revenue
          to: recommendation
          label: 缺口 → 谨慎
        - from: valuation
          to: recommendation
          label: 估值拉伸 → TRACK
        - from: governance
          to: recommendation
          label: 不透明 → TRACK
        - from: recommendation
          to: upgrade_path
          label: 升级条件
    approximationNotes: |
      逻辑流是定性判断；节点权重是基于现有公开证据的评估，不是量化打分。投资方质量信号是最强正向；收入证据缺口是升级至 BUY 的主要约束。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV015
      - CV036
  - id: FV002
    title: 估值对收入假设的敏感性
    type: bar
    layout: standard
    summary: |
      在不同收入情景下，$2B 估值隐含的 EV/ARR 倍数，并以 Houlihan Lokey AI 原生软件中位数（21.2x）作参照。
    data:
      items:
        - label: $5M ARR（CompWorth 估算）
          value: 400
        - label: $20M ARR（悲观情景）
          value: 100
        - label: $50M ARR（保守）
          value: 40
        - label: $100M ARR（OCBJ 匿名）
          value: 20
        - label: $140M ARR（GetLatka 估算）
          value: 14
        - label: HL AI 原生软件中位数（21x）
          value: 21
        - label: $200M ARR（乐观前瞻）
          value: 10
    approximationNotes: >
      所有收入值都是估算或第三方报道；没有一个经过审计。$2B 估值分母来自 Reuters/CNBC 所称知情人士。Houlihan Lokey 21.2x 中位数适用于 财务已验证的 AI 原生软件公司——FieldAI
      收入未验证，因此该对比是示意，不是精确可比。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV028
  - id: FV003
    title: 估值与回报区间——乐观、基准、悲观
    type: range
    layout: standard
    summary: |
      在乐观、基准、悲观情景下，下一轮融资（2027–2028）的隐含估值结果；当前 $2B 标记作为参照。
    data:
      items:
        - label: 悲观（降价轮，收入 <$50M，倍数压缩）
          low: 400
          mid: 700
          high: 1000
        - label: 当前估值标记（$2B，2025 年 8 月）
          low: 2000
          mid: 2000
          high: 2000
        - label: 基准（2028 年 B 轮，$200–300M ARR @ 10–12x）
          low: 2000
          mid: 2800
          high: 3600
        - label: 乐观（2027 年 B 轮，$350–500M ARR @ 15–20x）
          low: 5250
          mid: 7500
          high: 10000
    approximationNotes: |
      所有情景区间都是基于可比公司倍数和既定收入假设的建模估算。没有审计财务，任何情景都无法验证。回报计算假设以 $2B 入场且没有额外稀释； 实际稀释会降低回报。数值单位为百万美元。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV030
  - id: FV004
    title: 投资 KPI——评分摘要
    type: kpi
    layout: standard
    summary: |
      可提交 IC 的 FieldAI 七项投资维度评分；0–10 分，10 代表同类最佳。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          detail: 建筑、能源、采矿、物流、防务 TAM 庞大；渗透率低；劳动力短缺带来宏观顺风
        - label: 技术护城河
          value: 8
          unit: /10
          detail: 物理优先的 FFM；不绑定硬件；已在现场跑通；3+ 年自有部署数据；联邦学习飞轮
        - label: 团队 / 创始人-市场匹配
          value: 9
          unit: /10
          detail: 一流团队；DARPA SubT 夺冠；NASA JPL、DeepMind 背景；现场机器人 AI 领域暂无同等团队厚度
        - label: 商业验证
          value: 5
          unit: /10
          detail: 公司称覆盖数百个站点、3 个大洲；已签约订单额 >$100M（匿名、未经审计）；没有客户名称，也没有经验证 ARR
        - label: 财务透明度
          value: 2
          unit: /10
          detail: 没有经审计财务报表；运营实体没有 Form D；收入区间跨度达 28x；治理情况未披露
        - label: 估值与基本面
          value: 4
          unit: /10
          detail: 若 ARR 为 $100–140M，$2B 估值对应 14–20x（可成立）；若为 $5M，则为 400x（不合理）；核心风险在于不确定性
        - label: 退出准备度
          value: 5
          unit: /10
          detail: 没有 IPO 时间表；没有并购信号；距离 Series B 轮可能还要 2+ 年；战略收购方池子很大（NVIDIA、Amazon、Honeywell、Emerson）
    approximationNotes: >
      截至 2026 年 5 月，评分是分析师基于公开证据作出的定性判断。财务透明度 2/10 分，反映这家 $2B 公司不透明度异常高；若开放尽调资料室披露，分数会明显上调。综合评分（未加权平均）约为
      5.9/10，因此更支持“观察”，而不是“买入”。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV033
