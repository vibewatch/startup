  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 论点
      - 证据基础
      - 哪些情况会改变判断
    rows:
      - - 投资逻辑：机器人硬件商品化时，硬件无关 AI 软件能拿到近似垄断份额
        - FFM 已部署在四足、人形、轮式、履带式平台；TechCrunch 和官方来源确认硬件无关架构
        - OEM 垂直整合（Boston Dynamics、Figure）拿走大脑层；或超大规模云厂商（Google Intrinsic、NVIDIA Cosmos）把基础模型商品化
      - - 投资逻辑：创始团队在现场机器人领域拥有最高信誉
        - DARPA SubT 胜利、NASA JPL、MIT/DeepMind 履历均有记录；Marc Raibert/Vinod Khosla 背书在案
        - 若 CEO 离职出现关键人物风险；CSO 或 CTO 被资金更充足的竞争对手吸引
      - - 投资逻辑：顶级投资者投入 $405M，反映专有尽调优于公开数据
        - 轮次超额认购；Bezos Expeditions、Temasek、Khosla、NVentures 均参与；投资者声明确认商业信心
        - Series B 出现降价融资轮会反驳专有尽调逻辑；若投资者下调持仓估值，信号反转
      - - 投资逻辑：公告后 9 个月已签约收入超过 $100M，商业牵引速度异常快
        - OCBJ 2026 年 4 月匿名来源；GetLatka 估计 $140M ARR；CEO 称有数百万美元合同
        - 已签约收入被混同为管线；ARR 实质更低；流失暴露客户不满意
      - - 反向逻辑：收入未验证，估计区间相差 28x
        - 估计从 $5M（CompWorth）到 $140M ARR（GetLatka）不等；没有经审计数字；OCBJ 使用匿名来源
        - 公司发布经审计 ARR；若数字高于 $80M，将基本弥合这个缺口
      - - 反向逻辑：一家 $2B 公司，治理不透明程度极高
        - 未披露董事会构成；Field Ai, Inc. 没有 Form D；无经审计财务；无股权结构表细节
        - NDA 下正式开放资料室即可满足；IPO 前财务报告会弥合缺口
      - - 反向逻辑：AI 软件倍数压缩是 2026–2027 年的结构性风险
        - Howard Morgan（First Round Capital）警告 AI 估值过热；Madrona 合伙人指出种子轮 / Series A 价格大幅领先基本面
        - 若已验证收入推动全行业重估上行，将抵消这一点；或 FieldAI 自己 Series B 大幅升值也会确认
      - - 反向逻辑：竞争对手（Physical Intelligence、Skild AI）以相当或更弱收入拿到更高估值
        - PI 在零收入情况下洽谈 $11B；Skild 以 $30M ARR 拿到 $14B；行业期权溢价推高所有估值
        - 如果行业倍数压缩，且 PI 或 Skild 平轮 / 降价轮融资，FieldAI 的 $2B 可能显得昂贵
    notes: |
      投资逻辑行代表乐观 / 证实解释；反向逻辑行代表悲观 / 挑战解释。两组截至 May 2026 runDate 均有证据支持。
