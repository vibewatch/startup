      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              FieldAI 的投资逻辑建立在五个相互咬合的支柱上。第一，工业机器人硬件商品化之后，具身 AI
              软件层在结构上有机会拿走企业价值的大头：一个不绑定硬件的软件大脑，能跨多样化部署做联邦学习并形成网络效应，天然具备垄断吸引力。第二，创始团队——Ali Agha（NASA JPL/DARPA SubT
              获胜者）、Shayegan Omidshafiei（DeepMind/MIT）和 David Fan（DARPA
              RACER/JPL）——有可信的先验证据，证明该方法能在野外条件下跑通，而不只是停留在仿真里。第三，投资人财团（Bezos Expeditions、Khosla
              Ventures、NVentures/NVIDIA、Temasek、Intel Capital、Gates Frontier）可能是机器人 AI
              公司周围信念最强的一组战略和财务投资人，他们完成了外部无法取得的私下尽调。第四，公司退出隐身时，生产部署已在三大洲数百个站点上线，并在公告后九个月内报告 >$100M 已签约收入——商业牵引速度快过任何可比具身
              AI 软件公司。第五，建筑、能源、采矿、物流和国防横跨的总可用市场很大，渗透率仍低。


              反向逻辑逐一挑战这些支柱。如果机器人 OEM 垂直整合自己的 AI 软件（Boston Dynamics、Figure AI、Agility
              Robotics），或超大规模云厂商（Google/Intrinsic、NVIDIA Cosmos）把基础模型层商品化，不绑定硬件的优势可能被侵蚀。收入数字仍未验证：$100M
              已签约收入来自匿名来源，「已签约」可能包括管线或未承诺订单；$140M ARR 估计来自一家未披露方法的第三方分析平台；另一个估计把收入压低到 $5M，差距高达
              28x。外部投资人几乎看不到治理和财务透明度：没有审计财务、没有经营实体 Form D、没有披露毛利率、CAC 或 NRR。$2B 估值已经计入大量执行成果：即便按 $140M ARR，14x
              收入倍数也需要高毛利、高留存和持续快速增长，才足以支撑二级入场。资深投资人 Howard Morgan（First Round Capital/B
              Capital）曾公开警告，「高买、更高卖只在泡沫里成立」；Seattle 地区 VC 在 2025 年 12 月 GeekWire 圆桌中也指出，种子轮和 Series A
              私营市场估值已大幅跑在基本面前面。2026–2027 年环境下，Series B+ AI 软件倍数压缩是真实风险。
