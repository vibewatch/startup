  - id: TI003
    title: 单位经济模型——披露、估计与未知项
    columns:
      - 指标
      - 数值 / 估计
      - 置信度
      - 为何重要
      - 尽调要求
    rows:
      - - 毛利率（软件授权）
        - 估计 65–80%（企业 AI 软件行业基准）
        - 低 — 估计值；未披露
        - 长期现金生成的核心驱动；必须高于边缘计算 + 支持的边际成本
        - 向管理层请求管理账中按收入来源拆分的毛利率瀑布
      - - 毛利率（硬件集成服务）
        - 估计 20–45%（现场服务和集成工作）
        - 低 — 估计值；未披露
        - 服务毛利率会稀释综合毛利率；服务与授权收入占比很关键
        - 披露服务与软件收入拆分及各自毛利率
      - - 综合毛利率
        - 估计 55–75%（取决于授权 / 服务组合）
        - 低 — 估计值；未披露
        - 与估值相关：软件级毛利率能支撑溢价倍数，混合毛利率则不行
        - 请求最新 P&L 或贡献毛利数据
      - - 获客成本（CAC）
        - 未披露；考虑 12–24 个月销售周期，估计每个企业客户 $200K–$1M
        - Unknown
        - CAC 高、即便回本周期短，也会带来现金流风险；回本周期长则需要 NRR 黏性强
        - 请求按客户分群拆分的综合 CAC 和回本周期
      - - 净留存率（NRR）
        - 未披露；官方公告提到「扩张合同」
        - Unknown
        - NRR >120% 会验证先落地再扩张模式，并显著抬高 LTV 估计
        - 请求队列留存数据；确认扩张合同是否提高 ACV
      - - 平均合同金额（ACV）
        - 基于数百万美元级交易说法和定价区间，估计为 $300K–$2M
        - 低 — 估计值
        - ACV 决定 LTV/CAC 分析；估计区间很宽，说明信息缺口大
        - 披露 ACV 四分位；确认 ACV 是否包含集成费
      - - 人均收入
        - 估计 ~$900K–$1M（若按 $140M ARR / 150 名员工计算）
        - 低 — 分子和分母都是估计值
        - 若准确，是很强的生产率信号；可验证软件模式的可扩展性
        - 同时确认员工数和 ARR，以验证该比率
      - - 烧钱倍数（每新增 $1 ARR 消耗的资本）
        - 估计 1.5x–3x（与激进增长期 AI 同行一致）
        - 低 — 估计值；未披露
        - 烧钱倍数高意味着资本效率低；高效增长的目标应 <1.5x
        - 向管理层请求滚动 12 个月现金消耗和新增 ARR
    notes: |
      所有单位经济模型数值都由可比上市公司基准和可观察运营数据（员工数、定价区间、交易规模说法）估算。 没有经审计数据。置信度统一偏低；这些估计应作为情景建模的方向性输入，而不是已确认指标。
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
