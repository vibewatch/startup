      - number: '2.2'
        title: 市场规模测算视角
        blocks:
          - type: paragraph
            body: >
              没有任何单一公开分析师数字能干净捕捉 FieldAI 的可服务市场，因为大多数分析师报告要么定义过宽（包括硬件或全部工业自动化），要么过窄（只覆盖一个垂直领域）。最有参考价值的跨领域数字来自 Global
              Market Insights 对 AI 驱动工业机器人市场的估计：2026 年 $17.9 billion，按 7.1% CAGR 增至 2035 年 $33.3 billion。这个数字包含硬件，但能提示
              FieldAI 所瞄准的 AI 增强机器人软件层的规模。另一个参照是 The Business Research Company 对工业人工智能市场（所有软件、平台、解决方案）的估计：2026 年 $13.69
              billion，到 2030 年以 51.1% CAGR 指数级增长至 $73.54 billion；这是覆盖制造、能源和物流的最宽用例集合，并不专指无结构环境。


              对 FieldAI 的四个核心垂直领域，垂直领域规模数字能给出更清晰信号：建筑机器人：2026 年 $7.79 billion（TBRC）和 $1.4 billion（Grand View
              Research，对建筑机器人本身采用较窄定义）；区间差异来自定义范围不同，较低数字可能更适合单独衡量机器人平台。采矿机器人：2026 年 $1.7 billion（PMR），按 9.8% CAGR 增至
              2033 年 $3.3 billion。油气机器人：2026 年 $3.8 billion（MarkWide Research），按 14.6% CAGR 增至 2035 年 $12.96
              billion；仅巡检子领域在 2026 年就估计为 $0.93 billion（Fortune Business Insights）。具身 AI 市场（跨垂直领域、所有物理 AI 系统）预计到 2030 年达到
              $7.24 billion，CAGR 为 17.5%（Research and Markets）。


              对 FieldAI 纯软件、无结构环境市场做保守自下而上的 SAM 估计——在 2026 年建筑 + 采矿 + 油气机器人硬件和服务合计 $13.2 billion 的垂直市场上，套用 15–25%
              的软件份额假设——得到 FieldAI 当前垂直领域中 2026 年可触达软件支出的 SAM 约为 $2–3.3 billion。这个估计天然不确定，置信度低；FieldAI 未公布 SAM
              数字，也没有分析师发布专门针对「无结构环境工业机器人 AI 软件」的市场估计。IFR 的 World Robotics 2025 报告记录，2024 年工业机器人装机 542,000 台，全球在役 4.66
              million 台；其中有多少部署在 FieldAI 的 FFMs 能创造价值的无结构环境里，并未单独量化。分析师估计分歧很大（见 TM002），相互矛盾的规模数字作为证据缺口保留。
