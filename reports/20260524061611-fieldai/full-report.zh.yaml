        - 未发布误报率或覆盖率数据
      - - 数字孪生生成
        - 人工 3D 扫描专项 — 完成需数月，且很快过时
        - 机器人把日常作业副产物转成重建数据 + NuRec → Isaac Sim
        - 某未具名客户从 3.5 个月缩短到 12 小时（速度提升 >200×，公司主张）
        - 单一未具名客户；未获独立验证
