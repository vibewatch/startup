      - number: '3.2'
        title: 竞争对手画像与能力对比
        blocks:
          - type: paragraph
            body: >
              Intrinsic 现已并入 Google（2026 年 2 月），提供 Flowstate，这是面向工业机器人的网页版开发和仿真环境。该平台可跨 KUKA、Fanuc、Universal Robots
              等硬件运行，并借助 Google Gemini AI 模型完成视觉和推理。2026 年 5 月与 Fanuc 的合作让 Google 触达 1.1 million
              台已部署工业机器人——这是任何创业公司都无法匹配的分销通道。Intrinsic 在五年开发后于 2023 年 1 月裁撤 20% 员工，也未披露商业收入，但被 Google 吸收以及与 Foxconn
              的合资（2025 年 10 月）表明其商业化意图正在加速。Physical Intelligence（Pi）是一家研究优先的基础模型公司，成立于 2024 年，截至 2026 年 3 月没有商业产品或收入。其
              π0.7 模型（2026 年 4 月）在操作任务上显示出涌现泛化能力，据报道正以 $11 billion 估值融资 $1 billion。Pi 的
              VLA（Vision-Language-Action）架构瞄准从实验室到生产的迁移。Covariant 是机器人基础模型早期玩家（RFM-1，8B 参数，2024 年 3 月发布），但创始人和约 25% 员工在
              2024 年 8 月被 Amazon 收购式招募，换取一份非独家技术授权。剩余公司由新 CEO Ted Stinson 领导，继续服务非 Amazon
              物流客户（服装、杂货、制药），但面临公司不确定性，以及竞争性数据积累者带来的窄护城河。Gecko Robotics 把自研 TOKA 巡检机器人与 Cantilever AI
              平台结合，用于关键基础设施数字孪生，2025 年 6 月达到独角兽状态（$1.25 billion 估值），并在 2026 年 3 月赢得一份 $71 million、五年期 U.S. Navy IDIQ
              合同。Gecko 的市场深入能源、国防和制造巡检，但结构上比 FieldAI 的横向雄心更窄。Boston Dynamics（Hyundai 旗下）提供 Spot、Stretch 和 Atlas
              机器人，以及用于机队智能的 Orbit 软件平台。2026 年 3 月，Boston Dynamics 宣布与 FieldAI 直接合作，把 Spot 扩展到未知、动态环境——这让 Boston Dynamics
              同时成为硬件伙伴，也随着 Orbit 扩大与 Google Gemini 的 AI 集成而成为潜在软件竞争对手。Machina Labs 专注 AI
              驱动的机器人钣金成形（RoboCraftsman），服务国防和航空航天，2026 年 2 月完成 $124 million Series C。它不是 FieldAI
              巡检和自主能力重点的直接竞争对手，但会争夺国防预算和 OEM 机器人心智。Viam 是开源机器人软件平台（累计融资 $117 million），面向希望在 IoT、机器人和工业机器之间抽象硬件的开发者。Viam
              争夺同一个「大脑层」叙事，但定位是开发者 SDK 路线，而 FieldAI 依赖预训练 AI
              模型。内部自建仍是默认在位者：大型工业公司（能源、采矿、建筑）保留内部机器人和软件工程团队。内部自建的单位经济很难量化，但当商业平台无法满足所需安全认证或数据驻留限制时，它就会成为默认选择。
