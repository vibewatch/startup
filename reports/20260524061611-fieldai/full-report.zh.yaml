      - number: '7.4'
        title: 人才、团队与执行风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 创始团队具备极强领域可信度——Ali Agha 领导 DARPA SubT 获胜 CoSTAR 团队，以及此前担任 NASA JPL principal investigator，
              是投资人和客户信心的主要基础。这也造成集中的关键人物风险：Agha 同时是公司公众面孔、首席技术思想领袖和最显眼的商业关系所有者。 公开信息中没有发现具名 COO、Head of
              Engineering，或具备同等公开分量的并行商业负责人。David Fan（CTO）和 Shayegan Omidshafiei（CSO / President） 提供了一定领导层深度，但公开画像远不及
              Agha。若 Agha 非自愿离职、长期失能或卷入声誉事件，很可能同时扰动融资、企业客户信心和伙伴关系。

              创始人之外，FieldAI 还面临快速扩张带来的人才风险，而这又发生在科技行业竞争最激烈的劳动力市场之一。员工数据称从 2023 年创立增长到 2025 年 8 月的 130+，
              这种年化增速会让文化维护、工程协同和产品执行纪律很难持续。公司争夺机器人 AI 工程师的对手包括 Google Intrinsic（现已整合入 Google AI）、 Physical
              Intelligence（已融资 $700M+）、Amazon Robotics 和 Tesla Optimus——这些公司都在同一个狭窄人才池中招聘能规模化做具身 AI 的博士和资深工程师。
              未发现融资后关键技术人员离职的证据，但没有公开证据并不等于稳定得到确认。

              执行风险也体现在商业维度。FieldAI 直到 2025 年 8 月才走出隐身状态，可证明的企业销售能力运行还不到一年。公司没有发布客户名称、 带验证结果的部署案例或留存指标。团队从研究谱系（NASA
              JPL、DARPA）转型为对收入负责的企业软件供应商，是一个有充分案例证明的组织拐点； 许多深科技 spinout 都没能足够快地跨过去，因而无法支撑自己的估值轨迹。
