      - number: '1.3'
        title: 融资历史与投资人构成
        blocks:
          - type: paragraph
            body: >
              FieldAI 从 2023 年创立后一直处于隐身状态，直到 2025 年 8 月 20 日同时披露连续两轮融资共 $405 million，并宣布 $2 billion 估值——较上一轮确定的 $500
              million 估值翻了四倍。最近一轮融资 $314 million，且获得超额认购；共同投资人包括 Bezos Expeditions（Jeff Bezos 的家族办公室）、Prysm Capital 和
              Temasek。两轮融资中的其他投资方包括 BHP Ventures、Canaan Partners、Emerson Collective、Intel Capital、Khosla
              Ventures、NVentures（NVIDIA 的风险投资部门）等。Gates Frontier（Bill Gates 的投资机构）和 Samsung 被列为「此前投资人」，表明它们参与了设定 $500
              million 估值的上一轮。按已披露总额倒推，第一轮融资约 $91 million。注意：部分前期尽调资料把拆分写成 $150 million（seed）加 $255 million（Series
              A）；这一拆分与 Reuters 关于最新一轮 $314 million 的报道不一致，也无法从一手来源确认。超额认购和投资人质量——横跨科技风投领袖（Khosla、NVentures、Intel
              Capital）、主权与机构资本（Temasek、BHP）、慈善资本（Gates Frontier、Emerson Collective），以及全球最富个人的家族办公室（Bezos
              Expeditions）——体现了异常广泛的投资人信心。Vinod Khosla 表示：「FieldAI 站在通用机器人革命前沿，其快速部署能力将释放长期经济和社会价值。」Intel Capital
              的公开背书帖正式确认了与 Intel 硬件栈的平台集成和战略关系。融资用途包括全球扩张、产品开发（移动、操作）和员工扩张，目标是在 2025 年底前把团队翻倍。
