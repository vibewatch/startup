      - number: '8.3'
        title: 可比估值与市场背景
        blocks:
          - type: paragraph
            body: >
              具身 AI 和工业机器人软件赛道提供了一组有用但不完美的可比公司。在具身 AI 软件同业中，Physical Intelligence 正在洽谈接近 $11B 的估值，披露收入接近零（2026 年 3
              月）——这是一个由研究声望和期权价值驱动的极端离群点，而非当前商业牵引。Skild AI 在 2026 年 1 月以 $14B 估值融资，ARR 为 $30M 且指数式增长，意味着在小基数上约 467x
              的前瞻倍数——同样是早期阶段期权倍数，不是基本面倍数。这些可比项确认，投资人群体正在给具身 AI 软件平台很高的期权溢价，但从接近零收入对应 $14B–$5.6B 的宽区间，也说明终局价值假设极不确定。


              如果 $100–140M ARR 估计正确，FieldAI 的 $2B 估值对应的倍数（14–20x）其实低于最接近的两个具身 AI 软件同业；只要收入真实，在品类内看起来定价有吸引力。但如果真实收入只有
              $5–20M，隐含倍数（100–400x）就会成为该赛道最激进的一档。硬件集成型可比公司——Apptronik（$5.3B，人形机器人硬件 + 软件）和 Gecko
              Robotics（$1.25B，关键基础设施巡检）——业务模式结构不同，软件毛利更低，但收入更可验证，会把纯软件估值的可比倍数向下拉。Houlihan Lokey 2026 年 Q1 AI 垂直软件报告显示，AI
              原生软件公司在 VC 轮次中的 EV/Revenue 中位数为 21.2x，而 AI 赋能软件为 8.5x，传统 SaaS 为 5.5x。按 $100M ARR 和 21x，FieldAI 可支撑约 $2.1B
              估值——大体符合当前标记。关键风险在于，该中位数适用于财务已验证的公司，而 FieldAI 的收入完全没有外部验证。
