  - id: FE001
    title: FieldAI 产品架构栈
    type: stack
    layout: standard
    summary: FFM 平台从传感器输入到应用输出的分层模型架构。
    data:
      layers:
        - label: 应用层
          detail: |
            八个解决方案模块：场地制图、设施巡检、异常检测、数据采集、物料运输、安全 / 威胁检测、远程临场、 搜索 / ISR。通过自有或合作伙伴载荷模式部署。
        - label: 多智能体基础模型（MFM）
          detail: |
            车队协同层。让多台机器人共享环境表征，并在场地尺度集体推理。面向高风险、非结构化的多机器人部署。
        - label: Field Foundation Model（FFM）核心——感知与世界模型
          detail: |
            物理优先的信念空间模型。处理多模态输入（视觉、LiDAR、文本、音频、热成像、事件相机）。维护概率不确定性估计。 重上下文而非训练——无需穷尽式预训练，也能在新场景推断行为。不依赖地图、GPS 或云端。
        - label: Dynamics Foundation Model（DFM）
          detail: |
            机器人专属动力学模型集成层。把世界模型与机器人本体解耦，让同一个认知「大脑」控制机械形态不同的平台 （四足、轮式、人形、乘用级）。
        - label: 边缘计算运行时
          detail: |
            只在设备端推理。没有云连接也能实现完全自主。运行在工业边缘硬件上（具体 SoC/GPU 未公开；从 NVIDIA 合作背景推断为 NVIDIA Jetson 级别）。
        - label: 仿真与训练基础设施（集成 NVIDIA）
          detail: >
            真实传感器数据进入 NuRec 3D 数字孪生，再到 Isaac Sim/Isaac Lab，再到 NVIDIA Physical AI Data Factory Blueprint（经 Azure），使用
            Cosmos + OSMO 合成数据管线。闭合仿真到现实差距，并借运营数据飞轮支持模型持续改进。
    approximationNotes: |
      层级边界和名称依据官方产品页、NVIDIA 合作新闻稿和 FAIRI 论文推断。DFM 和 MFM 有官方描述；内部模型权重和推理硬件未披露。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE016
      - CE030
  - id: FE002
    title: 客户部署流程
    type: flow
    layout: wide
    summary: FFM 平台如何在客户现场激活，并持续交付运营价值。
    data:
      nodes:
        - id: n1
          label: 机器人硬件采购
          body: Customer procures or owns compatible robot platform (e.g., Boston Dynamics Spot, Unitree, others).
        - id: n2
          label: FFM 软件安装
          body: >-
            FieldAI installs Field Foundation Models on-robot. No pre-mapping, GPS setup, or cloud wiring required. Site
            activation is rapid.
        - id: n3
          label: 初始现场激活
          body: >-
            Robot activates and begins exploration of unknown environment. FFM builds context from first-run sensor data
            without any prior map.
        - id: n4
          label: 自主任务执行
          body: >-
            Robot executes configured missions (inspection, mapping, patrol, transport) fully on-edge. MFM coordinates
            multiple robots if fleet-deployed.
        - id: n5
          label: 实时数据采集
          body: >
            Robot logs vision, LiDAR, and sensor streams as byproduct of normal operation. Data feeds FieldAI's
            operational flywheel.
        - id: n6
          label: NuRec 数字孪生生成
          body: >
            Sensor data transforms into high-fidelity 3D digital twin via NVIDIA NuRec. Customer receives continuously
            updated site reconstruction for planning, asset management, and safety oversight.
        - id: n7
          label: Isaac Sim 验证与模型改进
          body: >
            Reconstructed environments loaded into Isaac Sim/Isaac Lab for robot policy validation and retraining.
            Models improve per deployment; data flywheel compounds value over time.
        - id: n8
          label: 客户价值交付
          body: >
            Inspection reports, anomaly alerts, progress documentation, security patrol logs, and digital twin artifacts
            delivered to customer workflow systems (e.g., BIM, Mozart, ERP).
      edges:
        - from: n1
          to: n2
          label: 集成
        - from: n2
          to: n3
          label: 激活
        - from: n3
          to: n4
          label: 运行
        - from: n4
          to: n5
          label: 数据记录
        - from: n5
          to: n6
          label: NuRec 重建
        - from: n5
          to: n7
          label: 训练管线
        - from: n6
          to: n8
          label: 数字孪生产出
        - from: n4
          to: n8
          label: 任务产出
        - from: n7
          to: n4
          label: 模型更新（改进后的策略）
    claimRefs:
      - CE003
      - CE007
      - CE015
      - CE018
      - CE024
