      - number: '8.6'
        title: 重点证据
        blocks:
          - type: callout
            title: 观察：承诺投资前先跟踪商业化证据
            body: >
              FieldAI 的投资案例在结构上属于具身 AI 中最好的一档：顶级团队、顶级投资人、真正差异化的技术，以及快过任何可比公司的商业牵引。建议仍为观察，因为公开数据无法承销 $2B 估值：收入在 28x
              区间内未经验证，治理不透明，领投 VC 享有的私下尽调优势也不对外部买家开放。如果价格合适且数据室已验证，这家公司值得认真考虑买入。
