            title: 在具身 AI 同业估值中，$2B 其实偏保守
            body: >
              与最接近的两个具身 AI 软件同业相比，FieldAI 的 $2B 估值显得保守：Physical Intelligence 在 2025 年 11 月以零披露收入获得 $5.6B 估值，Skild AI 在
              2026 年 1 月凭 $30M ARR 达到 $14B。如果 FieldAI 的收入数字准确并继续增长，下一轮融资可能远高于
              $2B。这并不改变观察建议——未验证收入仍是硬约束——但能更准确地框定下行风险：在可比公司集合内，$2B 标记是地板，不是天花板。
