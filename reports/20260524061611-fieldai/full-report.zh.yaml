  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >
              FieldAI 最近一次披露的估值为投后 $2.0 billion，对应公司在 2025 年 8 月宣布连续两轮融资合计 $405 million。最新一轮融资 $314 million，获得超额认购，由
              Bezos Expeditions、Prysm Capital 和 Temasek 共同领投；前一轮约 $91 million，估值约 $500M。也就是说，公司估值在约十二个月内翻了四倍。GeekWire 和
              Reuters 来源称这两轮为「Series A 和 A1」。部分投前尽调材料把拆分写作 $150M（种子轮）加 $255M（Series A），但这与 Reuters 关于最新一轮 $314M
              的报道不一致，也无法从一手来源确认；本章采用其他章节中的统一口径数字。


              PremierAlts（2026 年 5 月访问）显示，FieldAI 五轮累计融资 $506.1M，最近一轮 $315M 于 2026 年 2 月完成——可能反映公告后的二级市场 SPV
              活动或新一轮新股融资——估值仍为 $2.0B。SEC Form D 文件确认，投资载体「HII Field AI Series I, II, and III, a Series of HII Field AI,
              LLC」在 2025 年 11 月和 2026 年 4 月提交备案（CIK 0002095306、0002095305、0002126354），符合特殊目的集合投资基金结构，常用于聚合高知名度私营公司的老股和
              LP 权益。「Field Ai, Inc.」并未以 California 实体直接提交 Form D，这与公司依赖豁免或使用不同法律实体结构相一致。


              二级市场交易活跃：FieldAI 股票在 Nasdaq Private Market 和 Notice.co 交易（截至 2026 年 5 月约 $34.32/股），UpsideList
              也收录该公司，但上行信号有限，说明二级定价接近或等于 $2B 头部估值。PitchBook（2025 年 6 月存档）显示 47 名员工，交易类型为「早期 VC」，反映 PitchBook
              私营公司覆盖中常见的数据滞后。公司自披露的 LinkedIn 员工数 201–500 和 >$100M 已签约收入（2026 年 4 月），显示其已较 PitchBook 快照大幅增长。
