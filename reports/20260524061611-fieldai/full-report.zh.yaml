          - type: callout
            title: 核心风险：收入不透明使悲观情景下倍数高达 400x
            body: >
              FieldAI 最大的估值风险不是技术、团队或市场，而是信息不对称。如果收入真实水平是 $5M（如某个二级市场估计所示），而不是 $140M ARR（GetLatka），$2B 估值隐含收入倍数约
              400x，只能与最投机的早期 AI 投资相比。如果收入无法匹配当前投资人信心所暗示的 $100M+，估值下调轮概率会急剧上升。
