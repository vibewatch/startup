      - CV016
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 关键假设
      - 退出 / 下一轮隐含估值
      - 基于 $2B 标记的回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - 'ARR: $140M（已验证），同比增长 80–100%；GM: 70–80%；NRR: 120%+；2027 年 Series B 按 $350–500M ARR 的 15–20x 定价'
        - Series B 时 $5.25B–$10B；2030 年 IPO 时 $15–30B+
        - 相对 $2B 入场价为 2.6–5x；到 IPO 潜在 7–15x
        - 低-中：需要收入验证和持续增长同时成立；AI 倍数必须守住
      - - 基准
        - 'ARR: $100M（未验证），同比增长 40–60%；GM: 55–70%；NRR: 110–120%；2028 年 Series B 按 $200–300M ARR 的 10–12x 定价'
        - Series B 时 $2.0B–$3.6B；2031 年 IPO 时 $6–9B
        - 相对 $2B 入场价为 0–1.8x；到 IPO 约 3–4.5x；合格但不出色
        - 中：符合“好但不出色”的执行；需要避免行业压缩
      - - 悲观
        - 'ARR: $20–50M（实际），增长放缓；行业倍数压缩至 8–10x；2027 年降价融资轮'
        - 下一轮 $0.4B–$1.0B；可能重组或被人才收购
        - 相对 $2B 入场价亏损 50–80%；以困境价格被救援收购
        - 低-中：由收入意外 + 行业修正触发；若投资者做了真实尽调，则可能性不高
    notes: |
      所有情景均为基于公开数据和可比公司基准的模型估计。没有经审计财务就无法验证。情景中的收入数字是假设区间，不是已确认数值。回报估计假定现有股权结构之外没有额外摊薄。
