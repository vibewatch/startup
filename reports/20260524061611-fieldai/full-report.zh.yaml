      - number: '4.2'
        title: 资本充足性与未来跑道
        blocks:
          - type: paragraph
            body: >
              FieldAI 两轮融资历史已在公司概况章节详述。用于判断资本充足性的关键输入是：截至 2025 年 8 月累计融资 $405M，其中第二轮（$314M）于 2025 年 8 月超额认购完成，由 Bezos
              Expeditions、Prysm Capital 和 Temasek 共同领投，Khosla Ventures、NVentures（NVIDIA）、Intel Capital、Canaan
              Partners、BHP Ventures 和 Emerson Collective 参与。第一轮（约 $91M）于 2024 年以 $500M 估值完成；Gates Frontier 和 Samsung
              被列为上一轮投资人。


              现金余额未披露。月度烧钱速度未披露。公司的员工扩张轨迹——从 2024 年底约 30 人增长到 2025 年 8 月公告时约 130 人，并明确计划到 2025 年底翻倍至约 260
              人——意味着固定成本基础快速抬升。按 200–260 名员工、每人 $250K–$350K 的平均全负担成本估算（与 Irvine, CA 和分布式工程团队相符），仅年化薪酬支出就是
              $50–90M/year，意味着月度劳动力运行成本约 $4–8M。再加上全球部署费用、云基础设施、硬件载荷成本和 G&A，总月度烧钱速度估计为 $5–10M。按低端 $5M/month 计算，$405M
              总融资意味着从创立起约 81 个月总跑道；按 $10M/month 计算，约 40 个月。若用假设的 $100M+ 累计收入抵消，2025 年 8 月融资完成后的净跑道估计为 24–48
              个月；若收入没有加速或成本意外升级，下一轮融资触发点落在 2027 年底至 2029 年初。


              FieldAI 未宣布任何债务工具、项目融资义务、收入分成融资或授信额度。公司的资本结构看起来是纯股权。与垂直整合机器人公司不同，FieldAI 不做硬件制造，这显著降低了营运资本和库存融资需求。
