  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 部署的 AI 系统会在安全关键工业环境中自主做出物理决策，因此正落入多个不断演进的 2026 年 AI 监管框架。按照 EU AI Act， 在工业场景中作为安全组件使用的机器人 AI
              系统被归为高风险，需要风险管理系统、技术文档、人类监督设计、CE 标志和上市后监测。 Baker Botts 指出，Annex III 高风险系统原定 2026 年 8 月 2 日截止日期，受 European
              Commission Digital Omnibus 提案影响，可能延后到协调标准发布后六个月 （兜底为 2027 年 12 月）；但延期取决于 2026 年 8
              月前能否通过，意味着公司必须按现有期限并行准备合规。Colorado AI Act（SB 24-205） 将于 2026 年 6 月 30 日生效，是美国首个全面覆盖高风险 AI
              系统的州法，要求影响评估、消费者披露，并采取合理注意防止算法歧视。 California SB 53 已于 2026 年 1 月生效，要求大型前沿 AI 模型开发者（训练 >10²⁶
              FLOPS）发布风险框架，并在 15 天内报告关键安全事件； FieldAI 的训练算力是否跨过该门槛未披露。联邦方向仍未定：Trump administration 2025 年 12 月行政令显示出预先排除州
              AI 法的意图， 但目前并未实际排除，合规负担仍呈拼图式分布。

              在产品责任方面，法院正围绕 AI 部署形成产品责任框架。KL Gates（2026 年 3 月）记录了越来越多诉状把已部署 AI 系统视为“产品”， 适用设计缺陷、未警示和可预见误用等理论。EU 修订后的
              Product Liability Directive 将严格责任沿供应链延伸到上游 AI 组件提供商， 即使部署客户或机器人 OEM 掌握终端产品关系，也会覆盖 FieldAI。Garcia v.
              Character Technologies 树立了先例： 面向消费者的 AI 可在起诉阶段被作为严格责任下的产品处理。对于工业机器人 AI，身体伤害因果链（挤压、撞击、意外运动）会比消费者聊天机器人案件更直接。

              未发现涉及 FieldAI 的公开执法行动、监管调查、诉讼或 IP 争议。如果 FieldAI Federal 这一国防子公司的自主系统跨入军民两用技术， 将受 ITAR/EAR
              出口管制约束；公开资料中未发现出口授权披露。IP 保护主要依赖商业秘密和发表速度，而不是已授权专利：USPTO 专利申请搜索发现一项已提交专利申请 （US 2025/0252306），但截至 2026 年 5
              月没有已授权专利，因此核心 FFM 技术在人员离职时可能暴露于模仿风险。
