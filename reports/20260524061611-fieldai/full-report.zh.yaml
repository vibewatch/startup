      - number: '4.3'
        title: 单位经济模型与成本结构
        blocks:
          - type: paragraph
            body: >
              FieldAI 的单位经济模型大多未披露。公司没有发布经审计财务报表，也未披露毛利率、获客成本（CAC）、净留存率（NRR）、 年合同价值（ACV）或回本周期数据。以下分析基于可比 B2B 工业 AI
              软件公司，以及 FieldAI 收入模型中可观察到的结构。


              软件许可部分的毛利率估计在 55–80% 区间，参照的是典型企业 AI 软件基准。硬件集成服务涉及实体传感器与计算载荷部署和现场支持，
              利润率可能更低（20–45%），会把混合毛利率拉低到纯软件可比公司之下。规模起来后，软件许可收入应会占主导，并抬升混合利润率。 端侧架构不依赖云端推理，相比重云端 AI
              平台，每次部署的持续可变成本更低，这是有利的结构特征。


              企业工业机器人销售效率先天承压：销售周期通常为 12–24 个月，需要现场演示和集成测试，还要经过多方采购决策。CEO Agha 提到数百万美元级合同金额， 说明单笔规模有可能在中等流失率下支撑 1–3 年
              CAC 回本——但若没有披露 CAC 和 NRR 数据，这一点无法验证。如果 $140M ARR 估计和 150 名员工属实， 人均收入约为 $900K–$1M，对这一阶段的企业软件公司而言很强。FieldAI
              的 GTM 动作聚焦直接企业销售、硬件伙伴关系（Boston Dynamics、OEM） 和地域扩张伙伴（Certis Group、亚洲），这也限制了纯直销渠道能够触达的市场天花板。
