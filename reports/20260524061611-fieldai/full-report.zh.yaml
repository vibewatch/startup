      - number: '4.4'
        title: 财务不透明与尽调阻碍
        blocks:
          - type: paragraph
            body: >
              FieldAI 是一家私营公司，没有公开财务报告义务。截至 2026 年 5 月，仍未披露或无法验证的关键财务指标包括： （1）经审计 ARR 或总收入；（2）按收入流拆分的毛利率；（3）CAC
              与回本周期；（4）净留存率；（5）客户数和集中度； （6）账面现金；（7）月度或季度烧钱速度。


              现有收入信号彼此冲突。GetLatka 估计 ARR 为 $140M（2025 年 11 月），而其他分析平台曾给出低至 $5M 的数字——相差 28 倍，
              反映出从外部估算私营公司指标的难度。UpsideList 的社区模型标记上行空间为 -2%，并从老股交易定价角度把公司视作接近收入前阶段， 暗示私募二级市场存在流动性和估值不确定性。


              以 $140M ARR 估计计算，$2B 估值对应 14 倍收入倍数；以 $100M 已签约收入信号计算，对应 20 倍。对一家未披露盈利能力、没有公开财务记录、 且所在市场中至少 54%
              建筑垂直机器人部署（公司披露的最大市场）仍停留在试点或停滞项目的公司而言，两个倍数都偏激进（据 BuiltWorlds 2025 数据）。 只有当 ARR
              增长很快且利润率很高时，这些倍数才站得住——而两者都无法从现有数据确认。FieldAI 未向 SEC 提交 Form D（经 EDGAR 全文搜索确认）， 这意味着公司要么依赖了不要求 Form D
              的豁免，要么使用了不同法律实体，要么尚未提交。California 实体 “Field Ai, Inc.” （document #6436098，2024 年 10 月 24 日注册，Delaware
              设立，CEO Aliakbar Aghamohammadi）处于有效存续状态。


              二级市场分析师给出的反向估值信号，以及收入估计区间过宽，并不构成一票否决，但它们意味着：若要承销 $2B 估值，必须通过正式尽调取得非公开财务信息。
