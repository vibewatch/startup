        - 仿真训练、合成数据生成、数字孪生重建；深度模型管线依赖
        - 高 — 训练和部署管线使用多款 NVIDIA 产品
        - 价格上调、供应分配给超大规模云厂商、API 弃用，或战略合作伙伴优先级变化
        - 高 — 模型训练成本和管线可靠性绑定 NVIDIA 可用性和价格
        - NVentures 投资者关系；NVIDIA Omniverse 合作加深；边缘推理设计成可在多种硬件上运行
        - 中 — 投资者一致性降低突然切断风险；GPU 供应紧张是全市场约束
      - - Certis Group 机队编排（Mozart 平台）
        - Certis Group（安防垂直合作伙伴）
        - 安防运营的机队指挥与控制集成；互操作依赖
        - 中 — 安防垂直商业管线依赖 Mozart 兼容性
        - Certis 平台弃用、战略变化，或与 FieldAI 直销发生竞争冲突
        - 中 — 如果 Certis 路线分化，会限制安防垂直的可部署性
        - FFM 设计为中间件层；可以集成替代编排系统
        - 低-中 — 依赖深度低于 NVIDIA 或 Boston Dynamics
      - - NVIDIA 和云 GPU 计算（模型训练）
        - NVIDIA / Azure / 超大规模云厂商
        - FFM 模型改进的训练基础设施；从部署数据做联邦学习
        - 中 — 集中在 NVIDIA GPU 生态；Azure 用于管线工具链
        - GPU 供应持续短缺（HBM 瓶颈、TSMC 冲击）推高训练成本或延迟模型更新
        - 中 — 放慢模型改进速度；提高资本强度
        - $405M 融资为锁定长期云承诺提供资本缓冲
        - 中 — 结构性 GPU 供应约束是全市场问题，并非 FieldAI 独有
