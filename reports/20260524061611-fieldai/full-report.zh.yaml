      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 没有披露任何留存指标——截至 2026 年 5 月，任何公开声明、新闻稿或投资人沟通中都未出现 NRR、GRR、队列数据、流失率、合同续约率或客户满意度分数。
              公司仍处于收入未披露阶段且为私营公司，没有监管文件强制要求这些披露。

              建筑领域的定性留存信号略偏正面。Big-D 多年活跃部署，并明确计划把 FieldAI 扩展到每个未来项目，是目前最强的留存和扩张信号。 DPR 的企业风险投资部门（WND Ventures）称 2025 年 8
              月融资是“人们可以期待机器人领域更大融资轮的一个信号”，并指出 DPR 工地帮助测试概念验证——
              这类表述暗示双方关系仍在延续。该轮超额认购融资被明确归因于“多份扩张合同”，从财务信号上佐证了重复购买，尽管具体合同金额和客户名称仍未披露。

              结构性集中度风险较高。基于公开确认的生产部署，FieldAI 的建筑客户群由四个账户构成：Big-D、DPR 和两家未具名 ENR 公司。 任何一个具名锚定客户流失，都会拿掉可见证据基础的 50%
              以上。能源、采矿和制造垂直没有公开具名客户，意味着建筑以外的生产证明存在缺口。 Certis 提供了进入安防的垂直多元化，但它是伙伴运营方，不是直接企业 SaaS 账户。

              核心垂直还面临更广泛的宏观逆风：BuiltWorlds 2025 Equipment & Robotics Benchmarking 报告发现，承包商中活跃使用建筑机器人的比例同比从 65% 降至 46%，
              尽管正面情绪上升至 95%。下降原因被归结为从实验性试点转向更有选择、更经验证的实施——这种动态可能放慢 FieldAI 获取新客户，同时利好其现有生产账户。 企业销售周期长、多方审批流程复杂、客户名称受 NDA
              限制，意味着 FieldAI 真实客户基础几乎肯定大于公开证据所显示的规模，但没有独立方法可验证。
