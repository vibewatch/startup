      - number: '3.3'
        title: 定价与包装对比
        blocks:
          - type: paragraph
            body: >
              竞争场内定价透明度很低；大多数平台面向企业采购销售，并不公开标价。FieldAI 订阅据报道按部署规模不同，从每年数万美元到 $500,000 不等；公司引用第三方估计，称 2025 年已签约收入达到 $100
              million 或以上、ARR 达到 $140 million。Intrinsic 不公布 Flowstate 定价；Google 的云优先模式意味着企业 SaaS 分层叠加 Google Cloud
              算力费用，Fanuc 合作则暗示批量授权。Physical Intelligence 没有商业产品或定价。Gecko Robotics 把巡检服务、Cantilever 平台访问和工程咨询打包进多年合同；Navy
              IDIQ 展示了一份覆盖 18 艘舰艇、五年 $71 million 的合同上限。Boston Dynamics Orbit 作为硬件之上的软件层销售；年费未披露，但 Michelin
              等企业案例研究把它列为持续运营软件。Viam 提供开发者友好的免费层，企业定价按需报价；开源模式先推动开发者采用，再向托管基础设施增购。Machina Labs 按制造服务合同定价，而不是软件订阅。行业估计，仅
              U.S. Navy 每年人工巡检成本就达 $13–$20 billion；按 Boston Dynamics 合作公告，FieldAI 赋能系统在建筑工地可把文档时间减少 90% 以上。
