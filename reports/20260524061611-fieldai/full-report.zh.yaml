      - - Colorado AI Act（SB 24-205）
        - 美国 — Colorado
        - 2026 年 6 月 30 日生效；美国首个全面州级高风险 AI 法规
        - 中 — 取决于 FieldAI 系统是否服务 Colorado 企业客户
        - 中 — 影响评估罚款、消费者披露义务
        - 跟踪州级适用门槛；聘请 Colorado 法律顾问
        - 低-中 — 低于特定门槛的创业公司可能豁免
