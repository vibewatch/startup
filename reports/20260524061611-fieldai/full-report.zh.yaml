  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              FieldAI 的可触达市场不是整个工业机器人市场——已部署工业机器人大多位于结构化、重复性的制造环境（汽车装配、半导体制造、消费电子）中，传统固定路径自动化厂商 FANUC、ABB、Yaskawa
              已经能很好满足需求。FieldAI 的独特市场，是工业机器人部署中需要适应性、风险感知自主能力的那部分：环境无结构、布局每天变化、GPS
              和预建路径不可用，静态编程也会失效。它包括活跃建筑工地（地形、障碍和工作流按小时变化）、地下和露天矿（落石、瓦斯风险和狭窄空间使人员暴露危险）、油气地面设施和巡检环境（资产接近危险且偏远），以及不适合固定路径机器人的柔性或高混合制造设施。


              市场边界排除以下支出：(a) 结构化工厂自动化软硬件（例如固定装配线上的传统关节臂机器人）；(b) 在受控环境运行的消费或物流仓储机器人；(c) 机器人硬件本身，因为 FieldAI 是纯软件供应商；以及 (d)
              水下 ROV 和专用水下车辆，这部分由另一套供应商生态覆盖。工业买家目前依赖的现状替代方案包括人工巡检和监控团队、需要大量预编程的传统固定路径或单任务机器人、无人机 / UAV 空中测绘，以及 BIM/CAD
              建模配合人工数据采集。随着劳动力收缩、安全要求趋严，这些替代方案在单位现场情报成本、实时性和可持续性上都越来越站不住。


              FieldAI 的市场横跨四个核心垂直领域：(1) 建筑和基础设施，(2) 能源、采矿和采掘，(3) 油气巡检和运营，(4)
              无结构或高混合配置下的工业制造。公司把目标环境描述为「脏、乏味、危险」，自主机器人在这些环境里围绕安全、文档和运营洞察交付复利价值；这一表述与其四个服务垂直领域的结构特征高度一致。未来扩张的邻近市场包括防务和周界安防、复杂环境物流，以及半结构化场景下的城市配送。这个市场最好用垂直领域分析师估计来测算，而不是用单一宽口径机器人
              TAM，因为不同分析师报告的范围定义差异很大。
