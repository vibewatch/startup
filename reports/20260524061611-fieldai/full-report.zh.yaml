        - 中-高 — OEM 垂直整合 AI 栈是长期竞争威胁
        - 硬件无关设计理念；多个活跃 OEM 集成降低单一 OEM 锁定
        - 中 — Boston Dynamics 的 OEM 所有方（Hyundai）有战略动机最终掌握自主层
