      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              FieldAI 的安全架构基于概率风险管理，而不是显式规则：FFM 在信念空间中运行，维护对环境的置信度估计，并在不确定性超过客户配置阈值时采取保守动作。 CEO Agha
              曾将其描述为机器人知道“自己有多大把握”，并通过减速或绕行来避免不安全动作。FieldAI 的模型从一开始就是为物理安全设计，而不是把语言或视觉模型改装到机器人上， 因此这一设计直接应对传统 LLM
              用于机器人时的幻觉风险。

              但截至 2026 年 5 月，公司没有公开披露任何有文档支持的安全认证、监管批准或合规标准（例如 ISO 10218、IEC 62443、ANSI/RIA、FedRAMP 或工业机器人等效标准）。 Certis
              合作协议提到，双方将“共同开展培训、安全验证和运营框架建设，以支持负责任部署”，这暗示正式安全验证框架仍在开发，而非已经完成。 同样，Boston Dynamics
              合作更聚焦实际部署结果，而不是认证。FieldAI 通过 FieldAI Federal 进入国防 / 联邦场景，意味着某种程度的政府安全审查， 但没有公布具体许可或 FedRAMP
              状态。私有发布说明页面阻止外部各方审计已交付能力与路线图能力之间的差异，也没有发现正式漏洞赏金或安全披露政策。
