      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              结构性增长驱动因素跨越数十年，且证据充分。劳动力短缺最直接：美国西部矿业劳动力中超过 50% 预计将在 2029 年前退休，全球建筑业也持续面临熟练工短缺。US Mine Safety and Health
              Administration（MSHA）记录，2024 财年采矿死亡 31 人，致命伤率为每 200,000 工时 0.0110，监管对最危险任务采用自主替代方案的压力仍在。IFR World Robotics
              2025 数据显示，全球工业机器人年装机量到 2028 年仍将保持在 500,000+ 台，随着硬件规格趋同，软件定义自主能力越来越成为差异化因素。Deloitte 2026 TMT Prediction
              确认，专用 AI 基础模型——不同于消费级 LLM——是可能在 2026 至 2030 年间把机器人从命令控制推向真正泛化自主的技术突破。


              采用约束同样实质。McKinsey Industrial Robotics Survey 显示，71% 的工业公司把硬件资本成本列为采用机器人主要障碍，61%
              指向内部经验不足；同时，组装、表面处理和焊接等复杂活动在中短期内不太可能自动化。Deloitte 观察到，自 2021 年以来工业机器人年销量基本持平在约 500,000
              台，并警告除非数据质量、集成复杂度和网络安全瓶颈被解决，否则市场很可能维持相对温和的年增长。最关键的是，BuiltWorlds 2025 Equipment and Robotics Benchmarking
              报告——Construction Dive 在报道 FieldAI 融资时引用——发现，报告正在使用机器人的建筑企业比例从 2024 年的 65% 降至 2025 年的 46%，即使正面评价从 74% 跳升到
              95%。热情与部署之间的分叉，是近期市场的核心张力，也是 FieldAI 最直接的执行风险：把强试点表现转化为可持续企业收入。高 capex 周期、与遗留工厂系统的 OT/IT
              集成摩擦、长回本周期要求，以及油气运营商资本环境波动，都是进一步的结构性逆风。宣称市场规模和已部署产品之间的差距真实且重大。
