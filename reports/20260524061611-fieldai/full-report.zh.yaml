      - number: '8.5'
        title: 建议、否决触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              建议为观察（中等置信度、高风险、估值偏高）。投资逻辑在结构上成立：具身 AI 软件、物理优先架构、经野外验证的部署，顶级创始人-市场匹配度，以及最强投资人财团。但外部投资人如果拿不到审计财务、已验证 ARR
              和已披露毛利率，就无法承销 $2B 价格；主导风险是信息不对称，不是技术或团队质量。按当前 $2B 标记，入场价已经按收入区间高端执行来定价；收入任何下修或行业倍数压缩，都会造成实质性稀释。


              如果满足三个条件，建议可上调为买入：（1）披露经审计或独立验证的 ARR ≥$100M，且年同比增长 ≥40%；（2）确认混合毛利率
              ≥60%；（3）用队列数据证明净留存率（NRR）≥110%。在此之前，观察仍是合适立场：跟踪公司披露的财务里程碑、Series B
              公告及隐含估值上调、战略合作收入披露，以及客户集中风险信号。如果出现以下情况，建议应下调为回避：（1）Series B 宣布估值低于 $2B（估值下调轮）；（2）主要客户流失或部署失败公开；或（3）报告中的
              >$100M 已签约收入被实质性下修。


              治理是明显缺口：董事会构成未披露，清算优先权和期权池规模未知，也没有独立财务报告。任何潜在投资人在承诺前都必须尽调这些事项。公司作为工业机器人「软件大脑」层的战略定位确实差异化，也难以快速复制；但治理不透明叠加估值偏高，意味着在商业证据能被公开验证前，应保持纪律性的观察姿态。
