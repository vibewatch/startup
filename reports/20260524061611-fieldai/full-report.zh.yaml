      - number: '7.2'
        title: 运营、安全与安防风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 的核心价值主张——自主机器人在非结构化、安全关键环境中运行——同时也是最高的运营风险面。FFM 驱动的机器人完全在端侧决策，不依赖 GPS、地图或云连接。
              新环境中的模型推理错误（例如训练数据中没有的碎片配置，或意外穿过预授权机器人路径的人）可能在建筑、采矿、能源运营等高后果场景中造成身体伤害、财产损失或任务失败。 2026 International AI
              Safety Report 将“失控场景”和“真实世界可靠性测试不足”列为快速推进自主系统中最迫切的两类风险，直接适用于 FieldAI 的产品领域。 2025 年广泛报道的一起 Unitree H1
              机器人在工人附近故障事件，以及 SRES 在 CES 2026 安全分析中指出“当机器人与人类共享开放工作空间时，现有工业安全规程往往不足”， 说明更广泛的竞争队列——并非 FieldAI
              本身——已经出现公开安全失败，并会影响客户尽调要求、采购标准和潜在诉讼预期。

              截至 2026 年 5 月，没有公开报道 FieldAI 驱动机器人发生安全事故。但公司未发布性能基准、安全验证测试报告或第三方安全认证 （工业机器人 ISO 10218、工业网络安全 IEC
              62443，或数据处理 SOC 2），意味着企业客户和投资人无法独立验证剩余风险水平。 NIOSH Center for Occupational Robotics Research 和 OSHA
              都记录了工业环境中严重机器人相关工伤的既有基线；FieldAI 在活跃建筑工地和采矿运营中的部署，
              正好把机器人放入这些事故最常出现的场景。公司自己的部署叙事——三大洲数百个场地——也会随着部署规模增长，提高遭遇首次负面事件的概率。

              网络安全方面：FieldAI 的机器人会把机群数据上传到云分析平台，并与 NVIDIA Omniverse 和 Isaac 基础设施通信。未发现公开 DPA、安全白皮书、渗透测试报告或 SOC 2 认证。
              能够伪造端侧传感器数据或向机群管理平面注入命令的对手，可能造成物理伤害。工业 IoT 和运营技术（OT）安全标准（IEC 62443）未确认已实施。 如果安全事件早于正式认证发生，这些缺口会留下实质剩余敞口。
