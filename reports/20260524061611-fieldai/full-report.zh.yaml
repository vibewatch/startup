            title: 纯软件模式带来不对称扩张潜力
            body: >-
              FieldAI 拒绝自建硬件，因此避开机器人制造的资本强度，并能把每一家机器人 OEM 同时视作分销伙伴和潜在客户。不绑定硬件意味着每个新机器人平台（人形、轮式、空中）都代表扩张机会，而不是产品转向。这就是 OS
              层类比：如果 FFMs 成为工业机器人自主能力的事实标准，可触达市场将随全球机器人机队增长而同比例扩张，却不需要相应增加资本开支。
