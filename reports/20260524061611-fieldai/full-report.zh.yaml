      - number: '7.3'
        title: 伙伴与技术依赖风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 的 GTM 策略和技术栈集中在少数高价值伙伴和供应商身上。2026 年 3 月的 Boston Dynamics 合作是最显眼的商业依赖： 公司的建筑自主叙事围绕 Spot 四足硬件建立，Marc
              Raibert 公开背书并提到 DARPA SubT 历史，也把品牌和市场可信度系在这段关系上。 Boston Dynamics 属于 Hyundai Motor Group，而 Hyundai 又在 2026
              年 2 月单独投资 FieldAI——如果 Hyundai 决定为 Boston Dynamics 硬件投资竞争性的自有自主软件， 或合作因 Hyundai
              层面的战略调整而重组，双方可能出现错配。合作条款（排他性、收入分成、最低承诺、终止权）未公开，因此无法评估合同保护。

              NVIDIA 是更深、更广的依赖。NVentures（NVIDIA 企业风险投资部门）是财务投资人，FieldAI 使用 NVIDIA Omniverse NuRec 做 3D 重建， 用 Isaac Sim /
              Isaac Lab 做仿真训练，用 NVIDIA Cosmos 生成合成数据，并用 OSMO 自动化流水线。这形成多层战略和商业锁定。 虽然投资人关系降低了突发供应中断的概率，但 NVIDIA
              自身优先级（超大规模云厂商分配、数据中心 GPU 供应瓶颈、竞争动态）可能压缩 FieldAI 的算力访问， 或推高训练成本。VerticalData 报告称，2026
              年高带宽内存（HBM）瓶颈仍在，最新型号数据中心 GPU 交期延长到 9–12 个月；没有多年云承诺的小型 AI 公司最容易受冲击。

              除 NVIDIA 和 Boston Dynamics 之外，Certis Group 安防合作（2026 年 2 月）增加了第三个集成依赖。Certis 使用 Mozart 平台做机群指挥控制， FieldAI
              的 FFM 必须与这套专有基础设施互操作。伙伴多元化是 FieldAI 不绑定硬件叙事的明确组成部分——公司声称 FFM 兼容四足、人形、轮式机器人和 AV—— 但截至 2026 年 5
              月，具名商业合作深度集中在两个伙伴身上：Boston Dynamics 面向建筑，Certis 面向安防，收入和声誉敞口也随之集中。
