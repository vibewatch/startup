      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              乐观情景要求 FieldAI 收入处于估计高端（$140M ARR，年同比增长 80–100%），软件授权收入流的毛利率接近 70–80%，由机群扩张推动的 NRR 超过 120%，并且公司在 2027 年以
              $350–500M 前瞻 ARR 为基数、按 15–20x 前瞻 ARR 完成 Series B——对应 $5.25–10B 估值，相对 $2B 标记回报
              2.6–5x。该情景的主要风险是：收入数字未经验证，增长率没有独立确认，市场环境还必须继续支持高 AI 软件倍数。


              基准情景假设 ARR 为 $100M，增长 40–60%，混合毛利率在 55–70% 区间，NRR 为 110–120%。如果 2027–2028 年 Series B 按 $200–300M 前瞻
              ARR、10–12x 倍数完成，估值将为 $2.0–3.6B——相对 $2B 标记回报 0–1.8x。也就是说，估值大致持平到小幅增值，和风险水平相匹配。


              悲观情景假设收入显著更低（$20–50M ARR），增长因行业逆风放慢（企业采用摩擦、宏观资本开支回撤），AI 软件倍数压缩把下一轮隐含估值拖到 $0.4–1.0B——相对 $2B 标记亏损
              50–80%。该情景下，估值下调轮风险最高。反向触发项包括：如果 Physical Intelligence 或 Skild AI 以低于预期的倍数融资，机器人赛道整体估值重置；FieldAI
              客户减少部署或不续约；或有证据显示「已签约收入」大幅高估已确认 ARR。
            claimRefs:
              - CV025
