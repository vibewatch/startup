      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 结构性需求顺风跨越数十年并正在汇合
            body: >
              建筑、采矿和能源的劳动力短缺不是周期性问题，而是由劳动力老龄化、危险工种吸引力下降和监管升级共同驱动的结构性问题。再叠加 AI 自主能力在 2026–2028 年走向工业生产成熟，FieldAI
              的时间点很理想：技术已经足够验证（企业级部署、90%+ 效率提升有记录），市场又仍处早期，平台型在位优势有机会在竞争碎片化前建立。IFR 数据显示，全球在役工业机器人 4.66 million 台、年装机
              542,000 台，为 FieldAI 的软件层提供了庞大且仍在增长的装机基础。
            calloutType: strength
            claimRefs:
              - CM008
              - CM031
              - CM033
              - CM035
          - type: callout
            title: 试点泥潭与企业转化慢是生存级风险
            body: >
              近期最重要的市场风险，是正面机器人评价和活跃部署之间已有记录的缺口。BuiltWorlds 发现，2025 年 95%+ 的建筑企业正面评价机器人，但只有 46% 报告正在使用——低于上一年的 65%。这一模式与
              McKinsey 的发现一致：71% 的工业公司把资本成本列为采用障碍，61% 指向内部经验不足。对 FieldAI 来说，强试点表现不会自动变成企业收入。公司 $405M
              资本提供了解决转化问题的跑道，但试点到企业的转化率，才是决定 FieldAI 能否按预计时间线兑现市场机会的关键未公开指标。
            calloutType: risk
            claimRefs:
              - CM036
              - CM038
              - CM039
          - type: callout
            title: 硬件商品化后，软件层攫取超额价值
            body: >
              Analytics Insight 指出，工厂开始像选择云基础设施一样选择机器人：关注它是否兼容某个智能生态，而不是只看单机硬件性能。随着机器人硬件规格趋同（Boston Dynamics Spot
              定价下行，人形机器人进入价格竞争），软件智能层会吃掉总系统价值中更高比例。FieldAI 不绑定硬件的 FFM 架构，把它放在工业机器人潜在 OS
              级平台的位置——类似超大规模云厂商在企业计算中抽象硬件。长期看，软件层市场可能走向赢家拿走大部分；但前提是 FieldAI 必须在竞争对手基础模型缩小自主能力差距前，用数据飞轮优势建立切换成本。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM019
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >
              到 2026 年，需要自主机器人运营能力的工业企业有五种实质不同的解法：(1) 在现有硬件上部署 FieldAI 的 Field Foundation Models；(2) 采用资金充足竞争对手的具身 AI
              基础模型平台（Intrinsic/Google、Physical Intelligence、Covariant）；(3) 使用自带机器人栈的巡检专业平台（Gecko Robotics、Machina
              Labs）；(4) 依赖机器人 OEM 捆绑的智能软件（Boston Dynamics Orbit、KUKA、Fanuc 原生 AI）；(5) 维持现状——人工巡检团队、依赖传统 SLAM/GPS
              的导航，或内部软件团队。多数大型企业买方会同时采用不止一种方案，多归属很常见，切换成本也比初看更软。FieldAI 瞄准最大的未满足切片：动态、无 GPS、无结构的现场环境，现状方案和 OEM
              原生方案在这里失效。公司不绑定硬件的软件模式避开机器人制造的资本强度，也让它能跨越比任何单一 OEM 更多的平台。截至 2026 年 5 月，下文梳理的八家直接和替代玩家合计拥有远超 FieldAI 的 VC
              和企业资本；这既验证了市场，也带来资金雄厚对手固化竞争格局的实质风险。
