        - 欧盟市场主管机构正式调查、不合规认定，或客户因 AI Act 合规冻结采购
        - 立即尽调欧盟合规计划；评估市场准入风险；认证完成前考虑暂停欧盟部署
      - - Boston Dynamics 合作终止或 Hyundai 战略转向
        - 公开合作公告、Hyundai Motor Group 战略披露、FieldAI OEM 合作伙伴更新
        - 任一方公开声明终止合作，或 Hyundai 宣布为 Boston Dynamics 硬件推出自有自主栈
        - 脱离 Spot 集成重新评估建筑垂直商业案例；评估 OEM 多元化时间线；重校收入预测
      - - Ali Agha 离职或声誉事件
        - LinkedIn、新闻报道、公司公告、投资者沟通
        - 确认离开 CEO/创始人角色、长期病假，或公开声誉争议
        - 紧急评估管理层继任计划；投资者沟通；考虑陈述与保证保险触发因素
      - - 融资估值重置或降价融资轮
        - 未来融资公告、二级市场数据（Nasdaq Private Market、PremierAlts）、投资者沟通
        - 任何公开融资轮估值显著低于 $2B，或二级市场价格显示较上一轮价格折价 30%+
        - 重新评估终局估值上行；审查优先股堆叠和清算优先权；评估相对于原入场逻辑的摊薄暴露
      - - 商业化平台期（收入增长低于阈值）
        - OCBJ/Sacra/GetLatka 收入报道、客户数披露、招聘放缓信号
        - 公开或可靠第三方迹象显示 ARR 同比增长低于 80%，或已签约收入到 2027 年仍停滞在 $150M 以下
        - 下一次部署资本前，深挖销售生产率指标、客户留存和管线质量
    notes: 阈值是分析师定义的加强尽调触发点，不是合同或法律约束标准。鉴于 FieldAI 是私营公司且披露有限，监测主要依赖公开信息。
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 依据
      - 决策含义
    rows:
      - - 建议
        - 观察
        - 强投资逻辑被估值不透明和收入未验证抵消
        - 监测商业验证点；没有经审计财务时，不按当前价格承诺
      - - 置信度
        - 中
        - 投资者财团顶级；收入区间相差 28x；治理未披露
        - 若有 2 年以上经审计 ARR 数据并披露 NRR，置信度可升至高
      - - 风险评级
        - 高
        - 收入未验证；若行业倍数压缩或收入不及预期，存在降价融资轮风险
        - 对冲暴露；相对于组合保守控制仓位
      - - 估值立场
        - 偏高
        - $2B 按 $100–140M ARR 计为 14–20x；按 $5M ARR 计约 400x；AI 原生公司中位数基于已验证 ARR 为 21x
        - 入场价要求高端收入执行；从外部看安全边际很薄
      - - 上调触发条件
        - 经审计 ARR ≥$100M + GM ≥60% + NRR ≥110%
        - 这三个数据点会支持在当前 $2B 估值附近买入
        - 承诺前索取资料室访问权限
    notes: |
      建议反映无法接触专有尽调的外部投资者立场。战略投资者和领投 VC（Bezos Expeditions、Khosla、NVentures） 已完成外界无法取得的专有尽调；他们的信心是正面信号，能补充但不能替代本评估。
    claimRefs:
