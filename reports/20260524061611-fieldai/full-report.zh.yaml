      - number: '7.5'
        title: 财务、估值与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 的 $2B Series A 估值，是机器人 AI 历史上同阶段公司最高估值，也把后续资本事件的门槛抬得很高。唯一独立的收入信号来自 OCBJ 2026 年 4 月匿名来源所称的「$100M+
              已签约收入」；按 $2B 估值计算，收入倍数约 20x，接近企业 AI 软件最高倍数梯队，但一旦增长放缓、AI 板块情绪转弱，或公开市场可比公司重估，就会暴露在倍数压缩下。GetLatka 对 $140M ARR
              的估计（2025 年 11 月）未经审计，也未获公司确认。毛利率、NRR、CAC、账上现金和烧钱速度完全未披露，传统 SaaS 或 深科技指标无法支撑估值承销。

              资本密集度是隐藏风险：工业机器人部署需要现场集成、定制载荷安装和持续模型微调，每一项都会带来交付成本，可能把毛利率明显压到纯软件水平之下。如果毛利率显著低于 60–70%，即使收入继续加速增长，$2B
              估值也很难撑住。第二个风险是烧钱集中：公司已有 130+ 名员工，领导层来自高成本学术和科技机构，月度烧钱可能达到 $10–20M；按 $405M 融资额估算，现金跑道约 2–4
              年。如果市场或宏观环境在公司盈亏平衡前打断增长，可能被迫进行估值下调融资。

              投资逻辑失效触发项，集中在会动摇核心投资逻辑的证据交叉点：（1）FieldAI 驱动机器人发生重大安全事故，导致客户退出、监管行动或诉讼；（2）EU AI Act 执法行动阻断欧盟市场准入；（3）Boston
              Dynamics 合作终止，或 Hyundai 战略转向，导致主要商业案例消失；（4）Ali Agha 离职或发生声誉事件；（5）估值重置或估值下调轮，显示市场无法维持 $2B
              入场估值。上述任一触发项，都足以实质性改变风险调整后回报。
