  - id: FU001
    title: 客户旅程图——FieldAI 企业工业买家
    type: journey-map
    layout: wide
    summary: |
      展示典型企业工业客户从认知到生产部署和车队扩张的旅程，覆盖 FieldAI 的主要与次要客群。
    data:
      items:
        - id: stage-awareness
          label: 1. 认知
          actor: 企业 VP/总监（技术、创新、VDC 或运营）
          description: 客户通过行业会议、合作伙伴转介（Boston Dynamics、NVIDIA）、赢得媒体报道，或其他承包商的同行推荐发现 FieldAI。
          channels:
            - 行业会议
            - OEM 合作伙伴网络（Boston Dynamics、NVIDIA）
            - 媒体报道与分析师报告
        - id: stage-discovery
          label: 2. 探索 / 演示
          actor: 技术或创新总监；项目高管
          description: 技术评估；CEO 级或 VP 参与；在活跃工地做现场演示，或走查数字孪生。FieldAI 展示 BIM 集成、自主任务模式和传感器载荷。
          channels:
            - FieldAI 直销团队
            - fieldai.com 产品页
            - 合作伙伴介绍与转介
        - id: stage-pilot
          label: 3. 概念验证 / 试点
          actor: 工地总监；安全经理；VDC 总监
          description: 在单一项目现场限期部署。机器人车队有限；只跑一种任务类型（巡检或文档记录）。这里验证工地总监和现场团队是否买账。
          channels:
            - 有监督的现场部署
            - 客户反馈循环
            - 现场工地总监评估
        - id: stage-production
          label: 4. 生产部署
          actor: 工地总监；技术总监；运营负责人
          description: 在活跃工地重复执行自主任务；FieldAI 接入 BIM、项目管理和安全报告工作流。数据飞轮开始丰富针对具体工地的模型。
          channels:
            - 扩大的机器人车队
            - 每日自主运营
            - BIM 与项目管理集成
        - id: stage-expansion
          label: 5. 车队 / 企业级扩张
          actor: 创新总监；CTO；运营 VP
          description: 多站点铺开；新增任务类型（巡检 + 安防 + 运输）；多年合同续约。Big-D 计划在每个未来项目部署，体现这个阶段。
          channels:
            - 新站点上线
            - 通过数据飞轮改进模型
            - 通过 FieldAI 云做企业车队管理
    approximationNotes: |
      阶段顺序依据可获得的客户证据（Big-D 的 2 年轨迹、DPR 从 PoC 到生产的路径）和公司材料推断。并非所有细分市场都有确认的生产部署； 能源、采矿和联邦市场只按公司定位呈现。
