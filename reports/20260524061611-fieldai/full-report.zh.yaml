      - number: '5.5'
        title: 路线图、成熟度与开发者生态
        blocks:
          - type: paragraph
            body: >
              FieldAI 的产品成熟度在巡检和数据采集上最强，公司在这两类场景中有付费客户，并记录了横跨数百个场地的生产部署。分析报道和投资人材料中描述的三阶段路线图是： （1）短期至 2026
              年——自主巡检、监控和数据采集，已经商业化；（2）中期 2026–2028 年——干预和操控，从感知扩展到物理动作； （3）长期 2028 年以后——覆盖所有平台、包括人形机器人的通用自主。该路线图与
              FieldAI 披露的 $405M 融资用途一致：为运动和操控能力开发提供资金。

              CMU Robotics Innovation Center 入驻（2026 年 2 月宣布，Hazelwood Green 2,500 sq ft）使公司的学术研究合作正式化，可使用 1.5-acre
              户外测试场和专门机器人实验室。 FieldAI 赞助 CMU 的 AirLab 和 LeCAR lab 研究，并支持 VectorRobotics
              学生团队做人形移动操控，显示公司正在投入补齐中长期路线图上的能力缺口。 Field AI Research Institute（FAIRI）发表同行评审研究，NeBula DARPA SubT 论文以及 2024
              年关于风险感知 AI 和 MPPI 控制的论文，为公司提供了学术可信度。

              开发者生态访问有限。FieldAI 的 GitHub 组织（field-ai）托管 10+ 个标准机器人库的 fork，但没有发布自有 FFM 代码、模型权重或 SDK。 未发现公开开发者门户、API
              文档或社区论坛（Discord、Slack、Stack Overflow 标签）。发布说明页面是私有 Squarespace 站点。 这把开发者信号面限制在可观察到的 GitHub
              仓库活动，而不是一个真正的实践者社区。与 NVIDIA 和 CMU 的合作可间接代理工程可信度， 但从公开来源仍无法独立技术评估 FFM 能力。
