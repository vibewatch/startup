  - id: TV005
    title: 投资逻辑破裂和退出触发器
    columns:
      - 触发项
      - 阈值 / 可观测事件
      - 投资逻辑影响
      - 操作含义
    rows:
      - - Series B 轮降价融资
        - Series B 轮以低于 $2.0B 的估值完成
        - 直接推翻私募投资人逻辑；显示收入不及预期或赛道重估
        - 下调至回避；立即退出或减少敞口
      - - 重大客户流失或部署失败
        - 公开宣布客户退出，或安全事故导致部署暂停
        - 削弱“数百站点、三大洲”的商业牵引叙事
        - 复核持仓；行动前判断是孤立事件还是系统性问题
      - - $100M 预订收入被大幅下修
        - 公司披露或调查报道显示，预订收入 < $50M，或预订额 ≠ ARR
        - 估值倍数按真实 ARR 跃升至 40x+，超出当前阶段合理区间
        - 下调至回避；倍数压缩到 10–15x 将意味着 $500M–750M 估值
      - - 被超大规模云厂商竞争替代
        - NVIDIA Cosmos、Google Intrinsic 或 Amazon AWS Robotics 发布可比 FFM 服务
        - 授权费承压；平台风险兑现；护城河受质疑
        - 重新评估防御性；按影响范围下调至观察或回避
      - - 治理或法律风险事件
        - IP 纠纷、监管行动、关键人物离职（CEO 或 CSO），或 SEC 执法
        - 动摇团队和投资人信心；推高执行风险
        - 重大风险事件 → 降至观察，待解决；严重事件 → 回避
    notes: |
      触发器按可观测阈值定义，便于在无法获取私有财务数据时监控。五项都是投资逻辑破裂条件； 任一发生都会实质改变推荐。降价融资是最可操作的公开信号。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计 ARR 和收入确认政策
        - 无经审计财务；估计区间为 $5M–$140M；“预订收入” ≠ 已确认 ARR
        - 没有经验证收入锚，无法承销 $2B 估值；决定适用 14x 还是 400x 倍数
        - 在 NDA 下索取经审计或审阅的 P&L 和 ARR 明细；可接受滚动 12 个月 ARR，但需收入确认脚注
      - - 按收入流拆分的毛利率
        - 未披露；软件授权与硬件集成拆分未知；综合毛利无法验证
        - 软件级毛利率（70–80%）支撑溢价；混合毛利（55–65%）无法支撑同一倍数
        - 索取按授权与服务拆分的贡献毛利瀑布；对照公开 AI SaaS 基准
      - - 净收入留存率和队列数据
        - 未披露；公司声称有“扩张合同”，但 NRR 未验证
        - NRR >120% 才能支撑先落地再扩张的 SaaS 倍数；<100% 将触发悲观情景
        - 索取按产品线拆分的季度队列留存；确认 2024–2026 年队列的 ACV 轨迹
      - - 股权结构表、清算优先权和期权池
        - 未披露；优先权悬挂和反稀释保护未知
        - Series A/A1 若有沉重清算优先权，基准情景下普通股价值可能接近零
        - 向 Series A 轮主法律顾问索取股权结构表摘要和瀑布分析；确认优先权结构
      - - 董事会构成和治理文件
        - 未公开披露；独立董事未知
        - 治理质量是机构投资人的关键尽调维度；治理薄弱 = 代理风险更高
        - 索取董事会材料、观察员权利协议和投资人权利协议；确认审计委员会状态
      - - 客户集中度和合同条款
        - 客户名称未披露；前五大客户收入集中度未知；合同期限 / 续约条款未知
        - 高集中度（前三大客户 >50% 收入）将实质改变流失风险画像
        - 在 NDA 下索取脱敏客户清单；确认单一客户收入上限；审查合同续约条款
    notes: >
      六项都是投资前标准尽调要求。这家私营公司处于当前阶段，提出这些要求并不异常；在用任何基本面锚承销 $2B 估值前都必须拿到。前三项（ARR、GM、NRR）是从观察上调至买入的最低门槛；后三项（股权结构表、
      治理、客户集中度）是任何投委会批准所必需。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
