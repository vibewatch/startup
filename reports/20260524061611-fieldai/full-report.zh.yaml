      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              FieldAI 由 Ali Agha 创立并担任 CEO，他积累了近二十年的机器人 AI 经验。创立 FieldAI 前，Agha 在 NASA Jet Propulsion
              Laboratory（JPL）工作约七年，担任多个美国高知名度自主系统项目的首席研究员，包括 DARPA Subterranean Challenge、DARPA RACER（自动驾驶越野车辆）、NASA
              Autonomous Mars Cave Exploration，以及 Coordinated Autonomy for Prototype Mars Helicopter-Rover。他还曾在 Qualcomm
              任研究员，并在 MIT 从事博士后研究。关键在于，Agha 领导了 JPL-MIT-Caltech-KAIST-LTU CoSTAR 团队，赢得 2020 DARPA Subterranean Challenge
              的 Urban Circuit；这是现场机器人领域的里程碑，也验证了后来成为 FieldAI 技术核心的风险感知自主架构。Agha 在 Texas A&M University
              获得计算机科学与工程博士学位。联合创始人包括 Dr. Shayegan Omidshafiei（首席科学官），他曾在 DeepMind/Google 担任研究科学家超过五年，专注大规模 AI
              模型和多智能体强化学习，并在 MIT 完成博士，彼时首次与 Agha 合作；以及 Dr. David Fan（首席技术官），他曾担任多个 DARPA SubT 和 DARPA RACER 项目的首席技术专家，也是
              NASA JPL 研究员。其他高级管理者包括 FieldAI Federal 负责人 Dr. Eric Krotkov，这家防务子公司由他领导；他曾任 DARPA 项目经理和 Toyota Research
              Institute CSO。Sebastian Scherer 则担任 Fieldable Embodied AI 负责人，同时是 Carnegie Mellon Robotics Institute
              副研究教授。创始团队共享 JPL、DARPA 和 MIT 背景，让 FieldAI 在安全关键现场环境里部署 AI 时拥有异常强的创始人-市场匹配。董事会构成和正式治理结构尚未公开披露。CEO Ali Agha
              是公司的主要公开发言人和融资人，也构成实质性的关键人依赖。
