        title: 重点证据
        blocks:
          - type: callout
            title: 安全认证缺口是投前尽调最紧急事项
            body: >
              截至 2026 年 5 月，未找到 FieldAI 平台获得 ISO 10218、IEC 62443、SOC 2 或同等第三方安全 /
              安保认证的证据。在建筑、采矿和能源环境中部署自主机器人，却没有公开安全验证，会让客户暴露在 OSHA 合规风险下，也会让 FieldAI
              在欧盟修订后的《产品责任指令》下承担直接产品责任。投资人应在建立任何仓位前，要求独立安全审计报告和合规路线图。
