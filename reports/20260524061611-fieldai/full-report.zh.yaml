  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >
              FieldAI 是一家纯 AI 软件公司，不制造机器人。其商业产品是 Field Foundation Model（FFM）平台：安装在合作伙伴或客户自有机器人硬件上的、 不绑定机器人形态的自主软件。FFM
              像一个通用“大脑”，让机器人在非结构化工业环境中感知、推理和行动，不需要预先绘制场地地图、GPS、云连接， 也不需要按任务重新编程。平台跨硬件兼容四足机器人（如 Boston Dynamics
              Spot）、轮式机器人、人形平台和乘用级自动驾驶车辆。

              FieldAI 的应用组合覆盖官网 Solutions 页面列出的八类方案：现场测绘与文档化；设施和设备巡检；状态异常检测；大规模数据采集； 无人物料运输；安全和威胁检测；远程呈现与远程操作；搜索与
              ISR。公司既自研应用，也通过合作伙伴载荷模型与第三方供应商开发应用。 短期商业重点是巡检和数据采集（目前已产生收入），操控和通用作业则位于中长期路线图上。

              一个突出的架构原则是 “Context over Training”：FFM 不要求穷尽式场景预训练，而是利用上下文线索和学到的物理先验来推断未见过的情境。 CEO Ali Agha
              把机器人的风险感知描述为它对任何动作都有一种“我有多大把握”的判断，客户可配置风险阈值，并据此调整机器人在安全关键区域的行为。
              结果是一种部署模型：机器人可以在新场地快速启用，并在不做大量逐场地定制的情况下扩展到企业级机群。
