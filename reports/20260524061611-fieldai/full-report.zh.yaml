      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              FieldAI 销售的是 B2B 企业软件，不是硬件。公司的买方结构符合典型企业工业技术采购模式：付款方是高管层或运营 / 财务副总裁，技术买方是运营或
              HSE（健康、安全、环境）负责人，日常用户是现场主管、现场工程师或项目经理。预算所有权按垂直领域落在两类资金池之一：(1) 用于新增自动化投资的资本开支（capex）预算，由 CFO、工程或运营 VP
              控制；(2) 用于经常性巡检、监控和现场情报合同的运营支出（opex），由工厂或项目经理在预批准服务供应商协议内控制。FieldAI 把产品定位成在 opex 侧提供即时 ROI（人工文档时间减少
              90%+，更早识别返工），从而把首次销售包装成成本规避，而不是 capex 转型。


              建筑细分市场最直接的购买力集中在最大型总承包商手中——例如 FieldAI 的 Boston Dynamics 案例研究中提到但未具名的 ENR
              排名前列企业。这些公司拥有大规模未完成项目储备，承担成本超支风险，也有内部创新或数字化转型预算专门用于自动化试点。采用触发因素包括无法快速生成准确竣工 BIM
              数据、现场文档团队劳动力短缺，以及安全规定要求定期检查危险区域。采矿和能源买方集中在大型运营商（BHP、Rio Tinto 及同类企业）周围，其 HSE
              和运营负责人受监管合规、事故减少和车队生产率指标驱动。BHP Ventures 对 FieldAI
              的投资，就是这一买方群体给出的直接市场验证。油气客户由巡检合规要求、降低危险环境进入成本和资产完整性管理要求驱动。所有细分市场中，采用路径都从有限概念验证（通常是一个站点或一个资产集群）开始，经过 ROI
              验证，再进入覆盖多站点或多区域的企业框架协议——这也与 FieldAI 提到的「全机队部署」和全球运营中的「企业级」扩张模式一致。
