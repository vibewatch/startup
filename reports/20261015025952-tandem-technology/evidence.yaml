evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, observer rights, and investor control-rights documentation.
    whyItMatters: >-
      Later judgment on governance resilience, dilution risk, and downside protection cannot rely on investor brand
      names alone.
    diligencePath: Request the latest board list, financing documents, and investor rights summary from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: Verified customer count, practice count by segment, headcount, and concentration by top partner or customer.
    whyItMatters: >-
      Public growth claims support momentum, but unit quality and concentration risk remain opaque without underlying
      operating metrics.
    diligencePath: Ask for cohort tables showing active accounts, net adds, partner concentration, and current employee count.
    relatedQuestionRefs:
      - QO005
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: Authoritative round-by-round funding history that reconciles the $137M, $160M, $100M, and ~$1B figures.
    whyItMatters: >-
      The valuation chapter needs one internally consistent financing base case rather than headline estimates from
      secondary coverage.
    diligencePath: Reconcile the company cap table, signed term sheet, and investor confirmation against public reporting.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Gross margin, burn rate, runway, and the mix between recurring software-like revenue and launch-linked services.
    whyItMatters: >-
      Revenue scale alone does not show whether the business can defend unicorn pricing or absorb customer concentration
      shocks.
    diligencePath: Request monthly P&L, gross-margin bridge, and revenue mix by partner and program.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: >-
      Independent bottom-up estimates for medication-access workflow software spend, contract counts, or category
      revenue pools narrow enough to underwrite a SAM or SOM.
    whyItMatters: >-
      A broad prescription-spend or leakage lens supports importance, but it does not show how much budget is
      realistically contractable by Tandem.
    diligencePath: >-
      Request customer counts, contract segmentation, and category budget benchmarks from management or channel
      partners; cross-check with payer, EHR, and biopharma procurement references.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: deployment-depth
    missingEvidence: >-
      Live deployment counts by practice or health system, payer and EHR integration coverage, and measured
      approval-rate or time-to-therapy outcomes.
    whyItMatters: >-
      Adoption quality matters more than top-line patient projections when judging whether the workflow can scale and
      defend valuation.
    diligencePath: >-
      Ask for cohort metrics, named integration references, and before/after operational KPIs from provider and pharma
      customers.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Contract structure, pricing logic, partner concentration, and whether biopharma budgets fund the product
      consistently across therapies and channels.
    whyItMatters: >-
      The user/buyer split is central to market size, sales motion, and durability, but the paying-side economics are
      still mostly inferred from positioning.
    diligencePath: >-
      Review sample statements of work, pricing schedules, and top-partner mix by revenue, then test whether provider
      adoption depends on any subsidies or launch-specific programs.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Public contract structure, realized pricing, and discounting for Forus and its closest practical alternatives.
    whyItMatters: Pricing opacity prevents a confident comparison of ROI, switching economics, and gross-margin implications.
    diligencePath: >-
      Request customer contracts, pricing sheets, and win-loss notes covering provider, pharmacy, and biopharma
      relationships.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-frame
    missingEvidence: >-
      Verified public product pages or independent reviews for a larger set of named U.S. prescription-access
      competitors.
    whyItMatters: >-
      The chapter can frame substitutes and adjacencies, but cannot benchmark Forus against a broad like-for-like peer
      set.
    diligencePath: >-
      Expand competitor sourcing with public product, pricing, and customer-proof pages for prior-authorization and
      specialty-access vendors.
    relatedQuestionRefs:
      - QP001
      - QP004
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: Renewal, multi-homing, displacement, and named win-loss data versus incumbents and internal workflows.
    whyItMatters: >-
      Moat claims hinge on buyer stickiness and replacement difficulty, neither of which is demonstrated in the public
      assigned pool.
    diligencePath: >-
      Request cohort retention, implementation timelines, competitive takeout case studies, and customer references
      describing alternatives considered.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: missing-source
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: Gross margin, burn rate, cash balance, runway, working-capital needs, CAC, payback, and net revenue retention.
    whyItMatters: >-
      These are the core inputs needed to underwrite margin durability and financing dependency rather than only
      valuation momentum.
    diligencePath: >-
      Request board-ready KPI dashboards, monthly cash flow, gross margin by workflow, and cohort-level CAC/payback
      analysis.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: Partner contract structure, average deal size, renewal profile, and revenue recognition by stream.
    whyItMatters: >-
      The product is free to providers and patients, so sponsor-side economics determine whether reported scale converts
      into durable revenue quality.
    diligencePath: >-
