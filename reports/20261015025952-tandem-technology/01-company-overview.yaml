callouts:
  - calloutType: risk
    title: Governance visibility is still thin
    body: >-
      Investor names are public, but the retained record still lacks a current
      board roster, control-rights disclosure, and a broader executive bench.
    claimRefs: [CO015]
  - calloutType: insight
    title: Adoption can scale before direct user monetization
    body: >-
      Free usage for providers and patients, paired with biopharma-backed
      commercialization, explains why public reporting emphasizes workflow
      adoption and partner footprint over seat-based pricing.
    claimRefs: [CO006, CO008]
