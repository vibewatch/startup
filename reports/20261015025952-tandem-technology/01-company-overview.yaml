schemaVersion: report-v2
artifact: company-overview
slug: tandem-technology
runDate: 2026-10-15
company:
  name: Tandem Technology
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Tandem Technology's customer-facing brand is now Forus, a New York-based
    prescription-access automation platform that public reporting says was
    founded in 2023 and reached a roughly $1 billion valuation in 2026. The
    strongest current evidence supports rapid commercial scale and strategic
    pharma relationships, but the latest financing history, board composition,
    and several cover metrics remain only partially disclosed.
sections:
  - id: identity-and-offer
    title: Identity and offer
    body: >-
      The current official surface is Forus.com, but independent May 2026
      coverage still links that operating brand back to Tandem, describing the
      company as New York-based Forus, formerly Tandem. The product positioning
      is consistent across official and third-party evidence: Forus is trying to
      remove administrative friction between the prescription and therapy start
      by automating prior authorization, affordability, and routing work inside
      existing clinical workflows. This chapter should therefore treat Forus as
      the live commercial brand and Tandem Technology as the underlying company
      identity. That distinction matters because generic "Tandem" searches can
      also surface an unrelated European healthcare AI company, so later
      chapters should anchor identity-sensitive facts to Forus-specific or
      clearly matched sources rather than to the bare Tandem name alone.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      The retained sources surface one clearly documented operator: co-founder
      and CEO Sahir Jaggi, whose background spans Columbia biomedical
      engineering, Rough Draft Ventures, and several years inside Oscar Health.
      That profile is credible founder-market fit for a company selling into the
      prescription access bottleneck, because it combines healthcare workflow
      exposure with product-building experience. The downside is disclosure
      depth. Public reporting names investors and quotes outside supporters, but
      it does not identify a board roster, voting structure, or a broader
      internal executive bench. Until management shares a current board list and
      control framework, the company still looks key-person dependent on Jaggi
      for both operating narrative and external fundraising credibility.
    claimRefs: [CO005, CO015]
    tableRefs: [TO002]
  - id: funding-scale-and-stakeholders
    title: Funding, scale, and stakeholder structure
    body: >-
      The commercial story is attractive on the surface. Public reporting says
      providers and patients use the product for free while monetization comes
      from biopharma relationships, a setup that can accelerate provider
      adoption if pharma-sponsored launches remain strong. Forbes and Citybiz
      also describe meaningful scale: thousands of medical practices and health
      systems using the product, roughly half of the global top 10 biopharma
      cohort already engaged, and revenue moving from more than $10 million
      annualized at 2025 year-end to above $50 million annualized in 2026.
      Funding evidence is directionally strong but not fully clean. May 2026
      reporting says the company hit a $1 billion valuation and $160 million of
      lifetime funding, while January 2026 coverage describes an Accel-led round
      near the same valuation and one data provider still shows an internally
      inconsistent $100 million headline. That mismatch makes cap-table and
      round-document verification mandatory before any valuation chapter leans
      too heavily on the unicorn narrative.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestone-readback-and-open-asks
    title: Milestone readback and open asks
    body: >-
      The dated evidence supports a coherent growth arc even if not every
      disclosure is audited. The company appears to have started in 2023, raised
      a $30 million Series A in 2024, cleared a $10 million annualized revenue
      marker by the end of 2025, and entered 2026 with multiple reports placing
      it at or near a $1 billion valuation. By May 2026, Forbes was already
      writing about Forus as the commercial brand and describing revenue run
      rate above $50 million. The remaining gaps are not cosmetic: board
      composition, control rights, headcount, disclosed customer count,
      concentration by pharma partner, and reconciled funding history are still
      missing from the retained public record. Those omissions do not erase the
      progress story, but they do limit how confidently later chapters can infer
      operating durability or investor downside protection.
    claimRefs: [CO003, CO004, CO009, CO010, CO011, CO013, CO014, CO015]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date
      - Confidence
      - Gap
    rows:
      - [Current public brand, "Forus (formerly Tandem)", "2026-05 to 2026-10", high, null]
      - [Headquarters, "New York, USA", "2026-05", high, null]
      - [Founded, 2023, "2026-05 coverage", high, null]
      - [Stage, "Series B / current round still not formally announced in retained evidence", "2026-01 to 2026-05", medium, "Need signed financing documents or a company release."]
      - [Valuation, "~$1.0B reported; MapCo page also shows a conflicting $100M headline", "2026-01 to 2026-05", medium, "Reconcile against executed term sheet and post-money cap table."]
      - [Total raised, "$160M reported; Mindstream separately says $137M including the latest round", "2026-01 to 2026-05", medium, "Need authoritative funding history by round."]
      - [Revenue run rate, ">$10M annualized by 2025 year-end; >$50M annualized in 2026", "2025 year-end and 2026-05", medium, "Numbers are company-reported through press coverage, not audited."]
      - [Customer count, null, "2026-10-15", low, "Practice/user counts are not publicly disclosed in retained evidence."]
      - [Headcount, null, "2026-10-15", low, "Headcount is not publicly disclosed in retained evidence."]
    notes: >-
      Null means unsupported by retained public evidence; financing figures are
      directionally consistent on unicorn status but not yet reconciled to one
      authoritative round history.
    claimRefs: [CO001, CO004, CO009, CO011, CO012, CO013, CO014]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background
      - Founder-market fit / functional coverage
      - Key-person dependency
    rows:
      - ["Sahir Jaggi", "Co-founder and CEO", "Columbia biomedical engineering; Oscar Health product strategy; Rough Draft Ventures", "Direct exposure to payer/provider workflow pain and product execution in health tech", "High — he is the only clearly surfaced operator across retained sources."]
      - ["Other executives / board", "Not publicly disclosed", "Retained sources name investors and supporters but not a full operating or board roster", "Functional coverage outside Jaggi cannot be verified from public evidence", "High — leadership redundancy and governance bench depth remain unknown."]
    notes: >-
      Coverage is intentionally partial because the retained public evidence does
      not surface a fuller executive bench or board list.
    enumerationScope:
      coverage: partial
      basis: Public evidence surfaced one named operator and a governance gap rather than a complete leadership roster.
    claimRefs: [CO005, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - [Accel, "Lead investor in current financing narrative", "Mindstream and MapCo tie Accel to the reported January 2026 round near a $1B valuation", "Obtain round documents, ownership %, liquidation terms, and any board rights."]
      - [Thrive Capital, "Early investor and incubation backer", "Forbes says the company started in Thrive's office and quotes partner Kareem Zaki on the thesis", "Confirm present ownership, reserves, and whether Thrive holds governance rights."]
      - [General Catalyst, "Series A lead and strategic healthcare backer", "Mindstream says General Catalyst led the $30M Series A in 2024; Forbes cites former Merck CEO Ken Frazier via GC", "Confirm follow-on participation and any protective provisions."]
      - ["Bain Capital Ventures / Redpoint / BoxGroup / Pear VC", "Disclosed backers", "Citybiz names these firms as backers but does not quantify current ownership", "Reconcile each fund's stake and pro-rata capacity."]
      - ["Biopharma partners", "Commercial channel and likely payer of record", "Public reporting says about half of the global top 10 biopharma cohort already works with Forus", "Quantify revenue concentration, contract duration, and launch-dependent exposure."]
      - ["Providers and patients", "Primary users rather than fee-paying customers", "Official positioning says the product is free to them, so adoption matters operationally more than direct ARPU", "Validate retention, workflow penetration, and outcome attribution by practice cohort."]
    notes: >-
      This map reflects named stakeholders in public reporting, not an
      authoritative cap table or fully disclosed governance package.
    enumerationScope:
      coverage: partial
      basis: Rows cover the publicly named investors and commercial stakeholders surfaced in retained sources, not every cap-table holder.
    claimRefs: [CO006, CO008, CO009, CO010, CO011, CO015]
