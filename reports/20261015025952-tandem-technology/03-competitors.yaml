figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on assigned evidence suggests Forus combines the broadest prescription-access workflow
      scope with stronger external distribution leverage than manual or adjacent alternatives.
    data:
      xAxis:
        label: Workflow breadth in prescription-access job
        min: 1
        max: 5
        lowLabel: Narrow step coverage
        highLabel: Multi-party workflow coverage
        scale: Ordinal, evidence-backed scoring
      yAxis:
        label: Distribution leverage / installed reach
        min: 1
        max: 5
        lowLabel: Local or fragmented reach
        highLabel: National or platform-scale reach
        scale: Ordinal, evidence-backed scoring
      points:
        - label: Forus
          x: 5
          y: 4
          tone: positive
          detail: >-
            Official and independent sources describe prior authorization, affordability, routing, national payer /
            pharmacy coverage, and biopharma partnerships.
        - label: Manual workflow
          x: 2
          y: 2
          tone: risk
          detail: >-
            Present in most practices but dependent on staff calls, faxes, and forms rather than coordinated software.
        - label: Change Healthcare rails
          x: 3
          y: 5
          tone: warning
          detail: >-
            Deep installed reimbursement reach is evidenced indirectly by outage impact, but assigned sources do not
            verify equivalent front-end prescription-access breadth.
        - label: Tandem Health
          x: 3
          y: 3
          tone: neutral
          detail: >-
            Adjacent clinical-workflow AI with major European rollout, but not evidenced here as a U.S.
            prescription-access specialist.
        - label: Internal build
          x: 2
          y: 1
          tone: risk
          detail: >-
            Custom fit is possible, but assigned evidence does not show internally built workflows matching claimed
            nationwide multi-party coverage.
        - label: Biopharma launch-service stack
          x: 4
          y: 4
          tone: opportunity
          detail: >-
            Forus's partnership model implies this buyer budget and service layer matter, even though named public peer
            disclosures are sparse in the assigned pool.
    approximationNotes: >-
      Coordinates are ordinal synthesis from assigned source text, not measured market benchmarks or inferred conversion
      rates.
    claimRefs: [CP002, CP004, CP005, CP007, CP008, CP009, CP010, CP011]
