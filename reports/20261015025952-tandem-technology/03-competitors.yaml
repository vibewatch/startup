company:
  name: Tandem Technology
chapter:
  number: 3
  title: Competitors
  summary: >-
    Forus is positioned less against a single public point competitor than against the status quo of manual
    prescription-access work, incumbent transaction rails, and adjacent workflow software. The strongest evidence
    supports a differentiated, provider-free model funded by biopharma partnerships, but public evidence on pricing,
    named head-to-head wins, and durable lock-in remains thin.
sections:
  - id: competitive-set
    title: Competitive set is broad and mostly indirect
    body: >-
      The assigned evidence supports a broad competitive frame rather than a clean list of like-for-like public peers.
      Forus says it automates insurance authorization, financial assistance, and fulfillment routing inside physician
      workflows, while Forbes independently describes the product as handling prescription administrative backend work
      after a doctor writes the script. That places the company against several alternative ways to solve the same job:
      provider staff using forms, faxes, and phone calls; incumbent transaction infrastructure that sits between
      practices, payers, and pharmacies; internal workflow build-outs; and adjacent AI workflow vendors that may chase
      the same administrative budget even when they begin in a different use case. The pool does not surface a deep
      bench of named U.S. prescription-access software vendors with verified product and pricing pages, so the chapter
      distinguishes direct workflow substitutes from adjacent entrants rather than overstating peer precision.
    claimRefs: [CP001, CP002, CP003, CP007, CP009, CP010, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: differentiation
    title: Differentiation rests on workflow scope, free provider pricing, and channel alignment
    body: >-
      The most defensible differentiation in the evidence is business-model and workflow breadth, not a uniquely
      disclosed algorithm. Forus presents itself as free to doctors and patients and monetized through biopharma
      relationships; independent reporting echoes that the company relies on partnerships rather than user fees. That
      matters because it narrows the adoption hurdle versus vendors that must sell software seats to practices while
      also aligning Forus with drug-launch execution for manufacturers. In contrast, Tandem Health's disclosed product
      focus is clinical notes and broader clinical workflow support in Europe, which makes it better read as an
      adjacent workflow platform than as a proven U.S. prescription-access equivalent in this evidence set. Public
      pricing, discounting, and contract structure remain largely undisclosed, so the matrix can compare model and
      scope more confidently than it can compare economic terms.
    claimRefs: [CP002, CP004, CP005, CP007, CP010, CP012]
    tableRefs: [TP002, TP003]
  - id: durability
    title: Durability depends on distribution depth and reliability more than visible hard lock-in
    body: >-
      The moat argument in the assigned evidence is that Forus sits inside prescription-access workflows across doctors,
      pharmacies, payers, and biopharma and therefore accumulates process knowledge and launch-distribution relevance
      as scale grows. The same evidence also points to the main risk: buyers can still compare the company against
      internal operations, existing payer and pharmacy connections, and incumbent infrastructure whose failures become
      especially visible during outages. The AMA's Change Healthcare survey data are relevant because they show how much
      physician operations depend on claims, eligibility, remittance, and payment rails; a vendor exposed to these
      dependencies may benefit when buyers want alternatives, but it also inherits reliability scrutiny and contingency
      expectations. Without public renewal, multi-homing, or win-loss evidence, durability is plausible but not yet
      externally proven.
    claimRefs: [CP005, CP006, CP008, CP011, CP012, CP013, CP014]
callouts:
  - calloutType: strength
    title: Best-supported advantage
    body: >-
      The strongest public differentiation is not "AI" in the abstract; it is a provider-free workflow that combines
      prior-authorization, affordability, and pharmacy-routing work with biopharma-funded distribution support.
    claimRefs: [CP002, CP004, CP005]
  - calloutType: risk
    title: Hard-to-prove moat
    body: >-
      The evidence does not provide public contract economics, renewal data, or named head-to-head win rates, so moat
      claims rely more on management narrative and workflow logic than on externally demonstrated lock-in.
    claimRefs: [CP012, CP013, CP014]
