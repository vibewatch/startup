schemaVersion: "report-v2"
artifact: financials
slug: tandem-technology
runDate: 2026-10-15
company:
  name: Tandem Technology
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a free-at-point-of-use distribution model for providers
    and patients, with monetization tied to biopharma partnerships and a 2026
    financing step-up that pushed the company to a reported $1 billion valuation.
    Forbes also reports annualized revenue tracking above $50 million, but the
    public record still omits gross margin, burn, runway, concentration, and
    realized contract economics, so capital adequacy remains directionally positive
    rather than fully underwritten.
sections:
  - id: monetization-bridge
    title: Monetization depends on partner contracts, not visible end-user pricing
    body: |-
      The retained sources consistently describe Forus/Tandem as free to the two
      most obvious user groups: providers and patients. The commercial logic instead
      runs through biopharma relationships that pay the company to accelerate
      prescription access, launch support, and related commercialization workflows.
      That combination can drive fast adoption because the end-user price objection
      is close to zero, but it also means public usage breadth does not automatically
      reveal revenue quality. A large installed base can still mask uneven partner
      concentration, contract timing, or low realized revenue per prescription if
      the economics sit behind sponsor agreements that are not publicly disclosed.
    claimRefs: [CI001, CI003, CI010, CI012, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Traction signals are strong, but unit economics are still mostly opaque
    body: |-
      Public traction signals are directionally strong. Forbes reports annualized
      revenue above $50 million, while the company and related coverage describe
      thousands of practices, nationwide reach, and growing biopharma participation.
      Those datapoints suggest meaningful throughput and commercial demand, and the
      homepage testimonials show credible workflow savings at the practice level.
      Even so, the evidence stops short of an underwritable unit-economic picture:
      none of the retained sources disclose gross margin, CAC, payback, net revenue
      retention, working-capital intensity, or how much of the reported run rate
      comes from repeatable software-like contracts versus launch-specific services.
    claimRefs: [CI002, CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI003]
  - id: capital-adequacy-and-blockers
    title: Financing momentum is evident, but runway adequacy is still unproven
    body: |-
      January 2026 coverage framed the company as raising $100 million at a roughly
      $1 billion valuation, and later 2026 reporting cites $160 million of total
      funding. That pattern suggests access to capital and investor appetite rather
      than obvious funding stress. However, it does not establish cash on hand,
      burn, debt obligations, or the runway left after expansion costs. The chapter's
      main underwriting blocker is therefore not access to external financing but the
      lack of public disclosure on margin structure, concentration, and cash usage.
      A secondary diligence risk is attribution: since the company has operated as
      Tandem and now Forus, generic "Tandem" search results can surface unrelated
      fundraises unless each number is tied back to the Forus/Tandem issuer context.
    claimRefs: [CI004, CI005, CI006, CI011, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Provider/patient workflow distribution
        - Free software automates prior authorization, affordability, and pharmacy routing
        - Per prescription or workflow volume (undisclosed)
        - Live and broadly distributed, but not directly monetized at the point of use
        - Medium
        - Break out volume by practice, specialty, and payer mix
      - - Biopharma launch and access programs
        - Partner contracts fund commercialization and prescription-access support
        - Contract economics undisclosed
        - Active; Forbes and Citybiz both describe large biopharma participation
        - Medium
        - Provide average contract size, term length, and renewal profile
      - - New-drug rollout support
        - Operational support for launch readiness, pharmacy routing, and patient start
        - Launch-program revenue or fees undisclosed
        - Management says several large launches were planned in 2026
        - Low
        - Separate recurring platform revenue from launch-specific services
      - - Data/network expansion option
        - Growing network of doctors, patients, and first-party workflow data may improve monetization leverage
        - No public pricing or take-rate disclosure
        - Strategic upside signaled, not yet auditable as a distinct revenue line
        - Low
        - Show what portion of revenue depends on data, network, or analytics upsell
    notes: >-
      Public sources show who uses the product for free and who likely pays, but not
      realized contract pricing, revenue recognition, or stream-level mix.
    claimRefs: [CI001, CI003, CI010, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Buyer / counterparty
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Providers
        - Free to providers
        - Publicly described as free, with no realized-price exception disclosed
        - No implementation fee, seat fee, or usage fee disclosed
        - SI001, SI005
      - - Patients
        - Free to patients
        - Publicly described as free, with no out-of-pocket software charge disclosed
        - Financial assistance may affect therapy affordability, not Tandem software pricing
        - SI001, SI002
      - - Biopharma partners
        - Contracted partnership economics; exact fee basis undisclosed
        - No list pricing or realized pricing disclosed
        - Unknown whether fees are subscription, launch milestone, per script, or hybrid
        - SI005, SI007
      - - New drug launch programs
        - Commercial terms undisclosed
        - No public list pricing
        - Unknown mix between one-time launch work and recurring ongoing support
        - SI005, SI006
    notes: >-
      Official pricing is visible only for end users (free); sponsor-side monetization
      remains private, so list-versus-realized pricing cannot be reconciled publicly.
    claimRefs: [CI001, CI003, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Annualized revenue run rate
        - Above $50M in 2026
        - Medium
        - Strongest disclosed scale datapoint, but it is annualized revenue rather than audited revenue or ARR
        - Provide GAAP revenue, ARR if relevant, recognition policy, and quarterly history
      - - Total capital raised
        - $160M disclosed by May 2026; January reporting cited $137M raised to date before the new round closed
        - Medium
        - Suggests capital access, but chronology and closed-versus-announced amounts need reconciliation
        - Provide round-by-round close dates, proceeds, and current cash balance
      - - Workflow savings proxy
        - One provider testimonial says phone time fell from 60 to 70% of the day to about 15%
        - Low
        - Shows customer value and possible labor leverage, but not company gross margin
        - Provide cohort-level before/after data and implementation costs
      - - Distribution proxy
        - Thousands of practices and health systems, all 50 states, nearly 80% of U.S. residential zip codes, and major biopharma partnerships
        - Medium
        - Indicates reach and potential prescription volume, but not retention or concentration
        - Provide active-customer counts, concentration, retention, and script volume by segment
      - - Gross margin / burn / runway / CAC payback
        - null
        - Low
        - Core underwriting variables remain unavailable in public sources
        - Provide gross margin bridge, burn, runway, CAC, payback, NRR, and working-capital needs
    notes: >-
      This table mixes disclosed metrics and explicit nulls; null means the retained
      public evidence did not provide a supportable number, not that the metric is zero.
    claimRefs: [CI002, CI004, CI005, CI007, CI009, CI011, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a free end-user workflow that monetizes through
      sponsor partnerships, leaving gross-profit mechanics undisclosed.
    data:
      nodes:
        - label: Doctor writes prescription in existing workflow
          note: Forus says prescribing stays in the EHR and the access workflow runs around it
        - label: Tandem automates prior authorization, affordability, and routing
          note: Administrative work shifts from manual phone calls and paperwork to automated workflow
        - label: Patient and provider usage is free
          note: Public sources explicitly say the software is free to both groups
        - label: Adoption expands across practices and health systems
          note: Public reporting cites thousands of practices, nationwide reach, and millions of patients targeted in 2026
        - label: Biopharma partners fund launch and access programs
          note: Forbes and Mindstream indicate partnerships, not user fees, are the revenue source
        - label: Gross profit depends on contract mix and automation leverage
          note: Public sources do not disclose realized pricing, margins, or cash conversion
    claimRefs: [CI003, CI012, CI014, CI015]
callouts:
  - calloutType: risk
    title: Public traction is ahead of public disclosure quality
    body: >-
      The company now has externally reported scale and funding momentum, but public
      materials still do not disclose gross margin, burn, runway, retention, or
      customer concentration, leaving the underwriting case incomplete.
    claimRefs: [CI007, CI009, CI011, CI014]
  - calloutType: insight
    title: Free distribution can accelerate adoption while obscuring unit economics
    body: >-
      Because providers and patients are not charged, the company can grow usage
      quickly, but investors still need partner-level contract economics to know
      whether adoption converts into durable gross profit.
    claimRefs: [CI003, CI012, CI015]
