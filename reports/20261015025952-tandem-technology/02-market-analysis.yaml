company:
  name: Tandem Technology
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Tandem Technology's market is narrower than generic "healthcare AI": the core job is medication-access automation
    after a prescription is written, especially prior authorization, pharmacy routing, patient follow-up, and launch
    support for specialty therapies. Public evidence supports a very large surrounding prescription-spend base and a
    real access-loss problem, but it does not isolate a clean SAM or SOM for medication-access workflow software, so
    the market case still depends on evidence-constrained lenses rather than a precise bottom-up model.
sections:
  - id: market-boundary
    title: Market boundary and adjacency
    body: >-
      Tandem's retained evidence points to a medication-access workflow market, not a catch-all clinical AI category.
      The Forus site says the product automates the steps from prescription to affordable access, including prior
      authorization submission, prescription tracking, and patient updates, while Forbes says the system handles the
      administrative backend after a physician writes a script and helps determine pharmacy routing and affordability
      support. That places the core market after clinical decision-making but before successful fulfillment. The
      nearest adjacency is broader clinical-workflow automation: Tandem Health's European press release describes an
      "AI-native operating system" for documentation, coding, care coordination, and decision support, which shows
      adjacent healthcare AI budgets exist but should be excluded from Tandem Technology's core market boundary unless
      the company expands beyond medication access.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM010
      - CM013
      - CM014
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Sizing lenses and growth drivers
    body: >-
      The strongest public sizing evidence is indirect but still economically meaningful. Forbes, citing an
      American Society of Health-System Pharmacists report, says prescription drug spending should surpass $1 trillion
      in 2026 and that more than $300 billion of therapies still do not reach patients, which frames the size of the
      medication-access problem rather than Tandem's software revenue opportunity. HHS adds a public-payer slice by
      saying Medicaid prescription-drug spending exceeded $100 billion gross and $60 billion after rebates in 2024,
      with a 2026 pilot meant to create more uniform coverage criteria. At the same time, independent reporting says
      standards bodies are working on common prior-authorization APIs, which could reduce integration friction and
      make software infrastructure more reusable. These drivers help the market narrative, but they do not substitute
      for a disclosed SAM or contractable budget pool.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM012
      - CM015
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-map-and-constraints
    title: Buyer map, adoption path, and constraints
    body: >-
      Public evidence suggests Tandem's user, beneficiary, and economic buyer are not the same actor. Providers and
      patients appear to be the direct workflow users, and the product is repeatedly described as free to both sides,
      while Forbes says Tandem instead signs deals with pharmaceutical companies that want new therapies to reach
      eligible patients faster. That creates a two-sided adoption path: provider offices must trust the workflow
      because it removes paperwork and therapy delays, while pharma teams must see better launch execution and access
      conversion. The main constraint is that evidence quality still lags the ambition. TechFundingNews says the
      company has not disclosed live deployment or integration detail, and public sources do not isolate approval-rate
      gains, time-to-therapy deltas, or how much of the value leakage comes from issues workflow automation can
      actually solve rather than drug pricing itself.
    claimRefs:
      - CM002
      - CM008
      - CM009
      - CM011
      - CM012
      - CM015
      - CM016
    tableRefs:
      - TM003
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment/category
      - Included spend
      - Excluded spend
      - Buyer/payer
      - Relevance
    rows:
      - - Prior-authorization workflow automation
        - Staff time and software logic to prepare, submit, and follow payer-specific approval requests after prescribing.
        - Diagnosis, clinical decision-making, and claims adjudication.
        - Users are prescribers and medication-access staff; payer rules come from insurers and public programs.
        - Core Tandem workflow.
      - - Pharmacy routing and fulfillment coordination
        - Routing prescriptions to the right specialty or retail pharmacy, tracking status, and handling handoffs.
        - Dispensing economics, wholesaler margin, and physical logistics outside the access handoff.
        - Users are provider staff and patients; constraints come from payer, PBM, and pharmacy requirements.
        - Core Tandem workflow.
      - - Patient affordability and access support
        - Benefit checks, affordability navigation, and patient updates needed to start therapy.
        - Underlying drug price itself and manufacturer assistance-fund economics.
        - End beneficiaries are patients; economic burden often sits with payer programs or manufacturer support.
        - Core-adjacent workflow value.
      - - Biopharma launch support
        - Commercial support to ensure new-drug prescriptions can clear coverage and reach stocked pharmacies.
        - R&D, clinical-trial, and general brand-marketing spend.
        - Economic buyer appears to be biopharma launch/commercial teams.
        - Core monetization path.
      - - Broader clinical-workflow AI
        - Documentation, coding, care coordination, and point-of-care decision support software.
        - Medication-access-specific admin tasks after prescribing.
        - Buyers are health systems and clinicians on a broader workflow budget.
        - Adjacent category to exclude from core TAM.
    notes: >-
      Boundary synthesized from product pages and reporting; rows distinguish Tandem's medication-access workflow from
      broader clinical-AI adjacencies rather than claiming a disclosed company TAM.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM010
      - CM013
      - CM016
