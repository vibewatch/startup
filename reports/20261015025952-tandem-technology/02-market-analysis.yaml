      - - Forbes / ASHP
        - 2026
        - United States
        - More than $300B worth of therapies never get to patients.
        - Problem-value lens derived from the same report cited by Forbes.
        - Access-loss lens measuring leakage rather than vendor revenue.
        - Medium
        - Not equivalent to contractable budget or Tandem revenue.
      - - HHS / CMS
        - 2024
        - United States Medicaid
        - $100B gross prescription spending; $60B after rebates.
        - $10B increase versus 2022.
        - Public-payer subsegment lens from CMS announcement.
        - Medium
        - Medicaid only; no direct software-spend implication.
      - - Forbes / KFF
        - 2026
        - United States
        - About 4 in 10 adults report cost-related nonadherence over the prior year.
        - Persistent affordability pressure.
        - Demand-side adoption constraint lens.
        - Medium
        - Survey evidence, not spend.
      - - TechFundingNews / Mindstream / MapCo
        - 2026
        - United States
        - Tandem expects to reach millions of patients.
        - Forward company target.
        - Operational-throughput lens repeated by third parties.
        - Low
