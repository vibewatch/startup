  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Provider office / health system medication access
        - Provider chooses workflow, but public evidence does not show provider payment.
        - Physicians, nurses, and access staff.
        - Product is described as free to providers.
        - Prior authorization generation, follow-up, routing, and status tracking.
        - Budget owner not publicly disclosed on provider side.
        - High admin burden and delayed therapy starts.
      - - Patient support and affordability navigation
        - Usually not the direct buyer.
        - Patients and support staff following status and affordability steps.
        - Product is described as free to patients.
        - Updates, affordability routing, and access coordination after prescribing.
        - External program or partner economics rather than patient subscription spend.
        - Failed fills, denial friction, and cost-related abandonment.
      - - Biopharma launch / commercialization
        - Pharmaceutical companies launching or scaling therapies.
        - Commercial, launch, and access teams alongside provider users.
        - Manufacturer-funded relationship appears to be the paying side.
        - Ensure new therapies can clear insurance, route to pharmacies, and start on time.
        - Brand or launch commercialization budget.
        - Need for faster therapy uptake and fewer launch frictions.
      - - Public-payer / coverage-policy environment
        - Not a direct software buyer in retained evidence.
        - State Medicaid programs and administrators shape operating rules.
        - Medicaid budgets absorb drug-spend consequences.
        - Coverage criteria, pricing, and participation rules that affect access workflows.
        - State/federal public-payer budgets.
        - Policy push for predictable coverage criteria and lower drug costs.
    notes: >-
      Buyer and budget-owner roles are inferred from public positioning because Tandem does not disclose contract
      structure, provider pricing, or payer revenue contribution.
    claimRefs:
      - CM002
      - CM007
      - CM008
      - CM011
      - CM015
      - CM016
figures:
  - id: FM001
    title: Evidence-constrained market lens
    type: pyramid
    summary: Separate layers move from broad prescription economics toward Tandem's reachable workflow while marking what should stay outside the core market.
    data:
      items:
        - label: Broad U.S. prescription spend
          value: $1T+
          detail: Forbes cited an ASHP expectation that prescription drug spending will surpass $1 trillion in 2026.
          note: Macro therapy-spend lens; not Tandem revenue TAM.
        - label: Access leakage in therapies
          value: $300B+
          detail: Forbes said more than $300 billion worth of therapies never get to patients.
          note: Problem-value lens rather than software budget.
        - label: Medicaid prescription spend
          value: $100B gross
          detail: HHS said Medicaid prescription-drug spending exceeded $100 billion in 2024 before rebates.
          note: Public-payer slice of the broader prescription market.
        - label: Excluded broader workflow AI
          value: Not counted
          detail: Tandem Health's adjacent category is a broader clinical-workflow operating system, not a medication-access workflow.
          note: Keep broader documentation and care-coordination budgets outside Tandem's core market.
        - label: Cost-related nonadherence
          value: 4 in 10 adults
          detail: Forbes cited a KFF poll saying about four in ten U.S. adults skipped prescribed use due to costs over the prior year.
          note: Demand constraint that workflow automation alone cannot eliminate.
        - label: Company scale target
          value: Millions of patients
          detail: TechFundingNews, Mindstream, and MapCo repeated Tandem's 2026 patient-reach ambition.
          note: Forward company target without independent deployment detail.
    approximationNotes: >-
      The layers are separate market lenses rather than a reconciled TAM/SAM/SOM stack because retained sources mix
      spend, leakage, public-payer, survey, and company-guidance units.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM012
      - CM013
      - CM015
callouts:
  - calloutType: risk
    title: Public evidence does not isolate a software SAM
    body: >-
      The market case is supported by large therapy spend and visible access friction, but no retained source discloses
      how much of that value converts into contractable medication-access software budget, approval-rate lift, or
      time-to-therapy ROI for Tandem's specific workflow.
    claimRefs:
      - CM005
      - CM006
      - CM011
      - CM012
