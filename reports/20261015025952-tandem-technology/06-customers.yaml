  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-and-concentration-disclosure
      missingEvidence: Public or management-shared NRR, GRR, gross churn, renewal timing, contract terms, and top-customer / top-partner concentration data.
      whyItMatters: The chapter can show adoption momentum, but not whether revenue is durable or whether a small number of biopharma customers dominate economics.
      diligencePath: Request cohort retention, renewal, contract-length, and concentration disclosures by customer segment for the last four quarters.
      relatedQuestionRefs: [QU004, QU005]
    - type: private-evidence-only
      severity: material
      topic: named-customer-proof-table coverage
      missingEvidence: Named production deployments, customer references, or independently verifiable case studies with outcomes and dates.
      whyItMatters: Anonymous testimonials are useful for workflow color, but they do not provide the reference quality needed to underwrite stickiness or expansion.
