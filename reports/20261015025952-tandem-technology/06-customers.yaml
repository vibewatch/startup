company:
  name: Tandem Technology
chapter:
  number: 6
  title: Customers
  summary: >-
    Forus appears to have real provider adoption and a viable biopharma-funded expansion path, but
    the public customer record is still much stronger on top-of-funnel usage claims than on named
    production accounts, retention, or concentration disclosure. The strongest evidence is the
    combination of broad 2026 adoption claims, workflow-level testimonials, and repeated claims
    that life-sciences partners — not clinicians or patients — are the paying side of the model.
sections:
  - id: customer-base-and-paying-entity
    title: Customer base structure and who appears to pay
    body: >-
      The clearest pattern in the assigned evidence is that Forus sits inside provider workflows but
      monetizes elsewhere. Official product copy frames the workflow around physicians, clinic staff,
      and patients: the doctor prescribes in the EHR, the platform generates prior-authorization
      paperwork, staff can track every prescription, and patients receive status updates. Forbes and
      Mindstream both reinforce that providers and patients do not pay to use the product; instead,
      commercialization appears to come from biopharma relationships tied to launch support and
      medication access. That makes prescribing practices and health systems the operational user
      base, patients the end beneficiary, and biopharma companies the most likely paying
      counterparty. What is still missing is the segment mix: no source in the assigned pool breaks
      adoption down by specialty, provider size, payer mix, or drug category, so the revenue weight
      of any single customer cohort is still opaque.
    claimRefs: [CU001, CU002, CU003, CU009, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-public-reference-quality
    title: Adoption proof exists, but most public customer proof is anonymous
    body: >-
      The public adoption evidence is meaningful but uneven in quality. Forbes and Pulse2 both say
      the company is already used by thousands of medical practices and health systems, and Pulse2
      adds a broad geographic claim spanning all 50 states and nearly 80% of residential ZIP codes.
      Forbes also reports 10x year-over-year provider adoption for two consecutive years. That is a
      credible signal that the company is not a pre-launch pilot. The problem is that the assigned
      pool contains little named production proof. The official homepage gives concrete workflow
      anecdotes — fewer rejections, faster approvals, and one staff workflow dropping from roughly
      60–70% of the day on the phone to around 15% — but those references are anonymous. Likewise,
      the “millions of patients in 2026” framing in Mindstream and MapCo reads as a forward-looking
      scale target, not a verified current patient-count disclosure.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU011, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risk
    title: Expansion logic is plausible, but durability and concentration remain underdisclosed
    body: >-
      The expansion thesis is straightforward: provider workflow adoption generates a distribution
      layer that biopharma companies can use to improve launch readiness and patient access, which
      helps explain why multiple sources say top global drugmakers are already partners. That is
      strategically attractive, but it also raises concentration questions because the assigned pool
      provides no public NRR, GRR, logo churn, contract length, or top-customer-share disclosure.
      The external market context is supportive but not frictionless. KFF polling shows prior
      authorization is a major burden for insured adults, and CAQH coverage cited by AJMC and Chief
      Healthcare Executive shows only 40% of prior-authorization transactions were electronic in
      2024. Stanford researchers also warn that AI use in insurance authorization can contribute to
      wrongful denials when oversight is weak. Together, that means the category pain is real, but
      the ecosystem Forus depends on is still operationally manual and likely to face governance
      scrutiny as AI tools spread.
    claimRefs: [CU010, CU012, CU013, CU014, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Provider practices and health systems
        - Buyers/users are prescribing organizations; daily users are physicians and staff; public sources say they are not the payer
        - Prescription access workflow, prior authorization, fulfillment routing
        - Thousands of practices and health systems; all 50 states claimed
        - Operational distribution layer that makes downstream life-sciences monetization possible
        - No public split by specialty, size, geography, or drug area
      - - Physicians and clinic staff
        - Users inside the provider account
        - Write in EHR, track scripts, follow exceptions, cut phone work
        - Anonymous workflow testimonials on the official site
        - Workflow stickiness if saved staff time is real
        - No named accounts, utilization baselines, or renewal data
      - - Patients
        - End user / beneficiary, not the payer in public sources
        - Receive updates, affordability support, and pharmacy routing
        - Company says patients can start therapy faster and track progress
        - Strategic proof that the platform touches the therapy-access journey end to end
        - No public patient-count disclosure or cohort outcomes
      - - Biopharma launch partners
        - Likely paying counterparty; provider and patient are downstream users
        - New-drug launch support, access intelligence, commercialization support
        - Five of the top 10 global biopharma companies already working with Forus
        - Appears to be the monetization engine because the product is free to providers and patients
        - No customer concentration, contract structure, or partner-retention disclosure
    notes: Public evidence supports the segment logic, but pricing, contract terms, and segment mix remain undisclosed.
    claimRefs: [CU001, CU002, CU003, CU009, CU010]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Provider footprint
        - Thousands of medical practices and health systems
        - "2026-05-12"
        - Forbes; Pulse2
        - Medium
        - Indicates real commercial deployment rather than a handful of pilots
        - No exact account count or active-account definition
      - - Geographic reach
        - All 50 states and nearly 80% of U.S. residential ZIP codes
        - "2026-05-12"
        - Pulse2
        - Medium
        - Suggests nationwide pharmacy/payer connectivity and broad provider reach
        - No patient or script counts by geography
      - - Adoption growth
        - 10-fold annual increase for the past two years
        - "2026-05-12"
        - Forbes
        - Medium
        - Strong top-line adoption momentum if comparable year bases were used
        - No starting base, retention split, or paid-revenue bridge
      - - Workflow outcome
        - Phone-work share fell from 60–70% of the day to about 15%
        - Undated
        - Forus homepage
        - Low
        - Suggests compelling ROI for staff if the anecdote generalizes
        - Anonymous testimonial with no sample size or baseline methodology
      - - Patient-scale framing
        - Millions of patients in 2026
        - 2026
        - Mindstream; MapCo
        - Low
        - Shows ambition and investor narrative around scaled usage
        - Framed as expected/targeted usage, not current realized volume
    notes: The table mixes realized deployment claims with forward-looking scale language; no source discloses audited active-account, script-volume, or retention denominators.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Unnamed prescribing clinician testimonial
        - Provider
        - Physician writes the prescription and sends it through Forus instead of manually managing rejections
        - Production use implied
        - Official quote says the clinician can prescribe what is right for the patient without worrying about rejections
        - No account name, specialty, drug class, or before/after metric
      - - Unnamed practice-switch anecdote
        - Provider
        - Practice used Forus to secure approvals for patients who had been stuck elsewhere
        - Production use implied
        - Official quote says multiple patients who had failed to get approved at another practice were approved with Forus
        - No patient count, time window, named site, or payer context
      - - Unnamed clinic staff workflow testimonial
        - Provider operations
        - Staff time spent calling payers and pharmacies during the access process
        - Production use implied
        - Official quote says phone work fell from 60–70% of the day to about 15%
        - No named customer, sample size, or independent validation
    notes: The assigned pool contains concrete testimonial evidence, but not named production references or public renewal cohorts.
    enumerationScope:
      coverage: partial
      basis: Public customer proof in the assigned pool is limited to the official homepage testimonials plus broad third-party scale claims, so this table captures the available public subset rather than a full customer roster.
    claimRefs: [CU004, CU005, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The product sits in the provider workflow while monetization appears to come from biopharma
      relationships layered onto the same access network.
    data:
      items:
        - label: Prescription written in the EHR
          actor: Physician
          stage: Clinical decision
          touchpoints:
            - Write the prescription in the normal EHR workflow
            - Forus picks up the order as the access workflow begins
          note: Official product copy centers the journey on the prescribing clinician rather than a separate portal.
        - label: Prior authorization and paperwork automation
          actor: Clinic staff
          stage: Access initiation
          touchpoints:
            - Auto-generate and submit prior-authorization forms
            - Track exceptions instead of working every case by phone
          note: This is the core provider-value proposition and the strongest operational adoption proof in the pool.
        - label: Real-time script tracking
          actor: Physician and staff
          stage: Workflow management
          touchpoints:
            - Follow every prescription in real time
            - Intervene when the workflow stalls
          note: Official copy emphasizes visibility rather than pure one-shot automation.
        - label: Patient affordability and status updates
          actor: Patient
          stage: Access completion
          touchpoints:
            - Receive updates on authorization and fulfillment
            - Navigate affordability support and next steps
          note: Patients are beneficiaries of the workflow, but public sources do not show they are the paying customer.
        - label: Pharmacy and payer coordination
          actor: Pharmacy and payer ecosystem
          stage: Fulfillment routing
          touchpoints:
            - Route the prescription to the right pharmacy
            - Resolve payer and inventory constraints before pickup
          note: External sources suggest nationwide connectivity, but no public SLA or turnaround cohort is disclosed.
        - label: Biopharma launch and data loop
          actor: Biopharma partner
          stage: Expansion / monetization
          touchpoints:
            - Use the network to support launches and treatment uptake
            - Feed access intelligence back into commercialization planning
          note: This appears to be the revenue-bearing expansion loop, and also the most likely source of concentration risk.
    claimRefs: [CU001, CU003, CU009, CU010, CU012, CU014]
