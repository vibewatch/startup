              15%，这说明正常运行时间、集成和异常处理是关键能力，而非锦上添花。商业模式也显得依赖合作伙伴。公开来源称服务对提供者和患者免费、模式预计依靠合作伙伴；管理层据报道希望深化生物制药关系，让平台覆盖数百万患者。若少数支付方、药企伙伴或战略渠道成为真正的变现引擎，集中度和议价权风险就会升高。最后，证据链本身也嘈杂：发现的一条
              2026 年融资来源最终只是通用组织模板，而 “Tandem” 这个名称已经属于其他医疗品牌，增加了尽调噪声，也可能抬高市场进入中的身份模糊成本。
