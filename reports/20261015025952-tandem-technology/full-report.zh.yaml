      - number: '5.4'
        title: 信任、合规与公开证明缺口
        blocks:
          - type: paragraph
            body: >-
              产品风险不在于 Forus 是否能自动化获取任务，而在于其 AI 辅助工作流能否在规模化下被信任、审计和集成。Holland & Knight 2026 年的审阅显示，各州正在收紧事前授权和临床工作流中的 AI
              规则，包括患者特定审查、披露和持牌人工监督。在这一背景下，已审阅的产品证据对安全姿态、BAA 或去标识化实践、实时支付方和 EHR 覆盖，以及合作伙伴集成的技术范围，都明显不完整。一个指定的
              OpenEvidence URL 在抓取文本中没有保留实际合作正文；而且以往 Tandem 名称的搜索仍会撞上无关医疗 AI 厂商，因此深度尽调应依靠一手技术文档和点名的客户实施，而非表面搜索结果。
