            tableRef: TO003
            claimRefs:
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
              - CO015
      - number: '1.4'
        title: 里程碑回看与待解决问题
        blocks:
          - type: paragraph
            body: >-
              有日期的证据串起了一条连贯的增长轨迹，尽管并非每项披露都经过审计。公司似乎于 2023 年成立，2024 年完成 $30 million 的 Series A，2025 年底突破 $10 million
              的收入年化指标，并在 2026 年初进入多篇报道所称的约 $1 billion 估值区间。到 2026 年 5 月，Forbes 已将 Forus 写作商业品牌，并称收入年化超过 $50
              million。剩余缺口并非枝节：董事会构成、控制权、员工数、披露的客户数、按药企伙伴划分的集中度，以及经过核对的融资历史，仍未出现在留存的公开记录中。这些遗漏不会抹去增长故事，但限制了后续章节对运营耐久性或投资者下行保护的判断力度。
            claimRefs:
              - CO003
              - CO004
              - CO009
              - CO010
              - CO011
              - CO013
              - CO014
              - CO015
