              - CO014
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 治理透明度仍然偏低
            body: 投资者姓名已公开，但留存记录仍缺少当前董事会名单、控制权披露和更完整的高管团队。
            calloutType: risk
            claimRefs:
              - CO015
          - type: callout
            title: 采用可以先于直接用户变现扩张
            body: 提供者和患者免费使用，加上生物制药支持的商业化，解释了为何公开报道更强调工作流采用和合作伙伴覆盖，而不是按席位定价。
            calloutType: insight
            claimRefs:
              - CO006
              - CO008
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻领域
        blocks:
          - type: paragraph
            body: >-
              Tandem 留存的证据指向药物获取工作流市场，而不是包罗万象的临床 AI 类别。Forus 网站称，产品自动处理从开具处方到获得可负担药物的步骤，包括提交事前授权、追踪处方和更新患者状态；Forbes
              则称，医生开具处方后，系统接管行政后台，并协助确定药房路由和负担能力支持。因此，核心市场位于临床决策之后、成功履约之前。最近的相邻领域是更广义的临床工作流自动化：Tandem Health
              的欧洲新闻稿将其描述为用于文档、编码、护理协调和决策支持的“AI 原生操作系统”。这说明相邻医疗 AI 预算确实存在，但除非公司走出药物获取范围，否则应排除在 Tandem Technology
              的核心市场边界之外。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM013
              - CM016
      - number: '2.2'
        title: 市场规模视角与增长驱动
        blocks:
          - type: paragraph
            body: >-
              最有力的公开规模证据是间接的，但仍有经济意义。Forbes 援引 American Society of Health-System Pharmacists 报告称，2026 年处方药支出应超过 $1
              trillion，且仍有超过 $300 billion 的治疗无法到达患者手中；这说明药物获取问题的规模，而不是 Tandem 的软件收入机会。HHS 进一步给出公共支付方切面：2024 年 Medicaid
              处方药支出总额超过 $100 billion，返利后超过 $60 billion；2026 年试点旨在形成更统一的覆盖标准。与此同时，独立报道称标准制定机构正在推进通用事前授权
              API，这可能降低集成摩擦，让软件基础设施更容易复用。这些驱动因素支撑市场叙事，但不能替代已披露的 SAM 或可签约预算池。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
              - CM015
      - number: '2.3'
        title: 买方图谱、采用路径与约束
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Tandem 的用户、受益人和经济买方并非同一方。提供者和患者似乎是直接工作流用户，产品也反复被描述为对双方免费；Forbes 称，Tandem
              实际与希望让符合条件的患者更快获得新疗法的药企签约。于是形成双边采用路径：提供者诊所必须信任这套工作流，因为它能减少文书和治疗延误；药企团队则必须看到更好的上市执行和获取转化。主要约束在于证据质量仍落后于商业野心。TechFundingNews
              称，公司未披露实际部署或集成细节；公开来源也没有单独说明批准率提升、治疗耗时变化，或价值损失中有多少确实能由工作流自动化解决，而不是由药价本身造成。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM011
              - CM012
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM011
              - CM015
              - CM016
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据无法单独拆出软件 SAM
            body: 市场论据得到巨额治疗支出和明显获取摩擦的支持，但没有留存来源披露其中有多少能转化为可签约的药物获取软件预算、Tandem 工作流带来的批准率提升，或治疗耗时 ROI。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合广泛，且大多是间接竞争
        blocks:
          - type: paragraph
            body: >-
              指定证据支持的是宽泛的竞争框架，而非一份干净的同类公开同行名单。Forus 称，产品在医生工作流内自动处理保险授权、财务援助和履约路由；Forbes
              独立描述其为医生开处方后的处方行政后台。公司因此要面对多种解决同一任务的替代方式：提供者用表格、传真和电话人工处理；连接诊所、支付方和药房的既有交易基础设施；内部自建工作流；以及可能争夺同一行政预算的相邻 AI
              工作流厂商，即便它们起步于不同用例。样本中没有出现一批拥有经过核实的产品和定价页面、且专门服务美国处方获取的软件厂商，因此本章将直接工作流替代品与相邻进入者分开，而不夸大同行比较的精度。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP009
              - CP010
              - CP011
