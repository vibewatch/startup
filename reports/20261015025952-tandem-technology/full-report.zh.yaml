              公开采用证据有意义，但质量参差。Forbes 和 Pulse2 都称，公司已经被数千家医疗诊所和卫生系统使用；Pulse2 进一步称覆盖全部 50 个州和近 80% 的住宅 ZIP code。Forbes
              还报告，提供者采用量连续两年同比增长 10
              倍。这足以说明公司不是上市前试点。问题在于，指定样本几乎没有点名的生产环境证明。官网提供了具体工作流案例——拒绝减少、批准加快，以及某项工作人员工作流中打电话的时间从每天约 60–70% 降至约
