chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品
        blocks:
          - type: paragraph
            body: >-
              当前官方入口是 Forus.com，但 2026 年 5 月的独立报道仍将这一运营品牌与 Tandem 联系起来，称其为总部在纽约的 Forus、前身为
              Tandem。官方和第三方证据对产品定位基本一致：Forus 试图把处方开出到治疗启动之间的行政摩擦降下来，在现有临床工作流内自动完成事前授权、负担能力评估和路由。因而，本章将 Forus 视为当前商业品牌，将
              Tandem Technology 视为底层公司身份。这个区分很重要，因为泛搜 “Tandem” 也会搜到一家无关的欧洲医疗 AI 公司；后续章节应把身份敏感事实锚定到 Forus
              专属或明确匹配的来源，而不是只依赖 Tandem 这一名称。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: 领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              留存来源清楚披露了一位运营者：联合创始人兼 CEO Sahir Jaggi，其经历横跨哥伦比亚大学生物医学工程、Rough Draft Ventures，以及在 Oscar Health
              的数年工作。这种背景适合切入处方获取瓶颈，因为同时具备医疗工作流经验和产品打造经历。问题在披露深度：公开报道点名了投资者并引用外部支持者，却没有披露董事会名单、投票结构或更完整的内部高管团队。在管理层提供当前董事会名单和控制框架之前，公司在运营叙事和外部融资可信度上仍高度依赖
              Jaggi。
            claimRefs:
              - CO005
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO015
      - number: '1.3'
        title: 融资、规模与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              商业故事表面上很有吸引力。公开报道称，提供者和患者免费使用产品，收入来自生物制药关系；只要药企赞助的上市项目保持强劲，这种模式就能加快提供者采用。Forbes 和 Citybiz
              还描述了不小的规模：已有数千家医疗机构和卫生系统使用，全球前 10 大生物制药公司中约一半已经参与，收入从 2025 年末年化超过 $10 million 增长到 2026 年年化超过 $50
              million。融资证据方向明确，但还不够干净。2026 年 5 月报道称，公司估值达到 $1 billion、累计融资 $160 million；2026 年 1 月报道则称 Accel
              领投一轮接近同等估值的融资，而一家数据提供商仍显示相互矛盾的 $100 million 标题数字。因此，在任何估值章节过度依赖独角兽叙事前，必须核对股权结构表和轮次文件。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
