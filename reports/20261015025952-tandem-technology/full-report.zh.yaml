            body: >-
              最好把产品理解为围绕一次处方事件搭建的编排层。官方文案显示，开方医生留在正常 EHR 工作流内，Forus
              生成事前授权表格、追踪状态，并让工作人员和患者都能收到更新；独立报道又补充了福利核验、申诉、续期追踪和负担能力登记。运营模式横跨接入、规则或工作流自动化、文档组装、路由和通信。公开报道称已有数千家诊所和卫生系统使用并覆盖全国，部署成熟度显然高于尚未产生收入的原型；但审阅过的来源仍未核实实时集成广度、正常运行时间或异常处理表现。
