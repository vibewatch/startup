        - 要求提供合规备忘录，将当前工作流映射至 CMS / 州级护栏和人工审核节点。
      - - 理赔降码或不利决定范围蔓延
        - Manatt 和 Holland & Knight 均描述了禁止付款方仅依靠 AI 作出拒绝、不利决定或降码的法律。
        - 多州适用且当前有效。
        - 中
        - 高
        - 将行政辅助与不利决策分开，并保留可审计的人工批准。
        - 中高，因为工作流邻近性很强。
        - 审查实际产品使用场景、审计日志和客户合同中的决策权语言。
      - - 隐私 / HIPAA / BAA / 数据权利治理
        - 指定的公开来源展示了处方跟踪和患者更新工作流，但没有披露 BAA、留存、去标识化或生物制药数据权利控制。
        - 指定公开证据尚未解决。
        - 中
        - 高
        - 在投资判断前提供安全、隐私和数据权利文件。
        - 在审阅治理材料前保持高位。
        - 获取 SOC 2 或同等控制、BAA / DPA 样本条款、事件历史和数据权利清单。
    notes: 各行按指定来源集的严重性排序；第三行是尽调缺口，不是违规证明。
