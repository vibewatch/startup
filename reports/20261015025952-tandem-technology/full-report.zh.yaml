            body: >-
              指定证据中最清晰的模式是：Forus 嵌入提供者工作流，却在别处变现。官方产品文案把医生、诊所员工和患者放在工作流中心：医生在 EHR
              中开方，平台生成事前授权文书，工作人员可以追踪每张处方，患者收到状态更新。Forbes 和 Mindstream
              都强调提供者和患者无需付费；商业化似乎来自与上市支持和药物获取相关的生物制药关系。因此，开方诊所和卫生系统是运营用户，患者是最终受益人，生物制药公司最可能是付费交易对手。仍缺少的是客户结构：指定样本没有按专科、提供者规模、支付方组合或药品类别拆分采用情况，因此任何单一客户群对收入的权重仍不透明。
