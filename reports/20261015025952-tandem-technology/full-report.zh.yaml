        - 经核实的合作伙伴收入、留存和利润率披露会增强信心。
      - - 正方
        - 据报道，由 Accel 领投的融资轮次，以及 Thrive Capital 和 General Catalyst 的现有支持，表明投资人需求强劲。
        - 主要融资文件或管理层确认会让估值背景更具投资判断依据。
      - - 反方
        - 产品对提供方和患者免费，因此要为当前价格作投资判断，依赖于指定证据中仅有间接描述的经济模型。
