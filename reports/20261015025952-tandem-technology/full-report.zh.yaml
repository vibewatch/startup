            body: |-
              2026 年 1 月报道将公司描述为以约 $1 billion 估值融资 $100 million，
              之后的 2026 年报道引用累计融资 $160 million。这说明公司能接触资本、投资人也有兴趣，
              而非明显承受融资压力。但它不能证明手头现金、烧钱速度、债务义务，或扩张成本之后还剩多少续航。
              因此，本章的主要承保阻碍不是外部融资渠道，而是利润结构、集中度和现金使用缺乏公开披露。
              次要尽调风险来自归属：公司曾以 Tandem 运营、现称 Forus，若不把每个数字对应回 Forus/Tandem 发行主体，
