  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流范围与产品界面
        blocks:
          - type: paragraph
            body: >-
              Forus
              被定位为上游药物获取层，而非只处理某一个拒绝步骤的点状工具。审阅过的官方和第三方材料一致描述了一条工作流：提供者开具处方后，系统从同一份病例记录生成事前授权材料、核验福利、提供负担能力支持、路由到药房，并与患者沟通。范围之广使产品比狭窄的
              PA 表单填充器更有价值，但也意味着公司依赖 EHR、支付方、药房和患者服务界面之间可靠交接。公开材料支持这些模块存在，却没有说明按支付方、EHR 或治疗领域划分的覆盖深度。
