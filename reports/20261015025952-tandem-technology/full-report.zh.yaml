        title: 扩张逻辑合理，但耐久性与集中度仍披露不足
        blocks:
          - type: paragraph
            body: >-
              扩张论点很直接：提供者工作流采用形成分销层，生物制药公司可借此改善上市准备和患者获取，这也解释了为何多家来源称全球顶级药企已经成为合作伙伴。这在战略上有吸引力，但也带来集中度问题，因为指定样本没有公开
              NRR、GRR、logo 流失、合同期限或头部客户占比。外部市场背景支持这一论点，但并不意味着摩擦消失。KFF 调查显示，事前授权是受保成年人的重要负担；AJMC 和 Chief Healthcare
              Executive 引用的 CAQH 数据显示，2024 年仅 40% 的事前授权交易实现电子化。斯坦福研究人员还警告，保险授权中的 AI 若监督不足，可能造成错误拒绝。综合来看，品类痛点真实存在，但 Forus
              依赖的生态仍高度人工化，随着 AI 工具扩散，也可能面临更严格的治理审查。
