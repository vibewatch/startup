      - number: '3.3'
        title: 耐久性更取决于分销深度与可靠性，而非可见的硬锁定
        blocks:
          - type: paragraph
            body: >-
              指定证据中的护城河论点是：Forus
              嵌入医生、药房、支付方和生物制药公司的处方获取工作流，规模越大，积累的流程知识和上市分销价值越高。相同证据也指向主要风险：买方仍可在内部运营、既有支付方和药房连接，以及故障时尤其显眼的既有基础设施之间比较。AMA
              的 Change Healthcare
              调查数据有参考意义，因为它显示医生运营对理赔、资格核验、汇款和支付通道的依赖程度；依赖这些通道的厂商可能在买方寻找替代方案时受益，但也会继承可靠性审查和应急预期。公开资料没有续约、多重供应商使用或输赢证据，因此耐久性虽合理，却尚未得到外部验证。
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 证据最充分的优势
            body: 最强的公开差异化不是抽象的“AI”，而是对提供者免费的一体化工作流：把事前授权、负担能力和药房路由工作，与生物制药出资的分销支持结合起来。
            calloutType: strength
            claimRefs:
              - CP002
              - CP004
              - CP005
          - type: callout
            title: 难以证明的护城河
            body: 证据没有提供公开合同经济、续约数据或点名的正面对战胜率，因此护城河主张更多依赖管理层叙事和工作流逻辑，而非外部证明的锁定效应。
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现依赖合作伙伴合同，而非可见的终端用户定价
        blocks:
          - type: paragraph
            body: |-
              留存来源一致将 Forus/Tandem 描述为对两类最明显的用户免费：
              提供者和患者。商业逻辑转而依靠生物制药关系，由其付费加速
              处方获取、上市支持及相关商业化工作流。
              这能让采用快速增长，因为终端用户几乎没有价格阻力；但也意味着，
              公开使用广度不会自动说明收入质量。若经济关系藏在未公开的赞助协议中，
              大量安装基础仍可能掩盖合作伙伴集中度、合同时点或每张处方的实际收入偏低。
