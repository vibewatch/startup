    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 合作伙伴变现变得可见，患者量增长至数百万，且工作流所有权创造出可防御的网络效应。
        - 只有当披露的收入质量和增长足以让估值相对公开工作流可比公司享有溢价时，所报告的 $1B 估值才站得住。
        - 生物制药需求无法转化为持久的经济收益。
        - 可能发生，但指定证据尚未记录。
      - - 基准
        - Tandem 继续增长并保持战略相关性，但短期内经济模型、集中度和治理披露仍不完整。
        - 最佳做法是跟踪或进一步尽调，而不是把当前头条价格当作已充分作出投资判断的价格来支付。
        - 后续轮次的估值可能横盘，等待基本面追上来。
        - 与当前证据集合最为一致。
      - - 悲观情景
        - 商业化仍然间接、运营指标不及预期，或融资环境转弱压低 AI 工作流的估值倍数。
        - 后续轮次或二级市场定价会把价格重置到远低于已报道的估值。
        - 如果验证点迟迟到位，下轮融资风险和优先权悬置都会上升。
        - 如果管理层无法开放数据室，下行空间将十分显著。
    notes: 由于分配到的资料池没有提供 Tandem 的收入、利润率、留存率或股权表经济数据，情景逻辑仅用于指示方向。
