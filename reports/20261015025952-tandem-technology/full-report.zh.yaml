              公开商业牵引力信号方向明确。Forbes 报道收入年化超过 $50 million，
              公司及相关报道则称已有数千家诊所、覆盖全国，生物制药参与度不断上升。
              这些数据说明吞吐量和商业需求都不小，官网客户证言也展示了可信的诊所工作流节省。
              但证据仍不足以支撑可用于投资判断的单位经济图景：留存来源均未披露毛利率、
