      - number: '3.2'
        title: 差异化依靠工作流范围、提供者免费定价与渠道协同
        blocks:
          - type: paragraph
            body: >-
              证据中最站得住脚的差异化来自商业模式和工作流宽度，而不是某个已披露的独有算法。Forus
              将自己定位为对医生和患者免费、通过生物制药关系变现；独立报道也称公司依靠合作伙伴而非用户费用。相比必须向诊所销售软件席位的厂商，这降低了采用门槛，同时让 Forus 与药企的上市执行对齐。相比之下，Tandem
              Health
              已披露的重点是欧洲的临床笔记和更广义临床工作流，因此在这组证据里更适合看作相邻工作流平台，而非已被证明的美国处方获取同类产品。公开定价、折扣和合同结构大多未披露，所以矩阵对模式和范围的比较，比对经济条款的比较更有把握。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
