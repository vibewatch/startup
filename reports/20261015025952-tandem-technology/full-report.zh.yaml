          summary: Denied or expiring cases move into follow-up, appeal, and renewal work.
          modules:
            - 生成申诉材料
            - 跟进支付方
            - 跟踪续期
          outputs:
            - 升级或更新后的案件
        - label: 履约和费用可负担性路由
          summary: Approved cases are routed to the right pharmacy and support pathway.
          modules:
            - 协调药房
            - 导航共付额和财务援助
          outputs:
            - 配药和费用可负担性路径
        - label: 患者和诊所可视性
          summary: Patients and office staff receive status updates while the case remains auditable.
          modules:
            - 患者状态沟通
            - 员工可视性仪表板
          outputs:
            - 共享状态和后续行动
    approximationNotes: 该图只反映已审阅公开来源中明确可见的层，不代表支付方、EHR 或安全系统已实现完整覆盖。
    claimRefs:
      - CE001
      - CE004
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 产品嵌在医疗服务方工作流中，变现似乎来自叠加在同一可及性网络上的生物制药关系。
    data:
      items:
        - label: 在 EHR 中开具处方
          actor: 医生
          stage: 临床决策
          touchpoints:
            - 在常规 EHR 工作流中开具处方
            - 可及性工作流启动时，Forus 接收订单
          note: 官方产品文案将旅程中心放在开方临床医生，而不是独立门户。
        - label: 事前授权和文书自动化
          actor: 诊所员工
          stage: 可及性启动
          touchpoints:
            - 自动生成并提交事前授权表
            - 跟踪异常，不再为每个案件打电话处理
          note: 这是对医疗服务方的核心价值主张，也是资料池中最有力的运营采用证据。
        - label: 实时处方跟踪
          actor: 医生和员工
          stage: 工作流管理
          touchpoints:
            - 实时跟踪每张处方
            - 工作流卡住时介入
          note: 官方文案强调可视性，而非纯粹的一次性自动化。
        - label: 患者费用可负担性和状态更新
          actor: 患者
          stage: 可及性完成
          touchpoints:
            - 接收授权和履约进展更新
            - 获得费用可负担性支持并了解下一步
          note: 患者是工作流的受益者，但公开来源没有显示他们是付费客户。
        - label: 药房和支付方协调
          actor: 药房和支付方生态
          stage: 履约路由
          touchpoints:
            - 将处方路由至合适的药房
            - 取药前解决支付方和库存约束
          note: 外部来源暗示全国连接能力，但没有披露公开 SLA 或周转队列。
        - label: 生物制药上市和数据闭环
          actor: 生物制药合作方
          stage: 扩张 / 变现
          touchpoints:
            - 利用网络支持上市和治疗方案采用
            - 将可及性情报反馈到商业化规划
          note: 这似乎是带来收入的扩张闭环，也最可能带来集中度风险。
    claimRefs:
      - CU001
      - CU003
      - CU009
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最尖锐的风险集中在监管、变现依赖和治理缺口，而不是产品本身是否有用。
    data:
      columns:
        - label: 可能性
          note: 未来 12-18 个月内的近期概率。
        - label: 影响
          note: 对投资判断或下行保护的潜在影响。
        - label: 缓解成熟度
          note: 分配到的公开证据中能看到多少缓解措施。
        - label: 剩余暴露
          note: 采取可能的缓解措施后预期剩余的暴露。
      rows:
        - label: AI 事前授权监管
          note: 受 2026 年州级行动和与 CMS 对齐的护栏驱动。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 低
              tone: risk
              detail: 公开证据尚未显示详细的控制设计。
            - label: 高
              tone: critical
        - label: 用户免费的变现模式
          note: 经济价值捕获似乎依赖非用户交易对手方。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 低
              tone: risk
              detail: 分配资料池中没有披露交易对手方多元化情况。
            - label: 高
              tone: high
        - label: 工作流可靠性
          note: 产品正常运行时，医疗服务方似乎能立即感受到时间节省。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: Unknown
              tone: warning
              detail: 分配证据中没有正常运行时间或事故历史。
            - label: 高
              tone: high
        - label: 安全 / 数据权利治理
          note: 邻近 PHI 的工作流，公开治理披露不完整。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: critical
            - label: Unknown
              tone: warning
              detail: 需要 BAA、隐私和事故材料。
            - label: 高
              tone: high
        - label: 融资可见性
          note: 被宣传的轮次尚未公开宣布，公开证据质量也较薄弱。
          values:
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 低
              tone: risk
              detail: 分配资料池中没有披露已签署条款、现金续航或董事会权利。
            - label: 中高
              tone: warning
        - label: 品牌歧义
          note: 多家医疗保健公司已经使用 Tandem 品牌。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: warning
            - label: 低
              tone: risk
              detail: 公开证据没有显示明显的缓解策略。
            - label: 中
              tone: warning
    approximationNotes: 这是根据保留证据和可见披露缺口得出的定性热力图，不是概率模型。
    claimRefs:
      - CR003
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐取决于一款真正的工作流产品能否证明足够的变现能力和披露程度，从而支撑已报道的私人市场估值。
    data:
      nodes:
        - id: pain
          label: 真实的工作流痛点
          summary: Prescription access still involves manual prior authorization and pharmacy routing work.
          claimRefs:
            - CV003
        - id: product
          label: 免费产品的采用切入口
          summary: Forus says the service is free to providers and patients.
          claimRefs:
            - CV004
        - id: round
          label: 强融资信号
          summary: Independent reporting points to a $100M round at a $1B valuation.
          claimRefs:
            - CV001
            - CV002
        - id: monetization
          label: 变现仍然间接
          summary: Public evidence describes partnerships more clearly than disclosed revenue or margins.
          claimRefs:
            - CV005
            - CV012
            - CV013
        - id: comp
          label: 公开同业已披露规模
          summary: Waystar trades on visible revenue and EV/revenue metrics that Tandem has not disclosed.
          claimRefs:
            - CV009
            - CV010
            - CV014
        - id: call
          label: 继续研究 / 估值偏高
          summary: The right next step is targeted diligence before treating the reported $1B mark as fully underwritten.
          claimRefs:
            - CV015
      edges:
        - from: Real workflow pain
          to: Free product adoption wedge
          label: 提升用例可信度
          claimRefs:
            - CV003
            - CV004
        - from: Free product adoption wedge
          to: Strong financing signal
          label: 支撑投资者叙事
          claimRefs:
            - CV001
            - CV004
        - from: Strong financing signal
          to: Monetization remains indirect
          label: 提高价格敏感度
          claimRefs:
            - CV001
            - CV005
            - CV012
        - from: Monetization remains indirect
          to: Public comp has disclosed scale
          label: 削弱同业估值判断
          claimRefs:
            - CV010
            - CV012
            - CV014
        - from: Public comp has disclosed scale
          to: Research-more / stretched
          label: 划定决策边界
          claimRefs:
            - CV014
            - CV015
    approximationNotes: 该顺序是分析性的而非因果性的，仅反映分配到的公开证据资料池。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV012
      - CV014
      - CV015
