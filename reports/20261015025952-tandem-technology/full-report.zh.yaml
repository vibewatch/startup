            body: >-
              如果尽调出现三类情况，投资论点应迅速失效：第一，证据显示 Tandem 的工作流被用于事前授权或理赔中的实质性无监督 AI
              决策；第二，合作伙伴经济过度集中，单一交易对手就能重置收入模式；第三，公司无法按处方获取基础设施应有的标准，证明
