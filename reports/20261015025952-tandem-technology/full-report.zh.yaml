            body: >-
              最强的硬风险是医疗工作流中的监管规则逐渐转向人工审查、披露和禁止纯 AI 决策，且这些工作流与事前授权、理赔和面向患者的自动化重叠。Holland & Knight 和 Manatt 都描述了 2026
              年各州法律：禁止完全由 AI 驱动的不利决定，或要求明确监督和披露。Tandem 的产品定位在这里很关键：公司称会追踪处方、从 EHR
              提交事前授权表格并持续更新患者；因此，若从工作流自动化扩展到决策，或理赔相关活动监督不足，就可能进入更严格的合规边界。没有指定来源确认 Tandem
              已遭受执法，但来源集也没有为安全、BAA、数据权利或事件响应尽调作出排除。
