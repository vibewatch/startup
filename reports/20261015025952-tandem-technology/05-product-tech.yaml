      - ["Assemble clinical support for payer review", "Documentation is fragmented across notes, forms, and coverage criteria", "Platform assembles clinical documents and draft submissions or appeals", "Company framing suggests less manual paperwork per case", "No public evidence on document accuracy, clinician attestation, or rejection rate by payer"]
      - ["Route the script to the right dispensing and support channel", "Pharmacy restrictions and affordability programs slow time to therapy", "Forus combines benefit verification, enrollment forms, and pharmacy coordination", "Third-party sources describe routing plus affordability in one workflow", "No public visibility into pharmacy network breadth or failure-handling"]
      - ["Keep staff and patients informed through access resolution", "Status calls and patient uncertainty consume office time", "Platform exposes case status and proactive patient updates", "Homepage testimonial says office phone time fell from 60-70% of the day to about 15%", "Outcome is company-reported and not independently audited"]
    notes: "Benefits are limited to what reviewed sources explicitly state; company-reported outcomes are not treated as independently verified operating metrics."
    claimRefs: [CE001, CE004, CE008, CE009]
  - id: TE003
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Key dependency"
      - "Risk / diligence note"
    rows:
      - ["Prescription-event intake", "Receives the prescription in the provider workflow and opens the access case", "EHR placement and data capture", "Named integration coverage and implementation effort are not disclosed publicly"]
      - ["Coverage and PA orchestration", "Builds submissions, checks benefits, and tracks authorization status", "Payer rules, clinical data availability, and workflow logic", "Public sources do not show payer coverage depth, approval-rate performance, or human-review controls"]
      - ["Appeals and renewal management", "Handles denials, follow-up, and recurring authorization work", "Operational playbooks plus clinician review", "No public evidence on exception handling, peer-to-peer prep, or escalation SLAs"]
      - ["Pharmacy and affordability routing", "Steers prescriptions to pharmacies and support programs", "Partner pharmacies, assistance-program logic, and inventory visibility", "Routing logic and partner governance are described conceptually, not operationally"]
      - ["Patient communication and status visibility", "Keeps patients and staff updated across the access journey", "Case-state accuracy and messaging workflows", "No public trust-center, audit-log, or channel-governance detail surfaced in reviewed sources"]
    notes: "This is a publicly evidenced operating model, not a source-code or systems diagram; rows show the workflow layers the sources make visible and call out where implementation proof is missing."
    claimRefs: [CE001, CE002, CE004, CE007, CE010, CE011]
