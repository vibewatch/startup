    title: "Product architecture map"
    type: "stack"
    summary: "Public evidence supports a six-layer workflow stack from EHR-triggered intake through compliance-constrained patient access operations."
    data:
      layers:
        - label: "Prescriber trigger"
          summary: "Prescription starts inside the provider's normal ordering workflow."
          modules:
            - "EHR-native order capture"
            - "Real-time prescription tracking"
          outputs:
            - "Structured access case"
        - label: "Coverage qualification"
          summary: "Benefits and program enrollment determine the reimbursement path before downstream routing."
          modules:
            - "Benefit verification"
            - "Access-program enrollment forms"
          outputs:
            - "Coverage path and missing-data checklist"
        - label: "Prior authorization engine"
          summary: "Forms and supporting clinical documentation are assembled for payer review."
          modules:
            - "PA submission"
            - "Clinical-document assembly"
          outputs:
            - "Initial authorization package"
        - label: "Exceptions and renewals"
          summary: "Denied or expiring cases move into follow-up, appeal, and renewal work."
          modules:
            - "Appeal generation"
            - "Payer follow-up"
            - "Renewal tracking"
          outputs:
            - "Escalated or refreshed case"
        - label: "Fulfillment and affordability routing"
          summary: "Approved cases are routed to the right pharmacy and support pathway."
          modules:
            - "Pharmacy coordination"
            - "Copay and financial-assistance navigation"
          outputs:
            - "Dispensing and affordability path"
        - label: "Patient and clinic visibility"
          summary: "Patients and office staff receive status updates while the case remains auditable."
          modules:
            - "Patient status communications"
            - "Staff visibility dashboard"
          outputs:
            - "Shared status and follow-up actions"
    approximationNotes: "Map reflects only layers explicitly visible in reviewed public sources; it does not imply complete payer, EHR, or security-system coverage."
    claimRefs: [CE001, CE004, CE007, CE010, CE011]
callouts:
  - calloutType: "strength"
    title: "Workflow breadth is the core product advantage"
    body: >-
      The strongest public evidence is not a novel algorithm but the breadth of
      tasks Forus wraps around one prescription event, from EHR-triggered intake
      through prior authorization, pharmacy routing, affordability support, and
      patient updates.
    claimRefs: [CE001, CE002, CE007]
  - calloutType: "risk"
    title: "Compliance and auditability are the key technical risks"
    body: >-
      As AI-healthcare rules tighten, Forus will need defensible human-review,
      data-rights, and workflow-audit controls; the reviewed public sources do
      not yet prove those controls in a detailed or independently audited way.
    claimRefs: [CE010, CE011, CE014]
  - calloutType: "assumption"
    title: "Public maturity signals are real but still partly company-shaped"
    body: >-
      Adoption claims and workflow benefits are directionally encouraging, but
      much of the maturity evidence still comes from company-reported statistics
      or curated profiles rather than named technical references and audited
      implementation outcomes.
    claimRefs: [CE005, CE008, CE009]
