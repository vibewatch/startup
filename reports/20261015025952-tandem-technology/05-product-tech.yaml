company:
  name: "Tandem Technology"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Forus, formerly Tandem, presents a broad medication-access workflow product
    that starts in the prescriber's EHR and extends through prior authorization,
    pharmacy routing, affordability support, and patient updates. Third-party
    reporting and company-cited adoption signals suggest real market traction,
    but public technical proof remains thinner than the workflow narrative:
    reviewed sources do not verify live payer/EHR coverage, security controls,
    or the detailed scope of announced integrations.
sections:
  - id: workflow-scope
    title: "Workflow scope and product surface"
    body: >-
      Forus is positioned as an upstream medication-access layer rather than a
      point solution for a single denial step. The reviewed official and
      third-party materials consistently describe a workflow that begins when a
      provider writes a prescription, then handles prior-authorization package
      creation, benefits checks, affordability support, pharmacy routing, and
      patient communication from the same case record. That breadth matters
      because it makes the product more valuable than a narrow PA form-filler,
      but it also means the company depends on reliable handoffs across EHR,
      payer, pharmacy, and patient-service surfaces. Public materials support
      the existence of those modules, but not the exact coverage depth by payer,
      EHR, or therapy area.
    claimRefs: [CE001, CE002, CE003, CE004, CE007]
    tableRefs: [TE001, TE002]
  - id: architecture-and-deployment
    title: "Operating model, architecture, and deployment maturity"
    body: >-
      The product is best understood as an orchestration stack around one
      prescription event. Official copy shows the prescriber staying inside the
      normal EHR workflow while Forus generates prior-authorization forms,
      tracks status, and keeps both staff and patients updated; independent
      coverage adds benefit verification, appeals, renewal tracking, and
      affordability enrollment. That implies a multi-surface operating model
      spanning intake, rules or workflow automation, documentation assembly,
      routing, and communications. Deployment maturity is directionally better
      than a pre-revenue prototype because public reporting cites thousands of
      practices and health systems plus nationwide reach, but the reviewed
      sources stop short of verifying live integration breadth, uptime, or
      exception-handling performance.
    claimRefs: [CE001, CE002, CE004, CE005, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-commercial-fit
    title: "Differentiation and commercial fit"
    body: >-
      The clearest differentiation is scope at the point of prescribing. Rx
      Almanac explicitly contrasts Forus with PA-only tools by emphasizing
      pharmacy coordination, affordability navigation, and patient-status
      communication alongside core authorization work, while Forbes frames the
      company's role as solving the administrative backend of scripts without
      changing the clinician's medical decision. That combination fits a
      business model where providers and patients pay nothing and biopharma
      partnerships fund the network, which can accelerate adoption but also
      makes governance, reporting rights, and manufacturer-specific controls a
      product requirement rather than a legal footnote. Founder experience from
      Oscar strengthens the workflow logic, but it is not a substitute for
      disclosed integration metrics or audited outcome data.
    claimRefs: [CE003, CE005, CE006, CE008, CE009, CE014]
  - id: trust-compliance-and-proof-gaps
    title: "Trust, compliance, and public-proof gaps"
    body: >-
      Product risk is less about whether Forus automates access tasks and more
      about whether its AI-assisted workflow can be trusted, audited, and
      integrated at scale. A 2026 Holland & Knight review shows that states are
      tightening rules around AI use in prior authorization and clinical
      workflows, including patient-specific review, disclosure, and licensed
      human oversight. Against that backdrop, the reviewed product evidence is
      notably incomplete on security posture, BAA or de-identification
      practices, live payer and EHR coverage, and the technical scope of partner
      integrations. One assigned OpenEvidence URL did not preserve the actual
      partnership body in retrieved text, and former Tandem-name searches still
      collide with unrelated healthcare-AI vendors, so deeper diligence should
      rely on first-party technical documentation and named customer
      implementations rather than superficial search hits.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
