company:
  name: Tandem Technology
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a price-sensitive research-more call rather than a buy at
    the reported $1 billion private valuation. Tandem appears to solve a real prior
    authorization workflow pain point, but the assigned evidence still lacks disclosed
    revenue, margin, concentration, and cap-table detail needed to underwrite that mark
    against public or private comparables.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The assigned evidence supports a research-more recommendation with medium
      confidence and a high risk rating at the reported $1 billion mark. Independent
      coverage says Tandem is raising $100 million at that valuation, while the company
      website and independent reporting both describe a product that is free to
      providers and patients and automates prior authorizations and pharmacy routing.
      That combination shows clear workflow relevance, but it also means the current
      price must be justified by monetization evidence outside a simple seat-pricing
      model. Because the pool does not disclose current revenue, gross margin, burn, or
      retention, public evidence can support interest in the company but not conviction
      on the reported entry price.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV012
      - CV013
      - CV015
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: valuation-context-and-comparables
    title: Valuation context and comparable references
    body: >-
      The financing context is real enough to matter but still thin for underwriting.
      Bloomberg-derived coverage repeated by FirstWord, Crain's New York Business, and
      Mindstream all point to a $100 million round at a $1 billion valuation, with
      Accel leading and Thrive Capital plus General Catalyst already on the cap table.
      A lower-confidence MapCo profile also lists Tandem at a $100 million valuation,
      which conflicts with the 2026 round reporting and reinforces that the public mark
      is not yet fully documented in primary materials. For directional public-market
      context, Yahoo Finance shows Waystar at roughly $6.04 billion enterprise value,
      5.01x EV/revenue, and $1.21 billion trailing revenue as of September 2026, while
      Waystar's own site confirms it serves adjacent prior-authorization and revenue
      cycle workflows at national scale. That makes Waystar a useful but imperfect
      benchmark: the public comp has disclosed scale and profitability signals that
      Tandem has not yet provided in the assigned evidence.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV008
      - CV009
      - CV010
      - CV014
    tableRefs:
      - TV002
  - id: scenarios-and-diligence-asks
    title: Scenarios, downside triggers, and diligence asks
    body: >-
      The bull case is that Tandem turns a free workflow product into a high-leverage
      network for biopharma and prescription-access partnerships, with the current round
      funding adoption before monetization becomes fully visible. The base case is that
      the company has strategic value but still needs to prove partner economics, gross
      margin quality, customer concentration, and preference-stack discipline before the
      current price is investable. The bear case is that commercialization stays
      indirect, the billion-dollar mark proves momentum-driven rather than metrics-led,
      and any later financing resets the entry price. A separate adjacent workflow-AI
      company, Tandem Health, disclosed a $50 million Series A in 2025, which is not a
      valuation comp by itself but does show that strong workflow-AI funding exists well
      below Tandem's reported private mark. The practical next step is not a generic
      pass or pursue decision; it is a targeted diligence package on revenue, margins,
      concentration, and preference terms before treating the current headline valuation
      as underwritten.
    claimRefs:
      - CV005
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
    tableRefs:
      - TV003
