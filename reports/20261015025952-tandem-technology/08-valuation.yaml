    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Tandem addresses a documented prescription-access workflow pain point with automation that providers can adopt without direct user fees.", "Verified partner revenue, retention, and margin disclosure would strengthen conviction."]
      - [Thesis, "The reported Accel-led round and existing backing from Thrive Capital and General Catalyst suggest strong investor demand.", "Primary financing documents or management confirmation would make the valuation context more bankable."]
      - [Anti-thesis, "The product is free to providers and patients, so underwriting the current price depends on economics that are only indirectly described in the assigned evidence.", "Disclosed revenue mix, gross margin, and customer concentration could rebut this concern."]
      - [Anti-thesis, "A low-confidence third-party profile still showing a far lower valuation underlines how incomplete the public price record remains.", "A signed term-sheet summary, cap-table excerpt, or audited board-approved valuation memo would resolve the ambiguity."]
    notes: This table mixes company-issued, independent, and low-confidence reference points; readers should treat it as underwriting logic rather than audited fact.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV008
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Partnership monetization becomes visible, patient volume scales into the millions, and workflow ownership creates defensible network effects.", "The reported $1B mark can work only if disclosed revenue quality and growth justify a premium to public workflow comps.", "Biopharma demand fails to convert into durable economics.", "Possible, but not yet documented in the assigned evidence."]
      - [Base, "Tandem keeps growing and remains strategically relevant, but economics, concentration, and governance disclosure stay incomplete in the near term.", "Best action is to track or diligence further rather than pay the current headline price as fully underwritten.", "Later rounds could keep valuation flat while fundamentals catch up.", "Most consistent with the current evidence set."]
      - [Bear, "Commercialization stays indirect, operating metrics disappoint, or a weaker financing environment compresses AI workflow multiples.", "A later round or secondary mark resets price well below the reported headline valuation.", "Down-round risk and preference overhang rise if proof points arrive late.", "Material downside if management cannot open the data room."]
    notes: Scenario logic is directional because the assigned pool does not provide Tandem revenue, margin, retention, or cap-table economics.
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
