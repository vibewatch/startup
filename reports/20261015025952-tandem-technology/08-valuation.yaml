  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Current revenue, gross margin, retention, burn, and runway disclosures for the current financing round.
      whyItMatters: Without operating metrics, the reported $1 billion mark cannot be tested against public software or workflow benchmarks.
      diligencePath: Request the current board deck or data room with revenue bridge, gross margin, cash burn, and cohort retention metrics.
      relatedQuestionRefs:
        - QV003
        - QV008
    - type: missing-source
      severity: material
      topic: cap-table
      missingEvidence: Preference stack, liquidation terms, investor rights, and any structured terms attached to the current round.
      whyItMatters: Entry discipline depends on more than headline valuation because preferences can reshape realized downside and upside.
      diligencePath: Obtain the draft term sheet or cap-table summary covering preferred terms, participation, and anti-dilution protections.
      relatedQuestionRefs:
        - QV008
    - type: conflicting-data
      severity: material
      topic: valuation-record
      missingEvidence: A primary company or investor document confirming the round price and post-money basis.
      whyItMatters: Public reporting and a low-confidence third-party profile point to inconsistent valuation breadcrumbs.
      diligencePath: Reconcile the current round with signed financing documents, investor confirmation, or an audited valuation memo.
      relatedQuestionRefs:
        - QV001
        - QV007
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Customer, partner, and biopharma concentration disclosure for the revenue model behind the free product.
      whyItMatters: A concentrated partner-led model can amplify downside risk even if top-line adoption looks strong.
      diligencePath: Ask management for customer and partner concentration tables plus contract renewal and take-rate detail.
      relatedQuestionRefs:
        - QV008
