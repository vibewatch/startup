              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR009
              - CR013
      - number: '7.4'
        title: Kill criteria, monitoring, and next diligence steps
        blocks:
          - type: paragraph
            body: >-
              The thesis should break quickly if any of three conditions show up in diligence: first, evidence that
              Tandem's workflow is being used for materially unsupervised AI decisioning in prior authorization or
              claims; second, evidence that partner economics are concentrated enough that one counterparty can reset
              the revenue model; third, evidence that the company cannot document HIPAA, BAA, data-rights, and
              incident-governance controls to the level expected for prescription-access infrastructure. Short of a hard
              break, investors should monitor whether the company can convert a free-to-user wedge into diversified
              monetization without sacrificing provider trust, and whether the heavily promoted 2026 financing narrative
              resolves into disclosed terms, disciplined burn, and credible residual upside from the reported price.
            claimRefs:
              - CR004
              - CR007
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting kill criteria
            body: >-
              Treat the thesis as broken if diligence shows materially unsupervised AI decisioning in prior
              authorization, partner concentration that effectively turns one counterparty into the revenue model, or an
              inability to produce enterprise-grade HIPAA, BAA, and incident-governance materials for a
              prescription-access workflow.
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a research-more recommendation with medium confidence and a high risk
              rating at the reported $1 billion mark. Independent coverage says Tandem is raising $100 million at that
              valuation, while the company website and independent reporting both describe a product that is free to
              providers and patients and automates prior authorizations and pharmacy routing. That combination shows
              clear workflow relevance, but it also means the current price must be justified by monetization evidence
              outside a simple seat-pricing model. Because the pool does not disclose current revenue, gross margin,
              burn, or retention, public evidence can support interest in the company but not conviction on the reported
              entry price.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV013
              - CV015
