              - CP004
              - CP005
          - type: callout
            title: Hard-to-prove moat
            body: >-
              The evidence does not provide public contract economics, renewal data, or named head-to-head win rates, so
              moat claims rely more on management narrative and workflow logic than on externally demonstrated lock-in.
