  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacency
        blocks:
          - type: paragraph
            body: >-
              Tandem's retained evidence points to a medication-access workflow market, not a catch-all clinical AI
              category. The Forus site says the product automates the steps from prescription to affordable access,
              including prior authorization submission, prescription tracking, and patient updates, while Forbes says
              the system handles the administrative backend after a physician writes a script and helps determine
              pharmacy routing and affordability support. That places the core market after clinical decision-making but
              before successful fulfillment. The nearest adjacency is broader clinical-workflow automation: Tandem
              Health's European press release describes an "AI-native operating system" for documentation, coding, care
              coordination, and decision support, which shows adjacent healthcare AI budgets exist but should be
              excluded from Tandem Technology's core market boundary unless the company expands beyond medication
              access.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM013
              - CM016
      - number: '2.2'
        title: Sizing lenses and growth drivers
        blocks:
          - type: paragraph
            body: >-
              The strongest public sizing evidence is indirect but still economically meaningful. Forbes, citing an
              American Society of Health-System Pharmacists report, says prescription drug spending should surpass $1
              trillion in 2026 and that more than $300 billion of therapies still do not reach patients, which frames
              the size of the medication-access problem rather than Tandem's software revenue opportunity. HHS adds a
              public-payer slice by saying Medicaid prescription-drug spending exceeded $100 billion gross and $60
              billion after rebates in 2024, with a 2026 pilot meant to create more uniform coverage criteria. At the
              same time, independent reporting says standards bodies are working on common prior-authorization APIs,
              which could reduce integration friction and make software infrastructure more reusable. These drivers help
              the market narrative, but they do not substitute for a disclosed SAM or contractable budget pool.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
