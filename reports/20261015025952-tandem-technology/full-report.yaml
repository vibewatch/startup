  - id: FM001
    title: Evidence-constrained market lens
    type: pyramid
    summary: >-
      Separate layers move from broad prescription economics toward Tandem's reachable workflow while marking what
      should stay outside the core market.
    data:
      items:
        - label: Broad U.S. prescription spend
          value: $1T+
          detail: Forbes cited an ASHP expectation that prescription drug spending will surpass $1 trillion in 2026.
          note: Macro therapy-spend lens; not Tandem revenue TAM.
        - label: Access leakage in therapies
          value: $300B+
          detail: Forbes said more than $300 billion worth of therapies never get to patients.
          note: Problem-value lens rather than software budget.
        - label: Medicaid prescription spend
          value: $100B gross
          detail: HHS said Medicaid prescription-drug spending exceeded $100 billion in 2024 before rebates.
          note: Public-payer slice of the broader prescription market.
        - label: Excluded broader workflow AI
          value: Not counted
          detail: >-
            Tandem Health's adjacent category is a broader clinical-workflow operating system, not a medication-access
            workflow.
          note: Keep broader documentation and care-coordination budgets outside Tandem's core market.
        - label: Cost-related nonadherence
          value: 4 in 10 adults
          detail: >-
            Forbes cited a KFF poll saying about four in ten U.S. adults skipped prescribed use due to costs over the
            prior year.
          note: Demand constraint that workflow automation alone cannot eliminate.
        - label: Company scale target
          value: Millions of patients
          detail: TechFundingNews, Mindstream, and MapCo repeated Tandem's 2026 patient-reach ambition.
          note: Forward company target without independent deployment detail.
    approximationNotes: >-
      The layers are separate market lenses rather than a reconciled TAM/SAM/SOM stack because retained sources mix
      spend, leakage, public-payer, survey, and company-guidance units.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM012
      - CM013
      - CM015
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on assigned evidence suggests Forus combines the broadest prescription-access workflow
      scope with stronger external distribution leverage than manual or adjacent alternatives.
    data:
      xAxis:
        label: Workflow breadth in prescription-access job
        min: 1
        max: 5
        lowLabel: Narrow step coverage
        highLabel: Multi-party workflow coverage
        scale: Ordinal, evidence-backed scoring
      yAxis:
        label: Distribution leverage / installed reach
        min: 1
        max: 5
        lowLabel: Local or fragmented reach
        highLabel: National or platform-scale reach
        scale: Ordinal, evidence-backed scoring
      points:
        - label: Forus
          x: 5
          'y': 4
          tone: positive
          detail: >-
            Official and independent sources describe prior authorization, affordability, routing, national payer /
            pharmacy coverage, and biopharma partnerships.
        - label: Manual workflow
          x: 2
          'y': 2
          tone: risk
          detail: Present in most practices but dependent on staff calls, faxes, and forms rather than coordinated software.
        - label: Change Healthcare rails
          x: 3
          'y': 5
          tone: warning
          detail: >-
            Deep installed reimbursement reach is evidenced indirectly by outage impact, but assigned sources do not
            verify equivalent front-end prescription-access breadth.
        - label: Tandem Health
          x: 3
          'y': 3
          tone: neutral
          detail: >-
            Adjacent clinical-workflow AI with major European rollout, but not evidenced here as a U.S.
            prescription-access specialist.
        - label: Internal build
          x: 2
          'y': 1
          tone: risk
          detail: >-
            Custom fit is possible, but assigned evidence does not show internally built workflows matching claimed
            nationwide multi-party coverage.
        - label: Biopharma launch-service stack
          x: 4
          'y': 4
          tone: opportunity
          detail: >-
            Forus's partnership model implies this buyer budget and service layer matter, even though named public peer
            disclosures are sparse in the assigned pool.
    approximationNotes: >-
      Coordinates are ordinal synthesis from assigned source text, not measured market benchmarks or inferred conversion
      rates.
