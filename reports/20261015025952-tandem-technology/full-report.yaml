              - CU015
      - number: '6.3'
        title: Expansion logic is plausible, but durability and concentration remain underdisclosed
        blocks:
          - type: paragraph
            body: >-
              The expansion thesis is straightforward: provider workflow adoption generates a distribution layer that
              biopharma companies can use to improve launch readiness and patient access, which helps explain why
              multiple sources say top global drugmakers are already partners. That is strategically attractive, but it
              also raises concentration questions because the assigned pool provides no public NRR, GRR, logo churn,
              contract length, or top-customer-share disclosure. The external market context is supportive but not
              frictionless. KFF polling shows prior authorization is a major burden for insured adults, and CAQH
              coverage cited by AJMC and Chief Healthcare Executive shows only 40% of prior-authorization transactions
              were electronic in 2024. Stanford researchers also warn that AI use in insurance authorization can
              contribute to wrongful denials when oversight is weak. Together, that means the category pain is real, but
              the ecosystem Forus depends on is still operationally manual and likely to face governance scrutiny as AI
              tools spread.
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Current risk posture
        blocks:
          - type: paragraph
            body: >-
              The evidence set supports a risk posture that is more about governance and dependency than about near-term
              demand. Forus presents itself as an end-to-end prior-authorization and medication-access workflow that is
              free to providers and patients, while independent 2026 coverage says the company is pursuing a $100
              million round at a $1 billion valuation and expects to monetize through partnerships rather than user
              fees. That combination makes the underwriting question less about whether the workflow is useful and more
              about whether Tandem can keep regulators, providers, and counterparties aligned while proving durable
              economics. The heatmap below ranks the risks that appear most likely to affect investment outcomes under
              the assigned evidence set.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR009
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest hard risk is regulatory drift toward human-review, disclosure, and anti-sole-AI-decision
              rules in healthcare workflows that overlap with prior authorization, claims, and patient-facing
              automation. Holland & Knight and Manatt both describe 2026 state laws that prohibit solely AI-driven
              adverse determinations or require explicit oversight and disclosures. Tandem's product positioning matters
              here: the company says it tracks prescriptions, submits prior-authorization forms from the EHR, and keeps
              patients updated, so any expansion from workflow automation into decisioning or insufficiently supervised
              claims activity could move it into a tighter compliance perimeter. No assigned source confirms active
              enforcement against Tandem itself, but the source set also does not clear security, BAA, data-rights, or
              incident-response diligence.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Operational, partner, and evidence-quality risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, the platform sits in a brittle part of the care-access stack: one provider testimonial says
              staff time on the phone fell from 60-70% of the day to roughly 15% after adopting Forus, which implies
              uptime, integrations, and exception handling are mission-critical rather than cosmetic. The business model
              also appears partner-dependent. Public sources describe the service as free to providers and patients and
              say the model is expected to rely on partnerships, while management reportedly wants deeper biopharma
              relationships and millions of patients on platform. That raises concentration and bargaining-power risk if
              a small number of payers, pharma partners, or strategic channels become the real monetization engine.
              Finally, the evidence trail itself is noisy: one discovered 2026 funding source resolved to generic
              organizational boilerplate, and the name "Tandem" already belongs to other healthcare brands, increasing
              diligence noise and likely raising go-to-market ambiguity costs.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
