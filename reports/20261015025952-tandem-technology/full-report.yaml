      - number: '2.3'
        title: Buyer map, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Tandem's user, beneficiary, and economic buyer are not the same actor. Providers
              and patients appear to be the direct workflow users, and the product is repeatedly described as free to
              both sides, while Forbes says Tandem instead signs deals with pharmaceutical companies that want new
              therapies to reach eligible patients faster. That creates a two-sided adoption path: provider offices must
              trust the workflow because it removes paperwork and therapy delays, while pharma teams must see better
              launch execution and access conversion. The main constraint is that evidence quality still lags the
              ambition. TechFundingNews says the company has not disclosed live deployment or integration detail, and
              public sources do not isolate approval-rate gains, time-to-therapy deltas, or how much of the value
              leakage comes from issues workflow automation can actually solve rather than drug pricing itself.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM011
              - CM012
              - CM015
              - CM016
