  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base structure and who appears to pay
        blocks:
          - type: paragraph
            body: >-
              The clearest pattern in the assigned evidence is that Forus sits inside provider workflows but monetizes
              elsewhere. Official product copy frames the workflow around physicians, clinic staff, and patients: the
              doctor prescribes in the EHR, the platform generates prior-authorization paperwork, staff can track every
              prescription, and patients receive status updates. Forbes and Mindstream both reinforce that providers and
              patients do not pay to use the product; instead, commercialization appears to come from biopharma
              relationships tied to launch support and medication access. That makes prescribing practices and health
              systems the operational user base, patients the end beneficiary, and biopharma companies the most likely
              paying counterparty. What is still missing is the segment mix: no source in the assigned pool breaks
              adoption down by specialty, provider size, payer mix, or drug category, so the revenue weight of any
              single customer cohort is still opaque.
