        title: Exhibits
        blocks:
          - type: callout
            title: Best-supported advantage
            body: >-
              The strongest public differentiation is not "AI" in the abstract; it is a provider-free workflow that
              combines prior-authorization, affordability, and pharmacy-routing work with biopharma-funded distribution
              support.
            calloutType: strength
            claimRefs:
