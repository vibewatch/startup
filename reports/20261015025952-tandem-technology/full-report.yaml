chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and offer
        blocks:
          - type: paragraph
            body: >-
              The current official surface is Forus.com, but independent May 2026 coverage still links that operating
              brand back to Tandem, describing the company as New York-based Forus, formerly Tandem. The product
              positioning is consistent across official and third-party evidence: Forus is trying to remove
              administrative friction between the prescription and therapy start by automating prior authorization,
              affordability, and routing work inside existing clinical workflows. This chapter should therefore treat
              Forus as the live commercial brand and Tandem Technology as the underlying company identity. That
              distinction matters because generic "Tandem" searches can also surface an unrelated European healthcare AI
              company, so later chapters should anchor identity-sensitive facts to Forus-specific or clearly matched
              sources rather than to the bare Tandem name alone.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
