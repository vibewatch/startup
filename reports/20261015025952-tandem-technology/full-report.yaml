        title: Operating model, architecture, and deployment maturity
        blocks:
          - type: paragraph
            body: >-
              The product is best understood as an orchestration stack around one prescription event. Official copy
              shows the prescriber staying inside the normal EHR workflow while Forus generates prior-authorization
              forms, tracks status, and keeps both staff and patients updated; independent coverage adds benefit
              verification, appeals, renewal tracking, and affordability enrollment. That implies a multi-surface
              operating model spanning intake, rules or workflow automation, documentation assembly, routing, and
              communications. Deployment maturity is directionally better than a pre-revenue prototype because public
              reporting cites thousands of practices and health systems plus nationwide reach, but the reviewed sources
              stop short of verifying live integration breadth, uptime, or exception-handling performance.
