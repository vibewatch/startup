              - CV005
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
      - number: '8.2'
        title: Valuation context and comparable references
        blocks:
          - type: paragraph
            body: >-
              The financing context is real enough to matter but still thin for underwriting. Bloomberg-derived coverage
              repeated by FirstWord, Crain's New York Business, and Mindstream all point to a $100 million round at a $1
              billion valuation, with Accel leading and Thrive Capital plus General Catalyst already on the cap table. A
              lower-confidence MapCo profile also lists Tandem at a $100 million valuation, which conflicts with the
              2026 round reporting and reinforces that the public mark is not yet fully documented in primary materials.
              For directional public-market context, Yahoo Finance shows Waystar at roughly $6.04 billion enterprise
              value, 5.01x EV/revenue, and $1.21 billion trailing revenue as of September 2026, while Waystar's own site
              confirms it serves adjacent prior-authorization and revenue cycle workflows at national scale. That makes
              Waystar a useful but imperfect benchmark: the public comp has disclosed scale and profitability signals
              that Tandem has not yet provided in the assigned evidence.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV013
      - number: '8.3'
        title: Scenarios, downside triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Tandem turns a free workflow product into a high-leverage network for biopharma and
              prescription-access partnerships, with the current round funding adoption before monetization becomes
              fully visible. The base case is that the company has strategic value but still needs to prove partner
              economics, gross margin quality, customer concentration, and preference-stack discipline before the
              current price is investable. The bear case is that commercialization stays indirect, the billion-dollar
              mark proves momentum-driven rather than metrics-led, and any later financing resets the entry price. A
              separate adjacent workflow-AI company, Tandem Health, disclosed a $50 million Series A in 2025, which is
              not a valuation comp by itself but does show that strong workflow-AI funding exists well below Tandem's
              reported private mark. The practical next step is not a generic pass or pursue decision; it is a targeted
              diligence package on revenue, margins, concentration, and preference terms before treating the current
              headline valuation as underwritten.
            claimRefs:
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              The reported round is credible enough to monitor closely, but the assigned evidence does not justify
              paying the headline valuation without management disclosure on economics and terms.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV014
              - CV015
          - type: callout
            title: What could break the thesis
            body: >-
              If Tandem cannot document partner revenue quality, customer concentration, and preference terms, the
              current private mark could prove to be a momentum valuation rather than an underwritten one.
            calloutType: risk
            claimRefs:
              - CV005
              - CV012
              - CV013
              - CV015
