      - number: '3.2'
        title: Differentiation rests on workflow scope, free provider pricing, and channel alignment
        blocks:
          - type: paragraph
            body: >-
              The most defensible differentiation in the evidence is business-model and workflow breadth, not a uniquely
              disclosed algorithm. Forus presents itself as free to doctors and patients and monetized through biopharma
              relationships; independent reporting echoes that the company relies on partnerships rather than user fees.
              That matters because it narrows the adoption hurdle versus vendors that must sell software seats to
              practices while also aligning Forus with drug-launch execution for manufacturers. In contrast, Tandem
              Health's disclosed product focus is clinical notes and broader clinical workflow support in Europe, which
              makes it better read as an adjacent workflow platform than as a proven U.S. prescription-access equivalent
              in this evidence set. Public pricing, discounting, and contract structure remain largely undisclosed, so
              the matrix can compare model and scope more confidently than it can compare economic terms.
