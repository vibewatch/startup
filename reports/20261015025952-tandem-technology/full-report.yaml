      - number: '5.3'
        title: Differentiation and commercial fit
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation is scope at the point of prescribing. Rx Almanac explicitly contrasts Forus
              with PA-only tools by emphasizing pharmacy coordination, affordability navigation, and patient-status
              communication alongside core authorization work, while Forbes frames the company's role as solving the
              administrative backend of scripts without changing the clinician's medical decision. That combination fits
              a business model where providers and patients pay nothing and biopharma partnerships fund the network,
              which can accelerate adoption but also makes governance, reporting rights, and manufacturer-specific
              controls a product requirement rather than a legal footnote. Founder experience from Oscar strengthens the
              workflow logic, but it is not a substitute for disclosed integration metrics or audited outcome data.
            claimRefs:
