      - number: '3.3'
        title: Durability depends on distribution depth and reliability more than visible hard lock-in
        blocks:
          - type: paragraph
            body: >-
              The moat argument in the assigned evidence is that Forus sits inside prescription-access workflows across
              doctors, pharmacies, payers, and biopharma and therefore accumulates process knowledge and
              launch-distribution relevance as scale grows. The same evidence also points to the main risk: buyers can
              still compare the company against internal operations, existing payer and pharmacy connections, and
              incumbent infrastructure whose failures become especially visible during outages. The AMA's Change
              Healthcare survey data are relevant because they show how much physician operations depend on claims,
              eligibility, remittance, and payment rails; a vendor exposed to these dependencies may benefit when buyers
              want alternatives, but it also inherits reliability scrutiny and contingency expectations. Without public
              renewal, multi-homing, or win-loss evidence, durability is plausible but not yet externally proven.
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
