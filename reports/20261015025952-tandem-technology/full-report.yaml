      - number: '5.4'
        title: Trust, compliance, and public-proof gaps
        blocks:
          - type: paragraph
            body: >-
              Product risk is less about whether Forus automates access tasks and more about whether its AI-assisted
              workflow can be trusted, audited, and integrated at scale. A 2026 Holland & Knight review shows that
              states are tightening rules around AI use in prior authorization and clinical workflows, including
              patient-specific review, disclosure, and licensed human oversight. Against that backdrop, the reviewed
              product evidence is notably incomplete on security posture, BAA or de-identification practices, live payer
              and EHR coverage, and the technical scope of partner integrations. One assigned OpenEvidence URL did not
              preserve the actual partnership body in retrieved text, and former Tandem-name searches still collide with
              unrelated healthcare-AI vendors, so deeper diligence should rely on first-party technical documentation
              and named customer implementations rather than superficial search hits.
