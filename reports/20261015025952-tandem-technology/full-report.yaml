      - number: '1.4'
        title: Milestone readback and open asks
        blocks:
          - type: paragraph
            body: >-
              The dated evidence supports a coherent growth arc even if not every disclosure is audited. The company
              appears to have started in 2023, raised a $30 million Series A in 2024, cleared a $10 million annualized
              revenue marker by the end of 2025, and entered 2026 with multiple reports placing it at or near a $1
              billion valuation. By May 2026, Forbes was already writing about Forus as the commercial brand and
              describing revenue run rate above $50 million. The remaining gaps are not cosmetic: board composition,
              control rights, headcount, disclosed customer count, concentration by pharma partner, and reconciled
              funding history are still missing from the retained public record. Those omissions do not erase the
              progress story, but they do limit how confidently later chapters can infer operating durability or
              investor downside protection.
