companyProfile:
  summary: >-
    Tandem Technology is the company behind Forus, a New York-based prescription-access automation platform founded in
    2023 that embeds into provider workflows to automate prior authorization, affordability support, and fulfillment
    routing for providers, patients, and biopharma partners. Public reporting says the company is free to providers and
    patients, monetizes through biopharma relationships, and has reached a reported $1 billion valuation and $160
    million in total funding, but the public record still leaves governance, concentration, and unit-economics detail
    incomplete.
