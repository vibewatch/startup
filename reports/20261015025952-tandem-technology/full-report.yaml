              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The retained sources surface one clearly documented operator: co-founder and CEO Sahir Jaggi, whose
              background spans Columbia biomedical engineering, Rough Draft Ventures, and several years inside Oscar
              Health. That profile is credible founder-market fit for a company selling into the prescription access
              bottleneck, because it combines healthcare workflow exposure with product-building experience. The
              downside is disclosure depth. Public reporting names investors and quotes outside supporters, but it does
              not identify a board roster, voting structure, or a broader internal executive bench. Until management
              shares a current board list and control framework, the company still looks key-person dependent on Jaggi
              for both operating narrative and external fundraising credibility.
            claimRefs:
              - CO005
              - CO015
