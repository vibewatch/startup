  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow scope and product surface
        blocks:
          - type: paragraph
            body: >-
              Forus is positioned as an upstream medication-access layer rather than a point solution for a single
              denial step. The reviewed official and third-party materials consistently describe a workflow that begins
              when a provider writes a prescription, then handles prior-authorization package creation, benefits checks,
              affordability support, pharmacy routing, and patient communication from the same case record. That breadth
              matters because it makes the product more valuable than a narrow PA form-filler, but it also means the
              company depends on reliable handoffs across EHR, payer, pharmacy, and patient-service surfaces. Public
              materials support the existence of those modules, but not the exact coverage depth by payer, EHR, or
              therapy area.
            claimRefs:
              - CE001
