      - number: '6.2'
        title: Adoption proof exists, but most public customer proof is anonymous
        blocks:
          - type: paragraph
            body: >-
              The public adoption evidence is meaningful but uneven in quality. Forbes and Pulse2 both say the company
              is already used by thousands of medical practices and health systems, and Pulse2 adds a broad geographic
              claim spanning all 50 states and nearly 80% of residential ZIP codes. Forbes also reports 10x
              year-over-year provider adoption for two consecutive years. That is a credible signal that the company is
              not a pre-launch pilot. The problem is that the assigned pool contains little named production proof. The
              official homepage gives concrete workflow anecdotes — fewer rejections, faster approvals, and one staff
              workflow dropping from roughly 60–70% of the day on the phone to around 15% — but those references are
              anonymous. Likewise, the “millions of patients in 2026” framing in Mindstream and MapCo reads as a
              forward-looking scale target, not a verified current patient-count disclosure.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
