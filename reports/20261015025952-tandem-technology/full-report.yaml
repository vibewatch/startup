            tableRef: TO002
            claimRefs:
              - CO005
              - CO015
      - number: '1.3'
        title: Funding, scale, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              The commercial story is attractive on the surface. Public reporting says providers and patients use the
              product for free while monetization comes from biopharma relationships, a setup that can accelerate
              provider adoption if pharma-sponsored launches remain strong. Forbes and Citybiz also describe meaningful
              scale: thousands of medical practices and health systems using the product, roughly half of the global top
              10 biopharma cohort already engaged, and revenue moving from more than $10 million annualized at 2025
              year-end to above $50 million annualized in 2026. Funding evidence is directionally strong but not fully
              clean. May 2026 reporting says the company hit a $1 billion valuation and $160 million of lifetime
              funding, while January 2026 coverage describes an Accel-led round near the same valuation and one data
              provider still shows an internally inconsistent $100 million headline. That mismatch makes cap-table and
              round-document verification mandatory before any valuation chapter leans too heavily on the unicorn
              narrative.
            claimRefs:
