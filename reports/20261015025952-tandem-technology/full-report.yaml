  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set is broad and mostly indirect
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a broad competitive frame rather than a clean list of like-for-like public
              peers. Forus says it automates insurance authorization, financial assistance, and fulfillment routing
              inside physician workflows, while Forbes independently describes the product as handling prescription
              administrative backend work after a doctor writes the script. That places the company against several
              alternative ways to solve the same job: provider staff using forms, faxes, and phone calls; incumbent
              transaction infrastructure that sits between practices, payers, and pharmacies; internal workflow
              build-outs; and adjacent AI workflow vendors that may chase the same administrative budget even when they
              begin in a different use case. The pool does not surface a deep bench of named U.S. prescription-access
              software vendors with verified product and pricing pages, so the chapter distinguishes direct workflow
              substitutes from adjacent entrants rather than overstating peer precision.
