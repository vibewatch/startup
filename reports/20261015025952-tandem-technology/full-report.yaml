    summary: >-
      The most acute risks cluster around regulation, monetization dependencies, and governance gaps rather than basic
      product usefulness.
    data:
      columns:
        - label: Likelihood
          note: Near-term probability over the next 12-18 months.
        - label: Impact
          note: Potential effect on underwriting or downside protection.
        - label: Mitigation maturity
          note: How much mitigation is visible in the assigned public evidence.
        - label: Residual exposure
          note: Expected remaining exposure after likely mitigations.
      rows:
        - label: AI prior-auth regulation
          note: Driven by 2026 state activity and CMS-aligned guardrails.
          values:
            - label: High
              tone: high
            - label: High
              tone: critical
            - label: Low
              tone: risk
