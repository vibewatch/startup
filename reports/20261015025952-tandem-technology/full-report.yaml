  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a free end-user workflow that monetizes through sponsor partnerships, leaving
      gross-profit mechanics undisclosed.
    data:
      nodes:
        - label: Doctor writes prescription in existing workflow
          note: Forus says prescribing stays in the EHR and the access workflow runs around it
        - label: Tandem automates prior authorization, affordability, and routing
          note: Administrative work shifts from manual phone calls and paperwork to automated workflow
        - label: Patient and provider usage is free
          note: Public sources explicitly say the software is free to both groups
        - label: Adoption expands across practices and health systems
          note: Public reporting cites thousands of practices, nationwide reach, and millions of patients targeted in 2026
        - label: Biopharma partners fund launch and access programs
          note: Forbes and Mindstream indicate partnerships, not user fees, are the revenue source
        - label: Gross profit depends on contract mix and automation leverage
          note: Public sources do not disclose realized pricing, margins, or cash conversion
    claimRefs:
      - CI003
      - CI012
      - CI014
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a six-layer workflow stack from EHR-triggered intake through compliance-constrained
      patient access operations.
    data:
      layers:
        - label: Prescriber trigger
          summary: Prescription starts inside the provider's normal ordering workflow.
          modules:
            - EHR-native order capture
            - Real-time prescription tracking
          outputs:
            - Structured access case
        - label: Coverage qualification
          summary: Benefits and program enrollment determine the reimbursement path before downstream routing.
          modules:
            - Benefit verification
            - Access-program enrollment forms
          outputs:
            - Coverage path and missing-data checklist
        - label: Prior authorization engine
          summary: Forms and supporting clinical documentation are assembled for payer review.
          modules:
            - PA submission
            - Clinical-document assembly
          outputs:
            - Initial authorization package
        - label: Exceptions and renewals
          summary: Denied or expiring cases move into follow-up, appeal, and renewal work.
          modules:
            - Appeal generation
            - Payer follow-up
            - Renewal tracking
          outputs:
            - Escalated or refreshed case
        - label: Fulfillment and affordability routing
          summary: Approved cases are routed to the right pharmacy and support pathway.
          modules:
            - Pharmacy coordination
            - Copay and financial-assistance navigation
          outputs:
            - Dispensing and affordability path
        - label: Patient and clinic visibility
          summary: Patients and office staff receive status updates while the case remains auditable.
          modules:
            - Patient status communications
            - Staff visibility dashboard
          outputs:
            - Shared status and follow-up actions
    approximationNotes: >-
      Map reflects only layers explicitly visible in reviewed public sources; it does not imply complete payer, EHR, or
      security-system coverage.
    claimRefs:
      - CE001
      - CE004
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The product sits in the provider workflow while monetization appears to come from biopharma relationships layered
      onto the same access network.
    data:
      items:
        - label: Prescription written in the EHR
          actor: Physician
          stage: Clinical decision
          touchpoints:
            - Write the prescription in the normal EHR workflow
            - Forus picks up the order as the access workflow begins
          note: Official product copy centers the journey on the prescribing clinician rather than a separate portal.
        - label: Prior authorization and paperwork automation
          actor: Clinic staff
          stage: Access initiation
          touchpoints:
            - Auto-generate and submit prior-authorization forms
            - Track exceptions instead of working every case by phone
          note: This is the core provider-value proposition and the strongest operational adoption proof in the pool.
        - label: Real-time script tracking
          actor: Physician and staff
          stage: Workflow management
          touchpoints:
            - Follow every prescription in real time
            - Intervene when the workflow stalls
          note: Official copy emphasizes visibility rather than pure one-shot automation.
        - label: Patient affordability and status updates
          actor: Patient
          stage: Access completion
          touchpoints:
            - Receive updates on authorization and fulfillment
            - Navigate affordability support and next steps
          note: Patients are beneficiaries of the workflow, but public sources do not show they are the paying customer.
        - label: Pharmacy and payer coordination
          actor: Pharmacy and payer ecosystem
          stage: Fulfillment routing
          touchpoints:
            - Route the prescription to the right pharmacy
            - Resolve payer and inventory constraints before pickup
          note: External sources suggest nationwide connectivity, but no public SLA or turnaround cohort is disclosed.
        - label: Biopharma launch and data loop
          actor: Biopharma partner
          stage: Expansion / monetization
          touchpoints:
            - Use the network to support launches and treatment uptake
            - Feed access intelligence back into commercialization planning
          note: >-
            This appears to be the revenue-bearing expansion loop, and also the most likely source of concentration
            risk.
    claimRefs:
      - CU001
      - CU003
      - CU009
      - CU010
      - CU012
      - CU014
