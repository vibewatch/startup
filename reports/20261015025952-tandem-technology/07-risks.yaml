company:
  name: "Tandem Technology"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Tandem's clearest current risks are regulatory and model-design risks around
    AI-assisted prior authorization, monetization risk from a free-to-user product
    that appears to rely on partners, and evidence-quality risk around an
    expensive 2026 financing narrative that remains publicly thin. Operationally,
    the product sits inside time-sensitive prescription workflows, so reliability,
    integration, and governance failures would likely surface quickly in provider
    adoption and customer trust.
sections:
  - id: "risk-posture"
    title: "Current risk posture"
    body: >-
      The evidence set supports a risk posture that is more about governance and
      dependency than about near-term demand. Forus presents itself as an
      end-to-end prior-authorization and medication-access workflow that is free
      to providers and patients, while independent 2026 coverage says the company
      is pursuing a $100 million round at a $1 billion valuation and expects to
      monetize through partnerships rather than user fees. That combination makes
      the underwriting question less about whether the workflow is useful and more
      about whether Tandem can keep regulators, providers, and counterparties
      aligned while proving durable economics. The heatmap below ranks the risks
      that appear most likely to affect investment outcomes under the assigned
      evidence set.
    claimRefs: ["CR001", "CR004", "CR005", "CR007", "CR009", "CR012", "CR013"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-governance"
    title: "Regulatory and governance exposure"
    body: >-
      The strongest hard risk is regulatory drift toward human-review,
      disclosure, and anti-sole-AI-decision rules in healthcare workflows that
      overlap with prior authorization, claims, and patient-facing automation.
      Holland & Knight and Manatt both describe 2026 state laws that prohibit
      solely AI-driven adverse determinations or require explicit oversight and
      disclosures. Tandem's product positioning matters here: the company says it
      tracks prescriptions, submits prior-authorization forms from the EHR, and
      keeps patients updated, so any expansion from workflow automation into
      decisioning or insufficiently supervised claims activity could move it into
      a tighter compliance perimeter. No assigned source confirms active
      enforcement against Tandem itself, but the source set also does not clear
      security, BAA, data-rights, or incident-response diligence.
    claimRefs: ["CR002", "CR007", "CR008", "CR009"]
    tableRefs: ["TR001"]
  - id: "operational-and-dependency"
    title: "Operational, partner, and evidence-quality risks"
    body: >-
      Operationally, the platform sits in a brittle part of the care-access
      stack: one provider testimonial says staff time on the phone fell from
      60-70% of the day to roughly 15% after adopting Forus, which implies
      uptime, integrations, and exception handling are mission-critical rather
      than cosmetic. The business model also appears partner-dependent. Public
      sources describe the service as free to providers and patients and say the
      model is expected to rely on partnerships, while management reportedly
      wants deeper biopharma relationships and millions of patients on platform.
      That raises concentration and bargaining-power risk if a small number of
      payers, pharma partners, or strategic channels become the real monetization
      engine. Finally, the evidence trail itself is noisy: one discovered 2026
      funding source resolved to generic organizational boilerplate, and the name
      "Tandem" already belongs to other healthcare brands, increasing diligence
      noise and likely raising go-to-market ambiguity costs.
    claimRefs: ["CR003", "CR004", "CR005", "CR006", "CR009", "CR010", "CR011", "CR012", "CR013"]
    tableRefs: ["TR002", "TR003"]
  - id: "kill-criteria-and-diligence"
    title: "Kill criteria, monitoring, and next diligence steps"
    body: >-
      The thesis should break quickly if any of three conditions show up in
      diligence: first, evidence that Tandem's workflow is being used for
      materially unsupervised AI decisioning in prior authorization or claims;
      second, evidence that partner economics are concentrated enough that one
      counterparty can reset the revenue model; third, evidence that the company
      cannot document HIPAA, BAA, data-rights, and incident-governance controls
      to the level expected for prescription-access infrastructure. Short of a
      hard break, investors should monitor whether the company can convert a
      free-to-user wedge into diversified monetization without sacrificing
      provider trust, and whether the heavily promoted 2026 financing narrative
      resolves into disclosed terms, disciplined burn, and credible residual
      upside from the reported price.
    claimRefs: ["CR004", "CR007", "CR009", "CR012", "CR013"]
