callouts:
  - calloutType: "risk"
    title: "Underwriting kill criteria"
    body: >-
      Treat the thesis as broken if diligence shows materially unsupervised AI
      decisioning in prior authorization, partner concentration that effectively
      turns one counterparty into the revenue model, or an inability to produce
      enterprise-grade HIPAA, BAA, and incident-governance materials for a
      prescription-access workflow.
    claimRefs: ["CR007", "CR009", "CR013"]
