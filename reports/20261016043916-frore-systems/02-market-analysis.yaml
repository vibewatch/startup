chapter:
  number: 2
  title: "Market Analysis"
  summary: "Frore is pursuing two related but distinct markets: direct liquid cooling for AI data-center hardware and solid-state active cooling for compact edge devices. Public evidence supports strong AI-driven thermal demand and broad adjacent market growth, but the accessible record still lacks a standalone Frore SAM/SOM or customer-budget data, which limits sizing precision."
sections:
  - id: "boundary-and-substitutes"
    title: "Boundary and substitutes"
    body: |-
      Frore's market boundary is narrower than "thermal management" as a generic category but broader than a single product niche. Current company and third-party descriptions consistently place the business across two wedges: direct liquid cooling for AI data-center hardware and solid-state active cooling for compact edge devices. That matters because the adoption logic, incumbent alternatives, and budget owners are different across those wedges. In edge devices, the status-quo substitute is fan or passive cooling that leads to thermal throttling or cannot fit the form factor Frore targets. In data centers, the substitute is more conventional liquid-cooling hardware with hoses, connectors, manifolds, and heavier coldplates. The market story is therefore not one monolithic TAM; it is a thermal-performance thesis spanning separate but related buyer problems.
    claimRefs: ["CM001", "CM002", "CM008", "CM010", "CM014", "CM015"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses-and-buyer-map"
    title: "Sizing lenses and buyer map"
    body: |-
      The retained public evidence supports adjacent market lenses, not a clean bottom-up Frore TAM/SAM/SOM. TAMradar provides broad category numbers for data-center cooling and for solid-state cooling, while Frore's own materials emphasize AI-compute growth and thermal urgency rather than a quantified addressable-revenue bridge. That means the numbers are useful as directional demand markers, but they are not interchangeable and should not be rolled into a single market estimate. The buyer map also splits cleanly by product motion: LiquidJet and LiquidJet Nexus fit server, rack, and compute-tray programs, while AirJet maps to OEM device teams shipping notebooks, gateways, SSD accessories, cameras, and other compact systems. Frore's valuation case therefore depends on winning two different commercialization paths instead of one uniform procurement motion.
    claimRefs: ["CM002", "CM003", "CM005", "CM006", "CM007", "CM009", "CM011", "CM012"]
    tableRefs: ["TM002", "TM003"]
    figureRefs: ["FM001"]
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Drivers, constraints, and valuation relevance"
    body: |-
      The strongest adoption drivers in the accessible record are AI-driven thermal bottlenecks and the operating-economics benefits attached to better cooling. Frore's 2026 materials tie demand to higher compute density, lower PUE, and lower power and water usage, while Lenovo's 2026 concept-notebook announcement adds sustained AI reasoning workloads as a newer edge-device driver. Those signals support real urgency, but the public record is still thin where valuation work needs precision. The accessible sources do not name production hyperscaler deployments, do not disclose buyer-side budgets or attach rates, and do not show a bottom-up SAM/SOM by segment. As a result, the market story is credible, but the public evidence still supports "large adjacent opportunity with incomplete conversion proof" more strongly than it supports a fully underwritten market-share case.
    claimRefs: ["CM003", "CM004", "CM011", "CM013", "CM014", "CM015"]
callouts:
  - calloutType: "insight"
    title: "Frore's addressable story is a two-wedge market, not one monolithic TAM"
    body: "The retained evidence repeatedly splits Frore between AI-server liquid cooling and compact edge-device active cooling, so broad AI-cooling market figures are directional context rather than a single directly monetizable TAM."
    claimRefs: ["CM001", "CM002", "CM005", "CM006", "CM012"]
  - calloutType: "risk"
    title: "Market upside currently outruns public conversion proof"
    body: "Public sources support thermal-demand urgency, but they still do not show named production hyperscaler wins, buyer budgets, or bottom-up SAM/SOM math, leaving valuation highly sensitive to assumptions about real purchasing conversion."
    claimRefs: ["CM004", "CM012", "CM013", "CM014"]
