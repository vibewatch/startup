  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Public price sheets, contract minimums, discount ranges, or channel terms for Frore and named peers.
      whyItMatters: Pricing opacity prevents clean comparison of ROI, switching cost, and commercial leverage versus fan, coldplate, or startup alternatives.
      diligencePath: Request current list pricing, realized ASPs, pilot-to-production contract terms, and any distributor or OEM discount structures.
      relatedQuestionRefs: [QP007]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: production-customer-proof
      missingEvidence: Named production deployments, customer counts by product family, and design-win conversion from demo to volume shipment.
      whyItMatters: Frore's moat case depends on whether public ecosystem proof turns into repeat customer demand rather than isolated showcases.
      diligencePath: Request a by-product design-win ledger with launch dates, shipped units, customer names, and revenue contribution.
      relatedQuestionRefs: [QP006, QP008]
    - type: missing-source
      severity: material
      topic: independent-benchmarking
      missingEvidence: Independent head-to-head benchmarks versus incumbent fans, standard coldplates, and the named startup peers under production conditions.
      whyItMatters: Public company-authored and partner-authored claims are directionally helpful but do not prove sustained advantage against alternatives at scale.
      diligencePath: Obtain third-party thermal benchmark reports or customer test data covering identical workloads, form factors, and power envelopes.
      relatedQuestionRefs: [QP003, QP004, QP006]
