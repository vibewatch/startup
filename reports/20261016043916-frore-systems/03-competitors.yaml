      xAxis:
        label: Deployment focus
        min: 0
        max: 10
        low: Compact edge devices
        high: Rack-scale AI infrastructure
        description: Ordinal score synthesized from cited product and segment descriptions
        scale: ordinal
      yAxis:
        label: Integration complexity
        min: 0
        max: 10
        low: Drop-in / low plumbing burden
        high: System-level thermal redesign
        description: Ordinal score synthesized from cited device or tray integration requirements
        scale: ordinal
      points:
        - label: Frore AirJet
          x: 2
          y: 2
          note: Silent solid-state active air cooling for thin edge devices and compact enclosures
          claimRefs: [CP002, CP004]
        - label: Phononic
          x: 3
          y: 4
          note: Tracxn describes Phononic as a solid-state thermal management peer
          claimRefs: [CP008, CP010]
        - label: Status quo fans
          x: 2
          y: 5
          note: Mainstream substitute in thin devices, but noisier and more space-constrained than Frore's pitch
          claimRefs: [CP004]
        - label: Frore LiquidJet / Nexus
          x: 9
          y: 6
          note: Direct-to-chip liquid cooling and integrated 1/2U tray architecture designed to remove hoses and manifolds
          claimRefs: [CP003, CP005]
        - label: JETCOOL Technologies
          x: 8
          y: 8
          note: Tracxn describes JETCOOL as direct-to-chip liquid cooling for high-power electronics
          claimRefs: [CP008, CP010]
        - label: Corintis
          x: 8
          y: 7
          note: Tracxn describes Corintis as a microfluidic cold-plate specialist for high-power chip cooling
          claimRefs: [CP008, CP010]
    approximationNotes: >-
      Axes are ordinal, not measured benchmarks; placements summarize cited product descriptions,
      target workloads, and implied integration burden from the assigned evidence.
    claimRefs: [CP002, CP003, CP004, CP005, CP008, CP010, CP011]
