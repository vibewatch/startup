    rows:
      - ['Ultra-thin, silent edge devices', 'AirJet is positioned for notebooks, tablets, Mini-PCs, smartphones, SSDs, hotspots, and IoT devices', 'Fan-based cooling remains the mainstream substitute; Phononic is the closest named solid-state peer, but assigned evidence does not show like-for-like notebook proof', 'Frore has a clearer public edge-device narrative than its named startup peers, but investors still need production-volume proof']
      - ['GPU-heavy AI servers and dense compute trays', 'LiquidJet and LiquidJet Nexus target AI servers and 1/2U compute trays', 'JETCOOL and Corintis are named liquid-cooling peers; standard coldplates remain the incumbent substitute', 'Frore competes directly in a more infrastructure-heavy lane where integration and reliability matter as much as raw cooling']
      - ['Mechanical / plumbing simplification', 'LiquidJet Nexus is pitched as eliminating hoses, connectors, and manifolds at tray level', 'Peer capability is unknown in the assigned evidence; standard tray assemblies still rely on those components', 'If Frore can prove the claim in production, it could compete on both thermal performance and integration burden']
      - ['Public ecosystem proof', 'Lenovo, Micron, Intel, and Qualcomm are named in public references', 'Assigned evidence does not show equivalent public partner proof for named peers', 'Distribution credibility currently rests more on ecosystem endorsements than on transparent customer or pricing disclosures']
    notes: >-
      Unsupported peer cells are marked as unknown in assigned evidence rather than inferred from
      outside sources.
    claimRefs: [CP002, CP003, CP005, CP006, CP008, CP010]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offering / alternative
      - Public price / contract model
      - Included capabilities
      - Discount / unknowns
      - Implication
    rows:
      - ['AirJet edge cooling', 'Not public in assigned evidence', 'Silent solid-state active cooling for thin edge devices', 'No list price, contract structure, or discounting disclosed', 'Commercial comparison versus fan modules or solid-state alternatives remains incomplete']
      - ['AirJet PAK / edge AI packaging', 'Not public in assigned evidence', 'Plug-and-play module with multiple AirJets for AI SoMs', 'No public unit price or realized system economics', 'Useful product framing for edge AI, but not enough to benchmark sales efficiency or buyer trade-offs']
      - ['LiquidJet / LiquidJet Nexus', 'Not public in assigned evidence', 'Direct-to-chip liquid cooling plus integrated 1/2U tray architecture', 'No public pricing, deployment minimums, or service terms disclosed', 'Frore may be technically differentiated, but investors cannot yet verify whether that advantage converts into superior economics']
      - ['Named peers and incumbent substitutes', 'Not public in assigned evidence', 'Peer descriptions and funding exist, but pricing does not; status-quo alternatives are embedded in existing system BOMs', 'Assigned competitor-positioning and pricing searches returned zero hits', 'Pricing opacity is itself a competitive risk because it blocks clean switching-cost and ROI comparisons']
    notes: >-
      The assigned pool did not include public pricing pages or contract terms for Frore or its
      named peers, so this table documents the gap rather than guessing at market pricing.
    claimRefs: [CP002, CP003, CP008, CP011]
