chapter:
  number: 5
  title: "Product & Technology"
  summary: "Frore has a credible two-track thermal platform story: AirJet for thin edge devices and LiquidJet/LiquidJet Nexus for AI data-center cooling. Public evidence shows meaningful productization progress and OEM concept integrations, but the record is still dominated by company-authored performance claims and does not yet verify production-scale reliability, named LiquidJet deployments, or formal security and support controls."
sections:
  - id: "product-footprint"
    title: "Product footprint in customer workflows"
    body: |
      Frore is no longer presenting a single experimental cooling chip. The current product story spans AirJet for client and edge devices plus LiquidJet/LiquidJet Nexus for direct-to-chip liquid cooling in AI data centers, which lets the company address two different workflow bottlenecks: thermally constrained compact systems and high-density accelerator trays. Public materials place AirJet in notebooks, mini PCs, cameras, SSDs, smartphones, and edge AI SoMs, while LiquidJet is framed around GPU and ASIC cooling for hyperscale-style compute environments.

      The workflow evidence is strongest where Frore can point to named demonstrations and concept integrations rather than anonymous future OEM programs. Lenovo's AeroBlade concept notebook, the iodyne Pro Mini storage announcement, and CES demo examples around Micron, MacBook Air, Samsung, and Zotac all show that Frore can get its cooling hardware integrated into real device concepts and reference platforms. That matters because Frore's sales motion appears to depend on being designed into third-party systems instead of shipping a standalone end-product.

      The limitation is that these references mostly prove technical fit and partner interest, not scaled production adoption. Public sources do not establish shipped-unit volumes, attach rates, customer concentration, or the mix between demo, concept, pilot, and production deployments. For diligence, the key distinction is that Frore has credible workflow coverage across edge and data-center thermal problems, but public adoption proof still trails the breadth of the product narrative.
    claimRefs: ["CE001", "CE005", "CE006", "CE007", "CE009", "CE010"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-differentiation"
    title: "Architecture and differentiation"
    body: |
      AirJet's differentiation is a solid-state thermal architecture positioned against both passive heatsinks and fan-based cooling. Frore's own product materials describe silent operation, high back pressure, compact dimensions, and low power draw, all of which are valuable in sealed or space-constrained devices where conventional fans add noise, dust vulnerability, or thickness. The newer AirJet PAK packaging pushes the same logic up a level by combining multiple AirJet Mini G2 chips into a plug-and-play module for AI SoMs.

      LiquidJet extends the same "thermal-stack" thesis into data-center cooling. The public product surface describes multi-stage 3D short-loop jetchannels, hotspot-focused coldplate geometry, and a lightweight integrated Nexus system that removes hoses and connectors from 1/2U compute-tray designs. In other words, Frore is not only selling component cooling performance; it is also trying to reduce integration complexity at the system level for both edge and liquid-cooled server environments.

      What remains unverified is how much of this differentiation survives independent benchmarking. Nearly every quantitative advantage in the assigned evidence pool comes from Frore-authored materials, including per-chip heat removal, system acoustics, and many demo uplift figures. The architecture is specific enough to be technically legible, but the diligence risk is that the market still has far more marketing evidence than neutral test data.
    claimRefs: ["CE002", "CE003", "CE004", "CE008", "CE010", "CE012"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-dependencies-and-control-gaps"
    title: "Maturity, dependencies, and control gaps"
    body: |
      Frore's maturity is best described as emerging commercialization with visible manufacturing and partner-development signals, not fully de-risked scale. Third-party and official materials both place manufacturing operations in Taiwan and describe integration with major OEMs and system builders, while the August 2026 tear sheet adds ISO 9001 and ISO 14001 certification at the fab. Those are useful quality and supply-readiness indicators, especially for a hardware company whose performance claims rely on repeatable manufacturing execution.

      Even so, the public record still leaves important technical and operational dependencies unresolved. Lenovo's notebook evidence is still at concept stage, the LiquidJet story lacks named production deployments in the assigned pool, and the company remains dependent on OEM design wins and manufacturing partners to turn technical merit into recurring product volume. That makes roadmap timing, qualification cycles, return rates, and customer-specific validation data more important diligence items than another round of marketing benchmarks.

      Trust and control surfaces are the weakest part of the public evidence pack. Frore's assigned sources show manufacturing-quality signals and product claims, but they do not publish the sort of security, privacy, firmware, uptime, or service-governance documentation that enterprise buyers may expect when cooling becomes part of critical AI and edge infrastructure. The right reading is not that those controls are absent, but that investors cannot verify them from the current public evidence set.
    claimRefs: ["CE005", "CE006", "CE010", "CE011", "CE012"]
