company:
  name: Frore Systems
chapter:
  number: 8
  title: Valuation
  summary: >-
    Frore closed a $143 million Series D at a $1.64 billion valuation in March 2026,
    giving the company clear financing momentum and a credible investor syndicate.
    But the retained public evidence still relies heavily on company-controlled
    technical and launch claims while leaving revenue, named production customers,
    customer concentration, and preference terms undisclosed, so the price looks
    stretched relative to independently verified commercial proof.
sections:
  - id: investment-call
    title: Investment call and price discipline
    body: >-
      The latest round gives Frore meaningful strategic credibility: multiple sources
      corroborate a $143 million Series D, $340 million total funding, and a $1.64
      billion valuation, while company materials show a broad thermal product stack
      spanning hyperscale liquid cooling and edge-device active air cooling.
      That said, the public evidence in this pool does not disclose revenue, ARR,
      gross margin, burn, runway, cap-table terms, or named production LiquidJet
      deployments. The result is a price-sensitive recommendation rather than a
      company-quality endorsement: Frore looks promising enough to keep under active
      diligence, but the last round price asks investors to underwrite scale before
      the available public record independently proves it.
    claimRefs: [CV001, CV002, CV003, CV005, CV014, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The pro-investment case is straightforward. Frore has continued to attract
      capital, public partner announcements, and a steady flow of product launches,
      while company materials claim meaningful thermal-performance gains for both
      LiquidJet and AirJet. The anti-thesis is equally clear. The strongest operating
      proof remains company-controlled; a SiliconANGLE report says Frore serves cloud,
      enterprise, and government customers but also notes the company declined to name
      them, and the retained sources still do not disclose the financial metrics that
      would let an outside investor test whether the March 2026 price is justified by
      repeatable commercialization rather than narrative momentum.
    claimRefs: [CV004, CV006, CV007, CV008, CV009, CV010, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, downside triggers, and final diligence asks
    body: >-
      Because the public record does not expose revenue or unit economics, scenario
      work has to stay qualitative and milestone-driven. The bull case requires named
      hyperscaler or OEM production deployments plus financial disclosure that shows
      the March 2026 round was not simply valuing future option value. The base case
      is continued product and partner progress but with entry discipline until
      independent customer and financial proof improves. The bear case is that Frore
      has real technical differentiation but insufficient public evidence of scaled
      adoption, leaving downside if commercialization remains pilot-heavy or if a later
      round resets valuation expectations. Those gaps make customer proof, financial
      disclosure, and preference overhang the last major diligence gates.
    claimRefs: [CV010, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
tables:
