callouts:
  - calloutType: recommendation
    title: Current call
    body: >-
      Frore merits continued diligence, but the public evidence here supports
      research-more rather than buy at the last reported round price.
    claimRefs: [CV002, CV014, CV015, CV016]
  - calloutType: risk
    title: What can still break the thesis
    body: >-
      The biggest open risk is not whether Frore can tell a strong technical story;
      it is whether the company can convert that story into named production customers
      and disclosed economics before the next financing test.
    claimRefs: [CV010, CV014, CV015]
