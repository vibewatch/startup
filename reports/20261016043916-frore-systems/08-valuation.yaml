  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-gaps
      missingEvidence: Audited or board-level revenue, gross margin, burn, runway, and revenue-mix disclosure by product line.
      whyItMatters: Without operating metrics, the $1.64 billion price cannot be benchmarked against execution quality or capital efficiency.
      diligencePath: Request the latest board package or diligence room financials with product-line breakouts and cash runway.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: customer-proof
      missingEvidence: Named production LiquidJet customers, deployment scale, and revenue contribution by major account.
      whyItMatters: Valuation support depends on whether Frore's largest opportunity has moved from demos and concepts into repeatable commercial deployments.
      diligencePath: Obtain a customer list, references, shipment volumes, and split pilot versus production deployments for LiquidJet and AirJet.
      relatedQuestionRefs: [QV003, QV008]
    - type: private-evidence-only
      severity: material
      topic: financing-structure
      missingEvidence: Cap-table mechanics, liquidation preferences, secondary activity, debt facilities, and any structured financing terms.
      whyItMatters: Entry discipline depends on structure, not just headline valuation, especially if the next financing environment is tighter.
      diligencePath: Review the current cap table, preferred terms, debt agreements, and any side letters from the Series D.
      relatedQuestionRefs: [QV005, QV008]
