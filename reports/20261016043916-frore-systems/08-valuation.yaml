    columns: [Metric, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Continue diligence; do not underwrite the March 2026 price as investable on current public evidence."]
      - [Confidence, medium, "Funding and product evidence are clear, but operating and cap-table disclosure remain incomplete."]
      - [Risk rating, high, "Commercialization, concentration, and financing-structure gaps can still change the underwriting case materially."]
      - [Valuation stance, stretched, "The $1.64B round is real, but public financial and named-customer proof do not yet show why that price is conservative."]
      - ["Price / hold discipline", "Track for proof or better entry", "A stronger call needs named production customers, disclosed revenue quality, and preference/debt clarity."]
    notes: >-
      Summary assessments synthesize the cited evidence; they are not standalone source
      facts and should be read with the unresolved disclosure gaps.
    claimRefs: [CV001, CV002, CV003, CV010, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence now, "What would change the view"]
    rows:
      - ["Fresh financing validates investor interest", "$143M Series D, $340M total raised, and a named investor syndicate are corroborated across official and third-party sources.", "Would strengthen if Frore discloses how the new capital translates into booked revenue, backlog, or customer ramp."]
      - ["Technical platform appears differentiated", "Company materials claim LiquidJet efficiency gains, Nexus rack-density improvements, and AirJet Mini edge-device performance improvements.", "Would strengthen if independent benchmarks or named production deployments validate those metrics at scale."]
      - ["Partner and launch evidence is improving", "The Lenovo AeroBlade concept announcement and Frore's 2024 disclosure of public demonstrations and proprietary designs show ongoing market engagement.", "Would strengthen if concept and demo announcements convert into named shipping programs and recurring customer revenue."]
      - ["Commercial proof still lags valuation", "Public sources do not disclose revenue, margins, runway, cap-table terms, or named production LiquidJet customers.", "Would move the view toward fair if management provides audited or board-level operating data and financing-structure details."]
    notes: >-
      This table combines sourced facts with analyst interpretation about what would
      move the underwriting view.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV007, CV008, CV009, CV010, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - [Bull, "Named hyperscaler or OEM production wins emerge, company financial disclosure improves, and LiquidJet/AirJet metrics translate into repeatable deployments.", "The March 2026 round can be defended or exceeded only if public proof catches up to the price with visible commercialization data.", "Execution risk on scaling manufacturing and converting demos into production.", "Possible, but not yet demonstrated in retained public evidence."]
      - [Base, "Product and partner momentum continues, but revenue and customer concentration stay largely private.", "Investors should treat the latest round as a reference point rather than a clear bargain and wait for proof or better terms.", "Valuation remains ahead of independently verified fundamentals.", "Most consistent with the current source set."]
      - [Bear, "LiquidJet remains pilot-heavy, customer proof stays unnamed, or a future round faces multiple compression and tougher financing terms.", "A later investor would need a lower entry valuation or stronger downside protection to compensate for missing operating proof.", "Down-round risk, structure risk, and slower-than-expected commercialization.", "Material if disclosure stays sparse through the next financing cycle."]
    notes: >-
      Scenario language is qualitative because the retained public evidence does not
      disclose revenue, margins, or cap-table mechanics needed for a defensible model.
    claimRefs: [CV002, CV006, CV007, CV008, CV009, CV010, CV013, CV014, CV015, CV016]
