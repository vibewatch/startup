company:
  name: Frore Systems
chapter:
  number: 4
  title: Financials
  summary: >-
    Frore Systems' public financial story is currently a capital-formation story, not a disclosed operating-metrics story: retained sources corroborate a $143 million Series D at a $1.64 billion valuation and total funding of $340 million, but they do not disclose revenue, gross margin, burn, runway, or customer concentration. Public product evidence supports a hardware-led monetization model across data-center and edge cooling products, yet underwriting still depends on private shipment, pricing, and margin data.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      The retained public evidence points to a hardware-led revenue model rather than a software or services subscription business. Frore's 2026 funding release ties the company to three monetization surfaces — LiquidJet and LiquidJet Nexus for AI data-center thermal stacks, plus AirJet and AirJet PAK for edge and device deployments — while named public examples remain product showcases, concept systems, or disclosed deployments rather than revenue-bearing contracts. That means the chapter can explain where revenue should come from, but not how much is already recurring, realized, or concentrated across programs.
    claimRefs: [CI001, CI003, CI004, CI007, CI009, CI010]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-sales-efficiency
    title: Pricing visibility and sales-efficiency proxies
    body: >-
      Public pricing transparency is weak. None of the retained sources disclose list prices, realized ASPs, discounting, contract structures, or non-recurring engineering fees for LiquidJet, LiquidJet Nexus, AirJet Mini, or AirJet PAK. The sales motion nonetheless looks enterprise- and OEM-led: Lenovo is still at concept-notebook stage, CES materials emphasize demonstrations and future launches, and YUAN is the clearest named deployed edge application. That pattern implies longer qualification cycles, design-win risk, and potentially lumpy revenue recognition, but public evidence does not quantify CAC, payback, win rates, or channel economics.
    claimRefs: [CI007, CI008, CI010, CI013]
    tableRefs: [TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The cost base implied by the retained evidence is manufacturing- and engineering-heavy. Frore is scaling multiple hardware platforms, public materials cite research, manufacturing, and international collaborations as uses of proceeds, and the edge lineup continues to iterate upward in cooling capacity. That supports a view that gross profit will depend on component yield, thermal-performance consistency, support obligations, and production scale rather than pure software gross margins. However, public disclosures stop well short of reporting gross margin, warranty burden, working-capital needs, capex, or any burn-rate bridge, so unit-economics underwriting remains mostly a diligence exercise.
    claimRefs: [CI005, CI006, CI009, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-view
    title: Capital adequacy and underwriting view
    body: >-
      Frore's near-term financing position looks materially stronger than its public operating disclosure. Multiple retained sources corroborate the March 2026 Series D, named investors, and $340 million total capital raised, which suggests the company has had little trouble accessing growth capital. The problem for underwriting is that the same public record still does not reveal cash on hand after the round, burn, runway, debt, or product-level revenue and margin quality. On public evidence alone, investors can underwrite market interest and product ambition, but not capital efficiency or the timing to self-sustaining unit economics.
    claimRefs: [CI001, CI002, CI011, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - LiquidJet coldplates
        - Hardware sale into AI-server liquid-cooling deployments
        - Coldplate / server platform
        - Public evidence shows capability claims and post-Series-D scale-up intent, but no disclosed shipped-system count or revenue contribution
        - "Medium: product and funding evidence exists, revenue visibility does not"
        - Shipment counts, ASP by configuration, gross margin by data-center SKU
      - - LiquidJet Nexus integrated systems
        - Integrated thermal-stack sale for 1/2U compute trays
        - Integrated coldplate system
        - Official materials claim compute-density and weight advantages; public evidence does not disclose customer names, contract values, or production volume
        - "Medium: mechanism is visible, commercialization is not quantified"
        - Named design wins, realized pricing, attachment to specific tray programs
      - - AirJet Mini / Slim
        - Component sale into OEM edge and consumer devices
        - Cooling chip per device
        - Public record is demo- and concept-heavy across notebooks, SSDs, phones, and mini PCs, with no paid-volume disclosure
        - "Medium: broad application proof, low monetization proof"
        - OEM design-win list, unit shipments, realized pricing, return rates
      - - AirJet PAK
        - Module sale into industrial edge AI systems
        - Cooling module per deployed edge system
        - YUAN collaboration cites a deployed 5C platform and a 45W G2 upgrade, but no public revenue or contract value
        - "Medium: named application exists, commercial depth is unclear"
        - Named customers, production-vs-pilot mix, module ASP, attach rate
    notes: Public sources identify hardware monetization paths but do not disclose revenue by stream; status cells distinguish disclosed deployment evidence from missing commercial metrics.
    claimRefs: [CI004, CI007, CI009, CI010]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price / unit / contract
      - What is disclosed
      - Missing monetization detail
      - Source posture
    rows:
      - - LiquidJet / LiquidJet Nexus
        - Not disclosed publicly
        - Product-performance claims, scale-up intent, and target environment are public
        - ASP, volume tiers, installation scope, service/support economics, revenue-recognition terms
        - Official capability claims plus independent funding coverage
      - - AirJet Mini / Slim
        - Not disclosed publicly
        - Technical specs and concept/demo integrations are public
        - Per-chip price, OEM discounting, NRE, minimum-order quantities, warranty terms
        - Official concept and demo evidence only
      - - AirJet PAK
        - Not disclosed publicly
        - Named edge-camera application and module heat-removal figures are public
        - Module ASP, program economics, deployment scale, replacement/service revenue
        - Official customer-application release only
    notes: No retained source publishes list pricing, realized pricing, or contract terms; "not disclosed publicly" reflects the retained evidence set rather than a universal claim that such data cannot exist elsewhere.
    claimRefs: [CI004, CI005, CI006, CI009, CI010, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Total capital raised
        - $340M after the March 2026 Series D
        - High
        - Sets financing buffer and investor support, but not cash on hand
        - Cash balance at close, restricted cash, and use-of-proceeds schedule
      - - Post-money valuation
        - $1.64B
        - High
        - Frames market expectations against still-undisclosed operating metrics
        - Current revenue/ARR bridge and valuation methodology used by investors
      - - Employee-count proxy
        - 96 employees as of Sep 26 per Tracxn
        - Medium
        - One of the few external operating-scale proxies in the retained pool
        - Monthly payroll, R&D vs manufacturing split, and planned hiring pace
      - - Revenue / gross margin / burn / runway / debt
        - null
        - Low
        - Core underwriting metrics remain undisclosed publicly
        - Monthly revenue by product line, gross-margin bridge, burn, runway, debt and covenant schedule
    notes: Null means the retained public sources do not disclose the metric; high-confidence rows are financing facts, not proof of cash efficiency or profitability.
    claimRefs: [CI001, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a hardware-design-win revenue bridge, but not a quantified margin bridge.
    data:
      nodes:
        - id: demand
          label: Thermal bottleneck at hyperscaler or edge OEM
          detail: Public evidence centers on AI data-center heat density and sustained edge-AI workloads.
        - id: qualify
          label: Design win, concept, or deployed pilot
          detail: Public examples include Lenovo concept notebooks, CES demos, and a YUAN camera deployment.
        - id: ship
          label: Frore component or coldplate ships
          detail: Revenue would begin with hardware shipments of LiquidJet, LiquidJet Nexus, AirJet, or AirJet PAK.
        - id: integrate
          label: Customer system sustains higher performance
          detail: Official materials tie the products to better compute density, sustained performance, or lower throttling.
        - id: recognize
          label: Revenue recognized from hardware sale or integration program
          detail: Public sources do not disclose ASP, volume, discounting, or any recurring service layer.
        - id: margin
          label: Gross profit depends on yield, support, and manufacturing scale
          detail: Public evidence implies manufacturing and engineering intensity but does not quantify margin or burn.
    claimRefs: [CI004, CI007, CI009, CI010, CI011, CI014]
callouts:
  - calloutType: insight
    title: Capital access is proven; operating disclosure is not
    body: >-
      The strongest public financial evidence is financing capacity: Frore has recently raised a large round from recognizable investors, but public disclosures still stop short of revenue and margin reporting.
    claimRefs: [CI001, CI002, CI014]
  - calloutType: risk
    title: Edge traction is visible, but still not revenue-grade
    body: >-
      Public AirJet evidence shows named concepts, demos, and at least one deployed platform, yet that evidence does not quantify paid production volume, pricing, or customer concentration.
    claimRefs: [CI007, CI008, CI009, CI010, CI013]
  - calloutType: recommendation
    title: Underwrite with a private hardware-economics bridge
    body: >-
      The next diligence step should be a customer-by-customer shipment bridge with ASPs, gross margins, burn, runway, and debt terms separated by LiquidJet, LiquidJet Nexus, AirJet Mini, and AirJet PAK.
    claimRefs: [CI013, CI014]
