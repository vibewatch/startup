company:
  name: Frore Systems
chapter:
  number: 7
  title: Risks
  summary: >-
    Frore's highest public downside is execution stretch rather than a confirmed
    external proceeding: the company is simultaneously scaling Taiwan-based
    hardware manufacturing, pushing both edge and data-center cooling platforms,
    and defending a roughly $1.6B private valuation with limited public
    financial and governance disclosure. Public mitigants exist, but they are
    mostly product-design claims rather than independent field, customer, or
    regulatory evidence.
sections:
  - id: ranked-risk-overview
    title: Ranked risk overview
    body: >-
      Frore's risk stack is driven less by a disclosed lawsuit or recall in the
      assigned public pool than by execution stretch. Public materials place
      manufacturing in Taiwan while the company simultaneously markets AirJet
      for edge devices and LiquidJet / LiquidJet Nexus for AI data centers.
      Independent reporting confirms that the March 2026 financing is intended
      to accelerate scale-up, while valuation references cluster around $1.6B.
      That combination raises the consequence of any manufacturing delay,
      qualification slip, or weak conversion from company-issued partner proof
      into repeat production revenue.
    claimRefs: [CR001, CR002, CR004, CR006, CR007, CR011, CR014]
    figureRefs: [FR001]
  - id: legal-regulatory-and-financing-opacity
    title: Legal, regulatory, and financing opacity
    body: >-
      The assigned evidence set does not surface a regulator, court, or
      enforcement record for Frore, so the immediate legal risk is information
      opacity rather than a confirmed public proceeding. That opacity matters
      because downside underwriting still depends on private-company facts that
      are not disclosed here: preference terms, debt, contingent liabilities,
      certifications, warranty exposure, and dispute history. Market-data pages
      explicitly warn that publicly reported figures are limited or conflicting,
      while private-market platforms frame Frore exposure as illiquid,
      accredited-investor private-company security rather than public stock.
    claimRefs: [CR007, CR009, CR010, CR012, CR013, CR014]
    tableRefs: [TR001]
  - id: operational-and-partner-dependencies
    title: Operational and partner dependencies
    body: >-
      Operationally, Frore is still a hardware scale-up story. Official
      materials say the company has manufacturing operations in Taiwan and a
      portfolio spanning edge cooling chips and data-center liquid-cooling
      systems. Partner proof is improving but still uneven: the September 2026
      Lenovo announcement is explicitly for a concept notebook, and the named
      iodyne integration is also company-issued evidence rather than an
      independent case study with shipment, renewal, or margin data. The result
      is a partner-conversion risk: market interest is visible, but production
      depth and customer concentration remain under-disclosed.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR008, CR011, CR015]
    tableRefs: [TR002, TR003]
  - id: mitigations-and-thesis-breaks
    title: Mitigations and thesis-break triggers
    body: >-
      Public mitigants exist, but they are mostly engineering attributes rather
      than operating statistics. Frore highlights no moving mechanical parts,
      dustproof and water-resistant operation, and LiquidJet Nexus designs that
      eliminate hoses and connectors; those claims could reduce field-failure
      modes if they hold at scale. Before underwriting the current price
      narrative, the key diligence gates are independent field-reliability data,
      production customer proof, and private-company governance detail. A
      thesis break would be weak design-win conversion after the March 2026
      raise, materially worse economics than marketing surfaces imply, or new
      disclosures showing cap-table or liability terms that compress investor
      upside.
    claimRefs: [CR005, CR006, CR009, CR010, CR011, CR012, CR013, CR014]
callouts:
  - calloutType: risk
    title: Highest residual risk
    body: >-
      The biggest public downside is not a confirmed lawsuit or recall; it is
      that a still-private hardware company must scale manufacturing, customer
      conversion, and two distinct product families fast enough to justify a
      unicorn valuation before independent operating evidence catches up.
    claimRefs: [CR001, CR002, CR006, CR007, CR009, CR011]
  - calloutType: recommendation
    title: Kill criteria before a priced entry
    body: >-
      Do not underwrite the current narrative without independent production
      customer validation, field-reliability metrics, and private-company
      capital-structure detail. If those remain unavailable after the 2026
      scale-up financing, the valuation case remains more marketing-led than
      diligence-ready.
    claimRefs: [CR006, CR009, CR010, CR012, CR013, CR014]
