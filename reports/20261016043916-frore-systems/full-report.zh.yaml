              由于公开记录没有收入或单位经济性，情景分析只能按里程碑定性推进。乐观情景要求出现具名超大规模云厂商或 OEM 量产部署，并有财务披露 证明 2026 年 3
              月轮次不只是给未来期权价值定价。基准情景是产品和合作伙伴继续推进，但在独立客户和财务证据改善前保持入场纪律。悲观情景是 Frore
