      - number: '2.3'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              可获取记录中最强的采用驱动因素，是 AI 带来的散热瓶颈，以及更好散热带来的运营经济性收益。Frore 的 2026 年材料将需求与更高计算密度、更低 PUE、 更低功耗和用水量联系起来；Lenovo 的
              2026 年概念笔记本公告又增加了持续 AI 推理负载这一新的边缘设备驱动因素。这些信号说明需求确有紧迫性，但估值 所需的精确证据仍很薄弱。可获取来源没有披露具名超大规模云厂商量产部署、买方预算或 attach
              rate，也没有按细分市场给出自下而上的 SAM/SOM。 因此，公开证据更支持“规模可观但转化验证不完整的相邻机会”，还不足以支撑完全承销的市场份额判断。
