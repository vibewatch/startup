      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Frore 最强的战略论点是业务广度：一套方案面向轻薄边缘设备，另一套面向 AI 数据中心；2026 年证据显示公司仍在用融资和 OEM 展示推动这一叙事。
              弱点是，大多数公开竞争验证仍停留在收入或定价之前——CES 演示、概念笔记本、生态背书和公司自述的产品主张。技术不一定弱，但持久性仍取决于运营执行： 把合作伙伴兴趣转化为反复量产项目，抵御已进入 OEM
              供应链的风扇和冷板供应商，并证明公开定价不透明掩盖的是差异化经济性，而不是商业化尚未成熟。
            claimRefs:
              - CP011
              - CP014
