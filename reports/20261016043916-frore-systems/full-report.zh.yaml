      - - 技术平台看起来具备差异化
        - 公司材料称 LiquidJet 提升效率、Nexus 提高机架密度、AirJet Mini 改善边缘设备性能。
        - 若独立基准测试或具名量产部署在规模化场景中验证这些指标，论点会更有力。
      - - 合作伙伴和上市证据正在改善
