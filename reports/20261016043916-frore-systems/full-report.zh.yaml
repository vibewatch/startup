  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Frore 的市场边界比泛化的“热管理”更窄，却比单一产品利基更宽。公司和第三方描述都将业务分为两条切入点：面向 AI 数据中心硬件的直接液冷，以及面向
              紧凑型边缘设备的固态主动冷却。两条切入点的采用逻辑、现有替代方案和预算负责人都不同。边缘设备的现状替代方案是风扇或被动散热，可能导致降频或无法 适配 Frore
              目标的外形尺寸；数据中心的替代方案则是更传统的液冷硬件，包括软管、连接器、歧管和更重的冷板。因此，这不是一个单一 TAM 故事，而是 覆盖两个彼此相关、但买方问题不同的热性能命题。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM014
              - CM015
