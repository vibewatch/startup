  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与实际替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据指向一个围绕热管理任务构建的竞争集合，而不是单一产品类别。Frore 自有页面和第三方摘要将 AirJet 放在紧凑型边缘设备，将 LiquidJet 和 LiquidJet Nexus 放在 AI
              服务器与数据中心；买方可以根据外形尺寸，用完全不同的架构解决同一个散热问题。边缘侧，Frore 想替代的是薄型设备中的
              风扇散热；机架侧，替代方案是仍依赖软管、连接器和歧管的标准液冷冷板与托盘组件。这对尽调很重要：Frore 实际上同时争夺两个相邻市场——静音、无风扇 的边缘系统，以及更高功率的液冷 AI 基础设施。
