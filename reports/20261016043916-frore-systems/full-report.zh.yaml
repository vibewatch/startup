  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 出现具名超大规模云厂商或 OEM 量产订单，公司财务披露改善，且 LiquidJet/AirJet 指标转化为可重复部署。
        - 只有公开证据以清晰的商业化数据追上价格，2026 年 3 月轮融资的价格才可能得到支撑或被超越。
        - 制造规模化及将演示转为量产的执行风险。
        - 存在可能，但保留的公开证据尚未证明。
      - - 基准
        - 产品和合作伙伴势头延续，但收入和客户集中度仍大多未公开。
        - 投资者应将最新轮融资视为参考点，而非明显的低价机会，并等待证据或更好条款。
        - 估值仍领先于经独立验证的基本面。
        - 与当前来源集合最一致。
      - - 悲观
        - LiquidJet 仍以试点为主、客户证据仍无具名信息，或未来轮融资面临倍数压缩和更苛刻的融资条款。
        - 后续投资者需要更低的入场估值或更强的下行保护，以补偿运营证据缺失。
        - 下轮融资风险、结构风险及商业化慢于预期。
        - 若披露在下一融资周期仍稀疏，影响将很大。
    notes: 情景表述是定性的，因为保留公开证据未披露构建可辩护模型所需的收入、利润率或股权表机制。
