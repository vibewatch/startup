  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品在客户工作流中的覆盖
        blocks:
          - type: paragraph
            body: >
              Frore 已不再只是单一的实验性冷却芯片。当前产品叙事覆盖面向客户端和边缘设备的 AirJet，以及面向 AI 数据中心直接到芯片液冷的 LiquidJet / LiquidJet
              Nexus，因此可以处理两类工作流瓶颈：受散热约束的紧凑系统，以及高密度加速器托盘。公开材料将 AirJet 用于笔记本电脑、 迷你 PC、摄像头、SSD、智能手机和边缘 AI SoM；LiquidJet
              则面向超大规模计算环境中的 GPU 和 ASIC 散热。


              工作流证据在具名演示和概念集成处最强，而不是匿名的未来 OEM 项目。Lenovo AeroBlade 概念笔记本、iodyne Pro Mini 存储公告，以及围绕 Micron、MacBook
              Air、Samsung 和 Zotac 的 CES 演示，都说明 Frore 能把冷却硬件集成进真实设备概念和参考平台。这一点很重要，因为 Frore 的销售
              路径似乎依赖被设计进第三方系统，而不是单独出货终端产品。


              局限在于，这些参考大多证明技术适配和合作伙伴兴趣，并未证明规模化量产采用。公开来源没有给出出货量、装配率、客户集中度，也没有区分演示、概念、 试点和量产部署的构成。尽调时应区分两件事：Frore
              确实覆盖边缘和数据中心的热管理问题，但公开采用证据仍落后于产品叙事的广度。
