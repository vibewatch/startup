      - number: '4.4'
        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              Frore 的短期融资位置明显强于公开运营披露。多份保留来源共同证实 2026 年 3 月的 Series D、具名投资者和累计筹资 $340 million，说明公司获得增长资本
              并不困难。问题在于，同一公开记录仍未披露本轮融资后的现金余额、现金消耗、资金续航、债务，或产品层面的收入和利润率质量。仅凭公开证据，投资者可以
              评估市场兴趣和产品雄心，却无法评估资本效率或实现自我造血单位经济性的时间。
