      - number: '3.3'
        title: 分销能力、转换成本与定价不透明
        blocks:
          - type: paragraph
            body: >-
              Frore 的公开获客路径更偏 B2B，而非消费端驱动。官网与隐私政策都面向客户和潜在客户；公开证据主要围绕 Lenovo、Micron、Intel、Qualcomm 等 OEM
              和组件合作伙伴，尚无广泛的具名量产客户名单。由此看，分销杠杆要靠大型硬件厂商和系统集成商的设计导入，而非自助式采用。切换成本也不低：Mayfield 称，Frore 曾不得不在 Taiwan
              自建晶圆厂，之后才靠扩充产能和引入许可合作伙伴扩张；其液冷方案还需要改造托盘级散热栈。最大公开盲区仍是定价和打包方案：指定的竞品定位和定价检索均无结果，买方和投资者暂时无法依据公开来源，把合同模式、折扣和系统总体经济性与同业逐项比较。
