            body: >-
              指定资料池中唯一明确的同业名单来自 Tracxn，列出 Phononic、JETCOOL Technologies 和 Corintis 作为 Frore 最接近的竞争对手。该名单也显示市场分成
              不同技术路线：Phononic 被描述为固态热管理厂商，JETCOOL 和 Corintis 则是直接到芯片或微流体液冷供应商。换言之，AirJet 面向紧凑设备的热管理替代 方案竞争，LiquidJet
