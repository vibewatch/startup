  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的领域集中在制造集中度、商业化拉伸、披露不透明，以及缺乏流动性的私募市场敞口。
    data:
      columns:
        - label: 可能性
          note: 当前公开证据集所暗示的概率。
        - label: 影响
          note: 风险发生后对投资论点的影响。
        - label: 缓释成熟度
          note: 公开记录中的缓释证据，不是私下保证。
        - label: 剩余敞口
          note: 扣除当前已披露缓释措施后仍剩余的下行风险。
      rows:
        - label: 制造集中度
          note: 台湾业务仍是已披露的单一地域支点。
          values:
            - label: 高
              tone: high
              note: 公开信息显示制造业务与台湾绑定。
            - label: 高
              tone: critical
              note: 硬件交付延迟会同时冲击边缘和数据中心业务线。
            - label: 中
              tone: warning
              note: 缓解措施主要是产品 / 流程表述。
            - label: 高
              tone: critical
              note: 未披露公开的冗余或应急产能。
        - label: 双平台扩张
          note: AirJet 与 LiquidJet / Nexus 正在并行扩张。
          values:
            - label: 高
              tone: high
              note: 近期融资明确用于扩张。
            - label: 高
              tone: critical
              note: 错过里程碑会削弱 $1.6B 估值叙事。
            - label: 中
              tone: warning
              note: 公开缓释措施没有交付指标。
            - label: 高
              tone: critical
              note: 出货、利润率和认证数据仍然稀少。
        - label: 披露不透明
          note: 私营公司的透明度仍然有限。
          values:
            - label: 高
              tone: high
              note: 公开数据被描述为有限，或彼此冲突。
            - label: 高
              tone: critical
              note: 股权表和负债盲区会扭曲下行风险估算。
            - label: 低
              tone: warning
              note: 除管理层披露外，没有看到公开补救措施。
            - label: 高
              tone: critical
              note: 优先权、债务和争议条款仍披露不足。
        - label: 流动性 / 退出风险
          note: 敞口仍在私募市场，而非公开市场。
          values:
            - label: 高
              tone: high
              note: 二级流动性被描述为私募配售活动。
            - label: 中
              tone: warning
              note: 如果经营结果令人失望，或退出时点推迟，该风险的影响最大。
            - label: 低
              tone: warning
              note: 虽然存在相关平台，但它们没有形成广泛的公开市场。
            - label: 高
              tone: high
              note: 来源文本明确提到持有期和潜在损失。
        - label: 合作伙伴证据集中度
          note: 公开证据仍主要依赖公司发布的公告。
          values:
            - label: 高
              tone: high
              note: 来源池中关于 Lenovo 和 iodyne 的证据均由公司发布。
            - label: 高
              tone: high
              note: 如果把公告转化为生产的能力弱，会损害投资论点。
            - label: 中
              tone: warning
              note: 具名参考案例显示存在一定需求，但不能证明独立的持续性。
            - label: 高
              tone: high
              note: 客户集中度和重复订单数据仍未披露。
        - label: 生态依赖
          note: 产品叙事取决于外部计算平台能否被采用。
          values:
            - label: 中
              tone: warning
              note: 公开产品摘要显示其与 NVIDIA 相关的兼容性。
            - label: 中
              tone: warning
              note: 第三方路线图或认证变化可能放缓采用进度。
            - label: 低
              tone: warning
              note: 公开缓释措施没有显示广泛的多平台收入组合。
            - label: 中
              tone: warning
              note: 生态风险不容忽视，但不如制造集中度风险紧迫。
