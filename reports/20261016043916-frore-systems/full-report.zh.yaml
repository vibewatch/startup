        - label: 数据中心扩张仍待验证
          actor: AI 基础设施买方
          detail: LiquidJet 具有战略重要性，但保留的来源没有点名生产环境数据中心客户。
          touchpoints:
            - 扩张叙事
            - 没有具名生产客户
            - 独立验证仍然有限
          tone: warning
        - label: 续约与客户集中度证据仍缺失
          actor: CFO 与客户成功尽调
          detail: 公开来源没有披露客户数量、NRR、GRR、流失率或头部客户敞口。
          touchpoints:
            - 没有客户群组指标
            - 没有头部客户收入拆分
            - 需提出尽调请求
          tone: risk
