    keyQuote: >-
      SAN JOSE, Calif., March 16, 2026 /PRNewswire/ -- Frore Systems today announced it has achieved Unicorn status
      following the close of a $143 million Series D financing round, bringing total capital raised to $340 million and
      valuing the company at $1.64 billion. The new funding will accelerate global scale-up of Frore's breakthrough
      thermal platforms, LiquidJet, LiquidJet Nexus and AirJet, across data center and edge markets, as demand for AI
      infrastructure surges worldwide.


      Frore Systems Founders: CEO Seshu Madhavapeddy and CTO Surya Ganti.
