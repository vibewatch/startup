evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited revenue, run-rate, gross margin, and customer-count disclosure by product line.
    whyItMatters: >-
      A $1.64 billion valuation cannot be pressure-tested without understanding whether product momentum is converting
      into repeatable revenue and margin.
    diligencePath: >-
      Request board-approved KPI packs, audited financials, and customer concentration reports tied to AirJet versus
      LiquidJet programs.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-transparency
    missingEvidence: Board composition, independent-director presence, governance committees, and formal delegation of authority.
    whyItMatters: >-
      Founder-centric leadership can be a strength, but without governance visibility it is hard to assess oversight,
      succession, and control rights.
    diligencePath: >-
      Request board list, committee charters, investor-rights agreements, and any observer or protective-provision
      schedules.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Cap-table mechanics, liquidation preferences, debt or credit facilities, and any meaningful secondary-sale
      activity.
    whyItMatters: >-
      Economic seniority and hidden leverage can materially change downside protection and the meaning of the headline
      post-money valuation.
