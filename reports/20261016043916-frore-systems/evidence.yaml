      ### Company Details


      Provider of advanced thermal management and cooling technologies. It develops innovative technologies for AI
      infrastructure, data centers, industrial embedded devices, and consumer electronics. Its flagship products include
      LiquidJet™, a direct-to-chip liquid cooling platform for AI servers and hyperscale data centers, and AirJet®, a
      solid-state active cooling chip that delivers silent, compact, dustproof, and vibration-free cooling for
      high-performance edge devices.
