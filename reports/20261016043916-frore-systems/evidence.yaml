    keyQuote: >-
      Frore Systems has raised $143 million in a Series D funding round that values the liquid cooling vendor at $1.64
      billion.


      The new funding will accelerate the scale-up of Frore’s LiquidJet, LiquidJet Nexus, and AirJet products for data
      center and Edge deployments.


      California-based Frore has now raised $340 million in total, and the Series D round was led by MVP Ventures, with
      participation from Fidelity Management & Research Company, Top Tier, Mayfield Fund, Clear Ventures, Addition,
      Qualcomm Ventures, StepStone Group, and Alumni Ventures.
