company:
  name: "Frore Systems"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Frore Systems is a San Jose thermal-management company that by March 2026 had
    raised $340 million, including a $143 million Series D at a $1.64 billion
    valuation, while extending its product line from AirJet edge cooling into
    LiquidJet and LiquidJet Nexus for AI data centers. The retained sources show
    credible product and capital momentum, including a Lenovo concept notebook
    showcase and a 2025 LiquidJet launch, but still leave revenue, customer,
    governance, and financing-term disclosure thin.
sections:
  - id: "identity-and-scope"
    title: "Identity, location, and product scope"
    body: >-
      Frore positions itself as a thermal-technology company spanning both edge
      devices and AI data centers rather than a single-product component vendor.
      The retained official materials consistently describe AirJet as the edge
      cooling platform and LiquidJet plus LiquidJet Nexus as the liquid-cooling
      stack for denser AI compute environments. Public company materials also
      place the headquarters in San Jose/Silicon Valley and describe
      manufacturing operations in Taiwan, which matters because later diligence
      on scale-up, gross margin, and geopolitical exposure will run through that
      footprint. Tracxn and company materials align on a 2018 founding window,
      but the retained pack does not provide a more detailed corporate history
      beyond the legal-entity and product-launch milestones captured below.
    claimRefs: ["CO001", "CO002", "CO003"]
    tableRefs: ["TO001"]
  - id: "leadership-and-capital"
    title: "Founders, leadership, and capital formation"
    body: >-
      The retained source pack directly names Seshu Madhavapeddy as founder and
      CEO and Surya Ganti as co-founder and CTO, giving a clear operating center
      around the two technical founders even though it does not expose broader
      board composition or control terms. Capital formation is better documented:
      Frore's March 2026 Series D added $143 million at a $1.64 billion
      valuation and brought cumulative disclosed funding to $340 million, with
      MVP Ventures leading and several repeat investors returning. That investor
      continuity supports the current stage classification, but the absence of
      cap-table mechanics, liquidation preferences, or debt details means
      governance and downside economics remain under-documented.
    claimRefs: ["CO004", "CO005", "CO006", "CO007", "CO008"]
    tableRefs: ["TO002", "TO003"]
  - id: "scale-signals-and-disclosure-gaps"
    title: "Scale signals, commercial proof, and disclosure gaps"
    body: >-
      Frore's strongest public scale signals are external funding, repeated
      product announcements, and named ecosystem relationships rather than
      disclosed operating metrics. The retained pack provides one third-party
      employee estimate and multiple product and partnership references, but it
      does not verify revenue, customer count, concentration, or financing terms
      that would anchor a valuation read-through. That leaves the company
      looking commercially promising but still evidence-light on the core
      private-company metrics an investor would need to judge whether product
      momentum is converting into durable revenue quality and governance
      resilience.
    claimRefs: ["CO011", "CO012", "CO013", "CO014"]
  - id: "milestone-path"
    title: "Milestone path from AirJet to LiquidJet"
    body: >-
      The milestone record shows a company that first won attention with AirJet
      for compact edge devices and then broadened into liquid cooling as AI
      infrastructure heat loads climbed. The retained official pages preserve a
      visible chronology: Frore references emerging from stealth around CES
      2023, showcased high-profile AirJet demonstrations in early 2024, raised
      an $80 million Series C in May 2024, introduced LiquidJet in October
      2025, raised the Series D in March 2026, and was still adding OEM-facing
      proof points by Lenovo Innovation World in September 2026. That
      progression supports the thesis that Frore is trying to own a broader
      thermal stack, not just a niche cooling component.
    claimRefs: ["CO008", "CO009", "CO010", "CO011"]
    figureRefs: ["FO001"]
