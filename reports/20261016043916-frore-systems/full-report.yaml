      - number: '2.2'
        title: Sizing lenses and buyer map
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence supports adjacent market lenses, not a clean bottom-up Frore TAM/SAM/SOM.
              TAMradar provides broad category numbers for data-center cooling and for solid-state cooling, while
              Frore's own materials emphasize AI-compute growth and thermal urgency rather than a quantified
              addressable-revenue bridge. That means the numbers are useful as directional demand markers, but they are
              not interchangeable and should not be rolled into a single market estimate. The buyer map also splits
              cleanly by product motion: LiquidJet and LiquidJet Nexus fit server, rack, and compute-tray programs,
              while AirJet maps to OEM device teams shipping notebooks, gateways, SSD accessories, cameras, and other
              compact systems. Frore's valuation case therefore depends on winning two different commercialization paths
              instead of one uniform procurement motion.
