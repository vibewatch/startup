  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Frore's market boundary is narrower than "thermal management" as a generic category but broader than a
              single product niche. Current company and third-party descriptions consistently place the business across
              two wedges: direct liquid cooling for AI data-center hardware and solid-state active cooling for compact
              edge devices. That matters because the adoption logic, incumbent alternatives, and budget owners are
              different across those wedges. In edge devices, the status-quo substitute is fan or passive cooling that
              leads to thermal throttling or cannot fit the form factor Frore targets. In data centers, the substitute
              is more conventional liquid-cooling hardware with hoses, connectors, manifolds, and heavier coldplates.
              The market story is therefore not one monolithic TAM; it is a thermal-performance thesis spanning separate
              but related buyer problems.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
