  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual risks cluster around manufacturing concentration, commercialization stretch, disclosure
      opacity, and illiquid private-market exposure.
    data:
      columns:
        - label: Likelihood
          note: Probability implied by the current public evidence set.
        - label: Impact
          note: Consequence to the investment case if the risk materializes.
        - label: Mitigation maturity
          note: Publicly documented mitigation evidence, not private assurances.
        - label: Residual exposure
          note: Remaining downside after the currently disclosed mitigants.
      rows:
        - label: Manufacturing concentration
          note: Taiwan operations remain a disclosed single-geo anchor.
          values:
            - label: High
              tone: high
              note: Manufacturing operations are publicly tied to Taiwan.
            - label: High
              tone: critical
              note: Hardware delivery delays would hit both edge and data-center lines.
            - label: Medium
              tone: warning
              note: Mitigation is mostly product/process messaging.
            - label: High
              tone: critical
              note: No public redundancy or contingency capacity is disclosed.
        - label: Dual-platform scale-up
          note: AirJet and LiquidJet / Nexus are scaling in parallel.
          values:
            - label: High
              tone: high
              note: Recent funding is explicitly earmarked for scale-up.
            - label: High
              tone: critical
              note: Missed milestones would undercut a $1.6B narrative.
            - label: Medium
              tone: warning
              note: Public mitigants do not include delivery metrics.
            - label: High
              tone: critical
              note: Shipment, margin, and qualification data remain sparse.
        - label: Disclosure opacity
          note: Private-company transparency remains limited.
          values:
            - label: High
              tone: high
              note: Public figures are described as limited or conflicting.
            - label: High
              tone: critical
              note: Cap-table and liability blind spots distort downside sizing.
            - label: Low
              tone: warning
              note: No public cure beyond management disclosure is visible.
            - label: High
              tone: critical
              note: Preference, debt, and dispute terms remain under-disclosed.
        - label: Liquidity / exit risk
          note: Exposure remains private-market rather than public-market.
          values:
            - label: High
              tone: high
              note: Secondary liquidity is framed as private-placement activity.
            - label: Medium
              tone: warning
              note: It matters most if operating results disappoint or exit timing slips.
            - label: Low
              tone: warning
              note: Platforms exist, but they do not create a broad public market.
            - label: High
              tone: high
              note: Holding periods and potential loss are explicit in the source text.
        - label: Partner-proof concentration
          note: Public evidence still leans on company-issued announcements.
          values:
            - label: High
              tone: high
              note: Lenovo and iodyne proof in the pool is company-issued.
            - label: High
              tone: high
              note: Weak conversion from announcements to production would hurt the thesis.
            - label: Medium
              tone: warning
              note: Named references show some demand, but not independent durability.
            - label: High
              tone: high
              note: Customer concentration and repeat-order data remain undisclosed.
        - label: Ecosystem dependence
          note: Product narratives lean on external compute-platform adoption.
          values:
            - label: Medium
              tone: warning
              note: NVIDIA-related compatibility is visible in public product summaries.
            - label: Medium
              tone: warning
              note: Third-party roadmap or qualification changes could slow uptake.
            - label: Low
              tone: warning
              note: Public mitigants do not show broad multi-platform revenue mix.
            - label: Medium
              tone: warning
              note: Ecosystem risk is meaningful but less acute than manufacturing concentration.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006
      - CR007
      - CR009
      - CR010
      - CR012
      - CR013
      - CR015
