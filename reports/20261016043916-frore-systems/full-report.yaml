      - number: '6.2'
        title: Named proof exists, but production status is uneven
        blocks:
          - type: paragraph
            body: >-
              Frore does have more than logo-level customer evidence. Its January 2025 milestone release said customers
              had launched commercial products using AirJet in Mini PCs, industrial tablets, AI edge gateways, and
              professional SSD drives, and it separately said high-volume shipments started in January 2024. Public
              named examples include Micron and Crucial in a CES2024 SSD demo, Zotac in a Mini PC, and Lenovo's
              AeroBlade concept notebook at Innovation World 2026. Those examples demonstrate real evaluation,
              design-in, and commercialization activity across multiple device categories. But proof quality varies:
              Lenovo was still a concept notebook, several other examples were show-floor demonstrations, and none of
              the retained sources tie those launches to unit volumes, repeat orders, or revenue contribution.
            claimRefs:
              - CU002
              - CU003
              - CU004
