        title: Identity, location, and product scope
        blocks:
          - type: paragraph
            body: >-
              Frore positions itself as a thermal-technology company spanning both edge devices and AI data centers
              rather than a single-product component vendor. The retained official materials consistently describe
              AirJet as the edge cooling platform and LiquidJet plus LiquidJet Nexus as the liquid-cooling stack for
              denser AI compute environments. Public company materials also place the headquarters in San Jose/Silicon
