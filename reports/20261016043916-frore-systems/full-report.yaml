      - number: '3.3'
        title: Distribution power, switching costs, and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Frore's public route to market looks more business-to-business than consumer-led. Its site and privacy
              policy are written for customers and potential customers, while the public proof points revolve around OEM
              and component partners such as Lenovo, Micron, Intel, and Qualcomm rather than a broad list of named
              production customers. That implies distribution leverage will come from design wins with major hardware
              vendors and system builders, not self-serve adoption. Switching costs also look nontrivial: Mayfield says
              the company had to build its own fab in Taiwan and then expand via additional capacity and licensing
              partners, while Frore's liquid-cooling pitch depends on changing the tray-level thermal stack itself. The
              biggest public blind spot is pricing and packaging transparency; the assigned competitor searches for
              positioning and pricing returned no hits, so buyers and investors cannot yet do a clean, source-backed
              apples-to-apples comparison of contract model, discounting, or total system economics versus peers.
