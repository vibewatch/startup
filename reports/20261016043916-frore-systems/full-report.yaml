  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product footprint in customer workflows
        blocks:
          - type: paragraph
            body: >
              Frore is no longer presenting a single experimental cooling chip. The current product story spans AirJet
              for client and edge devices plus LiquidJet/LiquidJet Nexus for direct-to-chip liquid cooling in AI data
              centers, which lets the company address two different workflow bottlenecks: thermally constrained compact
              systems and high-density accelerator trays. Public materials place AirJet in notebooks, mini PCs, cameras,
              SSDs, smartphones, and edge AI SoMs, while LiquidJet is framed around GPU and ASIC cooling for
              hyperscale-style compute environments.


              The workflow evidence is strongest where Frore can point to named demonstrations and concept integrations
              rather than anonymous future OEM programs. Lenovo's AeroBlade concept notebook, the iodyne Pro Mini
              storage announcement, and CES demo examples around Micron, MacBook Air, Samsung, and Zotac all show that
              Frore can get its cooling hardware integrated into real device concepts and reference platforms. That
              matters because Frore's sales motion appears to depend on being designed into third-party systems instead
              of shipping a standalone end-product.


              The limitation is that these references mostly prove technical fit and partner interest, not scaled
              production adoption. Public sources do not establish shipped-unit volumes, attach rates, customer
              concentration, or the mix between demo, concept, pilot, and production deployments. For diligence, the key
              distinction is that Frore has credible workflow coverage across edge and data-center thermal problems, but
              public adoption proof still trails the breadth of the product narrative.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
