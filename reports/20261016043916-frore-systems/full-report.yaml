              - CV002
              - CV003
              - CV010
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The pro-investment case is straightforward. Frore has continued to attract capital, public partner
              announcements, and a steady flow of product launches, while company materials claim meaningful
              thermal-performance gains for both LiquidJet and AirJet. The anti-thesis is equally clear. The strongest
              operating proof remains company-controlled; a SiliconANGLE report says Frore serves cloud, enterprise, and
              government customers but also notes the company declined to name them, and the retained sources still do
              not disclose the financial metrics that would let an outside investor test whether the March 2026 price is
              justified by repeatable commercialization rather than narrative momentum.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios, downside triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Because the public record does not expose revenue or unit economics, scenario work has to stay qualitative
              and milestone-driven. The bull case requires named hyperscaler or OEM production deployments plus
              financial disclosure that shows the March 2026 round was not simply valuing future option value. The base
              case is continued product and partner progress but with entry discipline until independent customer and
              financial proof improves. The bear case is that Frore has real technical differentiation but insufficient
              public evidence of scaled adoption, leaving downside if commercialization remains pilot-heavy or if a
              later round resets valuation expectations. Those gaps make customer proof, financial disclosure, and
              preference overhang the last major diligence gates.
            claimRefs:
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Frore merits continued diligence, but the public evidence here supports research-more rather than buy at
              the last reported round price.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV014
              - CV015
              - CV016
          - type: callout
            title: What can still break the thesis
            body: >-
              The biggest open risk is not whether Frore can tell a strong technical story; it is whether the company
              can convert that story into named production customers and disclosed economics before the next financing
              test.
            calloutType: risk
            claimRefs:
              - CV010
              - CV014
              - CV015
