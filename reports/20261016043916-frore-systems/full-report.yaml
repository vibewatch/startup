      - number: '1.4'
        title: Milestone path from AirJet to LiquidJet
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that first won attention with AirJet for compact edge devices and
              then broadened into liquid cooling as AI infrastructure heat loads climbed. The retained official pages
              preserve a visible chronology: Frore references emerging from stealth around CES 2023, showcased
              high-profile AirJet demonstrations in early 2024, raised an $80 million Series C in May 2024, introduced
              LiquidJet in October 2025, raised the Series D in March 2026, and was still adding OEM-facing proof points
              by Lenovo Innovation World in September 2026. That progression supports the thesis that Frore is trying to
              own a broader thermal stack, not just a niche cooling component.
