      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest strategic argument for Frore is breadth: it can pitch one family of solutions into thin edge
              devices and another into AI data centers, and 2026 evidence shows it is still using both financing and OEM
              showcases to push that story forward. The weaker point is that most public competitive proof remains
              pre-revenue or pre-pricing in tone—CES demos, concept notebooks, ecosystem endorsements, and
              company-authored product claims. That does not mean the technology is weak, but it does mean durability is
              still tied to operational execution: converting partner interest into repeated production programs,
              defending against incumbent fan and coldplate vendors that already sit inside OEM supply chains, and
              proving that public pricing opacity masks differentiated economics rather than immature commercialization.
            claimRefs:
