  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer surface spans edge OEMs today and data-center buyers aspirationally
        blocks:
          - type: paragraph
            body: >-
              Frore's public customer story is clearest in edge devices. The company website and product material
              position AirJet across consumer, industrial, and IoT hardware, while the LiquidJet line is aimed at AI
              data-center compute trays and direct-to-chip cooling. That means the practical buyer set is not one
              homogeneous customer base: edge-device OEMs, storage and peripheral vendors, embedded AI system builders,
              and prospective data-center operators all sit on different qualification cycles and revenue profiles. The
              retained proof also shows the edge side is materially more mature than the data-center side. Frore
              publicly describes commercial launches and shipment ramp for AirJet, whereas the data-center story is
              still framed around scale-up plans and product positioning rather than named production customers.
            claimRefs:
              - CU001
              - CU002
