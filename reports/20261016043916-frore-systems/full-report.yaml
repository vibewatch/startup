              - CR010
              - CR012
              - CR013
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and financing opacity
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence set does not surface a regulator, court, or enforcement record for Frore, so the
              immediate legal risk is information opacity rather than a confirmed public proceeding. That opacity
              matters because downside underwriting still depends on private-company facts that are not disclosed here:
              preference terms, debt, contingent liabilities, certifications, warranty exposure, and dispute history.
              Market-data pages explicitly warn that publicly reported figures are limited or conflicting, while
              private-market platforms frame Frore exposure as illiquid, accredited-investor private-company security
              rather than public stock.
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: Operational and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Operationally, Frore is still a hardware scale-up story. Official materials say the company has
              manufacturing operations in Taiwan and a portfolio spanning edge cooling chips and data-center
              liquid-cooling systems. Partner proof is improving but still uneven: the September 2026 Lenovo
              announcement is explicitly for a concept notebook, and the named iodyne integration is also company-issued
              evidence rather than an independent case study with shipment, renewal, or margin data. The result is a
              partner-conversion risk: market interest is visible, but production depth and customer concentration
              remain under-disclosed.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
              - CR011
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR008
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Mitigations and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public mitigants exist, but they are mostly engineering attributes rather than operating statistics. Frore
              highlights no moving mechanical parts, dustproof and water-resistant operation, and LiquidJet Nexus
              designs that eliminate hoses and connectors; those claims could reduce field-failure modes if they hold at
              scale. Before underwriting the current price narrative, the key diligence gates are independent
              field-reliability data, production customer proof, and private-company governance detail. A thesis break
              would be weak design-win conversion after the March 2026 raise, materially worse economics than marketing
              surfaces imply, or new disclosures showing cap-table or liability terms that compress investor upside.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual risk
            body: >-
              The biggest public downside is not a confirmed lawsuit or recall; it is that a still-private hardware
              company must scale manufacturing, customer conversion, and two distinct product families fast enough to
              justify a unicorn valuation before independent operating evidence catches up.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR009
              - CR011
          - type: callout
            title: Kill criteria before a priced entry
            body: >-
              Do not underwrite the current narrative without independent production customer validation,
              field-reliability metrics, and private-company capital-structure detail. If those remain unavailable after
              the 2026 scale-up financing, the valuation case remains more marketing-led than diligence-ready.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and price discipline
        blocks:
          - type: paragraph
            body: >-
              The latest round gives Frore meaningful strategic credibility: multiple sources corroborate a $143 million
              Series D, $340 million total funding, and a $1.64 billion valuation, while company materials show a broad
              thermal product stack spanning hyperscale liquid cooling and edge-device active air cooling. That said,
              the public evidence in this pool does not disclose revenue, ARR, gross margin, burn, runway, cap-table
              terms, or named production LiquidJet deployments. The result is a price-sensitive recommendation rather
              than a company-quality endorsement: Frore looks promising enough to keep under active diligence, but the
              last round price asks investors to underwrite scale before the available public record independently
              proves it.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
