      - CE003
      - CE004
      - CE010
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Frore's public customer evidence progresses from demo-driven technical validation to early commercial launch
      claims, with the data-center leg still lacking named production references.
    data:
      items:
        - label: Demo and evaluation proof
          actor: OEMs and component partners
          detail: Named examples include Micron/Crucial, Zotac, Samsung, and Sabrent from CES2024 material.
