      - number: '5.3'
        title: Maturity, dependencies, and control gaps
        blocks:
          - type: paragraph
            body: >
              Frore's maturity is best described as emerging commercialization with visible manufacturing and
              partner-development signals, not fully de-risked scale. Third-party and official materials both place
              manufacturing operations in Taiwan and describe integration with major OEMs and system builders, while the
              August 2026 tear sheet adds ISO 9001 and ISO 14001 certification at the fab. Those are useful quality and
              supply-readiness indicators, especially for a hardware company whose performance claims rely on repeatable
              manufacturing execution.


              Even so, the public record still leaves important technical and operational dependencies unresolved.
              Lenovo's notebook evidence is still at concept stage, the LiquidJet story lacks named production
              deployments in the assigned pool, and the company remains dependent on OEM design wins and manufacturing
              partners to turn technical merit into recurring product volume. That makes roadmap timing, qualification
              cycles, return rates, and customer-specific validation data more important diligence items than another
              round of marketing benchmarks.


              Trust and control surfaces are the weakest part of the public evidence pack. Frore's assigned sources show
              manufacturing-quality signals and product claims, but they do not publish the sort of security, privacy,
              firmware, uptime, or service-governance documentation that enterprise buyers may expect when cooling
              becomes part of critical AI and edge infrastructure. The right reading is not that those controls are
              absent, but that investors cannot verify them from the current public evidence set.
            claimRefs:
              - CE005
              - CE006
              - CE010
              - CE011
              - CE012
