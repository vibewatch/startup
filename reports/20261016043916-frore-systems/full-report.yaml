      - number: '5.2'
        title: Architecture and differentiation
        blocks:
          - type: paragraph
            body: >
              AirJet's differentiation is a solid-state thermal architecture positioned against both passive heatsinks
              and fan-based cooling. Frore's own product materials describe silent operation, high back pressure,
              compact dimensions, and low power draw, all of which are valuable in sealed or space-constrained devices
              where conventional fans add noise, dust vulnerability, or thickness. The newer AirJet PAK packaging pushes
              the same logic up a level by combining multiple AirJet Mini G2 chips into a plug-and-play module for AI
              SoMs.


              LiquidJet extends the same "thermal-stack" thesis into data-center cooling. The public product surface
              describes multi-stage 3D short-loop jetchannels, hotspot-focused coldplate geometry, and a lightweight
              integrated Nexus system that removes hoses and connectors from 1/2U compute-tray designs. In other words,
              Frore is not only selling component cooling performance; it is also trying to reduce integration
              complexity at the system level for both edge and liquid-cooled server environments.


              What remains unverified is how much of this differentiation survives independent benchmarking. Nearly
              every quantitative advantage in the assigned evidence pool comes from Frore-authored materials, including
              per-chip heat removal, system acoustics, and many demo uplift figures. The architecture is specific enough
              to be technically legible, but the diligence risk is that the market still has far more marketing evidence
              than neutral test data.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
              - CE010
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE010
              - CE011
              - CE012
