      - number: '2.3'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the accessible record are AI-driven thermal bottlenecks and the
              operating-economics benefits attached to better cooling. Frore's 2026 materials tie demand to higher
              compute density, lower PUE, and lower power and water usage, while Lenovo's 2026 concept-notebook
              announcement adds sustained AI reasoning workloads as a newer edge-device driver. Those signals support
              real urgency, but the public record is still thin where valuation work needs precision. The accessible
              sources do not name production hyperscaler deployments, do not disclose buyer-side budgets or attach
              rates, and do not show a bottom-up SAM/SOM by segment. As a result, the market story is credible, but the
              public evidence still supports "large adjacent opportunity with incomplete conversion proof" more strongly
              than it supports a fully underwritten market-share case.
