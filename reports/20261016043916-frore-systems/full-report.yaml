              - CU010
              - CU011
              - CU014
      - number: '6.3'
        title: Durability, concentration, and independent verification remain the main customer risks
        blocks:
          - type: paragraph
            body: >-
              The biggest limitation in Frore's customer evidence is not the absence of any proof, but the absence of
              durability and concentration disclosure. None of the retained sources provide customer count, GRR, NRR,
              churn, contract duration, or revenue exposure to the top account. Even the strongest 2025 proof points,
              such as approved-vendor-list inclusion and commercial launches, are company claims without denominator
              context. Independent sources support market interest and financing momentum, but they do not close the
              customer-quality gap; The Deep Wire explicitly notes that independent verification is still limited for
              some scale claims, especially around data-center efficiency benefits. For diligence, that makes customer
              quality a bigger open issue than customer existence.
            claimRefs:
              - CU004
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Edge traction is real, but most public proof is still curated
            body: >-
              Frore can point to named OEM and component examples across notebooks, SSDs, Mini PCs, and embedded
              devices, which is materially better than a pure logo wall. The catch is that the strongest public evidence
              still comes from Frore-authored launches and CES-style demos rather than independently verified production
              programs or recurring customer metrics.
            calloutType: insight
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
              - CU009
          - type: callout
            title: Customer-quality metrics are the main diligence hole
            body: >-
              The retained evidence does not disclose customer count, renewals, churn, NRR/GRR, or top account
              concentration. That leaves open whether Frore's traction is diversified recurring demand or a smaller set
              of high-visibility design wins.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Frore's risk stack is driven less by a disclosed lawsuit or recall in the assigned public pool than by
              execution stretch. Public materials place manufacturing in Taiwan while the company simultaneously markets
              AirJet for edge devices and LiquidJet / LiquidJet Nexus for AI data centers. Independent reporting
              confirms that the March 2026 financing is intended to accelerate scale-up, while valuation references
              cluster around $1.6B. That combination raises the consequence of any manufacturing delay, qualification
              slip, or weak conversion from company-issued partner proof into repeat production revenue.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR007
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
