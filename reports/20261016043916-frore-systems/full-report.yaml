  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Frore's public product stack runs from solid-state edge cooling chips up through packaged modules, liquid
      coldplates, and manufacturing/integration layers.
    data:
      layers:
        - label: Edge thermal core
          detail: Solid-state air-cooling chip family for compact edge and client devices.
          modules:
            - AirJet Mini / Mini Slim / Mini G2
            - 5.25W per chip on product page; 7.5W in Lenovo-announced Mini variant
            - 1,750-2,000 Pa back pressure with silent operation claims
          outputs:
            - Notebooks
            - SSDs
            - Mini PCs
            - Smartphones
        - label: Edge AI module packaging
          detail: Higher-level packaged module for AI SoMs and industrial edge systems.
          modules:
            - AirJet PAK 5C-G2
            - Five AirJet Mini G2 chips
            - Up to 45W net heat dissipation
            - Direct-mount SoM integration
          outputs:
            - Jetson-class edge AI systems
            - Industrial edge platforms
        - label: Data-center thermal stack
          detail: Liquid cooling family aimed at high-density accelerator systems.
          modules:
            - LiquidJet multi-stage 3D short-loop jetchannels
            - Hotspot-mapped coldplate geometry
            - LiquidJet Nexus hose-less 1/2U compute-tray system
          outputs:
            - GPU trays
            - ASIC cooling
            - AI data-center deployments
        - label: Manufacturing and integration layer
          detail: Operational layer that turns technical claims into repeatable shipment quality.
          modules:
            - Taiwan manufacturing operations
            - Major OEM and system-builder integrations
            - ISO 9001 / ISO 14001 fab certifications reported in Aug 2026 tear sheet
          outputs:
            - Edge-device OEM programs
            - Server-system partner programs
        - label: Validation layer
          detail: Public proof points Frore uses to show technical fit.
          modules:
            - CES and product-demo benchmarks
            - Lenovo concept notebook
            - Micron and iodyne workflow examples
          outputs:
            - Partner interest
            - Reference designs
        - label: Open-control layer
          detail: Controls that remain insufficiently documented in the public record.
          modules:
            - Independent reliability data missing
            - Named LiquidJet production deployments missing
            - Security and privacy documentation not public in assigned pool
          outputs:
            - Diligence follow-up required
    approximationNotes: >-
      This stack is a reader aid synthesized from public sources; it maps disclosed components and operating layers, not
      a company-published block diagram.
    claimRefs:
