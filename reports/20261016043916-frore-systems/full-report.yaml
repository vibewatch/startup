        title: Scale signals, commercial proof, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Frore's strongest public scale signals are external funding, repeated product announcements, and named
              ecosystem relationships rather than disclosed operating metrics. The retained pack provides one
              third-party employee estimate and multiple product and partnership references, but it does not verify
              revenue, customer count, concentration, or financing terms that would anchor a valuation read-through.
              That leaves the company looking commercially promising but still evidence-light on the core
              private-company metrics an investor would need to judge whether product momentum is converting into
