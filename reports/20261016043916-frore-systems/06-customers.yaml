company:
  name: Frore Systems
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows Frore has real customer-facing traction in edge devices through
    named OEM and component demonstrations, multiple commercial product categories, and
    ongoing design-in activity such as Lenovo's 2026 AeroBlade concept. The proof is still
    mostly company-curated and edge-heavy, however: retained sources do not disclose customer
    counts, retention, concentration, or named production LiquidJet deployments, so durability
    and data-center monetization remain unresolved.
sections:
  - id: customer-surface-and-segments
    title: Customer surface spans edge OEMs today and data-center buyers aspirationally
    body: >-
      Frore's public customer story is clearest in edge devices. The company website and product
      material position AirJet across consumer, industrial, and IoT hardware, while the LiquidJet
      line is aimed at AI data-center compute trays and direct-to-chip cooling. That means the
      practical buyer set is not one homogeneous customer base: edge-device OEMs, storage and
      peripheral vendors, embedded AI system builders, and prospective data-center operators all
      sit on different qualification cycles and revenue profiles. The retained proof also shows
      the edge side is materially more mature than the data-center side. Frore publicly describes
      commercial launches and shipment ramp for AirJet, whereas the data-center story is still
      framed around scale-up plans and product positioning rather than named production customers.
    claimRefs: [CU001, CU002, CU003, CU010, CU014]
    tableRefs: [TU001]
  - id: adoption-proof-and-trajectory
    title: Named proof exists, but production status is uneven
    body: >-
      Frore does have more than logo-level customer evidence. Its January 2025 milestone release
      said customers had launched commercial products using AirJet in Mini PCs, industrial tablets,
      AI edge gateways, and professional SSD drives, and it separately said high-volume shipments
      started in January 2024. Public named examples include Micron and Crucial in a CES2024 SSD
      demo, Zotac in a Mini PC, and Lenovo's AeroBlade concept notebook at Innovation World 2026.
      Those examples demonstrate real evaluation, design-in, and commercialization activity across
      multiple device categories. But proof quality varies: Lenovo was still a concept notebook,
      several other examples were show-floor demonstrations, and none of the retained sources tie
      those launches to unit volumes, repeat orders, or revenue contribution.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration-gaps
    title: Durability, concentration, and independent verification remain the main customer risks
    body: >-
      The biggest limitation in Frore's customer evidence is not the absence of any proof, but the
      absence of durability and concentration disclosure. None of the retained sources provide
      customer count, GRR, NRR, churn, contract duration, or revenue exposure to the top account.
      Even the strongest 2025 proof points, such as approved-vendor-list inclusion and commercial
      launches, are company claims without denominator context. Independent sources support market
      interest and financing momentum, but they do not close the customer-quality gap; The Deep
      Wire explicitly notes that independent verification is still limited for some scale claims,
      especially around data-center efficiency benefits. For diligence, that makes customer quality
      a bigger open issue than customer existence.
    claimRefs: [CU004, CU010, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: insight
    title: Edge traction is real, but most public proof is still curated
    body: >-
      Frore can point to named OEM and component examples across notebooks, SSDs, Mini PCs, and
      embedded devices, which is materially better than a pure logo wall. The catch is that the
      strongest public evidence still comes from Frore-authored launches and CES-style demos rather
      than independently verified production programs or recurring customer metrics.
    claimRefs: [CU002, CU005, CU006, CU007, CU009]
  - calloutType: risk
    title: Customer-quality metrics are the main diligence hole
    body: >-
      The retained evidence does not disclose customer count, renewals, churn, NRR/GRR, or top
      account concentration. That leaves open whether Frore's traction is diversified recurring
      demand or a smaller set of high-visibility design wins.
    claimRefs: [CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / public proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Consumer and PC OEMs
        - OEM / end user / OEM
        - Thin notebooks and tablets needing sustained performance without fan noise
        - Lenovo AeroBlade concept plus Samsung Galaxy Book2 Pro retrofit proof
        - Strategically important because Tier-1 PC design-ins can validate AirJet broadly
        - No public production volumes, revenue contribution, or renewal data
      - - Storage and peripheral vendors
        - Device maker / prosumer user / device maker
        - SSD and performance accessory cooling
        - Micron and Crucial CES2024 demo plus Sabrent SSD accessory example
        - Shows AirJet can monetize heat-constrained accessories beyond notebooks
        - Public evidence is demo-centric and lacks attach-rate or reorder disclosure
      - - Industrial and edge AI OEMs
        - OEM / field operator / OEM or channel partner
        - Mini PCs, industrial tablets, AI edge gateways, and embedded AI modules
        - Frore says commercial launches occurred across these categories by January 2025
        - Suggests diversified edge-market applicability rather than a single niche
        - No named installed-base counts or channel-mix disclosure
      - - Data-center and AI infrastructure builders
        - System builder or operator / data-center operator / system builder or operator
        - LiquidJet and LiquidJet Nexus for direct-to-chip cooling and half-U compute trays
        - Company site and independent news frame this as the next scale-up market
        - Could materially expand deal sizes versus edge-device sockets
        - No named production customer list or public revenue split for LiquidJet
    notes: >-
      Public proof is a mix of company-authored launches, demos, and one independent scale-up report;
      strategic value is qualitative because retained sources do not disclose segment revenue or unit volumes.
    claimRefs: [CU001, CU002, CU005, CU006, CU008, CU010, CU014]
