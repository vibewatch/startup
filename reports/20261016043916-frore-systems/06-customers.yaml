  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Customer count, GRR, NRR, churn, renewal rates, and contract duration by product line.
      whyItMatters: Public adoption proof cannot distinguish sticky recurring demand from episodic design wins without retention metrics.
      diligencePath: Request cohort, renewal, and contract-summary data for the top customer segments.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: top-customer-exposure
      missingEvidence: Named top customers plus revenue share for the top account and top five accounts.
      whyItMatters: Concentration can turn a visible OEM win into a single-account revenue risk.
      diligencePath: Obtain a customer concentration schedule and direct versus channel revenue split.
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof-table
      missingEvidence: A complete current roster of shipped customer programs with status marked as demo, pilot, or volume production.
