    title: Customer journey map
    type: journey-map
    summary: >-
      Frore's public customer evidence progresses from demo-driven technical validation to early commercial launch
      claims, with the data-center leg still lacking named production references.
    data:
      items:
        - label: Demo and evaluation proof
          actor: OEMs and component partners
          detail: Named examples include Micron/Crucial, Zotac, Samsung, and Sabrent from CES2024 material.
          touchpoints:
            - Public performance demos
            - Named hardware examples
            - Company-curated proof
          tone: neutral
        - label: Design-in and concept validation
          actor: Tier-1 OEMs
          detail: Lenovo's 2026 AeroBlade concept extends proof into a visible PC OEM collaboration.
          touchpoints:
            - Lenovo concept notebook
            - Innovation World 2026 showcase
            - No ship date disclosed
          tone: positive
        - label: Commercial edge launches
          actor: Edge-device customers
          detail: Frore said customers launched products in Mini PCs, industrial tablets, AI gateways, and SSDs.
          touchpoints:
            - Multiple product categories
            - Commercial launch claim
            - Shipment ramp since January 2024
          tone: positive
        - label: Qualification and expansion
          actor: Procurement and engineering teams
          detail: Approved-vendor-list inclusion and Tier-1 references suggest deeper qualification work.
          touchpoints:
            - Reliability testing passed
            - Several Tier-1 AVLs
            - Conversion rates undisclosed
          tone: neutral
        - label: Data-center expansion remains to prove out
          actor: AI infrastructure buyers
          detail: LiquidJet is strategically important, but retained sources do not name production data-center customers.
          touchpoints:
            - Scale-up narrative
            - No named production accounts
            - Independent verification still limited
          tone: warning
        - label: Renewal and concentration proof is still missing
          actor: CFO and customer-success diligence
          detail: Public sources do not disclose customer count, NRR, GRR, churn, or top-account exposure.
          touchpoints:
            - No cohort metrics
            - No top-customer revenue split
            - Diligence request required
          tone: risk
    claimRefs: [CU002, CU004, CU005, CU006, CU009, CU010, CU011, CU014]
