  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Understand food and glucose response", "Member records food and biomarkers", "Personalized nutrition guidance and feedback", "More frequent feedback than periodic clinic visits is described", "Adherence and causal attribution are not independently established"]
      - ["Maintain safe medication changes", "Physician reviews changing biomarkers", "Clinician-supervised medication adjustment", "Google Cloud account says alerts support provider action", "Public materials do not specify response SLAs or error rates"]
      - ["Prioritize proactive outreach", "Coach or clinician needs a ranked work queue", "Hybrid rules and ML prioritize engagement opportunities", "Google Cloud reports about 20% higher coach action after 2021 changes", "Current precision, recall and denominator are not disclosed"]
      - ["Support GLP-1 use or reduction", "Employer or member seeks managed metabolic care", "Nutrition-first care can be paired with prescribing", "2026 company report claims stronger outcomes with individualized nutrition", "Comparative study design and independent replication require review"]
      - ["Operate across payer populations", "Employer or health plan offers a benefit", "B2B2C virtual care with remote delivery", "Remote model can avoid a local-clinic footprint", "Eligibility, coverage and implementation friction are not fully documented"]
    notes: Rows describe workflows, not verified causal outcomes. Reported benefits retain the source's qualification and should not be treated as product guarantees.
    claimRefs: [CE001, CE003, CE006, CE007, CE014, CE015, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Member interface", "Capture check-ins", "Virta app and member adherence", "What are current availability, accessibility and support metrics?"]
      - ["Connected measurement", "Supply glucose, ketone and weight signals", "Meter connectivity, calibration, missingness and replacement process", "Are device data quality and replacement controls adequate?"]
      - ["Clinical data layer", "Store and interoperate patient data", "FHIR stores and Healthcare API described by Google Cloud", "What are current data lineage, retention and access-control practices?"]
      - ["Analytics and feature layer", "Combine biomarkers, nutrition, medication and outcomes", "BigQuery and de-identified data pipelines", "How are re-identification controls, feature drift and denominators governed?"]
      - ["AI/ML triage", "Rank outreach and estimate progress", "Rules-plus-ML models with clinician review", "What are model accuracy, bias, alert-fatigue, auditability and rollback controls?"]
      - ["Clinical operations", "Act on alerts and adjust care", "Doctors, nurses and health coaches", "What are staffing capacity, escalation timing and clinical QA metrics?"]
      - ["Cloud delivery", "Run scalable services", "GKE, Cloud Storage and Cloud Build described in 2022 account", "What are current uptime, disaster-recovery and configuration-assurance results?"]
    notes: Architecture is reconstructed from a Google Cloud technical account and Sacra's product description; current production topology and control evidence are not publicly complete.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
figures:
  - id: FE001
    title: Virta product architecture map
    type: stack
    summary: Virta's public product description forms a layered loop from member measurements to clinician-supervised intervention.
    data:
      layers:
        - label: Member experience
          detail: Member-facing capture, education and support.
          modules:
            - label: App check-ins
              detail: Food, symptoms and care-team communication.
            - label: Education and coaching
              detail: Individualized nutrition and behavior support.
        - label: Connected signals
          detail: Biomarker inputs used in the care loop.
          modules:
            - label: Glucose
              detail: Repeated blood-glucose measurements.
            - label: Ketones and weight
              detail: Additional metabolic and weight signals.
        - label: Data platform
          detail: Interoperability and analytics foundation.
          modules:
            - label: FHIR and Healthcare API
              detail: Interoperability layer described by Google Cloud.
            - label: BigQuery analytics
              detail: Combines biomarkers, nutrition, medication and outcomes.
        - label: Intelligence
          detail: Rules and models that prioritize care work.
          modules:
            - label: Rules plus ML
              detail: Prioritizes patient-engagement opportunities.
            - label: Progress estimation
              detail: Includes an HbA1c estimation use case.
        - label: Clinical action
          detail: Human-supervised response to prioritized signals.
          modules:
            - label: Provider alerts
              detail: Contextual information for proactive or reactive outreach.
            - label: Medication oversight
              detail: Human clinicians decide how to act.
        - label: Governance and reliability
          detail: Controls required to operate a clinical data platform safely.
          modules:
            - label: Security controls
              detail: Current assurance and breach-remediation evidence are diligence asks.
    approximationNotes: The figure is a conceptual synthesis of public descriptions, not a disclosed current production diagram or data-flow specification.
    claimRefs: [CE001, CE005, CE006, CE007, CE009]
callouts:
  - calloutType: insight
    title: Product moat is operational integration
    body: The public record supports an integrated care-operations platform more strongly than a standalone software or hardware moat.
    claimRefs: [CE001, CE005, CE010]
  - calloutType: assumption
    title: Current-state controls remain unverified
    body: Public technical descriptions are dated or company-issued; current security, reliability, model-governance and clinical-quality artifacts should be obtained before underwriting product maturity.
    claimRefs: [CE008, CE010, CE011, CE012]
