company:
  name: "Virta Health"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Virta Health is a founder-led virtual metabolic-care company whose public record shows a
    $133 million Series E at a $2 billion valuation, an estimated $158 million annualized
    revenue run rate in August 2025, and a company-claimed first profitable quarter in 2026.
    Current scale and momentum are material, but audited financials, headcount, headquarters,
    governance detail, and the affected population from a 2026 data incident remain unverified.
sections:
  - id: "identity-and-model"
    title: "Identity and operating model"
    body: >-
      Virta was founded in 2014 by Sami Inkinen after his own prediabetes experience, and it
      commercializes nutrition-led, technology-enabled care for type 2 diabetes and obesity.
      The operating model is B2B2C: self-insured employers, health plans, and government
      organizations sponsor continuous remote monitoring, coaching, and clinical support for
      eligible members. Public location evidence is less definitive than the product identity.
      A 2021 article described Virta as San Francisco-based, while the company's October 2026
      releases were datelined Denver; neither item by itself establishes the current legal
      headquarters. The investment case should therefore treat Denver as a company signaling
      location, not a verified headquarters record, pending corporate filings.
    claimRefs: [CO001, CO002, CO012, CO013]
    tableRefs: [TO001]
  - id: "capital-and-scale"
    title: "Capitalization and scale"
    body: >-
      The last well-documented institutional financing was the April 2021 Series E: $133
      million led by Tiger Global at a reported $2 billion valuation. Sacra later listed
      $376.5 million raised across seven rounds and estimated annualized revenue of $158 million
      at the end of August 2025. These are not equivalent measures of current cash, ARR, or
      audited revenue. The strongest current operating signals are company-issued: Virta said
      on October 6, 2026 that it had reached its first profitable quarter and served more than
      750 organizations. Because those disclosures omit financial statements, period revenue,
      cash, debt, and the exact organization denominator, they support momentum but not a
      complete underwriting model.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Public evidence continues to center the company on co-founder and CEO Sami Inkinen, whose
      prior operating experience includes co-founding Trulia. An October 2026 company release
      identifies Amit Shah as president, indicating operating coverage beyond the founder.
      However, the assigned evidence does not provide a complete executive roster, board
      membership, committee structure, investor rights, or succession plan. That makes
      founder dependence a diligence issue rather than a quantified conclusion: the public
      narrative ties strategy, clinical positioning, and fundraising closely to Inkinen, but
      the actual delegation of authority cannot be evaluated from these sources. Management
      interviews and current governance documents are required before assigning control or
      succession risk.
    claimRefs: [CO001, CO003, CO004]
    tableRefs: [TO002]
  - id: "milestones-and-adverse-signals"
    title: "Milestones and adverse signals"
    body: >-
      Virta's recent chronology combines commercial progress with a material trust issue. The
      company expanded its GLP-1 positioning, and its October 2026 report claimed better
      adjusted weight loss for members receiving individualized nutrition alongside
      medication. Separately, a March 2026 incident involved potential access to files in a
      repository that Virta described as separate from production; notices referenced highly
      sensitive identity and medical information. A law-firm summary says Virta reported no
      evidence of misuse at that time, which is not proof that misuse did not occur. The
      affected-person count was not publicly disclosed in the reviewed material. Low-quality
      consumer-review evidence also records access, service, and care complaints, useful as
      diligence prompts but not as incidence-rate evidence.
    claimRefs: [CO014, CO015, CO016]
