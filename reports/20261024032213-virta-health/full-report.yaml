  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary is narrower than all diabetes or obesity spending. Virta sells
              technology-enabled clinical care for diabetes reversal, prediabetes, obesity, and GLP-1 optimization,
              primarily as a covered benefit; drug expenditure, hospital care, routine primary care, and unrelated
              wellness spending are substitutes or adjacencies rather than Virta-addressable revenue. NIDDK reports 38.4
              million people with diabetes and 97.6 million adults with prediabetes in 2021, while diagnosed diabetes
              cost an estimated $412.9 billion in 2022. Those figures establish need and economic burden, not a revenue
              TAM. Public sources do not disclose the eligibility, clinical fit, benefit design, enrollment, or pricing
              inputs needed to translate that burden into a credible SAM or SOM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM015
