      - number: '2.2'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyers are self-insured employers, health plans, and government organizations;
              members and clinicians are users, while benefits, medical, and pharmacy leaders control budgets and
              coverage rules. KFF reports that employer-sponsored insurance covers 154 million people under 65 and that
              67% of covered workers were in self-funded plans in 2025, giving many employers direct exposure to claims
              and drug costs. Adoption therefore requires more than clinical interest: a buyer must define eligibility,
              integrate enrollment and care workflows, approve an outcomes contract, and see credible savings. Self-pay
              is a separate, smaller route, reported at $299 per month plus a $250 initiation fee rather than the
              enterprise benefit model.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              GLP-1 coverage is simultaneously a demand catalyst and a competitive constraint. In KFF's 2025 survey, 43%
              of firms with at least 5,000 workers covered GLP-1 agonists for weight loss, and 66% of covering firms in
              that size band said the benefit had a significant impact on prescription-drug spending. That cost pressure
              favors programs promising nutrition support, utilization management, or an off-ramp, but expanding drug
              coverage also raises the standard for comparative outcomes. Medicare's temporary GLP-1 Bridge began July
              1, 2026 and requires lifestyle-program participation, creating a policy-aligned care opportunity with
              eligibility and authorization limits. Trust is another gating factor: a law firm citing Virta's notice
              reported potentially accessed sensitive files in March 2026, which may lengthen security review even
              though the source said Virta had found no evidence of misuse at that time.
            claimRefs:
              - CM008
              - CM009
              - CM012
              - CM014
      - number: '2.4'
        title: Penetration evidence and valuation implications
        blocks:
          - type: paragraph
            body: >-
              Available penetration signals are encouraging but cannot be divided into the population statistics to
              produce a defensible share. Sacra estimated roughly 98,000 patients and 550 customers in 2024, while Virta
              stated in October 2026 that it served more than 750 employers, health plans, and government organizations.
              The change in organization count suggests distribution growth, but the estimates and company statement use
              different dates and do not disclose eligible lives, enrolled members, retention, or revenue by segment.
              Valuation should therefore emphasize contracted lives, activation, renewal, outcomes-based fee
              realization, and contribution margin rather than a broad prevalence multiple. The key underwriting gap is
              a reconciled bridge from covered populations to clinically eligible members, enrolled members, retained
              members, and realized revenue.
            claimRefs:
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Budget pressure is the near-term adoption wedge
            body: >-
              Large employers increasingly cover GLP-1 drugs while reporting material pharmacy spending impact, making
              measurable cost control and outcomes guarantees more decision-relevant than broad disease-prevalence
              claims.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: callout
            title: Public evidence cannot support a precise SOM
            body: >-
              Eligible lives, activation, clinical exclusions, retention, realized price, and segment contribution
              margin remain private, so a precise market-share or revenue bridge would create false precision.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Virta's direct job is to improve metabolic outcomes while reducing medication dependence, but buyers can
              solve that job through materially different routes. The program's public materials describe an online
              nutrition intervention with health coaching, connected weight and glucose devices, and medical guidance,
              while third-party descriptions emphasize a prescribing provider who adjusts medication as glucose changes.
              That puts Virta in a direct digital-care peer set with Omada and other chronic-condition platforms, an
              incumbent set of primary-care and endocrinology practices, a substitute set of GLP-1-led programs, and a
              status quo of medication management without an intensive nutrition protocol. Sacra describes Omada as
              focusing on diabetes prevention and management and identifies DarioHealth, Glooko, Perry Health, and
              Verily (Onduo) as traditional diabetes-management alternatives. The buyer therefore trades breadth,
              clinical intensity, access, and the prospect of medication reduction rather than selecting among
              interchangeable apps.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP010
      - number: '3.2'
        title: Capability and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              The defensible comparison is the care model and its economics, not a generic feature checklist. Virta's
              stated care plan combines app-based insights, connected devices, a one-on-one coach, and a medical
              provider who can reduce unwanted medication. Fierce Healthcare reports a $299 monthly self-pay price plus
              a $250 initiation fee and says employers and health plans offer the service at no cost to members; the
              Larimer County flyer instead describes a fully covered benefit for eligible plan members. Sacra reports an
              outcomes-based B2B2C model with estimated program prices of $2,808 per diabetes-reversal patient in year
              one, $2,388 in subsequent years, $900 per year for sustainable weight loss, and $950 per year for diabetes
              management. These figures are not interchangeable: a public self-pay price, a local benefit description,
              and an analyst estimate describe different contracting contexts. Public evidence does not establish
              competitor pricing for the matrix cells marked unknown, so those cells remain diligence gaps rather than
              inferred parity.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Virta's moat is partly operational: medication changes require clinical oversight, and its model collects
              glucose, ketone, and weight data frequently enough to personalize nutrition and adjust care. Fierce
              Healthcare reports that Virta tailors plans to food access and restaurants and positions a responsible
              prescriber against online pill mills. Those capabilities can strengthen trust and switching friction for a
              payer or member, but they also carry service-delivery cost and depend on sustained adherence. The program
              is not a universal substitute: the Larimer County material excludes or cautions against several medical
              conditions, and independent commentary says coverage is the practical access constraint. Competitive
              displacement can therefore come from broader chronic-care platforms, standard clinicians, or GLP-1
              programs that offer easier enrollment or a different clinical objective. Adverse evidence also matters:
              two legal-investigation pages describe a 2026 Virta data-breach notification and potentially exposed
              health information, while one review site records complaints about access, support, and care quality.
              These are not proof of systemic failure, but they are credible diligence flags for trust, compliance, and
              retention.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Competitive verdict
        blocks:
          - type: paragraph
            body: >-
              Virta appears differentiated where the buyer values supervised medication reduction, continuous remote
              signals, and an outcomes-linked payer relationship. The differentiation is narrower than a full
              metabolic-health platform: it depends on an eligible patient, a covered channel, a willingness to sustain
              carbohydrate restriction, and a provider workflow capable of managing medication safely. Sacra's
              description of AI-assisted interactions suggests a path to scale, but the same source notes upfront
              investment in devices and coaching infrastructure. The investment case should therefore treat the moat as
              a service-and-data system with clinical trust, not as a permanently protected software feature. Key
              unresolved questions are independently verified retention by condition, realized payer pricing and
              guarantee performance, competitor-level outcomes, and the scope and remediation of the 2026 breach.
            claimRefs:
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical workflow is the clearest differentiator
            body: >-
              Virta combines remote biomarkers, coaching, and clinician-led medication changes in a way that is more
              operationally specific than a generic wellness subscription.
            calloutType: strength
            claimRefs:
              - CP005
              - CP010
          - type: callout
            title: Trust and channel risks can erase differentiation
            body: >-
              Coverage dependence, narrow eligibility, dietary adherence, and the reported 2026 data-breach incident all
              create displacement or retention risk that a feature comparison would understate.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: callout
            title: Underwrite realized economics, not list prices
            body: >-
              Request payer contracts, renewal and retention cohorts, guarantee performance, competitor price books, and
              breach-remediation evidence before treating the positioning as durable.
            calloutType: recommendation
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Virta sells virtual metabolic care primarily through employers, health plans, and government organizations
              rather than through a transparent consumer price list. Sacra describes a B2B2C benefit model and reports
              program prices of $2,808 per diabetes-reversal patient in year one, $2,388 in subsequent years, $900 per
              year for Sustainable Weight Loss, and $950 per year for diabetes management; these are analyst-reported
              prices, not audited realized revenue. Virta's own materials say coverage and member cost-sharing vary by
              employer or plan contract, while its 2025 guarantee language ties some fees to outcomes and claims-based
              ROI. This structure can align payer incentives, but it also makes revenue quality dependent on contract
              terms, eligibility, enrollment, retention, and measured outcomes that are not publicly disclosed.
            claimRefs:
