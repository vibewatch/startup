chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Virta was founded in 2014 by Sami Inkinen after his own prediabetes experience, and it commercializes
              nutrition-led, technology-enabled care for type 2 diabetes and obesity. The operating model is B2B2C:
              self-insured employers, health plans, and government organizations sponsor continuous remote monitoring,
              coaching, and clinical support for eligible members. Public location evidence is less definitive than the
              product identity. A 2021 article described Virta as San Francisco-based, while the company's October 2026
              releases were datelined Denver; neither item by itself establishes the current legal headquarters. The
              investment case should therefore treat Denver as a company signaling location, not a verified headquarters
              record, pending corporate filings.
            claimRefs:
              - CO001
              - CO002
              - CO012
              - CO013
