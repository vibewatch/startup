        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public evidence continues to center the company on co-founder and CEO Sami Inkinen, whose prior operating
              experience includes co-founding Trulia. An October 2026 company release identifies Amit Shah as president,
              indicating operating coverage beyond the founder. However, the assigned evidence does not provide a
              complete executive roster, board membership, committee structure, investor rights, or succession plan.
              That makes founder dependence a diligence issue rather than a quantified conclusion: the public narrative
              ties strategy, clinical positioning, and fundraising closely to Inkinen, but the actual delegation of
              authority cannot be evaluated from these sources. Management interviews and current governance documents
              are required before assigning control or succession risk.
