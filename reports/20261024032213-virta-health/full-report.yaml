        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Current company communications report more than 750 employer, health-plan, and government organization
              customers and a first profitable quarter in October 2026. The same release does not state revenue, EBITDA,
              operating cash flow, or the definition of profitability. Sacra estimates $158 million of annualized
              revenue at the end of August 2025 and $160 million for 2025, but labels the figures as estimates. Earlier
              reporting said Virta worked with more than 100 organizations and had nearly 200% year-over-year growth
              around the 2021 Series E; that historical figure is not a current growth rate. Virta also claims
              approximately 80% one-year GLP-1 adherence in a 2026 report, but this is a company analysis rather than a
              disclosed sales-efficiency metric. No public CAC, payback, sales cycle, pipeline conversion, enrollment
              rate, or customer concentration data were found in the assigned pool.
            claimRefs:
              - CI005
              - CI006
