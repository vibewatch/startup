        title: Capitalization and scale
        blocks:
          - type: paragraph
            body: >-
              The last well-documented institutional financing was the April 2021 Series E: $133 million led by Tiger
              Global at a reported $2 billion valuation. Sacra later listed $376.5 million raised across seven rounds
              and estimated annualized revenue of $158 million at the end of August 2025. These are not equivalent
              measures of current cash, ARR, or audited revenue. The strongest current operating signals are
              company-issued: Virta said on October 6, 2026 that it had reached its first profitable quarter and served
              more than 750 organizations. Because those disclosures omit financial statements, period revenue, cash,
              debt, and the exact organization denominator, they support momentum but not a complete underwriting model.
