      - number: '1.4'
        title: Milestones and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Virta's recent chronology combines commercial progress with a material trust issue. The company expanded
              its GLP-1 positioning, and its October 2026 report claimed better adjusted weight loss for members
              receiving individualized nutrition alongside medication. Separately, a March 2026 incident involved
              potential access to files in a repository that Virta described as separate from production; notices
              referenced highly sensitive identity and medical information. A law-firm summary says Virta reported no
              evidence of misuse at that time, which is not proof that misuse did not occur. The affected-person count
              was not publicly disclosed in the reviewed material. Low-quality consumer-review evidence also records
              access, service, and care complaints, useful as diligence prompts but not as incidence-rate evidence.
