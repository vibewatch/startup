  - id: FE001
    title: Virta product architecture map
    type: stack
    summary: >-
      Virta's public product description forms a layered loop from member measurements to clinician-supervised
      intervention.
    data:
      layers:
        - label: Member experience
          detail: Member-facing capture, education and support.
          modules:
            - label: App check-ins
              detail: Food, symptoms and care-team communication.
            - label: Education and coaching
              detail: Individualized nutrition and behavior support.
        - label: Connected signals
          detail: Biomarker inputs used in the care loop.
          modules:
            - label: Glucose
              detail: Repeated blood-glucose measurements.
            - label: Ketones and weight
              detail: Additional metabolic and weight signals.
        - label: Data platform
          detail: Interoperability and analytics foundation.
          modules:
            - label: FHIR and Healthcare API
              detail: Interoperability layer described by Google Cloud.
            - label: BigQuery analytics
              detail: Combines biomarkers, nutrition, medication and outcomes.
        - label: Intelligence
          detail: Rules and models that prioritize care work.
          modules:
            - label: Rules plus ML
              detail: Prioritizes patient-engagement opportunities.
            - label: Progress estimation
              detail: Includes an HbA1c estimation use case.
        - label: Clinical action
          detail: Human-supervised response to prioritized signals.
          modules:
            - label: Provider alerts
              detail: Contextual information for proactive or reactive outreach.
            - label: Medication oversight
              detail: Human clinicians decide how to act.
        - label: Governance and reliability
          detail: Controls required to operate a clinical data platform safely.
          modules:
            - label: Security controls
              detail: Current assurance and breach-remediation evidence are diligence asks.
    approximationNotes: >-
      The figure is a conceptual synthesis of public descriptions, not a disclosed current production diagram or
      data-flow specification.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE009
  - id: FU001
    title: Customer journey from contracted benefit to expansion
    type: journey-map
    summary: >-
      Public evidence supports the organizational-to-member care path, while conversion, retention, and expansion
      checkpoints remain unmeasured.
    data:
      nodes:
        - id: contracted-benefit
          label: Contracted benefit
          touchpoints:
            - Employer, health plan, or government organization selects Virta
        - id: member-entry
          label: Member entry
          touchpoints:
            - Member enters diabetes, prediabetes, or obesity program
            - GLP-1 use at entry is reported for about 30% of incoming type 2 diabetes patients
        - id: supervised-care
          label: Supervised care
          touchpoints:
            - App check-ins, connected biomarkers, coaching, and clinician medication management
        - id: outcome-review
          label: Outcome review
          touchpoints:
            - Weight, glycemic, medication, and cost outcomes are reviewed
            - >-
              Virta reports a 4,000-plus-member GLP-1 analysis, but public sources do not disclose account-level
              denominators
        - id: member-feedback
          label: Member feedback
          touchpoints:
            - Coaching, support, complaints, and access friction inform the experience
            - No prevalence or escalation denominator is public
        - id: renewal-expansion
          label: Renewal and expansion
          touchpoints:
            - Potential expansion across obesity, diabetes, cardiovascular health, and GLP-1 workflows
            - NRR, renewal, and cross-sell rates are not disclosed
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU012
      - CU013
