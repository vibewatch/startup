      - number: '5.2'
        title: Data, AI, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              Google Cloud's technical account gives the clearest public architecture description. Virta migrated from
              Aptible to Google Kubernetes Engine in 2020 and used Google Cloud services including Kubernetes Engine,
              BigQuery, Cloud Storage, Cloud Build, and the Healthcare API. The stated purpose was greater control over
              networking, scaling, tooling, permissions, and interoperable FHIR data. The same account describes
              de-identified messages, biomarkers, laboratory data, and outcomes feeding an AI/ML pipeline that surfaces
              patient-engagement opportunities and estimated HbA1c signals to clinicians. It also says the
              prioritization system mixes rules and ML and that health-coach action increased about 20% after criteria
              and prioritization changes in 2021. These are useful operating signals, but they are an engineering
              account and do not establish current uptime, model accuracy, bias testing, clinical validation, or the
              precise production boundary between automated recommendations and clinician decisions.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
