              - CI004
              - CI005
              - CI010
      - number: '4.3'
        title: Cost structure and margin path
        blocks:
          - type: paragraph
            body: >-
              The operating model is service-intensive: members receive connected devices, app-based tracking, health
              coaching, and provider oversight, with ongoing review of biomarkers and medication changes. Sacra
              estimates approximately 60% gross margins and attributes part of the economics to AI automation with human
              clinical oversight; this is not a filed financial statement. Virta's official description confirms the
              device, provider, coaching, and continuous-monitoring components, which imply labor, device, clinical,
              support, and technology costs. The October 2026 profitability announcement is encouraging for margin
              direction but does not identify gross margin, contribution margin, cost allocation, or whether
              profitability is recurring. A shift toward lower-priced obesity services could pressure economics, but the
              assigned sources do not provide audited product-line margins.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Capital adequacy and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Virta has publicly reported substantial historical financing, including a $133 million Series E in 2021,
              but funding raised is not cash on hand and the historical chronology is not a proxy for current liquidity.
              Sacra reports total funding of $376.5 million and a $2 billion 2024 valuation, while also describing these
              as private-company research estimates or reported round outcomes. The October 2026 profitability
              announcement reduces near-term financing dependence as a stated operating milestone, but provides no cash
              balance, burn, runway, debt, credit facility, capex, or next-round trigger. Separately,
              legal-investigation pages report that files in a legacy repository may have been accessed in March 2026
              and that notices were sent to affected people; those pages are adverse, attorney-linked accounts and do
              not quantify financial liability. Underwriting therefore requires confidential financial statements,
              contract-level retention and margin data, and legal-reserve or insurance information.
            claimRefs:
              - CI014
              - CI015
              - CI016
              - CI017
              - CI018
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Profitability is a positive but underspecified milestone
            body: >-
              Virta announced its first profitable quarter in October 2026 and reported more than 750 organizational
              customers, improving the public commercial signal while leaving the definition and durability of
              profitability unresolved.
            calloutType: strength
            claimRefs:
              - CI005
          - type: callout
            title: Liquidity and unit economics remain underwriting blockers
            body: >-
              No assigned source discloses cash, burn, runway, debt, CAC, payback, retention cohorts, or product-level
              contribution margin; historical funding and estimated revenue cannot substitute for those inputs.
            calloutType: risk
            claimRefs:
              - CI016
              - CI017
              - CI018
          - type: callout
            title: Revenue quality depends on payer execution
            body: >-
              The B2B2C model can align fees with payer savings, but realized economics depend on contract guarantees,
              member enrollment, clinical delivery costs, and renewal evidence that is not public.
            calloutType: insight
            claimRefs:
              - CI001
              - CI004
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Virta's product is a virtual clinical service rather than a standalone software license. Public
              descriptions consistently place the member in a loop of connected glucose and ketone measurements, food
              and symptom reporting, individualized nutrition guidance, health-coach contact, and physician oversight.
              Sacra describes a starter kit containing a glucose meter, ketone meter, and scale, with members checking
              in through the app two to four times daily; Keto-Mojo likewise describes regular glucose and ketone
              monitoring paired with follow-up recommendations. The workflow is therefore high-touch and data-dependent:
              the value proposition depends not only on the app, but also on device supply, clinician availability,
              timely review, medication management, and member adherence. Pricing and realized outcomes are not
              established by these product sources, and the public record does not disclose service-level targets for
              response time, device replacement, or member support.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
