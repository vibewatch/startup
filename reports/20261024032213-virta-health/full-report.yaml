  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Virta is positioned as a higher-intensity, narrower metabolic-care model; peer coordinates are ordinal analytical
      placements, not market-share measurements.
    data:
      xAxis: Breadth of condition and workflow coverage (1 = narrow, 5 = broad)
      yAxis: Clinical intensity and medication-management involvement (1 = low, 5 = high)
      points:
        - label: Virta Health
          x: 3
          'y': 5
          note: Connected monitoring, coach, and medical provider; narrow eligibility and nutrition protocol.
        - label: Omada Health
          x: 4
          'y': 3
          note: >-
            Sacra describes prevention and diabetes management with structured digital care; exact clinical intensity
            not independently scored.
        - label: Livongo via Teladoc
          x: 4
          'y': 3
          note: >-
            Sacra describes a diabetes-management solution distributed through Teladoc's provider network; current
            product scope requires verification.
        - label: Primary care / endocrinology
          x: 5
          'y': 4
          note: Broad risk-picture care and medication management; workflow and intensity vary by practice.
        - label: GLP-1-led managed care
          x: 3
          'y': 4
          note: Medication-centered alternative or complement; nutrition and monitoring scope varies.
        - label: Unsupervised diet / consumer coaching
          x: 2
          'y': 1
          note: Low clinical involvement and limited evidence in assigned sources for medication management.
    approximationNotes: >-
      Coordinates are ordinal, evidence-backed analyst judgments based on the assigned sources; they are not measured
      benchmarks, rankings, or market shares. Competitor coordinates remain provisional where source detail is
      incomplete.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP010
