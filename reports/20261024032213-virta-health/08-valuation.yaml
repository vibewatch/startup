      - [Valuation stance, unknown-to-stretched, Last reported $2.0B mark is from April 2021 and no current mark is public]
    notes: "The qualitative call combines dated financing evidence, company-reported 2026 milestones, company-affiliated peer-reviewed studies, and unresolved private-company diligence gaps."
    claimRefs: [CV003, CV008, CV012, CV013, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Differentiated clinical workflow, "Matched cohorts retained 7.5%-7.9% one-year weight loss; >70% maintained >=5% loss after GLP-1 deprescription", "Independent prospective outcomes and payer-level economics"]
      - [Commercial momentum, "Company reports first profitable quarter and >750 employers, health plans, and government organizations", "Audited recurring profitability and cohort retention"]
      - [Price discovery is stale, "Series E post-money valuation was reported at $2.0B in April 2021", "A current arm's-length financing or secondary price"]
      - [Downside remains material, "2026 breach pages describe potentially exposed medical and identity data; scope is undisclosed", "Official incident closure, remediation, and quantified exposure"]
    notes: "Company-issued evidence is separated from independent clinical and adverse reporting; the table does not treat reported profitability as audited cash generation."
    claimRefs: [CV001, CV002, CV003, CV008, CV012, CV013, CV014, CV017, CV018]
  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Assumptions, Valuation and return logic, Probability signal]
    rows:
      - [Bull, "Verified recurring profitability; retention and margin hold while GLP-1 and obesity programs scale", "A new price could be supportable only if growth and cash conversion justify a premium to the stale 2021 mark", "Low until audited evidence is supplied"]
      - [Base, "Clinical differentiation persists; growth continues but current price, retention, and cap-table terms remain opaque", "Track and seek a price that compensates for information asymmetry; no precise return target", "Most defensible on current evidence"]
      - [Bear, "Obesity mix compresses economics; security remediation or regulatory costs rise; private multiple compresses", "Down-round or impaired liquidity is possible; preserve downside through entry discipline and preference review", "Material downside signal"]
    notes: "Scenarios are qualitative because no current transaction price, audited financial statements, or reliable probability distribution is publicly available."
    claimRefs: [CV004, CV007, CV009, CV010, CV013, CV015, CV016]
