  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation
      missingEvidence: "An arm's-length 2026 financing or secondary price, fully diluted capitalization, liquidation preferences, and any structured or insider-led transactions."
      whyItMatters: "Without current price discovery and preference terms, a return calculation or entry valuation would be false precision."
      diligencePath: "Obtain the latest cap table, financing documents, board-approved 409A or transaction marks, and a verified secondary-trade summary under NDA."
      relatedQuestionRefs: [QV003, QV007]
    - type: private-evidence-only
      severity: material
      topic: evidence-limitations
      missingEvidence: "Prospective, independently replicated outcomes and payer-level evidence linking clinical results to durable economic value."
      whyItMatters: "Retrospective selected cohorts support the mechanism but do not by themselves establish a premium valuation or predictable returns."
      diligencePath: "Request full study protocols, denominators, attrition, comparator definitions, independent replication, and payer claims-based outcome and savings analyses."
      relatedQuestionRefs: [QV002]
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: "Audited or management financials covering revenue recognition, gross and contribution margin, cash, debt, burn, and the duration of reported profitability."
      whyItMatters: "A company-reported profitable quarter is not equivalent to recurring cash generation or a sustainable margin profile."
      diligencePath: "Request monthly P&L, cash-flow statements, balance sheet, debt schedule, customer cohorts, and reconciliation of reported revenue estimates."
      relatedQuestionRefs: [QV004]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: "Official incident closure, affected-count disclosure, remediation controls, and any regulatory or litigation disposition for the 2026 data incident."
      whyItMatters: "The reported data categories create potential liability and may affect enterprise trust, costs, and valuation."
      diligencePath: "Obtain Virta's incident notice, forensic summary, regulator correspondence, remediation plan, insurance coverage, and counsel's litigation assessment."
      relatedQuestionRefs: [QV006, QV008]
    - type: stale
      severity: material
      topic: retention
      missingEvidence: "Current renewal, retention, expansion, customer concentration, and program-level margin cohorts by diabetes, obesity, and GLP-1 workflow."
      whyItMatters: "The commercial case depends on durable payer value, not only enrollment or reported organization counts."
      diligencePath: "Request cohort waterfalls, renewal schedules, top-customer concentration, implementation costs, care-team productivity, and contribution margin by product."
      relatedQuestionRefs: [QV004, QV005, QV008]
