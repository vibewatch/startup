chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a differentiated metabolic-care proposition and stronger 2026 operating momentum, but it does not establish a current transaction price or the cash-flow quality needed to underwrite a new entry. The appropriate stance is track/research-more until private-market pricing, retention, margin, and cap-table evidence are refreshed.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Virta has a credible scale-and-proof narrative. A 2022 peer-reviewed retrospective study of 814 propensity-matched participants reported 7.5% versus 7.9% one-year weight loss across pandemic and pre-pandemic cohorts, while a 2024 peer-reviewed study of 154 deprescription patients matched 1:1 with continued-therapy patients found that more than 70% maintained at least 5% weight loss 12 months after GLP-1 deprescription. These findings support a differentiated continuous-care proposition, but both studies used Virta patient data and had company-employed or company-funded authors, so they do not independently prove payer-level contribution margin or durable enterprise retention. Virta's 2026 company release reports a first profitable quarter and more than 750 organizational customers, yet it does not disclose audited revenue, cash generation, or valuation. The anti-thesis is therefore price and evidence quality: the last publicly reported $2.0 billion valuation followed the April 2021 Series E, and current independent valuation marks are unavailable.
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV016]
    tableRefs: [TV001, TV002]
  - id: scenarios
    title: Scenarios and entry discipline
    body: >-
      A scenario framework is more defensible than a point estimate. Sacra reports estimated annualized revenue of $158 million at August 2025, a $2.0 billion last valuation, and approximately 60% gross margin, but it labels the work estimates and provides no audited statements. Its historical reference to Teladoc's $18.5 billion Livongo acquisition is not a current Virta multiple, while Caplight names Twin Health, Vida Health, and Lark Health as similarity-based private comparables without displaying market values. Caplight also shows a 2026 growth-equity row with no public amount or valuation, and its filings preview says records require access. The base case therefore assumes commercial progress without assigning a new valuation multiple; the bull case requires verified profitable growth and retention; the bear case incorporates a security event, lower-priced obesity mix, or multiple compression.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV017, CV018]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence-and-decision
    title: Decision, exit readiness, and diligence asks
    body: >-
      The evidence supports a track recommendation with low-to-medium confidence rather than a buy. The company has reported customer expansion and a first profitable quarter, and company-affiliated peer-reviewed studies provide a plausible outcomes mechanism. However, the latest priced financing disclosed in the retained sources is still the 2021 Series E at $2.0 billion, while current private-market price discovery is gated behind institutional access. A 2026 reported data incident involving potentially exposed medical and identity data adds a material diligence item even though the retained legal pages are not adjudications and the ultimate affected population is not disclosed. Exit readiness is consequently unproven: an investor should seek audited financials, preference terms, retention cohorts, incident remediation, and evidence that profitability is recurring before underwriting a return target.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: []
callouts:
  - calloutType: recommendation
    title: Track pending price discovery
    body: The public record supports continued diligence, not a fresh entry at an unknown or potentially unchanged 2021 price.
    claimRefs: [CV008, CV009, CV012, CV015]
  - calloutType: risk
    title: Evidence and security overhang
    body: Current valuation, audited cash economics, cap-table preferences, and the scope and remediation of the 2026 data incident remain unresolved.
    claimRefs: [CV010, CV013, CV014, CV016]
