evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      A current executive and board roster, committee assignments, investor rights, delegation matrix, and succession
      plan.
    whyItMatters: Leadership coverage and key-person dependence cannot be assessed from two public titles.
    diligencePath: >-
      Request the current org chart, board materials, charter documents, voting agreements, and management succession
      plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-cap-table
    missingEvidence: >-
      A complete post-2021 cap table, ownership percentages, liquidation preferences, secondaries, debt, and buyer
      concentration.
    whyItMatters: >-
      Named investors and stakeholder classes do not reveal economic control, preference overhang, or commercial
      concentration.
    diligencePath: Obtain the fully diluted cap table, financing documents, debt schedule, and customer-concentration report.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-and-operating-scale
    missingEvidence: >-
      Audited 2025-2026 revenue, margins, cash flow, cash, debt, headcount, customer retention, and the affected-person
      count for the 2026 incident.
    whyItMatters: >-
      Public estimates and company milestones cannot establish durable profitability, liquidity, operating leverage, or
      the full incident exposure.
    diligencePath: >-
      Request audited statements, bank and debt confirmations, payroll records, customer cohorts, and the final incident
      forensic and notification reports.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A reconciled count of contracted lives, clinically eligible members, activated members, retained members, and
      realized revenue by diabetes, obesity, payer, and geography.
    whyItMatters: >-
      Without the conversion bridge, prevalence and insured-life statistics cannot support a defensible SAM, SOM,
      penetration rate, or revenue ceiling.
    diligencePath: >-
      Request current customer cohort files, eligibility rules, activation and retention waterfalls, segment pricing,
      and recognized revenue reconciled to contracts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: >-
      Renewal, expansion, procurement-cycle, and budget-owner data segmented across employers, commercial plans, and
      government organizations.
    whyItMatters: >-
      Organization count alone does not show sales-cycle duration, contract durability, covered-life depth, or
      channel-specific adoption.
    diligencePath: >-
      Review CRM pipeline history, executed contracts, renewal cohorts, implementation timelines, and interviews with
      benefits and pharmacy decision-makers.
    relatedQuestionRefs:
