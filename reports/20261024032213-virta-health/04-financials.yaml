          label: Devices, coaching, provider oversight
          detail: "Connected monitoring and continuous remote care"
        - id: outcomes
          label: Metabolic outcomes and medication reduction
          detail: "Virta reports clinical and GLP-1-related outcomes"
        - id: revenue
