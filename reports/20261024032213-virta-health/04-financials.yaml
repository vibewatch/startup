company:
  name: Virta Health
chapter:
  number: 4
  title: Financials
  summary: Virta's public materials describe a B2B2C virtual-care model with outcomes-oriented contracts, expanding metabolic-care products, and a first profitable quarter in 2026. The public record supports improving commercial traction, but does not disclose the cash, burn, cohort, realized-price, or program-level margin data needed for full underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Virta sells virtual metabolic care primarily through employers, health plans, and
      government organizations rather than through a transparent consumer price list. Sacra
      describes a B2B2C benefit model and reports program prices of $2,808 per diabetes-reversal
      patient in year one, $2,388 in subsequent years, $900 per year for Sustainable Weight
      Loss, and $950 per year for diabetes management; these are analyst-reported prices, not
      audited realized revenue. Virta's own materials say coverage and member cost-sharing vary
      by employer or plan contract, while its 2025 guarantee language ties some fees to outcomes
      and claims-based ROI. This structure can align payer incentives, but it also makes revenue
      quality dependent on contract terms, eligibility, enrollment, retention, and measured
      outcomes that are not publicly disclosed.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: traction-and-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      Current company communications report more than 750 employer, health-plan, and government
      organization customers and a first profitable quarter in October 2026. The same release
      does not state revenue, EBITDA, operating cash flow, or the definition of profitability.
      Sacra estimates $158 million of annualized revenue at the end of August 2025 and $160
      million for 2025, but labels the figures as estimates. Earlier reporting said Virta worked
      with more than 100 organizations and had nearly 200% year-over-year growth around the
      2021 Series E; that historical figure is not a current growth rate. Virta also claims
      approximately 80% one-year GLP-1 adherence in a 2026 report, but this is a company analysis
      rather than a disclosed sales-efficiency metric. No public CAC, payback, sales cycle,
      pipeline conversion, enrollment rate, or customer concentration data were found in the
      assigned pool.
    claimRefs: [CI005, CI006, CI009]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: cost-structure
    title: Cost structure and margin path
    body: >-
      The operating model is service-intensive: members receive connected devices, app-based
      tracking, health coaching, and provider oversight, with ongoing review of biomarkers and
      medication changes. Sacra estimates approximately 60% gross margins and attributes part of
      the economics to AI automation with human clinical oversight; this is not a filed financial
      statement. Virta's official description confirms the device, provider, coaching, and
      continuous-monitoring components, which imply labor, device, clinical, support, and
      technology costs. The October 2026 profitability announcement is encouraging for margin
      direction but does not identify gross margin, contribution margin, cost allocation, or
      whether profitability is recurring. A shift toward lower-priced obesity services could
      pressure economics, but the assigned sources do not provide audited product-line margins.
    claimRefs: [CI010, CI011, CI012, CI013]
  - id: capital-adequacy
    title: Capital adequacy and underwriting gaps
    body: >-
      Virta has publicly reported substantial historical financing, including a $133 million
      Series E in 2021, but funding raised is not cash on hand and the historical chronology is
      not a proxy for current liquidity. Sacra reports total funding of $376.5 million and a
      $2 billion 2024 valuation, while also describing these as private-company research
      estimates or reported round outcomes. The October 2026 profitability announcement reduces
      near-term financing dependence as a stated operating milestone, but provides no cash
      balance, burn, runway, debt, credit facility, capex, or next-round trigger. Separately,
      legal-investigation pages report that files in a legacy repository may have been accessed
      in March 2026 and that notices were sent to affected people; those pages are adverse,
      attorney-linked accounts and do not quantify financial liability. Underwriting therefore
      requires confidential financial statements, contract-level retention and margin data, and
      legal-reserve or insurance information.
    claimRefs: [CI014, CI015, CI016, CI017, CI018]

