    claimRefs: [CI001, CI004, CI005, CI010]

callouts:
  - calloutType: strength
    title: Profitability is a positive but underspecified milestone
    body: "Virta announced its first profitable quarter in October 2026 and reported more than 750 organizational customers, improving the public commercial signal while leaving the definition and durability of profitability unresolved."
    claimRefs: [CI005]
  - calloutType: risk
    title: Liquidity and unit economics remain underwriting blockers
    body: "No assigned source discloses cash, burn, runway, debt, CAC, payback, retention cohorts, or product-level contribution margin; historical funding and estimated revenue cannot substitute for those inputs."
    claimRefs: [CI016, CI017, CI018]
  - calloutType: insight
    title: Revenue quality depends on payer execution
    body: "The B2B2C model can align fees with payer savings, but realized economics depend on contract guarantees, member enrollment, clinical delivery costs, and renewal evidence that is not public."
    claimRefs: [CI001, CI004, CI010]

