    notes: "The table separates stated program pricing and annualized revenue from realized, recognized, or audited revenue."
    claimRefs: [CI002, CI004, CI006]
  - id: TI003
    title: Unit-economics availability
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annual contract price, "$900-$2,808 reported by program", "Medium", "Frames revenue per enrolled member", "Provide realized price and payer/product mix"]
      - [Gross margin, "Approximately 60% (Sacra estimate)", "Medium", "Tests scalability of care delivery", "Provide audited gross margin bridge by program"]
      - [CAC, null, "Unavailable", "Determines growth efficiency", "Provide fully loaded CAC by channel and cohort"]
      - [Payback period, null, "Unavailable", "Tests capital efficiency", "Provide CAC payback using collected cash and contribution margin"]
      - [Retention / renewal, null, "Unavailable", "Determines recurring revenue quality", "Provide logo and member retention cohorts"]
      - [Cash balance and runway, null, "Unavailable", "Tests financing dependency", "Provide latest balance sheet, burn, debt, and runway"]
      - [Customer concentration, null, "Unavailable", "Tests renewal and downside risk", "Provide top-customer revenue and lives covered"]
      - [Product-line margin, null, "Unavailable", "Tests obesity and GLP-1 mix effects", "Provide contribution margin by diabetes, obesity, and GLP-1 workflow"]
    notes: "Null values are unavailable public evidence, not zero; the requested diligence items are necessary for underwriting."
    claimRefs: [CI005, CI010, CI013, CI016, CI017, CI018]

