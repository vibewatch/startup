      - [Campaign targeting or suppression error, Medium, High, "QA and approval responsibilities described", Medium-high, "Error rate, release controls, and vendor incident history"]
      - [Member login or access failure, Medium, Medium, "No public remediation metric", Medium, "Uptime, ticket aging, and affected-member counts"]
      - [Inconsistent clinical review or coaching quality, Medium, High, "Clinician supervision claimed; external QA unavailable", Medium-high, "Chart audits, adverse events, and care-team escalation performance"]
      - [Comparative clinical evidence does not generalize, Medium, High, "Company analysis reports a large real-world cohort", Medium-high, "Protocol, comparator construction, attrition, and independent replication"]
    notes: Public reviews and company materials identify failure modes but do not quantify incidence; likelihood and severity are screening judgments, not observed frequencies.
    claimRefs: [CR001, CR002, CR003, CR004, CR009, CR010, CR011, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Enterprise distribution, Employers and health plans, "Eligibility, member acquisition, and payment", "More than 750 organizations claimed; concentration undisclosed", "Major payer nonrenewal or benefit removal", High, "Organization count disclosed; diversification unverified", High]
      - [Government reimbursement, Medicare and other public payers, "Coverage and eligibility", "Virta-specific participation and mix undisclosed", "Temporary program changes or failed authorization", High, "Published eligibility workflow", Medium-high]
      - [Drug ecosystem, Manufacturers and pharmacies, "GLP-1 availability and compliant dispensing", "No supplier mix disclosed", "Coverage, shortage, or compounding pathway changes", High, "Product-by-product monitoring required", High]
      - [Member communications stack, Braze and campaign vendors, "Email, SMS, direct mail, and preference enforcement", "Vendor dependence described; redundancy undisclosed", "Suppression or targeting failure", High, "QA and reusable workflows described", Medium-high]
      - [Private capital and liquidity, Existing investors and secondary market, "Funding and shareholder liquidity", "Forge labels market activity limited", "Capital unavailable or preference overhang constrains options", Medium-high, "First profitable quarter claimed", High]
    notes: Public sources identify counterparties and roles but not contract concentration, redundancy, service levels, liquidity terms, or current capital availability.
    claimRefs: [CR006, CR007, CR009, CR012, CR013, CR014, CR016]
