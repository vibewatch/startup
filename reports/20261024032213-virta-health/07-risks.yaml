      - [Medicare GLP-1 Bridge conditions, United States, "Temporary coverage with eligibility, prior authorization, and lifestyle-program requirements", Medium, High, "Coverage pathway published; Virta participation unverified", Medium-high, "Verify eligibility workflows, formulary economics, and continuity after December 31, 2027"]
