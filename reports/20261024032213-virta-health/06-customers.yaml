        - id: contracted-benefit
          label: Contracted benefit
          touchpoints: ["Employer, health plan, or government organization selects Virta"]
        - id: member-entry
          label: Member entry
          touchpoints: ["Member enters diabetes, prediabetes, or obesity program", "GLP-1 use at entry is reported for about 30% of incoming type 2 diabetes patients"]
        - id: supervised-care
          label: Supervised care
          touchpoints: ["App check-ins, connected biomarkers, coaching, and clinician medication management"]
        - id: outcome-review
          label: Outcome review
          touchpoints: ["Weight, glycemic, medication, and cost outcomes are reviewed", "Virta reports a 4,000-plus-member GLP-1 analysis, but public sources do not disclose account-level denominators"]
        - id: member-feedback
          label: Member feedback
          touchpoints: ["Coaching, support, complaints, and access friction inform the experience", "No prevalence or escalation denominator is public"]
        - id: renewal-expansion
          label: Renewal and expansion
          touchpoints: ["Potential expansion across obesity, diabetes, cardiovascular health, and GLP-1 workflows", "NRR, renewal, and cross-sell rates are not disclosed"]
    claimRefs: [CU001, CU004, CU005, CU012, CU013]
callouts:
  - calloutType: strength
    title: Broad payer-channel reach
    body: Virta reports serving more than 750 employers, health plans, and government organizations, indicating that the model has moved beyond a single buyer channel.
    claimRefs: [CU001]
  - calloutType: risk
    title: Durability remains unproven
    body: Public evidence does not disclose commercial retention, renewal, customer concentration, or cohort economics; study attrition should not be substituted for those measures.
    claimRefs: [CU007, CU012]
  - calloutType: recommendation
    title: Request account-level evidence
    body: Underwriting should require a customer cohort file covering enrollment, utilization, renewals, outcomes-based contract performance, and top-account concentration.
    claimRefs: [CU012]
