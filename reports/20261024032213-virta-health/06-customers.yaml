company:
  name: Virta Health
chapter:
  number: 6
  title: Customers
  summary: Virta sells intensive, clinically supervised metabolic care primarily through employers, health plans, and government organizations. Public evidence supports broad organizational distribution and named use cases, but does not disclose customer-level retention, enrollment conversion, or concentration.
sections:
  - id: buyer-and-user-segments
    title: Buyer, payer, and user segments
    body: >-
      Virta's customer model is B2B2C rather than direct-to-consumer: the commercial buyer is
      typically an employer, health plan, or government organization, while the end user is a
      member or employee receiving remote metabolic care. A current company-issued announcement
      says Virta serves more than 750 such organizations, but it does not provide a denominator,
      contract count by segment, covered lives, enrollment, or revenue concentration. Sacra
      describes the same model as contracts with self-insured employers, health plans, and
      government organizations. The buyer proposition is cost and outcomes management; the
      member proposition is nutrition-first care, connected monitoring, coaching, and medication
      management. These are different adoption surfaces and should not be conflated with active
      customer or patient counts.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: >-
      Public evidence shows expansion of the target use cases, not a measured cohort trajectory.
      Virta's October 2026 announcement reports more than 750 organizational customers and says
      the company expanded evidence across obesity, type 2 diabetes, and cardiovascular health.
      Business Insider reported that about 30% of incoming type 2 diabetes patients were using a
      GLP-1 at entry and that most could safely stop within the first year, but this is a CEO
      account and is not a retention or renewal metric. A separate October 2026 company release
      reports that more than 4,000 adults using GLP-1s were analyzed and that members receiving
      Virta's personalized nutrition therapy achieved 37% greater adjusted weight loss after one
      year than a comparison group; the release does not establish account renewal or independent
      validation. Biology Insights summarizes published studies with material attrition,
      including a veteran cohort falling from 640 enrollees to 310 at two years and 197 at three
      years; the result describes study participation, not necessarily commercial churn. No
      assigned source provides Virta's NRR, GRR, renewal rate, cohort revenue, utilization, or
      enrollment conversion. Those omissions materially limit confidence in durability and
      expansion.
    claimRefs: [CU004, CU005, CU006, CU007, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-concentration
    title: Named proof, procurement friction, and concentration
    body: >-
      Named customer proof is thin in the assigned evidence. The sources establish the buyer
      categories and operating model, but do not identify three independently verified
      production customers with deployment scope, contract status, outcomes, and renewal
      evidence. A job listing confirms a fully virtual, team-based model delivered across all
      50 states and describes a new obesity service for a select group, which is useful workflow
      evidence but not customer proof. KFF documents the scale and cost of employer-sponsored
      insurance, an important channel context, while Reviewopedia records both positive user
      testimonials and complaints about coverage, access, equipment, and care quality. The latter
      is anecdotal and cannot establish prevalence. Concentration by employer, health plan,
      government account, geography, or channel remains undisclosed. Before underwriting
      durability, request a customer-by-customer revenue and covered-lives schedule, enrollment
      funnel, renewal cohorts, outcomes-based contract terms, and complaints/escalation data.
    claimRefs: [CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
