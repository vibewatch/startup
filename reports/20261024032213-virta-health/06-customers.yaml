      - ["Health-plan programs", "Health plan", "Covered member metabolic care and GLP-1 management", "Not disclosed", "Company and Sacra describe payer contracting", "No named plan, procurement record, or renewal evidence"]
      - ["Government organizations", Government, "Diabetes, obesity, and cardiometabolic programs", "Not disclosed", "Company announcement says the segment is served", "No named agency, award, scope, or utilization data"]
    notes: "Enumeration is partial: assigned sources do not provide three independently verified named production customer deployments; rows are buyer-category proof, not customer references."
    enumerationScope:
      coverage: partial
      basis: "Assigned successful URLs reviewed for public customer names, deployment status, outcomes, and renewal evidence as of 2026-10-24."
    claimRefs: [CU001, CU002, CU008, CU010]
