callouts:
  - calloutType: insight
    title: Budget pressure is the near-term adoption wedge
    body: >-
      Large employers increasingly cover GLP-1 drugs while reporting material pharmacy
      spending impact, making measurable cost control and outcomes guarantees more
      decision-relevant than broad disease-prevalence claims.
    claimRefs: [CM008, CM009, CM010]
  - calloutType: risk
    title: Public evidence cannot support a precise SOM
    body: >-
      Eligible lives, activation, clinical exclusions, retention, realized price, and
      segment contribution margin remain private, so a precise market-share or revenue
      bridge would create false precision.
    claimRefs: [CM015, CM016]
