    notes: "Values preserve each source's period and denominator. They are separate prevalence, spending, distribution, and penetration lenses and must not be summed or treated as a TAM-to-SOM funnel."
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM013, CM016]
