    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports a layered operating-reach lens for Etraveli's
      market, but not a clean independent TAM/SAM/SOM stack.
    data:
      items:
        - label: Flight-commerce boundary
          displayValue: flight distribution + fulfilment + travel fintech
          note: Boundary comes from the company's disclosed product scope rather than a spend estimate.
          claimRefs: [CM001, CM014]
        - label: Served markets
          value: 75
          displayValue: ">75"
          unit: markets
          note: Late-2025/2026 company disclosures.
          claimRefs: [CM004]
        - label: Annual travellers served
          value: 48
          displayValue: ">48M"
          unit: travellers
          note: Current operational reach disclosed by Etraveli.
          claimRefs: [CM004]
        - label: Annual transaction value
          value: 16
          displayValue: €16bn
          unit: TTV
          note: Company-reported throughput, not revenue.
          claimRefs: [CM004]
        - label: 2024 travel orders handled
          value: 25
          displayValue: 25M
          unit: orders
          note: Historical operating lens from the 25-year anniversary release.
          claimRefs: [CM005]
        - label: Precision operating footprint
          value: 200
          displayValue: ">200"
          unit: countries
          note: Company-reported transaction-screening footprint before broader external distribution.
          claimRefs: [CM009]
    approximationNotes: >-
      Public sources do not disclose an independent TAM/SAM/SOM for Etraveli,
      so the layers mix current reach metrics with the nearest disclosed
      operational and partner-adoption proxies; they should be read as an
      evidence-constrained sizing lens rather than as a single-denominator
      conversion stack.
    claimRefs: [CM004, CM005, CM009, CM014]
callouts:
  - calloutType: insight
    title: Flights matter because they acquire demand, not because ticketing margins are rich
    body: >-
      The strongest independent demand signal in the assigned pool is not a TAM
      report but Booking.com's comment that more than a quarter of its flight
      bookers were entirely new customers. That makes Etraveli's partner-facing
      booking and fulfilment stack strategically valuable even in a structurally
      low-margin market.
    claimRefs: [CM007, CM015]
  - calloutType: risk
    title: Market opportunity is easier to see than segment economics
    body: >-
      Public evidence supports scale, buyer pain, and partner relevance, but it
      still does not isolate a current SAM/SOM, take rate, or revenue mix
      across OTA, B2B content, and fintech lines. That leaves a material gap
      between visible market activity and investor-grade market sizing.
    claimRefs: [CM005, CM013, CM014]
