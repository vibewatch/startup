  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A current independent TAM/SAM/SOM for flight-commerce distribution, fulfilment, and travel-fintech workflows relevant to Etraveli.
      whyItMatters: Without an external sizing benchmark, the chapter can bound reach and demand signals but cannot test whether Etraveli's disclosed operating scale implies large remaining whitespace.
      diligencePath: Obtain current analyst or public-company market studies that segment flight booking infrastructure, fulfilment, and travel-fintech spend rather than total travel demand.
      relatedQuestionRefs: [QM009]
    - type: private-evidence-only
      severity: material
      topic: segment-economics
      missingEvidence: A revenue mix, take-rate, and gross-margin bridge across consumer OTA, B2B content, and fintech product lines.
      whyItMatters: The market can look attractive while unit economics differ sharply by segment, which directly affects valuation and how much of the apparent market is actually monetizable.
      diligencePath: Request management reporting on revenue by segment, key partner concentration, take rates, and contribution margins for OTA, TripStack/content, and Precision businesses.
      relatedQuestionRefs: [QM009]
