        title: 壁垒持久性与替代压力
        blocks:
          - type: paragraph
            body: >-
              规模可能强化 Etraveli 的数据、供应商和运营优势：公司称其在 75 个市场每年服务超过 4800 万旅客，并另行披露 2024 年完成 2500 万笔订单、总销售额近 EUR14
              billion。但这些是公司发布的数据，无法说明市场份额、单位经济性或相对竞争者的表现。最有力的反证来自战略和监管层面。Booking 曾尝试收购，说明平台具有价值；英国放行和 Etraveli
              所称欧盟委员会阻止交易，则表明与大型需求平台的组合可能面对不同的竞争结果。Precision
              对外商业化也扩大了可触达市场，同时增加了与专业金融科技供应商的重叠。因此，壁垒能否持久取决于仍未披露的性能和合作伙伴经济性，而不只是业务广度。
