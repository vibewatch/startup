        title: 规模指标与里程碑轨迹
        blocks:
          - type: paragraph
            body: >-
              公开披露的规模方向明确，但还不够干净，不能视为一套统一的经审计 KPI。2025 年 12 月完成交易的公告称年旅客数超过 4800 万，并将 Etraveli 定位为全球规模的航旅中介；官网和 2026 年
              Precision 公告则把当前员工和办公室规模更新为 3,200+ 名员工、11 个办公室。2025 年周年公告补充了 2024 年经营指标：2500 万笔旅行订单、近 EUR 14 billion
