            body: >-
              公开证据更能支持业务质量判断，而不是价格判断。公司披露了近 €14 billion 的 2024 年总销售额、超过 €163 million 的 EBITDA，以及覆盖 75+
              个市场、服务数千万旅客的业务版图；Booking.com 又续约八年，KKR 也作为少数股东入场。这一组合说明公司确有战略价值，但不能确定今天可承销的入场价格，因为 2025 年 7
              月的股东交易没有披露财务条款，公开材料也没有展示杠杆、优先股堆叠或资方估值标记。基于当前公开证据，合理判断是继续研究、中等信心、高风险、估值未知；除非价格低于过时的战略先例，或私有尽调填补融资和下行保护缺口。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV011
