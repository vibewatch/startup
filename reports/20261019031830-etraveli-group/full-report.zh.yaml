              - CM011
              - CM015
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 航班重要，是因为能获取需求，而不是票务利润丰厚
            body: >-
              资料池中最强的独立需求信号不是 TAM 报告，而是 Booking.com 提到其超过四分之一的航班预订者是全新客户。即便在结构性低利润市场中，这也让 Etraveli
              面向合作伙伴的预订和履约技术栈具备战略价值。
            calloutType: insight
            claimRefs:
              - CM007
              - CM015
          - type: callout
            title: 市场机会比业务线经济性更容易看清
            body: 公开证据支持规模、买方痛点和合作伙伴价值，但仍未拆分当前 SAM/SOM、抽佣率，或 OTA、B2B 内容和金融科技之间的收入组合。可见的市场活动与投资级市场测算之间，仍存在实质缺口。
            calloutType: risk
            claimRefs:
              - CM005
              - CM013
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与解决方案路径
        blocks:
          - type: paragraph
            body: >-
              相关竞争格局比消费者 OTA 名单更广。Etraveli 展示的是一条整合路径，把自有 OTA 品牌与机票销售、履约、Tripstack 虚拟联程、Precision 金融科技、Wenrix
              以及航班比价业务结合起来。买方也可以选择大型 OTA
              或分销平台，通过元搜索获取流量，拼装专业的欺诈和支付工具，或在内部建设航空能力。这些路径不能互换：前台渠道掌握需求，基础设施供应商提供内容和履约，专业供应商解决更窄的运营问题。Etraveli
              的战略差异在于其声称能够横跨多个层次，但指定证据没有提供针对各替代方案的中立市场份额排名。
