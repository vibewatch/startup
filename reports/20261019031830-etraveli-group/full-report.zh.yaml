      - CV008
      - CV011
      - CV013
      - CV014
  - id: TV003
    title: 多头 / 基准 / 空头情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 多头
        - B2B 增长延续，Booking 和元搜索合作加深，且 Precision 在清晰的投资者条款下带来增量利润率。
        - 只有私下尽调确认 EBITDA 质量高、优先权负担有限，才足以支持按接近甚至高于过时的 2021 年战略交易估值买入。
        - 合作伙伴集中度、隐藏杠杆，以及未能按预期规模化的金融科技变现。
        - 需要最新经审计的 2025-2026 年增长、利润率和资本结构披露；现有公开证据尚未证明这些条件。
      - - 基准
        - 核心平台仍然强劲，但价格发现停留在私下交易，投资者会要求防范集中度和资产负债表不透明。
        - 在当前条款、债务和下行保护变得清晰之前，只能以明显低于 2021 年战略参考值的价格跟踪或参与。
        - 投资者经济利益不透明、现金转化不确定，公开可比公司样本有限。
        - 最符合今天的公开记录。
      - - 空头
        - 当前投资者估值已计入战略退出乐观预期，但监管敏感性、杠杆或优先股堆叠会实质性压制少数股东的上行空间。
        - 如果条款假设存在类似 2021 年的战略价值，却没有相匹配的退出确定性，下行将占主导，放弃交易反而理性。
        - 退出路径受阻、契约压力，或少数交易对手攫取大部分经济利益。
        - 尽调结果若显示估值激进、杠杆沉重，或少数股东保护被置于次位。
    notes: 由于公开证据没有披露当前估值、债务方案或投资者权利，情景区间仅作定性判断。
    claimRefs:
      - CV004
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
