  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开经营牵引
        blocks:
          - type: paragraph
            body: >-
              Etraveli 不是纯 SaaS 供应商；公开记录指向一种混合航旅电商模式，横跨自有 OTA 需求、面向合作伙伴的预订与履约，以及新兴金融科技变现。公司、合作伙伴和独立来源将 Gotogate、Mytrip 和
              Flightnetwork 等消费者品牌，与 Booking.com、Google Flights、Skyscanner、Kayak 及其他旅行平台的 B2B
              关系并列描述。最清晰的经营披露来自公司本身，而非独立审计：管理层称集团在 2024 年处理了 2500 万笔旅行订单，对应近 EUR14 billion 的总销售额，产生超过 EUR163 million 的
