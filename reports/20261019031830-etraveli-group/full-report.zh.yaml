      - number: '1.4'
        title: 下行信号与待尽调事项
        blocks:
          - type: paragraph
            body: >-
              资料池中的主要下行信号来自执行和透明度，而不是新的急性偿付能力或制裁事件。Trustpilot 的 Gotogate 页面汇总评分为 3.1/5，反复出现的投诉涉及取消、退款、客服响应和价格摩擦；2023
              年欧盟阻止交易也提醒我们，大型战略交易可能受监管限制。尽调真正未解的不是 Etraveli
              是否已具备规模，而是价值如何沉淀：当前私有估值、累计融资、债务和契约负担、合作伙伴集中度经济，以及股权结构表背后的治理细节。
