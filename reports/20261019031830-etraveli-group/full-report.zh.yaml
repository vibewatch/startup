              - CV014
      - number: '8.3'
        title: 情景投资判断
        blocks:
          - type: paragraph
            body: >-
              在公司披露当前估值条款或投资者获得完整私有数据室之前，情景框架应保持定性。乐观情景是 Etraveli 延续 B2B 转型、守住 Booking.com 和元搜索关系，并扩大 Precision
              等高毛利金融科技产品，同时保持 EBITDA 转化。基准情景承认业务真实且具备规模，但假设当前价格发现仍在私有市场中，任何买方都应坚持相对于过时 2021
              年战略交易价格的折价，直到杠杆、契约和优先权悬垂变得透明。悲观情景是，当前资方条款已经把乐观退出假设计入价格，尽管业务存在集中度、竞争审查先例和不清晰的资产负债表义务，从而让新少数资本的下行大于上行。
            claimRefs:
              - CV007
