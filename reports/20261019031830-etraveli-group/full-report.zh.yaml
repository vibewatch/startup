      - number: '3.2'
        title: 能力广度与分销能力
        blocks:
          - type: paragraph
            body: >-
              公开披露更清楚地支持业务广度，而非相对优势。Precision 被描述为拥有 Fraud Prevention 和 Travel Flexibility 两款产品；Tripstack
              则被描述为通往航班内容、虚拟联程、支付、定价、客服和履约的入口。Travolution 还报道了其与 Outpayce by Amadeus、Mastercard Gateway、Sabre 和
              Checkout.com 的集成。在分销侧，Etraveli 将 Booking.com、Google Flights、Skyscanner 和 Kayak 列为合作伙伴；PhocusWire 报道
              Booking.com 在 2019 年选择 Etraveli 为其提供机票票务能力。这张网络带来触达，但也可能让重要需求渠道掌握在强势交易对手手中，而对手可以多源采购、议价，或将部分技术栈内化。
            claimRefs:
