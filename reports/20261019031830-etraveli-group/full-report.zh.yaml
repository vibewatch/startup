      - number: '8.2'
        title: 估值锚点与可比对象
        blocks:
          - type: paragraph
            body: >-
              可用的公开可比对象很少。最干净的已披露价格锚点仍是 Booking Holdings 在 2021 年以 €1.63 billion 收购 Etraveli
              的协议，但那是特定旅行复苏环境下形成的战略控制交易，后来也没有通过欧洲竞争审查。此后，公司经营规模更大、B2B 定位更强，又引入了 KKR 少数投资，但 2025
              年资方重组没有披露价格或结构。因此，公开证据可以方向性地支持资产已经成熟，但无法说明价值增厚或稀释的准确幅度。实际使用时，2021 年的交易 headline
              应作为需要质询的上限参考，而不是可直接复用的估值，尤其因为产生该价格的战略退出路径已经证明对监管敏感。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
