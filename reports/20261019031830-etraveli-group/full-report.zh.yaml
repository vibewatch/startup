            body: >-
              目前的控制权由资方主导。留存证据显示，公司经历了漫长的所有权变迁，最终由 CVC 在 2017 年取得控制，并于 2025 年 12 月完成 KKR 的重要少数股权投资；另一条 Booking 交易路径则从
