  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方图谱
        blocks:
          - type: paragraph
            body: >-
              指定证据将 Etraveli 定义为专注航班的电商技术栈，而不是通用旅行软件供应商。公司披露称，集团提供机票销售、履约服务、航班内容交付和金融科技产品；Wikipedia
              上的第三方简介仍将业务概括为航班分销、在线预订和履约。两者共同支持一个更窄的市场边界，核心是航旅电商基础设施：通过 Gotogate、Mytrip 和 Flightnetwork 等品牌做消费者 OTA
              分销；通过 TripStack 提供 B2B 内容和履约；通过 Precision 提供旅行金融科技产品，尤其是欺诈防控和灵活性工具。买方图谱同样集中。Precision 明确面向航空公司、OTA
              和全球旅行企业；合作伙伴披露则显示，Etraveli 接入大型旅行平台和支付网络，而不是销售无差异的横向软件。对尽调而言，TAM 不能锚定全部旅行支出，应限定在 Etraveli
              实际能够中介的航班预订、履约、支付和预订后流程。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM014
              - CM015
      - number: '2.2'
        title: 受证据约束的规模测算与市场结构
        blocks:
          - type: paragraph
            body: >-
              现有资料池无法支持一套干净的公开 TAM/SAM/SOM，因此最稳妥的规模判断要使用运营和采用代理指标。2025 年末和 2026 年公司披露显示，Etraveli 年旅客数超过 4800 万、覆盖 75+
              个市场、总交易额为 €16 billion；周年公告还提供历史视角：2024 年有 2500 万笔旅行订单、价值近 €14 billion，并称 B2B
              合作已成为业务增长最快的部分。独立证据又提供了两个约束。第一，PhocusWire 2021 年关于 Booking 航班业务的报道说明了航班对大型平台的战略意义：该产品已在 27 个国家上线，超过 25%
              的航班预订者是全新客户，说明其价值不止于低薄的机票利润，还包括获客和交叉销售。第二，Tracxn 统计的 136
              家活跃竞争者说明供给侧较为分散，而非赢家通吃。综合来看，这是一个足够重要的市场，但前提是把它定义为有可测交易吞吐量和合作伙伴需求的航旅电商层，而不是全球旅行总支出。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM014
      - number: '2.3'
        title: 采用驱动因素、约束与待尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录中的采用驱动因素很具体。Precision 的定位建立在低利润率运营环境上：欺诈、取消和支付受理都可能显著改变盈利；Outpayce 合作公告称，在扩大商业化之前，该产品已在 200 多个国家筛查规模达
              multibillion-dollar 的交易流。这说明买方痛点是真实可见的，而不是假设。该合作还展示了首选的采用路径：旅行公司通过既有旅行基础设施接入 Etraveli，包括接入 Outpayce
              的单一连接，以及更广泛的内容合作，其中 Amadeus 成为 Etraveli 的 NDC 内容主要来源。制约因素在于，平台整合和相邻领域扩张确实会引发审查：英国 CMA 曾正式评估 Booking
              的拟议收购是否会削弱竞争，最终在 Phase 1 放行。估值最大的未解问题不是需求是否存在，而是外部投资者能否拆分各业务线的经济性。指定证据仍未披露当前独立 TAM/SAM/SOM、B2B 抽佣率，或
              OTA、内容和金融科技之间的收入拆分。
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
          - type: table
