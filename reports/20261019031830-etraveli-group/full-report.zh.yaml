        - label: 航班交易边界
          displayValue: flight distribution + fulfilment + travel fintech
          note: 边界来自公司披露的产品范围，而非支出估算。
          claimRefs:
            - CM001
            - CM014
        - label: 服务市场
          value: 75
          displayValue: '>75'
          unit: markets
          note: 2025 年末 / 2026 年公司披露。
          claimRefs:
            - CM004
        - label: 年度服务旅客数
          value: 48
          displayValue: '>48M'
          unit: travellers
          note: Etraveli 披露的当前运营触达范围。
          claimRefs:
            - CM004
        - label: 年度交易额
          value: 16
          displayValue: €16bn
          unit: TTV
          note: 公司报告的处理规模，不是收入。
          claimRefs:
            - CM004
        - label: 2024 年处理的旅游订单
          value: 25
          displayValue: 25M
          unit: orders
          note: 来自 25 周年公告的历史运营视角。
          claimRefs:
            - CM005
        - label: Precision 运营覆盖
          value: 200
          displayValue: '>200'
          unit: countries
          note: 公司报告的交易筛查覆盖范围，早于更广泛的外部分销。
          claimRefs:
            - CM009
    approximationNotes: 公开来源没有披露 Etraveli 独立的 TAM/SAM/SOM，因此各层混合了当前触达指标，以及最接近的已披露运营和合作伙伴采用代理指标；应将其理解为受证据约束的规模视角，而不是统一分母下的转化漏斗。
    claimRefs:
      - CM004
      - CM005
      - CM009
      - CM014
  - id: FP001
    title: 竞争路径定位
    type: quadrant
    summary: 分析师编码的序数定位展示了 Etraveli 已披露的业务广度，并区分广泛基础设施、前台、渠道、内部自建和专业化路径；这不是独立的产品基准。
    data:
      xAxis:
        label: 有证据支持的解决方案广度（1 窄至 5 广）
        min: 1
        max: 5
      yAxis:
        label: 有证据支持的外部分销触达（1 内部至 5 多渠道）
        min: 1
        max: 5
      points:
        - label: Etraveli 集成栈
          x: 5
          'y': 5
          detail: 自有 OTA、内容、履约、虚拟联运和金融科技，连接已点名的全球渠道。
        - label: Tripstack 基础设施路径
          x: 4
          'y': 4
          detail: Etraveli 内面向合作伙伴的航班内容和服务网关。
        - label: Precision 专业化路径
          x: 2
          'y': 3
          detail: 以旅游金融科技产品形式销售 Fraud Prevention 和 Travel Flexibility。
        - label: OTA 既有玩家路径
          x: 3
          'y': 5
          detail: 面向旅客的分销范围广，但指定证据尚未厘清后端范围。
        - label: 航司内部自建路径
          x: 4
          'y': 1
          detail: 航空公司控制的工作流可能覆盖较广，但没有证据证明跨平台触达。
        - label: 专业金融科技路径
          x: 1
          'y': 3
          detail: 窄范围的模块化替代方案；没有可用的指定厂商表现和触达数据。
    approximationNotes: 坐标是根据已披露范围和点名的渠道关系得出的定性 1-5 序数编码，不是市场份额、价格、转化率、欺诈损失或客户满意度测量。未知的竞争对手能力不会被计为不存在。
    claimRefs:
      - CP004
      - CP005
      - CP007
      - CP009
      - CP016
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持一条从消费者和合作伙伴需求通向履约、金融科技和利润的混合桥接路径，但没有证明每一步已经实现的经济效益。
    data:
      nodes:
        - label: 需求获取
          detail: 自有 OTA 品牌加上外部合作伙伴需求，带来漏斗顶部的航班搜索和预订。
        - label: 航班内容与行程组装
          detail: 平台为零售和 B2B 场景汇聚全球航空内容，并提供虚拟联运能力。
        - label: 预订与履约
          detail: Etraveli 为旅客和合作伙伴提供预订、履约、定价、支付和客户支持服务。
        - label: 风险与灵活性产品
          detail: Precision 为旅游企业增加 Fraud Prevention 和 Travel Flexibility 产品。
        - label: 变现触点
          detail: 公开证据确认了消费者、合作伙伴和金融科技产品，但没有披露合同定价或实际抽成率。
        - label: EBITDA 与现金创造
          detail: 报告 EBITDA 为正，但现金转化仍取决于退款、支持成本、杠杆和合作伙伴组合，而这些信息尚未公开。
    approximationNotes: 节点顺序有证据支撑；该图是概念图，不推断未披露的转化率、抽成率或分部利润率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI010
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开披露展示了从需求捕获到内容、履约和金融科技决策的一层层产品栈。
    data:
      layers:
        - label: 需求捕获
          detail: 产生航班需求的消费者品牌和合作伙伴渠道。
          items:
            - Gotogate / Mytrip / Flightnetwork
            - Booking.com、Google Flights、Skyscanner、KAYAK 等渠道
          outputs:
            - 搜索与预订流量
        - label: 内容网关
          detail: Tripstack 被描述为进入航班内容和虚拟联运的入口。
          modules:
            - 航班内容接入
            - 虚拟联运
            - 行程组装
          outputs:
            - 可供合作伙伴使用的报价和预订路径
        - label: 履约与服务
          detail: 官方文案将定价、支付和客户支持与 B2B 产品栈打包在一起。
          modules:
            - 定价
            - 支付
            - 客户支持
          outputs:
            - 订单履约与服务
        - label: 金融科技优化
          detail: Precision 将平台延伸至欺诈防范和灵活性产品。
          modules:
            - Fraud Prevention
            - Travel Flexibility
            - 旅游原生机器学习决策
          outputs:
            - 利润率保护与增值变现
        - label: 航空公司连接背景
          detail: 规模声称指向平台背后广泛的航空公司关系。
          modules:
            - 550+ 航空公司合作
          outputs:
            - 广泛的内容接入
        - label: 控制证明缺口
          detail: 公开来源没有同等具体地展示安全性、正常运行时间或 SLA 证据。
          outputs:
            - 针对韧性与合规的待尽调事项
    approximationNotes: 图示仅反映保留的公开来源明确描述的层级；未包含未披露的基础设施、安全和可观测性组件。
    claimRefs:
      - CE003
      - CE006
      - CE009
      - CE011
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Etraveli 的客户旅程如今把消费者 OTA 转化，与嵌入式 B2B 平台、航空公司和金融科技分销闭环混在一起。
    data:
      nodes:
        - label: 元搜索发现合作伙伴
          actor: Google Flights / Skyscanner / Kayak
          stage: Discovery
          channel: Search and metasearch distribution
          touchpoints:
            - Official partner lists repeatedly include the major flight-discovery platforms.
            - Traffic discovery sits upstream of Etraveli-owned booking and fulfilment surfaces.
        - label: Booking.com 航班结账
          actor: Booking.com
          stage: Partner checkout
          channel: Strategic OTA partnership
          touchpoints:
            - Collaboration was first established in 2019.
            - Public deployment markers move from 27 countries in 2021 to 57 countries in 2025.
        - label: 自有 OTA 转化
          actor: Gotogate / Mytrip / Flightnetwork / Supersaver
          stage: Direct consumer sale
          channel: Owned brands
          touchpoints:
            - Consumer OTA brands remain active even as B2B becomes the faster growth vector.
            - Consumer-service quality can affect durability because post-booking support sits on these brands.
        - label: TripStack 分销层
          actor: OTAs / airlines
          stage: B2B content access
          channel: TripStack / virtual interlining
          touchpoints:
            - The 2019 TripStack acquisition was framed as a way to expand airline integration capabilities.
            - Airline-partnership scale broadens the addressable partner base for flight content distribution.
        - label: Precision 金融科技扩张
          actor: Airlines / OTAs / payment providers
          stage: Attach and monetise
          channel: Fraud prevention and travel flexibility
          touchpoints:
            - Precision is now positioned as a dedicated fintech arm serving external B2B clients.
            - Named external clients include Outpayce by Amadeus, Mastercard Gateway, Sabre, and Checkout.com.
        - label: 预订后支持闭环
          actor: Travellers after purchase
          stage: Durability test
          channel: Refunds, changes, and customer support
          touchpoints:
            - Archived Trustpilot evidence shows substantial review volume at a 3.1 / 5 score.
            - Negative reviews cluster around cancellations, refunds, and support responsiveness.
    approximationNotes: null
    claimRefs:
      - CU002
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 仅根据本章保留的证据和缺口，对发生可能性、影响、缓释成熟度和剩余严重性进行定性排序。
    data:
      columns:
        - id: likelihood
          label: 可能性
        - id: impact
          label: 影响
        - id: mitigation
          label: 缓释成熟度
        - id: residual
          label: 剩余严重性
      rows:
        - id: partner-concentration
          label: 大型平台集中度
          values:
            - value: Medium
            - value: High
            - value: Medium
            - value: High
        - id: customer-servicing
          label: 客户服务与退款
          values:
            - value: Unknown
            - value: High
            - value: Low / undisclosed
            - value: High
        - id: regulatory
          label: 竞争与消费者监管
          values:
            - value: Medium
            - value: High
            - value: Medium
            - value: High
        - id: fraud-controls
          label: 欺诈与支付控制
          values:
            - value: Medium
            - value: High
            - value: Medium; company-claimed
            - value: Medium-high
        - id: industry-pressure
          label: 航空公司利润率与运营中断压力
          values:
            - value: High at sector level
            - value: Medium-high
            - value: Unknown
            - value: Medium-high
        - id: capital-structure
          label: 杠杆与流动性不透明
          values:
            - value: Unknown
            - value: High
            - value: Unknown
            - value: High
    approximationNotes: 各类别是分析师的定性综合，不是数值概率；未知输入仍保持未知，不会被打成低风险。
    claimRefs:
      - CR003
      - CR007
      - CR009
      - CR011
      - CR013
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模和合作伙伴验证支持继续关注，但未披露的定价条款与退出路径风险使建议仍停留在“继续研究”。
    data:
      nodes:
        - label: 规模验证
          detail: 2024 年订单和商品总销售额显示出可观规模。
        - label: 盈利能力验证
          detail: 2024 年 EBITDA 超过 €163 million。
        - label: 战略验证
          detail: Booking 续约和 KKR 入股验证了其战略相关性。
        - label: 退出与条款风险
          detail: 2021 年战略出售受阻，2025 年价格未披露，限制了可比性。
        - label: 入场纪律
          detail: 需要私下尽调股权结构表、杠杆和保护条款。
        - label: 建议
          detail: 继续研究 / 中等信心 / 高风险 / 估值立场未知
      edges:
        - from: Scale proof
          to: Profitability proof
          label: 只有规模、没有利润率还不够
        - from: Profitability proof
          to: Strategic validation
          label: 运营验证支持投资者兴趣
        - from: Strategic validation
          to: Exit and term risk
          label: 但验证不等于价格披露
        - from: Exit and term risk
          to: Entry discipline
          label: 条款不透明就需要保护
        - from: Entry discipline
          to: Recommendation
          label: 价格可纳入投资判断前没有买入理由
    approximationNotes: 流程是定性的，用于排列决策逻辑，而不是量化权重。
    claimRefs:
      - CV008
      - CV011
      - CV013
      - CV014
