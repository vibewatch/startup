              一同完成重要少数股权投资，而联合发布的公司公告称财务细节未披露。因此，公开投资者仍无法确认资金是注入公司还是支付给出售股东，也无法确认交易后的杠杆、契约余量或下一次融资触发条件。历史上的战略兴趣确实存在：Booking
              在 2021 年同意以约 EUR1.63 billion 收购 Etraveli。Etraveli 后来称交易在 2023
              年被阻止，委员会检索到的并购控制概览也表示，如果没有合适承诺，存在问题的组合可能被禁止。因此，战略退出选择不能被视为无摩擦的资金支持。
