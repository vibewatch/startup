    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与平台形态
        blocks:
          - type: paragraph
            body: >-
              Etraveli Group 如今对自己的定义已不只是消费者 OTA。从官网、平台页面和近期公司公告来看，它是一家总部位于 Stockholm
              的航旅科技平台，把自有消费者品牌与面向合作伙伴的分销、履约和金融科技模块结合起来。反复出现的规模指标更能说明业务覆盖面，而非经审计的收入：75+ 个市场、超过 4800 万年旅客，以及涵盖
              Tripstack、Precision、Wenrix、Mytrip、Flightnetwork、Gotogate 和 Flygresor.se 的品牌组合。这种组合对后续章节很重要，因为公司已经同时跨在 B2B
              基础设施和消费者需求聚合两端，而不是单一、狭窄的 OTA 模式。
