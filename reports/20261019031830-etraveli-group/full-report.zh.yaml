      - number: '8.4'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              最终尽调重点不在于 Etraveli 是否具备产品市场匹配，而在于资本结构中隐藏的部分是否吞噬了过多经营上行空间。管理层应提供完整的 KKR
              交易文件、当前债务和契约包、按总预订额和贡献利润划分的合作伙伴集中度，以及从 2024 年 EBITDA 到 2025-2026 年自由现金流的桥接。建设性的尽调结果应显示干净的少数股东经济性、适度杠杆，并证明
              Precision 和 TripStack 带来增量利润，而不只是表面规模。如果当前估值暗含接近 2021
              年被阻止交易的战略退出倍数，少数分销伙伴主导利润捕获，或资方保护条款让新投资者处于次位却没有价格补偿，投资论点就会失效。
            claimRefs:
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据支持关注，不支持接受当前价格
            body: Etraveli 看起来像一个规模化、EBITDA 为正的旅行基础设施资产，但当前少数股权重组的价格和条款细节仍未披露。在投资者看到实际估值、杠杆和权利包之前，理性立场应是继续研究，而不是按照过时的战略先例追价。
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV013
