      - number: '3.3'
        title: 定价、切换成本与锁定
        blocks:
          - type: paragraph
            body: >-
              留存来源没有披露 Etraveli B2B
              产品的目录价、交易费、实际抽佣率、最低承诺、排他性、服务水平、实施时间或折扣。因此，证据支持的是产品打包比较，而非价格与性能结论。内容、票务、履约、支付、欺诈控制和客服的整合，可能带来运营切换成本，因为替代方案必须复现多个相互连接的工作流。但这只是推断，而非经测量的留存结果：指定来源集中没有公开迁移研究、续约率、合同期限分布或多归属分析。定价能力和客户锁定仍是重要尽调问题。
            claimRefs:
              - CP003
              - CP005
              - CP014
              - CP015
          - type: table
            tableRef: TP003
