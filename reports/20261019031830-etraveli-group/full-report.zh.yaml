  - id: TV002
    title: 正反论点表
    columns:
      - 论点
      - 哪些事实会改变判断
    rows:
      - - 已有规模化验证：2024 年商品总销售额接近 €14 billion，EBITDA 超过 €163 million，服务覆盖超过 4,800 万名旅客；这是真正的平台，而不是概念资产。
        - 新鲜、经审计的 2025-2026 年财务数据若能证明利润率持续兑现，将显著增强信心。
      - - 战略验证已经出现：Booking.com 续约八年，KKR 成为少数股东，说明 Etraveli 对大型旅游平台和财务投资者仍有战略价值。
        - 合作伙伴层面的收入与贡献利润集中度数据，既可能证实业务已经多元化，也可能暴露其对少数渠道的脆弱依赖。
      - - 价格支撑不足：2025 年 KKR 交易没有披露财务条款，公开证据无法验证当前入场倍数或下行保护。
        - 股权结构表、债务明细以及 KKR/CVC 的确切条款，可能让判断从“未知”变为“可纳入投资判断”。
      - - 退出风险真实存在：上一次公开报道的估值对应 2021 年一笔战略出售，但该交易后来未通过欧洲竞争审查，因此不能直接照搬这一先例。
        - 若能绘出不依赖受阻战略逻辑、而是走投资者之间转售或 IPO 的现实退出路径，下行风险会降低。
    notes: 各行把有来源支撑的证据转化为投资判断测试，而不是直接下结论判断公允价值。
