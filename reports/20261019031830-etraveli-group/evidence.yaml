evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current private valuation, KKR entry price, and any preference or instrument terms.
    whyItMatters: Entry valuation and security terms drive downside protection and return math.
    diligencePath: Request the KKR transaction deck, board materials, and current cap-table summary.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: leverage
    missingEvidence: Debt load, cash balance, covenant package, and near-term liquidity profile.
    whyItMatters: Sponsor-backed ownership without leverage visibility makes solvency and exit risk hard to underwrite.
    diligencePath: Request lender presentation materials, debt schedules, and latest monthly cash reporting.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Full board composition, committee structure, and complete founder roster.
    whyItMatters: Governance quality and founder continuity affect control, succession, and decision velocity.
    diligencePath: Obtain the current board pack, governance chart, and founder / executive bios.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue mix, take rate, and partner concentration across Booking.com, owned OTAs, and other channels.
    whyItMatters: A scaled platform can still be economically fragile if GMV or margin is concentrated in a small set of partners.
    diligencePath: Request channel-level GMV, gross profit, renewal terms, and cohort retention by partner.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current independent TAM/SAM/SOM for flight-commerce distribution, fulfilment, and travel-fintech workflows
      relevant to Etraveli.
    whyItMatters: >-
      Without an external sizing benchmark, the chapter can bound reach and demand signals but cannot test whether
      Etraveli's disclosed operating scale implies large remaining whitespace.
    diligencePath: >-
      Obtain current analyst or public-company market studies that segment flight booking infrastructure, fulfilment,
      and travel-fintech spend rather than total travel demand.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: A revenue mix, take-rate, and gross-margin bridge across consumer OTA, B2B content, and fintech product lines.
    whyItMatters: >-
      The market can look attractive while unit economics differ sharply by segment, which directly affects valuation
      and how much of the apparent market is actually monetizable.
    diligencePath: >-
      Request management reporting on revenue by segment, key partner concentration, take rates, and contribution
      margins for OTA, TripStack/content, and Precision businesses.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Comparable list and realized pricing, transaction units, minimum commitments, discounting, revenue share, and
      renewal terms.
    whyItMatters: >-
      Without commercial terms, product breadth cannot be translated into price competitiveness, gross-margin quality,
      or buyer ROI.
    diligencePath: >-
      Request current contracts and invoices for representative Tripstack, Precision, and flight-fulfilment customers,
      then run a named-vendor RFP.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Contract duration, renewal and churn cohorts, implementation timelines, migration cost, exclusivity, and
      multi-homing behavior.
    whyItMatters: >-
      The moat thesis depends on whether connected workflows create durable retention rather than merely a broad product
      catalog.
    diligencePath: >-
      Review customer-level contracts and cohort retention, then interview former and current partners about replacement
      effort.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Neutral named-competitor benchmarks for content coverage, conversion, fraud loss, false declines, service quality,
      and implementation time.
    whyItMatters: >-
      Company descriptions and a launch report establish scope but not superiority over OTA, airline-build, or
      specialist alternatives.
    diligencePath: >-
      Commission a buyer reference set and benchmark Etraveli against at least two named vendors for each material
      module.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue, gross profit, traffic, and order concentration by Booking.com and other major distribution partners.
    whyItMatters: >-
      Powerful channels can reinforce reach while retaining leverage to negotiate, multi-source, or internalize the
      underlying capability.
    diligencePath: >-
      Obtain partner-level revenue and contribution-margin cohorts, contract renewal dates, and concentration
      sensitivity analyses.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: missing-source
    severity: material
    topic: liquidity-and-leverage
    missingEvidence: Current cash balance, gross and net debt, covenant terms, maturity ladder, and management runway plan.
    whyItMatters: >-
      Underwriting capital adequacy and downside survivability is not possible without verified balance-sheet and
      covenant data.
    diligencePath: Request the latest lender deck, audited balance sheet, debt agreements, and monthly liquidity reporting pack.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Recognized revenue, take rate, segment mix, and revenue-recognition policy across OTA, partner, and fintech
      streams.
    whyItMatters: Gross sales and total transaction value cannot substitute for revenue quality, concentration, or margin analysis.
    diligencePath: >-
      Request audited revenue by stream, take-rate bridge, and the accounting memo for booking, fulfilment, and
      ancillary recognition.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
  - type: missing-source
    severity: material
    topic: unit-economics-gap
    missingEvidence: CAC, payback, refund-cost burden, customer-support cost, and partner-specific gross-margin contribution.
    whyItMatters: >-
      The model may be attractive at scale, but unit economics determine whether growth converts into durable cash
      generation.
    diligencePath: Request cohort economics, refund-loss reporting, support-cost allocations, and partner P&Ls for the top channels.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: private-evidence-only
    severity: minor
    topic: adverse-service-risk
    missingEvidence: Internal complaint-rate, refund-cycle, and chargeback metrics by brand and geography.
    whyItMatters: >-
      Customer-review evidence signals risk, but internal operating data is needed to size the actual financial
      exposure.
    diligencePath: >-
      Request monthly CX dashboards, refund aging, chargeback rates, and remediation plans for Gotogate, Mytrip, and
      Flightnetwork.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Public security certifications, privacy-control documentation, customer-facing status history, and uptime /
      incident metrics.
    whyItMatters: >-
      Product breadth is visible, but without control evidence investors cannot underwrite implementation risk,
      operational resilience, or enterprise trust posture.
    diligencePath: >-
      Request SOC 2 or ISO 27001 materials, privacy/security overview documents, status-page history, and partner SLA /
      incident-response commitments.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
