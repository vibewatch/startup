figures:
  - id: FP001
    title: Competitive route positioning
    type: quadrant
    summary: >-
      Analyst-coded ordinal placement shows Etraveli's disclosed breadth while
      separating broad infrastructure, storefront, channel, internal-build, and
      specialist routes; it is not an independent product benchmark.
    data:
      xAxis:
        label: Evidenced solution breadth (1 narrow to 5 broad)
        min: 1
        max: 5
      yAxis:
        label: Evidenced external distribution reach (1 internal to 5 multi-channel)
        min: 1
        max: 5
      points:
        - label: Etraveli integrated stack
          x: 5
          y: 5
          detail: Owned OTAs, content, fulfilment, virtual interlining, and fintech with named global channels.
        - label: Tripstack infrastructure route
          x: 4
          y: 4
          detail: Partner-facing flight content and service gateway within Etraveli.
        - label: Precision specialist route
          x: 2
          y: 3
          detail: Fraud Prevention and Travel Flexibility sold as travel-fintech products.
        - label: OTA incumbent route
          x: 3
          y: 5
          detail: Broad traveller-facing distribution, with backend scope unresolved in the assigned evidence.
        - label: Airline internal-build route
          x: 4
          y: 1
          detail: Potentially broad carrier-controlled workflow, but cross-platform reach is not evidenced.
        - label: Specialist fintech route
          x: 1
          y: 3
          detail: Narrow modular alternative; named-vendor performance and reach were not available.
    approximationNotes: >-
      Coordinates are qualitative 1-5 ordinal codes derived from disclosed scope and
      named channel relationships, not market-share, price, conversion, fraud-loss, or
      customer-satisfaction measurements. Unknown competitor capabilities are not
      scored as absent.
    claimRefs: [CP004, CP005, CP007, CP009, CP016]
callouts:
  - calloutType: strength
    title: Breadth is the clearest disclosed differentiator
    body: >-
      Etraveli combines consumer demand surfaces with partner flight infrastructure
      and fintech products, giving it more disclosed layers than a point solution.
    claimRefs: [CP001, CP003, CP005]
  - calloutType: risk
    title: No public price-performance benchmark
    body: >-
      The assigned evidence does not disclose comparable pricing, contract terms,
      approval-rate lift, service quality, or switching outcomes, so breadth cannot
      yet be translated into proven pricing power or retention.
    claimRefs: [CP014, CP015]
