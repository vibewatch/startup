company:
  name: "Etraveli Group"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Etraveli has credible scale, positive EBITDA evidence, and repeat partner validation, but public
    valuation evidence is still too thin for a price-positive call. The only explicit headline value in
    this source set is Booking's 2021 €1.63 billion acquisition agreement, while the 2025 KKR minority
    investment disclosed no price or instrument terms and the prior strategic exit path was later blocked,
    keeping the chapter at research-more with strict entry discipline.
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and entry discipline"
    body: >-
      Public evidence supports a business-quality judgment more than a price judgment. The company has
      disclosed meaningful operating proof, including nearly €14 billion of 2024 gross sales, EBITDA above
      €163 million, and a footprint serving tens of millions of travelers across more than 75 markets, while
      Booking.com renewed for another eight years and KKR entered as a minority shareholder. That combination
      shows real strategic relevance, but it does not establish today's underwriteable entry price because
      the July 2025 shareholder transaction disclosed no financial terms and public materials still do not
      show leverage, preference stack, or sponsor mark. The right call on current public evidence is
      research-more, with medium confidence, high risk, and an unknown valuation stance unless price resets
      below stale strategic precedent or private diligence fills the financing and downside-protection gaps.
    claimRefs: ["CV003", "CV007", "CV008", "CV011", "CV013", "CV014"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "valuation-anchors-and-comparables"
    title: "Valuation anchors and comparables"
    body: >-
      The usable public comparables are narrow. The cleanest disclosed price anchor remains Booking
      Holdings' 2021 agreement to acquire Etraveli for €1.63 billion, but that was a strategic-control
      outcome formed in a different travel recovery context and it did not survive the later European
      competition process. Since then, the company has shown larger operating scale, better B2B positioning,
      and a new KKR minority investment, yet the 2025 sponsor recap did not disclose price or structure.
      That means public evidence can support directionally that the asset matured, but not the exact extent
      of value accretion or dilution. In practice, the 2021 headline works as an upper-bound reference to
      interrogate rather than a mark to reuse, especially because the strategic-exit path that generated it
      has already proven regulator-sensitive.
    claimRefs: ["CV001", "CV002", "CV004", "CV005", "CV006", "CV013", "CV014"]
    tableRefs: ["TV002"]
  - id: "scenario-underwriting"
    title: "Scenario underwriting"
    body: >-
      The scenario frame should stay qualitative until the company discloses current valuation terms or an
      investor gains access to a full private data room. The bull case rests on Etraveli sustaining its B2B
      pivot, defending its Booking.com and metasearch relationships, and expanding higher-margin fintech
      products such as Precision while keeping EBITDA conversion intact. The base case accepts that the
      business is real and scaled, but assumes current price discovery remains private and that any buyer
      should insist on a discount to the stale 2021 strategic headline until leverage, covenants, and
      preference overhang are visible. The bear case is that current sponsorship terms already capitalize
      optimistic exit assumptions despite concentration, competition review precedent, and unclear balance
      sheet obligations, creating more downside than upside for new minority capital.
    claimRefs: ["CV007", "CV008", "CV009", "CV010", "CV011", "CV012", "CV013", "CV014", "CV015"]
    tableRefs: ["TV003"]
  - id: "final-diligence-and-thesis-breakers"
    title: "Final diligence asks and thesis-breakers"
    body: >-
      The final diligence focus is not whether Etraveli has product-market fit, but whether the hidden parts
      of the capital structure absorb too much of the operating upside. Management should produce the full
      KKR transaction documentation, current debt and covenant package, partner concentration by gross
      bookings and contribution profit, and a bridge from 2024 EBITDA to 2025-2026 free-cash generation.
      A constructive diligence outcome would show clean minority economics, moderate leverage, and evidence
      that Precision and TripStack add incremental margin rather than only headline scale. The thesis breaks
      if current valuation implicitly assumes a strategic-exit multiple near the blocked 2021 outcome, if a
      small number of distribution partners dominate profit capture, or if sponsor protections subordinate a
      new investor without compensating price.
    claimRefs: ["CV008", "CV011", "CV012", "CV013", "CV014", "CV015"]
tables:
  - id: "TV001"
    title: "Recommendation summary table"
    columns: ["Dimension", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "research-more", "Do not upgrade to buy on public evidence alone."]
      - ["Confidence", "medium", "Business quality is visible, but price evidence is incomplete."]
      - ["Risk rating", "high", "Undisclosed terms, concentration, and exit-path uncertainty can dominate return math."]
      - ["Valuation stance", "unknown", "Current sponsor mark and instrument structure are not publicly disclosed."]
      - ["Entry discipline", "Require clear downside protection or a conservative price reset versus stale precedent", "Underwrite only after private diligence closes the cap-table and leverage gaps."]
    notes: "Assessment uses public sources only; unknown means the current valuation, leverage, and preference stack are undisclosed."
    claimRefs: ["CV002", "CV008", "CV013", "CV014"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Argument", "What would change the view"]
    rows:
      - ["Scaled proof exists: 2024 gross sales near €14 billion, EBITDA above €163 million, and a >48 million traveller footprint indicate a real platform rather than a concept asset.", "Fresh audited 2025-2026 financials showing durable margin conversion would strengthen conviction materially."]
      - ["Strategic validation exists: Booking.com renewed for eight years and KKR joined as a minority owner, supporting relevance to major travel platforms and financial sponsors.", "Partner-level revenue and contribution-profit concentration data could either confirm diversification or expose fragile dependence on a few channels."]
      - ["Price support is weak: the 2025 KKR transaction disclosed no financial terms, so public evidence cannot validate today's entry multiple or downside protections.", "A cap table, debt schedule, and the exact KKR/CVC terms could move the stance from unknown to underwriteable."]
      - ["Exit risk is real: the last public headline value was attached to a 2021 strategic sale that later failed European competition review, so that precedent cannot be reused at face value.", "A realistic exit map showing sponsor-to-sponsor or IPO pathways that do not rely on the blocked strategic logic would reduce downside risk."]
    notes: "Rows translate source-backed evidence into underwriting tests rather than stand-alone conclusions about fair value."
    claimRefs: ["CV003", "CV004", "CV005", "CV008", "CV011", "CV013", "CV014"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "B2B growth persists, Booking and metasearch partnerships deepen, and Precision adds incremental margin with clean sponsor terms.", "Could justify paying near or above the stale 2021 strategic headline only if private diligence confirms strong EBITDA quality and limited preference overhang.", "Partner concentration, hidden leverage, and fintech monetization not scaling as promised.", "Needs fresh audited 2025-2026 growth, margin, and cap-table disclosure; not proven by public evidence today."]
      - ["Base", "Core platform remains strong, but price discovery stays private and investors demand protection against concentration and balance-sheet opacity.", "Track or engage only at a clear discount to the 2021 strategic reference until current terms, debt, and downside protections are visible.", "Opaque sponsor economics, uncertain cash conversion, and limited public comparable set.", "Best fit with today's public record."]
      - ["Bear", "Current sponsor mark embeds strategic-exit optimism while regulatory sensitivity, leverage, or preference stack materially cap minority upside.", "If terms assume 2021-style strategic value without comparable exit certainty, downside dominates and passing becomes rational.", "Blocked exit pathways, covenant pressure, or a handful of counterparties capturing most of the economics.", "Any diligence readout showing aggressive valuation, heavy leverage, or subordinating minority protections."]
    notes: "Scenario bands are qualitative because public evidence does not disclose the current valuation, debt package, or investor rights."
    claimRefs: ["CV004", "CV008", "CV011", "CV012", "CV013", "CV014", "CV015"]
