        - from: "Profitability proof"
          to: "Strategic validation"
          label: "operating proof supports sponsor interest"
        - from: "Strategic validation"
          to: "Exit and term risk"
          label: "but validation is not price disclosure"
        - from: "Exit and term risk"
          to: "Entry discipline"
          label: "opaque terms require protection"
        - from: "Entry discipline"
          to: "Recommendation"
          label: "no buy case until price is underwriteable"
    approximationNotes: "Flow is qualitative; it orders decision logic rather than quantifying weights."
    claimRefs: ["CV008", "CV011", "CV013", "CV014"]
callouts:
  - calloutType: "recommendation"
    title: "Public evidence supports interest, not price acceptance"
    body: >-
      Etraveli looks like a scaled, EBITDA-positive travel infrastructure asset, but the current minority
      recap still has undisclosed price and term detail. Until investors see the actual valuation, leverage,
      and rights package, the rational stance is research-more rather than paying up on stale strategic
      precedent.
    claimRefs: ["CV008", "CV013", "CV014"]
