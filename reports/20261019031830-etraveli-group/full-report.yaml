              - CI006
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and exit optionalities
        blocks:
          - type: paragraph
            body: >-
              The latest public capital event improves sponsor backing but does not answer liquidity sufficiency.      
              Etraveli's official release says KKR completed a significant minority investment alongside CVC, while a
              syndicated company release says financial details were not disclosed. Public investors therefore still
              cannot verify whether proceeds funded the company or selling shareholders, nor can they verify post-deal
              leverage, covenant headroom, or the trigger for another financing. Historical strategic interest is real:
              Booking agreed to buy Etraveli for about EUR1.63 billion in 2021. Etraveli later said the transaction was
              blocked in 2023, and the Commission's retrieved merger-control overview states that problematic
              combinations can be prohibited absent suitable commitments. Strategic exit optionality should therefore
              not be treated as frictionless funding support.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public evidence is good enough to support a directional view: Etraveli has meaningful scale, positive
              EBITDA, a diversified product surface, and sponsor support from CVC and KKR. It is not good enough to
              underwrite revenue quality or capital intensity with conviction. The strongest public positives are
              transaction scale, EBITDA disclosure, and evidence that partner-facing distribution and fintech are
              strategic priorities. The strongest negatives are opacity around revenue recognition, take rate,
              liquidity, and leverage, plus adverse consumer-service evidence from the group's OTA estate that could
              create refund, support, or reputational friction. The chapter therefore supports a qualified financial
              view rather than a clean underwriting green light.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI006
              - CI008
              - CI012
              - CI015
              - CI016
