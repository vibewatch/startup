  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Etraveli's customer journey now mixes consumer OTA conversion with embedded B2B platform, airline, and fintech
      distribution loops.
    data:
      nodes:
        - label: Metasearch discovery partners
          actor: Google Flights / Skyscanner / Kayak
          stage: Discovery
          channel: Search and metasearch distribution
          touchpoints:
            - Official partner lists repeatedly include the major flight-discovery platforms.
            - Traffic discovery sits upstream of Etraveli-owned booking and fulfilment surfaces.
        - label: Booking.com flight checkout
          actor: Booking.com
          stage: Partner checkout
          channel: Strategic OTA partnership
          touchpoints:
            - Collaboration was first established in 2019.
            - Public deployment markers move from 27 countries in 2021 to 57 countries in 2025.
        - label: Owned OTA conversion
          actor: Gotogate / Mytrip / Flightnetwork / Supersaver
          stage: Direct consumer sale
          channel: Owned brands
          touchpoints:
            - Consumer OTA brands remain active even as B2B becomes the faster growth vector.
            - Consumer-service quality can affect durability because post-booking support sits on these brands.
        - label: TripStack distribution layer
          actor: OTAs / airlines
          stage: B2B content access
          channel: TripStack / virtual interlining
          touchpoints:
            - The 2019 TripStack acquisition was framed as a way to expand airline integration capabilities.
            - Airline-partnership scale broadens the addressable partner base for flight content distribution.
        - label: Precision fintech expansion
          actor: Airlines / OTAs / payment providers
          stage: Attach and monetise
          channel: Fraud prevention and travel flexibility
          touchpoints:
            - Precision is now positioned as a dedicated fintech arm serving external B2B clients.
            - Named external clients include Outpayce by Amadeus, Mastercard Gateway, Sabre, and Checkout.com.
        - label: Post-booking support loop
          actor: Travellers after purchase
          stage: Durability test
          channel: Refunds, changes, and customer support
          touchpoints:
            - Archived Trustpilot evidence shows substantial review volume at a 3.1 / 5 score.
            - Negative reviews cluster around cancellations, refunds, and support responsiveness.
