          footprint indicate a real platform rather than a concept asset.
        - Fresh audited 2025-2026 financials showing durable margin conversion would strengthen conviction materially.
      - - >-
          Strategic validation exists: Booking.com renewed for eight years and KKR joined as a minority owner,
          supporting relevance to major travel platforms and financial sponsors.
        - >-
          Partner-level revenue and contribution-profit concentration data could either confirm diversification or
          expose fragile dependence on a few channels.
      - - >-
          Price support is weak: the 2025 KKR transaction disclosed no financial terms, so public evidence cannot
          validate today's entry multiple or downside protections.
        - A cap table, debt schedule, and the exact KKR/CVC terms could move the stance from unknown to underwriteable.
      - - >-
          Exit risk is real: the last public headline value was attached to a 2021 strategic sale that later failed
          European competition review, so that precedent cannot be reused at face value.
        - >-
          A realistic exit map showing sponsor-to-sponsor or IPO pathways that do not rely on the blocked strategic
          logic would reduce downside risk.
    notes: >-
      Rows translate source-backed evidence into underwriting tests rather than stand-alone conclusions about fair
      value.
