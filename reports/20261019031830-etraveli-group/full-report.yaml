  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          B2B growth persists, Booking and metasearch partnerships deepen, and Precision adds incremental margin with
          clean sponsor terms.
        - >-
          Could justify paying near or above the stale 2021 strategic headline only if private diligence confirms strong
          EBITDA quality and limited preference overhang.
        - Partner concentration, hidden leverage, and fintech monetization not scaling as promised.
        - Needs fresh audited 2025-2026 growth, margin, and cap-table disclosure; not proven by public evidence today.
      - - Base
        - >-
          Core platform remains strong, but price discovery stays private and investors demand protection against
          concentration and balance-sheet opacity.
        - >-
          Track or engage only at a clear discount to the 2021 strategic reference until current terms, debt, and
          downside protections are visible.
        - Opaque sponsor economics, uncertain cash conversion, and limited public comparable set.
        - Best fit with today's public record.
      - - Bear
        - >-
          Current sponsor mark embeds strategic-exit optimism while regulatory sensitivity, leverage, or preference
          stack materially cap minority upside.
        - >-
          If terms assume 2021-style strategic value without comparable exit certainty, downside dominates and passing
          becomes rational.
        - Blocked exit pathways, covenant pressure, or a handful of counterparties capturing most of the economics.
        - Any diligence readout showing aggressive valuation, heavy leverage, or subordinating minority protections.
    notes: >-
      Scenario bands are qualitative because public evidence does not disclose the current valuation, debt package, or
      investor rights.
    claimRefs:
      - CV004
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
