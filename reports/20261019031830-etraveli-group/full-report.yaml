      - number: '5.2'
        title: The disclosed architecture centers on a content gateway plus fulfilment and fintech layers
        blocks:
          - type: paragraph
            body: >-
              The most specific public architecture description comes from official 2025-2026 product copy rather than
              technical documentation. Tripstack is described as the B2B Flights-as-a-Service gateway into Etraveli's
              platform, bundling flight content access with virtual interlining and downstream services such as
              payments, pricing, and customer support. Booking's extended partnership reinforces that the product is
              embedded in large external travel surfaces rather than limited to owned brands, while IATA's NDC standard
              provides context for why distribution technology in this category is integration-heavy and
              standards-sensitive. What remains absent is equally important: the public pool does not expose APIs,
              deployment patterns, sandbox materials, or reliability targets at the same specificity as the module and
              partnership descriptions.
            claimRefs:
