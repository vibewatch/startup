      - number: '1.2'
        title: Ownership, leadership, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Control today is sponsor-led. The retained evidence shows a long ownership sequence culminating in CVC's
              2017 control and KKR's completed significant minority investment in December 2025, while the separate
              Booking path moved from a 2019 commercial partnership to a 2021 announced acquisition agreement and then a
              2023 EU block. Mathias Hedlund is the only consistently evidenced group-level chief executive in the
              assigned pool, while the 2026 Precision release adds Peny Rizou for the fintech arm. That is enough to
              name the current sponsor set and visible operating spokespeople, but not enough to reconstruct the full
              board or founder roster from public evidence alone.
