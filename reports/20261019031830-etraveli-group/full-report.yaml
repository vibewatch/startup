  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer map
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence frames Etraveli as a flight-focused commerce stack, not a general travel-software
              vendor. Company disclosures describe the group as a provider of flight sales, fulfilment services,
              flight-content delivery, and fintech products, while the third-party profile in Wikipedia still describes
              the business around flight distribution, online booking, and fulfilment. That combination supports a
              narrower market boundary centered on flight-commerce infrastructure: consumer OTA distribution through
              brands such as Gotogate, Mytrip, and Flightnetwork; B2B content and fulfilment through TripStack; and
              travel-fintech products, especially fraud prevention and flexibility, through Precision. The buyer map is
              similarly concentrated. Precision explicitly targets airlines, OTAs, and global travel businesses, while
              partner disclosures show Etraveli plugging into large travel platforms and payment rails rather than
              selling undifferentiated horizontal software. The practical consequence for diligence is that TAM cannot
              be anchored on all travel spend; it should be bounded to the flight booking, fulfilment, payments, and
              post-booking workflows that Etraveli can actually intermediate.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing and market structure
        blocks:
          - type: paragraph
            body: >-
              The chapter cannot support a clean public TAM/SAM/SOM stack from the assigned pool, so the most defensible
              sizing view uses operating and adoption proxies. Late-2025 and 2026 company disclosures place Etraveli at
              more than 48 million travellers annually, over 75 markets, and €16 billion of total transaction value,
              while the anniversary release adds a historical lens of 25 million travel orders worth nearly €14 billion
              in 2024 and says B2B partnerships are now the fastest-growing part of the business. Independent evidence
              adds two useful constraints. First, PhocusWire's 2021 reporting on Booking's flight effort shows why
              flights matter strategically to major platforms: the product was live in 27 countries and more than 25% of
              flight bookers were entirely new customers, implying customer-acquisition and cross-sell value beyond thin
              air-ticket margins. Second, Tracxn's count of 136 active competitors indicates a fragmented supply side
              rather than a winner-take-all niche. Together, these sources support a market that is large enough to
              matter, but only when defined as a flight-commerce layer with measurable transaction throughput and
              partner demand, not as total global travel expenditure.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM014
      - number: '2.3'
        title: Adoption drivers, constraints, and open diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers in the public record are concrete. Precision's own positioning is built around a
              low-margin operating environment where fraud, cancellations, and payment acceptance can materially change
              profitability, and the Outpayce partnership says the product already screened multibillion-dollar
              transaction flows in more than 200 countries before broader commercialization. That makes buyer pain
              visible, not hypothetical. The same partnership also shows the preferred adoption path: travel companies
              reach Etraveli through existing travel infrastructure, including a single connection into Outpayce and a
              broader content relationship in which Amadeus becomes Etraveli's primary source for NDC content. The main
              counterweight is that platform consolidation and adjacent expansion do attract scrutiny: the UK's CMA
              formally examined whether Booking's proposed acquisition could lessen competition before ultimately
              clearing it at Phase 1. The bigger unresolved issue for valuation is not whether demand exists, but
              whether outside investors can isolate segment economics. The assigned evidence still does not disclose a
              current independent TAM/SAM/SOM, B2B take rate, or revenue split across OTA, content, and fintech lines.
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM011
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Flights matter because they acquire demand, not because ticketing margins are rich
            body: >-
              The strongest independent demand signal in the assigned pool is not a TAM report but Booking.com's comment
              that more than a quarter of its flight bookers were entirely new customers. That makes Etraveli's
              partner-facing booking and fulfilment stack strategically valuable even in a structurally low-margin
              market.
            calloutType: insight
            claimRefs:
              - CM007
              - CM015
          - type: callout
            title: Market opportunity is easier to see than segment economics
            body: >-
              Public evidence supports scale, buyer pain, and partner relevance, but it still does not isolate a current
              SAM/SOM, take rate, or revenue mix across OTA, B2B content, and fintech lines. That leaves a material gap
              between visible market activity and investor-grade market sizing.
            calloutType: risk
            claimRefs:
              - CM005
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and solution routes
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than a list of consumer OTAs. Etraveli presents an integrated route that
              combines owned OTA brands with flight sales, fulfilment, Tripstack virtual interlining, Precision fintech,
              Wenrix, and a flight-comparison property. Buyers can instead use a large OTA or distribution platform,
              acquire traffic through metasearch, assemble specialist fraud and payments tools, or build airline
              capabilities internally. These routes are not interchangeable: a storefront controls demand, an
              infrastructure provider supplies content and fulfilment, and a specialist vendor solves a narrower
              operational problem. Etraveli's strategic distinction is the claimed ability to span several layers,
              although the assigned evidence does not provide a neutral market-share ranking against each alternative.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
