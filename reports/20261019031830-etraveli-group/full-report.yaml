  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface is a hybrid of owned demand channels and partner infrastructure
        blocks:
          - type: paragraph
            body: >-
              Public 2025-2026 materials consistently describe Etraveli as a flight-technology provider rather than a
              narrow OTA. The customer workflow spans flight discovery, booking, fulfilment, and adjacent
              risk/flexibility products: Etraveli still runs consumer brands such as Gotogate, Mytrip, and
              Flightnetwork, but it now positions the faster-growing strategic layer as B2B infrastructure sold into
              large travel platforms and travel sellers. The retained source set also shows the module map is no longer
              just one booking front end; it includes Tripstack as the content and fulfilment gateway, Precision as the
              fintech arm, Wenrix as an AI layer for air commerce, and Flygresor.se as a flight-comparison asset. That
              breadth matters because the product is sold into multiple points in the airline-distribution workflow
              instead of relying on a single consumer conversion funnel.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
