        title: Scale markers and milestone trajectory
        blocks:
          - type: paragraph
            body: >-
              Public scale disclosure is directionally strong but not clean enough to treat as a single audited KPI set.
              The December 2025 completion release cites more than 48 million travellers annually and frames Etraveli as
              a world-scale flight intermediary, while the homepage and 2026 Precision release move current
