      - number: '4.2'
        title: Pricing, monetization, and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The main underwriting limitation is that public evidence describes how Etraveli monetizes without
              disclosing the realized economics of each stream. Official statements explain the company sells flights
              through its own brands, powers external partner flows, and now offers travel-fintech products such as
              fraud prevention and flexibility. That is enough to map mechanisms, but not to separate list pricing from
              realized pricing, or to quantify take rate, contribution margin by channel, support burden, or
              working-capital drag from cancellations and refunds. Because public sources emphasize gross sales,
              transaction value, traveller counts, and EBITDA rather than reported revenue or segment mix, revenue
              quality still depends on management data-room disclosure rather than the public record.
            claimRefs:
              - CI001
              - CI004
              - CI010
              - CI011
              - CI016
