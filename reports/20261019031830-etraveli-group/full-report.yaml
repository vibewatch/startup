  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform shape
        blocks:
          - type: paragraph
            body: >-
              Etraveli Group's current self-description is no longer just a consumer OTA. Across its homepage, platform
              page, and recent company releases, it presents as a Stockholm-headquartered flight-technology platform
              that combines owned consumer brands with partner-facing distribution, fulfilment, and fintech modules. The
              strongest recurring scale markers are breadth rather than audited revenue: 75+ markets, more than 48
              million annual travellers, and a brand portfolio spanning Tripstack, Precision, Wenrix, Mytrip,
              Flightnetwork, Gotogate, and Flygresor.se. That mix matters for later chapters because the business
              already straddles B2B infrastructure and consumer demand aggregation rather than a single narrow OTA
              archetype.
