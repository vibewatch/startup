      - number: '3.2'
        title: Capability breadth and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public disclosures support breadth more clearly than relative superiority. Precision is described with two
              products, Fraud Prevention and Travel Flexibility, while Tripstack is described as a gateway to flight
              content, virtual interlining, payments, pricing, customer support, and fulfilment. Travolution also
              reports integrations with Outpayce by Amadeus, Mastercard Gateway, Sabre, and Checkout.com. On
              distribution, Etraveli names Booking.com, Google Flights, Skyscanner, and Kayak as partners, and
              PhocusWire reported that Booking.com selected Etraveli to power flight ticketing in 2019. This network
              creates reach, but it may also place important demand channels in the hands of powerful counterparties
              that can multi-source, negotiate, or internalize parts of the stack.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP007
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
      - number: '3.3'
        title: Pricing, switching cost, and lock-in
        blocks:
          - type: paragraph
            body: >-
              No retained source discloses list prices, transaction fees, realized take rates, minimum commitments,
              exclusivity, service levels, implementation time, or discounting for Etraveli's B2B products. The evidence
              therefore supports a packaging comparison, not a price-performance conclusion. Integration across content,
              ticketing, fulfilment, payments, fraud controls, and customer service could create operational switching
              cost because a replacement would have to reproduce several connected workflows. That is an inference
              rather than a measured retention result: there is no public migration study, renewal rate,
              contract-duration distribution, or multi-homing analysis in the assigned source set. Pricing power and
              lock-in remain material diligence questions.
            claimRefs:
              - CP003
              - CP005
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP014
      - number: '3.4'
        title: Moat durability and displacement pressure
        blocks:
          - type: paragraph
            body: >-
              Scale may reinforce Etraveli's data, supplier, and operating advantages: the company says it served more
              than 48 million travellers annually across 75 markets, and separately reported 25 million 2024 orders
              worth nearly EUR14 billion in gross sales. Yet these figures are company-issued and do not show share,
              unit economics, or performance versus competitors. The strongest disconfirming evidence is strategic and
              regulatory. Booking's attempted acquisition indicates platform value, while the UK clearance and
              Etraveli's statement that the European Commission blocked the transaction show that combinations with a
              major demand platform can draw different competition outcomes. Precision's external commercialization also
              expands the addressable market while increasing overlap with specialist fintech vendors. Durability
              therefore depends on performance and partner economics that remain undisclosed, not on breadth alone.
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the clearest disclosed differentiator
            body: >-
              Etraveli combines consumer demand surfaces with partner flight infrastructure and fintech products, giving
              it more disclosed layers than a point solution.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP005
          - type: callout
            title: No public price-performance benchmark
            body: >-
              The assigned evidence does not disclose comparable pricing, contract terms, approval-rate lift, service
              quality, or switching outcomes, so breadth cannot yet be translated into proven pricing power or
              retention.
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Etraveli is not a pure SaaS vendor; the public record points to a hybrid flight-commerce model spanning
              owned OTA demand, partner-facing booking and fulfilment, and newer fintech monetization.       Company,
              partner, and independent sources describe consumer brands such as Gotogate, Mytrip, and Flightnetwork
              alongside B2B relationships with Booking.com, Google Flights, Skyscanner, Kayak, and other travel
              platforms. The clearest operating disclosure is company-issued rather than independently audited:
              management said the group handled 25 million travel orders worth nearly EUR14 billion in gross sales in
              2024, generated EBITDA above EUR163 million, and continued to scale through 2025. Those metrics are large
              enough to show relevance and operating leverage, but they are throughput and profit disclosures, not a
              full revenue bridge.
