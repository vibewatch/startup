      - number: '1.4'
        title: Downside signals and open diligence asks
        blocks:
          - type: paragraph
            body: >-
              The main downside signals in this pool are executional and transparency-driven rather than an acute new
              solvency or sanctions event. Trustpilot's Gotogate page aggregates a 3.1/5 rating with recurring
              complaints around cancellations, refunds, support responsiveness, and pricing friction, while the 2023 EC
              block remains a reminder that large strategic outcomes can face regulatory limits. For diligence, the
              unresolved items are not whether Etraveli exists at scale, but how value accrues: current private
              valuation, total raised, debt and covenant load, partner concentration economics, and the governance
              detail beneath a sponsor-backed cap table.
