  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and partner proof support interest, but undisclosed pricing terms and exit-path risk keep the recommendation
      at research-more.
    data:
      nodes:
        - label: Scale proof
          detail: 2024 orders and gross sales show meaningful volume.
        - label: Profitability proof
          detail: 2024 EBITDA exceeded €163 million.
        - label: Strategic validation
          detail: Booking renewal and KKR minority entry validate relevance.
        - label: Exit and term risk
          detail: Blocked 2021 strategic sale and undisclosed 2025 price limit comparability.
        - label: Entry discipline
          detail: Need private diligence on cap table, leverage, and protections.
        - label: Recommendation
          detail: research-more / medium confidence / high risk / valuation stance unknown
      edges:
        - from: Scale proof
          to: Profitability proof
          label: volume without margin is not enough
        - from: Profitability proof
          to: Strategic validation
          label: operating proof supports sponsor interest
        - from: Strategic validation
          to: Exit and term risk
          label: but validation is not price disclosure
        - from: Exit and term risk
          to: Entry discipline
          label: opaque terms require protection
        - from: Entry discipline
          to: Recommendation
          label: no buy case until price is underwriteable
    approximationNotes: Flow is qualitative; it orders decision logic rather than quantifying weights.
    claimRefs:
      - CV008
      - CV011
      - CV013
      - CV014
