companyProfile:
  summary: >-
    Etraveli Group is a Stockholm-based flight-commerce platform that blends consumer OTA brands with partner-facing
    booking, fulfilment, and travel-fintech capabilities. Retained public evidence shows the business operating at scale
    across 75+ markets with more than 48 million annual travellers, while recent releases highlight the CVC-KKR
    ownership structure, a long-running Booking.com partnership, and a dedicated Precision fintech repositioning. The
    main analytical gap is not whether the platform is real, but how current value, leverage, and sponsor terms are
    structured beneath the public operating story.
  headquarters: Stockholm, Sweden
  productSummary: >-
    Flight-commerce platform spanning consumer OTAs, booking and fulfilment infrastructure, and travel-fintech tooling
    across Tripstack, Precision, Wenrix, Mytrip, Flightnetwork, Gotogate, and Flygresor.se.
  customerFocus: Consumers plus travel-industry partners including OTAs, airlines, metasearch, and other distribution channels.
  businessModel: >-
    Mix of consumer OTA transaction economics, partner-facing distribution and fulfilment services, and travel-fintech
    monetization.
  stage: Late-stage private, sponsor-backed
  fundingStatus: >-
    CVC-controlled with KKR as a significant minority investor after the December 2025 completion of the transaction;
    current valuation remains undisclosed.
