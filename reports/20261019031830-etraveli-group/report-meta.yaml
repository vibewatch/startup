  topStrengths:
    - Large-scale, multi-brand flight-commerce platform with 75+ markets and 48 million+ annual travellers.
    - Clear operating proof from 2024 EBITDA above EUR 163 million.
    - Strategic validation from the extended Booking.com partnership and the completed KKR minority investment.
    - Travel-fintech repositioning suggests a route to higher-value monetization.
  topRisks:
    - Current valuation, leverage, and investor-rights terms remain undisclosed.
    - >-
      Partner concentration and commercial dependence on a small set of large distribution relationships are still
      opaque.
    - Customer-service friction at Gotogate and the prior Booking regulatory block signal execution and exit-path risk.
    - Governance detail, including the full board and founder roster, remains incomplete in public evidence.
  unresolvedGaps:
    - >-
      Current private valuation, instrument terms, and cap-table / preference overhang after the KKR transaction are not
      publicly disclosed.
    - >-
      Debt load, cash balance, leverage, covenant package, and liquidity sufficiency remain unverified in public
      sources.
    - >-
      Revenue mix, take rate, and partner concentration economics across Booking.com, owned brands, and B2B modules
      remain opaque.
    - Verified current board composition and a full founder roster remain unresolved.
