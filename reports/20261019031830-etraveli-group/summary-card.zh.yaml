    - 债务规模、现金余额、杠杆、契约安排和流动性是否充足，仍未获公开来源验证。
    - Booking.com、自有品牌和 B2B 模块的收入结构、抽成率以及合作伙伴集中度对应的经济性仍不透明。
    - 当前董事会构成的验证结果和完整创始人名单仍未解决。
