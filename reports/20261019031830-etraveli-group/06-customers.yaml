company:
  name: Etraveli Group
chapter:
  number: 6
  title: Customers
  summary: >-
    Etraveli's public customer proof is broad and increasingly B2B-heavy: company-issued 2025-2026 materials say it serves more than 48 million travellers across 75 markets, handled 25 million travel orders worth nearly EUR14 billion in 2024, and now gets its fastest growth from B2B partnerships. Named proof exists for Booking.com and for travel-fintech/distribution clients such as Outpayce by Amadeus, Mastercard Gateway, Sabre, and Checkout.com, but public evidence still lacks renewal, churn, and customer-concentration disclosure while Gotogate's 3.1/5 Trustpilot snapshot shows real consumer-service durability risk.
sections:
  - id: hybrid-customer-base
    title: Hybrid customer base spans consumer brands and embedded B2B distribution
    body: >-
      The retained evidence points to a two-sided customer base rather than a pure OTA story. Etraveli still sells directly to travellers through owned consumer brands, but the stronger recent public proof is on the partner-facing side: official 2025-2026 materials repeatedly position Booking.com, Google Flights, Skyscanner, and Kayak as scaled distribution partners, while also describing TripStack and Precision as B2B products sold into airlines, OTAs, and travel-infrastructure providers. Historical independent coverage matters here because it shows the customer footprint widened over time, from more than 50 markets in 2019 with a strong Nordic and Western European base to a materially broader global platform by late 2025-2026.
    claimRefs: [CU001, CU002, CU003, CU007, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Public adoption proof is strongest on volume and named partner breadth
    body: >-
      Public traction evidence is directionally strong even if the company does not disclose classic SaaS-style retention KPIs. The clearest recent metric is company-issued: Etraveli says it handled 25 million travel orders worth nearly EUR14 billion in gross sales in 2024, then updated its annual traveller figure from over 40 million in October 2025 to more than 48 million in December 2025 and October 2026. On the named-customer side, Booking.com is the highest-quality proof because the relationship is visible from both sides and the partner release states the flight offer is now live in 57 countries. Precision broadens the proof set further by naming external B2B clients in payments and travel infrastructure, but the available public evidence still lacks customer-level outcome KPIs.
    claimRefs: [CU004, CU005, CU006, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability remains under-disclosed and consumer support risk is visible
    body: >-
      The biggest weakness in the public customer story is not lack of logos; it is lack of disclosed durability and concentration metrics. None of the retained sources quantify NRR, GRR, churn, renewal rates, contract length, or revenue exposure to any single platform partner, so the current customer base cannot be stress-tested from public material alone. At the same time, the owned-brand service layer shows visible friction: the archived Trustpilot snapshot for Gotogate shows a middling 3.1/5 rating across high review volume, and the quoted complaints cluster around cancellations, refunds, and support responsiveness. That does not prove systemic churn, but it is enough to treat consumer-service quality and partner concentration as diligence priorities rather than resolved strengths.
    claimRefs: [CU013, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Owned OTA brands (Gotogate / Mytrip / Flightnetwork / Supersaver)
        - Buyer=user=payer is the end traveller
        - Direct online flight booking, fulfilment, ancillaries, and post-booking service
        - Official sources still present these brands as active operating channels in 2025-2026
        - Preserves direct demand capture and first-party traveller data alongside B2B expansion
        - Public sources do not disclose repeat-purchase rate, cohort retention, or brand-level profitability
      - - Metasearch and discovery platforms (Google Flights / Skyscanner / Kayak)
        - Buyer/platform partner; user=end traveller; payer=partner under commercial agreement
        - Traffic acquisition, content distribution, and booking/fulfilment routing
        - Named repeatedly in 2025-2026 official partner lists
        - Demonstrates distribution embedded in high-intent travel search flows
        - No partner-by-partner order volume, take rate, or renewal terms disclosed
      - - Booking.com strategic partnership
        - Buyer=global OTA/platform; user=Booking.com flight shopper; payer=partner
        - Flights infrastructure supporting Booking.com's global air offering
        - Public proof spans 2019 launch, 2021 27-country footprint, and 2025 57-country footprint
        - Highest-quality named customer because both Etraveli and Booking describe the relationship
        - Revenue concentration and economic dependency on Booking.com are not public
      - - B2B travel clients for TripStack and Precision
        - Buyer=airlines, OTAs, travel platforms, payment providers; user=commerce/risk teams; payer=enterprise client
        - Flight content access, virtual interlining, fraud prevention, and travel-flexibility tooling
        - Official sources name external clients including Outpayce by Amadeus, Mastercard Gateway, Sabre, and Checkout.com
        - Shows land-and-expand beyond consumer OTA into travel infrastructure workflows
        - Production depth, contract size, and renewal history are not disclosed
    notes: Public segmentation is assembled from company-issued partner lists plus independent background coverage; null-style durability metrics are absent rather than zero.
    claimRefs: [CU001, CU002, CU007, CU008, CU011, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Geographic operating footprint
        - More than 50 markets, strongest in Nordics, UK, France, and Germany
        - "2019-06-20"
        - PhocusWire on TripStack / Flight Network acquisition
        - Medium
        - Shows international consumer and partner reach before the later B2B push accelerated
        - No order, traveller, or revenue split by market
      - - Booking.com flights footprint
        - Live in 27 countries
        - "2021-11-23"
        - PhocusWire on Booking acquisition
        - Medium
        - Establishes real production deployment inside a major OTA before the blocked sale and later extension
        - No country-level booking volume or economics disclosed
      - - Company-wide order volume
        - 25 million travel orders worth nearly EUR14 billion in gross sales
        - "2024-12-31"
        - Etraveli anniversary press release
        - Medium
        - Strongest public adoption metric for current scale
        - No breakdown between owned brands, Booking.com, and other B2B channels
      - - Annual traveller metric
        - Over 40 million travellers each year across 75+ markets
        - "2025-10-14"
        - Etraveli anniversary press release
        - Medium
        - Confirms broad installed demand before the KKR-close update
        - Travellers are not reconciled publicly to travel orders or unique customers
      - - Updated annual traveller metric
        - More than 48 million travellers annually across 75 markets
        - "2025-12-18 / 2026-10-06"
        - Etraveli / Precision official releases
        - High
        - Indicates continued scale growth and sustained partner reach
        - No public segmentation by channel, geography, or repeat behaviour
      - - Booking.com partnership freshness
        - Eight-year extension; flights offering live in 57 countries
        - 2025
        - Booking Holdings press release
        - Medium
        - Best external proof that the largest named platform relationship remains active and expanding
        - No disclosed booking share, exclusivity terms, or renewal economics
    notes: Dates and values are preserved as published; the table mixes company-wide traveller/order metrics with partner-deployment milestones, so rows are directional rather than cohort-comparable.
    claimRefs: [CU003, CU004, CU005, CU006, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Booking.com
        - Global OTA / strategic partner
        - Flight booking infrastructure and fulfilment relationship
        - Production
        - Partnership first established in 2019 and extended for eight years in 2025; Booking says the flights offer is live in 57 countries
        - No disclosed revenue contribution, margin profile, or exclusivity terms
      - - Outpayce by Amadeus
        - Travel payments / fintech client
        - Precision fraud-prevention and travel-fintech relationship
        - Production implied by "trusted by" language
        - Official 2026 Precision release names Outpayce among external clients
        - No implementation depth, timeline, or customer KPI disclosed
      - - Mastercard Gateway
        - Payment infrastructure client
        - Precision fraud and approval tooling
        - Production implied by "trusted by" language
        - Official 2026 Precision release names Mastercard Gateway among external clients
        - No case-study economics or renewal evidence disclosed
      - - Sabre / Checkout.com
        - Travel technology and payments clients
        - Precision integrations / external B2B client proof
        - Production implied by "trusted by" language
        - Official 2026 Precision release names both as external clients
        - Public proof is logo-level naming rather than a scoped deployment case study
    notes: This is a representative named-proof sample rather than an exhaustive customer census; public sources name customers and partners more readily than they disclose production KPIs or renewals.
    enumerationScope:
      coverage: sample
      basis: Representative public sample built from the retained named-partner releases in this pool, not from a complete customer roster or contract registry.
    claimRefs: [CU008, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Etraveli's customer journey now mixes consumer OTA conversion with embedded B2B platform, airline, and fintech distribution loops.
    data:
      nodes:
        - label: Metasearch discovery partners
          actor: Google Flights / Skyscanner / Kayak
          stage: Discovery
          channel: Search and metasearch distribution
          touchpoints:
            - Official partner lists repeatedly include the major flight-discovery platforms.
            - Traffic discovery sits upstream of Etraveli-owned booking and fulfilment surfaces.
        - label: Booking.com flight checkout
          actor: Booking.com
          stage: Partner checkout
          channel: Strategic OTA partnership
          touchpoints:
            - Collaboration was first established in 2019.
            - Public deployment markers move from 27 countries in 2021 to 57 countries in 2025.
        - label: Owned OTA conversion
          actor: Gotogate / Mytrip / Flightnetwork / Supersaver
          stage: Direct consumer sale
          channel: Owned brands
          touchpoints:
            - Consumer OTA brands remain active even as B2B becomes the faster growth vector.
            - Consumer-service quality can affect durability because post-booking support sits on these brands.
        - label: TripStack distribution layer
          actor: OTAs / airlines
          stage: B2B content access
          channel: TripStack / virtual interlining
          touchpoints:
            - The 2019 TripStack acquisition was framed as a way to expand airline integration capabilities.
            - Airline-partnership scale broadens the addressable partner base for flight content distribution.
        - label: Precision fintech expansion
          actor: Airlines / OTAs / payment providers
          stage: Attach and monetise
          channel: Fraud prevention and travel flexibility
          touchpoints:
            - Precision is now positioned as a dedicated fintech arm serving external B2B clients.
            - Named external clients include Outpayce by Amadeus, Mastercard Gateway, Sabre, and Checkout.com.
        - label: Post-booking support loop
          actor: Travellers after purchase
          stage: Durability test
          channel: Refunds, changes, and customer support
          touchpoints:
            - Archived Trustpilot evidence shows substantial review volume at a 3.1 / 5 score.
            - Negative reviews cluster around cancellations, refunds, and support responsiveness.
    approximationNotes: null
    claimRefs: [CU002, CU008, CU009, CU010, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: strength
    title: B2B partner proof is the strongest part of the customer story
    body: Booking.com is validated from both sides of the relationship, and Precision now names external fintech/travel clients instead of relying only on internal-brand usage.
    claimRefs: [CU008, CU010, CU011]
  - calloutType: risk
    title: Breadth is visible, durability is not
    body: Public sources show large-scale distribution and traveller volume, but they do not disclose renewal, churn, or customer concentration metrics, while Gotogate reviews flag service friction that could affect repeat demand.
    claimRefs: [CU013, CU014, CU015, CU016]
