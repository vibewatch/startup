    title: "Scaled, hybrid, and sponsor-shaped"
    body: >-
      The assigned evidence supports a large, multi-brand flight-commerce
      platform whose current identity is already a blend of owned OTAs,
      partner-facing infrastructure, and fintech.
    claimRefs: [CO003, CO005, CO011, CO012]
