company:
  name: Etraveli Group
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Etraveli Group presents as a scaled, sponsor-backed flight-commerce platform
    anchored in Stockholm, combining owned OTAs with partner-facing booking,
    fulfilment, and fintech infrastructure. The assigned evidence supports broad
    operating scale, a long-standing Booking.com relationship, and the completed
    KKR minority investment, but it still leaves current private valuation,
    total raised, debt, and full governance detail unresolved.
sections:
  - id: identity-and-platform
    title: Identity and platform shape
    body: >-
      Etraveli Group's current self-description is no longer just a consumer
      OTA. Across its homepage, platform page, and recent company releases, it
      presents as a Stockholm-headquartered flight-technology platform that
      combines owned consumer brands with partner-facing distribution,
      fulfilment, and fintech modules. The strongest recurring scale markers are
      breadth rather than audited revenue: 75+ markets, more than 48 million
      annual travellers, and a brand portfolio spanning Tripstack, Precision,
      Wenrix, Mytrip, Flightnetwork, Gotogate, and Flygresor.se. That mix
      matters for later chapters because the business already straddles B2B
      infrastructure and consumer demand aggregation rather than a single narrow
      OTA archetype.
    claimRefs: [CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
  - id: ownership-leadership-and-stakeholders
    title: Ownership, leadership, and stakeholder map
    body: >-
      Control today is sponsor-led. The retained evidence shows a long
      ownership sequence culminating in CVC's 2017 control and KKR's completed
      significant minority investment in December 2025, while the separate
      Booking path moved from a 2019 commercial partnership to a 2021 announced
      acquisition agreement and then a 2023 EU block. Mathias Hedlund is the only
      consistently evidenced group-level chief executive in the assigned pool,
      while the 2026 Precision release adds Peny Rizou for the fintech arm.
      That is enough to name the current sponsor set and visible operating
      spokespeople, but not enough to reconstruct the full board or founder
      roster from public evidence alone.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO015]
    tableRefs: [TO002, TO003]
  - id: scale-metrics-and-milestones
    title: Scale markers and milestone trajectory
    body: >-
      Public scale disclosure is directionally strong but not clean enough to
      treat as a single audited KPI set. The December 2025 completion release
      cites more than 48 million travellers annually and frames Etraveli as a
      world-scale flight intermediary, while the homepage and 2026 Precision
      release move current people-and-office markers to 3,200+ employees and 11
      offices. The 2025 anniversary release adds 2024 operating markers of 25
      million travel orders and nearly EUR 14 billion of gross sales, alongside
      EBITDA above EUR 163 million. Those company-issued figures support genuine scale and
      profitability signals, but they do not disclose revenue, take rate,
      leverage, or current valuation.
    claimRefs: [CO006, CO007, CO012, CO013, CO014]
    figureRefs: [FO001]
  - id: downside-signals-and-open-asks
    title: Downside signals and open diligence asks
    body: >-
      The main downside signals in this pool are executional and
      transparency-driven rather than an acute new solvency or sanctions event.
      Trustpilot's Gotogate page aggregates a 3.1/5 rating with recurring
      complaints around cancellations, refunds, support responsiveness, and
      pricing friction, while the 2023 EC block remains a reminder that large
      strategic outcomes can face regulatory limits. For diligence, the
      unresolved items are not whether Etraveli exists at scale, but how value
      accrues: current private valuation, total raised, debt and covenant load,
      partner concentration economics, and the governance detail beneath a
      sponsor-backed cap table.
    claimRefs: [CO010, CO016]
