      - ["Owned OTA customers", "B2C demand and service-reputation base", "Gotogate review evidence shows meaningful scale but also ongoing cancellation, refund, and support friction.", "Review complaint resolution metrics, repeat behavior, CAC, and unit economics by brand."]
    notes: >-
