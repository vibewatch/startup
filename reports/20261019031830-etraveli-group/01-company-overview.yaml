  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: Current private valuation, KKR entry price, and any preference or instrument terms.
      whyItMatters: Entry valuation and security terms drive downside protection and return math.
      diligencePath: Request the KKR transaction deck, board materials, and current cap-table summary.
      relatedQuestionRefs: [QO008]
    - type: private-evidence-only
      severity: material
      topic: leverage
      missingEvidence: Debt load, cash balance, covenant package, and near-term liquidity profile.
      whyItMatters: Sponsor-backed ownership without leverage visibility makes solvency and exit risk hard to underwrite.
      diligencePath: Request lender presentation materials, debt schedules, and latest monthly cash reporting.
      relatedQuestionRefs: [QO008]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Full board composition, committee structure, and complete founder roster.
      whyItMatters: Governance quality and founder continuity affect control, succession, and decision velocity.
      diligencePath: Obtain the current board pack, governance chart, and founder / executive bios.
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Revenue mix, take rate, and partner concentration across Booking.com, owned OTAs, and other channels.
      whyItMatters: A scaled platform can still be economically fragile if GMV or margin is concentrated in a small set of partners.
      diligencePath: Request channel-level GMV, gross profit, renewal terms, and cohort retention by partner.
