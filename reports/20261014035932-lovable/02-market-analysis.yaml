callouts:
  - calloutType: insight
    title: Bottleneck Inversion in Software Creation
    body: >-
      As conversational generation commoditizes initial prototype synthesis, the primary commercial bottleneck moves
      from raw code construction to architectural review, security scanning, and domain-specific workflow validation.
    claimRefs:
      - CM001
      - CM003
  - calloutType: risk
    title: Enterprise Deployment Friction from Dual Licensing Requirements
    body: >-
      While Microsoft Copilot Managed Runtime provides identity governance for Lovable apps in corporate tenants,
      end-user consumption mandates separate Power Apps Premium seats or metered Copilot Credits, preventing
      zero-friction organizational rollouts.
    claimRefs:
      - CM011
      - CM012
