  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Position
      - Core Argument
      - Supporting Evidence
      - What Would Change View
    rows:
      - - Thesis (Bull)
        - Category-defining vibe-coding platform with unprecedented $500M ARR growth and enterprise expansion
        - Adoption across nearly two-thirds of Fortune 500, Menlo/EQT $400M Series C lead
        - Slowing net expansion or commoditization of generative frontend by frontier lab agents
      - - Anti-Thesis (Bear)
        - High model inference costs compress gross margins while platform faces low switching costs
        - Reported 35% mid-2025 gross margins, bug loops, and credit-budget friction
        - Demonstrated margin expansion toward 65% via proprietary model routing and durable enterprise retention
      - - Thesis (Execution)
        - Shift from prototyping toy to full business operating layer with backend, payments, and Microsoft runtime
        - Microsoft Entra / Copilot Managed Runtime integration, SOC 2 / AIUC-1 certifications
        - Failure to convert casual vibe-coders into high-ACV multi-year enterprise contracts
