  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Lovable operates as a full-stack generative development platform enabling technical and non-technical
              builders to convert natural-language specifications into functional, deployed web applications without
              manual boilerplate configuration. Users initiate projects inside shared workspaces by describing interface
              layouts, data structures, and business logic within a conversational chat environment. The platform
              structures execution through Plan Mode before generating editable React frontend components styled with
              Tailwind CSS, bundled via Vite, and wired to Supabase or Lovable Cloud backends. Code is not locked within
              proprietary runtimes; two-way Git synchronization connects generated applications directly to repositories
              on GitHub, GitLab, or Bitbucket. This enables cross-functional teams to prototype rapidly and hand off
              repositories to traditional IDEs like Cursor and VS Code once edge-case complexity exceeds prompt-driven
              refactoring limits.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
