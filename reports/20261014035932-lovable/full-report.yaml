  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - ARR scales to $1.2B by 2027; gross margins expand to 65%; enterprise contracts drive 70% ARR
        - $24.0B exit valuation at 20x ARR multiple via NASDAQ IPO; 1.8x MOIC from Series C
        - Frontier model providers launch commoditizing native UI builders
        - 25% (requires sustained 100%+ enterprise expansion)
      - - Base Case
        - ARR reaches $750M; gross margins stabilize at 50%; consumer/prosumer churn remains elevated
        - $11.2B valuation at 15x ARR multiple; flat-to-down secondary marks; 0.8x MOIC
        - Multiple compression as AI funding cycle normalizes and enterprise budgets tighten
        - 50% (most consistent with current private comps and margin profile)
      - - Bear Case
        - Growth flattens at $550M ARR; model inference costs keep gross margins at 35%; enterprise adoption stalls
        - $4.4B valuation at 8x ARR multiple in down-round recapitalization; -67% equity impairment
        - Severe credit burn backlash, bug loop dissatisfaction, or major enterprise security breach
        - 25% (heightened by lack of audited enterprise retention data)
    notes: >-
      Valuation scenarios modeled on projected ARR multiples and reported 35% to 65% gross margin ranges; exit values
      represent enterprise value estimates.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV014
figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: Chronological development milestones tracing Lovable's evolution from open-source project to European AI decacorn.
    data:
      items:
        - date: 2023-06
          label: Open-Source Launch of GPT Engineer
          detail: Anton Osika releases GPT Engineer CLI repository on GitHub, rapidly amassing over 50,000 community stars.
          tone: positive
        - date: 2023-11
          label: Corporate Founding in Stockholm
          detail: >-
            Lovable incorporated in Stockholm, Sweden by Anton Osika and Fabian Hedin to build conversational software
            creation.
          tone: neutral
        - date: 2024-10
          label: €6.8M Pre-Seed Financing
          detail: >-
            Secured early backing led by Hummingbird Ventures and byFounders to transition from CLI to hosted cloud
            platform.
          tone: positive
        - date: 2024-11
          label: Commercial Beta Launch as Lovable
          detail: 'Relaunched hosted browser-based app builder, achieving #1 ranking on Product Hunt and Hacker News.'
          tone: positive
        - date: 2025-02
          label: $15M Pre-Series A & $17M ARR
          detail: Raised $15M led by Creandum within three months of commercial launch; disclosed $17M in annualized revenue.
          tone: positive
        - date: 2025-07
          label: $200M Series A at $1.8B Valuation
          detail: Accel leads Series A minting Lovable as Sweden's fastest unicorn; launched autonomous Lovable Agent mode.
          tone: positive
        - date: 2025-12
