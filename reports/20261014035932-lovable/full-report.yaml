chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Product Vision
        blocks:
          - type: paragraph
            body: >-
              Lovable is a Swedish technology company headquartered in Stockholm that develops an artificial
              intelligence application generation platform. The company was founded in late 2023 with a mission to
              bridge the gap between plain-language concept descriptions and deployed, production-ready software
              systems. Rather than outputting isolated code snippets or mockups, Lovable generates complete full-stack
              web applications comprising a React and Tailwind CSS frontend coupled with a Supabase backend covering
              authentication, PostgreSQL database schemas, and storage infrastructure. The platform provides a dual
              operating workflow: collaborative planning and conversational prompting through Chat Mode, and autonomous
              cross-file multi-step code execution and debugging through Agent Mode. A critical architecture
              differentiator is native two-way GitHub synchronization, which allows developers to export the underlying
              codebase and continue development in standard IDEs without vendor lock-in. Deployed web applications
              include out-of-the-box hosting, SSL certificates, and Stripe payment processing configurations.
            claimRefs:
              - CO001
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Lovable was co-founded by Anton Osika and Fabian Hedin, who lead the company as Chief Executive Officer
              and Chief Technology Officer respectively. Anton Osika brings a background as a former CERN physicist and
              Y Combinator founder, having originally authored the open-source GPT Engineer project that preceded the
              commercial company. Fabian Hedin directs distributed infrastructure and technical systems, focusing on
              low-latency runtime scalability and multi-agent model coordination. The organization operates under a
              high-impact individual contributor model characterized by flat reporting structures, department leads, and
              autonomous execution squads rather than layered middle management. To accelerate technical depth and
              product capabilities, Lovable has actively pursued acqui-hire transactions and senior technical
              recruitments, including the September 2026 acquisition of Swedish software startup Sutro, bringing founder
              Tomas Halgas and engineering staff into the core team to focus on explainability and verification engines.
            claimRefs:
              - CO001
              - CO004
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO011
      - number: '1.3'
        title: Capitalization History, Valuation Progression, and Stakeholder Base
        blocks:
          - type: paragraph
            body: >-
              Lovable has executed one of the most rapid capital accumulation trajectories in global venture history,
              raising approximately $950M across five financing rounds in less than two years. Following an initial
              €6.8M Pre-Seed financing in October 2024 led by Hummingbird Ventures and byFounders and a $15M Pre-Series
              A in February 2025 led by Creandum, Lovable secured a $200M Series A in July 2025 led by Accel at a $1.8B
              valuation, becoming Sweden's fastest unicorn. By December 2025, CapitalG and Menlo Ventures co-led a $330M
              Series B round that priced the business at $6.6B post-money. Most recently, in August 2026, Menlo Ventures
              and the Scaleup Europe Fund (managed by EQT) co-led a $400M Series C round valuing Lovable at $13.3B
              post-money. Global institutional backers include Balderton Capital, Carmignac, Kaszek Ventures, Tencent,
              and World Innovation Lab, alongside returning investors such as DST Global, Salesforce Ventures, and
              HubSpot Ventures.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.4'
        title: Operating Milestones, Growth Velocity, and Diligence Caveats
        blocks:
          - type: paragraph
            body: >-
              The commercial growth velocity of Lovable is rooted in its origin as the open-source CLI project GPT
              Engineer, which accumulated over 50,000 GitHub stars before rebranding to a commercial browser platform in
              November 2024. Market intelligence estimates from Sacra indicate that annualized revenue expanded from
              $17M in February 2025 to $100M within eight months, reaching an estimated $600M run rate by September
              2026. In late 2026, the company deepened its enterprise positioning through a partnership with Microsoft,
              enabling customer applications to run directly inside corporate Microsoft tenants with Entra access
              controls. Despite hyper-scale metrics, external product evaluations identify material customer friction
              points. Reviews from AIToolGrade highlight that Lovable's credit-based billing model causes unpredictable
              cost spikes when complex tasks trigger repeated AI bug loops. Furthermore, key operational facts including
              audited headcount, GAAP revenue, customer cohort retention, and gross margin remain closely guarded
              private items.
            claimRefs:
              - CO002
              - CO010
              - CO011
              - CO012
              - CO013
