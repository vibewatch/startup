          tone: neutral
        - label: Pro Subscription
          detail: User upgrades to $25/mo Pro plan for 100 monthly credits, custom domains, and private repository visibility.
          tone: positive
        - label: Credit Scaling & Top-up
          detail: Complex iterations and debugging consume credits, triggering $15/50 credit top-ups or credit exhaustion.
          tone: warning
        - label: GitHub Code Handoff
          detail: Teams export React/Supabase codebase to GitHub or GitLab to bypass platform limits or conduct code audits.
          tone: neutral
        - label: Team & Enterprise Hub
          detail: Organizations adopt Business/Enterprise tiers for SSO, workspace pooling, SCIM, and compliance governance.
          tone: positive
