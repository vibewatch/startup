            body: >-
              Lovable 的漏斗获客速度位居软件行业前列。商业 beta 于 2024 年 11 月末发布后三个月内便积累 500,000 个注册账户，其中 30,000 个转为付费客户，年化收入运行率达到 $17
              million。开发者自发参与、vibe coding 叙事下的社交媒体病毒式演示，以及大学黑客松赞助，共同推动用户规模在 2025 年中大幅提速。到 2025 年 7 月，活跃用户增至 2.3
              million，付费用户超过 180,000，每日创建项目超过 100,000 个，ARR 升至 $75 million 至 $100 million。2026 年初，注册用户接近 8
