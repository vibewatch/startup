  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价层级与变现机制
        blocks:
          - type: paragraph
            body: >-
              Lovable 以工作区订阅加使用型 AI 额度变现，而不是按席位许可。免费层每天 5 credits（每月最多 30），另有每月 20 cloud credits；Pro 从每月 $25 起，包含每月 100
              credits，最高可到每月 $480、10,000 monthly credits。面向多用户组织的 Business 层每月 $50 至 $4,300，提供
              SSO、数据训练退出和集中治理，相同额度下相当于为企业管理和安全控制支付 2x 定价倍数；Enterprise 需定制年度合同。收入还来自 Lovable Cloud 托管、运行时数据库服务和嵌入式 AI
              消耗；自动渗透测试每次 $100。企业可通过 Google Cloud Marketplace 和 Microsoft Marketplace
              使用已承诺的云预算，但额度经济也会制造摩擦：提示复杂度会让成本不可预测，执行前不披露 action 成本，未用月度额度两个月后过期。
