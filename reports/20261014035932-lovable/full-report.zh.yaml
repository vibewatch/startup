    claimRefs:
      - CP001
      - CP004
      - CP007
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 从用户提示词活动到工作区订阅、基础设施运行时费用和已实现毛利的端到端经济转化链路。
    data:
      nodes:
        - id: user-prompt-activity
          label: 用户自然语言提示词活动
          description: 注册构建者描述应用规格、生成代码，并迭代 UI 组件
        - id: credit-consumption
          label: AI 生成额度消耗
          description: 任务根据提示词和推理复杂度消耗共享工作区额度
        - id: subscription-and-topups
          label: 订阅方案与额度充值
          description: 用户订阅 Pro / Business 方案（$25-$4,300/mo），或购买额度包以避免工作流中断
        - id: runtime-infrastructure
          label: Lovable Cloud 运行时与托管
          description: 通过持续计算、Supabase 数据库查询和存储，让线上生产应用实现变现
        - id: cogs-deductions
          label: 模型 API 与基础设施 COGS
          description: 模型推理 token（OpenAI、Gemini、Anthropic）和云计算将毛利率压缩至 36%-65%
        - id: realized-gross-profit
          label: 已实现的平台毛利
          description: 可用于支持工程、产品研发和企业 GTM 扩张的净剩余现金
      edges:
        - from: user-prompt-activity
          to: credit-consumption
          label: 推动额度消耗
        - from: credit-consumption
          to: subscription-and-topups
          label: 迫使用户升级层级或充值
        - from: subscription-and-topups
          to: runtime-infrastructure
          label: 部署至生产环境
        - from: runtime-infrastructure
          to: cogs-deductions
          label: 产生 token 与服务器成本
        - from: cogs-deductions
          to: realized-gross-profit
          label: 带来毛利率
    approximationNotes: 流程图综合官方指南、价格跟踪资料和 Sacra 单位经济研究所记录的商业变现机制。利润率区间代表报道的历史水平和目标水平。
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI006
      - CI008
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构栈，展示自然语言提示词接入、多模型代码合成和托管云运行时执行。
    approximationNotes: 概念性分层表示，基于经核实的技术文档、平台评测拆解和云合作公告。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
      - CE014
    data:
      layers:
        - label: 交互与上下文层
          detail: 对话式项目聊天界面、Plan Mode 结构化梳理和可视化点击式 DOM 检查。
          modules:
            - 项目聊天 UI
            - Plan Mode 引擎
            - 可视化元素检查器
        - label: 模型编排与 Agent 路由
          detail: 多模型推理路由器动态分发代码生成、错误分流和重构任务。
          modules:
            - OpenAI GPT-4o / 推理 API
            - Anthropic Claude 集成
            - Google Gemini 企业网关
        - label: 代码合成与验证引擎
          detail: 自动生成语法树、多文件代码编辑和静态漏洞扫描。
          modules:
            - TypeScript / React AST 构建器
            - Tailwind 样式编译器
            - 自动安全漏洞扫描器
        - label: 版本控制与工作区协作
          detail: 共享团队工作区权限、项目快照历史和 Git 提供商双向同步。
          modules:
            - GitHub / GitLab / Bitbucket 双向同步
            - 工作区共享额度账本
            - 项目版本快照
        - label: 数据、逻辑与集成层
          detail: 开箱即用的数据库模式、身份验证、文件存储和外部运营连接器。
          modules:
            - 托管 Supabase / Postgres 数据库
            - 原生身份验证与行级安全
            - MCP 连接器（Jira、Linear、Notion）
            - Stripe 计费与支付桥接
        - label: 边缘托管与治理运行时
          detail: 自动生产部署、SSL 终止、SOC 2 Type II 审计日志和租户隔离。
          modules:
            - Google Cloud / Lovable Cloud 基础设施
            - 自定义域名与 SSL 配置
            - 企业 SCIM 与 Microsoft Entra SSO
            - 自动渗透测试模块
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 追踪客户从最初的自然语言提示词原型，到付费额度扩展和企业工作区治理的采用路径。
    claimRefs:
      - CU001
      - CU005
      - CU011
      - CU013
    data:
      items:
        - label: 提示词脚手架
          detail: 个人用户或创始人输入自然语言提示词，生成全栈 UI、数据库和逻辑。
          tone: positive
        - label: 免费原型
          detail: 免费层每天提供 5 个额度，用户无需预付即可在 lovable.app 子域名上测试生成的应用。
          tone: neutral
        - label: Pro 订阅
          detail: 用户升级至 $25/mo Pro 方案，获得每月 100 个额度、自定义域名和私有代码库可见性。
          tone: positive
        - label: 额度扩展与充值
          detail: 复杂迭代和调试会消耗额度，触发 $15/50 额度充值或额度耗尽。
          tone: warning
        - label: GitHub 代码交接
          detail: 团队将 React/Supabase 代码库导出至 GitHub 或 GitLab，以绕过平台限制或开展代码审计。
          tone: neutral
        - label: 团队与企业中心
          detail: 组织采用 Business / Enterprise 层级，以获得 SSO、工作区额度池、SCIM 和合规治理。
          tone: positive
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按严重程度综合平台、模型、运营和商业风险，覆盖可能性与缓解成熟度。
    approximationNotes: 热力图坐标代表对第三方评测和官方披露的定性综合。
    data:
      columns:
        - 低影响
        - 中等影响
        - 关键影响
      rows:
        - label: Bug 循环与额度消耗
          note: 复杂逻辑中的迭代调试会迅速耗尽用户预付额度
          values:
            - label: 低暴露
              tone: neutral
            - label: 中等摩擦
              tone: warning
            - label: 严重流失风险
              tone: critical
        - label: 复杂逻辑上限
          note: 多步骤状态机和复杂工作流需要开发人员手动重构。
          values:
            - label: 可控
              tone: neutral
            - label: 20-40hr 开发缺口
              tone: warning
            - label: 生产阻塞
              tone: high
        - label: 定制 API 集成
          note: 非标准身份验证和 HMAC webhook 校验会导致 AI 代码生成失败。
          values:
            - label: 标准 CRUD
              tone: low
            - label: 手动编码模式
              tone: warning
            - label: 集成失败
              tone: high
        - label: 厂商架构锁定
          note: 默认技术栈将项目绑定到 Supabase、GitHub 和 Cloudflare 基础设施。
          values:
            - label: Git 导出解锁
              tone: positive
            - label: Supabase 耦合
              tone: warning
            - label: 平台宕机
              tone: high
        - label: 移动端部署上限
          note: 仅支持 Web 的响应式输出，无法直接提交到原生 App Store 生态。
          values:
            - label: PWA 可行
              tone: low
            - label: 转向 FlutterFlow
              tone: medium
            - label: 移动端范围缩水
              tone: high
        - label: 安全与治理审计
          note: 企业 SOC 2 合规已建立，但深度第三方测试报告仍未公开。
          values:
            - label: SOC 2 Type II
              tone: positive
            - label: 审计缺口
              tone: medium
            - label: 企业业务停滞
              tone: warning
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR011
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将收入增长速度、平台治理、利润率压力和非公开估值倍数串联起来，形成“继续研究”的决策路径。
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV008
      - CV011
      - CV013
    data:
      nodes:
        - label: 增长势能与规模扩张速度
        - label: 企业渗透与合规
        - label: Microsoft 运行时集成
        - label: 毛利率与模型成本压力
        - label: 复杂度上限与额度不透明
        - label: 估值倍数与条款歧义
        - label: 推荐：继续研究
