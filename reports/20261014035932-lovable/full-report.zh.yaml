      - number: '4.3'
        title: 成本结构、毛利率变化与资本依赖
        blocks:
          - type: paragraph
            body: >-
              Lovable 的成本高度暴露于基础模型推理和云基础设施交付。平台会在 OpenAI、Google Gemini 和 Anthropic 等多个专有模型供应商之间动态分配自然语言生成任务。Sacra
              的独立研究显示，Lovable 2025 年 5 月毛利率仅为 36%，初期高速增长阶段的模型 API 用量和云执行费用压缩了利润率。管理层给出的 2026 年下半年毛利率目标为
              65%，前提是获得多年期超大规模云厂商折扣、优化基础设施、提升模型效率，并提高 Lovable Cloud 的软件运行时贡献；但这一路径尚未得到经审计财务披露验证。资本方面，Lovable 2025 年 2 月由
              Creandum 领投 $15M Pre-Series A，此前 €6.8M Pre-Seed 轮仅动用 $2M；随后完成由 CapitalG 和 Menlo Ventures 领投、估值 $6.6B 的
              $330M Series B，以及 2026 年 8 月由 Menlo Ventures 和 EQT 的 Scaleup Europe Fund 领投、投后估值 $13.3B 的 $400M Series
              C。累计融资约 $952.5M。资金储备带来较强的资产负债表流动性，但未来资本充足性和现金消耗率仍不透明；社区评价还指出，复杂软件生成常陷入反复“bug 循环”，用户要消耗付费额度修复 AI
              引入的错误，暴露出纯代币套利模式的脆弱性。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
              - CI007
              - CI008
