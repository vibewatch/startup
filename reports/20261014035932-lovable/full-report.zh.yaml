        title: 公司定位、运营模式与产品愿景
        blocks:
          - type: paragraph
            body: >-
              Lovable 是总部位于 Stockholm 的瑞典 AI 应用生成平台，成立于 2023 年末；它把自然语言提示变成包含 React、Tailwind CSS、Supabase、认证、PostgreSQL
              和存储的全栈 Web 应用，并以 Chat Mode、Agent Mode 和双向 GitHub 同步支持协作、调试及无锁定开发。
            claimRefs:
              - CO001
              - CO003
