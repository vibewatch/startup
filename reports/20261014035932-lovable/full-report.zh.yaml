      - number: '4.2'
        title: 收入增长与留存证据
        blocks:
          - type: paragraph
            body: >-
              Lovable 的商业增长轨迹位居企业软件行业最快之列。公司在 2024 年末从开源 CLI 工具 GPT Engineer 重启为浏览器应用构建器后，收入运行率从 2024 年末的 $7M ARR 增至
              2025 年 2 月的 $17M ARR，并拥有 30,000 个付费客户。Lovable 披露 2025 年 7 月 ARR 超过 $100M、2025 年 11 月达到 $200M
              ARR；不到商业发布一年就达到这一规模，并拿下 Klarna、Uber 和 Zendesk 等企业客户。Sacra 的独立研究估计，年化收入在 2025 年末达到 $250M，2026 年 3 月达到
              $400M，2026 年 5 月达到 $500M，2026 年 9 月达到 $600M；SetterVC 也称 2026 年中收入运行率约为
              $500M。销售速度主要来自高速产品驱动增长：非技术创始人、产品经理和企业部门运营者先通过自助额度层采用平台，再扩大到工作区级使用。Sacra 报告称，Lovable 2025 年 11 月净美元留存超过
              100%，因为活跃构建者群体的用量扩张和额度充值超过了收缩与账户流失。到 2026 年初，外部跟踪机构报告注册用户约 8 million，形成庞大的漏斗入口。但
              CAC、销售周期、获客回本期，以及按企业合同群组拆分的净留存等正式销售效率指标，仍完全未公开。
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI013
          - type: table
            tableRef: TI003
