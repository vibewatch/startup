        - 近三分之二的《财富》500 强采用，Menlo/EQT 领投 $400M Series C
        - 净扩张放缓，或前沿实验室 Agent 使生成式前端商品化
      - - 反论点（看跌）
        - 模型推理成本高企压缩毛利率，而平台面临较低的转换成本
        - 报道的 2025 年年中 35% 毛利率、Bug 循环和额度预算摩擦
        - 通过专有模型路由和持久的企业留存，将毛利率提升至 65% 附近并得到证明
      - - 正论点（执行）
        - 从原型玩具转向完整业务运营层，覆盖后端、支付和 Microsoft 运行时
        - Microsoft Entra / Copilot Managed Runtime 集成、SOC 2 / AIUC-1 认证
        - 未能将随意的 Vibe coder 转化为高 ACV 多年期企业合同
    notes: 核心投资论点基于经核实的客户披露和独立产品评测。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 到 2027 年 ARR 增至 $1.2B；毛利率升至 65%；企业合同贡献 70% ARR
        - 通过 NASDAQ IPO，以 20 倍 ARR 倍数实现 $24.0B 退出估值；Series C 的 MOIC 为 1.8 倍
        - 前沿模型提供商推出使原生 UI 构建器商品化的产品
        - 25%（需要企业业务持续实现 100% 以上扩张）
      - - 基准情景
        - ARR 达到 $750M；毛利率稳定在 50%；消费者 / 专业消费者流失率维持高位
        - 以 15 倍 ARR 倍数计 $11.2B 估值；二级市场估值持平至下跌；MOIC 为 0.8 倍
        - AI 融资周期回归常态、企业预算收紧，导致倍数压缩
        - 50%（与当前私有市场可比公司和利润率画像最一致）
      - - 悲观情景
        - 增长在 $550M ARR 处趋平；模型推理成本将毛利率压在 35%；企业采用停滞
        - 在下轮重组融资中以 8 倍 ARR 倍数计 $4.4B 估值；股权减值 -67%
        - 额度快速消耗引发的强烈反弹、对 Bug 循环的不满，或重大企业安全漏洞
        - 25%（因缺少经审计的企业留存数据而上升）
    notes: 估值情景基于预测 ARR 倍数及报道的 35% 至 65% 毛利率区间建模；退出价值代表企业价值估算。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Lovable 从开源项目成长为欧洲 AI 十亿美元级公司的发展里程碑。
    data:
      items:
        - date: 2023-06
          label: GPT Engineer 开源发布
          detail: Anton Osika 在 GitHub 发布 GPT Engineer CLI 代码库，迅速获得超过 50,000 个社区 Star。
          tone: positive
        - date: 2023-11
          label: 在斯德哥尔摩成立公司
          detail: Anton Osika 与 Fabian Hedin 在瑞典斯德哥尔摩注册 Lovable，打造对话式软件创建产品。
          tone: neutral
        - date: 2024-10
          label: €6.8M 种子前融资
          detail: 获得 Hummingbird Ventures 和 byFounders 领投的早期资金，从 CLI 转向托管云平台。
          tone: positive
        - date: 2024-11
          label: 以 Lovable 名义商业 Beta 发布
          detail: 重新推出托管式浏览器应用构建器，在 Product Hunt 和 Hacker News 排名第一。
          tone: positive
        - date: 2025-02
          label: $15M A 轮前融资与 $17M ARR
          detail: 商业发布后三个月内完成 Creandum 领投的 $15M 融资；披露年化收入为 $17M。
          tone: positive
        - date: 2025-07
          label: $200M Series A，估值 $1.8B
          detail: Accel 领投 Series A，使 Lovable 成为瑞典成长最快的独角兽；推出自主 Lovable Agent 模式。
          tone: positive
        - date: 2025-12
          label: $330M Series B，估值 $6.6B
          detail: CapitalG 和 Menlo Ventures 领投 Series B；随着年收入运行率接近 $250M，估值跃升至 $6.6B。
          tone: positive
        - date: 2026-08
          label: $400M Series C，估值 $13.3B
          detail: Menlo Ventures 和 Scaleup Europe Fund 共同领投 Series C；收入运行率预计约为 $600M。
          tone: positive
    approximationNotes: 里程碑时间线综合经核实的公司公告、Sacra 市场报告和 Dealroom 交易日志。
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO006
      - CO007
      - CO008
      - CO011
      - CO012
  - id: FM001
    title: 受限市场规模金字塔：从全球开发者支出到 Vibe coding SOM
    type: pyramid
    summary: 多层市场规模金字塔，将全球软件工程劳动力支出逐层收窄至 Lovable 可触达的商业滩头。
    data:
      items:
        - label: 全球软件工程劳动力与工具支出（$500B+ TAM）
          detail: 覆盖 30M+ 开发者和工程组织的软件创建全球市场总额。
          value: 500000
          unit: USD M
        - label: 企业低代码与开发者生产力工具（$100B+ SAM）
          detail: 面向加速业务和技术团队软件交付的平台可触达市场。
          value: 100000
          unit: USD M
        - label: 云应用托管与 PaaS 基础设施（$40B+ TAM 扩展）
          detail: 通过 Lovable Cloud 计算额度变现的托管、托管数据库和后端服务。
          value: 40000
          unit: USD M
        - label: 垂直行业与行业专用软件生成（$15B+ 机会）
          detail: 医疗和金融服务等专业领域的定制工作流应用。
          value: 15000
          unit: USD M
        - label: 专业消费者与初创公司绿地 MVP 生成（$2.5B 滩头 SOM）
          detail: 早期创始人和机构构建绿地原型所产生的即时可触达支出。
          value: 2500
          unit: USD M
        - label: Lovable 已记录的年化收入运行率（$600M 已实现 SOM）
          detail: 截至 2026 年 9 月，Lovable 实现的订阅和额度年化运行率。
          value: 600
          unit: USD M
    approximationNotes: 各层数值结合 Sacra 研究的自上而下行业规模与自下而上的运行率估算；数值代表全球市场年化支出。
    claimRefs:
      - CM004
      - CM005
      - CM007
  - id: FP001
    title: 竞争定位图：用户技术深度与开发速度
    type: quadrant
