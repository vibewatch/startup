            body: >-
              Lovable 不到两年完成五轮融资，累计约 $950M。融资历程包括 2024 年 10 月由 Hummingbird Ventures 和 byFounders 领投的 €6.8M Pre-Seed、2025
              年 2 月由 Creandum 领投的 $15M Pre-Series A、2025 年 7 月由 Accel 领投且估值 $1.8B 的 $200M Series A、2025 年 12 月由 CapitalG
