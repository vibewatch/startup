        blocks:
          - type: paragraph
            body: >-
              Anton Osika 与 Fabian Hedin 共同创办 Lovable，分别担任 CEO 和 CTO；前者曾是 CERN 物理学家并创建 GPT
              Engineer，后者负责分布式基础设施和多智能体协同。公司采用扁平的个人贡献者模式，并于 2026 年 9 月收购 Sutro。
