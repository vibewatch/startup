callouts:
  - calloutType: "strength"
    title: "Zero-Lock-In Development Through Native Git Synchronization"
    body: "Unlike legacy no-code platforms that compile logic into closed proprietary runtimes, Lovable writes standard React, Tailwind CSS, and Vite code directly into connected GitHub repositories. This provides engineering organizations with complete code ownership, enabling seamless transition into production IDE workflows when application scale demands manual optimization."
    claimRefs:
      - "CE003"
      - "CE004"
  - calloutType: "risk"
    title: "Opaque Credit Consumption During Iterative Bug Loops"
    body: "A prominent developer community friction point is the lack of upfront cost estimation for generative actions. When debugging complex state machines or backend schemas, the model occasionally enters repetitive loops where it claims resolution while failing builds, depleting user credit balances without advancing project completion."
    claimRefs:
      - "CE010"
      - "CE011"
