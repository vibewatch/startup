evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount-and-financial-margins
    missingEvidence: >-
      Audited statutory accounts or verified payroll disclosures detailing Lovable's exact employee count, GAAP gross
      margin, and operating cash burn for late 2026.
    whyItMatters: >-
      Public headcount estimates range widely from ~45 to over 200 employees, preventing reliable calculation of revenue
      per employee or unit gross margin durability.
    diligencePath: >-
      Request audited Swedish Bolagsverket statutory filings (annual accounts) and management reporting during
      confirmatory financial diligence.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: Stakeholder or investor map
    missingEvidence: >-
      Fully diluted capitalization table showing share classes, liquidation preferences, voting rights, and exact
      ownership percentages across seed and growth rounds.
    whyItMatters: >-
      At a $13.3B valuation, liquidation seniority and participation rights significantly affect common equity and
      secondary transaction returns.
    diligencePath: >-
      Inspect cap table ledgers and investor rights agreements under standard non-disclosure agreement during
      confirmatory diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: retention-and-cohort-durability
    missingEvidence: >-
      Audited cohort net retention rates, customer lifetime value, and post-build active project renewal data broken
      down by prosumer versus enterprise tiers.
    whyItMatters: >-
      Without verifiable cohort retention metrics, diligence cannot determine whether rapid top-line project expansion
      translates into recurring subscription durability or suffers from prototype churn once initial builds are
      completed.
    diligencePath: >-
      Request audited cohort retention curves, gross churn figures, and paid-to-free conversion velocity from management
      during investment diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: competitor-retention-and-churn
    missingEvidence: >-
      Audited cohort retention, net revenue retention (NRR), and annual contract renewal data for enterprise Lovable
      deployments compared to developer IDEs.
    whyItMatters: >-
      High top-of-funnel adoption in prompt-based AI builders may mask elevated churn if users experience credit burn or
      hit complexity ceilings on production applications.
    diligencePath: >-
      Request anonymized cohort retention matrices and multi-year contract renewal statistics broken out by technical
      vs. non-technical user cohorts.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited customer acquisition cost (CAC), sales cycle durations, and cohort-specific net revenue retention
      schedules broken down by self-serve versus enterprise sales channels.
    whyItMatters: >-
      Without verified CAC payback timelines and cohort retention data, investors cannot determine whether rapid
      top-line ARR expansion represents durable high-LTV software utility or capital-intensive top-of-funnel customer
      churn.
    diligencePath: >-
      Request management financial pack detailing monthly cohort retention tables, customer lifetime value calculations,
      and sales marketing expenditure attribution.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: >-
      Audited cost of goods sold (COGS) schedule delineating foundational model API token expenses across OpenAI,
      Anthropic, and Google versus cloud hosting and runtime infrastructure costs.
    whyItMatters: >-
      Given the reported 36% gross margin in May 2025, validating management's ability to reach 65% gross margin depends
      directly on understanding token consumption unit economics and cloud vendor discount commitments.
    diligencePath: >-
      Obtain management accounts showing gross margin progression by quarter throughout 2025 and 2026, alongside cloud
      and LLM provider pricing agreements.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: self-hosted-runtime-limits
    missingEvidence: >-
      Private architectural documentation and enterprise SLA benchmarks detailing on-premises, VPC-peered, or
      self-hosted deployment runtimes for air-gapped environments.
    whyItMatters: >-
      Enterprise compliance mandates in regulated verticals frequently prohibit hosted third-party multi-tenant runtime
      execution, capping Lovable's addressable market among Tier-1 enterprise buyers.
    diligencePath: >-
      Request private Enterprise architecture whitepapers, VPC peering deployment guides, and data residency guarantees
      under non-disclosure agreements.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: long-term-code-maintainability
    missingEvidence: >-
      Longitudinal code maintainability studies evaluating technical debt and cyclomatic complexity of LLM-generated
      code bases after 6+ months of production iteration.
    whyItMatters: >-
      Rapid prompt-driven prototyping can introduce redundant dependencies or architectural fragmentation if generated
      code bases diverge from enterprise design system standards.
    diligencePath: >-
      Conduct independent static code analysis (SonarQube/ESLint complexity audits) across representative enterprise
      repositories generated by Lovable.
    relatedQuestionRefs:
      - QE003
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), cohort renewal rates, and customer lifetime
      value (LTV) across subscriber tiers.
    whyItMatters: >-
      Without cohort retention disclosures, investors cannot verify whether rapid subscriber acquisition translates into
      durable recurring cash flows or masks high churn following initial prototype builds.
    diligencePath: >-
      Request cohort-level retention curves, net expansion metrics by customer vintage, and gross churn data in
      confidential management diligence.
    relatedQuestionRefs:
      - QU008
