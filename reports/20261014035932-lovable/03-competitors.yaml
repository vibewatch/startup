callouts:
  - calloutType: risk
    title: Credit Opacity and Bug-Loop Churn Risk
    body: >-
      Lovable's credit-based pricing model does not disclose task credit deductions prior to execution, creating
      friction and budget unpredictability when users experience bug-repair loops on complex application architectures.
    claimRefs:
      - CP011
      - CP012
  - calloutType: insight
    title: Two-Way Git Sync as a Competitive Wedge Against Platform Lock-in
    body: >-
      By supporting bi-directional Git synchronization with GitHub, GitLab, and Bitbucket, Lovable mitigates
      non-technical vendor lock-in concerns and creates a viable off-ramp for engineering teams to transition generated
      codebases into professional IDE workflows such as Cursor or VS Code.
    claimRefs:
      - CP007
      - CP010
