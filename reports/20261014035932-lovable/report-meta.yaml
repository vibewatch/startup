  topStrengths:
    - Category-leading prompt-to-production product with fast MVP creation and Git export.
    - Demonstrated hypergrowth in users, paying subscribers, and revenue run rate.
    - Strong enterprise proof points and broad funding support from top-tier investors.
  topRisks:
    - Gross margin, burn, and unit economics remain partially opaque.
    - Retention and enterprise expansion durability are not publicly verified at scale.
    - High valuation leaves little room for execution slippage or margin disappointment.
  unresolvedGaps:
    - >-
      No public disclosure of gross margin, burn, runway, CAC, payback, or net revenue retention to test whether growth
      is efficient and durable.
    - >-
      No public cap-table detail on preference stack, liquidation waterfall, or other rights that matter at a $13.3B
      private valuation.
    - >-
      No authoritative current headcount figure; public estimates range widely enough to break revenue-per-employee
      analysis.
    - >-
      No public customer concentration, renewal, cohort, or contract-length data to validate whether enterprise
      references translate into durable ARR.
    - >-
      No public SLA or independent assurance pack that fully closes security, support, and enterprise-governance
      diligence after the April 2026 incident.
