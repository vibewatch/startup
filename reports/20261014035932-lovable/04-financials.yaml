  rows:
  - - Workspace Subscriptions
    - Recurring monthly/annual platform access tiers (Pro, Business, Enterprise)
    - Monthly / Annual committed fee per workspace
    - Active ($25-$4,300/mo list price range across Pro/Business)
    - High (recurring base revenue with multi-user workspace stickiness)
    - Inspect contracted ARR versus prepaid credit churn across cohorts
  - - Usage-Based Credit Top-Ups
    - On-demand credit packs for AI generation, agent runs, and backend tasks
    - Pay-per-credit pack consumption
    - Active (credit purchases scale with generation complexity)
    - Medium (variable consumption volume subject to project completion cycles)
    - Examine monthly credit re-order velocity and seasonal volatility
  - - Lovable Cloud Runtime & Hosting
    - Built-in hosting, managed database records, storage, and runtime auth
    - Consumption-based infrastructure charges via credit pool
    - Active (launched late 2025; monetizes running apps post-build)
    - High (infrastructure lock-in creates high switching costs for live apps)
    - Audit infrastructure gross margin separate from model inference costs
  - - Enterprise Governance & Add-Ons
    - Enterprise feature uplift (SSO, SCIM, audit logs, data training opt-out)
    - Contract premium / 2x tier markup on business tiers
    - Active (included in Business tier and custom Enterprise agreements)
    - High (stable corporate budget allocation with lower price sensitivity)
    - Review Enterprise contract conversion rates and net retention
  - - Built-in Security Pentesting
    - Automated application security vulnerability and penetration scanning
    - Per-test fee ($100 per automated pentest assessment)
    - Active (commercialized adjacent compliance service)
    - Medium (discretionary deployment-time verification revenue)
    - Assess pentest attachment rate across production deployments
  - - Hyperscaler Marketplace Draws
    - Procurement pass-through via Google Cloud and Microsoft Marketplaces
    - Enterprise committed cloud spend drawdown
    - Active (multi-year partnerships with Google and Microsoft)
    - High (streamlines enterprise procurement and lowers sales resistance)
    - Verify net revenue realization after cloud marketplace distributor fees
