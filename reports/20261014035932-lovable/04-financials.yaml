- id: FI001
  title: Revenue model bridge
  type: flow
  summary: End-to-end economic conversion pipeline from user prompt activity into workspace subscriptions, infrastructure
    runtime fees, and realized gross profit.
  data:
    nodes:
    - id: user-prompt-activity
      label: User Natural-Language Prompt Activity
      description: Registered builders describe app specifications, generate code, and iterate on UI components
    - id: credit-consumption
      label: AI Generation Credit Consumption
      description: Tasks consume pooled workspace credits based on prompt and reasoning complexity
    - id: subscription-and-topups
      label: Subscription Plans & Credit Top-Ups
      description: Users subscribe to Pro/Business plans ($25-$4,300/mo) or buy credit packs to prevent workflow stoppage
    - id: runtime-infrastructure
      label: Lovable Cloud Runtime & Hosting
      description: Monetizes live production apps via ongoing compute, Supabase database queries, and storage
    - id: cogs-deductions
      label: Model API & Infrastructure COGS
      description: Model inference tokens (OpenAI, Gemini, Anthropic) and cloud compute compress gross margin to 36%-65%
    - id: realized-gross-profit
      label: Realized Platform Gross Profit
      description: Net residual cash available to fund engineering, product R&D, and enterprise GTM expansion
    edges:
    - from: user-prompt-activity
      to: credit-consumption
      label: Drives credit burn
    - from: credit-consumption
      to: subscription-and-topups
      label: Forces tier upgrade or top-up
    - from: subscription-and-topups
      to: runtime-infrastructure
      label: Deploys to production
    - from: runtime-infrastructure
      to: cogs-deductions
      label: Incurs token & server cost
    - from: cogs-deductions
      to: realized-gross-profit
      label: Yields gross margin
  approximationNotes: Flow diagram synthesizes commercial monetization mechanisms documented across official guides, pricing
