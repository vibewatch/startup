  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited customer acquisition cost (CAC), sales cycle durations, and cohort-specific net revenue retention
      schedules broken down by self-serve versus enterprise sales channels.
    whyItMatters: Without verified CAC payback timelines and cohort retention data, investors cannot determine whether rapid
      top-line ARR expansion represents durable high-LTV software utility or capital-intensive top-of-funnel customer churn.
    diligencePath: Request management financial pack detailing monthly cohort retention tables, customer lifetime value calculations,
      and sales marketing expenditure attribution.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: gross-margin
    missingEvidence: Audited cost of goods sold (COGS) schedule delineating foundational model API token expenses across OpenAI,
      Anthropic, and Google versus cloud hosting and runtime infrastructure costs.
    whyItMatters: Given the reported 36% gross margin in May 2025, validating management's ability to reach 65% gross margin
      depends directly on understanding token consumption unit economics and cloud vendor discount commitments.
    diligencePath: Obtain management accounts showing gross margin progression by quarter throughout 2025 and 2026, alongside
      cloud and LLM provider pricing agreements.
