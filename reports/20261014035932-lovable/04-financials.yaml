callouts:
- calloutType: strength
  title: Hyper-Scale Top-Line Velocity Anchored in PLG Adoption
  body: Lovable has demonstrated unprecedented revenue scaling, progressing from $17M ARR in early 2025 to an estimated $600M
    annualized revenue run rate by September 2026 [CI001, CI006]. The platform's product-led growth model allows non-technical
    builders to instantly deploy functional web applications, driving organic customer acquisition, top-up credit velocity,
    and net retention above 100% [CI005, CI006, CI009].
  claimRefs:
  - CI001
  - CI005
  - CI006
  - CI009
- calloutType: risk
  title: Gross Margin Compression from Upstream LLM Dependency
  body: Lovable's historical gross margin stood at 36% in May 2025, heavily penalized by token costs paid to underlying proprietary
    model providers including OpenAI, Google Gemini, and Anthropic [CI001, CI006]. While management targets a 65% gross margin
    in late 2026, failure to reduce inference overhead or optimize token usage per prompt risks permanently capping software
    gross margin below enterprise SaaS standards [CI006, CI008].
  claimRefs:
  - CI001
  - CI006
  - CI008
- calloutType: recommendation
  title: Mandate Audited Cohort Unit Economics Prior to Valuation Underwriting
  body: Prospective institutional investors evaluating Lovable at its $13.3B Series C valuation should condition capital commitments
    on audited cohort disclosures [CI002, CI007]. Diligence must independently verify gross margin trajectories, customer
    acquisition payback periods, net retention across enterprise tiers, and credit refund rates stemming from AI generation
    bug loops [CI006, CI008, CI013].
  claimRefs:
  - CI002
  - CI006
  - CI007
  - CI008
  - CI013
