chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Aledade was founded in 2014, and 2023 funding coverage located its headquarters in Bethesda, Maryland. Its
              operating model is a physician-enablement platform rather than a practice roll-up: independent practices,
              clinics, community health centers, and systems retain their autonomy while Aledade supplies analytics,
              EHR-integrated workflows, policy expertise, coaching, patient-engagement tools, and contract management.
              The company says its revenue is tied primarily to shared-savings performance, while current disclosures
              describe programs spanning MSSP, Medicare Advantage, Medicaid, and commercial contracts. This combination
              creates a distributed operating footprint and aligns the platform with primary-care outcomes, but it also
              leaves execution dependent on payer rules, practice adoption, and the quality of data flowing through many
              heterogeneous EHR workflows.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
