      - number: '3.2'
        title: Capability, distribution, and trust
        blocks:
          - type: paragraph
            body: >-
              Aledade's stated differentiation is an integrated operating model rather than a single application:
              analytics, guided workflows, regulatory expertise, payer relationships, and local support. An Ohio Academy
              of Family Physicians article describes the offer as data analytics, guided workflows, regulatory
              expertise, payer relationships, and hands-on local support, while the Elevance partnership shows a
              distribution route into independent practices in plans serving 47 million members. Aledade's own materials
              also emphasize that it does not own or manage practices and that partners retain clinical and operational
              autonomy. These are meaningful buying criteria for independent physicians, but the sources do not provide
              a controlled comparison of implementation time, product performance, or retention against competitors. The
              matrix consequently uses unknown where the pool does not support a fair comparison.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
