      - number: '4.2'
        title: Public traction versus private financial gaps
        blocks:
          - type: paragraph
            body: >-
              Public operating indicators show substantial scale: Aledade says it supports more than 3,000 primary-care
              partners and over 3 million patients in 2026, while a 2023 independent trade report cited $475 million of
              2022 revenue and more than 50% growth. A 2022 Elevance partnership also exposed affiliated-plan providers
              in networks serving 47 million members to Aledade's offering, illustrating a payer-channel GTM route
              rather than its economics. These figures use different periods and denominators, and company savings
              figures are not Aledade revenue. The record still lacks audited revenue mix, gross margin, CAC or payback,
              retention, concentration, cash flow, and net debt.
            claimRefs:
              - CI004
              - CI005
              - CI006
