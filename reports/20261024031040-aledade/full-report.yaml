              - CE002
              - CE004
              - CE006
              - CE007
      - number: '5.2'
        title: Operating architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              The observable architecture has four layers: heterogeneous clinical and claims inputs; analytics and
              prioritization; an EHR-facing workflow surface; and human implementation and care-transformation support.
              The model depends on timely, interoperable data from EHRs, hospitals, laboratories, pharmacies, and
              payers, as well as contracts that define attribution, quality measurement, and shared-savings economics.
              Aledade's 2022 partner announcement described a suite of technology plus local in-person services
              available to practices in Elevance-affiliated plans, while its own 2026 materials describe service across
              46 states and the District of Columbia through 68 ACOs. External descriptions support the existence of the
              model, but not its APIs, hosting design, data-governance controls, uptime, or integration economics. The
              resulting diligence issue is execution at scale: the workflow must make correct, timely data actionable
              across varied practice environments while preserving physician independence.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
