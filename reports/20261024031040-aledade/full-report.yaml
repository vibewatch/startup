  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              Aledade's customer is an independent primary-care organization that wants to participate in accountable
              care without surrendering clinical or operational autonomy. The documented workflow starts with access to
              EHR, hospital-event, laboratory, pharmacy, practice-generated, and payer-claims data, then uses patient
              prioritization, risk suggestions, and preventive-care opportunities to direct outreach and point-of-care
              action. Aledade's public materials describe both software and a hands-on operating layer: guided ACO
              initiatives, regulatory expertise, payer relationships, EHR optimization, workflow redesign, and local
              practice-transformation specialists. This makes the product closer to a technology-enabled service and
              risk-sharing operating model than a standalone SaaS application. The strongest recent integration proof is
              Aledade Assist, an embedded EHR overlay described as using AI-enabled computer vision to place patient
              insights inside an existing clinician workflow. That reduces context switching, but public sources do not
              establish supported EHR coverage, latency, model evaluation, or error-handling standards.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE010
          - type: table
