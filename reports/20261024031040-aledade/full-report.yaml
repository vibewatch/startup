      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Farzad Mostashari and Mat Kendall are identified as co-founders, with Mostashari serving as chief
              executive and Kendall as president. Their public commentary spans product, implementation, policy, and
              network strategy, making their operating experience a material asset but also a potential concentration
              point for a private company whose public disclosures provide limited detail on board composition, voting
              control, succession planning, or executive turnover. The 2023 funding coverage reported two new board
              members and an experienced senior executive hire, but the assigned evidence does not establish the current
              full board or the rights attached to investor ownership. A diligence process should therefore request the
              current cap table, board roster, delegated authorities, succession plan, and retention arrangements for
              the founders and other critical operators.
