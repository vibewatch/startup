        - Medium; operating evidence exists but price evidence is weak
        - Current marker cannot be reconciled to cash flow or dilution
      - - Bear
        - Down round, lower savings realization, payer pressure, or policy-driven economics reset
        - Capital impairment risk is high because preference, debt, and liquidity terms are unknown
        - Material; no public data rules it out
        - New financing below prior mark or covenant stress
      - - Diligence gate
        - Receive cap table, waterfall, debt package, audited statements, and cohort data
        - No price approval until the range can be tied to a denominator
        - Required before investment
        - Any missing primary document remains a blocker
    notes: >-
      Scenario values are qualitative because public evidence does not provide a supportable current revenue, EBITDA,
      cash-flow, or fully diluted-share denominator.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
