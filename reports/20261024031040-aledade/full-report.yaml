  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable category is value-based-care enablement for independent primary-care organizations: data
              aggregation, workflow support, payer contracting, coaching, quality reporting, and the operating
              infrastructure needed to participate in accountable-care arrangements. It should not be confused with
              total Medicare spending, the premium pool of Medicare Advantage, or all medical claims managed by an ACO.
              Aledade says it does not own or manage partner practices, so practice revenue and care-delivery assets sit
              outside this boundary. The status quo is fee-for-service operation supported by an EHR and internal staff;
              adjacent alternatives include health-system or corporate ownership and payer-supplied enablement. An ACO
              is the contracting and accountability vehicle, while Aledade's addressable product is the enablement and
              shared-savings layer around that vehicle.
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM009
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing and adoption
        blocks:
          - type: paragraph
            body: >-
              Public data establishes adoption scale but not vendor revenue opportunity. CMS reports 511 MSSP ACOs with
              12.6 million assigned beneficiaries for 2026, versus 476 ACOs and 11.2 million beneficiaries in 2025.
              Broader CMS accountable-care initiatives coordinate care for an estimated 14.3 million Medicare
              beneficiaries, while Medicare Advantage enrolls 35.2 million of 64.2 million eligible beneficiaries. These
              populations overlap or use different payment systems, so they are sizing lenses rather than additive TAM
              layers. Company-reported Aledade scale rose from 1,500 practices and more than 2 million patients in 2023
              to over 3,000 partners and more than 3 million patients in 2026. Its claim of serving nearly 20% of total
              MSSP participation indicates material penetration, but the disclosed denominator does not translate into
              software revenue, shared-savings revenue, or a reliable SOM.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM011
      - number: '2.3'
        title: Buyer, user, payer, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The operational buyer is typically an independent practice, clinic, or community health center seeking
              scale without surrendering ownership; users are physicians, care teams, and administrative staff. The
              economic payer is different: CMS funds MSSP economics, while Medicare Advantage, Medicaid, and commercial
              insurers fund other value-based contracts. Aledade therefore needs both practice adoption and
              payer-contract access. Its Elevance partnership illustrates a payer-channel route that can expose
              affiliated independent providers to Aledade's tools and in-person services. For smaller organizations,
              joining an ACO can substitute for building contracting, analytics, and support capabilities internally.
              Adoption is triggered when expected shared savings, workflow assistance, and preserved autonomy exceed
              switching, reporting, and downside-risk costs; the source set does not reveal contract pricing or the
              exact split of value among payer, practice, and enablement vendor.
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Growth is supported by larger MSSP participation, broad Medicare Advantage enrollment, and policy
              mechanisms that reward quality and total-cost performance. Constraints are equally structural. In 2026,
              82.8% of MSSP ACOs were in tracks that meet advanced alternative-payment-model criteria, exposing
              participants to more demanding risk arrangements. Aledade also described a natural timing gap in Medicare
              payments that requires working capital, showing that scale can increase financing needs before
              distributions arrive. Medicare Advantage is concentrated, with UnitedHealth and Humana representing 46% of
              enrollment, and payments remain under policy scrutiny because KFF estimates 2026 payments at 14% above
              comparable traditional Medicare spending. Finally, Aledade published incompatible 2024 avoided-utilization
              figures of more than 260,000 and more than 171,000 events. Without definitions, cohort reconciliation,
              pricing, retention, and audited unit economics, market growth should support demand confidence but not a
              precise valuation multiple or revenue TAM.
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not capitalize gross healthcare spend as TAM
            body: >-
              Beneficiary counts, premium pools, total cost of care, and ACO-attributed medical spending are demand
              indicators, not Aledade revenue. A valuation model needs contract economics, retained shared-savings
              share, churn, and contribution margin before converting these scale markers into revenue.
            calloutType: risk
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitive set
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than software vendors. Aledade is positioned against
              health-system-led ACOs, payer-led enablement, other physician-aggregation platforms, internal practice
              builds, and the fee-for-service status quo. CMS reported 511 Shared Savings Program ACOs serving 12.6
              million traditional Medicare beneficiaries in 2026, so the policy infrastructure is a large platform on
              which multiple operating models can compete. Aledade's 2026 company announcement says it served more than
              3,000 primary care partners and nearly 20% of total MSSP; those figures are company-issued and should not
              be read as independent market share verification. The competitor profile below therefore separates named
              counterparties from structural alternatives and marks missing public data rather than filling it with
              assumptions.
            claimRefs:
              - CP001
              - CP002
              - CP003
