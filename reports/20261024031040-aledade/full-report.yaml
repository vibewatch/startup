        title: Capital, scale, and milestone trajectory
        blocks:
          - type: paragraph
            body: >-
              Aledade reported a sharp increase in operating scale: more than 3,000 primary care partners caring for
              more than 3 million patients across 46 states and the District of Columbia for the 2026 performance year,
              after adding more than 700 organizations. Fierce Healthcare reported $1 billion of 2025 revenue and
