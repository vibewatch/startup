              - CP005
              - CP006
              - CP008
              - CP011
      - number: '3.3'
        title: Pricing, packaging, and switching
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose a comparable list price or realized take-rate for Aledade, Elevance's
              arrangement, health-system programs, or internal builds. The older Ohio physician-facing description says
              90% of Aledade revenue came from helping practices achieve shared savings, but that is a historical
              company-facing statement rather than a current audited revenue mix. It does clarify the economic design:
              the platform participates in outcome-linked upside instead of charging a transparent per-seat price. The
              resulting switching cost is likely operational and contractual—data integration, workflows, ACO
              participation, payer relationships, and practice trust—but the retained sources do not quantify migration
              cost, exclusivity, contract duration, or multi-homing. Those gaps matter because a broad network can be a
              moat only if partners stay, savings are repeatable, and competing channels cannot reproduce the service
              bundle.
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP011
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Aledade has evidence of scale and partner distribution, but durability remains conditional. Fierce
              Healthcare reported that the company used financing and acquisitions to add capabilities and described its
              differentiation as growth, multi-payer contracting, and repeatable savings; that is third-party reporting
              of management's position, not a benchmark. The company's 2026 release reports that 93% of its ACOs
              achieved savings in the most recent MSSP performance year and that more than $1 billion in savings was
              generated, while CMS independently reports $4.1 billion of total MSSP shared savings in performance year
              2024. The figures use different populations and issuers, so they cannot establish a relative win rate. The
              principal displacement risks are payer or health system ownership of distribution, direct internal
              analytics investment, regulatory redesign, and commoditization of workflow tooling. No retained source
              supplies competitor churn, pricing pressure, or a failed Aledade deployment; these remain explicit
              diligence gaps rather than negative conclusions.
            claimRefs:
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is the clearest moat signal
            body: >-
              Aledade's reported 3,000-plus partner footprint, broad geography, and payer relationships create a
              distribution advantage that a point-solution vendor would need time and trust to replicate.
            calloutType: strength
            claimRefs:
              - CP001
              - CP006
          - type: callout
            title: Comparative evidence is incomplete
            body: >-
              The retained pool supports Aledade's own scale and operating claims but does not establish competitor
              pricing, retention, implementation cost, or relative savings; underwriting should not convert the apparent
              footprint into a proven durable moat.
            calloutType: risk
            claimRefs:
              - CP008
              - CP011
              - CP014
