      - number: '5.3'
        title: Maturity, differentiation, and proof
        blocks:
          - type: paragraph
            body: >-
              Aledade has operated since 2014 and public evidence indicates a mature commercial footprint: more than
              3,000 primary-care partners and more than 3 million patients in value-based programs for the 2026
              performance year, with work across 46 states and the District of Columbia. Its differentiation is a
              coordinated combination of physician-led governance, payer and regulatory expertise, local delivery,
              proprietary analytics, and distribution into value-based contracts. Fierce Healthcare reported a
              build-and-buy roadmap through acquisitions of analytics provider Curia and patient-care provider Iris
              Healthcare. Recent company-reported outcomes include 93% of its accountable care organizations achieving
              savings in the most recent MSSP performance year and more than $1 billion in total savings, while a
              healthcare-IT article describes Aledade Assist in a named physician workflow. These remain a mix of
              company claims, partner material, and reported interviews rather than an independent technical benchmark.
              The GitHub search surface returned a generic repository-results page whose visible entries did not
              establish an official Aledade public developer platform.
            claimRefs:
              - CE005
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Trust, safety, and implementation risks
        blocks:
          - type: paragraph
            body: >-
              The product operates in a high-consequence clinical and regulated reimbursement context. Public materials
              emphasize regulatory expertise, quality reporting, and proactive care, but the assigned evidence does not
              document a security certification, breach history, model card, clinical validation protocol, audit-log
              design, role-based access controls, or incident-response commitments. Aledade Assist's use of AI-enabled
              computer vision creates a specific diligence need around missed or misclassified information, human
              review, explainability, and safe fallback when source records are incomplete. The delivery model also
              inherits payer-policy and data-availability risk: Medicare Advantage enrollment and ACO participation are
              large and growing markets, but payment and attribution rules can change. A buyer or investor should
              therefore request integration references, supported-EHR and data-source inventories, service-level
              metrics, security attestations, AI governance materials, and customer-level evidence that reported savings
              and workflow benefits are reproducible.
            claimRefs:
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated workflow moat
            body: >-
              The defensible element is the combination of data, contracts, physician enablement, and local
              implementation rather than any publicly specified software component.
            calloutType: strength
            claimRefs:
              - CE001
              - CE006
              - CE010
          - type: callout
            title: Technical disclosure gap
            body: >-
              Public evidence does not establish architecture, security controls, reliability, AI validation, or
              developer adoption, so implementation risk cannot be underwritten from marketing materials alone.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
          - type: callout
            title: Request production evidence
            body: >-
              Require a supported-integration matrix, uptime and data-latency history, security package, AI oversight
              documentation, and customer references before treating the platform as technically mature.
            calloutType: recommendation
            claimRefs:
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying model
        blocks:
          - type: paragraph
            body: >-
              Aledade's disclosed customer base centers on independent primary care organizations: practices, clinics,
              community health centers, and systems entering value-based contracts without selling their practices to
              the platform. The clinician and care team are the daily users, while Medicare programs, Medicare Advantage
              plans, Medicaid programs, and commercial payers fund the underlying care arrangements. Aledade reported
              more than 370 community health centers in its 2026 network and said more than 60% of partner practices
              were in federally designated health professional shortage areas, indicating meaningful safety-net
              penetration. A historical Ohio Academy of Family Physicians promotional article said 90% of Aledade's
              revenue came from helping practices achieve shared savings. That issuer relationship makes the statement
              directional rather than independently verified, but it clarifies that customer value and Aledade's
              monetization have been linked to care-cost performance.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU013
      - number: '6.2'
        title: Adoption trajectory and operating proof
        blocks:
          - type: paragraph
            body: >-
              The strongest current adoption marker is Aledade's February 2026 announcement that it added more than 700
              primary care organizations for the performance year, bringing the network to more than 3,000 partners and
              over 3 million patients. Aledade also said it served one in five new Medicare Shared Savings Program
              participants and nearly 20% of the total program. The trajectory is directionally consistent with earlier
              snapshots: an independent 2016 article described 400 physicians across 11 states; Elevance and Baidu
              materials described more than 1,000 practices and 1.7 million patient lives in 2022; and Fierce Healthcare
              reported more than 1,500 practices and over 2 million patients in 2023. These vintages use different units
              and issuers, so they demonstrate expansion but do not form a clean retention cohort or a like-for-like
              annual customer series.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU009
              - CU013
              - CU014
      - number: '6.3'
        title: Production outcomes and named channel proof
        blocks:
          - type: paragraph
            body: >-
              Aledade's reported outcomes indicate operating activity beyond a logo list. It said 93% of its accountable
              care organizations achieved savings in the most recent MSSP performance year and that those organizations
              generated more than $1 billion in total savings; it separately reported more than 800,000 annual wellness
              visits by MSSP partners in 2024. These are company-issued program metrics rather than audited customer
              retention measures, and the relevant denominators and distribution across practices are not public. Named
              commercial evidence is primarily channel evidence: Elevance announced access to Aledade technology and
              local services for independent providers in affiliated-plan networks, while Fierce Healthcare reported
              partnerships with Humana, CareFirst BlueCross BlueShield, and Cigna. The disclosures establish routes to
              production adoption, but they do not reveal conversion, active deployment, renewal, exclusivity, or
              customer-level economics.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU013
              - CU014
      - number: '6.4'
        title: Durability, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed scale should not be read as retention. The assigned evidence does not provide NRR, GRR,
              churn, renewal rates, contract duration, average customer value, or top-payer, top-practice, top-region,
              and top-customer concentration. The external market is large: Becker's reported 511 MSSP ACOs serving 12.6
              million traditional Medicare beneficiaries in 2026. It is also concentrated in an adjacent payer channel:
              KFF found that UnitedHealth Group and Humana together represented 46% of nationwide Medicare Advantage
              enrollment in 2026. That statistic is not Aledade-specific concentration, but it illustrates why
              payer-level exposure and contract dependency must be tested rather than inferred from the broad practice
              count. Diligence should reconcile signed, live, renewed, expanded, and terminated practices to revenue,
              shared-savings receipts, and attributed patients by payer and cohort.
            claimRefs:
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad current reach
            body: >-
              Aledade reports more than 3,000 primary care partners, over 3 million patients, and more than 370
              community health centers for the 2026 performance year.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: Adjacent payer concentration requires direct testing
            body: >-
              KFF's 46% combined Medicare Advantage enrollment share for UnitedHealth Group and Humana is market
              context, not Aledade-specific exposure; the company's own payer concentration remains undisclosed.
            calloutType: risk
            claimRefs:
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture and investment implications
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is coding and program-integrity exposure. Independent reporting documented
              allegations that Aledade's software and guidance encouraged unsupported diagnoses; Aledade denied those
              allegations. The private action later ended in a $300,000 judgment and dismissal of the parties' claims
              and counterclaims with prejudice, but the judgment states that it did not affect the earlier dismissal
              without prejudice of the United States' False Claims Act claims. That is not evidence of a current
              government claim, yet it prevents treating the private resolution as a complete regulatory release.
              Medicare-policy exposure ranks next because the business operates at meaningful MSSP scale while 2026
              rules shorten the upside-only runway and alter quality scoring. Operational exposure is lower in immediate
              severity but broad in reach: public evidence shows useful program-level mitigations, not enterprise-wide
              control testing. Investment approval should therefore require legal, compliance, security, insurance, and
              covenant evidence rather than rely on the absence of another publicly recorded incident.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR010
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Medicare rules are both the demand engine and the principal external control surface. CMS's TEAM model is
              mandatory in selected geographies for 2026 through 2030, permits beneficiaries to be in both TEAM and ACO
              initiatives, and requires participating hospitals to refer patients to primary care. This creates
              coordination opportunity but also more interfaces, attribution questions, and accountability across
              organizations. Separately, the AMA reports that CMS will reduce the maximum upside-only MSSP period from
              seven to five years for agreement periods beginning in 2027 and removed the health-equity adjustment from
              ACO quality scores beginning with performance year 2025. These are enacted policy changes, not
              company-specific failures, but their economics should be modeled against Aledade's actual contract
              cohorts. The legal diligence path is similarly concrete: reconcile the 2025 judgment, any government
              reservation, coding-audit results, and insurance coverage before underwriting residual exposure.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR015
              - CR016
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              A supplier case study demonstrates both a control weakness and a mitigation pattern. Aledade reported
              reliance on payer claims that lagged by two to three months; a pilot used pharmacy history data to reduce
              false-positive medication-adherence outreach by 585 of 2,235 identified opportunities. The same case study
              says the pilot initially required a three-person team and manual integration work, showing that data
              quality can be improved but may introduce supplier, workflow, and scaling dependencies. Those historical
              results should not be generalized to the current network without fresh control evidence. None of the
              retained sources provides enterprise-wide proof of security testing, incident response,
              data-reconciliation coverage, recovery objectives, or third-party risk controls. These are gaps, not
              evidence of a breach. A material control deficiency, sustained data latency, or inability to reconcile
              payer and clinical records should be a thesis-break trigger.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Partner, network, and financial-model dependencies
        blocks:
          - type: paragraph
            body: >-
              The model depends on counterparties at several layers: CMS and commercial payers define economic rules,
              independent practices execute workflows, and data suppliers improve the timeliness and accuracy of
              interventions. Aledade says it serves more than 3,000 primary-care partners and more than 3 million
              patients, and nearly 20% of the total MSSP. Those company-issued figures indicate reach, not verified
              concentration or retention. An older partner-hosted promotional page stated that 90% of revenue came from
              helping practices achieve shared savings, but no retained current source provides audited revenue mix,
              payer concentration, contract duration, downside-risk exposure, or practice churn. Meanwhile, third-party
              analysis of TEAM projects losses for many mandatory hospital participants under current criteria,
              illustrating how policy design can redistribute economics even when value-based care demand persists.
              Underwriting should require cohort-level economics and counterparty concentration before crediting scale
              as resilience.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Private resolution is not a complete regulatory release
            body: >-
              The 2025 judgment resolved the private parties' claims and counterclaims, but expressly did not affect the
              prior without-prejudice dismissal of the United States' False Claims Act claims. Diligence should confirm
              residual exposure rather than infer either an active claim or a full release.
            calloutType: risk
            claimRefs:
              - CR001
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is operating scale in a structurally supported market. Aledade says it serves more than
              3,000 primary care partners and more than 3 million patients in 2026, while its 2024 MSSP results included
              more than $1 billion of savings and 93% of its accountable care organizations achieving savings. Elevance
              previously described more than 1,000 practices, 1.7 million lives, and more than 140 contracts in 2022,
              providing independent partner evidence that the model had commercial reach before the latest expansion.
              The anti-thesis is that these operating metrics are not revenue, ARR, margin, cash flow, or investor
              returns. Aledade's model depends on payer programs, shared-savings realization, and execution across
              heterogeneous practices; CMS's 2026 policy changes show that reimbursement and payment accuracy rules can
              change the economics of provider participation. The company therefore merits a scalable-platform thesis,
              but not a buy call without audited financials and transaction terms.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.2'
        title: Price discipline and scenario framework
        blocks:
          - type: paragraph
            body: >-
              The latest public financing evidence is historical and incomplete. Fierce Healthcare reported a $260
              million Series F in 2023, a $3.5 billion valuation attributed to Bloomberg sources, and $660 million
              raised to date; Dealroom's 2026 profile maps 15 investors but labels its ownership data estimated and says
              some investors are hidden. Neither source supplies a current primary transaction, fully diluted
              capitalization, liquidation preferences, debt, or secondary-market depth. For a private, value-based-care
              enablement company, the first-pass method should be a revenue or gross-profit multiple only after audited
              revenue composition and margin are obtained; using a public provider-enablement comparator as a
              directional market check is more defensible than importing a software ARR multiple. Agilon Health's market
              capitalization was $1.50 billion on October 23, 2026, while CVS completed the Oak Street acquisition at
              approximately $10.6 billion enterprise value in 2023. Those are not apples-to-apples valuations, but they
              provide directional public-market and strategic-transaction context.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.3'
        title: Recommendation, downside triggers, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence and high risk: the business has credible
              adoption signals, but the price-sensitive inputs remain private. The base case should assume continued
              partner growth but no automatic conversion of reported savings or patient coverage into company revenue. A
              bull case requires audited growth, durable shared-savings economics, improving contribution margin, and a
              financing or secondary reference inside the indicated range. A bear case is triggered by a down round,
              materially lower realized savings, payer-policy changes that reduce contract economics, rising losses, or
              evidence that growth requires disproportionate capital. CMS's rulemaking and Aledade's reliance on
              multiple contract types make policy and execution diligence central. Exit readiness is plausible through
              strategic healthcare buyers or a public-market path, but Aledade's 2023 CEO comments explicitly said an
              IPO was a possible means rather than a destination; no current timetable is public. Request the cap table,
              preference waterfall, debt covenants, audited statements, revenue-recognition bridge, cohort retention,
              payer concentration, and latest financing documents before committing.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              Do not convert reported scale into a buy decision until current price, audited economics, dilution,
              preferences, and debt terms are obtained.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV013
          - type: callout
            title: Scale is the strongest public signal
            body: >-
              Aledade's 2026 network and patient figures, plus partner and outcome disclosures, indicate substantial
              operating reach.
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: callout
            title: The denominator is missing
            body: >-
              The public record does not establish revenue quality, cash conversion, fully diluted ownership, or the
              price at which the reported valuation range clears.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV015
