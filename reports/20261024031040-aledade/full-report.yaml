      - number: '4.3'
        title: Cost structure, working capital, and policy exposure
        blocks:
          - type: paragraph
            body: >-
              Aledade's delivery model requires technology, regulatory expertise, local support, clinical interfaces,
              and shared-savings distributions to physician partners. Its CMS comments identify data-access fees and
              reporting burdens as material ACO costs, including an example where vendor fees could consume 20% of MSSP
              revenue for an ACO with extensive specialty participation. A joint lender announcement says Medicare
              payment timing creates a working-capital gap, while Aledade separately cautions that shared savings are
              not guaranteed. Risk-based arrangements can require downside payments when spending rises, and KFF's 2026
              Medicare Advantage analysis highlights payment scrutiny around the segment. No source establishes
              Aledade's own burn or gross margin.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Aledade announced a $500 million senior secured Ares facility with capacity to expand to $650 million and
              said it doubles committed financing capacity; the stated use is working-capital flexibility, including
              bridging Medicare-payment timing and accelerating partner distributions. This is financing capacity, not
              cash on hand, and the public materials do not state drawn balance, interest cost, covenants, maturity,
              collateral, or runway. Historical funding and valuation markers provide context but do not prove current
              liquidity. The financial case is attractive on operating scale and policy tailwinds, yet underwriting
              should remain research-more until unit economics, cash conversion, debt terms, and contract-level
              concentration are disclosed.
            claimRefs:
              - CI009
              - CI014
              - CI015
              - CI017
