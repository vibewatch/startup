      - number: '1.4'
        title: Diligence implications
        blocks:
          - type: paragraph
            body: >-
              The strongest verified positives are network breadth, multi-payer coverage, evidence of recent practice
              additions, and a stated transition from growth toward profitability. The principal underwriting
              limitations are private-company disclosure and the operating risk of scaling a service-heavy, risk-bearing
              model across independent practices. Neither the assigned evidence nor the public descriptions establish
              current ARR, net retention, churn, gross margin, cash flow, debt draw, covenant headroom, liquidation
              preferences, option dilution, or a current third-party clearing valuation. Aledade's public-benefit status
              and physician-led positioning may support partner trust, but they do not substitute for legal, financial,
              and governance diligence. Treat the historical $3.5 billion valuation and $660 million raised as dated
              reported figures, not as current marks or available cash.
