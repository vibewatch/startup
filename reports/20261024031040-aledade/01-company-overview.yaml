company:
  name: Aledade
chapter:
  number: 1
  title: Company Overview
  summary: Aledade is a physician-led public benefit corporation founded in 2014 that combines accountable-care contracts, data and workflow software, and field support for independent primary care organizations. Current disclosures show rapid network expansion and $1 billion of 2025 revenue, but private-company economics, governance detail, and debt utilization remain incompletely disclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Aledade was founded in 2014, and 2023 funding coverage located its headquarters in Bethesda, Maryland. Its operating model is a physician-enablement platform rather than a practice roll-up: independent practices, clinics, community health centers, and systems retain their autonomy while Aledade supplies analytics, EHR-integrated workflows, policy expertise, coaching, patient-engagement tools, and contract management. The company says its revenue is tied primarily to shared-savings performance, while current disclosures describe programs spanning MSSP, Medicare Advantage, Medicaid, and commercial contracts. This combination creates a distributed operating footprint and aligns the platform with primary-care outcomes, but it also leaves execution dependent on payer rules, practice adoption, and the quality of data flowing through many heterogeneous EHR workflows.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: leadership-governance-and-dependence
    title: Leadership, governance, and key-person dependence
    body: >-
      Farzad Mostashari and Mat Kendall are identified as co-founders, with Mostashari serving as chief executive and Kendall as president. Their public commentary spans product, implementation, policy, and network strategy, making their operating experience a material asset but also a potential concentration point for a private company whose public disclosures provide limited detail on board composition, voting control, succession planning, or executive turnover. The 2023 funding coverage reported two new board members and an experienced senior executive hire, but the assigned evidence does not establish the current full board or the rights attached to investor ownership. A diligence process should therefore request the current cap table, board roster, delegated authorities, succession plan, and retention arrangements for the founders and other critical operators.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: capital-scale-and-milestones
    title: Capital, scale, and milestone trajectory
    body: >-
      Aledade reported a sharp increase in operating scale: more than 3,000 primary care partners caring for more than 3 million patients across 46 states and the District of Columbia for the 2026 performance year, after adding more than 700 organizations. Fierce Healthcare reported $1 billion of 2025 revenue and profitability in 2025, while the same report described a $500 million senior secured credit facility that can expand to $650 million. Earlier reporting described $660 million of cumulative equity raised and a $3.5 billion valuation in the 2023 Series F context, but those figures are historical markers rather than a current valuation or cash balance. CMS data confirms the underlying policy market is expanding, yet its description that accountable organizations may share in losses underscores that scale does not remove performance and policy risk. Current cash, debt draw, covenants, exact revenue mix, and a refreshed valuation remain gaps.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: diligence-gaps-and-implications
    title: Diligence implications
    body: >-
      The strongest verified positives are network breadth, multi-payer coverage, evidence of recent practice additions, and a stated transition from growth toward profitability. The principal underwriting limitations are private-company disclosure and the operating risk of scaling a service-heavy, risk-bearing model across independent practices. Neither the assigned evidence nor the public descriptions establish current ARR, net retention, churn, gross margin, cash flow, debt draw, covenant headroom, liquidation preferences, option dilution, or a current third-party clearing valuation. Aledade's public-benefit status and physician-led positioning may support partner trust, but they do not substitute for legal, financial, and governance diligence. Treat the historical $3.5 billion valuation and $660 million raised as dated reported figures, not as current marks or available cash.
    claimRefs: [CO013, CO014, CO015]
