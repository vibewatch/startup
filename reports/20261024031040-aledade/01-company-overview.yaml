callouts:
  - calloutType: strength
    title: Distributed scale with current expansion evidence
    body: The 2026 disclosures combine more than 3,000 primary care partners, more than 3 million patients, and more than 700 additions across 46 states and the District of Columbia.
    claimRefs: [CO002, CO003]
  - calloutType: risk
    title: Private-company economics remain the underwriting constraint
    body: The assigned evidence does not establish current valuation, cash balance, debt draw, covenant headroom, revenue mix, retention, or dilution; historical funding and valuation figures must not be treated as current liquidity or price.
    claimRefs: [CO013, CO014, CO015]
