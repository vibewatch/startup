  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow or pain point, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Find patients needing intervention", "Staff review dispersed records and claims", "Patient prioritization, risk suggestions, and preventive-care opportunities", "Enables proactive outreach", "No independent lift or denominator is supplied"]
      - ["See recent care across settings", "Clinician searches charts and external records", "Hospital-event and other data surfaced in the EHR workflow", "Faster context at the visit", "Completeness and latency of feeds are undisclosed"]
      - ["Manage chronic conditions", "Practice coordinates prevention and follow-up", "Guided ACO initiatives and clinical support", "Supports quality and total-cost goals", "Shared savings are not guaranteed"]
      - ["Participate in value-based contracts", "Small practice lacks scale and regulatory expertise", "ACO formation, payer relationships, and policy support", "Lowers organizational barrier to participation", "Contract terms and practice-level economics are not public"]
      - ["Preserve practice autonomy", "Corporate consolidation can change governance", "Physician-led model with local support", "Keeps the practice independent according to company and partner materials", "Governance rights and implementation burden require customer references"]
    notes: "This is a workflow synthesis from assigned product, partner, and customer-facing evidence; benefits are described as intended or reported outcomes, not independently verified causal effects."
    claimRefs: [CE001, CE002, CE004, CE006, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence ask]
    rows:
      - ["Clinical and claims data inputs", "Supply patient, utilization, quality, and care-event context", "EHRs, hospitals, labs, pharmacies, and payer claims", "Data completeness, interoperability, provenance, and refresh latency"]
      - ["Analytics and risk prioritization", "Identify at-risk patients and care opportunities", "Reliable normalized data and validated logic", "Bias, false positives, and explainability"]
      - ["Guided workflow layer", "Turn insights into outreach and care actions", "Practice adoption and usable task design", "Workflow fatigue, completion rates, and role permissions"]
      - ["EHR-facing Assist overlay", "Present relevant insights at point of care", "EHR compatibility and computer-vision performance", "Missed or misclassified information and safe fallback"]
      - ["ACO and payer operating layer", "Tie actions to quality, attribution, and shared savings", "Payer contracts and CMS program rules", "Policy changes, reconciliation timing, and economics"]
      - ["Local transformation services", "Train and support practice execution", "Skilled field teams and local context", "Scalability, staffing intensity, and service consistency"]
    notes: "The layered view is an evidence-bounded operating model, not a claim about undisclosed hosting or software architecture. Dependencies and risks are explicit because the public sources do not provide technical specifications."
    claimRefs: [CE006, CE007, CE008, CE009, CE014, CE015]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Aledade's public-facing product is a layered combination of data inputs, analytics, EHR workflow, contracts, and local support.
    data:
      layers:
        - name: Clinical and claims inputs
          label: Clinical and claims inputs
          detail: Patient, utilization, quality, and care-event context from documented source systems.
          items:
            - label: EHR data
              detail: Patient records and practice workflow context.
            - label: Hospital events
              detail: External care events and notifications.
            - label: Labs and pharmacies
              detail: Additional clinical and medication context.
            - label: Payer and practice claims
              detail: Utilization and value-based measurement inputs.
        - name: Analytics and guided action
          label: Analytics and guided action
          detail: Converts data into prioritization and care opportunities.
          items:
            - label: Patient prioritization
              detail: Directs attention to patients needing intervention.
            - label: Risk suggestions
              detail: Surfaces risk signals for care teams.
            - label: Preventive-care opportunities
              detail: Supports outreach and quality workflows.
        - name: Point-of-care workflow
          label: Point-of-care workflow
          detail: Presents relevant insights within existing clinician work.
          items:
            - label: Aledade Assist
              detail: AI-enabled computer-vision overlay described as sitting in the existing EHR workflow.
            - label: Guided ACO initiatives
              detail: Structured clinical and quality support.
        - name: Contract and delivery layer
          label: Contract and delivery layer
          detail: Connects technology to value-based contracts and implementation.
          items:
            - label: ACO and payer relationships
              detail: Enables value-based contracts and shared-savings participation.
            - label: Local practice transformation
              detail: Hands-on implementation and workflow redesign.
        - name: Quality and regulatory layer
          label: Quality and regulatory layer
          detail: Connects clinical workflows to quality reporting and program rules.
          items:
            - label: Quality reporting
              detail: Supports measurement in value-based programs.
            - label: Regulatory expertise
              detail: Helps practices navigate complex program requirements.
        - name: Physician governance layer
          label: Physician governance layer
          detail: Preserves the physician-led operating orientation described in public materials.
          items:
            - label: Practice independence
              detail: Aledade states that it does not own or manage partner practices.
            - label: Local decision support
              detail: Pairs national expertise with local market and practice context.
    approximationNotes: Layer contents are limited to capabilities explicitly described in assigned sources; no undisclosed infrastructure, API, hosting, security, or data-governance components are inferred.
    claimRefs: [CE001, CE003, CE006, CE007, CE008, CE009]
