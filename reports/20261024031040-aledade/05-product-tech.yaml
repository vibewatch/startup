  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: Current security attestations, certifications, access-control model, audit logging, breach history, and incident-response commitments.
      whyItMatters: The platform handles clinical and claims data and influences care workflows, so trust and operational controls are material to deployment risk.
      diligencePath: Request the current security package, penetration-test summary, privacy documentation, incident log, and customer security questionnaire responses.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: AI-governance
      missingEvidence: Aledade Assist's supported EHR inventory, model-validation results, error taxonomy, human-review policy, and fallback behavior.
      whyItMatters: An EHR overlay that surfaces clinical context can create safety and workflow risks if records are incomplete or signals are misclassified.
      diligencePath: Request model cards, validation cohorts, monitoring dashboards, change-control records, and references from production users.
      relatedQuestionRefs: [QE003, QE006, QE008]
    - type: missing-source
      severity: material
      topic: implementation
      missingEvidence: Independent evidence on integration latency, uptime, implementation duration, workflow adoption, and practice-level outcomes.
      whyItMatters: Public descriptions establish capabilities but not repeatable technical performance or implementation economics.
      diligencePath: Obtain anonymized customer references, service-level reports, integration runbooks, and before-and-after workflow metrics.
      relatedQuestionRefs: [QE007, QE008, QE009]
    - type: enumeration-incomplete
      severity: minor
      topic: developer-signal
      missingEvidence: A practitioner-community proxy or authenticated public developer surface showing product usage, releases, or technical participation.
      whyItMatters: The assigned GitHub search did not establish open-source activity, and a developer signal is required for this chapter's technology assessment.
