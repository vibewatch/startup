chapter:
  number: 8
  title: Valuation
  summary: "Aledade shows meaningful scale and evidence of demand, but public evidence does not establish a current transaction price, complete cap table, cash conversion profile, or preference stack. The resulting call is research-more: underwriting should use explicit downside tests rather than treat the reported 2023 $3.5 billion financing valuation as a current clearing price."
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The positive case is operating scale in a structurally supported market. Aledade says it serves more than 3,000 primary care partners and more than 3 million patients in 2026, while its 2024 MSSP results included more than $1 billion of savings and 93% of its accountable care organizations achieving savings. Elevance previously described more than 1,000 practices, 1.7 million lives, and more than 140 contracts in 2022, providing independent partner evidence that the model had commercial reach before the latest expansion. The anti-thesis is that these operating metrics are not revenue, ARR, margin, cash flow, or investor returns. Aledade's model depends on payer programs, shared-savings realization, and execution across heterogeneous practices; CMS's 2026 policy changes show that reimbursement and payment accuracy rules can change the economics of provider participation. The company therefore merits a scalable-platform thesis, but not a buy call without audited financials and transaction terms.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: valuation-framework
    title: Price discipline and scenario framework
    body: >-
      The latest public financing evidence is historical and incomplete. Fierce Healthcare reported a $260 million Series F in 2023, a $3.5 billion valuation attributed to Bloomberg sources, and $660 million raised to date; Dealroom's 2026 profile maps 15 investors but labels its ownership data estimated and says some investors are hidden. Neither source supplies a current primary transaction, fully diluted capitalization, liquidation preferences, debt, or secondary-market depth. For a private, value-based-care enablement company, the first-pass method should be a revenue or gross-profit multiple only after audited revenue composition and margin are obtained; using a public provider-enablement comparator as a directional market check is more defensible than importing a software ARR multiple. Agilon Health's market capitalization was $1.50 billion on October 23, 2026, while CVS completed the Oak Street acquisition at approximately $10.6 billion enterprise value in 2023. Those are not apples-to-apples valuations, but they provide directional public-market and strategic-transaction context.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
  - id: decision-and-diligence
    title: Recommendation, downside triggers, and exit readiness
    body: >-
      The recommendation is research-more with medium confidence and high risk: the business has credible adoption signals, but the price-sensitive inputs remain private. The base case should assume continued partner growth but no automatic conversion of reported savings or patient coverage into company revenue. A bull case requires audited growth, durable shared-savings economics, improving contribution margin, and a financing or secondary reference inside the indicated range. A bear case is triggered by a down round, materially lower realized savings, payer-policy changes that reduce contract economics, rising losses, or evidence that growth requires disproportionate capital. CMS's rulemaking and Aledade's reliance on multiple contract types make policy and execution diligence central. Exit readiness is plausible through strategic healthcare buyers or a public-market path, but Aledade's 2023 CEO comments explicitly said an IPO was a possible means rather than a destination; no current timetable is public. Request the cap table, preference waterfall, debt covenants, audited statements, revenue-recognition bridge, cohort retention, payer concentration, and latest financing documents before committing.
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: []
    figureRefs: []
tables:
