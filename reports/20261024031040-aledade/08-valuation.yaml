    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a buy without current price and audited economics]
      - [Confidence, medium, Operating scale is evidenced but valuation inputs are incomplete]
      - [Risk rating, "high", "Policy, payer, execution, and financing risks require explicit downside tests"]
      - [Valuation stance, stretched-to-indeterminate, The historical $3.5 billion report does not prove a current clearing price]
    notes: "Assessment combines company, partner, regulator, market-data, and independent reporting; public figures are not a current cap-table or transaction mark."
    claimRefs: [CV001, CV007, CV008, CV013]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Scale and demand, "3,000+ partners and 3M+ patients claimed for 2026", "Audited cohort retention and revenue conversion below plan"]
      - [Commercial validation, "Elevance described 1,000+ practices and 1.7M lives in 2022", "Payer concentration or contract attrition materially weakens durability"]
      - [Outcome credibility, "Aledade reported $1B+ recent MSSP savings and 93% ACO savings", "Independent reconciliation shows lower realized savings or unfavorable economics"]
      - [Policy exposure, "CMS finalized 2026 payment and chronic-care changes", "Contract economics deteriorate after rule changes"]
    notes: "Company-reported outcome metrics and partner descriptions are not equivalent to audited revenue, profit, or investor return metrics."
    claimRefs: [CV001, CV002, CV003, CV005, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited growth, durable savings, improving contribution margin, and favorable financing terms", "A premium to directional public-market context is supportable only with verified earnings power and business-model adjustments", "Low-to-medium; key inputs are private", "Growth is purchased with worsening cash conversion"]
      - [Base, "Partner growth continues; shared savings remain positive; margins and retention are unverified", "Use a range anchored to verified revenue or gross profit, with a material private-company discount", "Medium; operating evidence exists but price evidence is weak", "Current marker cannot be reconciled to cash flow or dilution"]
      - [Bear, "Down round, lower savings realization, payer pressure, or policy-driven economics reset", "Capital impairment risk is high because preference, debt, and liquidity terms are unknown", "Material; no public data rules it out", "New financing below prior mark or covenant stress"]
      - [Diligence gate, "Receive cap table, waterfall, debt package, audited statements, and cohort data", "No price approval until the range can be tied to a denominator", "Required before investment", "Any missing primary document remains a blocker"]
    notes: "Scenario values are qualitative because public evidence does not provide a supportable current revenue, EBITDA, cash-flow, or fully diluted-share denominator."
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV015, CV016]
