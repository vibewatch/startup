      - "CM005"
      - "CM007"
      - "CM011"
callouts:
  - calloutType: "risk"
    title: "Do not capitalize gross healthcare spend as TAM"
    body: >-
      Beneficiary counts, premium pools, total cost of care, and ACO-attributed
      medical spending are demand indicators, not Aledade revenue. A valuation
      model needs contract economics, retained shared-savings share, churn, and
      contribution margin before converting these scale markers into revenue.
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM005"
      - "CM007"
