figures:
  - id: "FM001"
    title: "Non-additive market scale anchors"
    type: "pyramid"
    summary: >-
      Public population measures narrow from Medicare eligibility to accountable-care
      participation and company-reported reach, but do not form a revenue TAM funnel.
    data:
      nodes:
        - label: "Medicare beneficiaries with Parts A and B"
          value: 64.2
          unit: "million"
          detail: "KFF denominator for Medicare Advantage eligibility, March 2026"
        - label: "Medicare Advantage enrollment"
          value: 35.2
          unit: "million"
          detail: "55% of eligible beneficiaries; adjacent payer channel"
        - label: "Medicare ACO-coordinated care"
          value: 14.3
          unit: "million"
          detail: "MSSP and other CMS accountable-care models, January 2026"
        - label: "MSSP assigned beneficiaries"
          value: 12.6
          unit: "million"
          detail: "Traditional Medicare beneficiaries in 511 MSSP ACOs, 2026"
        - label: "Aledade value-based-care patients"
          value: 3
          unit: "million+"
          detail: "All disclosed programs, company-issued February 2026 figure"
        - label: "Aledade Medicare patients"
          value: 3
          unit: "nearly million"
          detail: "Company-issued December 2025 figure; different vintage and scope"
    approximationNotes: >-
      Values are source-reported and rounded as published. The layers use different,
      partly overlapping populations and dates; widths are contextual scale anchors,
      not additive TAM/SAM/SOM or conversion rates.
    claimRefs:
