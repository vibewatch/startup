callouts:
  - calloutType: risk
    title: Private resolution is not a complete regulatory release
    body: >-
      The 2025 judgment resolved the private parties' claims and counterclaims, but expressly did not
      affect the prior without-prejudice dismissal of the United States' False Claims Act claims.
      Diligence should confirm residual exposure rather than infer either an active claim or a full release.
    claimRefs: [CR001, CR016]
