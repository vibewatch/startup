company:
  name: Aledade
chapter:
  number: 7
  title: Risks
  summary: >-
    Aledade's most material public-evidence risks are Medicare coding and policy exposure, dependence
    on payer and partner data, and execution across a large distributed practice network. A resolved
    private lawsuit narrows one legal uncertainty, but the judgment expressly leaves prior
    without-prejudice treatment of United States False Claims Act claims unaffected, while current
    security controls, concentration, insurance, and financing covenants remain private-evidence gaps.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture and investment implications
    body: >-
      The highest residual risk is coding and program-integrity exposure. Independent reporting
      documented allegations that Aledade's software and guidance encouraged unsupported diagnoses;
      Aledade denied those allegations. The private action later ended in a $300,000 judgment and
      dismissal of the parties' claims and counterclaims with prejudice, but the judgment states that
      it did not affect the earlier dismissal without prejudice of the United States' False Claims Act
      claims. That is not evidence of a current government claim, yet it prevents treating the private
      resolution as a complete regulatory release. Medicare-policy exposure ranks next because the
      business operates at meaningful MSSP scale while 2026 rules shorten the upside-only runway and
      alter quality scoring. Operational exposure is lower in immediate severity but broad in reach:
      public evidence shows useful program-level mitigations, not enterprise-wide control testing.
      Investment approval should therefore require legal, compliance, security, insurance, and
      covenant evidence rather than rely on the absence of another publicly recorded incident.
    claimRefs: [CR001, CR002, CR003, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Medicare rules are both the demand engine and the principal external control surface. CMS's TEAM
      model is mandatory in selected geographies for 2026 through 2030, permits beneficiaries to be in
      both TEAM and ACO initiatives, and requires participating hospitals to refer patients to primary
      care. This creates coordination opportunity but also more interfaces, attribution questions, and
      accountability across organizations. Separately, the AMA reports that CMS will reduce the
      maximum upside-only MSSP period from seven to five years for agreement periods beginning in 2027
      and removed the health-equity adjustment from ACO quality scores beginning with performance year
      2025. These are enacted policy changes, not company-specific failures, but their economics should
      be modeled against Aledade's actual contract cohorts. The legal diligence path is similarly
      concrete: reconcile the 2025 judgment, any government reservation, coding-audit results, and
      insurance coverage before underwriting residual exposure.
    claimRefs: [CR001, CR004, CR005, CR007, CR008, CR016]
    tableRefs: [TR001]
  - id: operational-quality-security
    title: Operational, quality, and security risk
    body: >-
      A supplier case study demonstrates both a control weakness and a mitigation pattern. Aledade
      reported reliance on payer claims that lagged by two to three months; a pilot used pharmacy
      history data to reduce false-positive medication-adherence outreach by 585 of 2,235 identified
      opportunities. The same case study says the pilot initially required a three-person team and
      manual integration work, showing that data quality can be improved but may introduce supplier,
      workflow, and scaling dependencies. Those historical results should not be generalized to the
      current network without fresh control evidence. None of the retained sources provides
      enterprise-wide proof of security testing, incident response, data-reconciliation coverage,
      recovery objectives, or third-party risk controls. These are gaps, not evidence of a breach.
      A material control deficiency, sustained data latency, or inability to reconcile payer and
      clinical records should be a thesis-break trigger.
    claimRefs: [CR011, CR012, CR013, CR015]
    tableRefs: [TR002]
  - id: partner-model-exposure
    title: Partner, network, and financial-model dependencies
    body: >-
      The model depends on counterparties at several layers: CMS and commercial payers define economic
      rules, independent practices execute workflows, and data suppliers improve the timeliness and
      accuracy of interventions. Aledade says it serves more than 3,000 primary-care partners and more
      than 3 million patients, and nearly 20% of the total MSSP. Those company-issued figures indicate
      reach, not verified concentration or retention. An older partner-hosted promotional page stated
      that 90% of revenue came from helping practices achieve shared savings, but no retained current
      source provides audited revenue mix, payer concentration, contract duration, downside-risk
      exposure, or practice churn. Meanwhile, third-party analysis of TEAM projects losses for many
      mandatory hospital participants under current criteria, illustrating how policy design can
      redistribute economics even when value-based care demand persists. Underwriting should require
      cohort-level economics and counterparty concentration before crediting scale as resilience.
    claimRefs: [CR004, CR005, CR006, CR009, CR010, CR011, CR014]
    tableRefs: [TR003]
