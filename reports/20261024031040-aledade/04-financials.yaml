chapter:
  number: 4
  title: Financials
  summary: Aledade's disclosed economics are a performance-linked shared-savings model with meaningful scale, but public evidence is insufficient to underwrite realized revenue quality, margins, cash burn, or debt capacity. The strongest current signals are network growth, reported savings, and a new secured facility whose stated purpose is to bridge timing between care delivery and Medicare payments.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Aledade's older partner-facing description says 90% of revenue came from helping practices achieve shared savings, while Multiples labels the model "subscription" without publishing a price, unit, or revenue mix. The company also provides analytics, guided workflows, regulatory expertise, payer relationships, and care solutions. Current disclosures show exposure across MSSP, Medicare Advantage, Medicaid, and commercial contracts, but do not disclose the split between recurring technology fees, shared-savings participation, care-delivery revenue, or other streams. Revenue should therefore be treated as outcome-dependent and timing-sensitive rather than equated with ARR.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-gaps
    title: Public traction versus private financial gaps
    body: >-
      Public operating indicators show substantial scale: Aledade says it supports more than 3,000 primary-care partners and over 3 million patients in 2026, while a 2023 independent trade report cited $475 million of 2022 revenue and more than 50% growth. A 2022 Elevance partnership also exposed affiliated-plan providers in networks serving 47 million members to Aledade's offering, illustrating a payer-channel GTM route rather than its economics. These figures use different periods and denominators, and company savings figures are not Aledade revenue. The record still lacks audited revenue mix, gross margin, CAC or payback, retention, concentration, cash flow, and net debt.
    claimRefs: [CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: cost-structure-and-risk
    title: Cost structure, working capital, and policy exposure
    body: >-
      Aledade's delivery model requires technology, regulatory expertise, local support, clinical interfaces, and shared-savings distributions to physician partners. Its CMS comments identify data-access fees and reporting burdens as material ACO costs, including an example where vendor fees could consume 20% of MSSP revenue for an ACO with extensive specialty participation. A joint lender announcement says Medicare payment timing creates a working-capital gap, while Aledade separately cautions that shared savings are not guaranteed. Risk-based arrangements can require downside payments when spending rises, and KFF's 2026 Medicare Advantage analysis highlights payment scrutiny around the segment. No source establishes Aledade's own burn or gross margin.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
  - id: capital-adequacy-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Aledade announced a $500 million senior secured Ares facility with capacity to expand to $650 million and said it doubles committed financing capacity; the stated use is working-capital flexibility, including bridging Medicare-payment timing and accelerating partner distributions. This is financing capacity, not cash on hand, and the public materials do not state drawn balance, interest cost, covenants, maturity, collateral, or runway. Historical funding and valuation markers provide context but do not prove current liquidity. The financial case is attractive on operating scale and policy tailwinds, yet underwriting should remain research-more until unit economics, cash conversion, debt terms, and contract-level concentration are disclosed.
    claimRefs: [CI009, CI014, CI015, CI017]
