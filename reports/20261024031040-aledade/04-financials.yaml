      - [Revenue growth, ">50% in 2022", medium, "Indicates historical expansion; denominator and recurring mix need review", "Reconcile organic growth, acquisitions, and contract timing"]
      - [Gross margin, null, low, "Service delivery and partner distributions may materially affect margin", "Provide gross margin by program and care solution"]
      - [Cash burn, null, low, "No public cash-flow statement or runway", "Provide monthly cash flow and minimum liquidity policy"]
      - [CAC/payback, null, low, "Network growth may require local support and implementation spend", "Provide acquisition cost and payback by practice cohort"]
      - [Net revenue retention, null, low, "Practice and payer retention determine durability", "Provide GRR, NRR, churn, and contract renewal data"]
      - [Debt draw and cost, null, low, "A $500M facility is capacity, not cash available", "Provide drawn amount, rate, covenants, maturity, and collateral"]
      - [Savings conversion, "93% of ACOs achieved shared savings in 2024 MSSP", medium, "Operating success supports the model but does not equal Aledade margin", "Reconcile savings to distributions and company revenue"]
    notes: "The table separates company-reported operating outcomes from unavailable financial inputs. Null values require the stated diligence request and must not be interpreted as zero."
    claimRefs: [CI005, CI006, CI007, CI008, CI014, CI015, CI017]
