company:
  name: Aledade
chapter:
  number: 6
  title: Customers
  summary: Aledade reports more than 3,000 primary care partners caring for over 3 million patients in 2026, supported by payer-channel relationships and a long historical expansion record. Public evidence still does not disclose retention, contract duration, customer economics, or Aledade-specific payer and practice concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying model
    body: >-
      Aledade's disclosed customer base centers on independent primary care organizations:
      practices, clinics, community health centers, and systems entering value-based
      contracts without selling their practices to the platform. The clinician and care
      team are the daily users, while Medicare programs, Medicare Advantage plans,
      Medicaid programs, and commercial payers fund the underlying care arrangements.
      Aledade reported more than 370 community health centers in its 2026 network and said
      more than 60% of partner practices were in federally designated health professional
      shortage areas, indicating meaningful safety-net penetration. A historical Ohio
      Academy of Family Physicians promotional article said 90% of Aledade's revenue came
      from helping practices achieve shared savings. That issuer relationship makes the
      statement directional rather than independently verified, but it clarifies that
      customer value and Aledade's monetization have been linked to care-cost performance.
    claimRefs: [CU001, CU002, CU003, CU009]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and operating proof
    body: >-
      The strongest current adoption marker is Aledade's February 2026 announcement that
      it added more than 700 primary care organizations for the performance year, bringing
      the network to more than 3,000 partners and over 3 million patients. Aledade also
      said it served one in five new Medicare Shared Savings Program participants and
      nearly 20% of the total program. The trajectory is directionally consistent with
      earlier snapshots: an independent 2016 article described 400 physicians across 11
      states; Elevance and Baidu materials described more than 1,000 practices and 1.7
      million patient lives in 2022; and Fierce Healthcare reported more than 1,500
      practices and over 2 million patients in 2023. These vintages use different units
      and issuers, so they demonstrate expansion but do not form a clean retention cohort
      or a like-for-like annual customer series.
    claimRefs: [CU001, CU002, CU004, CU005, CU010, CU011, CU012]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: production-and-channel-proof
    title: Production outcomes and named channel proof
    body: >-
      Aledade's reported outcomes indicate operating activity beyond a logo list. It said
      93% of its accountable care organizations achieved savings in the most recent MSSP
      performance year and that those organizations generated more than $1 billion in
      total savings; it separately reported more than 800,000 annual wellness visits by
      MSSP partners in 2024. These are company-issued program metrics rather than audited
      customer retention measures, and the relevant denominators and distribution across
      practices are not public. Named commercial evidence is primarily channel evidence:
      Elevance announced access to Aledade technology and local services for independent
      providers in affiliated-plan networks, while Fierce Healthcare reported partnerships
      with Humana, CareFirst BlueCross BlueShield, and Cigna. The disclosures establish
      routes to production adoption, but they do not reveal conversion, active deployment,
      renewal, exclusivity, or customer-level economics.
    claimRefs: [CU006, CU007, CU008, CU013, CU014]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration risks
    body: >-
      Publicly disclosed scale should not be read as retention. The assigned evidence does
      not provide NRR, GRR, churn, renewal rates, contract duration, average customer value,
      or top-payer, top-practice, top-region, and top-customer concentration. The external
      market is large: Becker's reported 511 MSSP ACOs serving 12.6 million traditional
      Medicare beneficiaries in 2026. It is also concentrated in an adjacent payer channel:
      KFF found that UnitedHealth Group and Humana together represented 46% of nationwide
      Medicare Advantage enrollment in 2026. That statistic is not Aledade-specific
      concentration, but it illustrates why payer-level exposure and contract dependency
      must be tested rather than inferred from the broad practice count. Diligence should
      reconcile signed, live, renewed, expanded, and terminated practices to revenue,
      shared-savings receipts, and attributed patients by payer and cohort.
    claimRefs: [CU015, CU016]
