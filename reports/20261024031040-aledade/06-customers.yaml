figures:
  - id: FU001
    title: Customer journey from practice entry to expansion
    type: journey-map
    summary: Disclosed touchpoints connect practice recruitment to value-based workflows and savings, while the renewal and concentration stages remain opaque.
    data:
      items:
        - label: "Practice entry"
          title: "Practice entry"
          detail: "Independent practices, clinics, community health centers, and systems enter an ACO or value-based contract."
          touchpoints: ["Payer or MSSP channel", "Contracting support"]
        - label: "Workflow enablement"
          title: "Workflow enablement"
          detail: "Care teams receive analytics, guided workflows, policy expertise, and local support."
          touchpoints: ["Data and workflows", "Practice coaching"]
        - label: "Population management"
          title: "Population management"
          detail: "Teams conduct prevention, chronic-care management, outreach, and follow-up."
          touchpoints: ["Annual wellness visits", "Screenings and medication refills"]
        - label: "Performance measurement"
          title: "Performance measurement"
          detail: "ACO quality and total-cost performance determine whether shared savings are earned."
          touchpoints: ["MSSP results", "Shared savings are not guaranteed"]
        - label: "Channel expansion"
          title: "Channel expansion"
          detail: "Payer relationships and program participation create routes to additional practices."
          touchpoints: ["Elevance, Humana, CareFirst, and Cigna", "New MSSP participants"]
        - label: "Durability test"
          title: "Durability test"
          detail: "Renewal, churn, cohort expansion, contract duration, and concentration are not publicly disclosed."
          touchpoints: ["Retention diligence", "Payer and practice concentration"]
    approximationNotes: "This is an analytical sequence of disclosed touchpoints, not a conversion funnel or evidence that every practice follows the same path."
    claimRefs: [CU005, CU006, CU008, CU009, CU013, CU014]
callouts:
  - calloutType: strength
    title: Broad current reach
    body: Aledade reports more than 3,000 primary care partners, over 3 million patients, and more than 370 community health centers for the 2026 performance year.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Adjacent payer concentration requires direct testing
    body: KFF's 46% combined Medicare Advantage enrollment share for UnitedHealth Group and Humana is market context, not Aledade-specific exposure; the company's own payer concentration remains undisclosed.
    claimRefs: [CU015]
