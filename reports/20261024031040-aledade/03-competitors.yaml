chapter:
  number: 3
  title: Competitors
  summary: Aledade competes by combining physician-led ACO infrastructure, data-driven workflow support, payer relationships, and local services for independent primary care. Its distribution and contract footprint are substantial, but the retained public evidence is much thinner on competitor pricing, switching friction, and like-for-like performance than on Aledade's own scale claims.
sections:
  - id: landscape
    title: Landscape and competitive set
    body: >-
      The relevant competitive set is broader than software vendors. Aledade is
      positioned against health-system-led ACOs, payer-led enablement, other
      physician-aggregation platforms, internal practice builds, and the
      fee-for-service status quo. CMS reported 511 Shared Savings Program ACOs
      serving 12.6 million traditional Medicare beneficiaries in 2026, so the
      policy infrastructure is a large platform on which multiple operating
      models can compete. Aledade's 2026 company announcement says it served
      more than 3,000 primary care partners and nearly 20% of total MSSP; those
      figures are company-issued and should not be read as independent market
      share verification. The competitor profile below therefore separates
      named counterparties from structural alternatives and marks missing
      public data rather than filling it with assumptions.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability
    title: Capability, distribution, and trust
    body: >-
      Aledade's stated differentiation is an integrated operating model rather
      than a single application: analytics, guided workflows, regulatory
      expertise, payer relationships, and local support. An Ohio Academy of
      Family Physicians article describes the offer as data analytics, guided
      workflows, regulatory expertise, payer relationships, and hands-on local
      support, while the Elevance partnership shows a distribution route into
      independent practices in plans serving 47 million members. Aledade's own
      materials also emphasize that it does not own or manage practices and that
      partners retain clinical and operational autonomy. These are meaningful
      buying criteria for independent physicians, but the sources do not
      provide a controlled comparison of implementation time, product
      performance, or retention against competitors. The matrix consequently
      uses unknown where the pool does not support a fair comparison.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: economics
    title: Pricing, packaging, and switching
    body: >-
      Public evidence does not disclose a comparable list price or realized
      take-rate for Aledade, Elevance's arrangement, health-system programs, or
      internal builds. The older Ohio physician-facing description says 90% of
      Aledade revenue came from helping practices achieve shared savings, but
      that is a historical company-facing statement rather than a current
      audited revenue mix. It does clarify the economic design: the platform
      participates in outcome-linked upside instead of charging a transparent
      per-seat price. The resulting switching cost is likely operational and
      contractual—data integration, workflows, ACO participation, payer
      relationships, and practice trust—but the retained sources do not
      quantify migration cost, exclusivity, contract duration, or multi-homing.
      Those gaps matter because a broad network can be a moat only if partners
      stay, savings are repeatable, and competing channels cannot reproduce the
      service bundle.
    claimRefs: [CP009, CP010, CP011]
    tableRefs: [TP003]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      Aledade has evidence of scale and partner distribution, but durability
      remains conditional. Fierce Healthcare reported that the company used
      financing and acquisitions to add capabilities and described its
      differentiation as growth, multi-payer contracting, and repeatable
      savings; that is third-party reporting of management's position, not a
      benchmark. The company's 2026 release reports that 93% of its ACOs
      achieved savings in the most recent MSSP performance year and that more
      than $1 billion in savings was generated, while CMS independently reports
      $4.1 billion of total MSSP shared savings in performance year 2024. The
      figures use different populations and issuers, so they cannot establish a
      relative win rate. The principal displacement risks are payer or health
      system ownership of distribution, direct internal analytics investment,
      regulatory redesign, and commoditization of workflow tooling. No retained
      source supplies competitor churn, pricing pressure, or a failed Aledade
      deployment; these remain explicit diligence gaps rather than negative
      conclusions.
    claimRefs: [CP012, CP013, CP014]
callouts:
  - calloutType: strength
    title: Distribution is the clearest moat signal
    body: Aledade's reported 3,000-plus partner footprint, broad geography, and payer relationships create a distribution advantage that a point-solution vendor would need time and trust to replicate.
    claimRefs: [CP001, CP006]
  - calloutType: risk
    title: Comparative evidence is incomplete
    body: The retained pool supports Aledade's own scale and operating claims but does not establish competitor pricing, retention, implementation cost, or relative savings; underwriting should not convert the apparent footprint into a proven durable moat.
    claimRefs: [CP008, CP011, CP014]
