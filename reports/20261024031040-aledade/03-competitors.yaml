      topic: pricing-model
      missingEvidence: "Current contracts, list or realized pricing, take-rate, term, exclusivity, and implementation-cost data for Aledade and named alternatives."
      whyItMatters: "Without comparable economics, the apparent network moat cannot be translated into switching cost or durable margin power."
      diligencePath: "Request anonymized contract summaries, cohort retention, implementation timelines, and competitor bids from management and several practices."
      relatedQuestionRefs: [QP005, QP006]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: competitive-evidence
      missingEvidence: "Independent, like-for-like outcomes and retention comparisons across physician-led platforms, payer programs, health-system ACOs, and internal builds."
      whyItMatters: "Aledade's company-reported savings and scale do not by themselves demonstrate relative performance or displacement resistance."
