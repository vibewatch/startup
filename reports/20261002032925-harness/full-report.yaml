    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Scale, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Harness describes itself as an Autonomous SDLC platform for the work that follows code creation: building,
              testing, securing, deploying, governing, and managing the cost of software. Its official company page says
              the business launched in San Francisco in 2017, while an independent company profile likewise identifies a
              2017 founding and San Francisco headquarters. The product is sold as an enterprise software platform
              rather than as services or infrastructure ownership: modules and AI agents coordinate software-delivery
              workflows through policy controls and a shared knowledge graph. The company currently reports 1,200+
              employees and 1,000+ enterprise customers, but those figures remain company-originated even when repeated
              by third-party profiles.
