  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Autonomous SDLC Platform Architecture and Core Agent Modules
        blocks:
          - type: paragraph
            body: >
              Harness defines its offering as the Autonomous SDLC Platform designed to apply artificial intelligence to
              software delivery workflows occurring after code generation. The platform architecture integrates four
              primary specialized agent modules around a shared SDLC Knowledge Graph that continuously observes pipeline
              activity, incident telemetry, and cloud cost events. The Software Delivery Agent automates pipelines from
              source commit to production environments, deploying application artifacts, agent definitions, database
              schemas, and cloud infrastructure across multi-cloud environments.


              Complementing pipeline delivery, the Security Testing Agent provides security orchestration, AI-assisted
              static application security testing (SAST), software composition analysis (SCA), and supply chain security
              controls designed to verify artifact integrity and policy conformance. The Runtime Protection Agent
              monitors APIs and running agent workloads to detect request abuse, analyze security posture, and enforce
              firewall policies at runtime. The Cost Management Agent traces cloud infrastructure and AI token
              expenditures back to individual development teams and pull requests, automating the termination of idle
              resources via AutoStopping mechanisms.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Governance Model, Autonomous Control Levels, and Compliance Controls
        blocks:
          - type: paragraph
            body: >
              Enterprise deployment of automated agents across software delivery pipelines introduces substantial
              governance and risk management demands. Harness addresses pipeline risk through a three-tier execution
              model that allows enterprise engineering organizations to dial autonomy up or down according to
              environment blast radius. Under Level 1 autonomy, agents operate with zero runtime discretion, executing
              only predefined and static procedural pipeline steps. Under Level 2 autonomy, specialized agents propose
              pipeline configurations and actions but mandate explicit human-in-the-loop sign-off before production
              changes are applied. Under Level 3 autonomy, agents execute pipeline optimizations autonomously within
              strict organizational boundaries.


              The platform enforces these boundaries through Open Policy Agent (OPA) policy-as-code guardrails,
              comprehensive audit logging of all automated decisions, and role-based access control (RBAC) integrated
              into enterprise directory services. Compliance coverage spans SOC 2 Type II, ISO 27001, GDPR, DORA, and
              NIS2 operational frameworks. Real-world enterprise case studies demonstrate that governed template
              automation significantly reduces pipeline proliferation; for example, Morningstar consolidated 36,000
              legacy scripted pipelines into 50 standardized templates, while United Airlines transitioned thousands of
              custom pipelines to 20 governed templates.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE008
              - CE009
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
      - number: '5.3'
        title: Technical Differentiation, Developer Signal, and Practitioner Scaffolding
        blocks:
          - type: paragraph
            body: >
              Technical differentiation for Harness centers on its shared Software Delivery Knowledge Graph and
              end-to-end integration across delivery, testing, security, and financial operations. Rather than managing
              isolated point tools, enterprise customers leverage contextual telemetry across modules to optimize build
              runtimes, reduce test flakiness, and eliminate cloud waste. Enterprise scale metrics reported by the
              company include handling over 5.7 million monthly deployments, evaluating 1.5 trillion feature flags per
              month, and protecting more than 250 billion API calls monthly.


              In the broader software engineering ecosystem, the term 'harness engineering' has emerged as an
              industry-wide discipline defining how developer teams construct environments, scaffolding, verification
              loops, and context layers for autonomous coding agents. While industry research from firms such as the
              Software Improvement Group (SIG) and Jama Software highlights that 54% of enterprises actively deploy AI
              agents, over 50% of practitioners report heightened vulnerability and code quality concerns when
              governance lags code generation velocity. This macro paradigm validates the market necessity of post-code
              governance platforms, though it also challenges vendors to distinguish commercial orchestration products
              from in-repo developer scaffolding.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The AI Velocity Paradox and Post-Code Bottlenecks
            body: >-
              Harness identifies an industry 'AI Velocity Paradox' where generative AI tools accelerate code creation
              but intensify downstream delivery bottlenecks. With 60-70% of engineering effort dedicated to testing,
              deployment, security, and compliance, raw code generation velocity creates acute pipeline backpressure
              that only autonomous delivery systems can resolve.
            calloutType: insight
            claimRefs:
              - CE012
              - CE014
          - type: callout
            title: SaaS Control Plane Governance vs. In-Repo Developer Scaffolding
            body: >-
              As developer harness engineering practices mature with standardized repository specifications such as
              AGENTS.md, Model Context Protocol (MCP), and local linters, enterprise platform vendors must continuously
              validate that centralized SaaS governance provides defensible value beyond native in-repo developer tools.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Customer Segmentation & Target Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Harness targets large-scale enterprise engineering organizations operating hybrid and multi-cloud software
              delivery environments. The commercial model bifurcates between technical buyers—such as Platform
              Engineering Leads, Vice Presidents of Engineering, and Chief Information Officers—and daily practitioners
              who operate CI/CD pipelines, feature flags, and infrastructure-as-code automation. Documented enterprise
              deployments span critical global verticals: financial services (National Australia Bank, Morningstar),
              commercial aviation and hospitality (United Airlines, Choice Hotels), real estate platforms (Keller
              Williams), and human capital software (Workday). These enterprise customers adopt Harness to replace
              fragmented, script-heavy deployment setups with policy-driven, automated delivery pipelines. While
              enterprise logos demonstrate high brand recognition, enterprise adoption remains heavily concentrated
              among organizations with sophisticated Kubernetes architectures, creating procurement hurdles for
              mid-market engineering teams that lack dedicated platform teams.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption Trajectory & Workload Scale Across Enterprise Deployments
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption at Harness has scaled dramatically from early continuous delivery automation into full
              software delivery lifecycle governance. The platform orchestrates more than 185 million deployments
              annually and runs over 5.7 million monthly pipeline executions, alongside 1.5 trillion feature flag
              evaluations per month and 250 billion API calls protected. Growth in customer accounts has kept pace with
              platform maturity, expanding from hundreds of enterprise customers in 2022 to over 1,000 enterprise
              organizations across North America, EMEA, and APAC by 2026. Annual recurring revenue surpassed $250
              million at the end of 2025, representing more than 50% year-over-year expansion supported by 128
              quota-carrying sales representatives. Nevertheless, Harness does not report standardized usage metrics
              such as daily active developers or workload utilization per seat, preventing external auditors from
              confirming what proportion of the 1,000 enterprise accounts represent company-wide standardizations versus
              isolated business-unit pilots.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named Customer Proof, Retention Dynamics & Expansion Blockers
        blocks:
          - type: paragraph
            body: >-
              Production outcomes among prominent enterprise accounts demonstrate measurable velocity gains, including
              deployment acceleration of up to 70% to 75% at United Airlines and Morningstar, along with 50% reductions
              in change failure rates and up to 60% cloud infrastructure cost savings via Cloud Cost Management.
              Furthermore, enterprise customers have adopted new AI governance and engineering insights modules to
              connect developer token spend to production delivery outcomes. Despite these positive case studies,
              customer sentiment analysis reveals notable adverse friction in platform expansion. Independent reviews
              and competitor benchmarks highlight that Harness's interface suffers from navigation clutter, rigid
              out-of-the-box dashboards, and an onboarding learning curve that leaves teams struggling with
              troubleshooting integrations. Most critically, Harness has never published audited Net Revenue Retention
              (NRR) or Gross Revenue Retention (GRR) figures, leaving expansion durability and gross churn rates
              unverified.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU009
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Opaque Retention Metrics and Enterprise Expansion Risk
            body: >-
              While Harness boasts over 1,000 enterprise customers and more than $250 million in ARR, the complete
              absence of disclosed Net Revenue Retention (NRR) or Gross Revenue Retention (GRR) metrics represents a
              material diligence concern. Without verified retention cohorts, investors cannot determine whether revenue
              growth is fueled by durable land-and-expand compounding or masked by high customer churn offset by new
              acquisition.
            calloutType: risk
            claimRefs:
              - CU004
              - CU007
              - CU013
          - type: callout
            title: AI Governance as the New Enterprise Expansion Wedge
            body: >-
              With the commercial introduction of AI DLC Insights and Cloud & AI Cost Management, Harness is positioning
              itself to capture growing enterprise budgets dedicated to developer AI governance. By tracing developer
              token spend from coding assistants directly to shipped pull requests and production deployments, Harness
              addresses the emerging 'AI Velocity Paradox' where enterprises demand measurable ROI from soaring AI
              software expenditures.
            calloutType: insight
            claimRefs:
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Compliance, and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Enterprise software delivery platforms operating within strictly regulated verticals must satisfy
              comprehensive governance, compliance, and data sovereignty mandates. For Harness, expanding its enterprise
              footprint across financial services, healthcare, and federal public-sector institutions creates acute
              compliance dependencies. A primary commercial hurdle is the verification of public-sector certifications:
              without confirmed FedRAMP marketplace authorization, Harness remains functionally locked out of sensitive
              US federal agency procurements, constraining its public-sector total addressable market [CR001].
              Furthermore, modern regulatory regimes governing AI-enabled systems increasingly target automated code
              generation and agentic deployment pipelines. As Harness deploys specialized AI agents to automate software
              delivery and security testing, the platform must guarantee deterministic policy enforcement and
              auditability [CR002]. Failure to prove complete mediation and policy compliance creates legal and
              regulatory liabilities under emerging algorithmic governance frameworks, particularly when pipelines
              process sensitive corporate intellectual property [CR003].
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: Operational Reliability, Quality, and Agent Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Operational reliability is paramount for CI/CD infrastructure, where unexpected outages or flawed
              deployments directly halt engineering productivity and compromise production environments. As software
              delivery platforms evolve from static script execution into agentic runtimes, operational risk shifts from
              pipeline configuration errors to nondeterministic AI behavior [CR004]. Independent industry analyses
              emphasize that an AI agent harness must maintain strict state boundaries, enforce tool sandboxing, and
              capture telemetry to prevent unauthorized actions in production environments [CR005, CR006]. While Harness
              claims platform scale protecting over 250 billion API calls monthly and running security testing agents to
              catch vulnerabilities [CR007], any failure in automated rollback mechanisms or agent guardrails introduces
              severe blast-radius risks [CR008]. Mitigating these operational failure modes requires continuous
              harness-level observability and rigorous deterministic execution policies [CR009].
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
