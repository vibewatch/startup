  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Taxonomic Disambiguation
        blocks:
          - type: paragraph
            body: >-
              Defining the addressable market for Harness requires rigorous taxonomic separation between physical
              hardware manufacturing and enterprise cloud software delivery. Automated keyword discovery frequently
              conflates 'wiring harness' manufacturing—an automotive electrical subsegment valued at $84.5B globally in
              2026 by Mordor Intelligence—with the software delivery platform developed by Harness Inc. In reality,
              Harness operates exclusively within enterprise software infrastructure, targeting the autonomous Software
              Delivery Lifecycle (SDLC). The included spend spans continuous integration (CI), continuous delivery (CD),
              cloud cost management (CCM), feature flag management, security testing orchestration (STO), chaos
              engineering, and AI-native developer pipeline agents. Excluded spend encompasses physical automotive wire
              looms, embedded hardware tooling, generic project management boards, and raw infrastructure cloud compute.
              Within the legitimate SDLC boundary, status-quo alternatives include fragmented point solutions such as
              Jenkins, Spinnaker, ArgoCD, and in-house custom scripting. As code generation accelerates through AI
              tooling, delivery pipelines encounter severe downstream testing and governance bottlenecks, defining
              Harness's core enterprise opportunity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and the Physical Versus Software Conflation
        blocks:
          - type: paragraph
            body: >-
              Evaluating market sizing for Harness exposes a stark methodological divergence between public query hits
              and software reality. External industry research firms size global automotive wiring harness assemblies
              between $49.73B and $90.40B for 2024-2026, with long-term forecasts reaching $137.17B by 2031 (Mordor
              Intelligence) and $204.65B by 2035 (Market Research Future). Additionally, MarketsandMarkets reports US
              automotive wiring harness market values of $244.3B in 2026. These physical manufacturing datasets, driven
              by high-voltage battery cables and zonal electronic architectures, represent a zero percent addressable
              opportunity for Harness Inc. Instead, Harness's true addressable market resides in enterprise DevOps and
              cloud software delivery platforms, estimated at $10B to $25B globally. Harness's serviceable obtainable
              market (SOM) is anchored by its proven commercial capture: exceeding $250M ARR at a $5.5B valuation across
              1,000+ enterprise accounts as of 2025. Preserving this contrast in diligence prevents fatal market-sizing
              errors and clarifies that Harness's valuation multiple rests on software ARR expansion rather than
              automotive components.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
