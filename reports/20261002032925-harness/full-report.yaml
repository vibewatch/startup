        title: Exhibits
        blocks:
          - type: callout
            title: Platform Consolidation and Commodity Infrastructure Encroachment
            body: >-
              Enterprise IT buyers increasingly favor vendor consolidation into comprehensive developer suites like
              GitHub and GitLab. If native suites close the verification and autonomous delivery gap, standalone
              continuous delivery vendors risk margin compression and displacement.
            calloutType: risk
            claimRefs:
              - CP001
              - CP009
              - CP013
          - type: callout
            title: Execution Harness Layer as Key Architectural Battleground
            body: >-
              In emerging AI software engineering architectures, the orchestration harness governing context, execution,
