      - number: '3.2'
        title: Competitor Profiles, Scale, and Structural Trade-offs
        blocks:
          - type: paragraph
            body: >-
              Enterprise software delivery competitors diverge significantly in capital scale, distribution velocity,
              deployment scope, and architectural focus. Incumbents like GitLab and GitHub bundle source control,
              continuous integration, and delivery into unified seats, forcing standalone orchestration vendors to prove
              substantial operational ROI and security advantages. Conversely, legacy open-source engines like Jenkins
              offer zero software licensing fees but incur steep internal engineering maintenance and infrastructure
              overhead. Specialized platforms must continuously justify third-party integration overhead against
              consolidated all-in-one developer ecosystems. Furthermore, empirical research in agent execution
              architectures reveals that infrastructure harnesses governing context construction, tool mediation, and
              verification create substantial performance variance and ranking shifts, reinforcing that execution layers
              rather than underlying models represent critical enterprise software leverage points.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Pricing Dynamics, Lock-In, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging across the continuous delivery sector reflect distinct monetization motions, ranging
              from consumption-based compute and deployment metrics to per-user subscription tiers. Harness competes by
              emphasizing post-code automation, pipeline governance, and cloud cost management, targeting complex
              multi-cloud enterprises that multi-home across heterogeneous infrastructure. However, vendor lock-in
              remains constrained by GitOps standards and declarative pipeline specifications, making switching costs
              variable across organizations. Disconfirming market dynamics include aggressive price bundling by
              hyperscalers, customer reluctance to add independent orchestration layers during IT budget consolidation,
              and external execution harness variance where small infrastructure changes alter long-horizon workflow
              reliability. Defending enterprise expansion requires demonstrating measurable reduction in change failure
              rates and verified verification governance.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
