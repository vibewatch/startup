  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Enterprise Delivery Landscape and Alternative Paradigms
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for Harness spans legacy continuous delivery suites, integrated developer
              platforms, cloud service provider native toolchains, and internal platform engineering builds. While
              Harness positions itself as an Autonomous SDLC Platform providing AI for everything after code, enterprise
              buyers evaluate it directly against comprehensive developer suites like GitLab and GitHub Actions, legacy
              automation engines such as Jenkins, and hyperscaler delivery pipelines across AWS and Azure. Crucially,
              the software delivery lifecycle is undergoing structural evolution toward agentic execution, where
              orchestration, context mediation, and output verification become the primary operational constraints. This
              transition creates both an opportunity for Harness to govern AI-generated code delivery and a risk that
              commoditized workflow execution layers displace specialized third-party delivery pipelines.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
