  title: "Product & Technology"
  summary: "Harness operates an enterprise software delivery and autonomous SDLC platform that combines automated CI/CD pipelines, security testing orchestration, API runtime protection, and cloud cost management under a shared Knowledge Graph architecture. While Harness provides multi-level autonomous agent governance with OPA policy guardrails, the emerging broader discipline of agent harness engineering creates both architectural tailwinds and execution challenges for enterprise platform boundaries."
sections:
  - id: "platform-overview-and-core-agents"
    title: "Autonomous SDLC Platform Architecture and Core Agent Modules"
    body: |
      Harness defines its offering as the Autonomous SDLC Platform designed to apply artificial intelligence to software delivery workflows occurring after code generation. The platform architecture integrates four primary specialized agent modules around a shared SDLC Knowledge Graph that continuously observes pipeline activity, incident telemetry, and cloud cost events. The Software Delivery Agent automates pipelines from source commit to production environments, deploying application artifacts, agent definitions, database schemas, and cloud infrastructure across multi-cloud environments.

      Complementing pipeline delivery, the Security Testing Agent provides security orchestration, AI-assisted static application security testing (SAST), software composition analysis (SCA), and supply chain security controls designed to verify artifact integrity and policy conformance. The Runtime Protection Agent monitors APIs and running agent workloads to detect request abuse, analyze security posture, and enforce firewall policies at runtime. The Cost Management Agent traces cloud infrastructure and AI token expenditures back to individual development teams and pull requests, automating the termination of idle resources via AutoStopping mechanisms.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
  - id: "governance-policy-and-operating-model"
    title: "Governance Model, Autonomous Control Levels, and Compliance Controls"
    body: |
      Enterprise deployment of automated agents across software delivery pipelines introduces substantial governance and risk management demands. Harness addresses pipeline risk through a three-tier execution model that allows enterprise engineering organizations to dial autonomy up or down according to environment blast radius. Under Level 1 autonomy, agents operate with zero runtime discretion, executing only predefined and static procedural pipeline steps. Under Level 2 autonomy, specialized agents propose pipeline configurations and actions but mandate explicit human-in-the-loop sign-off before production changes are applied. Under Level 3 autonomy, agents execute pipeline optimizations autonomously within strict organizational boundaries.

      The platform enforces these boundaries through Open Policy Agent (OPA) policy-as-code guardrails, comprehensive audit logging of all automated decisions, and role-based access control (RBAC) integrated into enterprise directory services. Compliance coverage spans SOC 2 Type II, ISO 27001, GDPR, DORA, and NIS2 operational frameworks. Real-world enterprise case studies demonstrate that governed template automation significantly reduces pipeline proliferation; for example, Morningstar consolidated 36,000 legacy scripted pipelines into 50 standardized templates, while United Airlines transitioned thousands of custom pipelines to 20 governed templates.
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "technical-differentiation-and-industry-scaffolding"
    title: "Technical Differentiation, Developer Signal, and Practitioner Scaffolding"
    body: |
      Technical differentiation for Harness centers on its shared Software Delivery Knowledge Graph and end-to-end integration across delivery, testing, security, and financial operations. Rather than managing isolated point tools, enterprise customers leverage contextual telemetry across modules to optimize build runtimes, reduce test flakiness, and eliminate cloud waste. Enterprise scale metrics reported by the company include handling over 5.7 million monthly deployments, evaluating 1.5 trillion feature flags per month, and protecting more than 250 billion API calls monthly.

      In the broader software engineering ecosystem, the term 'harness engineering' has emerged as an industry-wide discipline defining how developer teams construct environments, scaffolding, verification loops, and context layers for autonomous coding agents. While industry research from firms such as the Software Improvement Group (SIG) and Jama Software highlights that 54% of enterprises actively deploy AI agents, over 50% of practitioners report heightened vulnerability and code quality concerns when governance lags code generation velocity. This macro paradigm validates the market necessity of post-code governance platforms, though it also challenges vendors to distinguish commercial orchestration products from in-repo developer scaffolding.
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
