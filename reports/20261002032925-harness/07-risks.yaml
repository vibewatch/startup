callouts:
  - calloutType: "risk"
    title: "Agent Nondeterminism in Mission-Critical Delivery Pipelines"
    body: "Deploying autonomous AI agents into CI/CD delivery pipelines introduces unprecedented failure modes. Unlike traditional deterministic bash scripts, agentic decisions depend on model reasoning and execution harnesses. Without rigorous runtime constraints, tool call sandboxing, and verifiable checkpointing, agent errors can corrupt production infrastructure or trigger accidental deployments [CR004, CR005, CR008]."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR008"
  - calloutType: "assumption"
    title: "Capital Structure and Margin Visibility Gaps"
    body: "At a $5.5B valuation supported by $250M in stated ARR, Harness commands an aggressive 22x ARR multiple. In the absence of audited financial statements confirming gross margins, cash burn rate, and net revenue retention (NRR), investor underwriting must assume high valuation vulnerability if top-line growth decelerates below 50% [CR010, CR011, CR012, CR015]."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR015"
