callouts:
  - calloutType: "insight"
    title: "The AI Velocity Paradox Drives Downstream Delivery Demand"
    body: "Enterprise adoption of AI code generation tools accelerates initial coding speed but intensifies downstream delivery bottlenecks. As engineering teams produce code faster, testing, deployment validation, security verification, and cloud cost controls become the gating constraints on time-to-market. Harness's autonomous SDLC positioning directly targets this 'after code' friction."
    claimRefs:
      - "CM003"
      - "CM004"
  - calloutType: "risk"
    title: "Market Boundary Conflation in Uncurated Diligence Pipelines"
    body: "Automated diligence pipelines face severe semantic collision when researching Harness due to the homonymic automotive wiring harness industry. Sizing estimates claiming an $84B+ to $204B+ market reflect physical copper looms, requiring investment committees to isolate pure-play software TAM/SAM boundaries."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM007"
      - "CM008"
