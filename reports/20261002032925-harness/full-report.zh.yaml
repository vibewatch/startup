      - number: '2.2'
        title: 市场规模测算视角与物理线束及软件的混淆
        blocks:
          - type: paragraph
            body: >-
              评估 Harness 的市场规模会暴露出公开搜索结果与软件真实情况之间的尖锐方法论脱节。外部行业研究机构测算 2024-2026 年全球汽车线束总成规模在 $49.73B 至 $90.40B 之间，长期预测显示
              2031 年将达到 $137.17B（Mordor Intelligence），2035 年将达到 $204.65B（Market Research Future）。此外，MarketsandMarkets 报告
              2026 年美国汽车线束市场规模为 $244.3B。这些受高压电池电缆与区域电子架构驱动的实体制造数据，为 Harness Inc. 带来的可寻址市场空间为零。相反，Harness 的真正潜在市场在于企业级
              DevOps 与云软件交付平台，全球预估在 $10B 至 $25B 之间。Harness 的可服务可获得市场（SOM）以其实际达成的商业规模为依托：截至 2025 年已在 1,000+ 家企业客户中实现超
              $250M ARR，对应估值为 $5.5B。尽调中明确这一反差可避免致命的市场规模测算偏差，并阐明 Harness 的估值倍数依托于软件 ARR 扩张，而非汽车零部件。
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
