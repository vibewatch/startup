  - id: FM001
    title: 企业市场规模测算视角与可触达边界
    type: pyramid
    summary: 概念市场规模金字塔，划分关键词相近的行业总体支出与软件 TAM、SAM 以及 Harness 实际商业捕获规模。
    data:
      items:
        - label: 美国汽车线束设备支出（2026 年为 $244.3B）
          value: 244300
          unit: USD M
          detail: MarketsandMarkets 发布的美国汽车线束估值；完全排除在外的硬件支出。
        - label: 全球汽车线束制造（2026 年为 $84.5B）
          value: 84500
          unit: USD M
          detail: Mordor Intelligence 测算的 2026 年全球汽车线束制造市场；软件完全无可触达市场机遇。
        - label: 全球汽车高压电动汽车线束细分市场（2026 年为 $14.3B）
          value: 14300
          unit: USD M
          detail: 测算的高压电动汽车线缆细分市场，在汽车制造领域以两位数的高复合增长率迅速扩张。
        - label: 企业级 DevOps 与自主 SDLC 软件 TAM（预估 $15,000M）
          value: 15000
          unit: USD M
          detail: 全球企业级 CI/CD、发布编排、流水线治理以及自主开发者工具的预估软件市场规模。
        - label: 现代云原生交付与 FinOps SAM（预估 $3,500M）
          value: 3500
          unit: USD M
          detail: 由寻求集成 CI/CD、安全测试和云成本优化的多云企业组成的可触达市场细分。
        - label: Harness 商业市场实际捕获 SOM（2025 年 ARR 为 $250M）
          value: 250
          unit: USD M
          detail: 截至 2025 年底 Harness 在 1,000+ 家企业客户中实现的年度经常性收入。
    approximationNotes: >-
      汽车市场数据直接引自 Mordor Intelligence（$84.5B）与 MarketsandMarkets（$244.3B）。DevOps 软件 TAM/SAM 属于分析师尽调测算数据；SOM 基于 Harness
      披露的 $250M ARR。
