      - number: '3.2'
        title: 竞争对手画像、规模与结构性权衡
        blocks:
          - type: paragraph
            body: >-
              企业级软件交付领域的竞争对手在资本规模、分发速度、部署范围与架构重心上差异显著。GitLab 与 GitHub
              等在位厂商将源代码管理、持续集成与交付打包为统一按席位计费的产品，迫使独立的编排厂商必须证明自身具有显著的运维 ROI 与安全优势。相反，Jenkins
              等传统开源引擎虽不收取软件授权费，却会产生高昂的内部工程维护成本与基础设施开销。面对一体化聚合型开发者生态，专用平台必须不断自证其引入第三方集成开销的合理性。此外，针对智能体执行架构的实证研究表明，负责上下文构建、工具协调与结果验证的基础设施运行框架（harness）会导致显著的性能差异与排名变动，这进一步证实执行层而非底层模型才是企业级软件的核心支点。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 定价动态、锁定效应与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              持续交付领域的定价与打包策略反映了截然不同的商业化逻辑，从基于算力与部署指标的用量计费，到按用户席位的订阅模式不等。Harness
              主打代码生成后的自动化、流水线治理与云成本管理，面向跨异构基础设施多云部署的复杂大型企业开展竞争。然而，厂商锁定效应受到 GitOps
              标准与声明式流水线规范的限制，导致各企业的切换成本存在差异。不利的市场动态包括云巨头的激进价格捆绑策略、客户在 IT
              预算收紧时不愿增加独立编排层，以及外部执行框架的差异性——基础设施的微小调整便可能改变长流程工作流的可靠性。捍卫企业级业务扩张需要证明变更失败率的切实下降，并提供经过验证的审查治理能力。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: 专题展品
        blocks:
          - type: callout
            title: 平台整合趋势与通用基础设施侵蚀
            body: 企业 IT 买家日益青睐将采购供应商整合为 GitHub 与 GitLab 等综合型开发者套件。若原生套件补齐了验证与自主交付方面的差距，独立的持续交付厂商将面临利润率受压及被替代的风险。
            calloutType: risk
            claimRefs:
              - CP001
