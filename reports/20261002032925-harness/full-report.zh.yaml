      - number: '7.2'
        title: 运营可靠性、质量与智能体执行风险
        blocks:
          - type: paragraph
            body: >-
              运营可靠性是 CI/CD 基础设施的重中之重，意外宕机或部署缺陷会直接导致研发停滞并危及生产环境。随着软件交付平台从静态脚本执行演变为智能体运行时，运营风险正从流水线配置错误转向 AI 的非确定性行为
              [CR004]。独立行业分析强调，AI 智能体运行框架必须维持严格的状态边界、落实工具沙箱机制并采集遥测数据，以防范生产环境中的未授权操作 [CR005, CR006]。尽管 Harness
              宣称其平台每月保护超过 250 billion 次 API 调用，并通过安全测试智能体排查漏洞 [CR007]，但自动化回滚机制或智能体安全护栏的任何失效，都会带来严重的故障扩散风险
              [CR008]。防范这些运维失效模式需要持续的框架级可观测性与严格的确定性执行策略 [CR009]。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
