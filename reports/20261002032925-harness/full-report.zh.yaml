        - id: secondary-discount
          label: Forge 二级市场交易价格对应 $4.12B 估值（折价 25%）
        - id: preference-overhang
          label: E 轮优先清算权（1.3x 清算优先倍数与 13% 股息）
        - id: recommendation-track
          label: 投资建议：在估值倍数趋于合理前保持持续跟踪立场
