  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管、合规与法律风险
        blocks:
          - type: paragraph
            body: >-
              在严格受监管的垂直行业中运行的企业级软件交付平台，必须满足全面的治理、合规及数据主权要求。Harness
              将企业业务拓展至金融服务、医疗保健及联邦公共部门机构，带来了紧迫的合规依赖。首要的商业瓶颈在于公共部门资质认证：若缺乏经确认的 FedRAMP Marketplace 授权，Harness
              在实际业务中便无法参与美国敏感联邦机构的采购，从而限制了其公共部门的潜在市场总量 [CR001]。此外，针对 AI 系统的现代监管框架正日益聚焦自动化代码生成与智能体化部署流水线。随着 Harness 部署专用
              AI 智能体推进软件交付与安全测试自动化，平台必须确保确定性的策略执行与可审计性
              [CR002]。若无法证明其具备完整的协调调度与策略合规能力，在流水线处理企业敏感知识产权时，将在新兴的算法治理框架下面临法律与监管合规责任 [CR003]。
            claimRefs:
              - CR001
              - CR002
              - CR003
