  - id: FI001
    title: Harness 软件交付商业化变现与单位利润转化流向
    type: flow
    summary: 直观呈现客户软件工程活动如何依次经由模块采用、企业许可授权以及扣除云托管成本转化为毛利率。
    data:
      nodes:
        - id: code-activity
          label: 开发者代码提交与代码生成
          type: input
          status: active
        - id: pipeline-execution
          label: 自动化构建、测试与安全验证
          type: process
          status: active
        - id: modular-licensing
          label: 模块化 SaaS 签约（CI/CD/CCM/AppSec）
          type: commercial
          status: active
        - id: recurring-arr
          label: 企业年度经常性收入（$250M+）
          type: revenue
          status: active
        - id: cogs-hosting
          label: 云端计算、存储与 AI 推理成本
          type: expense
          status: active
        - id: net-gross-profit
          label: 底层订阅毛利润（未公开）
          type: output
          status: unverified
      edges:
        - from: code-activity
          to: pipeline-execution
          label: 触发流水线运行
        - from: pipeline-execution
          to: modular-licensing
          label: 推动模块用量消耗
        - from: modular-licensing
          to: recurring-arr
          label: 转化为年度软件订阅
        - from: recurring-arr
          to: cogs-hosting
          label: 分摊交付营业成本（COGS）
        - from: cogs-hosting
          to: net-gross-profit
          label: 形成 SaaS 净利润率
    approximationNotes: 该流程架构基于披露的平台遥测数据，对从工程运维活动到平台 ARR 及利润兑现的商业转化机制建模。
