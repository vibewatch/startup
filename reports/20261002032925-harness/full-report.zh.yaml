    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、规模与商业模式
        blocks:
          - type: paragraph
            body: >-
              Harness 将自身定位为自主 SDLC 平台，专注于代码编写完成后的后续环节：构建、测试、安全防护、部署、治理以及软件成本管理。公司官网显示业务于 2017 年在旧金山启动，独立公司简介同样确认其于 2017
              年成立且总部位于旧金山。该产品作为企业级软件平台销售，而非专业服务或底层基础设施：各模块与 AI 智能体借助策略控制和共享知识图谱协同调度软件交付工作流。公司目前公布拥有 1,200+ 名员工与 1,000+
              家企业客户，但即便第三方机构有所引用，这些数据源头仍属公司自报口径。
