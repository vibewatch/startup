  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 企业级交付竞争版图与替代范式
        blocks:
          - type: paragraph
            body: >-
              Harness 的竞争格局横跨传统持续交付套件、一体化开发者平台、云厂商原生工具链以及内部自建平台工程架构。尽管 Harness 将自身定位为提供「代码编写后全流程 AI 赋能」的自主 SDLC
              平台，但企业买家仍会直接将其与 GitLab 及 GitHub Actions 等综合开发者套件、Jenkins 等传统自动化引擎，以及 AWS 与 Azure
              上的头部云厂商交付流水线作对比。至关重要的是，软件交付生命周期正向智能体化执行演进，其中编排调度、上下文协调与结果验证构成了主要的操作瓶颈。这种转变既为 Harness 提供了治理 AI
              生成代码交付的机遇，也带来了通用工作流执行层替代专用第三方交付流水线的风险。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
