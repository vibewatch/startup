  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与分类口径辨析
        blocks:
          - type: paragraph
            body: >-
              界定 Harness 的目标市场需严格区分物理硬件制造与企业级云软件交付。自动化关键词检索常将汽车电气细分领域的「线束（wiring harness）」制造（Mordor Intelligence 测算其
              2026 年全球规模为 $84.5B）与 Harness Inc. 开发的软件交付平台相混淆。实际上，Harness 业务完全属于企业级软件基础设施范畴，专注于自主软件交付生命周期（SDLC）。纳入统计的 IT
              支出涵盖持续集成（CI）、持续交付（CD）、云成本管理（CCM）、功能开关管理、安全测试编排（STO）、混沌工程以及 AI
              原生开发者流水线智能体。排除在外的支出则包括汽车物理线束总成、嵌入式硬件工具、通用项目管理看板以及底层基础设施云算力。在实际 SDLC 边界内，现有替代方案多为零散的单点工具，例如
              Jenkins、Spinnaker、ArgoCD 以及企业自研定制脚本。随着 AI 工具加速代码生成，交付流水线遭遇严重的下游测试与治理瓶颈，这正是 Harness 面向企业客户的核心市场机遇。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
