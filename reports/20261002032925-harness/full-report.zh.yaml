      - number: '2.3'
        title: 企业买家细分、预算归属与落地阻力
        blocks:
          - type: paragraph
            body: >-
              企业级软件交付平台必须应对横跨开发工程、平台运维与云财务的复杂多方采购决策流程。全球 2000 强客户中的主要买家包括首席技术官（CTO）、平台工程副总裁、首席信息安全官（CISO）以及云基础设施/FinOps
              负责人。一线操作用户群体则由软件开发人员、DevOps
              工程师、站点可靠性工程师（SRE）以及应用安全工程师构成。典型的采用路径遵循「立足与扩展」模式：初期以核心持续交付（CD）或持续集成（CI）切入以解决流水线脆弱性问题，随后跨模块扩展至云成本管理、安全测试编排以及自主
              SDLC 智能体。核心落地阻力集中于从旧版 Jenkins 流水线迁移的切换成本、安全团队对授予智能体自主流水线修复权限的顾虑，以及集中式基础设施团队与分布式业务线应用负责人之间的预算分配分歧。
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
