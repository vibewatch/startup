      - number: '8.3'
        title: 情景分析、同业倍数与尽调诉求
        blocks:
          - type: paragraph
            body: >
              为测算不同市场环境下的收益分布，我们对 Harness 在迈向潜在 IPO 的未来 24 个月内构建了三种经营情景。在乐观情景下，Harness 维持 50%+ 的年增长率，到 2027 年底将 ARR 从
              $250M 推升至 $450M，同时展现出高于 125% 的行业一流净扩展率并扩大云成本管理业务规模，支撑以 15.0x 倍数实现 $6.75B 的 IPO 估值。在基准情景下，营收增速放缓至稳健的 35%
              复合年增长率，ARR 达到 $375M，但公开市场倍数压缩将退出估值限制在 11.0x ARR，最终得出 $4.13B 估值，相较 E 轮投后价格反映出负收益。在悲观情景下，GitHub 与 GitLab
              的降价竞争削弱了新客获取，增速降至 15%，ARR 达到 $300M，估值倍数收缩至 6.0x 导致 $1.80B 的流血轮（down-round）估值，从而触发清算优先权偿付。


              在考虑参与一级市场出资或无对冲的二级市场建仓前，潜在机构合作方必须优先落实三项核心尽调要求。第一，获取经审计的财务报表，以明确 SaaS 软件订阅与云基础设施托管成本之间的毛利率结构。第二，审计 1,000+
              家企业客户群的分群净收入留存率，以验证多模块扩展成效。第三，审查完整的股权结构表与股东协议，量化累计清算优先权分配瀑布及清算受偿顺序。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 专题展品
        blocks:
          - type: callout
            title: 估值倍数压缩脆弱性
            body: >-
              在 22.0x ARR 之下，Harness 的估值要求近乎完美的执行力与持续 50%+ 的扩张速度。若增长没有明显超预期，估值倍数回落至同业中位数 10x–12x，将对应 $2.5B–$3.0B
              企业价值，并让未对冲的后期资本暴露于巨大的下行风险。
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
          - type: callout
            title: 二级市场估值套利
            body: >-
              截至 2026 年 10 月，Forge Global 上的二级市场交易显示成交价为每股 $19.00（对应估值 $4.12B），为低于 2025 年 12 月一级市场轮次每股
              $25.39（$5.5B）的价格发现确立了清晰的参考基准。
            calloutType: insight
            claimRefs:
              - CV010
              - CV011
