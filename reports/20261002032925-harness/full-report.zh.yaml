        title: 专题展品
        blocks:
          - type: callout
            title: AI 提速悖论拉动下游交付需求
            body: >-
              企业采用 AI 代码生成工具虽提升了初次编码速度，却加剧了下游交付瓶颈。随着工程团队产出代码的速度加快，测试、部署验证、安全审核与云成本控制成为产品面市的核心制约关卡。Harness 的自主 SDLC
              定位正切中了这一「代码编写后」摩擦环节。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 未经人工校准尽调流程中的市场边界混淆
            body: >-
              由于汽车线束行业存在同名英文词，自动化尽调流程在调研 Harness 时面临严重的语义混淆。宣称具有 $84B+ 至 $204B+ 市场规模的测算反映的是实体铜线总成，投资委员会必须剥离出纯软件领域的
              TAM/SAM 边界。
            calloutType: risk
            claimRefs:
