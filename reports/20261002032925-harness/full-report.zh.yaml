              - CE004
      - number: '5.2'
        title: 治理模型、自主控制等级与合规管控
        blocks:
          - type: paragraph
            body: >
              在软件交付流水线中部署自动化智能体带来了严苛的治理与风险管控要求。Harness 采用三级执行模型应对流水线风险，允许企业工程团队根据环境故障扩散范围（blast radius）上下调节自主权级别。在 1
              级自主权下，智能体不具备任何运行时自主裁量权，仅执行预设的静态流程化流水线步骤。在 2 级自主权下，专用智能体可提出流水线配置与操作建议，但在应用到生产环境变更前必须获得明确的人工审批确认。在 3
              级自主权下，智能体可在严格的组织边界内自主执行流水线优化。


              该平台依托 Open Policy Agent（OPA）策略即代码安全护栏、覆盖所有自动化决策的完备审计日志，以及与企业目录服务集成的基于角色的访问控制（RBAC），严格执行上述约束边界。合规认证覆盖 SOC 2
              Type II、ISO 27001、GDPR、DORA 以及 NIS2 等运行框架。实际企业客户案例表明，受治理的模板自动化显著遏制了流水线无序激增；例如，Morningstar 将 36,000
              条原有脚本流水线精简为 50 个标准化模板，而 United Airlines 则将数千条自定义流水线整合至 20 个受管模板中。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
