  - id: FE001
    title: Harness 自主 SDLC 平台架构技术栈
    type: stack
    summary: 分层架构图，展示用户交互界面、自主 Agent 执行模块、知识与策略引擎以及目标多云基础设施。
    data:
      layers:
        - label: 开发者与运维人员体验层
          detail: Web 控制台、GitOps 触发器、CLI 工具及 IDE 集成界面。
          modules:
            - 开发者门户与服务目录
            - GitOps 与流水线触发器
        - label: 自主 Agent 执行层
          detail: 跨交付、安全、运行时及成本等领域推理的专用 Agent。
          modules:
            - 软件交付 Agent
            - 安全测试 Agent
            - 运行时保护 Agent
            - 成本管理 Agent
        - label: 平台智能与治理核心
          detail: 共享 SDLC 知识图谱、OPA 策略引擎、RBAC 服务及不可变审计日志。
          modules:
            - SDLC 知识图谱
            - OPA 策略护栏
            - 企业级 RBAC 与审计线索
        - label: 持续验证与韧性引擎
          detail: 金丝雀部署分析、自动回滚、混沌工程实验及健康跟踪。
          modules:
            - 服务可靠性管理
            - 混沌工程与自动回滚
        - label: 基础设施与计算编排层
          detail: 跨多云 Kubernetes 集群与 Serverless 资源池的 Runner Agent 及执行目标。
          modules:
            - Delegate Runner 资源池
            - 容器化执行环境
        - label: 部署目标基础设施层
          detail: 多云 Kubernetes 集群、Serverless 目标、遗留虚拟机群及 AI 模型运行时。
          modules:
            - 公有云目标（AWS、Azure、GCP）
            - 本地部署与混合数据中心
    approximationNotes: 逻辑架构拆解综合整理自 Harness 技术架构与平台官方文档。
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE007
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业客户生命周期阶段，涵盖从初期评估、扩张部署到续约瓶颈的全过程。
    data:
      items:
        - label: 阶段一：初期探索与概念验证
          detail: DevOps 团队评估 CI/CD 自动化以替代 Jenkins 和遗留 Shell 脚本
        - label: 阶段二：平台架构标准化
          detail: 平台工程团队配置自定义 Delegate 基础设施与 RBAC 访问权限控制
        - label: 阶段三：核心流水线生产环境上线
          detail: 企业级部署横向扩展至数百个微服务并具备自动验证能力
        - label: 阶段四：多模块交叉销售
          detail: 向云成本管理（Cloud Cost Management）、安全测试编排（Security Testing Orchestration）以及特性标记（Feature Flags）拓展
        - label: 阶段五：AI 驱动的交付治理
          detail: 采用 AI DLC Insights 和云成本管理来治理开发者的 Token 支出
        - label: 阶段六：企业续约与规模评估
          detail: 采购审查评估平台复杂度、UI 使用阻力以及多年期合同 ROI
    approximationNotes: 各阶段依据有据可查的客户部署模式、模块发布公告及 G2 平台评价建模。
    claimRefs:
      - CU001
      - CU003
      - CU010
      - CU011
      - CU012
      - CU013
