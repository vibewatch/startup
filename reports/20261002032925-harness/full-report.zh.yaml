  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 自主 SDLC 平台架构与核心智能体模块
        blocks:
          - type: paragraph
            body: >
              Harness 将自身产品定义为自主 SDLC 平台，致力于将人工智能应用于代码生成之后的软件交付工作流。该平台架构围绕共享的 SDLC
              知识图谱整合了四大核心专用智能体模块，该图谱可持续监测流水线动态、故障遥测数据及云成本事件。软件交付智能体（Software Delivery
              Agent）实现从代码提交到生产环境的流水线自动化，跨多云环境部署应用制品、智能体定义、数据库模式（schema）及云基础设施。


              作为流水线交付的补充，安全测试智能体（Security Testing Agent）提供安全编排、AI
              辅助的静态应用安全测试（SAST）、软件成分分析（SCA）以及供应链安全管控，用于验证制品完整性与合规性。运行时防护智能体（Runtime Protection Agent）监控 API
              及运行中的智能体工作负载，在运行时检测恶意请求、分析安全态势并执行防火墙策略。成本管理智能体（Cost Management Agent）将云基础设施与 AI token 支出追溯至具体研发团队与 Pull
              Request，借助 AutoStopping 机制自动关停闲置资源。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
