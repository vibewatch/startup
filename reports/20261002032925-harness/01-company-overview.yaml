company:
  name: "Harness"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Harness is a San Francisco software-delivery platform launched in 2017 and led by co-founder and CEO Jyoti Bansal. Company-issued materials report more than $250 million of 2025 ARR, 1,000+ enterprise customers, 1,200+ employees, and a December 2025 Series E valuation of $5.5 billion, but the assigned evidence does not reconcile funding totals or independently verify financial performance."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Scale, and Business Model"
    body: "Harness describes itself as an Autonomous SDLC platform for the work that follows code creation: building, testing, securing, deploying, governing, and managing the cost of software. Its official company page says the business launched in San Francisco in 2017, while an independent company profile likewise identifies a 2017 founding and San Francisco headquarters. The product is sold as an enterprise software platform rather than as services or infrastructure ownership: modules and AI agents coordinate software-delivery workflows through policy controls and a shared knowledge graph. The company currently reports 1,200+ employees and 1,000+ enterprise customers, but those figures remain company-originated even when repeated by third-party profiles."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Governance, and Key-Person Dependence"
    body: "Leadership remains founder-centered. Harness identifies Jyoti Bansal as co-founder and chief executive officer and Rishi Singh as co-founder and a board member. That structure creates a clear key-person concentration around Bansal's product narrative, fundraising role, and operating authority, although the assigned sources do not disclose voting control, board composition, or founder ownership. Bill Koefoed joined as chief financial officer in May 2026 after finance roles at OneStream, Blue Nile, Puppet, BCG Digital Ventures, and Microsoft. CFO Dive reports that he is preparing the finance organization for an eventual public offering while balancing growth with profitability, but neither management nor the article provides a timetable for an IPO."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization, Valuation, and Stakeholders"
    body: "Harness announced a $240 million Series E in December 2025, comprising a $200 million Goldman Sachs-led investment and a planned $40 million tender offer involving IVP, Menlo Ventures, and Unusual Ventures. The transaction valued the company at $5.5 billion. Earlier financing included a company-announced $150 million facility from Silicon Valley Bank and Hercules Capital in May 2024, while an independent profile lists prior venture rounds and a separate October 2023 debt transaction. Total-raised figures are not comparable across the assigned sources: Harness says $570 million, GetLatka says $815 million across eight rounds, and Silicon Valley Investclub says $935 million including debt. These are preserved as conflicting denominators, not combined into a synthetic total."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "performance-and-diligence-implications"
    title: "Performance Claims and Diligence Implications"
    body: "Harness reported that 2025 ARR exceeded $250 million and grew more than 50% year over year. ARR is the metric actually disclosed: GetLatka labels the same $250 million as revenue, so the evidence does not support treating accounting revenue and ARR as interchangeable. The company also reports substantial operating activity and enterprise adoption, but the assigned pool contains no audited statements, gross-margin data, retention metric, profitability figure, or independently verified customer denominator. CFO Dive adds a useful counterweight to company momentum claims: public software markets have been difficult, AI buyers are scrutinizing return on investment, and management still needs to demonstrate a profitable public-company profile. No successful adverse-search result in the pool substantiates a legal or regulatory incident, which is an evidence gap rather than proof that none occurred."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO012"
      - "CO015"
      - "CO016"
