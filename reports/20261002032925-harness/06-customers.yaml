callouts:
  - calloutType: "risk"
    title: "Opaque Retention Metrics and Enterprise Expansion Risk"
    body: "While Harness boasts over 1,000 enterprise customers and more than $250 million in ARR, the complete absence of disclosed Net Revenue Retention (NRR) or Gross Revenue Retention (GRR) metrics represents a material diligence concern. Without verified retention cohorts, investors cannot determine whether revenue growth is fueled by durable land-and-expand compounding or masked by high customer churn offset by new acquisition."
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU013"
  - calloutType: "insight"
    title: "AI Governance as the New Enterprise Expansion Wedge"
    body: "With the commercial introduction of AI DLC Insights and Cloud & AI Cost Management, Harness is positioning itself to capture growing enterprise budgets dedicated to developer AI governance. By tracing developer token spend from coding assistants directly to shipped pull requests and production deployments, Harness addresses the emerging 'AI Velocity Paradox' where enterprises demand measurable ROI from soaring AI software expenditures."
    claimRefs:
      - "CU010"
      - "CU012"
