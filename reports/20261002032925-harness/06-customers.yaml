  title: "Customers"
  summary: "Harness serves over 1,000 enterprise customers across North America, EMEA, and APAC, orchestrating over 185 million deployments annually. However, severe customer concentration and durability gaps persist, as formal net retention rates remain undisclosed and users voice friction over complex platform onboarding and interface clutter."
sections:
  - id: "enterprise-customer-segmentation"
    title: "Enterprise Customer Segmentation & Target Buyer Profiles"
    body: "Harness targets large-scale enterprise engineering organizations operating hybrid and multi-cloud software delivery environments. The commercial model bifurcates between technical buyers—such as Platform Engineering Leads, Vice Presidents of Engineering, and Chief Information Officers—and daily practitioners who operate CI/CD pipelines, feature flags, and infrastructure-as-code automation. Documented enterprise deployments span critical global verticals: financial services (National Australia Bank, Morningstar), commercial aviation and hospitality (United Airlines, Choice Hotels), real estate platforms (Keller Williams), and human capital software (Workday). These enterprise customers adopt Harness to replace fragmented, script-heavy deployment setups with policy-driven, automated delivery pipelines. While enterprise logos demonstrate high brand recognition, enterprise adoption remains heavily concentrated among organizations with sophisticated Kubernetes architectures, creating procurement hurdles for mid-market engineering teams that lack dedicated platform teams."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-workload-scale"
    title: "Adoption Trajectory & Workload Scale Across Enterprise Deployments"
    body: "Enterprise adoption at Harness has scaled dramatically from early continuous delivery automation into full software delivery lifecycle governance. The platform orchestrates more than 185 million deployments annually and runs over 5.7 million monthly pipeline executions, alongside 1.5 trillion feature flag evaluations per month and 250 billion API calls protected. Growth in customer accounts has kept pace with platform maturity, expanding from hundreds of enterprise customers in 2022 to over 1,000 enterprise organizations across North America, EMEA, and APAC by 2026. Annual recurring revenue surpassed $250 million at the end of 2025, representing more than 50% year-over-year expansion supported by 128 quota-carrying sales representatives. Nevertheless, Harness does not report standardized usage metrics such as daily active developers or workload utilization per seat, preventing external auditors from confirming what proportion of the 1,000 enterprise accounts represent company-wide standardizations versus isolated business-unit pilots."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "named-customer-evidence-retention-risks"
    title: "Named Customer Proof, Retention Dynamics & Expansion Blockers"
    body: "Production outcomes among prominent enterprise accounts demonstrate measurable velocity gains, including deployment acceleration of up to 70% to 75% at United Airlines and Morningstar, along with 50% reductions in change failure rates and up to 60% cloud infrastructure cost savings via Cloud Cost Management. Furthermore, enterprise customers have adopted new AI governance and engineering insights modules to connect developer token spend to production delivery outcomes. Despite these positive case studies, customer sentiment analysis reveals notable adverse friction in platform expansion. Independent reviews and competitor benchmarks highlight that Harness's interface suffers from navigation clutter, rigid out-of-the-box dashboards, and an onboarding learning curve that leaves teams struggling with troubleshooting integrations. Most critically, Harness has never published audited Net Revenue Retention (NRR) or Gross Revenue Retention (GRR) figures, leaving expansion durability and gross churn rates unverified."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
