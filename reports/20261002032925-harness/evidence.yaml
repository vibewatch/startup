evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A transaction-level capitalization schedule reconciling equity rounds, debt, credit facilities, secondary tenders,
      and any undrawn commitments.
    whyItMatters: >-
      The $570 million, $815 million, and $935 million totals use unclear or incompatible denominators and cannot
      support a reliable capitalization total.
    diligencePath: >-
      Request the cap table, financing ledger, debt schedule, and closing documents, then reconcile cash proceeds
      separately from secondary liquidity and available credit.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: financial-metric-definition
    missingEvidence: Audited 2025 revenue and a bridge from recognized revenue to annual recurring revenue.
    whyItMatters: >-
      ARR and accounting revenue are not interchangeable, and the distinction affects growth, valuation multiples, and
      comparability.
    diligencePath: >-
      Request audited financial statements, ARR policy definitions, contract schedules, and a revenue-to-ARR
      reconciliation.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive roster, board composition, cap table, voting rights, option pool, and investor protective
      provisions.
    whyItMatters: Public biographies identify key leaders but do not establish control, succession readiness, or preference rights.
    diligencePath: >-
      Request the current board list, charter documents, voting agreements, cap table, option ledger, and financing
      rights schedules.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financial-quality
    missingEvidence: Audited revenue, gross margin, profitability, cash burn, runway, and net revenue retention.
    whyItMatters: >-
      Company-reported ARR and growth do not establish accounting revenue, unit economics, retention quality, or cash
      availability.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, cohort retention schedules, cash statements, and
      board-approved operating plans.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: >-
      A successful primary or independent source substantiating any material lawsuit, regulatory action, outage, breach,
      or complaint event.
    whyItMatters: An empty adverse-search result cannot establish the absence of incidents or contingent liabilities.
    diligencePath: >-
      Run targeted court, regulator, status-page, security-disclosure, and customer-reference checks outside this
      constrained source pool.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: unit-economics-opacity
    missingEvidence: Audited financial statements confirming GAAP subscription gross margin and net revenue retention (NRR) cohorts.
    whyItMatters: >-
      Without verified gross margin and net retention, long-term software operating leverage and terminal cash flow
      cannot be underwritten.
    diligencePath: >-
      Request confidential data room access to historical audited income statements and customer cohort expansion
      schedules.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: minor
    topic: debt-covenant-terms
    missingEvidence: >-
      Detailed debt amortization schedules, interest covenants, and cash balance minimums under the SVB and Hercules
      Capital credit facilities.
    whyItMatters: >-
      Determines whether debt service obligations could create refinancing pressure or restrict operating investments
      ahead of an IPO.
    diligencePath: Review credit agreement compliance certificates and debt facility term sheets with company management.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: Audited cohort-level Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) metrics.
    whyItMatters: >-
      Without retention disclosures, it is impossible to determine whether the $250M ARR reflects strong expansion or
      high churn masked by new customer acquisition.
    diligencePath: >-
      Request confidential historical cohort retention analysis and renewal contract logs during private management
      diligence.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-penetration
    missingEvidence: >-
      Exhaustive roster of all 1,000+ enterprise customer contracts including annual contract values and module
      penetration.
    whyItMatters: >-
      Public case studies highlight top-tier brand logos but do not disclose the proportion of customers that
      standardise across multiple modules versus single-pipeline deployments.
    diligencePath: Review anonymized enterprise contract distribution and ACV tier breakdowns in the virtual data room.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-compliance
    missingEvidence: Official FedRAMP Marketplace active authorization listing or formal Agency Sponsorship documentation.
    whyItMatters: >-
      Without FedRAMP High or Moderate authorization, Harness cannot sell SaaS deployments into US federal agencies,
      limiting public-sector TAM expansion.
    diligencePath: >-
      Request FedRAMP package audit reports, PMO review status, and existing federal agency authority to operate (ATO)
      letters directly from company compliance counsel.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: >-
      Audited financial statements detailing GAAP revenue, gross margin, cash burn, and dollar-based net revenue
      retention (NRR).
    whyItMatters: >-
      Without audited metrics, underwriting a 22x ARR valuation multiple risks misjudging unit economics, software gross
      margin profile, and expansion durability.
    diligencePath: Obtain audited financial statements for FY2024-FY2025 and audited cohort NRR metrics in confidential diligence.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited GAAP income statements disclosing gross margin breakdown, net revenue retention (NRR), and cash burn rate.
    whyItMatters: >-
      Without audited gross margin and NRR figures, long-term software cash generation and customer expansion quality
      cannot be verified at a 22x ARR multiple.
    diligencePath: >-
      Request confidential disclosure of audited fiscal 2024-2025 financial statements and quarterly cohort retention
      metrics from Harness management.
    relatedQuestionRefs:
      - QV008
