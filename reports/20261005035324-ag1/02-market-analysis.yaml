callouts:
  - calloutType: "insight"
    title: "Convenience Sells Foundational Nutrition at Premium SaaS-Like Multiples"
    body: "AG1's market success stems from bundling multivitamins, probiotics, prebiotics, and adaptogens into a single morning routine. By positioning its powder as an all-in-one replacement for 4 to 5 separate pill bottles, AG1 justified a $79/month subscription price that generated $600 million in annual revenue [CM001, CM002, CM008]."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM008"
  - calloutType: "risk"
    title: "Mass Retail Transition Tests Gross Margin and Brand Exclusivity"
    body: "While DTC subscriptions drove AG1's first 15 years, expanding into Target, Costco, and Amazon introduces lower price-pack formats and retailer margin cuts. Furthermore, competing with CPG giants like Unilever (which acquired Grüns for $1.2B) requires heavy retail shelf marketing and packaging adjustments [CM006, CM012]."
    claimRefs:
      - "CM006"
      - "CM012"
