callouts:
  - calloutType: "insight"
    title: "Formulation Trade-offs in Non-Powder SKU Expansion"
    body: "AG1's core brand identity was built on the premise that a single comprehensive powder scoop eliminates the need for separate pills and supplements. However, expanding into chewable gummies forces fundamental technical compromises: living probiotic bacteria such as Lactobacillus acidophilus and Bifidobacterium bifidum cannot survive the thermal processing and high water activity of gummy manufacturing and must be omitted entirely. As AG1 extends its product matrix to capture casual retail shoppers, it dilutes the foundational 'all-in-one' scientific narrative that justified its premium subscription pricing [CE001, CE005]."
    claimRefs:
      - "CE001"
      - "CE005"
  - calloutType: "risk"
    title: "Proprietary Blend Opacity and Clinical Generalizability Boundaries"
    body: "While AG1 has invested in peer-reviewed in vitro digestive models and randomized clinical safety trials, significant scientific gaps persist. The 75-ingredient formula utilizes proprietary blend groupings that withhold exact milligram quantities of individual adaptogens and botanicals, preventing clinicians from evaluating whether active constituents reach minimum therapeutic thresholds. Furthermore, published human trials are constrained to small cohorts (n=30) of healthy adults over short 4-week periods, offering no empirical validation for long-term chronic disease prevention or superior efficacy compared to a balanced diet [CE002, CE007, CE010]."
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE010"
