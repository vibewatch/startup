figures:
  - id: FP001
    title: Competitive positioning by bundled breadth and trust signal
    type: quadrant
    summary: >-
      AG1 occupies the high-breadth, high-trust corner, but several alternatives attack one axis
      with lower price, organic positioning, dose transparency, or easier format.
    data:
      xAxis:
        label: Bundled breadth
        min: 1
        max: 5
      yAxis:
        label: Public trust signal
        min: 1
        max: 5
      points:
        - label: AG1
          x: 5
          y: 5
          note: "Broad bundle plus NSF sport signal; ingredient-count versions conflict."
        - label: Green Vibrance
          x: 4
          y: 4
          note: "Broad, transparent competitor claim; lacks AG1's reported sport certification."
        - label: Field of Greens
          x: 3
          y: 4
          note: "Narrower whole-food formula with issuer-claimed USDA Organic positioning."
        - label: Live it Up
          x: 3
          y: 2
          note: "Value formula with brand-reported testing and no sport certification."
        - label: Bloom
          x: 3
          y: 2
          note: "Accessible taste-led offer; blend-dose transparency is limited."
        - label: Huel Daily Greens
          x: 5
          y: 3
          note: "Broad bundle from a scaled brand; no NSF sport stamp reported."
        - label: Private label
          x: 2
          y: 1
          note: "Accessible supply, but testing, trust, and demand generation are unproven."
    approximationNotes: >-
      Analyst ordinal scores from 1 (low) to 5 (high), not measured market data. Breadth reflects
      stated bundled scope; trust reflects disclosed certification, transparency, reviewed human
      evidence, and publisher caveats. Scores do not measure efficacy.
    claimRefs: [CP016]
callouts:
  - calloutType: strength
    title: Distribution is becoming a more important moat component
    body: >-
      Amazon, Costco, The Vitamin Shoppe, and Target extend trial access beyond the original
      subscription funnel; management said Target would double AG1's retail doors.
    claimRefs: [CP009, CP015]
  - calloutType: risk
    title: Retention economics are the missing durability test
    body: >-
      Public evidence does not disclose churn, cohort retention, realized discounts, or
      channel-level gross margin, so brand reach cannot yet be translated into durable customer
      lifetime value.
    claimRefs: [CP011, CP015, CP016]
