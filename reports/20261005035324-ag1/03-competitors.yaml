company:
  name: AG1
chapter:
  number: 3
  title: Competitors
  summary: >-
    AG1's defensible advantages are brand reach, broad bundled positioning, NSF Certified for
    Sport signaling, and rapidly expanding retail distribution—not an obviously scarce product
    architecture. Lower-priced, more transparent, organic, and format-shifting alternatives
    constrain pricing power, while the available clinical evidence is short-duration,
    company-funded, and does not resolve long-term efficacy differentiation.
sections:
  - id: buyer-choice-set
    title: The buyer can solve the job in many ways
    body: >-
      AG1 competes with more than greens powders. Direct peers bundle greens, vitamins,
      probiotics, and adaptogens; focused products compete on organic sourcing, disclosed doses,
      taste, or price; gummy formats such as Grüns reduce preparation friction; and generic
      private-label powders make internal brand creation technically accessible. The status quo
      is also material: buyers can keep a multivitamin or probiotic stack, purchase whole
      vegetables, or take nothing. Available sources do not disclose comparable funding,
      customer counts, or realized channel economics for most private peers, so public rankings
      should not imply scale parity. The most supportable segmentation is therefore by buyer job
      and offer architecture rather than by unsupported market-share estimates.
    claimRefs: [CP006, CP007, CP008, CP010, CP012]
    tableRefs: [TP001]
  - id: capability-and-trust
    title: Breadth and trust signals support the premium, but proof is not conclusive
    body: >-
      AG1 combines a broad all-in-one proposition with NSF Certified for Sport positioning, a
      package that is harder for a simple low-cost greens powder to match on trust and
      convenience. Yet breadth is not the same as transparent dosing: competitor-issued
      comparisons emphasize fully disclosed formulas, organic certification, or higher stated
      probiotic counts. Even the current ingredient count is not cleanly comparable across
      sources—2026 competitor pages describe an 83-ingredient Next Gen formula, while current
      retail reporting still describes 75 vitamins, nutrients, and minerals. That inconsistency
      may reflect versions or shorthand, but it makes a cell-by-cell efficacy comparison
      unreliable without current labels and certificates of analysis.
    claimRefs: [CP003, CP004, CP005, CP006, CP008]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-distribution-and-switching
    title: Distribution is strengthening as product switching remains easy
    body: >-
      Current public pricing places AG1 at $79 per month on subscription and $99 for a one-time
      purchase, before any version-specific shipping terms. That premium is exposed to products
      advertised at roughly $0.90 to $2.90 per serving, although those figures come largely from
      affiliate or competitor pages and are list prices rather than realized revenue. AG1 is
      offsetting direct-to-consumer saturation by adding Amazon, Costco, The Vitamin Shoppe, and
      Target; management told Modern Retail the Target launch would double its retail doors.
      Distribution reach and habit can raise practical switching friction, but there is no
      disclosed contract lock-in, proprietary device, or workflow integration. Consumers can
      cancel, multi-home, or substitute a different powder, pills, gummies, or food.
    claimRefs: [CP001, CP002, CP007, CP009, CP011, CP015]
    tableRefs: [TP003]
  - id: durability-verdict
    title: The moat is commercial rather than structurally product-locked
    body: >-
      The best evidence supports a commercial moat built from awareness, recurring purchasing,
      testing credentials, and widening shelf access. It does not establish durable exclusivity
      in formulation, clinical outcomes, or supply. A four-week randomized trial in 30 healthy
      adults provides a legitimate finished-product proof point, but it was funded in part by
      AG1, included AG1 employees as authors, and reported a digestive-quality-of-life
      difference at p=0.058 rather than conventional statistical significance. Meanwhile,
      low-minimum-order private-label supply and transparent lower-cost formulas increase
      commoditization pressure. The underwriting question is whether retail distribution and
      brand trust can preserve retention and gross margin once buyers can compare formats and
      prices side by side; public evidence does not answer that yet.
    claimRefs: [CP012, CP013, CP014, CP015, CP016]
