callouts:
  - calloutType: insight
    title: Scale is better evidenced than capital structure
    body: >-
      Public reporting supports the broad revenue and retail-expansion story, but
      the valuation basis, funding history, debt, investor rights, and current
      ownership remain unsuitable for underwriting without private documents.
    claimRefs: [CO007, CO008, CO009, CO010, CO016]
  - calloutType: risk
    title: Product substantiation is not fully independent
    body: >-
      The reviewed randomized trial is useful but short, limited to 30 healthy
      adults, partly funded by AG1, and coauthored by two company employees.
    claimRefs: [CO013, CO014, CO015]
