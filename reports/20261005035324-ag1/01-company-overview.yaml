company:
  name: AG1
chapter:
  number: 1
  title: Company Overview
  summary: >-
    AG1 is a private, Carson City-based supplements company built around a premium
    direct-to-consumer subscription, with company-reported 2024 annual revenue of
    $600 million and a 2025-2026 shift into additional products and mass retail.
    Public evidence supports the operating milestones but leaves total funding,
    current valuation, ownership, board composition, headcount, and an exact
    customer count unresolved.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      AG1, formerly Athletic Greens, was founded by Chris Ashenden in 2010 and is
      described as a private American supplements company headquartered in Carson
      City, Nevada. Its original model concentrated demand into one greens powder
      sold directly through subscriptions: Modern Retail reports that AG1 remained
      direct-to-consumer for its first 15 years and sold only that product during
      the period. That concentration helped create a simple recurring-revenue
      proposition, but it also made the company dependent on one formulation, one
      premium price point, and paid or creator-led customer acquisition. The model
      is now broadening. AG1 added AGZ and moved into Amazon, Costco, The Vitamin
      Shoppe, and Target during 2025-2026, changing the business from a
      subscription-led single-product brand into a multi-product, multichannel
      consumer-health platform. The transition may expand reach while introducing
      retail margin, sell-through, and channel-conflict questions not answered by
      public disclosures.
    claimRefs: [CO001, CO002, CO003, CO008, CO009, CO010, CO011]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Kat Cole is the current chief executive and the central operator behind the
      retail expansion. She joined as president and COO in December 2021 and
      became CEO in 2024. The transition was not merely planned succession:
      Wikipedia's sourced chronology reports that founder Chris Ashenden resigned
      in 2024 after his earlier criminal convictions for a New Zealand housing
      scam became public. That history is a material governance diligence item,
      although the available pool does not establish any related company liability.
      Leadership evidence is otherwise thin. Publicly visible operating commentary
      is concentrated in Cole's interviews, while the assigned evidence does not
      establish board composition, founder ownership, voting control, executive
      retention arrangements, or a complete current leadership roster. Investors
      should therefore treat Cole as a key-person dependency and request formal
      governance and succession materials rather than infer control from titles.
    claimRefs: [CO004, CO005, CO006, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: scale-and-capital
    title: Scale, economics, and capital visibility
    body: >-
      The strongest public scale datapoint is company-reported rather than audited:
      AG1 said it generated $600 million of annual revenue in 2024 and was
      profitable. This is revenue, not ARR, and neither Modern Retail nor Wikipedia
      supplies audited statements, margins, cash generation, churn, or channel
      mix. The consumer proposition was still priced at $79 per month for a
      subscription and $99 for a one-time purchase in Modern Retail's 2026
      reporting; McGill's 2024 critique independently cited the $79 monthly price
      while questioning value for many consumers. Wikipedia reports a $1.2 billion
      valuation as of January 2025, but the assigned evidence does not establish
      the transaction, security, post-money basis, or whether that figure remained
      current at the October 2026 run date. Total funding raised, debt, secondary
      transactions, investor rights, and cash available remain gaps and should not
      be inferred from revenue, profitability claims, or valuation.
    claimRefs: [CO007, CO011, CO016]
  - id: milestones-and-evidence-quality
    title: Milestones and evidence quality
    body: >-
      AG1's recent milestones show deliberate diversification. The company launched
      AG1 Next Gen in May 2025, paired with a company commitment to invest more
      than $20 million in research over the following three years. It added AGZ,
      Amazon, and Costco distribution in 2025; The Vitamin Shoppe then launched AG1
      in more than 640 stores in January 2026, followed by a Target rollout that
      management said doubled the number of doors carrying the brand. Product
      evidence requires qualification. A randomized placebo-controlled study in 30
      healthy adults over four weeks reported no significant deterioration in
      clinical safety markers and potential digestive benefit, but it was funded
      partly by AG1 and included two Athletic Greens employees as authors. McGill's
      Office for Science and Society separately argued that evidence for many
      ingredients and broad benefits was not robust. The combination supports a
      real research program, but not an inference that all marketing claims are
      independently established.
    claimRefs: [CO001, CO004, CO005, CO007, CO008, CO009, CO010, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
