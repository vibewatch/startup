      - number: '5.3'
        title: 数字平台架构、代工与质量控制
        blocks:
          - type: paragraph
            body: >-
              AG1 以轻资产消费健康公司运营，将配方研究和品牌分销与工业制造拆开。实物生产外包给第三方代工厂，在现行良好生产规范（cGMP）下混合、包装并仓储大包装粉末和零售袋装 [CE001,
              CE011]。为缓解消费者对植物原料供应链固有重金属、农药和微生物污染的疑虑，AG1 保持 NSF Certified for Sport 注册，验证批次级成分纯度并确认不存在禁用运动物质 [CE001,
              CE011]。数字基础设施方面，AG1 在电商咨询公司 Anatta 主导下全面重构平台，从受限单体 Web 框架迁至 Shopify 之上的解耦无头 Progressive Web
              App（PWA），并采用定制订阅管理层 [CE012]。该架构把前端加载时间降至 1 秒以内，在统一域名上稳定 47 个国际市场的全球结账表现，并支持交易规模从 $15 million 增至 $1.2
              billion 峰值估值和 $600 million 年化收入 [CE003, CE012]。技术依赖仍集中在第三方云集成、无头 CMS 端点，以及易受气候和地缘政治扰动的农业植物供应链 [CE011,
              CE012]。
            claimRefs:
              - CE001
              - CE003
              - CE011
              - CE012
      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 非粉末 SKU 扩张中的配方取舍
            body: >-
              AG1 的核心品牌建立在一个完整粉末勺即可取代独立药片和补充剂的前提上。但扩展到可咀嚼软糖会带来根本技术取舍：Lactobacillus acidophilus 和 Bifidobacterium bifidum
              等活性益生菌无法承受软糖制造的热处理和高水活度，必须完全删去。AG1 扩展产品矩阵、吸引普通零售消费者时，也会稀释支撑其高端订阅价格的基础“一站式”科学叙事 [CE001, CE005]。
            calloutType: insight
            claimRefs:
              - CE001
              - CE005
          - type: callout
            title: 专有混合配方的不透明与临床外推边界
            body: >-
              AG1 虽投入同行评审的体外消化模型和随机临床安全试验，科学缺口仍然明显。75
              成分配方采用专有混合分组，不披露单个适应原和植物成分的确切毫克数，临床医生无法判断活性成分是否达到最低治疗阈值。此外，已发表的人体试验只覆盖健康成年人小队列（n=30），周期短至 4
              周，没有为长期慢性病预防或相较均衡饮食的更高功效提供实证 [CE002, CE007, CE010]。
            calloutType: risk
            claimRefs:
              - CE002
              - CE007
              - CE010
