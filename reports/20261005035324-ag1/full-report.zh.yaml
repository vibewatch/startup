chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              AG1 前身为 Athletic Greens，由 Chris Ashenden 于 2010 年创立；公开描述称其是一家总部位于内华达州 Carson City
              的美国私营补充剂公司。早期模式把需求集中到一款通过订阅直销的绿色粉末上：Modern Retail 报道称，AG1 前 15 年一直采用 DTC
              模式，期间只销售这款产品。这种集中带来了简单的经常性收入命题，但也让公司依赖单一配方、单一高端价格点以及付费或创作者驱动的获客。如今模式正在拓宽。AG1 在 2025-2026 年加入 AGZ，并进入
              Amazon、Costco、The Vitamin Shoppe 和
              Target，使业务从订阅驱动的单品品牌转为多产品、多渠道消费健康平台。转型可能扩大触达面，但也带来公开披露未回答的零售利润率、售罄速度和渠道冲突问题。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
              - CO010
              - CO011
