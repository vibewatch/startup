  - id: FE001
    title: AG1 模块化产品与技术架构
    type: stack
    summary: 覆盖消费者交付形态、核心营养配方、质量验证和数字商务基础设施的结构层。
    approximationNotes: 代表综合已发表技术案例、临床文献和零售披露形成的功能架构。
    data:
      layers:
        - label: 消费者分销层
          detail: 覆盖 DTC 订阅、大众零售门店和数字市场的全渠道客户触点
          modules:
            - 无头 DTC 网页平台（drinkag1.com）
            - 大众零售端架（Target、Costco、Vitamin Shoppe）
            - 市场渠道（Amazon Storefront）
          outputs:
            - 经常性订阅者订单
            - 零售发现与试购
        - label: 产品与包装模块
          detail: 针对不同消费者使用场景和价格点定制的多样化实体 SKU
          modules:
            - 旗舰 30 天粉剂罐（每日一勺 12g）
            - 单份旅行装（7 份和 14 份）
            - 昼夜节律夜间配方（AGZ）
            - 可咀嚼软糖（AG1 Essentials）
          outputs:
            - 每日晨间营养
            - 夜间放松
            - 便携补水
        - label: 营养与科学引擎
          detail: 活性配方复合物经过实验室溶出测试和临床试验评估
          modules:
            - 75+ 成分基础复合配方
            - 合生元益生菌混合物（L. acidophilus、B. bifidum，7.2B CFU）
            - SHIME 上消化道溶出与 TEER 屏障模型
            - 双盲临床安全性试验框架
          outputs:
            - 体外矿物质生物可及性
            - 肠道上皮屏障完整性
            - 益生菌肠道定植
        - label: 质量保障与分析认证
          detail: 第三方分析检测和独立运动员禁用物质筛查
          modules:
            - NSF Certified for Sport 逐批分析验证
            - 重金属和微生物污染物筛查
            - 标签声称准确性与崩解测试
          outputs:
            - 批次认证成品
            - 运动员反兴奋剂清除证书
        - label: 合同制造与采购层
          detail: 轻资产第三方供应链和 cGMP 制造运营
          modules:
            - 第三方 cGMP 混合设施
            - 全球植物和矿物原材料采购
            - 自动化高速袋装和罐装包装线
          outputs:
            - 散装成品粉末批次
            - 密封旅行袋装和可直接零售包装
        - label: 数字基础设施与系统
          detail: 解耦式云架构，支撑覆盖 47 个国家的全球跨境商业
          modules:
            - Shopify Plus 商业引擎
            - 定制无头 PWA（Anatta 架构）
            - 订阅生命周期与留存管理
            - 全球多币种本地化引擎
          outputs:
            - 亚秒级页面延迟
            - 自动化订阅续费计费
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE008
      - CE009
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 客户从播客发现品牌，到批发零售渠道采用，再到订阅留存的全链路旅程及其阻碍。
    data:
      items:
        - label: 播客与影响者认知
          detail: 通过顶级音频赞助（Huberman、Rogan、Ferriss）和数字创作者白名单获得曝光。
          touchpoints:
            - 播客主持人背书
            - 个性化创作者落地页
            - 专属促销码和入门摇摇杯套装
        - label: 直面消费者评估
          detail: 消费者浏览数字商店时，首先会遇到较高的价格门槛（$79/mo 订阅或一次性购买 $99）。
          touchpoints:
            - drinkag1.com 互动营养测验
            - 科学研究摘要和临床声称
            - 30 天退款保证条款
        - label: 零售试购与低承诺购买
          detail: 通过 Target 或 Costco 购买便捷的 7 件装或 14 件装入门套装，提供另一条更低承诺的现代消费路径。
          touchpoints:
            - Target 专属健康品端架
            - 配有摇摇杯和习惯追踪器的入门套装
            - Costco 多包装会员店购物
        - label: 每日消费与习惯养成
          detail: 消费者形成每日晨间冲调饮品习惯，但也可能因功效疑虑、价格疲劳或不佳口感体验而流失。
          touchpoints:
            - 融入晨间日常
            - 订阅门户管理和配送节奏
            - 接触负面公开报道、质疑或竞品
        - label: 产品组合扩展与加购
          detail: 客户持续接触多产品组合（AGZ 睡眠粉）和配套商品。
          touchpoints:
            - 交叉销售 AGZ 夜间睡眠仪式产品
            - 摇摇杯和品牌罐装配件
            - 旅行装补货
        - label: 倡导、推荐与流失决策
          detail: 当价值与价格的平衡被打破时，客户可能主动口碑推荐，也可能取消订阅。
          touchpoints:
            - 与家人和同事分享个人推荐码
            - 客服留存流程和暂停订阅
            - 转向成本更低的零售装或软糖替代品
    approximationNotes: 旅程阶段反映了根据营销分析和高管访谈综合提炼的 DTC 与全渠道转化路径。
    claimRefs:
      - CU001
      - CU004
      - CU008
      - CU009
      - CU011
      - CU015
