  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与渠道多元化
        blocks:
          - type: paragraph
            body: >-
              AG1 历来几乎完全依托旗舰绿色粉末配方，以 DTC 订阅业务扩张。公司披露 2021 年年收入为 $160M，2024 年增至约 $600M，同时保持经营盈利。主要变现机制是每月 $79 的经常性订阅（每袋
              30 份即 $2.63），另有每袋 $99 的单次购买。为提高客户终身价值和平均订单金额（AOV），AG1 推出组合订阅，包括 Full Foundation Stack（$108/month）以及含 AGZ 的
              Day & Night 睡眠系统（$148/month）。2025 和 2026 年，公司转向批发和全渠道零售，在 Costco 推出专用旅行袋和试用装（40 袋 $72.99，即每份 $1.82），在
              Target 推出 7 袋、14 袋旅行装及 Start Here 入门套装，并进入 The Vitamin Shoppe。零售分销让消费者触点翻倍，也降低不愿持续支付每月 $79
              的消费者的试用摩擦；但批发折扣架构和备货条款会相较传统高毛利率 DTC 渠道压低实际每份收入。
