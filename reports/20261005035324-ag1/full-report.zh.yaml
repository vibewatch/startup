            body: >-
              AG1 在 DSHEA 监管边界下运营于膳食补充剂市场，产品无需接受 FDA 上市前功效审批。McGill University 和 Harvard Medical School
              等机构的独立学术营养科学家公开批评 AG1 的营销主张，指出缺少严谨的大规模临床试验，并称专有混合物遮掩单个成分剂量 [CR001,
              CR002]。批评者还指出，均衡饮食的健康成年人日常饮用高剂量复合维生素饮品，是不必要的支出，预防性健康益处也很小 [CR003]。公司由 Chris Ashenden 于 2010 年创立；他因 2011
              年在新西兰涉及房地产计划的刑事定罪受到公开审视，于 2024 年 10 月辞职 [CR004]。Kat Cole 虽接任 CEO 以稳定机构治理并扩大伙伴关系
              [CR005]，但声誉和关键人物的余波仍存在于机构投资者和企业伙伴圈。
