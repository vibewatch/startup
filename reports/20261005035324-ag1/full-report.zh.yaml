      - number: '3.3'
        title: 分销增强，但产品切换仍很容易
        blocks:
          - type: paragraph
            body: >-
              当前公开价格显示，AG1 订阅每月 $79，单次购买 $99，未计具体版本的运费条款。相较之下，竞品宣传每份约 $0.90 至 $2.90，虽多来自联盟或竞争者页面，属于标价而非实际收入。AG1 通过进入
              Amazon、Costco、The Vitamin Shoppe 和 Target 来对冲 DTC 饱和；管理层告诉 Modern Retail，Target
              上市会使零售门店数翻倍。分销触达和使用习惯可以提高实际切换摩擦，但没有披露合同锁定、专有设备或工作流集成。消费者可以取消、多品牌购买，或替换成其他粉末、药片、软糖或食物。
            claimRefs:
