        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Kat Cole 是现任 CEO，也是零售扩张的核心操盘手。她于 2021 年 12 月加入公司，任总裁兼 COO，2024 年升任 CEO。这不只是计划内的接班：Wikipedia 的有来源年表称，创始人
              Chris Ashenden 早年的新西兰住房骗局刑事定罪公开后，于 2024 年辞职。这段经历是重要的治理尽调事项，但现有资料不能证明公司承担任何相关责任。除此之外，领导层证据很少。公开运营评论主要来自
              Cole 的采访，现有证据无法确认董事会构成、创始人持股、投票控制权、高管留任安排或完整的现任领导层名单。因此，投资者应把 Cole 视为关键人物依赖，并索取正式治理和继任材料，不要仅凭职衔推断控制权。
