              AG1 在日常使用者中保持较强口碑，但临床审视、产品安全询问和品类竞争加剧，都在挑战长期客户稳定性。McGill University
              公共卫生研究者的学术评论认为，均衡饮食的健康成年人从昂贵专有补充剂粉中获得的临床益处微乎其微；过量水溶性维生素会排出体外，未量化的适应原混合物也缺乏严格的人体证据。此外，调查报道指出，有一百多起消费者不良事件投诉提交给
