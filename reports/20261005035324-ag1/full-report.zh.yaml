        title: 资本充足性、战略融资依赖与投资评估结论
        blocks:
          - type: paragraph
            body: >-
              从资产负债表看，相较风投支持的同业，AG1 保持较强偿付能力和资本独立性。2010 年创立后自筹经营十余年，公司于 2022 年 1 月完成由 Alpha Wave Global 领投的 $115M
              股权融资，投前估值 $1.2B。由于融资后持续盈利，管理层没有面临近期现金跑道耗尽或被迫稀释式重组。相反，经营现金流支撑了持续资本承诺，包括宣布用于 2025–2028 年的 $20M
              多年临床科学预算，以及全国零售铺开的前置库存。2026 年初，财经媒体报道 AG1 聘请 Goldman Sachs 探索战略流动性方案，包括企业价值超过 $2B
              的潜在出售或资本重组。然而，完全缺少经审计财务报表、未经验证的订阅者流失动态和不透明的零售利润让步，构成阻碍机构投资评估的重大尽调障碍。
            claimRefs:
              - CI014
              - CI015
              - CI016
