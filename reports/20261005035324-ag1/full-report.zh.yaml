      - number: '3.2'
        title: 广度与信任信号支撑溢价，但证据并不定论
        blocks:
          - type: paragraph
            body: >-
              AG1 把广泛的一站式主张与 NSF Certified for Sport
              定位结合起来，简单低价绿色粉末很难同时匹配其信任和便利。但产品广度不等于剂量透明：竞争者对比强调完整配方披露、有机认证或更高的益生菌数量。即使当前成分数在不同来源间也无法干净比较——2026 年竞争者页面称
              Next Gen 配方含 83 种成分，而当前零售报道仍称含 75 种维生素、营养素和矿物质。这种不一致可能源于版本或简称；没有最新标签和分析证书，就无法可靠地逐项比较功效。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
