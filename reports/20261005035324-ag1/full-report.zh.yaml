            - label: 高
              tone: risk
            - label: 高
              tone: risk
            - label: 快速推出软糖和多包装旅行装
        - label: DTC 订阅者疲劳与高流失
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 通过 Target、Costco 和 Amazon 进入大众零售
        - label: 创始人过往刑事定罪再次浮现
          values:
            - label: 低
              tone: positive
            - label: 高
              tone: risk
            - label: 管理层领导权完整过渡至 Kat Cole
        - label: 83 种成分供应链中断
          values:
            - label: 中
              tone: warning
            - label: 中
              tone: warning
            - label: NSF Certified for Sport 设施和批次检测
