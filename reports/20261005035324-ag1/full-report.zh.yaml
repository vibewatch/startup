      - number: '3.4'
        title: 护城河来自商业能力，而非产品结构锁定
        blocks:
          - type: paragraph
            body: >-
              最有力证据支持一种由知名度、复购、检测资质和更广货架覆盖构成的商业护城河，但不能证明配方、临床结果或供应上的持久独占。对 30 名健康成年人进行的四周随机试验是有价值的成品证据点，但部分由 AG1 资助、作者包括
              AG1 员工，且消化相关生活质量差异为
              p=0.058，并未达到传统统计显著性。与此同时，低起订量贴牌供应和透明的低价配方增加了商品化压力。投资评估的关键是：买方可以并排比较规格和价格后，零售分销与品牌信任能否维持留存和毛利率；公开证据尚未回答。
