  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、SKU 架构与消费者流程
        blocks:
          - type: paragraph
            body: >-
              AG1 将旗舰配方定位为基础营养日饮，靠把复合维生素、矿物质、益生元、益生菌和植物营养素合并为每日 12 克一份，替代复杂的多药片方案 [CE001, CE002]。品牌 2010 年以 Athletic
              Greens 单一主力 SKU 上市，之后 15 年聚焦 DTC 订阅；2025 年以 AGZ 开始扩充目录，这款夜间配方用于衔接用户每日健康习惯 [CE003, CE004]。后续加入 AG1 Next
              Gen、AG1 Pro 和 AG1 Essentials Gummies，主动吸引因晨间粉末的口味或习惯摩擦而犹豫的普通补充剂消费者
              [CE005]。十余年来，消费者入门紧密围绕入门套装，包括金属罐、摇摇杯、习惯追踪器和 Vitamin D3+K2 等配套营养滴剂 [CE004, CE005]。但 2025 和 2026 年 AG1 进入
              Target、Costco、Amazon、The Vitamin Shoppe 等大众零售后，实物交付流程发生根本变化，推出 7 袋、14 袋旅行装及零售专属的 'Start Here' 套装，以降低首次购买承诺
