      - number: '4.2'
        title: 单位经济性、营销效率与成本驱动
        blocks:
          - type: paragraph
            body: >-
              AG1 的单位经济性体现为高毛利率制造，抵消了沉重的获客和品牌营销费用。实物产品采用代工，约 2022 年从新西兰 Alaron 转至 Utah 的 Capstone Nutrition
              以应对增量。原材料清单和包装估计占零售价 15% 至 25%；履约和包装改进——例如 2025 年重做首月 Welcome Kit，使纸质包装重量减少
              40%——部分抵消了运费上涨。但销售和营销效率是最大的运营现金消耗。行业基准和补充剂咨询分析估计，获客成本、影响者联盟佣金（每笔转介绍销售平均约 20%）以及激进的播客赞助（The Tim Ferriss
              Show、Huberman Lab、The Joe Rogan Experience 等头部节目合计估计每月 $2.2M）会吞噬 DTC 收入的 30% 至 40%。由于 AG1
              未公开披露订阅者队列、净收入留存（NRR）或月度订阅者流失率，投资者无法独立确定稳态回本周期或真实客户终身价值（LTV）。
