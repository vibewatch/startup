      - number: '5.2'
        title: 营养机制、生物利用度证据与配方可防御性
        blocks:
          - type: paragraph
            body: >-
              AG1 核心配方混合约 75 至 83 种成分，按功能组成碱性营养浓缩物、植物提取物、消化酶，以及由 Lactobacillus acidophilus（3.6B CFU）和 Bifidobacterium
              bifidum（3.6B CFU）组成的合生元组合 [CE001, CE002, CE007]。利用人体肠道微生物生态系统模拟器（SHIME）的临床前研究显示，与矿物质组成相同的压片复合维生素相比，AG1
              粉末对镁、锌、钙的体外矿物质溶出、生物可及性和生物利用度更优 [CE008]。后续体外肠道屏障模型显示，发酵 AG1 结肠悬液在炎性巨噬细胞攻击后仍维持 99.89%
              的跨上皮电阻（TEER），相较空白载体对照体现出统计显著的 7.0% 屏障保护优势 [CE009]。在人类临床评估中，一项对 30 名健康成年人进行的 4
              周双盲随机安慰剂对照试验记录了安全性：肝肾代谢面板没有不良变化，摄入的益生菌菌株得到分类学富集，消化相关生活质量评分提高 62.5%
              [CE007]。尽管有这些针对性发现，独立营养学者指出证据仍属初步：健康人通常可从饮食满足基础微量营养素需求，活性益生菌无法在软糖剂型中存活，而将 75+ 种成分合入专有混合配方，阻碍了对单个成分功效的独立验证
              [CE002, CE005, CE010]。
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
