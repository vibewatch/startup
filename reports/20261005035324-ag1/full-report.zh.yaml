  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定位与现状替代品
        blocks:
          - type: paragraph
            body: >-
              AG1 处在膳食补充剂、高端绿色粉末和肠道健康合生元的交叉地带，将粉末配方定位为维生素、益生菌、益生元和适应原的每日一份替代品 [CM001, CM002]。全球膳食补充剂市场在 2020 年增长
              26.9%，专业绿色粉末市场预计到 2028 年达到 $673.1 million [CM003]。在这片消费支出中，AG1
              瞄准消费者自我护理和基础健康预算，刻意排除处方医疗、合成单一维生素药片和传统全食杂货支出 [CM001,
              CM004]。现状替代品从低价普通复合维生素片、益生菌酸奶到全食水果蔬菜饮食不等；后者经济门槛仍高，因为每天摄入推荐量果蔬的美国人不到十分之一 [CM004, CM005]。随着消费者认知成熟，AG1 不仅面对
              Amazing Grass、Nested Naturals 等直接绿色粉末竞争，也面对绿色软糖等替代剂型；Unilever 以 $1.2 billion 收购竞争者 Grüns 就凸显了这一点 [CM006]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM007
      - number: '2.2'
        title: 受证据约束的市场规模与变现视角
        blocks:
          - type: paragraph
            body: >-
              评估 AG1 的可服务市场，必须区分广泛的消费者补充剂使用与高端经常性订阅支出。超过 57% 的美国成年人称每月服用膳食补充剂，约 24% 至 39% 经常服用复合维生素，形成庞大的潜在消费者池
              [CM007]。商业层面，AG1 年收入从 2021 年的 $160 million 增至 2024 年约 $600 million，显示其抓住了相当大的品类份额；公司背后还有一轮 $115 million
              风投融资，估值为 $1.2 billion [CM008, CM009]。但这一收入规模并不等于不受约束的数十亿美元 TAM：AG1 直接订阅每月收费 $79，单次购买 $99，折合每天近 $3 [CM002,
              CM010]。由于现有资料没有提供统一 TAM/SAM/SOM 金额拆分或历史品类 CAGR 的经审计市场研究，市场规模应视为多个独立证据视角，而非一个推测数字 [CM003, CM008]。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方分层、预算归属与渠道扩张
        blocks:
          - type: paragraph
            body: >-
              AG1 按不同健康人群细分可服务市场，针对家长、职场人士、跑者和健身爱好者制作数字广告素材 [CM011]。Dr. Andrew Huberman、Joe Rogan 和 Lex Fridman
              等知名播客主的背书，是主要漏斗转化机制，把影响力信任转化为经常性 DTC 订阅 [CM001, CM011]。家庭预算通常由富裕个人或重视健康的家长掌握，用于可选健康支出 [CM004, CM011]。DTC
              订阅曾是 AG1 15 年来的唯一增长引擎；公司在 2025 和 2026 年启动多渠道零售扩张，进入 Target、Amazon、Costco 和 The Vitamin Shoppe [CM006,
              CM012]。零售分销带来更低门槛的入门规格，包括 7 袋和 14 袋旅行装，面向不愿承诺每月持续支付 $79 的大众零售消费者 [CM006]。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动、摩擦点与尽调约束
        blocks:
          - type: paragraph
            body: >-
              消费者对一站式便利、消化健康优化和 NSF Certified for Sport、TGA 注册生产等经验证安全资质的需求，推动了采用 [CM001, CM003, CM005]。一项为期 4
              周的双盲随机临床试验显示，AG1 能在健康成年人中安全增加 Lactobacillus acidophilus 和 Bifidobacterium bifidum 等有益益生菌菌株
              [CM013]。但采用势头也受结构性约束。McGill University 和 Harvard Medical School 的营养学者批评 AG1
              的主张，指出营养充足的人从昂贵复合维生素粉中获得的预防性健康益处很小 [CM001, CM004]。此外，专有混合配方隐藏单个成分剂量，限制了独立药代动力学评估 [CM014]。Better Business
              Bureau 投诉也暴露消费者摩擦：滚动续订和取消流程是常见争议类别 [CM014]。长期可获得市场规模取决于大众零售能否在 DTC 订阅获客趋于饱和时维持单位经济性 [CM006, CM014]。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 便利性以类似高端 SaaS 的倍数销售基础营养
            body: >-
              AG1 的市场成功来自把复合维生素、益生菌、益生元和适应原装进一套晨间习惯。它把粉末定位为 4 至 5 瓶独立药片的一站式替代品，从而支撑 $79/month 订阅价格，并带来 $600 million 年收入
              [CM001, CM002, CM008]。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM008
          - type: callout
            title: 大众零售转型考验毛利率与品牌独占性
            body: >-
              DTC 订阅推动了 AG1 的前 15 年，但进入 Target、Costco 和 Amazon 后，需要更低价的包装规格，并让出零售商利润。与 Unilever 等 CPG 巨头竞争（Unilever 曾以
              $1.2B 收购 Grüns）还需要大量货架营销和包装调整 [CM006, CM012]。
            calloutType: risk
            claimRefs:
              - CM006
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方有多种方式解决同一需求
        blocks:
          - type: paragraph
            body: >-
              AG1 面对的不只是绿色粉末竞争。直接同业把绿色粉末、维生素、益生菌和适应原打包；聚焦型产品则在有机来源、剂量披露、口味或价格上竞争；Grüns
              等软糖降低准备门槛；普通贴牌粉末也让内部创牌在技术上可行。现状替代同样重要：买方可以继续服用复合维生素或益生菌组合，购买完整蔬菜，或什么都不吃。现有资料没有披露多数私营同业可比的融资、客户数或实际渠道经济性，因此公开排名不应暗示规模相当。最有依据的分层应按买方需求和产品架构，而不是无依据的市场份额估计。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
