  - id: FP001
    title: 按组合广度与信任信号定位竞争
    type: quadrant
    summary: AG1 位于高广度、高信任象限，但一些替代品凭借更低价格、有机定位、剂量透明度或更便捷的形态切入其中一个维度。
    data:
      xAxis:
        label: 组合广度
        min: 1
        max: 5
      yAxis:
        label: 公众信任信号
        min: 1
        max: 5
      points:
        - label: AG1
          x: 5
          'y': 5
          note: 组合广泛且有 NSF sport 信号；成分数量版本相互冲突。
        - label: Green Vibrance
          x: 4
          'y': 4
          note: 组合广泛、声称透明的竞争对手；缺少 AG1 报告的运动认证。
        - label: Field of Greens 品牌
          x: 3
          'y': 4
          note: 更窄的全食物配方，采用发行方声称的 USDA Organic 定位。
        - label: Live it Up 品牌
          x: 3
          'y': 2
          note: 高性价比配方，有品牌报告的检测，但无运动认证。
        - label: Bloom
          x: 3
          'y': 2
          note: 以口味为主、容易尝试的产品；混合配方剂量透明度有限。
        - label: Huel Daily Greens
          x: 5
          'y': 3
          note: 来自规模化品牌的广泛组合；未报告 NSF sport 标志。
        - label: Private label
          x: 2
          'y': 1
          note: 供应易得，但检测、信任和需求创造尚未得到证明。
    approximationNotes: 分析师按序评分为 1（低）至 5（高），不是实测市场数据。广度反映声明的组合范围；信任反映披露的认证、透明度、经审阅的人体证据和发布方提示。评分不衡量功效。
