              - CR014
      - number: '7.2'
        title: 运营复杂性、配方完整性与临床边界
        blocks:
          - type: paragraph
            body: >-
              AG1 核心粉末整合 75 至 83 种维生素、矿物质、适应原和合生元成分，使运营暴露于原料批次严重波动、农业农药或重金属污染及跨洲供应商协调风险 [CR006]。AG1 虽用 NSF Certified for
              Sport 检测验证无禁用物质和重金属 [CR007]，已发表临床评估仍显示结构性边界。一项 30 人、为期四周的随机双盲试验显示特定益生菌分类群（Lactobacillus acidophilus 和
              Bifidobacterium bifidum）富集、短期消化耐受性改善，但明确限于健康成年人和 4 周观察期，没有评估多年系统性健康结果
              [CR008]。软糖、能量粉、睡眠辅助剂（AGZ）和即饮罐装产品快速增加，实质上分散质量保证成本，也削弱技术可防御性 [CR009]。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR008
              - CR009
      - number: '7.3'
        title: 渠道摩擦、价格敏感与竞争侵入
        blocks:
          - type: paragraph
            body: >-
              AG1 主要靠每月 $79 至 $99 的 DTC 订阅，建立了报道中的 $600 million 收入基础 [CR010, CR011]。但要靠播客和影响者背书维持获客势头，就需要折扣机制，包括最高 27%
              折扣的促销券和双订阅批量配送折扣 [CR012]。为保持收入增长，AG1 进入 Target、Amazon、Costco 和 The Vitamin Shoppe 等大众零售渠道，推出更小的 7 袋、14
              袋旅行规格 [CR013]。这一零售推进让 AG1 面临零售商抽成、库存持有风险，以及消费集团的直接货架竞争；Unilever 收购竞争者 Grüns（$1.2 billion）就是例证
              [CR014]。此外，Target 包装变化要求把复杂科学营销简化为简短功能卖点，存在品牌稀释风险 [CR015]。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 论点破坏触发因素：FTC 执法、肝脏调查与零售利润崩塌
            body: >-
              AG1 的投资论点在三项可测触发因素出现时失效：(1) FTC 或 FDA 正式执法，挑战核心结构 / 功能主张或要求移除专有混合物标签；(2) 确认系统性肝毒性或不良污染并要求强制召回；或 (3)
              大众零售进场费、分销商降价和与 Grüns 等集团支持的竞争者激烈价格战导致毛利率跌破 60% [CR001, CR007, CR014]。
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议逻辑
        blocks:
          - type: paragraph
            body: >-
              AG1 作为领先消费健康品牌展现了显著商业牵引力，收入从 2021 年的 $160 million 增至 2024 年自报的 $600 million [CV001, CV002]。公司过去依靠以每月 $79
              旗舰基础营养粉为核心的高毛利率 DTC 订阅引擎，在为内部产品开发和临床试验提供资金的同时保持多年盈利 [CV002, CV003, CV004]。2025 和 2026 年，在 CEO Kat Cole
              领导下，AG1 有意转向全渠道，推出第二款产品 AGZ，并进入 Costco、Amazon、The Vitamin Shoppe 和全国 Target 门店等大众零售 [CV003,
              CV005]。零售扩张使门店数大幅翻倍，并把漏斗顶部获客拓展到传统数字播客和影响者联盟渠道之外 [CV003, CV006]。


              尽管商业里程碑可观，机构投资论点仍面临关键评估障碍。AG1 仍是私营、风投支持企业，没有披露经审计资产负债表、现金流量表、毛利率或净收入留存（NRR）数据 [CV007, CV008]。公司 2022 年 1
              月完成由 Alpha Wave Global 领投的 $115 million Series B，报道投后估值超过 $1 billion（二级市场基准为 $1.2 billion 至 $1.3
              billion）；但 2026 年估值支撑受到零售利润稀释和激烈品类竞争影响 [CV009, CV010, CV011]。竞争者 Grüns 被 Unilever 以报道的 $1.2 billion
              收购，验证了机构对日常营养补充剂的兴趣，却也凸显货架空间迅速被侵蚀 [CV003]。学术研究者和营养师仍在质疑高价专有多营养素粉相较标准饮食来源的临床功效和必要性 [CV012,
              CV013]。由于二级市场买卖价深度有限且没有活跃 S-1 申报，建议明确为 TRACK：中等信心、高风险评级、公允估值立场 [CV007, CV010]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
