              - CV007
              - CV010
              - CV012
      - number: '8.2'
        title: 资本结构、融资历史与估值标记
        blocks:
          - type: paragraph
            body: >-
              相较软件独角兽，AG1 资本化基础较精简，两轮主要机构融资累计 $125 million [CV009, CV014]。Chris Ashenden 2010 年创立后自筹十余年，公司于 2021 年 5 月完成
              $9.6 million Series A，随后于 2022 年 1 月完成由 Alpha Wave Global 领投、SC.Holdings 和 Bolt Ventures 参与的 $115 million
              Series B [CV002, CV009, CV014]。Series B 使 AG1 成为消费独角兽，初始投后估值超过 $1 billion，之后在私营二级平台上以 $1.2 billion 至 $1.3
              billion 为基准 [CV002, CV006, CV010]。机构支持还伴随知名经营者、运动员和媒体人士的战略投资，包括 Mark Vadon 和 Dr. Peter Attia [CV002]。


              Forge Global 二级市场交易显示隐含历史基准估值为 $1.30 billion，但流动性仍标为 'Limited'，2026 年没有可用的活跃 Forge Price 或撮合交易量
              [CV010]。AG1 用经营现金流为运营和扩张提供资金，因此 2022 年后没有再进行股权融资，现有股东免受近期风投下轮融资压力 [CV003, CV014]。不过，$115 million Series B
              的潜在清算优先权，加上 Ashenden 2024 年辞职后员工期权池或创始人二级出售不透明，为潜在二级买家制造结构性不确定性 [CV006, CV007]。按其报道的 2024 年 $600 million
              收入计算，估计企业价值倍数为 2.0x 至 2.2x，表面进入估值相对品牌消费同业合理；但缺少经验证 EBITDA 利润率，使下行风险没有对冲 [CV001, CV007, CV010]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV012
              - CV015
      - number: '8.3'
        title: 情景分析、退出准备度与尽调标准
        blocks:
          - type: paragraph
            body: >-
              为在三年周期内模拟 AG1 的风险调整股权回报，我们设定乐观、基准和悲观情景，评估收入轨迹、渠道利润拆分和退出倍数。基准情景（50% 概率）下，AG1 维持核心 DTC 订阅留存，同时 Target、Costco
              和 Amazon 批发量扩张，收入温和增至 $750 million，并通过并购或成长股权重组实现 2.0x EV/收入退出倍数（$1.50 billion 估值）[CV001, CV003,
              CV010]。乐观情景（25% 概率）下，零售渠道采用加快国际品牌知名度，AGZ 第二产品附着率扩大到订阅者购物车的 15% 以上，临床安全验证支撑溢价价格持续，收入在 IPO 中按 2.8x 倍数达到 $950
              million（$2.66 billion 估值）[CV003, CV005, CV015]。


              相反，悲观情景（25% 概率）假设下行压力显著，估值压缩至 $720 million（$600 million 收入的 1.2x 倍数）[CV001,
              CV010]。下行催化因素包括订阅流失导致客户终身价值（LTV）恶化，零售贸易补贴、分销费用、包装改造压缩毛利率，以及科学和医学界持续质疑产品功效与成本合理性 [CV003, CV012,
              CV013]。投入资本前，机构尽调必须解决关键缺口：取得涵盖 FY2023–FY2025 的经审计财务报表，审计多年订阅者队列留存曲线，确认各零售伙伴的毛利率，并审阅股权结构优先权条款 [CV007,
              CV008]。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV010
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 投资纪律：财务披露前维持 TRACK
            body: >-
              AG1 将高端营养粉扩展到 $600M 年收入，同时维持自筹盈利，证明了出色的产品市场匹配和运营韧性 [CV001, CV003]。但从高毛利率数字 DTC 订阅转向 Target、Costco
              等资本密集型大众零售，代表单位经济性发生结构变化 [CV003, CV005]。在没有经验证的毛利率、分销商补贴、队列流失和优先权悬置披露前，机构资本应避免参与二级交易，从场外观察执行 [CV007,
              CV008, CV010]。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV010
