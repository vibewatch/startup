      - number: '1.3'
        title: 规模、经济性与资本透明度
        blocks:
          - type: paragraph
            body: >-
              最有力的公开规模数据来自公司自报而非审计：AG1 称 2024 年年收入为 $600 million 且实现盈利。这是收入，不是 ARR；Modern Retail 和 Wikipedia
              都未提供经审计报表、利润率、现金创造、流失率或渠道构成。Modern Retail 2026 年报道中，订阅价格仍为每月 $79，单次购买为 $99；McGill 2024 年的评论也独立引用了每月
              $79，同时质疑其对许多消费者的价值。Wikipedia 报道截至 2025 年 1 月估值为 $1.2 billion，但现有证据无法确认交易、证券类型、投后基础，也无法确认该数字在 2026 年 10
              月运行日是否仍有效。累计融资、债务、二级交易、投资者权利和可用现金仍是信息缺口，不应从收入、盈利说法或估值中推断。
            claimRefs:
              - CO007
              - CO011
              - CO016
      - number: '1.4'
        title: 里程碑与证据质量
        blocks:
          - type: paragraph
            body: >-
              AG1 最近的里程碑显示出有意的多元化。公司于 2025 年 5 月推出 AG1 Next Gen，并承诺在随后三年投入超过 $20 million 研究经费。2025 年，公司加入 AGZ、Amazon 和
              Costco 分销；The Vitamin Shoppe 随后于 2026 年 1 月在超过 640 家门店推出 AG1，Target 上架则据管理层称使销售该品牌的门店数翻倍。产品证据需要保留限定。一项对 30
              名健康成年人进行、持续四周的随机安慰剂对照研究称临床安全指标没有显著恶化，并显示潜在消化益处；但研究部分由 AG1 资助，作者中有两名 Athletic Greens 员工。McGill 的 Office for
              Science and Society 另称，许多成分及广泛益处的证据并不扎实。这些信息支持公司确实在开展研究，但不能据此推断所有营销主张都已获独立证实。
