  topStrengths:
    - 对一家单 SKU 营养品公司而言，品牌认知度和高端定位依然异常强。
    - Amazon、Costco、The Vitamin Shoppe 和 Target 的零售扩张拓宽了分销触达。
    - 公司披露的收入规模和临床试验进展，说明业务确实有运营动能。
  topRisks:
    - 经审计财务报表、毛利率和现金流细节仍未公开。
    - 零售扩张之际，留存、流失和渠道层面的经济性仍未披露。
    - 股权结构表、优先权结构和当前估值依据仍不透明。
  unresolvedGaps:
    - 经审计财务报表：毛利率、EBITDA 利润率、经营现金流和资产负债表均未公开，无法独立评估财务状况。
    - 净收入留存率（NRR）和月度流失率：关键订阅健康度指标仍未披露；根据市场代理指标估计为 80–90%，但尚未确认。
    - FDA 不良事件调查的处理结果：FDA 针对肝损伤不良事件报告展开调查，其当前状态、范围和执法风险仍未确认。
    - 股权结构表和优先权结构：清算优先权倍数、反稀释条款和创始人持股情况均未知；在低于 $1.5B 的退出情景中，优先权负担可能显著损害普通股权益。
    - 零售渠道收入贡献和利润率影响：公司未披露零售与 DTC 的收入拆分，也未披露各渠道毛利率，因此零售规模扩大后的盈利可持续性无法验证。
    - IPO 或退出时间表：尽管 CEO 曾表示公司拥有“多种路径可选”，但目前没有已确认的 IPO 申报、S-1 或战略进程时间表；老股交易活动有限，且没有可用的 Forge Price。
