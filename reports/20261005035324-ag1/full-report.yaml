              - CU009
              - CU010
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration and Efficacy Risk in Customer Retention
            body: >-
              AG1's business model relies disproportionately on maintaining long-term $79/month subscriptions for a
              product that independent clinical experts argue offers questionable necessity for healthy individuals. If
              regulatory scrutiny regarding adverse liver complaints intensifies or consumer fatigue with high-priced
              greens sets in, subscriber churn could accelerate before wholesale retail channels achieve compensatory
              scale.
            calloutType: risk
            claimRefs:
              - CU004
              - CU011
