      - number: '1.3'
        title: Scale, economics, and capital visibility
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale datapoint is company-reported rather than audited: AG1 said it generated $600
              million of annual revenue in 2024 and was profitable. This is revenue, not ARR, and neither Modern Retail
              nor Wikipedia supplies audited statements, margins, cash generation, churn, or channel mix. The consumer
              proposition was still priced at $79 per month for a subscription and $99 for a one-time purchase in Modern
              Retail's 2026 reporting; McGill's 2024 critique independently cited the $79 monthly price while
              questioning value for many consumers. Wikipedia reports a $1.2 billion valuation as of January 2025, but
              the assigned evidence does not establish the transaction, security, post-money basis, or whether that
              figure remained current at the October 2026 run date. Total funding raised, debt, secondary transactions,
              investor rights, and cash available remain gaps and should not be inferred from revenue, profitability
              claims, or valuation.
