chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              AG1, formerly Athletic Greens, was founded by Chris Ashenden in 2010 and is described as a private
              American supplements company headquartered in Carson City, Nevada. Its original model concentrated demand
              into one greens powder sold directly through subscriptions: Modern Retail reports that AG1 remained
              direct-to-consumer for its first 15 years and sold only that product during the period. That concentration
              helped create a simple recurring-revenue proposition, but it also made the company dependent on one
              formulation, one premium price point, and paid or creator-led customer acquisition. The model is now
              broadening. AG1 added AGZ and moved into Amazon, Costco, The Vitamin Shoppe, and Target during 2025-2026,
              changing the business from a subscription-led single-product brand into a multi-product, multichannel
              consumer-health platform. The transition may expand reach while introducing retail margin, sell-through,
              and channel-conflict questions not answered by public disclosures.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
