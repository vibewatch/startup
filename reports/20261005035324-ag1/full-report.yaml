              - CP007
              - CP008
              - CP011
              - CP012
      - number: '3.4'
        title: The moat is commercial rather than structurally product-locked
        blocks:
          - type: paragraph
            body: >-
              The best evidence supports a commercial moat built from awareness, recurring purchasing, testing
              credentials, and widening shelf access. It does not establish durable exclusivity in formulation, clinical
              outcomes, or supply. A four-week randomized trial in 30 healthy adults provides a legitimate
              finished-product proof point, but it was funded in part by AG1, included AG1 employees as authors, and
              reported a digestive-quality-of-life difference at p=0.058 rather than conventional statistical
              significance. Meanwhile, low-minimum-order private-label supply and transparent lower-cost formulas
              increase commoditization pressure. The underwriting question is whether retail distribution and brand
              trust can preserve retention and gross margin once buyers can compare formats and prices side by side;
              public evidence does not answer that yet.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is becoming a more important moat component
            body: >-
              Amazon, Costco, The Vitamin Shoppe, and Target extend trial access beyond the original subscription
              funnel; management said Target would double AG1's retail doors.
            calloutType: strength
            claimRefs:
              - CP009
              - CP015
          - type: callout
            title: Retention economics are the missing durability test
            body: >-
              Public evidence does not disclose churn, cohort retention, realized discounts, or channel-level gross
              margin, so brand reach cannot yet be translated into durable customer lifetime value.
            calloutType: risk
            claimRefs:
              - CP011
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Architecture, and Channel Diversification
        blocks:
          - type: paragraph
            body: >-
              AG1 historically scaled as a direct-to-consumer (DTC) subscription business centered almost exclusively on
              its flagship green powder formula. The company reported $160M in annual revenue in 2021 before expanding
              to roughly $600M in revenue for 2024 while sustaining positive operating profitability. The primary
              monetization mechanism is a monthly recurring subscription priced at $79 per month ($2.63 per 30-serving
              pouch), compared against an ala carte one-time purchase price of $99 per pouch. To drive customer lifetime
              value and raise average order value (AOV), AG1 introduced bundled subscription stacks including the Full
              Foundation Stack ($108/month) and Day & Night sleep system with AGZ ($148/month). In 2025 and 2026, the
              company initiated a structural distribution pivot into wholesale and omnichannel retail, launching
              dedicated travel sachets and trial packs across Costco (40-sachet pack at $72.99, or $1.82 per serving),
              Target (7-count and 14-count travel packs alongside start-here kits), and The Vitamin Shoppe. While retail
              distribution doubles consumer touchpoints and lowers trial friction for consumers unwilling to commit to
              an ongoing $79 monthly charge, wholesale wholesale-discount architecture and stocking terms dilute
              realized per-serving revenue compared to the legacy high-margin DTC channel.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
