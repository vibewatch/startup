              - CP009
              - CP010
              - CP012
      - number: '3.2'
        title: Breadth and trust signals support the premium, but proof is not conclusive
        blocks:
          - type: paragraph
            body: >-
              AG1 combines a broad all-in-one proposition with NSF Certified for Sport positioning, a package that is
              harder for a simple low-cost greens powder to match on trust and convenience. Yet breadth is not the same
              as transparent dosing: competitor-issued comparisons emphasize fully disclosed formulas, organic
              certification, or higher stated probiotic counts. Even the current ingredient count is not cleanly
              comparable across sources—2026 competitor pages describe an 83-ingredient Next Gen formula, while current
              retail reporting still describes 75 vitamins, nutrients, and minerals. That inconsistency may reflect
              versions or shorthand, but it makes a cell-by-cell efficacy comparison unreliable without current labels
              and certificates of analysis.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
