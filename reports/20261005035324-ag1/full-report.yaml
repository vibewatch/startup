      - number: '4.2'
        title: Unit Economics, Marketing Efficiency, and Cost Drivers
        blocks:
          - type: paragraph
            body: >-
              AG1's unit economics reflect a high gross margin manufacturing profile balanced by heavy customer
              acquisition and brand marketing expenses. The physical product is produced via contract manufacturing,
              having transitioned from Alaron in New Zealand to Capstone Nutrition in Utah around 2022 to handle
              increased volume. The raw bill-of-materials and packaging represent an estimated 15% to 25% of retail
              price, but fulfillment and packaging improvements—such as redesigning the first-month Welcome Kit in 2025
              to reduce paper packaging weight by 40%—partially offset freight inflation. However, sales and marketing
              efficiency represents the largest operational cash sink. Industry benchmarks and supplement consultancy
              analyses estimate that customer acquisition costs, influencer affiliate payouts (averaging roughly 20%
              commission per referral sale), and aggressive podcast sponsorships (estimated at $2.2M monthly across top
              shows such as The Tim Ferriss Show, Huberman Lab, and The Joe Rogan Experience) absorb 30% to 40% of
              top-line DTC revenue. Because AG1 does not publicly disclose subscriber cohorts, net revenue retention
              (NRR), or monthly subscriber churn rates, investors cannot independently determine the steady-state
              payback period or true customer lifetime value (LTV).
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.3'
        title: Capital Adequacy, Strategic Financing Dependency, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              From a balance sheet perspective, AG1 maintains strong solvency and capital independence relative to
              venture-backed peers. After operating as a bootstrapped enterprise for over a decade following its 2010
              founding, the company secured a $115M equity financing round in January 2022 led by Alpha Wave Global at a
              $1.2B pre-money valuation. Because AG1 has operated profitably since that financing round, management has
              not faced near-term runway exhaustion or mandatory dilutive recapitalizations. Instead, operating cash
              flows have funded ongoing capital commitments, including a $20M multi-year clinical science budget
              announced for 2025–2028 and upfront inventory staging for nationwide retail rollouts. In early 2026,
              financial media reported that AG1 retained Goldman Sachs to explore strategic liquidity alternatives,
              including a potential sale or recapitalization exceeding $2B in enterprise value. Nevertheless, the
              complete absence of audited financial statements, unverified subscriber churn dynamics, and opaque retail
              margin concessions constitute material diligence blockers that prevent institutional underwriting.
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Omnichannel Margin Trade-off
            body: >-
              AG1's expansion from a pure-play $79/month DTC subscription into retail partners like Costco
              ($1.82/serving) and Target lowers customer trial friction but structurally compresses gross margins and
              introduces working capital payment cycles.
            calloutType: insight
            claimRefs:
              - CI005
              - CI007
          - type: callout
            title: Private Disclosure and Retention Opacity
            body: >-
              The lack of public disclosures regarding cohort retention, monthly churn rates, and audited COGS leaves
              investors unable to confirm whether marketing payback periods remain stable as acquisition costs escalate.
            calloutType: risk
            claimRefs:
              - CI010
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, SKU Architecture, and Consumer Workflow
        blocks:
          - type: paragraph
            body: >-
              AG1 positions its flagship formulation as a foundational nutritional daily drink engineered to displace
              complex multi-pill regimens by combining multivitamins, minerals, prebiotics, probiotics, and
              phytonutrients into a single 12-gram daily serving [CE001, CE002]. Originally launched in 2010 as Athletic
              Greens with a single hero SKU, the brand maintained a 15-year direct-to-consumer subscription focus before
              initiating catalog expansion in 2025 with AGZ, a complementary nighttime formulation designed to bookend
              the user's daily wellness routine [CE003, CE004]. Further catalog extension includes AG1 Next Gen, AG1
              Pro, and AG1 Essentials Gummies, reflecting an active effort to capture casual supplement consumers who
              experience taste or habit friction with morning powders [CE005]. For over a decade, consumer onboarding
              was tightly anchored around an introductory kit containing a metal canister, shaker bottle, habit tracker,
              and companion nutrient droppers such as Vitamin D3+K2 [CE004, CE005]. However, the physical delivery
              workflow has fundamentally shifted in 2025 and 2026 as AG1 expanded across mass retail channels including
              Target, Costco, Amazon, and The Vitamin Shoppe, introducing 7-count and 14-count travel packs alongside
              retail-specific 'Start Here' kits to lower initial purchase commitment [CE003, CE006].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
