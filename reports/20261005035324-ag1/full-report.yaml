              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.3'
        title: Distribution is strengthening as product switching remains easy
        blocks:
          - type: paragraph
            body: >-
              Current public pricing places AG1 at $79 per month on subscription and $99 for a one-time purchase, before
              any version-specific shipping terms. That premium is exposed to products advertised at roughly $0.90 to
              $2.90 per serving, although those figures come largely from affiliate or competitor pages and are list
              prices rather than realized revenue. AG1 is offsetting direct-to-consumer saturation by adding Amazon,
              Costco, The Vitamin Shoppe, and Target; management told Modern Retail the Target launch would double its
              retail doors. Distribution reach and habit can raise practical switching friction, but there is no
              disclosed contract lock-in, proprietary device, or workflow integration. Consumers can cancel, multi-home,
              or substitute a different powder, pills, gummies, or food.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
              - CP011
              - CP015
          - type: table
            tableRef: TP003
