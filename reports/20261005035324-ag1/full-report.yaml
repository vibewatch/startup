      - number: '6.2'
        title: Adoption Trajectory, Volume Scale, and Wholesale Channel Transition
        blocks:
          - type: paragraph
            body: >-
              AG1's adoption trajectory reached roughly $600 million in profitable annual revenue by 2024, supported by
              hundreds of thousands of active monthly subscribers across North America, Europe, and Oceania. Despite
              this commercial momentum, management recognized that requiring upfront subscription commitment of $79 per
              month—or a steep $99 one-off purchase price—created substantial top-of-funnel conversion friction for
              consumers unfamiliar with green powder supplements. To sustain growth and tap uncommitted mass shoppers,
              Chief Executive Officer Kat Cole orchestrated an aggressive multi-channel retail rollout across 2025 and
              2026. The company launched nationwide on Amazon and Costco, followed by The Vitamin Shoppe and a
              comprehensive rollout into all Target stores featuring custom end caps with 7-count and 14-count travel
              packs and starter kits designed to lower the adoption barrier.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
