  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Scrutiny, Claim Substantiation, and Governance Fallout
        blocks:
          - type: paragraph
            body: >-
              AG1 operates in the dietary supplement market under DSHEA regulatory boundaries, where products are not
              subject to pre-market FDA efficacy approval. Independent academic nutrition scientists from institutions
              such as McGill University and Harvard Medical School have publicly criticized AG1's marketing claims,
              pointing to a lack of rigorous, large-scale clinical trials and noting that proprietary blends obscure
              individual ingredient dosages [CR001, CR002]. Furthermore, critics have noted that for healthy adults with
              balanced diets, routine high-dose multivitamin smoothies represent an unnecessary expense with negligible
              preventive health benefit [CR003]. The company was originally founded in 2010 by Chris Ashenden, who
              resigned in October 2024 following public scrutiny regarding 2011 criminal convictions in New Zealand for
              a property scheme [CR004]. Although Kat Cole assumed the chief executive role to stabilize institutional
              governance and scale partnerships [CR005], residual reputational and key-person fallout persists across
              institutional investor and corporate partner circles.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
