              - CO011
              - CO016
      - number: '1.4'
        title: Milestones and evidence quality
        blocks:
          - type: paragraph
            body: >-
              AG1's recent milestones show deliberate diversification. The company launched AG1 Next Gen in May 2025,
              paired with a company commitment to invest more than $20 million in research over the following three
              years. It added AGZ, Amazon, and Costco distribution in 2025; The Vitamin Shoppe then launched AG1 in more
              than 640 stores in January 2026, followed by a Target rollout that management said doubled the number of
              doors carrying the brand. Product evidence requires qualification. A randomized placebo-controlled study
              in 30 healthy adults over four weeks reported no significant deterioration in clinical safety markers and
              potential digestive benefit, but it was funded partly by AG1 and included two Athletic Greens employees as
              authors. McGill's Office for Science and Society separately argued that evidence for many ingredients and
              broad benefits was not robust. The combination supports a real research program, but not an inference that
              all marketing claims are independently established.
