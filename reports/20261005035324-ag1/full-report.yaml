              - CU013
      - number: '6.3'
        title: Customer Retention, Efficacy Skepticism, and Competitive Headwinds
        blocks:
          - type: paragraph
            body: >-
              While AG1 maintains strong word-of-mouth advocacy among routine daily users, long-term customer durability
              is challenged by clinical scrutiny, product safety inquiries, and intensifying category competition.
              Academic reviews by public health researchers at McGill University have argued that healthy adults eating
              balanced diets derive negligible clinical benefit from expensive proprietary supplement powders, pointing
              out that excessive water-soluble vitamins are excreted while unquantified adaptogen blends lack rigorous
              human evidence. Furthermore, investigative reports highlighted over one hundred consumer adverse event
              complaints submitted to the Food and Drug Administration, including thirty-four cases of elevated liver
              enzymes or liver injury that prompted regulatory inquiry in late 2024. Emerging direct competitors such as
              IM8 and gummy alternatives like Grüns capitalize on these consumer doubts by highlighting independent
              contaminant testing, lower pricing, and verified clinical dosing, threatening AG1's core subscription
              renewal rates.
            claimRefs:
              - CU011
              - CU012
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
