evidenceGaps:
  - type: missing-source
    severity: material
    topic: capital-structure-and-governance
    missingEvidence: >-
      Complete funding-round and secondary history, total capital raised, debt schedule, current cap table, preference
      terms, board roster, and founder voting or economic rights.
    whyItMatters: >-
      A stale reported valuation and operating scale do not reveal ownership, liquidation preference, leverage,
      governance control, or cash available.
    diligencePath: >-
      Obtain board-approved cap-table exports, financing documents, debt agreements, board minutes, and a reconciliation
      to cash receipts.
    relatedQuestionRefs:
      - QO009
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: >-
      A dated 2026 valuation reference with transaction type, security, pre- or post-money basis, and participating
      investors.
    whyItMatters: >-
      The January 2025 $1.2 billion figure may not represent current enterprise or equity value and cannot anchor an
      October 2026 underwriting case.
    diligencePath: >-
      Review the latest preferred financing, 409A or equivalent valuation, secondary trades, and current fully diluted
      capitalization.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Dated employee roster, active subscriber count, retail buyer definition, revenue by channel, cohort retention,
      churn, and customer-acquisition cost.
    whyItMatters: >-
      Revenue and store-door counts cannot establish customer quality, organizational scale, recurring retention, or
      retail economics.
    diligencePath: >-
      Reconcile payroll and CRM extracts to audited revenue, subscription cohorts, retailer sell-through reports,
      returns, and channel-level gross margin.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent, methodologically transparent market sizing study covering global and US premium all-in-one greens
      powders with historical CAGR and segment revenues.
    whyItMatters: >-
      Without segmented TAM/SAM/SOM market data, estimates of AG1's market share and ceiling depend entirely on company
      self-reported revenue claims.
    diligencePath: >-
      Acquire specialized nutrition and dietary supplement market reports (e.g., Nutrition Business Journal, SPINS, or
      Euromonitor) and reconcile with retail scanner sales data.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: retail-unit-economics
    missingEvidence: >-
      Net revenue breakdown and gross margin comparisons between AG1's direct-to-consumer subscriptions versus wholesale
      mass retail channels.
    whyItMatters: >-
      Wholesale retail distribution at Target and Costco involves slotting fees, distributor margins, and markdown
      exposure that could dilute AG1's historical DTC profitability.
    diligencePath: >-
      Review confidential data room channel P&L reports, retailer margin agreements, and retail sell-through velocity
      data.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable competitor revenue, funding, customer counts, retention, channel mix, and gross margin measured on the
      same period and denominator.
    whyItMatters: >-
      Product-page comparisons cannot establish whether lower-priced competitors have the scale or economics to sustain
      acquisition and retail expansion.
    diligencePath: >-
      Request management's competitor win/loss data, retailer sell-through, syndicated scanner data, and current
      financing records for the named private peers.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: material
    topic: formula-version
    missingEvidence: >-
      A dated current label and version bridge reconciling the 75-item retail description with 83-ingredient Next Gen
      competitor descriptions.
    whyItMatters: Version ambiguity prevents a reliable capability, dose, and price-per-serving comparison.
    diligencePath: >-
      Obtain current US labels for every flavor and channel SKU plus certificates of analysis and the effective dates
      for each formula revision.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cohort retention, monthly churn, pause and cancellation rates, reactivation, multi-homing, and competitor-specific
      win/loss reasons by DTC and retail cohort.
    whyItMatters: >-
      The durability of brand habit and the economics of retail expansion cannot be judged from list pricing or
      distribution announcements.
    diligencePath: >-
      Review anonymized cohort tables, cancellation surveys, retailer repeat-purchase data, and channel-level
      contribution margin with consistent cohort definitions.
    relatedQuestionRefs:
      - QP006
      - QP010
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      An exhaustive geography-by-channel census of direct powders, gummies, pills, private labels, and retailer-owned
      brands.
    whyItMatters: The profile table is representative and may omit local or channel-specific challengers.
    diligencePath: >-
      Combine retailer assortment data, marketplace rankings, and management win/loss records, then reconcile brand
      ownership and duplicate SKUs.
    relatedQuestionRefs:
      - QP001
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: >-
      Audited financial statements including GAAP revenue recognition, gross margin breakdown, EBITDA, and balance sheet
      cash balances.
