callouts:
  - calloutType: "recommendation"
    title: "Investment Discipline: Maintain TRACK Pending Financial Disclosure"
    body: "AG1 has proven remarkable product-market fit and operational resilience by scaling a premium nutrition powder to $600M in annual revenue while maintaining self-funded profitability [CV001, CV003]. However, the transition from high-margin digital DTC subscriptions to capital-intensive mass retail at Target and Costco represents a structural change in unit economics [CV003, CV005]. Without verified disclosures on gross margins, distributor allowances, cohort churn, and preference overhang, institutional capital should refrain from secondary participation and monitor execution from the sidelines [CV007, CV008, CV010]."
