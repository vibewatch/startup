callouts:
  - calloutType: "risk"
    title: "Thesis-Break Triggers: FTC Enforcement, Liver Inquiries, and Retail Margin Collapse"
    body: "An investment thesis in AG1 breaks upon three measurable triggers: (1) formal FTC or FDA enforcement action challenging core structure/function claims or requiring removal of proprietary blend labeling; (2) confirmation of systemic hepatotoxicity or adverse contamination requiring a mandatory product recall; or (3) gross margin deterioration below 60% driven by mass retail slotting fees, distributor markdowns, and aggressive pricing battles against conglomerate-backed competitors like Grüns [CR001, CR007, CR014]."
    claimRefs:
      - "CR001"
      - "CR007"
      - "CR014"
