  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Decision tree tracing operational cessation and creditor assignment to an avoid recommendation.
    data:
      nodes:
        - label: Capital Exhaustion
          description: >-
            Investors froze scheduled funding tranches following heavy burn and capital-intensive manufacturing
            scale-up.
        - label: Operational Cessation
          description: Operations shuttered on September 3, 2025, terminating 95 employees across Michigan and California.
        - label: Order Book Invalidation
          description: $25M in booked orders canceled due to UL certification delay and inability to deliver battery shipments.
        - label: Assignment for Benefit of Creditors
          description: Sherwood Partners initiated ABC proceedings, placing corporate assets under fiduciary liquidation.
        - label: Equipment Liquidation Auction
          description: Tiger Group scheduled auction of $74M in manufacturing equipment across Santa Clara and Holland facilities.
        - label: 'Recommendation: Avoid'
          description: Complete equity impairment dictates an avoid recommendation with zero basis for enterprise valuation.
      edges:
        - from: Capital Exhaustion
          to: Operational Cessation
        - from: Operational Cessation
          to: Order Book Invalidation
        - from: Order Book Invalidation
          to: Assignment for Benefit of Creditors
        - from: Assignment for Benefit of Creditors
          to: Equipment Liquidation Auction
        - from: Equipment Liquidation Auction
          to: 'Recommendation: Avoid'
    approximationNotes: Flow illustrates the deterministic progression from liquidity crisis to equity impairment.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV010
      - CV014
callouts:
  - calloutType: risk
    title: Complete Equity Impairment Under ABC Liquidation
    body: >-
      Natron Energy's entry into an Assignment for the Benefit of Creditors process confirms that the corporate entity
      has ceased commercial operations. The auction of $74 million in machinery against $363 million in historical
      capital raised leaves junior stakeholders and common shareholders with zero expected recovery.
    claimRefs:
      - CV001
      - CV007
      - CV010
      - CV014
  - calloutType: recommendation
    title: Definitive Avoid Recommendation for Venture Underwriting
    body: >-
      Institutional investors must avoid any equity or subordinated debt investment in Natron Energy. Diligence
      resources should focus strictly on secondary asset or intellectual property purchases from the Sherwood Partners
      liquidator rather than underwriting an unviable corporate going concern.
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV014
