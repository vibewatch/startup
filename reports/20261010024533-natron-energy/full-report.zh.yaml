      - number: '4.2'
        title: 定价经济与利润率逆风
        blocks:
          - type: paragraph
            body: >-
              Natron
              的核心商业逻辑是，通过在物料清单中彻底剔除锂、钴、镍等稀缺且价格波动的原材料，建立相对传统锂离子电池的结构性成本和安全优势。公司认为，丰富且本土化的前体材料——主要是铁、锰、碳和钠——可以带来有利的制造成本和稳定的长期定价，同时实现超过
              50,000 次深度放电循环寿命以及 15 分钟快速充满能力。但 2022–2025 年间，全球电池市场动态明确转向不利于替代化学体系。受亚洲供应链大举扩产推动，碳酸锂价格从历史高点下跌超过 70%–90%。到
              2024 年，中国制造商将磷酸铁锂（LFP）电芯价格压低至约 $49/kWh。这种商品价格通缩削弱了 Natron
              预期的成本溢价，迫使尚未规模化的钠离子试产线与享有压倒性规模经济、并得到补贴的成熟锂电制造平台竞争。
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
      - number: '4.3'
        title: 资本充足性、现金消耗与流动性崩溃
        blocks:
          - type: paragraph
            body: >-
              在 13 年运营历史中，Natron Energy 通过风险资本、企业战略投资和非稀释性政府拨款累计融资约 $363M。重要战略支持者包括 Chevron Technology Ventures、United
              Airlines Ventures、Aramco Ventures 和 Khosla Ventures。2024 年 4 月，公司获得 $55.4M Series F 延长轮融资，用于启用 Holland
              工厂；2024 年 8 月，公司又宣布在北卡罗来纳州 Edgecombe County 建设 $1.4B、24 GWh 超级工厂，并获得 $51.7M 已批准的州级 JDIG 和园区准备拨款支持。但公司的资本
              runway 在 2025 年急剧恶化。2025 年 6
              月，主要机构投资者在资本密集型清洁硬件行业整体风险偏好下降之际，冻结了计划中的出资。面对不断增加的运营现金消耗，管理层整个夏季都在探索紧急过桥方案，包括现有股东追加投资、新 Series B
              股权轮、有担保可转债以及管理层收购提案。2025 年 8 月 27 日，Natron 董事会认定所有募资努力均告失败。公司发出正式 WARN 通知，影响 95 名员工，并于 2025 年 9 月 3
              日永久停止全部制造和商业运营。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI008
