chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与技术基础
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 于 2012 年在加州 Santa Clara 成立，源自 Colin Wessells
              领导的斯坦福大学实验室研究。公司旨在利用普鲁士蓝电极材料，开发并商业化用于工业储能的钠离子电池技术。与传统锂离子或铅酸体系不同，Natron
              的普鲁士蓝架构采用铁、锰、钠等丰富且低成本元素，不依赖镍、钴、锂等受限矿物。该技术专为高功率、快速放电场景设计，优先保证热稳定性和循环寿命，而不是体积能量密度。2020 年，Natron 的钠离子电池取得 UL
              1973 安全认证，成为首个获得第三方固定式电池安全列名的钠离子产品。凭借这一认证，Natron
              得以瞄准任务关键型基础设施，包括数据中心不间断电源（UPS）、电信备用系统、叉车车队和电动车快充缓冲储能。为支撑商业化规模，公司建立了战略供应合作，尤其与 Lonza Specialty Ingredients
              签署材料供应协议，在瑞士生产普鲁士蓝电极活性材料。
            claimRefs:
