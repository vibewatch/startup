      - number: '7.4'
        title: 剩余资产敞口与下行情景触发因素
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 的事后风险画像揭示了关键的论点破裂触发因素：实验室电化学成功，并不等于可持续的工业制造。Natron 的普鲁士蓝钠离子化学体系验证了几项关键技术假设——不易燃、15
              分钟快速充电，以及惊人的 50,000 次循环寿命——但随着市场基本面变化，其商业论点崩溃了。最突出的是，全球碳酸锂现货商品价格跌幅超过
              70%，严重削弱了钠离子电池“原材料成本更低”这一主要竞争价值主张。没有相对于成熟锂离子厂商的宽阔成本护城河，私募风险资本和私募股权银团拒绝继续向资本密集型电池制造注资。对参与 Tiger Group
              清算拍卖的潜在收购方或资产买家而言，剩余价值仅限于零散的制造设备和休眠专利，而不是持续经营的商业企业。任何未来对重启钠离子产能的投资判断，都需要经过验证的长期实地可靠性数据、具有约束力的客户预付款，以及有保障的前体化学品供应合同。
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR008
              - CR010
              - CR012
