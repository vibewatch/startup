              - CR005
              - CR006
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 试图将基于普鲁士蓝电极化学体系的钠离子电池技术商业化，并主打不依赖锂、钴和镍的本土供应链（CV009）。最初的论点获得了大量支持：截至 2025 年 4 月 $55.4M 的
              Series F 延伸轮，公司已从战略和财务投资方处累计取得超过 $363M 的股权、债务和补助融资（CV001、CV002）。尽管公司完成了对密歇根州 Holland 商业设施 $40M
              的升级，却遭遇了无法克服的商业和宏观逆风。全球碳酸锂商品价格骤降超过 70%，削弱了钠离子化学体系原本向数据中心和工业备用电力买家承诺的成本优势（CV012）。此外，公司试图借助北卡罗来纳州 Edgecombe
              County 的 $1.4B 超级工厂做大长期规模，但项目尚未破土动工便告失败，因为州激励金的发放以可验证的私人配套融资为前提，而 Natron
              未能取得该融资（CV005）。经营层面的反论点最终彻底否定了持续经营的投资论点。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV012
