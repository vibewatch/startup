        title: 普鲁士蓝电化学机制与电芯架构
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 的基础技术差异化来自普鲁士蓝开放框架晶体化学体系，它支持钠离子在充放电循环中的零应变嵌入和脱出。由于避免了传统锂离子嵌入晶格中的相变和体积膨胀，Natron
              设计出可以快速高倍率循环、且没有热失控危险的电芯。水系、不可燃电解质配方不需要锂、钴、镍、铜等稀缺关键矿物，使公司能够采购丰富的本土材料。该电化学架构优先追求高功率密度、低于 15
              分钟的快速充电能力和运营安全，而非体积能量密度，目标场景是固定式工业备用和电网支持，而不是电动车牵引。
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE014
