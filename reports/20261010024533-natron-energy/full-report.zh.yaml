  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与订单积压转化
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 的商业收入模式围绕专有钠离子电池方案的硬件销售设计，主要面向任务关键型数据中心电力系统、电信备用基础设施、工业电动车充电缓冲和微电网部署。旗舰产品包括 BlueTray 4000
              机架式电池包和高倍率 BluePack 关键电力电池系统，二者均采用带水系电解质的普鲁士蓝电极化学体系。2024 年初，Natron 在密歇根州 Holland 开启年产能 600 MWh
              的制造工厂，并公开宣布已从目标企业客户获得 $25M 已签采购订单，商业势头似乎加快。然而，商业订单积压始终未转化为确认收入。根据商业供应合同和客户采购协议，最终硬件交付严格以取得必要的 Underwriters
              Laboratories 安全认证为条件，具体包括固定式储能所需的 UL 1973。测试和认证周期过长，造成无法弥合的运营延迟；在公司 2025 年 9 月突然解散前，客户订单未能履约，确认商业收入为零。
