            title: 下游供应链集中在中国
            body: >-
              Natron Energy、Peak Energy
              等西方初创公司瞄准本土制造，但下游关键供应链——包括硬碳负极合成、正极材料精炼和电芯制造设备——仍集中在中国。这种地域不对称使西方进入者容易遭遇零部件成本劣势和扩产延迟。
