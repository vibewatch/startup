      - number: '6.2'
        title: 商业管线、已签订单与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Natron 在 2024 年 4 月启用密歇根州 Holland 工厂，从实验室研究转向商业制造；这是北美首座商业规模钠离子电池工厂，估计年产能约 600 MW。为了承接 AI
              数据中心运营商和工业电力消费者不断增长的需求，Natron 随后于 2024 年 8 月宣布在北卡罗来纳州 Rocky Mount 建设 $1.4B 超级工厂，设计年电池产能为 14–24
              GW，并将制造布局扩大四十多倍。停业前，Natron 报告其工业目标客户已累计签下 $25M 采购订单。尽管获得了这些商业承诺，公司仍未能在 2025
              年年中计划中的投资人融资分期被冻结前将订单积压转化为实际现金流，未履约采购承诺因此被搁置。
