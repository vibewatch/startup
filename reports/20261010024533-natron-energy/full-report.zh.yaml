            title: 锂价通缩拖慢了竞争替代
            body: 碳酸锂价格下跌超过 70%，从根本上削弱了采用钠离子的即时成本动力。客户在防火安全与成熟供应链之间权衡时，更便宜的磷酸铁锂电芯抬高了替代化学体系必须跨越的经济门槛。
            calloutType: insight
