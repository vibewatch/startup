      - number: '3.2'
        title: 现有电池化学体系与惯性替代品
        blocks:
          - type: paragraph
            body: >-
              新兴电池化学体系的竞争护城河，取决于其能否在性能、安全和系统级资本成本上替代现有方案。在 Natron 的目标应用——主要是数据中心
              UPS、工业电信备用和电动车快充削峰——中，磷酸铁锂（LFP）与阀控铅酸（VRLA）电池构成根深蒂固的现状。Natron 的普鲁士蓝架构确实带来技术差异化：循环寿命超过一万次、C 倍率脉冲功率能力出色，并通过
              UL 9540A 测试认证具备内在不可燃性，不存在热失控风险。此外，钠离子化学体系不依赖锂、钴、镍等稀缺或价格波动剧烈的关键矿物。然而，中国和国际市场的 LFP
              厂商大举扩产，压低电池包价格并建立高度优化的全球集成标准。铅酸电池虽然能量密度低、循环耐久性有限，但其前期采购成本极低，且国内闭环回收基础设施成熟，因此对优先保存资本而非追求全生命周期运营效率的工业设施而言，仍是长期默认方案。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP010
