          - type: callout
            title: 硬件制造规模所需资本超过私募融资续航
            body: 要将钠离子电芯从密歇根州 Holland 的试产线（600 MW/yr）推进到规划中的 $1.4B 北卡超级工厂，需要巨额资本开支；在碳酸锂价格下跌期间，私募风险资本联盟无法提供这笔支持。
            calloutType: insight
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 目标行业、买方画像与价值主张
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 为高倍率、任务关键型工业场景设计并营销普鲁士蓝钠离子电芯，这些场景优先看重安全、循环寿命和热稳定性，而非体积能量密度。Natron
              没有直接竞争由锂离子主导的轻型电动车市场，而是瞄准固定式和工业动力细分市场，主要包括数据中心 UPS、电信备用电力、叉车车队和电动车快充缓冲站。对企业数据中心运营商而言，Natron 将 BlueTray
              机架系统定位为不可燃的铅酸和锂离子替代品，提供超过 50,000 次循环、快速放电能力和零火焰传播特征，无需复杂消防基础设施。但随着 2022–2024 年碳酸锂价格下跌超过
              70%，钠离子相对商品化磷酸铁锂（LFP）的预期原材料成本优势显著削弱，商业案例遭遇强烈逆风。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
