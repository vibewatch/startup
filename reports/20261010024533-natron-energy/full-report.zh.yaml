          detail: 企业数据中心采购和机构投资者要求必须取得第三方安全认证。
        - label: 5. 商业订单预订
          detail: 从工业、电信和关键电力客户处取得 $25 million 的已预订客户采购订单。
        - label: 6. 生产规模化瓶颈
          detail: 在资本冻结期间，尝试从 600 MW 的 Holland MI 工厂转向计划中的 14-24 GW 北卡罗来纳州工厂。
        - label: 7. 流动性冻结与商业停运
          detail: 投资者冻结计划中的分期付款，迫使公司取消全部 $25 million 已预订订单，并通过 ABC 清算。
