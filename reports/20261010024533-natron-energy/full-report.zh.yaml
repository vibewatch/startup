      - number: '8.2'
        title: 估值背景、资本结构与设备拍卖
        blocks:
          - type: paragraph
            body: >-
              2025 年年中，公司错过商业里程碑，又遭遇资本紧缺，近期机构投资方随即冻结原定融资分期，融资链条由此断裂（CV003）。运营现金持续流失，紧急融资也未能落地；董事会于 2025 年 8 月 27
              日认定融资失败，并于 2025 年 9 月 3 日永久停运（CV004）。北卡罗来纳州的 $1.4B 项目因此在开工前夭折，州政府承诺的 $21.7M 就业激励金和 $30M
              场地补助一笔也未发放（CV006）。随后，Tiger Group 安排于 2025 年 11 月举行两天工业拍卖，清算 Santa Clara 和 Holland 两处设施约 $74M
              的专用电芯组装及研发设备（CV010）。拍卖资产覆盖超过 250,000 平方英尺，只代表困境下的实物残值，并非持续经营企业价值；所得款项优先用于行政收尾和偿还高级有担保债务（CV011）。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 可比基准、清算动态与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 的清算反映了非亚洲电池制造企业群体的广泛困境，与 Powin、Northvolt 等同行经历的 Chapter 11 破产和困境资产出售相似（CV013）。Natron 虽已建立名义上
              2500 万美元的商业订单簿，但长期的 Underwriters Laboratory
              认证要求阻碍了收入确认，使公司没有近期经营现金流（CV008）。认证延迟之外，锂市场持续通缩又压缩了替代化学体系的估值倍数，令救援式资本重组无法进行（CV012）。因此，最大股东 Sherwood
              Partners 启动了庭外 Assignment for the Benefit of Creditors（ABC）程序，将公司资产交给受托人负责清算（CV007）。在 ABC
              结构下，股权退出准备度为零，后续尽调应聚焦资产清算回收分配瀑布、知识产权权利负担以及潜在租赁和环境负债，而不是企业倍数基准。
            claimRefs:
              - CV007
              - CV008
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
