      - number: '7.3'
        title: 交易对手集中度与商业依赖风险
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 在治理、原材料投入和客户承购渠道上都面临极端的交易对手集中度。商业端方面，这家初创公司已从工业电力和数据中心买家处累计取得约 2500 万美元的已下单采购订单；但收入确认因等待
              Underwriters Laboratories 最终安全认证而延迟，公司停止运营时所有订单均在交付前取消。供应链方面，Natron 高度依赖瑞士 Lonza Specialty
              Ingredients（LSI）这一专门的战略合作伙伴来合成普鲁士蓝活性电极材料，使核心化学体系暴露于单一来源的跨境供应链风险。资本结构方面，包括 United Airlines Ventures 和
              Chevron Technology Ventures 在内的主要企业战略伙伴虽已通过股权支票验证技术，但战略支持仍不足以让公司免受更广泛的风险融资荒影响。最终，公司最大股东 Sherwood Partners
              控制了资产处置流程，股权上行空间归零，商业伙伴也失去了替代供应来源。
            claimRefs:
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
