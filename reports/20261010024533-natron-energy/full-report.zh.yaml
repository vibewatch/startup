      - number: '4.4'
        title: 资产清算与投资判断结论
        blocks:
          - type: paragraph
            body: >-
              停止运营后，Natron 最大股东、财务顾问公司 Sherwood Partners 将公司置于为债权人利益而进行的转让（ABC）程序中。这是一种州级、非司法债务人清算机制，公司选择它而非正式 Chapter
              11 破产。工业清算商 Tiger Group 于 2025 年 11 月举行两天公开拍卖，清算约 $74M 的专业电池制造机械、测试系统和研发工具，涉及 Santa Clara 与 Holland 两处共
              250,000 平方英尺的设施。同时，北卡罗来纳州商务官员确认州激励资金一分未拨，437 英亩的 Kingsboro 园区已退还给地区经济开发机构重新招商。对机构投资者和承销商而言，Natron
              等同于股权全部核销。公司从未公开披露经审计的历史收入、毛利率、电芯制造成本或报废率，因此回收分配完全由有担保债权人和行政债权人主导，股东没有剩余价值。
            claimRefs:
              - CI010
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 认证与融资的挤压
            body: >-
              Natron 的失败凸显了漫长硬件认证周期与风险资本融资周期之间的致命错配。尽管公司已获得 $25M 采购订单，但在完成最终 UL 1973
              认证前，法律和合同都不允许交付产品或确认收入。近期投资者在锂价下跌之际冻结计划中的资本分期拨款，公司没有足够营运资金撑过交付前剩余的几个月。
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI009
          - type: callout
            title: 大宗商品价格崩塌
            body: >-
              钠离子技术的核心价值主张是摆脱昂贵电池金属的影响。但 2022–2025 年间，碳酸锂价格下跌 70%–90%，显著改变了竞争经济性。中国 LFP 电芯价格降至约 $49/kWh 后，Natron
              以钠离子循环寿命为基础的溢价无法弥补其较低的体积能量密度和未规模化制造成本结构。
            calloutType: insight
            claimRefs:
              - CI006
              - CI007
  - number: 5
    title: 产品与技术
    sections:
