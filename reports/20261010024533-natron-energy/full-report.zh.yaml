figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 Natron Energy 从 2012 年 Stanford 分拆，到商业工厂开业及 2025 年 9 月清算的关键运营与融资里程碑。
    data:
      items:
        - label: 2012-04：成立
          detail: Natron Energy 在加利福尼亚州 Santa Clara 成立，由 Colin Wessells 从 Stanford University 研究成果中分拆出来，商业化普鲁士蓝钠离子电池化学体系。
          tone: neutral
        - label: 2020-07：UL 1973 安全认证
          detail: Natron 首次为钠离子电池电芯和电池组取得 UL 1973 安全列名，从而进入关键任务数据中心备用电源市场。
          tone: positive
        - label: 2021-04：Lonza 供应协议
          detail: Lonza Specialty Ingredients 签署多年供应协议，在瑞士 Visp 生产普鲁士蓝电极活性材料，目标是每年支持最高 600 MW 的电池产能。
          tone: positive
        - label: 2024-04：Holland 工厂投产
          detail: Natron 正式启用位于密歇根州 Holland 的制造工厂，建成北美首个商业规模钠离子电池生产基地。
          tone: positive
        - label: 2024-08：北卡罗来纳州超级工厂公告
          detail: >-
            Natron 宣布计划在北卡罗来纳州 Edgecombe County 的 Kingsboro Megasite 建设一座 $1.4 billion、24 GW 的超级工厂，并获得州级 Megasite
            Readiness 和 JDIG 激励。
          tone: positive
        - label: 2025-04：Series F 追加融资
          detail: Natron 为 Series F 融资追加 $55.4 million，使累计募资超过 $363 million。
          tone: neutral
        - label: 2025-08：流动性冻结与关闭决定
          detail: 资金拨付被冻结且紧急资本重组失败后，董事会于 8 月 27 日决定关闭运营，并发出 WARN 通知，影响 95 名员工。
          tone: critical
        - label: 2025-09：工厂关闭与 ABC 清算
          detail: 运营于 2025 年 9 月 3 日停止；Holland 和 Santa Clara 的设施关闭，最大股东 Sherwood Partners 启动为债权人利益而进行的资产出售。
          tone: adverse
    approximationNotes: null
