      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 通过为债权人利益而进行的转让清算资不抵债资产
            body: >-
              Natron Energy 在 2025 年 9 月 3 日停止全部商业和制造运营，此前投资人冻结了计划中的资金拨付，紧急资本重组也告失败。公司最大股东 Sherwood Partners 将 Natron
              纳入为债权人利益而进行的转让（ABC）程序，通过拍卖清算厂房资产，而不是把公司重组为持续经营企业。
