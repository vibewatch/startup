      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 灾难性流动性耗尽与过早工业化扩张
            body: >-
              Natron Energy 于 2025 年 9 月突然倒闭，说明商业化早于自我维持现金流的高资本开支电池制造存在致命风险。尽管公司已融资超过 3.63 亿美元并取得 2500
              万美元客户采购订单，却无法填补履行订单或取得后续融资所需的营运资金缺口。碳酸锂现货价格下跌超过 70% 后，钠离子电池的成本差异被抹平，机构投资者因此冻结已排定的付款，并触发了 Assignment for
              the Benefit of Creditors 项下的清算。
            calloutType: risk
            claimRefs:
              - CR001
