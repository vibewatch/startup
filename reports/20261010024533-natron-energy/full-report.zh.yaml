      - number: '3.4'
        title: 护城河耐久性、全球供应不对称与清算后果
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 于 2025 年 9 月 3 日突然停运，并取消在北卡罗来纳州 Rocky Mount 建设投资额 1.4B
              美元的超级工厂，凸显本土清洁技术制造商面临的巨大结构性障碍。目前，全球几乎所有已投运的商业钠离子制造产能都在中国，代表性项目包括 2024 年 5 月启用的 Fulin
              储能站。下游钠离子供应链也集中在中国制造中心，涵盖硬碳负极合成、精炼正极材料和自动化电芯组装。2024 至 2025 年，西方清洁技术企业遭遇资本急剧收紧，Powin 和 Northvolt
              等知名企业相继破产。Natron 董事会认定融资失败后，股东 Sherwood Partners 接管并清算公司资产，安排于 2025 年 10 月公开拍卖 Santa Clara 和 Holland 两地价值
              七千四百万美元的精密电池制造机械。Natron 倒闭后，北美工业客户仍得依赖进口 LFP 和铅酸系统，钠离子制造的先发优势也完全让给了海外竞争者。
            claimRefs:
              - CP004
