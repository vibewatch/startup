    title: 建议逻辑
    type: flow
    summary: 决策树展示了从停止运营、债权人受让到建议避免投资的推演路径。
    data:
      nodes:
        - label: 资本耗尽
          description: 在高额烧钱、制造扩产又极其耗资之后，投资人冻结了原定的分期注资。
        - label: 停止运营
          description: 公司于 2025 年 9 月 3 日关停业务，密歇根州和加利福尼亚州共有 95 名员工被解雇。
        - label: 订单失效
          description: 由于 UL 认证延误且无法交付电池货物，已签订单中的 $25M 被取消。
        - label: 为债权人利益进行资产转让
          description: Sherwood Partners 启动 ABC 程序，将公司资产置于受托清算之下。
        - label: 设备清算拍卖
          description: Tiger Group 安排拍卖 Santa Clara 和 Holland 两处设施内价值 $74M 的制造设备。
        - label: 建议：避免投资
          description: 股权已全部减值，因此应避免投资；企业估值没有任何依据。
