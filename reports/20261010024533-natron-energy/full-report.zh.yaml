      - number: '6.4'
        title: 商业终止、订单取消与未解决缺口
        blocks:
          - type: paragraph
            body: >-
              2025 年 8 月下旬，计划中的投资付款被冻结、后续股权融资和过桥融资尝试失败后，Natron 董事会投票决定停止运营。首席商务官 John Schmidt 通知员工，公司将永久解雇 95
              人、解散商业拓展组织，并正式取消 $25M 已签客户采购订单的全部交付。随后，公司进入由 Sherwood Partners 管理的为债权人利益而进行的转让（ABC），Tiger Group 于 2025 年
              11 月拍卖 Santa Clara 和 Holland 工厂约 $74M 的电池制造设备。关键商业尽调缺口仍未解决：Natron
              从未公开披露客户账户集中度、净收入留存率（NRR）、毛收入留存率（GRR）或客户群流失率，评估其历史商业健康状况只能依赖私下清算文件。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 订单全部取消，商业团队随业务一并清算
            body: >-
              Natron Energy 在 2025 年 9 月停业时，数据中心和工业客户已签下 $25M 采购订单。但收入确认取决于待完成的 UL
              认证和新增产能，计划中的投资人分期资金被冻结后，公司立即停止运营，商业销售团队被清算，所有客户承诺全部取消。
