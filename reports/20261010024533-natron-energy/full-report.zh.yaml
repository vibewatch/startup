      - number: '1.3'
        title: 融资轨迹、投资人联盟与资本结构差异
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 在十三年历史中获得了大量风险资本和机构支持，通过多轮股权、可转债和政府拨款累计融资 $363M–$373M。其投资人包括 Khosla Ventures 等头部机构风险投资公司，以及
              United Airlines Ventures、Chevron Technology Ventures 和 Liberty Energy 等大型战略企业投资者。2025 年 4 月，Natron 宣布为
              Series F 追加 $55.4M，以支持制造规模扩张。不同的私营数据库和追踪平台对历史融资总额的记录差异很大：FundedIQ 记录为 $231M，Tracxn 则为
              $373M，差异来自未定价拨款和未披露可转债。完成 2025 年 4 月融资后，计划中的投资人付款在年中被冻结，使公司在资本密集型产能爬坡期间失去关键流动性。Natron
              从未完成公开发行，也未建立可验证的独角兽估值；二级股权交易也缺乏可验证的成交价格。最终，Natron 的最大股东、财务顾问公司 Sherwood Partners
              判断持续进行私募股权重组已不可行，并启动了为债权人利益而进行的转让程序。
            claimRefs:
              - CO006
              - CO007
              - CO015
