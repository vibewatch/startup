            body: 尽管 Natron 已获得 $25M 客户采购订单并与工业电力集成商建立商业合作，但在完成正式 UL 认证前，公司无法将订单积压转化为确认收入；风险资本市场收缩后，这使公司暴露在极高风险之下。
