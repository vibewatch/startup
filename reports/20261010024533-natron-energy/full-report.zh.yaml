      - number: '1.4'
        title: 制造扩张、流动性冲击与为债权人利益而进行的转让
        blocks:
          - type: paragraph
            body: >-
              Natron 在制造端取得重要里程碑后，最终陷入严重流动性资不抵债。2024 年 4 月，公司启用位于密歇根州 Holland 的生产设施，宣布北美首座商业规模钠离子制造工厂投产，目标年产能为 600
              兆瓦。受此鼓舞，Natron 于 2024 年 8 月宣布投资 $1.4B，在北卡罗来纳州 Edgecombe County 的 Kingsboro Megasite 建设一座 24
              吉瓦超级工厂，并获得州级就业开发和园区准备激励。但快速增长的资本开支超过了现金回款，尤其是 $25M 已签商业订单因等待最终的 Underwriters Laboratories 安全认证而无法交付。2025
              年夏季，公司尝试通过可转债、Series B 股权方案和现有股东追加出资来筹集替代融资，但均告失败，董事会于 8 月 27 日决定关闭全部运营。2025 年 9 月 3 日，Natron 正式关闭 Holland
              工厂和 Santa Clara 总部，永久解雇 95 名员工。                            随后，Sherwood Partners 聘请 Tiger Group 于 2025 年 11
              月进行公开拍卖，清算估计约 $74M 的先进电池制造和实验室设备。
