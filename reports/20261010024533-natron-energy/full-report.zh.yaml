            body: >-
              在停止运营前，Natron 将核心电芯技术转化为三种主要商业硬件形态。BlueTray 4000 服务于电信和 48 伏数据中心机架环境，是一款 4kW 模块化机架式电池包，并成为首个取得 UL 1973
              安全认证的钠离子储能系统。面向更重的工业需求，BluePack Critical Power Battery 在 48V 下提供 25kW 输出，并具备应对快速负载波动的深度放电能力。企业基础设施层面的
              BlueRack 250 采用可扩展多柜架构，可从 25kW 配置到多兆瓦级，用于微电网和设施备用。这些产品线消除了锂 NMC
              系统所需的消防系统开支，但较低的体积能量密度要求更大的物理占地，使客户采用受限于拥有充足场地的地点。
