      - number: '6.3'
        title: 集成合作、采购摩擦与 UL 认证门槛
        blocks:
          - type: paragraph
            body: >-
              Natron 主要作为原始设备电芯制造商运营，因此商业拓展策略高度依赖系统集成商和电气设备分销商。公司与 ABB、CE+T Power 和 MC Energy 等成熟电力电子供应商建立集成合作，将
              BlueTray 4000 机架包接入完整的数据中心和微电网外壳。在上游供应端，Natron 与 Lonza Specialty Ingredients 合作，从瑞士采购普鲁士蓝材料，目标支持每年最多 600
              MW 的电池组装。但企业客户采用面临一个关键结构性障碍：$25M 已签订单的商业收入确认，取决于 Underwriters Laboratories（UL）认证，例如 UL
              1973。机构企业买家和资本伙伴都要求这一独立安全里程碑，造成长期采购摩擦，商业开票一直延迟到流动性耗尽。
            claimRefs:
