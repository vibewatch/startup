              Natron Energy 进入 Assignment for the Benefit of Creditors 程序，确认该企业实体已经停止商业运营。7400 万美元机器设备相对于 3.63
              亿美元历史融资额的拍卖结果，使次级利益相关方和普通股东的预期回收额为零。
