      - number: '3.3'
        title: 封装模式、成本劣势与认证障碍
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 围绕模块化机架式电池柜设计商业封装，目标客户包括任务关键型数据中心运营商、电动车基础设施开发商和电信供应商。公司与 DG Matrix
              合作，将普鲁士蓝电芯集成到多端口快充设备中，试图靠降低公用事业峰值需求费获取收入。尽管 Natron 累计获得两千五百万美元客户采购订单，商业化兑现因 Underwriters Laboratory
              认证延迟而停滞；对企业数据中心采购而言，这是一项必要前提。与此同时，宏观定价环境急剧不利于钠离子经济性。近年来碳酸锂商品价格下跌超过七成，大幅降低了竞争性 LFP
              电芯的制造成本。钠离子电芯在达到大规模超级工厂前起初存在单位成本溢价，锂价崩塌因此消除了风险厌恶型企业买家离开成熟化学体系的短期经济激励。在营运资金受限、无法确认未认证订单积压收入的情况下，Natron
              无法维持高额运营消耗。
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP014
              - CP015
