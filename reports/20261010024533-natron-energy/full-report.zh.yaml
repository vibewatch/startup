    data:
      layers:
        - label: 应用集成层
          detail: 接入数据中心 UPS 机架、Liberty digiFrac 电动泵和混合太阳能 CSP 系统。
        - label: 系统控制与 BMS 层
          detail: 电池管理系统监控电芯电压、荷电状态、热均匀性和 48V 电源总线控制。
        - label: 模块与机架外壳层
