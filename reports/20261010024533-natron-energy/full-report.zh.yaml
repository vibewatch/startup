      - number: '1.2'
        title: 创始人、管理层与治理演变
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 最初由创始人 Colin Wessells 主导，他带领公司从学术衍生项目走过早期技术验证、首轮风险融资和原型开发阶段。公司从工程验证转向商业制造后，治理结构随着资深高管
              Wendell Brooks 出任首席执行官而调整。Brooks 曾任 Intel Capital 总裁，拥有丰富的企业和投资经验，职责是扩大运营规模并推动后期融资。商业执行由首席商务官 John Schmidt
              负责，他管理工业客户关系，并据报道在数据中心和工业电力客户中建立了 $25M 的订单积压。人才与人力资源由团队与人才负责人 Elizabeth Shober 管理。然而，随着资本密集度在 2025
              年上升，公司遭遇严重的关键人物和治理压力。计划中的融资拨款被冻结、后续资本重组尝试相继失败后，董事会最终在 2025 年 8 月下旬批准永久停止运营。
            claimRefs:
