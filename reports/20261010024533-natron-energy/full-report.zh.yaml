      - number: '7.2'
        title: 运营扩张瓶颈与制造停止
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 的运营扩张受到资本密集度和单位经济性的双重拖累，最终于 2025 年 9 月 3 日关闭全部制造业务。公司在 2024 年取得重要工业里程碑，在密歇根州 Holland 的 600
              MW 产能设施启动钠离子电芯商业生产。但运营费用和所需营运资金超过收入，Santa Clara 总部和密歇根生产工厂的现金消耗率因此无法持续。2025 年 8
              月，潜在投资人拒绝为后续股权或有担保可转债提供资金，董事会认定公司无法承担继续组装电芯和履行现有客户承诺所需的运营开支。随后关闭立即解雇了 95
              名技术员、质量工程师和装配人员，仅留下名义上的骨干团队负责有序关停业务和设施。公司价值 $74M 的新款电芯制造与自动化组装设备，随后由工业拍卖商 Tiger Group 安排在线公开清算。
            claimRefs:
              - CR001
              - CR002
