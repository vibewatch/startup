  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、清算流程与法律风险
        blocks:
          - type: paragraph
            body: >-
              Natron Energy 的法律和监管状态在 2025 年末迅速从增长期补贴合规转为困境清算。多轨道资本重组失败后，公司没有申请正式 Chapter 11 破产，而是在财务顾问 Sherwood
              Partners 协助下，于加州进入为债权人利益而进行的转让（ABC）。这一法定债务人程序将公司资产交给受托受让人，由其清算实体厂房设备和知识产权，并将所得分配给有担保债权人和行政债权人。同时，Natron
              突然关闭工厂触发了联邦和州级《工人调整与再培训通知法》（WARN Act）义务；公司援引企业陷入困境的法定例外，解释为何无法在解雇 95 名员工前提前 60 天通知。在州级经济发展事务上，北卡罗来纳州承诺提供
              $21.7M Job Development Investment Grants 和 $30M 前期园区开发资金，但由于项目拨款严格以经核实的私人资本配套为条件，州政府实际拨款为零。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
