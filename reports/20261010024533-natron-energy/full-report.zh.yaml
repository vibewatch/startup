  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分与工业范围
        blocks:
          - type: paragraph
            body: >-
              钠离子储能的商业市场并不是可以在所有场景替代锂离子的单一市场，而是分为两块：高销量、成本驱动的微型出行，以及任务关键型、高倍率工业电力。Natron Energy
              将商业策略明确限定在高功率、短时长工业场景，认为其专利普鲁士蓝化学体系具有结构性性能优势。不同于为高能量密度和多小时大规模放电优化的层状氧化物钠体系或磷酸铁锂（LFP）电芯，Natron
              的电极结构可实现极快充放电循环、更低内阻和超过 50,000 次循环寿命。这一架构选择使公司避开资本密集型乘用电动车牵引和多小时公用事业储能套利，转而聚焦数据中心高倍率
              UPS、油田混合发电机缓冲和电信电力过渡。Natron
              用丰富的铁、锰、钠电解质替代钴、镍、铜等关键矿物，目标是向任务关键型基础设施客户供应本土、不可燃的电池资产；这些客户更看重热安全、高放电倍率和循环寿命，而不是体积能量密度。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM011
      - number: '2.2'
        title: 市场规模视角：全球 TAM、工业 SAM 与订单 SOM
        blocks:
          - type: paragraph
            body: >-
              评估 Natron 的可触达市场，需要把高层分析师预测与已验证的商业转化拆开看。按总可寻址市场（TAM）口径，独立研究预测钠离子化学体系将在全球快速扩张。HTF Market Intelligence
              预计全球钠离子电池市场将从 2024 年的 $610M 增长到 2033 年的 $6.8B，复合年增长率为 35.8%；近期预测则将 2025–2026 年视为商业拐点，预计全球市场收入达到
              $2.14B–$2.19B。但公用事业级固定式电网储能和亚洲微型出行占据上述增长的 70% 以上，使北美高倍率工业备用服务可寻址市场（SAM）估计仅为每年 $350M–$500M。在这一服务边界内，Natron
              在 2025 年停业前，数据中心和工业客户已签商业订单达到 $25M，形成了颇具吸引力的可服务可获取市场（SOM）。为承接这类需求，Natron 于 2024 年 4 月在密歇根州 Holland 启用 600
              兆瓦制造工厂，并宣布在北卡罗来纳州建设年产能最高 24 吉瓦的 $1.4B 超级工厂，累计融资约 $494M。然而，尽管订单需求可观，最终 Underwriters Laboratory
              认证迟迟未完成，收入确认仍被卡住，工厂投资与现金回收之间形成无法弥合的营运资金错配。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM008
              - CM010
              - CM014
