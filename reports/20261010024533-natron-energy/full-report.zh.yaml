          detail: 不易燃的水系电解质支持钠离子快速传输，且无热失控危险。
        - label: 普鲁士蓝电化学核心
          detail: 零应变开放框架晶格支持钠离子快速嵌入 / 脱出，循环次数超过 50,000 次。
