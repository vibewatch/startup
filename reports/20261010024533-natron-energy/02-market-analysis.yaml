callouts:
  - calloutType: "risk"
    title: "The Lithium Price Collapse Disrupted the Economic Rationale for Sodium-Ion"
    body: "While sodium-ion promised significant cost insulation from scarce battery metals, the dramatic >70% crash in lithium carbonate prices severely compressed the cost-per-kilowatt-hour spread versus mature LFP chemistry. For capital-intensive scale-ups like Natron, this price compression eroded the urgency for commercial buyers to transition to an unproven chemistry during tightening venture funding cycles."
    claimRefs:
      - "CM009"
      - "CM013"
  - calloutType: "insight"
    title: "Booked Commercial Demand Without Final UL Certification Created Fatal Cash Burn"
    body: "Natron successfully secured $25 million in booked customer orders across critical power and industrial applications, demonstrating genuine market pull for non-flammable, rapid-cycling batteries. However, commercial revenues could not be recognized prior to achieving Underwriters Laboratory (UL) certification, leaving the company vulnerable to severe liquidity exhaustion when investors froze capital disbursements."
    claimRefs:
      - "CM004"
      - "CM008"
      - "CM012"
