  topStrengths:
    - Validated Prussian blue sodium-ion chemistry with UL-listed non-flammable safety characteristics.
    - Reached commercial-scale manufacturing and booked meaningful enterprise demand before shutdown.
    - Attracted strategic investors and partners across industrial and energy channels.
  topRisks:
    - The company ceased operations and entered ABC liquidation, eliminating any going-concern equity case.
    - Booked orders and factory scale did not convert into durable revenue before liquidity collapsed.
    - Lithium price deflation and heavy capital intensity erased the original economics of the sodium-ion thesis.
  unresolvedGaps:
    - Estate-sale terms, asset-sale proceeds, and the secured or administrative creditor waterfall.
    - Full cap table, liquidation preferences, and which stakeholders sit senior to common equity.
    - Audited FY2024-FY2025 revenue, gross margin, backlog conversion, and customer concentration before closure.
    - Whether any buyer or sponsor funds a restart rather than only buying assets.
