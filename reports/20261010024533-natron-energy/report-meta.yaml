companyProfile:
  summary: >-
    Natron Energy was a Santa Clara-based sodium-ion battery company that commercialized Prussian blue chemistry for
    high-power industrial backup applications, reached first-generation manufacturing scale, and then shut down in
    September 2025 after liquidity stress, unfulfilled booked orders, and a failed recapitalization pushed the business
    into Assignment for the Benefit of Creditors liquidation.
