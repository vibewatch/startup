callouts:
  - calloutType: risk
    title: "Complete Order Cancellation and Commercial Team Liquidation"
    body: "At the time of its September 2025 shutdown, Natron Energy held $25 million in booked customer purchase orders across data center and industrial accounts. However, because revenue recognition was contingent on pending UL certifications and new production scale, the freeze of scheduled investor tranches forced an immediate cessation of operations, liquidation of the commercial sales team, and total cancellation of all customer commitments."
    claimRefs:
      - CU006
      - CU010
      - CU012
