callouts:
  - calloutType: "risk"
    title: "The Certification-Funding Squeeze"
    body: "Natron's failure highlights the fatal mismatch between lengthy hardware certification timelines and venture financing cycles. Despite having secured $25 million in purchase orders, Natron was legally and contractually unable to deliver units or recognize revenue without final UL 1973 certification. When recent investors froze scheduled capital tranches amid falling lithium prices, the company lacked the working capital to bridge the remaining months to delivery."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI006"
      - "CI009"
  - calloutType: "insight"
    title: "Macro Commodity Pricing Collapse"
    body: "Sodium-ion technology's primary value proposition was immunity from expensive battery metals. However, the 70% to 90% plunge in lithium carbonate prices between 2022 and 2025 dramatically altered the competitive economics. With Chinese LFP battery cells dropping toward $49/kWh, Natron's premium for sodium-ion cycle life could not compensate for its lower volumetric energy density and unscaled manufacturing cost structure."
    claimRefs:
      - "CI006"
      - "CI007"
