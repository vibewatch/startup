callouts:
  - calloutType: "risk"
    title: "Downstream Supply Chain Concentration in China"
    body: "While western startups including Natron Energy and Peak Energy targeted domestic manufacturing, the critical downstream supply chain—encompassing hard carbon anode synthesis, cathode material refinement, and cell manufacturing equipment—remains concentrated in China. This geographic asymmetry leaves western entrants vulnerable to component cost disadvantages and scaling delays."
    claimRefs:
      - "CP009"
      - "CP010"
  - calloutType: "insight"
    title: "Lithium Price Deflation as a Competitive Decelerator"
    body: "The greater than 70 percent collapse in lithium carbonate prices fundamentally eroded the immediate cost imperative for sodium-ion adoption. For customers weighing fire safety against proven supply chains, cheaper lithium iron phosphate cells raised the economic hurdle that alternative chemistries had to clear to justify switching."
    claimRefs:
      - "CP007"
