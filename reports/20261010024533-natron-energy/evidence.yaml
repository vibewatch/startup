      Without verified peer unit economics and cell production yields, evaluating whether other western sodium-ion
      players face the same fatal margin compression as Natron remains speculative.
    diligencePath: >-
      Review subsequent venture fundraising disclosures, customer pilot acceptance data, and IEA battery supply chain
      updates for 2026.
