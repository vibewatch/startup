evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Estate-Sale Terms and Creditor Waterfall Priority
    missingEvidence: >-
      Detailed schedule of creditor claims, secured debt obligations, and proceeds realized from the Tiger Group
      liquidation auctions for Santa Clara and Holland assets.
    whyItMatters: >-
      Determines whether any residual economic value exists for junior equity holders or whether administrative and
      senior secured claims consume all liquidation proceeds.
    diligencePath: >-
      Review public Assignment for the Benefit of Creditors (ABC) court filings, assignee reports from Sherwood
      Partners, and final auction settlement statements.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: Historical Audited Financials and Revenue Recognition
    missingEvidence: >-
      Audited financial statements for FY2023 through FY2025, including realized revenue, cost of goods sold, gross
      margins, and customer concentration.
    whyItMatters: >-
      Prevents independent verification of unit economics, gross burn rate leading up to insolvency, and commercial
      viability of the Holland manufacturing operations.
    diligencePath: Request pre-liquidation accounting records, audit reports, and tax filings from the assignee or former management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: Complete Management and Board Governance Register
    missingEvidence: >-
      Comprehensive directory of board of directors seats, independent directors, and full executive roster at the time
      of dissolution.
    whyItMatters: >-
      Enables assessment of board fiduciary actions, investor voting control, and decision governance during the August
      2025 shutdown decision.
    diligencePath: Inspect state corporate registry filings, assignee notices, and former director disclosures.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: revenue-realization-breakdown
    missingEvidence: >-
      Audited breakdown of historical pre-shutdown revenue, customer order conversion rates, and exact cash realization
      on the $25 million booked order backlog.
    whyItMatters: >-
      Understanding whether Natron realized any material product revenue or suffered complete cancellation of customer
      commitments is essential for assessing true commercial demand versus unfulfilled pipeline.
    diligencePath: >-
      Review bankruptcy and debtor filings from Sherwood Partners under the Assignment for the Benefit of Creditors
      (ABC) proceedings in California state court or secured creditor records.
    relatedQuestionRefs:
      - QM009
