            title: Insolvency and Asset Liquidation via Assignment for the Benefit of Creditors
            body: >-
              Natron Energy ceased all commercial and manufacturing operations on September 3, 2025, after investors
              froze scheduled funding disbursements and emergency recapitalization efforts failed. The company's largest
              shareholder, Sherwood Partners, placed Natron into an Assignment for the Benefit of Creditors (ABC)
              process, liquidating plant assets at auction rather than restructuring the business as an ongoing
              enterprise.
