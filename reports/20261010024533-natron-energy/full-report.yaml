              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target Verticals, Buyer Profiles, and Value Propositions
        blocks:
          - type: paragraph
            body: >-
              Natron Energy designed and marketed its sodium-ion Prussian blue battery cells for high-rate,
              mission-critical industrial applications where safety, cycle life, and thermal stability were prioritized
              over volumetric energy density. Rather than competing directly in the light-duty electric vehicle market
              dominated by lithium-ion chemistry, Natron targeted stationary and industrial motive segments, primarily
              data center uninterruptible power supply (UPS) systems, telecommunications backup power, forklift fleets,
              and electric vehicle fast-charging buffer stations. For enterprise data center operators, Natron
              positioned its BlueTray rack systems as a non-flammable, lead-acid and lithium-ion alternative offering
              over 50,000 cycles, rapid discharge capabilities, and a zero-fire-propagation profile that eliminated the
              need for complex fire-suppression infrastructure. However, the commercial business case faced intense
              headwinds as lithium carbonate prices collapsed by more than 70% between 2022 and 2024, significantly
              eroding the expected raw material cost advantage of sodium-ion technology against commoditized lithium
              iron phosphate (LFP) alternatives.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
