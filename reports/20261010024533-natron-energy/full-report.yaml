      - number: '5.3'
        title: Industrial Deployment Workflows and Operational Performance
        blocks:
          - type: paragraph
            body: >-
              Natron focused commercial deployment efforts on high-power industrial workflows characterized by severe
              cycling frequency and zero tolerance for thermal incidents. In energy services, Liberty Energy
              collaborated with Natron to integrate sodium-ion storage into its digiFrac electric hydraulic fracturing
              pumps, using rapid battery buffering to smooth generator load spikes and lower field emissions. In
              renewable firming, Vast Solar executed a letter of intent to acquire up to 13,500 battery units for the
              Mount Isa hybrid solar thermal power project in Australia, seeking to pair rapid sodium-ion storage with
              concentrated solar thermal generation for 24-hour baseload delivery. However, commercial validation was
              abruptly truncated when Natron failed to secure required follow-on equity, leaving approximately $25
              million in booked customer orders unfulfilled at the time of its September 2025 shutdown.
            claimRefs:
              - CE001
              - CE005
