            body: >-
              Natron Energy's entry into an Assignment for the Benefit of Creditors process confirms that the corporate
              entity has ceased commercial operations. The auction of $74 million in machinery against $363 million in
              historical capital raised leaves junior stakeholders and common shareholders with zero expected recovery.
