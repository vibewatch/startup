              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercialization Failure Despite Differentiated Electrochemistry
            body: >-
              Although Natron demonstrated proven Prussian blue chemistry and achieved UL 1973 safety listing, the
              company could not reach economic unit production costs before liquidity ran out in September 2025, leaving
              $25 million in booked orders unfulfilled.
            calloutType: risk
            claimRefs:
              - CE007
              - CE010
              - CE011
          - type: callout
            title: Hardware Manufacturing Scale Demands Exceeded Private Venture Runway
            body: >-
              Transitioning sodium-ion cells from Holland, Michigan pilot lines (600 MW/yr) to the planned $1.4 billion
              North Carolina gigafactory required vast capital expenditures that private venture syndicates could not
              support amid declining lithium carbonate prices.
            calloutType: insight
            claimRefs:
              - CE008
