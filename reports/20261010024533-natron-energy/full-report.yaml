chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Technology Foundations
        blocks:
          - type: paragraph
            body: >-
              Natron Energy was founded in 2012 in Santa Clara, California, emerging from Stanford University laboratory
              research led by Colin Wessells. The company was established to pioneer and commercialize sodium-ion
              battery technology utilizing Prussian blue electrode materials for industrial energy storage applications.
              Unlike traditional lithium-ion or lead-acid chemistries, Natron's Prussian blue architecture utilizes
              abundant, low-cost elements including iron, manganese, and sodium, eliminating dependence on constrained
              minerals such as nickel, cobalt, and lithium. The technology was engineered specifically for high-power,
              rapid-discharge applications where thermal stability and cycle life outweigh volumetric energy density. In
              2020, Natron's sodium-ion battery achieved a landmark UL 1973 safety certification, marking the first time
              a sodium-ion product received third-party stationary battery safety listing. This certification enabled
              Natron to target commercial deployments in mission-critical infrastructure, including data center
              uninterruptible power supplies (UPS), telecom backup systems, forklift fleets, and electric vehicle
              fast-charging buffer storage. To support commercial scale, Natron established strategic supply
              partnerships, notably securing a material supply agreement with Lonza Specialty Ingredients to manufacture
              Prussian blue electrode active materials in Switzerland.
            claimRefs:
              - CO001
              - CO013
              - CO014
