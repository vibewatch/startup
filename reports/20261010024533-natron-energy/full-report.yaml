      - number: '5.4'
        title: Manufacturing Tooling, Supply Dependencies, and Asset Liquidation
        blocks:
          - type: paragraph
            body: >-
              Scaling cell production required specialized chemical synthesis and high-precision automation across
              multiple facilities. In April 2021, Natron contracted with Lonza Specialty Ingredients to synthesize bulk
              Prussian blue materials at Lonza's Visp, Switzerland chemical plant, targeting up to 600 MW of annual
              material supply. In April 2024, Natron commenced commercial cell assembly at its Holland, Michigan
              facility, equipped with Hanwha automated assembly lines, Frontier slot die coaters, Guangdong Honbro pouch
              production equipment, and Arbin test stations. In August 2024, Natron announced an ambitious $1.4 billion
              gigafactory in Edgecombe County, North Carolina to scale production to 14–24 gigawatts annually. When
              private equity funding dried up amid declining lithium prices, Natron halted North Carolina plans,
              shuttered Holland and Santa Clara, and consigned approximately $74 million in equipment to a two-day
              liquidation auction conducted by Tiger Group in November 2025.
            claimRefs:
              - CE004
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
          - type: table
