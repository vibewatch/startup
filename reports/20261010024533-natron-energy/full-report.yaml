      - number: '6.2'
        title: Commercial Pipeline, Booked Orders, and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Natron transitioned from laboratory research to commercial manufacturing with the April 2024 opening of
              its Holland, Michigan facility, representing the first commercial-scale sodium-ion battery plant in North
              America with an estimated capacity of approximately 600 MW per year. To capture accelerating demand from
              AI data center operators and industrial power consumers, Natron subsequently announced in August 2024 an
              ambitious $1.4 billion gigafactory project in Rocky Mount, North Carolina, designed to deliver 14 to 24 GW
              of annual battery capacity and expand its manufacturing footprint by more than forty-fold. Prior to its
              commercial shutdown, Natron reported accumulating $25 million in booked customer purchase orders across
              its industrial target accounts. Despite securing these commercial commitments, the company was unable to
              convert the backlog into realized cash flow before scheduled investor financing tranches froze in
              mid-2025, stranding the unfulfilled purchase commitments.
