      - number: '8.2'
        title: Valuation Context, Capital Structure, and Equipment Auction
        blocks:
          - type: paragraph
            body: >-
              The financing trajectory unravelled in mid-2025 when recent institutional backers froze scheduled funding
              tranches amid missed commercial milestones and capital scarcity (CV003). Faced with mounting operational
              cash burn and unable to close emergency capital raises, the board of directors concluded on August 27,
              2025, that financing efforts had failed, permanently shuttering operations on September 3, 2025 (CV004).
              This collapse halted the $1.4 billion North Carolina project before any of the state's $21.7 million in
              job incentives or $30 million in site grants were distributed (CV006). Tiger Group subsequently scheduled
              a two-day industrial auction in November 2025 to liquidate approximately $74 million in specialized cell
              assembly and R&D machinery across the Santa Clara and Holland facilities (CV010). Spanning more than
              250,000 square feet, the auction assets represent distressed physical salvage rather than a going-concern
              enterprise value, with proceeds prioritized for administrative wind-down and senior secured obligations
              (CV011).
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV010
