      - number: '5.2'
        title: Commercial Hardware Portfolio and System Enclosures
        blocks:
          - type: paragraph
            body: >-
              Natron translated its core cell technology into three primary commercial hardware form factors prior to
              shutting down operations. The BlueTray 4000 served telecom and 48-volt data center rack environments as a
              4kW modular rack-mounted battery pack, distinguished as the first sodium-ion energy storage system to earn
              a UL 1973 safety certification. For heavier industrial demand, the BluePack Critical Power Battery
              delivered 25kW output at 48V with deep discharge resilience designed to buffer rapid load fluctuations. At
              the enterprise infrastructure tier, the BlueRack 250 offered a scalable multi-cabinet architecture
              configurable from 25kW up to multi-megawatt installations for microgrids and facility backup. While these
              product lines eliminated the fire suppression overhead required by lithium NMC systems, their lower
              volumetric energy density required substantially larger physical footprints, constraining customer
              adoption to sites with ample real estate.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE010
