callouts:
  - calloutType: risk
    title: "Catastrophic Liquidity Exhaustion and Premature Industrial Scaling"
    body: "Natron Energy's sudden demise in September 2025 demonstrates the lethal hazard of high-capex battery manufacturing when commercialization precedes self-sustaining cash flow. Despite raising over $363 million and booking $25 million in customer purchase orders, the company could not bridge the working capital deficit required to fulfill orders or secure follow-on financing. When lithium carbonate spot prices plunged over 70%, the cost differential of sodium-ion eroded, leading institutional investors to freeze scheduled payments and triggering liquidation under Assignment for the Benefit of Creditors."
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR008"
