callouts:
  - calloutType: risk
    title: Insolvency and Asset Liquidation via Assignment for the Benefit of Creditors
    body: Natron Energy ceased all commercial and manufacturing operations on September 3, 2025, after investors froze scheduled funding disbursements and emergency recapitalization efforts failed. The company's largest shareholder, Sherwood Partners, placed Natron into an Assignment for the Benefit of Creditors (ABC) process, liquidating plant assets at auction rather than restructuring the business as an ongoing enterprise.
    claimRefs:
      - CO008
      - CO009
      - CO010
  - calloutType: insight
    title: 'Commercialization Bottleneck: Certification Delays and Capital Intensity'
    body: Despite booking $25 million in customer purchase orders and securing commercial partnerships with industrial power integrators, Natron could not convert backlog into recognized revenue prior to completing formal UL certification, leaving the company vulnerable when venture funding markets retreated.
    claimRefs:
      - CO007
      - CO011
      - CO012
