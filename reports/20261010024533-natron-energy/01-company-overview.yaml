figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Key operational and financing milestones tracing Natron Energy from its 2012 Stanford spinout to commercial factory opening and September 2025 liquidation.
    data:
      items:
        - label: '2012-04: Foundation'
          detail: Natron Energy founded in Santa Clara, California, spun out of Stanford University research by Colin Wessells to commercialize Prussian blue sodium-ion battery chemistry.
          tone: neutral
        - label: '2020-07: UL 1973 Safety Certification'
          detail: Natron achieves first-ever UL 1973 safety listing for sodium-ion battery cells and packs, enabling commercial entry into mission-critical data center backup power.
          tone: positive
        - label: '2021-04: Lonza Supply Agreement'
          detail: Lonza Specialty Ingredients signs multi-year supply agreement to manufacture Prussian blue electrode active materials in Visp, Switzerland, targeting up to 600 MW annual battery capacity.
          tone: positive
        - label: '2024-04: Holland Factory Commissioning'
          detail: Natron officially opens its Holland, Michigan, manufacturing facility, establishing the first commercial-scale sodium-ion battery production site in North America.
          tone: positive
        - label: '2024-08: North Carolina Gigafactory Announcement'
          detail: Natron announces plans for a $1.4 billion, 24 GW gigafactory at the Kingsboro Megasite in Edgecombe County, North Carolina, backed by state Megasite Readiness and JDIG incentives.
          tone: positive
        - label: '2025-04: Series F Top-up Financing'
          detail: Natron secures a $55.4 million top-up to its Series F financing round, bringing total capital raised past $363 million.
          tone: neutral
        - label: '2025-08: Liquidity Freeze & Closure Decision'
          detail: Following frozen funding disbursements and failed emergency recapitalization efforts, the board decides on August 27 to shutter operations, issuing WARN notices affecting 95 workers.
          tone: critical
        - label: '2025-09: Plant Closures & ABC Liquidation'
          detail: Operations cease on September 3, 2025; facilities in Holland and Santa Clara are closed, and largest shareholder Sherwood Partners initiates an Assignment for the Benefit of Creditors asset sale.
          tone: adverse
