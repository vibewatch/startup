callouts:
  - calloutType: strength
    title: Cross-product distribution is the core strategic asset
    body: >-
      The assigned evidence supports a company architecture linking a large image/model community to video production and design-agent workflows, which could lower distribution friction across products.
    claimRefs:
      - CO003
      - CO012
  - calloutType: risk
    title: Scale claims remain difficult to underwrite
    body: >-
      ARR, user counts, financing, and client counts are reported at different scopes and are not accompanied by audited margins, retention, cash, or cohort disclosures.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
  - calloutType: risk
    title: Content governance is a material operating dependency
    body: >-
      Assigned evidence records a 2026 content-safety report and a later authorization-language warning; current remediation effectiveness and liability exposure require primary documentation.
    claimRefs:
      - CO014
