company:
  name: Evoken
chapter:
  number: 1
  title: Company Overview
  summary: Evoken is a Beijing-based AI creative-software company whose disclosed portfolio spans image-community, video-production, and design-agent products. Recent reporting describes rapid financing and ARR growth, but the public record remains company-led on core operating metrics and does not disclose audited margins, cash burn, or runway.
sections:
  - id: identity-and-product-system
    title: Identity and product system
    body: >-
      Evoken is described as a Beijing-based company behind LiblibAI, LibTV, and a design-agent product. The available record supports a product-system description rather than a fully disclosed legal-entity profile: LiblibAI is identified as an AI image-generation and model-sharing platform founded in March 2023, while the newer products extend into video creation and design workflow. The product architecture is strategically coherent—community and model assets can feed production and delivery workflows—but the evidence does not establish consolidated legal entities, headquarters beyond Beijing references, or a complete board and governance structure. A company encyclopedia describes LiblibAI as providing online generation, copyright protection, and community functions, while independent reporting places Evoken in Beijing and Shanghai and links it to Lovart. These are useful identity anchors, not substitutes for corporate filings.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
    tableRefs:
      - TO001
  - id: leadership-and-stakeholders
    title: Leadership, investors, and control questions
    body: >-
      The assigned evidence identifies Chen Mian as Evoken's founder and describes a prior ByteDance commercialization background, but it does not provide a complete executive roster, board composition, voting-control structure, or key-person succession plan. Financing coverage names a broad investor set across the 2025 Series B and 2026 Series B+ rounds, including Granite Asia, Tencent, Shunwei Capital, HSG, Ant Group, and other existing backers. That breadth may provide financing access and strategic distribution, yet the public material does not quantify ownership, liquidation preferences, secondary transactions, debt, or investor concentration. The leadership and stakeholder tables therefore separate reported roles from diligence asks rather than implying governance facts that are not disclosed.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO002
      - TO003
  - id: scale-milestones-and-gaps
    title: Scale, milestones, and underwriting gaps
    body: >-
      Evoken's reported scale has accelerated sharply: coverage of the June 2026 round cites more than $500 million of combined financing across two major rounds, a post-money valuation above $2 billion, and ARR above $300 million as of May 2026. Tech in Asia independently reports the financing and ARR figures while also describing an unfinalized, early-stage Hong Kong IPO discussion and a 300,000-person beta user base for Lovart after an 800,000-person waitlist. These metrics are not audited financial statements, and the source record does not disclose gross margin, net retention, cash balance, burn, runway, customer concentration, or current headcount. The milestone timeline captures reported events and adverse diligence signals, including the April 2026 content-safety issue and the later risk warning reported by Baidu Baike; neither absence nor presence of these reports proves the current state of remediation.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
