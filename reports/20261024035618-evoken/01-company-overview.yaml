      severity: material
      topic: governance
      missingEvidence: "Complete executive roster, board composition, cap table, voting rights, and investor preference schedule."
      whyItMatters: "Founder dependence, control, dilution, and governance protections cannot be assessed from named financing participants alone."
      diligencePath: "Obtain the latest capitalization table, shareholder agreements, board minutes, and leadership responsibility matrix under NDA."
      relatedQuestionRefs:
        - QO004
        - QO008
      relatedTableRefs:
        - TO002
        - TO003
