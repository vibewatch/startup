      - [Video creation, "LibTV is described as an AI video-production platform", "Video generation and video effects are documented", unknown, "Video workflow breadth may differentiate, but output-quality parity is untested"]
      - [Model or workflow customization, "LiblibAI model-sharing community is documented", "LoRA training and ComfyUI are documented", "Hosted models, complex node workflows, and LoRA training are documented", "Accumulated workflows can raise switching costs"]
      - [Professional trust and governance, "No comparable independent evidence in pool", "Review flags open-library ethical and licensing concerns", "No comparable governance evidence in pool", "Enterprise suitability remains an evidence gap"]
      - [Cross-product distribution, "Three specialized products are documented", "Single platform with many tools is documented", "Single platform with model hosting and generation is documented", "Portfolio integration requires usage and retention proof"]
    notes: "Unknown cells are intentional: the pool does not support a like-for-like feature, governance, quality, or enterprise comparison."
    claimRefs: [CP001, CP004, CP005, CP007, CP009]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Provider or alternative, Price or unit model, Included capabilities, Switching or lock-in mechanism, Evidence status]
    rows:
      - [Evoken, unknown, "Image, design-agent, and video products are described", "Potentially shared community, models, and cross-product workflows; unverified", "No public comparable price or contract evidence in pool"]
      - [SeaArt AI, "Stamina renews daily; Credits do not expire; approximately 6 Credits/image and 30–90 Credits/video in review", "Image, video, editing, LoRA, face swap, effects, and creator monetization", "Saved workflows, models, library, and creator assets", "Independent hands-on review; compute-dependent and not a quoted contract price"]
      - [Tensor.Art, "Described as free online image generator", "Image generation, hosted models, node workflows, and LoRA training", "Hosted models and workflows", "Encyclopedia profile; price and service limits require verification"]
      - [Internal build or agency, unknown, "Custom workflow and governance possible", "People, process, data, and accumulated know-how", "Analytical substitute; implementation and staffing switching cost are unquantified"]
    notes: "Competitor token quantities are not converted into dollars or compared with Evoken revenue; realized price, discounts, contracts, and gross margin are unavailable."
    claimRefs: [CP006, CP007, CP008, CP010]
figures:
  - id: FP001
    title: Competitive positioning by documented workflow breadth and ecosystem integration
    type: quadrant
    summary: "Ordinal positioning indicates how much of the documented creative workflow and community ecosystem each alternative covers; it is not a quality or market-share benchmark."
    data:
      xAxis: "Documented workflow breadth (ordinal 1–5)"
      yAxis: "Documented community or ecosystem integration (ordinal 1–5)"
      points:
        - {label: "Evoken portfolio", x: 5, y: 5, note: "Three specialized products and a model-sharing community are documented"}
        - {label: "SeaArt AI", x: 4, y: 4, note: "Broad image/video/tool suite and open library are documented"}
        - {label: "Tensor.Art", x: 3, y: 4, note: "Image generation, model hosting, workflows, and training are documented"}
        - {label: "Single-product specialist", x: 2, y: 2, note: "Generic category comparator; no named source in pool"}
        - {label: "Internal build", x: 3, y: 1, note: "Workflow breadth depends on team scope; no public measurement"}
        - {label: "Manual or agency status quo", x: 2, y: 1, note: "Substitute category; no public measurement"}
    approximationNotes: "Scores are analyst-authored ordinal synthesis from documented scope, not measured market share, quality, pricing, retention, or customer outcomes. Unnamed substitute points are scenario comparators rather than sourced company facts."
    claimRefs: [CP001, CP005, CP009, CP012]
callouts:
  - calloutType: insight
    title: Breadth is not yet a proven moat
    body: "Evoken has documented portfolio breadth, but adjacent platforms also combine multiple generation and customization functions; durability depends on cross-product usage and workflow retention."
    claimRefs: [CP001, CP005, CP009]
  - calloutType: risk
    title: Governance can decide enterprise adoption
    body: "The independent SeaArt review highlights ethical, licensing, and consistency concerns that can also affect buyer trust in creator platforms; Evoken-specific governance evidence is missing."
    claimRefs: [CP007, CP010]
  - calloutType: assumption
    title: Pricing comparison remains incomplete
    body: "SeaArt token consumption and Tensor.Art's free positioning are not equivalent to realized price, margin, or contract economics, and Evoken's comparable data is unavailable."
    claimRefs: [CP006, CP008]
  - calloutType: recommendation
    title: Underwrite workflow retention
    body: "Request cohort-level cross-product usage, model and asset portability, enterprise contract terms, and repeat-production metrics before assigning a durable moat."
    claimRefs: [CP011, CP012]
