      - [Internal build or agency, "Substitute / status quo", null, "Teams with specialized creative or production needs", "Control over workflow, data, and governance", "Cost, staffing, cycle time, and quality are not quantified"]
    notes: "Scope combines company and competitor descriptions; null means the assigned evidence does not quantify a comparable metric."
