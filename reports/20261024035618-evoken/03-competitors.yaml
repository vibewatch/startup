company:
  name: Evoken
chapter:
  number: 3
  title: Competitors
  summary: Evoken competes in a crowded creative-AI field spanning model communities, hosted generation, design agents, and professional video workflows. Public evidence supports meaningful workflow breadth and scale signals, but comparable pricing, retention, and independently measured quality remain unavailable.
sections:
  - id: landscape
    title: Landscape and buyer alternatives
    body: >-
      Evoken's competitive set is broader than a single image-generator peer. RoundOS describes
      the portfolio as LiblibAI for image generation and model sharing, Xingliu as a design agent,
      and LibTV as an AI video-production platform serving creators and businesses. The practical
      alternatives therefore include creator communities such as SeaArt and Tensor.Art, specialist
      video tools, incumbent creative suites, agency or internal production, and status-quo manual
      workflows. A 36Kr project profile describes LiblibAI as an AI-native application for content
      creation and sharing, with a community and model ecosystem; its figures are company-profile
      claims rather than independent benchmarks. Cybernews' hands-on SeaArt review shows the
      adjacent category already combines image, video, face-swap, and lightweight model training,
      so feature breadth alone is unlikely to be durable differentiation. The buyer decision is
      consequently about workflow completion, distribution, trust, and repeatable production rather
      than whether a platform can generate one attractive image.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-and-tradeoffs
    title: Capability, packaging, and switching tradeoffs
    body: >-
      The available evidence indicates a capability race with materially different packaging. The
      Tensor.Art description emphasizes free online image generation, hosted model sharing, complex
      node workflows, and LoRA training. Cybernews describes SeaArt's hybrid Stamina/Credits model:
      daily Stamina is consumed first, while Credits do not expire, and the review reports roughly
      six Credits per image and 30–90 Credits per video, subject to model and compute complexity.
      Those are competitor-specific observations, not a directly comparable market price. The same
      review says SeaArt is browser-first, has inconsistent outputs under repeated prompts, and
      exposes a broad shared library with ethical and licensing concerns. These tradeoffs create
      switching friction through accumulated models, workflows, prompts, libraries, and creator
      reputation, but the pool has no comparable Evoken pricing, retention, or migration data.
      Cells without evidence are deliberately marked unknown.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002, TP003]
  - id: durability-and-risk
    title: Moat durability and displacement risk
    body: >-
      Evoken's strongest defensible possibility is a connected production chain: an image/model
      community can supply creative assets, while design-agent and video products can capture more
      of the downstream workflow. The Tencent News fetch assigned to this pool is only an app
      download page and does not substantiate the article headline, so it is excluded from claims.
      Independent evidence is also mixed: Cybernews reports both broad utility and ethical,
      licensing, browser-dependence, and consistency drawbacks for a close adjacent platform.
      Hurun's 2026 index establishes that AI is a large and fast-moving unicorn category, not that
      Evoken has a unique moat. Competitor convergence, model commoditization, and incumbent
      distribution remain credible displacement risks. The key diligence test is whether Evoken's
      cross-product users, proprietary community assets, and professional workflows produce lower
      acquisition cost or higher repeat usage than single-product alternatives; public evidence in
      this pool does not answer that question.
    claimRefs: [CP009, CP010, CP011, CP012]
    figureRefs: [FP001]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate company-profile evidence from independent competitor observations and
      avoid presenting unlike token, user, funding, or valuation measures as a common performance
      scale. The positioning map is an evidence-backed ordinal synthesis, not a benchmark: its axes
      reflect breadth of the documented workflow and degree of community or ecosystem integration,
      while exact quality, price, and retention remain unknown. It should be read as a diligence
      prioritization aid, not as a claim that any plotted provider wins on customer outcomes.
    claimRefs: [CP003, CP006, CP009, CP012]
    tableRefs: []
    figureRefs: []
