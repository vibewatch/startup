      - ["Model and effect catalog", "Expose open, closed, community, and styled assets", "Third-party models and creator uploads", "Provenance, rights, malware, and quality", "Catalog breadth reported; controls undisclosed"]
      - ["Model adaptation", "Apply compact LoRA-style changes to a base checkpoint", "Compatible checkpoint and training data", "Data rights, reproducibility, and unsafe uploads", "General mechanism only; Evoken path undisclosed"]
      - ["Generation and inference", "Produce media through iterative model inference", "GPU capacity, model availability, and orchestration", "Latency, cost, vendor change, and outage exposure", "General mechanism only; Evoken stack undisclosed"]
      - ["Governance and support", "Moderate content, protect data, and sustain service", "Policies, monitoring, incident response, and compliance", "Privacy, copyright, safety, and regulatory exposure", "No Evoken-specific control evidence retained"]
    notes: >-
      This table is a diligence model, not a representation of Evoken's actual
      software stack; general technical dependencies are explicitly distinguished
      from company-specific disclosures.
    claimRefs: [CE003, CE009, CE010, CE011, CE012, CE013]
figures:
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      The visible workflow spans creator intent, product surfaces, model assets,
      generation, and delivery, while operating controls remain unverified.
    data:
      layers:
        - label: Creator intent
          detail: A creator begins with an idea, prompt, or production need.
          items:
            - label: Idea or brief
              detail: Public descriptions begin with an idea moving toward a finished work.
        - label: Product surfaces
          detail: The reported portfolio separates image, video, and design workflows.
          items:
            - label: LiblibAI
              detail: Image-creation community and creator studio.
            - label: LibTV
              detail: AI-video creation platform.
            - label: Xingliu
              detail: AI design agent.
        - label: Model and effect choice
          detail: The studio is described as compatible with open and closed models.
          items:
            - label: Model catalog
              detail: Reusable models and style categories.
            - label: Visual effects
              detail: More than 500 effects are reported.
        - label: Adaptation and generation
          detail: LoRA-style assets depend on a base checkpoint, while generation requires inference compute.
          items:
            - label: Adapter workflow
              detail: A compact modifier changes a compatible base model.
            - label: Image or video inference
              detail: Media generation depends on model execution and compute.
        - label: Production and delivery
          detail: The portfolio is described as connecting material, production, and delivery.
          items:
            - label: Finished media
              detail: Technical interoperability and customer outcomes remain unverified.
        - label: Operations and trust
          detail: Reliability, privacy, safety, rights, and compliance controls are open diligence items.
          items:
            - label: Undisclosed controls
              detail: No Evoken-specific assurance evidence was available in the usable sources.
    approximationNotes: >-
      The sequence reflects public product descriptions and general model
      mechanics; it does not claim an internally verified Evoken architecture.
    claimRefs: [CE001, CE003, CE008, CE009, CE011, CE014]
