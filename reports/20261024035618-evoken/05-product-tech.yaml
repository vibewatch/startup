company:
  name: Evoken
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Evoken is presented as a connected creative workflow spanning LiblibAI,
    LibTV, and Xingliu, with community models and effects feeding image, video,
    and design work. Public evidence supports the product map but not the
    underlying architecture, reliability, security, privacy, or compliance
    controls, making technical maturity materially less certain than product
    breadth.
sections:
  - id: product-workflow
    title: Product surface and customer workflow
    body: >-
      The clearest product description positions Evoken above individual
      generation models. LiblibAI is described as an image-creation community,
      LibTV as an AI-video platform, and Xingliu as an AI design agent, while
      the three are presented as a chain from source material through production
      to delivery. A separate LiblibAI 2.0 description says creators can move
      from an idea to a finished work in one studio and generate both images and
      videos. This evidence supports a workflow-layer thesis: creators discover
      assets, select a model or effect, generate media, and carry the output
      toward production. It does not establish which users pay, whether reported
      teams are in production, or whether cross-product movement is technically
      integrated rather than a portfolio-level marketing claim.
    claimRefs: [CE001, CE002, CE007, CE008]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-dependencies
    title: Architecture and operating dependencies
    body: >-
      The available material describes compatibility with open-source and
      closed-source models but does not disclose Evoken's routing, inference,
      storage, or observability stack. General practitioner references clarify
      the dependencies behind one visible community workflow. LoRA adapters
      modify a base checkpoint rather than operating alone, and Stable Diffusion
      generation iterates from noise through denoising. Local Stable Diffusion
      deployment also requires GPU capacity. These mechanics make model
      compatibility, checkpoint governance, compute availability, and inference
      cost plausible operating dependencies, but they are not proof of Evoken's
      implementation. Investors should therefore separate the observed product
      catalog from an unverified technical architecture and request direct
      evidence on model vendors, proprietary components, latency, unit cost,
      failover, storage, and release controls.
    claimRefs: [CE003, CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: maturity-differentiation
    title: Maturity and differentiation signals
    body: >-
      Breadth and ecosystem density are the strongest public maturity signals.
      Company-issued coverage reports more than 20 million creators, multiple
      video models, more than 500 visual effects, and a style-model library
      spanning illustration, photography, and e-commerce. Separate
      company-issued coverage describes LiblibAI, LibTV, and Xingliu as a
      connected product group. These claims suggest differentiation through
      creator supply, reusable model assets, and workflow breadth rather than a
      publicly documented proprietary foundation model. The evidence does not
      reconcile registrations with active creators, catalog entries with safe
      or useful assets, or portfolio adjacency with actual interoperability.
      There are no retained customer benchmarks, uptime records, API documents,
      patents, or model-quality evaluations that independently demonstrate
      defensibility or production-grade performance.
    claimRefs: [CE004, CE005, CE006, CE007, CE008]
  - id: trust-reliability-risk
    title: Trust, reliability, and technical risk
    body: >-
      Independent market analysis identifies data governance, content filtering,
      watermarking, compute cost, and access to advanced hardware as material
      constraints for Chinese generative-AI operators. Those are sector risks,
      not evidence that Evoken has suffered a specific incident. The reviewed
      company-specific sources do not document security certifications,
      penetration testing, privacy controls, content provenance, copyright
      screening, model-upload review, incident history, service levels, disaster
      recovery, or regulatory approvals. No public developer repository,
      package, API forum, or engineering benchmark was available in the usable
      evidence. The product may therefore be commercially broad while still
      carrying unquantified third-party-model, compute, rights, moderation, and
      reliability exposure. Technical diligence should treat controls and
      service quality as open evidence requests rather than infer them from user
      or catalog scale.
    claimRefs: [CE013, CE014, CE015]
callouts:
  - calloutType: risk
    title: Product breadth is better evidenced than technical assurance
    body: >-
      Public descriptions support a multi-product creative workflow, but they do
      not verify Evoken's architecture, service levels, security controls, or
      rights-management process.
    claimRefs: [CE008, CE013, CE014, CE015]
