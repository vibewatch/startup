  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Evoken's addressable market is narrower than all generative AI spending. The relevant core is software and
              services that help consumers and professional teams create, edit, distribute, or manage AI-generated
              visual content, including image, video, design-agent, model-community, and workflow products. Adjacent
              spend includes general-purpose model APIs, cloud compute, creator marketplaces, advertising production,
              and entertainment production; those adjacencies can expand the opportunity but should not be counted as
              Evoken revenue without evidence. The status quo remains a mix of manual production, agencies, stock
              assets, conventional editing software, and general-purpose model tools. Public descriptions of LiblibAI
              show a progression from image-model creation and sharing toward video and full workflow production, while
              market research separately identifies software, services, media and entertainment, and content generation
              as distinct categories. This boundary supports a platform thesis but prevents the broadest China-AIGC
              estimates from being treated as directly captured market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Multiple sizing lenses and contradictions
        blocks:
          - type: paragraph
            body: >-
              Three external lenses illustrate both scale and uncertainty. IMARC estimates China's generative-AI market
              at USD 5,160.82 million in 2025 and USD 19,558.29 million in 2034, a 15.96% CAGR, while Grand View
              Research's databook reports USD 1,751.6 million in 2025 and USD 27,861.6 million in 2033, a 42.3% CAGR.
              The difference is not a rounding issue: the publishers use different definitions, segment coverage, and
              forecast horizons. A separate Xinhua report gives a more focused demand signal, estimating AI-generated
              comic-style micro dramas at RMB 16.8 billion in 2025 and more than 10,000 monthly releases from early
              2026. Evoken-specific databases report a $300 million-plus round and $2 billion valuation, but those are
              financing facts, not market size. A disciplined TAM should therefore present these as separate lenses,
              with SAM and SOM left unquantified until Evoken discloses geography, product revenue mix, retention, and
              paid conversion.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is segmented by who creates content and who controls the budget. Consumer creators and model
              communities are users and may pay subscriptions or usage fees; professional producers, studios,
              advertisers, and design teams are both users and budget owners; enterprise customers can buy workflow,
              team, or API capacity; and cloud or model partners can influence distribution and variable cost without
              being end customers. The adoption path generally starts with experimentation or a single asset, expands to
              repeatable production, and only then becomes a team workflow or enterprise integration. The Xinhua
              evidence suggests AI-generated micro dramas can lower production cost and enable multilingual
              distribution, while the Baidu encyclopedia record describes B-side image solutions and a LibTV team
              edition. These signals support a workflow expansion thesis, but the pool does not provide conversion,
              contract value, churn, or customer concentration data.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is being pulled by better multimodal generation, falling production costs, expanding enterprise
              experimentation, and the ability to produce content at greater speed and scale. IMARC describes adoption
              across finance, retail, manufacturing, and media, while Xinhua documents a concrete production-cost
              comparison in which an AI-generated micro drama is said to cost just over RMB 100,000 versus several
              hundred thousand yuan for live action. Constraints are equally material: regulatory compliance requires
              data governance, content filtering, and continuing model updates; computing costs and restricted access to
              advanced hardware can compress margins; and reliability, intellectual-property, and inappropriate-content
              concerns can slow mission-critical adoption. These constraints connect directly to valuation: growth is
              more durable if Evoken can convert creator usage into recurring team or enterprise budgets while
              controlling model and compliance costs. Public evidence does not yet establish that economics.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits preserve the market boundary, competing external sizing lenses, and the buyer workflow
              without forcing unlike estimates into one total. Values are shown in the publisher's stated currency,
              unit, geography, and period. Where a source is company-profile or registry material, it is treated as a
              financing or operating signal rather than independent market validation. The central diligence question is
              not whether generative AI is a large category, but which repeatable paid workflow Evoken owns, how much of
              the relevant spend it can capture, and whether compliance and model costs permit attractive contribution
              margins.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM014
              - CM016
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Boundary before magnitude
            body: >-
              The strongest conclusion is that multiple public estimates describe materially different China-AIGC
              universes; Evoken's opportunity should be underwritten from the visual-content workflow boundary outward,
              not from the largest headline TAM inward.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
          - type: callout
            title: Monetization and compliance remain unproven
            body: >-
              Public evidence shows demand and reported scale, but not the split between consumer subscriptions, team
              products, API, and enterprise revenue or the contribution margin after model, compute, and compliance
              costs.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Evoken's competitive set is broader than a single image-generator peer. RoundOS describes the portfolio as
              LiblibAI for image generation and model sharing, Xingliu as a design agent, and LibTV as an AI
              video-production platform serving creators and businesses. The practical alternatives therefore include
              creator communities such as SeaArt and Tensor.Art, specialist video tools, incumbent creative suites,
              agency or internal production, and status-quo manual workflows. A 36Kr project profile describes LiblibAI
              as an AI-native application for content creation and sharing, with a community and model ecosystem; its
              figures are company-profile claims rather than independent benchmarks. Cybernews' hands-on SeaArt review
              shows the adjacent category already combines image, video, face-swap, and lightweight model training, so
              feature breadth alone is unlikely to be durable differentiation. The buyer decision is consequently about
              workflow completion, distribution, trust, and repeatable production rather than whether a platform can
              generate one attractive image.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP009
      - number: '3.2'
        title: Capability, packaging, and switching tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The available evidence indicates a capability race with materially different packaging. The Tensor.Art
              description emphasizes free online image generation, hosted model sharing, complex node workflows, and
              LoRA training. Cybernews describes SeaArt's hybrid Stamina/Credits model: daily Stamina is consumed first,
              while Credits do not expire, and the review reports roughly six Credits per image and 30–90 Credits per
              video, subject to model and compute complexity. Those are competitor-specific observations, not a directly
              comparable market price. The same review says SeaArt is browser-first, has inconsistent outputs under
              repeated prompts, and exposes a broad shared library with ethical and licensing concerns. These tradeoffs
              create switching friction through accumulated models, workflows, prompts, libraries, and creator
              reputation, but the pool has no comparable Evoken pricing, retention, or migration data. Cells without
              evidence are deliberately marked unknown.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Evoken's strongest defensible possibility is a connected production chain: an image/model community can
              supply creative assets, while design-agent and video products can capture more of the downstream workflow.
              The Tencent News fetch assigned to this pool is only an app download page and does not substantiate the
              article headline, so it is excluded from claims. Independent evidence is also mixed: Cybernews reports
              both broad utility and ethical, licensing, browser-dependence, and consistency drawbacks for a close
              adjacent platform. Hurun's 2026 index establishes that AI is a large and fast-moving unicorn category, not
              that Evoken has a unique moat. Competitor convergence, model commoditization, and incumbent distribution
              remain credible displacement risks. The key diligence test is whether Evoken's cross-product users,
              proprietary community assets, and professional workflows produce lower acquisition cost or higher repeat
              usage than single-product alternatives; public evidence in this pool does not answer that question.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP009
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate company-profile evidence from independent competitor observations and avoid
              presenting unlike token, user, funding, or valuation measures as a common performance scale. The
              positioning map is an evidence-backed ordinal synthesis, not a benchmark: its axes reflect breadth of the
              documented workflow and degree of community or ecosystem integration, while exact quality, price, and
              retention remain unknown. It should be read as a diligence prioritization aid, not as a claim that any
              plotted provider wins on customer outcomes.
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is not yet a proven moat
            body: >-
              Evoken has documented portfolio breadth, but adjacent platforms also combine multiple generation and
              customization functions; durability depends on cross-product usage and workflow retention.
            calloutType: insight
            claimRefs:
              - CP001
              - CP005
              - CP009
          - type: callout
            title: Governance can decide enterprise adoption
            body: >-
              The independent SeaArt review highlights ethical, licensing, and consistency concerns that can also affect
              buyer trust in creator platforms; Evoken-specific governance evidence is missing.
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
          - type: callout
            title: Pricing comparison remains incomplete
            body: >-
              SeaArt token consumption and Tensor.Art's free positioning are not equivalent to realized price, margin,
              or contract economics, and Evoken's comparable data is unavailable.
            calloutType: assumption
            claimRefs:
              - CP006
              - CP008
          - type: callout
            title: Underwrite workflow retention
            body: >-
              Request cohort-level cross-product usage, model and asset portability, enterprise contract terms, and
              repeat-production metrics before assigning a durable moat.
            calloutType: recommendation
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              The available evidence describes three monetization surfaces rather than a single homogeneous SaaS
              product. LiblibAI is presented as a subscription community with compute, LoRA training, original models,
              and advanced generation as paid benefits, while B2B deployments span commerce, design, games, education,
              and training. LibTV adds video creation and team plans, and Lovart/Xingliu adds an agent-style design
              product. TMTPost reports a subscription model and enterprise use cases, while Baidu Baike records more
              than 30 million cumulative users, but this is not an audited revenue measure. A later industry article
              attributes more than $300 million of group ARR to Evoken and $80 million ARR to Lovart; that attribution
              should be treated as company-linked or media-reported until contracts, billing cohorts, and revenue
              recognition are disclosed. Peer figures are useful only as scale references: GetLatka reports $200 million
              of Midjourney revenue, while Sacra and TechCrunch report or estimate $4 billion of Canva ARR. Revenue and
              ARR are not interchangeable, and neither benchmark establishes Evoken's margins.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
              - CI009
              - CI015
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI008
              - CI009
      - number: '4.2'
        title: Pricing, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is incomplete, but the June 2026 account describes LibTV annual tiers from RMB 569
              to RMB 8,499 and off-peak generation as low as RMB 20 per minute. Those are list or observed consumer
              prices, not realized blended ARPU, gross profit, or cash contribution. The same account says Evoken relies
              on third-party model APIs and therefore earns a spread between provider costs and retail pricing. This
              creates a clear sensitivity: usage intensity, provider volume discounts, queue capacity, refunds, and
              support costs can move gross margin even when subscription revenue grows. No assigned source discloses
              CAC, sales cycle, payback, churn, net retention, gross margin, working capital, or capex. The appropriate
              underwriting stance is to model these fields as unavailable and request cohort-level evidence rather than
              infer SaaS economics from ARR or user totals.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI007
              - CI013
              - CI014
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest financing evidence is a reported Series B+ of nearly $300 million at a valuation above $2
              billion, alongside an article describing more than $500 million of cumulative funding. The financing
              improves near-term liquidity, but it is not equivalent to cash on hand: the pool does not provide a
              balance sheet, cash reconciliation, debt schedule, burn rate, runway, or use-of-funds disclosure. The same
              reporting highlights a structural risk in subsidized aggregation: providers can change API prices or
              launch competing first-party products, while moderation and content-compliance failures can impose
              remediation or regulatory costs. The financial verdict is therefore track rather than buy: growth and
              financing are credible enough to warrant diligence, but margin durability and capital sufficiency remain
              material blockers.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing plus multi-product distribution
            body: >-
              Public reporting supports meaningful financing and a broad creative-product footprint, which can fund
              continued product and compute investment if reported ARR converts into cash collections.
            calloutType: strength
            claimRefs:
              - CI004
              - CI010
              - CI011
          - type: callout
            title: Margin and runway are underwriting blockers
            body: >-
              The assigned evidence does not disclose gross margin, cash on hand, burn, runway, or API-cost terms; a
              high ARR headline therefore cannot establish profitability or capital adequacy.
            calloutType: risk
            claimRefs:
              - CI007
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The clearest product description positions Evoken above individual generation models. LiblibAI is
              described as an image-creation community, LibTV as an AI-video platform, and Xingliu as an AI design
              agent, while the three are presented as a chain from source material through production to delivery. A
              separate LiblibAI 2.0 description says creators can move from an idea to a finished work in one studio and
              generate both images and videos. This evidence supports a workflow-layer thesis: creators discover assets,
              select a model or effect, generate media, and carry the output toward production. It does not establish
              which users pay, whether reported teams are in production, or whether cross-product movement is
              technically integrated rather than a portfolio-level marketing claim.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE008
