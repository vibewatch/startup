              - CU003
              - CU004
              - CU005
              - CU006
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU012
              - CU015
      - number: '6.3'
        title: Retention, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              No assigned source discloses Evoken's NRR, GRR, logo churn, renewal rate, contract length, cohort
              retention, net dollar expansion, customer concentration, or channel mix. The article's statement that
              revenue mainly comes from professional content producers identifies a plausible buyer segment, but it does
              not establish whether those producers are direct subscribers, API users, agencies, or one-time project
              customers. The wider market evidence shows that AI video is being adopted in Chinese content production,
              including claims of industrial-scale output and sharply shorter production cycles, but those market
              conditions are not evidence of Evoken retention or share. Underwriting should treat expansion and
              concentration as open questions until account-level and cohort-level evidence is supplied.
            claimRefs:
              - CU005
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
