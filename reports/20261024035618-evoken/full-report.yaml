        - label: Product surfaces
          detail: The reported portfolio separates image, video, and design workflows.
          items:
            - label: LiblibAI
              detail: Image-creation community and creator studio.
            - label: LibTV
              detail: AI-video creation platform.
            - label: Xingliu
              detail: AI design agent.
        - label: Model and effect choice
          detail: The studio is described as compatible with open and closed models.
          items:
            - label: Model catalog
              detail: Reusable models and style categories.
            - label: Visual effects
              detail: More than 500 effects are reported.
        - label: Adaptation and generation
          detail: LoRA-style assets depend on a base checkpoint, while generation requires inference compute.
          items:
            - label: Adapter workflow
              detail: A compact modifier changes a compatible base model.
            - label: Image or video inference
              detail: Media generation depends on model execution and compute.
        - label: Production and delivery
          detail: The portfolio is described as connecting material, production, and delivery.
          items:
            - label: Finished media
              detail: Technical interoperability and customer outcomes remain unverified.
        - label: Operations and trust
          detail: Reliability, privacy, safety, rights, and compliance controls are open diligence items.
          items:
            - label: Undisclosed controls
              detail: No Evoken-specific assurance evidence was available in the usable sources.
