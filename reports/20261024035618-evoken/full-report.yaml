  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              China's synthetic-content rules are an operating requirement, not merely a registration exercise. The
              Measures took effect on September 1, 2025 and require both perceptible labels and metadata labels,
              including when users download, reproduce, or export generated files. They also connect labeling evidence
              to algorithm-filing and safety-assessment procedures and authorize relevant regulators to address
              violations. This makes end-to-end label persistence, export testing, log retention, and clear compliance
              ownership central diligence items for Evoken's image and video products. Historical reporting says
              LiblibAI completed Chinese algorithm and generative-AI service filings in 2024, but that company-linked
              account does not verify current implementation under the later labeling regime. The thesis-break trigger
              is a substantiated filing defect, enforcement action, or inability to demonstrate labels and traceability
              across exported content.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
      - number: '7.2'
        title: Copyright and content-control exposure
        blocks:
          - type: paragraph
            body: >-
              Copyright risk is unusually concrete for a creator platform that supports user-uploaded models and
              workflows. A Hangzhou appellate judgment upheld contributory infringement where users trained a LoRA model
              on protected Ultraman images and the platform failed to take necessary measures. The accompanying legal
              analysis says duty of care can rise with profitability and recommends stronger copyright-recognition
              systems for dedicated model training. A separate Beijing ruling recognized copyright in a prompted AI
              image, but the commentary stresses that Chinese courts lack common-law stare decisis and have not reached
              consensus. Evoken therefore faces both infringement-control risk and ownership uncertainty. Mitigation
              must be evidenced through rights provenance, repeat-infringer handling, notice and takedown metrics, model
              screening, and escalation records rather than a general claim that users bear responsibility.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
              - CR016
      - number: '7.3'
        title: Operating, partner, and model dependencies
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence identifies several dependencies but does not quantify them. Regulatory analysis
              places responsibility on providers for training data quality, illegal-content response, user agreements,
              and information security. A republished industry analysis says the company did not train a general-purpose
              foundation model and instead competes at the application layer, where external models can be purchased,
              integrated, and replaced. That may provide flexibility, but it also leaves model-provider pricing,
              availability, quality, licensing, cloud capacity, and migration readiness as material unknowns. The public
              pool contains no Evoken-specific outage, breach, certification, complaint, or enforcement history. Absence
              from this bounded evidence set is not proof of absence; management should supply an incident register,
              dependency map, concentration shares, termination terms, tested fallbacks, and recovery objectives.
            claimRefs:
              - CR009
              - CR012
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.4'
        title: Financial-model risk, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Capital availability is not the same as loss-absorption capacity. A 2024 financing account said proceeds
              would fund compute infrastructure, model and plugin development, and creator-ecosystem support. A later
              republished analysis relayed company disclosures of more than $300 million of ARR, more than 30 million
              users, and a nearly $300 million B+ round at a valuation above $2 billion. Those figures indicate scale
              and substantial capital access, but they do not disclose audited revenue recognition, gross margin,
              retention, burn, cash, runway, or customer concentration. Monitoring should therefore focus on verified
              label-control exceptions, rights complaints and takedown recurrence, model or cloud concentration, service
              availability, gross margin after model and compute costs, cash runway, and renewal quality. Any
              injunction, repeated unremediated infringement, prolonged critical outage, funding shortfall, or inability
              to reconcile recurring revenue to cash collections should pause investment.
            claimRefs:
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Pause investment on a substantiated enforcement action, injunction, repeated unremediated infringement,
              prolonged critical outage, inability to preserve labels through export, or failure to reconcile recurring
              revenue to cash and runway.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR015
              - CR016
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned pool does not verify Evoken's controls, incidents, margins, burn, cash, runway, or
              concentration. These omissions are diligence gaps, not evidence that the risks are absent or that a
              failure has occurred.
            calloutType: assumption
            claimRefs:
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and price discipline
        blocks:
          - type: paragraph
            body: >-
              Evoken has a credible scale signal: an independent venture-news account reports a $300 million Series B+
              at a post-money valuation above $2 billion, while the same account reports ARR above $300 million as of
              May 2026. That arithmetic suggests a headline valuation-to-ARR ratio below 6.7x, but it is not a verified
              enterprise-value multiple because the valuation, ARR definition, revenue mix, debt, cash, and preference
              stack are not disclosed. A separate June 2026 funding roundup also reports Liblib, an Evoken product,
              raised $300 million at a valuation above $2 billion and had more than 30 million cumulative users. The
              decision implication is track: the price may be reasonable if ARR is recurring, gross margins are strong,
              and growth is durable, but public evidence does not support a buy recommendation or a target return
              calculation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV013
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is a multi-product workflow rather than a single generation feature. The reported
              Evoken portfolio links LiblibAI's creator community, LibTV's video workflow, and Xingliu's design agent;
              the account says LiblibAI had more than 30 million users, 500,000 original models, and that LibTV served
              nearly 1,000 teams. Industry evidence supports a large addressable use case: a May 2026 report describes
              China's micro-drama market as projected above 120 billion yuan, with more than 50,000 AI-native titles
              added to Douyin in March and production costs around one-tenth of live action. The anti-thesis is that
              capital and attention may outrun monetization: the same market report says output quality is uneven and
              cites an overseas micro-drama company that generated approximately $400 million in 2024 revenue but
              remained unprofitable. Evoken therefore needs cohort-level retention, contribution margin, and customer
              concentration evidence before the thesis can support a premium multiple.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenarios, comparables, and downside
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single point valuation because the public record does not
              disclose audited revenue, gross margin, net revenue retention, burn, or cash runway. SaaS valuation
              guidance distinguishes ARR from total or forward revenue and says investors should test ARR against
              growth, retention, gross margin, CAC payback, and profitability. A 2026 market report places AI-native
              software at a median 21.2x EV/revenue in venture rounds and 11.5x in M&A, versus 5.5x and 3.8x for legacy
              SaaS, but those are broad category benchmarks rather than Evoken comparables. A second benchmark source
              reports 4.4x median implied ARR for public software in October 2026 and 21.7x for the top ten,
              underscoring dispersion. Applying a conservative 4x–8x range to the reported $300 million ARR would imply
              $1.2–$2.4 billion before adjustments for ARR quality, cash, debt, and preferences; this is an analytical
              range, not a fair-value estimate.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by a private round alone. The next diligence package should reconcile
              ARR to invoices and recognized revenue by product, show gross margin after model and inference costs,
              provide cohort retention and expansion, disclose customer and channel concentration, and provide the
              capitalization table with liquidation preferences, option pools, debt, and the exact post-money basis. The
              company also needs to evidence whether reported growth came from repeat professional production budgets or
              from launch-period usage and promotional activity. Regulatory review matters because the target market is
              content generation: a cited industry account describes tiered review and platform checks, including
              provincial approval for productions above one million yuan and removal of more than 25,000 episodes for
              violations. A thesis break would be material ARR restatement, sustained gross margin compression from
              third-party model costs, net retention below plan, a down round, or inability to renew major production
              accounts.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The reported scale is investable-looking, but public evidence does not establish durable, high-margin ARR
              or clean shareholder economics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV013
          - type: callout
            title: Workflow positioning
            body: >-
              The reported product set spans creator community, video production, and design, which could support
              cross-sell beyond a single generation feature.
            calloutType: strength
            claimRefs:
              - CV005
              - CV006
          - type: callout
            title: Multiple dispersion
            body: >-
              AI-native valuation benchmarks vary sharply by growth, retention, margin, and defensibility; category
              membership alone cannot justify a premium.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
          - type: callout
            title: Critical diligence assumption
            body: >-
              The scenario range assumes reported ARR is a recurring denominator; invoices, recognized revenue, and
              product-level gross profit must validate that assumption.
            calloutType: assumption
            claimRefs:
              - CV002
              - CV013
