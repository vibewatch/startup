          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE008
              - CE009
              - CE011
              - CE014
      - number: '5.2'
        title: Architecture and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The available material describes compatibility with open-source and closed-source models but does not
              disclose Evoken's routing, inference, storage, or observability stack. General practitioner references
              clarify the dependencies behind one visible community workflow. LoRA adapters modify a base checkpoint
              rather than operating alone, and Stable Diffusion generation iterates from noise through denoising. Local
              Stable Diffusion deployment also requires GPU capacity. These mechanics make model compatibility,
              checkpoint governance, compute availability, and inference cost plausible operating dependencies, but they
              are not proof of Evoken's implementation. Investors should therefore separate the observed product catalog
              from an unverified technical architecture and request direct evidence on model vendors, proprietary
              components, latency, unit cost, failover, storage, and release controls.
            claimRefs:
              - CE003
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.3'
        title: Maturity and differentiation signals
        blocks:
          - type: paragraph
            body: >-
              Breadth and ecosystem density are the strongest public maturity signals. Company-issued coverage reports
              more than 20 million creators, multiple video models, more than 500 visual effects, and a style-model
              library spanning illustration, photography, and e-commerce. Separate company-issued coverage describes
              LiblibAI, LibTV, and Xingliu as a connected product group. These claims suggest differentiation through
              creator supply, reusable model assets, and workflow breadth rather than a publicly documented proprietary
              foundation model. The evidence does not reconcile registrations with active creators, catalog entries with
              safe or useful assets, or portfolio adjacency with actual interoperability. There are no retained customer
              benchmarks, uptime records, API documents, patents, or model-quality evaluations that independently
              demonstrate defensibility or production-grade performance.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.4'
        title: Trust, reliability, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Independent market analysis identifies data governance, content filtering, watermarking, compute cost, and
              access to advanced hardware as material constraints for Chinese generative-AI operators. Those are sector
              risks, not evidence that Evoken has suffered a specific incident. The reviewed company-specific sources do
              not document security certifications, penetration testing, privacy controls, content provenance, copyright
              screening, model-upload review, incident history, service levels, disaster recovery, or regulatory
              approvals. No public developer repository, package, API forum, or engineering benchmark was available in
              the usable evidence. The product may therefore be commercially broad while still carrying unquantified
              third-party-model, compute, rights, moderation, and reliability exposure. Technical diligence should treat
              controls and service quality as open evidence requests rather than infer them from user or catalog scale.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product breadth is better evidenced than technical assurance
            body: >-
              Public descriptions support a multi-product creative workflow, but they do not verify Evoken's
              architecture, service levels, security controls, or rights-management process.
            calloutType: risk
            claimRefs:
              - CE008
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Reported reach and customer segments
        blocks:
          - type: paragraph
            body: >-
              A May 2026 report describes Evoken as operating three connected products: LiblibAI, LibTV, and Xingliu.
              The article reports more than 30 million LiblibAI users, 500,000 original models, more than 10 million
              Xingliu users, and nearly 1,000 teams using LibTV. It also says the core revenue mainly comes from
              professional content producers in short dramas, films, and advertising. These are third-party-reported
              company metrics rather than audited customer records, and the article does not define active users, paying
              users, customer contracts, geography, cohort dates, or revenue contribution by product. The defensible
              segmentation is therefore consumer/community reach, professional production teams, and design-agent users;
              payer and user identities remain only partly observable.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The available source set does not provide a customer-by-customer reference list, procurement record,
              contract term, renewal record, or independently measured utilization series for Evoken. The reported LibTV
              figure of nearly 1,000 teams is a useful indicator of commercial surface area, while the reported 30
              million LiblibAI users and more than 10 million Xingliu users indicate broad reach; neither figure proves
              paid conversion, repeat use, production deployment, or outcome quality. Two prefetched pages that contain
              the name Evoken are clearly about a New Jersey funeral-doom metal band, not the Beijing AI company, and
              must not be treated as customer evidence. This name collision materially increases the need for direct
              customer references and a product-level activity denominator.
            claimRefs:
              - CU003
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
