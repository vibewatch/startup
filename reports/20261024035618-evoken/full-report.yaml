chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product system
        blocks:
          - type: paragraph
            body: >-
              Evoken is described as a Beijing-based company behind LiblibAI, LibTV, and a design-agent product. The
              available record supports a product-system description rather than a fully disclosed legal-entity profile:
              LiblibAI is identified as an AI image-generation and model-sharing platform founded in March 2023, while
              the newer products extend into video creation and design workflow. The product architecture is
              strategically coherent—community and model assets can feed production and delivery workflows—but the
              evidence does not establish consolidated legal entities, headquarters beyond Beijing references, or a
              complete board and governance structure. A company encyclopedia describes LiblibAI as providing online
              generation, copyright protection, and community functions, while independent reporting places Evoken in
              Beijing and Shanghai and links it to Lovart. These are useful identity anchors, not substitutes for
              corporate filings.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
