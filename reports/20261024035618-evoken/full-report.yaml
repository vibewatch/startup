              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad reported reach
            body: >-
              The assigned evidence reports tens of millions of users across LiblibAI and Xingliu and nearly 1,000 LibTV
              teams, which is a meaningful commercial-surface signal if the denominators and payment status are
              confirmed.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
          - type: callout
            title: Durability is unproven
            body: >-
              No assigned source verifies retention, renewal, cohort behavior, customer concentration, or named
              production outcomes; reported reach should not be underwritten as durable recurring revenue.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
