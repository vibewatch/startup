  - id: FO001
    title: Reported company milestone timeline
    type: timeline
    summary: >-
      Reported product, financing, scale, and risk milestones show rapid expansion alongside unresolved compliance and
      disclosure questions.
    data:
      items:
        - date: 2023-03
          label: LiblibAI founded
          details: Baidu Baike identifies LiblibAI as founded in March 2023.
          tone: positive
          claimRefs:
            - CO002
        - date: 2023-09
          label: Angel financing
          details: BigGo reports a $3.5M angel round in September 2023.
          tone: positive
          claimRefs:
            - CO006
        - date: '2024'
          label: Algorithm filing
          details: Baidu Baike reports a National Deep Synthesis Service Algorithm Filing for the platform.
          tone: neutral
          claimRefs:
            - CO004
        - date: 2025-02
          label: Model integrations and financing
          details: Baidu Baike reports StepFun and Alibaba Tongyi integrations and four financing rounds during 2025.
          tone: positive
          claimRefs:
            - CO004
        - date: 2025-10
          label: Series B
          details: BigGo reports a $130M Series B co-led by HSG, CMC Capital, and Ant Group.
          tone: positive
          claimRefs:
            - CO006
        - date: 2026-03
          label: LibTV launch
          details: Baidu Baike reports the launch of the AI video-creation product LibTV.
          tone: positive
          claimRefs:
            - CO004
        - date: 2026-04
          label: Content-safety issue reported
          details: >-
            Baidu Baike reports CCTV coverage of inappropriate-content generation vulnerabilities and a company response
            describing remediation.
          tone: negative
          claimRefs:
            - CO014
        - date: 2026-06
          label: Series B+ and $2B+ valuation
          details: BigGo and Tech in Asia report nearly $300M raised at a post-money valuation above $2B.
          tone: positive
          claimRefs:
            - CO010
        - date: 2026-08
