        title: Scale, milestones, and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Evoken's reported scale has accelerated sharply: coverage of the June 2026 round cites more than $500
              million of combined financing across two major rounds, a post-money valuation above $2 billion, and ARR
              above $300 million as of May 2026. Tech in Asia independently reports the financing and ARR figures while
