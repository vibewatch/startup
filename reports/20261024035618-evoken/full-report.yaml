              - CU003
              - CU005
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Evidence limitations and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The customer case is directionally positive but evidence-constrained. The strongest current signal is a
              reported combination of consumer-scale reach and professional-team adoption across linked products. The
              weakest links are independent corroboration, payment status, production-versus-pilot classification, and
              durability. The assigned search log recorded nine searches, but only two returned the name-collision pages
              retained as result URLs; the other relevant-looking pages were rediscovered prior URLs or general market
              coverage rather than current search hits. A diligence process should request an anonymized customer
              waterfall, active-paying definitions, monthly cohort retention, top-ten account share, contract and
              renewal samples, and named customer permission for reference calls.
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU012
