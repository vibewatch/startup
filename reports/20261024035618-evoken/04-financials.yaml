      - ["Lovart/Xingliu", "Design-agent subscriptions or usage", "$80M ARR attributed to Lovart in one report; not independently audited", "Single-source reported metric", "Billing export, geography mix, retention, and model/API cost allocation"]
      - ["Group", "Multi-product creative software", "ARR above $300M attributed to Evoken; user totals exceed 30M in public accounts", "Metric definitions and period require reconciliation", "Segment bridge from billings to recognized revenue and ARR"]
    notes: "Values are public claims or reported list prices, not audited revenue; user counts, ARR, and daily generation are different denominators and periods."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI008, CI009]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric, Value or null, Unit, Confidence, Why it matters, Diligence ask]
    rows:
      - [LibTV annual tier low, 569, RMB per year, medium, "Sets a public entry price but not realized ARPU", "Invoice distribution and discount rate"]
      - [LibTV annual tier high, 8499, RMB per year, medium, "Shows packaging range for heavier users or teams", "Tier mix, attach rate, and renewal"]
      - [LibTV off-peak generation, 20, RMB per minute, low, "Indicates price positioning against a cost-sensitive workflow", "Provider cost, peak/off-peak utilization, and contribution margin"]
      - [Subscription benefits, null, "compute / training / models / generation", medium, "Explains monetization mechanism without a disclosed price-to-cost bridge", "Benefit-level usage and cost ledger"]
      - [Realized blended ARPU, null, "RMB or USD per paid account", low, "Required to distinguish list pricing from revenue quality", "Cohort billings and active paid-account denominator"]
    notes: "Published or reported price points are not evidence of realized revenue, margin, or cash contribution; nulls are explicit diligence gaps."
    claimRefs: [CI005, CI006, CI007]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, ">US$300M", medium, "Signals scale if definition and period are verified", "Reconcile ARR to contracts, billings, and recognized revenue"]
      - [Lovart ARR, "US$80M reported", low, "Shows potential product concentration and mix", "Product-level billing and retention export"]
      - [Gross margin, null, low, "Third-party inference costs may materially affect contribution", "Provider invoices, inference cost per unit, and gross-margin bridge"]
      - [Cash on hand, null, low, "Funding raised is not cash available after spending", "Latest balance sheet and cash reconciliation"]
      - [Burn and runway, null, low, "Determines whether another round is required", "Monthly cash flow, burn definition, and runway case"]
      - [CAC/payback/NRR, null, low, "Commercial efficiency and retention are unobservable publicly", "Cohort metrics by product and channel"]
    notes: "ARR and funding are reported quantities, not audited cash or profit measures; every unavailable field requires company-provided financial evidence."
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Customer subscriptions and team workflows generate billings while third-party inference and service costs determine contribution margin.
    data:
      nodes:
        - {id: creator-subscriptions, label: Creator subscriptions, value: "List tiers reported; realized ARPU unknown", note: "LiblibAI and LibTV consumer plans"}
        - {id: enterprise-workflows, label: Enterprise and team workflows, value: "Use cases and teams reported", note: "Contract value and renewal not disclosed"}
        - {id: model-api-costs, label: Third-party model/API costs, value: "Not disclosed", note: "Provider pricing and utilization drive gross margin"}
        - {id: service-and-support, label: Service, support, and compliance costs, value: "Not disclosed", note: "Implementation and moderation costs are unquantified"}
        - {id: contribution-margin, label: Contribution margin, value: "Not disclosed", note: "Cannot be derived from ARR or user counts"}
        - {id: cash-runway, label: Cash and runway, value: "Not disclosed", note: "Funding raised is not cash available"}
      edges:
        - {from: creator-subscriptions, to: contribution-margin, label: subscription billings}
        - {from: enterprise-workflows, to: contribution-margin, label: contract and team billings}
        - {from: model-api-costs, to: contribution-margin, label: subtract variable inference cost}
        - {from: service-and-support, to: contribution-margin, label: subtract operating cost}
        - {from: contribution-margin, to: cash-runway, label: cash generation funds runway}
    approximationNotes: "Qualitative bridge only; no unsupported conversion rates or margin values are inferred."
    claimRefs: [CI001, CI007, CI013, CI014]
callouts:
  - calloutType: strength
    title: Financing plus multi-product distribution
    body: Public reporting supports meaningful financing and a broad creative-product footprint, which can fund continued product and compute investment if reported ARR converts into cash collections.
    claimRefs: [CI004, CI010, CI011]
  - calloutType: risk
    title: Margin and runway are underwriting blockers
    body: The assigned evidence does not disclose gross margin, cash on hand, burn, runway, or API-cost terms; a high ARR headline therefore cannot establish profitability or capital adequacy.
    claimRefs: [CI007, CI013, CI014]
