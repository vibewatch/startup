company:
  name: Evoken
chapter:
  number: 4
  title: Financials
  summary: Evoken's public financial picture combines reported or company-linked ARR and user metrics with substantial uncertainty about realized revenue, gross margin, cash burn, and model-inference costs. The evidence supports a fast-growing multi-product creative platform, but the underwriting case remains dependent on whether low-priced access to third-party models can convert into durable contribution margin.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      The available evidence describes three monetization surfaces rather than a single
      homogeneous SaaS product. LiblibAI is presented as a subscription community with
      compute, LoRA training, original models, and advanced generation as paid benefits,
      while B2B deployments span commerce, design, games, education, and training. LibTV
      adds video creation and team plans, and Lovart/Xingliu adds an agent-style design
      product. TMTPost reports a subscription model and enterprise use cases, while Baidu
      Baike records more than 30 million cumulative users, but this is not an audited
      revenue measure. A later industry article
      attributes more than $300 million of group ARR to Evoken and $80 million ARR to
      Lovart; that attribution should be treated as company-linked or media-reported until
      contracts, billing cohorts, and revenue recognition are disclosed. Peer figures are
      useful only as scale references: GetLatka reports $200 million of Midjourney revenue,
      while Sacra and TechCrunch report or estimate $4 billion of Canva ARR. Revenue and
      ARR are not interchangeable, and neither benchmark establishes Evoken's margins.
    claimRefs: [CI001, CI002, CI003, CI004, CI008, CI009, CI015, CI016]
    tableRefs: [TI001]
  - id: pricing-and-unit-economics
    title: Pricing, cost structure, and unit economics
    body: >-
      Public pricing evidence is incomplete, but the June 2026 account describes LibTV
      annual tiers from RMB 569 to RMB 8,499 and off-peak generation as low as RMB 20 per
      minute. Those are list or observed consumer prices, not realized blended ARPU, gross
      profit, or cash contribution. The same account says Evoken relies on third-party
      model APIs and therefore earns a spread between provider costs and retail pricing.
      This creates a clear sensitivity: usage intensity, provider volume discounts, queue
      capacity, refunds, and support costs can move gross margin even when subscription
      revenue grows. No assigned source discloses CAC, sales cycle, payback, churn, net
      retention, gross margin, working capital, or capex. The appropriate underwriting
      stance is to model these fields as unavailable and request cohort-level evidence
      rather than infer SaaS economics from ARR or user totals.
    claimRefs: [CI005, CI006, CI007, CI013]
    tableRefs: [TI002, TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The strongest financing evidence is a reported Series B+ of nearly $300 million at
      a valuation above $2 billion, alongside an article describing more than $500 million
      of cumulative funding. The financing improves near-term liquidity, but it is not
      equivalent to cash on hand: the pool does not provide a balance sheet, cash
      reconciliation, debt schedule, burn rate, runway, or use-of-funds disclosure. The
      same reporting highlights a structural risk in subsidized aggregation: providers
      can change API prices or launch competing first-party products, while moderation and
      content-compliance failures can impose remediation or regulatory costs. The financial
      verdict is therefore track rather than buy: growth and financing are credible enough
      to warrant diligence, but margin durability and capital sufficiency remain material
      blockers.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: []
