      - ["Label or provenance metadata is removed during export or distribution", "Medium", "High", "Unverified", "High", "No end-to-end export test or exception rate"]
      - ["Privacy, fraud, data-security, or illegal-content incident", "Unknown", "High", "Unverified", "High", "No Evoken incident register, audit, certification, or response SLA in the pool"]
    notes: "The failure modes derive from cited rules and legal analyses; no row asserts that Evoken has experienced an incident, and unknown means the assigned sources provide no company-specific evidence."
    claimRefs: [CR002, CR003, CR006, CR007, CR009, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Foundation models and APIs", "Undisclosed model providers", "Generation capabilities", "Unknown", "Price, licensing, quality, or availability change", "High", "Multi-model routing and tested migration", "High"]
      - ["Compute and hosting", "Undisclosed infrastructure providers", "Training and inference capacity", "Unknown", "Capacity loss or cost spike compresses margin", "High", "Capacity commitments, redundancy, and unit-cost monitoring", "High"]
      - ["Creator and customer ecosystem", "Users, rights holders, and production clients", "Content supply and monetization", "Unknown", "Rights dispute, churn, or customer concentration weakens revenue", "High", "Rights provenance, cohort retention, and concentration limits", "High"]
    notes: "Counterparties, contract terms, spend shares, revenue shares, and fallback readiness are not disclosed in the assigned evidence; concentration and residual scores require management verification."
    claimRefs: [CR011, CR012, CR013, CR014, CR015]
