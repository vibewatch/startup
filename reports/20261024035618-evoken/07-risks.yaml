callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Pause investment on a substantiated enforcement action, injunction,
      repeated unremediated infringement, prolonged critical outage, inability
      to preserve labels through export, or failure to reconcile recurring
      revenue to cash and runway.
    claimRefs: [CR002, CR005, CR006, CR015, CR016]
  - calloutType: assumption
    title: Evidence boundary
    body: >-
      The assigned pool does not verify Evoken's controls, incidents, margins,
      burn, cash, runway, or concentration. These omissions are diligence gaps,
      not evidence that the risks are absent or that a failure has occurred.
    claimRefs: [CR015, CR016]
