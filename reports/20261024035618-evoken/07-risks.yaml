company:
  name: Evoken
chapter:
  number: 7
  title: Risks
  summary: >-
    Evoken's highest-evidence risks are copyright-platform liability and China's
    synthetic-content compliance regime, while its fastest-scaling products also
    create upstream-model, compute, and financial-quality dependencies. Public
    evidence does not establish Evoken's control maturity, incident history,
    concentration, audited margins, burn, or runway, leaving residual exposure
    high until management supplies operating evidence.
sections:
  - id: regulatory-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      China's synthetic-content rules are an operating requirement, not merely a
      registration exercise. The Measures took effect on September 1, 2025 and
      require both perceptible labels and metadata labels, including when users
      download, reproduce, or export generated files. They also connect labeling
      evidence to algorithm-filing and safety-assessment procedures and authorize
      relevant regulators to address violations. This makes end-to-end label
      persistence, export testing, log retention, and clear compliance ownership
      central diligence items for Evoken's image and video products. Historical
      reporting says LiblibAI completed Chinese algorithm and generative-AI
      service filings in 2024, but that company-linked account does not verify
      current implementation under the later labeling regime. The thesis-break
      trigger is a substantiated filing defect, enforcement action, or inability
      to demonstrate labels and traceability across exported content.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR010]
    tableRefs: [TR001]
  - id: copyright-and-content-controls
    title: Copyright and content-control exposure
    body: >-
      Copyright risk is unusually concrete for a creator platform that supports
      user-uploaded models and workflows. A Hangzhou appellate judgment upheld
      contributory infringement where users trained a LoRA model on protected
      Ultraman images and the platform failed to take necessary measures. The
      accompanying legal analysis says duty of care can rise with profitability
      and recommends stronger copyright-recognition systems for dedicated model
      training. A separate Beijing ruling recognized copyright in a prompted AI
      image, but the commentary stresses that Chinese courts lack common-law
      stare decisis and have not reached consensus. Evoken therefore faces both
      infringement-control risk and ownership uncertainty. Mitigation must be
      evidenced through rights provenance, repeat-infringer handling, notice and
      takedown metrics, model screening, and escalation records rather than a
      general claim that users bear responsibility.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: operating-and-dependency-risk
    title: Operating, partner, and model dependencies
    body: >-
      The assigned evidence identifies several dependencies but does not quantify
      them. Regulatory analysis places responsibility on providers for training
      data quality, illegal-content response, user agreements, and information
      security. A republished industry analysis says the company did not train a
      general-purpose foundation model and instead competes at the application
      layer, where external models can be purchased, integrated, and replaced.
      That may provide flexibility, but it also leaves model-provider pricing,
      availability, quality, licensing, cloud capacity, and migration readiness
      as material unknowns. The public pool contains no Evoken-specific outage,
      breach, certification, complaint, or enforcement history. Absence from
      this bounded evidence set is not proof of absence; management should supply
      an incident register, dependency map, concentration shares, termination
      terms, tested fallbacks, and recovery objectives.
    claimRefs: [CR009, CR012, CR016]
    tableRefs: [TR003]
    figureRefs: [FR001]
  - id: financial-model-and-kill-criteria
    title: Financial-model risk, monitoring, and kill criteria
    body: >-
      Capital availability is not the same as loss-absorption capacity. A 2024
      financing account said proceeds would fund compute infrastructure, model
      and plugin development, and creator-ecosystem support. A later republished
      analysis relayed company disclosures of more than $300 million of ARR,
      more than 30 million users, and a nearly $300 million B+ round at a
      valuation above $2 billion. Those figures indicate scale and substantial
      capital access, but they do not disclose audited revenue recognition,
      gross margin, retention, burn, cash, runway, or customer concentration.
      Monitoring should therefore focus on verified label-control exceptions,
      rights complaints and takedown recurrence, model or cloud concentration,
      service availability, gross margin after model and compute costs, cash
      runway, and renewal quality. Any injunction, repeated unremediated
      infringement, prolonged critical outage, funding shortfall, or inability
      to reconcile recurring revenue to cash collections should pause investment.
    claimRefs: [CR011, CR013, CR014, CR015]
