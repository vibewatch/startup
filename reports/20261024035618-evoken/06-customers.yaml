callouts:
  - calloutType: strength
    title: Broad reported reach
    body: "The assigned evidence reports tens of millions of users across LiblibAI and Xingliu and nearly 1,000 LibTV teams, which is a meaningful commercial-surface signal if the denominators and payment status are confirmed."
    claimRefs: [CU001, CU003]
  - calloutType: risk
    title: Durability is unproven
    body: "No assigned source verifies retention, renewal, cohort behavior, customer concentration, or named production outcomes; reported reach should not be underwritten as durable recurring revenue."
    claimRefs: [CU013, CU014, CU015, CU016]
