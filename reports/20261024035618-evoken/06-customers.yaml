chapter:
  number: 6
  title: Customers
  summary: Public evidence supports substantial reported reach for Evoken's LiblibAI, LibTV, and Xingliu products, but the assigned refresh evidence does not independently establish named production deployments, retention, customer concentration, or payer economics. The principal diligence conclusion is therefore scale potential with low-confidence durability evidence.
sections:
  - id: reported-customer-scale
    title: Reported reach and customer segments
    body: "A May 2026 report describes Evoken as operating three connected products: LiblibAI, LibTV, and Xingliu. The article reports more than 30 million LiblibAI users, 500,000 original models, more than 10 million Xingliu users, and nearly 1,000 teams using LibTV. It also says the core revenue mainly comes from professional content producers in short dramas, films, and advertising. These are third-party-reported company metrics rather than audited customer records, and the article does not define active users, paying users, customer contracts, geography, cohort dates, or revenue contribution by product. The defensible segmentation is therefore consumer/community reach, professional production teams, and design-agent users; payer and user identities remain only partly observable."
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named proof
    body: "The available source set does not provide a customer-by-customer reference list, procurement record, contract term, renewal record, or independently measured utilization series for Evoken. The reported LibTV figure of nearly 1,000 teams is a useful indicator of commercial surface area, while the reported 30 million LiblibAI users and more than 10 million Xingliu users indicate broad reach; neither figure proves paid conversion, repeat use, production deployment, or outcome quality. Two prefetched pages that contain the name Evoken are clearly about a New Jersey funeral-doom metal band, not the Beijing AI company, and must not be treated as customer evidence. This name collision materially increases the need for direct customer references and a product-level activity denominator."
    claimRefs: [CU003, CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Retention, expansion, and concentration
    body: "No assigned source discloses Evoken's NRR, GRR, logo churn, renewal rate, contract length, cohort retention, net dollar expansion, customer concentration, or channel mix. The article's statement that revenue mainly comes from professional content producers identifies a plausible buyer segment, but it does not establish whether those producers are direct subscribers, API users, agencies, or one-time project customers. The wider market evidence shows that AI video is being adopted in Chinese content production, including claims of industrial-scale output and sharply shorter production cycles, but those market conditions are not evidence of Evoken retention or share. Underwriting should treat expansion and concentration as open questions until account-level and cohort-level evidence is supplied."
    claimRefs: [CU005, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
  - id: customer-diligence-exhibits
    title: Evidence limitations and diligence priorities
    body: "The customer case is directionally positive but evidence-constrained. The strongest current signal is a reported combination of consumer-scale reach and professional-team adoption across linked products. The weakest links are independent corroboration, payment status, production-versus-pilot classification, and durability. The assigned search log recorded nine searches, but only two returned the name-collision pages retained as result URLs; the other relevant-looking pages were rediscovered prior URLs or general market coverage rather than current search hits. A diligence process should request an anonymized customer waterfall, active-paying definitions, monthly cohort retention, top-ten account share, contract and renewal samples, and named customer permission for reference calls."
    claimRefs: [CU001, CU003, CU007, CU012, CU013, CU014, CU015, CU016]
    tableRefs: []
