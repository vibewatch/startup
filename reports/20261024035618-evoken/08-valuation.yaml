    notes: "ARR and valuation are third-party reported, unaudited figures; the implied ratio is arithmetic using a valuation above $2 billion and ARR above $300 million, not a verified EV/ARR multiple."
    claimRefs: [CV001, CV002, CV009, CV013]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - [Workflow breadth, "Three reported product lines spanning image, video, and design", "Product-level revenue and retention show cross-sell", "Positive but unverified"]
      - [Market pull, "China micro-drama market projected above 120B yuan; 50,000 AI-native titles in March 2026", "Evoken converts category growth into recurring gross profit", "Supports demand thesis"]
      - [Capital validation, "$300M Series B+ reported at valuation above $2B", "Independent cap-table and term-sheet confirmation", "Confirms financing, not intrinsic value"]
      - [Commercialization risk, "Comparable short-drama operator reportedly generated $400M in 2024 but remained unprofitable", "Evoken shows contribution margin after model and distribution costs", "Limits premium multiple"]
    notes: "The table separates market/category evidence from company-specific evidence; competitor and market figures are not direct Evoken benchmarks."
    claimRefs: [CV005, CV006, CV007, CV008]
  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Reported $300M ARR is recurring, high-margin, and grows with durable retention", "8x ARR would indicate $2.4B before net debt and preference adjustments", "Model costs, competition, regulation", "Upside case; requires primary verification"]
      - [Base, "ARR is substantially recurring but growth and margins normalize", "6x ARR would indicate $1.8B before balance-sheet adjustments", "Revenue mix and retention remain opaque", "Most defensible public-data case"]
      - [Bear, "Reported ARR includes non-recurring or low-margin activity and growth slows", "4x ARR would indicate $1.2B before adjustments; downside may be larger after dilution", "Down round, churn, model-cost inflation", "Material downside until metrics are verified"]
      - [Entry discipline, "No public evidence supports a fixed target return or exit date", "Use milestone-based pricing or wait for audited KPI package", "Preference overhang and liquidity", "Research-more if terms are inflexible"]
    notes: "Illustrative multiples are analytical sensitivities, not forecasts or a reported valuation. They use the reported $300M ARR as a denominator and do not infer cash, debt, dilution, or liquidation preferences."
    claimRefs: [CV009, CV010, CV011, CV012, CV013]
