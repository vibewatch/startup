company:
  name: Evoken
chapter:
  number: 8
  title: Valuation
  summary: Evoken's reported $2 billion-plus post-money valuation and more than $300 million ARR imply a headline multiple near 6.7x ARR, but both figures are third-party reported and unaudited. Market benchmarks support a track recommendation rather than a buy because revenue quality, margins, retention, dilution, preferences, and cash generation remain unverified.
sections:
  - id: investment-call
    title: Investment call and price discipline
    body: >-
      Evoken has a credible scale signal: an independent venture-news account reports a $300 million Series B+ at a post-money valuation above $2 billion, while the same account reports ARR above $300 million as of May 2026. That arithmetic suggests a headline valuation-to-ARR ratio below 6.7x, but it is not a verified enterprise-value multiple because the valuation, ARR definition, revenue mix, debt, cash, and preference stack are not disclosed. A separate June 2026 funding roundup also reports Liblib, an Evoken product, raised $300 million at a valuation above $2 billion and had more than 30 million cumulative users. The decision implication is track: the price may be reasonable if ARR is recurring, gross margins are strong, and growth is durable, but public evidence does not support a buy recommendation or a target return calculation.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis versus anti-thesis
    body: >-
      The positive thesis is a multi-product workflow rather than a single generation feature. The reported Evoken portfolio links LiblibAI's creator community, LibTV's video workflow, and Xingliu's design agent; the account says LiblibAI had more than 30 million users, 500,000 original models, and that LibTV served nearly 1,000 teams. Industry evidence supports a large addressable use case: a May 2026 report describes China's micro-drama market as projected above 120 billion yuan, with more than 50,000 AI-native titles added to Douyin in March and production costs around one-tenth of live action. The anti-thesis is that capital and attention may outrun monetization: the same market report says output quality is uneven and cites an overseas micro-drama company that generated approximately $400 million in 2024 revenue but remained unprofitable. Evoken therefore needs cohort-level retention, contribution margin, and customer concentration evidence before the thesis can support a premium multiple.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios, comparables, and downside
    body: >-
      A scenario framework is more defensible than a single point valuation because the public record does not disclose audited revenue, gross margin, net revenue retention, burn, or cash runway. SaaS valuation guidance distinguishes ARR from total or forward revenue and says investors should test ARR against growth, retention, gross margin, CAC payback, and profitability. A 2026 market report places AI-native software at a median 21.2x EV/revenue in venture rounds and 11.5x in M&A, versus 5.5x and 3.8x for legacy SaaS, but those are broad category benchmarks rather than Evoken comparables. A second benchmark source reports 4.4x median implied ARR for public software in October 2026 and 21.7x for the top ten, underscoring dispersion. Applying a conservative 4x–8x range to the reported $300 million ARR would imply $1.2–$2.4 billion before adjustments for ARR quality, cash, debt, and preferences; this is an analytical range, not a fair-value estimate.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Diligence asks and thesis-break triggers
    body: >-
      Exit readiness is not established by a private round alone. The next diligence package should reconcile ARR to invoices and recognized revenue by product, show gross margin after model and inference costs, provide cohort retention and expansion, disclose customer and channel concentration, and provide the capitalization table with liquidation preferences, option pools, debt, and the exact post-money basis. The company also needs to evidence whether reported growth came from repeat professional production budgets or from launch-period usage and promotional activity. Regulatory review matters because the target market is content generation: a cited industry account describes tiered review and platform checks, including provincial approval for productions above one million yuan and removal of more than 25,000 episodes for violations. A thesis break would be material ARR restatement, sustained gross margin compression from third-party model costs, net retention below plan, a down round, or inability to renew major production accounts.
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: []
