callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: "The reported scale is investable-looking, but public evidence does not establish durable, high-margin ARR or clean shareholder economics."
    claimRefs: [CV001, CV002, CV013]
  - calloutType: strength
    title: Workflow positioning
    body: "The reported product set spans creator community, video production, and design, which could support cross-sell beyond a single generation feature."
    claimRefs: [CV005, CV006]
  - calloutType: risk
    title: Multiple dispersion
    body: "AI-native valuation benchmarks vary sharply by growth, retention, margin, and defensibility; category membership alone cannot justify a premium."
    claimRefs: [CV009, CV010, CV011]
  - calloutType: assumption
    title: Critical diligence assumption
    body: "The scenario range assumes reported ARR is a recurring denominator; invoices, recognized revenue, and product-level gross profit must validate that assumption."
    claimRefs: [CV002, CV013]
