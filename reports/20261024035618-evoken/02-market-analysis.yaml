    notes: "Values are preserved in source units and are not reconciled into one TAM. Differences may reflect market definition, segment inclusion, currency, and forecast methodology."
    claimRefs: [CM005, CM006, CM007, CM008]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer/budget owner, Workflow, Adoption trigger]
    rows:
