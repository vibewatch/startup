    claimRefs: [CM005, CM006, CM007, CM008, CM009]
callouts:
  - calloutType: insight
    title: Boundary before magnitude
    body: The strongest conclusion is that multiple public estimates describe materially different China-AIGC universes; Evoken's opportunity should be underwritten from the visual-content workflow boundary outward, not from the largest headline TAM inward.
    claimRefs: [CM001, CM005, CM006, CM007]
  - calloutType: risk
    title: Monetization and compliance remain unproven
    body: Public evidence shows demand and reported scale, but not the split between consumer subscriptions, team products, API, and enterprise revenue or the contribution margin after model, compute, and compliance costs.
    claimRefs: [CM012, CM013, CM016]
