      - [Professional content teams, Studio or production lead, "Writers, editors, directors", Studio or project budget, "Script to asset to delivery", Production-cost reduction and throughput]
      - [Enterprise design and marketing, Marketing or design leader, In-house creative team, Department or enterprise software budget, Campaign asset generation and review, Faster localized content and workflow integration]
      - [API and platform customers, Product or engineering leader, Developers and end users, API or platform budget, Embedded generation and delivery, Reliable model access and operational scale]
    notes: "Buyer roles are an analytical segmentation grounded in the assigned product and market sources; the pool does not disclose Evoken conversion, ACV, retention, or concentration by segment."
    claimRefs: [CM010, CM011, CM012, CM013]
