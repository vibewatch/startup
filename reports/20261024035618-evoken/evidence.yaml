  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited financial statements or management accounts reconciling ARR to recognized revenue, gross margin, cash
      balance, burn, and runway.
    whyItMatters: Reported ARR and financing valuation do not establish cash generation, unit economics, or funding sufficiency.
    diligencePath: >-
      Request audited statements, monthly management accounts, ARR bridge, cohort retention, and a 24-month cash
      forecast under base and downside cases.
