- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Current support
  - What would change the view
  rows:
  - - 'Thesis: CATL Intelligent is strategically valuable because it moves CATL up the vehicle stack'
    - Strong parent support, credible technical ambition, and real AVATR linkage
    - Support strengthens further with a second named production customer and disclosed SOP timing
  - - 'Anti-thesis: the current private mark may be ahead of public commercial proof'
    - Sparse subsidiary economics, AVATR concentration, and policy friction remain material
    - The concern falls if revenue, backlog, and margin disclosure appear
  - - 'Thesis: parent CATL backing lowers solvency and execution-risk fear'
    - Filing-backed revenue, profit, cash flow, and R&D depth support runway
    - Support weakens if group priorities shift or policy risk starts to block projects
  - - 'Anti-thesis: public data still cannot support a defendable DCF or tight multiple band'
    - No revenue denominator, no backlog, no unit economics, no capex profile
    - This changes first with operating disclosure, then with repeated production proof
  notes: The thesis and anti-thesis are both valid today; recommendation depends on the investor needing milestone proof before underwriting precision.
