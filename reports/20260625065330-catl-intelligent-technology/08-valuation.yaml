company:
  name: CATL Intelligent Technology
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports strategic value more convincingly than precise intrinsic value for CATL Intelligent. The clearest standalone anchor is the 2025 financing round that reportedly valued the company above RMB 10 billion after raising more than RMB 2 billion. But public disclosures still lack subsidiary revenue, backlog, margins, and SOP timing, so the better approach is to treat that private mark as a center point inside a wide scenario band rather than to force a DCF or a narrow public-multiple range.
sections:
- id: v801
  title: The only clear standalone anchor is the 2025 financing mark
  body: 'Public evidence offers one credible standalone valuation anchor and not much else: multiple outlets reported that CATL Intelligent raised more than RMB 2 billion at a post-money valuation above RMB 10 billion in 2025. That is useful because it shows real investor willingness to price the asset as more than an internal project. It is limited because the round disclosures do not publish revenue, margins, backlog, unit volumes, or customer concentration economics. As a result, the private mark should be treated as a negotiated market signal, not as proof that intrinsic value can already be triangulated tightly from public fundamentals. That financing anchor is best used as entry context and price discipline, not as a substitute for a model. Investors can say the market was willing to underwrite platform optionality; they still cannot say whether that mark assumed two or three production OEMs, which Bedrock programs were embedded, or how much of the chassis value ultimately remains
    economically inside the CATL parent rather than the subsidiary.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV030
  - CV031
  tableRefs:
  - TV001
  - TV002
  figureRefs: []
- id: v802
  title: Strategic value is easier to defend than precise operating value
  body: The strategic case is materially stronger than the financial-model case. CATL Intelligent sits close to CATL's broader industrial platform, benefits from parent-company capital and R&D depth, and extends CATL into a more valuable place in the vehicle architecture. Bedrock and CIIC matter because they make the company relevant to crash structures, lower-body integration, by-wire architecture, and software interface standardization rather than to batteries alone. The AVATR relationship adds real option value because the product is attached to a live commercial program. But none of that translates cleanly into a standalone DCF without subsidiary-level economics. In practice, the strategic case says the asset deserves serious attention, while the valuation case says the investor still needs milestones, not just narratives, before tightening the range. Another way to frame the gap is that architecture quality and parent support clearly raise the odds of eventual relevance, but they do
    not yet tell an investor what proportion of eventual value belongs to the subsidiary, when it arrives, or on what margin structure.
  claimRefs:
