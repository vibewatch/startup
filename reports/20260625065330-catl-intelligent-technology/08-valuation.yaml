- id: v803
  title: Comparable companies can frame the range, not price the business
  body: Public comps are helpful only when used as a map, not as a calculator. Mature suppliers like Aptiv, Continental, Magna, and BorgWarner show how the market prices industrialized auto systems businesses with diversified customers and visible earnings. Mobileye shows how strategic platform optionality can support value before full autonomy arrives. Rivian, Canoo, Lucid-style launch stories, and broader OEM names such as Tesla or GM show how quickly public valuation can swing when execution, capital intensity, or vehicle demand dominate the story. The lesson is that optionality gets paid for after repeated production proof, not just after strong technical launches. CATL Intelligent still sits well before that proof threshold. Even optimistic comp reading therefore supports triangulation and ranking, not a single-point mark.
  claimRefs:
  - CV015
  - CV016
  - CV017
  - CV018
  - CV019
