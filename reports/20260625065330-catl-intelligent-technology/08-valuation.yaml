    - Integrated ecosystem and OEM upper bounds
    - Useful only as broad context for where value sits in the vehicle stack
    - Far too broad for direct pricing of CATL Intelligent
  notes: Comparables frame what kind of business public markets reward; they do not support a clean multiple for CATL Intelligent without subsidiary revenue and margin data.
