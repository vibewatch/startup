    - No diversification or economics disclosure
    - Positive but concentrated
  - - Policy and export-risk stack
    - Why a discount rate or confidence haircut is necessary
    - Not all policy scrutiny becomes a hard operating ban
    - Material downside modifier
  notes: This extra table bridges current pricing context to the broader scenario discussion.
