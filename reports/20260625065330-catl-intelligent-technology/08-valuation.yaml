- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Customer concentration worsens
    - Another major AVATR weakness with no second named production customer
    - Turns strategic optionality into a single-customer risk story
    - Lower confidence and widen discount
  - - Policy friction escalates
    - New U.S. or China action impairs licensing, projects, or partner willingness
    - Raises risk premium and compresses any comp-based uplift
    - Re-rate toward downside case
  - - Disclosure gap persists too long
    - No revenue / backlog / SOP detail through the next major diligence cycle
    - Blocks DCF and keeps the private mark weakly anchored
    - Stay at research-more or track only
  - - Execution proves out
    - Named second production customer plus visible SOP and program scope
    - Allows valuation to migrate toward revenue-multiple triangulation
    - Narrow the range and revisit stance
  notes: Triggers convert the chapter from a one-time opinion into a monitoring framework.
