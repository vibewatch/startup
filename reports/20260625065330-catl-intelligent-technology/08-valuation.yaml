- id: TV007
  title: Public valuation anchors
  columns:
  - Anchor
  - What it proves
  - What it does not prove
  - Current read
  rows:
  - - 2025 financing round
    - Real investors paid to back the chassis-platform thesis
    - No clean link to revenue, margin, or backlog
    - Useful center point only
  - - Parent CATL filing
    - Strong balance sheet, R&D, and listed-company infrastructure
    - No subsidiary cash-flow visibility
    - Strategically supportive
  - - AVATR customer proof
