  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与哪些支出算入
        blocks:
          - type: paragraph
            body: >-
              相关市场不是“全部 EV”，也不是传统汽车意义上的“全部底盘”。CATL Intelligent 所在的是更窄的一层：OEM
              购买或共研一个以电池为核心的模块化下车体，打包结构电池集成、驱动和热管理子系统、线控控制，以及软件定义接口。因此，计入的支出包括滑板或智能底盘工程、一体化下车体硬件、验证，以及配套底盘域软件。排除的支出包括完整上车体整车开发、独立电芯供应、通用
              ADAS 算力、充电基础设施和无关零部件采购。这个边界重要，因为宽口径 EV TAM 会高估可服务机会。只有 OEM 选择模块化、外部采购或联合开发的平台路径，而不是把专用 EV
              平台完全留在内部时，公司才会赢。更合适的看法是，CAIT 卖进的是整车架构预算里的一个决策楔子，而不是整个 EV 硬件栈。
