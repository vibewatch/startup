      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Aptiv / Continental
        - 公开市值
        - 成熟多元供应商参照
        - 展示规模化汽车系统供应商如何定价
        - 过于成熟且多元，不能直接套用
      - - Magna / BorgWarner
        - 公开市值
        - 额外的供应商规模参照
        - 有助于框定工业供应商估值区间的宽度
        - 不是底盘平台纯标的
      - - Mobileye
        - 公开市值
        - 平台可选性参照
        - 展示在品类完全成熟前，战略价值仍可保住
        - 软件 / ADAS 经济性不同于底盘硬件
      - - Rivian / Canoo
        - 公开市值 / 困境参照
        - 对执行高度敏感的 EV 平台标尺
        - 当规模失速时，是叙事压缩的好警示
        - OEM 敞口和资产负债表结构不同
      - - BYD / Geely / Tesla / GM
        - 公开市值
        - 一体化生态和 OEM 上限
        - 只能粗略参照整车价值链里的价值分布
        - 范围太宽，不能直接给 CATL Intelligent 定价
    notes: 可比公司能说明公开市场奖励哪类业务；但没有子公司收入和利润率数据，不能为 CATL Intelligent 提供干净的倍数依据。
