  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 子公司财务
        - 收入、在手订单、毛利率、EBITDA、现金消耗、资本开支
        - 没有这些数据，就没有可辩护的 DCF 或紧密倍数
        - 索取管理账和经营计划
      - - 商业化节奏
        - Bedrock SOP 排期、定点状态，以及按阶段划分的客户管线
        - 节奏决定期权价值是近期释放还是后置
        - 索取按 OEM 和地域拆分的项目跟踪表
      - - 单位经济性
        - BOM、定价、渗透率和质保边界
        - 需要把技术野心翻译成现金流
        - 索取产品利润率桥和合同经济性
      - - 政策敞口
        - 国际许可结构和出口管制处理
        - 需要据此估算折现率和情景韧性
        - 索取法律备忘录和逐地区结构图
      - - 治理 / 融资条款
        - 优先权堆栈、投资者权利、资金用途
        - 需要判断名义私有估值在经济上是否干净
        - 索取融资材料和条款清单摘要
    notes: 这些问题是从战略框架推进到投资承销精度所需的最低材料包。
