    CIIC 架构之内，把母公司集团从电池电芯推向 EV 价值链更高处：滚动下车体平台，覆盖电池集成、碰撞结构、热管理、线控系统和面向软件的接口。2025 年，公司迎来清晰的外部融资节点：据称以投后估值超过人民币 100
