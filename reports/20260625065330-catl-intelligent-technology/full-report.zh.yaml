chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、边界与产品定位
        blocks:
          - type: paragraph
            body: >-
              CATL Intelligent Technology 是第三方报道中对 宁德时代（上海）智能科技有限公司 使用的英文工作名称。这家公司由 CATL 控制，2021
              年在上海设立，目标是商业化一体化智能滑板底盘产品。公开报道一贯把该子公司定位为 CATL CIIC 架构及 Bedrock/Panshi 底盘家族背后的实体，而不是独立整车
              OEM。产品主张是把电池、电驱、热管理、线控控制和软件定义接口打包进模块化下车体，让 OEM 能把上车体设计与核心滚动底盘工程解耦。CATL 和合作方报道把它定位为 B2B
              技术与产品层：不是面向零售的汽车品牌，而是底盘平台和工程服务，旨在缩短整车开发周期、提高布置效率，并让乘用和商用场景下的定制 EV 项目更容易启动。
