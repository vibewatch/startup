      - CR028
      - CR029
      - CR036
      - CR037
      - CR038
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 继续研究
        - 中
        - 高
        - 战略价值可见；精确的独立公允价值不可见
        - 把 >RMB10bn 私募估值作为背景，然后等待运营披露或更好的进入条件
    notes: 这张表刻意保持简洁，因为本章其余部分会说明，建议取决于证据和价格，而不是非黑即白。
