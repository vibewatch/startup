      - number: '7.2'
        title: 客户集中和伙伴不透明是主要商业风险
        blocks:
          - type: paragraph
            body: >-
              商业风险集中在一个头部采用方。AVATR 是第一个强具名客户路径，但也让来自 AVATR 的下行信号格外重要。2026
              年一季度销售下滑并不能证伪平台，却显示叙事仍多么暴露于单一客户需求周期。其他伙伴仍多是生态说法，而非完全具名的量产项目。这就是故事里的核心商业不对称：公司可以指向 BAIC
              和海外机会，但外部投资者仍无法验证其中多少处在工程、试点、采购定点或量产阶段。底盘业务还早，商业集中会直接传导到估值、融资和路线图可信度。集中度也削弱公司吸收正常上市波动的能力。如果 AVATR
              某个季度疲弱，投资者还无法指向第二个完全具名量产客户来抵消这个信号。反过来，即使 BAIC 和海外线索真实，当前公开记录也没有显示它们处在备忘录、工程、采购定点还是 SOP 阶段。这个缺口让商业风险折价维持高位。
