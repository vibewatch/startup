              CATL Intelligent 卖的是底盘层产品栈，而不是终端客户汽车品牌。公开产品以 CIIC 一体化智能底盘和 Bedrock 旗舰为核心，目的是让 OEM
              解耦上下车体、标准化关键硬点，并缩短整车开发周期。客户工作流因此很具体：汽车制造商先把滑板底盘作为能源、运动和数据底座；选择底盘控制模块和电池配置；再叠加品牌专属车身、座舱和软件选择。最强的工作流验证来自
              AVATR：CATL 的角色从电池延伸进 CHN 架构，现在又延伸到 Bedrock 首发使用权。因此，底盘最好理解为可配置开发平台，价值主张是更快项目启动、更自由的布置空间，以及共享安全工程。
