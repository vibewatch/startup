        title: 资本结构、股权与融资
        blocks:
          - type: paragraph
            body: >-
              首轮外部融资是最清晰的公开证据，说明 CATL 已把该子公司推过内部孵化阶段。多家中国财经媒体在 2025 年 10 月报道，CATL Intelligent 完成首轮外部融资，规模超过人民币 20
              亿元，投后估值超过人民币 100 亿元；具名投资方包括博裕、国泰君安系资本、北汽产投，以及上海相关国资或科创基金。同一批报道称，交易后 CATL 仍持有约 70.5934%
              股权并保持控股，说明这轮融资是少数股权稀释，而非母公司剥离。资金用途务实且偏近期：Panshi/Bedrock
              底盘项目量产和下一代底盘研发。这条资本故事重要，因为该子公司尚未发布独立收入、利润或现金消耗数据；融资规模和母公司保留控制权，是判断成熟度和发起方承诺的主要公开锚点。
