      - number: '4.3'
        title: 资本充足性、发起方支持与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性是最清晰的公开财务视角。多方来源报道，CAIT 首轮外部融资超过人民币 20 亿元，资金指定用于 Panshi / Bedrock 量产和下一代研发。腾讯报道还显示，CATL 融资后仍持有约
              70.5934% 股权，保留发起方控制。这个发起方重要，因为 CATL 自身仍高度盈利：其 2025 年年度业绩公告披露收入人民币 4,237 亿元、归母净利润人民币 722 亿元、经营现金流人民币 1,332
              亿元。这些母公司数字都不能假设属于子公司，但确实说明 CAIT 连接着资本雄厚的工业支持方。主要未知是，CAIT 超过人民币 20
              亿元的融资，是否足够覆盖后续工程、工装和商业化周期。没有披露现金消耗、营运资金需求或客户付款里程碑，跑道无法独立验证。更宽的可比集合也解释了为什么估值难以机械解读。Tesla、GM、Li
              Auto、NIO、XPeng 和 Qualcomm 的公开市值跨越完全不同的商业模式，提醒投资者应把 CAIT 作为工业平台、汽车技术供应商和有发起方支持的增长期权的混合体来基准化，而不是干净的纯底盘同业。
