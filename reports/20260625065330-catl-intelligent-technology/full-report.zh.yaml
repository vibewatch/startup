      - number: '2.4'
        title: 增长驱动、约束与矛盾
        blocks:
          - type: paragraph
            body: >-
              中国目前提供最强的可见顺风：深厚 EV 供应链、政策支持、愿意尝试模块化架构，以及庞大的本土 OEM 基础。围绕 CIIC、Bedrock 和 MIH
              的公开描述，都把更短开发周期、标准化接口和衍生车型项目边际成本更低，列为主要需求驱动。但采用约束同样真实。这个品类装机规模仍小，已识别量产车型多数不在主流乘用车销量区间，海外市场也经历过高调挫败。BusinessWire
              和 ResearchInChina 摘要明确把西方降温与中国新兴动能作对比。客户集中又是另一重矛盾：AVATR 对验证有用，但 CarNewsChina 报道其 2026 年一季度销量下滑
              41.6%，说明一个疲弱灯塔客户就能让商业化叙事复杂化。CATL 的地缘政治审查也会给部分海外 OEM
              带来非技术采用阻力。还有采购保守性：即使模块化底盘技术上有吸引力，买方也可能等到同行项目先吸收验证风险再采用。这会形成反馈环，品类领导者需要可见的第二、第三个客户，市场才会感觉真正打开。今天这个楔子仍然很小。规模化路径仍窄，带有实验色彩。
