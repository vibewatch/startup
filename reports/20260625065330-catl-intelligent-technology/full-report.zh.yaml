      - number: '7.4'
        title: 缓释因素和论点击穿触发器可监测
        blocks:
          - type: paragraph
            body: >-
              风险栈严肃，但也可监测。最重要的缓释因素是母公司规模、用于量产和下一代研发的新资本，以及在政策风险继续上升时转向美国以外市场的能力。最重要的击穿条件同样清晰：美国政策比观察名单状态更严、出口管制阻挡海外推出，或
              AVATR 再发弱信号且看不到 Bedrock
              SOP。如果任意两项同时发生，应把平台视为战略上有意思但商业上延迟。反之，如果公司拿下第二个具名量产客户，并把监管暴露维持在审查阶段而非制裁阶段，当前风险评级可以下降。可监测性是当前风险栈中有利的一点。每个主要风险都能绑定公开触发器：新的美国政策行动、出口许可延迟、又一个负面的
              AVATR 需求信号，或第二个具名量产客户出现。因此，本章建议不是笼统回避公司，而是把它视为高上行平台，其后续披露将决定风险是在压缩还是在叠加。
