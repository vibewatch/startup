            body: >-
              基于公开数据，正确立场是继续研究。公司有足够技术野心、母公司支持和客户验证，值得给予战略信用，但披露的经营数据不足以支撑精确内在估值。下行压力来自 AVATR
              集中、政策摩擦和缺少透明商业化指标。上行则来自第二个具名量产客户、可见的 Bedrock
              SOP，以及更具体的海外验证。在这些里程碑出现前，估值应表达为围绕私募融资估值的宽情景区间，并因集中度和政策风险打折。这是关于纪律的建议，不是关于质量低：公司可能具备战略重要性，但当前公开记录对可能性的定价，比对现金流的定价更清楚。给
