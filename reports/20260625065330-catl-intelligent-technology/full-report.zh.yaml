  - id: TV007
    title: 公开估值锚
    columns:
      - 锚点
      - 能证明什么
      - 不能证明什么
      - 当前解读
    rows:
      - - 2025 融资轮
        - 真实投资者出资支持底盘平台论点
        - 不能干净连接到收入、利润率或在手订单
        - 只能作为有用的中心点
      - - 母公司 CATL 文件
        - 资产负债表、研发和上市公司基础设施都很强
        - 看不到子公司现金流
        - 战略上有支撑
      - - AVATR 客户验证
        - 产品已经绑定一个真实商业项目
        - 没有披露客户多元化或经济性
        - 正面，但集中
      - - 政策和出口风险堆栈
        - 说明为什么需要折现率或信心折扣
        - 不是所有政策审查都会变成硬性经营禁令
        - 重大下行修正项
    notes: 这张补充表把当前定价背景接到更宽的情景讨论。
