        title: 治理披露、客户生态与依赖
        blocks:
          - type: paragraph
            body: >-
              该子公司的治理披露很薄。公开报道提到 2025 年 10 月的注册资本和股东变更，以及新增具名董事、监事，但没有提供可比上市公司年报的完整公开管理层名单。这意味着承销判断仍高度依赖 CATL 母公司披露、CATL
              高管背书和合作方公告，而不是 CAIT 自身的经营透明度。商业端，AVATR 是最具体的灯塔关系：2022 年发布的 CHN，也就是长安-华为-CATL 智能 EV 架构，把 CATL
              放进整车平台栈，而不只是电池物料清单；AVATR 11 当年 12 月进入量产。后续报道显示，底盘子公司也在把生态扩展到 BAIC 和海外合作方，但公开披露仍指向高度集中风险：少数战略 OEM
              设计定点，而不是广泛装机基础。
