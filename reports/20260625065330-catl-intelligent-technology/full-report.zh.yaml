      - - 伙伴多元化失败
        - 没有第二个具名量产客户出现
        - 12 个月内没有具名非 AVATR 量产项目
        - 假设集中度风险持续存在
      - - 缓释成功
        - 具名第二客户出现，且审查仍未升级为制裁
        - 第二个 SOP 或已签量产项目落地，且没有新制裁
        - 将集中度和监管风险下调一档
    notes: 这些触发点服务于投资监测，而不是法律诊断；目标是识别战略可选性何时不再转化为商业证据。
