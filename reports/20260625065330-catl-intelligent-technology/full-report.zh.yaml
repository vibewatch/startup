      - number: '3.4'
        title: 护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              CAIT 的护城河主张有三块：CATL 的电池和供应链优势、以电池为核心的下车体设计，以及母公司支持下为早期项目风险融资的能力。但每块护城河都有反面。大型 OEM 可以把平台设计留在内部；MIH
              这类开放生态可能把标准商品化；该细分市场的公开失败说明，架构新颖本身并不保证持久经济性。ResearchAndMarkets 明确称，Arrival 和 Canoo
              受挫后，海外滑板底盘动能降温；CarNewsChina 对 AVATR 销售疲弱的报道也说明，即使灯塔客户叙事也会摇摆。地缘政治审查是第四个风险：如果国际客户认为 CAIT 与 CATL
              供应链绑定过深，部分海外客户可能不顾技术优点，偏向本地或内部架构。因此，竞争结论是产品概念有利，但护城河耐久性尚未成立。买方还需要看到 CAIT 能赢下重复项目，而且这些胜因在标准扩散后仍保持专有性。
