        title: 规模测算视角与证据约束下的 TAM / SAM / SOM
        blocks:
          - type: paragraph
            body: >-
              智能滑板底盘的直接市场规模披露仍弱，因此本章使用受约束的视角，而不是一个泛化 TAM。最宽的视角是全球 EV 产量和电池需求背景：SNE Research 及下游报道给出的 2025 年 EV 电池装机为
              1,187 GWh，同比增长 31.7%，其中 CATL 单独占 39.2% 份额。下一层视角是滑板底盘的直接商业化状态：ResearchInChina 和 ResearchAndMarkets 摘要称，中国已有
              8 款量产车型采用该架构，约 14 款搭载该技术的新增车型在 2024 年亮相，2025-2026 年近期量产多数集中在轻型商用车。最窄的视角是 CAIT 自身滩头阵地——高端 NEV 和部分商用车项目，这些
              OEM 看重开发周期缩短、以电池为核心的布置，以及开放架构采购。
