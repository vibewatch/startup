            body: >-
              公开可比公司只有在用作地图、而不是计算器时才有帮助。Aptiv、Continental、Magna、BorgWarner
              等成熟供应商展示了市场如何给拥有多元化客户和可见盈利的工业化汽车系统业务定价。Mobileye 展示了战略平台期权在完全自动驾驶到来前如何支撑价值。Rivian、Canoo、Lucid 式发布故事，以及
              Tesla、GM 等更广泛 OEM 名称，则显示当执行、资本强度或车辆需求主导叙事时，公开估值会多快摆动。教训是，期权价值是在重复量产证据之后才获得定价，而不只是强技术发布之后。CATL Intelligent
              仍远在这个验证门槛之前。因此，即使乐观读取可比公司，也只支持三角测算和排序，而不是单点估值。
