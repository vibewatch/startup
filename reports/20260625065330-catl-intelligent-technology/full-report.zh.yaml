      - number: '8.2'
        title: 战略价值比精确经营价值更容易防守
        blocks:
          - type: paragraph
            body: >-
              战略案例明显强于财务模型案例。CATL Intelligent 靠近 CATL 更大的工业平台，受益于母公司资本和研发深度，并把 CATL 推进整车架构中价值更高的位置。Bedrock 和 CIIC
              重要，因为它们让公司与碰撞结构、下车体集成、线控架构和软件接口标准化相关，而不只是与电池相关。AVATR 关系增加了真实期权价值，因为产品接在一个活跃商业项目上。但没有子公司层面的经济性，这些都无法干净转化为独立
              DCF。实操中，战略案例说明这项资产值得认真关注；估值案例则说明，投资者在收窄区间前仍需要里程碑，而不只是叙事。另一种表述是，架构质量和母公司支持显然提高了最终相关性的概率，但它们还不能告诉投资者，最终价值有多少比例属于子公司、何时兑现，或基于什么利润率结构兑现。
