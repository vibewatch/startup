  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 第二个具名量产客户、可见 Bedrock SOP，且海外项目走出不透明管线
        - 私募估值被证明保守，置信区间从 >RMB10bn 中心点上移
        - 执行和政策仍重要，但集中度下降
        - 当前公开记录尚不支持
      - - 基准
        - AVATR 仍是锚定客户，政策审查持续但不升级，运营披露仍有限
        - 以私募估值为中心点，并因集中度和模型风险给出较大折扣
        - 商业证据仍比叙事更窄
        - 最符合当前公开证据
      - - 悲观
        - AVATR 再次转弱，没有第二个具名客户出现，政策或出口摩擦上升
        - 大幅下调私募估值，因为客户和政策风险主导估值
        - 私募轮预期被证明跑在商业化前面
        - 当前不利信号支持该情景，但尚未完全破局
      - - 超预期上行
        - 母公司支持叠加多个具名 OEM 定点，把业务推向供应商平台可比组
        - 倍数扩张比现在更可信
        - 需要尚未公开的证据
        - 取决于里程碑交付
    notes: 这些是基于公开证据的情景，不是管理层预测；目的在于界定信心，而不是假装精确。
