  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 当前支撑
      - 什么会改变判断
    rows:
      - - 正方：CATL Intelligent 具备战略价值，因为它把 CATL 推向更上层的整车技术栈
        - 母公司支持强、技术野心可信、与 AVATR 的关联真实
        - 第二个具名量产客户和披露的 SOP 时点会进一步增强支撑
      - - 反方：当前私募估值可能跑在公开商业证据前面
        - 子公司经济数据稀疏、AVATR 集中度和政策摩擦仍然重要
        - 如果收入、积压订单和利润率披露出现，担忧会下降
      - - 正方：CATL 母公司背书降低偿付能力和执行风险担忧
        - 备案支撑的收入、利润、现金流和研发深度支撑跑道
        - 如果集团优先级转移，或政策风险开始阻挡项目，支撑会减弱
      - - 反方：公开数据仍无法支撑可辩护的 DCF 或收窄的倍数区间
        - 没有收入分母、没有积压订单、没有单车经济性、没有资本开支轮廓
        - 先要看到运营披露，再要看到反复量产证据，判断才会改变
    notes: 正方和反方今天都成立；建议取决于投资人在精确承保前是否需要里程碑证据。
    claimRefs:
