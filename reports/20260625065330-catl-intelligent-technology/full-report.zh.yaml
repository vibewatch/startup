      - number: '1.4'
        title: 里程碑、验证信号与关键风险
        blocks:
          - type: paragraph
            body: >-
              子公司的里程碑曲线可信，但仍处早期。CATL 在 2022 年中与合作方公开发布 CHN，2024 年 4 月在北京车展展示 CIIC，2024 年 12 月在上海发布 Bedrock
              底盘，并给出异常具体的安全主张：以电池为核心的 cell-to-chassis 集成、85% 碰撞能量吸收，以及 120 km/h 正面中央柱碰测试不起火、不爆炸。2025
              年随后完成融资，说明资本市场已把该业务视为独立的平台机会。主要风险同样可见。AVATR 在 2026 年一季度销售疲软，说明即使灯塔客户也会失速；ResearchInChina 和 BusinessWire
              的摘要显示，Arrival、Canoo 等失败之后，西方市场对滑板底盘的热情降温；CATL 自身也在美国供应链规则下承受地缘政治审查。组合起来，CATL Intelligent
              已不只是概念，但还不是已充分去风险的规模化业务。还要看执行顺序：即使产品技术上成立，公司仍必须证明，一个架构能从展示和试点，推进成可重复的多客户商业化引擎，同时不丢工程焦点和定价纪律。执行仍极其关键。仍然早期。
