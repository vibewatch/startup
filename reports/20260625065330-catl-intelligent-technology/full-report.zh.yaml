  - id: TV005
    title: 论点破裂和止损触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 客户集中度恶化
        - AVATR 再次显著走弱，且没有第二个具名量产客户
        - 战略可选性会变成单一客户风险故事
        - 下调信心并扩大折价
      - - 政策摩擦升级
        - 美国或中国出台新动作，影响许可、项目或伙伴合作意愿
        - 抬高风险溢价，并压缩任何可比公司带来的估值上修
        - 向下行情景重估
      - - 披露缺口持续太久
        - 到下一轮主要尽调周期仍没有收入 / 在手订单 / SOP 细节
        - DCF 无法展开，私有市场估值仍缺乏硬锚
        - 维持继续研究，或仅跟踪
      - - 执行得到验证
        - 出现具名第二个量产客户，并能看到 SOP 和项目范围
        - 估值可向收入倍数三角测算迁移
        - 收窄区间并重新审视立场
    notes: 触发条件把本章从一次性判断变成监测框架。
    claimRefs:
