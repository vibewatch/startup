              年年度业绩指向大额研发投入、庞大专利资产和广泛售后网络，都强化了底盘业务可调用有意义工程和支持能力的论点。但母公司的这些强项不能完全填上产品级尽调缺口。公开来源仍高度依赖公司宣称的碰撞表现、未来自动驾驶能力和泛化
              OTA 灵活性；它们没有提供公开网络安全框架、独立碰撞测试档案，或底盘单元专属的量产可靠性统计。结论有利但有条件：CATL Intelligent
