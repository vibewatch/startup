  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和声誉风险如今高于纯工程风险
        blocks:
          - type: paragraph
            body: >-
              最严重的可见风险是监管和声誉，而不是原始平台工程。CATL 被列入美国 Section 1260H 清单，以及后续 FEOC
              逻辑，制造了政策悬顶；即使没有直接经营禁令，它也可能改变客户意愿、项目结构和融资选择。围绕 2025 年香港 IPO 的单独审查显示，政治风险问题可能外溢到资本市场准入。专利诉讼增加第二层法律压力：围绕 CALB
              的公开案卷凸显，电池 IP 仍有争议，并会消耗管理层注意力。这些问题对 CATL Intelligent
              重要，因为年轻底盘业务依赖伙伴信心、跨境工程协作和未来商业化权利。该类别高于其他风险，原因在传导。底盘平台必须同时说服
              OEM、监管方、保险方和融资伙伴。一旦交易对手相信审查可能升级，实际结果可能是尽调周期变慢、合同结构变窄，也更不愿公开合作。这样一来，声誉问题在成为正式经营限制前，就已经具备经济相关性。
