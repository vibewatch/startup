  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 围绕当前私募标记中点，主要公开驱动因素带来的方向性影响。
    approximationNotes: 数值只是用于框架分析的方向性人民币十亿元级敏感性，不是管理层指引，也不是正式公平意见。
    data:
      items:
        - label: 第二个具名客户 + SOP 可见度
          value: 2
          detail: 主要上行驱动
          tone: positive
        - label: 收入 / 积压订单披露更干净
          value: 1.5
          detail: 可收窄模型风险
          tone: positive
        - label: 客户集中度持续
          value: -1.5
          detail: 主要商业折价
          tone: risk
        - label: 政策 / 出口摩擦上升
          value: -1.5
          detail: 风险溢价扩大
          tone: risk
        - label: 无运营披露
          value: -2
          detail: 阻断可比公司三角校验和 DCF
          tone: risk
    claimRefs:
      - CV011
      - CV025
      - CV026
      - CV027
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 围绕当前公开证据集的示意性估值区间。
    approximationNotes: 由于公开记录缺少子公司收入、利润率和 capex 输入，区间被刻意拉宽。
    data:
      items:
        - label: 熊市情形
          low: 5
          mid: 7
          high: 9
          displayValue: RMB 5-9bn
          detail: 集中度和政策风险占主导
          tone: risk
        - label: 基准情形
          low: 8
          mid: 10
          high: 12
          displayValue: RMB 8-12bn
          detail: 私募标记作为中点，但需打折
          tone: neutral
        - label: 牛市情形
          low: 11
          mid: 13
          high: 15
          displayValue: RMB 11-15bn
          detail: 需要第二个具名客户和更清晰的 SOP 证明
          tone: positive
    claimRefs:
      - CV002
      - CV025
      - CV026
      - CV027
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 按 IC 风格对当前 CATL Intelligent 估值案例进行 0 到 10 分打分。
    data:
      items:
        - label: 战略重要性
          value: 8
          unit: /10
          detail: CATL 相邻业务和下车体平台野心
          tone: positive
        - label: 客户证明
          value: 6
          unit: /10
          detail: AVATR 真实存在，但集中度高
          tone: neutral
        - label: 经济性可见度
          value: 2
          unit: /10
          detail: 没有公开收入、利润率或积压订单
          tone: risk
        - label: 政策韧性
          value: 4
          unit: /10
          detail: 审查已经存在，但尚未形成硬禁令
          tone: warning
        - label: 估值支撑
          value: 5
          unit: /10
          detail: 私募标记有用，但锚定仍松
          tone: neutral
