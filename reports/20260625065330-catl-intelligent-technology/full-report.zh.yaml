      - number: '6.3'
        title: 耐久性和集中度仍是核心客户风险
        blocks:
          - type: paragraph
            body: >-
              公开客户记录的弱点不是需求虚假，而是耐久性和广度仍缺少文档支持。CarNewsChina 报道 AVATR 2026
              年一季度销售下滑，是最清晰的反向来源，因为它显示叙事对单一客户需求周期有多暴露。公开材料没有披露 NRR、流失、合同期限、续约机制或收入集中度。它们也没有把 BAIC
              和海外伙伴生态说法转化为具名量产结果。Deepal 后台整合计划可能帮助 AVATR
              降低成本，但也凸显头部客户仍在优化自身内部运营模型。结果是，本章的客户验证足以证明真实采用，但不足以在缺少额外尽调时承销持久多元化。更广义的教训是，本章验证了真实客户存在，但尚未验证持久客户组合质量。对平台供应商而言，这个区别重要：一个强旗舰客户能证明技术可信度，只有跨具名项目的重复赢单才能证明商业耐久性。在公司发布第二个具名量产客户，或更清晰的管线到
              SOP 转化记录之前，AVATR 每次新的需求波动都应同时视为客户信号和估值信号。多元化证据仍薄。
