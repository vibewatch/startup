  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 唯一清晰的独立锚点是 2025 年融资估值
        blocks:
          - type: paragraph
            body: >-
              公开证据只给出一个可信的独立估值锚点，其余很少：多家媒体报道，CATL Intelligent 在 2025 年以投后估值超过人民币 100 亿元融资超过人民币 20
              亿元。这个锚点有用，因为它说明真实投资者愿意把这项资产定价为不止一个内部项目。它也有限，因为融资披露没有发布收入、利润率、在手订单、单车量或客户集中经济性。因此，应把私募估值视为谈判后的市场信号，而不是公开基本面已能紧密三角测算内在价值的证明。这个融资锚点最好用作入场背景和价格纪律，而不是模型替代品。投资者可以说，市场愿意承销平台期权；但仍无法判断该估值假设了两家还是三家量产
              OEM、哪些 Bedrock 项目已嵌入，或底盘价值最终有多少经济利益留在 CATL 母公司而不是子公司。
