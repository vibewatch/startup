  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接、既有、相邻和替代竞争者
        blocks:
          - type: paragraph
            body: >-
              买方解决“模块化 EV 平台”问题有几条路。直接同业包括专门的滑板底盘玩家和 MIH 这类开放生态。既有替代方案包括 Volkswagen MEB、Hyundai E-GMP、Geely SEA 等大型 OEM
              控制的 EV 平台，它们把架构所有权留在内部或大集团内，降低对外部底盘供应商的需求。Aptiv、Continental、Mobileye 等相邻供应商也重要，因为它们能提供线控、软件和电子层，OEM
              可能把这些模块组合成自己的方案。Canoo、Rivian 这类西方创业公司案例也相关，证明概念可以落到车辆上，但它们展示的是截然不同的资本与执行结果。关键实际点在于，CAIT
              竞争的不是一份整齐的纯底盘创业公司名单，而是买方自研还是找伙伴的决策。
