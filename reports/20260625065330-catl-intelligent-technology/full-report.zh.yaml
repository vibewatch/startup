      - number: '7.3'
        title: 运营验证缺口可控，直到它们变成时间延误
        blocks:
          - type: paragraph
            body: >-
              不能因为 CATL 是规模化母公司，就把运营风险归零。公开证据仍缺少底盘产品本身最重要的量产级验证点：确定 SOP
              日期、第三方安全档案和现场质量披露。公开碰撞韧性证据很亮眼，但仍来自发布传播和媒体报道，而不是独立发布的认证材料。对线控模块、软件域和客户系统的多栈依赖，也会在现场出现事件时让故障归因更复杂。这并不意味着产品不安全；它意味着平台仍处于尽调必须依赖未公开工程资料才能最终放心的阶段。同样逻辑也适用于安全和质量验证。问题不是公开来源显示失败；问题是它们止步于能让外部承销方区分成熟汽车验证和发布阶段工程主张的材料。在这些资料出现前，即使常规进度移动也会放大担忧，因为外部缺少足够硬数据来区分延期和更深层准备度问题。
