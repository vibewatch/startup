            body: >-
              公开能力对比显示，CAIT 最强的差异化在结构集成：以电池为核心的底盘、线控栈，以及对外部协作的开放度。MIH 强调开放生态参与；MEB+、E-GMP 和 SEA 强调大型 OEM
              或集团语境下的模块化；Aptiv、Continental 等相邻供应商提供技术模块，而不是完整下车体架构。全行业定价披露都弱，所以最诚实的比较对象是合同模式，而不是标价。CAIT
              很可能销售底盘硬件、集成工程和项目专项验证的混合包。内部 OEM
              平台通过资本开支和项目预算供资，不会以公开价目表呈现。这种不透明本身就是竞争现实：切换成本由验证、工装、安全认证和软件集成驱动，不只是单车硬件价格。
