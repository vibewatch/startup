            body: >-
              CAIT 的成本结构只能推断。Bedrock 和 CIIC
              是资本密集型产品，组合了结构电池集成、线控系统、软件定义接口和验证义务。这意味着业务达到稳定规模化制造前，要在工装、碰撞测试、工程人力、供应商认证和客户专项集成上投入大量早期成本。围绕产品定位的公开来源支持这套逻辑，但没有披露毛利率或单车贡献。最好的代理指标只能来自相邻上市同行和产品本身的性质：完整下车体架构的平均销售价值应高于单独子系统，但物料清单更复杂，转化周期也更长。最重要的财务结论是，CAIT
              很可能需要有意义的项目规模来吸收工程和验证开销，因此客户集中和上市节奏是一阶财务变量。
