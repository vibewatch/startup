      - number: '2.3'
        title: 买方分层、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方通常不是零售终端客户，而是 OEM 平台团队。在乘用车里，预算负责人很可能是
              CTO、平台工程负责人或项目高管，需要在上市速度、车身形态灵活性和电池布置效率之间取舍。在轻型商用车和出行车队里，价值主张可能更清晰，因为模块化、定制车身变体和简化制造，比品牌专属驾驶感更重要。MIH
              会员数量和聚焦中国的报告摘要显示，市场正由开放平台逻辑、供应商生态和联合开发塑形，而不是纯零部件采购。采用仍沿着很长的工业路径推进：概念架构、安全验证、公告准入、软件集成、试点车队或小批量生产，然后才是规模化
              SOP。这条路径拉长销售周期，也让灯塔部署作为证据点的权重格外高。
