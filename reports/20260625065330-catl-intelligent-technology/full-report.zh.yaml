      - number: '3.2'
        title: 竞争者画像与相对规模
        blocks:
          - type: paragraph
            body: >-
              这个领域规模差异很大。CATL 母公司给了 CAIT 多数创业式平台玩家没有的工业深度；公开市值数据也显示，相邻和替代阵营里有很多巨头：Continental、Rivian、Ford、BYD、Geely
              的公开股权规模都远大于一家估值超过人民币 100 亿元的私有底盘子公司。MIH 的会员数量展示了另一条规模路径：靠生态广度，而不是单一公司资产负债表。在平台侧，MEB、E-GMP 和 SEA 并不作为 CAIT
              的直接相似产品出售，但它们重要，因为已经嵌入多车型 OEM 组合，进而压缩愿意外包下车体架构的买方集合。因此，竞争规模不只是逐一对比创业公司，更关乎谁已经控制 OEM 决策框架。公开规模对比也有战略意义：OEM
              放弃 CAIT 时，常常不是转向另一家创业公司，而是默认选择巨型车企集团或上市供应商的资产负债表和工程节奏。这抬高了所有外部底盘供应商的商业门槛，因为买方不仅在比较产品架构，也在评估供应商风险。
