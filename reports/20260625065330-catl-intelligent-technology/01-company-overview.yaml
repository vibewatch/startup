- id: milestones-and-risks
  title: Milestones, Validation Signals, and Key Risks
  body: 'The subsidiary’s milestone curve is credible but still early. CATL publicly launched CHN with partners in mid-2022, showed CIIC at Auto China in April 2024, and launched the Bedrock chassis in Shanghai in December 2024 with unusually specific safety claims: battery-centric cell-to-chassis integration, 85 percent collision-energy absorption, and a 120 km/h frontal central pole test without fire or explosion. Financing followed in 2025, suggesting capital markets now view the business as a distinct platform opportunity. The main risks are equally visible. AVATR’s weak Q1 2026 sales show that even a lighthouse customer can stumble; ResearchInChina and BusinessWire summaries suggest Western skateboard-chassis enthusiasm cooled after failures such as Arrival and Canoo; and CATL itself faces geopolitical scrutiny under US supply-chain rules. The combination makes CATL Intelligent more than a concept, but not yet a de-risked scaled business. A further nuance is execution sequencing: even
    if the product is technically sound, the company still must prove that one architecture can move from showcase and pilot status into a repeatable multi-customer commercialization engine without losing engineering focus or pricing discipline. Execution still matters enormously. Still early.'
