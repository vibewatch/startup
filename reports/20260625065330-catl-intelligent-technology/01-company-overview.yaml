company:
  name: CATL Intelligent Technology
chapter:
  number: 1
  title: Company Overview
  summary: CATL Intelligent Technology is CATL’s Shanghai-based intelligent-chassis subsidiary, created in 2021 to industrialize the group’s CIIC skateboard chassis architecture. Its flagship Bedrock/Panshi chassis moved from concept to public launch in 2024 and secured first outside financing of more than RMB2 billion in 2025 at a post-money valuation above RMB10 billion, but the subsidiary still discloses little standalone operating data. The business case depends on converting CATL’s battery leadership into repeat OEM chassis programs while managing customer concentration, policy exposure, and a still-immature market structure.
sections:
- id: identity-and-product
  title: Identity, Scope, and Product Positioning
  body: 'CATL Intelligent Technology is the working English label used in third-party coverage for 宁德时代（上海）智能科技有限公司, a CATL-controlled subsidiary established in Shanghai in 2021 to commercialize integrated intelligent skateboard chassis products. Public coverage consistently frames the subsidiary as the entity behind CATL’s CIIC architecture and its Bedrock/Panshi chassis family rather than as an independent vehicle OEM. The product proposition is to package battery, electric drive, thermal management, by-wire controls, and software-defined interfaces into a modular lower body so OEMs can decouple upper-body design from core rolling-chassis engineering. CATL and partner coverage position this as a B2B technology-and-product layer: not a retail car brand, but a chassis platform and engineering service intended to shorten vehicle development cycles, improve packaging efficiency, and make customized EV programs easier to launch across passenger and commercial use cases.'
  claimRefs:
