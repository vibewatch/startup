  evidenceGaps:
  - topic: Standalone financial disclosure
    type: private-evidence-only
    severity: blocking
    missingEvidence: Audited subsidiary-level revenue, gross margin, cash, and burn disclosures.
    whyItMatters: Without standalone financials, the round size and valuation cannot be tied to operating traction or runway.
    diligencePath: Request subsidiary management accounts, audited carve-out financials, and cap-table-backed financing documents.
    relatedQuestionRefs:
    - QO022
    - QO025
    relatedTableRefs:
    - TO001
  - topic: Operating leadership visibility
    type: missing-source
    severity: material
    missingEvidence: A complete public roster of CAIT executive leadership, reporting lines, and board rights.
    whyItMatters: Governance risk is hard to underwrite when public evidence identifies names added after financing but not who runs day-to-day operations.
    diligencePath: Request an organization chart, board composition, reserved-matters schedule, and biographies for named directors and supervisors.
    relatedQuestionRefs:
    - QO014
    - QO015
    - QO016
    relatedTableRefs:
    - TO002
  - topic: Customer breadth and program volumes
    type: private-evidence-only
    severity: material
    missingEvidence: Program count, SOP timing, booked volumes, and revenue concentration by OEM.
    whyItMatters: The commercial case depends on converting lighthouse programs into repeat platform wins; public sources only show a small visible ecosystem.
    diligencePath: Request signed program list, SOP calendar, customer concentration, and contracted volume / ASP assumptions.
    relatedQuestionRefs:
    - QO017
    - QO020
    - QO025
    relatedTableRefs:
    - TO003
  - topic: Bedrock / Panshi commercialization details
    type: missing-source
    severity: material
    missingEvidence: Production timing, homologation status, and delivered-vehicle count for Bedrock-based programs.
    whyItMatters: Public launch and safety demonstrations prove intent but not scaled commercialization.
    diligencePath: Request product roadmap, test-certification status, and first-customer SOP milestones by model.
    relatedQuestionRefs:
    - QO007
    - QO008
    relatedTableRefs:
    - TO004
