  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Spend Counts
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “all EVs” and not “all chassis” in a legacy automotive sense. CATL Intelligent
              sits in the narrower layer where an OEM buys or co-develops a battery-centric modular lower body that
              bundles structural battery integration, drive and thermal subsystems, by-wire controls, and
              software-defined interfaces. Included spend therefore covers skateboard or intelligent chassis
              engineering, integrated lower-body hardware, validation, and supporting chassis-domain software. Excluded
              spend includes full upper-body vehicle development, standalone cell supply, generic ADAS compute, charging
              infrastructure, and unrelated component sourcing. This matters because broad EV TAM figures overstate the
              serviceable opportunity. The company wins only when an OEM chooses a modular, externally sourced or
              jointly developed platform route instead of keeping a dedicated EV platform fully in-house. It is
              therefore better to treat CAIT as selling into a decision wedge inside vehicle architecture budgets, not
              into the whole EV hardware stack.
