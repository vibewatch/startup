      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Subsidiary financials
        - Revenue, backlog, gross margin, EBITDA, cash burn, capex
        - Without these, no defendable DCF or tight multiple exists
        - Request management accounts and operating plan
      - - Commercial timing
        - Bedrock SOP schedule, nomination status, and customer pipeline by stage
        - Timing determines whether option value is near-term or deferred
        - Request program tracker by OEM and geography
      - - Unit economics
        - BOM, pricing, take rate, and warranty boundaries
        - Needed to translate technical ambition into cash flow
        - Request product-margin bridge and contract economics
      - - Policy exposure
        - International licensing structure and export-control treatment
        - Needed to size discount rate and scenario durability
        - Request legal memo and region-by-region structure map
      - - Governance / round terms
        - Preference stack, investor rights, use of proceeds
        - Needed to assess whether the headline private mark is economically clean
        - Request financing deck and term sheet summary
