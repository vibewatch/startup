            body: >-
              The differentiator is not just that CATL adds batteries to a chassis; it is that the company tries to turn
              the battery-centric lower body into a reusable SDV-ready platform. Independent technical reporting says
              CIIC integrates the battery, electric drive, thermal-management, and chassis-control layers directly into
              the lower body, while AVATR's CHN materials show how that lower-body stack can plug into Huawei-backed
              domain fusion, OTA, and cloud-data workflows. Bedrock moves the differentiation story further toward
              safety. Public sources describe direct cell-to-chassis integration, a tortoise-shell protective structure,
              high-strength metals, and extremely fast high-voltage isolation after impact. That combination suggests
              CATL Intelligent is trying to compete on engineering leverage and safety envelope, not just on supplying
