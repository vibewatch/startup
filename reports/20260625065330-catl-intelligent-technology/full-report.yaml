      - number: '3.4'
        title: Moat Durability and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              CAIT’s moat claim has three parts: CATL’s battery and supply-chain advantage, a battery-centric lower-body
              design, and a parent-backed ability to finance early program risk. But each moat has a counterpoint. Large
              OEMs can keep platform design internal; open ecosystems such as MIH can commoditize standards; and public
              failures in the segment show that architecture novelty alone does not guarantee durable economics.
              ResearchAndMarkets explicitly said overseas skateboard-chassis momentum cooled after Arrival and Canoo
              stumbled, and CarNewsChina’s reporting on AVATR sales weakness shows even lighthouse-customer narratives
              can wobble. Geopolitical scrutiny is the fourth risk: if CAIT is seen internationally as too tightly
              coupled to CATL’s supply chain, some overseas customers may prefer local or internal architectures
              regardless of technical merits. The competitive verdict is therefore favorable on product concept, but not
              yet on moat durability. Buyers therefore need evidence that CAIT can win repeat programs for reasons that
              remain proprietary even after standards spread.
