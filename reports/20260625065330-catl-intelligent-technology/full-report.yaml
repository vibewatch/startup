      - number: '1.2'
        title: Capitalization, Ownership, and Financing
        blocks:
          - type: paragraph
            body: >-
              The first outside financing round is the clearest public proof that CATL has moved the subsidiary beyond
              internal incubation. Multiple Chinese financial outlets reported in October 2025 that CATL Intelligent
              completed its first external fundraise for more than RMB2 billion at a post-money valuation above RMB10
              billion, with Boyu, Guotai Junan-affiliated capital, BAIC Capital, and Shanghai-linked state or
              science-technology funds among the named investors. The same reports say CATL remained the controlling
              shareholder with about 70.5934 percent ownership after the transaction, indicating the round was minority
              dilution rather than a parent carve-out. Reported use of proceeds was practical and near-term: mass
              production of Panshi/Bedrock chassis programs and next-generation chassis R&D. That capital story matters
              because the subsidiary has not published standalone revenue, profit, or cash-burn data; financing size and
              retained parent control are the main public anchors for judging maturity and sponsor commitment.
