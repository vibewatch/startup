            body: >-
              Operational risk is not zero just because CATL is a scaled parent. Public evidence still lacks the most
              important production-grade proof points for the chassis product itself: a firm SOP date, a third-party
              safety dossier, and field-quality disclosures. The public crash-resilience evidence is impressive, but it
              still comes through launch communications and media coverage rather than through independently published
              certification materials. The multi-stack dependency on by-wire modules, software domains, and customer
