            body: >-
              Commercialization is real but still narrow. AVATR is the strongest named deployment path, and the 2025
              financing coverage says the ecosystem has expanded to BAIC plus unnamed overseas partners in Southeast
              Asia, the Middle East, and Europe. Those are encouraging signals because a chassis platform only matters
              if multiple OEMs are willing to build on it. At the same time, commercialization depends on external
