        title: Governance Disclosure, Customer Ecosystem, and Dependencies
        blocks:
          - type: paragraph
            body: >-
              Governance disclosure for the subsidiary is thin. Public reports describe October 2025 registered-capital
              and shareholder changes, plus the addition of named directors and supervisors, but they do not provide a
              full public management roster equivalent to a listed-company annual report. That means underwriting still
              depends heavily on CATL parent disclosures, CATL executive sponsorship, and partner announcements rather
              than on CAIT’s own operating transparency. On the commercial side, AVATR is the most concrete lighthouse
              relationship: CHN, the Changan-Huawei-CATL smart EV architecture launched in 2022, put CATL into the
              vehicle-platform stack rather than only the battery bill of materials, and AVATR 11 entered mass
              production that December. Later coverage indicates the chassis subsidiary was also widening its ecosystem
              to BAIC and overseas counterparties, but public disclosure still suggests high concentration risk around a
              small set of strategic OEM design wins rather than a broad installed base.
