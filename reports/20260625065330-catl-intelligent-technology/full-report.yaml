        title: Revenue Streams and Monetization Logic
        blocks:
          - type: paragraph
            body: >-
              Public sources do not disclose a CAIT price list or signed-program revenue by customer, but they do reveal
              the likely monetization structure. The subsidiary is described as a product-and-technology service
              provider for intelligent skateboard chassis, which implies a mixture of chassis hardware revenue,
              integration engineering, validation work, and possibly subsystem packaging around by-wire controls and
              battery-centric lower-body architecture. This is a program-business model, not SaaS and not a simple
              battery-cell resale. Revenue recognition would likely be tied to engineering milestones, prototype and
              pilot deliveries, and later SOP-linked hardware shipments. The company’s strongest public commercial proof
              remains lighthouse architecture relationships such as CHN and AVATR rather than disclosed revenue figures.
              The right conclusion is not that there is no revenue, but that public data are inadequate to quantify its
              current mix, realized pricing, or quality.
