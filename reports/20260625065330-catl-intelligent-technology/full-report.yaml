      - number: '8.4'
        title: 'Recommendation: research-more, using scenario bands instead of a forced DCF'
        blocks:
          - type: paragraph
            body: >-
              The right public-data stance is research-more. The company has enough technical ambition, parent support,
              and customer proof to deserve strategic credit, but not enough disclosed operating data to support a
              precise intrinsic valuation. Downside pressure comes from AVATR concentration, policy friction, and the
              absence of transparent commercialization metrics. Upside would come from a second named production
              customer, a visible Bedrock SOP, and more concrete overseas proof. Until those milestones arrive,
              valuation should be expressed as a wide scenario band centered on the private financing mark and
              discounted for concentration and policy risk. That is a recommendation about discipline, not about low
              quality: the company may be strategically important, but the current public record still prices
              possibility more clearly than it prices cash flow. The practical takeaway for an IC is simple: keep the
              company in the active queue, but do not let the private mark outrun missing evidence on revenue
              conversion, customer breadth, and regulatory durability.
