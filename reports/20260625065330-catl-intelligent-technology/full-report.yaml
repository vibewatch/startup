      - number: '4.4'
        title: Disclosure Gaps, Adverse Signals, and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest financial verdict is that CAIT is investable only with heavy primary diligence. The public
              case for upside is credible: real external financing, a strategic parent with abundant cash generation,
              product differentiation, and at least one visible customer architecture. The public case against immediate
              underwriting is equally strong: no standalone revenue, no gross margin, no burn rate, no disclosed
              contracted backlog, and limited evidence on how quickly lighthouse programs become repeat production.
              Adverse signals sit around the edges rather than in audited statements. AVATR’s weak 2026 sales, Western
              skateboard-chassis failures highlighted by market-report summaries, and geopolitical scrutiny of CATL all
              create downside scenarios where commercialization slows before the fixed cost base is fully absorbed.
              Investors can reasonably view CAIT as a sponsored platform option, but not as a transparently
              underwritable operating company from public data alone.
