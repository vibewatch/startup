        title: Customer segmentation is ecosystem-led and AVATR-dominant
        blocks:
          - type: paragraph
            body: >-
              CATL Intelligent does not disclose a broad account list, so the usable public customer map is
              ecosystem-shaped rather than count-shaped. AVATR is the clearest named deployer, but it is also a partner
              showcase because CATL helped build the CHN architecture and now links Bedrock first-use rights to AVATR
              models. The rest of the visible base breaks into three thinner categories: domestic ecosystem partners
              such as BAIC; unnamed overseas partners in Southeast Asia, the Middle East, and Europe; and parent-level
              support channels through Changan and CATL. That segmentation matters because buyer, user, and payer are
              not always the same. The public record therefore supports a concentrated but strategically meaningful
              customer set rather than a diversified revenue book. Public segmentation also shows why customer proof
              should be read through program roles rather than through logo counts. AVATR is simultaneously a design
              partner, commercialization path, and market signal. BAIC and overseas partners are meaningful because they
              suggest the chassis pitch resonates beyond one premium EV brand, but the absence of named programs means
