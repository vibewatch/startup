      - number: '4.3'
        title: Capital Adequacy, Sponsor Support, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is the clearest public financial lens. Multiple sources report that CAIT raised more than
              RMB2 billion in its first outside financing round and that the funds are earmarked for Panshi / Bedrock
              mass production and next-generation R&D. Tencent coverage also indicates CATL retained about 70.5934
              percent ownership afterward, preserving sponsor control. That sponsor matters because CATL itself remains
              highly profitable: its 2025 annual results announcement reported RMB423.7 billion of revenue, RMB72.2
              billion of net profit attributable to shareholders, and RMB133.2 billion of operating cash flow. None of
              those parent numbers can be assumed to belong to the subsidiary, but they do mean CAIT is attached to a
              capital-rich industrial backer. The main unknown is whether CAIT’s more-than-RMB2 billion round is ample
              for the engineering, tooling, and commercialization cycle ahead. Without disclosed cash burn,
              working-capital needs, or customer-funded milestones, runway cannot be independently verified. A wider
              comparable set also shows why valuation is hard to read mechanically. Public market caps for Tesla, GM, Li
              Auto, NIO, XPeng, and Qualcomm span very different business models, reminding investors that CAIT should
              be benchmarked as a hybrid of industrial platform, auto-technology supplier, and sponsored growth option
              rather than as a clean pure-play chassis peer.
