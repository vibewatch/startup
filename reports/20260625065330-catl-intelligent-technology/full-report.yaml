      - number: '2.4'
        title: Growth Drivers, Constraints, and Contradictions
        blocks:
          - type: paragraph
            body: >-
              China currently offers the strongest visible tailwinds: a deep EV supply chain, policy support,
              willingness to experiment with modular architectures, and a large domestic OEM base. Public descriptions
              of CIIC, Bedrock, and MIH all emphasize shorter development cycles, standardized interfaces, and lower
              marginal cost of derivative vehicle programs as the main demand drivers. But adoption constraints are
              equally real. The category still has small installed scale, most identified production models are outside
              mainstream passenger-car volume, and overseas markets have seen high-profile setbacks. BusinessWire and
              ResearchInChina summaries explicitly contrast Western cooling with China’s emerging momentum. Customer
              concentration is another contradiction: AVATR is useful as proof, but CarNewsChina’s report of a 41.6
              percent Q1 2026 sales drop shows how one weak lighthouse can complicate commercialization narratives.
              Geopolitical scrutiny of CATL also adds a non-technical adoption drag for some overseas OEMs. Another
              constraint is procurement conservatism: even when a modular chassis is technically attractive, buyers may
              defer adoption until a peer program has already absorbed validation risk. That creates a feedback loop in
              which category leaders need visible second and third customers before the market feels broadly opened.
              That wedge is still small today. The scaling path remains experimentally narrow.
