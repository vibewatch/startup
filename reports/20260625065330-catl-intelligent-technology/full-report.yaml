  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Second named production customer, visible Bedrock SOP, and overseas programs move beyond opaque pipeline
        - Private mark proves conservative and confidence band shifts upward from the >RMB10bn center point
        - Execution and policy still matter, but concentration falls
        - Not yet supported by current public record
      - - Base
        - >-
          AVATR remains the anchor customer, policy scrutiny persists but does not escalate, and operating disclosure
          stays limited
        - Use the private mark as center point with a wide discount for concentration and model risk
        - Commercial proof remains narrower than the narrative
        - Most consistent with current public evidence
      - - Bear
        - AVATR weakens again, no second named customer appears, and policy or export friction rises
        - Haircut the private mark materially because customer and policy risk dominate valuation
        - Private round expectations prove ahead of commercialization
        - Supported by current adverse signals but not yet a full break
      - - Stretch upside
        - Parent support plus multiple named OEM wins shift the business toward a supplier-platform comp set
        - Multiple expansion becomes more credible than today
        - Requires proof that has not yet been published
        - Contingent on milestone delivery
