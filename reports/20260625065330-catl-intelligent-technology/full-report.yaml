  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct, Incumbent, Adjacent, and Substitute Competitors'
        blocks:
          - type: paragraph
            body: >-
              The buyer can solve the “modular EV platform” problem in several ways. Direct peers include dedicated
              skateboard-chassis players and open ecosystems such as MIH. Incumbent substitutes include large
              OEM-controlled EV platforms such as Volkswagen’s MEB, Hyundai’s E-GMP, and Geely’s SEA, which reduce the
              need for an external chassis provider by keeping architecture ownership in-house or inside a broad group.
              Adjacent suppliers such as Aptiv, Continental, and Mobileye matter because they can provide by-wire,
              software, and electronics layers that an OEM might combine into its own solution. Western startup examples
              like Canoo and Rivian are also relevant as proof that the concept can reach vehicles, but they illustrate
              very different capital and execution outcomes. The key practical point is that CAIT is competing against
              buyer make-versus-partner decisions, not just against one neat list of pure-play chassis startups.
            claimRefs:
