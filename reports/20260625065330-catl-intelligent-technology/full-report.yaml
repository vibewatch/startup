  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The only clear standalone anchor is the 2025 financing mark
        blocks:
          - type: paragraph
            body: >-
              Public evidence offers one credible standalone valuation anchor and not much else: multiple outlets
              reported that CATL Intelligent raised more than RMB 2 billion at a post-money valuation above RMB 10
              billion in 2025. That is useful because it shows real investor willingness to price the asset as more than
              an internal project. It is limited because the round disclosures do not publish revenue, margins, backlog,
              unit volumes, or customer concentration economics. As a result, the private mark should be treated as a
              negotiated market signal, not as proof that intrinsic value can already be triangulated tightly from
              public fundamentals. That financing anchor is best used as entry context and price discipline, not as a
              substitute for a model. Investors can say the market was willing to underwrite platform optionality; they
              still cannot say whether that mark assumed two or three production OEMs, which Bedrock programs were
              embedded, or how much of the chassis value ultimately remains economically inside the CATL parent rather
              than the subsidiary.
