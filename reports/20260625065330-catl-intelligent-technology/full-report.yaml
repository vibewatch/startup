              technology debuted in 2024, and most near-term mass production is centered on light commercial vehicles in
              2025-2026. The narrowest lens is CAIT’s own beachhead—premium NEV and selected commercial-vehicle programs
              where OEMs value reduced development cycles, battery-centric packaging, and open-architecture sourcing.
