- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Value or status
  - Confidence
  - Risk or dependency
  - Diligence ask
  rows:
  - - Latest outside financing
    - '>RMB2 billion first external round'
    - High
    - Exact amount still undisclosed
    - Obtain signed financing documents and net cash proceeds
  - - Post-money valuation
    - '>RMB10 billion'
    - High
    - Valuation anchor is headline only, without revenue disclosure
    - Request round deck and valuation support materials
  - - CATL ownership post-round
    - ~70.5934%
    - Medium
    - Minority protections and future dilution rights unknown
    - Request shareholder agreement and reserved matters
  - - Use of proceeds
    - Mass production of Panshi / Bedrock plus next-gen R&D
    - High
    - Capital may be consumed before repeat customer scale arrives
    - Request budget by tooling, validation, R&D, and commercialization
  - - Parent sponsor capacity
    - CATL 2025 revenue RMB423.7b; net profit RMB72.2b; operating cash flow RMB133.2b
    - High
    - Parent capacity does not equal guaranteed subsidiary support
    - Clarify sponsor support policy, intercompany funding, and guarantees
  - - Monthly burn / runway
    - Not publicly disclosed
    - None
    - Runway cannot be verified from public evidence
    - Request monthly cash burn, cash balance, and next-financing trigger
  notes: Capital adequacy is assessed through financing and sponsor strength because subsidiary cash and burn are not public.
