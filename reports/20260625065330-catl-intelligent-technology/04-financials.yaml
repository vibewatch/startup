  evidenceGaps:
  - topic: Standalone revenue and margin
    type: private-evidence-only
    severity: blocking
    missingEvidence: Subsidiary revenue by stream, gross margin, and customer concentration.
    whyItMatters: These are the core inputs needed to test valuation, revenue quality, and profitability path.
    diligencePath: Request audited or management financials with customer and stream detail.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI024
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - topic: Cash burn and runway
    type: private-evidence-only
    severity: blocking
    missingEvidence: Monthly burn, cash on hand, and next-financing trigger.
    whyItMatters: Without cash and burn, the >RMB2 billion round cannot be translated into runway.
    diligencePath: Request monthly cash-flow statement, cash balance, and board financing plan.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - topic: Backlog and SOP timing
    type: private-evidence-only
    severity: material
    missingEvidence: Signed backlog, pilot volumes, SOP calendar, and cancellation rights.
    whyItMatters: The business model is program based, so commercialization timing matters as much as technology claims.
    diligencePath: Request pipeline and backlog by customer, plus milestone billing terms.
    relatedQuestionRefs:
    - QI005
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - topic: Overseas commercialization resilience
    type: missing-source
    severity: minor
    missingEvidence: Evidence showing CAIT can win programs abroad despite CATL policy scrutiny and category failures.
    whyItMatters: Global upside is weaker if the business remains China-only.
    diligencePath: Request overseas pipeline, local-partner structure, and compliance mitigation plan.
    relatedQuestionRefs:
    - QI022
    - QI023
    relatedTableRefs:
    - TI004
