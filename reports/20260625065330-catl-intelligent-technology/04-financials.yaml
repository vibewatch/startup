tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - Integrated chassis hardware
    - Program-linked sale of lower-body or chassis assemblies
    - RMB per chassis or per program batch
    - Active product path; no public ASP
    - 'Medium: product existence clear, revenue undisclosed'
    - Request contracted ASP, volume ramp, and whether revenue starts at pilot or SOP
  - - Engineering and integration services
    - Design, validation, and program engineering tied to chassis adoption
    - RMB per project or milestone
    - Likely active, not publicly quantified
    - 'Low: inferred from business model'
    - Request milestone schedule, NRE fees, and service-versus-hardware mix
  - - Subsystem packaging
    - By-wire, thermal, and control-stack bundling with the chassis
    - RMB per integrated package
    - Possible but undisclosed
    - 'Low: public sources mention capability, not monetization split'
    - Clarify whether subsystem revenue is sold separately or only inside full-platform contracts
  - - Follow-on software or calibration support
    - Post-launch support and vehicle-domain tuning
    - Contract support fee or bundled service
    - Unknown
    - 'Low: no public evidence of separate pricing'
    - Request software update, calibration, and lifecycle-support commercial terms
  notes: Revenue streams are reconstructed from product and financing descriptions because CAIT does not disclose booked revenue or segment mix.
