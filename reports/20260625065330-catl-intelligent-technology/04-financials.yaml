- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Standalone revenue by customer and stream
    - Cannot assess traction quality or revenue concentration
    - Request audited or management revenue bridge by program, customer, and hardware or service stream
  - - Gross margin and contribution margin
    - Cannot judge path to profitability
    - Request gross margin by program plus BOM and warranty assumptions
  - - Monthly cash burn and cash on hand
    - Cannot verify runway or financing dependency
    - Request monthly cash-flow statement and cash balance through runDate
  - - Contracted backlog and SOP calendar
    - Cannot judge when financing converts into recognizable revenue
    - Request signed backlog, pilot volume, SOP timing, and cancellation terms
  - - Working-capital and capex schedule
    - Cannot estimate how much of the >RMB2b round remains available for growth
    - Request tooling, test, and manufacturing capex plan plus inventory or receivables schedule
  - - Customer concentration and pricing realization
    - Cannot score downside from one weak lighthouse customer
    - Request top-5 customer share, realized ASPs, and strategic-pricing policy
  notes: Every gap listed here is material to underwriting a private platform business at a reported unicorn valuation.
