- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Standalone revenue
    - Not publicly disclosed
    - None
    - Without revenue there is no basis for margin or growth underwriting
    - Request monthly and annual subsidiary revenue by customer and stream
  - - Gross margin
    - Not publicly disclosed
    - None
    - Determines whether the chassis business improves with scale or simply consumes capital
    - Request gross margin by program and by stream
  - - Engineering cost absorption
    - Likely high fixed cost before scale
    - Low
    - Early platform businesses often burn cash before repeat programs
    - Request engineering headcount, tooling, and test-spend allocation
  - - Customer concentration
    - Visible lighthouse set appears narrow
    - Low to medium
    - A few delayed launches can materially change cash conversion
    - Request top-customer exposure and backlog conversion assumptions
  - - Working-capital intensity
    - Probably elevated due to tooling, validation, and supply-chain coordination
    - Low
    - Runway depends on the gap between engineering spend and customer receipts
    - Request working-capital schedule, inventory, receivables, and milestone billing terms
  notes: Unit economics table is intentionally sparse because the real issue is missing disclosure, not a lack of analytical interest.
