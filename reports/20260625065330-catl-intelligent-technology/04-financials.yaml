- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  - Implication
  rows:
  - - Full intelligent chassis program
    - No public list price; likely realized contract pricing only
    - All customer pricing unknown
    - Business-model descriptions in financing and product coverage
    - Commercial diligence must start from contracts, not public brochures
  - - Engineering / validation milestones
    - Likely milestone-based rather than list-priced
    - Unknown whether paid upfront, at prototype, or at SOP
    - Inferred from platform-development workflow
    - Cash-conversion timing may be lumpy
  - - Integrated subsystem package
    - Unknown whether separately priced or bundled
    - Unknown
    - Product coverage mentions capability bundle but not monetization
    - Margin analysis requires disaggregated BOM and package pricing
  - - Customer-specific customization
    - Could command premium where top-hat flexibility matters
    - No evidence on discounting or strategic pricing
    - Modular-chassis positioning in reviewed sources
    - Potentially attractive ASPs but longer sales cycle and engineering load
  notes: No reviewed source provides realized pricing; the table distinguishes likely contract structure from unsupported price guesses.
