company:
  name: CATL Intelligent Technology
chapter:
  number: 4
  title: Financials
  summary: 'CATL Intelligent Technology has attracted enough capital and parent sponsorship to justify investor attention, but its standalone financial transparency remains very low. Public evidence supports a plausible revenue mechanism—selling integrated intelligent chassis hardware plus engineering and validation services—but does not disclose CAIT’s revenue, margin, cash balance, or burn. The strongest financial anchors are indirect: more than RMB2 billion of outside financing at a valuation above RMB10 billion, retained CATL control at roughly 70.5934 percent, and a very profitable parent that generated RMB423.7 billion of revenue and RMB72.2 billion of net profit in 2025. That makes the key underwriting question capital adequacy for mass production and next-generation R&D, not proof of current profitability.'
sections:
- id: revenue-model
  title: Revenue Streams and Monetization Logic
  body: Public sources do not disclose a CAIT price list or signed-program revenue by customer, but they do reveal the likely monetization structure. The subsidiary is described as a product-and-technology service provider for intelligent skateboard chassis, which implies a mixture of chassis hardware revenue, integration engineering, validation work, and possibly subsystem packaging around by-wire controls and battery-centric lower-body architecture. This is a program-business model, not SaaS and not a simple battery-cell resale. Revenue recognition would likely be tied to engineering milestones, prototype and pilot deliveries, and later SOP-linked hardware shipments. The company’s strongest public commercial proof remains lighthouse architecture relationships such as CHN and AVATR rather than disclosed revenue figures. The right conclusion is not that there is no revenue, but that public data are inadequate to quantify its current mix, realized pricing, or quality.
  claimRefs:
  - CI001
  - CI002
