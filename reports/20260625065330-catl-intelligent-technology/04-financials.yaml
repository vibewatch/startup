- id: cost-structure
  title: Cost Structure and Unit-Economics Proxies
  body: 'CAIT’s cost structure is inferential. Bedrock and CIIC are capital-intensive products that combine structural battery integration, by-wire systems, software-defined interfaces, and validation obligations. That implies heavy early spending on tooling, crash testing, engineering labor, supplier qualification, and customer-specific integration before the business reaches stable scaled manufacturing. Public sources around product positioning support this logic, but none disclose gross margin or per-unit contribution. The best proxies therefore come from adjacent listed peers and from the nature of the product itself: a complete lower-body architecture should have higher average selling value than a standalone subsystem, but it also carries a more complex bill of materials and longer conversion cycle. The most important financial takeaway is that CAIT likely needs meaningful program volume to absorb engineering and validation overhead, making customer concentration and launch timing
    first-order financial variables.'
  claimRefs:
