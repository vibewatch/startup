company:
  name: CATL Intelligent Technology
chapter:
  number: 6
  title: Customers
  summary: 'CATL Intelligent''s public customer proof is real but concentrated. AVATR is the strongest named adopter because official and independent sources link CHN launch, strategic cooperation, Bedrock integration, user delivery, and visible sales history into one narrative. The key downside is concentration: public proof for BAIC and overseas partners remains far less specific, while AVATR''s Q1 2026 sales slump shows that demand durability still depends heavily on one lead customer.'
sections:
- id: u601
  title: Customer segmentation is ecosystem-led and AVATR-dominant
  body: 'CATL Intelligent does not disclose a broad account list, so the usable public customer map is ecosystem-shaped rather than count-shaped. AVATR is the clearest named deployer, but it is also a partner showcase because CATL helped build the CHN architecture and now links Bedrock first-use rights to AVATR models. The rest of the visible base breaks into three thinner categories: domestic ecosystem partners such as BAIC; unnamed overseas partners in Southeast Asia, the Middle East, and Europe; and parent-level support channels through Changan and CATL. That segmentation matters because buyer, user, and payer are not always the same. The public record therefore supports a concentrated but strategically meaningful customer set rather than a diversified revenue book. Public segmentation also shows why customer proof should be read through program roles rather than through logo counts. AVATR is simultaneously a design partner, commercialization path, and market signal. BAIC and overseas
    partners are meaningful because they suggest the chassis pitch resonates beyond one premium EV brand, but the absence of named programs means the public record still cannot distinguish between pipeline interest, engineering cooperation, sourcing nomination, and true volume commitment.'
