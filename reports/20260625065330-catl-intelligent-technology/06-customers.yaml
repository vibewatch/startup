- id: u602
  title: Named customer proof is strongest on AVATR production and strategic expansion
  body: 'AVATR is not just a logo. The proof path goes from the June 2022 CHN launch, to the December 2022 strategic-cooperation expansion, to the December 2024 supplementary agreement, and then into 2025 Strategic 2.0 planning. That chain is stronger than a simple customer-story press release because it links technical architecture, vehicle launch, deeper R&D cooperation, and sales data. Public milestones also imply real end-user deployment: CATL said the first batch of AVATR 11 vehicles would reach users by end-2022, and independent coverage shows AVATR reaching 11,067 December 2024 sales and 73,606 units for full-year 2024. At the same time, named proof is still narrow. The chapter has much better evidence for one lead customer than for a broad portfolio of chassis customers. The official and semi-official chain matters because it reduces the risk that AVATR is just a marketing logo borrowed from the CATL parent. CATL, AVATR, Gasgoo, and iChongqing together show technical linkage, strategic
    deepening, and explicit global ambition. That said, the proof set still says much more about relationship depth than about economics: public sources do not disclose how much of AVATR volume actually rides on CATL Intelligent content, whether Bedrock is limited to selected programs, or whether the cooperation terms are exclusive or renewable.'
