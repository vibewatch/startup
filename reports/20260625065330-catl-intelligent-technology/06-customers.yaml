- id: u603
  title: Durability and concentration remain the core customer risks
  body: 'The weakness in the public customer record is not that demand is fake; it is that durability and breadth remain underdocumented. CarNewsChina''s Q1 2026 sales slump for AVATR is the clearest adverse source because it shows how exposed the narrative is to one customer''s demand cycle. Public materials do not disclose NRR, churn, contract durations, renewal mechanics, or revenue concentration. They also do not convert the BAIC and overseas-partner ecosystem claims into named production outcomes. The Deepal-backend integration plan may help AVATR lower costs, but it also underscores that the lead customer is still optimizing its own internal operating model. The result is a chapter where customer proof is good enough to validate real adoption, but not good enough to underwrite durable diversification without additional diligence. The broader lesson is that the chapter validates real customer existence but not yet durable portfolio quality. For a platform supplier, that distinction
    matters: one strong flagship customer can demonstrate technical credibility, but only repeat wins across named programs can demonstrate commercial durability. Until the company publishes a second named production customer or a clearer pipeline-to-SOP conversion record, every new demand wobble at AVATR should be treated as both a customer signal and a valuation signal. Diversification proof is still thin.'
