- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - AVATR Strategic 2.0 model expansion
    - Lead-customer volume still dominates public proof
    - If AVATR underperforms, customer narrative weakens quickly
    - Review model-by-model program sourcing and forward build schedule
  - - BAIC / domestic ecosystem broadening
    - Public proof has not reached named production outcomes
    - Domestic diversification may be slower than marketing suggests
    - Request named programs and engineering milestones
  - - Overseas partner pipeline
    - Unnamed counterparties may remain exploratory
    - Global optionality could be overstated
    - Obtain signed MoUs, SOP dates, and geography-specific partner names
  - - Deepal-backend integration
    - Customer operating changes may affect procurement timing or governance
    - Could shift launch cadence, sourcing, or support economics
    - Review post-integration sourcing decision rights
  - - U.S. regulatory scrutiny around CATL
    - Counterparties may face extra diligence or reputational questions
    - Could slow some OEM decisions outside China
    - Review customer red-flag screens and region-specific compliance constraints
  notes: The biggest issue is not lack of any customer proof; it is the gap between one strong named adopter and a still-opaque broader pipeline.
