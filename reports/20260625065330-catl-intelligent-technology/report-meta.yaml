companyProfile:
  summary: "CATL Intelligent Technology is the CATL-controlled chassis subsidiary reported as having been established in Shanghai in 2021 to commercialize integrated intelligent skateboard chassis products. Its flagship Panshi / Bedrock platform sits inside CATL's broader CIIC architecture and pushes the parent group up the EV value stack from battery cells into the rolling lower-body platform, including battery integration, crash structure, thermal management, by-wire systems, and software-facing interfaces. The business reached a clear external financing milestone in 2025 when it reportedly raised more than RMB 2 billion at a post-money valuation above RMB 10 billion while CATL retained roughly 70.6 percent ownership. Public customer proof is real but concentrated: AVATR is the clearest named lighthouse program, while broader BAIC and overseas pipeline claims remain less specific."
