  topStrengths:
    - "Backed by CATL's balance sheet, battery leadership, manufacturing adjacency, and global ecosystem rather than operating as an isolated startup."
    - "Bedrock / Panshi gives the company a differentiated vehicle-platform narrative that extends CATL into the lower-body architecture layer, not just cells."
    - "AVATR provides real ecosystem proof through CHN launch, strategic cooperation, visible product deployment, and multi-year global expansion claims."
  topRisks:
