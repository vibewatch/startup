- id: e503
  title: Commercialization path and dependencies
  body: Commercialization is real but still narrow. AVATR is the strongest named deployment path, and the 2025 financing coverage says the ecosystem has expanded to BAIC plus unnamed overseas partners in Southeast Asia, the Middle East, and Europe. Those are encouraging signals because a chassis platform only matters if multiple OEMs are willing to build on it. At the same time, commercialization depends on external schedules that public sources do not pin down clearly. No reviewed source publishes the first SOP date for a Bedrock-based model, and public materials do not give a third-party homologation or certification packet. That means the market can verify partnership breadth and strategic intent faster than it can verify production timing or field reliability. Investors should therefore treat customer breadth as improving, but actual series-production conversion as a gated milestone rather than an accomplished fact.
  claimRefs:
  - CE024
