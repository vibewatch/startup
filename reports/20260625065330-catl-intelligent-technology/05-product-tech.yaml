- id: e504
  title: Trust, support, and remaining proof gaps
  body: 'CATL Intelligent benefits from the credibility of its parent company, and that matters because chassis adoption requires long-horizon support. CATL''s 2025 annual results point to large R&D spend, a large patent estate, and a broad after-sales footprint, all of which strengthen the argument that the chassis business can draw on meaningful engineering and support capacity. But those parent strengths do not fully close product-level diligence gaps. Public sources still lean heavily on company-claimed crash performance, future autonomy capability, and generalized OTA flexibility; they do not provide a public cyber-security framework, independent crash-test dossier, or production reliability statistics specific to the chassis unit. The conclusion is favorable but conditional: CATL Intelligent looks strategically important and technically differentiated, yet its strongest public evidence still sits at the architecture-and-partnership level rather than in a fully transparent production-quality
    packet. Investors can verify that the parent has the balance sheet and organizational scale to support a long product cycle, yet they still cannot verify whether Bedrock has cleared the same level of external scrutiny that a mature supplier would normally disclose through certifications, field data, warranty trends, or named SOP programs. The practical implication is that underwriting should lean on architecture strength and partner fit today, while reserving final conviction for production evidence. The evidence is improving.'
