chapter:
  number: 5
  title: Product & Technology
  summary: 'CATL Intelligent''s public product story is centered on the CIIC skateboard chassis and the Bedrock flagship, which extend CATL from battery supplier into a lower-body platform partner for OEMs. Reviewed sources support a real architecture thesis: battery-centric cell-to-chassis integration, by-wire chassis modules, AVATR-linked CHN stack integration, and an SDV-oriented standards signal through COVESA. The strongest diligence caveat is that safety, autonomy, and launch timing are still proved more by company and launch-event claims than by transparent third-party certification or SOP evidence.'
sections:
- id: e501
  title: Product scope and customer workflow
  body: 'CATL Intelligent sells a chassis-layer product stack rather than an end-customer vehicle brand. The public offer centers on the CIIC integrated intelligent chassis and the Bedrock flagship, which are meant to let OEMs decouple the upper and lower body, standardize key hard points, and shorten vehicle development cycles. That makes the customer workflow concrete: an automaker starts with the skateboard chassis as the energy, motion, and data base; chooses chassis-control modules and battery configuration; then layers brand-specific body, cabin, and software choices on top. The strongest proof of this workflow is AVATR, where CATL''s role extends from batteries into the CHN architecture and now into first-use rights for Bedrock. The chassis is therefore best understood as a configurable development platform whose value proposition is faster program launch, more packaging freedom, and shared safety engineering.'
