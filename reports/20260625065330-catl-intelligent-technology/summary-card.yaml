  topStrengths:
    - >-
      Backed by CATL's balance sheet, battery leadership, manufacturing adjacency, and global ecosystem rather than
      operating as an isolated startup.
    - >-
      Bedrock / Panshi gives the company a differentiated vehicle-platform narrative that extends CATL into the
      lower-body architecture layer, not just cells.
    - >-
      AVATR provides real ecosystem proof through CHN launch, strategic cooperation, visible product deployment, and
      multi-year global expansion claims.
  topRisks:
    - >-
      Public proof is still concentrated around one lighthouse customer relationship, so AVATR demand volatility
      transmits directly into commercial confidence.
    - >-
      Standalone subsidiary revenue, backlog, margins, SOP timing, and governance transparency remain largely
      undisclosed despite the 2025 unicorn financing.
    - >-
      CATL-linked geopolitical, export-control, and policy scrutiny can raise the risk premium on any overseas chassis
      expansion story.
  unresolvedGaps:
    - No public standalone revenue, margin, backlog, or cash-burn data for the subsidiary.
    - No full public management roster or detailed governance package for CAIT as a standalone operating company.
    - No public customer-by-customer SOP schedule or contract economics beyond AVATR-centric proof.
    - No precise fair-value method is defendable until commercialization metrics are disclosed.
