- id: capabilities-and-switching
  title: Capabilities, Pricing Logic, and Switching Costs
  body: 'Public capability comparisons suggest CAIT’s strongest differentiation is structural integration: a battery-centric chassis, by-wire stack, and openness to external collaboration. MIH emphasizes open ecosystem participation; MEB+, E-GMP, and SEA emphasize modularity inside large OEM or group contexts; and adjacent suppliers such as Aptiv and Continental offer technology blocks rather than a complete lower-body architecture. Pricing is weakly disclosed across the field, so the most honest comparison is contract model rather than sticker price. CAIT likely sells a mix of chassis hardware, integration engineering, and program-specific validation. Internal OEM platforms are funded through capex and program budgets, not line-item public price sheets. This opacity itself is a competitive reality: switching costs are driven by validation, tooling, safety certification, and software integration, not just by per-unit hardware price.'
  claimRefs:
