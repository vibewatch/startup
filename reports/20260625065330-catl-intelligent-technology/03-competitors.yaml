- id: profiles
  title: Competitor Profiles and Comparative Scale
  body: 'Scale is uneven across the field. CATL’s parent gives CAIT industrial depth that most startup-like platform plays do not have, while public market-cap data show the adjacent and substitute set is populated by very large companies: Continental, Rivian, Ford, BYD, and Geely all sit at far larger public-equity scale than a >RMB10 billion private chassis subsidiary. MIH’s member count shows another route to scale through ecosystem breadth rather than one corporate balance sheet. On the platform side, MEB, E-GMP, and SEA are not sold as direct CAIT look-alikes, but they matter because they have already been embedded into multi-model OEM portfolios and therefore reduce the addressable set of buyers willing to outsource the lower-body architecture. That makes competitive scale less about one-to-one startup comparisons and more about who already controls the OEM decision framework. Public scale comparisons also matter strategically: an OEM choosing against CAIT is often defaulting not to
    another startup, but to the balance sheet and engineering cadence of a giant auto group or listed supplier. That raises the commercial hurdle for every external chassis provider, because buyers are benchmarking supplier risk as much as product architecture.'
