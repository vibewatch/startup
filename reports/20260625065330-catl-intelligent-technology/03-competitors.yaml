company:
  name: CATL Intelligent Technology
chapter:
  number: 3
  title: Competitors
  summary: 'CATL Intelligent Technology competes less with consumer EV brands than with three alternative ways an OEM can solve the same job: build its own dedicated EV platform, join an open alliance such as MIH, or buy from adjacent vehicle-technology suppliers and assemble the stack internally. CAIT’s differentiation is battery-centric integration plus CATL’s supply-chain gravity, but the competitive field is crowded with very large incumbents and platform owners. The market also carries an adverse lesson from overseas skateboard-chassis failures such as Canoo, which raises the bar for proving a durable moat beyond product demos and lighthouse programs.'
sections:
- id: landscape
  title: 'Landscape: Direct, Incumbent, Adjacent, and Substitute Competitors'
  body: The buyer can solve the “modular EV platform” problem in several ways. Direct peers include dedicated skateboard-chassis players and open ecosystems such as MIH. Incumbent substitutes include large OEM-controlled EV platforms such as Volkswagen’s MEB, Hyundai’s E-GMP, and Geely’s SEA, which reduce the need for an external chassis provider by keeping architecture ownership in-house or inside a broad group. Adjacent suppliers such as Aptiv, Continental, and Mobileye matter because they can provide by-wire, software, and electronics layers that an OEM might combine into its own solution. Western startup examples like Canoo and Rivian are also relevant as proof that the concept can reach vehicles, but they illustrate very different capital and execution outcomes. The key practical point is that CAIT is competing against buyer make-versus-partner decisions, not just against one neat list of pure-play chassis startups.
