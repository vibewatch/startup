  evidenceGaps:
  - topic: Repeat customer proof
    type: private-evidence-only
    severity: blocking
    missingEvidence: Booked-program count, renewal behavior, and evidence of a second or third scaled customer beyond the visible lighthouse set.
    whyItMatters: Moat durability cannot be proven from one or two ecosystem logos alone.
    diligencePath: Request customer pipeline, backlog, repeat-win data, and program concentration by OEM.
    relatedQuestionRefs:
    - QP018
    - QP024
    relatedTableRefs:
    - TP004
  - topic: Comparable pricing disclosure
    type: missing-source
    severity: material
    missingEvidence: Public or management-confirmed contract structures and ASP ranges for CAIT and major alternatives.
    whyItMatters: Without contract economics, pricing moat and margin defensibility remain speculative.
    diligencePath: Request sample commercial terms, engineering-fee structure, and hardware ASP bands by program type.
    relatedQuestionRefs:
    - QP012
    - QP022
    relatedTableRefs:
    - TP003
  - topic: Capability matrix completeness
    type: missing-source
    severity: minor
    missingEvidence: Primary-source technical documentation for MEB+, E-GMP, SEA, and MIH on the exact chassis-domain capabilities compared here.
    whyItMatters: Many competitive cells remain unknown because reviewed public sources emphasize platform history more than comparable technical detail.
    diligencePath: Add OEM technical docs or investor materials before hard-scoring capability claims.
    relatedQuestionRefs:
    - QP010
    - QP011
    relatedTableRefs:
    - TP002
  - topic: Overseas commercialization viability
    type: stale
    severity: material
    missingEvidence: Program-level evidence that CAIT can win outside China despite CATL policy scrutiny.
    whyItMatters: Global moat durability depends on whether CAIT can travel beyond China-centric demand.
    diligencePath: Request export pipeline, overseas partnerships, and compliance or localization plans.
    relatedQuestionRefs:
    - QP019
    - QP024
    relatedTableRefs:
    - TP004
