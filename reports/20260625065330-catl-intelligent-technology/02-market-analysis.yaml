- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Battery-centric packaging and CTC efficiency
    - Driver
    - Near term
    - Improves space use and can speed architecture differentiation
    - Verify packaging advantage at customer-program level, not just demo claims
  - - Shorter concept-to-production cycle
    - Driver
    - Near term
    - Supports OEM interest in external modular lower bodies
    - Request actual cycle-time reduction versus in-house platform benchmarks
  - - Open interfaces and ecosystem collaboration
    - Driver
    - Medium term
    - Broadens partner pool and lowers duplicated engineering
    - Confirm which APIs, interfaces, and tooling are actually standardized today
  - - China supply-chain depth and policy support
    - Driver
    - Near term
    - Makes China the most favorable commercialization arena
    - Test whether policy support transfers to exportable global programs
  - - Homologation and safety validation burden
    - Constraint
    - Near term
    - Lengthens sales cycle and slows booked revenue conversion
    - Map certification status and customer SOP milestones by program
  - - High switching cost from existing OEM platforms
    - Constraint
    - Persistent
    - Limits platform replacement and favors greenfield models
    - Ask how many launches are net-new versus platform swaps
  - - Western market cooling after Arrival / Canoo setbacks
    - Constraint
    - Current
    - Weakens global narrative for skateboard-chassis enthusiasm
    - Quantify whether CAIT demand is overwhelmingly China-centric
  - - Lighthouse-customer volatility
    - Constraint
    - Current
    - AVATR weakness can distort market confidence around early programs
    - Request customer concentration and exposure by platform program
  notes: Driver / constraint table mixes structural demand factors with category-specific adoption friction; most constraints are commercialization, certification, and buyer-behavior issues rather than basic technical feasibility.
