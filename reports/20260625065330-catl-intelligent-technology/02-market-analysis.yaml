- id: buyers-and-adoption
  title: Buyer Segments, Budget Owners, and Adoption Path
  body: 'The buyer is usually not a retail end customer but an OEM platform team. In passenger vehicles, the budget owner is likely a CTO, platform engineering leader, or program executive balancing speed-to-market, body-style flexibility, and battery packaging efficiency. In light commercial vehicles and mobility fleets, the value proposition can be even clearer because modularity, custom body variants, and simplified manufacturing matter more than brand-specific driving feel. MIH’s membership counts and China-focused report summaries indicate the market is being shaped by open-platform logic, supplier ecosystems, and joint development rather than pure component procurement. Adoption still follows a long industrial path: concept architecture, safety validation, homologation, software integration, pilot fleet or low-volume production, then scaled SOP. That path creates long sales cycles and means lighthouse deployments matter disproportionately as proof points.'
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
