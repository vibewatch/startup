- id: sizing-lenses
  title: Sizing Lenses and Evidence-Constrained TAM / SAM / SOM
  body: 'Direct market-size disclosures for intelligent skateboard chassis remain weak, so this chapter uses constrained lenses rather than one generic TAM. The broadest lens is the global EV production and battery demand backdrop: SNE Research and downstream coverage put 2025 EV battery usage at 1,187 GWh, up 31.7 percent year over year, with CATL alone at 39.2 percent share. The next lens is the direct commercialization status of skateboard chassis: ResearchInChina and ResearchAndMarkets summaries say eight production models in China already use the architecture, around fourteen additional models featuring the technology debuted in 2024, and most near-term mass production is centered on light commercial vehicles in 2025-2026. The narrowest lens is CAIT’s own beachhead—premium NEV and selected commercial-vehicle programs where OEMs value reduced development cycles, battery-centric packaging, and open-architecture sourcing.'
