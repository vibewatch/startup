company:
  name: CATL Intelligent Technology
chapter:
  number: 2
  title: Market Analysis
  summary: CATL Intelligent Technology is selling into the emerging market for modular EV skateboard and intelligent chassis systems, a category that sits between conventional vehicle platforms and specialized by-wire subsystem suppliers. Public evidence supports a strong adjacency thesis—global EV battery demand reached 1,187 GWh in 2025 and CATL’s parent remains the largest battery supplier—but the direct skateboard-chassis market is still early, with only eight production models identified in China and about fourteen additional models debuting in 2024 according to industry-report summaries. China currently appears to be the most favorable commercialization arena, while overseas enthusiasm cooled after failures such as Arrival and Canoo.
sections:
- id: market-boundary
  title: Market Boundary and What Spend Counts
  body: The relevant market is not “all EVs” and not “all chassis” in a legacy automotive sense. CATL Intelligent sits in the narrower layer where an OEM buys or co-develops a battery-centric modular lower body that bundles structural battery integration, drive and thermal subsystems, by-wire controls, and software-defined interfaces. Included spend therefore covers skateboard or intelligent chassis engineering, integrated lower-body hardware, validation, and supporting chassis-domain software. Excluded spend includes full upper-body vehicle development, standalone cell supply, generic ADAS compute, charging infrastructure, and unrelated component sourcing. This matters because broad EV TAM figures overstate the serviceable opportunity. The company wins only when an OEM chooses a modular, externally sourced or jointly developed platform route instead of keeping a dedicated EV platform fully in-house. It is therefore better to treat CAIT as selling into a decision wedge inside vehicle architecture
    budgets, not into the whole EV hardware stack.
  claimRefs:
