  evidenceGaps:
  - topic: Clean revenue TAM / SAM / SOM
    type: missing-source
    severity: blocking
    missingEvidence: A public source with revenue, unit, or contracted-volume data for the external intelligent-chassis market.
    whyItMatters: Without direct market revenue or volume data, the chapter must rely on adjacent and commercialization lenses rather than a true SOM model.
    diligencePath: Request OEM program volumes, ASP ranges, and category revenue estimates from management or industry databases.
    relatedQuestionRefs:
    - QM023
    - QM024
    relatedTableRefs:
    - TM002
  - topic: Buyer-volume disclosure
    type: private-evidence-only
    severity: material
    missingEvidence: Named customer volumes, booked programs, and conversion rates from pilot to SOP.
    whyItMatters: Buyer segmentation is visible, but actual monetizable demand cannot be scored without program counts and size.
    diligencePath: Obtain current pipeline, win/loss data, and vehicle-volume assumptions by customer segment.
    relatedQuestionRefs:
    - QM011
    - QM012
    - QM024
    relatedTableRefs:
    - TM003
  - topic: Commercialization timing
    type: conflicting-data
    severity: material
    missingEvidence: Verified SOP timing for the fourteen 2024-debut models and whether they reached production in 2025-2026.
    whyItMatters: Debut counts overstate market readiness if programs slip or never scale.
    diligencePath: Track each cited model to certification, SOP, and delivered-vehicle status.
    relatedQuestionRefs:
    - QM008
    - QM018
    relatedTableRefs:
    - TM002
  - topic: Geopolitical exportability
    type: stale
    severity: minor
    missingEvidence: Program-level evidence showing whether CATL-linked chassis platforms can win outside China despite policy pressure.
    whyItMatters: China strength does not automatically transfer to export markets.
    diligencePath: Request active overseas pipeline, partner geography, and legal / compliance mitigation strategy.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM004
