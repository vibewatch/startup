- id: r704
  title: Mitigations and thesis-break triggers are monitorable
  body: 'The risk stack is serious, but it is also monitorable. The most important mitigants are parent-company scale, fresh capital for mass production and next-generation R&D, and the ability to diversify away from the U.S. if policy risk keeps rising. The most important kill criteria are equally clear: a harsher U.S. policy step than watchlist status, evidence that export controls block overseas rollout, or another weak signal from AVATR coupled with no visible Bedrock SOP. If any two of those happen together, the platform should be treated as strategically interesting but commercially delayed. If the company instead lands a second named production customer and keeps regulatory exposure at the scrutiny stage rather than the sanction stage, the current risk rating can fall. Monitorability is the one favorable feature of the current risk stack. Each major risk can be tied to a public trigger: new U.S. policy action, export-license delay, another negative AVATR demand signal, or the appearance
    of a second named production customer. That means the chapter''s recommendation is not to avoid the company categorically, but to treat it as a high-upside platform whose next disclosures will determine whether risk is compressing or compounding.'
