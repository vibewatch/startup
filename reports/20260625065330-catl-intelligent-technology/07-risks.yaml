- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory escalation
    - U.S. action goes beyond watchlist scrutiny
    - New sanctions, direct project restrictions, or customer withdrawals
    - Re-rate risk upward and defer any U.S.-linked growth assumptions
  - - Export-control blockage
    - Technology-transfer approvals do not clear for overseas rollout
    - License denial, material delay, or scope expansion on restricted tech
    - Cut international expansion assumptions
  - - Lead-customer deterioration
    - AVATR demand or launch timing weakens again
    - Another major sales decline or no visible Bedrock SOP progress
    - Treat commercialization timeline as delayed
  - - Partner diversification failure
    - No second named production customer emerges
    - 12-month period with no named non-AVATR production program
    - Assume concentration risk persists
  - - Mitigation success
    - Named second customer plus scrutiny stays non-sanctioning
    - Second SOP or signed production program without new sanctions
    - Lower concentration and regulatory risk one notch
  notes: Triggers are designed for investment monitoring, not for legal diagnosis; the aim is to detect when strategic optionality stops converting into commercial proof.
