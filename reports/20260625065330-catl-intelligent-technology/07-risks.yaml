- id: r703
  title: Operational proof gaps are manageable until they become time delays
  body: 'Operational risk is not zero just because CATL is a scaled parent. Public evidence still lacks the most important production-grade proof points for the chassis product itself: a firm SOP date, a third-party safety dossier, and field-quality disclosures. The public crash-resilience evidence is impressive, but it still comes through launch communications and media coverage rather than through independently published certification materials. The multi-stack dependency on by-wire modules, software domains, and customer systems also complicates failure attribution if incidents emerge in the field. That does not mean the product is unsafe; it means the platform remains at a stage where due diligence has to rely on unpublished engineering artifacts for final comfort. The same logic applies to safety and quality proof. The issue is not that public sources show failure; the issue is that they stop short of the materials that would let outside underwriters separate mature automotive validation
    from launch-stage engineering claims. Until those packets appear, even routine schedule movement can amplify concern because outsiders lack enough hard data to distinguish delay from deeper readiness problems.'
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR032
  - CR039
  - CR042
