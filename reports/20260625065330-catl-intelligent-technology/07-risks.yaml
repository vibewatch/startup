- id: r702
  title: Customer concentration and partner opacity are the main commercial risks
  body: 'Commercial risk is concentrated in one lead adopter. AVATR is the first strong named customer path, but that makes downside signals from AVATR disproportionately important. The Q1 2026 sales decline does not disprove the platform, yet it shows how exposed the narrative remains to one customer''s demand cycle. Other partners are still mostly ecosystem claims rather than fully named production programs. That is the central commercial asymmetry in the story: the company can point to BAIC and overseas opportunities, but outside investors still cannot verify how many of those are in engineering, pilot, sourcing, or production. Because the chassis business is early, commercial concentration transmits directly into valuation, fundraising, and roadmap credibility. Concentration also reduces the company''s ability to absorb normal launch volatility. If AVATR has a weak quarter, investors cannot yet point to a second fully named production customer that offsets the signal. Conversely, even
    if BAIC and overseas leads are real, the current public record does not show whether they are at memorandum, engineering, sourcing, or SOP stage. That gap keeps the commercial-risk discount high.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR027
