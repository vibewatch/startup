chapter:
  number: 7
  title: Risks
  summary: CATL Intelligent's biggest visible risks are not that the chassis concept lacks ambition, but that commercialization sits inside a growing policy and partner-dependency box. U.S. military-company listing scrutiny, FEOC-style rules, Chinese export controls, and ongoing CATL battery-patent litigation all create cross-border friction. On top of that, AVATR remains the only strong named production adopter in public sources, so the chassis story is highly exposed to one customer's demand and launch cadence.
sections:
- id: r701
  title: Regulatory, legal, and reputational risk now outrank pure engineering risk
  body: 'The most severe visible risks are regulatory and reputational, not raw platform engineering. CATL''s inclusion on the U.S. Section 1260H list and the follow-on FEOC logic create a policy overhang that can alter customer appetite, project structure, and financing options even when no flat operating ban exists. Separate scrutiny around the 2025 Hong Kong IPO shows that political-risk questions can spill into capital-market access. Patent litigation adds a second legal layer: the public docket around CALB underscores that battery IP remains contested and can consume management attention. These issues matter to CATL Intelligent because a young chassis business depends on partner confidence, cross-border engineering collaboration, and future commercialization rights. The reason this category outranks other risks is transmission. A chassis platform has to persuade OEMs, regulators, insurers, and financing partners at the same time. Once a counterparty believes scrutiny may intensify,
    the practical result can be slower diligence cycles, narrower contract structures, and more reluctance to publicize cooperation. That makes a reputational issue economically relevant even before it becomes a formal operating restriction.'
