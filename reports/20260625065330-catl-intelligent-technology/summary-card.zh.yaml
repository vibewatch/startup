  topStrengths:
    - 公司不是孤立创业公司，而是背靠 CATL 的资产负债表、电池领先地位、制造相邻能力和全球生态。
    - Bedrock / Panshi 让公司拥有差异化整车平台叙事，把 CATL 从电芯延伸到底盘架构层。
    - AVATR 借 CHN 首发、战略合作、可见产品落地和多年全球扩张说法，提供了真实生态证据。
  topRisks:
    - 公开证据仍集中在一个灯塔客户关系上，AVATR 需求波动会直接传导到商业确定性。
    - 即便完成 2025 年独角兽融资，独立子公司的收入、订单积压、利润率、SOP 节点和治理透明度仍大多未披露。
    - 与 CATL 相关的地缘政治、出口管制和政策审查，可能抬高海外底盘扩张叙事的风险溢价。
  unresolvedGaps:
    - 子公司没有公开的独立收入、利润率、订单积压或烧钱数据。
    - CAIT 作为独立经营公司的完整管理层名单和详细治理方案尚未公开。
    - 除 AVATR 相关证据外，没有公开的逐客户 SOP 计划或合同经济条款。
    - 商业化指标披露前，任何精确公允价值方法都站不住。
