- id: SR004
  title: People, execution, and monitorable thresholds
  body: 'Execution risk remains high because Substrate is attempting to compress a decades-long industrial learning curve into a startup timeline. The company’s hiring surface and public narrative imply simultaneous needs in accelerator physics, computational lithography, manufacturing engineering, fab operations, EHS, capital formation, and customer qualification. That breadth is not automatically disqualifying, but it raises the threshold for leadership depth and sequencing discipline. Publicly, the company is still strongly identified with James and Oliver Proud, and TechSpot notes the founders did not come from prior semiconductor manufacturing leadership roles. Heise further notes that the public technical disclosure remains thin enough that outside observers cannot yet judge the practical implementation timetable with confidence.


    For underwriting, this means the right response is not to ignore the moonshot but to define clear kill criteria. If Substrate cannot show a credible site-and-permitting workstream, throughput-and-yield roadmap, customer qualification plan, and staged financing structure before the next major capital step, the thesis should be discounted as a science project rather than a manufacturable business. Conversely, bench depth can be made monitorable: experienced fab operators, named EHS leadership, disclosed commercial counterparties, and a capital plan that bridges pilot tooling to regulated production would all reduce residual risk. Until those signals appear, people and execution risk amplify every other category rather than sitting beside them.'
