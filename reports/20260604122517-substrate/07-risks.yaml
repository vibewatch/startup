- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Throughput or yield proof remains absent
    - Tool qualification package, public demos, or diligence packet
    - No disclosed wafers-per-hour, overlay, uptime, or yield roadmap before the next major financing step
    - Pause underwriting manufacturing economics and treat the company as pre-fab R&D
  - - Site, permitting, or EHS workstream remains opaque
    - Site announcement, permit filings, utility agreements, or EHS leadership hires
    - No identifiable site-and-permitting workstream within 12 months of the 2028 production target
    - Rebase schedule assumptions and increase capex contingency materially
  - - External capital stack does not materialize
    - CHIPS awards, tax-credit structure, debt package, or strategic financing announcements
    - No major financing package or staged-capex bridge while fab ambition advances
    - Assume either major dilution or scope reduction and revisit valuation
  - - Export-control-sensitive supplier dependency worsens
    - BIS updates, Entity List actions, or supplier notices
    - A critical tool or software dependency becomes restricted, delayed, or single-sourced without backup
    - Reassess procurement feasibility and push for a supplier-by-supplier compliance matrix
  - - Commercial qualification remains unproven
    - Named pilot, reservation, prepayment, or qualification partner
    - No named pilot or reservation before irreversible fab or site commitments
    - Treat demand and utilization assumptions as speculative rather than financeable
  - - Operating bench depth does not improve with complexity
    - Leadership announcements and organizational evidence
    - No proven fab, EHS, and commercial operators added as the company approaches build-out decisions
    - Increase the execution discount and narrow the investment case to technology option value
  notes: These decision thresholds are intentionally monitorable from outside the company and tie directly to go or no-go underwriting decisions.
