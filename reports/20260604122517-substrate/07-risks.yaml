  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register coverage gap
    missingEvidence: Site-specific permit matrix, executed CHIPS required agreement, state radiation registrations, and formal IP freedom-to-operate analysis.
    whyItMatters: Without those company-specific documents the regulatory and legal risk register can only be a partial public map, not a complete compliance inventory.
    diligencePath: Request the current legal and permitting tracker, counsel memos, and every draft or executed funding or regulatory agreement tied to site selection and manufacturing scale-up.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR014
    - QR015
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: capital-stack
    missingEvidence: Cash on hand, monthly burn, debt terms, tax-credit assumptions, award applications, and capex draw schedule.
    whyItMatters: The capital-intensity thesis cannot be underwritten responsibly from open sources alone because timing of financing matters as much as nominal funding size.
    diligencePath: Request management accounts, capital plan, award pipeline, debt term sheets, and downside runway scenarios before treating the fab path as financeable.
    relatedQuestionRefs:
    - QR001
    - QR018
    - QR020
    - QR029
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-validation
    missingEvidence: Signed pilot agreements, qualification criteria, reservations, prepayments, or any customer-backed demand schedule.
    whyItMatters: A narrow early buyer universe makes demand proof central to whether capex can be absorbed without a utilization shock.
    diligencePath: Request the target-account list, qualification milestones, counterparties under NDA, and any commercial term sheets tied to the 2028 plan.
    relatedQuestionRefs:
    - QR003
    - QR017
    - QR028
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: safety-certification
    missingEvidence: Named EHS leadership, radiation-control program documents, quality certifications, and any internal or external audit results.
    whyItMatters: A tool or fab using accelerator and hazardous-material workflows must show more than technical promise; it needs auditable operating controls.
    diligencePath: Request EHS manuals, radiation-safety procedures, internal audit cadence, external certifications, and any prior incident logs.
    relatedQuestionRefs:
    - QR013
    - QR024
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: throughput-yield
    missingEvidence: Wafers per hour, overlay, uptime, defect density, yield, maintenance cycle, and service burden for the 300 mm tool.
    whyItMatters: These are the operating numbers that convert an exciting lithography result into customer qualification, cost proof, and investable margin potential.
    diligencePath: Request the latest qualification dataset, engineering dashboard, reliability trend, and benchmark against the company's own scale-up model.
    relatedQuestionRefs:
    - QR005
    - QR019
    - QR027
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
