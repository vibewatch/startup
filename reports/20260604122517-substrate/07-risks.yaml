- id: SR002
  title: Operational, process, and safety risk
  body: 'Operationally, the core question is not whether Substrate has a differentiated idea; it is whether the company can turn a disclosed proof point into repeatable, full-wafer, fab-grade production. Official materials are strongest on scientific ambition and early technical milestones: Substrate says it has an in-house production-quality 300 mm tool, a 12 nm-class result, and a simulation stack that AlphaEvolve materially accelerated. None of those claims, however, answer the manufacturing questions that actually govern cost and customer qualification. Public sources still do not disclose wafers per hour, overlay, uptime, defect density, yield, maintenance intervals, or service burden.


    That gap is important because independent industry sources frame advanced lithography as an ecosystem problem rather than a single-source breakthrough. ASML, IRDS, and NIST all describe a stack that depends on optics, stages, masks, resists, metrology, models, and field management. TechInsights and TrendForce push the same point from the skeptical side: proving one process step or one small-pattern demonstration is not the same as qualifying a production flow across the thousands of steps a foundry needs. The historical X-ray literature reinforces the warning by noting that X-ray lithography has long carried cost and throughput penalties tied to source infrastructure. Safety readiness is also under-disclosed. OSHA, EPA, and CHIPS environmental materials describe a heavy compliance burden, yet no public source discloses Substrate-specific quality certifications, radiation controls, or incident history. Residual operational risk is therefore critical even if the physics case keeps improving.'
