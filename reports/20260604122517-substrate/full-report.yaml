  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context, investment thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >
              Substrate's current public price signal is a private round mark, not an operating multiple. Multiple
              outlets reported that the company raised more than $100 million at about or above a $1 billion valuation,
              while the company and investor materials frame the use of that capital around a vertically integrated U.S.
              manufacturing ambition rather than a narrow point-tool business. The optimistic reading is clear: if
              Substrate can actually move leading-edge wafers toward its stated $10,000 target and reach mass production
              around 2028, it could own both the enabling lithography step and a larger share of manufacturing economics
              than a conventional equipment supplier.


              The anti-thesis is equally important at this entry price. Public evidence still does not disclose revenue,
              customer count, backlog, or realized wafer pricing, and management itself has said long-run scale could
              require many billions, potentially tens or hundreds of billions of dollars, as multiple facilities are
              built. That means the present mark is being asked to bridge an unusually large gap between early technical
              proof and eventual industrialization. At $1 billion, investors are not underwriting a disclosed operating
              business; they are underwriting a future proof stack that still needs customer qualification, financing,
              and process data.
            claimRefs:
