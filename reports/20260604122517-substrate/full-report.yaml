      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >
              Exit readiness is low on public evidence. Substrate is not being judged against other stealth or
              seed-stage companies anymore; a reported $1 billion mark and an ambition to build leading-edge fabs move
              the company into a category where investors should expect more structured disclosure on customers,
              economics, governance, and financing. Public-company benchmarks such as ASML, TSMC, and Intel all maintain
              filing trails and operating metrics. Substrate does not need to look like a public issuer today, but the
              current price does require more evidence than the company has made available.


              The final diligence asks therefore focus on the missing bridge items, not on generic curiosity. Before
              underwriting the price, an investor needs the actual cap table and preference stack, customer reservation
              or pilot documents, throughput and yield data from the 300 mm tool, a bottom-up cost bridge from the
              stated $100,000 industry path to the claimed $10,000 target, and a financing plan showing how the first
              fabs are funded without assuming unlimited future dilution. Without those materials, the valuation case
              stays conceptual instead of investable.
