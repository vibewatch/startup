  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Severity-ranked placement of the major residual risks after considering only publicly evidenced mitigations.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical impact
          values:
            - CHIPS clawback breach
            - Environmental or permitting failure
            - Capital stack shortfall; full-wafer throughput or yield gap
        - label: High impact
          values:
            - Founder departure
            - Export-control supply shock; IP or FTO challenge
            - Customer qualification delay
        - label: Medium impact
          values:
            - Simulation bottleneck
            - EHS and quality readiness gap
            - Cyber or IP leakage in software stack
