      documentation.
    data:
      nodes:
        - id: interest
          label: Strategic interest
          detail: Buyer wants advanced-node capacity, supply resilience, or sovereign manufacturing optionality.
        - id: fit
          label: Architecture / process fit
          detail: Customer screens node, mask, design, and operational compatibility under NDA.
        - id: prototype
          label: Prototype enablement
          detail: Mask, shuttle, design, and engineering support reduce the first-use barrier.
        - id: qualify
          label: Qualification gate
          detail: Yield, reliability, throughput, and quality evidence determine whether the program can advance.
        - id: commit
          label: Initial program commitment
          detail: Customer signs the first real program or capacity commitment once proof becomes sufficient.
        - id: expand
          label: Expand / deepen
          detail: Account adds more chips, packaging, or multi-year planning if the first program succeeds.
      edges:
        - from: interest
          to: fit
          label: screen
        - from: fit
          to: prototype
          label: enable
        - from: prototype
          to: qualify
          label: prove
        - from: qualify
          to: commit
          label: contract
        - from: commit
          to: expand
          label: renew / add programs
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU018
      - CU021
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Substrate has buyer-theory evidence but no public customer proof; analog foundries have named, quote-backed
      references with clearer stage and outcome detail.
    data:
      columns:
        - Named customer disclosed
        - Outcome specificity
        - Production maturity
        - Retention visibility
      rows:
        - label: Substrate
          values:
            - None public
            - Low — no attributable outcome or customer quote
            - Unknown
            - None public
        - label: Microsoft on Intel
          values:
            - High — named CEO and node
            - Medium — supply rationale and design choice
            - Pre-production design win
            - Low — no renewal data
        - label: MediaTek on Intel
          values:
            - High — named customer and quote
            - Medium — multiple chips plus diversification rationale
            - Manufacturing partnership
            - Medium — explicit long-term language
        - label: Tenstorrent on Rapidus
          values:
            - High — named startup and executives
            - Medium-High — IP deal plus manufacturing project
            - Pilot / development-stage relationship
            - Medium — two-step milestone progression, no renewals
    approximationNotes: >-
      Cells rate evidence quality, not economic value. The matrix exists to compare proof quality across direct and
      analog evidence without inventing customer counts.
