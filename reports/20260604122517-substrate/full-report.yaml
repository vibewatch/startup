      - number: '1.2'
        title: Founders, leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is narrow. Outside coverage consistently names James Proud as co-founder and
              CEO and identifies Oliver Proud as his co-founder, but the companys official public pages do not surface a
              board roster, committee structure, or a broad named executive bench. That absence matters because the
              companys strategy combines frontier physics, deep manufacturing, capital-intensive scale-up, and
              government-facing positioning; a founder-led narrative can be energizing, but it also concentrates
              execution and financing risk in a small number of people.


              James Prouds biography cuts both ways for diligence. Reporting highlights his Thiel Fellowship and prior
              startup experience at Hello, which suggests fundraising fluency and a comfort with ambitious
              hardware-adjacent bets. The same reporting also notes that neither founder previously came from
              semiconductor manufacturing, raising obvious questions about how much of the actual moat resides in the
              recruited technical team rather than in the founders themselves. Public sources do show that the team has
              been assembled from major labs and chip companies, but the lack of fuller governance disclosure leaves
              key-person dependence as a live risk rather than a solved concern.
