      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The demand side is real. AI-led semiconductor sales, rising fab-equipment spending, CHIPS-backed
              reshoring, and the concentration of leading-edge logic in Taiwan all create a structural opening for
              domestic alternatives. Canon's progress in NIL and Rapidus's 2nm push also show that buyers and sponsors
              remain interested in non-status-quo paths when cost, sovereignty, or node leadership are at stake. But the
              same evidence also sharpens the reasons to be cautious on Substrate. Advanced lithography is capital
              intensive, qualification heavy, and embedded in ecosystems that incumbents already operate at industrial
              scale. Public reporting still does not establish Substrate's throughput, yield, uptime, business-model
              boundary, or customer pipeline, and Heise explicitly notes that feasibility on a reasonable timeline
              cannot yet be assessed. The chapter's diligence gap is therefore not whether the market exists. It does.
              The gap is whether Substrate can turn a credible technology thesis into a commercially qualified foundry
              path before incumbent scale, ecosystem lock-in, and funding requirements overwhelm the opportunity.
