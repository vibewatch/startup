      - number: '2.2'
        title: 'Sizing lenses: strong top-down demand, weak Substrate-specific precision'
        blocks:
          - type: paragraph
            body: >-
              The broad demand pool is unquestioned. SIA says semiconductor sales hit $791.7 billion in 2025 and are
              tracking toward roughly $1 trillion in 2026, while SEMI expects front-end fab-equipment spending to reach
              $110 billion in 2025 and $130 billion in 2026 as AI, memory, and 2nm ramps continue. The harder question
              is where to stop shrinking that stack. Public analyst views on the lithography layer are contradictory but
              still useful. Mordor pegs semiconductor lithography equipment at $27.83 billion in 2025 and $30.44 billion
              in 2026, IMARC pegs a broader lithography systems market at $10.8 billion in 2025, IMARC's
              photolithography cut is $17.1 billion, and Market Research Future lands at $11.74 billion. Those ranges
              are not a bug in the evidence; they are the evidence. Publishers are measuring different shells:
              lithography systems, photolithography equipment, or semiconductor lithography equipment. The disciplined
              conclusion is therefore not a fake TAM/SAM/SOM pyramid. It is that there is a real multibillion-dollar
              capex and equipment market, but no public source isolates a clean Substrate-specific SAM or SOM. Any
              investor model must preserve that uncertainty instead of converting it into pseudo-precision.
