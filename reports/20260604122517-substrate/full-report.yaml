      - CR031
      - CR038
      - CR040
      - CR051
  - id: FR002
    title: Risk transmission map
    type: dag
    summary: >-
      How core risks flow into schedule, financing, customer qualification, and valuation rather than staying isolated
      technical issues.
    data:
      nodes:
        - id: n1
          label: Throughput or yield gap
          detail: No public proof of fab-grade output metrics
          type: risk
        - id: n2
          label: Permitting or site delay
          detail: Fab location, utilities, and permits are undisclosed
          type: risk
        - id: n3
          label: Financing delay
          detail: External capital and incentives arrive late or not at all
          type: risk
        - id: n4
          label: Customer qualification delay
          detail: No named pilot or reservation converts into demand proof
          type: risk
        - id: n5
          label: Schedule slip
          detail: 2028 production target moves right
          type: impact
        - id: n6
          label: Capex overrun
          detail: Longer development and compliance cycles consume more cash
          type: impact
        - id: n7
          label: Utilization shortfall
          detail: Fab or tool capacity lacks qualified demand
          type: impact
        - id: n8
          label: Fundraising pressure
          detail: More capital is needed before economics are proven
          type: impact
        - id: n9
          label: Valuation downside
          detail: Option value compresses if proof points slip together
          type: impact
