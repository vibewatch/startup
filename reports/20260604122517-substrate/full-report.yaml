              proof today is still at the patterning-and-simulation layer rather than at customer delivery: Substrate
              has shown 12 nm-class single-exposure metal-pattern results and has disclosed large AlphaEvolve-assisted
              compute gains, but it has not yet published the PDK, support model, or operational playbook that an
