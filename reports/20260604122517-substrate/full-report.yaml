            body: >-
              Because Substrate itself has not published customer proof, the strongest public evidence comes from analog
              foundry relationships that show what real adoption looks like. Intel's Microsoft announcement is a clear
              design-win proof: a named hyperscaler, a quoted CEO, a named node, and an explicit supply rationale.
              Intel's MediaTek partnership shows another pattern: a customer uses a challenger foundry to diversify
              supply, commits multiple chips, and explicitly calls the relationship long term. Rapidus and Tenstorrent
              illustrate the startup-foundry version of the same arc. Their public proof did not start with a generic
              logo. It started with a dated joint-IP agreement, then moved to a dated development-and-manufacturing
              project, and industry coverage later described Tenstorrent as an early contract win. Just as important,
              incumbent foundries show that customers adopt a service system, not a bare process node. TSMC layers mask
              services, CyberShuttle prototypes, eFoundry logistics and engineering visibility, and Value Chain Alliance
              partners around the wafer relationship; Intel markets packaging, software/services, ecosystem alliances,
              and a shuttle program. Substrate may eventually offer analogous onboarding and support, but public
              evidence does not yet show those customer-facing systems. That gap is why named analog proof is useful
              here: it demonstrates the reference quality, specificity, and workflow scaffolding that buyers usually
              demand before they commit serious silicon programs to a new manufacturing platform.
