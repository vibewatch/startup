      - number: '3.3'
        title: Switching costs, lock-in, distribution power, and supply access
        blocks:
          - type: paragraph
            body: >
              The strongest incumbent moat is not just better optics or more fabs; it is the installed network of
              service engineers, qualification history, software flows, packaging partners, and procurement habits that
              sits around the current tool chain. ASML’s EUV history, Nikon’s global support network, TSMC’s 534
              customers and 17 million 12-inch-equivalent-wafer capacity, and Intel Foundry’s packaging-and-test stack
              all point to the same structural advantage: buyers can stay inside a known ecosystem and still reach
              advanced-node output. That matters because advanced fabs adopt new lithography only when uptime,
              defectivity, overlay, and cost curves are all proven. Canon’s own public NIL roadmap and IEEE’s discussion
              of contamination and throughput hurdles show that even a credible adjacent alternative still has to earn
              its place inside existing workflows.


              These switching costs cut two ways for Substrate. If the company works, customers that want a domestically
              oriented leading-edge alternative could value an integrated stack more than another point product. But the
              qualification burden on the first buyer is heavier than it is for Canon or xLight, because Substrate is
              not proposing to slide into an existing fab as one component supplier. It is asking buyers to believe in a
              new light source, a new exposure architecture, and a new foundry operating model simultaneously.
              Multi-homing is therefore easier for tool-layer adjacencies than for Substrate’s full-stack thesis. A fab
              can evaluate NIL or a better EUV light source without abandoning the rest of its process stack, but
              adopting Substrate implies deeper process, vendor, and supply-chain change. That dynamic makes the status
              quo and near-form substitutes stronger than headline comparisons to “ASML replacement” alone would
              suggest.
            claimRefs:
