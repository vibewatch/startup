companyProfile:
  summary: >-
    Substrate is a San Francisco startup founded in 2022 by brothers James and Oliver Proud. The company is attempting
    to build a next-generation U.S. semiconductor foundry that uses particle accelerators to generate X-rays for
    advanced lithography, rather than selling only standalone equipment into the existing fab ecosystem. Public
    reporting says Substrate has disclosed more than $100 million of funding at about a $1 billion valuation, employs
    around 50 people from semiconductor and advanced-manufacturing backgrounds, and is targeting first chip production
    in 2028. Public proof today is still pre-commercial: the company has shown patterning demos and April 2026
    computational-lithography gains, but it has not publicly disclosed customers, revenue, or a fully underwritten
    fab-financing plan.
