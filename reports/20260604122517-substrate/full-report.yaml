  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Throughput and yield proof stays private
        - No independent wafers-per-hour, uptime, or defectivity evidence by the next financing event.
        - The low-cost wafer thesis cannot be underwritten without production-quality proof.
        - Do not add capital on headline technology narrative alone.
      - - Anchor-customer evidence does not appear
        - No disclosed reservation, pilot contract, or strategic offtake despite tool progress.
        - The valuation stays a technology option rather than a commercial platform.
        - Require customer documents before underwriting the current mark.
      - - Fab financing remains vague
        - No credible stack of debt, government support, and equity aligned to first-fab buildout.
        - Many-billions capex risk transmits directly into dilution or project delay.
        - Assume down-round risk and re-rate the thesis lower.
      - - Alternative peers move faster inside existing ecosystems
        - Canon NIL or xLight-style alternatives gain proof sooner than Substrate's integrated model.
        - The differentiation story shrinks while incumbents keep the rest of the stack.
        - Reset moat assumptions and demand a lower entry price.
      - - Cost bridge cannot be reconciled
        - >-
          Management cannot show how the $10,000 wafer target follows from throughput, yield, and depreciation
          assumptions.
        - The price-support narrative loses its core economic claim.
        - Treat valuation as stretched regardless of technical novelty.
      - - Disclosure quality remains thin into a later-stage round
        - Cap table, governance, and operating metrics remain materially less transparent than later-stage peers.
        - Exit readiness stays low and public-market comparability remains weak.
        - Keep the recommendation at research-more or worse.
    notes: >-
      Triggers are monitorable events that would break the underwriting bridge from private narrative to investable
      valuation, not generic startup risks.
