  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      For Substrate, the most plausible buyer journey runs from strategic interest in sovereign or AI capacity to
      prototype enablement, qualification, first program commitment, and only then account expansion.
    approximationNotes: >-
      This journey map is inferred from incumbent and challenger foundry workflows because Substrate has not published
      an actual customer journey.
    data:
      items:
        - label: Recognize strategic need
          actor: Hyperscaler, AI startup, or sovereign program sponsor
          touchpoints:
            - supply-resilience need
            - AI compute demand
            - domestic manufacturing thesis
          painpoint: Incumbent leading-edge supply is concentrated and difficult for newcomers to access.
          opportunity: >-
            Substrate's domestic, vertically integrated foundry story is easiest to hear where sovereignty and
            advanced-AI capacity matter.
        - label: Screen technical fit
          actor: Silicon architecture and manufacturing team
          touchpoints:
            - technical review
            - NDA
            - process / design-fit discussion
          painpoint: A buyer cannot commit without understanding node fit, mask assumptions, and workflow compatibility.
          opportunity: Analog proofs show that named commitments happen only after the process story becomes concrete.
        - label: Prototype enablement
          actor: Design enablement, mask, and process teams
          touchpoints:
            - MPW or shuttle logic
            - mask preparation
            - engineering support
          painpoint: Prototype NRE and design-transfer friction are major barriers for new entrants.
          opportunity: TSMC shows that shuttles, mask services, and alliance partners can dramatically lower first-use friction.
        - label: Qualification and reliability
          actor: Process integration and quality owner
          touchpoints:
            - yield
            - reliability
            - throughput
            - quality data
          painpoint: This is where adoption usually stalls if the foundry cannot prove industrial readiness.
          opportunity: Substrate could become credible quickly if it can share customer-grade qualification metrics.
        - label: First committed program
          actor: Silicon procurement lead
          touchpoints:
            - capacity reservation
            - commercial terms
            - reference checks
          painpoint: Buyers need confidence in supply, timing, and service boundaries before signing.
          opportunity: >-
            Microsoft / Intel, MediaTek / Intel, and Tenstorrent / Rapidus show that named wins can arrive before mass
            production.
        - label: Expand or renew
          actor: Executive sponsor
          touchpoints:
            - more product programs
            - packaging / support add-ons
            - multi-year planning
          painpoint: Substrate has no public renewal proof, so the last stage is hypothetical today.
          opportunity: >-
            If the first program works, expansion would likely follow the same design-to-production stack incumbents
            use.
    claimRefs:
