      - number: '2.3'
        title: Buyer, user, payer, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              The likely first economic buyers are organizations that need leading-edge wafer access or domestic foundry
              optionality: fabless AI chip companies, hyperscalers building custom silicon, government-backed programs,
              and possibly incumbent fabs evaluating partnership routes. The day- to-day users are engineering
              specialists—design enablement teams, lithography engineers, process integration leads, mask teams, and
              packaging organizations—because advanced manufacturing adoption is technical long before it is commercial.
              The payer is likewise not a seat-based software budget; it is a silicon procurement budget, a fab capex
              committee, or a public-program award. TSMC's mask and CyberShuttle services, Intel's
              foundry-plus-packaging model, and Mordor's foundry-heavy end-user mix all imply the same adoption
              sequence: get pilot wafers, enable the design flow, prove overlay and yield, demonstrate reliability, then
              convert to a long-term wafer or capacity commitment. That sequence matters for Substrate because it
              explains why early R&D or consortium proof is not the same as commercial volume and why the market can be
              attractive even while near-term revenue remains hard to underwrite.
