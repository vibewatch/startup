  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call follows a simple chain: credible strategic thesis plus real capital access, minus missing operating proof
      and a financing gap that is still measured in many billions.
    data:
      nodes:
        - id: price
          label: Current price signal
          detail: '> $100M raised at about or above a $1B valuation.'
          tone: warning
        - id: thesis
          label: Strategic upside
          detail: >-
            Lower-cost X-ray lithography plus a U.S.-anchored vertically integrated foundry could matter if the stack
            works.
          tone: positive
        - id: proof
          label: Operating proof gap
          detail: No public revenue, customer, backlog, throughput, or realized pricing disclosure yet.
          tone: warning
        - id: comps
          label: Comparable context
          detail: >-
            Public incumbents have huge market values because they already pair scale with filings and operating
            disclosure.
          tone: neutral
        - id: finance
          label: Financing burden
          detail: >-
            Management says scaling fabs may require many billions and potentially tens or hundreds of billions of
            dollars.
          tone: negative
        - id: decision
          label: Research-more / stretched
          detail: The thesis is credible, but today's price is not publicly underwritten like a de-risked operating business.
          tone: neutral
      edges:
        - from: price
          to: decision
        - from: thesis
          to: decision
        - from: proof
          to: decision
        - from: comps
          to: decision
        - from: finance
          to: decision
    approximationNotes: >-
      This is a logical underwriting chain, not a quantitative model. It summarizes how the cited evidence transmits
      into the recommendation.
    claimRefs:
      - CV005
      - CV009
      - CV035
      - CV036
      - CV045
      - CV048
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Milestone evidence matters more than spreadsheet precision: a better price or stronger proof can move the
      supported range quickly.
    data:
      items:
        - label: Delayed qualification / financing stress
          value: 0.3
          detail: If customer proof and financing both lag, public support can compress into clear down-round territory.
          tone: negative
        - label: Pilot proof only
          value: 0.8
          detail: Technical progress without demand disclosure still struggles to support a premium above the current mark.
          tone: warning
        - label: Current private round reference
          value: 1
          detail: The reported mark already assumes more future proof than public sources currently show.
          tone: warning
        - label: Throughput proof + anchor customer
          value: 1.5
          detail: Commercial validation starts to justify paying above the current mark.
          tone: positive
        - label: Throughput proof + customer + funded first fab
          value: 2.2
          detail: A credible financing bridge would move the company from narrative to platform underwriting.
          tone: positive
        - label: Production-qualified integrated platform path
          value: 3
          detail: Only a much later proof state supports a materially richer valuation from public-style evidence.
          tone: positive
    approximationNotes: >-
      Values are directional valuation waypoints in USD billions inferred from the scenario logic, current private mark,
      and benchmark set; they are not management guidance.
    claimRefs:
      - CV005
      - CV030
      - CV031
      - CV041
      - CV042
      - CV043
      - CV049
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The wide spread between bear, base, bull, and the current mark reflects how much of the underwriting still depends
      on future milestone proof.
    data:
      items:
        - label: Bear case
          low: 0.2
          mid: 0.4
          high: 0.6
          displayValue: $0.2B-$0.6B
          detail: Qualification or financing slips and the next round clears below the current mark.
          tone: negative
        - label: Base case
          low: 0.8
          mid: 1
          high: 1.2
          displayValue: $0.8B-$1.2B
          detail: Tool proof improves, but customer and fab-financing evidence remain incomplete.
          tone: warning
        - label: Bull case
          low: 1.5
          mid: 2
          high: 2.5
          displayValue: $1.5B-$2.5B
          detail: Technical proof, customer validation, and credible financing all arrive before the next major round.
          tone: positive
        - label: Current round reference
          low: 0.95
          mid: 1
          high: 1.05
          displayValue: ~$1.0B
          detail: The known private mark is already at the top of the public-only base case.
          tone: neutral
    approximationNotes: >-
      Ranges are scenario-based valuation judgments in USD billions, constructed because public evidence does not
      support a DCF or revenue-multiple model for Substrate today.
    claimRefs:
      - CV005
      - CV041
      - CV042
      - CV043
      - CV048
      - CV049
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      The company scores well on ambition and strategic relevance, but poorly on disclosure, financing sufficiency, and
      current valuation support.
    data:
      items:
        - label: Market need
          value: 8
          unit: /10
          detail: Geopolitics and AI demand create real pressure for more advanced-chip capacity.
          tone: positive
        - label: Technical ambition
          value: 8
          unit: /10
          detail: The company is attempting a genuinely non-trivial change to source physics and fab integration.
          tone: positive
        - label: Customer proof
          value: 2
          unit: /10
          detail: No public customer, backlog, or reservation evidence is disclosed.
          tone: negative
        - label: Economics visibility
          value: 2
          unit: /10
          detail: No public revenue, realized pricing, or throughput-backed cost bridge exists.
          tone: negative
        - label: Financing sufficiency
          value: 2
          unit: /10
          detail: Current funding is tiny relative to the many-billions buildout the company describes.
          tone: negative
        - label: Disclosure quality
          value: 3
          unit: /10
          detail: Public-company-style filing and KPI depth is absent at a price that increasingly demands it.
          tone: warning
        - label: Entry-price attractiveness
          value: 3
          unit: /10
          detail: The current mark looks stretched until proof or price changes materially.
          tone: warning
    approximationNotes: >-
      Scores are ordinal investment-committee judgments anchored to the cited evidence, not company-reported KPI
      disclosures.
    claimRefs:
      - CV005
      - CV009
      - CV035
      - CV036
      - CV046
      - CV047
      - CV048
