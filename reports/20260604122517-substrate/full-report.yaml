  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and taxonomy
        blocks:
          - type: paragraph
            body: >
              Substrate should not be benchmarked against only one company, because its public ambition spans multiple
              layers of the semiconductor stack at once. At the exposure-tool layer, ASML is the dominant incumbent in
              industrialized EUV lithography, Canon is pushing nanoimprint lithography as a lower-cost alternative, and
              Nikon remains a long-standing precision-equipment supplier with a global semiconductor-service footprint.
              At the foundry layer, TSMC is the status-quo substitute with unmatched customer scale and current 2 nm
              production, Intel Foundry is the main U.S.-anchored incumbent alternative with packaging and test bundled
              into its offer, and Rapidus is a government- and partnership-backed entrant trying to stand up a 2 nm
              logic foundry in Japan. xLight is the closest adjacent technology challenger because it also argues that
              particle-accelerator-derived free electron lasers can reset advanced lithography economics.


              That taxonomy matters because different rivals threaten different parts of Substrate’s thesis. ASML and
              TSMC represent the default procurement path for buyers that want leading-edge chips without changing
              exposure physics. Canon and xLight attack the cost and energy story that Substrate also markets, but they
              do so one layer at a time: Canon swaps the pattern-transfer mechanism while xLight targets the EUV light
              source. Rapidus is important because it shows that a new foundry entrant can use industry-standard
              partnerships and standard-node language instead of asking customers to underwrite a completely new process
              stack. The practical result is that Substrate’s differentiation is integration, not competitive isolation:
              it is unusual mainly because it combines a new source, a new lithography architecture, and a new foundry
              ambition in one program.
