  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and policy-gated risk
        blocks:
          - type: paragraph
            body: >-
              The first-ranked non-technical risk is that Substrate’s domestic-foundry thesis is inseparable from U.S.
              regulatory and legal process. A company that wants to move from a promising 300 mm lithography
              demonstration to a funded fab needs more than physics: it needs CHIPS-eligible project structure, air and
              waste permits, utility approvals, hazardous-material controls, occupational radiation procedures, and a
              site plan that can survive environmental review. Public materials show none of those company-specific
              workstreams yet. That absence matters because CHIPS support is conditional rather than automatic, and the
              public rule set is tighter than a generic grant program. The CHIPS Act text, guardrail commentary, and
              Commerce materials all point to a 10-year restriction on material expansion in foreign countries of
              concern, with cleanroom-space changes and technology or joint-research issues explicitly inside the
              compliance perimeter.


              Export controls add a second policy layer. BIS’s December 2024 package expanded controls across
              semiconductor manufacturing equipment and software tools, showing that the relevant vendor ecosystem
              remains compliance sensitive even for a U.S.-based startup. On top of that, NIST’s environmental
              assessment and EPA’s semiconductor air-toxics rule show that fab buildout is tied to air quality,
              hazardous materials, waste, water, and health-and-safety review. The regulatory verdict is therefore
              severity-high not because Substrate has disclosed a violation, but because the public record does not yet
              show the site, permits, required agreement, or IP clearance that would de-risk the move from tool to
              factory.
            claimRefs:
