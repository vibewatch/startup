  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitute stack
        blocks:
          - type: paragraph
            body: >-
              Substrate should be analyzed against a narrow stack of spending, not against all semiconductor demand. The
              company presents itself as a vertically integrated foundry built around advanced X-ray lithography, so the
              included spend is leading-edge wafer supply, process enablement, mask and prototype services, and the
              advanced lithography capex needed to produce those wafers. The excluded spend is broad semiconductor end
              demand that never touches leading-edge manufacturing choices, plus generic electronics, software, or
              test-only budgets. The status quo substitute is not a single competing startup. It is an incumbent chain:
              ASML's EUV and DUV tools, TSMC's and Intel's foundry ecosystems, Nikon's immersion and packaging tools,
              and Canon's lower-cost nanoimprint route. Public sources also show why that substitute chain is sticky.
              ASML notes that even advanced chips still rely on many DUV layers, TSMC frames masks and shuttles as
              interfaces between designers and fabs, and Intel bundles packaging and ecosystem support into its foundry
              offer. That means a buyer switching to Substrate would be changing a whole production pathway, not merely
              replacing one scanner.
