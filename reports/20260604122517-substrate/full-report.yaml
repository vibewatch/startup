      - number: '1.3'
        title: Capital base, investor map, and metric visibility
        blocks:
          - type: paragraph
            body: >-
              The clearest public financing fact is the late-2025 disclosure of more than $100 million raised at roughly
              a $1 billion valuation. Multiple outlets converge on the core investor set: Founders Fund, General
              Catalyst, Allen & Co., Long Journey Ventures, Valor Equity Partners, and In-Q-Tel. General Catalyst adds
              an important nuance by saying it actually entered at seed more than three years earlier, implying a
              longer, quieter development period than the public unveiling suggested. What remains missing is just as
              important: a reconciled early-round chronology, exact total capital raised before the disclosed round,
              ownership percentages, and any debt or project-finance structure that will be required if the company
              tries to progress from a promising tool effort to real fab build-out.


              Metric visibility is still thin. Public materials are rich on mission and technical ambition but sparse on
              investor-grade operating data: no disclosed revenue, ARR, customer count, or detailed facility footprint,
              and no evidence of a public cap table or board governance package. This means the chapter can anchor on
              funding, valuation, headcount, and disclosed ambition, but not on commercial traction or financial
              quality. In practical terms, the investor map is easier to establish than the business metrics investors
              would normally underwrite.
