      - number: '8.2'
        title: Comparable set and whether public evidence supports the current price
        blocks:
          - type: paragraph
            body: >
              Public comparables help frame the price even though none is a perfect match. ASML, TSMC, and Intel show
              what public markets reward when advanced-node manufacturing capability is already proven and continuously
              disclosed. ASML's annual-report and SEC trail show a lithography leader with €32.7 billion of 2025 net
              sales, a 20-F filing trail, and a June 2026 market cap above $665 billion. TSMC's official pages show N2
              in volume production, 534 customers, and more than 17 million 12-inch-equivalent wafers of annual
              capacity, alongside a June 2026 market cap above $2.2 trillion. Intel Foundry adds a domestic benchmark
              for a bundled manufacturing offer that already includes packaging and test. None of those benchmarks makes
              Substrate's $1 billion mark look large in absolute terms, but they do show how much public proof sits
              behind far larger values.


              The adjacent reference set is more uncomfortable for Substrate's current valuation. Canon already markets
              a lower-cost nanoimprint path and xLight has already disclosed both a $40 million Series B and a $150
              million CHIPS award for a free-electron-laser prototype. Those references imply that lower-cost or
              alternative-source narratives are not unique. Taken together, the comp set does not make $1 billion look
              impossible, but it does make the price look ahead of public evidence: Substrate still has not shown the
              revenue, customer, throughput, or financing disclosures that would make the current mark look obviously
              cheap.
