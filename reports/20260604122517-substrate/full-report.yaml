      - number: '1.4'
        title: Milestones, government touchpoints, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Even with sparse commercial disclosure, a usable chronology does emerge. The company appears to have been
              founded in 2022, backed quietly at seed by General Catalyst, and to have completed its now-disclosed >$100
              million round before the public unveiling. By March 2025, Vice President JD Vance had reportedly met with
              James Proud, showing that the story had already crossed into policy and national-security interest. Public
              launch coverage in October 2025 then tied together the investor syndicate, the 2028 production target, and
              the proposition that Substrate could lower both tool and wafer economics while helping onshore advanced
              manufacturing.


              The strongest dated technical milestone is the April 7, 2026 “Information to Atoms” post, which pairs
              AlphaEvolve-assisted simulation gains with concrete print examples. That said, the adverse record matters.
              Independent coverage repeatedly flags the same bottleneck: printing impressive patterns is not the same
              thing as proving high-throughput, full-wafer, economically reliable manufacturing. Heise also notes the
              limited technical disclosure and lack of a concrete commercial timeline. The result is a chapter with a
              real milestone spine and real outside skepticism at the same time — exactly the profile of a potentially
              important but still highly execution-sensitive deep-tech company.
