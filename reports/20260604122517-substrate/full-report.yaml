      - number: '7.3'
        title: Dependency, financing, and market-entry risk
        blocks:
          - type: paragraph
            body: >-
              Financial and dependency risk is the most thesis-breaking part of the stack because Substrate’s strategy
              compounds several hard problems at once. Public reporting says the company has raised more than $100
              million at roughly a $1 billion valuation. That is meaningful startup capital, but it is tiny relative to
              the economics Substrate itself and outside reporting describe. The company’s own purpose page puts
              leading-edge fab cost at roughly $25 billion today and above $50 billion by 2030, while TechSpot and China
              Strategy quote ambitions that could eventually require many billions and perhaps tens or hundreds of
              billions across multiple facilities. Even generous CHIPS support does not change the order of magnitude;
              public programs are milestone-based and incomplete, not a substitute for a full capital stack.


              The business model also creates concentration on both the supply and demand side. Data Center Dynamics
              says Substrate wants its own fab network rather than a pure tool sale, which means dependency on site,
              utilities, permitting, equipment vendors, software vendors, and future external financiers all arrives
              before scaled revenue. Sacra’s buyer framing suggests the first commercial set is likely a small
              population of advanced manufacturers, defense-linked programs, and later foundries, not a broad market
              with short sales cycles. Meanwhile, the public record still does not disclose revenue, backlog, named
              pilots, or signed customer commitments. The resulting risk transmission is straightforward: if customer
              qualification lags while capex and permitting continue, Substrate faces a financing squeeze before it can
              prove durable market pull.
