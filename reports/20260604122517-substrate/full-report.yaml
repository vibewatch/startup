      - number: '3.2'
        title: Capability, pricing, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >
              The capability gap between Substrate and incumbents is less about whether alternative lithography concepts
              exist and more about whether they are proven at the throughput, overlay, and qualification levels required
              by advanced fabs. ASML already sells industrialized EUV tools, and its latest High-NA systems are reported
              at up to roughly $400 million each, which underscores both the extraordinary cost of the status quo and
              the scale of the incumbent capital base. Canon’s NIL system is conceptually disruptive because it avoids a
              special-wavelength light source, targets advanced linewidths, and claims lower energy use and lower cost
              of ownership, but its own public roadmap still centers on future contamination, throughput, and overlay
              milestones. xLight similarly promises a more powerful and efficient EUV light source, yet its public
              evidence is still prototype funding and a CHIPS award rather than fab deployment.


              On the foundry side, TSMC and Intel Foundry compete with Substrate not by replacing lithography physics,
              but by selling manufacturing outcomes. TSMC’s N2 node is already in volume production and is paired with a
              customer base, wafer capacity, and packaging ecosystem that radical entrants do not match. Intel Foundry
              positions 18A, 2D/2.5D/3D packaging, and wafer-shuttle prototyping as a systems foundry package, while
              Rapidus pitches a future 2 nm manufacturing cycle built on IBM-derived process know-how. Public price
              signals reinforce the asymmetry. TSMC 2 nm wafers are already discussed in the market at around $30,000,
              ASML High-NA tool pricing is publicly visible at the hundreds-of-millions level, and Canon has publicly
              framed NIL as materially cheaper than EUV. By contrast, Substrate, Intel Foundry, Rapidus, and xLight
              still disclose little about realized commercial pricing, which implies negotiated enterprise selling
              rather than a broadly standardized catalogue.
