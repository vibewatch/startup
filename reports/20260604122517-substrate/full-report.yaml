      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >
              Scenario work for Substrate should be milestone-based, not DCF-based, because public evidence does not
              disclose current revenue, gross margin, utilization, or customer commitments. The bull case therefore
              requires three linked events: independent proof that the in-house 300 mm tool can deliver credible
              throughput and yield, anchor-customer or government-backed demand that converts technical progress into
              commercial validation, and a financing stack that bridges from R&D scale to fab scale at meaningfully
              lower capital intensity than the status quo. If those milestones land, today's price could prove
              conservative because the market would start valuing a differentiated domestic manufacturing platform
              rather than a speculative lithography startup.


              The base case is flatter. In that path, Substrate continues proving technology and raising capital, but
              still reaches the next financing event before disclosing customer reservations, realized pricing, or a
              fully funded fab plan. The current mark can hold in that world, but it is hard to expand on public
              evidence alone. The bear case is easier to defend publicly: if qualification slips, financing stays vague,
              or adjacent alternatives progress faster inside existing fabs, the company could face a materially lower
              next-round clearing price. That is why the return range is wide even though the headline private valuation
              is already known.
