      - number: '8.4'
        title: Recommendation, confidence, risk rating, and monitoring logic
        blocks:
          - type: paragraph
            body: >
              The public-only recommendation is research-more. The long-form thesis is real: there is genuine
              geopolitical and cost pressure for a U.S.-anchored alternative to today's ASML-plus-TSMC stack, and
              Substrate has attracted credible investors around that idea. But the recommendation has to be
              price-sensitive. At roughly $1 billion, the company is already asking investors to pay for a future state
              in which the tool works at scale, demand appears, and multibillion-dollar financing closes. Public
              evidence still leaves the underwriting bridge between those steps mostly blank.


              That drives the rest of the rating stack. Confidence is medium because the financing context, benchmark
              set, and core technical narrative are legible from open sources, but the decisive evidence for
              valuation—throughput, yield, customers, pricing, and capital structure—remains private. Risk is high
              because the company is simultaneously attempting a new source architecture, a new foundry model, and a
              capital program management itself says could expand into the many-billions range. The right way to monitor
              the story is not with generic founder or market enthusiasm, but with explicit thesis-break triggers tied
              to proof, financing, and customer adoption.
            claimRefs:
