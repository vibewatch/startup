  productSummary: >-
    Substrate is building a vertically integrated semiconductor platform comprising advanced X-ray lithography tools,
    computational-lithography software, and future U.S.-based fabs. Its disclosed approach uses RF cavities,
    relativistic electron beams, magnetic fields, optics, and high-speed wafer-stage mechanics to achieve
    High-NA-EUV-class patterning, with April 2026 results highlighting 12 nm critical-dimension printing and
    AlphaEvolve- accelerated lithography simulation improvements.
  customerFocus: >-
