evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Named board members, observer rights, committee structure, and any non-founder executive roster beyond the
      publicly visible founder-led narrative.
    whyItMatters: >-
      Governance depth and board composition are necessary to assess founder control, succession resilience, and whether
      investors have meaningful oversight rights.
    diligencePath: >-
      Request a current org chart, board list, and investor rights documentation from management; cross-check Delaware
      corporate records and any financing counsel memos.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: >-
      A reconciled financing chronology covering seed timing, round amounts, investor ownership, and any secondary
      activity before the publicly disclosed >$100 million round.
    whyItMatters: >-
      Open-source market-data products disagree on early rounds, so total raised and dilution cannot be independently
      reconciled from public evidence alone.
    diligencePath: >-
      Request the cap table, stock ledger, and financing closing set; reconcile against market-data vendors and investor
      announcements.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: >-
      Recognized revenue, ARR, customer count, customer names, booked backlog, and any production contracts or tool
      reservations.
    whyItMatters: >-
      Without commercial metrics, the chapter can assess ambition and technical proof points but not actual customer
      traction or financial maturity.
    diligencePath: >-
      Request management accounts, pipeline detail, signed customer agreements, and any internal KPI deck used with
      investors.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: future-capital-stack
    missingEvidence: >-
      Any committed debt facilities, government support instruments, or strategic financing terms beyond broad press
      descriptions of future capital needs.
    whyItMatters: >-
      The companys scale ambition likely depends on non-dilutive or project-style financing; without terms, future
      dilution and balance-sheet risk are unknowable.
    diligencePath: >-
      Request financing plan materials, lender term sheets, CHIPS-style program applications, and any strategic investor
      MOUs.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Publicly supportable segmentation of Substrate's serviceable and obtainable market by customer type, wafer starts,
      and revenue model.
    whyItMatters: >-
      Without a company-specific SAM or SOM, valuation models can overfit broad industry TAMs that Substrate may never
      actually serve.
    diligencePath: >-
      Request management's internal market model with customer buckets, expected wafer volumes, and the split between
      foundry revenue and any tool or licensing revenue.
    relatedQuestionRefs:
      - QM007
      - QM008
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: throughput-and-yield
    missingEvidence: >-
      Verified wafers-per-hour, defect density, uptime, and yield metrics for Substrate's production-intent 300mm tool
      chain.
    whyItMatters: >-
      Cost claims are not decision-useful unless the company can also prove industrial throughput and production-grade
      reliability.
    diligencePath: >-
      Request pilot-line KPI dashboards, wafer-start history, benchmark comparisons versus EUV or immersion
      alternatives, and third-party validation from customers or consortium partners.
