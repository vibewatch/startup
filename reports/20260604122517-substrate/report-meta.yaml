companyProfile:
  summary: >-
    Substrate is a San Francisco startup founded in 2022 by brothers James and Oliver Proud.
    The company is attempting to build a next-generation U.S. semiconductor foundry that uses
    particle accelerators to generate X-rays for advanced lithography, rather than selling only
    standalone equipment into the existing fab ecosystem. Public reporting says Substrate has
    disclosed more than $100 million of funding at about a $1 billion valuation, employs around
    50 people from semiconductor and advanced-manufacturing backgrounds, and is targeting first
    chip production in 2028. Public proof today is still pre-commercial: the company has shown
    patterning demos and April 2026 computational-lithography gains, but it has not publicly
    disclosed customers, revenue, or a fully underwritten fab-financing plan.
  foundedDate: '2022-01-01'
  founders:
    - name: James Proud
      role: Co-Founder & CEO
      background: >-
        Thiel Fellow and prior founder of Hello; public coverage describes him as the
        founder-facing leader for capital raising, mission framing, and government outreach.
      claimRefs: [CO004, CO005, CO026, CO027, CO031]
    - name: Oliver Proud
      role: Co-Founder
      background: null
      claimRefs: [CO004]
  foundingLocation: San Francisco, CA, USA
  headquarters: San Francisco, CA, USA
  productSummary: >-
    Substrate is building a vertically integrated semiconductor platform comprising advanced
    X-ray lithography tools, computational-lithography software, and future U.S.-based fabs.
    Its disclosed approach uses RF cavities, relativistic electron beams, magnetic fields,
    optics, and high-speed wafer-stage mechanics to achieve High-NA-EUV-class patterning,
    with April 2026 results highlighting 12 nm critical-dimension printing and AlphaEvolve-
    accelerated lithography simulation improvements.
  customerFocus: >-
    Intended buyers appear to include fabless AI chip companies, defense or national-security
    programs, national-laboratory style users, and eventually broader advanced-chip customers
    seeking domestic leading-edge wafer supply; no public paying-customer roster is disclosed.
  businessModel: >-
    Management's public narrative points to a foundry-services model rather than only tool sales:
    Substrate intends to use its own lithography technology inside future fabs and monetize lower-
    cost domestic advanced-wafer production, potentially supplemented by government support,
    strategic capital, and ecosystem partnerships.
  stage: early-stage private
  fundingStatus: >-
    Public reporting and investor commentary indicate more than $100 million of disclosed funding
    at roughly a $1 billion valuation. Open sources do not reliably reconcile prior seed chronology,
    cap-table structure, preferences, debt terms, or the full eventual financing stack required for
    commercial fabs.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO017, CO023, CO031, CO037, CE001, CE003, CE007, CE015]
summary:
  headline: >-
    Substrate is pursuing a bold and strategically relevant U.S. lithography-and-foundry thesis,
    but the current public record still supports only a medium-confidence research-more stance:
    the company has fundraising momentum and intriguing technical signals, yet lacks customer,
    throughput, yield, and financing proof commensurate with its roughly $1 billion valuation.
  overallScore: 5.1
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 100
    customerCount: null
    headcount: 50
  topStrengths:
    - >-
      The company is attacking one of the most strategically important bottlenecks in advanced
      semiconductors: lithography and domestic leading-edge fabrication capacity.
    - >-
      Official materials and the April 2026 technical post provide more concrete technical proof
      than a typical stealth deep-tech startup, including 300 mm tooling claims, 12 nm patterning,
      and materially faster computational lithography.
    - >-
      The investor syndicate and policy alignment suggest Substrate can access attention,
      introductions, and potentially non-dilutive support that most hardware startups cannot.
  topRisks:
    - >-
      Scaling from promising patterning demonstrations to high-throughput, high-yield, commercial
      wafer production remains unproven and is the single biggest technical risk.
    - >-
      The vertically integrated foundry ambition implies capital needs in the many-billions range,
      far beyond the currently disclosed equity base.
    - >-
      No public customer, revenue, backlog, or reservation proof is available, so commercial demand
      remains largely thesis-driven rather than evidenced.
    - >-
      The business is founder-centric and still thinly disclosed on governance, bench depth,
      preferences, debt structure, and execution controls.
  unresolvedGaps:
    - >-
      Public sources do not disclose wafers per hour, overlay, uptime, yield, or defect-density data
      for Substrate's 300 mm tool, leaving manufacturability unresolved.
    - >-
      No paying customers, capacity reservations, letters of intent, or qualified pilot programs are
      publicly named as of the run date.
    - >-
      The eventual financing stack for commercial fabs—including debt, project finance, grants,
      customer prepayments, and dilution terms—remains undisclosed.
    - >-
      Open sources do not reconcile Substrate's pre-disclosure seed history, board structure,
      preference stack, or formal governance controls well enough for late-stage underwriting.
