schemaVersion: report-v2
artifact: valuation
slug: substrate
runDate: '2026-06-04'
company:
  name: Substrate
chapter:
  number: 8
  title: Valuation
  summary: >-
    Substrate's reported >$100 million financing at roughly a $1 billion valuation buys exposure to a potentially consequential domestic lithography-and-foundry thesis, but public evidence still shows no revenue, customer, throughput, or financing proof commensurate with the capital intensity management itself describes. Compared with public incumbents and adjacent alternative-patterning references, the current price reads as option value on milestone success rather than an evidence-backed bargain, so the public-only call is research-more with medium confidence, high risk, and a stretched valuation stance.
sections:
  - id: financing-context-and-price-sensitive-thesis
    title: Financing context, investment thesis, and anti-thesis
    body: |
      Substrate's current public price signal is a private round mark, not an operating multiple. Multiple outlets reported that the company raised more than $100 million at about or above a $1 billion valuation, while the company and investor materials frame the use of that capital around a vertically integrated U.S. manufacturing ambition rather than a narrow point-tool business. The optimistic reading is clear: if Substrate can actually move leading-edge wafers toward its stated $10,000 target and reach mass production around 2028, it could own both the enabling lithography step and a larger share of manufacturing economics than a conventional equipment supplier.

      The anti-thesis is equally important at this entry price. Public evidence still does not disclose revenue, customer count, backlog, or realized wafer pricing, and management itself has said long-run scale could require many billions, potentially tens or hundreds of billions of dollars, as multiple facilities are built. That means the present mark is being asked to bridge an unusually large gap between early technical proof and eventual industrialization. At $1 billion, investors are not underwriting a disclosed operating business; they are underwriting a future proof stack that still needs customer qualification, financing, and process data.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV007, CV009, CV036, CV037, CV041, CV045, CV047, CV048]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: comparable-set-and-public-price-support
    title: Comparable set and whether public evidence supports the current price
    body: |
      Public comparables help frame the price even though none is a perfect match. ASML, TSMC, and Intel show what public markets reward when advanced-node manufacturing capability is already proven and continuously disclosed. ASML's annual-report and SEC trail show a lithography leader with €32.7 billion of 2025 net sales, a 20-F filing trail, and a June 2026 market cap above $665 billion. TSMC's official pages show N2 in volume production, 534 customers, and more than 17 million 12-inch-equivalent wafers of annual capacity, alongside a June 2026 market cap above $2.2 trillion. Intel Foundry adds a domestic benchmark for a bundled manufacturing offer that already includes packaging and test. None of those benchmarks makes Substrate's $1 billion mark look large in absolute terms, but they do show how much public proof sits behind far larger values.

      The adjacent reference set is more uncomfortable for Substrate's current valuation. Canon already markets a lower-cost nanoimprint path and xLight has already disclosed both a $40 million Series B and a $150 million CHIPS award for a free-electron-laser prototype. Those references imply that lower-cost or alternative-source narratives are not unique. Taken together, the comp set does not make $1 billion look impossible, but it does make the price look ahead of public evidence: Substrate still has not shown the revenue, customer, throughput, or financing disclosures that would make the current mark look obviously cheap.
    claimRefs: [CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV029, CV030, CV031, CV032, CV035, CV038, CV039, CV040]
    tableRefs: [TV004]
    figureRefs: [FV002]
  - id: bull-base-bear-scenarios
    title: Bull, base, and bear scenarios
    body: |
      Scenario work for Substrate should be milestone-based, not DCF-based, because public evidence does not disclose current revenue, gross margin, utilization, or customer commitments. The bull case therefore requires three linked events: independent proof that the in-house 300 mm tool can deliver credible throughput and yield, anchor-customer or government-backed demand that converts technical progress into commercial validation, and a financing stack that bridges from R&D scale to fab scale at meaningfully lower capital intensity than the status quo. If those milestones land, today's price could prove conservative because the market would start valuing a differentiated domestic manufacturing platform rather than a speculative lithography startup.

      The base case is flatter. In that path, Substrate continues proving technology and raising capital, but still reaches the next financing event before disclosing customer reservations, realized pricing, or a fully funded fab plan. The current mark can hold in that world, but it is hard to expand on public evidence alone. The bear case is easier to defend publicly: if qualification slips, financing stays vague, or adjacent alternatives progress faster inside existing fabs, the company could face a materially lower next-round clearing price. That is why the return range is wide even though the headline private valuation is already known.
    claimRefs: [CV003, CV005, CV007, CV009, CV025, CV027, CV030, CV031, CV033, CV041, CV042, CV043, CV048, CV049]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: recommendation-risk-and-monitoring
    title: Recommendation, confidence, risk rating, and monitoring logic
    body: |
      The public-only recommendation is research-more. The long-form thesis is real: there is genuine geopolitical and cost pressure for a U.S.-anchored alternative to today's ASML-plus-TSMC stack, and Substrate has attracted credible investors around that idea. But the recommendation has to be price-sensitive. At roughly $1 billion, the company is already asking investors to pay for a future state in which the tool works at scale, demand appears, and multibillion-dollar financing closes. Public evidence still leaves the underwriting bridge between those steps mostly blank.

      That drives the rest of the rating stack. Confidence is medium because the financing context, benchmark set, and core technical narrative are legible from open sources, but the decisive evidence for valuation—throughput, yield, customers, pricing, and capital structure—remains private. Risk is high because the company is simultaneously attempting a new source architecture, a new foundry model, and a capital program management itself says could expand into the many-billions range. The right way to monitor the story is not with generic founder or market enthusiasm, but with explicit thesis-break triggers tied to proof, financing, and customer adoption.
    claimRefs: [CV005, CV009, CV035, CV036, CV045, CV046, CV047, CV048, CV049]
    tableRefs: [TV005]
    figureRefs: [FV004]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness and final diligence asks
    body: |
      Exit readiness is low on public evidence. Substrate is not being judged against other stealth or seed-stage companies anymore; a reported $1 billion mark and an ambition to build leading-edge fabs move the company into a category where investors should expect more structured disclosure on customers, economics, governance, and financing. Public-company benchmarks such as ASML, TSMC, and Intel all maintain filing trails and operating metrics. Substrate does not need to look like a public issuer today, but the current price does require more evidence than the company has made available.

      The final diligence asks therefore focus on the missing bridge items, not on generic curiosity. Before underwriting the price, an investor needs the actual cap table and preference stack, customer reservation or pilot documents, throughput and yield data from the 300 mm tool, a bottom-up cost bridge from the stated $100,000 industry path to the claimed $10,000 target, and a financing plan showing how the first fabs are funded without assuming unlimited future dilution. Without those materials, the valuation case stays conceptual instead of investable.
    claimRefs: [CV003, CV005, CV009, CV035, CV036, CV041, CV042, CV043, CV044, CV049]
    tableRefs: [TV006]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Current view, Decision implication]
    rows:
      - - Recommendation
        - research-more
        - Stay engaged only if proof or price improves; current public evidence is not enough for a buy call.
      - - Confidence
        - medium
        - The market context is legible, but the decisive valuation inputs remain private.
      - - Risk rating
        - high
        - New source physics plus new fab economics plus multibillion financing dependency create compounding execution risk.
      - - Valuation stance
        - stretched
        - The reported ~$1B mark is ahead of disclosed revenue, customer, throughput, and financing proof.
      - - Hold / exit posture
        - wait for milestone de-risking
        - Treat the position as a long-duration option only after deeper diligence or a better entry price.
      - - What would upgrade the call
        - customer and financing proof
        - A disclosed demand signal plus credible fab funding could move the recommendation faster than generic company-quality changes.
    notes: >-
      This is a price-sensitive summary, not a generic company-quality score. The same technical thesis could merit a different call at a lower entry price or after stronger milestone proof.
    claimRefs: [CV005, CV036, CV037, CV045, CV046, CV047, CV048, CV049]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [argument, direction, what would change the view]
    rows:
      - - Substrate is trying to pair lower-cost X-ray lithography with a vertically integrated U.S. foundry model.
        - thesis
        - Independent proof that the tool can hit throughput and yield targets would make the economics story more investable.
      - - The investor base and policy framing suggest access to strategic networks beyond a normal startup syndicate.
        - thesis
        - Confidence would rise if that access converts into disclosed project finance or government-backed manufacturing support.
      - - The current ~$1B mark arrives before revenue, backlog, customer count, or realized pricing are publicly disclosed.
        - anti-thesis
        - Even one anchor-customer reservation or pricing disclosure would materially improve valuation support.
      - - Management says scaling could require many billions and eventually tens or hundreds of billions of dollars.
        - anti-thesis
        - A staged fab-financing plan with identified debt, equity, and non-dilutive support would reduce downside risk.
      - - Canon and xLight show that lower-cost patterning and alternative light-source narratives already exist outside Substrate.
        - anti-thesis
        - The moat case improves only if Substrate can prove an integrated advantage that adjacent substitutes cannot match.
      - - Public incumbents disclose far more through filings and operating metrics than Substrate does today.
        - anti-thesis
        - A later financing at stronger disclosure depth would make the price easier to underwrite.
    notes: >-
      Rows are framed around what today's price already assumes rather than around whether Substrate is an interesting technology company in the abstract.
    claimRefs: [CV002, CV005, CV006, CV009, CV025, CV030, CV031, CV035, CV036, CV040]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [scenario, assumptions, valuation / return logic, key risks, probability signal]
    rows:
      - - Bull
        - Independent throughput and yield proof lands; an anchor customer or government-backed reservation appears; and a credible fab-financing stack is assembled.
        - Fair value expands to roughly $1.5B-$2.5B or about 1.5x-2.5x the current mark because the market starts pricing a funded platform rather than an unfunded thesis.
        - Requires technical proof to arrive before financing fatigue and before adjacent alternatives capture the cheaper-patterning narrative.
        - low
      - - Base
        - Tool proof improves and the story stays financeable, but customer disclosure and fully funded fabs remain pending.
        - Fair value stays around roughly $0.8B-$1.2B or near-flat to modestly positive versus the current mark because the market still has to bridge major unknowns.
        - A flat outcome can still dilute materially if the next round funds proof rather than scaled production.
        - medium
      - - Bear
        - Qualification slips or customer evidence stays absent while the financing gap remains measured in many billions.
        - Fair value compresses to roughly $0.2B-$0.6B, implying a down-round relative to the current mark.
        - Downside can occur without technology failure if capital intensity and disclosure gaps overwhelm investor willingness to fund the buildout.
        - medium
    notes: >-
      Scenario ranges are milestone-based valuation judgments in USD billions. Public evidence is too thin on revenue and cash conversion for a DCF-quality model.
    claimRefs: [CV003, CV005, CV007, CV009, CV033, CV041, CV042, CV043, CV048]
  - id: TV004
    title: Comparable valuation table
    columns: [comparable, metric, multiple / valuation / status, relevance, limitation]
    rows:
      - - Substrate current private round
        - Private financing signal
        - '> $100M raised at about or above a $1B valuation'
        - This is the actual entry price being assessed in this chapter.
        - No disclosed revenue, customer, or cap-table detail is available publicly to normalize the mark.
      - - ASML
        - Public market cap plus filing-backed operating scale
        - '$665.36B market cap in June 2026; 2025 net sales €32.7B; High-NA tools up to $400M'
        - Direct lithography incumbent benchmark for what proven tool economics and disclosure look like.
        - Mature monopoly economics are not directly comparable to a pre-commercial startup.
      - - TSMC
        - Public market cap plus current leading-edge production status
        - '$2.264T market cap in June 2026; N2 in volume production; 534 customers; >17M 12-inch equivalent wafers in 2025'
        - Best foundry-outcome benchmark for the manufacturing results Substrate ultimately wants to challenge.
        - Far more mature than Substrate and already operating at enormous scale.
      - - Intel Foundry
        - Public market cap plus bundled systems-foundry offer
        - '$566.48B market cap in June 2026; front-end manufacturing plus packaging and test'
        - Domestic integrated-manufacturing benchmark with a broad service stack.
        - Intel is a diversified incumbent with its own turnaround complexity.
      - - Canon NIL
        - Public market cap plus alternative-patterning status
        - '$23.87B market cap in June 2026; NIL tool launched; 14 nm linewidth today with 10 nm path claimed'
        - Shows a lower-cost patterning alternative already in the market.
        - Canon is a diversified conglomerate and NIL is only one part of its value.
      - - xLight
        - Private milestone reference
        - '$40M Series B in 2025 plus $150M CHIPS award in 2026'
        - Closest adjacent alternative-light-source startup reference.
        - No disclosed xLight valuation and no foundry business.
      - - Applied Materials
        - Public market cap
        - '$397.59B market cap in June 2026'
        - Tool-economics benchmark showing the value public markets assign to proven semiconductor-equipment franchises.
        - Not a lithography-led foundry challenger.
      - - Lam Research
        - Public market cap
        - '$429.83B market cap in June 2026'
        - Another large public equipment benchmark for installed-base and service economics.
        - Not a lithography-led foundry challenger.
      - - KLA
        - Public market cap
        - '$277.59B market cap in June 2026'
        - Shows how richly public markets still value proven metrology and process-control franchises.
        - Not a direct manufacturing-platform analogue.
    notes: >-
      This table mixes private financing signals, public market caps, and milestone references because Substrate lacks the disclosed revenue needed for clean multiple-based startup valuation. All values are public references as of 2026-06-04.
    enumerationScope:
      coverage: exhaustive
      basis: 'Exhaustive across every retained valuation benchmark used in this chapter: the current Substrate round, direct lithography and foundry incumbents, adjacent alternative-patterning references, and public semiconductor-equipment peers reviewed on 2026-06-04.'
    claimRefs: [CV005, CV012, CV014, CV015, CV016, CV017, CV018, CV020, CV022, CV024, CV025, CV026, CV029, CV030, CV031, CV032, CV039]
  - id: TV005
    title: Thesis-break and kill triggers table
    columns: [trigger, threshold, transmission to thesis, action implication]
    rows:
      - - Throughput and yield proof stays private
        - No independent wafers-per-hour, uptime, or defectivity evidence by the next financing event.
        - The low-cost wafer thesis cannot be underwritten without production-quality proof.
        - Do not add capital on headline technology narrative alone.
      - - Anchor-customer evidence does not appear
        - No disclosed reservation, pilot contract, or strategic offtake despite tool progress.
        - The valuation stays a technology option rather than a commercial platform.
        - Require customer documents before underwriting the current mark.
      - - Fab financing remains vague
        - No credible stack of debt, government support, and equity aligned to first-fab buildout.
        - Many-billions capex risk transmits directly into dilution or project delay.
        - Assume down-round risk and re-rate the thesis lower.
      - - Alternative peers move faster inside existing ecosystems
        - Canon NIL or xLight-style alternatives gain proof sooner than Substrate's integrated model.
        - The differentiation story shrinks while incumbents keep the rest of the stack.
        - Reset moat assumptions and demand a lower entry price.
      - - Cost bridge cannot be reconciled
        - Management cannot show how the $10,000 wafer target follows from throughput, yield, and depreciation assumptions.
        - The price-support narrative loses its core economic claim.
        - Treat valuation as stretched regardless of technical novelty.
      - - Disclosure quality remains thin into a later-stage round
        - Cap table, governance, and operating metrics remain materially less transparent than later-stage peers.
        - Exit readiness stays low and public-market comparability remains weak.
        - Keep the recommendation at research-more or worse.
    notes: >-
      Triggers are monitorable events that would break the underwriting bridge from private narrative to investable valuation, not generic startup risks.
    claimRefs: [CV002, CV003, CV009, CV027, CV030, CV031, CV033, CV036, CV040, CV041, CV043, CV044, CV049]
  - id: TV006
    title: Final diligence asks table
    columns: [topic, missing evidence, why it matters, owner or diligence path]
    rows:
      - - Cap table and preference stack
        - Liquidation preferences, anti-dilution terms, warrants, debt covenants, and any government-step-in rights.
        - A flat headline valuation can still be a poor common-equity entry if terms are investor-protective.
        - Request the latest cap table, term sheets, and financing-model waterfall from management counsel.
      - - Customer demand proof
        - Signed pilot agreements, wafer reservations, prepayments, or strategic offtake commitments.
        - Customer evidence is the cleanest way to distinguish real platform demand from headline curiosity.
        - Request redacted customer contracts and pipeline-stage reporting.
      - - Tool throughput and quality
        - Wafers-per-hour, uptime, overlay, defectivity, yield, and maintenance-cycle data from the 300 mm tool.
        - Valuation cannot move from thesis to operating case without production-quality evidence.
        - Review engineering test reports and independent fab-partner validation.
      - - Fab financing plan
        - Site-by-site capex, debt capacity, CHIPS or state-incentive status, and expected equity needs.
        - Management itself says scale may require many billions, so financing structure is central to returns.
        - Build a full first-fab funding model before any price decision.
      - - Unit-economics bridge
        - A bottom-up path from the stated $100,000 industry wafer trajectory to the claimed $10,000 target.
        - The cost thesis is the core reason to pay for upside before revenue exists.
        - Reconcile depreciation, throughput, yield, service, and utilization assumptions with external experts.
      - - Governance and exit readiness
        - Board rights, reporting cadence, audit readiness, and public-market-quality KPI definitions.
        - A later-stage private price requires more than charismatic narrative if the company eventually needs large pools of capital.
        - Set a disclosure checklist before treating the company as IPO-track or late-stage-ready.
    notes: >-
      These asks focus on the missing bridge items needed to underwrite the current price rather than on general startup diligence curiosity.
    claimRefs: [CV002, CV003, CV009, CV033, CV036, CV041, CV042, CV043, CV044, CV049]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call follows a simple chain: credible strategic thesis plus real capital access, minus missing operating proof and a financing gap that is still measured in many billions.
    data:
      nodes:
        - id: price
          label: Current price signal
          detail: '> $100M raised at about or above a $1B valuation.'
          tone: warning
        - id: thesis
          label: Strategic upside
          detail: Lower-cost X-ray lithography plus a U.S.-anchored vertically integrated foundry could matter if the stack works.
          tone: positive
        - id: proof
          label: Operating proof gap
          detail: No public revenue, customer, backlog, throughput, or realized pricing disclosure yet.
          tone: warning
        - id: comps
          label: Comparable context
          detail: Public incumbents have huge market values because they already pair scale with filings and operating disclosure.
          tone: neutral
        - id: finance
          label: Financing burden
          detail: Management says scaling fabs may require many billions and potentially tens or hundreds of billions of dollars.
          tone: negative
        - id: decision
          label: Research-more / stretched
          detail: The thesis is credible, but today's price is not publicly underwritten like a de-risked operating business.
          tone: neutral
      edges:
        - { from: price, to: decision }
        - { from: thesis, to: decision }
        - { from: proof, to: decision }
        - { from: comps, to: decision }
        - { from: finance, to: decision }
    approximationNotes: >-
      This is a logical underwriting chain, not a quantitative model. It summarizes how the cited evidence transmits into the recommendation.
    claimRefs: [CV005, CV009, CV035, CV036, CV045, CV048]
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Milestone evidence matters more than spreadsheet precision: a better price or stronger proof can move the supported range quickly.
    data:
      items:
        - { label: 'Delayed qualification / financing stress', value: 0.3, detail: 'If customer proof and financing both lag, public support can compress into clear down-round territory.', tone: negative }
        - { label: 'Pilot proof only', value: 0.8, detail: 'Technical progress without demand disclosure still struggles to support a premium above the current mark.', tone: warning }
        - { label: 'Current private round reference', value: 1.0, detail: 'The reported mark already assumes more future proof than public sources currently show.', tone: warning }
        - { label: 'Throughput proof + anchor customer', value: 1.5, detail: 'Commercial validation starts to justify paying above the current mark.', tone: positive }
        - { label: 'Throughput proof + customer + funded first fab', value: 2.2, detail: 'A credible financing bridge would move the company from narrative to platform underwriting.', tone: positive }
        - { label: 'Production-qualified integrated platform path', value: 3.0, detail: 'Only a much later proof state supports a materially richer valuation from public-style evidence.', tone: positive }
    approximationNotes: >-
      Values are directional valuation waypoints in USD billions inferred from the scenario logic, current private mark, and benchmark set; they are not management guidance.
    claimRefs: [CV005, CV030, CV031, CV041, CV042, CV043, CV049]
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The wide spread between bear, base, bull, and the current mark reflects how much of the underwriting still depends on future milestone proof.
    data:
      items:
        - { label: Bear case, low: 0.2, mid: 0.4, high: 0.6, displayValue: '$0.2B-$0.6B', detail: 'Qualification or financing slips and the next round clears below the current mark.', tone: negative }
        - { label: Base case, low: 0.8, mid: 1.0, high: 1.2, displayValue: '$0.8B-$1.2B', detail: 'Tool proof improves, but customer and fab-financing evidence remain incomplete.', tone: warning }
        - { label: Bull case, low: 1.5, mid: 2.0, high: 2.5, displayValue: '$1.5B-$2.5B', detail: 'Technical proof, customer validation, and credible financing all arrive before the next major round.', tone: positive }
        - { label: Current round reference, low: 0.95, mid: 1.0, high: 1.05, displayValue: '~$1.0B', detail: 'The known private mark is already at the top of the public-only base case.', tone: neutral }
    approximationNotes: >-
      Ranges are scenario-based valuation judgments in USD billions, constructed because public evidence does not support a DCF or revenue-multiple model for Substrate today.
    claimRefs: [CV005, CV041, CV042, CV043, CV048, CV049]
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      The company scores well on ambition and strategic relevance, but poorly on disclosure, financing sufficiency, and current valuation support.
    data:
      items:
        - { label: Market need, value: 8, unit: /10, detail: 'Geopolitics and AI demand create real pressure for more advanced-chip capacity.', tone: positive }
        - { label: Technical ambition, value: 8, unit: /10, detail: 'The company is attempting a genuinely non-trivial change to source physics and fab integration.', tone: positive }
        - { label: Customer proof, value: 2, unit: /10, detail: 'No public customer, backlog, or reservation evidence is disclosed.', tone: negative }
        - { label: Economics visibility, value: 2, unit: /10, detail: 'No public revenue, realized pricing, or throughput-backed cost bridge exists.', tone: negative }
        - { label: Financing sufficiency, value: 2, unit: /10, detail: 'Current funding is tiny relative to the many-billions buildout the company describes.', tone: negative }
        - { label: Disclosure quality, value: 3, unit: /10, detail: 'Public-company-style filing and KPI depth is absent at a price that increasingly demands it.', tone: warning }
        - { label: Entry-price attractiveness, value: 3, unit: /10, detail: 'The current mark looks stretched until proof or price changes materially.', tone: warning }
    approximationNotes: >-
      Scores are ordinal investment-committee judgments anchored to the cited evidence, not company-reported KPI disclosures.
    claimRefs: [CV005, CV009, CV035, CV036, CV046, CV047, CV048]
