  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table-terms
      missingEvidence: Liquidation preferences, anti-dilution rights, debt covenants, warrants, and any government-linked financing conditions.
      whyItMatters: A flat headline valuation can still be a poor common-equity entry if terms are heavily investor-protective or debt-heavy.
      diligencePath: Request the latest cap table, full term sheets, and a modeled proceeds waterfall for the current and next expected financing.
      relatedQuestionRefs: [QV020, QV026, QV030]
    - type: private-evidence-only
      severity: material
      topic: customer-proof
      missingEvidence: Signed pilot agreements, wafer reservations, prepayments, or other documentary evidence of demand.
      whyItMatters: Customer validation is the cleanest way to distinguish a compelling technical narrative from a financeable commercial platform.
      diligencePath: Review redacted customer contracts, pipeline-stage reporting, and any strategic or government-backed reservation documents.
      relatedQuestionRefs: [QV003, QV027, QV028, QV030]
    - type: private-evidence-only
      severity: blocking
      topic: throughput-yield
      missingEvidence: Wafers-per-hour, uptime, overlay, defectivity, maintenance-cycle, and yield data from the in-house 300 mm tool.
      whyItMatters: Without production-quality tool data, the cost thesis and the scenario ranges cannot be underwritten with high confidence.
      diligencePath: Obtain engineering test reports and seek independent validation from a fab-experienced technical advisor.
      relatedQuestionRefs: [QV020, QV027, QV028, QV029, QV030]
    - type: private-evidence-only
      severity: material
      topic: fab-financing-plan
      missingEvidence: Site-by-site capex schedules, debt availability, CHIPS or state-support status, and expected equity needs for the first fabs.
      whyItMatters: Management already frames eventual scale in the many-billions range, so financing structure is central to dilution risk and return potential.
      diligencePath: Build a first-fab financing model with management and confirm the status of debt, strategic, and government capital sources.
      relatedQuestionRefs: [QV004, QV027, QV028, QV029, QV030]
