summary:
  headline: Substrate 正在押注大胆且具战略意义的美国光刻与晶圆代工逻辑，但现有公开记录只能支持中等置信度的继续研究：公司有融资势能和有意思的技术信号，却还没有与约 $1 billion 估值相匹配的客户、产能、良率和融资证明。
