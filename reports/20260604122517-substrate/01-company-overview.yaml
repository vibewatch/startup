chapter:
  number: 1
  title: Company Overview
  summary: 'Substrate is a San Francisco startup founded in 2022 by James and Oliver Proud that is attempting to build a U.S.-based, vertically integrated semiconductor foundry around particle-accelerator-driven X-ray lithography. Public reporting says it has disclosed more than $100 million of funding at roughly a $1 billion valuation, but the company remains pre-production and founder-centric: the strongest public proof points are technical demos, a 2028 manufacturing target, and April 2026 AlphaEvolve results rather than disclosed customer or financial traction.'
