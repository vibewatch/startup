sections:
- id: identity-and-product
  title: Identity, stage, and technology thesis
  body: 'Substrate presents itself as a new American semiconductor foundry effort rather than a single-purpose tool vendor. The companys legal materials identify the site operator as Substrate Inc., while public reporting places the business in San Francisco and dates its founding to 2022 by brothers James and Oliver Proud. Official copy is explicit about the mission: build Americas next-generation semiconductor foundry, powered by a particle-accelerator-based X-ray lithography stack designed to extend Moores Law while lowering both fab and wafer economics.


    As of the run date, the company still reads as pre-production. Reporting consistently points to a 2028 first-chip or mass-production target, which means the public proof case is technical rather than commercial. The official materials are strongest where they describe the product: equivalence to High-NA / 2 nm resolution targets, 12 nm-class printed structures, an in-house production-quality 300 mm tool, and a roadmap toward much lower wafer costs than the status-quo path. That makes Substrate analytically interesting as an advanced manufacturing platform, but still early as an operating foundry business.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO006
