  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-som-gap
      missingEvidence: Publicly supportable segmentation of Substrate's serviceable and obtainable market by customer type, wafer starts, and revenue model.
      whyItMatters: Without a company-specific SAM or SOM, valuation models can overfit broad industry TAMs that Substrate may never actually serve.
      diligencePath: Request management's internal market model with customer buckets, expected wafer volumes, and the split between foundry revenue and any tool or licensing revenue.
      relatedQuestionRefs: [QM007, QM008, QM025]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: blocking
      topic: throughput-and-yield
      missingEvidence: Verified wafers-per-hour, defect density, uptime, and yield metrics for Substrate's production-intent 300mm tool chain.
      whyItMatters: Cost claims are not decision-useful unless the company can also prove industrial throughput and production-grade reliability.
      diligencePath: Request pilot-line KPI dashboards, wafer-start history, benchmark comparisons versus EUV or immersion alternatives, and third-party validation from customers or consortium partners.
      relatedQuestionRefs: [QM021, QM026]
    - type: private-evidence-only
      severity: material
      topic: business-model-boundary
      missingEvidence: Clear public statement on whether Substrate's primary commercial product is wafer supply, foundry services, tool sales, or a hybrid model.
      whyItMatters: Buyer mapping, budget ownership, and comparable-company selection all change materially depending on which market the company will monetize.
      diligencePath: Request board-approved go-to-market plan, first-product roadmap, and expected contracting structure for early customers or partners.
      relatedQuestionRefs: [QM001, QM009, QM011]
      relatedTableRefs: [TM001, TM003]
    - type: missing-source
      severity: material
      topic: anchor-customers
      missingEvidence: Public evidence of design wins, signed anchor customers, or named prototype programs that would convert technical interest into commercial demand.
      whyItMatters: Advanced-foundry adoption has long sales cycles, and without early customers the market thesis can remain purely aspirational.
      diligencePath: Request customer pipeline by stage, NDAs permitting reference calls, and any signed LOIs, MPW commitments, or consortium-backed prototype schedules.
      relatedQuestionRefs: [QM009, QM012, QM025]
    - type: conflicting-data
      severity: minor
      topic: estimate-dispersion
      missingEvidence: A reconciled bridge explaining how broad semiconductor demand, fab capex, and lithography-market estimates roll into one company-relevant sizing framework.
      whyItMatters: Public market reports describe overlapping shells, so investors need an explicit bridge to avoid double-counting or false precision.
      diligencePath: Build a bottoms-up model from target customer classes, node mix, mask counts, and wafer volume assumptions rather than relying on generic analyst reports.
      relatedQuestionRefs: [QM004, QM005, QM006, QM025]
      relatedTableRefs: [TM002]
sections:
  - id: market-boundary-and-substitutes
    title: Market boundary, included spend, and substitute stack
    body: >-
      Substrate should be analyzed against a narrow stack of spending, not against all semiconductor
      demand. The company presents itself as a vertically integrated foundry built around advanced
      X-ray lithography, so the included spend is leading-edge wafer supply, process enablement,
      mask and prototype services, and the advanced lithography capex needed to produce those
      wafers. The excluded spend is broad semiconductor end demand that never touches leading-edge
      manufacturing choices, plus generic electronics, software, or test-only budgets. The status quo
      substitute is not a single competing startup. It is an incumbent chain: ASML's EUV and DUV
      tools, TSMC's and Intel's foundry ecosystems, Nikon's immersion and packaging tools, and Canon's
      lower-cost nanoimprint route. Public sources also show why that substitute chain is sticky. ASML
      notes that even advanced chips still rely on many DUV layers, TSMC frames masks and shuttles as
      interfaces between designers and fabs, and Intel bundles packaging and ecosystem support into its
      foundry offer. That means a buyer switching to Substrate would be changing a whole production
      pathway, not merely replacing one scanner.
    claimRefs: [CM001, CM003, CM004, CM017, CM018, CM019, CM021, CM022, CM024, CM025, CM028, CM036, CM039, CM040]
    tableRefs: [TM001]
  - id: sizing-lenses-and-boundary-dispersion
    title: 'Sizing lenses: strong top-down demand, weak Substrate-specific precision'
    body: >-
      The broad demand pool is unquestioned. SIA says semiconductor sales hit $791.7 billion in 2025
      and are tracking toward roughly $1 trillion in 2026, while SEMI expects front-end fab-equipment
      spending to reach $110 billion in 2025 and $130 billion in 2026 as AI, memory, and 2nm ramps
      continue. The harder question is where to stop shrinking that stack. Public analyst views on the
      lithography layer are contradictory but still useful. Mordor pegs semiconductor lithography
      equipment at $27.83 billion in 2025 and $30.44 billion in 2026, IMARC pegs a broader lithography
      systems market at $10.8 billion in 2025, IMARC's photolithography cut is $17.1 billion, and
      Market Research Future lands at $11.74 billion. Those ranges are not a bug in the evidence; they
      are the evidence. Publishers are measuring different shells: lithography systems, photolithography
      equipment, or semiconductor lithography equipment. The disciplined conclusion is therefore not a
      fake TAM/SAM/SOM pyramid. It is that there is a real multibillion-dollar capex and equipment
      market, but no public source isolates a clean Substrate-specific SAM or SOM. Any investor model
      must preserve that uncertainty instead of converting it into pseudo-precision.
    claimRefs: [CM002, CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM013, CM020, CM037, CM042]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]
  - id: buyer-map-and-adoption-path
    title: Buyer, user, payer, and the adoption path
    body: >-
      The likely first economic buyers are organizations that need leading-edge wafer access or
      domestic foundry optionality: fabless AI chip companies, hyperscalers building custom silicon,
      government-backed programs, and possibly incumbent fabs evaluating partnership routes. The day-
      to-day users are engineering specialists—design enablement teams, lithography engineers, process
      integration leads, mask teams, and packaging organizations—because advanced manufacturing
      adoption is technical long before it is commercial. The payer is likewise not a seat-based
      software budget; it is a silicon procurement budget, a fab capex committee, or a public-program
      award. TSMC's mask and CyberShuttle services, Intel's foundry-plus-packaging model, and Mordor's
      foundry-heavy end-user mix all imply the same adoption sequence: get pilot wafers, enable the
      design flow, prove overlay and yield, demonstrate reliability, then convert to a long-term wafer
      or capacity commitment. That sequence matters for Substrate because it explains why early R&D or
      consortium proof is not the same as commercial volume and why the market can be attractive even
      while near-term revenue remains hard to underwrite.
    claimRefs: [CM017, CM018, CM019, CM020, CM028, CM029, CM030, CM031, CM040]
    tableRefs: [TM003]
    figureRefs: [FM003, FM004]
  - id: growth-drivers-constraints-and-gaps
    title: Growth drivers, adoption constraints, and diligence gaps
    body: >-
      The demand side is real. AI-led semiconductor sales, rising fab-equipment spending, CHIPS-backed
      reshoring, and the concentration of leading-edge logic in Taiwan all create a structural opening
      for domestic alternatives. Canon's progress in NIL and Rapidus's 2nm push also show that buyers
      and sponsors remain interested in non-status-quo paths when cost, sovereignty, or node leadership
      are at stake. But the same evidence also sharpens the reasons to be cautious on Substrate.
      Advanced lithography is capital intensive, qualification heavy, and embedded in ecosystems that
      incumbents already operate at industrial scale. Public reporting still does not establish
      Substrate's throughput, yield, uptime, business-model boundary, or customer pipeline, and Heise
      explicitly notes that feasibility on a reasonable timeline cannot yet be assessed. The chapter's
      diligence gap is therefore not whether the market exists. It does. The gap is whether Substrate
      can turn a credible technology thesis into a commercially qualified foundry path before incumbent
      scale, ecosystem lock-in, and funding requirements overwhelm the opportunity.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM016, CM023, CM025, CM026, CM027, CM032, CM033, CM034, CM035, CM037, CM038, CM041, CM042]
    tableRefs: [TM004]
tables:
  - id: TM001
    title: Market definition table
    columns: [segment/category, included spend, excluded spend, buyer/payer, relevance]
    rows:
      -
        - Leading-edge wafer demand
        - Advanced logic wafer supply, design enablement, mask, and packaging handoff
        - Commodity semiconductor demand that does not affect leading-edge node choice
        - Fabless AI chip companies, hyperscalers, and public-program sponsors
        - Closest market of record for Substrate if it is a foundry-first company
      -
        - Front-end fab equipment
        - Lithography plus deposition, etch, metrology, and cleanroom equipment for fabs
        - Backend test-only tools and unrelated electronics capex
        - Foundries, IDMs, and CHIPS-backed manufacturing programs
        - Best capex lens for how much spend buyers commit before wafers exist
      -
        - Advanced lithography equipment
        - EUV, High-NA EUV, DUV immersion, DUV dry, NIL, and adjacent patterning tools
        - Generic printing or non-semiconductor lithography
        - Foundries, IDMs, and R&D consortia
        - Best direct substitute lens for Substrate's technical wedge
      -
        - Foundry ecosystem services
        - Mask services, MPW or shuttle runs, packaging, test, and process support
        - Standalone EDA or cloud-compute spend without manufacturing services
        - Fabless designers and silicon platform teams
        - Explains why adoption depends on an ecosystem rather than one machine
      -
        - Status-quo substitute stack
        - TSMC and Intel foundry routes plus ASML, Nikon, and Canon patterning options
        - Unrelated EMS or board assembly spend
        - The same buyers that might otherwise choose Substrate
        - Captures switching cost and incumbent lock-in
    notes: >-
      The boundary intentionally narrows from all semiconductors to the leading-edge foundry and
      lithography layers that actually govern a Substrate buying decision.
    claimRefs: [CM001, CM003, CM004, CM018, CM019, CM021, CM022, CM024, CM028, CM036, CM039, CM040]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns: [publisher, year, geography, value, CAGR, methodology, confidence, limitation]
    rows:
      - [SIA, 2025-2026, Global, '$791.7B in 2025; roughly $1T projected in 2026', n/a, Annual semiconductor sales, medium, Too broad for Substrate but shows end-demand pull for advanced chips.]
      - [SEMI, 2025-2026, Global, '$110B fab equipment in 2025; $130B in 2026', n/a, Front-end fab capex forecast, medium, Includes all front-end equipment rather than only lithography or foundry services.]
      - [Mordor Intelligence, 2025-2031, Global, '$27.83B in 2025; $30.44B in 2026; $47.63B in 2031', 9.37%, Semiconductor lithography equipment market, medium, Broad equipment boundary and vendor-defined methodology.]
      - [IMARC Group, 2025-2034, Global, '$10.8B in 2025; $15.0B in 2034', 3.74%, Lithography systems market, medium, Broader lithography-systems shell that is not semiconductor-specific in every segment.]
      - [IMARC Group, 2025-2034, Global, '$17.1B in 2025; $31.7B in 2034', 6.87%, Photolithography equipment market, medium, Closer to semiconductor equipment but still broader than a Substrate SAM.]
      - [Market Research Future, 2025-2035, Global, '$11.74B in 2025; $17.46B in 2035', 4.05%, Lithography equipment market, low, Methodology is less transparent and still too broad to isolate Substrate's obtainable wedge.]
    notes: >-
      These lenses are deliberately preserved side by side because public sources measure different
      shells of the market. They support a real category opportunity but not a precise Substrate SAM or
      SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM013, CM020]
