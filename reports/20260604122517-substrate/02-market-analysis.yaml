      -
        - Incumbent foundries or IDMs exploring partnerships
        - CTO or manufacturing leadership
        - Lithography and process-development engineers
        - Fab capex committee
        - Tool evaluation, process qualification, then node-specific deployment
        - Manufacturing leadership
        - Need for an alternative path beyond current EUV cost curves
      -
        - R&D consortia and university-linked pilot lines
        - Consortium director or lab leadership
        - Process researchers and prototype teams
        - Member dues and public R&D funds
        - Experimental runs, mask learning, and prototype validation
        - Consortium or grant budget
        - Need to test non-status-quo lithography before production risk is assumed
    notes: >-
      Budget ownership and workflow steps are inferred from foundry service models, CHIPS program
      structures, and public substitute-system deployment paths rather than from named Substrate
      customers.
    claimRefs: [CM017, CM018, CM019, CM028, CM029, CM030, CM031, CM040]
  - id: TM004
    title: Growth drivers and constraints table
    columns: [driver/constraint, direction, timing, implication, diligence ask]
    rows:
      -
        - AI-driven semiconductor demand
        - driver
        - current
        - Expands the broad demand pool for advanced logic and the fabs that supply it
        - Ask for which AI-linked end markets Substrate is targeting first.
      -
        - 2nm and backside-power capex cycle
        - driver
        - current to near-term
        - Pulls more money into leading-edge process development and equipment refresh
        - Ask whether Substrate's roadmap maps to the same customer node transitions.
      -
        - CHIPS-backed domestic manufacturing support
        - driver
        - current to medium-term
        - Lowers financing friction for U.S. facilities and ecosystem buildout
        - Ask which public programs or consortia are realistic funding channels for Substrate.
      -
        - Taiwan concentration and sovereignty demand
        - driver
        - current to medium-term
        - Creates strategic appetite for domestic alternatives among governments and some buyers
        - Ask for customer conversations where resilience matters more than pure unit cost.
      -
        - Incumbent ecosystem bundling
        - constraint
        - current
        - Makes switching cost about masks, packaging, and support ecosystems instead of only lithography resolution
        - Ask for how Substrate will replicate or partner for missing ecosystem pieces.
      -
        - Extreme capital intensity
        - constraint
        - current
        - Raises financing burden and lengthens time to commercial scale
        - Ask for expected fab and tool capex per phase and funding plan by milestone.
      -
        - Throughput, yield, and qualification burden
        - constraint
        - current to medium-term
        - Delays the jump from compelling technical proof to volume contracts
        - Ask for wafers-per-hour, uptime, defectivity, and customer qualification data.
      -
        - Export controls and regional fragmentation
        - constraint
        - current
        - Can redirect demand toward allied supply but also narrow available equipment and customer pools
        - Ask for supply-chain exposure by country and any export-controlled dependencies.
    notes: >-
      Drivers and constraints are tied to adoption timing, budget ownership, and execution risk rather
      than presented as generic industry talking points.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM021, CM022, CM023, CM026, CM027, CM033, CM034, CM035, CM041, CM042]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      The most defensible public sizing stack for Substrate narrows from overall chip demand to fab
      capex to lithography spend, with the company's own obtainable wedge still unquantified.
    data:
      items:
        - label: Global semiconductor demand pool
          detail: '$791.7B 2025 sales and roughly $1T 2026 projection show why leading-edge supply matters.'
          tone: positive
        - label: Front-end fab capex pool
          detail: '$110B in 2025 and $130B in 2026 show the spend layer that actually funds capacity creation.'
          tone: positive
        - label: Lithography market shell
          detail: Public current-market estimates range from $10.8B to $30.44B depending on the publisher's boundary.
          tone: warning
        - label: Substrate practical wedge
          detail: Public evidence does not isolate a clean company-specific SAM or SOM before throughput and customer proof.
          tone: risk
    approximationNotes: >-
      The pyramid is a constrained lens, not a clean nested TAM/SAM/SOM. Public evidence supports the
      first three layers numerically and supports the fourth only qualitatively as an unresolved wedge.
    claimRefs: [CM002, CM010, CM011, CM037]
  - id: FM002
    title: Market estimate range
    type: range
    layout: standard
    summary: >-
      Public current and long-range lithography estimates vary widely because analysts publish different
      market shells rather than one stable definition.
    data:
      items:
        - label: Current market size proxy (2025-2026)
          low: 10.8
          mid: 17.1
          high: 30.44
          displayValue: USD 10.8B–30.44B
          detail: IMARC lithography systems, IMARC photolithography equipment, and Mordor semiconductor lithography equipment are not measuring the same shell.
          tone: warning
        - label: Forecast endpoint proxy (2031-2035)
          low: 15.0
          mid: 17.46
          high: 47.63
          displayValue: USD 15.0B–47.63B
          detail: Endpoints come from IMARC 2034, MRF 2035, and Mordor 2031 and should be treated as dispersion rather than a consensus curve.
          tone: warning
        - label: Forecast CAGR proxy
          low: 3.74
          mid: 4.05
          high: 9.37
          displayValue: 3.74%–9.37%
          detail: Growth disagreement itself is a diligence signal that boundary choice matters as much as arithmetic.
          tone: risk
    approximationNotes: >-
      Each row uses one consistent unit, but the rows mix market-size and CAGR views. They are
      presented to preserve estimate dispersion, not to imply a single apples-to-apples consensus.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM037]
  - id: FM003
    title: Buyer / segment map
    type: matrix
    layout: wide
    summary: >-
      Near-term fit is highest where the buyer values domestic leading-edge optionality and can absorb
      long qualification cycles, not where procurement needs a low-friction commodity supplier.
    data:
      columns: [Domestic supply pull, Budget depth, Qualification burden, Near-term fit]
      rows:
        - label: Fabless AI accelerator companies
          values:
            - { label: high, tone: positive, detail: Supply diversification matters if advanced-node capacity is scarce. }
            - { label: medium, tone: neutral, detail: Budget exists but NRE sensitivity is high for startups. }
            - { label: high, tone: risk, detail: Qualification burden is heavy without incumbent ecosystem leverage. }
            - { label: medium, tone: warning, detail: Good strategic fit, but only after design-flow proof exists. }
        - label: Hyperscalers and custom silicon teams
          values:
            - { label: high, tone: positive, detail: Sovereignty and supply resilience can matter alongside cost per watt. }
            - { label: high, tone: positive, detail: These buyers can fund long qualification programs. }
            - { label: high, tone: risk, detail: Reliability and throughput thresholds are exceptionally demanding. }
            - { label: medium, tone: warning, detail: Attractive if Substrate proves industrial scale, not only lab results. }
        - label: Government or sovereign programs
          values:
            - { label: high, tone: positive, detail: Domestic capability and strategic control are explicit goals. }
            - { label: medium, tone: neutral, detail: Budgets exist, but procurement cycles can be long. }
            - { label: medium, tone: warning, detail: Pilot and demonstration pathways can reduce some adoption friction. }
            - { label: high, tone: positive, detail: Best early fit for a company selling strategic capability before broad commercial volume. }
        - label: Incumbent foundries or IDMs
          values:
            - { label: medium, tone: neutral, detail: Interest exists if alternative patterning lowers cost curves. }
            - { label: high, tone: positive, detail: Capex budgets are large enough to evaluate new tools. }
            - { label: high, tone: risk, detail: Existing process flows and installed base make switching especially hard. }
            - { label: low, tone: risk, detail: Near-term fit is limited unless the technology clearly beats incumbent economics. }
        - label: R&D consortia and pilot lines
          values:
            - { label: medium, tone: neutral, detail: Strategic motive is proof generation rather than full supply replacement. }
            - { label: medium, tone: neutral, detail: Funding is smaller but still material. }
            - { label: low, tone: positive, detail: Qualification demands are lighter because prototype work is the goal. }
            - { label: high, tone: positive, detail: Strongest path for early validation and ecosystem credibility. }
    approximationNotes: >-
      Cells are ordinal judgments synthesized from foundry-service models, public-policy programs, and
      substitute-technology deployment paths rather than from a direct buyer survey.
    claimRefs: [CM028, CM029, CM030, CM031, CM033, CM034, CM035]
  - id: FM004
    title: Adoption funnel or value-chain map
    type: flow
    layout: standard
    summary: >-
      Buyers do not move directly from a technical demo to wafer contracts; they move through design,
      mask, prototype, qualification, and scale gates that compound switching cost.
    data:
      nodes:
        - id: n1
          label: Strategic interest from AI demand, reshoring, or sovereignty needs
          detail: Demand enters through economics or resilience, not through generic semiconductor TAM rhetoric.
          tone: positive
        - id: n2
          label: Prototype or consortium proof on 300mm process hardware
          detail: Early interest is usually pilot-line or prototype oriented.
          tone: positive
        - id: n3
          label: Mask, design-enablement, and shuttle workflow integration
          detail: Customers need an onboarding path equivalent to incumbent foundry services.
          tone: neutral
        - id: n4
          label: Reliability, overlay, yield, and throughput qualification
          detail: This is where many alternative lithography stories stall.
          tone: risk
        - id: n5
          label: Multi-year wafer or capacity commitment
          detail: Only after qualification can a buyer place real production demand.
          tone: neutral
        - id: n6
          label: Scale-up gated by fab capital, workforce, and ecosystem depth
          detail: Commercial success still depends on industrial execution beyond one tool.
          tone: risk
      edges:
        - { from: n1, to: n2, label: proof }
        - { from: n2, to: n3, label: enable }
        - { from: n3, to: n4, label: qualify }
        - { from: n4, to: n5, label: contract }
        - { from: n5, to: n6, label: ramp }
    approximationNotes: null
    claimRefs: [CM018, CM019, CM031, CM032, CM038, CM040]
callouts:
  - calloutType: insight
    title: The right market is a stack, not a single TAM
    body: >-
      The evidence supports a demand chain from semiconductor sales to fab capex to lithography spend,
      but it does not support treating all of that value as directly addressable by Substrate.
    claimRefs: [CM009, CM010, CM011, CM037]
  - calloutType: risk
    title: Demand is real; Substrate-specific market precision is not
    body: >-
      Public sources show clear demand for leading-edge capacity and domestic alternatives, but they do
      not yet show the throughput, customer proof, or business-model clarity needed to quantify a clean
      Substrate SAM or SOM.
    claimRefs: [CM012, CM032, CM037, CM038]
