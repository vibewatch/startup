chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Substrate should not be underwritten against the entire semiconductor market. The most relevant
    public sizing stack runs from global semiconductor demand and front-end fab capex down to the
    much narrower lithography-equipment and leading-edge foundry layers where incumbents such as
    ASML, TSMC, and Intel already have scale, ecosystems, and qualification data. Public sources do
    support durable demand drivers—AI-led chip demand, 2nm roadmaps, CHIPS-backed reshoring, and
    supply-chain sovereignty—but they do not support a clean Substrate-specific SAM or SOM because
    throughput, customer pipeline, business-model boundary, and foundry qualification remain private
    or unproven.
