  topStrengths:
    - >-
      The company is attacking one of the most strategically important bottlenecks in advanced semiconductors:
      lithography and domestic leading-edge fabrication capacity.
    - >-
      Official materials and the April 2026 technical post provide more concrete technical proof than a typical stealth
      deep-tech startup, including 300 mm tooling claims, 12 nm patterning, and materially faster computational
      lithography.
    - >-
      The investor syndicate and policy alignment suggest Substrate can access attention, introductions, and potentially
      non-dilutive support that most hardware startups cannot.
  topRisks:
    - >-
      Scaling from promising patterning demonstrations to high-throughput, high-yield, commercial wafer production
      remains unproven and is the single biggest technical risk.
    - >-
      The vertically integrated foundry ambition implies capital needs in the many-billions range, far beyond the
      currently disclosed equity base.
    - >-
      No public customer, revenue, backlog, or reservation proof is available, so commercial demand remains largely
      thesis-driven rather than evidenced.
    - >-
      The business is founder-centric and still thinly disclosed on governance, bench depth, preferences, debt
      structure, and execution controls.
  unresolvedGaps:
    - >-
      Public sources do not disclose wafers per hour, overlay, uptime, yield, or defect-density data for Substrate's 300
      mm tool, leaving manufacturability unresolved.
    - >-
      No paying customers, capacity reservations, letters of intent, or qualified pilot programs are publicly named as
      of the run date.
    - >-
      The eventual financing stack for commercial fabs—including debt, project finance, grants, customer prepayments,
      and dilution terms—remains undisclosed.
    - >-
      Open sources do not reconcile Substrate's pre-disclosure seed history, board structure, preference stack, or
      formal governance controls well enough for late-stage underwriting.
