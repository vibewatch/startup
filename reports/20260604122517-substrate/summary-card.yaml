summary:
  headline: >-
    Substrate is pursuing a bold and strategically relevant U.S. lithography-and-foundry thesis, but the current public
    record still supports only a medium-confidence research-more stance: the company has fundraising momentum and
    intriguing technical signals, yet lacks customer, throughput, yield, and financing proof commensurate with its
    roughly $1 billion valuation.
