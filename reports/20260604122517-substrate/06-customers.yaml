    "number": 6,
    "title": "Customers",
    "summary": "Public evidence as of 2026-06-04 shows no named Substrate customers, pilots, or production deployments. The chapter therefore separates Substrate's likely buyer segments — AI chip designers, hyperscalers, and sovereign manufacturing programs — from analog foundry proofs such as Microsoft/Intel, MediaTek/Intel, and Tenstorrent/Rapidus, which show the bar buyers require: named design wins, onboarding infrastructure, and long-term supply credibility. Because Substrate has not yet disclosed customer proof, retention metrics, or concentration data, the customer thesis remains plausible but unvalidated."
