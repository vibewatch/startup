    {
      "id": "implications-and-diligence-path",
      "title": "Customer underwriting remains a diligence question, not a closed proof point",
      "body": "The customer conclusion is therefore narrower than the product or market thesis. Substrate's buyer logic is legible: if advanced AI and robotics demand keep rising, and if sovereign manufacturing becomes strategically valuable, then there is a plausible set of customers that should want more resilient leading-edge wafer supply. But public customer evidence has not caught up to that story. Heise explicitly questions whether the approach can be implemented on a reasonable timeframe, and TechInsights notes both the absence of a product for sale and the industry inertia created by locked-in tool sets and already-committed roadmaps. For an investor, the next customer diligence step is not to ask for more logos. It is to ask for exact proof packages: named reference customers, pilot or qualification milestones, sample commercial terms, onboarding workflow, and top-account exposure under realistic ramp assumptions. Until those materials exist, the appropriate stance is that Substrate may have a believable customer hypothesis, but it does not yet have public customer proof comparable to the named, quote-backed, process-specific evidence available for incumbent and near-incumbent analogs.",
