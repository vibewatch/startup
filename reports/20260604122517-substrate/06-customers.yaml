    {
      "id": "public-proof-and-segment-inference",
      "title": "Public customer proof is absent, so the customer map must be inferred",
      "body": "The most important customer fact in public view is a negative one: Substrate's reviewed official surfaces — homepage, About, Our Purpose, News, Contact, Careers, and Information to Atoms — describe the mission, technology, and manufacturing ambition, but they do not disclose named customers, production deployments, pilot programs, customer quotes, or case studies. TechInsights goes further and describes the company as a stealth startup with no product for sale, while Heise notes that the company has revealed few technical details and no concrete timeline. That means this chapter cannot responsibly treat customer traction as proven. It can, however, infer likely first buyers from the company's own framing and from adjacent foundry behavior. Substrate is explicitly trying to build vertically integrated semiconductor fabs for advanced AI-era silicon, so the most plausible early economic buyers are frontier silicon teams that need leading-edge capacity, resilient supply, or sovereign manufacturing optionality: hyperscalers, fabless AI accelerator companies, and government-backed programs. The day-to-day users would be chip architects, mask and process-integration teams, and manufacturing-operations groups, while the budget owner would sit in silicon procurement, NRE, or sovereign-capacity programs rather than in software IT.",
