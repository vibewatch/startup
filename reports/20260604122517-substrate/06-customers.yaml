      "id": "durability-expansion-and-concentration",
      "title": "Durability and concentration remain unscored for Substrate itself",
      "body": "No public Substrate source discloses customer count, renewals, churn, NRR, GRR, contract length, deployment utilization, satisfaction scores, or top-account concentration. That means durability cannot be underwritten directly. The closest public proxies are analog. MediaTek's quote about a long-term partnership with Intel suggests that once a foundry becomes part of a customer's supply strategy, the relationship can be intentionally multi-program and multi-year. TSMC's own customer systems make the same point operationally: eFoundry covers design, engineering, logistics, yield, quality, and lot-status data; mask services sit at the interface between designers and fabs; CyberShuttle lowers prototyping NRE by up to 90 percent and has delivered hundreds of multi-project wafers; and the Value Chain Alliance helps startups reach production through intermediaries. Those services create deep process lock-in. But the same evidence also sharpens concentration risk. The Register reports that Rapidus may only be able to serve roughly half a dozen customers at the onset, showing how a new foundry can move from no revenue visibility to a handful of strategically dominant accounts very quickly. Substrate is still pre-proof, so today's risk is not measured concentration — it is the inability to measure concentration, retention, or expansion at all from public evidence.",
