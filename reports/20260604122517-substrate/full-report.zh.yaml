      - number: '7.2'
        title: 运营、工艺与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，核心问题不是 Substrate 有没有差异化想法，而是公司能否把已披露的证明点变成可重复、整片晶圆、晶圆厂级生产。官方材料最能证明科学抱负和早期技术里程碑：Substrate 称自己拥有内部生产质量级
              300 mm 工具、12 nm 级结果，以及 AlphaEvolve
              显著加速的仿真栈。但这些说法都没有回答真正决定成本和客户认证的制造问题。公开来源仍未披露每小时晶圆数、套刻精度、正常运行时间、缺陷密度、良率、维护间隔或服务负担。


              这个缺口重要，因为独立行业来源把先进光刻定义为生态系统问题，而不是单一来源突破。ASML、IRDS 和 NIST
              都把这套堆栈描述为依赖光学、工件台、掩模、光刻胶、计量、模型和现场管理的系统。TechInsights 和 TrendForce
              从怀疑的一侧也在强调同一点：证明一个工艺步骤或一次小图形演示，不等于认证一家晶圆代工厂所需、横跨数千个步骤的生产流程。历史 X-ray 文献也强化了这条警告：X-ray
              光刻长期背负与光源基础设施相关的成本和吞吐惩罚。安全准备同样披露不足。OSHA、EPA 和 CHIPS 环境材料都描述了沉重的合规负担，但没有公开来源披露 Substrate
              特定的质量认证、辐射控制或事故历史。因此，即使物理层面的论证继续改善，残余运营风险仍然是关键风险。
