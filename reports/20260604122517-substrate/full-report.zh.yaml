        - id: commit
          label: 初始项目承诺
          detail: 证据足够后，客户签下第一个真实项目或产能承诺。
        - id: expand
          label: 扩张 / 深化
          detail: 如果首个项目成功，客户会增加更多芯片项目、封装需求或多年规划。
      edges:
