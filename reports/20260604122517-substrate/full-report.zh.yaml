  - id: TV005
    title: 投资逻辑破裂和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 吞吐量和良率证明仍停留在私下
        - 到下一次融资事件前，仍没有独立的每小时晶圆片数、正常运行时间或缺陷率证据。
        - 没有生产质量级证明，低成本晶圆逻辑无法承销。
        - 不要只凭头条技术叙事追加资本。
      - - 锚定客户证据没有出现
        - 尽管工具有进展，仍没有披露预留、试点合同或战略包销。
        - 估值仍是技术期权，而不是商业平台。
        - 承销当前估值前，必须看到客户文件。
      - - 晶圆厂融资仍模糊
        - 没有与首座晶圆厂建设匹配的可信债务、政府支持和股权组合。
        - 数十亿美元资本开支风险会直接传导为稀释或项目延期。
        - 假设下轮降价融资风险，并下调投资逻辑评级。
      - - 替代同行在现有生态内推进更快
        - Canon NIL 或 xLight 式替代方案比 Substrate 的整合模式更早拿出证明。
        - 差异化叙事收缩，而在位厂商守住其余技术栈。
        - 重置护城河假设，并要求更低入场价格。
      - - 成本桥无法对齐
        - 管理层无法说明 $10,000 晶圆目标如何由吞吐量、良率和折旧假设推导出来。
        - 支撑价格的叙事失去核心经济主张。
        - 无论技术新意如何，都把估值视为偏高。
      - - 到后期轮次披露质量仍薄
        - 股权结构表、治理和运营指标仍比后期同行明显不透明。
        - 退出准备度仍低，公开市场可比性依旧弱。
        - 维持继续研究或更差的建议。
    notes: 这些触发项是可监测事件，会切断从私人叙事到可投估值的承销桥，而不是泛泛的创业公司风险。
