      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的第一批经济买方，是需要先进制程晶圆准入或本土代工可选性的组织：无厂 AI
              芯片公司、构建自研硅片的超大规模云厂商、政府支持项目，可能还有评估合作路线的既有晶圆厂。日常用户则是工程专家——设计使能团队、光刻工程师、工艺整合负责人、掩模团队和封装组织——因为先进制造的采用先是技术问题，之后才是商业问题。付款方同样不是按席位购买的软件预算，而是硅片采购预算、晶圆厂资本开支委员会，或公共项目拨款。TSMC
              的掩模与 CyberShuttle 服务、Intel 的代工加封装模型，以及 Mordor
              所示以代工厂为主的终端用户结构，都指向同一条采用顺序：拿到试点晶圆，跑通设计流程，证明套刻和良率，展示可靠性，然后转成长周期晶圆或产能承诺。这条顺序对 Substrate 很关键，因为它解释了为什么早期 R&D
              或联盟验证不等于商业规模，也解释了为什么即使近期收入难以承销，市场仍可能有吸引力。
