        title: 信任、质量、合规与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              Substrate 确实有一些公开可见的信任信号，但它们主要是技术性的，而不是认证驱动的。公司描述了无空气传播的 X
              射线光路、对振动的极端敏感性，以及仿真驱动的缺陷预测，说明它清楚工艺控制和环境稳定性是门槛因素。更广泛行业来源也强化了这一点：成功的先进光刻需要深度量测、模型验证、材料纪律和支持工具，而不只是一个强大光源。缺失的是大型客户、监管机构和制造伙伴通常预期的常规尽调界面。公开资料没有晶圆级良率或缺陷密度指标，没有合格掩模或抗蚀剂伙伴名单，也看不到辐射控制、ISO
              式认证或晶圆厂质量体系等安全或质量框架。因此，本章主要信任结论是混合的：工程问题被可信地框定，但生产治理层仍大多留在私下。
