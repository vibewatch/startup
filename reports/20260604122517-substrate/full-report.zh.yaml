      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              Substrate 的情景分析应以里程碑为基础，而不是以 DCF 为基础，因为公开证据没有披露当前收入、毛利率、利用率或客户承诺。因此，乐观情景需要三个相互连接的事件：独立证明内部 300 mm
              工具能交付可信吞吐和良率；锚定客户或政府背书需求把技术进展转化为商业验证；融资栈以显著低于现状的资本强度，把公司从 R&D
              规模桥接到晶圆厂规模。如果这些里程碑落地，今天的价格可能被证明偏保守，因为市场会开始给一个差异化的本土制造平台定价，而不是给一家投机性光刻创业公司定价。


              基准情景更平。沿着这条路径，Substrate
              继续证明技术并融资，但在披露客户预留、已实现定价或完全融资到位的晶圆厂计划之前，就先走到下一次融资节点。在这种世界里，当前估值可以守住，但仅靠公开证据很难扩张。悲观情景更容易从公开材料中论证：如果认证延误、融资仍然模糊，或者相邻替代方案在现有晶圆厂内部进展更快，公司下一轮成交价可能明显走低。这也是为什么尽管公开口径的私募估值已经可见，回报区间仍然很宽。
