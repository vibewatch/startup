  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 公开客户验证缺席，因此客户图谱只能推断
        blocks:
          - type: paragraph
            body: >-
              公开视野中最重要的客户事实是一个负面事实：Substrate 已审阅的官方界面——主页、About、Our Purpose、News、Contact、Careers 和 Information to
              Atoms——描述了使命、技术和制造抱负，但没有披露具名客户、量产部署、试点项目、客户引语或案例研究。TechInsights 进一步把公司描述为一家没有在售产品的隐身创业公司；Heise
              则指出，公司披露的技术细节很少，也没有具体时间线。这意味着本章不能负责任地把客户牵引视为已证明。不过，可以从公司自身表述和相邻代工行为推断可能的第一批买方。Substrate 明确试图为 AI
              时代先进硅片打造垂直整合半导体晶圆厂，因此最可信的早期经济买方，是需要先进制程产能、韧性供应或主权制造可选性的前沿硅片团队：超大规模云厂商、无厂 AI
              加速器公司和政府支持项目。日常用户会是芯片架构师、掩模和工艺整合团队、制造运营团队；预算所有者则会坐在硅片采购、NRE 或主权产能项目里，而不是软件 IT。
