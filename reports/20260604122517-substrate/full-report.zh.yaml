  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Substrate 当前公开价格信号是私募轮估值，不是经营倍数。多家媒体报道称，公司融资超过 $100 million，估值约为或高于 $1
              billion；公司和投资人材料则把这笔资本的用途放在垂直整合的美国制造抱负上，而不是狭窄的单点工具业务。乐观解读很清楚：如果 Substrate 真的能把先进制程晶圆推向其所说的 $10,000 目标，并在
              2028 年左右实现量产，它可能同时掌握赋能光刻步骤，并比传统设备供应商吃到更大一部分制造经济性。


              在这个入场价格下，反向逻辑同样重要。公开证据仍未披露收入、客户数、订单积压或已实现晶圆定价；管理层自己也表示，长期规模化可能需要数十亿美元，甚至随着多座设施建设需要数百亿乃至上千亿美元。这意味着当前估值被要求跨越一个异常大的缺口：一端是早期技术证明，另一端是最终工业化。在
              $1 billion 估值下，投资人承销的不是一个已披露的经营业务，而是一套未来证明栈；它仍需要客户认证、融资和工艺数据。
