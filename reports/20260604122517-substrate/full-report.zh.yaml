      - number: '4.5'
        title: 图表
        blocks:
          - type: callout
            title: 已披露股权融资相对晶圆厂级抱负很小
            body: >-
              公开来源从多个角度支持同一结论：超过 $100 million
              对半导体创业公司是有意义的早期资本，但相对管理层自己以数十亿美元描述、且公开晶圆厂可比项落在数百亿美元区间的战略而言很小。融资缺口因此是结构性的，不是临时麻烦。
