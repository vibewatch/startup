      - number: '3.2'
        title: 能力、定价与进入市场对比
        blocks:
          - type: paragraph
            body: >
              Substrate 与既有巨头之间的能力差距，关键不在替代光刻概念是否存在，而在这些概念是否已经在先进晶圆厂所需的吞吐量、套刻和认证水平上得到证明。ASML 已经销售工业化 EUV 工具，其最新 High-NA
              系统据报单台最高约 $400 million，这既凸显了现状路径的惊人成本，也凸显了既有资本基础的规模。Canon 的 NIL
              系统在概念上有颠覆性，因为它避开特殊波长光源，瞄准先进线宽，并声称能耗和拥有成本更低；但它自己的公开路线图仍围绕未来的污染、吞吐量和套刻里程碑。xLight 同样承诺更强、更高效的 EUV
              光源，但公开证据仍是原型资金和 CHIPS 奖励，而不是晶圆厂部署。


              在代工侧，TSMC 和 Intel Foundry 与 Substrate 竞争，不是靠替换光刻物理，而是销售制造结果。TSMC 的 N2
              节点已经量产，并配有客户群、晶圆产能和封装生态，这是激进新进入者无法匹配的。Intel Foundry 把 18A、2D/2.5D/3D 封装和晶圆 shuttle 原型打包成系统级代工方案；Rapidus
              则推销基于 IBM 工艺 know-how 的未来 2 nm 制造周期。公开价格信号强化了这种不对称。TSMC 2 nm 晶圆在市场上已被讨论到约 $30,000；ASML High-NA
              设备定价在公开层面可见，达到数亿美元级别；Canon 也公开把 NIL 描述为明显低于 EUV 的成本。相比之下，Substrate、Intel Foundry、Rapidus 和 xLight
              仍很少披露已实现商业定价，这意味着销售更像协商式企业销售，而不是广泛标准化目录。
