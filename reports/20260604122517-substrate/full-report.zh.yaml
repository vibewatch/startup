      - number: '2.2'
        title: 规模测算视角：自上而下需求强，Substrate 专属精度弱
        blocks:
          - type: paragraph
            body: >-
              大需求池没有争议。SIA 称 2025 年半导体销售额达到 $791.7 billion，并正朝 2026 年约 $1 trillion 迈进；AI、存储和 2nm 继续爬坡，SEMI 预计前道晶圆厂设备支出将在
              2025 年达到 $110 billion、2026 年达到 $130 billion。更难的问题，是这条栈应收窄到哪里。公开分析师对光刻层的看法彼此矛盾，但仍有用。Mordor 估算 2025
              年半导体光刻设备为 $27.83 billion、2026 年为 $30.44 billion；IMARC 估算更广义的光刻系统市场 2025 年为 $10.8 billion；IMARC 的光刻细分为
              $17.1 billion；Market Research Future 则落在 $11.74
              billion。这些区间不是证据缺陷，而就是证据本身。出版方衡量的是不同外壳：光刻系统、光刻设备，或半导体光刻设备。因此，严谨结论不是伪造一座 TAM/SAM/SOM
              金字塔，而是承认存在真实的数十亿美元资本开支和设备市场，但没有公开来源能切出干净的 Substrate 专属 SAM 或 SOM。任何投资人模型都必须保留这份不确定性，而不是把它变成伪精确。
