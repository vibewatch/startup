  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与技术论点
        blocks:
          - type: paragraph
            body: >-
              Substrate 把自己定位成新的美国半导体代工厂，而不是单一用途的设备供应商。公司的法律材料把场地运营方标识为 Substrate Inc.；公开报道则把业务放在旧金山，并称 James 和 Oliver
              Proud 兄弟于 2022 年创立公司。官方文案对使命说得很直接：打造美国下一代半导体代工厂，靠基于粒子加速器的 X 射线光刻栈延续摩尔定律，同时降低晶圆厂和晶圆成本。


              截至报告生成日，公司仍像是量产前项目。报道一致指向 2028 年首颗芯片或量产目标，也就是说公开验证主要是技术层面，而不是商业层面。官方材料最有力的地方在产品描述：对标 High-NA / 2 nm
              分辨率目标、12 nm 级打印结构、内部生产级 300 mm 工具，以及相比现有路径大幅降低晶圆成本的路线图。这让 Substrate 作为先进制造平台很值得分析，但作为运营中的晶圆代工业务仍处早期。
