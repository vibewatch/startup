      - number: '1.4'
        title: 里程碑、政府接触与反向证据
        blocks:
          - type: paragraph
            body: >-
              即使商业披露稀疏，仍能拼出一条可用时间线。公司似乎成立于 2022 年，由 General Catalyst 在种子轮低调支持，并在公开亮相前完成了如今披露的超过 $100 million 轮次。到 2025 年
              3 月，副总统 JD Vance 据称已经会见 James Proud，显示这个故事已经进入政策和国家安全视野。2025 年 10 月的公开发布报道随后把投资人财团、2028 年生产目标，以及 Substrate
              既能降低设备和晶圆成本、又能帮助先进制造回流美国的主张串在一起。


              最强的具名技术里程碑，是 2026 年 4 月 7 日的 “Information to Atoms” 文章：它把 AlphaEvolve
              辅助仿真增益和具体打印样例放在一起。不过，反向记录同样重要。独立报道反复指出同一个瓶颈：能打印出令人印象深刻的图形，不等于证明了高吞吐、整片晶圆、经济上可靠的制造。Heise
              也提到技术披露有限，且缺少具体商业时间线。因此，本章同时有真实里程碑主线和真实外部怀疑——这正是一个可能重要、但仍高度依赖执行的深科技公司的画像。
