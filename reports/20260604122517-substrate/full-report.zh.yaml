      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论很直接。收入质量尚未证明，因为没有披露收入、积压订单、客户数、定价表或合同证据。利润率路径只有在 Substrate
              能兑现公司声称的晶圆成本改善、同时解决吞吐量、利用率和服务经济性时才有概念吸引力，而既有巨头为这些问题打磨了数十年。资本强度是主导风险：公开记录已经指向的资金需求，比迄今披露的股权融资高出多个数量级。


              本章难以承销，不是因为某一个红旗，而是仍缺大量私有证据。开源资料没有提供管理账、逐场地资本开支预算、提款时间表、债务或 CHIPS
              申请状态、客户预订，或当前现金预测。没有这些材料，本章可以把公司抱负与公开晶圆厂可比项比较，但无法有把握地计算现金跑道、客户回本、毛利率桥或融资时点。


              尽调负担因此前置。在把 Substrate
              作为财务机会而不是技术登月项目承销前，投资人需要看到实际流动性状况、精确资金用途跟踪、融资栈、客户承诺证据，以及解释公司如何从工具验证跨到晶圆厂验证的资本计划。在此之前，公开案例更像一个收入前、高资本开支的制造颠覆期权，而不是可融资的运营业务。
