  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Substrate
              的产品最好理解为计划中的代工平台，而不只是一个特殊光源。公司明确称自己在建设下一代美国半导体代工厂，并把这种定位和垂直整合经济性叙事放在一起：更低晶圆厂成本、更低晶圆成本，以及最终的本土供应链控制。从客户工作流看，公开材料隐含一条循环：从目标层或芯片设计开始，经过
              ILT/OPC 密集的仿真和工艺调优，在 300 mm X 射线工具上打印，再把量测结果反馈到下一轮迭代。今天最强的公开验证仍在图形化和仿真层，而不是客户交付层：Substrate 已展示 12 nm
              级单次曝光金属图形结果，并披露 AlphaEvolve 辅助带来的巨大计算增益，但尚未发布外部无厂客户在未来平台上 tape out 所需的 PDK、支持模型或运营手册。
