  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 独立吞吐量和良率证明落地；出现锚定客户或政府背书预留；公司拼出可信的晶圆厂融资栈。
        - 公允价值扩张到约 $1.5B-$2.5B，或约为当前估值的 1.5x-2.5x，因为市场开始为有资金支持的平台定价，而不是为未获资金的假设定价。
        - 技术证明必须先于融资疲劳到来，也要先于相邻替代方案夺走低成本图案化叙事。
        - 低
      - - 基准
        - 工具证明改善，故事仍可融资，但客户披露和完全获资的晶圆厂仍未落地。
        - 公允价值大致停在 $0.8B-$1.2B，较当前估值接近持平到小幅上行，因为市场仍必须跨过重大未知。
        - 如果下一轮融资买的是证明而不是规模化生产，即便估值持平也可能造成实质稀释。
        - 中
      - - 悲观
        - 认证滑坡或客户证据继续缺席，同时融资缺口仍以数十亿美元计。
        - 公允价值压缩到约 $0.2B-$0.6B，意味着相对当前估值出现下轮降价融资。
        - 即便技术没有失败，只要资本强度和披露缺口压倒投资人对建设的出资意愿，下行也会发生。
        - 中
    notes: 情景区间是基于里程碑的估值判断，单位为十亿美元。公开证据在收入和现金转化上太薄，无法支撑 DCF 级模型。
