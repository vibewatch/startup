  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Substrate 当前私人轮次
        - 私人融资信号
        - '> $100M 融资，估值约 $1B 或以上'
        - 这是本章评估的实际入场价格。
        - 公开信息没有披露收入、客户或股权结构细节，无法校准该估值。
      - - ASML
        - 公开市值加监管文件支撑的运营规模
        - $665.36B 市值（2026 年 6 月）；2025 年净销售额 €32.7B；High-NA 工具最高 $400M
        - 直接的光刻在位厂商基准，展示已验证工具经济性和披露应有的样子。
        - 成熟垄断经济性不能直接对比一家商业化前创业公司。
      - - TSMC
        - 公开市值加当前先进制程量产状态
        - $2.264T 市值（2026 年 6 月）；N2 已量产；534 个客户；2025 年 >17M 片 12 英寸等效晶圆
        - 这是 Substrate 最终想挑战的制造结果中，最好的晶圆代工结果基准。
        - TSMC 远比 Substrate 成熟，且已在巨大规模上运营。
      - - Intel Foundry
        - 公开市值加捆绑式系统代工服务
        - $566.48B 市值（2026 年 6 月）；前端制造加封装与测试
        - 具备广泛服务栈的美国本土一体化制造基准。
        - Intel 是多元化在位厂商，本身还有转型复杂性。
      - - Canon NIL
        - 公开市值加替代图案化状态
        - $23.87B 市值（2026 年 6 月）；NIL 工具已发布；当前线宽 14 nm，并声称有 10 nm 路径
        - 显示市场上已经存在成本更低的图案化替代方案。
        - Canon 是多元化集团，NIL 只是其价值的一部分。
      - - xLight
        - 私人里程碑参照
        - 2025 年 $40M Series B，加 2026 年 $150M CHIPS 奖励
        - 最接近的相邻替代光源创业公司参照。
        - xLight 未披露估值，也没有晶圆代工业务。
      - - Applied Materials
        - 公开市值
        - $397.59B 市值（2026 年 6 月）
        - 工具经济性基准，显示公开市场给予已验证半导体设备特许经营权的价值。
        - 不是以光刻为牵引的晶圆代工挑战者。
      - - Lam Research
        - 公开市值
        - $429.83B 市值（2026 年 6 月）
        - 另一个大型公开设备基准，用于参照装机基础和服务经济性。
        - 不是以光刻为牵引的晶圆代工挑战者。
      - - KLA
        - 公开市值
        - $277.59B 市值（2026 年 6 月）
        - 显示公开市场仍然给予已验证计量和过程控制特许经营权很高估值。
        - 不是直接的制造平台类比对象。
    notes: 这张表混合了私人融资信号、公开市值和里程碑参照，因为 Substrate 缺少做干净倍数法创业公司估值所需的披露收入。所有数值均为 2026-06-04 的公开参照。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Exhaustive across every retained valuation benchmark used in this chapter: the current Substrate round, direct
        lithography and foundry incumbents, adjacent alternative-patterning references, and public
        semiconductor-equipment peers reviewed on 2026-06-04.
