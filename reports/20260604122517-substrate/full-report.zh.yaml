      - CV044
      - CV049
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表与优先股堆叠
        - 清算优先权、反稀释条款、认股权证、债务契约，以及任何政府介入权。
        - 如果条款明显保护投资人，表面估值持平也可能让普通股入口很差。
        - 向管理层法律顾问索取最新股权结构表、投资条款清单和融资模型分配瀑布。
      - - 客户需求证明
        - 已签署的试点协议、晶圆预留、预付款，或战略包销承诺。
        - 客户证据最能区分真实平台需求和新闻热度。
        - 索取脱敏客户合同和管线阶段报告。
      - - 设备吞吐与质量
        - 来自 300 mm 设备的每小时晶圆数、正常运行时间、套刻、缺陷率、良率和维护周期数据。
        - 没有量产级证据，估值就无法从投资逻辑变成经营案例。
        - 审阅工程测试报告和独立晶圆厂合作方验证。
      - - 晶圆厂融资方案
        - 分站点资本开支、债务承载力、CHIPS 或州级激励状态，以及预期股权资金需求。
        - 管理层自己也称规模化可能需要数十亿美元，融资结构因此直接决定回报。
        - 任何价格决定前，先搭完整的首座晶圆厂融资模型。
      - - 单位经济桥
        - 从据称行业晶圆成本走向 $100,000 的轨迹，推导到公司宣称 $10,000 目标的自下而上路径。
        - 收入出现前，愿意为上行买单的核心理由就是成本逻辑。
        - 让外部专家核对折旧、吞吐、良率、服务和利用率假设。
      - - 治理与退出准备度
        - 董事会权利、报告节奏、审计准备度，以及达到公开市场质量的 KPI 定义。
        - 如果公司最终需要大规模资本池，后期私募价格不能只靠创始人叙事支撑。
        - 在把公司视为 IPO 轨道或后期成熟标的前，先设定信息披露清单。
    notes: 这些尽调要求聚焦支撑当前价格所缺的桥接项，而不是泛泛的创业公司尽调好奇心。
    claimRefs:
      - CV002
      - CV003
      - CV009
      - CV033
