  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 只有证明或价格改善时才继续跟进；当前公开证据不足以支持买入判断。
      - - 置信度
        - 中
        - 市场背景清晰，但决定性估值输入仍在私下。
      - - 风险评级
        - 高
        - 新的光源物理、新的晶圆厂经济性和数十亿美元融资依赖叠加，形成复合执行风险。
      - - 估值立场
        - 偏高
        - 据报道约 $1B 的估值，走在已披露收入、客户、吞吐量和融资证明前面。
      - - 持有 / 退出姿态
        - 等待里程碑降风险
        - 只有经过更深尽调或拿到更好入场价格后，才把该头寸视为长周期期权。
      - - 什么会提升判断
        - 客户与融资证明
        - 披露需求信号叠加可信的晶圆厂融资，比泛泛的公司质量改善更可能快速上调建议。
    notes: 这是价格敏感的摘要，不是泛泛的公司质量评分。同一技术逻辑若入场价格更低，或里程碑证明更强，可能对应不同建议。
