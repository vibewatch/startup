  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与政策门槛风险
        blocks:
          - type: paragraph
            body: >-
              排名第一的非技术风险在于，Substrate 的本土晶圆代工逻辑离不开美国监管和法律流程。一家公司想从有希望的 300 mm 光刻演示走向获得资金支持的晶圆厂，靠的不是物理学本身：它还需要符合 CHIPS
              资格的项目结构、空气和废弃物许可、公用事业审批、危险材料管控、职业辐射流程，以及能经得起环境审查的选址方案。公开材料目前还看不到这些针对公司的工作流。这个缺口重要，因为 CHIPS
              支持是有条件的，不会自动落袋；公开规则也比普通资助项目更严。CHIPS Act 文本、护栏条款解读和 Commerce 材料都指向一项 10
              年限制：不得在受关注外国国家进行实质性扩张，洁净室面积变化、技术事项或联合研究事项都明确落在合规边界内。


              出口管制又叠加了一层政策风险。BIS 2024 年 12 月的一揽子措施扩大了对半导体制造设备和软件工具的管制范围，说明即使是一家美国创业公司，相关供应商生态仍然高度依赖合规。再往上，NIST 的环境评估和
              EPA 的半导体空气有毒物规则表明，晶圆厂建设与空气质量、危险材料、废弃物、水、健康和安全审查绑定在一起。因此，监管结论是严重程度高，并不是因为 Substrate
              披露过违规，而是公开记录还没有显示能降低从工具走向工厂风险的选址、许可、所需协议或 IP 清理。
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR028
              - CR029
              - CR030
