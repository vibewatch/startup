        title: 类比代工验证显示 Substrate 尚未跨过的采用门槛
        blocks:
          - type: paragraph
            body: >-
              由于 Substrate 自身没有发布客户验证，最强的公开证据来自类比代工关系，它们展示了真正采用长什么样。Intel 的 Microsoft 公告是清晰的设计赢单验证：具名超大规模云厂商、CEO
              引语、具名节点和明确供应理由。Intel 的 MediaTek 合作展示了另一种模式：客户用挑战者代工厂分散供应，承诺多个芯片，并明确称这是一段长期关系。Rapidus 和 Tenstorrent
              则展示了创业型代工厂版本的同一条弧线。它们的公开验证并不是从泛泛 logo 开始，而是先有具名日期的联合 IP 协议，再推进到具名日期的开发与制造项目，之后行业报道又把 Tenstorrent
              描述为早期合同赢单。同样重要的是，既有代工厂显示客户采用的是一套服务系统，而不是裸工艺节点。TSMC 围绕晶圆关系叠加掩模服务、CyberShuttle 原型、eFoundry 物流和工程可见度，以及 Value
              Chain Alliance 伙伴；Intel 则营销封装、软件 / 服务、生态联盟和 shuttle 项目。Substrate 未来也许会提供类似 onboarding
              和支持，但公开证据尚未显示这些面向客户的系统。这个缺口解释了为什么具名类比验证在这里有用：它展示了买方通常在把严肃硅片项目交给新制造平台前，会要求的参考质量、具体性和工作流脚手架。
