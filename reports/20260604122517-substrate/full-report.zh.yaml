      - number: '8.4'
        title: 建议、信心、风险评级与监测逻辑
        blocks:
          - type: paragraph
            body: >
              仅基于公开信息的建议是继续研究。长线逻辑是真实的：美国锚定、替代今天 ASML 加 TSMC 堆栈的方案，确实承受着地缘政治和成本压力；Substrate
              也围绕这个想法吸引了可信投资人。但建议必须对价格敏感。估值约 $1 billion
              时，公司已经要求投资人为一个未来状态买单：工具能规模化运行、需求出现、多十亿美元融资完成。公开证据仍让这些步骤之间的承销桥梁大多空白。


              这也带动了其余评级。信心为中，因为融资背景、基准组和核心技术叙事都能从公开来源读清楚；但决定估值的证据——吞吐、良率、客户、定价和资本结构——仍然是私有信息。风险为高，因为公司同时在尝试新的光源架构、新的代工模式，以及管理层自己称可能扩大到数十亿美元规模的资本项目。监测这个故事的正确方式，不是泛泛看创始人或市场热情，而是用与证明、融资和客户采用绑定的明确投资逻辑破裂触发器。
