      - number: '5.2'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              公开披露描述的是一套从加速器物理开始、但只有多个额外子系统同时解决后才有用的栈。Substrate 的 X 射线源使用 RF
              腔、电子束、磁体、光学和精密运动系统；其上还要叠加掩模、抗蚀剂、光刻胶化学和计算光刻软件，后者必须以足够保真的方式建模完整工艺，才能具备预测性。这就是 AlphaEvolve 故事重要的原因：即使 EUV
              既有领导者也说，先进节点制造离不开计算光刻；行业路线图也显示，High-NA 本身仍依赖掩模、光源改进、随机缺陷控制和全芯片建模。因此，Substrate
              的运营模型不像一台单点突破机器，更像试图把整个光刻生态压缩进一家创业公司。这让架构具备差异化，但也意味着关键依赖仍分散在材料、光学、计算、量测，以及与晶圆厂其余流程的整合上。
