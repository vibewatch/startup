      - number: '3.4'
        title: 护城河耐久性与被替代风险
        blocks:
          - type: paragraph
            body: >
              把 Substrate 的护城河主张视为一组捆绑时最可信：如果粒子加速器驱动的 X
              射线光源、自研光刻设备和垂直整合的本土代工厂能够一起跑通，公司可能拥有一条差异化制造栈，而不只是其中一个组件。问题在于，这个捆绑中的每个组件都已经被不同对手群体挑战。ASML 和 TSMC
              已经掌握受信任的先进节点路径。Canon 推销低能耗、低成本图形化。xLight 推销来自加速器的下一代光源。Intel Foundry 和 Rapidus
              推销本土或主权制造相关性，同时不要求客户押注全新的曝光物理。因此，只有当整合创造出大于相邻替代方案之和的复合优势时，护城河才真实存在。


              反向证据指向漫长采用周期和既有巨头的快速反应。TSMC 据报因成本推迟广泛采用 High-NA，说明即便资本最充足的晶圆厂，也会挑选新光刻步骤在经济上合理的时点。IEEE 对 Canon NIL
              的分析强调，即使经历二十年发展，缺陷控制、套刻精度和吞吐量仍是门槛指标。xLight 的 2025 年股权融资和 2026 年 CHIPS
              奖励验证了投资人和政策兴趣，但也凸显替代光源公司距离商业规模仍有多远。在这种背景下，Substrate
              最大的风险不是某个一击致命的对手，而是在自家整合栈进入量产前，同时被既有生态、相邻技术替代者和其他政策支持的制造进入者从三个方向挤压。
