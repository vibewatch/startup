      - number: '7.3'
        title: 依赖、融资与市场进入风险
        blocks:
          - type: paragraph
            body: >-
              财务和依赖风险是最可能打断投资逻辑的一层，因为 Substrate 的策略把几个难题同时叠在一起。公开报道称，公司融资超过 $100 million，估值约 $1
              billion。这对创业公司是有意义的资本，但相对于 Substrate 自己和外部报道描述的经济账，规模很小。公司自己的使命页面称，先进制程晶圆厂成本今天约为 $25 billion，到 2030 年超过
              $50 billion；TechSpot 和 China Strategy 引述的目标则可能最终需要数十亿美元，甚至跨多座设施投入数百亿乃至上千亿美元。即便 CHIPS
              支持很慷慨，也改变不了数量级；公共项目按里程碑拨付且覆盖不完整，不能替代完整资本栈。


              商业模式还让供给侧和需求侧都出现集中。Data Center Dynamics 称 Substrate
              想要的是自己的晶圆厂网络，而不是单纯卖工具，这意味着在规模化收入到来之前，公司就要依赖选址、公用事业、许可、设备供应商、软件供应商和未来外部融资方。Sacra
              对买方的描述显示，第一批商业客户很可能是少数先进制造商、国防相关项目，以及后续晶圆代工厂，而不是销售周期很短的广阔市场。与此同时，公开记录仍未披露收入、订单积压、具名试点或已签署客户承诺。风险传导很直接：如果客户认证滞后，而资本开支和许可仍在推进，Substrate
              在证明持久市场拉力之前就会面临融资挤压。
