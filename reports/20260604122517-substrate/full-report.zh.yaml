      - number: '1.2'
        title: 创始人、领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              公开可见的领导层图景很窄。外部报道持续把 James Proud 列为联合创始人兼 CEO，并称 Oliver Proud
              是他的联合创始人，但公司官方公开页面没有展示董事会名单、委员会结构，或更完整的具名高管梯队。缺口很关键，因为公司战略同时牵涉前沿物理、深度制造、资本密集型扩张和面向政府的定位；创始人主导的叙事能带来动员力，也会把执行和融资风险集中在少数人身上。


              James Proud 的履历对尽调有双向含义。报道强调他的 Thiel Fellowship 和此前在 Hello
              的创业经历，说明他懂融资，也习惯押注有硬件属性的宏大项目。同一批报道也指出，两位创始人此前都不是半导体制造出身，这自然引出一个问题：真正护城河有多少在招募来的技术团队身上，而不是创始人本人。公开来源确实显示，团队来自主要实验室和芯片公司，但治理披露不完整，使关键人依赖仍是现实风险，而不是已经解决的问题。
