  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与牵引能见度
        blocks:
          - type: paragraph
            body: >-
              Substrate 的公开财务故事始于商业模式抱负，而不是运营证据。官方材料和投资人评论称，公司正在建设垂直整合代工厂；独立报道则称，已披露的超过 $100 million
              轮次用于光刻开发和制造建设，而不是轻资本软件模型。这意味着最干净的公开收入假设，是未来来自 Substrate 自有晶圆厂的晶圆或合同制造产出；任何工具、服务或耗材收入都仍属次要，也尚无商业证据。


              定价能见度比抱负薄得多。最强的公开数字不是当前客户价格，而是管理层目标：到本十年末，把晶圆成本拉近 $10,000，而现有行业路径可能走向约
              $100,000。已审阅来源没有披露价目表、已实现合同定价、最低订单量、预付款或客户积压订单。Substrate 自己的新闻页面发布的是媒体联系人，而不是商业胜利；开源数据库也早于 2025 年底已披露融资事件。


              因此，当前无法靠公开证据承销收入质量。本章可以描述变现逻辑，但无法描述收入结构、确认时点、管线转化或经集中度调整后的质量。仅凭开源资料，Substrate
              仍是一个商业化前的制造押注，没有披露客户需求、产能利用率或已预订收入的证据。
