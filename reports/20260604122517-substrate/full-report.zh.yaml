  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代栈
        blocks:
          - type: paragraph
            body: >-
              分析 Substrate 时，应对照一条窄支出栈，而不是整个半导体需求。公司把自己定位成围绕先进 X
              射线光刻打造的垂直整合代工厂，因此纳入支出应包括先进制程晶圆供应、工艺使能、掩模和原型服务，以及生产这些晶圆所需的先进光刻资本开支。排除项是从未触及先进制造选择的广泛半导体终端需求，以及通用电子、软件或仅测试预算。现状替代者不是某一家竞争创业公司，而是一条既有链条：ASML
              的 EUV 和 DUV 工具、TSMC 与 Intel 的晶圆代工生态、Nikon 的浸没式和封装工具，以及 Canon 成本更低的纳米压印路线。公开来源也解释了这条替代链为何黏性强。ASML
              指出，即使先进芯片仍依赖许多 DUV 层；TSMC 把掩模和 shuttle 视为连接设计方与晶圆厂的接口；Intel 则把封装和生态支持打包进代工方案。这意味着买方如果转向
              Substrate，改变的是整条生产路径，而不只是替换一台扫描仪。
