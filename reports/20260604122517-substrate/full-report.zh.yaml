      - number: '8.2'
        title: 可比公司组与公开证据能否支撑当前价格
        blocks:
          - type: paragraph
            body: >
              公开可比公司有助于框定价格，尽管没有一家完全匹配。ASML、TSMC 和 Intel 展示了先进节点制造能力已经被证明并持续披露后，公开市场会奖励什么。ASML 的年报和 SEC 轨迹显示，它是光刻龙头，2025
              年净销售额 €32.7 billion，有 20-F 申报记录，2026 年 6 月市值超过 $665 billion。TSMC 官方页面显示 N2 已进入量产，拥有 534 名客户，年产能超过 17
              million 片 12 英寸等效晶圆，同时 2026 年 6 月市值超过 $2.2 trillion。Intel Foundry 则为已经包含封装和测试的捆绑制造方案提供了本土基准。这些基准没有让
              Substrate 的 $1 billion 估值在绝对值上显得很大，但它们确实说明，更大估值背后有多少公开证明。


              相邻参照组让 Substrate 的当前估值更不舒服。Canon 已经在销售低成本纳米压印路线，xLight 也已经披露 $40 million Series B 和 $150 million CHIPS
              奖励，用于自由电子激光原型。这些参照意味着，低成本或替代光源叙事并不独特。合在一起，可比公司组没有让 $1 billion 看起来不可能，但确实让价格跑在公开证据之前：Substrate
              仍未拿出收入、客户、吞吐或融资披露，来让当前估值显得明显便宜。
