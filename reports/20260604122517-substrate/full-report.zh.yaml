      - number: '3.3'
        title: 切换成本、锁定、分销权力与供应准入
        blocks:
          - type: paragraph
            body: >
              既有巨头最强的护城河，不只是更好的光学或更多晶圆厂，而是围绕现有工具链形成的服务工程师网络、认证历史、软件流程、封装伙伴和采购习惯。ASML 的 EUV 历史、Nikon 的全球支持网络、TSMC 的 534
              个客户和 17 million 片 12 英寸等效晶圆产能、Intel Foundry
              的封装与测试栈，都指向同一个结构性优势：买方可以留在熟悉生态内，同时拿到先进节点产出。这很关键，因为先进晶圆厂只有在正常运行时间、缺陷率、套刻和成本曲线全部被证明后，才会采用新光刻。Canon 自己公开的 NIL
              路线图，以及 IEEE 对污染和吞吐量障碍的讨论也显示，即使可信的相邻替代方案，仍必须在现有工作流里赢得位置。


              这些切换成本对 Substrate 有双向作用。如果公司跑通，想要本土导向先进制程替代方案的客户，可能会把整合栈看得比另一个点状产品更有价值。但第一个买方承担的认证负担比 Canon 或 xLight 更重，因为
              Substrate 不是要作为单个组件供应商滑入现有晶圆厂。它要求买方同时相信新光源、新曝光架构和新代工运营模式。因此，多归属对工具层相邻方案更容易，对 Substrate 的全栈论点更难。晶圆厂可以评估 NIL
              或更好的 EUV 光源，而不放弃其余工艺栈；采用 Substrate 则意味着更深的工艺、供应商和供应链变化。这种动态让现状路径和近邻替代者比单纯“ASML 替代者”的标题比较更强。
            claimRefs:
