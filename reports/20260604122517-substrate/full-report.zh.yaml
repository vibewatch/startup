      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              核心财务承销问题是资本充足性，而不是近期烧钱优化。Substrate 已公开披露融资超过 $100
              million，报道称这笔资金用于工具开发和制造建设。但同一批报道也引用管理层关于未来需要数十亿美元的说法；如果公司跨多座设施扩张，部分评论还把需求扩大到数百亿甚至数千亿美元。这与公司自己对先进制程晶圆厂成本的官方表述一致，也与既有玩家所需公共支持包的规模一致。


              政府可比证据进一步放大缺口。NIST 称 Commerce 管理 $39 billion 半导体激励；Treasury 称 CHIPS 税收抵免通常为合格资产基础的 25%；仅 TSMC Arizona
              奖励就把最高 $6.6 billion 直接资金和最高 $5 billion 贷款，与超过 $65 billion 的计划晶圆厂投资捆在一起。GAO 的里程碑时间表延伸到 2033
              年，并明确把拨款与资本开支和商业里程碑绑定。换句话说，即使是对成熟运营方的公共支持，也是分阶段、有条件的，且动辄数十亿美元。


              Substrate 尚未公开披露在手现金、烧钱速度、现金跑道、债务工具，或公司自己的政府融资授予包。这只留下一个稳健的公开结论：已披露资本可以合理支持
              R&D、招聘和早期工具工作，但不足以自筹通往垂直整合先进制程制造的路径。外部融资依赖因此是结构性的，不是可选项。
