  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与分类
        blocks:
          - type: paragraph
            body: >
              Substrate 不应只和一家公司对标，因为它的公开抱负同时跨越半导体栈的多个层级。在曝光设备层，ASML 是工业化 EUV 光刻的主导既有巨头，Canon 正把纳米压印光刻推成更低成本的替代方案，Nikon
              则仍是老牌精密设备供应商，拥有全球半导体服务足迹。在晶圆代工层，TSMC 是现状替代者，客户规模无可匹敌且已拥有当前 2 nm 量产；Intel Foundry
              是主要的美国锚定既有替代方案，把封装和测试打包进方案；Rapidus 则是获得政府和合作伙伴支持的进入者，试图在日本搭建 2 nm 逻辑代工厂。xLight
              是最接近的相邻技术挑战者，因为它同样主张，源自粒子加速器的自由电子激光可以重置先进光刻经济性。


              这套分类很重要，因为不同对手威胁 Substrate 论点的不同部分。ASML 和 TSMC 代表默认采购路径，服务那些想要先进制程芯片、但不想改变曝光物理的买方。Canon 和 xLight 攻击的是
              Substrate 同样营销的成本与能耗叙事，但它们一次只攻一层：Canon 换掉图形转移机制，xLight 瞄准 EUV 光源。Rapidus
              重要，是因为它显示新晶圆代工进入者可以使用行业标准合作和标准节点语言，而不要求客户承销一整套全新工艺栈。实际结果是，Substrate
              的差异化在于整合，而不是竞争隔绝：它不寻常，主要因为把新光源、新光刻架构和新代工雄心放进了同一个项目。
