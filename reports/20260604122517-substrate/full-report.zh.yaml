              因此，客户结论比产品或市场论点更窄。Substrate 的买方逻辑可读：如果先进 AI
              和机器人需求继续上升，如果主权制造变得具备战略价值，那么确实存在一组可信客户，理应想要更有韧性的先进制程晶圆供应。但公开客户证据还没有跟上这个故事。Heise
              明确质疑该路线能否在合理时间框架内落地；TechInsights 也指出，公司没有在售产品，且行业惯性来自已锁定的工具集和已承诺路线图。对投资人来说，下一步客户尽调不是要求更多
