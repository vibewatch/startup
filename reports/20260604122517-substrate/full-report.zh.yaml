        - from: d2
          to: d8
        - from: d3
          to: d8
    claimRefs:
      - CR023
      - CR025
      - CR031
      - CR037
      - CR039
      - CR049
      - CR053
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 判断链条很简单：可信战略论点加真实资本通道，扣除缺失的运营验证，以及仍以数十亿美元计的融资缺口。
    data:
      nodes:
        - id: price
          label: 当前价格信号
          detail: '> $100M 融资，估值约 $1B 或更高。'
          tone: warning
        - id: thesis
          label: 战略上行空间
          detail: 更低成本的 X 射线光刻，加上扎根美国的垂直整合晶圆厂，若整套栈跑通，可能很重要。
          tone: positive
        - id: proof
          label: 运营验证缺口
          detail: 尚无公开收入、客户、积压订单、吞吐量或已实现定价披露。
          tone: warning
        - id: comps
          label: 可比公司背景
          detail: 上市在位者市值巨大，因为它们已经同时具备规模、申报文件和运营披露。
          tone: neutral
        - id: finance
          label: 融资负担
          detail: 管理层称，扩建晶圆厂可能需要数十亿美元起步，甚至达到数百亿或数千亿美元。
          tone: negative
        - id: decision
          label: 继续研究 / 估值偏紧
          detail: 论点可信，但今天的价格还没有得到公开证据支撑，不能按已去风险的运营业务来承销。
          tone: neutral
      edges:
        - from: price
          to: decision
        - from: thesis
          to: decision
        - from: proof
          to: decision
        - from: comps
          to: decision
        - from: finance
          to: decision
    approximationNotes: 这是逻辑承销链条，不是定量模型。它概括了引用证据如何传导到建议。
    claimRefs:
      - CV005
      - CV009
      - CV035
      - CV036
      - CV045
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 里程碑证据比表格精度更关键：更好的价格或更强的验证都能迅速移动可支撑区间。
    data:
      items:
        - label: 认证延迟 / 融资压力
          value: 0.3
          detail: 如果客户验证和融资都滞后，公开证据支撑可能收缩到明确的下轮降估值区间。
          tone: negative
        - label: 仅有试点验证
          value: 0.8
          detail: 只有技术进展、没有需求披露，仍难以支撑高于当前估值标记的溢价。
          tone: warning
        - label: 当前私募轮参考
          value: 1
          detail: 已报道的估值标记已经假设未来会出现比当前公开来源更多的验证。
          tone: warning
        - label: 吞吐量验证 + 锚定客户
          value: 1.5
          detail: 商业验证开始让高于当前估值标记的价格有依据。
          tone: positive
        - label: 吞吐量验证 + 客户 + 首座晶圆厂融资到位
          value: 2.2
          detail: 可信的融资桥会让公司从叙事走向平台承销。
          tone: positive
        - label: 通过生产认证的集成平台路径
          value: 3
          detail: 只有更后期的验证状态，才能让公开市场式证据支撑显著更高估值。
          tone: positive
    approximationNotes: 数值是基于情景逻辑、当前私募估值标记和基准组推断的方向性估值路标，单位为十亿美元；它们不是管理层指引。
    claimRefs:
      - CV005
      - CV030
      - CV031
      - CV041
      - CV042
      - CV043
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准、乐观情景与当前估值标记之间的宽幅差距，反映承销判断仍有多少依赖未来里程碑验证。
    data:
      items:
        - label: 悲观情景
          low: 0.2
          mid: 0.4
          high: 0.6
          displayValue: $0.2B-$0.6B
          detail: 认证或融资滑坡，下一轮以低于当前估值标记完成。
          tone: negative
        - label: 基准情景
          low: 0.8
          mid: 1
          high: 1.2
          displayValue: $0.8B-$1.2B
          detail: 工具验证改善，但客户和晶圆厂融资证据仍不完整。
          tone: warning
        - label: 乐观情景
          low: 1.5
          mid: 2
          high: 2.5
          displayValue: $1.5B-$2.5B
          detail: 技术验证、客户验证和可信融资都在下一次大额融资前到位。
          tone: positive
        - label: 当前轮次参考
          low: 0.95
          mid: 1
          high: 1.05
          displayValue: ~$1.0B
          detail: 已知私募估值标记已处在仅公开证据能支撑的基准情景上沿。
          tone: neutral
    approximationNotes: 区间是以十亿美元计的情景化估值判断；由于公开证据目前不支持为 Substrate 做 DCF 或收入倍数模型，因此采用该方法。
    claimRefs:
      - CV005
      - CV041
      - CV042
      - CV043
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 公司在野心和战略重要性上得分高，但在披露、融资充足性和当前估值支撑上得分低。
    data:
      items:
        - label: 市场需求
          value: 8
          unit: /10
          detail: 地缘政治和 AI 需求确实推高了更多先进芯片产能的压力。
          tone: positive
        - label: 技术雄心
          value: 8
          unit: /10
          detail: 公司想在光源物理和晶圆厂集成上做真正高难度的改动。
          tone: positive
        - label: 客户验证
          value: 2
          unit: /10
          detail: 没有公开客户、积压订单或预留证据披露。
          tone: negative
        - label: 经济性可见度
          value: 2
          unit: /10
          detail: 没有公开收入、已实现定价，也没有由吞吐量支撑的成本桥。
          tone: negative
        - label: 融资充足性
          value: 2
          unit: /10
          detail: 相对公司描述的数十亿美元级建设，当前融资规模很小。
          tone: negative
        - label: 披露质量
          value: 3
          unit: /10
          detail: 当前价格越来越需要上市公司式申报和 KPI 深度，但这些仍缺席。
          tone: warning
        - label: 入场价格吸引力
          value: 3
          unit: /10
          detail: 在验证或价格出现实质变化前，当前估值标记看起来偏紧。
          tone: warning
    approximationNotes: 评分是锚定引用证据的投资委员会式序数判断，不是公司报告的 KPI 披露。
    claimRefs:
      - CV005
      - CV009
      - CV035
      - CV036
      - CV046
      - CV047
      - CV048
