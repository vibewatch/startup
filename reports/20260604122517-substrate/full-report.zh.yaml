              起步时可能只能服务大约半打客户，说明新代工厂可能很快从没有收入能见度，跳到少数战略性主导账户。Substrate 仍处验证前，因此今天的风险不是已测量的集中度，而是完全无法从公开证据测量集中度、留存或扩张。
