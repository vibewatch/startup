      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              从公开证据看，退出准备度低。Substrate 已经不能再拿其他隐身或种子阶段公司作参照；据报道 $1 billion
              的估值和建设先进制程晶圆厂的抱负，已经把公司推入一个类别，投资人应期待其在客户、经济性、治理和融资上有更结构化的披露。ASML、TSMC 和 Intel 等上市公司基准都维持申报轨迹和经营指标。Substrate
              今天不需要长得像上市发行人，但当前价格确实要求公司拿出比现在更多的证据。


              因此，最终尽调问题聚焦缺失的桥梁项目，而不是泛泛的好奇。在承销价格之前，投资人需要实际股权结构表和优先股堆叠、客户预留或试点文件、300 mm 工具的吞吐和良率数据、从所称 $100,000 行业路径到
              $10,000 目标的自下而上成本桥，以及一份融资计划，说明第一批晶圆厂如何在不假设未来无限稀释的情况下获得资金。没有这些材料，估值逻辑仍停留在概念层面，而不是可投资状态。
