        title: Substrate 自身的耐久性和集中度仍无法评分
        blocks:
          - type: paragraph
            body: >-
              没有公开 Substrate 来源披露客户数、续约、流失、NRR、GRR、合同长度、部署利用率、满意度分数或头部账户集中度。因此，无法直接承销耐久性。最接近的公开代理是类比案例。MediaTek 关于与
              Intel 长期合作的引语说明，一旦某家代工厂成为客户供应策略的一部分，关系可以有意设计成多项目、多年度。TSMC 自己的客户系统也从运营层面说明同一点：eFoundry 覆盖设计、工程、物流、良率、质量和
              lot 状态数据；掩模服务处在设计方与晶圆厂之间的接口；CyberShuttle 最高可把原型 NRE 降低 90 percent，并已交付数百片多项目晶圆；Value Chain Alliance
