      - number: '5.3'
        title: 差异化、成熟度与路线图
        blocks:
          - type: paragraph
            body: >-
              差异化建立在三项相互连接的主张上：更短波长的单次曝光图形化、AI 加速的全物理仿真，以及通过垂直整合同时捕获工具和晶圆经济性的商业模式。相对既有 High-NA 路线图，这是一记雄心很大的楔子，因为 ASML
              已经在出货 0.55-NA 工具，更广泛生态也正沿着已知制造路径处理视场尺寸、拼接、掩模和随机缺陷问题。Substrate 的公开验证在技术方向上比在工业成熟度上更有说服力。公司披露了 300 mm 工具、12
              nm 级单次曝光 M1 demo，以及与 AlphaEvolve 有关的大幅运行时间增益；第三方报道则锚定 2028 年生产目标和长期晶圆成本大幅降低的主张。但 TechInsights
              的批评很重要：单个工艺步骤突破还不等于生产级晶圆代工厂。因此，成熟度问题不是物理故事是否有趣，而是公司能否在既有生态再次扩大领先前，把零散验证点变成可重复、已整合的制造平台。
