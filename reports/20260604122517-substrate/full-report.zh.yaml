      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需求侧是真实的。AI 带动的半导体销售、上升的晶圆厂设备支出、CHIPS 支持的制造回流，以及先进逻辑产能集中在台湾，都给本土替代方案打开了结构性窗口。Canon 在 NIL 上的进展和 Rapidus 的
              2nm 推进也显示，只要成本、主权或节点领先性重要，买方和资助方仍会关注非现状路径。但同一批证据也让 Substrate
              的谨慎理由更尖锐。先进光刻资本密集、认证繁重，并嵌在既有巨头已经以工业规模运营的生态里。公开报道仍未证明 Substrate 的吞吐量、良率、正常运行时间、商业模式边界或客户管线；Heise
              还明确指出，合理时间表内的可行性尚无法评估。因此，本章的尽调缺口不是市场是否存在。市场存在。缺口在于，Substrate
              能否在既有巨头规模、生态锁定和融资需求压过机会之前，把可信的技术论点转成商业上合格的代工路径。
