      - number: '4.2'
        title: GTM 代理指标、单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              隐含的进入市场动作是企业级、项目制，而不是自助式。公开描述持续把 Substrate 定位为攻击先进半导体生产中两个最大卡点：ASML 的光刻设备位置和 TSMC
              的代工规模。这把可能买方推向一个很小的群体：先进晶圆厂、大型芯片公司、政府关联制造项目和战略伙伴。实际销售会周期很长、技术认证很重且高度集中，因此 CAC 和回本周期在概念上很重要，但无法从公开证据计算。


              成本结构由先进制程晶圆厂和设备经济性主导。Substrate 自己的材料称，当前先进制程晶圆厂成本约 $25 billion，到 2030 年可能超过 $50 billion；在现有路径上，单片晶圆可能走向约
              $100,000。公司的反向主张是，更紧密的整合和 X 射线光刻可以把晶圆成本拉近
              $10,000。即使该目标方向上成立，公开来源仍留下关键利润率输入空白：实际良率、利用率、服务负担、营运资本、备件强度和客户集中度。


              可比公司证据只能作为上限，不能作为验证。ASML 2025 年业绩展示了成熟工具经济性可能是什么样：€32.7 billion 销售额、52.8% 毛利率、€38.8 billion 积压订单，以及最新 EUV
              平台带来的显著更高吞吐量。Substrate 尚未拿出客户合同或生产运营数据，足以把这些成熟经济性映射到自身模型上。
