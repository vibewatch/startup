      - - 涉出口管制的供应商依赖恶化
        - BIS 更新、Entity List 行动或供应商通知
        - 关键工具或软件依赖受到限制、延期，或在没有备份的情况下变成单一来源
        - 重新评估采购可行性，并要求逐供应商合规矩阵
      - - 商业认证仍未证明
        - 具名试点、预留、预付款或认证伙伴
        - 不可逆晶圆厂或厂址承诺前，仍没有具名试点或预留
        - 把需求和利用率假设视为推测，而不是可融资依据
      - - 运营班底深度没有随复杂度提升
        - 领导层公告和组织证据
        - 公司接近建设决策时，仍未补入已验证的晶圆厂、EHS 和商业运营人才
        - 提高执行折扣，并把投资逻辑收窄到技术期权价值
    notes: 这些决策阈值刻意设计成外部可监测，并直接对应继续或停止承销的决定。
