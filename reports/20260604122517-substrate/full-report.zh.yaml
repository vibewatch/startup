      - number: '1.3'
        title: 资本基础、投资人图谱与指标能见度
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开融资事实，是 2025 年底披露的融资超过 $100 million、估值约 $1 billion。多家媒体在核心投资人名单上趋同：Founders Fund、General
              Catalyst、Allen & Co.、Long Journey Ventures、Valor Equity Partners 和 In-Q-Tel。General Catalyst
              又补了一层重要信息：它实际上在三年多前的种子轮就已进入，说明公司在公开亮相前经历了更长、更安静的开发期。同样重要的是仍然缺失的部分：可对齐的早期轮次时间线、披露轮次前的准确累计融资额、持股比例，以及公司若想从有前景的工具项目推进到真正晶圆厂建设所需的任何债务或项目融资结构。


              指标能见度仍然很低。公开材料在使命和技术抱负上很丰富，但缺少投资级运营数据：没有披露收入、ARR、客户数或详细设施足迹，也没有公开股权结构表或董事会治理包的证据。这意味着本章可以锚定融资、估值、员工数和已披露抱负，却无法锚定商业牵引或财务质量。实际看，投资人图谱比投资人通常要承销的业务指标更容易建立。
