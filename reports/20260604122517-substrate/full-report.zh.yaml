companyProfile:
  summary: >-
    Substrate 是一家旧金山创业公司，由 James 和 Oliver Proud 兄弟于 2022 年创立。公司试图打造下一代美国半导体代工厂：不是只向现有晶圆厂生态销售单机设备，而是用粒子加速器产生 X
    射线，服务先进光刻。公开报道称，Substrate 已披露融资超过 $100 million，估值约 $1 billion，约 50 名员工来自半导体和先进制造背景，目标是在 2028
    年生产首批芯片。今天的公开验证仍停在商业化前：公司展示了图形化 demo 和 2026 年 4 月计算光刻进展，但尚未公开披露客户、收入或完整承销的晶圆厂融资方案。
