      - number: '7.4'
        title: 团队、执行与可监测阈值
        blocks:
          - type: paragraph
            body: >-
              执行风险仍然高，因为 Substrate
              试图把几十年的工业学习曲线压缩进创业公司的时间表。公司的招聘面和公开叙事暗示，它同时需要加速器物理、计算光刻、制造工程、晶圆厂运营、EHS、资本形成和客户认证能力。广度本身不必然构成否决，但会抬高领导层厚度和节奏纪律的门槛。公开层面，公司仍然强烈绑定
              James 和 Oliver Proud；TechSpot 指出，创始人此前并没有半导体制造领导岗位经历。Heise 进一步指出，公开技术披露仍然很薄，外部观察者还无法有信心地判断实际落地时间表。


              对承销而言，正确反应不是忽视这个登月项目，而是定义清晰的否决标准。如果 Substrate
              在下一次重大融资之前不能拿出可信的选址与许可工作流、吞吐与良率路线图、客户认证计划以及分阶段融资结构，这个逻辑就应被折价为科学项目，而不是可制造的业务。反过来，团队厚度可以被监测：有经验的晶圆厂运营者、具名
              EHS 负责人、披露的商业交易对手，以及能把试点工具桥接到受监管生产的资本计划，都会降低残余风险。在这些信号出现之前，团队和执行风险会放大其他每一类风险，而不是与它们并列存在。
