  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 什么会改变判断
    rows:
      - - Substrate 试图把成本更低的 X 射线光刻，与垂直整合的美国晶圆代工模式配在一起。
        - 投资逻辑
        - 如果有独立证据证明工具能达到吞吐量和良率目标，经济性叙事会更可投。
      - - 投资人阵容和政策叙事表明，公司可能接触到普通创业公司银团之外的战略网络。
        - 投资逻辑
        - 如果这种网络能转化为披露的项目融资或政府背书的制造支持，置信度会上升。
      - - 当前据报道约 $1B 的估值，早于公开披露收入、积压订单、客户数或实际定价。
        - 反向逻辑
        - 即便只有一个锚定客户预留或定价披露，也会显著增强估值支撑。
      - - 管理层称，扩张可能需要数十亿美元，最终甚至需要数百亿或数千亿美元。
        - 反向逻辑
        - 如果能拿出分阶段晶圆厂融资计划，并明确债务、股权和非稀释支持，下行风险会降低。
      - - Canon 和 xLight 表明，在 Substrate 之外，成本更低的图案化和替代光源叙事已经存在。
        - 反向逻辑
        - 只有 Substrate 能证明相邻替代方案无法匹配的整合优势，护城河叙事才会改善。
      - - 公开上市的在位厂商通过文件和运营指标披露的信息，远多于 Substrate 今天的公开信息。
        - 反向逻辑
        - 如果后续融资披露深度更强，当前价格会更容易承销。
    notes: 这些行围绕今天的价格已经计入什么来写，而不是泛泛讨论 Substrate 是否是一家有意思的技术公司。
