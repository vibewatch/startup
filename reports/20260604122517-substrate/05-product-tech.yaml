- id: technology-architecture-dependencies
  title: Technology architecture and operating model
  body: 'Public disclosures describe a stack that begins with accelerator physics and only becomes useful after multiple additional subsystems are solved. Substrate’s X-ray source uses RF cavities, electron beams, magnets, optics, and precision motion systems; on top of that sit masks, resists, photoresist chemistry, and computational lithography software that must model the full process with enough fidelity to be predictive. This is why the AlphaEvolve story matters: even incumbent EUV leaders say advanced-node manufacturing is impossible without computational lithography, and industry roadmaps show High-NA itself still depends on masks, light-source improvements, stochastic-defect control, and full-chip modeling. Substrate’s operating model therefore looks less like a single breakthrough machine and more like an attempt to compress an entire lithography ecosystem into one startup. That makes the architecture differentiated, but it also means critical dependencies remain spread across materials,
    optics, compute, metrology, and integration with the rest of a fab flow.'
  claimRefs:
