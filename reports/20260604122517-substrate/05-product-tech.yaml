sections:
- id: product-definition-workflow
  title: Product definition and customer workflow
  body: 'Substrate’s product is best understood as a planned foundry platform, not just an exotic light source. The company explicitly describes itself as building a next-generation American semiconductor foundry and pairs that positioning with a vertically integrated economics story: lower fab cost, lower wafer cost, and eventual domestic supply-chain control. In customer-workflow terms, the public materials imply a loop that starts with a target layer or chip design, runs through ILT/OPC-heavy simulation and process tuning, prints on a 300 mm X-ray tool, and then feeds metrology back into the next iteration. The strongest public proof today is still at the patterning-and-simulation layer rather than at customer delivery: Substrate has shown 12 nm-class single-exposure metal-pattern results and has disclosed large AlphaEvolve-assisted compute gains, but it has not yet published the PDK, support model, or operational playbook that an external fabless customer would need to tape out on the
    future platform.'
  claimRefs:
