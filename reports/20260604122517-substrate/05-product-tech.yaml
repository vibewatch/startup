- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User / beneficiary
  - Current status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - X-ray lithography source + optics tool
    - Substrate process engineers / future foundry customers
    - Production-quality 300 mm tool disclosed; throughput metrics undisclosed
    - Shorter-wavelength source aimed at single-exposure advanced patterning
    - Need wafers/hour, uptime, overlay, and defect-density data
  - - Computational lithography stack
    - Mask and process engineers
    - Demonstrated on advanced metal-layer patterns
    - End-to-end differentiable ILT/OPC and full-physics simulation
    - Need full-chip runtime and process-window benchmarks
  - - AlphaEvolve optimization loop
    - Lithography software team
    - In use on core optimization tasks
    - Company-reported 97% lower compute cost and 680% faster runtime
    - Need repeatability evidence across more workloads
  - - Mask / resist / process stack
    - Process integration team
    - Required for advanced X-ray patterning; partner set not public
    - Potential single-mask, single-exposure advantage
    - Need named partners and qualified material stack
  - - Vertically integrated foundry program
    - Fabless AI / advanced-chip customers
    - Planned; public production target is 2028
    - Could capture both tool economics and wafer economics
    - Need PDK, customer workflow, and capex plan
  - - Domestic supply-chain buildout
    - U.S. industrial and government stakeholders
    - Ongoing
    - Narrative ties lithography to strategic independence from foreign choke points
    - Need supplier localization ratios and dependency mapping
  notes: Rows mix current public proof, company roadmap claims, and inferred commercialization assets; several customer-facing modules remain pre-production.
