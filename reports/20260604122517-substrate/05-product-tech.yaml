- id: trust-quality-and-diligence-gaps
  title: Trust, quality, compliance, and remaining gaps
  body: 'Substrate does have some publicly visible trust signals, but they are mostly technical rather than certification-driven. The company describes air-free X-ray paths, extreme sensitivity to vibration, and simulation-led defect prediction, which means it clearly understands that process control and environmental stability are gating factors. Broader industry sources reinforce that view: successful advanced lithography requires deep metrology, model validation, materials discipline, and support tooling rather than only a powerful source. What is missing is the conventional diligence surface that large customers, regulators, and manufacturing partners would expect. There is no public disclosure of wafer-level yield or defect-density metrics, no public list of qualified mask or resist partners, and no visible safety or quality framework such as radiation controls, ISO-style certification, or fab-quality systems. As a result, the chapter’s main trust conclusion is mixed: the engineering
    problem is framed credibly, but the production-governance layer remains largely private.'
  claimRefs:
  - CE008
  - CE018
  - CE027
  - CE029
  - CE032
  - CE039
  - CE040
  - CE044
