- id: TE002
  title: Workflow / use-case table
  columns:
  - User job / workflow step
  - Current pain point
  - Substrate approach
  - Measurable benefit / evidence
  - Limitation
  rows:
  - - Dense advanced metal-layer patterning
    - EUV multipatterning adds exposures, vias, defect risk, and routing constraints
    - Single high-power X-ray exposure on advanced M1 geometries
    - 12 nm CD / bidirectional P24 M1 demo disclosed
    - Only representative pattern demos are public, not production yield
  - - Mask and process co-optimization
    - Weeks-long CPU-heavy simulations limit certainty and iteration speed
    - Differentiable ILT/OPC stack on GPU/TPU compute
    - Company-reported 97% compute-cost reduction and 680% runtime gain
    - Full-chip scaling and wall-clock benchmarks are not public
  - - Domestic leading-edge wafer sourcing
    - US chip designers depend on foreign lithography and foundry choke points
    - Own-fab, vertically integrated foundry model
    - Mission and roadmap explicitly framed around domestic control
    - Commercial delivery capability is still planned, not in market
  - - Faster process iteration
    - Physical wafer loops are slow and expensive
    - Predict defects before silicon and adjust parameters in simulation
    - Company says this compresses wafer-start requirements
    - No independent quantification of iteration savings
  - - AI-designed custom silicon manufacturing
    - Design cost may fall faster than manufacturing cost
    - Model-to-fabrication loop linking AI design and X-ray manufacturing
    - AlphaEvolve and foundry narrative publicly emphasized
    - Customer enablement documents remain private
  notes: The workflow captures the public product narrative rather than a shipped customer SLA; benefits are strongest where Substrate has shown patterning or simulation evidence.
