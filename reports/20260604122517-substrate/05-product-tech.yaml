  title: Product & Technology
  summary: Substrate’s product is a planned vertically integrated semiconductor foundry platform built around accelerator-driven X-ray lithography, a differentiable computational lithography stack, and a disclosed in-house 300 mm tool. Public evidence is strongest on patterning physics and simulation speedups — including a 12 nm-class single-exposure M1 result and company-reported 97% compute-cost reduction with AlphaEvolve — while throughput, yield, material-stack qualification, and safety or quality disclosures remain largely private.
