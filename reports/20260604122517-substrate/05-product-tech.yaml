- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in operating model
  - Key dependency
  - Primary risk
  - Evidence
  rows:
  - - RF cavities + electron beam
    - Accelerate electrons to near-light-speed for source generation
    - Accelerator hardware, controls, and beam stability
    - Source reliability and power scaling are not public
    - Substrate architecture disclosure
  - - Alternating magnets / X-ray source
    - Convert beam energy into intense X-ray light
    - Magnetic lattice and source engineering
    - Brightness, stability, and uptime are undisclosed
    - Substrate architecture disclosure
  - - Polished optics + vacuum / vibration controls
    - Transport and shape X-rays from source to wafer
    - Optics polishing, vacuum chambers, and motion systems
    - Air absorption, contamination, and vibration sensitivity
    - Substrate + XRL technical literature
  - - Masks / photoresists / substrates
    - Translate desired pattern to the wafer
    - Materials suppliers and process chemistry
    - Mask cost, resist sensitivity, and ecosystem immaturity
    - Substrate + Frontiers review
  - - Computational lithography (ILT / OPC / SMO)
    - Optimize masks and compensate physical distortions
    - GPU/TPU compute, calibrated process models, full-chip software
    - Compute burden and model calibration at production scale
    - Substrate + ASML + Synopsys
  - - Metrology / defect prediction loop
    - Compare simulated and printed outcomes and close the learning loop
    - Inspection data, SEM images, model validation
    - Missing public defect-density and repeatability metrics
    - Substrate + NIST + Fraunhofer
  - - 300 mm tool plus broader fab flow
    - Integrate exposure with deposition, etch, CMP, and wafer handling
    - Existing chipmaking tools and process integration
    - A strong process-step demo is still not a full foundry
    - Independent coverage + TechInsights critique
  notes: Architecture rows emphasize where the public story shifts from disclosed hardware or software into ecosystem dependencies that remain only partially specified.
