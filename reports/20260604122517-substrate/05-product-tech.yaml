callouts:
- calloutType: strength
  title: Real proof now exists at both the tool and simulation layers
  body: Substrate has moved beyond a pure concept narrative by disclosing a production-quality 300 mm tool and a single-exposure 12 nm-class M1 demo that is explicitly tied to its computational lithography stack.
  claimRefs:
  - CE007
  - CE015
  - CE016
- calloutType: risk
  title: The gating risk is ecosystem completion, not just source physics
  body: Public evidence still leaves masks, resists, throughput, yield, safety controls, and full foundry integration largely unproven, which is exactly where historical X-ray lithography efforts struggled.
  claimRefs:
  - CE029
  - CE040
  - CE044
