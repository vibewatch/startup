- id: differentiation-maturity-roadmap
  title: Differentiation, maturity, and roadmap
  body: 'The differentiation case rests on three linked claims: shorter-wavelength single-exposure patterning, AI-accelerated full-physics simulation, and a business model that captures both tool and wafer economics through vertical integration. Relative to the incumbent High-NA roadmap, this is an ambitious wedge because ASML is already shipping 0.55-NA tools and the wider ecosystem is working through field-size, stitching, mask, and stochastic-defect issues on a known manufacturing path. Substrate’s public proof is more impressive on technical direction than on industrial maturity. The company has disclosed a 300 mm tool, a 12 nm-class single-exposure M1 demo, and large AlphaEvolve-related runtime gains, while third-party coverage anchors a 2028 production target and a much lower long-run wafer-cost claim. But TechInsights’ critique is important: a single process-step breakthrough does not yet equal a production foundry. The maturity question is therefore not whether the physics story
    is interesting; it is whether the company can turn scattered proof points into a repeatable, integrated manufacturing platform before incumbent ecosystems widen the lead again.'
  claimRefs:
