company:
  name: Substrate
chapter:
  number: 4
  title: Financials
  summary: 'Substrate’s public financial profile is a capital-intensity story rather than an operating-metrics story: the company has disclosed more than $100 million of funding at roughly a $1 billion valuation, but no revenue, customer, pricing, burn, or runway data. The evidence supports a pre-commercial plan to build a vertically integrated foundry by 2028 with a claimed wafer-cost path toward roughly $10,000 versus an industry path toward $100,000, yet public fab comparables and CHIPS awards show that execution requires financing measured in many billions. Financially, the question is not near-term revenue quality but whether Substrate can fund the jump from tool proof to fab-scale production without far larger rounds, debt, and government support.'
sections:
- id: SI001
  title: Revenue model, pricing, and traction visibility
  body: |-
    Substrate’s public financial story begins with business model ambition rather than operating evidence. Official materials and investor commentary say the company is building a vertically integrated foundry, while independent coverage says the disclosed >$100 million round is being used for lithography development and manufacturing buildout rather than for a light-capital software model. That means the cleanest public revenue hypothesis is future wafer or contract-manufacturing output from Substrate-owned fabs, with any tool, service, or consumables income still secondary and not yet commercially evidenced.

    Pricing visibility is much thinner than ambition. The strongest public number is not a current customer price but management’s target of wafers closer to $10,000 by the end of the decade against a current industry path toward roughly $100,000. No reviewed source discloses a price list, realized contract pricing, minimum order quantities, prepayments, or customer backlog. Substrate’s own news surface publishes press contacts, not commercial wins, and open-source databases predate the disclosed late-2025 financing event.

    As a result, revenue quality is not currently underwritable from public evidence. The chapter can describe the monetization logic, but not revenue mix, recognition timing, pipeline conversion, or concentration-adjusted quality. On open sources alone, Substrate remains a pre-commercial manufacturing bet with no disclosed proof of customer demand, utilization, or booked revenue.
