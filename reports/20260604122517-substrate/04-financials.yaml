tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Future foundry wafer output
    - Substrate-owned fabs sell leading-edge wafer manufacturing capacity or finished chip output
    - USD per wafer / capacity reservation
    - Strategic target only; no public customer contracts or reservations
    - Low today — no disclosed customers, backlog, or revenue recognition terms
    - Request any signed offtake, reservation, or pilot manufacturing agreement and its revenue-recognition policy
  - - Integrated contract chip manufacturing
    - Company operates a vertically integrated domestic production stack rather than only a tool business
    - USD per program / wafer lot / chip batch
    - Public ambition; not yet commercialized
    - Low today — manufacturing promise is strategic, not yet evidenced as a booked service
    - Request first commercial program structure, target customer set, and milestone billing terms
  - - Lithography tool revenue
    - Possible sale or licensing of Substrate-developed lithography systems
    - USD per system
    - Sacra treats this as plausible, but public company materials emphasize owned fabs instead
    - Low — supportable only as a possible lane, not as current disclosed mix
    - Clarify whether management still plans third-party tool sales or has fully shifted to owned-fab economics
  - - Service / consumables / process support
    - Field service, process recipes, and support tied to any installed base
    - USD per service contract / consumable
    - No public pricing or contract evidence
    - Low — recurring profile is speculative until an installed base exists
    - Request service-margin assumptions, spare-parts model, and any recurring-revenue targets
  - - Current disclosed commercial revenue
    - Publicly reported recognized revenue from customers
    - USD
    - No public disclosure
    - None — there is no audited or management-reported revenue figure in open sources
    - Request management accounts, trailing twelve-month revenue, and backlog by customer
  notes: Only the owned-foundry path is clearly signaled by official materials. Other rows are potential monetization lanes implied by industry structure or analyst interpretation and are explicitly marked as undisclosed where public evidence is missing.
