- id: SI003
  title: Capital adequacy and financing dependency
  body: |-
    The core financial underwriting question is capital adequacy, not near-term burn optimization. Substrate has publicly disclosed more than $100 million of funding, and coverage says those proceeds are intended for tool development and manufacturing buildout. But the same body of reporting also quotes management on many billions of dollars of future need, with some comments expanding that to tens or even hundreds of billions if the company scales across multiple facilities. That is consistent with the company’s own official framing of leading-edge fab costs and with the scale of public support packages needed for established players.

    Government comparator evidence reinforces the gap. NIST says Commerce administers $39 billion of semiconductor incentives, Treasury says the CHIPS tax credit is generally 25% of qualified property basis, and the TSMC Arizona award alone combines up to $6.6 billion of direct funding with up to $5 billion of loans against more than $65 billion of planned fab investment. GAO’s milestone schedule runs into 2033 and explicitly ties disbursement to capex and commercial milestones. In other words, even public support for an established operator is staged, conditional, and measured in many billions.

    Substrate has not publicly disclosed cash on hand, burn, runway, debt facilities, or an awarded government-finance package of its own. That leaves only one robust public conclusion: the disclosed capital can plausibly fund R&D, hiring, and early tooling work, but not a self-financed path to vertically integrated leading-edge manufacturing. External financing dependency is therefore structural, not optional.
