  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Exact cash on hand, monthly burn, covenant package if any, and a 12–18 month cash forecast.
    whyItMatters: Without actual liquidity and burn, the chapter cannot compute runway or next-round timing, which are the central underwriting questions for a pre-revenue fab-scale company.
    diligencePath: Request the latest management accounts, monthly cash waterfall, payroll and capex schedule, and board cash-forecast deck.
    relatedQuestionRefs:
    - QI010
    - QI024
    - QI025
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: Signed customer LOIs, reservations, prepayments, offtake agreements, or any backlog report with named counterparties and contract terms.
    whyItMatters: The public record contains ambition but no commercial proof, so revenue quality and sales-cycle assumptions cannot be validated.
    diligencePath: Request customer pipeline detail, executed commercial documents, pilot evaluation agreements, and the revenue-recognition memo attached to those contracts.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI020
    - QI021
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: financing-structure
    missingEvidence: Any debt term sheet, CHIPS application or award status, project-finance model, tax-credit assumption pack, and site-by-site capex phasing.
    whyItMatters: A vertically integrated fab strategy is not financeable from equity alone, and the public record does not show how Substrate expects to close the gap.
    diligencePath: Request financing workstreams, lender or government correspondence, subsidy applications, and the model showing when each instrument is expected to fund.
    relatedQuestionRefs:
    - QI012
    - QI016
    - QI024
    - QI025
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Throughput, yield, utilization, spare-parts intensity, maintenance assumptions, supplier terms, and a gross-margin bridge from tool/fab inputs to realized customer pricing.
    whyItMatters: The public story offers a compelling cost target, but not the operating assumptions needed to test whether the target can produce attractive gross margins and working-capital turns.
    diligencePath: Request the internal cost model, engineering KPI dashboard, service assumptions, and supplier/customer payment-term schedule used in fundraising or board review.
    relatedQuestionRefs:
    - QI017
    - QI023
    - QI025
    relatedTableRefs:
    - TI003
    - TI004
