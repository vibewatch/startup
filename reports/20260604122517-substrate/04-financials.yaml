- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Recognized revenue, backlog, and customer count
    - Revenue quality cannot be underwritten without them
    - Request monthly revenue bridge, backlog aging, named customers, and any reservation or offtake documentation
  - - Current cash, burn, and 12–18 month forecast
    - Runway and dilution timing remain unknown
    - Request latest management accounts, cash balance, payroll / capex spend by month, and board cash forecast
  - - Pricing schedules and realized commercial terms
    - Open sources cannot test ASP, discounts, or take-or-pay quality
    - Request customer quotes, pilot pricing sheets, reservation terms, and revenue-recognition memo
  - - Tool throughput, yield, utilization, and service burden
    - Margin path cannot be validated from aspiration alone
    - Request engineering KPI deck covering wafers per hour, uptime, defect rates, maintenance cycle, and gross-margin bridge
  - - Site-by-site capex and financing stack
    - Capital adequacy cannot be judged without a phased build plan
    - Request facility budget, construction and equipment timeline, debt term sheets, CHIPS application status, and tax-credit assumptions
  - - Supplier, customer, and milestone payment terms
    - Working-capital turns and external financing need remain opaque
    - Request purchase-order terms, supplier prepayment obligations, customer billing milestones, and any project-finance covenants
  notes: These are the minimum private-company documents needed to convert the chapter from a public-evidence screen into an underwriting-ready financial analysis.
