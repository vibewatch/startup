- id: SI004
  title: Financial verdict and diligence blockers
  body: |-
    The financial verdict is straightforward. Revenue quality is unproven because there is no disclosed revenue, backlog, customer count, pricing schedule, or contract evidence. Margin path is conceptually attractive only if Substrate can deliver the company-claimed wafer-cost improvement while also solving throughput, utilization, and service economics that incumbents spent decades refining. Capital intensity is the dominant risk: the public record already points to a funding requirement that is orders of magnitude above the disclosed equity raised so far.

    What makes the chapter hard to underwrite is not a single red flag but the amount of private evidence still missing. Open sources do not provide management accounts, a site-by-site capex budget, a draw schedule, debt or CHIPS application status, customer reservations, or a current cash forecast. Without those items, the chapter can compare ambition with public fab comparables, but it cannot compute runway, customer payback, gross-margin bridge, or financing timing with confidence.

    The diligence burden is therefore front-loaded. Before underwriting Substrate as a financial opportunity rather than a technical moonshot, an investor needs the actual liquidity position, exact use-of-funds tracking, financing stack, customer commitment evidence, and a capital plan that explains how the company bridges from proof-of-tool to proof-of-fab. Until then, the public case is a pre-revenue, high-capex option on manufacturing disruption rather than a financeable operating business.
