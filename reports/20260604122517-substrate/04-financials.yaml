- id: SI002
  title: GTM proxies, unit economics, and cost structure
  body: |-
    The implied go-to-market motion is enterprise and project-based, not self-serve. Public descriptions consistently frame Substrate as attacking the two biggest choke points in advanced semiconductor production: ASML’s lithography-tool position and TSMC’s foundry scale. That pushes the likely buyer universe toward a very small group of advanced fabs, large chipmakers, government-linked manufacturing programs, and strategic partners. In practice, that kind of sale is long-cycle, technically qualified, and concentrated, which means CAC and payback are conceptually important but not calculable from public evidence.

    Cost structure is dominated by leading-edge fab and tool economics. Substrate’s own materials say current leading-edge fabs cost around $25 billion and could exceed $50 billion by 2030, while wafers could head toward roughly $100,000 each on the current path. The company’s counter-claim is that tighter integration and X-ray lithography could move wafers closer to $10,000. Even if that target proves directionally right, public sources still leave the crucial margin inputs blank: actual yield, utilization, service burden, working capital, spare-parts intensity, and customer concentration.

    Comparator evidence is useful only as a ceiling, not as validation. ASML’s 2025 results show what mature tool economics can look like—€32.7 billion of sales, 52.8% gross margin, a €38.8 billion backlog, and materially higher throughput from its latest EUV platform. Substrate has not yet shown the customer contracts or production operating data that would justify mapping those mature economics onto its own model.
