- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Public wafer-cost anchor
    - Current path toward ~$100,000 wafers; Substrate target of ~$10,000
    - Medium
    - This is the public cost delta underwriting the whole revenue story
    - 'Request the bottom-up cost bridge: tool throughput, uptime, yield, utilization, and depreciation assumptions'
  - - Fab capital requirement
    - Official materials say leading-edge fabs are ~$25B today and >$50B by 2030
    - Medium
    - Fab capex dominates any margin path and determines financing dependency
    - Request site-by-site capex schedule and which spend is tool, cleanroom, utilities, and working capital
  - - Throughput requirement
    - Substrate says it built a production-quality 300 mm tool; public sources still question mass-production speed
    - Medium
    - Without throughput, cost-per-wafer claims do not translate into gross margin
    - Request wafers-per-hour, uptime, maintenance cycle, and rework assumptions
  - - Comparator gross margin
    - ASML 2025 gross margin was 52.8%
    - High
    - Shows what mature tool/service economics can look like, but only after scale and service density are proven
    - 'Request Substrate target gross margin by phase: tool proof, pilot fab, scaled fab'
  - - Working-capital structure
    - Not publicly disclosed
    - Unknown
    - Fab and tool programs usually consume capital before revenue is recognized
    - Request payment terms with suppliers, customers, and any milestone-billing or prepayment provisions
  - - CAC / payback proxy
    - Not computable from open sources
    - High
    - The buyer set is concentrated and technical, but no public funnel or contract data exists
    - Request pipeline stages, technical-evaluation costs, and expected time from qualification to cash receipt
  - - Buyer concentration
    - Likely concentrated in a handful of advanced fabs, chipmakers, and strategic programs
    - Medium
    - A small buyer set can produce binary sales outcomes and long negotiation cycles
    - Request named target accounts, concentration assumptions, and counterparty credit / political-risk screen
  notes: This table intentionally separates public anchors from unknown internal metrics. The missing inputs are exactly the ones needed to turn a physics story into a financeable unit-economics model.
