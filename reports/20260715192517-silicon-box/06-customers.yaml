    "number": 6,
    "title": "Customers",
    "summary": "Silicon Box shows real production adoption through mass shipments and partner/customer statements, but it does not publicly name the semiconductor companies buying packaged parts at scale. The customer story is therefore proxy-led: AI/HPC, automotive, mobile, IoT, robotics and space demand signals are credible, while revenue concentration, retention, repeat ordering and top-account exposure remain material private-data gaps."
  },
  "sections": [
    {
      "id": "customer-segments-and-buying-system",
      "title": "Customer segments and the buying system",
      "body": "Silicon Box's customer is not an end consumer; it is a semiconductor organization trying to integrate chiplets into a higher-performance system without owning all of the advanced packaging capacity itself. The account-level buyer is likely a fabless chip designer, IDM, OEM or system company; the day-to-day users are architecture, package design, test, product engineering, procurement and supply-chain teams; and the budget owner is a program or operations organization buying design-to-manufacturing capacity. The customer base should be segmented by vertical because the packaging job differs: AI and HPC accounts need dense interconnect and thermal performance, automotive customers need ADAS-grade reliability and standards alignment, mobile and IoT buyers need cost and form-factor improvement, and robotics or space accounts need specialized performance and supply resilience. Geography is currently Singapore-led, with Europe planned through Novara. The public record supports broad demand, but not customer count or revenue by vertical.",
