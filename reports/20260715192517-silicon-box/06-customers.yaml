    {
      "id": "named-proof-and-reference-quality",
      "title": "Named proof: collaboration and testimonial evidence, not a customer roster",
      "body": "Named proof is unusually thin for a company with hundreds of millions of shipped units. The clearest customer-style reference is Zerro Power Systems, whose executive said Silicon Box's packaging approach shortened time to market; even there, the public article does not disclose whether the work was production, a qualification lot, an R&D engagement or a pilot. Imec ACP is highly relevant ecosystem proof because it puts Silicon Box in a named automotive chiplet consortium and says the company is co-developing automotive-grade packages with customers for ADAS, but the customers remain unnamed. MeetKai is a named implementation partner for the digital-twin factory environment, not a packaging customer. TDK Ventures and Tata Electronics are strategic backers, yet no public source proves they are paying customers. Therefore the named table is a sample of references, not an enumeration of production customers, and the central gap remains blocking for customer diligence.",
