    {
      "id": "adoption-trajectory-and-production-proxies",
      "title": "Adoption trajectory: real shipped units, opaque account denominator",
      "body": "The strongest customer evidence is production volume rather than logos. Silicon Box says its Singapore factory began mass production in late 2023, was in production for early customers by October 2023, reached 100 million units shipped by October 2025, and exceeded 250 million units at near-perfect yield as of Q1 2026. Independent and semi-independent coverage corroborates the 100 million and 250 million milestones, while Business Times adds that the company says it ships hundreds of products across AI/HPC, smartphones, robotics and aerospace. Those facts show operational adoption and a scaling production ramp, but they are not a customer census. A single mega-account could drive a large share of units; alternatively, the volume could span many smaller programs. Because Silicon Box does not disclose active accounts, shipped units per customer, revenue per segment, ASP, yield by product family or booked backlog by customer, diligence must treat adoption as credible but non-attributable.",
