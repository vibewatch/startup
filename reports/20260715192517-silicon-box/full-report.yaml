      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - 1. Cap table and terms
        - All financing documents, fully diluted capitalization, preferences, anti-dilution and option pool
        - Determines preference-adjusted entry and dilution
        - CFO, company counsel and lead-investor counsel
      - - 2. Current price discovery
        - 2025/2026 primary price, secondary trades, valuation support memo and board approvals
        - Tests whether US$1.55B is current and investable
        - Board materials and transaction counsel
      - - 3. Revenue cohorts
        - Customer-by-customer orders, shipments, invoices, cash collections and backlog
        - Converts unit shipment claims into revenue quality
        - Finance, sales operations and auditors
      - - 4. Customer concentration
        - Named customers, qualification status, purchase commitments and win/loss history
        - Tests adoption and bargaining power
        - Commercial team and customer reference calls
      - - 5. Unit economics
        - Panel yield, COGS, rework, scrap, utilization and gross margin by product
        - Supports or falsifies public-OSAT multiple logic
        - Operations, quality and cost accounting
      - - 6. Singapore capacity
        - Installed tools, bottlenecks, capacity plan and full-capacity path to 2028
