            body: >-
              Silicon Box discloses no SaaS-style NRR or GRR, no logo churn, no renewal rate, no contract duration, no
              customer satisfaction score and no account-level repeat purchase cohort. That is not surprising for a
              private, capital-intensive semiconductor packaging business, but it prevents underwriting durability from
              public evidence. The best available proxies are continued production shipments, near-perfect yield, 2024
              revenue from pre-qualified customers' production and R&D investments, and statements that customer
              qualification and R&D times can exceed two years. Those proxies imply some customers are progressing
              through qualification or production, but they do not show whether customers expand after first packages,
              whether programs recur, whether the same accounts dominate, or whether pricing holds under capacity
              competition. Diligence should request customer cohorts by tape-out or qualification year, order repeat
              rate, cancellation history, yield by customer, satisfaction or audit scores, and contract lengths.
