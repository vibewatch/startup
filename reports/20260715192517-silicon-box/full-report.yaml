      - number: '8.3'
        title: Bull, base and bear valuation cases
        blocks:
          - type: paragraph
            body: >-
              Scenario valuation is necessarily driver-based because Silicon Box is private and does not disclose
              revenue, EBITDA, capex phasing, utilization, customer backlog or cash. Public OSAT and foundry-related
              references suggest revenue multiples from roughly 2.4x for Amkor to 4.5x for ASE, with TSMC far higher
              because it owns a different foundry moat and cannot be used as a direct startup multiple. The bear case
              values Silicon Box at US$0.4B–US$0.9B if revenue is far below expectations, named customers do not
              materialize, Italy slips, or a financing exposes weak preference-adjusted value. The base case is
              US$1.6B–US$2.6B if Singapore turns the 100M-plus unit milestone into verifiable recurring revenue and
              Italy remains financed but not yet fully de-risked. The bull case is US$3.5B–US$6.0B if the company proves
              high-utilization panel-level economics, wins identifiable AI/HPC/automotive customers, and becomes a
              strategic scarcity asset before larger incumbents commoditize the niche.
