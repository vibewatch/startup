      - number: '2.4'
        title: Growth drivers, constraints and adoption timing
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are unusually strong: AI/HPC workloads need HBM-connected compute, chiplet architectures
              reduce the penalty of building every function as one monolithic die, UCIe is standardizing die-to-die
              interfaces, and governments are treating packaging as strategic infrastructure. The European Chips Act and
              the approved Italian state-aid package make Silicon Box's European expansion strategically relevant, while
              the Singapore production milestone supports the claim that PLP can move beyond pilot scale. The
              constraints are equally material. Panel-level lines are expensive, qualification cycles are slow, and
              buyers will not risk mission-critical AI or automotive products without yield, thermal, reliability and
              failure-analysis proof. TSMC's CoWoS dominance can also limit Silicon Box's near-term SAM because the
              biggest AI programs may prefer known capacity even at higher cost. Valuation should therefore reward
              exposure to a real bottleneck but discount for capex, ramp timing, customer opacity and switching risk.
