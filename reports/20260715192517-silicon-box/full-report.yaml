  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis and recommendation
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Silicon Box sits in a strategically scarce part of the semiconductor stack:
              advanced packaging and chiplet integration for AI, HPC, automotive, mobile, IoT, robotics and space-tech
              customers. Market sources show a growing advanced-packaging category, company sources show sub-5-micron
              panel-level interconnect capability, and the Singapore facility has shipped meaningful unit volume with
              claimed near-perfect yield. The anti-thesis is that valuation already capitalizes a great deal of
              execution before public evidence proves revenue, named customers, gross margin, utilization, customer
              concentration or preference-adjusted ownership. Competition is also extreme: Amkor, ASE, JCET, TSMC and
              Intel operate with far larger balance sheets and customer footprints. The recommendation is therefore
              cautiously positive track / research-more, not buy-at-any-price. A new investor should require at least 3x
              gross value over five to seven years and insist on a lower, structured, or milestone-based entry unless
              private diligence verifies the public story.
