  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked residual risk view
        blocks:
          - type: paragraph
            body: >-
              The risk stack is led by coupled project-finance and execution exposure: Silicon Box must keep its
              Singapore ramp stable while funding, constructing and qualifying a first-of-kind European
              advanced-packaging facility whose public plan reaches production only in 2028 and full capacity in 2033.
              State aid lowers capital burden but adds public-law obligations, priority-order commitments, Open EU
              Foundry intent and potential profit-sharing; it is not unconditional equity. Export controls are similarly
              structural because Silicon Box serves AI, HPC, automotive and chiplet customers across Singapore and
              Europe, while U.S. and EU rules increasingly target advanced computing, semiconductor manufacturing
              equipment, software keys, reexports and diversion routes. Operational proof is real—100M units, later 250M
              units, and ISO milestones—but public sources do not disclose customer names, top-customer mix, gross
              margin, cash burn, debt covenants, substrate/equipment commitments or field reliability cohorts. The
              investment implication is research-more, not avoid: mitigate with private diligence gates before
              underwriting the Italy expansion as value-accretive.
