  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Customer proof
        - No verified named material customer or revenue cohort in diligence
        - Invalidates demand-quality premise
        - Do not invest at reported mark
      - - Revenue quality
        - Revenue materially below board plan or concentrated in non-recurring engineering
        - Compresses revenue multiple and exit readiness
        - Reprice to bear range
      - - Yield / quality
        - Panel-level yield, returns or qualification failures inconsistent with near-perfect-yield claims
        - Destroys moat and margin premise
        - Pause pending independent quality audit
      - - Capitalization
        - Preference-adjusted waterfall or down-round implies value below entry
        - Headline valuation overstates investor proceeds
        - Require lower/structured terms
      - - Liquidity / debt
        - <18 months downside runway or covenant pressure after S$100M debt
        - Raises forced-financing risk
        - No-invest until financing closes
      - - Italy execution
        - State-aid, permit, EPC or production milestone slips by >12 months
        - Removes bull-case capacity and EU strategic premium
        - Reset scenario to base/bear
      - - Competition
        - Lost deals to Amkor, ASE, JCET, TSMC or Intel on price/performance
        - Reduces scarcity premium
        - Lower multiple and reassess moat
    notes: >-
      Thresholds are proposed investor controls; they must be calibrated against the board plan and private data room
      before closing.
