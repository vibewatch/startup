  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and the buying system
        blocks:
          - type: paragraph
            body: >-
              Silicon Box's customer is not an end consumer; it is a semiconductor organization trying to integrate
              chiplets into a higher-performance system without owning all of the advanced packaging capacity itself.
              The account-level buyer is likely a fabless chip designer, IDM, OEM or system company; the day-to-day
              users are architecture, package design, test, product engineering, procurement and supply-chain teams; and
              the budget owner is a program or operations organization buying design-to-manufacturing capacity. The
              customer base should be segmented by vertical because the packaging job differs: AI and HPC accounts need
              dense interconnect and thermal performance, automotive customers need ADAS-grade reliability and standards
              alignment, mobile and IoT buyers need cost and form-factor improvement, and robotics or space accounts
              need specialized performance and supply resilience. Geography is currently Singapore-led, with Europe
              planned through Novara. The public record supports broad demand, but not customer count or revenue by
              vertical.
