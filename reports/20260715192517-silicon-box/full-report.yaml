        blocks:
          - type: paragraph
            body: >-
              The founding team is unusually concentrated and unusually relevant to the product. CEO and co-founder Dr.
              Byung Joon (BJ) Han previously led STATS ChipPAC for roughly two decades as chairman, CEO and CTO, taking
              it to about US$4B of revenue before JCET acquired the business; Silicon Box relies on his
              advanced-packaging operating history as a core diligence asset. Co-founder Dr. Sehat Sutardja brought the
              chiplet-architecture thesis, Marvell pedigree and hundreds of patents, while co-founder Weili Dai
              contributed Marvell company-building and ecosystem/business management experience. That concentration is
              also a risk: Sutardja died suddenly in 2024 at age 63, removing a major chiplet mentor and
              founder-market-fit anchor. Public materials still show BJ Han as CEO through 2026, with Mike Han leading
              business/revenue-facing activities and JH Yee leading operations, but the company does not publish a full
              board, board committees or shareholder-control map; governance diligence must therefore focus on founder
              influence, investor rights and succession depth.
