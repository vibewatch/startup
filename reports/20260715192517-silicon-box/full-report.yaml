chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters and business model
        blocks:
          - type: paragraph
            body: >-
              Silicon Box is Silicon Box Pte Ltd, a private Singapore company headquartered at Tampines Wafer Park and
              built around independent advanced semiconductor packaging, heterogeneous integration and back-end-of-line
              chiplet enablement. Founded in 2021, it is not a fabless chip designer selling end devices; it functions
              more like an advanced OSAT plus design-consulting and turnkey integration partner for customers that need
              chiplet architectures assembled at panel scale. The company describes its proprietary SiPlet® and
              panel-level packaging approach as a large-format, sub-5-micron interconnect scheme intended to lower cost,
              shorten design cycles and improve power and thermal performance relative to wafer-level and traditional
              packaging alternatives. The one-line operating model is therefore: Silicon Box helps AI, HPC, automotive,
              mobile, IoT, robotics and space-tech customers design, package, test and scale chiplet-based
              semiconductors from company-owned manufacturing capacity in Singapore and planned capacity in Italy.
