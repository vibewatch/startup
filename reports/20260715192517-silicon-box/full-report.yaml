              hardware company: mass production, 100 million units, more than 250 million units, very high yield
              language, major advanced-packaging facilities and strategic financing. The problem is that none of those
              metrics closes the underwriting loop from activity to revenue to gross profit to cash. Third-party
              financial trackers and articles introduce more ambiguity by publishing revenue or total-funding figures
