  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Explicit assumptions
      - Indicative equity-value range
      - Gross multiple on US$1.55B
      - Probability signal
      - Downside / upside trigger
    rows:
      - - Bull
        - >-
          Singapore runs near full utilization; named AI/HPC or automotive customers; Italy financed and on schedule;
          4x–5x revenue-like scarcity multiple
        - US$3.5B–US$6.0B
        - 2.3x–3.9x before dilution
        - Possible but not publicly proven
        - Customer proof plus audited revenue/margin path toward US$0.8B–US$1.2B
      - - Base
        - >-
          Singapore converts unit shipments into recurring revenue; Italy remains credible but pre-production; 3x–4x
          revenue-like multiple
        - US$1.6B–US$2.6B
        - 1.0x–1.7x before dilution
        - Most plausible if private data support current trajectory
        - Two to four quarters of revenue, utilization and yield disclosure
      - - Bear
        - >-
          Customer opacity persists; revenue below plan; PLP economics or Italy project slip; forced capital at weak
          terms
        - US$0.4B–US$0.9B
        - 0.3x–0.6x before dilution
        - Substantive because public evidence omits key economics
        - Down-round, covenant pressure, quality incident or no named customer validation
      - - Current mark
        - Reported roughly US$1.55B July 2025 valuation; low-reliability and not independently corroborated
        - US$1.55B point estimate
        - 1.0x
        - Observable only as a secondary/encyclopedic estimate
        - Term sheet, primary price, waterfall and current 2026 mark verification
    notes: >-
      Ranges are scenario estimates in USD billions and exclude future dilution, liquidation preferences, project debt,
      taxes and transaction costs.
