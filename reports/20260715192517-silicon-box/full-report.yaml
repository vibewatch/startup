      - number: '3.2'
        title: 'Competitor profiles: scale and trust sit with incumbents'
        blocks:
          - type: paragraph
            body: >-
              The profile evidence is asymmetric. Silicon Box has a credible production proof point—100 million units
              shipped, mass production from Singapore since late 2023, ISO certifications and a stated panel-level
              chiplet claim—but it is still private, customer-opaque and far smaller than public competitors. TSMC
              generated US$35.90 billion of net revenue in 2Q26 and positions 3DFabric as a complete 3D stacking and
              advanced-packaging family. Intel's filing frames advanced packaging as part of a trusted foundry strategy
              for fabless companies, hyperscalers, automotive, communications, aerospace and government customers. Amkor
