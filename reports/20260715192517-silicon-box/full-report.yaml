      - number: '2.2'
        title: Sizing through multiple non-interchangeable lenses
        blocks:
          - type: paragraph
            body: >-
              The most defensible conclusion is a range, not a single TAM. A classic advanced-packaging lens spans
              roughly US$41.19B to US$57.46B in 2026 across reviewed publishers, with Yole's syndicated US$47.5B
              estimate serving as a useful midpoint but not a current run-date forecast. Chiplet-market reports are even
              less harmonized: one 2026 estimate is US$22.58B, while Mordor reports US$65.31B and MarketsandMarkets
              starts from US$51.94B in 2025. AI accelerator demand provides the strongest demand-pressure lens, with
              Deloitte estimating a US$500B AI-chip market in 2026 and TrendForce reporting TSMC's AI accelerator wafer
              demand rising 11-fold from 2022 to 2026. Those figures explain why buyers need capacity, but they are not
              Silicon Box revenue. The evidence-constrained SAM remains PLP-compatible chiplet designs that can qualify
              an independent supplier; public sources do not disclose Silicon Box revenue, backlog, customer mix or
              package-level pricing.
