              The financing record is strong but not clean enough to underwrite the headline mark without documents.
              Public sources support a US$200M Series B in January 2024 at a valuation above US$1B, a
              WongPartnership-described US$100M Series B2, a US$150M Series B2 extension in 2025, and S$100M of June
