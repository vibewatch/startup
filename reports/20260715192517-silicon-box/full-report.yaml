  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers are scarce, but substitutes are powerful'
        blocks:
          - type: paragraph
            body: >-
              Silicon Box should not be compared only with other panel-level packaging specialists. The buyer's job is
              to integrate chiplets, HBM, logic and heterogeneous dies into manufacturable AI, HPC, automotive or edge
              systems at acceptable yield, latency, cost and supply risk. On that job, the direct peer set includes
              TSMC's CoWoS/InFO/SoIC 3DFabric family, Samsung Foundry advanced heterogeneous integration, Intel Foundry
              advanced packaging, ASE/SPIL, Amkor, JCET and PTI. The incumbent alternative is to stay inside a
              foundry-led package flow such as TSMC CoWoS, where front-end wafers, design ecosystem and packaging
              capacity can be bundled. The OSAT alternative is to use ASE, Amkor, JCET or PTI for outsourced package
              design, assembly, test and logistics. Status quo is a substrate- or wafer-level package already qualified
              in the customer's supply chain. Internal build is credible for IDMs, hyperscalers and large chip vendors
              that can co-design packages with foundries or reserve capacity. Likely entrants are not greenfield
              startups alone; they are capacity expansions and partnerships by foundries, memory vendors, substrate
              suppliers and top OSATs.
