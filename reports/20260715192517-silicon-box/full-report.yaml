            body: >-
              Mitigation should convert the narrative into monthly evidence. For Italy, require an approved and funded
              capex stack, construction milestones, tool delivery, permit status, grant draw conditions, profit-sharing
              exposure and a customer-backed ramp plan. For Singapore, require first-pass yield, scrap, cycle time,
              reliability failures, customer returns, audit findings and capacity utilization by package family. For
              export controls, require a written product-classification matrix, end-user screening, Hong Kong/China
              diversion controls, EU dual-use license workflow and board-level incident reporting. For customers,
              require named account lists, top-five revenue share, purchase commitments, qualification status and
              renewal/expansion history. Thesis breaks are severe but measurable: loss or material breach of state-aid
              approval, export-control violation, Italy delay over twelve months without funded recovery, recurring
