              market data showed about US$16.7B of market capitalization and about 2.37x P/S on US$7.07B of trailing
              revenue. ASE was materially larger on public market data, with TWD 3.00T of market capitalization and
              4.47x P/S, while JCET was a smaller China-listed packaging reference. TSMC belongs in the table because it
