  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              Silicon Box should be sized against advanced semiconductor packaging and heterogeneous chiplet
              integration, not the broader semiconductor, AI-chip or electronics end-market. The core spend is back-end
              assembly, high-density interconnect, panel-level packaging, 3D integration and test after completed wafers
              leave a fab. Excluded spend includes front-end wafer fabrication, IP design licenses, HBM memory sales,
              finished accelerator boards, cloud compute services and downstream device revenue. This boundary matters
              because AI accelerator and chiplet reports can be much larger than packaging-service revenue and therefore
              create a double-counting risk. Adjacent pools include OSAT services, substrate supply, design consulting,
              wafer-level fan-out and CoWoS-style foundry packaging. Status-quo substitutes are monolithic SoCs when
              reticle limits and yield remain acceptable, conventional wafer-level packaging for smaller devices, and
              TSMC CoWoS for high-end HBM accelerators where buyers prioritize proven yield and supply assurance over
              panel-level cost-down potential.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
