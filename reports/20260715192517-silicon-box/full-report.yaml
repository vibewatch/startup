      - number: '7.2'
        title: Regulatory, legal and geopolitical exposure
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is not a single license but a chain of overlapping regimes. In Europe, the Commission
              approved an approximately €1.3B direct grant for a €3.2B Novara facility because it judged the plant
              first-of-a-kind, necessary and proportionate; those findings create conditions an investor should monitor,
              including priority-rated orders in shortages, workforce training, broader EU value-chain impact and Open
              EU Foundry obligations. In the U.S. orbit, BIS rules expanded controls over advanced computing,
              semiconductor manufacturing equipment, high-bandwidth memory and foreign-produced direct products, while
              BIS guidance treats Hong Kong diversion red flags as export-compliance issues. EU dual-use rules also
              cover export, transit, brokering and technical assistance. IP risk is less visible: Justia lists Silicon
              Box patent applications, but public sources reviewed do not establish freedom-to-operate opinions or
              absence of disputes. Environmental and worker-safety obligations attach to hazardous substances,
              wastewater and factory operations in Singapore and Italy.
