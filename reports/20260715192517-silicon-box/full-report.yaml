      - number: '6.5'
        title: Expansion path and concentration risks
        blocks:
          - type: paragraph
            body: >-
              The likely expansion loop is classic semiconductor land-and-expand: win an R&D or qualification
              engagement, prove electrical, thermal, cost and yield performance, move into production packages, then
              expand across package variants, adjacent product lines, geographies and capacity reservations. Silicon Box
              has several credible expansion levers: Singapore production momentum, strategic investors, imec's
              automotive standards ecosystem, and Novara's planned European capacity. The risks are equally important.
              The public record does not show whether demand is diversified or concentrated in a few large AI/HPC
              accounts. Procurement cycles can run longer than two years, and customers may require extensive
              qualification before committing large production volume. Channel dependence on standards groups, strategic
              investors, government-supported capacity and ecosystem partners can help adoption but also masks direct
              customer economics. Until management provides an account-level funnel, top-customer revenue shares, signed
              capacity commitments and repeat-order cohorts, customer concentration remains one of the largest diligence
              risks.
