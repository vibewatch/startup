    {
      "id": "trust-quality-compliance-and-risks",
      "title": "Quality controls are real, but the key reliability proof is still aggregate rather than auditable",
      "body": "The public quality record is stronger than a typical pre-production hardware startup: ISO 9001:2015, ISO 14001:2015 and ISO 45001:2018 are disclosed for the Singapore facility, production milestones are substantial, and the company claims panel-scale yield above the team’s 99.7% wafer-scale record. The limits are that yield is reported as a headline, not as a customer-by-customer qualification package with first-pass yield, rework rate, defect Pareto, reliability acceleration tests or field-return data. Trust also includes IP handling: Silicon Box publicly emphasizes Singapore’s IP protection and customer IP as a priority, but the diligence file still needs data-room controls, access logs and customer audit results. The highest technical risks are single-fab concentration until Italy is qualified, unproven massive-scale PLP relative to incumbents, dependence on UCIe and broader chiplet ecosystem adoption, IP litigation exposure, and substrate/equipment supply constraints.",
