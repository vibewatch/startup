      "id": "assets-facilities-and-maturity",
      "title": "Assets map to one operating Singapore fab, a planned Italy replica and a technology/service layer",
      "body": "The tangible product map has four layers. The Singapore fab is the current production anchor: a 73,000 sqm Tampines facility, opened in July 2023, in mass production since late 2023, dedicated to panel-level packaging and publicly credited with 100 million shipped units in October 2025 and more than 250 million units by Q1 2026. The Italy fab is a roadmap asset: Novara, Piedmont, €3.2 billion of project investment, approximately €1.3 billion of state aid, Q1 2028 initial production, 2033 full capacity and around 10,000 panels per week when mature. SiPlet is the platform label for proprietary panel-level packaging and chiplet interconnection. Test capability is bifurcated: Singapore has demonstrated production, while Europe’s native test ecosystem remains tied to the Italy ramp. This makes maturity strong for Singapore production but still staged for geographic redundancy, automotive-grade qualification and full global capacity.",
