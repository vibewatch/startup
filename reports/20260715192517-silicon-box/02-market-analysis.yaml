  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Silicon Box addresses a real but boundary-sensitive advanced-packaging and chiplet-integration opportunity: reviewed 2026 advanced-packaging estimates span US$41.19B-US$57.46B, while chiplet reports conflict even more widely. The investable question is not whether AI/HPC demand exists, but whether Silicon Box can convert PLP capacity into qualified customer revenue despite CoWoS incumbency, high capital intensity and undisclosed customers."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and status-quo alternatives",
      "body": "Silicon Box should be sized against advanced semiconductor packaging and heterogeneous chiplet integration, not the broader semiconductor, AI-chip or electronics end-market. The core spend is back-end assembly, high-density interconnect, panel-level packaging, 3D integration and test after completed wafers leave a fab. Excluded spend includes front-end wafer fabrication, IP design licenses, HBM memory sales, finished accelerator boards, cloud compute services and downstream device revenue. This boundary matters because AI accelerator and chiplet reports can be much larger than packaging-service revenue and therefore create a double-counting risk. Adjacent pools include OSAT services, substrate supply, design consulting, wafer-level fan-out and CoWoS-style foundry packaging. Status-quo substitutes are monolithic SoCs when reticle limits and yield remain acceptable, conventional wafer-level packaging for smaller devices, and TSMC CoWoS for high-end HBM accelerators where buyers prioritize proven yield and supply assurance over panel-level cost-down potential.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM003",
        "CM004",
        "CM005",
        "CM006"
      ],
      "tableRefs": [
        "TM001"
      ]
    },
    {
      "id": "sizing-lenses",
      "title": "Sizing through multiple non-interchangeable lenses",
      "body": "The most defensible conclusion is a range, not a single TAM. A classic advanced-packaging lens spans roughly US$41.19B to US$57.46B in 2026 across reviewed publishers, with Yole's syndicated US$47.5B estimate serving as a useful midpoint but not a current run-date forecast. Chiplet-market reports are even less harmonized: one 2026 estimate is US$22.58B, while Mordor reports US$65.31B and MarketsandMarkets starts from US$51.94B in 2025. AI accelerator demand provides the strongest demand-pressure lens, with Deloitte estimating a US$500B AI-chip market in 2026 and TrendForce reporting TSMC's AI accelerator wafer demand rising 11-fold from 2022 to 2026. Those figures explain why buyers need capacity, but they are not Silicon Box revenue. The evidence-constrained SAM remains PLP-compatible chiplet designs that can qualify an independent supplier; public sources do not disclose Silicon Box revenue, backlog, customer mix or package-level pricing.",
