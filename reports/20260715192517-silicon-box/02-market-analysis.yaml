    {
      "id": "buyers-users-and-payers",
      "title": "Buyer, user and payer segmentation",
      "body": "The practical buyer is usually a semiconductor company or systems OEM that owns product architecture and qualification risk, while the user is a packaging, product, operations and reliability team managing package design, assembly yield, test and ramp. Fabless AI chip designers and merchant accelerator vendors buy packaging capacity directly or through foundry-linked programs; hyperscalers often shape demand through custom silicon budgets, accelerator procurement and strategic prepayments even when an ASIC partner or foundry executes the purchase order. HPC and cloud segments value bandwidth, thermal performance and schedule certainty; automotive values reliability, traceability and multi-year supply; IoT, mobile and robotics care more about cost, size and availability. Adoption usually runs from architecture selection to package co-design, known-good-die and thermal validation, qualification lots, capacity reservation, production ramp and second-source approval. Budget ownership therefore sits with silicon platform, supply-chain and product-line leaders, not only procurement.",
      "claimRefs": [
        "CM025",
