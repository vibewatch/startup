    {
      "id": "contradictions-and-diligence-gaps",
      "title": "Contradictory estimates and diligence gaps",
      "body": "The biggest diligence issue is not whether the market is large; it is whether the cited market is the one Silicon Box can monetize. Advanced-packaging estimates differ by more than US$16B for 2026, and chiplet estimates differ by nearly 3x for the same year before any adjustment for component revenue versus packaging services. Publisher methodologies mix packaging platforms, chiplet component sales, system-in-package services, AI ASICs and end-user device demand. Public evidence also does not identify Silicon Box's customers, contract length, take-or-pay commitments, revenue, gross margin, package ASP, panel utilization, booked capacity or qualification status by segment. The adverse case is that strong AI/HPC demand is real but already captured by TSMC CoWoS and incumbent OSATs, leaving Silicon Box with a narrower SAM until PLP qualification and the Italy ramp prove reliability and cost advantage. Priority diligence is customer-level revenue, package economics, capacity reservations and independent yield evidence.",
      "claimRefs": [
