  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 视角
      - 正向论点
      - 反向论点
      - 会改变判断的证据
    rows:
      - - 市场
        - 先进封装需求随 AI、HPC、5G、汽车和 chiplet 增长
        - 市场增长会先流向已有装机产能的既有玩家
        - 按细分和客户锁定的需求，而不只是市场报告
      - - 产品 / 技术
        - 小于 5 微米的 SiPlet 和 PLP 瞄准真实的 chiplet 瓶颈
        - 公司说法需要独立客户认证和可靠性数据
        - 第三方认证结果和丢单分析
      - - 客户
        - 公司提到早期客户和大批量出货
        - 具体客户或收入集中度未公开
        - 具名合同、积压订单、集中度和开票回款分组
      - - 财务
        - 已披露 US$450M 可用股权加债务，显示资本可得性
        - 收入、利润率、现金、烧钱和优先权结构未披露
        - 经审计 P&L、现金、资本开支、契约和瀑布分配
      - - 竞争
        - 独立、规模化 PLP 定位具备差异化
        - Amkor、ASE、JCET、TSMC 和 Intel 拥有规模与资产负债表优势
        - 与既有玩家对阵的赢单 / 输单日志，以及性价比证明
      - - 风险 / 执行
        - 新加坡工厂已出货 100M+ 件，并声称良率近乎完美
        - 意大利是多年期、依赖国家援助的资本开支项目
        - 已承诺融资、许可、EPC 排期和面板级良率
    notes: 该表把报告证据转成估值观点变化地图；它不是完整经营模型。
