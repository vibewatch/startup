              投资的收入，以及客户认证和 R&D
              时间可能超过两年的表述。这些代理指标暗示部分客户正在通过认证或进入生产，但没有说明客户是否在首批封装后扩张、项目是否复发、同一批账户是否占主导，或价格在产能竞争下能否守住。尽调应要求按 tape-out
              或认证年份拆分的客户 cohort、订单复购率、取消历史、按客户拆分良率、满意度或审计分数，以及合同期限。
