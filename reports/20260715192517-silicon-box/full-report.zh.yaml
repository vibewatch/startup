  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与既有替代方案
        blocks:
          - type: paragraph
            body: >-
              Silicon Box 应该按先进半导体封装和异构 chiplet 集成来测算，而不是放进更宽的半导体、AI 芯片或电子终端市场。核心支出发生在晶圆出厂之后：后段组装、高密度互连、面板级封装、3D
              集成和测试。排除项包括前端晶圆制造、IP 设计许可、HBM 内存销售、成品加速器板卡、云计算服务和下游设备收入。这个边界很重要，因为 AI 加速器和 chiplet
              报告的市场规模可能远高于封装服务收入，从而带来重复计算风险。相邻资金池包括 OSAT 服务、基板供应、设计咨询、晶圆级 fan-out 和 CoWoS 式晶圆厂封装。既有替代方案包括：当 reticle
              限制和良率仍可接受时继续使用单片 SoC；小型设备采用传统晶圆级封装；高端 HBM 加速器采用 TSMC CoWoS，因为买家把已验证良率和供给确定性置于面板级降本潜力之上。
            claimRefs:
