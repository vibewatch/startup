            body: >-
              Silicon Box 依赖若干交易对手，这些关系有战略价值，也会形成约束。政府支持是意大利案例的核心；贷款方和股权投资人是产能扩张的核心；imec 的 Automotive Chiplet Program
              有助于降低标准风险，但也确认汽车生态仍在围绕互操作性、安全、可靠性和热管理要求收敛。客户证据是最大的承销缺口。公开公告提到早期客户、客户需求、汽车联合开发，以及
              AI/HPC/汽车/机器人细分领域，但没有披露量产客户名称或头部客户收入占比。这种不透明很关键，因为先进封装客户通常认证周期长，产能也可能围绕少数 AI、HPC 或汽车项目集中。竞争上，Silicon Box
              要对抗资产负债表和装机基础大得多的玩家：Amkor 提供数千种封装格式，ASE 和 TSMC 拥有公开市场规模，既有 OSAT / 晶圆代工生态可以在价格、基板准入和客户采购决策上施压。
