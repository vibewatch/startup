        title: 融资历史、资本结构与利益相关方
        blocks:
          - type: paragraph
            body: >-
              可作为主线的公开融资图景，不是一张干净、完整披露的 cap table，而是一组高速增长但略显混乱的 Series B 融资。Silicon Box 2024 年 1 月宣布 US$200M Series
              B，将估值推到 US$1B 以上，投资方包括 BRV Capital、Lam Capital、TDK Ventures、Event Horizon Capital、Grandfull Convergence
              Fund、Hillhouse Capital、Maverick Capital、Prasedium/Praesidium Capital、Tata Electronics、UMC Capital
              和三位联合创始人。WongPartnership 另行列出 2024 年 US$100M Series B2，以及 US$150M Series B2 延伸轮；如果三笔公开金额可以相加，已披露股权融资约为
