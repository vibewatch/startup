      - number: '3.3'
        title: 定价、GTM、转换成本与分销权力
        blocks:
          - type: paragraph
            body: >-
              受审阅的先进封装供应商，没有一家发布可与 SaaS 价格表相比的清晰标价；真正有经济意义的比较，是合同模式、认证负担、产能获取，以及谁控制客户关系。晶圆厂和大型 OSAT
              卖的不是公开单价，而是工程参与、NRE、封装认证、产能预留、晶圆 bumping、组装、测试和直发。这有利于既有巨头：客户可以在封装家族之间
              multi-home，但一旦完成封装协同设计、可靠性认证、基板选择、HBM 供应规划和高产量良率学习，就很难无摩擦地 multi-home。Silicon Box 的 GTM
              优势是独立性：无晶圆厂或系统客户可能不愿把 chiplet 封装放进竞争晶圆厂或垂直整合电子公司的体系内。抵消项是分销权力。TSMC 能把领先制程准入与 CoWoS/InFO/SoIC 打包；Samsung
              能连接晶圆厂、存储和封装交钥匙；ASE、Amkor 和 JCET 拥有全球制造和既有客户采购渠道；SPIL 针对 NVIDIA 的爬坡说明，客户拉动可以快速锁定产能。因此，Silicon Box
              不只要证明面板经济性更好，还要证明分配到的产能、可信质量体系和重复订单。
