  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的剩余风险视图
        blocks:
          - type: paragraph
            body: >-
              风险栈最前面，是项目融资与执行风险相互耦合：Silicon Box 必须一边稳住新加坡爬坡，一边为首个欧洲先进封装工厂融资、建设并完成客户认证；公开计划要到 2028 年才投产，2033
              年才满产。国家援助降低资本负担，但也带来公法义务、优先订单承诺、Open EU Foundry 意图和潜在利润分享；它不是无条件股权。出口管制同样是结构性变量，因为 Silicon Box 在新加坡和欧洲服务
              AI、HPC、汽车和 chiplet 客户，而美国和欧盟规则越来越多地瞄准先进计算、半导体制造设备、软件密钥、再出口和绕道转移。运营证明是真实的——1 亿件、后续 2.5 亿件出货，以及 ISO
              里程碑——但公开来源没有披露客户名称、头部客户结构、毛利率、现金消耗、债务契约、基板 / 设备承诺或现场可靠性批次。投资含义是继续研究，而不是回避：在把意大利扩张承销为增值项之前，应先用私下尽调门槛缓释风险。
