  - id: TV001
    title: 建议摘要表
    columns:
      - 决策字段
      - 当前判断
      - 证据基础
      - 上调条件
      - 下调条件
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 市场、技术和执行信号强；公开财务证明弱
        - 验证具名客户、收入分组、良率 / COGS 和干净股权结构表
        - 折价融资、客户不透明持续，或意大利发生重大延误
      - - 置信度
        - 中
        - 多个公开来源相互印证规模里程碑；私人经济数据仍未披露
        - 经审计收入、积压订单、利用率和毛利率证据
        - 融资数据冲突或尽调回应薄弱
      - - 风险评级
        - 高
        - 巨额资本开支、新兴 PLP 品类、未披露客户、更大的既有玩家
        - 项目融资和客户合同为新加坡与意大利去风险
        - 流动性、建设、质量或客户集中度冲击
      - - 估值立场
        - 约 US$1.55B 时偏贵 / 紧绷
        - 只有当收入已朝上市 OSAT 水准扩张时，这一价格才说得通
        - 以 ≤US$1.1B 入场，或私人证据支撑基准情景
        - 披露估值下无收入证明，或按优先权调整后的价值低于入场价
      - - 回报门槛
        - 5–7 年总回报 ≥3.0x
        - 半导体基础设施流动性差，必须补偿资本开支和周期风险
        - 可信 US$4.5B+ 退出，且稀释可控
        - 考虑未来资金需求后，基准情景无法达到 3x
      - - 持有 / 退出姿态
        - 持有至验证里程碑；客户 / 收入可见后退出
        - 新加坡已有生产验证；意大利到 2028 年才开始生产
        - 战略稀缺性或 IPO 级披露
        - 被迫融资或利用率停滞
    notes: 判断是作者截至 2026-07-15 的价格敏感承保观点；披露的 US$1.55B 估值被视为低可靠性输入，而非已验证的价格发现。
