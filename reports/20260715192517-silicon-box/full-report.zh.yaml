      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              可能的扩张循环是典型半导体 land-and-expand：先赢下 R&D 或认证项目，证明电气、热、成本和良率表现，再进入量产封装，随后扩展到封装变体、相邻产品线、地区和产能预留。Silicon Box
              有几条可信扩张杠杆：新加坡生产动能、战略投资人、imec 的汽车标准生态，以及 Novara 规划中的欧洲产能。风险同样重要。公开记录没有说明需求是分散的，还是集中在少数大型 AI/HPC
              账户。采购周期可能超过两年，客户也可能要求大量认证后才承诺大规模量产。对标准组织、战略投资人、政府支持产能和生态伙伴的渠道依赖能帮助采用，但也会遮住直接客户经济性。在管理层提供账户级漏斗、头部客户收入占比、已签产能承诺和复购订单
              cohort 之前，客户集中度仍是最大的尽调风险之一。
