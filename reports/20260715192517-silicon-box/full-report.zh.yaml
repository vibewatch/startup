            body: >-
              融资记录很强，但还不够干净，不能在没有文件的情况下承销头部估值。公开来源支持 2024 年 1 月 US$200M Series B、估值超过 US$1B；WongPartnership 描述的 US$100M
              Series B2；2025 年 US$150M Series B2 延展轮；以及 2026 年 6 月 S$100M 债务和 US$75M 增额安排。这些来源意味着新债务前已披露股权的工作口径约为
              US$450M，但公开记录内部混乱，因为低可靠性的 Grokipedia 估值和 Series B / B2 命名不能完全对齐。因此，2025 年 7 月据报约 US$1.55B
              的估值应被视作价格输入，而不是已验证的清算价格。它约为已披露工作口径股权资本的 3.4 倍，对稀缺 chiplet
              基础设施资产并不荒谬；但同一套数学也可能掩盖优先权、期权刷新、项目融资索偿、债务契约，以及新加坡产能完工和意大利建设带来的未来稀释。
