      - - 已知良品裸片 / chiplet 输入
        - 提供可工作的 chiplet 供集成
        - 晶圆代工产出、已知良品裸片测试和物流
        - 裸片质量或供应短缺会限制封装良率
        - 来料检验和客户裸片认证
      - - 面板级扇出型基板
        - 形成大型矩形集成面
        - 面板材料、翘曲控制和贴装工具
        - 面板翘曲或贴装误差会拉低良率
        - 自动化加工线和洁净室控制
      - - 介电层和通孔形成
        - 暴露焊盘并构建垂直连接
        - 光刻、激光 / 通孔工艺和介电材料
        - 通孔缺陷或错位会伤害互连密度
        - 工艺控制和计量
      - - RDL 金属化
        - 在 chiplet 之间布设低于 5 微米的高密度互连
        - Cu 种子层 / 电镀、线宽控制和平坦化
        - 细间距下的电镀均匀性和线蚀刻风险
        - 专利描述的密封环 / 导体路径改进
      - - 凸点 / 封装组装
        - 将封装连接到板级或基板接口
        - 凸点材料、基板可得性和组装工具
        - 互连疲劳和热失配
        - 可靠性压力测试和封装检测
      - - 封装测试
        - 筛选完成的 SiPlet / PLP 封装
        - ATE 产能、测试程序和失效分析
        - 覆盖缺口会漏掉潜在缺陷
        - 意大利规划本土测试，新加坡已有生产测试
      - - 客户交付与支持
        - 在 AI/HPC / 汽车 / 移动系统中认证封装
        - 客户验证、现场数据和故障报告
        - 客户特定可靠性不公开
        - 认证报告、退货和纠正行动日志
