        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公司概览已梳理逐轮融资时间线；这里的财务问题，是公开资本来源能否撑过制造爬坡。现有证据支持 US$200M Series B、US$100M Series B2、US$150M Series B2 延伸轮，以及
              2026 年 6 月 S$100M 债务额度，且可能上调 US$75M。这些都是有分量的规模资本来源，但还不能算出 runway。现金余额、burn、债务提款、契约、到期日、抵押品、项目融资条件、新加坡剩余
              capex、意大利股权出资和客户预付款都属于私有信息。意大利工厂带来最清晰的融资依赖：€3.2B 项目成本部分依赖约 €1.3B 已批准的意大利国家援助，并且建设和投产里程碑延伸到 2028 年和 2033
              年。因此，下一次融资触发点基于运营和资本进度，而不只是日历日期。
