        - 公开上市 OSAT，披露先进产品并提交 SEC 10-K
        - 最接近的上市封装 / 测试收入倍数锚点
        - 成熟上市公司，披露收入且客户基础广泛
      - - ASE Technology (3711.TW)
        - 收入 TWD 670.9B；市值 TWD 3.00T；P/S 4.47x
        - 公开市场数据中最大的 OSAT 规模参照
        - 体现外包封装里规模与业务广度的溢价
        - 币种、集团业务组合和公开市场流动性不同于初创公司
      - - JCET Group (600584.SS)
        - 收入 CNY 38.71B；市值 CNY 165.45B
        - 中国 OSAT，收购了 STATS ChipPAC 谱系资产
        - 可作为竞争和 M&A 历史参照
        - 中国上市、本地政策和客户组合限制可比性
      - - TSMC
        - 市值 US$1.97T；P/S 15.34x；LTM 收入 US$128.3B
        - 晶圆代工 / 先进封装上限参照
        - 说明先进封装与晶圆代工主导地位绑定时的战略价值
        - 不是 OSAT 初创公司；倍数不能直接套用
      - - Silicon Box 私募轮次
        - US$200M Series B，估值 >US$1B；US$100M B2；US$150M B2 延展轮
        - 私募融资里程碑
        - 证实投资人在公开收入出现前，已为稀缺的 PLP 执行能力付费
        - 轮次条款、一级 / 二级交易组合和优先权结构未披露
      - - 意大利国家补贴 / 项目里程碑
        - €3.2B 项目；€1.3B 已获批国家补贴；计划 2028 年投产
        - 战略基础设施里程碑
        - 若落地，可拓宽退出叙事
        - 资本开支、许可、建设和利用率仍是未来风险
      - - STATS ChipPAC / JCET 履历
        - BJ Han 曾领导 STATS；JCET 2015 年收购 STATS ChipPAC
        - 运营履历与 M&A 背景
        - 支撑管理层在封装扩产上的可信度
        - 历史履历不是当前交易倍数
    notes: 可比公司有意只取样本；公开市值和 P/S 倍数都是时点数据，不能机械套用到信息不透明的私营公司。
