      - number: '8.4'
        title: 可比公司组合与公开市场合理性校验
        blocks:
          - type: paragraph
            body: >-
              可比公司组合更适合做合理性校验，而不是套公式估值。Amkor 是最接近的上市 OSAT 参照，因为它在美国申报并披露先进产品销售；其 2026 年 7 月市场数据显示，市值约 US$16.7B，基于
              US$7.07B 过去十二个月收入的 P/S 约 2.37 倍。按公开市场数据，ASE 规模大得多，市值 TWD 3.00T，P/S 4.47 倍；JCET 是规模较小的中国上市封装参照。TSMC
              应放进表中，因为它代表先进封装竞争天花板，但其 US$1.97T 市值和 15 倍以上 P/S 反映的是晶圆代工经济性，不是独立 OSAT 创业公司。基于这些证据，Silicon Box 的 US$1.55B
              标记只有在公司能证明收入正走向数亿美元，并且良率、客户质量和利润率可防守时才合理；单靠行业热度或上市公司倍数支撑不了。
