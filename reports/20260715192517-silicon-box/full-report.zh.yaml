      - number: '7.3'
        title: 运营、设施与供应链风险
        blocks:
          - type: paragraph
            body: >-
              运营风险本质上是两座工厂之间的切换问题。新加坡展现了异常快的执行速度——73,000 平方米工厂 11 个月建成，并从 2023 年末开始出货——但在 Novara
              投产前，它仍是公开的生产锚点。意大利计划规模大于新加坡，包含原生测试能力，依赖 2025 年下半年开工，并需要漫长爬坡，到 2033 年约 10,000 片面板 /
              周。任何延迟都会传导到客户认证、收入确认、利润率吸收和下一轮融资需求。可靠性证据令人鼓舞但仍不完整：公司报告近乎完美的良率和认证，但投资人仍需要逐客户认证、现场退货、老化测试失败、工艺偏移和汽车可靠性数据。设备和基板供应也缺少证据；公开记录列出了投资人和生态合作方，却没有列出绑定的产能预留、替代供应商或长交期设备交付排期。
