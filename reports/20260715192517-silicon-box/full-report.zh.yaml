  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 指示性股权价值区间
      - 基于 US$1.55B 的总倍数
      - 概率信号
      - 下行 / 上行触发器
    rows:
      - - 乐观
        - 新加坡接近满产运行；具名 AI/HPC 或车规客户；意大利融资到位且按期推进；4x–5x 类收入稀缺性倍数
        - US$3.5B–US$6.0B
        - 稀释前 2.3x–3.9x
        - 可能成立，但公开资料未证实
        - 客户证明，加上经审计收入 / 利润率路径走向 US$0.8B–US$1.2B
      - - 基准
        - 新加坡把单位出货转成经常性收入；意大利仍可信但尚未投产；3x–4x 类收入倍数
        - US$1.6B–US$2.6B
        - 稀释前 1.0x–1.7x
        - 若私人数据支撑当前轨迹，这是最可信情景
        - 连续两到四个季度披露收入、利用率和良率
      - - 悲观
        - 客户不透明持续；收入低于计划；PLP 经济性或意大利项目延误；以弱条款被迫融资
        - US$0.4B–US$0.9B
        - 稀释前 0.3x–0.6x
        - 风险实质存在，因为公开证据省略关键经济数据
        - 折价融资、契约压力、质量事故或没有具名客户验证
      - - 当前估值标记
        - 2025 年 7 月披露估值约 US$1.55B；可靠性低，且未获独立印证
        - US$1.55B 点估计
        - 1.0x
        - 仅能从二级 / 百科类估计中观察到
        - 条款清单、一级价格、瀑布分配和当前 2026 年估值标记验证
    notes: 区间是以十亿美元计的美元情景估计，不包括未来稀释、清算优先权、项目债务、税费和交易成本。
