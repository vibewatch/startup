      - number: '3.4'
        title: 护城河耐久性：面板规模真实存在，但挡不住规模化反击
        blocks:
          - type: paragraph
            body: >-
              如果 Silicon Box 有耐久护城河，它也不是泛泛的「先进封装」；这个类别已经拥挤。护城河更窄：一家独立封装公司在量产中实现面板尺度的高密度 chiplet 架构，并叠加工艺
              know-how、良率学习和客户特定协同设计。反向证据很强。TSMC 的 CoWoS 产能据报在 2024 和 2025 年翻倍但仍供不应求，扩产波次预计延续到 2026 年；另一个来源称 NVIDIA 预留了
              2025 年大部分 CoWoS-L 产能。这正是被规模压过去的风险：既有巨头可以把稀缺产能变成战略分配，成功的 AI 客户也可能跟随最大、最有保障的产能池，而不是最优雅的独立流程。商品化风险同样可见，因为
              Samsung、JCET 和 PTI 都描述了 fan-out、2.5D/3D、RDL/interposer 或面板级选项。如果 PLP
              带来更低成本、高良率，并为希望摆脱晶圆厂依赖的客户提供中立准入，Silicon Box 仍能赢；但尽调应把客户不透明、私有财务、认证周期以及基板 / HBM 供应获取视为尚未解决的护城河测试。
