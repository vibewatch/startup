  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑是，Silicon Box 位于半导体栈里战略稀缺的一环：面向 AI、HPC、汽车、移动、IoT、机器人和空间技术客户的先进封装与 chiplet
              集成。市场来源显示先进封装品类在增长，公司来源显示其具备 5
              微米以下面板级互连能力，新加坡工厂已经出货可观数量，并宣称良率近乎完美。反向逻辑是，在公开证据证明收入、具名客户、毛利率、利用率、客户集中度或按优先权调整后的所有权之前，估值已经资本化了大量执行成果。竞争也极端激烈：Amkor、ASE、JCET、TSMC
              和 Intel 拥有大得多的资产负债表和客户足迹。因此建议是谨慎正面的跟踪 / 继续研究，而不是不计价格买入。新投资人应要求五至七年至少 3
              倍总价值，并坚持以更低价格、结构化或里程碑式进入，除非私下尽调验证公开故事。
