  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 传统工作流
      - Silicon Box 方案
      - 可衡量或声称的收益
      - 限制 / 控制
    rows:
      - - 将系统拆分为 chiplet
        - 单颗大裸片或既有封装设计流程
        - 围绕 chiplet 划分和封装选择提供架构咨询
        - 声称缩短设计周期，并支持模块化复用
        - 未披露公开设计规则和 EDA 集成深度
      - - 集成异构裸片
        - 晶圆级或基板式组装，受圆形晶圆约束
        - 使用低于 5 微米互连的大尺寸 PLP
        - 互连更短；声称电气性能提升 >50%、功耗改善 >40%
        - 需按具体产品验证基准数据
      - - 扩大先进封装供给
        - 争夺既有先进封装产能
        - 新加坡 PLP 专用产能，加上规划中的意大利复制
        - 100M 出货和 2026-Q1 超过 250M 构成业务牵引力信号
        - 意大利通过认证前，只有一座大批量晶圆厂
      - - 保护敏感芯片 IP
        - 在封装伙伴之间共享设计数据
        - 强调新加坡 IP 制度和客户 IP 优先
        - 地缘政治中立位置可能降低客户顾虑
        - 需要客户审计和数据室证据
      - - 服务 AI/HPC 器件
        - CoWoS 类稀缺产能或单片扩展
        - 面向更大高功率封装的面板级集成
        - AI/HPC 瓶颈下的成本和产能替代方案
        - 既有厂商可以扩产，客户仍未具名
      - - 服务汽车 chiplet
        - 定制 ADAS SoC 和认证负担重的供应链
        - 参与 imec ACP，并共同开发汽车封装
        - 与安全、可靠性和热管理标准工作对齐
        - 完整认证、PPAP 和现场可靠性仍是私有信息
      - - 带来欧盟本地封装 / 测试
        - 后端供应集中在亚洲
        - Novara 工厂配套本土测试和欧洲培训项目
        - 地理冗余，并契合 EU Chips Act
        - 初始生产仅规划在 2028 年；2033 年满产
    notes: 收益来自公开说法或管理层报道表述；本表不假设所有客户都能拿到最高声称的成本或功耗收益。
