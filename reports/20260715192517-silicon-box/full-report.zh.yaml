  - id: TV006
    title: 最终尽调问题表
    columns:
      - 优先级 / 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 1. 股权结构表与条款
        - 全部融资文件、完全摊薄资本结构、优先权、反稀释和期权池
        - 决定按优先权调整后的入场价和稀释
        - CFO、公司律师和领投方律师
      - - 2. 当前价格发现
        - 2025/2026 年一级发行价格、二级交易、估值支持备忘录和董事会批准
        - 检验 US$1.55B 是否是当前且可投资的估值
        - 董事会材料和交易律师
      - - 3. 收入分群
        - 逐客户订单、出货、发票、回款和未交付订单
        - 把单位出货说法转化为收入质量判断
        - 财务、销售运营和审计师
      - - 4. 客户集中度
        - 具名客户、认证状态、采购承诺和赢单 / 输单历史
        - 检验采用情况和议价权
        - 商务团队和客户访谈
      - - 5. 单位经济
        - 按产品拆分的面板良率、COGS、返工、报废、利用率和毛利率
        - 支撑或证伪公开 OSAT 倍数逻辑
        - 运营、质量和成本会计
      - - 6. 新加坡产能
        - 已安装设备、瓶颈、产能计划和到 2028 年满产路径
        - 决定近期收入上限
        - COO、工厂 GM 和设备供应商
      - - 7. 意大利项目融资
        - 国家补贴条件、EPC 进度、许可、债务 / 股权计划和完工成本
        - 牵动最大的未来稀释和延期风险
        - 项目办公室、贷款方、意大利律师
      - - 8. 退出路径
