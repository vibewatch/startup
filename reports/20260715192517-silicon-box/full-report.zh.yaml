  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发器
      - 阈值或事件
      - 行动含义
    rows:
      - - 意大利项目融资 / 国家援助
        - 补助提款、资本开支资金和建设里程碑
        - 任何重大补助违约、某一资本开支资金批次未落实，或 >12 个月且未追回的进度延误
        - 在签署完整融资恢复计划前，不投或重置估值
      - - 出口管制
        - 筛查、许可证拒批、扣留和风险信号
        - 任何明知的 EAR/欧盟两用物项违规、向受制裁终端用户出货，或未解决的香港 / 中国分流风险信号
        - 在独立合规审查完成前，投资逻辑立即失效
      - - 客户集中度
        - 具名收入、购买承诺和认证状态
        - 最大客户收入占比 >35% 且没有多年承诺，或拒绝披露前五大客户集中度
        - 降低收入倍数，并在交割前要求客户访谈
      - - 良率 / 可靠性
        - 首次通过良率、报废、退货、异常、车规可靠性
        - 连续两个季度低于董事会良率 / 可靠性计划，或主要客户线停
        - 暂停增长承保；要求 CAPA 和客户豁免证据
      - - 流动性 / 契约
        - 现金、烧钱、债务提款、契约余量、补助时点
        - 下行情景跑道少于 12 个月，且没有已承诺融资或契约豁免
        - 设置融资条件，或不投
      - - 竞争 / 定价
        - 赢单 / 输单、ASP、毛利率、产能利用率
        - ASP 或毛利率连续两个季度相对董事会计划承压
        - 下调利润率情景，并要求差异化客户证明
      - - 关键人物 / 执行
        - 关键领导留任和继任覆盖
        - 两名关键人员非计划离任，或意大利 / 质量 / 出口角色继任薄弱
        - 要求留任计划、独立 PMO 和董事会报告
      - - 供应商 / 设备
        - 工具交付、基板分配、替代供应商
        - 任何关键路径工具延误超过 90 天且没有合格替代
        - 推迟爬坡，并下调估值里程碑认可度
    notes: 阈值是拟定的投资者控制项，不是公司指引；精确基线需要私下获取董事会计划、合同、补助条款和运营看板。
