      - number: '7.5'
        title: 财务、人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              相比野心，财务模型不透明。公开披露能看到 Series B、B2、B2 延展轮和 S$100M
              债务融资，但看不到现金、消耗、毛利率、营运资本、债务契约、项目融资承诺或客户预付款。公司自己的四周年公告补充了有用但偏负面的背景：第一年 2024 年收入为 $1.87M，客户认证和 R&D
              周期可能超过两年，早期资本开支先于产能利用。这在半导体制造中正常，却让头部估值和融资数字对产能利用假设非常敏感。人员风险也很重要。Silicon Box 联合创始人、Marvell 联合创始人、chiplet
              先驱 Dr. Sehat Sutardja 于 2024 年去世，享年 63 岁；他的离世没有拿掉 BJ Han
              的运营领导力，但会削弱创始人层面的技术指导和网络撬动。执行尽调因此应检查继任图谱、留任、招聘计划、意大利总包治理、质量独立性和董事会监督。
