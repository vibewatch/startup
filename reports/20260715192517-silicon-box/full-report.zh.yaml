      - number: '5.3'
        title: 面板级封装把集成瓶颈转移到大幅面面板和 RDL 互连
        blocks:
          - type: paragraph
            body: >-
              运营模式从工厂前就开始：Silicon Box 先咨询 chiplet 架构和封装选择，再通过面板级 fan-out 工艺把客户 chiplet 做成集成封装。公开专利记录与 fan-out
              晶圆或面板级流程相吻合：在 fan-out 基板或面板上放置 die 或 chiplet、介质层堆叠、通孔成形、再布线层金属化、bump 结构、封装测试，以及切割分粒或最终交付。Silicon Box
              的公开差异化在于，这套流程用大尺寸矩形面板和亚 5 微米互连完成，而不只是传统圆形晶圆封装。最强证据支持一个 RDL 占比较高的 interposer / fan-out
              架构，而不是完整披露的工艺配方；自有工艺参数、面板尺寸、缺陷模式和设备名称仍是私有信息。这一点关键，因为 PLP 良率取决于面板翘曲、光刻、电镀均匀性、材料界面、die
              放置精度和测试覆盖；在这些尺寸上，小的工艺漂移就能摧毁经济性。
