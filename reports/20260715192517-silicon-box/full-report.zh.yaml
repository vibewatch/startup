            body: >-
              GTM 动作是一笔 design-win 加制造爬坡销售。Silicon Box
              必须先与半导体客户围绕架构选择、互连协议、热和可靠性约束、封装开发、材料评审、测试准备和认证合作，之后大批量出货才有意义。这种协作模式让传统 CAC 和 payback 指标不可得；如果不搭配
              design-win 转化和产能预留数据，甚至可能误导。更好的公开代理指标，是出货量、良率、共同开发表述、汽车 chiplet
              项目参与、客户垂直行业提及、投产日期和产能安装里程碑。这些代理指标显示技术和商业动能，但没有披露活跃客户数量、收入是否集中、design win
              需要多久，或早期合作能否产出可重复毛利。投资判断应要求公司给出从首次技术接触到已验收生产批次和回款的漏斗。
