      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              结论是继续研究。作为一家年轻的私有硬件公司，Silicon Box 的公开生产证明异常强：量产、100M 件、超过 250M
              件、极高良率表述、重大先进封装设施和战略融资。问题在于，这些指标都没有闭合从活动到收入、毛利、现金的投资判断链条。第三方财务追踪机构和文章发布的收入或总融资数字，进一步带来歧义，因为它们无法与官方披露顺畅对账。因此，投资委员会应把收入、ARR、毛利率、现金、burn
              和 runway 视为私有且未披露。必要尽调包括客户级收入台账、价格册、合同模板、收入确认备忘录、出货单元到发票的对账、按封装家族拆分的 COGS、按工具和面板线拆分的利用率、capex
              预算、债务协议、国家援助条件、现金预测和下行情形融资计划。在这些材料交付前，估值应受证据质量约束，而不是被战略兴奋推高。
