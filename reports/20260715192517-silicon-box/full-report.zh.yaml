      - number: '1.4'
        title: 规模指标、工厂与披露缺口
        blocks:
          - type: paragraph
            body: >-
              这是一家成立四年的半导体公司，运营规模已经有分量，但仍难映射到常规创业公司指标。新加坡是生产证明点：Silicon Box 于 2023 年 7 月在 Tampines 启用一座 73,000 平方米、约
              750,000 平方英尺、投资 US$2B 的工厂，2023 年底开始量产，到 2025 年 10 月累计出货 100M 件。到 2026 年 Q1，公司称出货超过 250M 件，良率接近完美，同时新加坡产线仍以
              2028 年完成满产安装为目标。意大利则是扩张赌注：Novara 项目投资 €3.2B，获得 €1.3B 已批准的意大利国家援助，预计 2025 年 H2 开工、2028 年投产、2033 年达满产，约每周
              10,000 块面板。缺失指标和正面进展同样重要：Silicon Box 不公开客户名称，不披露当前收入
              run-rate、经审计利润率、现金余额、burn、完整员工数或客户集中度；本章因此把私人财务视为私有且未披露，而不是估算出的真实值。
