      - number: '2.4'
        title: 增长驱动、约束与采用时点
        blocks:
          - type: paragraph
            body: >-
              需求驱动异常强：AI/HPC 工作负载需要连接 HBM 的计算，chiplet 架构降低把每个功能都做成单片裸片的代价，UCIe 正在标准化 die-to-die
              接口，政府也把封装视为战略基础设施。European Chips Act 和已批准的意大利国家援助包，让 Silicon Box 的欧洲扩张具备战略意义；新加坡量产里程碑则支撑 PLP
              能越过试点规模的说法。约束同样关键。面板级产线昂贵，认证周期缓慢；没有良率、热、可靠性和失效分析证明，买家不会拿关键任务 AI 或汽车产品冒险。TSMC 的 CoWoS 主导地位也可能压缩 Silicon Box
              的近期 SAM，因为最大的 AI 项目即使成本更高，也可能偏好已知产能。因此，估值应奖励其暴露在真实瓶颈上的位置，但也要因资本开支、爬坡时点、客户不透明和切换风险打折。
