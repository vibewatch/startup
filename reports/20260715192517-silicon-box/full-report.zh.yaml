    rows:
      - - TSMC CoWoS / InFO / SoIC
        - 代工厂主导的既有厂商
        - 2Q26 净收入 US$35.90B；3DFabric 系列
        - AI 加速器、HPC、HBM 密集型 chiplet
        - 把领先制程节点与 CoWoS/InFO/SoIC 和生态控制打包
        - 不独立于代工选择；产能分配可能偏向战略客户
      - - Intel Foundry 先进封装
        - IDM / 代工新进入者
        - 2025 年 R&D 为 US$13.8B；据报波兰组装 / 测试计划 US$4.6B
        - 无晶圆厂公司、超大规模云厂商、政府、汽车和通信客户
        - EMIB 和先进封装嵌入代工战略
        - 战略重置和代工利用率风险；不是面板级独立 OSAT
      - - ASE Group
        - 最大既有 OSAT
        - 员工超过 95,000 人；分析师来源称 ASE 为全球最大 OSAT
        - 广泛外包封装与测试；AI chiplet
        - VIPack 细间距 chiplet 路线图；全球设施
        - 客户可能更看重成熟 OSAT 的规模，而不是初创公司的速度
      - - SPIL
        - ASE 子公司 / AI 产能节点
        - ASE 子公司为 NVIDIA 加速计算启用并爬坡 Tan Ke Plant
        - AI 组装、晶圆分选、终测和老化
        - 专属客户爬坡和台湾中部扩张
        - 隶属 ASE，因此不是既有 OSAT 势力之外的独立替代方案
      - - Amkor Technology
        - 美国总部上市 OSAT
        - 2025 年净销售额 US$6.708B；Advanced Products 占 82.8%
        - HPC/AI、汽车、IoT、移动
        - 先进产品线广，覆盖 2.5D、HDFO、WLFO、SiPh/CPO，并有全球布局
        - 可能缺少 Silicon Box 声称的标准化面板级 chiplet 聚焦
      - - JCET
        - 全球 OSAT / 交钥匙
        - 全球后道龙头；收购 STATS ChipPAC
        - AI、HPC、存储、汽车、通信
        - 交钥匙封装设计、凸点、组装、测试和 XDFOI 量产
        - 以中国为中心的布局可能触发地缘政治 / 客户约束
      - - Samsung Foundry
        - 垂直整合的代工 / 存储
        - Samsung Foundry 先进异构集成和交钥匙页面
        - 需要存储-逻辑 / HBM 封装的代工客户
        - 2.5D Cube-S、2.3D Cube-E/R、3D Cube 系列和完整封装交钥匙
        - 不独立；可能通过代工 / 存储业务与客户竞争
      - - Powertech Technology (PTI)
        - 偏存储 OSAT / PLP 邻近玩家
        - 台湾上市 OSAT，有财务资料页和 WLP/SIP 服务
        - 存储、WLP、倒装、SiP 和面板扇出
        - FOiP/ePLP 面板扇出说明面板级替代方案存在
        - 高端 AI chiplet 后道领导力证据少于 TSMC/ASE/Amkor
      - - 客户内部自建 / 协同设计
        - 内部自建 / 现状方案
        - IDM、超大规模云厂商和大型芯片厂商可行
        - 控制封装架构和认证的团队
        - 把 IP、供应和路线图控制留在内部或首选代工厂
        - 需要资本开支、封装人才和良率学习；小型无晶圆厂买方很难承担
      - - 传统基板 / 晶圆级流程
        - 现状替代方案
        - 已在许多产品路线图中通过认证
        - 性能 / 成本目标不需要新 chiplet PLP 的客户
        - 避开重新认证和新供应商风险
        - 可能达不到 AI/HPC 对带宽、功耗、密度或封装尺寸的要求
    notes: 规模信号混合公开文件、官方页面和独立市场报道；各供应商价格披露不一致， 因此表格强调产能、覆盖范围和客户渠道。
