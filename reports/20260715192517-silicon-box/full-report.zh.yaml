      - number: '7.2'
        title: 监管、法律与地缘政治风险敞口
        blocks:
          - type: paragraph
            body: >-
              监管风险不是单一许可，而是一串相互重叠的制度。在欧洲，European Commission 批准约 €1.3B 直接补助，用于 €3.2B 的 Novara
              工厂，因为它认定该工厂具备首创性、必要性和相称性；这些认定也产生了投资人需要监控的条件，包括短缺时的优先订单、劳动力培训、更广泛的欧盟价值链影响和 Open EU Foundry
              义务。在美国规则影响范围内，BIS 扩大了对先进计算、半导体制造设备、高带宽内存和外国直接产品的管制，BIS 指引也把香港转移红旗视为出口合规问题。欧盟双用途规则还覆盖出口、转运、居间和技术援助。IP
              风险更不透明：Justia 列出了 Silicon Box 的专利申请，但已审阅的公开来源不能证明其拥有自由实施意见，也不能证明不存在纠纷。新加坡和意大利的有害物质、废水与工厂运营还会触发环境和工人安全义务。
