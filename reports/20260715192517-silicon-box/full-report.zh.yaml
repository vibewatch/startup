chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Silicon Box 即 Silicon Box Pte Ltd，是一家私有新加坡公司，总部位于 Tampines Wafer Park，业务围绕独立先进半导体封装、异构集成，以及后段 chiplet
              落地展开。公司 2021 年成立，不是销售终端设备的无晶圆厂芯片设计商；更像一家先进 OSAT，叠加设计咨询和交钥匙集成能力，服务需要把 chiplet 架构在面板尺度组装起来的客户。公司把自有 SiPlet®
              和面板级封装路径描述为大幅面、亚 5 微米互连方案，目标是在成本、设计周期、功耗和热性能上优于晶圆级及传统封装替代方案。因此，一句话概括其运营模式：Silicon Box 帮助
              AI、HPC、汽车、移动、IoT、机器人和航天科技客户，借助公司在新加坡的自有制造产能和意大利的规划产能，设计、封装、测试并放量基于 chiplet 的半导体。
