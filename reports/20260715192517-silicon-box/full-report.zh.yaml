        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >-
              Silicon Box 应建模为一家私有先进封装服务公司，而不是经常性收入软件公司。公开信息支持两个变现桶：为基于 chiplet
              的器件提供付费封装、组装和测试产出；以及高接触度设计或架构咨询，帮助客户从单片设计迁移到面板级 chiplet
              封装。因此，合理的计费单位可能是通过认证的封装、单元、面板、测试步骤、工程里程碑或交钥匙项目；但纳入审阅的来源没有一家发布报价单、单面板 ASP、NRE 时间表、gross-to-net
              调整或会计政策。即便最有用的官方牵引表述——汽车客户收入在 2026 年 Q1 以 436%
              年化速度增长——也缺少起始基数和组合。收入确认仍是尽调项，因为客户控制权可能在设计里程碑、封装完成、测试放行、出货、验收或回款时转移。
