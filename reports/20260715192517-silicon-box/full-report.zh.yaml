      - number: '1.2'
        title: 创始人、领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              创始团队与产品的匹配度和集中度都不寻常。CEO 兼联合创始人 Dr. Byung Joon (BJ) Han 曾以董事长、CEO 和 CTO 身份领导 STATS ChipPAC 约二十年，并在 JCET
              收购前把公司收入做到约 US$4B；Silicon Box 把他的先进封装运营履历视为核心尽调加分项。联合创始人 Dr. Sehat Sutardja 带来 chiplet 架构论、Marvell
              背景和数百项专利，联合创始人 Weili Dai 则贡献 Marvell 建公司以及生态 / 业务管理经验。这种集中度本身也是风险：Sutardja 于 2024 年突然去世，享年 63 岁，公司失去一位重要
              chiplet 导师和创始人-市场匹配锚点。公开材料显示 BJ Han 到 2026 年仍担任 CEO，Mike Han 负责业务 / 收入工作，JH Yee
              负责运营；但公司未公布完整董事会、董事会委员会或股东控制图，因此治理尽调必须聚焦创始人影响力、投资人权利和继任厚度。
