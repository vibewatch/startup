companyProfile:
  summary: >-
    Silicon Box Pte Ltd 是一家总部位于新加坡的独立先进半导体封装公司，由 Dr. Byung Joon (BJ) Han、Dr. Sehat Sutardja 和 Weili Dai 于 2021
    年创立。公司运作方式接近 OSAT，同时提供 chiplet 设计咨询，使用自有 SiPlet 面板级封装和亚 5 微米互连，在面板尺度集成 chiplet，服务 AI、HPC、汽车、移动、IoT、机器人和航天应用。其 US$2B
    新加坡工厂在 2023 年底进入量产，到 2026 年 Q1 已以近乎完美良率累计出货超过 250M 件；公司还在意大利 Novara 建设第二座工厂，项目投资 €3.2B，并获得欧盟批准的 €1.3B
    意大利国家援助拨款。Silicon Box 已通过披露的股权轮次融资约 US$450M（2024 年 1 月 Series B US$200M，估值 >US$1B；另有 US$100M Series B2 和 US$150M
    Series B2 延伸轮），并在 2026 年 6 月取得 S$100M 债务额度，报道估值约 US$1.55B，但公司不披露经审计财务，也不公布客户名称。
