              制度和中立位置有助于保护敏感客户设计。防御性警示同样重要：专利显示技术活动，不等于拥有实施自由；公开发明人数据库不能替代权利要求对照表；chiplet 价值取决于标准、EDA
              流程、已知良品裸片供应、基板和设备可得性，以及客户认证。TSMC、Intel、ASE 和 Amkor 等既有巨头资产负债表更深，客户认证历史也更长。Silicon Box
              有差异化，但尽调标准应是：它能否比既有巨头调整得更快地扩大面板级良率和客户认证。
