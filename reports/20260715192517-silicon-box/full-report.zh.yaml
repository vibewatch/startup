            body: >-
              Silicon Box 的客户不是终端消费者，而是希望把 chiplet 集成进更高性能系统、同时不自己拥有全部先进封装产能的半导体组织。账户层面的买方很可能是无晶圆厂芯片设计商、IDM、OEM
              或系统公司；日常用户是架构、封装设计、测试、产品工程、采购和供应链团队；预算所有者则是购买设计到制造产能的项目或运营组织。客户群应按垂直行业拆分，因为封装任务不同：AI 和 HPC
              账户需要高密度互连和热性能，汽车客户需要 ADAS 级可靠性和标准对齐，移动和 IoT 买家需要成本与形态改善，机器人或航天账户需要特定性能和供应韧性。地理上目前由新加坡牵引，欧洲计划通过 Novara
              落地。公开记录支持广泛需求，但不支持客户数量或按垂直行业拆分的收入。
