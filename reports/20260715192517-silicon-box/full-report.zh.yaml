              Silicon Box 的公开时间线，从 2021 年创立到跨洲制造扩张，不到五年。关键运营里程碑包括：2021 年创立；2022 年 7 月新加坡工厂破土；2023 年 7 月盛大开业；2023 年 10
              月开始量产；2024 年 1 月成为独角兽的 Series B；2024 年 3 月选定 Novara；2024 年 12 月意大利国家援助获 EU 批准；2025 年 7 月四周年估值和收入披露；2025 年
              10 月出货 100M 件；B2 延伸轮和债务包延续到 2026 年；2026 年 4 月加入 imec Automotive Chiplet
              Program。同一条时间线也埋着后续章节不能忽视的负面事实：Sutardja 去世、对政府激励高度依赖、€3.2B
              意大利巨额资本开支带来的建设和爬坡延期风险，以及既有巨头在先进封装专利组合、产能和客户关系上的压倒性优势。因此，公司既在早期执行上获得强验证，也高度暴露在规模化执行风险中。
