      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              实际买方通常是拥有产品架构和认证风险的半导体公司或系统 OEM；用户则是负责封装设计、组装良率、测试和爬坡的封装、产品、运营和可靠性团队。无晶圆厂 AI
              芯片设计商和商用加速器厂商，会直接购买封装产能，或通过与晶圆厂相连的项目购买；hyperscaler 即便由 ASIC 伙伴或晶圆厂执行采购订单，也常通过定制芯片预算、加速器采购和战略预付款塑造需求。HPC
              和云细分重视带宽、热性能和排期确定性；汽车重视可靠性、可追溯性和多年供应；IoT、移动和机器人更在意成本、尺寸和可得性。采用路径通常从架构选择走到封装协同设计、已知良品裸片和热验证、认证批次、产能预留、量产爬坡和第二来源批准。因此，预算所有权落在硅平台、供应链和产品线负责人手里，而不只是采购。
