  - id: TV005
    title: 投资论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的影响
      - 行动含义
    rows:
      - - 客户证明
        - 尽调中无法验证具名重大客户或收入分群
        - 推翻需求质量前提
        - 不按披露估值投资
      - - 收入质量
        - 收入显著低于董事会计划，或集中在非经常性工程收入
        - 压缩收入倍数和退出准备度
        - 重估至熊市区间
      - - 良率 / 质量
        - 面板级良率、退货或认证失败与近乎完美良率说法不符
        - 摧毁护城河和利润率前提
        - 暂停，等待独立质量审计
      - - 资本结构
        - 按优先权调整后的分配瀑布或降价轮暗示价值低于入场价
        - 名义估值夸大投资人回款
        - 要求更低估值或结构化条款
      - - 流动性 / 债务
        - 下行情景现金续航期 <18 个月，或 S$100M 债务后承受契约压力
        - 抬高被迫融资风险
        - 融资关闭前不投
      - - 意大利执行
        - 国家补贴、许可、EPC 或投产里程碑延误 >12 个月
        - 拿掉牛市情景产能和 EU 战略溢价
        - 将情景重置为基准 / 熊市
      - - 竞争
        - 因价格 / 性能输单给 Amkor、ASE、JCET、TSMC 或 Intel
        - 削弱稀缺性溢价
        - 下调倍数并重新评估护城河
    notes: 这些阈值是拟定的投资人控制项；交割前必须结合董事会计划和私密数据室校准。
