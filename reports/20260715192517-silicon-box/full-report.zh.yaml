      - number: '2.2'
        title: 用多个不可互换的视角测算市场
        blocks:
          - type: paragraph
            body: >-
              最稳妥的结论是区间，不是单一 TAM。经典先进封装视角下，受审阅发布方给出的 2026 年市场大致落在 US$41.19B 到 US$57.46B；Yole 付费报告的 US$47.5B
              估计可作为有用中点，但不是本次运行日的当前预测。chiplet 市场报告口径更不统一：一个 2026 年估计为 US$22.58B，而 Mordor 报告 US$65.31B，MarketsandMarkets
              则从 2025 年 US$51.94B 起算。AI 加速器需求提供最强的需求压力视角：Deloitte 估计 2026 年 AI 芯片市场为 US$500B，TrendForce 报告 TSMC 的 AI
              加速器晶圆需求从 2022 年到 2026 年增长 11 倍。这些数字解释了买家为什么需要产能，但它们不是 Silicon Box 收入。受证据约束的 SAM 仍是 PLP 兼容、且能通过独立供应商认证的
              chiplet 设计；公开来源没有披露 Silicon Box 收入、backlog、客户组合或封装级定价。
