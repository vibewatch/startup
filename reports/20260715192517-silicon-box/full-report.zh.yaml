  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是外包 chiplet 集成，加从设计到制造的执行
        blocks:
          - type: paragraph
            body: >-
              Silicon Box 最适合理解为独立先进封装和异构集成服务，而不是商用芯片供应商或软件平台。从客户流程看，它接住 chiplet 项目最难啃的中段：架构咨询、互连设计选择、面板级 fan-out
              封装、封装组装、测试支持和制造执行。买方是希望把多颗裸片、不同工艺节点或功能模块变成一个 system-in-package
              的半导体或系统公司，同时不想等待稀缺既有产能。因此，服务主张是一种流程替代：客户不再把「方形 chiplet」硬塞进「圆形晶圆」的封装经济里，而是用大尺寸矩形面板、亚 5 微米互连和 SiPlet 品牌下的工艺
              know-how，缩短设计周期、降低成本并保护客户 IP。公开证据列出 AI、HPC、汽车、移动、IoT、机器人和航天科技等目标应用，但没有具名客户，因此尽调边界是能力和生产证明，而不是逐客户验证。
