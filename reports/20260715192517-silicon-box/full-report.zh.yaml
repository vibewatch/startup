      - number: '7.6'
        title: 缓释、监控与打破投资逻辑的标准
        blocks:
          - type: paragraph
            body: >-
              缓释应把叙事转成月度证据。意大利方面，要求已批准且已有资金来源的资本开支栈、建设里程碑、设备交付、许可状态、补助提款条件、利润分享敞口，以及由客户支持的爬坡计划。新加坡方面，要求首通良率、报废、周期时间、可靠性失败、客户退货、审计发现，以及按封装系列拆分的产能利用率。出口管制方面，要求书面产品分类矩阵、终端用户筛查、香港
              / 中国转移控制、欧盟双用途许可流程和董事会级事件报告。客户方面，要求具名账户清单、前五大收入占比、采购承诺、认证状态和续约 /
              扩张历史。打破投资逻辑的情形严厉但可衡量：国家援助批准丧失或出现重大违约、违反出口管制、意大利延迟超过十二个月且没有已融资的恢复方案、反复出现良率 /
              可靠性不达标、流失头部客户，或在没有承诺融资时现金跑道不足十二个月。在这些问题关闭前，即便技术证明很强，剩余风险仍然高。
