          - type: paragraph
            body: >-
              情景估值必须由驱动因素搭建，因为 Silicon Box 是私营公司，不披露收入、EBITDA、资本开支节奏、利用率、客户在手订单或现金。公开 OSAT 和晶圆代工相关参照显示，收入倍数大致从 Amkor 的
              2.4 倍到 ASE 的 4.5 倍不等；TSMC
              高得多，因为它拥有不同的晶圆代工护城河，不能直接作为创业公司倍数。熊市情景下，如果收入远低于预期、具名客户没有落地、意大利滑期，或某轮融资暴露按优先权调整后的价值偏弱，Silicon Box 估值为
              US$0.4B–US$0.9B。基准情景下，如果新加坡把 1 亿件以上里程碑转化成可验证的经常性收入，且意大利仍有资金支持但尚未完全去风险，估值为
              US$1.6B–US$2.6B。牛市情景下，如果公司证明高利用率的面板级经济性，拿下可识别的 AI/HPC/汽车客户，并在大型既有厂商把这一细分商品化前成为战略稀缺资产，估值为 US$3.5B–US$6.0B。
