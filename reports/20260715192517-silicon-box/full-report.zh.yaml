      - number: '8.5'
        title: 退出准备度、最终尽调清单与打破投资逻辑的触发条件
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，即便技术故事有吸引力，Silicon Box 也还没有 IPO 准备度。可信的 IPO
              路径需要经审计收入、在手订单、利润率、资本开支承诺、客户集中度、治理和风险因素披露；战略出售则需要证明买方买的是稀缺产能或技术，而不是昂贵的建设项目。最可能创造价值的路径，是继续持有，等新加坡产能利用给出更多证明，通过意大利
              2028
              年投产里程碑保留选择权，并在客户和收入可见后重新评估。打破投资逻辑的触发条件很具体：无法披露或验证重要客户、持续良率或质量问题、低于已报道估值的降价轮、优先权悬而未决、关键技术领导人流失，或意大利重大延迟 /
              国家援助依赖。最终尽调因此应聚焦股权结构表、收入批次、良率 /
              COGS、客户合同、在手订单、项目融资、债务契约、出口管制敞口和退出可比项。通过这些门槛，结论可能转向买入；不通过，则应转向回避，而不是用摊低价格来辩护。
