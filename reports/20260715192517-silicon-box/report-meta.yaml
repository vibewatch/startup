companyProfile:
  summary: "Silicon Box Pte Ltd is a Singapore-headquartered independent advanced semiconductor packaging company founded in 2021 by Dr. Byung Joon (BJ) Han, Dr. Sehat Sutardja and Weili Dai. It functions like an OSAT while also offering chiplet design-consulting, using proprietary SiPlet panel-level packaging with sub-5-micron interconnect to integrate chiplets at panel scale for AI, HPC, automotive, mobile, IoT, robotics and space applications. Its US$2B Singapore facility reached mass production in late 2023 and had shipped more than 250 million units at near-perfect yield by Q1 2026, and the company is building a €3.2B second plant in Novara, Italy backed by an EU-approved €1.3B Italian state-aid grant. Silicon Box has raised roughly US$450M across disclosed equity rounds (Series B US$200M at a >US$1B valuation in Jan 2024, plus a US$100M Series B2 and a US$150M Series B2 extension) and a June 2026 S$100M debt facility, at a reported ~US$1.55B valuation, but it does not disclose audited financials or name its customers."
