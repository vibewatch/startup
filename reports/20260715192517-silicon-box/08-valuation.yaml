    {
      "id": "exit-readiness-diligence-and-thesis-breaks",
      "title": "Exit readiness, final diligence asks and thesis-break triggers",
      "body": "Silicon Box is not IPO-ready on public evidence, even if the technology story is compelling. A credible IPO path requires audited revenue, backlog, margins, capex commitments, customer concentration, governance, and risk-factor disclosure; a strategic sale requires proof that the buyer is acquiring scarce capacity or technology rather than an expensive construction program. The most likely value-creating path is to hold through additional Singapore utilization proof, preserve optionality through Italy's 2028 production milestone, and reassess once customers and revenue are visible. Thesis-break triggers are concrete: failure to name or verify material customers, persistent yield or quality issues, a down-round below the reported mark, unresolved preference overhang, loss of key technical leadership, or material Italy delay/state-aid dependency. Final diligence should therefore focus on cap table, revenue cohorts, yield/COGS, customer contracts, backlog, project finance, debt covenants, export-control exposure and exit comparables. Passing those gates could move the call toward buy; failing them should move it to avoid rather than justify price averaging.",
