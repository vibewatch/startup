    {
      "id": "financing-valuation-and-entry-discipline",
      "title": "Financing context, valuation support and entry discipline",
      "body": "The financing record is strong but not clean enough to underwrite the headline mark without documents. Public sources support a US$200M Series B in January 2024 at a valuation above US$1B, a WongPartnership-described US$100M Series B2, a US$150M Series B2 extension in 2025, and S$100M of June 2026 debt with a US$75M accordion. Those sources imply working disclosed equity of roughly US$450M before the new debt, but the public record is internally messy because the low-reliability Grokipedia mark and the Series B/B2 naming do not reconcile perfectly. The reported roughly US$1.55B July 2025 valuation should therefore be treated as a price input, not a verified clearing price. It is only about 3.4x the working disclosed equity capital, which is not absurd for a scarce chiplet-infrastructure asset; however, the same math can hide preference seniority, option refreshes, project-finance claims, debt covenants, and future dilution from Singapore capacity completion and Italy construction.",
