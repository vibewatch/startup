    {
      "id": "pricing-gtm-switching-and-distribution",
      "title": "Pricing, GTM, switching cost and distribution power",
      "body": "None of the reviewed advanced-packaging providers publishes clean list pricing comparable to a SaaS price sheet, so the economically relevant comparison is contract model, qualification burden, capacity access and who controls the customer relationship. Foundries and large OSATs sell engineering engagement, NRE, package qualification, capacity reservations, wafer bumping, assembly, test and drop shipment rather than public per-unit prices. This helps incumbents: customers can multi-home across package families, but they do not multi-home frictionlessly after package co-design, reliability qualification, substrate selection, HBM supply planning and high-volume yield learning. Silicon Box's GTM advantage is independence: a fabless or systems customer may prefer not to place chiplet packaging inside a competing foundry or vertically integrated electronics company. The offset is distribution power. TSMC can bundle leading-edge process access with CoWoS/InFO/SoIC; Samsung can link foundry, memory and package turnkey; ASE, Amkor and JCET have global manufacturing and existing customer procurement channels; SPIL's NVIDIA-specific ramp shows customer pull can lock capacity quickly. Silicon Box must therefore prove not merely better panel economics, but allocated capacity, trusted quality systems and repeat orders.",
