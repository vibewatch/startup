    {
      "id": "profiles-capabilities-and-trust",
      "title": "Competitor profiles: scale and trust sit with incumbents",
      "body": "The profile evidence is asymmetric. Silicon Box has a credible production proof point\u2014100 million units shipped, mass production from Singapore since late 2023, ISO certifications and a stated panel-level chiplet claim\u2014but it is still private, customer-opaque and far smaller than public competitors. TSMC generated US$35.90 billion of net revenue in 2Q26 and positions 3DFabric as a complete 3D stacking and advanced-packaging family. Intel's filing frames advanced packaging as part of a trusted foundry strategy for fabless companies, hyperscalers, automotive, communications, aerospace and government customers. Amkor reported US$6.708 billion of 2025 net sales and 82.8% of that from Advanced Products; ASE disclosed over 95,000 employees and SPIL is expanding AI assembly capacity for NVIDIA. JCET presents a global back-end turnkey portfolio and mass-produced fan-out chiplet solution. Samsung can bundle wafer fabrication, HBM/memory-logic integration and package turnkey services. PTI is narrower, but its panel fan-out and WLP pages show that panel-level packaging is not a Silicon Box-only concept.",
