    "number": 4,
    "title": "Financials",
    "summary": "Silicon Box has unusually strong public operating proof for a private advanced-packaging company, including 100M and >250M unit shipment milestones, but it does not disclose current revenue, ARR, gross margin, cash, burn or runway. The investable financial case is therefore constrained by capital intensity, debt and state-aid dependency, and missing unit economics."
  },
  "sections": [
    {
      "id": "revenue-model-and-pricing",
      "title": "Revenue model, pricing and recognition",
      "body": "Silicon Box should be modeled as a private advanced-packaging services company, not a recurring-revenue software business. The public surface supports two monetization buckets: paid packaging, assembly and test output for chiplet-based devices, and high-touch design or architecture consulting that helps customers move from monolithic designs into panel-level chiplet packages. The plausible billing unit is therefore a qualified package, unit, panel, test step, engineering milestone or turnkey program, but no retained source publishes a price card, per-panel ASP, NRE schedule, gross-to-net adjustment or accounting policy. Even the most useful official traction statement — automotive customer revenue growing at a 436% annualized rate in Q1 2026 — lacks the starting base and mix. Revenue recognition remains a diligence item because customer control could plausibly transfer at design milestone, packaging completion, test release, shipment, acceptance or collection.",
