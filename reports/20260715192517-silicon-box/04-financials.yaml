    {
      "id": "financial-verdict-and-diligence-blockers",
      "title": "Financial verdict and diligence blockers",
      "body": "The verdict is research-more. Silicon Box has unusually strong public production proof for a young private hardware company: mass production, 100 million units, more than 250 million units, very high yield language, major advanced-packaging facilities and strategic financing. The problem is that none of those metrics closes the underwriting loop from activity to revenue to gross profit to cash. Third-party financial trackers and articles introduce more ambiguity by publishing revenue or total-funding figures that do not reconcile cleanly with official disclosures. The investment committee should therefore treat revenue, ARR, gross margin, cash, burn and runway as private-undisclosed. Required diligence includes a customer-level revenue ledger, price book, contract templates, revenue-recognition memo, shipped-unit-to-invoice reconciliation, COGS by package family, utilization by tool and panel line, capex budget, debt agreement, state-aid conditions, cash forecast and downside financing plan. Until those are delivered, valuation should be constrained by evidence quality rather than by strategic excitement.",
      "claimRefs": [
        "CI035",
        "CI036",
        "CI037",
        "CI038",
        "CI040",
        "CI045",
        "CI046"
      ],
      "tableRefs": [
        "TI005"
      ]
    }
