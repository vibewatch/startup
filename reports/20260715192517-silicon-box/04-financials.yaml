    {
      "id": "capital-adequacy-and-financing-dependency",
      "title": "Capital adequacy and financing dependency",
      "body": "Company Overview owns the round-by-round chronology; the financial question here is whether public capital sources can bridge the manufacturing ramp. The local evidence supports a US$200 million Series B, a US$100 million Series B2, a US$150 million Series B2 extension, and a June 2026 S$100 million debt facility with a possible US$75 million upsizing. Those are meaningful sources of scale capital, but they are not a runway calculation. Cash on hand, burn, debt draw, covenants, maturity, collateral, project-finance conditions, remaining Singapore capex, Italy equity contribution and customer prepayments are all private. The Italy plant adds the clearest financing dependency: €3.2 billion of project cost relies in part on approximately €1.3 billion of approved Italian state aid, plus construction and production milestones that run into 2028 and 2033. The next financing trigger is therefore operational and capital-schedule based, not simply a calendar date.",
      "claimRefs": [
