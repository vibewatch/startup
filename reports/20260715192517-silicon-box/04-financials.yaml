    {
      "id": "cost-structure-margin-and-working-capital",
      "title": "Cost structure, margin path and working capital",
      "body": "The cost structure is dominated by fixed and semi-fixed manufacturing scale. Singapore required a multibillion-dollar plant, cleanroom tooling and phased equipment purchases, while Italy adds a €3.2 billion expansion with design partners, construction timing and state-aid conditions. Variable service costs likely include substrates, panels, interposers, materials, labor, test, yield loss, engineering support, logistics, utilities and quality systems. Gross margin should improve if high-yield panel utilization, test attach, throughput and mix absorb depreciation and labor faster than pricing pressure or scrap costs rise. None of those required inputs is public. Working capital can also be negative because equipment purchases, WIP, materials and qualification spending precede shipment, acceptance and collection. The public proof of 100 million and then more than 250 million shipped units is important, but without ASP, utilization and cash-conversion data it remains an operating proxy rather than unit economics.",
      "claimRefs": [
        "CI014",
