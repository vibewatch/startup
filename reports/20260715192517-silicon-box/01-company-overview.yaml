    {
      "id": "funding-capitalization-and-investor-base",
      "title": "Funding history, capitalization and stakeholders",
      "body": "The canonical public financing picture is a high-growth but somewhat messy Series B stack rather than a clean, fully disclosed cap table. Silicon Box announced a US$200M Series B in January 2024 that took valuation above US$1B and included BRV Capital, Lam Capital, TDK Ventures, Event Horizon Capital, Grandfull Convergence Fund, Hillhouse Capital, Maverick Capital, Prasedium/Praesidium Capital, Tata Electronics, UMC Capital and the three co-founders. WongPartnership separately identifies a US$100M Series B2 round in 2024 and a US$150M Series B2 extension, making disclosed equity roughly US$450M if the three public round amounts are additive. Debt was added in June 2026 through an S$100M facility, about US$77.65M, from Ares, InnoVen, January Capital and Abound, with a US$75M upsize option. The main caveat is internal inconsistency: Silicon Box's anniversary release groups Series B funding at US$302.5M and reports a US$1.55B valuation, while legal and news sources list separate B2/B2-extension amounts; Series A, secondaries, post-money terms and preference stacks remain unconfirmed.",
