    {
      "id": "scale-metrics-and-disclosure-gaps",
      "title": "Scale metrics, facilities and disclosure gaps",
      "body": "The operating scale is meaningful for a four-year-old semiconductor company but still hard to translate into conventional startup metrics. Singapore is the production proof point: Silicon Box opened a 73,000-square-meter, roughly 750,000-square-foot, US$2B facility in Tampines in July 2023, started mass production in late 2023 and had shipped 100M units by October 2025. By Q1 2026, the company said shipments exceeded 250M units at near-perfect yield, while its Singapore line retained a full-capacity-installation target of 2028. Italy is the expansion bet: a €3.2B Novara project supported by €1.3B of approved Italian state aid, expected to start construction in H2 2025, production in 2028 and full capacity in 2033 at about 10,000 panels per week. The missing metrics are as important as the positives: Silicon Box does not publicly name customers, does not disclose current revenue run-rate, audited margins, cash balance, burn, full headcount or customer concentration, and the chapter treats private financials as private-undisclosed rather than estimated ground truth.",
