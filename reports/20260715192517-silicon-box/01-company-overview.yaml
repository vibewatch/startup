    {
      "id": "milestones-and-adverse-events",
      "title": "Milestones and adverse events",
      "body": "Silicon Box's public chronology runs from 2021 founding to a multi-continent manufacturing expansion in less than five years. The key operational milestones are founding in 2021, Singapore factory groundbreaking in July 2022, grand opening in July 2023, mass production from October 2023, unicorn Series B in January 2024, Novara selection in March 2024, EU approval of Italian state aid in December 2024, a fourth-anniversary valuation and revenue disclosure in July 2025, 100M units shipped in October 2025, the B2 extension and debt package into 2026, and participation in imec's Automotive Chiplet Program in April 2026. The same timeline embeds adverse facts that later chapters should not ignore: Sutardja's death, high dependence on government incentives, a very large €3.2B Italian capex program with construction and ramp-delay risk, and competition from incumbents with much larger advanced-packaging patent portfolios, capacity and customer relationships. That makes the company simultaneously highly validated on early execution and highly exposed to scale-up execution.",
