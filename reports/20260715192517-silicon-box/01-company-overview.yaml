  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Silicon Box Pte Ltd is a Singapore-headquartered, private advanced-semiconductor-packaging company founded in 2021 by BJ Han, Sehat Sutardja and Weili Dai. Its ground truth is a capital-intensive chiplet-integration platform: US$450M of disclosed Series B/B2 equity plus S$100M debt, a Singapore PLP factory already shipping at scale, and a planned €3.2B Novara facility whose execution, incentives and customer opacity are the main overview risks."
  },
  "sections": [
    {
      "id": "identity-and-business-model",
      "title": "Identity, headquarters and business model",
      "body": "Silicon Box is Silicon Box Pte Ltd, a private Singapore company headquartered at Tampines Wafer Park and built around independent advanced semiconductor packaging, heterogeneous integration and back-end-of-line chiplet enablement. Founded in 2021, it is not a fabless chip designer selling end devices; it functions more like an advanced OSAT plus design-consulting and turnkey integration partner for customers that need chiplet architectures assembled at panel scale. The company describes its proprietary SiPlet® and panel-level packaging approach as a large-format, sub-5-micron interconnect scheme intended to lower cost, shorten design cycles and improve power and thermal performance relative to wafer-level and traditional packaging alternatives. The one-line operating model is therefore: Silicon Box helps AI, HPC, automotive, mobile, IoT, robotics and space-tech customers design, package, test and scale chiplet-based semiconductors from company-owned manufacturing capacity in Singapore and planned capacity in Italy.",
