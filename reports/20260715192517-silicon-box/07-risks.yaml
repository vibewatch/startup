    {
      "id": "financial-people-and-execution-risk",
      "title": "Financial, people and execution risk",
      "body": "The financial model is opaque relative to the ambition. Public disclosures show the Series B, B2, B2 extension and S$100M debt facility, but not cash, burn, gross margin, working capital, debt covenants, project-finance commitments or customer prepayments. The company's own fourth-anniversary release adds useful but adverse context: first-year 2024 revenue was $1.87M, customer qualification and R&D cycles can exceed two years, and early capital outlays precede utilization. That is normal for semiconductor manufacturing, yet it makes headline valuation and funding figures sensitive to utilization assumptions. People risk is also material. Dr. Sehat Sutardja, a Silicon Box co-founder, Marvell co-founder and chiplet pioneer, died in 2024 at age 63; his death does not remove BJ Han's operating leadership, but it does reduce founder-level technical mentorship and network leverage. Execution diligence should therefore inspect succession maps, retention, hiring plans, Italy general-contractor governance, quality independence and board oversight.",
