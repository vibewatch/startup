    {
      "id": "partners-customers-and-dependencies",
      "title": "Partner, customer and ecosystem dependencies",
      "body": "Silicon Box depends on several counterparties that are strategically valuable but also constraining. Government support is central to the Italian case; lenders and equity investors are central to capacity expansion; imec's Automotive Chiplet Program helps de-risk standards but confirms the automotive ecosystem is still converging around interoperability, safety, reliability and thermal requirements. Customer evidence is the largest underwriting gap. Public releases refer to early customers, customer demand, automotive co-development and AI/HPC/automotive/robotics segments, but they do not name production customers or disclose top-customer revenue share. That opacity matters because advanced-packaging customers often have long qualification cycles and can concentrate capacity around a few AI, HPC or automotive programs. Competitively, Silicon Box is trying to scale against much larger balance sheets and installed bases: Amkor offers thousands of package formats, ASE and TSMC have public-market scale, and incumbent OSAT/foundry ecosystems can pressure price, access to substrates and customer procurement decisions.",
