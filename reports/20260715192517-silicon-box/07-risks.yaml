    {
      "id": "operational-facilities-and-supply-chain-risk",
      "title": "Operational, facilities and supply-chain risk",
      "body": "Operational risk is a two-facility transition problem. Singapore demonstrates unusually fast execution—a 73,000 square-meter plant built in 11 months and shipping from late 2023—but it remains the public production anchor until Novara enters production. The Italy plan is larger than Singapore, includes native test capability, depends on construction from H2 2025, and requires a long ramp to approximately 10,000 panels per week by 2033. Any delay can transmit into customer qualification, revenue recognition, margin absorption and the next financing need. Reliability evidence is encouraging but incomplete: the company reports near-perfect yield and certifications, yet investors still need customer-by-customer qualification, field returns, burn-in failures, process excursions and automotive reliability data. Equipment and substrate supply are also under-evidenced; the public record names investors and ecosystem collaborators but not binding capacity reservations, alternate suppliers or long-lead tool delivery schedules.",
