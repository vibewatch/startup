  topStrengths:
    - >-
      Proven, differentiated manufacturing: proprietary SiPlet panel-level packaging shipping more than 250M units at
      near-perfect yield (99.7% benchmark) by Q1 2026 from the world's largest PLP-exclusive fab.
    - >-
      Exceptional founding and operating pedigree (STATS ChipPAC and Marvell veterans) plus strong sovereign and
      strategic backing, including an EU-approved €1.3B Italian state-aid grant and blue-chip strategic investors.
    - >-
      Positioned as the only independent packaging company enabling chiplet integration at panel scale in mass
      production, riding structural AI/HPC advanced-packaging demand and the end of monolithic Moore's-law scaling.
  topRisks:
    - >-
      Near-total opacity on revenue, margins, burn, runway and customers at a ~US$1.55B valuation makes underwriting and
      concentration risk impossible to verify.
    - >-
      Extreme capital intensity and execution risk: a €3.2B Novara build dependent on state aid, construction beginning
      in 2025 and full capacity only in 2033, against far larger, better-capitalized incumbents (TSMC, Intel, ASE,
      Amkor).
    - >-
      Key-person and governance exposure after co-founder Sehat Sutardja's September 2024 death, with no public
      board/investor-rights map and unresolved preference/dilution structure.
  unresolvedGaps:
    - >-
      No audited financials: revenue quality, gross margin, monthly burn, cash on hand and runway are undisclosed, and
      reported total raised (~US$450M vs US$583.53M) and valuation figures conflict across sources.
    - >-
      Silicon Box names no specific customers, so real adoption depth, production-vs-pilot mix, retention and customer
      concentration cannot be verified.
    - >-
      Round-by-round terms, primary-versus-secondary composition of the ~US$1.55B mark, liquidation preferences,
      dilution overhang and any Series A remain unconfirmed.
