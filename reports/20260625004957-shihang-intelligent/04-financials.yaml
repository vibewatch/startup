- id: capital-adequacy-and-public-traction-gaps
  title: Capital Adequacy, Public Traction, and Financial Blind Spots
  body: 'Public traction is real, but it is disclosed in investor-friendly operating metrics rather than underwriting-ready accounting metrics. Multiple June 2026 sources converge on H1 order intake above RMB 1 billion, while March coverage already said orders had crossed the same threshold and management raised the annual sales target by three times. Independent coverage also points to named shipping customers, more than 1,000 serviced vessels, and more than 20 core ports, which is much stronger than prototype-only evidence. Capital access also looks strong on the surface: the latest round is described as more than RMB 1 billion and the largest single marine-robotics financing round, while a Dayang Motor filing shows a dedicated Shanghe fund established solely to invest in Shihang. But the same filing is the chapter’s clearest cautionary evidence, because it warns about filing uncertainty, incomplete fundraising risk, long investment cycles, and no guaranteed return. Most importantly, none
    of the retained public sources disclose cash, burn, runway, working capital, or recognized revenue, so capital adequacy cannot be converted into a clean self-funding conclusion.'
