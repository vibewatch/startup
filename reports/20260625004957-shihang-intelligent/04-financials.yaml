- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - best public proxy
  - why it matters
  - exact diligence path
  rows:
  - - Recognized revenue and revenue mix
    - Only order intake and scenario breadth are public
    - Needed to convert momentum into accounting quality
    - Request 2024-2026 audited revenue by ship cleaning, offshore energy, hardware, and other services
  - - Realized pricing and discounting
    - No reviewed page shows list or realized pricing
    - Without this, contribution margin and price discipline are unknowable
    - Review signed customer contracts, quote logs, and pilot-to-production pricing deltas
  - - Gross margin by line
    - BOM reduction and durability claims are directional only
    - Margin path is the core value-creation bridge
    - Request product and service gross-margin waterfalls with warranty and field-service costs
  - - Cash, burn, and runway
    - Financing rounds are public but cash is not
    - Determines financing dependency and next-round timing
    - Obtain monthly cash bridge, unrestricted cash, debt, and budgeted burn by function
  - - Working capital and billing terms
    - Hiring and procurement signal hardware operations but not cash cycle
    - Hardware-plus-service businesses can absorb cash before recognition
    - Review inventory turns, receivable aging, supplier terms, and customer prepayments
  - - Customer concentration and repeat rate
    - Named accounts and 1,000+ vessel servicing show use, not concentration
    - A few SOE accounts could dominate backlog and renewal risk
    - Request top-10 customer revenue share, repeat contract rate, and backlog aging
  notes: This table is the chapter’s underwriting gate. Each row names a concrete missing metric, a public proxy that only partially substitutes for it, and the exact diligence path required to close the gap.
