    - Provide 2025-2026 recognized revenue, average contract value, repeat rate, and contribution margin by cleaning job
  - - Offshore wind inspection / O&M
    - Scenario-led solution sale and service delivery
    - Per project / site program
    - Official pages market inspection and diagnosis workflows; no contract economics disclosed
    - Real adjacency, but public monetization proof is thinner than ship cleaning
    - Disclose signed projects, average revenue per site, and field-gross-margin profile
  - - Offshore photovoltaic inspection
