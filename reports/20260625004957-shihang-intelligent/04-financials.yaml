    - Suggests cost-down potential and faster learning curve
    - Provide before/after unit BOM, labor hours, and margin impact by SKU or module
  - - Core-component life
    - 10,000-hour self-developed component life claimed on official page and repeated by Guancha
    - Medium
    - Longer component life can improve service gross margin and replacement economics
    - Provide mean time between failures, warranty reserve, and field-maintenance cost per operating hour
  - - Per-job realized price
    - Publicly unavailable
    - Low
    - Needed to estimate payback, fleet utilization, and contribution margin
    - Provide contract-level pricing for cleaning, inspection, and recurring-service bundles
  - - Gross margin / CAC / payback
    - Publicly unavailable
    - High that the metric is undisclosed
    - Without these, sales-efficiency and margin path remain un-underwritable
