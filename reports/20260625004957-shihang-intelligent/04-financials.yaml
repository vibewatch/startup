  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Signed contract pricing, discount schedules, and milestone-billing terms for ship cleaning, offshore wind, and PV work.
    whyItMatters: Without realized pricing and billing terms, it is impossible to test gross margin, payback, or backlog quality from public evidence alone.
    diligencePath: Review at least ten recent customer contracts and quote logs by vertical, including pilot-to-production pricing changes.
    relatedQuestionRefs:
    - QI015
    - QI016
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current unrestricted cash, monthly burn, budgeted burn by function, and management runway cases.
    whyItMatters: Capital adequacy is the chapter’s main underwriting blocker because financing size does not prove operating self-sufficiency.
    diligencePath: Obtain monthly cash bridge, board budget, debt schedule, and 12-18 month base / downside runway model.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by revenue line, warranty reserve, field-service cost, and utilization assumptions.
    whyItMatters: The company’s value case depends on durable gross-profit improvement from better components and broader scenario reuse.
    diligencePath: Request product and service gross-margin waterfalls plus maintenance and warranty cost history by offering.
    relatedQuestionRefs:
    - QI016
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: Inventory turns, receivable aging, payable terms, and customer prepayment structure.
    whyItMatters: Hardware-plus-service businesses can consume cash rapidly even when headline orders are strong.
    diligencePath: Review monthly working-capital dashboard, top-customer payment terms, supplier terms, and milestone-acceptance clauses.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: Audited or management-certified bridge from orders and backlog into recognized revenue by period and vertical.
    whyItMatters: Order intake is the strongest public metric, but it cannot substitute for revenue quality or predictability.
    diligencePath: Obtain audited 2024-2025 financial statements and 2026 YTD management accounts with backlog conversion tracking.
    relatedQuestionRefs:
    - QI008
    - QI009
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: stale
    severity: minor
    topic: customer-concentration
    missingEvidence: Current top-10 customer concentration and repeat-service rate by account.
    whyItMatters: Named SOE customers are positive, but concentration risk matters if a few accounts dominate orders.
    diligencePath: Request 2025 and 2026 YTD customer-revenue mix, renewal rate, and vessel-service frequency by top account.
    relatedQuestionRefs:
    - QI006
    - QI010
    - QI025
    relatedTableRefs:
    - TI005
