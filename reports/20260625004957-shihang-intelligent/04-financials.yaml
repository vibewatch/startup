  figureRefs:
  - FI001
- id: gtm-motion-and-delivery-cost-stack
  title: GTM Motion, Sales-Efficiency Proxies, and Delivery-Cost Stack
  body: 'The public GTM picture looks enterprise-heavy and execution-intensive. Hiring disclosures point to solution managers, pre-sales technical support, tender preparation, customer visits, and big-account sales across Beijing, Suzhou-Kunshan, and Tianjin, which is consistent with a consultative sales motion aimed at shipowners, industrial operators, and government-adjacent buyers. That supports a longer cycle than off-the-shelf robotics sales, especially because the same hiring page references owner-side project initiation and bid preparation. On the cost side, the company is clearly not running an asset-light software model: public hiring spans hardware, embedded software, navigation algorithms, assembly, procurement, and field sales. That implies simultaneous spend on R&D, manufacturing or assembly, sourcing, and service deployment. The few public unit-economics positives are directional rather than complete: the company claims 10,000-hour component life, third-party coverage repeats
    that durability edge, and one March article says a Tiger Whale Mini iteration cut BOM cost by 60 percent. Those signals help the margin narrative, but they do not substitute for gross-margin, utilization, or payback disclosure.'
