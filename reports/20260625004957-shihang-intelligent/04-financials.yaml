chapter:
  number: 4
  title: Financials
  summary: Shihang Intelligent’s public financial story is strong on demand signals and fundraising access but weak on underwriting-grade disclosure. Retained sources support a mixed hardware-plus-service model with >RMB1 billion of H1 2026 orders, strategic funding support, and real deployment activity, yet recognized revenue, realized pricing, gross margin, working capital, cash, and runway remain undisclosed.
sections:
- id: revenue-model-and-pricing-opacity
  title: Revenue Model, Monetization, and Pricing Opacity
  body: 'Public evidence supports a mixed hardware-plus-service monetization model rather than a clean SaaS profile. Official and filing materials describe Shihang as a business that develops, produces, sells, and services marine robots, surface robots, and core components, while official scenario pages market integrated marine-service workflows that combine inspection, cleaning, operations, and data output. Ship cleaning is the clearest monetized wedge because it is the most concrete customer job with explicit claims around reduced dry-dock time, lower operating cost, and lower sailing resistance. But the same retained source set also shows why underwriting revenue quality is still difficult: none of the reviewed official pages displayed list pricing, no retained source disclosed actual realized contract pricing, and even the strongest monetization language around AI RaaS came from investor commentary rather than audited contract terms. The best current read is therefore enterprise project
    selling with negotiated scope, not transparent repeatable catalog pricing.'
  claimRefs:
