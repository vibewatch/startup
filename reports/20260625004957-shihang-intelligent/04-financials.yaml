- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - public evidence
  - status / value
  - underwriting read
  - diligence ask
  rows:
  - - Latest equity financing
    - Official and multiple June sources describe a > RMB 1 billion A round
    - Raised and well corroborated
    - Strong ability to attract growth capital
    - Provide cash actually received, close timing, post-money ownership, and reserved ESOP dilution
  - - Dedicated strategic-capital vehicle
    - Dayang-backed Shanghe fund exists solely to invest in Shihang
    - Purpose explicit; target fund size RMB 177.01 million
    - Positive signal for investor access, but not direct company cash disclosure
    - Provide whether the fund investment has closed into company equity and on what terms
  - - Single LP disclosure within vehicle
    - Dayang contributes RMB 30 million as LP
    - Confirmed in filing
    - Shows strategic-capital participation but not full vehicle completion
    - Provide current funded amount vs target amount and closing schedule
  - - Fund-vehicle risk language
    - Filing warns about备案 uncertainty, incomplete fundraising risk, long cycle, liquidity risk, and no guaranteed return
    - Adverse and explicit
    - Capital path is real but conditional
    - Provide all executed close notices and any fallback financing plans
  - - International co-funding support
    - MPA program offers close to SGD 3.7 million shared R&D co-funding across six partners
    - External ecosystem support only
    - Helpful validation, not runway proof
    - Clarify Shihang’s specific share, eligible costs, and cash reimbursement timing
  - - Cash / burn / runway
    - No retained public disclosure
    - Unknown
    - Key blocker to underwriting self-funded scale
    - Provide monthly burn, unrestricted cash, and runway under base / downside scenarios
  notes: This table distinguishes capital access from capital adequacy. Public evidence shows financing momentum, but the absence of cash and burn disclosure prevents a clean runway conclusion.
