      "id": "operational-and-dependency-risk",
      "title": "Operational risk comes from harsh marine conditions and partner-gated deployment rather than from a lack of product narrative",
      "body": "Operationally, the product story is credible, but the failure modes are hard. Company and third-party materials agree that Shihang is working in low-visibility water, strong currents, corrosion, high pressure, weak communications, and complex vessel geometry. MPA’s own language identifies the exact choke points: propellers, rudders, sea chests, tight spaces, stronger currents, and debris collection without disrupting port operations. That means one operational miss can become a regulatory, customer, and liability event at the same time. The public record is also uneven on reliability. Shihang cites million-hour commercial data, 90%+ simulation success, and 10,000-hour component life, but those are company-controlled metrics, not public uptime, MTBF, incident-rate, or coating-compatibility disclosures. Dependency risk is similarly real. Cross-border rollout is not a unilateral product shipment; MPA says deployment involves technology providers, service operators, classification societies, and shipowners working together. In China, public proof is strongest around state-linked maritime ecosystems and hull-cleaning jobs. That is good validation, but it also means approvals, references, and procurement remain partner-mediated. If one or two flagship ecosystems stall, the expansion curve can flatten quickly.",
