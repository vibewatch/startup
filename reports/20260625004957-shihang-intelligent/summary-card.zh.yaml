  topStrengths:
    - 公开证据显示公司早期势头少见，包括 2026 年 6 月一轮 >RMB1 billion 融资，以及 2026H1 >RMB1 billion 订单。
    - 产品面不止单个演示机器人，而是覆盖水下和水面机器人、核心部件，以及多条海事服务流程。
    - 外部验证有分量：公司参与标准制定，项目获中国航海学会一等奖，也入选 Singapore MPA 真实港口试点计划。
  topRisks:
    - 公司仍未公开投后估值、确认收入、毛利率、现金、营运资金转化或完整股权结构表条款，经济性和价格支撑暂时无法承保。
    - 核心商业化仍卡在环保和港口运营门槛上；船体清洁规模化前，还要验证安全性、碎屑处理、成本效益和可持续性。
    - 治理和扩张高度集中在创始人身上，管理层梯队、董事会构成和真实当前人员厚度披露都很薄。
  unresolvedGaps:
    - 准确投后估值、每股价格、清算优先权、股权稀释，以及精确累计融资额仍未披露。
    - 订单转收入尚无公开验证；审计收入、毛利率、在手订单质量、取消情况、烧钱速度和现金跑道都未披露。
    - 客户集中度和留存仍不透明，因为公开来源没有披露头部客户收入占比、续约率、GRR 或 NRR。
    - 海外运营准备度还要靠 Singapore 试点 KPI、可靠性指标、碎屑捕获结果，以及隐私或安全治理材料来证明。
