companyProfile:
  summary: Shihang Intelligent (世航智能 / 苏州世航智能科技有限公司), branded publicly as SEAHI Robotics, is a Kunshan-based Chinese marine embodied-robotics company established on 2023-05-26 and led publicly by founder-chairman-CEO Chen Xiaobo. Public materials show a multi-product platform spanning Orca underwater robots, Ocean X deep-sea robots, Tigershark surface robots, and Pangu core components, with hull cleaning as the clearest commercial wedge and expansion claims across offshore wind, offshore PV, marine ranching, subsea inspection, and scientific missions. Public financing disclosure shows unusually strong capital access for a 2023-founded company, culminating in a >RMB1 billion A round in June 2026, while third-party reporting also cites >RMB1 billion of H1 2026 orders plus Singapore MPA trial selection and national standard/award recognition. Public sources still do not disclose post-money valuation, exact cumulative capital raised, recognized revenue, gross margin, cash, headcount, or a full current executive and board roster.
  foundedDate: '2023-05-26'
  founders:
    - name: Chen Xiaobo
      role: Founder, chairman, CEO
      background: Harbin Engineering University alumnus; public materials describe him as a 1989-born engineer with roughly 19 years in marine robotics before founding Shihang in 2023.
      claimRefs: [CO008, CO009, CO010]
  foundingLocation: Kunshan, Suzhou, China
  headquarters: Kunshan, Suzhou, China
  productSummary: Shihang sells a marine-robotics platform spanning Orca underwater robots, Ocean X deep-sea robots, Tigershark surface robots, Pangu thrusters/core components, and a CEORION autonomy layer, with ship cleaning as the clearest public commercial wedge and additional scenarios across offshore wind, offshore PV, marine ranching, subsea inspection, and scientific missions.
  customerFocus: Shipowners and fleet operators, port and port-service ecosystems, offshore wind and offshore-PV asset operators, and other marine infrastructure users that buy cleaning, inspection, and related robotic service outcomes.
  businessModel: Project-led enterprise sales of marine robots, core components, and robot-assisted cleaning or inspection services; public hiring and solution pages imply a consultative, tender-heavy GTM motion rather than transparent catalog pricing or self-serve software.
  stage: private, Series A-stage
  fundingStatus: Angel+ and Pre-A rounds totaled RMB50 million in 2025, multiple hundred-million-renminbi rounds were disclosed in early 2026, and June 2026 disclosure announced a >RMB1 billion A round; exact cumulative capital raised and the latest post-money valuation remain undisclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO007, CO008, CO010, CO014, CO016, CO017, CO022, CO023, CO024, CI001, CI002, CI007, CI012, CU001, CU002, CU012, CU015, CV001, CV006, CV007]
