- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Legacy workflow
  - Shihang solution
  - Measurable / public benefit
  - Limitation
  rows:
  - - Hull cleaning during berth windows
    - Divers or chemical / manual cleaning with dry-dock delays
    - Underwater robot with high-pressure cleaning plus intelligent navigation
    - No-chemical cleaning, no paint damage claim, shorter dry-dock / berth disruption, reported 50x manual efficiency in one case
    - No public price book, repeat-rate data, or fleet-level success-rate denominator
  - - Offshore wind substructure inspection
    - Manual or vessel-heavy underwater inspection
    - Underwater inspection plus intelligent diagnosis for piles, jackets, and cable routes
    - Public claim of lower downtime and better all-water adaptability
    - No public benchmark on defect-detection accuracy or report-to-repair conversion
  - - Offshore photovoltaic foundation inspection
    - Manual offshore survey and structure checks
    - Substructure inspection, corrosion monitoring, and surrounding-water survey up to 0-300 m
    - Public claim of safer, lower-labor offshore inspection workflow
    - No public deployment count or proof of repeat contracts
  - - Smart-water monitoring and patrol
    - Boat-based patrol or fixed-site manual monitoring
    - Surface robot plus monitoring terminal and cloud-style management narrative
    - Continuous monitoring, patrol, and no-person-in-water operation claims
    - No public data model, dashboard screenshots, or API output examples
  - - Deep-sea survey and resource exploration
    - Crewed / specialized deep-sea equipment with narrow task fit
    - SEAHI X / Ocean X plus common platform narrative for deepwater survey and exploration
    - Public stretch goal toward all-depth reusable architecture
    - Public evidence is thinner than the near-shore cleaning line and still roadmap-like
  - - Industrial project delivery and implementation
    - Custom engineering with fragmented vendors and field teams
    - Consult-demo-quote-bid-implementation workflow backed by project managers and technical staff
    - Suggests Shihang can sell, configure, and deploy complex marine systems end to end
    - Services-heavy delivery can slow scaling and hides gross support burden publicly
  notes: The table is workflow-first because the company’s public surface describes jobs-to-be-done more clearly than SKU-level specifications. Benefits are stated only where a reviewed source made a concrete claim.
