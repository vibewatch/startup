- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current public maturity / status
  - Differentiation signal
  - Diligence gap
  rows:
  - - Tiger Whale underwater robot
    - Shipowners, ports, offshore operators
    - Most mature public product surface; marketed as flagship commercial work platform
    - 24h operation, self-developed core parts/software, full-freedom movement, broad ship-class coverage
    - Need installed-base count, payload/module list, and fleet reliability by task
  - - Tiger Whale Mini
    - Survey, rescue, teaching, light engineering users
    - Publicly listed as a lightweight underwater platform
    - Lighter form factor for survey / rescue / education use cases
    - Need depth, endurance, sensor bundle, and commercial deployment count
  - - Tiger Shark surface robot
    - Surface transport, emergency, patrol users
    - Publicly marketed with mobility-focused claims
    - 30+ knot speed plus autonomous navigation, avoidance, and formation claims
    - Need real operating envelope, endurance, and autonomy stack validation
  - - SEAHI X / Ocean X deep-sea line
    - Deep-sea research and resource-exploration users
    - Publicly positioned but still less evidenced than near-shore cleaning line
    - Extends the architecture into deep-sea survey and mining narrative
    - Need shipped configuration, customer proof, and release / commercialization status
  - - Water-quality monitoring surface robot
    - Environmental, water-management, patrol users
    - Visible on official product surface and smart-water narrative
    - Self-developed algorithms, obstacle avoidance, modular monitoring mission
    - Need sensor payload specs, reporting workflow, and paying-customer examples
  - - Multifunction surface robot
    - Custom surface-mission operators
    - Publicly listed as a configurable surface platform
    - Unmanned autodriving, intelligent operations management, modular customization
    - Need real customer scenario, navigation stack details, and support model
  - - Pangu thruster and core components
    - Internal platform and external industrial buyers
    - Publicly visible core-component layer rather than hidden procurement
    - All-electric, 10,000-hour, self-developed component claim supports vertical control
    - Need supplier concentration, yield, warranty return rate, and outside-sales mix
  notes: Rows separate what is clearly visible on the public product surface from what still needs private diligence. “Current public maturity / status” reflects evidence visible on 2026-06-25, not an internal release taxonomy.
