- id: differentiation-controls-and-technical-gaps
  title: Differentiation, Quality Controls, and Technical Gaps
  body: 'Shihang’s differentiation case is strongest where public sources converge on embodied know-how rather than on software-only claims. Official pages, founder material, and independent June 2026 financing coverage all lean on the same moat elements: self-developed core subsystems, full-freedom underwater actuation, long-life thrusters, difficult-current performance, and a broad scene map from ship cleaning to offshore-energy inspection and deep-sea work. The company also appears to be building proprietary task data and patent depth around the core operating loop; public patent and registry surfaces show active 2026 filings in fault diagnosis, path planning, obstacle avoidance, and sonar-assisted localization. On trust and quality, the evidence is mixed but substantive: QCC lists active ISO 9001, ISO 14001, ISO 45001, ISO 50001, and intellectual-property-management certifications, while company materials point to Chinese standards work, a top navigation-industry award, and Singapore
    MPA trial selection. The gap is transparency depth. Reviewed public pages do not publish privacy architecture, external cybersecurity audits, uptime dashboards, fleet MTBF, incident statistics, or unit-capacity data. That means the moat is plausible and increasingly visible, but investors still need private diligence to confirm whether the engineering stack scales with predictable quality and support economics. Public evidence is therefore good enough to map the stack, but not good enough to clear execution risk.'
