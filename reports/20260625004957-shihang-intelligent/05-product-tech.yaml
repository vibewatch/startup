- id: architecture-delivery-and-roadmap
  title: Architecture, Delivery Model, and Public Roadmap Signals
  body: 'The public architecture narrative is unusually specific for an early-stage robotics company, but it remains evidence from company-issued materials and adjacent coverage rather than from formal technical manuals. Official news, awards, and founder materials consistently describe a six-subsystem stack covering power, control, sensing, navigation, sealing, and launch-recovery. The same sources also describe a reusable architecture of platform plus brain plus modules: a common embodied robot body is paired with task modules for cleaning, inspection, and operations, while the April 2026 CEORION release is positioned as the autonomy layer that unifies perception, task understanding, and action generation. Delivery, however, looks highly services-led. Hiring pages emphasize technical exchanges, tender support, implementation handoff, BOMs, test reports, EMC work, waterproof circuitry, and cross-functional project review, which is the profile of a field-deployed industrial system rather
    than a plug-and-play developer platform. Public roadmap visibility comes from dated milestones instead of a formal release calendar: a 2024 autonomous-marine standard, a 2025 deepwater Ocean X preview, January 2026 underwater-cleaning operating rules, March 2026 award recognition, April 2026 CEORION and Singapore MPA trial selection, and June 2026 financing for scaling. That is enough to show forward motion, but not enough to underwrite release discipline, fleet reliability, or manufacturing cadence.'
