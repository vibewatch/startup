  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-disclosure-gap
    missingEvidence: Fleet MTBF, task abort rate, warranty-return rate, uptime by module, and incident logs for deployed robots.
    whyItMatters: Public point-performance claims are not enough to judge whether the platform is reliable at scale across ports, currents, and offshore environments.
    diligencePath: Request fleet dashboards, maintenance records, and customer SLA packs segmented by robot family and task type.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: trust-disclosure-gap
    missingEvidence: Public privacy, cybersecurity, status, or incident-response documentation for the robot-control and data stack.
    whyItMatters: An autonomy-heavy industrial platform can carry customer data, field telemetry, and remote-control risk, so missing trust disclosures are a real diligence blind spot.
    diligencePath: Ask for architecture diagrams, data-retention policy, penetration-test results, incident playbooks, and any external security certifications under NDA.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: manufacturing-disclosure-gap
    missingEvidence: Annual unit capacity, supplier concentration, yield, scrap, and component lead-time data for core robots and modules.
    whyItMatters: Shihang’s platform story depends on scaling hardware with predictable quality and cost, but the public surface does not show whether manufacturing can keep pace.
    diligencePath: Request factory-capacity plans, approved-vendor lists, yield and rework metrics, and supplier concentration by subsystem.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE003
  - type: missing-source
    severity: minor
    topic: ceorion-benchmark
    missingEvidence: Benchmark methodology, test distribution, and external evaluation for CEORION task-success and zero-shot claims.
    whyItMatters: The model could be strategically important, but without methodology it is hard to compare simulation success rates with real commercial performance.
    diligencePath: Ask for benchmark definitions, real-versus-sim split, safety cases, and customer pilots where CEORION materially improved outcomes.
    relatedQuestionRefs:
    - QE008
    - QE022
    relatedTableRefs:
    - TE003
    - TE005
