- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Public status
  - Scope
  - Why it matters
  - Gap
  rows:
  - - ISO 9001 / 14001 / 45001 / 50001 and IP-management certifications
    - Listed as active on QCC
    - Quality, environment, occupational safety, energy, and IP governance
    - Shows the company has at least formal management-system scaffolding around operations
    - Public pages do not expose audit scope, sites covered, or nonconformance history
  - - China’s first underwater-cleaning robot operating specification
    - Officially cited as published in January 2026
    - Operating rules for underwater cleaning robots
    - Helps legitimize safety / operating discipline in a young category
    - No public full standard text or compliance test summary was reviewed in this run
  - - China Navigation Society first-prize award
    - Officially cited in March 2026
    - AI-driven modular flexible underwater cleaning and inspection project
    - Signals peer and industry recognition for the technical route
    - Awards are not substitutes for field reliability or product-security evidence
  - - Singapore MPA CFP selection
    - Publicly cited in April 2026 sources
    - In-water hull inspection and cleaning trial ecosystem in Singapore
    - Useful international trust signal and regulatory-adjacent validation
    - Program admission is not the same as broad production certification or SLA proof
  - - Engineering-process disclosure
    - Hiring pages openly mention BOMs, test reports, EMC / EMI, sealing, and project-governance steps
    - Design-to-test-to-mass-production and implementation workflow
    - Shows the company is thinking in industrial-quality terms
    - No public yield, scrap, MTBF, or warranty-return metrics disclosed
  - - Cyber / privacy / incident transparency
    - No reviewed public status page, privacy policy, or external security-audit page found on the official surface
    - Robot cloud / data / customer operating stack
    - This is a material trust blind spot for an autonomy-heavy industrial platform
    - Need architecture, retention, security-testing, and incident-response disclosures under NDA
  notes: Controls listed here are only those visible in reviewed public sources. A control can be real and still be a diligence gap if the public evidence does not reveal scope, test method, or operating history.
