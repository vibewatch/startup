- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Public role
  - Evidence
  - Dependency
  - Key risk
  rows:
  - - Embodied robot platforms
    - Provide underwater and surface task execution bodies across depth bands
    - Official product catalog and product pages
    - Mechanical design, sealing, control, and field service quality
    - Exact payload and reliability envelope not publicly documented
  - - Task modules
    - Swap cleaning, inspection, and other work functions onto common bodies
    - Founder article and solution pages
    - Module-tooling integration and customer-specific configuration
    - Module changeover economics and calibration burden undisclosed
  - - Core subsystems
    - Power, control, sensing, navigation, sealing, launch / recovery, plus thrusters
    - Official funding, award, and component pages
    - In-house engineering depth and supplier-process control
    - Scale-up can bottleneck on component yield or specialized manufacturing
  - - Autonomy / data layer
    - CEORION plus navigation, perception, and planning logic for multi-task operation
    - Official funding article, Securities Daily, hiring pages
    - Commercial task data, simulation stack, and sensor fusion quality
    - Benchmarks are company-reported and methodology is not publicly audited
  - - Delivery and integration layer
    - Consultation, quotation, bid response, implementation handoff, and field review
    - Official jobs page and tender / hiring surfaces
    - Project managers, pre-sales, testing, and customer-site access
    - Services-heavy deployments can be hard to standardize
  - - Quality and supplier loop
    - Design, testing, BOM control, EMC work, and supplier process improvement
    - Official jobs page and founder article
    - Disciplined manufacturing partners and internal quality systems
    - No public throughput, reject-rate, or supplier concentration disclosure
  notes: This architecture table mixes hardware, autonomy, and operating-process layers because Shihang’s public materials present the product as an engineered deployment system, not as software alone.
