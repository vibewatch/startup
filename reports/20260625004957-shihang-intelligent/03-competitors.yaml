- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - MPA selection proves international relevance
    - other selected peers can also pass the same 18-month live-port trials and compress differentiation
    - high
    - obtain interim trial KPIs, partner list, and proof of performance on niche areas and debris capture
  - - Broad official scenario scope creates product breadth
    - breadth can dilute category focus while specialists go deeper on one job
    - medium-high
    - test gross-margin and sales-focus trade-offs by scenario and identify which wedge closes fastest
  - - Integrated port-cleaning workflow should be sticky
    - portable ROV vendors can satisfy lighter inspection jobs with easier multi-homing
    - medium
    - separate inspection-only use cases from full cleaning workflows in pipeline and pricing
  - - Custom solution selling preserves pricing flexibility
    - public price opacity can hurt procurement speed versus catalog vendors like QYSEA
    - medium
    - request quote-to-close data, pilot conversion, and reasons for wins/losses against lower-friction products
  - - Domestic and international validation may support trust
    - OceanAlpha and other scaled platforms show stronger public distribution and delivery proof
    - high
    - map reseller, shipyard, class-society, and operator partnerships country by country
  - - Incumbent installed bases can be dislodged by better robotics
    - Teledyne-style support continuity and status quo diver/drydock habits keep lock-in high
    - medium-high
    - collect replacement-cycle evidence, maintenance contracts, and customer references showing incumbent displacement
  notes: This register focuses on whether public moat claims survive contact with better-distributed rivals, exact-job trial peers, and entrenched buyer habits. Severity is an analytical judgment, not a company-disclosed risk rating.
