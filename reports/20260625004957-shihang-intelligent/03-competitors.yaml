    whyItMatters: Without peer-economics visibility, Shihang's exact direct set can be named but not ranked confidently by scale or traction.
    diligencePath: Collect official company profiles, customer references, and any filings or press releases for the other MPA-selected partners.
    relatedQuestionRefs:
