  - type: private-evidence-only
    severity: material
    topic: Shihang pricing and packaging
    missingEvidence: Current standard quote structure, service package definitions, and robot-package pricing for Shihang.
    whyItMatters: Pricing opacity prevents a clean comparison against public catalog substitutes such as QYSEA and against service-outcome models such as HullWiper.
    diligencePath: Request price books, standard quotation templates, and pilot-to-contract examples from Shihang sales or finance.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: certified cleaning performance
    missingEvidence: Verified waste-capture, filtration, coating-protection, and productivity metrics for Shihang versus MPA-style thresholds and rival claims.
    whyItMatters: Moat durability depends on whether Shihang can clear the hard operational and environmental requirements that regulators say still constrain current robotic solutions.
    diligencePath: Request trial reports, class or regulator sign-offs, test protocols, and before/after vessel-performance data.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: switching cost and retention
    missingEvidence: Customer retention, multi-homing behavior, and replacement-cycle evidence across portable ROV and integrated cleaning deployments.
    whyItMatters: The current analysis can infer switching friction from product form factors, but not quantify how sticky deployments really are once customers start buying.
    diligencePath: Ask for cohort retention, expansion, replacement wins/losses, and named references showing whether customers single-home or multi-home across vendors.
