- id: switching-cost-pricing-and-distribution-power
  title: Switching Cost, Pricing Visibility, Multi-Homing, and Distribution Power
  body: 'The public commercial picture is uneven, and that matters for adoption risk. Among retained sources, QYSEA is the outlier on pricing transparency: its official store exposes list prices from $1,399 for V-EVO, $2,999 for V6 Expert, and $7,348 for E-GO. By contrast, Shihang''s reviewed official pages do not show list prices for cleaning services or robot packages, and the same is true on the reviewed official pages for Blueye, CHASING, OceanAlpha, Saildrone, and HullWiper. That opacity pushes buyers toward referenceability, pilots, or channel trust rather than simple price comparison. The switching-cost structure therefore differs by category. Portable ROV systems from QYSEA, Blueye, and CHASING look easier to multi-home because they are tool platforms with accessories and lighter operational integration. MPA-style cleaning systems are stickier because they must fit alongside cargo operations, comply with waste-capture and filtration requirements, and often require operator commitments
    and live-port demonstrations. Distribution power is also asymmetrical: OceanAlpha publishes large delivery and geography numbers; QYSEA advertises a dealer network and direct store; CHASING advertises global after-sales; Saildrone adds partner leverage through Fincantieri; and Teledyne still supports a discontinued installed base. Shihang may be technically competitive, but its public file is thinner on channel and service-network proof than several rivals.'
