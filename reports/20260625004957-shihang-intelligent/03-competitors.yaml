- id: moat-durability-and-displacement-risk
  title: Moat Durability, Lock-In, and Displacement Risk
  body: 'The public moat case is real but narrow. Shihang can point to broader official product scope and to international validation through selection into Singapore MPA''s live-port trial program. Those signals matter because they suggest the company is not just selling concept videos; it is being asked to prove performance in a demanding regulatory and operational environment. But the same MPA documents are also the strongest public warning: regulators say current robotic cleaning solutions still struggle with complex hull areas, stronger currents, debris capture, filtration, and service scale. If several selected peers clear those hurdles over the next 18 months, Shihang''s differentiation could compress quickly. The durability risk is therefore less about one winner taking the whole market and more about commoditization by adjacent categories: service specialists can remove robot-ownership friction; portable ROV vendors can satisfy lighter inspection jobs; and larger autonomy or incumbent
    providers can bundle the workflow into broader marine-service relationships. The status quo also remains a real competitor. MPA''s framework still benchmarks improvement against divers, dry-dock cycles, and other manual or semi-manual cleaning methods, so Shihang must beat not only rival robots but also entrenched buyer habits and procurement patterns.'
