  topStrengths:
    - >-
      Public evidence supports uncommon early-stage momentum, including a >RMB1 billion June 2026 round and >RMB1
      billion of H1 2026 orders.
    - >-
      The product surface is broader than a single-demo robot, spanning underwater and surface robots, core components,
      and multiple marine-service workflows.
    - >-
      External validation is meaningful: standards participation, a China Navigation Society first-prize project, and
      selection into Singapore MPA's live-port trial program.
  topRisks:
    - >-
      The company still does not publicly disclose post-money valuation, recognized revenue, gross margin, cash,
      working-capital conversion, or full cap-table terms, so economics and price support are not underwritable.
    - >-
      Core commercialization remains exposed to environmental and port-operating gates because hull cleaning is still
      being tested on safety, debris handling, cost-effectiveness, and sustainability before large-scale deployment.
    - >-
      Governance and scaling are founder-concentrated, with thin public disclosure on the executive bench, board
      composition, and true current staffing depth.
  unresolvedGaps:
    - >-
      Exact post-money valuation, price per share, liquidation preferences, ownership dilution, and precise cumulative
      capital raised remain undisclosed.
    - >-
      Orders-to-revenue conversion is still unproven publicly; audited revenue, gross margin, backlog quality,
      cancellations, burn, and runway are not disclosed.
    - >-
      Customer concentration and retention remain opaque because public sources do not disclose top-customer revenue
      share, renewal rates, GRR, or NRR.
    - >-
      Overseas operating readiness still needs proof through Singapore trial KPIs, reliability metrics, debris-capture
      results, and privacy or security governance materials.
