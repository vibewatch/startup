    severity: material
    topic: shihang-commercial-proof
    missingEvidence: Shihang-specific pricing, pilot-conversion, repeat-contract, and backlog disclosure for hull-cleaning use cases.
    whyItMatters: Even if the market is attractive, valuation depends on whether Shihang converts pilots into repeat paid work and whether pricing supports margins.
