  evidenceGaps:
  - type: missing-source
    severity: material
    topic: 2026-china-sam
    missingEvidence: An authoritative 2026 China market-size series for robotic in-water hull inspection and cleaning, with a clean scope definition separate from broad underwater robots and from generic ship-cleaning services.
    whyItMatters: Without an apples-to-apples domestic series, any China SAM or SOM number for Shihang is model-driven rather than source-driven.
    diligencePath: Request sell-side or industry-association market tables under NDA, or triangulate from disclosed fleet counts, cleaning frequency, and average contract values by vessel class.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-lines
    missingEvidence: Named shipowner, operator, or port budget lines showing who signs and who pays for recurring robotic hull-cleaning contracts by segment.
    whyItMatters: The public record identifies actors and workflow roles, but it does not fully separate user, payer, and budget authority across every segment.
    diligencePath: Ask management for pilot-to-contract case studies with commercial structure, including technical-manager sign-off, port approvals, and payment responsibility.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: port-permission-matrix
    missingEvidence: A current multi-port matrix showing where in-water cleaning is allowed, conditionally allowed with capture, or disallowed.
    whyItMatters: Regulatory openness is a first-order limiter on serviceable market size and deployment cadence.
    diligencePath: Build a target-port permission map starting with Singapore, Norway, and top Asian bunkering or transshipment hubs, then validate each port’s waste-capture and biosecurity conditions.
    relatedQuestionRefs:
    - QM022
    - QM023
    relatedTableRefs:
    - TM004
