tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Robotic in-water hull inspection and cleaning for commercial vessels
    - Robot-assisted hull inspection, cleaning execution, debris capture, reporting, and recurring service operations
    - Dry-dock repainting, generic deck/interior cleaning, non-marine underwater robots
    - Shipowner/operator pays; technical manager and operations teams sponsor
    - Best current wedge market for Shihang because Singapore MPA trials and public cleaning-robot sources point here
  - - Port-integrated live-condition cleaning and inspection
    - In-port or at-anchor operations that must satisfy local safety and environmental rules
    - Any workflow requiring dry-dock only or ignoring waste-capture requirements
    - Shipowner/operator usually pays; port, class, and service operator co-shape approvals
    - High relevance because public trials show adoption depends on live-port validation, not just hardware capability
  - - Broad ship-cleaning services
    - Hull cleaning, propeller and niche-area cleaning, tank or auxiliary cleaning, and professional maintenance services
    - Broader ship repair capex or shipbuilding backlog
    - Shipowner/operator or contractor budget
    - Useful TAM context but broader than a robot-device or robot-service niche
  - - Hull cleaning and repair
    - Cleaning plus related repair workflows and maintenance activity
    - Non-hull marine services and broad underwater robotics
    - Shipowner/operator or yard/MRO budget
    - Shows how repair-inclusive pages overstate direct robotic-cleaning TAM if used uncritically
  - - Broad underwater robotics adjacency
    - ROV, AUV, gliders, and multiple marine-operations tasks across exploration, defense, engineering, and science
    - Not a direct recurrent hull-cleaning revenue pool
    - Multiple public and private buyers across marine sectors
    - Important adjacency and policy context, but not the right direct boundary for near-term hull-cleaning SOM
  notes: This chapter treats hull inspection and cleaning as the direct wedge market and uses broader underwater-robotics or marine-economy numbers only as adjacency context.
