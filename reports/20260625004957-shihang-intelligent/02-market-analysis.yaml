chapter:
  number: 2
  title: Market Analysis
  summary: Public evidence supports a narrow near-term market in robotic in-water hull inspection and cleaning, nested inside much larger ship-cleaning services and broader underwater-robotics pools. Official IMO, MPA, UNCTAD, and Chinese-government sources show real demand drivers from decarbonization, biofouling control, and shipping scale, but public market estimates remain inconsistent because they mix device, service, repair, and broad underwater-robotics scopes.
sections:
- id: market-boundary-and-adjacencies
  title: Market Boundary and Adjacencies
  body: 'The first analytical task is boundary discipline. Public sources in this run describe at least four different concentric markets: China’s total marine economy, the broader underwater-robotics industry, broad ship-cleaning or hull-repair services, and the much narrower robotic in-water hull inspection and cleaning niche. For Shihang, the cleanest near-term market boundary is the last of those categories because the clearest public commercialization signal is Singapore MPA’s in-water hull inspection and cleaning trial, while public Chinese niche summaries separately discuss underwater cleaning robots. Treating the entire underwater-robotics economy or all marine GDP as direct TAM would overstate the market because those larger pools also include deep-sea exploration, defense, offshore energy, biology, and non-recurring marine projects. Those adjacencies still matter because they signal policy support, engineering talent flow, and optionality for future expansion, but they should sit
    above—not inside—the investable wedge used for near-term adoption and valuation work.'
  claimRefs:
