- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - IMO biofouling guidance and 2025 in-water-cleaning guidance
    - Growth driver
    - Current to 2029
    - Moves cleaning from optional ops hygiene toward a more standardized compliance workflow
    - Track whether major flag or port states formalize MEPC.1/Circ.918 into local operating rules
  - - Fuel, emissions, and schedule economics
    - Growth driver
    - Current
    - Supports repeat cleaning if savings exceed cleaning cost and downtime risk
    - Request customer case studies with before/after fuel, speed-loss, and emissions data
  - - China marine-economy and shipbuilding scale
    - Growth driver
    - Current
    - Large and growing installed base supports a domestic demand thesis even if public niche TAM data are weak
    - Map target vessel classes and port corridors to the company’s actual product readiness
  - - AI+, robotics, and standards policy tailwind in China
    - Growth driver
    - Current to medium term
    - Helps talent, procurement openness, and industrial acceptance of embodied marine-service automation
    - Separate general policy support from product-specific commercial pull
  - - Busy-port validation by Singapore MPA
    - Growth driver
    - 2026-2027
    - Provides a high-signal commercialization and reference-customer pathway if trials convert
    - Request trial KPIs, shipowner names, and commercial follow-on terms
  - - Port restrictions on in-water cleaning
    - Constraint
    - Current
    - Reduces serviceable market until vendors prove safe, compliant capture and waste handling
    - Build a target-port permission matrix and identify capture requirements by location
  - - Capture / effluent proof requirement
    - Constraint
    - Current
    - Shifts competition from pure cleaning speed toward environmental workflow assurance
    - Inspect debris-collection, filtration, and disposal evidence from pilots and regulators
  - - Weak public TAM comparability
    - Constraint
    - Current
    - Limits confidence in headline market-size narratives and weakens valuation precision
    - Normalize each source by scope, geography, year, and service-vs-device inclusion before using it in valuation
  notes: This table mixes demand drivers with adoption blockers because the market’s pace depends as much on port and regulator acceptance as on raw shipowner ROI.
