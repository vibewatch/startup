- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: The defensible wedge narrows from broad marine and underwater-robotics context to a much smaller hull-cleaning robot niche anchored by fleet and port-density evidence rather than one generic TAM headline.
  approximationNotes: The layers intentionally mix broader context pools and narrower wedge markets because public evidence does not provide one clean same-unit hierarchy. Values are shown as sourced headlines, not normalized conversions.
  data:
    nodes:
    - label: China marine economy context
      value: RMB 11.018tn (2025)
      detail: Broadest adjacency; signals spending base and marine industrial depth, not direct hull-cleaning TAM.
    - label: Broad underwater-robotics adjacency
      value: China RMB 14.6B / Global USD 12.3B (2025)
      detail: Includes many non-cleaning applications across exploration, engineering, defense, and science.
    - label: Broad ship-cleaning-services TAM
      value: USD 2.20B (2024)
      detail: Service-market lens that includes more than robotic in-water hull cleaning.
    - label: Narrow China cleaning-robot niche
      value: RMB 0.96B (2023)
      detail: Closest public niche figure in this run, but still not a 2026 SAM or Shihang SOM.
    - label: Serviceable asset base
      value: 116,000 ships / 2.5B dwt (2026)
      detail: Installed-base lens showing recurrence potential once ports and buyers allow compliant deployment.
