        title: Milestones, External Validation, and Open Risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, the company's strongest public signals in 2026 are standards, awards, international trial
              access, and order momentum. Official and media sources say Shihang helped issue China's first underwater
              cleaning robot operating standard in January 2026. Official company materials and the China Navigation
              Society notice then show that a Shihang-led project won the 2025 China Navigation Society Science and
