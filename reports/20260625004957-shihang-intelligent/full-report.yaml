      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest drivers are not abstract robotics enthusiasm; they are shipping economics and regulation.
              IMO, TEST Biofouling, GreenVoyage2050, and IMarEST all link hull fouling to drag, fuel burn, emissions,
              and invasive-species risk. GreenVoyage2050’s USD 5,000–50,000 cleaning-cost range versus 1–5%
              fuel-reduction range describes the base case, while IMarEST and the arXiv paper show upside can be much
              larger or more persistent when fouling is severe or cleaning is optimized. Chinese policy is a secondary
              tailwind because it keeps robotics, “AI+”, and industrial standards on the agenda, and China’s 2024–2026
              marine-economy and shipbuilding data show a large and still-growing installed base. The biggest
              constraints are regulatory acceptance, evidence quality, and conversion risk: many ports still restrict
              in-water cleaning, Norway is moving toward tougher capture logic, and public niche-TAM pages remain
              methodologically weak. For valuation, that means market attractiveness is easier to defend than near-term
              revenue capture. The missing bridge is not whether the problem exists, but whether Shihang can convert
              pilots into repeat compliant contracts fast enough to earn a credible SOM.
