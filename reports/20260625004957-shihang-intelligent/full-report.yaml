      - number: '3.2'
        title: Adjacent Platforms, Portable ROVs, and Incumbent Substitutes
        blocks:
          - type: paragraph
            body: >-
              Outside the exact hull-cleaning peer set, the landscape splits into three important classes. First, scaled
              maritime-autonomy platforms such as OceanAlpha and Saildrone have much stronger public proof of fleet
              scale, partner access, or geographic reach than Shihang's current public file. OceanAlpha says it was
              founded in 2010 and has delivered more than 4,000 USVs and water rescue robots across 55+ countries, while
              also using Seawork 2026 to market offshore inspection and broader commercial-marine solutions. Saildrone
              is farther from berthside hull cleaning but is relevant as an autonomy benchmark: its platform messaging
              is about persistent maritime awareness, and the Spectre program adds Fincantieri manufacturing support and
              a high-end defense/autonomy narrative. Second, portable operator-owned ROV vendors such as QYSEA, Blueye,
              and CHASING attack the inspection/documentation portion of the workflow with lower-friction hardware,
              accessories, and easier deployment. Third, incumbents and service integrators such as Teledyne SeaBotix,
              Fugro, Ocean Infinity, and SeaTrac matter because buyers may solve the underlying job through an
              installed-base supplier, a data/service contractor, or an adjacent autonomous platform rather than by
              standardizing on Shihang itself.
