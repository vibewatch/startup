      - number: '8.3'
        title: Scenario ranges are possible only as explicit proxy math, so the entry rule must stay strict
        blocks:
          - type: paragraph
            body: >-
              Because Shihang’s post-money and recognized revenue remain undisclosed, any valuation range in this
              chapter must be presented as explicit scenario logic rather than as a discovered market fact. The cleanest
              proxy starts from the one hard commercial figure that is publicly repeated: H1 2026 orders above RMB 1
              billion. Even that signal needs a haircut, because project delivery, acceptance, services mix, and
              regulatory gating can delay recognition. The base case therefore assumes only 35% to 50% of a notional RMB
              2.0 billion annualized order pace converts into recognized revenue over the next 12 to 18 months, creating
              a proxy revenue band of roughly RMB 0.7-1.0 billion. Applying a discounted 2.0x-3.0x public-comparable
              range yields an illustrative base valuation band of roughly RMB 1.4-3.0 billion. The bear case assumes
              regulatory slippage, slower conversion, and multiple compression toward about 1.0x-1.5x, which pushes
              value much lower. The bull case needs faster revenue conversion, repeat deployments, and visible
              regulatory de-risking before a 3.5x-5.0x band becomes defensible. That is why entry discipline matters
              more than narrative enthusiasm. If management cannot open the cap table, preference stack, revenue bridge,
              and Singapore milestone scorecard, a new investor should not anchor on the June financing headline alone.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
