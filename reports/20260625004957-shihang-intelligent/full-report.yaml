      - number: '1.3'
        title: Funding History and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence shows unusual velocity but also imperfect round labeling. Pedaily reported in
              May 2025 that Shihang had completed Angel+ and Pre-A rounds totaling RMB50 million. An official January
              2026 company post then said Shihang had completed multiple hundred-million-renminbi rounds, describing an
              A round led by Vertex Ventures and a Pre-A+ round by Jinglue Venture. By March 2026, an official company
              post and China.com coverage reframed the spring financing as A+ and A++ rounds worth several hundred
              million renminbi backed by a Huaying-managed national SME fund, Dashu Changqing, Xinding, 36Kr Fund, and
              incumbent investors. Finally, official June 2026 disclosures and broad media pickup said the company
              completed an A round of more than RMB1 billion, with Shanghe Momentum Fund, Vertex Growth, a CITIC
              agriculture industry fund, Yuzun Capital, and listed company Dayang Motor among the named investors.


              The safe public read is that Shihang has attracted a dense, high-conviction investor syndicate and that
              disclosed capital is already above a RMB1.05 billion floor even before counting the exact spring 2026
              amounts. What public sources do not resolve is the precise cumulative total, a single unambiguous round
              taxonomy, or any post-money valuation. The Dayang Motor filing is still useful because it shows that a
              public-company LP committed RMB30 million into a vehicle created only to invest in Shihang, which is a
              stronger diligence datapoint than a generic media mention. Because full cap-table, ownership, and
              governance-rights data remain private, this chapter treats investor quality as visible but investor
              control economics as unverified.
