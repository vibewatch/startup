            body: >-
              Shihang’s product should be read as a marine-workflow platform, not as a single robot SKU. The company’s
              official pages define the customer job in operational terms: berth-time hull cleaning, underwater
              inspection, offshore wind and photovoltaic diagnosis, smart-water monitoring, and deep-sea survey work.
              Public product pages then map those jobs to a portfolio split across underwater robots, surface robots,
              and core components. Tiger Whale is marketed as the flagship full-freedom underwater workhorse for hull
              and infrastructure tasks; Tiger Whale Mini is a lighter underwater platform for survey, rescue, and
              teaching environments; Tiger Shark and the two surface-robot pages cover fast surface mobility, water
              monitoring, and modular missions; SEAHI X extends the story toward deep-sea exploration; and the Pangu
              thruster page shows that the company wants to own critical subsystems rather than just assemble imported
              parts. The strongest workflow signal is that official solution pages repeatedly frame the offer as
              detect-inspect-operate-data-service rather than simple hardware resale. That supports a
              platform-plus-service reading, but public materials still stop short of product-documentation depth: the
              reviewed surface offers demos, consultation, and quotation paths, not API manuals, configuration matrices,
