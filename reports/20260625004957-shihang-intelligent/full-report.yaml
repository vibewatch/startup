            body: >-
              The public architecture narrative is unusually specific for an early-stage robotics company, but it
              remains evidence from company-issued materials and adjacent coverage rather than from formal technical
              manuals. Official news, awards, and founder materials consistently describe a six-subsystem stack covering
              power, control, sensing, navigation, sealing, and launch-recovery. The same sources also describe a
