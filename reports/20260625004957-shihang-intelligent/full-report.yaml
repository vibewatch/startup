            - label: No public fleet reliability pack or pricing book
        - label: Core components / thruster stack
          values:
            - label: Medium-High
            - label: Official component page plus repeated 10,000-hour and self-developed component claims
            - label: No throughput, warranty, or supplier concentration metrics
        - label: CEORION autonomy layer
          values:
            - label: Medium
            - label: Dated April 2026 release plus public benchmark claims and data narrative
            - label: No benchmark paper, external eval, or production incident data
        - label: Offshore wind / PV inspection workflows
          values:
