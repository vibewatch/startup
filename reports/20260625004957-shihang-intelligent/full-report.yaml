      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more operational than generic “maritime industry” language suggests. Shipowners and
              operators are the natural economic buyers because fouling directly affects fuel burn, schedules, emissions
              compliance, and dry-dock decisions. Technical-management, inspection, and operations teams are the
              immediate users. In parallel, ports, service operators, class partners, and regulators can block or enable
              deployment because live-port cleaning must satisfy safety and waste-capture rules. MPA’s Singapore program
              makes this explicit: technology providers, service operators, classification societies, and shipowners are
              all part of the validation loop. Public workflow pages from Jotun, HullWiper, and ECOsubsea point to the
              same adoption path—pain is identified in vessel performance, a low-disruption pilot is run in a permitted
              location, environmental capture and coating integrity are assessed, and only then does a recurring
              operational contract become plausible. That means the payer is usually a shipowner or operator, but the
              sales cycle often passes through a multi-party permissioning process rather than a one-step equipment
              purchase.
