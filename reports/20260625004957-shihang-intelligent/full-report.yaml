chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Shihang Intelligent's legal entity is 苏州世航智能科技有限公司, which a February 2026 cninfo filing says was
              established on 2023-05-26 as the sole target of the Jiaxing Shanghe Hualong fund. Across its current
              official materials, the company presents itself as a developer, manufacturer, seller, and service operator
              of marine general-purpose robots and intelligent unmanned equipment, with ship cleaning as the clearest
              commercial wedge but with broader positioning across offshore wind, marine solar, marine ranching,
              engineering inspection, resource exploration, and scientific missions. The current product stack disclosed
              publicly includes the Orca underwater robot line, Ocean X deep-sea robots, Tigershark surface robots, and
              Pangu thrusters/core components.


              Official contact materials place the primary operating base in Kunshan, Suzhou, and also list Beijing,
              Tianjin, Hong Kong, and Singapore nodes. The homepage and product pages repeatedly market 0-10000 meter
              all-water operating coverage, combining near-shore service with deep-sea exploration. Official June 2026
              financing coverage and TechDaily both add that the platform rests on six self-developed core systems:
              propulsion, control, sensing, navigation, sealing, and deployment/recovery. Those claims establish broad
              technical ambition and multi-scenario packaging, but reviewed public sources still do not disclose current
              headcount or revenue/run-rate, so commercial scale must be inferred from orders, financing, and deployment
              signals rather than audited operating metrics.
