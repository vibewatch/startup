          detail: Fujian Shipping field test plus Qingdao/Yantai application claims.
          tone: positive
        - id: ecosystem
          label: Named maritime ecosystem
          detail: China Merchants Shipping, COSCO Bulk, port-tech and maritime-service names appear in award and media corpus.
          tone: neutral
        - id: orders
          label: 2026 demand surge
          detail: H1 2026 orders reportedly exceed RMB1 billion.
          tone: positive
        - id: singapore
          label: Singapore validation gate
          detail: MPA trial opens international access but remains pre-scale.
          tone: warning
        - id: scale
