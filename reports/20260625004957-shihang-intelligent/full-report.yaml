      - number: '8.4'
        title: 'Recommendation: research more until price support catches up with company-quality signals'
        blocks:
          - type: paragraph
            body: >-
              The chapter recommendation is research-more with medium confidence, high risk, and an unknown valuation
              stance. That is not a negative view on the underlying company. Public evidence supports a credible thesis
              that Shihang has real market relevance: it raised a very large round, appears to have genuine order
              momentum, was selected into Singapore’s live-port trial program, and competes in a market that is clearly
              becoming more strategic. But public evidence also supports the anti-thesis with equal force:
              commercialization is still trial-gated in a demanding environment, regulatory and environmental
              constraints are tightening, competitor substitutes already offer lower-friction options, and the company
              still has not publicly disclosed the numbers an investor needs to defend a private-round price. That mix
              makes buy language inappropriate on public data alone. The right move is to stay engaged only if diligence
              can close the price-support gap quickly or if access terms explicitly compensate for that opacity. In
              practical terms, the investment can move up the stack if audited revenue conversion, margin quality, and
              preference terms are acceptable; it moves down or out if the hidden post-money is already priced above the
              bull proxy without corresponding proof.
            claimRefs:
              - CV041
              - CV042
              - CV043
