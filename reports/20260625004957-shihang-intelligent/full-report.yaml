        title: Customer segments and buyer roles
        blocks:
          - type: paragraph
            body: >-
              Shihang's public customer file is clearest when read by job-to-be-done rather than by logo count. The most
              mature and best-evidenced segment is ship-hull cleaning, where the economic beneficiary is the shipowner
              or fleet operator that wants lower drag, less fuel burn, and less dry-dock downtime, while ports and
              port-service operators matter as access, scheduling, compliance, and operating-environment gatekeepers.
              Official ship-cleaning pages and product pages repeatedly frame the value proposition in owner economics
              terms: clean while berthed, avoid chemical methods, reduce drag, and lower operating cost. A second
              segment consists of offshore-asset operators in wind and photovoltaic infrastructure, where the buyer is
              closer to an energy asset owner or maintenance contractor buying inspection, diagnosis, and subsea O&M
              capability rather than pure cleaning. A third segment is public-waterway, environmental, and security
              operators using surface or mixed robotic systems, but those customer categories are visible mainly in
              solution marketing rather than in named paying-account proof. This segmentation matters because it shows
              Shihang is not selling a single robot to a homogeneous buyer base; it is selling project-style outcomes
              into maritime, offshore-energy, and public-water domains with different procurement paths and risk
