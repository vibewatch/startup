  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Regulatory or operating misses can propagate quickly into slower deployment, lower margin, more financing
      dependence, and a weaker infrastructure thesis.
    approximationNotes: The map shows transmission logic rather than measured elasticities.
    data:
      nodes:
        - id: approval
          label: Approval gate
          detail: Port and environmental approvals stay trial-stage.
        - id: incident
          label: Operational incident
          detail: Cleaning, coating, waste, or field failure event.
        - id: trust
          label: Trust declines
          detail: Customers and regulators slow adoption.
        - id: slower-deploy
          label: Slower deployment
          detail: Trials and pilots convert more slowly than planned.
        - id: support-cost
          label: Support cost rises
          detail: Field service, rework, and customization burden increase.
        - id: margin
          label: Margin pressure
          detail: Project economics weaken.
        - id: financing
          label: Financing dependence
          detail: More external capital is needed for growth.
        - id: thesis-break
          label: Thesis-break risk
          detail: Marine-robotics infrastructure story no longer de-risks.
      edges:
