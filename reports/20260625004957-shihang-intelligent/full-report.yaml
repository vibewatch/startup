  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public evidence points to strong near-shore product maturity, medium autonomy transparency, and weak public trust
      / reliability disclosure.
    data:
      columns:
        - Maturity
        - Evidence basis
        - Main gap
      rows:
