companyProfile:
  summary: >-
    Shihang Intelligent (世航智能 / 苏州世航智能科技有限公司), branded publicly as SEAHI Robotics, is a Kunshan-based Chinese marine
    embodied-robotics company established on 2023-05-26 and led publicly by founder-chairman-CEO Chen Xiaobo. Public
    materials show a multi-product platform spanning Orca underwater robots, Ocean X deep-sea robots, Tigershark surface
    robots, and Pangu core components, with hull cleaning as the clearest commercial wedge and expansion claims across
    offshore wind, offshore PV, marine ranching, subsea inspection, and scientific missions. Public financing disclosure
    shows unusually strong capital access for a 2023-founded company, culminating in a >RMB1 billion A round in June
    2026, while third-party reporting also cites >RMB1 billion of H1 2026 orders plus Singapore MPA trial selection and
    national standard/award recognition. Public sources still do not disclose post-money valuation, exact cumulative
    capital raised, recognized revenue, gross margin, cash, headcount, or a full current executive and board roster.
