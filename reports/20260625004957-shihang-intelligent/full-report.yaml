      - number: '4.4'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The overall financial read is constructive on demand but still incomplete for underwriting. Shihang’s
              public file supports a credible top-line story: real customer deployments, large reported order intake, a
              broadening vertical opportunity map, and unusual access to strategic capital. It also supports a plausible
              future gross-margin story if in-house components, higher durability, and faster product iteration are as
              strong in field economics as the company and media sources imply. The problem is that the current public
              surface still stops well short of what an investor needs for conviction on revenue quality or runway.
              There is no public recognized revenue, no segment mix, no gross margin, no burn, no cash balance, no
              working-capital detail, and no disclosed realized pricing. International validation is meaningful, but the
              MPA program also shows the company is still being tested on cost-effectiveness and operational compliance
              in live port conditions. The chapter verdict is therefore that financing momentum is stronger than
              disclosure quality: Shihang looks commercially live, but still financing-dependent and diligence-heavy
              until order conversion, margin, and cash metrics are opened.
