      - number: '7.4'
        title: >-
          The right monitor is trial conversion, public reliability evidence, and order-to-cash proof—not more financing
          headlines
        blocks:
          - type: paragraph
            body: >-
              The most important mitigation question is whether Shihang can convert current momentum into evidence that
              is legible to an investor and a regulator at the same time. The strongest monitor is the Singapore
              program: if the 18-month trial produces published evidence on safety, environmental handling,
              cost-effectiveness, and follow-on approvals, regulatory and commercial risk both fall. The second monitor
              is operating transparency. Public MTBF, incident-rate, coating-compatibility, debris-capture, or uptime
              disclosure would matter more than another financing article because those metrics determine whether
              Shihang’s marine-service model scales without a hidden support tax. The third monitor is economic
              conversion. If future materials still stop at orders, financing, and market ambition without bridging to
              revenue, gross margin, and cash discipline, the valuation case should be discounted regardless of top-line
              excitement. Finally, privacy and data-governance architecture becomes a real gating item as the company
              pushes integrated data-service and autonomy layers into overseas contexts. None of these are confirmed
              negative events today. They are the concrete points where a promising commercialization story can either
              harden into durable infrastructure or break under operational and compliance load.
