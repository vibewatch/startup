        title: Expansion, concentration, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              The expansion case is credible, but it is still conditioned on ecosystem and regulatory execution.
              Official pages and financing articles show a second-wave push from hull cleaning into offshore wind,
              offshore PV, marine ranching, subsea pipelines, and related inspection jobs; the A+ / A++ article even
              says offshore-PV work has won a CNNC project and entered nuclear-station inspection. Even so, named public
              proof remains concentrated around maritime maintenance and adjacent Chinese port or shipping
              relationships. Internationally, Singapore is valuable because it is both a marquee market and a hard gate:
              MPA selected SEAHI Robotics for an 18-month in-water hull inspection and cleaning trial, but the program
              is explicitly designed to test cost-effectiveness, environmental sustainability, and safe operation before
              large-scale deployment. MPA and multiple republished industry outlets also spell out the main blockers:
              propellers, rudders, sea chests, stronger currents, tight spaces, debris-capture requirements, and the
              need to avoid disruption in a busy port. IMO adds a broader structural constraint by warning that in-water
              cleaning can release invasive aquatic species and harmful waste, and by moving toward a more mandatory
              biofouling framework. The implication is that Shihang's expansion is not just a technology-sales problem;
              it is a service-operator, classification-society, regulator, and port-approval problem. The upside is
              large, but customer concentration, contract persistence, and cross-border procurement friction still
              require private diligence.
