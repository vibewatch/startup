      - number: '7.3'
        title: >-
          People, execution, and financial-model risk are substantial because public demand signals outrun disclosed
          operating infrastructure
        blocks:
          - type: paragraph
            body: >-
              The internal execution question is whether Shihang can industrialize faster than its own scope expands.
              Public recruiting shows a company hiring across hardware, software management, pre-sales, tender writing,
              implementation handoff, production, procurement, and customer operations. That is consistent with a
              consultative, project-heavy deployment model rather than a standardized robotics SKU business. It may be
              the right go-to-market design today, but it usually scales slower and carries more working-capital burden
              than marketing copy implies. Aiqicha’s public legal-entity snapshot shows only 25 insured employees, while
              QCC and recruiting portals show broad hiring and many listed roles; that discrepancy is only a signal
              because public staffing snapshots can be incomplete, but it still points to bandwidth risk relative to the
              breadth of markets and scenarios being claimed. Financially, the same asymmetry matters. Public sources
              repeatedly confirm >RMB1 billion of H1 2026 orders and a >RMB1 billion A round, but they do not disclose
              recognized revenue, gross margin, cash, or working-capital conversion. The Dayang/Shanghe filing is
              especially useful because it warns that the dedicated investment vehicle is illiquid, uncertain, and not
              capital-protected. Taken together, Shihang looks commercially live but still financing-dependent and
              disclosure-light.
