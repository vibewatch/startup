      - number: '2.2'
        title: Sizing Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is usable only if each number is tied to its scope. The narrowest China niche number
              in this run is Sohu’s RMB 0.96 billion 2023 underwater-cleaning-robot estimate with a RMB 3.18 billion
              2030 forecast. Broader global-service pages size ship cleaning services at USD 2.20 billion in 2024 and
              hull cleaning plus repair at USD 2.211 billion in 2024, implying a much larger pool because they include
              manual services, repair activity, and wider vessel-maintenance workflows rather than just robotic devices.
              UNCTAD then adds a non-revenue lens: the serviceable asset base starts from a 116,000-vessel global
              merchant fleet and 2.5 billion dwt of capacity. This mixed evidence is enough to show that the market is
              real and recurrent, but not enough to defend one clean 2026 SAM or a Shihang-specific SOM from public data
              alone. The right read is therefore multi-lens: revenue estimates for scope, fleet statistics for install
              base, and port-throughput data for density and urgency.
