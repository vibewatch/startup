  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Regulatory and legal risk is concentrated in hull-cleaning approvals, environmental compliance, and
          data-governance obligations
        blocks:
          - type: paragraph
            body: >-
              The sharpest external risk is regulatory and legal, because Shihang’s most visible wedge—robotic in-water
              hull cleaning—sits inside a tightening environmental and port-operations framework rather than a simple
              equipment-sale regime. Singapore MPA’s April 2026 selection is positive, but the release is explicit that
              the work remains an 18-month trial to prove safe operation, cost-effectiveness, environmental
              sustainability, and compliance with global requirements before large-scale deployment. IMO’s 2023
              biofouling page goes further: in-water cleaning can release invasive species and harmful waste, damage
              coatings, and is now moving from voluntary guidance toward a legally binding framework. The AFS Convention
              also restricts harmful anti-fouling substances on ships entering party ports, while ISO 6319:2026
              formalizes planning, documentation, and reporting expectations for cleaning operations. Separately,
              Shihang increasingly markets data-service and autonomy workflows. That creates a second legal signal: if
              deployments process identifiable crew, contractor, or port-side data, China’s PIPL imposes minimization,
              transparency, sensitive-data, and cross-border-transfer duties. No retained public source showed a
              dedicated privacy or security packet during this run, so the correct read is not “noncompliant,” but
              “governance diligence remains materially open.”
            claimRefs:
