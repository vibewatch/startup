  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Peer Set and Exact-Job Alternatives
        blocks:
          - type: paragraph
            body: >-
              The most direct public competitive frame is not a generic “marine robotics” bucket but the specific
              in-water hull inspection and cleaning workflow. Shihang's own current official pages market marine-service
              coverage that includes ship cleaning, underwater inspection, pipeline detection, hull inspection,
              underwater construction, and emergency rescue, so the company is clearly targeting more than a single
              inspection SKU. But Singapore MPA's in-water hull inspection and cleaning program shows how exacting the
              target job really is: regulators want systems that can work in tight berth conditions, cover complex
              geometries such as propellers and rudders, avoid disrupting cargo operations, and capture/filter
              biofouling waste rather than simply removing it. MarineLink's report on the same program shows the field
              is already crowded: 19 proposals from 36 companies across nine countries were narrowed to six selected
              partners, including SEAHI Robotics, C-Leanship, Neptune Robotics, Oceanis Robotics, Alicia Bots, and RINA.
              That means Shihang already sits inside a real direct-peer cohort, not an empty category. HullWiper is the
              clearest outside-the-program direct substitute in the retained public set because it sells diver-free
              hull-cleaning outcomes that can happen during cargo or bunkering operations, which reduces buyer adoption
              friction for owners who care about cleanliness and uptime more than robot ownership.
