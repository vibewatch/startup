  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Shihang's customer journey is enterprise and multi-party: ROI interest starts with shipowner or asset pain, but
      deployment closes only after technical, regulatory, and operational stakeholders line up.
    data:
      items:
        - label: Need discovery
          detail: Shipowner, port, or offshore operator identifies cleaning, inspection, uptime, or safety pain.
          tone: neutral
        - label: Technical evaluation
          detail: Robot capability, current tolerance, hull geometry, and site conditions are checked.
          tone: neutral
        - label: Pilot or proof job
          detail: Field test, port entry, or trial engagement validates whether the system can work in live water conditions.
          tone: neutral
        - label: Operational approval
          detail: Service operators, classification partners, and regulators assess debris handling, safety, and workflow fit.
          tone: warning
        - label: Production deployment
          detail: Use broadens into recurring cleaning or inspection jobs when economics and compliance are acceptable.
          tone: positive
        - label: Expansion
          detail: Potential upsell is from hull cleaning into adjacent inspection, offshore energy, and international ports.
          tone: positive
    approximationNotes: null
    claimRefs:
