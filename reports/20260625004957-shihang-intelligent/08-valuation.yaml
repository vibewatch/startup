  rows:
  - - Teledyne Technologies
    - Listed U.S. industrial / instrumentation company
    - 2025 net sales USD 6.115 billion; June 24 2026 market cap USD 28.36 billion; ~4.6x market cap / sales
    - High-quality benchmark for how public markets reward disclosed industrial-tech proof
    - Far broader than Shihang and not a direct hull-cleaning pure play
  - - Fugro
    - Listed Dutch geo-data and marine-services company
    - June 24 2026 market cap EUR 1.13 billion; revenue EUR 1.85 billion; ~0.6x market cap / revenue
    - Useful low-end benchmark for a cyclical marine-services business
    - Services-heavy, offshore-wind exposed, and not a robotics pure play
  - - Kongsberg Gruppen
    - Listed Norwegian defence / maritime systems group
    - 2025 revenue NOK 58.6 billion; June 24 2026 market cap 255.78 billion NOK; ~4.4x market cap / revenue
    - Shows what a scaled, disclosed maritime-technology leader can command
    - Massively broader and more mature than Shihang
  - - Kraken Robotics
    - Listed Canadian subsea technology company
    - 2025 revenue CAD 102.2 million; June 2026 market cap USD 1.51 billion; multiple only directional because public sources are cross-currency
    - Closest disclosed growth-style subsea benchmark in the retained set
    - Currency mismatch and different business mix limit direct normalization
  - - OceanAlpha
    - Private autonomy competitor
    - Publicly disclosed scale markers include 4,000+ deliveries, 600+ customers, and 60+ countries, but no public valuation
    - Useful private-scale reference showing another Chinese maritime-autonomy platform with greater disclosed fleet scale
    - No public financing or valuation mark retained in this run
  - - QYSEA / Blueye / CHASING cluster
    - Private inspection-substitute set
    - Public store pricing and inspection positioning show low-friction tool alternatives, not disclosed valuation multiples
    - Relevant for buyer substitution and adoption friction rather than for direct valuation math
    - Not directly comparable to Shihang’s full-service marine-robotics ambition
  notes: The table is a partial comparable set limited to public references fetched in this run. It mixes direct, adjacent, and substitute names because the public direct-peer universe is thin.
