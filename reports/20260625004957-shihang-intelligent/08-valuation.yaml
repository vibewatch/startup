- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - side
  - argument
  - public support
  - what would change the view
  rows:
  - - Thesis
    - Shihang has broken out of prototype status into real market relevance.
    - '>RMB1 billion A round, >RMB1 billion H1 orders, and MPA selection all support real commercialization signals.'
    - A disclosed revenue bridge and margin profile would upgrade this from promising to underwritable.
  - - Thesis
    - The market backdrop is large enough to support a meaningful winner.
    - Chyxx’s 2025 market-size estimates suggest a large and still-scaling underwater-robotics market.
    - Independent customer ROI evidence would help convert TAM into investable SAM.
  - - Thesis
    - The company is operating in a strategically important segment where proof can command premium attention.
    - Singapore trial inclusion and investor mix show institutional interest in the category.
    - Published trial KPIs and repeat contracts would justify a higher-quality multiple.
  - - Anti-thesis
    - The financing headline may be outrunning the evidence needed to justify price.
    - No public source disclosed post-money, share price, preferences, audited revenue, or cash runway.
    - Opening the cap table and audited statements could narrow or remove this objection.
  - - Anti-thesis
    - Commercial scaling is still gated by regulation and live-port operating proof.
    - MPA and IMO both emphasize debris capture, complex hull geometry, and environmental compliance.
    - A completed trial plus commercial approvals would materially de-risk the model.
  - - Anti-thesis
    - Lower-friction substitutes already exist for inspection-heavy buyer jobs.
    - QYSEA, Blueye, CHASING, OceanAlpha, and Saildrone all show adjacent or substitute buyer paths.
    - Evidence that Shihang wins on full-workflow ROI rather than on demo quality would strengthen the moat.
  notes: The thesis and anti-thesis are intentionally symmetrical. A strong company can still be a poor entry if price support and disclosure lag the story.
