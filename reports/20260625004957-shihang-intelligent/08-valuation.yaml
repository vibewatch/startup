- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Cap table and round terms
    - Post-money valuation, price per share, liquidation preference, anti-dilution, board rights, and investor side letters
    - This is the single biggest blocker to calling the round attractive or stretched
    - Request full financing deck, term sheet, and counsel summary from the company.
  - - 2025-2026 financial bridge
    - Audited 2025 revenue, 2026 YTD recognized revenue, gross margin by line, backlog, cancellations, and cash runway
    - Without this, order headlines cannot be converted into value
    - Request audited statements plus monthly operating dashboard.
  - - Singapore trial scorecard
    - Milestones, success criteria, environmental KPIs, vessel classes, and follow-on commercialization pathway
    - The trial is the highest-signal external proof point for global deployment readiness
    - Request MPA workplan, operator feedback, and current milestone status.
  - - Customer quality and concentration
    - Top customers, repeat rate, cohort conversion, contracted duration, and payment terms
    - Valuation quality depends on revenue durability, not only on order size
    - Request customer cohort table and anonymized contract samples.
  - - Unit economics
    - Hardware versus service mix, contribution margin, field-support burden, and working-capital profile
    - These determine whether a premium multiple is deserved or dangerous
    - Request product / service P&L and cash-conversion analysis.
  - - Governance and secondary overhang
    - Any founder liquidity, employee secondary, escrow, or hidden governance friction in the round
    - These terms can change downside and exit timing even if operations look good
    - Request board materials, shareholder agreement summary, and lock-up terms.
  notes: These asks are ordered by how directly they change the price question. The first two are blocking; the rest determine whether the company merits a premium after price is known.
