  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: post-money-valuation
    missingEvidence: The latest round’s post-money valuation, share price, and full preference stack are not disclosed in any public source fetched in this run.
    whyItMatters: Without the actual price and investor-rights stack, no recommendation can honestly claim that the round is attractive or stretched.
    diligencePath: Obtain the term sheet, shareholder agreement summary, and cap table from management or existing investors under NDA.
    relatedQuestionRefs:
    - QV002
    - QV025
    - QV028
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin-bridge
    missingEvidence: Audited 2025 results plus a 2026 YTD bridge from orders to recognized revenue, gross margin, and cash runway remain private.
    whyItMatters: The chapter’s scenario ranges depend on explicit conversion assumptions because the core financial bridge is absent from the public record.
    diligencePath: Request audited statements, board pack KPIs, and monthly operating metrics covering revenue, backlog, cancellations, gross margin, and cash.
    relatedQuestionRefs:
    - QV005
    - QV021
    - QV023
    - QV030
  - type: private-evidence-only
    severity: material
    topic: trial-conversion
    missingEvidence: The public record does not disclose detailed Singapore trial milestones, success thresholds, or commercialization criteria.
    whyItMatters: The MPA program is the cleanest external proof point for global deployment readiness, so its hidden KPI structure materially affects valuation confidence.
    diligencePath: Request the trial workplan, environmental KPI deck, operator feedback, and current milestone status.
    relatedQuestionRefs:
    - QV008
    - QV020
    - QV029
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: No public source in this run disclosed repeat rates, customer concentration, contract duration, or payment terms.
    whyItMatters: Order headlines can mask weak durability or concentrated risk, which directly changes warranted multiples.
    diligencePath: Request a customer cohort table, concentration analysis, and anonymized contract examples.
    relatedQuestionRefs:
    - QV004
    - QV029
    - QV030
  - type: conflicting-data
    severity: minor
    topic: comparable-normalization
    missingEvidence: Some retained comp references mix currencies or segment scopes, so not every public comp can be converted into a clean same-basis multiple.
    whyItMatters: The valuation band is still directionally useful, but the precision ceiling is lower than it would be with a richer direct-peer set.
    diligencePath: Pull exchange-consistent revenue and market-cap series for each priority comp before the next refresh.
    relatedQuestionRefs:
    - QV016
    - QV017
    relatedTableRefs:
    - TV004
