- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - explicit assumptions
  - valuation / return logic
  - probability signal
  - downside trigger
  rows:
  - - Bear
    - H1 orders do not convert on time; Singapore trial slips or disappoints; investors discover aggressive private-round terms.
    - Assume roughly RMB 0.5 billion recognized revenue and about 1.0x-1.5x revenue proxy, implying around RMB 0.5-0.75 billion illustrative value.
    - Most likely if trial milestones or order conversion remain narrative-only through the next 12 months.
    - Failure to disclose revenue bridge or evidence of hidden senior preference stack.
  - - Base
    - Annualized order pace remains intact but only 35%-50% converts into recognized revenue over 12-18 months; regulatory proof improves but is not fully cleared.
    - Assume roughly RMB 0.7-1.0 billion recognized revenue and about 2.0x-3.0x revenue proxy, implying around RMB 1.4-3.0 billion illustrative value.
    - Most likely if commercialization is real but still services-heavy and diligence remains needed.
    - Material slippage in order conversion, gross margin, or trial outcomes.
  - - Bull
    - Order conversion is fast, repeat deployments expand, and Singapore or similar programs produce public operating proof.
    - Assume roughly RMB 1.2-1.5 billion recognized revenue and about 3.5x-5.0x revenue proxy, implying around RMB 4.2-7.5 billion illustrative value.
    - Only justified if disclosure quality catches up with momentum and premium-quality comp logic becomes plausible.
    - Any sign that price already embeds this case before audited proof is available.
  notes: These are illustrative proxy ranges built from explicit revenue-conversion assumptions plus public-comp bands. They are not discovered market marks for Shihang.
