- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold / event
  - transmission to thesis
  - action implication
  rows:
  - - Price opacity persists
    - No post-money, share-price, or preference disclosure even after access is requested
    - You still cannot test whether a strong company is already overpaid
    - Do not advance beyond screening.
  - - Revenue bridge fails
    - Management cannot reconcile H1 2026 orders to recognized revenue, backlog, cancellations, and gross margin
    - Order headlines stop being usable as valuation anchors
    - Reset to bear case or walk away.
  - - Singapore trial disappoints
    - No credible progress on environmental handling, safety, or cost-effectiveness during the trial window
    - The strongest external commercialization proof point weakens
    - Discount multiple and extend diligence hold.
  - - Preference stack is investor-unfriendly
    - Senior liquidation preferences, ratchets, or other hidden protections dominate the round economics
    - The headline financing size overstates common-equity upside
    - Avoid or insist on materially better entry terms.
  - - Repeat-customer proof is thin
    - No cohort data or customer concentration disclosure appears despite more fundraising
    - Commercial quality remains too narrative-driven
    - Keep recommendation at research-more.
  notes: The kill triggers are chosen to be monitorable and valuation-linked. Each one attacks either the proxy revenue bridge or the entry-price discipline.
