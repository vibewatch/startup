- id: public-benchmarks-and-comparable-band
  title: Public comparables give only a directional band, not a direct mark for Shihang
  body: 'The right public benchmark is not a single direct peer but a range of marine-tech, instrumentation, autonomy, and subsea names with enough public disclosure to show what buyers currently pay for proof. The comp set here intentionally mixes categories. Teledyne is far broader and more mature than Shihang, but it provides a high-quality listed benchmark for industrial instrumentation and marine-adjacent electronics with 2025 net sales of USD 6.1 billion and a June 2026 market cap of USD 28.4 billion, or roughly 4.6x sales. Kongsberg is even broader, with defence and maritime systems depth that Shihang does not yet have, but the March 2026 annual-report notice and June market-data page imply about 4.4x on 2025 revenue. Fugro sits near the opposite end: the market-data page shows about 0.6x revenue, and the annual report explicitly describes 2025 as challenging because offshore-wind site-characterization slowed. Kraken gives a useful growth benchmark, but the available public pages
    are currency-misaligned, so it is better used as a directional reminder that high-growth subsea names can command much richer valuations when revenue, EBITDA, and order books are disclosed. For Shihang, that leaves a practical public band of roughly 0.6x to 4.6x market cap to revenue, with the important warning that every name in the set is more diversified, more disclosed, or both.'
