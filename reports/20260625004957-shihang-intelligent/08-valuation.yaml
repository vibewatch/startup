    - Company-quality signals are stronger than price-support evidence because the June 2026 round size is public but the post-money and preferences are not.
    - Stay engaged, but do not commit to price without private diligence.
  - - Confidence
    - Medium
    - Funding, order, and trial-selection evidence is well corroborated, but key underwriting numbers remain private.
    - Treat public evidence as screening-quality, not IC-ready.
  - - Risk rating
    - High
    - Value creation still depends on regulatory clearance, operational conversion, and disclosure upgrades rather than on one closed round.
    - Use milestone-based diligence rather than narrative averaging.
  - - Valuation stance
    - Unknown
    - No public source in this run disclosed the actual post-money valuation or investor rights package.
    - Do not infer attractiveness from financing size alone.
  - - Decision implication
    - Only pursue on disciplined access terms
    - The hidden terms could still make a strong company a weak investment.
    - Require cap table, preferences, and audited operating bridge before proceeding.
  notes: This table distinguishes company quality from investable price. “Unknown” valuation stance reflects a missing public mark, not analytical indecision.
