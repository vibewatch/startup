chapter:
  number: 8
  title: Valuation
  summary: Shihang Intelligent has enough public evidence to support interest but not enough to support a price call. Financing size, order momentum, and Singapore trial relevance are all real, yet public sources still do not disclose the latest post-money valuation, investor-rights stack, or a revenue-and-margin bridge, so the disciplined verdict is research-more with high risk and an unknown valuation stance.
sections:
- id: financing-context-and-price-opacity
  title: Financing momentum is real, but the price is still public-data opaque
  body: 'Shihang’s valuation debate starts from an unusual mismatch: the company has unusually strong public financing and order headlines for a private marine-robotics name, yet public evidence still does not disclose the actual price investors paid. The official June 2026 announcement and multiple corroborating outlets agree that the company completed an A round of more than RMB 1 billion and that this was the largest disclosed single round yet reported in marine robotics. Several sources also agree that H1 2026 order intake exceeded RMB 1 billion. Those two facts matter because they show real capital access and real commercial interest, not a lab-only story. But they do not answer the underwriting question that matters most in a valuation chapter: what post-money, price per share, liquidation preference, or governance package came with the round. The closest hard filing evidence in this run is not a Shihang cap-table filing but Dayang Motor’s disclosure around the Jiaxing Shanghe Hualong
    fund vehicle, which proves industrial capital participation while simultaneously warning about registration, execution, liquidity, and return uncertainty. That means Shihang’s latest financing is easier to confirm than to price. Public evidence supports the conclusion that strong investors wanted access, but it does not support the stronger conclusion that outside investors today know whether the round was cheap, fair, or aggressive.'
