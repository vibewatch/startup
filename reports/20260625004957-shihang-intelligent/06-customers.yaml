    {
      "id": "adoption-trajectory-and-proof",
      "title": "Adoption trajectory and named customer proof",
      "body": "There is enough public evidence to conclude that Shihang is past pure-demo stage, but not enough to conclude that its customer base is already broad and durable. Independent June 2026 coverage from Tencent, 10jqka, Securities Daily, HTX, and Gasgoo all repeat the same demand marker: H1 2026 orders exceeded RMB1 billion. That is the chapter's best adoption metric because it is current, repeated across multiple outlets, and directionally consistent with the company's rapid financing and commercialization narrative. Named customer proof is narrower but real. Founder-profile material cites a Fujian Shipping Group field test in which the Orca robot cleaned a heavily fouled freighter in about 10 hours versus roughly two weeks manually, with roughly 50x labor efficiency. Baidu's Chinese and English entries add application claims at Qingdao Port and Yantai Port. The award-notice corpus and related company article also show that a Shihang-led underwater cleaning project was submitted with Waterborne Transport Research Institute, China Merchants Shipping, COSCO Bulk, Shandong Port Technology, Fujian Shipping, Guoneng (Tianjin) Port Services, Huayang Maritime, and Harbin Engineering University. That is strong named ecosystem proof, but it is not identical to a disclosed recurring-customer roster. The public file therefore supports real deployment and named maritime relationships, while still leaving contract scope, recurrence, and per-customer spend opaque.",
