  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Shihang Intelligent has real public customer proof in maritime maintenance, but the proof is uneven. The strongest evidence is named hull-cleaning usage around Fujian Shipping, Qingdao Port, Yantai Port, and a consortium linked to China Merchants Shipping, COSCO Bulk, and other maritime operators; the strongest scaling signal is more than RMB1 billion of reported H1 2026 orders. The weak point is durability: there is no public NRR, renewal, contract-length, or concentration disclosure, and Singapore MPA is still a trial gate rather than booked international production revenue."
  },
  "sections": [
    {
      "id": "customer-segmentation",
      "title": "Customer segments and buyer roles",
      "body": "Shihang's public customer file is clearest when read by job-to-be-done rather than by logo count. The most mature and best-evidenced segment is ship-hull cleaning, where the economic beneficiary is the shipowner or fleet operator that wants lower drag, less fuel burn, and less dry-dock downtime, while ports and port-service operators matter as access, scheduling, compliance, and operating-environment gatekeepers. Official ship-cleaning pages and product pages repeatedly frame the value proposition in owner economics terms: clean while berthed, avoid chemical methods, reduce drag, and lower operating cost. A second segment consists of offshore-asset operators in wind and photovoltaic infrastructure, where the buyer is closer to an energy asset owner or maintenance contractor buying inspection, diagnosis, and subsea O&M capability rather than pure cleaning. A third segment is public-waterway, environmental, and security operators using surface or mixed robotic systems, but those customer categories are visible mainly in solution marketing rather than in named paying-account proof. This segmentation matters because it shows Shihang is not selling a single robot to a homogeneous buyer base; it is selling project-style outcomes into maritime, offshore-energy, and public-water domains with different procurement paths and risk screens.",
