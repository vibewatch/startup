    {
      "id": "durability-and-retention-visibility",
      "title": "Durability, repeat use, and satisfaction visibility",
      "body": "Durability is where the public customer file thins out materially. No reviewed source discloses NRR, GRR, churn, contract length, renewal cadence, top-customer repeat rates, or even a clean split between first deployments and follow-on jobs. The closest positive durability proxies are company and media references to million-hour commercial operation data, scale deployment across multiple maritime scenes, and third-party claims that the Orca platform has already serviced more than a thousand large vessels for major shipping companies. Those are useful signals that the system is doing repeat work in the field, but they are still not equivalent to customer-level retention disclosure. Public satisfaction data is even weaker. The available corpus does not publish NPS, CSAT, complaint-close time, or warranty-incident rates. That means the investor can say Shihang has real deployment proof, but cannot yet say whether customers repurchase on predictable cycles, expand from cleaning into inspection, or sustain healthy renewal economics. In this chapter, the correct posture is to preserve the positive adoption read while explicitly marking retention and satisfaction as open diligence items rather than filling them with invented metrics.",
