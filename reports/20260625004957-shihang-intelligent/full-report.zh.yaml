        - 世航当前最好的楔入市场，因为新加坡 MPA 试点和公开清洗机器人来源都指向这里
      - - 港口一体化实况清洗和检查
        - 港内或锚地作业，必须满足本地安全和环境规则
        - 任何只需要干船坞、或忽视废弃物回收要求的流程
        - 通常由船东 / 运营方付款；港口、船级社和服务运营商共同塑造审批
        - 相关性高，因为公开试点显示，采用取决于实港验证，而不只是硬件能力
      - - 广义船舶清洗服务
        - 船体清洗、螺旋桨和狭小区域清洗、舱罐或辅助清洗，以及专业维护服务
        - 更广的船舶维修 capex 或造船 backlog
        - 船东 / 运营方或承包商预算
        - 可用于 TAM 背景，但范围宽于机器人设备或机器人服务细分
      - - 船体清洗和维修
        - 清洗加相关维修流程和维护活动
        - 非船体海事服务和广义水下机器人
        - 船东 / 运营方或船厂 / MRO 预算
        - 显示如果不加辨析，纳入维修的页面会高估直接机器人清洗 TAM
      - - 广义水下机器人邻近市场
        - ROV、AUV、gliders，以及横跨勘探、防务、工程和科学的多类海事作业任务
        - 不是直接经常性船体清洗收入池
