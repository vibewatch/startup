      - number: '8.2'
        title: 公开可比公司只能给方向性区间，不能直接标定世航
        blocks:
          - type: paragraph
            body: >-
              合适的公开基准不是单一直接可比公司，而是一组海事科技、仪器、自主化和水下公司；这些公司披露足够多，能显示买家当前愿意为证明付多少钱。这里的可比组有意混合不同类别。Teledyne
              比世航宽得多、成熟得多，但它为工业仪器和海事邻近电子提供了高质量上市基准：2025 年净销售额 USD 6.1 billion，2026 年 6 月市值 USD 28.4 billion，约为销售额
              4.6x。Kongsberg 更宽，在防务和海事系统上有世航尚不具备的深度；但 2026 年 3 月年报通知和 6 月市场数据页面暗示，其 2025 年收入倍数约为 4.4x。Fugro
              则接近另一端：市场数据页面显示约 0.6x 收入，年报也明确称 2025 年充满挑战，因为海上风电场址表征放缓。Kraken
              给了有用的增长基准，但可得公开页面存在币种错配，所以更适合作为方向性提醒：当收入、EBITDA 和订单簿披露充分时，高增长水下公司可以拿到丰富得多的估值。对世航而言，实用公开区间大约是 0.6x 到 4.6x
              市值 / 收入，但必须强调：组内每家公司都更多元、披露更多，或两者兼具。
