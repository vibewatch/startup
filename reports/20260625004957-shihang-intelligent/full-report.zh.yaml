        title: 耐久性、重复使用与满意度可见度
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开客户档案明显变薄的地方。没有已审阅来源披露
              NRR、GRR、流失率、合同期限、续约节奏、头部客户复购率，甚至没有干净拆分首单部署和后续任务。最接近正面的耐久性代理指标，是公司和媒体提到百万小时商业运营数据、多海事场景规模化部署，以及第三方称 Orca
              平台已为大型航运公司服务超过 1,000 艘大型船舶。这些信号有用，说明系统正在现场重复作业，但仍不等同于客户级留存披露。公开满意度数据更弱。现有语料没有发布
              NPS、CSAT、投诉关闭时间或质保事故率。这意味着投资人可以说世航智能有真实部署证明，但还不能说客户是否按可预测周期复购、是否从清洗扩展到检测，或是否维持健康续约经济性。本章应保留正面采用读法，同时明确把留存和满意度列为未决尽调事项，而不是用编造指标填空。
