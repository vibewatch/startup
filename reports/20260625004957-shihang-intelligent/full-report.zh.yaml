  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Shihang 的增长路径穿过监管方、港口、生态客户、资本提供方，以及重人力投入的交付引擎。
    approximationNotes: 依赖项按商业化卡点归组，不穷尽每个供应商或客户关系。
    data:
      nodes:
        - id: mpa
          label: 港口监管方
          detail: MPA 和其他主管机构掌握运营批准关口。
        - id: class
          label: 船级 / 服务生态
          detail: 船级社和服务运营商验证工作流。
        - id: shipowners
          label: 船东 / 运营商
          detail: 合同要放大，需要 ROI 和安全执行。
        - id: capital
          label: 资本提供方
          detail: 为 R&D、全球扩张和产能出资。
        - id: talent
          label: 交付人才
          detail: 售前、项目、硬件和现场团队把需求转成服务。
        - id: shihang
          label: Shihang 平台
          detail: 海洋机器人加数据 / 自主工作流。
        - id: customers
          label: 商业结果
          detail: 收入耐久性取决于转化、支持和信任。
      edges:
        - from: mpa
          to: shihang
          label: 准入
        - from: class
          to: shihang
          label: 验证
        - from: shipowners
          to: customers
          label: 采购
        - from: shihang
          to: shipowners
          label: 服务
        - from: capital
          to: shihang
          label: 出资
        - from: talent
          to: shihang
          label: 实施
        - from: shihang
          to: customers
          label: 转化
    claimRefs:
      - CR001
      - CR013
      - CR021
      - CR022
      - CR023
      - CR025
      - CR027
      - CR041
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐从强需求证据出发，穿过未解决的价格和转化缺口，最终落到继续研究。
    data:
      nodes:
        - id: n1
          label: 需求证据
          value: A round > RMB1bn; H1 orders > RMB1bn
        - id: n2
          label: 外部证据
          value: MPA selected SEAHI for 18-month trial
        - id: n3
          label: 估值证据缺口
          value: No public post-money, price per share, or preferences
        - id: n4
          label: 经济性缺口
          value: No public revenue / margin / cash bridge
        - id: n5
          label: 决策
          value: Research more, not buy
      edges:
        - from: n1
          to: n5
          label: 支撑兴趣
        - from: n2
          to: n5
          label: 支撑战略相关性
        - from: n3
          to: n5
          label: 阻断估值立场
        - from: n4
          to: n5
          label: 阻断确信度
    approximationNotes: 该图是逻辑图而非数值图；它把本章因果链压缩为最少决策节点。
    claimRefs:
      - CV001
      - CV006
      - CV010
      - CV011
      - CV032
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 代理价值受收入转化和披露质量的影响，远大于单纯的融资规模标题。
    data:
      items:
        - label: 悲观收入代理
          value: 0.5
        - label: 基准收入代理
          value: 0.85
        - label: 乐观收入代理
          value: 1.35
        - label: 公开可比区间中点
          value: 2.6
    approximationNotes: 数值是示意性情景驱动项：收入项为人民币十亿元，公开可比区间中点为倍数；纳入它是为了展示更大的驱动因素集合，而不是统一单位。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 由于私募轮价格未披露，且转化假设主导模型，示意性估值区间被明显拉宽。
    data:
      items:
        - label: 悲观
          low: 0.5
          high: 0.75
        - label: 基准
          low: 1.4
          high: 3
        - label: 乐观
          low: 4.2
          high: 7.5
    approximationNotes: 所有数值均为人民币十亿元，是代理输出，不是公开估值标记。它们基于 TV003 描述的明确收入转化和倍数假设。
    claimRefs:
      - CV036
      - CV037
      - CV039
      - CV040
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Shihang 在市场相关性上筛选结果较好，但在价格透明度、经济性披露和承销就绪度上偏弱。
    data:
      items:
        - label: 市场匹配度
          value: 8
        - label: 商业验证
          value: 7
        - label: 竞争耐久性
          value: 6
        - label: 经济性披露
          value: 3
        - label: 价格透明度
          value: 1
        - label: 整体 IC 就绪度
          value: 4
    approximationNotes: 评分为定性 0-10 分、按 IC 权重口径给出，依据留存的公开证据，而非管理层提供的评分卡。
    claimRefs:
      - CV009
      - CV010
      - CV030
      - CV032
      - CV041
      - CV042
      - CV044
