  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流定义与产品表面
        blocks:
          - type: paragraph
            body: >-
              世航智能的产品应被理解为海洋工作流平台，而不是单一机器人
              SKU。公司官方页面用运营语言定义客户任务：靠泊期间船体清洗、水下检测、海上风电和光伏诊断、智慧水域监测、深海调查。公开产品页随后把这些任务映射到水下机器人、水面机器人和核心部件组成的产品组合。Tiger
              Whale 被宣传为面向船体和基础设施任务的旗舰全自由度水下作业主力；Tiger Whale Mini 是更轻的水下平台，面向测绘、救援和教学环境；Tiger Shark
              和两个水面机器人页面覆盖高速水面机动、水域监测和模块化任务；SEAHI X 把故事延伸到深海探索；Pangu
              推进器页面显示，公司想掌握关键子系统，而不是只组装进口零件。最强工作流信号是，官方方案页反复把产品描述为探测 - 检测 - 作业 - 数据 -
              服务，而不是简单硬件转售。这支持平台加服务的读法，但公开材料仍不到产品文档深度：已审阅页面提供演示、咨询和报价路径，而不是 API 手册、配置矩阵或买方可直接使用的集成文档。买方仍需要私下技术尽调。
