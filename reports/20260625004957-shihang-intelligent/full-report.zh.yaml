              公开 GTM
              图景偏企业级，且执行强度高。招聘披露指向方案经理、售前技术支持、投标准备、客户拜访和大客户销售，地点覆盖北京、苏州昆山和天津；这符合面向船东、工业运营商和政府相邻买方的咨询式销售动作。周期会比现货机器人销售更长，尤其同一招聘页还提到业主侧项目立项和投标准备。成本端，公司显然不是轻资产软件模式：公开招聘覆盖硬件、嵌入式软件、导航算法、装配、采购和现场销售。这意味着公司要同时投入研发、制造或装配、采购和服务部署。少数公开单位经济正面信号只是方向性而非完整证据：公司宣称部件寿命
