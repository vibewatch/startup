      - number: '2.2'
        title: 规模测算视角与相互冲突的估计
        blocks:
          - type: paragraph
            body: >-
              公开市场规模只有在每个数字都绑定范围时才可用。本轮最窄的中国细分数字是 Sohu 对 2023 年水下清洗机器人市场 RMB 0.96 billion 的估计，以及 2030 年 RMB 3.18 billion
              的预测。更宽的全球服务页面把 2024 年船舶清洗服务市场定为 USD 2.20 billion，把 2024 年船体清洗加维修定为 USD 2.211
              billion，池子明显更大，因为它们纳入了人工服务、维修活动和更广的船舶维护工作流，而不只是机器人设备。UNCTAD 又提供一个非收入视角：可服务资产基础从 116,000 艘全球商船和 2.5 billion
              dwt 运力开始。这组混合证据足以证明市场真实且会反复发生，但不足以仅凭公开数据捍卫一个干净的 2026 SAM 或世航智能专属
              SOM。因此正确读法是多视角：收入估计看范围，船队统计看装机基础，港口吞吐数据看密度和紧迫性。
