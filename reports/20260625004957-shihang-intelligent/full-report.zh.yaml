  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与买方角色
        blocks:
          - type: paragraph
            body: >-
              世航智能的公开客户档案按 job-to-be-done 读取最清楚，而不是按 logo
              数量。最成熟、证据最充分的细分是船体清洗，经济受益方是希望降低阻力、油耗和进坞停运时间的船东或船队运营商；港口和港口服务运营商则是准入、排期、合规和作业环境的守门人。官方船舶清洗页和产品页反复用船东经济性来包装价值主张：靠泊时清洗、避免化学方法、降低阻力、降低运营成本。第二类是风电和光伏基础设施等海上资产运营商，买方更接近能源资产所有者或维护承包商，购买的是检测、诊断和水下
              O&M
              能力，而不是纯清洗。第三类是使用水面或混合机器人系统的公共水域、环境和安防运营方，但这些客户类别主要出现在方案营销里，缺少具名付费账户证明。这种细分很重要，因为它说明世航智能不是把单一机器人卖给同质买方群体，而是把项目式结果卖进海事、海上能源和公共水域，不同领域采购路径和风险审查都不同。
