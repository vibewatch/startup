  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资势头真实，但定价在公开数据里仍不透明
        blocks:
          - type: paragraph
            body: >-
              世航的估值争论，起点是一个少见错配：作为一家私有海洋机器人公司，它有很强的公开融资和订单标题，但公开证据仍未披露投资人实际支付的价格。2026 年 6 月官方公告和多家相互印证的媒体一致认为，公司完成超过 RMB
              1 billion 的 A 轮融资，且这是海洋机器人领域迄今披露的最大单轮融资。多个来源也一致认为，2026 年上半年订单额超过 RMB 1
              billion。这两个事实重要，因为它们说明公司拿得到真实资本，也有真实商业兴趣，不是只停在实验室的故事。但它们没有回答估值章节最关键的承销问题：这一轮对应怎样的投后估值、每股价格、清算优先权或治理安排。本轮最接近硬证据的文件，不是世航股权结构备案，而是大洋电机围绕嘉兴上河化龙基金载体的披露；该文件证明了产业资本参与，同时提示登记、执行、流动性和收益不确定性。因此，世航最新融资更容易确认，难以定价。公开证据支持强投资人想要入场这一结论，但不支持更强的结论：今天外部投资人已知道这一轮便宜、公允还是激进。
