      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比泛泛的「海事行业」说法更偏运营。船东和运营商是天然经济买方，因为生物附着直接影响油耗、船期、排放合规和进坞决策。技术管理、检测和运营团队是直接用户。与此同时，港口、服务运营商、船级社伙伴和监管方会阻断或放行部署，因为在运营港口清洗必须满足安全和废弃物捕获规则。MPA
              的 Singapore 项目把这一点说得很清楚：技术提供商、服务运营商、船级社和船东都在验证闭环里。Jotun、HullWiper 和 ECOsubsea
              的公开工作流页面指向同一条采用路径——先在船舶性能中识别痛点，在获准地点做低扰动试点，评估环境捕获和涂层完整性，之后才可能形成经常性运营合同。这意味着付款方通常是船东或运营商，但销售周期往往要穿过多方许可流程，而不是一步设备采购。
