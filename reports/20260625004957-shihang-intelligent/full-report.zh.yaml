  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发项
    rows:
      - - 熊市
        - H1 订单没有按时转化；新加坡试点延后或结果不佳；投资人发现私有轮条款激进。
        - 假设确认收入约 RMB 0.5 billion，收入代理倍数约 1.0x-1.5x，对应示意价值约 RMB 0.5-0.75 billion。
        - 如果未来 12 个月试点里程碑或订单转化仍只停留在叙事，这一情景最可能。
        - 未披露收入桥接，或出现隐藏高优先级清算优先权栈的证据。
      - - 基准
        - 年化订单节奏保持，但 12-18 个月内只有 35%-50% 转化为确认收入；监管证明改善，但没有完全放行。
        - 假设确认收入约 RMB 0.7-1.0 billion，收入代理倍数约 2.0x-3.0x，对应示意价值约 RMB 1.4-3.0 billion。
        - 如果商业化真实，但仍偏服务重，且仍需要尽调，这一情景最可能。
        - 订单转化、毛利率或试点结果出现重大滑坡。
      - - 牛市
        - 订单转化很快，复购部署扩大，新加坡或类似项目产出公开运营证明。
        - 假设确认收入约 RMB 1.2-1.5 billion，收入代理倍数约 3.5x-5.0x，对应示意价值约 RMB 4.2-7.5 billion。
        - 只有披露质量追上动能，且高质量可比公司逻辑变得可信时，这一情景才站得住。
        - 在经审计证明出现前，只要价格已嵌入该情景，就是风险信号。
    notes: 这些是示意性代理区间，来自明确收入转化假设和公开可比公司倍数区间；不是 Shihang 已被发现的市场标记。
