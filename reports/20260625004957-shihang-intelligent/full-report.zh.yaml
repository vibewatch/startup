        - 当前至中期
        - 有助于人才、采购开放度，以及产业界接受具身海洋服务自动化
        - 区分一般政策支持和产品自身的商业拉力
      - - Singapore MPA 在繁忙港口的验证
        - 增长驱动
        - 2026-2027
        - 如果试验转化，可提供高信号的商业化和标杆客户路径
        - 要求提供试验 KPI、船东名称和后续商业条款
      - - 港口对水下清洗的限制
        - 约束
        - 当前
