      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导力叙事高度围绕创始人展开。官方创始人报道以及官方 / 媒体融资稿均把陈晓博列为创始人、董事长兼 CEO，并称其出生于 1989 年，毕业于哈尔滨工程大学，创立公司前在海洋机器人领域约有 19
              年经历。已审阅材料把公司的技术身份，以及很大一部分融资和公共露出活动都归于陈晓博，包括标准工作、奖项能见度和面向投资人的故事讲述。


              这种集中度很重要，因为已审阅的官方 / 当前公开来源没有给出完整具名董事会或高管梯队。陈晓博之外，最清晰的公开治理信号是一则仍在发布的苏州 / 北京 CFO 招聘，要求从 0 到 1
              搭建财务体系、拓展融资渠道、规划资本市场，并具备 IPO
              运营经验。同一招聘页还把岗位归入高管类别，覆盖多个城市，说明组织在扩张，也暗示财务和治理基础设施仍在搭建。公司给出现行组织架构、董事名单和具名职能高管之前，对陈晓博的关键人依赖应视为重大事项。
