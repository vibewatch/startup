        - 要求客户案例提供清洗前后的燃油、航速损失和排放数据
      - - 中国海洋经济与造船规模
        - 增长驱动
        - 当前
        - 存量基数大且仍在增长，即便公开的小众 TAM 数据较弱，也能支撑国内需求假设
        - 将目标船型和港口走廊映射到公司的实际产品成熟度
      - - 中国 AI+、机器人与标准政策顺风
