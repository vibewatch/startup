chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局与产品范围
        blocks:
          - type: paragraph
            body: >-
              世航智能的法律实体是苏州世航智能科技有限公司；2026 年 2 月一份 cninfo 文件称，该实体成立于
              2023-05-26，是嘉兴上合华隆基金的唯一投资标的。在当前官方材料中，公司把自己定位为海洋通用机器人和智能无人装备的研发、制造、销售与服务运营商。船舶清洗是最清晰的商业切入口，但公司也把定位扩到海上风电、海洋太阳能、海洋牧场、工程检测、资源勘探和科研任务。当前公开披露的产品栈包括
              Orca 水下机器人系列、Ocean X 深海机器人、Tigershark 水面机器人，以及 Pangu 推进器 / 核心部件。


              官方联系材料显示，主要运营基地在苏州昆山，同时列出北京、天津、香港和 Singapore 节点。官网和产品页反复宣传 0-10000 米全水域作业覆盖，把近岸服务和深海探索放在同一套叙事里。官方 2026 年 6
              月融资报道和 TechDaily 都补充称，平台建立在 6 个自研核心系统上：推进、控制、感知、导航、密封、布放 / 回收。这些说法证明公司有广泛技术野心和多场景包装，但已审阅公开来源仍未披露当前员工数或收入 /
              run-rate，因此商业规模只能从订单、融资和部署信号推断，而不能靠经审计经营指标确认。
