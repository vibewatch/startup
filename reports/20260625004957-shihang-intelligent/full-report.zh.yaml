      - number: '1.4'
        title: 里程碑、外部验证与未决风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，公司 2026 年最强的公开信号是标准、奖项、国际试点准入和订单动能。官方和媒体来源称，世航智能在 2026 年 1
              月参与发布了中国首个水下清洗机器人作业标准。公司官方材料和中国航海学会通知随后显示，世航智能牵头项目获得 2025
              年中国航海学会科学技术进步一等奖；学会通知列出一个多方联合体，成员包括交通运输部、航运、港口、海事服务和哈尔滨工程大学参与方。2026 年 4 月，公司公开发布 CEORION 海洋具身大模型，同时被
              Singapore Maritime and Port Authority 选为 6 家合作伙伴之一，参与 2026 年下半年开始的船体检测和清洗试点。到 2026 年 6 月，多方来源称上半年订单超过 RMB1
              billion，公司也完成超 RMB1 billion 融资轮。


              剩余公开风险更多在披露质量和执行可见度，而不是已知法律麻烦。本轮指定的官方关于页 URL 返回
              page-not-found，削弱了基础身份端点上的直接官方验证。公开来源对董事会构成、具名非创始人高管、员工数、收入和估值也仍然单薄。换句话说，世航智能的公开档案在愿景、技术验证和资本支持上很强，但在机构尽调通常需要的运营和治理细节上仍薄，不能直接照收管理层说法。
