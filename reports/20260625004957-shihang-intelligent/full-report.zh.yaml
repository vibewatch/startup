      - number: '3.2'
        title: 相邻平台、便携 ROV 与既有替代者
        blocks:
          - type: paragraph
            body: >-
              离开精准船体清洗同业集合后，竞争格局分成 3 类重要玩家。第一类是规模化海事自主平台，如 OceanAlpha 和
              Saildrone；相比世航智能当前公开档案，它们在船队规模、伙伴准入或地理覆盖上有更强公开证明。OceanAlpha 称其成立于 2010 年，已在 55+ 个国家交付超过 4,000 台 USV
              和水上救援机器人，并借 Seawork 2026 宣传海上检测和更广的商业海事方案。Saildrone 离泊位船体清洗更远，但可作为自主能力基准：其平台叙事聚焦持续海事态势感知，Spectre 项目又叠加
              Fincantieri 制造支持和高端国防 / 自主叙事。第二类是 QYSEA、Blueye、CHASING 等便携式、运营方自有 ROV 厂商，用低摩擦硬件、配件和更容易部署的方式切入工作流中的检测 /
              记录部分。第三类是 Teledyne SeaBotix、Fugro、Ocean Infinity、SeaTrac 等既有厂商和服务集成商，因为买方可能通过装机基础供应商、数据 /
              服务承包商或相邻自主平台解决底层任务，而不是标准化采用世航智能本身。
