      - number: '1.3'
        title: 融资历史与利益相关方
        blocks:
          - type: paragraph
            body: >-
              公开融资证据显示速度异常快，但轮次标签并不完全一致。Pedaily 2025 年 5 月报道，世航智能完成 Angel+ 和 Pre-A 轮，合计 RMB50 million。公司 2026 年 1
              月官方推文随后称，世航智能完成多轮数亿元人民币融资，其中 A 轮由 Vertex Ventures 领投，Pre-A+ 轮由璟略创投投资。到 2026 年 3 月，公司官方推文和 China.com
              报道又把春季融资重新表述为 A+ 和 A++ 轮，金额为数亿元人民币，投资方包括华映管理的国家中小企业发展基金、大树长青、新鼎资本、36Kr 基金和老股东。最后，2026 年 6
              月官方披露和大量媒体转载称，公司完成超 RMB1 billion A 轮，具名投资方包括上合组织基金、Vertex Growth、中信农业产业基金、玉尊资本和上市公司大洋电机。


              稳妥的公开解读是：世航智能已经吸引到密集且高信念的投资人联盟；即便不计入 2026 年春季融资的准确金额，已披露资本也至少高于 RMB1.05
              billion。公开来源没有解决的是准确累计金额、单一无歧义的轮次分类，或任何投后估值。大洋电机公告仍有价值，因为它显示一家上市公司 LP 向一只专为投资世航智能而设立的载体出资 RMB30
              million；这比普通媒体提及更能支撑尽调。由于完整股权结构、所有权和治理权数据仍未公开，本章把投资人质量视为可见，但把投资人控制权经济条款视为未验证。
