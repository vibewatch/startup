companyProfile:
  summary: >-
    Shihang Intelligent（世航智能 / 苏州世航智能科技有限公司），对外品牌为 SEAHI Robotics，是一家位于昆山的中国海洋具身机器人公司，成立于 2023-05-26，公开由创始人、董事长兼 CEO
    陈晓博领导。公开材料显示，公司搭建了多产品平台，覆盖 Orca 水下机器人、Ocean X 深海机器人、Tigershark 水面机器人和 Pangu
    核心部件；船体清洗是最清晰的商业切入口，同时宣称向海上风电、海上光伏、海洋牧场、水下检测和科研任务扩张。公开融资披露显示，对一家 2023 年成立的公司而言，世航智能拿钱能力异常强，最终在 2026 年 6 月完成超 RMB1
    billion A 轮；第三方报道还提到 2026 年上半年订单超 RMB1 billion、入选 Singapore MPA 试点，以及国家标准 /
    奖项认可。公开来源仍未披露投后估值、累计融资准确金额、确认收入、毛利率、现金、员工数，或完整的现任高管和董事名单。
