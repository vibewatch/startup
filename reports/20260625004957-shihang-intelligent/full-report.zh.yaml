  - id: TR005
    title: 缓释和否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 新加坡和海外港口准入风险
        - 试点转商业的转化证据
        - 18 个月新加坡项目结束后，没有公布安全 / 成本 / 环境证明，或没有后续运营审批
        - 下调全球扩张假设，把国际旗舰验证视为延后，而不是临近
      - - 环境 / 法律合规风险
        - 污染、碎屑捕集、涂层损伤或审批暂停事件
        - 任何与带水作业相关的公开事故、许可暂停或重大不利检查
        - 立即触发下行情景；重看责任准备金、港口准入假设和客户扩张意愿
      - - 订单到收入转化风险
        - 从订单到收入 / 毛利率 / 现金的公开桥接
        - 未来披露仍停留在订单和融资，没有确认收入、毛利率、现金或营运资本转化
        - 在经济转化被证明前，折减融资动能，并压住估值
      - - 带宽和交付模式风险
        - 招聘和支持能力证明
        - 公开招聘仍处高位，而服务覆盖、部署积压和现场支持证据继续不透明
        - 假设推出速度更慢、支持负担更高；不要承销激进利用率曲线
      - - 可靠性 / 质量证明缺口
        - 现场 KPI 披露
        - 下一次重大融资或试点里程碑后，仍没有公开正常运行时间、MTBF、事故率、涂层兼容性或备件数据
        - 因为仿真和公司引用数据仍不够，继续维持高运营风险溢价
      - - 数据治理和海外合规风险
        - 隐私 / 传输架构披露
        - 有意义的海外数据服务部署开始，但没有公布隐私规则、传输机制或事件流程
        - 折减软件 / 自动化倍数，扩张承销前要求正式合规尽调
    notes: 触发项按可观察性筛选：每一项都能通过公开监管通知、港口更新、融资材料、产品页面或客户 / 合作伙伴披露跟踪。
