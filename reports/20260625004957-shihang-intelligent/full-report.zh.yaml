  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接同业与同一任务替代方案
        blocks:
          - type: paragraph
            body: >-
              最直接的公开竞争框架不是泛泛的「海洋机器人」篮子，而是具体的水中船体检测和清洗工作流。世航智能当前官方页面自己宣传的海洋服务覆盖包括船舶清洗、水下检测、管线探测、船体检测、水下施工和应急救援，因此公司明显不只盯着单一检测
              SKU。但 Singapore MPA 的水中船体检测和清洗项目说明，目标任务要求很高：监管方需要系统能在狭窄泊位条件下工作，覆盖螺旋桨、舵等复杂几何结构，不打断货物作业，并捕获 /
              过滤生物附着废弃物，而不是简单刮掉。MarineLink 对同一项目的报道显示赛道已经拥挤：来自 9 个国家 36 家公司的 19 份方案，最终筛成 6 家入选伙伴，包括 SEAHI
              Robotics、C-Leanship、Neptune Robotics、Oceanis Robotics、Alicia Bots 和
              RINA。这意味着世航智能已经处在真实直接同业群中，而不是空白品类里。保留公开集合中，HullWiper
              是最清晰的项目外直接替代品，因为它销售免潜水员船体清洗结果，可在装卸货或加油作业期间完成，能降低那些更在意清洁度和在线时间、而不是拥有机器人本身的船东采用阻力。
