      - number: '8.3'
        title: 情景区间只能作为明确代理计算，入场规则必须保持严格
        blocks:
          - type: paragraph
            body: >-
              世航投后估值和已确认收入仍未披露，因此本章任何估值区间都必须作为明确情景逻辑呈现，而不是被发现的市场事实。最干净的代理，从公开反复出现的一项硬商业数字出发：2026 年上半年订单超过 RMB 1
              billion。即便这个信号也要打折，因为项目交付、验收、服务组合和监管门槛都可能推迟收入确认。基准情景因此只假设名义 RMB 2.0 billion 年化订单节奏中的 35% 到 50%，会在未来 12 到
              18 个月转成已确认收入，对应约 RMB 0.7-1.0 billion 的代理收入区间。套用折价后的 2.0x-3.0x 公开可比区间，可得到约 RMB 1.4-3.0 billion
              的示意性基准估值区间。熊市情景假设监管滑坡、转化更慢、倍数压缩至约 1.0x-1.5x，价值会低得多。牛市情景则需要更快收入转化、重复部署和可见的监管去风险，3.5x-5.0x
              区间才站得住。这也是为什么入场纪律比叙事热度更重要。如果管理层不能打开股权结构、优先权堆栈、收入桥和新加坡里程碑评分卡，新投资人就不应只锚定 6 月融资标题。
