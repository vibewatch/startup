      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强驱动不是抽象的机器人热情，而是航运经济和监管。IMO、TEST Biofouling、GreenVoyage2050 和 IMarEST
              都把船体污损与阻力、油耗、排放和入侵物种风险联系起来。GreenVoyage2050 给出的 USD 5,000–50,000 清洗成本区间和 1–5% 燃油降低区间构成基础情形；IMarEST 和 arXiv
              论文显示，当污损严重或清洗经过优化时，上行空间可能大得多，也更持久。中国政策是次级顺风，因为它持续把机器人、「AI+」和工业标准放在议程上；中国 2024–2026
              年海洋经济和造船数据也显示装机基础庞大且仍在增长。最大约束是监管接受度、证据质量和转化风险：许多港口仍限制水中清洗，Norway 正在走向更严格的捕获逻辑，公开细分 TAM
              页面的方法论仍弱。对估值而言，这意味着市场吸引力比近期收入捕获更容易证明。缺失的桥梁不是问题是否存在，而是世航智能能否足够快地把试点转化为可重复、合规的合同，从而拿到可信 SOM。
