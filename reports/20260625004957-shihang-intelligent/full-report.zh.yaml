      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              整体财务读法是需求端建设性，但离承销仍不完整。世航智能的公开档案支持一个可信的收入线故事：真实客户部署、大额报道订单、正在扩宽的垂直机会地图，以及异常强的战略资本准入。如果自研部件、更高耐久性和更快产品迭代在现场经济性上确如公司和媒体来源暗示，它也支持一个合理的未来毛利故事。问题在于，当前公开表面仍远达不到投资人判断收入质量或
              runway 所需的信息量。没有公开确认收入、没有分部结构、没有毛利率、没有烧钱、没有现金余额、没有营运资本细节，也没有披露真实成交价格。国际验证有意义，但 MPA
              项目也显示，公司仍在真实港口条件下接受成本效益和运营合规测试。因此本章结论是：融资动能强于披露质量。世航智能看起来商业上已经动起来，但在订单转化、毛利和现金指标打开之前，仍依赖融资，也需要重度尽调。
