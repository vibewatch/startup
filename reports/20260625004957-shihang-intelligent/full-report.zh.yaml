  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻市场
        blocks:
          - type: paragraph
            body: >-
              第一个分析任务是守住边界。本轮公开来源至少描述了 4
              个同心市场：中国海洋经济总量、更宽的水下机器人行业、广义船舶清洗或船体维修服务，以及窄得多的机器人水中船体检测和清洗细分市场。对世航智能而言，近期最干净的市场边界是最后一类，因为最清晰的公开商业化信号是
              Singapore MPA 的水中船体检测和清洗试点；与此同时，中国公开细分摘要也单独讨论水下清洗机器人。如果把整个水下机器人经济或全部海洋 GDP 都当作直接
              TAM，会高估市场，因为更大的池子还包括深海探索、国防、海上能源、生物和非经常性海洋项目。这些相邻市场仍重要，因为它们说明政策支持、工程人才流动和未来扩张可选项，但它们应位于近期采用和估值工作的可投资楔子之上，而不是被放进楔子内部。
