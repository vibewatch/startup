      - number: '3.4'
        title: 护城河耐久性、锁定与被替代风险
        blocks:
          - type: paragraph
            body: >-
              公开护城河案例真实但偏窄。世航智能可以指向更宽的官方产品范围，也可以指向入选 Singapore MPA
              在港试点项目带来的国际验证。这些信号重要，因为它们表明公司不只是卖概念视频，而是被要求在高要求监管和运营环境中证明性能。但同一批 MPA
              文件也是最强公开警告：监管方称当前机器人清洗方案在复杂船体区域、更强水流、碎屑捕获、过滤和服务规模上仍有困难。如果未来 18
              个月内多家入选同业都越过这些门槛，世航智能的差异化可能快速被压缩。因此耐久性风险不太像「一家通吃」，更像被相邻品类商品化：服务专家可以消除机器人所有权摩擦；便携 ROV
              厂商可以满足较轻检测任务；更大的自主平台或既有供应商可以把该工作流打包进更广的海洋服务关系。现状本身也是现实竞争对手。MPA
              框架仍以潜水员、干坞周期和其他人工或半人工清洗方法为改善基准，因此世航智能不仅要打赢其他机器人，也要打赢买方根深蒂固的习惯和采购模式。
