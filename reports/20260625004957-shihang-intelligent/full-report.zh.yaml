      - number: '8.4'
        title: 建议：继续研究，直到价格支撑追上公司质量信号
        blocks:
          - type: paragraph
            body: >-
              本章建议是继续研究，置信度中等、风险高、估值立场未知。这并不是看空公司本身。公开证据支持一个可信判断：世航有真实市场相关性——它完成了很大一轮融资，似乎有真正订单势能，入选新加坡实港试点项目，并且身处一个明显更具战略意义的市场。但公开证据也以同样力度支持反命题：商业化仍卡在高要求环境下的试点门槛，监管和环境约束正在收紧，竞争替代方案已经提供摩擦更低的选择，公司仍未公开投资人证明私募轮价格所需的数字。仅凭公开数据，这种组合不适合给出买入措辞。正确做法是，只有在尽调能快速补上价格支撑缺口，或准入条款明确补偿这种不透明时，才继续保持接触。实际操作上，如果经审计收入转化、利润率质量和优先权条款可接受，投资排序可以上移；如果隐藏投后估值已经高于牛市代理且没有相应证据，投资应下移或退出。
