      - number: '7.3'
        title: 人才、执行和财务模型风险很高，因为公开需求信号跑在已披露运营基础设施前面
        blocks:
          - type: paragraph
            body: >-
              内部执行要看的，是世航能否比自身业务边界扩张得更快地把交付工业化。公开招聘显示，公司同时在招硬件、软件管理、售前、标书、实施交接、生产、采购和客户运营等岗位。与其说这是标准化机器人 SKU
              生意，不如说更像咨询式、项目密集型部署模式。今天这样切入市场可能合理，但通常比宣传文案暗示的扩张更慢，也更吃营运资金。爱企查公开工商快照只显示 25
              名参保员工；企查查和招聘平台却显示招聘面很宽、岗位很多。由于公开人员快照可能不完整，这个差异只能算一个信号，但相对于公司宣称覆盖的市场和场景宽度，仍然指向带宽风险。财务上，同样的不对称也重要。公开来源反复确认
              2026 年上半年订单超过 RMB1 billion、A 轮融资超过 RMB1 billion，但没有披露已确认收入、毛利率、现金或营运资金转化。大洋电机 /
              上河的公告尤其有用，因为它提示专项投资载体存在流动性、收益不确定性，且不保本。合起来看，世航商业化已经启动，但仍依赖融资，披露也偏轻。
