  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 公开支持
      - 什么会改变判断
    rows:
      - - 正方
        - Shihang 已经走出原型阶段，进入真实市场相关性。
        - '>RMB1 billion A 轮、>RMB1 billion H1 订单和 MPA 入选，都支撑真实商业化信号。'
        - 披露收入桥接和毛利率画像，会把它从“有前景”升级为“可承销”。
      - - 正方
        - 市场背景足够大，能容纳一个有分量的赢家。
        - Chyxx 2025 年市场规模估算显示，水下机器人市场很大，而且仍在扩张。
        - 独立客户 ROI 证据会帮助把 TAM 转成可投资 SAM。
      - - 正方
        - 公司所在赛道具备战略重要性，一旦跑出证据，能获得高溢价关注。
        - 新加坡试点入选和投资人组合显示，机构对该品类有兴趣。
        - 公布试点 KPI 和复购合同，会支撑更高质量倍数。
      - - 反方
        - 融资标题可能跑在支撑价格所需证据前面。
        - 没有公开来源披露投后估值、股价、优先权、经审计收入或现金可支撑期限。
        - 打开 cap table 和经审计报表，可能缩小或消除这一反对意见。
      - - 反方
        - 商业扩张仍被监管和真实港口作业证据卡住。
        - MPA 和 IMO 都强调碎屑捕集、复杂船体几何和环境合规。
        - 完成试点并拿到商业审批，会实质降低模型风险。
      - - 反方
        - 检测密集型买家任务已有摩擦更低的替代方案。
        - QYSEA、Blueye、CHASING、OceanAlpha 和 Saildrone 都展示了相邻或替代买家路径。
        - 若有证据证明 Shihang 靠全流程 ROI 胜出，而不是靠演示质量胜出，护城河会更强。
    notes: 正方和反方有意保持对称。一家公司再强，如果价格支撑和披露跟不上故事，入场仍可能很差。
