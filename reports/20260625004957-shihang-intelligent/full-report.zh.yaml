      - number: '5.2'
        title: 架构、交付模式与公开路线图信号
        blocks:
          - type: paragraph
            body: >-
              对早期机器人公司而言，公开架构叙事异常具体，但证据仍来自公司发布材料和相邻报道，而不是正式技术手册。官方新闻、奖项和创始人材料持续描述一个覆盖动力、控制、感知、导航、密封、布放回收的 6
              子系统栈。同一批来源还描述了「平台 + 大脑 + 模块」的可复用架构：通用具身机器人本体搭配清洗、检测和作业任务模块；2026 年 4 月发布的 CEORION
              则被定位为统一感知、任务理解和动作生成的自主层。不过交付高度服务驱动。招聘页面强调技术交流、投标支持、实施交接、BOM、测试报告、EMC
              工作、防水电路和跨职能项目评审，这是一套现场部署工业系统画像，而不是即插即用开发者平台。公开路线图可见度来自有日期的里程碑，而不是正式发布日历：2024 年自主海洋标准、2025 年深水 Ocean X
              预览、2026 年 1 月水下清洗作业规则、2026 年 3 月奖项认可、2026 年 4 月 CEORION 与 Singapore MPA 试点入选、2026 年 6
              月用于规模化的融资。这足以证明公司在向前走，但不足以承销发布纪律、船队可靠性或制造节奏。
