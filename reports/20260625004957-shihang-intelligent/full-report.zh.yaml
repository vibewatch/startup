      - number: '7.2'
        title: 运营风险来自严苛海洋环境和伙伴把关部署，而不是缺少产品叙事
        blocks:
          - type: paragraph
            body: >-
              从运营看，产品故事可信，但失败模式很硬。公司和第三方材料一致认为，世航智能要在低能见度水域、强水流、腐蚀、高压、弱通信和复杂船舶几何结构中作业。MPA
              自己的表述点出了精准卡点：螺旋桨、舵、海底门、狭窄空间、更强水流，以及不打断港口作业的碎屑收集。这意味着一次运营失误可能同时变成监管、客户和责任事件。公开记录在可靠性上也不均衡。世航智能提到百万小时商业数据、90%+
              仿真成功率和 10,000 小时部件寿命，但这些是公司控制的指标，不是公开在线率、MTBF、事故率或涂层兼容性披露。依赖风险同样真实。跨境落地不是单边产品发货；MPA
              称部署涉及技术提供商、服务运营商、船级社和船东协同。在中国，公开证明最强处集中在国资相关海事生态和船体清洗任务。这是好验证，但也意味着审批、背书和采购仍由伙伴中介。如果一两个旗舰生态停滞，扩张曲线可能很快变平。
