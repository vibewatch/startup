            body: >-
              扩张案例可信，但仍取决于生态和监管执行。官方页面和融资文章显示，公司正在从船体清洗向海上风电、海上 PV、海洋牧场、水下管线和相关检测任务推进第二波；A+ / A++ 文章甚至称海上 PV 作业已中标 CNNC
              项目并进入核电站检测。即便如此，具名公开证明仍集中在海事维护及相邻中国港口或航运关系。国际上，Singapore 有价值，因为它既是标杆市场，也是硬闸门：MPA 选中 SEAHI Robotics 参与 18
              个月水中船体检测和清洗试点，但该项目明确用于在大规模部署前测试成本效益、环境可持续性和安全作业。MPA
              和多家转载行业媒体也列出主要卡点：螺旋桨、舵、海底门、更强水流、狭窄空间、碎屑捕获要求，以及避免打扰繁忙港口作业。IMO
              又增加了更广的结构性约束，警告水中清洗可能释放入侵水生物种和有害废弃物，并正在走向更强制的生物附着框架。含义是，世航智能的扩张不只是技术销售问题，而是服务运营商、船级社、监管方和港口审批问题。上行空间很大，但客户集中度、合同持续性和跨境采购摩擦仍需要私下尽调。
