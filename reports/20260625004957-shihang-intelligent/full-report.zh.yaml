      - number: '3.3'
        title: 切换成本、定价可见度、多供方使用与分销权力
        blocks:
          - type: paragraph
            body: >-
              公开商业图景并不均衡，这会影响采用风险。在保留来源中，QYSEA 是定价透明度的异类：其官方商店披露 V-EVO 标价 $1,399、V6 Expert $2,999、E-GO
              $7,348。相比之下，世航智能已审阅官方页面没有展示清洗服务或机器人套件标价；Blueye、CHASING、OceanAlpha、Saildrone 和 HullWiper
              的已审阅官方页面也是如此。这种不透明会把买方推向可验证案例、试点或渠道信任，而不是简单比价。因此切换成本结构因品类而异。QYSEA、Blueye 和 CHASING 的便携 ROV
              系统更容易多供方并用，因为它们是带配件、运营集成较轻的工具平台。MPA
              式清洗系统黏性更强，因为它们必须嵌入货物作业，满足废弃物捕获和过滤要求，并经常需要运营商承诺和在港演示。分销权力也不对称：OceanAlpha 发布了大规模交付和地域数字；QYSEA
              宣传经销商网络和直营店；CHASING 宣传全球售后；Saildrone 借 Fincantieri 增加伙伴杠杆；Teledyne
              仍支持已停产装机基础。世航智能技术上可能有竞争力，但其公开档案在渠道和服务网络证明上比几家对手更薄。
