          detail: 现场服务、返工和定制负担增加。
        - id: margin
          label: 利润率承压
          detail: 项目经济性转弱。
        - id: financing
          label: 融资依赖
          detail: 增长需要更多外部资本。
        - id: thesis-break
          label: 论点破裂风险
          detail: 海洋机器人基础设施故事不再降险。
      edges:
        - from: approval
          to: slower-deploy
          label: 延误
        - from: incident
          to: trust
          label: 损害
        - from: trust
          to: slower-deploy
          label: 减少
        - from: slower-deploy
          to: support-cost
          label: 拉长
        - from: support-cost
          to: margin
          label: 压缩
        - from: margin
          to: financing
          label: 收紧
        - from: financing
          to: thesis-break
          label: 推高
        - from: approval
          to: thesis-break
          label: 加速
