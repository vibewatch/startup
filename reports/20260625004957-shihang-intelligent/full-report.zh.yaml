        - 投后估值、每股价格、清算优先权、反稀释、董事会权利和投资人旁函
        - 这是判断本轮价格有吸引力还是偏高的最大卡点
        - 向公司索取完整融资材料、投资条款清单和律师摘要。
      - - 2025-2026 财务桥
        - 经审计的 2025 年收入、2026 年 YTD 确认收入、分业务毛利率、在手订单、取消订单和现金跑道
        - 没有这些，订单标题无法转成估值
        - 索取经审计财报和月度经营看板。
      - - 新加坡试点评分卡
        - 里程碑、成功标准、环境 KPI、船舶类别和后续商业化路径
        - 该试点是检验全球部署准备度的最高信号外部证据
        - 索取 MPA 工作计划、运营方反馈和当前里程碑状态。
      - - 客户质量和集中度
        - 头部客户、复购率、队列转化、合同期限和付款条款
        - 估值质量取决于收入韧性，而不只是订单规模
        - 索取客户队列表和匿名合同样本。
      - - 单位经济模型
        - 硬件与服务组合、贡献毛利、现场支持负担和营运资金画像
        - 这些决定高倍数是应得，还是危险
        - 索取产品 / 服务 P&L 和现金转换分析。
      - - 治理和二级出售压力
        - 本轮中任何创始人套现、员工老股转让、托管安排或隐藏治理摩擦
        - 即便运营看起来不错，这些条款也会改变下行风险和退出节奏
        - 索取董事会材料、股东协议摘要和锁定条款。
    notes: 这些尽调要求按其对价格判断的直接影响排序。前两项是阻断项；其余决定在价格清楚后，公司是否配得上溢价。
    claimRefs:
      - CV032
      - CV041
      - CV042
