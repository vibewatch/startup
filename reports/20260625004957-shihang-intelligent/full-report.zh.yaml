  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、商业化与定价不透明
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是硬件加服务的混合商业化模式，而不是清爽的 SaaS
              画像。官方和备案材料把世航智能描述为一家研发、生产、销售并服务海洋机器人、水面机器人和核心部件的企业；官方场景页则宣传把检测、清洗、作业和数据输出合在一起的海洋综合服务工作流。船舶清洗是最清晰的变现楔子，因为它是最具体的客户任务，并明确宣称能减少进坞时间、降低运营成本和降低航行阻力。但同一组保留来源也说明，承销收入质量仍难：已审阅官方页面都没有展示标价，没有保留来源披露真实落地合同价格，围绕
              AI RaaS 的最强变现语言也来自投资人评论，而不是经审计合同条款。因此当前最佳读法是带谈判范围的企业项目销售，而不是透明、可重复的目录定价。
