  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险集中在船体清洗审批、环境合规和数据治理义务上
        blocks:
          - type: paragraph
            body: >-
              最尖锐的外部风险是监管和法律风险，因为世航智能最可见的楔子——机器人水中船体清洗——处在趋严的环境和港口运营框架内，而不是简单设备销售制度下。Singapore MPA 2026 年 4
              月入选是正面信号，但公告明确称，工作仍是 18 个月试点，要在大规模部署前证明安全作业、成本效益、环境可持续性，以及符合全球要求。IMO 2023
              年生物附着页面说得更进一步：水中清洗可能释放入侵物种和有害废弃物，损伤涂层，并且正从自愿指南走向有法律约束力的框架。AFS Convention 也限制进入缔约方港口船舶上的有害防污物质；ISO
              6319:2026 则把清洗作业的规划、文档和报告预期正式化。另一个层面，世航智能越来越多宣传数据服务和自主工作流。这带来第二个法律信号：如果部署处理可识别船员、承包商或港口侧数据，中国 PIPL
              会施加最小化、透明度、敏感数据和跨境传输义务。本轮没有保留公开来源展示专门隐私或安全资料包，因此正确读法不是「不合规」，而是「治理尽调仍然实质性未完」。
