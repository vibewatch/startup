        - 港口侧水下船体检查与清洗
        - 与 Shihang 的任务定义完全相同，也同样拿到实港试验入口
        - 留存公开来源尚未厘清各同业的装机基础、定价或合同经济性
      - - HullWiper
        - 直接服务替代
        - 本次审阅的公开网站未披露规模或价格
        - 购买船体清洗结果的船东和港口
        - 装卸货或加油期间可无潜水员清洗，降低运营中断
        - 留存来源未验证碎屑过滤指标或装机基础规模
      - - OceanAlpha
        - 相邻自主平台
        - 2010 年成立；481+ 名员工；534 项专利；交付 3980+ 台；覆盖 55+ 个国家
        - 测绘、海事安全、救援、海上检查、USV/ROV 作业
        - 公开规模和交付证明显著强于 Shihang
        - 公开定位不是船体清洗专门厂商
      - - QYSEA FIFISH
        - 便携 ROV 替代
        - 200+ 项专利；官方商城和经销商网络；公开价格从 $1,399 到 $7,348
        - 检查、测量、轻量作业
        - 定价透明，部署靠配件驱动
        - 相比港口规模清洗服务，更偏轻负载、由操作者自有的工作流
      - - Blueye
        - 便携检查替代
        - 有客户案例证据并强调支持；留存来源未验证公开价格
        - 检查、记录、船舶损伤核查、水下作业
        - “少专业操作者”信息降低培训摩擦
        - 留存来源更强调检查，而非清洗吞吐
      - - CHASING
        - 便携工业 ROV 替代
        - 覆盖 100+ 个国家；12 款 ROV；300+ 项专利；全球售后网点
        - 工业检查与作业
        - 售后覆盖广，配件生态较完整
        - 已审阅来源未显示港口规模清洗服务模式
      - - Saildrone
        - 相邻自主水面平台
        - 持续型 USV 舰队定位；Spectre 长 52m / 重 250t / 最高 30 knots
        - 海事情报、ISR、ASW、打击、海底感知
        - 借助 Fincantieri 和高关注度防务项目，放大合作伙伴 / 制造杠杆
        - 不是直接船体清洗厂商
      - - Teledyne / SeaBotix
        - 既有装机供应商
        - 已售出 2000+ 台 SeaBotix；2025 年停产后仍继续支持
        - 商业和军用水下检查用户
        - 历史装机基础和支持关系
        - 生产已结束，创新速度可能落后于新平台
      - - Fugro / Ocean Infinity / SeaTrac
        - 服务集成商或相邻自主厂商
        - 已有地理数据、机器人或持续型 USV 基础设施；具体单位经济性因厂商而异
        - 海上测绘、远程作业、数据采集、海事服务
        - 能触达企业买家，任务覆盖也更宽
        - 留存来源未显示直接的泊位侧船体清洗专长
    notes: 各行混合了直接同业、替代方案和相邻玩家，因为买方可以靠专业清洗供应商、便携检查 ROV、企业服务商或更广义的自主平台，解决同一个任务。规模 / 融资单元格在留存公开来源未厘清时标注“未验证”。
