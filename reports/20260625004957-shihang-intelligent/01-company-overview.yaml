- id: milestones-validation-and-open-risks
  title: Milestones, External Validation, and Open Risks
  body: 'Operationally, the company''s strongest public signals in 2026 are standards, awards, international trial access, and order momentum. Official and media sources say Shihang helped issue China''s first underwater cleaning robot operating standard in January 2026. Official company materials and the China Navigation Society notice then show that a Shihang-led project won the 2025 China Navigation Society Science and Technology Progress First Prize, with the society notice naming a multi-party consortium that included Transport Ministry, shipping, port, maritime-service, and Harbin Engineering University participants. In April 2026, the company publicly launched the CEORION marine embodied model and was also selected by Singapore''s Maritime and Port Authority as one of six partners for hull-inspection and cleaning trials beginning in the second half of 2026. By June 2026, multiple sources said first-half orders exceeded RMB1 billion and the company closed its >RMB1 billion financing
    round.


    The remaining public risks are more about disclosure quality and execution visibility than about known legal trouble. The official about-page URL specified for this run returned a page-not-found result, reducing direct official verification at a basic identity endpoint. Public sources also remain thin on board composition, named non-founder executives, headcount, revenue, and valuation. In other words, Shihang''s public file is strong on ambition, technical validation, and capital support, but still thin on the operating and governance detail that an institutional diligence process would normally want before reusing management claims at face value.'
