  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: A current cap table, exact signed amounts for the spring 2026 rounds, and the June 2026 post-money valuation.
    whyItMatters: Without these documents, later chapters can state investor names and a financing floor but cannot reliably compute ownership, dilution, or valuation-based return scenarios.
    diligencePath: Request lead-investor term sheets, board financing approvals, and the current cap table from management.
    relatedQuestionRefs:
    - QO013
    - QO014
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: governance-bench
    missingEvidence: A current board list, named non-founder executive roster, and role descriptions for finance, operations, and technology leadership.
    whyItMatters: Public evidence shows material key-person concentration, but the size of that risk cannot be calibrated without a named leadership bench and board composition.
    diligencePath: Obtain an org chart, board observer/board member list, and biographies for all C-level and vice-president roles.
    relatedQuestionRefs:
    - QO020
    - QO021
    relatedTableRefs:
    - TO002
  - type: stale
    severity: minor
    topic: official-about-page
    missingEvidence: A working official about/history page or equivalent official identity page with company history and leadership details.
    whyItMatters: The specified official about endpoint was unavailable during the run, forcing greater reliance on filings, jobs pages, and financing posts to reconstruct identity and governance context.
    diligencePath: Ask the company for the current canonical about/history URL or archived official company deck.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: material
    topic: commercial-quality-of-orders
    missingEvidence: Customer-by-customer order backlog, signed contract values, delivery timing, cancellation terms, and revenue recognition policy behind the >RMB1B H1 2026 order claim.
    whyItMatters: Orders are being used as the strongest public scale signal, but without contract-level support they cannot substitute for revenue, gross margin, or retention data.
    diligencePath: Request top-customer schedules, backlog aging, and audited monthly management accounts for 2025-2026.
    relatedQuestionRefs:
    - QO016
