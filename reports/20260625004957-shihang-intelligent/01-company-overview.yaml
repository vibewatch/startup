- id: founder-leadership-and-governance
  title: Founder, Leadership, and Governance
  body: 'The public leadership narrative is overwhelmingly founder-centric. Official founder coverage and official/media financing releases identify Chen Xiaobo (陈晓博) as founder, chairman, and CEO, and describe him as a 1989-born Harbin Engineering University alumnus who spent roughly 19 years in marine robotics before founding the company in 2023. Reviewed materials attribute to Chen both the company''s technical identity and much of its fundraising and public-representation activity, including standards work, award visibility, and investor-facing storytelling.


    That concentration matters because the reviewed official/current public sources do not provide a full named board or executive bench. Instead, the clearest public governance signal beyond Chen is a live CFO job posting in Suzhou/Beijing that asks for 0-to-1 finance buildout, fundraising-channel development, capital-markets planning, and IPO-operating experience. The same jobs page also groups roles under a senior-management category and spans multiple cities, indicating organizational expansion but also implying that finance and governance infrastructure are still being built. Until the company provides a current org chart, board list, and named functional executives, key-person dependence on Chen should be treated as material.'
