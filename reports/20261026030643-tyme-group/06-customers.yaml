artifact: customers
slug: tyme-group
runDate: 2026-10-26
company:
  name: Tyme Group
chapter:
  number: 6
  title: Customers
  summary: Tyme Group shows fast customer acquisition in South Africa and the Philippines, using a hybrid digital-and-retail distribution model. Public evidence is strongest for account acquisition and deposit growth; active usage, retention, cohort economics, and customer concentration remain undisclosed.
sections:
  - id: customer-segments
    title: Customer segments and distribution
    body: >-
      Tyme Group targets mass-market consumers and small businesses in emerging markets, rather than a narrow affluent digital-banking niche. Nubank describes the group as serving consumers and SMEs across South Africa and the Philippines, while the group's model combines a digital platform with physical retail experiences, kiosks, and banking ambassadors. This creates a buyer and user proposition with several layers: consumers seeking affordable everyday banking, grant recipients and other underserved users, and SMEs seeking working-capital products. The Philippines joint venture with the Gokongwei Group adds access to a nationwide retail ecosystem, while the South African business uses Pick n Pay, Boxer, TFG, and other retail points. The approach is strategically coherent for customers who need assistance, identity verification, cash access, or trust before becoming fully digital. It also creates channel dependence: the public record does not quantify customer acquisition cost by retailer, the share acquired online versus at kiosks, or the proportion of active accounts. Customer counts should therefore be read as acquired or registered customers unless a source explicitly describes activity, deposits, or usage.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and engagement signals
    body: >-
      The adoption trajectory is unusually rapid but not yet a retention proof. TymeBank reached 8.5 million customers after launching in February 2019, and GoTyme reached 2.3 million customers in its first 14 months according to a 2024 company release. A separate December 2024 BusinessWorld interview reported 5.1 million GoTyme customers and P24 billion in deposits, with management expecting approximately 5.3 million by year-end and more than nine million customers in 2025. These are useful scale and deposit signals, but the denominators are not consistently defined: the sources do not disclose monthly active customers, funded-account rates, transaction frequency, churn, or cohort retention. The group's own current surface reports 23 million customers and roughly 500,000 new customers per month across South Africa and the Philippines, but this is company-reported and conflicts in scope and date with older external counts. The disciplined conclusion is strong acquisition momentum with incomplete durability evidence. A proposed 2026 profitability target for GoTyme is also a forward-looking management expectation, not realized customer economics.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-risks
    title: Named customer proof, expansion, and concentration
    body: >-
      Named customer proof is strongest where a deployment is tied to a concrete use case. TymeBank's retail distribution includes kiosks and retail points, while GoTyme's Philippine proposition includes mall kiosks, ambassadors, account opening, and instant personalized card issuance. The South African bank also reports SME funding through Retail Capital and a merchant cash advance product, giving the group a route beyond consumer deposits. Product expansion into credit, investments, and digital-asset services may increase customer value, but also introduces underwriting, compliance, and engagement risks that public customer data does not resolve. The available record does not provide contract-level customer names, production-versus-pilot status, renewal rates, top-customer concentration, revenue by channel, or customer-level outcomes. App-store evidence shows broad customer feedback and high ratings for the South African app, but also reports notification and interface problems after a rebrand; these are service-quality signals, not measured churn. The principal diligence ask is a cohort file by market and acquisition channel linking funded activity, product adoption, retention, complaints, and contribution margin.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Distribution has produced rapid scale
    body: >-
      The combination of retail access, physical assistance, and digital banking has supported fast customer acquisition in both launch markets, with external reporting confirming deposit growth in the Philippines.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Registered customers are not retention
    body: >-
      Public sources do not disclose active-account, cohort, churn, renewal, or concentration metrics; customer counts and management forecasts should not be treated as durable engagement or revenue quality.
    claimRefs: [CU008, CU009, CU013]
