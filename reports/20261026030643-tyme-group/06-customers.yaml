  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Monthly active customers, funded-account rates, churn, GRR or NRR, cohort retention, and repeat transaction frequency by market.
      whyItMatters: Acquired-account counts and deposits demonstrate scale but do not establish durable engagement, revenue quality, or customer lifetime value.
      diligencePath: Request monthly cohort files for South Africa and the Philippines segmented by acquisition channel, product, funded status, activity, churn, and contribution margin.
      relatedQuestionRefs: [QU005, QU007]
    - type: enumeration-incomplete
      severity: material
      topic: customer-segmentation
      missingEvidence: Complete customer segmentation by geography, vertical, buyer, payer, revenue band, and channel, including top-customer concentration.
      whyItMatters: Retail and partner dependence may make acquisition and economics sensitive to a small number of counterparties or locations.
      diligencePath: Obtain a customer and channel concentration schedule with the top 20 counterparties, acquisition share, revenue share, and contract terms.
      relatedQuestionRefs: [QU001, QU006]
      relatedTableRefs: [TU001, TU003]
    - type: conflicting-data
      severity: material
      topic: customer-count
      missingEvidence: Reconciliation of company-reported 23 million customers with older market-specific counts and definitions.
      whyItMatters: Different dates, brands, markets, and duplicate-account treatment can materially change the interpretation of reported scale.
      diligencePath: Request a dated customer bridge showing opening accounts, new accounts, closures, duplicates, active accounts, and market-level totals.
      relatedQuestionRefs: [QU003, QU008]
    - type: access-blocked
      severity: minor
      topic: app-quality
      missingEvidence: Representative support-ticket, outage, complaint, and app-store review trends by severity and resolution time.
      whyItMatters: A small number of public app reviews cannot establish whether service issues affect retention or trust at scale.
      diligencePath: Request quarterly customer-support and incident dashboards, including notification failures, complaint rates, and resolution cohorts.
      relatedQuestionRefs: [QU007]
