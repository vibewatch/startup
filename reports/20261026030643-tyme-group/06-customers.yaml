    notes: Values are not directly comparable because periods, definitions, and issuer independence differ; customer counts are not ARR, revenue, or active usage.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or population, Segment, Deployment or use case, Production versus pilot, Outcome or signal, Limitation]
    rows:
      - [Pick n Pay and Boxer shoppers, South African consumers, TymeBank retail kiosks and store distribution, Production distribution, "More than 1,000 kiosks and 15,000 retail points were reported in 2024", "Current footprint and customer conversion are not disclosed"]
      - [TFG retail customers, South African consumers, Distribution partnership and higher-income segment access, Production or rollout described, Intended to diversify customer base, Regulatory conditions and realized adoption are not quantified]
      - [Gokongwei retail network users, Philippine consumers, GoTyme kiosks and ambassadors in retail locations, Production distribution, "BusinessWorld attributes reach outside Manila partly to the retail network", "Retailer-level acquisition and retention are not disclosed"]
      - [South African SMEs, SME borrowers, Retail Capital and merchant cash advance, Production product, "TymeBank reported funding more than 50,000 businesses in 2023/24 materials", "Loan performance, repeat borrowing, and concentration are not disclosed"]
      - [GoTyme app users, South African consumers, "Mobile banking, savings, cards, and instant payments", Production app, "App-store rating was 4.8/5 from 24k ratings on the fetched page", "Ratings are self-selected and do not establish active use or retention"]
      - [GoTyme app reviewers, South African consumers, Rebranded app experience, Production app, "Reviews reported missing transaction notifications and navigation or notification complaints", "Individual reviews are anecdotal and may not represent the customer base"]
    enumerationScope:
      coverage: partial
      basis: Named customer segments and public deployment examples found in prefetched sources dated 2021 through October 2026; no complete customer or contract register is public.
    notes: Named relationships and app feedback demonstrate distribution or experience, not contract value, renewal, production usage by every account, or customer outcomes.
    claimRefs: [CU003, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from assisted acquisition to expansion
    type: journey-map
    summary: Tyme's public customer journey moves from retail-assisted onboarding to digital usage and potential product expansion, with retention evidence missing between stages.
    data:
      nodes:
        - id: discovery
          label: Retail discovery
          title: Retail discovery
          touchpoints: [Retail partners, kiosks, and banking ambassadors]
          detail: Physical distribution creates trust and reach for underbanked consumers.
        - id: onboarding
          label: Assisted onboarding
          title: Assisted onboarding
          touchpoints: [Account opening, identity support, personalized debit-card issuance]
          detail: GoTyme describes fast kiosk-based account and card issuance.
        - id: funded
          label: Funded account
          title: Funded account
          touchpoints: [Deposits, savings, salary or grant-linked inflows]
          detail: GoTyme's reported P24 billion in deposits is a funded-balance signal.
        - id: everyday
          label: Everyday banking
          title: Everyday banking
          touchpoints: [Payments, card spend, instant transfers, app support]
          detail: Public evidence does not quantify monthly active usage or transaction frequency.
        - id: expansion
          label: Product expansion
          title: Product expansion
          touchpoints: [Credit, merchant cash advance, investments, digital-asset services]
          detail: Expansion products are described or planned, but adoption and unit economics are not public.
        - id: retention
          label: Durable relationship
          title: Durable relationship
          touchpoints: [Repeat use, renewal, cross-sell, and low churn]
          detail: Cohort retention and churn metrics remain an evidence gap.
    approximationNotes: The journey is a qualitative sequence; no conversion rates or common stage denominator are publicly supported.
    claimRefs: [CU002, CU007, CU010, CU011, CU013]
