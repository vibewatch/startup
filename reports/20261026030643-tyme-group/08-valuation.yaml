  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Scale thesis", "Tyme reported 10.8 million customers globally in 2023 and GoTyme exceeded 2.3 million customers after 14 months.", "Audited cohort, churn, deposit, and contribution-profit data showing durable economics."]
      - ["Distribution thesis", "The model combines digital channels with kiosks, ambassadors, and retail partners.", "Evidence that customer acquisition and servicing costs remain attractive as markets mature."]
      - ["Capital-validation thesis", "Tyme disclosed a US$180 million Series B and a US$77.8 million pre-Series C raise.", "Current round terms, fully diluted ownership, preference stack, and cash runway."]
      - ["Anti-thesis: information asymmetry", "Public sources do not provide a current price, consolidated audited group accounts, or a complete cap table.", "Independent financial statements and transaction documents enabling a price-sensitive underwriting."]
    notes: "Rows separate company-reported operating claims from investor records and identify the specific evidence needed to convert each argument into an investable conclusion."
    claimRefs: [CV002, CV003, CV007, CV008, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "South Africa profitability scales; Philippines and newer markets reach sustainable contribution profit; capital access remains open.", "Potential for a premium growth-fintech outcome, but no numeric range is supportable from retained evidence.", "Positive operating proof points; probability not quantified.", "Audited results fail to show improving group economics."]
      - [Base, "Customer growth continues, but consolidated profitability and funding needs remain unresolved.", "Track at a price that compensates for information and dilution risk; no numeric target.", "Most consistent with the current evidence gap.", "Runway or financing terms deteriorate before profitability is demonstrated."]
      - [Bear, "Growth requires repeated dilution, monetisation lags, or regulatory and execution costs rise in newer markets.", "Downside is capital impairment or a lower future round; no precise loss estimate is supportable.", "Adverse scenario is credible but not probabilistically estimated.", "Down round, failed expansion funding, or material compliance restriction."]
      - [Exit readiness, "IPO or strategic exit requires audited group reporting, governance, and transparent ownership.", "No public evidence establishes an executable exit price or date.", "Unresolved.", "IPO timeline slips or preference rights constrain ordinary equity value."]
    notes: "Qualitative scenarios only; the public record lacks the audited revenue, margin, dilution, preference, and transaction-price inputs required for numeric valuation ranges or probabilities."
    claimRefs: [CV009, CV010, CV011, CV014, CV015, CV016]
