company:
  name: Tyme Group
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a track record of rapid customer growth, an emerging-markets distribution model, and external capital validation, but it does not disclose a current fully diluted cap table, consolidated audited financials, or a current transaction price. The appropriate stance is track rather than buy until price, preference, liquidity, and group-level profitability evidence are available.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Tyme Group has a credible operating proof point in South Africa and a scaling proof point in the Philippines. A January 2024 company release reported SG$215 million of 2023 annualised revenue, 8.5 million TymeBank customers, and 2.3 million GoTyme customers after 14 months, while investor Blue Earth Capital's portfolio description identifies the strategy as serving lower-income consumers and small businesses through retail partnerships in South Africa and the Philippines. British International Investment separately records an active equity investment and describes the target as a bank using physical and digital distribution. Together, these sources support a thesis that the model can acquire underserved customers at scale, but they do not establish group net income, cash generation, or a current equity value. The anti-thesis is therefore information asymmetry rather than a proven operating failure: the latest public metrics are partly company-reported, historical, or not consolidated, and the retained evidence does not show the price at which a new investor could enter.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001, TV002]
  - id: price-and-financing-discipline
    title: Price and financing discipline
    body: >-
      Historical financing provides evidence of investor support but not a present valuation anchor. Tyme announced a US$180 million Series B in 2021, including US$70 million from Tencent and CDC after an earlier US$110 million tranche, while the 2024 release describes a US$77.8 million pre-Series C raise in 2023. BII's investment database separately records an $18.81 million equity commitment beginning in September 2022. These figures are commitments or capital raised, not cash currently available, revenue, or enterprise value, and they span different instruments and dates. A disciplined entry therefore requires the post-Series D fully diluted cap table, liquidation preferences, governance rights, debt and cash, and a current primary or secondary price. Nubank's public market data illustrates why a listed fintech multiple cannot be transferred mechanically: Yahoo Finance shows NU at $15.16 and a $73.233 billion intraday market capitalization on 23 October 2026, while the Wikipedia source describes Nubank as a much larger, mature public company with more than 100 million customers and Brazil generating more than 90% of revenue. That is a reference point for scale and marketability, not a directly comparable valuation multiple for Tyme.
    claimRefs: [CV006, CV007, CV008, CV010, CV011]
    tableRefs: [TV003]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence
    body: >-
      The evidence supports a scenario framework rather than a precise target valuation. The bull case assumes Tyme converts customer and deposit growth into repeatable contribution profit across markets, sustains affordable distribution, and secures a transparent pre-IPO or IPO path. The base case assumes continued growth but requires additional capital while Philippines profitability and consolidated group cash flow remain unverified. The bear case assumes slower monetisation, funding dilution, multiple compression, or regulatory and execution friction in newer markets. GSMA's industry assessment says mobile-money account expansion is easing as the sector matures, so growth assumptions should not extrapolate early adoption indefinitely. BusinessWorld reported management's view that IPO readiness required three markets at scale and profitability, while its end-2025 Philippine profitability expectation remains unverified in this evidence set. Current public sources do not support assigning numeric probabilities or a defensible valuation range without inventing revenue, margin, dilution, or exit assumptions. The decision implication is track/research-more: request audited consolidated FY2025 accounts, a fully diluted cap table and preference stack, current financing terms, runway and capital commitments, country-level profitability, and evidence that customer growth produces durable deposit, lending, and fee economics.
    claimRefs: [CV009, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
