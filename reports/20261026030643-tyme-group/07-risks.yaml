    notes: Risk ratings preserve the distinction between company-reported growth and independently unverified control, loss, reliability, and cash-burn metrics; unknown values are not treated as zero.
    claimRefs: [CR003, CR004, CR005, CR006, CR011, CR012, CR014, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration or reliance, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
