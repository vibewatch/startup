callouts:
  - calloutType: risk
    title: The largest unknown is control maturity at scale
    body: Public sources show rapid customer, revenue, and lending growth, but do not disclose Tyme-specific loss, fraud, uptime, consolidated burn, or control-testing series.
    claimRefs: [CR003, CR004, CR006, CR011, CR012]
  - calloutType: recommendation
    title: Make funding and control evidence a gating item
    body: Before underwriting further expansion, require current regulatory standing, partner contracts, incident and complaints logs, credit cohorts, and a committed funding plan through the next launch milestone.
    claimRefs: [CR007, CR009, CR013, CR014]
