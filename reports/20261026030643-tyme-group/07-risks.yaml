      - [Philippines banking venture, Gokongwei Group, Joint-venture partner, Material, Governance or distribution alignment breaks down, High, Joint-venture structure and retail ecosystem, Medium]
      - [Retail distribution, Pick n Pay / Boxer / TFG, Kiosks and retail access, Material in South Africa, Retail access or service levels deteriorate, High, Multiple retail relationships are reported, Medium]
      - [Expansion capital and exit path, Investors and prospective public markets, Funding and IPO pathway, Unknown, Committed capital or listing readiness is insufficient, High, Prior raises and stated IPO ambition, High]
    notes: Counterparty roles are sourced from company or transaction materials; concentration, contractual protections, service-level commitments, and committed future capital were not disclosed in the retained sources.
    enumerationScope:
      coverage: partial
      basis: Named strategic, joint-venture, retail, and financing dependencies disclosed in retained Tyme materials and independent reporting through the current refresh.
    claimRefs: [CR001, CR002, CR013, CR014]
