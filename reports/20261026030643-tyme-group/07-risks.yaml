company:
  name: Tyme Group
chapter:
  number: 7
  title: Risks
  summary: Tyme Group's principal risks are execution and control risks that accompany rapid, partner-enabled expansion across regulated emerging-market banks. Public evidence supports a credible operating model and strong investor backing, but it does not establish consolidated control effectiveness, incident history, litigation exposure, or the funding required for the stated expansion path.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Tyme operates in jurisdictions where banking, consumer-credit, financial-crime, data, and technology controls are material to license continuity and economics. FATF's 2024 South Africa follow-up ratings are largely compliant for customer due diligence, new technologies, and supervision, but include a partially compliant rating for cash couriers; this is country-level evidence, not a Tyme control assessment. The National Credit Regulator separately highlights that credit products are vulnerable targets and that cyber fraudsters exploit digital sophistication. Public litigation evidence is not company-specific: the SAFLII page is a court-index landing page, so it cannot establish that Tyme has or has not been sued. The diligence priority is therefore current license status, AML and cyber-control testing, complaints and enforcement logs, and a counsel-certified litigation and IP search.
    claimRefs: [CR007, CR008, CR009, CR010]
    tableRefs: [TR001]
  - id: operational-and-model
    title: Operational, security, and financial-model risks
    body: >-
      The operating model combines a digital platform with kiosks, ambassadors, retail distribution, and credit products. That design can improve acquisition and access, but it also creates dependency on physical availability, partner execution, cloud resilience, fraud controls, and credit performance. Tyme's own 2024 materials describe a cloud-based infrastructure and a rapidly growing SME lending portfolio; the available evidence does not provide incident rates, uptime, loss rates, cohort performance, or consolidated cash burn. The risk is not that growth is unproven: the sources report substantial customer and revenue milestones. The risk is that scale, credit exposure, and operational complexity may outpace independently evidenced control maturity. Investors should require monthly loss, fraud, uptime, complaints, and cohort-retention dashboards before treating the model as de-risked.
      South Africa's weak 2026 labor and growth backdrop adds a macro stress channel, but the retained evidence does not quantify its effect on Tyme's borrowers or deposits.
    claimRefs: [CR003, CR004, CR005, CR006, CR011, CR012, CR015]
    tableRefs: [TR002]
  - id: partner-and-execution
    title: Partner, funding, and execution dependencies
    body: >-
      Tyme's expansion is structurally dependent on strategic and distribution partners. The 2024 Series D was led by Nubank, while GoTyme is described as a joint venture with the Gokongwei Group and the South African model uses national retailers and physical kiosks. These relationships can accelerate market entry and provide expertise, but they also create concentration, governance, service-level, and renewal risks that are not quantified publicly. The source record also describes planned expansion into Vietnam and Indonesia and a possible 2028 IPO; neither statement proves committed capital, launch readiness, or exit feasibility. The appropriate kill criteria are measurable: a partner termination or material service failure, a missed regulatory milestone, sustained credit losses above plan, or an inability to document funding through the next expansion phase.
    claimRefs: [CR001, CR002, CR013, CR014]
    tableRefs: [TR003]
    figureRefs: [FR001]
