callouts:
  - calloutType: insight
    title: Structural demand is stronger than measurable share
    body: >-
      Inclusion and connectivity data support multiple country-product wedges, but
      Tyme's public disclosures do not provide a comparable denominator for market
      share or a verified group-level conversion funnel.
    claimRefs: [CM004, CM005, CM014]
  - calloutType: risk
    title: Access is not the same as monetisation
    body: >-
      Cash reliance, documentation gaps, regulatory requirements, and undisclosed
      cohort economics can delay or dilute the path from account opening to profitable
      usage.
    claimRefs: [CM009, CM010, CM016]
