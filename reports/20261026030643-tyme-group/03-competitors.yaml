chapter:
  number: 3
  title: Competitors
  summary: Tyme Group competes in two-sided digital banking markets where incumbent scale, trusted retail distribution, and integrated fintech ecosystems matter as much as software. Its repeatable high-tech/high-touch model and shared technology platform are differentiated, but Maya, GCash, Capitec, and traditional banks demonstrate that profitability, trust, and funding access can narrow the gap.
sections:
  - id: landscape
    title: Competitive landscape and strategic position
    body: >-
      Tyme Group's relevant competitive set spans mass-market digital banks, incumbent banks with large distribution, and embedded-finance or wallet platforms. In South Africa, Capitec combines a large active customer base with profitable lending scale; CNBC Africa reported more than 26 million active clients and 16.8 billion rand of headline earnings for the year ended February 28, 2026. In the Philippines, GoTyme faces Maya and GCash, while Forbes/Statista-based coverage placed GoTyme and Maya among the country's five highest-ranked banks and identified trust, terms, customer service, digital services, and financial advice as the evaluation criteria. These are not like-for-like operating comparisons: Capitec is a scaled incumbent and Maya is an integrated fintech platform, while Tyme's disclosed proposition is a multi-country digital-bank operating model. The practical battlefield is therefore affordable everyday banking, credit, trust, and distribution rather than app features alone.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: distribution-and-capabilities
    title: Distribution, capability, and switching economics
    body: >-
      Tyme's strongest defensible capability is a repeatable distribution-and-operations system: kiosks and ambassadors embedded in retail ecosystems, rapid account opening, and a shared product and technology engine. The company states that its one-platform foundation is tuned to each market, while Mambu described GoTyme as using a cloud-native, API-first platform and more than 500 planned kiosks by the end of 2023. WSO2's customer case study adds an implementation perspective, reporting a migration from on-premises deployment to serverless AWS infrastructure and an API layer handling incoming and outgoing traffic. This architecture can reduce launch friction and support multi-country replication, but it does not eliminate local licensing, partner dependence, credit-risk, or trust requirements. Switching costs are likely highest once customers use Tyme for deposits, payments, rewards, and credit; however, the same customers can multi-home because bank accounts and wallets are easy to open and competitor propositions are increasingly integrated.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: monetization-and-durability
    title: Monetization, moat durability, and displacement risk
    body: >-
      Public evidence supports a differentiated cost and access proposition, not a durable pricing monopoly. Tyme's 2024 release described a target cost structure of about 10 percent of incumbents and lower transaction costs, while Mambu's account described a cloud-native platform designed to scale efficiently. Maya's 2025 disclosures reported 8.2 million bank customers, 2.1 million borrowers, P50 billion of deposits, and P25 billion of outstanding loans, showing that a rival can pair digital acquisition with lending depth and an integrated consumer-and-merchant ecosystem. Maya also reported a non-performing-loan ratio around 3.5 percent in a trade profile, though that source is company-affiliated coverage and is not an independent benchmark. Inquirer reported Maya net income of P1.7 billion in 2025 and noted that regulatory changes affecting online gaming platforms weighed on fourth-quarter revenue. The implication is that Tyme's moat depends on distribution execution, low-cost operations, partner access, and credit discipline; commoditization and incumbent response remain material risks.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: diligence-implications
    title: Buyer implications and unresolved competitive questions
    body: >-
      For a customer choosing among providers, Tyme's strongest reasons to win are physical trust points, fast onboarding, retail reach, and a consistent low-fee proposition. Maya's evidence points to a different advantage: a broad platform spanning payments, deposits, lending, merchant tools, and investments. Capitec's scale and profitability show the pressure from a trusted incumbent with deep lending economics. Tyme's own and partner-authored materials also create attribution limits: customer counts, cost claims, and operating-model benefits are not independent benchmarks, and syndicated or partner pages remain issuer-linked evidence. The central underwriting question is whether Tyme can preserve acquisition efficiency and credit quality as it expands beyond its original markets while retaining local regulatory and retail partners. Public evidence does not establish a comparable Tyme Group-level profitability, churn, realized pricing, or customer switching-cost dataset.
    claimRefs: [CP013, CP014, CP015, CP016]
    tableRefs: []
