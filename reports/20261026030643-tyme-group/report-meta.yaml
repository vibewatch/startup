companyProfile:
  summary: >-
    Tyme Group is a Singapore-headquartered digital-banking group serving consumers and small businesses in emerging
    markets. Its high-tech/high-touch model combines shared GoTymeX product and technology capabilities with local
    banking licences, retail partners, kiosks, and banking ambassadors. South Africa provides the clearest public
    profitability proof point, while Philippines scale is substantial; consolidated audited financials and complete
    post-Series D governance terms remain unavailable in the retained public evidence.
