  topStrengths:
    - South Africa provides a reported standalone profitability proof point.
    - Shared technology and retail distribution support a repeatable multi-market launch model.
    - Institutional investors and the Series D provide external financing validation.
  topRisks:
    - No consolidated audited group financials establish cash generation, burn, or runway.
    - Philippine and newer-market profitability remains unverified, increasing financing and execution risk.
    - Fully diluted ownership, preferences, governance rights, and current entry price are not public.
  unresolvedGaps:
    - Consolidated FY2025 audited P&L, balance sheet, cash flow, and market-level profitability bridge.
    - Fully diluted post-Series D cap table, liquidation preferences, voting rights, and governance terms.
    - GoTyme Philippines audited financials and verified break-even path.
    - Binding capital plan beyond 31 October 2026, including any pre-IPO bridge or follow-on commitments.
    - CAC, cohort LTV, churn, active-customer definitions, and product-level margin data.
