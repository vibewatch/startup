evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Consolidated audited Tyme Group income statement, balance sheet, cash flow, and market-level profitability bridge.
    whyItMatters: >-
      Reported revenue, deposits, and South African profitability do not establish group earnings, cash burn, or capital
      requirements.
    diligencePath: >-
      Request FY2025 and latest interim audited or management accounts from Tyme Group and reconcile all operating
      subsidiaries.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Fully diluted post-Series D cap table, preference stack, voting rights, and complete board register.
    whyItMatters: ARC, Nubank, and other investor influence cannot be assessed from headline ownership percentages alone.
    diligencePath: Request the latest cap table, shareholder agreements, board materials, and reserved-matter schedule under NDA.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A dated, consistently defined group customer and revenue series with entity and product boundaries.
    whyItMatters: >-
      The public record reports 10.8 million, 15 million, 22 million, and 23 million customer figures across different
      sources and dates.
    diligencePath: Request monthly active and registered customer definitions, cohort reconciliation, and audited revenue by market.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: Independent confirmation of current Vietnam, Indonesia, and Hong Kong launch and licensing status.
    whyItMatters: Expansion plans affect capital needs and execution risk but current public evidence is primarily company-issued.
    diligencePath: Check regulator registers and obtain market-entry announcements or licenses for each jurisdiction.
    relatedQuestionRefs:
      - QO006
      - QO010
  - type: private-evidence-only
    severity: material
    topic: sizing-limit
    missingEvidence: >-
      Country-by-country active customers, product penetration, deposits, payment activity, and Tyme market share with
      consistent denominators.
    whyItMatters: >-
      Without comparable denominators, public inclusion and connectivity statistics cannot be translated into Tyme SAM
      or SOM.
    diligencePath: >-
      Request a country-product operating pack with definitions, period bridges, active-account cohorts, and
      market-share calculations.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetisation
    missingEvidence: >-
      CAC, retention, revenue per active account, credit vintages, loss rates, and contribution margin by channel and
      country.
    whyItMatters: Large access pools can remain economically unattractive if usage, retention, or credit performance is weak.
    diligencePath: >-
      Obtain audited or management-certified cohort and unit-economics schedules reconciled to consolidated financial
      statements.
    relatedQuestionRefs:
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: customer-definition
    missingEvidence: A current, reconciled definition of customer, active customer, account, and SME served across all Tyme entities.
    whyItMatters: >-
      Company pages and historical releases use different vintages and product descriptions, so headline counts are not
      directly comparable.
    diligencePath: Request monthly customer bridges by entity and product, including de-duplication, dormancy, and geographic scope.
    relatedQuestionRefs:
      - QM008
  - type: stale
    severity: minor
    topic: forecast
    missingEvidence: Independent current evidence testing the 2027 Philippine neobank-adoption forecast and Tyme's realized share.
    whyItMatters: The forecast is company-cited and historical; it should not be treated as observed current demand.
    diligencePath: Refresh with regulator, central-bank, and independent market data and reconcile forecast definitions.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: >-
      Comparable Tyme, Maya, GCash, and Capitec customer acquisition cost, churn, active-user, deposit-margin, and
      credit-loss cohorts by market.
    whyItMatters: >-
      Headline customer counts and profitability do not show whether Tyme's distribution advantage produces superior
      retained economics.
    diligencePath: >-
      Request competitor-benchmarked cohort, churn, CAC, contribution-margin, and credit-performance data from
      management.
    relatedQuestionRefs:
      - QP002
      - QP006
      - QP010
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized pricing, fee schedules, deposit rates, lending rates, and partner economics across Tyme, Maya,
      GCash, and Capitec.
    whyItMatters: >-
      Public list-price and company cost claims cannot establish price durability or customer-level contribution
      margins.
    diligencePath: >-
      Obtain current product tariffs, realized take rates, promotional discounts, and retail-partner revenue-share
      terms.
    relatedQuestionRefs:
      - QP004
      - QP006
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: >-
      A complete current inventory of South African and Philippine digital-bank, wallet, incumbent, and embedded-finance
      alternatives.
    whyItMatters: The assigned pool supports a focused comparison but not exhaustive market enumeration.
    diligencePath: Refresh the competitor universe using local regulator license lists and current product disclosures.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: switching
    missingEvidence: >-
      Comparable evidence on customer retention, account primacy, and switching behavior across Tyme and its
      competitors.
    whyItMatters: The presence of multiple accounts may limit the persistence of Tyme's distribution and trust advantage.
    diligencePath: Request account-primacy, churn, repeat-use, and multi-homing cohorts by market and product.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: disclosure
    missingEvidence: >-
