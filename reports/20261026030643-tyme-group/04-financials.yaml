callouts:
  - calloutType: strength
    title: South African proof point
    body: TymeBank's reported first profit and customer scale are the strongest public evidence of an operating model that can reach profitability in at least one market.
    claimRefs: [CI005, CI006]
  - calloutType: risk
    title: Consolidated underwriting gap
    body: No retained source establishes group cash, burn, consolidated margins, or a post-2026 financing commitment, so runway and dilution risk remain unresolved.
    claimRefs: [CI013, CI016]
  - calloutType: recommendation
    title: Request entity-level financial pack
    body: Before underwriting, request audited consolidated and subsidiary statements, product-level revenue and margin, credit-loss data, active cohorts, and the financing plan required to reach three scaled markets.
    claimRefs: [CI013, CI016]
