  - id: TI003
    title: Unit-economics evidence and gaps
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Customer scale, "8.5M TymeBank customers in January 2024; 5.1M GoTyme customers in December 2024", high, "Shows distribution and adoption but not active or monetized accounts", "Provide active-monthly customers, cohorts, churn, and revenue per active account"]
      - [Deposits, "P24B GoTyme deposits in December 2024", high, "Indicates balance-sheet scale and funding base", "Provide deposit cost, duration, concentration, and liquidity metrics"]
      - [CAC and LTV, null, low, "Core payback and lifetime-value underwriting inputs are not public", "Provide channel CAC, cohort gross profit, retention, and payback"]
      - [Consolidated cash and burn, null, low, "Determines runway and financing dependency across markets", "Provide audited cash flow, monthly burn, cash runway, debt, and regulatory capital"]
    notes: "Null values are explicit evidence gaps, not zeroes or estimates; customer and deposit figures are entity- or period-specific and should not be aggregated without reconciliation."
    claimRefs: [CI006, CI007, CI011, CI016]
