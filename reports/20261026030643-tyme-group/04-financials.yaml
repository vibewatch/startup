company:
  name: Tyme Group
chapter:
  number: 4
  title: Financials
  summary: Tyme Group shows credible operating traction in South Africa and the Philippines, including a reported first profit at TymeBank, rapid customer and deposit growth at GoTyme, and a low-cost distribution model. Public evidence does not establish consolidated cash, burn, margins, or realized revenue quality, so underwriting remains dependent on private financial diligence.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Tyme's public materials describe a usage-based digital banking model serving consumers and small businesses through mobile channels, retail kiosks, ambassadors, deposits, payments, and credit products. The evidence supports several revenue mechanisms rather than a single subscription stream: transaction economics, lending and merchant cash advances, and banking products distributed through retail ecosystems. A third-party database reports $168 million of revenue in December 2024, while the company's January 2024 release reports a 2023 annualized revenue run rate of SG$215 million. These figures are not directly comparable because the denomination, period, and revenue definition differ. Official list-price claims, such as no monthly fee and lower transaction costs, should not be read as realized revenue or margin. The central diligence issue is the bridge from customers, deposits, and credit balances to net revenue by market and product.
    claimRefs: [CI001, CI002, CI003, CI004, CI008, CI009]
    tableRefs: [TI001, TI002]
  - id: traction-and-unit-economics
    title: Traction and unit-economics proxies
    body: Public traction is strongest for customer counts, deposits, and lending reach, not for CAC, LTV, churn, contribution margin, or payback. TymeBank reported 8.5 million customers and a first profit by January 2024, while GoTyme reported 5.1 million customers and P24 billion in deposits in December 2024. GoTyme's stated 2025 targets of more than nine million customers and P35 billion of deposits are forward guidance, not achieved results. Tyme also reported more than 50,000 businesses funded and approximately 30% portfolio growth after acquiring Retail Capital, but the available text does not disclose loss rates, take rates, net interest margin, or acquisition cost. This supports a positive operating-efficiency hypothesis, not a fully underwritten unit-economics case.
    claimRefs: [CI005, CI006, CI007, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: The retained evidence shows financing has supported expansion across South Africa, the Philippines, and prospective Southeast Asian markets, but it does not provide a consolidated group cash position, monthly burn, runway, debt schedule, or binding post-2026 capital commitment. Tyme's 2021 release said its US$180 million Series B raise would fund TymeBank, GoTyme, and international expansion; that is use-of-funds context rather than cash still available today. GoTyme's CEO said South Africa is already profitable, the Philippine bank needs to become profitable, and three markets at scale are needed before the group is listing-ready. This makes future capital needs dependent on the speed of Philippine profitability, the cost of entering additional markets, credit losses, regulatory capital, and any IPO or bridge financing. Until consolidated accounts are produced, the financing dependency is material.
    claimRefs: [CI013, CI014, CI016]
  - id: risks-and-verdict
    title: Financial verdict and blockers
    body: >-
      The financial picture is investable as a traction story but incomplete as an underwriting package. Positive evidence includes TymeBank's reported first profit, rapid customer acquisition, GoTyme's deposit growth, and a distribution model designed to lower operating costs. Counterevidence is concentrated in disclosure gaps and execution dependencies: the source pool does not establish group-level profitability or cash runway, GoTyme's profitability was still a target in the retained December 2024 interview, and a review source reports recurring complaints about debit holds, disputes, refunds, and card replacement delays. Those complaints do not quantify financial impact, but they are relevant to service cost, retention, and operational risk. The decision should remain track/research-more until management provides audited consolidated statements, product-level revenue and margin, credit-loss data, and a fully diluted financing plan.
    claimRefs: [CI013, CI015, CI016]
    figureRefs: [FI001]
