              - CO009
              - CO010
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies Coenraad Jonker as co-founder and executive chairman, while BusinessWorld
              identifies Nathaniel D. Clarke as GoTyme Bank Philippines president and CEO. TechCrunch reports that
              African Rainbow Capital retained a 40% stake after the Series D. These sources show founder-level
              leadership, a named country executive, and a concentrated strategic shareholder base, but they do not
              establish the current group board, complete executive roster, voting rights, liquidation preferences, or
              succession arrangements. Key-person dependence is therefore a material diligence question rather than a
              quantified conclusion. The listing-readiness conditions Clarke described also place material execution
              responsibility on country leadership because scale and profitability must be demonstrated across multiple
              markets.
            claimRefs:
              - CO005
              - CO006
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO016
      - number: '1.3'
        title: Funding, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              Tyme’s financing history is documented across company announcements and independent reporting. The company
              announced a $180 million Series B in December 2021, and Reuters and TechCrunch reported a $250 million
              Series D in December 2024 at a $1.5 billion valuation. Reuters said Nubank invested $150 million, M&G
              Catalyst Fund subscribed $50 million, and existing shareholders supplied the remaining $50 million;
              TechCrunch separately reported that Nubank’s investment represented a 10% stake. Public operating metrics
              are not fully comparable: a 2023 company release reported 10.8 million global customers and SG$215 million
              annualised revenue, while Reuters reported 15 million customers in December 2024 and the current company
              homepage reports 23 million. These changes may reflect growth, brand changes, or differing measurement
              dates; they should not be combined into a single audited time series. GoTyme Philippines’ reported P24
              billion deposits and 5.1 million customers in December 2024 provide useful country-level scale, but not
              group profitability.
            claimRefs:
              - CO010
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: Ground-truth judgment and open gaps
        blocks:
          - type: paragraph
            body: >-
              Tyme Group has a credible identity, repeatable launch playbook, and evidence of institutional financing
              and operating scale. South Africa is described as profitable by company materials and by GoTyme’s
              Philippines CEO, but the available evidence does not establish consolidated Tyme Group earnings, cash
              burn, capital adequacy, or the profitability path of each market. The planned 2028 IPO is an aspiration
              reported by management and Reuters, not a filed transaction. The company’s expansion into Vietnam and
              Indonesia increases the addressable opportunity but also raises execution, licensing, and funding
              requirements. Investors should request consolidated audited statements, a fully diluted cap table,
              legal-entity and regulatory maps, market-level unit economics, and updated leadership and board
              documentation before treating the public scale narrative as an investment-grade financial profile.
            claimRefs:
              - CO003
              - CO004
              - CO014
              - CO015
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO009
              - CO010
              - CO012
