  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and addressable demand
        blocks:
          - type: paragraph
            body: >-
              The relevant market is digital retail banking and adjacent financial services for under-served consumers
              and small businesses in emerging markets, not all banking revenue. Included spend comprises transaction
              accounts, payments, deposits, consumer credit, and SME working-capital products delivered through mobile
              and assisted channels. Excluded from the immediate serviceable boundary are wholesale banking,
              institutional capital markets, and products requiring a distribution or regulatory footprint that Tyme has
              not publicly demonstrated. Tyme's own description is a multi-country group serving consumers and SMEs,
              while its South African proposition combines digital channels with kiosks and retail points. This makes
              the status quo a mix of incumbent banks, cash, mobile money, informal credit, and employer or government
              payment rails. The boundary is therefore use-case and geography specific: a South African consumer account
              is not interchangeable with Philippine MSME credit, and neither should be summed without a common
              population, product, currency, and time basis.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: Sizing lenses and market development
        blocks:
          - type: paragraph
            body: >-
              Three lenses triangulate the opportunity. First, the inclusion lens shows a large but uneven addressable
              population: the World Bank reports 85% account ownership in South Africa versus 49% across Sub-Saharan
              Africa, while also documenting gaps by income, gender, documentation, and distance. Second, the
              digital-access lens shows that South Africa had 51.7 million internet users and 79.6% internet penetration
              at the end of 2025, but 13.3 million people remained offline; connectivity is a prerequisite, not proof of
              bank adoption. Third, the product-expansion lens is narrower and commercially closer to Tyme: the company
              reported 1.1 million Philippine MSMEs as a target for merchant cash advance and described Vietnam as
              having SMEs at over 97% of companies but only 25% with access to affordable banking. These are different
              denominators and should not be combined into a synthetic TAM. The evidence supports a portfolio of
              country-product wedges, with valuation depending on conversion, retention, credit performance, and
              profitability that the public evidence does not fully disclose.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer segments, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary consumer buyer is a mass-market individual seeking a low-cost account, payments, savings, or
              short-term liquidity; the user and budget owner are usually the same person, with adoption triggered by
              lower fees, convenient onboarding, salary or grant receipt, and nearby assisted access. The SME buyer is
              an owner or finance operator, with the business paying for transaction services and working capital;
              triggers include merchant cash flow, inventory needs, and access to a formal lender. Government and
              employers are indirect channel or payment-origin stakeholders rather than Tyme's sole budget owner.
              Adoption can begin at a kiosk or retail partner, then migrate to app-based payments and credit. The World
              Bank identifies lack of money, documentation, distance, and service expense as common barriers, while the
              South African Reserve Bank describes continued reliance on cash and the need to modernise the payments
              ecosystem. Tyme's high-tech/high-touch approach is consequently a distribution response to market
              friction, not evidence that friction has disappeared. Regulatory permissions, consumer protection, credit
              losses, partner concentration, and the absence of public country-level unit economics remain adoption and
              valuation constraints.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Diligence implications
        blocks:
          - type: paragraph
            body: >-
              Public disclosures show strong early distribution and inclusion signals but leave the conversion from
              market access to durable economic value unresolved. Tyme reported rapid customer acquisition, a low-cost
              operating ambition, and SME lending growth, yet those figures are company-issued and do not establish
              active customers, revenue per account, loss-adjusted contribution, or consolidated profitability.
              Independent evidence supports the addressable conditions—account ownership, digital reach, payment
              modernisation, and access barriers—but not Tyme's share of each market. Before underwriting a larger
              valuation, diligence should obtain country-by-country active-account and cohort data, deposits and payment
              activity, CAC and retention by acquisition channel, credit vintage and loss curves, regulatory capital,
              partner economics, and a consistent definition of customers and SMEs. The key market conclusion is
              therefore positive on structural demand and conditional on execution: the opportunity is real, but the
              public record does not justify a single precise SAM or SOM.
            claimRefs:
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural demand is stronger than measurable share
            body: >-
              Inclusion and connectivity data support multiple country-product wedges, but Tyme's public disclosures do
              not provide a comparable denominator for market share or a verified group-level conversion funnel.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM014
          - type: callout
            title: Access is not the same as monetisation
            body: >-
              Cash reliance, documentation gaps, regulatory requirements, and undisclosed cohort economics can delay or
              dilute the path from account opening to profitable usage.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Tyme Group's relevant competitive set spans mass-market digital banks, incumbent banks with large
              distribution, and embedded-finance or wallet platforms. In South Africa, Capitec combines a large active
              customer base with profitable lending scale; CNBC Africa reported more than 26 million active clients and
              16.8 billion rand of headline earnings for the year ended February 28, 2026. In the Philippines, GoTyme
              faces Maya and GCash, while Forbes/Statista-based coverage placed GoTyme and Maya among the country's five
              highest-ranked banks and identified trust, terms, customer service, digital services, and financial advice
              as the evaluation criteria. These are not like-for-like operating comparisons: Capitec is a scaled
              incumbent and Maya is an integrated fintech platform, while Tyme's disclosed proposition is a
              multi-country digital-bank operating model. The practical battlefield is therefore affordable everyday
              banking, credit, trust, and distribution rather than app features alone.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
              - CP014
      - number: '3.2'
        title: Distribution, capability, and switching economics
        blocks:
          - type: paragraph
            body: >-
              Tyme's strongest defensible capability is a repeatable distribution-and-operations system: kiosks and
              ambassadors embedded in retail ecosystems, rapid account opening, and a shared product and technology
              engine. The company states that its one-platform foundation is tuned to each market, while Mambu described
              GoTyme as using a cloud-native, API-first platform and more than 500 planned kiosks by the end of 2023.
              WSO2's customer case study adds an implementation perspective, reporting a migration from on-premises
              deployment to serverless AWS infrastructure and an API layer handling incoming and outgoing traffic. This
              architecture can reduce launch friction and support multi-country replication, but it does not eliminate
              local licensing, partner dependence, credit-risk, or trust requirements. Switching costs are likely
              highest once customers use Tyme for deposits, payments, rewards, and credit; however, the same customers
              can multi-home because bank accounts and wallets are easy to open and competitor propositions are
              increasingly integrated.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.3'
        title: Monetization, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a differentiated cost and access proposition, not a durable pricing monopoly.
              Tyme's 2024 release described a target cost structure of about 10 percent of incumbents and lower
              transaction costs, while Mambu's account described a cloud-native platform designed to scale efficiently.
              Maya's 2025 disclosures reported 8.2 million bank customers, 2.1 million borrowers, P50 billion of
              deposits, and P25 billion of outstanding loans, showing that a rival can pair digital acquisition with
              lending depth and an integrated consumer-and-merchant ecosystem. Maya also reported a non-performing-loan
              ratio around 3.5 percent in a trade profile, though that source is company-affiliated coverage and is not
              an independent benchmark. Inquirer reported Maya net income of P1.7 billion in 2025 and noted that
              regulatory changes affecting online gaming platforms weighed on fourth-quarter revenue. The implication is
              that Tyme's moat depends on distribution execution, low-cost operations, partner access, and credit
              discipline; commoditization and incumbent response remain material risks.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP012
              - CP014
      - number: '3.4'
        title: Buyer implications and unresolved competitive questions
        blocks:
          - type: paragraph
            body: >-
              For a customer choosing among providers, Tyme's strongest reasons to win are physical trust points, fast
              onboarding, retail reach, and a consistent low-fee proposition. Maya's evidence points to a different
              advantage: a broad platform spanning payments, deposits, lending, merchant tools, and investments.
              Capitec's scale and profitability show the pressure from a trusted incumbent with deep lending economics.
              Tyme's own and partner-authored materials also create attribution limits: customer counts, cost claims,
              and operating-model benefits are not independent benchmarks, and syndicated or partner pages remain
              issuer-linked evidence. The central underwriting question is whether Tyme can preserve acquisition
              efficiency and credit quality as it expands beyond its original markets while retaining local regulatory
              and retail partners. Public evidence does not establish a comparable Tyme Group-level profitability,
              churn, realized pricing, or customer switching-cost dataset.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is the clearest differentiator
            body: >-
              Tyme combines digital channels with kiosks, ambassadors, and retail partners; this is a distribution and
              trust proposition rather than a purely software feature.
            calloutType: strength
            claimRefs:
              - CP006
              - CP013
          - type: callout
            title: Competitor economics are already credible
            body: >-
              Capitec's scale and Maya's reported profitability show that Tyme must prove retained economics and credit
              quality, not only customer acquisition.
            calloutType: risk
            claimRefs:
              - CP002
              - CP004
              - CP015
          - type: callout
            title: Comparable unit economics remain unavailable
            body: >-
              Public evidence does not provide a common realized-price, churn, CAC, or consolidated-profitability
              dataset across the competitive set.
            calloutType: assumption
            claimRefs:
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Tyme's public materials describe a usage-based digital banking model serving consumers and small
              businesses through mobile channels, retail kiosks, ambassadors, deposits, payments, and credit products.
              The evidence supports several revenue mechanisms rather than a single subscription stream: transaction
              economics, lending and merchant cash advances, and banking products distributed through retail ecosystems.
              A third-party database reports $168 million of revenue in December 2024, while the company's January 2024
              release reports a 2023 annualized revenue run rate of SG$215 million. These figures are not directly
              comparable because the denomination, period, and revenue definition differ. Official list-price claims,
              such as no monthly fee and lower transaction costs, should not be read as realized revenue or margin. The
              central diligence issue is the bridge from customers, deposits, and credit balances to net revenue by
              market and product.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI004
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI009
              - CI010
              - CI011
      - number: '4.2'
        title: Traction and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is strongest for customer counts, deposits, and lending reach, not for CAC, LTV, churn,
              contribution margin, or payback. TymeBank reported 8.5 million customers and a first profit by January
              2024, while GoTyme reported 5.1 million customers and P24 billion in deposits in December 2024. GoTyme's
              stated 2025 targets of more than nine million customers and P35 billion of deposits are forward guidance,
              not achieved results. Tyme also reported more than 50,000 businesses funded and approximately 30%
              portfolio growth after acquiring Retail Capital, but the available text does not disclose loss rates, take
              rates, net interest margin, or acquisition cost. This supports a positive operating-efficiency hypothesis,
              not a fully underwritten unit-economics case.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI011
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows financing has supported expansion across South Africa, the Philippines, and
              prospective Southeast Asian markets, but it does not provide a consolidated group cash position, monthly
              burn, runway, debt schedule, or binding post-2026 capital commitment. Tyme's 2021 release said its US$180
              million Series B raise would fund TymeBank, GoTyme, and international expansion; that is use-of-funds
              context rather than cash still available today. GoTyme's CEO said South Africa is already profitable, the
              Philippine bank needs to become profitable, and three markets at scale are needed before the group is
              listing-ready. This makes future capital needs dependent on the speed of Philippine profitability, the
              cost of entering additional markets, credit losses, regulatory capital, and any IPO or bridge financing.
              Until consolidated accounts are produced, the financing dependency is material.
            claimRefs:
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Financial verdict and blockers
        blocks:
          - type: paragraph
            body: >-
              The financial picture is investable as a traction story but incomplete as an underwriting package.
              Positive evidence includes TymeBank's reported first profit, rapid customer acquisition, GoTyme's deposit
              growth, and a distribution model designed to lower operating costs. Counterevidence is concentrated in
              disclosure gaps and execution dependencies: the source pool does not establish group-level profitability
              or cash runway, GoTyme's profitability was still a target in the retained December 2024 interview, and a
              review source reports recurring complaints about debit holds, disputes, refunds, and card replacement
              delays. Those complaints do not quantify financial impact, but they are relevant to service cost,
              retention, and operational risk. The decision should remain track/research-more until management provides
              audited consolidated statements, product-level revenue and margin, credit-loss data, and a fully diluted
              financing plan.
            claimRefs:
              - CI013
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI006
              - CI010
              - CI011
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: South African proof point
            body: >-
              TymeBank's reported first profit and customer scale are the strongest public evidence of an operating
              model that can reach profitability in at least one market.
            calloutType: strength
            claimRefs:
              - CI005
              - CI006
          - type: callout
            title: Consolidated underwriting gap
            body: >-
              No retained source establishes group cash, burn, consolidated margins, or a post-2026 financing
              commitment, so runway and dilution risk remain unresolved.
            calloutType: risk
            claimRefs:
              - CI013
              - CI016
          - type: callout
            title: Request entity-level financial pack
            body: >-
              Before underwriting, request audited consolidated and subsidiary statements, product-level revenue and
              margin, credit-loss data, active cohorts, and the financing plan required to reach three scaled markets.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Tyme Group delivers banking through a “high tech and high touch” model rather than a software-only app.
              The company describes one shared platform and product philosophy tuned to local markets, while the South
              African and Philippine examples show the customer-facing workflow: a user can open an account digitally or
              at a retail kiosk, receive a card quickly, and use savings, payments, lending, and merchant services.
              GoTyme Bank's Philippine launch materials describe five-minute account opening and card issuance, and the
              South African partner account describes kiosk-to-cloud integration. These are company or partner
              descriptions, not an independently measured conversion or reliability study. The central product thesis is
              therefore credible as an operating model, but realized benefit, cost per account, and support quality
              require internal operating data.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE013
      - number: '5.2'
        title: Platform architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Public materials indicate a shared technology and product-development engine, with GoTymeX supplying
              design, technology, and data analytics to in-country banks. Tyme's earlier financing announcement
              described the South African bank as the first bank in the country operated fully on cloud infrastructure,
              while the AWS case study documents use of CodeWhisperer, Amazon Q, and Bedrock in software development and
              an internal chatbot. A BPC case study describes SmartVista handling instant card issuance, payment-scheme
              certification, card-manufacturing logistics, and transaction flows through open APIs. Together, these
              sources support a modular cloud-and-partner architecture, but they do not disclose the full ledger,
              core-banking, identity, data-residency, disaster-recovery, or change-management design.
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE013
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE007
              - CE008
      - number: '5.3'
        title: Maturity, roadmap, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The platform has evidence of multi-market reuse, but maturity is uneven by market and product. The
              official footprint lists South Africa and the Philippines as operating banks and describes Indonesia and
              Hong Kong as digital-financing arms launched through local partnerships; Vietnam is described as a
              technology and product hub rather than a disclosed operating bank. A 2023 Vietnamese report described
              planned digital lending expansion and a technology team working with cloud computing, microservices,
              cloud-based banking systems, cross-border operations, and Scrum. The later South African rebrand involved
              a phased app migration and preserved the local licence and regulatory oversight. This suggests a
              repeatable deployment playbook, but also dependence on local partners, licences, payment schemes, retail
              locations, and migration execution.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Trust, security, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Tyme's public materials show awareness of regulated-bank obligations and describe the South African bank
              as fully regulated, with the same safety and security standards as other banks. AWS reports that TymeX
              selected cloud security features and used developer tools that can detect security issues, while Moneyweb
              says the 2026 app migration was phased to prioritize security and platform stability. These are useful
              control signals, not proof of independent assurance. The assigned evidence does not provide
              penetration-test results, certifications, uptime and incident history, fraud-loss rates, recovery
              objectives, privacy architecture, or regulator findings. Those omissions are material because the model
              concentrates operational risk in shared technology, third-party cloud and payment providers, retail
              integrations, and local banking compliance.
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reusable phygital platform
            body: >-
              The strongest product evidence is the combination of a shared GoTymeX engine with local retail and banking
              partnerships, which can lower deployment friction while preserving market-specific distribution.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE007
          - type: callout
            title: Technical assurance is under-disclosed
            body: >-
              Public sources describe architecture components and migration intent but do not disclose independent
              security assurance, availability history, resilience metrics, or third-party risk outcomes.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and distribution
        blocks:
          - type: paragraph
            body: >-
              Tyme Group targets mass-market consumers and small businesses in emerging markets, rather than a narrow
              affluent digital-banking niche. Nubank describes the group as serving consumers and SMEs across South
              Africa and the Philippines, while the group's model combines a digital platform with physical retail
              experiences, kiosks, and banking ambassadors. This creates a buyer and user proposition with several
              layers: consumers seeking affordable everyday banking, grant recipients and other underserved users, and
              SMEs seeking working-capital products. The Philippines joint venture with the Gokongwei Group adds access
              to a nationwide retail ecosystem, while the South African business uses Pick n Pay, Boxer, TFG, and other
              retail points. The approach is strategically coherent for customers who need assistance, identity
              verification, cash access, or trust before becoming fully digital. It also creates channel dependence: the
              public record does not quantify customer acquisition cost by retailer, the share acquired online versus at
              kiosks, or the proportion of active accounts. Customer counts should therefore be read as acquired or
              registered customers unless a source explicitly describes activity, deposits, or usage.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption trajectory and engagement signals
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is unusually rapid but not yet a retention proof. TymeBank reached 8.5 million
              customers after launching in February 2019, and GoTyme reached 2.3 million customers in its first 14
              months according to a 2024 company release. A separate December 2024 BusinessWorld interview reported 5.1
              million GoTyme customers and P24 billion in deposits, with management expecting approximately 5.3 million
              by year-end and more than nine million customers in 2025. These are useful scale and deposit signals, but
              the denominators are not consistently defined: the sources do not disclose monthly active customers,
              funded-account rates, transaction frequency, churn, or cohort retention. The group's own current surface
              reports 23 million customers and roughly 500,000 new customers per month across South Africa and the
              Philippines, but this is company-reported and conflicts in scope and date with older external counts. The
              disciplined conclusion is strong acquisition momentum with incomplete durability evidence. A proposed 2026
              profitability target for GoTyme is also a forward-looking management expectation, not realized customer
              economics.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU007
              - CU010
              - CU011
              - CU013
      - number: '6.3'
        title: Named customer proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is strongest where a deployment is tied to a concrete use case. TymeBank's retail
              distribution includes kiosks and retail points, while GoTyme's Philippine proposition includes mall
              kiosks, ambassadors, account opening, and instant personalized card issuance. The South African bank also
              reports SME funding through Retail Capital and a merchant cash advance product, giving the group a route
              beyond consumer deposits. Product expansion into credit, investments, and digital-asset services may
              increase customer value, but also introduces underwriting, compliance, and engagement risks that public
              customer data does not resolve. The available record does not provide contract-level customer names,
              production-versus-pilot status, renewal rates, top-customer concentration, revenue by channel, or
              customer-level outcomes. App-store evidence shows broad customer feedback and high ratings for the South
              African app, but also reports notification and interface problems after a rebrand; these are
              service-quality signals, not measured churn. The principal diligence ask is a cohort file by market and
              acquisition channel linking funded activity, product adoption, retention, complaints, and contribution
              margin.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution has produced rapid scale
            body: >-
              The combination of retail access, physical assistance, and digital banking has supported fast customer
              acquisition in both launch markets, with external reporting confirming deposit growth in the Philippines.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Registered customers are not retention
            body: >-
              Public sources do not disclose active-account, cohort, churn, renewal, or concentration metrics; customer
              counts and management forecasts should not be treated as durable engagement or revenue quality.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Tyme operates in jurisdictions where banking, consumer-credit, financial-crime, data, and technology
              controls are material to license continuity and economics. FATF's 2024 South Africa follow-up ratings are
              largely compliant for customer due diligence, new technologies, and supervision, but include a partially
              compliant rating for cash couriers; this is country-level evidence, not a Tyme control assessment. The
              National Credit Regulator separately highlights that credit products are vulnerable targets and that cyber
              fraudsters exploit digital sophistication. Public litigation evidence is not company-specific: the SAFLII
              page is a court-index landing page, so it cannot establish that Tyme has or has not been sued. The
              diligence priority is therefore current license status, AML and cyber-control testing, complaints and
              enforcement logs, and a counsel-certified litigation and IP search.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.2'
        title: Operational, security, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              The operating model combines a digital platform with kiosks, ambassadors, retail distribution, and credit
              products. That design can improve acquisition and access, but it also creates dependency on physical
              availability, partner execution, cloud resilience, fraud controls, and credit performance. Tyme's own 2024
              materials describe a cloud-based infrastructure and a rapidly growing SME lending portfolio; the available
              evidence does not provide incident rates, uptime, loss rates, cohort performance, or consolidated cash
              burn. The risk is not that growth is unproven: the sources report substantial customer and revenue
              milestones. The risk is that scale, credit exposure, and operational complexity may outpace independently
              evidenced control maturity. Investors should require monthly loss, fraud, uptime, complaints, and
              cohort-retention dashboards before treating the model as de-risked. South Africa's weak 2026 labor and
              growth backdrop adds a macro stress channel, but the retained evidence does not quantify its effect on
              Tyme's borrowers or deposits.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.3'
        title: Partner, funding, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Tyme's expansion is structurally dependent on strategic and distribution partners. The 2024 Series D was
              led by Nubank, while GoTyme is described as a joint venture with the Gokongwei Group and the South African
              model uses national retailers and physical kiosks. These relationships can accelerate market entry and
              provide expertise, but they also create concentration, governance, service-level, and renewal risks that
              are not quantified publicly. The source record also describes planned expansion into Vietnam and Indonesia
              and a possible 2028 IPO; neither statement proves committed capital, launch readiness, or exit
              feasibility. The appropriate kill criteria are measurable: a partner termination or material service
              failure, a missed regulatory milestone, sustained credit losses above plan, or an inability to document
              funding through the next expansion phase.
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The largest unknown is control maturity at scale
            body: >-
              Public sources show rapid customer, revenue, and lending growth, but do not disclose Tyme-specific loss,
              fraud, uptime, consolidated burn, or control-testing series.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR011
              - CR012
          - type: callout
            title: Make funding and control evidence a gating item
            body: >-
              Before underwriting further expansion, require current regulatory standing, partner contracts, incident
              and complaints logs, credit cohorts, and a committed funding plan through the next launch milestone.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR009
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Tyme Group has a credible operating proof point in South Africa and a scaling proof point in the
              Philippines. A January 2024 company release reported SG$215 million of 2023 annualised revenue, 8.5
              million TymeBank customers, and 2.3 million GoTyme customers after 14 months, while investor Blue Earth
              Capital's portfolio description identifies the strategy as serving lower-income consumers and small
              businesses through retail partnerships in South Africa and the Philippines. British International
              Investment separately records an active equity investment and describes the target as a bank using
              physical and digital distribution. Together, these sources support a thesis that the model can acquire
              underserved customers at scale, but they do not establish group net income, cash generation, or a current
              equity value. The anti-thesis is therefore information asymmetry rather than a proven operating failure:
              the latest public metrics are partly company-reported, historical, or not consolidated, and the retained
              evidence does not show the price at which a new investor could enter.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.2'
        title: Price and financing discipline
        blocks:
          - type: paragraph
            body: >-
              Historical financing provides evidence of investor support but not a present valuation anchor. Tyme
              announced a US$180 million Series B in 2021, including US$70 million from Tencent and CDC after an earlier
              US$110 million tranche, while the 2024 release describes a US$77.8 million pre-Series C raise in 2023.
              BII's investment database separately records an $18.81 million equity commitment beginning in September
              2022. These figures are commitments or capital raised, not cash currently available, revenue, or
              enterprise value, and they span different instruments and dates. A disciplined entry therefore requires
              the post-Series D fully diluted cap table, liquidation preferences, governance rights, debt and cash, and
              a current primary or secondary price. Nubank's public market data illustrates why a listed fintech
              multiple cannot be transferred mechanically: Yahoo Finance shows NU at $15.16 and a $73.233 billion
              intraday market capitalization on 23 October 2026, while the Wikipedia source describes Nubank as a much
              larger, mature public company with more than 100 million customers and Brazil generating more than 90% of
              revenue. That is a reference point for scale and marketability, not a directly comparable valuation
              multiple for Tyme.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a scenario framework rather than a precise target valuation. The bull case assumes
              Tyme converts customer and deposit growth into repeatable contribution profit across markets, sustains
              affordable distribution, and secures a transparent pre-IPO or IPO path. The base case assumes continued
              growth but requires additional capital while Philippines profitability and consolidated group cash flow
              remain unverified. The bear case assumes slower monetisation, funding dilution, multiple compression, or
              regulatory and execution friction in newer markets. GSMA's industry assessment says mobile-money account
              expansion is easing as the sector matures, so growth assumptions should not extrapolate early adoption
              indefinitely. BusinessWorld reported management's view that IPO readiness required three markets at scale
              and profitability, while its end-2025 Philippine profitability expectation remains unverified in this
              evidence set. Current public sources do not support assigning numeric probabilities or a defensible
              valuation range without inventing revenue, margin, dilution, or exit assumptions. The decision implication
              is track/research-more: request audited consolidated FY2025 accounts, a fully diluted cap table and
              preference stack, current financing terms, runway and capital commitments, country-level profitability,
              and evidence that customer growth produces durable deposit, lending, and fee economics.
            claimRefs:
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV012
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track pending price discovery
            body: >-
              The operating thesis is credible, but public evidence does not support a current fair-value estimate or a
              buy recommendation without audited group accounts, cap-table terms, and a transaction price.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
              - CV015
          - type: callout
            title: Financing terms are the gating diligence item
            body: >-
              Historical funding demonstrates investor support but does not establish cash available, dilution,
              liquidation preference, governance, or the price an investor would pay today.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
