chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Tyme Group presents itself as a multi-country digital-banking group headquartered in Singapore, with
              operating businesses in South Africa and the Philippines and technology and product capabilities in
              Vietnam and other locations. StartupList Africa identifies Coenraad Jonker as group founder and chief
              executive and describes a shared technology platform across banking businesses. The company’s own site
              describes a high-tech/high-touch model: digital products are combined with kiosks, ambassadors, and retail
              distribution rather than relying on an app alone. This is a coherent operating model for underbanked
              markets, but the public materials are predominantly company-issued and do not provide a consolidated
              legal-entity map or audited group perimeter. GoTyme’s Vietnam site reports 22 million customers acquired
              since the first launch and 900 GoTymeX experts, while the company homepage reports 23 million customers
              across South Africa and the Philippines; these current scale figures should be treated as company claims
              because the pages do not provide an independently audited denominator or reporting date.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
              - CO008
              - CO009
