            title: Strategic financing validation
            body: >-
              Nubank’s $150 million investment within Tyme Group’s $250 million Series D and the reported $1.5 billion
              valuation provide meaningful external validation, although they do not substitute for audited operating
              results.
            calloutType: strength
            claimRefs:
