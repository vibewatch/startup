        - id: onboarding
          label: Assisted onboarding
          title: Assisted onboarding
          touchpoints:
            - Account opening
            - identity support
            - personalized debit-card issuance
          detail: GoTyme describes fast kiosk-based account and card issuance.
        - id: funded
          label: Funded account
          title: Funded account
