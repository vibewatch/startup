company:
  name: Tyme Group
chapter:
  number: 1
  title: Company Overview
  summary: Tyme Group is a Singapore-headquartered digital-banking group that builds banks for consumers and small businesses in emerging markets, using a shared technology platform plus physical retail touchpoints. The strongest public evidence shows rapid customer and deposit growth, a $1.5 billion valuation after the 2024 Series D, and substantial investor backing, but group-level audited financials, full governance terms, and current profitability outside South Africa remain undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Tyme Group presents itself as a multi-country digital-banking group headquartered in Singapore, with operating businesses in South Africa and the Philippines and technology and product capabilities in Vietnam and other locations. StartupList Africa identifies Coenraad Jonker as group founder and chief executive and describes a shared technology platform across banking businesses. The company’s own site describes a high-tech/high-touch model: digital products are combined with kiosks, ambassadors, and retail distribution rather than relying on an app alone. This is a coherent operating model for underbanked markets, but the public materials are predominantly company-issued and do not provide a consolidated legal-entity map or audited group perimeter. GoTyme’s Vietnam site reports 22 million customers acquired since the first launch and 900 GoTymeX experts, while the company homepage reports 23 million customers across South Africa and the Philippines; these current scale figures should be treated as company claims because the pages do not provide an independently audited denominator or reporting date.
    claimRefs: [CO001, CO002, CO003, CO004, CO007, CO008, CO009]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      Public evidence identifies Coenraad Jonker as co-founder and executive chairman, while BusinessWorld identifies Nathaniel D. Clarke as GoTyme Bank Philippines president and CEO. TechCrunch reports that African Rainbow Capital retained a 40% stake after the Series D. These sources show founder-level leadership, a named country executive, and a concentrated strategic shareholder base, but they do not establish the current group board, complete executive roster, voting rights, liquidation preferences, or succession arrangements. Key-person dependence is therefore a material diligence question rather than a quantified conclusion. The listing-readiness conditions Clarke described also place material execution responsibility on country leadership because scale and profitability must be demonstrated across multiple markets.
    claimRefs: [CO005, CO006, CO016]
    tableRefs: [TO002]
  - id: funding-scale-and-milestones
    title: Funding, scale, and milestones
    body: >-
      Tyme’s financing history is documented across company announcements and independent reporting. The company announced a $180 million Series B in December 2021, and Reuters and TechCrunch reported a $250 million Series D in December 2024 at a $1.5 billion valuation. Reuters said Nubank invested $150 million, M&G Catalyst Fund subscribed $50 million, and existing shareholders supplied the remaining $50 million; TechCrunch separately reported that Nubank’s investment represented a 10% stake. Public operating metrics are not fully comparable: a 2023 company release reported 10.8 million global customers and SG$215 million annualised revenue, while Reuters reported 15 million customers in December 2024 and the current company homepage reports 23 million. These changes may reflect growth, brand changes, or differing measurement dates; they should not be combined into a single audited time series. GoTyme Philippines’ reported P24 billion deposits and 5.1 million customers in December 2024 provide useful country-level scale, but not group profitability.
    claimRefs: [CO010, CO012, CO013, CO014, CO015]
  - id: diligence-judgment
    title: Ground-truth judgment and open gaps
    body: >-
      Tyme Group has a credible identity, repeatable launch playbook, and evidence of institutional financing and operating scale. South Africa is described as profitable by company materials and by GoTyme’s Philippines CEO, but the available evidence does not establish consolidated Tyme Group earnings, cash burn, capital adequacy, or the profitability path of each market. The planned 2028 IPO is an aspiration reported by management and Reuters, not a filed transaction. The company’s expansion into Vietnam and Indonesia increases the addressable opportunity but also raises execution, licensing, and funding requirements. Investors should request consolidated audited statements, a fully diluted cap table, legal-entity and regulatory maps, market-level unit economics, and updated leadership and board documentation before treating the public scale narrative as an investment-grade financial profile.
    claimRefs: [CO003, CO004, CO014, CO015, CO016]
    tableRefs: [TO003]
callouts:
  - calloutType: strength
    title: Strategic financing validation
    body: Nubank’s $150 million investment within Tyme Group’s $250 million Series D and the reported $1.5 billion valuation provide meaningful external validation, although they do not substitute for audited operating results.
    claimRefs: [CO012, CO013]
  - calloutType: risk
    title: Disclosure asymmetry
    body: Current public materials provide market-level customer, deposit, and revenue claims but no consolidated audited financial statements or complete post-Series D governance terms.
    claimRefs: [CO015, CO016]
