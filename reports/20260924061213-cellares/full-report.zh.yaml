      - number: '8.2'
        title: 情景区间推演与可比标的锚定
        blocks:
          - type: paragraph
            body: >-
              最有效的估值框架是情景区间推演，而非单一定价点位。在悲观情景下，因厂区扩建速度超过客户转化效率，Cellares
              的估值更接近研发期公开市场生物科技基础设施的倍数；在基准情景下，凭借工业化验证、药企合作和自动化优势，公司应享有明显溢价，但仍低于已规模化运营的商业基础设施企业；在乐观情景下，多厂区利用率持续提升、更多客户完成转化，企业价值可能显著提高。因此，可比样本应结合公开市场估值参照、非上市股权二级市场交易，以及体现重工业属性而非
              SaaS 经济性的运营类比公司。这一框架把估值限定在公开证据能够支持的范围内，避免给制造平台套用软件倍数。
            claimRefs:
              - CV002
