companyProfile:
  summary: >-
    Cellares 总部位于南旧金山，是一家非上市制造平台，正借助自动化 IDMO 智能工厂网络推动细胞疗法生产工业化。公开证据比多数非上市自动化同行更扎实：累计融资 $612 million；与 Bristol Myers
    Squibb 签署最高 $380 million 的产能预留协议；Cabaletta 项目已从工艺采用推进至首例患者给药，Cellares 还与其签署 10
    年商业化供货协议；公司还在美国、欧洲和日本建设基地。其定位更像“基础设施加服务”，而非单纯的设备自动化。
  foundedDate: '2019-01-01'
  founders:
    - name: Fabian Gerlinghaus
      role: 联合创始人兼 CEO
      background: 创立 Cellares 前，曾在 Synthego 负责自动化技术的规模化落地。
      claimRefs:
