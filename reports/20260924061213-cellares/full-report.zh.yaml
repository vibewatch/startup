  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规与法律风险
        blocks:
          - type: paragraph
            body: >-
              最大的非财务风险在于，Cellares 身处强监管行业，质量、验证和审计表现与产品性能同样重要。公司已有一些积极信号——获得 FDA AMT 认定、硬件符合 cGMP 标准并参与 PreCheck
              审查——但这些仅属风险对冲项，并不等同于合规豁免。Trellis 诉讼案是尽调重点：原告称，自己在质量与合规审计后遭到报复。这引出对内部问题上报渠道、供应商监督，以及管理层如何处理负面信息的疑问。


              对投资人而言，关键不只是公司能否获批或通过检查，更是业务扩张、项目增加后能否持续合规。一旦客户觉得公司只在方便时才重视合规，制造平台很快就会失去信任。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
