      - number: '6.3'
        title: 客户集中度、业务持久性与信任壁垒
        blocks:
          - type: paragraph
            body: >-
              客户集中度是一柄双刃剑。少数优质申办方能快速验证平台，但商业化势头也可能取决于少数大客户，而非广泛复购的客户群。BMS 的预留协议、Stanford 与首尔大学的合作，以及 Poseida 和 Lyell
              的研发项目为公司增信，但这些合作仍不足以证明公司已实现稳定、长期、多客户且大规模的产能利用。


              互信机制同样关键。Trellis
              诉讼案并不能证明客户因此遇到问题，但仍可能影响申办方对其质量文化、合规表现及管理层应对风险能力的判断。对制造平台而言，客户购买自动化能力的同时，也在为可靠性、可审计性和监管信心买单。因此，尽调的关键不在于公司有无客户，而在于能否把早期标杆合作转化为持续多年的制造收入。
            claimRefs:
              - CU003
