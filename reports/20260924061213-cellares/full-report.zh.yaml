      - number: '4.3'
        title: 财务评估与尽调查核缺口
        blocks:
          - type: paragraph
            body: >-
              各项财务核验指标多空交织。正面看，Cellares
              已展现申办方需求，披露的融资规模也较大；实体平台理论上还能随时间提高产出。负面看，公司仍未披露尽调通常用来判断经营状况的核心指标：收入、毛利率、烧钱速度、现金跑道和产能利用率。LeadIQ
              的员工数估算进一步印证其是一家体量庞大、运营极重的实体工业网络，绝非固定成本低廉的 SaaS 软件。


              财务逻辑能否成立，取决于公司能否把已签项目和预留产能转成可重复实现的制造收入，同时避免每座厂区耗资过高。现有证据支持其战略价值，也显示后期投资者对其有兴趣，但还不足以建立精确的利润率模型。审慎做法是把确切估值和资金消耗列为待尽调事项，而非既定事实。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI010
      - number: '4.4'
        title: 展项
        blocks:
          - type: callout
            title: 资本密集度是核心财务风险
            body: 若厂区建设成本、产能利用率瓶颈或资金消耗速度跑赢商业化转化进度，哪怕拿下药企订单，财务表现仍可能不及预期。
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品功能与核心定位
        blocks:
          - type: paragraph
            body: >-
              Cellares 交付的是一套制造平台体系，而非单台仪器设备。其中，Cell Shuttle 负责全流程端到端生产；Cell Q
              负责过程质控与放行质控的自动化执行；底层软件系统则协同排程、监控和批次记录。官方资料始终将该产品定义为封闭式、符合 cGMP 要求的细胞疗法制造环境，可支持临床和商业化项目。


              这一定位很重要：客户买的不是孤立的实验室工具，而是一套工作流，目标是减少工艺波动、缩短技术转移周期，并让细胞疗法从研发走向规模化生产时更标准化。产品与市场契合度（PMF）的有力证据，是 Cellares
              已有真实申办方项目；BMS、Lyell、Stanford 和 Seoul National University Hospital 等项目，正检验该平台能否稳定承接各自工艺，并达到可靠性和质量要求。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
