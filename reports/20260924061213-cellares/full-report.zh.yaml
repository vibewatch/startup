      - number: '2.3'
        title: 尽调核心启示
        blocks:
          - type: paragraph
            body: >-
              尽调审视的核心，不在于赛道真实与否，而在于该平台能否将真实需求转化为跨区域、可复制的规模化生产订单。公开证据显示 Cellares
              已在头部药企与转化医学中心取得初步验证，但仍需证明前述试点与产能预留能沉淀为广泛、可持续复购的工业化产能。


              这使得市场前景颇具吸引力，但投资逻辑尚未得到充分验证。若资质认证周期漫长，且申办方内部自建仍有吸引力，即使市场潜力巨大，市场渗透率也可能偏低、推进缓慢。因此，本报告将市场空间视作投资逻辑的正面因素，但把确切规模列为待核实的尽调缺口，而非既定事实。
            claimRefs:
              - CM008
              - CM009
              - CM012
      - number: '2.4'
        title: 展项
        blocks:
          - type: callout
            title: 市场规模重在测算视角，而非单一数字
            body: 由于该市场处于发展初期且公开资料缺少权威测算源，最佳做法是多维交叉推算，而非生搬硬凑单一估算值。
            calloutType: assumption
            claimRefs:
              - CM009
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >-
              竞争格局可划分为四大阵营：自动化优先的直接竞品、细胞疗法制造自动化厂商、传统 CDMO 厂商，以及药企申办方的内部自建产线。直接自动化竞品包括 Oribiotech、Multiply Labs、Cellular
              Origins、Astraveus、Unicorn Biotechnologies、Celltrio 和 ThermoGenesis 等。传统 CDMO
              依然是不容忽视的竞争对手，许多申办方仍倾向于外包给成熟代工厂，而非直接拥抱 IDMO 模式。


              Cellares 的独特性在于试图将整套链条——生产、质控、软件与区域产能——融合成单一运营模型。相比单点工具，这一产品定位更具说服力；但也意味着竞争门槛不再仅限于设备技术参数。Cellares
              必须向市场证明：申办方愿意把项目交给该网络，且自身扩张速度能超过分散的小型自动化厂商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP011
      - number: '3.2'
        title: 市场定位、业务规模与差异化壁垒
        blocks:
          - type: paragraph
            body: >-
              市场数据表明，Cellares 堪称该赛道资金最雄厚的玩家之一。Tracxn 将其列为活跃竞品第二位，累计融资额位居榜首；其余监测平台显示的后期估值亦远超常规直接竞品。充裕资金虽不意味着所向披靡，但确实赋予
              Cellares 远胜同行的资本实力，以支撑厂房建设、推进工艺验证并拿下头部申办方。


              因此，Cellares
              的差异化不在于开创全新赛道，而在于整合能力与执行力。公司希望成为细胞疗法制造的默认工业底座，而不只是设备供应商。若能如披露所示，持续守住质量、区域覆盖和申办方信任，其地位就难以撼动；反之，若执行跟不上，市场仍可能由区域自动化厂商和传统服务商分食，竞争趋于同质化。
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
