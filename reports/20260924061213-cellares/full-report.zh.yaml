            body: >-
              点名客户的合作呈现出清晰的推进路径：Poseida 参与早期试用计划，Lyell 就 LYL797 开展概念验证，Stanford 将平台应用延伸至基因编辑 HSC 领域，Seoul National
              University Hospital 依托该平台推进基因修饰 HSPC 研发，而 Bristol Myers Squibb 签下目前公开可见的最大商业协议。综合来看，这些凭据表明 Cellares
              已摆脱内部打样阶段，切实切入了外部申办方的研发生产流程。


              但合作证据的成熟度并不相同：有些已属商业合作，另一些仍在探索或临床前阶段。因此，这些客户更像仍在推进中的采纳管线，而非成熟的装机客户群。由于客户数、总留存率（GRR）和净留存率（NRR）均未公开，现有资料无法量化客户留存或扩张。
