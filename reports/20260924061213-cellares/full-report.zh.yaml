chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              Cellares 将自身定位为首家综合开发与制造组织（IDMO），将细胞疗法的工艺开发与商业化生产统一在同一套自动化平台之下。公司官方资料显示，其总部位于南旧金山，业务模式核心是借助 Cell Shuttle 与
              Cell Q 系统推进细胞疗法生产工业化。后文据此分析其市场选择、合作方契合度和资本需求。公开页面与市场数据平台对其成立年份和核心产品的描述基本一致，但在更细的财务和估值指标上存在分歧。


              尽调的核心结论是：Cellares 并非传统软件公司、CDMO
              或纯工具厂商，而是一家制造平台企业，向细胞疗法供应链提供产能、自动化和技术转移服务。这一区别贯穿整份尽调：公司的经营表现取决于产能利用率、监管准备度和项目转化，而非软件公司的经常性收入指标。因此，收入和估值仍不透明；公开记录无法支撑确切数据之处，均列为待补的证据缺口。
            claimRefs:
              - CO001
              - CO002
              - CO003
