      - number: '1.3'
        title: 融资历程、业务规模与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              Cellares 的融资轨迹显示其正快速扩张。公司于 2026 年 1 月披露 $257 million 的 Series D 轮融资，随后在 2026 年 6 月获得 Prime Radiant 追加的 $50
              million 投资，并将该轮融资表述为 $327 million 的 Series D 轮。独立市场数据源同样显示其累计融资金额处于数亿美元高位：某 pre-IPO 追踪平台给出的投后估值约为 $1.4
              billion，另一平台记录的总融资额则超过 $639 million。这些口径出入不容忽视，但均指向同一事实：Cellares 是一家资金充裕、进入后期阶段且仍未上市的重资产企业。


              其运营布局也已颇具规模。根据公司披露，南旧金山与 Bridgewater 厂区已开展商业化规模运营，Leiden 与柏市（Kashiwa）厂区处于在建状态；LeadIQ 估算其截至 2026 年 8 月员工数约为
              322 人。Trellis 记录了一条公开负面线索：2025
              年的一起劳动诉讼指控公司在质量与合规审计后实施报复。下文梳理的里程碑构成了本报告后续分析的基础：涵盖创立、融资、监管资质认可、客户合作落地，以及初现端倪的诉讼风险。
