      - number: '1.2'
        title: 领导架构、治理与创始人契合度
        blocks:
          - type: paragraph
            body: >-
              作为一家已进入后期阶段的工业生物科技公司，Cellares 仍由创始人掌舵，这并不常见：Fabian Gerlinghaus 出任联合创始人兼 CEO，Omar Kurdi
              担任联合创始人兼总裁。官方高管履历着重强调两人在规模化扩张技术组织上的深厚实操经验；考虑到 Cellares
              正在把复杂的生物制造工序封装为平台型产品，这一背景尤为关键。董事会和顾问团队还包括具有金融或制药运营背景、熟悉细胞疗法的人士，进一步强化了创始人与赛道的契合度。


              公司治理的核心，不在于是否具备上市公司式的标准董事会，而在于全球扩张时能否让技术和商业两端的可信参与者保持一致。尽调的核心问题是：Cellares
              能否在不过度依赖少数高管的前提下保持执行速度，尤其是在进入新地区、争取商业化规模客户时。现有证据显示，公司存在关键人物依赖，但也有扎实的领域顾问支持，并受到申办方关注。
            claimRefs:
