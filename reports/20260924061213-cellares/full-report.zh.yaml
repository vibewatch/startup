      - number: '5.3'
        title: 差异化壁垒、体系整合与技术演进路线
        blocks:
          - type: paragraph
            body: >-
              Cellares 声称，其差异化来自端到端自动化、高通量和更严格的质量控制，而非开创新疗法。平台旨在减少操作失误和污染风险，并缩短申办方转移工艺所需的时间。技术路线也已超出原有的 T 细胞疗法边界：与
              Stanford 和首尔大学的合作表明平台正切入基因编辑 HSC / HSPC 工作流；若能保持工艺通用性而非滑向单点定制，有望拓宽可服务市场。


              商业维度的深意在于，Cellares
              希望成为倾向外包而非自建厂房的细胞疗法申办方首选的制造基础设施。若能跑通，这一定位会很有优势；但也要求设备可靠、支持及时、软硬件衔接顺畅并严格遵守监管要求。若平台不能稳定导入客户工艺，或无法及时支持放行检测，就难以成为工业制造底座。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE012
      - number: '5.4'
        title: 展项
        blocks:
          - type: callout
            title: 平台全栈覆盖既是护城河也是风险源
            body: 支撑 Cellares 核心吸引力的高度集成设计，反过来也带来了繁重的合规验证、运维支持与现场部署压力；任一环节掉链子，整体商业逻辑都会大打折扣。
            calloutType: insight
            claimRefs:
              - CE010
              - CE012
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分与应用场景
        blocks:
          - type: paragraph
            body: >-
              Cellares 属纯 B2B 业务，客户画像为亟需制造产能的细胞疗法申办方、转化医学中心以及处于研发阶段的创新药企。其客户细分边界明确：怀揣商业化诉求的大型跨国药企、亟需技术转移与临床生产服务的 Biotech
              公司，以及寻求标准化临床推进通道的高校或附属医院中心。地域维度同样关键，公司正着力构建横跨美国、欧洲与日本的多区域工厂网络。


              客群细分之所以重要，是因为采购决策远非单看产品性能。申办方必须在三者间权衡：内部自建产线、委托传统 CDMO 代工，抑或采纳 IDMO 模式以服务采购替代重资本开支。公开证据表明 Cellares
              已获得这三类客户的关注，但合作大多仍处于试点、概念验证（PoC）或产能预留阶段，尚未进入稳定的大规模商业化生产。
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU010
