  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 视角
      - 论点
      - 改变观点的触发条件
    rows:
      - - 投资逻辑
        - 作为非上市制造平台，Cellares 的公开验证相当扎实：融资规模大、获得蓝筹申办方合作，并在推进工业化设施建设。
        - 若能披露更多客户转化、可复制的产能利用率以及更清晰的经济模型，将进一步支撑其估值溢价逻辑。
      - - 投资逻辑
        - 若能将产能切实转化为稳定的吞吐量，制造平台相较诸多未商业化的生物科技公司理应享有估值溢价。
        - 厂区层面的产能利用率与利润率证据能让溢价更具持续性。
      - - 反向逻辑
        - 定价信息依然不透明：公开信源对当前估值各执一词，也没有来源披露完整股权结构表和优先股堆叠。
        - 若管理层披露当前条款或近期的老股交易价格，该观点将有所改观。
      - - 反向逻辑
        - 高资本开支属性与规模化扩张风险意味着，在产能利用率跟上之前，公司可能需要更多资金支持。
        - 更透明的烧钱速度、现金跑道与客户转化数据将缓解对下行风险的担忧。
    notes: 该表将公司质地与入场价格的合理性区分开来。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV009
      - CV010
      - CV012
    enumerationScope:
      coverage: sample
      basis: Public proof points, capital intensity, and current disclosure gaps.
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 核心风险
      - 决策含义
    rows:
      - - 悲观情景
        - 客户转化放缓，产能利用率难以证实，且在工厂经济模型清晰之前公司仍需补充资本。
        - 可支撑估值区间约 $0.8B-$1.5B，更接近研发期基础设施或生物科技替代标的区间。
        - 融资稀释、商业化放缓，以及估值纪律在市场炒作下瓦解。
        - 即便考虑参与，也仅限大幅折价情形。
      - - 基准情景
        - 蓝筹客户验证依然稳固，新增转化数据逐步显现，运营透明度有所提升，但资本密集属性仍未消除。
        - 可支撑估值区间约 $1.5B-$3.0B，反映了工业化验证带来的溢价，但尚未达到成熟商业化规模。
        - 公司在利润率与产能利用率上依然不透明，因此溢价空间受到压制。
        - 若定价处于该区间或更低水平且条款优渥，则继续推进尽调。
      - - 乐观情景
        - 多个厂区和客户的转化均快于预期，公司开始显现出差异化商业基础设施的特征。
        - 可支撑估值区间约 $3.0B-$5.0B，但前提是非公开尽调证据远强于公开信息。
        - 执行风险、监管风险与客户集中度风险依然客观存在。
        - 除非有极其强劲的非公开尽调证据，否则切勿将该估值区间计入投资判断。
    notes: 上述区间用于约束估值判断，不是具体点位预测。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
    enumerationScope:
      coverage: sample
      basis: Public proof, secondary marks, and capital-intensity risk through the run date.
