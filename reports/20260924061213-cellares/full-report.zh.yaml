  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与估值约束纪律
        blocks:
          - type: paragraph
            body: >-
              看
              Cellares，先能讲清的是公司质地，不是估值。公开记录显示其融资规模大、正在建设多处工业基地，也已获得蓝筹药企和细胞疗法制造基础设施方面的验证。但要判断具体入场价格是否合理，还缺少关键的非公开信息：最新投后估值、清算优先权、完整股权结构、老股交易估值、实际产能利用率，以及收入如何转化为利润率。公司仍处于重资产建设和扩张阶段，这些缺口尤其重要。因此建议继续研究，不是因为公司质地差，而是现有证据不足以支持精确判断。价格纪律应当明确：只有非公开条款的价格接近分歧较大的市场估值区间下沿，且尽调补齐产能利用率、客户转化和后续融资需求等关键缺口，才考虑支付明显溢价。
            claimRefs:
              - CV001
