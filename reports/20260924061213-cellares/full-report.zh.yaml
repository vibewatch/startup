      - number: '3.3'
        title: 定价不透明性与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              整个赛道的定价机制依然极不透明。非上市市场出现这种情况属常态，但也意味着公开尽调无法开展直观的 SKU
              比价，只能根据融资金额、合作药企质量、客户验证深度及平台覆盖面来推断其竞争身位。在此背景下，切换成本、监管互信与跨厂区运营积累比名义报价更为关键。


              核心隐忧在于同质化。一旦自动化演变为行业基础标配而非差异化卖点，Cellares
              就必须依靠网络效应、申办方锁定效应、工艺转移速度与合规资质来筑高护城河。现有证据固然偏正面，但面对多家具备实力的竞争者，尚不足以断定其已锁定长期胜局。
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP009
              - CP012
      - number: '3.4'
        title: 展项
        blocks:
          - type: callout
            title: 赛道仍存同质化竞争风险
            body: 若自动化沦为准入门槛，Cellares 必须持续在网络规模、申办方信任及工艺转移速度上确立优势，方能守住其溢价地位。
            calloutType: risk
            claimRefs:
              - CP009
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化变现
        blocks:
          - type: paragraph
            body: >-
              Cellares 通过 IDMO 智能工厂提供生产服务、技术转移和预留产能。官方资料显示，其平台整合 Cell Shuttle 与 Cell
              Q，支持工艺开发、临床生产及后续商业化供货。它更像合同制造与平台授权的结合，而非传统软件订阅业务。


              商业逻辑在于：若自动化与标准化确实能减少人工和厂房占地、同时提高生产通量，单个厂区就能承接更多项目，把前期资本投入转成可持续提供的制造产能。最有力的公开变现证据来自点名的合作伙伴和产能预留协议，尤以
              Bristol Myers Squibb 协议最具代表性。但由于标准报价单、分成比例及收入确认规则均未披露，本章仅基于替代指标与明确标注的缺口展开推演，不妄下收入运行率结论。
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
