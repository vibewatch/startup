  customerFocus: 主要客户为需要自动化工艺转移、生产与质控（QC）产能的细胞疗法研发企业及药企申办方。公开验证高度集中在 Bristol Myers Squibb 和 Cabaletta 两家，其余生物科技公司与学术机构客户仍处于更早期阶段。
