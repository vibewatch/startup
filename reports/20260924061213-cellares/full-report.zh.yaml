          - type: paragraph
            body: >-
              退出路径目前主要是继续保持非上市状态、扩大与战略伙伴的合作，或在更长时间后上市；近期不太可能出现可据以确定估值的流动性事件。这不代表公司没有吸引力，而是投资人需要在上调估值前看到更多运营验证。下一步尽调应聚焦价格：最新条款清单、完整股权结构表、近期老股交易或要约收购定价、各厂区利用率、订单转化、烧钱速度，以及扩至商业化规模所需的过渡资金。只有两种情况会改变估值判断：披露价格低于目前分歧较大的公开估值区间，或公司拿出足够的利用率和客户转化数据，收窄不确定性。在此之前，应继续跟踪，等待更清晰的证据。
            claimRefs:
              - CV005
              - CV010
              - CV012
      - number: '8.4'
        title: 展项
        blocks:
          - type: callout
            title: 核心估值风险在于过早为未来验证买单
            body: Cellares 即使是一家好公司，若投资人按产能利用率、收入和股权结构均已明朗来定价，也可能买贵。
            calloutType: risk
            claimRefs:
              - CV003
              - CV006
          - type: callout
            title: 条款与验证双重改善方可支撑溢价
            body: 若非上市市场定价保持克制，且公司能把预留产能转化为清晰可见的经营经济性，估值逻辑才会得到有力支撑。
            calloutType: strength
            claimRefs:
              - CV001
              - CV008
