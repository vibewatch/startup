      - number: '7.3'
        title: 财务负担与投资逻辑破坏风险
        blocks:
          - type: paragraph
            body: >-
              财务风险脉络十分明确：Cellares
              属于重资本模式，收入和现金跑道不透明，各方估值口径也未统一。在产能利用率爬坡前，若公司必须持续融资建设新厂，股权稀释与融资时点风险都会很高。药企合作虽是积极信号，却不能消除公司对耐心资本的依赖。


              导致投资逻辑彻底失效的三大触发点是：(1) 失去申办方互信；(2) 扩张期质量管控失守；(3)
              巨额融资未能转化为可重复实现的制造收入。最大的隐忧不是赛道或需求不存在，而是重资产扩张跑得太快，全球标准化和变现平台的能力却跟不上。
