      - number: '5.2'
        title: 技术架构、工作流与技术成熟度
        blocks:
          - type: paragraph
            body: >-
              Cellares 的技术架构在细胞疗法领域集成度较高。公司披露的封闭式自动化系统包括耗材盒（Consumable Cartridge）、试剂舱系统（Reagent Vault
              System）、无菌液体转移系统（Sterile Liquid Transfer System）、物料处理系统（Material Handling System）、生物工艺系统（Bioprocessing
              Systems）及工艺设计平台（Process Design Studio），支持多种工艺步骤和疗法类型。公开信息表明，单台 Cell Shuttle 最多可装载 16
              个耗材盒并同时运行多道工序；平台支持相当一部分常见细胞疗法类型。


              核心问题仍是技术成熟度。Cellares 表示，首台符合 cGMP 规范的 Cell Shuttle 已在南旧金山建成，平台也获得 FDA
              先进制造技术（AMT）认定；行业报道则称，公司正在推进临床应用准备，并把平台拓展到干细胞工作流。这些进展显示公司已有实质推进，但要成为常规制造基础设施，仍须完成复杂的验证、工艺迁移和质量体系建设。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
