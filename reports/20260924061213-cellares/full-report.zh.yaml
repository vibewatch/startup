      - number: '4.2'
        title: 融资规模、估值现状与资金需求
        blocks:
          - type: paragraph
            body: >-
              Cellares 主要依赖多轮大额一级市场股权融资维系重资产建设，而非公开市场募资。2026 年 1 月公司公告称累计融资额达 $612 million，2026 年 6 月追加轮又引入 $50 million
              成长股权，并将 Series D 轮总体量表述为 $327 million。第三方市场数据平台在后期轮次的大体规模上方向一致，但在具体金额与估值水位上存在分歧：Forge 显示其 Series D-1 估值约
              $1.4 billion，而 QuantLogix 则记录其尚无已确认公开估值。


              这一分歧很重要：公司仍在欧洲和日本建设厂区，并为 2027
              年商业化规模生产做准备。它不像已经盈利的成熟制造商，更像一个需要持续吸引投资方资金的工业平台，直到产能利用率跟上现有厂区规模。风险不只是股权稀释，也在于下一轮融资究竟是为了扩张，还是为了支撑核心运营模式。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI010
              - CI011
              - CI012
