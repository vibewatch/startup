  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与行业现状
        blocks:
          - type: paragraph
            body: >-
              分析 Cellares
              时，应将其归入细胞疗法制造自动化产业链，而非泛化的生物科技市场。核心市场边界涵盖自动化细胞疗法生产、技术转移、放行检测，以及申办方推进临床与商业化项目所必需的工业化基础设施；排除了上游药物研发支出、通用生物制药工具与无关的实验室自动化设备。


              行业现状仍以人工操作为主。行业媒体反复指出，细胞疗法制造步骤繁多、需要熟练操作人员，工序交接也容易出问题。这正是 Cellares
              试图替代的市场痛点。这个问题既关乎运营，也受监管约束，并非单纯的科学难题；客户是否采纳，不只看生产通量，还要看信任、工艺验证，以及从试点走到商业化规模的路径。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: 市场测算视角与需求驱动力
        blocks:
          - type: paragraph
            body: >-
              公开记录无法提供单一可靠的市场规模数据，因此需要多维度交叉推算。视角之一，是已推进细胞疗法进入临床或商业化阶段的申办方潜在支出；视角之二，是药企自建产能与外包产能之间的权衡决策；视角之三，是用标准化自动化网络替换分散且依赖人工的多步骤流程所需投入的改造成本。


              即便缺乏确切测算，需求驱动因素依然明确：获批细胞疗法数量持续增加，研发管线储备庞大，申办方迫切寻求速度更快、稳定性更高且具备区域韧性的生产方案。限制条件同样明显：监管要求高、资本投入大、切换成本高，而且产品本身就是工艺。市场空间虽大，但客户导入和产能建设都很关键；公司的变现大概率随产能建设推进，而非沿着纯软件式的采用曲线增长。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM011
