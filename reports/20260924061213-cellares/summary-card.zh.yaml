  topStrengths:
    - Bristol Myers Squibb 协议和 Cabaletta 的验证进展，使 Cellares 获得了比多数非上市自动化同行更扎实的公开商业验证。
    - 已披露融资 $612 million，加上四地建厂布局，为全球细胞疗法制造扩张提供了可信的平台基础。
    - Cell Shuttle、Cell Q、围绕 AMT 认定形成的监管定位，以及广泛的专利布局，都显示其工艺与自动化可能具备实质差异化。
    - 公司更像基础设施业务而非管线型 biotech；如果产能利用率和客户转化变得可见，这种模式可支撑估值溢价。
  topRisks:
    - 当前估值、每股价格、股权结构表和清算优先权均未披露，仅凭公开证据无法评判入场纪律。
    - 公开来源仍未披露产能利用率、收入、毛利率或实际批次经济性数据，投资判断因此容易陷入虚假精确。
    - 公开客户证据高度集中于 Bristol Myers Squibb 和 Cabaletta，其余已点名的合作多仍处于更早期阶段。
    - 多区域建厂与工艺转移执行，带来不小的跨厂可比性、质量和进度风险。
    - 自动化同行也宣称能大幅提升通量、降低成本；仅凭赛道热度，不足以按成熟商业化同行的估值水平定价。
  unresolvedGaps:
    - 当前投后估值、每股价格、股权结构表及优先股堆叠
    - 各基地利用率、已预订产能、订单转化及实际客户集中度
    - 收入运行率、毛利率、批次经济性与现金消耗情况
    - 除协议金额之外，BMS 合作从产能预留到实际业务转化的机制及长期需求假设
    - Leiden 与 Kashiwa 基地的资格认证、投产准备及人员配置证据
