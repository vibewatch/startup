chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >-
              Cellares presents itself as the first Integrated Development and Manufacturing Organization (IDMO),
              combining development and commercial manufacturing for cell therapies under one automated platform. The
              company's own materials describe a South San Francisco headquarters and a business model centered on
              industrializing cell therapy production with the Cell Shuttle and Cell Q systems. That framing matters
              because later chapters use the same identity to interpret market choice, partner fit, and capital
              intensity. Public pages and market-data profiles are consistent on the founding year and the core product,
              even when they differ on more granular financial or valuation fields.


              The practical takeaway is that Cellares is not a conventional software company, CDMO, or pure tools
              vendor; it is a manufacturing platform business that sells production capacity, automation, and technology
              transfer into the cell-therapy supply chain. That distinction drives the rest of the diligence: the
              company's economics depend on utilization, regulatory readiness, and program conversion rather than on
              classic recurring software metrics. For that reason, the chapter treats revenue and valuation as partially
              opaque and uses explicit gaps where the public record does not support a precise figure.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.2'
        title: Leadership, governance, and founder-market fit
        blocks:
          - type: paragraph
            body: >-
              Cellares' leadership stack is unusually founder-led for a late-stage industrial biotech: Fabian
              Gerlinghaus is the co-founder and CEO, and Omar Kurdi is the co-founder and president. The company's own
              leadership bios emphasize deep operating experience in scaling technical organizations, which is relevant
              because Cellares is trying to compress biomanufacturing complexity into a platform product. That
              founder-market fit is reinforced by the broader advisory and board mix, which includes finance and pharma
              operators with cell-therapy credentials.


              The governance picture is therefore less about a formal public-company board and more about whether the
              company can keep a technically credible, commercially credible coalition aligned while it expands
              globally. For diligence, the key question is whether Cellares can preserve execution speed without
              overrelying on a small number of executives, especially as it opens new regions and pursues
              commercial-scale customers. The available evidence suggests meaningful key-person dependence, but also
              unusually strong domain-specific advising and sponsor visibility.
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO010
              - CO012
              - CO014
      - number: '1.3'
        title: Funding, scale, and milestone timeline
        blocks:
          - type: paragraph
            body: >-
              Cellares' financing story shows an aggressive growth path. The company disclosed a $257 million Series D
              in January 2026 and then a further $50 million Prime Radiant investment in June 2026, describing the round
              as a $327 million Series D. Independent market-data sources also place the company in the
              high-hundreds-of-millions cumulative funding range, with one pre-IPO tracker showing a post-money mark
              around $1.4 billion and another listing total funding above $639 million. Those differences are not
              trivial, but they all point in the same direction: Cellares is late-stage, heavily capitalized, and still
              private.


              The operating footprint is correspondingly material. Company disclosures point to commercial-scale
              activity in South San Francisco and Bridgewater, with Leiden and Kashiwa under construction, and LeadIQ
              estimates roughly 322 employees as of August 2026. Trellis adds a public adverse note: a 2025 employment
              lawsuit alleging retaliation after quality and compliance audits. The timeline below captures the
              milestones that matter most for the rest of the report: founding, financing, regulatory recognition,
              customer-facing collaborations, and the first visible signs of litigation risk.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
