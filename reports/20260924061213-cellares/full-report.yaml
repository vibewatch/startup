  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - thesis
        - >-
          Cellares has unusually strong public proof for a private manufacturing platform: major capital raised,
          blue-chip sponsors, and a real industrial buildout.
        - >-
          More disclosed customer conversion, repeatable utilization, and clearer economics would strengthen the premium
          case.
      - - thesis
        - >-
          A manufacturing platform can deserve a premium to many pre-commercial biotech names if it converts capacity
          into reliable throughput.
        - Site-level utilization and margin evidence would make the premium more durable.
      - - anti-thesis
        - >-
          The price file is still opaque: public sources disagree on the current valuation, and no source gives a clean
          cap-table / preference stack view.
        - The view improves if management shares current terms or a recent secondary price.
      - - anti-thesis
        - Capital intensity and scaling risk mean the business could need more money before utilization catches up.
        - Better burn, runway, and conversion data would reduce the downside concern.
    notes: This table separates company quality from the quality of the entry price.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV009
      - CV010
      - CV012
    enumerationScope:
      coverage: sample
      basis: Public proof points, capital intensity, and current disclosure gaps.
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation logic
      - Key risks
      - Decision implication
    rows:
      - - bear
        - >-
          Customer conversion slows, utilization remains hard to prove, and the company needs more capital before
          factory economics are visible.
        - Supportable range roughly $0.8B-$1.5B, closer to development-stage infrastructure / biotech proxy territory.
        - Financing dilution, slower commercialization, and price discipline collapsing under hype.
        - Only participate at a deep discount, if at all.
      - - base
        - >-
          Blue-chip proof remains intact, new conversion data appears, and operating clarity improves without
          eliminating capital intensity.
        - >-
          Supportable range roughly $1.5B-$3.0B, reflecting a premium for industrial proof but still not mature
          commercial scale.
        - The company is still opaque on margins and utilization, so the premium remains capped.
        - Continue diligence if the price sits in or below this band with strong terms.
      - - bull
        - >-
          Multiple sites and customers convert faster than expected, and the company starts to look like differentiated
          commercial infrastructure.
        - >-
          Supportable range roughly $3.0B-$5.0B, but only if the private evidence is much stronger than the public
          record.
        - Execution, regulatory, and concentration risk are still real.
        - Do not underwrite this band without unusually strong private diligence.
    notes: The ranges are guardrails, not point estimates.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
    enumerationScope:
      coverage: sample
      basis: Public proof, secondary marks, and capital-intensity risk through the run date.
