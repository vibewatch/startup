  title: Customers
  summary: Cellares' customer evidence is strongest where named sponsors and translational centers have entered proof-of-concept,
    tech-transfer, or capacity-reservation work; the public record still lacks a clean customer-count metric or retention
    history.
sections:
- id: customer-segmentation
  title: Customer segments and use cases
  body: 'Cellares does not sell to consumers; it sells to cell-therapy sponsors, translational centers, and development-stage
    drug makers that need manufacturing capacity. The clearest customer segments are large pharma sponsors with commercial
    ambitions, biotech sponsors that need tech transfer and clinical manufacturing, and academic or hospital centers that
    want a standardized path into the clinic. Geography also matters because the company markets a multi-region network spanning
    the US, Europe, and Japan.


    That segmentation matters because the adoption decision is not just about product quality. Sponsors have to decide whether
    to keep manufacturing in-house, work with a traditional CDMO, or shift to an IDMO model that trades capital investment
    for an outsourced platform. Cellares'' public proof points show it is winning interest in all three customer types, but
    the evidence is still strongest at the pilot, proof-of-concept, or reserved-capacity stage rather than at large-scale
    steady-state commercial volume.'
  claimRefs:
  - CU001
  - CU002
  - CU007
  - CU010
  tableRefs:
  - TU001
- id: adoption-and-proof
  title: Adoption trajectory and named proof
  body: 'The named-customer record shows a clear progression. Poseida appeared in an early-access program, Lyell ran a proof-of-concept
    on LYL797, Stanford expanded the platform into gene-edited HSC workflows, Seoul National University Hospital used the
    platform for gene-modified HSPC development, and Bristol Myers Squibb signed the largest visible commercial agreement.
    Taken together, those references show that Cellares has moved beyond internal demos and into external sponsor work.


    At the same time, the evidence hierarchy still matters. Some relationships are clearly commercial, while others are exploratory
    or preclinical. That means the customer story is best read as an adoption pipeline rather than as a mature installed base.
    The lack of a public customer-count metric, plus the absence of GRR/NRR data, means the report cannot yet quantify retention
    or expansion from the public record alone.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU009
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU001
- id: concentration-and-durability
  title: Concentration, durability, and trust
  body: 'Customer concentration is both a strength and a risk. A small number of high-quality sponsors can validate the platform
    quickly, but they also mean commercial momentum may depend on a few large accounts rather than a broad base of recurring
    customers. The BMS reservation, the Stanford and Seoul partnerships, and the Poseida and Lyell programs give the company
    credibility, but they do not yet prove durable, high-volume multi-customer utilization.


    Trust also matters. The Trellis litigation does not prove a customer issue, but it can still affect how sponsors evaluate
    quality culture, compliance behavior, and leadership response to risk. For a manufacturing platform, that matters because
    customers are buying reliability, auditability, and regulatory confidence as much as they are buying automation. The diligence
    gap is therefore less about whether the company has any customers and more about whether it can convert those early sponsor
    relationships into repeatable, multi-year manufacturing revenue.'
  claimRefs:
  - CU003
  - CU008
  - CU011
  - CU012
