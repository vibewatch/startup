evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: A current, source-backed disclosure of revenue or revenue run-rate.
    whyItMatters: Without revenue disclosure, the report cannot score operating leverage or normalize valuation against sales.
    diligencePath: Check later financing materials, customer contracts, or an audited filing if one becomes public.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: A reconciled current valuation figure that matches company disclosures and private-market trackers.
    whyItMatters: >-
      Valuation stance depends on whether the latest mark is closer to the company's disclosed round language or the
      pre-IPO market estimate.
    diligencePath: Compare the latest company release, private-market trackers, and any secondary transaction evidence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: leadership
    missingEvidence: A second independent domain directly corroborating the founder and board roster.
    whyItMatters: The leadership table is only lightly cross-checked today and would benefit from a second domain for robustness.
    diligencePath: Corroborate founder and board names through another reputable market-data or financing source.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: investors
    missingEvidence: A second independent domain directly corroborating the investor map.
    whyItMatters: Investor concentration and sponsor mix should be cross-checked beyond company disclosures.
