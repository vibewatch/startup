- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - What would change the view
  rows:
  - - thesis
    - 'Cellares has unusually strong public proof for a private manufacturing platform: major capital raised, blue-chip sponsors,
      and a real industrial buildout.'
    - More disclosed customer conversion, repeatable utilization, and clearer economics would strengthen the premium case.
  - - thesis
    - A manufacturing platform can deserve a premium to many pre-commercial biotech names if it converts capacity into reliable
      throughput.
    - Site-level utilization and margin evidence would make the premium more durable.
  - - anti-thesis
    - 'The price file is still opaque: public sources disagree on the current valuation, and no source gives a clean cap-table
      / preference stack view.'
    - The view improves if management shares current terms or a recent secondary price.
  - - anti-thesis
    - Capital intensity and scaling risk mean the business could need more money before utilization catches up.
    - Better burn, runway, and conversion data would reduce the downside concern.
  notes: This table separates company quality from the quality of the entry price.
