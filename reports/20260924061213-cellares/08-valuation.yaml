company:
  name: Cellares
chapter:
  number: 8
  title: Valuation
summary: 'Cellares has enough public proof to justify real diligence, but not enough disclosed pricing data to underwrite
  a clean entry valuation. The company has raised $612 million, pushed its Series D to $327 million with the June 2026 extension,
  and continues to build a capital-intensive global manufacturing network. Against that backdrop, the market-data signals
  are noisy: Forge shows a roughly $1.4 billion Series D-1 mark, while Caplight and QuantLogix say no confirmed valuation
  is on record, and other secondary sources add more noise than clarity. The right stance is therefore research-more / price-sensitive,
  with a high-risk posture and a premium only if private terms, utilization, and conversion data improve materially.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'Cellares is a company quality story before it is a clean valuation story. The public record supports a strong strategic
    narrative: the company has raised a large amount of capital, is building multiple industrial sites, and has proof points
    with blue-chip sponsors and cell-therapy manufacturing infrastructure. What it does not reveal is the private-file detail
    that actually determines investability at a specific price: current post-money valuation, liquidation preferences, cap-table
    stack, secondary marks, utilization, or a revenue-to-margin bridge. That gap matters because the business is capital intensive
    and still in construction / scale-up mode. The recommendation is therefore research-more, not because the company is weak,
    but because the current evidence does not support false precision. The pricing discipline should be simple: only pay a
    meaningful premium if private terms are near the lower end of the noisy mark range and if diligence closes the gaps around
    utilization, customer conversion, and future financing needs.'
  claimRefs:
  - CV001
  - CV003
  - CV006
  - CV012
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: scenario-brackets-and-comps
  title: Scenario brackets and comparables
  body: 'The most useful valuation lens is a scenario bracket, not a single-point estimate. In the bear case, Cellares stays
    closer to development-stage public biotech infrastructure multiples because capacity buildout outruns customer conversion.
    In the base case, the company earns a material premium for its industrial proof, sponsor relevance, and automation angle,
    but still trades below truly scaled commercial infrastructure names. In the bull case, repeated multi-site utilization
    and broader customer conversion start to justify a much larger enterprise value. The comparable set should therefore be
    mixed: public-market proxy marks, private secondary sources, and operating analogs that reflect industrial intensity rather
    than SaaS economics. That framing keeps the chapter anchored to what the public record actually supports instead of forcing
    a false software-style multiple onto a manufacturing platform.'
  claimRefs:
  - CV002
  - CV004
  - CV007
  - CV008
  - CV009
  - CV011
  tableRefs:
  - TV003
- id: exit-path-and-final-diligence
  title: Exit path and final diligence
  body: 'The exit path is still mostly private continuation, strategic partnership expansion, or a longer-dated public listing
    rather than an imminent liquidity event that can be priced confidently today. That does not make the company unattractive;
    it means the investor has to underwrite more operational proof before elevating the mark. The final diligence asks are
    practical and price-sensitive: the latest term sheet, the full cap table, any recent secondary or tender pricing, site-by-site
    utilization, backlog conversion, burn, and the expected capital bridge to commercial scale. The valuation call should
    move only if one of two things happens: either the disclosed price comes in below the noisy public mark cluster, or the
    company shows enough utilization and conversion to narrow the uncertainty band. Short of that, the right answer remains
    to track the company closely and wait for cleaner evidence.'
  claimRefs:
  - CV005
  - CV010
  - CV012
  tableRefs: []
