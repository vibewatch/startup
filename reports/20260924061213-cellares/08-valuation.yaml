- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Explicit assumptions
  - Valuation logic
  - Key risks
  - Decision implication
  rows:
  - - bear
    - Customer conversion slows, utilization remains hard to prove, and the company needs more capital before factory economics
      are visible.
    - Supportable range roughly $0.8B-$1.5B, closer to development-stage infrastructure / biotech proxy territory.
    - Financing dilution, slower commercialization, and price discipline collapsing under hype.
    - Only participate at a deep discount, if at all.
  - - base
    - Blue-chip proof remains intact, new conversion data appears, and operating clarity improves without eliminating capital
      intensity.
    - Supportable range roughly $1.5B-$3.0B, reflecting a premium for industrial proof but still not mature commercial scale.
    - The company is still opaque on margins and utilization, so the premium remains capped.
    - Continue diligence if the price sits in or below this band with strong terms.
  - - bull
    - Multiple sites and customers convert faster than expected, and the company starts to look like differentiated commercial
      infrastructure.
    - Supportable range roughly $3.0B-$5.0B, but only if the private evidence is much stronger than the public record.
    - Execution, regulatory, and concentration risk are still real.
    - Do not underwrite this band without unusually strong private diligence.
  notes: The ranges are guardrails, not point estimates.
