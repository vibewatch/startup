- id: architecture-apis
  title: Architecture, Open APIs, and the Developer Surface
  body: >
    Mews is a cloud-native application hosted on Microsoft Azure, built from the start as multi-tenant SaaS
    rather than retrofitted from on-premise software. The defining architectural choice is its open API
    surface: Mews exposes five public APIs — the general-purpose Connector API, the Channel Manager API,
    the Booking Engine API, the POS API, and the Loyalty Partner API — each documented on docs.mews.com,
    whose source lives in the public GitHub monorepo MewsSystems/open-api-docs and is published via GitBook.
    Authentication uses a ClientToken plus AccessToken model, and integrators get a demo/sandbox environment
    to prototype before going live. Real-time propagation is delivered through webhooks that push changes
    (reservations, spend, guest profiles, payments) to connected systems as soon as they occur, which is the
    technical basis for the "single data model" claim. The developer ecosystem is a genuine moat signal:
    Mews advertises 1,000+ marketplace integrations with no connection fees, and partners receive a Partner
    ID and must certify integrations before listing. Public developer-signal sources (the GitHub repo,
    APItracker's profile, and the Mews status page) confirm the API documentation, webhook management, and
    an operational status surface, though APItracker notes Mews does not expose some developer conveniences
    (no public GraphQL playground, OAuth playground, or open-source SDKs listed). Beyond "Azure cloud-native"
    and the API contract, deeper architecture — data residency, microservice topology, scaling design — is
    not publicly documented and is recorded as an evidence gap.
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  tableRefs:
  - TE003
  figureRefs:
  - FE001
  - FE003

- id: deployment-reliability-roadmap
  title: Deployment, Integrations, Reliability, and Roadmap
  body: >
    Mews deploys as a browser-based SaaS, so onboarding is a data-migration and configuration exercise
    rather than an install; the company emphasizes multi-property management "in a single call" through its
    APIs. Integration breadth is the deployment story: 1,000+ marketplace apps and the new native SiteMinder
    channel connection bring distribution, locks, and ancillary tools into one workflow. Reliability is
    surfaced publicly through status.mews.com, which reports component-level operational status for the
    Open API and other services; a recorded incident references a third-party dependency on Assa Abloy/Vostio
    for digital key creation, illustrating that Mews's reliability is partly a function of integration
    partners it does not control. The Mews trust center states a 24-hour Recovery Time Objective. The 2026
    roadmap is unusually dense: at Unfold 2026 (27 May 2026) Mews launched five new products, including
    Mews RMS, the SiteMinder Channel Manager, and Accounts Receivable, and the Flexkeeping housekeeping
    workflow builder is slated for advanced capabilities through 2026. The DataChat acquisition (November
    2025) feeds an agentic-AI roadmap where intelligent agents are intended to manage day-to-day operations.
    The roadmap table (TE005) separates shipped-and-dated releases from forward-looking capability claims.
    The central reliability and roadmap diligence question is execution risk: several flagship modules are
    months old, integration of two 2025 acquisitions is ongoing, and public reliability data (uptime history,
    SLA terms, RTO/RPO evidence) is thin relative to the breadth of the operational dependency hotels take on.
  claimRefs:
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  tableRefs:
  - TE005

- id: differentiation-trust-compliance
  title: Differentiation, Trust, Security, and Compliance
  body: >
    Mews's differentiation rests on three pillars: an open-API platform with a large no-fee integration
    marketplace, embedded payments that turn the PMS into a fintech surface, and an AI-native single data
    model that competitors built on legacy architecture struggle to match. The open API ("built in parallel,
    not bolted on") and webhook real-time data are the clearest technical differentiators versus legacy
    systems, while Mews Payments and Mews Spaces ($537M of ancillary revenue generated for hoteliers) are
    the economic moat. On trust and compliance, Mews publishes a SafeBase-hosted trust center asserting
    SOC 2, ISO 27001, PCI DSS, GDPR, CCPA, SOX, and NIST alignment; its help center documents PCI DSS
    compliance for card handling, and French NF525 anti-fraud certification supports POS deployments in
    France. The trust center states a 24-hour RTO and standard controls (two-factor authentication, DDoS
    and brute-force protections). The critical diligence caveat is that public sources confirm the existence
    of these certifications but not their current scope, type, or audit dates — for example, whether SOC 2
    is Type 2, the ISO 27001 revision (2022), the PCI DSS version (v4.0), and which entities and products
    each certificate covers. Mews's PayFac payment model, praised for convenience, is also a recurring
    adverse signal on cost and lock-in. The compliance table (TE004) records each control's status, scope,
    and the verification gap, and these unverified scopes are carried into evidenceGaps for commercial and
    security diligence.
  claimRefs:
  - CE032
  - CE033
  - CE034
  - CE035
