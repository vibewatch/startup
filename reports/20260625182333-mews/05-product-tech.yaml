  evidenceGaps:
  - type: missing-source
    severity: material
    topic: architecture
    missingEvidence: "Mews's published architecture details — microservice topology, data residency/regions, scaling design, and API rate limits/versioning policy."
    whyItMatters: "Without architecture documentation, reliability, data-sovereignty, and scalability cannot be independently underwritten beyond the 'Azure cloud-native' marketing claim."
    diligencePath: "Request an architecture brief and security whitepaper from Mews; review API versioning and rate-limit docs under NDA."
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: trust-compliance
    missingEvidence: "Current SOC 2 Type 2 report, ISO 27001:2022 certificate, and PCI DSS v4.0 Attestation of Compliance with scope and audit dates."
    whyItMatters: "Public sources confirm certifications exist but not their type, version, scope, or recency, which is essential for security and regulatory underwriting."
    diligencePath: "Request the SOC 2 Type 2 report, ISO certificate, and PCI AoC directly from Mews trust center under NDA; verify auditor and report period."
    relatedQuestionRefs:
    - QE015
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: "Published uptime SLA, RPO, historical uptime data, and disaster-recovery test evidence beyond the stated 24-hour RTO."
    whyItMatters: "Hotels concentrate full operational dependency on Mews; thin public reliability evidence makes the operational risk hard to quantify."
    diligencePath: "Request SLA terms, uptime history, and DR test results from Mews; review status.mews.com incident history over time."
    relatedQuestionRefs:
    - QE024
  - type: conflicting-data
    severity: minor
    topic: rms-validation
    missingEvidence: "Independent validation of the 13.7% RMS revenue-lift claim beyond Mews's own causal-inference study."
    whyItMatters: "The headline RMS benefit underpins upsell economics; a company-run study is not equivalent to third-party verification."
    diligencePath: "Request the underlying methodology and dataset; seek third-party or customer-reference validation of the revenue lift."
    relatedQuestionRefs:
    - QE022

