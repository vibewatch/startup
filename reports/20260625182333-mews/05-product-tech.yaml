callouts:
- calloutType: strength
  title: Open API and No-Fee Marketplace Are a Genuine, Verifiable Technical Moat
  body: >
    Unlike legacy PMS vendors, Mews exposes five public APIs (Connector, Channel Manager, Booking Engine,
    POS, Loyalty Partner) with documentation hosted on docs.mews.com and source-controlled in the public
    GitHub monorepo MewsSystems/open-api-docs, plus webhooks for real-time event propagation and a sandbox
    for safe prototyping. The 1,000+ integration marketplace with no connection fees is a structural
    advantage: it lowers switching friction for partners and compounds platform stickiness. This is one of
    the few Mews claims that is independently verifiable from developer-signal sources (GitHub, APItracker,
    the live status page), which materially de-risks the "open platform" narrative relative to competitors
    whose integrations are gated or fee-based.
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE020

- calloutType: risk
  title: Flagship 2026 Modules and Unverified Certification Scopes Are the Core Product Diligence Gaps
  body: >
    Three of Mews's most strategically important capabilities — Mews RMS, the SiteMinder-powered Channel
    Manager, and Accounts Receivable — all shipped on 27 May 2026, and two 2025 acquisitions (DataChat,
    Flexkeeping) are still integrating. Their headline benefits (a 13.7% revenue lift, 100% automated
    reconciliation) are company-stated and not independently audited, and reliability history is thin. In
    parallel, public sources confirm that Mews holds PCI DSS, SOC 2, ISO 27001, GDPR, and NF525
    certifications but not their current scope, type, version, or audit dates. A buyer should require the
    SOC 2 Type 2 report, ISO 27001:2022 certificate, PCI DSS v4.0 AoC, RMS validation methodology, and
    uptime/SLA evidence before underwriting the platform's reliability and compliance posture.
  claimRefs:
  - CE009
  - CE026
  - CE028
  - CE033
  - CE040

