company:
  name: Mews
chapter:
  number: 5
  title: Product and Technology
  summary: >
    Mews is a cloud-native hospitality operating system on Microsoft Azure that unifies PMS, RMS, POS,
    housekeeping, and embedded payments on a single data model. At Unfold 2026 (27 May 2026) Mews
    launched five new products, completing an AI-native stack and adding Mews RMS (150 million daily
    pricing calculations; a stated 13.7% lift in total revenue per square meter), a SiteMinder-powered
    Channel Manager connecting 400+ OTAs, and an Accounts Receivable invoice-to-cash module. The platform
    exposes five open APIs (Connector, Channel Manager, Booking Engine, POS, Loyalty Partner) documented
    publicly on GitHub and docs.mews.com, with webhooks, a sandbox, and a 1,000+ integration marketplace
    with no connection fees. Security posture is strong on paper — PCI DSS, SOC 2, ISO 27001:2022, GDPR,
    and a 24-hour RTO — but most certification scopes, audit dates, and the architecture beyond
    "Azure cloud-native" are not independently verifiable from public sources, and 2025 acquisitions
    (DataChat, Flexkeeping) add integration risk. These opacities are recorded as evidence gaps.
sections:
- id: product-definition
  title: What Mews Delivers in Customer Workflow Terms
  body: >
    Mews is a cloud-native hospitality operating system: a single platform that replaces the eight-to-ten
    disconnected vendors a typical hotel runs (PMS for reservations, RMS for pricing, channel manager for
    distribution, a separate inbox, kiosk, POS, and receivables tool). In customer-workflow terms, Mews
    spans the full guest lifecycle — booking through the Mews Booking Engine, pre-arrival personalization
    and upsells, self-check-in via Mews Kiosk, in-stay operations (housekeeping, messaging, POS for food
    and beverage), embedded payments at every touchpoint, and post-stay receivables and accounting.
    Its core promise is that "every team works from the same platform" on one data model, so a rate change,
    a reservation edit, or a payment posts once and propagates everywhere without manual reconciliation.
    Mews markets the platform to modern, independent, and group hotels and to "shared spaces" operators,
    and cites a 476% three-year ROI from IDC research and 15,000 customers across 85 countries. The
    practical buyer benefit is consolidation: fewer vendors, one contract and bill, and automation of the
    repetitive reconciliation work that fragments a hotel's day. The limitation is that consolidation
    concentrates operational dependency on a single vendor and on Mews Payments, which several reviewers
    describe as convenient but not cheap. This chapter separates what is verifiably delivered today from
    roadmap and marketing claims.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  tableRefs:
  - TE002
  figureRefs:
  - FE002

- id: module-map
  title: Module and Product-Line Map
  body: >
    The Mews platform decomposes into a set of modules that span the guest journey and the back office.
    The reservation and operations core is the Mews PMS, the anchor product that won Best PMS at the
    HotelTechAwards in 2024, 2025, and 2026. Distribution runs through the Mews Booking Engine (direct
    bookings) and, since Unfold 2026, a Channel Manager "powered by SiteMinder" that connects 400+ OTAs
    natively. Revenue optimization is handled by Mews RMS, an AI-native module launched 27 May 2026 that
    runs 150 million pricing calculations a day. Operations modules include Mews Kiosk for self-check-in,
    a POS for food and beverage, Housekeeping (expanded via the 2025 Flexkeeping acquisition), guest
    messaging, and an Accounts Receivable module for B2B invoice-to-cash. Monetization runs through Mews
    Payments, an embedded payment-facilitator layer, and Mews Spaces for ancillary, non-room revenue. AI
    and analytics capability was reinforced by the November 2025 DataChat acquisition, which adds a
    conversational-intelligence and semantic layer aimed at agentic operations. Each module is scored for
    maturity, target user, differentiation, and the diligence gap that remains in the module matrix
    (Table TE001) and the maturity map (Figure FE004). The recurring diligence theme is that several
    flagship modules (RMS, Accounts Receivable, the SiteMinder channel manager) are very new — launched or
    materially upgraded in 2026 — so their reliability and adoption are not yet independently established.
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
