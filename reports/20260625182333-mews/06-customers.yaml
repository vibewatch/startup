  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: named-proof
    missingEvidence: "Independent, non-Mews-published customer references and adverse references beyond the self-selected case studies in the named-proof table."
    whyItMatters: "All detailed outcomes in the named-proof table are Mews-published and self-selected, so they may overstate satisfaction; independent and adverse references are needed to balance the sample."
    diligencePath: "Conduct blind customer reference calls across segments and request churned-customer references; cross-check against independent review platforms."
    relatedTableRefs:
    - TU003
    relatedQuestionRefs:
    - QU020
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: "Mews's net revenue retention, gross retention, churn, renewal rate, and contract-length data by cohort."
    whyItMatters: "Retention is the single most important durability metric for a subscription business; without it, durability rests on review sentiment and self-selected expansion anecdotes."
    diligencePath: "Request NRR/GRR and logo/revenue churn by segment and cohort from Mews; corroborate via customer reference calls."
    relatedQuestionRefs:
    - QU013
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: "Top-customer and segment revenue concentration (revenue share of top 10/20 customers and of the largest groups such as Strawberry)."
    whyItMatters: "Undisclosed concentration leaves the dependence on a few large groups and on European cohorts unquantified, which is central to revenue-durability risk."
    diligencePath: "Request a customer concentration schedule and regional revenue split from Mews management."
    relatedQuestionRefs:
    - QU018
  - type: missing-source
    severity: material
    topic: payments-lock-in
    missingEvidence: "Quantified payments attach rate, switching cost, and the share of transaction volume routed through Mews Payments across the base."
    whyItMatters: "Payment lock-in is the most recurring adverse signal and a major expansion/concentration risk; CityHub's 80% figure is a single account, not a base-wide metric."
    diligencePath: "Request payments attach and volume-share data by segment; review merchant agreement switching terms."
    relatedQuestionRefs:
    - QU017
    - QU022
  - type: conflicting-data
    severity: minor
    topic: geographic-cohorts
    missingEvidence: "Comparative retention and growth between European and North American customer cohorts."
    whyItMatters: "The North American expansion is a key growth driver; without cohort comparison, its durability versus the mature European base is unknown."
    diligencePath: "Request regional cohort retention and net-adds from management; monitor NAHA-partnership traction over time."
    relatedQuestionRefs:
    - QU025

