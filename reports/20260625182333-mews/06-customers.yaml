callouts:
- calloutType: strength
  title: Recent, Quantified, Production References Across Segments Validate Real Adoption
  body: >
    Mews's customer proof is unusually strong for a private company: Strawberry brought four 400-600 room
    hotels live in a single day and runs 225+ hotels on the platform; Ash Hotels cites ~$15K annual OTA
    savings and portfolio-wide standardization; CityHub automates 80% of transactions through Mews Payments
    via a custom Open API build; Amistat went live in two days. These are production deployments with
    quantified outcomes, not pilots, and they are corroborated by three-years-running Best PMS recognition
    (2024-2026) built on roughly 4,500 verified hotelier reviews and 4.5-4.6 scores across Capterra, Software
    Advice, and G2. Combined with 132,000+ monthly active hoteliers and 42.3M reservations, the evidence of
    real, broad, multi-property adoption is high-quality.
  claimRefs:
  - CU010
  - CU015
  - CU016
  - CU022

- calloutType: risk
  title: No Disclosed Retention Metrics and Recurring Payment Lock-In Are the Core Durability Risks
  body: >
    Despite strong satisfaction signals, Mews discloses no net revenue retention, gross retention, churn, or
    renewal data — the single most important durability metric for a subscription business is absent, leaving
    durability inferred only from expansion anecdotes. In parallel, adverse signals recur across independent
    platforms: a payment lock-in where flows are optimized for Mews Payments and switching is costly
    (CityHub routes 80% of transactions through it), a lower support sub-score (Software Advice 4.3) and
    smaller-property support complaints, cost creep when add-ons are stacked, and limited enterprise
    customization for buyers without in-house tech resources. Geographic concentration in Europe adds a
    further risk to the North American growth thesis. A buyer should require NRR/GRR by cohort, payments
    attach and switching economics, and top-customer revenue concentration before underwriting durability.
  claimRefs:
  - CU026
  - CU028
  - CU031
  - CU032

