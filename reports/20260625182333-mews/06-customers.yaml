company:
  name: Mews
chapter:
  number: 6
  title: Customers
  summary: >
    Mews serves 15,000 customers across 85 countries with 132,000+ monthly active hoteliers, spanning
    independent boutique hotels, lifestyle and design brands (citizenM, Mama Shelter, 25hours, Ace Hotel,
    The Social Hub), hostels (Generator, Freehand, Amistat, the 2026 North American Hostel Association
    partnership), large groups (Strawberry/formerly Nordic Choice, 225+ hotels), apartments, and resorts.
    Named customer proof is strong and recent: Strawberry brought four 400-600 room hotels live in a single
    day, Amistat went live in two days, Ash Hotels cites ~$15K annual OTA savings, and CityHub automates
    80% of transactions through Mews Payments. Satisfaction is high and externally validated — Best PMS at
    the HotelTechAwards three years running (2024-2026), Capterra 4.6, Software Advice 4.6, G2 4.5 — and
    platform engagement shows real adoption (42.3M reservations, $19.7B transaction volume, $537M ancillary
    revenue via Mews Spaces in 2025). The durability case is incomplete: Mews discloses no NRR, GRR, churn,
    or cohort retention data, so renewal economics rest on review sentiment and expansion anecdotes.
    Adverse signals — payment lock-in, slower support for smaller properties, cost creep with add-ons, and
    limited enterprise customization without in-house tech resources — recur across review platforms and are
    the main concentration and durability risks, alongside heavy European geographic concentration.
sections:
- id: segmentation
  title: Who Pays and Who Uses Mews — Segmentation
  body: >
    Mews sells to hotels and "shared spaces" operators and is used by front-desk, revenue, housekeeping,
    finance, and operations staff, with the GM or owner typically the economic buyer. The base of 15,000
    customers across 85 countries breaks into several segments. The largest by count is independent and
    boutique hotels (roughly 30-300 rooms), where Mews's modern UX and integrations are the strongest fit.
    A high-profile lifestyle and design-brand segment includes citizenM, Mama Shelter, 25hours Hotels, Ace
    Hotel, and The Social Hub, which give Mews marquee logo proof even where detailed case studies are not
    public. A fast-growing hostel segment includes Generator, Freehand, Amistat, and — via a 2026 North
    American Hostel Association partnership — brands such as Samesun, reflecting deliberate expansion into
    flexible bed-and-room selling. Mews also serves multi-property groups and chains (Strawberry, formerly
    Nordic Choice Hotels, with 225+ hotels), apartments and long-stay (Strawberry Living, Residenzhotel
    Stuttgart), and resorts. Geographically the base is European-weighted with an explicit North American
    push (Ash Hotels, the NAHA partnership). The platform reports 132,000+ monthly active hoteliers, a user
    metric that indicates daily operational reliance rather than seat licenses. The segmentation table
    (TU001) and customer journey figure (FU001) detail buyer, user, and example accounts per segment; the
    key diligence limitation is that Mews does not publish revenue or customer counts by segment, so the
    revenue concentration across these segments cannot be measured from public data.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001

- id: adoption-trajectory
  title: Adoption Trajectory and Platform Engagement
  body: >
    Mews's adoption story is one of sustained scaling: the customer base has grown from roughly 5,000
    properties in earlier years to 15,000 across 85 countries, and the platform now reports 132,000+ monthly
    active hoteliers. Engagement metrics disclosed in the January 2026 Series D announcement show genuine
    production usage rather than shelfware: 42.3 million checked-in reservations in 2025 (3.2 million via
    Mews Kiosk), $19.7 billion in platform transaction volume, and $537 million in ancillary revenue
    generated for hoteliers through Mews Spaces. Deployment velocity is a distinctive adoption signal —
    Strawberry brought four 400-600 room hotels live on a single day while fully booked, can set up
    additional properties in as little as two weeks, and added 30 rooms to one property's PMS in minutes
    after renovation; Amistat went live after just two days of training. These data points triangulate to a
    picture of broad, active, multi-property deployment. Award momentum reinforces the trajectory: Best PMS
    at the HotelTechAwards in 2024, 2025, and 2026, a feat HotelTechReport's co-founder called "exceptionally
    difficult" given the category's competitiveness. The adoption table (TU002) and deployment flow (FU002)
    structure these metrics. The principal gap is that Mews discloses aggregate engagement but not net adds,
    gross churn, or segment-level growth, so the rate and durability of new-logo acquisition versus expansion
    within existing accounts cannot be separated from public sources.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU002

- id: named-proof
  title: Named Customer Proof and Reference Quality
  body: >
    Mews publishes over 100 customer success stories, and several are detailed, recent, production-grade
    references rather than logos. Strawberry (formerly Nordic Choice Hotels, 225+ hotels, 18,000 employees)
    is the flagship enterprise reference: it cut staff training from up to four days to mostly digital
    learning, runs centralized dynamic pricing across all hotels, shares guest history across properties,
    uses up to 21 integrations per property, and reports a chargeback rate well below the industry average.
    Ash Hotels (US) frames Mews as a commercial reset, citing an estimated $15K annual OTA savings and
    portfolio-wide standardization that made onboarding repeatable by the time its Ulysses hotel went live.
    CityHub built an RFID-wristband payment and room-key experience on the Mews Open API and automates 80%
    of property transactions through Mews Payments. Amistat Hostels and Big Mama Hotels provide mid-market
    and rapid-expansion proof. Marquee lifestyle brands (citizenM, Mama Shelter, 25hours, Ace Hotel, The
    Social Hub, Accor) appear as named customers but with thinner public outcome detail, so their reference
    quality is logo-level rather than case-study-grade. The named-proof table (TU003) and proof matrix
    (FU003) score each reference on production status, quantified outcome, and freshness. Reference quality
    is genuinely strong for mid-market and group hotels; the diligence caveat is that nearly all detailed
    outcomes are Mews-published and self-selected, so independent or adverse references should be sought in
    commercial diligence.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  tableRefs:
  - TU003
  figureRefs:
  - FU003

- id: retention-satisfaction
  title: Retention, Satisfaction, and Durability Signals
  body: >
    Durability evidence for Mews is strong on satisfaction but thin on hard retention metrics. On
    satisfaction, Mews is externally validated across the major independent review platforms: Best PMS at
    the HotelTechAwards three years running (2024-2026) on the strength of verified hotelier reviews,
    Capterra 4.6/5, Software Advice 4.6/5 (ease of use 4.7, value 4.5, customer support 4.3), and G2 4.5/5,
    with HotelTechReport aggregating roughly 4,500 reviews. Reviewers consistently praise the modern UX, fast
    training, automation (online check-in/out, kiosk, real-time updates), and the 1,000+ integration
    marketplace. Land-and-expand behaviour is visible in references — Strawberry, Ash Hotels, and Crown Group
    (six London properties) all grew property counts on Mews — which is a proxy for retention and account
    expansion. However, Mews discloses no net revenue retention, gross retention, churn, renewal rate, or
    contract-length data, so the single most important durability metric for a subscription business is
    absent. Adverse durability signals are real and recurring: Software Advice's 4.3 support score and
    Capterra reviews flag slower or less proactive support for smaller properties, hoteltechinsight notes
    cost creep when many add-ons are stacked, and Trustpilot carries critical reviews on payments and
    support. The satisfaction table (TU004) and review-score figure (FU004) summarize these signals;
    the absence of disclosed retention metrics is carried into evidenceGaps as a material durability gap.
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU004
  figureRefs:
  - FU004

- id: expansion-concentration
  title: Expansion, Concentration, and Procurement Risk
  body: >
    Mews's expansion motion is land-and-expand within multi-property groups: a hotel adopts Mews, then
    standardizes users, rates, and central administration across its portfolio (Strawberry across 225+
    hotels, Ash Hotels across its growing portfolio, Crown Group across six London properties), and layers on
    modules (RMS, Payments, Spaces, Channel Manager) that raise account value over time. Mews Payments is the
    most important expansion lever and the most important concentration risk: it powers a large share of
    transaction volume (CityHub automates 80% of transactions through it), but reviewers describe a
    payment lock-in where flows are optimized for Mews Payments and dual-processing or switching is
    cumbersome and costly. Geographic concentration is a second risk — the base is European-weighted despite
    the 85-country footprint, so the North American expansion (NAHA, Ash) is both an opportunity and an
    execution dependency. Procurement friction historically favored incumbents because PMS migration is
    feared as slow and risky, but Mews has turned fast onboarding (two days for Amistat, two weeks per
    Strawberry property) into a competitive wedge that lowers switching friction. Channel and partner
    dependence is rising with the SiteMinder distribution partnership and the 1,000+ integration marketplace,
    which improves stickiness but inherits partner reliability. The expansion/concentration table (TU005)
    rates each factor. The core concentration-risk diligence asks are payments lock-in economics, top-customer
    and segment revenue concentration (undisclosed), and the durability of European versus North American
    cohorts.
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  tableRefs:
  - TU005

