callouts:
- calloutType: recommendation
  title: Conditional PROCEED — Strong Asset, Stretched Price, Confidence Gated on Financial Disclosure
  body: >
    The recommendation is a conditional PROCEED to deeper diligence, not an endorsement of the USD 2.5B entry
    price. Mews is a genuinely strong asset — a vertical SaaS with an embedded-payments moat (USD 19.7B volume,
    USD 537M of Spaces ancillary revenue), category-leading product, and 55% SaaS gross-profit growth — and
    that profile is exactly what the 2026 market rewards with premium multiples. But the implied ~10-15x
    revenue multiple sits well above private-SaaS (~4.2x) and even vertical-SaaS-with-payments (~5.8-8.5x)
    norms, so the price is defensible only on a forward, AI-native, 30%+-growth thesis that public sources
    support directionally but cannot confirm. Confidence is therefore medium and explicitly gated on obtaining
    ARR, margin, NRR, the cap table/preference stack, and certification evidence. A disciplined buyer treats
    the headline number as a ceiling, negotiates from the comparable-implied range, and is prepared to walk if
    the disclosures reveal sub-100% NRR, thin payments margin, or a heavy preference overhang.
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV022

- calloutType: risk
  title: The Valuation Embeds Little Margin of Safety and the Downside Is Unquantifiable from Public Sources
  body: >
    The core valuation risk is the combination of a rich entry and pervasive opacity. At ~10-15x inferred
    revenue, Mews is priced for years of flawless execution, yet a buyer cannot test the multiple because ARR,
    gross margin, net revenue retention, and the payments take-rate are all undisclosed, and the preference
    stack from prior rounds is not public. If growth normalizes or payment-lock-in churn rises as customers
    unbundle toward best-of-breed stacks — a documented 2026 trend — the multiple could compress to
    vertical-SaaS norms (~6-8x) and pull the valuation back toward its 2024 USD 1.2B level, a 30-50% loss from
    entry. Because the bear case cannot be ruled out on public evidence, the position should be sized for the
    downside and conditioned on the financial disclosures in the final diligence asks table before any capital
    is committed at the headline price.
  claimRefs:
  - CV012
  - CV018
  - CV025
  - CV030

