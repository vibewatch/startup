      material product launches.
    whyItMatters: >-
      Public sources capture the major chronology but likely miss smaller operating and governance milestones relevant
      to later diligence.
    diligencePath: Request the company timeline used for board or investor updates and reconcile it against public disclosures.
    relatedQuestionRefs:
      - QO015
      - QO025
    relatedTableRefs:
      - TO004
