company:
  name: Mews
chapter:
  number: 3
  title: Competitors
  summary: >
    Mews competes in a fragmented hospitality technology market dominated by Oracle Hospitality OPERA Cloud
    at the enterprise end and Cloudbeds in the SMB segment, with API-first challenger Apaleo targeting
    tech-forward properties and Shiji Group owning the China/Asia incumbent position. Mews's unified
    OS positioning and payments integration create meaningful switching costs once embedded, but its moat
    is strongest in the 50–300-room independent and boutique segment. The primary displacement risk comes
    from Oracle's 31% year-over-year growth on OPERA Cloud and a NYU 2026 study finding that all-in-one
    users are switching to best-in-class at twice the rate of the reverse — a structural headwind Mews
    must address as it expands upmarket.
sections:
- id: competitive-landscape
  title: Competitive Landscape and Taxonomy
  body: >
    The hospitality PMS and operating-system market contains five meaningful competitive categories relevant
    to Mews. First, enterprise incumbents — primarily Oracle Hospitality OPERA Cloud and Shiji Group —
    serve large chains with deep feature sets, proprietary integration ecosystems, and decades of brand
    trust, but are slower to innovate on UX and automation. Second, all-in-one SMB champions, led by
    Cloudbeds (27,000 properties, 150+ countries), serve the independent and sub-100-room market with
    simpler, lower-cost suites. Third, API-first pure-play vendors like Apaleo (1,700+ properties) target
    technology-forward operators who want modular best-of-breed composability rather than a unified platform.
    Fourth, regional or niche players (HOTELTIME, StayNTouch, RoomRaccoon, Maestro) serve specific
    geographies or property types. Fifth, the status-quo alternative — legacy on-premise PMS from Protel,
    Amadeus, and older Oracle on-premise installations — still holds roughly 35% of the global install base
    and represents Mews's primary organic displacement opportunity. Likely new entrants in the 2026–2028
    window include general AI orchestration platforms (e.g., Salesforce AI Cloud) that could embed hotel
    workflow automation on top of existing industry-specific CRM relationships, and travel OTA giants
    (Booking.com, Expedia) that may build operational tools to deepen their hotel relationships.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  tableRefs:
  - TP001
  figureRefs:
  - FP001

- id: competitor-profiles
  title: Key Competitor Profiles — Scale, Funding, and Strategy
  body: >
    Oracle Hospitality OPERA Cloud is the single largest competitor in terms of enterprise market presence.
    OPERA Cloud has seen more than 31% year-over-year growth in properties using the platform, with 3,500
    properties now on OPERA Cloud Central and 20 new hotel chains added in the most recent fiscal year.
    Wyndham Hotels & Resorts runs more than 2,100 of its properties on OPERA Cloud, and Motel One migrated
    its entire 100+ property portfolio in 2026. Oracle's integration partner network (OHIP) now exceeds
    1,200 active partners with 650+ live on the Oracle Cloud Marketplace. Oracle added AI-driven guest
    merchandising in FY25, which generated $300M in upsell demand and increased upsell revenue by 20% at
    check-in. Cloudbeds occupies the opposite end: it serves 27,000+ properties in 150+ countries, having
    raised approximately $248M with SoftBank Vision Fund as lead Series D investor. Estimated 2026 revenue
    approaches $291M. Apaleo, the API-first German challenger, raised €20M ($22.8M) Series B in November
    2024, now powers 1,700+ properties with around 75 employees, and counts citizenM, easyHotel, and
    Limehome as reference customers — properties demonstrating extreme automation efficiency (Limehome saves
    £150-200/unit/month through staffless operation). Shiji Group is publicly listed, has received over
    $459M in investment including from Alibaba, and dominates the China/Asia tier-one hotel market with
    1,285 employees.
  claimRefs:
  - CP007
  - CP008
  - CP009
  - CP010
  - CP011
  - CP012
