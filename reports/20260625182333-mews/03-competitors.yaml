callouts:
- calloutType: risk
  title: All-in-One Structural Headwind Could Erode Mews's Mid-Market Moat
  body: >
    The NYU Tisch Center 2026 study found all-in-one PMS users switching to best-in-class at 30% intent
    rate, more than double the 14% reverse migration. This structural finding is directly adverse to Mews's
    unified operating-system positioning. Additionally, all-in-one users report more booking errors (57%
    vs 45%) and check-in delays (46% vs 23%), which are operational metrics hoteliers directly observe.
    Mews must either demonstrate its unified model avoids these failure modes through better data architecture
    or invest in a credible best-of-breed narrative for enterprise buyers — otherwise its net retention
    among 101–250 room properties may underperform best-in-class stack vendors over the 2026–2028 period.
  claimRefs:
  - CP033
  - CP034
  - CP035

- calloutType: strength
  title: Mews Payments Integration Creates Durable Payment Lock-In Moat
  body: >
    Mews Payments, deeply embedded in the platform with no third-party payment processor fees, creates a
    dual-layer retention mechanism: the financial economics (estimated 5% cost savings vs. third-party
    processors, per Oracle's own data on a comparable model) and the operational integration depth (payment
    data, reconciliation, AR, invoicing all co-located in one system). Any switching decision requires
    simultaneous migration of payment contracts, historical transaction data, and reconciliation workflows.
    This pattern is analogous to Shopify Payments for e-commerce vendors — an initially optional add-on
    that becomes the stickiest layer of a platform once adopted.
  claimRefs:
  - CP026
  - CP027
  - CP030
  - CP031

