- id: switching-costs-and-lock-in
  title: Switching Costs, Platform Stickiness, and Multi-Homing
  body: >
    Mews has deliberately invested in reducing inbound switching friction — the company publicized its
    ability to complete onboarding in as little as one week using templates and guided setup, with
    documented multi-property deployments at scale (40 properties across 10 countries in 90 days).
    This reduces the adoption barrier versus legacy incumbents, which is positive for Mews's win rate
    against Oracle. However, once installed, Mews's platform creates meaningful outbound switching costs.
    The primary lock-in vector is Mews Payments: deeply integrated payment processing means that switching
    to a different PMS requires migrating payment data, contract structures, and reconciliation workflows
    simultaneously. Reviewers on Software Advice and G2 explicitly flag payment lock-in as a concern.
    The second vector is marketplace integration debt: properties that build 10–20 integrations on top of
    Mews's 1,000+ app marketplace accumulate configuration, workflow, and data-flow dependencies that are
    expensive to replicate on a competing platform. Multi-homing is uncommon — hotels rarely run two PMS
    platforms simultaneously, so vendor selection is winner-take-all per property. Distribution power
    is primarily channel-manager reach (Mews + SiteMinder now covers 400+ OTAs), with indirect distribution
    through hotel management company relationships (Mews has partnerships with major hotel management groups).
    Competitor Oracle relies on its deeper chain relationships and proprietary loyalty/CRS integration
    as countervailing lock-in forces for its segment.
  claimRefs:
  - CP025
  - CP026
  - CP027
  - CP028
  - CP029
  - CP030
  - CP031

- id: moat-durability-and-risk
  title: Moat Durability, Commoditization Risk, and Adverse Evidence
  body: >
    Mews's strongest moat is the combination of integrated payments, open-API marketplace gravity, and
    modern UX in the 50–300-room boutique/independent category, where competitors either lack the
    integrations (Cloudbeds) or are too expensive and complex (Oracle). However, three structural risks
    challenge moat durability. First, the NYU Tisch 2026 academic study found that all-in-one PMS users
    (Mews's positioning) are switching to best-in-class stacks at 30% intent rate versus 14% reverse,
    and report higher booking errors (57% vs 45%) and more check-in delays (46% vs 23%). This is
    adverse evidence that Mews's unified approach may lose customers at scale as properties grow. Second,
    Oracle is actively migrating its legacy on-premise install base to OPERA Cloud (31% YoY growth) and
    adding AI capabilities, which reduces Mews's differentiation in the enterprise segment over a 2–4 year
    horizon. Third, Apaleo's MACH architecture (microservices, API-first, cloud-native, headless) is
    theoretically more future-proof than even Mews's unified model, creating a risk that Mews's
    "one platform" positioning eventually ages into another form of lock-in complaint. The HotelMinder
    2026 best PMS ranking and HotelTechInsight review both confirm Mews is highly rated, but the reviews
    also surface a recurring complaint: mandatory payment integration and limited export flexibility.
  claimRefs:
  - CP032
  - CP033
  - CP034
  - CP035
  - CP036
  - CP037
