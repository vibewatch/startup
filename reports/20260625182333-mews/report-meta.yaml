companyProfile:
  summary: >
    Mews, headquartered in Amsterdam and incorporated in the UK (Mews Systems Ltd, company no.
    10355686), is a cloud-native hospitality technology company that builds and sells what it calls
    the operating system for hospitality. Founded in Prague in 2012 by Richard Valtr — a former
    hotelier frustrated by manual night-audit routines — the company set out to replace the
    fragmented stack of 8-10 separate systems that most hotels run (PMS, RMS, POS, channel manager,
    guest messaging, BI, payments, housekeeping) with a single unified, AI-native platform.
    As of January 2026, Mews serves 15,000 hotel properties across 85 countries, employs 1,300+
    people, and processes $19.7 billion in annual platform transaction volume. Its January 2026
    Series D of $300M at a $2.5B valuation — the largest single hospitality software round on record
    — was led by EQT Growth with participation from Atomico, HarbourVest, Kinnevik, Battery Ventures,
    and Tiger Global.
  foundedDate: '2012-01-01'
  founders:
  - name: "Richard Valtr"
    role: "Founder"
    background: "Hotelier who opened a hotel in Prague and built Mews to solve front-desk automation problems he experienced first-hand."
    claimRefs:
    - CO001
  - name: "Matthijs Welle"
    role: "CEO"
    background: "Hotel operations veteran who joined Mews early and has led the company as CEO through its growth from startup to $2.5B valuation."
    claimRefs:
    - CO002
  foundingLocation: "Prague, Czech Republic"
  headquarters: "Amsterdam, Netherlands"
  productSummary: >
    Mews Hospitality Cloud is a unified SaaS platform covering: (1) core PMS for reservations,
    folio management, and check-in/check-out; (2) Mews Payments — a PayFac-model embedded payment
    layer processing hotel transactions; (3) Mews RMS — an AI-driven revenue management system
    executing 150 million daily pricing calculations, launched May 2026; (4) Mews POS for food
    and beverage; (5) a guest messaging hub integrating WhatsApp, SMS, email, and OTA channels;
    (6) a channel manager powered by SiteMinder covering 400+ OTAs; (7) Mews BI for analytics and
    reporting; (8) Flexkeeping — a housekeeping and operations automation tool acquired in 2025;
    and (9) a 1,000+ app open-API marketplace with no integration fees. The platform runs on
    Microsoft Azure, carries PCI DSS v4.0, SOC 2 Type 2, ISO/IEC 27001:2022, and GDPR certifications,
    and supports 5 core APIs (Connector, Channel Manager, Booking Engine, POS, and Loyalty).
  customerFocus: >
    Independent and boutique hotels (50–300 rooms), lifestyle and design-led properties, and
    mid-scale hotel groups seeking to replace legacy on-premise PMS (Oracle Opera, Protel) with
    a modern cloud-native stack. Mews increasingly targets mid-scale chains (2–50 properties)
    as a secondary segment. Large enterprise chains remain a future expansion opportunity.
  businessModel: >
    Three revenue streams: (1) SaaS subscription fees (~€9/room/month for mid-tier), (2) payment
    processing spread as a PayFac on hotel transaction volume via Adyen/Stripe backend, and (3)
    add-on module fees for RMS, POS, and BI. A fourth nascent stream is revenue from non-room
    ancillary bookings via Mews Spaces.
  stage: "Series D"
  fundingStatus: >
    $300M Series D at $2.5B valuation (January 2026, led by EQT Growth). Total lifetime equity
    raised exceeds $600M across seed, Series A, B, C ($185M), Series C extension ($110M at $1.2B,
    March 2024), and Series D. Active credit facility with an undisclosed debt provider (Companies
    House charge registration MR01, September 2024).
