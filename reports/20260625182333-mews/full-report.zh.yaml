  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Mews 的投资论点是：它正在成为酒店业新一代品类定义型操作系统——一个 AI 原生云平台，整合酒店软件栈并嵌入支付，同时从软件和交易量变现。支撑证据一致：覆盖 85 个国家的 15,000
              家物业、132,000 名月活酒店从业者、2025 年平台支付量 USD 19.7B、SaaS 毛利润增长 55%、连续获得「Best PMS」、开放 API marketplace，以及通过 Mews
              Spaces 为酒店经营者创造 USD 537M 附加收入——这是有形的网络效应和护城河信号。支付层把 Mews 从纯 SaaS 变成带嵌入式金融科技的垂直 SaaS，正是 2026
              年市场给最高倍数的原型。反论点同样具体。第一，入场价格（约 10-15x 收入）已经折现多年无瑕执行，安全边际很小。第二，财务不透明——没有披露 ARR、利润率或
              NRR——意味着论点无法独立验证。第三，结构性逆风（Oracle 的既有优势、2026 年有文档记录的 best-of-breed stacks 转向、支付锁定投诉）威胁整合叙事，并可能压缩留存。推荐逻辑（图
              FV001）展示证据如何落到有条件推进；论点 / 反论点表（表 TV002）把市场、产品、客户、财务、竞争和风险两侧并列。
