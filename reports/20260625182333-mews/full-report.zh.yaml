      - number: '4.2'
        title: 单位经济、毛利率与销售效率
        blocks:
          - type: paragraph
            body: >
              唯一披露的财务指标是「SaaS 毛利润同比增长 55%」——这是增长率，不是绝对值。若 SaaS ARR 处于 $90–$120M 区间，并假设行业标准 SaaS 毛利率为 71–75%（按多个分析来源的
              2026 年 SaaS 基准数据），Mews 的 SaaS 毛利润将处于 $64–$90M 区间。支付收入流中，PayFac 扣除 Adyen/Stripe 成本后的典型毛利率为 10–25%；在
              $60–$100M 总支付收入上，意味着约 $6–$25M 支付毛利润。合并隐含毛利润为 $70–$115M。$2.5B 估值对应 22–36x 毛利润倍数，符合带嵌入式支付的高增长垂直 SaaS
              溢价。销售效率方面，Mews 不披露 CAC 或回本周期。公司提到过 90 天部署 10 个国家 40 家物业的多物业案例，说明相对传统 PMS，实施经济性改善。按这一阶段 B2B SaaS
              行业基准，精英执行者的 CAC 回本期为 12–18 个月。净收入留存（NRR）未披露；B2B SaaS 中位 NRR 为 110%+，带嵌入式支付的一线垂直 SaaS 往往达到 120%+。没有实际
              NRR，就很难有把握地承销收入增长路径。
