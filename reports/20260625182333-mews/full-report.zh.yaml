      - number: '8.5'
        title: 可比公司组与倍数三角定位
        blocks:
          - type: paragraph
            body: >
              Mews 的估值最适合用三组参照交叉定位。第一组是酒店 SaaS peers：Cloudbeds（约 27,000 家物业，估计 USD 291M 收入，私营且最后定价在 2021
              年）、SiteMinder（估计 USD 229.8M 收入，ASX 上市）、Oracle Hospitality / OPERA Cloud（Oracle 内估计 USD 228.6M 收入），以及
              Guesty（估计 USD 164.6M 收入，约 USD 900M 估值）。相较这些公司，Mews 的 USD 2.5B 价格隐含收入倍数明显更高，反映其增长、支付附加和 AI 定位。第二组是 SaaS
              倍数基准：2026 年私营 SaaS 交易的 ARR 中位数约 4.2x（前四分位 7-10x），因此 Mews 隐含约 10-15x 明显高于总体市场。第三组是带嵌入式支付的垂直 SaaS
              基准，这是最贴切的比较：2026 年垂直 SaaS 相对横向 SaaS 有 41% 溢价，医疗 IT 为 8.5x，建筑为 7.5x，法律为 7.0x
              收入——这些软件「拥有一个行业的工作流和支付轨道」。即便按该区间顶部（约 8.5x），USD 2.5B 估值也需要约 USD 290M+ 收入，高于 USD 200-250M 估算，说明 Mews
              按未来增长定价，而不是按当前收入定价。可比估值表（表 TV004）列出 peer set；结论是，价格只能在前瞻、AI 原生、支付驱动论点上辩护，不能靠 trailing comparables 支撑。
