      - number: '8.2'
        title: 建议、信心与风险评级
        blocks:
          - type: paragraph
            body: >
              建议是有条件地 PROCEED 到更深尽调，而不是认可 USD 2.5B
              入场价格。信心为中等：定性证据（产品领先、支付护城河、增长节奏）强且交叉印证充分；但承销价格所需的量化证据（ARR、毛利率、净收入留存、流失、支付
              take-rate）未披露，压住了信心上限。风险评级为中高，由估值不透明、监管 / 网络安全暴露（第 7 章）和支付集中风险驱动。估值立场是 STRETCHED-BUT-DEFENSIBLE：隐含约 10-15x
              倍数高于私营 SaaS 和垂直 SaaS 常模，只有在 AI 原生、嵌入式支付、30%+ 增长叙事下才成立；公开来源方向上支持该叙事，但不能确认。可支撑的目标回报因此取决于入场纪律：按 USD 2.5B
              头部价格，买方承销的是重评到 USD 4-5B IPO 的上行；基准情形大致保值，熊市情形损失 30-50%。建议明确以取得最终尽调问题（表
              TV006）列出的财务披露为条件；若拿不到这些披露，价格无法由证据支撑，头寸应按下行风险控制。建议摘要（表 TV001）记录判断、信心、风险评级、估值立场，以及图 FV004 可视化的关键投资 KPI。
