chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、创立故事与产品边界
        blocks:
          - type: paragraph
            body: >-
              Mews 把自己定义为酒店业操作系统，而不只是物业管理系统；从当前产品面看，这个定位站得住。官网和 2026 年公司新闻稿都指向一个云原生平台，横跨
              PMS、POS、RMS、客房服务、支付、客人旅程工具和开放集成市场。这个定位很关键：Mews 同时在挑战传统酒店软件和更窄的单点工具。官方叙事也少见地连贯：创始人 Richard Valtr 说，公司源于
              Prague；他在家族酒店被手工夜审流程拖累。Matthijs Welle 则带着酒店运营背景加入，目标不是做一层面向客人的表面应用，而是搭出现代后端。独立创始人访谈和 Fortune/Yahoo
              报道都强化了这个起点，也解释了为什么 Mews 仍反复强调自动化、支付和消除运营摩擦。综合来看，证据支持一个清晰身份：Mews
              是由前酒店经营者打造的酒店基础设施平台，试图用一层统一操作层替换现代物业中割裂的传统系统。
