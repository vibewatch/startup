companyProfile:
  summary: >
    Mews 总部位于 Amsterdam，并在英国注册（Mews Systems Ltd，公司编号 10355686），是一家云原生酒店科技公司，打造并销售其称为酒店业操作系统的平台。2012 年，Richard Valtr 在
    Prague 创立 Mews；这位前酒店经营者曾被手工夜审流程拖累，因而希望用一个统一、AI 原生的平台，替换多数酒店同时运行的 8–10 套割裂系统（PMS、RMS、POS、渠道管理、客人消息、BI、支付、客房服务）。截至
    2026 年 1 月，Mews 服务 85 个国家的 15,000 家酒店物业，员工超过 1,300 人，年度平台交易额达 $19.7B。2026 年 1 月，公司以 $2.5B 估值完成 $300M Series D，由 EQT
    Growth 领投，Atomico、HarbourVest、Kinnevik、Battery Ventures 和 Tiger Global 参投；这是有记录以来酒店软件领域最大单笔融资。
  foundedDate: '2012-01-01'
  founders:
    - name: Richard Valtr
      role: 创始人
      background: 曾在 Prague 开酒店的酒店经营者；他亲历前台自动化痛点后，创办 Mews 来解决这些问题。
      claimRefs:
        - CO001
    - name: Matthijs Welle
      role: CEO
      background: 酒店运营老兵，早期加入 Mews，并以 CEO 身份带领公司从创业公司成长到 $2.5B 估值。
      claimRefs:
        - CO002
  foundingLocation: Prague, Czech Republic
  headquarters: Amsterdam, Netherlands
  productSummary: >
    Mews Hospitality Cloud 是一个统一 SaaS 平台，覆盖九类能力：（1）面向预订、账单管理、入住 / 退房的核心 PMS；（2）Mews Payments——以 PayFac
    模式运行、处理酒店交易的嵌入式支付层；（3）Mews RMS——2026 年 5 月推出的 AI 驱动收益管理系统，每天执行 150M 次定价计算；（4）面向餐饮的 Mews POS；（5）整合 WhatsApp、SMS、电子邮件和
    OTA 渠道的客人消息中心；（6）由 SiteMinder 支撑、覆盖 400+ OTA 的渠道管理器；（7）用于分析和报表的 Mews BI；（8）Flexkeeping——2025 年收购的客房服务与运营自动化工具；（9）拥有
    1,000+ 应用、且不收集成费的开放 API 市场。平台运行在 Microsoft Azure 上，具备 PCI DSS v4.0、SOC 2 Type 2、ISO/IEC 27001:2022 和 GDPR 认证，并支持 5
    个核心 API（Connector、Channel Manager、Booking Engine、POS 和 Loyalty）。
  customerFocus: >
    重点客群是独立和精品酒店（50–300 间客房）、生活方式与设计导向物业，以及希望用现代云原生技术栈替换传统本地部署 PMS（Oracle Opera、Protel）的中型酒店集团。Mews 也越来越多把中型连锁（2–50
    家物业）作为第二客群。大型企业连锁仍是未来扩张机会。
  businessModel: >
    收入来自三条主线：（1）SaaS 订阅费（中档方案约 €9/间客房/月）；（2）借助 Adyen/Stripe 后端，以 PayFac 身份从酒店交易额中赚取支付处理价差；（3）RMS、POS、BI
    等附加模块费用。第四条仍处早期的收入线，是通过 Mews Spaces 获取非客房附加预订收入。
  stage: Series D
  fundingStatus: >
    2026 年 1 月，公司以 $2.5B 估值完成 $300M Series D，由 EQT Growth 领投。自种子轮、Series A、B、C（$185M）、Series C 延展轮（2024 年 3 月，$1.2B 估值融资
    $110M）到 Series D，累计股权融资超过 $600M。公司还与未披露的债务提供方保有一项活跃信贷额度（Companies House 押记登记 MR01，2024 年 9 月）。
