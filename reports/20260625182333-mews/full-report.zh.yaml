      - number: '5.3'
        title: 架构、开放 API 与开发者界面
        blocks:
          - type: paragraph
            body: >
              Mews 是托管在 Microsoft Azure 上的云原生应用，从一开始就按多租户 SaaS 打造，不是把本地部署软件改造成云产品。最关键的架构选择是开放 API 界面：Mews 暴露五个公开 API——通用
              Connector API、Channel Manager API、Booking Engine API、POS API 和 Loyalty Partner API——均在 docs.mews.com
              上文档化；源文件放在公开 GitHub 单仓 MewsSystems/open-api-docs 中，并通过 GitBook 发布。认证采用 ClientToken 加 AccessToken
              模式，集成方上线前可用 demo / sandbox 环境打样。实时传播由 webhooks
              承担，一旦预订、消费、住客档案、付款等发生变化，就推送给连接系统，这是「单一数据模型」说法的技术基础。开发者生态是真正的护城河信号：Mews 宣称有 1,000+ 个 marketplace
              集成且不收连接费，合作伙伴会获得 Partner ID，并且集成通过认证后才能上架。公开开发者信号来源（GitHub repo、APItracker 档案、Mews 状态页）证实了 API 文档、webhook
              管理和运营状态界面的存在；不过 APItracker 也指出，Mews 没有暴露一些开发者便利项（未列出公开 GraphQL playground、OAuth playground 或开源
              SDK）。除「Azure 云原生」和 API 契约之外，更深层的架构——数据驻留、微服务拓扑、扩展设计——没有公开文档，记为证据缺口。
