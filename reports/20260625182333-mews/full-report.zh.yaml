          tone: positive
        - date: '2018'
          label: Series A 阶段
          detail: Notion 创始人访谈称，Series A 融资随后在荷兰完成。
          tone: positive
        - date: '2019'
          label: 首次收购 / 美国存在
          detail: 公司历史记录了 Planet Winner 和办公室扩张。
          tone: positive
        - date: 2022-12
