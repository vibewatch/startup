        title: 规模信号、版图扩张与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              作为非上市公司，Mews 的公开运营信号相对充足。2026 年 Series D 公告称，Mews 在 2025 年底拥有 15,000 名客户、132,000 名月活酒店从业者、42.3M
              笔已入住预订、$19.7B 平台交易额，以及 55% 的 SaaS 毛利润增长。公司 About 页面另列 15,000+ 家酒店、1,300+ 名员工、覆盖 85 个国家；2024 年任命总裁的公告则称员工
              1,100 人，分布于 20 多个国家。即便这些数据不能完全拆出现时组织结构或地域组合，方向上仍与快速增长一致。里程碑也显示出少见的战略节奏：2012 年在 Prague 创立，2013 年在 Emblem
              完成首家酒店部署，2016 年获得首笔融资，2018 年 Series A，2019 年首次收购，2022 年 Series C 与投资人入董事会，2024 年独角兽轮，2025 年收购 DataChat 和
              Flexkeeping，2026 年完成 Series D 并获 HotelTechAwards 认可。这条时间线支持一种判断：Mews 是一家正在规模化、积极并购的平台型企业，而不是静态 PMS 供应商。 
