  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价模型与收入结构
        blocks:
          - type: paragraph
            body: >
              Mews 主要通过三条收入流赚钱。核心是 SaaS 订阅费：酒店按每间客房、每月付费，定价层级从基础方案（Essentials，8 个市场集成）到 Advanced 和
              Professional。公开确认的中档方案典型价格约为 €9/间客房/月；但 Mews 不发布完整价目表，价格会随物业规模、方案层级和地区变化。按公司披露的 15,000 名客户计算，若保守假设每家物业平均
              60 间客房，估计 SaaS ARR 为 $90–$120M——这明确是作者估算，不是披露指标。第二条是支付处理：Mews 作为 Payment Facilitator（PayFac）运营，把酒店作为 Mews
              旗下子商户接入，实际后端处理由 Adyen 或 Stripe 承担。Mews 设定商户费率，并可自行决定后端处理商选择。2025 年平台交易额为 $19.7B；若采用行业约 0.3–0.5%
              的扣除后端成本后混合净利差，则估计净支付收入为 $60–$100M，但交易额拆分和净抽成率均未披露。第三条是附加模块和专业服务：RMS、POS、BI、客人消息和实施费合计可能贡献 $20–$40M。Mews
              Spaces 为酒店经营者创造了 $537M 附加收入（不是 Mews 收入）；该产品收入分成未披露，未经确认不应计入 Mews 收入。总估计总收入处于 $170–$260M 区间，按 $2.5B 估值隐含约
              10–15x 收入倍数。
