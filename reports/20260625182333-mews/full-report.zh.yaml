      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Mews 的整合论点建立在一张它无法完全控制的第三方网络上，每个节点都可能成为单点故障。Microsoft Azure 托管整个平台，因此 Azure 可用性、定价和区域数据驻留直接决定 Mews
              的可靠性与数据主权态势。分销通过 2026 年推出、由 SiteMinder 支撑的 Channel Manager 运行，Mews 因而继承 SiteMinder 在 400+ OTA
              连接上的可靠性和伙伴经济性。嵌入式支付依赖后端收单机构（Adyen / Stripe 类处理方），集中信用、欺诈和 scheme 合规暴露。两笔 2025 年收购——DataChat（生成式 AI 分析）和
              Flexkeeping（客房清洁）——仍在整合，给旗舰能力增加执行和技术债风险。1,000+ 个 marketplace 集成是优势，也是一张庞大的第三方攻击和可靠性表面。资本侧，Mews 依赖 EQT
              领投的成长投资者来资助 IPO 前扩张。传导机制是：任何节点失效或负面变化——Azure 区域停机、SiteMinder 事故、支付伙伴重新定价，或收购整合失败——都会传播到 Mews
              的正常运行、利润率或路线图。合作伙伴 / 依赖风险登记表（表 TR003）和依赖图（图 FR003）列出这些关键依赖、可控性，以及量化每项依赖所需的尽调问题。
