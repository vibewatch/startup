      - number: '7.2'
        title: 监管与法律风险——隐私、支付和执法
        blocks:
          - type: paragraph
            body: >
              Mews 的监管暴露是双管齐下。作为住客个人数据处理方，它受 GDPR 约束——包括 Article 32 要求实施适当技术和组织安全措施的义务；作为 payment
              facilitator，它必须为持卡人数据维持 PCI DSS v4.0 合规。住宿和酒店行业仍是活跃执法目标：一家律所执法追踪器记录了 15 个国家 83 起 GDPR 罚款，总额约 EUR
              22.6M，以西班牙 DPA 为首；最大个案是 UK ICO 对 Marriott 的 EUR 20.45M 罚款（约 3.39 亿条住客记录暴露），以及 CNIL 对 ACCOR 非法营销处理的 EUR
              600K 罚款；Booking.com 因延迟泄露通知被罚 EUR 475K。欧洲 GDPR 累计罚款已超过 EUR 7.4B，监管机构如今把执法——包括数据主权和泄露报告预期——视为常态，而非偶发。对 Mews
              来说，法律风险传导很直接：一次符合条件的数据泄露，或一项 Article 32 控制不足的认定，可能同时触发罚款、强制通知、客户流失和 PCI scheme 处罚。Mews 宣称符合 PCI DSS、SOC
              2、ISO 27001:2022、GDPR 和 NF525，但公开来源不披露认证范围、版本或审计日期，因此无法独立承销其控制充分性。监管 / 法律风险登记表（表 TR001）逐项列出制度、暴露和剩余尽调缺口。
