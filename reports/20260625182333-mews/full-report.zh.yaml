  - id: TV005
    title: 论点破裂与终止触发器表
    columns:
      - 触发器
      - 监控信号
      - 为何会破坏论点
    rows:
      - - 留存下降
        - 净收入留存跌破约 100%
        - 削弱复利增长、低流失 SaaS 溢价
      - - 支付流失
        - 支付量或抽成率收缩
        - 侵蚀嵌入式金融科技价值
      - - 安全 / 监管事件
        - 重大泄露或 GDPR/PCI 执法行动
        - 带来罚款、整改成本和信任损失
      - - 竞争失利
        - 相对 Oracle / 最佳单点方案的赢率持续下降
        - 推翻一体化整合论点
      - - 融资冻结
        - IPO 窗口关闭或出现下轮降价
        - 拿掉入场时依赖的重估路径
    notes: 触发器是作者构建的监控工具，不是 Mews 披露；每一项都映射到表 TV003 中的下行情景。
    claimRefs:
      - CV026
      - CV027
      - CV028
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 索取项
      - 目的
      - 解决的问题
    rows:
      - - 经审计财务和 ARR
        - 检验隐含收入倍数
        - 估值不透明
      - - 毛利率 + 支付抽成率 / 利润率
        - 核验单位经济和金融科技贡献
        - 利润率和 Rule-of-40 不确定
      - - 净收入留存 + 流失
        - 验证 SaaS 溢价和锁定主张
        - 留存和流失不透明
      - - 完整股权结构表 + 优先权堆栈
        - 评估稀释和下行情景中的次级地位
        - 优先权包袱
      - - SOC 2 / ISO 27001 / PCI v4.0 证据
        - 核验安全和合规姿态
        - 认证范围缺口
      - - 按地域拆分的客户 + 收入
        - 量化欧洲集中度和数据主权风险
        - 集中度不透明
    notes: 这些索取项是把有条件推进转为可定价决策所需的披露；目前公开来源均不可得。
    claimRefs:
      - CV029
      - CV030
      - CV015
