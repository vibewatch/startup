      - number: '7.7'
        title: 图表
        blocks:
          - type: callout
            title: 监管和网络安全是剩余风险最高的暴露，且很大程度上由行业结构决定
            body: >
              买方无法完全缓释的两类风险是监管执法和网络安全，因为二者都是欧洲酒店支付平台的结构性风险。Mews 在欧盟处理住客个人数据和银行卡支付，落入 GDPR Article 32 和 PCI DSS v4.0
              之下；该行业里，DPA 已经开出 83 起住宿业罚款，总额约 EUR 22.6M，包括 Marriott 的 EUR 20.45M 处罚，而欧盟累计罚款超过 EUR
              7.4B。与此同时，酒店业是勒索软件的重点目标——MGM 2023 年泄露造成约 USD 100M 成本和 USD 45M 和解——而 Mews
              把一家酒店的全部运营加支付集中在一个平台上，使一次泄露变成跨物业、双制度（GDPR + PCI）事件。由于 Mews 不披露认证范围或泄露历史，公开来源无法验证其控制充分性；在 NDA 下审阅 SOC 2、ISO
              27001:2022 和 PCI v4.0 证据之前，应保守承销这项暴露。
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
              - CR014
              - CR015
              - CR012
          - type: callout
            title: 竞争和执行风险在于市场可能转向不利于 All-in-One 的方向
            body: >
              Mews 的核心论点——把八到十个酒店供应商整合到一个平台——正面临有文档记录的逆风。NYU 2026 Hotel Technology Outlook（与 Stayntouch 和 IDeaS 合作，调查
              300+ 名专业人士）发现，30% 的 all-in-one 用户计划迁移到 best-in-class 系统，只有 14% 计划反向迁移，理由是灵活性、功能和控制。与此同时，既有厂商 Oracle OPERA
              Cloud 是 IDC MarketScape Leader，部署在 233 个国家、支持 21 种语言，并拥有深厚品牌和连锁关系，是 Mews 必须替换的对象。Mews 的应对是产品速度（五个 2026
              年模块）和开放 API marketplace，但它同时在消化两笔收购，执行带宽被拉紧。风险不是即刻崩塌，而是一体化叙事缓慢被侵蚀：如果对 Oracle 的 win-rates
              走弱，或客户拆包导致净收入留存下降，支撑 USD 2.5B 估值的增长假设会明显削弱。
            calloutType: insight
