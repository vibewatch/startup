      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              估值区间很宽，因为未知输入（ARR、增长韧性、支付留存、退出倍数）主导结果。牛市情形（USD 4-5B）下，Mews 保持 30%+ 增长，净收入留存高，AI 原生和嵌入式支付叙事成立，并在市场接纳时以高端垂直
              SaaS 加金融科技倍数 IPO——这正是当前轮次隐含的重评。基准情形（USD 2.5-3B）下，Mews 稳健增长，但倍数回归到带支付的垂直 SaaS 区间顶部（更大收入基数上约
              8-12x），因此价值大致持平到小幅升值。熊市情形（USD 1.2-1.8B）下，客户拆包转向 best-of-breed stacks，增长放缓或支付锁定导致流失上升，倍数压缩到垂直 SaaS 常模（约
              6-8x），把估值拉回 2024 年水平——较入场价损失 30-50%。考虑到昂贵入场和有文档记录的 best-of-breed 转向，概率信号更偏向基准 / 熊市边界；但支付护城河和 AI
              定位真实存在，牛市情形仍有生命力。下行触发因素包括净收入留存下降、支付量收缩、重大安全或监管事件，或 IPO 前融资市场冻结。情景表（表 TV003）、估值 / 回报区间（图 FV003）和敏感性条形图（图
