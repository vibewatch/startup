      items:
        - date: '2012'
          label: 创立于布拉格
          detail: Richard Valtr 因传统酒店系统和夜审工作受挫，创立 Mews。
          tone: positive
        - date: '2013'
          label: 首家酒店上线
          detail: 据关于页面，The Emblem 成为首家酒店客户，并且仍是客户。
