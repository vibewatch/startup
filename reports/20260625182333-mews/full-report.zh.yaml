    title: 建议逻辑（流程）
    type: flow
    layout: standard
    summary: |
      市场、产品、客户、财务、竞争和风险证据如何汇总为一项有条件推进建议，其前提是取得财务披露。
    data:
      nodes:
        - id: evidence
          label: 证据：产品 + 支付 + 增长
        - id: moat
          label: 护城河：开放 API + 嵌入式支付 + Spaces
        - id: opacity
          label: 缺口：未披露 ARR / 利润率 / NRR
        - id: price
          label: 价格：USD 2.5B（约 10–15x 收入）
        - id: condition
          label: 条件：取得财务披露
        - id: proceed
          label: 建议：有条件推进
      edges:
        - from: evidence
          to: moat
          label: 支撑投资论点
        - from: moat
          to: proceed
          label: 定性强项
        - from: opacity
          to: condition
          label: 限制信心
        - from: price
          to: condition
          label: 没有安全边际
        - from: condition
          to: proceed
          label: 卡住决策
    approximationNotes: 逻辑流程是作者对本章论证的综合；节点标签压缩的是定性判断，不是实测数值。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV011
  - id: FV002
    title: 估值敏感性（条形图）
    type: bar
    layout: standard
    summary: |
      以推断的 USD 225M 收入基数测算不同收入倍数下的隐含企业价值（十亿美元），展示 USD 2.5B 价格比历史可比倍数高出多少。
    data:
      items:
        - label: 5x（私有 SaaS 中位区间）
          value: 1.1
        - label: 8x（垂直 SaaS 区间）
          value: 1.8
        - label: 11x（隐含下限）
          value: 2.5
        - label: 15x（隐含上限）
          value: 3.4
        - label: 20x（AI 原生溢价）
          value: 4.5
    approximationNotes: 隐含价值用推断的 USD 225M 收入中点乘以各倍数，并四舍五入到 USD 0.1B；由于 Mews 不披露 ARR，USD 225M 基数为估算值。
    claimRefs:
      - CV012
      - CV013
      - CV022
      - CV023
  - id: FV003
    title: 估值 / 回报区间（范围）
    type: range
    layout: standard
    summary: |
      Mews 牛市、基准和熊市情景下的估值区间（十亿美元），并列出各情景中心点估算相对 USD 2.5B 入场价的位置。
    data:
      items:
        - label: 熊市
          low: 1.2
          high: 1.8
          point: 1.5
        - label: 基准
          low: 2.5
          high: 3
          point: 2.7
        - label: 牛市
          low: 4
          high: 5
          point: 4.5
    approximationNotes: 区间是作者基于推断收入基数和可比倍数三角校验后的情景估算；仅作示意，不是预测。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
  - id: FV004
    title: 投资 KPI（KPI）
    type: kpi
    layout: standard
    summary: |
      截至 2026 年 1 月 Series D，Mews 的核心投资指标，混合估值、规模和支付信号（单位见各项标注）。
    data:
      items:
        - label: 估值（USD M）
          value: 2500
        - label: Series D 融资额（USD M）
          value: 300
        - label: 2025 年支付量（USD M）
          value: 19700
        - label: Spaces 附加收入（USD M）
          value: 537
        - label: 客户（物业）
          value: 15000
        - label: 月活酒店经营者
          value: 132000
    approximationNotes: 数值来自 Mews Series D 披露的报告数据；支付量和 Spaces 收入由公司给出，并为图表一致性按 USD M 表示。
    claimRefs:
      - CV011
      - CV014
      - CV002
      - CV024
