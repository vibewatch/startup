      - number: '4.3'
        title: 公开运营牵引力与平台指标
        blocks:
          - type: paragraph
            body: >
              Mews 在 2026 年 1 月 Series D 公告中披露了一整套运营指标。2025 年，公司服务 85 个国家的 15,000 名客户，月活酒店从业者 132,000+，处理 42.3M
              笔已入住预订（其中 3.2M 通过 Mews Kiosk），平台交易额 $19.7B。Mews Spaces 带来的 $537M
              酒店经营者额外收入（通过专有预订层完成的非客房预订），代表平台为客户创造的经济价值，但不是 Mews 收入。这些指标彼此可交叉验证：15,000 家物业平均 42.3M/15,000 = 每家物业每年 2,820
              笔预订（约每天 7.7 笔），对精品酒店而言合理。$19.7B/15,000 = 每家物业约 $1.3M 交易额，也符合中型酒店。Companies House 记录确认，Mews Systems
              Limited（公司编号 10355686）于 2026 年 1 月 31 日提交截至 2024 年 12 月 31
              日的完整账目——这提供了申报线索，但尚未给出经审计收入细节，因为账目属于英国子公司，而非合并集团。收入质量方面，SaaS
              订阅较高（经常性、合同化），支付为中等（交易额会随季节和入住周期波动），专业服务较低（项目制、一次性）。
