      - number: '2.2'
        title: 市场规模测算——TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: >
              多个分析机构采用不同测算口径，应该合并使用，而不是只选一个。最窄口径——全球核心 PMS 软件——对应 Mordor Intelligence 对 2026 年 $1.73B 的估计，以及 The
              Business Research Company 的平行数字 $1.71B。更宽的酒店管理软件口径纳入 RMS、POS 和集成工具，Grand View Research 与 Fortune Business
              Insights 给出的估计在 $4.0–4.3B 区间。这些数字并不矛盾，只是边界选择不同。对 Mews 而言，可服务市场（SAM）更准确地说，是更宽品类中的云优先部分。2025 年，云 PMS 占部署份额
              64.92%，年增速 12.38%；这意味着 2026 年核心 PMS 市场中的云 SAM 约为 $1.1B。若扩展到更宽的酒店软件池，统一云原生技术栈的云 SAM 可能接近 $2.8B。Mews
              的可获取市场（SOM）还受当前 15,000 家物业覆盖限制；这约占全球酒店物业 7.5%，且公司渗透最强的区域是欧洲和英语市场。按当前轨迹，一个合理 SOM 估计是云 SAM 的 10–12%，即未来 2–3
              年内约 $110–135M 年度经常性软件收入，不含支付货币化。MarkWide Research 的更高且相互冲突估计（按宽泛「hospitality PMS」定义，2026 年 TAM 为
              $6.8B）保留下来，用来体现各报告市场定义不一致带来的尽调缺口。
