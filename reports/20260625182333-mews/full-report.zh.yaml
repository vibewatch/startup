      - number: '7.6'
        title: 缓释、监控指标与 Thesis-Break 触发条件
        blocks:
          - type: paragraph
            body: >
              上述每项风险都在缓释表（表 TR005）中对应 Mews 看似已有的缓释措施、尽调团队应跟踪的监控指标，以及会实质改变投资判断的 thesis-break 触发条件。监管 / 法律风险方面，缓释是 Mews
              的认证组合和陈述的 GDPR / PCI 态势；监控项是任何 DPA 执法行动、证书失效或需报告泄露；终止标准是重大罚款或 Article 32 控制不足认定。网络安全方面，缓释是认证加 24 小时
              RTO；监控项是状态页事故频率和任何披露泄露；终止标准是成功泄露并大规模暴露银行卡或住客数据。竞争 / 执行风险方面，缓释是产品速度和开放平台；监控项是对 Oracle 的 win / loss 和从
              all-in-one 迁向 best-of-breed 的比例；终止标准是净收入留存持续下降或可见份额流失。财务不透明方面，唯一缓释是 NDA 下的直接披露；终止标准是 ARR
              或利润率显著低于估值隐含水平。关键人风险方面，缓释是更广的高管梯队和投资者治理；终止标准是 Valtr 或 Welle 离任且没有继任安排。这些触发条件把定性风险转成可监控的尽调项目。
