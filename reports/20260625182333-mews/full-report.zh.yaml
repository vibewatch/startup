      - number: '1.2'
        title: 领导层厚度、治理可见度与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              公开能见度最高的是 Richard Valtr 和 CEO Matthijs Welle。两人持续出现在官方页面、融资公告和创始人访谈中，是公司战略叙事的门面。公开资料还显示，Mews 在 2024 年任命
              Michael Coscetta 为总裁，补强运营班底；他此前在 Paxos、Compass 和 Square
              担任高管。这一动作说明，随着扩张推进，公司意识到需要更规模化的商业和客户成功层。投资人治理有历史痕迹，但当前信息只露出一部分：2022 年 Series C 公告明确称，Kinnevik 的 Akhil
              Chainwala 和 Goldman Sachs Asset Management 的 Kirk Lepke 将加入董事会；但本次检索到的 2026
              年来源没有披露完整现任董事名单、委员会结构或独立董事画像。对一家当前估值 $2.5B 的公司而言，这是实质尽调缺口。稳妥判断是：Mews
              已补充资深运营人才，也有强重复投资人监督信号，但在公开产品和品类叙事上仍高度依赖 Valtr 和 Welle；治理是否像估值一样快速成熟，外部可见度有限。 
