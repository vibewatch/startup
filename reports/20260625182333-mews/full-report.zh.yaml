      - number: '5.4'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >
              Mews 以浏览器 SaaS 方式部署，因此上线更多是数据迁移和配置，而不是安装；公司强调可通过 API「一次调用」管理多物业。部署故事的核心是集成广度：1,000+ 个 marketplace 应用和新的原生
              SiteMinder 渠道连接，把分销、门锁和附加工具纳入同一工作流。可靠性通过 status.mews.com 公开展示，该页面报告 Open API
              和其他服务的组件级运营状态；一条已记录事件提到数字钥匙创建依赖第三方 Assa Abloy / Vostio，说明 Mews 的可靠性部分取决于它无法控制的集成伙伴。Mews trust center 声明 24
              小时 Recovery Time Objective。2026 年路线图异常密集：在 Unfold 2026（2026 年 5 月 27 日）上，Mews 推出五个新产品，包括 Mews
              RMS、SiteMinder Channel Manager 和 Accounts Receivable；Flexkeeping 客房清洁工作流构建器计划在 2026 年继续加入高级能力。2025 年 11
              月收购 DataChat 后，公司把智能体 AI 纳入路线图，目标是让智能 agents
              管理日常运营。路线图表（TE005）区分已经发布并带日期的版本与面向未来的能力主张。可靠性和路线图尽调的核心问题是执行风险：多个旗舰模块上线才数月，两笔 2025
              年收购仍在整合，公开可靠性数据（正常运行历史、SLA 条款、RTO / RPO 证据）相对于酒店承担的运营依赖广度偏薄。
