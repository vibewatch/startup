      - number: '1.5'
        title: 可见执行风险与仍需尽调的问题
        blocks:
          - type: paragraph
            body: >-
              近期最大风险不是缺乏势头，而是执行质量能否跟上越来越宏大的叙事。官方材料如今强调 agent 驱动自动化、AI、嵌入式支付和更广的操作系统覆盖；但围绕 DataChat
              收购的独立分析指出，半自主工作流会带来数据质量、集成和监督挑战。客户反馈也并非一边倒正面。Trustpilot 上有围绕卡费、支持和产品复杂度的强烈负面投诉；Software Advice
              则提出界面设计、取消流程和追加销售限制等较温和担忧。一个状态监控来源还显示，2026 年 6 月有多起与 Booking.com、Expedia 和预订显示相关的事件，说明在 Mews
              当前规模下，第三方集成可靠性仍然重要。这些问题不抹掉公司的牵引力，但会改变尽调优先级。投资人应把现任董事会构成、准确员工数与职能结构、精确 ARR 披露，以及 AI
              叙事背后的运营现实，视为后续核查项，而非既定事实。Mews 看起来是一家强势后期平台公司，但公开透明度还不完美。 
