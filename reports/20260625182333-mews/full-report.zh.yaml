      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              酒店科技的买方结构是三方：物业业主或管理公司拍板采购，总经理或运营负责人是主要用户，投资人或特许经营方常常设定技术标准并过滤评估对象。独立物业（不属于品牌或连锁的酒店）在 2025 年占 PMS 市场支出的
              51.45%，CAGR 为 11.62%；对 Mews 这类云优先供应商而言，这是最大且增长最快的细分。小中型物业——少于 100 间客房——为了简化运营，倾向采用一体化方案；2026 年，54% 的 100
              间以下物业使用一体化平台。更大的独立酒店（101–250+ 间客房）更偏向最佳单项集成系统，比例为 68%，目标是可扩展性和数据精度。连锁酒店占酒店软件支出的
              39–45%，单物业预算最高，但决策更慢，且往往需要企业采购流程。度假村和多网点物业的单物业支出最高；除核心 PMS 外，它们还需要复杂的附加收入和 F&B 模块。独立物业的预算通常由总经理掌握，连锁则由
              IT/采购掌握；采用切换的触发点通常是租约续签、重大翻新周期、人工成本压力或特许经营标准要求。Mews 以独立和精品酒店为主攻细分，以中型集团为第二转化机会。
