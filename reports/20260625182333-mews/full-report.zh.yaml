      - number: '8.6'
        title: 退出准备度、Thesis-Break 触发条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              Mews 正被管理层推向未来几年内 IPO，Series D 也被明确包装为 IPO 前扩张资本，因此最可能的退出是公开上市；战略收购（由支付、travel-tech
              或企业软件收购方发起）是替代路径。公司在叙事和规模上退出准备度较高，但上市所需的披露和治理成熟度尚未证明；未披露财务是当前状态与可承销退出之间最大的缺口。会改变建议的 thesis-break 触发条件（表
              TV005）包括：净收入留存跌破约 100%；支付量或 take-rate 收缩；重大安全泄露或 GDPR / PCI 执法行动；对 Oracle 或 best-of-breed stacks 持续丢失
              win-rate；或融资冻结推迟 IPO。最终尽调问题（表 TV006）是把有条件推进转成定价决策所需的披露：经审计财务和 ARR；毛利率、支付 take-rate 和支付毛利率；净收入留存和 logo /
              收入流失；完整资本结构表和优先权栈；SOC 2 Type 2、ISO 27001:2022 和 PCI v4.0
              证据；以及按地域拆分的客户和收入。拿到这些披露，才能解决当前限制信心的大部分不透明，并允许估值基于证据被辩护——或被否定。
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV005
            claimRefs:
              - CV026
              - CV027
              - CV028
          - type: table
            tableRef: TV006
            claimRefs:
              - CV029
              - CV030
              - CV015
      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 有条件 PROCEED——资产强、价格高，信心取决于财务披露
            body: >
              建议是有条件地 PROCEED 到更深尽调，而不是认可 USD 2.5B 入场价格。Mews 确实是强资产——带嵌入式支付护城河的垂直 SaaS（USD 19.7B 交易量、USD 537M Spaces
              附加收入）、品类领先产品和 55% SaaS 毛利润增长——这种画像正是 2026 年市场愿意给高端倍数的对象。但隐含约 10-15x 收入倍数显著高于私营 SaaS（约 4.2x），甚至高于带支付的垂直
              SaaS 常模（约 5.8-8.5x），因此价格只有在前瞻、AI 原生、30%+ 增长论点下才可辩护；公开来源方向上支持，但无法确认。所以信心为中等，并明确取决于取得 ARR、利润率、NRR、资本结构表 /
              优先权栈和认证证据。有纪律的买方会把头部数字当作上限，从可比公司隐含区间谈判；如果披露显示 NRR 低于 100%、支付利润率薄，或优先权包袱很重，就准备退出。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV022
          - type: callout
            title: 估值几乎没有安全边际，下行无法从公开来源量化
            body: >
              核心估值风险是高入场价格和全面不透明叠加。按约 10-15x 推断收入，Mews 已为多年无瑕执行定价；但买方无法测试这个倍数，因为 ARR、毛利率、净收入留存和支付 take-rate
              全部未披露，此前轮次的优先权栈也不公开。如果客户拆包转向 best-of-breed stacks——这是有文档记录的 2026 年趋势——导致增长正常化或支付锁定流失上升，倍数可能压缩到垂直 SaaS 常模（约
              6-8x），并把估值拉回 2024 年 USD 1.2B 水平，较入场价损失 30-50%。由于公开证据无法排除熊市情形，在按头部价格投入任何资本前，头寸应按下行风险控制，并以最终尽调问题表中的财务披露为条件。
            calloutType: risk
            claimRefs:
              - CV012
              - CV018
              - CV025
              - CV030
