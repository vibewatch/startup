      - number: '5.5'
        title: 差异化、信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              Mews 的差异化靠三根柱子撑着：开放 API 平台和庞大的免连接费集成 marketplace；把 PMS 变成金融科技界面的嵌入式支付；以及竞争对手受传统架构拖累、难以匹配的 AI 原生单一数据模型。开放
              API（「并行构建，而非事后加装」）和 webhook 实时数据，是相对传统系统最清晰的技术差异；Mews Payments 与 Mews Spaces（为酒店经营者创造 $537M
              附加收入）则构成经济护城河。在信任与合规上，Mews 发布由 SafeBase 托管的 trust center，声明符合 SOC 2、ISO 27001、PCI DSS、GDPR、CCPA、SOX 和
              NIST；help center 记录银行卡处理的 PCI DSS 合规，法国 NF525 反欺诈认证支持法国 POS 部署。trust center 声明 24 小时 RTO 和标准控制（双因素认证、DDoS
              与暴力破解防护）。关键尽调保留意见是：公开来源能确认这些认证存在，但不能确认当前范围、类型或审计日期——例如 SOC 2 是否为 Type 2，ISO 27001 修订版是否为 2022，PCI DSS 是否为
              v4.0，以及每张证书覆盖哪些实体和产品。Mews 的 PayFac 支付模式因便利性受到肯定，但成本和锁定也是反复出现的负面信号。合规表（TE004）记录每项控制的状态、范围和验证缺口；这些未验证范围也进入
              evidenceGaps，供商业和安全尽调继续追问。
