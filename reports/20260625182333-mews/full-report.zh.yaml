      - number: '2.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 云迁移浪潮正在加速 TAM 扩张
            body: >
              云到 SaaS 的迁移速度，是酒店科技市场最强的单一结构性顺风：云 PMS 以 12.38% CAGR 扩张，而整体市场增速为 7.05%，意味着云每年都在一个增长池中提高份额。传统安装基础仍有约 35%
              是本地部署；它们按可预测折旧周期转向云，为 Mews 这类云原生供应商带来复合管线。51% 酒店经营者计划在未来 12–24 个月更换技术栈，也确认短期管线密度按历史标准看异常高。
            calloutType: strength
            claimRefs:
              - CM003
              - CM004
              - CM017
          - type: callout
            title: 2026 年学术研究显示，一体化平台模式面临结构性流失风险
            body: >
              NYU Tisch Center of Hospitality 2026 研究由 Stayntouch 和 IDeaS 共同撰写；二者都是 Mews 竞争对手。该研究直接挑战 Mews 的统一操作系统定位。对
              300+ 名酒店专业人士的研究发现，30% 一体化平台用户计划切换到最佳单项集成技术栈，是 14% 反向切换率的两倍多。一体化用户还报告更高预订错误率（57% vs. 45%）和更多入住延误（46% vs.
              23%）。Mews 主张其平台比传统一体化方案更能消除孤岛；但研究发现，最佳单项方案带来更高 PMS 满意度（70% vs. 55%）和更强留存。这意味着，在大规模连锁采用变得可靠之前，Mews
              必须证明其统一方案真正优于最佳单项组合。
            calloutType: risk
