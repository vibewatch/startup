  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >
              与 Mews 相关的酒店 PMS 和操作系统市场包含五类有意义的竞争者。第一，企业级既有巨头——主要是 Oracle Hospitality OPERA Cloud 和 Shiji
              Group——服务大型连锁，功能深、专有集成生态强、品牌信任积累数十年，但在 UX 和自动化创新上更慢。第二，一体化 SMB 冠军，以 Cloudbeds 为代表（27,000 家物业，150+
              个国家），用更简单、成本更低的套件服务独立酒店和 100 间以下市场。第三，API-first 纯玩家，如 Apaleo（1,700+
              家物业），瞄准技术导向运营者；这些客户想要模块化最佳单项可组合性，而不是统一平台。第四，区域或垂直玩家（HOTELTIME、StayNTouch、RoomRaccoon、Maestro）服务特定地区或物业类型。第五，现状替代方案——来自
              Protel、Amadeus 和较老 Oracle 本地部署系统的传统本地 PMS——仍占全球安装基础约 35%，也是 Mews 主要有机替换机会。2026–2028 年窗口内，潜在新进入者包括通用 AI
              编排平台（例如 Salesforce AI Cloud），它们可能在既有行业 CRM 关系之上嵌入酒店工作流自动化；也包括 Booking.com、Expedia 等旅行 OTA
              巨头，它们可能打造运营工具来加深酒店关系。
