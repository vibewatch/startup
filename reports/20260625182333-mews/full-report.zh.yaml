      - number: '7.5'
        title: 财务、人员与执行风险
        blocks:
          - type: paragraph
            body: >
              财务风险集中在不透明和支付经济性。Mews 既不披露 ARR，也不披露盈利能力，因此 2026 年 1 月 USD 2.5B 估值完全依赖员工数、客户数和支付量推断——买方无法独立测试烧钱、毛利率或收入倍数。推动
              Mews 大部分变现的嵌入式支付模式，也是最常被批评的功能：评论者反复称 Mews Payments 方便但昂贵且难以离开，同时带来流失风险（价格敏感经营者流失）和利润率 /
              集中风险（收入依赖保住支付量）。人员和执行风险由关键人依赖牵头：创始人 Richard Valtr 和 CEO Matthijs Welle——两位自公司成立以来一直运营 Mews
              的联合创始人——承载战略和关系；President Mike Coscetta 领导 go-to-market；任何一人离开，都可能在计划 IPO 前扰乱方向。执行风险进一步叠加：Mews
              同时整合两笔收购、发布五个 2026 年新模块，并在有文档记录的市场转向 best-of-breed stacks 中捍卫一体化论点。人员 / 执行风险登记表（表
              TR004）为这些暴露排序。反复出现的尽调主题是：财务和执行下行真实存在，但无法从公开来源量化；这本身就是承销方的重大风险。
