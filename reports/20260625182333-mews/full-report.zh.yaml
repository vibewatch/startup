      - number: '7.3'
        title: 运营、质量与网络安全风险
        blocks:
          - type: paragraph
            body: >
              Mews 的运营风险集中在两个地方：平台可靠性和网络安全。Mews 把酒店预订、入住、客房清洁、POS 和支付整合到一个托管在 Azure
              上的平台，一旦停机，物业整个运营都会停摆——前台、房间访问、银行卡处理一起受影响——这正是 MGM Resorts 2023 年遭攻击时出现的失效模式，当时入住、数字钥匙和支付停摆数日。Mews 发布 24 小时
              Recovery Time Objective 和实时状态页，但没有公开 SLA、RPO 或历史正常运行数据，无法量化运营尾部风险。网络安全风险是全行业且严重的：MGM 泄露造成估计 USD 100M
              运营损失，并以 USD 45M 和解覆盖约 3,700 万客户；攻击通过社会工程完成——Scattered Spider 致电 help desk，并在十分钟内取得 Okta 和 Azure
              管理员访问。行业调查显示，约 31% 酒店业企业经历过泄露，PMS、POS 和支付工作流是主要攻击面，第三方 / vendor desks 是增长中的攻击向量。Mews
              的集成支付让它成为高价值目标：一旦被攻破，数千家物业的银行卡和住客数据可能同时暴露。运营 / 安全风险登记表（表 TR002）为这些暴露排序；依赖图（图 FR003）显示可靠性从哪些第三方继承而来。
