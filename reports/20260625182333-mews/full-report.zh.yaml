  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险总览及对价值的传导
        blocks:
          - type: paragraph
            body: >
              本章按剩余严重性为 Mews 风险排序——即扣除可见缓释后的可能性乘以影响——并追踪每项风险如何传导到收入、客户、利润率、融资和估值。剩余风险最高的集群是监管 /
              法律和网络安全：酒店行业有长期泄露历史，欧盟执法活跃，两者发生概率都高；影响也严重且难以上限约束（数百万欧元罚款、运营停摆、声誉损失）。第二个集群是竞争和执行风险——Oracle OPERA Cloud
              的既有优势，以及 2026 年有文档记录的向 best-of-breed stacks 转移，都会威胁 Mews 的一体化整合论点，即便它正在发布新模块。第三个集群是财务和估值不透明：Mews 既不披露
              ARR，也不披露盈利能力，因此 USD 2.5B 估值依赖推断；支付锁定投诉也带来流失和利润率问题。合作伙伴 / 依赖风险（Azure、SiteMinder、支付后端、两笔 2025 年收购）以及人员 /
              执行风险（创始人和 CEO 关键人集中、快速 M&A 整合）单项也重要，并会放大上述顶层集群。风险热力图（图 FR001）为每类风险打分；传导图（图
              FR002）显示单次泄露或执法行动如何级联为流失、利润率压缩、融资风险和估值重评。以下每项风险都在缓释表（表 TR005）中配有监控指标和 thesis-break 触发条件。
