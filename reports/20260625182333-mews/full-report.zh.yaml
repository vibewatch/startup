  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户工作流看，Mews 实际交付了什么
        blocks:
          - type: paragraph
            body: >
              Mews 是一个云原生酒店业操作系统：一个平台替换典型酒店运行的八到十个彼此割裂的供应商（用于预订的 PMS、用于定价的 RMS、用于分销的渠道管理器、独立收件箱、自助终端、POS
              和应收账款工具）。按客户工作流看，Mews 覆盖完整客人生命周期——通过 Mews Booking Engine 预订，到店前个性化和追加销售，通过 Mews Kiosk
              自助入住，住店期间运营（客房服务、消息、餐饮
              POS），每个触点嵌入支付，以及离店后的应收账款和会计。它的核心承诺是，在一个数据模型上「每个团队都在同一平台工作」：房价调整、预订编辑或支付入账只发生一次，就能传导到各处，无需手工对账。Mews
              把平台销售给现代、独立和集团酒店，以及「共享空间」运营者，并引用 IDC 研究的三年 476% ROI 和覆盖 85 个国家的 15,000
              名客户。买方的实际收益是整合：更少供应商、一份合同和账单，并自动化那些把酒店日常割裂开的重复对账工作。限制在于，整合也把运营依赖集中到单一供应商和 Mews Payments
              上；多名评论者称后者方便但不便宜。本章将已可验证交付的能力，与路线图和营销主张分开。
            claimRefs:
