      - number: '5.2'
        title: 模块与产品线图谱
        blocks:
          - type: paragraph
            body: >
              Mews 平台拆成一组覆盖住客旅程和后台运营的模块。预订与运营核心是 Mews PMS，这个锚定产品在 2024、2025、2026 年连续拿下 HotelTechAwards Best PMS。分销由 Mews
              Booking Engine（直订）承接；Unfold 2026 之后，又接入由 SiteMinder「powered by」的 Channel Manager，原生连接 400+ OTA。收入优化交给 Mews
              RMS，这是 2026 年 5 月 27 日推出的 AI 原生模块，每天跑 1.5 亿次定价计算。运营模块包括自助入住 Mews Kiosk、餐饮 POS、Housekeeping（通过 2025 年收购
              Flexkeeping 扩展）、住客消息，以及面向 B2B 发票到收款的 Accounts Receivable 模块。变现由嵌入式支付促成层 Mews Payments，以及负责非客房附加收入的 Mews
              Spaces 承担。2025 年 11 月收购 DataChat 之后，AI 与分析能力得到补强；DataChat 带来面向智能体运营的对话智能和语义层。模块矩阵（表 TE001）和成熟度地图（图
              FE004）按成熟度、目标用户、差异化和仍待尽调的缺口为每个模块打分。贯穿本章的尽调主题是：几个旗舰模块（RMS、Accounts Receivable、SiteMinder channel
              manager）都很新——2026 年才推出或重大升级——可靠性和采用度还没有独立证据。
