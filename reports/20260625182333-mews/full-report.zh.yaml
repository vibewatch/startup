  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >
              与 Mews 相关的市场横跨酒店物业管理软件（PMS）及其邻近层：POS、收益管理系统（RMS）、渠道管理、客人消息、支付处理，以及嵌入酒店运营的商业智能。若只看狭义 PMS，Mordor
              Intelligence 对 2026 年市场规模的估计为 $1.73B；若采用更宽的酒店与酒店业管理软件定义，把 POS、RMS 和集成客人工具也纳入，多家分析机构给出的规模约为
              $4.3B。酒店科技市场不包括通用企业 ERP、并非为酒店业构建的通用 CRM、设施 HVAC/IoT，以及消费者旅行预订平台。现状替代方案仍然重要：手工电子表格运营，Oracle
              Opera、Maestro、Protel 等传统本地部署系统，仍服务全球估计 200,000+ 家酒店物业中的相当一部分；同时，资金充足、面向中型连锁的一体化套件也带来新的竞争压力。Mews
              宣称要替换八到十套独立供应商系统；对应的软件层是统一酒店业运营环境——这个子类尚无公认行业标签，但截至 2026 年，预算分配已具实质规模且继续增长。
