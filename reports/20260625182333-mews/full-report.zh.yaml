      - number: '1.3'
        title: 融资历史、投资人版图与股东重要性
        blocks:
          - type: paragraph
            body: >-
              融资记录显示，Mews 多次吸引大额且越来越成熟的成长资本。2026 年 1 月 Series D 以 $2.5B 估值融资 $300M，由 EQT Growth 领投，Atomico 和 HarbourVest
              加入，既有投资人 Kinnevik、Battery Ventures 和 Tiger Global 继续参投。早期融资同样记录清楚：2024 年 3 月，Mews 以 $1.2B 估值融资 $110M；更早在
              2022 年 12 月，公司完成由 Kinnevik 和 Goldman Sachs Asset Management 领投的 $185M Series C。2022 年融资还扩大了与 Columbia Lake
              Partners 的债务额度，让 Mews 在推进产品扩张和并购时同时具备股权与资产负债表弹性。这段历史有两层意义。第一，投资人阵容不是表面背书；Kinnevik 和 Goldman 反复参投，加上
              EQT、Atomico、HarbourVest 的后期资金，说明第三方信心延续。第二，公司把资本不只用在增长，也用于整合、支付基础设施和 AI 相关收购。因此，Mews
              更像一家试图控制酒店业多层收入与工作流的平台公司，而不是单一产品酒店软件供应商。 
