      - number: '3.3'
        title: 能力对比、定价与 GTM 差异
        blocks:
          - type: paragraph
            body: >
              Mews 定位为云原生统一平台，在挑战者中功能覆盖最广：Unfold 2026 之后，其技术栈已覆盖 PMS、POS、RMS、渠道管理（通过 SiteMinder 合作）、客人消息、商业智能、会计 / AR
              和支付。Oracle OPERA Cloud 提供相近功能范围，但靠可组合企业架构实现，而不是单一统一数据模型；对较小物业而言，部署和维护被认为更难。Cloudbeds 以固定订阅模式提供 PMS
              加渠道管理器加预订引擎（20–50 间客房每月 $200-400），在小物业层级定价显著低于 Mews。Mews 中档方案通常为 €9/间客房/月，小酒店使用时比 Cloudbeds 贵；但在 50–300
              间客房规模，自动化 ROI 可以抵消溢价，因此仍具竞争力。Apaleo 定价为 €2/间客房/天（约 €60/间客房/月），按房间看最贵，但能吸引愿意为可组合性付费的高价值、技术导向物业。偏向 Mews
              的关键能力差异包括 1,000+ 集成市场、无第三方费用的嵌入式支付，以及现代 UX；用户评分 4.7/5，高于 Oracle 的 4.6/5。关键缺口是：Mews 目前缺少 Oracle
              为大型连锁品牌提供的企业级定制深度；也有客户反馈，发票一旦在 Mews 中开具，就必须手动重新打开才能编辑，这是一个工作流摩擦点。
