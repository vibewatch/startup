      - number: '8.3'
        title: 融资与估值背景，以及入场纪律
        blocks:
          - type: paragraph
            body: >
              Mews 的 USD 2.5B 估值来自 2026 年 1 月 USD 300M Series D，EQT 等成长投资者领投；该估值约为 2024 年一轮 USD 1.2B
              标记的两倍，并延续陡峭的多轮抬升（2012 年布拉格创立，2022 年 Series C，2024 年独角兽，2026 年 Series
              D）。这轮融资被广泛报道为有史以来最大酒店软件融资，既代表势头，也带来周期后段、动量驱动价格的风险。入场纪律是核心担忧：ARR 未披露且估算为 USD 200-250M，隐含约 10-15x
              收入倍数没有可见安全边际；新投资者还会继承此前轮次的优先权栈，其条款（清算优先权、参与权、ratchets）不公开，可能在下行退出中让普通股或后进入资本居后。公开证据只能部分支持价格：它确认规模和增长（USD
              19.7B 支付量、55% 毛利润增长、132,000 名活跃酒店从业者），但没有确认测试倍数所需的单位经济（利润率、NRR、支付 take-rate）。有纪律的做法是把头部数字当作上限，从可比公司隐含区间（表
              TV004）开始谈判，并在承诺前要求披露资本结构表和优先权包袱。投资 KPI 图（FV004）和敏感性分析（FV002）呈现结论对未知 ARR 和倍数的敏感程度。
