          - type: callout
            title: Mews Payments 集成形成持久支付锁定护城河
            body: >
              Mews Payments 深度嵌入平台且不收第三方支付处理商费用，形成双层留存机制：一层是财务经济性（按 Oracle 自身可比模式数据，估计较第三方处理商节省 5%
              成本），另一层是运营集成深度（支付数据、对账、AR、开票都放在同一系统）。任何切换决定都要求同时迁移支付合同、历史交易数据和对账工作流。这个模式类似电商供应商使用 Shopify
              Payments——起初是可选附加项，一旦采用，就成为平台最黏的一层。
