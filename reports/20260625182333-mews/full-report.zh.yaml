      - number: '3.4'
        title: 切换成本、平台黏性与多归属
        blocks:
          - type: paragraph
            body: >
              Mews 有意投入，降低客户迁入摩擦。公司公开宣称，可借助模板和引导式设置，在短至一周内完成上线，并有大规模多物业部署记录（90 天内覆盖 10 个国家的 40
              家物业）。这降低了相对传统既有厂商的采用门槛，有利于 Mews 对 Oracle 的胜率。但一旦安装，Mews 平台也会制造有意义的迁出成本。第一条锁定向量是 Mews
              Payments：支付处理深度集成，意味着切换到其他 PMS 时，酒店必须同时迁移支付数据、合同结构和对账工作流。Software Advice 和 G2 评论者明确把支付锁定列为担忧。第二条向量是市场集成债：在
              Mews 1,000+ 应用市场上搭建 10–20 个集成的物业，会累积配置、工作流和数据流依赖；在竞争平台上复刻这些依赖成本很高。多归属并不常见——酒店很少同时运行两个 PMS
              平台，因此供应商选择在单个物业层面是赢家通吃。分销能力主要来自渠道管理覆盖（Mews + SiteMinder 目前覆盖 400+ OTA），也来自酒店管理公司关系带来的间接分销（Mews
              与主要酒店管理集团有合作）。竞争对手 Oracle 则依靠更深的连锁关系，以及专有 loyalty/CRS 集成，形成其细分中的反向锁定力量。
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >
              Mews 最强护城河，是在 50–300 间客房精品 / 独立酒店品类中，把集成支付、开放 API 市场引力和现代 UX
              组合起来；在这里，竞争对手要么缺少集成（Cloudbeds），要么过贵且复杂（Oracle）。但三类结构性风险会挑战护城河耐久性。第一，NYU Tisch 2026 学术研究发现，一体化 PMS 用户（Mews
              的定位）切换到最佳单项技术栈的意向率为 30%，反向仅 14%；他们还报告更高预订错误（57% vs 45%）和更多入住延误（46% vs 23%）。这是反向证据，说明随着物业成长，Mews
              的统一方案可能在规模上流失客户。第二，Oracle 正主动把传统本地安装基础迁移到 OPERA Cloud（YoY 增长 31%）并加入 AI 能力；未来 2–4 年，这会削弱 Mews
              在企业细分的差异化。第三，Apaleo 的 MACH 架构（microservices、API-first、cloud-native、headless）理论上比 Mews
              的统一模型更面向未来，带来一种风险：Mews 的「单一平台」定位最终老化为另一种锁定投诉。HotelMinder 2026 最佳 PMS 排名和 HotelTechInsight 评测都确认 Mews
              评分很高，但评测也反复浮现一个投诉：强制支付集成和有限导出灵活性。
