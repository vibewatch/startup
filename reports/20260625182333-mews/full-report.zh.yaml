        blocks:
          - type: callout
            title: 一体化结构性逆风可能侵蚀 Mews 的中端市场护城河
            body: >
              NYU Tisch Center 2026 研究发现，一体化 PMS 用户切换到最佳单项方案的意向率为 30%，超过 14% 反向迁移率的两倍。这一结构性发现直接不利于 Mews
              的统一操作系统定位。此外，一体化用户报告更多预订错误（57% vs 45%）和入住延误（46% vs 23%）；这些都是酒店经营者能直接观察到的运营指标。Mews
              要么必须用更好的数据架构证明其统一模型能避开这些失效模式，要么为企业买方投入一套可信的最佳单项叙事——否则，2026–2028 年间，其在 101–250 间客房物业中的净留存可能跑输最佳单项技术栈供应商。
            calloutType: risk
