summary:
  headline: >
    Mews is the strongest independent challenger to Oracle's hotel PMS hegemony, with genuine category leadership in
    cloud-native hospitality infrastructure, a $2.5B Series D, and compelling 55% SaaS gross-profit growth — but
    financial opacity prevents full valuation underwriting and an NYU 2026 study signals structural headwinds for
    all-in-one platforms.
