company:
  name: Mews
chapter:
  number: 1
  title: Company Overview
  summary: Mews has grown from a Prague-founded hotel workflow startup into a global hospitality operating-system vendor with a January 2026 Series D at a $2.5B valuation. Official and independent sources agree on the latest financing, product breadth, and international scale, but visibility is still weaker on board composition, exact current headcount, and how smoothly Mews can operationalize its AI-heavy roadmap. The chapter-level takeaway is that Mews has real category momentum and investor support, yet still carries execution, support, and governance diligence gaps typical of a late-stage private SaaS company.
sections:
- id: identity-and-product-scope
  title: Identity, founding story, and product scope
  body: 'Mews describes itself as the operating system for hospitality rather than merely a property management system, and that framing is well supported by the current product surface. The homepage and 2026 company press materials describe a cloud-native platform spanning PMS, POS, RMS, housekeeping, payments, guest journey tooling, and an open integration marketplace. That matters because it positions Mews against both legacy hotel software and narrower point solutions. The official story is also unusually coherent: founder Richard Valtr says the company began in Prague after he grew frustrated with the manual night-audit routines at his family hotel, while Matthijs Welle joined with his own hotel-operations background to build a modern back-end rather than a superficial guest-facing app. Independent founder interviews and Fortune/Yahoo coverage reinforce that origin story and help explain why Mews still emphasizes automation, payments, and the removal of operational friction. Taken together,
    the evidence supports a clear company identity: Mews is a hospitality infrastructure platform built by former hoteliers to replace fragmented legacy systems with a single operating layer for modern properties.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO020
  - CO021
  - CO022
  - CO023
  - CO047
  figureRefs:
  - FO002
- id: leadership-governance-and-key-persons
  title: Leadership depth, governance visibility, and key-person dependence
  body: 'Leadership visibility is strongest around Richard Valtr and CEO Matthijs Welle, both of whom appear consistently across official pages, funding announcements, and founder interviews as the strategic faces of the company. Public sources also show that Mews broadened its operating bench by appointing Michael Coscetta as president in 2024 after his senior roles at Paxos, Compass, and Square. That move suggests the company recognized the need for a more scaled commercial and customer-success layer as it expanded. Investor governance is visible historically but only partially current: the 2022 Series C announcement explicitly said Akhil Chainwala of Kinnevik and Kirk Lepke of Goldman Sachs Asset Management would join the board, yet the retrieved 2026 source set does not surface a current full board roster, committee structure, or independent-director profile. For a company now valued at $2.5B, that leaves a real diligence gap. The safe read is that Mews has added senior operating talent
    and enjoys strong repeat-investor oversight signals, but still depends heavily on Valtr and Welle as public product and category narrators, with limited outside visibility into whether governance has evolved as quickly as the valuation. '
  claimRefs:
  - CO001
  - CO002
  - CO017
  - CO025
  - CO026
  - CO027
  - CO050
  tableRefs:
  - TO002
- id: capital-base-and-stakeholders
  title: Funding history, investor map, and stakeholder importance
  body: 'The financing record shows a company that has repeatedly attracted large, increasingly sophisticated growth capital. The January 2026 Series D brought in $300M at a $2.5B valuation, led by EQT Growth with Atomico and HarbourVest joining and existing backers Kinnevik, Battery Ventures, and Tiger Global participating. Earlier rounds are also well documented: Mews raised $110M at a $1.2B valuation in March 2024, then had previously closed a $185M Series C in December 2022 led by Kinnevik and Goldman Sachs Asset Management. The 2022 round also expanded a debt facility with Columbia Lake Partners, giving Mews both equity and balance-sheet flexibility as it pursued product expansion and M&A. This history matters for two reasons. First, the investor bench is not superficial; repeat participation from Kinnevik and Goldman plus later-stage backing from EQT, Atomico, and HarbourVest implies sustained third-party conviction. Second, the company has used capital not only for growth but also
    for consolidation, payments infrastructure, and AI-related acquisitions. Mews therefore looks less like a single-product hotel software vendor and more like a platform company trying to control multiple revenue and workflow layers across hospitality. '
  claimRefs:
