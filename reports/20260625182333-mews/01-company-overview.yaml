  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-board-roster
    missingEvidence: A current board roster, committee map, and independent-director disclosure for 2026.
    whyItMatters: Late-stage governance quality affects key-person risk, financing control, and IPO preparedness.
    diligencePath: Request the latest board observer list, voting rights summary, and any governance materials from management or lead investors.
    relatedQuestionRefs:
    - QO005
  - type: private-evidence-only
    severity: material
    topic: arr-disclosure
    missingEvidence: A clean current ARR or revenue-run-rate disclosure for 2025 or 2026, plus gross-margin context.
    whyItMatters: Valuation work later in the report is weaker without a directly disclosed recurring-revenue base.
    diligencePath: Ask management for board-ready revenue dashboards, ARR bridge, and segment mix for software versus payments.
    relatedQuestionRefs:
    - QO011
    - QO025
  - type: private-evidence-only
    severity: minor
    topic: cap-table
    missingEvidence: A post-Series-D cap table with ownership percentages, liquidation preferences, and any secondary components.
    whyItMatters: Investor influence and dilution cannot be judged from public round headlines alone.
    diligencePath: Request the cap table, financing documents, and shareholder-rights summary under NDA.
    relatedQuestionRefs:
    - QO023
    - QO025
  - type: enumeration-incomplete
    severity: material
    topic: TO002 leadership table partial coverage
    missingEvidence: A current executive roster and full board list that would make the leadership table exhaustive rather than partial.
    whyItMatters: Leadership-depth and governance conclusions are weaker when public evidence names only the founder-CEO axis and one later president hire.
    diligencePath: Request the latest leadership org chart, executive bios, and current board roster from management.
    relatedQuestionRefs:
    - QO005
    - QO024
