- id: scale-footprint-and-milestones
  title: Scale signals, footprint expansion, and milestone chronology
  body: 'Public operating signals are relatively strong for a private company. The 2026 Series D announcement said Mews ended 2025 with 15,000 customers, 132,000 monthly active hoteliers, 42.3 million checked-in reservations, $19.7B in platform transaction volume, and 55% SaaS gross-profit growth. The about page separately lists 15,000+ hotels, 1,300+ employees, and properties in 85 countries, while the 2024 president appointment described 1,100 employees in more than 20 countries. Those data points are directionally consistent with rapid growth even if they do not fully resolve the exact present-day org chart or geographic mix. Milestones also show unusual strategic tempo: Prague founding in 2012, first hotel deployment at the Emblem in 2013, first funding in 2016, Series A in 2018, a first acquisition in 2019, the 2022 Series C and investor-board expansion, the 2024 unicorn round, the 2025 DataChat and Flexkeeping acquisitions, and the 2026 Series D plus HotelTechAwards recognition. This
    chronology supports a view of Mews as a scaling, acquisitive platform business rather than a static PMS vendor. '
  claimRefs:
