callouts:
- calloutType: risk
  title: Mews Payments PayFac Structure Creates Opacity and Adverse Customer Experience
  body: >
    A detailed analysis by merchantcostconsulting.com documents that Mews operates as a PayFac,
    not a direct payment processor, meaning hotels are sub-merchants under Mews and have no direct
    relationship with the backend processor (Adyen or Stripe). Mews's merchant terms reserve the right
    to switch the backend processor at its sole discretion without hotel consent. The review describes
    Mews Payments as "convenient but not cheap," with layered markup that hotels cannot independently
    negotiate away. This structure is financially significant for Mews (enabling its ~0.3–0.5% net
    spread on $19.7B in volume) but creates a recurring adverse signal in customer reviews and raises
    questions about whether Mews's open-platform positioning is consistent with the opacity of its
    payments business model.
  claimRefs:
  - CI031
  - CI032
  - CI033

- calloutType: strength
  title: Strong Capital Base Funds Multi-Year Execution Without Near-Term Financing Risk
  body: >
    The $300M Series D at a $2.5B valuation, combined with prior equity raises exceeding $600M,
    gives Mews exceptional capital adequacy by hospitality technology standards. At the median late-stage
    SaaS burn rate of $5M/month for a 1,300+ employee company with active AI R&D and international GTM
    investment, the $300M provides 60 months of runway — well beyond the 18-24 months that investors
    typically require. This capital buffer insulates Mews from near-term macroeconomic headwinds and
    allows it to pursue product acquisitions without dilutive bridge financing.
  claimRefs:
  - CI021
  - CI022
  - CI025
  - CI026

