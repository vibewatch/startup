company:
  name: Mews
chapter:
  number: 4
  title: Financials
  summary: >
    Mews closed a $300M Series D in January 2026 at a $2.5B valuation led by EQT Growth, building on
    55% SaaS gross profit growth and $19.7B in platform transaction volume in 2025. The company generates
    revenue through three primary streams: SaaS subscriptions, payment processing (as a PayFac via Adyen
    and Stripe), and add-on modules. None of these revenue figures are publicly disclosed; all estimates
    are author-derived from public metrics and industry benchmarks. The $300M raise provides estimated
    24-36 months of runway at typical late-stage SaaS burn rates. The primary financial diligence gaps are
    actual ARR, net revenue retention, CAC payback, and the exact take rate on Mews Payments — the latter
    also surfaces as an adverse concern because Mews's PayFac model gives hotels limited visibility into
    the true cost of payment processing.
sections:
- id: revenue-model
  title: Revenue Streams, Pricing Model, and Revenue Mix
  body: >
    Mews earns revenue through three primary streams. The core stream is SaaS subscription fees: hotels
    pay a per-room, per-month fee with pricing tiers ranging from basic (Essentials, 8 marketplace
    integrations) through Advanced and Professional. The publicly confirmed typical rate is approximately
    €9 per room per month for mid-tier plans, though Mews does not publish a full rate card and pricing
    varies by property size, tier, and region. Applied to the stated 15,000 customers, a conservative
    average of 60 rooms per property yields an estimated SaaS ARR range of $90–$120M — explicitly an
    author estimate, not a disclosed metric. The second stream is payment processing: Mews operates as
    a Payment Facilitator (PayFac), onboarding hotels as sub-merchants under Mews while Adyen or Stripe
    handle the actual backend processing. Mews sets the merchant fees and controls the backend processor
    selection at its sole discretion. With $19.7B in platform transaction volume in 2025 and an industry
    blended net-of-backend-cost margin of approximately 0.3–0.5%, this suggests estimated net payments
    revenue of $60–$100M, though neither the volume split nor the net take rate is disclosed. The third
    stream is add-on modules and professional services: RMS, POS, BI, guest messaging, and implementation
    fees, together likely contributing $20–$40M. Mews Spaces generated $537M in ancillary revenue for
    hoteliers (not Mews), but revenue sharing from that product has not been disclosed and should not be
    counted as Mews revenue without confirmation. Total estimated gross revenue is in the $170–$260M range,
    implying an implied revenue multiple of approximately 10–15x at $2.5B valuation.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001

- id: unit-economics
  title: Unit Economics, Gross Margin, and Sales Efficiency
  body: >
    The single disclosed financial indicator is "55% year-over-year SaaS gross profit growth" — a growth
    rate, not an absolute figure. At the SaaS ARR range of $90–$120M and assuming industry-standard SaaS
    gross margins of 71–75% (per 2026 SaaS benchmark data from multiple analyst sources), Mews's SaaS
    gross profit would be in the $64–$90M range. For the payments stream, typical PayFac gross margin after
    passing through Adyen/Stripe costs is 10–25%, implying approximately $6–$25M in payments gross profit
    on $60–$100M gross payments revenue. Combined implied gross profit would be $70–$115M. The $2.5B
    valuation implies 22–36x gross profit multiple, consistent with premium high-growth vertical SaaS
    with embedded payments. On sales efficiency, Mews does not disclose CAC or payback period. The company
    has referenced multi-property deployments of 40 properties in 90 days, suggesting an improved
    implementation economics versus legacy PMS. Industry benchmarks for B2B SaaS at this stage imply
    a CAC payback of 12–18 months for elite performers. Net revenue retention (NRR) is undisclosed;
    median B2B SaaS NRR is 110%+ and top-tier vertical SaaS with embedded payments often achieves 120%+.
    Without actual NRR, it is difficult to underwrite a revenue growth path with confidence.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI003

- id: public-traction
  title: Public Operating Traction and Platform Metrics
  body: >
    Mews disclosed a comprehensive set of operating metrics in the January 2026 Series D announcement.
    In 2025, the company served 15,000 customers across 85 countries with 132,000+ monthly active hoteliers,
    processed 42.3 million checked-in reservations (3.2 million via Mews Kiosk), and handled $19.7 billion
    in platform transaction volume. The $537M in additional hotelier revenue via Mews Spaces (non-room
    reservations through a proprietary booking layer) represents economic value the platform created for
    customers, but is not Mews revenue. These metrics triangulate well with each other: at 15,000 properties
    averaging 42.3M/15,000 = 2,820 reservations per property per year (about 7.7 per day), which is
    reasonable for boutique hotels. The $19.7B/15,000 = approximately $1.3M per property in transaction
    volume, consistent with a mid-sized hotel. Companies House records confirm Mews Systems Limited
    (company number 10355686) filed full accounts to December 31, 2024 on January 31, 2026 — providing
    a filing trail but not yet public detail on audited revenue figures since the accounts are the UK
    subsidiary, not the consolidated group. The revenue quality is rated as high for SaaS subscription
    (recurring, contractual) and medium for payments (transaction volume can be volatile seasonally and
    with occupancy cycles) and lower for professional services (project-based, one-time).
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  tableRefs:
  - TI005
  figureRefs:
  - FI004

- id: capital-adequacy
  title: Capital Adequacy, Runway, and Financing Dependency
  body: >
    Mews raised $300M in its Series D in January 2026 at a $2.5B valuation. Prior to this round, the
    company had raised $110M in March 2024 (Kinnevik led Series C extension), $185M in December 2022
    (Series C, Kinnevik and Goldman Sachs AM), and smaller earlier rounds totalling approximately $600M+
    in lifetime equity. Additionally, a debt facility with Columbia Lake Partners was announced in
    conjunction with the 2022 Series C. The September 2024 Companies House charge registration (MR01)
    confirms active credit facility obligations as of 2024. At an estimated burn rate of $2–$5M per month
    for 1,300+ employees and aggressive R&D/GTM investment, the $300M provides approximately 60–150 months
    of runway — clearly very long. A more realistic pro forma burn accounting for aggressive AI R&D and
    North American GTM investment might be $5–10M/month, providing 30–60 months of runway. Mews publicly
    stated the Series D capital will be used for: (1) AI and agentic automation acceleration, (2) Mews
    Payments and fintech expansion, (3) international expansion into North America and new markets, and
    (4) product development and M&A. The company has made two recent acquisitions (DataChat for generative
    AI analytics; Flexkeeping for housekeeping), and further M&A is implied. This capital adequacy profile
    is strong for a pre-IPO company and implies no near-term financing dependency risk, but the absolute
    magnitude of the raise ($300M) is large relative to current estimated revenue, suggesting the company
    needs multi-year sustained high-growth execution to justify the $2.5B valuation.
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  tableRefs:
  - TI004

- id: financial-gaps-verdict
  title: Financial Gaps, Adverse Evidence, and Verdict
  body: >
    Five major financial diligence blockers prevent a complete underwriting. First, Mews has not disclosed
    ARR or total revenue — all figures in this chapter are author estimates from public operating metrics.
    Second, NRR is undisclosed; it is the single most important indicator of revenue quality and
    valuation justifiability for a subscription business. Third, Mews Payments' net take rate and gross
    margin are not disclosed; the PayFac structure, while legitimate, creates opacity around how much
    Mews earns per dollar of hotel transaction volume. Fourth, sales and marketing efficiency (CAC,
    payback) is undisclosed, making it difficult to assess whether the company is over-investing in growth
    relative to unit economics. Fifth, the UK-subsidiary Companies House accounts do not provide the
    consolidated group financial picture needed for full underwriting. The adverse evidence on Mews
    Payments is material: the merchantcostconsulting.com analysis details that Mews operates as a PayFac
    where hotels have no direct relationship with Adyen or Stripe, Mews sets all fees at its discretion,
    and Mews can switch backend processors without consent — conditions that reviewers describe as
    "not cheap" and potentially exploitative of payment lock-in. While this structure is common in PayFac
    models, it conflicts with Mews's "open platform" marketing narrative and represents a recurring
    complaint in reviews. The overall financial verdict is: revenue quality is strong (SaaS recurring,
    growing 55%+ on gross profit), capital base is robust ($300M raise), but the opacity on key metrics
    prevents full valuation anchoring, and the payments take-rate opacity is a governance diligence ask.
  claimRefs:
  - CI027
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033

