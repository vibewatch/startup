    whyItMatters: "Public sources confirm certifications exist but not their scope, version, or recency, which is essential to underwrite GDPR Article 32 and PCI adequacy."
    diligencePath: "Obtain the SOC 2 report, ISO certificate, and PCI AoC from Mews under NDA; verify auditor, report period, and breach history."
    relatedQuestionRefs:
    - QR005
