  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview and Transmission to Value
        blocks:
          - type: paragraph
            body: >
              This chapter ranks Mews's risks by residual severity — likelihood times impact, net of visible mitigation
              — and traces how each transmits into revenue, customers, margin, financing, and valuation. The
              highest-residual cluster is regulatory/legal and cybersecurity: both are high-likelihood given the
              hospitality sector's breach history and active EU enforcement, and both carry severe, hard-to-cap impact
              (multi-million-euro fines, operational shutdown, reputational loss). The second cluster is competitive and
              execution risk — Oracle OPERA Cloud's incumbency and the documented 2026 shift toward best-of-breed stacks
              threaten Mews's all-in-one consolidation thesis even as it ships new modules. The third cluster is
              financial and valuation opacity: Mews discloses neither ARR nor profitability, so a USD 2.5B valuation
              rests on inference, and payment lock-in complaints raise churn-and-margin questions. Partner/dependency
              risk (Azure, SiteMinder, payment backends, two 2025 acquisitions) and people/execution risk (founder and
              CEO key-person concentration, rapid M&A integration) are individually material and amplify the top
              clusters. The risk heatmap (Figure FR001) scores each category; the transmission map (Figure FR002) shows
              how a single breach or enforcement action cascades into churn, margin compression, financing risk, and a
              valuation re-rate. Every risk below is paired with a monitoring indicator and a thesis-break trigger in
              the mitigation table (Table TR005).
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
