  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >
              The relevant market for Mews spans hospitality property management software (PMS) and its adjacent layers:
              point-of-sale, revenue management systems (RMS), channel management, guest-messaging, payments processing,
              and business intelligence embedded within hotel operations. A narrow PMS-only lens sizes the market at
              $1.73 billion in 2026 (Mordor Intelligence), while a broader hotel and hospitality management software
              definition that includes POS, RMS, and integrated guest tools lands at $4.3 billion (multiple analyst
              estimates). Spend excluded from the hospitality technology market includes general enterprise ERP, generic
              CRM not built for hospitality, facilities HVAC/IoT, and consumer travel booking platforms. Status-quo
              substitutes remain significant: manual spreadsheet-based operations, legacy on-premise installations from
              Oracle Opera, Maestro, and Protel still serve a substantial fraction of the world's estimated 200,000+
              hotel properties, and new competitive pressure comes from well-funded all-in-one suites targeting
              mid-scale chains. The software layer that Mews positions as a replacement for eight-to-ten separate vendor
              systems is the unified hospitality operating environment — a subcategory with no agreed industry label but
              material and growing budget allocation as of 2026.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM012
              - CM019
