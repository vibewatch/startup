  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who Pays and Who Uses Mews — Segmentation
        blocks:
          - type: paragraph
            body: >
              Mews sells to hotels and "shared spaces" operators and is used by front-desk, revenue, housekeeping,
              finance, and operations staff, with the GM or owner typically the economic buyer. The base of 15,000
              customers across 85 countries breaks into several segments. The largest by count is independent and
              boutique hotels (roughly 30-300 rooms), where Mews's modern UX and integrations are the strongest fit. A
              high-profile lifestyle and design-brand segment includes citizenM, Mama Shelter, 25hours Hotels, Ace
              Hotel, and The Social Hub, which give Mews marquee logo proof even where detailed case studies are not
              public. A fast-growing hostel segment includes Generator, Freehand, Amistat, and — via a 2026 North
              American Hostel Association partnership — brands such as Samesun, reflecting deliberate expansion into
              flexible bed-and-room selling. Mews also serves multi-property groups and chains (Strawberry, formerly
              Nordic Choice Hotels, with 225+ hotels), apartments and long-stay (Strawberry Living, Residenzhotel
              Stuttgart), and resorts. Geographically the base is European-weighted with an explicit North American push
              (Ash Hotels, the NAHA partnership). The platform reports 132,000+ monthly active hoteliers, a user metric
              that indicates daily operational reliance rather than seat licenses. The segmentation table (TU001) and
              customer journey figure (FU001) detail buyer, user, and example accounts per segment; the key diligence
              limitation is that Mews does not publish revenue or customer counts by segment, so the revenue
              concentration across these segments cannot be measured from public data.
