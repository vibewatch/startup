      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM Lenses
        blocks:
          - type: paragraph
            body: >
              Multiple analyst sizing lenses exist and should be used together rather than selecting one. The narrowest
              lens — core PMS software globally — produces Mordor Intelligence's $1.73 billion 2026 estimate and The
              Business Research Company's parallel figure of $1.71 billion. The broader hotel management software lens,
              which incorporates RMS, POS, and integrated tools, produces estimates in the $4.0–4.3 billion range from
              Grand View Research and Fortune Business Insights. These figures are not contradictory; they reflect
              different boundary decisions. For Mews, the serviceable addressable market (SAM) is more precisely the
              cloud-first segment of the broader category. Cloud PMS held 64.92% of deployment share in 2025 and is
              growing at 12.38% annually, suggesting a cloud SAM of roughly $1.1 billion within the core PMS market in
              2026. Extending to the broader hotel software pool, the cloud SAM for a unified cloud-native stack could
              approach $2.8 billion. Mews's serviceable obtainable market (SOM) is further constrained by its current
              15,000-property footprint, which represents roughly 7.5% of global hotel properties, and its strongest
              penetration in Europe and English-speaking markets. A reasonable SOM estimate at current trajectory would
              be 10–12% of cloud SAM, or approximately $110–135 million in annual recurring software revenue within the
              next 2–3 years, excluding payments monetisation. Contradictory and higher-end estimates from MarkWide
              Research ($6.8 billion TAM by 2026 for a broad "hospitality PMS" definition) were retained to represent
              the diligence gap in definition consistency across reports.
