      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory and Cybersecurity Risk Are the Highest-Residual Exposures and Are Largely Sector-Structural
            body: >
              The two risks a buyer cannot mitigate away are regulatory enforcement and cybersecurity, because both are
              structural to a European hospitality payments platform. Mews processes guest personal data and card
              payments across the EU, placing it under GDPR Article 32 and PCI DSS v4.0 in a sector where DPAs have
              already imposed 83 accommodation fines totaling ~EUR 22.6M, including Marriott's EUR 20.45M penalty, and
              where cumulative EU fines exceed EUR 7.4B. Simultaneously, the hotel industry is a prime ransomware target
              — MGM's 2023 breach cost ~USD 100M and a USD 45M settlement — and Mews concentrates a hotel's entire
              operation plus payments on one platform, making a breach a multi-property, dual-regime (GDPR+PCI) event.
              Because Mews does not disclose certification scope or breach history, the adequacy of its controls cannot
              be verified from public sources, so this exposure should be underwritten conservatively until SOC 2, ISO
              27001:2022, and PCI v4.0 evidence is reviewed under NDA.
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
              - CR014
              - CR015
              - CR012
          - type: callout
            title: The Competitive and Execution Risk Is That the Market May Be Turning Against All-in-One
            body: >
              Mews's core thesis — consolidate eight-to-ten hotel vendors onto one platform — faces a documented
              headwind. NYU's 2026 Hotel Technology Outlook (with Stayntouch and IDeaS, surveying 300+ professionals)
              found 30% of all-in-one users plan to migrate to best-in-class systems while only 14% plan the reverse,
              citing flexibility, functionality, and control. At the same time the incumbent, Oracle OPERA Cloud, is an
              IDC MarketScape Leader deployed in 233 countries and 21 languages, with deep brand and chain relationships
              Mews must displace. Mews's counter is product velocity (five 2026 modules) and an open API marketplace,
              but it is simultaneously absorbing two acquisitions, so execution bandwidth is stretched. The risk is not
              imminent collapse but a slow erosion of the consolidation narrative: if win-rates against Oracle soften or
              net revenue retention declines as customers unbundle, the growth assumptions underlying the USD 2.5B
              valuation weaken materially.
            calloutType: insight
            claimRefs:
              - CR002
              - CR003
              - CR027
              - CR031
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis for Mews is that it is the emerging category-defining operating system for
              hospitality — an AI-native, cloud platform that consolidates the hotel software stack and embeds payments,
              monetizing both software and transaction volume. The supporting evidence is consistent: 15,000 properties
              across 85 countries, 132,000 monthly active hoteliers, USD 19.7B of 2025 platform payment volume, 55% SaaS
              gross-profit growth, repeated "Best PMS" awards, an open-API marketplace, and USD 537M of ancillary
              revenue generated for hoteliers through Mews Spaces — a tangible network-effect and moat signal. The
              payments layer turns Mews from a pure-SaaS into a vertical SaaS with embedded fintech, the archetype the
              2026 market rewards with the highest multiples. The anti-thesis is equally concrete. First, the entry
              price (~10-15x revenue) already discounts years of flawless execution, leaving little margin of safety.
              Second, financial opacity — no disclosed ARR, margin, or NRR — means the thesis cannot be independently
              tested. Third, structural headwinds (Oracle's incumbency, a documented 2026 shift toward best-of-breed
              stacks, and payment lock-in complaints) threaten the consolidation narrative and could compress retention.
              The recommendation logic (Figure FV001) maps how the evidence resolves into a conditional proceed, and the
              thesis/anti-thesis table (Table TV002) lays the two cases side by side across market, product, customers,
              financials, competition, and risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV011
      - number: '8.2'
        title: Recommendation, Confidence, and Risk Rating
        blocks:
          - type: paragraph
            body: >
              The recommendation is a conditional PROCEED to deeper diligence, not an endorsement of the USD 2.5B entry
              price. Confidence is medium: the qualitative evidence (product leadership, payments moat, growth tempo) is
              strong and well-corroborated, but the quantitative evidence needed to underwrite the price (ARR, gross
              margin, net revenue retention, churn, payment take-rate) is undisclosed, capping confidence. The risk
              rating is medium-high, driven by valuation opacity, regulatory/cybersecurity exposure (Chapter 7), and
              payment-concentration risk. The valuation stance is STRETCHED-BUT-DEFENSIBLE: the ~10-15x implied multiple
              sits above private-SaaS and vertical-SaaS norms and is only justified by an AI-native, embedded-payments,
              30%+-growth narrative that public sources support directionally but cannot confirm. A supportable target
              return therefore depends on entry discipline: at the headline USD 2.5B a buyer underwrites a re-rate to a
              USD 4-5B IPO for upside, while the base case roughly holds value and the bear case loses 30-50%. The
              recommendation is explicitly conditioned on obtaining the financial disclosures listed in the final
              diligence asks (Table TV006); absent them, the price cannot be defended on evidence and the position
              should be sized for the downside. The recommendation summary (Table TV001) records the call, confidence,
              risk rating, valuation stance, and the key investment KPIs visualized in Figure FV004.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV011
              - CV014
              - CV002
              - CV024
      - number: '8.3'
        title: Financing and Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              Mews's USD 2.5B valuation was set in a January 2026 USD 300M Series D led by growth investors including
              EQT, roughly doubling the USD 1.2B mark from its 2024 round and extending a steep multi-round ramp (Prague
              founding 2012, Series C in 2022, unicorn in 2024, Series D in 2026). The round was widely reported as the
              largest hospitality-software raise ever, which signals both momentum and the risk of a late-cycle,
              momentum-driven price. Entry discipline is the central concern: with ARR undisclosed and estimated at USD
              200-250M, the implied ~10-15x revenue multiple leaves no visible margin of safety, and a new investor
              inherits a preference stack from prior rounds whose terms (liquidation preferences, participation,
              ratchets) are not public and could subordinate common or late-entry capital in a downside exit. Public
              evidence supports the price only partially: it confirms scale and growth (USD 19.7B payment volume, 55%
              gross-profit growth, 132,000 active hoteliers) but not the unit economics (margin, NRR, payment take-rate)
              needed to test the multiple. The disciplined posture is to treat the headline number as a ceiling,
              negotiate from the comparable-implied range (Table TV004), and require disclosure of the capitalization
              table and preference overhang before committing. The investment KPI figure (FV004) and the sensitivity
              analysis (FV002) frame how sensitive the conclusion is to the unknown ARR and multiple.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV012
              - CV013
              - CV022
              - CV023
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              The valuation range spans a wide band because the unknown inputs (ARR, growth durability, payment
              retention, exit multiple) dominate the outcome. In the BULL case (USD 4-5B), Mews sustains 30%+ growth
              with high net revenue retention, the AI-native and embedded-payments narrative holds, and it IPOs into a
              receptive market at a premium vertical-SaaS-plus-fintech multiple — the re-rate the current round implies
              investors are underwriting. In the BASE case (USD 2.5-3B), Mews grows steadily but the multiple normalizes
              toward the top of the vertical-SaaS-with-payments band (~8-12x on a larger revenue base), so value roughly
              holds to modestly appreciates. In the BEAR case (USD 1.2-1.8B), growth decelerates or payment-lock-in
              churn rises as customers unbundle toward best-of-breed stacks, and the multiple compresses to
              vertical-SaaS norms (~6-8x), pulling the valuation back toward the 2024 level — a 30-50% loss from entry.
              The probability signals tilt toward the base/bear boundary given the rich entry and the documented
              best-of-breed shift, but the bull case is live because the payments moat and AI positioning are genuine.
              The downside triggers are a net-revenue-retention decline, a payment-volume contraction, a material
              security or regulatory event, or a financing-market freeze ahead of the IPO. The scenario table (Table
              TV003), the valuation/return range (Figure FV003), and the sensitivity bars (Figure FV002) quantify the
              band and its drivers.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: table
            tableRef: TV003
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
      - number: '8.5'
        title: Comparable Set and Multiple Triangulation
        blocks:
          - type: paragraph
            body: >
              Mews's valuation is best triangulated against three reference sets. First, hospitality-SaaS peers:
              Cloudbeds (~27,000 properties, an estimated USD 291M revenue, private and last priced in 2021), SiteMinder
              (an estimated USD 229.8M revenue, public on the ASX), Oracle Hospitality / OPERA Cloud (an estimated USD
              228.6M revenue within Oracle), and Guesty (an estimated USD 164.6M revenue, ~USD 900M valuation). Against
              these, Mews's USD 2.5B price implies a materially higher revenue multiple than peers carry, reflecting its
              growth, payments attach, and AI positioning. Second, SaaS multiple benchmarks: 2026 private SaaS trades at
              a ~4.2x ARR median (7-10x top quartile), so Mews's implied ~10-15x sits well above the general market.
              Third, vertical-SaaS-with-embedded-payments benchmarks, the most apt comparison: 2026 vertical SaaS sold
              at a 41% premium to horizontal SaaS, with healthcare IT at 8.5x, construction at 7.5x, and legal at 7.0x
              revenue — software that "owns the workflow and payment rails" of an industry. Even at the top of that band
              (~8.5x), a USD 2.5B value would require ~USD 290M+ of revenue, above the USD 200-250M estimate, implying
              Mews is priced on forward growth rather than current revenue. The comparable valuation table (Table TV004)
              enumerates the peer set, and the conclusion is that the price is defensible only on a forward, AI-native,
              payments-led thesis, not on trailing comparables.
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
          - type: table
            tableRef: TV004
            claimRefs:
              - CV021
              - CV022
              - CV023
              - CV024
      - number: '8.6'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Mews is being managed toward an IPO within the next few years, and the Series D was explicitly framed as
              pre-IPO scaling capital, so the most likely exit is a public listing, with a strategic acquisition (by a
              payments, travel-tech, or enterprise-software acquirer) as the alternate path. Exit readiness is advanced
              on narrative and scale but unproven on the disclosure and governance maturity a listing requires, and the
              undisclosed financials are the single biggest gap between the current state and an underwritable exit. The
              thesis-break triggers (Table TV005) that would change the recommendation are: net revenue retention
              falling below ~100%, a payment-volume or take-rate contraction, a material security breach or GDPR/PCI
              enforcement action, sustained win-rate loss to Oracle or best-of-breed stacks, or a financing freeze that
              pushes the IPO out. The final diligence asks (Table TV006) are the disclosures required to convert the
              conditional proceed into a priced decision: audited financials and ARR; gross margin and the payments
              take-rate and gross margin; net revenue retention and logo/revenue churn; the full capitalization table
              and preference stack; SOC 2 Type 2, ISO 27001:2022, and PCI v4.0 evidence; and a customer and revenue
              split by geography. Obtaining these resolves most of the opacity that currently caps confidence and would
              allow the valuation to be defended — or rejected — on evidence rather than narrative.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV005
            claimRefs:
              - CV026
              - CV027
              - CV028
          - type: table
            tableRef: TV006
            claimRefs:
              - CV029
              - CV030
              - CV015
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional PROCEED — Strong Asset, Stretched Price, Confidence Gated on Financial Disclosure
            body: >
              The recommendation is a conditional PROCEED to deeper diligence, not an endorsement of the USD 2.5B entry
              price. Mews is a genuinely strong asset — a vertical SaaS with an embedded-payments moat (USD 19.7B
              volume, USD 537M of Spaces ancillary revenue), category-leading product, and 55% SaaS gross-profit growth
              — and that profile is exactly what the 2026 market rewards with premium multiples. But the implied ~10-15x
              revenue multiple sits well above private-SaaS (~4.2x) and even vertical-SaaS-with-payments (~5.8-8.5x)
              norms, so the price is defensible only on a forward, AI-native, 30%+-growth thesis that public sources
              support directionally but cannot confirm. Confidence is therefore medium and explicitly gated on obtaining
              ARR, margin, NRR, the cap table/preference stack, and certification evidence. A disciplined buyer treats
              the headline number as a ceiling, negotiates from the comparable-implied range, and is prepared to walk if
              the disclosures reveal sub-100% NRR, thin payments margin, or a heavy preference overhang.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV022
          - type: callout
            title: The Valuation Embeds Little Margin of Safety and the Downside Is Unquantifiable from Public Sources
            body: >
              The core valuation risk is the combination of a rich entry and pervasive opacity. At ~10-15x inferred
              revenue, Mews is priced for years of flawless execution, yet a buyer cannot test the multiple because ARR,
              gross margin, net revenue retention, and the payments take-rate are all undisclosed, and the preference
              stack from prior rounds is not public. If growth normalizes or payment-lock-in churn rises as customers
              unbundle toward best-of-breed stacks — a documented 2026 trend — the multiple could compress to
              vertical-SaaS norms (~6-8x) and pull the valuation back toward its 2024 USD 1.2B level, a 30-50% loss from
              entry. Because the bear case cannot be ruled out on public evidence, the position should be sized for the
              downside and conditioned on the financial disclosures in the final diligence asks table before any capital
              is committed at the headline price.
            calloutType: risk
            claimRefs:
              - CV012
              - CV018
              - CV025
              - CV030
