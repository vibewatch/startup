      - number: '4.5'
        title: Financial Gaps, Adverse Evidence, and Verdict
        blocks:
          - type: paragraph
            body: >
              Five major financial diligence blockers prevent a complete underwriting. First, Mews has not disclosed ARR
              or total revenue — all figures in this chapter are author estimates from public operating metrics. Second,
              NRR is undisclosed; it is the single most important indicator of revenue quality and valuation
              justifiability for a subscription business. Third, Mews Payments' net take rate and gross margin are not
              disclosed; the PayFac structure, while legitimate, creates opacity around how much Mews earns per dollar
              of hotel transaction volume. Fourth, sales and marketing efficiency (CAC, payback) is undisclosed, making
              it difficult to assess whether the company is over-investing in growth relative to unit economics. Fifth,
              the UK-subsidiary Companies House accounts do not provide the consolidated group financial picture needed
              for full underwriting. The adverse evidence on Mews Payments is material: the merchantcostconsulting.com
              analysis details that Mews operates as a PayFac where hotels have no direct relationship with Adyen or
              Stripe, Mews sets all fees at its discretion, and Mews can switch backend processors without consent —
              conditions that reviewers describe as "not cheap" and potentially exploitative of payment lock-in. While
              this structure is common in PayFac models, it conflicts with Mews's "open platform" marketing narrative
              and represents a recurring complaint in reviews. The overall financial verdict is: revenue quality is
              strong (SaaS recurring, growing 55%+ on gross profit), capital base is robust ($300M raise), but the
              opacity on key metrics prevents full valuation anchoring, and the payments take-rate opacity is a
              governance diligence ask.
            claimRefs:
              - CI027
              - CI028
              - CI029
              - CI030
              - CI031
              - CI032
              - CI033
      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Mews Payments PayFac Structure Creates Opacity and Adverse Customer Experience
            body: >
              A detailed analysis by merchantcostconsulting.com documents that Mews operates as a PayFac, not a direct
              payment processor, meaning hotels are sub-merchants under Mews and have no direct relationship with the
              backend processor (Adyen or Stripe). Mews's merchant terms reserve the right to switch the backend
              processor at its sole discretion without hotel consent. The review describes Mews Payments as "convenient
              but not cheap," with layered markup that hotels cannot independently negotiate away. This structure is
              financially significant for Mews (enabling its ~0.3–0.5% net spread on $19.7B in volume) but creates a
              recurring adverse signal in customer reviews and raises questions about whether Mews's open-platform
              positioning is consistent with the opacity of its payments business model.
            calloutType: risk
            claimRefs:
              - CI031
              - CI032
              - CI033
          - type: callout
            title: Strong Capital Base Funds Multi-Year Execution Without Near-Term Financing Risk
            body: >
              The $300M Series D at a $2.5B valuation, combined with prior equity raises exceeding $600M, gives Mews
              exceptional capital adequacy by hospitality technology standards. At the median late-stage SaaS burn rate
              of $5M/month for a 1,300+ employee company with active AI R&D and international GTM investment, the $300M
              provides 60 months of runway — well beyond the 18-24 months that investors typically require. This capital
              buffer insulates Mews from near-term macroeconomic headwinds and allows it to pursue product acquisitions
              without dilutive bridge financing.
            calloutType: strength
            claimRefs:
              - CI021
