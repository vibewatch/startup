      - number: '1.5'
        title: Visible execution risks and what still needs diligence
        blocks:
          - type: paragraph
            body: >-
              The biggest near-term risk is not lack of momentum but whether execution quality stays aligned with an
              increasingly ambitious narrative. Official materials now emphasize agent-driven automation, AI, embedded
              payments, and broader operating-system coverage, while independent analysis of the DataChat acquisition
              points out that semi-autonomous workflows raise data-quality, integration, and oversight challenges.
              Customer feedback is also mixed rather than uniformly glowing. Trustpilot includes strongly negative
              complaints around card charges, support, and product complexity, while Software Advice highlights more
              moderate concerns around interface design, cancellation flows, and upsell constraints. A status-monitoring
              source also showed multiple June 2026 incidents tied to Booking.com, Expedia, and reservation display
              issues, suggesting that at Mews’s scale, third-party integration reliability remains material. None of
              this erases the company’s traction, but it does shape diligence priorities. Investors should treat current
              board composition, exact headcount and functional mix, precise ARR disclosure, and the operational reality
              behind the AI story as follow-up items rather than settled facts. Mews looks like a strong late-stage
              platform company, but not yet one with perfect public transparency. 
