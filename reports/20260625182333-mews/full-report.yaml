      - number: '7.3'
        title: Operational, Quality, and Cybersecurity Risk
        blocks:
          - type: paragraph
            body: >
              Operational risk for Mews is concentrated in two places: platform reliability and cybersecurity. Because
              Mews consolidates a hotel's reservations, check-in, housekeeping, POS, and payments onto one Azure-hosted
              platform, any outage halts the property's entire operation — front desk, room access, and card processing
              — exactly the failure mode seen when MGM Resorts was attacked in 2023, shutting check-in, digital keys,
              and payments for days. Mews publishes a 24-hour Recovery Time Objective and a live status page, but no
              public SLA, RPO, or historical uptime data is available to size the operational tail. Cybersecurity risk
              is sector-wide and severe: the MGM breach cost an estimated USD 100M in operational losses and a USD 45M
              settlement covering ~37M customers, and was executed through social engineering — Scattered Spider phoned
              the help desk and obtained admin access to Okta and Azure within ten minutes. Industry surveys indicate
              roughly 31% of hospitality businesses have suffered a breach, with PMS, POS, and payment workflows the
              primary attack surface and third-party/vendor desks a growing vector. Mews's integrated payments make it a
              high-value target: a compromise would expose card and guest data across thousands of properties at once.
              The operational/security risk register (Table TR002) ranks these exposures; the dependency map (Figure
              FR003) shows where reliability is inherited from third parties.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
