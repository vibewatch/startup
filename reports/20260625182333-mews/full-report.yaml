      - number: '6.4'
        title: Retention, Satisfaction, and Durability Signals
        blocks:
          - type: paragraph
            body: >
              Durability evidence for Mews is strong on satisfaction but thin on hard retention metrics. On
              satisfaction, Mews is externally validated across the major independent review platforms: Best PMS at the
              HotelTechAwards three years running (2024-2026) on the strength of verified hotelier reviews, Capterra
              4.6/5, Software Advice 4.6/5 (ease of use 4.7, value 4.5, customer support 4.3), and G2 4.5/5, with
              HotelTechReport aggregating roughly 4,500 reviews. Reviewers consistently praise the modern UX, fast
              training, automation (online check-in/out, kiosk, real-time updates), and the 1,000+ integration
              marketplace. Land-and-expand behaviour is visible in references — Strawberry, Ash Hotels, and Crown Group
              (six London properties) all grew property counts on Mews — which is a proxy for retention and account
              expansion. However, Mews discloses no net revenue retention, gross retention, churn, renewal rate, or
              contract-length data, so the single most important durability metric for a subscription business is
              absent. Adverse durability signals are real and recurring: Software Advice's 4.3 support score and
              Capterra reviews flag slower or less proactive support for smaller properties, hoteltechinsight notes cost
              creep when many add-ons are stacked, and Trustpilot carries critical reviews on payments and support. The
              satisfaction table (TU004) and review-score figure (FU004) summarize these signals; the absence of
              disclosed retention metrics is carried into evidenceGaps as a material durability gap.
