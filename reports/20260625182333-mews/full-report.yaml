              - CM037
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Cloud Migration Wave Is Accelerating TAM Expansion
            body: >
              The cloud-to-SaaS migration rate is the single most powerful structural tailwind in the hospitality
              technology market: cloud PMS is expanding at 12.38% CAGR vs. the 7.05% overall market rate, meaning every
              year cloud doubles its share of a growing pool. This creates compounding pipeline for cloud-native vendors
              like Mews as the legacy install base — still roughly 35% of the market in on-premise deployments —
              converts on a predictable depreciation cycle. The 51% of hoteliers planning a tech stack replacement in
              the next 12–24 months confirms that near-term pipeline density is unusually high by historical standards.
            calloutType: strength
            claimRefs:
              - CM003
              - CM004
              - CM017
          - type: callout
            title: All-in-One Platform Model Faces Structural Churn Risk per 2026 Academic Study
            body: >
              The NYU Tisch Center of Hospitality 2026 study — co-authored with Stayntouch and IDeaS, both Mews
              competitors — presents a direct challenge to Mews's unified operating system positioning. The study of
              300+ hotel professionals found that 30% of all-in-one platform users plan to switch to best-in-class
              integrated stacks, more than double the 14% reverse rate. All-in-one users also report higher booking
              error rates (57% vs. 45%) and more check-in delays (46% vs. 23%). While Mews argues its platform
              eliminates silos better than legacy all-in-ones, the study's finding that best-in-class yields higher PMS
              satisfaction (70% vs. 55%) and stronger retention suggests Mews must demonstrate its unified approach
              genuinely outperforms best-of-breed before large-scale chain adoption becomes reliable.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM020
              - CM034
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Taxonomy
        blocks:
          - type: paragraph
            body: >
              The hospitality PMS and operating-system market contains five meaningful competitive categories relevant
              to Mews. First, enterprise incumbents — primarily Oracle Hospitality OPERA Cloud and Shiji Group — serve
              large chains with deep feature sets, proprietary integration ecosystems, and decades of brand trust, but
              are slower to innovate on UX and automation. Second, all-in-one SMB champions, led by Cloudbeds (27,000
              properties, 150+ countries), serve the independent and sub-100-room market with simpler, lower-cost
              suites. Third, API-first pure-play vendors like Apaleo (1,700+ properties) target technology-forward
              operators who want modular best-of-breed composability rather than a unified platform. Fourth, regional or
              niche players (HOTELTIME, StayNTouch, RoomRaccoon, Maestro) serve specific geographies or property types.
              Fifth, the status-quo alternative — legacy on-premise PMS from Protel, Amadeus, and older Oracle
              on-premise installations — still holds roughly 35% of the global install base and represents Mews's
              primary organic displacement opportunity. Likely new entrants in the 2026–2028 window include general AI
              orchestration platforms (e.g., Salesforce AI Cloud) that could embed hotel workflow automation on top of
              existing industry-specific CRM relationships, and travel OTA giants (Booking.com, Expedia) that may build
              operational tools to deepen their hotel relationships.
