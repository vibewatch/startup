      - number: '1.1'
        title: Identity, founding story, and product scope
        blocks:
          - type: paragraph
            body: >-
              Mews describes itself as the operating system for hospitality rather than merely a property management
              system, and that framing is well supported by the current product surface. The homepage and 2026 company
              press materials describe a cloud-native platform spanning PMS, POS, RMS, housekeeping, payments, guest
              journey tooling, and an open integration marketplace. That matters because it positions Mews against both
              legacy hotel software and narrower point solutions. The official story is also unusually coherent: founder
              Richard Valtr says the company began in Prague after he grew frustrated with the manual night-audit
              routines at his family hotel, while Matthijs Welle joined with his own hotel-operations background to
              build a modern back-end rather than a superficial guest-facing app. Independent founder interviews and
              Fortune/Yahoo coverage reinforce that origin story and help explain why Mews still emphasizes automation,
              payments, and the removal of operational friction. Taken together, the evidence supports a clear company
              identity: Mews is a hospitality infrastructure platform built by former hoteliers to replace fragmented
              legacy systems with a single operating layer for modern properties.
