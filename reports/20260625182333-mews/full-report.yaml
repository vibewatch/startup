      - number: '5.5'
        title: Differentiation, Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: >
              Mews's differentiation rests on three pillars: an open-API platform with a large no-fee integration
              marketplace, embedded payments that turn the PMS into a fintech surface, and an AI-native single data
              model that competitors built on legacy architecture struggle to match. The open API ("built in parallel,
              not bolted on") and webhook real-time data are the clearest technical differentiators versus legacy
              systems, while Mews Payments and Mews Spaces ($537M of ancillary revenue generated for hoteliers) are the
              economic moat. On trust and compliance, Mews publishes a SafeBase-hosted trust center asserting SOC 2, ISO
              27001, PCI DSS, GDPR, CCPA, SOX, and NIST alignment; its help center documents PCI DSS compliance for card
              handling, and French NF525 anti-fraud certification supports POS deployments in France. The trust center
              states a 24-hour RTO and standard controls (two-factor authentication, DDoS and brute-force protections).
              The critical diligence caveat is that public sources confirm the existence of these certifications but not
              their current scope, type, or audit dates — for example, whether SOC 2 is Type 2, the ISO 27001 revision
              (2022), the PCI DSS version (v4.0), and which entities and products each certificate covers. Mews's PayFac
              payment model, praised for convenience, is also a recurring adverse signal on cost and lock-in. The
              compliance table (TE004) records each control's status, scope, and the verification gap, and these
              unverified scopes are carried into evidenceGaps for commercial and security diligence.
