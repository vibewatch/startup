      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: All-in-One Structural Headwind Could Erode Mews's Mid-Market Moat
            body: >
              The NYU Tisch Center 2026 study found all-in-one PMS users switching to best-in-class at 30% intent rate,
              more than double the 14% reverse migration. This structural finding is directly adverse to Mews's unified
              operating-system positioning. Additionally, all-in-one users report more booking errors (57% vs 45%) and
              check-in delays (46% vs 23%), which are operational metrics hoteliers directly observe. Mews must either
              demonstrate its unified model avoids these failure modes through better data architecture or invest in a
              credible best-of-breed narrative for enterprise buyers — otherwise its net retention among 101–250 room
              properties may underperform best-in-class stack vendors over the 2026–2028 period.
            calloutType: risk
