      - number: '5.3'
        title: Architecture, Open APIs, and the Developer Surface
        blocks:
          - type: paragraph
            body: >
              Mews is a cloud-native application hosted on Microsoft Azure, built from the start as multi-tenant SaaS
              rather than retrofitted from on-premise software. The defining architectural choice is its open API
              surface: Mews exposes five public APIs — the general-purpose Connector API, the Channel Manager API, the
              Booking Engine API, the POS API, and the Loyalty Partner API — each documented on docs.mews.com, whose
              source lives in the public GitHub monorepo MewsSystems/open-api-docs and is published via GitBook.
              Authentication uses a ClientToken plus AccessToken model, and integrators get a demo/sandbox environment
              to prototype before going live. Real-time propagation is delivered through webhooks that push changes
              (reservations, spend, guest profiles, payments) to connected systems as soon as they occur, which is the
              technical basis for the "single data model" claim. The developer ecosystem is a genuine moat signal: Mews
              advertises 1,000+ marketplace integrations with no connection fees, and partners receive a Partner ID and
              must certify integrations before listing. Public developer-signal sources (the GitHub repo, APItracker's
              profile, and the Mews status page) confirm the API documentation, webhook management, and an operational
              status surface, though APItracker notes Mews does not expose some developer conveniences (no public
              GraphQL playground, OAuth playground, or open-source SDKs listed). Beyond "Azure cloud-native" and the API
              contract, deeper architecture — data residency, microservice topology, scaling design — is not publicly
              documented and is recorded as an evidence gap.
