              Leadership visibility is strongest around Richard Valtr and CEO Matthijs Welle, both of whom appear
              consistently across official pages, funding announcements, and founder interviews as the strategic faces
              of the company. Public sources also show that Mews broadened its operating bench by appointing Michael
              Coscetta as president in 2024 after his senior roles at Paxos, Compass, and Square. That move suggests the
