      - number: '4.4'
        title: Capital Adequacy, Runway, and Financing Dependency
        blocks:
          - type: paragraph
            body: >
              Mews raised $300M in its Series D in January 2026 at a $2.5B valuation. Prior to this round, the company
              had raised $110M in March 2024 (Kinnevik led Series C extension), $185M in December 2022 (Series C,
              Kinnevik and Goldman Sachs AM), and smaller earlier rounds totalling approximately $600M+ in lifetime
              equity. Additionally, a debt facility with Columbia Lake Partners was announced in conjunction with the
              2022 Series C. The September 2024 Companies House charge registration (MR01) confirms active credit
              facility obligations as of 2024. At an estimated burn rate of $2–$5M per month for 1,300+ employees and
              aggressive R&D/GTM investment, the $300M provides approximately 60–150 months of runway — clearly very
              long. A more realistic pro forma burn accounting for aggressive AI R&D and North American GTM investment
              might be $5–10M/month, providing 30–60 months of runway. Mews publicly stated the Series D capital will be
              used for: (1) AI and agentic automation acceleration, (2) Mews Payments and fintech expansion, (3)
              international expansion into North America and new markets, and (4) product development and M&A. The
              company has made two recent acquisitions (DataChat for generative AI analytics; Flexkeeping for
              housekeeping), and further M&A is implied. This capital adequacy profile is strong for a pre-IPO company
              and implies no near-term financing dependency risk, but the absolute magnitude of the raise ($300M) is
              large relative to current estimated revenue, suggesting the company needs multi-year sustained high-growth
              execution to justify the $2.5B valuation.
            claimRefs:
