      - number: '7.2'
        title: Regulatory and Legal Risk — Privacy, Payments, and Enforcement
        blocks:
          - type: paragraph
            body: >
              Mews's regulatory exposure is double-barrelled. As a processor of guest personal data, it is bound by GDPR
              — including Article 32's obligation to implement appropriate technical and organizational security
              measures — and as a payment facilitator it must maintain PCI DSS v4.0 compliance for cardholder data. The
              accommodation and hospitality sector is a live enforcement target: a law-firm enforcement tracker records
              83 GDPR fines across 15 countries totaling roughly EUR 22.6M, led by the Spanish DPA, with the largest
              being the UK ICO's EUR 20.45M fine against Marriott (≈339M guest records exposed) and CNIL's EUR 600K fine
              against ACCOR for unlawful marketing processing; Booking.com was fined EUR 475K for late breach
              notification. Cumulative European GDPR penalties have surpassed EUR 7.4B, and regulators now treat
              enforcement — including data-sovereignty and breach-reporting expectations — as routine rather than
              sporadic. For Mews, the legal-risk transmission is direct: a single qualifying breach or a finding of
              inadequate Article 32 controls could trigger a fine, mandatory notification, customer churn, and PCI
              scheme penalties simultaneously. Mews advertises PCI DSS, SOC 2, ISO 27001:2022, GDPR, and NF525
              compliance, but public sources do not disclose certification scope, version, or audit dates, so the
              adequacy of its controls cannot be independently underwritten. The regulatory/legal risk register (Table
              TR001) enumerates each regime, exposure, and the residual diligence gap.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
