      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Open API and No-Fee Marketplace Are a Genuine, Verifiable Technical Moat
            body: >
              Unlike legacy PMS vendors, Mews exposes five public APIs (Connector, Channel Manager, Booking Engine, POS,
              Loyalty Partner) with documentation hosted on docs.mews.com and source-controlled in the public GitHub
              monorepo MewsSystems/open-api-docs, plus webhooks for real-time event propagation and a sandbox for safe
              prototyping. The 1,000+ integration marketplace with no connection fees is a structural advantage: it
              lowers switching friction for partners and compounds platform stickiness. This is one of the few Mews
              claims that is independently verifiable from developer-signal sources (GitHub, APItracker, the live status
              page), which materially de-risks the "open platform" narrative relative to competitors whose integrations
              are gated or fee-based.
