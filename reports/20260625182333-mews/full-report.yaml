      - number: '3.3'
        title: Capability Comparison, Pricing, and GTM Differentiation
        blocks:
          - type: paragraph
            body: >
              Mews is positioned as a cloud-native unified platform with the broadest functional scope among
              challengers: its post-Unfold 2026 stack now covers PMS, POS, RMS, channel management (via SiteMinder
              partnership), guest messaging, business intelligence, accounting/AR, and payments. Oracle OPERA Cloud
              offers a comparable functional scope but through a composable enterprise architecture rather than a single
              unified data model, and is considered harder to deploy and maintain for smaller properties. Cloudbeds
              provides PMS plus channel manager plus booking engine in a flat-subscription model ($200-400/month for
              20-50 rooms), with pricing that is materially lower than Mews at the small-property tier. Mews pricing is
              typically €9/room/month for mid-tier plans, which makes it more expensive than Cloudbeds for small hotels
              but competitive at the 50–300-room scale where automation ROI offsets the premium. Apaleo's pricing at
              €2/room/day (roughly €60/room/month) is the most expensive on a per-room basis but attracts high-value,
              tech-forward properties willing to pay for composability. Key capability differentiators favoring Mews
              include its 1,000+ integration marketplace, embedded payments with no third-party fees, and modern UX with
              a 4.7/5 user rating — higher than Oracle's 4.6/5. Key gap: Mews currently lacks the enterprise
              customization depth Oracle provides for large chain brands, and some customers report that once an invoice
