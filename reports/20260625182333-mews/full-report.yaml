        title: Deployment, Integrations, Reliability, and Roadmap
        blocks:
          - type: paragraph
            body: >
              Mews deploys as a browser-based SaaS, so onboarding is a data-migration and configuration exercise rather
              than an install; the company emphasizes multi-property management "in a single call" through its APIs.
              Integration breadth is the deployment story: 1,000+ marketplace apps and the new native SiteMinder channel
              connection bring distribution, locks, and ancillary tools into one workflow. Reliability is surfaced
              publicly through status.mews.com, which reports component-level operational status for the Open API and
              other services; a recorded incident references a third-party dependency on Assa Abloy/Vostio for digital
              key creation, illustrating that Mews's reliability is partly a function of integration partners it does
              not control. The Mews trust center states a 24-hour Recovery Time Objective. The 2026 roadmap is unusually
              dense: at Unfold 2026 (27 May 2026) Mews launched five new products, including Mews RMS, the SiteMinder
              Channel Manager, and Accounts Receivable, and the Flexkeeping housekeeping workflow builder is slated for
              advanced capabilities through 2026. The DataChat acquisition (November 2025) feeds an agentic-AI roadmap
              where intelligent agents are intended to manage day-to-day operations. The roadmap table (TE005) separates
              shipped-and-dated releases from forward-looking capability claims. The central reliability and roadmap
              diligence question is execution risk: several flagship modules are months old, integration of two 2025
              acquisitions is ongoing, and public reliability data (uptime history, SLA terms, RTO/RPO evidence) is thin
              relative to the breadth of the operational dependency hotels take on.
