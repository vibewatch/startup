        title: Unit Economics, Gross Margin, and Sales Efficiency
        blocks:
          - type: paragraph
            body: >
              The single disclosed financial indicator is "55% year-over-year SaaS gross profit growth" — a growth rate,
              not an absolute figure. At the SaaS ARR range of $90–$120M and assuming industry-standard SaaS gross
              margins of 71–75% (per 2026 SaaS benchmark data from multiple analyst sources), Mews's SaaS gross profit
              would be in the $64–$90M range. For the payments stream, typical PayFac gross margin after passing through
              Adyen/Stripe costs is 10–25%, implying approximately $6–$25M in payments gross profit on $60–$100M gross
              payments revenue. Combined implied gross profit would be $70–$115M. The $2.5B valuation implies 22–36x
              gross profit multiple, consistent with premium high-growth vertical SaaS with embedded payments. On sales
              efficiency, Mews does not disclose CAC or payback period. The company has referenced multi-property
              deployments of 40 properties in 90 days, suggesting an improved implementation economics versus legacy
              PMS. Industry benchmarks for B2B SaaS at this stage imply a CAC payback of 12–18 months for elite
              performers. Net revenue retention (NRR) is undisclosed; median B2B SaaS NRR is 110%+ and top-tier vertical
              SaaS with embedded payments often achieves 120%+. Without actual NRR, it is difficult to underwrite a
              revenue growth path with confidence.
