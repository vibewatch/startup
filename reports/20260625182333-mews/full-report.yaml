      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The buyer structure in hospitality technology is three-way: the property owner or management company makes
              the purchase decision, the general manager or operations lead is the primary user, and the investor or
              franchisor often sets the technology standards that filter the evaluation. Independent properties (hotels
              not part of a brand or chain) represent 51.45% of PMS market spend in 2025 and are growing at 11.62% CAGR,
              making them the largest and fastest-growing segment for cloud-first vendors like Mews. Small and medium
              properties — fewer than 100 rooms — tend toward all-in-one solutions for simplicity; 54% of sub-100-room
              properties use all-in-one platforms in 2026. Larger independent hotels (101–250+ rooms) lean toward
              best-in-class integrated systems at a 68% rate, seeking scalability and data precision. Chain hotels
              account for 39–45% of hospitality software spend with the highest per-property budgets, but their
              decisions are slower and often require enterprise procurement processes. Resorts and multi-outlet
              properties are the highest per-property spenders, demanding complex ancillary-revenue and F&B modules in
              addition to core PMS. Budget ownership sits with the general manager for independent properties and with
              IT/procurement for chains; the trigger for adoption shifts is typically either a lease renewal, a major
              renovation cycle, labor-cost pressure, or a franchise standard mandate. Mews targets the independent and
              boutique segment as primary, with mid-scale groups as the secondary conversion opportunity.
            claimRefs:
              - CM006
              - CM013
              - CM014
              - CM015
              - CM016
