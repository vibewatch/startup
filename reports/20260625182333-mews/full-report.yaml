            body: >
              Mews publishes over 100 customer success stories, and several are detailed, recent, production-grade
              references rather than logos. Strawberry (formerly Nordic Choice Hotels, 225+ hotels, 18,000 employees) is
              the flagship enterprise reference: it cut staff training from up to four days to mostly digital learning,
              runs centralized dynamic pricing across all hotels, shares guest history across properties, uses up to 21
              integrations per property, and reports a chargeback rate well below the industry average. Ash Hotels (US)
              frames Mews as a commercial reset, citing an estimated $15K annual OTA savings and portfolio-wide
              standardization that made onboarding repeatable by the time its Ulysses hotel went live. CityHub built an
              RFID-wristband payment and room-key experience on the Mews Open API and automates 80% of property
