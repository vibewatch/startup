      - number: '6.5'
        title: Expansion, Concentration, and Procurement Risk
        blocks:
          - type: paragraph
            body: >
              Mews's expansion motion is land-and-expand within multi-property groups: a hotel adopts Mews, then
              standardizes users, rates, and central administration across its portfolio (Strawberry across 225+ hotels,
              Ash Hotels across its growing portfolio, Crown Group across six London properties), and layers on modules
              (RMS, Payments, Spaces, Channel Manager) that raise account value over time. Mews Payments is the most
              important expansion lever and the most important concentration risk: it powers a large share of
              transaction volume (CityHub automates 80% of transactions through it), but reviewers describe a payment
              lock-in where flows are optimized for Mews Payments and dual-processing or switching is cumbersome and
              costly. Geographic concentration is a second risk — the base is European-weighted despite the 85-country
              footprint, so the North American expansion (NAHA, Ash) is both an opportunity and an execution dependency.
              Procurement friction historically favored incumbents because PMS migration is feared as slow and risky,
              but Mews has turned fast onboarding (two days for Amistat, two weeks per Strawberry property) into a
              competitive wedge that lowers switching friction. Channel and partner dependence is rising with the
              SiteMinder distribution partnership and the 1,000+ integration marketplace, which improves stickiness but
              inherits partner reliability. The expansion/concentration table (TU005) rates each factor. The core
              concentration-risk diligence asks are payments lock-in economics, top-customer and segment revenue
              concentration (undisclosed), and the durability of European versus North American cohorts.
