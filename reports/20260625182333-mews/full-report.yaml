      - number: '6.2'
        title: Adoption Trajectory and Platform Engagement
        blocks:
          - type: paragraph
            body: >
              Mews's adoption story is one of sustained scaling: the customer base has grown from roughly 5,000
              properties in earlier years to 15,000 across 85 countries, and the platform now reports 132,000+ monthly
              active hoteliers. Engagement metrics disclosed in the January 2026 Series D announcement show genuine
              production usage rather than shelfware: 42.3 million checked-in reservations in 2025 (3.2 million via Mews
              Kiosk), $19.7 billion in platform transaction volume, and $537 million in ancillary revenue generated for
              hoteliers through Mews Spaces. Deployment velocity is a distinctive adoption signal — Strawberry brought
              four 400-600 room hotels live on a single day while fully booked, can set up additional properties in as
              little as two weeks, and added 30 rooms to one property's PMS in minutes after renovation; Amistat went
              live after just two days of training. These data points triangulate to a picture of broad, active,
              multi-property deployment. Award momentum reinforces the trajectory: Best PMS at the HotelTechAwards in
              2024, 2025, and 2026, a feat HotelTechReport's co-founder called "exceptionally difficult" given the
              category's competitiveness. The adoption table (TU002) and deployment flow (FU002) structure these
              metrics. The principal gap is that Mews discloses aggregate engagement but not net adds, gross churn, or
              segment-level growth, so the rate and durability of new-logo acquisition versus expansion within existing
              accounts cannot be separated from public sources.
