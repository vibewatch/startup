  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Model, and Revenue Mix
        blocks:
          - type: paragraph
            body: >
              Mews earns revenue through three primary streams. The core stream is SaaS subscription fees: hotels pay a
              per-room, per-month fee with pricing tiers ranging from basic (Essentials, 8 marketplace integrations)
              through Advanced and Professional. The publicly confirmed typical rate is approximately €9 per room per
              month for mid-tier plans, though Mews does not publish a full rate card and pricing varies by property
              size, tier, and region. Applied to the stated 15,000 customers, a conservative average of 60 rooms per
              property yields an estimated SaaS ARR range of $90–$120M — explicitly an author estimate, not a disclosed
              metric. The second stream is payment processing: Mews operates as a Payment Facilitator (PayFac),
              onboarding hotels as sub-merchants under Mews while Adyen or Stripe handle the actual backend processing.
              Mews sets the merchant fees and controls the backend processor selection at its sole discretion. With
              $19.7B in platform transaction volume in 2025 and an industry blended net-of-backend-cost margin of
              approximately 0.3–0.5%, this suggests estimated net payments revenue of $60–$100M, though neither the
              volume split nor the net take rate is disclosed. The third stream is add-on modules and professional
              services: RMS, POS, BI, guest messaging, and implementation fees, together likely contributing $20–$40M.
              Mews Spaces generated $537M in ancillary revenue for hoteliers (not Mews), but revenue sharing from that
              product has not been disclosed and should not be counted as Mews revenue without confirmation. Total
              estimated gross revenue is in the $170–$260M range, implying an implied revenue multiple of approximately
              10–15x at $2.5B valuation.
            claimRefs:
