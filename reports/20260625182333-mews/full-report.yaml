      - number: '7.5'
        title: Financial, People, and Execution Risk
        blocks:
          - type: paragraph
            body: >
              Financial risk centers on opacity and payment economics. Mews discloses neither ARR nor profitability, so
              its USD 2.5B January 2026 valuation rests entirely on inference from headcount, customer count, and
              payment volume — a buyer cannot independently test burn, gross margin, or the revenue multiple. The
              embedded-payments model that drives much of Mews's monetization is also its most-criticized feature:
              reviewers repeatedly describe Mews Payments as convenient but expensive and hard to leave, raising both a
              churn risk (price-sensitive operators defect) and a margin/concentration risk (revenue depends on holding
              payment volume). People and execution risk is led by key-person dependence: founder Richard Valtr and CEO
              Matthijs Welle — co-founders who have run Mews since inception — embody the strategy and relationships,
              and President Mike Coscetta leads go-to-market; the loss of any could disrupt direction ahead of a planned
              IPO. Execution risk compounds this: Mews is simultaneously integrating two acquisitions, shipping five new
              2026 modules, and defending an all-in-one thesis against a documented market shift toward best-of-breed
              stacks. The people/execution risk register (Table TR004) ranks these exposures. The recurring diligence
              theme is that the financial and execution downside is real but unquantifiable from public sources, which
              is itself a material risk for an underwriter.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
          - type: table
