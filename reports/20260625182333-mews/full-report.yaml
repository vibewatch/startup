  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Signal to Monitor
      - Why It Breaks the Thesis
    rows:
      - - Retention decline
        - Net revenue retention falls below ~100%
        - Undermines the compounding, low-churn SaaS premium
      - - Payment churn
        - Payment volume or take-rate contracts
        - Erodes the embedded-fintech component of value
      - - Security / regulatory event
        - Material breach or GDPR/PCI enforcement action
        - Imposes fines, remediation cost, and trust loss
      - - Competitive loss
        - Sustained win-rate loss to Oracle / best-of-breed
        - Invalidates the all-in-one consolidation thesis
      - - Financing freeze
        - IPO window closes or down-round pricing emerges
        - Removes the re-rate path underwritten at entry
    notes: >-
      Triggers are author-constructed monitoring tools, not Mews disclosures; each maps to a downside scenario in Table
      TV003.
    claimRefs:
      - CV026
      - CV027
      - CV028
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Ask
      - Purpose
      - Resolves
    rows:
      - - Audited financials and ARR
        - Test the implied revenue multiple
        - Valuation opacity
      - - Gross margin + payments take-rate / margin
        - Underwrite unit economics and fintech contribution
        - Margin and Rule-of-40 uncertainty
      - - Net revenue retention + churn
        - Validate the SaaS-premium and lock-in claims
        - Retention and churn opacity
      - - Full cap table + preference stack
        - Assess dilution and downside subordination
        - Preference overhang
      - - SOC 2 / ISO 27001 / PCI v4.0 evidence
        - Underwrite security and compliance posture
        - Certification-scope gap
      - - Customer + revenue split by geography
        - Size European concentration and data-sovereignty risk
        - Concentration opacity
    notes: >-
      Asks are the disclosures required to convert the conditional proceed into a priced decision; all are currently
      unavailable from public sources.
    claimRefs:
      - CV029
      - CV030
      - CV015
