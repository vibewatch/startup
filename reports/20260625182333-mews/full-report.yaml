            body: >
              The Mews platform decomposes into a set of modules that span the guest journey and the back office. The
              reservation and operations core is the Mews PMS, the anchor product that won Best PMS at the
              HotelTechAwards in 2024, 2025, and 2026. Distribution runs through the Mews Booking Engine (direct
              bookings) and, since Unfold 2026, a Channel Manager "powered by SiteMinder" that connects 400+ OTAs
