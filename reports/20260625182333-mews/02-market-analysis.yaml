- id: constraints-gaps
  title: Adoption Constraints, Adverse Evidence, and Sizing Gaps
  body: >
    Integration complexity is the single largest restraint on market adoption, reducing CAGR by an
    estimated 1.1% per Mordor Intelligence, and 38% of hoteliers cite it as their top pain point
    (NYU Tisch Center 2026). For Mews specifically, the unified operating-system positioning creates
    a structural tension: the NYU 2026 study found that 30% of all-in-one platform users plan to
    switch to best-in-class stacks, more than double the 14% reverse rate, suggesting that
    all-in-one approaches lose customers to best-of-breed alternatives at scale. Users of all-in-one
    systems also report higher booking error rates (57% vs. 45%) and more check-in delays (46% vs.
    23%) than best-in-class users, raising the question of whether Mews's unified approach will
    maintain quality as scope expands. Data migration complexity and fear of operational disruption
    remain powerful inertia forces particularly for independent hotel operators with lean IT teams.
    Cyber-security risk grows with unified system dependency, and breach incidents at major hotel
    chains have heightened buyer scrutiny. The Cloudbeds 2026 report documented "structural pressure"
    on independent hotels from OTA commission growth and labor costs, which may reduce budgets
    available for platform migration. On sizing methodology, market estimates range from $1.73 billion
    to over $6.8 billion depending on boundary decisions — this spread reflects genuine diligence gaps
    in how analysts define the market and should be preserved as a caveat in any valuation model
    anchored to TAM.
  claimRefs:
  - CM013
  - CM014
  - CM016
  - CM018
  - CM020
