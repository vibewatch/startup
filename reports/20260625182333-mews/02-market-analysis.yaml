callouts:
- calloutType: strength
  title: Cloud Migration Wave Is Accelerating TAM Expansion
  body: >
    The cloud-to-SaaS migration rate is the single most powerful structural tailwind in the hospitality
    technology market: cloud PMS is expanding at 12.38% CAGR vs. the 7.05% overall market rate, meaning
    every year cloud doubles its share of a growing pool. This creates compounding pipeline for
    cloud-native vendors like Mews as the legacy install base — still roughly 35% of the market in
    on-premise deployments — converts on a predictable depreciation cycle. The 51% of hoteliers planning
    a tech stack replacement in the next 12–24 months confirms that near-term pipeline density is unusually
    high by historical standards.
  claimRefs:
  - CM003
  - CM004
  - CM017

- calloutType: risk
  title: All-in-One Platform Model Faces Structural Churn Risk per 2026 Academic Study
  body: >
    The NYU Tisch Center of Hospitality 2026 study — co-authored with Stayntouch and IDeaS, both Mews
    competitors — presents a direct challenge to Mews's unified operating system positioning. The study
    of 300+ hotel professionals found that 30% of all-in-one platform users plan to switch to best-in-class
    integrated stacks, more than double the 14% reverse rate. All-in-one users also report higher booking
    error rates (57% vs. 45%) and more check-in delays (46% vs. 23%). While Mews argues its platform
    eliminates silos better than legacy all-in-ones, the study's finding that best-in-class yields higher
    PMS satisfaction (70% vs. 55%) and stronger retention suggests Mews must demonstrate its unified
    approach genuinely outperforms best-of-breed before large-scale chain adoption becomes reliable.
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM020
  - CM034

