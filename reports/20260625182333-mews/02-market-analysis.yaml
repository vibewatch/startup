company:
  name: Mews
chapter:
  number: 2
  title: Market Analysis
  summary: >
    The global hospitality PMS market is estimated at $1.73 billion in 2026 and growing at a 7.05% CAGR
    toward $2.44 billion by 2031, with cloud deployments capturing 64.92% of the market and expanding at
    12.38% annually. The total hotel management software pool is broader at $4.3 billion when POS, RMS, and
    guest tools are included. Independent properties hold 51.45% of PMS spend, and Asia-Pacific is the
    fastest-growing region at 12.18% CAGR. The NYU-Stayntouch 2026 study shows that 30% of all-in-one
    platform users plan to switch to best-in-class stacks — an adversarial data point for Mews's unified-OS
    positioning — while 38% of all hoteliers cite integration as their top pain point. Mews's SAM is
    constrained to the cloud-first, open-API segment of the market.
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: >
    The relevant market for Mews spans hospitality property management software (PMS) and its adjacent
    layers: point-of-sale, revenue management systems (RMS), channel management, guest-messaging, payments
    processing, and business intelligence embedded within hotel operations. A narrow PMS-only lens sizes
    the market at $1.73 billion in 2026 (Mordor Intelligence), while a broader hotel and hospitality
    management software definition that includes POS, RMS, and integrated guest tools lands at $4.3 billion
    (multiple analyst estimates). Spend excluded from the hospitality technology market includes general
    enterprise ERP, generic CRM not built for hospitality, facilities HVAC/IoT, and consumer travel booking
    platforms. Status-quo substitutes remain significant: manual spreadsheet-based operations, legacy
    on-premise installations from Oracle Opera, Maestro, and Protel still serve a substantial fraction of
    the world's estimated 200,000+ hotel properties, and new competitive pressure comes from well-funded
    all-in-one suites targeting mid-scale chains. The software layer that Mews positions as a replacement
    for eight-to-ten separate vendor systems is the unified hospitality operating environment — a
    subcategory with no agreed industry label but material and growing budget allocation as of 2026.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM011
  - CM012
  - CM019
  tableRefs:
  - TM001
  figureRefs:
  - FM004

- id: market-sizing
  title: Market Sizing — TAM, SAM, and SOM Lenses
  body: >
    Multiple analyst sizing lenses exist and should be used together rather than selecting one. The
    narrowest lens — core PMS software globally — produces Mordor Intelligence's $1.73 billion 2026
    estimate and The Business Research Company's parallel figure of $1.71 billion. The broader hotel
    management software lens, which incorporates RMS, POS, and integrated tools, produces estimates in the
    $4.0–4.3 billion range from Grand View Research and Fortune Business Insights. These figures are not
    contradictory; they reflect different boundary decisions. For Mews, the serviceable addressable market
    (SAM) is more precisely the cloud-first segment of the broader category. Cloud PMS held 64.92% of
    deployment share in 2025 and is growing at 12.38% annually, suggesting a cloud SAM of roughly $1.1
    billion within the core PMS market in 2026. Extending to the broader hotel software pool, the cloud SAM
    for a unified cloud-native stack could approach $2.8 billion. Mews's serviceable obtainable market
    (SOM) is further constrained by its current 15,000-property footprint, which represents roughly 7.5%
    of global hotel properties, and its strongest penetration in Europe and English-speaking markets. A
    reasonable SOM estimate at current trajectory would be 10–12% of cloud SAM, or approximately $110–135
    million in annual recurring software revenue within the next 2–3 years, excluding payments monetisation.
    Contradictory and higher-end estimates from MarkWide Research ($6.8 billion TAM by 2026 for a broad
    "hospitality PMS" definition) were retained to represent the diligence gap in definition consistency
    across reports.
  claimRefs:
  - CM001
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
