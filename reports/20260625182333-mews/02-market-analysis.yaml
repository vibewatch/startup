  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: mews-SOM
    missingEvidence: "Mews's disclosed ARR, win rate against specific legacy PMS incumbents, and current expansion rate into non-European markets."
    whyItMatters: "Without disclosed revenue run-rate and geographic expansion data, the SOM estimate is highly speculative and complicates any valuation model anchored on realistic near-term revenue."
    diligencePath: "Request ARR by region, new logo count by geography, and win/loss data from Mews investor relations or a reference check with EQT Growth."
    relatedQuestionRefs:
    - QM014
  - type: conflicting-data
    severity: minor
    topic: market-size-divergence
    missingEvidence: "A single agreed-upon market definition and consistent boundary used across analyst reports to produce a comparable TAM."
    whyItMatters: "The $1.73B to $6.8B estimate spread makes it difficult to anchor a Mews revenue penetration rate to an objective TAM denominator."
    diligencePath: "Commission a bespoke sizing from a firm using the same boundary definition Mews's investor deck uses; cross-check against Mews Series D materials."
  - type: missing-source
    severity: material
    topic: OTA-budget-pressure
    missingEvidence: "Quantified impact of OTA commission increases on independent hotel software budget allocation in 2026."
    whyItMatters: "If structural OTA pressure is consuming an increasing share of hotel budgets, Mews's primary ICP may have less discretionary budget for platform upgrades."
    diligencePath: "Obtain the full Cloudbeds 2026 State of Independent Hotels Report and STR/CoStar data on independent hotel profitability trends."
    relatedQuestionRefs:
    - QM021

