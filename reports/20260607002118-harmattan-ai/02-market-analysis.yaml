chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Harmattan AI competes at the intersection of three fast-accelerating European defence procurement segments—counter-UAS
    (C-UAS), autonomous ISR, and precision-strike drone systems—where NATO-driven testing cycles and sovereign rearmament
    are converting pilot budgets into production-scale contracts. BCG projects European C-UAS demand alone will exceed $5–7
    billion by 2029 at 58%+ annual growth, while the broader European military drone market is independently sized at $2.15
    billion in 2024 growing to $4.65 billion by 2035 (MRFR). Sizing contradictions across publishers (Grand View's $17 billion
    vs. IMARC's $276 million for 2024–2025 "Europe drone" figures) reflect incompatible perimeter definitions rather than
    methodological error; the relevant procurement-linked SAM for Harmattan AI is the defence ministry and NATO-programme
    slice, not the commercial UAV market.
sections:
- id: market-boundary
  title: Market boundary, included and excluded spend, and procurement context
  body: >-
    Defining Harmattan AI's market requires a procurement-first rather than technology-first lens. The company's four mission
    pillars—VSHORAD (counter-UAS kinetic intercept), persistent ISR (SAR-payload surveillance), precision strike (autonomous
    loitering engagement), and force readiness (autonomous training)—map directly onto European Ministry of Defence and NATO
    programme lines rather than the commercial or civil drone market. Included spend therefore covers: (1) national MoD budgets
    for C-UAS systems, autonomous ISR platforms, and strike drone procurements by NATO member states; (2) NATO collective
    procurement and interoperability programmes under the Rapid Adoption Action Plan (RAAP) and NATO Innovation Fund; (3)
    European Defence Fund co-funded capability development for unmanned systems and C-UAS; and (4) PESCO-aligned joint programmes
    targeting drone and counter-drone interoperability. Excluded spend covers: civilian or commercial drone hardware sold
    for agriculture, inspection, logistics, or consumer use; non-military C-UAS deployed in airport perimeters by civil aviation
    authorities without MoD budget; and general-purpose GNSS or communications infrastructure that supports but does not constitute
    a drone mission system.

    The status-quo substitute is heterogeneous and costly. European armed forces currently rely on a patchwork of legacy air
    defence, manually operated jamming systems, human-in-the-loop thermal cameras, and a fragmented catalogue of nationally
    procured platforms. BCG estimates that Europe has more than twice as many announced C-UAS platform variants as North America
    (35 vs. 13), which produces higher unit costs, slower production ramp, and limited interoperability across borders. NATO's
    response—the TIE 26 exercise (May 2026, Netherlands) and the Latvia Innovation Range TEVV campaign (March 2026)—signals
    an institutional shift from ad-hoc national procurement toward interoperability testing that gates which commercial systems
    qualify for Alliance-wide contracts. This is Harmattan AI's entry corridor: companies that pass NCIA technical assessment
    in exercises like TIE 26 and the LCI-X Crucible Series become eligible for the Baltic Trust 26 operational exercise and
    subsequent NATO framework agreements.

    The adjacency that matters most for sizing is the civil critical-national-infrastructure (CNI) C-UAS market—airports,
    nuclear plants, energy infrastructure, major event venues—which BCG projects will require 2,000–3,000 additional systems
    by 2029. Although this sits technically outside pure MoD spend, EU regulatory work enabling lawful C-UAS deployment in
    civilian settings is creating a dual-use procurement pathway that defence-first suppliers can access through the same
    hardware and command architectures as their military variants.
