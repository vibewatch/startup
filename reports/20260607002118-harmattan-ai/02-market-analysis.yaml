figures:
- id: FM001
  title: Market sizing pyramid
  type: pyramid
  layout: standard
  summary: >-
    Nested market layers from broad European UAV to the defence-procurement SAM and C-UAS subsegment directly addressable
    by Harmattan AI in the near term.
  data:
    items:
    - label: Europe drone market (all segments, Grand View perimeter)
      value: $17B (2024); $36B by 2030
      detail: >-
        Broadest published European drone perimeter including defence hardware, commercial, logistics, agriculture, and consumer;
        Grand View Research 2024 base, 13.4% CAGR. Includes categories outside Harmattan AI's addressable market.
      tone: neutral
    - label: Europe UAV market (military + commercial, MarketsandMarkets)
      value: $5.0B (2025); $7.98B by 2030
      detail: >-
        MarketsandMarkets all-application Europe UAV market at 9.8% CAGR; defence and government platform is the dominant
        segment but commercial drag reduces aggregate growth vs. pure military segments.
      tone: neutral
    - label: Europe military drone market (MRFR defence-only)
      value: $2.15B (2024); $4.65B by 2035
      detail: >-
        Market Research Future defence-specific European military drone market (7.26% CAGR); Germany largest market, UK fastest-growing;
        excludes civil C-UAS and commercial platforms.
      tone: neutral
    - label: European C-UAS addressable demand (BCG bottom-up)
      value: $0.6B committed (2025); $5–7B by 2029
      detail: >-
        BCG May 2026 white paper bottom-up estimate based on 4,000–5,000 system requirements across NATO Europe; includes
        MoD committed ($0.8B by 2029) plus unallocated defence and CNI upside; 58%+ annual growth rate.
      tone: positive
    - label: Harmattan AI near-term SAM (C-UAS + ISR + strike, NATO-tested)
      value: Unquantified from public data
      detail: >-
        Subset of European MoD C-UAS and ISR procurement where Harmattan AI's Gobi/Kalahari and Sahara platforms compete;
        bounded by NATO interoperability qualification, French MoD pipeline, and Dassault-channel access. No public revenue
        disclosure available.
      tone: neutral
  approximationNotes: >-
    Publisher estimates are not additive and use incompatible perimeters; pyramid layers are conceptual nesting, not arithmetic
    decomposition. BCG figure is the most procurement-relevant anchor for C-UAS sizing.
