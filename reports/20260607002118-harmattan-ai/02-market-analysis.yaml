- id: sizing-lenses
  title: TAM, SAM, SOM—competing lenses and preserved contradictions
  body: >-
    Multiple sizing publishers cover overlapping but inconsistent perimeters; the correct output is a set of annotated lenses,
    not a single blended number. The contradictions are real and analytically significant.

    Grand View Research places the Europe drone market at USD 17.05 billion in 2024, growing to USD 36.34 billion by 2030
    at a 13.4% CAGR. Expert Market Research estimates Europe UAV at USD 9.91 billion in 2025 reaching USD 18.29 billion by
    2035 at 6.32% CAGR. MarketsandMarkets projects USD 5.00 billion in 2025 to USD 7.98 billion by 2030 at 9.8% CAGR. IMARC
    Group shows only USD 275.6 million in 2025 reaching USD 600.2 million by 2034 at 9.03% CAGR. These figures differ by more
    than 50x at the same base year because Grand View and Expert Market Research include defence hardware as the dominant
    category while IMARC captures only the smaller commercial/consumer segment. The gap is not noise; it is the difference
    between defining Europe drones as a defence procurement market versus a commercial equipment market.

    The defence-specific slices are more coherent with Harmattan AI's procurement reality. Market Research Future isolates
    Europe military drone revenue at USD 2.15 billion in 2024, growing to USD 4.65 billion by 2035 at a 7.26% CAGR, with Germany
    as the largest national market and the UK as the fastest-growing segment. The BCG C-UAS white paper (May 2026) provides
    the most actionable procurement lens: European MoD-committed C-UAS spend runs from USD 600 million (2025) to USD 800 million
    (2029), but the total addressable C-UAS demand including unallocated defence programmes and CNI protection is projected
    at USD 5–7 billion by 2029 at a 58%+ annual growth rate. This BCG trajectory is driven by system-count economics—4,000–5,000
    systems required in Europe—rather than aggregate revenue extrapolation.

    At the global level, StartUs Insights pegs the military drone market at USD 22.81 billion by 2030 (7.6% CAGR) and USD
    98.24 billion by 2033 (8.9% CAGR from 2026), numbers that are broadly consistent with the sum of US, European, and Asia-Pacific
    procurement trajectories but that collapse meaningful regional and segment variation. The US alone requested USD 9.4 billion
    for unmanned and remotely operated aerial vehicles and USD 3.1 billion for C-UAS in its FY2026 defence budget, anchoring
    a pattern where autonomy and counter-autonomy scale together as paired line items.

    Harmattan AI's SAM sits at the intersection of (a) European MoD and NATO C-UAS procurement, (b) European autonomous ISR
    drone programmes, and (c) attritable strike drone orders—a combination that BCG's bottom-up system-count estimate anchors
    at several billion dollars by 2029 for C-UAS alone, before counting ISR and strike adjacencies. SOM is not quantifiable
    from public data given the absence of Harmattan AI's disclosed pipeline or win rates.
