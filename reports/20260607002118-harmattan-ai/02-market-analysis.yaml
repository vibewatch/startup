callouts:
- calloutType: insight
  title: >-
    BCG's 58%-per-year C-UAS demand trajectory is the most procurement-relevant size signal
  body: >-
    The BCG May 2026 white paper is the only publicly available bottom-up system-count estimate anchored to actual NATO Europe
    military base inventories and the number of civil sites requiring protection. Its trajectory from $600M committed MoD
    spend in 2025 to $5–7B total demand by 2029 at 58%+ annual growth is consistent with Germany's EUR 536M drone contract
    and NATO's rapid-adoption institutional machinery, and materially exceeds what the broad-UAV market reports would imply
    for the C-UAS subsegment.
  claimRefs:
  - CM001
  - CM002
  - CM018
  - CM043
- calloutType: risk
  title: European market fragmentation suppresses production scale and raises unit costs
  body: >-
    BCG documents 35 C-UAS platform variants announced in Europe versus 13 in North America. No single national programme
    achieves manufacturing scale, which means unit costs remain elevated and production learning curves stay flat. For Harmattan
    AI, this creates a paradox: the TAM is large but individual contract values may remain moderate unless the company can
    secure multi-national or NATO-level framework orders. The planned BCG partnership model (Primes driving shared architectures
    and joint procurement) could accelerate consolidation, but the timeline is unresolved.
  claimRefs:
  - CM006
  - CM031
  - CM032
  - CM044
  - CM045
- calloutType: insight
  title: >-
    NATO testing infrastructure converts experimentation into procurement pre-qualification
  body: >-
    TIE 26, the Latvia TEVV campaign, and the LCI-X Crucible Series are not demonstrations; they are gated evaluation pathways
    from which TIE-tested systems gain eligibility for Baltic Trust 26 and subsequently for NATO framework agreements. For
    a scale-stage startup, participation in and successful passage through these events is more directly valuable than a traditional
    sales pipeline because it produces Alliance-level technical credentials that accelerate national MoD decisions across
    32 member states simultaneously.
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM037
  - CM038
  - CM039
- calloutType: assumption
  title: SOM cannot be isolated from public data alone
  body: >-
    No public information discloses Harmattan AI's MoD pipeline, win rates, or named contracts beyond the France training
    order and Dassault aviation partnership. The serviceable obtainable market therefore depends on private data—specifically,
    whether the company has entered TIE 26 evaluation, whether the Kalahari C2 layer is STANAG-compatible, and what proportion
    of the BCG-estimated 1,500–2,000 military C-UAS system requirement is reachable given current production capacity and
    export certifications.
  claimRefs:
  - CM003
  - CM004
  - CM033
  - CM034
  - CM035
