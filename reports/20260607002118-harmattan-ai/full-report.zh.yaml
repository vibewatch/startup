      - number: '6.3'
        title: 留存、耐久性与扩张路径
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI
              的客户耐久性几乎完全建立在正式采购项目结构上，而不是可公开验证的留存数据。法国和英国的正式采购项目意味着多年预算授权和部长级承诺；相比单年度试点或可自由裁量预算项，这类项目结构上更难取消。2026 年 1 月
              Dassault Aviation 新闻稿明确称 Harmattan 已被法国和英国国防部「授予多个正式采购项目」，用复数确认两个合同都具备这一称谓。Defense News、TechCrunch 和
              AirForce-Technology.com 同日独立复述了这一说法，佐证它更接近事实表述，而不是营销话术。

              公司未公开披露 NRR、GRR、流失率、合同续约或复购数据。法国国防部最初交付窗口（2025 年 10–12 月）和英国合同授标（2025 年 9 月）意味着，截至 2026 年 6
              月，部分项目已过初始交付期；但 Harmattan
              未发布任何追加订单公告、使用报告或客户满意度披露。这造成重大证据缺口：投资人无法独立验证这些项目是否带来复购、扩大部署，或来自客户采购人员的任何可量化运营结果背书。

              扩张路径多方向，但结构上仍早期。Dassault Aviation 背书打开了 Rafale
              项目国家（Qatar、India、Egypt、Indonesia、UAE、Greece、Croatia、Serbia、Colombia、Indonesia）这一批潜在二级市场，路径是主承包商分销网络。Skyeton
              合作同样打开乌克兰防务工业基础，以及采购 Raybird 的 NATO 盟友，使 Harmattan 不必赢得主权采购竞赛，也能延伸传感器收入。公司计划进入的新领域——电子战、打击平台（Barkhan）和 C2
              软件（Kalahari）——如果达到正式采购项目状态，也给现有法国和英国国防部客户创造交叉销售机会。
