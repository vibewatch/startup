      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: BCG 58% 年增长 C-UAS 需求轨迹是最贴近采购的规模信号
            body: >-
              BCG 2026 年 5 月白皮书，是唯一公开可得、从下至上以 NATO 欧洲实际军事基地库存和需要保护的民用场地数量为锚的系统数量估计。其轨迹从 2025 年国防部已承诺支出 $600M，增长到 2029
              年总需求 $5–7B，年增长 58%+；这与德国 EUR 536M 无人机合同和 NATO 快速采用制度框架相符，也显著高于广义 UAV 市场报告对 C-UAS 子细分的隐含规模。
