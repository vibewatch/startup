      - number: '4.2'
        title: 单位经济、成本结构与资本密集度
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 没有披露任何单位经济数据——毛利率、贡献毛利、CAC、回本周期或 LTV——这与其发展阶段和私营身份一致。公开证据可以搭出代理估算，但不确定性很高，不能替代尽调室里的财务资料。

              纵向整合的防务硬件制造商，成本结构天然偏资本密集。2026 年 6 月，Harmattan 的运营成本基底包括 130 多名员工，中位从业经验 15 年，分布在法国、英国、瑞士、摩洛哥、UAE 和美国办公室。截至
              2026 年 6 月，开放岗位包括制造岗位（Wissous 的生产操作员、产线主管、质量技术员）、系统架构师、总工程师、组长，以及多国 R&D
              工程师，显示这是一个高成本、资深员工占比高的组织。按员工数粗估烧钱速度——130+ 名员工、欧洲防务行业混合人工成本约每人每年
              $150K–$200K——意味着在资本开支、零部件采购和制造设施开销之前，年度现金运营费用约 $20–$35 million，约合每月 $1.5–$3 million。

              收入侧，Harmattan 防务无人机硬件的毛利率未知。可比的硬件加软件防务主承包商显示，硬件交付合同毛利率约 15–40%，取决于 R&D 成本资本化还是费用化；软件或 AI 集成服务毛利率更高，约
              50–70%。Harmattan 的纵向整合模式——自研机体、传感器和软件——理论上会减少第三方组件利润抽成，但在低产量时也会放大固定成本吸收风险。

              CEO 在 Le Grand Continent
              采访中点出两项结构性供应链成本风险：（1）无刷电机磁体含稀土元素，目前依赖中国稀土精炼链；（2）锂聚合物电池的电池化学也依赖中国稀土。两者都被认定为会持续三到五年的约束，意味着替代供应链成熟前，零部件成本和供应集中风险都会维持高位。这些供应链暴露会直接影响硬件合同的
              COGS 和毛利率。

              产量规模是单位经济的关键杠杆。Harmattan 声称具备「每月数千套系统」产能，DroneXL 的分析还引用公司最高每月 10,000
              架无人机的计划。如果任一数字属实，固定制造开销将摊到很大的生产基数上，单位经济会明显改善。但两项数字都未获独立验证。
