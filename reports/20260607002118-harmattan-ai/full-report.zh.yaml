companyProfile:
  summary: >-
    Harmattan AI 于 2024 年 4 月在巴黎成立，作为欧洲防务初创公司扩张速度异乎寻常。公司搭建纵向一体化自主系统栈，覆盖 Sonora 训练 ISR 无人机、Sahara 机载 SAR 载荷、Gobi 和 Gobi
    Tempest 反无人机拦截器、Barkhan 打击平台，以及 Kalahari 指挥控制层。成立约 18 个月内，它同时拿下法国和英国国防部正式列装项目；2026 年 1 月，Dassault Aviation 领投其 $200M
    Series B，估值 $1.4B。Dassault 合作把 Harmattan 推向 Rafale F5 和未来 UCAS 项目的嵌入式 AI 能力开发；Skyeton 合作则把其传感器栈延伸到面向 NATO 市场的乌克兰
    Raybird 平台。
