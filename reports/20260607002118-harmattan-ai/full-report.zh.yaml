      - number: '8.6'
        title: 图表与附录
        blocks:
          - type: callout
            title: $1.4 billion 估值位于同行区间低端，隐含重估潜力
            body: >-
              在防务自主系统同行中，Harmattan AI 的 $1.4 billion 投后估值低于 Anduril（$61B）、Shield AI（$12.7B）和 Helsing（估计约 ~$18B），尽管
              Harmattan 拿下两个国家国防部正式列装项目的速度，比这些同行在相近年龄时都更快。如果 Rafale F5 AI 授权得到确认，收入指标最终披露且表现强劲，Harmattan
              的轨迹足以支撑显著重估。当前入场点在结构上处于多年战略溢价扩张可能性的早期。
