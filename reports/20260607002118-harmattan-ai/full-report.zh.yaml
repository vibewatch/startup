    sections:
      - number: '7.1'
        title: 监管、法律与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 处在监管最严的商业赛道之一：向政府军方出售致命或潜在致命的自主系统。几条监管线叠加，形成多层风险暴露。

              法国两用出口管制：所有从法国出口的无人机和自主武器，都受 SGDSN 与 DGA 依据防务物资出口法（Loi du 22 juin 2011）执行的法国出口许可制度约束。非军用两用子系统还并行适用 EU
              Regulation 2021/821，即欧盟两用出口管制框架。Expert Market Research 2026 Europe UAV report 明确称，「欧洲 UAV
              出口需要在国家出口许可与欧盟共同立场框架之间协调，这让面向全球市场的欧洲制造商面临监管复杂性。」Harmattan CEO 在 2026 年 2 月 Le Grand Continent
              采访中承认，要大批量生产，供应链能否摆脱出口许可束缚是实质约束。

              NATO 与 EU 互操作认证：NATO 的技术互操作演习（TIE 26）于 2026 年 5 月在荷兰举行，用来测试 C-UAS 与 UAS 系统是否满足联盟 C2 集成标准，只有通过后才有资格接入 NATO
              防务架构。NCIA 表示，「现代多层 C-UAS 行动中的互操作性不再是可选项，而是必需项。」公开资料没有证实 Harmattan 系统参加了 TIE 26。NATO 的 Latvia Innovation
              Range（2026 年 3 月）和 LCI-X Beacon Project，都要求系统先经过结构化验证，才可能被全联盟采购。若拿不到 NATO 互操作认证，Harmattan
              只能留在与法国、英国的双边国家合同里，可触达市场会被封顶。European Parliament Research Service 2026 年对军用无人机系统的分析也强调，在 EU
              法律框架下部署自主系统监管复杂；两用无人机平台同时受军方和民航主管机构监督。

              致命性自主武器与 IHL 合规：Harmattan 的 Gobi 反无人机拦截器可在「每次拦截无需人在环」的情况下运行。这直接落入国际社会关于致命性自主武器系统（LAWS）的持续争论。UN Convention
              on Certain Conventional Weapons 的政府专家组自 2014 年以来一直讨论 LAWS 监管，但尚未形成有约束力的条约。Gobi 没有公开披露 AI 伦理章程、安全认证或 IHL
              合规文件。一旦发生误识别事件，国防部可能暂停项目，监管也可能介入，并伤害 Harmattan 在 NATO 客户中的声誉。

              EU 碎片化加大互操作不确定性：法国与德国在 FCAS 联合战斗机项目上仍僵持，Defense News 称双方「难以前进」。按 CEO 自己的判断，European Commission
              也没有制定泛欧防务战略的授权。Eurocontrol 2024 C-UAS workshop 证实，EU 无人机监管在民用 / 两用空域采用 EASA
              框架，但军用系统由各国规则单独管理，两用系统的合规不确定性因此上升。

              隐私与数据法：Harmattan 隐私政策（2025 年 11 月）称，个人数据可依据 Standard Contractual Clauses 转移至 EEA 以外。国家安全例外下，ISR
              无人机外场采集的影像数据如何治理，公开资料没有说明。
