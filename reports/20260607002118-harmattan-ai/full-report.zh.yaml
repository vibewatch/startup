            title: 欧洲市场碎片化压制生产规模并推高单位成本
            body: >-
              BCG 记录欧洲已宣布 35 种 C-UAS 平台变体，北美为 13 种。没有任何单一国家项目达到制造规模，因此单位成本居高不下，生产学习曲线保持平坦。对 Harmattan AI 而言，这制造了一个悖论：TAM
              很大，但除非公司能拿到多国或 NATO 层面的框架订单，单个合同金额可能保持中等。BCG 规划的合作伙伴模型（由主承包商推动共享架构和联合采购）可能加速整合，但时间线未定。
