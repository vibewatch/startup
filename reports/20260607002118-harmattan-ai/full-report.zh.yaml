      - number: '1.3'
        title: 融资历史、投资方与估值
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的融资节奏异常压缩。公司先完成一轮由 Atlantic VC 领投、金额未披露的种子轮，随后完成约 $30M Series A，由 FirstMark Capital
              领投，Atlantic VC 和 Tholus Capital 参投。TechCrunch 报道 Series B 前累计融资约 $42M，与 $12M 种子轮加 $30M Series A 相吻合；Motier
              Ventures 和 Sisyphus Ventures 也被列为早期支持者。DefenceJobs.org 资料独立列出 Dassault Aviation、FirstMark Capital、Atlantic
              VC、Motier Ventures 和 Tholus Capital 为 Harmattan 投资方，印证了多投资方财团结构。

              2026 年 1 月 12 日，Dassault Aviation 领投 $200M Series B，将投后估值推至 $1.4B——这一数字由 Defense News、TechCrunch、Tech.eu 和
              AirForce-Technology.com 报道，并在 Harmattan 自家新闻稿中确认。本轮融资与面向 Dassault 的战略合作一同宣布，Motier Ventures 继续跟投。公司称
              Series B 估值较 Series A 「显著提高」，但 Series A 投后估值未公开披露。公告时，Dassault Aviation 单独投资份额的确切规模和其他 Series B
              共同投资方身份均未披露。

              法国总统 Emmanuel Macron 在 X 上称赞该公告，称 Harmattan 是「法国最新独角兽」，并把交易定义为「对我们的战略自主权来说是极好消息」。TechCrunch
              注意到定位变化：公司此前自称「欧洲 Anduril」，Dassault 合作后则重塑为「防务科技公司」。截至 2026 年 1 月，累计融资估计约 $242M（Series B 前 $42M 加 $200M
              Series B），但这是基于公开报道的估计，而非经核验的股权结构表。
