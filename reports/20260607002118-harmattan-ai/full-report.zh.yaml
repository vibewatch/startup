  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 商业模式、收入流与变现方式
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 采用面向政府的 B2G 收入模式，核心锚点是防务采购合同。收入主要来自自主系统硬件交付——无人机、反无人机拦截器、电子战平台和 C2
              软件——这些产品在正式采购项目下直接卖给国家国防部和盟军。公司披露的两个正式采购项目分别来自法国国防部（2025 年 7 月，1,000 架 SORONA 无人机）和英国国防部（2025 年 9 月，最多
              3,000 套自主系统）。这确认核心收入机制是一次性总额或里程碑政府合同，而不是经常性订阅收入。

              公司官方新闻稿称，Series B 资金将用于「在新作战区域部署 AI 赋能任务、把 Harmattan AI
              的产品组合延伸到新领域，并扩大工业化制造」。这表明近期主导收入流仍是硬件交付合同。第二条新兴收入流，是为 Dassault Aviation 的 Rafale F5 和 UCAS 项目提供嵌入式 AI
              集成服务；该业务仍处早期，未披露财务条款。第三条收入路径，是借助 Skyeton 合作做技术许可（把 Harmattan 的 Sahara SAR 载荷集成进 Raybird UAS）；2025 年 10
              月的合作公告已确认该路径，但收入贡献和结构并未公开。

              Harmattan 官网明确表示，网站只是「静态目录」，没有电商功能；所有销售都要靠直接接触军方客户和国家采购机构推进（法国为 DGA，英国为
              DE&S）。这确认渠道分销、经销安排和商业定价透明度在结构上缺位：公司没有标价，没有公开费率卡，也没有披露任何产品线的单价或单合同金额。

              CEO 在 2026 年 2 月接受 Le Grand Continent 采访时提出一个很有分量的结构问题：M'Ghari
              明确主张一种类似疫情期间疫苗制造合同的「take-or-pay」采购模式，即国家即使不承诺采购量，也为产能出资。若 Harmattan 拿到这类安排，将形成轻资本的经常性付款流；截至 2026 年 6
              月，尚无证据显示已有生效的 take-or-pay 合同。
