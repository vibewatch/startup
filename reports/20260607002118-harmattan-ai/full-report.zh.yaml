      - number: '4.4'
        title: 公开财务缺口与披露不透明
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的财务披露姿态，符合一家私营阶段法国防务公司的常态：没有监管义务公布收入、利润率或详细资本结构数据。但从投资尽调视角看，缺少公开财务指标会造成基本面的承销不透明。截至 2026 年 6
              月，任何公开可访问的新闻稿、投资者信、监管文件或财务报表中，都没有披露 ARR、收入运行率、毛利率、经营亏损、烧钱速度或现金跑道。

              阻碍承销的具体缺口包括：两个正式采购项目的合同总额（可建立收入基线）、硬件交付毛利率（决定业务在规模化后是否根本可行）、烧钱速度与现金跑道（决定近期稀释风险），以及 Dassault 在 $200M
              轮中的具体股权出资额（影响稀释和董事会动态）。研究期间访问 Crunchbase 档案返回 403 错误，未提供补充财务数据。CEO 在 Le Grand Continent
              的访谈是最实质的公开披露，谈到供应链、地缘政治战略和产业政策，但未披露任何收入、利润率或烧钱数字。
