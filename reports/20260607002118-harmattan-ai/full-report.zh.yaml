      - number: '4.5'
        title: 财务结论——收入质量、利润率路径与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月，Harmattan AI 的财务图景由三件事并存构成：收入质量信号强、单位经济高度不透明、短期资产负债表资金充足。

              凡是能评估的地方，收入质量都很高。与两个北约国家政府签订正式采购项目，意味着客户是主权信用交易方——这是防务公司能拿到的信用安全性最高的客户类别。政府合同通常按里程碑付款并带部分预付款，可降低回款风险。合同落地速度（成立
              14 个月拿到法国国防部项目；15 个月拿到英国国防部项目；CEO 访谈称 7 个月拿到爱沙尼亚订单）显示出同阶段大多数防务初创公司不具备的运营交付能力。Dassault 合作增加第三层收入质量：为一家收入
              $6.2B 的主承包商开发嵌入式 AI，可带来稳定、多年的开发收入，不受典型硬件采购周期完全约束。

              利润率路径是关键未知数。防务硬件制造天然低于软件毛利率，Harmattan 的 SORONA 无人机还要在质量之外比拼成本效率——DGA
              采购明确瞄准低单价。公司宣称「每月数千套系统」的产能会改善固定成本吸收，但中国稀土供应链依赖和欧洲高人工成本会压低近期毛利率。没有合同级定价或成本拆分，就无法以有用精度估算毛利率。

              资本密集度是近期首要风险。扩大无人机制造需要重资本投入：产线、质量体系、供应链管理和多国运营都要持续投钱。$200M Series B 足以支撑当前增长阶段，但不足以支撑公司提到的每月 10,000
              套目标。下一轮融资更可能由制造规模化里程碑驱动，而不是单纯由收入指标驱动。

              主要尽调阻碍：（1）没有收入或 ARR 披露；（2）没有毛利率披露；（3）两个正式采购项目的合同金额被保密 / 暂不披露；（4）Dassault
              出资额和共同投资方结构未披露；（5）没有债务或项目融资披露；（6）没有烧钱速度或现金跑道数据。
