    summary: 建议链条从市场验证、产品证据、估值分析，最后走到「有条件关注」建议；两个论点锚点和三项阻断性尽调缺口， 决定了附带条件的限定。
    data:
      nodes:
        - id: market
          label: 市场验证
          detail: BCG：C-UAS 市场到 2029 年达 $5–7B，CAGR 58%+；2025 年上半年欧洲防务 AI 投资 €946M（同比 +26%）；NATO TIE 26 验证采购管线。
          tone: positive
        - id: product
          label: 产品和合同证据
          detail: 15 个月内拿下两个国家国防部在册项目（法国、英国）；垂直整合平台覆盖 ISR、C-UAS、 EW、打击、C2；Dassault 授予 Rafale F5 和 UCAS 的 AI 任务。
          tone: positive
        - id: capital
          label: 资本和估值背景
          detail: Series B 投后估值 $1.4B；累计融资 $242M；Dassault 领投；规模化同业 Helsing / Anduril 估值区间 $12B–$61B； Harmattan 位于低端，暗示重估上行空间。
          tone: neutral
        - id: risks
          label: 阻断性尽调缺口
          detail: 收入未披露；治理不透明；生产规模未验证；已承认供应链依赖中国；Dassault 合作范围不清。
          tone: warning
        - id: recommendation
          label: 有条件关注 / 继续研究
          detail: 对战略投资者估值公平到偏满；对纯财务投资者，在未披露收入前偏紧。 上调触发条件：收入数据显示 ARR >$100M，且毛利率 >50%。
          tone: neutral
      edges:
        - from: market
          to: capital
        - from: product
          to: capital
        - from: capital
          to: recommendation
        - from: risks
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV013
      - CV014
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: >-
      用最新披露或估算轮次，对防务自主化同业的隐含收入倍数做示意性敏感性分析，显示收入已披露同业 （Anduril、Quantum Systems）与收入不透明同业（Harmattan、Helsing、Shield
      AI）之间的宽幅差异。 柱形表示累计融资额相对于最新投后估值的倍数；披露收入时展示收入倍数。
    data:
      items:
        - label: Harmattan AI
          value: 5.8
          detail: 已融资资本倍数（估值 $1.4B / 已融资 $242M = 5.8×）；收入倍数 N/A（未披露）
          tone: neutral
        - label: TEKEVER
          value: 2.8
          detail: 按约 £1B 估值计算的近似已融资资本倍数；已披露盈利；ISR 服务隐含收入倍数约 3–5×
          tone: positive
        - label: Quantum Systems
          value: 9.7
          detail: 约 €3B 估值 / 约 €310M 已融资 = 约 9.7×；披露年收入增长 100%；隐含收入倍数约 15–20×
          tone: positive
        - label: Shield AI
          value: 9.8
          detail: $12.7B 估值 / 累计融资约 $1.3B = 约 9.8×；收入未披露；含软件溢价成分
          tone: neutral
        - label: Helsing
          value: 15
          detail: 估算估值约 $18B / 累计融资约 $1.2B = 约 15×；收入未披露；5 年经营期溢价
          tone: neutral
        - label: Anduril
          value: 5.5
          detail: $61B 估值 / 累计融资约 $11B = 约 5.5×；披露收入 $2.2B = 收入约 28×；参考上限
          tone: positive
    approximationNotes: >-
      所有数字来自公开报道的轮次披露和估算累计融资；私营公司没有经过核验的资本结构表。Harmattan $242M 累计融资为估算值，来自两项独立公开披露（B 轮前 $42M + Series B $200M）。Quantum
      Systems 累计融资估算来自连续披露轮次。收入倍数仅供方向性参考。
    claimRefs:
      - CV013
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: FV003
    title: 估值和回报区间
    type: range
    layout: standard
    summary: 以 2026 年 1 月 $1.4B 的 Series B 入场估值为参照，给出 Harmattan AI 2028 年牛市、基准、熊市估值区间， 并列出情景假设和关键触发事件。
    data:
      items:
        - label: 熊市情景
          low: 0.8
          high: 1.2
          mid: 1
          unit: $B
          detail: 运营失败，或失去 Rafale F5 AI 任务；收入披露低于预期；意味着相对 Series B 入场价 0.6×–0.9× 回报。概率信号：20%。
          source: Operational failure or Rafale F5 AI mand
          tone: negative
        - label: 基准情景
          low: 2.5
          high: 4
          mid: 3.25
          unit: $B
          detail: 新增 1 个 NATO PoR；交付稳定；收入部分披露；Dassault 合作推进。意味着 Series B 1.8×–3× 回报。概率信号：50%。
          source: '1 additional NATO PoR; stable delivery; '
          tone: neutral
        - label: 牛市情景
          low: 4
          high: 8
          mid: 6
          unit: $B
          detail: 新增 2+ 个 NATO PoR；Rafale F5 AI 任务确认；ARR >$300M；产量 5,000+ / 月。意味着 Series B 3×–6× 回报。概率信号：30%。
          source: 2+ additional NATO PoRs; Rafale F5 AI ma
          tone: positive
        - label: Series B 入场
          low: 1.4
          high: 1.4
          mid: 1.4
          unit: $B
          detail: 2026 年 1 月 Dassault Aviation 领投 Series B 的投后估值（参考标尺）。
          source: January 2026 Dassault Aviation-led Serie
          tone: neutral
    approximationNotes: 估值区间为作者基于同业对比和情景逻辑作出的估算；没有收入披露，无法做 DCF。概率信号是定性评估， 不是精算概率。回报数字假设 Series C 不稀释；实际回报取决于稀释、优先权包袱和退出时点。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的七项投资维度评分，反映第 1–8 章基于证据的评估。分数代表作者对当前证据质量和风险调整后强度的判断， 采用五分制（1=很弱，5=很强）。
    data:
      items:
        - label: 市场机会
          value: 4 / 5
          detail: >-
            BCG C-UAS 市场到 2029 年达 $5–7B，CAGR 58%+；2025 年上半年欧洲防务 AI 支出 €946M；NATO 采购管线已由 TIE 26 验证。因市场碎片化和 NATO
            成员国预算不确定性扣 1 分。
          tone: positive
        - label: 产品和技术证据
          value: 4 / 5
          detail: 15 个月内拿下两个国防部 PoR；垂直整合平台横跨四个板块；SORONA 无人机规格已发布；Kalahari C2 已演示。因生产规模主张仍停留在 CEO 断言、缺乏验证，扣 1 分。
          tone: positive
        - label: 护城河和竞争位置
          value: 4 / 5
          detail: Dassault 合作形成复制壁垒；双国家国防部信用背书；全栈垂直整合在欧洲并不常见。因 Thales cortAIx 也是 Rafale AI 竞争伙伴、Helsing 具备规模优势，扣 1 分。
          tone: positive
        - label: 经济性和财务
          value: 2 / 5
          detail: 收入、利润率、烧钱速度和单位经济性完全未披露。TEKEVER 和 Quantum Systems 等同业已披露盈利能力或增长指标； Harmattan 尚未披露。这是首要信心约束。
          tone: warning
        - label: 风险画像
          value: 2 / 5
          detail: 已承认供应链依赖中国；治理不透明；关键人集中；出口管制姿态未验证；大规模运行可靠性未证实。Reuters 报道的同业先例（无人机坠毁、估值受损）值得警惕。
          tone: warning
        - label: 估值评分
          value: 3 / 5
          detail: $1.4B 位于同业区间低端；对战略投资者公平到偏满；对财务回报投资者，在没有收入披露时偏紧。 5.8× 已融资资本倍数适中；Helsing 在未披露收入情况下为 15× 已融资资本。
          tone: neutral
        - label: 证据质量
          value: 3 / 5
          detail: 合同证据和 Dassault 合作得到独立媒体（TechCrunch、Defense News、Tech.eu）较充分交叉印证。 财务指标完全停留在私域。供应链和治理由 CEO 自述，缺少独立验证。整体证据质量中等。
          tone: neutral
    approximationNotes: IC 评分是研究分析师基于截至 2026 年 6 月 7 日收集证据作出的定性判断。一旦收入披露（经济性 / 财务） 或 Rafale F5 AI 任务确认（护城河），分数会出现实质变化。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV013
      - CV014
      - CV042
