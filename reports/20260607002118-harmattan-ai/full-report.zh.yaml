  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入与财务模型
        - ARR、合同总额、毛利率、烧钱速度、单位经济性（单架无人机成本、每份 PoR 合同贡献毛利）、现金跑道
        - 没有财务数据，估值完全依赖战略溢价；无法建模回报情景或压力测试悲观情景；没有可比项可验证倍数
        - 直接接触管理层（Series C 流程数据室）；需签 NDA；向法国国防部采购官做参考访谈，核实合同金额区间
      - - Dassault 合作范围与 AI 授权
        - Harmattan 是 Rafale F5 项目的主要 AI 供应商，还是多个供应商之一；UCAS AI 开发授权的合同价值和范围；排他条款；来自 Dassault 与国防部客户的收入归因
        - Dassault 合作是最重要的投资逻辑锚点；若 Harmattan 只是多个 AI 合作方之一而非主要供应商，战略溢价会明显下降
        - 直接访谈 Dassault Aviation CEO 或项目副总裁；复核联合新闻稿中的排他性表述；联系法国 DGA 项目办公室
      - - 产能规模与单位经济性
        - 经验证的月产量（CEO 所称“每月数千台”）；制造设施产能；SORONA 单位成本和英国合同单位定价；供应链备份方案和原材料库存水位
        - 产能规模是核心运营逻辑；若产量实质性低于说法，悲观情景已经出现；单位经济性决定规模是否转化为利润
        - 工厂走访；供应链审计；向法国国防部索取生产日志作为客户参考；通过 DroneXL 或防务媒体独立核验
      - - 董事会组成与治理
        - 董事姓名和背景；投资者代表与投票权；任何股东协议条款；信息权；反稀释保护；Dassault 股权与财务 VC 的待遇
        - 治理不透明带来关键人物和保护性条款风险；没有董事会可见度，就无法评估投资者保护；对任何超过战略性小票的投资都至关重要
        - 向管理层或法律顾问直接索取；通过法国公司注册处（Registre du commerce et des sociétés）查 Infogreffe 董事会备案
      - - 出口管制合规
        - 无人机系统的 ITAR/EAR 分类；美国团队扩张，以及美国原产技术是否转移给非美国国防部客户；法国 CIEEMG 对英国和爱沙尼亚合同的出口许可状态
        - 防务技术出口管制违规会带来严厉刑事和商业处罚；Arlington VA 的美国团队暗示可能涉及美国原产技术；对 NATO 盟友客户而言，法国出口法合规具有重大影响
        - 法律顾问复核；检查 CIEEMG 数据库；直接询问管理层所有系统的 ITAR/EAR 分类
      - - 供应链主权化进展
        - 当前对中国稀土的依赖水平；具体电池和电机磁体供应链备份供应商；主权电机磁体（预计 2026 年底）和电池（3–5 年）的时间表；暴露于中国供应商的 COGS 占比
        - CEO 已承认该问题重大；不利地缘政治事件（台湾海峡升级、中国出口限制）可能在没有主权替代方案的情况下打断规模化生产
        - 供应链审计；CEO Le Grand Continent 访谈提供基线；与公开报道提及的电机和电池供应商做参考访谈
    notes: 议题按对建议的重要性排序；财务模型和 Dassault 范围是阻塞性尽调项。鉴于美国团队扩张和多 NATO 客户基础，出口管制合规至关重要。
