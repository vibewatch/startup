            body: >-
              Kalahari 明确支持 Asterix（空中交通监视）、CoT（NATO 态势感知）、Lattice（Anduril C2 标准）和 Sapient（AI /
              自主系统交换），使其更像多供应商编排层，而不是专有封闭生态。实际含义是，北约国家国防部采购 Harmattan 硬件栈后，理论上可把 Kalahari 与既有 Thales、Raytheon 或 Anduril
              C2 系统一起集成，而不必整体替换。该集成可选性降低新客户切换成本，也缓解政府采购中的「围墙花园」反对意见。但 Lattice 标准由 Anduril
