          - type: callout
            title: 收入不透明是影响确信度的第一约束
            body: >-
              可比公司组里其他所有重要同行都有某种财务披露——Anduril（披露 $2.2B ARR）、Quantum Systems（披露 100% 收入增长）、TEKEVER（披露已盈利）——但 Harmattan AI
              没有披露任何财务指标。因此，$1.4 billion
              估值完全定价在战略溢价、合同证明和市场顺风上。任何未能达到该溢价所隐含预期的财务披露，都会立即带来倍数压缩风险。投资者应把这种不透明视为一级尽调要求，而不是次要因素。
