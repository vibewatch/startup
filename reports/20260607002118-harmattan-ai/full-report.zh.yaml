      - number: '8.3'
        title: 可比公司组与战略溢价分析
        blocks:
          - type: paragraph
            body: >-
              收入倍数不适用于 Harmattan AI，因为收入没有披露。估值分析只能用情景逻辑、先例融资倍数（累计融资倍数）、战略溢价归因和可比公司画像，三角定位一个可辩护区间。最相关的五个同行是 Helsing（德国 /
              欧洲，防务 AI 软件 + UAS）、Anduril Industries（美国，自主防务平台）、Shield AI（美国，AI pilot 自主软件 + UAS 硬件）、TEKEVER（葡萄牙 / 英国，ISR
              无人机服务）和 Quantum Systems（德国，ISR UAS 硬件）。每家公司提供不同视角：Helsing 对应欧洲主权 AI 定位；Anduril 是规模化全栈模式的最清晰类比；Shield AI
              隔离出纯软件溢价；TEKEVER 展示财务证明溢价；Quantum Systems 展示有披露收入增长的硬件 ISR 倍数。

              Harmattan 相比纯 ISR 硬件同行（如 TEKEVER，约为累计融资 1× 到 1.5×）拿到的战略溢价，来自三点：Dassault 合作带来防务主承包商集成授权，形成复制壁垒；公司成立 15
              个月后即拿到两个国防部正式列装项目；以及跨 ISR、C-UAS、EW、打击四个防务细分的垂直整合平台架构。这些因素支撑其相对 TEKEVER 和 Quantum Systems 的溢价，但 Harmattan
              只有 2 年历史且收入不透明，限制了它相对 Helsing（5 年）和 Anduril（8+ 年）的定价。因此，中性估值立场是：对能看见合同爬坡的战略投资者，$1.4 billion
              当前入场价算合理；对没有收入披露、无法锚定回报模型的财务投资者，则已经偏满 / 偏高。

              同行证据里的反向因素包括：Reuters 2026 年 6 月报道一家硅谷防务创业公司的无人机坠毁和安全事件，说明运营可靠性失守时倍数会迅速压缩；Quantum Systems 估值三倍增长明确建立在已披露
              100% 年收入增长之上，强调重估所需的同行门槛是财务披露；Reuters 2025 年 11
              月提到法国无人机融资不确定性，特别指出防务创业公司野心与支撑估值的未披露收入之间存在张力。这些反向信号强化了投资建议中的条件限定。
