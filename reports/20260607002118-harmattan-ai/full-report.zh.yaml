          - type: callout
            title: 无公开开发者入口——软件成熟度无法验证
            body: >-
              截至 2026 年 6 月，Harmattan AI 没有可公开访问的 GitHub 仓库、开源包、API 文档或开发者 SDK。公司核心价值主张是嵌入六个硬件产品的 AI
