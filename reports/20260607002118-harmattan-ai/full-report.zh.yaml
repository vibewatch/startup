  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 现状替代方案
      - 相关性
    rows:
      - - 欧洲军用 C-UAS
        - 国防部为军事基地、海军舰艇和陆军采购无人机探测、跟踪、识别与反制系统
        - 非国防部出资的机场商用 / 民用 C-UAS；不专门针对无人机威胁的通用电子战
        - 各国国防部采购办公室；NATO NSPA 框架买方；付款方是各国国防预算
        - 传统防空雷达；人工操作干扰；临时短程反制手段
        - Harmattan AI VSHORAD（Gobi、Gobi Tempest）的核心细分；乌克兰经验与 NATO 东翼暴露风险把短期紧迫性推到最高
      - - 自主 ISR 无人机系统
        - 固定翼和 VTOL 平台，搭载持续监视载荷（SAR、EO/IR），由军队采购用于情报收集和目标指示
        - 用于测绘、农业或巡检的民用 UAV；有人 ISR 飞机
        - 特种作战和情报采购办公室；空军采购；付款方是国家防务或情报预算
        - 有人侦察机；商业采购的 DJI 或 Parrot 平台（许多 NATO 国家受限）；卫星图像订阅
        - Harmattan AI Sahara SAR 载荷和 ISR 平台在这一线竞争；Eurodrone 缺口与全天候持续监视需求推动增长
      - - 可消耗打击与巡飞弹无人机
        - 为规模化生产部署和作战消耗而批量采购的自主打击系统（不包括单件 MALE 平台）
        - 精确制导导弹和传统巡航导弹；有人打击航空；不可消耗的 MALE 平台
        - 陆军、特种作战和联合火力采购；付款方是国防部资本和运营预算
        - 传统精确制导弹药；既有巡飞弹供应商（以色列、美国）
        - Harmattan AI Barkhan 精确打击 UAS 在这里竞争；乌克兰 FPV 采用证明了向可消耗大规模系统迁移，该细分受益
      - - 部队战备与自主训练系统
        - 仿真、实兵演练和 ISR 训练平台，让部队为机器人化作战做准备
        - 自主系统范围之外的通用军用飞行训练；没有无人机集成的传统模拟器
        - 训练司令部和作战战备部门；付款方是运营预算而非资本采购
        - 传统飞行模拟器；商用无人机实飞训练
        - Harmattan AI Sonora 训练平台在这里竞争；法国宣布 1,000 架 AI 无人机训练合同，反映需求已经活跃
      - - 民用 C-UAS（CNI 保护）
        - 由基础设施运营商或政府安全预算出资、用于机场、核电站、能源节点和大型公共活动的 C-UAS 系统
        - 国防部出资的军用 C-UAS；不具备无人机反制能力的商业安保服务
        - 机场运营商、能源公用事业、大型活动安保主管机关；付款方是基础设施资本预算或政府安全拨款
        - 人工安保；没有反制能力的基础地理围栏；周界围栏
        - 与军用市场相邻，BCG 预计到 2029 年还会增加 2,000–3,000 套系统；支持合法部署的监管框架仍在成熟
      - - 通用商用 / 消费级无人机市场
        - 消费级摄影无人机、农业精准喷洒系统、物流配送试点
        - 上述所有军用、安防和 C-UAS 采购
        - 消费零售买家；农业运营商；物流公司
        - 无特定替代方案
        - 不在 Harmattan AI 范围内；IMARC 和类似面向消费者的报告覆盖这一细分，不能与防务采购 TAM 相加
    notes: 边界逻辑按采购预算划分：纳入支出必须来自国防部、NATO 项目、EU 防务基金或安全主管机关拨款；排除支出是民用商业或消费用途。CNI 行与核心市场相邻且在增长，但仍受监管闸门约束。
    claimRefs:
