      - number: '5.2'
        title: 产品模块栈——Sonora、Sahara、Gobi、Gobi Tempest、Barkhan
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 提供五个硬件产品模块，覆盖从操作员准备、持续 ISR、动能 C-UAS 防御到自主打击的完整任务生命周期。

              Sonora 是小型 UAS，用于单位级训练和操作员熟悉装备。规格包括：续航大于 40 分钟，1 分钟内起飞准备完成，航程 2 km，外形尺寸 35 × 42 × 11 cm，含电池重量低于 1.8 kg。EO
              相机以 30 fps 输出 1,280 × 720 像素，支持 6× 变焦（3× 无损）。IR 相机以 30 fps 输出 320 × 240 像素，配 2 轴机械稳定。系统具备等同 IP53
              的防护等级，支持夜间和低照度作业，并能在仿真模式下接入 Kalahari，保持训练连续性。

              Sahara 是自主 UAS 搭载的 SAR 载荷，覆盖全天候 ISR、目标检测、地形分割和海上监视。关键规格：L–S 频段、双线性极化、2 km 时 0.25 m 空间分辨率、10 km 时 1.2 m
              空间分辨率，物理尺寸 15 × 72.3 × 15 cm，重量低于 3.5 kg，功耗低于 65 W。工作模式包括 Stripmap 和
              circular；机载变化检测算法包括幅度变化检测（ACD）、多时相相干（MTC）和相干变化检测（CCD）。CEO 公开称 Sahara 作为面向 150 kg 以下无人机的 SAR
              雷达「世界独一无二」。该说法未获独立基准验证。

              Gobi 是面向 Group 1–2 UAS 威胁的动能拦截器。巡航速度：250 km/h；最高速度：350 km/h；命中动能：大于 10,300 J；发射准备：在发射箱常开状态下为 0 秒；重量：2.2
              kg；外形尺寸：32 × 34 × 34 cm。系统在无地面依赖下执行完全自主的直接撞击杀伤末端制导，从发射授权到威胁消除约需一分钟。

              Gobi Tempest 针对 Group 2–3 威胁，外形更大。巡航速度：215 km/h；最高速度：310 km/h；战斗部兼容：800 g；航程：12 km；发射准备：5 秒；含电池和战斗部重量：4.4
              kg；外形尺寸：46.5 × 46.5 × 69.5 cm。系统配备经认证的可逆 SAU，并支持协同空间作业。两款 Gobi 都包含完整系统，由发射箱、地面雷达、EO/IR 转塔和 C2 集成组成。

              Barkhan 是自主打击平台，用于争夺环境中的快速目标交战。速度：120 km/h；航程：20 km；外形尺寸：43 × 43 × 40 cm；机体重量低于 2 kg；载荷能力：3 kg；续航：25
              分钟；无线电链路：160–2,500 MHz。Barkhan 支持 GNSS 拒止环境导航、自主末端制导、光纤兼容，可单机运行，也可在协同蜂群配置中运行。五个硬件模块都被描述为平台无关、可集成任何 C2
              平台，Kalahari 是推荐编排层。
