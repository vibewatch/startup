        - 除非 Gobi 修改，否则投资逻辑破裂；继续投资前要求给出 HITL 路线图
      - - 中国供应链中断
        - 中国限制稀土元素或锂聚合物电池出口
        - 限制覆盖钕、LiPo 电芯或 MCU，影响无人机 BOM 的 >20%
        - 必须立即分散供应；对法国 / 英国国防部的交付排期承压
      - - 国防部合同交付失败
        - DGA 或英国国防部正式通知不合规或暂停排期
        - 任何公开通知显示合同延期、质量暂停或交付数量低于承诺排期
        - 执行可信度投资逻辑破裂；增加敞口前先做根因调查
      - - Dassault Aviation 合作破裂
        - Dassault 公开表示 AI 内部化，或 Harmattan 发布合作重组新闻稿
        - Dassault 收购竞争性 AI 能力，或 Harmattan 停用 Rafale F5 合作表述
        - 重新评估投资逻辑；Dassault 关系是进入作战航空市场的核心
      - - 竞争对手赢下法国或英国核心细分市场
        - Anduril、Helsing 或 Shield AI 赢得法国或英国国防部 ISR、C-UAS 或战术无人机合同
        - 任何披露的竞争对手在 Harmattan 主要市场细分中的中标
        - 密切监控；市场份额被侵蚀，会给未来收入假设发出下行信号
      - - 治理红旗
        - 联合创始人离职，或未披露关联方交易
        - 任何联合创始人退出、AMF 调查或重大未披露投资者关系
        - 立即升级尽调；联合创始人集中度高，领导层变化高度重要
      - - NATO 认证失败
        - Harmattan 未出现在 TIE 26 / LCI-X 参与者名单或目录中
        - 到 2027 年底，NATO 发布的任何互操作目录中都没有 Harmattan 系统
