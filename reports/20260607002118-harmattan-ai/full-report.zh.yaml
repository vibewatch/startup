      - number: '7.4'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 不到两年扩张到约 130 名员工；据 Defense News，公司称员工经验中位数为 15 年。这种罕见的人才密度，反映公司有意从 Safran、Isar Aerospace
              和相邻防务公司招聘资深人员。但关键人物集中度很高：Mouad M'Ghari（CEO）是所有主要新闻稿、投资人公告和 Le Grand Continent CEO 访谈中唯一具名高管。公司没有公开任命
              CFO、COO、CRO 或运营负责人。Martin de Gourcuff（CTO）只在技术联合创始人语境中被提及。

              治理不透明：Harmattan AI 没有披露外部董事会构成。Dassault Aviation 作为 Series B 领投方大概率拥有董事会席位，但未确认。FirstMark Capital、Atlantic
              VC 和 Tholus Capital 的投资人董事席位权利也未披露。一家国防独角兽在没有披露董事会监督的情况下运营，治理风险偏高，产品敏感性又放大了这一点。截至 2026 年 6 月，公开招聘岗位包括
              Chief Engineer、Electronic Warfare Team Lead 和 System Architect，这些高级岗位仍未填补。

              人才竞争：Harmattan 争夺 AI、EW 和自主系统工程师时，面对 Anduril（$61 B 估值、最新一轮 $5 B）、Shield AI（$12.7 B、最新一轮 $1.5
              B）、Helsing（据报道正以约 ~$18 B 估值融资 $1.2 B）以及 Quantum Systems（已融资 €310 M）。这些同行能提供明显更高薪酬、更成熟职业路径和更大运营规模。Helsing 的
              $600 M 融资专门瞄准乌克兰无人机制造扩产，直接争抢 EW 和 AI 无人机人才。

              执行负荷：一家 130 人公司要同时交付两个国防部项目、扩制造、延伸到 EW 与 Rafale F5 AI、管理 Skyeton 集成，并参加 Eurosatory 2026 和 SOF Week
              2026，执行负荷很重。公司没有公开项目管理框架或独立质量保证披露。
