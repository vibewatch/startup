      - number: '2.3'
        title: 买方、用户、付款方与 NATO/欧洲防务采购路径
        blocks:
          - type: paragraph
            body: >-
              欧洲防务无人机和 C-UAS 采购的买方结构具有机构化、多阶段特征。在国家层面，国防部采购办公室是正式购买实体；作战司令部（陆军、空军、特种作战部队）提出需求并影响采购，NATO
              能力目标和互操作标准则限制各国规格自由度。付款方通常是国家国防预算，并由 European Defence Fund 和 PESCO 联合项目提供 EU
              共同出资补充。用户是一线操作者——旅级指挥官、特种作战单位、海军舰员或边境部队——他们在 TIE 26、LCI-X Crucible Series 等演习中的反馈会直接影响采购决策。

              各细分市场采购周期不同。C-UAS 系统处于快速采购模式：乌克兰经验、NATO 波罗的海侧翼暴露，以及 EU
              机场附近无人机事件叠加，形成了立即采购的政治紧迫性。各国政府正在正常多年资本项目之外批准紧急采购；德国批准 Helsing 和 Stark 的 EUR 536 million
              采购就是这种快速购买动态的例子。相比之下，持久 ISR 和大型 MALE 无人机平台仍处于更长开发周期，Eurodrone（法国、德国、西班牙、意大利参与）只是因 2026 年 Q1 冲突经验才加速。

              三个买方细分直接对应 Harmattan AI 产品组合。第一，陆军部队——旅、营和快速反应单位——是 VSHORAD（Gobi、Gobi Tempest）和便携式 C-UAS
              的主要买方。预算权在各国国防部陆军采购办公室；采用触发点是战场紧迫性和 NATO 目标合规。第二，特种作战部队和情报机构购买具备 SAR 能力的紧凑 ISR 平台（Sahara
              载荷）；采购通过保密专项项目推进，周期更短，对单价容忍度更高。第三，NATO 联合和多国演习框架——包括 Latvia Innovation Range TEVV 和 LCI-X Crucible
              Series——相当于准采购事件，通过技术和作战评估的系统，会进入框架协议资格。对 Harmattan AI 这样的规模化阶段初创而言，NATO 测试活动本质上是客户资格路径，而不只是演示。

              民用基础设施保护正在形成第四类买方。EU 监管框架逐步成熟，使机场、核电站和能源节点能够依法部署 C-UAS；Harmattan AI
              供给军方的同一套硬件，也可能通过该渠道触达公用事业运营商和机场管理机构。该渠道仍处早期：BCG 预计 2029 年前需要 2,000–3,000 套 CNI C-UAS
              系统，但也指出监管框架尚未最终落定。JRC（European Commission）已经发布关键基础设施保护的五阶段 C-UAS 方法论，显示防务、联邦警察、地方安保和空域管理方之间的利益相关者整合很复杂。
