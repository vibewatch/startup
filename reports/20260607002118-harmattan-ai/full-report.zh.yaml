        - 欧洲（仅 C-UAS）
        - 国防部已承诺 $600M
        - 到 2029 年年化 58%+（总需求）
        - 自下而上：系统数量 × 单价；国防部已承诺预算 + 未分配预算 + CNI 上行空间分层计算
        - 高
        - 咨询公司估算；方法论已披露，但底层数据表在付费墙后；与采购公告最一致。
