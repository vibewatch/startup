      - number: '6.4'
        title: 集中度风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 客户画像里最显著的结构弱点，是客户极度集中。所有公开具名的创收客户都是西欧主权政府：法国和英国。这两个客户按定义接近已披露商业收入的 100%。考虑到 Sonora 合同是
              Harmattan 第一个合同，且交付时间线记录最充分，仅法国政府就可能贡献硬件收入的大部分。任何一个政府的单项政策变化——采购原则转向、防务预算削减、项目要求变化，或涉及自主系统的安全事件——都可能实质损害
              Harmattan 的收入。

              留存和重复使用数据不透明，进一步放大该风险。SaaS 公司会披露 NRR，商业防务主承包商会公布积压订单；Harmattan AI
              没有披露合同续约选项、交付确认、交付后使用情况，或任何可让投资人区分「刚赢得首批合同的公司」和「合同正在形成真实重复商业关系的公司」的指标。这一部分是结构性的——防务采购数据常常涉密或具商业敏感性——但在当前阶段，它让耐久性无法被独立验证。

              Reuters 2025 年 11
              月关于法国无人机制造商面临融资不确定性的报道，凸显更广泛行业风险：即使有政府支持，法国防务初创公司也可能遇到供应链瓶颈、产能爬坡困难和采购预算延迟，进而影响交付时间线和客户关系。文章提到，在投入成本波动中扩大生产，是整个行业的普遍挑战——Harmattan
              已在内部承认这一风险，但未公开量化。Dronexl 对 Dassault 交易的分析也指出，$1.4 billion 估值假设政府合同流会持续，但这一点尚未通过第二轮采购周期独立验证。
