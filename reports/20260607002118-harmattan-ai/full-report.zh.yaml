      - number: '8.5'
        title: 投资建议、退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              投资建议是有条件观察 / 继续研究。证据支持 $1.4 billion 估值里确有战略溢价：15 个月内拿下两个国家国防部正式列装项目、Dassault Aviation 里程碑式 AI 集成授权、欧洲防务市场
              50%+
              年增长顺风，合在一起足以支撑明显高于单纯累计融资倍数的估值。但五个阻断性尽调缺口让我们无法给出明确买入：（1）没有任何公开财务披露（收入、ARR、利润率、烧钱）；（2）董事会构成和治理结构未披露；（3）除了
              CEO 声称的「每月数千台」外，没有验证产能规模；（4）Dassault 合作条款以及 Harmattan 在 Rafale F5 AI 中的具体角色没有独立确认；（5）供应链主权化时间线依赖 CEO
              表述，未被独立验证。

              退出准备度仍然过早。Harmattan AI 成立于 2024 年 4 月，注册为法国 SAS，没有公开申报义务，也没有释放 IPO 或战略出售的信号。Dassault Aviation
              的战略合作和持股创造了一条合乎逻辑的收购路径（Dassault 整合自身 AI 能力），但这仍属推测；如果乐观情景假设兑现，更可能的近期结果是在更高估值上完成 Series C。Harmattan AI 2026
              年 6 月在巴黎 Eurosatory 2026 参展，以及美国团队扩张，都更像近期国际市场开发，而不是退出准备。

              战略收购方应采用不同于财务投资者的估值方式。对希望掌握空战主权 AI 的欧洲防务主承包商或国家政府而言，Harmattan 是稀缺资产；如果执行持续，Series C
              后大概率不会再以当前价格出现。对财务投资者而言，当前入场价已经包含战略溢价，回报取决于财务披露能否验证底层模型——这件事尚未发生，也无法从公开证据预测。

              估值立场是在战略溢价和执行不透明之间求平衡：对使命匹配的战略投资者是合理至偏满；对没有收入可见性的纯财务回报则偏满 /
              偏高。建议的尽调优先级，是在提高超出战略跟踪仓位的敞口前，拿到保密收入数据、利润率结构和单台生产成本数据。
