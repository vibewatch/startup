  - id: FM001
    title: 市场规模金字塔
    type: pyramid
    layout: standard
    summary: 从宽口径欧洲 UAV 到防务采购 SAM 和 C-UAS 子细分的嵌套市场层级，构成 Harmattan AI 短期可直接切入的需求边界。
    data:
      items:
        - label: 欧洲无人机市场（全细分，Grand View 口径）
          value: $17B (2024); $36B by 2030
          detail: 最宽的公开欧洲无人机口径，涵盖防务硬件、商业、物流、农业和消费；Grand View Research 以 2024 年为基准，CAGR 13.4%。包含 Harmattan AI 可服务市场之外的类别。
          tone: neutral
        - label: 欧洲 UAV 市场（军用 + 商用，MarketsandMarkets）
          value: $5.0B (2025); $7.98B by 2030
          detail: MarketsandMarkets 全应用欧洲 UAV 市场 CAGR 9.8%；防务和政府平台是主导细分，但商业拖累使总增速低于纯军用细分。
          tone: neutral
        - label: 欧洲军用无人机市场（MRFR 防务口径）
          value: $2.15B (2024); $4.65B by 2035
          detail: Market Research Future 防务专属欧洲军用无人机市场（CAGR 7.26%）；德国最大、英国增长最快；不含民用 C-UAS 和商用平台。
          tone: neutral
        - label: 欧洲 C-UAS 可寻址需求（BCG 自下而上）
          value: $0.6B committed (2025); $5–7B by 2029
          detail: BCG 2026 年 5 月白皮书基于 NATO 欧洲 4,000–5,000 套系统需求自下而上估算；包括已承诺国防部支出（到 2029 年 $0.8B）以及未分配防务和 CNI 上行；年增速 58%+。
          tone: positive
        - label: Harmattan AI 短期 SAM（C-UAS + ISR + 打击，NATO 测试）
          value: Unquantified from public data
          detail: >-
            欧洲国防部 C-UAS 和 ISR 采购的子集，Harmattan AI 的 Gobi / Kalahari 和 Sahara 平台在其中竞争；边界由 NATO 互操作资质、法国国防部管线和 Dassault
            渠道触达决定。暂无公开收入披露。
          tone: neutral
    approximationNotes: 各发布方估计不可相加，且口径不兼容；金字塔层级是概念嵌套，不是算术拆分。BCG 数字是 C-UAS 规模测算最贴近采购的锚点。
    claimRefs:
      - CM001
      - CM002
      - CM013
      - CM014
      - CM010
