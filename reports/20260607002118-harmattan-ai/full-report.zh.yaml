        - 欧洲（C-UAS，防务 + CNI）
        - $5–7B 总需求
        - 年化 58%+
        - 自下而上：系统数量（4,000–5,000 套）× 价格层级；需求远高于已宣布项目
        - 中
        - 预测远超已承诺预算；CNI 上行空间仍具猜测性，取决于监管是否完成。
      - - Market Research Future 研究机构
        - '2024'
        - 欧洲（仅军用无人机）
        - $2.15B
        - 7.26% (2025–2035)
        - 自研市场模型；最后更新于 2026 年 4 月；仅军用平台
        - 中
        - 未单独纳入 C-UAS；CAGR 低于 BCG 的 C-UAS 轨迹，因为仅平台口径排除了软件和服务。
      - - Market Research Future 研究机构
        - '2035'
        - 欧洲（仅军用无人机）
        - $4.65B
        - 7.26%
        - 按相同 CAGR 外推至期末
        - 低
        - 长期外推；2026 年 4 月版本的模型未反映 2026 年 Q1 再武装提速。
      - - MarketsandMarkets
        - '2025'
        - 欧洲（全部 UAV）
        - $5.00B
        - 9.8% (2025–2030)
        - 二级研究 + 专家访谈；全部应用
        - 中
        - 口径扩至商用 UAV；公开摘录未拆出军用专项占比。
      - - MarketsandMarkets
        - '2030'
        - 欧洲（全部 UAV）
        - $7.98B
        - 9.8%
        - 沿用上方模型
        - 中
        - 同样的范围限制；CAGR 低于 BCG 的 C-UAS 轨迹，因为商用业务拖低增速。
      - - Expert Market Research 研究机构
        - '2025'
        - 欧洲（全部 UAV）
        - $9.91B
        - 6.32% (2026–2035)
        - 自研模型；包含军用和商用；纳入 2026 年 Q1 更新
        - 中
        - 与 MarketsandMarkets 同年数字冲突（$5.00B vs. $9.91B）；很可能是俄罗斯是否纳入或防务系统边界定义不同。
      - - Grand View Research
        - '2024'
        - 欧洲（全部无人机）
        - $17.05B
        - 13.4% (2025–2030)
        - 收入模型；硬件占主导；防务是主要细分
        - 中
        - 发布口径最宽；在同一地区约为 IMARC 的 50×，说明 IMARC 可能只捕捉消费细分。
      - - IMARC Group
        - '2025'
        - 欧洲（无人机）
        - $275.6M
        - 9.03% (2026–2034)
        - 聚焦商用 / 消费细分的市场模型
        - 中
        - 比 Grand View 和 MarketsandMarkets 低一个数量级；几乎肯定排除了军用硬件；不适合作为防务市场规模输入。
      - - StartUs Insights
        - '2030'
        - 全球（军用无人机）
        - $22.81B
        - 7.6%（自 2026 年起）
        - 创业公司生态和采购数据扫描；全球
        - 低
        - 区域颗粒度被折叠；按支出计算，欧洲大约占全球市场 20–25%。
      - - StartUs Insights
        - '2033'
        - 全球（军用无人机）
        - $98.24B
        - 8.9% (2026–2033)
        - 同一模型外推；全球口径
        - 低
        - 长期外推；七年预测误差带很宽；仅用于展示全球规模背景。
    notes: >-
      各行不能相加，也不能求平均。不同发布方采用不同边界（仅 C-UAS、军用无人机、全部 UAV、含消费级的全部无人机）；直接比较前必须按范围归一化。BCG 是 C-UAS 的主要规模锚点；MRFR
      用于欧洲军用无人机；MarketsandMarkets 用于更宽的欧洲 UAV 口径。可信度评级反映方法透明度，以及与 Harmattan AI 采购市场的匹配度。
