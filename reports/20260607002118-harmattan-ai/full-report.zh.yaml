            title: Dassault 合作筑起不对称的主权护城河
            body: >-
              Harmattan AI 与 Dassault Aviation 的战略合作，将其接入 Rafale F5 与 UCAS 平台，是欧洲防务自主系统市场里最难复制的竞争差异点。包括
              Helsing、TEKEVER、Quantum Systems 在内的欧洲同业，都没有拿到同等级别的北约标准作战飞机项目一线 OEM 关系。该集成路径增强法国军方采购粘性，也让 Harmattan
              进入作战航空合同区间；受 ITAR 限制的美国竞争者，以及缺少打击与 C2 集成能力的 ISR 专业同业，结构上很难触达这类机会。
