figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Harmattan AI 的公开记录从 2024 年 4 月创立延伸到 2026 年 1 月成为法国首家防务独角兽；18 个月内拿下两项国家级国防部记录项目，是这条线的核心锚点。
    data:
      items:
        - date: 2024-04
          label: 在巴黎创立
          detail: >-
            Mouad M'Ghari、Martin de Gourcuff、Edouard Rosset 和 Marc Grelet 在 1 rue du Mail, 75002 Paris 设立法国 SAS 公司
            Harmattan AI。
          tone: positive
        - date: 2024-H2
          label: 种子轮（Atlantic VC）
          detail: Atlantic VC 领投未披露金额种子轮；约 $42M Series B 前累计融资的一部分。
          tone: positive
        - date: 2025-03
          label: Series A 轮（~$30M，FirstMark）
          detail: >-
            ~$30M Series A 由 FirstMark Capital 领投，Atlantic VC、Tholus Capital、Motier Ventures、Sisyphus Ventures
            跟投。资金用于产品规模化和国防部预审试验。
          tone: positive
        - date: 2025-07
          label: 首个记录项目（PoR）— 法国
          detail: 法国国防部数百万美元合同，要求到 2025 年底交付 1,000 架 SORONA 无人机；首个 NATO 记录项目，从创立到拿下用时 15 个月。
          tone: positive
        - date: 2025-09
          label: 第二个记录项目（PoR）— 英国国防部
          detail: 最多 3,000 套自主系统，用于英国紧急作战需求；第二个国家级国防部 PoR。
          tone: positive
        - date: '2025-10-02'
          label: Skyeton 合作
          detail: 与乌克兰无人机制造商 Skyeton 建立战略联盟，将 Harmattan 的 Sahara SAR 雷达集成进经战场验证的 Raybird UAS，面向 NATO 市场。
          tone: positive
        - date: '2026-01-12'
          label: $200M Series B — 法国首家防务独角兽
          detail: Dassault Aviation 领投 $200M Series B，估值 $1.4B；Harmattan 成为法国首家防务独角兽；合作覆盖 Rafale F5 和 UCAS AI 开发。
          tone: positive
        - date: 2026-02
          label: 承认供应链主权风险
          detail: CEO 在 Le Grand Continent 访谈中确认，电机和电池仍依赖中国稀土；主权电池方案还需 3–5 年。
          tone: warning
        - date: 2026-06
          label: Eurosatory 2026 — 巴黎
          detail: 在 Paris Nord Villepinte 首次亮相主场旗舰欧洲陆防展。
          tone: positive
    approximationNotes: 种子轮和 Series A 日期根据 Series B 前累计融资总额估算。内部里程碑和未披露政府互动未反映。
    claimRefs:
      - CO002
      - CO014
      - CO016
      - CO021
      - CO024
      - CO025
      - CO027
      - CO028
      - CO036
      - CO043
  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: 身份、产品栈、资本结构和关键依赖共同构成一个垂直整合模型：每一层都按主权 AI 原则内部自研。
    data:
      nodes:
        - id: hq
          label: 巴黎总部（SAS，2024 年 4 月）
          detail: 法律注册地址在 1 rue du Mail, 75002 Paris；欧盟托管数据基础设施符合 GDPR/CCPA；适用法国法律。
          tone: neutral
        - id: product
          label: 垂直整合产品栈
          detail: 硬件（Sonora ISR UAS、Gobi / Gobi Tempest VSHORAD、Barkhan 打击 UAS、Sahara SAR）、嵌入式 AI 软件和 Kalahari C2 全部内部自研。
          tone: positive
        - id: customers
          label: 国防部记录项目（PoR）
          detail: 法国国防部（1,000 架无人机）和英国国防部（最多 3,000 套系统）提供经验证需求、经常性收入信号和主权可信度。
          tone: positive
        - id: capital
          label: 资本与战略支持方
          detail: 累计融资 $242M；Dassault Aviation 是 Series B 领投方和航空航天集成伙伴；FirstMark、Atlantic VC、Motier、Tholus、Sisyphus 是 VC 支持方。
          tone: positive
        - id: dassault
          label: Dassault Aviation 合作
          detail: Rafale F5 和 UCAS 的 AI 开发授权；系统架构专长；国际业务拓展支持。
          tone: positive
        - id: risk
          label: 供应链与治理风险
          detail: 电机和电池依赖中国稀土；董事会组成未公开披露；CEO 集中风险；无公开财务披露。
          tone: warning
      edges:
