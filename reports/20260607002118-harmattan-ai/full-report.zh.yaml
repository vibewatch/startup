  - id: FI001
    title: 收入模型桥——从政府合同到毛利
    type: flow
    layout: wide
    summary: Harmattan AI 的收入从政府国防部采购流向硬件交付合同，再进入收入确认；毛利未披露。Dassault 和 Skyeton 伙伴关系代表正在形成的次级收入节点。
    data:
      nodes:
        - id: customer
          label: NATO / 盟国政府国防部
          detail: 法国国防部（DGA）、英国国防部（DE&S）及盟国伙伴；买方具有主权信用；项目在国家国防采购框架下运行。
          type: source
        - id: rfp
          label: RFP / 正式项目授标
          detail: 政府发布竞争性招标；Harmattan 赢得 PoR 合同（法国 2025 年 7 月；英国 2025 年 9 月）；“数百万美元 / 英镑”合同金额未披露。
          type: process
        - id: manufacturing
          label: 硬件制造
          detail: 垂直整合生产：机体、传感器（Lynred IR）、嵌入式 AI；公司称产能可达“每月数千套系统”；确切产出未经验证。
          type: process
        - id: delivery
          label: 系统交付 + 验收
          detail: 可能按里程碑或交付完成确认；法国国防部 1,000 架 SORONA 无人机已于 2025 年底前交付；英国国防部为紧急作战需求采购最多 3,000 套系统。
          type: process
        - id: revenue
          label: 收入确认
          detail: 硬件交付合同：收入在交付 / 验收里程碑确认。收入金额未披露；确认政策未公开。
          type: outcome
        - id: gross_profit
          label: 毛利（未披露）
          detail: 硬件交付毛利率未披露；国防硬件行业代理值为 15–40%；软件 / AI 集成代理值为 50–70%。中国稀土 COGS 暴露会在短期内压低利润率（CEO 称 3–5 年期限）。
          type: outcome
        - id: dassault_stream
          label: Dassault AI 集成收入
          detail: 新兴开发服务收入流；Rafale F5 和 UCAS 嵌入式 AI 开发；财务条款未披露；可能带来多年经常性项目收入。
          type: source
        - id: skyeton_stream
          label: 传感器授权收入
          detail: Sahara SAR 载荷集成进 Skyeton Raybird UAS；授权收入结构未披露；2025 年 10 月伙伴公告已确认。
          type: source
      edges:
        - from: customer
          to: rfp
          label: 采购授权
        - from: rfp
          to: manufacturing
          label: 合同授予
        - from: manufacturing
          to: delivery
          label: 生产 + QA
        - from: delivery
          to: revenue
          label: 验收 / 里程碑
        - from: revenue
          to: gross_profit
          label: 减 COGS
        - from: dassault_stream
          to: revenue
          label: 开发费用
        - from: skyeton_stream
          to: revenue
          label: 授权费用
    approximationNotes: 收入和毛利节点是定性描述；公开来源没有可用数字。收入确认步骤反映对 B2G 合同模式的分析，不是披露的会计政策。Dassault 和 Skyeton 收入流仍在早期，对总收入的贡献未知。
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
