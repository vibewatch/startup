      - number: '7.3'
        title: 合作伙伴、客户与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的商业和战略位置在结构上依赖少数交易对手，形成很高的双边集中风险。

              Dassault Aviation 作为领投方带来双重忠诚张力：Dassault 同时是 Series B 领投方、战略伙伴，也是 Rafale F5 与 UCAS 平台嵌入式 AI
              的潜在未来客户。如果关系因商业分歧、IP 争议或 Dassault 收购竞争性 AI 能力而恶化，Harmattan 会同时失去资本来源、合作叙事和锚定合同。Defense News 提到，Dassault
              CEO Trappier 曾表示，如有必要，法国可以「独自」开发下一代战斗机。Harmattan CTO 在 Series B 时写道，「国际秩序正在脱轨」；这种表述可能给美国或海湾市场开发添阻力。

              客户集中：所有已披露的收入客户都是政府实体，且只有法国国防部和英国国防部。截至 2026 年 6 月，没有公开资料证实公司已经拓展到其他 NATO 政府、非 NATO
              盟友或商业细分市场。两个项目下没有公开报道交付失败或合同履约问题，但客户只集中在两家仍是结构性风险。

              Skyeton（乌克兰）依赖：2025 年 10 月与 Skyeton Raybird 的合作，把 Harmattan 的 Sahara SAR 集成进去，带来地缘政治敏感性。俄罗斯对乌克兰工业设施的打击可能扰乱
              Skyeton 运营。将搭载 Harmattan 技术的 Raybird 再出口到第三国，也会增加出口许可复杂度。

              技术伙伴集中：Lynred（IR 传感器）是 SORONA 传感器栈的单一来源依赖。BCG 2026 C-UAS 白皮书强调，欧洲 C-UAS 供应链整体工业规模有限，替换供应商既困难又昂贵。
