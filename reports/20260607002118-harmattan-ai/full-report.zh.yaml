        - Sahara SAR 载荷装在轻型 UAS（<3.5 kg）上；机载处理；不依赖云
        - 2 km 距离 0.25 m 分辨率；ACD/MTC/CCD；全天候持续覆盖
        - 分辨率声明没有独立基准；集成伙伴仅限 Raybird
      - - 精确打击 / 协同交战
        - 传统弹药或大型 UCAV；交付周期长；大规模饱和能力有限
        - Barkhan 自主打击 UAS；可单机或集群；GNSS 拒止导航；20 km 航程
        - 机体 <2 kg，载荷能力 3 kg；可快速大规模交战
        - 实地交战记录未公开验证；对抗环境中的 EW 韧性未证明
      - - VSHORAD / 反无人机防御
        - 软杀伤 RF 干扰器（MyDefence 等）；缺少针对 Group 2-3 的动能命中即摧毁能力
        - Gobi（Group 1-2）和 Gobi Tempest（Group 2-3）动能拦截器，配 AI 制导
        - 发射后 ~1 min 交战；最高速度 350 km/h；12 km 航程（Tempest）
        - 没有独立杀伤链测试数据；附带损害认证未公开
      - - 多域 C2 / 任务编排
