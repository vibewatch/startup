      - number: '2.4'
        title: 增长驱动、采用约束与结构性逆风
        blocks:
          - type: paragraph
            body: >-
              首要需求驱动是地缘政治紧迫性，具体来自俄罗斯对 NATO 东翼国家的混合战争威胁，以及乌克兰冲突暴露出的持续无人机威胁。European Parliament 2026 年 1
              月关于无人机和新型战争系统的主动倡议报告明确要求，在 EU 防务规划各层级快速整合无人机和反无人机能力，并建设强健、自主的欧洲无人机产业。European Parliament Think Tank 数据确认，到
              2024 年 5 月，无人机已超过所有其他武器，成为乌克兰冲突中的首要伤亡原因。这为紧急采购支出提供了政治正当性，否则这类支出会面临漫长预算审批周期。

              第二个驱动是 NATO 标准化和测试基础设施。Rapid Adoption Action Plan（RAAP）下设立五个 NATO Innovation Ranges——包括 Latvia UAS/C-UAS
              靶场和 Cyprus/Estonia 网络靶场——为经过测试、具备互操作性的系统创造了机构需求。TIE 26 演习框架（40 家公司、300+ 参与者、60+
              系统测试）起到认证事件作用：展示技术和作战互操作性的系统，才有资格进入 NATO 作战演习，并随后进入联盟框架合同。这个结构化采用管线，降低了有能力跨过技术门槛的公司的商业化阻力。

              欧洲主权再武装支出是第三股顺风。欧洲航空航天和防务行业 2024 年营业额达 EUR 325.7 billion，研发投入 EUR 25.2 billion；Eurostat 指出 2022 年防务支出为 GDP
              的 1.3%，且存在上行压力。EU 到 2030 年的防务准备路线图包含欧洲无人机防御倡议，目标是部署具备互操作性的 C-UAS。仅德国就批准了 EUR 536 million 无人机供应合同（Helsing 和
              Stark）。SIPRI arms-transfer database（2026 年 3 月更新 1950–2025
              数据）提供了长期背景：欧洲国家历史上一直是主要常规武器净进口方，但现在具备建设本土供应链的结构性动机。

              主要采用约束来自产业碎片化、采购周期长度和技术转移风险。BCG 清楚指出重复建设问题：欧洲已宣布 35 种 C-UAS 平台变体，北美为 13
              种，造成囚徒困境——每个国家项目都太小，无法达到制造规模，但政治压力又让整合进展缓慢。这意味着 Harmattan AI
              这类欧洲初创面临悖论：总需求很大，但单个合同金额仍可能中等，因为没有任何单一国防部能承诺足以支撑高效生产的数量，多国标准化也仍在形成。BCG 经验曲线分析估计，每次产量翻倍可带来 10–20%
              单位成本下降，但欧洲订单碎片化阻止多数供应商沿曲线下行。

              技术信任和保密约束是第二个逆风。军方 C-UAS 采购办公室在授予生产合同前，需要大量评估、国家安全审查，有时还要求本土制造。欧洲偏好本土供应商，为 Harmattan AI 这样总部在法国、背靠
              Dassault Aviation 的公司创造机会；但也意味着 Anduril 的 USD 642 million USMC 正式列装项目等美国平台，可能设定能力标杆，却因主权要求不易被欧洲国防部采购。EP
              报告明确警告不要依赖非 EU 供应商，并主张建设强健、自给自足的欧洲无人机产业。这既是竞争护城河，也是市场约束：它抬高 Harmattan AI 的欧洲战略价值，同时放慢任何需要长期产业基础评估的采购决策。

              最后，技术快速迭代既是机会也是约束。Shahed 无人机在不到两年里完成重大升级——新战斗部、诱饵、推进系统、AI 瞄准。反制系统必须以同样速度迭代。这有利于软件优先的自主平台，而不是纯硬件传统厂商，正好符合
              Harmattan AI 的定位；但它也带来持续高研发强度，并压缩任何单一采购合同的生命周期价值。
