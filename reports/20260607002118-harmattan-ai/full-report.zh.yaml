            title: 来自低端成本和规模资本的商品化威胁
            body: >-
              两股力量正在夹击 Harmattan 的硬件价值主张。乌克兰、芬兰和法国厂商扩大 FPV 无人机生产，压低全行业单机硬件成本。另一边，Anduril 估值 $61 billion、收入基数 $2.2
              billion，有资本消化欧洲市场进入亏损，包括低于成本运营以挤掉刚拿到正式采购项目的竞争者。Harmattan 最好的防守，是法国国防部关系推进速度和 Dassault
              合作的专属性；但融资体量差距客观存在，尽调必须追问合同排他性和期限。
