      - number: '7.6'
        title: 图表与附录
        blocks:
          - type: callout
            title: Gobi 的 HITL 缺口是严重性最高的单项风险
            body: >-
              Harmattan 公开描述 Gobi 可在「每次拦截无需人在环」的情况下运行。这个功能设计带来严重性最高且尚未缓释的风险：一件致命性自主武器，没有披露 AI 安全认证、没有 IHL
              合规文件，也没有公开交战规则的技术说明。一旦发生高关注度误识别事件，英国或法国国防部可能暂停项目，监管可能介入，并损害 Harmattan 在所有 NATO 客户中的地位。任何投资承诺前，尽调必须补上这个缺口。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR003
          - type: callout
            title: 供应链不透明是 Series B 部署的实质执行风险
            body: >-
              Harmattan 计划用 $200 million Series B 资金扩大制造。但公开资料没有说明制造设施、产能指标或部件采购图谱。BCG 2026 年 5 月 C-UAS 白皮书明确指出，欧洲 C-UAS
              系统「依赖尚未为持续消耗而建好的供应链」。在这个背景下，中国稀土和电池敞口叠加缺乏主权采购证据，构成尚未缓释的执行风险，可能威胁对两个国防部客户的交付。
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: callout
            title: 采购紧迫性是双刃催化剂
            body: >-
              Harmattan 从创业公司迅速进入正式列装项目，直接受益于法国和英国的战时紧急采购机制。帮助公司赢下 2025 年合同的同一份紧迫性，可能会随着乌克兰停火或政治重组而消散。投资者应建模一种情景：2026
              年后采购回到完整生命周期评估周期。若如此，下一代合同的收入确认时间会大幅拉长，Harmattan 也必须与拥有几十年合规基础设施的主承包商竞争。
            calloutType: insight
            claimRefs:
              - CR036
              - CR038
              - CR040
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的乐观逻辑建立在四个相互叠加的支柱上。第一，结构性需求：欧洲 C-UAS 与自主系统市场年增速超过 50%，BCG 预计到 2029 年达到 $5–7
              billion；已承诺的国防部支出将从 2025 年的 $600 million 增至 2029 年的 $800 million，基线之上还有大量未分配防务支出。Harmattan 的垂直整合模式覆盖 ISR
              无人机、反无人机拦截器、电子战平台、打击 UAS 和 Kalahari C2 平台，使其能够跨四个细分承接需求，窄型竞争对手做不到。第二，主权侧验证：公司成立 15 个月内拿下两个国家国防部正式列装项目（法国
              2025 年 7 月、英国 2025 年 9 月），在欧洲防务采购里执行速度领先同龄同行，也建立了纯技术同行在相近年龄缺少的经常性收入基础。第三，Dassault Aviation 护城河：2026 年 1
              月战略合作形成双向锁定——Harmattan AI 为 Rafale F5 标准和未来 UCAS 提供嵌入式 AI，Dassault
              则提供系统架构深度、任务系统集成经验和国际市场通道，大幅缩小可竞争者集合。第四，防务 AI 的长期顺风：European Parliament Research Service 在 2026
              年研究中确认，军用无人机系统已从实验走向作战基线；NATO 2026 年 5 月 TIE 26 演习测试了 60+ 项 C-UAS 技术的互操作性，形成一条更有利于 Harmattan
              这类已有合同背书供应商的采购管线。

              反向逻辑同样关键。收入不透明是影响确信度的第一约束：Harmattan 没有公开披露 ARR、合同总价值、毛利率、烧钱速度或单位经济模型。因此，$1.4 billion
              估值完全定价在战略溢价、合同证明和同行倍数上，而不是财务模型输入。没有收入披露，市场报道的估值隐含了无法压力测试的收入倍数；一旦合同延迟、重谈，或 Rafale F5 时间线滑后，倍数可能快速收缩。供应链脆弱性是
              CEO 承认过的风险：无刷电机磁体的中国稀土依赖和电池化学体系依赖仍在，电池主权替代方案还要 3–5
              年。在中国出口管制收紧的情景下，产能目标会更像愿景，而不是可执行计划。治理不透明是第三个反向因素：董事会构成未公开披露，关键人物集中在 CEO Mouad M'Ghari 和 CTO Martin de
              Gourcuff 身上，且没有公开章程说明投资人权利或股东保护。最后，防务科技整体倍数压缩风险是真实的：Reuters 2026 年 6 月报道，一家估值 $1.3 billion
              的硅谷防务创业公司因无人机坠毁和安全事件陷入可靠性危机；这提醒市场，一旦运营故障浮出水面，战略溢价会迅速蒸发。Harmattan 必须维持无瑕疵的可靠性记录，才能守住溢价估值。
