      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 Harmattan AI 到 2027 年底前再拿下两个或更多 NATO 成员国正式列装项目，在 2030 年目标前启动 Rafale F5 标准的 AI 集成工作，实现每月 5,000+
              套系统产能，并披露年经常性收入（ARR）超过 $300 million。在这些假设下，Dassault 合作会形成事实上的防务主承包商合作估值底，2028–2029 年向 Helsing 类倍数（成立约 5
              年时估值 $18 billion）重估就变得可达。乐观情景估值区间为 2028 年 $4–8 billion，意味着相对 2026 年 1 月 Series B 入场有 3×–6×
              回报。打开乐观情景的关键触发点是 Rafale F5 AI 授权：如果 Harmattan 的嵌入式 AI 被确认为法国下一代战斗机项目的主要 AI 供应商，可触达合同总价值将是变革性的（仅法国的 Rafale
              F5 目标就有 40+ 架机体，并伴随数十年支持周期）。

              基准情景假设到 2027 年底前再拿下一个欧洲 NATO 正式列装项目，现有法国和英国合同稳定交付并验证利润率，没有重大运营故障或供应链中断，最终披露部分收入，确认单位经济模型可观但并不异常优秀。Dassault
              合作稳步推进但不加速。基准情景估值区间为 2028–2029 年 $2.5–4 billion，意味着相对当前入场有 1.8×–3× 回报。这个情景与同行区间一致：Quantum Systems 在披露 100%
              收入增长后估值提高三倍，说明 Harmattan 只要一次可信的财务披露，就可能催化类似跃升。

              悲观情景假设出现运营可靠性事件（无人机坠毁、任务失败、供应链中断导致交付延迟），Rafale F5 AI 集成被授予其他供应商（例如 Thales cortAIx，Dassault 与其也有 2025 年 11
              月协议），且收入持续不透明，外部验证无法完成。在这些条件下，Harmattan 在假设的 Series C 中会面对平轮或下轮，$1.4 billion 估值会向累计融资锚点（$242 million
              基数）压缩。悲观情景估值区间为 $800 million 到 $1.2 billion，意味着只有 Series B 价格的
              0.6×–0.9×，财务投资者会遭受实质减值。关键悲观触发点不是单独的中国供应链中断——CEO 承认过这个风险，也给出了解决时间线——而是供应链中断与 Thales 赢得竞争性 AI 授权同时发生。
