      - number: '3.4'
        title: C-UAS 专家、传统厂商与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              MyDefence（Copenhagen, Denmark）是最直接相关的 C-UAS 专家。公司有 134 名员工，全球部署超过 5,000 套系统，客户组织超过 100 家，积累的部署基数很可能超过
              Harmattan 公开确认的 C-UAS 足迹。公司 2026 年 3 月以 Made-in-USA 模式在 Oklahoma City 开设美国生产设施，2026 年 4 月获得 Australian
              Department of Defence A$9.81 million 合同，并支持 US DHS 为 FIFA World Cup 2026 保护做准备。MyDefence 的产品——可穿戴
              Wingman、便携式 Pitbull 和固定站点多传感器阵列——仅属于电子战软杀伤系统。它们执行 RF 探测、干扰和扰乱，但不提供动能直接撞击拦截，不提供 ISR、打击或 C2。相对 Harmattan 的
              Gobi 拦截器（Group 1–2 动能）和 Gobi Tempest（Group 2–3 动能），MyDefence 只在软杀伤层竞争。多数 NATO 军队的现状替代方案仍是
              Thales、Raytheon、L3Harris 等成熟主承包商提供的传统 C-UAS 系统。这些传统厂商提供采购安全感、既有集成路径和经验证互操作性，但缺少嵌入式 AI 驱动自主能力，也没有 Harmattan
              为 Gobi 声称的分钟内交战周期。资金充足的 NATO 军队理论上仍可内部自研，但鉴于在相关时间窗口内部署可用 Group 1–3 拦截系统所需的自主能力开发速度，这种路径不太可能。
            claimRefs:
              - CP033
              - CP034
              - CP035
      - number: '3.5'
        title: 护城河耐久性与商品化风险
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的主要护城河来自结构和关系两端。Dassault Aviation 合作给了它一条进入北约标准作战飞机项目（Rafale F5 与 UCAS）的、公开可查的一线 OEM
              集成路径；在欧洲防务自主系统初创公司里，这一点独一份。Helsing、TEKEVER 和 Quantum Systems
              尚未公开复制同等项目深度。法国和英国国防部的正式采购项目，靠漫长政府合同周期、高切换成本，以及嵌入 Harmattan Sonora UAS 与 Kalahari C2
              生态的训练依赖，形成采购锁定。第二个结构优势是纵向整合的全谱系产品组合——SAR 载荷（Sahara）、训练 UAS（Sonora）、打击系统（Barkhan）、C-UAS 动能拦截器（Gobi、Gobi
              Tempest）和 C2 （Kalahari）。欧洲国防部若要更换 Harmattan，竞争者必须复制整套体系级系统栈，而不是补一个单点能力。三类商品化风险已具实质性。第一，乌克兰战争推动欧洲 FPV
              无人机产能扩张，乌克兰、芬兰和法国厂商同步加速，正压低全行业单机硬件成本，也削弱买方为先进平台设计支付溢价的意愿。第二，Anduril 估值 $61 billion、收入基数 $2.2
              billion，有资本消化欧洲市场进入亏损；其 2026 年 5 月赢得荷兰国防部项目，指向更大范围的欧盟扩张。一旦 Anduril 拿到 OCCAR 或 EU Defence Fund 资格，Harmattan
              的主权叙事会被挑战。第三，开源视觉模型和 LLM 衍生推理框架推动自主系统软件栈商品化，未来三到五年可能侵蚀软件自主层的差异化；不过 Harmattan 的 SAR
              传感器集成和多系统蜂群协同仍是更可防守的细分壁垒。整个竞争集合的价格都不透明；Harmattan AI、Helsing、Anduril、TEKEVER 均未公开标价。没有直接采购尽调，就无法比较成本效益。
