  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 进入的是一个竞争激烈、资本高度充足的欧洲防务自主市场，可分为五类竞争者。直接欧洲同行——Helsing（德国）和
              TEKEVER（葡萄牙、英国、法国）——在主权资质、制造规模和已验证作战部署上竞争。美国防务科技主承包商——Anduril 和 Shield AI——带来压倒性的资本规模、先进自主系统组合和已验证的 DoD
              合同工具，但受 ITAR 约束，EU 主权定位有限。欧洲 ISR-sUAS 专家——主要是 Quantum Systems（德国）——瞄准同一情报收集和拒止环境利基，但不提供打击或
              C2。MyDefence（丹麦）等 C-UAS 专家覆盖反无人机拦截细分，与 Harmattan 的 Gobi 和 Gobi Tempest 拦截器重叠。Delair（法国）等商用相邻无人机公司在军用 ISR
              边缘竞争，但不是主要军事系统集成商。没有单一竞争者复制 Harmattan 在单一纵向一体化栈内同时集成 SAR ISR、自主打击、动能 C-UAS 和 AI 驱动 C2 的全谱野心；该栈还由一家 Tier-1
              OEM 与 NATO 标准战斗机项目的合作锚定。
