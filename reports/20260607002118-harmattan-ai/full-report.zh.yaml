      - number: '4.3'
        title: 资本充足性、融资历史与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 融资节奏很快，相比公司年龄，目前资金相当充足。「公司概况」章节已覆盖完整时间线融资记录；本节聚焦 2026 年 6 月时点的前瞻资本充足性。Series B 于 2026 年 1 月
              12 日完成，由 Dassault Aviation 领投，带来 $200 million 新资金；Motier Ventures 续投。加上 Series B 前估计 $42 million
              融资（Atlantic VC 领投种子轮；FirstMark Capital 领投约 $30 million 的 Series A），公司累计融资约 $242 million。Dassault 的具体出资额，以及
              Motier 之外的共同投资方身份，均未披露。

              Series B 资金用途——扩大制造、新产品领域和 AI
              部署——符合防务硬件制造商规模化时的资本密集属性。无人机产线、零部件采购库存、测试基础设施和多国运营，都需要持续现金投入。公司未公开披露任何债务融资、项目融资安排或信贷额度，说明股权融资仍是唯一资本来源。

              账上现金、烧钱速度和现金跑道均未披露。若按每月 $2–3 million 代理烧钱速度（基于员工数估算），并以 2026 年 1 月完成 $200 million 融资计算，在当前运营规模下可粗略推出 5–8
              年跑道——但该估算忽略了制造资本开支、零部件采购营运资金，以及未来规模化招聘，这些都会显著压缩跑道。没有任何资本市场文件、注册公开债务或已发布季度报告，因此所有跑道估计都是分析代理，不是已验证数字。

              Dassault 合作给资本充足性增加了超出资金投入的战略维度：Dassault 承诺把航空航天项目开发经验、供应链接入和国际业务拓展网络带给
              Harmattan。虽然这类非货币资本不进资产负债表，却能降低公司最高价值潜在收入流（Rafale F5 集成、UCAS 项目）的商业化和市场进入风险。
