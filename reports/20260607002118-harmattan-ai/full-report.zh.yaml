    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与法律版图
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 按法国法注册为简化股份公司（SAS），登记地址为法国巴黎 75002 邮区 rue du Mail 1 号，增值税号 FR39978035392。公司由 Mouad M'Ghari 以及
              Martin de Gourcuff、Edouard Rosset、Marc Grelet 等联合创始人于 2024 年 4 月创办，从第一天起就把自己定位为防务科技公司，而不是消费 AI
              初创。巴黎注册地址同时也是法定住所和运营总部；截至 2026 年 6 月访问的招聘页确认，公司还在英国、瑞士、摩洛哥、阿联酋和美国设有办公室。2026 年 6
              月发布的开放岗位覆盖巴黎、Lausanne、Wissous、伦敦、Arlington VA、UAE 和波兰，显示其运营版图确实横跨多国。

              公司将核心战略信条概括为「协同饱和」——自主机器人部队以统一整体的方式，在完整作战谱系中大规模行动；军事优势不再只取决于单个平台性能，而转向能否大规模生产、部署并协同自主系统。该理念同时牵引产品路线图和制造战略：Harmattan
              把量产准备度放在一阶目标，而不是下游愿景。公司使用条款页面最后更新于 2025 年 11 月 10 日，并引用 GDPR、CCPA/CPRA 和 CalOPPA
              下的合规义务，确认其数据基础设施托管在欧盟，也显示其隐私合规姿态有意对齐防务行业企业要求。截至 2026 年 6 月，公司网站将其归入「防务科技」行业；在 Dassault Aviation
              合作改变对外叙事之前，公司曾自称「下一代防务主承包商」。
