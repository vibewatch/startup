      - number: '3.3'
        title: 欧洲相邻竞争者：TEKEVER、Quantum Systems 和 Delair
        blocks:
          - type: paragraph
            body: >-
              TEKEVER（Lisbon, Portugal；在英国和法国有重要业务）是结构上最不同的欧洲竞争者。TEKEVER 不销售平台，而是提供
              情报即服务（Intelligence-as-a-Service）：以订阅或按任务计费方式交付无人机监视。该模式带来罕见组合：快速增长和盈利能力；在公司获得 NATO Innovation Fund 支持的
              €70M Series B 时，领投方 Baillie Gifford 确认了这一点。TEKEVER 的 AR5 持有一份 €30M EMSA 框架合同，用于欧洲海事 UAS 监视。公司在乌克兰部署系统用于远程
              ISR，并入选 Project NYX，为 UK Army Apache 直升机开发忠诚僚机旋翼平台。法国 Cahors 工业基地目标在 2026 年夏季启动生产；North Carolina 办公室于 2026
              年 5 月开设，以进入美国市场。TEKEVER 在英国 OVERMATCH 投资计划下的总承诺达到 £400M。TEKEVER 的服务层收入模式意味着它不太可能在平台级国防部项目中取代
              Harmattan，但其在欧洲海事和边境监视中的 ISR 即服务 主导地位，与 Harmattan Sahara SAR 载荷用例重叠。Quantum Systems（Munich，2015 年创立）于 2025
              年 5 月完成 €160M Series C，由 Balderton Capital 领投，Hensoldt 和 Airbus Defence and Space 战略参投。随后 2025 年 11
              月的一次融资事件据称使公司估值增至原来的三倍以上，超过 €3B。公司在德国、乌克兰、澳大利亚和罗马尼亚拥有 550 名员工，并连续多年实现约 100% 收入增长，是可信的欧洲 ISR-sUAS 竞争者。其
              Vector AI 平台配备双 Jetson Orin 边缘计算板，可在 GPS/GNSS 拒止环境中自主导航；系统已在乌克兰和澳大利亚经受实战测试。不过，Quantum Systems 只是 ISR
              玩家：没有与 Kalahari 相当的打击、C-UAS 动能拦截或 C2 平台能力。Delair（Toulouse, France）生产企业测绘和监视无人机。其安全导向平台支持实时视频跟踪、军用频段通信，并可在
              −15°C 到 +50°C 温度范围运行。Delair 主要是一家企业数据采集公司，防务只是相邻细分；它不提供自主打击、C-UAS 动能拦截或 AI 驱动 C2 层，因此对 Harmattan AI
              更像边缘竞争者，而非直接竞争者。
