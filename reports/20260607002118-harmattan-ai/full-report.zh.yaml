      - number: '5.5'
        title: 信任、安全、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              Kalahari
              的安全架构采用端到端加密、基于角色的访问控制和完整审计轨迹，并按防务网络安全标准加固。系统的角色分区模型（指挥官、操作员、训练员各有不同授权范围）是主要人在环路控制机制，确保自主执行只在人工授权参数内发生。Gobi
              和 Gobi Tempest 都被描述为人在环路设计，但真实交战序列中的预授权程度没有独立文档证明。

              Harmattan 任何产品都未公开披露针对自主致命系统的 NATO 或 EU 监管认证。根据其发布的隐私政策和使用条款，公司在数据基础设施层面遵守法国法律、GDPR 和
              CCPA/CPRA。公司未公开发布任何涉密系统资质证书、REACH/RoHS 合规文件或电磁兼容性（EMC）认证。

              竞品基准揭示出值得尽调的能力缺口。Quantum Systems 的 Vector AI 使用双 Jetson Orin 边缘计算板，已记录 GPS/GNSS 拒止环境自主导航和 180+
              分钟固定翼续航，并经实战条件验证；相比 Harmattan 自述规格，这是置信度更高的边缘 AI 基线。Shield AI 的 V-BAT 在海上环境提供有文档记录的 ViDAR ISR 覆盖率，达到 3,140
              NM²/hr，但需要舰载发射基础设施；Gobi 的地面发射箱避开了这一点。TEKEVER 的 AR5 在 €30 million EMSA 框架合同下运行，是已验证的 ISR 海上
              UAS，也提供一个获监管认可的欧洲主权基准。截至 2026 年 6 月，Harmattan AI 任何系统都没有公开可得的独立第三方测试报告、现场部署审计或安全事故披露。
