          - type: callout
            title: 关键性能说法全部来自公司自述，尚未验证
            body: >-
              Harmattan AI 公布的每一项重大规格——Gobi 的 0 秒准备和一分钟拦截周期、Sahara 的 0.25 m SAR 分辨率、Barkhan 在争夺性电子战环境下的 GNSS
              拒止导航、Kalahari 的 Lattice 互操作性——都只来自官方产品页自述。截至 2026 年 6 月，没有独立测试报告、现场部署审计或第三方认证发布。对一家 2026 年 1 月完成 $1.4
              billion 估值交易的公司而言，任何旗舰产品规格都缺乏独立技术验证，是重大尽调缺口。最接近运营验证的是 Skyeton 合作，但该集成原计划 2026 年 Q1 落地，公告后运营状态尚未获独立确认。
