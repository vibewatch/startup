      - number: '5.4'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的系统为快速部署而设计：Sonora 不到 1 分钟完成起飞准备；Gobi 在常开式发射箱中保持 0 秒准备状态；Gobi Tempest 5
              秒准备就绪。每个系统都被描述为平台无关、可集成任何 C2 平台，因此除 Kalahari 本身外，也能与伙伴和北约标准 C2 系统互操作。

              迄今最重要的集成里程碑，是 2025 年 10 月宣布的 Skyeton-Harmattan 战略合作：把 Sahara SAR 载荷和 Harmattan 的 AI 技术集成进 Skyeton 的
              Raybird UAS。Raybird 已在乌克兰防务部队累计超过 350,000 小时战斗飞行，这使该合作成为 Harmattan 传感器技术接入经实战验证第三方平台的首个有文档记录案例。搭载 Sahara 的
              Raybird 系统计划于 2026 年 Q1 初始部署。

              Dassault Aviation 合作（2026 年 1 月，Series B 公告）面向 Dassault 未来作战航空系统——Rafale F5 和 UCAS 项目——嵌入 AI
              能力，尤其是自主系统控制。这是最受关注的路线图承诺，但尚未公布生产认证级集成的交付时间线。

              Harmattan 参加了 World Defense Show 2026（利雅得，2026 年 2 月）、UMEX 2026（阿布扎比，2026 年 1 月）和 SOF Week 2026（坦帕，2026 年
              5 月）；Eurosatory 2026（巴黎，2026 年 6 月）也确认其持续出现在北约市场防务展会上。公司声称每月交付数千套系统，但未披露生产设施名称，也未公布可独立核验的产量数字。
