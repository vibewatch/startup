      - number: '7.2'
        title: 供应链、制造与运营风险
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 已确认两个交付窗口紧的正式列装项目：向法国国防部交付 1,000 架 SORONA 无人机（2025 年底前交付），以及根据 2025 年 9 月合同向英国国防部交付最多 3,000
              套系统、用于近期部署。同时，Series B 资金要支撑制造扩产。BCG 2026 年 5 月 C-UAS 白皮书直接点名这一品类：「C-UAS
              系统仍然昂贵、难以规模化，并依赖尚未为持续消耗而建好的供应链。」Expert Market Research 2026 Europe UAV report 认为，欧洲无人机行业在自主能力、AI
              集成和产能规模上「落后美国和以色列同类 5–10 年」。

              部件与稀土依赖：无人机硬件——包括 LiPo 电池、微电子、RF 模块和电机组件——很大程度依赖中国制造和稀土材料。Group 1 UAS
              的锂电池供应链仍高度集中在中国厂商。无人机电机所用稀土元素（钕、镝）也会周期性受到中国出口管制。Harmattan 采用 Lynred 供应的 IR
              传感器（法国公司），说明部分零部件有主权来源，但电池、电机、处理器或 RF 部件的采购来源没有公开披露。SORONA 无人机被描述为「在法国组装」，但最终组装不等于全链条主权可控。

              制造爬坡与质量风险：月产量从数百台拉到数千台，需要大量资本和流程能力。公司没有披露制造设施、产能指标或质量管理认证（例如 AS9100、DEF STAN）。DroneXL 报道 Harmattan 正规划每月
              10,000 架无人机产能；这个规模需要完整的供应链、测试和质量基础设施。Reuters 2026 年 6 月报道，Anduril
              的无人机坠毁和安全事件说明，国防无人机快速扩产会带来真实运营安全风险，这是行业层面的模式。

              电子战与 GPS 拒止韧性：Harmattan CEO 强调，战场上可能出现 GNSS 不可用或 RF 通信被压制的场景。Gobi 拦截器与 SORONA 依赖嵌入式 AI 实现不依赖 GPS
              的飞行。MarketsandMarkets 2026 Europe UAV report 将 GPS 韧性列为设计要求，并称这会「增加开发复杂度和成本」。Harmattan
              任何系统都没有公开红队、软件审计或渗透测试披露。
