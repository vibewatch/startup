      - number: '6.2'
        title: 具名客户证明与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的客户证据质量，在正式采购项目确认上很强，但在部署深度、使用指标和结果细节上偏薄。法国国防部合同（2025 年 7 月授予，计划 2025 年 10–12 月交付）覆盖 1,000 架
              Sonora ISR 训练无人机，被描述为「数百万欧元」级别，定位是在 Orion 2026 多国演习前用于作战训练。专业防务新闻媒体 Army Recognition 在公告数日内报道了该合同；DGA
              竞争流程要求约 20 项技术规格，并吸引多家欧洲竞争者，Harmattan 凭价格竞争力和量产准备度胜出。这是公开记录中独立佐证最充分的客户证明。

              英国国防部合同（2025 年 9 月 DSEI London 宣布）覆盖最多 3,000 套自主系统，用于「紧急作战需求」。OpexNews.fr 和 Defense News
              均独立报道该授标。「最多」措辞带来数量不确定性，准确 GBP 合同金额也未公开。公告时点是在 DSEI 这个英国旗舰防务展上，符合加速采购路径，也支持公司将其描述为量产部署而非试点项目。

              Dassault Aviation 在 2026 年 1 月 Series B 公告中的公开声明确认了合作范围：在「主权、可控且受监测的 AI」原则下，为 Rafale F5 和 UCAS 开发
              AI。这算是开发阶段的具名客户，而非生产部署。Skyeton 合作提供渠道伙伴证明：Skyeton CEO 在公告时公开背书合作，Raybird 平台随乌克兰部队积累的 350,000+ 飞行小时，也可作为
              Harmattan 传感器集成进入运营验证机体的代理证据。不过，截至 2026 年 6 月，Harmattan Sahara 雷达自身在 Raybird 部署中的运营记录仍未获独立验证。

              公司自报的产能吞吐说法——「每月交付数千套系统」——出现在 Dassault 新闻稿中，但未被任何独立审计机构、政府采购机关或调查媒体验证。该数字应按公司声称估计处理，而不是观察到的指标。
