  - id: FM004
    title: NATO 采用漏斗——从测试到量产合同
    type: funnel
    layout: standard
    summary: NATO 制度化的“测试到采用”管线形成结构化采购漏斗；公司每通过一个阶段，买方风险就降低一步，也更接近框架合同。
    data:
      items:
        - label: 参加 NATO 行业演习（TIE 26 / LCI-X）
          value: 100
          detail: 40+ 家公司参加 TIE 26（2026 年 5 月）；约 215 个系统进入 LCI-X Crucible 1-26；面向 NATO 及伙伴国家的合格企业开放。
          tone: neutral
        - label: 通过 NCIA 技术评估
          value: 60
          detail: NCIA 评估航迹稳定性、传感器到 C2 的集成、识别性能和交战链路有效性；只有部分参与者通过。
          tone: neutral
        - label: 展示与 NATO C2 架构互操作
          value: 35
          detail: 系统必须在多国雷达、RF 传感器和 C2 方案之间，用共同且具备作战含义的格式交换数据。
          tone: positive
        - label: 有资格参加作战演习（Baltic Trust 26 / TEVV 活动）
          value: 20
          detail: TIE 26 毕业者可参加 Baltic Trust 26（拉脱维亚，2026 年 8 月）作战演习；TEVV 活动将在 2026 年全年持续，于拉脱维亚靶场开展。
          tone: positive
        - label: NATO 框架协议或国家级后续订单合同
          value: 10
          detail: 成功完成评估的系统进入框架协议资格池；各国国防部可据此下单；后续通常是带 MRO 义务的多年合同。
          tone: positive
    approximationNotes: 漏斗数值是序数权重，表示资质管线相对收窄程度，并非绝对公司数量或转化率。NCIA 的实际通过率数据并未公开。
    claimRefs:
