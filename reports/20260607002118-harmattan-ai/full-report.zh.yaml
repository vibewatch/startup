              Harmattan AI 称每月可交付数千套系统，这一速度接近 Helsing 已公开确认的产能：其德国南部 Resilience Factory 每月生产 1,000+ 套 HX-2。Harmattan
              未披露生产设施名称，也未给出可独立核验的产量。第三方产能证据出现前，这一说法只能按公司自述处理。对任何评估供应链韧性和正式采购项目交付义务的投资人或国防部交易方来说，声称产能和实际产能之间的差距都是重大尽调问题。
