  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入和排除支出、采购语境
        blocks:
          - type: paragraph
            body: >-
              界定 Harmattan AI 的市场，首先要从采购而非技术出发。公司的四个任务支柱——VSHORAD（反无人机动能拦截）、持久 ISR（SAR
              载荷监视）、精确打击（自主巡飞打击），以及部队战备（自主训练）——直接对应欧洲国防部和 NATO 项目线，而不是商用或民用无人机市场。因此，纳入支出包括：（1）NATO 成员国国防部用于 C-UAS 系统、自主
              ISR 平台和打击无人机采购的预算；（2）Rapid Adoption Action Plan（RAAP）和 NATO Innovation Fund 下的 NATO
              集体采购和互操作性项目；（3）European Defence Fund 共同出资的无人系统和 C-UAS 能力开发；（4）与 PESCO
              对齐、面向无人机和反无人机互操作性的联合项目。排除支出包括：面向农业、巡检、物流或消费用途销售的民用或商用无人机硬件；民航机构在机场周界部署、但不使用国防部预算的非军事
              C-UAS；以及支持但不构成无人机任务系统的通用 GNSS 或通信基础设施。

              现状替代方案零散且昂贵。欧洲武装力量目前依赖传统防空、人工操作干扰系统、人类在环热成像相机，以及各国自行采购的平台拼盘。BCG 估计，欧洲已宣布的 C-UAS 平台变体数量是北美的两倍以上（35 vs.
              13），导致单机成本更高、产能爬坡更慢，跨境互操作性有限。NATO 的响应——TIE 26 演习（2026 年 5 月，荷兰）和 Latvia Innovation Range TEVV 活动（2026 年 3
              月）——显示机构采购正从临时性的国家采购，转向以互操作性测试作为商业系统能否获得联盟范围合同的门槛。这就是 Harmattan AI 的进入走廊：在 TIE 26、LCI-X Crucible Series
              等演习中通过 NCIA 技术评估的公司，才有资格进入 Baltic Trust 26 作战演习和后续 NATO 框架协议。

              对规模测算最关键的相邻市场，是民用关键国家基础设施（CNI）C-UAS——机场、核电站、能源基础设施、大型活动场馆。BCG 预计到 2029 年，该市场还需要 2,000–3,000
              套系统。虽然这在技术上位于纯国防部支出之外，但 EU 正在推进监管工作，允许民用场景依法部署 C-UAS，从而打开一条军民两用采购路径；防务优先供应商可以用与军用版本相同的硬件和指挥架构切入。
            claimRefs:
              - CM001
