              TIE 26、Latvia TEVV 活动和 LCI-X Crucible Series 不是演示，而是带闸门的评估路径；经 TIE 测试的系统可以获得 Baltic Trust 26 资格，之后进入 NATO
              框架协议。对规模化阶段初创而言，参与并成功通过这些活动比传统销售管线更有直接价值，因为它能生成联盟级技术凭证，同时加速 32 个成员国的国家国防部决策。
