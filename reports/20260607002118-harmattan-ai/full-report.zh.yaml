  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 双层自主架构
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI
              把自主能力拆成两层互补架构，意在把人类指挥权和机器执行速度解耦。上层是任务编排，指挥官和操作员可以在人工授权参数内定义目标、保持态势感知、排序威胁，并协调分布式系统交战。下层是平台自主，单个战术边缘系统可执行分配目标、适应战场变化，并在授权参数内维持作战连续性。这样的分工意味着，指挥官用
              Kalahari 设定意图；每个平台（Gobi、Barkhan、搭载 Sahara 的 UAS）随后在批准边界内自主行动，不需要每个动作都由人确认。人类仍在决策环路中掌握授权，机器则以机器速度执行。

              公司的总体作战理念是「协同饱和」：自主机器人力量在全作战谱系内像一个统一整体行动，把军事优势从单个平台性能，转向大规模部署和协调自主系统的能力。产品策略有三根设计支柱：可消耗（系统可批量部署、可承受损失）、可扩展（在机器人优先时代，制造和战时增产是核心差异点）和自主（不依赖集中式基础设施的边缘推理，同时保留人类决策权）。每个产品模块都设计成既能独立运行，也能在
              Kalahari 编排下接入统一系统。这套架构也支撑 Dassault Aviation 合作：在同样的双层模型里，Dassault 系统定义意图，Harmattan AI 自主平台负责执行，目标是为
              Rafale F5 和 UCAS 协同空战嵌入 AI 能力。
