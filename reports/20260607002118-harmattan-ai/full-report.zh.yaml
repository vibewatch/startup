  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与主要买方
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Harmattan AI
              的商业基础完全锚定在主权防务部门。公开记录中的主要付费客户是法国国防部（DGA）和英国国防部，二者各授予一个正式采购项目——这是防务领域最强的采购信号，意味着多年预算承诺和正式采办治理。2025 年 7
              月，公司又宣布第三个未披露的 NATO 政府合同，使已确认正式采购项目总数达到三个。Dassault Aviation 是客户与投资人的混合体：2026 年 1 月 Series B 合作要求 Harmattan
              AI 为 Dassault 的 Rafale F5 和未来 UCAS 项目开发嵌入式 AI 能力，因此 Dassault 既是技术开发的付款方，也是进入更广泛空战采购的战略分销渠道。

              Skyeton 合作（2025 年 10 月）引入渠道合作伙伴模式：Harmattan 的 Sahara SAR 雷达载荷被集成进 Skyeton 经实战验证的 Raybird UAS。该合作瞄准 Raybird
              已有作战足迹的 NATO 市场，让 Harmattan 不必在每个市场单独赢得主权采购竞赛，也能间接触达盟国终端客户。Raybird 平台已随乌克兰防务部队累计超过 350,000 小时战斗飞行，为
              Skyeton 渠道提供了相当强的运营可信度。

              地理分层上，已确认足迹包括法国（国防部合同，加上 Dassault 总部和 Rafale 项目）、英国（国防部合同，加上新闻报道中的英国 Gobi 销售信号），以及通过 Skyeton 触达的更广泛、邻近乌克兰的
              NATO 生态。公司出现在利雅得 World Defense Show（2026 年 2 月）、阿布扎比 UMEX（2026 年 1 月）、坦帕 SOF Week（2026 年 5 月）和巴黎
              Eurosatory（2026 年 6 月），显示其有意进入海湾国家和美国 SOF 市场，但这些地区尚无公开宣布合同。客户基础完全由政府和机构组成；公司未披露任何商业或军民两用客户。
