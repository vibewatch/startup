      - number: '7.5'
        title: 竞争、财务与采购周期风险
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的 $1.4 billion 估值和约 ~$242 million 累计融资，明显低于最直接的同行。Anduril 2026 年 5 月完成 $5 billion Series H，估值
              $61 billion，2025 年收入翻倍至 $2.2 billion。Shield AI 2026 年 3 月累计融资 $2 billion，估值 $12.7 billion。Helsing 据报道正以
              $18 billion 估值融资 $1.2 billion。Quantum Systems 累计融资 €310 million，并报告年收入增长 100%+。Tekever 从 Baillie Gifford 与
              NATO Innovation Fund 融资 €70 million，且已经盈利。正如 Anduril CEO 在 Series H
              时所说：「国防过去不是吸引大量风险投资的品类。现在已经发生了实质变化。」资本涌入让这个赛道在合同、人才和战略伙伴上都极度拥挤。

              战时紧迫性导致采购周期集中：Harmattan 的两个正式列装项目都通过简化或紧急采购机制授予——法国 DGA 发布的征集只有 20
              项技术要求，英国国防部则引用「紧急作战需求」。在当前环境下，压缩采购通道是竞争优势；但如果地缘政治缓和、紧迫性下降，它会变成负担。冲突后采购可能回到完整生命周期评估，届时拥有几十年合规基础设施的传统主承包商会有结构优势。

              财务不透明与资本强度：Harmattan 没有披露收入、毛利率、烧钱速度或盈利路径。国防硬件业务资本强度高：营运资金需求包括制造、库存、政府应收款（通常 90–180 天）和保修义务。$200 million
              Series B 正用于制造扩产和领域扩张（EW、Rafale F5 AI）。如果采购收入确认延迟——政府合同中很常见——公司可能在达到现金流盈亏平衡前遭遇营运资金挤压。

              EU 碎片化风险：BCG 2026 C-UAS 报告称，欧洲格局「碎片化，国家项目并行、R&D 重叠、工业规模有限」。CEO 也承认 European Commission
              没有防务战略授权，欧洲战略自主行动「仍处于起步阶段」。这种碎片化限制了大型泛欧采购工具的出现，而这类工具本可让 Harmattan 超越双边合同实现规模化。
