  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 运营可靠性失败
        - Harmattan 系统发生无人机坠毁、任务失败或安全事件，并收到负面媒体报道或触发国防部审查
        - 战略溢价立即消退；Reuters 2026 年 6 月报道一家 $1.3B 美国防务初创公司无人机坠毁，显示投资者信心在一个季度内被侵蚀；PoR 合同承压
        - 全面退出，或在调查期间暂停持有；监控国防部关于合同状态的公开声明
      - - Rafale F5 AI 授权输给竞争对手
        - Dassault Aviation 宣布 Thales cortAIx 或另一家供应商成为 Rafale F5 标准的主要 AI 合作方，把 Harmattan 挤出核心授权
        - 投资逻辑锚点（Dassault 合作护城河）被打断；没有战略溢价，将重估到纯硬件 ISR 倍数；乐观情景概率接近归零
        - 立即减仓；下调至悲观情景估值 $800M–$1.2B
      - - 中国出口管制造成供应链中断
        - 中国政府限制电机磁体稀土或电池材料出口，并实质性拖延或停止 Harmattan 产线
        - 产量扩张目标变成愿望；PoR 交付承诺承压；主权可信度叙事受损；基准和乐观情景都受伤
        - 监控中国稀土出口政策；要求管理层提供供应链备份方案和库存水位
      - - 收入披露低于预期
        - 首次自愿或强制收入披露（例如 Series C 时）显示 ARR 低于 $50M 或毛利率低于 40%
        - 估值倍数压缩；悲观情景变成基准；按战略溢价定价的财务投资者出现减值；Anduril 和 Helsing 可比不再支持 $1.4B 入场
        - 下调至减持；基于披露收入重新建模；关注毛利率轨迹和烧钱跑道
      - - 治理或法律事件
        - 公开报道创始人纠纷、投资者诉讼、监管行动（ITAR/EAR 出口管制违规）或非自愿董事会重组
        - 关键人物集中风险落地；与 Dassault 的战略投资者关系受扰；法国国防部合同可靠性遭质疑
        - 鉴于美国团队扩张，全面复核并立即让法律顾问介入 ITAR/EAR 合规状态
    notes: 终止触发项按对投资逻辑的传导严重性排序。运营失败和 Rafale F5 授权丢失会打破投资逻辑；供应链和治理触发项会削弱投资逻辑，但若在 6–12 个月内处理，仍可恢复。
