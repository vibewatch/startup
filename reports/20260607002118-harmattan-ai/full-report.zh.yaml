      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 由四位核心成员共同创立。Mouad M'Ghari（CEO）毕业于 École Polytechnique 和 MIT；他是主要公开发声人，出现在所有重要新闻稿、Dassault
              Aviation 公告以及 2026 年 2 月 Le Grand Continent 长访谈中。Martin de Gourcuff（CTO）与 M'Ghari 共同创办公司，并在 Series B
              时发布了一条值得注意的 LinkedIn 声明，反映公司的地缘政治使命叙事。Edouard Rosset 在 Tech.eu、DefenceJobs.org 等多个第三方资料中被列为联合创始人。Marc
              Grelet 在 DefenceJobs.org 公司资料中被识别为联合创始人。创始四人之外，Defense News 2026 年 1 月报道称公司已从 Safran、Isar Aerospace
              等成熟防务公司招募高管，扩充了高层人才基础。

              截至 2026 年 1 月，公司员工超过 130 人；Defense News 称其中位经验为 15 年——若数据准确，说明公司有意招聘资深防务和工程人才，而不是以初级人员为主。开放岗位页列出 Chief
              Engineer、System Architect、Group Leads 和 Electronic Warfare Team Lead 等高级岗位，与一个正在成长的中期工程组织相符。

              治理仍是尽调缺口。没有公开披露说明董事会构成、投资人董事席位权利或治理机制。公司未作为受监管发行人公开提交文件。四位联合创始人似乎掌握高管决策，且未公开声明外部董事会监督架构；这使关键人物集中风险落在 CEO
              M'Ghari 和 CTO de Gourcuff 身上。Harmattan 的隐私政策和使用条款确认，所有争议适用法国法，商业争议通过 CMAP 仲裁，消费者可诉诸法院；但公司未公开单独的治理章程或公司章程。
