      - number: '1.4'
        title: 正式列装项目、合作伙伴与规模里程碑
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的商业执行记录，是其相对同融资阶段同行最突出的差异点。2025 年 7 月——成立约 15 个月后——公司拿下首个正式列装项目：来自一个 NATO 政府（法国）的数百万美元 AI
              小型无人机合同。Army Recognition 将该合同描述为向法国武装部队交付 1,000 架 SORONA 四旋翼无人机，计划 2025 年底前交付，用于支持 Orion 2026
              多国演习前的作战训练。该无人机重量低于 1.8 kg，续航 40 分钟，航程 2 km，搭载 EO 和可选 IR 摄像头（红外传感器由法国公司 Lynred 供应）。

              2025 年 9 月，英国国防部授予 Harmattan 第二个正式列装项目，交付多达 3,000 套自主系统，用于「紧急作战需求」——这意味着公司成立不到 18 个月就拿下两个国家国防部正式列装项目。CEO
              M'Ghari 在 2026 年 2 月 Le Grand Continent 访谈中确认，法国国防部订单在成立后 14 个月内完成，英国国防部订单在 15 个月内完成，未具名爱沙尼亚合作伙伴订单在 7
              个月内完成。2025 年 10 月 2 日，公司宣布与乌克兰 UAS 制造商 Skyeton 达成战略合作，将 Harmattan 的 Sahara SAR 载荷和嵌入式 AI 集成到 Raybird
              平台（350,000+ 战斗飞行小时），目标是法国及更广泛 NATO 市场。

              Dassault Aviation Series B 合作是封顶式里程碑，把 Harmattan 技术正式连接到 Rafale F5 标准（目标约 2030 年）和未来 UCAS 项目。公司参加了 UMEX
              2026（阿布扎比，2026 年 1 月）、World Defense Show 2026（利雅得，2026 年 2 月）、SOF Week 2026（坦帕，2026 年 5 月），并将参加 Eurosatory
              2026（巴黎，2026 年 6 月），显示其正积极开拓国际市场。公司声称产能为「每月数千套系统」，但该数字未经独立核验；DroneXL 分析还提到最高每月 10,000 架无人机的计划，同样未经核验。CEO
              M'Ghari 在 Le Grand Continent 访谈中强调，无刷电机磁体和电池化学体系的供应链主权仍是实质挑战，电池对中国稀土的依赖预计还会持续 3–5 年。
