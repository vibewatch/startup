      - number: '3.2'
        title: Tier-1 融资同行：Helsing、Anduril 和 Shield AI
        blocks:
          - type: paragraph
            body: >-
              Helsing（约 2021 年创立于德国）最初是为传统军事平台提供 AI 软件叠加层，2024 年转向打击无人机硬件。其 HF-1 与乌克兰产业伙伴共同生产；更新的 HX-2 自杀式无人机在 Helsing
              位于德国南部的第一座 Resilience Factory 制造，初始月产超过 1,000 架，并声称冲突情景下可扩展到每月数万架。Helsing 截至 2025 年 6 月 €600M 轮融资累计募集约
              €761.5M；据报道，2026 年 5 月还在敲定由 Dragoneer 领投、估值 $18B、规模约 $1.2B 的新一轮融资。Helsing 的 Altra 连接平台支撑多无人机协同，直接类比
              Harmattan 的 Kalahari C2 层。不同于 Harmattan，Helsing 是打击和软件专家：公开资料中没有其动能 C-UAS 能力或 SAR 载荷。Anduril（2017
              年创立，Costa Mesa CA）是美国占主导地位的防务科技主承包商。CEO Brian Schimpf 称其 2025 年收入翻倍至 $2.2B；公司 2026 年 5 月完成 $5B Series H，估值
              $61B，使累计融资超过 $11B。Anduril 的 Lattice 平台在异构系统之间提供自主 C2 和传感器融合——包括 Roadrunner 自主拦截器、Ghost 巡飞弹药和协同作战飞机。Anduril
              正在扩张欧洲业务：2026 年 5 月赢得荷兰国防部合同。不过，ITAR 和军民两用出口法规限制了欧洲国防部要求的主权技术转移；相较 Harmattan
              的法国公司身份以及法国、英国正式列装项目，这是结构性劣势。Shield AI（2015 年创立，San Diego CA）于 2026 年 3 月完成 $1.5B Series G，估值 $12.7B，由
              Advent International 领投、JPMorganChase 联合领投。其 Hivemind 自主软件已驾驶包括 F-16 战斗机在内的 26 类载具，并被 US Air Force 选为
              Collaborative Combat Aircraft 任务自主能力提供商。V-BAT UAS 已部署在几乎所有类别的 US Navy 舰艇上，并覆盖全部七支 Marine Expeditionary
              Units。Shield AI 正在收购 Aechelon Technology，将高保真仿真与 Hivemind 训练集成。Shield AI 的 EdgeOS
              中间件为确定性自主控制实现亚毫秒级本地延迟。Reuters 2026 年 6 月发布的调查记录了一家估值约 $13B 的美国防务科技初创的安全事件，包括无人机坠毁和工人受伤；这凸显全行业运营安全审查，可能影响包括
              Harmattan 在内的自主系统公司的监管姿态。
