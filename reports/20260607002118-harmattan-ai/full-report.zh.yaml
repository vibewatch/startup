      - number: '8.2'
        title: 估值背景、融资与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 的融资历史压缩得很快。Atlantic VC 领投的种子轮金额未披露，之后是 FirstMark Capital 领投、Atlantic VC、Tholus Capital、Motier
              Ventures 和 Sisyphus Ventures 参与的约 ~$30 million Series A；TechCrunch 报道 Series B 前累计融资为 $42 million。2026 年 1
              月 12 日，Dassault Aviation 领投 $200 million Series B，确立 $1.4 billion 投后估值——Defense
              News、TechCrunch、Tech.eu、AirForce-Technology.com 以及 Harmattan 自己的新闻稿均确认了这一点。截至 2026 年 1 月，累计融资约 $242
              million（Series B 前 $42 million 加 $200 million Series B）。Crunchbase
              也确认融资轨迹，尽管平台有速率限制、无法直接查询；DefenceJobs.org 列出 Dassault Aviation、FirstMark Capital、Atlantic VC、Motier
              Ventures 和 Tholus Capital 为投资方，进一步印证了财团结构。

              入场纪律需要调和四组张力。第一，估值 vs. 收入证明：$1.4 billion 估值约等于累计融资（$242 million）的 5.8×。对一家拥有两个国家国防部正式列装项目、且有 Dassault
              锚定战略护城河的公司来说，这个水平合理——但前提是合同收入正在规模化落地。没有披露，投资者面对的是二元执行风险。第二，Series A 到 Series B 的跃升很大：Harmattan 称 Series B
              相比 Series A「显著提高」，但既没有披露 Series A 估值，也没有披露跃升倍数，稀释模型因此不精确。第三，优先股堆叠动态未知：Dassault 投资份额相对于财务 VC
              投资者如何处理、清算优先权、反稀释条款以及任何信息权，都是未披露的私人条款。第四，主权防务溢价：法国总统在 X
              上背书，并将其定位为法国首家防务独角兽，带来一个政治估值底；在法国政府相邻的场景里（被防务主承包商收购、法国政府战略持股），这可能提供下行保护，但对财务投资者而言不能直接变成可流通价值。

              欧洲同行对比很有参考意义。德国 Helsing 据报道 2026 年 5 月接近以 $18 billion 估值融资 $1.2 billion，运营 5 年，对比 Harmattan 的 2 年；如果
              Harmattan 持续执行，按年龄调整后的估值轨迹对它有利。Quantum Systems 在 2025 年 5 月完成 €160 million Series C 后，又在 2025 年 11
              月一轮融资中将估值提高到超过 €3 billion；Reuters 指出，这次估值三倍增长由 100% 年收入增长驱动，而 Harmattan 尚未做出这种财务披露。总部在里斯本的 ISR 无人机龙头
              TEKEVER 以超过 £1 billion 估值融资 £400 million；关键差异在于 TEKEVER 已经盈利，估值下方有财务底，Harmattan 目前还不能这么说。Anduril 2025
              年收入翻倍至 $2.2 billion 后，在 Series H 达到 $61 billion 估值，代表自主防务平台上限；Shield AI 的 $12.7 billion 估值反映了 AI pilot
              已部署到 26 类载具上的软件厚度。Harmattan 的 $1.4 billion 位于同行区间低端，说明如果未来披露收入且数据强劲，仍有重估空间；但也说明当前入场倍数已经默认这些指标会不错。
