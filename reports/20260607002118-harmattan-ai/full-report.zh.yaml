  - id: FE001
    title: Harmattan AI 产品架构——双层自主堆栈
    type: stack
    layout: wide
    summary: 从指挥意图到实体平台执行，六层视角拆解 Harmattan AI 自主系统架构，并展示任务编排与平台自主之间的分离。
    data:
      layers:
        - label: 指挥官 / 操作员界面（Kalahari COP）
          detail: 战区级共同作战图；意图驱动的任务分配；交战规则配置；为指挥官、操作员和训练员提供基于角色的访问。
          tone: neutral
        - label: 任务编排层（Kalahari C2 Engine）
          detail: API 驱动编排；实时威胁排序；闭环执行；多源传感器融合；支持本地或混合边缘到云部署。
          tone: positive
        - label: 互操作 / 标准层
          detail: Asterix、CoT、Lattice、Sapient NATO 标准；传感器数据摄取并进行航迹分类；接入伙伴和盟国 C2 系统。
          tone: neutral
        - label: 平台自主层（Edge AI）
          detail: 机载推理无需依赖云；轨迹优化；末端制导；GNSS 拒止导航（Barkhan）；变化检测（Sahara）。
          tone: positive
        - label: 传感器 / 载荷层
          detail: Sahara SAR（0.25 m / 2 km，L–S 波段，<3.5 kg）；EO/IR 相机（Sonora、Gobi）；雷达地面传感器（Gobi/Gobi Tempest 发射箱系统）。
          tone: neutral
        - label: 实体平台层（UAS / C-UAS）
          detail: >-
            Sonora（训练）、Gobi（Group 1-2 拦截）、Gobi Tempest（Group 2-3 拦截）、Barkhan（打击，20 km，3 kg 载荷，GNSS 拒止）、搭载 Sahara 的宿主
            UAS。
          tone: neutral
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE022
      - CE024
  - id: FE002
    title: Kalahari 任务执行流——从意图到闭环交战
    type: flow
    layout: standard
    summary: 从指挥官定义意图，经 Kalahari 到自主平台执行，再到行动后反馈的逐步作战流程。
    data:
      nodes:
        - id: cmd_intent
          label: 指挥官定义任务意图
          detail: 任务目标、交战规则、资产分配和作战参数输入 Kalahari 的统一指挥环境。
          tone: neutral
        - id: kalahari_plan
          label: Kalahari 生成作战计划
          detail: 基于实时传感器融合和任务情报输入，完成威胁排序、资产分派和交战排序。
          tone: positive
        - id: op_execute
          label: 操作员在扇区内执行
          detail: 在任务范围内获得可见性和控制权；在指挥官定义的授权框架内，实时协调自主系统。
          tone: neutral
        - id: platform_receive
          label: 平台接收任务指令
          detail: Gobi、Barkhan、Sahara-UAS 或 Sonora 通过 Kalahari C2 链路（本地或边缘到云路径）接收已验证命令。
          tone: neutral
        - id: platform_execute
          label: 平台自主执行
          detail: Edge AI 处理传感器数据；在批准参数内执行自主轨迹、制导或成像，无需每个动作都保持连接。
          tone: positive
        - id: feedback
          label: Kalahari 监控结果
          detail: 交战结果、传感器数据和任务状态回传 COP；动态调整任务分配；保留完整审计轨迹。
          tone: neutral
        - id: trainer_mode
          label: 训练员排演（仿真模式）
          detail: 与实装系统断开；沿用同一 Kalahari 环境；通过嵌入式数据织物进行任务回放和行动后复盘。
          tone: neutral
      edges:
        - from: cmd_intent
          to: kalahari_plan
          label: 意图输入
        - from: kalahari_plan
          to: op_execute
          label: 计划分发
        - from: op_execute
          to: platform_receive
          label: 任务派发
        - from: platform_receive
          to: platform_execute
          label: 自主执行
        - from: platform_execute
          to: feedback
          label: 结果遥测
        - from: feedback
          to: kalahari_plan
          label: 动态重分配任务
        - from: kalahari_plan
          to: trainer_mode
          label: 仿真分支
    claimRefs:
      - CE022
