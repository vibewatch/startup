    rows:
      - - 乌克兰战争无人机经验与 NATO 东翼威胁
        - 利好
        - 当前
        - 把政治紧迫性转成常规预算周期之外的紧急采购；德国 EUR 536M 合同可作为其他国家模板
        - 确认 Harmattan AI 是否进入任何由乌克兰经验采购轮次催生的活跃国防部招标流程
      - - NATO 制度化测试管线（TIE、LCI-X、TEVV）
        - 利好
        - 当前
        - 从创新到框架合同形成结构化资质路径；NCIA 评估实际上就是采购闸门
        - 判断 Harmattan AI 系统是否已进入 TIE 26 评估，或是否排期参加拉脱维亚靶场即将开展的 TEVV 活动
      - - EU 无人机防务倡议与欧洲防务基金
        - 利好
        - 2026–2030
        - 把可互操作 C-UAS 和自主系统的共同出资集中起来；主权供应采购对各国预算的依赖下降
        - 跟踪 Harmattan AI 是否参与任何 EDF 或 PESCO 共同出资项目
      - - 主权供应偏好（非 EU 供应商风险）
        - 利好（对欧盟本土供应商）
        - 当前
        - EP 报告明确把依赖非 EU 供应商列为战略风险；为法国 / 欧洲公司创造偏好采购环境
        - 验证 Harmattan AI 平台的出口分类，以及是否已取得法国 DGA 批准
      - - Dassault Aviation 战略合作
        - 利好
        - 当前
        - EUR 200M B 轮融资和 Dassault 关系带来工业可信度，并可能打开 Rafale F5 集成路径；增强国防部供应商资质
        - 确认 Dassault 商业关系在财务投资之外的范围；评估 Kalahari 是否集成 MBDA 或 Thales
      - - 欧洲产业碎片化（35 种平台变体 vs. 北美 13 种）
        - 阻力
        - 当前
        - 国防部订单分散，任何单一供应商都难以拉起生产规模；单位成本保持高位；各国项目之间存在预算竞争
        - 要求提供平均合同规模，并判断在当前 NATO 标准化协议下是否可行多国框架订单
      - - 采购周期长且存在密级要求
        - 阻力
        - 当前
        - 3–5 年资本采购时间线与创业公司资本需求错配；密级审查增加延迟；还需要技术风险评估
        - 向 Harmattan AI 询问从首次国防部接触到签署合同的典型时间线；识别是否已有项目进入最终批准阶段
      - - 无人机威胁快速演化（对手迭代周期短）
        - 双向
        - 当前且持续
        - 迫使软件 / 硬件持续更新；有利于 AI 软件优先模式，但需要持续 R&D 投入，并可能频繁重新认证平台
        - 了解 Harmattan AI 的软件更新和 OTA 能力；确认在 NCIA 标准下重新认证的成本和周期
      - - GPS 韧性与 EW 生存性要求
        - 阻力
        - 当前
        - 2026 年 Q1 冲突数据把不依赖 GPS 的导航列为设计要求；所有无人机供应商的开发复杂度和成本上升
        - 确认 Harmattan AI 平台是否通过 GNSS 干扰韧性测试，以及 Sahara SAR 是否能在 GPS 受限环境中运行
      - - 美国关税对欧洲 C-UAS 供应链的影响
        - 阻力（中等）
        - 当前
        - 2025 年美国关税影响欧洲零部件进口；美国来源子系统成本上升；MarketsandMarkets C-UAS 报告提示关税会影响欧洲定价
        - 识别 Harmattan AI 供应链对受美国关税影响零部件的暴露；评估欧洲替代品是否已获资质
    notes: 时点和方向综合 BCG、EP EPRS、NATO 和 MarketsandMarkets 来源；在最终判断前，全部都需要内部经营数据和合同状态确认。
