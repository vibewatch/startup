      - number: '2.5'
        title: Harmattan AI 在既定市场中的可触达机会
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI 站在 NATO 欧洲三大增长最快采购细分的交汇点——C-UAS、自主 ISR 和可消耗型打击；其产品架构（由 Kalahari C2 编排 Gobi VSHORAD、Sahara
              SAR、Barkhan 打击和 Sonora 训练）与 NATO 在 TIE 26 和 LCI-X 测试的多层互操作需求相呼应。公司注册地在法国，又有 Dassault Aviation 背书；在 EP
              报告明确将依赖非 EU 无人机供应商列为战略风险的时点，这使其成为面向法国和更广泛 NATO 防务客户的欧洲主权供应商。

              近期可触达切片是经过 NATO 测试的 C-UAS 和 ISR 采购管线。BCG 自下而上估计 NATO 欧洲需要 1,500–2,000 套军用 C-UAS 系统；已确认的 BCG 口径显示，2025 年国防部
              C-UAS 支出承诺为 USD 600 million，并将在 2029 年增至 USD 800 million。这在计算潜在 USD 5–7 billion
              总需求轨迹前，已经给出了有来源支撑的采购底线。Harmattan AI 不需要拿下很大市场份额，也能获得可观收入：到 2029 年，即便只拿下 USD 5 billion C-UAS 市场的 1%，也对应 USD
              50 million 年合同额，而防务合同通常跨多年，并附带后续维护义务。

              中期机会来自从测试转向规模化生产，而 NATO 创新架构的设计目的正是加速这一转换。LCI-X Crucible Series、Baltic Trust 26 和 TIE 26
              周期不是一次性演示；它们是从实验走向联盟层面作战采用的、反复运行的制度化路径。通过 NCIA 技术评估的公司，会获得某种采购预资格；随着联盟范围标准化压缩合规供应商数量，这种资格价值会上升。Harmattan
              AI 参加 Eurosatory 2026、SOF Week 2026、World Defense Show 2026 和 UMEX 2026，显示它正面向欧洲和出口军事买家主动追逐这条资格路径。

              投资尽调的关键开放问题包括：Harmattan AI 是否已经完成或进入任何 NATO Innovation Range 技术评估；2026
              年具名国防部合同管线（已披露法国训练订单之外）是什么样；Kalahari C2 层是否按 NATO 互操作标准（STANAG、Link 16
              兼容数据链）设计，以满足联盟级认证要求。这些具体采购闸门问题，无法仅凭公开数据中的规模测算解决。
