              TEKEVER 叠加 Intelligence-as-a-Service 订阅收入、已确认盈利、NATO Innovation Fund 背书和英国 OVERMATCH
              项目，证明欧洲防务自主系统公司不必走高烧钱、高估值路线，也能做到商业可持续。其 €30M EMSA 框架合同由民用安全机构需求支撑，带来耐久的经常性收入。对 Harmattan 而言，含义有两层：TEKEVER
