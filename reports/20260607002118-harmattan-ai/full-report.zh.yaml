  - id: FI004
    title: 资本强度与现金投放图
    type: flow
    layout: wide
    summary: $200M Series B 资本池投向制造扩产、新产品领域扩张和 AI 部署——这些都是资本密集型活动。供应链投资和多国运营让现金需求持续高于表面员工成本。
