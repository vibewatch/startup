      - number: '2.2'
        title: TAM、SAM、SOM——相互竞争的视角与保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              多个市场测算机构覆盖的边界重叠却不一致；正确输出不该是一个混合后的单一数字，而是一组带注释的视角。矛盾真实存在，并且有分析意义。

              Grand View Research 将欧洲无人机市场估为 2024 年 USD 17.05 billion，按 13.4% CAGR 增至 2030 年 USD 36.34 billion。Expert
              Market Research 估计欧洲 UAV 2025 年为 USD 9.91 billion，到 2035 年达 USD 18.29 billion，CAGR 为
              6.32%。MarketsandMarkets 预计 2025 年 USD 5.00 billion，到 2030 年 USD 7.98 billion，CAGR 9.8%。IMARC Group 只给出
              2025 年 USD 275.6 million，到 2034 年 USD 600.2 million，CAGR 9.03%。同一基准年差异超过 50 倍，因为 Grand View 和 Expert
              Market Research 把防务硬件纳入主导类别，而 IMARC 只捕捉较小的商用 / 消费细分。这个差距不是噪音；它反映的是：把欧洲无人机定义为防务采购市场，还是商业设备市场。

              更贴近 Harmattan AI 采购现实的是防务专门切片。Market Research Future 将 2024 年欧洲军用无人机收入单列为 USD 2.15 billion，到 2035 年增至 USD
              4.65 billion，CAGR 7.26%；德国是最大国家市场，英国是增长最快的细分。BCG C-UAS 白皮书（2026 年 5 月）给出最可执行的采购视角：欧洲国防部已承诺 C-UAS 支出从 2025
              年 USD 600 million 增至 2029 年 USD 800 million，但若计入未分配的防务项目和 CNI 保护，总可寻址 C-UAS 需求预计到 2029 年达到 USD 5–7
              billion，年增长率 58%+。BCG 这条轨迹由系统数量经济学驱动——欧洲需要 4,000–5,000 套系统——而不是总收入外推。

              在全球层面，StartUs Insights 将军用无人机市场定为 2030 年 USD 22.81 billion（CAGR 7.6%）和 2033 年 USD 98.24 billion（自 2026 年起
              CAGR 8.9%）。这些数字大体符合美国、欧洲和亚太采购轨迹之和，但会抹平有意义的区域和细分差异。仅美国 FY2026 国防预算就申请了 USD 9.4 billion 用于无人和远程操作飞行器、USD 3.1
              billion 用于 C-UAS，显示自主与反自主通常作为配对预算项同步放大。

              Harmattan AI 的 SAM 位于三者交汇处：（a）欧洲国防部和 NATO C-UAS 采购，（b）欧洲自主 ISR 无人机项目，（c）可消耗型打击无人机订单。仅 C-UAS 一项，BCG
              自下而上的系统数量估计就把 2029 年机会锚定在数十亿美元级别，还未计入 ISR 和打击相邻市场。由于 Harmattan AI 未披露管线或中标率，SOM 无法用公开数据量化。
