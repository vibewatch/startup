      - CI008
      - CI009
      - CI010
  - id: FI002
    title: 单位经济桥——投入、COGS 驱动因素和利润率未知项
    type: flow
    layout: standard
    summary: 从合同授标到制造成本再到毛利率，单位经济流转只能做定性判断；所有利润率数字都是代理值或未知。供应链和人工成本是主要 COGS 驱动因素。
    data:
      nodes:
        - id: contract_award
          label: 政府合同授标
          detail: 每个 PoR 为“数百万”金额；单价未披露。法国 PoR：1,000 套；英国 PoR：最多 3,000 套。单套收入未知。
          type: source
        - id: direct_materials
          label: 直接材料（COGS
          detail: 子组件：机体、无刷电机（稀土磁体）、电池（锂聚合物）、电光相机（SORONA 使用 Lynred IR）、嵌入式计算、RF 链路。中国稀土依赖会持续 3–5 年。
          type: cost
        - id: direct_labor
          label: 直接人工（COGS
          detail: 在 Wissous 和巴黎设施进行组装、QA、集成、测试；生产运营岗位开放，说明制造爬坡正在推进。相对竞争对手（如乌克兰制造商）存在欧洲人工成本溢价。
          type: cost
        - id: rd_allocation
          label: R&D / 摊销（COGS
          detail: 130+ 名资深工程师（中位数 15 年经验）；CEO 称持续 6 周迭代周期。当前规模下研发 / 收入比率高；放量后负担会下降。
          type: cost
        - id: gross_margin
          label: 毛利率（未知）
          detail: 未披露。国防硬件代理值：15–40%；软件 / AI：50–70%。混合利润率结构未知。目标规模“数千套 / 月”会改善成本吸收。
          type: outcome
        - id: opex
          label: 运营费用
          detail: 多国运营足迹（法国、英国、瑞士、摩洛哥、阿联酋、美国）；销售、BD 和项目管理成本；G&A 随员工数扩张。总 OpEx 未披露。
          type: cost
      edges:
        - from: contract_award
          to: direct_materials
          label: 驱动采购
        - from: contract_award
          to: direct_labor
          label: 驱动生产
        - from: direct_materials
          to: gross_margin
          label: 从收入中扣除
        - from: direct_labor
          to: gross_margin
          label: 从收入中扣除
        - from: rd_allocation
          to: gross_margin
          label: 从收入中扣除
        - from: gross_margin
          to: opex
          label: 为运营供血
    approximationNotes: >-
      所有单位成本估计均为基于行业基准和披露员工数的代理值。没有经验证的 COGS 或毛利率数据。中国稀土依赖时间线来自 CEO 接受 Le Grand Continent 采访（2026 年 2
      月）。人工成本代理值基于欧洲国防行业平均全包成本。
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
      - CI019
