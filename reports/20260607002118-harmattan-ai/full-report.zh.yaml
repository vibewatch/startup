            title: 全谱系产品栈叠加独特的 150 kg 以下 SAR 能力
            body: >-
              Harmattan AI 是唯一一家公开提供全套架构的欧洲防务自主系统初创公司：有文档记录的全天候 SAR 载荷（Sahara，2 km 时 0.25 m 分辨率，<3.5 kg）、动能 C-UAS
              拦截器（Gobi Group 1-2、Gobi Tempest Group 2-3）、自主打击平台（Barkhan），并由单一 AI 驱动 C2
              层（Kalahari）统一。欧洲直接竞争者没有复制这套全谱系架构。CEO 称 Sahara 对 150 kg
              以下无人机而言「世界独一无二」；若能独立验证，这一说法商业意义很大，因为竞争者若不获得载荷许可或开发等效的 3.5 kg 以下 SAR 技术，就无法在轻型战术平台上复制持续、全天候 ISR。
