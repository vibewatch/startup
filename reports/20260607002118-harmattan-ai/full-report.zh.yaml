      - number: '5.3'
        title: Kalahari C2——编排架构与能力
        blocks:
          - type: paragraph
            body: >-
              Kalahari 是 Harmattan AI 的指挥控制系统，内嵌自主能力。它支持意图驱动任务下达、实时决策支持，以及跨分布式无人系统的闭环执行。系统采用 API
              驱动、软件定义架构，可本地部署，也可用混合边缘到云配置部署；一条平台无关的数字骨干负责扩展，可把任何资产统一到多任务作战中，并支持作战中软件动态适配。

              Kalahari
              服务三类用户角色。指挥官借助统一的共同作战图，在战区范围内查看各扇区、任务和自主资产，定义任务目标、设定交战规则，并保持集中权威。操作员在被分配扇区内执行任务，拥有任务范围内可见性和控制权，实时协调自主系统，并在指挥设定的授权框架内适应战场变化。训练员在同一
              C2 环境的仿真模式中工作，与实装系统断开，演练任务并验证作业流程，不影响正在进行的行动。

              Kalahari
              的数据层能力包括实时摄取和处理多源传感器数据，并完成航迹分类。系统把分布式传感器和任务输入整合成统一作战图，持续评估任务优先级和可用资产以协调响应，并在整个任务周期中传输经验证的指令，同时动态调整任务分配、监控交战结果。

              互操作性建立在开放且防务级标准之上：Asterix（空中交通监视）、Cursor on Target（CoT，态势感知数据交换）、Lattice（Anduril 的传感器融合标准，指向跨平台兼容性主张）和
              Sapient（NATO AI /
              自主系统交换）。安全功能包括端到端加密、基于角色的访问控制、完整审计轨迹，以及按防务网络安全标准加固。内嵌仿真与数据织物支持训练、任务回放和行动后复盘，把训战转换链条和实战行动接起来。
