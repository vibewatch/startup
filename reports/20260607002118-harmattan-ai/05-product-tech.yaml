  claims:
    - id: CE001
      statement: >-
        Harmattan AI structures autonomy across two complementary layers: mission orchestration,
        which enables commanders and operators to define objectives and coordinate distributed
        systems under human authorization, and platform autonomy, which enables tactical-edge
        systems to execute assigned objectives and adapt to battlefield conditions within authorized
        mission parameters.
      type: company-claimed
      topic: two-layer autonomy architecture
      sourceRefs: [SE001, SE010]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE002]

    - id: CE002
      statement: >-
        Mission orchestration enables commanders and operators to define mission objectives,
        maintain operational awareness, prioritize threats, and coordinate engagements across
        distributed systems under human authorization, forming the upper layer of the Harmattan
        autonomy model.
      type: company-claimed
      topic: mission orchestration layer
      sourceRefs: [SE001]
      confidence: medium
      freshness: current

    - id: CE003
      statement: >-
        Platform autonomy enables systems at the tactical edge to execute assigned objectives,
