  - id: section-trust-security
    title: Trust, Security, Compliance, and Technology Risks
    body: >-
      Kalahari's security architecture implements end-to-end encryption, role-based access
      controls, and a full audit trail hardened to defense cybersecurity standards. The system's
      role-partition model (commanders, operators, trainers with distinct authority scopes)
      is the primary human-in-the-loop control mechanism, ensuring that autonomous execution
      occurs only within human-authorized parameters. Both Gobi and Gobi Tempest are described
      as human-in-the-loop designs, though the degree of pre-authorization in real-world
      engagement sequences is not independently documented.

      No NATO or EU regulatory certification for autonomous lethal systems has been publicly
      disclosed for any Harmattan product. The company complies with French law, GDPR, and
      CCPA/CPRA across its data infrastructure, per its published privacy policy and terms of
      use. No classified system qualification certificates, REACH/RoHS compliance documentation,
      or electromagnetic compatibility (EMC) certifications have been publicly released.

      Competitor benchmarking reveals meaningful capability gaps for diligence. Quantum Systems'
      Vector AI uses dual Jetson Orin edge-compute boards with documented GPS/GNSS-denied
      autonomous navigation and 180+ minute fixed-wing endurance, verified in combat conditions—
      providing a higher-confidence baseline for edge-AI claims than Harmattan's self-stated
      specifications. Shield AI's V-BAT provides a documented ViDAR ISR coverage rate of
      3,140 NM²/hr over maritime environments, requiring ship-based launch infrastructure
      that Gobi's ground-based launch box avoids. TEKEVER's AR5 operates under a €30 million
      EMSA framework contract as a verified ISR maritime UAS, offering a regulatory-approved
      European sovereign benchmark. No independent third-party testing report, field-deployment
      audit, or safety-incident disclosure for any Harmattan AI system is publicly available
      as of June 2026.
