  - id: section-kalahari
    title: Kalahari C2 — Orchestration Architecture and Capabilities
    body: >-
      Kalahari is Harmattan AI's command and control system with embedded autonomy. It enables
      intent-driven tasking, real-time decision support, and closed-loop execution across
      distributed unmanned systems. The system is architected as API-driven and software-defined,
      deployable on-premise or in a hybrid edge-to-cloud configuration, and designed for
      scalability through an agnostic digital backbone that can unify any asset for multi-mission
      operations with on-the-fly software adaptation.

      Kalahari serves three distinct user roles. Commanders maintain theater-wide visibility
      across sectors, missions, and autonomous assets through a unified Common Operational Picture,
      defining mission objectives, establishing rules of engagement, and maintaining centralized
      authority. Operators execute within assigned sectors with mission-scoped visibility and
      control, coordinating autonomous systems in real time and adapting to changing battlefield
      conditions within the authority framework set by command. Trainers operate within the same
      C2 environment in simulation mode, disconnected from live systems, rehearsing missions and
      validating operational procedures without impacting ongoing operations.

      Kalahari's data-layer capabilities include real-time ingestion and processing of multi-source
      sensor data with track classification. The system consolidates distributed sensor and mission
      inputs into a unified operational picture, continuously evaluates mission priorities and
      available assets to coordinate responses, and transmits validated commands while dynamically
      adjusting tasking and monitoring engagement outcomes throughout the mission cycle.

      Interoperability is built on open and defense-grade standards: Asterix (air traffic
      surveillance), Cursor on Target (CoT, situational awareness data exchange), Lattice
      (Anduril's sensor-fusion standard, indicating cross-platform compatibility claims),
      and Sapient (NATO AI/autonomous systems interchange). Security features include
      end-to-end encryption, role-based access controls, a full audit trail, and hardening
      to defense cybersecurity standards. The embedded simulation and data fabric supports
      training, mission replay, and after-action review, creating continuity between the
      train-to-fight pipeline and live operations.
