company:
  name: Harmattan AI
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Harmattan AI delivers a vertically integrated autonomous-systems stack across six product modules:
    Sonora (training UAS), Sahara (all-weather SAR payload), Gobi (Group 1–2 kinetic C-UAS interceptor),
    Gobi Tempest (Group 2–3 interceptor), Barkhan (autonomous strike platform), and Kalahari (AI-embedded
    C2 orchestration). The stack is unified by a two-layer autonomy model that separates mission
    orchestration—intent-driven tasking at the commander and operator level via Kalahari—from platform
    autonomy, where each system executes assigned objectives and adapts to battlefield conditions at the
    edge without continuous connectivity. Kalahari's API-driven architecture supports NATO interoperability
    standards (Asterix, CoT, Lattice, Sapient), role-based access, end-to-end encryption, and embedded
    simulation for train-to-fight continuity. Concrete hardware specifications—0.25 m SAR resolution at
    2 km, sub-1-minute Gobi intercept cycle from launch, 20 km Barkhan strike range with GNSS-denied
    navigation—are published on official product pages but have not been independently benchmarked.
    The Skyeton partnership provides the first documented third-party integration of Sahara's SAR payload
    into an operationally deployed platform. The primary product-tech diligence gaps are the absence of
    independent performance verification, no public developer surface confirming software maturity, and
    unconfirmed manufacturing capacity underpinning the claimed thousands-per-month delivery rate.
sections:
  - id: section-autonomy-architecture
    title: Two-Layer Autonomy Architecture
    body: >-
      Harmattan AI structures autonomy across two complementary layers designed to decouple
      human command authority from machine execution speed. The upper layer—mission orchestration—
      enables commanders and operators to define objectives, maintain situational awareness,
      prioritize threats, and coordinate engagements across distributed systems within human-authorized
      parameters. The lower layer—platform autonomy—enables individual systems at the tactical edge
      to execute assigned objectives, adapt to changing battlefield conditions, and sustain
      operational continuity within those authorized parameters. This partitioning means a
      commander sets intent via Kalahari; each platform (Gobi, Barkhan, Sahara-equipped UAS) then
      acts autonomously within the sanctioned envelope without requiring per-action human confirmation,
      preserving human-in-the-loop authority while enabling machine-speed execution.

      The company's overarching doctrine is "coordinated saturation": autonomous robot forces acting
      as one unified whole across the full operational spectrum, shifting military advantage from
      individual platform performance to the ability to deploy and coordinate autonomous systems
      at mass. Three design pillars underpin the product strategy: attritable (systems deployable
      in volume, resilient to loss), scalable (manufacturing and surging production as the core
      differentiator in the robotic-first era), and autonomous (edge inference without dependency
      on centralized infrastructure while preserving human decision authority). Each product module
      is engineered to operate independently or as part of the unified system when orchestrated by
      Kalahari. This architecture also underpins the Dassault Aviation partnership, which targets
      embedded AI capabilities for Rafale F5 and UCAS collaborative air combat within the same
      two-layer model: Dassault systems define intent, Harmattan AI autonomous platforms execute.
