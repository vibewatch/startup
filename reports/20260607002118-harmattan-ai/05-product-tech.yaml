        accreditation body record verifies any published Harmattan AI specification: Gobi's
        ~1-minute intercept cycle, Sahara's 0.25 m SAR resolution, Barkhan's GNSS-denied
        navigation performance in active EW environments, or Kalahari's NATO standards
        interoperability. All performance data is from company-authored product pages.
