  - id: TE002
    title: Workflow / Use-Case Table
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Four named mission capability areas from Harmattan AI's official capabilities pages
        (force readiness, persistent ISR, precision strike, VSHORAD) plus the overarching C2
        orchestration use case documented on the Kalahari system page, representing the complete
        set of documented customer workflows as of June 2026.
    columns:
      - User Job / Mission Capability
      - Current Workflow Without Harmattan
      - Harmattan Solution
      - Measurable Benefit (Claimed)
      - Limitation / Gap
    rows:
      - - Force Readiness / UAS Operator Training
        - Live-aircraft familiarization; simulation-only tools lacking battlefield fidelity
        - Sonora training UAS with Kalahari simulation mode replicating real mission parameters
        - Scalable unit-level training; <1 min deployment; AI-generated after-action insights
        - Training fidelity vs. adversarial EW environment unverified; no pass-rate data
      - - Persistent ISR / All-Weather Surveillance
        - Optical ISR platforms limited by weather and light conditions; large SAR systems
        - Sahara SAR payload on light UAS (<3.5 kg); onboard processing; no cloud dependency
        - 0.25 m resolution at 2 km; ACD/MTC/CCD; all-weather persistent coverage
        - Resolution claim not independently benchmarked; integration partners limited to Raybird
      - - Precision Strike / Coordinated Engagement
        - Conventional munitions or large UCAV; long lead time; limited mass saturation
        - Barkhan autonomous strike UAS; standalone or swarm; GNSS-denied nav; 20 km range
        - Sub-2 kg airframe with 3 kg payload capacity; rapid engagement at mass
        - Field engagement record not publicly verified; EW resilience in contested env. unproven
      - - VSHORAD / Counter-UAS Defense
        - Soft-kill RF jammers (MyDefence, others); no kinetic hit-to-kill against Group 2-3
        - Gobi (Group 1-2) and Gobi Tempest (Group 2-3) kinetic interceptors with AI guidance
        - ~1 min engagement from launch; 350 km/h max speed; 12 km range (Tempest)
        - No independent kill-chain test data; collateral-damage certification not public
      - - Multi-Domain C2 / Mission Orchestration
        - Siloed platform GCS (ground control stations); no unified autonomous tasking layer
        - Kalahari unified C2; real-time threat prioritization; RBAC; embedded simulation
        - Single pane for commanders/operators/trainers; NATO standards interoperability
        - No independent integration test against NATO C2 systems; SLA and uptime not disclosed
    notes: >-
      Benefits are company-claimed from official product and capabilities pages unless marked
      as inferred. No independent customer case study or operational after-action report is
      publicly available for any mission capability as of June 2026. Limitation column reflects
      publicly documented gaps only, not classified deficiencies.
