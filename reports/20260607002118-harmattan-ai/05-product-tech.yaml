  - id: FE002
    title: Kalahari Mission Execution Flow — From Intent to Closed-Loop Engagement
    type: flow
    layout: standard
    summary: >-
      Step-by-step operational flow from commander intent definition through Kalahari
      to autonomous platform execution and after-action feedback.
    data:
      nodes:
        - id: cmd_intent
          label: Commander defines mission intent
          detail: >-
            Mission objectives, rules of engagement, asset allocation, and operational
            parameters entered in Kalahari's unified command environment.
          tone: neutral
        - id: kalahari_plan
          label: Kalahari generates operational plan
          detail: >-
            Threat prioritization, asset assignment, engagement sequencing based on
            real-time sensor fusion and mission intelligence inputs.
          tone: positive
        - id: op_execute
          label: Operator executes within sector
          detail: >-
            Mission-scoped visibility and control; coordinates autonomous systems in
            real time within commander-defined authority framework.
          tone: neutral
        - id: platform_receive
          label: Platform receives tasking
          detail: >-
            Gobi, Barkhan, Sahara-UAS, or Sonora receives validated command via Kalahari
            C2 link (on-prem or edge-to-cloud path).
          tone: neutral
        - id: platform_execute
          label: Platform executes autonomously
          detail: >-
            Edge AI processes sensor data; autonomous trajectory, guidance, or imaging
            executed within sanctioned parameters without per-action connectivity.
          tone: positive
        - id: feedback
          label: Kalahari monitors outcomes
          detail: >-
            Engagement outcomes, sensor data, mission status fed back into COP; dynamic
            tasking adjustments; full audit trail maintained.
          tone: neutral
        - id: trainer_mode
          label: Trainer rehearsal (simulation mode)
          detail: >-
            Disconnected from live systems; same Kalahari environment; mission replay
            and after-action review via embedded data fabric.
          tone: neutral
      edges:
        - from: cmd_intent
