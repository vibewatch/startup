      - number: '8.5'
        title: Recommendation, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The investment recommendation is Conditional Watch / Research More. The evidence supports a genuine
              strategic premium at $1.4 billion: two national MoD Programs of Record within 15 months, a landmark
              Dassault Aviation AI integration mandate, and European defense market tailwinds growing at 50%+ per annum
              collectively justify a valuation well above pure capital- raised multiples. However, five blocking
              diligence gaps prevent a confident Buy: (1) zero public financial disclosure (revenue, ARR, margins,
              burn); (2) undisclosed board composition and governance structure; (3) no verification of production scale
              claims beyond the CEO's "thousands per month" assertion; (4) the Dassault partnership terms and
              Harmattan's specific role in Rafale F5 AI are not independently confirmed; and (5) the supply chain
              sovereignty timeline is CEO-dependent, not independently validated.

              Exit readiness is premature. Harmattan AI was founded in April 2024, incorporated as a French SAS, has no
              public filing obligation, and has made no signals toward an IPO or strategic sale. The Dassault Aviation
              strategic partnership and equity stake creates a logical acquisition path (Dassault consolidating its AI
              capabilities) but this is speculative; the more likely near-term outcome is a Series C at a higher
              valuation if bull-scenario assumptions materialize. The Harmattan AI exhibit at Eurosatory 2026 in Paris
              (June 2026) and expansion of the US team suggest international market development, not exit preparation,
              in the near term.

              Strategic acquirers should value this differently from financial investors. For a European defense prime
              or national government seeking to own sovereign AI for air combat, Harmattan represents a rare asset at a
              price that will likely not be available post-Series C if execution continues. For financial investors, the
              current entry is priced at strategic premium, meaning return depends on financial disclosure validating
              the underlying model — which has not yet occurred and cannot be predicted from public evidence.

              The valuation stance reconciles the strategic premium with execution opacity: FAIR TO FULL for strategic
              investors with mission alignment; FULL / STRETCHED for pure financial returns without revenue visibility.
              The recommended diligence priority is to obtain confidential revenue data, margin structure, and
              production cost-per-unit data before increasing exposure beyond a strategic tracking position.
            claimRefs:
