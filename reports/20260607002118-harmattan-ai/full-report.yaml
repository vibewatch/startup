      - number: '6.3'
        title: Retention, durability, and expansion pathways
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI's customer durability rests almost entirely on the Program of Record structure rather than
              publicly verifiable retention data. Programs of Record in both France and the United Kingdom imply
              multi-year budget authorization and ministerial-level commitment; they are structurally harder to cancel
              than a single-year pilot or a discretionary budget line. The January 2026 Dassault Aviation press release
              explicitly describes Harmattan as having been "awarded multiple Programs of Record by the French and UK
              Ministries of Defence," using the plural to confirm that both contracts carry this designation. This
              language was independently echoed by Defense News, TechCrunch, and AirForce-Technology.com on the same
              day, corroborating the characterization as a fact rather than a marketing claim.

              No public NRR, GRR, churn rate, contract renewal, or reorder data has been disclosed. The initial French
              MoD delivery window (October–December 2025) and the UK contract award (September 2025) mean that some
              programs are now past initial delivery as of June 2026, but Harmattan has published no follow-on order
              announcement, utilization report, or customer satisfaction disclosure. This creates a material evidence
              gap: investors cannot independently verify whether these programs have led to repeat orders, expanded
              deployment, or any form of measurable operational outcome endorsement from the customer's own procurement
              staff.

              Expansion pathways are multi-directional but structurally early. Dassault Aviation's endorsement opens
              Rafale program nations (Qatar, India, Egypt, Indonesia, UAE, Greece, Croatia, Serbia, Colombia, Indonesia)
              as eventual secondary markets through the prime's distribution network. The Skyeton collaboration
              similarly opens the Ukrainian defense industrial base and NATO allies procuring Raybird, extending
              Harmattan's sensor revenue without sovereign procurement contests. The company's planned expansion into
              new domains — electronic warfare, strike platforms (Barkhan), and C2 software (Kalahari) — creates
              opportunities to cross-sell to existing French and UK MoD customers if those programs achieve Program of
              Record status.
