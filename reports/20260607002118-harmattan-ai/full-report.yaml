              company need not pursue a high-burn, high-valuation trajectory to achieve commercial sustainability. Its
              €30M EMSA framework provides durable recurring revenue anchored in civilian-safety institutional demand.
              For Harmattan, the implication is dual: TEKEVER is a reference for service-model economics, and a warning
