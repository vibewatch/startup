      - number: '2.3'
        title: Buyers, users, payers, and the NATO/European defence procurement path
        blocks:
          - type: paragraph
            body: >-
              The buyer structure in European defence drone and C-UAS procurement is institutional and multi-stage. At
              the national level, Ministry of Defence procurement offices are the formal buying entity; they are
              influenced by operational commands (land forces, air force, special operations forces) who specify
              requirements, and by NATO capability targets and interoperability standards that constrain national
              specification freedom. The payer is typically the national defence budget, supplemented by EU co-funding
              through the European Defence Fund and PESCO joint programmes. The user is the front-line operator—brigade
              commanders, special operations units, naval crew, or border force units—whose feedback in exercises like
              TIE 26 and the LCI-X Crucible Series directly shapes procurement decisions.

              Procurement cycles differ by segment. C-UAS systems are in rapid-procurement mode: the combination of
              Ukraine lessons, NATO Baltic Flank exposure, and drone incidents near EU airports has created political
              urgency to buy now. National governments are approving emergency procurement outside normal multi-year
              capital programmes; Germany's EUR 536 million approval for Helsing and Stark is one example of this
              rapid-buy dynamic. In contrast, persistent ISR and large MALE drone platforms remain in longer development
              cycles, with Eurodrone's participation (France, Germany, Spain, Italy) accelerating only because of Q1
              2026 conflict lessons.

              Three buyer segments map directly to Harmattan AI's product portfolio. First, the land forces
              segment—brigades, battalions, and rapid-reaction units—is the primary buyer for VSHORAD (Gobi, Gobi
              Tempest) and portable C-UAS. Budget authority sits with national MoD army acquisition offices; adoption
              trigger is battlefield urgency and NATO target compliance. Second, special operations forces and
              intelligence agencies are buyers for compact ISR platforms with SAR capability (Sahara payload);
              acquisition follows classified special programmes with shorter cycles and higher unit tolerance. Third,
              joint NATO and multinational exercise frameworks—including the Latvia Innovation Range TEVV and the LCI-X
              Crucible Series—function as quasi-procurement events where systems that pass technical and operational
              evaluation advance to framework agreement eligibility. For a scale-stage startup like Harmattan AI, these
              NATO test events are effectively customer qualification pathways rather than pure demonstrations.

              Civil infrastructure protection is an emerging fourth buyer segment. EU regulatory frameworks enabling
              lawful C-UAS deployment at airports, nuclear plants, and energy nodes are maturing, creating a potential
              channel where the same hardware Harmattan AI supplies to military buyers can reach utility operators and
              airport authorities. This channel is at an earlier stage: BCG projects 2,000–3,000 CNI C-UAS systems
              required by 2029 but notes that regulatory frameworks are still being finalized. The JRC (European
              Commission) has published a five-phase C-UAS methodology for critical infrastructure protection that shows
              the complexity of stakeholder integration across defence, federal police, local security, and airspace
              managers.
