      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull scenario assumes that Harmattan AI secures two or more additional NATO member Programs of Record
              by end 2027, begins AI integration work on the Rafale F5 standard ahead of the 2030 target, achieves
              production scale of 5,000+ systems per month, and discloses annual recurring revenue exceeding $300
              million. Under these assumptions, the Dassault partnership creates an effective defense prime partnership
              valuation floor, and rerating toward Helsing-class multiples ($18 billion at approximately 5 years
              post-founding) becomes achievable by 2028–2029. Bull-case valuation range is $4–8 billion by 2028,
              implying 3×–6× return from the January 2026 Series B entry. The key bull-enabling trigger is the Rafale F5
              AI mandate: if Harmattan's embedded AI is confirmed as the primary AI supplier for France's
              next-generation fighter program, the total addressable contract value is transformational (Rafale F5 unit
              target is 40+ airframes for France alone, with multi-decade support cycles).

              The base scenario assumes one additional European NATO Program of Record by end 2027, stable delivery of
              the existing French and UK contracts with margin validation, no major operational failures or supply chain
              disruptions, and eventual partial revenue disclosure confirming material but not exceptional unit
              economics. The Dassault partnership advances steadily without acceleration. Base-case valuation range is
              $2.5–4 billion by 2028–2029, implying 1.8×–3× return from current entry. This scenario is consistent with
              the peer band: Quantum Systems tripled its valuation after disclosing 100% revenue growth, suggesting that
              a single credible financial disclosure by Harmattan could catalyze a comparable step-up.

              The bear scenario assumes an operational reliability incident (drone crash, mission failure, supply chain
              disruption triggering delivery delay), the Rafale F5 AI integration being awarded to an alternative
              supplier (e.g., Thales cortAIx, with whom Dassault also has a November 2025 agreement), and continued
              revenue opacity preventing external validation. Under these conditions, Harmattan faces a flat or down
              round in a hypothetical Series C, and the $1.4 billion valuation compresses toward capital-raised anchors
              ($242 million base). Bear-case valuation range is $800 million to $1.2 billion, implying 0.6×–0.9× of the
              Series B price and a material impairment for financial investors. The key bear trigger is NOT Chinese
              supply chain disruption alone — the CEO acknowledged this risk but also described a timeline for
              resolution — but rather a combination of supply chain disruption coinciding with a competing AI mandate
              win by Thales.
            claimRefs:
