      - number: '5.4'
        title: Deployment, Integration, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI's systems are designed for rapid deployment: Sonora achieves ready-for-takeoff in under one
              minute; Gobi operates from an always-on launch box at zero-second readiness; Gobi Tempest is ready in five
              seconds. Each system is described as agnostic and integrable to any C2 platform, enabling interoperability
              with partner and NATO-standard C2 systems beyond Kalahari itself.

              The most significant integration milestone to date is the Skyeton-Harmattan strategic partnership
              announced in October 2025, integrating the Sahara SAR payload and Harmattan's AI technologies into
              Skyeton's Raybird UAS. The Raybird has accumulated over 350,000 combat flight hours with Ukrainian defense
              forces, making this the first documented operational integration of Harmattan's sensor technology into a
              combat-proven third-party platform. Initial deployments with Sahara-equipped Raybird systems were planned
              for Q1 2026.

              The Dassault Aviation partnership (January 2026, Series B announcement) targets embedded AI capabilities
              in Dassault's future combat air systems—Rafale F5 and the UCAS programme— particularly for autonomous
              system control. This is the highest-profile roadmap commitment but has no announced delivery timeline for
              production-qualified integration.

              Harmattan exhibited at World Defense Show 2026 (Riyadh, February 2026), UMEX 2026 (Abu Dhabi, January
              2026), and SOF Week 2026 (Tampa, May 2026), with Eurosatory 2026 (Paris, June 2026) confirming continued
              presence at NATO-market defense exhibitions. The company claims to deliver thousands of systems per month
              but has not named a production facility or published an independently verifiable production figure.
            claimRefs:
