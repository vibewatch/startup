      - number: '4.2'
        title: Unit economics, cost structure, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI has not disclosed any unit economics data — gross margin, contribution margin, CAC, payback
              period, or LTV — consistent with its stage and private status. Proxy estimates can be constructed from
              public evidence but carry high uncertainty and should not substitute for diligence-room financials.

              The cost structure of a vertically integrated defense hardware manufacturer is capital-intensive by
              nature. Harmattan's operating cost base in June 2026 includes more than 130 employees with a median 15
              years' experience, distributed across offices in France, the UK, Switzerland, Morocco, UAE, and the US.
              Open roles as of June 2026 include manufacturing roles (production operators, line supervisors, quality
              technicians in Wissous), system architects, chief engineers, group leads, and R&D engineers across
              multiple countries, indicating a high-cost, senior-staffed organization. A rough headcount-based burn
              proxy — 130+ employees at European defense-sector blended labor cost ~$150K–$200K per employee per year —
              suggests annual cash operating expenses in the range of $20–$35 million per year, or roughly $1.5–$3
              million per month, before capex, component procurement, and manufacturing facility overhead.

              On the revenue side, gross margin for defense drone hardware is unknown for Harmattan specifically.
              Industry proxies from comparable hardware-plus-software defense primes suggest gross margins of 15–40% for
              hardware delivery contracts depending on whether R&D costs are capitalized or expensed, and higher margins
              (50–70%) for software or AI-integration services. Harmattan's vertically integrated model — building
              airframes, sensors, and software in-house — should theoretically reduce third-party component margins but
              also increases fixed cost absorption risk at lower volumes.

              The CEO's Le Grand Continent interview highlights two structural supply chain cost risks: (1) brushless
              motor magnets containing rare-earth elements currently sourced through Chinese rare-earth refining chains,
              and (2) battery chemistry with Chinese rare-earth dependency in lithium-polymer cells. Both are identified
              as constraints that will persist for three to five years, implying elevated component costs and supply
              concentration risk until alternative supply chains mature. These supply chain exposures directly affect
              COGS and gross margin on hardware contracts.

              Production scale is a key unit-economics lever. Harmattan claims "thousands of systems per month"
              production capacity, and DroneXL's analysis cites company plans for up to 10,000 drones monthly. If either
              figure is accurate, fixed manufacturing overhead would be spread over a large production base, improving
              unit economics materially. Neither figure has been independently verified.
