  - id: FI002
    title: Unit economics bridge — inputs, COGS drivers, and margin unknowns
    type: flow
    layout: standard
    summary: >-
      The unit economics flow from contract award through manufacturing cost to gross margin is qualitative; all margin
      figures are proxies or unknown. Supply chain and labor costs are the primary COGS drivers.
    data:
      nodes:
        - id: contract_award
          label: Government Contract Award
          detail: >-
            "Multi-million" value per PoR; unit price not disclosed. French PoR: 1,000 units; UK PoR: up to 3,000 units.
            Revenue per unit unknown.
          type: source
        - id: direct_materials
          label: Direct Materials (COGS
          detail: >-
            Sub-assemblies: airframes, brushless motors (rare-earth magnets), batteries (lithium-polymer),
            electro-optical cameras (Lynred IR for SORONA), embedded compute, RF links. Chinese rare-earth dependency
            persists 3–5 years.
          type: cost
        - id: direct_labor
          label: Direct Labor (COGS
          detail: >-
            Assembly, QA, integration, test at Wissous and Paris facilities; open roles in production operations suggest
            active manufacturing ramp. European labor cost premium vs. competitors (e.g., Ukrainian manufacturers).
          type: cost
        - id: rd_allocation
          label: R&D / Amortization (COGS
          detail: >-
            130+ senior engineers (median 15 yr experience); continuous 6-week iteration cycle per CEO. High R&D per
            revenue ratio at current scale; burden decreases at volume.
          type: cost
        - id: gross_margin
          label: Gross Margin (UNKNOWN)
          detail: >-
            Not disclosed. Defense hardware proxy: 15–40%; software/AI: 50–70%. Blended margin structure unknown. Target
            scale "thousands/month" would improve absorption.
          type: outcome
        - id: opex
          label: Operating Expenses
          detail: >-
            Multi-country operating footprint (FR, UK, CH, MA, UAE, US); sales, BD, and program management costs; G&A
            scaling with headcount. Total OpEx not disclosed.
          type: cost
      edges:
        - from: contract_award
          to: direct_materials
          label: drives procurement
        - from: contract_award
          to: direct_labor
          label: drives production
        - from: direct_materials
          to: gross_margin
          label: subtracts from revenue
        - from: direct_labor
          to: gross_margin
          label: subtracts from revenue
        - from: rd_allocation
          to: gross_margin
          label: subtracts from revenue
        - from: gross_margin
          to: opex
          label: funds operations
    approximationNotes: >-
      All unit cost estimates are proxies based on industry benchmarks and disclosed headcount. No verified COGS or
      gross margin data is available. Chinese rare-earth dependency timeline from CEO interview with Le Grand Continent
      (Feb 2026). Labor cost proxy based on European defense-sector average fully-loaded cost.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
      - CI019
