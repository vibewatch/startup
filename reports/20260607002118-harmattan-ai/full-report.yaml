          - type: callout
            title: Dassault partnership extends Harmattan from drone maker to Rafale F5 AI ecosystem
            body: >-
              The Series B is not simply a financing event — it places Harmattan's autonomy software inside France's
              flagship next-generation combat aviation program. The Rafale F5 standard is expected around 2030 and will
              require embedded AI for drone-wingman coordination under the FCAS alternative approach. Harmattan is now
              positioned as the sovereign AI engine for both near-term attritable drone production and medium-term
              crewed/uncrewed teaming, a dual-mandate that justifies the $1.4B valuation but also creates execution risk
              from span of scope.
