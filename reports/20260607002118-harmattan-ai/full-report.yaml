  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Operational reliability failure
        - >-
          A drone crash, mission failure, or safety incident involving Harmattan systems that receives adverse press
          coverage or triggers a MoD review
        - >-
          Strategic premium deflates immediately; precedent from Reuters June 2026 report on a $1.3B US defense startup
          where drone crashes eroded investor confidence within one quarter; PoR contract at risk
        - Full exit or hold pending investigation; monitor for MoD public statements on contract status
      - - Rafale F5 AI mandate lost to competitor
        - >-
          Dassault Aviation announces Thales cortAIx or another supplier as primary AI partner for Rafale F5 standard,
          displacing Harmattan from the core mandate
        - >-
          Thesis anchor (Dassault partnership moat) is broken; re-rates toward pure hardware ISR multiple without
          strategic premium; bull scenario probability collapses to near zero
        - Reduce position immediately; downgrade to bear scenario valuation $800M–$1.2B
      - - Supply chain disruption from Chinese export controls
        - >-
          Chinese government restricts rare-earth export of motor magnets or battery materials in a way that materially
          delays or halts Harmattan production lines
        - >-
          Production scale targets become aspirational; PoR delivery commitments at risk; sovereign credibility
          narrative undermined; base and bull scenarios impaired
        - >-
          Monitor Chinese rare-earth export policy; request supply chain backup plans and stockpile levels from
          management
      - - Revenue disclosure below expectations
        - >-
          First voluntary or enforced revenue disclosure (e.g., at Series C) reveals ARR below $50M or gross margins
          below 40%
        - >-
          Multiple compression; bear scenario becomes base; financial investors who priced strategic premium face
          impairment; Anduril and Helsing comparisons no longer support $1.4B entry
        - Downgrade to Reduce; re-model from disclosed revenue; focus on margin trajectory and burn runway
      - - Governance or legal incident
        - >-
          Public reporting of founder dispute, investor litigation, regulatory action (ITAR/EAR export control
          violation), or involuntary board restructuring
        - >-
          Key-person concentration risk materializes; strategic investor relationship with Dassault disrupted; French
          MoD contract reliability questioned
        - Full review; immediate engagement with legal counsel on ITAR/EAR compliance posture given US team expansion
    notes: >-
      Kill triggers are ordered by thesis transmission severity. Operational failure and Rafale F5 mandate loss are
      thesis-breaking; supply chain and governance triggers are thesis-impairing but recoverable if addressed within
      6–12 months.
    claimRefs:
      - CV008
      - CV011
