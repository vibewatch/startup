  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-ready scoring across seven investment dimensions, reflecting evidence-based assessments from chapters 1–8.
      Scores represent the author's judgment of current evidence quality and risk-adjusted strength on a five-point
      scale (1=very weak, 5=very strong).
    data:
      items:
        - label: Market opportunity
          value: 4 / 5
          detail: >-
            BCG C-UAS market $5–7B by 2029 at 58%+ CAGR; European defense AI spending €946M H1 2025; NATO procurement
            pipeline validated by TIE 26. Deducted 1 point for market fragmentation and NATO member budget uncertainty.
          tone: positive
        - label: Product and technology proof
          value: 4 / 5
          detail: >-
            Two MoD PoRs in 15 months; vertically integrated platform across four segments; SORONA drone specs
            published; Kalahari C2 demonstrated. Deducted 1 point for production scale claim unverified beyond CEO
            assertion.
          tone: positive
        - label: Moat and competitive position
          value: 4 / 5
          detail: >-
            Dassault partnership creates replication barrier; dual national MoD credibility; full-stack vertical
            integration uncommon in Europe. Deducted 1 point for Thales cortAIx as a competing Rafale AI partner and
            Helsing scale advantage.
          tone: positive
        - label: Economics and financials
          value: 2 / 5
          detail: >-
            Revenue, margins, burn, and unit economics entirely undisclosed. TEKEVER and Quantum Systems peers have
            disclosed profitability or growth metrics; Harmattan has not. This is the primary conviction constraint.
          tone: warning
        - label: Risk profile
          value: 2 / 5
          detail: >-
            Supply chain Chinese dependency (acknowledged); governance opacity; key-person concentration; export control
            posture unverified; operational reliability unproven at scale. Reuters peer precedent (drone crashes,
            impaired valuation) is cautionary.
          tone: warning
        - label: Valuation score
          value: 3 / 5
          detail: >-
            $1.4B is at low end of peer band; fair-to-full for strategic investors; stretched for financial return
            without revenue disclosure. 5.8× capital raised is moderate; Helsing is 15× capital raised without disclosed
            revenue.
          tone: neutral
        - label: Evidence quality
          value: 3 / 5
          detail: >-
            Contract proof and Dassault partnership are well-corroborated by independent press (TechCrunch, Defense
            News, Tech.eu). Financial metrics are entirely private-only. Supply chain and governance are CEO-stated
            without independent verification. Overall evidence quality is moderate.
          tone: neutral
    approximationNotes: >-
      IC scores are qualitative judgments by the research analyst based on evidence collected through June 7, 2026.
      Scores would shift materially upon revenue disclosure (Economics/Financials) or confirmed Rafale F5 AI mandate
      (Moat).
