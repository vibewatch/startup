      - CV041
      - CV044
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue and financial model
        - >-
          ARR, contract value totals, gross margin, burn rate, unit economics (cost per drone, contribution margin per
          PoR contract), cash runway
        - >-
          Without financials, valuation is entirely strategic-premium-dependent; cannot model return scenarios or
          stress-test bear case; no comparables for multiple validation
        - >-
          Management direct access (Series C process data room); NDAs required; reference check with French MoD
          procurement officers on contract value range
      - - Dassault partnership scope and AI mandate
        - >-
          Whether Harmattan is the primary or one of several AI suppliers to the Rafale F5 program; contract value and
          scope of UCAS AI development mandate; exclusivity provisions; revenue attribution to Dassault vs. MoD
          customers
        - >-
          The Dassault partnership is the single most important thesis anchor; if Harmattan is one of multiple AI
          partners rather than the primary supplier, the strategic premium is materially reduced
        - >-
          Direct conversation with Dassault Aviation CEO or VP Programs; review joint press release for exclusivity
          language; French DGA program office contact
      - - Production scale and unit economics
        - >-
          Verified monthly production volume (the "thousands per month" CEO claim); manufacturing facility capacity;
          SORONA unit cost and UK contract unit pricing; supply chain backup plans and raw material stockpile levels
        - >-
          Production scale is the core operational thesis; if volumes are materially below claim, the bear scenario is
          already emerging; unit economics determine whether scale translates to profit
        - >-
          Factory visit; supply chain audit; request production logs from French MoD as customer reference; independent
          verification via DroneXL or defense press
      - - Board composition and governance
        - >-
          Names and backgrounds of board of directors; investor representation and voting rights; any shareholder
          agreement provisions; information rights; anti-dilution protections; treatment of Dassault equity vs.
          financial VC
        - >-
          Governance opacity creates key-person and protective-provision risks; without board visibility, investor
          protection cannot be assessed; critical for any investment above strategic check size
        - >-
          Direct request from management or legal counsel; French company registry (Registre du commerce et des
          sociétés) for Infogreffe filings on board
      - - Export control compliance
        - >-
          ITAR/EAR classification of drone systems; US team expansion and whether US-origin technology is being
          transferred to non-US MoD customers; French CIEEMG export authorization status for UK and Estonian contracts
        - >-
          Defense tech export control violations carry severe criminal and commercial penalties; US team in Arlington VA
          suggests potential US-origin technology involvement; French export law compliance is material for NATO ally
          customers
        - >-
          Legal counsel review; CIEEMG database check; direct management question on ITAR/EAR classification of all
          systems
      - - Supply chain sovereignty progress
        - >-
          Current Chinese rare-earth dependency levels; specific battery and motor magnet supply chain backup suppliers;
          timeline for sovereign motor magnets (expected end 2026) and batteries (3–5 years); percentage of COGS exposed
          to Chinese suppliers
        - >-
          CEO acknowledged this as material; an adverse geopolitical event (Taiwan Strait escalation, Chinese export
          restriction) could disrupt production at scale without sovereign alternatives in place
        - >-
          Supply chain audit; CEO Le Grand Continent interview provides baseline; reference check with motor and battery
          suppliers named in public reporting
    notes: >-
      Topics are ordered by materiality to the recommendation; financial model and Dassault scope are blocking diligence
      items. Export control compliance is critical given US team expansion and multi-NATO customer base.
