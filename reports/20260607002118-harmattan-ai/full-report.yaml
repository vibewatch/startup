  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation chain flows from market validation through product proof through valuation analysis to the
      final Conditional Watch recommendation, with two thesis anchors and three blocking diligence gaps determining the
      conditional qualifier.
    data:
      nodes:
        - id: market
          label: Market validation
          detail: >-
            BCG: C-UAS market $5–7B by 2029 at 58%+ CAGR; European defense AI investments €946M H1 2025 (+26% YoY); NATO
            TIE 26 validates procurement pipeline.
          tone: positive
        - id: product
          label: Product and contract proof
          detail: >-
            Two national MoD Programs of Record (France, UK) in 15 months; vertically integrated platform (ISR, C-UAS,
            EW, strike, C2); Dassault AI mandate for Rafale F5 and UCAS.
          tone: positive
        - id: capital
          label: Capital and valuation context
          detail: >-
            $1.4B post-money Series B; $242M total raised; Dassault-led; Helsing/Anduril peer band $12B–$61B at scale;
            Harmattan at low end suggesting rerating upside.
          tone: neutral
        - id: risks
          label: Blocking diligence gaps
          detail: >-
            Revenue undisclosed; governance opaque; production scale unverified; supply chain Chinese dependency
            acknowledged; Dassault partnership scope unclear.
          tone: warning
        - id: recommendation
          label: Conditional Watch / Research More
          detail: >-
            Fair-to-full for strategic investors; stretched for pure financial investors without revenue disclosure.
            Upgrade trigger: revenue data confirms ARR >$100M with margins >50%.
          tone: neutral
      edges:
        - from: market
          to: capital
        - from: product
          to: capital
        - from: capital
          to: recommendation
        - from: risks
          to: recommendation
    approximationNotes: null
