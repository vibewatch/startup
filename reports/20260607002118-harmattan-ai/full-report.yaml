    sections:
      - number: '1.1'
        title: Identity, founding, and legal footprint
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI is incorporated as a simplified joint-stock company (SAS) under French law, registered at 1
              rue du Mail, 75002 Paris, France, with VAT number FR39978035392. The company was founded in April 2024 by
              Mouad M'Ghari and co-founders including Martin de Gourcuff, Edouard Rosset, and Marc Grelet, positioning
              itself from day one as a defense technology company rather than a consumer AI startup. The registered
              Paris address is both the legal domicile and the operational headquarters; additional offices span the
              United Kingdom, Switzerland, Morocco, the United Arab Emirates, and the United States, as confirmed by the
              careers page accessed June 2026. Open roles posted in June 2026 include positions in Paris, Lausanne,
              Wissous, London, Arlington VA, UAE, and Poland, reflecting a genuinely multi-country operating footprint.

              The company describes its core strategic doctrine as "coordinated saturation" — autonomous robot forces
              that act at scale as a unified whole across the full operational spectrum, shifting military advantage
              from individual platform performance to the ability to produce, deploy, and coordinate autonomous systems
              in mass. This philosophy anchors both the product roadmap and the manufacturing strategy: Harmattan
              pursues mass production readiness as a first-order objective, not as a downstream aspiration. The
              company's terms-of-use page was last updated November 10, 2025 and references compliance obligations under
              GDPR, CCPA/CPRA, and CalOPPA, confirming EU-hosted data infrastructure and a deliberate privacy compliance
              posture consistent with defense-sector enterprise requirements. As of June 2026, the company's website
              categorizes it in the "defense technology" sector, having previously described itself as a
              "next-generation defense prime" before the Dassault Aviation partnership shifted the public framing.
