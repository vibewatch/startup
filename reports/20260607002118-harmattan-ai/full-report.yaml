  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI enters an intensely competitive, heavily capitalised European defense-autonomy market defined
              by five distinct competitor classes. Direct European peers—Helsing (Germany) and TEKEVER (Portugal, UK,
              France)—compete on sovereignty credentials, manufacturing scale, and proven operational deployments. US
              defense-technology primes—Anduril and Shield AI—bring dominant capital scale, advanced autonomous-systems
              portfolios, and proven DoD contract vehicles, but carry ITAR constraints and limited EU-sovereign
              positioning. European ISR-sUAS specialists—chiefly Quantum Systems (Germany)—target the same
              intelligence-collection and denied-environment niche without offering strike or C2. C-UAS specialists such
              as MyDefence (Denmark) address the counter-drone interception segment overlapping Harmattan's Gobi and
              Gobi Tempest interceptors. Commercial-adjacent drone firms such as Delair (France) compete at the margins
              of military ISR but are not primary military system integrators. No single competitor replicates
              Harmattan's full-spectrum ambition of integrated SAR ISR, autonomous strike, kinetic C-UAS, and AI-driven
              C2 within a single vertically integrated stack anchored by a Tier-1 OEM partnership with a NATO-standard
              combat aircraft programme.
