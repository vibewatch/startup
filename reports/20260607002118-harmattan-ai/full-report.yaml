  - id: FI001
    title: Revenue model bridge — from government contract to gross profit
    type: flow
    layout: wide
    summary: >-
      Harmattan AI's revenue flows from government MoD procurement through hardware delivery contracts to revenue
      recognition; gross profit is undisclosed. The Dassault and Skyeton partnerships represent emerging secondary
      revenue nodes.
    data:
      nodes:
        - id: customer
          label: NATO / Allied Government MoD
          detail: >-
            French MoD (DGA), UK MoD (DE&S), and allied partners; sovereign-credit buyers; programs operate under
            national defense procurement frameworks.
          type: source
        - id: rfp
          label: RFP / Program of Record Award
          detail: >-
            Government issues competitive tender; Harmattan wins PoR contract (France Jul 2025; UK Sep 2025);
            "multi-million dollar / pound" contract values undisclosed.
          type: process
        - id: manufacturing
          label: Hardware Manufacturing
          detail: >-
            Vertically integrated production: airframes, sensors (Lynred IR), embedded AI; company claims "thousands of
            systems per month" capacity; exact throughput unverified.
          type: process
        - id: delivery
          label: System Delivery + Acceptance
          detail: >-
            Milestone-based or delivery-on-completion model; French MoD 1,000 SORONA drones delivered by end 2025; UK
            MoD up to 3,000 systems for urgent operational needs.
          type: process
        - id: revenue
          label: Revenue Recognition
          detail: >-
            Hardware delivery contracts: revenue recognized on delivery/acceptance milestones. Revenue amount not
            disclosed; recognition policy not public.
          type: outcome
        - id: gross_profit
          label: Gross Profit (NOT DISCLOSED)
          detail: >-
            Gross margin on hardware delivery not disclosed; defense hardware industry proxies: 15–40%; software/AI
            integration proxies: 50–70%. Chinese rare-earth COGS exposure suppresses margins near-term (3–5 year horizon
            per CEO).
          type: outcome
        - id: dassault_stream
          label: Dassault AI Integration Revenue
          detail: >-
            Nascent development services stream; Rafale F5 and UCAS embedded AI development; financial terms not
            disclosed; potentially multi-year recurring program revenue.
          type: source
        - id: skyeton_stream
          label: Sensor Licensing Revenue
          detail: >-
            Sahara SAR payload integrated into Skyeton Raybird UAS; licensing revenue structure not disclosed; October
            2025 partnership announcement confirmed.
          type: source
      edges:
        - from: customer
          to: rfp
          label: procurement mandate
        - from: rfp
          to: manufacturing
          label: contract award
        - from: manufacturing
          to: delivery
          label: production + QA
        - from: delivery
          to: revenue
          label: acceptance / milestone
        - from: revenue
          to: gross_profit
          label: minus COGS
        - from: dassault_stream
          to: revenue
          label: development fees
        - from: skyeton_stream
          to: revenue
          label: licensing fees
    approximationNotes: >-
      Revenue and gross profit nodes are qualitative; no numeric values are available from public sources. The revenue
