      - number: '5.2'
        title: Product Module Stack — Sonora, Sahara, Gobi, Gobi Tempest, Barkhan
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI offers five hardware product modules covering the full mission lifecycle from operator
              preparation to persistent ISR, kinetic C-UAS defense, and autonomous strike.

              Sonora is a small UAS for unit-level training and operator familiarization. Its specifications are: flight
              time greater than 40 minutes, ready-for-takeoff in under one minute, 2 km range, 35 × 42 × 11 cm form
              factor, weight under 1.8 kg including batteries. The EO camera delivers 1,280 × 720 pixels at 30 fps with
              6× zoom (3× lossless). The IR camera outputs 320 × 240 pixels at 30 fps with 2-axis mechanical
              stabilization. The system carries an IP-rating equivalent to IP53, supports night and low-light
              operations, and interfaces with Kalahari in simulation mode for training continuity.

              Sahara is an autonomous UAS-borne SAR payload covering all-weather ISR, object detection, terrain
              segmentation, and maritime surveillance. Key specifications: L–S frequency band, dual linear polarization,
              0.25 m spatial resolution at 2 km and 1.2 m at 10 km, physical size 15 × 72.3 × 15 cm, weight under 3.5
              kg, power consumption under 65 W. Operating modes include Stripmap and circular; onboard change-detection
              algorithms implement amplitude change detection (ACD), multi-temporal coherence (MTC), and coherent change
              detection (CCD). The CEO publicly claimed Sahara is "unique in the world" as a SAR radar for drones
              weighing under 150 kg. This claim is unverified by independent benchmark.

              Gobi is a kinetic interceptor for Group 1–2 UAS threats. Cruise speed: 250 km/h; maximum speed: 350 km/h;
              kinetic energy at impact: greater than 10,300 J; ready-for-launch: 0 seconds from always-on state in its
              launch box; weight: 2.2 kg; form factor: 32 × 34 × 34 cm. The system executes fully autonomous hit-to-kill
              terminal guidance without ground dependency, achieving threat neutralization in approximately one minute
              from launch authorization.

              Gobi Tempest addresses Group 2–3 threats with a larger form factor. Cruise speed: 215 km/h; maximum speed:
              310 km/h; warhead compatibility: 800 g; flight range: 12 km; ready-for-launch: 5 seconds; weight: 4.4 kg
              including batteries and warhead; form factor: 46.5 × 46.5 × 69.5 cm. The system features a qualified
              reversible SAU and supports coordinated space operations. Both Gobi variants include a complete system
              comprising launchbox, ground radar, EO/IR turret, and C2 integration.

              Barkhan is an autonomous strike platform for rapid target engagement in contested environments. Speed: 120
              km/h; flight range: 20 km; form factor: 43 × 43 × 40 cm; airframe weight under 2 kg; payload capacity: 3
              kg; flight time: 25 minutes; radio link: 160–2,500 MHz. Barkhan supports GNSS-denied navigation,
              autonomous terminal guidance, optic fiber compatibility, and can operate standalone or in coordinated
              swarm configurations. All five hardware modules are described as agnostic and integrable with any C2
              platform, with Kalahari as the recommended orchestration layer.
