companyProfile:
  summary: >-
    Harmattan AI was founded in April 2024 in Paris and has scaled unusually quickly for a European defense startup. The
    company builds a vertically integrated autonomy stack spanning Sonora training ISR drones, the Sahara UAV-borne SAR
    payload, Gobi and Gobi Tempest counter-UAS interceptors, the Barkhan strike platform, and the Kalahari
    command-and-control layer. Within roughly 18 months of founding it secured Programs of Record with both the French
    and UK Ministries of Defence and, in January 2026, raised a $200 million Series B led by Dassault Aviation at a $1.4
    billion valuation. The Dassault partnership positions Harmattan to develop embedded AI capabilities for Rafale F5
    and future UCAS programs, while the Skyeton partnership extends its sensor stack into Ukrainian-origin Raybird
    platforms for NATO markets.
