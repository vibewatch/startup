            title: Commoditization Threat from Below and from Scale
            body: >-
              Two converging forces threaten Harmattan's hardware value proposition. FPV drone production scaling across
              Ukrainian, Finnish, and French manufacturers is compressing per-unit drone hardware costs sector-wide.
              Separately, Anduril's $61 billion valuation and $2.2 billion revenue base give it the capital to absorb
              European market-entry losses—including operating below cost to displace a competitor holding nascent
              Programs of Record. Harmattan's best defence is the speed of its French MoD relationship and the
