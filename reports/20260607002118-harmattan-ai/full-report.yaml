            title: Dual national Ministry of Defence Programs of Record within 18 months
            body: >-
              Harmattan AI secured Programs of Record with both the French and UK Ministries of Defence within 15 months
              of founding — an execution velocity that is exceptional in European defense procurement and provides
              sovereign validation that reduces early-stage diligence risk. Combined with the Dassault Aviation
              partnership and French presidential endorsement, the company has demonstrated a level of institutional
              traction that few defense startups reach before their second year.
