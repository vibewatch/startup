    layout: wide
    summary: >-
      Harmattan AI's customer journey moves from sovereign-government exhibition and procurement signals through
      competitive qualification and Program of Record award to multi-unit production delivery and partnership-driven
      expansion loops. All confirmed paying customers sit in the "Production — Program of Record" or "Development
      Partnership" stages; Gulf-state and US-SOF customers remain at the Discovery stage.
