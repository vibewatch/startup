  - id: FE001
    title: Harmattan AI Product Architecture — Two-Layer Autonomy Stack
    type: stack
    layout: wide
    summary: >-
      Six-layer view of Harmattan AI's autonomous-systems architecture from command intent to physical platform
      execution, showing the separation between mission orchestration and platform autonomy.
    data:
      layers:
        - label: Commander / Operator Interface (Kalahari COP)
          detail: >-
            Theater-wide Common Operational Picture; intent-driven tasking; rules-of-engagement configuration;
            role-based access for commanders, operators, and trainers.
          tone: neutral
        - label: Mission Orchestration Layer (Kalahari C2 Engine)
          detail: >-
            API-driven orchestration; real-time threat prioritization; closed-loop execution; multi-source sensor
            fusion; on-premise or hybrid edge-to-cloud deployment.
          tone: positive
        - label: Interoperability / Standards Layer
          detail: >-
            Asterix, CoT, Lattice, Sapient NATO standards; sensor-data ingestion with track classification; integration
            with partner and allied C2 systems.
          tone: neutral
        - label: Platform Autonomy Layer (Edge AI)
          detail: >-
            Onboard inference without cloud dependency; trajectory optimization; terminal guidance; GNSS-denied
            navigation (Barkhan); change detection (Sahara).
          tone: positive
        - label: Sensor / Payload Layer
          detail: >-
            Sahara SAR (0.25 m / 2 km, L–S band, <3.5 kg); EO/IR cameras (Sonora, Gobi); radar ground sensor (Gobi/Gobi
            Tempest launchbox system).
          tone: neutral
        - label: Physical Platform Layer (UAS / C-UAS)
          detail: >-
            Sonora (training), Gobi (Group 1-2 intercept), Gobi Tempest (Group 2-3 intercept), Barkhan (strike, 20 km,
            GNSS-denied), Sahara-equipped host UAS.
          tone: neutral
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE022
      - CE024
  - id: FE002
    title: Kalahari Mission Execution Flow — From Intent to Closed-Loop Engagement
    type: flow
    layout: standard
    summary: >-
      Step-by-step operational flow from commander intent definition through Kalahari to autonomous platform execution
      and after-action feedback.
    data:
      nodes:
        - id: cmd_intent
          label: Commander defines mission intent
          detail: >-
            Mission objectives, rules of engagement, asset allocation, and operational parameters entered in Kalahari's
            unified command environment.
          tone: neutral
        - id: kalahari_plan
          label: Kalahari generates operational plan
          detail: >-
            Threat prioritization, asset assignment, engagement sequencing based on real-time sensor fusion and mission
            intelligence inputs.
          tone: positive
        - id: op_execute
          label: Operator executes within sector
          detail: >-
            Mission-scoped visibility and control; coordinates autonomous systems in real time within commander-defined
            authority framework.
          tone: neutral
        - id: platform_receive
          label: Platform receives tasking
          detail: >-
            Gobi, Barkhan, Sahara-UAS, or Sonora receives validated command via Kalahari C2 link (on-prem or
            edge-to-cloud path).
          tone: neutral
        - id: platform_execute
          label: Platform executes autonomously
          detail: >-
            Edge AI processes sensor data; autonomous trajectory, guidance, or imaging executed within sanctioned
            parameters without per-action connectivity.
          tone: positive
        - id: feedback
          label: Kalahari monitors outcomes
          detail: >-
            Engagement outcomes, sensor data, mission status fed back into COP; dynamic tasking adjustments; full audit
            trail maintained.
          tone: neutral
        - id: trainer_mode
          label: Trainer rehearsal (simulation mode)
          detail: >-
            Disconnected from live systems; same Kalahari environment; mission replay and after-action review via
            embedded data fabric.
          tone: neutral
      edges:
