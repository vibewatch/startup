  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Two-Layer Autonomy Architecture
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI structures autonomy across two complementary layers designed to decouple human command
              authority from machine execution speed. The upper layer—mission orchestration— enables commanders and
              operators to define objectives, maintain situational awareness, prioritize threats, and coordinate
              engagements across distributed systems within human-authorized parameters. The lower layer—platform
              autonomy—enables individual systems at the tactical edge to execute assigned objectives, adapt to changing
              battlefield conditions, and sustain operational continuity within those authorized parameters. This
              partitioning means a commander sets intent via Kalahari; each platform (Gobi, Barkhan, Sahara-equipped
              UAS) then acts autonomously within the sanctioned envelope without requiring per-action human
              confirmation, preserving human-in-the-loop authority while enabling machine-speed execution.

              The company's overarching doctrine is "coordinated saturation": autonomous robot forces acting as one
              unified whole across the full operational spectrum, shifting military advantage from individual platform
              performance to the ability to deploy and coordinate autonomous systems at mass. Three design pillars
              underpin the product strategy: attritable (systems deployable in volume, resilient to loss), scalable
              (manufacturing and surging production as the core differentiator in the robotic-first era), and autonomous
              (edge inference without dependency on centralized infrastructure while preserving human decision
              authority). Each product module is engineered to operate independently or as part of the unified system
              when orchestrated by Kalahari. This architecture also underpins the Dassault Aviation partnership, which
              targets embedded AI capabilities for Rafale F5 and UCAS collaborative air combat within the same two-layer
              model: Dassault systems define intent, Harmattan AI autonomous platforms execute.
            claimRefs:
              - CE001
