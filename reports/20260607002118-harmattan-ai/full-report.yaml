      - number: '8.2'
        title: Valuation context, financing, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Harmattan AI's financing history is remarkably compressed. A seed round led by Atlantic VC at an
              undisclosed amount was followed by a ~$30 million Series A led by FirstMark Capital with Atlantic VC,
              Tholus Capital, Motier Ventures, and Sisyphus Ventures; TechCrunch reported total pre-Series B capital of
              $42 million. On January 12, 2026, Dassault Aviation led a $200 million Series B establishing a $1.4
              billion post-money valuation — confirmed by Defense News, TechCrunch, Tech.eu, AirForce-Technology.com,
              and Harmattan's own press release. Total lifetime capital raised through January 2026 is approximately
              $242 million ($42 million pre-Series B plus $200 million Series B). Crunchbase confirms the financing
              trajectory, though the platform is rate-limited and cannot be queried directly; DefenceJobs.org lists
              Dassault Aviation, FirstMark Capital, Atlantic VC, Motier Ventures, and Tholus Capital as investors,
              corroborating the syndicate structure.

              Entry discipline requires reconciling four tensions. First, valuation vs. revenue proof: the $1.4 billion
              valuation is approximately 5.8× total capital raised ($242 million), which is reasonable for a company
              with two national MoD Programs of Record and a Dassault-anchored strategic moat — but only if contract
              revenue is materializing at scale. Without disclosure, investors face binary execution risk. Second, the
              Series A to Series B step-up was significant: Harmattan stated the Series B "significantly increases" from
              Series A, but neither the Series A valuation nor the step-up ratio was disclosed. This opacity makes
              dilution modeling imprecise. Third, preference stack dynamics are unknown: the treatment of Dassault's
              tranche relative to financial VC investors, liquidation preferences, anti-dilution provisions, and any
              information rights are undisclosed private terms. Fourth, the sovereign defense premium: French
              presidential endorsement on X and strategic framing as France's first defense unicorn introduce a
              political valuation floor that may provide downside protection in French government-adjacent scenarios
              (acquisition by a defense prime, France government strategic holding) but is not directly fungible for
              financial investors.

              European peer comparisons are instructive. Germany's Helsing was reportedly close to raising $1.2 billion
              at an $18 billion valuation in May 2026, reflecting 5 years of operation vs. Harmattan's 2 years — the
              implied age-adjusted valuation trajectory favors Harmattan if execution continues. Quantum Systems tripled
              its valuation to more than €3 billion in a November 2025 round following the €160 million Series C in May
              2025; Reuters noted this tripling was driven by 100% annual revenue growth, a financial disclosure
              Harmattan has not made. TEKEVER, the Lisbon-based ISR drone leader, raised £400 million at above £1
              billion valuation — with the notable differentiator that TEKEVER is already profitable, creating a
              financial floor under its valuation that Harmattan cannot yet claim. Anduril's $61 billion valuation at
              Series H after doubling revenue to $2.2 billion in 2025 represents the upper bound for autonomous defense
              platforms; Shield AI's $12.7 billion valuation reflects software-heavy differentiation with AI pilots
              deployed across 26 vehicle classes. Harmattan's $1.4 billion is at the low end of this peer band,
              suggesting room for re-rating if revenue metrics are eventually disclosed and prove strong, but also
              suggesting the current entry multiple is priced assuming those metrics are favorable.
