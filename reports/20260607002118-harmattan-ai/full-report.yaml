      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-Spectrum Stack with Unique Sub-150 kg SAR Capability
            body: >-
              Harmattan AI is the only European defense-autonomy startup to offer a documented all-weather SAR payload
              (Sahara, 0.25 m resolution at 2 km, <3.5 kg) integrated with kinetic C-UAS interceptors (Gobi Group 1-2,
              Gobi Tempest Group 2-3) and an autonomous strike platform (Barkhan) under a single AI-driven C2 layer
              (Kalahari). No direct European competitor replicates this full-spectrum architecture. The CEO's claim that
              Sahara is "unique in the world" for drones under 150 kg is commercially significant if independently
              validated, as it would prevent competitors from replicating persistent all-weather ISR on light tactical
              platforms without licensing the payload or developing equivalent sub-3.5 kg SAR technology.
            calloutType: strength
            claimRefs:
              - CE010
              - CE011
              - CE014
              - CE041
          - type: callout
            title: All Key Performance Claims Are Company-Stated and Unverified
            body: >-
              Every material specification published by Harmattan AI—Gobi's 0-second readiness and one-minute intercept
              cycle, Sahara's 0.25 m SAR resolution, Barkhan's GNSS-denied navigation in contested EW environments,
              Kalahari's Lattice interoperability—is self-declared from official product pages only. No independent test
              report, field deployment audit, or third-party certification has been published as of June 2026. For a
              company that completed a $1.4 billion valuation transaction in January 2026, the absence of independent
              technical verification of any flagship product specification is a material diligence gap. The closest
              operational proof point is the Skyeton partnership, but that integration was planned for Q1 2026 and its
              operational status has not been independently confirmed post-announcement.
            calloutType: risk
            claimRefs:
              - CE014
              - CE016
              - CE017
              - CE021
              - CE030
          - type: callout
            title: Kalahari's NATO Standards Posture Creates Integration Optionality
            body: >-
              Kalahari's explicit support for Asterix (air traffic surveillance), CoT (NATO situational awareness),
              Lattice (Anduril C2 standard), and Sapient (AI/autonomy interchange) positions it as a multi-vendor
              orchestration layer rather than a proprietary ecosystem. In practical terms, this means a NATO MoD
              purchasing Harmattan's hardware stack could theoretically integrate Kalahari alongside legacy Thales,
              Raytheon, or Anduril C2 systems rather than replacing them entirely. This integration optionality lowers
              switching costs for new customers and reduces the "walled garden" objection in government procurement.
              However, the Lattice standard is controlled by Anduril, creating a potential compatibility dependency on a
              direct competitor's protocol roadmap that diligence should interrogate.
            calloutType: insight
            claimRefs:
              - CE025
              - CE033
          - type: callout
            title: No Public Developer Surface — Software Maturity Unverifiable
            body: >-
              Harmattan AI has no publicly accessible GitHub repository, open-source package, API documentation, or
              developer SDK as of June 2026. For a company whose core value proposition is AI-driven autonomy software
              embedded across six hardware products, the complete absence of a developer signal makes it impossible for
              external analysts to independently assess software maturity, update cadence, dependency hygiene, or CI/CD
              practices. The open-roles page confirms active R&D hiring (GNC Engineer, RF Hardware Engineer, system
              architects), indicating a real engineering organization, but provides no signal on software quality.
              Diligence should request code reviews, test coverage metrics, and architecture documentation for the
              Kalahari C2 engine and edge-autonomy stack.
