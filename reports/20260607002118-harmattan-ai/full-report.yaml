          - type: callout
            title: Supply chain sovereignty remains a CEO-acknowledged material gap
            body: >-
              CEO M'Ghari explicitly confirmed in a February 2026 interview that brushless electric motor magnets and
              battery chemistry still depend on Chinese-controlled rare-earth supply chains. Sovereign motor solutions
              are expected to arrive by end 2026; battery-chemistry sovereignty is 3–5 years away. For a company whose
              value proposition is built on sovereign, scalable production, this dependency is a material operational
              and geopolitical risk that should anchor supply-chain diligence.
            calloutType: risk
            claimRefs:
