      - number: '3.2'
        title: 'Tier-1 Funded Peers: Helsing, Anduril, and Shield AI'
        blocks:
          - type: paragraph
            body: >-
              Helsing (founded in Germany around 2021) began as an AI software overlay for legacy military platforms
              before pivoting in 2024 to strike-drone hardware. Its HF-1 is produced with Ukrainian industry partners;
              the newer HX-2 kamikaze drone is manufactured at Helsing's first Resilience Factory in southern Germany at
              an initial rate exceeding 1,000 units per month, with claimed scalability to tens of thousands per month
              in a conflict scenario. Helsing raised approximately €761.5 million through a June 2025 €600 million round
              and was reportedly finalising a further approximately $1.2 billion round at an $18 billion valuation in
              May 2026 led by Dragoneer. Helsing's Altra connectivity platform underpins multi-drone coordination and is
              directly analogous to Harmattan's Kalahari C2 layer. Unlike Harmattan, Helsing is a strike-and-software
              specialist: it has no publicly documented kinetic C-UAS capability or SAR payload. Anduril (founded 2017,
              Costa Mesa CA) is the dominant US defense-technology prime. Revenue doubled to $2.2 billion in 2025 per
              CEO Brian Schimpf, and the company closed a $5 billion Series H at a $61 billion valuation in May 2026,
              bringing total funding above $11 billion. Anduril's Lattice platform provides autonomous C2 and sensor
              fusion across heterogeneous systems—Roadrunner autonomous interceptor, Ghost loitering munitions, and
              collaborative combat aircraft. Anduril is expanding into Europe: it won a Dutch Ministry of Defence
              contract in May 2026. However, ITAR and dual-use export regulations constrain the sovereign technology
              transfer European MoDs require, a structural disadvantage against Harmattan's French-company status with
              French and UK Programs of Record. Shield AI (founded 2015, San Diego CA) raised a $1.5 billion Series G at
              a $12.7 billion valuation in March 2026, led by Advent International and co-led by JPMorganChase. Its
              Hivemind autonomy software has piloted 26 classes of vehicles including F-16 fighter jets and was selected
              by the US Air Force as a mission autonomy provider for Collaborative Combat Aircraft. The V-BAT UAS has
              deployed on nearly every class of US Navy ship and with all seven Marine Expeditionary Units. Shield AI is
              acquiring Aechelon Technology to integrate high-fidelity simulation with Hivemind training. Shield AI's
              EdgeOS middleware achieves sub-millisecond local latency for deterministic autonomous control. A Reuters
              investigation published June 2026 documented safety incidents including drone crashes and worker injuries
              at a US defense-technology startup valued at approximately $13 billion, highlighting sector-wide
              operational-safety scrutiny that could affect regulatory posture across autonomous-systems companies
              including Harmattan.
