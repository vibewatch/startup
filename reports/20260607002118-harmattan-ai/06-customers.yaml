- id: section-adverse
  title: Concentration risks and adverse evidence
  body: 'The most significant structural weakness in Harmattan AI''s customer profile is extreme customer concentration. All
    publicly named revenue-generating customers are sovereign governments in Western Europe: France and the United Kingdom.
    These two customers, by definition, represent close to 100% of disclosed commercial revenue. The French government alone
    may represent the majority of hardware revenue given that the Sonora contract was Harmattan''s first and has the most
    documented delivery timeline. A single policy change in either government — a shift in procurement doctrine, a defense
    budget cut, a change in program requirements, or a security incident involving autonomous systems — could materially impair
    Harmattan''s top-line revenue.

    The opacity of retention and repeat-usage data compounds this risk. Unlike SaaS companies that disclose NRR, or commercial
    defense primes that publish backlog figures, Harmattan AI has made no disclosure about contract renewal options, delivery
    confirmation, post-delivery utilization, or any metric that would allow an investor to distinguish between a company that
    has won its first contracts and a company whose contracts are generating genuine repeat commercial relationships. This
    is partly structural — defense procurement data is often classified or commercially sensitive — but it makes independent
    verification of durability impossible at this stage.

    Reuters reporting in November 2025 on French drone makers facing funding uncertainty highlights broader sector risks:
    even French defense startups with government backing can face supply chain bottlenecks, production ramp difficulties,
    and procurement budget delays that affect delivery timelines and customer relationships. The article referenced the general
    challenge of scaling production while managing input cost volatility — a risk that Harmattan has acknowledged internally
    but not quantified publicly. The Dronexl analysis of the Dassault deal similarly flagged that the $1.4 billion valuation
    assumes continued government contract flow that has not yet been independently validated through a second procurement
    cycle.'
