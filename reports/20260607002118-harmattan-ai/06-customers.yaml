- id: section-named-proof
  title: Named customer proof and adoption trajectory
  body: 'The quality of customer evidence for Harmattan AI is strong on program-of-record confirmation but thin on deployment
    depth, utilization metrics, and outcome specificity. The French MoD contract (awarded July 2025, deliveries scheduled
    October–December 2025) covers 1,000 Sonora ISR training drones and is described as "multi-million euros," positioning
    these systems for operational training ahead of the Orion 2026 multinational exercise. Army Recognition, a specialist
    defense news outlet, reported on the contract within days of announcement; the DGA competitive process required approximately
    20 technical specifications and attracted multiple European competitors, which Harmattan won on price-competitiveness
    and production-readiness. This is the most independently corroborated customer proof in the public record.

    The UK MoD contract (announced September 2025 at DSEI London) covers up to 3,000 autonomous systems for "urgent operational
    needs." OpexNews.fr and Defense News both independently reported the award. The "up to" language introduces volume uncertainty,
    and the exact contract value in GBP has not been publicly released. The timing — announced at DSEI, the UK''s flagship
    defense show — is consistent with an accelerated procurement track, supporting the company''s characterization of these
    as production deployments rather than pilot programs.

    Dassault Aviation''s public statement at the January 2026 Series B announcement confirms the partnership scope: AI development
    for Rafale F5 and UCAS, under "sovereign, controlled and monitored AI" principles. This qualifies as a named customer
    at the development stage rather than production deployment. The Skyeton partnership provides channel-partner proof: Skyeton''s
    CEO publicly endorsed the collaboration at announcement, and the Raybird platform''s 350,000+ flight hours with Ukrainian
    forces serve as proxy evidence for Harmattan''s sensor integration in an operationally proven airframe. However, the Harmattan
    Sahara radar''s own operational track record inside Raybird deployments has not been independently verified as of June
    2026.

    The company''s self-reported production throughput claim — "delivering thousands of systems each month" — is stated in
    the Dassault press release but has not been verified by any independent auditor, government procurement authority, or
    investigative news outlet. This figure should be treated as a company-claimed estimate rather than an observed metric.'
