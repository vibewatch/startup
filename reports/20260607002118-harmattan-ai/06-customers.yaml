  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, contract renewal rates, follow-on order status, and operator utilization data for the French
      MoD Sonora program (delivery Oct–Dec 2025) and UK MoD program.
    whyItMatters: Without retention data, investors cannot distinguish a company that won initial contracts from one generating
      durable, repeat government revenue. Both French and UK contracts are past their initial delivery window as of June 2026.
    diligencePath: 'Request from Harmattan AI: (1) delivery confirmation letters from DGA and UK MoD; (2) any follow-on order
      announcements or option exercises; (3) operator feedback or acceptance reports; (4) annualized revenue run-rate by customer
      for FY2025 and YTD 2026.'
    relatedQuestionRefs:
    - QU019
    - QU021
    - QU012
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Customer revenue concentration disclosure — specifically, what percentage of total ARR or backlog is
      attributable to France alone versus the UK versus Dassault.
    whyItMatters: If France or the UK individually represents more than 50% of revenue, a single-policy-change event in either
      government could be a thesis-breaking event; this cannot be assessed from public information.
    diligencePath: Request annualized revenue by customer segment for FY2025; ask for any contractual termination- for-convenience
      clauses and their associated cost thresholds.
    relatedQuestionRefs:
    - QU016
    - QU018
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: Skyeton-deployment
    missingEvidence: Independent confirmation that Harmattan AI's Sahara SAR radar has been operationally deployed within
      Skyeton's Raybird UAS in any live mission (as opposed to only announced for integration).
    whyItMatters: The Skyeton partnership's customer-proof value depends on actual deployment, not just announcement. Q1 2026
      deployment timeline per third-party analysis has not been independently confirmed as of June 2026.
    diligencePath: 'Request from Harmattan AI or Skyeton: delivery confirmation of at least one integrated Sahara-Raybird
      unit; seek any Ukrainian defense reporting or official Skyeton update confirming operational status.'
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: Dassault-exclusivity
    missingEvidence: Whether the Dassault Aviation partnership contains exclusivity clauses preventing Harmattan AI from selling
      to competing prime customers (Airbus, Leonardo, BAE Systems, Safran) or non-Rafale-nation governments.
    whyItMatters: Exclusivity terms could materially limit the serviceable addressable market and the company's ability to
      replicate its French/UK success in new geographies.
    diligencePath: Review Dassault partnership agreement; request representation from Harmattan AI that no geographic or customer-category
      exclusivity applies to the technology-development collaboration.
    relatedQuestionRefs:
    - QU020
  - type: enumeration-incomplete
    severity: minor
    topic: NATO-customers
    missingEvidence: Identity and scope of the undisclosed NATO-government POR customer announced in July 2025.
    whyItMatters: A third sovereign POR is a material customer-proof data point; without the identity, investors cannot assess
      geopolitical concentration, program durability, or the customer's operational domain.
    diligencePath: Request disclosure of the third POR customer identity under NDA if publicly classified; or verify via NATO
      procurement databases, national defense budget transparency reports, or journalist investigative coverage of the July
      2025 announcement.
    relatedQuestionRefs:
    - QU001
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: production-throughput
    missingEvidence: Independent audit or third-party confirmation of Harmattan AI's claimed production throughput of "thousands
      of systems each month" and the total units delivered under all Programs of Record.
    whyItMatters: The production throughput claim anchors the company's manufacturing credibility and scales directly into
      financial projections; without independent verification, it is a company-claimed figure with low confidence.
    diligencePath: Request production records, shipping manifests, or MoD acceptance letters confirming delivered unit counts
      for the French and UK contracts; verify claimed monthly production rate through factory audit or third-party production
      data.
