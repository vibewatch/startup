chapter:
  number: 6
  title: Customers
  summary: Harmattan AI has secured two named Programs of Record with the French and UK Ministries of Defence and a third
    with an undisclosed NATO ally within 18 months of founding, placing it among the fastest defense startups to achieve sovereign
    government adoption at volume. The Dassault Aviation strategic partnership (January 2026) adds a fourth named customer/partner
    for AI integration in the Rafale F5 and UCAS programs, while the Skyeton channel partnership positions Harmattan technology
    inside a battle-proven Ukrainian UAS platform for broader NATO-market access. Customer concentration is structurally high
    — all publicly disclosed revenue derives from two sovereign governments — and no public NRR, churn, utilization, or operator-level
    testimonial data is available to assess retention quality independently.
sections:
- id: section-segmentation
  title: Customer base segmentation and primary buyers
  body: 'Harmattan AI''s commercial base as of June 2026 is anchored entirely within the sovereign defense sector. The primary
    paying customers on public record are the French Ministry of Defence (DGA) and the UK Ministry of Defence, each having
    awarded a Program of Record — the strongest procurement signal available in defense, indicating multi-year budgeted commitment
    and formal acquisition governance. A third undisclosed NATO-government contract was announced in July 2025, bringing total
    confirmed Programs of Record to three. Dassault Aviation functions as a hybrid customer and investor: the January 2026
    Series B partnership entails Harmattan AI developing embedded AI capabilities for Dassault''s Rafale F5 and future UCAS
    programs, making Dassault both a payer for technology development and a strategic distribution channel into wider air-combat
    procurement.

    The Skyeton partnership (October 2025) introduces a channel-partner model in which Harmattan''s Sahara SAR radar payload
    is integrated into Skyeton''s battle-proven Raybird UAS. This partnership targets NATO markets where Raybird already has
    an operational footprint, creating an indirect route to end-customers in allied nations without requiring Harmattan to
    win sovereign procurement competitions in every market independently. The Raybird platform has accumulated more than 350,000
    combat flight hours with Ukrainian defense forces, lending significant operational credibility to the Skyeton channel.

    In terms of geographic segmentation, the confirmed footprint is France (MoD contract plus Dassault corporate headquarters
    and Rafale program), the United Kingdom (MoD contract plus UK Gobi sales signals per press reports), and the broader Ukrainian-adjacent
    NATO ecosystem via Skyeton. Exhibition appearances at World Defense Show in Riyadh (February 2026), UMEX in Abu Dhabi
    (January 2026), SOF Week in Tampa (May 2026), and Eurosatory in Paris (June 2026) signal intent to penetrate Gulf-state
    and US-SOF markets, but no contracts in those geographies have been publicly announced. The customer base is exclusively
    government and institutional; no commercial or dual-use customers have been disclosed.'
