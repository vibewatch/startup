  - id: section-financial-gaps
    title: Public financial gaps and disclosure opacity
    body: >-
      Harmattan AI's financial disclosure posture is consistent with a private-stage French
      defense company: no regulatory obligation to publish revenue, margins, or detailed
      capital structure data. However, from an investor diligence perspective, the lack of
      public financial metrics creates fundamental underwriting opacity. No ARR, revenue run
      rate, gross margin, operating loss, burn rate, or runway figure has been disclosed in
      any press release, investor letter, regulatory filing, or financial statement accessible
      to the public as of June 2026.

      The specific gaps that block underwriting include: the aggregate contract value of both
      Programs of Record (which would establish a revenue baseline), gross margin on hardware
      delivery (which determines whether the business is fundamentally viable at scale), burn
      rate and runway (which determine the risk of near-term dilution), and the size of
      Dassault's specific equity tranche within the $200M round (which affects dilution and
      board dynamics). The Crunchbase profile returned a 403 access error during research,
      providing no supplementary financial data. The Le Grand Continent CEO interview — the
      most substantive public disclosure — addressed supply chain, geopolitical strategy, and
      industrial policy, but did not disclose any revenue, margin, or burn figures.
