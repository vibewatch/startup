callouts:
  - calloutType: risk
    title: Revenue opacity is the primary diligence blocker
    body: >-
      Harmattan AI has disclosed no ARR, revenue run rate, gross margin, burn rate, or contract
      values. The $1.4B post-money valuation at Series B cannot be benchmarked against revenue
      multiples without diligence-room access to company financials. This is normal for a
      private French defense company but is a material constraint on any underwriting thesis.
    claimRefs:
      - CI028
      - CI029
      - CI030

  - calloutType: strength
    title: Government Programs of Record provide high-quality revenue anchor
    body: >-
      Two confirmed sovereign-credit Programs of Record (French MoD, UK MoD) within 18 months
      of founding validate the revenue model. Sovereign counterparties minimize credit risk and
      demonstrate operational delivery capability that most defense startups lack at this stage.
    claimRefs:
      - CI033
      - CI036

  - calloutType: risk
    title: Chinese rare-earth supply chain depresses margins for 3–5 years
    body: >-
      CEO M'Ghari confirmed in February 2026 that brushless motor magnets and lithium-polymer
      batteries both retain Chinese rare-earth supply-chain dependencies expected to persist
      for three to five years. This structural COGS risk suppresses gross margins on hardware
      delivery contracts until alternative sourcing is established.
    claimRefs:
      - CI013
      - CI014

  - calloutType: insight
    title: Dassault partnership adds non-monetary capital that changes the risk profile
    body: >-
      Beyond the $200M financial injection, Dassault Aviation contributes program management
      expertise, military systems integration knowledge, and its established network for
      international defense business development. This non-balance-sheet capital materially
      reduces commercialization risk for Harmattan's highest-value revenue streams.
    claimRefs:
      - CI037
      - CI038

