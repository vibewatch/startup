chapter:
  number: 4
  title: Financials
  summary: >-
    Harmattan AI is a private, pre-disclosure company with ~$242 million in total capital raised
    through a $200 million Series B led by Dassault Aviation in January 2026 at a $1.4 billion
    post-money valuation. The company generates revenue through direct government procurement
    contracts (Programs of Record) but discloses no ARR, revenue, gross margin, burn rate, or
    runway — the standard private-company financial opacity for a B2G defense hardware startup.
    Two confirmed Programs of Record (French MoD: 1,000 drones; UK MoD: up to 3,000 systems)
    signal real revenue at scale, but contract values remain undisclosed, making underwriting
    of unit economics or margin path dependent on diligence-room data access.

sections:
  - id: section-business-model
    title: Business model, revenue streams, and monetization
    body: >-
      Harmattan AI operates a business-to-government (B2G) revenue model anchored in defense
      procurement contracts. Revenue accrues primarily through the delivery of autonomous systems
      hardware — drones, counter-UAS interceptors, electronic-warfare platforms, and C2 software
      — sold directly to national ministries of defence and allied military forces under Programs
      of Record. The company's two disclosed Programs of Record, with the French Ministry of
      Defence (1,000 SORONA drones, July 2025) and the UK Ministry of Defence (up to 3,000
      autonomous systems, September 2025), confirm that the core revenue mechanism is lump-sum
      or milestone-based government contracts rather than recurring subscription revenue.

      The company's official press release describes the intended use of Series B proceeds as
      expanding "deployment of AI-enabled missions across new operational theaters, extend
      Harmattan AI's product offering into new domains and scale industrial manufacturing" —
      indicating that the dominant near-term revenue stream remains hardware delivery contracts.
      A second emerging revenue stream is embedded AI integration services for Dassault
      Aviation's Rafale F5 and UCAS programs; this stream is nascent and no financial terms
      have been disclosed. A third revenue avenue — technology licensing through the Skyeton
      partnership (integrating Harmattan's Sahara SAR payload into Raybird UAS) — is confirmed
      by the October 2025 partnership announcement but its revenue contribution and structure
      are not public.

      Harmattan's website explicitly states the site is a "static catalogue" with no e-commerce
      functionality, and all sales proceed through direct military customer engagement and
      national procurement agencies (DGA in France; DE&S in the UK). This confirms that channel
      distribution, reseller arrangements, and commercial pricing transparency are structurally
      absent: the company has no list pricing, no public rate card, and no disclosed per-unit
      or per-contract value for any product line.

      The CEO's February 2026 Le Grand Continent interview introduces a compelling structural
      question: M'Ghari explicitly advocates for a "take-or-pay" procurement model analogous to
      pandemic-era vaccine manufacturing contracts, where states fund production capacity even
      without committing to purchase volumes. If Harmattan secures such arrangements, it would
      produce a capital-light recurring payment stream; no evidence of an active take-or-pay
      contract exists as of June 2026.
