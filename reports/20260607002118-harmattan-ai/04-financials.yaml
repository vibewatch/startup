  - id: section-capital-adequacy
    title: Capital adequacy, funding history, and financing dependency
    body: >-
      Harmattan AI's capital formation was rapid and is currently well-resourced relative
      to its age. The Company Overview chapter covers the full chronological funding record;
      this section focuses on forward capital adequacy as of June 2026. The Series B closed
      on January 12, 2026, providing $200 million in fresh capital led by Dassault Aviation;
      Motier Ventures renewed its position. Combined with an estimated $42 million in
      pre-Series B rounds (seed led by Atlantic VC; Series A of approximately $30 million
      led by FirstMark Capital), total lifetime capital raised is approximately $242 million.
      Dassault's specific tranche and co-investor identities beyond Motier were not disclosed.

      The stated use of Series B proceeds — manufacturing scale-up, new product domains, and
      AI deployment expansion — is consistent with the capital intensity of scaling a defense
      hardware manufacturer. Manufacturing capex for drone production lines, component
      procurement inventory, testing infrastructure, and multi-country operations require
      sustained cash investment. No debt facility, project finance arrangement, or credit
      line has been publicly disclosed, suggesting equity financing remains the sole
      capital source.

      Cash on hand, burn rate, and runway are not disclosed. At a proxy burn of $2–3 million
      per month (headcount-based estimate) and $200 million raised in January 2026, a rough
      runway estimate of 5–8 years at the current operating scale would be implied — though
      this ignores manufacturing capex, component procurement working capital, and future
      hiring at scale, all of which would compress runway materially. The absence of any
      capital-markets filing, no registered public debt, and no published quarterly report
      means all runway estimates are analytical proxies, not verified numbers.

      The Dassault partnership adds a strategic dimension to capital adequacy beyond the
      monetary investment: Dassault commits its aerospace program development expertise,
      supply-chain access, and international business development network to Harmattan's
      growth. This non-monetary capital, while not on the balance sheet, reduces commercialization
      and market-access risk for the company's highest-value potential revenue streams
      (Rafale F5 integration, UCAS programs).
