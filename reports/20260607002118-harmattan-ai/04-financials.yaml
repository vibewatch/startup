  - id: section-financial-verdict
    title: Financial verdict — revenue quality, margin path, and diligence blockers
    body: >-
      Harmattan AI's financial picture in June 2026 is characterized by three coexisting
      realities: strong revenue quality indicators, deep unit-economics opacity, and a
      well-capitalized balance sheet for the near term.

      Revenue quality is high where it can be assessed. Programs of Record with two national
      NATO governments represent sovereign-credit counterparties — the most credit-secure
      customer category available to a defense company. Government contracts are typically
      milestone-based with partial prepayment, reducing collection risk. The speed of
      contract execution (French MoD fulfilled in 14 months from founding; UK MoD in 15
      months; Estonian order in 7 months per the CEO interview) demonstrates operational
      delivery capability that most defense startups lack at comparable stages. The Dassault
      partnership adds a third revenue quality dimension: embedded AI development for a
      $6.2B-revenue prime creates stable, multi-year development revenue not subject to
      typical hardware procurement cycles.

      Margin path is the critical unknown. Defense hardware manufacturing is inherently
      lower-margin than software, and Harmattan's SORONA drone competes on cost-efficiency
      alongside quality — the DGA procurement explicitly targeted low unit cost. The
      company's stated ambition of "thousands of systems per month" production would improve
      fixed-cost absorption, but the Chinese rare-earth supply-chain dependency and premium
      European labor costs suppress gross margin near-term. Without contract-level pricing
      or a cost breakdown, gross margin cannot be estimated with useful precision.

      Capital intensity is the primary near-term risk. Scaling drone manufacturing is
      capital-intensive: production lines, quality systems, supply-chain management, and
      multi-country operations all require sustained investment. The $200M Series B is
      adequate for the current growth phase but not for the 10,000-unit-per-month ambition
      the company has referenced. The next funding round will likely be driven by
      manufacturing scale-up milestones rather than pure revenue metrics.

      Primary diligence blockers: (1) no revenue or ARR disclosure; (2) no gross margin
      disclosure; (3) contract values for both Programs of Record are classified/withheld;
      (4) Dassault tranche and co-investor structure are undisclosed; (5) no debt or
      project-finance disclosure; (6) no burn rate or runway data.
