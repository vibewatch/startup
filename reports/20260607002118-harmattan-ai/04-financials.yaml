  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-opacity
      missingEvidence: >-
        Harmattan AI revenue, ARR, and gross margin for any period; company has no obligation
        to disclose as a French SAS private company.
      whyItMatters: >-
        Without revenue disclosure, the $1.4B valuation cannot be benchmarked against revenue
        multiples, making underwriting of the investment thesis dependent entirely on diligence-room
        access to management accounts.
      diligencePath: >-
        Request management accounts for trailing 12 months; board reporting package; revenue
        by product line and geography; ASC 606 or IFRS 15 revenue recognition policy memo.
      relatedQuestionRefs:
        - QI021
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: blocking
      topic: series-b-composition
      missingEvidence: >-
        Dassault Aviation's specific equity tranche within the $200M Series B, identity and
        ticket sizes of co-investors beyond Motier Ventures, and cap table structure.
      whyItMatters: >-
        Board seat rights, governance mechanics, anti-dilution provisions, and co-investor
        motivations cannot be assessed without the full investor roster and term sheet.
      diligencePath: >-
        Request full cap table, Series B term sheet summary, and board composition disclosure;
        confirm whether Dassault holds observer or voting board seat.
      relatedQuestionRefs:
        - QI015
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
