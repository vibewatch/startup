  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Primary Threat
      - Severity
      - Mitigation or Diligence Ask
    rows:
      - - Dassault Aviation partnership / Rafale F5 + UCAS integration
        - Competitor secures comparable Tier-1 OEM deal (Airbus D&S invests in Quantum Systems; Anduril has Boeing/USAF CCA)
        - High
        - Verify whether the Dassault partnership includes exclusivity clauses or IP licensing that restricts equivalent competitor deals; assess Airbus D&S investment scope in Quantum Systems
      - - French and UK Programs of Record
        - Contracts lost at renewal or competed under multi-supplier frameworks
        - High
        - Determine contract durations, re-compete terms, and sole-source justification; note no contract value is publicly disclosed
      - - SAR payload (Sahara) all-weather ISR differentiation
        - Commercial SAR-as-a-service incumbents (Capella Space, ICEYE) commoditise airborne SAR sensing
        - Medium
        - Harmattan's edge is system integration; verify whether Sahara L–S band specs are proprietary or use commercially available SAR modules
      - - Vertically integrated full-spectrum portfolio
        - Competitor assembles equivalent stack via targeted acquisition as Shield AI is doing with Aechelon
        - High
        - Monitor Anduril and Shield AI European acquisition activity; assess Harmattan's speed of capability extension into EW and ground-robotics domains
      - - European sovereignty and NATO alignment
        - "Anduril's Dutch MoD 2026 win and potential EU Defence Fund eligibility erodes the sovereignty premium"
        - Medium
        - Confirm depth of Anduril's EU sovereign technology-transfer commitments; ITAR waivers do not equate to full sovereignty transfer
      - - Embedded autonomy doctrine (Kalahari + edge compute)
        - Open-source LLM/CV stacks lower the barrier to entry for the autonomy layer within 3–5 years
        - Medium
        - Verify proprietary nature of Harmattan's inference stack; assess whether SAR integration and multi-system swarm coordination are truly differentiated
      - - Volume manufacturing (thousands/month company-claimed)
        - Low-cost FPV producers across Ukraine and Europe undercut Harmattan on hardware unit economics at scale
        - High
        - No per-unit cost data is available; independent factory verification and cost benchmarking required before assessing manufacturing moat
    notes: >-
      Severity ratings are qualitative judgments based on competitive evidence gathered as of
      June 2026. "High" indicates a threat that could materially erode Harmattan's competitive
      position within 24 months if unmitigated. "Medium" indicates a real but slower-moving or
      partially addressable threat. No independent production or contract audits underlie these
      assessments.
    claimRefs: [CP036, CP038, CP040, CP041, CP042, CP005, CP006, CP016]

