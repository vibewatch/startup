  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitor pricing and contract terms
      missingEvidence: >-
        No public list pricing or contract-value disclosure exists for Harmattan AI, Helsing,
        Anduril, or TEKEVER. Comparative cost-effectiveness analysis requires procurement-level access
        to actual contract schedules and per-unit or per-programme pricing.
      whyItMatters: >-
        Without pricing data it is impossible to assess whether Harmattan's per-unit or programme costs
        are competitive against Helsing's claimed unit-economics advantage, TEKEVER's service-model
        economics, or Anduril's IRAD-subsidised platform pricing.
      diligencePath: >-
        Request contract schedules, framework agreement values, and unit pricing under NDA during
        investor due diligence; cross-reference any disclosed DoD/MoD procurement notices in FPDS,
        UK Contracts Finder, or the DGA procurement database.
      relatedQuestionRefs: [QP017, QP023]

    - type: missing-source
      severity: material
      topic: incumbent replication of Harmattan capability stack
      missingEvidence: >-
        No credible third-party analysis quantifies the time or capital required for a well-resourced
        prime contractor (Thales, Airbus D&S, Leonardo) or US peer (Anduril) to replicate Harmattan's
        full-spectrum stack via organic R&D or targeted acquisition.
      whyItMatters: >-
        If a tier-1 incumbent can replicate Harmattan's key capabilities within 18–24 months using
        existing R&D budgets, the moat durability assessment changes materially from medium to high risk.
      diligencePath: >-
        Commission independent technical assessment distinguishing Harmattan's proprietary components
        from commodity elements in Kalahari, Sahara, and Barkhan; benchmark against available open-source
        autonomy stacks and commercial SAR sensor specifications.
      relatedQuestionRefs: [QP024]

    - type: missing-source
      severity: minor
      topic: Helsing Resilience Factory production verification
      missingEvidence: >-
        Helsing's claimed 1,000+ HX-2 units per month capacity is from company-authored press releases
        only; no independent facility inspection, production-rate audit, or satellite imagery analysis
        has been published as of June 2026.
      whyItMatters: >-
        If actual production is materially below claimed capacity, Helsing's medium-term threat level
        to Harmattan is reduced, which would partly relieve competitive scale pressure on Harmattan's
        own production claims.
      diligencePath: >-
        Review German commercial-register filings for the southern Germany facility; seek independent
        journalist or analyst facility visit reports from the Munich Security Conference context.
      relatedQuestionRefs: [QP016]

    - type: private-evidence-only
      severity: minor
      topic: Harmattan AI operator dependency reduction vs. competing platforms
      missingEvidence: >-
        No independent benchmark compares operator-to-system ratios or cognitive load reduction between
        Harmattan AI's Kalahari-orchestrated missions and remotely piloted competitor platforms from
        TEKEVER or Quantum Systems.
      whyItMatters: >-
        Operator workload reduction is central to Harmattan's commercial pitch for large-scale deployment;
        absent independent evidence, this claimed advantage cannot be verified by an investor or MoD buyer.
      diligencePath: >-
        Request operator-ratio data and mission logs from Harmattan AI or its MoD customers; seek a
        comparative live-fire or exercise evaluation under controlled conditions with an independent observer.
      relatedQuestionRefs: [QP020]
