callouts:
  - calloutType: strength
    title: Dassault Partnership Creates Asymmetric Sovereignty Moat
    body: >-
      Harmattan AI's strategic partnership with Dassault Aviation for integration into the Rafale F5
      and UCAS platforms is the most defensible competitive differentiator in the European defense-
      autonomy market. No European peer—including Helsing, TEKEVER, or Quantum Systems—has secured
      an equivalent Tier-1 OEM relationship with a NATO-standard combat aircraft programme.
      This integration path creates procurement stickiness across France's armed forces and positions
      Harmattan for combat-aviation contracts structurally off-limits to US competitors constrained
      by ITAR and to ISR-specialist peers lacking strike and C2 integration.
    claimRefs: [CP036, CP038, CP005]

  - calloutType: risk
    title: Commoditization Threat from Below and from Scale
    body: >-
      Two converging forces threaten Harmattan's hardware value proposition. FPV drone production
      scaling across Ukrainian, Finnish, and French manufacturers is compressing per-unit drone
      hardware costs sector-wide. Separately, Anduril's $61 billion valuation and $2.2 billion
      revenue base give it the capital to absorb European market-entry losses—including operating
      below cost to displace a competitor holding nascent Programs of Record. Harmattan's best
      defence is the speed of its French MoD relationship and the specificity of the Dassault
      partnership, but the funding asymmetry is real and must inform diligence on contract
      exclusivity and duration.
    claimRefs: [CP001, CP041, CP042]

  - calloutType: risk
    title: Manufacturing Scale Claim Is Unverified
    body: >-
      Harmattan AI claims to deliver thousands of systems per month, a rate comparable to Helsing's
      publicly confirmed 1,000+ HX-2 units per month from its named Resilience Factory in southern
      Germany. Harmattan has not named a production facility or provided an independently verifiable
      production figure. Until third-party production evidence is available, this claim should be
      treated as company-stated only. The gap between claimed and actual production capacity would
      be a material diligence issue for any investor or MoD counterparty assessing supply-chain
      resilience and programme-of-record delivery obligations.
    claimRefs: [CP009, CP037, CP038]

  - calloutType: insight
    title: TEKEVER's IaaS Model and Profitability Signal a Viable Non-Prime Path
    body: >-
      TEKEVER's combination of Intelligence-as-a-Service subscription revenue, confirmed
      profitability, NATO Innovation Fund backing, and the UK OVERMATCH programme demonstrates
      that a European defense-autonomy company need not pursue a high-burn, high-valuation
      trajectory to achieve commercial sustainability. Its €30M EMSA framework provides durable
      recurring revenue anchored in civilian-safety institutional demand. For Harmattan, the
      implication is dual: TEKEVER is a reference for service-model economics, and a warning that
      if MoD programme ramp is slower than the current funding runway assumes, a service-layer
      revenue stream alongside platform sales could become strategically necessary.
    claimRefs: [CP019, CP020, CP023, CP038]

