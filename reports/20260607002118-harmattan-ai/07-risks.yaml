callouts:
- calloutType: risk
  title: Gobi HITL gap is the highest-severity single risk
  body: 'Harmattan publicly describes Gobi operating "without requiring a human in the loop for each intercept." This functional design choice creates the highest-severity unmitigated risk: a lethal autonomous weapon with no disclosed AI safety certification, no IHL compliance documentation, and no public rules-of-engagement technical disclosure. A high-profile misidentification event could trigger program suspension by UK or French MoD, invite regulatory action, and damage Harmattan''s standing with all NATO customers. This gap must be closed in due diligence before any investment commitment.'
  claimRefs:
  - CR004
  - CR005
  - CR003
- calloutType: risk
  title: Supply-chain opacity is a material execution risk for Series B deployment
  body: Harmattan plans to use $200 million in Series B proceeds to scale manufacturing. Yet no public disclosure names a manufacturing facility, production-capacity metric, or component sourcing map. BCG's May 2026 C-UAS whitepaper explicitly identified that European C-UAS systems are "dependent on supply chains not yet built for sustained attrition." Against this backdrop, Chinese rare-earth and battery exposure — combined with absent sovereign-sourcing evidence — represents an unmitigated execution risk threatening delivery to both MoD customers.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
- calloutType: insight
  title: Procurement urgency is a double-edged catalyst
  body: Harmattan's unprecedented startup-to-Programs-of-Record trajectory is directly attributable to wartime urgency procurement mechanisms in France and the UK. The same urgency that enabled the 2025 wins could evaporate with a Ukraine ceasefire or political realignment. Investors should model scenarios where post-2026 procurement reverts to full-lifecycle evaluation timelines, as this would substantially increase time-to-revenue for the next generation of contracts and require Harmattan to compete against primes with decades of compliance infrastructure.
  claimRefs:
  - CR036
  - CR038
  - CR040
