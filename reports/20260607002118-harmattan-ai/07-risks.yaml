- id: section-supply-chain-operations
  title: Supply-chain, manufacturing, and operational risks
  body: 'Harmattan AI has two confirmed Programs of Record with tight delivery windows: 1,000 SORONA drones to the French MoD (deliveries by end 2025) and up to 3,000 systems to the UK MoD for near-term deployment from a September 2025 contract. Simultaneously, the Series B funds a manufacturing scale-up. BCG''s May 2026 C-UAS whitepaper directly indicts the category: "C-UAS systems remain expensive, difficult to scale, and dependent on supply chains not yet built for sustained attrition." The Expert Market Research 2026 Europe UAV report identifies European drone industry as "5–10 years behind US and Israeli equivalents in autonomy, AI integration, and production scale."

    Component and rare-earth dependency: Drone hardware — including LiPo batteries, microelectronics, RF modules, and motor assemblies — relies substantially on Chinese manufacturing and rare-earth materials. Lithium battery supply chains for Group 1 UAS remain heavily concentrated in Chinese producers. Rare-earth elements used in drone motors (neodymium, dysprosium) are subject to periodic Chinese export controls. Harmattan uses a Lynred-supplied IR sensor (French company), demonstrating partial sovereign sourcing, but no public disclosure covers battery, motor, processor, or RF component sourcing. The SORONA drone is described as "assembled in France," but final-assembly does not imply full-chain sovereignty.

    Manufacturing ramp and quality risk: Scaling from hundreds to thousands of units per month is capital- and process-intensive. No manufacturing facility, production-capacity metric, or quality-management certification (e.g., AS9100, DEF STAN) has been disclosed. DroneXL reported Harmattan is planning for 10,000 drones monthly capacity — a scale that requires extensive supply chain, testing, and quality infrastructure. Reuters reported in June 2026 that drone crashes and safety incidents at Anduril illustrate real operational safety risk from rapid scaling in defense drones, a sector-wide pattern.

    Electronic warfare and GPS-denial resilience: Harmattan''s CEO emphasized battlefield contexts where GNSS is denied or RF communications are jammed. The Gobi interceptor and SORONA rely on embedded AI for GPS-independent flight. The MarketsandMarkets 2026 Europe UAV report lists GPS resilience as a design requirement that "adds development complexity and cost." No public red-team, software-audit, or penetration-test disclosure exists for any Harmattan system.'
