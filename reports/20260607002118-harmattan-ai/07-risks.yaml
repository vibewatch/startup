  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: LAWS / Gobi IHL compliance
    missingEvidence: Harmattan AI's internal AI safety documentation, rules-of-engagement protocol, and any IHL compliance certification for the Gobi no-HITL intercept system.
    whyItMatters: Without this evidence, it is impossible to assess whether Gobi's autonomous intercept profile exposes Harmattan and MoD customers to LAWS liability, program suspension, or reputational risk from a misidentification event.
    diligencePath: Request Harmattan's AI safety charter, Gobi ROE technical specification, and any legal opinion on IHL compliance; confirm UK MoD's HITL policy requirements.
    relatedQuestionRefs:
    - QR001
    - QR012
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: financial / burn rate
    missingEvidence: Harmattan AI's audited financial accounts, revenue, gross margin, and burn-rate post-Series B.
    whyItMatters: Capital-intensive manufacturing scale-up with opaque financials makes it impossible to assess runway, working-capital adequacy, or path to profitability without private access.
    diligencePath: Request audited accounts for FY2025 and management accounts for Q1 2026; confirm CFO identity and financial controls.
    relatedQuestionRefs:
    - QR010
    - QR024
  - type: missing-source
    severity: material
    topic: manufacturing / supply chain
    missingEvidence: Harmattan's manufacturing facility, production capacity, quality-management certification (e.g., AS9100), and battery/electronic component sourcing map.
    whyItMatters: Without manufacturing evidence, delivery schedule risk to both MoD programs cannot be assessed; Chinese component exposure cannot be quantified.
    diligencePath: Site visit to production facility; request BOM sourcing breakdown, supplier audit results, and monthly production output data.
    relatedQuestionRefs:
    - QR004
    - QR005
    - QR019
    - QR021
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board of directors composition, investor board-seat rights, protective provisions, liquidation preferences, and independent director credentials.
    whyItMatters: A defense unicorn with opaque board governance presents unquantifiable execution risk; investor rights and co-founder equity lock-ups are unknown.
    diligencePath: Request articles of association, shareholders agreement, and board composition; confirm independence of any non-executive directors.
    relatedQuestionRefs:
    - QR007
    - QR025
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: MoD delivery status
    missingEvidence: Official confirmation of delivery progress against the 1,000-unit French MoD schedule (end 2025) and 3,000-unit UK MoD schedule.
    whyItMatters: If deliveries are delayed or partial, it signals manufacturing execution risk and could trigger contract clauses affecting revenue recognition.
    diligencePath: Request official delivery milestone letters from DGA and UK DE&S; review any customer-issued performance notices.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: litigation / IP disputes
    missingEvidence: Court record searches for any litigation, IP disputes, regulatory enforcement, or competitor claims against Harmattan AI since April 2024.
    whyItMatters: A defense-technology startup with senior hires from Safran and Isar Aerospace and rapidly developed IP could face trade-secret or patent claims; no public court record search has been performed.
    diligencePath: Commission legal database search across French INPI, EPO, and UK IPO for patent filings; search French court registers for any pending or resolved litigation.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: minor
    topic: NATO certification status
    missingEvidence: Confirmation of whether any Harmattan system participated in TIE 26 or is registered for LCI-X validation.
    whyItMatters: NATO certification is required for Alliance-wide procurement; absence from TIE 26 limits near-term NATO market access and widens the addressable-market gap with certified competitors.
    diligencePath: Contact NCIA or review published TIE 26 participant list; confirm LCI-X Crucible Series participation status.
    relatedQuestionRefs:
    - QR003
    - QR030
    relatedTableRefs:
    - TR001
