chapter:
  number: 7
  title: Risks
  summary: 'Harmattan AI carries a compound risk stack across five severity tiers: (1) autonomous-weapons legal and regulatory exposure — Gobi''s no-HITL intercept architecture, EU/French dual-use export-licensing complexity, and NATO interoperability certification gaps; (2) supply-chain and manufacturing execution risk — Chinese battery and rare-earth dependence, a 4,000-unit delivery schedule with no disclosed production-capacity evidence, and no quality-management certification; (3) governance opacity — four co-founders, no disclosed external board, no named CFO, and zero financial disclosure; (4) competitive capitalization risk — Anduril ($61 B, $5 B raised), Shield AI ($12.7 B), and Helsing (~$18 B) dwarf Harmattan''s $1.4 B valuation; and (5) procurement-cycle sensitivity — contracts driven by wartime urgency may shrink with de-escalation, and NATO certification imposes material lead time.'
sections:
- id: section-regulatory-legal
  title: Regulatory, legal, and export-control risks
  body: 'Harmattan AI operates in one of the most tightly regulated commercial segments — lethal or potentially lethal autonomous systems sold to government militaries. Several distinct regulatory vectors create layered exposure.

    French dual-use export controls: All drone and autonomous-weapons exports from France are subject to the French export-licensing regime administered by the SGDSN and DGA under the defense-material export act (Loi du 22 juin 2011). EU Regulation 2021/821, the EU dual-use export-controls framework, applies in parallel for non-military dual-use subsystems. The Expert Market Research 2026 Europe UAV report explicitly states that "European UAV exports require coordination between national export licensing and EU common position frameworks, creating regulatory complexity for European manufacturers targeting global markets." Harmattan''s CEO acknowledged in the February 2026 Le Grand Continent interview that supply-chain independence from export licenses is a material constraint when seeking to produce in large quantities.

    NATO and EU interoperability certification: NATO''s Technical Interoperability Exercise (TIE 26), held May 2026 in the Netherlands, tests whether C-UAS and UAS systems meet Alliance C2 integration standards before they are eligible to join the NATO defence architecture. The NCIA stated that "interoperability in modern multi-layered C-UAS operations is no longer optional — it is essential." Harmattan''s systems are not publicly confirmed as TIE 26 participants. NATO''s Latvia Innovation Range (March 2026) and the LCI-X Beacon Project impose structured validation requirements before systems can be procured Alliance-wide. Failure to achieve NATO interoperability certification would restrict Harmattan to bilateral national contracts with France and the UK, capping addressable market. The European Parliament Research Service''s 2026 analysis of military drone systems highlights the regulatory complexity of deploying autonomous systems under EU legal frameworks, noting that dual-use drone
    platforms face oversight from both military and civilian aviation authorities.

    Lethal autonomous weapons and IHL compliance: Harmattan''s Gobi counter-UAS interceptor operates "without requiring a human in the loop for each intercept." This invokes the ongoing international debate on Lethal Autonomous Weapons Systems (LAWS). The UN Convention on Certain Conventional Weapons Group of Governmental Experts has debated LAWS regulation since 2014 without binding treaty status. No public AI ethics charter, safety certification, or IHL compliance documentation for Gobi has been disclosed. A misidentification incident could trigger program suspension by MoDs, regulatory action, and reputational damage across NATO customers.

    EU fragmentation adds interoperability uncertainty: France and Germany remain at impasse on the FCAS joint fighter program, with Defense News noting they are "struggling to move forward." The European Commission lacks a mandate for a pan-European defence strategy per the CEO''s own assessment. The Eurocontrol 2024 C-UAS workshop confirmed that EU drone regulations follow EASA''s framework for civilian/dual-use airspace but that military systems operate under separate national rules, creating compliance uncertainty for dual-use systems.

    Privacy and data law: Harmattan''s privacy policy (November 2025) states personal data may be transferred outside the EEA under Standard Contractual Clauses. ISR drone field-collected imagery data governance under national-security exceptions has not been publicly addressed.'
