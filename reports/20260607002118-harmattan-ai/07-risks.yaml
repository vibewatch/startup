- id: section-partner-dependency
  title: Partner, customer, and dependency risks
  body: 'Harmattan AI''s commercial and strategic position is structurally dependent on a small number of counterparties, creating high bilateral concentration risk.

    Dassault Aviation as lead investor creates dual-loyalty tension: Dassault is simultaneously Series B lead investor, strategic partner, and potential future customer for embedded AI in Rafale F5 and UCAS platforms. If the relationship deteriorates — through commercial disagreements, IP disputes, or Dassault acquiring competing AI capability — Harmattan loses a capital source, a partnership narrative, and an anchor contract simultaneously. Defense News noted that Dassault CEO Trappier has stated France could develop a next-generation fighter "on its own if necessary." Harmattan''s CTO wrote at the Series B that "the international order is going off the rails" — language that could complicate US or Gulf market development.

    Customer concentration: All disclosed revenue-generating customers are government entities — French MoD and UK MoD only. Zero diversification into other NATO governments, non-NATO allies, or commercial segments has been publicly confirmed as of June 2026. No delivery failures or contract performance issues under either program have been publicly reported, but the concentration in two customers remains a structural risk.

    Skyeton (Ukrainian) dependency: The October 2025 Skyeton Raybird partnership integrating Harmattan''s Sahara SAR creates geopolitical sensitivity. Skyeton''s operations could be disrupted by Russian strikes on Ukrainian industrial facilities. Re-exporting Harmattan-equipped Raybirds to third countries adds export licensing complications.

    Technology partner concentration: Lynred (IR sensor) represents a sole-source dependency for the SORONA sensor stack. BCG''s 2026 C-UAS whitepaper highlighted limited industrial scale across the European C-UAS supply chain, making supplier substitution difficult and costly.'
