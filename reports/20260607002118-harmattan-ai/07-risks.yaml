- id: section-people-execution
  title: People, governance, and execution risks
  body: 'Harmattan AI has grown to approximately 130 employees in under two years, with a claimed median experience of 15 years per Defense News. This unusual density reflects deliberate senior hiring from Safran, Isar Aerospace, and adjacent defense firms. However, key-person concentration is acute: Mouad M''Ghari (CEO) is the sole named executive in all major press releases, investor announcements, and the CEO interview in Le Grand Continent. No CFO, COO, CRO, or head of operations has been publicly named. Martin de Gourcuff (CTO) is referenced only in technical co-founder contexts.

    Governance opacity: No external board composition has been disclosed for Harmattan AI. Dassault Aviation as Series B lead presumably holds a board seat, unconfirmed. FirstMark Capital, Atlantic VC, and Tholus Capital investor board-seat rights are undisclosed. A defense unicorn operating without disclosed board oversight presents elevated governance risk, compounded by the sensitivity of the products. Open roles as of June 2026 include Chief Engineer, Electronic Warfare Team Lead, and System Architect — senior roles that remain unfilled.

    Talent competition: Harmattan competes for AI, EW, and autonomy engineers against Anduril ($61 B valuation, $5 B latest round), Shield AI ($12.7 B, $1.5 B latest round), Helsing (reportedly raising $1.2 B at ~$18 B), and Quantum Systems (€310 M raised). These peers can offer materially larger compensation, more established career paths, and greater operational volume. Helsing''s $600 M round specifically targeted drone manufacturing scale-up for Ukraine, directly competing for EW and AI drone talent.

    Execution burden: Delivering simultaneously on two MoD programs, scaling manufacturing, extending into EW and Rafale F5 AI, managing the Skyeton integration, and exhibiting at Eurosatory 2026 and SOF Week 2026 represents a heavy concurrent execution load for a 130-person company. No project management framework or independent quality-assurance disclosure has been made.'
