  topStrengths:
    - >-
      Two national Ministry of Defence Programs of Record within roughly 18 months of founding provide unusually strong
      early customer validation for a European defense startup.
    - >-
      The Dassault Aviation partnership creates a rare path into Rafale F5 and future UCAS embedded-AI workflows,
      strengthening strategic moat and exit optionality.
    - >-
      Harmattan's vertically integrated stack spans ISR, counter-UAS, strike, and C2, allowing it to sell system-level
      capability rather than a single sensor or airframe.
    - >-
      Product evidence on autonomy architecture, SAR performance, and kinetic interception is detailed and technically
      differentiated for the company's stage.
  topRisks:
    - >-
      No public disclosure of revenue, margins, burn, or unit economics means the $1.4B valuation cannot be
      stress-tested on financial fundamentals.
    - >-
      Supply-chain dependence on Chinese rare-earth inputs and battery chemistry remains unresolved and could delay
      manufacturing scale-up.
    - >-
      Governance remains opaque: board composition, investor rights, and protective provisions are not publicly
      disclosed.
    - >-
      Better-capitalized peers such as Anduril, Helsing, Shield AI, TEKEVER, and specialized C-UAS vendors can pressure
      Harmattan on pricing, talent, and procurement access.
    - >-
      Harmattan's strategic premium depends on flawless delivery and durable scope inside the Dassault / Rafale F5
      relationship; either could disappoint.
  unresolvedGaps:
    - Current revenue, margin structure, and cash runway are not publicly disclosed.
    - Exact Series B investor composition and preference-stack terms remain private.
    - Independent verification of production scale beyond management's thousands-per-month claims is absent.
    - Public detail on Harmattan's precise scope inside Rafale F5 and UCAS AI programs remains limited.
    - Board composition and formal governance rights are not publicly described.
