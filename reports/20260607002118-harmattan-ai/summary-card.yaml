summary:
  headline: >-
    Harmattan AI has assembled unusually strong sovereign-defense proof points for a two-year-old startup—dual MoD
    Programs of Record and a Dassault Rafale F5 partnership—but the lack of public financial disclosure keeps the
    investment case in research-more territory.
