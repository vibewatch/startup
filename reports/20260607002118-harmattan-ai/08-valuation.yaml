- id: TV002
  title: Thesis and anti-thesis table
  columns:
  - Argument
  - Evidence anchor
  - What would change the view
  rows:
  - - Dual national MoD PoRs in 15 months validate product-market fit and delivery capability
    - French MoD (1,000 SORONA drones, July 2025); UK MoD (up to 3,000 systems, September 2025); CEO M'Ghari confirmation
      in Le Grand Continent interview February 2026
    - Failure to fulfill existing PoR commitments on time, or a customer complaint / reliability incident tied to delivered
      systems
  - - Dassault partnership creates replication barrier and Rafale F5 AI mandate
    - Joint press release January 2026; Dassault CEO Eric Trappier public statement; Defense News and TechCrunch coverage
      of Rafale F5 and UCAS AI integration mandate
    - Thales cortAIx or a competing AI supplier formally selected as primary Rafale F5 AI provider, displacing Harmattan from
      the core mandate
  - - 50%+ p.a. European defense market growth reduces execution risk
    - 'BCG May 2026 C-UAS white paper: C-UAS demand projected $5–7B by 2029 at 58%+ CAGR; NATO TIE 26 interoperability exercise
      May 2026 validates pipeline'
    - NATO defense spending retrenchment, diplomatic resolution in Ukraine, or major budget reallocation away from autonomous
      systems
  - - Revenue opacity prevents conviction pricing (anti-thesis)
    - No public financial metrics; private SAS company with no filing obligation; TechCrunch confirmed revenue undisclosed
      at Series B; Reuters noted French drone makers face financing uncertainty despite ambitious revenue targets
    - Harmattan discloses verifiable ARR or contract value totals; or Series C round implies valuation that independently
      validates financial metrics
  - - Supply chain sovereignty remains 3–5 years away for batteries (anti-thesis)
    - 'CEO M''Ghari Le Grand Continent interview February 2026: Chinese rare-earth dependency in brushless motor magnets and
      battery chemistry; sovereign battery solution 3–5 years away; sovereign motor solution expected end 2026'
    - Independent verification of sovereign battery supply chain secured ahead of timeline; or supply chain disruption materializes
      confirming the risk
  - - Governance opacity limits investor protection (anti-thesis)
    - No public board composition disclosure; co-founders control executive decision-making; no governance charter published;
      French SAS structure provides limited public oversight
    - Harmattan discloses board of directors composition, investor rights, or governance charter; or governance failure materializes
      in a press-reported dispute
  notes: Thesis rows cite confirming evidence; anti-thesis rows cite adverse or neutral evidence. View-change conditions are
    the primary trigger watchlist for investment monitoring.
