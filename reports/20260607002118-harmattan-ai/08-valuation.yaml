  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-financials
    missingEvidence: Harmattan AI has disclosed no ARR, gross margin, burn rate, contract value totals, or unit economics
      publicly. All financial model inputs are private and unverifiable.
    whyItMatters: Without revenue data, the $1.4 billion valuation cannot be anchored to a revenue multiple and all scenario
      valuation ranges are speculative rather than evidence-based.
    diligencePath: Series C data room access; management presentation; NDAs with investors; French MoD procurement officer
      reference checks on contract value; Infogreffe filing review.
    relatedQuestionRefs:
    - QV006
    - QV009
  - type: private-evidence-only
    severity: material
    topic: dassault-partnership-scope
    missingEvidence: The specific scope of Harmattan's Rafale F5 AI mandate — whether Harmattan is the primary or one of multiple
      AI suppliers — has not been independently confirmed. Only joint press release language is publicly available.
    whyItMatters: If Harmattan is one of several AI partners (alongside Thales cortAIx) rather than the primary supplier,
      the strategic moat is materially narrower than the thesis implies.
    diligencePath: Direct conversation with Dassault Aviation CEO or VP Programs; French DGA program office; review of any
      additional joint announcements or procurement notices.
    relatedQuestionRefs:
    - QV007
  - type: private-evidence-only
    severity: material
    topic: governance-and-board
    missingEvidence: No public disclosure of board of directors composition, investor representation, voting rights, shareholder
      agreement provisions, or information rights.
    whyItMatters: Investor protection cannot be assessed without governance visibility; key-person concentration on CEO and
      CTO is unmitigated without a disclosed governance structure.
    diligencePath: French company registry (Infogreffe/Registre du commerce) for statutory disclosures; direct request from
      legal counsel; Series C data room.
    relatedQuestionRefs:
