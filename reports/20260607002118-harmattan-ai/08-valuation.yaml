callouts:
- calloutType: strength
  title: $1.4 billion valuation is at the low end of peer band, implying rerating potential
  body: Harmattan AI's $1.4 billion post-money valuation sits below Anduril ($61B), Shield AI ($12.7B), and Helsing (~$18B
    estimated) in the defense-autonomy peer set, even though Harmattan has achieved two national MoD Programs of Record faster
    than any of these peers did at comparable ages. If the Rafale F5 AI mandate is confirmed and revenue metrics are eventually
    disclosed, Harmattan's trajectory warrants a significant re-rating. The current entry is structurally positioned at the
    early phase of what could be a multi-year strategic premium expansion.
  claimRefs:
  - CV017
  - CV018
  - CV019
  - CV023
  - CV024
  - CV025
- calloutType: risk
  title: Revenue opacity is the single most important constraint on conviction
  body: Unlike every other material peer in the comparable set — Anduril ($2.2B ARR disclosed), Quantum Systems (100% revenue
    growth disclosed), TEKEVER (profitable, disclosed) — Harmattan AI has disclosed no financial metrics whatsoever. The $1.4
    billion valuation is therefore priced entirely on strategic premium, contract proof, and market tailwinds. Any financial
    disclosure that fails to meet the implied expectations embedded in that premium creates an immediate risk of multiple
    compression. Investors should treat this opacity as a first-order diligence requirement, not a secondary consideration.
  claimRefs:
  - CV006
  - CV021
  - CV023
  - CV031
  - CV032
  - CV035
