      15 months of founding — an execution velocity that is exceptional in European defense procurement
      and provides sovereign validation that reduces early-stage diligence risk. Combined with the
      Dassault Aviation partnership and French presidential endorsement, the company has demonstrated
      a level of institutional traction that few defense startups reach before their second year.
