  - id: section-leadership
    title: Founders, leadership, and governance
    body: >-
      Harmattan AI was co-founded by four principals. Mouad M'Ghari (CEO) is a graduate of École
      Polytechnique and MIT; he serves as the primary public spokesperson and is referenced in all major
      press releases, the Dassault Aviation announcement, and an extended February 2026 interview with
      Le Grand Continent. Martin de Gourcuff (CTO) co-founded the company alongside M'Ghari and posted
      a notable LinkedIn statement at the time of the Series B reflecting the company's geopolitical
      mission framing. Edouard Rosset is listed as a co-founder in multiple third-party profiles
      including Tech.eu and DefenceJobs.org. Marc Grelet is identified as a co-founder in the
      DefenceJobs.org company profile. Beyond the founding quartet, Defense News reported in January
      2026 that the company had hired executives from established defense firms including Safran and
      Isar Aerospace, broadening the senior talent base.

      The company had more than 130 employees as of January 2026, with a median experience level of
      15 years according to Defense News — a metric that, if accurate, reflects deliberate hiring of
      senior defense and engineering professionals rather than junior talent. The open-roles page lists
      senior roles including Chief Engineer, System Architect, Group Leads, and Electronic Warfare Team
      Lead, consistent with a growing mid-stage engineering organization.

      Governance remains a diligence gap. No public disclosure describes the board of directors'
      composition, investor board-seat rights, or governance mechanics. The company has not filed publicly
      as a regulated issuer. The four co-founders appear to control executive decision-making without a
      publicly declared external board oversight structure, which creates key-person concentration risk
      centered on CEO M'Ghari and CTO de Gourcuff. Harmattan's privacy policy and terms-of-use documents
      confirm that French law governs all disputes, with CMAP arbitration for business disputes and court
      access for consumers, but no separate governance charter or articles of association have been
      released publicly.
