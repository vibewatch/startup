      CEO M'Ghari explicitly confirmed in a February 2026 interview that brushless electric motor magnets
      and battery chemistry still depend on Chinese-controlled rare-earth supply chains. Sovereign motor
      solutions are expected to arrive by end 2026; battery-chemistry sovereignty is 3–5 years away.
      For a company whose value proposition is built on sovereign, scalable production, this dependency
      is a material operational and geopolitical risk that should anchor supply-chain diligence.
    claimRefs:
      - CO031
      - CO036
      - CO040
  - calloutType: insight
    title: Dassault partnership extends Harmattan from drone maker to Rafale F5 AI ecosystem
    body: >-
      The Series B is not simply a financing event — it places Harmattan's autonomy software inside
      France's flagship next-generation combat aviation program. The Rafale F5 standard is expected
      around 2030 and will require embedded AI for drone-wingman coordination under the FCAS alternative
      approach. Harmattan is now positioned as the sovereign AI engine for both near-term attritable
      drone production and medium-term crewed/uncrewed teaming, a dual-mandate that justifies the $1.4B
      valuation but also creates execution risk from span of scope.
    claimRefs:
      - CO021
      - CO022
      - CO025
      - CO038

