        co-investor identities; pro-rata rights, anti-dilution provisions, and liquidation preferences.
      whyItMatters: >-
        Without a verified cap table, economic ownership and control percentages for all investors
        including Dassault Aviation cannot be assessed; liquidation preferences affect exit economics.
