  - id: section-funding
    title: Funding history, investors, and valuation
    body: >-
      Harmattan AI's capital story is unusually compressed. The company raised a seed round led by
      Atlantic VC at an undisclosed amount, followed by a Series A of approximately $30 million led by
      FirstMark Capital with Atlantic VC and Tholus Capital participating. TechCrunch reported that
      total pre-Series B funding was approximately $42 million, consistent with a $12 million seed
      followed by the $30 million Series A; Motier Ventures and Sisyphus Ventures are also cited among
      early backers. The DefenceJobs.org profile independently lists Dassault Aviation, FirstMark Capital,
      Atlantic VC, Motier Ventures, and Tholus Capital as Harmattan's investors, corroborating the
      multi-investor syndicate structure.

      On January 12, 2026, Dassault Aviation led a $200 million Series B, bringing the post-money
      valuation to $1.4 billion — a figure reported by Defense News, TechCrunch, Tech.eu, and
      AirForce-Technology.com and confirmed in Harmattan's own press release. The round was announced
      alongside a strategic partnership for Dassault, with Motier Ventures renewing its investment.
      The company stated the Series B valuation "significantly increases" from the Series A, but the
      Series A post-money valuation was not publicly disclosed. The precise size of Dassault Aviation's
      individual tranche and the identities of other Series B co-investors were not disclosed at the
      time of announcement.

      French President Emmanuel Macron praised the announcement on X, calling Harmattan "France's newest
      unicorn" and framing the deal as "excellent news for our strategic autonomy." TechCrunch noted a
      positioning shift: the company formerly described itself as "a European Anduril" before the Dassault
      partnership prompted a rebranding to "defense technology company." Total lifetime capital raised
      through January 2026 is estimated at approximately $242 million ($42 million pre-Series B plus
      $200 million Series B), though this is an estimate based on public reporting rather than a verified
      capitalization table.
