  - id: section-milestones
    title: Programs of record, partnerships, and scale milestones
    body: >-
      Harmattan AI's commercial execution record is its most differentiated characteristic relative to
      peers at a comparable funding stage. In July 2025 — approximately 15 months after founding — the
      company was awarded its first Program of Record: a multi-million-dollar contract from a NATO
      government (France) for AI-enabled small drones. Army Recognition reported the contract as 1,000
      SORONA quadcopter drones for the French Armed Forces, with deliveries scheduled by end of 2025,
      designed to support operational training ahead of the Orion 2026 multinational exercise. The drone
      weighs under 1.8 kg, has a 40-minute endurance, 2 km range, and carries EO and optional IR cameras
      (infrared sensor supplied by French firm Lynred).

      In September 2025, the UK Ministry of Defence awarded Harmattan a second Program of Record for
      delivery of up to 3,000 autonomous systems for "urgent operational needs" — constituting two
      national Ministry of Defence Programs of Record in less than 18 months of existence. CEO M'Ghari
      confirmed in a February 2026 Le Grand Continent interview that the French MoD order was fulfilled
      in 14 months from founding, the UK MoD in 15 months, and an unspecified Estonian partner order
      was completed within 7 months. On October 2, 2025, the company announced a strategic partnership
      with Ukrainian UAS maker Skyeton to integrate Harmattan's Sahara SAR payload and embedded AI into
      the Raybird platform (350,000+ combat flight hours), targeting French and wider NATO markets.

      The Dassault Aviation Series B partnership is the capstone milestone, formally linking Harmattan's
      technology to the Rafale F5 standard (targeting ~2030) and future UCAS programs. The company
      exhibited at UMEX 2026 (Abu Dhabi, January 2026), World Defense Show 2026 (Riyadh, February 2026),
      SOF Week 2026 (Tampa, May 2026), and will exhibit at Eurosatory 2026 (Paris, June 2026), signaling
      an active international market development posture. The company claims "thousands of systems per
      month" production capacity, though this figure has not been independently verified and a DroneXL
      analysis cited plans for up to 10,000 drones monthly — also unverified. CEO M'Ghari highlighted
      in the Le Grand Continent interview that supply chain sovereignty for brushless motor magnets and
      battery chemistry remains a material challenge, with Chinese rare-earth dependencies expected to
      persist for 3–5 years for batteries.
