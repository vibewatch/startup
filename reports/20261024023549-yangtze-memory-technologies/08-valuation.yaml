chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a strategically important, technically differentiated NAND manufacturer, but it does not support underwriting a precise entry value because audited earnings, cash generation, capital structure, and final IPO terms remain opaque. The appropriate stance is track/research-more until those disclosures and the proposed listing price are available.
sections:
  - id: investment-judgment
    title: Investment judgment and price discipline
    body: >-
      YMTC has a credible strategic and technology case, but the investable conclusion is
      constrained by disclosure quality. Tech in Asia reported that sources said YMTC was
      considering a mainland IPO as early as 2026 at a potential valuation of 200–300 billion
      yuan, while also warning that the plans were at an early stage and could change. That is
      a financing signal, not a completed transaction or a verified market clearing price.
      TrendForce's retained account reports a 161 billion yuan valuation tied to a December
      2023 investment, alongside a 1.6 billion yuan investment and an 84 million yuan loss in
      the first nine months of 2024. These marks are not directly comparable without a cap table,
      security terms, and audited statements. Accordingly, the recommendation is track, with
      low-to-medium confidence, rather than buy: price discovery should wait for audited
      financials, offering terms, dilution, preferences, and a transparent use-of-proceeds plan.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis versus anti-thesis
    body: >-
      The positive thesis rests on a real manufacturing platform and differentiated process
      architecture. YMTC's own technical page describes mass production of 3D NAND products
      based on Xtacking, while the retained company-profile source describes an IDM model
      spanning design, manufacturing, packaging, testing, and system solutions. The opposing
      case is that IDM economics make execution and capital intensity unusually important:
      TrendForce's account says YMTC spent 5 billion yuan on R&D in 2023 and 6 billion yuan in
      2024, and links the 2024 loss to restricted equipment access, delayed expansion, and a
      market downturn. The same account says public sources share no revenue or margin figures.
      Export restrictions and dependence on difficult-to-replace equipment can therefore reduce
      both growth and valuation multiples. The thesis improves if audited margins and cash
      conversion demonstrate scale economics; it breaks if expansion requires repeated external
      capital while profitability remains cyclical or inaccessible.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario valuation and comparable context
    body: >-
      A conventional revenue multiple cannot be responsibly applied to YMTC from the retained
      public record because revenue, margin, debt, cash, and share-count data are not disclosed
      in a comparable audited format. The scenario table therefore uses the reported 161 billion
      yuan transaction-linked mark and the 200–300 billion yuan IPO discussion only as reference
      points, not as fair values. Hurun's 2025 index is useful context for private-market
      valuation risk: it says 143 unicorns saw valuation cuts, 52 fell below the 1 billion
      dollar threshold, and that private valuations are fluid. Micron data from Yahoo Finance
      and the SK hynix filing page provide public memory-company market and disclosure context,
      but their scale, listing status, product mix, and accounting are not directly comparable
      to a private Chinese NAND IDM. Any entry decision should be conditioned on a verified
      bridge from capacity and pricing to revenue, gross margin, free cash flow, dilution, and
      exit liquidity.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
  - id: exit-and-diligence
    title: Exit readiness and thesis-break triggers
    body: >-
      The reported IPO pathway may improve liquidity, but it is not yet an exit underwritten by
      public evidence. Tech in Asia describes the IPO as an early-stage consideration, and the
      Baike profile reports later IPO-guidance and exchange-acceptance milestones; those
      statements should be verified against the issuer and exchange filings before treating them
      as binding. The core diligence package is an audited multi-year income statement, balance
      sheet, cash-flow statement, debt schedule, cap table, preference stack, customer and
      product mix, wafer starts and yields, equipment sourcing, export-compliance controls, and
      IPO prospectus. Monitorable thesis-break triggers are a materially lower verified yield or
      utilization trend, a down-round or offering price below the 161 billion yuan reference,
      inability to fund planned capacity without punitive dilution, adverse sanctions or
      litigation outcomes, or evidence that the 2024 loss pattern persists after expansion.
      Until those checks clear, the rational action is track/research-more rather than pay a
      strategic premium for an unverified earnings trajectory.
    claimRefs: [CV013, CV014, CV015, CV016]
    evidenceGaps:
      - type: missing-source
        severity: blocking
        topic: audited-financials
        missingEvidence: Audited revenue, gross margin, operating cash flow, debt, capex, and cash balances for multiple periods.
        whyItMatters: Without comparable financial statements, neither a revenue multiple nor a cash-flow valuation can be tested against the proposed price.
        diligencePath: Obtain the IPO prospectus or audited financial package and reconcile reported capacity, pricing, yields, capex, and working capital.
        relatedQuestionRefs: [QV001, QV002, QV006]
      - type: missing-source
        severity: material
        topic: capitalization
        missingEvidence: Fully diluted cap table, security classes, preference rights, and dilution from the proposed listing.
        whyItMatters: Transaction-linked valuation marks may not represent common-equity value or investor proceeds.
        diligencePath: Review the latest financing documents, shareholder agreement, and IPO capitalization table with legal counsel.
        relatedQuestionRefs: [QV003, QV005]
      - type: missing-source
        severity: material
        topic: exit
        missingEvidence: Binding exchange filings confirming IPO status, offering range, timetable, lock-ups, and secondary liquidity.
        whyItMatters: An early-stage IPO discussion is not an executable exit and may change materially before pricing.
        diligencePath: Verify current Shanghai Stock Exchange and issuer filings and obtain the final prospectus when published.
        relatedQuestionRefs: [QV004, QV008]
callouts:
  - calloutType: recommendation
    title: Track, not a price-insensitive buy
    body: The technology and strategic position are credible, but a 2026 entry should be considered only after audited financials, capitalization terms, and a binding IPO or secondary price are available.
    claimRefs: [CV001, CV003, CV013, CV016]
  - calloutType: risk
    title: Disclosure and capital-intensity risk dominate
    body: Reported losses, heavy R&D, export restrictions, and the absence of public margin data create too much uncertainty for a precise fair-value conclusion.
    claimRefs: [CV006, CV007, CV008, CV012]
