evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited consolidated financial statements with revenue, gross margin, cash, debt, capex, and customer
      concentration.
    whyItMatters: >-
      The scale and market-share evidence cannot be translated into profitability, liquidity, or valuation without
      denominators and audited accounts.
    diligencePath: Review the IPO tutoring filings, prospectus drafts, and audited statements when publicly released.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current shareholder agreement, board charter, voting rights, and related-party transaction disclosures.
    whyItMatters: >-
      State-backed ownership and a combined chairman/CEO role may create control and key-person risks that the public
      roster does not resolve.
    diligencePath: Obtain current statutory filings and IPO due-diligence materials.
    relatedQuestionRefs:
      - QO002
      - QO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership-roster-TO002
    missingEvidence: A complete current statutory leadership and supervisory roster for the TO002 enumeration.
    whyItMatters: The partial public roster cannot establish current role continuity, decision rights, or key-person dependence.
    diligencePath: Obtain the current corporate registry extract and IPO governance disclosures.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map-TO003
    missingEvidence: A complete current shareholder, capital-provider, and supplier stakeholder register for the TO003 enumeration.
    whyItMatters: >-
      Partial stakeholder visibility limits assessment of control, dilution, financing dependence, and supply-chain
      concentration.
    diligencePath: Obtain the current shareholder register, financing agreements, and material supplier disclosures.
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated, primary headcount disclosure that reconciles approximately 8,000 employees in 2023 with 9,147 in 2025.
    whyItMatters: Headcount is a scale indicator, but the differing vintages and source quality make trend interpretation unsafe.
    diligencePath: Reconcile employee counts against audited reporting, social-insurance records, or IPO filings.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: >-
      Primary U.S. and Chinese regulatory records clarifying the current scope of export controls and 1260H-list
      consequences.
    whyItMatters: >-
      List removal and continuing restrictions can coexist; the operational effect on tools, customers, and financing is
      decision-critical.
    diligencePath: Review the relevant Federal Register, BIS, DoD, and company compliance disclosures.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: Public, audited YMTC revenue by end market, wafer output, utilization, and customer concentration.
    whyItMatters: Global market size and share data do not establish YMTC's obtainable market or durable revenue.
    diligencePath: >-
      Request audited financial statements, production schedules, customer concentration, and qualified design-win data
      under NDA.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: A single market-share series with a consistent revenue or shipment denominator and quarter definition.
    whyItMatters: The 13% Q1 2026 and 11.8% 2025 figures cannot be compared as a simple growth bridge.
    diligencePath: Obtain the underlying Counterpoint and TrendForce tables and reconcile revenue, shipment, and period definitions.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Audited competitor-normalized pricing, gross margin, yield, endurance, qualification win rate, and customer
      concentration by product family.
    whyItMatters: >-
      Without these inputs, reported share and layer-count progress cannot establish whether YMTC earns durable returns
      or merely expands subsidized capacity.
    diligencePath: >-
      Request product-level unit economics, customer qualification cohorts, yield and reliability data, and realized
      contract pricing under confidentiality.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: conflicting-data
    severity: material
    topic: NAND-market
    missingEvidence: >-
      A current market-share series using one provider's consistent definition of revenue, shipments, period, and
      manufacturer grouping.
    whyItMatters: >-
      TrendForce, MemoryMarket, and TechNode use different periods and may use different group or shipment definitions,
      so their percentages should not be treated as a single time series.
    diligencePath: >-
      Obtain the underlying analyst methodology and a quarterly YMTC share series reconciled to Samsung, SK
      hynix/Solidigm, Kioxia, Micron, and SanDisk.
    relatedQuestionRefs:
      - QP002
      - QP007
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: blocking
    topic: financial-statements
    missingEvidence: >-
      Audited, entity-scoped income statements, balance sheets, cash-flow statements, and notes for the latest two
      fiscal years.
    whyItMatters: >-
      Secondary figures vary by period and apparent reporting perimeter, preventing a reliable profitability or solvency
      assessment.
    diligencePath: >-
      Request audited statements and the accepted IPO filing, then map every reported value to the correct legal entity
      and period.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Product-level shipments, list and realized ASPs, rebates, returns, contract duration, and revenue-recognition
      terms.
    whyItMatters: Capacity and product breadth do not establish revenue quality, pricing power, or customer concentration.
    diligencePath: Obtain monthly product and customer revenue cohorts reconciled to audited revenue.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Fab utilization, good-bit yield, cost per good bit, product gross margin, inventory turns, and working-capital
      requirements.
    whyItMatters: These inputs determine whether added capacity improves gross profit or magnifies fixed-cost and inventory risk.
    diligencePath: Review fab KPI packs, product P&Ls, inventory aging, and yield bridges by quarter.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
  - type: stale
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, debt and maturity schedule, committed capex, burn, downside runway, and next-financing
      trigger.
    whyItMatters: Registered capital and valuation references do not show liquidity available to fund a capital-intensive expansion.
    diligencePath: >-
      Request the latest treasury schedule, debt agreements, capex plan, shareholder funding commitments, and board
      downside case.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Independent yield, wafer-sort, field-failure, endurance, uptime and return-rate data by product generation.
    whyItMatters: >-
      Product qualification and layer-count claims do not establish system reliability or manufacturing consistency at
      commercial scale.
    diligencePath: >-
      Request generation-level yield, RMA, endurance and service-level data under confidentiality, then reconcile it to
      customer qualification records.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public practitioner-community or developer-signal dataset covering YMTC software, firmware, API or integration
      activity.
    whyItMatters: >-
      The company is a hardware IDM, so conventional repository or package-download signals may not exist; without a
      proxy, ecosystem depth cannot be assessed.
    diligencePath: >-
      Obtain channel, controller-firmware, OEM-integration and field-support evidence from named customers, module
      partners and industry practitioners.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: access-blocked
    severity: minor
    topic: roadmap
    missingEvidence: >-
      Primary technical specifications, benchmark conditions and qualification documentation for current Xtacking 4.0
      and fifth-generation products.
    whyItMatters: >-
      Public descriptions mix company roadmap claims with independent teardowns of earlier samples, limiting
      current-generation comparability.
    diligencePath: >-
      Request datasheets, process-generation mapping, benchmark methodology and customer qualification status for each
      currently shipped SKU.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Customer-level shipment history, contract duration, reorder history, renewal, churn, and gross or net retention
      metrics.
    whyItMatters: >-
      Without denominator-based durability evidence, a tested shipment and a reported qualification cannot establish
      recurring demand or customer lifetime value.
    diligencePath: >-
      Request a signed customer schedule and cohort bridge covering the last 24 months, separating pilot, qualification,
      production, renewal, and churn.
    relatedQuestionRefs:
      - QU003
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: concentration
    missingEvidence: >-
      A complete list of production customers, prospects, geographies, SKUs, and the share of shipments or revenue
      represented by each.
    whyItMatters: >-
      The public record may overrepresent highly visible qualification events and cannot quantify OEM or channel
      dependence.
    diligencePath: >-
      Obtain a customer concentration report reconciled to shipments and revenue, with export-control and geography
      annotations.
    relatedQuestionRefs:
      - QU008
      - QU009
    relatedTableRefs:
