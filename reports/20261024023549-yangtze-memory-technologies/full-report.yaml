  - id: FE001
    title: YMTC product architecture map
    type: stack
    summary: >-
      YMTC's reported product stack links memory-cell fabrication, Xtacking logic integration, packaging and end-use
      storage products.
    data:
      layers:
        - label: End-use products
          detail: Finished storage products and embedded products sold into device and infrastructure workflows.
          items:
            - name: Enterprise and consumer SSDs
              detail: Finished storage products for servers, data centers, PCs and gaming.
            - name: Embedded eMMC/UFS
              detail: Embedded storage products for mobile and other devices.
        - label: Package and system integration
          detail: Packages NAND dies into usable memory products; public controller and firmware detail is limited.
          items:
            - name: Package and controller
              detail: Packages NAND dies into usable memory products; public controller and firmware detail is limited.
        - label: Xtacking integration
          detail: Connects CMOS logic and memory-cell wafers through the reported Xtacking process.
          items:
            - name: Wafer bonding
              detail: CMOS logic wafer bonded to the memory-cell wafer.
            - name: Xtacking 3.0 features
              detail: >-
                BSSC and center-X-decoder are described by TechInsights as reported design changes, but were not found
                in sampled TiPlus7100 units.
        - label: Semiconductor fabrication
          detail: Produces the logic wafer and layered non-volatile memory array.
          items:
            - name: CMOS logic wafer
              detail: Peripheral logic and I/O functions.
            - name: 3D NAND cell wafer
              detail: Layered non-volatile memory array.
        - label: Operating dependencies
          detail: Requires fabs, equipment, process materials, spare parts and qualified suppliers.
          items:
            - name: Fab equipment and suppliers
              detail: Domestic and foreign equipment, spare parts, process materials and Wuhan fab capacity.
            - name: Process qualification
              detail: Requires customer validation and consistent yield across product generations.
        - label: Quality and support
          detail: Requires qualification, reliability testing, field support and customer service.
          items:
            - name: Reliability and support controls
              detail: Public uptime, failure-rate, endurance and service-level evidence remains limited.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: Customer journey from qualification to expansion
    type: journey-map
    summary: >-
      Public evidence shows a staged path from segment targeting and technical evaluation to selective OEM shipment,
      with policy and geography limiting expansion visibility.
    data:
      items:
        - label: Segment targeting
          touchpoints:
            - Mobile, PC, data-center, enterprise, and consumer-electronics applications
          detail: Company-described use-case breadth; customer names and live-account counts are not disclosed.
        - label: Technical qualification
          touchpoints:
            - Apple testing and verification reported before production use was halted
          detail: Qualification is not equivalent to paid production adoption.
        - label: Selective OEM shipment
          touchpoints:
            - Lenovo ThinkBook 14 G9 configuration sold in Germany
          detail: Independent review evidence; Lenovo excluded U.S. configurations.
        - label: Expansion loop
          touchpoints:
            - Additional geographies, SKUs, and repeat orders remain unverified
          detail: Requires customer-level shipment, contract, and retention evidence.
        - label: Retention proof
          touchpoints:
            - Renewal, repeat purchase, churn, and cohort data are not disclosed
          detail: Durability remains an evidence gap rather than an inferred outcome.
        - label: Concentration review
          touchpoints:
            - Customer-level shipment and revenue schedule needed
          detail: No public denominator supports concentration quantification.
