chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating platform
        blocks:
          - type: paragraph
            body: >-
              YMTC is identified across the retained sources as a Wuhan, Hubei semiconductor integrated device
              manufacturer focused on NAND flash. The product set spans 3D NAND wafers and packaged chips, embedded
              memory solutions, and consumer and enterprise solid-state drives. Its own ZhiTai brand and the Xtacking
              architecture extend the platform beyond a single commodity die: the company combines design,
              manufacturing, packaging, testing, and system solutions. This vertically integrated footprint is
              strategically useful in a market where process know-how, yield, and access to equipment matter as much as
              product labels. The public record nevertheless mixes current market reporting with company-profile and
              encyclopedia material, so employee, capital, and product-scale figures should be treated as dated or
              externally reported rather than audited company disclosures.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO012
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              The available record points to a state-backed capital base and concentrated executive responsibility.
              Wikipedia identifies Chen Nanxiang as chairman and CEO, while the company-profile source lists him as
              chairman and general manager and names a wider director and supervisory roster. The retained Shanghai
              reporting says YMTC has no controlling shareholder and that state-owned entities are its main investors;
              its largest shareholder was reported as Hubei Changsheng Development at 26.5% in the May 2026 pre-IPO
              account. A separate profile reports approximately US$24 billion of total investment at founding, but that
              is not the same as cash currently available or audited paid-in capital. The IPO tutoring process adds a
              potential disclosure catalyst, yet the public sources do not establish board authority, voting rights,
              debt, cash, or related-party controls in enough detail to underwrite governance quality.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO011
              - CO016
      - number: '1.3'
        title: Milestones and current position
        blocks:
          - type: paragraph
            body: >-
              YMTC's development path is unusually legible at the technology and capacity level: the retained chronology
              runs from the 2014 3D NAND R&D project and 2016 incorporation through first domestic 3D NAND production,
              Xtacking mass production, embedded-memory shipments, a ZhiTai SSD launch, 294-layer fifth-generation NAND
              shipments, and 2026 capacity and IPO milestones. Current market evidence is directionally strong but not
              fully consistent: Reuters reported 11.8% global NAND market share for the prior year and a target above
              14% by early 2027, while a Q1 2026 market account reported 13% revenue share and nearly 445%
              year-over-year revenue growth. These figures are market-source estimates, not audited YMTC revenue or
              shipment disclosures. The key adverse context is continued export-control and compliance exposure even
              after a 2026 report that YMTC was removed from the 1260H list.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO008
              - CO011
              - CO013
              - CO015
              - CO016
      - number: '1.4'
        title: Evidence boundaries and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The company is commercially material enough to have a meaningful production, supplier, customer, and IPO
              evidence trail, but the retained pool does not establish a complete financial or governance picture. The
              most decision-relevant gaps are audited revenue and margin, cash and debt, capex funding, customer
              concentration, yield by generation, and the practical effect of U.S. restrictions on tools and end-market
              access. The 2026 pre-IPO process may improve disclosure, but it should not be treated as proof that a
              listing will complete or that proceeds are available. Until those gaps close, YMTC is best characterized
              as a strategically important and increasingly scaled private manufacturer with high execution and policy
              sensitivity.
            claimRefs:
              - CO017
              - CO018
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaled, vertically integrated platform
            body: >-
              YMTC combines NAND design, manufacturing, packaging, testing, embedded-memory products, and SSD brands,
              with a market account reporting a 13% Q1 2026 NAND revenue share.
            calloutType: strength
            claimRefs:
              - CO002
              - CO014
          - type: callout
            title: Disclosure and policy risk remain material
            body: >-
              IPO preparation may improve transparency, but audited financials, governance rights, equipment dependence,
              and the practical effect of export restrictions remain open diligence items.
            calloutType: risk
            claimRefs:
              - CO017
