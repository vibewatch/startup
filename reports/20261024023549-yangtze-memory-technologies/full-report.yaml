              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI007
              - CI008
      - number: '4.2'
        title: Operating traction and unit-economics evidence
        blocks:
          - type: paragraph
            body: >-
              Production capacity is the clearest current operating proxy. Reuters reported in May 2026 that two
              factories had combined monthly output of 200,000 wafers and that a third factory was expected to add
              capacity by 2027. Capacity does not establish utilization, good-die yield, bit output, revenue, or gross
              profit. Bamboo Works separately reported that domestic equipment had not yet achieved the high yields
              needed for cost-effective production. Public profitability figures also fail to reconcile: Bamboo Works
              cited a 2023 parent profit and a loss for the first nine months of 2024, while later Yicai and Baidu pages
              reported sharply different figures for other periods without enough entity-scope detail to bridge them.
              Those values are signals to verify, not a continuous earnings series.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Capital intensity and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Expansion remains financing-intensive. TrendForce reported a Phase III venture with RMB 20.72 billion of
              registered capital and YMTC ownership of 50.2%, while Reuters described continued factory additions.
              Bamboo Works reported a shareholding restructuring with 16 institutional investors and calculated an
              implied RMB 161.6 billion parent valuation from one investor's contribution. These are ownership,
              registered-capital, and transaction-reference figures; none equals unrestricted cash or demonstrates
              runway. A later research post relayed a much higher possible internal IPO valuation target, but that is
              neither a completed financing nor corroborated equity value. The retained sources do not disclose cash on
              hand, debt maturities, committed capex, working capital, burn, or the next external-funding trigger.
            claimRefs:
              - CI006
              - CI007
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The supportable conclusion is scale without underwritable financial quality. YMTC has multiple product
              channels and large reported wafer capacity, but public evidence cannot separate shipment growth from
              price, mix, yield, or subsidy effects. As a disclosure benchmark rather than a direct operating
              comparison, Yahoo Finance exposes revenue, margin, cash, and free-cash-flow fields for public peer Micron;
              equivalent reconciled fields are absent for YMTC in this source set. An investment case should therefore
              remain conditional on audited entity-scoped statements, a product and customer revenue bridge, realized
              ASPs, yield and cost-per-bit data, gross margin by fab, and a cash-to-capex schedule. Reported valuation
              references should not be used before those records resolve the conflicting earnings evidence.
            claimRefs:
              - CI004
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public earnings figures do not reconcile
            body: >-
              Different secondary and tertiary sources report results for different periods and apparently different
              entity scopes. They cannot support a trend line until matched to audited filings and the correct reporting
              perimeter.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: callout
            title: Underwrite cash and yield before valuation
            body: >-
              Treat registered capital, IPO preparation, and valuation references as financing signals only; require
              audited cash, debt, capex, utilization, yield, ASP, and margin records before assigning an equity value.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Publicly fetched sources describe YMTC as an integrated device manufacturer focused on the design and
              manufacturing of 3D NAND flash memory and advanced memory solutions. Its portfolio spans NAND wafers and
              dies, embedded memory, and consumer- and enterprise-grade solid-state drives, so the customer workflow
              runs from chip qualification and module integration through storage deployment rather than a single
              software subscription. The official company profile says the Gen2 Xtacking product entered mass production
              in 2019 and that X2-6070 was a Gen3 QLC part with high density, I/O speed and capacity at launch.
              Independent reporting places YMTC memory in the Xiaomi 14 supply chain, while the company also sells
              through storage and device manufacturers. This supports real product qualification, but it does not
              establish retention, realized pricing, or a complete customer list.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE007
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE012
      - number: '5.2'
        title: Architecture, maturity and differentiation
        blocks:
          - type: paragraph
            body: >-
              Xtacking is the core architectural differentiation: TechInsights describes wafer bonding of a CMOS wafer
              and a memory-cell wafer, separating logic fabrication from the NAND array. The cited technical analysis
              attributes higher cell efficiency and shorter development time to the first generation, nickel silicide
              and improved I/O performance to the second, and back-side source connect plus center-X-decoder changes to
              the third. The same teardown is an important counterweight to marketing claims: sampled TiPlus7100 drives
              contained 128-layer dies and did not show the expected Xtacking 3.0 features, even though the announced
              architecture was associated with a 232-layer design. Reuters later reported analysts viewed Xtacking 4.0
              as comparable with sector leaders, but that is analyst commentary rather than a disclosed benchmark.
              Maturity should therefore be assessed by shipped part, customer qualification and independent teardown,
              not layer count alone.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE010
              - CE011
      - number: '5.3'
        title: Deployment, dependencies and technical risk
        blocks:
          - type: paragraph
            body: >-
              YMTC's operating model is manufacturing-intensive and geographically concentrated. Reuters reported two
              existing fabs with combined capacity of 200,000 wafers per month, a third Wuhan fab expected to reach
              50,000 wafers per month by 2027, and plans for two more fabs; more than half of equipment for the third
              fab had reportedly been sourced domestically. The same report says YMTC has intensified local-supplier
              collaboration since its addition to the U.S. Entity List in 2022, while another Reuters report says export
              restrictions curtailed access to foreign chipmaking tools and pushed greater use of domestic suppliers. A
              Caixin-sourced report syndicated by KuCoin says planned IPO proceeds are intended for production-line
              upgrades and next-generation storage technology development, reinforcing the capital dependence of the
              product roadmap without proving execution. These facts make equipment availability, process yield, spare
              parts and qualification continuity material dependencies. The evidence does not disclose uptime, yield,
              failure rates, security controls, product support SLAs, or a public developer ecosystem. Those omissions
              are not evidence of failure; they are diligence gaps that limit confidence in reliability and roadmap
              execution.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated architecture with commercial reach
            body: >-
              Xtacking is not merely a laboratory concept: official materials report mass production, and external
              reporting ties YMTC NAND to smartphone and SSD products.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE005
          - type: callout
            title: Independent maturity proof remains uneven
            body: >-
              TechInsights' teardown of sampled TiPlus7100 drives found 128-layer dies and no Xtacking 3.0 features, so
              roadmap claims should be reconciled to shipped part numbers and independent tests.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
          - type: callout
            title: Developer-signal limitation
            body: >-
              YMTC is a hardware manufacturer without a conventional public software developer surface; public technical
              analysis and supply-chain reporting are used as practitioner proxies, while software ecosystem traction
              remains unverified.
            calloutType: assumption
            claimRefs:
              - CE005
              - CE007
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and adoption surfaces
        blocks:
          - type: paragraph
            body: >-
              YMTC's own 2018 materials positioned its NAND solutions across mobile devices, computing, data centers,
              and consumer electronics, with the Xtacking architecture described as enabling customized solutions for
              those applications. That is a segment map and product ambition, not evidence of paid adoption. The
              clearest current external deployment evidence is Notebookcheck's test of a 512 GB YMTC NVMe PCIe 4.0 SSD
              inside a Lenovo ThinkBook 14 G9 configuration sold in Germany; Lenovo clarified that U.S. configurations
              continued to use non-YMTC SSDs. This supports a real OEM shipment in at least one European configuration,
              while also showing geographic scope is narrower than a global Lenovo deployment. Earlier Apple
              qualification reporting is stronger evidence of technical and procurement evaluation than of revenue:
              Apple reportedly completed testing but did not put YMTC chips into iPhone production. Customer evidence
              therefore supports a staged path from qualification to selected OEM shipment, not broad customer
              penetration.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.2'
        title: Adoption proof and durability
        blocks:
          - type: paragraph
            body: >-
              Public sources do not disclose YMTC's customer count, active installed base, shipment volumes by customer,
              renewal behavior, gross or net retention, churn, contract duration, or customer-level revenue. The
              available proof is event-based: a German Lenovo SKU was tested and shipped with a YMTC SSD, while Apple
              reportedly verified products but halted planned use under export-control pressure. The two events have
              different evidentiary weight and should not be merged into a conversion funnel. Notebookcheck measured
              3,950 MB/s sequential read and 2,514 MB/s sequential write for the tested drive and characterized
              performance as below average for an office laptop but adequate for use; that is a product outcome, not a
              customer-retention metric. The absence of disclosed denominator data makes durability and repeat-purchase
              claims unresolved.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              YMTC's commercial expansion appears to depend on winning qualification and supply-chain placement under
              changing policy and memory-cycle conditions. The Lenovo evidence indicates a path into an OEM design or
              SKU, but the restriction to German models limits what can be inferred about worldwide scale. The Apple
              episode shows that even completed product verification can fail to convert into production when export
              controls and political scrutiny change the buyer's risk calculus. Current reporting also says Chinese
              memory makers' expansions will mainly serve local demand, and describes YMTC's growth as benefiting from
              policy-driven localization; this suggests domestic demand and policy support may be strategically
              important, but does not establish customer concentration percentages. The key diligence need is a
              customer-by-customer shipment, qualification, geography, and contract schedule that separates production
              from pilot and identifies any single OEM or channel dependency.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real but bounded OEM proof
            body: >-
              The German Lenovo configuration is stronger than a logo or marketing reference because an independent
              reviewer tested the shipped SSD, but it does not establish global Lenovo penetration.
            calloutType: strength
            claimRefs:
              - CU002
              - CU005
          - type: callout
            title: Qualification-to-production conversion risk
            body: >-
              Apple reportedly verified YMTC products yet halted planned production use after tighter export controls,
              demonstrating that geopolitical procurement risk can interrupt a technically qualified customer path.
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU010
          - type: callout
            title: Request customer-level operating proof
            body: >-
              Obtain a dated customer schedule showing production versus pilot status, SKU and geography, shipment
              units, contract duration, repeat orders, and concentration by customer and channel.
            calloutType: recommendation
            claimRefs:
              - CU009
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk is structural rather than a one-off compliance event. The U.S. 2022 rule created
              controls covering advanced computing, semiconductor manufacturing items, end uses, and Entity List
              modifications; the Federal Register also states that the rule added an end-use control for development or
              production of integrated circuits at certain semiconductor facilities in China. The Netherlands separately
              expanded authorization requirements for specified deep-ultraviolet lithography exports in September 2024
              and described the measure as case-by-case authorization rather than a blanket ban. These rules can
              constrain tool access, support, and supplier qualification even when YMTC itself is not named in every
              instrument. Independent reporting says YMTC was added to the U.S. trade blacklist in 2022 and has
              increased domestic-equipment use. That is a meaningful mitigation signal, not proof that export-control,
              re-export, military-list, or customer-screening exposure is cleared. The 2026 removal report is itself
              qualified: the source says the list document was withdrawn less than an hour after release and that
              restrictions were not eliminated. A listed-company or IPO process may improve disclosure, but no assigned
              source establishes a completed listing, final legal outcome for all disputes, or a clean compliance
              record.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: Capacity, equipment, and technology execution
        blocks:
          - type: paragraph
            body: >-
              YMTC's operating model combines wafer fabrication, packaging, testing, and system products, so failure in
              equipment availability, yield, process integration, or supplier qualification can propagate across the
              product portfolio. Reuters reported in April 2026 that the third Wuhan factory was installing equipment,
              was expected to reach 50,000 wafers per month by 2027, and had sourced more than half of its equipment
              from domestic companies; the same report said the timing and locations of two further factories were not
              known. This creates a clear scale-versus-execution risk: capacity plans may require large capital
              commitments before demand, yield, and tool performance are proven. The historical record also documents
              unsatisfactory 128-layer risk-production yield of around 30 to 40 percent in 2020–2021, which is not a
              current yield estimate but is relevant precedent for process ramp risk. YMTC's official profile claims
              more than 8,000 R&D engineers, while Baidu Baike reports 9,147 total employees for 2025; the definitions
              and dates are not reconciled, so neither figure establishes current engineering capacity. The fetched
              Wikipedia text says YMTC still relied on Western tool suppliers as of September 2024, so localization
              reduces but does not remove bottleneck, qualification, maintenance, or export-license risk.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
      - number: '7.3'
        title: Financial opacity, dependencies, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish YMTC's current revenue, gross margin, cash balance, debt, burn,
              customer concentration, or liquidity runway. The May 2026 IPO-preparation report says the tutoring review
              includes assets, financial position, compliance record, and core competitiveness, but it does not disclose
              audited operating metrics in the assigned text. A separate report on the subsidiary XMC gives revenue and
              loss figures for XMC, not YMTC, and those figures must not be treated as YMTC revenue or cash burn.
              Reuters identifies two existing fabs with combined output of 200,000 wafers per month and reports plans
              for additional capacity, while the source also says most sales are in China; this makes supplier,
              domestic-demand, and policy concentration important but leaves denominators incomplete. The risk posture
              should therefore remain high with medium confidence: the direction and mechanisms are evidenced, but
              magnitude is not. The practical thesis-break tests are measurable: an export-control action that blocks
              critical tools or servicing; sustained inability to qualify domestic substitutes; a material yield or
              reliability failure; capex expansion without disclosed funding and demand support; or customer
              qualification loss following geopolitical screening. Any recommendation should be revisited if an IPO
              filing supplies audited statements, concentration data, and enforceable mitigation commitments.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Residual exposure and monitoring
        blocks:
          - type: paragraph
            body: >-
              The heatmap ranks risks by evidence-supported impact and likelihood, not by an assumed probability of
              failure. Export controls score highest because the assigned government texts show continuing authorization
              and end-use mechanisms, while Reuters documents their direct effect on YMTC's equipment strategy. Capacity
              and yield risk is next because planned fabs increase fixed-cost and qualification exposure while the
              current evidence does not disclose a full ramp model. Financial opacity and customer concentration remain
              high-impact but are lower-confidence magnitude assessments because the public record is incomplete.
              Litigation and public-list changes are monitorable legal and reputational risks, but neither the dismissal
              of one 2025 action nor the reported 2026 list withdrawal proves a durable change in the operating
              environment. The monitoring plan is to track official rule changes, Entity List and military-list notices,
              supplier qualification and equipment-origin disclosures, fab commissioning and output, independent yield
              or reliability evidence, audited IPO materials, customer qualification announcements, and court dockets.
              Until those indicators improve, residual exposure remains material and supports a track/research-more
              posture rather than an unqualified positive judgment.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR010
              - CR012
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR010
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break condition
            body: >-
              "A renewed or broadened export-control action that blocks critical equipment, servicing, or customer
              qualification would impair both near-term output and the economics of planned capacity; domestic
              substitution should be treated as partial mitigation until independently verified."
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR007
          - type: callout
            title: Evidence boundary
            body: >-
              "The assigned evidence does not disclose YMTC-level audited revenue, cash, debt, margin, customer
              concentration, or current yield; subsidiary figures and production capacity are not substitutes for those
              metrics."
            calloutType: assumption
            claimRefs:
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment judgment and price discipline
        blocks:
          - type: paragraph
            body: >-
              YMTC has a credible strategic and technology case, but the investable conclusion is constrained by
              disclosure quality. Tech in Asia reported that sources said YMTC was considering a mainland IPO as early
              as 2026 at a potential valuation of 200–300 billion yuan, while also warning that the plans were at an
              early stage and could change. That is a financing signal, not a completed transaction or a verified market
              clearing price. TrendForce's retained account reports a 161 billion yuan valuation tied to a December 2023
              investment, alongside a 1.6 billion yuan investment and an 84 million yuan loss in the first nine months
              of 2024. These marks are not directly comparable without a cap table, security terms, and audited
              statements. Accordingly, the recommendation is track, with low-to-medium confidence, rather than buy:
              price discovery should wait for audited financials, offering terms, dilution, preferences, and a
              transparent use-of-proceeds plan.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis rests on a real manufacturing platform and differentiated process architecture. YMTC's
              own technical page describes mass production of 3D NAND products based on Xtacking, while the retained
              company-profile source describes an IDM model spanning design, manufacturing, packaging, testing, and
              system solutions. The opposing case is that IDM economics make execution and capital intensity unusually
              important: TrendForce's account says YMTC spent 5 billion yuan on R&D in 2023 and 6 billion yuan in 2024,
              and links the 2024 loss to restricted equipment access, delayed expansion, and a market downturn. The same
              account says public sources share no revenue or margin figures. Export restrictions and dependence on
              difficult-to-replace equipment can therefore reduce both growth and valuation multiples. The thesis
              improves if audited margins and cash conversion demonstrate scale economics; it breaks if expansion
              requires repeated external capital while profitability remains cyclical or inaccessible.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario valuation and comparable context
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue multiple cannot be responsibly applied to YMTC from the retained public record
              because revenue, margin, debt, cash, and share-count data are not disclosed in a comparable audited
              format. The scenario table therefore uses the reported 161 billion yuan transaction-linked mark and the
              200–300 billion yuan IPO discussion only as reference points, not as fair values. Hurun's 2025 index is
              useful context for private-market valuation risk: it says 143 unicorns saw valuation cuts, 52 fell below
              the 1 billion dollar threshold, and that private valuations are fluid. Micron data from Yahoo Finance and
              the SK hynix filing page provide public memory-company market and disclosure context, but their scale,
              listing status, product mix, and accounting are not directly comparable to a private Chinese NAND IDM. Any
              entry decision should be conditioned on a verified bridge from capacity and pricing to revenue, gross
              margin, free cash flow, dilution, and exit liquidity.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
      - number: '8.4'
        title: Exit readiness and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The reported IPO pathway may improve liquidity, but it is not yet an exit underwritten by public evidence.
              Tech in Asia describes the IPO as an early-stage consideration, and the Baike profile reports later
              IPO-guidance and exchange-acceptance milestones; those statements should be verified against the issuer
              and exchange filings before treating them as binding. The core diligence package is an audited multi-year
              income statement, balance sheet, cash-flow statement, debt schedule, cap table, preference stack, customer
              and product mix, wafer starts and yields, equipment sourcing, export-compliance controls, and IPO
              prospectus. Monitorable thesis-break triggers are a materially lower verified yield or utilization trend,
              a down-round or offering price below the 161 billion yuan reference, inability to fund planned capacity
              without punitive dilution, adverse sanctions or litigation outcomes, or evidence that the 2024 loss
              pattern persists after expansion. Until those checks clear, the rational action is track/research-more
              rather than pay a strategic premium for an unverified earnings trajectory.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not a price-insensitive buy
            body: >-
              The technology and strategic position are credible, but a 2026 entry should be considered only after
              audited financials, capitalization terms, and a binding IPO or secondary price are available.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV013
              - CV016
          - type: callout
            title: Disclosure and capital-intensity risk dominate
            body: >-
              Reported losses, heavy R&D, export restrictions, and the absence of public margin data create too much
              uncertainty for a precise fair-value conclusion.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV012
