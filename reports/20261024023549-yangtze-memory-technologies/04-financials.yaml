schemaVersion: "report-v2"
artifact: financials
slug: yangtze-memory-technologies
runDate: 2026-10-24
company:
  name: Yangtze Memory Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    YMTC has a product-and-volume NAND revenue model and substantial reported
    manufacturing scale, but the public record does not provide a reconciled,
    audited view of revenue, pricing, margin, cash, debt, or runway. Conflicting
    third-party financial figures and continued capacity investment make
    entity scope, yield, and capital adequacy the principal underwriting gaps.
sections:
  - id: revenue-model
    title: Revenue model, channels, and monetization
    body: >-
      YMTC is described as an integrated device manufacturer that designs,
      manufactures, and sells 3D NAND. The identified product set spans wafers
      and dies, embedded memory chips, and consumer- and enterprise-grade
      solid-state drives. Distribution therefore appears to combine component
      sales to module and device brands with finished-product sales under the
      ZHITAI brand. Revenue should be driven by shipped bits or units, realized
      average selling prices, product mix, and contract terms rather than
      recurring subscriptions. A 2021 patent analysis also described an intent
      to license fabrication technology, but the retained evidence does not
      establish signed licenses or royalty revenue. No assigned source
      discloses list prices, realized pricing, discounts, revenue mix, or
      recognition policies by product.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-economics
    title: Operating traction and unit-economics evidence
    body: >-
      Production capacity is the clearest current operating proxy. Reuters
      reported in May 2026 that two factories had combined monthly output of
      200,000 wafers and that a third factory was expected to add capacity by
      2027. Capacity does not establish utilization, good-die yield, bit
      output, revenue, or gross profit. Bamboo Works separately reported that
      domestic equipment had not yet achieved the high yields needed for
      cost-effective production. Public profitability figures also fail to
      reconcile: Bamboo Works cited a 2023 parent profit and a loss for the
      first nine months of 2024, while later Yicai and Baidu pages reported
      sharply different figures for other periods without enough entity-scope
      detail to bridge them. Those values are signals to verify, not a
      continuous earnings series.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital intensity and financing dependency
    body: >-
      Expansion remains financing-intensive. TrendForce reported a Phase III
      venture with RMB 20.72 billion of registered capital and YMTC ownership
      of 50.2%, while Reuters described continued factory additions. Bamboo
      Works reported a shareholding restructuring with 16 institutional
      investors and calculated an implied RMB 161.6 billion parent valuation
      from one investor's contribution. These are ownership, registered-capital,
      and transaction-reference figures; none equals unrestricted cash or
      demonstrates runway. A later research post relayed a much higher possible
      internal IPO valuation target, but that is neither a completed financing
      nor corroborated equity value. The retained sources do not disclose cash
      on hand, debt maturities, committed capex, working capital, burn, or the
      next external-funding trigger.
    claimRefs: [CI006, CI007, CI014, CI015]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The supportable conclusion is scale without underwritable financial
      quality. YMTC has multiple product channels and large reported wafer
      capacity, but public evidence cannot separate shipment growth from price,
      mix, yield, or subsidy effects. As a disclosure benchmark rather than a
      direct operating comparison, Yahoo Finance exposes revenue, margin, cash,
      and free-cash-flow fields for public peer Micron; equivalent reconciled
      fields are absent for YMTC in this source set. An investment case should
      therefore remain conditional on audited entity-scoped statements, a
      product and customer revenue bridge, realized ASPs, yield and cost-per-bit
      data, gross margin by fab, and a cash-to-capex schedule. Reported
      valuation references should not be used before those records resolve the
      conflicting earnings evidence.
    claimRefs: [CI004, CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
