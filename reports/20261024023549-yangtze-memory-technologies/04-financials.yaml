      - ["Embedded memory", "chip, SKU, or capacity", null, null, "OEM contract duration and qualification economics unknown", "No assigned source discloses pricing"]
      - ["Consumer and enterprise SSDs", "drive or storage capacity", null, null, "Channel discounts, returns, and sell-through unknown", "Products are identified, but monetization is not quantified"]
      - ["Technology licensing", "license, field of use, or royalty", null, null, "No executed agreement or royalty schedule in retained evidence", "Historical intent is not realized licensing revenue"]
    notes: "Null means unavailable in the assigned prefetched evidence, not zero; list price, contract price, and recognized revenue are not interchangeable."
    claimRefs: [CI002, CI003, CI004, CI005]
  - id: TI003
    title: Unit-economics and financial underwriting matrix
    columns: [Metric, Public value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Reported parent profitability", "RMB 531m net profit in 2023; RMB 84.21m loss in the first nine months of 2024", "Medium; attributed by Bamboo Works to an investor disclosure", "Shows a reversal but not normalized earnings", "Obtain audited statements and period bridge"]
      - ["Yicai-reported results", "2024 revenue RMB 56.2m and loss RMB 97.5m; H1 2025 revenue RMB 37.8m and loss RMB 251m", "Low; article cites XMC prospectus and entity scope is unclear", "Cannot be combined with parent figures without perimeter reconciliation", "Map each value to the reporting entity and filing page"]
      - ["Baidu-reported Q1 2026 results", "Revenue RMB 47.042bn and parent-attributable profit RMB 33.379bn", "Low; tertiary page and uncorroborated in this pool", "Magnitude conflicts with other public figures and may reflect different scope", "Verify against the accepted IPO filing and audited accounts"]
      - ["Wafer capacity", "200,000 wafers/month across two factories; third factory targeted at 50,000/month by 2027", "Medium; Reuters report", "Capacity drives fixed costs but is not utilization or good-bit output", "Obtain installed capacity, utilization, yield, and output by fab"]
      - ["Gross margin and yield", null, "Low; no quantified disclosure", "Determines whether scale converts to cash generation", "Request yield, cost per good bit, and gross margin by product and fab"]
      - ["Cash, debt, capex, burn, and runway", null, "Low; no current disclosure in retained sources", "Determines financing dependency through a memory down-cycle", "Request treasury schedule, debt terms, committed capex, and downside runway"]
    notes: "Reported values cover different periods and potentially different entities; they are not a continuous series. Null means unavailable, and registered capital is not cash available."
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013]
figures:
  - id: FI001
    title: Revenue-to-gross-profit bridge
    type: flow
    summary: The operating bridge is identifiable, but public evidence does not quantify its conversion rates or economics.
    data:
      nodes:
        - id: capacity
          label: Installed wafer capacity
          detail: Reuters reported factory output capacity, not utilization.
        - id: yield
          label: Good-bit yield
          detail: No quantified yield is disclosed in the assigned evidence.
        - id: product-mix
          label: Product and density mix
          detail: Wafers, dies, embedded memory, and SSDs have different economics.
        - id: shipments
          label: Qualified shipments
          detail: Shipment and customer-acceptance volumes are not disclosed.
        - id: realized-price
          label: Realized ASP
          detail: List prices, contract prices, rebates, and discounts are unavailable.
        - id: gross-profit
          label: Revenue and gross profit
          detail: Audited stream revenue and gross margin are unavailable.
    approximationNotes: "Conceptual operating sequence only; it does not estimate volumes, conversion rates, revenue, or margin."
    claimRefs: [CI001, CI004, CI007, CI008]
callouts:
  - calloutType: risk
    title: Public earnings figures do not reconcile
    body: >-
      Different secondary and tertiary sources report results for different
      periods and apparently different entity scopes. They cannot support a
      trend line until matched to audited filings and the correct reporting
      perimeter.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Underwrite cash and yield before valuation
    body: >-
      Treat registered capital, IPO preparation, and valuation references as
      financing signals only; require audited cash, debt, capex, utilization,
      yield, ASP, and margin records before assigning an equity value.
    claimRefs: [CI006, CI007, CI008, CI014, CI015]
