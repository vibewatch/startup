  topStrengths:
    - Vertically integrated NAND manufacturing platform with Xtacking-based product capability.
    - Reported scale and market participation, including two fabs with 200,000 wafers of combined monthly output.
    - Strategic localization value and a credible path to selective OEM and enterprise adoption.
  topRisks:
    - Export controls and equipment-access restrictions can constrain yield, expansion, and customer qualification.
    - Audited revenue, margins, cash, debt, capex funding, and customer concentration are not publicly reconciled.
    - NAND cyclicality and capital intensity create downside if pricing or utilization weakens before an IPO.
  unresolvedGaps:
