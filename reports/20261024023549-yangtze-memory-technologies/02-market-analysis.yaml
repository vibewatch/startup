  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing
      missingEvidence: Public, audited YMTC revenue by end market, wafer output, utilization, and customer concentration.
      whyItMatters: Global market size and share data do not establish YMTC's obtainable market or durable revenue.
      diligencePath: Request audited financial statements, production schedules, customer concentration, and qualified design-win data under NDA.
      relatedQuestionRefs: [QM008]
    - type: conflicting-data
      severity: material
      topic: market-share
      missingEvidence: A single market-share series with a consistent revenue or shipment denominator and quarter definition.
      whyItMatters: The 13% Q1 2026 and 11.8% 2025 figures cannot be compared as a simple growth bridge.
      diligencePath: Obtain the underlying Counterpoint and TrendForce tables and reconcile revenue, shipment, and period definitions.
      relatedQuestionRefs: [QM007]
