        - date: "2022-12"
          label: U.S. Entity List exposure
          details: Reuters and the profile chronology describe the late-2022 trade-blacklist restriction.
          tone: negative
          claimRefs: [CO016]
        - date: "2025-01"
          label: Fifth-generation NAND shipments
          details: The profile chronology reports 294-layer fifth-generation 3D TLC NAND shipments.
          tone: positive
          claimRefs: [CO013]
