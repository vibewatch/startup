    claimRefs: [CO008, CO011, CO013, CO015, CO016]
callouts:
  - calloutType: strength
    title: Scaled, vertically integrated platform
    body: YMTC combines NAND design, manufacturing, packaging, testing, embedded-memory products, and SSD brands, with a market account reporting a 13% Q1 2026 NAND revenue share.
    claimRefs: [CO002, CO014]
  - calloutType: risk
    title: Disclosure and policy risk remain material
    body: IPO preparation may improve transparency, but audited financials, governance rights, equipment dependence, and the practical effect of export restrictions remain open diligence items.
    claimRefs: [CO017, CO018]
