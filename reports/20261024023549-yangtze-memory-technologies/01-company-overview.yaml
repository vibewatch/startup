          tone: neutral
          claimRefs: [CO011]
        - date: "2016-07-26"
          label: Company established
          details: YMTC was established in Wuhan on July 26, 2016.
          tone: positive
          claimRefs: [CO001]
        - date: "2017-10"
          label: First domestic 3D NAND
          details: The profile chronology reports successful design and manufacture of China's first 3D NAND flash memory.
