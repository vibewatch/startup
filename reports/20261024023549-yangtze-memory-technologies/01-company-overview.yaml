          label: Expansion plan reported
          details: Reuters reported plans for one factory nearing completion and two additional factories, with operational dates for the latter still unknown.
          tone: neutral
          claimRefs: [CO015]
        - date: "2026-05-19"
          label: IPO tutoring process
          details: Reuters reported that YMTC hired CITIC Securities for formal pre-IPO guidance.
          tone: neutral
          claimRefs: [CO008]
