company:
  name: Yangtze Memory Technologies
chapter:
  number: 3
  title: Competitors
  summary: YMTC has moved from a China-focused entrant toward a credible global NAND competitor, with reported share gains, 232-layer products, and a planned capacity expansion. Its differentiation is strongest in domestic supply-chain integration and Xtacking execution, but Samsung, SK hynix, Kioxia, Micron, and SanDisk retain greater scale, while export controls and opaque commercial data limit confidence in durability.
sections:
  - id: landscape
    title: Competitive landscape and scale
    body: >-
      YMTC competes in a concentrated NAND market where scale, process execution, qualification history,
      and access to manufacturing equipment matter more than a single layer-count milestone. Multiples
      describes YMTC as a Wuhan-headquartered integrated device manufacturer serving smartphones, data
      centers, and SSDs, while its comparison set includes KIOXIA and DapuStor alongside companies that
      are not direct NAND peers. The more decision-useful benchmark is the manufacturer ranking: MemoryMarket
      places Samsung, SK hynix, Kioxia, Western Digital, and Micron in the top five for Q4 2025, and
      TrendForce similarly shows Samsung, SK Group, Kioxia, Micron, and SanDisk leading in 2Q25. YMTC
      therefore faces direct global incumbents, adjacent storage-module brands, and customer-led internal
      qualification or multi-sourcing rather than one homogeneous competitor.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability
    title: Capability, product, and access comparison
    body: >-
      The clearest product evidence is that YMTC reached commercial 232-layer NAND and was reported as
      supplying storage used in Xiaomi 14, while Baike's company profile describes an IDM spanning design,
      manufacturing, packaging, testing, and SSD solutions. That combination supports a differentiated
      position for domestic customers that value local supply and rapid product iteration. It does not
      establish parity across yield, endurance, firmware, qualification breadth, or realized pricing.
      TrendForce's market data shows incumbents benefiting from enterprise SSD and AI-server demand, and
      the ranking data provides no evidence that YMTC has equivalent share or customer disclosure. The
      capability matrix therefore separates observed product or market evidence from cells that remain
      unknown, rather than treating vendor claims or layer count as a complete performance benchmark.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
  - id: durability
    title: Moat durability, switching, and displacement
    body: >-
      YMTC's moat is partly technological and partly institutional. Xtacking and domestic tool sourcing
      can reduce dependence on foreign suppliers, while state-backed capital and a Wuhan fab footprint
      support the fixed-cost investment required for NAND. Evertiq and TechPowerUp report a plan that could
      raise total output from about 200,000 wafers per month to 400,000 when three new fabs are fully
      operational, but the sources also describe equipment, timing, and government-policy uncertainty.
      The December 2022 U.S. Entity List placement constrains access to American technology, and BusinessKorea
      notes that Samsung and SK hynix still retain a technology edge even as the gap narrowed. Switching
      is consequently high at the fab and qualification layer, but buyers can multi-source commodity
      NAND and SSDs; sustained yield, reliability, price, and export-compliant supply—not architecture
      branding alone—will determine whether share gains persist.
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
    tableRefs: [TP003]
    figureRefs: [FP001]
