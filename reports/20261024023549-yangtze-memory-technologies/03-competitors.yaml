figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: YMTC combines meaningful reported share and product progress with lower disclosed scale and higher policy exposure than established NAND incumbents.
    data:
      points:
        - {label: YMTC, x: 3, y: 3, note: "Reported 13% share and 232-layer product evidence; private economics and policy exposure remain material gaps"}
        - {label: Samsung, x: 5, y: 5, note: "Highest reported share in TrendForce and MemoryMarket periods; enterprise SSD demand supports scale"}
        - {label: "SK hynix / Solidigm", x: 4, y: 4, note: "Second-ranked group in both cited market snapshots with enterprise SSD momentum"}
        - {label: Kioxia, x: 4, y: 3, note: "Third-ranked or 15% share in cited snapshots, with AI-server and mobile/PC exposure"}
        - {label: Micron, x: 3, y: 4, note: "Double-digit share and record client/data-center SSD shares in TrendForce coverage"}
        - {label: "SanDisk / Western Digital", x: 3, y: 2, note: "Double-digit share but weaker enterprise SSD penetration in TrendForce's cited comparison"}
      xAxis: "Reported competitive scale (ordinal: 1 low, 5 high)"
      yAxis: "Evidence of product / channel durability (ordinal: 1 low, 5 high)"
    approximationNotes: "Ordinal coordinates synthesize the cited market-share, product, channel, and policy evidence; they are not measured market scores or a claim of equal comparability across periods."
    claimRefs: [CP001, CP002, CP003, CP005, CP010, CP011]
callouts:
  - calloutType: insight
    title: Differentiation is real but not yet durable
    body: "YMTC has evidence of product catch-up, local OEM adoption, and expanding capacity. The investable question is whether those advantages translate into sustained yield, reliable supply, and customer retention under export controls, not whether a layer-count milestone exists."
    claimRefs: [CP005, CP010, CP011, CP014]
  - calloutType: risk
    title: Benchmarking remains disclosure-constrained
    body: "Public sources provide market-share snapshots and reported product milestones, but not normalized pricing, gross margin, yield, endurance, customer concentration, or qualification win rates. Competitive conclusions should remain directional until those inputs are disclosed."
    claimRefs: [CP009, CP012, CP013]
