chapter:
  number: 6
  title: Customers
  summary: YMTC's public customer evidence spans intended smartphone, PC, data-center, and enterprise use cases, but the strongest current proof is a limited European Lenovo laptop deployment rather than disclosed production contracts or retention metrics. Apple verification and subsequent withdrawal illustrate both product qualification capability and geopolitical procurement fragility.
sections:
  - id: customer-segments-and-adoption
    title: Customer segments and adoption surfaces
    body: >-
      YMTC's own 2018 materials positioned its NAND solutions across mobile devices, computing, data centers, and consumer electronics, with the Xtacking architecture described as enabling customized solutions for those applications. That is a segment map and product ambition, not evidence of paid adoption. The clearest current external deployment evidence is Notebookcheck's test of a 512 GB YMTC NVMe PCIe 4.0 SSD inside a Lenovo ThinkBook 14 G9 configuration sold in Germany; Lenovo clarified that U.S. configurations continued to use non-YMTC SSDs. This supports a real OEM shipment in at least one European configuration, while also showing geographic scope is narrower than a global Lenovo deployment. Earlier Apple qualification reporting is stronger evidence of technical and procurement evaluation than of revenue: Apple reportedly completed testing but did not put YMTC chips into iPhone production. Customer evidence therefore supports a staged path from qualification to selected OEM shipment, not broad customer penetration.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-durability
    title: Adoption proof and durability
    body: >-
      Public sources do not disclose YMTC's customer count, active installed base, shipment volumes by customer, renewal behavior, gross or net retention, churn, contract duration, or customer-level revenue. The available proof is event-based: a German Lenovo SKU was tested and shipped with a YMTC SSD, while Apple reportedly verified products but halted planned use under export-control pressure. The two events have different evidentiary weight and should not be merged into a conversion funnel. Notebookcheck measured 3,950 MB/s sequential read and 2,514 MB/s sequential write for the tested drive and characterized performance as below average for an office laptop but adequate for use; that is a product outcome, not a customer-retention metric. The absence of disclosed denominator data makes durability and repeat-purchase claims unresolved.
    claimRefs: [CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: expansion-and-concentration
    title: Expansion and concentration risk
    body: YMTC's commercial expansion appears to depend on winning qualification and supply-chain placement under changing policy and memory-cycle conditions. The Lenovo evidence indicates a path into an OEM design or SKU, but the restriction to German models limits what can be inferred about worldwide scale. The Apple episode shows that even completed product verification can fail to convert into production when export controls and political scrutiny change the buyer's risk calculus. Current reporting also says Chinese memory makers' expansions will mainly serve local demand, and describes YMTC's growth as benefiting from policy-driven localization; this suggests domestic demand and policy support may be strategically important, but does not establish customer concentration percentages. The key diligence need is a customer-by-customer shipment, qualification, geography, and contract schedule that separates production from pilot and identifies any single OEM or channel dependency.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
