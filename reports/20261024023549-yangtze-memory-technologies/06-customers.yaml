    title: Customer journey from qualification to expansion
    type: journey-map
    summary: Public evidence shows a staged path from segment targeting and technical evaluation to selective OEM shipment, with policy and geography limiting expansion visibility.
    data:
      items:
        - label: Segment targeting
          touchpoints: ["Mobile, PC, data-center, enterprise, and consumer-electronics applications"]
          detail: "Company-described use-case breadth; customer names and live-account counts are not disclosed."
        - label: Technical qualification
          touchpoints: ["Apple testing and verification reported before production use was halted"]
          detail: "Qualification is not equivalent to paid production adoption."
        - label: Selective OEM shipment
          touchpoints: ["Lenovo ThinkBook 14 G9 configuration sold in Germany"]
          detail: "Independent review evidence; Lenovo excluded U.S. configurations."
        - label: Expansion loop
          touchpoints: ["Additional geographies, SKUs, and repeat orders remain unverified"]
          detail: "Requires customer-level shipment, contract, and retention evidence."
        - label: Retention proof
          touchpoints: ["Renewal, repeat purchase, churn, and cohort data are not disclosed"]
          detail: "Durability remains an evidence gap rather than an inferred outcome."
        - label: Concentration review
          touchpoints: ["Customer-level shipment and revenue schedule needed"]
          detail: "No public denominator supports concentration quantification."
callouts:
  - calloutType: strength
    title: Real but bounded OEM proof
    body: The German Lenovo configuration is stronger than a logo or marketing reference because an independent reviewer tested the shipped SSD, but it does not establish global Lenovo penetration.
    claimRefs: [CU002, CU005]
  - calloutType: risk
    title: Qualification-to-production conversion risk
    body: Apple reportedly verified YMTC products yet halted planned production use after tighter export controls, demonstrating that geopolitical procurement risk can interrupt a technically qualified customer path.
    claimRefs: [CU006, CU007, CU010]
  - calloutType: recommendation
    title: Request customer-level operating proof
    body: Obtain a dated customer schedule showing production versus pilot status, SKU and geography, shipment units, contract duration, repeat orders, and concentration by customer and channel.
    claimRefs: [CU009, CU012, CU013]
