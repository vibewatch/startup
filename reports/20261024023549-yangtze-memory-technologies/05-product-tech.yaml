  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Independent yield, wafer-sort, field-failure, endurance, uptime and return-rate data by product generation.
      whyItMatters: Product qualification and layer-count claims do not establish system reliability or manufacturing consistency at commercial scale.
      diligencePath: Request generation-level yield, RMA, endurance and service-level data under confidentiality, then reconcile it to customer qualification records.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A public practitioner-community or developer-signal dataset covering YMTC software, firmware, API or integration activity.
      whyItMatters: The company is a hardware IDM, so conventional repository or package-download signals may not exist; without a proxy, ecosystem depth cannot be assessed.
      diligencePath: Obtain channel, controller-firmware, OEM-integration and field-support evidence from named customers, module partners and industry practitioners.
      relatedQuestionRefs: [QE005, QE008]
    - type: access-blocked
      severity: minor
      topic: roadmap
      missingEvidence: Primary technical specifications, benchmark conditions and qualification documentation for current Xtacking 4.0 and fifth-generation products.
      whyItMatters: Public descriptions mix company roadmap claims with independent teardowns of earlier samples, limiting current-generation comparability.
      diligencePath: Request datasheets, process-generation mapping, benchmark methodology and customer qualification status for each currently shipped SKU.
      relatedQuestionRefs: [QE004, QE007]
