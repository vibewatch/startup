company:
  name: Yangtze Memory Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: YMTC is an integrated NAND-memory designer and manufacturer whose Xtacking architecture has progressed from mass-produced 128-layer products to externally reported 232-layer and newer generations. The product is commercially real across embedded, SSD, smartphone and data-center use cases, but independent teardown evidence and export-control constraints make technology maturity, scale and supply-chain resilience the central diligence questions.
sections:
  - id: product-and-customer-workflow
    title: Product scope and customer workflow
    body: >-
      Publicly fetched sources describe YMTC as an integrated device manufacturer focused on the
      design and manufacturing of 3D NAND flash memory and advanced memory solutions. Its
      portfolio spans NAND wafers and dies, embedded memory, and consumer- and enterprise-grade
      solid-state drives, so the customer workflow runs from chip qualification and module
      integration through storage deployment rather than a single software subscription. The
      official company profile says the Gen2 Xtacking product entered mass production in 2019
      and that X2-6070 was a Gen3 QLC part with high density, I/O speed and capacity at launch.
      Independent reporting places YMTC memory in the Xiaomi 14 supply chain, while the company
      also sells through storage and device manufacturers. This supports real product
      qualification, but it does not establish retention, realized pricing, or a complete
      customer list.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, maturity and differentiation
    body: >-
      Xtacking is the core architectural differentiation: TechInsights describes wafer bonding
      of a CMOS wafer and a memory-cell wafer, separating logic fabrication from the NAND array.
      The cited technical analysis attributes higher cell efficiency and shorter development
      time to the first generation, nickel silicide and improved I/O performance to the second,
      and back-side source connect plus center-X-decoder changes to the third. The same
      teardown is an important counterweight to marketing claims: sampled TiPlus7100 drives
      contained 128-layer dies and did not show the expected Xtacking 3.0 features, even though
      the announced architecture was associated with a 232-layer design. Reuters later reported
      analysts viewed Xtacking 4.0 as comparable with sector leaders, but that is analyst
      commentary rather than a disclosed benchmark. Maturity should therefore be assessed by
      shipped part, customer qualification and independent teardown, not layer count alone.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-dependencies-and-risk
    title: Deployment, dependencies and technical risk
    body: >-
      YMTC's operating model is manufacturing-intensive and geographically concentrated. Reuters
      reported two existing fabs with combined capacity of 200,000 wafers per month, a third
      Wuhan fab expected to reach 50,000 wafers per month by 2027, and plans for two more fabs;
      more than half of equipment for the third fab had reportedly been sourced domestically.
      The same report says YMTC has intensified local-supplier collaboration since its addition
      to the U.S. Entity List in 2022, while another Reuters report says export restrictions
      curtailed access to foreign chipmaking tools and pushed greater use of domestic suppliers.
      A Caixin-sourced report syndicated by KuCoin says planned IPO proceeds are intended for
      production-line upgrades and next-generation storage technology development, reinforcing
      the capital dependence of the product roadmap without proving execution.
      These facts make equipment availability, process yield, spare parts and qualification
      continuity material dependencies. The evidence does not disclose uptime, yield, failure
      rates, security controls, product support SLAs, or a public developer ecosystem. Those
      omissions are not evidence of failure; they are diligence gaps that limit confidence in
      reliability and roadmap execution.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]

