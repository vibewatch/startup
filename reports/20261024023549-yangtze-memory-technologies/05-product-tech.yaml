      - ["Provide embedded storage for mobile devices", "Module maker combines NAND with eMMC/UFS controller and package", "Gen3 TLC/QLC eMMC/UFS volume shipment was reported", "Form-factor products fit embedded workflows", "Controller, firmware and customer mix are not disclosed"]
      - ["Scale storage for servers and data centers", "Enterprise buyer qualifies SSD endurance, performance and supply continuity", "Enterprise-grade SSDs are listed as a product category", "Potentially larger-value use case", "Public named deployments and benchmark results are sparse"]
    notes: The table separates reported product fit from unverified benefits; no conversion, uptime or retention metric is inferred where the sources provide none.
    claimRefs: [CE002, CE003, CE004, CE012]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["NAND memory-cell wafer", "Stores data in the 3D NAND array", "Layer-stack process and materials", "Yield and scaling risk as layer count rises"]
      - ["CMOS logic wafer", "Provides peripheral logic and I/O functions", "Advanced process and wafer fabrication", "Access to tools and process know-how"]
      - ["Xtacking wafer bond", "Vertically connects logic and array wafers", "High-precision bonding and alignment", "Bond defects could reduce yield or performance"]
      - ["BSSC and center X-decoder", "Reported Xtacking 3.0 architectural changes", "232-layer-class process integration", "Sampled TiPlus7100 teardown did not show these features"]
      - ["Package and controller integration", "Converts dies into embedded or SSD products", "Packaging, firmware and module partners", "Customer qualification and system-level reliability"]
      - ["Fab and supplier network", "Manufactures and scales qualified parts", "Domestic and foreign equipment", "Export controls and geographic concentration"]
    notes: Architecture layers synthesize the cited TechInsights description with reported manufacturing dependencies; the table is an analytical model, not a disclosed YMTC reference architecture.
    claimRefs: [CE005, CE006, CE007, CE010, CE011, CE013]

figures:
  - id: FE001
    title: YMTC product architecture map
    type: stack
    summary: YMTC's reported product stack links memory-cell fabrication, Xtacking logic integration, packaging and end-use storage products.
    data:
      layers:
        - label: End-use products
          detail: Finished storage products and embedded products sold into device and infrastructure workflows.
          items:
            - name: Enterprise and consumer SSDs
              detail: Finished storage products for servers, data centers, PCs and gaming.
            - name: Embedded eMMC/UFS
              detail: Embedded storage products for mobile and other devices.
        - label: Package and system integration
          detail: Packages NAND dies into usable memory products; public controller and firmware detail is limited.
          items:
            - name: Package and controller
              detail: Packages NAND dies into usable memory products; public controller and firmware detail is limited.
        - label: Xtacking integration
          detail: Connects CMOS logic and memory-cell wafers through the reported Xtacking process.
          items:
            - name: Wafer bonding
              detail: CMOS logic wafer bonded to the memory-cell wafer.
            - name: Xtacking 3.0 features
              detail: BSSC and center-X-decoder are described by TechInsights as reported design changes, but were not found in sampled TiPlus7100 units.
        - label: Semiconductor fabrication
          detail: Produces the logic wafer and layered non-volatile memory array.
          items:
            - name: CMOS logic wafer
              detail: Peripheral logic and I/O functions.
            - name: 3D NAND cell wafer
              detail: Layered non-volatile memory array.
        - label: Operating dependencies
          detail: Requires fabs, equipment, process materials, spare parts and qualified suppliers.
          items:
            - name: Fab equipment and suppliers
              detail: Domestic and foreign equipment, spare parts, process materials and Wuhan fab capacity.
            - name: Process qualification
              detail: Requires customer validation and consistent yield across product generations.
        - label: Quality and support
          detail: Requires qualification, reliability testing, field support and customer service.
          items:
            - name: Reliability and support controls
              detail: Public uptime, failure-rate, endurance and service-level evidence remains limited.
    claimRefs: [CE001, CE005, CE006, CE007, CE010, CE011]

callouts:
  - calloutType: strength
    title: Differentiated architecture with commercial reach
    body: >-
      Xtacking is not merely a laboratory concept: official materials report mass production, and
      external reporting ties YMTC NAND to smartphone and SSD products.
    claimRefs: [CE001, CE002, CE005]
  - calloutType: risk
    title: Independent maturity proof remains uneven
    body: TechInsights' teardown of sampled TiPlus7100 drives found 128-layer dies and no Xtacking 3.0 features, so roadmap claims should be reconciled to shipped part numbers and independent tests.
    claimRefs: [CE007, CE008]
  - calloutType: assumption
    title: Developer-signal limitation
    body: YMTC is a hardware manufacturer without a conventional public software developer surface; public technical analysis and supply-chain reporting are used as practitioner proxies, while software ecosystem traction remains unverified.
    claimRefs: [CE005, CE007, CE010]

