    claimRefs: [CR001, CR004, CR006, CR010, CR014, CR016]

callouts:
  - calloutType: risk
    title: Primary thesis-break condition
    body: >-
      "A renewed or broadened export-control action that blocks critical equipment, servicing, or customer qualification would impair both near-term output and the economics of planned capacity; domestic substitution should be treated as partial mitigation until independently verified."
    claimRefs: [CR001, CR006, CR007]
  - calloutType: assumption
    title: Evidence boundary
    body: >-
      "The assigned evidence does not disclose YMTC-level audited revenue, cash, debt, margin, customer concentration, or current yield; subsidiary figures and production capacity are not substitutes for those metrics."
    claimRefs: [CR010, CR011, CR012]

