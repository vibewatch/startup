      - ["Fab ramp, yield, or process-integration shortfall", Medium, High, "R&D scale and Xtacking progression are documented; historical 128-layer yield was only around 30–40%", High, "No current yield, scrap, uptime, or qualification disclosure"]
      - [Capacity added ahead of demand, Medium, High, "Additional fabs are reported as plans; timing and locations for two are unknown", "High", "No audited demand, utilization, capex, or funding schedule"]
      - [Workforce capacity or disclosure mismatch, Medium, Medium, "Company claims more than 8,000 R&D engineers; Baidu Baike reports 9,147 employees for 2025", "Medium", "Definitions, dates, and personnel denominators are not reconciled"]
    notes: "Likelihood and residual exposure are analytical labels tied to the cited mechanisms; they are not reported company probabilities. Historical yield is retained as precedent, not a current estimate; workforce figures use different definitions."
    claimRefs: [CR006, CR007, CR008, CR009, CR015, CR016]
  - id: TR003
    title: Partner, dependency, and financial-model risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Thesis-break monitor]
    rows:
      - [Semiconductor equipment ecosystem, "Domestic suppliers plus remaining Western suppliers", "A critical tool, spare part, software update, or license becomes unavailable", Critical, "Localize tools and redesign processes", "Critical", "Quarterly origin, qualification, and service disclosures"]
      - [IPO and capital-market process, "CITIC Securities, auditors, and regulators", "Funding or listing timetable slips while fab capex continues", High, "IPO tutoring creates a disclosure pathway but does not establish funding", "High", "Audited filing, capital commitments, and use-of-proceeds disclosure"]
      - [Chinese demand and customer qualification, "Primarily China-based buyers in reported aggregate", "Geopolitical screening or quality concerns reduce qualified demand", High, "Reported geography provides no concentration or retention denominator", "High", "Named production customers, concentration, renewal, and qualification data"]
      - [Capacity expansion program, "Existing fabs and planned Wuhan expansion", "Management commits capital before demand, yield, and tool performance are proven", High, "Staged commissioning provides monitorable milestones", "Medium-high", "Fab-level capex, utilization, yield, funding, and customer-qualification disclosure"]
    notes: "Counterparties and dependencies are inferred from the assigned company, government, and Reuters texts. Public evidence does not quantify concentration, contractual protection, or available cash."
    claimRefs: [CR010, CR011, CR012, CR013, CR014]

