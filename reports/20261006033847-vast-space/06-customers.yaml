company:
  name: "Vast Space"
chapter:
  number: 6
  title: "Customers"
  summary: "Vast Space's commercial customer traction spans sovereign space agencies, microgravity research partners, and private astronaut missions, anchored by NASA's selection for the sixth private astronaut mission to the ISS and bilateral sovereign agreements with France, the Czech Republic, and the UK. While Vast has positioned Haven-1 as a first-mover commercial destination targeting early 2027, the customer base remains heavily weighted toward non-binding MoUs and forward partnerships with pre-revenue station economics, exposing the company to government schedule risks and ISS transition dependencies."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Target Markets"
    body: "Vast Space segments its customer opportunity across three distinct buyer categories: sovereign human spaceflight programs, commercial and institutional microgravity research consortia, and private astronaut commercial missions. Sovereign customers represent the highest-value tier, as nation-states seek dedicated human spaceflight opportunities for national prestige and scientific research outside the constrained multilateral allocation of the International Space Station. Vast has secured sovereign commitments and exploratory agreements with the European Space Agency, France, the Czech Republic, and the United Kingdom, positioning Haven-1 and its precursor ISS missions as sovereign access channels. The commercial microgravity tier encompasses institutional research laboratories, pharmaceutical developers, and advanced manufacturing entities targeting orbital materials synthesis and biological experimentation. Finally, private astronaut flights cater to commercial entities and private spacefarers, providing the near-term operational foundation for Vast's human spaceflight operational architecture."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-pipeline"
    title: "Adoption Trajectory and Mission Manifest"
    body: "Vast's commercial adoption trajectory is structured sequentially, beginning with precursor private astronaut missions to the International Space Station before transitioning commercial users to the standalone Haven-1 station. In February 2026, NASA selected Vast to operate the sixth private astronaut mission to the ISS, slated to fly as early as summer 2027 with four private spacefarers aboard a SpaceX Falcon 9 and Dragon spacecraft. This formal selection establishes critical operational credibility alongside incumbent competitor Axiom Space, which previously operated the initial private ISS missions. Beyond the ISS mission, Vast is tracking an early 2027 deployment of Haven-1 as a single-module pathfinder station in low Earth orbit. However, because orbital stations require significant advance payload integration and regulatory clearances, Vast's commercial utilization remains dependent on flight-qualifying Haven-1's microgravity laboratory systems and converting early framework agreements into firm, scheduled flight manifests."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof"
    title: "Named Customer Proof and Bilateral Commitments"
    body: "Vast has accumulated verifiable sovereign and institutional partner proof across Europe and North America. Under an agreement signed in September 2026, the European Space Agency contracted with Vast for a historic first Greek astronaut mission to the ISS as part of the NASA-approved sixth private astronaut mission. Earlier in June 2026, ESA on behalf of the Czech Republic signed an agreement for an astronaut mission, following France's signature of a historic two-mission agreement covering both the ISS and Haven-1 platforms. In institutional research, Vast has partnered with Cedars-Sinai for microgravity science and crew health and expanded its payload network with organizations such as JAMSS, Interstellar Lab, and Exobiosphere. In addition, bilateral memoranda of understanding have been executed with the UK Space Agency and Lithuania's Innovation Agency. Despite these high-profile agreements, the majority of bilateral relationships remain pre-flight agreements or research MoUs rather than finalized, binding commercial seat purchases."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "retention-and-concentration-risks"
    title: "Retention Durability, Partner Dependencies, and Concentration Risks"
    body: "Because Haven-1 has not yet launched and operations remain pre-revenue, traditional software retention metrics such as Net Revenue Retention and Gross Revenue Retention are not applicable. Instead, customer durability depends on contract conversion rates and repeat mission agreements. Customer concentration risk is currently acute: sovereign space agencies and NASA represent the sole viable anchor revenue sources capable of underwriting multi-module orbital infrastructure. Vast also faces severe counterparty concentration in its launch and transportation pipeline, relying exclusively on SpaceX's Falcon 9 and Dragon capsule to deliver crews to both the ISS and Haven-1. Furthermore, internal operational adjustments—such as the August 2026 performance-related layoff of 46 employees—highlight the execution pressures inherent in scaling an aerospace manufacturing team to meet an aggressive 2027 launch window amid an evolving NASA Commercial LEO Destinations regulatory landscape."
    claimRefs:
      - "CU014"
      - "CU015"
      - "CU016"
