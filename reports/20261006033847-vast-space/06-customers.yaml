callouts:
  - calloutType: "insight"
    title: "Sovereign Precursor Strategy Mitigates Haven-1 Schedule Risk"
    body: "By securing NASA selection for the sixth private astronaut mission to the ISS alongside ESA sovereign astronaut agreements (Greece, Czech Republic, France), Vast establishes an active human spaceflight flight manifest prior to the operational deployment of Haven-1. This allows the company to generate operational flight heritage, train mission personnel, and monetize sovereign customer relationships even if orbital station integration experiences aerospace launch delays."
    claimRefs:
      - "CU005"
      - "CU009"
      - "CU010"
      - "CU011"
  - calloutType: "risk"
    title: "Sole-Source Launch Dependency and Pre-Revenue Execution Pressures"
    body: "Vast remains entirely reliant on SpaceX's Falcon 9 launcher and Dragon crew capsule for crew transit to both the ISS and Haven-1. Any Falcon 9 grounding or Dragon manifest bottleneck directly disrupts customer flight schedules. Concurrently, operational discipline was underscored in August 2026 by the performance-related layoff of 46 personnel, highlighting the tight margin for execution error as the company scales toward an early 2027 launch."
    claimRefs:
      - "CU007"
      - "CU015"
      - "CU016"
