  - id: FM001
    title: Constrained Market Sizing Pyramid for Commercial LEO Infrastructure
    type: pyramid
    summary: >-
      Layered market sizing model contrasting broad theoretical space budgets against near-term obtainable capacity on
      Vast platforms.
    data:
      nodes:
        - id: layer-1
          label: 'Layer 1: Global Civil Human Spaceflight Spend ($10B-$15B+ Annual Budgets)'
          detail: Global civil space agency budgets for LEO exploration and ISS operations.
        - id: layer-2
          label: 'Layer 2: Commercial LEO Station Procurement ($2B-$4B Multi-Year Scope)'
          detail: NASA Commercial LEO Destinations (CLD) Phase 2 development and services awards.
        - id: layer-3
          label: 'Layer 3: Addressable Sovereign Flights & Satellite Bus Spend ($500M-$1B Pipeline)'
          detail: Bilateral European astronaut missions and commercial 15kW satellite bus platform sales.
        - id: layer-4
          label: 'Layer 4: Haven-1 Commercial Lab Capacity (8 Standardized Payload Slots)'
          detail: Standardized 100W payload rack positions and four-crew two-week mission slots.
        - id: layer-5
          label: 'Layer 5: Microgravity Biomedical Pilot Research ($10M-$50M Annual Science Niche)'
          detail: Early-stage organoid, stem cell, and pharmaceutical crystal growth research grants.
        - id: layer-6
          label: 'Layer 6: Contracted Customer Revenue Backlog ($0M Firm Public Backlog)'
          detail: Exploratory memorandums of understanding without confirmed recurring revenue figures.
    approximationNotes: >-
      Pyramid illustrates narrowing market funnel from gross civil space agency budgets to Haven-1 physical capacity;
      values reflect analytical sizing lenses rather than audited company revenue projections.
