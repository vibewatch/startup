      - number: '5.2'
        title: Haven-2 Architecture and Modular LEO Expansion
        blocks:
          - type: paragraph
            body: >
              Vast's long-term commercial station strategy centers on Haven-2, an expansive multi-module space station
              architecture proposed directly to succeed the International Space Station (ISS) under NASA's Commercial
              LEO Destinations (CLD) Phase 2 program. The Haven-2 design represents an evolved, NASA-certified iteration
              of the Haven-1 baseline, engineered to expand livable volume and scientific throughput at reduced
              procurement costs for government and sovereign customers. If awarded a CLD Phase 2 contract, Vast plans to
              deploy the initial Haven-2 module in orbit by 2028, offering nearly twice the livable volume of Haven-1 by
              extending module length by five meters while retaining common avionics, power, and structural templates.

              The modular expansion plan envisions deploying three additional Haven-2 modules over a two-year deployment
              sequence, culminating in a four-module cluster operational by 2030. Each successive module is planned to
              incorporate enhanced life support capabilities, expanded research laboratory racks, and dedicated
              international partner hosting bays. Beyond 2030, Vast's architecture roadmap projects the addition of a
              7-meter diameter core module and four additional outward modules by 2032. Key technical features planned
              for the fully assembled station include a 3.8-meter diameter observation cupola, robotic manipulation
              arms, an external payload airlock, and an extravehicular activity (EVA) airlock. Vast also leverages this
              orbital hardware heritage across adjacent product lines, including Vast Satellite, a high-power satellite
              bus line utilizing station-derived components, and preliminary concepts for lunar surface habitats.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE007
              - CE016
      - number: '5.3'
        title: Vertical Integration, Test Operations, and Facility Footprint
        blocks:
          - type: paragraph
            body: >
              A defining technical pillar of Vast's engineering strategy is extensive vertical integration across
              design, manufacturing, and subsystem validation. Vast operates a distributed physical footprint in
              Southern California, anchored by its Long Beach headquarters spanning three buildings that house advanced
              manufacturing, cleanroom integration, design engineering, astronaut training assets, and mission control
              operations. Specialized manufacturing is augmented by a 25,000-square-foot additive manufacturing facility
              in Hawthorne, California, which supports rapid in-house prototyping and fabrication of complex metallic
              components for fluid and structural systems.

              Subsystem and environmental testing are conducted across dedicated testing grounds. At the Mojave Air and
              Space Port, Vast operates a dedicated test site equipped with rocket engine and structural test stands,
              supporting proof pressure testing, vibration screening, and hot-fire propulsion verification. Test
              campaigns validate fluid handling across high-risk pressurized, cryogenic, pneumatic, and life support
              systems, overseen by specialized test engineering teams. Subsystem integration follows multi-tier
              verification protocols, including software-in-the-loop (SITL) and hardware-in-the-loop (HITL) test
              benches, to execute extensive mission simulation runs before flight hardware integration. Despite high
              organizational focus on engineering velocity and testing rigor, managing diverse test facilities across
              Mojave and Long Beach introduces capital intensity and logistical coordination complexity across programs.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Critical Subsystem Dependencies, Schedule Slips, and ECLSS Risks
        blocks:
          - type: paragraph
            body: >
              While Vast demonstrates meaningful technical progress and flight heritage through Haven Demo, its
              technical execution remains exposed to significant single-point dependencies and developmental
              bottlenecks. The most critical external dependency is Vast's near-total reliance on SpaceX across launch
              vehicles, crew transport, and broadband telemetry. Haven-1 relies exclusively on the SpaceX Falcon 9 for
              orbital launch and SpaceX Crew Dragon for human rendezvous, docking, and return missions. Any technical
              grounding, launch cadence disruption, or pricing adjustment within the Falcon 9 or Dragon fleets directly
              compromises Haven-1 mission schedules and financial margins.

              Schedule risk is another verified operational challenge. Initially targeted for launch as early as 2025 or
              mid-2026, Haven-1's launch readiness has slipped to 2027 as assembly, qualification, and integrated fluid
              systems verification matured. Furthermore, Haven-1 employs an open-loop Environmental Control and Life
              Support System (ECLSS), depending on consumable oxygen and nitrogen storage with limited air
              revitalization suited primarily for short-duration missions of approximately two weeks. Achieving
              multi-month continuous crew operations on Haven-2 requires transitioning to closed-loop regenerative ECLSS
              and verified in-space fluid transfer, technologies that remain unvalidated in Vast's orbital operations.
              Additionally, while Vast's ultimate corporate ambition includes artificial-gravity rotating habitats, all
              near-term architectures remain zero-gravity platforms, reflecting a substantial gap between long-term
              marketing vision and current hardware qualification.
            claimRefs:
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE012
              - CE013
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demonstrated Flight Heritage via Haven Demo
            body: >
              Vast's successful deployment and three-month operation of Haven Demo provides empirical flight validation
              of its avionics, flight software, power conditioning, and propulsion subsystems that few competing
              commercial station startups possess.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
          - type: callout
            title: Total Single-Source SpaceX Dependency
            body: >
              Haven-1 is architecturally bound to SpaceX across three critical functions: Falcon 9 orbital launch, Crew
              Dragon astronaut transport, and Starlink broadband telemetry. Any operational pause or pricing surge
              within SpaceX directly threatens Vast's launch cadence and operational viability.
            calloutType: risk
            claimRefs:
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Markets
        blocks:
          - type: paragraph
            body: >-
              Vast Space segments its customer opportunity across three distinct buyer categories: sovereign human
              spaceflight programs, commercial and institutional microgravity research consortia, and private astronaut
              commercial missions. Sovereign customers represent the highest-value tier, as nation-states seek dedicated
              human spaceflight opportunities for national prestige and scientific research outside the constrained
              multilateral allocation of the International Space Station. Vast has secured sovereign commitments and
              exploratory agreements with the European Space Agency, France, the Czech Republic, and the United Kingdom,
              positioning Haven-1 and its precursor ISS missions as sovereign access channels. The commercial
              microgravity tier encompasses institutional research laboratories, pharmaceutical developers, and advanced
              manufacturing entities targeting orbital materials synthesis and biological experimentation. Finally,
              private astronaut flights cater to commercial entities and private spacefarers, providing the near-term
              operational foundation for Vast's human spaceflight operational architecture.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory and Mission Manifest
        blocks:
          - type: paragraph
            body: >-
              Vast's commercial adoption trajectory is structured sequentially, beginning with precursor private
              astronaut missions to the International Space Station before transitioning commercial users to the
              standalone Haven-1 station. In February 2026, NASA selected Vast to operate the sixth private astronaut
              mission to the ISS, slated to fly as early as summer 2027 with four private spacefarers aboard a SpaceX
              Falcon 9 and Dragon spacecraft. This formal selection establishes critical operational credibility
              alongside incumbent competitor Axiom Space, which previously operated the initial private ISS missions.
              Beyond the ISS mission, Vast is tracking an early 2027 deployment of Haven-1 as a single-module pathfinder
              station in low Earth orbit. However, because orbital stations require significant advance payload
              integration and regulatory clearances, Vast's commercial utilization remains dependent on
              flight-qualifying Haven-1's microgravity laboratory systems and converting early framework agreements into
              firm, scheduled flight manifests.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU011
      - number: '6.3'
        title: Named Customer Proof and Bilateral Commitments
        blocks:
          - type: paragraph
            body: >-
              Vast has accumulated verifiable sovereign and institutional partner proof across Europe and North America.
              Under an agreement signed in September 2026, the European Space Agency contracted with Vast for a historic
              first Greek astronaut mission to the ISS as part of the NASA-approved sixth private astronaut mission.
              Earlier in June 2026, ESA on behalf of the Czech Republic signed an agreement for an astronaut mission,
              following France's signature of a historic two-mission agreement covering both the ISS and Haven-1
              platforms. In institutional research, Vast has partnered with Cedars-Sinai for microgravity science and
              crew health and expanded its payload network with organizations such as JAMSS, Interstellar Lab, and
              Exobiosphere. In addition, bilateral memoranda of understanding have been executed with the UK Space
              Agency and Lithuania's Innovation Agency. Despite these high-profile agreements, the majority of bilateral
              relationships remain pre-flight agreements or research MoUs rather than finalized, binding commercial seat
              purchases.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Retention Durability, Partner Dependencies, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Because Haven-1 has not yet launched and operations remain pre-revenue, traditional software retention
              metrics such as Net Revenue Retention and Gross Revenue Retention are not applicable. Instead, customer
              durability depends on contract conversion rates and repeat mission agreements. Customer concentration risk
              is currently acute: sovereign space agencies and NASA represent the sole viable anchor revenue sources
              capable of underwriting multi-module orbital infrastructure. Vast also faces severe counterparty
              concentration in its launch and transportation pipeline, relying exclusively on SpaceX's Falcon 9 and
              Dragon capsule to deliver crews to both the ISS and Haven-1. Furthermore, internal operational
              adjustments—such as the August 2026 performance-related layoff of 46 employees—highlight the execution
              pressures inherent in scaling an aerospace manufacturing team to meet an aggressive 2027 launch window
              amid an evolving NASA Commercial LEO Destinations regulatory landscape.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sovereign Precursor Strategy Mitigates Haven-1 Schedule Risk
            body: >-
              By securing NASA selection for the sixth private astronaut mission to the ISS alongside ESA sovereign
              astronaut agreements (Greece, Czech Republic, France), Vast establishes an active human spaceflight flight
              manifest prior to the operational deployment of Haven-1. This allows the company to generate operational
              flight heritage, train mission personnel, and monetize sovereign customer relationships even if orbital
              station integration experiences aerospace launch delays.
            calloutType: insight
            claimRefs:
              - CU005
              - CU009
              - CU010
              - CU011
          - type: callout
            title: Sole-Source Launch Dependency and Pre-Revenue Execution Pressures
            body: >-
              Vast remains entirely reliant on SpaceX's Falcon 9 launcher and Dragon crew capsule for crew transit to
              both the ISS and Haven-1. Any Falcon 9 grounding or Dragon manifest bottleneck directly disrupts customer
              flight schedules. Concurrently, operational discipline was underscored in August 2026 by the
              performance-related layoff of 46 personnel, highlighting the tight margin for execution error as the
              company scales toward an early 2027 launch.
            calloutType: risk
            claimRefs:
              - CU007
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked Risk Posture and Regulatory Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Schedule and integration are the most immediate evidenced risks because an independent assessment reports
              that Haven-1 moved from a May 2026 target to no earlier than Q1 2027, while Vast's September update
              described the flight article as still in final integration with launch anticipated in 2027. Regulatory,
              legal, crew-safety, export-control, privacy, and cybersecurity conclusions require more restraint: the
              assigned source pool identifies regulatory and legal leadership, but it does not document specific
              licenses, approvals, certifications, enforcement matters, or incident history. The register therefore
              labels those statuses unverified rather than treating a missing public record as proof of either
              compliance or noncompliance. NASA procurement concentration is separately evidenced by independent
              analysis and is ranked as a critical commercial dependency rather than a regulatory finding.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR009
              - CR012
              - CR015
      - number: '7.2'
        title: Operational Critical Path, Quality, and Security
        blocks:
          - type: paragraph
            body: >-
              Vast's integration model removes some supplier handoffs but concentrates the remaining external
              dependencies at the critical path. Ex Terra identifies solar arrays and thrusters as outsourced and
              highlights docking hardware, avionics, and mission computers as launch- readiness dependencies; it also
              describes solar-array capacity as contested across civil and defense programs. Mitigation evidence is
              tangible but incomplete: Vast reports final integration, a Long Beach headquarters spanning three
              buildings, a Hawthorne additive- manufacturing facility, and a Mojave test site, while its leadership page
              describes senior human-spaceflight and security-infrastructure experience. Those disclosures do not
              provide supplier commitments, qualification margins, endurance-test results, cyber controls, or incident
              records. Residual operational risk therefore remains high until dated acceptance evidence and test closure
              replace organizational capability claims.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR008
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.3'
        title: Partner Concentration, Capital Exposure, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              SpaceX is a multi-service concentration rather than a conventional vendor relationship: independent
              analysis says Vast relies on Falcon 9, Dragon, and Starlink for launch, crew transportation, and
              connectivity, and that no equivalent US crew-transport substitute is integrated into Haven. NASA is a
              second concentration because Sacra identifies post-ISS anchor demand as central to commercial-station
              economics. Financing reduces near-term funding pressure but does not prove liquidity: the March 2026
              package comprised $300 million of equity and $200 million of debt, while neither retained financing source
              discloses debt pricing, covenants, cash available, or runway. Investment monitoring should therefore focus
              on dated integration and supplier milestones, regulatory evidence, a credible SpaceX-contingency plan,
              NASA award progress, and debt terms. A further material schedule slip without added liquidity, loss of
              credible NASA anchor demand, or inability to evidence crew-safety readiness would break the current
              execution thesis.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The $500 million March 2026 financing is split between equity and debt. Without cash-balance, debt-term,
              and operating-spend evidence, it cannot be converted into a cash-available or runway estimate.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports research-more rather than a price-insensitive investment. Vast closed a $500
              million financing composed of $300 million of Series A equity and $200 million of debt, taking reported
              total funding above $1 billion. That capital base improves the probability that the company can continue
              hardware integration, but funding raised is not cash available and the debt component introduces an
              unquantified senior claim. None of the allocated financing coverage provides Vast's current equity
              valuation, debt covenants, liquidation preferences, or revenue baseline. Without those inputs, an entry
              multiple, dilution-adjusted ownership case, and target return cannot be calculated responsibly. Investment
              interest should therefore remain conditional on price disclosure and financing-document review.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV013
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on a financed, hardware-first attempt to establish a commercial station before the ISS
              transition, supported by Haven Demo flight heritage, a planned 2027 Haven-1 launch, and leadership with
              human-spaceflight and capital-markets experience. The anti-thesis is equally material: Vast missed the
              first NASA station-award round and still needs future institutional selection, technical execution, launch
              availability, customer conversion, and favorable financing terms. A reported 46-person reduction,
              described as roughly 4% of the workforce, is not by itself evidence of distress because hiring reportedly
              continued, but it reinforces the need to test schedule and organizational resilience. The evidence favors
              optionality, not underwriting certainty.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario framework without false precision
        blocks:
          - type: paragraph
            body: >-
              A milestone-contingent framework is more defensible than a conventional revenue multiple because the
              source set contains no audited revenue, contracted backlog, gross margin, cash balance, or disclosed Vast
              valuation. In the bull case, on-time Haven-1 execution and institutional demand would improve financing
              access and support a premium. The base case assumes continued technical progress but requires more capital
              before commercial proof, making return dependent on entry price and dilution. The bear case combines
              schedule slippage, weak contract conversion, or restrictive debt with multiple compression. These are
              directional outcomes rather than numerical valuation ranges; the missing private-company inputs are a
              material diligence gap.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Management includes a CFO with stated experience in private and public M&A, IPOs, and capital raises,
              while Vast reports operating infrastructure spanning manufacturing, environmental testing, government
              affairs, and mission-support locations. Those capabilities improve organizational readiness but do not
              establish exit timing or liquidity. Before an investment decision, diligence should obtain the post-money
              capitalization, preference stack, debt maturity and covenants, cash runway, milestone budget, signed
              customer commitments, and NASA-selection economics. Thesis-break triggers are a material Haven-1 schedule
              slip without added liquidity, inability to convert flight proof into contracted demand, debt terms that
              crowd out equity value, or a financing price that assumes successful commercialization before those
              milestones are demonstrated.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline is the gating issue
            body: >-
              Treat the $500 million financing as evidence of capital access, not evidence that the equity is
              attractively priced. Require the current post-money capitalization, preference stack, debt terms, and
              milestone-adjusted runway before moving beyond research-more.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
              - CV015
