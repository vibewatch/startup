            body: >-
              The assigned evidence consistently identifies four direct commercial-station contenders: Vast, Axiom
              Space, Orbital Reef, and Starlab. That peer set is narrower than the full buyer-choice landscape. Craft
              also lists Nanoracks, SpacePharma, Vantor, and NASA's Jet Propulsion Laboratory as alternatives, but its
