              tone: critical
            - label: Critical
              detail: Another slip delays station proof and weakens the timing case.
              tone: critical
            - label: Developing
              detail: Final integration is disclosed; test closure and margin are not.
              tone: warning
        - label: SpaceX concentration
          values:
            - label: Scenario risk
              detail: No failure probability is disclosed.
              tone: warning
            - label: Critical
              detail: Launch, crew transport, return, and connectivity are concentrated.
              tone: critical
            - label: Limited substitute
              detail: No equivalent integrated US crew transport is identified by Sacra.
              tone: critical
        - label: NASA anchor demand
          values:
            - label: Uncertain
              detail: Award status and timing are not established by the pool.
              tone: warning
            - label: Critical
              detail: Independent analysis ties station economics to NASA anchor demand.
              tone: critical
            - label: Flight-proof path
              detail: Haven-1 can provide evidence before the larger station.
              tone: warning
        - label: Capital and debt
          values:
            - label: Uncertain
              detail: Cash balance, burn, debt terms, and runway are not disclosed.
              tone: warning
            - label: High
              detail: Development costs precede operating revenue.
              tone: critical
            - label: $500M financing
              detail: $300M equity plus $200M debt; not treated as current cash.
              tone: warning
        - label: Critical-component supply
          values:
            - label: Medium-high
              detail: Outsourcing and reported capacity pressure are evidenced.
              tone: critical
            - label: High
              detail: Late flight hardware can block integrated testing.
              tone: critical
            - label: Partial
              detail: Vertical integration reduces, but does not remove, supplier exposure.
