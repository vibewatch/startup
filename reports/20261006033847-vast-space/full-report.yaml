      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Vast has accumulated over $1.0 billion in cumulative private funding commitments, anchored initially by
              personal capital from founder Jed McCaleb and followed by institutional expansions. In March 2026, the
              company secured a $500 million financing package comprising $300 million in Series A equity led by
              Balerion Space Ventures and $200 million in debt facilities. In mid-2026, Andreessen Horowitz (a16z) led a
              subsequent $250 million round that valued Vast at $5.5 billion. While this liquidity buffer provides
              estimated runway into 2027, forward capital requirements remain extraordinarily high. The $200 million
              debt layer introduces potential debt service or covenant triggers prior to commercial revenue generation,
              and long-term solvency depends heavily on winning a competitive NASA Commercial LEO Destinations (CLD)
              Phase 2 contract award. Without audited financial filings, firm contract backlogs, or disclosed customer
              margins, institutional underwriting must treat Vast as a high-conviction, binary venture bet rather than a
              mature commercial investment.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
