      - number: '2.2'
        title: Market Sizing, Commercial Reality, and Constrained Demand Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the commercial space station and orbital infrastructure market requires distinguishing between
              theoretical total addressable market projections and near-term, evidence-constrained customer spend.
              Historical market analyses that extrapolated orbital industrialization into multi-hundred-billion-dollar
              TAMs are increasingly replaced by discipline anchored to actual government agency budgets and near-term
              mission contracts. Addressable demand is segmented into four distinct layers: an expansive Total
              Addressable Market (TAM) representing global civil government human spaceflight and commercial orbital
              exploration budgets; a Serviceable Addressable Market (SAM) comprising civil agency LEO destination
              procurement (principally NASA Commercial LEO Destinations Phase 2, ESA, and international partners); an
              addressable commercial satellite platform market; and a near-term Serviceable Obtainable Market (SOM)
              constrained by Haven-1's four-occupant, two-week visit architecture and the capacity of SpaceX Dragon crew
              transportation. Independent market reporting notes that unlike the 2021 SPAC bubble where valuations
              tracked multi-decade TAM projections, 2026 space funding and commercial assessments require proof of
              contracted missions and near-term cash generation. Vast's immediate obtainable spend is capped by its
              pathfinder capacity: Haven-1 provides 45 cubic meters of habitable volume within an 80-cubic-meter
              pressurized envelope, operating eight standardized payload slots at 100 watts of continuous electrical
              power each. Consequently, revenue potential across initial flights is structurally bounded by available
              astronaut seats and small-scale payload capacity rather than unconstrained orbital manufacturing volume.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
