  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Structural Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The commercial low Earth orbit (LEO) infrastructure market encompasses orbital human habitation
              facilities, microgravity research laboratory slots, national astronaut mission operations, and
              standardized spacecraft platforms designed to operate in Earth orbit and cis-lunar space. Addressable
              spend is anchored by sovereign human spaceflight budgets transitioning away from the International Space
              Station (ISS), which is scheduled for retirement and controlled deorbit at the end of 2030. Included
              within this market boundary are pressurized module habitats, flight computers, power and propulsion
              subsystems, environmental control and life-support systems (ECLSS), payload rack integration, crew return
              operations, and commercial satellite bus platforms. Specifically excluded from core station spend are
              orbital launch vehicle manufacturing, heavy-lift launch operations (such as SpaceX Falcon 9 or Starship
              launches, which represent supplier inputs rather than destination spend), ground network ground stations,
              and suborbital space tourism flights (such as Blue Origin New Shepard or Virgin Galactic). Adjacencies
              include commercial satellite manufacturing—where Vast is expanding via 15-kilowatt-class satellite bus
              product lines—and lunar surface infrastructure, encompassing proposed lunar power equipment, airlocks, and
              lunar positioning satellites. Status-quo substitutes currently consist of continued operations aboard the
              ISS, uncrewed commercial rideshare platforms, orbital automated capsules (such as Varda Space Industries),
              and ground-based drop towers or parabolic flight laboratories.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
