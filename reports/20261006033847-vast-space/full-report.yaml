  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Haven-1 Station Architecture and Subsystem Provenance
        blocks:
          - type: paragraph
            body: >
              Vast Space's near-term product architecture centers on Haven-1, designed as a single-module commercial
              space station capable of supporting human habitation, scientific experimentation, and commercial payloads
              in low Earth orbit (LEO). Following the completion of the uncrewed Haven Demo orbital mission, which
              completed 49 on-orbit test objectives and made Vast the only commercial space station developer to fly and
              operate its own spacecraft, engineering efforts transitioned toward qualifying human-rated station
              subsystems. The Haven-1 primary structure consists of an aluminum pressure vessel manufactured and
              integrated in-house, supported by specialized facilities in Long Beach and Hawthorne, California.

              Avionics, flight software, guidance, navigation, and control (GNC), and power distribution architectures
              draw directly on the flight-proven hardware designs from Haven Demo. Attitude control and stabilization
              incorporate momentum management systems augmented by storable non-toxic chemical propulsion. External
              communications are designed around an integrated SpaceX Starlink broadband laser link, intended to provide
              high-bandwidth, low-latency connectivity for onboard science instrumentation and live astronaut
              communications. Crew accommodations within the pressurized volume provide habitable common areas,
              dedicated sleep cabins, and scientific payload racks. However, primary station subsystems—including life
              support and full thermal management—still require integrated testing under simulated space environments,
              leaving flight-proven validation concentrated in uncrewed demonstration systems rather than pressurized
              human-in-the-loop operations.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
