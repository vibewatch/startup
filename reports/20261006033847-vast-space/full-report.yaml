      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption across the commercial orbital destination ecosystem is governed by three primary customer
              classes: sovereign national space agencies, institutional microgravity researchers, and commercial
              satellite / defense platform buyers. Sovereign governments represent the most immediate, creditworthy
              payer category. National astronaut missions have distinct purchasing rationale from commercial leisure
              travel, driven by domestic industrial participation, STEM leadership, scientific return, and national
              space sovereignty without the requirement to build sovereign crewed spacecraft. Vast has validated this
              segment by signing bilateral mission agreements with France, the European Space Agency (on behalf of the
              Czech Republic), and Greece for prospective flights involving European astronauts. However, national
              astronaut spending remains tethered to annual public appropriations and diplomatic approvals, preventing
              automatic multi-year repeat purchasing. The institutional research segment encompasses biomedical research
              institutions (such as Cedars-Sinai and UC San Diego Sanford Stem Cell Institute) and commercial
              biotechnology developers (LambdaVision, BioOrbit, Auxilium Biotechnologies, and Exobiosphere) exploring
              cell organoids and specialized manufacturing in microgravity. Yet, scientific interest does not guarantee
              a commercial recurring service: public agreements remain structured as non-binding memorandums of
              understanding or collaborative exploratory agreements rather than disclosed revenue backlogs. Key adoption
              bottlenecks include the cost of orbital transportation via SpaceX Dragon, rigorous postflight sample
              validation requirements, payload power constraints, and operational uncertainties surrounding Haven-1's
              scheduled 2027 orbital readiness.
