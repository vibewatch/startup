    columns:
      - Failure Mode
      - Likelihood
      - Severity
      - Mitigation Maturity
      - Residual Exposure
      - Unresolved Gap
    rows:
      - - Haven-1 integration or test schedule slips again
        - High relative to other risks because the target already moved
        - Critical
        - 'Developing: final integration disclosed, but test closure is not'
        - Further delay compresses flight proof ahead of Haven-2 and NASA decisions
        - Dated environmental-test plan, acceptance criteria, schedule margin, and closure evidence
      - - Externally sourced solar arrays or thrusters miss delivery or qualification
        - Medium-high based on disclosed outsourcing and reported capacity pressure
        - High
        - 'Partial: primary-structure integration is internal, but these components remain external'
        - A late flight-critical component can block system-level integration
        - Supplier identities, binding delivery dates, allocation priority, qualification status, and remedies
      - - Docking hardware, avionics, or mission computers delay launch readiness
        - Medium
        - High
        - 'Unclear: the independent source identifies the dependency but not closure status'
        - Integration progress can be stranded by an unqualified external or sub-tier component
        - Make-or-buy map, hardware acceptance status, long-lead inventory, and alternate-source qualification
      - - Multi-site scaling or human-spaceflight execution fails to convert capability into accepted hardware
        - Medium
        - High
        - 'Moderate: facilities and experienced leaders are disclosed'
        - A large footprint and experienced staff do not guarantee integrated-system reliability
        - Quality escapes, rework rates, test pass rates, turnover in critical roles, and corrective-action closure
      - - Cybersecurity or mission-systems assurance is inadequate
        - Unrated
        - Critical if flight or mission-control systems are compromised
        - 'Early evidence: security-infrastructure leadership is disclosed, but controls are not'
        - No retained source establishes certification, penetration-test results, incidents, or recovery readiness
        - Security architecture, independent assessments, incident log, recovery tests, and supplier-access controls
    notes: >-
      Qualitative rankings use disclosed schedule history, dependency evidence, and mitigation maturity. No numerical
      failure probabilities, incident-free claim, or component delivery assurance is inferred.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR011
      - CR013
      - CR014
      - CR016
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - Launch, crew transportation, cargo return, and connectivity
        - SpaceX
        - Falcon 9, Dragon, and Starlink services
        - Concentrated across multiple mission-critical layers
        - Dragon grounding, pricing or schedule change, or strategic competition disrupts the offering
        - Critical
        - Using flight-proven third-party systems avoids duplicating those development programs
        - Sacra reports no equivalent US crew-transport substitute integrated into Haven
      - - Post-ISS anchor demand
        - NASA
        - Potential Commercial LEO Destinations customer and program sponsor
        - High commercial-model exposure
        - >-
          No major award or a changed procurement architecture leaves fixed station costs without enough anchor
          utilization
        - Critical
        - Haven-1 flight proof can reduce execution uncertainty before Haven-2
        - Award status, economics, timing, and demand without NASA remain unverified
      - - Equity and debt financing
        - Balerion-led investors and debt providers
        - $300 million Series A equity and $200 million debt financing
        - Debt adds contractual obligations before operating revenue is established
        - Schedule delay consumes resources while undisclosed debt terms constrain flexibility
        - High
        - $500 million of announced financing expands available funding sources
        - >-
          Funding raised is not cash available; debt pricing, covenants, maturity, cash balance, and runway are
          undisclosed
    notes: >-
      Concentration and failure scenarios are evidence-bounded qualitative assessments. The financing amount is not
      treated as current cash, revenue, ARR, or runway.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision element
      - Assessment
      - Investment implication
    rows:
      - - Recommendation
        - Research more
        - Do not underwrite until price, terms, and commercial evidence are disclosed.
      - - Confidence
        - Medium
        - Financing and milestones are reported, but core valuation inputs remain private.
      - - Risk rating
        - High
        - Technical, institutional, financing, and commercialization outcomes remain coupled.
      - - Valuation stance
        - Indeterminate and price-sensitive
        - Public evidence does not support a current entry multiple or equity-value range.
      - - Entry discipline
        - Milestone- and terms-gated
        - Require capitalization, debt, runway, and customer-contract diligence before pricing.
    notes: >-
      Assessments use the allocated public source set as of 2026-10-06; no current Vast valuation, audited revenue, or
      debt terms were available, so no numerical return estimate is shown.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV014
      - CV015
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-based argument
      - What would change the view
    rows:
      - - 'Thesis: capitalization'
        - The 2026 financing added $500 million and reported total funding exceeded $1 billion.
        - A short runway or restrictive debt package would weaken the apparent capital advantage.
      - - 'Thesis: technical proof'
        - Haven Demo flew in 2025 and Haven-1 is planned for 2027.
        - A verified integration or launch delay without a funded recovery plan would weaken execution confidence.
      - - 'Thesis: institutional pathway'
        - NASA selected Vast for a private ISS mission, adding operational relevance.
        - >-
          Failure to translate the mission into broader institutional or commercial demand would limit valuation
          support.
      - - 'Anti-thesis: award dependency'
        - Vast missed the first NASA station-award round and is pursuing phase two.
        - A funded award with defined economics would reduce institutional-demand uncertainty.
      - - 'Anti-thesis: financing opacity'
        - The allocated evidence discloses round size and mix but not valuation, covenants, or preferences.
        - Full financing documents and a capitalization table are required to assess equity downside.
      - - 'Anti-thesis: execution signal'
        - An independent report described 46 layoffs while also reporting 277 open roles.
        - Updated headcount, attrition, hiring completion, and milestone staffing would resolve the mixed signal.
    notes: >-
      The table separates reported facts from diligence thresholds; workforce figures are secondary reporting, and
      financing terms beyond the equity/debt split remain undisclosed.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Haven-1 reaches flight on the stated 2027 schedule; NASA and commercial demand convert; financing remains
          available on non-punitive terms.
        - >-
          No numerical range is supportable; successful flight and contracted demand could justify a premium to the next
          priced round.
        - Low-to-moderate until schedule and contract evidence is supplied.
        - Launch slip, failed technical milestone, or absence of contracted demand.
      - - Base
        - >-
          Hardware progress continues, but commercialization and institutional awards lag and additional capital is
          required.
        - Return is dominated by entry price, dilution, and debt seniority; value should be staged against milestones.
        - Most consistent with the current mixed evidence.
        - Runway pressure forces a down round or preference-heavy financing.
      - - Bear
        - >-
          Schedule slips, NASA selection does not materialize, customer commitments remain non-binding, or debt
          constrains new equity.
        - >-
          Equity value could compress materially, but a numerical floor is not supportable without asset, liability, and
          preference data.
        - Material tail risk given coupled technical and financing dependencies.
        - Insufficient liquidity to fund the next proof point or debt terms that impair common-equity recovery.
    notes: >-
      Scenario ranges are intentionally qualitative because the allocated evidence contains no current Vast valuation,
      revenue baseline, cash balance, cap table, or debt terms; probability labels are analytical signals, not measured
      frequencies.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV014
      - CV015
