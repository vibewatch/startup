              Vast's March 2026 financing included a $200 million debt tranche alongside $300 million in equity. For an
              aerospace venture that has not commenced commercial revenue flights, carrying substantial debt introduces
              rigid debt-service covenants and refinancing vulnerability if the 2027 Haven-1 launch or customer
