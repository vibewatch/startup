            body: >-
              Vast's potential moat is executional rather than proven economic lock-in. Founder Jed McCaleb described a
              bias toward building in-house to reduce supplier dependence, while also acknowledging that the larger
              station vision benefits from Starship. Official surfaces claim more than 1,000 experts and purpose-built
