      - number: '4.2'
        title: Cost Structure, Go-To-Market Execution, and Labor Dynamics
        blocks:
          - type: paragraph
            body: >-
              Developing human-rated space stations requires heavy front-loaded capital expenditures and steep
              operational overhead across distributed manufacturing and specialized testing infrastructure. Vast
              operates a 25,000-square-foot additive manufacturing facility in Hawthorne, California, an engine and
              structural test site at Mojave Air and Space Port, a government affairs office near the White House in
              Washington, D.C., and regional operational offices in Houston and Tokyo. The firm's workforce exceeds
              1,000 personnel, comprising substantial engineering and mission operations talent recruited from SpaceX
              and NASA. Go-to-market execution relies on direct bilateral engagement with sovereign space agencies
              (NASA, ESA, JAXA) and institutional payload research sponsors. In August 2026, Vast underwent an internal
              performance review cycle resulting in the layoff of 46 employees (approximately 4% of total headcount),
              while simultaneously advertising more than 270 open engineering and business development roles. This
              workforce rebalancing underscores the relentless payroll burn necessary to maintain development velocity
              toward the 2027 Haven-1 orbital milestone.
