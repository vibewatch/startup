  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanisms, and Commercial Pipeline
        blocks:
          - type: paragraph
            body: >-
              Vast Space operates as a pre-commercial orbital infrastructure developer preparing its pathfinder station,
              Haven-1, for launch in 2027 aboard a SpaceX Falcon 9 rocket, to be followed by the modular Haven-2 station
              targeted as a successor to the International Space Station (ISS). The company's future revenue
              architecture is organized around three primary commercial monetization vectors: private astronaut orbital
              expedition missions, sovereign/space-agency astronaut flight contracts, and microgravity payload research
              and manufacturing capacity. In February 2026, Vast announced a definitive agreement with NASA to operate a
              private astronaut mission to the ISS scheduled for summer 2027, sending four non-government astronauts to
              orbit for up to 14 days aboard a SpaceX Falcon 9 and Dragon capsule. In addition to crewed outpost
              services, Vast has announced the Vast Satellite product line, designed to adapt space station avionics,
              power, and bus sub-systems for high-power orbital satellite manufacturing and sales. However, official
              list pricing across all station lines remains undisclosed, and third-party firmographic estimates of
              trailing annual sales reflect statistical model evaluations rather than audited operational revenue.
