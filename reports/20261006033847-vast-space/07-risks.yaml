company:
  name: "Vast Space"
chapter:
  number: 7
  title: "Risks"
  summary: "Vast's highest evidenced risks are a schedule that has already moved to no earlier than Q1 2027, concentrated reliance on SpaceX, constrained outsourced flight components, and capital intensity ahead of operating revenue. The assigned evidence shows meaningful mitigants in integration progress, facilities, leadership, and financing, but does not establish regulatory approvals, debt terms, cash runway, cybersecurity assurance, or supplier delivery commitments."
sections:
  - id: "ranked-risk-posture"
    title: "Ranked Risk Posture and Regulatory Evidence Gaps"
    body: >-
      Schedule and integration are the most immediate evidenced risks because an independent
      assessment reports that Haven-1 moved from a May 2026 target to no earlier than Q1 2027,
      while Vast's September update described the flight article as still in final integration
      with launch anticipated in 2027. Regulatory, legal, crew-safety, export-control, privacy,
      and cybersecurity conclusions require more restraint: the assigned source pool identifies
      regulatory and legal leadership, but it does not document specific licenses, approvals,
      certifications, enforcement matters, or incident history. The register therefore labels
      those statuses unverified rather than treating a missing public record as proof of either
      compliance or noncompliance. NASA procurement concentration is separately evidenced by
      independent analysis and is ranked as a critical commercial dependency rather than a
      regulatory finding.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR009"
      - "CR012"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operational-critical-path"
    title: "Operational Critical Path, Quality, and Security"
    body: >-
      Vast's integration model removes some supplier handoffs but concentrates the remaining
      external dependencies at the critical path. Ex Terra identifies solar arrays and thrusters
      as outsourced and highlights docking hardware, avionics, and mission computers as launch-
      readiness dependencies; it also describes solar-array capacity as contested across civil
      and defense programs. Mitigation evidence is tangible but incomplete: Vast reports final
      integration, a Long Beach headquarters spanning three buildings, a Hawthorne additive-
      manufacturing facility, and a Mojave test site, while its leadership page describes senior
      human-spaceflight and security-infrastructure experience. Those disclosures do not provide
      supplier commitments, qualification margins, endurance-test results, cyber controls, or
      incident records. Residual operational risk therefore remains high until dated acceptance
      evidence and test closure replace organizational capability claims.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR011"
      - "CR013"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "dependency-capital-kill-criteria"
    title: "Partner Concentration, Capital Exposure, and Kill Criteria"
    body: >-
      SpaceX is a multi-service concentration rather than a conventional vendor relationship:
      independent analysis says Vast relies on Falcon 9, Dragon, and Starlink for launch, crew
      transportation, and connectivity, and that no equivalent US crew-transport substitute is
      integrated into Haven. NASA is a second concentration because Sacra identifies post-ISS
      anchor demand as central to commercial-station economics. Financing reduces near-term
      funding pressure but does not prove liquidity: the March 2026 package comprised $300
      million of equity and $200 million of debt, while neither retained financing source
      discloses debt pricing, covenants, cash available, or runway. Investment monitoring should
      therefore focus on dated integration and supplier milestones, regulatory evidence, a
      credible SpaceX-contingency plan, NASA award progress, and debt terms. A further material
      schedule slip without added liquidity, loss of credible NASA anchor demand, or inability to
      evidence crew-safety readiness would break the current execution thesis.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR010"
    tableRefs:
      - "TR003"
