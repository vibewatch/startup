company:
  name: "Vast Space"
chapter:
  number: 3
  title: "Competitors"
  summary: "Vast competes most directly with Axiom Space, Orbital Reef, and Starlab, while the ISS, specialist orbital-service providers, and bespoke sovereign infrastructure remain alternatives to buying from a new station operator. Its clearest differentiation is early proprietary flight experience and vertical integration, but public evidence does not establish durable pricing power, customer lock-in, or independence from launch and institutional distribution partners."

sections:
  - id: "landscape-and-buyer-alternatives"
    title: "Landscape and Buyer Alternatives"
    body: >-
      The assigned evidence consistently identifies four direct commercial-station contenders:
      Vast, Axiom Space, Orbital Reef, and Starlab. That peer set is narrower than the full
      buyer-choice landscape. Craft also lists Nanoracks, SpacePharma, Vantor, and NASA's Jet
      Propulsion Laboratory as alternatives, but its list does not demonstrate that those
      organizations sell equivalent crewed-station capacity. Buyers can also remain on the ISS
      while it is available, procure specialist payload services, defer missions, or pursue
      bespoke sovereign infrastructure. Internal build is therefore a conceptual substitute,
      not a validated near-term peer in this source set. The profile table treats unsupported
      scale, pricing, and capability fields as unknown rather than converting adjacency into
      direct competition.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP014"
    tableRefs:
      - "TP001"

  - id: "architecture-execution-and-distribution"
    title: "Architecture, Execution, and Distribution"
    body: >-
      The direct competitors pursue materially different deployment and distribution paths.
      BlacKnight describes Vast as a single-launch-module developer, Axiom as an ISS-attached
      transition platform, Orbital Reef as a Blue Origin and Sierra Space consortium, and
      Starlab as a Voyager Space and Airbus collaboration. Vast's flight-history advantage is
      partly company-claimed: its media page says Haven Demo operated in 2025 and that Haven-1
      is expected to launch in 2027, while independent coverage also describes the demo and
      launch plan. Axiom's private-astronaut-mission experience provides a different form of
      operating and customer proof. Orbital Reef and Starlab may compensate for less visible
      station-specific hardware with launch, aerospace, and government-channel partners.
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP007"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"

  - id: "packaging-switching-and-trust"
    title: "Packaging, Switching, and Trust"
    body: >-
      Public packaging is not yet comparable. The reviewed sources describe target uses and
      institutional routes, but do not disclose like-for-like commercial station rate cards,
      discount schedules, service-level terms, or realized contract economics. Axiom's private
      astronaut missions indicate an operating route to customer relationships; Starlab's
      Airbus connection points toward European institutional access; and Vast's offices in
      Washington, Japan, and Houston signal investment in policy and partner proximity. Vast
      also highlights leadership experience in Dragon integration and crewed missions. These
      signals support distribution and trust hypotheses, not proof of customer lock-in.
      Switching costs, multi-homing rights, qualification portability, and ownership of
      experiment interfaces remain private-contract diligence items.
    claimRefs:
      - "CP005"
      - "CP007"
      - "CP011"
      - "CP012"
      - "CP015"
    tableRefs:
      - "TP003"

  - id: "moat-durability-and-adverse-signals"
    title: "Moat Durability and Adverse Signals"
    body: >-
      Vast's potential moat is executional rather than proven economic lock-in. Founder Jed
      McCaleb described a bias toward building in-house to reduce supplier dependence, while
      also acknowledging that the larger station vision benefits from Starship. Official
      surfaces claim more than 1,000 experts and purpose-built manufacturing and test sites;
      those assets can shorten iteration cycles but also increase fixed-cost exposure. The
      adverse counter-signal is organizational: NewsBytes reported 46 layoffs, about 4% of the
      workforce, alongside 277 open roles. Taken together, the evidence supports a relative
      lead in hardware execution and integration depth, but not yet a durable moat in pricing,
      contracted demand, launch access, or government procurement.
    claimRefs:
      - "CP008"
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP013"
      - "CP016"

