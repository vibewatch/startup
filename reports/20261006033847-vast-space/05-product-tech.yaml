callouts:
  - calloutType: strength
    title: "Demonstrated Flight Heritage via Haven Demo"
    body: >
      Vast's successful deployment and three-month operation of Haven Demo provides empirical flight validation of its avionics, flight software, power conditioning, and propulsion subsystems that few competing commercial station startups possess.
    claimRefs:
      - CE001
      - CE004

  - calloutType: risk
    title: "Total Single-Source SpaceX Dependency"
    body: >
      Haven-1 is architecturally bound to SpaceX across three critical functions: Falcon 9 orbital launch, Crew Dragon astronaut transport, and Starlink broadband telemetry. Any operational pause or pricing surge within SpaceX directly threatens Vast's launch cadence and operational viability.
    claimRefs:
      - CE015

