company:
  name: "Vast Space"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Vast Space is advancing a hardware-rich, vertically integrated product roadmap centered on the single-module Haven-1 commercial space station, currently targeting launch in 2027 aboard a SpaceX Falcon 9 rocket. The architecture leverages heritage from the uncrewed Haven Demo orbital mission alongside proprietary in-house structures, avionics, and fluid systems tested across Long Beach and Mojave facilities. For the post-ISS era, Vast proposes Haven-2, an expanded modular station designed for NASA's Commercial LEO Destinations (CLD) Phase 2 requirements, featuring an initial module operational by 2028 and scaling to a multi-module cluster by 2032. Critical technical dependencies include total reliance on SpaceX for launch and crew transport via Dragon, single-supplier Starlink laser communication links, and an open-loop ECLSS architecture that requires substantial maturation and orbital verification for multi-year station operations.

sections:
  - id: "haven-1-architecture-flight-heritage"
    title: "Haven-1 Station Architecture and Subsystem Provenance"
    body: >
      Vast Space's near-term product architecture centers on Haven-1, designed as a single-module commercial space station capable of supporting human habitation, scientific experimentation, and commercial payloads in low Earth orbit (LEO). Following the completion of the uncrewed Haven Demo orbital mission, which completed 49 on-orbit test objectives and made Vast the only commercial space station developer to fly and operate its own spacecraft, engineering efforts transitioned toward qualifying human-rated station subsystems. The Haven-1 primary structure consists of an aluminum pressure vessel manufactured and integrated in-house, supported by specialized facilities in Long Beach and Hawthorne, California.

      Avionics, flight software, guidance, navigation, and control (GNC), and power distribution architectures draw directly on the flight-proven hardware designs from Haven Demo. Attitude control and stabilization incorporate momentum management systems augmented by storable non-toxic chemical propulsion. External communications are designed around an integrated SpaceX Starlink broadband laser link, intended to provide high-bandwidth, low-latency connectivity for onboard science instrumentation and live astronaut communications. Crew accommodations within the pressurized volume provide habitable common areas, dedicated sleep cabins, and scientific payload racks. However, primary station subsystems—including life support and full thermal management—still require integrated testing under simulated space environments, leaving flight-proven validation concentrated in uncrewed demonstration systems rather than pressurized human-in-the-loop operations.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    tableRefs:
      - TE001
    figureRefs:
      - FE001

  - id: "haven-2-iss-successor-roadmap"
    title: "Haven-2 Architecture and Modular LEO Expansion"
    body: >
      Vast's long-term commercial station strategy centers on Haven-2, an expansive multi-module space station architecture proposed directly to succeed the International Space Station (ISS) under NASA's Commercial LEO Destinations (CLD) Phase 2 program. The Haven-2 design represents an evolved, NASA-certified iteration of the Haven-1 baseline, engineered to expand livable volume and scientific throughput at reduced procurement costs for government and sovereign customers. If awarded a CLD Phase 2 contract, Vast plans to deploy the initial Haven-2 module in orbit by 2028, offering nearly twice the livable volume of Haven-1 by extending module length by five meters while retaining common avionics, power, and structural templates.

      The modular expansion plan envisions deploying three additional Haven-2 modules over a two-year deployment sequence, culminating in a four-module cluster operational by 2030. Each successive module is planned to incorporate enhanced life support capabilities, expanded research laboratory racks, and dedicated international partner hosting bays. Beyond 2030, Vast's architecture roadmap projects the addition of a 7-meter diameter core module and four additional outward modules by 2032. Key technical features planned for the fully assembled station include a 3.8-meter diameter observation cupola, robotic manipulation arms, an external payload airlock, and an extravehicular activity (EVA) airlock. Vast also leverages this orbital hardware heritage across adjacent product lines, including Vast Satellite, a high-power satellite bus line utilizing station-derived components, and preliminary concepts for lunar surface habitats.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
    tableRefs:
      - TE002

  - id: "vertical-integration-testing-infrastructure"
    title: "Vertical Integration, Test Operations, and Facility Footprint"
    body: >
      A defining technical pillar of Vast's engineering strategy is extensive vertical integration across design, manufacturing, and subsystem validation. Vast operates a distributed physical footprint in Southern California, anchored by its Long Beach headquarters spanning three buildings that house advanced manufacturing, cleanroom integration, design engineering, astronaut training assets, and mission control operations. Specialized manufacturing is augmented by a 25,000-square-foot additive manufacturing facility in Hawthorne, California, which supports rapid in-house prototyping and fabrication of complex metallic components for fluid and structural systems.

      Subsystem and environmental testing are conducted across dedicated testing grounds. At the Mojave Air and Space Port, Vast operates a dedicated test site equipped with rocket engine and structural test stands, supporting proof pressure testing, vibration screening, and hot-fire propulsion verification. Test campaigns validate fluid handling across high-risk pressurized, cryogenic, pneumatic, and life support systems, overseen by specialized test engineering teams. Subsystem integration follows multi-tier verification protocols, including software-in-the-loop (SITL) and hardware-in-the-loop (HITL) test benches, to execute extensive mission simulation runs before flight hardware integration. Despite high organizational focus on engineering velocity and testing rigor, managing diverse test facilities across Mojave and Long Beach introduces capital intensity and logistical coordination complexity across programs.
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE014

  - id: "technical-dependencies-execution-risks"
    title: "Critical Subsystem Dependencies, Schedule Slips, and ECLSS Risks"
    body: >
      While Vast demonstrates meaningful technical progress and flight heritage through Haven Demo, its technical execution remains exposed to significant single-point dependencies and developmental bottlenecks. The most critical external dependency is Vast's near-total reliance on SpaceX across launch vehicles, crew transport, and broadband telemetry. Haven-1 relies exclusively on the SpaceX Falcon 9 for orbital launch and SpaceX Crew Dragon for human rendezvous, docking, and return missions. Any technical grounding, launch cadence disruption, or pricing adjustment within the Falcon 9 or Dragon fleets directly compromises Haven-1 mission schedules and financial margins.

      Schedule risk is another verified operational challenge. Initially targeted for launch as early as 2025 or mid-2026, Haven-1's launch readiness has slipped to 2027 as assembly, qualification, and integrated fluid systems verification matured. Furthermore, Haven-1 employs an open-loop Environmental Control and Life Support System (ECLSS), depending on consumable oxygen and nitrogen storage with limited air revitalization suited primarily for short-duration missions of approximately two weeks. Achieving multi-month continuous crew operations on Haven-2 requires transitioning to closed-loop regenerative ECLSS and verified in-space fluid transfer, technologies that remain unvalidated in Vast's orbital operations. Additionally, while Vast's ultimate corporate ambition includes artificial-gravity rotating habitats, all near-term architectures remain zero-gravity platforms, reflecting a substantial gap between long-term marketing vision and current hardware qualification.
    claimRefs:
      - CE014
      - CE015
      - CE016
    tableRefs:
      - TE003

