callouts:
  - calloutType: "insight"
    title: "Sovereign Customer Contracting Validates Destination Demand"
    body: "Vast's bilateral astronaut agreements with France, ESA (Czech Republic), and Greece demonstrate that national governments are willing to purchase access to commercial space stations and ISS private flights, establishing an identifiable customer base distinct from pure high-net-worth space tourism."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM012"
  - calloutType: "risk"
    title: "Microgravity Research Revenue Gap and Repeat Purchase Uncertainty"
    body: "While multiple biotechnology and medical research institutions have announced collaborative agreements for Haven-1 payload racks, these partnerships remain non-binding memorandums without disclosed revenue backlogs, leaving commercial microgravity monetization unproven."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM015"
