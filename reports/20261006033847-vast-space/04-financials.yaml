callouts:
  - calloutType: "risk"
    title: "Structural Capital Intensity and Debt Service in a Pre-Revenue Stage"
    body: "Vast's March 2026 financing included a $200 million debt tranche alongside $300 million in equity. For an aerospace venture that has not commenced commercial revenue flights, carrying substantial debt introduces rigid debt-service covenants and refinancing vulnerability if the 2027 Haven-1 launch or customer acceptance slips."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI015"

  - calloutType: "insight"
    title: "Valuation Premium Divorced from Current Microgravity Demand Reality"
    body: "The mid-2026 $5.5 billion valuation led by a16z reflects an aggressive strategic multiple on anticipated post-ISS NASA station replacement rather than demonstrated private commercial demand. If NASA's CLD procurement timeline faces congressional appropriation delays, Vast will absorb substantial carry costs across its 1,000+ workforce."
    claimRefs:
      - "CI010"
      - "CI013"
      - "CI014"

