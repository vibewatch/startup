      - number: '2.2'
        title: 市场规模、商业现实与受约束的需求视角
        blocks:
          - type: paragraph
            body: >-
              评估商业空间站和轨道基础设施市场，必须区分理论上的总可寻址市场预测与近期、受证据约束的客户支出。 将轨道工业化外推至数千亿美元 TAM 的历史市场分析，正逐渐让位于以实际政府机构预算和近期任务合同为锚的严谨判断。
              可寻址需求分为四层：代表全球民用政府载人航天和商业轨道探索预算的扩张型总可寻址市场（TAM）；由民用机构 LEO 目的地采购构成的服务可寻址市场（SAM， 主要包括 NASA Commercial LEO
              Destinations Phase 2、ESA 和国际合作伙伴）；可寻址的商业卫星平台市场；以及受 Haven-1 四人、两周访问架构和 SpaceX Dragon
              载人运输能力约束的近期可服务可获得市场（SOM）。独立市场报道指出，2026 年的航天融资和商业评估不同于 2021 年 SPAC 泡沫： 当时估值跟随数十年 TAM
              预测，如今则需要已签约任务和近期现金创造能力的证明。Vast 近期可获得的支出受其探路者能力封顶： Haven-1 在 80 立方米增压外壳内提供 45 立方米可居住体积，运行 8
              个标准化有效载荷位，每个位点持续电力为 100 瓦。 因此，初期飞行的收入潜力结构上受可用宇航员座位和小规模有效载荷容量限制，而不是由不受约束的轨道制造规模决定。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM011
