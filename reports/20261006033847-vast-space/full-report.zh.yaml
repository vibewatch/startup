  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与目标市场
        blocks:
          - type: paragraph
            body: >-
              Vast Space 将客户机会分为 3 类买方：主权载人航天计划、商业和机构微重力研究联盟，以及私人宇航员商业任务。 主权客户是价值最高的层级，因为各国希望在 ISS
              受限的多边分配之外，获得体现国家声望并服务科学研究的载人航天机会。 Vast 已与欧洲航天局、法国、捷克共和国和英国达成主权承诺及探索性协议，将 Haven-1 及其前置 ISS 任务定位为主权访问渠道。
              商业微重力层包括机构研究实验室、制药开发商和先进制造企业，目标是进行轨道材料合成和生物实验。 最后，私人宇航员飞行服务于商业实体和私人太空旅行者，为 Vast 载人航天运营架构提供近期运营基础。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
