              Space Ventures 领投的 $300M A 轮股权和 $200M 债务融资。 2026 年年中，Andreessen Horowitz（a16z）领投了之后的 $250M 轮融资，使 Vast 估值达到
              $5.5B。 这笔流动性缓冲预计可支撑资金续航至 2027 年，但未来资本需求仍极高。$200M 债务层在商业收入产生前引入潜在偿债或契约触发事项， 长期偿付能力高度依赖在竞争中赢得 NASA
