  - id: TV002
    title: 正论与反论
    columns:
      - 视角
      - 基于证据的论点
      - 哪些情况会改变判断
    rows:
      - - 正论：资本化
        - 2026 年融资增加 $500 million，据报道累计融资超过 $1 billion。
        - 现金跑道短或债务方案限制严格，会削弱表面上的资本优势。
      - - 正论：技术验证
        - Haven Demo 于 2025 年飞行，Haven-1 计划于 2027 年发射。
        - 若已验证的集成或发射出现延误，且没有资金支持的恢复计划，执行信心会减弱。
      - - 正论：机构路径
        - NASA 选定 Vast 执行私人 ISS 任务，提升了运营相关性。
        - 若任务未能转化为更广泛的机构或商业需求，将限制估值支撑。
      - - 反论：授标依赖
        - Vast 错过 NASA 首轮空间站授标，正在争取第二阶段。
        - 具有明确经济性的有资金支持授标，将降低机构需求不确定性。
      - - 反论：融资不透明
        - 分配到的证据披露了轮次规模和构成，但未披露估值、契约或优先权。
        - 需要完整融资文件和资本结构表，才能评估股权下行风险。
      - - 反论：执行信号
        - 一份独立报道称有 46 人被裁，同时报道有 277 个空缺职位。
        - 更新后的员工人数、流失率、招聘完成度和里程碑人员配置可解决这一混合信号。
    notes: 该表将报道事实与尽调阈值分开；人员数据来自二手报道，股债拆分之外的融资条款仍未披露。
