              开发载人空间站需要大额前置资本支出，并在分散式制造和专业测试基础设施上承担高额运营开销。 Vast 在加州霍桑运营一座 25,000 平方英尺的增材制造设施，在 Mojave Air and Space Port
              设有发动机和结构测试场地， 在华盛顿特区白宫附近设有政府事务办公室，并在休斯敦和东京设有区域运营办公室。 公司员工超过 1,000 人，其中包括大量从 SpaceX 和 NASA 招募的工程及任务运营人才。
