      - number: '5.2'
        title: Haven-2 架构与模块化 LEO 扩展
        blocks:
          - type: paragraph
            body: >
              Vast 的长期商业空间站战略以 Haven-2 为核心。这是一套大型多舱空间站架构，已在 NASA Commercial LEO Destinations（CLD）Phase 2 计划下直接提出，
              旨在接替国际空间站（ISS）。Haven-2 设计是 Haven-1 基线的演进版、NASA 认证迭代方案，目标是在降低政府和主权客户采购成本的同时， 扩大可居住体积和科学吞吐量。若获得 CLD Phase 2
              合同，Vast 计划在 2028 年前将首个 Haven-2 模块部署入轨； 通过将舱段长度增加 5 米，同时保留共用的航电、能源和结构模板，可提供接近 Haven-1 两倍的可居住体积。

              模块化扩展计划设想在两年部署序列中增加 3 个 Haven-2 模块，最终在 2030 年形成由 4 个模块组成的运营集群。 每个后续模块计划加入增强型生命保障能力、扩大的研究实验室机架和专用国际伙伴舱位。
              2030 年以后，Vast 的架构路线图计划在 2032 年前增加一座直径 7 米的核心模块和 4 个额外外向模块。 完整组装后的空间站计划具备的关键技术特征包括直径 3.8
              米的观景穹顶、机器人操作臂、外部有效载荷气闸和舱外活动（EVA）气闸。 Vast 还将这一轨道硬件积累用于相邻产品线，包括采用空间站衍生组件的高功率卫星总线产品 Vast
              Satellite，以及月面栖息地的初步概念。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
