  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              已分配证据始终将四家商业空间站竞争者列为直接对手：Vast、Axiom Space、Orbital Reef 和 Starlab。 这一同行集合小于完整的买方选择版图。Craft 还将
              Nanoracks、SpacePharma、Vantor 和 NASA's Jet Propulsion Laboratory 列为替代方案， 但其列表没有证明这些组织销售等价的载人空间站容量。只要 ISS
              仍可使用，买方也可以继续留在 ISS，采购专业有效载荷服务，推迟任务，或建设定制的主权基础设施。
              因此，内部自建只是概念性替代方案，而不是本来源集合中已验证的近期同行。画像表将没有证据支持的规模、定价和能力字段标为未知， 而不是把邻接市场转化为直接竞争。
            claimRefs:
