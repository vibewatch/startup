      - number: '2.3'
        title: 买方细分、预算归属与采用约束
        blocks:
          - type: paragraph
            body: >-
              商业轨道目的地生态的采用由三类主要客户主导：主权国家航天机构、机构微重力研究者，以及商业卫星 / 国防平台买方。
              主权政府是最直接且最具信用的付款方。国家宇航员任务与商业休闲旅行的采购逻辑不同，驱动因素包括国内产业参与、STEM 领导力、科学回报和国家太空主权， 同时不必自行建造载人航天器。Vast
              已通过与法国、欧洲航天局（代表捷克共和国）和希腊签署双边任务协议，验证了这一细分市场， 相关协议面向欧洲宇航员的潜在飞行。然而，国家宇航员支出仍受年度公共拨款和外交审批牵制，无法自动形成多年重复采购。
              机构研究细分市场包括生物医学研究机构（如 Cedars-Sinai 和 UC San Diego Sanford Stem Cell Institute）以及商业生物技术开发商
              （LambdaVision、BioOrbit、Auxilium Biotechnologies 和 Exobiosphere），它们正在探索微重力环境中的细胞类器官和专业制造。
              但科研兴趣不等于可重复的商业服务：公开协议仍是无约束力的谅解备忘录或合作探索协议，而不是已披露的收入积压。 关键采用瓶颈包括通过 SpaceX Dragon
              进行轨道运输的成本、严格的飞后样本验证要求、有效载荷功率限制，以及围绕 Haven-1 计划于 2027 年具备轨道就绪状态的运营不确定性。
