            body: >-
              Vast Space 是一家处于商业化前阶段的轨道基础设施开发商，正准备让探路者空间站 Haven-1 于 2027 年搭乘 SpaceX Falcon 9 发射， 随后建设目标是接替国际空间站（ISS）的模块化
              Haven-2。公司的未来收入架构主要有三类商业变现方向： 私人宇航员轨道探险任务、主权国家 / 航天机构宇航员飞行合同，以及微重力有效载荷研究和制造能力。 2026 年 2 月，Vast 宣布与 NASA
