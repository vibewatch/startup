      - number: '6.2'
        title: 采用轨迹与任务清单
        blocks:
          - type: paragraph
            body: >-
              Vast 的商业采用轨迹按顺序推进：先执行前置私人宇航员 ISS 任务，再将商业用户转移到独立的 Haven-1 空间站。 2026 年 2 月，NASA 选定 Vast 运营第 6 次私人宇航员 ISS
              任务，最早计划于 2027 年夏季执行，由 4 名私人太空旅行者搭乘 SpaceX Falcon 9 和 Dragon 航天器。 这一正式选定与此前运营最初几次私人 ISS 任务的现有竞争者 Axiom
              Space 并列，建立了关键运营可信度。 在 ISS 任务之外，Vast 正跟踪 2027 年初将 Haven-1 作为单舱探路者空间站部署到近地轨道。
              但由于轨道空间站需要提前进行大量有效载荷集成和监管审批，Vast 的商业利用仍取决于 Haven-1 微重力实验室系统通过飞行认证， 并将早期框架协议转化为确定且排期明确的飞行任务清单。
