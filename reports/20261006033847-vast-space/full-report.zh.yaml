      - number: '5.3'
        title: 垂直整合、测试运营与设施版图
        blocks:
          - type: paragraph
            body: >
              Vast 工程战略的一项核心技术支柱，是在设计、制造和子系统验证之间进行广泛垂直整合。 Vast 在南加州运营分散的实体布局，以长滩总部为中心；总部占据 3
              栋建筑，容纳先进制造、洁净室集成、设计工程、宇航员训练设施和任务控制运营。 加州霍桑一座 25,000 平方英尺的增材制造设施进一步支持专业制造，用于快速内部原型制作，并制造流体和结构系统所需的复杂金属部件。

              子系统和环境测试在专用测试场地进行。Vast 在 Mojave Air and Space Port 运营一处配备火箭发动机和结构测试台的专用测试场地，
              支持验证压力测试、振动筛选和热试推进验证。测试活动验证高风险增压、低温、气动和生命保障系统中的流体处理， 由专业测试工程团队负责。子系统集成遵循多层验证协议，包括软件在环（SITL）和硬件在环（HITL）测试台，
              在飞行硬件集成前执行广泛的任务模拟运行。尽管组织高度重视工程速度和测试严谨性，在 Mojave 和长滩管理多处测试设施， 仍会给各项目带来资本密集度和物流协调复杂性。
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: 关键子系统依赖、进度延期与 ECLSS 风险
        blocks:
          - type: paragraph
            body: >
              尽管 Vast 通过 Haven Demo 展现出有意义的技术进展和飞行积累，其技术执行仍暴露于重大的单点依赖和开发瓶颈。 最关键的外部依赖是 Vast 几乎全面依赖 SpaceX
              提供发射运载器、乘员运输和宽带遥测。 Haven-1 完全依赖 SpaceX Falcon 9 进行轨道发射，并依赖 SpaceX Crew Dragon 执行载人会合、对接和返回任务。 Falcon 9 或
              Dragon 机队出现任何技术停飞、发射频次中断或价格调整，都会直接危及 Haven-1 任务进度和财务利润率。

              进度风险是另一个已验证的运营挑战。Haven-1 最初最早计划于 2025 年或 2026 年年中发射，但随着装配、认证和集成流体系统验证成熟， 发射准备时间已推迟至 2027 年。此外，Haven-1
              采用开放式环境控制与生命保障系统（ECLSS），依赖可消耗的氧气和氮气储存， 空气再生能力有限，主要适用于约两周的短期任务。Haven-2 若要实现连续数月的乘员运营，需要转向闭环再生 ECLSS
              和经验证的在轨流体转移技术， 而这些技术在 Vast 的轨道运营中仍未得到验证。除此之外，尽管 Vast 的最终企业愿景包括人工重力旋转栖息地，所有近期架构仍是零重力平台，
              反映出长期营销愿景与当前硬件认证之间存在显著差距。
