  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可寻址支出与结构性邻接市场
        blocks:
          - type: paragraph
            body: >-
              商业近地轨道（LEO）基础设施市场包括轨道人类居住设施、微重力研究实验室名额、国家宇航员任务运营，以及用于地球轨道和地月空间的标准化航天器平台。 可寻址支出由主权载人航天预算支撑，这些预算正逐步脱离计划于
              2030 年底退役并受控离轨的国际空间站（ISS）。 市场边界内还包括增压舱段居住舱、飞行计算机、能源与推进子系统、环境控制与生命保障系统（ECLSS）、有效载荷机架集成、
              乘员返回运营及商业卫星平台。核心空间站支出明确不包括轨道运载火箭制造、重型发射运营（例如 SpaceX Falcon 9 或 Starship 发射，
              它们属于供应商投入而非目的地支出）、地面网络地面站，以及亚轨道太空旅游（例如 Blue Origin New Shepard 或 Virgin Galactic）。 邻接市场包括商业卫星制造——Vast 正通过
              15 千瓦级卫星总线产品线进入该领域——以及月面基础设施，包括拟议中的月面电力设备、气闸和月球定位卫星。 当前的现状替代方案包括继续使用 ISS、无人商业拼车平台、轨道自动化舱体（如 Varda Space
              Industries），以及地面落塔或抛物线飞行实验室。
