      - number: '3.4'
        title: 护城河持久性与不利信号
        blocks:
          - type: paragraph
            body: >-
              Vast 的潜在护城河在于执行，而非已被证明的经济锁定。创始人 Jed McCaleb 表示倾向于内部建造以降低对供应商的依赖， 同时也承认更大的空间站愿景受益于 Starship。官方页面称公司拥有超过
              1,000 名专家以及专用制造和测试场地； 这些资产可以缩短迭代周期，但也会增加固定成本敞口。不利反向信号来自组织层面：NewsBytes 报道裁员 46 人，约占员工总数的 4%，同时有 277 个职位空缺。
              综合来看，证据支持 Vast 在硬件执行和集成深度上相对领先，但尚未支持其在定价、合同需求、发射准入或政府采购上拥有持久护城河。
