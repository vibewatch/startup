            body: >-
              直接竞争者采取了明显不同的部署和分销路径。BlacKnight 将 Vast 描述为单次发射舱段开发商，将 Axiom 描述为连接 ISS 的过渡平台， 将 Orbital Reef 描述为 Blue
              Origin 和 Sierra Space 的联盟，将 Starlab 描述为 Voyager Space 与 Airbus 的合作。 Vast 的飞行历史优势部分来自公司自述：其媒体页面称 Haven Demo
              于 2025 年运行，并称 Haven-1 预计于 2027 年发射； 独立报道也描述了该演示任务和发射计划。Axiom 的私人宇航员任务经验提供了另一种运营和客户证明。 Orbital Reef 和
              Starlab 可能凭借发射、航空航天和政府渠道合作伙伴，弥补空间站专用硬件可见度较低的不足。
