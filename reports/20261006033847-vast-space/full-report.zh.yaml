          - type: paragraph
            body: >-
              由于 Haven-1 尚未发射、运营仍处于收入前阶段，净收入留存率和毛收入留存率等传统软件留存指标并不适用。 客户持久性应改由合同转化率和重复任务协议衡量。当前客户集中度风险很高：主权航天机构和 NASA
              是唯一可行的锚定收入来源， 能够支撑多模块轨道基础设施。Vast 的发射和运输管线也存在严重交易对手集中度，完全依赖 SpaceX Falcon 9 和 Dragon 舱将乘员送往 ISS 和 Haven-1。
              此外，内部运营调整——例如 2026 年 8 月因绩效相关裁员 46 人——凸显了在 NASA Commercial LEO Destinations 监管环境不断变化之际， 将航空航天制造团队扩大到满足激进的
              2027 年发射窗口所固有的执行压力。
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 主权前置策略缓解 Haven-1 进度风险
            body: >-
              通过获得 NASA 第 6 次私人宇航员 ISS 任务的选定资格，并与 ESA 达成主权宇航员协议（希腊、捷克共和国、法国）， Vast 在 Haven-1 正式部署前建立了活跃的载人航天飞行任务清单。
              即使空间站集成遭遇航空航天发射延迟，公司仍可借此积累运营飞行经验、训练任务人员，并将主权客户关系变现。
            calloutType: insight
            claimRefs:
              - CU005
              - CU009
              - CU010
              - CU011
          - type: callout
            title: 单一来源发射依赖与收入前执行压力
            body: >-
              Vast 仍完全依赖 SpaceX Falcon 9 发射器和 Dragon 乘员舱，将乘员运送至 ISS 和 Haven-1。 Falcon 9 停飞或 Dragon
              任务清单出现瓶颈，都会直接扰乱客户飞行安排。 与此同时，2026 年 8 月因绩效相关裁员 46 人，凸显公司向 2027 年初发射目标扩张时执行失误的容错空间很小。
            calloutType: risk
            claimRefs:
              - CU007
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与监管证据缺口
        blocks:
          - type: paragraph
            body: >-
              进度和集成是目前证据最充分的即时风险，因为一项独立评估称 Haven-1 已从 2026 年 5 月目标推迟至不早于 2027 年第一季度， 而 Vast 9 月更新称飞行件仍处于最终集成阶段，预计 2027
              年发射。 对监管、法律、乘员安全、出口管制、隐私和网络安全的结论需要更谨慎：已分配来源池确认了监管和法律领导层，但没有记录具体许可证、批准、认证、
              执法事项或事件历史。因此，风险登记表将这些状态标记为未验证，而不是把缺少公开记录视为合规或不合规的证明。 NASA 采购集中度则有独立分析作为证据，并被列为关键商业依赖，而不是监管发现。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR009
              - CR012
              - CR015
      - number: '7.2'
        title: 运营关键路径、质量与安全
        blocks:
          - type: paragraph
            body: >-
              Vast 的集成模式减少了一些供应商交接，但将剩余外部依赖集中在关键路径上。 Ex Terra
              指出太阳能阵列和推进器由外部采购，并将对接硬件、航电和任务计算机列为发射准备依赖；同时还称太阳能阵列产能在民用和国防项目之间存在竞争。 缓解证据真实但不完整：Vast 报告称已进入最终集成阶段，长滩总部占据 3
              栋建筑，霍桑设有增材制造设施，Mojave 设有测试场地； 领导层页面则描述了高级载人航天和安全基础设施经验。这些披露没有提供供应商承诺、认证余量、耐久测试结果、网络控制或事件记录。
              因此，在有日期的验收证据和测试闭环取代组织能力声明之前，剩余运营风险仍高。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR008
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.3'
        title: 伙伴集中度、资本敞口与终止标准
        blocks:
          - type: paragraph
            body: >-
              SpaceX 是多服务集中依赖，而不是传统供应商关系：独立分析称 Vast 依靠 Falcon 9、Dragon 和 Starlink 提供发射、乘员运输和连接， 且 Haven
              没有集成等价的美国乘员运输替代方案。NASA 是第二个集中依赖，因为 Sacra 认为 ISS 之后的锚定需求是商业空间站经济性的核心。 融资降低了近期资金压力，但不能证明流动性：2026 年 3 月方案包含
              $300M 股权和 $200M 债务，且两项保留的融资来源都没有披露债务定价、契约、可用现金或资金续航期。 因此，投资监测应聚焦有日期的集成和供应商里程碑、监管证据、可信的 SpaceX 应急方案、NASA
              授标进展和债务条款。 如果没有新增流动性却再次出现重大进度延期、失去可信的 NASA 锚定需求，或无法证明乘员安全准备就绪，当前执行论点将被打破。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 融资不等于资金续航期
            body: 2026 年 3 月的 $500M 融资由股权和债务构成。在没有现金余额、债务条款和运营支出证据的情况下， 不能将其换算为可用现金或资金续航期估算。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              当前证据支持“继续研究”，而不是不计价格地投资。Vast 完成了 $500M 融资，其中包括 $300M A 轮股权和 $200M 债务， 报告中的累计融资由此超过
              $1B。                            这一资本基础提高了公司继续硬件集成的概率，但募集资金不等于可用现金，债务部分还引入了一项金额尚未量化的优先债权主张。 分配到的融资报道均未提供
              Vast 当前股权估值、债务契约、清算优先权或收入基线。 在缺少这些输入的情况下，无法负责任地计算入场倍数、经稀释调整的持股情景和目标回报。 因此，投资兴趣应继续以披露价格和审阅融资文件为前提。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV013
              - CV015
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在一项获得融资、硬件优先的尝试之上：在 ISS 过渡前建立商业空间站，并由 Haven Demo 飞行积累、计划于 2027 年发射 Haven-1，
              以及具备载人航天和资本市场经验的领导层提供支持。反论点同样重要：Vast 错过了 NASA 第一轮空间站授标，未来仍需要机构选定、技术执行、发射可用性、 客户转化和有利的融资条款。报道中的 46
              人缩编约占员工总数的 4%，由于招聘据报仍在继续，这本身并不是陷入困境的证据， 但它强化了检验进度和组织韧性的必要性。证据支持期权价值，而不是确定的投资判断。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: 避免虚假精确的情景框架
        blocks:
          - type: paragraph
            body: >-
              里程碑驱动的框架比传统收入倍数更稳妥，因为来源集合没有经审计收入、已签约积压、毛利率、现金余额或 Vast 已披露估值。 乐观情景假设 Haven-1 按时执行、机构需求出现，从而改善融资准入并支撑溢价。
              基准情景假设技术持续进展，但商业证明前仍需更多资本，回报取决于入场价格和稀释。 悲观情景则将进度延期、合同转化疲弱或债务限制与倍数压缩结合起来。
              这些是方向性结果，而非数值估值区间；缺失的私营公司输入构成重大尽调缺口。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备、尽调要求与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              管理层包括一名 CFO，其自述具备私人及上市公司并购、IPO 和融资经验；Vast 则报告拥有覆盖制造、环境测试、政府事务和任务支持地点的运营基础设施。
              这些能力提高了组织准备度，但不能证明退出时间或流动性。在作出投资决定前，尽调应取得投后资本结构、优先股堆叠、债务到期日和契约、 现金续航期、里程碑预算、已签署客户承诺及 NASA 选定的经济性。
              论点破坏触发器包括：没有新增流动性却出现重大 Haven-1 进度延期；无法将飞行证明转化为合同需求； 债务条款挤压股权价值；或融资价格在这些里程碑尚未证明前就假设商业化成功。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律是闸门问题
            body: 应将 $500M 融资视为资本准入证据，而不是股权定价有吸引力的证据。 在超越“继续研究”之前，要求提供当前投后资本结构、优先股堆叠、债务条款和按里程碑调整的资金续航期。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
              - CV015
