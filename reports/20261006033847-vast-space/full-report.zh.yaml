              Vast 已在欧洲和北美积累了可核验的主权及机构合作伙伴证明。根据 2026 年 9 月签署的协议，欧洲航天局与 Vast 签约， 将执行希腊宇航员首次前往 ISS 的历史性任务，该任务属于 NASA 批准的第
              6 次私人宇航员任务。 2026 年 6 月早些时候，ESA 代表捷克共和国签署了宇航员任务协议，此前法国签署了一项历史性的双任务协议，涵盖 ISS 和 Haven-1 平台。 机构研究中，Vast 与
              Cedars-Sinai 合作开展微重力科学和乘员健康研究，并与 JAMSS、Interstellar Lab 和 Exobiosphere 等组织扩大有效载荷网络。
              此外，公司还与英国航天局及立陶宛创新局签署了双边谅解备忘录。 尽管这些协议知名度较高，大多数双边关系仍是飞行前协议或研究 MoU，而不是最终确定且具有约束力的商业座位采购。
