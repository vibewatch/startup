  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Haven-1 空间站架构与子系统来源
        blocks:
          - type: paragraph
            body: >
              Vast Space 的近期产品架构以 Haven-1 为中心。这是一座单舱商业空间站，设计用于在近地轨道（LEO）支持人类居住、科学实验和商业有效载荷。 无人 Haven Demo 轨道任务完成 49
              项在轨测试目标后，Vast 成为唯一一个曾让自有航天器飞行并运行的商业空间站开发商，工程工作也转向载人空间站子系统的认证。 Haven-1
              的主结构是由公司内部制造和集成的铝制压力容器，并由加州长滩和霍桑的专业设施提供支持。

              航电、飞行软件、制导、导航与控制（GNC）以及配电架构直接沿用 Haven Demo 的飞行验证硬件设计。 姿态控制和稳定系统采用动量管理系统，并辅以可储存的无毒化学推进剂。 外部通信围绕集成式 SpaceX
              Starlink 宽带激光链路设计，目标是为机载科学仪器和宇航员实时通信提供高带宽、低延迟连接。 增压空间内的乘员设施包括可居住公共区域、独立睡眠舱和科学有效载荷机架。
              但包括生命保障和完整热管理在内的主要空间站子系统仍需在模拟太空环境下进行集成测试，因此飞行验证仍集中于无人演示系统， 而非增压的人在回路运行。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
