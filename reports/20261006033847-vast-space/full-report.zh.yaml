  - id: TV003
    title: 乐观、中性与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - Haven-1 按所述 2027 年计划实现飞行；NASA 和商业需求转化落地；融资仍能以非惩罚性条款获得。
        - 没有证据支持数值区间；成功飞行和签约需求可能支持相对下一轮定价融资的溢价。
        - 在提供进度和合同证据前，概率为低至中等。
        - 发射延误、技术里程碑失败或缺乏签约需求。
      - - 中性
        - 硬件继续推进，但商业化和机构授标滞后，并且需要额外资本。
        - 回报主要取决于入场价格、稀释和债务优先级；应根据里程碑分阶段评估价值。
        - 与当前混合证据最为一致。
        - 现金跑道压力迫使公司降价融资或接受优先权很重的融资。
      - - 悲观
        - 进度延误、NASA 选择未落地、客户承诺仍不具约束力，或债务限制新股权融资。
        - 在缺乏资产、负债和优先权数据的情况下，股权价值可能大幅压缩，但没有证据支持数值底线。
        - 鉴于技术与融资依赖相互耦合，尾部风险重大。
        - 流动性不足以支持下一验证节点，或债务条款损害普通股回收。
    notes: 情景区间刻意保持定性，因为分配到的证据没有当前 Vast 估值、收入基线、现金余额、股权结构表或债务条款；概率标签是分析信号，不是测量得到的频率。
    claimRefs:
