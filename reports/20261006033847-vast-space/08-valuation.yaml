company:
  name: Vast Space
chapter:
  number: 8
  title: Valuation
  summary: >-
    Vast has substantial financing, visible hardware progress, and experienced leadership, but the
    allocated public evidence does not disclose a current company valuation, debt terms, contracted
    revenue, or unit economics. The resulting recommendation is research-more with medium confidence,
    high risk, and an indeterminate, price-sensitive valuation stance.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The current evidence supports research-more rather than a price-insensitive investment. Vast
      closed a $500 million financing composed of $300 million of Series A equity and $200 million of
      debt, taking reported total funding above $1 billion. That capital base improves the probability
      that the company can continue hardware integration, but funding raised is not cash available and
      the debt component introduces an unquantified senior claim. None of the allocated financing
      coverage provides Vast's current equity valuation, debt covenants, liquidation preferences, or
      revenue baseline. Without those inputs, an entry multiple, dilution-adjusted ownership case, and
      target return cannot be calculated responsibly. Investment interest should therefore remain
      conditional on price disclosure and financing-document review.
    claimRefs: [CV001, CV002, CV003, CV004, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on a financed, hardware-first attempt to establish a commercial station before
      the ISS transition, supported by Haven Demo flight heritage, a planned 2027 Haven-1 launch, and
      leadership with human-spaceflight and capital-markets experience. The anti-thesis is equally
      material: Vast missed the first NASA station-award round and still needs future institutional
      selection, technical execution, launch availability, customer conversion, and favorable financing
      terms. A reported 46-person reduction, described as roughly 4% of the workforce, is not by itself
      evidence of distress because hiring reportedly continued, but it reinforces the need to test
      schedule and organizational resilience. The evidence favors optionality, not underwriting certainty.
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV012]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Scenario framework without false precision
    body: >-
      A milestone-contingent framework is more defensible than a conventional revenue multiple because
      the source set contains no audited revenue, contracted backlog, gross margin, cash balance, or
      disclosed Vast valuation. In the bull case, on-time Haven-1 execution and institutional demand
      would improve financing access and support a premium. The base case assumes continued technical
      progress but requires more capital before commercial proof, making return dependent on entry price
      and dilution. The bear case combines schedule slippage, weak contract conversion, or restrictive
      debt with multiple compression. These are directional outcomes rather than numerical valuation
      ranges; the missing private-company inputs are a material diligence gap.
    claimRefs: [CV004, CV006, CV007, CV008, CV009, CV011, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Management includes a CFO with stated experience in private and public M&A, IPOs, and capital
      raises, while Vast reports operating infrastructure spanning manufacturing, environmental testing,
      government affairs, and mission-support locations. Those capabilities improve organizational
      readiness but do not establish exit timing or liquidity. Before an investment decision, diligence
      should obtain the post-money capitalization, preference stack, debt maturity and covenants, cash
      runway, milestone budget, signed customer commitments, and NASA-selection economics. Thesis-break
      triggers are a material Haven-1 schedule slip without added liquidity, inability to convert flight
      proof into contracted demand, debt terms that crowd out equity value, or a financing price that
      assumes successful commercialization before those milestones are demonstrated.
    claimRefs: [CV012, CV013, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision element, Assessment, Investment implication]
    rows:
      - [Recommendation, "Research more", "Do not underwrite until price, terms, and commercial evidence are disclosed."]
      - [Confidence, "Medium", "Financing and milestones are reported, but core valuation inputs remain private."]
      - [Risk rating, "High", "Technical, institutional, financing, and commercialization outcomes remain coupled."]
      - [Valuation stance, "Indeterminate and price-sensitive", "Public evidence does not support a current entry multiple or equity-value range."]
      - [Entry discipline, "Milestone- and terms-gated", "Require capitalization, debt, runway, and customer-contract diligence before pricing."]
    notes: "Assessments use the allocated public source set as of 2026-10-06; no current Vast valuation, audited revenue, or debt terms were available, so no numerical return estimate is shown."
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV014, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-based argument, What would change the view]
    rows:
      - ["Thesis: capitalization", "The 2026 financing added $500 million and reported total funding exceeded $1 billion.", "A short runway or restrictive debt package would weaken the apparent capital advantage."]
      - ["Thesis: technical proof", "Haven Demo flew in 2025 and Haven-1 is planned for 2027.", "A verified integration or launch delay without a funded recovery plan would weaken execution confidence."]
      - ["Thesis: institutional pathway", "NASA selected Vast for a private ISS mission, adding operational relevance.", "Failure to translate the mission into broader institutional or commercial demand would limit valuation support."]
      - ["Anti-thesis: award dependency", "Vast missed the first NASA station-award round and is pursuing phase two.", "A funded award with defined economics would reduce institutional-demand uncertainty."]
      - ["Anti-thesis: financing opacity", "The allocated evidence discloses round size and mix but not valuation, covenants, or preferences.", "Full financing documents and a capitalization table are required to assess equity downside."]
      - ["Anti-thesis: execution signal", "An independent report described 46 layoffs while also reporting 277 open roles.", "Updated headcount, attrition, hiring completion, and milestone staffing would resolve the mixed signal."]
    notes: "The table separates reported facts from diligence thresholds; workforce figures are secondary reporting, and financing terms beyond the equity/debt split remain undisclosed."
    claimRefs: [CV001, CV002, CV003, CV006, CV007, CV008, CV009, CV011, CV012, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull", "Haven-1 reaches flight on the stated 2027 schedule; NASA and commercial demand convert; financing remains available on non-punitive terms.", "No numerical range is supportable; successful flight and contracted demand could justify a premium to the next priced round.", "Low-to-moderate until schedule and contract evidence is supplied.", "Launch slip, failed technical milestone, or absence of contracted demand."]
      - ["Base", "Hardware progress continues, but commercialization and institutional awards lag and additional capital is required.", "Return is dominated by entry price, dilution, and debt seniority; value should be staged against milestones.", "Most consistent with the current mixed evidence.", "Runway pressure forces a down round or preference-heavy financing."]
      - ["Bear", "Schedule slips, NASA selection does not materialize, customer commitments remain non-binding, or debt constrains new equity.", "Equity value could compress materially, but a numerical floor is not supportable without asset, liability, and preference data.", "Material tail risk given coupled technical and financing dependencies.", "Insufficient liquidity to fund the next proof point or debt terms that impair common-equity recovery."]
    notes: "Scenario ranges are intentionally qualitative because the allocated evidence contains no current Vast valuation, revenue baseline, cash balance, cap table, or debt terms; probability labels are analytical signals, not measured frequencies."
    claimRefs: [CV004, CV006, CV007, CV008, CV009, CV011, CV014, CV015]
