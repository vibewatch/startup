callouts:
  - calloutType: recommendation
    title: Price discipline is the gating issue
    body: >-
      Treat the $500 million financing as evidence of capital access, not evidence that the equity is
      attractively priced. Require the current post-money capitalization, preference stack, debt terms,
      and milestone-adjusted runway before moving beyond research-more.
    claimRefs: [CV001, CV002, CV004, CV014, CV015]
