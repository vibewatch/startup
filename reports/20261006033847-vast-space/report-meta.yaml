companyProfile:
  summary: >-
    Vast Space is a privately financed space infrastructure company founded in 2021 and headquartered in Long Beach,
    California. It is developing Haven-1 as a pathfinder commercial station and Haven-2 as a longer-term post-ISS
    platform for government, corporate, private, and microgravity research users. The company has completed Haven Demo,
    disclosed a March 2026 $500 million financing and a later a16z-led $250 million round, and is targeting a 2027
    Haven-1 launch, but it remains pre-revenue with undisclosed pricing, contract terms, and customer counts.
