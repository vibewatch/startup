company:
  name: "Vast Space"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Vast is a founder-backed commercial space-station developer founded in 2021, headquartered in Long Beach, and targeting a 2027 Haven-1 launch after completing the Haven Demo mission. Its March 2026 financing added $300 million of Series A equity and $200 million of debt, but current valuation, revenue, customer count, debt terms, and ownership remain undisclosed."
sections:
  - id: "identity-product-and-stage"
    title: "Identity, Product, and Current Stage"
    body: "Vast was founded in 2021 by Jed McCaleb and is headquartered in Long Beach, California. The company describes its business as developing space stations for government, corporate, and private users of microgravity research and manufacturing, with Haven-1 serving as the near-term single-module station and Haven-2 as the longer-term platform. The evidence supports describing Vast as a privately financed development-stage infrastructure company rather than an operating station business: Haven Demo has flown, Haven-1 hardware is in integration, and the current public launch target is 2027. No assigned source discloses revenue, run-rate, customer count, pricing, or a confirmed post-money valuation, so those cover metrics remain gaps rather than estimates."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "capital-and-operating-footprint"
    title: "Capital and Operating Footprint"
    body: "Vast announced $500 million of new financing in March 2026, explicitly split between $300 million of Series A equity and $200 million of debt. This is not interchangeable with cash available: the company separately said that more than $1 billion had been invested in its station technologies and facilities, a cumulative deployment statement rather than a balance-sheet cash figure. The round brought Balerion Space Ventures, IQT, Qatar Investment Authority, Mitsui, MUFG, Nikon, Stellar Ventures, Space Capital, Earthrise Ventures, and McCaleb into the disclosed syndicate. Operationally, Vast lists six locations spanning headquarters, manufacturing, environmental testing, government affairs, Japan, and Houston. Its March release cited more than 1,000 employees, while an August report of 46 layoffs means the exact current total requires management confirmation."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO003"
  - id: "leadership-governance-and-dependence"
    title: "Leadership, Governance, and Key-Person Dependence"
    body: "Founder Jed McCaleb remains executive chairman and participated in the 2026 financing, while Max Haot serves as chief executive. The official team page presents a leadership bench with direct human-spaceflight experience, including chief operating officer Kris Young's 14 years at SpaceX across Dragon engineering, integration, and mission operations. The financing also added former NASA Chief Technologist A.C. Charania to the board through his role with lead investor Balerion. This mix improves technical and institutional coverage, but it does not resolve governance concentration: the assigned sources do not disclose McCaleb's ownership, voting control, board composition beyond Charania, investor vetoes, or succession arrangements. Founder financing and strategic involvement therefore create a material key-person and capital-concentration diligence question."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "milestones-and-adverse-signals"
    title: "Milestones and Adverse Signals"
    body: "The milestone record shows genuine hardware progress alongside schedule and organizational risk. Vast says Haven Demo flew, operated, and deorbited successfully before Haven-1 integration; independent March reporting also described Haven Demo's November 2025 launch. However, a November 2025 industry profile still framed May 2026 as a possible Haven-1 deployment, whereas the current company and independent sources now point to 2027. The evidence does not establish why that public timetable changed, but the shift is relevant to execution risk. In August 2026, NewsBytes reported 46 layoffs, about 4% of the workforce, while also reporting 277 open roles. Separately, an Insurance Journal archive excerpt records a former-engineer lawsuit in 2024, but the assigned text does not expose allegations, disposition, or current status."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
