    body: "Haven Demo and manufacturing progress reduce some technical uncertainty, but Haven-1 remains a future launch, the public schedule has changed, and neither station revenue nor a confirmed customer count is disclosed. Financing depth should not be read as validation of station utilization or unit economics."
