evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A confirmed post-money equity valuation and fully diluted capitalization table for the March 2026 financing.
    whyItMatters: Round size and cumulative invested capital do not establish equity value, dilution, ownership, or cash available.
    diligencePath: >-
      Request the signed financing documents, current fully diluted cap table, and board-approved valuation materials
      from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-stakeholder-map
    missingEvidence: >-
      Complete board roster, voting agreements, investor rights, debt terms and covenants, ownership percentages, and
      founder succession provisions.
    whyItMatters: >-
      The public stakeholder map is partial and cannot establish control, downside protection, leverage triggers, or
      continuity without the founder.
    diligencePath: >-
      Review the charter, bylaws, board minutes, investor-rights agreement, debt documents, cap table, and succession
      plan in the data room.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-metrics
    missingEvidence: Audited revenue, run-rate, contracted backlog, customer count, station pricing, and unit-economics evidence.
    whyItMatters: Hardware progress and financing do not show that station utilization can support the planned operating model.
    diligencePath: >-
      Request audited financials, signed customer contracts, backlog by counterparty, pricing schedules, and
      mission-level contribution-margin models.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: litigation
    missingEvidence: The former engineer's complaint, docket, allegations, procedural history, and current disposition.
    whyItMatters: >-
      The assigned Insurance Journal excerpt establishes that a suit was reported but is too truncated to assess
      severity or continuing exposure.
    diligencePath: >-
      Retrieve the complaint and docket from the relevant court database and obtain counsel's current litigation
      schedule.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: seat-and-rack-pricing
    missingEvidence: Disclosed pricing schedules for private astronaut seats and Haven-1 Lab payload slots.
    whyItMatters: >-
      Without per-seat and per-watt payload rack pricing, financial analysts cannot calculate unit economics or gross
      margins per Haven-1 flight.
    diligencePath: Request customer commercial terms and pro-forma mission pricing models during dataroom access.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: nasa-cld-award-terms
    missingEvidence: Final NASA Commercial LEO Destinations Phase 2 RFP terms, award values, and selection criteria weighting.
    whyItMatters: NASA funding represents the largest non-dilutive capital source for post-ISS station development.
    diligencePath: Monitor NASA procurement bulletins and contract award announcements on SAM.gov.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
      - TM003
  - type: unresolved-gap
    severity: minor
    topic: satellite-bus-firm-backlog
    missingEvidence: Confirmed contract value and execution timeline for the 200 optional satellite bus units.
    whyItMatters: >-
      Determines whether satellite manufacturing can become a recurring high-margin cash contributor alongside station
      operations.
    diligencePath: Conduct commercial customer interviews and verify options conversion criteria with management.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-packaging
    missingEvidence: >-
      Comparable rate cards, realized contract prices, discounts, service-level commitments, and cost allocation for
      launch, logistics, and station services.
    whyItMatters: >-
      Without like-for-like terms, pricing power and the economic trade-off among station providers cannot be
      underwritten.
    diligencePath: >-
      Request standard rate cards and anonymized executed customer agreements from Vast and benchmark them against
      competitor procurement records.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-lock-in
    missingEvidence: >-
      Customer contract language covering exclusivity, multi-homing, interface ownership, qualification portability,
      cancellation, and mission rescheduling.
    whyItMatters: >-
      The moat case changes materially if customers can port payloads and crew missions among stations without costly
      requalification.
    diligencePath: >-
      Review customer agreements and interview payload integrators about requalification cost, schedule, and interface
      portability.
    relatedQuestionRefs:
      - QP006
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      A complete census of sovereign station programs, specialist orbital-service vendors, and credible customer
      internal-build alternatives.
    whyItMatters: >-
      The bounded source pool supports the main direct peers but cannot prove the profile table is an exhaustive
      buyer-alternative universe.
    diligencePath: >-
      Reconcile the peer list against NASA, ESA, and national-space-agency procurement rosters during full-market
      diligence.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-schedule
    missingEvidence: >-
      Confirmed list and realized pricing for Haven-1 and Haven-2 private astronaut seat charters and research payload
      rack leasing.
    whyItMatters: >-
      Without contractual pricing or gross margin data, financial projections cannot establish unit profitability after
      accounting for SpaceX launch and Dragon vehicle costs.
    diligencePath: Request customer contracts, pricing schedules, or commercial proposals under NDA during management due diligence.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: ECLSS flight qualification
    missingEvidence: >-
      Third-party validation or NASA test reports certifying the integrated open-loop and planned regenerative ECLSS
      performance under prolonged orbital vacuum conditions.
    whyItMatters: >-
      Human crew safety and mission duration ceilings on commercial stations depend directly on life support reliability
      and air revitalization.
    diligencePath: >-
      Request unredacted ECLSS test campaign data from Mojave and MSFC vacuum chamber trials during commercial
      diligence.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: SpaceX contract terms
    missingEvidence: >-
      Binding commercial agreements, launch pricing guarantees, and manifest priority terms between Vast and SpaceX for
      Falcon 9 and Crew Dragon flights.
    whyItMatters: Single-source dependence on SpaceX creates schedule and pricing vulnerability that could delay station operations.
    diligencePath: >-
      Review master services agreements, launch service agreements, and Dragon mission pricing riders in confidential
      diligence.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: Haven-1 Lab pricing
    missingEvidence: >-
      Realized pricing per Middeck Locker Equivalent payload rack slot and customer commitments for commercial orbital
      research.
    whyItMatters: Validates payload revenue assumptions supporting the pre-revenue commercial station business model.
    diligencePath: Inspect executed payload customer contracts and binding reservation deposits.
    relatedQuestionRefs:
      - QE002
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: customer-financial-terms
    missingEvidence: >-
      Confirmed contract pricing, seat deposit schedules, and binding revenue backlog across sovereign agreements with
      France, Czech Republic, and Greece.
    whyItMatters: >-
      Determines whether announced sovereign agreements represent firm cash-generating commitments or conditional
      frameworks contingent on future legislative budget appropriations.
    diligencePath: >-
      Examine national space agency budget disclosures, parliamentary committee filings in France and the Czech
      Republic, and Vast investor disclosures.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: microgravity-revenue-model
    missingEvidence: Public fee schedule and rack-space lease pricing for the Haven-1 Lab microgravity research payload partners.
    whyItMatters: >-
      Essential to model commercial non-astronaut revenue potential and customer willingness-to-pay for private space
      station laboratory facilities.
    diligencePath: >-
      Review commercial user agreements, commercial price sheets from ISS National Lab implementation partners, and
      interview payload integration intermediaries.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: regulatory-legal-status
    missingEvidence: >-
      Specific launch, reentry, crew-safety, spectrum, export-control, privacy, and other required approvals, including
      filing identifiers, status, conditions, and dates.
    whyItMatters: >-
      These permissions and assurance reviews can gate operations, but the assigned pool does not establish whether each
      requirement is satisfied.
    diligencePath: >-
      Review regulator dockets and management's approval matrix, then reconcile each filing identifier to scope,
      conditions, renewal dates, and unresolved actions.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: supplier-commitments
    missingEvidence: >-
      Supplier identities, contracted delivery dates, allocation priority, qualification status, acceptance results, and
      remedies for flight-critical external components.
    whyItMatters: >-
      Outsourced solar arrays, thrusters, docking hardware, avionics, and mission computers can block integration even
      when primary structures are ready.
    diligencePath: >-
      Inspect the make-or-buy map, purchase orders, supplier scorecards, qualification records, inventory, schedule
      margin, and alternate-source plans.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: debt-and-runway
    missingEvidence: >-
      Debt pricing, maturity, covenants, repayment schedule, cash balance, restricted cash, operating spend, and
      management runway forecast.
    whyItMatters: >-
      Funding raised cannot be translated into cash available or runway without these denominators and contractual
      terms.
    diligencePath: >-
      Review executed credit documents, the latest balance sheet, monthly cash bridge, capex plan, covenant forecast,
      and downside financing scenarios.
    relatedQuestionRefs:
      - QR005
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: nasa-anchor-demand
    missingEvidence: >-
      Current CLD Phase 2 procurement status, proposal economics, evaluation milestones, award timing, and credible
      demand plan if Vast does not receive a major award.
    whyItMatters: Independent analysis identifies NASA anchor demand as central to the station business model.
    diligencePath: >-
      Review current NASA procurement records and management's awarded, contracted, and pipeline demand by customer and
      mission.
    relatedQuestionRefs:
      - QR004
      - QR006
      - QR008
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: quality-and-cyber-assurance
    missingEvidence: >-
      Integrated test pass rates, quality escapes, corrective-action closure, security architecture, independent cyber
      assessments, incident history, and recovery-test results.
    whyItMatters: >-
      Leadership experience and stated safety values do not establish accepted hardware quality, cyber resilience, or
      absence of incidents.
    diligencePath: >-
      Inspect test and quality dashboards, nonconformance records, independent security assessments, incident logs, and
      disaster-recovery evidence.
    relatedQuestionRefs:
      - QR002
      - QR003
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: minor
    topic: execution-breadth
    missingEvidence: >-
      Headcount, capital allocation, milestone ownership, and shared engineering resources assigned to Lunar Programs
      versus Haven-1.
    whyItMatters: >-
      The public announcement establishes expansion but does not show whether it diverts resources from the near-term
      station critical path.
    diligencePath: Request program-level staffing, budget, shared-resource allocation, and milestone-accountability plans.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      Current pre-money and post-money valuation, fully diluted capitalization, liquidation preferences, option pool,
      and investor rights.
    whyItMatters: >-
      These terms determine effective entry price, dilution, downside protection, and whether public evidence supports
      the price.
    diligencePath: >-
      Obtain the signed Series A documents, capitalization table, side letters, and board-approved post-close ownership
      schedule.
    relatedQuestionRefs:
      - QV002
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: return-model
    missingEvidence: >-
      Debt maturity, interest, covenants, cash balance, monthly burn, contracted backlog, pricing, gross margin, and
      milestone budget.
    whyItMatters: >-
      Without these inputs, runway, financing need, equity recovery, valuation range, and target return cannot be
      quantified.
    diligencePath: >-
      Review the debt agreement, management accounts, cash forecast, signed customer contracts, pricing schedules, and
      milestone-level operating plan.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
      - TV003
