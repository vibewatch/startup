- id: s3
  title: 'Named Customer Proof: Channel Surfaces, Not Published Account Logos'
  body: 'Balaji Wafers does not publish a conventional B2B customer-logo page. For this chapter, “named customer proof” is
    therefore treated as named trade channels and customer surfaces: the distributor network, the 4.5 lakh+ retail outlet
    base, regional kirana dominance, modern-trade chains such as DMart/Reliance Retail/Big Bazaar-type accounts, and e-commerce
    marketplaces such as Amazon/Flipkart/BigBasket-type surfaces. The first three are production-scale proof; modern trade
    and e-commerce are plausible and strategically important, but public evidence does not prove named contracts, account-level
    outcomes or channel revenue. [CU014] [CU015] [CU016] [CU017]


    The proof quality is strongest where multiple independent reports agree on scale and regional share. It is weaker where
    marketing-analysis sources discuss channel evolution without naming accounts or publishing fresh revenue mix. That is
    why the enumeration table is deliberately partial and paired with an evidence gap: the public record proves channel scale,
    not a complete customer register. [CU018] [CU033] [CU036] [CU039]'
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
