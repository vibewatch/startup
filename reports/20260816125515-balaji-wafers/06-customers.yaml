- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Evidence / Source Basis
  - Diligence Path
  rows:
  - - General Atlantic-backed distribution push
    - Execution must convert capital into repeat sell-through outside west
    - Could enlarge national channel footprint and IPO story
    - GA / Business Standard / Indian Food Times reporting
    - Track state-wise distributor adds, outlet activation and reorder cohorts
  - - Modern trade expansion
    - Large retailers may demand margin, promotions and service levels
    - Improves urban reach but can compress terms
    - Marketing and investment sources discuss channel expansion
    - Request chain-level contracts, margin terms and revenue share
  - - E-commerce growth
    - Digital channels may be small or promotion-heavy
    - Adds national discovery but uncertain profitability
    - Secondary marketing sources identify e-commerce as growing
    - Request marketplace GMV, repeat rate, CAC and promo spend
  - - Western-India home-market dominance
    - ~80–90% revenue from west creates geographic concentration
    - High regional loyalty but less proven national transferability
    - MarkHub24 / Forbes India / PotatoPro
    - Request revenue by state and active outlet maturity by cohort
  - - Competitive national push
    - Haldiram’s, Bikaji, PepsiCo/ITC and startups contest same occasions
    - Could slow acquisition and require higher advertising
    - Agro & Food Processing adverse source plus ET/TOI category reports
    - Benchmark share gains vs rivals by state and channel
  - - Low-advertising value model
    - May under-support awareness in unfamiliar markets
    - Protects price-value moat but could slow new-market trial
    - Regional strategy and marketing sources
    - Test ad-to-sales, trial, repeat and retailer economics by region
  notes: Risks focus on customer/channel concentration rather than financial concentration; precise revenue shares by state
