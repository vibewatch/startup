- id: s5
  title: Expansion and Concentration Risk
  body: 'The expansion opportunity is to take a western-India playbook national: use General Atlantic-backed professionalisation
    and distribution investment to widen modern trade, e-commerce and general-trade reach beyond Gujarat, Maharashtra and
    adjacent markets. General Atlantic’s 2026 investment is explicitly tied in public sources to distribution, innovation
    and institutional readiness, and that can help Balaji Wafers improve national coverage, reporting discipline and route-to-market
    execution. [CU027] [CU031]


    The risk is that the customer franchise may be less transferable than the headline valuation assumes. Roughly 80–90% of
    revenue still comes from western India, and outside that base Balaji faces Haldiram’s, Bikaji, PepsiCo/ITC and newer snack
    brands with stronger national brand budgets and entrenched trade relationships. Adverse Diwali-snack coverage shows rivals
    contesting the same consumer occasions. The diligence ask is therefore channel-specific: prove that outlet expansion outside
    the west converts into repeat sell-through, not just distribution loading. [CU028] [CU029] [CU030] [CU032] [CU034] [CU037]'
