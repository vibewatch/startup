  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table TU003 is partial rather than exhaustive
    missingEvidence: Exact named enterprise customers, distributor identities, modern-trade contracts and e-commerce marketplace
      performance are not publicly disclosed for Balaji Wafers.
    whyItMatters: The chapter can prove channel scale, but not account-level quality, revenue concentration or referenceability
      without private customer evidence.
    diligencePath: Request the top distributor list, modern-trade account list, marketplace dashboards and reference calls
      during diligence.
    relatedQuestionRefs:
    - QU012
    - QU015
    - QU016
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: Retention, repeat purchase and satisfaction metrics
    missingEvidence: NRR, GRR, churn, consumer cohort retention, satisfaction scores, complaint ratios and distributor reorder
      frequencies are not available in public sources.
    whyItMatters: Regional share suggests loyalty, but underwriting national expansion requires measured repeat purchase and
      retailer replenishment, not just qualitative brand strength.
    diligencePath: Obtain household-panel repeat rates, distributor reorder cohorts, retailer sell-through, CSAT/NPS and complaints
      by region.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: Channel-wise and geography-wise revenue mix
    missingEvidence: Public reports cite western-India concentration and total revenue, but not revenue by state, distributor,
      outlet type, modern trade or e-commerce platform.
    whyItMatters: Without channel mix, the team cannot distinguish sustainable consumer pull from distributor loading or concentration
      in a small set of trade partners.
    diligencePath: Request audited state/channel revenue, top-customer concentration, active outlet counts and cohort maturity
      by region.
    relatedQuestionRefs:
    - QU003
    - QU021
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
  - type: conflicting-data
    severity: minor
    topic: Market-share and outlet-count methodology
    missingEvidence: Sources report 65–90% Gujarat potato-chip share, ~65% western-India organized snacks, 1,225–1,300+ distributors
      and 4.5 lakh+ outlets, but methodologies and denominators are not published.
    whyItMatters: The same metrics are central to customer proof; poor denominator quality could overstate adoption or make
      cross-region comparisons unreliable.
    diligencePath: Reconcile reported shares with Nielsen/Kantar-style panels, distributor master data and active-store definitions.
    relatedQuestionRefs:
    - QU007
    - QU010
    - QU011
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: minor
    topic: Modern trade and e-commerce customer outcomes
    missingEvidence: No retained public source gives named chain contracts, platform GMV, repeat cohorts, margins or promotional
      spend for modern trade and e-commerce.
    whyItMatters: These channels are important for national growth, but their economics may differ materially from kirana-led
      home-market distribution.
    diligencePath: Request account P&Ls, trade terms, promotion calendars, marketplace dashboards and repeat-purchase cohorts
      for each large channel.
    relatedQuestionRefs:
    - QU005
    - QU015
    - QU016
    - QU027
    relatedTableRefs:
    - TU003
