chapter:
  number: 6
  title: Customers & Distribution
  summary: 'Balaji Wafers’ “customer” proof is best read through FMCG distribution: a production-scale network of 1,225–1,300+
    distributors and 4.5 lakh+ retail outlets, dominated by kirana/general trade and reinforced by value-conscious repeat
    purchase in Gujarat and western India. The company has strong regional consumer pull — ~65–90% Gujarat potato-chip share
    and ~65% western-India organized snacks — but exact enterprise customers, NRR, churn, satisfaction and channel-wise revenue
    are not public. The expansion case is a national distribution push backed by General Atlantic; the risk is that roughly
    80–90% of revenue remains western-India concentrated while Haldiram’s, Bikaji, PepsiCo/ITC and startups contest share
    outside Balaji’s home markets.'
sections:
- id: s1
  title: 'Customer Segments: Consumers, Trade Buyers, and Geography'
  body: 'Balaji Wafers is a traditional FMCG business, so the relevant “customer” lens is broader than named enterprise accounts.
    The end user is the mass-market snack consumer: rural and urban, value-conscious, price-sensitive and responsive to the
    “Zyada Chips, Kam Hawa” (“More Chips, Less Air”) value-pack promise. The buyer/payer at the shelf is often that same consumer,
    but the trade customer that determines availability is the distributor, wholesaler, kirana owner, general-trade retailer,
    modern-trade chain or e-commerce marketplace that stocks and replenishes inventory. [CU004] [CU005] [CU006]


    Geographically, the customer base is heavily western-India weighted. Public sources consistently point to exceptional
    Gujarat and western-India strength: ~65–90% Gujarat potato-chip share, ~65% western-India organized-snacks share and roughly
    80–90% of revenue from western India. That concentration is evidence of deep local fit, but it also means customer proof
    outside core markets is less developed and must be diligence-tested by channel. [CU007] [CU008] [CU009] [CU040]'
