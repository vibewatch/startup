- id: s4
  title: Retention, Repeat Purchase, and Satisfaction Visibility
  body: 'Retention is economically important for Balaji Wafers, but it is not disclosed in SaaS metrics. Public sources do
    not provide NRR, GRR, churn, customer cohort retention, household-panel repeat rates, satisfaction ratings or complaint
    ratios. The best evidence is indirect: high Gujarat/western-India share, large outlet coverage and persistent revenue
    scale suggest repeat consumer pull and retailer replenishment in home markets. Those signals are credible, but they are
    not a substitute for panel data or distributor order histories. [CU010] [CU011] [CU023] [CU024]


    The likely durability mechanism is simple: value packs create trial, ubiquitous kirana availability reduces friction,
    local plants support freshness, and retailers keep stocking what sells. This is a strong FMCG retention story in core
    geographies, not a verified customer-level retention model. A diligence process should request consumer repeat panels,
    distributor reorder frequency, outlet active-rate definitions, modern-trade sell-through and e-commerce repeat-purchase
    data before underwriting national retention durability. [CU025] [CU026] [CU038]'
  claimRefs:
  - CU010
  - CU011
  - CU023
  - CU024
  - CU025
  - CU026
  - CU038
