- id: s2
  title: Adoption Trajectory and Distribution Reach
  body: 'Balaji Wafers’ adoption trajectory is visible in physical reach rather than SaaS-style active-user dashboards. The
    strongest reported metric is the distribution footprint: roughly 1,225–1,300+ distributors and 4.5 lakh+ retail outlets.
    In an impulse-snacking category, that footprint matters because availability drives trial, repeat purchase and retailer
    reorder loops. Store-level data are not public, but the combination of outlet coverage, revenue scale above ₹5,000 crore
    and reported FY25 revenue of ~₹6,548 crore (~18% YoY growth) is a credible proxy for sustained sell-through. [CU001] [CU019]
    [CU020]


    Adoption is also supported by operations. Four automated plants in Rajkot, Valsad and Indore and 65+ SKUs give the company
    enough product breadth and replenishment capacity to serve multiple snack occasions and keep western/central trade channels
    supplied. The diligence issue is denominator quality: public sources report outlets and distributors, but not active outlet
    counts, SKU velocity, reorder frequency or channel-wise revenue. [CU012] [CU013] [CU025] [CU035]'
  claimRefs:
