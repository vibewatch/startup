  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Recognition
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers monetizes manufactured packaged snacks rather than software, subscriptions or marketplace
              take-rate. The reported revenue base is built from potato wafers, namkeen and other savouries, extruded or
              western snacks, and adjacent packaged products sold under the Balaji brand through wholesale distributors
              and retailers. Public evidence supports the headline scale — ~₹4,600 crore FY23 revenue, ₹5,454 crore FY24
              revenue, and ~₹6,548 crore estimated FY25 revenue — but not a precise product-line revenue mix. [CI001]
              [CI004] [CI005] [CI006]

              Pricing is explicitly value-for-money: low price points, heavier fill and the "Zyada Chips, Kam Hawa"
              positioning are designed to create consumer pull in kirana and mass retail. Revenue recognition should be
              treated like packaged goods sell-in or sell-through through distributors, subject to retailer returns,
              trade schemes, discounts and GST; none of those accounting details are public. The diligence implication
              is that reported top line looks high quality because it is tied to physical units, repeat snacks
              consumption and daily manufacturing throughput, but exact mix, realized pricing and promotional deductions
              remain private-company gaps. [CI002] [CI003] [CI037] [CI038]
            claimRefs:
