            body: >-
              People and execution risk is the bridge between the existing franchise and the priced-in future.
              Chandubhai Virani remains chairman, managing director and the public face, while the Virani family retains
              control after GA’s minority stake. [CR024] [CR026] The next generation helped lead the GA process, and
              professionalisation is expected, but public sources do not name a complete post-deal C-suite, plant
              leadership bench or national sales leadership plan. [CR025] [CR027] That matters because the next phase
              requires simultaneous governance upgrade, new-market expansion, quality systems, distributor scaling and
              eventual IPO readiness.


              The mitigation program should be explicit and threshold-based. Positive evidence would include audited
              FY25/FY26 accounts matching reported metrics, no material FSSAI notices or recalls, documented procurement
              and quality controls, national expansion cohorts with improving contribution margin, a signed family/GA
              governance framework, and named professional leaders in finance, quality, sales and operations. [CR038]
