      - number: '7.2'
        title: Regulatory, legal and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              Balaji’s regulatory risk is that a mass-market fried-snacks manufacturer has little room for food-safety
              error. Public sources show official brand/product presence and a Rajkot quality / food-safety leader role,
              but they do not provide a complete FSSAI license register, plant audit trail, recall history or
              enforcement docket. [CR001] [CR032] That makes the regulatory/legal register deliberately partial rather
              than exhaustive. A single material recall, contamination issue or plant shutdown would transmit directly
              into brand trust and distributor confidence, so FSSAI compliance evidence should be treated as a closing
              condition rather than a post-investment nice-to-have. [CR019] [CR037]


              The legal and corporate-disclosure risk is different but equally important. Balaji Wafers Private Limited
              has a public legal identity and CIN U15400GJ1995PTC027555, yet private-company status limits visibility
              into audited FY25 accounts, debt, working capital, related-party transactions, litigation and the General
              Atlantic shareholder agreement. [CR002] [CR003] [CR004] GST also remains a model sensitivity because
              namkeen moved from 18% to 12%, proving that category tax rules can change economics. [CR005] The evidence
              gap is not proof of a problem; it is proof that diligence must obtain licenses, notices, legal schedules,
              filings and the shareholder agreement before underwriting a public-market exit. [CR038]
            claimRefs:
