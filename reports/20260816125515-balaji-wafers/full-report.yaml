            body: >
              The bull case assumes Balaji sustains historical 20–25%+ growth for several years, validates 14–15% net
              margins, expands beyond western India without sacrificing value positioning, and enters the public market
              near or above the Bikaji revenue-multiple reference. [CV008] [CV024] [CV030] The base case is more
              restrained: FY25 growth of ~18% fades toward the mid-teens, margins remain strong but not expanding, and
              the IPO multiple stays near the GA mark because public investors already price much of the quality.
              [CV006] [CV031]

              The bear case is not a collapse scenario; it is multiple compression. If national expansion requires
              heavier advertising, commodity costs squeeze contribution, or governance / IPO readiness lags, a 4.0x
              revenue lens could pull value meaningfully below the ₹35,000 crore mark even while the company remains a
              good business. [CV032] [CV034] [CV036] The downside triggers are therefore operational and evidentiary:
