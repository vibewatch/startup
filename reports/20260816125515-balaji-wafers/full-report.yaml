  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Consumer Workflow Definition
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers should be evaluated as a traditional FMCG manufacturer whose “product” is the end-to-end
              ability to put affordable, fresh salty snacks into neighbourhood retail at high frequency. Its
              consumer-facing portfolio spans 65+ SKUs across potato wafers, namkeen such as bhujia, sev and gathiya,
              extruded snacks, baked variants, peas, peanuts and related savouries. [CE001] [CE033] In workflow terms,
              the job starts with a consumer looking for a low-ticket snack, a kirana or modern-trade outlet needing
              fast-moving value packs, and the manufacturer needing to convert commodity inputs into consistent packets
              with enough freshness and fill to support “Zyada Chips, Kam Hawa.” [CE002] [CE029] The product-module map
              is therefore not a set of app modules: it is a SKU/asset/plant matrix that ties wafers, namkeen and
              extruded/baked products to potatoes, chickpea/gram inputs, oil, fryers, seasoning, packaging and
              distribution. [CE010]
