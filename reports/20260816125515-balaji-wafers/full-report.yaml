            body: >
              Public traction is substantial: the business moved from roughly ₹4,600 crore FY23 revenue to ₹5,454 crore
              in FY24 and an estimated ~₹6,548 crore in FY25, implying about 18% YoY growth in FY25 and continuing a
              historical 20–25%+ CAGR narrative. [CI004] [CI005] [CI006] [CI007] The operating footprint also
              corroborates scale, with 65+ SKUs, four automated plants, daily production across wafers and savouries,
              and a reported 4.5 lakh+ retail outlet network. [CI003] [CI011] [CI014] [CI015]

              The gap is auditability. Balaji is private, FY25 revenue and profit are press estimates, and retained
              public sources do not include audited MCA financial statements, segment revenue, gross margin, cash
              balance, debt schedule, SKU velocity, distributor receivables, inventory days or related-party
              disclosures. [CI021] [CI022] [CI038] [CI039] Those missing metrics matter because the January 2026
              valuation embeds confidence in both scale and margin quality. The range exhibit therefore treats FY25
