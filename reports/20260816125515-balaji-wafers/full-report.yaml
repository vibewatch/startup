chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, History, and Business Model
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers Private Limited is headquartered in Rajkot, Gujarat, India and operates in the consumer/FMCG
              packaged salty-snacks category. Its one-line business model: manufacture and mass-distribute affordably
              priced potato wafers and Indian namkeen (bhujia, sev, gathiya), extruded and baked snacks under the
              "Balaji" brand, earning margin on high-volume, value-for-money packs sold through a deep kirana
              (neighbourhood-store) distribution network with minimal advertising. Its famous tagline "Zyada Chips, Kam
              Hawa" ("More Chips, Less Air") encapsulates the value positioning. [CO001] [CO002]

              The origin story is a defining part of the company's identity. The Virani family were a farming household
              from the Jamnagar district of Gujarat; after a drought, patriarch Popatbhai sold ancestral land and gave
              the brothers roughly ₹20,000 to start over. In 1974 the brothers took a contract to run the canteen at the
              Astron Cinema in Rajkot, where they began frying and selling potato wafers; the "Balaji" brand (named
              after a temple) was formally established around 1982, moving from home kitchen to semi-automated and then
              fully automated production over the following two decades. [CO003] [CO004] [CO005]

              The company remained wholly bootstrapped and family-owned for its entire history until 2026, funding all
              capacity expansion from internal accruals rather than external equity or venture capital. The private
              limited entity carries CIN U15400GJ1995PTC027555 and is registered in Gujarat. [CO006] [CO007]
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
