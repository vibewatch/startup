      - number: '5.4'
        title: Trust, Food Safety and Quality Controls
        blocks:
          - type: paragraph
            body: >
              The trust layer is food safety rather than cybersecurity. Public evidence supports the presence of
              FSSAI-facing compliance and food-safety/quality-assurance roles, including a food-technology leadership
              hiring signal for Balaji’s Rajkot operations. [CE015] [CE016] The KattuFoodTech posting is important
              because it is the closest developer-signal equivalent for a food manufacturer: it indicates practitioner
              demand for quality, food safety and manufacturing know-how rather than software engineers or public GitHub
              activity. [CE018] Technical literature on potato-chip processing and snack manufacturing supports the
              diligence focus on oil quality, temperature control, ingredient handling, sanitation and packaging
              integrity. [CE017] [CE019] Still, the public record does not disclose plant-level audit reports, recall
              history, microbiological metrics, HACCP/ISO certificates, batch-rejection rates or detailed QA dashboards.
              [CE036] Those private controls need direct diligence because a single food-safety failure could damage a
              brand built on trust, affordability and repeated household consumption. [CE015]
