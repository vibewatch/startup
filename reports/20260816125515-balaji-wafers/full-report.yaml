  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer Segments: Consumers, Trade Buyers, and Geography'
        blocks:
          - type: paragraph
            body: >-
              Balaji Wafers is a traditional FMCG business, so the relevant “customer” lens is broader than named
              enterprise accounts. The end user is the mass-market snack consumer: rural and urban, value-conscious,
              price-sensitive and responsive to the “Zyada Chips, Kam Hawa” (“More Chips, Less Air”) value-pack promise.
              The buyer/payer at the shelf is often that same consumer, but the trade customer that determines
              availability is the distributor, wholesaler, kirana owner, general-trade retailer, modern-trade chain or
              e-commerce marketplace that stocks and replenishes inventory. [CU004] [CU005] [CU006]


