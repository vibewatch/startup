  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis is that Balaji Wafers is a rare Indian consumer franchise: a bootstrapped,
              profitable, high-volume salty-snacks platform with ~₹6,548 crore FY25 revenue, net profit approaching
              ₹1,000 crore, roughly 14–15% net margins, four automated plants, 65+ SKUs and deep western-India
              distribution. [CV006] [CV007] [CV017] [CV019] [CV020] Market context also helps: India savoury snacks
              remains a large, organised-growth category, and Balaji's value-pack positioning gives it a differentiated
              answer to national brands that spend more on advertising. [CV021] [CV023]

              The anti-thesis is equally valuation-driven. The General Atlantic transaction already values Balaji at
              about ₹35,000 crore (~$4.2B), or roughly ~5.3x FY25 revenue and ~35x earnings, after prior PE funds
              reportedly viewed a ~₹40,000 crore ask as steep. [CV001] [CV005] [CV013] That means the investor is not
              buying a hidden cheap asset; the investor is underwriting continued 15–20%+ growth, durable margins,
              national expansion against PepsiCo, Haldiram's and ITC, and institutional-grade governance from a formerly
              family-only company. [CV014] [CV034] [CV035] Table TV002 separates the thesis from the anti-thesis, while
              Figure FV001 shows why the final recommendation is conditional rather than categorical.
