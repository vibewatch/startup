  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: national incumbents, listed challengers, regional substitutes'
        blocks:
          - type: paragraph
            body: >-
              Balaji Wafers competes in a broad salty-snacks landscape rather than a neat two-player category. The
              direct national western-snacks benchmark is PepsiCo, led by Lay's and Kurkure, with roughly 22%
              western-snacks share and stronger urban brand reach. Haldiram's is the ethnic-snacks and trust incumbent,
              with roughly 36% ethnic-snacks share and a reported $10B-plus valuation. ITC Bingo adds another national
              western-snacks platform at about 13% share. Listed challengers include Bikaji Foods and Prataap
              Snacks/Yellow Diamond, while regional players such as GCB, local namkeen makers, loose snacks and
              private-label packs remain live substitutes on price-sensitive kirana shelves. [CP001] [CP002] [CP003]
              [CP004] [CP009] [CP010] The practical map is therefore national-brand reach versus regional value density,
              not merely PepsiCo versus Balaji. [CP041]
