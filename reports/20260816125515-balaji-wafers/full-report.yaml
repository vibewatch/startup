              - CO010
              - CO011
              - CO012
      - number: '1.3'
        title: Unicorn Financing Event — General Atlantic Investment
        blocks:
          - type: paragraph
            body: >
              In January 2026 US-headquartered growth investor General Atlantic agreed to acquire a roughly 7% minority
              stake in Balaji Wafers for over ₹2,000–2,500 crore (approximately $280–300 million), valuing the company
              at about ₹35,000 crore (~$4.2 billion). This was Balaji Wafers' first-ever institutional external
              investment in more than five decades of operation and is the clear unicorn-scale financing event anchoring
              this report. [CO014] [CO015] [CO016]

              The deal followed a competitive process. Multiple strategic and financial suitors — including ITC,
              PepsiCo, General Mills, Kedaara Capital, TPG and Temasek — had explored stakes in Balaji at valuations
              reported in the ₹35,000–40,000 crore range; General Atlantic ultimately prevailed. The transaction
              structure is a minority, non-controlling investment: the Virani family retains control, and proceeds are
              intended to professionalise operations, strengthen governance, accelerate innovation and distribution, and
              prepare for an IPO in roughly three to four years. [CO017] [CO018] [CO019]

              The valuation was not without scepticism. Earlier in the process some private-equity funds reportedly
              balked at Balaji's steep ask (reported around ₹40,000 crore), causing talks to stall before the General
              Atlantic deal closed at ~₹35,000 crore — a caution flag on the aggressive ~5x revenue / ~35x earnings
              multiple that later chapters examine in detail. [CO020] [CO021]
            claimRefs:
