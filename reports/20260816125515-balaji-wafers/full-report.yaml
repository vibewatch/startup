            body: >
              The current price anchor is the January 2026 General Atlantic minority investment: approximately a 7%
              stake for more than ₹2,000–2,500 crore, implying roughly ₹35,000 crore (~$4.2B) equity value and making GA
              the first external institutional shareholder in a family-controlled company. [CV001] [CV002] [CV003]
