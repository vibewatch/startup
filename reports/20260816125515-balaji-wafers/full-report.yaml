      - number: '2.5'
        title: Preserved Sizing Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              The biggest analytical gap is not whether India snacks is large; it is whether each source is measuring
              the same boundary. Some sources speak to snacks broadly, others to savoury snacks, namkeen, potato chips,
              organised snacks or revenue rankings. Paid research pages also disclose headlines while keeping
              methodologies private. The resulting ₹46,571–50,000 crore market range is credible enough for directional
              TAM work, but not precise enough for a valuation model without methodology reconciliation. [CM023] [CM025]
              [CM037]

              Balaji's exact share is also estimated. Public reporting supports ~₹6,548 crore FY25 revenue,
              third-largest salty snack positioning, ~65–90% Gujarat potato-chip share and ~65% western-India
              organised-snack share, but the company does not publish audited segment revenue or state-by-state share.
              Diligence should therefore preserve both truths: Balaji is already a scaled market leader in western
              India, and its national market share, SAM penetration and category-by-category economics remain diligence
              estimates until management data, retailer audits and plant/shipment records are reviewed. [CM010] [CM024]
              [CM027] [CM033] [CM039]
            claimRefs:
              - CM010
