      - number: '1.2'
        title: Founders, Family Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers is led by its three founding brothers. Chandubhai Virani is Chairman and Managing Director
              and the key public face of the company; his brothers Bhikhubhai Virani and Kanubhai Virani are co-founders
              who share management responsibility for operations and manufacturing. The business has historically been
              run as a tightly-held family enterprise with no external institutional directors before 2026. [CO008]
              [CO009]

              Chandubhai Virani's oft-quoted philosophy — "No job is too small. The shame is not in starting small, it's
              in giving up on your dreams" — reflects the company's frugal, execution-first culture. The General
              Atlantic transaction of January 2026 was described in reporting as being led substantially by the next
              generation of the Virani family (sons and daughters now involved in the business), signalling a deliberate
              generational transition and a move toward professionalising management ahead of a potential IPO. [CO010]
              [CO011]

              Governance is the central diligence question: the company is transitioning from a founder-and-family-run
              structure toward institutional-grade governance. General Atlantic's minority investment leaves the Virani
              family firmly in management control, but the stated plan is to bring in professional external management
              and strengthen corporate functions to reach IPO readiness. Key-person dependence on Chandubhai Virani, and
              the durability of the family's alignment through a generational handover, remain material governance
              considerations. [CO012] [CO013]
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
