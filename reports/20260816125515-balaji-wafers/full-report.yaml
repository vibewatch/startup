      - number: '5.3'
        title: Supply Chain, Distribution Reliability and Critical Dependencies
        blocks:
          - type: paragraph
            body: >
              Balaji’s operational reliability depends on a relatively old-fashioned but powerful chain: local potato
              sourcing, cool storage, oil and ingredient procurement, dense distributor coverage, plant throughput and
              rapid retail replenishment. [CE011] [CE012] [CE013] The freshness claim is plausible because the
              manufacturing footprint is near western and central Indian consumption centers, and the product form is
              shelf-stable but freshness-sensitive. [CE028] [CE034] The weak point is commodity dependence. Potatoes and
              edible oil are volatile input baskets, and wafer economics can be squeezed by crop quality, storage
              losses, oil-price inflation or supply interruptions. [CE025] A second dependency is route-to-market
              concentration: the company’s regional density is a strength in Gujarat and western India, but it also
              means national expansion has to replicate distributor service levels outside the home terrain. [CE027] The
              critical-dependency map therefore treats raw materials, cool chain, plant automation, packing uptime and
              logistics density as one coupled operating system. [CE013]
