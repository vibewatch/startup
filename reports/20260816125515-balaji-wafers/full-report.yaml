      - number: '5.2'
        title: Automated Manufacturing Architecture and Operating Flow
        blocks:
          - type: paragraph
            body: >
              The core operating architecture is a vertically integrated, highly automated snack-manufacturing line.
              Reported plant assets include four fully automated plants across Rajkot and Valsad in Gujarat and Indore
              in Madhya Pradesh, with daily output cited at roughly 100,000 kg of potato wafers plus 500,000 kg of other
              savouries. [CE003] [CE004] Technical and trade sources describe international-standard lines,
              temperature-controlled continuous fryers, automated packaging at about 1,800 packets per minute, robotic
              palletization and vertical or automated warehouses. [CE005] [CE006] [CE007] [CE008] [CE009] A practical
              production flow starts with local raw-material procurement and cool storage, then moves through
              washing/slicing or dough/extrusion, frying/baking, seasoning, quality checks, packing, palletization,
              warehouse staging and dispatch. [CE010] This architecture matters because the company’s low-ad-spend,
              value-pack model requires unit-cost discipline, high asset utilization and rapid turnaround rather than
              premium advertising-led demand creation. [CE014] [CE035]
