      - number: '4.2'
        title: GTM Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              Balaji's GTM motion is a classic Indian FMCG distribution machine rather than enterprise sales. The
              company reaches roughly 4.5 lakh+ retail outlets through about 1,225–1,300+ distributors, with sales
              velocity supported by low-price packs, regional brand strength and frequent consumer repurchase. [CI011]
              [CI012] [CI034] In diligence terms, the sales cycle is likely short at the store and distributor reorder
              level, but the public record does not disclose distributor credit terms, trade spend, retailer margins,
              salesforce productivity or SKU-level fill rates.

              The strongest public proxy for sales efficiency is marketing intensity. Sources report advertising spend
              at about 4% of revenue versus an 8–12% industry norm, implying a structurally lower CAC-like burden than
              national FMCG peers that must buy reach through mass media. [CI009] [CI010] [CI013] That advantage may not
              transfer perfectly outside western India, where Balaji's channel familiarity and brand pull are weaker and
              national competitors have larger marketing budgets. For underwriting, the question is whether future
              national expansion preserves the low-ad-spend, distributor-led model or requires a step-up in trade
              promotion and media spend that compresses margin. [CI035]
            claimRefs:
              - CI009
              - CI010
