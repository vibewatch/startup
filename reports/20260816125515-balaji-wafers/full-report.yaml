      - number: '4.5'
        title: Capital Adequacy, Financing Dependency, and Verdict
        blocks:
          - type: paragraph
            body: >
              Balaji's capital picture is different from a venture-backed cash-burn story. The company reportedly funded
              its growth from internal accruals until January 2026, when General Atlantic acquired about 7% for over
              ₹2,000–2,500 crore at a ~₹35,000 crore valuation. [CI023] [CI024] [CI025] Public evidence points to strong
              internal accruals, self-funded capex into automated plants and modest debt, but cash on hand, monthly
              burn, runway and debt covenants are not disclosed. [CI016] [CI028] [CI039]

              The financing dependency is therefore strategic rather than existential: GA capital and governance support
              are meant to professionalise functions, accelerate innovation and distribution, and prepare for a targeted
              IPO in 2028–2030. [CI026] [CI027] The verdict is positive on revenue quality and margin path but
              conditional on verification. Revenue is tied to physical repeat consumption, high volume and broad retail
              reach; margins benefit from scale, automation and low ad spend. The blockers are private-company opacity,
              potential commodity and trade-spend pressure, and an aggressive valuation — roughly ~5.3x FY25 revenue and
              ~35x earnings — that leaves little room for margin slippage. [CI029] [CI030] [CI040]
