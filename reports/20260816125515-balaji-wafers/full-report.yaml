      - number: '2.2'
        title: Evidence-Constrained TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              The cleanest TAM lens is India savoury/salty snacks at roughly ₹46,571–50,000 crore in 2024, growing about
              8–9% CAGR. Because research vendors use different inclusions, this chapter preserves the range rather than
              forcing false precision. A practical diligence TAM is therefore rounded to approximately ₹50,000 crore for
              total India savoury snacks; the SAM is narrower — organised western India plus the potato-chip and namkeen
              segments in geographies Balaji can serve through current plants, distributors and national expansion; and
              the current SOM is Balaji's ~₹6,548 crore FY25 revenue. [CM001] [CM006] [CM007] [CM023]

              On the headline math, ~₹6,548 crore is about 13% of a ₹50,000 crore total market and roughly 14% of the
              lower ₹46,571 crore estimate, while Balaji's share is much higher in its western-India stronghold. That
              makes Balaji a scaled national contender despite its regional concentration. The diligence risk is that
              SAM is not a public audited figure: it must be rebuilt from plant reach, distributor economics, channel
              mix and category overlap rather than accepted as a single published number. [CM008] [CM009] [CM016]
              [CM038]
