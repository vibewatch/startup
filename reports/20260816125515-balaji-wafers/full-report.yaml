      - number: '1.4'
        title: Scale, Cover Metrics, and Operating Footprint
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers operates at national FMCG scale. Reported revenue was ₹5,454 crore (~$655M) in FY24 with net
              profit of ₹579 crore (a 41% jump), rising to an estimated ~₹6,548 crore (~$785M) in FY25 at roughly 18%
              YoY growth, with net profit approaching ₹1,000 crore (~$120M). These figures make it India's third-largest
              salty snack brand after PepsiCo (Lay's/Kurkure) and Haldiram's. [CO022] [CO023] [CO024]

              Operationally the company runs four fully automated manufacturing plants (Rajkot and Valsad in Gujarat,
              and Indore in Madhya Pradesh), producing on the order of 100,000 kg of potato wafers plus ~500,000 kg of
              other savouries daily. It markets 65+ SKUs and reaches roughly 4.5 lakh+ (450,000) retail outlets through
              1,225–1,300+ distributors, employing approximately 1,932 people. Its regional dominance is stark — an
              estimated 65–90% share of Gujarat potato chips and ~65% of western-India organised snacks. [CO025] [CO026]
              [CO027]

              Cover metrics carry meaningful uncertainty because Balaji is a private company that does not publish
              audited statements publicly; FY25 revenue and profit are press-reported estimates rather than filed
              figures, and exact headcount and outlet counts vary by source. These gaps are preserved as diligence items
              rather than treated as precise. [CO028] [CO029]
