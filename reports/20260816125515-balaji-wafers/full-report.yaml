              ITC, PepsiCo, General Mills, Kedaara, TPG and Temasek, which supports strategic scarcity value but also
              shows that price discovery was contentious. [CV014]

              The valuation arithmetic is simple and demanding. Against FY25 revenue of ~₹6,548 crore and profit
              approaching ₹1,000 crore, the GA mark is about ~5.3x revenue and ~35x P/E. [CV005] [CV006] [CV007] This is
