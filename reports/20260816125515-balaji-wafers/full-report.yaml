      - number: '4.3'
        title: Cost Structure, Unit Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >
              The public unit-economics story is coherent even though SKU-level contribution margins are not available.
              Balaji sells low-priced snack packs with thin per-pack gross rupees, but offsets that with extraordinary
              volume — roughly 100,000 kg of wafers plus 500,000 kg of other savouries daily — automation, local potato
              sourcing, cost discipline and low advertising intensity. [CI003] [CI015] [CI017] [CI018] Reported EBITDA
              margin of ~13–15% and net margin of ~14–15% are strong for a value-priced food manufacturer, particularly
              when FY24 PAT was ₹579 crore and FY25 profit is estimated to approach ₹1,000 crore. [CI005] [CI006]
              [CI008]

              The major costs to diligence are potatoes, edible oil, packaging, power, plant labour, freight,
              distributor margins, returns and promotional schemes. Public comps show raw-material pressure can affect
              listed snacks peers, reinforcing the need to obtain Balaji's commodity hedging, inventory days and
              trade-payables data. [CI019] Capex intensity is real: the company built four automated plants and
              continues investing in manufacturing capacity, so free cash flow should be tested after maintenance capex,
              expansion capex and working-capital absorption rather than judged from PAT alone. [CI015] [CI016]
            claimRefs:
