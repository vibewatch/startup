            body: >
              The comparable set is useful but imperfect. Bikaji is the cleanest public comparable because it is listed,
              Indian and snacks-led; public data puts FY25 revenue around ₹2,617–2,622 crore and market capitalization
              around ₹16,140 crore, implying roughly ~6.2x FY25 revenue. [CV010] That makes Balaji's ~5.3x revenue GA
              mark look defensible on a revenue-multiple basis, especially if Balaji's net margin and western-India
              dominance are superior. [CV005] [CV018] [CV024]

              Haldiram's, Prataap Snacks and PepsiCo India are less precise but still important. Haldiram's $10B+
              private mark is a premium-scale reference; Prataap Snacks' ~₹1,720 crore FY25 revenue shows the size of a
              smaller listed player; PepsiCo India is a strategic segment reference rather than a stand-alone Indian
              snacks valuation comp. [CV009] [CV011] [CV012] [CV041] Table TV004 is deliberately labelled partial
              because private-company marks, segment-only data and different product mixes prevent exhaustive
              comparability. The evidence gap attached to TV004 is therefore a gating diligence item, not a cosmetic
              caveat.
            claimRefs:
              - CV005
