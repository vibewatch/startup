  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Severity ranking: valuation, concentration and governance drive residual exposure'
        blocks:
          - type: paragraph
            body: >-
              The risk stack is unusually investment-sensitive because Balaji’s operating quality is already priced into
              a demanding 2026 transaction. The clearest top risk is valuation: private-equity funds reportedly balked
              at a steep ~₹40,000 crore ask and talks stalled before General Atlantic settled around ~₹35,000 crore,
              equal to roughly 5.3x FY25 revenue and ~35x P/E on the canonical ~₹6,548 crore revenue / near-₹1,000 crore
              profit base. [CR006] [CR007] [CR008] The risk is not that Balaji is weak; it is that the price requires
              continued growth, margin resilience and national expansion at once. Geographic concentration, competition,
              commodity exposure and governance succession are the next highest residual exposures because each can
              quickly erode the assumptions behind that price. [CR010] [CR015] [CR024] [CR031] The risk heatmap
              therefore treats mitigation maturity as partial: GA improves governance and capital access, but audited
              accounts, shareholder-rights detail, national cohort data and plant-level risk controls remain diligence
              asks. [CR003] [CR038]
            claimRefs:
