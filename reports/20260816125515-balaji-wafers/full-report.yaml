      - number: '8.6'
        title: Exit Readiness, Kill Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Exit readiness is plausible but unproven. General Atlantic's official announcement and related reporting
              point to professionalisation, governance strengthening, innovation, distribution expansion and an IPO
              ambition in roughly three to four years, which maps to a 2028–2030 exit window. [CV016] [CV033] [CV037]
              However, a private-company diligence file must close the gaps that public reporting cannot: audited MCA
              accounts, cap table, shareholder agreement, plant capacity, distributor economics and margin bridge from
              accounting profit to cash generation. [CV025] [CV026] [CV027] [CV040]

              The thesis should break before price discipline does. If audited FY25 revenue is materially below ~₹6,548
              crore, profit is materially below the near-₹1,000 crore press estimate, margin durability depends on
              temporary commodity benefits, or IPO governance milestones slip, the recommendation moves from conditional
              buy to track / research-more. [CV006] [CV007] [CV039] A second kill path is strategic: if western
              concentration remains high while national expansion collides with PepsiCo, Haldiram's and ITC budgets,
              Balaji may still be a strong operator but not worth a premium private entry price. [CV034] [CV035] Tables
              TV005 and TV006 convert these risks into executable IC gates.
