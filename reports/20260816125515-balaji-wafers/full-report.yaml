      - number: '2.3'
        title: Segments, Buyers, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Balaji's buyer is the mass-market, value-conscious Indian household shopper, with strong impulse usage by
              children, youth and family snack occasions. The payer is usually the household or individual consumer, but
              adoption is mediated by the retailer: kirana shelf space, distributor credit, pack-price architecture and
              perceived fill value decide which brands are visible at the point of purchase. Modern trade and e-commerce
              add discovery and larger pack formats, but the company's 4.5 lakh+ retail-outlet reach means kirana
              remains the adoption backbone. [CM012] [CM013] [CM014] [CM030]

              Segment economics vary. Potato chips offer a large western snack pool and are Balaji's strongest
              association; namkeen, bhujia, sev and gathiya preserve regional taste advantages; extruded/western snacks
              are needed to compete with national brands; and baked/healthy formats are an emerging option but still
              smaller than core chips and namkeen. The buyer map therefore separates user occasion from budget owner and
              channel gatekeeper, because winning consumer taste is insufficient if the retailer economics and
              replenishment reliability fail. [CM003] [CM011] [CM028] [CM029] [CM036]
