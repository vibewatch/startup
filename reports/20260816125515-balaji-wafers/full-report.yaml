  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              For this chapter, Balaji Wafers' market is defined as packaged savoury/salty snacks sold in India: potato
              wafers, namkeen and bhujia/sev/gathiya, extruded or western snacks, and emerging baked or
              health-positioned savoury packs. That boundary intentionally includes branded organised players and
              unbranded/loose local snacks because the organised segment is growing 10%+ as consumers shift from
              unbranded alternatives. It excludes sweets, biscuits, beverages, QSR meals and other packaged foods, while
              treating them as adjacencies or wallet-share substitutes rather than direct TAM. [CM001] [CM002] [CM015]
              [CM031]

              The status quo is not just PepsiCo or Haldiram's; it is also a neighbourhood namkeen shop, a loose farsan
              counter, or a regional unbranded chip seller. Potato chips are approximately 42% of the snack market, but
              namkeen and bhujia remain a large traditional segment, so Balaji's opportunity depends on winning both
              western-style impulse occasions and Indian savoury occasions. The 2024 GST cut on namkeen from 18% to 12%
              improves affordability for one of those core traditional subsegments. [CM003] [CM004] [CM005] [CM032]
            claimRefs:
