            body: >
              The forward roadmap is best framed as manufacturing and portfolio evolution: new flavours, health-oriented
              and baked variants, capacity expansion for national growth, deeper automation and distribution broadening.
              [CE020] [CE021] [CE022] [CE023] General Atlantic’s 2026 strategic investment is reported as supporting
              innovation, distribution expansion and professionalisation, but the public record does not yet provide a
              dated product-release calendar or plant-by-plant capex schedule. [CE032] Balaji’s differentiation is
              strongest where the evidence is operationally concrete: manufacturing scale, automated lines, value packs,
              local supply access, freshness and regional supply density. [CE028] [CE029] The least evidenced layer is
              digital technology. AWS cloud or enterprise cloud usage for business operations is unverified, so this
              chapter preserves it as an evidence gap rather than asserting a software architecture. [CE024] [CE037]
