      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Category growth is supported by urbanisation, more snacking occasions, rising incomes, organised-sector
              share gain, product innovation and the GST relief for namkeen. These drivers match Balaji's value
              architecture: low advertising intensity, automation, wide distribution and a "Zyada Chips, Kam Hawa" value
              proposition can convert consumers who want branded assurance without paying multinational premiums. The
              General Atlantic investment further validates institutional belief that the addressable market can absorb
              a larger, more professional Balaji platform. [CM017] [CM018] [CM026] [CM040]

              Constraints are equally material. Potato and edible-oil inflation can compress margins; PepsiCo,
              Haldiram's, ITC and regional namkeen brands can outspend or defend local shelves; health and baked-snack
              trends can pressure fried chips and namkeen; and national expansion requires plant capacity, logistics,
              retailer credit and working capital outside Balaji's western-India base. The market is attractive, but the
              next stage is not merely demand capture — it is a capital-intensive distribution and trust-building
              exercise in less familiar states. [CM019] [CM020] [CM021] [CM022] [CM035]
            claimRefs:
              - CM017
              - CM018
              - CM019
