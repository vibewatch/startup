            body: >
              The recommended stance is cautious-positive / conditional buy at or below the General Atlantic price, with
              medium confidence, medium-high risk, and a valuation stance of fair-to-stretched. [CV028] [CV029] The
              quality score is high because Balaji combines category scale, western-India share, product breadth, strong
              margins and a credible institutional partner; the price score is lower because the GA deal sets a
              demanding benchmark and public evidence does not yet include audited FY25 accounts, a cap table or
              shareholder-agreement terms. [CV018] [CV024] [CV025] [CV026]

              Entry discipline should therefore be explicit. A new investor should prefer a structure that is no worse
              than GA's economics, requires audited MCA financials and margin reconciliation before closing, and
              protects against a later down-round or IPO delay through governance covenants rather than relying only on
              brand momentum. [CV027] [CV038] Target return is not a venture-style binary; the base case is
              public-market rerating into a 2028–2030 IPO, while the hold/exit plan should be re-tested annually against
