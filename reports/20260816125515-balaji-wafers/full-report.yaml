companyProfile:
  summary: >
    Balaji Wafers Private Limited (CIN U15400GJ1995PTC027555) is a Rajkot, Gujarat-based packaged salty-snacks
    manufacturer founded by the three Virani brothers — Chandubhai, Bhikhubhai and Kanubhai — who began frying potato
    wafers at the Astron Cinema canteen in Rajkot in 1974 and built the "Balaji" brand from around 1982. It is India's
    third-largest salty-snack brand behind PepsiCo (Lay's) and Haldiram's, selling 65+ SKUs of potato wafers, namkeen
    (bhujia, sev, gathiya) and extruded/baked snacks from four fully automated plants across Gujarat and Madhya Pradesh
    through 1,225–1,300+ distributors and 4.5 lakh+ retail outlets. The company grew to ~₹6,548 crore FY25 revenue with
    net profit approaching ₹1,000 crore entirely bootstrapped, until General Atlantic acquired a ~7% minority stake in
    January 2026 for over ₹2,000–2,500 crore at a ~₹35,000 crore (~$4.2B) valuation — its first-ever institutional
    capital and a clear unicorn-scale event.
