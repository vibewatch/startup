      - number: '3.3'
        title: 'Pricing and packaging: value packs meet low switching costs'
        blocks:
          - type: paragraph
            body: >-
              Balaji's pricing advantage is best understood as price-pack architecture and perceived fill, not as a
              published national price card. The company sells a simple value message — more chips, less air — and
              couples it with low advertising intensity reported around 4% of revenue, below the broader industry range
              of roughly 8–12%. [CP015] [CP016] That supports shelf velocity and gross value perception in western
              India. The weakness is that salty snacks are low-ticket, frequent and easy to multi-home: a household can
              buy Balaji, Lay's, Kurkure, Haldiram's, Bingo, Bikaji, Yellow Diamond and loose namkeen in the same month,
              and a kirana can stock several. [CP018] [CP019] Consequently, Balaji's durable edge is not lock-in; it is
              distributor economics, price-value trust and repeat shelf pull. [CP020] [CP029]
