      - number: '7.3'
        title: Operational, quality and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk starts with the input basket. Balaji’s value proposition depends on potato wafers and
              fried savouries, so potatoes, edible oils, packaging and agricultural availability matter directly to
              gross margin. [CR013] [CR014] In a normal year the company’s scale and automation are strengths: four
              plants across Rajkot, Valsad and Indore reportedly produce roughly 100,000 kg of wafers and 500,000 kg of
              other savouries daily. [CR017] However, the same scale raises the severity of a quality lapse, facility
              disruption or logistics bottleneck, especially if GA-backed growth pushes the brand into unfamiliar
              non-western markets. [CR018] [CR010]


              The financial-model risk is margin compression. Balaji’s low advertising intensity, about 4% of revenue
              versus an 8–12% industry range, has helped protect profitability. [CR012] But national competition can
              force higher ad spend, trade schemes, freight and distributor incentives at the same time that commodity
              inflation rises. [CR031] If EBITDA margin drops below roughly 12%, or if input inflation cannot be passed
              through without volume loss, the ~35x P/E valuation becomes hard to defend. [CR039] Operational diligence
              should therefore focus on plant-level quality KPIs, recall processes, procurement hedges, regional
              fill-rate data, and whether new-market spending earns repeatable contribution margin. [CR038]
