              Retention is economically important for Balaji Wafers, but it is not disclosed in SaaS metrics. Public
              sources do not provide NRR, GRR, churn, customer cohort retention, household-panel repeat rates,
              satisfaction ratings or complaint ratios. The best evidence is indirect: high Gujarat/western-India share,
