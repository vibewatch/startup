  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Audited FY25 financials and margin bridge
      missingEvidence: >-
        Public sources do not provide a complete audited FY25 statement pack reconciling ~₹6,548 crore revenue, near-₹1,000
        crore profit, EBITDA, working capital, debt and cash conversion.
      whyItMatters: >-
        The GA valuation multiple and the conditional-buy recommendation depend directly on the accuracy and durability
        of those private-company financial metrics.
      diligencePath: >-
        Obtain MCA/RoC filings, statutory audit pack, FY26 year-to-date management accounts and a SKU/channel margin bridge.
      relatedQuestionRefs: [QV002, QV005, QV009, QV025]
      relatedTableRefs: [TV001, TV006]
    - type: private-evidence-only
      severity: material
      topic: Cap table, shareholder agreement and preference overhang
      missingEvidence: >-
        Public reporting does not disclose exact post-GA ownership, ESOP, liquidation preferences, vetoes, transfer rights,
        IPO ratchets or other shareholder-agreement terms.
      whyItMatters: >-
        These rights determine dilution, governance, exit economics and downside protection for any investor entering at
        or near the GA mark.
      diligencePath: >-
        Review the cap table, shareholder agreement, amended articles, board consents and closing documents before signing.
      relatedQuestionRefs: [QV006, QV025]
      relatedTableRefs: [TV001, TV005, TV006]
    - type: enumeration-incomplete
      severity: material
      topic: Comparable valuation table TV004 coverage
      missingEvidence: >-
        The public comparable set cannot exhaustively enumerate private Indian snacks transactions, Haldiram's detailed
        financials, PepsiCo India snacks-segment economics or every private secondary mark.
      whyItMatters: >-
        A partial comparable set can support a directional valuation stance but cannot by itself prove that ₹35,000 crore
        is a fully market-clearing fair value.
      diligencePath: >-
        Request banker books, transaction-comps database extracts, Haldiram process materials and confidential peer margin
        benchmarking during diligence.
      relatedQuestionRefs: [QV010, QV018, QV019, QV020, QV021, QV029]
      relatedTableRefs: [TV004]
    - type: conflicting-data
      severity: minor
      topic: Public estimates vary across private-market writeups
      missingEvidence: >-
        Sources agree directionally on the GA valuation but vary in exact deal amount, valuation phrasing and whether
        figures are pre-money, post-money or rounded press estimates.
      whyItMatters: >-
        Small denominator differences materially affect multiple calculations when the valuation is already fair-to-stretched.
      diligencePath: >-
        Reconcile signed transaction documents, audited FY25 statements and currency assumptions in the investment model.
      relatedQuestionRefs: [QV003, QV004, QV017]
      relatedTableRefs: [TV003, TV004]
