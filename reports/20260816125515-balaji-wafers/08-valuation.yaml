tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision Element
      - Recommended Stance
      - Evidence Basis
      - What Would Move the View
    rows:
      - - Investment recommendation
        - Cautious-positive / conditional buy
        - Strong franchise, profitable scale and credible IPO path, but price already embeds quality
        - Buy only with audited support and acceptable shareholder protections
      - - Confidence
        - Medium
        - Multiple high-quality news sources corroborate deal terms; FY25 financials remain press estimates
        - Raise to high after audited FY25/FY26 accounts and margin bridge
      - - Risk rating
        - Medium-high
        - Valuation, national expansion, commodity, governance and private-company disclosure risks
        - Reduce if governance and national execution milestones are met for two years
      - - Valuation stance
        - Fair-to-stretched
        - ~₹35,000 cr equals ~5.3x FY25 revenue and ~35x earnings; comparable evidence is mixed
        - Attractive below GA price or with downside protection; expensive near ₹40,000 cr without new proof
      - - Hold / exit path
        - 2028–2030 IPO readiness
        - GA reporting points to professionalisation and a three-to-four-year IPO ambition
        - Exit discipline should reset if IPO timetable slips or multiple compresses
      - - Minimum diligence condition
        - Audited accounts, cap table, SHA and plant/margin diligence before close
        - Public sources do not disclose full audited FY25 financials or investor rights
        - No close if accounting profit, control rights or preference stack are materially worse than reported
    notes: >-
      Recommendation is price-sensitive: it assumes entry at or below the General Atlantic mark and no undisclosed
      preference, debt or governance terms that materially subordinate a new investor.
    claimRefs:
      - CV005
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV033
      - CV038
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis / Watch-out
      - View Change Trigger
    rows:
      - - Market
        - India savoury snacks is large and organised growth remains attractive
        - Category growth does not automatically justify a premium private entry multiple
        - Downgrade if category growth or organised conversion slows materially
      - - Product and brand
        - 65+ SKUs and value positioning support consumer pull and shelf velocity
        - Product innovation beyond core western snacks is less proven nationally
        - Upgrade if new-region repeat purchase and SKU productivity are independently verified
      - - Customers / distribution
        - 4.5 lakh+ outlets and 1,225–1,300+ distributors create strong access
        - Western concentration may limit national portability of the model
        - Downgrade if expansion relies mainly on costly modern trade or ad spend
      - - Financials
        - ~₹6,548 cr FY25 revenue and near-₹1,000 cr profit imply rare margin quality
        - Figures are press-reported estimates for a private company
        - Kill if audited FY25 revenue or profit is materially below public estimates
      - - Competition
        - Regional dominance creates a moat against national players in core markets
        - PepsiCo, Haldiram's and ITC have larger national budgets and wider portfolios
        - Downgrade if share gains require margin-dilutive promotion
      - - Valuation and risk
        - GA's competitive process validates strategic scarcity and IPO optionality
        - PE funds reportedly balked at a steep ₹40,000 cr ask, so price risk is real
        - Buy only with entry discipline, downside protection and clear IPO milestones
    notes: >-
      Each row pairs a positive evidence-backed thesis with the adverse evidence or missing proof that would change the
      investment committee recommendation.
    claimRefs:
      - CV006
      - CV013
      - CV017
      - CV019
      - CV021
      - CV025
      - CV028
      - CV034
      - CV035
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Operating Assumptions
      - Valuation Logic
      - Probability Signal
      - Downside Trigger
    rows:
      - - Bull
        - Revenue growth sustains 20–25%+; net margin holds around 14–15%; national expansion works
        - FY30 revenue approaches ~₹13,000–15,000 cr at 6.0–6.5x revenue; exit value ~₹78,000–97,500 cr
        - Requires verified distribution productivity outside west India and IPO re-rating
        - Breaks if growth needs heavy ad spend or margins compress below 13%
      - - Base
        - Growth fades toward 15–18%; net margin remains high but stable; IPO occurs in 2028–2030
        - FY30 revenue ~₹11,000–12,500 cr at ~5.3–5.8x revenue; exit value ~₹58,000–72,500 cr
        - Supported by FY25 growth, GA sponsorship and listed-comparable revenue lens
        - Breaks if audited FY25/FY26 revenue is materially below public estimates
      - - Bear
        - Growth slows toward 10–12%; margin falls toward ~12%; governance or IPO readiness slips
        - 4.0–4.5x revenue multiple yields value near or below current GA mark
        - Triggered by PE-skepticism evidence, expansion friction or commodity pressure
        - Move to track/avoid if governance rights or preference stack amplify downside
    notes: >-
      Scenarios are illustrative ranges derived from public FY25 estimates and peer revenue-multiple lenses, not a formal
      DCF; audited financials could materially change them.
    claimRefs:
      - CV006
      - CV008
      - CV013
      - CV016
      - CV030
      - CV031
      - CV032
      - CV036
      - CV039
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Status / Reference
      - Metric or Valuation
      - Relevance to Balaji
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Public listed snacks peers, private Indian snacks marks, strategic segment references and the Balaji GA deal were
        included from the retained valuation sources; private-company and segment-only disclosures are incomplete.
    rows:
      - - Balaji Wafers GA deal
        - Private minority transaction, Jan 2026
        - ~₹35,000 cr (~$4.2B), ~5.3x FY25 revenue, ~35x P/E
        - Direct entry-price anchor for this recommendation
        - Minority rights, cap table and audited FY25 details are not public
      - - 'Bikaji Foods (NSE: BIKAJI)'
        - Listed Indian snacks company
        - ~₹16,140 cr market cap on ~₹2,617–2,622 cr FY25 revenue ≈ ~6.2x revenue
        - Clean public-market revenue-multiple reference
        - Smaller revenue base, different geography and product mix
      - - Haldiram's
        - PE-backed / private Indian snacks leader
        - $10B+ private valuation reference after Temasek-linked process
        - Premium-scale marker for Indian snacks scarcity value
        - Private mark with limited disclosed financial detail
      - - Prataap Snacks
        - Listed smaller Indian snacks player
        - FY25 revenue ~₹1,720 cr
        - Shows scale gap between Balaji and smaller listed snack peers
        - Lower margin/scale; not a direct premium-brand analogue
      - - PepsiCo India snacks segment
        - Strategic multinational segment reference
        - Lay's/Kurkure national competitor; no stand-alone segment multiple
        - Frames competitive intensity and strategic scarcity
        - Segment data is embedded inside a multinational portfolio
    notes: >-
      Comparable coverage is partial by design; the table combines transaction, listed-company, private-round and segment
      references because no perfect public Balaji analogue exists.
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV041
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Audited revenue miss
        - FY25 audited revenue materially below ~₹6,548 cr
        - Revenue multiple and growth proof weaken immediately
        - Suspend buy; reprice from actual audited base
      - - Margin durability miss
        - Net margin below ~12% or profit far below near-₹1,000 cr estimate
        - Premium-vs-peer argument becomes unsupported
        - Move to track unless price adjusts materially
      - - Overvaluation / failed price discovery
        - New round near ₹40,000 cr without fresh audited proof
        - Replicates the adverse PE-fund concern rather than solving it
        - Avoid or demand downside protection
      - - Governance rights gap
        - No audited accounts, weak board rights, opaque SHA or heavy preference overhang
        - Institutionalisation and IPO readiness become unbankable
        - No close until legal diligence resolves terms
      - - Expansion execution risk
        - National push requires sustained margin-dilutive ad/promotional spend
        - Balaji becomes a good regional operator but not a premium national comp
        - Reduce target multiple and reassess exit window
    notes: >-
      Kill triggers are designed as pre-closing and annual hold-period gates rather than backward-looking commentary.
    claimRefs:
      - CV013
      - CV025
      - CV026
      - CV027
      - CV034
      - CV035
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Diligence Ask
      - Missing Evidence
      - Why It Matters
      - Diligence Path
    rows:
      - - Audited MCA filings and FY25/FY26 management accounts
        - Revenue, PAT, EBITDA, working capital, debt and cash conversion by year
        - Confirms whether ~₹6,548 cr revenue and near-₹1,000 cr profit are real quality earnings
        - Obtain RoC filings, statutory audit pack and management reconciliation
      - - Cap table and shareholder agreement
        - Exact family ownership, GA stake, ESOP, liquidation preference, vetoes and transfer rights
        - Determines dilution, governance and exit economics for a new investor
        - Review SHA, articles, board minutes and closing documents
      - - Plant capacity and utilization
        - Line-level capacity, uptime, capex, bottlenecks and utilization by Rajkot/Valsad/Indore plants
        - Tests whether growth can continue without margin-dilutive capex shock
        - Conduct site visits, capacity model and capex review
      - - Margin bridge and commodity hedging
        - Potato, edible-oil and packaging sensitivity; pricing pass-through; ad-spend trajectory
        - Validates 14–15% net margin durability through input-cost cycles
        - Reconcile gross margin by SKU and supplier contracts
      - - Distribution productivity
        - Outlet productivity, distributor churn, channel margin and non-western repeat purchase
        - Tests whether western dominance can become national growth
        - Analyze distributor cohorts and state-level sell-through data
      - - IPO readiness plan
        - Board composition, CFO/controller bench, audit controls and timeline to draft prospectus
        - Converts GA sponsorship into a realizable 2028–2030 exit path
        - Request IPO roadmap, governance milestones and advisor workplan
    notes: >-
      These asks are the minimum diligence package required before converting a cautious-positive stance into an executed
      buy recommendation.
    claimRefs:
      - CV016
      - CV025
      - CV026
      - CV027
      - CV033
      - CV036
