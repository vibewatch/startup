  - id: s3
    title: Current Financing and Valuation Context
    body: >
      The current price anchor is the January 2026 General Atlantic minority investment: approximately a 7% stake for
      more than ₹2,000–2,500 crore, implying roughly ₹35,000 crore (~$4.2B) equity value and making GA the first external
      institutional shareholder in a family-controlled company. [CV001] [CV002] [CV003] [CV004] Public reporting also
      says multiple strategic and financial suitors circled the company, including ITC, PepsiCo, General Mills, Kedaara,
      TPG and Temasek, which supports strategic scarcity value but also shows that price discovery was contentious.
      [CV014]

      The valuation arithmetic is simple and demanding. Against FY25 revenue of ~₹6,548 crore and profit approaching
      ₹1,000 crore, the GA mark is about ~5.3x revenue and ~35x P/E. [CV005] [CV006] [CV007] This is not obviously
      unsupported when compared with Bikaji's ~6.2x revenue lens and Haldiram's $10B+ private reference, but the evidence
      base is weaker because Balaji is private and exact audited FY25 financials are not public. [CV009] [CV010] [CV025]
      [CV042] Figure FV002 shows how small changes in revenue or revenue multiple shift equity value materially, which
      is why diligence should focus on audited revenue quality, margin durability and preference overhang.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV014
      - CV025
      - CV042
    figureRefs:
      - FV002
  - id: s4
    title: Bull, Base, and Bear Valuation Cases
    body: >
      The bull case assumes Balaji sustains historical 20–25%+ growth for several years, validates 14–15% net margins,
      expands beyond western India without sacrificing value positioning, and enters the public market near or above the
      Bikaji revenue-multiple reference. [CV008] [CV024] [CV030] The base case is more restrained: FY25 growth of ~18%
      fades toward the mid-teens, margins remain strong but not expanding, and the IPO multiple stays near the GA mark
      because public investors already price much of the quality. [CV006] [CV031]

      The bear case is not a collapse scenario; it is multiple compression. If national expansion requires heavier
      advertising, commodity costs squeeze contribution, or governance / IPO readiness lags, a 4.0x revenue lens could
      pull value meaningfully below the ₹35,000 crore mark even while the company remains a good business. [CV032]
      [CV034] [CV036] The downside triggers are therefore operational and evidentiary: growth below ~12%, net margin
      below ~12%, weak audited cash conversion, or missing shareholder protections. [CV039] Table TV003 makes the
      assumptions explicit; Figure FV003 translates them into a range of valuation and return outcomes.
    claimRefs:
      - CV006
      - CV008
      - CV024
      - CV030
      - CV031
      - CV032
      - CV034
      - CV036
      - CV039
    tableRefs:
      - TV003
    figureRefs:
      - FV003
  - id: s5
    title: Comparable Valuation Set
    body: >
      The comparable set is useful but imperfect. Bikaji is the cleanest public comparable because it is listed, Indian
      and snacks-led; public data puts FY25 revenue around ₹2,617–2,622 crore and market capitalization around ₹16,140
      crore, implying roughly ~6.2x FY25 revenue. [CV010] That makes Balaji's ~5.3x revenue GA mark look defensible on a
      revenue-multiple basis, especially if Balaji's net margin and western-India dominance are superior. [CV005]
      [CV018] [CV024]

      Haldiram's, Prataap Snacks and PepsiCo India are less precise but still important. Haldiram's $10B+ private mark is
      a premium-scale reference; Prataap Snacks' ~₹1,720 crore FY25 revenue shows the size of a smaller listed player;
      PepsiCo India is a strategic segment reference rather than a stand-alone Indian snacks valuation comp. [CV009]
      [CV011] [CV012] [CV041] Table TV004 is deliberately labelled partial because private-company marks, segment-only
      data and different product mixes prevent exhaustive comparability. The evidence gap attached to TV004 is therefore
      a gating diligence item, not a cosmetic caveat.
    claimRefs:
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV018
      - CV024
      - CV041
    tableRefs:
      - TV004
  - id: s6
    title: Exit Readiness, Kill Triggers, and Final Diligence Asks
    body: >
      Exit readiness is plausible but unproven. General Atlantic's official announcement and related reporting point to
      professionalisation, governance strengthening, innovation, distribution expansion and an IPO ambition in roughly
      three to four years, which maps to a 2028–2030 exit window. [CV016] [CV033] [CV037] However, a private-company
      diligence file must close the gaps that public reporting cannot: audited MCA accounts, cap table, shareholder
      agreement, plant capacity, distributor economics and margin bridge from accounting profit to cash generation.
      [CV025] [CV026] [CV027] [CV040]

      The thesis should break before price discipline does. If audited FY25 revenue is materially below ~₹6,548 crore,
      profit is materially below the near-₹1,000 crore press estimate, margin durability depends on temporary commodity
      benefits, or IPO governance milestones slip, the recommendation moves from conditional buy to track / research-more.
      [CV006] [CV007] [CV039] A second kill path is strategic: if western concentration remains high while national
      expansion collides with PepsiCo, Haldiram's and ITC budgets, Balaji may still be a strong operator but not worth a
      premium private entry price. [CV034] [CV035] Tables TV005 and TV006 convert these risks into executable IC gates.
    claimRefs:
