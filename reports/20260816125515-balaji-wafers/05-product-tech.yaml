callouts:
  - calloutType: strength
    title: Manufacturing automation is the product moat
    body: >
      Balaji’s most defensible product capability is not a patent or app interface; it is the combination of fully
      automated plants, continuous fryers, high-speed packaging, robotic handling and dense distribution that supports
      fresh value packs at scale.
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE028
  - calloutType: risk
    title: Commodity and regional dependence can transmit directly into product economics
    body: >
      Potatoes, edible oil, storage losses and logistics density are critical dependencies; expansion outside the western
      India stronghold has to reproduce a supply and replenishment system that is currently strongest near home markets.
    claimRefs:
      - CE011
      - CE025
      - CE027
  - calloutType: insight
    title: Do not underwrite an unverified cloud story
    body: >
      Public evidence is strong for manufacturing automation but weak for enterprise cloud, analytics or digital-marketing
      technology. AWS usage remains an explicit evidence gap rather than an operating claim.
    claimRefs:
      - CE024
      - CE037
