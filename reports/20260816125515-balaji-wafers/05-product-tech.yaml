      - TE005
    figureRefs:
      - FE004
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Product module / SKU family
      - Plant or asset dependency
      - Maturity / status
      - Differentiation
      - Diligence gap
    rows:
      - - Potato wafers
        - Local potatoes, cool storage, slicers, temperature-controlled continuous fryers, seasoning and high-speed packing
        - Mature core line
        - Freshness plus value packs in a high-volume chip category
        - Plant-level yield, oil-absorption and wastage data are private
      - - Namkeen (bhujia, sev, gathiya)
        - Dough/extrusion/frying lines, spice blending, packing and warehouse dispatch
        - Mature core line
        - Regional taste fit and high daily savouries capacity
        - Exact SKU contribution and batch-level quality metrics are not public
      - - Extruded snacks
        - Extrusion assets, seasoning drums and automated packaging
        - Mature / scaling
        - Broader youth-snacking occasions beyond classic wafers
        - Public sources do not split volumes by extruded family
      - - Baked / health-oriented variants
        - Baking or lower-oil process capability plus R&D flavour work
        - Emerging portfolio extension
        - Addresses health and better-for-you snack trends
        - Release cadence and repeat-purchase evidence are undisclosed
      - - Peas, peanuts and other savouries
        - Ingredient procurement, roasting/frying, seasoning and pouch packing
        - Mature adjacent line
        - Extends shelf presence and impulse purchase range
        - Allergen controls and SKU-level margins need private diligence
    notes: >-
      Asset mappings combine official product/process pages, technical-visit reporting and secondary descriptions; plant-by-SKU allocation is not publicly disclosed.
    claimRefs:
      - CE001
      - CE003
      - CE010
      - CE021
      - CE033
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job / workflow
      - Current operating step
      - Balaji solution
      - Measurable benefit / proxy
      - Limitation or risk
    rows:
      - - Consumer impulse snack
        - Choose affordable salty snack from kirana or modern retail shelf
        - Low-ticket Balaji wafers/namkeen with value-pack positioning
        - High repeat suitability through “More Chips, Less Air” value cue
        - Public data does not show household repeat or cohort metrics
      - - Retailer shelf replenishment
        - Maintain fast-moving packets with low stockouts
        - Dense distributor network and rapid dispatch from regional plants
        - 4.5 lakh+ outlet reach through roughly 1,225–1,300+ distributors
        - Outlet and distributor counts are secondary-source estimates
      - - Fresh wafer production
        - Procure potatoes, store cool, slice, fry, season and pack
        - Local potato sourcing plus temperature-controlled fryer workflow
        - Freshness and lower transit time in core western markets
        - Crop quality, storage losses and oil prices can pressure consistency
      - - Bulk savouries production
        - Convert gram/flour/spice inputs into namkeen and extruded snacks
        - Automated lines for 500,000 kg/day other savouries capacity
        - High throughput supports value pricing and shelf density
        - Public sources do not disclose utilization by product family
      - - National expansion workflow
        - Replicate regional availability and service levels outside west India
        - Capacity expansion, distribution broadening and product innovation
        - Potential to carry regional manufacturing economics into new states
        - Home-market concentration makes replication risk material
    notes: >-
      Benefits are operating proxies inferred from reported assets and distribution scale; private sell-through, service-level and repeat-purchase data are not public.
    claimRefs:
      - CE002
      - CE004
      - CE011
      - CE013
      - CE025
      - CE027
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process component
      - Role in architecture
      - Evidence status
      - Key dependency
      - Risk / diligence ask
    rows:
      - - Raw-material intake and cool storage
        - Preserves potatoes and inputs before production
        - Publicly reported / technically described
        - Local sourcing, storage discipline and crop quality
        - Confirm storage capacity, losses and supplier concentration
      - - Temperature-controlled continuous fryers
        - Core wafer cooking control and throughput engine
        - Technical-source reported
        - Oil quality, temperature control and line uptime
        - Obtain maintenance, energy and quality-control records
      - - Automated seasoning and process handling
        - Converts base products into flavour variants at scale
        - Inferred from automated line descriptions
        - Recipe control, spice supply and sanitation
        - Validate batch changeover times and consistency metrics
      - - Automated packaging (~1,800 packets/minute)
        - Converts bulk output into retail-ready value packs
        - Technical-source reported
        - Film supply, seal integrity and line synchronization
        - Confirm actual sustained rate by pack size and downtime
      - - Robotic palletization and vertical/automated warehouses
        - Moves packed goods into dispatch-ready storage
        - Technical-source reported
        - Pallet flow, warehouse systems and dispatch planning
        - Verify warehouse automation scope and inventory accuracy
      - - Enterprise / cloud business systems
        - Potential planning, finance, inventory or analytics layer
        - Evidence gap; AWS usage unverified
        - ERP/WMS/TMS implementation quality if present
        - Do not underwrite cloud capability without architecture proof
    notes: >-
      The table intentionally separates verified manufacturing automation from unverified enterprise-cloud claims; AWS/cloud business-ops usage is not asserted.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE012
      - CE024
      - CE037
  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / compliance area
      - Public status
      - Scope
      - Why it matters
      - Gap / diligence path
    rows:
      - - FSSAI compliance
        - Publicly indicated as part of food-safety operating context
        - Indian packaged-food manufacturing and sale
        - Required baseline for legal operation and consumer trust
        - Collect licenses, renewals, inspections and notices by plant
      - - Food-safety / QA leadership
        - Hiring signal for quality and food-safety leadership in Rajkot
        - Plant and quality organization
        - Shows practitioner capability need and accountability layer
        - Interview quality leaders and review org chart / KPIs
      - - Temperature and oil controls
        - Supported by fryer and food-processing evidence
        - Wafer and fried-savouries lines
        - Drives safety, taste consistency and shelf stability
        - Review oil turnover, TPM, lab testing and deviation logs
      - - Packaging integrity
        - Automated high-speed packaging described
        - Retail pouches and value packs
        - Seal integrity protects freshness and reduces contamination risk
        - Request seal-failure, complaint and returns data by SKU
      - - Formal certifications and audits
        - Not publicly disclosed in enough detail
        - HACCP/ISO/BRC-style systems if present
        - External audit proof reduces food-safety uncertainty
        - Obtain certificates, audit reports and corrective-action logs
    notes: >-
      Public evidence supports a food-safety and QA operating layer, but formal audit certificates and plant-level quality metrics remain private-evidence diligence items.
    claimRefs:
      - CE015
      - CE016
      - CE017
      - CE018
      - CE036
  - id: TE005
    title: Roadmap / release / development-stage table
    columns:
      - Date / stage
      - Feature / milestone
      - Status
      - Product / operations implication
      - Source basis / caveat
    rows:
      - - Current core
        - 65+ SKUs across wafers, namkeen, extruded, baked, peas and peanuts
        - In market
        - Broad shelf range supports retailer relationships and consumer choice
        - Official and secondary sources; SKU-level sales mix private
      - - Current operations
        - Four fully automated plants with high daily output
        - In market
        - Scale enables low-unit-cost value-pack model
        - Plant utilization and uptime not public
      - - 2026 onward
        - Distribution and innovation acceleration after General Atlantic investment
        - Announced direction
        - External investor can support national expansion and product development
        - No public detailed release calendar
      - - Near-term R&D theme
        - New flavours, health-oriented and baked variants
        - Directional / inferred from category trends
        - Expands use cases beyond core fried snacks
        - Repeat-rate and gross-margin proof needed
      - - Capacity / automation roadmap
        - Capacity expansion and deeper automation for national growth
        - Directional
        - Replicates western-India manufacturing advantage in new regions
        - Capex plan, site list and commissioning dates are undisclosed
    notes: >-
      Roadmap rows separate announced strategic direction from inferred category-driven R&D themes; no dated public product-release calendar was available.
