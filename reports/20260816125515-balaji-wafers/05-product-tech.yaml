  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Plant-level capacity, yield and uptime
      missingEvidence: >-
        Public sources cite four automated plants and headline daily output, but do not disclose SKU-by-plant capacity,
        utilization, uptime, yield loss, maintenance downtime, oil use or energy intensity.
      whyItMatters: >-
        Product differentiation and valuation depend on whether automation translates into durable low unit cost, reliable
        quality and capacity headroom for national expansion.
      diligencePath: >-
        Request plant-level capacity, OEE, downtime, yield, scrap, oil-turnover, energy and maintenance records by line and
        SKU family.
      relatedQuestionRefs:
        - QE003
        - QE004
        - QE023
        - QE026
      relatedTableRefs:
        - TE001
        - TE003
    - type: private-evidence-only
      severity: material
      topic: Food-safety audit evidence and QA metrics
      missingEvidence: >-
        The public record does not provide plant-by-plant FSSAI licenses, third-party audit certificates, recall history,
        microbiological test results, batch-rejection rates or corrective-action logs.
      whyItMatters: >-
        Food safety is the core trust layer for a mass packaged-snacks manufacturer; hidden control weakness could create
        regulatory, brand and recall risk.
      diligencePath: >-
        Obtain licenses, audit reports, lab testing dashboards, consumer-complaint logs, recall/withdrawal history and QA
        organization charts during diligence.
      relatedQuestionRefs:
        - QE011
