- id: s3
  title: 'Pricing and packaging: value packs meet low switching costs'
  body: 'Balaji''s pricing advantage is best understood as price-pack architecture and perceived fill, not as a published
    national price card. The company sells a simple value message — more chips, less air — and couples it with low advertising
    intensity reported around 4% of revenue, below the broader industry range of roughly 8–12%. [CP015] [CP016] That supports
    shelf velocity and gross value perception in western India. The weakness is that salty snacks are low-ticket, frequent
    and easy to multi-home: a household can buy Balaji, Lay''s, Kurkure, Haldiram''s, Bingo, Bikaji, Yellow Diamond and loose
    namkeen in the same month, and a kirana can stock several. [CP018] [CP019] Consequently, Balaji''s durable edge is not
    lock-in; it is distributor economics, price-value trust and repeat shelf pull. [CP020] [CP029]'
  claimRefs:
  - CP015
  - CP016
  - CP018
  - CP019
  - CP020
  - CP029
  tableRefs:
  - TP003
- id: s4
  title: Moat durability and adverse competitor evidence
  body: 'The strongest moat evidence is Balaji''s regional dominance: reported Gujarat potato-chip share of roughly 65–90%,
    about 65% western-India organized-snacks share, and 4.5 lakh outlets through roughly 1,225–1,300 distributors. [CP013]
    [CP014] That density is hard to copy quickly and is reinforced by plants, value packs and cost discipline. However, the
    adverse evidence is meaningful. PepsiCo, Haldiram''s and ITC have deeper national brand budgets and broader channels,
    and ITC, PepsiCo, TPG and Temasek reportedly appeared in Balaji''s stake race, showing that powerful strategic players
    are paying attention. [CP017] [CP022] [CP023] [CP024] [CP035] General Atlantic backing improves Balaji''s professionalization
    and expansion capacity, but it also puts Balaji into more direct contact with better-funded incumbents as it pushes beyond
    western India. [CP021] [CP039] [CP043]'
  claimRefs:
  - CP013
  - CP014
  - CP017
  - CP022
  - CP023
  - CP024
  - CP035
  - CP021
  - CP039
  - CP043
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: s5
  title: 'Diligence verdict: regional moat, national execution risk'
  body: The competitive verdict is favorable but bounded. Balaji is already larger than listed snack peers such as Bikaji
    and Prataap by revenue and has a credible path to national scale after the General Atlantic investment. [CP011] [CP021]
    [CP025] [CP026] The moat is most durable where its western-India distribution density, pack value and cost culture reinforce
    each other; it is least durable where the product is a commoditized potato-chip or extruded-snack occasion that PepsiCo,
    ITC, regional labels and loose namkeen can attack. [CP020] [CP033] [CP034] [CP036] The diligence priority is to verify
    private channel data — distributor margins, retailer fill rates, shelf velocities and per-gram pricing by geography —
    because public sources are strong enough to establish the landscape but not enough to prove national replicability. [CP037]
    [CP038] [CP040]
