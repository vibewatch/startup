  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Competitor-by-city pricing and packaging
    missingEvidence: Public sources do not provide a complete per-gram realized price, pack-fill, retailer discount and promotion
      dataset for Balaji, PepsiCo, Haldiram's, ITC, Bikaji and Prataap across major cities.
    whyItMatters: Balaji's value thesis depends on price-pack advantage; without field pricing and trade terms, the pricing
      table remains an evidence-backed comparison rather than a fully measured margin proof.
    diligencePath: Run city-level store audits across Gujarat, Maharashtra, Delhi-NCR, Rajasthan and MP; collect pack weights,
      MRPs, discounts, shelf facings and retailer margins.
    relatedQuestionRefs:
    - QP010
    - QP021
    - QP022
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: Distribution quality outside western India
    missingEvidence: The public record gives Balaji's outlet and distributor scale, but not state-wise outlet productivity,
      fill rates, stock-out frequency, distributor economics or competitor overlap outside core regions.
    whyItMatters: Balaji's moat is strongest in regional distribution density; underwriting national expansion requires proof
      that the same shelf velocity and economics transfer to incumbent-heavy markets.
    diligencePath: Request state-wise distributor dashboards, retailer cohort data and channel P&L, then benchmark against
      PepsiCo, Haldiram's and ITC outlet overlap.
    relatedQuestionRefs:
    - QP011
    - QP019
    - QP025
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: Competitor share estimates
    missingEvidence: Market-share references for PepsiCo, Haldiram's, ITC and Balaji are assembled from secondary reporting
      and category reports rather than one common audited panel with uniform definitions.
    whyItMatters: Different definitions of western snacks, ethnic snacks, potato chips and organized snacks can make shares
      look more comparable than they really are.
    diligencePath: Acquire NielsenIQ/Kantar or equivalent retail-audit data with consistent geography, channel and category
      definitions for the last twelve months.
    relatedQuestionRefs:
    - QP002
    - QP003
    - QP004
    - QP023
    relatedTableRefs:
    - TP001
    - TP002
  - type: missing-source
    severity: minor
    topic: Regional player enumeration
    missingEvidence: Regional competitors such as GCB and unorganized namkeen makers are strategically important but lack
      sufficiently reliable public revenue, SKU and share disclosures for a complete ranked list.
    whyItMatters: Local substitutes constrain Balaji's price umbrella and shelf expansion even when they are too fragmented
      for traditional public-company comparison.
    diligencePath: Conduct distributor interviews and local retail audits in Gujarat, Maharashtra, Rajasthan and MP to rank
      regional labels by shelf share and sell-through.
    relatedQuestionRefs:
    - QP007
    - QP016
    relatedTableRefs:
    - TP001
