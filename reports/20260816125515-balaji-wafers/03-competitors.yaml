  rows:
  - - PepsiCo (Lay's, Kurkure)
    - National western-snacks incumbent
    - ~22% western-snacks share
    - Urban and national branded-snack buyers
    - Brand salience, advertising, modern-trade strength
    - Less local value-density in Balaji's Gujarat/western core
  - - Haldiram's
    - National ethnic-snacks incumbent
    - ~36% ethnic-snacks share; $10B+ valuation
    - Families, gifting, ethnic snacks and sweets occasions
    - Trust, ethnic breadth, national recognition
    - Less focused on Balaji-style low-price wafer value packs
  - - ITC Bingo
    - National FMCG-backed western challenger
    - ~13% western-snacks share
    - Urban youth and national packaged-snack buyers
    - ITC channel power and branded western formats
    - Trails PepsiCo and lacks Balaji's western-India local density
  - - Bikaji Foods
    - Listed ethnic-snacks challenger
    - FY24 revenue ₹2,482 cr; FY25 ~₹2,617–2,622 cr; m-cap ~₹16,140 cr
    - Ethnic snacks, Rajasthan-origin nationalizing brand
    - Listed transparency and ethnic portfolio
    - Smaller than Balaji by revenue; ~9% ethnic share
  - - Prataap Snacks / Yellow Diamond
    - Listed western/namkeen challenger
    - FY25 revenue ~₹1,720 cr
    - Mass packaged snack consumers
    - Yellow Diamond brand and listed platform
    - Considerably smaller scale than Balaji
  - - Regional players (GCB and local namkeen)
    - Regional branded / unorganized substitutes
    - Fragmented; public scale limited
    - Price-sensitive kirana customers
    - Local freshness, low price, retailer relationships
    - Limited national brand and public proof
  - - Loose namkeen / household snacks
    - Status quo substitute
    - Unorganized and untracked
    - Everyday value buyers
    - Lowest perceived price and familiarity
    - No consistent packaged-brand trust or hygiene proof
  - - Balaji Wafers
    - Regional champion scaling nationally
    - FY25 revenue ~₹6,548 cr; GA deal values at ~₹35,000 cr
    - Mass value snack consumers, western India core
    - Value packs, 4.5 lakh outlets, low ad spend
    - Weaker national brand versus PepsiCo/Haldiram's
  notes: Shares and revenue figures are best-available public estimates; regional and unorganized substitutes are included
    because they affect price-sensitive shelf choice despite incomplete public data.
