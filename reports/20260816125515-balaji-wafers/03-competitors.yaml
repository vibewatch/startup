- id: s2
  title: 'Capability comparison: product breadth, channel density and trust'
  body: 'The capability matrix shows differentiated strengths by player. PepsiCo brings national brand salience, urban trade
    muscle and western-snack product breadth; Haldiram''s brings ethnic-snack trust and wider occasion coverage that includes
    sweets and restaurant-linked brand equity. Balaji''s strength is narrower but powerful: 65+ SKUs, strong potato wafers
    and namkeen relevance, western-India shelf density, and a value-for-money promise expressed as "Zyada Chips, Kam Hawa."
    [CP012] [CP015] [CP027] [CP028] Bikaji and Prataap are credible public-market comparables, but they are smaller by revenue
    and lean more toward ethnic snacks or Yellow Diamond-branded western formats. [CP005] [CP006] [CP008] [CP025] [CP026]
    The public evidence supports high-level comparison, but not fully audited SKU-level pricing, retail margins or every channel
    capability by city. [CP029] [CP030] [CP042]'
  claimRefs:
  - CP012
  - CP015
  - CP027
  - CP028
