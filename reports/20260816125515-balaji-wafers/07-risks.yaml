  - type: enumeration-incomplete
    severity: material
    topic: Regulatory and legal completeness for TR001
    missingEvidence: The public source pack does not enumerate all FSSAI licenses, plant inspections, legal cases,
      IP proceedings, recall events or shareholder-agreement terms.
    whyItMatters: The regulatory / legal risk register is intentionally partial; any hidden notice, recall, covenant
      or case could materially change downside risk.
    diligencePath: Request plant-wise licenses, audit reports, recall logs, legal schedules, IP filings and the
      General Atlantic shareholder agreement; cross-check with regulator and court databases.
    relatedQuestionRefs:
