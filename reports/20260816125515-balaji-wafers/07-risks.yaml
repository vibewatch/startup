    topic: Food-safety organization and quality staffing
    missingEvidence: The retained source pack includes a quality / food-safety leader role, but not a full org chart,
      certifications, incident history or third-party audit outcomes.
    whyItMatters: A quality role indicates mitigation activity, but investors need evidence that controls are embedded
      across all plants and SKUs.
    diligencePath: Request QA org chart, role vacancies, certifications, training records, external audit scores,
      complaints and mock-recall results.
