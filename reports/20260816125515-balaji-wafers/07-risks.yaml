- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Food-safety / FSSAI
    - Recall, regulator notice or plant stoppage
    - Any material recall, closure order or unresolved FSSAI non-compliance
    - Thesis break until root cause, remediation and brand recovery are independently verified
  - - Valuation / margin
    - Reported EBITDA or net margin deterioration
    - Sustained EBITDA margin below ~12% or net margin below ~10% without credible recovery
    - Reprice entry; do not underwrite ~35x P/E until margins normalize
  - - National expansion
    - Non-western expansion cohort economics
    - Failed state cohorts after 12–18 months of GA-funded spend, or continuing >80% western revenue by IPO-prep
      window
    - Cut growth assumptions and require slower, ROI-gated rollout
  - - Commodity exposure
    - Potato, edible-oil or packaging shocks
    - Two consecutive reporting periods of input inflation not offset by price/mix/productivity
    - Stress gross margin and working-capital assumptions; require procurement hedge evidence
  - - Competition / ad spend
    - Advertising and trade-spend escalation
    - Ad spend moves toward 8–12% industry range without volume or share response
    - Lower margin forecast and test whether value positioning still wins outside core states
  - - Governance / succession
    - Family, GA or management alignment
    - C-suite hiring stalls, GA rights dispute emerges, or IPO timetable slips past 2030 due governance
    - Escalate to IC blocker; require governance reset or lower valuation
  - - Distributor dependency
    - Channel health and receivables
    - Retail fill rates fall, distributor churn rises, or receivables stretch materially in new states
    - Slow rollout, review credit policy and revisit channel concentration risk
  - - Disclosure quality
    - Audit and diligence pack completeness
    - Audited FY25/FY26 numbers materially miss reported revenue/profit or legal schedules reveal material undisclosed
      cases
    - Re-underwrite entire valuation; possible no-go if trust gap is not remediable
  notes: Thresholds are diligence triggers, not reported company guidance; they convert the public risk assessment
    into monitorable investment discipline.
