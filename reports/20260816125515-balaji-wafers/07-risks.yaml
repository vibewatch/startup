    - TR001
  - type: private-evidence-only
    severity: material
    topic: Audited financials, margin bridge and working capital
    missingEvidence: FY25 revenue, profit, EBITDA margin, debt and working-capital details are not available as
      full public audited statements in the retained sources.
    whyItMatters: The ~₹35,000 crore valuation and kill criteria depend on true margin quality, cash conversion
      and any hidden debt or receivable stress.
    diligencePath: Obtain audited FY24-FY26 accounts, monthly MIS, gross-margin bridge, inventory aging, receivables
      and distributor credit data.
    relatedQuestionRefs:
    - QR003
    - QR018
    - QR019
    - QR031
    relatedTableRefs:
    - TR005
  - type: no-public-source
    severity: material
    topic: Distributor concentration and regional cohort performance
    missingEvidence: The source pack does not name top distributors, state-wise revenue, channel concentration,
      fill rates, returns, churn or non-western expansion cohort economics.
    whyItMatters: A large share of revenue is still tied to western India, so the investment case needs proof that
      the distribution model travels profitably.
    diligencePath: Review distributor master, top-20 concentration, state-wise sales, cohort contribution margin,
      trade spend, returns and receivable aging.
    relatedQuestionRefs:
    - QR014
    - QR017
    - QR023
    relatedTableRefs:
