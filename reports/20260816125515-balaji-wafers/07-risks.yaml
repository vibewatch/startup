- id: s4
  title: Partner, dependency and market-transmission risk
  body: 'Balaji’s partner and dependency profile is a mix of strength and fragility. The company reaches about 4.5
    lakh+ retail outlets through roughly 1,225–1,300+ distributors; that depth is the route-to-market moat, but
    distributor credit, incentives, service levels and fill rates become critical dependencies in a national expansion.
    [CR021] [CR022] Western India concentration is the largest measurable channel dependency: approximately 80–90%
    of revenue is still tied to the region, even though the broader India snacks market is large and growing. [CR015]
    [CR029] [CR030] If the company cannot convert its western-India playbook into repeatable non-western cohorts,
    the “regional champion to national platform” thesis weakens. [CR016] [CR023]


    External counterparties also transmit risk. Suppliers of potatoes, edible oils and packaging influence margin;
    FSSAI and GST regulators influence market access and tax economics; General Atlantic influences governance discipline
    but cannot control the family-run company; and PepsiCo, Haldiram’s, ITC, Bikaji and other rivals can raise the
    spending bar. [CR013] [CR037] [CR028] [CR011] The dependency map keeps these nodes explicit so diligence can
    test not only whether Balaji has scale, but whether each critical dependency has redundancy, contractual protection
    or an owner. [CR040]'
  claimRefs:
  - CR021
  - CR022
  - CR015
  - CR029
  - CR030
