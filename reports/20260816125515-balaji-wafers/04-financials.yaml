callouts:
  - calloutType: strength
    title: Profitable scale before institutional capital
    body: >
      Balaji reached ~₹6,548 crore estimated FY25 revenue and near-₹1,000 crore net profit after decades of self-funded
      expansion, making capital adequacy a question of growth investment and disclosure rather than survival runway.
    claimRefs:
      - CI006
      - CI024
      - CI039
  - calloutType: risk
    title: Margin proof is still private
    body: >
      Reported ~13–15% EBITDA margin and ~14–15% net margin are attractive, but SKU gross margin, commodity pass-through,
      trade schemes, working capital and debt covenants are not visible in public evidence.
    claimRefs:
      - CI008
      - CI019
      - CI021
      - CI039
  - calloutType: insight
    title: The valuation prices execution, not optionality
    body: >
      The ~₹35,000 crore GA valuation implies roughly ~5.3x FY25 revenue and ~35x earnings, so the financial case requires
      audited confirmation that growth, low ad spend and margin durability survive expansion beyond the western core.
    claimRefs:
      - CI023
      - CI029
      - CI030
