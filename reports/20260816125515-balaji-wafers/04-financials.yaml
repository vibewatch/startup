tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit / Driver
      - Current Value / Status
      - Quality and Recognition Issue
      - Diligence Ask
    rows:
      - - Potato wafers
        - Manufactured Balaji-branded chips sold via distributors and retailers
        - Pack volume, outlet velocity, potato throughput
        - Part of 65+ SKU portfolio; exact revenue mix not public
        - High repeat-consumption quality; returns/trade schemes unknown
        - Segment revenue, SKU velocity, return rates and distributor sell-through
      - - Namkeen and Indian savouries
        - Bhujia, sev, gathiya and related savouries sold through the same channel
        - Pack volume, regional taste preference, daily savouries output
        - Public sources cite ~500,000 kg daily other savouries capacity
        - Likely resilient staple-snack demand; category mix undisclosed
        - Product-line gross margin and regional mix by state
      - - Extruded / western snacks
        - Western snack formats and extruded products under Balaji brand
        - Pack price, youth/impulse demand, modern trade penetration
        - Included in product portfolio; no line-item sales disclosed
        - Supports portfolio breadth; may need higher promotion outside core markets
        - SKU-level contribution and promotional spend by format
      - - Other packaged snacks
        - Peas, peanuts, baked and adjacent snack lines
        - Incremental shelf space and retailer basket expansion
        - Publicly visible on official product surfaces; revenue contribution unknown
        - Useful adjacency revenue but harder to underwrite without mix
        - Confirm product P&L and cannibalization across SKUs
      - - Institutional / export / e-commerce channels
        - Potential non-kirana channels for packaged goods distribution
        - Channel revenue, realized price, trade margin
        - Not separately disclosed in retained public sources
        - Cannot assess channel profitability from public evidence
        - Channel split, e-commerce take-rate, export receivables and credit terms
    notes: >-
      Public sources support product categories and headline company revenue, but not product-line revenue mix or revenue
      recognition policies; table separates confirmed streams from undisclosed private metrics.
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI014
      - CI037
      - CI038
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / Monetization Element
      - Public Evidence
      - Realized Pricing Caveat
      - Margin Implication
      - Diligence Ask
    rows:
      - - Low-price value packs
        - Brand positioning emphasizes "Zyada Chips, Kam Hawa" and value-for-money packs
        - List pack prices and grammage by SKU are not consolidated publicly
        - Supports volume, but per-pack rupee margin is thin
        - Obtain SKU price ladder, grammage history and price increases
      - - Distributor wholesale model
        - 1,225–1,300+ distributors feed 4.5 lakh+ outlets
        - Distributor margins, credit and trade schemes are private
        - Channel scale lowers customer-acquisition burden
        - Request distributor margin schedule and receivable ageing
      - - Promotional / trade spend
        - Public sources emphasize low advertising rather than heavy promotions
        - Trade discounts and retailer schemes are not disclosed
        - Hidden discounts could reduce net realization
        - Reconcile gross sales to net revenue and scheme accruals
      - - Regional price power
        - Strong Gujarat / western India share signals local pricing resilience
        - National expansion price power is unproven
        - Core markets likely fund expansion; new markets may need discounts
        - State-level ASP, margin and share trend by channel
      - - GST and indirect taxes
        - Packaged namkeen category faced GST-rate changes in 2024 market reporting
        - Pass-through versus margin capture is not disclosed
        - Tax-rate changes can affect price points and consumer value perception
        - Confirm GST classification, pass-through policy and pack resizing
    notes: >-
      Pricing is inferred from public value positioning, distribution scale and category reporting; realized net pricing,
      discounts and tax accounting require management accounts.
    claimRefs:
      - CI002
      - CI009
      - CI011
      - CI012
      - CI020
      - CI035
      - CI037
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public Value / Proxy
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - FY25 revenue scale
        - ~₹6,548 crore (~$785M), ~18% YoY
        - Medium
        - Establishes denominator for margins and valuation
        - Audited FY25 revenue and bridge from FY24
      - - FY25 net profit
        - Approaching ₹1,000 crore (~$120M)
        - Low-Medium
        - Indicates strong rupee contribution despite value pricing
        - Audited PAT, tax, exceptional items and related-party adjustments
      - - EBITDA margin
        - ~13–15%
        - Medium
        - Tests operating leverage before depreciation and financing
        - Gross margin, EBITDA reconciliation and plant-level overheads
      - - Net margin
        - ~14–15%
        - Medium
        - Shows bottom-line quality reported by press estimates
        - PAT bridge, depreciation, finance cost and tax notes
      - - Advertising intensity
        - ~4% of revenue versus 8–12% industry
        - Medium
        - A key margin lever and CAC-like efficiency proxy
        - Media, trade promotion and state-level launch spend split
      - - Daily throughput
        - ~100,000 kg wafers + ~500,000 kg savouries
        - Low-Medium
        - Volume spreads fixed plant cost across many packs
        - Actual utilization, wastage, yield and downtime by plant
      - - Commodity exposure
        - Potatoes, edible oil, packaging and freight are material inputs
        - Medium
        - Raw-material inflation can pressure gross margin
        - Supplier contracts, inventory days, hedging and pass-through cadence
    notes: >-
      Unit economics are mostly public proxies rather than SKU-level contribution margins; exact gross margin, channel
      margin, freight and working-capital metrics are unavailable publicly.
    claimRefs:
      - CI003
      - CI005
      - CI006
      - CI008
      - CI009
      - CI015
      - CI017
      - CI018
      - CI019
  - id: TI004
    title: Capital adequacy table
    columns:
      - Capital Adequacy Item
      - Public Value / Status
      - Underwriting Read
      - Next Trigger
      - Diligence Ask
    rows:
      - - Cash on hand
        - Not publicly disclosed
        - Profitability and GA proceeds imply flexibility, but cash cannot be verified
        - IPO-readiness investments and expansion capex
        - Latest cash balance, bank lines and restricted cash
      - - Monthly burn
        - Not a disclosed startup-burn metric; company is profitable
        - Survival runway is not the main issue; free cash flow after capex is
        - National expansion and professionalisation spend
        - Monthly cash flow, capex outflow and working-capital absorption
      - - Runway months
        - Not meaningful from public data because burn and cash are undisclosed
        - Treat as profitable operating runway, subject to capex plan
        - If margin compresses or capex accelerates
        - 24-month cash forecast under commodity and expansion scenarios
      - - Planned use of funds
        - Professionalise operations, accelerate innovation/distribution, prepare for IPO
        - Strategic growth capital rather than rescue funding
        - IPO targeted 2028–2030
        - Board-approved use-of-proceeds and hiring/capex budget
      - - Debt / project finance
        - Described as modest but exact obligations are not public
        - Leverage risk appears secondary, but covenants are unknown
        - New automated plant or distribution build-out
        - Debt schedule, covenants, security package and lender concentration
      - - Next-round trigger
        - No near-term private round disclosed after GA; IPO ambition in 3–4 years
        - Financing dependency is governance/market-window driven
        - Public listing readiness and audited financial track record
        - IPO prep timeline, auditor quality and minimum public-float plan
    notes: >-
      Capital adequacy relies on press-reported GA transaction terms and profitability because cash, burn, debt and capex
      schedules are not public; management diligence must replace these proxies.
    claimRefs:
      - CI016
      - CI023
      - CI024
      - CI026
      - CI027
      - CI028
      - CI039
  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing Metric / Evidence
      - Public Proxy Available
      - Impact on Underwriting
      - Exact Diligence Path
    rows:
      - - Audited MCA financial statements
        - EMIS profile and press-reported FY24/FY25 figures
        - Cannot fully verify revenue, PAT, debt, cash or related-party items
        - Obtain RoC/MCA filings, audited financials and auditor notes
      - - Product-line revenue mix
        - Product categories and 65+ SKUs are public
        - Mix drives gross margin and resilience but is unknown
        - Request revenue and gross margin by product family and region
      - - Gross margin and commodity bridge
        - EBITDA/net margin range and peer raw-material pressure
        - Cannot separate pricing power from input-cost cycle
        - Review COGS bridge for potatoes, oil, packaging, power and freight
      - - Working-capital cycle
        - Distributor network and retail reach are public
        - Receivables, inventory days and trade payables could absorb cash
        - Request ageing, inventory turns, trade schemes and distributor credit policy
      - - Debt, capex and cash-flow schedule
        - Bootstrapped history, automated plants and modest debt are reported
        - Free cash flow and covenant risk remain unknown
        - Obtain debt schedule, capex plan, bank facilities and 24-month cash forecast
    notes: >-
      These are not cosmetic gaps: each missing private metric directly affects valuation support, margin durability or
      capital adequacy for a private company preparing for institutional governance and a potential IPO.
    claimRefs:
      - CI015
      - CI016
      - CI021
      - CI022
      - CI028
      - CI038
      - CI039
