  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Audited financial statements and MCA filings
      missingEvidence: >-
        Retained public sources include an EMIS company profile and press-reported FY24/FY25 figures, but not complete
        audited MCA filings, notes, debt schedules, cash balances or related-party disclosures.
      whyItMatters: >-
        The January 2026 valuation depends on revenue, PAT, margin and balance-sheet quality; without filings, investors
        cannot independently verify the financial base.
      diligencePath: Obtain MCA/RoC filings, audited financial statements, auditor notes and management accounts for FY23–FY26.
      relatedQuestionRefs:
        - QI004
        - QI014
        - QI019
      relatedTableRefs:
        - TI005
    - type: private-evidence-only
      severity: material
      topic: Product-line revenue mix and realized pricing
      missingEvidence: >-
        Public evidence identifies product families and value positioning but does not disclose revenue mix, SKU ASPs,
        grammage changes, trade discounts, returns or channel realization.
      whyItMatters: >-
        Mix and realized pricing determine whether reported growth is volume-led, price-led, channel-led or discount-led.
      diligencePath: Request SKU-level net sales, gross-to-net bridge, trade scheme accruals and channel margin schedule.
      relatedQuestionRefs:
        - QI001
        - QI002
        - QI024
      relatedTableRefs:
        - TI001
        - TI002
    - type: private-evidence-only
      severity: material
      topic: Unit economics and margin bridge
      missingEvidence: >-
        Public sources provide EBITDA and net margin ranges but not gross margin, plant utilization, wastage, freight,
        commodity pass-through, distributor margin or SKU contribution.
      whyItMatters: >-
        Margin sustainability is the core financial risk because value pricing and national expansion could require higher
        trade and advertising spend.
      diligencePath: Build a gross-margin and contribution bridge by SKU, plant and state, including potatoes, oil, packaging, power and freight.
      relatedQuestionRefs:
        - QI006
        - QI007
        - QI012
        - QI013
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: Capital adequacy, debt and capex schedule
      missingEvidence: >-
        Cash on hand, monthly free cash flow, working-capital needs, debt maturities, covenants and capex commitments are
        not disclosed in public sources.
      whyItMatters: >-
        A profitable company can still consume cash through inventory, distributor credit and plant expansion, affecting
        IPO readiness and financing dependency.
      diligencePath: Obtain 24-month cash forecast, debt schedule, bank sanction letters, capex budget and working-capital ageing.
      relatedQuestionRefs:
        - QI015
        - QI017
        - QI018
        - QI019
      relatedTableRefs:
        - TI004
        - TI005
    - type: conflicting-data
      severity: minor
      topic: FY25 estimate precision and valuation sensitivity
      missingEvidence: >-
        FY25 revenue, net profit and margin figures are press estimates with rounded values rather than audited disclosures;
        valuation multiples move materially if profit is below the near-₹1,000 crore headline.
      whyItMatters: >-
        The ~₹35,000 crore valuation prices strong profitability, so even modest downward revisions can make the multiple
        look more aggressive.
      diligencePath: Reconcile press estimates to audited FY25 accounts and run sensitivity at lower PAT, higher ad spend and commodity inflation.
      relatedQuestionRefs:
        - QI005
        - QI020
        - QI021
        - QI025
      relatedTableRefs:
        - TI005
