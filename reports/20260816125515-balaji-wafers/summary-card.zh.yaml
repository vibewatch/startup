  topStrengths:
    - 五十年靠自有现金盈利复利，做到 FY25 收入约 ₹6,548 crore、净利润接近 ₹1,000 crore；直到 2026 年前都没有引入外部资本。
    - 区域品牌势能强，在 Gujarat 薯片市场份额约 65–90%；护城河来自高性价比定价、深入 kirana 小店的分销网络（4.5 lakh+ 网点）和克制的低广告开支文化。
    - 四座工厂自动化程度高、制造成本低，支撑了强利润率，也让产能扩张可以靠内部现金自我供血。
    - General Atlantic 给出首次机构背书，并在竞争中压过 ITC、PepsiCo、General Mills、Kedaara、TPG 和 Temasek；2028–2030 年 IPO 路径也更可信。
  topRisks:
    - 入场价格偏紧（约 5.3x FY25 收入、约 35x P/E）；此前 PE 基金曾对 ₹40,000 crore 要价却步，执行容错空间有限。
    - 地域集中度高，约 80–90% 收入来自印度西部；全国扩张则要进入 PepsiCo 和 Haldiram's 主导的市场。
    - 土豆和食用油价格会直接影响成本；FSSAI 食品安全和召回风险也可能压缩利润率、伤害品牌。
    - 公司正从家族经营、重度依赖 Chandubhai Virani 的结构，转向机构化、IPO 就绪管理；治理和接班风险需要盯紧。
  unresolvedGaps:
    - 公开渠道尚无经审计的 MCA 文件；FY25 收入和利润仍是媒体估计，不是已提交数据。
    - 具体股权结构、家族持股拆分和 General Atlantic 股东协议条款尚未披露。
    - 分品类收入结构、毛利率结构和单厂产能利用率没有得到公开确认。
    - 西印度以外全国扩张的经济模型，以及客户 / 渠道集中度仍未量化。
