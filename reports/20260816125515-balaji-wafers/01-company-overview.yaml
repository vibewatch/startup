  - id: s5
    title: Milestones and Growth Trajectory
    body: >
      Balaji Wafers' history is a five-decade compounding story built almost entirely on reinvested profits. Key
      milestones span the 1974 canteen start, the ~1982 formal brand launch, the shift to semi-automated (late 1980s)
      and then fully automated plants (mid-1990s onward), the Metoda GIDC Rajkot plant that was at inception among
      India's largest automated wafer facilities, the Valsad plant among Asia's biggest, and the Indore plant serving
      western and central markets. [CO030] [CO031]

      Financially the company crossed ₹5,000 crore in revenue around FY23–FY24, posted a 41% profit jump in FY24, and
      is estimated at ~₹6,548 crore in FY25. The defining corporate milestone is the January 2026 General Atlantic
      minority investment at a ₹35,000 crore valuation — the first external capital in the company's history — followed
      by a stated three-to-four-year IPO ambition. [CO032] [CO033] [CO034]

      The trajectory reframes Balaji from a regional Gujarat brand into a nationally relevant, institutionally-backed
      FMCG platform. The milestone chronology (Table TO004) is the single record of founding, financing, product,
      scale, governance and adverse events referenced throughout this report. [CO035] [CO036]
    claimRefs:
      - CO030
      - CO031
      - CO032
      - CO033
