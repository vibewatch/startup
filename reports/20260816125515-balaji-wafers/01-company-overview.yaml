callouts:
  - calloutType: strength
    title: Fifty years of bootstrapped, profitable compounding
    body: >
      Balaji reached ~₹6,548 crore FY25 revenue and near-₹1,000 crore profit without any external capital until 2026 —
      a rare, self-funded FMCG scale story that gives it a strong balance sheet and disciplined cost culture.
    claimRefs:
      - CO006
      - CO022
      - CO024
  - calloutType: risk
    title: Governance transition and key-person dependence
    body: >
      The company is moving from a family-run structure to institutional-grade governance while depending heavily on
      Chandubhai Virani and an in-progress generational handover; professional management is planned but not yet in
      place.
    claimRefs:
      - CO012
      - CO013
  - calloutType: insight
    title: First external capital validates — and prices — the franchise
    body: >
      General Atlantic outbidding ITC, PepsiCo, General Mills, Kedaara, TPG and Temasek confirms strategic value, but
      the ~₹35,000 crore price (after PE funds balked at a ₹40,000 crore ask) sets a demanding bar for execution.
    claimRefs:
      - CO017
      - CO020
      - CO021
