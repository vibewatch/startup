              这类电商平台。前三项证明生产规模；现代零售和电商合理且具战略重要性，但公开证据不能证明具名合同、账户级结果或渠道收入。[CU014] [CU015] [CU016] [CU017]


              多份独立报道在规模和区域份额上相互印证的地方，证明质量最强。营销分析资料只谈渠道演进、却不点名账户或发布最新收入结构的地方，证明质量较弱。因此，枚举表有意保持不完整，并配上证据缺口：公开记录能证明渠道规模，不能给出完整客户名册。[CU018]
              [CU033] [CU036] [CU039]
