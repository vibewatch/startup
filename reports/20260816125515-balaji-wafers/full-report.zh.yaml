      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              品类增长受城市化、零食场景增加、收入上升、正规渠道份额提升、产品创新和 namkeen GST 减免支撑。这些驱动因素匹配 Balaji 的价值架构：低广告强度、自动化、广泛分销和「Zyada Chips,
              Kam Hawa」价值主张，可以转化那些想要品牌保障、但不愿支付跨国品牌溢价的消费者。General Atlantic 的投资进一步验证了机构投资者的判断：可服务市场能容纳一个更大、更专业的 Balaji 平台。
              [CM017] [CM018] [CM026] [CM040]

              约束同样重要。土豆和食用油通胀会压缩利润率；PepsiCo、Haldiram's、ITC 和区域 namkeen 品牌可以用更高支出抢占或防守本地货架；健康和烘焙零食趋势会给油炸薯片和 namkeen
              施压；全国扩张还要求 Balaji 在印度西部大本营之外投入工厂产能、物流、零售商账期和营运资金。市场有吸引力，但下一阶段不只是获取需求——而是在不熟悉的州里投入资本，建立分销和信任。 [CM019]
