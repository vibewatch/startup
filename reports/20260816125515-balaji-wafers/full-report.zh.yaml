  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >
              本章把 Balaji Wafers 的市场界定为印度销售的包装咸味零食：薯片、namkeen 和
              bhujia/sev/gathiya、膨化或西式零食，以及新兴的烘焙或健康定位咸味包装。这个边界有意同时纳入品牌化正规玩家和无品牌 / 散装本地零食，因为消费者从无品牌替代品转向正规渠道，推动正规细分增长超过
              10%。甜食、饼干、饮料、QSR 餐食和其他包装食品不计入直接 TAM，而是作为相邻品类或钱包份额替代。 [CM001] [CM002] [CM015] [CM031]

              现状替代品不只是 PepsiCo 或 Haldiram's，也包括社区 namkeen 店、散装 farsan 柜台，或区域无品牌薯片卖家。薯片约占零食市场 42%，但 namkeen 和 bhujia
              仍是庞大的传统细分，因此 Balaji 的机会既取决于拿下西式冲动消费场景，也取决于赢得印度咸味零食场景。2024 年 namkeen 的 GST 从 18% 下调至 12%，提升了这个核心传统子品类的可负担性。
              [CM003] [CM004] [CM005] [CM032]
