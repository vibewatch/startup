      - number: '7.5'
        title: 人员、执行缓释和止损标准
        blocks:
          - type: paragraph
            body: >-
              人员和执行风险连接着现有业务和已被价格计入的未来。Chandubhai Virani 仍是董事长、董事总经理和公众面孔；GA 入股后，Virani 家族仍保留控制权。[CR024] [CR026]
              下一代成员参与主导了 GA 交易，市场预期公司会专业化，但公开资料没有列出交易后的完整 C-suite、工厂管理梯队或全国销售领导计划。[CR025] [CR027]
              这一点重要，因为下一阶段要求公司同时升级治理、扩张新市场、建设质量体系、放大经销商网络并为最终 IPO 做准备。


              缓释计划应明确且以阈值为基础。正面证据包括：审计 FY25/FY26 账目与报道指标匹配；没有重大 FSSAI 通知或召回；采购和质量控制有文档；全国扩张队列的贡献利润率改善；家族 / GA
              治理框架已签署；财务、质量、销售和运营均有具名专业负责人。[CR038] 止损标准也应同样具体：重大食品安全召回或监管关停；EBITDA 利润率持续低于约 12%；追加投入后非西部扩张仍失败；IPO
              准备窗口期内西部区域收入仍高于 80%；或家族 / GA 治理关系出现可见破裂。这些事件会把普通执行风险升级为投资逻辑破裂。[CR039] [CR040]
