  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 食品安全 / FSSAI
        - 召回、监管通知或工厂停产
        - 任何重大召回、停业令或未解决的 FSSAI 不合规
        - 暂停投资逻辑，直至根因、整改和品牌修复获得独立验证
      - - 估值 / 利润率
        - 披露的 EBITDA 或净利润率恶化
        - EBITDA 利润率持续低于 ~12%，或净利润率低于 ~10% 且缺乏可信修复
        - 重新定价入场；利润率恢复前不按 ~35x P/E 承销
      - - 全国扩张
        - 非西部扩张队列经济性
        - GA 资金投入 12–18 个月后邦级队列仍失败，或 IPO 准备窗口期西部收入仍占 >80%
        - 下调增长假设，要求更慢且以 ROI 设闸的推进
      - - 大宗商品敞口
        - 马铃薯、食用油或包装冲击
        - 连续两个报告期的投入成本通胀未被价格 / 组合 / 生产率抵消
        - 压测毛利率和营运资本假设；要求采购对冲证据
      - - 竞争 / 广告投入
        - 广告和渠道费用升级
        - 广告投入向行业 8–12% 区间靠拢，却没有销量或份额响应
        - 下调利润率预测，检验性价比定位在核心邦之外是否仍能赢
      - - 治理 / 传承
        - 家族、GA 与管理层是否一致
        - 高管层招聘停滞、GA 权利争议出现，或因治理问题 IPO 时间表滑过 2030
        - 升级为 IC 阻断项；要求治理重置或降低估值
      - - 经销商依赖
        - 渠道健康度和应收款
        - 零售补货率下降、经销商流失上升，或新邦应收款显著拉长
        - 放慢铺开，审查信用政策，重新评估渠道集中风险
      - - 披露质量
        - 审计和尽调资料包完整性
        - FY25/FY26 审计数字显著低于报道收入 / 利润，或法律清单显示重大未披露案件
        - 重新承销整体估值；若信任缺口无法修复，可能不投
    notes: 阈值是尽调触发器，不是公司已披露指引；它们把公开风险评估转成可监测的投资纪律。
    claimRefs:
