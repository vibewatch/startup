      - number: '7.4'
        title: 伙伴、依赖和市场传导风险
        blocks:
          - type: paragraph
            body: >-
              Balaji 的伙伴和依赖画像兼具强度与脆弱性。公司通过约 1,225–1,300+ 经销商触达约 4.5 lakh+
              零售网点；这种深度是渠道护城河，但经销商信用、激励、服务水平和补货率在全国扩张中会变成关键依赖。[CR021] [CR022] 印度西部集中度是最大且可量化的渠道依赖：约 80–90%
              收入仍绑定该区域，即便更广泛的印度零食市场很大且在增长。[CR015] [CR029] [CR030]
              如果公司无法把印度西部打法转化为可重复的非西部队列，「区域冠军走向全国平台」的投资逻辑就会变弱。[CR016] [CR023]


              外部交易对手也会传导风险。土豆、食用油和包装供应商影响利润率；FSSAI 和 GST 监管者影响市场准入和税务经济性；General Atlantic
              影响治理纪律，但无法控制这家家族经营公司；PepsiCo、Haldiram’s、ITC、Bikaji 和其他对手可以抬高投入门槛。[CR013] [CR037] [CR028] [CR011]
              依赖图把这些节点显性列出，让尽调不只测试 Balaji 是否有规模，还要测试每个关键依赖是否有冗余、合同保护或明确负责人。[CR040]
