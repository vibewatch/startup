      - number: '6.4'
        title: 留存、复购和满意度可见性
        blocks:
          - type: paragraph
            body: >-
              留存对 Balaji Wafers 的经济模型很重要，但公司不会用 SaaS 指标披露。公开资料没有 NRR、GRR、流失率、客户队列留存、家庭面板复购率、满意度评分或投诉率。最好的证据是间接的：Gujarat
              / 印度西部高份额、大规模网点覆盖和持续收入规模，说明核心市场有消费者复购拉动，也有零售商反复补货。这些信号可信，但不能替代面板数据或经销商订单历史。[CU010] [CU011] [CU023] [CU024]


              可能的耐久机制很简单：价值包装拉动试用，随处可见的 kirana 小店降低购买摩擦，本地工厂支撑新鲜度，零售商会持续补卖得动的货。这是核心区域里强劲的 FMCG
              留存故事，不是经过客户级验证的留存模型。尽调应在承销全国留存耐久性之前，直接索取消费者复购面板、经销商复订频率、活跃网点口径、现代零售 sell-through 和电商复购数据。[CU025] [CU026]
              [CU038]
