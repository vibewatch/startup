      - CR040
  - id: TV001
    title: 推荐结论摘要表
    columns:
      - 决策要素
      - 建议立场
      - 证据基础
      - 改变观点的条件
    rows:
      - - 投资建议
        - 审慎正向 / 有条件买入
        - 品牌势能强、规模盈利且 IPO 路径可信，但价格已计入品质溢价
        - 只有拿到审计支持和可接受股东保护时才买入
