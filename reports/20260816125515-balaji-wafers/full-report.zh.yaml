      - number: '8.5'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >
              可比组有用，但并不完美。Bikaji 是最干净的公开可比，因为它已上市、在印度且以零食为主；公开数据给出的 FY25 收入约 ₹2,617–2,622 crore，市值约 ₹16,140 crore，隐含约
              ~6.2x FY25 收入。[CV010] 这让 Balaji 的 ~5.3x 收入 GA 标记在收入倍数上看起来可辩护，尤其是假设 Balaji 的净利率和印度西部主导地位更强。[CV005] [CV018]
              [CV024]

              Haldiram’s、Prataap Snacks 和 PepsiCo India 精确度较低，但仍重要。Haldiram’s 的 $10B+ 私有市场标记是高端规模参考；Prataap Snacks 约
              ₹1,720 crore FY25 收入显示较小上市玩家的体量；PepsiCo India 更像战略分部参考，而不是独立印度零食估值可比。[CV009] [CV011] [CV012] [CV041] 表
              TV004 有意标为部分覆盖，因为私营公司标记、分部数据和产品组合差异让穷尽式可比失真。TV004 对应的证据缺口因此是必须跨过的尽调门槛，不是装饰性提示。
