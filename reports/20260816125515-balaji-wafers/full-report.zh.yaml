      - number: '2.5'
        title: 保留的规模测算缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              最大分析缺口不在于印度零食是否够大，而在于各来源是否量的是同一个边界。有的来源谈广义零食，有的谈咸味零食、namkeen、薯片、正规零食或收入排名。付费研究页面也只披露标题数字，把方法论留在私有报告里。因此，₹46,571–50,000
              crore 的市场区间足够支撑方向性 TAM 判断，但如果没有方法论对齐，就不足以支撑估值模型的精确测算。 [CM023] [CM025] [CM037]

              Balaji 的精确份额同样是估计。公开报道支持约 ₹6,548 crore FY25 收入、第三大咸味零食定位、约 65–90% Gujarat 薯片份额和约 65%
              印度西部正规零食份额，但公司不披露经审计的分品类收入或逐州份额。因此，尽调应同时保留两个事实：Balaji 已经是印度西部有规模的市场领导者；其全国市场份额、SAM
              渗透率和逐品类经济性，在管理层数据、零售审计和工厂 / 发货记录被核验前，仍是尽调估计。 [CM010] [CM024] [CM027] [CM033] [CM039]
