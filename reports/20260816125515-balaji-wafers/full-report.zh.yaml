chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、历史与商业模式
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers Private Limited 总部位于印度 Gujarat 邦 Rajkot，所在赛道是消费 / FMCG
              包装咸味零食。它的一句话商业模式是：用「Balaji」品牌制造并大规模分销价格亲民的薯片、印度 namkeen（bhujia、sev、gathiya）、膨化和烘焙零食，通过深度
              kirana（社区杂货店）分销网络卖出高销量、高性价比包装来赚取利润，广告投入很低。著名口号「Zyada Chips, Kam Hawa」（“更多薯片，更少空气”）概括了它的价值定位。 [CO001]
              [CO002]

              这个起家故事是公司身份的核心。Virani 家族原本是 Gujarat 邦 Jamnagar 地区的农户；旱灾后，父亲 Popatbhai 卖掉祖传土地，给兄弟们约 ₹20,000 重新开始。1974
              年，兄弟们承包 Rajkot 的 Astron Cinema 小卖部，开始炸卖薯片；「Balaji」品牌（以一座寺庙命名）约 1982 年正式建立，之后二十年里从家庭厨房转向半自动化，再到全自动化生产。
              [CO003] [CO004] [CO005]

              直到 2026 年，公司整个历史都保持完全自筹资金和家族所有，所有产能扩张靠内部留存，而不是外部股权或风险资本。这个私人有限公司实体的 CIN 为 U15400GJ1995PTC027555，注册地在
              Gujarat。 [CO006] [CO007]
