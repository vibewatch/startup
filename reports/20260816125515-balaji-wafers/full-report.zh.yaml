      - number: '2.2'
        title: 受证据约束的 TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              最干净的 TAM 视角是印度咸味零食，2024 年约 ₹46,571–50,000 crore，CAGR 约
              8–9%。不同研究机构纳入范围不一，因此本章保留区间，不强行制造虚假精确度。实用尽调口径下，总印度咸味零食 TAM 可四舍五入到约 ₹50,000 crore；SAM 更窄——包括印度西部正规市场，以及
              Balaji 通过现有工厂、分销商和全国扩张能服务的地域里的薯片和 namkeen 细分；当前 SOM 则是 Balaji 的约 ₹6,548 crore FY25 收入。 [CM001] [CM006]
              [CM007] [CM023]

              从核心数字看，约 ₹6,548 crore 相当于 ₹50,000 crore 总市场的约 13%，也约等于较低 ₹46,571 crore 估计的 14%；在印度西部大本营，Balaji 的份额高得多。这使
              Balaji 即便区域集中，仍是有规模的全国竞争者。尽调风险在于，SAM 不是公开审计数字：必须从工厂覆盖、分销商经济性、渠道组合和品类重叠重新搭建，不能把某个公开数字直接视为答案。 [CM008]
              [CM009] [CM016] [CM038]
