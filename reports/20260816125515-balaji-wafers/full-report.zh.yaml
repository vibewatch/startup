      - number: '8.6'
        title: 退出准备度、止损触发和最终尽调要求
        blocks:
          - type: paragraph
            body: >
              退出准备度有可能成立，但尚未证明。General Atlantic 官方公告和相关报道指向专业化、治理强化、创新、分销扩张，以及约三到四年内 IPO 的目标，对应 2028–2030 年退出窗口。[CV016]
              [CV033] [CV037] 但私营公司尽调文件必须补齐公开报道无法覆盖的缺口：审计 MCA 账目、股权结构表、股东协议、工厂产能、经销商经济性，以及会计利润到现金生成的利润率桥。[CV025] [CV026]
              [CV027] [CV040]

              投资逻辑应先于价格纪律被击穿。如果审计 FY25 收入显著低于 ~₹6,548 crore，利润显著低于媒体估计的接近 ₹1,000 crore，利润率耐久性依赖临时大宗商品红利，或 IPO
              治理里程碑滑坡，建议就从有条件买入转为观察 / 继续研究。[CV006] [CV007] [CV039] 第二条止损路径是战略层面：如果西部集中度仍高，而全国扩张撞上 PepsiCo、Haldiram’s 和
              ITC 的预算，Balaji 仍可能是强运营商，却不值得付出溢价私有入场价。[CV034] [CV035] 表 TV005 和 TV006 把这些风险转化为可执行的投委会闸门。
