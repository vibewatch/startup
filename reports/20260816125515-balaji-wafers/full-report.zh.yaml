      - 重要性
      - 尽调路径
    rows:
      - - MCA 审计申报和 FY25/FY26 管理账
        - 按年度列示收入、PAT、EBITDA、营运资本、债务和现金转化
        - 确认 ~₹6,548 cr 收入和接近 ₹1,000 cr 利润是否是真实的高质量盈利
        - 获取 RoC 申报、法定审计资料包和管理层调节表
      - - 股权结构表和股东协议
        - 家族持股、GA 股权、ESOP、清算优先权、否决权和转让权的精确情况
        - 决定新投资者的稀释、治理和退出经济性
        - 审阅 SHA、章程、董事会会议纪要和交割文件
      - - 工厂产能和利用率
        - Rajkot/Valsad/Indore 工厂按产线的产能、开机率、capex、瓶颈和利用率
        - 检验增长能否在不遭遇稀释利润率的 capex 冲击下延续
        - 开展现场走访、产能模型和 capex 审查
      - - 利润率桥接和大宗商品对冲
        - 马铃薯、食用油和包装敏感性；价格传导；广告投入轨迹
        - 验证 14–15% 净利润率能否穿越投入成本周期
