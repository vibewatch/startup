companyProfile:
  summary: >
    Balaji Wafers Private Limited（CIN U15400GJ1995PTC027555）是一家总部位于印度 Gujarat 邦 Rajkot 的包装咸味零食制造商，由 Virani 三兄弟
    Chandubhai、Bhikhubhai 和 Kanubhai 创立。他们 1974 年在 Rajkot 的 Astron Cinema 小卖部开始炸薯片，约 1982 年打造出「Balaji」品牌。Balaji
    现在是印度第三大咸味零食品牌，排在 PepsiCo（Lay's）和 Haldiram's 之后，从 Gujarat 和 Madhya Pradesh 的四座全自动工厂销售 65+ 个
    SKU，覆盖薯片、namkeen（bhujia、sev、gathiya）以及膨化 / 烘焙零食，并通过 1,225–1,300+ 家分销商触达 4.5 lakh+ 个零售网点。公司完全靠自有现金滚动发展，FY25 收入约
    ₹6,548 crore，净利润接近 ₹1,000 crore；直到 2026 年 1 月，General Atlantic 才以超过 ₹2,000–2,500 crore 收购约 7% 少数股权，对应约 ₹35,000
    crore（约 $4.2B）估值。这是 Balaji 史上第一笔机构资本，也清晰标志着独角兽级融资事件。
