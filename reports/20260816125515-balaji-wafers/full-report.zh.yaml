      - number: '1.5'
        title: 里程碑与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers 的历史是一段五十年复利故事，几乎完全靠利润再投入驱动。关键里程碑包括 1974 年小卖部起步、约 1982 年正式推出品牌、1980 年代末转向半自动化、1990
              年代中期以后建设全自动工厂、Metoda GIDC Rajkot 工厂在投产时跻身印度最大自动化薯片设施之列、Valsad 工厂位居亚洲最大行列，以及服务印度西部和中部市场的 Indore 工厂。 [CO030]
              [CO031]

              财务上，公司在 FY23–FY24 左右收入跨过 ₹5,000 crore，FY24 利润增长 41%，FY25 估计达到约 ₹6,548 crore。最关键的公司里程碑是 2026 年 1 月 General
              Atlantic 以 ₹35,000 crore 估值进行少数股权投资——这是公司历史上第一笔外部资本——随后公司提出三到四年 IPO 目标。 [CO032] [CO033] [CO034]

              这条轨迹把 Balaji 从 Gujarat 区域品牌，改写为具备全国相关性、获得机构背书的 FMCG 平台。里程碑时间线（表 TO004）是本报告引用创立、融资、产品、规模、治理和反向事件的单一记录。
              [CO035] [CO036]
