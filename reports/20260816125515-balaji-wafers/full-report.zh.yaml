  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与消费者工作流定义
        blocks:
          - type: paragraph
            body: >
              应把 Balaji Wafers 作为传统 FMCG 制造商来评估；它的「产品」不是单个包装，而是把价格亲民、新鲜的咸味零食高频送进社区零售的端到端能力。面向消费者的组合覆盖 65+ 个
              SKU，包括薯片、bhujia、sev、gathiya 等 namkeen、膨化零食、烘焙变体、豌豆、花生和相关咸味零食。 [CE001] [CE033] 从工作流看，起点是消费者想买低客单价零食，kirana
              或现代零售网点需要周转快的高性价比包装，制造商则要把大宗原料转化为一致的包装食品，并用足够新鲜度和充量支撑「Zyada Chips, Kam Hawa」。 [CE002] [CE029]
              因此，产品模块地图不是一组应用模块，而是 SKU / 资产 / 工厂矩阵，把薯片、namkeen 和膨化 / 烘焙产品，与土豆、鹰嘴豆 / gram 原料、油、油炸机、调味、包装和分销连起来。 [CE010]
