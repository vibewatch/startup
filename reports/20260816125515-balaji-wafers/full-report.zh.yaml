      - number: '1.2'
        title: 创始人、家族领导与治理
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers 由三位创始兄弟领导。Chandubhai Virani 是董事长兼董事总经理，也是公司最关键的公众面孔；他的兄弟 Bhikhubhai Virani 和 Kanubhai Virani
              是联合创始人，共同负责运营和制造管理。历史上，这家公司一直是股权高度集中的家族企业，2026 年前没有外部机构董事。 [CO008] [CO009]

              Chandubhai Virani 常被引用的理念是：「没有哪份工作太小。羞耻不在于起点小，而在于放弃梦想。」这折射出公司节俭、执行优先的文化。媒体报道把 2026 年 1 月的 General Atlantic
              交易描述为主要由 Virani 家族下一代（已参与业务的儿子和女儿）推动，显示公司在有意完成代际交接，并在潜在 IPO 前走向管理专业化。 [CO010] [CO011]

              治理是尽调的中心问题：公司正从创始人和家族运营结构，转向机构级治理。General Atlantic 的少数股权投资让 Virani
              家族仍牢牢掌握管理控制权，但公司已明确计划引入外部职业经理人，并强化企业职能以达到 IPO 准备状态。对 Chandubhai Virani
              的关键人物依赖，以及家族在代际交接中的一致性是否持久，仍是重要治理考量。 [CO012] [CO013]
