      - number: '1.3'
        title: 独角兽融资事件——General Atlantic 投资
        blocks:
          - type: paragraph
            body: >
              2026 年 1 月，总部在美国的成长型投资者 General Atlantic 同意以超过 ₹2,000–2,500 crore（约 $280–300 million）收购 Balaji Wafers 约 7%
              少数股权，对公司估值约 ₹35,000 crore（约 $4.2 billion）。这是 Balaji Wafers 运营五十多年后的第一笔机构外部投资，也是本报告锚定的明确独角兽级融资事件。 [CO014]
              [CO015] [CO016]

              这笔交易经历了竞争性流程。包括 ITC、PepsiCo、General Mills、Kedaara Capital、TPG 和 Temasek 在内的多家战略和财务买方，都曾以报道中的
              ₹35,000–40,000 crore 估值区间研究入股 Balaji；最终 General Atlantic 胜出。交易结构是少数、非控股投资：Virani
              家族保留控制权，所得资金计划用于运营专业化、强化治理、加快创新和分销，并为约三到四年后的 IPO 做准备。 [CO017] [CO018] [CO019]

              市场并非毫无质疑这一定价。流程早期，据报道一些 PE 基金因 Balaji 要价过高（约 ₹40,000 crore）而退缩，谈判一度停滞，之后 General Atlantic 以约 ₹35,000 crore
              完成交易。这也给后续章节将详细检验的激进估值倍数——约 5x 收入 / 约 35x 盈利——打上谨慎标记。 [CO020] [CO021]
