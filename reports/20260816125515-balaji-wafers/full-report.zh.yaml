  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性排序：估值、集中度和治理主导剩余风险
        blocks:
          - type: paragraph
            body: >-
              Balaji 的运营质量已经被计入一笔要求很高的 2026 年交易，因此风险栈对投资极为敏感。最清晰的头号风险是估值：据报道，私募基金曾认为 ~₹40,000 crore 要价过高并退却，谈判停滞后
              General Atlantic 最终落在约 ~₹35,000 crore，相当于以经典的 ~₹6,548 crore 收入 / 接近 ₹1,000 crore 利润基数计算约 5.3x FY25 收入、~35x
              P/E。[CR006] [CR007] [CR008] 风险不在于 Balaji
              弱，而在于这个价格要求增长、利润率韧性和全国扩张同时兑现。地理集中、竞争、大宗商品敞口和治理交接是下一层最高剩余风险，因为每一项都能迅速侵蚀支撑价格的假设。[CR010] [CR015] [CR024]
              [CR031] 因此，风险热力图把缓释成熟度视为部分完成：GA 改善治理和资本可得性，但审计账目、股东权利细节、全国队列数据和工厂级风险控制仍是尽调问题。[CR003] [CR038]
            claimRefs:
