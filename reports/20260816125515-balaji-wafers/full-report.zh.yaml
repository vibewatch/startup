      - number: '5.2'
        title: 自动化制造架构与运营流程
        blocks:
          - type: paragraph
            body: >
              核心运营架构是一条垂直整合、高度自动化的零食制造线。报道中的工厂资产包括 Gujarat 的 Rajkot 和 Valsad、Madhya Pradesh 的 Indore 共四座全自动工厂，日产量被引用为约
              100,000 kg 薯片和 500,000 kg 其他咸味零食。 [CE003] [CE004] 技术和贸易来源描述了国际标准产线、控温连续油炸机、每分钟约 1,800
              包的自动化包装、机器人码垛，以及立体或自动化仓库。 [CE005] [CE006] [CE007] [CE008] [CE009] 实用生产流程从本地原料采购和冷藏开始，随后进入清洗 / 切片或和面 /
              挤压、油炸 / 烘焙、调味、质检、包装、码垛、仓库暂存和发货。 [CE010] 这套架构重要，因为公司的低广告支出、高性价比包装模式，要求单位成本纪律、高资产利用率和快速周转，而不是靠高端广告带动需求。
