      - 经营假设
      - 估值逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 收入增长维持 20–25%+；净利润率保持在约 14–15%；全国扩张奏效
        - FY30 收入接近 ~₹13,000–15,000 cr，按 6.0–6.5x 收入计；退出价值约 ~₹78,000–97,500 cr
        - 需要验证西印度以外的分销效率，并获得 IPO 重新评级
        - 若增长需要重广告投入，或利润率压缩至 13% 以下，则失效
      - - 基准
        - 增长回落至 15–18%；净利润率保持高位但稳定；IPO 在 2028–2030 年落地
        - FY30 收入 ~₹11,000–12,500 cr，按 ~5.3–5.8x 收入计；退出价值 ~₹58,000–72,500 cr
        - 由 FY25 增长、GA 背书和上市同业收入倍数视角支撑
        - 若 FY25/FY26 审计收入显著低于公开估计，则失效
      - - 悲观
        - 增长放缓至 10–12%；利润率降至 ~12%；治理或 IPO 准备度滑坡
        - 4.0–4.5x 收入倍数给出的价值接近或低于当前 GA 标记
        - 由 PE 质疑证据、扩张摩擦或大宗商品压力触发
        - 若治理权利或优先股堆叠放大下行，转为观察 / 回避
    notes: 情景是基于公开 FY25 估计和同业收入倍数视角推导的示意区间，不是正式 DCF；审计财务可能显著改变结论。
