        - 中
        - 多家高质量新闻源相互印证交易条款；FY25 财务仍是媒体估计
        - 拿到 FY25/FY26 审计账目和利润率桥接后上调至高
      - - 风险评级
        - 中高
        - 估值、全国扩张、大宗商品、治理和私营公司披露风险
        - 治理和全国执行里程碑连续两年兑现后下调
      - - 估值立场
        - 合理至偏高
        - ~₹35,000 cr 相当于 ~5.3x FY25 收入和 ~35x 盈利；可比证据好坏参半
        - 低于 GA 价格或带下行保护时有吸引力；若无新证据，接近 ₹40,000 cr 则偏贵
      - - 持有 / 退出路径
        - 2028–2030 IPO 准备度
        - GA 报道指向专业化和 3–4 年 IPO 目标
        - 如果 IPO 时间表推迟或倍数压缩，应重设退出纪律
      - - 最低尽调条件
