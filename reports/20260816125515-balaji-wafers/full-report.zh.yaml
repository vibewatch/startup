      - number: '7.2'
        title: 监管、法律和披露风险
        blocks:
          - type: paragraph
            body: >-
              Balaji 的监管风险在于，一个大众化油炸零食制造商几乎没有食品安全出错空间。公开资料显示其官方品牌 / 产品存在，也显示 Rajkot 的质量 / 食品安全负责人岗位，但没有完整 FSSAI
              许可证登记、工厂审计轨迹、召回历史或执法案卷。[CR001] [CR032] 因此，监管 / 法律清单有意保持部分覆盖，而非穷尽。一次重大召回、污染事件或工厂停产都会直接传导到品牌信任和经销商信心，所以
              FSSAI 合规证据应被视为交割条件，而不是投后锦上添花。[CR019] [CR037]


              法律和公司披露风险不同，但同样重要。Balaji Wafers Private Limited 有公开法律身份和 CIN U15400GJ1995PTC027555，但私营公司身份限制了外界对审计 FY25
              账目、债务、营运资本、关联方交易、诉讼和 General Atlantic 股东协议的可见度。[CR002] [CR003] [CR004] GST 也仍是模型敏感项，因为 namkeen 税率从 18% 降至
              12%，证明品类税制会改变经济性。[CR005] 证据缺口不是问题证据，而是说明尽调必须在承销公开市场退出前拿到许可证、通知、法律清单、备案文件和股东协议。[CR038]
