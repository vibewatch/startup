      - - 分销效率
        - 网点产出、经销商流失、渠道利润率和非西部复购
        - 检验西部优势能否转成全国增长
        - 分析经销商队列和邦级终端动销数据
      - - IPO 准备计划
        - 董事会构成、CFO / 财务控制负责人梯队、审计控制和招股书草稿时间表
        - 把 GA 背书转成可兑现的 2028–2030 退出路径
        - 索取 IPO 路线图、治理里程碑和顾问工作计划
    notes: 这些要求是最低尽调包；满足后，才可把审慎正向立场转成已执行的买入建议。
