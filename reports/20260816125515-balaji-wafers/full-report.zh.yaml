  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              投资逻辑是，Balaji Wafers 是少见的印度消费品资产：一家自举起家、盈利、高销量的咸味零食平台，FY25 收入约 ~₹6,548 crore，净利润接近 ₹1,000 crore，净利率约
              14–15%，拥有四座自动化工厂、65+ SKU，以及深入印度西部的分销网络。[CV006] [CV007] [CV017] [CV019] [CV020]
              市场背景也有利：印度咸味零食仍是一个有组织化增长的大品类，而 Balaji 的价值包装定位，让它面对广告投入更高的全国品牌时有差异化答案。[CV021] [CV023]

              反向逻辑同样由估值驱动。General Atlantic 交易已经把 Balaji 估到约 ₹35,000 crore（~$4.2B），约为 ~5.3x FY25 收入和 ~35x
              盈利；此前据报道，私募基金曾认为 ~₹40,000 crore 要价偏高。[CV001] [CV005] [CV013] 这意味着投资者买到的不是被隐藏的便宜资产；投资者承销的是持续 15–20%+
              增长、韧性利润率、对 PepsiCo、Haldiram’s 和 ITC 的全国扩张，以及一家此前纯家族公司的机构级治理。[CV014] [CV034] [CV035] 表 TV002 把投资逻辑和反向逻辑拆开，图
              FV001 则说明最终建议为什么是有条件，而非绝对判断。
