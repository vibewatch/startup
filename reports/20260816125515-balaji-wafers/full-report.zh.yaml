            body: >
              Balaji 的运营可靠性依赖一条相对传统但强大的链条：本地土豆采购、冷藏、油和配料采购、密集分销商覆盖、工厂吞吐和快速零售补货。 [CE011] [CE012] [CE013]
              新鲜度主张可信，因为制造版图靠近印度西部和中部消费中心，而产品形态虽然货架稳定，却对新鲜度敏感。 [CE028] [CE034]
              弱点是大宗商品依赖。土豆和食用油是波动的投入篮子，作物质量、仓储损耗、油价通胀或供应中断都会挤压薯片经济性。 [CE025] 第二个依赖是进入市场路径集中：公司在 Gujarat
              和印度西部的区域密度是优势，但也意味着全国扩张必须在本土之外复制分销服务水平。 [CE027] 因此，关键依赖地图把原材料、冷链、工厂自动化、包装线稳定运行和物流密度看作一个耦合的运营系统。 [CE013]
