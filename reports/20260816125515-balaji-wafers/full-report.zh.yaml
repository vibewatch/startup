              22%，城市品牌触达更强。Haldiram's 是民族零食和信任心智的既有龙头，民族零食份额约 36%，据报道估值超过 $10B。ITC Bingo 又提供了一个全国西式零食平台，份额约 13%。上市挑战者包括
