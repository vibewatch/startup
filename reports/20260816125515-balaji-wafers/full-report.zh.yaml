              Balaji Wafers 是传统 FMCG 公司，因此「客户」视角比具名企业账户更宽。终端用户是大众市场零食消费者：农村和城市人群，重视性价比，对价格敏感，并会响应「Zyada Chips, Kam
              Hawa」（“更多薯片，更少空气”）的高性价比包装承诺。货架前的买方 / 付款方往往就是同一个消费者，但决定可得性的贸易客户，是负责备货和补货的分销商、批发商、kirana
              店主、传统零售商、现代零售连锁或电商平台。 [CU004] [CU005] [CU006]


