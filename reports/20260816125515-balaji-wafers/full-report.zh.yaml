      - number: '7.3'
        title: 运营、质量和财务模型风险
        blocks:
          - type: paragraph
            body: >-
              运营风险先从投入品篮子开始。Balaji 的价值主张依赖薯片和油炸咸味零食，所以土豆、食用油、包装和农业供给直接影响毛利率。[CR013] [CR014]
              在正常年份，公司的规模和自动化是优势：据报道，Rajkot、Valsad 和 Indore 的四座工厂每天生产约 100,000 kg 薯片和 500,000 kg 其他咸味零食。[CR017]
              但同样的规模也会放大质量失误、设施中断或物流瓶颈的严重性，尤其是在 GA 支持的增长把品牌推向不熟悉的非西部市场时。[CR018] [CR010]


              财务模型风险是利润率压缩。Balaji 广告强度低，约占收入 4%，低于行业 8–12% 区间，这帮助保护盈利能力。[CR012]
              但全国竞争可能同时推高广告投入、渠道方案、运费和经销商激励，而大宗商品通胀也在上升。[CR031] 如果 EBITDA 利润率降至约 12% 以下，或投入品通胀无法在不损失销量的情况下传导，~35x P/E
              估值就很难站住。[CR039] 因此，运营尽调应聚焦工厂级质量 KPI、召回流程、采购对冲、区域补货率数据，以及新市场投入能否赚到可重复的贡献利润率。[CR038]
