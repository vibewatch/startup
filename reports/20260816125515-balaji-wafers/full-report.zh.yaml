      - number: '5.4'
        title: 信任、食品安全与质量控制
        blocks:
          - type: paragraph
            body: >
              信任层不是网络安全，而是食品安全。公开证据支持公司存在面向 FSSAI 的合规和食品安全 / 质量保证岗位，包括 Balaji Rajkot 运营中的食品技术负责人招聘信号。 [CE015] [CE016]
              KattuFoodTech 招聘信息很重要，因为对食品制造商来说，它最接近开发者信号的等价物：它显示公司需要质量、食品安全和制造实操经验的实践者，而不是软件工程师或公开 GitHub 活动。 [CE018]
              关于薯片加工和零食制造的技术文献，也支持尽调重点放在油品质量、温度控制、原料处理、卫生和包装完整性上。 [CE017] [CE019] 但公开记录没有披露工厂级审计报告、召回历史、微生物指标、HACCP/ISO
              证书、批次拒收率或详细 QA 看板。 [CE036] 这些私有控制需要直接尽调，因为一次食品安全事故就可能损害一个建立在信任、可负担性和家庭重复消费上的品牌。 [CE015]
