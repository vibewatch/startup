        - 薯片、namkeen/bhujia/sev/gathiya、膨化 / 西式零食、烘焙 / 健康咸味包装
        - 公司产品和行业品类页面
        - 匹配 Balaji 的 65+ SKU 组合和近期产品扩张路径
      - - 排除的直接支出
        - 甜品、饼干、饮料、餐厅 / QSR 餐食和非咸味包装食品
        - 相邻品类使用场景和竞争集合不同
        - 视为钱包份额相邻项，而非直接 TAM
      - - 现状替代品
        - 散装 / 无品牌 namkeen、本地 farsan / 薯片卖家和社区零食柜台
        - 有组织细分增长反映消费者从无品牌转向品牌产品
        - Balaji 的价值主张必须同时打赢本地价格 / 价值和全国品牌
      - - 监管边界
        - 2024 年 namkeen GST 税率从 18% 降至 12%，影响传统咸味零食
        - 税率变化被引用为 namkeen 可负担性的顺风
        - 支撑印度零食细分，但影响有品类特异性
    notes: 市场边界采用受证据约束的咸味零食定义；相邻包装食品被注明但排除在直接 TAM 之外，以避免重复计算更广泛食品支出。
