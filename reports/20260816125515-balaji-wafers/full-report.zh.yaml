      - number: '2.3'
        title: 细分、买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              Balaji 的买方是大众市场、重视性价比的印度家庭购物者，儿童、年轻人和家庭零食场景带来强冲动消费。付款方通常是家庭或个人消费者，但采用由零售商中介：kirana
              货架空间、分销商账期、包装价格架构和感知充量，决定消费者在购买点能看到哪些品牌。现代零售和电商增加发现渠道和大包装格式，但公司 4.5 lakh+ 个零售网点的触达意味着 kirana 仍是采用主干。
              [CM012] [CM013] [CM014] [CM030]

              细分经济性不同。薯片提供庞大的西式零食池，也是 Balaji 最强的品牌联想；namkeen、bhujia、sev 和 gathiya 保留区域口味优势；膨化 / 西式零食是对抗全国品牌所必需；烘焙 /
              健康格式是新兴选择，但仍小于核心薯片和 namkeen。因此，买方地图把使用场景、预算所有者和渠道守门人分开，因为如果零售商经济性和补货可靠性跑不通，赢得消费者口味也不够。 [CM003] [CM011]
              [CM028] [CM029] [CM036]
