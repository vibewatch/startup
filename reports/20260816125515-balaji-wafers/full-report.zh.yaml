            title: 特许经营质量支撑溢价
            body: |
              Balaji 兼具 ~₹6,548 crore FY25 收入、接近 ₹1,000 crore 利润、14–15% 净利率和印度西部主导地位，因此是稀缺的印度零食资产，而不是普通区域 FMCG 业务。
            calloutType: strength
