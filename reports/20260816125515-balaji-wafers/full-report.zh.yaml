  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers 变现的是制造出的包装零食，而不是软件、订阅或平台抽佣。报道中的收入基盘来自 Balaji 品牌下的薯片、namkeen
              和其他咸味零食、膨化或西式零食，以及相邻包装产品，通过批发分销商和零售商销售。公开证据支持整体规模——FY23 收入约 ₹4,600 crore，FY24 收入 ₹5,454 crore，FY25 估计收入约
              ₹6,548 crore——但无法给出精确的产品线收入结构。 [CI001] [CI004] [CI005] [CI006]

              定价明确走高性价比路线：低价位、更足充量和「Zyada Chips, Kam Hawa」定位，用来在 kirana
              和大众零售中制造消费者拉动。收入确认应按包装食品经分销商铺货或终端动销来看，并受零售商退货、贸易方案、折扣和 GST
              影响；这些会计细节都未公开。尽调含义是，报道收入质量看起来较高，因为它绑定实物单位、重复零食消费和日常制造产出；但精确组合、实现价格和促销扣减仍是非上市公司缺口。 [CI002] [CI003] [CI037]
              [CI038]
