      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >
              公开牵引力很强：公司从 FY23 约 ₹4,600 crore 收入，增长到 FY24 的 ₹5,454 crore，再到 FY25 估计约 ₹6,548 crore，意味着 FY25 同比增长约
              18%，并延续历史 20–25%+ CAGR 叙事。 [CI004] [CI005] [CI006] [CI007] 运营版图也印证了规模，包括 65+ 个
              SKU、四座自动化工厂、覆盖薯片和咸味零食的日常产量，以及报道的 4.5 lakh+ 个零售网点网络。 [CI003] [CI011] [CI014] [CI015]

              缺口在于可审计性。Balaji 是非上市公司，FY25 收入和利润是媒体估计，保留的公开来源没有经审计的 MCA 财务报表、分部收入、毛利率、现金余额、债务明细、SKU 动销、分销商应收款、库存天数或关联方披露。
              [CI021] [CI022] [CI038] [CI039] 这些缺失指标重要，因为 2026 年 1 月估值同时嵌入了对规模和利润率质量的信心。因此，区间展示项把 FY25 收入、EBITDA
              利润率和净利率视为尽调估计，而不是申报数字；公开财务缺口表则把每个缺失指标转成明确索取项。 [CI029]
