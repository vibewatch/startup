  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑 / 观察项
      - 观点改变触发因素
    rows:
      - - 市场
        - 印度咸味零食市场大，有组织渠道增长仍有吸引力
        - 品类增长不自动支撑高溢价私募入场倍数
        - 若品类增长或有组织化转化显著放缓，下调
      - - 产品与品牌
        - 65+ 个 SKU 和性价比定位支撑消费者拉力与货架周转
        - 核心西部零食之外的产品创新在全国层面验证较少
        - 新区域复购和 SKU 产出获得独立验证后上调
      - - 客户 / 分销
        - 4.5 lakh+ 网点和 1,225–1,300+ 家经销商带来强触达
        - 西部集中可能限制模式向全国迁移
        - 若扩张主要依赖高成本现代渠道或广告投入，下调
      - - 财务
        - ~₹6,548 cr FY25 收入和接近 ₹1,000 cr 利润意味着少见的利润率质量
        - 这些数字是媒体报道的私营公司估计值
        - 若 FY25 审计收入或利润显著低于公开估计，否决
      - - 竞争
        - 区域主导地位在核心市场形成抵御全国玩家的护城河
        - PepsiCo、Haldiram's 和 ITC 全国预算更大，产品组合更宽
        - 若份额提升需要稀释利润率的促销，下调
      - - 估值与风险
        - GA 的竞争性流程验证了战略稀缺性和 IPO 可选性
        - 据报道，PE 基金对 ₹40,000 cr 的高要价犹豫，价格风险真实存在
        - 只有具备入场纪律、下行保护和清晰 IPO 里程碑才买入
    notes: 每行都把有证据支撑的正向投资逻辑，与会改变投委会建议的反向证据或缺失证据配对。
