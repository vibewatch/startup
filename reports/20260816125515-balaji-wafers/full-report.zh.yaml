      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              扩张机会在于把印度西部打法推向全国：借 General Atlantic 支持的专业化和分销投入，把现代零售、电商和传统渠道覆盖从 Gujarat、Maharashtra 及周边市场向外扩。公开资料明确把
              General Atlantic 2026 年投资与分销、创新和机构化准备挂钩，这能帮助 Balaji Wafers 提升全国覆盖、报告纪律和渠道执行力。[CU027] [CU031]


              风险在于，客户壁垒的可迁移性可能低于估值隐含预期。约 80–90% 收入仍来自印度西部；离开这一基本盘，Balaji 要面对 Haldiram’s、Bikaji、PepsiCo/ITC
              以及全国品牌预算更强、渠道关系更稳的新零食品牌。不利的排灯节零食报道也显示，对手在争夺同一消费场景。因此，尽调问题必须落到渠道层面：证明西部以外的网点扩张能转化为重复
