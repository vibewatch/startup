            body: |
              GA 交易的 ~₹35,000 crore 标记隐含 ~5.3x FY25 收入和 ~35x 盈利；私募基金据报道曾对 ₹40,000 crore 要价却步，这让审计验证和入场纪律变得必要。
            calloutType: risk
            claimRefs:
