      - number: '8.4'
        title: 乐观、基准和悲观估值情景
        blocks:
          - type: paragraph
            body: >
              乐观情景假设 Balaji 在未来数年维持历史 20–25%+ 增长，验证 14–15% 净利率，在不牺牲价值定位的情况下走出印度西部，并以接近或高于 Bikaji 收入倍数参考进入公开市场。[CV008]
              [CV024] [CV030] 基准情景更克制：FY25 约 ~18% 增长逐步回落至十几个百分点中段，利润率保持强劲但不扩张，IPO 倍数接近 GA
              标记，因为公开市场投资者已经定价了相当一部分质量。[CV006] [CV031]

              悲观情景不是崩盘，而是倍数压缩。如果全国扩张需要更重广告投入，大宗商品成本挤压贡献，或治理 / IPO 准备滞后，4.0x 收入口径就可能把价值明显拉低到 ₹35,000 crore
              标记之下，即便公司仍是一门好生意。[CV032] [CV034] [CV036] 因此，下行触发点是运营和证据：增长低于 ~12%、净利率低于 ~12%、审计现金转换弱，或缺少股东保护。[CV039] 表
              TV003 明确假设；图 FV003 把这些假设转化为估值和回报结果区间。
