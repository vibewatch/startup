      - number: '1.4'
        title: 规模、封面指标与运营版图
        blocks:
          - type: paragraph
            body: >
              Balaji Wafers 已具备全国 FMCG 规模。FY24 报道收入为 ₹5,454 crore（约 $655M），净利润 ₹579 crore（增长 41%）；FY25 估计升至约 ₹6,548
              crore（约 $785M），同比增长约 18%，净利润接近 ₹1,000 crore（约 $120M）。这些数字使其成为印度第三大咸味零食品牌，仅次于 PepsiCo（Lay's/Kurkure）和
              Haldiram's。 [CO022] [CO023] [CO024]

              运营上，公司拥有四座全自动制造工厂（Gujarat 的 Rajkot 和 Valsad，以及 Madhya Pradesh 的 Indore），日产大约 100,000 kg 薯片和约 500,000 kg
              其他咸味零食。它销售 65+ 个 SKU，通过 1,225–1,300+ 家分销商触达约 4.5 lakh+（450,000）个零售网点，员工约 1,932 人。区域优势非常突出——估计占 Gujarat 薯片约
              65–90% 份额，占印度西部正规零食约 65% 份额。 [CO025] [CO026] [CO027]

              封面指标有实质性不确定性，因为 Balaji 是非上市公司，不公开发布经审计报表；FY25
              收入和利润是媒体报道估计，不是申报数字，精确员工数和网点数也因来源而异。本报告把这些缺口保留为尽调事项，而不是当作精确数字。 [CO028] [CO029]
