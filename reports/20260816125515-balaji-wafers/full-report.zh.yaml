  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 审计收入不及预期
        - FY25 审计收入显著低于 ~₹6,548 cr
        - 收入倍数和增长证据立即削弱
        - 暂停买入；按实际审计基数重新定价
      - - 利润率韧性不及预期
        - 净利润率低于 ~12%，或利润远低于接近 ₹1,000 cr 的估计
        - 相对同业溢价的论证失去支撑
        - 除非价格显著调整，否则转为观察
      - - 估值过高 / 价格发现失败
        - 新一轮接近 ₹40,000 cr，却没有新的审计证据
        - 复制了 PE 基金的反向担忧，而不是解决它
        - 回避，或要求下行保护
      - - 治理权利缺口
        - 缺少审计账目、董事会权利弱、SHA 不透明，或优先权负担沉重
        - 制度化和 IPO 准备度变得无法承销
        - 法务尽调厘清条款前不交割
      - - 扩张执行风险
