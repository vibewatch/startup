      - number: '4.5'
        title: 资本充足性、融资依赖与结论
        blocks:
          - type: paragraph
            body: >
              Balaji 的资本图景不同于风投支持的烧钱故事。据报道，公司在 2026 年 1 月前一直靠内部留存增长；之后 General Atlantic 以超过 ₹2,000–2,500 crore 收购约
              7%，对应约 ₹35,000 crore 估值。 [CI023] [CI024] [CI025]
              公开证据指向强内部留存、自筹资金投入自动化工厂资本开支和适度债务，但手头现金、月度烧钱、现金跑道和债务限制性条款并未披露。 [CI016] [CI028] [CI039]

              因此，融资依赖是战略性的，而非生死线：GA 资本和治理支持旨在专业化职能、加速创新和分销，并为 2028–2030 年目标 IPO 做准备。 [CI026] [CI027]
              结论是，收入质量和利润率路径偏正面，但取决于核验。收入绑定实物重复消费、高销量和广泛零售触达；利润率受益于规模、自动化和低广告支出。阻碍因素是非上市公司不透明、潜在大宗商品和贸易支出压力，以及激进估值——约
              5.3x FY25 收入和约 35x 盈利——几乎不给利润率滑坡留下空间。 [CI029] [CI030] [CI040]
