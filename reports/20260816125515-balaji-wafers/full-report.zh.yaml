      - number: '8.2'
        title: 建议、信心、风险评级和入场纪律
        blocks:
          - type: paragraph
            body: >
              建议立场是谨慎正面 / 有条件买入，价格应不高于 General Atlantic 入场价；信心中等，风险中高，估值立场为合理到偏高。[CV028] [CV029] 质量得分高，是因为 Balaji
              兼具品类规模、印度西部份额、产品宽度、强利润率和可信的机构伙伴；价格得分较低，是因为 GA 交易设下了要求很高的基准，而公开证据尚未包括审计 FY25 账目、股权结构表或股东协议条款。[CV018]
              [CV024] [CV025] [CV026]

              因此，入场纪律应明确写清。新投资者应优先选择经济条件不差于 GA 的结构，要求交割前拿到审计 MCA 财务和利润率调节，并用治理契约防范后续 down-round 或 IPO
              延迟，而不是只依赖品牌势能。[CV027] [CV038] 目标回报不是风险投资式二元结果；基准情景是到 2028–2030 年 IPO 时获得公开市场重估，而持有 /
              退出计划应每年按收入增长、净利率、分销扩张和治理里程碑重新测试。[CV016] [CV030] [CV031] 表 TV001 汇总投委会决策，图 FV004 给出背后 KPI 评分。
