      - number: '4.2'
        title: GTM 模式与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Balaji 的 GTM 动作是典型印度 FMCG 分销机器，而不是企业销售。公司通过约 1,225–1,300+ 家分销商触达约 4.5 lakh+
              个零售网点，销售动销由低价包装、区域品牌强度和消费者高频复购支撑。 [CI011] [CI012] [CI034]
              用尽调语言看，门店和分销商补货层面的销售周期可能很短，但公开记录不披露分销商账期、贸易支出、零售商利润率、销售团队生产率或 SKU 级补货率。

              销售效率最强的公开代理指标是营销强度。来源显示广告支出约占收入 4%，而行业常态为 8–12%，意味着 Balaji 的 CAC 类负担结构性低于必须靠大众媒体买触达的全国 FMCG 同行。 [CI009]
              [CI010] [CI013] 这一优势未必能完美迁移到印度西部之外，因为 Balaji
              的渠道熟悉度和品牌拉动较弱，而全国竞争对手拥有更大营销预算。承销时的关键问题是，未来全国扩张能否保住低广告支出、分销商驱动的模式，还是必须提高贸易促销和媒体支出，进而压缩利润率。 [CI035]
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI034
              - CI035
      - number: '4.3'
        title: 成本结构、单位经济性与利润率驱动因素
        blocks:
          - type: paragraph
            body: >
              公开单位经济性故事是连贯的，即便拿不到 SKU 级贡献利润率。Balaji 卖低价零食包装，单包毛利额薄，但用巨大销量抵消——日产约 100,000 kg 薯片和 500,000 kg
              其他咸味零食——再叠加自动化、本地土豆采购、成本纪律和低广告强度。 [CI003] [CI015] [CI017] [CI018] 报道中的 EBITDA 利润率约 13–15%、净利率约
              14–15%，对一家性价比定价的食品制造商来说很强，尤其 FY24 PAT 为 ₹579 crore，FY25 利润估计接近 ₹1,000 crore。 [CI005] [CI006] [CI008]

              尽调要看的主要成本包括土豆、食用油、包装、电力、工厂人工、运费、分销商利润率、退货和促销方案。公开可比公司显示，原材料压力会影响上市零食同行，这强化了获取 Balaji
              大宗商品对冲、库存天数和贸易应付数据的必要性。 [CI019]
              资本开支强度是真实存在的：公司已建成四座自动化工厂，并继续投入制造产能，因此自由现金流应在维护性资本开支、扩张资本开支和营运资金吸收之后再测试，不能只看 PAT。 [CI015] [CI016]
