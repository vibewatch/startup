      - number: '8.3'
        title: 当前融资与估值背景
        blocks:
          - type: paragraph
            body: >
              当前价格锚是 2026 年 1 月 General Atlantic 少数股投资：以超过 ₹2,000–2,500 crore 获得约 7% 股权，隐含约 ₹35,000 crore（~$4.2B）股权价值，也让
              GA 成为这家家族控股公司的首个外部机构股东。[CV001] [CV002] [CV003] [CV004] 公开报道还称，ITC、PepsiCo、General Mills、Kedaara、TPG 和
              Temasek 等多家战略和财务买家都曾围绕公司接触，这支撑了战略稀缺性价值，也说明价格发现过程存在分歧。[CV014]

              估值算术简单且要求很高。以 FY25 收入 ~₹6,548 crore、利润接近 ₹1,000 crore 计算，GA 标记约为 ~5.3x 收入和 ~35x P/E。[CV005] [CV006]
              [CV007] 与 Bikaji 约 ~6.2x 收入口径、Haldiram’s $10B+ 私有市场参考相比，这个价格并非明显缺乏支撑；但证据基础更弱，因为 Balaji 是私营公司，准确的审计 FY25
              财务尚未公开。[CV009] [CV010] [CV025] [CV042] 图 FV002 展示了收入或收入倍数的小幅变化如何显著改变股权价值，这也是尽调应聚焦审计收入质量、利润率耐久性和优先权悬挂的原因。
