      - - 现金跑道（月数）
        - 公开数据中 burn 和现金均未披露，因此该指标意义不大
        - 应按盈利经营跑道理解，但受 capex 计划约束
        - 若利润率压缩或 capex 加速
        - 大宗原料和扩张情景下的 24 个月现金预测
      - - 计划资金用途
        - 推动运营专业化、加快创新 / 分销、准备 IPO
        - 这是战略增长资本，不是救急资金
        - IPO 目标为 2028–2030
        - 董事会批准的募资用途和招聘 / capex 预算
      - - 债务 / 项目融资
        - 公开描述为不高，但确切义务未公开
        - 杠杆风险看起来不是主矛盾，但契约条款未知
        - 新自动化工厂或分销网络扩建
        - 债务偿付表、契约条款、担保包和贷款方集中度
      - - 下一轮融资触发点
        - GA 之后未披露近期私募轮；IPO 目标在 3–4 年后
        - 融资依赖主要由治理和市场窗口驱动
        - 上市准备度和经审计财务记录
        - IPO 准备时间表、审计师质量和最低公众持股计划
