  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: India savoury-snacks market size and scope
      missingEvidence: >-
        Public sources support a ₹46,571–50,000 crore 2024 market range, but they do not all use identical definitions
        across snacks, savoury snacks, namkeen and organised snacks.
      whyItMatters: >-
        TAM precision drives market-share math and valuation support; using one estimate without scope reconciliation
        would overstate confidence.
      diligencePath: >-
        Obtain the underlying market-research methodologies and reconcile category definitions before building the final
        valuation model.
      relatedQuestionRefs:
        - QM003
        - QM020
        - QM022
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: Balaji SAM and exact all-India share
      missingEvidence: >-
        Balaji does not publicly disclose audited category revenue, state revenue, channel mix or retailer-audit share
        needed to quantify SAM precisely.
      whyItMatters: >-
        The investment case depends on how much of the national market is truly reachable from Balaji's current western
        base and planned expansion.
      diligencePath: >-
        Request management sales cubes by geography/category/channel, distributor productivity, retailer-audit share and
        shipment data by plant catchment.
      relatedQuestionRefs:
        - QM005
        - QM007
        - QM021
        - QM025
      relatedTableRefs:
        - TM002
    - type: single-source
      severity: minor
      topic: GST change pass-through and consumer affordability
      missingEvidence: >-
        Public sources identify the namkeen GST cut from 18% to 12%, but pass-through into pack prices or gram sizes is
        not disclosed for Balaji.
      whyItMatters: >-
        If brands keep the benefit rather than passing it through, volume adoption effects may be weaker than the tax
        headline suggests.
      diligencePath: >-
        Compare pre- and post-GST MRP/grammage across Balaji namkeen SKUs and competitor packs in kirana and modern-trade
        audits.
      relatedQuestionRefs:
        - QM016
      relatedTableRefs:
        - TM004
    - type: no-public-source
      severity: material
      topic: Buyer funnel conversion and channel economics
      missingEvidence: >-
        Public evidence identifies outlet reach and category drivers, but not conversion rates, distributor margins,
        retailer credit terms or repeat-purchase cohorts.
      whyItMatters: >-
        National expansion economics hinge on channel productivity and repeat purchase, not merely on the size of the TAM.
      diligencePath: >-
        Review distributor contracts, retailer margins, sell-through by SKU, repeat purchase data and e-commerce cohort
        metrics.
      relatedQuestionRefs:
        - QM009
        - QM010
        - QM026
        - QM027
      relatedTableRefs:
        - TM003
        - TM004
