        - Sets the broad demand pool for chips, namkeen and western snacks
      - - Core product categories
        - Potato chips, namkeen/bhujia/sev/gathiya, extruded/western snacks, baked/healthy savoury packs
        - Company products plus industry category pages
        - Matches Balaji's 65+ SKU portfolio and near-term product expansion paths
      - - Excluded direct spend
        - Sweets, biscuits, beverages, restaurant/QSR meals and non-savoury packaged foods
        - Adjacent categories have different usage occasions and competitive sets
        - Treat as wallet-share adjacencies, not direct TAM
      - - Status-quo substitutes
        - Loose/unbranded namkeen, local farsan/chips sellers and neighbourhood snack counters
        - Organised segment growth reflects switching from unbranded to branded products
        - Balaji's value proposition must beat local price/value as well as national brands
      - - Regulatory boundary
        - GST relief on namkeen from 18% to 12% in 2024 affects traditional savouries
        - Tax change cited as an affordability tailwind for namkeen
        - Supports the Indian-snack segment, though impact is category-specific
    notes: >-
      The market boundary uses an evidence-constrained savoury-snacks definition; adjacent packaged foods are noted but
      excluded from direct TAM to avoid double-counting broader food spend.
