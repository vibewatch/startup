chapter:
  number: 2
  title: Market Analysis
  summary: >
    Balaji Wafers competes in India's savoury/salty snacks market, a roughly ₹46,571–50,000 crore 2024 category growing
    at about 8–9% CAGR, with organised branded snacks growing 10%+ as consumers migrate from unbranded local products.
    The practical TAM is the full India savoury-snacks pool; the SAM is the organised western-India, potato-chip and
    namkeen opportunity Balaji can reach through its current distribution and near-term expansion; and the SOM is its
    ~₹6,548 crore FY25 revenue, about 13% of the total market and materially higher in organised western India. The most
    important diligence caveat is source-scope variation: market-size estimates and Balaji share figures are directional,
    not audited company disclosures.
sections:
  - id: s1
    title: Market Boundary and Status-Quo Substitutes
    body: >
      For this chapter, Balaji Wafers' market is defined as packaged savoury/salty snacks sold in India: potato wafers,
      namkeen and bhujia/sev/gathiya, extruded or western snacks, and emerging baked or health-positioned savoury packs.
      That boundary intentionally includes branded organised players and unbranded/loose local snacks because the
      organised segment is growing 10%+ as consumers shift from unbranded alternatives. It excludes sweets, biscuits,
      beverages, QSR meals and other packaged foods, while treating them as adjacencies or wallet-share substitutes rather
      than direct TAM. [CM001] [CM002] [CM015] [CM031]

      The status quo is not just PepsiCo or Haldiram's; it is also a neighbourhood namkeen shop, a loose farsan counter,
      or a regional unbranded chip seller. Potato chips are approximately 42% of the snack market, but namkeen and bhujia
      remain a large traditional segment, so Balaji's opportunity depends on winning both western-style impulse occasions
      and Indian savoury occasions. The 2024 GST cut on namkeen from 18% to 12% improves affordability for one of those
      core traditional subsegments. [CM003] [CM004] [CM005] [CM032]
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM015
      - CM031
      - CM032
    tableRefs:
      - TM001
    figureRefs:
      - FM004
  - id: s2
    title: Evidence-Constrained TAM, SAM, and SOM
    body: >
      The cleanest TAM lens is India savoury/salty snacks at roughly ₹46,571–50,000 crore in 2024, growing about 8–9%
      CAGR. Because research vendors use different inclusions, this chapter preserves the range rather than forcing false
      precision. A practical diligence TAM is therefore rounded to approximately ₹50,000 crore for total India savoury
      snacks; the SAM is narrower — organised western India plus the potato-chip and namkeen segments in geographies
      Balaji can serve through current plants, distributors and national expansion; and the current SOM is Balaji's
      ~₹6,548 crore FY25 revenue. [CM001] [CM006] [CM007] [CM023]

      On the headline math, ~₹6,548 crore is about 13% of a ₹50,000 crore total market and roughly 14% of the lower
      ₹46,571 crore estimate, while Balaji's share is much higher in its western-India stronghold. That makes Balaji a
      scaled national contender despite its regional concentration. The diligence risk is that SAM is not a public
      audited figure: it must be rebuilt from plant reach, distributor economics, channel mix and category overlap rather
      than accepted as a single published number. [CM008] [CM009] [CM016] [CM038]
    claimRefs:
      - CM001
      - CM006
      - CM007
      - CM008
      - CM009
      - CM016
      - CM023
      - CM038
