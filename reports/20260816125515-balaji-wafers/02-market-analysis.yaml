  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Primary Buyer / User
      - Payer / Budget Owner
      - Adoption Path
      - Balaji Relevance
    rows:
      - - Potato chips
        - Youth, families and impulse snackers
        - Household shopper or individual consumer
        - Kirana availability, low-price packs, brand recall and fill-value perception
        - Large category (~42% of snack market) and Balaji's strongest regional franchise
      - - Namkeen / bhujia / sev / gathiya
        - Family snack occasions and traditional taste consumers
        - Household grocery budget
        - Trust in local taste, frequent replenishment and GST-aided affordability
        - Large traditional segment aligned with Balaji's Gujarat and western-India taste base
      - - Extruded / western snacks
        - Children, teens and modern-snack consumers
        - Parents or individual small-ticket spend
        - Trial through kirana, modern trade and competitor comparison with Kurkure/Bingo-style products
        - Necessary for national competitive relevance beyond wafers
      - - Baked / healthy savoury
        - Health-aware urban consumers
        - Premium household snack budget
        - Discovery via modern trade/e-commerce, claims and repeat taste acceptance
        - Emerging adjacency; smaller today but important for future mix resilience
      - - Retailer / channel gatekeeper
        - Kirana owner, distributor, modern-trade buyer and e-commerce platform
        - Shelf-space, credit and replenishment economics
        - Margin, stock turns, logistics reliability and consumer pull
        - Determines physical adoption even when consumer demand exists
    notes: >-
      Buyers and payers are separated from the channel gatekeeper because small-ticket FMCG adoption depends heavily on
      retailer economics and replenishment reliability.
    claimRefs:
      - CM003
      - CM011
      - CM012
      - CM013
      - CM014
      - CM028
      - CM029
      - CM030
      - CM036
  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Mechanism
      - Impact on Balaji
    rows:
      - - Urbanisation and more snacking occasions
        - Driver
        - More out-of-home, at-home and impulse snack consumption
        - Expands category demand for chips, namkeen and western snacks
      - - Rising incomes and organised-sector shift
        - Driver
        - Consumers trade from loose/unbranded snacks to branded packs with quality assurance
        - Supports 10%+ organised growth and Balaji's value-brand conversion path
      - - GST cut on namkeen from 18% to 12% (2024)
        - Driver
        - Lower tax burden improves affordability for traditional savouries
        - Helps namkeen/bhujia/sev/gathiya demand and price-pack architecture
      - - Potato and edible-oil inflation
        - Constraint
        - Key input costs can compress margins or require price/grammage changes
        - Most acute for potato chips and fried namkeen
      - - National competition and distribution cost
        - Constraint
        - PepsiCo, Haldiram's, ITC and regional brands defend shelves; expansion requires logistics and credit
        - Balaji must spend to convert national headroom without losing value positioning
      - - Health and baked-snack trends
        - Mixed
        - Fried snacks face nutrition scrutiny, while baked/healthy products create innovation space
        - Requires portfolio evolution without diluting core value proposition
    notes: >-
      Drivers are category-level; constraints are especially important because Balaji's next growth leg is national
      expansion beyond its western-India stronghold.
