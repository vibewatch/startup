  foundingLocation: Rajkot, Gujarat, India
  headquarters: Rajkot, Gujarat, India
  productSummary: >
    A value-for-money portfolio of 65+ SKUs spanning potato wafers, Indian namkeen (bhujia, sev,
    gathiya), extruded and baked snacks, peas and peanuts, sold in heavier-fill packs under the
    tagline "Zyada Chips, Kam Hawa" ("More Chips, Less Air") and produced across four automated
    plants at roughly 100,000 kg of wafers plus 500,000 kg of other savouries per day.
  customerFocus: >
    Mass-market, value-conscious Indian consumers reached through a deep kirana/general-trade
    distribution network (1,225–1,300+ distributors, 4.5 lakh+ outlets), with growing modern-trade
    and e-commerce presence; demand is concentrated in Gujarat and western India.
  businessModel: >
    High-volume, value-priced manufacturing: Balaji earns margin on affordable, heavy-fill snack
    packs sold through dense kirana distribution with minimal advertising (ad spend ~4% of revenue
    vs an 8–12% industry norm), reinvesting cash flow into automation and capacity.
  stage: late-stage private (first institutional round)
  fundingStatus: >
    Bootstrapped and family-owned for over five decades; first external capital was General
    Atlantic's ~7% minority stake for over ₹2,000–2,500 crore (~$280–300M) at a ~₹35,000 crore
    valuation in January 2026, with an IPO targeted within roughly three to four years (2028–2030).
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO006, CO031, CO035]
