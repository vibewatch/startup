- id: leadership-and-governance
  title: Leadership, governance, and operating model
  body: 'Publicly reviewed material centers leadership on founder and CEO Luis Silva, who is also described in independent profiles as chairman and the public face of the company’s AI-native operating thesis. Additional named executives in current sources include Pablo de Mello on operations and funding, Lucas Martinelli on the credit entity, Gabriel Bernal in customer experience, and Fabrício Costa in financial services. The strongest disclosed governance insight is operational rather than board-oriented: CloudWalk claims a deeply agentic operating model in which software agents perform the majority of customer support and substantial portions of engineering and go-to-market work, allowing a relatively lean employee base versus peers. What remains thin is formal governance disclosure. The reviewed public pack did not yield a clean current board list, committee structure, or updated post-2021 shareholder-control map beyond investor references, so governance transparency should be treated
    as adequate for commercial diligence but incomplete for a full control-rights review.'
  claimRefs:
