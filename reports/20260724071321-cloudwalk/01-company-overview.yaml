company:
  name: CloudWalk
chapter:
  number: 1
  title: Company Overview
  summary: CloudWalk is a São Paulo-founded merchant-acquiring and financial-services platform that moved from payments infrastructure into a full SME operating stack under the InfinitePay brand. Public disclosures support a step-change from $320.5 million of 2023 revenue to $497 million in 2024 and a $1.3 billion annualized revenue run rate by the end of 2025, while the company increasingly funds growth through large FIDC securitizations rather than fresh equity rounds.
sections:
- id: identity-and-business-model
  title: Identity and business model
  body: 'CloudWalk presents itself as a Brazilian financial-technology company building a merchant operating system around the InfinitePay brand. The reviewed source pack consistently places the company in São Paulo and shows a two-stage evolution: first, cloud-native payments infrastructure for the Brazilian acquiring ecosystem; second, a direct-to-merchant motion that began with InfinitePay in 2019. The current product surface is broader than a traditional card acquirer. InfinitePay combines card acceptance, Tap to Pay and smartphone-based acceptance, free PIX transfers, a digital account, online checkout, payment links, receivables anticipation, and merchant credit. Company and investor materials repeatedly frame the model as serving micro and small entrepreneurs that legacy banks and incumbents handled with slower settlement, higher fees, and more field-heavy distribution. That matters for later diligence chapters because CloudWalk is not underwriting a single hardware SKU or a single
    fee product; it is underwriting an integrated payments, banking, credit, and AI workflow with meaningful cross-sell leverage.'
  claimRefs:
