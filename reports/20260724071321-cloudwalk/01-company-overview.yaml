- id: funding-capital-and-scale
  title: Funding, capital strategy, and scale
  body: The most important capital-structure fact is that CloudWalk’s public story now combines an older equity valuation with a much newer structured-credit machine. PRNewswire and Sacra both point to roughly $365 million of lifetime disclosed equity funding and a last disclosed equity valuation of $2.15 billion from a November 2021 Series C led by Coatue, following a $190 million Series B earlier that year. Since then, the company’s growth narrative has been carried less by fresh venture rounds and more by profitability plus FIDC issuance. CloudWalk’s 2025 FIDC Pi issuance raised R$3.1415 billion, the October 2025 FIDC Bela issuance raised R$4.2 billion, and NeoFeed later reported a still larger R$5.5 billion issuance in 2026. Those structures fund receivables anticipation and working-capital style services for merchants without equity dilution, but they also make capital-market access and portfolio performance central to the thesis. That keeps funding quality central to the overview.
  claimRefs:
