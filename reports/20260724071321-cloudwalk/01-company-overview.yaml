callouts:
- calloutType: strength
  title: CloudWalk has already crossed the difficult profitability threshold for a private acquirer
  body: Unlike many SMB fintechs still optimizing for growth at the expense of earnings, CloudWalk disclosed positive net income in 2023, expanded it materially in 2024, and then paired faster growth with larger structured-credit access in 2025. That combination raises the quality of the growth story relative to purely subsidized merchant-acquisition models.
  claimRefs:
  - CO005
  - CO006
  - CO009
  - CO011
- calloutType: risk
  title: Capital structure now depends heavily on structured credit rather than fresh equity price discovery
  body: The equity valuation most often cited publicly is still the 2021 private-round mark, while the more current financing evidence is dominated by FIDC issuance. That is strategically useful because it avoids dilution, but it also means investors need receivables performance, covenant, and liquidity data to underwrite the current business with confidence.
  claimRefs:
  - CO020
  - CO021
  - CO022
  - CO023
  - CO024
