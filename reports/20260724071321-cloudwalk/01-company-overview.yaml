  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board list, committee structure, and voting-rights map for CloudWalk.
    whyItMatters: The public operating story is strong, but governance and control rights remain under-disclosed for equity underwriting.
    diligencePath: Request the latest board materials, shareholder agreement summary, and governance chart from management.
    relatedQuestionRefs:
    - QO006
    - QO021
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: fidc-covenants
    missingEvidence: Advance rates, subordination levels, covenant package, and delinquency triggers for the main FIDC vehicles.
    whyItMatters: Structured credit is now a core funding engine; downside underwriting depends on knowing its actual protections and failure modes.
    diligencePath: Request investor decks, fund regulations, and treasury stress tests for FIDC Pi and FIDC Bela.
    relatedQuestionRefs:
    - QO022
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current post-2021 cap table and ownership concentration.
    whyItMatters: The last disclosed valuation is stale and ownership drift after secondary sales or internal transfers could affect control and incentives.
    diligencePath: Request the latest cap table, option pool summary, and any secondary transaction history since 2021.
    relatedQuestionRefs:
    - QO023
    - QO024
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A single current employee count reconciled across 2024 and 2025 disclosures.
    whyItMatters: Efficiency metrics are a core part of the thesis, so denominator drift changes the revenue-per-employee story.
    diligencePath: Request audited average headcount and year-end headcount for 2024 and 2025.
    relatedQuestionRefs:
    - QO025
