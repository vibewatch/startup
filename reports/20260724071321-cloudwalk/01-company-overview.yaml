- id: milestones-and-operating-footprint
  title: Milestones, footprint, and reuse facts
  body: 'The milestone record is unusually dense for a private fintech. CloudWalk disclosed $320.5 million of 2023 revenue and first full-year profitability before reporting $497 million of 2024 revenue, $63 million of net income, and 3 million sellers in Brazil at year-end 2024. Through 2025 it layered on an open-finance based credit motion, a Central Bank credit-institution license, an AI merchant assistant called JIM, a U.S. launch via JIM.com, and ever-larger FIDC deals. By late 2025 and early 2026, the company was publicly describing more than 6 million Brazilian entrepreneurs on the platform, 14 million open accounts, more than 90% automated complaint resolution through Claudio Walker, and revenue run rate above $1.2 billion to $1.3 billion depending on the disclosed measurement date. These facts make the company reusable ground truth for later chapters: CloudWalk is already profitable, already national in Brazil, and increasingly capital-markets dependent as it expands credit and
    receivables products. That operational breadth is now visible across product, capital, and support surfaces.'
