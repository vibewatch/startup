- id: monetization-and-unit-economics
  title: Monetization and unit economics
  body: 'CloudWalk’s monetization is visibly multi-line even though public segment reporting remains thin. InfinitePay’s public pages and company releases point to at least four revenue surfaces: merchant discount rates on card acceptance, subscription or workflow monetization layered into the merchant account, receivables anticipation and credit spread, and newer AI- or software-led upsell opportunities inside the account experience. This is why headline revenue per seller remains a useful but incomplete unit-economics proxy. Using company-disclosed revenue and seller counts, a rough implied revenue per seller stayed in the same broad band from 2024 to 2025 even as the merchant base more than doubled, which suggests the company was not buying growth solely by collapsing monetization. At the same time, public pages make clear that pricing is promotional, volume-tiered, and payout-dependent, so any simplistic MDR-only model will understate the complexity of CloudWalk’s economics. The GTM
    implication is that CloudWalk can spread acquisition cost over a broader product bundle, but external readers still lack enough public data to calculate true CAC, payback, or channel contribution. That pushes sales efficiency into proxy analysis rather than direct measurement.'
