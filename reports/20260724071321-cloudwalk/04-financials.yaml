  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TI005 public financial gaps
    missingEvidence: Quarterly TPV, take-rate bridge, gross margin, and operating cash flow disclosure.
    whyItMatters: Reported revenue and profit are strong, but investors still need the underlying unit-economics drivers and cash conversion profile.
    diligencePath: Request quarterly management reporting by product line with TPV, gross profit, and operating cash flow.
    relatedQuestionRefs:
    - QI020
    - QI021
    - QI006
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: FIDC portfolio performance
    missingEvidence: Delinquency, chargeback, reserve, and impairment history across major FIDC vehicles and credit cohorts.
    whyItMatters: Structured credit is now core to the model, so hidden deterioration would change valuation materially.
    diligencePath: Request warehouse and securitization performance reports, reserve waterfalls, and vintage loss curves.
    relatedQuestionRefs:
    - QI017
    - QI025
    relatedTableRefs:
    - TI004
  - type: stale
    severity: minor
    topic: equity valuation
    missingEvidence: A fresh primary or secondary equity price discovery point after 2021.
    whyItMatters: The common US$2.15B valuation reference is dated relative to the current scale of the business.
    diligencePath: Request details of any internal marks, secondaries, or recent financing discussions.
    relatedQuestionRefs:
    - QI019
  - type: conflicting-data
    severity: minor
    topic: FIDC cumulative total
    missingEvidence: One reconciled cumulative FIDC-issuance figure across company and press sources.
    whyItMatters: The difference between R$14.7B and about R$20B does not break the thesis but does affect how investors frame funding scale.
    diligencePath: Request treasury’s definitive issuance ledger with dates and gross proceeds.
    relatedQuestionRefs:
    - QI015
