    - Profits and growth disclosed, cash flow not separately broken out
    - minor
    - Request operating and free cash flow history
  notes: These are genuine disclosure gaps rather than hidden flaws; they matter because CloudWalk now looks increasingly like a scaled financial institution, not just a startup app.
