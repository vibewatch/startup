  title: The capital story is now inseparable from structured credit execution
  body: Successive FIDC transactions made it possible for CloudWalk to scale receivables and credit products without major new equity dilution, but they also increased dependence on investor appetite, collateral quality, and regulatory conditions around those funding vehicles.
