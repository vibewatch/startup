  title: CloudWalk has already reached a rare combination of growth and profits
  body: The company moved from US$320.5 million of 2023 revenue and US$22.3 million of profit to US$497 million and US$63 million in 2024, then to US$990 million in 2025, which is a much stronger financial profile than a typical growth-stage private fintech.
