company:
  name: CloudWalk
chapter:
  number: 4
  title: Financials
  summary: 'CloudWalk’s financial story is unusually strong for a private fintech: it disclosed profitability in 2023, reported US$497 million of 2024 revenue and US$63 million of net income, then said 2025 closed at US$990 million of revenue and a US$1.3 billion annualized exit run rate. The important caveat is that current scale increasingly depends on large FIDC-backed receivables funding and only partial public disclosure of underlying unit economics, loss rates, and capital structure.'
sections:
- id: revenue-growth-and-profitability
  title: Revenue growth and profitability
  body: The reviewed source pack supports a genuine step-change in CloudWalk’s scale. PRNewswire reported US$320.5 million of revenue and US$22.3 million of net income for 2023, marking the first full year of profitability. CloudWalk’s 2024 results release then lifted revenue to US$497 million and net income to US$63 million, while the March 2026 Business Wire release said 2025 closed with US$990 million of revenue and US$110 million of net income. That progression is important because it means CloudWalk is not simply a GMV story or a venture-subsidized customer land grab. It is a business that has already shown positive earnings while growing rapidly. The resulting two-year pattern looks like profitable hypergrowth rather than a one-off rebound year, although the company still does not provide the audit-depth segment disclosure that a public-market investor would expect.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  tableRefs:
