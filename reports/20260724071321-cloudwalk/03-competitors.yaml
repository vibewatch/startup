company:
  name: CloudWalk
chapter:
  number: 3
  title: Competitors
  summary: 'CloudWalk competes in one of Brazil’s densest fintech battlefields: a merchant-acquiring and SME-finance market where incumbents, listed challengers, bank subsidiaries, and ecosystem players all converge on payments, accounts, credit, and cash-flow tools. The clearest conclusion is that CloudWalk is most directly comparable to Stone, PagSeguro, Mercado Pago, and the bank-backed acquirers in the Brazilian SME segment, while Nubank and Adyen matter more as adjacent balance-sheet or segment-overlap threats than as exact product twins.'
sections:
- id: field-structure
  title: Competitive field structure
  body: 'The Brazilian merchant-services field is crowded because the product stack itself has converged. Stone’s IR materials and homepage, PagBank’s public pricing pages, Cielo’s site, Getnet’s site, and Rede’s site all market combinations of payment acceptance, Pix, digital accounts or settlement tools, receivables anticipation or credit, and app-led control of the business. Mercado Pago layers the same financial services onto a broader commerce ecosystem, while Nubank attacks the banking and wallet side of the merchant relationship. This means CloudWalk is not defending a proprietary payments format so much as competing inside a bundle where the merchant expects card acceptance, instant payments, fast settlement, and some version of credit or cash management by default. The field is therefore best understood in tiers: direct SME acquirers, incumbent bank-backed acquirers, ecosystem-led fintechs, and adjacent or segment-specific challengers. That makes category mapping essential before
    any valuation comparison is attempted. Merchants therefore comparison-shop constantly. Daily.'
