callouts:
- calloutType: risk
  title: Feature convergence makes price and service discipline central
  body: Because nearly every serious Brazilian competitor now advertises Pix, card acceptance, app-led control, and some version of cash-flow support, CloudWalk cannot rely on baseline features alone. Durable advantage will have to come from lower operating cost, smarter underwriting, and better merchant experience.
  claimRefs:
  - CP001
  - CP002
  - CP017
  - CP018
  - CP022
- calloutType: insight
  title: Mercado Pago and Nubank are the most important non-identical threats
  body: Neither company is a perfect one-to-one CloudWalk substitute, but both can compress margins or capture merchant wallet share by cross-selling financial services from much larger ecosystems and balance sheets.
  claimRefs:
  - CP023
  - CP024
  - CP025
