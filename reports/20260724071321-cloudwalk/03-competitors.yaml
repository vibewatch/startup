- id: direct-sme-comparables
  title: Direct SME comparables
  body: Stone, PagSeguro, Mercado Pago, SumUp, Getnet, Rede, and Cielo are the most direct public comparables because they openly pursue the same merchant jobs-to-be-done as InfinitePay. Stone positions itself as a bank for entrepreneurs across micro, small, and larger businesses, explicitly combining payments, banking, and credit. PagBank markets machines, phone-based acceptance, and instant settlement. Cielo and Rede lean on breadth of acceptance and payout flexibility. Getnet combines physical and digital commerce tooling, while SumUp stays anchored on affordable mobile POS and SME simplicity. Mercado Pago is the outlier within the direct group because its ecosystem reach and parent-company backing make it larger and more diversified than a pure acquirer, even though the merchant-facing product surface still overlaps heavily with CloudWalk. In this tier, slight differences in payout speed, customer service, and underwriting can matter more than any single hardware spec.
