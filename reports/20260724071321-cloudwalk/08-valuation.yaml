  - CV026
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - TPV and take-rate by segment
    - Quarterly TPV and product-mix bridge
    - Needed to validate revenue quality and Pix impact
    - Management / finance request
  - - Credit performance
    - Vintage losses, reserves, delinquencies, and underwriting cutoffs
    - Needed to judge downside risk in valuation multiple
    - Treasury and risk review
  - - Funding cost and covenants
    - FIDC pricing, triggers, and refinancing schedule
    - Needed to judge durability of non-dilutive growth model
    - Treasury and legal review
  - - Retention and wallet share
    - NRR/churn by cohort and multi-product attach by vintage
    - Needed to support premium versus mature acquirers
    - Growth analytics review
  - - Current equity mark
    - Any 2025–2026 secondary or primary price discovery
    - Needed to confirm actual entry context
    - Board / investor relations request
  notes: These are the minimum diligence asks required to turn medium confidence into high confidence.
