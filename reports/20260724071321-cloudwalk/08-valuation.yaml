- id: comparables-and-range-building
  title: Comparables and range building
  body: 'Comparable analysis supports a favorable stance, but only when it is used carefully. Public peers such as Stone and PagSeguro trade at lower revenue multiples because they are larger, slower, and more mature. MercadoLibre and Adyen command richer absolute valuations because they pair payments with broader ecosystems or stronger global enterprise positioning. CloudWalk sits between those poles: it is much smaller and riskier than MercadoLibre or Adyen, but much faster-growing than mature acquirer peers and already profitable in a way that many private fintechs are not. This justifies some premium to mature Brazilian merchant-acquiring multiples, though not an unlimited one. The practical implication is that a 3x revenue multiple on roughly US$990 million of 2025 revenue already yields nearly US$3.0 billion of enterprise value logic, while a more conservative 2x multiple still supports something close to the last disclosed mark. That asymmetry is why the current price context looks
    attractive rather than merely fair. It is not a perfect comp set, but it is good enough to frame entry discipline and upside.'
