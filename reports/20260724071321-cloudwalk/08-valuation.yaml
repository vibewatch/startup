  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding and credit transparency
    missingEvidence: FIDC pricing, covenant triggers, reserve levels, delinquency curves, and vintage loss reporting.
    whyItMatters: These are the key variables separating a cheap-looking multiple from a justified one.
    diligencePath: Request treasury packs, securitization reporting, and risk dashboards.
