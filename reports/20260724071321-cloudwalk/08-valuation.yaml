- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Rows focus on the most relevant public merchant-acquiring or payments-platform peers with readily observable market-cap and revenue context.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - CloudWalk
    - US$2.15B last disclosed valuation on US$497M 2024 revenue
    - ~4.3x 2024 revenue; ~2.2x 2025 revenue
    - Direct subject; profitable high-growth private fintech
    - Valuation mark is dated
  - - StoneCo
    - ~US$2.67B market cap on ~US$2.57B TTM revenue
    - ~1.0x revenue range
    - Brazil merchant-acquiring peer
    - Mature public company with lower growth
  - - PagSeguro
    - ~US$2.64B market cap on ~US$3.84B TTM revenue
    - ~0.7x revenue range
    - Brazil payments peer with large scale
    - Different mix and public-market discount
  - - MercadoLibre / Mercado Pago context
    - ~US$91B market cap on ~US$31.8B TTM revenue
    - ~2.9x revenue range
    - Regional payments and commerce platform benchmark
    - Much broader business model
  - - Nu Holdings
    - ~US$68.5B market cap on ~US$11.9B TTM revenue
    - ~5.8x revenue range
    - Latin American fintech multiple reference
    - Not a pure merchant-acquiring comp
  - - Adyen
    - ~US$28.8B market cap on ~US$3.1B revenue
    - ~9x revenue range
    - High-quality payments platform benchmark
    - Global enterprise processor, not Brazil SMB acquirer
  notes: Multiples are approximate and mix fiscal and TTM references; the point is directional relative valuation, not spreadsheet-level precision.
