company:
  name: CloudWalk
chapter:
  number: 8
  title: Valuation
  summary: 'CloudWalk’s valuation case is compelling because the business combines hypergrowth with real profits at a private-market price that now looks conservative against its own updated scale. At the same time, the recommendation cannot ignore structured-funding dependence, Brazil concentration, and incomplete portfolio disclosure. The correct stance is therefore strong-buy with medium confidence and medium risk: the upside looks attractive at the last disclosed US$2.15 billion valuation, but the call remains contingent on funding-market resilience and better credit transparency.'
sections:
- id: thesis-and-price-context
  title: Thesis and price context
  body: 'The central valuation question is whether CloudWalk’s last broadly cited private valuation still makes sense after the company’s more recent operating results. Public sources indicate CloudWalk reported US$497 million of 2024 revenue and US$63 million of net income, then closed 2025 with US$990 million of revenue, US$110 million of net income, and a US$1.3 billion annualized exit run rate. Against that operating backdrop, the old US$2.15 billion valuation from 2021 looks far less aggressive than it did when originally set. At roughly 4.3x 2024 revenue or about 2.2x 2025 revenue, CloudWalk screens closer to a growth-at-a-reasonable-price fintech than to an overhyped private unicorn. The main caveat is that this is not pure SaaS revenue: funding structure, credit risk, and Brazil concentration must stay inside the multiple discussion. Even so, profitable growth at this scale is rare enough that the valuation debate should start from upside, not from skepticism by default.'
