- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Revenue sustains near or above run-rate trajectory, margins hold, funding remains open
    - 3.5x–4.0x revenue on US$1.0B+ supports US$3.5B–US$4.0B+ value
    - Needs clean credit and refinancing execution
    - Possible if profitability and hypergrowth persist
  - - Base
    - Revenue around US$990M to US$1.3B run-rate with stable margins
    - ~3.0x revenue supports ~US$3.0B–US$3.9B logic
    - Funding and Pix mix remain manageable
    - Most evidence currently points here
  - - Bear
    - Growth slows materially, funding costs rise, or losses surface
    - 1.5x–2.0x revenue supports ~US$1.5B–US$2.0B
    - Credit / funding transparency disappoints
    - Possible if structured-funding engine weakens
  notes: Ranges are scenario heuristics built from public revenue markers and peer multiple context, not management guidance.
