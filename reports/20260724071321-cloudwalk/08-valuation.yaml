    severity: material
    topic: current private valuation mark
    missingEvidence: Any 2025–2026 primary or secondary price discovery beyond the common US$2.15B reference.
    whyItMatters: The recommendation is explicitly price-sensitive. A higher unseen mark could reduce or erase apparent upside.
    diligencePath: Request recent board materials, internal marks, and secondary transaction data.
