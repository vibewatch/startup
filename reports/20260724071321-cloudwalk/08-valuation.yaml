- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Funding stress
    - Failed or sharply more expensive FIDC refinancing
    - Hits growth capacity and valuation multiple
    - Move from strong-buy to hold / track
  - - Credit deterioration
    - Material reserve build or losses outside plan
    - Compresses margin and confidence simultaneously
    - Re-cut scenarios and entry price
  - - Regulatory action
    - Formal BCB restriction or adverse finding
    - Hurts product scope and premium-multiple support
    - Pause investment
  - - Complaint / support deterioration
    - Sustained quality decline across rankings and reviews
    - Weakens retention and cost-to-serve thesis
    - Demand stronger discount
  - - Pix cannibalization
    - Card-margin compression without cross-sell offset
    - Lowers long-term economics
    - Cut terminal multiple
  notes: These triggers turn the anti-thesis into observable post-investment monitoring points.
