    - A materially higher undisclosed recent valuation would narrow upside
  - - Multi-product merchant ecosystem supports attachment and retention
    - Proof that engagement is shallow or wallet share is low would weaken thesis
  - - AI-led efficiency and profitability differentiate CloudWalk from many private peers
    - If AI claims fail to translate into durable margins, premium multiple support falls
  - - Brazil-only concentration keeps risk above top-tier global comps
    - Material U.S. traction or diversification would improve the case
  notes: The anti-thesis focuses on valuation transmission risks rather than disputing that CloudWalk has achieved real scale.
