  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: credit and receivables performance
    missingEvidence: Vintage losses, delinquency, chargebacks, reserve levels, and stress results for major receivables and credit pools.
    whyItMatters: Funding dependence is the highest residual risk, and portfolio deterioration would change the thesis quickly.
    diligencePath: Request full warehouse and securitization reporting packages plus management stress tests.
    relatedQuestionRefs:
    - QR009
    - QR023
    - QR029
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: operational resilience
    missingEvidence: Uptime, incident history, support response times, and fraud-loss trends by channel.
    whyItMatters: Millions of merchants depend on the app daily, but public reliability evidence remains partial.
    diligencePath: Request SLA reports, incident logs, postmortems, and fraud-loss dashboards.
    relatedQuestionRefs:
    - QR014
    - QR019
    - QR027
    - QR029
    relatedTableRefs:
    - TR002
