- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Funding stress
    - FIDC issuance slows materially or rating outlook worsens
    - Any failed refinancing or downgrade to non-strong national scale
    - Pause bullish underwriting and widen valuation discount
  - - Credit deterioration
    - Delinquency / loss curves worsen beyond management plan
    - Meaningful reserve build or impairment spike
    - Re-cut growth and margin assumptions
  - - Regulatory pressure
    - Adverse BCB action or license limitation
    - Formal sanction, product restriction, or rule change hurting economics
    - Treat thesis as impaired until remediation is visible
  - - Service-quality deterioration
    - Complaint ranking worsens or app reviews deteriorate sharply
    - Sustained negative trend over multiple periods
    - Reassess retention and support leverage assumptions
  - - Pix cannibalization
    - Card economics weaken without wallet-share offset
    - Take-rate compression with no compensating cross-sell
    - Reduce long-term margin assumptions
  - - Brazil concentration
    - Macro or policy shock hits SMB demand materially
    - Seller growth stalls while complaint/fraud metrics worsen
    - Move stance toward hold / track
  notes: These kill criteria are intended to turn a broad risk narrative into observable underwriting triggers.
