        title: 融资、资本和资产负债表形态
        blocks:
          - type: paragraph
            body: >-
              资本结构故事几乎和收入故事一样重要。公开来源仍指向累计披露股权融资约 US$365 million、2021 年最后披露私募估值 US$2.15 billion；但最近的规模扩张主要靠应收账款支持的 FIDC
              融资。CloudWalk 2024 年 5 月通过四只 FIDC 募集 R$1.6 billion，2025 年 6 月通过 FIDC Pi 募集 R$3.1415 billion，2025 年 10 月通过
              FIDC Bela 募集 R$4.2 billion，NeoFeed 还报道 2026 年有更大的 R$5.5 billion
              后续发行。这些交易在战略上有吸引力，因为它们避免股权稀释，也匹配应收账款业务；但它们同样把资金管理纪律、抵押品质量和再融资条件变成投资判断的核心。Fitch 的 AA-(bra) 评级和 Positive
              Outlook 有支撑作用，却不能替代完整底层资产组合披露。这个结构对一门应收账款业务在经济上合理，但也意味着资产负债表质量和资本市场通道，应该与软件式收入增长得到同等关注。
