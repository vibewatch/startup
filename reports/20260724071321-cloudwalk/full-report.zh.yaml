      - number: '1.3'
        title: 融资、资本策略与规模
        blocks:
          - type: paragraph
            body: >-
              最重要的资本结构事实是，CloudWalk 的公开故事现在把旧一轮股权估值和更新的结构化信贷机器拼在一起。PRNewswire 和 Sacra 都指向约 $365 million 的累计披露股权融资，以及
              2021 年 11 月 Coatue 领投 Series C 时最后披露的 $2.15 billion 股权估值；此前同年还有 $190 million Series B。此后，公司增长叙事不再主要靠新 VC
              轮次，而是靠盈利能力叠加 FIDC 发行。CloudWalk 2025 年 FIDC Pi 发行募集 R$3.1415 billion，2025 年 10 月 FIDC Bela 发行募集 R$4.2
              billion，NeoFeed 后来报道 2026 年还有规模更大的 R$5.5 billion
              发行。这些结构不稀释股权，却能为商户应收账款提前兑付和营运资金类服务供资；但它们也把资本市场通道和资产组合表现推到投资论证中心。因此，融资质量始终是公司概览里的核心问题。
