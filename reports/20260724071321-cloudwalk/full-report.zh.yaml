  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局结构
        blocks:
          - type: paragraph
            body: >-
              巴西商户服务市场很拥挤，因为产品栈本身已经趋同。Stone 的 IR 材料和主页、PagBank 的公开价格页、Cielo 网站、Getnet 网站和 Rede
              网站，都在营销支付收款、Pix、数字账户或结算工具、应收账款提前兑付或信贷，以及用 App 控制业务的组合。Mercado Pago 把同一套金融服务叠在更宽的商业生态上，Nubank
              则从银行和钱包侧切入商户关系。这意味着 CloudWalk 防守的不是专有支付格式，而是在一个商户默认期待银行卡收款、即时支付、快速结算，以及某种信贷或现金管理的组合里竞争。因此，这个市场最好按层级理解：直接
              SME 收单机构、银行支持的既有收单机构、生态驱动型金融科技，以及相邻或细分市场挑战者。先完成品类映射，才有估值比较的意义。因此商户会不断比价。每天都在比。
