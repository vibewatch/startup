        title: 产品面和客户工作流
        blocks:
          - type: paragraph
            body: >-
              CloudWalk 的产品套件更像商户工作流栈，而不是一排支付小硬件。InfinitePay 的公开页面显示，小企业可以先用 InfiniteTap 或专用 Android
              智能终端做智能手机收款，再通过银行卡、Pix、支付链接、在线结账或周期性账单收款，在免费商业账户里管理资金，然后叠加贷款、收款工具、在线店面和 AI 辅助。公司客户页面也显示，CloudWalk
              向需要更快结算、更低费用、更轻松分期和简单日常现金流管理的商户营销这套套件。工作流框架重要，因为 CloudWalk 不只在设备价格上竞争；它试图让 InfinitePay
              成为商户收款、管理、融资和拉动销售的运营账户。这比纯收单模型创造更多附着点，也让功能宽度成为护城河的一部分。
