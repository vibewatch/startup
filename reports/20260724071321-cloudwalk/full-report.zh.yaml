        - label: 商户服务变现池
          low: 3
          mid: 6
          high: 10
          unit: USD B
          note: 低置信度分析区间，覆盖巴西中小企业收单、账户和商户融资变现。
        - label: CloudWalk 近期 SAM
          low: 1
          mid: 3
