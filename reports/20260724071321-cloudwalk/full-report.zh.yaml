          detail: 商户增加信贷、结账、账单或 AI 帮助。
        - label: 留存
          detail: 服务质量和更低成本帮助维持关系活跃。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU028
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开指标显示，顶部漏斗很大，活跃卖家基数虽然仍不完美，但已经明确达到规模。
    data:
      items:
        - label: 已开账户
          value: 14
          unit: M
        - label: 活跃卖家
          value: 6.3
          unit: M
        - label: 产品组合月活用户
          value: 7
          unit: M+
        - label: 引用发布稿中的多产品用户
          value: 80
          unit: '%'
