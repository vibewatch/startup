      - number: '1.4'
        title: 里程碑、覆盖范围和可复用事实
        blocks:
          - type: paragraph
            body: >-
              作为私有金融科技公司，CloudWalk 的里程碑记录异常密集。公司先披露 2023 年收入 $320.5 million，并在全年首次盈利；随后报告 2024 年收入 $497 million、净利润 $63
              million，2024 年末巴西卖家 3 million。进入 2025 年，公司又叠加基于开放金融的信贷动作、中央银行信贷机构牌照、名为 JIM 的 AI 商户助手、通过 JIM.com
              进入美国，以及越来越大的 FIDC 交易。到 2025 年末和 2026 年初，公司公开称平台上已有超过 6 million 巴西创业者、14 million 个开立账户，Claudio Walker
              让投诉解决自动化率超过 90%，收入 run rate 按披露口径超过 $1.2 billion 至 $1.3 billion。这些事实构成后续章节可以复用的基本事实：CloudWalk
              已经盈利，已经在巴西全国化，并且在扩张信贷和应收账款产品时越来越依赖资本市场。产品、资本和支持界面都已经能看见这种运营宽度。
