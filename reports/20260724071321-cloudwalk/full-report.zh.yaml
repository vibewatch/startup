        title: 收入增长和盈利能力
        blocks:
          - type: paragraph
            body: >-
              审阅的来源包支持 CloudWalk 规模真正上了一个台阶。PRNewswire 报道 2023 年收入 US$320.5 million、净利润 US$22.3
              million，标志着公司首次全年盈利。CloudWalk 的 2024 年业绩发布随后把收入抬升至 US$497 million、净利润抬升至 US$63 million；2026 年 3 月 Business
              Wire 发布则称 2025 年以 US$990 million 收入和 US$110 million 净利润收官。这条曲线重要，因为它说明 CloudWalk 不只是 GMV
              故事，也不是靠风险投资补贴抢客户。它是在快速增长中已经证明盈利为正的业务。因此，两年图景更像盈利性超高速增长，而不是某个反弹年份的一次性表现；不过，公司仍未提供公开市场投资者会期待的审计深度分部披露。
