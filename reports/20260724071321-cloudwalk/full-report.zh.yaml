  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              监管是一阶风险，因为 CloudWalk 现在把收单、账户、信贷、开放金融连接和商户工作流放进一个受监管的巴西金融边界内。公司公开的信贷牌照发布确认，产品范围扩张依赖中央银行许可；Banco Central 关于
              Pix、支付机构和 Open Finance
              的材料也显示，关键平台轨道不是可有可无的工具，而是受监管基础设施。这同时带来上行和风险：监管可以形成进入壁垒，但规则变化、牌照条件、披露预期或处罚也能实质影响产品可用性和经济性。在此之上，InfinitePay
              自身公开 AML 和网络安全政策，确认合规负担真实且持续。CloudWalk
              看起来有能力在这种环境中运营，但投资者应把监管执行视为仍在运行的运营纪律，而不是永远已经打勾的事项。这个姿态可管理，但对一家仍在快速扩宽产品面的公司来说并不轻。
