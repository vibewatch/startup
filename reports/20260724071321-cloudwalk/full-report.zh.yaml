  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义和品类边界
        blocks:
          - type: paragraph
            body: >-
              对 CloudWalk
              来说，正确的市场定义窄于“巴西所有支付”，又宽于“小型刷卡机”。公司参与的赛道包括商户收单、即时支付、数字商业银行、应收账款提前兑付，以及面向微型和小企业的轻量商户软件。因此，全国交易额统计只能作为自上而下的背景层。更有决策价值的切口，是那些需要低摩擦收卡和
              PIX、快速到账、运营商业账户，并偶尔使用营运资金的巴西商户。这个市场存在，是因为巴西传统收单栈长期让小商户等待结算、为应收账款提前兑付支付高抽成率，并依赖更笨重的银行关系。CloudWalk
              的产品包攻击的是工作流和现金流问题，而不只是硬件问题；后续章节应把可服务市场视作建立在支付收款之上的商户操作系统机会。
