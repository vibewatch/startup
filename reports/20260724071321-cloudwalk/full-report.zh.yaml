      - number: '7.3'
        title: 运营、欺诈和依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营风险仍然很大，因为 InfinitePay 服务数百万每天依赖 App、结算轨道和支持运营的小商户。公开证据显示，公司在欺诈控制、支持自动化和安全信息上投入很深，包括专有 AI
              反欺诈主张、反欺诈认证和投诉率领先信息。这些是正面因素，但也说明风控运营对商业模式有多核心。一个同时暴露于智能手机操作系统、Pix 轨道、卡组织、商户设备和 AI
              辅助支持的支付平台，可能因宕机、误报、欺诈漂移、支持质量下降或上游平台政策变化而失效。公司的技术抱负会加深这种暴露：AI 代理、开放金融
              驱动的信贷和自有内部基础设施能创造杠杆，也会放大执行错误的影响半径。公开文档足以确认依赖栈，却不足以排除运营脆弱性。缺少详细公开事故报告，使剩余不确定性仍然较高。
