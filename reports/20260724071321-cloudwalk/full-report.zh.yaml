      - number: '1.2'
        title: 领导层、治理和运营模型
        blocks:
          - type: paragraph
            body: >-
              公开材料把领导层叙事集中在创始人兼 CEO Luis Silva 身上。独立人物报道也称他为董事长，并把他视作公司 AI 原生运营假设的公开面孔。目前来源还点名 Pablo de Mello
              负责运营和融资，Lucas Martinelli 负责信贷实体，Gabriel Bernal 负责客户体验，Fabrício Costa
              负责金融服务。披露最强的治理线索不是董事会层面，而是运营层面：CloudWalk 称自己采用高度智能体化运营模型，软件代理承担大部分客户支持，以及相当一部分工程和 GTM
              工作，因此员工规模相对同业更精简。薄弱处在正式治理披露。审阅的公开材料没有给出清晰的现任董事会名单、委员会结构，或 2021
              年之后除投资人引用外的最新股东控制图，因此治理透明度足以支撑商业尽调，但不足以完成控制权审查。
