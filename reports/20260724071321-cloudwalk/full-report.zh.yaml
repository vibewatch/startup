  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客群分层和买方画像
        blocks:
          - type: paragraph
            body: >-
              来源包持续指向：CloudWalk 服务的是巴西长尾商户经济，而不是集中企业客户册。InfinitePay
              的公开界面反复瞄准微型和小企业、自雇经营者、流动卖家、沙龙、食品摊贩、配送经营者，以及通过私信或轻量在线精品销售的商户。产品设计强化了这一定位：智能手机收款、零费率 Pix、免费开户、支付链接、账单工具和同一
              App 内信贷，都降低了传统银行和老牌收单机构服务不足商户的入驻摩擦。这关系到客户质量，因为模型天然把集中度风险分散到数百万账户；但这也意味着单客平均收入更低，支持、欺诈和
              互动工具必须高效扩展。实践中，CloudWalk 赢的不是少数标杆客户，而是大众市场商户运营模型。
