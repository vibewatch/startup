      - number: '7.2'
        title: 财务和融资风险
        blocks:
          - type: paragraph
            body: >-
              财务上最重要的风险簇围绕融资结构和信贷质量。CloudWalk 的快速增长越来越多靠大型 FIDC 交易融资，而不是新股权；2024、2025 和 2026
              年的多十亿雷亚尔工具把这一策略推到高点。策略有吸引力，因为它减少稀释并匹配应收账款经济性；但它也会制造对抵押品表现、资金成本、投资者胃口、税务处理和再融资通道的依赖。Fitch 的 AA-(bra)
              评级有支撑作用，却不能替代对商户应收账款和信贷群组的损失、准备金或压力表现的直接可见性。同一个问题也适用于 Pix 信贷
              和营运资金扩张：产品可以抬升变现，但资产组合质量恶化可能比表观收入暗示得更快地压缩利润率并关闭资本市场通道。因此，财务论证在当前盈利能力上很强，在下行透明度上较弱。私募投资者需要的是资金管理式尽调，而不只是创业公司式增长分析。
