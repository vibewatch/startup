      - number: '2.4'
        title: 约束和竞争背景
        blocks:
          - type: paragraph
            body: >-
              同一组证据也说明这个市场为什么难。PIX 让商户和消费者习惯接近免费的即时转账，从结构上压缩传统银行卡经济性；Sacra 也明确对比 PIX 与信用卡，指出 PIX
              的商户经济性更低。与此同时，既有机构和挑战者网站现在都在宣传同一张功能清单：免费或低价账户、Pix、链接支付、手机
              POS、信贷和当天现金流工具。这会收窄差异化，把竞争推向授信质量、服务、欺诈控制和混合抽成率。市场规模因此必须谨慎处理。宽泛的全国支付量或成人采用率会夸大 CloudWalk
              真正可变现的切口；狭窄的商户收单定义又会低估交叉销售银行和信贷产品的价值。最好的工作视角是一只漏斗：巴西整体数字支付经济很大，商户服务变现池明显更小，而 CloudWalk 最可信的近期 SAM
              位于数字化服务不足的 SME 内部——这些商户反复使用收款、银行和信贷组合，而不是孤立使用某一项功能。
