              最高风险的相邻竞争者，是那些拥有资产负债表规模或生态锁定、CloudWalk 难以轻易匹配的玩家。MercadoLibre 的市值远高于 CloudWalk，投资者材料显示 Mercado Pago
              同时服务线上和线下商户，并连接更广的消费者和商业生态。Nubank 的市值和收入基础也大得多；如果它继续深入商户支付和 SME 金融工作流，就会成为强大的间接竞争者。Adyen 又不同：按市值看它远大于
              CloudWalk，也在 São Paulo 有布局，但公开姿态更偏企业和全球平台，而不是原生微商户。Vivo Money 和 Claro Pay
              等电信相关金融产品位于赛道边缘；但审阅的公开页面今天看起来更偏消费者或账单相关，还不像规模化商户收单威胁。这些玩家未必以同样方式赢得同一批商户，但仍能重塑商户对价格、产品宽度和信任的预期。
