      - number: '4.2'
        title: 变现和单位经济性
        blocks:
          - type: paragraph
            body: >-
              CloudWalk 的变现已经看得出是多线条，尽管公开分部报告仍偏薄。InfinitePay
              的公开页面和公司发布指向至少四个收入面：银行卡收款的商户折扣率，叠在商户账户里的订阅或工作流变现，应收账款提前兑付和信贷利差，以及账户体验内更新的 AI
              或软件增售机会。因此，表观每卖家收入仍是有用但不完整的单位经济代理指标。按公司披露的收入和卖家数量粗算，2024 到 2025
              年的隐含每卖家收入大致停留在同一宽区间，即便商户基数翻了一倍多；这说明公司并非仅靠压垮变现来买增长。与此同时，公开页面清楚显示，定价带促销、按交易量分层，并依赖出款设置，因此任何简单的 仅 MDR 模型都会低估
              CloudWalk 经济性的复杂度。GTM 上的含义是，CloudWalk 能把获客成本摊到更宽的产品包上；但外部读者仍缺少足够公开数据，无法计算真实
              CAC、回本期或渠道贡献。这会把销售效率推向代理分析，而不是直接测量。
