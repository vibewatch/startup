  - id: FM001
    title: 市场规模判断框架
    type: pyramid
    layout: standard
    summary: 对承销有用的视角，要从巴西庞大的数字支付基础收窄到面向中小企业的、更小的商户操作系统切口。
    data:
      nodes:
        - label: 全国数字支付经济
          detail: 由银行卡、PIX 和钱包驱动的巴西巨大自上而下支付活动背景。
          tone: neutral
        - label: 商户服务变现池
          detail: 收单机构和中小企业金融平台能够捕捉手续费、账户经济性和信贷利差的子集。
          tone: positive
        - label: CloudWalk 近期 SAM
          detail: 数字化服务不足的巴西微型和小型商户，需要支付受理 + 账户 + 现金流工具。
          tone: positive
        - label: 当前 CloudWalk SOM 代理指标
          detail: 用已观察到的收入基础和 >6M 商户足迹，而不是抽象的全国份额说法。
          tone: positive
    approximationNotes: 这是一组判断框架，不是有来源支撑的 TAM-SAM-SOM 瀑布；中间层是基于公司收入、商户数量和市场结构来源推导出的分析构造。
    claimRefs:
      - CM026
      - CM027
      - CM028
      - CM029
  - id: FM002
    title: 市场估算区间
    type: range
    layout: standard
    summary: 只有最窄的商户服务层对 CloudWalk 决策有用；宽口径市场总量会夸大公司近期真实切口。
