      - number: '8.2'
        title: 可比公司和区间搭建
        blocks:
          - type: paragraph
            body: >-
              可比公司分析支持偏正面的立场，但前提是用得谨慎。Stone 和 PagSeguro 等公开同业收入倍数更低，因为它们更大、更慢、更成熟。MercadoLibre 和 Adyen
              的绝对估值更高，因为它们把支付和更宽的生态，或更强的全球企业定位配在一起。CloudWalk 夹在两端之间：它比 MercadoLibre 或 Adyen
              小得多、风险也高得多，但增速远快于成熟收单同业，并且已经盈利，这是许多私有金融科技公司做不到的。这支持它相对成熟巴西商户收单倍数获得一定溢价，但不是无限溢价。实际含义是，对约 US$990 million 的
              2025 年收入套 3x 收入倍数，已经可以推出接近 US$3.0 billion 的企业价值逻辑；即使用更保守的 2x
              倍数，也仍支持接近最后披露估值的水平。这种不对称性解释了为什么当前价格背景看起来有吸引力，而不只是公允。这个可比组并不完美，但足以框定入场纪律和上行空间。
            claimRefs:
              - CV010
