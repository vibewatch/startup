      - number: '2.3'
        title: 市场驱动因素
        blocks:
          - type: paragraph
            body: >-
              三条驱动最突出。第一，数字支付渗透率继续上升；Gitnux 的巴西统计摘要显示，2023 年非现金支付占零售交易的 62%，PIX 成人采用率达到 85%。第二，PIX 自身仍在放量：CEIC
              基于中央银行的数据表明，极大的月度交易量一直延续到 2026 年 6
              月，说明即时支付轨道不是小众行为，而是核心消费习惯。第三，竞争者越来越多地教育市场：银行卡收款、PIX、数字账户、信贷和手机收款应该打包在一起。一旦所有主要玩家都让商户预期当天结算、手机轻触收款、支付链接和账户打包，品类扩张会像利好既有机构一样利好
              CloudWalk 这类挑战者。CloudWalk 的主要利好在于，数字优先分发比依赖网点或地推的传统获客模型更适合碎片化商户。主要警示是，当功能集合趋同，品类增长本身并不保证定价权。
