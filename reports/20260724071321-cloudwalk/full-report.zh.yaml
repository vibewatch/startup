      - number: '2.2'
        title: 买方分层和需求画像
        blocks:
          - type: paragraph
            body: >-
              公开证据持续指向巴西微型和小型商户长尾，它们是主要购买群体。Sacra 明确把 InfinitePay
              的早期切口描述为理发师、街头摊贩、送货司机和其他被传统银行基础设施服务不足的微型创业者。竞争对手主页也强化了这个框架：Stone 按 MEI、自主劳动者、小企业和更大商户划分产品；PagBank
              同时向小商户推广刷卡机和手机收款栈；Getnet 和 Cielo 明确支持 CPF、CNPJ
              用户和远程销售。由此可见，核心买家不是成熟企业司库，而是店主型经营者，他们在意即时结算、低或可预测的费率、简单入驻，以及一个管理销售的统一入口。因此，需求由工作流简单度、信任和现金流缓解驱动。CloudWalk
              的商户数量说明这个买家池已经具备规模；但这也意味着转换成本往往来自运营习惯而非合同，买家仍然价格敏感。
