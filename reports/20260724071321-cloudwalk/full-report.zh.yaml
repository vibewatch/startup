            - 低
            - 低
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU022
      - CU027
  - id: FU004
    title: 留存 / 复购队列可见度
    type: bar
    layout: standard
    summary: 公开信息更容易看清 CloudWalk 的客户广度，正式留存率和队列经济性则模糊得多。
    data:
      items:
        - label: 客户数可见度
          value: 90
          unit: score
        - label: 具名客户证据可见度
          value: 70
          unit: score
        - label: 投诉 / 满意度可见度
          value: 60
          unit: score
        - label: 收入留存可见度
          value: 20
          unit: score
        - label: 流失队列可见度
          value: 10
          unit: score
