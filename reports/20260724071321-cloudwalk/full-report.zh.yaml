        title: 战略竞争和论证破坏点
        blocks:
          - type: paragraph
            body: >-
              战略风险主要在于：当既有机构、银行、交易平台和新支付轨道都在挤压单位经济性时，CloudWalk 能否守住盈利性增长。Mercado Pago、Stone、PagSeguro
              和银行系收单机构拥有更多资本或渠道力量；Pix 继续把活动拉向更便宜的即时支付行为，可能蚕食银行卡 MDR。巴西集中度带来宏观风险，美国扩张仍太早，尚不足以抵消本土暴露。因此，最相关的论证破坏点
              都可监测，而不是抽象概念：任何融资压力上升、投诉恶化、监管行动、欺诈损失，或卖家增长急剧放缓，都可能迅速传导到利润率、估值和信心。CloudWalk
              有真实缓释因素，但风险姿态仍应给中等总体评级，而不是低风险标签。这个平衡解释了本章为什么落在中等风险而不是低风险。投资者需要按月监测。还要盯紧。
