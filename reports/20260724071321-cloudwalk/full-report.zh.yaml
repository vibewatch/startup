      - number: '8.3'
        title: 反向论点和入场纪律
        blocks:
          - type: paragraph
            body: >-
              反向论点并不难讲清楚。CloudWalk 的业务质量看起来很强，但公开证据仍留下几个关键未知数：TPV 结构、信贷损失、准备金充足性，以及对 FIDC 的依赖。如果结构化融资收紧、资产组合表现恶化，或 Pix
              推动卡业务利润率比预期更快压缩，市场就有理由下调倍数。因此，最后披露的 US$2.15 billion
              估值不应被当成无风险便宜货；只有信贷和融资栈通过验证，它才是有吸引力的入场点。入场纪律重要，因为底层融资引擎脆弱时，看似便宜的收入倍数仍可能是陷阱。我们的建议是强烈买入，但置信度是中等而不是高。原因正是：下行情景更多来自披露不足的金融机制，而不是客户或产品动能不足。这正是置信度停在中等的原因。
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
          - type: table
            tableRef: TV005
