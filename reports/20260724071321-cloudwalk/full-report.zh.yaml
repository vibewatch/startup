        - 收入维持在接近或高于年化收入轨迹，利润率守住，融资渠道保持开放
        - US$1.0B+ 收入按 3.5x–4.0x 估值，支撑 US$3.5B–US$4.0B+ 价值
        - 需要信用表现干净、再融资执行到位
        - 如果盈利能力和高增长延续，则有可能
      - - 基准
        - 年化收入在 US$990M 至 US$1.3B 左右，利润率稳定
        - ~3.0x 收入支撑 ~US$3.0B–US$3.9B 逻辑
