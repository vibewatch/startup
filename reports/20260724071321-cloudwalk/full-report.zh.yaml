chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              CloudWalk 将自己定位为一家巴西金融科技公司，围绕 InfinitePay 品牌搭建商户操作系统。审阅的来源包一致把公司放在 São
              Paulo，也呈现出两阶段演进：先是服务巴西收单生态的云原生支付基础设施；再是 2019 年随 InfinitePay 开始直接面向商户。当前产品面比传统银行卡收单机构更宽。InfinitePay
              把银行卡收款、Tap to Pay 和基于智能手机的收款、免费 PIX
              转账、数字账户、在线结账、支付链接、应收账款提前兑付和商户信贷组合在一起。公司和投资人材料反复把目标人群定义为微型和小型创业者：传统银行和既有机构给他们的结算更慢、费率更高，获客也更依赖线下团队。这个点会影响后续尽调章节，因为
              CloudWalk 押注的不是单一硬件 SKU 或单一收费产品，而是一套整合支付、银行、信贷和 AI 工作流的组合，交叉销售杠杆很强。
