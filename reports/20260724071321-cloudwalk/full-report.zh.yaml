figures:
  - id: FO001
    title: CloudWalk 里程碑时间线
    type: timeline
    layout: standard
    summary: 公司在短时间内，从基础设施起点走向商户分发、盈利、AI 拉动的运营杠杆，以及结构化信贷规模。
    data:
      items:
        - date: '2013'
          label: CloudWalk 创立
          detail: 在 São Paulo 创立，目标是升级巴西支付基础设施。
          tone: neutral
        - date: '2019'
          label: InfinitePay 上线
          detail: CloudWalk 通过 InfinitePay 直接触达商户。
          tone: positive
        - date: 2024-02
          label: 2023 年盈利能力披露
          detail: 收入达到 US$320.5M，净利润 US$22.3M。
          tone: positive
        - date: 2025-02
          label: 2024 年业绩披露
          detail: 收入升至 US$497M，净利润升至 US$63M。
          tone: positive
        - date: 2025-06
          label: 信贷牌照与 FIDC Pi
          detail: 央行授权扩大信贷自主权；FIDC Pi 融资 R$3.1415B。
          tone: positive
        - date: 2025-09
          label: 年化收入 US$1.2B
          detail: 公司称年化收入超过 US$1.2B，年化净利润达到 US$128M。
          tone: positive
        - date: 2025-10
          label: FIDC Bela 融资 R$4.2B
          detail: CloudWalk 为其平台创下新的结构化信贷纪录。
          tone: positive
        - date: 2026-03
          label: US$1.3B 年化收入
          detail: Business Wire 称，2025 年以 US$1.3B 年化收入和 6.3M 卖家收官。
          tone: positive
    claimRefs:
      - CO001
      - CO004
      - CO006
      - CO009
      - CO014
      - CO016
      - CO022
      - CO023
  - id: FO002
    title: CloudWalk 业务流
    type: flow
    layout: wide
    summary: CloudWalk 变现的是一整套商户栈，而不是单一终端或单一费流。
    data:
      nodes:
        - id: merchant
          label: 微型和小型商户
          detail: InfinitePay 在巴西的主要客户群。
        - id: acceptance
          label: 支付受理
          detail: 刷卡机、Tap to Pay、PIX、支付链接和结账页把销售转成交易量。
        - id: account
          label: 数字账户
          detail: 清算、余额、银行卡和现金管理留在平台内。
        - id: credit
          label: 信贷与应收账款
          detail: 应收账款预支和营运资金类产品加深变现。
        - id: ai
          label: AI 智能体与自动化
          detail: 智能体支撑销售、服务、欺诈和商户工作流。
        - id: funding
          label: FIDC 与资金部融资
          detail: 结构化信贷为应收账款和商户信贷运营提供资金。
      edges:
        - from: merchant
          to: acceptance
          label: 使用
        - from: acceptance
          to: account
          label: 结算到
        - from: account
          to: credit
          label: 生成承销和现金流数据
        - from: ai
          to: merchant
          label: 支撑服务和增长
        - from: ai
          to: credit
          label: 改善评分和欺诈控制
        - from: funding
          to: credit
          label: 提供资金
    claimRefs:
