    claimRefs:
      - CU009
      - CU018
      - CU024
      - CU030
      - CU031
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: CloudWalk 的主要剩余风险集中在监管、资金依赖，以及欺诈 / 信贷传导上。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 监管 / 牌照变化
          values:
            - 中
            - 高
            - 中
            - 高
        - label: FIDC / 资金压力
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 信贷损失恶化
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 欺诈 / 拒付率漂移
          values:
            - 中-高
            - 高
            - 中
            - 高
        - label: Pix 蚕食
          values:
            - 中
            - 中-高
            - 中
            - 中-高
        - label: 巴西集中度
          values:
            - 高
            - 中-高
            - 低-中
            - 中-高
    claimRefs:
      - CR001
      - CR010
      - CR018
      - CR020
      - CR031
      - CR034
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多项风险会沿共同路径传导到利润率、增长、融资渠道和估值。
    data:
      nodes:
        - id: reg
          label: 监管 / 牌照
        - id: fund
          label: FIDC 融资条件
        - id: credit
          label: 信贷表现
        - id: fraud
          label: 欺诈 / 投诉
        - id: pix
          label: Pix 驱动组合变化
        - id: margin
          label: 利润率与现金生成
        - id: growth
          label: 卖家增长与留存
        - id: valuation
          label: 估值与信心
      edges:
        - from: reg
          to: growth
          label: 功能可用性
        - from: fund
          to: credit
          label: 能力与成本
        - from: credit
          to: margin
          label: 损失
        - from: fraud
          to: growth
          label: 信任与支持成本
        - from: pix
          to: margin
          label: 抽成率压力
        - from: margin
          to: valuation
          label: 倍数支撑
        - from: growth
          to: valuation
          label: 投资逻辑耐久性
    claimRefs:
      - CR010
      - CR012
      - CR018
      - CR020
      - CR030
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: CloudWalk 同时依赖监管方、资金市场、设备、支付轨道和内部平台执行。
    data:
      nodes:
        - id: bcb
          label: BCB / 牌照
        - id: pix
          label: Pix 支付轨道
        - id: capital
          label: FIDC 投资者
        - id: apple
          label: Apple / iPhone
        - id: android
          label: Android 生态
        - id: ai
          label: AI 与基础设施团队
        - id: merchant
          label: 商户体验
      edges:
        - from: bcb
          to: merchant
          label: 受监管产品
        - from: pix
          to: merchant
          label: 支付行为
        - from: capital
          to: merchant
          label: 信贷供给能力
        - from: apple
          to: merchant
          label: 触碰支付覆盖
        - from: android
          to: merchant
          label: 设备覆盖
        - from: ai
          to: merchant
          label: 支持与自动化质量
    claimRefs:
      - CR003
      - CR012
      - CR021
      - CR022
      - CR027
      - CR028
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资建议来自盈利增长和有利的定价背景，但资金与信贷透明度风险压低了信心。
    data:
      nodes:
        - id: scale
          label: 规模与增长
          detail: 2024 年收入 US$497M，2025 年收入 US$990M，年化收入 US$1.3B。
        - id: profit
          label: 盈利能力
          detail: 2024 年净利润 US$63M，2025 年净利润 US$110M。
        - id: price
          label: 入场估值
          detail: 最近披露估值为 US$2.15B。
        - id: risk
          label: 资金与信贷风险
          detail: 依赖 FIDC，组合披露有限。
        - id: comp
          label: 同业对照
          detail: 估值低于高增长溢价平台，高于成熟收单机构。
        - id: call
          label: 强烈买入 / 中等信心
          detail: 若资金栈核查通过，标的有吸引力。
      edges:
        - from: scale
          to: call
          label: 支撑
        - from: profit
          to: call
          label: 支撑
        - from: price
          to: call
          label: 支撑
        - from: risk
          to: call
          label: 限制信心
        - from: comp
          to: call
          label: 支撑
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV020
      - CV029
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 简单按收入倍数测算，多数非悲观情景下，相比最近披露估值仍有上行空间。
    data:
      items:
        - label: US$990M 收入 × 2.0x
          value: 1.98
          unit: USD B
        - label: US$990M 收入 × 2.2x
          value: 2.18
          unit: USD B
        - label: US$990M 收入 × 3.0x
          value: 2.97
          unit: USD B
        - label: US$1.3B 年化收入 × 3.0x
          value: 3.9
          unit: USD B
        - label: US$1.3B 年化收入 × 4.0x
          value: 5.2
          unit: USD B
    claimRefs:
      - CV006
      - CV007
      - CV015
      - CV016
      - CV017
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据能支撑一个有意义的估值区间；最近披露估值落在合理结果的中低段。
    data:
      items:
        - label: 悲观估值
          low: 1.5
          mid: 1.8
          high: 2
          unit: USD B
          note: 资金或信贷压力会把倍数压到收入的 1.5x–2.0x。
        - label: 当前估值背景
          low: 2.15
          mid: 2.15
          high: 2.15
          unit: USD B
          note: 最近被广泛引用的私有市场估值。
        - label: 基准估值
          low: 2.7
          mid: 3
          high: 3.4
          unit: USD B
          note: 按 2025 年规模，约为收入的 2.7x–3.4x。
        - label: 乐观估值
          low: 3.5
          mid: 4
          high: 5.2
          unit: USD B
          note: 按 2025 年末年化规模，可支撑更高倍数。
    claimRefs:
      - CV006
      - CV015
      - CV016
      - CV017
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: CloudWalk 在经济性和增长上得分最高，主要约束是风险与证据透明度。
