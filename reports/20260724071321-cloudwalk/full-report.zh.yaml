      - CU010
      - CU014
      - CU029
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 具名商户证明在覆盖宽度和工作流相关性上较强，但经审计的长期结果深度较弱。
    data:
      columns:
        - 具名商户
        - 具体结果
        - 独立佐证
        - 留存可见度
      rows:
        - label: Elemovi / Maurício 案例
          values:
            - 是
            - 中
            - 低
            - 低
        - label: Galantes Móveis / Layla Lima 案例
