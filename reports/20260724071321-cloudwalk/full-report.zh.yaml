  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论证和价格背景
        blocks:
          - type: paragraph
            body: >-
              核心估值问题是：在公司近期运营结果之后，CloudWalk 最后一次被广泛引用的私募估值是否仍然合理。公开来源显示，CloudWalk 2024 年收入 US$497 million、净利润 US$63
              million；2025 年收入 US$990 million、净利润 US$110 million，年化退出 run rate 为 US$1.3 billion。放在这组运营背景下，2021 年 US$2.15
              billion 的旧估值，看起来远没有当初设定时那么激进。按 2024 年收入约 4.3x、按 2025 年收入约 2.2x 计算，CloudWalk
              更像一家合理价格下增长的金融科技公司，而不是被过度炒作的私有独角兽。主要保留项是，这不是纯 SaaS
              收入：融资结构、信贷风险和巴西集中度必须放在倍数讨论里。即便如此，这种规模下的盈利增长足够稀缺，估值讨论应从上行开始，而不是默认怀疑。
            claimRefs:
