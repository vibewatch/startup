              - CV024
              - CV026
      - number: '8.4'
        title: 最终结论和尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合来看，CloudWalk 值得给出强烈买入建议，置信度中等、风险中等，估值立场有吸引力。盈利增长、广泛商户触达、多产品深度，以及仍停留在较早时间点的私募估值锚点，合起来构成有利的风险回报。若管理层披露更清晰的
              TPV、抽佣率、资金成本和资产组合表现数据，建议会进一步增强；若再融资压力或信贷恶化浮现，建议会削弱。因此，投资者应把 CloudWalk
              当作一家高质量但仍部分不透明的金融科技公司来做投资假设，而不是当成风险已经出清的公开市场复利型公司。即便如此，正面判断仍然成立，因为隐含入场倍数给执行滑坡留下空间；如果公司继续向 US$1.3 billion
              年化收入基数扩张、甚至超过这一水平，也给倍数扩张留下空间。换句话说：价格足够有吸引力，投资者不需要完美执行也能赢。要跑赢并不容易，但也不脱离现实。
