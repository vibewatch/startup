              组合线下和线上商业工具，SumUp 则继续锚定低价移动 POS 和 SME 简单性。Mercado Pago 是直接组里的异类，因为它的生态触达和母公司支持让它比纯收单机构更大、更多元，尽管面向商户的产品面与
