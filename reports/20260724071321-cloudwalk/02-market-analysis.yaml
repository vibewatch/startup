chapter:
  number: 2
  title: Market Analysis
  summary: CloudWalk sells into a Brazilian payments market that has already shifted decisively toward digital and instant rails, but still leaves meaningful room for SME-focused merchant-acquiring, cash-flow, and automation products. The key market fact is not just that PIX is huge; it is that every serious competitor now bundles acquiring, banking, and working-capital features, so CloudWalk’s market opportunity depends on combining low-friction distribution, merchant economics, and AI-led operating leverage better than peers.
sections:
- id: market-definition
  title: Market definition and category boundaries
  body: The right market definition for CloudWalk is narrower than “all payments in Brazil” and broader than “small card machines.” The company competes in merchant acquiring, instant payments, digital business banking, receivables anticipation, and lightweight merchant software for micro and small businesses. That means national transaction-value statistics matter only as a top-down context layer. The more decision-useful wedge is the subset of Brazilian merchants that need a low-friction way to accept cards and PIX, receive funds quickly, run a business account, and occasionally tap working capital. This market exists because Brazil’s legacy acquiring stack historically forced smaller merchants to wait for settlement, pay high take rates to advance receivables, and rely on more cumbersome bank relationships. CloudWalk’s product bundle therefore attacks a workflow and cash-flow problem, not just a hardware problem, and later chapters should treat the addressable market as a merchant operating
    system opportunity built on payment acceptance.
  claimRefs:
