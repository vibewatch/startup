  evidenceGaps:
  - type: missing-source
    severity: material
    topic: TM002 market sizing
    missingEvidence: A primary or high-quality independent dataset mapping Brazilian SME acquiring and merchant-finance revenue pools directly to CloudWalk’s category boundaries.
    whyItMatters: Without a better source, TAM and SAM estimates remain analytical ranges rather than hard market facts.
    diligencePath: Pull Abecs, Central Bank, and leading public-company segment disclosures to build a bottom-up Brazilian SME merchant monetization model.
    relatedQuestionRefs:
    - QM021
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: SME count
    missingEvidence: A current primary-source count of the Brazilian SME and micro-merchant base relevant to CloudWalk’s product set.
    whyItMatters: Buyer-pool size drives SAM assumptions and acquisition-cost expectations.
    diligencePath: Use Brazil statistical agency and Ministry of Economy datasets to map MEIs and active SMEs by category.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: active usage
    missingEvidence: Monthly active seller data and multi-product attachment rates for CloudWalk’s merchant base.
    whyItMatters: Registered merchants do not equal active monetized merchants, which affects true SOM calculations.
    diligencePath: Request active-seller, transacting-seller, and multi-product-attachment cohort data from management.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: minor
    topic: price elasticity
    missingEvidence: Win-loss and churn data showing how micro-merchants trade off price, service, and feature breadth.
    whyItMatters: Feature convergence means pricing power cannot be inferred from product pages alone.
    diligencePath: Request acquisition-channel and churn-by-pricing-plan analysis from management.
    relatedQuestionRefs:
    - QM025
