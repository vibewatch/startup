- id: constraints-and-competitive-context
  title: Constraints and competitive context
  body: 'The same evidence pack also shows why this market is hard. PIX structurally compresses traditional card economics by familiarizing merchants and consumers with near-free instant transfers, and Sacra explicitly contrasts PIX’s lower merchant economics with credit cards. At the same time, incumbent and challenger sites now advertise the same broad checklist of features: free or cheap accounts, Pix, link payments, cellphone POS, credit, and same-day cash-flow tools. That narrows differentiation and pushes competition toward underwriting quality, service, fraud control, and blended take rate. Market sizing therefore has to be handled carefully. Broad national payment-volume or adult-adoption numbers overstate CloudWalk’s real monetizable wedge, while narrow merchant-acquiring definitions understate the value of cross-sold banking and credit products. The best working view is a funnel: Brazil’s total digital-payment economy is enormous, the merchant-services monetization pool is meaningfully
    smaller, and CloudWalk’s most credible near-term SAM sits inside digitally underserved SMEs that repeatedly use acceptance plus banking plus credit rather than any one feature in isolation.'
