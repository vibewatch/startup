- id: growth-drivers
  title: Market drivers
  body: 'Three drivers stand out. First, digital-payment penetration keeps climbing, with Gitnux’s Brazil statistics summary putting non-cash payments at 62% of retail transactions in 2023 and PIX adoption at 85% of adults. Second, PIX itself keeps scaling: CEIC’s Central Bank-derived data shows very large monthly transaction volumes persisting into June 2026, confirming that instant rails are not a niche behavior but a central consumer habit. Third, competitors increasingly educate the market that card acceptance, PIX, digital accounts, credit, and phone-based acceptance belong together. Once every major player teaches the merchant to expect same-day settlement, tap-to-phone, payment links, and bundled accounts, category expansion benefits challengers like CloudWalk as much as incumbents. The main positive for CloudWalk is that digital-first distribution fits fragmented merchants better than branch- or field-heavy legacy acquisition models. The main caution is that category growth alone
    does not guarantee pricing power when the feature set is converging.'
  claimRefs:
  - CM001
  - CM002
