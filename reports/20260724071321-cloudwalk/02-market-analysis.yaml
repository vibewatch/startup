callouts:
- calloutType: insight
  title: PIX is both a market-expansion engine and a margin-compression force
  body: Instant payments reduce friction for merchants and consumers, which expands digital behavior overall, but they also reset expectations around price and speed. CloudWalk wins if it turns PIX-led engagement into higher-value account, credit, and software monetization instead of defending card economics alone.
  claimRefs:
  - CM002
  - CM003
  - CM023
  - CM024
- calloutType: risk
  title: Basic acceptance features have become table stakes across Brazil’s merchant-acquiring field
  body: Stone, PagBank, Cielo, Getnet, Rede, SumUp, and CloudWalk all publicly market variants of card machines, phone-based acceptance, PIX, links, accounts, and cash-flow tools. That means category growth is real, but differentiation must increasingly come from blended economics, underwriting, support, and automation rather than feature checklists.
  claimRefs:
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM018
