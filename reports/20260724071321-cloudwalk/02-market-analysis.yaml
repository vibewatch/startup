- id: TM003
  title: Segment / buyer map
  columns:
  - Buyer segment
  - Primary need
  - Why CloudWalk can fit
  - Decision trigger
  - Constraint
  rows:
  - - MEI / solo operator
    - Accept payments fast and cheaply
    - Phone-based acceptance, PIX, and integrated account reduce setup friction
    - Need to start selling immediately
    - Very high fee sensitivity
  - - Small physical merchant
    - Cash-flow visibility and same-day settlement
    - Acquiring plus account plus anticipation solve daily liquidity issues
    - Wants predictable next-day or instant access to funds
    - Switching frictions if incumbent support is entrenched
  - - Remote / social-commerce seller
    - Payment links, QR, and checkout without building a store
    - Link and checkout tools reduce need for full e-commerce stack
    - Needs to sell over WhatsApp and links quickly
    - Can multi-home across providers
  - - Growing SME
    - Credit and back-office simplification
    - Bundled banking, billing, and working capital deepen attachment
    - Looks for lower blended financial-admin burden
    - May compare multiple offers on price
  - - Larger multi-site merchant
    - Integrated management and broader service surface
    - CloudWalk can serve but is less obviously differentiated here than in the long tail
    - Needs scale and controls
    - Incumbents and larger peers have stronger enterprise credibility
  notes: The strongest public fit remains the long tail of Brazilian owner-operated or lightly staffed merchants rather than large formal enterprises.
