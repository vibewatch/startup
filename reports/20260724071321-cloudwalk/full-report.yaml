      - number: '4.3'
        title: Funding, capital, and balance-sheet shape
        blocks:
          - type: paragraph
            body: >-
              The capital-structure story matters almost as much as the revenue story. Public sources still point to
              roughly US$365 million of lifetime disclosed equity funding and a last disclosed private valuation of
              US$2.15 billion from 2021, but more recent scale has been financed primarily through receivables-backed
              FIDCs. CloudWalk raised R$1.6 billion through four FIDCs in May 2024, R$3.1415 billion through FIDC Pi in
              June 2025, R$4.2 billion through FIDC Bela in October 2025, and NeoFeed reported a still larger R$5.5
              billion follow-on issuance in 2026. Those deals are strategically attractive because they avoid equity
              dilution and match the receivables business, but they also make treasury discipline, collateral quality,
              and refinancing conditions core to the underwriting case. Fitch’s AA-(bra) rating with Positive Outlook is
              supportive, yet it is not a substitute for full underlying portfolio disclosure. The structure is
              economically rational for a receivables business, yet it also means that balance-sheet quality and
              capital-market access deserve the same attention as software-style revenue growth.
