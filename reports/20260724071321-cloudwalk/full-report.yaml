          - type: callout
            title: Basic acceptance features have become table stakes across Brazil’s merchant-acquiring field
            body: >-
              Stone, PagBank, Cielo, Getnet, Rede, SumUp, and CloudWalk all publicly market variants of card machines,
              phone-based acceptance, PIX, links, accounts, and cash-flow tools. That means category growth is real, but
              differentiation must increasingly come from blended economics, underwriting, support, and automation
              rather than feature checklists.
