  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and category boundaries
        blocks:
          - type: paragraph
            body: >-
              The right market definition for CloudWalk is narrower than “all payments in Brazil” and broader than
              “small card machines.” The company competes in merchant acquiring, instant payments, digital business
              banking, receivables anticipation, and lightweight merchant software for micro and small businesses. That
              means national transaction-value statistics matter only as a top-down context layer. The more
              decision-useful wedge is the subset of Brazilian merchants that need a low-friction way to accept cards
              and PIX, receive funds quickly, run a business account, and occasionally tap working capital. This market
              exists because Brazil’s legacy acquiring stack historically forced smaller merchants to wait for
              settlement, pay high take rates to advance receivables, and rely on more cumbersome bank relationships.
              CloudWalk’s product bundle therefore attacks a workflow and cash-flow problem, not just a hardware
              problem, and later chapters should treat the addressable market as a merchant operating system opportunity
              built on payment acceptance.
            claimRefs:
