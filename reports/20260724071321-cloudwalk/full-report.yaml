      - number: '3.4'
        title: CloudWalk relative position
        blocks:
          - type: paragraph
            body: >-
              CloudWalk’s relative edge is not that it has no competition; it is that it approaches the same crowded
              category with unusually high automation, fast product iteration, and a merchant bundle tuned for Brazil’s
              long tail. Against Stone and PagSeguro, CloudWalk looks leaner and more digital-first. Against Cielo,
              Rede, and Getnet, it looks more software-native. Against Mercado Pago and Nubank, it looks smaller but
              often more focused on the merchant operating workflow itself. Against Adyen, it looks less global and less
              enterprise-oriented but potentially more specialized in Brazilian micro and small business pain points.
              The practical underwriting question is therefore not whether there are competitors, but whether CloudWalk
              can preserve better economics and service quality in a market where baseline features are commoditizing
              quickly. Put differently, the strategic contest is less about discovering rivals and more about
              determining which rival set can most easily copy CloudWalk’s bundle while funding lower merchant pricing
              for longer.
            claimRefs:
