  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Revenue expansion appears to come from a mix of merchant growth, cross-sell, and credit/receivables monetization
      rather than a single take-rate driver.
    data:
      nodes:
        - id: merchant-base
          label: Merchant base growth
          detail: 1M+ customers in 2023, 3M sellers in 2024, 6.3M+ sellers in 2025.
        - id: acceptance
          label: Payment acceptance revenue
          detail: Card acceptance and payout-related monetization.
        - id: account
          label: Account and workflow attachment
          detail: Accounts, links, checkout, collections, and app engagement deepen monetization.
        - id: credit
          label: Credit and receivables monetization
          detail: Credit and anticipation products lift revenue per active merchant.
        - id: ai
          label: AI-led efficiency
          detail: Automation supports profitability rather than only top-line growth.
        - id: reported
          label: Reported revenue and profit
          detail: US$320.5M in 2023, US$497M in 2024, US$990M in 2025.
      edges:
        - from: merchant-base
          to: acceptance
          label: drives volume
        - from: acceptance
          to: account
          label: creates wallet opportunity
        - from: account
          to: credit
          label: creates underwriting data
        - from: credit
          to: reported
          label: adds monetization
        - from: ai
          to: reported
          label: supports margin
        - from: acceptance
          to: reported
          label: core revenue
    claimRefs:
