      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: CloudWalk is one of the few private fintechs pairing hypergrowth with public evidence of profit
            body: >-
              That combination justifies a more constructive valuation stance than would be warranted for a
              still-lossmaking payments startup at similar scale.
            calloutType: strength
            claimRefs:
