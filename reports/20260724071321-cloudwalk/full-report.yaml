        title: Exhibits
        blocks:
          - type: callout
            title: PIX is both a market-expansion engine and a margin-compression force
            body: >-
              Instant payments reduce friction for merchants and consumers, which expands digital behavior overall, but
              they also reset expectations around price and speed. CloudWalk wins if it turns PIX-led engagement into
              higher-value account, credit, and software monetization instead of defending card economics alone.
