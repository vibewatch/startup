  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive field structure
        blocks:
          - type: paragraph
            body: >-
              The Brazilian merchant-services field is crowded because the product stack itself has converged. Stone’s
              IR materials and homepage, PagBank’s public pricing pages, Cielo’s site, Getnet’s site, and Rede’s site
              all market combinations of payment acceptance, Pix, digital accounts or settlement tools, receivables
              anticipation or credit, and app-led control of the business. Mercado Pago layers the same financial
              services onto a broader commerce ecosystem, while Nubank attacks the banking and wallet side of the
              merchant relationship. This means CloudWalk is not defending a proprietary payments format so much as
              competing inside a bundle where the merchant expects card acceptance, instant payments, fast settlement,
              and some version of credit or cash management by default. The field is therefore best understood in tiers:
              direct SME acquirers, incumbent bank-backed acquirers, ecosystem-led fintechs, and adjacent or
              segment-specific challengers. That makes category mapping essential before any valuation comparison is
              attempted. Merchants therefore comparison-shop constantly. Daily.
