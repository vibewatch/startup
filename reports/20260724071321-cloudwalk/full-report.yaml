            body: >-
              Strategic risk is mostly about whether CloudWalk can preserve profitable growth in a market where
              incumbents, banks, marketplaces, and new payment rails all pressure unit economics. Mercado Pago, Stone,
              PagSeguro, and bank-owned acquirers have more capital or channel strength, while Pix continues to pull
              activity toward cheaper instant-payment behavior that can cannibalize card MDR. Brazil concentration adds
              macro risk, and U.S. expansion is still early enough that it does not offset the domestic exposure. The
              most relevant thesis-breakers are therefore monitorable rather than abstract: any visible increase in
              funding stress, complaint deterioration, regulatory action, fraud losses, or sharp slowdown in seller
              growth would propagate quickly into margin, valuation, and confidence. CloudWalk has real mitigations, but
              the risk posture still warrants a medium overall rating rather than a low-risk label. That balance is why
              the chapter lands on medium risk instead of low risk. Investors should monitor it monthly. Closely.
