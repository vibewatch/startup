  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              CloudWalk’s product suite is best understood as a merchant workflow stack rather than a payments gadget
              lineup. InfinitePay’s public pages show that a small business can start with smartphone acceptance via
              InfiniteTap or a dedicated Android smart terminal, collect money through card, Pix, payment links,
              checkout, or recurring billing, manage funds inside a free business account, and then layer on lending,
              collection tooling, online storefronts, and AI assistance. The company’s customer page also demonstrates
              that CloudWalk markets this suite to merchants that need faster settlement, lower fees, easier
              installments, and simple day-to-day cash-flow management. That workflow framing matters because CloudWalk
              is not competing only on device price; it is trying to make InfinitePay the operating account through
              which a merchant accepts, manages, finances, and grows sales. This creates more attachment points than a
              pure acquirer model and makes feature breadth part of the moat.
