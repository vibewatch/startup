      - number: '3.3'
        title: Adjacent and balance-sheet threats
        blocks:
          - type: paragraph
            body: >-
              The highest-risk adjacent competitors are those with either balance-sheet scale or ecosystem lock-in that
              CloudWalk cannot easily match. MercadoLibre’s market capitalization dwarfs CloudWalk’s and its investor
              materials show Mercado Pago serving both online and offline merchants with broader consumer and commerce
              links. Nubank’s market value and revenue base are also dramatically larger, making it a powerful indirect
              competitor if it keeps moving deeper into merchant payments and SME financial workflows. Adyen is
              different again: it is far larger than CloudWalk by market value and has a São Paulo presence, but its
              public posture is more enterprise and global-platform oriented than micro-merchant native. Telecom-linked
              financial products such as Vivo Money and Claro Pay sit at the edge of the field, but the reviewed public
              pages look more consumer or billing-adjacent than like scaled merchant-acquiring threats today. Those
              players may not win the same merchants in the same way, but they can still reshape expectations on price,
              product breadth, and trust.
            claimRefs:
