      - number: '2.2'
        title: Buyer segments and demand profile
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently points to the long tail of Brazilian micro and small merchants as the primary
              buyer pool. Sacra explicitly frames InfinitePay’s early wedge as hairdressers, street vendors, delivery
              drivers, and other micro-entrepreneurs underserved by legacy banking infrastructure. Competitor homepages
              reinforce that framing: Stone segments products across MEIs, autonomous workers, small businesses, and
              larger merchants; PagBank markets both machines and a phone-based acceptance stack to small merchants;
              Getnet and Cielo explicitly support CPF and CNPJ users plus remote selling. The implication is that the
              core buyer is not a sophisticated enterprise treasurer but an owner-operator who cares about immediate
              settlement, low or predictable rates, easy onboarding, and one place to manage sales. Demand is therefore
              driven by workflow simplicity, trust, and cash-flow relief. CloudWalk’s merchant count shows that this
              buyer pool is real at scale, but it also means switching costs are often operational rather than
              contractual, and buyers remain price-sensitive.
