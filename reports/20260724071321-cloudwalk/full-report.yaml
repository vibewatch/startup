        title: Operational, fraud, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk remains substantial because InfinitePay serves millions of small merchants who rely on
              the app, settlement rails, and support operations every day. Public evidence shows strong investment in
              fraud controls, support automation, and security messaging, including proprietary AI fraud claims, a
              fraud-prevention certification, and complaint-rate leadership messaging. Those are positives, but they
              also reveal how central risk operations are to the business model. A payments platform exposed to
              smartphone operating systems, Pix rails, card networks, merchant devices, and AI-assisted support can fail
              through outages, false positives, fraud drift, support degradation, or policy changes by upstream
              platforms. The company’s technical ambition deepens this exposure: AI agents, open-finance-driven credit,
              and internal infrastructure ownership can create leverage, but also raise the blast radius of execution
              mistakes. Public documentation is sufficient to confirm the dependency stack, not sufficient to dismiss
              operational fragility. The absence of detailed public incident reporting keeps residual uncertainty
              elevated.
