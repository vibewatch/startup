  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue growth and profitability
        blocks:
          - type: paragraph
            body: >-
              The reviewed source pack supports a genuine step-change in CloudWalk’s scale. PRNewswire reported US$320.5
              million of revenue and US$22.3 million of net income for 2023, marking the first full year of
              profitability. CloudWalk’s 2024 results release then lifted revenue to US$497 million and net income to
              US$63 million, while the March 2026 Business Wire release said 2025 closed with US$990 million of revenue
              and US$110 million of net income. That progression is important because it means CloudWalk is not simply a
              GMV story or a venture-subsidized customer land grab. It is a business that has already shown positive
              earnings while growing rapidly. The resulting two-year pattern looks like profitable hypergrowth rather
              than a one-off rebound year, although the company still does not provide the audit-depth segment
              disclosure that a public-market investor would expect.
            claimRefs:
