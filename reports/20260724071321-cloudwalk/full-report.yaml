  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulation is a first-order risk because CloudWalk now combines acquiring, accounts, credit, open-finance
              connectivity, and merchant workflow inside a regulated Brazilian financial perimeter. The company’s public
              credit-license release confirms that expanding product scope depends on Central Bank permissions, while
              Banco Central materials on Pix, payment institutions, and Open Finance show that key platform rails are
              not optional utilities but supervised infrastructures. This raises both upside and risk: regulation can
              create barriers to entry, but it also means rule changes, licensing conditions, disclosure expectations,
              or sanctions can materially affect product availability and economics. On top of that, InfinitePay’s own
              public AML and cyber-security policies confirm the compliance burden is real and continuous. CloudWalk
              looks capable of operating in this environment, but investors should treat regulatory execution as a live
              operating discipline, not a box already checked forever. That is a manageable posture, but not a trivial
              one for a company still expanding product breadth quickly.
            claimRefs:
