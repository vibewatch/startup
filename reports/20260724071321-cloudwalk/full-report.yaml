            title: The highest residual risk is funding and portfolio transparency, not lack of growth
            body: >-
              CloudWalk has already shown strong top-line and profitability, but large FIDC dependence means investors
              still need better visibility into collateral quality, loss curves, and refinancing resilience.
            calloutType: risk
            claimRefs:
              - CR010
              - CR012
              - CR013
              - CR015
              - CR018
          - type: callout
            title: CloudWalk has more mitigation evidence than many private fintechs
            body: >-
              Profitability, repeated capital-market access, a positive Fitch outlook, public security policies, and
              fraud-control investment all reduce the chance that a single operational issue becomes existential.
            calloutType: strength
            claimRefs:
              - CR011
              - CR014
              - CR022
              - CR023
              - CR024
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and price context
        blocks:
          - type: paragraph
            body: >-
              The central valuation question is whether CloudWalk’s last broadly cited private valuation still makes
              sense after the company’s more recent operating results. Public sources indicate CloudWalk reported US$497
              million of 2024 revenue and US$63 million of net income, then closed 2025 with US$990 million of revenue,
              US$110 million of net income, and a US$1.3 billion annualized exit run rate. Against that operating
              backdrop, the old US$2.15 billion valuation from 2021 looks far less aggressive than it did when
              originally set. At roughly 4.3x 2024 revenue or about 2.2x 2025 revenue, CloudWalk screens closer to a
              growth-at-a-reasonable-price fintech than to an overhyped private unicorn. The main caveat is that this is
              not pure SaaS revenue: funding structure, credit risk, and Brazil concentration must stay inside the
              multiple discussion. Even so, profitable growth at this scale is rare enough that the valuation debate
              should start from upside, not from skepticism by default.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV020
              - CV021
              - CV022
              - CV025
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV020
              - CV029
      - number: '8.2'
        title: Comparables and range building
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis supports a favorable stance, but only when it is used carefully. Public peers such as
              Stone and PagSeguro trade at lower revenue multiples because they are larger, slower, and more mature.
              MercadoLibre and Adyen command richer absolute valuations because they pair payments with broader
              ecosystems or stronger global enterprise positioning. CloudWalk sits between those poles: it is much
              smaller and riskier than MercadoLibre or Adyen, but much faster-growing than mature acquirer peers and
              already profitable in a way that many private fintechs are not. This justifies some premium to mature
              Brazilian merchant-acquiring multiples, though not an unlimited one. The practical implication is that a
              3x revenue multiple on roughly US$990 million of 2025 revenue already yields nearly US$3.0 billion of
              enterprise value logic, while a more conservative 2x multiple still supports something close to the last
              disclosed mark. That asymmetry is why the current price context looks attractive rather than merely fair.
              It is not a perfect comp set, but it is good enough to frame entry discipline and upside.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
