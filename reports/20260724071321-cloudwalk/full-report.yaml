      - number: '7.2'
        title: Financial and funding risk
        blocks:
          - type: paragraph
            body: >-
              The most financially material risk cluster centers on funding structure and credit quality. CloudWalk’s
              rapid growth has increasingly been financed through large FIDC transactions rather than fresh equity,
              culminating in multibillion-real vehicles across 2024, 2025, and 2026. That strategy is attractive because
              it reduces dilution and matches receivables economics, but it also creates dependency on collateral
              performance, funding costs, investor appetite, tax treatment, and refinancing access. Fitch’s AA-(bra)
              rating is supportive, yet it does not replace direct visibility into losses, reserves, or stress
              performance of merchant receivables and credit cohorts. The same issue applies to Pix-credit and
              working-capital expansion: the product can lift monetization, but deterioration in portfolio quality could
              compress margins and close capital-market access faster than revenue headlines suggest. The financial
              thesis therefore remains strong on current profitability and weaker on downside transparency. A private
              investor therefore needs treasury-style diligence, not just startup-style growth analysis.
