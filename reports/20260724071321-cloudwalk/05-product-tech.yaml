company:
  name: CloudWalk
chapter:
  number: 5
  title: Product & Technology
  summary: 'InfinitePay is no longer a single card-reader product. The reviewed evidence shows a broad merchant operating system centered on in-person acceptance, digital accounts, Pix, remote commerce, credit, and AI assistance, with CloudWalk increasingly differentiating through software depth, open-finance data, and owned AI infrastructure. The main technical caution is that the product story is much stronger than the public architecture disclosure: security, compliance, and open-source signals exist, but exact uptime, incident history, and system-boundary detail remain limited.'
sections:
- id: product-surface-and-customer-workflow
  title: Product surface and customer workflow
  body: CloudWalk’s product suite is best understood as a merchant workflow stack rather than a payments gadget lineup. InfinitePay’s public pages show that a small business can start with smartphone acceptance via InfiniteTap or a dedicated Android smart terminal, collect money through card, Pix, payment links, checkout, or recurring billing, manage funds inside a free business account, and then layer on lending, collection tooling, online storefronts, and AI assistance. The company’s customer page also demonstrates that CloudWalk markets this suite to merchants that need faster settlement, lower fees, easier installments, and simple day-to-day cash-flow management. That workflow framing matters because CloudWalk is not competing only on device price; it is trying to make InfinitePay the operating account through which a merchant accepts, manages, finances, and grows sales. This creates more attachment points than a pure acquirer model and makes feature breadth part of the moat.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
