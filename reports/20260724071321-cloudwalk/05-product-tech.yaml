- id: deployment-reliability-and-trust-controls
  title: Deployment, reliability, and trust controls
  body: 'Reliability and trust are central because InfinitePay sits in the middle of merchants’ daily cash flow. Official pages highlight same-app onboarding, Android and iPhone tap-to-pay compatibility, Pix integration, and remote support as deployment enablers. Security materials also show that CloudWalk has formal cyber-security and AML policies, fraud-prevention messaging, and multiple public claims around fraud controls and low complaint rates. The strongest corroborated technical claim in this pack is practical rather than theoretical: Apple’s Tap to Pay framework requires PSP integration, entitlement review, and certified terminal configurations, and CloudWalk publicly announced InfinitePay support for Tap to Pay on iPhone in Brazil. That combination implies a real integration effort rather than a loose marketing promise. Still, the company does not publish the sort of detailed uptime dashboard, postmortem archive, or architecture diagrams that would let an outside investor independently
    assess operational resilience module by module.'
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
