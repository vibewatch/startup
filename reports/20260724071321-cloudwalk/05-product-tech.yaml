- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Merchant mobile app
    - Primary merchant interface across acceptance, account, and support
    - Android/iOS device capabilities and app distribution
    - OS policy or version changes can affect reach
  - - Payment acceptance layer
    - Processes card, NFC, Pix, links, and checkout flows
    - Card schemes, PSP certifications, Central Bank rails
    - Fraud and certification failures hurt trust
  - - Account and treasury layer
    - Stores balances and moves funds
    - Banking and payment-institution controls
    - Compliance and treasury complexity
  - - Credit and underwriting layer
    - Extends merchant financing using transaction/open-finance context
    - Receivables data, licenses, funding vehicles
    - Loss-model drift or funding stress
  - - AI agent layer
    - Supports support, merchant advice, and workflow automation
    - Model quality, compute infra, internal data systems
    - Hallucination, support-quality, or bias risks
  - - Stratus blockchain / settlement experimentation
    - Internal performance-oriented ledger experimentation
    - CloudWalk engineering team and open-source maintenance
    - Early-stage operational proof remains limited
  notes: This table reflects externally inferable system layers only. It does not claim access to private production architecture documents.
