- id: architecture-ai-and-developer-surface
  title: Architecture, AI, and developer surface
  body: Public technical evidence suggests a layered architecture with merchant-facing apps on top of payment, account, credit, and AI services. CloudWalk’s developer page confirms an integration surface for merchants and partners, while the company’s AI and blockchain releases reveal a stronger internal engineering posture than a typical SMB fintech brand page would suggest. CloudWalk says JIM is embedded as an intelligent assistant for entrepreneurs, Gabriel operates customer support for millions of users, and its May 2026 infrastructure release says the company runs Latin America’s largest dedicated AI compute cluster, processing more than 60 billion tokens per day. On the blockchain side, Stratus is openly described as an EVM-compatible ledger optimized for performance and observability rather than decentralization, and the public GitHub repository exposes implementation details, tooling, tests, and active updates. Those developer signals do not prove production superiority on their
    own, but they do indicate genuine internal platform-building rather than pure third-party assembly.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
