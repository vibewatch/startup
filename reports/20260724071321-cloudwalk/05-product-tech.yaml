- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - CloudWalk solution
  - Measurable benefit
  - Limitation
  rows:
  - - Accept in-person card payments
    - Needs terminal or NFC acceptance with fast settlement
    - InfiniteTap and smart terminal products
    - No extra hardware for smartphone acceptance; faster merchant start
    - Compatible-device dependence
  - - Collect remote sales
    - WhatsApp or DM sales are hard to close
    - Payment links, checkout, and recurring billing
    - Expands beyond physical checkout
    - Real conversion data not public
  - - Manage business cash
    - Small merchants lack integrated account tools
    - Conta PJ, Pix, cards, and treasury features
    - Keeps operations in one app
    - Treasury take-up unknown
  - - Bridge working capital gaps
    - Merchants need quick credit tied to sales activity
    - InfiniteCredit and receivables anticipation
    - Potentially faster underwriting and lower friction
    - Portfolio quality not fully public
  - - Run the business day to day
    - Solo operators lack back-office help
    - JIM and workflow tools
    - Potential lower admin burden and higher attachment
    - Usage-depth metrics not fully disclosed
  notes: Benefits are grounded in public positioning and named customer outcomes; unsupported quantitative uplift claims are left as gaps.
