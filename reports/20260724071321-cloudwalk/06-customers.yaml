company:
  name: CloudWalk
chapter:
  number: 6
  title: Customers
  summary: CloudWalk’s customer proof is strongest on breadth, everyday usage fit, and small-merchant orientation. Public sources show a very large Brazilian long-tail base, with 6.3 million active sellers, 14 million opened accounts, nationwide reach, named merchant testimonials, app-distribution momentum, and low complaint-rate messaging. The key limitation is that retention, gross churn, cohort behavior, and merchant TPV by segment remain substantially less transparent than customer-count headlines.
sections:
- id: segments-and-buyer-profile
  title: Segments and buyer profile
  body: 'The source pack points consistently to CloudWalk serving Brazil’s long-tail merchant economy rather than a concentrated enterprise book. InfinitePay’s public surfaces repeatedly target micro and small businesses, self-employed operators, mobile sellers, salons, food vendors, delivery operators, and merchants selling through direct messages or lightweight online storefronts. The product design reinforces that positioning: smartphone acceptance, zero-fee Pix, free account setup, payment links, billing tools, and same-app credit all reduce onboarding friction for merchants who are under-served by traditional banks and legacy acquirers. This matters for customer quality because the model naturally diversifies concentration risk across millions of accounts, but it also means average revenue per customer is lower and support, fraud, and engagement tooling must scale efficiently. In practice, CloudWalk is winning with a mass-market merchant operating model rather than with a few trophy
    logos.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
