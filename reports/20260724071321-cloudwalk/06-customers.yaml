- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Account plus payments bundle
    - Low single-customer concentration but high dependence on Brazil SMB health
    - Broadens wallet share while keeping macro exposure local
    - Request revenue by merchant size and region
  - - Credit attachment
    - Credit losses can impair expansion economics
    - Higher ARPU but more risk sensitivity
    - Request credit penetration and vintage performance
  - - Commerce tools and checkout
    - Merchant activation may outpace repeat use
    - Can improve stickiness if used repeatedly
    - Request product-level MAU and attach rates
  - - AI support and JIM
    - If AI quality is strong, support leverage improves retention
    - Poor quality could hurt trust at scale
    - Request CSAT, deflection, and merchant retention by JIM usage
  - - Nationwide reach
    - Expansion headroom inside Brazil may slow eventually
    - Raises need for deeper wallet share or new geographies
    - Request cohort saturation and new-region expansion data
  notes: Customer concentration looks low at the merchant level; the more material concentration is geographic and model-based.
