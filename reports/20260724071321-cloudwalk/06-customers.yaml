- id: adoption-trajectory-and-usage-proof
  title: Adoption trajectory and usage proof
  body: Adoption breadth is one of the clearest strengths in the public record. CloudWalk’s March 2026 release says InfinitePay finished 2025 with 6.3 million active sellers and 14 million opened accounts in Brazil, while other official releases show 3 million sellers at the end of 2024, 1.2 million entrepreneurs by the end of 2023, and nationwide reach across 100% of Brazilian territory. The AI-infrastructure release adds another usage lens by saying CloudWalk’s products serve more than 7 million monthly active users across Brazil and the United States, while app-distribution sources show strong consumer-style pull for the app itself. These indicators together suggest the product is not just signed up but embedded enough to support frequent, repeated operational use. What remains missing is a clean denominator for active merchants by cohort, TPV per merchant band, or product-specific usage frequency. That pattern is especially relevant because it suggests the product is part utility, part
    operating account, and part growth toolkit for merchants.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
