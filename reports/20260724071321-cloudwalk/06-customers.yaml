- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Micro-merchants
    - Owner-operator is buyer and user
    - Accept card and Pix quickly
    - Core official positioning across site and app
    - Large base, lower ARPU, broad diversification
    - No segment revenue split
  - - Small formal SMEs
    - Owner or manager
    - POS, account, billing, and checkout
    - Named merchants and nationwide reach
    - Higher cross-sell opportunity
    - No SME cohort TPV disclosure
  - - Informal / semi-formal sellers
    - Solo sellers and side hustlers
    - Tap-to-phone, link, and same-app account
    - App and customer-page positioning
    - Broadens market access
    - Verification funnel not disclosed
  - - Remote sellers / social commerce
    - Owner-operators using WhatsApp or DMs
    - Payment links and checkout
    - Official commerce-tool pages
    - Expands beyond physical counter
    - Conversion and repeat metrics absent
  - - Credit-needing merchants
    - Existing merchants using receivables / loans
    - Working capital and cash-flow smoothing
    - Official credit releases
    - Higher monetization depth
    - No public credit usage cohort
  notes: CloudWalk publicly targets merchant segments by workflow and friction profile more than by formal enterprise tier.
