- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration
  body: 'The best public durability signals are indirect. CloudWalk says 80% of entrepreneurs already use at least two products, which supports an attachment thesis, and the breadth of account, Pix, credit, billing, and checkout modules creates obvious land-and-expand paths after first payment acceptance. Complaint-rate leadership and the RA1000 positioning also hint at service quality that may help retention for a mass SMB base. At the same time, the company does not publish NRR, GRR, churn, contract duration, or revenue concentration by channel, so investors still cannot cleanly quantify loyalty or revenue durability. The likely customer concentration risk is low at the merchant level and higher at the macro level: CloudWalk is diversified across merchants but concentrated in Brazilian SMB economic health, Brazil payment-rail policy, and the company’s ability to keep cost-to-serve low while usage scales. The customer story is therefore very broad and commercially promising, but not fully
    cohort-proven from public evidence alone. Public churn math is still absent today.'
