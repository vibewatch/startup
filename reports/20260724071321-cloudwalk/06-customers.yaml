- id: named-customer-proof-and-satisfaction-signals
  title: Named customer proof and satisfaction signals
  body: 'Named merchant proof is reasonably strong for an SMB platform, even if it is still mostly company-curated. InfinitePay’s customer pages name merchants such as Maurício at Elemovi, Layla Lima at Galantes Móveis, and Pierre Lisboa at Ramp Eletronics, and tie their testimonials to measurable or at least directionally specific outcomes such as easier installment sales, lower fees, faster payment receipt, or roughly R$500 per month of savings. Additional customer-page examples such as Lets Tattoo, Gato Griô, Escola Premium, and Cat Toy Pets broaden the vertical mix across services, retail, education, and pet commerce. Independent signals are weaker but still useful: Google Play highlights a broad merchant workflow app, StartSe reported the app became Brazil’s most downloaded finance app, and CloudWalk has repeatedly cited low complaint-rate performance. These are not substitutes for cohort retention data, but they do support real-world adoption beyond a purely promotional landing page.
    They are helpful proof points, but not yet statistically representative customer evidence.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
