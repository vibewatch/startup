- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: sample
    basis: Rows were selected from the named merchant references visible on InfinitePay customer surfaces that include a stated use case or outcome.
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome
  - Limitation
  rows:
  - - Maurício / Elemovi
    - Retail / B2B equipment seller
    - InfinitePay payments and credit tools
    - production
    - Customer page says easier payment acceptance increased sales and profit; credit example says lower interest and next-day receipt
    - Outcome is directional, not full KPI audit
  - - Layla Lima / Galantes Móveis
    - Furniture retail
    - Installment payments and lower fees
    - production
    - Quoted saying lower rates stopped lost sales and made ten-installment offers worthwhile
    - Savings not independently verified
  - - Pierre Lisboa / Ramp Eletronics
    - Electronics retail
    - Pricing / rate savings
    - production
    - Quoted savings of about R$500 per month after rate change
    - Single anecdote rather than cohort result
  - - Lets Tattoo
    - Services / beauty
    - Installment acceptance
    - production
    - Official page says 12x installments made customers’ dreams more possible
    - No merchant-level metrics disclosed
  - - Cat Toy Pets
    - Pet retail / ecommerce
    - Payment link and lower rates
    - production
    - Official page says links and rates simplified sales for the couple behind the business
    - No retention or TPV detail
  notes: These rows are real named or business-specific examples, but they remain marketing-selected customer proof rather than an independently sampled customer cohort.
