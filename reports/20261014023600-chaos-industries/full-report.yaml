      - number: '5.2'
        title: 'Hardware Portfolio: VANQUISH Radar, CDN, and VESPID Interceptors'
        blocks:
          - type: paragraph
            body: >-
              The flagship product within the CHAOS portfolio is VANQUISH, a software-defined distributed radar
              engineered for short- to long-range aerial surveillance and counter-UAS missions. VANQUISH PRIME provides
              360-degree situational awareness with built-in resistance to electronic jamming, enabling persistent
              monitoring and high-precision target tracking. Beyond primary radar sensing, the company has broadened its
              product portfolio into kinetic defeat mechanisms through the VESPID family of low-cost tube-launched
              interceptors (Mk 0 and Mk 1), alongside mobile detection platforms such as HYDRA, establishing an
              integrated capability pipeline spanning threat detection, electronic identification, and kinetic
              interception.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE012
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
              - CE009
      - number: '5.3'
        title: 'Architecture & Operating Model: Multistatic Geometry and Wireless Timing'
        blocks:
          - type: paragraph
            body: >-
              The foundational architectural distinction of CHAOS's VANQUISH system is its bistatic and multistatic
              geometry, which physically decouples radar transmitters from passive receiver nodes. Traditional active
              electronically scanned array (AESA) systems require co-located transmit and receive elements, driving up
              power, cooling, and compute burdens. In contrast, CHAOS's distributed model dramatically lowers required
              antenna elements while utilizing over 90% commercial-off-the-shelf components. Coherence across these
              separated nodes is maintained via two-way time transfer (TWTT) and proprietary wireless
              time-synchronization technology acquired through Ziva, enabling distributed signal correlation and joint
              track generation.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Field Deployments, Mobile Platform Integration, and Operational Roadmap
        blocks:
          - type: paragraph
            body: >-
              CHAOS has prioritized rapid operational validation through active participation in major US Department of
              Defense evaluation exercises. The VANQUISH radar demonstrated low-altitude UAS tracking capabilities
              during the US Army 10th Air and Missile Defense Command's Flytrap 4.5 exercise in Putlos, Germany,
              resulting in the Army taking possession of a unit for Eastern European exercises. Additionally, the system
              participated in Marine Corps Weapons and Tactics Instructor exercises and trials at White Sands Missile
              Range. To support expeditionary maneuver, CHAOS partnered with autonomous mobility specialist Forterra,
              integrating the bistatic VANQUISH radar onto robotic Squad Multipurpose Equipment Transport ground
              vehicles.
            claimRefs:
              - CE005
              - CE006
              - CE008
      - number: '5.5'
        title: Trust, Contested EW Resilience, and Supply-Chain Controls
        blocks:
          - type: paragraph
            body: >-
              While CHAOS's COTS-heavy manufacturing strategy enables rapid scaling across 14,000 square feet of
              assembly space in Hawthorne and 40,000 square feet in El Segundo, it introduces specific technical and
              supply-chain vulnerabilities. High reliance on commercial semiconductor components exposes procurement to
              commercial supply chain disruptions. Furthermore, the operational efficacy of distributed multistatic
              radar depends strictly on maintaining nanosecond-level time synchronization across inter-node data links;
              intensive adversarial electronic warfare jamming could degrade inter-node coherence. Addressing these
              challenges, CHAOS emphasizes hardware modularity, dual-use component sourcing, and software-defined signal
              processing resilience to maintain operational uptime in contested operational environments.
            claimRefs:
              - CE001
              - CE007
              - CE010
              - CE011
              - CE014
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Bistatic Geometry Decouples Aperture Cost from Target Detection Range
            body: >-
              By physically decoupling radar transmitters from receiver nodes and maintaining coherent timing across the
              network, CHAOS's VANQUISH system drastically reduces the physical antenna elements, power consumption, and
              cooling infrastructure required to achieve long-range tracking of low-radar-cross-section UAS threats.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Critical Dependency on Nanosecond Time Synchronization and Uncontested GNSS/RF Links
            body: >-
              Coherent distributed radar performance relies strictly on microsecond-to-nanosecond time synchronization
              across geographically dispersed nodes. If adversary electronic warfare disrupts inter-node two-way time
              transfer or high-bandwidth communication links, the multistatic processing advantage degrades rapidly into
              uncoordinated, lower-gain sensing.
            calloutType: risk
            claimRefs:
              - CE001
              - CE007
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              CHAOS appears to serve a mission-led rather than a conventional seat-based customer base. The clearest
              buyer surface is U.S. defense test, training, and tactical acquisition: independent profiles connect
              ASTRIA and multistatic radar work to Eglin, while the official newsroom records coverage of an Army
              acquisition-marketplace listing. A second surface is integrator-led counter-UAS delivery, where Forterra
              supplies autonomous mobility and CHAOS supplies sensing. Public profiles also name border, airport,
              energy, allied-defense, and critical-infrastructure applications, but the reviewed record does not
              identify production customers in those civil segments. The resulting segmentation is best treated as a map
              of reachable buyers and users, not a measured revenue mix or installed-base breakdown.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
