  - id: TV001
    title: Recommendation Summary Table
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - High valuation with unverified commercial revenue and contracts
        - Defer commitment until audited ARR and program conversion are verified
      - - Confidence
        - medium
        - Public financing rounds verified; revenue and contract figures opaque
        - Require primary financial due diligence before firm stance
      - - Risk Rating
        - high
        - Hardware scaling execution, customer concentration, private illiquidity
        - Apply conservative hurdle rates and downside protection
      - - Valuation Stance
        - stretched
        - Implied 33.4x multiple on unverified $134.6M ARR Latka estimate
        - Negotiate structural downside protections or lower entry mark
    notes: >-
      Summary of investment assessment and decision implications based on public financing rounds and secondary market
      data.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV013
  - id: TV002
    title: Thesis and Anti-Thesis Table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter
      - Thesis-Break Indicator
    rows:
      - - Market Demand
        - Rapid DoD adoption of distributed sensing and counter-drone systems amid rising UAS threats
        - DoD budget cycles are slow and fragmented; legacy primes retain existing IDIQ vehicle dominance
        - Cancellation or prolonged delay of major sensor modernization programs
      - - Technology & Architecture
        - Coherent Distributed Networks provide multi-static radar coverage at lower cost than monolithic systems
        - Coherent RF networking is technically complex to scale across heterogeneous field environments
        - Field trial failures or inability to achieve multi-node synchronization under jamming
      - - Commercial Execution
        - Strong leadership team with pedigree from 8VC, Palantir, Raytheon, and Epirus accelerating partnerships
        - Disclosed public contracts remain small ($2M Eglin AFB, $10M appropriation) relative to capital base
        - Failure to transition prototype demonstrations into named multi-year Programs of Record
      - - Valuation & Capital
        - Tier-one investor syndicate led by Valor Equity Partners, Accel, and 8VC provides massive runway
        - High $4.5B valuation implies aggressive execution; down-round risk if hardware margins lag software
        - Down-round or flat structured round with heavy liquidation preferences
    notes: Key arguments supporting the bull and bear investment viewpoints and quantifiable thesis-break triggers.
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV010
  - id: TV003
    title: Bull, Base, and Bear Scenario Table
    columns:
      - Scenario
      - Probability
      - Assumed 2026-2028 Milestones
      - Target Valuation Range
      - Implied Multiple / Return
    rows:
      - - Bull Case
        - 25%
        - Conversion into 2+ major Programs of Record; verified ARR exceeds $250M with >60% gross margins
        - $7.0B - $9.0B
        - 1.6x - 2.0x return; 28x - 36x ARR multiple
      - - Base Case
        - 50%
        - Steady production growth; ARR reaches $150M-$180M; moderate contract wins; margins around 45-50%
        - $3.5B - $4.5B
        - 0.8x - 1.0x return; 23x - 25x ARR multiple
      - - Bear Case
        - 25%
        - Hardware scaling delays; contracts remain stuck in pilot phases; multiple compression to prime averages
        - $1.5B - $2.0B
        - 55% - 67% capital loss; 10x - 15x ARR multiple
    notes: >-
      Scenario modeling assumes 3-year investment horizon from 2025 Series D baseline; excludes secondary market
      discounts.
    claimRefs:
      - CV001
      - CV006
      - CV010
      - CV012
