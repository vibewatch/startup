  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product & Mission Definition: Distributed Sensing in Contested Airspace'
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries develops military-grade defense systems designed to address the operational asymmetry
              between low-cost, proliferating unmanned aerial systems (UAS) and expensive, fragile legacy air defense
              sensors. The company's core technological offering is built upon Coherent Distributed Networks (CDN™), an
              architectural paradigm that links geographically dispersed sensor, communication, and effector nodes into
              a synchronized network. Operating across air defense, border security, and critical infrastructure
              protection, the platform converts distributed commercial-off-the-shelf hardware into coherent,
              high-performance sensing arrays capable of early threat detection and continuous multi-target tracking.
            claimRefs:
              - CE001
              - CE002
              - CE011
          - type: table
            tableRef: TE002
