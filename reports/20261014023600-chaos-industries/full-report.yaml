  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Layered architecture of CHAOS Industries' sensing, timing, processing, and interceptor stack from physical
      apertures to tactical C2 networks.
    data:
      layers:
        - label: RF Aperture & Physical Transceivers
          detail: Software-defined radar apertures and passive RF receivers using 90%+ commercial-off-the-shelf components.
        - label: Coherent Time-Synchronization Layer
          detail: >-
            Hardware-level two-way time transfer (TWTT) and Ziva wireless timing engine maintaining nanosecond
            synchronization.
        - label: Distributed Signal Processing (CDN Engine)
          detail: >-
            Bistatic and multistatic cooperative data processing separating transmitters from receivers to reduce
            antenna elements.
        - label: Tracking & Sensor Fusion Kernel
          detail: Multi-target correlation, 360-degree situational awareness, and low-altitude UAS tracking algorithms.
        - label: Autonomy & Platform Mobility Integration
          detail: >-
            Drop-in integration packages for autonomous unmanned ground vehicles (Forterra AutoDrive / SMET) and mobile
            masts.
        - label: Kinetic Interceptor & Effector Layer
          detail: >-
            VESPID family (Mk 0, Mk 1) tube-launched low-cost interceptors and Atropos autonomous airborne effector
            platforms.
        - label: Tactical C2 & Joint Interoperability
          detail: Standards-compliant data interfaces connecting into US Army and allied command-and-control architectures.
    approximationNotes: >-
      Conceptual functional stack synthesized from CHAOS patent disclosures, product announcements, and capability
      briefs as of October 2026.
