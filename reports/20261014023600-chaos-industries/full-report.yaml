              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU011
      - number: '6.3'
        title: Expansion paths outpace durability evidence
        blocks:
          - type: paragraph
            body: >-
              CHAOS has several plausible expansion mechanisms. The Forterra integration can move sensing onto multiple
              vehicle classes and extend the joint offer from frontline units toward convoy, border, and homeland
              missions. The company newsroom also lists 2026 European partnership, acquisition, and interceptor-family
              announcements, indicating a broader route to market and product surface. A May 2025 company-issued
              financing release quoted an investor saying CHAOS continued to earn Programs of Record, but it supplied no
              program names, order values, delivery cadence, or customer-level economics. Across the eight retained
              sources, none reports NRR, GRR, churn, renewals, contract duration, repeat-purchase cohorts, satisfaction,
              or top-customer exposure. The journey therefore has visible entry and evaluation stages but an unverified
              renewal and expansion loop.
            claimRefs:
              - CU003
              - CU009
              - CU010
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU013
              - CU016
      - number: '6.4'
        title: Concentration and reference quality remain the core diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The public record is too sparse to distinguish a diversified customer base from dependence on a small set
              of defense programs, appropriations, and channel partners. Tectonic Defense reported roughly $2 million of
              Eglin work and a $10 million House-approved appropriation, then called the disclosed contracts small
              relative to the reported $4.5 billion valuation and said the larger plan remained unclear. Baltic Defense
              Initiative similarly cautioned that awards and partnerships do not by themselves establish a mature
              customer base. BattlePolicy labels its public file unverified and places procurement details behind a
              restricted section, while another aggregator relies on third-party financial estimates rather than
              customer economics. Diligence should therefore request a contract-level customer schedule,
              production-versus-pilot classification, funded backlog, renewals, and top-customer concentration before
              assigning durability to the visible activity.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
