              - CU007
              - CU008
              - CU009
      - number: '6.2'
        title: Adoption proof is real but remains pre-scale
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signals are funded government development and field activity. A third-party
              profile reports a $1,232,488 Phase II SBIR award scheduled from April 2024 to January 2026 for advanced
              multistatic radar work, and independent directory coverage describes a separate $1.9 million AFWERX TACFI
              effort to adapt ASTRIA for Eglin test and training ranges. Forterra says the integrated VANQUISH and
              AutoDrive configuration was tested in multiple field environments before a planned government
              demonstration. These milestones show access to operational settings, but development awards, tests,
              marketplace eligibility, and demonstrations are not interchangeable with accepted production deliveries.
              The disclosed values also use different records and periods, so they should not be added into a
              customer-revenue total.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU008
              - CU011
