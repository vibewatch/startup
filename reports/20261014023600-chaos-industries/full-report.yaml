      - number: '1.4'
        title: Product Architecture, Defense Exercises, and Operational Milestones
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries has rapidly translated its core Coherent Distributed Networks research into an expanding
              portfolio of field-deployable defense hardware. The flagship VANQUISH system is an expeditionary
              multi-mission distributed radar designed for rapid 360-degree deployment in under one hour, providing
              extended-range detection against small aerial drones. Complementing VANQUISH, the company has fielded
              ASTRIA for persistent long-range airspace surveillance and developed the VESPID family of low-cost
              tube-launched interceptors to neutralize aerial swarms. The company has rigorously demonstrated these
              systems across prominent military proving grounds, including U.S. Army Flytrap 4.5 exercises in Germany,
              USMC Weapons and Tactics Instructor courses, and USAF Eglin Air Force Base operational trials, alongside
              reported field deployments in Jordan and Ukraine. To support scaling production, CHAOS operates 14,000
              square feet of assembly space in Hawthorne and secured an additional 40,000 square feet in El Segundo in
              2026, reinforced by strategic autonomy integration partnerships with ground vehicle robotics specialist
              Forterra.
