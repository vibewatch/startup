chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation Discrepancy, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries represents one of the fastest-scaling venture-backed defense hardware startups in recent
              history, positioning itself to disrupt traditional monolithic radar platforms through software-defined,
              distributed radio-frequency architectures. Corporate registry records trace the company's legal entity,
              CHAOS 1, Inc., to an incorporation in California in 2018 based in Hawthorne. However, public corporate
              statements and investor communications consistently identify 2022 as its operational founding date,
              reflecting when its core founding syndicate unified and institutional venture financing commenced. The
              company's central mandate focuses on addressing modern battlefield saturation threats, particularly
              unmanned aerial systems and cruise missiles, by deploying coherent distributed networks that physically
              decouple radar transmitters from receivers. By manufacturing these modular bi-static systems with over 90
              percent commercial off-the-shelf components, CHAOS aims to drastically reduce size, weight, power, and
              cost while improving survivability against electronic warfare.
            claimRefs:
