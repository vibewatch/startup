    columns: [Customer or counterparty, Segment, Deployment or use case, Public status, Evidenced outcome, Limitation]
    rows:
      - [Eglin Air Force Base, U.S. defense test and training, ASTRIA instrumentation for test and training ranges, Funded AFWERX TACFI adaptation, A defined application and funding amount were reported, No accepted production deployment or follow-on order disclosed]
      - [96th Test Wing, U.S. Air Force test organization, Advanced multistatic radar capability for range requirements, Phase II SBIR development, "Award amount, contract number, and scheduled period were reported", Completion and customer acceptance were not established]
      - [U.S. Army acquisition marketplace, Tactical defense procurement channel, Radar technology available through a buying route, Addition reported in December 2025, Public evidence of channel eligibility, Eligibility does not establish an order or active use]
      - [Forterra, Defense autonomy integration partner, VANQUISH on an AutoDrive-powered SMET, Field-tested integration and planned government demonstration, Partner reported operation across multiple field environments, "Forterra is a partner, not evidence of an end-customer purchase"]
      - [Ukraine end user not named, Operational defense, Company-reported technology deployment, Reported second-hand by Tectonic Defense, Indicates possible operational exposure, "Buyer, system, duration, outcome, and independent verification absent"]
    notes: >-
      Sample of publicly attributable adoption events in the retained sources;
      it is not an exhaustive customer list and includes partner and channel evidence.
    enumerationScope:
      coverage: sample
