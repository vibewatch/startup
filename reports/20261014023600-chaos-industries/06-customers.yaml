schemaVersion: "report-v2"
artifact: customers
slug: chaos-industries
runDate: 2026-10-14
company:
  name: CHAOS Industries
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence shows CHAOS progressing through funded development,
    field integration, demonstrations, and acquisition-channel access, especially
    around Eglin and the U.S. Army. It does not establish a broad production
    customer base, repeat purchasing, retention, or customer concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying surfaces
    body: >-
      CHAOS appears to serve a mission-led rather than a conventional
      seat-based customer base. The clearest buyer surface is U.S. defense test,
      training, and tactical acquisition: independent profiles connect ASTRIA
      and multistatic radar work to Eglin, while the official newsroom records
      coverage of an Army acquisition-marketplace listing. A second surface is
      integrator-led counter-UAS delivery, where Forterra supplies autonomous
      mobility and CHAOS supplies sensing. Public profiles also name border,
      airport, energy, allied-defense, and critical-infrastructure applications,
      but the reviewed record does not identify production customers in those
      civil segments. The resulting segmentation is best treated as a map of
      reachable buyers and users, not a measured revenue mix or installed-base
      breakdown.
    claimRefs: [CU001, CU002, CU003, CU007, CU009]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof is real but remains pre-scale
    body: >-
      The strongest public adoption signals are funded government development
      and field activity. A third-party profile reports a $1,232,488 Phase II
      SBIR award scheduled from April 2024 to January 2026 for advanced
      multistatic radar work, and independent directory coverage describes a
      separate $1.9 million AFWERX TACFI effort to adapt ASTRIA for Eglin test
      and training ranges. Forterra says the integrated VANQUISH and AutoDrive
      configuration was tested in multiple field environments before a planned
      government demonstration. These milestones show access to operational
      settings, but development awards, tests, marketplace eligibility, and
      demonstrations are not interchangeable with accepted production
      deliveries. The disclosed values also use different records and periods,
      so they should not be added into a customer-revenue total.
    claimRefs: [CU004, CU005, CU006, CU008, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Expansion paths outpace durability evidence
    body: >-
      CHAOS has several plausible expansion mechanisms. The Forterra
      integration can move sensing onto multiple vehicle classes and extend the
      joint offer from frontline units toward convoy, border, and homeland
      missions. The company newsroom also lists 2026 European partnership,
      acquisition, and interceptor-family announcements, indicating a broader
      route to market and product surface. A May 2025 company-issued financing
      release quoted an investor saying CHAOS continued to earn Programs of
      Record, but it supplied no program names, order values, delivery cadence,
      or customer-level economics. Across the eight retained sources, none
      reports NRR, GRR, churn, renewals, contract duration, repeat-purchase
      cohorts, satisfaction, or top-customer exposure. The journey therefore
      has visible entry and evaluation stages but an unverified renewal and
      expansion loop.
    claimRefs: [CU003, CU009, CU010, CU016]
    figureRefs: [FU001]
  - id: concentration-and-diligence
    title: Concentration and reference quality remain the core diligence gaps
    body: >-
      The public record is too sparse to distinguish a diversified customer
      base from dependence on a small set of defense programs, appropriations,
      and channel partners. Tectonic Defense reported roughly $2 million of
      Eglin work and a $10 million House-approved appropriation, then called the
      disclosed contracts small relative to the reported $4.5 billion
      valuation and said the larger plan remained unclear. Baltic Defense
      Initiative similarly cautioned that awards and partnerships do not by
      themselves establish a mature customer base. BattlePolicy labels its
      public file unverified and places procurement details behind a restricted
      section, while another aggregator relies on third-party financial
      estimates rather than customer economics. Diligence should therefore
      request a contract-level customer schedule, production-versus-pilot
      classification, funded backlog, renewals, and top-customer concentration
      before assigning durability to the visible activity.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
