      - [Forterra integrated field activity, "Multiple field environments; government demo scheduled", October 2025, Forterra partnership announcement, Medium-low, Demonstrates partner integration before a government audience, "Named buyer, acceptance criteria, and production conversion"]
    notes: >-
      Values describe different programs, record types, and periods and are not
      additive; no retained source supplies a total customer-revenue denominator.
    claimRefs: [CU004, CU005, CU006, CU007, CU008]
  - id: TU003
