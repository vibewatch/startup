    claimRefs: [CU004, CU005, CU007, CU008, CU011]
figures:
  - id: FU001
    title: Publicly visible customer journey and missing durability loop
    type: journey-map
    summary: >-
      Evidence is strongest from mission definition through funded evaluation,
      then weakens at production, renewal, and account expansion.
    data:
      items:
        - label: Mission need
          detail: "Defense, test-range, border, homeland, airport, and energy-site sensing needs"
          touchpoints: [Product and market profiles]
        - label: Funded development
          detail: SBIR and AFWERX TACFI programs establish paid technical work
          touchpoints: [Phase II award, Eglin TACFI]
        - label: Field integration
          detail: Radar is integrated with range infrastructure or partner mobility
          touchpoints: [Eglin adaptation, Forterra field trials]
        - label: Buying-route access
          detail: Marketplace eligibility can reduce friction but is not an order
          touchpoints: [Army acquisition marketplace]
        - label: Production conversion
          detail: "Programs-of-Record language is public, but named values and delivery cadence are not"
          touchpoints: [Company-issued financing release]
        - label: Renewal and expansion
          detail: "No public retention, renewal, cohort, or concentration metrics were found"
          touchpoints: [Contract-level diligence request]
    approximationNotes: >-
      Qualitative sequence only; it does not imply conversion rates, equal stage
      duration, or that every customer traverses the same procurement path.
    claimRefs: [CU010, CU013, CU016]
callouts:
  - calloutType: risk
    title: Public activity is not yet evidence of durable customer economics
    body: >-
      Awards, demonstrations, marketplace access, and partner integrations show
      engagement, but the retained record does not disclose repeat orders,
      renewal rates, production backlog, or customer concentration.
    claimRefs: [CU012, CU016]
