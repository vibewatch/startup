callouts:
  - calloutType: risk
    title: Contract Scale Disparity vs $4.5B Valuation
    body: While CHAOS has raised $1 billion in total capital and achieved a $4.5 billion valuation mark, publicly disclosed contracts such as the $2 million Eglin Air Force Base effort remain modest. Until multi-hundred-million-dollar programs of record materialize, the valuation reflects substantial growth optimism.
    claimRefs:
      - CV001
      - CV007
  - calloutType: recommendation
    title: Maintain Research-More Stance Pending Financial Audit
    body: Given secondary liquidity friction, illiquidity risk, and lack of verified unit economics, new capital entry at the current $4.5 billion post-money level should require direct visibility into recurring revenue run-rate and production margins.
    claimRefs:
      - CV008
      - CV013
      - CV014
