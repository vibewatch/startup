callouts:
  - calloutType: "insight"
    title: "Bistatic Geometry Decouples Aperture Cost from Target Detection Range"
    body: "By physically decoupling radar transmitters from receiver nodes and maintaining coherent timing across the network, CHAOS's VANQUISH system drastically reduces the physical antenna elements, power consumption, and cooling infrastructure required to achieve long-range tracking of low-radar-cross-section UAS threats."
    claimRefs:
      - "CE001"
      - "CE002"
  - calloutType: "risk"
    title: "Critical Dependency on Nanosecond Time Synchronization and Uncontested GNSS/RF Links"
    body: "Coherent distributed radar performance relies strictly on microsecond-to-nanosecond time synchronization across geographically dispersed nodes. If adversary electronic warfare disrupts inter-node two-way time transfer or high-bandwidth communication links, the multistatic processing advantage degrades rapidly into uncoordinated, lower-gain sensing."
    claimRefs:
      - "CE001"
      - "CE007"
      - "CE011"
