  - id: FV001
    title: 建议逻辑流程
    type: flow
    summary: 将资本规模、市场扩张和合同不透明度串成逻辑决策链，最终导向继续研究的立场。
    data:
      nodes:
        - label: 资本规模（累计融资 $1B，分 6 轮完成，其中 D 轮 $510M）
          tone: neutral
        - label: 市场机会（国防部对分布式反无人机传感的需求不断扩大）
          tone: positive
        - label: 合同不透明度（公开国防奖项仅限 $2M-$10M 试点项目）
          tone: warning
        - label: 流动性摩擦（非上市私人二级股份受转让限制约束）
          tone: risk
        - label: 估值立场：偏高（基于未经验证数据，隐含 ARR 倍数 33.4x）
          tone: critical
        - label: 建议：research-more（要求核实 ARR 及正式项目转化）
          tone: neutral
      edges:
        - from: Capital Scale ($1B total raised across 6 rounds with $510M Series D)
          to: Market Opportunity (Expanding DoD demand for distributed counter-drone sensing)
        - from: Market Opportunity (Expanding DoD demand for distributed counter-drone sensing)
          to: Contract Opacity (Public defense awards limited to $2M-$10M pilot efforts)
        - from: Contract Opacity (Public defense awards limited to $2M-$10M pilot efforts)
          to: Liquidity Friction (Unlisted private secondary shares subject to transfer restrictions)
        - from: Liquidity Friction (Unlisted private secondary shares subject to transfer restrictions)
          to: 'Valuation Stance: Stretched (Implied 33.4x ARR multiple on unverified figures)'
        - from: 'Valuation Stance: Stretched (Implied 33.4x ARR multiple on unverified figures)'
          to: 'Recommendation: research-more (Require verified ARR and Program of Record conversion)'
    approximationNotes: 逻辑流程综合融资规模、公开奖项和流动性限制方面的证据，形成尽调决策。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV014
