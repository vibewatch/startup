      - number: '1.4'
        title: 产品架构、国防演训与运营里程碑
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries 已迅速将 Coherent Distributed Networks 核心研究转化为不断扩大的可部署国防硬件组合。 旗舰 VANQUISH
              是远征型多任务分布式雷达，设计为在一小时内快速完成 360-degree 部署，并对小型无人机 提供远程探测。公司还部署 ASTRIA 进行持续远程空域监视，并开发 VESPID 低成本管射拦截弹家族以压制空中
              集群。公司在多个重要军事试验场严格验证这些系统，包括德国 U.S. Army Flytrap 4.5 演习、USMC Weapons and Tactics Instructor 课程和 USAF Eglin
              Air Force Base 作战试验；据报道，系统也已在约旦和乌克兰实地 部署。为扩大产能，CHAOS 在 Hawthorne 运营 14,000 square feet 装配空间，并于 2026 年在 El
              Segundo 获得额外 40,000 square feet，由地面车辆机器人专家 Forterra 的战略自主集成合作进一步支持。
