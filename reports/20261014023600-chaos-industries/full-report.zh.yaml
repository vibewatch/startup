      - number: '1.2'
        title: 创始人、管理层与治理结构
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries 的管理层汇聚了硅谷风险投资运营者、资深国防工程人才和国家安全领域资深人士，组合颇为少见。 联合创始人兼 CEO John Tenet 曾任 8VC
              投资人，并联合创办反电子战国防公司 Epirus，负责公司战略、融资和 客户采购渠道。联合创始人兼 CTO Dr. Bo Marr 带来扎实的技术背书：他在 Raytheon 和 Epirus 积累了二十多年
              先进天线阵列设计经验，拥有超过 100 项专利和发表成果。联合创始人兼 CFO Brett Cummings 负责财务规划、 融资和合规。2025 年 4 月，公司任命前中央情报局局长 George J.
              Tenet 为执行董事长，强化机构治理； 2025 年 11 月，Valor Equity Partners 创始人 Antonio Gracias 加入董事会，进一步夯实了应对机密国防采购 渠道的治理班底。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 资本化轨迹、估值变化与投资者阵容
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries 采取激进的资本积累策略，自成立以来通过六轮融资筹得超过 $1 billion。2025 年 11 月，公司完成由 Valor Equity Partners 领投、8VC 和
              Accel 参与的 $510 million Series D，投后估值达到 $4.5 billion。此前，公司于 2025 年 5 月完成由 New Enterprise Associates 领投的
              $275 million Series C，当时估值为 $2 billion。估值快速攀升，说明投资者高度看好分布式战场传感，但也带来显著风险。公开可识别的国防主合同金额仍然有限，主要包括 Eglin Air
              Force Base 的 $2 million 训练适配合同，以及众议院批准的 $10 million 网络测试拨款。由于经审计的商业和国防收入仍高度保密，独立尽调必须判断
              机密采购管线或涉密对外军售是否足以支撑数十亿美元的估值倍数。
            claimRefs:
