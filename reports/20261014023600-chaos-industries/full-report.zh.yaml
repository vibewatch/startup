            body: >-
              CHAOS 通过机构融资轮累计获得超过 1 billion dollars 的股权资本，为早期国防扩张提供了异常充裕的流动性 缓冲。2025 年 11 月，公司完成 Valor Equity Partners
              领投、投后估值 4.5 billion dollar 的 510 million dollar Series D；此前 2025 年 5 月由 NEA 和 Accel 领投的 275 million dollar
              Series C 估值为 2.0 billion dollar。按当前运营烧钱速度，这笔资金预计可提供超过 36 个月的现金跑道，隔离近期融资波动。资本配置 重点是垂直整合，包括为无线授时收购 Ziva
