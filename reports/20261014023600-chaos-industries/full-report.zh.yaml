  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、双用途定价与国防合同机制
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries 采用混合收入架构，将一次性硬件销售、联邦研究原型开发和面向国家安全及民用领域的经常性 监视软件许可结合起来。国防采购中的初始收入来自非稀释性 Small Business
              Innovation Research（SBIR） Phase II 拨款、Air Force AFWERX Tactical Funding Increase（TACFI）过渡合同，以及 Other
              Transaction Authority（OTA）演示载体。公司按双用途模式为 Coherent Distributed Networks（CDN）定价，向商业基础 设施和边境安全买家宣传每平方公里 100
              dollars 的大范围传感门槛。但公开采购记录显示，早期政府收入仍 依赖单笔测试合同，例如将 Astria 雷达改造用于 Eglin Air Force Base 空军测试的 2 million dollar
              合同， 以及众议院批准的 10 million dollar 测试拨款，而非多年 Programs of Record。机场和关键设施周界监控虽
              可能带来较高的经常性软件毛利，但实际收入仍主要来自阶段性国防里程碑付款。
