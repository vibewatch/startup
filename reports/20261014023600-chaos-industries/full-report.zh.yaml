  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、排除支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              界定 CHAOS Industries 的可服务市场，需要严格划清战术与作战级国防传感的边界，并排除不可服务类别。主要市场
              包括双用途多基地雷达、射频（RF）传感、相干联网监视和战术反无人机系统（C-UAS）。边界之外包括精密战略 预警雷达阵列（如传统弹道导弹防御雷达设施）、商用通用航空应答机、民用海事导航，以及采用不同资本结构
              的太空合成孔径雷达星座。现有方案高度依赖 Raytheon 和 Lockheed Martin 等传统主承包商生产的集中式单体
              雷达。虽然这些精密系统应对同等常规威胁的能力很强，但在现代战场上存在明显的单点故障风险。将传感分布到 联网的低 SWaP-C（尺寸、重量、功耗和成本）节点，可消除单点脆弱性并降低替换成本，改变系统生存性。
            claimRefs:
              - CM003
              - CM005
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM005
              - CM007
              - CM009
              - CM011
      - number: '2.2'
        title: 多维可服务市场测算与联邦预算分配
        blocks:
          - type: paragraph
            body: >-
              国防硬件和战术软件的市场测算不能依赖推测性的商业 TAM 倍数，而应建立在已核实的联邦预算科目和合同流向 上。按 NAICS 334511（搜索、探测、导航、制导、航空及航海系统与仪器制造），联邦政府在 FY
              2024-2025 的 2,847 项重大合同中承担了总计 $24.04 billion 的义务。国防部占其中 97%（$23.29 billion），显示联邦 国防客户几乎完全集中。FY26 国防申请中有超过
              $20 billion 涉及传感系统，其中 $7.6 billion 直接拨给高 优先级雷达现代化项目。对 CHAOS 尤其关键的是，DoD 预算申请显示 Distributed Space Systems
              资金增长 75%（从 $1.2 billion 增至 $2.1 billion），Software Defined Radio 资金激增 129%，表明作战理念正转向 CHAOS
              开发的相干分布式架构。公司近期可服务市场聚焦战术远征雷达项目，包括 Navy sensor program element PE 0603746N（$890 million）。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
