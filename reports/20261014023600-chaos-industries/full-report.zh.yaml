              - CM004
              - CM014
      - number: '2.3'
        title: 买家、用户与付款方分层及合同路径
        blocks:
          - type: paragraph
            body: >-
              联邦国防客户并非单一整体；各军种和作战司令部的采购权限与预算归属差异很大。按 NAICS 334511，U.S. Navy 占义务额 52.3%（$12.57
              billion），重点采购海事雷达和舰队防御；U.S. Army 占 14.7%（$3.53 billion）， 聚焦地面防空和短程 C-UAS；Air Force 占 12.7%（$3.06
              billion），侧重基地防御和空中传感。对 CHAOS 这类风险投资支持的新进入者，传统 Federal Acquisition Regulation（FAR）采购受现有主承包商主导和多年
              过往业绩要求影响，壁垒很高。因此 CHAOS 使用替代性非稀释进入路径，包括 SpEC（Space Enterprise Consortium） 和 SOSSEC（System of Systems
              Consortium）等 Other Transaction Authority（OTA）联盟，以及 AFWERX TACFI 资金和 Army Acquisition Marketplace
              准入。国际盟国国防部，尤其是欧洲 NATO 成员，也构成不断扩大的 次级买家群体，正在寻找可快速部署的反无人机传感。
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 催化因素、采用约束与尽调现实
        blocks:
          - type: paragraph
            body: >-
              驱动 CHAOS 系统需求的首要催化因素，是当代冲突暴露出的严重作战非对称性：低成本商用和军用无人机集群 正压垮传统防空体系。用数百万美元的拦截弹和集中式雷达应对数千个小型自主空中目标，在经济上难以持续。
              相干分布式传感通过联网价格可承受、能够实时共享授时和航迹数据的传感器，带来更早探测和更强生存能力。 但采用仍有显著摩擦。国防采购周期通常需要 18 到 24 个月，才能把成功原型转为拥有经常性预算科目的正式
              Programs of Record。虽然第三方估算引用了 $134.6 million ARR 等未经核实的收入数字，公开披露没有提供
              商业经常性收入相对于非经常性开发拨款的经审计证明。投资者必须区分原型里程碑付款与锁定的多年生产采购。
            claimRefs:
              - CM005
              - CM007
              - CM013
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 非对称优势：将 DoD 经济性从精密单体转向分布式节点
            body: >-
              现代防空用价值数千万美元、存在单点故障风险的精密单体雷达应对每台 $1,000 到 $50,000 的低成本无人机 集群，正面临经济性拐点。CHAOS 将相干传感分布到低 SWaP-C 节点，瞄准 DoD
              采购正在发生的结构性转变； FY26 分布式空间和地面系统预算同比增长 75%。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM007
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：反无人机与分布式传感
        blocks:
          - type: paragraph
            body: >-
              反无人机系统（C-UAS）和战术雷达市场正从集中式单体雷达塔转向灵活、联网的分布式传感架构。随着战场空间 扩大，CHAOS Industries
              面对三类竞争者：风险投资支持的国防创新者、专业传感器初创公司，以及现有航空航天 国防主承包商。国防科技独角兽 Anduril Industries 代表风险投资同业，重点发展软件定义指挥控制、边缘计算和 由自有
              Lattice 操作系统编排的综合无人机系统。与此同时，Epirus 等专业电子战和定向能供应商用高功率微波 效应器应对无人机集群，Hidden Level
              等射频监测商提供被动低空域跟踪。在国防采购高端，Raytheon、 Northrop Grumman 和 Lockheed Martin 等主承包商继续守住成熟军方 Programs of
              Record，依赖巨型单体相控阵 雷达；这些雷达精度极高，却在远征环境中受制于机动性、成本和单点故障约束。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
