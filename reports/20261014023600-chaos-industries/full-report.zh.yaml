      - number: '3.4'
        title: 切换成本、供应链依赖与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              评估护城河持久性，既能看到防御性技术优势，也能看到明显的竞争脆弱性。CHAOS 的主要防御力来自自有 RF 同步算法，并由收购 Ziva Corporation、收购 Atropos Group
              进入动能效应器，以及推出 VESPID 低成本拦截弹 家族所强化。公司把分布式传感器与一次性空中拦截弹结合，形成从探测到交战的闭环；一旦嵌入战术条令，客户
              切换成本就会升高。但传统主承包商和规模化国防独角兽带来的商品化及替代威胁很大。国防主承包商与各军种、 国会委员会和成熟维修基地网络保持数十年的深厚关系，小型初创公司难以复制。随着 Anduril 等竞争者不断扩展
              传感生态，CHAOS 仍需证明其专用硬件导向的多基地雷达在毛利率和实地可靠性上优于软件导向的传感聚合商。
            claimRefs:
              - CP009
              - CP010
              - CP013
      - number: '3.5'
        title: 图表
        blocks:
