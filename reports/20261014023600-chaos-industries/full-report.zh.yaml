            title: 网络相干性与传感器融合
            body: >-
              Anduril 等竞争者主要通过 Lattice 将不同传统传感器和边缘传感器的数据在软件层融合，而 CHAOS Industries 依靠 Coherent Distributed Networks
              在物理层和信号层形成差异化。通过收购 Ziva，将无线授时精度推进到 亚纳秒级，CHAOS 得以进行多基地雷达处理，让分散节点像一个相干孔径一样协同工作。
