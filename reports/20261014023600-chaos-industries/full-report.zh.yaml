      - number: '3.2'
        title: 竞争者画像与架构对比
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries 的核心架构差异在于自有 Coherent Distributed Networks（CDN™）范式，它支撑 Vanquish 远征
              雷达家族。传统防空雷达是单基地系统，集中式高功率发射机和接收机共用一根桅杆，因此很容易遭受动能打击、 反辐射导弹和局部电子干扰。相比之下，CHAOS 将 Vanquish
              设计为多基地雷达网络，由空间分离的发射和接收 节点组成，在动态、自组网无线拓扑中运行。网络引入从 Ziva Corporation 获得的双向授时同步技术，使地理
              分散的传感器实现相干信号对齐。这种多基地几何结构让系统能探测低雷达截面积威胁，包括低空商用四旋翼和 巡航导弹，距离可达 250 kilometers，据称比传统系统提前最多 10 minutes。Anduril
              等同业是在软件层拼接 处理后的雷达航迹来做传感器融合，而 CHAOS 直接在原始 RF 物理层进行相干信号处理，形成独特技术壁垒。
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: 定价模式、GTM 动作与生态联盟
        blocks:
          - type: paragraph
            body: >-
              在市场进入和商业打包上，CHAOS Industries 把风险投资式硬件灵活性与标准国防采购渠道结合起来。公司声称， Vanquish 用于大范围空域监视时的运营防护成本为每平方公里
              $100，因此可成为传统数百万美元雷达阵地的 颠覆性经济替代方案。为获得机构采购牵引力、无需等待长达十年的大型国防采购项目，CHAOS 在德国 Flytrap 4.5 实地演习后进入 U.S. Army 的
              G-TEAD Marketplace，让 U.S. 和 NATO 武装力量可以快速按任务单采购。 同时，公司与自主平台开发商和国际主承包商建立关键生态合作。通过与机器人机动性领导者 Forterra 合作，
              CHAOS 将 Vanquish 传感器直接集成到无人地面车辆上，支持机动前沿作战。国际上，公司于 2026 年 7 月与 芬兰国防承包商 Insta Defence and Aviation 合作，进入北欧和
              NATO 欧洲防空市场，对冲当地欧洲国防企业的 区域分销优势。
            claimRefs:
              - CP007
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
