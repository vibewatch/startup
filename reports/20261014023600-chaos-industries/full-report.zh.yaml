  - id: FU001
    title: 可见客户旅程与缺失的持久性闭环
    type: journey-map
    summary: 从任务定义到获得资金的评估阶段，证据最充分；进入生产、续约和账户扩张后，证据逐渐变弱。
    data:
      items:
        - label: 任务需求
          detail: 国防、试验场、边境、国土安全、机场和能源场站的传感需求
          touchpoints:
            - 产品和市场画像
        - label: 获资开发
          detail: SBIR 和 AFWERX TACFI 项目建立有偿技术工作
          touchpoints:
            - II 期授予
            - Eglin TACFI
        - label: 野外集成
          detail: 雷达与试验场基础设施或合作伙伴机动平台集成
          touchpoints:
            - Eglin 适配
            - Forterra 野外试验
        - label: 采购路径准入
          detail: 进入市场平台可能降低摩擦，但不等于获得订单
          touchpoints:
            - 陆军采购市场
        - label: 生产转化
          detail: 公开资料出现正式项目措辞，但未公开明确名称的金额和交付节奏
          touchpoints:
            - 公司发布的融资公告
        - label: 续约与扩张
          detail: 未找到公开的留存、续约、队列或集中度指标
          touchpoints:
            - 合同层面尽调请求
    approximationNotes: 仅为定性顺序；不代表转化率、各阶段时长相同，或每位客户都会走过相同的采购路径。
    claimRefs:
      - CU010
      - CU013
      - CU016
