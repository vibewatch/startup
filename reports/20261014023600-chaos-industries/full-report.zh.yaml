    title: 从国防采购到毛利率的转化流程
    type: flow
    summary: 资金从联邦国防拨款周期，经 COTS 制造，流向最终实现的运营利润。
    data:
      nodes:
        - label: 联邦预算对齐与授权
          detail: 国防部 NAICS 334511 国防支出周期（海军、陆军和空军合计年度市场 $24.04B）
        - label: 进入合同载体（OTA / SBIR）
          detail: 通过 AFWERX TACFI、Eglin AFB（$2M）和初始任务订单授予快速制作原型
        - label: COTS 主导的硬件采购
          detail: 90%+ 采用 COTS 元件，减少专用 ASIC / 晶圆厂开发资本开支
        - label: 组装与空间时序同步
          detail: Hawthorne 的 14,000 sq ft 组装空间扩至 El Segundo 的 40,000 sq ft，并采用 Ziva 时序技术
        - label: 部署与多基地野外验证
          detail: 在 White Sands、CENTCOM 演习及盟国国际部署中开展实测
        - label: 毛利润与资本再投资
          detail: 与 $1B+ 资产负债表资金共同将产生的现金再投入研发和战略并购（Ziva、Atropos）
    approximationNotes: 流程展示定性的财务转化机制；具体分配比例仍属非公开信息。
