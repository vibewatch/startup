      - number: '4.4'
        title: 财务结论、收入质量与投资判断尽调障碍
        blocks:
          - type: paragraph
            body: >-
              从投资判断角度看，CHAOS 呈现出两面性：资产负债表流动性近乎坚固，但商业披露严重不透明。底层 24.04 billion dollar 的联邦搜索、探测和导航仪器制造市场（NAICS
              334511）高度分散，单一承包商的 支出占比都不超过 11%，灵活挑战者确实有机会从传统企业手中抢份额。90%+ COTS 成本结构也为实现 50%+
              毛利率提供了可行基础，前提是交付达到规模。但公司完全没有披露 ARR、客户续约率、订单积压或 GAAP 单位盈利能力，构成实质性尽调障碍。投资判断无法验证近期资本增加究竟反映可持续客户牵引，还是
              激进的风险投资估值倍数扩张。取得私人合同转化率、Programs of Record 管线和单位级毛利数据，是机构 投资判断不可或缺的前提。
