              解耦。传统有源电子扫描阵列（AESA）要求发射和接收单元共址，因而增加功耗、冷却和算力负担。相比之下， CHAOS 的分布式模型使用超过 90% 的商用现货组件，同时大幅减少所需天线单元。分离节点之间通过双向授时
