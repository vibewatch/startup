            body: >-
              尽管 CHAOS 声称具备灵活性，且监视经济性为 $100/km2，Raytheon 和 Lockheed Martin 等国防主承包商已深度 集成到现有军方指挥控制架构中，并享有数十年的
              Program-of-Record 预算配置。要替代根深蒂固的单体雷达， 公司必须熬过漫长的 DoD 作战评估周期，并证明系统在电子干扰下仍具备生存能力。
