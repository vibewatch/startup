  - id: FE001
    title: 产品架构图
    type: stack
    summary: CHAOS Industries 从物理孔径到战术 C2 网络的传感、时序、处理和拦截器分层架构。
    data:
      layers:
        - label: 射频孔径与物理收发器
          detail: 采用 90%+ 商用现货元件的软件定义雷达孔径和被动射频接收器。
        - label: 相干时间同步层
          detail: 硬件级双向时间传输（TWTT）和 Ziva 无线时序引擎维持纳秒级同步。
        - label: 分布式信号处理（CDN 引擎）
          detail: 双基地和多基地协同数据处理，将发射器与接收器分离，以减少天线元件。
        - label: 跟踪与传感器融合内核
          detail: 多目标关联、360 度态势感知和低空 UAS 跟踪算法。
        - label: 自主性与平台机动集成
          detail: 面向自主无人地面车辆（Forterra AutoDrive / SMET）和移动桅杆的即插即用集成包。
        - label: 动能拦截器与效应器层
          detail: VESPID 系列（Mk 0、Mk 1）管射式低成本拦截器及 Atropos 自主空中效应器平台。
        - label: 战术 C2 与联合互操作
          detail: 符合标准的数据接口，连接美国陆军及盟国指挥控制架构。
    approximationNotes: 截至 2026 年 10 月，根据 CHAOS 专利披露、产品公告和能力简报综合形成的概念性功能栈。
