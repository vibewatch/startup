chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、成立时间差异与核心使命
        blocks:
          - type: paragraph
            body: >-
              CHAOS Industries 是近年来扩张最快的风险投资支持型国防硬件初创公司之一，正试图用软件定义的分布式射频架构改造传统单体雷达平台。公司注册记录显示，其法律实体 CHAOS 1, Inc. 于 2018
              年在加州 Hawthorne 注册。但公司公开声明和投资者沟通始终把 2022
              年定为运营成立年份——那一年核心创始团队完成整合，机构风险融资也正式启动。公司的核心使命是应对现代战场的饱和式威胁，尤其是无人机系统和巡航导弹；它部署相干分布式网络，把雷达发射机与接收机在物理上分开。CHAOS
              用超过 90 percent 的商用现货组件 制造这些模块化双基地系统，目标是在降低尺寸、重量、功耗和成本的同时，提高对电子战的生存能力。
