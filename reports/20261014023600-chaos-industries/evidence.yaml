evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-arr-verification
    missingEvidence: >-
      Audited financial statements detailing FY2024-2025 recognized revenue, annual recurring revenue (ARR), and the
      split between radar hardware deliveries, software subscriptions, and engineering services.
    whyItMatters: >-
      A $4.5 billion valuation implies aggressive commercial scale, but public contract records reveal only pilot and
      training awards totaling approximately $12 million, leaving revenue quality unverified.
    diligencePath: >-
      Request auditor-reviewed financial statements, customer contract schedules, and backlog reports under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: governance-and-capitalization-enumeration
    missingEvidence: >-
      Complete capitalization table and full board of directors roster, including employee stock ownership pool and
      secondary transaction records.
    whyItMatters: >-
      Public disclosures list key institutional leads across Series A through Series D, but exact equity percentages,
      liquidation preferences, and minority board observer seats remain private.
    diligencePath: >-
      Review the full certificate of incorporation, voting agreements, and investor rights agreement in the company data
      room.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: program-of-record-conversion
    missingEvidence: >-
      Public disclosure or primary budget documentation verifying whether CHAOS Industries' military deployments and
      marketplace listings have converted into funded multi-year Programs of Record and recurring production ARR versus
      non-recurring development grants.
    whyItMatters: >-
      A $4.5 billion valuation requires sustained commercial and program-of-record revenue streams; relying on pilot
      exercises and transactional R&D creates high valuation vulnerability.
    diligencePath: >-
      Review future DoD FY27 budget justifications for named line-item transitions, inspect prime contractor subcontract
      disclosures, and audit audited customer revenue backlog during investment diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-and-margins
    missingEvidence: >-
      Audited per-unit hardware BOM costs, gross margins, and realized software subscription pricing across CHAOS and
      competing C-UAS suppliers.
    whyItMatters: >-
      Without realized contract pricing and gross margins, underwriting cannot evaluate whether CHAOS's $100/km2
      protection claim delivers superior unit economics or commoditization pressure.
    diligencePath: Request customer task-order pricing schedules, BOM teardowns, and subcontractor supply agreements under NDA.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: head-to-head-field-benchmarks
    missingEvidence: >-
      Public independent side-by-side comparative detection benchmarks comparing Vanquish against Anduril sentry radars
      in contested EW environments.
    whyItMatters: >-
      Assessing whether Vanquish's multi-static distributed RF architecture outperforms single-mast radar networks
      requires unclassified test range results.
    diligencePath: >-
      Review unclassified DoD joint test and evaluation range summaries or seek Army test debriefs from exercises such
      as Flytrap.
  - type: private-evidence-only
    severity: blocking
    topic: audited-revenue-and-arr
    missingEvidence: >-
      Audited financial statements detailing annual recognized revenue, annual recurring revenue (ARR), and breakdown
      between hardware shipments, software licensing, and engineering service contracts.
    whyItMatters: >-
      Without audited revenue splits and baseline run-rates, underwriting the $4.5 billion valuation relies entirely on
      speculative forward assumptions rather than proven commercial traction.
    diligencePath: >-
      Request audited GAAP financial statements, trailing twelve-month revenue by contract type, and signed multi-year
      procurement contract schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: gross-margin-and-cots-cost
    missingEvidence: >-
      Bill of materials cost sheets and unit-level gross margin data verifying whether 90%+ COTS architecture achieves
      target 50%+ gross margins at production volume.
    whyItMatters: >-
      If supply chain integration and RF calibration impose higher service delivery costs than anticipated, operating
      cash burn will accelerate as hardware assembly scales.
    diligencePath: >-
      Review unit BOM cost models, manufacturing yield statistics from the Hawthorne facility, and production margin
      forecasts for the planned 40,000 sq ft El Segundo expansion.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: software-benchmarks
    missingEvidence: >-
      Third-party audited benchmark results, software validation reports, or developer telemetry verifying
      signal-processing throughput and false-alarm rates for the CDN processing kernel under dense electronic jamming.
    whyItMatters: >-
      Without independent benchmarking, claims regarding 360-degree detection range and jamming immunity cannot be
      distinguished from vendor performance simulations.
    diligencePath: >-
      Request unclassified test logs from US Army Flytrap 4.5 or USMC WTI proving ground exercises evaluating track
      continuity under active EW jamming.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: minor
    topic: cots-component-bill-of-materials
    missingEvidence: >-
      Detailed component-level bill of materials identifying domestic versus foreign suppliers for the 90%+ COTS parts
      in VANQUISH radar nodes.
    whyItMatters: >-
      Heavy reliance on commercial-off-the-shelf semiconductors and RF transceivers creates vulnerability to commercial
      supply chain chokepoints and export-control restrictions during full-rate production.
    diligencePath: Review vendor NDA supply agreements and dual-sourcing documentation during technical diligence.
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer-level renewal history, NRR, GRR, churn, contract duration, repeat-purchase cohorts, and satisfaction
      evidence.
    whyItMatters: >-
      Without durability metrics, funded development and demonstrations cannot be translated into recurring customer
      economics.
