callouts:
  - calloutType: insight
    title: Network Coherence vs. Sensor Fusion
    body: >-
      While competitors like Anduril focus primarily on software-level data fusion from disparate legacy and edge
      sensors via Lattice, CHAOS Industries differentiates at the physical and signal layer through Coherent Distributed
      Networks. By solving wireless time synchronization down to sub-nanosecond precision via its Ziva acquisition,
      CHAOS enables multi-static radar processing where dispersed nodes act as a single coherent aperture.
    claimRefs:
      - CP001
      - CP008
      - CP009
  - calloutType: risk
    title: Incumbent Prime Entrenchment and Defense Program Friction
    body: >-
      Despite CHAOS's claimed agility and $100/km2 surveillance economics, defense prime contractors like Raytheon and
      Lockheed Martin possess deep integration with existing military command-and-control architectures and decades of
      Program-of-Record budget allocations. Displacing entrenched monolithic radars requires overcoming prolonged DoD
      operational evaluation timelines and demonstrating survivability under electronic jamming.
    claimRefs:
      - CP007
      - CP013
