callouts:
  - calloutType: "insight"
    title: "The Asymmetry Advantage: Shifting DoD Economics from Exquisite Monoliths to Distributed Nodes"
    body: "Modern air defense faces an economic breaking point when defending against cheap drone swarms ($1,000 to $50,000 per unit) using exquisite monolithic radars costing tens of millions of dollars that present single-point-of-failure vulnerabilities. By distributing coherent sensing across low-SWaP-C nodes, CHAOS targets the structural transformation underway across DoD procurement, where FY26 budget allocations for distributed space and ground systems grew by 75% YoY."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM007"
