callouts:
  - calloutType: risk
    title: Extreme Valuation Multiple Relative to Disclosed Contract Traction
    body: CHAOS Industries $4.5 billion valuation following its $510 million Series D stands in sharp contrast with identifiable public defense awards, which remain in the single-to-low-double-digit millions (e.g., $2M at Eglin AFB, $10M congressional testing authorization). While private commercial or classified government engagements may bridge part of this gap, underwriters face severe multiple risk if high-margin, scaled Programs of Record do not materialize quickly.
    claimRefs:
      - CI003
      - CI010
      - CI013
  - calloutType: strength
    title: COTS-Dominant Architecture Provides Favorable Gross Margin Ceiling
    body: By constructing its Vanquish distributed radar line with over 90% commercial-off-the-shelf components, CHAOS sidesteps the multi-year semiconductor fab development cycles and custom hardware cost burdens that plague legacy defense primes. This architecture, coupled with modular assembly across 14,000 to 54,000 square feet of leased manufacturing space, structurally supports superior hardware gross margins if procurement reaches volume.
    claimRefs:
      - CI005
      - CI006
      - CI012
