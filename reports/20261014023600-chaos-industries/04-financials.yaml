    rows:
      - - Bill of Materials (BOM) Architecture
        - 90%+ commercial-off-the-shelf (COTS) components
        - High
        - Limits specialized foundry risk; improves hardware margin ceiling
        - Audit single-source RF component dependencies
      - - Manufacturing Footprint & Capex
        - 14,000 sq ft facility plus 40,000 sq ft lease in 2026
        - High
        - Supports scale assembly without multi-billion dollar capex
