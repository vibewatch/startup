        - label: Assembly & Spatial Timing Synchronization
          detail: 14,000 sq ft assembly in Hawthorne expanding to 40,000 sq ft in El Segundo with Ziva timing tech
        - label: Deployment & Multi-Static Field Validation
          detail: Live testing at White Sands, CENTCOM exercises, and international allied deployments
        - label: Gross Profit & Capital Reinvestment
          detail: Cash generated reinvested alongside $1B+ balance sheet into R&D and strategic M&A (Ziva, Atropos)
    approximationNotes: Flow illustrates qualitative financial conversion mechanisms; exact allocation percentages remain private.
