chapter:
  number: 6
  title: Customers
  summary: 8090’s public customer proof is meaningful but concentrated. The strongest external validation is EY’s co-branded EY.ai PDLC launch and productivity claims, while 8090’s own site adds testimonials from ShadowTech Solutions, Mach33 Financial Group, and Tie. The company clearly targets regulated enterprise buyers, but it does not publish customer counts, retention metrics, or a broad production-logo roster, so the customer chapter can assess direction of adoption quality more confidently than scale or durability.
sections:
- id: segments-and-use-cases
  title: 'Customer segmentation: regulated enterprises and transformation leaders'
  body: '8090’s targeting is clear even if the customer roster is not. Public materials position the company for regulated enterprises and complex modernization workflows. That implies buyers such as CIOs, digital-transformation leaders, and engineering heads in sectors like healthcare, financial services, manufacturing, and government-adjacent environments. The product and managed-delivery pages also suggest two practical adoption paths: self-serve teams that want a software-delivery control plane, and enterprise sponsors who want 8090 to build and operate software for them. This is a high-ACV, low-logo-density strategy rather than a bottoms-up volume motion.


    The pattern suggests a customer base that will likely be narrow in count but high in complexity. That is common in enterprise software-delivery categories where trust, integration depth, and cross-functional change management matter more than easy sign-up growth. It also means each public logo carries more weight in investor interpretation than it would in a broad self-serve SaaS motion.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
  - FU002
- id: public-proof
  title: 'Named proof: strong partner evidence, thinner direct logo depth'
  body: 'The best public customer evidence is concentrated in two buckets. First, EY.ai PDLC is a substantial partner-validation surface because EY describes deploying the offering to a large consultant base and cites strong internal productivity outcomes. Second, the Software Factory page includes named testimonials from ShadowTech Solutions, Mach33 Financial Group, and Tie. Those quotes are useful because they speak to documentation quality, SDLC rigor, and process change rather than generic hype. Even so, the proof set remains shallow compared with mature enterprise platforms that publish extensive customer-story libraries. Public evidence therefore supports credibility, but not breadth.


    In practical terms, the chapter should separate proof quality from proof breadth. Quality is reasonable because the named examples are relevant to the product story and not purely aspirational. Breadth is still limited because the public roster is short, and there is little hard deployment or renewal detail tied to those names.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU039
