  figureRefs:
  - FU003
- id: adoption-and-expansion
  title: 'Adoption motion: partner leverage, workflow embedding, and expansion potential'
  body: '8090’s likely adoption motion starts with a high-stakes workflow problem, not casual experimentation. Buyers need to believe the platform can structure requirements, architecture, and execution in a way that reduces organizational risk. That plays well with EY-led transformation projects and with customers that want managed delivery instead of staffing the whole operating model themselves. Once adopted, expansion can happen through more seats, more projects, more repositories, and deeper operational usage because the platform is organized at the organization and project level rather than around isolated individual prompts. The challenge is that this same motion can hide concentration risk if a few large accounts or one dominant channel matter disproportionately.


    That creates a sensible but demanding commercial motion. Expansion likely depends on proving value in one workflow and then growing into adjacent teams, projects, and repositories. Such a path can produce large accounts if execution is strong, but it can also conceal concentration if only a handful of relationships account for most progress.'
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: retention-and-gaps
  title: Retention, durability, and what is still missing
  body: 'The durability story is more conceptual than measured in the public record. Product architecture implies that the platform can become sticky because requirements, blueprints, work orders, artifacts, and code context compound over time. Feedback workflows and support surfaces strengthen that intuition because they keep the product tied to live user signals and organization-level administration. But none of that substitutes for actual retention data. There is no public NRR, GRR, churn, contract-length, deployment-count, or cohort data. The customer chapter therefore ends with a simple view: reference quality is meaningful, retention logic is plausible, and measurable durability remains unproven in public.


    The public record therefore supports a retention hypothesis, not a retention conclusion. Workflow embedding, project-level administration, and feedback loops all point in the right direction, yet none of them can substitute for renewal cohorts, reference calls, or revenue-retention data. That is why customer durability remains one of the highest-priority private diligence asks.'
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
