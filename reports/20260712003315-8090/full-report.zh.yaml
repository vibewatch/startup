      - number: '4.3'
        title: 资本充足性：资金充足，但仍取决于执行
        blocks:
          - type: paragraph
            body: >-
              相比普通早期软件公司，$135M A 轮给了 8090 可观资本。公司和媒体报道称资金将用于招聘、算力和基础设施扩张，这与产品需求相符。这轮融资大概率买来显著跑道，但没有回答关键问题：软件杠杆能否跑赢交付义务。与
              Salesforce 和 EY 的战略关系强化了融资故事，同时仍让真实运营经济学保持不透明。


              $135M A 轮显著改善了公司的跑道和执行选项。它应能支持招聘、基础设施、产品开发和企业市场进入。但资本本身不是效率证明。如果模型成本居高不下、企业销售周期持续漫长，或交付强度增长快于可复用软件杠杆，资金充足的
              AI 公司仍可能快速耗现金。因此，这笔融资降低的主要是近期生存风险，而不是长期单位经济模型问题。
