      - - 悲观
        - 竞争对手压缩叙事，托管交付占主导，证明仍薄弱
        - 估值显贵
        - 未来融资靠希望，而不是结果
    notes: 情景绑定证明条件，而不是没有支撑的预测数字。
    claimRefs:
      - CV016
      - CV017
      - CV018
  - id: TV004
    title: 可比估值表
    columns:
      - 参照对象
      - 公开估值 / 定价线索
      - 披露深度
      - 相关性
      - 关键限制
    rows:
      - - '8090'
        - 2026 年 6 月 Series A 轮前后估值约 ~$1B
        - 公开运营指标披露少
        - 本次评估的直接切入点
        - 最大问题是私营公司不透明
      - - GitHub Copilot
        - 公开套餐定价和更广泛的工作流拓展
        - 产品层面披露高，独立财务数据缺失
        - 设定开发者工具预算预期
        - 并非独立上市主体
      - - Cursor
        - 公开定价和大型企业采用主张
        - 产品证据中等，财务披露有限
        - 显示私营竞争对手动能和企业接受度
        - 审阅材料中无公开估值
      - - Replit Agent
        - 公开定价和应用生成叙事
        - 产品证据中等，财务披露有限
        - 显示更广的应用构建工具竞争
        - 用户群与 8090 不同
      - - Salesforce / Appian / OutSystems
        - 公开公司或成熟现有厂商的披露材料
        - 披露更充分，客户证明更广
        - 框定市场在规模化阶段通常需要看到的成熟度
        - 不是直接产品对标
    notes: 可比表有意混合选取，因为没有一组同业能干净覆盖软件工厂经济性。
    enumerationScope:
      coverage: partial
      basis: >-
        Uses the most relevant public references across direct private rivals and mature adjacent enterprise platforms
        to frame—not solve—the valuation question.
    claimRefs:
      - CV009
      - CV012
      - CV013
      - CV011
  - id: TV005
    title: 推翻投资论点的触发项表
    columns:
      - 触发项
      - 为什么会推翻论点
      - 什么能缓和风险
    rows:
      - - 看不到软件型经济性证据
        - 没有杠杆，溢价估值无法自洽
        - 毛利率和收入结构证明
      - - 客户引用广度仍浅
        - 客户质量叙事过于集中
        - 独立生产客户标识和续约
      - - 信任背书材料仍薄
        - 监管型企业切入点失去可信度
        - 正式安全和可靠性证明
      - - 竞争对手用更低成本复刻控制平面叙事
        - 差异化塌成同质功能
        - 8090 独有的量化结果
    notes: 这些公开信息条件最容易迅速打破溢价估值故事。
