      - number: '6.4'
        title: 留存、耐久性与仍缺什么
        blocks:
          - type: paragraph
            body: >-
              公开记录里的耐久性故事更多是概念性的，而不是已经被测量。产品架构暗示平台可能具备粘性，因为需求、蓝图、工单、产物和代码上下文会随时间沉淀。反馈工作流和支持界面强化了这种直觉，因为它们把产品绑定到真实用户信号和组织级管理上。但这些都不能替代真实留存数据。公开资料没有
              NRR、GRR、流失、合同期限、部署数量或客户队列数据。因此，客户章节最后只能给出一个简单判断：参考客户质量有意义，留存逻辑可成立，可衡量的耐久性在公开材料中仍未证明。


              因此，公开记录支撑的是留存假设，不是留存结论。工作流嵌入、项目级管理和反馈回路都指向正确方向，但它们都不能替代续约队列、客户访谈或收入留存数据。客户耐久性因此仍是最高优先级的私下尽调问题之一。
            claimRefs:
              - CU024
              - CU025
              - CU026
              - CU027
              - CU028
