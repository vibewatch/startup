disclaimer: >-
  本报告是截至 2026-07-12 基于公开信息编制的尽调快照，不构成投资建议。8090 仍未披露多项对投资判断至关重要的输入，尤其是财务报表、客户留存数据、
  安全背书材料深度和股权结构权利条款；任何投资决策都应以面向管理层的直接尽调和更完整的私有数据室为前提。
