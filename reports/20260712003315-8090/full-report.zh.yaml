  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：谁真的在和 8090 竞争
        blocks:
          - type: paragraph
            body: >-
              8090 的竞争集合比一张代码助手名单更宽。只要买方试图在企业约束下减少软件交付摩擦，8090 就会遇到竞争。这包括 GitHub Copilot 和 Cursor 这样的直接编码 copilot，Replit
              Agent 这样的应用生成产品，Salesforce Agentforce 这样的企业 agent 套件，以及 Power Platform、Appian、OutSystems
              这样的低代码或编排在位厂商。Factory 也相关，因为它营销的是更 agent 原生、超出 IDE 辅助的 SDLC 叙事。关键的现实洞察是，8090
              并不是在争夺一条干净的单一预算线。它要竞争的是买方认为最能安全地从需求走到生产软件、且组织痛感最低的任何工具、平台或集成商。


              因此，这不是一组干净的同口径比较。8090 同时与 AI 编码助手、应用生成 agent、低代码平台和咨询带动的交付系统重叠。这样的宽度扩大了攻击面，因为买方可以用相邻工具解决部分问题，而不必采用一个端到端平台。
