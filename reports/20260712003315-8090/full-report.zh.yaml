  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立假设与产品框定
        blocks:
          - type: paragraph
            body: >-
              8090 仍处在足够早期的阶段，公司概览不能只概括一份已经成熟的上市公司事实表，而要为整份报告定锚。公开记录在基础事实上一致：8090 于 2024 年 1 月推出，位于 Menlo
              Park，并把自己定位为面向受监管企业的 AI 原生软件工厂。更重要的信号，是公司如何持续定义问题。无论是官网首页、Software Factory 页面还是文档，8090
              都主张企业软件失败的原因在于需求、架构决策和组织知识在工具与人员之间漂移。这个框定有意把公司从狭窄的「AI 代码自动补全」类别推向控制平面假设：业务意图、文档、工单和生产交付要保持同步。


              关键也在这里。买方购买的不是单纯代码生成，而是一套减少需求漂移、保留架构理由，并让多方参与的交付过程可审计的方法。在受监管场景里，上游纪律可能与下游代码质量同样重要，因此 8090 的叙事需要从通用
              copilot 叙事里单独拆开看。
