      - number: '8.2'
        title: 当前定价语境与可比框架
        blocks:
          - type: paragraph
            body: >-
              公开资料中最重要的估值事实就是融资本身：多家媒体把 8090 的 2026 年 6 月 A 轮与约 $1B
              估值相连。这会立刻把公司放进独角兽区间，也意味着投资人已经在为大量未来执行付费。公开可比公司无法给出完美答案，因为类别与开发者工具、企业
              agent、低代码平台和服务驱动软件重叠。但它们至少说明一点：更成熟的平台通常披露更多、证明更多，而 8090 目前还做不到。


              外部市场评论有助于解释投资人为什么愿意为 AI 工作流公司付费。许多人相信，价值会在贴近客户问题的应用层和操作系统层集中。这支撑了对 8090
              的兴趣。但它并不能回答围绕毛利率、留存、集中度或服务构成的具体承销问题，而这些问题决定了价格是有吸引力，还是只是可以理解。
