      - number: '1.4'
        title: 商业模式、交付责任与未解缺口
        blocks:
          - type: paragraph
            body: >-
              8090 这样年轻的私营公司，定价和打包异常明确。自助版 Software Factory 标价为每用户每月 $200，另加 token 用量；8090 Enterprise
              则把托管、维护、安全和交付责任打包进托管方案。这个拆分说明公司既卖软件，也卖结果。同时，它也提出了毛利结构、服务强度和锁定效应上的尽调问题，因为 8090 称客户拥有业务逻辑，而托管层的代码库 IP 和交付责任由
              8090 持有。同样值得注意的是缺口。公开资料没有披露 ARR、收入构成、现金消耗、员工数或客户数，因此公司概览能确认真实产品、真实融资和真实企业兴趣，却无法给出完整投资判断视图。


              缺失指标因此格外重要。没有公开收入构成、毛利率、现金消耗或客户数量数据，公开材料可以验证商业意图和产品严肃度，却无法证明这家公司已经像可规模化软件业务那样运转，而不是一台有前景但人力密集的交付引擎。
