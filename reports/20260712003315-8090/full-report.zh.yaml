      - number: '3.3'
        title: 分发、信任与切换成本
        blocks:
          - type: paragraph
            body: >-
              分发能力和信任，是在位厂商压过年轻创业公司的地方。GitHub 可以搭上既有代码库和开发者工作流。Microsoft 可以把 Power Platform 与更广的企业技术栈关系捆绑。Salesforce 可以把
              Agentforce 贴到 CRM 和服务预算上，Appian 或 OutSystems 则能从长期企业应用位置出发销售。Cursor 和 Factory 在把自主 agent
              与企业安全控制打包上，动作比传统在位厂商更快。因此，8090 与 EY
              的关系具备战略意义，因为它用外部企业信誉和服务触达，部分抵消了规模劣势。即便如此，一旦买方把文档、权限、提示词或生产工作流标准化到某个平台上，切换成本仍会很高，所以 8090
              必须证明它的控制平面路径能创造超过单点工具的持久价值。


              分发的重要性可以说不亚于功能深度。Microsoft、GitHub、Salesforce、Appian 和 OutSystems 都受益于既有客户基础或成熟企业采购渠道，Cursor 和 Replit
              则受益于快速产品迭代和开发者心智。EY 能为 8090 抵消部分劣势，但合作伙伴杠杆不等于自有分发。
