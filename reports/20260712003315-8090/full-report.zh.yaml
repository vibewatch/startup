      - number: '7.4'
        title: 财务 / 模式风险与假设破裂触发点
        blocks:
          - type: paragraph
            body: >-
              公司最大的承销风险仍是不透明。公开记录没有披露收入、ARR、毛利率、现金消耗、按收入计的客户集中度或续约质量。近期强融资降低了即时生存风险，但没有回答商业模式能否在下一轮融资前跑出持久经济性。假设破裂触发点很实际：托管交付压过软件杠杆的证据；安全或治理证明落后于买方预期的证据；合作伙伴集中度主导客户形成的证据；或者竞争平台借助更广分发，以更低成本匹配
              8090 控制平面主张的证据。


              最重要的投资风险不是一次灾难性事件，而是投资假设缓慢磨损。如果客户广度保持浅薄、信任证明保持稀疏，而竞争对手继续向同一工作流叙事靠拢，估值逻辑会在产品不再有趣之前就先变弱。因此，否决条件应围绕证明质量和杠杆，而不是产品是否存在。
