        title: 收入模式：订阅座席、用量与托管交付
        blocks:
          - type: paragraph
            body: >-
              公开定价和管理文档显示，8090 通过座席订阅、token
              用量和托管企业交付变现。产品有清晰的商业化界面，但没有披露构成。这个设计对企业买方很灵活，但也意味着外部人看不出收入中有多少是经常性软件、多少是服务。组织和用量文档很重要，因为它们显示计费模型面向多用户、多项目账户，而不只是个人开发者。尽管实际数字仍未公开，这仍支撑了一条严肃的企业变现路径。


              公开定价让 8090 比许多 AI 创业公司更容易读懂，但并没有让收入模式完全透明。公司看起来通过座席、token
              消耗和托管交付范围的组合变现。这有吸引力，因为它提供了多条变现杠杆；但它也让收入质量分析更复杂，因为每条杠杆的毛利和规模化曲线都不同。投资人不仅要知道目录怎么写，还要知道哪些产品表面真正拉动实际收入。
