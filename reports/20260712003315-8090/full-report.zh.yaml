        - 关键
      - - 客户名单、部署状态、续约、集中度
        - 验证需求质量和韧性
        - 关键
      - - 安全 / 信任中心材料包与 SLA 证据
        - 验证是否适配监管型企业
        - 高
      - - 董事会、股权结构和融资权利细节
        - 厘清稀释和控制权经济性
        - 高
      - - 合作伙伴与直销销售管线结构、赢单 / 输单记录
        - 验证 GTM 独立性和竞争压力
        - 高
    notes: 最终尽调问题把估值争议落到一份具体的私有数据清单。
    claimRefs:
      - CV028
      - CV029
      - CV031
