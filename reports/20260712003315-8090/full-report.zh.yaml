              Chamath Palihapitiya 是公开资料里的绝对重心。2026 年 6 月融资报道称他出任 CEO，第三方报道仍通过 Social Capital、All-In
              播客和更广泛的明星投资人背景介绍他。这样的可见度有助于招聘、融资和获取关注，但也带来关键人物依赖，因为已审阅公开记录没有展示同等可见的运营班底，或详细的 A 轮后董事会名单。8090
              确实有上线的隐私和条款文件、具名法律实体，以及面向合作伙伴的企业叙事，这比隐身状态强。但治理透明度看起来仍是够用，而不是成熟。


              因此，治理尽调的重点不应停留在公司是否有网站和政策——它显然有——而应放在运营、商业和声誉控制是否集中在一位创始人 CEO 身上。早期集中可以加快决策，但也带来继任、团队厚度和声誉波动问题。
