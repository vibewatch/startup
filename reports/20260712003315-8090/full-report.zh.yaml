      - number: '3.4'
        title: 护城河耐久性与 8090 仍可能输在哪里
        blocks:
          - type: paragraph
            body: >-
              8090
              确实有一个可成立的护城河故事，但它是有条件的，不是绝对的。最强差异点不是原始模型访问，而是把意图、需求、蓝图、工单和生产责任连接起来的结构化工作流。在可追溯性成为董事会层级要求的受监管环境里，这一点可能重要。问题在于，所有严肃竞争者也都在冲向围绕治理、上下文或自主性的「企业级」语言。如果
              GitHub、Cursor、Salesforce 或低代码在位厂商能把类似控制与更广的既有客户基础结合起来，8090 就可能被定位为一套不错的方法论，而不是必选平台。因此，护城河取决于 8090
              能否把文档纪律和企业控制转化为可衡量的部署结果，且这些结果难以被买方用自己已拥有的在位技术栈复制。


              因此，护城河问题归根结底是：8090 是在创造可持续积累的工作流数据和运营杠杆，还是在位厂商能把同一套故事吸收到更大的平台里。如果前者成立，公司会具备战略价值。如果后者成立，竞争溢价会迅速收窄。
