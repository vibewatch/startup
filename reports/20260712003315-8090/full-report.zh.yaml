            body: >-
              模块栈很清楚。Requirements 捕捉产品意图。Blueprints 将其转成技术指引。Work Orders 把上下文充足的任务打包给执行端。Feedback
              把终端用户信号转成主题和连接后的工作。Artifacts 和代码库连接为 agent 提供源材料和代码库上下文。Quickstart 和 Agent Skill 显示，执行可以通过 MCP 延伸到外部编码
              agent。贯穿其中的主线，是连接文档、代码和决策的知识图谱。


              因此，架构故事有两层。对内，8090 想在需求、蓝图、产物和代码库之间保持持久上下文。对外，它需要接入企业买方日益标准化的更广 agent 和工具生态。随着集成增加，如果上下文完整性仍能守住，这个组合会变得强大。


              战略结论是，8090 同时在构建产品表面和上下文管理纪律。任一侧变弱，整个受治理交付假设都会更容易被更大平台模仿。
