  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：不只是编码助手
        blocks:
          - type: paragraph
            body: >-
              理解 8090 市场的最干净方式，不是把它塞进一个纯粹的单品类别，而是把它看成一组软件交付预算的组合。公司工作流属性太重，不能像狭窄的编码 copilot
              那样估值；但它又足够软件原生，不能只按咨询来理解。它的实际市场包括 AI 编码助手、低代码和编排平台、内部工程团队、遗留系统现代化项目，以及系统集成商主导的转型预算。8090
              反复强调控制、文档和可审计性，原因就在这里。它试图把对话从「谁写代码最快？」转向「谁能把企业意图转成生产系统，同时不丢上下文？」Appian、Power Platform 和 Agentforce
              的公开定位也印证了这个框定，因为它们争夺的是上游工作流和下游执行，而不只是代码生成。


              这个区别对测算市场空间很重要。如果 8090 只是编码助手，它的支出会更窄地映射到开发者座席预算。既然它主张连接需求、蓝图、工单、上下文和交付，它争夺的是更宽的转型预算，通常横跨工程、产品和运营。
