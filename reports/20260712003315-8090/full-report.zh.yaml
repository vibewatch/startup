      - number: '6.3'
        title: 采用动作：合作伙伴杠杆、工作流嵌入与扩张潜力
        blocks:
          - type: paragraph
            body: >-
              8090 可能的采用动作，不是从随意试验开始，而是从高风险工作流问题开始。买方需要相信平台能以降低组织风险的方式梳理需求、架构和执行。这与 EY
              主导的转型项目相契合，也适合那些想要托管交付、而不是自己配齐整套运营模型人员的客户。一旦采用，扩张可以通过更多座席、更多项目、更多代码库和更深运营使用发生，因为平台围绕组织和项目层级组织，而不是围绕孤立个人提示词。挑战在于，如果少数大客户或一个主导渠道占比过高，同一套动作也可能遮蔽集中度风险。


              这形成了一条合理但要求很高的商业路径。扩张可能取决于先在一个工作流中证明价值，再长到相邻团队、项目和代码库。如果执行强，这条路径能带来大账户；但如果只有少数关系贡献了大部分进展，它也会掩盖集中度。
