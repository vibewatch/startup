      - number: '8.4'
        title: 建议、信心与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于公开信息的正确建议是继续研究，不是因为公司缺少前景，而是因为估值已经假设了足够多前景，缺失数据因此变得重大。信心为中等：资料足以支持真实产品、真实融资和真实企业兴趣的存在，但不足以支撑一个干净的入场价格。关键尽调问题很直接：证明类似软件的经济性，证明客户广度不止
              EY 和少数客户证言，证明更强的正式信任材料，证明控制平面假设能交付竞争者无法低成本复制的结果。


              好的估值章节应缩窄决策，而不是假装消除不确定性。这里的缩窄有用：8090
              太真实，不能忽视；战略定位太强，不能轻易否定；公开信息又太不透明，不能在当前估值下直接认可。投资问题不是这家公司是否重要，而是私下尽调能否把战略可成立性转成持久经济信念。


              外部市场文章有助于解释投资人为什么关注应用层和工作流层 AI 公司，但它们不能替代对入场价格和证明质量的纪律。
