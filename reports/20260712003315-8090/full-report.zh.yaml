      - number: '3.2'
        title: 能力与打包对比
        blocks:
          - type: paragraph
            body: >-
              公开竞品材料让能力重叠一目了然。GitHub Copilot 强调覆盖软件开发生命周期的上下文化辅助，但根基仍是开发者生产力和代码库上下文。Cursor 更用力地推进 agent 自主性和企业控制。Replit
              强调应用生成、内置服务和浏览器测试回路，面向更宽的用户群。Agentforce 把问题框定为企业 agent 部署和客服转型；Power Platform、Appian 和 OutSystems
              则销售治理很重的应用和工作流平台。8090 自己的卖点足够不同，值得关注——它从更上游的意图、文档和规格纪律切入——但还没有不同到能在采购中避开逐功能比较。


              因此，能力比较应聚焦工作流控制、可追溯性和交付模式，而不是只看聊天质量。有些对手分发更广，有些开发者体验更深，有些正式企业打包更强。8090 的任务，是证明它的上游运营模式能产出这些相邻产品难以匹配的结果。
