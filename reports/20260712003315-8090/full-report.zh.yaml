      - number: '7.2'
        title: 运营、安全与质量控制风险
        blocks:
          - type: paragraph
            body: >-
              运营风险来自产品架构本身。8090
              不只是建议引擎；它触及需求、架构、代码上下文、工单排序，并且在托管层承担生产责任。这意味着故障可能沿工作流、支持或生产交付传播，而不是停留在一个聊天提示词里。公开文档支持若干真实控制，例如只读代码库索引、组织级管理、用量控制和结构化审阅回路，但没有提供正式可用性、事故或认证证据。


              运营风险同样与产品设计缠在一起。因为 8090
              销售的是工作流控制，并且在部分情况下销售托管交付，事故不会只被视为软件缺陷，而会被视为流程完整性、支持和治理失败。相对轻量级开发者工具，可靠性弱、信任材料稀疏或服务承诺不清的成本会更高。


              更大生态正在教育买方要求明确的 AI 控制叙事，安全和治理预期因此上升。稀疏信任打包给 8090 带来的，既是运营风险，也是竞争风险。
            claimRefs:
              - CR009
