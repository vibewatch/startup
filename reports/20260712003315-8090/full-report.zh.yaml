      - number: '1.3'
        title: 资本形成、合作伙伴杠杆与早期分发
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 A 轮融资，是 8090 公开记录里最清楚的硬事实。公司和第三方报道在 $135M 这个融资金额上口径一致，也都显示 Salesforce Ventures 领投，WndrCo、Craft
              Ventures、The Production Board 和 LAUNCH 等参投。意义不止于信号。AI 原生交付平台需要资金支持招聘、上市销售，以及模型或基础设施消耗，这轮融资看起来正是为三者供弹。EY
              关系在运营上可能比融资本身更重要。EY.ai PDLC 给 8090 打开了进入受监管买方的路径，也提供了公开生产力叙事；但它也让合作伙伴集中度成为真实尽调问题，因为一个联盟主导了早期外部证明集。


              这项合作也改变了投资人解读业务进展的方式。大型系统集成商路径可以更快接触企业问题和预算，但也会模糊独立软件需求与合作伙伴带动项目需求之间的边界。等公司需要证明可复制性不只来自一个标杆渠道时，这个区别会变得关键。
