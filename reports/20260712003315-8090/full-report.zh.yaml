      - number: '2.4'
        title: 规模判断：机会很大，近期滩头阵地较窄
        blocks:
          - type: paragraph
            body: >-
              公开证据足以说明机会很大，但不足以支撑一个精确的软件工厂 TAM。这个类别与 AI
              编码、低代码应用开发、工作流编排、内部工程支出和现代化项目重叠，因此任何单一自上而下数字都会误导。更可辩护的看法是务实判断：8090 的近期滩头阵地，是需要大量软件现代化、且愿意在强治理下采用 AI
              原生交付模式的大型受监管企业子集。这个市场小于广义企业软件市场，但大于纯开发者 copilot 类别。EY 渠道有帮助，因为它能快速打开这个细分市场的大门；但现实 SOM
              仍取决于合作伙伴杠杆、参考部署和买方风险承受度，而不是表层 AI 市场本身有多大。


              因此，最好的市场读法是分层机会：今天是较窄的软件交付工具市场；如果执行守住，就会扩展到更宽的工作流和现代化控制市场；如果买方接受上游编排成为独立预算线，还可能进入更大但更具猜测性的企业 agent 市场。
