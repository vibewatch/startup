  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              企业 AI 周围的法律和监管环境仍未稳定，这直接影响 8090，因为产品目标是在受治理条件下生成生产软件。NIST 的 AI Risk Management Framework
              强化了为什么信任、监督和问责必须内建进部署。Copyright Office 正在推进的 AI 倡议，突出了围绕训练、输出和所有权规范的未解问题。FTC 关于 AI 合作关系和 AI
              合规执法的材料显示，集中度、对外陈述和治理不是抽象政策话题，而是执法向量。8090 发布了隐私和条款文件，但公开记录没有展示更完整的信任中心材料包。


              监管和法律风险在这个类别里并不抽象。买方会把专有业务逻辑、代码生成、工作流历史和潜在第三方模型基础设施组合在一起。由此产生的暴露，涉及声明可证实性、训练数据来源、输出所有权和留存做法。即使一家公司在产品价值方向上判断正确，如果这些问题仍未说清，也可能制造昂贵的采购摩擦。
            claimRefs:
