  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正向假设与反向假设
        blocks:
          - type: paragraph
            body: >-
              正向假设很直观：8090 试图占据比普通编码 copilot
              更高价值的软件交付栈环节，而且这在受监管环境中应比业余软件场景更重要。反向假设同样清楚：一家公司可以听起来具备战略意义，却仍跑不出类似软件的经济性或持久客户广度。没有公开
              ARR、毛利率、留存或客户数量披露时，投资人其实是在用有限运营证据，承销一条高溢价类别叙事。


              这正是那类会先显得显然重要、再证明是否显然值得投的公司。战略故事连贯，融资和合作伙伴证明也让它难以被当作空气项目。但高溢价私募定价要求投资人相信的，不只是类别重要，还包括这家具体公司能用健康经济性和比当前公开材料更宽的参考客户深度抓住这个类别。
