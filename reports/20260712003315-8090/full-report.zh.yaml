        - label: 试点 / 托管项目启动
          value: 20
        - label: 更广泛的组织嵌入
          value: 10
    claimRefs:
      - CU001
      - CU016
      - CU023
      - CU018
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    summary: 公开验证材料更强的是背书质量，而不是已披露客户标识的广度。
    data:
      columns:
        - 验证质量
        - 广度信号
        - 独立性
      rows:
        - label: EY.ai PDLC 合作
          values:
            - 高
            - 中
            - 合作伙伴
        - label: ShadowTech Solutions
          values:
            - 中
            - 低
            - 客户
        - label: Mach33 Financial Group
          values:
            - 中
            - 低
            - 客户
        - label: Tie
          values:
            - 中
            - 低
            - 客户
        - label: 竞品案例库
          values:
            - 高
            - 高
            - 竞品营销
    claimRefs:
      - CU007
      - CU014
      - CU015
  - id: FU004
    title: 留存 / 复购队列
    type: matrix
    summary: 公开证据能解释粘性来自哪里，但没有披露客户队列数据。
    data:
      columns:
        - 证据强度
        - 指标披露
      rows:
        - label: 工作流嵌入
          values:
            - 高
            - 低
        - label: 反馈集成
          values:
            - 中
            - 低
        - label: 组织管理
          values:
            - 中
            - 低
        - label: 公开续约 / NRR 数据
          values:
            - 低
            - None
    claimRefs:
      - CU024
      - CU025
      - CU027
      - CU031
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高严重度风险集中在财务不透明、集中度和公开验证缺口。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 低影响
          values:
            - 轻微路线图不透明
            - ''
            - ''
        - label: 中影响
          values:
            - 声誉拖累
            - AI 政策不确定性
            - 快速发布导致体验倒退风险
        - label: 高影响
          values:
            - ''
            - 合作伙伴与关键人物集中
            - 财务不透明与安全验证缺口
    claimRefs:
      - CR025
      - CR018
      - CR017
      - CR013
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 集中度、正式验证缺口和经济性不透明，都可能传导为销售周期拉长或融资压力。
    data:
      nodes:
        - id: proof
          label: 安全 / 信任验证缺口
        - id: sales
          label: 更长销售周期
        - id: partner
          label: 合作伙伴集中
        - id: pricing
          label: 定价权风险
        - id: finance
          label: 未来融资压力
        - id: economics
          label: 单位经济性不透明
      edges:
        - from: proof
          to: sales
        - from: partner
          to: pricing
        - from: economics
          to: finance
        - from: sales
          to: finance
        - from: partner
          to: finance
    claimRefs:
      - CR013
      - CR018
      - CR025
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: 公开依赖链围绕 Chamath、EY、Salesforce、GitHub 访问权限和第三方模型提供商展开。
    data:
      nodes:
        - id: chamath
          label: Chamath
        - id: ey
          label: EY
        - id: sf
          label: Salesforce
        - id: models
          label: 模型提供商
        - id: github
          label: GitHub 访问权限
        - id: product
          label: 8090 平台
      edges:
        - from: chamath
          to: product
        - from: ey
          to: product
        - from: sf
          to: product
        - from: models
          to: product
        - from: github
          to: product
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR010
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议逻辑基于真实产品、真实资本和企业端确有兴趣；但经济性缺失、验证集中，也限制了 投资确信。
    data:
      nodes:
        - id: product
          label: 真实产品 + 工作流命题
        - id: capital
          label: $135M 融资 + EY 渠道
        - id: proof
          label: 有意义但集中的验证
        - id: opacity
          label: 无公开 ARR / 利润率 / 留存
        - id: result
          label: 继续研究 / 估值偏高
      edges:
        - from: product
          to: result
          label: 支撑兴趣
        - from: capital
          to: result
          label: 支撑可信度
        - from: proof
          to: result
          label: 仍不完整
        - from: opacity
          to: result
          label: 阻碍确信
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV024
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 最关键的敏感变量，是能否证明软件型经济性、客户广度、信任验证和竞争差异化。
    data:
      items:
        - label: 经济性验证
          value: 10
        - label: 客户广度
          value: 9
        - label: 信任 / 安全验证
          value: 8
        - label: 竞争差异化
          value: 8
        - label: 合作伙伴杠杆持续性
          value: 7
    claimRefs:
      - CV019
      - CV023
      - CV028
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 公开信息只能支撑很宽的估值结果区间，因为运营验证仍不完整。
    data:
      items:
        - label: 乐观情形投资把握
          low: 1200
          high: 1800
          unit: USD M
          note: 需要强有力的非公开证据，证明软件型经济性和广泛客户牵引力
        - label: 基准情形投资把握
          low: 700
          high: 1100
          unit: USD M
          note: 需要部分验证，但仍能容忍局部不透明
        - label: 悲观情形投资把握
          low: 300
          high: 700
          unit: USD M
          note: 如果服务强度和验证缺口主导叙事
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV014
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 对外披露的估值数字已知；能公开支撑该估值的运营 KPI 还没有。
    data:
      items:
        - label: 公开估值锚点
          value: ~$1B
          status: verified
        - label: 已融资金额
          value: $135M
          status: verified
        - label: 公开 ARR
          value: Undisclosed
          status: gap
        - label: 公开留存指标
          value: Undisclosed
          status: gap
        - label: 公开客户数
          value: Undisclosed
          status: gap
    claimRefs:
      - CV009
      - CV005
      - CV031
