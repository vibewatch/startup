      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >-
              在牛市情景下，8090 把 EY
              带来的访问权转化为更广泛的具名企业部署，证明驱动持久价值的是平台，而不只是托管交付，并开始披露支持软件式毛利画像的指标。在基准情景下，它建立起一门严肃但仍集中的企业业务，服务强度有意义，经济性清晰度只有部分改善。在熊市情景下，产品仍具战略吸引力，但被在位工作流平台、开发者
              agent 工具和托管交付的运营负担夹击。


              因此，情景分析应绑定证据门槛，而不是泛泛乐观。牛市情景需要更广的独立客户证据、类似软件的毛利表现，以及围绕受治理交付的持续差异化。熊市情景不要求产品失败；只要经济性和广度追不上估值叙事，而相邻竞争者持续靠拢，就足够成立。
            claimRefs:
              - CV016
