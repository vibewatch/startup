      - number: '7.3'
        title: 依赖、集中度与人员风险
        blocks:
          - type: paragraph
            body: >-
              从公开视角看，依赖图谱异常集中。Chamath Palihapitiya 是主导运营者和叙事者。EY 是主导合作伙伴证明点。Salesforce
              是主导投资人品牌。这些资产有帮助，但合在一起形成了一种风险模式：战略杠杆和叙事集中度落在同一小组关系里。模型和云依赖也是背景风险，因为 Usage
              文档明确展示第三方模型定价。公开记录还缺少完整董事会和股权结构表视图，限制了外部对决策权的可见度。


              依赖风险不只限于传统供应商集中。公司依赖合作伙伴杠杆、外部模型生态和一位高可见度创始人
              CEO。在顺风环境下，每一项都能加速增长；但如果合作伙伴调整优先级、平台改变标准，或领导者注意力分散，每一项也都可能放大波动。
