      - number: '2.3'
        title: 约束：治理、锁定与成本可预测性
        blocks:
          - type: paragraph
            body: >-
              同一组证据既让类别有吸引力，也解释了采用为何困难。企业 AI 部署受治理、集成复杂度、用量成本不确定性和法律模糊性限制。FTC 的合作伙伴关系报告解释了买方为什么担心云、模型和分发锁定。NIST 和
              Copyright Office 则表明，信任和政策问题仍在变化。定价模型同样重要。8090 的 token + 座席结构对年轻 AI 平台来说商业上合理，但它带来了许多 AI
              产品都会遇到的可预测性问题：采用越快成功，如果没有强控制，总支出就越难预测。公开在位厂商在这里重要，不只是因为它们是竞争对手，也因为它们为企业买方如何思考采购、安全和总成本提供参照。


              同时，这个市场并不顺滑。买方仍担心数据控制、可靠性、采购复杂度，以及承诺的生产力提升能否在生产环境持续。这些摩擦有利于能证明治理和结果的供应商，但也会拖慢类别扩张，并扩大试点与规模化部署之间的距离。
