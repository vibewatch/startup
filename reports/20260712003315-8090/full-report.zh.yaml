      - number: '2.2'
        title: 采用驱动：AI 压力叠加遗留痛点
        blocks:
          - type: paragraph
            body: >-
              需求侧压力是真实的。Deloitte、IBM、McKinsey、GitHub、Microsoft 和 EY 都记录了同一个世界：企业被要求交付更多软件、现代化遗留系统，并在治理上强于临时拼凑式 AI
              试验。在这种环境下，8090 切入受监管企业是合理的，因为这些买方同时承受两股力量：他们想更快交付，但无法容忍无文档工作流、模糊决策权责或不可追溯的 AI 输出。经济买方可能是 CIO、CTO
              或数字化转型负责人，用户则横跨产品经理、架构师、工程师、QA 和业务干系人。销售周期因此更慢，但合同表面也比自下而上的开发者工具更宽。


              公开需求研究也说明企业为什么现在在意。生成式 AI 不再只被当作生产力新奇物来评估；它越来越多地绑定预算压力、现代化时间表和资深交付人才短缺。这个背景解释了为什么工作流治理故事能打动大型买方。
