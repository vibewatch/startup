            body: >-
              尽管客户名单并不清楚，8090 的目标客群很清楚。公开材料把公司定位在受监管企业和复杂现代化工作流。买方可能是医疗、金融服务、制造，以及与政府业务相邻环境里的
              CIO、数字化转型负责人和工程负责人。产品页和托管交付页也暗示两条现实采用路径：一类是想要软件交付控制平面的自助团队；另一类是希望 8090 为其构建并运营软件的企业发起人。这是高
              ACV、客户标识密度低的策略，而不是自下而上的规模化获客动作。


              这个模式意味着客户数量可能较窄，但复杂度很高。在企业软件交付类别里，这很常见，因为信任、集成深度和跨职能变革管理，比轻松注册增长更重要。它也意味着，每个公开客户标识在投资人解读中的权重，都会高于广泛自助 SaaS
              动作里的同类客户标识。
