chapter:
  number: 1
  title: Company Overview
  summary: 8090 is a Menlo Park startup founded in January 2024 around an AI-native “software factory” thesis for regulated enterprises. Public evidence confirms a June 2026 $135 million Series A led by Salesforce, Chamath Palihapitiya’s move into the CEO role, an EY distribution partnership, and a commercial split between self-serve Software Factory and a managed enterprise-delivery offering. The same record leaves classic underwriting gaps around revenue, headcount, cap table, and customer-count disclosure.
sections:
- id: identity-and-thesis
  title: Identity, founding thesis, and product framing
  body: '8090 is still early enough that the company overview has to anchor the rest of the report, not just summarize an already mature public-company fact sheet. The public record is consistent on the basics: 8090 launched in January 2024, is associated with Menlo Park, and positions itself as an AI-native software factory for regulated enterprises. The more important signal is how consistently the company frames the problem. Across the homepage, Software Factory page, and documentation, 8090 argues that enterprise software fails because requirements, architectural decisions, and institutional knowledge drift across tools and people. That framing intentionally pushes the company out of the narrow “AI code autocomplete” category and toward a control-plane thesis in which business intent, documentation, work orders, and production delivery stay synchronized.


    That matters because buyers are not just purchasing code generation. They are purchasing a way to reduce requirements drift, preserve architectural rationale, and keep delivery auditable across many stakeholders. In regulated settings, that upstream discipline can matter as much as downstream code quality, which is why 8090’s framing deserves separate attention from generic copilot narratives.'
