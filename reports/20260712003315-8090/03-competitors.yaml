- id: moat-durability
  title: Moat durability and where 8090 could still lose
  body: '8090 does have a plausible moat story, but it is conditional rather than absolute. Its strongest differentiator is not raw model access; it is the structured workflow that links intent, requirements, blueprints, work orders, and production accountability. That can matter in regulated environments where traceability is a board-level requirement. The problem is that every serious competitor is also racing toward “enterprise-grade” language around governance, context, or autonomy. If GitHub, Cursor, Salesforce, or a low-code incumbent can pair similar controls with broader installed-base leverage, 8090 risks being positioned as a nice methodology rather than a mandatory platform. The moat, therefore, depends on whether 8090 can turn documentation discipline and enterprise control into measurable deployment outcomes that are hard for buyers to replicate with incumbent stacks they already own.


    The moat question therefore comes down to whether 8090 is creating durable workflow data and operating leverage, or whether incumbents can absorb the same story into broader platforms. If the former is true, the company can be strategically valuable. If the latter is true, the competitive premium narrows quickly.'
