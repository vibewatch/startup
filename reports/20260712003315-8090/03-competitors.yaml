- id: distribution-and-lockin
  title: Distribution, trust, and switching cost
  body: 'Distribution power and trust are where incumbents can overwhelm a young startup. GitHub can piggyback on the existing repository and developer workflow. Microsoft can bundle Power Platform with broader enterprise stack relationships. Salesforce can attach Agentforce to CRM and service budgets, and Appian or OutSystems can sell from a long-standing enterprise-app position. Cursor and Factory have moved faster than classic incumbents in packaging autonomous agents with enterprise security controls. 8090’s EY relationship is therefore strategically important because it partially offsets its size disadvantage by importing enterprise credibility and services reach. Even so, switching cost will remain high once a buyer standardizes documentation, permissions, prompts, or production workflows on one platform, so 8090 must prove that its control-plane approach creates durable value beyond a point tool.


    Distribution arguably matters as much as feature depth. Microsoft, GitHub, Salesforce, Appian, and OutSystems all benefit from installed bases or mature enterprise procurement channels, while Cursor and Replit benefit from fast product velocity and developer mindshare. 8090 offsets some of that disadvantage with EY, but partner leverage is not the same thing as owned distribution.'
  claimRefs:
  - CP022
  - CP023
  - CP024
  - CP025
