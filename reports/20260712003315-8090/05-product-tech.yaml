  - FE002
- id: architecture
  title: 'Architecture: modules, knowledge graph, and integrations'
  body: 'The module stack is explicit. Requirements capture product intent. Blueprints translate it into technical guidance. Work Orders package context-rich tasks for execution. Feedback turns end-user signals into themes and linked work. Artifacts and codebase connections feed agents with source materials and repository context. Quickstart and Agent Skill show that execution can extend into external coding agents through MCP. The through-line is the knowledge graph linking documents, code, and decisions.


    The architecture story therefore has two layers. Internally, 8090 wants to maintain durable context across requirements, blueprints, artifacts, and repositories. Externally, it needs to plug into the wider agent and tooling ecosystem that enterprise buyers are increasingly standardizing around. That combination can become powerful if context integrity remains strong as integrations multiply.


    The strategic takeaway is that 8090 is building both a product surface and a context-management discipline. If either side weakens, the whole governed-delivery thesis becomes easier for broader platforms to imitate.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
