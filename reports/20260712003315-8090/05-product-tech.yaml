chapter:
  number: 5
  title: Product & Technology
  summary: 8090’s product is a workflow system rather than a point AI tool. Public docs show a connected stack of Requirements, Blueprints, Work Orders, Feedback, artifacts, codebase indexing, organization administration, and MCP-connected external coding agents. The strongest technical differentiators are context engineering, traceability, and drift detection; the weakest public proof points are formal security collateral, uptime transparency, and roadmap specificity.
sections:
- id: definition
  title: 'Product definition: workflow system, not point assistant'
  body: '8090’s public docs consistently describe Software Factory as an SDLC orchestration environment. The workflow starts with product intent and requirements, moves through blueprints and work orders, and only then hands off to developers or coding agents. The product’s primary object is shared context, not just generated code. That is why the company talks about living documentation, knowledge graphs, auditability, and synchronized updates across modules.


    This breadth is strategically important because 8090 is not presenting itself as a single model wrapper. It is presenting itself as a structured software-delivery environment where intent, specification, execution, and feedback remain connected. That is a stronger product claim than autocomplete, but it also raises the bar on interoperability, product clarity, and implementation quality.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  tableRefs:
  - TE001
  - TE002
  figureRefs:
