  - CE042
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: deployment
  title: Deployment, integration, and maturity signals
  body: 'Quickstart and codebase docs show GitHub repository indexing through a GitHub App and automatic reindexing on pushes. Work Orders supports MCP connections for external coding agents. Organization and Usage docs show multi-user administration, seat limits, billing, and project-level drilldowns. The changelog shows rapid releases across drift detection, multi-repo support, unified agents, planning modes, and the Feedback rename from Validator. The platform looks alive and shipping quickly, but the roadmap page is thin and the public set does not expose uptime or incident detail.


    Deployment posture is equally central to the thesis. The company supports a self-serve product path, yet it also wraps hosting, maintenance, and operational responsibility into a managed enterprise model. That can help buyers move faster, especially in regulated settings, but it means product architecture and operating model cannot be evaluated separately. Reliability, support, and governance all become part of the technical product.'
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE027
  - CE028
  - CE025
  - CE026
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust
  title: Trust, privacy, security, and control surfaces
  body: '8090’s trust story is strong in workflow design and thinner in formal public security proof. The platform markets visibility, rationale capture, and structured review. Privacy and terms are live, the managed tier promises hosting and security, and codebase integration uses a read-only GitHub App model. Yet the reviewed public record does not show the kind of public trust center, certification list, or SLA detail that stronger enterprise vendors publish. That does not prove controls are weak; it proves the public proof pack is light relative to the ambition of selling into regulated industries.


    Trust remains the weakest part of the public technical record. 8090 clearly documents workflow controls, read-only repository access patterns, administration surfaces, and support paths. But the public package still looks lighter than a mature trust center or formal compliance program. For the regulated-enterprise thesis to fully hold, the company will eventually need more structured external proof on security, reliability, and service operations.


    Enterprise buyers will compare 8090 against a market that is steadily publishing more explicit AI-security and responsible-AI material, which raises the disclosure bar even when the underlying workflow idea is compelling.'
