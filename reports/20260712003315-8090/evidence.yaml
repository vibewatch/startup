evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-and-ownership
    missingEvidence: A current board roster, cap table, and governance-rights summary after the Series A.
    whyItMatters: Ownership, board control, and investor rights shape strategic flexibility and minority-investor outcomes.
    diligencePath: Request financing summary, board materials, and cap-table documents from management or counsel.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-burn
    missingEvidence: Absolute ARR, revenue mix, gross margin, burn, and runway figures tied to primary financial documents.
    whyItMatters: Without real financials the public overview cannot support underwriting or valuation confidence.
    diligencePath: Obtain current financial statements, board materials, and KPI dashboards during management diligence.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: independent-customer-scale
    missingEvidence: Independent customer-count, headcount, and deployment-scale data from non-founder, non-partner sources.
    whyItMatters: Current public proof is meaningful but still concentrated in company and partner narratives.
    diligencePath: Interview customers and implementation partners; request cohort, logo, and deployment metrics.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO005
  - type: private-evidence-only
    severity: material
    topic: leadership-and-enumeration-coverage
    missingEvidence: >-
      A fuller public leadership bench, board roster, investor-rights map, and milestone ledger tied to board or
      governance documents.
    whyItMatters: >-
      Enumeration tables on leadership, stakeholders, and milestones are necessarily partial because the public record
      does not disclose a fuller governance package.
    diligencePath: Request the post-Series-A board roster, governance documents, and fuller internal milestone record.
    relatedTableRefs:
      - TO002
      - TO003
      - TO006
  - type: missing-source
    severity: material
    topic: software-factory-tam
    missingEvidence: A neutral, public market study that sizes software-factory or AI-native SDLC orchestration as its own category.
    whyItMatters: Current sizing requires stitching together adjacent markets, which weakens precision.
    diligencePath: Request sell-side or private market studies from investors and compare against internal pipeline segmentation.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
      - TM004
  - type: private-evidence-only
    severity: material
    topic: reachable-som
    missingEvidence: >-
      Pipeline and win-rate data showing how much regulated-enterprise modernization spend is actually reachable by
      8090.
    whyItMatters: Headline market size does not tell us whether 8090 can capture the segment fast enough to justify valuation.
    diligencePath: Review CRM pipeline, partner-sourced funnel data, and vertical concentration with management.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-language
    missingEvidence: >-
      A consistent shared vocabulary separating AI coding, SDLC orchestration, low-code, and modernization across
      sources.
    whyItMatters: Category overlap can create false comparables and inflated TAM narratives.
    diligencePath: Normalize each comparable and pipeline opportunity by use case during full diligence.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Public win/loss data showing which competitor sets 8090 actually faces most often in enterprise evaluations.
    whyItMatters: Without direct win/loss data, the competitive map remains inference-heavy.
    diligencePath: Request pipeline stage data, RFP competitive notes, and post-mortems from management.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: apples-to-apples-pricing
    missingEvidence: A normalized public pricing comparison that adjusts for tokens, enterprise support, and managed-delivery scope.
    whyItMatters: >-
      The category mixes seats, usage, bundled services, and platform licensing, which makes headline pricing easy to
      misread.
    diligencePath: Build a normalized scenario model during diligence using vendor quotes and customer references.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin
    missingEvidence: Current ARR, revenue mix, gross margin, and contribution-margin data tied to internal financial statements.
    whyItMatters: Without actual financial statements the business cannot be underwritten cleanly.
    diligencePath: Request current monthly financial package, board deck, and cohort views.
    relatedQuestionRefs:
      - QI024
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Pipeline conversion, cycle length, ACV mix, and partner-versus-direct funnel data.
    whyItMatters: A hybrid enterprise software and delivery model is hard to judge without GTM-efficiency data.
    diligencePath: Request CRM funnel exports and quota / productivity metrics.
    relatedQuestionRefs:
      - QI015
      - QI023
  - type: private-evidence-only
    severity: material
    topic: formal-security-proof
    missingEvidence: Security certifications, penetration-testing summaries, uptime history, and trust-center-style collateral.
    whyItMatters: The product is being sold into regulated environments, so formal control evidence matters.
    diligencePath: Request trust-center materials, audit reports, and uptime data during diligence.
    relatedQuestionRefs:
      - QE025
      - QE024
    relatedTableRefs:
      - TE004
      - TE005
  - type: missing-source
    severity: material
    topic: roadmap-specificity
    missingEvidence: A substantive public roadmap that goes beyond generic release-subscription messaging.
    whyItMatters: Roadmap clarity affects buyer trust and the ability to assess future differentiation.
    diligencePath: Request roadmap briefings or customer roadmap decks during diligence.
    relatedQuestionRefs:
      - QE015
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: material
    topic: logo-and-deployment-depth
    missingEvidence: A broader set of named independent customers with deployment scope, start dates, and production status.
    whyItMatters: Current public proof is directionally encouraging but too concentrated to judge breadth.
    diligencePath: Request a customer roster, deployment scorecards, and reference calls.
    relatedQuestionRefs:
      - QU024
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-usage
    missingEvidence: NRR, GRR, churn, seat growth, project growth, and contract-length data by customer cohort.
    whyItMatters: Durability and customer quality cannot be underwritten on architecture logic alone.
    diligencePath: Request retention dashboards, cohort tables, and account-expansion histories.
    relatedQuestionRefs:
