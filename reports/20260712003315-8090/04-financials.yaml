chapter:
  number: 4
  title: Financials
  summary: 8090’s public financial story is shaped more by monetization surfaces and capital availability than by issuer-grade disclosure. The reviewed record confirms a hybrid model of seat subscriptions, token usage, and managed enterprise delivery; organization-level billing controls; and a recent $135 million Series A intended to fund hiring and infrastructure. It does not disclose ARR, revenue mix, gross margin, burn, or runway, so the financial chapter can assess model quality and capital intensity directionally but cannot underwrite the business on public numbers alone.
sections:
- id: revenue-model
  title: 'Revenue model: subscription seats, usage, and managed delivery'
  body: 'Public pricing and admin docs show that 8090 monetizes through seat subscriptions, token usage, and managed enterprise delivery. The product has clear commercial surfaces, but not disclosed mix. This is a flexible design for enterprise buyers, yet it also means outsiders cannot tell how much revenue is recurring software versus services. The organization and usage docs matter because they show the billing model is designed for multi-user, multi-project accounts rather than just for individual developers. That supports a serious enterprise monetization path even though the realized numbers remain private.


    Public pricing makes 8090 more legible than many AI startups, but it does not make the revenue model fully transparent. The company appears to monetize through a mix of seats, token consumption, and managed-delivery scope. That can be attractive because it offers multiple monetization levers, yet it also complicates revenue-quality analysis because each lever has a different margin and scaling profile. Investors need to know not only what the catalog says, but which product surfaces actually drive realized revenue.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI008
  tableRefs:
  - TI001
  - TI002
  figureRefs:
