chapter:
  number: 7
  title: Risks
  summary: '8090’s risk profile is that of a young but ambitious enterprise-AI platform: strong narrative momentum, meaningful partner leverage, and substantial recent capital, paired with public uncertainty on governance depth, formal security proof, customer concentration, services intensity, and the still-evolving legal and regulatory environment for AI-generated software. The dominant risks are execution and control risks that could compound if the company scales faster than its process maturity or disclosure quality.'
sections:
- id: regulatory-legal
  title: Regulatory and legal risk
  body: 'The legal and regulatory environment around enterprise AI remains unsettled, and that matters directly for 8090 because the product aims to generate production software under governed conditions. NIST’s AI Risk Management Framework reinforces why trust, oversight, and accountability must be built into deployment. The Copyright Office’s ongoing AI initiative highlights unresolved questions around training, outputs, and ownership norms. FTC materials on AI partnerships and AI-compliance enforcement show that concentration, representations, and governance are not abstract policy topics; they are enforcement vectors. 8090 does publish privacy and terms documents, but the public record does not reveal a richer trust-center package.


    Regulatory and legal risk is not abstract in this category. Buyers are combining proprietary business logic, code generation, workflow history, and potentially third-party model infrastructure. That creates exposure around claims substantiation, training-data provenance, output ownership, and retention practices. A company can be directionally right on product value and still create expensive procurement friction if these questions remain underspecified.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
