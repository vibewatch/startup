- id: dependency-and-people
  title: Dependency, concentration, and people risk
  body: 'The dependency map is unusually concentrated in public view. Chamath Palihapitiya is the dominant operator and narrator. EY is the dominant partner proof point. Salesforce is the dominant investor brand. Those assets are helpful, but together they create a risk pattern in which strategic leverage and narrative concentration sit in the same small set of relationships. Model and cloud dependence is also a background risk because Usage docs explicitly surface third-party model pricing. The public record also lacks a complete board and cap-table view, limiting outside visibility into decision rights.


    Dependency risk also matters beyond classic vendor concentration. The company depends on partner leverage, external model ecosystems, and a visible founder-CEO figure. Each of those can accelerate growth in a favorable environment, but each can also amplify volatility if a partner reprioritizes, a platform shifts standards, or leadership attention becomes fragmented.'
  claimRefs:
  - CR017
  - CR018
