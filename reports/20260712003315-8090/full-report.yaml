      - number: '5.4'
        title: Trust, privacy, security, and control surfaces
        blocks:
          - type: paragraph
            body: >-
              8090’s trust story is strong in workflow design and thinner in formal public security proof. The platform
              markets visibility, rationale capture, and structured review. Privacy and terms are live, the managed tier
              promises hosting and security, and codebase integration uses a read-only GitHub App model. Yet the
              reviewed public record does not show the kind of public trust center, certification list, or SLA detail
              that stronger enterprise vendors publish. That does not prove controls are weak; it proves the public
              proof pack is light relative to the ambition of selling into regulated industries.


              Trust remains the weakest part of the public technical record. 8090 clearly documents workflow controls,
              read-only repository access patterns, administration surfaces, and support paths. But the public package
              still looks lighter than a mature trust center or formal compliance program. For the regulated-enterprise
              thesis to fully hold, the company will eventually need more structured external proof on security,
              reliability, and service operations.


              Enterprise buyers will compare 8090 against a market that is steadily publishing more explicit AI-security
              and responsible-AI material, which raises the disclosure bar even when the underlying workflow idea is
