      - number: '4.4'
        title: 'Financial verdict: attractive structure, insufficient disclosure'
        blocks:
          - type: paragraph
            body: >-
              The public monetization design is directionally attractive: list pricing exists, enterprise packaging
              exists, organization-level billing exists, and the company is well funded. But public investors still
              cannot see ARR, revenue growth, gross margin, sales efficiency, or cohort durability. That leaves the
              right verdict as positive on model design, cautious on unit economics, and fundamentally blocked on
              disclosure depth. 8090 looks like a company that could become a strong software business, but public
              sources do not yet prove that it already is one.


              The right public-information verdict is that the model is commercially plausible but still
              under-disclosed. There is enough evidence to believe 8090 can generate meaningful revenue through
              enterprise software and services-like delivery, yet not enough to conclude that it already behaves like a
              software business with durable gross margins and efficient expansion. Private diligence should therefore
              focus on revenue mix, gross margin by product line, cash burn, pipeline quality, and concentration.
            claimRefs:
