      - number: '2.2'
        title: 'Adoption drivers: AI pressure plus legacy pain'
        blocks:
          - type: paragraph
            body: >-
              Demand-side pressure is real. Deloitte, IBM, McKinsey, GitHub, Microsoft, and EY all document a world in
              which enterprises are under pressure to ship more software, modernize legacy systems, and do so with
              stronger governance than ad hoc AI experimentation permits. 8090’s regulated-enterprise wedge is logical
              in this environment because those buyers feel both forces at once: they want faster delivery, but they
              cannot tolerate undocumented workflows, unclear decision rights, or untraceable AI output. The likely
              economic buyer is a CIO, CTO, or digital-transformation leader, while users span product managers,
              architects, engineers, QA, and business stakeholders. That makes the sales cycle slower, but it also makes
              the contract surface broader than developer-tool bottoms-up products.


              Public demand research also supports why enterprises care now. Generative AI is no longer being evaluated
              only as a productivity curiosity; it is increasingly tied to budget pressure, modernization timelines, and
              shortages of experienced delivery talent. That backdrop helps explain why a workflow-governance story can
              resonate with large buyers.
