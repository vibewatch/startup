        title: 'Named proof: strong partner evidence, thinner direct logo depth'
        blocks:
          - type: paragraph
            body: >-
              The best public customer evidence is concentrated in two buckets. First, EY.ai PDLC is a substantial
              partner-validation surface because EY describes deploying the offering to a large consultant base and
              cites strong internal productivity outcomes. Second, the Software Factory page includes named testimonials
              from ShadowTech Solutions, Mach33 Financial Group, and Tie. Those quotes are useful because they speak to
              documentation quality, SDLC rigor, and process change rather than generic hype. Even so, the proof set
              remains shallow compared with mature enterprise platforms that publish extensive customer-story libraries.
              Public evidence therefore supports credibility, but not breadth.


              In practical terms, the chapter should separate proof quality from proof breadth. Quality is reasonable
              because the named examples are relevant to the product story and not purely aspirational. Breadth is still
              limited because the public roster is short, and there is little hard deployment or renewal detail tied to
              those names.
