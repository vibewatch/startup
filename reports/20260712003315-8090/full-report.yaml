      - number: '8.3'
        title: Bull / base / bear scenarios
        blocks:
          - type: paragraph
            body: >-
              In the bull case, 8090 converts EY-enabled access into a broader set of named enterprise deployments,
              proves that the platform—not just managed delivery—drives durable value, and begins to disclose metrics
              that support a software-style margin profile. In the base case, it builds a serious but still concentrated
              enterprise business with meaningful services intensity and only partial economics clarity. In the bear
              case, the product remains strategically interesting but gets squeezed between incumbent workflow
              platforms, developer-agent tools, and the operational burden of managed delivery.


              Scenario work should therefore stay tied to proof thresholds, not to hand-wavy optimism. The bull case
              requires broader independent customer evidence, software-like margin behavior, and sustained
              differentiation around governed delivery. The bear case does not require product failure; it only requires
              that economics and breadth fail to catch up with the valuation narrative while adjacent competitors
              continue converging.
