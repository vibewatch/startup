        title: 'Cost structure: model usage, delivery labor, and support burden'
        blocks:
          - type: paragraph
            body: >-
              The cost structure is inferable even if it is not disclosed. Usage docs publish model-provider base prices
              and let admins drill into costs by user, model, or agent. The managed tier adds hosting, maintenance,
              security, and production responsibility. Codebase indexing, MCP workflows, and agent-driven work-order
              flows imply steady compute and support overhead. The likely profile is software-positive but still
              compute- and labor-sensitive, especially while managed delivery remains a visible part of the offering.


              The cost side is where public ambiguity becomes more material. A business that coordinates models,
              context, hosting, support, and potentially human validation can incur meaningful variable and
              semi-variable costs even when headline software pricing looks clean. Managed delivery can expand ACV and
              speed adoption, but it can also bring implementation labor, support obligations, and operational burden
              that weaken classic SaaS margins if the product is not highly leveraged.
