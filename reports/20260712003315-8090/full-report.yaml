chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding thesis, and product framing
        blocks:
          - type: paragraph
            body: >-
              8090 is still early enough that the company overview has to anchor the rest of the report, not just
              summarize an already mature public-company fact sheet. The public record is consistent on the basics: 8090
              launched in January 2024, is associated with Menlo Park, and positions itself as an AI-native software
              factory for regulated enterprises. The more important signal is how consistently the company frames the
              problem. Across the homepage, Software Factory page, and documentation, 8090 argues that enterprise
              software fails because requirements, architectural decisions, and institutional knowledge drift across
              tools and people. That framing intentionally pushes the company out of the narrow “AI code autocomplete”
              category and toward a control-plane thesis in which business intent, documentation, work orders, and
              production delivery stay synchronized.


              That matters because buyers are not just purchasing code generation. They are purchasing a way to reduce
              requirements drift, preserve architectural rationale, and keep delivery auditable across many
              stakeholders. In regulated settings, that upstream discipline can matter as much as downstream code
              quality, which is why 8090’s framing deserves separate attention from generic copilot narratives.
