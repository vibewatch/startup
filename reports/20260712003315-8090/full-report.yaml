      - number: '7.2'
        title: Operational, security, and quality-control risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk stems from the product architecture itself. 8090 is not just a suggestion engine; it
              touches requirements, architecture, code context, work-order sequencing, and—in the managed
              tier—production responsibility. That means failures can propagate through workflow, support, or production
              delivery rather than staying isolated to a chat prompt. Public docs support real controls such as
              read-only repository indexing, org-level administration, usage controls, and structured review loops, but
              they do not provide formal uptime, incident, or certification evidence.


              Operational risk is similarly intertwined with product design. Because 8090 is selling workflow control
              and, in some cases, managed delivery, incidents would not be judged only as software bugs. They would be
              judged as failures of process integrity, support, and governance. That raises the cost of weak
              reliability, sparse trust collateral, or unclear service commitments relative to a lighter-weight
              developer utility.


              Security and governance expectations are rising because larger ecosystems now educate buyers to demand
              explicit AI control narratives. That makes sparse trust packaging a competitive as well as an operational
              risk for 8090.
