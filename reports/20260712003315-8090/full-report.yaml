        title: Deployment, integration, and maturity signals
        blocks:
          - type: paragraph
            body: >-
              Quickstart and codebase docs show GitHub repository indexing through a GitHub App and automatic reindexing
              on pushes. Work Orders supports MCP connections for external coding agents. Organization and Usage docs
              show multi-user administration, seat limits, billing, and project-level drilldowns. The changelog shows
              rapid releases across drift detection, multi-repo support, unified agents, planning modes, and the
              Feedback rename from Validator. The platform looks alive and shipping quickly, but the roadmap page is
              thin and the public set does not expose uptime or incident detail.


              Deployment posture is equally central to the thesis. The company supports a self-serve product path, yet
              it also wraps hosting, maintenance, and operational responsibility into a managed enterprise model. That
              can help buyers move faster, especially in regulated settings, but it means product architecture and
              operating model cannot be evaluated separately. Reliability, support, and governance all become part of
