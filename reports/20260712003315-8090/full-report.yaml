  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: not just coding assistants'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to think about 8090’s market is as a bundle of software-delivery budgets rather than a
              pristine single-product category. The company is too workflow-heavy to be valued like a narrow coding
              copilot but too software-native to be understood purely as consulting. Its practical market includes AI
              coding assistants, low-code and orchestration platforms, internal engineering teams, legacy-modernization
              programs, and systems-integrator-led transformation budgets. That is why 8090 keeps emphasizing control,
              documentation, and auditability. It is trying to move the conversation from “who writes code fastest?” to
              “who can translate enterprise intent into production systems without losing context?” Public positioning
              from Appian, Power Platform, and Agentforce supports that framing because they all compete to own upstream
              workflow and downstream execution, not just code generation alone.


              The distinction is important for sizing. If 8090 were only a coding assistant, its spend would map more
              narrowly to developer-seat budgets. Because it claims to connect requirements, blueprints, work orders,
              context, and delivery, it competes for a broader transformation budget that often sits across engineering,
              product, and operations.
