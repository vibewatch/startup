      - number: '7.4'
        title: Financial/model risk and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The company’s biggest underwriting risk is still opacity. The public record does not disclose revenue,
              ARR, gross margin, burn, customer concentration by revenue, or renewal quality. The strong recent
              financing reduces immediate survival risk, but it does not answer whether the model can deliver durable
              economics before a future capital raise is needed. Thesis-break triggers are practical: evidence that
              managed delivery overwhelms software leverage, evidence that security or governance proof lags buyer
              expectations, evidence that partner concentration dominates customer formation, or evidence that rival
              platforms match 8090’s control-plane claims more cheaply through broader distribution.


              The most important investment risk is not one catastrophic event but a slower erosion of the thesis. If
              customer breadth stays shallow, trust proof stays thin, and competitors continue converging on the same
              workflow narrative, the valuation logic weakens well before the product stops being interesting. That is
              why the kill criteria center on proof quality and leverage, not on product existence.
