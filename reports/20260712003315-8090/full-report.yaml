  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory environment around enterprise AI remains unsettled, and that matters directly for
              8090 because the product aims to generate production software under governed conditions. NIST’s AI Risk
              Management Framework reinforces why trust, oversight, and accountability must be built into deployment.
              The Copyright Office’s ongoing AI initiative highlights unresolved questions around training, outputs, and
              ownership norms. FTC materials on AI partnerships and AI-compliance enforcement show that concentration,
              representations, and governance are not abstract policy topics; they are enforcement vectors. 8090 does
              publish privacy and terms documents, but the public record does not reveal a richer trust-center package.


              Regulatory and legal risk is not abstract in this category. Buyers are combining proprietary business
              logic, code generation, workflow history, and potentially third-party model infrastructure. That creates
              exposure around claims substantiation, training-data provenance, output ownership, and retention
              practices. A company can be directionally right on product value and still create expensive procurement
              friction if these questions remain underspecified.
