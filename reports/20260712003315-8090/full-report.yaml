  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is intuitive: 8090 is trying to own a higher-value part of the software-delivery stack than
              a normal coding copilot, and that should matter more in regulated environments than in hobbyist software.
              The anti-thesis is equally clear: a company can sound strategically important and still fail to deliver
              software-like economics or durable customer breadth. Without public ARR, margin, retention, or
              customer-count disclosure, investors are being asked to underwrite a premium category narrative with
              limited operating evidence.


              This is exactly the kind of company that can look obviously important before it looks obviously
              investable. The strategic story is coherent, and the financing plus partner proof make it harder to
              dismiss as vapor. But premium private pricing asks investors to believe not only that the category
              matters, but that this specific company can capture it with healthy economics and broader reference depth
              than public materials currently show.
