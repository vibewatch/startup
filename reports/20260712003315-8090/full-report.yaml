  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product definition: workflow system, not point assistant'
        blocks:
          - type: paragraph
            body: >-
              8090’s public docs consistently describe Software Factory as an SDLC orchestration environment. The
              workflow starts with product intent and requirements, moves through blueprints and work orders, and only
              then hands off to developers or coding agents. The product’s primary object is shared context, not just
              generated code. That is why the company talks about living documentation, knowledge graphs, auditability,
              and synchronized updates across modules.


              This breadth is strategically important because 8090 is not presenting itself as a single model wrapper.
              It is presenting itself as a structured software-delivery environment where intent, specification,
              execution, and feedback remain connected. That is a stronger product claim than autocomplete, but it also
              raises the bar on interoperability, product clarity, and implementation quality.
