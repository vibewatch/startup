      - number: '6.3'
        title: 'Adoption motion: partner leverage, workflow embedding, and expansion potential'
        blocks:
          - type: paragraph
            body: >-
              8090’s likely adoption motion starts with a high-stakes workflow problem, not casual experimentation.
              Buyers need to believe the platform can structure requirements, architecture, and execution in a way that
              reduces organizational risk. That plays well with EY-led transformation projects and with customers that
              want managed delivery instead of staffing the whole operating model themselves. Once adopted, expansion
              can happen through more seats, more projects, more repositories, and deeper operational usage because the
              platform is organized at the organization and project level rather than around isolated individual
              prompts. The challenge is that this same motion can hide concentration risk if a few large accounts or one
              dominant channel matter disproportionately.


              That creates a sensible but demanding commercial motion. Expansion likely depends on proving value in one
              workflow and then growing into adjacent teams, projects, and repositories. Such a path can produce large
              accounts if execution is strong, but it can also conceal concentration if only a handful of relationships
              account for most progress.
