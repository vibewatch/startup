      - number: '1.4'
        title: Commercial model, delivery responsibility, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              8090’s pricing and packaging are unusually explicit for a private company this young. The self-serve
              Software Factory plan is listed at $200 per user per month plus token usage, while 8090 Enterprise wraps
              hosting, maintenance, security, and delivery responsibility into a managed offer. That split suggests the
              company is selling both software and outcomes. It also creates diligence questions around margin
              structure, services intensity, and lock-in because 8090 says customers own the business logic while 8090
              owns the codebase IP and delivery responsibility on the managed tier. Just as notable are the omissions.
              Public sources do not disclose ARR, revenue mix, burn, headcount, or customer count, so the company
              overview can confirm real product, real financing, and real enterprise interest without supplying a full
              underwriting view.


              That is why the missing metrics matter so much. Without disclosed revenue mix, gross margin, burn, or
              customer-count data, the public file can validate commercial intent and product seriousness, but not
              whether the business already behaves like scalable software or like a promising but labor-intensive
              delivery engine.
