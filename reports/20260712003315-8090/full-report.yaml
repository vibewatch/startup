      - number: '6.4'
        title: Retention, durability, and what is still missing
        blocks:
          - type: paragraph
            body: >-
              The durability story is more conceptual than measured in the public record. Product architecture implies
              that the platform can become sticky because requirements, blueprints, work orders, artifacts, and code
              context compound over time. Feedback workflows and support surfaces strengthen that intuition because they
              keep the product tied to live user signals and organization-level administration. But none of that
              substitutes for actual retention data. There is no public NRR, GRR, churn, contract-length,
              deployment-count, or cohort data. The customer chapter therefore ends with a simple view: reference
              quality is meaningful, retention logic is plausible, and measurable durability remains unproven in public.


              The public record therefore supports a retention hypothesis, not a retention conclusion. Workflow
              embedding, project-level administration, and feedback loops all point in the right direction, yet none of
              them can substitute for renewal cohorts, reference calls, or revenue-retention data. That is why customer
              durability remains one of the highest-priority private diligence asks.
