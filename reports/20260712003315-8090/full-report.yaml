  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer segmentation: regulated enterprises and transformation leaders'
        blocks:
          - type: paragraph
            body: >-
              8090’s targeting is clear even if the customer roster is not. Public materials position the company for
              regulated enterprises and complex modernization workflows. That implies buyers such as CIOs,
              digital-transformation leaders, and engineering heads in sectors like healthcare, financial services,
              manufacturing, and government-adjacent environments. The product and managed-delivery pages also suggest
              two practical adoption paths: self-serve teams that want a software-delivery control plane, and enterprise
              sponsors who want 8090 to build and operate software for them. This is a high-ACV, low-logo-density
              strategy rather than a bottoms-up volume motion.


              The pattern suggests a customer base that will likely be narrow in count but high in complexity. That is
              common in enterprise software-delivery categories where trust, integration depth, and cross-functional
              change management matter more than easy sign-up growth. It also means each public logo carries more weight
              in investor interpretation than it would in a broad self-serve SaaS motion.
