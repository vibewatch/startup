      - number: '4.3'
        title: 'Capital adequacy: well-funded, but still dependent on execution'
        blocks:
          - type: paragraph
            body: >-
              A $135 million Series A gives 8090 meaningful capital relative to a normal early-stage software company.
              Company and media coverage say the money will fund hiring, compute, and infrastructure expansion, which
              fits the product. The raise likely buys significant runway, but it does not answer the key question of
              whether software leverage can outrun delivery obligations. Strategic relationships with Salesforce and EY
              strengthen the financing story while leaving real operating economics opaque.


              The $135 million Series A meaningfully improves the company’s runway and execution options. It should
              support hiring, infrastructure, product development, and enterprise go-to-market. But capital alone is not
              proof of efficiency. Well-funded AI companies can still consume cash quickly if model costs stay high,
              enterprise sales cycles remain long, or delivery intensity grows faster than reusable software leverage.
              The financing therefore reduces near-term survival risk more than it resolves long-term unit-economics
