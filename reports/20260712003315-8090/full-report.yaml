  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: who actually competes with 8090'
        blocks:
          - type: paragraph
            body: >-
              8090’s competitive set is broader than a list of code assistants. The company competes wherever a buyer is
              trying to reduce software-delivery friction under enterprise constraints. That includes direct coding
              copilots such as GitHub Copilot and Cursor, app-generation products such as Replit Agent, enterprise-agent
              suites such as Salesforce Agentforce, and low-code or orchestration incumbents such as Power Platform,
              Appian, and OutSystems. Factory is also relevant because it markets a more agent-native SDLC narrative
              that reaches beyond IDE assistance. The key practical insight is that 8090 is not competing for a single
              clean budget line. It is competing against whatever tool, platform, or integrator a buyer believes can
              safely move from requirements to production software with the least organizational pain.


              The result is not a clean apples-to-apples comparison. 8090 overlaps with AI coding assistants,
              app-generation agents, low-code platforms, and consulting-enabled delivery systems all at once. That
              breadth broadens the attack surface because buyers can solve parts of the problem with adjacent tools
              instead of adopting a single end-to-end platform.
