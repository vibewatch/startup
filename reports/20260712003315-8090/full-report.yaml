      - number: '1.3'
        title: Capital formation, partner leverage, and early distribution
        blocks:
          - type: paragraph
            body: >-
              The June 2026 Series A is the clearest hard fact in 8090’s public record. Company and third-party coverage
              align on the $135 million headline and on Salesforce Ventures leading a roster that also includes WndrCo,
              Craft Ventures, The Production Board, and LAUNCH. That matters for more than signaling. An AI-native
              delivery platform needs money for hiring, go-to-market, and model or infrastructure consumption, and the
              raise appears designed to fund all three. The EY relationship may be even more important operationally
              than the round itself. EY.ai PDLC gives 8090 a route into regulated buyers and a public productivity
              narrative, but it also means partner concentration becomes a real diligence question because one alliance
              dominates the early external proof set.


              The partnership also changes how investors should read traction. A large systems-integrator route can
              accelerate access to enterprise problems and budgets, but it can blur the line between independent
              software demand and partner-enabled project demand. That distinction matters later when the company needs
              to prove repeatability outside one marquee channel.
