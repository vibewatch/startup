- id: constraints
  title: 'Constraints: governance, lock-in, and cost predictability'
  body: 'The same evidence that makes the category attractive also explains why adoption is hard. Enterprise AI deployment is constrained by governance, integration complexity, usage-cost uncertainty, and legal ambiguity. The FTC’s partnership report shows why buyers worry about cloud, model, and distribution lock-in. NIST and the Copyright Office show that trust and policy questions are still moving targets. Pricing models matter too. 8090’s token-plus-seat structure is commercially reasonable for a young AI platform, but it creates the same predictability problem that many AI products face: the faster adoption succeeds, the harder total spend can be to forecast without strong controls. Public incumbents matter here not just as competitors but as reference points for how enterprise buyers think about procurement, security, and total cost.


    At the same time, the market is not frictionless. Buyers still worry about data control, reliability, procurement complexity, and whether promised productivity gains persist in production. Those frictions favor vendors that can prove governance and outcomes, but they also slow category expansion and widen the gap between pilots and scaled deployment.'
  claimRefs:
