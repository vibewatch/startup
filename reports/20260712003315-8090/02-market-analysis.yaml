- id: sizing-view
  title: 'Sizing view: large opportunity, narrow near-term beachhead'
  body: 'Public evidence is enough to say the opportunity is large, but not enough to defend a precise software-factory TAM. The category overlaps AI coding, low-code application development, workflow orchestration, internal engineering spend, and modernization programs, so any single top-down number will be misleading. A more defensible view is practical: 8090’s near-term beachhead is the subset of large regulated enterprises that need substantial software modernization and are willing to adopt AI-native delivery models under strong governance. That is smaller than the broad enterprise software market but larger than the pure developer-copilot category. The EY channel helps because it opens the door to that segment quickly, but realistic SOM still depends on partner leverage, reference deployments, and buyer risk tolerance rather than on the size of the headline AI market alone.


    The best way to read the market, therefore, is as a layered opportunity: a narrow software-delivery tooling market today, a broader workflow and modernization control market if execution holds, and an even larger but more speculative enterprise-agent market if buyers accept upstream orchestration as a budget line of its own.'
