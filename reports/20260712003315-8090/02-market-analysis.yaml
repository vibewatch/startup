chapter:
  number: 2
  title: Market Analysis
  summary: 8090 is selling into a large but messy bundle of software-delivery budgets rather than a single clean category. Public evidence from 8090, EY, GitHub, Microsoft, Appian, OutSystems, Deloitte, IBM, McKinsey, and GitHub’s developer data supports strong adoption pressure for AI-assisted software delivery, but the same record shows governance, integration, workflow fit, and trust remain the gating constraints—especially in regulated enterprises, which is exactly where 8090 is positioning itself.
sections:
- id: market-boundary
  title: 'Market boundary: not just coding assistants'
  body: 'The cleanest way to think about 8090’s market is as a bundle of software-delivery budgets rather than a pristine single-product category. The company is too workflow-heavy to be valued like a narrow coding copilot but too software-native to be understood purely as consulting. Its practical market includes AI coding assistants, low-code and orchestration platforms, internal engineering teams, legacy-modernization programs, and systems-integrator-led transformation budgets. That is why 8090 keeps emphasizing control, documentation, and auditability. It is trying to move the conversation from “who writes code fastest?” to “who can translate enterprise intent into production systems without losing context?” Public positioning from Appian, Power Platform, and Agentforce supports that framing because they all compete to own upstream workflow and downstream execution, not just code generation alone.


    The distinction is important for sizing. If 8090 were only a coding assistant, its spend would map more narrowly to developer-seat budgets. Because it claims to connect requirements, blueprints, work orders, context, and delivery, it competes for a broader transformation budget that often sits across engineering, product, and operations.'
