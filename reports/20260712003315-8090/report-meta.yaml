  topStrengths:
  - The company is selling a higher-value workflow and control-plane story than a simple coding copilot narrative.
  - A $135M Series A and the EY.ai PDLC partnership make the go-to-market and financing story more credible than many AI startups.
  - Public pricing, module documentation, and operating docs make the product and monetization surface unusually legible for a private company.
  - The regulated-enterprise wedge aligns with buyer needs for traceability, auditability, and controlled software modernization.
  topRisks:
  - Public ARR, margin, burn, retention, and customer-count disclosure remain too thin for conviction underwriting at a unicorn valuation.
  - Customer and channel proof is concentrated in EY and a small number of direct testimonials rather than a broad public reference base.
  - Managed delivery may add services intensity and operational burden that weaken software-style leverage if not controlled.
  - Incumbents and fast private rivals increasingly market overlapping governance, autonomy, and workflow narratives, which can compress differentiation.
  unresolvedGaps:
  - Current ARR, revenue mix, gross margin, burn, runway, and contribution-margin data.
  - Independent production customer references, retention cohorts, and concentration by revenue.
  - Formal trust-center materials, certifications, uptime / SLA history, and security architecture evidence.
  - Board composition, cap-table rights, and partner-versus-direct GTM dependence.
disclaimer: This report is a public-information diligence snapshot prepared as of 2026-07-12. It is not investment advice. Several underwriting-critical inputs remain undisclosed by 8090, especially financial statements, customer-retention data, security-collateral depth, and cap-table rights, so any investment decision should be conditioned on direct management diligence and a fuller private data room.
