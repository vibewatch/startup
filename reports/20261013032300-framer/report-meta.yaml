companyProfile:
  summary: >-
    Framer is an Amsterdam-founded, design-led website publishing platform that evolved from interaction prototyping
    into a no-code, AI-assisted web creation product. It now serves startups, agencies, and marketing teams with visual
    design, managed hosting, and collaborative publishing workflows, while enterprise adoption remains constrained by
    proprietary hosting lock-in and still-maturing governance features.
