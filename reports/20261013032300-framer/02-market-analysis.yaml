callouts:
  - calloutType: insight
    title: 'The Friction Shift: Visual Velocity vs. Architectural Depth'
    body: 'Framer has successfully captured the high-velocity design wedge by making the web canvas behave exactly like Figma. However, its long-term addressable market is bounded by architectural trade-offs: while it dominates 5-to-30 page marketing sites, platforms requiring deep relational databases, programmatic SEO, or native checkout remain anchored to Webflow, WordPress, or bespoke engineering.'
    claimRefs:
      - CM002
      - CM008
      - CM010
      - CM011
  - calloutType: risk
    title: Expansion Headwinds in Multi-Site and Large Content Accounts
    body: Framer's commercial model charges per published site alongside separate editor seat fees, creating budget friction for agencies managing extensive client portfolios or corporate marketing teams maintaining sprawling multi-brand web estates. Furthermore, migration costs are steep because proprietary visual elements cannot be exported as clean portable codebase.
    claimRefs:
      - CM010
      - CM012
      - CM013
