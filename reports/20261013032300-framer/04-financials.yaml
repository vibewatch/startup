- calloutType: risk
  title: Valuation Multiple Stretched Ahead of Verified Unit Economics
  body: At a $2.0 billion post-money valuation on an estimated $50 million ARR run rate (~40x ARR multiple), Framer is priced as an elite enterprise platform. Sustaining this multiple requires high gross margins and robust net expansion that remain uncorroborated by audited disclosures.
  claimRefs:
  - CI008
  - CI010
  - CI014
- calloutType: insight
  title: Collaboration Seats Drive Significant ARPU Expansion
  body: While headline pricing starts at $10 to $30 per month, collaboration editor seats priced at $20 to $40 per editor per month allow Framer to effectively triple ARPU on multi-person teams without altering base tier pricing.
  claimRefs:
  - CI004
  - CI005
