company:
  name: "Framer"
chapter:
  number: 6
  title: "Customers"
  summary: "Framer exhibits strong bottom-up customer momentum among freelance designers, creative agencies, and early-stage startups, powering over one million sites and 40% of recent YC cohort launches. However, absence of cohort retention disclosures, strict 10,000-item CMS ceilings, and lack of native e-commerce create material expansion barriers for enterprise and transactional accounts."
sections:
  - id: "customer-segmentation-and-personas"
    title: "Customer Segmentation & Core Personas"
    body: "Framer's customer base is structured around four primary demand segments: solo freelance designers, early-stage startup teams, digital agencies, and growth-stage marketing units. The platform's initial wedge took root with freelance interaction and UI/UX designers seeking to publish interactive client deliverables and personal portfolios without translating design files into custom code. In early-stage startups, founders and growth marketers deploy Framer to ship landing pages, campaign hubs, and initial product marketing sites in hours rather than waiting on backend engineering cycles. For creative agencies and digital design studios, Framer serves as a multi-site production environment enabling rapid client delivery, template reselling, and frictionless client handoffs. Within larger growth-stage technology firms, adoption is typically led by marketing and design teams who carve out public marketing surfaces from developer-maintained web applications. This multi-segment pull creates broad top-of-funnel customer interest, though customer willingness to pay and long-term contract value vary dramatically between solo creators and scaling enterprises."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-scale"
    title: "Adoption Trajectory & Platform Scale"
    body: "Framer's commercial adoption has accelerated following its transition from a prototyping application into a full-featured web publishing ecosystem. The platform reports hosting over one million published websites globally and maintaining approximately 500,000 monthly active users across its editor canvas. This scale is underpinned by a global community of more than 21,500 designers and creators who actively publish and purchase prebuilt templates, components, and design styles. Adoption among early-stage technology companies is particularly concentrated: during recent venture cycles, Framer announced that 40% of the summer 2025 Y Combinator cohort launched their initial company web presence using the tool. This widespread adoption reflects Framer's speed advantages and built-in edge infrastructure, which eliminates the traditional devops overhead associated with standing up static sites. Nevertheless, aggregate platform figures combine both free experimentation subdomains and paid enterprise domains, obscuring the precise proportion of recurring commercial accounts."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU006"
    tableRefs:
      - "TU002"
  - id: "enterprise-traction-and-named-proof"
    title: "Enterprise Traction & Named Customer Deployments"
    body: "Framer has increasingly secured marquee brand deployments across high-growth software and artificial intelligence enterprises. High-profile venture-backed companies including Scale AI, Perplexity, Miro, and Bilt Technologies publicly power their primary corporate websites and marketing landing pages using Framer. These deployments demonstrate that Framer's visual canvas, animations, and managed edge delivery meet the visual polish and performance expectations of prominent modern brands. Furthermore, Framer's Series D disclosures indicate that business subscriptions represent the company's fastest-growing revenue segment following the rollout of dedicated team tiers and enterprise plans. However, diligence indicates that named enterprise adoption remains strictly circumscribed to marketing and brand web surfaces. Core software applications, interactive consumer search engines, and transactional financial portals remain partitioned on custom-coded engineering stacks, keeping Framer positioned as a marketing front-end tool rather than an enterprise application host."
    claimRefs:
      - "CU005"
      - "CU007"
      - "CU001"
    tableRefs:
      - "TU003"
  - id: "retention-dynamics-and-expansion-friction"
    title: "Retention Dynamics, Expansion Loops & Concentration Risks"
    body: "Framer's commercial expansion model relies on land-and-expand mechanics that move users from free canvas experimentation into Basic, Pro, and Scale plans. To drive expansion into higher-tier contracts, Framer launched Framer Convert in March 2026, introducing native visual funnels, A/B testing variants, and dynamic traffic triggers as paid add-ons. Team collaboration features and multiplayer canvas editing further encourage organizational account upgrades. Despite these expansion levers, Framer faces structural retention friction. The platform enforces a rigid 10,000-item ceiling on CMS collections and basic content editing tools, making it ill-suited for large-scale publishing operations or complex content architectures. Furthermore, Framer does not support native e-commerce carts or checkout, forcing transactional merchants to rely on third-party widgets like Shopify Buy Button. Crucially, Framer maintains total private opacity regarding net revenue retention (NRR), gross renewal rates, annual cohort churn, and top-customer revenue concentration, leaving long-term account durability unverified for diligence purposes."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU011"
      - "CU012"
      - "CU014"
