  - id: TE001
    title: Product Module and Asset Matrix
    columns:
      - Module / Asset
      - Target User
      - Status / Maturity
      - Technical Differentiation
      - Diligence Gap
    rows:
      - - Visual Design Canvas
        - UI/UX Designers & Marketers
        - Production / Mature
        - Freeform Figma-like layout engine with direct code compilation
        - Stress under deeply nested DOM hierarchies (>1,000 layers)
      - - Framer Agent & Generative AI
        - Designers & Solo Founders
        - Production (v3.0 released June 2026)
        - In-canvas agent modifies native layouts and components
        - Consumption volatility against monthly AI credit quotas
      - - Integrated CMS Engine
        - Content Teams & Marketers
        - Production / Constrained
        - Visual CMS templating with multi-breakpoint synchronization
        - Caps on collection depth (2 on Basic, 10 on Pro; up to 40k items)
      - - React Code Components Runtime
        - Technical Designers & Engineers
        - Production / Extensible
        - Native React component imports and code override scripts
        - Version synchronization and security boundaries for untrusted npm packages
    notes: Maturity classifications and collection limits verified against platform documentation and third-party technical reviews; enterprise limits require custom tier contracts.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
  - id: TE002
    title: Workflow and Use-Case Comparison
    columns:
      - User Job
      - Traditional Workflow
      - Framer Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Marketing Landing Page Launch
        - Figma mockup to front-end developer handoff (2-4 weeks)
        - Direct visual design and single-click CDN deployment
        - Compresses design-to-live timeline to hours or days
        - Complex backend database logic and user auth require third-party integrations
      - - Multi-Device Responsive Optimization
        - Manual CSS media queries and separate mobile layouts
        - Unified visual breakpoints (desktop, tablet, phone) with auto-layout stacks
        - Eliminates cross-browser layout drift and responsive regressions
        - Fixed layout assumptions struggle with dynamic user-generated content resizing
      - - Interactive Motion & Micro-Interactions
        - Hand-coded JavaScript or CSS transition animations
        - Native visual animation editor with hover, scroll, and timeline controls
        - Smooth hardware-accelerated animations without coding
        - Heavy scroll animations can degrade lower-end mobile rendering performance
      - - Content Publishing & Updates
        - CMS rebuild or engineering ticket deployment
        - Visual CMS collections and on-page visual editing
        - Marketing teams publish posts and changelogs independently
        - Strict limits on collection count force plan tier upgrades
    notes: Workflows benchmarked across marketing sites, landing pages, and startup portals based on practitioner reviews and platform capabilities.
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
  - id: TE003
    title: Technology and Operating Architecture
    columns:
      - Architecture Layer / Component
      - Role in Stack
      - Technical Dependency
      - Operating Risk
    rows:
      - - Visual Authoring Engine
        - Browser-based canvas editor with vector layout and style controls
        - Web standard layout rendering and browser GPU acceleration
        - Complex projects can consume significant client browser memory
      - - Compilation & Optimization Pipeline
        - Translates canvas AST into minified HTML, CSS, and React code
        - Static site generator, image compression, and tree-shaking tools
        - Build-time regressions when compiling custom third-party React components
      - - Global CDN Edge Hosting
        - Serves statically generated assets with edge caching and SSL
        - Distributed CDN edge points of presence and DNS routing
        - Vendor lock-in to proprietary hosting; full site export to external hosts is restricted
      - - Framer Agent AI Subsystem
        - LLM-driven page generation, responsive adjustments, and copy refinement
        - Upstream frontier foundation model APIs and prompt execution runtime
        - API latency during canvas operations and monthly credit exhaustion
    notes: Architectural components derived from published technical specifications, platform documentation, and developer ecosystem analysis.
    claimRefs:
      - CE001
      - CE008
      - CE009
      - CE010
figures:
  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: Six-tier architectural stack illustrating Framers pipeline from visual design and AI agents through React compilation, static optimization, and global edge delivery.
    data:
      layers:
        - label: "Tier 1: Visual Design Canvas"
          detail: Spatial drag-and-drop authoring environment with fluid auto-layout
          modules:
            - Infinite layout canvas
            - Smart stacks & auto-layout
            - Figma import plugin
            - Responsive breakpoints
        - label: "Tier 2: Generative AI & Framer Agent"
          detail: Autonomous LLM agent generating layout structures and design styles
          modules:
            - In-canvas page synthesis
            - Design system styling
            - Responsive breakpoint adaptation
            - AI credits orchestration
        - label: "Tier 3: Dynamic Content & CMS Engine"
          detail: Multi-collection relational content store supporting templated publishing
          modules:
            - Multi-collection CMS
            - Field schemas & list fields
            - Visual template binding
            - Localization & redirects
        - label: "Tier 4: React Compilation & Extensibility Runtime"
          detail: Abstract syntax tree compilation converting canvas layers into React components
          modules:
            - AST-to-React compiler
            - Custom code components
            - Code override scripts
            - External API integrations
        - label: "Tier 5: Asset Optimization & Build Pipeline"
          detail: Static build optimizer generating minified bundles, images, and SEO metadata
          modules:
            - JavaScript minification
            - Automated image compression
            - Sitemap & robots.txt generation
            - Semantic HTML generation
        - label: "Tier 6: Global Edge Hosting & CDN Infrastructure"
          detail: Distributed worldwide CDN serving cached static files with zero-config SSL
          modules:
            - Worldwide edge distribution
            - Automated SSL certificate provisioning
            - Real-time edge caching
            - Native analytics telemetry
    approximationNotes: Architectural layers represent logical separation of platform services; hosting and compilation pipelines are operated as fully managed proprietary cloud services.
    claimRefs:
      - CE001
      - CE002
      - CE008
      - CE011
callouts:
  - calloutType: insight
    title: The Unified Design-to-Production Pipeline
    body: Framers architectural innovation is eliminating the traditional intermediate code representation and developer handoff. By executing directly on a visual canvas that compiles natively into optimized React code and static assets, marketing and design teams achieve production velocity unattainable in decoupled CMS architectures.
    claimRefs:
      - CE001
      - CE004
  - calloutType: risk
    title: Hosting Lock-In and CMS Depth Constraints
    body: While Framer delivers stellar Lighthouse scores and single-click deployment, the platform binds customer sites to its proprietary hosting infrastructure without offering standalone static site export. Furthermore, strict CMS collection limits and basic search/filtering restrict its viability for content-heavy publications or enterprise data directories.
    claimRefs:
      - CE007
      - CE010
