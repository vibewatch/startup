    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological evolution of Framer from early interactive design prototyping to AI-native website publishing and
      $2B enterprise expansion.
    approximationNotes: Milestone dates derived from verified funding announcements, product changelogs, and technology industry reviews.
    data:
      items:
        - date: '2014'
          label: Foundation in Amsterdam
          detail: Koen Bok and Jorn van Dijk incorporate Framer in Amsterdam as an advanced code-based prototyping tool.
          tone: neutral
        - date: '2018'
          label: Framer X Launch
          detail: Framer introduces React component support and an extensible design canvas for digital product teams.
          tone: neutral
        - date: '2022'
          label: Strategic Web Builder Pivot
          detail: Framer pivots to web publishing, launching visual no-code design, CMS, and managed hosting.
          tone: positive
        - date: '2023'
          label: Framer AI Introduction
          detail: Native generative AI tools and style generators are introduced directly onto the visual canvas.
          tone: positive
        - date: '2024'
          label: Business Plans & Enterprise Launch
          detail: Framer introduces dedicated business plans, team workspace permissions, and scaling traffic tiers.
          tone: positive
        - date: 2025-08
          label: Series D & $2B Valuation
          detail: Framer closes $100M Series D led by Meritech and Atomico, reaching 500k MAU and rapid business adoption.
          tone: positive
        - date: 2025-11
          label: Framer 3.0 Platform Upgrade
