  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Framer rests on its proven transition from an interactive prototyping
              sandbox into a production-grade web publishing platform that eliminates the traditional engineering
              handoff for marketing and corporate web properties. By delivering a canvas interface that mirrors Figma
              while generating production-ready HTML, CSS, and React infrastructure, Framer captures high-velocity
              website creation across venture-backed startups and design-forward enterprises, including Scale AI,
              Perplexity, and Miro. Furthermore, management reported achieving break-even operations alongside $50M in
              annual recurring revenue in 2025, demonstrating operating leverage that distinguishes Framer from
              capital-intensive no-code peers.


              Conversely, the anti-thesis centers on extreme valuation multiples, customer concentration risks, and
              technological disruption from emerging vibe-coding and AI code-generation workflows. At a $2.0B post-money
              valuation on $50M ARR, Framer trades at approximately 40x trailing recurring revenue. This premium demands
              flawless execution toward its stated $100M ARR target without disclosure of underlying net revenue
              retention, contract churn, or customer acquisition payback metrics. Additionally, while Framer has added
              AI design agents and dynamic CMS capabilities, standalone web publishing faces structural
              disintermediation if full-stack AI development environments subsume visual website builders.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
      - number: '8.2'
        title: Current Financing Context and Multiples
        blocks:
          - type: paragraph
            body: >-
              Framer closed a $100M Series D round in August 2025 led by long-time partners Meritech Capital and
              Atomico, with participation from WiL and HV Capital, establishing a $2.0B post-money valuation. This round
              followed a $27M Series C in 2023 led by Meritech and earlier rounds dating back to its 2014 founding in
              Amsterdam by Koen Bok and Jorn van Dijk, bringing cumulative equity funding to approximately $163M. The
              round reinforced institutional commitment from lead backers but established a steep pricing benchmark that
              dramatically outpaces publicly traded SaaS multiples and leaves new investors exposed to multiple
              compression.


              Public market comparables in web publishing, digital experience, and design infrastructure—including
              Squarespace, Wix, and Figma—trade at substantially lower revenue multiples ranging from 3.5x to 15x
              forward revenue. Framer's 40x trailing ARR multiple can only be rationalized if the company sustains 100%
              year-over-year revenue expansion from $50M to $100M ARR while maintaining its break-even cash profile.
              Without verified disclosure on enterprise average contract value (ACV), multi-year commitments, or gross
              margin after managed hosting costs, institutional entry at the Series D valuation reflects full pricing of
              upside with limited margin of safety.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
      - number: '8.3'
        title: Scenario Analysis and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Framer's investment profile across bull, base, and bear operating scenarios underscores the
              asymmetric downside risks embedded in its current capitalization structure. In the bull case, Framer
              successfully doubles ARR to $100M, expands enterprise tier adoption across Global 2000 marketing teams,
              and defends its visual canvas leadership against vibe-coding alternatives, sustaining a 25x multiple to
              reach a $2.5B fair market valuation. In the base case, revenue growth decelerates to a 40% compound rate
              as self-serve churn offsets enterprise gains, pulling revenue to $70M and compressing the multiple to 18x
              for a $1.26B valuation, representing a 37% downside from the Series D valuation mark.


              In the bear case, competitive erosion from AI-native code generators and visual website builders like
              Webflow compress growth to 20%, while hosting infrastructure expenses erode margins, forcing a multiple
              reset toward mature software multiples of 10x on $60M ARR ($600M valuation, down 70%). Consequently, our
              diligence stance remains track rather than buy. Prior to allocating capital or underwriting secondary
              transactions, institutional investors must verify four critical diligence items: cohort-level net revenue
              retention by customer tier, gross margins net of hosting and AI inference costs, enterprise contract
              termination rights, and liquidation preference seniority across Series D preference shares.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Discipline Requires Patient Monitoring
            body: >-
              At a $2.0B post-money valuation, Framer trades at approximately 40x ARR. While the company's break-even
              posture and rapid adoption among high-growth technology companies validate its product superiority,
              entering at this valuation requires near-perfect commercial execution toward its $100M ARR goal. We
              recommend maintaining a track posture until audited cohort retention metrics and software gross margins
              can be independently verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
