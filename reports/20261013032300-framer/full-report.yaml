        - AI vibe-coding tools enable developers and non-technical staff to bypass visual builders
        - Evidence of enterprise teams consolidating design and production on Framer over AI dev tools
      - - Customer Adoption
        - Rapid enterprise expansion; 40% of recent YC batch and firms like Miro and Perplexity
        - High SMB and freelancer churn inherent in self-serve website builder models
        - Audited enterprise cohort NRR exceeding 120% and multi-year contract expansion metrics
      - - Financial Quality
        - Reported $50M ARR with break-even operations demonstrates exceptional capital efficiency
        - Gross margin diluted by managed hosting bandwidth and third-party AI inference costs
        - Detailed income statement confirming software gross margins above 75% post-hosting
      - - Valuation & Return
        - Potential to become the dominant .com operating platform worth $5B+ at public scale
        - 40x ARR entry multiple leaves no margin of safety for growth deceleration or multiple resets
        - Valuation repricing below 20x ARR or growth acceleration outpacing $100M ARR target
    notes: >-
      Analysis synthesizes reported business traction from Series D disclosures against structural SaaS software
      dynamics.
