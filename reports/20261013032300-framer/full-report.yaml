      - number: '6.2'
        title: Adoption Trajectory & Platform Scale
        blocks:
          - type: paragraph
            body: >-
              Framer's commercial adoption has accelerated following its transition from a prototyping application into
              a full-featured web publishing ecosystem. The platform reports hosting over one million published websites
              globally and maintaining approximately 500,000 monthly active users across its editor canvas. This scale
              is underpinned by a global community of more than 21,500 designers and creators who actively publish and
              purchase prebuilt templates, components, and design styles. Adoption among early-stage technology
              companies is particularly concentrated: during recent venture cycles, Framer announced that 40% of the
              summer 2025 Y Combinator cohort launched their initial company web presence using the tool. This
              widespread adoption reflects Framer's speed advantages and built-in edge infrastructure, which eliminates
              the traditional devops overhead associated with standing up static sites. Nevertheless, aggregate platform
              figures combine both free experimentation subdomains and paid enterprise domains, obscuring the precise
              proportion of recurring commercial accounts.
            claimRefs:
              - CU003
              - CU004
              - CU006
          - type: table
            tableRef: TU002
