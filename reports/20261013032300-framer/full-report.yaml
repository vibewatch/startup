        title: Exhibits
        blocks:
          - type: callout
            title: High Switching Costs Created by Proprietary Canvas Architecture
            body: >-
              Because Framer does not export standalone HTML/CSS/React bundles for external self-hosting, organizations
              face total rebuild costs if migrating away. Technical diligence must evaluate whether marketing speed
              outweighs multi-year vendor lock-in.
            calloutType: risk
