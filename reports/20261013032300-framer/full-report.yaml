      - number: '5.3'
        title: Technical Architecture and Compilation Runtime
        blocks:
          - type: paragraph
            body: >-
              Underneath the visual authoring interface, Framer operates a cloud-native compilation and hosting pipeline
              that guarantees enterprise-grade web performance out of the box. As users design on the canvas, the
              internal layout engine converts spatial AST representations into optimized static React components. During
              the automated publication workflow, Framer optimizes images, tree-shakes and minifies client JavaScript
              bundles, generates semantic HTML markup, and compiles XML sitemaps alongside Open Graph headers.
              Production assets are automatically distributed across a globally managed content delivery network (CDN)
              with edge caching and automated SSL provisioning. Independent performance benchmarks demonstrate that this
              static compilation pipeline consistently achieves Google Lighthouse performance scores exceeding 90,
              providing substantial search engine optimization and user experience benefits without requiring
              specialized site reliability engineering.
            claimRefs:
              - CE001
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE010
