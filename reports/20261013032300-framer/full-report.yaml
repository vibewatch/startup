  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Risk Profile
        blocks:
          - type: paragraph
            body: >-
              Framer operates as an international website platform headquartered in Amsterdam, Netherlands, with
              cross-border operations across San Francisco and Barcelona following its August 2025 Series D financing
              round. Because Framer hosts public websites and processes end-user engagement data for hundreds of
              thousands of live domains, the company sits directly within the regulatory perimeter of the European Union
              General Data Protection Regulation and evolving transatlantic data privacy frameworks. While Framer
              provides a standardized Data Processing Agreement and standard contractual clauses for commercial
              customers, enterprise procurement scrutiny intensifies as brand-defining web properties migrate to its
              multi-tenant cloud infrastructure. The absence of public SOC 2 Type II audit reports or detailed
              penetration testing disclosures represents a material verification barrier for corporate security
              committees evaluating production deployments. Regulatory exposure also encompasses evolving digital
              accessibility mandates and consumer tracking cookie consent compliance across EU and US jurisdictions,
              where responsibility is shared between platform infrastructure controls and customer-configured canvas
              code.
            claimRefs:
              - CR003
              - CR010
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR010
