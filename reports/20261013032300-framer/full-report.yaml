      - number: '7.2'
        title: Operational Infrastructure, Performance, and Security Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Framer's architectural model combines a visual infinite design canvas with direct code compilation into
              production React, HTML, and CSS hosted on managed cloud infrastructure. The company advertises 99.99%
              uptime for published sites, relying on multi-tenant edge delivery networks to serve global traffic without
              requiring customer infrastructure maintenance. However, this centralized hosting architecture concentrates
              operational exposure: any disruption to Framer's core deployment pipelines, edge routing, or cloud hosting
              counterparties immediately impacts client websites and public brand uptime. Independent technical
              evaluations highlight that performance can drag significantly on complex, interaction-heavy sites.
              Excessive micro-interactions, complex scroll-linked animations, and unoptimized media assets frequently
              introduce editor latency and published rendering sluggishness. Because Framer executes complex layouts
              directly in the browser via JavaScript and React bundles, teams must enforce strict asset discipline to
              avoid degrading Core Web Vitals, mobile responsiveness, and search engine crawlability.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR014
      - number: '7.3'
        title: Platform Lock-in, E-Commerce Limits, and Dependency Concentration
        blocks:
          - type: paragraph
            body: >-
              The defining strategic vulnerability for Framer customers is deep platform lock-in. Framer is a fully
              hosted, closed proprietary platform that does not support exporting portable website source code or
              deploying generated assets to independent hosting environments. If an organization chooses to depart
              Framer, it cannot simply migrate templates or database schemas; departing teams must completely rebuild
              their websites and CMS collections from scratch on alternative platforms. Furthermore, Framer's native CMS
              is architected primarily for structured marketing pages, case studies, and corporate blogs, leaving
              substantial functional gaps for complex e-commerce catalogs requiring multi-currency checkouts, inventory
              synchronization, or dynamic SKU variants. While Framer supports custom React code embeds and external API
              connections, customer economics face compounding pricing escalation as traffic volume, CMS items, and
              collaborating team seats grow across distinct per-site subscription plans. Framer's generative AI agents
              also introduce operational counterparty dependencies on external foundation model APIs for prompt-driven
              layout generation.
            claimRefs:
              - CR001
              - CR002
