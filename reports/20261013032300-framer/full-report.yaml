      - number: '5.2'
        title: Product Modules, SKUs, and Maturity Map
        blocks:
          - type: paragraph
            body: >-
              The Framer product suite integrates multiple core subsystems designed to span the full lifecycle of modern
              digital storefronts and marketing properties. At its base sits the visual authoring canvas with
              auto-layout stacks, fluid breakpoints, and native timeline animations, allowing granular control over
              responsive presentation across devices. Dynamic data handling is powered by an integrated Content
              Management System (CMS), which enables structured collections for blogs, job boards, changelogs, and
              resource libraries. To support technical customization, Framer includes a React code component runtime
              that permits developers to embed custom code overrides and external API connections. In June 2026, Framer
              shipped version 3.0, introducing autonomous in-canvas Framer Agents that synthesize layouts, establish
              responsive breakpoints, and organize design tokens natively.
            claimRefs:
              - CE002
              - CE003
              - CE005
          - type: table
            tableRef: TE001
