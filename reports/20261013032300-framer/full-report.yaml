      - number: '6.4'
        title: Retention Dynamics, Expansion Loops & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Framer's commercial expansion model relies on land-and-expand mechanics that move users from free canvas
              experimentation into Basic, Pro, and Scale plans. To drive expansion into higher-tier contracts, Framer
              launched Framer Convert in March 2026, introducing native visual funnels, A/B testing variants, and
              dynamic traffic triggers as paid add-ons. Team collaboration features and multiplayer canvas editing
              further encourage organizational account upgrades. Despite these expansion levers, Framer faces structural
              retention friction. The platform enforces a rigid 10,000-item ceiling on CMS collections and basic content
              editing tools, making it ill-suited for large-scale publishing operations or complex content
              architectures. Furthermore, Framer does not support native e-commerce carts or checkout, forcing
              transactional merchants to rely on third-party widgets like Shopify Buy Button. Crucially, Framer
              maintains total private opacity regarding net revenue retention (NRR), gross renewal rates, annual cohort
              churn, and top-customer revenue concentration, leaving long-term account durability unverified for
              diligence purposes.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Designer-Led Bottom-Up Adoption Moat
            body: >-
              Framer's primary commercial wedge is product-led adoption driven by UI/UX designers who use the free
              canvas for portfolio projects and subsequently champion Framer inside startups and digital agencies,
              bypassing traditional engineering procurement cycles.
            calloutType: insight
            claimRefs:
