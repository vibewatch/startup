chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              Founded in 2014 in Amsterdam by Koen Bok and Jorn van Dijk, Framer B.V. has evolved from a boutique
              interaction prototyping tool into a high-growth, design-led website builder. Operating dual headquarters
              in Amsterdam, Netherlands, and San Francisco, California, the company provides a modern web creation
              canvas that eliminates traditional developer handoffs by compiling visual designs directly into
              responsive, hosted web applications. As of its August 2025 Series D financing, Framer reported supporting
              hundreds of thousands of active websites globally and engaging more than 500,000 monthly active users
              across independent creators, design agencies, and commercial enterprises. The platform has achieved
              notable penetration across high-velocity technology startups, with management disclosing that 40% of the
              companies in the most recent Y Combinator batch deployed their primary public web properties on Framer.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO007
              - CO008
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Framer's executive leadership and product vision remain anchored by its original co-founders, Chief
              Executive Officer Koen Bok and co-founder Jorn van Dijk. Prior to launching Framer in Amsterdam in 2014,
              Bok and van Dijk co-founded Sofa, an acclaimed Dutch software and design studio renowned for user
              interface craftsmanship that was acquired by Facebook in 2011. Both founders subsequently worked as
              product and interaction designers at Facebook before departing to establish Framer. While the founders'
              deep roots in interaction design provide unparalleled credibility within the worldwide UI/UX design
              community, executive decision-making and brand stewardship carry substantial key-person dependency. Formal
              corporate governance reflects typical top-tier venture backing, with institutional representatives from
              lead investors Meritech Capital Partners and European venture firm Atomico providing board-level oversight
              alongside executive management.
            claimRefs:
              - CO001
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO010
      - number: '1.3'
        title: Capitalization Structure, Valuation, and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              In August 2025, Framer solidified its position as an enterprise-grade technology unicorn by securing a
              $100 million Series D financing round that valued the business at a post-money valuation of $2 billion.
              The round was co-led by existing venture backers Meritech Capital Partners and European growth investor
              Atomico, bringing estimated cumulative equity capital raised across institutional financing rounds to
              roughly $163 million. The capital injection was driven by an inflection in commercial customer
              acquisition, with business and team accounts emerging as the platform's fastest-growing revenue segment
              following the roll-out of dedicated organizational workspaces. Framer operates a multi-tiered subscription
              pricing architecture ranging from free personal projects to self-serve Mini and Pro tiers, extending to
              custom Enterprise contracts that serve scaled tech companies including Scale AI, Perplexity, Miro, and
              Bilt.
            claimRefs:
              - CO003
              - CO004
              - CO009
              - CO011
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO010
      - number: '1.4'
        title: Platform Evolution, Milestones, and Enterprise Diligence Constraints
        blocks:
          - type: paragraph
            body: >-
              Framer's strategic trajectory reflects an ambitious product pivot that transformed the company from a
              niche code-centric prototyping utility into an integrated, AI-native web publishing platform. Originally
              launched in 2014 to build interactive mobile and web prototypes, Framer repositioned its architecture in
              2022 to deliver no-code website design directly linked to managed hosting, content management systems, and
              SEO infrastructure. The introduction of Framer 3.0 and canvas-native AI design agents accelerated this
              transition by allowing designers to prompt layouts, generate copy, and localize pages in real time.
              However, diligence highlights material architectural trade-offs: migrating websites off Framer requires
              rebuilding from scratch due to proprietary code generation rather than exporting clean source code,
              creating significant vendor lock-in. Furthermore, independent assessments observe ongoing maturity gaps in
              enterprise-grade role permissions, advanced design token governance, and native e-commerce infrastructure.
            claimRefs:
              - CO005
              - CO006
              - CO012
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO012
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Design-to-Production Shift Eliminates Engineering Handoff Bottlenecks
            body: >-
              Framer's convergence of visual canvas design, live publishing, and native AI agents fundamentally alters
              web development economics for startups and marketing teams by bypassing traditional front-end engineering
              cycles.
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
              - CO009
          - type: callout
            title: Enterprise Transition Constrained by Vendor Lock-in and Governance Maturity
            body: >-
              While Framer rapidly converts startup and agency accounts, enterprise penetration faces friction from
              proprietary hosting lock-in without raw code export alongside evolving role-based access control and
              design system token standardization.
            calloutType: risk
            claimRefs:
              - CO014
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Framer operates within the visual web development and web publishing software sector, positioning itself
              at the intersection of UI design canvases, managed frontend hosting, and no-code content management. The
              platform specifically targets marketing websites, interactive landing pages, campaign hubs, and creative
              portfolios where animation quality and rapid visual iteration govern conversion. This scope explicitly
              includes subscriptions for design tooling, responsive breakpoint layouts, global content delivery
              networks, custom domain hosting, and native motion interactions. Conversely, Framer's architecture
              intentionally excludes full-stack web application engineering, transactional backend logic, complex
              relational databases, and enterprise ecommerce operations. In traditional digital workflows, marketing
              teams solve this problem through costly developer handoffs where Figma prototypes are re-coded into custom
              React or Webflow implementations, or through template-constrained content platforms like WordPress and
              Squarespace. By unifying the freeform design canvas with immediate live URL publishing, Framer substitutes
              both external agency development contracts and rigid legacy website builders.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM011
      - number: '2.2'
        title: Addressable Market Sizing Across Macro, Vendor, and Diligence Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating Framer's market opportunity requires separating vendor narrative from addressable software
              spend. Executive communications around Framer's Series D funding round characterized professional web
              creation as a transition worth tens of billions of dollars, arguing that business websites represent an
              enterprise-grade TAM ready for visual disruption. However, structured diligence applies more disciplined
              lenses across the global website building and CMS landscape. The broader global web building and content
              platform market represents approximately $14.0B to $18.0B in annual spend, but much of this reflects
              consumer hobbyists, bespoke system integration, and content-heavy media publishers. Within that universe,
              Framer's Serviceable Addressable Market (SAM)—encompassing design-forward digital agencies, technology
              startup marketing teams, and corporate brand campaign units—is estimated between $2.8B and $3.5B. When
              further constrained to accounts willing to adopt a per-site hosted SaaS model lacking native ecommerce and
              complex relational CMS capabilities, Framer's realistic Serviceable Obtainable Market (SOM) contracts to
              $450M to $650M. Public research lacks granular independent segment disclosures isolating Framer's market
              share, leaving long-term penetration expectations subject to substantial estimation variance.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM010
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM011
      - number: '2.3'
        title: Buyer Personas, User Workflows, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Framer's commercial adoption spans three primary buyer cohorts: venture-backed technology startups,
              digital design agencies and freelancers, and mid-market to enterprise marketing departments. Among
              technology startups, founders and growth marketers serve as economic buyers who prioritize rapid iteration
              velocity, as evidenced by 40% of recent Y Combinator batch cohorts launching on Framer. In creative
              agencies and freelance design studios, studio principals purchase Framer workspace licenses to compress
              delivery timelines and capture development margins previously lost to outsourced engineering partners. At
              mid-market SaaS organizations, brand directors and VP Marketing budget holders fund Framer deployments to
              circumvent engineering backlogs and deploy responsive campaign microsites directly. Commercial
              monetization follows a per-published-site pricing structure ranging from Basic ($10/month) to Pro
              ($30/month) and Scale ($100/month) on annual contracts, supplemented by recurring monthly fees for
              collaborative editor seats. A growing ecosystem of educational platforms and community template
              marketplaces further lowers onboarding friction for junior designers.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: Growth Drivers, Architectural Ceilings, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Adoption velocity is fueled by powerful operational drivers, notably the elimination of frontend developer
              bottlenecks and the integration of AI-assisted creation tools. Recent platform updates introducing AI
              Agents, automated page effect controls, and on-page browser editing allow non-technical brand teams to
              launch and modify sites in hours rather than weeks. However, diligence surfaces material architectural
              constraints that bound Framer's expansion. The platform's native CMS lacks relational depth, advanced
              content filtering, and programmatic search engine optimization tools required by multi-thousand-page
              publications. Furthermore, the absence of native ecommerce necessitates third-party integrations with
              platforms like Shopify, restricting Framer's utility for transactional commerce brands. Vendor lock-in
              also poses a structural migration barrier, as proprietary canvas elements cannot be exported to clean
              external codebases. Consequently, while Framer maintains immense appeal for design-led marketing
              footprints, scaling into enterprise core web infrastructure requires resolving fundamental content scaling
              and governance ceilings.
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Friction Shift: Visual Velocity vs. Architectural Depth'
            body: >-
              Framer has successfully captured the high-velocity design wedge by making the web canvas behave exactly
              like Figma. However, its long-term addressable market is bounded by architectural trade-offs: while it
              dominates 5-to-30 page marketing sites, platforms requiring deep relational databases, programmatic SEO,
              or native checkout remain anchored to Webflow, WordPress, or bespoke engineering.
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM010
              - CM011
          - type: callout
            title: Expansion Headwinds in Multi-Site and Large Content Accounts
            body: >-
              Framer's commercial model charges per published site alongside separate editor seat fees, creating budget
              friction for agencies managing extensive client portfolios or corporate marketing teams maintaining
              sprawling multi-brand web estates. Furthermore, migration costs are steep because proprietary visual
              elements cannot be exported as clean portable codebase.
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The web creation ecosystem spans specialized visual design platforms, all-in-one small-business builders,
              and full custom engineering stacks. Framer has carved out a high-growth niche alongside direct peers like
              Webflow by prioritizing visual design fidelity and AI-assisted canvas creation over complex backend
              development. While incumbent platforms like Wix command vast commercial scale with more than 8.5 million
              active sites worldwide, Framer appeals directly to venture-backed startups and design-centric enterprises
              that demand pixel-level visual control. Having secured $100 million in Series D capital at a $2 billion
              valuation in August 2025, Framer now powers hundreds of thousands of active websites. However, it must
              defend this position against both established website incumbents expanding their visual editors and
              status-quo custom code solutions.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
      - number: '3.2'
        title: 'Feature and Architecture Matrix: Design Ceiling vs. Backend Extensibility'
        blocks:
          - type: paragraph
            body: >-
              A rigorous evaluation of platform capabilities highlights sharp trade-offs between design speed and
              backend sophistication. Framer delivers best-in-class visual interaction tools, providing zero-code spring
              animations, real-time responsive breakpoints, and micro-interactions that outshine traditional template
              systems. Conversely, Webflow retains a clear technical advantage for structured content, offering
              multi-reference relational CMS schemas and the ability to export full production HTML and CSS code
              packages. Framer deliberately confines its CMS to straightforward dynamic collections such as blogs and
              portfolio items, while omitting native e-commerce infrastructure in favor of third-party checkouts like
              Shopify and Stripe. Although Framer leverages React under the hood, its hosted runtime restricts
              self-hosted code execution, forcing buyers to choose between visual design velocity and technical
              architecture ownership.
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP010
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP010
              - CP014
      - number: '3.3'
        title: Pricing, Packaging, and Enterprise Go-to-Market Economics
        blocks:
          - type: paragraph
            body: >-
              Platform packaging structures dictate unit economics and customer retention across creative agencies and
              corporate marketing departments. Framer employs an accessible entry point with self-serve Basic plans
              starting at $15 to $19 monthly, scaling to Pro tiers at $30 to $49 monthly for growing businesses
              requiring staging environments and multiple custom domains. This tiered model offers predictable entry
              pricing compared to Webflow's bifurcated site and workspace plans, which frequently induce bill shock for
              growing creative agencies. Nonetheless, Framer introduces margin friction as teams expand, charging
              incremental seat fees for additional editors and workspace collaborators. In enterprise accounts, Framer
              typically enters through marketing and growth teams to launch standalone campaign pages, operating in
              parallel with internal engineering teams that maintain developer-managed product repositories.
            claimRefs:
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP012
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Framer's primary competitive moat rests on workflow substitution and deep cultural alignment with modern
              product designers. By enabling visual creators to build and publish responsive websites directly without
              submitting static mockups for developer implementation, Framer compresses site launch timelines from
              months to days. However, this workflow advantage faces structural headwinds from high platform switching
              costs and ecosystem lock-in. Because Framer does not support full code export, transitioning a mature
              marketing site to an alternative platform requires rebuilding the entire digital property from scratch.
              Furthermore, as generative AI design plugins inside Figma and headless CMS frameworks continue to mature,
              Framer must continuously defend its interface against commoditization while addressing its structural lack
              of native relational data and commerce capabilities.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP010
              - CP011
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Figma-to-Production Workflow Moat
            body: >-
              Framer's fundamental defensive moat against template incumbents like Wix and Squarespace is rooted in
              design workflow ergonomics. Because modern product design teams already live in Figma, Framer's canvas
              eliminates the friction of traditional front-end engineering handoffs for marketing assets, creating an
              adoption wedge that generic site builders cannot easily replicate.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP011
          - type: callout
            title: Proprietary Infrastructure Lock-In and CMS Ceiling
            body: >-
              While Framer delivers unmatched speed for high-visual landing pages, its architectural lack of full code
              export and relational CMS depth creates meaningful platform lock-in. When fast-growing tech companies
              require complex content taxonomies or multi-region commerce, migrating away from Framer requires a total
              rebuild on Webflow or custom engineering frameworks.
            calloutType: risk
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Multi-Tier Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Framer monetizes its visual design and website publishing engine through a tiered Software-as-a-Service
              (SaaS) subscription model. The platform addresses a broad customer spectrum ranging from solo freelance
              designers and early-stage founders to scaling marketing organizations and enterprise design systems. At
              the base of the monetization funnel, Framer offers a functional Free tier that provides a Framer
              subdomain, 1 GB of bandwidth, and 500 trial AI credits. While non-commercial, this entry point drives
              high-volume bottom-up product adoption and community word-of-mouth. Commercial monetization commences with
              the Basic plan at $10 per month billed annually, designed for personal projects and simple marketing
              landing pages with a custom domain. Professional agencies and scaling startups typically default to the
              Pro plan at $30 per month billed annually, which provides 10 CMS collections, 2,500 items, and production
              SEO infrastructure. Beyond self-serve tiers, Framer negotiates custom annual Enterprise contracts
              featuring single sign-on, advanced security controls, dedicated uptime SLAs, and custom workspace
              governance.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI008
              - CI009
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI010
              - CI012
      - number: '4.2'
        title: Monetization Mechanics, Seat Economics, and Hidden Cost Drivers
        blocks:
          - type: paragraph
            body: >-
              While Framer's headline list pricing appears competitive against traditional CMS alternatives, realized
              customer expenditure expands rapidly as organizations scale team collaboration. The platform operates a
              seat-based expansion model where additional workspace editors cost between $20 and $40 per editor per
              month on Basic and Pro tiers. Consequently, a two-to-three-person startup team with collaborative editing
              seats incurs a realistic monthly spend between $70 and $110 per month, entering the budget territory of
              more mature content systems. Furthermore, an October 2025 pricing overhaul consolidated historical tiers
              and restricted the Basic plan to a single CMS collection and 30 pages, effectively forcing growing
              websites into the Pro tier. Scaling sites also encounter metered infrastructure add-ons, including $20 per
              additional localization locale, tiered bandwidth expansion, and supplemental CMS item allocations up to
              40,000 items. Crucially, Framer does not support static code export, enforcing structural vendor lock-in
              that ensures high customer switching costs once design and marketing workflows are deployed.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
      - number: '4.3'
        title: Capital Adequacy, Series D Liquidity, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Framer's balance sheet was significantly fortified in August 2025 through a $100 million Series D funding
              round led by existing institutional investors Meritech Capital Partners and Atomico, establishing a $2.0
              billion post-money company valuation. This capital infusion followed earlier reported venture funding of
              approximately $60 million, bringing cumulative lifetime equity financing to approximately $160 million to
              $163 million. With an estimated $100 million in fresh primary equity proceeds, Framer maintains
              substantial capital adequacy and an extended multi-year operational runway, insulating the business from
              near-term financing dependency. The company's capital allocation is primarily directed toward expanding
              global enterprise sales teams in San Francisco, Amsterdam, and Barcelona, advancing proprietary visual AI
              agent features, and supporting managed edge hosting infrastructure. As detailed in the historical funding
              chronology established in Company Overview, Framer's growth trajectory shifted following its strategic
              restart from interactive prototyping to full-stack website publishing, transitioning from a historical $4
              million to $5 million ARR plateau into rapid growth that surpassed $1 million in website ARR within months
              of relaunch.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Unit Economics, Valuation Multiples, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Framer presents an attractive top-line commercial profile
              coupled with significant private information gaps. Public disclosures verify substantial scale, with
              hundreds of thousands of active websites and over 500,000 monthly active users, alongside reports that
              business customers represent the fastest-growing revenue cohort. Based on reported scale indicators,
              Framer's annualized run rate is estimated in the vicinity of $50 million in ARR, implying that the $2.0
              billion Series D valuation represents an aggressive multiple of approximately 40x ARR. Underwriting such
              an elevated valuation multiple requires exceptional capital efficiency, durable net revenue retention, and
              industry-leading software gross margins. However, Framer operates as a private company without public
              disclosure of its cost of goods sold, which incorporates pass-through edge hosting infrastructure on
              Vercel and compute costs for generative AI features. Furthermore, cohort-level net revenue retention, logo
              churn rates, and blended customer acquisition cost payback periods remain undisclosed. Until management
              provides verified disclosure room schedules covering cohort retention, enterprise contract values, and
              audited margin profiles, institutional underwriting must treat forward unit economics as an unverified
              diligence gap.
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI010
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Multiple Stretched Ahead of Verified Unit Economics
            body: >-
              At a $2.0 billion post-money valuation on an estimated $50 million ARR run rate (~40x ARR multiple),
              Framer is priced as an elite enterprise platform. Sustaining this multiple requires high gross margins and
              robust net expansion that remain uncorroborated by audited disclosures.
            calloutType: risk
            claimRefs:
              - CI008
              - CI010
              - CI014
          - type: callout
            title: Collaboration Seats Drive Significant ARPU Expansion
            body: >-
              While headline pricing starts at $10 to $30 per month, collaboration editor seats priced at $20 to $40 per
              editor per month allow Framer to effectively triple ARPU on multi-person teams without altering base tier
              pricing.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Framer is an AI-powered visual website builder engineered specifically for designers, marketing teams, and
              high-growth businesses seeking production-grade web publishing without traditional developer handoffs. The
              platform centers on a freeform, Figma-like visual canvas where users manipulate layout, typography,
              interactions, and responsive breakpoints directly. Rather than treating designs as static mockups
              requiring front-end translation, Framer compiles visual layouts directly into performant HTML, CSS, and
              React code deployed to global edge hosting. By collapsing the design, prototyping, content assembly, and
              publishing stages into a single continuous loop, the product compresses marketing page turnaround times
              from several weeks of cross-functional engineering handoffs into hours of visual iteration.
            claimRefs:
