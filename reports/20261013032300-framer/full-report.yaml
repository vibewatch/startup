              - CE002
              - CE008
              - CE011
      - number: '5.4'
        title: Deployment, Extensibility, and Technical Roadmap
        blocks:
          - type: paragraph
            body: >-
              Framer deployment is fully managed and executed through a single-click cloud deployment workflow that
              issues instant edge updates across custom domains. The platform supports staging environments, custom
              redirects, and real-time collaborative editing, while the 3.0 release introduced site branching for team
              reviews before pushing changes live. For extensibility, Framer supports code overrides and code components
              that integrate with external npm packages, third-party analytics, and CRM form endpoints. In addition, the
              platform features an active creator Community marketplace where practitioners share and monetize
              templates, components, and plugins. Roadmap investments emphasize deeper AI capabilities, including
              reusable AI Skills for maintaining corporate design systems, expanded CMS list fields, and automated
              content generation workflows.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE012
      - number: '5.5'
        title: Technical Differentiation, Infrastructure Risks, and Enterprise Controls
        blocks:
          - type: paragraph
            body: >-
              Framer primary competitive differentiation lies in delivering uncompromising design craft and fluid
              micro-interactions while completely abstracting infrastructure management. However, this architecture
              presents distinct technical tradeoffs and platform risks for prospective enterprise adopters. Crucially,
              Framer enforces proprietary hosting lock-in: sites cannot be exported as raw static code bundles for
              self-hosting on independent infrastructure. Furthermore, while the visual CMS excels for standard
              marketing collections, it enforces strict structural caps—such as two collections on Basic and ten on
              Pro—which restrict its viability for content-heavy publishing houses or complex relational directories.
              Prospective customers must also account for the learning curve, as the canvas interface rewards prior
              design tool expertise and demands greater onboarding investment than templated alternatives.
            claimRefs:
              - CE007
              - CE010
              - CE013
              - CE014
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The Unified Design-to-Production Pipeline
            body: >-
              Framers architectural innovation is eliminating the traditional intermediate code representation and
              developer handoff. By executing directly on a visual canvas that compiles natively into optimized React
              code and static assets, marketing and design teams achieve production velocity unattainable in decoupled
              CMS architectures.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
          - type: callout
            title: Hosting Lock-In and CMS Depth Constraints
            body: >-
              While Framer delivers stellar Lighthouse scores and single-click deployment, the platform binds customer
              sites to its proprietary hosting infrastructure without offering standalone static site export.
              Furthermore, strict CMS collection limits and basic search/filtering restrict its viability for
              content-heavy publications or enterprise data directories.
            calloutType: risk
            claimRefs:
              - CE007
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation & Core Personas
        blocks:
          - type: paragraph
            body: >-
              Framer's customer base is structured around four primary demand segments: solo freelance designers,
              early-stage startup teams, digital agencies, and growth-stage marketing units. The platform's initial
              wedge took root with freelance interaction and UI/UX designers seeking to publish interactive client
              deliverables and personal portfolios without translating design files into custom code. In early-stage
              startups, founders and growth marketers deploy Framer to ship landing pages, campaign hubs, and initial
              product marketing sites in hours rather than waiting on backend engineering cycles. For creative agencies
              and digital design studios, Framer serves as a multi-site production environment enabling rapid client
              delivery, template reselling, and frictionless client handoffs. Within larger growth-stage technology
              firms, adoption is typically led by marketing and design teams who carve out public marketing surfaces
              from developer-maintained web applications. This multi-segment pull creates broad top-of-funnel customer
              interest, though customer willingness to pay and long-term contract value vary dramatically between solo
              creators and scaling enterprises.
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU013
