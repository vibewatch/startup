      - number: '6.3'
        title: Enterprise Traction & Named Customer Deployments
        blocks:
          - type: paragraph
            body: >-
              Framer has increasingly secured marquee brand deployments across high-growth software and artificial
              intelligence enterprises. High-profile venture-backed companies including Scale AI, Perplexity, Miro, and
              Bilt Technologies publicly power their primary corporate websites and marketing landing pages using
              Framer. These deployments demonstrate that Framer's visual canvas, animations, and managed edge delivery
              meet the visual polish and performance expectations of prominent modern brands. Furthermore, Framer's
              Series D disclosures indicate that business subscriptions represent the company's fastest-growing revenue
              segment following the rollout of dedicated team tiers and enterprise plans. However, diligence indicates
              that named enterprise adoption remains strictly circumscribed to marketing and brand web surfaces. Core
              software applications, interactive consumer search engines, and transactional financial portals remain
              partitioned on custom-coded engineering stacks, keeping Framer positioned as a marketing front-end tool
              rather than an enterprise application host.
            claimRefs:
              - CU005
              - CU007
              - CU001
