            title: Retention Visibility & E-Commerce / CMS Structural Ceilings
            body: >-
              While Framer exhibits rapid top-of-funnel customer adoption among early-stage startups and creative
              agencies, the absence of public cohort retention disclosures coupled with strict CMS scaling limits and no
              native e-commerce checkout creates material expansion ceilings for larger commercial accounts.
            calloutType: risk
