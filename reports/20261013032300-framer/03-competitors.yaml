  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - Platform & Plan Tier
      - List Price & Billing Model
      - Included Capabilities & Scope
      - Key Limits & Overage Mechanisms
      - Strategic Dilemma / Buyer Implication
    rows:
      - - Framer Basic
        - $15 to $19/mo (annual vs monthly)
        - 1 custom domain, 1,000 CMS items, managed global CDN
        - 1 editor seat included; form limits and single custom domain
        - Cost-effective for solo creators; quickly exhausted by multi-brand teams
      - - Framer Pro
        - $30 to $49/mo (annual vs monthly)
        - 3 custom domains, 10,000 CMS items, staging, password protection
        - Bandwidth thresholds; extra collaborator seats add recurring fees
        - Primary production tier for funded startups; editor seat add-ons increase agency costs
      - - Webflow Core / Growth
        - $14 to $39/mo per site + workspace fees
        - Custom domain, 2,000 to 10,000 CMS records, native e-commerce options
        - Strict site-level traffic caps and separate workspace seat billing
        - Dual-layer pricing structure generates billing friction for growing creative agencies
      - - Wix Light / Core
        - $17 to $29/mo (annual billing)
        - Custom domain, native business apps, integrated payments on Core
        - Storage tiers and transaction processing fees on commerce plans
        - Low friction for general retail merchants; high recurring cost for premium add-ons
      - - Squarespace Business
        - $23/mo ($16/mo billed annually)
        - Custom domain, unlimited bandwidth, integrated basic commerce
        - 3% transaction fee on Business plan; advanced commerce requires $27–$52/mo tier
        - Predictable spend for boutique brands; feature ceiling forces migration at scale
    notes: List prices reflect published annual and monthly rate cards across platforms as of 2026. Realized enterprise contract pricing varies based on custom MSA negotiation.
