callouts:
  - calloutType: insight
    title: The Figma-to-Production Workflow Moat
    body: Framer's fundamental defensive moat against template incumbents like Wix and Squarespace is rooted in design workflow ergonomics. Because modern product design teams already live in Figma, Framer's canvas eliminates the friction of traditional front-end engineering handoffs for marketing assets, creating an adoption wedge that generic site builders cannot easily replicate.
    claimRefs:
      - CP001
      - CP004
      - CP011
  - calloutType: risk
    title: Proprietary Infrastructure Lock-In and CMS Ceiling
    body: While Framer delivers unmatched speed for high-visual landing pages, its architectural lack of full code export and relational CMS depth creates meaningful platform lock-in. When fast-growing tech companies require complex content taxonomies or multi-region commerce, migrating away from Framer requires a total rebuild on Webflow or custom engineering frameworks.
    claimRefs:
      - CP002
      - CP005
      - CP006
      - CP010
