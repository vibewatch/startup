      - CI003
      - CI004
      - CI005
      - CI010
      - CI012
    data:
      nodes:
        - id: node-acquisition
          label: 自助与社区获客
          detail: 50 万月活用户和初创企业采用者通过免费 Canvas 进入
        - id: node-free-funnel
          label: 免费计划验证
          detail: 用户在 Framer 子域名上构建网站，获得 1 GB 带宽和试用 AI 积分
        - id: node-basic-conversion
          label: 基础版网站升级（$10/月）
          detail: 个体创始人连接自定义域名，制作简单营销页面
        - id: node-pro-standard
          label: 专业版平台基线（$30/月）
          detail: 设计团队升级后获得 10 个 CMS 集合、2,500 个项目和生产级 SEO
        - id: node-seat-expansion
          label: 协作席位扩张
          detail: 以每月 $20 至 $40 增加编辑席位，将团队支出扩展至 $70-$110/月
        - id: node-enterprise-contract
          label: 企业合同扩张
          detail: 专用基础设施、自定义 SLA 和企业安全推动 ARR 增长
