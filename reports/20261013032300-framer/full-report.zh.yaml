        - from: node-basic-conversion
          to: node-pro-standard
        - from: node-pro-standard
          to: node-seat-expansion
        - from: node-seat-expansion
          to: node-enterprise-contract
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构展示 Framer 如何从可视化设计和 AI 智能体，经 React 编译、静态优化，最终实现全球边缘分发。
    data:
      layers:
        - label: 第 1 层：可视化设计 Canvas
          detail: 支持流畅自动布局的空间化拖放创作环境
          modules:
            - 无限布局 Canvas
            - 智能堆栈与自动布局
            - Figma 导入插件
            - 响应式断点
        - label: 第 2 层：生成式 AI 与 Framer Agent
          detail: 自动生成布局结构和设计样式的自主 LLM 智能体
          modules:
            - Canvas 内页面合成
            - 设计系统样式
            - 响应式断点适配
            - AI 积分编排
        - label: 第 3 层：动态内容与 CMS 引擎
          detail: 支持模板化发布的多集合关系型内容存储
          modules:
            - 多集合 CMS
            - 字段模式与列表字段
            - 可视化模板绑定
            - 本地化与重定向
        - label: 第 4 层：React 编译与扩展运行时
          detail: 将 Canvas 图层转换为 React 组件的抽象语法树编译
          modules:
            - AST 到 React 编译器
            - 自定义代码组件
            - 代码覆盖脚本
            - 外部 API 集成
        - label: 第 5 层：资源优化与构建管线
          detail: 生成压缩包、图片和 SEO 元数据的静态构建优化器
          modules:
            - JavaScript 压缩
            - 自动图片压缩
            - Sitemap 与 robots.txt 生成
            - 语义化 HTML 生成
        - label: 第 6 层：全球边缘托管与 CDN 基础设施
          detail: 通过零配置 SSL 提供缓存静态文件的全球分布式 CDN
          modules:
            - 全球边缘分发
            - 自动 SSL 证书配置
            - 实时边缘缓存
            - 原生分析遥测
    approximationNotes: 架构层代表平台服务的逻辑分工；托管和编译管线均作为全托管专有云服务运行。
    claimRefs:
      - CE001
      - CE002
      - CE008
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从发现免费 Canvas，到转化为企业客户并扩张的端到端采用路径。
    data:
      items:
        - label: 发现与探索 Canvas
          detail: 设计师通过社区模板、X 或 Figma 导入发现 Framer，从免费 Canvas 开始。
          touchpoints:
            - Figma 设计导入
            - 免费档 Canvas
            - 社区模板
        - label: 原型设计与可视化组装
          detail: 使用自动布局、动画、组件和内置 CMS 集合设计可视化布局。
          touchpoints:
            - 微交互
            - CMS 集合
            - 断点设置
        - label: 首次生产发布
          detail: 直接发布至全球边缘网络，并在基础版或专业版上连接自定义域名。
          touchpoints:
            - 自定义域名
            - 边缘 CDN 托管
            - 自动生成 SEO
        - label: 团队与营销扩张
          detail: 邀请营销人员和内容编辑参与多人编辑及页面内容更新。
          touchpoints:
            - 多人 Canvas
            - 页面内编辑
            - 表单集成
        - label: 转化优化（Convert）
          detail: Scale 计划采用 Framer Convert 增值组件，实现原生 A/B 测试和漏斗分析。
          touchpoints:
            - Framer Convert 增值组件
            - A/B 测试变体
            - 流量触发器
        - label: 企业与生产规模
          detail: 将全公司的网页资产迁移至企业版，获得 SSO、预发布环境和 SLA 保障。
          touchpoints:
            - 企业合同
            - 反向代理
            - 专属支持
