figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Framer 从早期交互式设计原型工具，逐步演进为 AI 原生网站发布平台，并扩张至 $2B 企业市场。
    approximationNotes: 里程碑日期来自已核实的融资公告、产品更新日志和科技行业评测。
    data:
      items:
        - date: '2014'
          label: 在阿姆斯特丹成立
          detail: Koen Bok 和 Jorn van Dijk 在阿姆斯特丹注册 Framer，将其打造为先进的代码原型工具。
          tone: neutral
        - date: '2018'
          label: Framer X 发布
          detail: Framer 引入 React 组件支持和可扩展设计 Canvas，服务数字产品团队。
          tone: neutral
        - date: '2022'
          label: 战略转向网站构建
          detail: Framer 转向网站发布，推出可视化无代码设计、CMS 和托管服务。
          tone: positive
        - date: '2023'
          label: Framer AI 引入
          detail: 原生生成式 AI 工具和样式生成器直接加入可视化 Canvas。
          tone: positive
        - date: '2024'
          label: 商业计划与企业版发布
          detail: Framer 推出专属商业计划、团队工作区权限和可扩展流量档位。
          tone: positive
        - date: 2025-08
          label: Series D 与 $2B 估值
          detail: Framer 完成由 Meritech 和 Atomico 领投的 $100M Series D，达到 50 万 MAU，商业采用快速增长。
          tone: positive
        - date: 2025-11
          label: Framer 3.0 平台升级
          detail: 发布 Framer Agent、设计页面、分支功能和集成式社区市场。
          tone: positive
        - date: 2026-01
          label: 生态成熟与规模化采用
          detail: 平台扩大到近期 YC 初创企业的 40%，同时面临企业锁定效应审查。
          tone: neutral
    claimRefs:
      - CO001
      - CO003
      - CO005
