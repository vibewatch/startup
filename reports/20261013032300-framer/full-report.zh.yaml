  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 展示设计驱动的用户获取如何转化为自助订阅、团队席位扩张和高价值企业合同。
    approximationNotes: 转化率和确切档位流失情况属于方向性估算，依据是已报道的用户基础和定价档位架构。
    claimRefs:
