      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 专有画布架构带来的高切换成本
            body: Framer 不导出可供外部自托管的独立 HTML/CSS/React 包，因此组织迁出时要承担整体重建成本。技术尽调必须评估营销速度是否值得多年供应商锁定。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 企业采用的尽调重点
            body: 潜在企业客户和成长型投资者应核实 Framer 的 SOC 2 Type II 审计状态，并要求合同 SLA 覆盖 CDN 可用性和数据可移植性保障。
            calloutType: recommendation
            claimRefs:
