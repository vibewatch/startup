  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险画像
        blocks:
          - type: paragraph
            body: >-
              Framer 是一家总部位于荷兰阿姆斯特丹的国际网站平台；2025 年 8 月 D 轮融资后，公司在旧金山和巴塞罗那开展跨境运营。Framer
              托管公开网站并处理数十万个在线域名的终端用户参与数据，因此直接处于欧盟《通用数据保护条例》和不断演进的跨大西洋数据隐私框架监管范围内。随着品牌核心网站迁移到其多租户云基础设施，企业采购审查也在加强。缺乏公开
              SOC 2 Type II 审计报告或详细渗透测试披露，构成企业安全委员会评估生产部署时的重要验证障碍。监管风险还包括欧盟和美国司法辖区不断变化的数字无障碍要求，以及消费者追踪 Cookie
              同意合规；相关责任由平台基础设施控制和客户配置的画布代码共同承担。
            claimRefs:
              - CR003
              - CR010
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR010
              - CR014
      - number: '7.2'
        title: 运营基础设施、性能与安全漏洞
        blocks:
          - type: paragraph
            body: >-
              Framer 的架构把可视化无限设计画布与直接编译为生产 React、HTML 和 CSS 结合起来，再托管于受管理的云基础设施。公司为已发布网站宣传 99.99%
              正常运行时间，依靠多租户边缘交付网络服务全球流量，无需客户维护基础设施。但这种集中式托管架构集中了承压点：Framer
              核心部署流水线、边缘路由或云托管合作方一旦中断，就会立即影响客户网站和公开品牌的在线时间。独立技术评估指出，复杂且交互密集的网站性能可能明显下降。过多微交互、复杂滚动联动动画和未优化媒体资产经常引入编辑器延迟及已发布页面渲染迟缓。由于
              Framer 通过 JavaScript 和 React 包直接在浏览器执行复杂布局，团队必须严格管理资产，避免损害 Core Web Vitals、移动端响应能力和搜索引擎可抓取性。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR014
      - number: '7.3'
        title: 平台锁定、电商限制与依赖集中
        blocks:
          - type: paragraph
            body: >-
              Framer 客户面临的核心战略脆弱性是深度平台锁定。Framer 是完全托管的封闭专有平台，不支持导出可移植网站源代码，也不支持把生成资产部署到独立托管环境。若组织选择离开
              Framer，不能简单迁移模板或数据库架构；离开的团队必须在替代平台上从头彻底重建网站和 CMS 集合。此外，Framer 原生 CMS
              主要为结构化营销页面、案例研究和企业博客设计，在需要多币种结账、库存同步或动态 SKU 变体的复杂电商目录上存在明显功能缺口。Framer 虽支持自定义 React 代码嵌入和外部 API
              连接，但随着流量、CMS 项目和协作席位在不同按站点订阅计划中增长，客户经济性会面临叠加的价格上涨。Framer 的生成式 AI 代理还依赖外部基础模型 API，为提示驱动的布局生成引入运营对手方风险。
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
