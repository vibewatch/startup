  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Framer 的核心投资论点建立在已验证的产品转型之上：它从交互原型沙盒变成生产级网站发布平台，消除了营销和企业网站的传统工程交接。Framer 提供类似 Figma 的画布界面，同时生成可投入生产的
              HTML、CSS 和 React 基础设施，由此抓住风险投资支持的初创企业和设计导向企业的高速网站创建需求，包括 Scale AI、Perplexity 和 Miro。此外，管理层披露 2025 年在 ARR
              达到 $50M 的同时实现经营盈亏平衡，显示出区别于资本密集型无代码同业的运营杠杆。


              反论点则集中在极高估值倍数、客户集中度风险，以及新兴 vibe-coding 和 AI 代码生成工作流带来的技术颠覆。按 $50M ARR 和 $2.0B 投后估值计算，Framer 的交易倍数约为 40x
              追踪经常性收入。要兑现其宣称的 $100M ARR 目标，这一溢价要求执行几乎不能出错，但公司没有披露底层净收入留存、合同流失或获客成本回收指标。此外，尽管 Framer 已加入 AI 设计代理和动态 CMS
              能力，如果全栈 AI 开发环境取代可视化网站构建器，独立网站发布仍可能遭遇结构性去中介化。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
      - number: '8.2'
        title: 当前融资背景与倍数
        blocks:
          - type: paragraph
            body: >-
              Framer 于 2025 年 8 月完成 $100M D 轮融资，Meritech Capital 和 Atomico 两家长期合作伙伴领投，WiL 与 HV Capital 参投，投后估值达到
              $2.0B。本轮融资之前，公司在 2023 年由 Meritech 领投完成 $27M C 轮，此前还有自 2014 年在阿姆斯特丹由 Koen Bok 和 Jorn van Dijk
              创立以来的多轮融资，累计股权融资约 $163M。本轮进一步强化了领投方的机构承诺，但也确立了陡峭的定价基准，远超上市 SaaS 公司的估值倍数，使新投资者面临倍数压缩风险。


              网页发布、数字体验和设计基础设施领域的公开市场可比公司——包括 Squarespace、Wix 和 Figma——的远期收入倍数明显更低，介于 3.5x 至 15x。只有当 Framer 将收入从 $50M
              ARR 增长至 $100M ARR、维持 100% 同比收入增长并保持现金收支平衡，40x 的追踪 ARR 倍数才有可能成立。
              由于企业平均合同金额（ACV）、多年期承诺以及扣除托管成本后的毛利率均没有经过验证的披露，以 D 轮估值进入意味着上行空间已被充分定价，而安全边际有限。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
      - number: '8.3'
        title: 情景分析与尽调要点
        blocks:
          - type: paragraph
            body: >-
              将 Framer 的投资画像放入乐观、基准和悲观运营情景后，可以看出当前资本结构中嵌入了不对称的下行风险。在乐观情景下，Framer 成功将 ARR 翻倍至 $100M，推动 Global 2000
              企业营销团队采用企业版，并抵御 vibe-coding 替代品对其视觉画布领导地位的冲击，维持 25x 倍数，达到 $2.5B 的合理市场估值。在基准情景下，自助服务客户流失抵消了企业客户增长，收入增速降至
              40% 的复合水平，收入达到 $70M，倍数压缩至 18x，对应 $1.26B 估值，较 D 轮估值下跌 37%。


              在悲观情景下，AI 原生代码生成器和 Webflow 等可视化网站构建工具带来的竞争侵蚀将增速压至 20%；托管基础设施成本侵蚀利润率， 促使倍数向成熟软件的 10x 重置，对 $60M ARR 对应 $600M
              估值（下跌 70%）。因此，我们的尽调立场仍是跟踪，而非买入。在配置资本或评估二级交易之前，机构投资者必须核实四项关键尽调内容：按客户层级划分的群组净收入留存率、扣除托管和 AI 推理成本后的
              毛利率、企业合同终止权，以及 D 轮优先股之间的清算优先权顺位。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 估值纪律需要耐心跟踪
            body: >-
              按 $2.0B 投后估值计算，Framer 的交易倍数约为 40x ARR。公司的现金收支平衡状态以及在高增长科技公司中的快速普及，说明产品具备优势，但按这一估值进入意味着必须几乎完美地执行 $100M ARR
              目标。我们建议，在经过审计的客户群留存指标和软件毛利率得到 独立验证之前，继续保持跟踪立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
