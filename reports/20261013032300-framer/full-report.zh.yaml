              Framer 的商业扩张模式依赖从免费画布试用走向 Basic、Pro 和 Scale 套餐的“先落地、再扩张”机制。为推动高层级合同扩张，Framer 于 2026 年 3 月推出 Framer
              Convert，把原生视觉漏斗、A/B 测试变体和动态流量触发器作为付费附加项。团队协作和多人画布编辑功能进一步推动组织升级账户。尽管有这些扩张杠杆，Framer 仍面临结构性留存阻力。平台把 CMS
              集合上限设为 10,000 个项目，内容编辑工具也较基础，不适合大规模出版运营或复杂内容架构。此外，Framer 不支持原生电商购物车或结账，交易型商家只能依赖 Shopify Buy Button
              等第三方组件。关键是，Framer 对净收入留存（NRR）、毛续约率、年度 cohort 流失和头部客户收入集中度完全不公开，长期账户耐久性尚未通过尽调验证。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
              - CU014
      - number: '6.5'
        title: 展示
        blocks:
          - type: callout
            title: 设计师主导的自下而上采用护城河
            body: Framer 的主要商业切口是产品驱动采用：UI/UX 设计师用免费画布做作品集项目，随后在初创企业和数字代理机构内部推广 Framer，绕过传统工程采购周期。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU010
          - type: callout
            title: 留存可见性与电商 / CMS 结构上限
            body: Framer 在早期初创企业和创意代理机构中展现出快速的漏斗上层采用，但缺乏公开 cohort 留存披露，加上 CMS 扩展严格受限且没有原生电商结账，为大型商业账户设置了明显的扩张上限。
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
