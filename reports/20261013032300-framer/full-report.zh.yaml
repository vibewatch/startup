chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与运营规模
        blocks:
          - type: paragraph
            body: >-
              Framer B.V. 由 Koen Bok 和 Jorn van Dijk 于 2014
              年在阿姆斯特丹创立，已从精品交互原型工具成长为高速增长、设计驱动的网站构建平台。公司在荷兰阿姆斯特丹和美国加州旧金山设有双总部，提供现代化网站创作画布，把可视化设计直接编译成响应式托管 Web
              应用，省去传统开发者交接。截至 2025 年 8 月 D 轮融资时，Framer 披露全球支持数十万个活跃网站，月活用户超过
              500,000，覆盖独立创作者、设计代理机构和商业企业。平台在高速增长的科技初创企业中渗透显著；管理层披露，最近一届 Y Combinator 批次中有 40% 的公司用 Framer 部署了主要公开网站。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO007
              - CO008
      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Framer 的管理层和产品愿景仍由原始联合创始人、首席执行官 Koen Bok 与联合创始人 Jorn van Dijk 主导。2014 年在阿姆斯特丹创办 Framer 前，两人共同创办
              Sofa——一家以用户界面工艺闻名、广受认可的荷兰软件与设计工作室，并于 2011 年被 Facebook 收购。两位创始人随后都在 Facebook 担任产品和交互设计师，之后离开并创办
              Framer。创始人在交互设计领域的深厚积累为其在全球 UI/UX 设计社区中的可信度提供支撑，但管理决策和品牌掌舵仍高度依赖关键人物。公司治理体现顶级风险投资支持的常见结构：领投方 Meritech
              Capital Partners 与欧洲风投 Atomico 的机构代表和管理层共同接受董事会层面的监督。
            claimRefs:
              - CO001
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO010
      - number: '1.3'
        title: 资本结构、估值与利益相关方
        blocks:
          - type: paragraph
            body: >-
              2025 年 8 月，Framer 完成 $100M D 轮融资，投后估值达到 $2B，进一步巩固了企业级科技独角兽地位。现有投资方 Meritech Capital Partners 与欧洲成长型投资者
              Atomico 共同领投，使机构融资轮累计股权融资额估计约 $163M。随着专门组织工作区推出，企业和团队账户成为增长最快的收入板块，商业客户获客出现拐点，推动了这笔资本注入。Framer
              采用多层订阅定价，从免费个人项目、自助 Mini 和 Pro 套餐，延伸至服务 Scale AI、Perplexity、Miro 和 Bilt 等规模化科技公司的定制 Enterprise 合同。
            claimRefs:
              - CO003
              - CO004
              - CO009
              - CO011
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO010
      - number: '1.4'
        title: 平台演进、里程碑与企业尽调约束
        blocks:
          - type: paragraph
            body: >-
              Framer 的战略轨迹经历了一次雄心勃勃的产品转向：公司从小众、以代码为中心的原型工具变成集成式 AI 原生网站发布平台。Framer 最初于 2014 年推出，用于制作交互式移动端和 Web 原型；2022
              年，公司重构架构，将无代码网站设计直接连接到托管服务、内容管理系统和 SEO 基础设施。Framer 3.0 与画布原生 AI
              设计代理的推出进一步加速转型，让设计师可以实时提示布局、生成文案并本地化页面。不过，尽调也揭示了明显的架构取舍：由于采用专有代码生成而非导出干净源代码，网站迁出 Framer
              必须从头重建，形成显著供应商锁定。此外，独立评估指出，企业级角色权限、高级设计 token 治理和原生电商基础设施仍不成熟。
            claimRefs:
              - CO005
              - CO006
              - CO012
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO012
      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 从设计到生产，消除工程交接瓶颈
            body: Framer 把可视化画布设计、实时发布和原生 AI 代理合在一起，绕过传统前端工程周期，改变了初创企业和营销团队的网站开发经济性。
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
              - CO009
          - type: callout
            title: 供应商锁定与治理成熟度限制企业转型
            body: Framer 能快速转化初创企业和代理机构账户，但由于托管服务专有且无法导出原始代码，加上基于角色的访问控制和设计系统 token 标准化仍在演进，企业渗透面临阻力。
            calloutType: risk
            claimRefs:
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Framer 处于可视化 Web 开发和网站发布软件领域，位于 UI
              设计画布、托管前端和无代码内容管理的交汇处。平台主要面向营销网站、互动落地页、活动中心和创意作品集；动画质量与快速视觉迭代决定转化。范围明确包括设计工具订阅、响应式断点布局、全球内容分发网络、自定义域名托管和原生动效交互，但架构有意排除全栈
              Web 应用工程、交易后端逻辑、复杂关系数据库和企业电商运营。在传统数字工作流中，营销团队要么支付高昂的开发者交接成本，把 Figma 原型重新编码为 React 或 Webflow 实现，要么使用
              WordPress、Squarespace 等受模板约束的内容平台。Framer 将自由设计画布与即时线上 URL 发布结合，替代了外部代理开发合同和僵化的传统网站构建器。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM011
      - number: '2.2'
        title: 从宏观、供应商和尽调视角测算可服务市场
        blocks:
          - type: paragraph
            body: >-
              评估 Framer 的市场机会，必须把供应商叙事与可寻址软件支出分开。Framer 管理层在 D 轮融资期间称，专业网站创建正处于价值数百亿美元的转型期，并认为企业网站代表着准备接受可视化颠覆的
              TAM。然而，结构化尽调对全球网站构建和 CMS 市场采用了更严格的视角。全球网站构建及内容平台市场年支出约为 $14.0B 至
              $18.0B，但其中很大部分来自消费者业余用户、定制系统集成和内容密集型媒体出版商。在这一整体市场中，Framer
              的服务可寻址市场（SAM）涵盖设计导向的数字代理机构、科技初创企业营销团队和企业品牌活动部门，估计为 $2.8B 至 $3.5B。若进一步限定为愿意采用按站点计费、且不具备原生电商和复杂关系 CMS 能力的托管
              SaaS 客户，Framer 的现实可服务可获取市场（SOM）收缩至 $450M 至 $650M。公开研究缺乏隔离 Framer 市占率的细分独立披露，因此长期渗透预期存在较大估计偏差。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM010
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM011
      - number: '2.3'
        title: 买方画像、用户工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              Framer 的商业采用覆盖三类主要买方：风险投资支持的科技初创企业、数字设计代理机构和自由职业者，以及中型市场到企业级营销部门。科技初创企业中，创始人和增长营销人员是经济买方，优先追求快速迭代；最近的 Y
              Combinator 批次中有 40% 的团队在 Framer 上线，印证了这一点。创意代理机构和自由设计工作室的负责人购买 Framer
              工作区许可，以压缩交付周期，并收回过去被外包工程合作方拿走的开发利润。在中型 SaaS 组织中，品牌总监和营销副总裁等预算负责人资助 Framer
              部署，以绕过工程排期，直接发布响应式活动微网站。商业变现按发布站点计费，年度合同下从 Basic（$10/月）到 Pro（$30/月）再到
              Scale（$100/月），并叠加协作编辑席位的月度经常性费用。不断壮大的教育平台和社区模板市场进一步降低了初级设计师的上手门槛。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: 增长驱动、架构上限与尽调现实
        blocks:
          - type: paragraph
            body: >-
              采用速度由强劲的运营驱动因素推动，尤其是消除前端开发瓶颈和整合 AI 辅助创建工具。近期平台更新加入 AI
              Agents、自动页面效果控制和页面内浏览器编辑，让非技术品牌团队可以在数小时而非数周内上线并修改网站。但尽调也暴露出限制扩张的架构约束。平台原生 CMS 缺乏关系深度、高级内容筛选和程序化 SEO
              工具，无法满足数千页出版物的需求。此外，原生电商缺失，必须与 Shopify 等平台做第三方集成，限制了 Framer
              对交易型商业品牌的用途。供应商锁定也是结构性迁移障碍，因为专有画布元素无法导出到干净的外部代码库。因此，Framer 虽然对设计驱动的营销网站极具吸引力，但若要成为企业核心 Web
              基础设施，仍需解决内容规模化和治理能力的根本上限。
            claimRefs:
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 摩擦转移：视觉速度与架构深度
            body: >-
              Framer 让 Web 画布的操作体验几乎等同于 Figma，成功抓住了高速设计这一切入口。但其长期可寻址市场受架构取舍约束：它主导 5 至 30 页的营销网站，而需要深度关系数据库、程序化 SEO
              或原生结账的平台，仍依附于 Webflow、WordPress 或定制工程。
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM010
              - CM011
          - type: callout
            title: 多站点及大型内容账户的扩张阻力
            body: Framer 按发布站点收费，并另收编辑席位费，给管理大量客户组合的代理机构或维护庞大多品牌网站资产的企业营销团队带来预算摩擦。此外，专有视觉元素无法导出为干净的可移植代码库，迁移成本很高。
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
              - CM013
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、传统平台与替代方案
        blocks:
          - type: paragraph
            body: >-
              网站创建生态涵盖专业可视化设计平台、一体化小企业构建器和全定制工程栈。Framer 与 Webflow 等直接同业并列，靠优先提供视觉设计还原度和 AI
              辅助画布创建，在复杂后端开发之外切出高速增长的细分市场。Wix 等传统平台在全球拥有超过 8.5M 个活跃网站，商业规模巨大；Framer
              则直接吸引要求像素级视觉控制的风险投资支持型初创企业和设计导向企业。2025 年 8 月以 $2B 估值完成 $100M D 轮融资后，Framer
              目前支持数十万个活跃网站，但必须同时抵御扩展可视化编辑器的成熟网站平台和现状定制代码方案。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
      - number: '3.2'
        title: 功能与架构矩阵：设计上限与后端扩展性
        blocks:
          - type: paragraph
            body: >-
              对平台能力的严格评估显示，设计速度与后端复杂度之间存在鲜明取舍。Framer 提供一流的视觉交互工具，包括零代码弹簧动画、实时响应式断点和微交互，表现优于传统模板系统。反之，Webflow
              在结构化内容上保持明显技术优势，提供多重引用关系 CMS 架构，并可导出完整生产 HTML 和 CSS 代码包。Framer 有意将 CMS 限定于博客、作品集等简单动态集合，放弃原生电商基础设施，转而支持
              Shopify、Stripe 等第三方结账。虽然 Framer 底层使用 React，但其托管运行时限制自托管代码执行，买方必须在可视化设计速度和技术架构所有权之间选择。
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP010
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP010
              - CP014
      - number: '3.3'
        title: 定价、套餐与企业级市场进入经济性
        blocks:
          - type: paragraph
            body: >-
              平台套餐结构决定创意代理机构和企业营销部门的单位经济性及客户留存。Framer 以易于进入的自助 Basic 套餐起步，月费 $15 至 $19；对需要预发布环境和多个自定义域名的成长型企业，Pro 套餐月费为
              $30 至 $49。与经常让成长中的创意代理机构遭遇账单冲击、将站点计划和工作区计划分开的 Webflow 相比，这种分层模式提供了可预测的入门价格。不过，随着团队扩大，Framer
              通过额外编辑者和工作区协作者席位收费，带来利润摩擦。在企业账户中，Framer 通常从营销和增长团队切入，用来发布独立活动页面，并与维护开发者管理产品仓库的内部工程团队并行运行。
            claimRefs:
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP012
      - number: '3.4'
        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Framer
