  - id: FM001
    title: 可服务市场规模金字塔
    type: pyramid
    summary: 通过分层视角，将宏观网站创建支出逐级拆解至 Framer 在设计驱动型生产网站中的核心可服务市场。
    data:
      items:
        - label: 全球网站开发与数字体验生态
          value: 45
          unit: USD B
          detail: 最大口径的生态支出，包括定制软件开发、系统集成和企业代理服务费
        - label: 全球网站构建器与内容管理系统（宏观 TAM）
          value: 16
          unit: USD B
          detail: 覆盖 DIY 网站构建器、开源 CMS 托管和商业网站平台的总可寻址市场
        - label: 无代码与可视化开发平台支出
          value: 7.5
          unit: USD B
          detail: 面向非技术创作者、营销人员和开发者的可视化创作软件支出
        - label: 设计驱动型营销网站与生产落地页（SAM）
          value: 3.2
          unit: USD B
          detail: 可服务市场，代表高端动画营销网站、作品集和营销活动页面
        - label: 初创企业与现代科技公司网站创建（SOM）
          value: 0.85
          unit: USD B
          detail: 高匹配市场，涵盖优先采用 Figma 到网站工作流的风险投资支持型初创企业、科技公司和设计机构
        - label: Framer 核心可寻址范围（现实 SOM）
          value: 0.55
          unit: USD B
          detail: 当前可获得的可服务市场，受 CMS 规模边界和缺乏原生电商能力限制
