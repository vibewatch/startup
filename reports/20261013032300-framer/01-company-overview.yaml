callouts:
  - calloutType: "insight"
    title: "Design-to-Production Shift Eliminates Engineering Handoff Bottlenecks"
    body: "Framer's convergence of visual canvas design, live publishing, and native AI agents fundamentally alters web development economics for startups and marketing teams by bypassing traditional front-end engineering cycles."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO009"
  - calloutType: "risk"
    title: "Enterprise Transition Constrained by Vendor Lock-in and Governance Maturity"
    body: "While Framer rapidly converts startup and agency accounts, enterprise penetration faces friction from proprietary hosting lock-in without raw code export alongside evolving role-based access control and design system token standardization."
    claimRefs:
      - "CO014"
      - "CO015"
