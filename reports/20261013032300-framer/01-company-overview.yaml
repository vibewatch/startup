company:
  name: "Framer"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Framer is an Amsterdam-founded, dual-headquartered visual website platform that achieved a $2 billion valuation in August 2025 following a $100 million Series D led by Meritech and Atomico. Having pivoted from interaction prototyping to full-stack web publishing with native AI agents, Framer powers over 500,000 monthly active users and 40% of recent Y Combinator startup launches, though enterprise transition remains constrained by proprietary lock-in and unverified financial margins."
sections:
  - id: "section-identity-scale"
    title: "Corporate Identity, Foundation, and Operating Scale"
    body: "Founded in 2014 in Amsterdam by Koen Bok and Jorn van Dijk, Framer B.V. has evolved from a boutique interaction prototyping tool into a high-growth, design-led website builder. Operating dual headquarters in Amsterdam, Netherlands, and San Francisco, California, the company provides a modern web creation canvas that eliminates traditional developer handoffs by compiling visual designs directly into responsive, hosted web applications. As of its August 2025 Series D financing, Framer reported supporting hundreds of thousands of active websites globally and engaging more than 500,000 monthly active users across independent creators, design agencies, and commercial enterprises. The platform has achieved notable penetration across high-velocity technology startups, with management disclosing that 40% of the companies in the most recent Y Combinator batch deployed their primary public web properties on Framer."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "section-leadership-governance"
    title: "Founders, Executive Leadership, and Governance"
    body: "Framer's executive leadership and product vision remain anchored by its original co-founders, Chief Executive Officer Koen Bok and co-founder Jorn van Dijk. Prior to launching Framer in Amsterdam in 2014, Bok and van Dijk co-founded Sofa, an acclaimed Dutch software and design studio renowned for user interface craftsmanship that was acquired by Facebook in 2011. Both founders subsequently worked as product and interaction designers at Facebook before departing to establish Framer. While the founders' deep roots in interaction design provide unparalleled credibility within the worldwide UI/UX design community, executive decision-making and brand stewardship carry substantial key-person dependency. Formal corporate governance reflects typical top-tier venture backing, with institutional representatives from lead investors Meritech Capital Partners and European venture firm Atomico providing board-level oversight alongside executive management."
    claimRefs:
      - "CO001"
      - "CO010"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "section-capitalization-investors"
    title: "Capitalization Structure, Valuation, and Stakeholders"
    body: "In August 2025, Framer solidified its position as an enterprise-grade technology unicorn by securing a $100 million Series D financing round that valued the business at a post-money valuation of $2 billion. The round was co-led by existing venture backers Meritech Capital Partners and European growth investor Atomico, bringing estimated cumulative equity capital raised across institutional financing rounds to roughly $163 million. The capital injection was driven by an inflection in commercial customer acquisition, with business and team accounts emerging as the platform's fastest-growing revenue segment following the roll-out of dedicated organizational workspaces. Framer operates a multi-tiered subscription pricing architecture ranging from free personal projects to self-serve Mini and Pro tiers, extending to custom Enterprise contracts that serve scaled tech companies including Scale AI, Perplexity, Miro, and Bilt."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO009"
      - "CO011"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "section-product-milestones"
    title: "Platform Evolution, Milestones, and Enterprise Diligence Constraints"
    body: "Framer's strategic trajectory reflects an ambitious product pivot that transformed the company from a niche code-centric prototyping utility into an integrated, AI-native web publishing platform. Originally launched in 2014 to build interactive mobile and web prototypes, Framer repositioned its architecture in 2022 to deliver no-code website design directly linked to managed hosting, content management systems, and SEO infrastructure. The introduction of Framer 3.0 and canvas-native AI design agents accelerated this transition by allowing designers to prompt layouts, generate copy, and localize pages in real time. However, diligence highlights material architectural trade-offs: migrating websites off Framer requires rebuilding from scratch due to proprietary code generation rather than exporting clean source code, creating significant vendor lock-in. Furthermore, independent assessments observe ongoing maturity gaps in enterprise-grade role permissions, advanced design token governance, and native e-commerce infrastructure."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO012"
      - "CO014"
      - "CO015"
    tableRefs: []
    figureRefs:
      - "FO001"
