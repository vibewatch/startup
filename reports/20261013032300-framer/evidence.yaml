evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials-and-arr-breakdown
    missingEvidence: >-
      Audited financial statements, precise ARR breakdown across self-serve and enterprise plans, and gross margin
      margins.
    whyItMatters: Without segmented ARR and gross margins, valuation multiples cannot be audited against peer SaaS benchmarks.
    diligencePath: Request confidential management presentation or audited financials during pre-investment diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map-coverage
    missingEvidence: >-
      Complete cap table and list of all historical equity holders across Seed, Series A, Series B, Series C, and Series
      D.
    whyItMatters: >-
      Partial stakeholder map leaves secondary transactions, debt/convertible notes, and minority shareholding
      structures unverified.
    diligencePath: Review formal cap table and shareholder registers via Dutch Chamber of Commerce (KvK) and company legal counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount-and-office-distribution
    missingEvidence: >-
      Current organizational headcount breakdown by engineering, product, sales, and geography (Amsterdam vs. SF vs.
      remote).
    whyItMatters: Operating leverage and burn rate cannot be reliably projected without headcount and location details.
    diligencePath: Obtain organizational chart and headcount census in confirmatory diligence.
  - type: missing-source
    severity: material
    topic: market-sizing-gaps
    missingEvidence: >-
      Audited third-party market share breakdowns and verifiable segment-level revenue figures separating Framer's
      annual recurring revenue across self-serve freelancers, creative agencies, and enterprise marketing tiers.
    whyItMatters: >-
      Without independent disclosure of Framer's revenue mix and addressable spend penetration, valuing the business
      against broad 'tens of billions' market statements carries high modeling uncertainty.
    diligencePath: >-
      Request management disclosure on ARR breakdown by customer cohort, enterprise contract expansion rates, and
      pipeline conversion from agency referrals during formal diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-acv-and-churn
    missingEvidence: >-
      Audited enterprise average contract value (ACV) distributions, logo churn benchmarks, and net revenue retention
      (NRR) cohorts for Framer versus Webflow.
    whyItMatters: >-
      Without verifiable contract sizing and enterprise renewal rates, underwriting Framer's long-term enterprise
      penetration against Webflow's sales motion remains constrained.
    diligencePath: >-
      Request confidential enterprise customer cohort retention curves and annual contract value breakdowns during
      management diligence.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: ecommerce-conversion-metrics
    missingEvidence: >-
      Third-party checkout conversion and merchant gross merchandise value (GMV) data for Framer sites using third-party
      commerce embeds versus native Webflow and Wix stores.
    whyItMatters: >-
      Determines whether the absence of native checkout infrastructure creates an insurmountable ceiling for commercial
      merchant adoption.
    diligencePath: >-
      Conduct customer reference interviews with high-traffic commercial store operators integrating Shopify or Stripe
      on Framer.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: Audited financial statements detailing gross margins, GAAP revenue, and net income.
    whyItMatters: Essential to evaluate profitability and determine whether hosting and AI inference costs depress software margins.
    diligencePath: Request confidential disclosure room income statement and gross margin accounting breakdown.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Cohort-level net revenue retention (NRR), logo churn, and customer acquisition cost (CAC) payback periods.
    whyItMatters: >-
      Validates whether the high ~40x ARR valuation multiple is supported by durable enterprise expansion or burdened by
      SMB churn.
    diligencePath: Obtain cohort retention tables segmented by self-serve vs sales-assisted enterprise contracts.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: security-and-compliance
    missingEvidence: >-
      Independent audit reports, SOC 2 Type II certification summaries, formal enterprise uptime SLAs, and disaster
      recovery recovery point objectives for high-volume enterprise deployments.
    whyItMatters: >-
      Enterprise IT procurement teams evaluating Framer for business-critical digital properties require verified uptime
      guarantees and compliance documentation beyond standard marketing assurances.
    diligencePath: >-
      Request Framers enterprise compliance documentation package, current SOC 2 Type II report, and standard master
      services agreement (MSA) SLA terms directly during enterprise vendor diligence.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-concentration
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), annual cohort churn rates, and revenue
      concentration percentages among top enterprise accounts.
    whyItMatters: >-
      Without verified retention and renewal metrics, it is impossible to evaluate whether Framer's rapid self-serve and
      startup adoption translates into durable lifetime customer value or suffers from high churn once startups scale or
      pivot.
    diligencePath: >-
      Request historical cohort retention tables, logo churn vs dollar churn figures, and top 20 customer revenue
      concentration breakdowns under an investor NDA.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: enterprise-security-compliance
    missingEvidence: >-
      SOC 2 Type II compliance audit reports, ISO 27001 certifications, and enterprise DPA subprocessor security
      documentation.
    whyItMatters: >-
      Enterprise procurement departments require verified independent security audit attestations before approving
      deployment of core corporate domains.
    diligencePath: >-
      Request Framer's enterprise compliance packet, SOC 2 Type II report, and penetration testing summaries under
      mutual NDA.
    relatedQuestionRefs:
      - QR008
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Exhaustive legal docket history and pending IP or trademark disputes across Dutch and US corporate jurisdictions.
    whyItMatters: >-
      Public disclosure provides visibility into corporate structure and terms of service but does not disclose
      confidential settlement agreements or sealed proceedings.
    diligencePath: >-
      Conduct commercial legal diligence review of pending litigation, material contracts, and employee IP assignment
      agreements.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-nrr
    missingEvidence: >-
      Audited net revenue retention, logo churn, and cohort expansion rates across business and enterprise customer
      tiers.
    whyItMatters: >-
      A 40x ARR valuation multiple requires high net expansion (>120% NRR) to sustain high-growth expectations as
      self-serve top-of-funnel matures.
    diligencePath: Request customer cohort retention matrices and churn data by plan tier in formal data room diligence.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: unit-economics-margins
    missingEvidence: >-
      Gross margin breakdown separating software subscriptions from managed hosting infrastructure and third-party AI
      compute costs.
    whyItMatters: >-
      If bandwidth and AI token costs compress gross margins below standard software levels (75-80%), terminal cash flow
      multiples must be discounted.
    diligencePath: Obtain management accounts showing hosting cost of goods sold and AI API expenditure.
    relatedQuestionRefs:
      - QV008
