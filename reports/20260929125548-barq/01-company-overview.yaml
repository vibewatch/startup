callouts:
  - calloutType: "insight"
    title: "Scale is visible; monetization is not"
    body: "The evidence supports rapid registration and processed-volume growth, but cumulative transaction value cannot be read as revenue, ARR, gross profit, or cash generation. Underwriting requires audited financials and active-user cohorts before the operating scale can be translated into business quality."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO016"
  - calloutType: "risk"
    title: "Cross-border growth raises execution demands"
    body: "The financing is earmarked partly for expansion, while reporting leaves target markets, timing, and capital allocation undisclosed. Customer allegations involving account blocks, transfer delays, identity updates, and support access make service operations and compliance handling priority diligence areas, without proving a platform-wide incident rate."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO014"
