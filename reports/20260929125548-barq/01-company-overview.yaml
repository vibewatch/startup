company:
  name: "barq"
chapter:
  number: 1
  title: "Company Overview"
  summary: "barq is a Riyadh-based digital-payments company founded in 2023 that announced a $329.5 million Series A at a $1.85 billion valuation on September 15, 2026. Its reported 15 million users and SAR440 billion of cumulative processed volume indicate rapid scale, but those figures are company claims and the assigned evidence does not disclose revenue, profitability, headcount, cash balance, board composition, or financing control terms."
sections:
  - id: "identity-and-offering"
    title: "Identity, Regulatory Position, and Offering"
    body: "barq is a Riyadh-based digital-payments company founded in 2023. Reporting describes its regulated operating entity as Buraq Financial Company, a closed joint-stock company licensed and supervised by the Saudi Central Bank, while the Apple listing names the provider as Barraq Finance Company; the legal-name transliteration should therefore be confirmed against formation and license documents. The offering spans a mobile wallet, domestic and international transfers, physical and virtual cards, spending tools, wallet-to-wallet transfers, and newer business-oriented services. These sources establish product breadth, but they do not substantiate pricing, take rates, or a revenue model."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: "Ahmed Alenazi co-founded barq and serves as chief executive after previously leading stc pay, providing directly relevant experience in Saudi digital payments. Faisal AlRumayyan is identified as the other co-founder, but the assigned sources provide little detail on his operating remit. This creates a visible key-person concentration around Alenazi for strategy, regulatory execution, and product scaling. The evidence set does not enumerate the broader executive team, directors, committee structure, investor board rights, or material leadership changes, so governance depth and succession resilience remain open rather than assumed."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "funding-and-stakeholders"
    title: "Funding and Stakeholder Structure"
    body: "On September 15, 2026, barq announced a $329.5 million Series A financing at a $1.85 billion valuation, with Noon Investments, Sohar International Bank, and M20 Fund participating. Multiple assigned publications repeat the round size, valuation, and named investors, but none is a filing or executed financing document. The amount should be treated as disclosed Series A proceeds, not proven lifetime funding or current cash available. Public evidence also does not disclose dilution, secondary sales, debt, liquidation preferences, board seats, ownership percentages, or investor control rights. SAMA is economically important as regulator, but it is not presented as an investor."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO010"
      - "CO012"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "scale-milestones-and-friction"
    title: "Scale, Milestones, and Operational Friction"
    body: "barq says it exceeded 15 million users across more than 210 nationalities and processed more than SAR440 billion ($117.3 billion) within two years of launch. Those are cumulative company-reported operating metrics, not revenue, active-user counts, or independently audited throughput. Cross-border reach includes Western Union transfers and an Alipay+ integration announced for May 2026, while the new capital is intended for operating efficiency, product and technology investment, and regional or international expansion; target markets and timing remain undisclosed. Independent complaint posts describe blocked accounts, delayed transfers, identity-update problems, and difficulty reaching support. They are adverse signals, not evidence of incident frequency, and one sampled complaint records a full refund and account restoration."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
