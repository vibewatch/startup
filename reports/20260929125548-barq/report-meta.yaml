companyProfile:
  summary: "barq is a Riyadh-based Saudi digital payments company founded in 2023 and operated through Buraq Financial Company under Saudi Central Bank supervision. Its app combines a consumer wallet, domestic and international transfers, physical and virtual cards, spending tools, and wallet-to-wallet transfers, while public evidence also points to newer business-oriented features. The company is led by co-founder and CEO Ahmed Alenazi, with Faisal AlRumayyan also identified as a co-founder, and it remains a private, disclosure-light fintech despite its rapid scale."
