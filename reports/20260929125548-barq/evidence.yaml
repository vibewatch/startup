evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, profitability, cash-flow, cash-balance, headcount, active-user, and cohort-retention data.
    whyItMatters: >-
      Registration and processed-volume claims do not establish monetization, operating efficiency, liquidity, or
      durable engagement.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, bank confirmations, payroll records, and
      active-user cohort exports under NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-board
    missingEvidence: >-
      A complete current executive and board roster, committee assignments, biographies, succession coverage, and
      leadership-change history.
    whyItMatters: >-
      The public record centers on the CEO and one co-founder, preventing assessment of functional depth, oversight, and
      key-person mitigation.
    diligencePath: >-
      Obtain the organization chart, board register, committee charters, employment history, and departures log from
      management and corporate records.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      The fully diluted cap table, round documents, ownership percentages, board rights, preferences, secondary
      components, debt, and historic financing schedule.
    whyItMatters: >-
      Named investors and headline proceeds do not establish control, dilution, preference overhang, lifetime funding,
      or current cash available.
    diligencePath: >-
      Review signed financing documents, the shareholder register, option schedule, debt agreements, and post-close bank
      statements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: complaint-denominator
    missingEvidence: >-
      Official complaint volumes, resolution times, transfer-failure rates, account-freeze counts, and regulatory
      incident records with user or transaction denominators.
    whyItMatters: >-
      Individual customer posts identify plausible friction but cannot quantify prevalence, severity, trend, or
      platform-wide service quality.
    diligencePath: >-
      Request support and compliance dashboards, sample case files, SAMA correspondence, and incident metrics reconciled
      to active users and transfers.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: monetization-take-rate
    missingEvidence: >-
      Audited financial disclosure of net take rates, merchant discount rates (MDR), and foreign exchange spread margins
      broken down by domestic versus cross-border remittance transactions.
    whyItMatters: >-
      Gross transaction volume (e.g. SR440 billion) does not translate directly into economic revenue; evaluating
      valuation durability requires verified net revenue margins per transaction.
    diligencePath: >-
      Obtain SAMA regulatory financial filings, audited income statements, or confidential investor presentation decks
      detailing net take-rate composition.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: international-expansion-economics
    missingEvidence: >-
      Audited unit economics, customer acquisition costs, and specific market entry schedules for barq's announced
      international expansion outside Saudi Arabia.
    whyItMatters: >-
      Without geographic unit economics and margin data, it is impossible to evaluate whether barq can replicate its
      domestic remittance scale profitably against established cross-border money transfer networks.
    diligencePath: >-
      Request management disclosure on country-by-country remittance corridor volumes, realized foreign exchange take
      rates, and licensing progress in targeted GCC and Asian destinations.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements detailing gross and net revenue, blended take rate across remittance and card payment
      flows, gross margin by product line, and user-level customer acquisition costs (CAC).
    whyItMatters: >-
      Without disclosed take rates and cost-of-delivery metrics, underwriting barq's $1.85B post-money Series A
      valuation relies entirely on self-reported cumulative gross transaction volume rather than proven unit
      profitability.
    diligencePath: >-
      Request confidential management accounts, historical income statements, payment network scheme fee schedules, and
      per-cohort unit economics schedules under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-burn-and-runway
    missingEvidence: >-
      Monthly cash burn rate, operating expense breakdown (headcount vs marketing vs infrastructure), and projected
      runway on the $329.5 million Series A capital.
    whyItMatters: >-
      Rapid international expansion into multi-country licensing regimes typically accelerates burn; investors need
      visibility into capital sufficiency before subsequent financing rounds.
    diligencePath: >-
      Request the 3-year corporate financial model, monthly cash burn schedules, and planned regional licensing capital
      allocation budgets.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: developer-apis
    missingEvidence: >-
      Public developer API documentation, SDKs, webhook schemas, and sandbox integration guides for third-party merchant
      integration.
    whyItMatters: >-
      Without public technical API documentation, merchant and partner integration velocity, technical modularity, and
      developer defensibility cannot be independently evaluated.
    diligencePath: >-
      Request confidential developer portal access, merchant integration API specifications, and architectural system
      diagrams during management diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: cloud-infrastructure
    missingEvidence: >-
      Specific cloud hosting provider (AWS, GCP, Azure, or local Saudi cloud data center) and database architecture
      disclosures.
    whyItMatters: >-
      Determines data residency compliance with SAMA cloud cybersecurity frameworks and system disaster recovery
      redundancy.
    diligencePath: >-
      Review vendor infrastructure contracts, SOC 2 compliance certifications, and SAMA Cloud Computing Regulatory
      Framework audit reports.
    relatedQuestionRefs:
      - QE002
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited customer cohort retention data, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and monthly
      churn rates.
    whyItMatters: >-
      Gross registered user scale (15M+) does not demonstrate account durability or recurring monetization in a market
      with high multi-homing.
    diligencePath: >-
      Request historical monthly active user (MAU) cohorts and cohort-level remittance retention curves under NDA during
      management review.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: regulation
    missingEvidence: >-
      Primary SAMA license record, permitted-activity schedule, safeguarding conditions, and enforcement or examination
      history.
    whyItMatters: >-
      Third-party reporting cannot establish the precise regulatory perimeter or whether conditions constrain products
      and expansion.
    diligencePath: >-
      Obtain the current regulator record and reconcile every live product and customer-funds flow to its permission and
      safeguarding account.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Revenue, gross margin, take rate, fraud losses, burn, working capital, unrestricted cash, and runway by product
      and corridor.
    whyItMatters: Funding raised and processed value do not establish revenue, liquidity, or a sustainable economic model.
    diligencePath: >-
      Review audited statements, bank statements, monthly management accounts, cohort economics, treasury policy, and
      the board-approved operating plan.
    relatedQuestionRefs:
      - QR009
  - type: missing-source
    severity: blocking
    topic: security
    missingEvidence: >-
      Independent security certifications, penetration-test results, material incident history, uptime, recovery
      objectives, and control remediation logs.
    whyItMatters: >-
      Privacy-policy assurances and app-store declarations do not verify control operation or prove the absence of
      incidents.
    diligencePath: >-
      Obtain current SOC or ISO evidence, penetration reports, incident register, status data, business-continuity
      tests, and remediation ownership.
    relatedQuestionRefs:
      - QR010
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Corridor-level partner volumes, exclusivity, reserve requirements, SLAs, termination rights, fallback routing, and
      outage test results.
    whyItMatters: Named partnerships do not establish redundancy or quantify the impact of a counterparty interruption.
    diligencePath: >-
      Review partner contracts, volume reports, corridor routing, failover tests, concentration limits, and
      customer-restitution obligations.
    relatedQuestionRefs:
      - QR006
  - type: conflicting-data
    severity: minor
    topic: entity-resolution
    missingEvidence: >-
      Reliable entity linkage for homonymous Barq search results; the assigned net-new software-agency page is not the
      Saudi fintech and supports no business-risk claim here.
    whyItMatters: Conflating unrelated companies would contaminate funding, product, operating, or risk conclusions.
    diligencePath: >-
      Match every new source to Barraq Finance Company, barq.app, or another verified legal-entity identifier before
      using it in a claim.
