callouts:
  - calloutType: "risk"
    title: "Unit Economic Disclosures vs. Reported Scale"
    body: "While barq reports processing over SAR 440 billion ($117 billion) across 15 million users, the company has not disclosed net revenue, gross margins, or take rates. In fintech platforms relying on cross-border remittance and payment cards, gross volume can expand rapidly while net economic capture remains compressed by scheme fees, banking partner revenue splits, and promotional subsidies."
    claimRefs:
      - "CI004"
      - "CI006"
      - "CI013"
      - "CI015"
  - calloutType: "insight"
    title: "Series A Capital Runway and Forward Capex"
    body: "The $329.5 million Series A round provides substantial liquidity for regional expansion and technology investment, reducing near-term financing dependency. However, cross-border multi-market expansion will substantially increase regulatory compliance overhead, licensing capital requirements, and localized customer acquisition costs."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI011"
      - "CI012"

