chapter:
  number: 6
  title: "Customers"
  summary: "barq has scaled rapidly across Saudi Arabia's retail payments and cross-border remittance corridors, reporting over 15 million registered users representing more than 210 nationalities and cumulative volume exceeding SAR 440 billion ($117.3 billion). Adoption is concentrated among resident expatriate workers utilizing mobile remittance rails and domestic retail consumers utilizing virtual payment cards. However, durable customer retention metrics—such as net revenue retention (NRR), active account definitions, and cohort churn—remain undisclosed private data, while consumer reviews reveal recurring operational friction around automated anti-money laundering (AML) account blocks and national residency identity verification."
sections:
  - id: "customer-segmentation-and-demographics"
    title: "Customer Base Segmentation, Buyer Personas, and Payment Use Cases"
    body: "The customer base of barq spans distinct demographic and commercial user groups within the Kingdom of Saudi Arabia, unified under a regulated digital wallet architecture operated by Buraq Financial Company (registered as Barraq Finance Company on mobile app distribution stores). The primary and highest-velocity user segment comprises foreign resident expatriates, who represent a vital pillar of the Saudi labor economy. Expatriate users prioritize low-friction cross-border salary remittances, competitive foreign exchange conversion rates, and instant digital wallet-to-wallet transfers to send funds back to family households in Pakistan, the Philippines, India, Bangladesh, and Egypt. The mobile app provides multilingual interfaces in Arabic, English, Bengali, Hindi, and Urdu specifically to lower onboarding friction for these diverse migrant worker cohorts. A secondary core segment consists of domestic Saudi retail consumers who adopt the application for contactless point-of-sale spending, e-commerce checkout via issued payment cards, utility bill settlement, and peer-to-peer money transfers. Tertiary segments include small and medium-sized enterprise (SME) merchants using business accounts and payment gateway tools for digital order collection, as well as inbound and outbound regional travelers who execute cross-border transactions via international network partners. However, while public disclosures emphasize large registration aggregates, user tiering by active transaction frequency and revenue contribution remains opaque."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU008"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-operational-velocity"
    title: "Adoption Trajectory, Registration Velocity, and Cumulative Platform Throughput"
    body: "barq's adoption trajectory reflects extraordinary top-of-funnel customer acquisition velocity since its commercial platform launch in mid-2024 following regulatory licensing by the Saudi Central Bank (SAMA). In its inaugural operating year ending August 2025, barq reported surpassing 7 million registered users from 150 nationalities, issuing over 6.5 million digital payment cards, and executing over 500 million transactions representing SR 73 billion ($19.4 billion) in processed throughput. Growth accelerated further into 2026: company announcements in September 2026 disclosed that total registered accounts had passed 15 million across more than 210 nationalities, with cumulative transaction volume exceeding SAR 440 billion ($117.3 billion) moved across the platform. While these top-line throughput numbers confirm aggressive customer onboarding and substantial app distribution—further supported by over 226,000 ratings on the Apple App Store averaging 4.6 stars—diligence must rigorously distinguish cumulative gross registrations from active funded accounts. In the consumer digital wallet sector, promotional fee waivers and zero-fee account setup typically inflate registered user metrics without guaranteeing recurring transaction activity or customer lifetime value."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-partner-and-customer-deployments"
    title: "Named Infrastructure Deployments, Corridor Partnerships, and Network Integration"
    body: "Rather than selling enterprise software directly to corporate software buyers, barq's institutional deployment proof centers on production-grade infrastructure partnerships with global payment schemes, remittance networks, and acquiring gateways. These commercial agreements directly serve barq's consumer and merchant customer base by expanding transaction rails and acceptance networks. In September 2024, barq partnered with Mastercard to implement Mastercard Gateway technology, providing merchants and consumers across Saudi Arabia with advanced payment processing, fraud prevention, recurring subscriptions, and installment capabilities. At Money20/20 Middle East in September 2026, barq and Mastercard expanded this alliance to deepen payment acceptance across merchant networks. Furthermore, barq forged a production collaboration with Western Union, enabling millions of registered wallet users to execute immediate cross-border transfers across Western Union's global disbursement network spanning more than 200 countries. In addition to Western Union and Mastercard, barq has integrated with Thunes for B2B bank account and wallet termination, TerraPay for international remittances, iPiD for pre-transfer payee identity verification, and Ant International's Alipay+ for cross-border QR code merchant payments across 220 international destination markets."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "retention-concentration-and-operational-friction"
    title: "Retention Dynamics, Concentration Risks, and User Experience Vulnerabilities"
    body: "A critical diligence finding is that barq has disclosed zero public data regarding cohort retention, net revenue retention (NRR), gross revenue retention (GRR), monthly churn, or customer acquisition costs (CAC). Because digital wallet account opening is free and users routinely multi-home across competing services (including stc pay and Al Rajhi's Urpay), high cumulative registration volume can obscure substantial dormant account shares. Customer switching costs in retail payments are low, meaning transactional loyalty depends heavily on sustained exchange rate competitiveness and service reliability. Independent consumer reviews on platforms such as PissedConsumer highlight acute operational friction points that threaten customer retention. Users frequently report unexpected account blocks and frozen funds, often occurring when national residency permit (Iqama) renewals are delayed or fail to synchronize automatically with barq's internal compliance systems. Expatriate workers relying on barq for urgent monthly family wage remittances report significant distress when automated transfer limits are triggered or customer support fails to respond to account lockouts. These compliance-driven service interruptions create direct churn vectors toward traditional commercial bank remittance channels."
    claimRefs:
      - "CU003"
      - "CU013"
      - "CU014"
      - "CU015"
