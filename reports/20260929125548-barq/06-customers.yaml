callouts:
  - calloutType: "insight"
    title: "Remittance Workflow Dominance Drives Expatriate Consumer Scale"
    body: "barq's ability to amass 15 million registered users and over SAR 440 billion in cumulative throughput within two years is fundamentally anchored in the economics of Saudi Arabia's expatriate workforce. By integrating premier remittance networks like Western Union and Thunes directly into a slick, multilingual mobile wallet offering instant P2P transfers and virtual cards, barq successfully captured high-frequency wage remittance corridors that were historically dominated by brick-and-mortar exchange houses."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU008"
      - "CU010"
  - calloutType: "risk"
    title: "Compliance-Driven Account Freezes Threaten Customer Durability"
    body: "While top-of-funnel registration is exceptional, customer retention faces severe headwinds from regulatory compliance friction. Consumer feedback platforms document persistent complaints from migrant workers regarding sudden account lockouts triggered by asynchronous Iqama residency renewals and automated transaction thresholds. When foreign workers are blocked from sending urgent salary remittances to their families, customer dissatisfaction is acute, creating immediate churn toward rival bank-backed wallets."
    claimRefs:
      - "CU003"
      - "CU014"
      - "CU015"
