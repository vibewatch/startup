callouts:
  - calloutType: "insight"
    title: "Valuation Multiples vs. Take Rate Realities in Gulf Remittance"
    body: "Achieving a $1.85 billion valuation places barq among the elite cohort of Middle Eastern fintech unicorns. However, in low-cost remittance and domestic wallet models where basic transfers and cards are offered free of charge to win users, transactional throughput does not equal net revenue. Long-term enterprise value hinges upon extracting sustainable cross-border FX margins and cross-selling enterprise payment rails."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV011"
  - calloutType: "risk"
    title: "Downside Exposure from Automated Account Freezes"
    body: "Customer feedback across independent review forums highlights acute frustration regarding automated account freezes during mandatory iqama residency updates. For an expatriate user base relying on time-sensitive remittances, sudden locked balances eliminate switching costs and accelerate churn to rival banking wallets like stc pay and Urpay, eroding platform lifetime value."
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV012"
