callouts:
  - calloutType: "insight"
    title: "Gross Transaction Volume Scale Masks Monetization and Take-Rate Realities"
    body: "While regional headlines emphasize staggering gross transaction volumes—such as Saudi electronic payments hitting SR315 billion ($84 billion) and leading digital wallets processing over SR440 billion—diligence must rigorously distinguish transaction volume from economic revenue. Domestic consumer payments face structural fee caps under regulated debit rails, meaning digital wallets depend heavily on cross-border remittance foreign exchange spreads and value-added SME services to achieve sustainable monetization."
    claimRefs:
      - "CM002"
      - "CM007"
      - "CM008"
      - "CM010"
  - calloutType: "risk"
    title: "Regulatory Compliance Bottlenecks Create User Friction in High-Volume Segments"
    body: "Saudi Central Bank regulatory mandates impose rigorous anti-money laundering and residency verification requirements on digital wallet platforms. As verified by consumer dispute evidence, automated compliance systems frequently trigger unexpected account freezes, Iqama document synchronization delays, and rigid transfer limits. These operational frictions disproportionately affect the expatriate customer segment, directly threatening retention in barq's most lucrative cross-border remittance corridor."
    claimRefs:
      - "CM004"
      - "CM009"
      - "CM014"
