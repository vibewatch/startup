      - number: '4.2'
        title: Cost Structure, Direct Delivery Expenses, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The cost structure of barq's financial technology platform is governed by transaction-dependent payment
              rail fees, partner revenue sharing, and regulatory compliance overhead. Each international remittance
              incurs clearing fees paid to corridor aggregation networks such as Thunes and Western Union, alongside
              currency hedging and liquidity management expenses. On card transactions, scheme network fees to payment
              networks offset interchange earnings, while dynamic FX conversion requires local settlement bank
              facilities. Operational overhead includes customer onboarding verification, AML/CFT screening under SAMA
              mandates, and cloud infrastructure support. Staffing scale is meaningful, with Tracxn reporting 531
              employees as of August 2026 supporting engineering, customer support, and compliance functions. Crucially,
              barq does not disclose net take rates, gross margins, or customer acquisition costs, leaving net unit
              contribution unverified by public underwriting standards.
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI011
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI015
      - number: '4.3'
        title: Disclosed Scale Milestones vs. Private Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              barq's public narrative is defined by velocity milestones in user registration and gross processed volume.
              In its inaugural operational year ending mid-2025, the company issued over 6.5 million payment cards,
              processed 500 million transactions, and facilitated SR 73 billion ($19.4 billion) in transaction volume
              across 7 million users. By September 2026, cumulative volume had surged past SAR 440 billion ($117.3
              billion) with registered accounts topping 15 million. While these figures confirm high app adoption across
              international worker corridors, gross processed volume is an unadjusted top-line throughput metric that
              cannot be conflated with recognized net revenue or annual recurring revenue (ARR). In payment wallets with
              low barrier-to-entry and promotional transfer pricing, transaction velocity often masks low net retention
              or user multi-homing across rival wallets.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
      - number: '4.4'
        title: Capital Adequacy, Service Quality Signals, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              In September 2026, barq solidified its balance sheet by closing a $329.5 million Series A funding round at
              a post-money valuation of $1.85 billion, with institutional participation from Noon Investments, Sohar
              International Bank, and M20 Fund. The capital injection provides immediate liquidity and removes near-term
              insolvency risk, granting management a multi-year runway to pursue geographic expansion and product
              development. However, commercial scaling has introduced service friction: consumer review repositories on
              PissedConsumer document recurring complaints regarding unexpected account freezes, transfer processing
              delays, and customer service unresponsiveness. Furthermore, planned expansion into external GCC and
              international markets requires securing standalone regulatory licenses, localized partner banks, and
              localized compliance systems, which will elevate operating burn. Diligence must condition investment on
              verifying net unit economics and customer retention rather than headline throughput.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
              - CI013
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unit Economic Disclosures vs. Reported Scale
            body: >-
              While barq reports processing over SAR 440 billion ($117 billion) across 15 million users, the company has
              not disclosed net revenue, gross margins, or take rates. In fintech platforms relying on cross-border
              remittance and payment cards, gross volume can expand rapidly while net economic capture remains
              compressed by scheme fees, banking partner revenue splits, and promotional subsidies.
            calloutType: risk
            claimRefs:
              - CI004
              - CI006
              - CI013
              - CI015
          - type: callout
            title: Series A Capital Runway and Forward Capex
            body: >-
              The $329.5 million Series A round provides substantial liquidity for regional expansion and technology
              investment, reducing near-term financing dependency. However, cross-border multi-market expansion will
              substantially increase regulatory compliance overhead, licensing capital requirements, and localized
              customer acquisition costs.
            calloutType: insight
            claimRefs:
