      - number: '5.2'
        title: System Architecture, Operating Infrastructure, and Network Integrations
        blocks:
          - type: paragraph
            body: >-
              The operating architecture of barq is structured as a regulated non-bank digital financial services
              platform executing under SAMA supervision through Buraq Financial Company (also designated Barraq Finance
              Company). The system interfaces with core Saudi national financial switches, utilizing SAMA settlement
              systems and domestic payment card rails (mada) for instantaneous local account funding and settlement. For
              cross-border money movement, barq relies on global correspondent partnerships and rail aggregators rather
              than maintaining proprietary bilateral banking networks in every destination country. Key integrated
              international rails include Western Union for global cash and account payout, Alipay+ for cross-border QR
              payments and merchant acceptance across 220 destination markets, and Thunes for direct network termination
              into foreign bank accounts and digital wallets. The client tier comprises high-performance native mobile
              applications across iOS and Android, incorporating third-party diagnostic and telemetry SDKs such as
              Sentry for crash monitoring, Google Analytics for Firebase for operational telemetry, and Google Play
              Services for push messaging and device integrity.
