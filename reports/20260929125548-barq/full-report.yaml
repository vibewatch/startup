  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood signal
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap / kill criterion
    rows:
      - - Fraud response and access to funds after account compromise
        - >-
          A Google Play reviewer alleged fraud loss, delayed handling, weak support, and later account lockout;
          incidence is unknown.
        - Critical
        - Low public visibility; the developer directed the reviewer to phone or in-app support.
        - High because response-time, reimbursement, and loss-rate data are absent.
        - >-
          Kill if verified fraud losses, safeguarding failures, or median case resolution exceed policy or regulatory
          limits.
      - - Cross-border transfer delay or non-delivery
        - >-
          Recent Google Play and PissedConsumer reviews describe transfers taking days or remaining pending; samples are
          self-selected.
        - High
        - Low public visibility; some complaints report resolution, but no service-level statistics are published.
        - High for remittance-dependent users and complaint escalation.
        - >-
          Require success rate and aging by corridor; kill if persistent tail delays lack funded remediation and
          customer restitution.
      - - Identity refresh and unexpected account blocking
        - Multiple PissedConsumer posts describe blocked accounts or renewed identity documents not recognized.
        - High
        - Low public visibility; one verified reviewer reported account restoration and a full refund.
        - Medium-high because frequency, false-positive rate, and funds-access duration are unknown.
        - >-
          Require block reason codes, false-positive rates, manual-review timing, appeal outcomes, and
          vulnerable-customer handling.
      - - Security, privacy, and third-party telemetry failure
        - >-
          Company disclosures identify broad data collection and multiple third-party services; no incident rate or
          independent control report was assigned.
        - Unknown
        - Policy-level only; encryption in transit and deletion requests are declared on Google Play.
        - >-
          High because control operation, breach history, recovery objectives, and processor concentration are
          unverified.
        - >-
          Kill if independent testing finds material control gaps without time-bound remediation or if undisclosed
          incidents emerge.
    notes: >-
      Complaint evidence is directional and not population-representative; likelihood is qualitative because public
      sources provide no complaint denominator, outage history, fraud-loss rate, or SLA.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Public mitigation
      - Residual exposure
    rows:
      - - Cross-border payment and payout rails
        - Western Union, Alipay+, and Thunes
        - International transfers and payment connectivity
        - Transaction share and corridor overlap are not public.
        - Partner outage, compliance termination, liquidity restriction, or corridor suspension delays customer funds.
        - Critical
        - Multiple named partners suggest some diversification, but routing redundancy and contractual SLAs are unknown.
        - >-
          High until corridor-level volumes, failover tests, termination rights, reserves, and restitution obligations
          are reviewed.
      - - Mobile application distribution
        - Apple App Store and Google Play
        - Customer acquisition, updates, and device access
        - Two dominant distribution platforms; channel shares are not public.
        - Delisting, policy dispute, delayed update, or signing-account compromise impairs access and remediation.
        - High
        - Current listings and recent updates are visible on both platforms.
        - Medium-high without web fallback, release-control evidence, and platform-contingency plans.
      - - Analytics, diagnostics, and mobile platform services
        - Google Play Services, Google Analytics for Firebase, and Sentry
        - App operation, analytics, and error monitoring
        - Data and operational dependence are not quantified.
        - Processor outage, privacy breach, data-transfer restriction, or telemetry blind spot weakens controls.
        - High
        - The privacy notice identifies the services and provides user-rights language.
        - >-
          Medium-high until processor DPAs, data residency, least-privilege controls, and replacement plans are
          verified.
    notes: >-
      The source set identifies counterparties but not contracts, volumes, exclusivity, service levels, reserves, or
      fallback capacity; concentration and residual exposure are therefore qualitative.
    claimRefs:
      - CR003
      - CR013
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Status / Stance
      - Analytical Rationale
      - Investment Implication
    rows:
      - - Recommendation
        - Hold / Neutral
        - 15M users and SAR 440B throughput prove acquisition wedge, but unit economics remain unverified
        - Defer net-new equity allocation until audited take rates and churn metrics are verified
      - - Valuation Stance
        - Fully Priced at $1.85B
        - Post-money valuation reflects flawless execution of regional expansion and remittance capture
        - Entry multiple offers limited margin of safety without top-line revenue disclosures
      - - Confidence Level
        - Medium (6/10)
        - High certainty on transaction volumes and SAMA licensing; low visibility on net margins
        - Requires direct management diligence on cohort contribution margins and marketing burn
      - - Investment Risk Rating
        - High
        - Customer friction from automated AML freezes, rail partner dependency, and corridor price caps
        - Require downside liquidation preferences and governance protection against down-rounds
    notes: >-
      Recommendation and risk ratings established based on verified Series A transaction terms, SAMA regulatory
      constraints, and independent user feedback.
