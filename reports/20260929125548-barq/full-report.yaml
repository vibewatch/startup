      - number: '5.3'
        title: Customer Workflows, Operational Benefits, and Execution Constraints
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, barq serves distinct use cases spanning low-cost migrant remittances, daily
              retail POS card spending, and enterprise payroll settlement. For expatriate workers, barq replaces
              physical trips to exchange houses with instant in-app digital transfers to bank accounts, mobile wallets,
              and cash pick-up points across global corridors. For domestic retail consumers, instant wallet-to-wallet
              transfers and virtual cards provisioned into digital wallets offer friction-free peer-to-peer payments and
              online checkout. However, customer workflows are tightly constrained by mandatory regulatory identity
              verification and anti-money laundering (AML) controls enforced under SAMA rules. As documented in user
              reviews, expatriate users frequently experience workflow disruptions when employer Iqama renewals fail to
              synchronize automatically with barq's identity backend, resulting in unexpected account blocks, frozen
              salary access, and delayed emergency family transfers. Furthermore, rigid daily or monthly transfer limits
              and customer support responsiveness backlogs create material friction during peak transfer cycles.
            claimRefs:
