      - number: '7.3'
        title: Partner, capital, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              barq's cross-border proposition depends on external rails. Reporting identifies Western Union and Alipay+
              relationships, while a GlobalData article syndicated by Yahoo reports a Thunes partnership for
              international transfers. Public sources do not quantify transaction shares, exclusivity, fallback routing,
              service levels, reserve requirements, or termination rights for any counterparty. Distribution also
              depends on Apple and Google app ecosystems, and the privacy notice identifies third-party analytics and
              error-monitoring services. Financial capacity is not the same as economic resilience: two independent
              reports say barq closed a $329.5 million Series A at a $1.85 billion valuation, but funding raised is not
              cash available, and no assigned source provides revenue, gross margin, burn, fraud loss, working-capital
              needs, or runway. Reported user and processed-value scale raises the cost of weak controls rather than
              proving profitability. A thesis break should occur if verified transfer reliability, safeguarding,
              regulatory approvals, partner redundancy, or unit-economics evidence materially trails the expansion plan.
            claimRefs:
