      - number: '6.2'
        title: Adoption Trajectory, Registration Velocity, and Cumulative Platform Throughput
        blocks:
          - type: paragraph
            body: >-
              barq's adoption trajectory reflects extraordinary top-of-funnel customer acquisition velocity since its
              commercial platform launch in mid-2024 following regulatory licensing by the Saudi Central Bank (SAMA). In
              its inaugural operating year ending August 2025, barq reported surpassing 7 million registered users from
              150 nationalities, issuing over 6.5 million digital payment cards, and executing over 500 million
              transactions representing SR 73 billion ($19.4 billion) in processed throughput. Growth accelerated
              further into 2026: company announcements in September 2026 disclosed that total registered accounts had
              passed 15 million across more than 210 nationalities, with cumulative transaction volume exceeding SAR 440
              billion ($117.3 billion) moved across the platform. While these top-line throughput numbers confirm
              aggressive customer onboarding and substantial app distribution—further supported by over 226,000 ratings
              on the Apple App Store averaging 4.6 stars—diligence must rigorously distinguish cumulative gross
              registrations from active funded accounts. In the consumer digital wallet sector, promotional fee waivers
              and zero-fee account setup typically inflate registered user metrics without guaranteeing recurring
              transaction activity or customer lifetime value.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
