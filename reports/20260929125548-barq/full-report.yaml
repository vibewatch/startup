      - number: '6.4'
        title: Retention Dynamics, Concentration Risks, and User Experience Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              A critical diligence finding is that barq has disclosed zero public data regarding cohort retention, net
              revenue retention (NRR), gross revenue retention (GRR), monthly churn, or customer acquisition costs
              (CAC). Because digital wallet account opening is free and users routinely multi-home across competing
              services (including stc pay and Al Rajhi's Urpay), high cumulative registration volume can obscure
              substantial dormant account shares. Customer switching costs in retail payments are low, meaning
              transactional loyalty depends heavily on sustained exchange rate competitiveness and service reliability.
              Independent consumer reviews on platforms such as PissedConsumer highlight acute operational friction
              points that threaten customer retention. Users frequently report unexpected account blocks and frozen
              funds, often occurring when national residency permit (Iqama) renewals are delayed or fail to synchronize
              automatically with barq's internal compliance systems. Expatriate workers relying on barq for urgent
              monthly family wage remittances report significant distress when automated transfer limits are triggered
              or customer support fails to respond to account lockouts. These compliance-driven service interruptions
              create direct churn vectors toward traditional commercial bank remittance channels.
            claimRefs:
              - CU003
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Remittance Workflow Dominance Drives Expatriate Consumer Scale
            body: >-
              barq's ability to amass 15 million registered users and over SAR 440 billion in cumulative throughput
              within two years is fundamentally anchored in the economics of Saudi Arabia's expatriate workforce. By
              integrating premier remittance networks like Western Union and Thunes directly into a slick, multilingual
              mobile wallet offering instant P2P transfers and virtual cards, barq successfully captured high-frequency
              wage remittance corridors that were historically dominated by brick-and-mortar exchange houses.
            calloutType: insight
            claimRefs:
              - CU001
              - CU004
              - CU008
              - CU010
          - type: callout
            title: Compliance-Driven Account Freezes Threaten Customer Durability
            body: >-
              While top-of-funnel registration is exceptional, customer retention faces severe headwinds from regulatory
              compliance friction. Consumer feedback platforms document persistent complaints from migrant workers
              regarding sudden account lockouts triggered by asynchronous Iqama residency renewals and automated
              transaction thresholds. When foreign workers are blocked from sending urgent salary remittances to their
              families, customer dissatisfaction is acute, creating immediate churn toward rival bank-backed wallets.
            calloutType: risk
            claimRefs:
              - CU003
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and data exposure
        blocks:
          - type: paragraph
            body: >-
              Third-party reporting says barq conducts regulated activity through Buraq Financial Company, which is
              licensed and supervised by the Saudi Central Bank, but the assigned evidence does not include the
              regulator's license record, scope, conditions, or any enforcement history. That makes domestic
              authorization a confirmable diligence item rather than a presumed clean bill of health. The company
              privacy notice describes collection of identity, location, device, and account-related information and
              names Google Play Services, Google Analytics for Firebase, and Sentry as third-party services. Apple
              likewise displays developer-provided categories including financial information, location, contact
              information, and identifiers linked to identity. These disclosures establish a broad data perimeter, not
              compliance effectiveness. Expansion increases the exposure: reporting says destinations, timing, approval
              plans, and capital allocation for international entry remain undisclosed. Investment approval should
              therefore require primary license verification, a jurisdiction-by-jurisdiction approval map, and current
              privacy, AML, sanctions, and safeguarding control evidence.
            claimRefs:
