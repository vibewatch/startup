      - number: '6.3'
        title: Named Infrastructure Deployments, Corridor Partnerships, and Network Integration
        blocks:
          - type: paragraph
            body: >-
              Rather than selling enterprise software directly to corporate software buyers, barq's institutional
              deployment proof centers on production-grade infrastructure partnerships with global payment schemes,
              remittance networks, and acquiring gateways. These commercial agreements directly serve barq's consumer
              and merchant customer base by expanding transaction rails and acceptance networks. In September 2024, barq
              partnered with Mastercard to implement Mastercard Gateway technology, providing merchants and consumers
              across Saudi Arabia with advanced payment processing, fraud prevention, recurring subscriptions, and
              installment capabilities. At Money20/20 Middle East in September 2026, barq and Mastercard expanded this
              alliance to deepen payment acceptance across merchant networks. Furthermore, barq forged a production
              collaboration with Western Union, enabling millions of registered wallet users to execute immediate
              cross-border transfers across Western Union's global disbursement network spanning more than 200
              countries. In addition to Western Union and Mastercard, barq has integrated with Thunes for B2B bank
              account and wallet termination, TerraPay for international remittances, iPiD for pre-transfer payee
              identity verification, and Ant International's Alipay+ for cross-border QR code merchant payments across
              220 international destination markets.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
