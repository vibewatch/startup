    title: Customer journey map
    type: journey-map
    summary: >-
      Visualizing customer onboarding, daily payment activity, cross-border remittance execution, and retention friction
      across barq's user lifecycle.
    data:
      nodes:
        - label: Digital Onboarding & KYC
          touchpoints:
            - Download app from iOS App Store or Google Play
            - Submit government digital identity (Iqama/Absher verification)
            - Multi-language UI selection (Arabic, English, Urdu, Bengali, Hindi)
        - label: Account Funding & Card Provisioning
          touchpoints:
            - Link domestic bank account or mada debit card
            - Instant issuance of virtual payment card for digital wallets
            - Request physical debit card for point-of-sale spending
        - label: Daily Domestic Payments
          touchpoints:
            - Instant wallet-to-wallet P2P transfers with zero fees
            - In-store contactless payment via issued payment card
            - Merchant QR payments and bill settlement
        - label: Cross-Border Remittance
          touchpoints:
            - Select recipient country across 200+ global destinations
            - Review dynamic foreign exchange rate and transfer fee
            - Route money via Western Union, Thunes, or Alipay+ rails
        - label: Verification & Account Maintenance Friction
          touchpoints:
            - Mandatory annual Iqama residency renewal synchronization
            - Automated AML compliance risk filters and account blocks
            - Customer service resolution inquiries and refund requests
        - label: Customer Loyalty, Retention & Multi-Homing
          touchpoints:
