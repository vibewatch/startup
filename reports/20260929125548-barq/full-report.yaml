      - number: '7.2'
        title: Operating reliability and customer-harm risk
        blocks:
          - type: paragraph
            body: >-
              The adverse signal is anecdotal but consistent across two review venues. A September 2026 Google Play
              reviewer said transfer time had stretched from hours to days, while another review alleged slow handling
              after fraudulent activity and difficulty reaching effective support. PissedConsumer pages similarly
              contain 2026 complaints about pending international transfers, unexpected account blocks, identity-renewal
              friction, and unanswered support contacts. One verified reviewer also reported a full refund and account
              restoration, showing that remediation can occur, but not its normal speed or success rate. These reports
              cannot establish population incidence, loss rate, or systemic outage, and the large app-store rating
              counts are not a substitute for service-level data. The risk remains high because delayed access to wages
              or remittances can create direct customer harm, complaints, fraud losses, and regulatory scrutiny.
              Diligence should demand transfer-success cohorts, aging distributions, fraud-loss and complaint rates,
              support response times, account-block reasons, and independently reviewed incident logs.
