      - number: '5.4'
        title: Trust, Compliance Controls, and Developer Signal Realities
        blocks:
          - type: paragraph
            body: >-
              As a closed joint-stock entity licensed and supervised by the Saudi Central Bank, barq enforces strict
              regulatory compliance, user data privacy, and transaction monitoring standards. User privacy disclosures
              detail explicit collection and governance over financial transaction data, identity identifiers, device
              telemetry, and continuous geolocation to satisfy central bank fraud detection and AML requirements. The
              technical operating risk profile is heavily shaped by external dependency: barq relies fundamentally on
              SAMA domestic rail uptime, third-party remittance networks (Western Union, Alipay+, Thunes), and domestic
              telecom infrastructure. On the software engineering front, barq maintains a closed proprietary technology
              stack without public developer documentation, open API gateways, or public GitHub repositories. In the
              absence of an open developer portal or API platform, practitioner signal is observed through mobile
              engineering execution, regular client release cadences on the Apple App Store and Google Play, and
              industry recruiting. Diligence confirms that technical defensibility stems from regulatory licensing,
              banking rails connectivity, and high-throughput transaction execution rather than open-source developer
              mindshare.
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Licensing as the Primary Architectural Moat
            body: >-
              In digital payments within Saudi Arabia, proprietary software algorithms are secondary to institutional
              banking connectivity and SAMA licensing. barq's competitive durability relies on its closed joint-stock
              licensing under Buraq Financial Company, enabling direct integration into the Kingdom's national payment
              switches (mada) and authorized cross-border clearing. Replicating this technical footprint requires
              substantial capital adequacy reserves, rigorous regulatory audits, and extensive compliance infrastructure
              that cannot be substituted with un-regulated software alone.
            calloutType: insight
            claimRefs:
              - CE001
              - CE005
              - CE007
          - type: callout
            title: Automated AML Controls and Identity Synchronization Bottlenecks
            body: >-
              Operational diligence indicates that barq's automated risk and compliance filters represent a primary
              source of customer dissatisfaction. Expatriate worker complaints frequently cite account freezes and
              delayed remittance transit triggered by asynchronous government Iqama residency renewals. Because migrant
              workers depend on instant wage remittances to support families abroad, automated compliance blocks
              combined with unresponsive customer service channels pose severe reputational and churn vulnerabilities.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Payment Use Cases
        blocks:
          - type: paragraph
            body: >-
              The customer base of barq spans distinct demographic and commercial user groups within the Kingdom of
              Saudi Arabia, unified under a regulated digital wallet architecture operated by Buraq Financial Company
              (registered as Barraq Finance Company on mobile app distribution stores). The primary and highest-velocity
              user segment comprises foreign resident expatriates, who represent a vital pillar of the Saudi labor
              economy. Expatriate users prioritize low-friction cross-border salary remittances, competitive foreign
              exchange conversion rates, and instant digital wallet-to-wallet transfers to send funds back to family
              households in Pakistan, the Philippines, India, Bangladesh, and Egypt. The mobile app provides
              multilingual interfaces in Arabic, English, Bengali, Hindi, and Urdu specifically to lower onboarding
              friction for these diverse migrant worker cohorts. A secondary core segment consists of domestic Saudi
              retail consumers who adopt the application for contactless point-of-sale spending, e-commerce checkout via
              issued payment cards, utility bill settlement, and peer-to-peer money transfers. Tertiary segments include
              small and medium-sized enterprise (SME) merchants using business accounts and payment gateway tools for
              digital order collection, as well as inbound and outbound regional travelers who execute cross-border
              transactions via international network partners. However, while public disclosures emphasize large
              registration aggregates, user tiering by active transaction frequency and revenue contribution remains
              opaque.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
