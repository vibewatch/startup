        - label: Client Telemetry & Diagnostics Layer
          detail: >-
            Integrated Sentry exception monitoring, Google Analytics for Firebase event telemetry, and Google Play
            Services device integrity validation.
        - label: Account Engine & Core Services Layer
          detail: >-
            Digital wallet ledger engine, virtual and physical card issuing manager, dynamic FX pricing calculator, and
            parental control sub-accounts.
        - label: Regulatory Compliance & Identity Layer
          detail: >-
            Automated SAMA AML transaction monitoring, sanctions screening engines, and government civil registry
            (Iqama/Absher) KYC verification interfaces.
        - label: Domestic Financial Infrastructure Layer
