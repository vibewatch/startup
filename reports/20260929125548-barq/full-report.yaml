  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and Service Definition Across User Workflows
        blocks:
          - type: paragraph
            body: >-
              barq provides a multi-functional digital wallet and payment application designed to streamline domestic
              financial transactions and cross-border remittances for Saudi citizens, resident expatriate workers, and
              commercial enterprises. The core consumer workflow centers on digital account onboarding, wallet funding
              via domestic bank cards and transfers, instant peer-to-peer (wallet-to-wallet) settlement, and
              international money transfers delivered at dynamic foreign exchange rates. Through its mobile client
              applications, the platform offers multi-currency digital balances, physical and virtual debit/prepaid
              payment cards, family spending controls, and dedicated sub-accounts for children. For business and
              enterprise users, barq provides payroll disbursement mechanisms and commercial digital treasury tools.
              Product capabilities are structured to address high-volume expatriate remittance corridors across South
              Asia, Southeast Asia, and the Middle East, offering multilingual localization in English, Arabic, Bengali,
              Hindi, and Urdu to lower onboarding friction for migrant workforces across the Kingdom.
            claimRefs:
              - CE001
              - CE002
