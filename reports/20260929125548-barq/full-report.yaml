  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Investment Lens
      - Thesis Argument
      - Anti-Thesis Counter-Argument
      - Thesis-Break Diligence Trigger
    rows:
      - - Market Scale & Reach
        - 15M+ users across 210 nationalities capture massive remittance corridors in Saudi Arabia
        - Headline user numbers include inactive accounts attracted by promotional zero-fee cards
        - Monthly active user (MAU) retention falling below 35% of registered accounts
      - - Transaction Throughput
        - SAR 440B ($117.3B) cumulative volume demonstrates high transaction frequency and consumer trust
        - Gross payment volume yields negligible net revenue under regulated interchange caps
        - Net blended take rate across platform falling below 25 basis points
      - - Leadership Track Record
        - Founder Ahmed Alenazi successfully scaled stc pay to $1.3B valuation with Western Union backing
        - Past digital wallet playbook faces stiffer competition from established digital banks (STC Bank, D360)
        - Inability to secure full commercial digital banking or EMI charters in key target markets
      - - International Expansion
        - Cross-border partnerships with Alipay+, Thunes, and Western Union plus Pakistan MyTM acquisition
        - Multi-jurisdictional licensing requires localized capital reserves and complex AML compliance
        - Regulatory rejection or material delay of Pakistan EMI license by State Bank of Pakistan
    notes: >-
      Core thesis and counter-thesis parameters evaluated against public market benchmarks, SAMA regulatory filings, and
      executive background.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability
      - Key Operational Assumptions
      - Implied Valuation
      - Return Multiple (MOIC)
      - Downside Risk Triggers
    rows:
      - - Bull Case
        - 25%
        - Remittance monetization rises; Pakistan EMI secured; MAUs exceed 10M; net take rate reaches 45 bps
        - $3.50 Billion
        - 1.89x
        - Failure to cross-sell lending or high-margin business payment solutions
      - - Base Case
        - 50%
        - Steady domestic volume growth; modest remittance take rate (25-30 bps); measured regional rollout
        - $2.20 Billion
        - 1.19x
        - Rising customer acquisition costs and margin compression from rival bank wallets
      - - Bear Case
        - 25%
        - SAMA tightens FX transfer fee caps; persistent account freeze churn; expansion stalls
        - $1.10 Billion
        - 0.59x
        - Regulatory fines, severe customer attrition, or corridor de-risking by rail partners
    notes: Three-year forward scenario modeling anchored to the $1.85 billion Series A post-money valuation benchmark.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV007
      - CV010
      - CV011
