        title: Identity, Regulatory Position, and Offering
        blocks:
          - type: paragraph
            body: >-
              barq is a Riyadh-based digital-payments company founded in 2023. Reporting describes its regulated
              operating entity as Buraq Financial Company, a closed joint-stock company licensed and supervised by the
              Saudi Central Bank, while the Apple listing names the provider as Barraq Finance Company; the legal-name
              transliteration should therefore be confirmed against formation and license documents. The offering spans
              a mobile wallet, domestic and international transfers, physical and virtual cards, spending tools,
              wallet-to-wallet transfers, and newer business-oriented services. These sources establish product breadth,
              but they do not substantiate pricing, take rates, or a revenue model.
