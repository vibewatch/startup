            body: >-
              Stop or reprice if primary license scope does not cover the offered products, safeguarded funds cannot be
              reconciled, transfer-delay and fraud-loss cohorts remain unavailable or outside policy, material security
              findings lack funded remediation, or overseas launches precede required approvals.
