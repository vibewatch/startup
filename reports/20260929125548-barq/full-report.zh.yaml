              barq 金融科技平台的成本结构，主要受制于交易绑定的清算网络费、合作伙伴分润以及合规运营开支。每笔国际汇款均需向 Thunes、Western Union
              等走廊聚合网络支付清算费，并承担汇率对冲与流动性管理成本。在支付卡交易端，向卡组织支付的网络费用会抵减刷卡手续费收入；动态外汇兑换还需要本地结算银行提供服务。运营间接费用涵盖用户开户核验、SAMA
              监管下的反洗钱/反恐怖融资（AML/CFT）筛查以及云基础设施成本。人员规模较为庞大，据 Tracxn 披露，截至 2026 年 8 月，公司拥有 531
              名员工，分布于工程研发、客户服务和合规风控岗位。最为关键的是，barq 未公开披露净抽成率（take rate）、毛利率或获客成本（CAC），按公开市场尽调标准衡量，其单客净贡献收益依然无从核验。
