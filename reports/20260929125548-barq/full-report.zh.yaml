      - number: '5.4'
        title: 信任体系、合规风控机制与开发者生态评估
        blocks:
          - type: paragraph
            body: >-
              作为受沙特央行监管的封闭式非上市股份有限公司，barq
              严格执行监管合规、用户数据隐私及交易监控标准。其隐私条款详尽界定了对金融交易记录、身份标识、设备特征以及持续地理位置的采集与治理，以满足央行反欺诈与反洗钱监管。在技术系统性风险上，barq
              存在极强的外部依赖：业务连续性根本上受制于 SAMA 本地清算系统可用性、第三方跨境汇款网络（Western Union、Alipay+、Thunes）以及沙特本土电信基础设施。工程研发上，barq
              保持封闭自研的技术栈，未开放公开开发者文档、API 网关或 GitHub 开源仓库。在缺乏开放开发者社区的情况下，外界只能凭移动端工程表现、在 Apple App Store 与 Google Play
              的发版节奏以及行业人才招聘动向评估其技术水准。尽调研判表明，其技术壁垒主要依托于金融牌照稀缺性、清算接口直连能力以及高并发交易执行稳定性，而非开源生态号召力。
