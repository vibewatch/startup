            body: >-
              barq 的技术架构采用持牌非银数字金融服务平台形态，通过 Buraq Financial Company（应用商店注册为 Barraq Finance
              Company）在沙特央行（SAMA）审慎监管下运行。系统直连沙特国家核心金融清算交换中心，依托 SAMA 结算网络与本土借记卡清算网络（mada）实现本地资金的即时充值与划转。在跨境资金调度上，barq
              放弃在每个汇款目的国自建双边代理清算通道，转而接入全球代理行伙伴与清算网络聚合商。目前直连的国际清算通道包括：支持全球现金自提与银行入账的 Western Union、覆盖 220
              个目的国跨境二维码扫码与商户收单的 Alipay+，以及直连海外银行账户与数字钱包的 Thunes。客户端涵盖 iOS 与 Android 双端高性能原生 App，并内嵌成熟的第三方分析与遥测
              SDK，包括用于崩溃监控的 Sentry、用于运营数据遥测的 Google Analytics for Firebase，以及用于推送通知与设备安全校验的 Google Play Services。
