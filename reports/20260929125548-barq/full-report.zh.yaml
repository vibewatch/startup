  - id: FV001
    title: 投资决策逻辑推导图
    type: flow
    summary: 投资决策推导脉络：从用户规模与融资金额出发，层层推演风险要素，最终得出「持有」评级。
    data:
      nodes:
        - id: scale
          label: 业务规模与资本基石
          description: 15M+ 用户、SAR 440B 交易量、以 $1.85B 估值完成 $329.5M A 轮融资
        - id: catalysts
          label: 战略催化剂
          description: Alipay+、Thunes、Western Union 合作网络及巴基斯坦业务扩张
        - id: friction
          label: 运营脆弱点
          description: 自动化反洗钱（AML）冻结、客服问题、Iqama 居留证更新滞后
        - id: economics
          label: 商业模型不透明
          description: 变现率未公开、SAMA 费率上限监管、负利润率风险
        - id: recommendation
          label: 最终投资建议
          description: 持有 / 中性：$1.85B 入场估值已充分反映预期
        - id: diligence
          label: 核心尽调抓手
          description: 重点核实净变现率、客群队列流失率及巴基斯坦 EMI 牌照审批进展
      edges:
        - from: scale
          to: catalysts
          label: 打通国际清算通道
        - from: scale
          to: friction
          label: 爆发式增长承压运营能力
        - from: friction
          to: economics
          label: 放大客户流失风险
        - from: catalysts
          to: economics
          label: 决定利润空间上限
        - from: economics
          to: recommendation
          label: 倒逼估值保持审慎
        - from: recommendation
          to: diligence
          label: 估值重新定价的前提条件
    notes: 本逻辑流向图清晰展现了对顶层运营规模、合规摩擦与估值纪律的综合推演。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV008
      - CV010
      - CV013
