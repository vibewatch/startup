              - CR011
      - number: '7.2'
        title: 系统运行可靠度与客户权益受损风险
        blocks:
          - type: paragraph
            body: >-
              负面信号虽属个案性质，但在两大用户评价渠道高度一致。2026 年 9 月一位 Google Play
              评价者称转账耗时已从数小时拉长至数天，另有评价反映遭遇欺诈交易后处置拖沓，且难以联系到有效人工支持。PissedConsumer 页面同样包含 2026
              年针对跨境汇款持续挂起、账户突遭冻结、身份认证续期摩擦及客服失联的投诉。虽有一名认证用户反馈已获全额退款并恢复账户，显示其存在工单处置能力，却无法反映常规的处置时效或解决成功率。这些个案无法确立整体客群的故障发生率、资金损失率或系统级宕机，且应用商店庞大的评分样本量无法替代微观的服务履约
              SLA
              数据。该风险依然居高不下，因薪资提取或汇款延误会给客户造成直接现实损害，引发激烈投诉、欺诈损失及监管审查。尽调必须要求调取转账成功率队列、账龄与延迟分布、欺诈损失与投诉率、客服响应时长、账户冻结归因明细及经独立审计的故障日志。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
              - CR016
