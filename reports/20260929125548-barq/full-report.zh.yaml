            body: >-
              barq 成立于 2023 年，总部位于利雅得。报道称其受监管的运营主体为 Buraq Financial Company，属于受沙特央行监管并获批牌照的封闭式股份制公司；而 Apple 商店页面将其提供方标为
              Barraq Finance Company，法定名称的具体音译仍需对照注册设立文件和牌照原件核对。             
              公司产品包括移动钱包、境内外转账、实体与虚拟卡、消费管理工具、钱包间互转以及面向商户的新功能。现有资料能说明产品覆盖面，却无法证实具体定价、抽成率（take rate）或收入模式。
