            body: >-
              barq 于 2024 年年中取得沙特央行（SAMA）牌照并正式上线，此后用户注册增长迅速。首个运营年度截至 2025 年 8 月，公司披露用户数突破 7 million，覆盖 150 个国籍；累计发行支付卡逾
              6.5 million 张，处理交易超 500 million 笔，交易额达 SR 73 billion（$19.4 billion）。到 2026 年，公司公布的增长数据进一步上升：2026 年 9
              月，累计注册账户突破 15 million，覆盖 210 多个国籍；平台累计处理交易额超过 SAR 440 billion（$117.3
              billion）。虽然这些顶层流水数据印证了强势的拉新能力与极广的应用分发度——Apple App Store 上超 226,000 条评分且均分达 4.6
              星——但尽调必须区分累计注册数与有资金且活跃的账户。消费级数字钱包常以免手续费和零门槛开户吸引用户，推高注册数；这并不保证用户持续交易或带来可变现的客户终身价值。
