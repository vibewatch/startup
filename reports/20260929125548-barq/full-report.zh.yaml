      - number: '6.3'
        title: 已落地的基础设施合作、汇款走廊伙伴与清算网络对接
        blocks:
          - type: paragraph
            body: >-
              barq 并不直接向企业客户销售企业软件；其机构级部署证据主要来自与全球支付网络、汇款网络和收单网关建立的生产合作。这些商业协议拓展了交易通道与商户受理网络，服务于 barq 的个人用户与商户客群。2024 年
              9 月，barq 联合万事达卡（Mastercard）上线 Mastercard Gateway 技术，为全沙特的商户与消费者提供先进的支付处理、反欺诈风控、周期性订阅扣款及分期付款能力。在 2026 年 9
              月的 Money20/20 中东大会上，barq 与万事达卡进一步深化同盟，扩大商户网络的收单受理面。此外，barq 与 Western Union 达成生产级集成合作，使得数百万注册钱包用户能够直连
              Western Union 覆盖 200 多个国家和地区的全球现金与账户清算网络实现即时跨境汇款。除 Western Union 与万事达卡外，barq 还接入了用于 B2B 银行账户和钱包端到端结算的
              Thunes、用于国际汇款通道的 TerraPay、用于转账前收款人身份核验的 iPiD，以及用于在全球 220 个目的国开展跨境二维码扫码与商户收单的蚂蚁国际旗下 Alipay+。
            claimRefs:
