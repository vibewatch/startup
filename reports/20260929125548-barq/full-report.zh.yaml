  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资逻辑、反向逻辑与战略权衡
        blocks:
          - type: paragraph
            body: >-
              评估 barq 的机构投资机会，核心在于权衡其亮眼的用户规模与持续存在的运营及商业不确定性。看多投资逻辑立足于 barq
              已经展现的能力：在沙特外籍务工群体与本地零售客群中抢占大众支付流量。在持有沙特央行（SAMA）牌照商业运营约两年内，barq 注册用户突破 1500 万户，覆盖 210 个国籍，平台累计交易总额超过 SAR
              440 billion（$117.3 billion）。管理团队由 Ahmed Alenazi 带头——他曾主导 stc pay 引入 Western Union 的 $200 million
              少数股权投资跻身独角兽——团队免收发卡费与跨境交易附加费，给出具竞争力的汇款定价，以此大举获客。反向逻辑则直指严峻的结构性脆弱点：表面上的交易额数据掩盖了未披露的净抽成率与获客补贴；境内交换费与收费标准面临
              SAMA 严格限价；消费者投诉提及 iqama 续期期间账户冻结；向巴基斯坦和 GCC 扩张的监管与运营成本尚未验证。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
