              barq 的对外叙事围绕注册用户和累计处理交易额的快速增长展开。首个运营年度截至 2025 年年中，公司面向 7 million 用户累计发卡逾 6.5 million 张，处理 500 million
              笔交易，实现流水 SR 73 billion（$19.4 billion）。到 2026 年 9 月，累计交易规模激增至逾 SAR 440 billion（$117.3 billion），注册账户突破 15
