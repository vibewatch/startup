      - number: '8.2'
        title: 投资建议、置信度评级与决策框架
        blocks:
          - type: paragraph
            body: >-
              基于当前 $329.5 million Series A 投后 $1.85 billion 估值，我们将 barq 的投资立场定为「持有 / 中性」（Hold /
              Neutral），给予「中」等置信度评级与「高」投资风险定位。虽然 $329.5 million 的注资显著延长了资金跑道、消除了近期偿付担忧，但以 $1.85 billion
              入场，在缺乏单位经济效益为正的可验证证据下，当前估值已反映出对近乎完美执行的极高预期。在零售金融科技与汇款业务里，交易总额（SAR 440 billion）并不等于净收入。在 SAMA
              的费率框架下运作——该框架强制免费数字开户并严控对消费者的收费上限——barq
              必须从跨境汇款外汇点差及商户收单手续费中变现。若缺乏针对单客收入、支付毛利率及客户队列留存的经审计披露，以成熟期独角兽倍数买入具有下行风险。机构投资者应当把后续资本配置建立在几项明确条件上：抽成率披露经核验、客户流失企稳，以及在巴基斯坦等扩张走廊拿下独立的电子货币机构（EMI）牌照。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
