    title: 客户全生命周期旅程图
    type: journey-map
    summary: 全景呈现客户在 barq 完整生命周期中的各个环节：从开户入驻、日常支付、跨境汇款落地，到各类留存摩擦点。
    data:
      nodes:
        - label: 数字化开户与 KYC 认证
          touchpoints:
            - Download app from iOS App Store or Google Play
            - Submit government digital identity (Iqama/Absher verification)
            - Multi-language UI selection (Arabic, English, Urdu, Bengali, Hindi)
        - label: 账户充值入金与绑卡发卡
          touchpoints:
            - Link domestic bank account or mada debit card
            - Instant issuance of virtual payment card for digital wallets
            - Request physical debit card for point-of-sale spending
        - label: 本地日常消费支付
          touchpoints:
            - Instant wallet-to-wallet P2P transfers with zero fees
            - In-store contactless payment via issued payment card
            - Merchant QR payments and bill settlement
        - label: 跨境汇款出海
          touchpoints:
            - Select recipient country across 200+ global destinations
            - Review dynamic foreign exchange rate and transfer fee
            - Route money via Western Union, Thunes, or Alipay+ rails
        - label: 身份复验与账户维护摩擦
          touchpoints:
            - Mandatory annual Iqama residency renewal synchronization
            - Automated AML compliance risk filters and account blocks
            - Customer service resolution inquiries and refund requests
        - label: 客户忠诚度、留存与多钱包并用
          touchpoints:
            - Comparison of daily foreign exchange margins across rival wallets
            - Evaluation of promotional transfer fee waivers and cashback campaigns
            - Persistent account usage versus dormancy across competing bank apps
    approximationNotes: 客户旅程各阶段系结合已核实的移动 App 核心功能、监管强制 KYC 要求以及消费者投诉反馈综合梳理而成。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU008
      - CU010
      - CU014
      - CU015
  - id: FR001
    title: 残余风险热力图
    type: matrix
    summary: 定性排序将已观察到的负面客户信号，与因缺少公开缓解证据而维持高位的风险区分开来。
    data:
      columns:
        - 发生概率信号
        - 影响程度
        - 缓解机制成熟度
      rows:
        - label: 跨境汇款稳定性
          values:
            - 高信号：2026 年频遭投诉
            - 高
            - 公开透明度低
        - label: 欺诈应对与客户追偿
          values:
            - 中信号：个案投诉性质严重
            - 极高
            - 公开透明度低
        - label: 本土及海外监管资质范围
          values:
            - 中：据报道已获授权；海外扩张审批未明
            - 极高
            - 部分缓解：未调取到一手记录
        - label: 安全与隐私内控
          values:
            - 未知：无事故发生率基数
            - 极高
            - 仅见制度规范
        - label: 支付通道合作方集中度
          values:
            - 未知：缺少各走廊业务份额
            - 极高
            - 部分缓解：已列明数家合作方
        - label: 资本纪律与单客经济模型（UE）
          values:
            - 未知：收入、烧钱速度及利润率全无
            - 高
            - 公开透明度低
    approximationNotes: 仅为定性评估矩阵；发生概率与成熟度非量化得分，客诉样本属于用户自发反馈，且公开证据缺失并不等同于内控机制或安全事件必然不存在。
