  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、业务分类与生态范围
        blocks:
          - type: paragraph
            body: >-
              在沙特央行（SAMA）监管框架下，barq 所处市场的边界涵盖数字钱包、境内账户间转账（A2A）、发卡业务以及面向个人的跨境汇款。在此边界内，可触达的支付支出包括境内个人 POS
              刷卡与电商消费、移动端个人对个人（P2P）转账、沙特庞大外籍劳工群体的跨境汇款，以及中小企业（SME）商户收单。相比之下，银行间大额清算、大型企业银团流动性管理与传统主权国库业务均排除在外。在传统格局下，现金交易与线下实体找换店长期主导外籍劳工汇款通道与零售小额消费。随着
              随着 SAMA 监管框架完善、“2030 愿景”金融部门目标推进，零售支付加速转向数字基础设施；移动钱包接入本土支付网络 mada 和区域互通通道，逐步替代现金，带动可触达交易规模变化。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
      - number: '2.2'
        title: 市场规模、增长轨迹与测算视角
        blocks:
          - type: paragraph
            body: >-
              评估 barq 的市场机遇需要多重视角，而非套用单一自上而下的线性预测。从宏观生态看，沙特电子支付交易总额从 2020 年的约 SR9 billion（$2.4 billion）激增至 2024 年底的近
              SR315 billion（$84 billion），              四年扩张超过二十倍。零售支付数字化也已深入：全沙特零售交易中电子支付占比超过 85%，市场上有 371 家持牌金融科技运营商，以及
              307 家以上参与开放银行的机构。在个人钱包与外籍劳工汇款这一可服务细分市场中，现代数字平台处理的交易额已达数百亿美元；barq 首年累计处理交易额就超过 SR73 billion（$19.4
              billion），随后更突破 SR440 billion（$117.3 billion）。然而，数字钱包的商业变现受制于境内刷卡分成与跨境汇款外汇点差，总支付额（TPV）决不能与净可触达营收混为一谈。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM008
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM008
              - CM010
      - number: '2.3'
        title: 客户画像分群、工作流掌控与用户旅程
        blocks:
          - type: paragraph
            body: >-
              目标客群可划分为三大类：外籍劳工、沙特本土个人消费者以及中小微商户。外籍消费者构成高频刚需的基本盘，核心诉求是低门槛的跨境工资汇款、多币种支持与实时外汇汇率，             
              资金主要汇往东南亚、南亚及中东的家庭。沙特本土个人消费者主要将移动钱包用于日常消费、公用事业账单缴费与个人间转账；流畅的体验和即时开通数字卡有助于推动采用。中小企业则代表新兴商业客群，诉求在于低费率商户收单、简化薪资代发及数字化资金管理工具。所有客群的接入均须通过严格的监管合规审核，特别是依托政府居留许可（Iqama）系统的线上身份核验。居留核验延迟、系统自动冻结账户以及严苛的转账限额等运营摩擦，构成了严重的客服拥堵与用户流失隐患。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM009
              - CM011
              - CM012
              - CM014
      - number: '2.4'
        title: 宏观催化要素、采纳阻力与尽调现实
        blocks:
          - type: paragraph
            body: >-
              沙特数字支付的普及受到多重制度红利的推动，包括“2030 愿景”下的金融部门发展计划、强制推行的电子化薪资发放系统，以及沙特 mada 与卡塔尔 HIMYAN 国家支付网络双边互联等区域跨境举措。此外，与
              Western Union、Alipay+、Thunes 等全球支付网络的商业合作，将数字钱包的实用场景从境内延伸至国际跨境消费走廊。反过来，显著的采纳阻力同样制约着平台的业务韧性。SAMA
              的反洗钱（AML）要求运营商严密监控交易，误报常导致账户冻结、居留证件数据同步失败及转账限额争议。与此同时，传统银行系钱包、电信系金融科技公司和区域先买后付（BNPL）机构竞争激烈，数字钱包运营商难以大幅提价，只能维持精瘦的单位经济，并重投入客服基础设施。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM008
              - CM009
              - CM013
              - CM014
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 总交易额体量掩盖了变现与抽成率真相
            body: >-
              尽管区域媒体连篇累牍地宣扬惊人的交易体量——例如沙特电子支付规模达到 SR315 billion（$84 billion），头部数字钱包交易额突破 SR440
              billion——但尽调必须区分交易流水与实际收入。在受监管的借记支付通道下，沙特境内个人支付费率面临刚性上限，数字钱包若要持续变现，仍需主要依靠跨境汇款外汇点差和面向中小企业的增值服务。
            calloutType: insight
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM010
          - type: callout
            title: 合规风控瓶颈在高频客群中引发严重摩擦
            body: >-
              沙特央行的监管规定要求数字钱包平台落实严密的反洗钱与居留身份核验机制。消费者投诉纠纷印证，自动化合规系统频繁造成毫无预警的账户冻结、Iqama
              证件同步延迟以及固定的转账限额。这些摩擦对外籍劳工的影响尤其大，直接威胁 barq 收益最高的跨境汇款业务的用户留存。
            calloutType: risk
            claimRefs:
              - CM004
              - CM009
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与玩家分类
        blocks:
          - type: paragraph
            body: >-
              barq
              身处由沙特央行（SAMA）监管、争夺白热化的数字支付与金融服务市场。竞争阵营可细分为四大类：电信运营商旗下的数字银行、商业银行主导的数字钱包、支持现金存取的传统找换店，以及资金雄厚的区域消费金融科技公司。最直接的对标竞品是
              stc pay（现正向 STC Bank 转型），这家公司的早期发展由 barq 创始人兼 CEO Ahmed Alenazi 推动，背靠 Saudi Telecom Company
              庞大的手机用户网络与数字化基础设施。与此同时，头部零售银行亦推出了自营移动钱包，如 Al Rajhi Bank 的
              Urpay，凭借工资代发天然截留境内零售支付。传统外币找换店与汇款机构依靠密集的线下网点，历来垄断外籍劳工跨境汇款的大半江山。此外，资本实力充裕的新锐金融科技公司亦在跨界渗透，例如 Tabby 于 2026 年
              9 月按 $6.5 billion 估值完成 $233 million 融资，正试图从先买后付延伸至综合财富管理与消费信贷。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
      - number: '3.2'
        title: 产品功能边界、汇款网络与能力矩阵
        blocks:
          - type: paragraph
            body: >-
              沙特数字钱包的差异化竞争，关键在于跨境汇款效率、支付卡功能和多币种资金调度是否便利。为服务沙特境内来自 210 多个国籍的外籍客群，barq 联合 Western Union、Thunes 及 Alipay+
              搭建起全球转账网络。用户可将资金直接汇入 220 多个国家和地区的银行账户与数字钱包，覆盖面足以叫板传统代理行清算网络。此外，barq 披露其首年发行了逾 6.5 million
              张数字支付卡，让用户即时获得直连沙特本土清算网络的虚拟卡与实体卡支付能力。在客户端交互上，barq 的 App
              支持阿拉伯语、英语、孟加拉语、印地语与乌尔都语五种语言，降低外籍劳工的使用门槛。相比之下，传统商业银行 App 的企业业务导航往往层级复杂，不便于不说阿拉伯语的工薪用户使用。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: 变现模式、切换成本与外籍客群锁定效应
        blocks:
          - type: paragraph
            body: >-
              barq 采用免费增值（freemium）定价模型，开户、账户维护以及境内个人间转账均免收手续费，核心依靠国际汇款的外汇点差与刷卡手续费分成（interchange）获取收入。传统找换店通常加收 2% 至 4%
              的手续费外加高额货币兑换点差，而数字钱包玩家为了抢夺外籍劳工流水，纷纷压缩收费。然而，消费者的切换成本在结构上极低：外籍打工者手机里普遍下载了多个应用，在 barq、stc pay 和 Urpay
              之间比价，利用免手续费促销和有利的汇率波动。合规瓶颈也拖累留存：消费者评价平台记录了居留许可（Iqama）定期续期期间突发账户冻结，以及转账限额在未预告时触发等问题。账户被锁会耽误劳工汇款，令不满的用户转回传统银行渠道。
