      - number: '8.3'
        title: 情景分析：乐观、基准与悲观回报建模
        blocks:
          - type: paragraph
            body: >-
              为评估三年投资期限内的风险调整后回报潜力，我们结合 barq 的披露数据与区域市场动态建立了三种运营情景。在乐观情景（25% 概率）中，barq 成功将其 1500 万用户基础变现：做大年度跨境汇款规模、由子公司
              MyTM 在巴基斯坦拿下完整 EMI 牌照并拓展企业代发业务，预估退出估值达 $3.50 billion（1.89x MOIC）。在基准情景（50% 概率）中，barq 与既有数字银行（STC
              Bank、D360）并存并稳住本土市占率，维持温和的汇款利润率，同时跨境拓展吸收大量合规与运营支出，支撑 $2.20 billion（1.19x MOIC）的合理估值。在悲观情景（25% 概率）中，SAMA
              出台监管限价、Western Union 及银行 App 加剧通道竞争，加上自动封号引发用户流失挤压净利润率，导致估值倍数收缩至 $1.10 billion（0.59x MOIC）。
