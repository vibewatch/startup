      - number: '6.4'
        title: 用户留存动态、集中度风险与交互体验脆弱性
        blocks:
          - type: paragraph
            body: >-
              尽调的一个关键发现是，barq 没有公开披露用户队列留存率（cohort retention）、净收入留存率（NRR）、总收入留存率（GRR）、月度流失率或获客成本（CAC）。数字钱包开户免费，用户又常同时使用
              stc pay、Al Rajhi 旗下的 Urpay 等竞品，因此庞大的累计注册数可能掩盖大量休眠账户。零售支付的切换成本低，用户忠诚度取决于汇率竞争力和服务稳定性。PissedConsumer
              等第三方评价平台上的独立用户反馈揭示了威胁客户留存的严重运营卡点。用户频繁遭遇毫无预警的账户冻结与资金卡死，多发生在外籍居民身份证（Iqama）续期滞后或未能自动同步至 barq 内部合规系统之时。依赖 barq
              每月向海外家庭紧急汇款的外籍打工者，在触发自动化风控限额或遭遇客服通道失联时陷入极大被动。这些由合规引发的服务中断，直接构成了用户转投传统商业银行汇款渠道的流失诱因。
            claimRefs:
              - CU003
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 掌控跨境汇款核心链路撬动外籍客群规模
            body: >-
              barq 两年内积累 15 million 注册用户、累计处理交易额超过 SAR 440 billion，核心依托沙特外籍劳工的汇款需求。它将 Western Union、Thunes
              等跨境网络接入多语言移动钱包，并提供即时转账和虚拟卡，切入了过去由线下找换店主导的高频工资汇款通道。
            calloutType: insight
            claimRefs:
              - CU001
              - CU004
              - CU008
              - CU010
          - type: callout
            title: 合规引发的账户冻结威胁用户留存韧性
            body: >-
              尽管注册用户增长亮眼，合规摩擦仍给留存带来压力。第三方消费者反馈平台持续出现外籍劳工投诉，涉及居留许可（Iqama）续期不同步及自动风控造成的突发账户冻结。务工人员若无法及时向家人汇款，可能转向有银行背景的竞品钱包。
            calloutType: risk
            claimRefs:
              - CU003
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、法律资质与数据安全风险
        blocks:
          - type: paragraph
            body: >-
              第三方报道称，barq 通过受沙特央行监管并持牌的 Buraq Financial Company
              开展受规管金融业务，但现有尽调凭证未包含监管机构出具的牌照记录、核准经营范围、附加监管条件或任何执法处罚历史。这使得沙特境内的展业许可成为一项须待确认的尽调要件，而非先验推定完全合规。公司隐私政策说明了其对身份、位置、设备及账户相关信息的收集，并列举了
              Google Play Services、Google Analytics for Firebase 及 Sentry 等第三方服务。Apple
              平台同样展示了开发者自报的数据类别，涵盖财务信息、地理位置、联系方式及关联身份的标识符。这些披露仅界定了广泛的数据采集边界，并不代表合规执行的有效性。业务扩张进一步放大了合规敞口：报道称出海目的国、展业时间表、监管报批计划及海外资本配置方案均未见披露。因而投资审批须要求核验主牌照、梳理逐个司法管辖区的准入审批路线图，并调取最新的数据隐私、反洗钱（AML）、制裁筛查及客户备付金存管保障内控凭据。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
