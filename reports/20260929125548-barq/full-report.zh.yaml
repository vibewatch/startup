      - number: '7.3'
        title: 合作伙伴绑定、资金储备与业务落地依赖
        blocks:
          - type: paragraph
            body: >-
              barq 的跨境服务价值主张高度依附外部清算通道。报道明确了其与 Western Union 及 Alipay+ 的合作关系，Yahoo 转发的 GlobalData 报道则提及用于国际汇款的 Thunes
              合作通道。公开渠道并未就任何合作方量化披露具体的交易分流比例、排他性条款、备用路由机制、服务级别协议（SLA）、备付金要求或单方解约权。渠道分发同样受制于 Apple 与 Google
              的移动应用生态，且隐私政策标明了对第三方数据分析与错误监控服务的依赖。资金体量不等同于抗风险韧性：两份独立报道称 barq 以 $1.85 billion 估值完成了 $329.5 million 的 A
              轮融资，但融资总额并非实际账面可用现金，且现有材料均未提供营业收入、毛利率、烧钱速度、欺诈损失、营运资金需求或现金跑道。宣称的用户规模与交易吞吐量大幅推高了内控缺失的潜在代价，而非盈利能力的证明。一旦核验后的转账可靠性、资金存管保障、监管审批进度、合作方冗余备份或单位经济效益凭证实质性脱节于扩张计划，投资逻辑即告破裂。
            claimRefs:
