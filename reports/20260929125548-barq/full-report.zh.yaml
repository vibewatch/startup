      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 投资一票否决指标（Kill Criteria）
            body: >-
              若出现以下情形，应坚决中止投资或下调估值：主干金融牌照范围未能覆盖实际在售产品；隔离存管的托管资金无法对账轧平；转账延迟与欺诈损失的队列数据持续缺失或突破风控红线；重大安全漏洞缺乏落实预算的整改闭环；或者在未获当地监管前置审批前强行推进海外上线。
