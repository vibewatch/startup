    rows:
      - - 市场规模与触达能力
        - 覆盖 210 个国籍的 15M+ 用户，牢牢卡位沙特庞大的跨境汇款走廊
        - 醒目的注册用户数包含大量冲着零费率发卡促销而来的沉睡账户
        - 月活跃账户数跌破注册账户数的 35%
      - - 交易吞吐规模
        - 累计交易量达 SAR 440B（$117.3B），体现出高频交易属性与消费者信任
        - 在刷卡手续费上限管制下，总支付交易额（GPV）转化出的净收入微乎其微
        - 平台全口径综合净变现率跌破 25 个基点（bps）
      - - 管理层过往业绩
        - 创始人 Ahmed Alenazi 曾成功操盘 stc pay，并在 Western Union 注资下将其估值推升至 $1.3B
        - 昔日的电子钱包打法正面临老牌数字银行（STC Bank、D360）更激烈的正面竞争
