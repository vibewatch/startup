      - number: '8.5'
        title: 分析图表
        blocks:
          - type: callout
            title: 海湾地区汇款业务：估值倍数与实际抽成率对照
            body: >-
              获得 $1.85 billion 估值让 barq
              跻身中东金融科技独角兽头部阵营。然而，在靠免收基础转账与发卡费吸引用户的低成本汇款及境内钱包模式下，交易吞吐量并不等同于净收入。长期企业价值完全取决于能否获取可持续的跨境汇款外汇点差，并交叉销售企业端支付通道。
            calloutType: insight
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV011
          - type: callout
            title: 账户自动冻结带来的下行风险敞口
            body: >-
              独立点评论坛上的客户反馈凸显了用户因法定 iqama 居留信息更新遭遇账户自动冻结的强烈不满。依赖即时汇款的外籍用户一旦遭遇资金锁定，切换成本荡然无存，流向 stc pay 和 Urpay
              等竞品银行钱包的速度显著加快，侵蚀平台的客户终身价值（LTV）。
            calloutType: risk
