      - - 欺诈应对及账户被盗后的资金支取
        - 一名 Google Play 用户在评价中称遭遇盗刷损失、处理拖沓、客服不力，随后账户被封；具体发生概率未知。
        - 极高
        - 公开透明度低；开发者仅引导该用户拨打客服电话或使用 App 内客服。
        - 响应时效、赔付方案与资损率数据全无，敞口偏高。
        - 若经核实的欺诈资损、备付金保障失效或客诉解决时长中位数突破内部制度或监管上限，直接行使一票否决。
      - - 跨境汇款延迟或未到账
        - 近期 Google Play 与 PissedConsumer 投诉称汇款数日未到账或持续显示处理中；样本属于用户自发反馈。
        - 高
        - 公开透明度低；部分投诉后续已解决，但官方未公布任何服务等级协议（SLA）统计数据。
        - 依赖跨境汇款的用户痛感强烈且客诉容易发酵升级，敞口偏高。
        - 要求按汇款走廊调取成功率与账龄分布；若长尾延迟持续发生且缺乏专项整改资金与客户赔偿，直接行使一票否决。
      - - 身份信息更新与意外封号
        - 多条 PissedConsumer 投诉发帖反映账户被封，或更新后的身份证件未被识别。
        - 高
        - 公开透明度低；仅有一名经核实的用户反馈账户已解封并获全额退款。
        - 封号频次、误杀率及资金冻结时长均未可知，敞口呈中高水平。
        - 要求调取封号原因代码、误杀率、人工审核耗时、申诉结果以及弱势客户处理机制。
      - - 安全、隐私及第三方遥测服务失效
        - 公司披露显示其采集多类数据并接入多家第三方服务；已调取证据中未见安全事故发生率或独立风控报告。
        - Unknown
        - 仅见制度规范声明；Google Play 仅声明了传输加密与数据删除机制。
        - 内控实际运转、历史数据泄露事件、灾备恢复目标（RTO/RPO）及服务商集中度均未核实，敞口偏高。
        - 若独立测试发现重大内控缺陷且无明确整改时限，或爆出未披露的安全事件，直接行使一票否决。
    notes: 投诉证据仅具方向参考价值，不代表整体客群全貌；因公开渠道未披露客诉基数、宕机历史、欺诈资损率或 SLA 指标，发生概率仅作定性评估。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
  - id: TR003
    title: 合作伙伴 / 依赖项风险台账
    columns:
      - 依赖项
      - 交易对手方
      - 承担角色
      - 集中度
      - 故障 / 失效场景
      - 严重程度
      - 公开缓解措施
      - 残余风险敞口
    rows:
      - - 跨境支付与出款通道
        - Western Union、Alipay+ 与 Thunes
        - 国际汇款与支付互联
        - 各通道交易份额与汇款走廊重叠情况均未公开。
        - 合作方系统宕机、合规解约、流动性受限或特定走廊暂停，导致客户资金延误。
        - 极高
        - 已公开接入多家合作方，具备一定分散度，但路由冗余能力与合同约定的 SLA 尚不明确。
        - 在核查分走廊交易量、容灾切换演练、解约权条款、备付金及补偿义务前，敞口维持高位。
      - - 移动应用分发
        - Apple App Store 与 Google Play
        - 获客、版本更新与设备端触达
        - 高度集中于两大主流分发平台；具体渠道占比未公开。
        - 应用下架、平台政策纠纷、更新审核受阻或签名账户被盗，损害用户访问与紧急修复能力。
        - 高
        - 两大平台上均可查到在架应用及近期更新记录。
        - 缺少 Web 端兜底方案、发版控制凭证和平台应急预案，敞口定为中高。
      - - 分析、诊断与移动平台基础服务
        - Google Play Services、Google Analytics for Firebase 与 Sentry
        - App 运行支撑、埋点分析与错误监控
        - 数据与运行层面的依赖程度未作量化。
        - 服务商宕机、隐私泄露、数据跨境传输受限或遥测盲区，均会削弱风控能力。
        - 高
        - 隐私政策明确列出了上述服务，并提供了用户权利相关条款。
        - 服务商 DPA、数据本地化存储、最小权限控制及备用替代方案尚未核实，敞口定为中高。
    notes: 已调取材料虽明确了交易对手方，但未披露具体合同、交易规模、排他性条款、服务等级、备付金或容灾兜底能力；集中度与残余风险敞口均属定性判断。
