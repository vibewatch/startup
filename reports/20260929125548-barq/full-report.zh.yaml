      - number: '8.4'
        title: 金融科技市场可比对象、尽调里程碑与决策逻辑
        blocks:
          - type: paragraph
            body: >-
              barq 获得 $1.85 billion 估值，反映沙特金融科技市场的发展；同期区域私募资本也在加码，例如 Tabby 以 $6.5 billion 估值完成 $233 million 融资。尽管 Tabby
              采用先买后付（BNPL）信贷模式并具备不同的商户费率结构，但两笔交易均印证了中东区域对具备规模的消费级平台的充沛流动性。barq 管理层具备深厚行业渊源：CEO Ahmed Alenazi 曾执掌 stc
              pay。2020 年，在 stc pay 转型为数字银行之前，Western Union 以 $200 million 收购其 15% 少数股权，当时估值为 $1.3 billion。要支撑独角兽估值，barq
              仍需解决开户摩擦、证明跨境汇款抽成率，并在 SAMA 监管下维持充足资本。决策框架据此列出机构投资者可执行的尽调触发条件。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
