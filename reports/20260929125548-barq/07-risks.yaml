schemaVersion: "report-v2"
artifact: risks
slug: barq
runDate: 2026-09-29
company:
  name: barq
chapter:
  number: 7
  title: Risks
  summary: >-
    barq's most visible risk is operating reliability at scale: recent customer reviews describe
    delayed remittances, account blocks, and weak support, while public evidence does not establish
    incident rates, service levels, or independent security controls. Regulatory expansion, partner
    concentration, and unreported unit economics remain material diligence gaps despite substantial
    reported funding and transaction scale.
sections:
  - id: regulatory-legal-and-data
    title: Regulatory, legal, and data exposure
    body: >-
      Third-party reporting says barq conducts regulated activity through Buraq Financial Company,
      which is licensed and supervised by the Saudi Central Bank, but the assigned evidence does not
      include the regulator's license record, scope, conditions, or any enforcement history. That
      makes domestic authorization a confirmable diligence item rather than a presumed clean bill of
      health. The company privacy notice describes collection of identity, location, device, and
      account-related information and names Google Play Services, Google Analytics for Firebase, and
      Sentry as third-party services. Apple likewise displays developer-provided categories including
      financial information, location, contact information, and identifiers linked to identity.
      These disclosures establish a broad data perimeter, not compliance effectiveness. Expansion
      increases the exposure: reporting says destinations, timing, approval plans, and capital
      allocation for international entry remain undisclosed. Investment approval should therefore
      require primary license verification, a jurisdiction-by-jurisdiction approval map, and current
      privacy, AML, sanctions, and safeguarding control evidence.
    claimRefs: [CR001, CR002, CR003, CR004, CR011]
    tableRefs: [TR001]
  - id: operating-reliability-and-customer-harm
    title: Operating reliability and customer-harm risk
    body: >-
      The adverse signal is anecdotal but consistent across two review venues. A September 2026
      Google Play reviewer said transfer time had stretched from hours to days, while another review
      alleged slow handling after fraudulent activity and difficulty reaching effective support.
      PissedConsumer pages similarly contain 2026 complaints about pending international transfers,
      unexpected account blocks, identity-renewal friction, and unanswered support contacts. One
      verified reviewer also reported a full refund and account restoration, showing that remediation
      can occur, but not its normal speed or success rate. These reports cannot establish population
      incidence, loss rate, or systemic outage, and the large app-store rating counts are not a
      substitute for service-level data. The risk remains high because delayed access to wages or
      remittances can create direct customer harm, complaints, fraud losses, and regulatory scrutiny.
      Diligence should demand transfer-success cohorts, aging distributions, fraud-loss and complaint
      rates, support response times, account-block reasons, and independently reviewed incident logs.
    claimRefs: [CR005, CR006, CR007, CR008, CR015, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-capital-and-execution
    title: Partner, capital, and execution dependencies
    body: >-
      barq's cross-border proposition depends on external rails. Reporting identifies Western Union
      and Alipay+ relationships, while a GlobalData article syndicated by Yahoo reports a Thunes
      partnership for international transfers. Public sources do not quantify transaction shares,
      exclusivity, fallback routing, service levels, reserve requirements, or termination rights for
      any counterparty. Distribution also depends on Apple and Google app ecosystems, and the privacy
      notice identifies third-party analytics and error-monitoring services. Financial capacity is
      not the same as economic resilience: two independent reports say barq closed a $329.5 million
      Series A at a $1.85 billion valuation, but funding raised is not cash available, and no assigned
      source provides revenue, gross margin, burn, fraud loss, working-capital needs, or runway.
      Reported user and processed-value scale raises the cost of weak controls rather than proving
      profitability. A thesis break should occur if verified transfer reliability, safeguarding,
      regulatory approvals, partner redundancy, or unit-economics evidence materially trails the
      expansion plan.
    claimRefs: [CR009, CR010, CR012, CR013, CR014]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk / rule, Jurisdiction, Evidence status, Likelihood, Severity, Public mitigation, Residual exposure, Diligence path]
    rows:
      - - Domestic payments authorization and supervision
        - Saudi Arabia
        - Third-party reporting says Buraq Financial Company is licensed and supervised by the Saudi Central Bank; primary license terms were not in the assigned evidence.
        - Medium evidence risk
        - Critical
        - Regulated operating entity is reported, but no primary record was available.
        - High until license scope, safeguarding conditions, and examination history are verified.
        - Obtain the current SAMA license, permitted-activity schedule, safeguarding structure, and all regulatory correspondence.
      - - Privacy, data protection, and third-party processing
        - Saudi Arabia; other user jurisdictions not established
        - Company and app-store disclosures show collection of financial, identity, location, device, and diagnostic data.
        - Medium
        - High
        - Privacy notice describes security measures, deletion rights, and named third-party services.
        - Medium-high because implementation, retention mapping, cross-border transfers, and audit results are not public.
        - Review the data map, DPA, consent records, retention schedule, processor contracts, penetration tests, and regulator correspondence.
      - - Overseas licensing and market entry
        - Target jurisdictions undisclosed
        - Expansion is reported, but destinations, timetable, approval sequence, and capital allocation are not public.
        - High execution uncertainty
        - High
        - New funding and planned operating-capacity investment are reported.
        - High until each product and corridor has named approvals, owners, budgets, and launch gates.
        - Require a jurisdiction-product license matrix and board-approved no-launch-before-approval controls.
    notes: >-
      Partial public-evidence register as of 2026-09-29; likelihood labels assess evidence and
      execution exposure, not legal conclusions, and null primary records are treated as diligence gaps.
    enumerationScope:
      coverage: partial
      basis: Publicly evidenced legal and regulatory risks in the assigned prefetched source pool.
    claimRefs: [CR001, CR002, CR003, CR004, CR010, CR011]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood signal, Severity, Mitigation maturity, Residual exposure, Unresolved gap / kill criterion]
    rows:
      - - Fraud response and access to funds after account compromise
        - A Google Play reviewer alleged fraud loss, delayed handling, weak support, and later account lockout; incidence is unknown.
        - Critical
        - Low public visibility; the developer directed the reviewer to phone or in-app support.
        - High because response-time, reimbursement, and loss-rate data are absent.
        - Kill if verified fraud losses, safeguarding failures, or median case resolution exceed policy or regulatory limits.
      - - Cross-border transfer delay or non-delivery
        - Recent Google Play and PissedConsumer reviews describe transfers taking days or remaining pending; samples are self-selected.
        - High
        - Low public visibility; some complaints report resolution, but no service-level statistics are published.
        - High for remittance-dependent users and complaint escalation.
        - Require success rate and aging by corridor; kill if persistent tail delays lack funded remediation and customer restitution.
      - - Identity refresh and unexpected account blocking
        - Multiple PissedConsumer posts describe blocked accounts or renewed identity documents not recognized.
        - High
        - Low public visibility; one verified reviewer reported account restoration and a full refund.
        - Medium-high because frequency, false-positive rate, and funds-access duration are unknown.
        - Require block reason codes, false-positive rates, manual-review timing, appeal outcomes, and vulnerable-customer handling.
      - - Security, privacy, and third-party telemetry failure
        - Company disclosures identify broad data collection and multiple third-party services; no incident rate or independent control report was assigned.
        - Unknown
        - Policy-level only; encryption in transit and deletion requests are declared on Google Play.
        - High because control operation, breach history, recovery objectives, and processor concentration are unverified.
        - Kill if independent testing finds material control gaps without time-bound remediation or if undisclosed incidents emerge.
    notes: >-
      Complaint evidence is directional and not population-representative; likelihood is qualitative
      because public sources provide no complaint denominator, outage history, fraud-loss rate, or SLA.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Public mitigation, Residual exposure]
    rows:
      - - Cross-border payment and payout rails
        - Western Union, Alipay+, and Thunes
        - International transfers and payment connectivity
        - Transaction share and corridor overlap are not public.
        - Partner outage, compliance termination, liquidity restriction, or corridor suspension delays customer funds.
        - Critical
        - Multiple named partners suggest some diversification, but routing redundancy and contractual SLAs are unknown.
        - High until corridor-level volumes, failover tests, termination rights, reserves, and restitution obligations are reviewed.
      - - Mobile application distribution
        - Apple App Store and Google Play
        - Customer acquisition, updates, and device access
        - Two dominant distribution platforms; channel shares are not public.
        - Delisting, policy dispute, delayed update, or signing-account compromise impairs access and remediation.
        - High
        - Current listings and recent updates are visible on both platforms.
        - Medium-high without web fallback, release-control evidence, and platform-contingency plans.
      - - Analytics, diagnostics, and mobile platform services
        - Google Play Services, Google Analytics for Firebase, and Sentry
        - App operation, analytics, and error monitoring
        - Data and operational dependence are not quantified.
        - Processor outage, privacy breach, data-transfer restriction, or telemetry blind spot weakens controls.
        - High
        - The privacy notice identifies the services and provides user-rights language.
        - Medium-high until processor DPAs, data residency, least-privilege controls, and replacement plans are verified.
    notes: >-
      The source set identifies counterparties but not contracts, volumes, exclusivity, service levels,
      reserves, or fallback capacity; concentration and residual exposure are therefore qualitative.
    claimRefs: [CR003, CR013, CR014, CR015, CR016]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Qualitative prioritization separates observed adverse customer signals from risks that remain high because public mitigation evidence is missing.
    data:
      columns: [Likelihood signal, Impact, Mitigation maturity]
      rows:
        - label: Cross-border transfer reliability
          values: ["High signal: repeated 2026 complaints", High, "Low public visibility"]
        - label: Fraud response and customer redress
          values: ["Medium signal: severe anecdotal report", Critical, "Low public visibility"]
        - label: Domestic and overseas regulatory scope
          values: ["Medium: authorization reported; expansion approvals unknown", Critical, "Partial: no primary record assigned"]
        - label: Security and privacy controls
          values: ["Unknown: no incident denominator", Critical, "Policy-level only"]
        - label: Payment-partner concentration
          values: ["Unknown: corridor shares absent", Critical, "Partial: several partners named"]
        - label: Capital discipline and unit economics
          values: ["Unknown: revenue, burn, and margins absent", High, "Low public visibility"]
    approximationNotes: >-
      Qualitative matrix only; likelihood and maturity are not numeric scores, complaint samples are
      self-selected, and missing public evidence is not proof that a control or incident does not exist.
    claimRefs: [CR001, CR005, CR006, CR007, CR010, CR011, CR013, CR014]
callouts:
  - calloutType: risk
    title: Investment kill criteria
    body: >-
      Stop or reprice if primary license scope does not cover the offered products, safeguarded funds
      cannot be reconciled, transfer-delay and fraud-loss cohorts remain unavailable or outside policy,
      material security findings lack funded remediation, or overseas launches precede required approvals.
    claimRefs: [CR001, CR005, CR006, CR007, CR011]
