  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulation
      missingEvidence: Primary SAMA license record, permitted-activity schedule, safeguarding conditions, and enforcement or examination history.
      whyItMatters: Third-party reporting cannot establish the precise regulatory perimeter or whether conditions constrain products and expansion.
      diligencePath: Obtain the current regulator record and reconcile every live product and customer-funds flow to its permission and safeguarding account.
      relatedQuestionRefs: [QR001, QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Revenue, gross margin, take rate, fraud losses, burn, working capital, unrestricted cash, and runway by product and corridor.
      whyItMatters: Funding raised and processed value do not establish revenue, liquidity, or a sustainable economic model.
      diligencePath: Review audited statements, bank statements, monthly management accounts, cohort economics, treasury policy, and the board-approved operating plan.
      relatedQuestionRefs: [QR009]
    - type: missing-source
      severity: blocking
      topic: security
      missingEvidence: Independent security certifications, penetration-test results, material incident history, uptime, recovery objectives, and control remediation logs.
      whyItMatters: Privacy-policy assurances and app-store declarations do not verify control operation or prove the absence of incidents.
      diligencePath: Obtain current SOC or ISO evidence, penetration reports, incident register, status data, business-continuity tests, and remediation ownership.
      relatedQuestionRefs: [QR010]
    - type: private-evidence-only
      severity: material
      topic: partner-concentration
      missingEvidence: Corridor-level partner volumes, exclusivity, reserve requirements, SLAs, termination rights, fallback routing, and outage test results.
      whyItMatters: Named partnerships do not establish redundancy or quantify the impact of a counterparty interruption.
      diligencePath: Review partner contracts, volume reports, corridor routing, failover tests, concentration limits, and customer-restitution obligations.
      relatedQuestionRefs: [QR006]
    - type: conflicting-data
      severity: minor
      topic: entity-resolution
      missingEvidence: Reliable entity linkage for homonymous Barq search results; the assigned net-new software-agency page is not the Saudi fintech and supports no business-risk claim here.
      whyItMatters: Conflating unrelated companies would contaminate funding, product, operating, or risk conclusions.
      diligencePath: Match every new source to Barraq Finance Company, barq.app, or another verified legal-entity identifier before using it in a claim.
