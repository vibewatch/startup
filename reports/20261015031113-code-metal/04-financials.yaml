      - [Lines of code translated, null, "Negotiated; no list price", CEO description relayed by independent reporting, Unit may not normalize code complexity or verification burden]
      - [Customer development time saved, null, "Negotiated; no list price", CEO description relayed by independent reporting, Outcome attribution and collection terms require contract review]
      - [User count and hardware support, null, Directory-described enterprise custom pricing, "Low-reputation third-party directory; verify with contracts", Could indicate a recurring license or support component]
      - [WarMatrix contract, "$80 million total announced value", "Contract total, not a unit or recognized-revenue figure", Company-issued release syndicated by Business Wire, Cannot derive annualized revenue or gross margin without award terms]
    notes: >-
      No public rate card was found in the assigned evidence; null values mean
      undisclosed, and the $80 million figure is a contract announcement rather
      than list pricing or recognized revenue.
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: Unit economics and capital-adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue or ARR, null, Low, Establishes scale and recurring mix, "Provide audited revenue, ARR definition, and monthly bridge"]
      - [Gross margin, null, Low, Tests whether verification labor and compute scale efficiently, "Provide margin by contract, product, services, and customer cohort"]
      - [CAC and payback, null, Low, Tests efficiency of long enterprise and defense sales, "Provide fully loaded CAC, sales cycle, and payback by segment"]
      - [Retention and expansion, null, Low, Separates durable deployments from paid pilots, "Provide GRR, NRR, renewals, expansions, and program transitions"]
      - [Profitability and cash flow, Company-reported profitable and cash-flow positive, Medium, Could materially reduce financing dependency if audited, "Provide audited statements and monthly cash-flow reconciliation"]
      - [Series B capital raised, "$125 million reported in February 2026", Medium, Adds financing capacity but is not current cash, "Provide primary closing documents, net proceeds, and use-of-funds schedule"]
      - ["Cash, burn, runway, debt, and working capital", null, Low, Determines capital adequacy and next-round trigger, "Provide bank cash, monthly burn, receivables, deferred revenue, debt, and covenants"]
    notes: >-
      Public-data checklist only; capital raised is not cash available, and null
      values identify metrics absent from the eight retained sources rather than
      estimates of zero.
    claimRefs: [CI005, CI006, CI007, CI008, CI010, CI011, CI012, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Contract-led revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a scoped enterprise delivery chain, but not
      numeric conversion rates, timing, or gross-margin percentages.
    data:
      nodes:
        - {id: customer-problem, label: Mission-critical modernization need, detail: Customer identifies code translation or portability work.}
        - {id: negotiated-scope, label: Negotiated scope and pricing basis, detail: Kernel time or lines of code may shape price.}
        - {id: translation, label: AI-assisted translation, detail: Source programs are analyzed and translated.}
        - {id: assurance, label: Testing and verification, detail: Assurance work supports acceptance.}
        - {id: delivery, label: Customer deliverable, detail: Verified modernization output is delivered.}
        - {id: acceptance, label: Milestone or customer acceptance, detail: Public terms do not disclose acceptance mechanics.}
        - {id: revenue, label: Contract revenue, detail: Contract value may convert to revenue over an undisclosed period.}
        - {id: gross-profit, label: Gross profit, detail: Delivery costs and resulting margin remain unknown.}
      edges:
        - {from: customer-problem, to: negotiated-scope}
        - {from: negotiated-scope, to: translation}
        - {from: translation, to: assurance}
        - {from: assurance, to: delivery}
        - {from: delivery, to: acceptance}
        - {from: acceptance, to: revenue}
        - {from: revenue, to: gross-profit}
    approximationNotes: >-
      Conceptual sequence only; no conversion rate, recognition schedule, or
      margin value is inferred from the available sources.
    claimRefs: [CI004, CI010, CI011, CI016]
callouts:
  - calloutType: risk
    title: Financing is not a runway calculation
    body: >-
      The reported $125 million Series B does not reveal current cash, burn,
      debt, secondary proceeds, working-capital needs, or restricted uses; runway
      should remain unscored until management supplies those inputs.
    claimRefs: [CI005, CI006, CI010]
