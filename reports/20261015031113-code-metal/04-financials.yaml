company:
  name: Code Metal
chapter:
  number: 4
  title: Financials
  summary: >-
    Code Metal has a visible contract-led revenue signal in the company-announced
    $80 million WarMatrix OTA and reportedly raised $125 million in February 2026,
    but neither figure establishes recognized revenue, current cash, or gross
    margin. Public evidence points to bespoke enterprise pricing and substantial
    delivery and verification work, while audited revenue, ARR, burn, runway,
    retention, concentration, and unit economics remain unavailable.
sections:
  - id: revenue-model
    title: Bespoke contracts, not a transparent SaaS rate card
    body: >-
      The best-supported monetization model is negotiated enterprise and
      government work rather than a standardized public SaaS plan. Independent
      reporting says Code Metal negotiates around time to develop a kernel,
      lines of code translated, or customer development time saved, while a
      software directory separately describes subscription-style enterprise
      pricing based on users and hardware support. Those descriptions may
      reflect different engagement types, but neither discloses realized prices,
      discounts, minimum commitments, renewal terms, or revenue-recognition
      policy. The company-issued WarMatrix announcement adds a concrete $80
      million contract value, yet it does not state period of performance,
      funded versus ceiling value, milestone schedule, or recognized revenue.
      The resulting bridge is project scope to verified deliverables to customer
      acceptance and contract revenue; gross profit cannot be inferred.
    claimRefs: [CI001, CI002, CI003, CI004, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Large-ticket traction is visible, but revenue quality is not
    body: >-
      The WarMatrix OTA is the strongest current commercial signal because it
      attaches a disclosed dollar value to work for a government customer.
      B Capital also names the U.S. Air Force, L3Harris, Toshiba, and RTX as
      customers, consistent with a concentrated enterprise and defense motion
      rather than high-volume self-service distribution. Separate reporting
      says the company previously had eight-figure revenue and now claims
      profitability and positive cash flow, but also notes that specific revenue
      figures and audited financials are unavailable. These signals support
      commercial demand, not recurring-revenue quality: backlog, funded value,
      contract duration, renewal behavior, customer concentration, and the
      split between licenses, engineering services, and milestone payments are
      still missing.
    claimRefs: [CI003, CI005, CI006, CI007, CI008, CI009, CI010]
  - id: cost-structure-and-unit-economics
    title: Verification depth likely makes delivery economics engagement-specific
    body: >-
      Code Metal describes a delivery pipeline that analyzes source programs,
      translates them, runs differential and property-based testing, performs
      static and compatibility analysis, applies formal verification where
      possible, and optimizes for target hardware. That workflow indicates
      meaningful research, engineering, compute, and assurance costs before a
      customer accepts output. The official research surface also shows an
      expanding research organization, eleven listed papers and articles, and
      university awards of $10,000 to $40,000 each for up to four recipients.
      None of those inputs yields a gross-margin estimate because public sources
      do not disclose labor allocation, model and compute expense, implementation
      effort, support burden, subcontractors, or revenue mix. CAC, payback,
      utilization, sales cycle, and contribution margin therefore remain
      diligence inputs rather than modelable public metrics.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: The financing extends options, but runway remains unprovable
    body: >-
      Three retained sources report a $125 million Series B at a $1.25 billion
      valuation in February 2026. That financing is capital raised, not evidence
      of current cash available: the public record does not reveal closing
      mechanics, secondary components, debt, cash at close, subsequent spend,
      burn, or restricted funds. The company's reported profitability and
      positive cash flow would materially improve the runway assessment if
      confirmed, but the claim is unaudited in the retained evidence. Financial
      underwriting should therefore treat revenue quality as promising but
      unverified, margin path as engagement-dependent, and capital intensity as
      potentially elevated by specialist labor and verification work. The next
      diligence package should reconcile signed backlog to recognized revenue,
      show customer-level gross margin and concentration, and provide monthly
      cash, burn, and working-capital schedules.
    claimRefs: [CI005, CI006, CI010, CI011, CI015, CI016]
