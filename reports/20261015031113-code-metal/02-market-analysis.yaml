    columns:
      - Lens
      - Publisher
      - Year
      - Geography
      - Value/status
      - CAGR/status
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["Defense beachhead budget", "Fortune; TechTimes", 2026, "U.S.", "$17M IOC then $80M OTA for WarMatrix", "Not disclosed", "Observed contract awards for one program", "medium", "Program demand signal, not total market size"]
      - ["Capital-market willingness to pay", "Forge", 2026, "U.S.", "$1.25B post-money Series B valuation", "n/a", "Private-market financing snapshot", "medium", "Valuation reflects expectations, not addressable spend"]
      - ["Vertical footprint lens", "Code Metal; B Capital", "2026 / 2025-2026", "Primarily U.S.", "Defense plus aerospace, semiconductor, automotive, and related regulated deployments", "n/a", "Named industries and use cases across company and investor disclosures", "medium", "No per-vertical revenue split or customer counts disclosed"]
      - ["Standalone TAM/SAM/SOM", "No retained public source", 2026, "n/a", "Not isolated", "n/a", "Retained sources describe workflows and budgets, not market totals", "low", "Requires third-party market study or management data room support"]
    notes: >-
      This chapter preserves only source-backed sizing lenses; no retained source isolates
      a numeric TAM, SAM, or SOM for Code Metal's verified-translation category.
    claimRefs: [CM003, CM005, CM008, CM012]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["Defense wargaming and simulation", "Program leadership and modernization sponsors", "Simulation planners and technical operators", "Government program budget via OTA/prototype path", "Make validated legacy models queryable and faster to run", "Service or program office", "Need to modernize without discarding validated models"]
      - ["Prime and defense-industry software modernization", "Prime contractor engineering leadership", "Embedded, platform, and mission-systems teams", "Program or contract delivery budget", "Port legacy or hardware-bound code into safer or faster targets", "Program manager or engineering VP", "Schedule pressure plus safety/compliance requirements"]
      - ["Semiconductor and edge portability", "Platform/product engineering leaders", "Compiler, systems, and performance engineers", "Product or platform budget", "Translate code across chips, accelerators, and deployment environments", "Product or platform owner", "Need to break hardware lock-in or shorten porting cycles"]
      - ["Automotive, telecom, aerospace, and other regulated industries", "Engineering and operations leadership", "Development and validation teams", "Program or product budget", "Move research or legacy code into production-ready, verified implementations", "Engineering, product, or compliance owner", "Cannot ship unverifiable AI-generated code into safety- or mission-critical systems"]
    notes: >-
      Buyer, user, payer, and budget-owner roles are inferred from disclosed use cases and
      named customers; public sources do not provide a standardized budget taxonomy.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM011]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Evidence-backed narrowing from broad high-assurance software modernization demand to
      today's public defense wedge, without inventing an unsupported TAM.
    data:
      items:
        - label: High-assurance software modernization
          detail: Mission-critical systems need translation, verification, optimization, and proof before deployment.
          claimRefs: [CM001, CM002, CM009]
          tone: neutral
        - label: Cross-language and cross-hardware portability
          detail: Public use cases center on moving code between languages, accelerators, and edge targets while preserving behavior.
          claimRefs: [CM001, CM007, CM009]
          tone: neutral
        - label: Regulated and mission-critical verticals
          detail: Official, investor, and profile sources repeatedly name defense, aerospace, semiconductor, automotive, and related regulated sectors.
          claimRefs: [CM002, CM003, CM004]
          tone: opportunity
        - label: Budgeted modernization programs
          detail: Adoption appears enterprise and programmatic rather than seat-based, with budget owners tied to product, platform, or program modernization.
          claimRefs: [CM006, CM011]
          tone: warning
        - label: Current defense wedge
          displayValue: $17M IOC -> $80M OTA
          note: WarMatrix is the clearest public proof that the workflow can attract real program dollars.
          claimRefs: [CM005, CM012]
          tone: positive
        - label: Multi-vertical expansion still unquantified
          detail: Named industrial adjacencies exist, but public sources do not disclose a clean TAM/SAM/SOM, pricing curve, or revenue mix by vertical.
          claimRefs: [CM008, CM011]
          tone: risk
    approximationNotes: >-
      The pyramid shows narrowing layers rather than value-proportional market shares
      because retained sources do not publish a category-level TAM, SAM, or SOM.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008, CM009, CM011, CM012]
callouts:
  - calloutType: insight
    title: Verified translation is a budget category, not just a coding feature
    body: >-
      The strongest evidence ties demand to preserving validated systems under
      modernization pressure, which places Code Metal closer to high-assurance
      infrastructure budgets than to commodity developer-seat pricing.
    claimRefs: [CM001, CM005, CM009, CM011]
  - calloutType: risk
    title: Market breadth is still easier to describe than to quantify
    body: >-
      Public sources support several adjacent verticals, but the retained evidence still
      stops short of a source-backed TAM, buyer-budget decomposition, or cross-vertical
      revenue mix, which limits how confidently this chapter can translate product fit
      into valuation upside.
    claimRefs: [CM004, CM008, CM011]
