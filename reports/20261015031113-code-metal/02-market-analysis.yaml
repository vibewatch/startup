      - ["Defense modeling and simulation modernization", "AI-enabled wargaming, simulation orchestration, and legacy defense-software reuse", "Traditional prime-platform manufacturing spend unrelated to software modernization", "Defense program offices, service modernization budgets, and prime-supported programs", "Current strongest public budget signal via WarMatrix awards"]
      - ["Industrial and edge portability", "Moving MATLAB, CUDA, C++, and related code into deployable Rust, VHDL, OpenCL, or hardware-specific targets", "General-purpose cloud software tooling without hardware-portability needs", "Product engineering and semiconductor or edge-system owners", "Repeated in official research, PR, and partner framing"]
      - ["Regulated deployment workflows", "Safety, compliance, and certification-sensitive software modernization in automotive, aerospace, telecom, and robotics", "Low-risk consumer software where statistical code generation is acceptable", "Program, engineering, and compliance budget owners", "Explains premium willingness to pay more than developer-seat counts do"]
    notes: >-
      Included and excluded spend are evidence-constrained market boundaries synthesized
      from retained sources; they are not a public TAM estimate.
    claimRefs: [CM001, CM002, CM003, CM004, CM007, CM009]
