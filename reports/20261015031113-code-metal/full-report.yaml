  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Bespoke contracts, not a transparent SaaS rate card
        blocks:
          - type: paragraph
            body: >-
              The best-supported monetization model is negotiated enterprise and government work rather than a
              standardized public SaaS plan. Independent reporting says Code Metal negotiates around time to develop a
              kernel, lines of code translated, or customer development time saved, while a software directory
              separately describes subscription-style enterprise pricing based on users and hardware support. Those
              descriptions may reflect different engagement types, but neither discloses realized prices, discounts,
              minimum commitments, renewal terms, or revenue-recognition policy. The company-issued WarMatrix
              announcement adds a concrete $80 million contract value, yet it does not state period of performance,
              funded versus ceiling value, milestone schedule, or recognized revenue. The resulting bridge is project
              scope to verified deliverables to customer acceptance and contract revenue; gross profit cannot be
              inferred.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI016
