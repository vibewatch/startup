  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public materials describe a six-layer flow from source code and runtime constraints through translation,
      assurance, and target deployment outputs.
    data:
      layers:
        - label: Source intent and reference code
          detail: Starting point is high-level or legacy code plus a desired modernization or portability outcome.
          modules:
            - label: Inputs
              value: Python, MATLAB, Julia, legacy systems
            - label: Goal
              value: Portability, modernization, compliance-sensitive deployment
        - label: Runtime and hardware definition
          detail: Users declare the edge environment before translation begins.
          modules:
            - label: Targets
              value: CPUs, GPUs, FPGAs
            - label: Context
              value: RAM, VRAM, cores, LEs, preferred toolchains
        - label: Translation planning
          detail: The platform builds a transpilation and deployment plan rather than emitting undifferentiated code.
          modules:
            - label: Planning outputs
              value: Dependency tracking, segmentation, target-language plan
        - label: AI generation and optimization
          detail: Code generation is oriented toward target architectures and edge constraints.
          outputs:
            - label: Target outputs
              value: Embedded C/C++, Rust, VHDL, Verilog, CUDA, HIP, ONNX
        - label: Validation and verification
          detail: Testing and proof-oriented checks run throughout the pipeline instead of only at the end.
          modules:
            - label: Checks
              value: Differential testing, property-based testing, static analysis, formal verification
        - label: Deployment and buyer assurance
          detail: >-
            The product promise is production-ready code for mission-critical environments, but public operational
            telemetry remains sparse.
          outputs:
            - label: Assurance promise
              value: Tested, optimized, compliant code
            - label: Open diligence
              value: Status telemetry, release cadence, certification evidence
    approximationNotes: >-
      This stack is synthesized from public product and research descriptions; it is a reader aid, not a
      reverse-engineered internal architecture diagram.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE013
  - id: FU001
    title: Customer journey from modernization wedge to expansion proof
    type: journey-map
    summary: >-
      Public evidence suggests Code Metal lands on urgent legacy-code problems, seeks verified production proof, and
      then tries to expand into broader portability and hardware programs.
    data:
      items:
        - label: Legacy-code pain becomes urgent
          tone: warning
          detail: Mission-critical teams face old code, scarce expertise, and zero-error requirements.
          touchpoints:
            - Defense and regulated-industry urgency
            - Correctness and compliance are purchase triggers
        - label: Initial scoped modernization engagement
          tone: neutral
          detail: A customer starts with a bounded translation or portability project.
          touchpoints:
            - Legacy C# to C++ modernization
            - Hardware retargeting and code portability
        - label: Verified deployment claim
          tone: positive
          detail: Public proof shifts from concept to an operational or production-use claim.
          touchpoints:
            - Named customers include U.S. Air Force and L3Harris
            - Production use is asserted, but often without denominators
        - label: Outcome evidence builds trust
          tone: positive
          detail: Case studies focus on speed, correctness, and mission-readiness outcomes.
          touchpoints:
            - Two-week modernization example
            - Weeks-to-days L3Harris translation claim
        - label: Expansion into adjacent verticals
          tone: opportunity
          detail: The same wedge is marketed into semiconductor, automotive, telecom, and industrial accounts.
          touchpoints:
            - Portability across chips and devices
            - Regulated enterprise environments beyond defense
        - label: Renewal and concentration still need proof
          tone: risk
          detail: Public evidence has not yet shown retention, contract duration, or customer mix durability.
          touchpoints:
            - No public GRR, NRR, or customer-count disclosure
            - Programs-of-record conversion remains the hard test
