              - CM006
              - CM007
              - CM011
      - number: '2.3'
        title: Growth drivers, constraints, and evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The main adoption drivers in the retained sources are explicit: regulated or mission-critical teams need
              code portability, memory safety, compliance, and behavior preservation, yet cannot trust generic
              AI-generated code without additional assurance. Code Metal's defense traction also suggests a timing
              driver: OTAs and modernization programs can fund adoption when the product preserves legacy validated
              assets rather than replacing them. The same evidence also shows why market expansion is not automatic.
              TechTimes distinguishes formally verified code translation from the separate risk of hallucinated
              analytical outputs, and Fortune notes that the current revenue mix is still about 75% defense-related. The
              result is a credible beachhead, but not a fully proven cross-vertical market. Public diligence is still
              missing customer counts, pricing, budget-line ownership by vertical, and a source- backed decomposition of
              how much of the market is truly reachable beyond defense programs and a handful of named industrial
              accounts.
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Verified translation is a budget category, not just a coding feature
            body: >-
              The strongest evidence ties demand to preserving validated systems under modernization pressure, which
              places Code Metal closer to high-assurance infrastructure budgets than to commodity developer-seat
              pricing.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM011
          - type: callout
            title: Market breadth is still easier to describe than to quantify
            body: >-
              Public sources support several adjacent verticals, but the retained evidence still stops short of a
              source-backed TAM, buyer-budget decomposition, or cross-vertical revenue mix, which limits how confidently
              this chapter can translate product fit into valuation upside.
