chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Code Metal positions itself as a verifiable code-translation platform for mission-critical software rather
              than a general-purpose coding copilot. The official homepage frames the offer as "verifiable code
              translation for industries where every line of code matters," while third-party profiles consistently
              place the company in defense, aerospace, automotive, semiconductor, and robotics workflows where
              portability, compliance, and hardware-specific optimization matter more than raw prototyping speed.
              Forge's profile anchors the basics: the company was founded in 2023, is headquartered in Boston, and was
              started by Peter Morales and Alex Showalter-Bucher. That combination makes later chapters' market and
              product analysis easier to interpret: Code Metal is selling trust, portability, and modernization in edge
              and defense-adjacent environments, not consumer developer tooling volume.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO009
              - CO010
              - CO012
              - CO013
      - number: '1.2'
        title: Leadership coverage and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is founder-led but no longer founder-only. Growth Engineer describes Morales
              as an MIT Lincoln Laboratory and BAE Systems veteran focused on defense machine-learning deployments,
              while Alex Showalter-Bucher brings another MIT Lincoln Lab background in automation and robotics. Forge
              and Growth Engineer also show a February 2026 operating-bench upgrade when former Tableau CEO Ryan Aytay
              joined as President and COO, a signal that Code Metal is preparing for heavier enterprise sales and
              operational scaling. AI Market Watch adds Laura Shen as a public growth leader. What remains notably
              opaque is formal board composition, control rights, and financing governance: the assigned evidence names
              investors and executives, but not a complete board roster or preferred-security terms.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO011
          - type: table
            tableRef: TO002
