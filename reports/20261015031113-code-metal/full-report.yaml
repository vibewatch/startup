            title: Financing is not a runway calculation
            body: >-
              The reported $125 million Series B does not reveal current cash, burn, debt, secondary proceeds,
              working-capital needs, or restricted uses; runway should remain unscored until management supplies those
              inputs.
            calloutType: risk
            claimRefs:
