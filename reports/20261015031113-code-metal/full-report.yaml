      - number: '4.2'
        title: Large-ticket traction is visible, but revenue quality is not
        blocks:
          - type: paragraph
            body: >-
              The WarMatrix OTA is the strongest current commercial signal because it attaches a disclosed dollar value
              to work for a government customer. B Capital also names the U.S. Air Force, L3Harris, Toshiba, and RTX as
              customers, consistent with a concentrated enterprise and defense motion rather than high-volume
              self-service distribution. Separate reporting says the company previously had eight-figure revenue and now
              claims profitability and positive cash flow, but also notes that specific revenue figures and audited
              financials are unavailable. These signals support commercial demand, not recurring-revenue quality:
              backlog, funded value, contract duration, renewal behavior, customer concentration, and the split between
              licenses, engineering services, and milestone payments are still missing.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Verification depth likely makes delivery economics engagement-specific
        blocks:
          - type: paragraph
            body: >-
              Code Metal describes a delivery pipeline that analyzes source programs, translates them, runs differential
              and property-based testing, performs static and compatibility analysis, applies formal verification where
              possible, and optimizes for target hardware. That workflow indicates meaningful research, engineering,
              compute, and assurance costs before a customer accepts output. The official research surface also shows an
              expanding research organization, eleven listed papers and articles, and university awards of $10,000 to
              $40,000 each for up to four recipients. None of those inputs yields a gross-margin estimate because public
              sources do not disclose labor allocation, model and compute expense, implementation effort, support
              burden, subcontractors, or revenue mix. CAC, payback, utilization, sales cycle, and contribution margin
              therefore remain diligence inputs rather than modelable public metrics.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
