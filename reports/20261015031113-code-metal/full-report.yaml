      - number: '5.3'
        title: Maturity, differentiation, and open technical risks
        blocks:
          - type: paragraph
            body: >
              Product maturity is supported more by research cadence, partner/customer logos, and repeated
              problem-solution narratives than by operational telemetry. The research index shows a sustained stream of
              papers and technical articles across 2023-2026, which is stronger than a pure landing-page story and
              suggests real formal-methods investment. External profiles and B Capital's Series B note reinforce the
              same differentiation thesis: Code Metal is positioning itself against manual rewrites and generic AI
              coding tools by pairing generation with proof-oriented assurance. The open risk is that public evidence
              still does not show developer-signal metrics, uptime/status history, certification packets, or detailed
              customer deployment scope, so buyers still need first-party diligence on reliability, security, and
              services dependence before underwriting product maturity.
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
              - CE013
