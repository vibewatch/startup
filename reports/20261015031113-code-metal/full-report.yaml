  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and buyer workflow
        blocks:
          - type: paragraph
            body: >
              Code Metal's public product story is consistent across official and third-party materials: the company
              sells automated code translation for settings where teams cannot accept "good enough" AI output. The
              workflow begins from high-level or legacy source code and a customer-defined runtime target, then moves
              toward translated code, test artifacts, and deployment outputs for constrained edge environments. Publicly
              named user groups cluster around defense, aerospace, automotive, semiconductor, and industrial engineering
              teams that need portability across chips, languages, and compliance-sensitive environments. The public
              evidence is strong on workflow framing and use cases, but still thin on package boundaries, pricing
              mechanics, and how much of a deployment is software versus services.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
              - CE010
