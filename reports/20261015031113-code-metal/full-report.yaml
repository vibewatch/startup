      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >
              The clearest architectural signal is that Code Metal does not describe the product as a simple
              prompt-to-code assistant. Instead, its materials emphasize a staged operating model: users specify
              hardware and toolchain constraints up front; the system analyzes and translates source code; validation
              steps run throughout the pipeline; and outputs are optimized for the target architecture rather than
              emitted as generic code. The May 2026 research note is especially important because it explains that
              testing, static analysis, and formal verification are integrated into the translation flow rather than
              added only after generation. That framing supports a differentiated systems product, although public
              materials still stop short of disclosing concrete release engineering, rollback, or production support
              mechanics.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE012
              - CE013
