      - number: '3.2'
        title: Trade-offs center on assurance versus scope
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation claim is assurance. Official and investor materials repeatedly frame Code
              Metal as a system that combines AI generation with testing, analysis, and formal verification, while the
              external review sources describe Cursor/Claude-style tools as fast but unverified and Sonar/Semgrep-style
              tools as analysis-first rather than translation-first. The more important competitive comparison is not
              whether rivals can emit code, but whether they can move a large legacy codebase across languages and
              hardware targets without breaking compliance or behavior. Domain-specific compilers and internal teams can
              sometimes deliver narrower variants of that outcome, but retained sources describe them as constrained by
              target scope or engineering time.
            claimRefs:
