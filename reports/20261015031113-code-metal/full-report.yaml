      - number: '2.2'
        title: Sizing lenses, buyers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several constrained sizing lenses but not a clean public TAM/SAM/SOM. The
              strongest quantifiable signal is budget already attached to the defense wedge: Fortune and TechTimes
              report an initial $17 million operating capability award followed by an $80 million OTA for WarMatrix,
              while Forge records a $1.25 billion post-money Series B valuation that shows investor willingness to pay
              for the category without proving end-market scale. Beyond defense, company and partner sources repeatedly
              name aerospace, semiconductor, automotive, and telecommunications-style portability problems, implying a
              broader addressable workflow where the buyer is typically an engineering or program owner, the user is an
              engineering or simulation team, and the payer sits in a program, product, or modernization budget rather
              than a seat-based developer-tools line item. The adoption path therefore looks enterprise and
              programmatic: prove translation reliability on a high-consequence workflow, then expand across adjacent
              codebases, hardware targets, or services.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM002
