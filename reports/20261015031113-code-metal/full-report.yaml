      - number: '1.3'
        title: Funding history and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Public financing signals are unusually strong for a company founded in 2023. AI Market Watch records a
              $3.45 million pre-seed in December 2023 and a $13 million seed in July 2024; Code Metal's own Series A
              announcement says Accel led a $36.5 million round at a $250 million valuation; and Forge lists a February
              2026 Series B at a $1.25 billion post-money valuation with Salesforce Ventures, Accel, B Capital, J2
              Ventures, Overmatch, RTX Ventures, Shield Capital, and Smith Point Capital among investors. That stack
              implies roughly $177.95 million of disclosed funding across the public rounds, but the economic detail
              still stops at headline size: liquidation preferences, secondaries, debt facilities, and the full
              cap-table logic are not public in this worker pool. The stakeholder picture is therefore strongest on
              brand-name investors and early lighthouse customers, weaker on governance and concentration.
            claimRefs:
              - CO006
              - CO007
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO015
      - number: '1.4'
        title: Traction, milestones, and the key execution risk
        blocks:
          - type: paragraph
            body: >-
              The public traction narrative is credible enough to matter but still not deep enough to underwrite on
              headline growth alone. Code Metal's Series A announcement said the company had already deployed across
              defense, automotive, and semiconductor end markets and was "already on contract to deliver eight figures
              in revenue this year," while B Capital later named the U.S. Air Force, L3Harris, Toshiba, and RTX as
              customers. AI Market Watch and Welcome AI add later milestone claims around Tradewinds recognition and an
              $80 million WarMatrix OTA award. The sharpest counterweight comes from Implicator: the market may be
              underwriting the value of verified translation before public evidence proves the approach scales across
              million-line, undocumented defense codebases. That tension explains the chapter's bottom line: strong
              financing and customer signaling coexist with thin disclosure on audited revenue quality, customer
              concentration, and production-scale proof.
