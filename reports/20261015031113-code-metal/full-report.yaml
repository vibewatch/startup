        blocks:
          - type: callout
            title: Trust layer, not just code generation
            body: >-
              The most defensible differentiation in the retained pool is that Code Metal sells verified portability for
              regulated systems, not generic developer productivity.
            calloutType: strength
            claimRefs:
              - CP001
              - CP010
              - CP011
