              - CP016
          - type: callout
            title: Public comparability is still weak
            body: >-
              The strongest external pushback is not a named direct rival, but the lack of transparent pricing, win/loss
              proof, and long-horizon evidence that the category's methods hold up at scale.
            calloutType: risk
            claimRefs:
