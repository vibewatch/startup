      - number: '3.3'
        title: Durability depends on enterprise access, but packaging proof is thin
        blocks:
          - type: paragraph
            body: >-
              The weakness in the public record is commercial comparability. WIRED reports that Code Metal prices each
              deal individually around time saved or translation work units, and GrowthEngineer says public pricing
              tiers are not disclosed. That opacity makes it hard to benchmark procurement friction against substitutes,
              especially when internal rewrites are paid through engineering headcount and generic coding tools can be
              adopted bottom-up. Code Metal is trying to offset that disadvantage by scaling enterprise distribution
              through the Ryan Aytay hire and by broadening adjacency through the Signal Processing Technologies
              acquisition. Even so, the strongest adverse evidence remains that category methodologies are still proving
              themselves and long-term durability is not yet independently settled.
