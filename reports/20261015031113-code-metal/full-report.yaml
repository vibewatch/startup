      - number: '4.4'
        title: The financing extends options, but runway remains unprovable
        blocks:
          - type: paragraph
            body: >-
              Three retained sources report a $125 million Series B at a $1.25 billion valuation in February 2026. That
              financing is capital raised, not evidence of current cash available: the public record does not reveal
              closing mechanics, secondary components, debt, cash at close, subsequent spend, burn, or restricted funds.
              The company's reported profitability and positive cash flow would materially improve the runway assessment
              if confirmed, but the claim is unaudited in the retained evidence. Financial underwriting should therefore
              treat revenue quality as promising but unverified, margin path as engagement-dependent, and capital
              intensity as potentially elevated by specialist labor and verification work. The next diligence package
              should reconcile signed backlog to recognized revenue, show customer-level gross margin and concentration,
              and provide monthly cash, burn, and working-capital schedules.
