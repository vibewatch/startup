  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained sources frame Code Metal around a specific job to be done: translate, verify, and optimize
              existing code for environments where bugs, hardware mismatch, or failed certification carry operational or
              regulatory cost. That is materially narrower than the broad AI-coding-assistant market. Code Metal's own
              research and about pages consistently describe translation across languages, architectures, and hardware
              targets with proof of behavioral preservation, while B Capital and Forge place the company inside
              mission-critical verticals such as defense, aerospace, automotive, robotics, and semiconductors. The
              practical substitute is not only another code model; it is also manual modernization, in-house compiler
              and tooling work, legacy-code retention, and systems-integrator projects that preserve validated behavior.
              That boundary matters for valuation because willingness to pay depends less on developer productivity and
              more on whether customers can shorten modernization cycles without reintroducing safety, compliance, or
              mission risk.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM009
