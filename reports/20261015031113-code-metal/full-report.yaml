  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix is concentrated in mission-critical defense and industrial accounts
        blocks:
          - type: paragraph
            body: >-
              Code Metal's public customer footprint is narrow but legible: the company repeatedly frames its work
              around defense, aerospace, semiconductors, and automotive environments where software errors can create
              safety, certification, or mission failures. Independent and partner sources repeatedly name the U.S. Air
              Force, RTX, L3Harris, and Toshiba, which suggests the current public proof is anchored by a handful of
              large defense and industrial references rather than a broad self-serve or SMB base. The record also
              implies buyer, user, and payer separation: engineering or modernization teams appear to use the product,
              while primes, OEMs, and government programs likely hold the budget authority. That is a credible fit for
              high-value enterprise procurement, but it also means the reader should expect slower expansion cycles and
              higher concentration risk than the number of named logos alone would imply.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU012
