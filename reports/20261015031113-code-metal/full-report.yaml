      - number: '6.2'
        title: Public adoption proof is real, but mostly case-study and named-account based
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption evidence is not broad denominator data; it is repeated, named-account proof
              plus a small number of outcome anecdotes. ai2.work reports 4+ programs of record with U.S. government and
              prime contractors, while the same source says named customers are already using the platform in
              production. Code Metal's NAMC member page adds an unnamed mission-code case study that reduced 138k lines
              of legacy C# to 25k lines of C++ in two weeks, and Code Metal's 2025 Series A release adds an investor
              quotation saying L3Harris projects moved from weeks to days. Together, those items support real deployment
              activity, but they still leave missing denominators around how many programs are active, how large they
              are, and how repeatable those outcomes are across customers.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
              - CU012
              - CU013
      - number: '6.3'
        title: Expansion logic is plausible, but retention and breadth remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The commercial logic is clear: Code Metal can enter through a painful modernization or portability
              project, prove correctness in a constrained workflow, and then expand into additional codebases, chips, or
              regulated environments where customers value verification. That pattern is supported by company and
              investor descriptions of portability, hardware retargeting, and modernization across defense, telecom,
              semiconductor, automotive, and industrial settings. What the public record does not show is whether those
              initial wins renew into long-duration platform relationships. No retained source discloses customer count,
              renewal rates, contract duration, NRR, GRR, or account-level revenue mix, so expansion remains more of a
              thesis than a measured customer-retention fact.
            claimRefs:
              - CU010
              - CU011
              - CU014
      - number: '6.4'
        title: The key customer risk is conversion from marquee pilots into durable programs
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in this pool is not a churn event or public customer complaint; it is skepticism
              about how far the current proof really extends. Implicator argues that named pilots are not the same as
              production at scale and frames conversion into multiyear programs of record as the real test. That
              critique matters because the same few names recur across the public record, and none of the retained
              sources discloses concentration by account or by government versus commercial mix. If even one or two
              marquee accounts dominate current revenue, the upside from high-value procurement could be offset by
              timing risk, program review risk, and lumpy expansion. The chapter therefore supports customer
              credibility, but not customer durability or concentration comfort.
            claimRefs:
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Repeated named accounts clear the referenceability threshold
            body: >-
              The public record is stronger than a logo wall: the same defense and industrial accounts recur across
              independent, investor, partner, and company-linked sources, which supports the claim that Code Metal has
              real customer traction in mission-critical environments.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU008
          - type: callout
            title: Public proof still stops short of durability
            body: >-
              No retained source discloses customer count, retention, contract duration, or revenue concentration, and
              the adverse coverage argues that pilots are not the same as scaled production. That keeps concentration
              and renewal risk open.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              The core underwriting tension is unusually sharp: Code Metal targets environments where a translation
              defect can cause certification, security, recall, or mission consequences, yet the public evidence does
              not expose workload-level proof rates or independent audit results. The next tier of risk is
              concentration. An $80 million OTA, a WarMatrix relationship with the U.S. Air Force, and named defense or
              industrial customers are substantial demand signals, but they also tie delivery proof to long-cycle
              programs and a relatively narrow disclosed customer set. Financing and pricing disclosures add a third
              risk layer because the available Form D and custom-pricing references do not reveal burn, margins, renewal
              economics, or cash runway.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR010
              - CR011
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and procurement exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned sources establish the importance of compliance but not Code Metal's legal or certification
              status. Company material says customers operate under strict correctness requirements, while a syndicated
              company announcement says WarMatrix will modernize long-trusted modeling systems under an OTA. Those
              claims make acceptance testing, accreditation, export controls, data rights, and proof-boundary
              disclosures central to diligence. None of the retained sources is a regulator, court, certification body,
              or independent auditor, so the evidence cannot support a claim that there have been no legal, regulatory,
              security, or reliability incidents. The correct residual assessment is therefore unresolved rather than
              clean.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR013
              - CR015
      - number: '7.3'
        title: Operational proof, assurance scope, and scaling
        blocks:
          - type: paragraph
            body: >-
              Code Metal's own description is more qualified than a blanket guarantee: it says formal verification is
              used whenever possible, with differential testing, property-based testing, type analysis, compatibility
              analysis, and static analysis elsewhere in the pipeline. It also says proof attempts generated by AI may
              be wrong and that a small trusted kernel is the authority, while separately claiming the process is fully
              automatic. Those design choices are credible mitigations, but they create diligence questions about
              fallback frequency, checker coverage, proof time, manual exception handling, and acceptance on
              representative customer code. A company research index reports a separate translation benchmark with 69%
              compilation success and 33% functional correctness; that is useful domain context, not a disclosed Code
              Metal product-performance result.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR012
      - number: '7.4'
        title: Dependencies, financial model, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to four dependencies: government procurement, a small named customer set,
              specialized hardware ecosystems, and enterprise deal execution. TBPN describes code portability as a
              response to an Army Nvidia supply constraint and characterizes the president and COO hire as a move from
              engineering-led selling toward enterprise go-to-market. Growth Engineer reports custom pricing without
              public tiers, while TinyTechFund reproduces a March 2026 Form D line showing $123 million sold of $125
              million offered. None of those facts establishes recurring revenue quality or cash availability. The
              thesis should break if an independent workload audit cannot reproduce equivalence, material OTA milestones
              slip, non-defense references do not expand, or financial diligence shows services-heavy economics without
              adequate runway.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR010
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Primary kill criterion: independent proof does not reproduce'
            body: >-
              Stop underwriting if a representative customer workload cannot reproduce behavioral equivalence under
              agreed proof obligations, or if unsupported cases silently fall back to weaker testing without clear
              customer acceptance.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: callout
            title: Treat legal and incident status as unresolved
            body: >-
              The assigned evidence contains no regulator, court, certifier, or independent incident source. Obtain
              primary records and customer audit materials rather than converting that evidence gap into a clean-history
              claim.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports a price-sensitive research-more posture rather than a fresh buy call. Code
              Metal has credible positives: a verification-first product claim rooted in formal methods, named defense
              and industrial customers, and a valuation step-up from $250 million in November 2025 to $1.25 billion in
              February 2026. Those points show real demand and venture conviction, but they do not by themselves prove
              that today's entry price is underwritten. Forge still characterizes market activity as limited, and the
              most skeptical independent coverage says the open question is whether the company can scale verification
              from pilots into large legacy codebases while the company still has not publicly verified profitability
              with audited financials or disclosed core SaaS-style operating metrics.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public financing context is useful for framing discipline, but it still falls short of validating the
              headline valuation. The company disclosed a $125 million Series B at $1.25 billion only months after a
              $36.5 million Series A at $250 million, and Forge shows the last round with 1.0x non-participating
              preferred terms instead of an obviously aggressive preference stack. That reduces one source of downside
              overhang, yet the same public package leaves material blind spots around ARR, gross margin, burn, cash
              runway, customer concentration, and whether the eight-figure revenue signal from late 2025 translated into
              durable economics through 2026. Exit readiness is also not underwritten by the public record because
              limited market activity is a thin external mark for a company now carrying a unicorn price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenarios, diligence asks, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The key underwriting question is not whether verified translation matters; it is whether Code Metal can
              convert technical credibility and early contracts into repeatable program-of-record economics before its
              valuation outruns proof. Upside exists if named customers expand into broader production deployments, if
              the company can substantiate current profitability or strong unit economics, and if its formal-methods
              moat remains meaningfully differentiated as demand for code portability and modernization grows. Downside
              remains meaningful because independent evidence still flags scale risk on hard legacy codebases, while
              public disclosures do not yet resolve comparable-set math, contract durability, or the operating metrics
              needed to triangulate return potential. The next diligence dollar should therefore go into contract-level
              proof, customer concentration, cohort behavior, and full round documents rather than into a valuation
              debate built on headline momentum alone.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public conclusion at the disclosed price
            body: >-
              Keep Code Metal in active diligence, but treat the disclosed Series B price as expensive until private
              evidence closes the KPI and contract-proof gaps.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
          - type: callout
            title: The valuation debate is really a disclosure debate
            body: >-
              Public terms are acceptable, but the unresolved issue is that the valuation jumped much faster than the
              public record on revenue quality, margins, and repeatable deployment economics.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
              - CV014
          - type: callout
            title: What would move the stance upward
            body: >-
              Audited or otherwise reliable proof of profitability, durable customer expansion, and round-document
              clarity could turn the same company quality into a more investable entry.
            calloutType: assumption
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
