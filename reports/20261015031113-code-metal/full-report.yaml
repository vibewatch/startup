  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape is broad, not one-for-one
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a narrow one-for-one rival set. The same modernization job can be
              attacked through manual internal rewrites, generic LLM coding assistants, static-analysis or code-review
              products that reduce bug risk without doing translation, domain-specific compilers for narrower targets,
              and a newer cohort of AI-code validation vendors. That breadth matters because Code Metal is not competing
              for generic developer-seat spend first; it is competing for budgets tied to legacy migration, hardware
              portability, and regulated deployment in accounts like defense primes and industrial OEMs. The practical
              peer set is therefore a landscape of substitute workflows plus adjacent infrastructure vendors, not a
              single incumbent category.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP015
