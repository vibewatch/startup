        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is specific, not generic AI-copilot rhetoric
            body: >-
              Across official research, the product page, and external profiles, Code Metal consistently differentiates
              on verification, hardware portability, and mission-critical deployment rather than on generalized coding
              assistance.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE013
          - type: callout
