      - number: '2.2'
        title: 规模测算视角、买方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几种受限的规模测算视角，但没有干净的公开 TAM/SAM/SOM。最强的可量化信号来自国防切入点已有的预算：Fortune 和 TechTimes 报道，先有 $17 million 的初始
              operating capability 奖项，随后 WarMatrix 获得 $80 million OTA；Forge 记录的 $1.25 billion 投后 B
              轮估值，则说明投资人愿意为这一品类付费，却不能证明终端市场规模。除国防外，公司和合作伙伴资料反复提到航空航天、半导体、汽车及电信式的可移植性问题，说明可触达的工作流更广。买方通常是工程或项目负责人，使用者是工程或仿真团队，付款预算则来自项目、产品或现代化预算，而不是按席位计费的开发工具科目。因此采用路径更像企业化、项目化路径：先在高后果工作流中证明翻译可靠性，再扩展到相邻代码库、硬件目标或服务。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM011
