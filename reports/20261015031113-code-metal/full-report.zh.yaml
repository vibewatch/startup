              - CP016
          - type: callout
            title: 公开可比性仍然很弱
            body: 外部最强的质疑不是某个点名的直接竞争者，而是缺少透明定价、输赢证明，以及能够证明这些方法在规模化时仍有效的长期证据。
            calloutType: risk
            claimRefs:
              - CP009
              - CP014
          - type: callout
            title: 分销与算法同样重要
            body: Ryan Aytay 的任命和 SPT 收购表明，公司正用 go-to-market 触达和相邻工作流扩张来加宽护城河，赶在竞争者形成相似技术主张之前扩大优势。
            calloutType: insight
            claimRefs:
