chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              Code Metal 将自己定位为面向关键任务软件的可验证代码翻译平台，而非通用代码
              Copilot。官网把产品概括为“面向每一行代码都重要的行业的可验证代码翻译”；第三方资料也持续将公司放在国防、航空航天、汽车、半导体和机器人工作流中。在这些场景里，代码移植、合规和针对硬件的优化，比原型开发速度更重要。Forge
              的资料确认了基本信息：公司成立于 2023 年，总部在波士顿，由 Peter Morales 和 Alex Showalter-Bucher 创办。由此看，后续市场和产品分析应理解为：Code Metal
              在边缘计算及国防相邻场景销售信任、可移植性和现代化能力，而不是消费级开发工具的规模。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
