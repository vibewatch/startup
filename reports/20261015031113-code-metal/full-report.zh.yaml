      - number: '2.3'
        title: 增长驱动、约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              保留资料明确指出了主要采用驱动：受监管或关键任务团队需要代码可移植性、内存安全、合规和行为保持，却不能在没有额外保证的情况下信任通用 AI 生成代码。Code Metal
              的国防牵引力也显示出时机因素：当产品保留已验证的旧资产而不是替换它们时，OTA 和现代化项目可以为采用提供资金。同一批证据也解释了市场为何不会自动扩张。TechTimes
              将形式验证代码翻译与分析输出被幻觉污染的独立风险区分开来；Fortune 则指出当前收入结构仍约有 75%
              来自国防。结果是一个可信的滩头阵地，但还不是已充分验证的跨垂直市场。公开尽调仍缺少客户数量、定价、各垂直领域预算归属，以及有来源支撑的拆分，无法说明国防项目和少数已点名工业客户之外，市场究竟有多大比例真正可触达。
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 已验证翻译是预算类别，不只是编码功能
            body: 最强证据把需求与现代化压力下保留已验证系统联系起来，因此 Code Metal 更接近高保证基础设施预算，而不是普通开发者席位定价。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM011
          - type: callout
            title: 市场广度仍比量化容易
            body: 公开资料支持多个相邻垂直领域，但保留证据仍没有达到有来源支撑的 TAM、买方预算拆分或跨垂直收入结构，因此本章还不能很有把握地把产品契合度转换成估值上行空间。
            calloutType: risk
            claimRefs:
              - CM004
              - CM008
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图宽广，并非一对一竞争
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持一个狭窄的一对一竞争者名单。同一项现代化任务，可以通过内部手工重写、通用 LLM 编程助手、降低 bug 风险但不负责翻译的静态分析或代码审查产品、面向更窄目标的专用编译器，以及新一代 AI
              代码验证厂商来完成。这一广度很重要，因为 Code Metal 首先争夺的不是通用开发者席位预算，而是国防主承包商和工业 OEM
              等客户中与旧系统迁移、硬件可移植性和受监管部署有关的预算。因此，实际同业集合是替代工作流加相邻基础设施厂商，而不是一个单一的既有品类。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP015
