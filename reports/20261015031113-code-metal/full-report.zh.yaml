  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 定制合同，而非透明 SaaS 价目表
        blocks:
          - type: paragraph
            body: >-
              目前最有支持的变现模式是谈判式企业和政府项目，而不是标准化的公开 SaaS 计划。独立报道说，Code Metal 围绕开发一个 kernel
              所需时间、翻译代码行数或为客户节省的开发时间来谈价；一家软件目录则另行描述了按用户和硬件支持计费的订阅式企业定价。这些描述可能对应不同的合作类型，但都没有披露实际价格、折扣、最低承诺、续约条款或收入确认政策。公司发布的
              WarMatrix 公告增加了一个具体的 $80 million
              合同金额，却没有说明履约期间、已拨款金额与上限金额的区别、里程碑时间表或已确认收入。由此形成的桥梁是：项目范围、已验证交付物、客户验收，再到合同收入；毛利无法推算。
