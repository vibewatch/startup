        - 已具名的国防和工业客户扩展为正式项目，形式化验证继续保持差异化，且盈利能力或强劲利润率得到证实。
        - 若增长和现金创造能力都得到证明，高于已披露 $1.25B 的估值可能站得住脚。
        - 这需要合同扩张证据、经审计的盈利能力支撑，以及多个客户的重复部署。
        - 无法将旗舰客户转化为更广泛的生产收入。
      - - 基准
        - 技术护城河真实存在，采用仍在继续，但披露依旧不完整，客户扩张速度慢于估值所隐含的速度。
        - 当前 $1.25B 价格难以据此评估，因此回报取决于更好的条款或更强的 KPI 证明。
        - 最符合当前公开记录：势头强劲，但信息缺口显著。
        - 在 KPI 深度改善前，以相近或更低价格进行后续融资。
      - - 悲观
        - 试点停滞，形式化验证在遗留代码库上难以规模化，或客户集中度和客户经济性令人失望。
        - 下轮融资或显著更低的公允价值变得合理，因为公开论据更多建立在叙事上，而非经验证的运营杠杆。
        - 独立报道已经指出规模化风险和未经审计的盈利能力说法。
        - 项目延误、续约失败、利润率疲弱，或未来融资中的不利条款变化。
    notes: 由于 ARR、毛利率、留存率和可比公司组计算均未公开披露，公开证据只能支持围绕已披露 $1.25B 估值的定性区间。
