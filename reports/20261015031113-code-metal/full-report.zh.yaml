      - number: '4.3'
        title: 验证深度可能使交付经济性取决于合作类型
        blocks:
          - type: paragraph
            body: >-
              Code Metal
              描述了一条交付流水线：分析源程序、翻译程序、运行差分测试和基于属性的测试，执行静态与兼容性分析，在可能时进行形式验证，并针对目标硬件优化。这套流程说明，客户验收输出前需要投入可观的研究、工程、算力和保证成本。官方研究页面还显示，研究组织正在扩大，列出了
              11 篇论文和文章，并向最多 4 名获奖者各发放 $10,000 至 $40,000
              的大学奖项。但这些投入都不能推出毛利率估算，因为公开资料没有披露人力分配、模型和算力成本、实施投入、支持负担、分包商或收入结构。因此
              CAC、回本周期、利用率、销售周期和贡献利润率仍是尽调输入，而不是可由公开信息建模的指标。
