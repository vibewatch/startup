      - number: '3.2'
        title: 权衡集中在保证程度与覆盖范围
        blocks:
          - type: paragraph
            body: >-
              最清晰的差异化主张是保证程度。官方和投资人资料反复把 Code Metal 描述为把 AI 生成与测试、分析、形式验证配在一起的系统；外部评测则把 Cursor/Claude 类工具描述为速度快但未经验证，把
              Sonar/Semgrep
              类工具描述为以分析为先而非以翻译为先。更重要的竞争比较，不是竞争者能否输出代码，而是能否把大型旧代码库跨语言、跨硬件迁移，同时不破坏合规或行为。专用编译器和内部团队有时能交付更窄的类似结果，但保留资料认为它们受目标范围或工程时间限制。
