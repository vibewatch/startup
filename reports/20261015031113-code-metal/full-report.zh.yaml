        title: 展示
        blocks:
          - type: callout
            title: 信任层，而不只是代码生成
            body: 保留资料中最站得住的差异化是：Code Metal 向受监管系统销售已验证的可移植性，而不是通用开发者生产率。
            calloutType: strength
            claimRefs:
              - CP001
