        blocks:
          - type: paragraph
            body: >-
              公开领导层仍由创始人主导，但已不再只有创始人。Growth Engineer 将 Morales 描述为 MIT Lincoln Laboratory 和 BAE Systems
              的资深人士，专注国防机器学习部署；Alex Showalter-Bucher 则带来 MIT Lincoln Lab 的自动化与机器人背景。Forge 和 Growth Engineer 还显示，前
              Tableau CEO Ryan Aytay 于 2026 年 2 月加入担任总裁兼 COO，说明 Code Metal 正准备扩大企业销售和运营规模。AI Market Watch 另将 Laura Shen
              列为公开的增长负责人。正式董事会构成、控制权和融资治理仍很模糊：现有证据列出了投资人和高管，却没有完整董事名单或优先证券条款。
