  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              保留的资料把 Code Metal 放在一个明确任务上：为那些 bug、硬件不匹配或认证失败会带来运营或监管成本的环境，翻译、验证并优化现有代码。这比宽泛的 AI 编程助手市场窄得多。Code Metal
              的研究和 About 页面持续描述跨语言、架构及硬件目标的翻译，并强调行为保持证明；B Capital 和 Forge
              则将公司归入国防、航空航天、汽车、机器人和半导体等关键任务垂直领域。实际替代方案不只是另一个代码模型，也包括手工现代化、内部编译器和工具链开发、保留旧代码，以及维持已验证行为的系统集成项目。这一边界对估值很重要：客户愿意付多少钱，较少取决于开发者生产率，更多取决于客户能否缩短现代化周期，同时不重新引入安全、合规或任务风险。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM009
