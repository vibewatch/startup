      - number: '3.3'
        title: 耐久性取决于企业触达，但商业包装证据薄弱
        blocks:
          - type: paragraph
            body: >-
              公开记录的弱点在于商业可比性。WIRED 报道 Code Metal 按节省时间或翻译工作单元，逐笔为交易定价；GrowthEngineer
              称公开价格档位未披露。这种不透明使替代方案之间的采购摩擦难以比较，尤其是内部重写由工程人力支付，而通用编码工具可以由底层团队自下而上采用。Code Metal 正通过 Ryan Aytay
              的任命扩大企业分销，并通过收购 Signal Processing Technologies 拓展相邻工作流，以抵消这一劣势。即便如此，最强的反向证据仍是：这一品类的方法论还在验证，长期耐久性尚未得到独立确认。
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
