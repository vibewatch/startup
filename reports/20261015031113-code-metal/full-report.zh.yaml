            body: >-
              三个保留来源报告，2026 年 2 月公司以 $1.25 billion 估值完成 $125 million B
              轮。该融资是已募集资本，不是当前可用现金的证据：公开记录没有披露交割机制、老股成分、债务、交割时现金、后续支出、烧钱或受限资金。若能确认公司所报告的盈利和正现金流，跑道评估会明显改善，但保留证据中的这一说法未经审计。因此，财务判断应把收入质量视为有希望但未验证，把利润率路径视为取决于合作类型，并把专业人力和验证工作带来的资本强度视为可能偏高。下一轮尽调应把已签积压订单与已确认收入对账，展示客户层面的毛利率和集中度，并提供按月现金、烧钱和营运资金计划。
