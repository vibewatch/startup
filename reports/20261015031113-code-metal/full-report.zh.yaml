        title: 牵引力、里程碑与关键执行风险
        blocks:
          - type: paragraph
            body: >-
              公开牵引力叙事足以引起重视，但还不足以只凭 headline 增长来做投资判断。Code Metal 的 A 轮公告称，公司已部署到国防、汽车和半导体终端市场，并且“今年已经签约交付八位数收入”；B
              Capital 随后点名 U.S. Air Force、L3Harris、Toshiba 和 RTX 为客户。AI Market Watch 和 Welcome AI 又补充了 Tradewinds 认可及
              $80 million WarMatrix OTA 奖项等后续里程碑。Implicator
              提供了最尖锐的反向证据：市场可能在公开证据尚未证明可扩展到百万行、缺少文档的国防代码库之前，就已经把验证翻译的价值计入判断。这种张力构成了本章结论：融资和客户信号很强，但经审计的收入质量、客户集中度和生产规模证明仍披露不足。
