        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录支持谨慎、继续研究的姿态，而不是新建买入判断。Code Metal 的正面因素可信：扎根于形式化方法的验证优先产品主张、已点名的国防和工业客户，以及从 2025 年 11 月 $250 million 到
              2026 年 2 月 $1.25 billion 的估值跃升。这些因素说明真实需求和创投信心，但本身不能证明今日的入场价格已经有依据。Forge
              仍将市场活动描述为有限；最怀疑的独立报道则称，未决问题是公司能否把验证从试点扩展到大型旧代码库，而公司仍未以经审计财务或核心 SaaS 式运营指标公开验证盈利能力。
            claimRefs:
              - CV001
              - CV002
              - CV007
