      - number: '4.2'
        title: 大额合同牵引力可见，但收入质量不可见
        blocks:
          - type: paragraph
            body: >-
              WarMatrix OTA 是当前最强的商业信号，因为它为政府客户的工作附上了披露的金额。B Capital 也将 U.S. Air Force、L3Harris、Toshiba 和 RTX
              列为客户，这更符合集中式企业和国防销售，而非高频自助式分销。另有报道说，公司此前已有八位数收入，如今声称盈利且现金流为正，但同样指出具体收入数字和经审计财务报表不可得。这些信号证明商业需求，却不证明经常性收入质量：积压订单、已拨款金额、合同期限、续约行为、客户集中度，以及许可、工程服务和里程碑付款之间的拆分仍然缺失。
