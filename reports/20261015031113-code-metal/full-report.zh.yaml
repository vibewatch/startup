      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资背景有助于建立纪律，但仍不足以验证 headline 估值。公司在 $36.5 million、$250 million 估值的 A 轮仅数月后，就披露了 $125 million、$1.25
              billion 的 B 轮；Forge 还显示，最近一轮采用 1.0x non-participating 优先股条款，而不是明显激进的优先股堆叠。这减少了一项下行悬置因素，但同一公开材料仍留下
              ARR、毛利率、烧钱、现金跑道、客户集中度等重大盲点，也没有说明 2025 年末的八位数收入信号是否在 2026
              年转化为持久经济性。公开记录也不足以判断退出准备度：公司如今背负独角兽价格，有限的市场活动只是很薄的外部标记。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
