      - number: '1.3'
        title: 融资历史与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              公司成立于 2023 年，却已释放出异常强的公开融资信号。AI Market Watch 记录了 2023 年 12 月 $3.45 million 的 pre-seed 和 2024 年 7 月 $13
              million 的 seed；Code Metal 自己的 A 轮公告称 Accel 领投 $36.5 million 轮，估值 $250 million；Forge 则列出 2026 年 2 月、投后估值
              $1.25 billion 的 B 轮，投资人包括 Salesforce Ventures、Accel、B Capital、J2 Ventures、Overmatch、RTX Ventures、Shield
              Capital 和 Smith Point Capital。按这些公开轮次推算，披露融资约 $177.95 million，但公开信息仍停留在 headline 规模：清算优先权、老股转让、债务工具和完整 cap
              table 逻辑，在本次证据池中都没有披露。因此，利益相关方画像在知名投资人和早期灯塔客户这两块最完整；治理结构和集中度信息则明显不足。
            claimRefs:
