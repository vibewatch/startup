              - CV014
      - number: '8.3'
        title: 情景、尽调要求与论点击穿点
        blocks:
          - type: paragraph
            body: >-
              关键投资判断不是已验证翻译是否重要，而是 Code Metal
              能否在估值跑在证明之前，把技术可信度和早期合同转化为可重复的正式项目经济性。如果已点名客户扩展到更广的生产部署，公司能证明当前盈利或强劲单位经济性，且形式化方法护城河在代码可移植和现代化需求增长时仍明显差异化，上行空间就存在。下行仍然显著，因为独立证据继续指出困难旧代码库的规模化风险，而公开披露尚未解决可比集合计算、合同耐久性或用于三角验证回报潜力的运营指标。下一笔尽调预算应投向合同层面证明、客户集中度、客户群行为和完整轮次文件，而不是只凭
              headline 动能争论估值。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 已披露价格下的公开结论
            body: 继续对 Code Metal 做主动尽调，但在私人证据补上 KPI 和合同证明缺口前，应把已披露的 B 轮价格视为昂贵。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
          - type: callout
            title: 估值争论其实是披露争论
            body: 公开条款可以接受，但未解决的问题是：估值增长远快于公开记录对收入质量、利润率和可重复部署经济性的证明。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
              - CV014
          - type: callout
            title: 哪些证据会让立场上调
            body: 经审计或其他可靠的盈利证明、持久的客户扩张和清晰的轮次文件，可能让同样的公司质量变成更值得投资的入场机会。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
