    summary: 公开证据支持一条范围明确的企业交付链，但不支持数字化转化率、时间安排或毛利率百分比。
    data:
      nodes:
        - id: customer-problem
          label: 任务关键型现代化需求
          detail: 客户识别出代码翻译或可移植性工作。
        - id: negotiated-scope
          label: 协商范围与定价基础
          detail: 内核时间或代码行数可能影响价格。
        - id: translation
          label: AI 辅助翻译
          detail: 分析并翻译源程序。
        - id: assurance
          label: 测试与验证
          detail: 保障工作支持验收。
        - id: delivery
          label: 客户交付物
          detail: 交付经过验证的现代化成果。
        - id: acceptance
          label: 里程碑或客户验收
          detail: 公开条款没有披露验收机制。
        - id: revenue
          label: 合同收入
          detail: 合同价值可能在未披露期间内转化为收入。
        - id: gross-profit
          label: 毛利
          detail: 交付成本和由此产生的利润率仍未知。
      edges:
        - from: customer-problem
          to: negotiated-scope
        - from: negotiated-scope
          to: translation
        - from: translation
          to: assurance
        - from: assurance
          to: delivery
        - from: delivery
          to: acceptance
        - from: acceptance
          to: revenue
        - from: revenue
          to: gross-profit
    approximationNotes: 仅为概念性顺序；没有根据现有来源推断转化率、确认时间表或利润率数值。
    claimRefs:
      - CI004
      - CI010
      - CI011
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开材料描述了从源代码和运行时约束，经翻译、保障到目标部署输出的六层流程。
    data:
      layers:
        - label: 源意图与参考代码
          detail: 起点是高级代码或遗留代码，加上期望的现代化或可移植性结果。
          modules:
            - label: 输入
              value: Python, MATLAB, Julia, legacy systems
            - label: 目标
              value: Portability, modernization, compliance-sensitive deployment
        - label: 运行时与硬件定义
          detail: 用户在翻译开始前声明边缘环境。
          modules:
            - label: 目标
              value: CPUs, GPUs, FPGAs
            - label: 上下文
              value: RAM, VRAM, cores, LEs, preferred toolchains
        - label: 翻译规划
          detail: 平台构建转译和部署计划，而不是输出未经区分的代码。
          modules:
            - label: 规划输出
              value: Dependency tracking, segmentation, target-language plan
        - label: AI 生成与优化
          detail: 代码生成面向目标架构和边缘约束。
          outputs:
            - label: Target outputs
              value: Embedded C/C++, Rust, VHDL, Verilog, CUDA, HIP, ONNX
        - label: 验证与核验
          detail: 测试和面向证明的检查贯穿整个流水线，而不是只在末尾执行。
          modules:
            - label: 检查
              value: Differential testing, property-based testing, static analysis, formal verification
        - label: 部署与买方保障
          detail: 产品承诺是为任务关键型环境提供可直接生产的代码，但公开运营遥测仍很少。
          outputs:
            - label: Assurance promise
              value: Tested, optimized, compliant code
            - label: Open diligence
              value: Status telemetry, release cadence, certification evidence
    approximationNotes: 这套架构根据公开产品和研究描述综合而成，是便于读者理解的辅助图，不是逆向还原的内部架构图。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE013
  - id: FU001
    title: 从现代化切入口到扩张证明的客户旅程
    type: journey-map
    summary: 公开证据显示，Code Metal 从紧迫的遗留代码问题切入，寻求经验证的生产证明，随后尝试扩展到更广泛的可移植性和硬件项目。
    data:
      items:
        - label: 遗留代码痛点变得紧迫
          tone: warning
          detail: 任务关键型团队面对老旧代码、稀缺专业能力和零错误要求。
          touchpoints:
            - 国防和受监管行业的紧迫需求
            - 正确性和合规性是购买触发因素
        - label: 初始范围明确的现代化项目
          tone: neutral
          detail: 客户从一个边界清晰的翻译或可移植性项目开始。
          touchpoints:
            - 从遗留 C# 到 C++ 的现代化
            - 硬件重定向与代码可移植性
        - label: 经验证的部署主张
          tone: positive
          detail: 公开证明从概念转向运营或生产使用主张。
          touchpoints:
            - 具名客户包括美国空军和 L3Harris
            - 声称已用于生产，但通常没有分母
        - label: 结果证据建立信任
          tone: positive
          detail: 案例研究聚焦速度、正确性和任务准备度结果。
          touchpoints:
            - 两周完成现代化的案例
            - L3Harris 将数周缩短为数天的翻译主张
        - label: 扩展至相邻行业
          tone: opportunity
          detail: 同一切入口被推向半导体、汽车、电信和工业客户。
          touchpoints:
            - 芯片和设备之间的可移植性
            - 国防以外的受监管企业环境
        - label: 续约和集中度仍需证明
          tone: risk
          detail: 公开证据尚未显示留存率、合同期限或客户结构的持久性。
          touchpoints:
            - 未公开披露 GRR、NRR 或客户数量
            - 转化为正式项目仍是硬考验
    approximationNotes: null
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 分析评级优先关注保障范围、政府客户集中度、合规证据和运营披露。
    data:
      columns:
        - label: 可能性
          detail: 根据指定公开证据作出的评估，不是实测概率。
        - label: 影响
          detail: 对交付、客户信任、融资或投资论点的潜在影响。
        - label: 缓解措施成熟度
          detail: 保留证据中可见具体缓解措施的程度。
        - label: 剩余暴露
          detail: 可见缓解措施实施后仍剩余的暴露。
      rows:
        - label: 保障范围不匹配
          note: 形式化验证被描述为有条件的，而非普遍适用。
          values:
            - label: 中
              tone: medium
            - label: 严重
              tone: critical
            - label: 中
              tone: medium
              detail: 描述了分层检查和可信内核。
            - label: 高
              tone: high
        - label: 政府客户集中度
          note: WarMatrix 和已披露的 OTA 占据当前合同证据的主要部分。
          values:
            - label: 中
              tone: medium
            - label: 严重
              tone: critical
            - label: 中
              tone: medium
              detail: 现有空军合作提供了运营基础。
            - label: 高
              tone: high
        - label: 认证证据缺口
          note: 没有保留监管机构、认证机构或独立审计师的证据。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: high
            - label: 低
              tone: low
              detail: 公开缓解措施是技术叙事，而非认证证据。
            - label: 高
              tone: high
        - label: 企业规模化
          note: 上市销售转型时间尚短，运营指标未披露。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 早期
              tone: neutral
              detail: 经验丰富的领导层是缓解因素，但不是可重复性的证明。
            - label: 中高
              tone: high
        - label: 客户集中度
          note: 少量具名客户名单偏向与国防相关的组织。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
              detail: 未公开客户集中度百分比或续约数据。
            - label: 高
              tone: high
        - label: 财务模型不透明
          note: 已售融资不等于现金可用性、经常性收入、利润率或现金跑道。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 低
              tone: low
              detail: 定制化定价和 Form D 数据没有揭示单位经济性。
            - label: 高
              tone: high
    approximationNotes: 序数标签是根据引用证据作出的分析判断，不代表任何数值概率。
    claimRefs:
      - CR001
      - CR005
      - CR008
      - CR010
      - CR011
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开逻辑链指向继续尽调，而不是按已披露 Series B 价格直接作出投资判断。
    data:
      nodes:
        - id: moat
          label: 经验证的翻译护城河
          note: 形式化验证主张和 2025-2026 年研究产出支撑技术差异化。
        - id: traction
          label: 具名客户进展
          note: 空军、L3Harris、Toshiba 和 RTX 的引用显示其在任务关键型市场中的相关性。
        - id: rerating
          label: 估值快速重估
          note: 公开融资估值从 2025 年 11 月的 $250M 上升至 2026 年 2 月的 $1.25B。
        - id: terms
          label: 条款不算有毒，但不完整
          note: Forge 显示为 1.0x 非参与型优先股，但完整融资经济性并未公开。
        - id: risk
          label: 规模化与披露风险
          note: 独立报道称盈利能力未经审计，大规模遗留代码证明仍是悬而未决的问题。
        - id: call
          label: 继续研究 / 昂贵
          note: 在据当前价格作出投资判断前，要求合同层面的证明、KPI 披露和更完整的融资细节。
      edges:
        - from: moat
          to: traction
          label: 技术故事触达目标买家
        - from: traction
          to: rerating
          label: 客户证明有助于解释风投需求
        - from: rerating
          to: terms
          label: 公开条款缓和但没有解决下行风险
        - from: terms
          to: risk
          label: KPI 深度不足仍主导价格支撑
        - from: risk
          to: call
          label: 证明未解决使建议保持谨慎
    approximationNotes: 这是逻辑顺序，不是加权评分模型，也不是推断出的概率树。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
