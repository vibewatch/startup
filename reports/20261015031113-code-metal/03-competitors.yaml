      - ["Validation/testing startup cohort (Antithesis, Code Rabbit, Synthesized, Theorem, Harness)", adjacent, "WIRED says the cohort secured millions in backing", "Teams buying tooling around AI-generated code quality", "Validation, testing, securing, and automation around AI-generated code", "Retained evidence does not show verified cross-language translation as the core offer"]
      - ["Cursor / Claude Code class", substitute, "No scale detail in retained evidence", "General software teams and individual developers", "Fast new-code generation and coding assistance", "GrowthEngineer says these tools do not provide formal verification guarantees for regulated deployment"]
      - ["Sonar / Semgrep class", incumbent-adjacent, "Established analysis tools; no funding detail in retained evidence", "Code review, AppSec, and software quality teams", "Static analysis and code scanning", "Retained evidence frames them as analysis-first rather than translation-first"]
      - ["Domain-specific compilers", adjacent, "No consolidated vendor scale in retained evidence", "Teams tied to a specific hardware or language pair", "Optimized for narrower target environments", "GrowthEngineer describes them as limited to specific hardware or language pairs"]
      - ["Manual / internal rewrite", "status quo / internal build", "Internal engineering labor rather than vendor funding", "Incumbents modernizing legacy systems", "Maximum internal control and bespoke workflows", "GrowthEngineer says delivery takes months and carries higher error and compliance risk"]
    notes: >-
      Rows group competitor classes from the assigned pool; unknown scale or
      funding fields reflect what the retained public sources do not disclose.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP015]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Code Metal
      - Manual / internal
      - Cursor / Claude Code class
      - Sonar / Semgrep class
      - Domain-specific compilers
    rows:
      - ["Cross-language translation", "Yes; public sources cite Python, Julia, MATLAB, C++, Rust, VHDL, CUDA, and related targets", "Yes, but via internal engineering effort", "Possible code generation help; translation guarantees not evidenced", "No translation focus in retained evidence", "Yes, but usually for narrower language or hardware pairs"]
      - ["Formal verification / proof of equivalence", "Claimed as core differentiator", "Human review and testing only in retained evidence", "GrowthEngineer says verification guarantees are absent", "Not evidenced in retained sources", "Not evidenced in retained sources"]
      - ["Hardware portability across chips or devices", "Core pitch across GPUs, FPGAs, edge devices, and specialized hardware", "Possible but slow", "Not evidenced in retained sources", "No", "Narrow target optimization rather than broad portability"]
      - ["Mission-critical / regulated deployment focus", "Core positioning", "Possible when buyers fund it internally", "GrowthEngineer frames these tools as fast but unverified for regulated work", "Analysis support only", "Can fit narrow domains, but not broad mission-critical translation in retained evidence"]
      - ["Public customer proof in defense or industrial accounts", "Yes; U.S. Air Force, RTX, L3Harris, and Toshiba recur", "Not applicable", "Not evidenced in retained sources", "Not evidenced in retained sources", "Not evidenced in retained sources"]
    notes: >-
      Cells marked "not evidenced" mean the assigned public pool did not supply
      supportable proof for that criterion, not that the capability is absent.
    claimRefs: [CP004, CP005, CP006, CP007, CP010, CP011, CP015, CP016]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Option
      - Price / unit / contract model
      - Included capabilities
      - Discounts or unknowns
      - Implication
    rows:
      - [Code Metal, "Negotiated individually; WIRED says deals can be based on kernel-development time, lines translated, or development time saved", "Translation, optimization, and verification for mission-critical code", "No public tier card; WIRED says value definition can get murky", "Consultative procurement is harder to benchmark but may fit large enterprise accounts"]
      - ["Manual / internal rewrite", "Internal labor and project spend", "Translation plus bespoke internal validation", "No vendor list price and no standardized contract model", "Works when the buyer can absorb time and staffing cost"]
      - ["Cursor / Claude Code class", "Public pricing not provided in the assigned pool", "General LLM coding assistance", "Assigned evidence does not provide verified price benchmarks or regulated-deployment terms", "Likely easier bottom-up adoption, but not comparable on proof or scope from retained evidence"]
      - ["Sonar / Semgrep class", "Public pricing not provided in the assigned pool", "Static analysis, review, and scanning", "Assigned evidence does not provide price or translation packaging", "Often looks more like a complement or narrower substitute than a direct replacement"]
      - ["Domain-specific compilers", "Pricing not disclosed in the assigned pool", "Targeted optimization for specific hardware or language pairs", "Commercial terms and breadth are not public in retained evidence", "Comparison hinges more on scope limits than on observable price cards"]
    notes: >-
      The assigned pool supports contract-logic observations, not normalized
      realized pricing; "unknown" means the cited public sources do not publish
      a clean benchmark.
    claimRefs: [CP008, CP009, CP012]
figures:
  - id: FP001
    title: Competitive positioning by assurance and portability breadth
    type: quadrant
    summary: >-
      The retained evidence places Code Metal closer to verified portability
      than adjacent coding tools, while most substitutes still compete on cost,
      existing workflow fit, or narrower technical scope.
    approximationNotes: >-
      Ordinal 1-5 coordinates reflect retained source descriptions of
      verification strength and portability breadth; they are comparative
      estimates, not measured market-share, quality, or performance values.
    data:
      xAxis:
        label: Deployment assurance / verification strength
        min: 1
        max: 5
        low: Statistical or manual checks only
        high: Formal or verified guarantees claimed
        description: Evidence-backed ordinal scale
        scale: ordinal
      yAxis:
        label: Breadth of portability problem addressed
        min: 1
        max: 5
        low: Narrow workflow slice
        high: Multi-language and multi-hardware portability
        description: Evidence-backed ordinal scale
        scale: ordinal
      points:
        - label: Code Metal
          x: 5
          y: 5
          note: Verified translation plus hardware portability are central to the pitch.
        - label: Manual / internal rewrite
          x: 4
          y: 2
          note: Assurance can be high, but breadth is constrained by staffing and cycle time.
        - label: Cursor / Claude Code class
          x: 1
          y: 3
          note: Fast code generation is the value, but retained evidence does not show verification guarantees.
        - label: Sonar / Semgrep class
          x: 2
          y: 1
          note: Analysis-first tools reduce bug risk but do not anchor translation scope in retained evidence.
        - label: Domain-specific compilers
          x: 3
          y: 2
          note: Technical depth can be meaningful, but retained evidence frames scope as narrower and target-specific.
        - label: Validation/testing startup cohort
          x: 2
          y: 2
          note: Adjacent vendors address AI-code quality, but retained evidence does not show verified translation as the main workflow.
    claimRefs: [CP002, CP003, CP006, CP007, CP010, CP011, CP014]
callouts:
  - calloutType: strength
    title: Trust layer, not just code generation
    body: >-
      The most defensible differentiation in the retained pool is that Code
      Metal sells verified portability for regulated systems, not generic
      developer productivity.
    claimRefs: [CP001, CP010, CP011, CP015, CP016]
  - calloutType: risk
    title: Public comparability is still weak
    body: >-
      The strongest external pushback is not a named direct rival, but the
      lack of transparent pricing, win/loss proof, and long-horizon evidence
      that the category's methods hold up at scale.
    claimRefs: [CP009, CP014]
  - calloutType: insight
    title: Distribution matters as much as algorithms
    body: >-
      The Ryan Aytay hire and the SPT acquisition suggest the company is using
      go-to-market reach and adjacent workflow expansion to widen the moat
      before competitors converge on similar technical claims.
    claimRefs: [CP012, CP013]
