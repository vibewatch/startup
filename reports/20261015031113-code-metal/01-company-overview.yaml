  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: public-kpis
      missingEvidence: Audited revenue, ARR, gross margin, burn, cash runway, headcount, customer count, and retention disclosures.
      whyItMatters: Public valuation and customer-name signals are not enough to judge durability, efficiency, or downside protection.
      diligencePath: Request a management KPI pack plus latest board deck and revenue bridge before underwriting growth assumptions.
      relatedQuestionRefs: [QO006]
    - type: missing-source
      severity: material
      topic: governance-control
      missingEvidence: Public board roster, control provisions, liquidation preferences, debt terms, and any secondary component of the financing rounds.
      whyItMatters: Governance and security terms can materially change how attractive a headline unicorn valuation really is to new investors.
      diligencePath: Obtain the cap table, major financing documents, and board composition history from management or counsel.
    - type: enumeration-incomplete
      severity: minor
      topic: stakeholder-map
      missingEvidence: Full cap table, customer concentration schedule, and contract-by-contract exposure beyond the named investors and lighthouse customers in TO003.
      whyItMatters: The public stakeholder map shows who matters qualitatively but not who drives control, concentration, or renewal risk quantitatively.
      diligencePath: Ask for ownership by investor, customer revenue mix, and contract duration data to convert TO003 from a partial map into a complete one.
      relatedQuestionRefs: [QO004, QO006]
      relatedTableRefs: [TO003]
