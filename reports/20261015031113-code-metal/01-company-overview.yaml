      - [B Capital, Series B investor and public advocate, Provides external commercial narrative and customer validation but is still economically aligned, Separate portfolio-marketing language from independently verified KPIs]
      - [U.S. Air Force / DoW, Public customer and OTA counterparty, Government adoption is a major validation signal and likely shapes roadmap and compliance demands, Verify program status deployment scope and recompete risk]
      - [L3Harris, Named lighthouse customer, Proof point for defense-prime adoption and migration use cases, Request contract value duration expansion path and dependency concentration]
      - [RTX, Named customer and venture investor via RTX Ventures, Unusually strong strategic overlap as both customer signal and capital provider, Confirm whether commercial terms remain arms-length and repeatable]
