callouts:
  - calloutType: "risk"
    title: "Primary kill criterion: independent proof does not reproduce"
    body: >-
      Stop underwriting if a representative customer workload cannot reproduce behavioral
      equivalence under agreed proof obligations, or if unsupported cases silently fall back to
      weaker testing without clear customer acceptance.
    claimRefs: ["CR001", "CR002", "CR003", "CR013"]
  - calloutType: "recommendation"
    title: "Treat legal and incident status as unresolved"
    body: >-
      The assigned evidence contains no regulator, court, certifier, or independent incident
      source. Obtain primary records and customer audit materials rather than converting that
      evidence gap into a clean-history claim.
    claimRefs: ["CR004", "CR015"]
