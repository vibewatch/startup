chapter:
  number: 7
  title: "Risks"
  summary: >-
    Code Metal's highest residual risks are the boundary between claimed formal assurance and
    workload-level proof, concentration around government and defense-linked deployments, and
    limited public operating disclosure. The assigned evidence shows meaningful technical and
    contract signals, but it does not independently establish certification status, incident
    history, customer concentration, unit economics, or repeatable proof performance at scale.
sections:
  - id: "ranked-risk-stack"
    title: "Severity-ranked risk stack"
    body: >-
      The core underwriting tension is unusually sharp: Code Metal targets environments where a
      translation defect can cause certification, security, recall, or mission consequences, yet
      the public evidence does not expose workload-level proof rates or independent audit results.
      The next tier of risk is concentration. An $80 million OTA, a WarMatrix relationship with
      the U.S. Air Force, and named defense or industrial customers are substantial demand signals,
      but they also tie delivery proof to long-cycle programs and a relatively narrow disclosed
      customer set. Financing and pricing disclosures add a third risk layer because the available
      Form D and custom-pricing references do not reveal burn, margins, renewal economics, or cash
      runway.
    claimRefs: ["CR004", "CR005", "CR007", "CR010", "CR011", "CR015", "CR016"]
    figureRefs: ["FR001"]
  - id: "legal-regulatory-exposure"
    title: "Legal, regulatory, and procurement exposure"
    body: >-
      The assigned sources establish the importance of compliance but not Code Metal's legal or
      certification status. Company material says customers operate under strict correctness
      requirements, while a syndicated company announcement says WarMatrix will modernize
      long-trusted modeling systems under an OTA. Those claims make acceptance testing,
      accreditation, export controls, data rights, and proof-boundary disclosures central to
      diligence. None of the retained sources is a regulator, court, certification body, or
      independent auditor, so the evidence cannot support a claim that there have been no legal,
      regulatory, security, or reliability incidents. The correct residual assessment is therefore
      unresolved rather than clean.
    claimRefs: ["CR004", "CR005", "CR006", "CR013", "CR015"]
    tableRefs: ["TR001"]
  - id: "operational-proof-and-scaling"
    title: "Operational proof, assurance scope, and scaling"
    body: >-
      Code Metal's own description is more qualified than a blanket guarantee: it says formal
      verification is used whenever possible, with differential testing, property-based testing,
      type analysis, compatibility analysis, and static analysis elsewhere in the pipeline. It
      also says proof attempts generated by AI may be wrong and that a small trusted kernel is the
      authority, while separately claiming the process is fully automatic. Those design choices
      are credible mitigations, but they create diligence questions about fallback frequency,
      checker coverage, proof time, manual exception handling, and acceptance on representative
      customer code. A company research index reports a separate translation benchmark with 69%
      compilation success and 33% functional correctness; that is useful domain context, not a
      disclosed Code Metal product-performance result.
    claimRefs: ["CR001", "CR002", "CR003", "CR009", "CR012"]
    tableRefs: ["TR002"]
  - id: "dependencies-financial-model-and-kill-criteria"
    title: "Dependencies, financial model, and thesis-break criteria"
    body: >-
      Public evidence points to four dependencies: government procurement, a small named customer
      set, specialized hardware ecosystems, and enterprise deal execution. TBPN describes code
      portability as a response to an Army Nvidia supply constraint and characterizes the
      president and COO hire as a move from engineering-led selling toward enterprise go-to-market.
      Growth Engineer reports custom pricing without public tiers, while TinyTechFund reproduces a
      March 2026 Form D line showing $123 million sold of $125 million offered. None of those facts
      establishes recurring revenue quality or cash availability. The thesis should break if an
      independent workload audit cannot reproduce equivalence, material OTA milestones slip,
      non-defense references do not expand, or financial diligence shows services-heavy economics
      without adequate runway.
    claimRefs: ["CR008", "CR009", "CR010", "CR011", "CR014", "CR016"]
    tableRefs: ["TR003"]
