evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-kpis
    missingEvidence: Audited revenue, ARR, gross margin, burn, cash runway, headcount, customer count, and retention disclosures.
    whyItMatters: Public valuation and customer-name signals are not enough to judge durability, efficiency, or downside protection.
    diligencePath: Request a management KPI pack plus latest board deck and revenue bridge before underwriting growth assumptions.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: governance-control
    missingEvidence: >-
      Public board roster, control provisions, liquidation preferences, debt terms, and any secondary component of the
      financing rounds.
    whyItMatters: >-
      Governance and security terms can materially change how attractive a headline unicorn valuation really is to new
      investors.
    diligencePath: Obtain the cap table, major financing documents, and board composition history from management or counsel.
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      Full cap table, customer concentration schedule, and contract-by-contract exposure beyond the named investors and
      lighthouse customers in TO003.
    whyItMatters: >-
      The public stakeholder map shows who matters qualitatively but not who drives control, concentration, or renewal
      risk quantitatively.
    diligencePath: >-
      Ask for ownership by investor, customer revenue mix, and contract duration data to convert TO003 from a partial
      map into a complete one.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Public or management-backed TAM, SAM, and SOM with explicit methodology for verified code translation and
      modernization.
    whyItMatters: >-
      Without a defensible market-size decomposition, valuation upside relies on narrative category expansion more than
      quantified demand.
    diligencePath: >-
      Request management's internal market model and any third-party category studies that isolate portability,
      modernization, and verification budgets.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Customer counts, revenue mix by vertical, pricing model, and named budget owners for defense versus commercial
      deployments.
    whyItMatters: >-
      Buyer concentration and pricing power determine whether today's defense wedge can compound into a broader software
      category.
    diligencePath: >-
      Ask for cohort-level customer mix, ACV ranges, contract duration, and the primary budget line funding each major
      use case.
    relatedQuestionRefs:
      - QM003
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Independent case studies quantifying deployment timelines, ROI, or failure rates outside the WarMatrix and
      named-defense context.
    whyItMatters: >-
      Multi-vertical adjacency is plausible, but repeatability remains unproven without third-party operating evidence
      from commercial or industrial accounts.
    diligencePath: >-
      Obtain customer references or procurement records in semiconductor, automotive, aerospace, or telecom deployments
      with measurable before-and-after outcomes.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmark
    missingEvidence: >-
      Realized contract values, contract minimums, discounting, and pilot-to-production conversion terms for recent
      customers.
    whyItMatters: >-
      Without realized commercial terms, public comparisons can show contract logic but not procurement friction or
      economic moat quality.
    diligencePath: >-
      Request anonymized SOWs, pricing exhibits, and conversion data from recent deployments in defense and industrial
      accounts.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss-and-switching
    missingEvidence: >-
      Public win/loss examples, renewal behavior, and migration stories that show what buyers displaced or kept
      alongside Code Metal.
    whyItMatters: >-
      Competitive durability depends on whether buyers replace manual and narrow toolchains or merely add Code Metal to
      a multi-tool workflow.
    diligencePath: >-
      Ask management for anonymized displacement case studies, renewal cohorts, and pipeline attribution by competitor
      class.
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized pricing, discounts, minimum commitments, acceptance terms, and revenue-recognition policies by engagement
      type.
    whyItMatters: >-
      These inputs determine whether large announced contracts translate into predictable revenue and attractive
      margins.
    diligencePath: Sample executed contracts and reconcile booked value, funded value, billings, and recognized revenue by month.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, delivery labor, compute cost, support burden, utilization, CAC, sales cycle, and payback by customer
      segment.
    whyItMatters: Bespoke verification work may produce strong contract values but uneven contribution margins and scalability.
    diligencePath: Obtain customer-level contribution-margin schedules and fully loaded acquisition-cost cohorts.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, working capital, debt, covenants, financing proceeds, secondary mix, and restricted
      uses.
    whyItMatters: Funding raised cannot establish cash available, runway, financing dependency, or the next-round trigger.
    diligencePath: Review bank statements, debt agreements, cap table closing documents, and a 24-month cash forecast.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue, ARR definition, backlog, funded backlog, contract duration, renewals, retention, and customer
      concentration.
    whyItMatters: These metrics separate durable recurring deployments from pilots, ceilings, and one-time engineering work.
    diligencePath: Reconcile audited statements to the contract ledger and produce GRR, NRR, backlog, and concentration schedules.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: profitability-claim
    missingEvidence: >-
      Audited support for profitability and positive cash flow, including capitalization policy and nonrecurring
      contract receipts.
    whyItMatters: The unaudited claim is central to both margin-path and runway judgments.
    diligencePath: Obtain audited income, cash-flow, and balance-sheet statements with monthly management-account reconciliation.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: release-engineering
    missingEvidence: >-
      Public release notes, deployment SLA terms, rollback process, and support escalation mechanics for production
      programs.
    whyItMatters: >-
      Mission-critical buyers need to know whether the product is a repeatable software platform or a services-heavy
      engineering engagement.
    diligencePath: Request product release history, support handbook, sample deployment checklist, and standard SLA commitments.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: material
    topic: assurance-evidence
    missingEvidence: >-
      Official documentation for security/privacy controls, certification scope, and audit artifacts behind
      compliance-oriented marketing claims.
    whyItMatters: >-
      Formal verification messaging is valuable, but underwriting trust and safety requires evidence of what is
      certified, audited, or operationally monitored.
    diligencePath: >-
      Request certification matrices, security architecture documentation, incident response process, and any
      third-party assurance reports.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository, package, forum, or practitioner-community telemetry that shows external developer engagement
      with the product.
    whyItMatters: >-
      Developer-signal is a useful proxy for implementation maturity, ecosystem adoption, and maintainability when the
      commercial motion is developer-adjacent.
    diligencePath: >-
      Request GitHub or package registry surfaces if they exist, or substitute with partner engineering talks,
      integration forum activity, or customer implementation references.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: deployment-depth
    missingEvidence: Customer-by-customer scope, production status, contract duration, and deployment economics for named programs.
    whyItMatters: >-
      Named logos and customer mentions support relevance, but they do not by themselves prove repeatable, durable, or
      large-scale product deployment.
    diligencePath: >-
      Request deployment case studies, reference calls, renewal data, and contract-value ranges for named defense and
      industrial accounts.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-gaps
    missingEvidence: Customer count, GRR/NRR, renewal rates, and contract duration by cohort.
    whyItMatters: These metrics determine whether public referenceability converts into durable recurring revenue.
    diligencePath: Request cohort retention tables, renewal schedules, and top-customer renewals by vintage.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer share, government versus commercial revenue mix, and concentration by account.
    whyItMatters: A few large defense or industrial accounts could dominate revenue and make growth lumpy.
    diligencePath: Request top-10 customer concentration, backlog by program, and revenue split by vertical.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: missing-source
    severity: material
    topic: production-proof
    missingEvidence: Named production deployments outside defense with dates, scope, and measurable outcomes.
    whyItMatters: Expansion beyond defense is part of the thesis, but the retained pool gives only sparse named proof.
    diligencePath: Request customer references in semiconductor, automotive, or telecom with deployment scope and renewal status.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: named-accounts
    missingEvidence: A complete customer roster or a disclosed basis for how many public references represent the total base.
    whyItMatters: The named-customer table is useful proof, but it should not be mistaken for a representative denominator.
    diligencePath: Request a customer list by vertical and status or a management-certified count of active accounts.
    relatedQuestionRefs:
      - QU001
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Primary regulator, court, certification, accreditation, security-audit, export-control, and incident records tied
      to named deployments.
    whyItMatters: >-
