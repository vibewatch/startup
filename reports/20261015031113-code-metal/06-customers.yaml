        - Verified translation where failure creates certification or mission risk
        - Supports premium pricing and reference quality
        - No public list of named aerospace production deployments beyond repeated logos
      - - Semiconductor and hardware portability teams
        - Chip vendor or platform owner pays; compiler and performance engineers use
        - Official, press-release, and investor sources cite semiconductor demand
        - Porting code across hardware targets with verification and optimization
        - Land-and-expand path beyond one modernization project
        - Concrete named production customer proof is sparse in the retained pool
      - - Automotive, telecom, and industrial edge teams
        - OEM or enterprise engineering budget pays; platform teams use
        - Official and investor sources cite automotive, telecom, and industrial demand
        - Moving prototype or legacy code into regulated production environments
        - Extends TAM beyond defense
        - Public evidence is segment-level positioning, not a robust named-customer set
    notes: >-
      Segment rows synthesize repeated public references by vertical and buyer type; they do not
      imply disclosed revenue mix, customer counts, or segment shares.
    claimRefs: [CU001, CU002, CU003, CU009, CU010, CU014]
