figures:
  - id: FU001
    title: Customer journey from modernization wedge to expansion proof
    type: journey-map
    summary: >-
      Public evidence suggests Code Metal lands on urgent legacy-code problems, seeks verified
      production proof, and then tries to expand into broader portability and hardware programs.
    data:
      items:
        - label: Legacy-code pain becomes urgent
          tone: warning
          detail: Mission-critical teams face old code, scarce expertise, and zero-error requirements.
          touchpoints:
            - Defense and regulated-industry urgency
            - Correctness and compliance are purchase triggers
        - label: Initial scoped modernization engagement
          tone: neutral
          detail: A customer starts with a bounded translation or portability project.
          touchpoints:
            - Legacy C# to C++ modernization
            - Hardware retargeting and code portability
        - label: Verified deployment claim
          tone: positive
          detail: Public proof shifts from concept to an operational or production-use claim.
          touchpoints:
            - Named customers include U.S. Air Force and L3Harris
            - Production use is asserted, but often without denominators
        - label: Outcome evidence builds trust
          tone: positive
          detail: Case studies focus on speed, correctness, and mission-readiness outcomes.
          touchpoints:
            - Two-week modernization example
            - Weeks-to-days L3Harris translation claim
        - label: Expansion into adjacent verticals
          tone: opportunity
          detail: The same wedge is marketed into semiconductor, automotive, telecom, and industrial accounts.
          touchpoints:
            - Portability across chips and devices
            - Regulated enterprise environments beyond defense
        - label: Renewal and concentration still need proof
          tone: risk
          detail: Public evidence has not yet shown retention, contract duration, or customer mix durability.
          touchpoints:
            - No public GRR, NRR, or customer-count disclosure
            - Programs-of-record conversion remains the hard test
    approximationNotes: null
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014]
callouts:
  - calloutType: insight
    title: Repeated named accounts clear the referenceability threshold
    body: >-
      The public record is stronger than a logo wall: the same defense and industrial accounts
      recur across independent, investor, partner, and company-linked sources, which supports the
      claim that Code Metal has real customer traction in mission-critical environments.
    claimRefs: [CU003, CU004, CU008]
  - calloutType: risk
    title: Public proof still stops short of durability
    body: >-
      No retained source discloses customer count, retention, contract duration, or revenue
      concentration, and the adverse coverage argues that pilots are not the same as scaled
      production. That keeps concentration and renewal risk open.
    claimRefs: [CU011, CU012, CU013]
