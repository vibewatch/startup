  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - U.S. Air Force
        - Government defense program
        - Repeatedly cited as a customer for mission-critical code modernization
        - Production or program-of-record status is asserted in one third-party source, not independently detailed
        - Serves as the strongest public government reference
        - No program name, spend, user count, or renewal detail
      - - L3Harris
        - Defense prime
        - Named customer for verified translation and modernization work
        - Public proof reaches several projects and production-use claims, but scope remains partly opaque
        - Weeks-to-days speed claim is the clearest public outcome
        - No contract value or evidence that success generalized across the full estate
      - - RTX
        - Defense prime
        - Repeatedly cited as a customer and investor-adjacent strategic account
        - Customer status is clear; deployment depth is not
        - Valuable reference for trust-sensitive buyers
        - Investor overlap and absent program detail limit independence
      - - Toshiba
        - Industrial enterprise
        - Repeatedly cited as a customer outside the core defense cluster
        - Customer status is named, but production depth is not described
        - Important signal that demand is not purely U.S. defense
        - Public evidence does not describe contract size, renewal, or expansion path
    notes: >-
      This is a partial public sample of repeatedly named accounts, not a complete customer list;
      rows distinguish customer naming from fully evidenced production depth.
    enumerationScope:
