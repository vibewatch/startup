      - Gap
    rows:
      - - Defense primes and government programs
        - Prime contractor or government program office pays; engineering and modernization teams use
        - U.S. Air Force, RTX, and L3Harris recur across independent and partner sources
        - Legacy-code modernization and verified deployment into mission-critical systems
