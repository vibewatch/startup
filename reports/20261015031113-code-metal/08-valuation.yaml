  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Current ARR or revenue, gross margin, burn, runway, and a credible reconciliation to the profitability claim.
      whyItMatters: Public price support is weak without the operating metrics needed to judge durability and return potential.
      diligencePath: Request board materials, KPI dashboards, and finance statements covering 2025-2026 operating performance.
      relatedQuestionRefs: [QV003, QV008]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: customer-economics
      missingEvidence: Customer concentration, renewal behavior, contract duration, expansion patterns, and proof that flagship accounts are becoming programs of record.
      whyItMatters: Named logos help the story, but valuation depends on repeatable production economics rather than isolated pilots.
      diligencePath: Review top-account contract summaries, renewal cohorts, pipeline conversion, and deployment expansion data.
      relatedQuestionRefs: [QV003, QV007, QV008]
      relatedTableRefs: [TV002, TV003]
    - type: missing-source
      severity: material
      topic: financing-terms
