  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - ["Bull", "Named defense and industrial accounts expand into programs of record, formal verification remains differentiated, and profitability or strong margins are substantiated.", "A valuation above the disclosed $1.25B mark could be supportable if growth and cash generation are both proven.", "Would require contract expansion evidence, audited profitability support, and repeat deployments across multiple customers.", "Failure to convert flagship accounts into broader production revenue."]
      - ["Base", "Technical moat is real and adoption continues, but disclosure stays incomplete and customers scale more gradually than the valuation implies.", "The current $1.25B price looks hard to underwrite, so returns depend on either better terms or stronger KPI proof.", "Best matches the present public record: momentum plus meaningful information gaps.", "Additional rounds at similar or lower prices before KPI depth improves."]
      - ["Bear", "Pilots stall, formal verification proves harder to scale on legacy codebases, or customer concentration and economics disappoint.", "A down-round or materially lower fair value becomes plausible because the public case rests more on narrative than verified operating leverage.", "Independent coverage already flags scale risk and unaudited profitability claims.", "Program delays, failed renewals, weak margins, or adverse term changes in future financing."]
    notes: >-
      Public evidence supports only qualitative bands around the disclosed $1.25B
      mark because ARR, gross margin, retention, and comparable-set math are not
      publicly disclosed.
