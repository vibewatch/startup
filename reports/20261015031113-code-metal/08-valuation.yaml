      - ["Anti-thesis: valuation outran disclosed KPI depth", "Public evidence confirms the valuation jump and limited secondary activity, but not the operating metrics needed to defend the multiple.", "Disclose ARR, gross margin, burn, retention, and customer concentration or provide equivalent private diligence evidence."]
