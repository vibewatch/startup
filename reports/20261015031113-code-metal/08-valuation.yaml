figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The public logic stack points to continued diligence rather than a clean
      underwrite at the disclosed Series B price.
    data:
      nodes:
        - id: moat
          label: Verified translation moat
          note: Formal verification claims and 2025-2026 research output support technical differentiation.
        - id: traction
          label: Named customer traction
          note: Air Force, L3Harris, Toshiba, and RTX references show relevance in mission-critical markets.
        - id: rerating
          label: Fast valuation rerating
          note: Public financing moved from $250M in November 2025 to $1.25B in February 2026.
        - id: terms
          label: Terms not toxic, but incomplete
          note: Forge shows 1.0x non-participating preferred, yet full round economics are not public.
        - id: risk
          label: Scale and disclosure risk
          note: Independent reporting says profitability is unaudited and large-scale legacy-code proof is still the open question.
        - id: call
          label: Research-more / expensive
          note: Require contract-level proof, KPI disclosure, and fuller financing detail before underwriting the current price.
      edges:
        - from: moat
          to: traction
          label: technical story reaches target buyers
        - from: traction
          to: rerating
          label: customer proof helps explain venture demand
        - from: rerating
          to: terms
          label: public terms temper, but do not solve, downside
        - from: terms
          to: risk
          label: missing KPI depth still dominates price support
        - from: risk
          to: call
          label: unresolved proof keeps the recommendation cautious
    approximationNotes: >-
      This is a logic sequence, not a weighted scoring model or an inferred
      probability tree.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV011
      - CV012
