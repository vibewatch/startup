company:
  name: Code Metal
chapter:
  number: 8
  title: Valuation
  summary: >-
    Code Metal has enough technical differentiation and named customer traction to
    justify continued diligence, but the disclosed $1.25 billion Series B price
    moved faster than the public KPI record. Public round terms look conventional
    rather than punitive, yet missing revenue quality, retention, margin, and
    detailed contract evidence keep the recommendation at research-more with an
    expensive valuation stance.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The public record supports a price-sensitive research-more posture rather
      than a fresh buy call. Code Metal has credible positives: a verification-first
      product claim rooted in formal methods, named defense and industrial
      customers, and a valuation step-up from $250 million in November 2025 to
      $1.25 billion in February 2026. Those points show real demand and venture
      conviction, but they do not by themselves prove that today's entry price is
      underwritten. Forge still characterizes market activity as limited, and the
      most skeptical independent coverage says the open question is whether the
      company can scale verification from pilots into large legacy codebases while
      the company still has not publicly verified profitability with audited
      financials or disclosed core SaaS-style operating metrics.
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: financing-context-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      Public financing context is useful for framing discipline, but it still
      falls short of validating the headline valuation. The company disclosed a
      $125 million Series B at $1.25 billion only months after a $36.5 million
      Series A at $250 million, and Forge shows the last round with 1.0x
      non-participating preferred terms instead of an obviously aggressive
      preference stack. That reduces one source of downside overhang, yet the same
      public package leaves material blind spots around ARR, gross margin, burn,
      cash runway, customer concentration, and whether the eight-figure revenue
      signal from late 2025 translated into durable economics through 2026. Exit
      readiness is also not underwritten by the public record because limited
      market activity is a thin external mark for a company now carrying a unicorn
      price.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV011
      - CV012
      - CV014
    tableRefs:
      - TV003
  - id: scenarios-diligence-asks-and-thesis-breakers
    title: Scenarios, diligence asks, and thesis-breakers
    body: >-
      The key underwriting question is not whether verified translation matters;
      it is whether Code Metal can convert technical credibility and early
      contracts into repeatable program-of-record economics before its valuation
      outruns proof. Upside exists if named customers expand into broader
      production deployments, if the company can substantiate current profitability
      or strong unit economics, and if its formal-methods moat remains meaningfully
      differentiated as demand for code portability and modernization grows.
      Downside remains meaningful because independent evidence still flags scale
      risk on hard legacy codebases, while public disclosures do not yet resolve
      comparable-set math, contract durability, or the operating metrics needed to
      triangulate return potential. The next diligence dollar should therefore go
      into contract-level proof, customer concentration, cohort behavior, and full
      round documents rather than into a valuation debate built on headline momentum
      alone.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
