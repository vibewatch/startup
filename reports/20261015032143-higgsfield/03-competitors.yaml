            Web generation, model access, and plan-based credits inside the
            browser workflow
        - >-
            Live pricing can change by region, promotion, model, and plan
        - Strong for trial and breadth; weak for precise unit-cost underwriting
      - - Higgsfield Team / Scale / Enterprise
        - >-
            Business contracts, pooled or enterprise-style credits, and sales
            process for custom capacity
        - Shared workspaces, administration, and higher-capacity usage
        - Negotiated pricing, seat rules, and pooled-credit behavior are undisclosed
        - Helps land agency and team workflows, but hides realized pricing
      - - Higgsfield API / MCP / CLI
        - >-
            API uses separate dollar balance; MCP and CLI still spend plan
            credits
        - Agent-driven or programmatic generation routes
        - >-
            Unlimited web access does not automatically make API, MCP, or CLI
            free
        - Adds workflow flexibility while increasing buying-surface complexity
      - - Magic Hour browser workflow
        - Competitor-guided browser workflow plus developer APIs
        - Generation, editing, face swap, lip sync, and delivery routes
        - Assigned pool does not provide verified current price points
        - Adjacent substitute when finishing speed matters more than model breadth
      - - Media.io finishing workflow
        - Add-on workflow rather than full generation contract in assigned evidence
        - >-
            Enhancement, compression, conversion, trimming, resizing, and final
            publishing polish
        - Current standalone economics are not disclosed in assigned pool
        - Can sit beside Higgsfield instead of fully displacing it
      - - Direct model API plus external editor
        - Per-endpoint or per-job spend with separate editor tooling
        - Narrower but easier-to-audit route for one chosen model
        - Integration, storage, and review labor shift back to the buyer
        - Best when repeatability matters more than breadth or convenience
    notes: >-
      Public pricing snapshots, competitor-authored comparisons, and live
      checkout screens can diverge. Underwriting should validate current
      contract terms rather than rely on headline marketing prices.
