callouts:
  - calloutType: risk
    title: Convenience moat, not captivity moat
    body: >-
      The evidence supports Higgsfield as a strong workflow compressor, but not
      as a route that forces buyers to abandon specialist editors, direct APIs,
      or finishing suites.
    claimRefs: [CP009, CP011, CP012, CP015]
  - calloutType: insight
    title: Scale improves distribution, but also widens the execution surface
    body: >-
      Public scale signals and enterprise expansion improve market presence, yet
      the same evidence shows the company is stretching into more surfaces than
      pure generation alone.
    claimRefs: [CP004, CP013, CP014]
