  topStrengths:
    - Broad multi-model creative workflow with visible product breadth and control depth.
    - Rapid commercial scaling, including a closed $400M Series B and a reported $1B annualized revenue run rate.
    - Monetization appears to be broadening beyond pure subscriptions into usage and enterprise spend.
  topRisks:
    - Gross margin, retention, and customer concentration remain undisclosed in the public record.
    - Runway and full cap-table terms are still unclear despite the large Series B.
    - The business is exposed to supplier pricing, API access, and workflow-commoditization risk.
  unresolvedGaps:
    - >-
      Audited or reviewed bridge from subscriptions and enterprise spend to recurring revenue, including refunds and
      credits.
    - Net revenue retention, cohort behavior, and concentration by marketer, agency, and enterprise customer segment.
    - >-
      Supplier-cost concentration, gross margin by product line, and the real burn profile behind high-volume
      generation.
    - Cap-table detail, liquidation preferences, and evidence that post-February 2026 process fixes are durable.
