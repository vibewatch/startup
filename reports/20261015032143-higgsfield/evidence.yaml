evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      A current board roster, formal executive titles, reporting lines, and any governance rights granted in late-stage
      financings.
    whyItMatters: Founder concentration and investor influence cannot be evaluated from public assigned sources alone.
    diligencePath: Request the current org chart, board list, and financing term sheets or investor-rights summaries.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current customer counts, paying-subscriber definitions, enterprise account counts, headcount, locations, and any
      debt or credit facilities.
    whyItMatters: >-
      Cover metrics drive underwriting quality, but user counts and revenue headlines are not the same as paying
      customers, workforce scale, or capital structure.
    diligencePath: Request KPI definitions, a customer and subscriber bridge, current headcount, office list, and a debt schedule.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      An audited or management-certified bridge from bookings and subscriptions to recurring revenue, including refunds,
      credits, and enterprise concentration.
    whyItMatters: >-
      The latest commercialization and run-rate claims are secondary-source milestones without a primary revenue-quality
      reconciliation.
    diligencePath: >-
      Request monthly revenue cohorts, ARR methodology, enterprise concentration, and reconciliation from GAAP revenue
      to any run-rate disclosures.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table coverage
    missingEvidence: A complete public list of executives and board members beyond the two named founders.
    whyItMatters: >-
      The chapter can identify founders but cannot test management depth or governance resilience from the assigned
      pool.
    diligencePath: Ask management for an executive roster and board materials, then expand the leadership table.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map coverage
    missingEvidence: A full capitalization table with ownership percentages, preference stack, secondaries, and debt.
    whyItMatters: Named investors alone do not reveal control, dilution, liquidation preferences, or downside protection.
    diligencePath: Request the cap table, security terms, and any secondary-sale history.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: An independent segmented TAM/SAM/SOM for AI video marketing workflows by buyer class and geography.
    whyItMatters: >-
      Broad creator-economy or platform-traffic figures do not establish the monetizable market ceiling relevant to
      underwriting adoption and valuation.
    diligencePath: >-
      Obtain current analyst-market-data or public-company disclosures that isolate AI video creation or ad-production
      software budgets, then map them to creator, agency, and enterprise segments.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: Segment-level revenue, retention, and payback by creator, SMB brand, agency, and enterprise cohorts.
    whyItMatters: >-
      Buyer and payer segmentation is visible, but without cohort economics the chapter cannot determine which wedge is
      most durable or valuable.
    diligencePath: >-
      Request management reporting that bridges self-serve subscriptions, team seats, and enterprise usage-based spend
      to recurring revenue and retention by segment.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: application-layer
    missingEvidence: >-
      A current technical inventory separating Higgsfield-developed models from integrated third-party models and
      workflow orchestration.
    whyItMatters: >-
      The assigned third-party and company-issued sources conflict on whether Higgsfield develops models, affecting
      market boundary, capital intensity, and differentiation.
    diligencePath: >-
      Request a model-by-model architecture and supplier schedule, then reconcile it with current product documentation
      and technical leadership interviews.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent side-by-side benchmark on accepted-output rate, total human repair time, and cost per accepted clip
      versus Runway, Kling, Sora/Veo, and Magic Hour.
    whyItMatters: >-
      The chapter can describe positioning but cannot underwrite which route wins on real production efficiency without
      a common benchmark.
    diligencePath: >-
      Run the same brief across each route, capture retries, time to accepted output, downstream edit time, and final
      publishing constraints.
    relatedQuestionRefs:
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Negotiated Team, Scale, and Enterprise price sheets, pooled-credit rules, and enterprise support terms.
    whyItMatters: >-
      Public tiers do not reveal whether Higgsfield's enterprise motion is economically advantaged or merely more
      feature-rich.
    diligencePath: >-
      Request current enterprise order forms, sample invoices, and renewal terms for agencies or brands running
      recurring volume.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: retention-and-multi-homing
    missingEvidence: >-
      Customer retention, seat expansion, and workflow-share data showing whether buyers consolidate onto Higgsfield or
      keep it as one tool among several.
    whyItMatters: >-
      Moat durability depends on whether workflow breadth reduces tool switching enough to survive specialist
      competition.
    diligencePath: >-
      Request cohort retention, NRR, customer references, and examples of workloads that displaced separate editing or
      direct-model routes.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by subscriptions, overages, enterprise contracts, and major model/provider workloads.
    whyItMatters: >-
      Video-generation businesses can scale revenue while still carrying weak contribution margins if compute and
      support costs move faster than pricing.
    diligencePath: >-
      Request a COGS bridge that shows pre/post GMI Cloud economics, provider concentration, and gross margin by major
      product line.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Net revenue retention, cohort behavior, and revenue concentration by top customers and segment.
    whyItMatters: >-
      Usage-led growth is more durable if expansion and concentration are healthy; otherwise the current run-rate could
      be unusually concentrated or promotional.
    diligencePath: >-
      Request cohort tables, NRR by segment, top-10 customer concentration, and expansion/churn by enterprise versus
      creator accounts.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Post-Series-B cash balance, monthly burn, runway, and any debt, compute-minimum, or project-finance obligations.
    whyItMatters: >-
      A large financing round does not by itself prove adequate runway once compute commitments, hiring plans, and
      working-capital needs are included.
    diligencePath: >-
      Request the latest board cash bridge, debt schedule, committed vendor minimums, and the next-round trigger
      assumptions.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Live plan sheet, enterprise price cards, discounting policy, and the credit-to-dollar realization bridge.
    whyItMatters: >-
      Public evidence shows structure and rough unit prices, but not what customers actually pay after promotions,
      bundles, or negotiated contracts.
    diligencePath: >-
      Request current self-serve pricing pages, price-book screenshots, sample enterprise order forms, and a
      reconciliation from credits sold to recognized revenue.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: enterprise-assurance
    missingEvidence: >-
      Public uptime history, service-level commitments, incident postmortems, and disaster-recovery objectives for
      production generation services.
    whyItMatters: >-
      Enterprise buyers need evidence that queueing, generation, and delivery can meet production availability and
      recovery requirements.
    diligencePath: >-
      Request contractual SLA terms, status-page history, incident summaries, recovery objectives, and escalation
      procedures from management.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: security-and-data-governance
    missingEvidence: >-
      Security certifications, penetration-test summary, data-retention controls, training opt-outs, regional processing
      details, and enterprise administrator controls.
    whyItMatters: >-
