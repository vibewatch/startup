  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enterprise-assurance
      missingEvidence: Public uptime history, service-level commitments, incident postmortems, and disaster-recovery objectives for production generation services.
      whyItMatters: Enterprise buyers need evidence that queueing, generation, and delivery can meet production availability and recovery requirements.
      diligencePath: Request contractual SLA terms, status-page history, incident summaries, recovery objectives, and escalation procedures from management.
      relatedQuestionRefs:
        - QE008
      relatedTableRefs:
        - TE003
    - type: private-evidence-only
      severity: material
      topic: security-and-data-governance
      missingEvidence: Security certifications, penetration-test summary, data-retention controls, training opt-outs, regional processing details, and enterprise administrator controls.
