figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence supports a six-layer workflow from source assets through role-specific controls and model orchestration to delivery and governance.
    data:
      layers:
        - label: Intent and source assets
          detail: Prompts, product links, product photos, reference images, existing clips, and audio can initiate supported workflows.
          modules:
            - Prompts
            - Product context
            - Reference media
        - label: Role-specific workflows
          detail: Product surfaces organize generation around creator, marketing, cinematic, and transformation jobs.
          modules:
            - AI Video
            - Cinema Studio
            - Marketing Studio
            - Genjutsu
        - label: Creative control
          detail: Camera, lens, motion, frame, and identity controls aim to direct generation beyond a plain prompt.
          modules:
            - Camera and lens controls
            - Motion references
            - First and last frames
            - Identity-preservation tools
        - label: Model orchestration
          detail: A curated catalog brokers Higgsfield and third-party image and video models through shared product surfaces.
          modules:
            - Higgsfield image tools
            - Kling, Veo, Seedance, Wan, and other families
            - Model-specific endpoints
        - label: Delivery and integrations
          detail: Web generation, API jobs, SDKs, REST, MCP, polling, and webhooks connect workflows to users and software.
          modules:
            - Web workspace
            - API and SDKs
            - MCP clients
            - Status polling or webhooks
        - label: Storage, safety, and assurance
          detail: Outputs require downstream storage, while moderation and consent rules operate without a public enterprise-assurance package in this evidence set.
          modules:
            - Time-limited hosted outputs
            - Content screening
            - Face-consent requirements
            - Unresolved SLA and security evidence
    approximationNotes: The layer order is an analyst synthesis of public workflows and does not represent a disclosed internal architecture.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE009
      - CE010
      - CE012
      - CE016
callouts:
  - calloutType: strength
    title: Workflow orchestration is the visible product wedge
    body: >-
      Official and independent sources align on multi-model access, role-specific
      workflows, and directed controls as the central differentiation rather than
      ownership of one underlying generation model.
    claimRefs:
      - CE009
      - CE015
  - calloutType: risk
    title: Product breadth exceeds public assurance evidence
    body: >-
      The assigned sources document features, API mechanics, and some moderation
      rules but do not provide the SLA, incident, certification, or audit evidence
      required to underwrite enterprise reliability and governance.
    claimRefs:
      - CE012
      - CE013
      - CE016
