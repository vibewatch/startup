    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: Gross margin by subscriptions, overages, enterprise contracts, and major model/provider workloads.
      whyItMatters: Video-generation businesses can scale revenue while still carrying weak contribution margins if compute and support costs move faster than pricing.
      diligencePath: Request a COGS bridge that shows pre/post GMI Cloud economics, provider concentration, and gross margin by major product line.
      relatedQuestionRefs: [QI005, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Net revenue retention, cohort behavior, and revenue concentration by top customers and segment.
      whyItMatters: Usage-led growth is more durable if expansion and concentration are healthy; otherwise the current run-rate could be unusually concentrated or promotional.
      diligencePath: Request cohort tables, NRR by segment, top-10 customer concentration, and expansion/churn by enterprise versus creator accounts.
      relatedQuestionRefs: [QI003, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
      severity: blocking
      topic: runway
      missingEvidence: Post-Series-B cash balance, monthly burn, runway, and any debt, compute-minimum, or project-finance obligations.
      whyItMatters: A large financing round does not by itself prove adequate runway once compute commitments, hiring plans, and working-capital needs are included.
      diligencePath: Request the latest board cash bridge, debt schedule, committed vendor minimums, and the next-round trigger assumptions.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: realized-pricing
      missingEvidence: Live plan sheet, enterprise price cards, discounting policy, and the credit-to-dollar realization bridge.
      whyItMatters: Public evidence shows structure and rough unit prices, but not what customers actually pay after promotions, bundles, or negotiated contracts.
      diligencePath: Request current self-serve pricing pages, price-book screenshots, sample enterprise order forms, and a reconciliation from credits sold to recognized revenue.
