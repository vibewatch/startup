      - number: '2.2'
        title: 规模测算视角与已观察需求
        blocks:
          - type: paragraph
            body: >-
              当前材料池没有 AI 视频营销工作流清晰的第三方 TAM、SAM、SOM 体系，因此最稳妥的办法是从相邻市场规模、已观察需求和商业集中度进行三角验证。最宽泛的视角来自公司口径：PR Newswire
              称全球创作者经济估值超过 $250B，这一口径太宽，不能充当 Higgsfield 的 TAM，但能说明投资人和供应商为何关注创作者工具。更具体的信号来自当前采用和变现：Inc 称 2026 年 1 月至 7 月
              Higgsfield 访问量超过 361m 次，是 2025 年同期的 10x 以上；Sacra 当前的 2026 年页面称平台拥有超过 32m 用户和 1m 付费订阅者。Sacra 还称，社交媒体营销人员在
              2026 年 1 月占使用量的 85%，其中 80% 正在制作商业内容。这些数字表明当前需求正偏向广告制作工作流，而不是业余试验；但由于来源未披露支出分母、地域构成或细分留存，它们并不能确立 SAM。
