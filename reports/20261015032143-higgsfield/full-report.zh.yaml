      - number: '4.3'
        title: 承销缺口与财务判断
        blocks:
          - type: paragraph
            body: >-
              因此，财务判断是喜忧参半。Higgsfield
              拥有异常强的公开增长信号、使用量变现不断增强的证据，以及一笔应能减轻近期融资压力的新募资——前提是盈亏平衡说法经得起验证。但公开记录仍未披露那些能把增长变成可承销利润故事的指标：按产品线拆分的毛利率、cohort
              留存或 NRR、企业账户支出的集中度，以及 B 轮后的现金和跑道。聚合多个模型的策略也带来供应商风险，因为底层模型提供商可能重新定价访问权限、限制 API
              或构建竞争性工作流层。综合来看，收入动能真实存在，资本强度可能正在改善，但收入质量和持久性仍只有部分证据支撑。
            claimRefs:
