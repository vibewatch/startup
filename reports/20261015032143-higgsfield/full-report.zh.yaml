  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合覆盖工作流平台、原生模型路径和后期制作栈
        blocks:
          - type: paragraph
            body: >-
              当前材料池指向的竞争集合，比单纯的“AI 视频生成器”更宽。Higgsfield
              自有产品页面和独立评测都将其定位为工作流层：它在一个账户内整合多个托管视频模型、镜头控制、参考素材处理和相邻创意工具，而不是单一基础模型。这使其直接比较对象既包括 Runway、Magic Hour
              等工作流平台，也包括当买方关注特定运动或真实感表现时的 Kling、Sora/Veo 等原生模型路径，还包括团队将一个模型、一个编辑器和独立后期步骤拼接起来的现状技术栈。公司 2026 年 10
              月的融资公告也具有竞争意义，因为它显示公司公开规模足以吸引代理机构和营销人员，而不只是业余创作者；但指定证据仍未披露许多对手的规模指标。实际含义是：Higgsfield
              首先以工作流编排者身份竞争，其次才是模型供应商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
