  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开 traction
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 的收入模式明显与使用量挂钩，而不是纯粹按席位收费的 SaaS。官方网站将产品定位为覆盖多个视频模型的单一工作区，OpenAI 案例则展示了如何通过 Click-to-Ad 直接把产品 URL
              或图像变成广告创意。这一产品设计在财务上很关键：它让变现跟踪创意产出，而不只是用户数。公开收入运行率信号随后显示出异常快的扩张：第三方和公司来源将业务从 2026 年 1 月约 $200M ARR，追踪到上线后
              11 个月内的 $300M 年化跑速、6 月 $500M 年化收入、8 月 $700M 和 9 月 $1B 年化收入。Sacra 称订阅收入占比从超过 90% 降至略高于
              60%，说明超额用量和额外生成能力正变得具有财务意义；变现覆盖面扩大了，但收入质量也更依赖持续的使用强度。
