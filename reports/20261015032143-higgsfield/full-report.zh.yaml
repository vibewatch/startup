figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 指定来源显示，公司从 2024 年种子轮融资走向 2026 年企业商业化和后期融资，路径十分紧凑。
    data:
      items:
        - date: Apr 2024
          label: 种子轮融资与 Diffuse 发布
          detail: $8M 种子轮融资恰逢 Diffuse 发布，这是公司首款移动端 AI 视频应用。
        - date: '2025'
          label: 商业平台发布
          detail: Higgsfield 称平台于 2025 年上线，目标是让任何有想法的人都能创作专业视频和图片。
        - date: Nov 2025
          label: Team 与 Enterprise 计划
          detail: Sacra 称，共享工作区的 Team 与 Enterprise 计划让公司进军高端市场的路径正式成形。
        - date: Feb 2026
          label: 信任与内容审核争议
          detail: TechTimes 称，Forbes 记录了带有种族主义色彩的 AI 生成宣传内容，Higgsfield 的 X 账号在同一周被暂停。
        - date: Mar 2026
          label: Similarity Scoring 发布
          detail: 争议之后，Higgsfield 推出 Similarity Scoring，在内容发布前标记潜在的肖像相似和品牌标志重叠。
        - date: Jun 2026
          label: 后期融资谈判
          detail: TechTimes 报道，公司正在讨论一轮 $300M-$500M 融资，投前估值为 $5B，但该轮尚未完成。
        - date: Aug 2026
          label: 企业收入占比拐点
          detail: AIBase 报道称，企业客户已成为收入主体；1 月时企业收入占比还不到 25%。
        - date: Aug 2026
          label: Series B 完成
          detail: Sacra 报道，公司以 $5.4B 估值完成 $400M Series B，使据报道的累计融资达到 $538M。
        - date: Sep 2026
          label: 年化收入达到 $1B
          detail: Sacra 报道的 $1B 年化收入，是用最近四周收入乘以 13 得出；这不是披露的 ARR，也不是经审计的收入。
