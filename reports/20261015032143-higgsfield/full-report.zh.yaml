            body: >-
              一些缓释措施已经可见，但还不足以消除主要风险。NVIDIA 描述了自愈运营，Incrypted 称 Higgsfield 会在每次生成前显示准确点数成本，公司则称正在推出 ethical AI Likeness
              Licensing 框架。这些控制应视为早期信号，而不是已经完成的尽调。只有在公司展示与营销使用承诺一致的退款和排队政策、按获批资产拆分的活动级点数效率、针对合成代言人和 likeness
