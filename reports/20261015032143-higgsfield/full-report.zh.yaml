      - number: '3.2'
        title: 差异化在镜头驱动的工作流广度上最强，在成本确定性上最弱
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 的公开证据和第三方证据在两项优势上最一致：镜头导向的电影化控制，以及无需离开工作流即可切换多个模型。Cybernews、ConceptBeans 和其他评测型来源反复将 Higgsfield
              排在短视频和视觉控制输出的前列，同时也把更深编辑控制推荐给 Runway，把真实感或运动测试推荐给 Kling 或前沿模型路径，把后期润色推荐给
              Media.io。更大的战略摩擦来自定价和打包。指定证据描述了一个碎片化商业界面：免费和付费网页方案、团队共享方案、独立 API 计费，以及仍会消耗方案点数的 MCP/CLI 使用。复杂性不会把
              Higgsfield 排除在买方候选名单之外，但会让横向成本比较比 headline 订阅价格暗示的更困难，尤其当重试和后续清理决定每个可接受产出的真实成本时。
            claimRefs:
