      - number: '1.3'
        title: 商业化、不利信号与未决指标
        blocks:
          - type: paragraph
            body: >-
              2026 年末的商业故事在 headline 动能上很强，但承销细节较弱。二手报道称，截至 2026 年 8 月企业客户已占收入多数，且 2026 年 9 月年化收入达到 $1B，计算方式是将最近四周乘以
              13。这是收入运行率指标，并非披露的 ARR 或经审计收入，但足以支持 Higgsfield 正从创作者试验走向制作营销预算的判断。与此同时，本章保留两项警示。第一，2026 年 2
              月推广内容失误在公司推出事后防护措施前制造了信任和治理风险。第二，竞争对手 Lotix 将 Higgsfield 描述为更适合快速视觉测试，而非完整制作管理；这不是独立基准，但指出了一个需要直接尽调、不能从增长
              headline 外推的工作流稳定性问题。
