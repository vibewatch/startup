  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              最强证据显示，Higgsfield 主要位于 AI
              视频的应用层：官方页面强调一个能调用多个外部模型的工作台，独立报道则将其描述为面向创作者、品牌和社交媒体营销人员的短视频创作平台。底层模型边界尚未完全确定。TechJournal 称 Higgsfield
              不构建自有模型，而是串联第三方系统；公司发布的新闻稿却称其开发生成式视频和图像模型，同时也整合第三方模型。这一矛盾使本章无法把基础模型能力视为已验证事实。因此，承销市场应限定为此前分散在摄影团队、代理机构、编辑工具、资产生成产品和活动变体工作流中的那部分工作流预算。现状替代方案是多工具加人工迭代的碎片化制作；Higgsfield
              的应用层卖点，是把这些开销压进一个多模型环境。
