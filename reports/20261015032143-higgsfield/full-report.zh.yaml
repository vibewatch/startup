      - number: '8.3'
        title: 情景框架与当前估值语境
        blocks:
          - type: paragraph
            body: >-
              融资历史推进得足够快，因此情景纪律比精确预测更重要。2026 年 1 月，$1.3B 估值对应据报道的 $200M ARR，约为 6.5x ARR。2026 年 8 月完成的 $5.4B 轮融资，对应公司报告的
              $700M 年化收入，约为 7.7x 跑速收入。表面看，这一步上升并不极端，但公开记录还包括一份交割前报道：在 6 月收入达到 $500M ARR 等值后，公司正在洽谈 $5B pre-money
              轮。换句话说，市场已经在为速度、企业变现和持续的工作流领导力付费。因此，基准情景应围绕收入桥是否足够持久、干净，能否守住当前估值；悲观情景则应假设，一旦支持经济性、留存质量或竞争差异化滑坡，倍数会迅速重置。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              从承销角度看，公开证据不支持称 Higgsfield
              已具备退出准备度。公司显然能够募资并获得关注，但公开材料仍未解决优先股堆叠、经审计的经常性收入桥、退款敞口，或高产量生成背后的毛利持久性。独立工作流和竞争对手评论也暗示，产品采用本身不够；买方需要可重复的控制、稳定支持和不会制造可避免流失的商业条款。最快改善判断的方式，是取得董事会级股权结构表、经审计或审阅的收入质量桥、cohort
              和集中度数据，以及按工作流拆分的毛利率证据。如果增长在这些披露收紧前放缓、支持和计费投诉扩大，或多模型工作流相对于资金更充足的竞争对手不再显得有差异化，投资论点就会破裂。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 建议
            body: 继续研究。Higgsfield 看起来是一家真实的工作流公司，也确实具备融资能力，但在最新私人估值下，公开证据仍不足以构成干净的买入案例。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV011
              - CV014
          - type: callout
            title: 什么会最快击穿投资论点
            body: 企业质量信号若快速恶化——支持排队、计费/退款摩擦，或明显的工作流商品化——将让当前估值更难守住。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
