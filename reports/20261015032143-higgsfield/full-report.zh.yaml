  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 受证据约束的市场梯度：从广义相邻市场，逐步收窄到当前 Higgsfield 使用情况似乎覆盖的商业切口。
    data:
      items:
        - label: 相邻创作者经济
          value: $250B+
          note: 公司发布的 PR Newswire 新闻稿引用的全球创作者经济视角
          tone: neutral
        - label: 平台地域覆盖
          value: 240+
          unit: countries / territories
          note: 公司披露的覆盖信号，适合衡量分发广度，不代表已变现的 SAM
          tone: neutral
        - label: 平台用户基础
          value: 32M+
          unit: users
          note: Sacra 截至 2026 年 9 月的采用情况视角
          tone: positive
        - label: 付费用户基础
          value: ~1M
          unit: paying subscribers
          note: Sacra 称平台拥有1m名付费订阅者
          tone: positive
        - label: 已观察到的采用
          value: 361M+
          unit: visits Jan-Jul 2026
          note: Inc 引用 Sensor Tower 数据称访问量同比增长超过 10 倍；Sacra 另称用户数超过 32m，付费订阅者1m
          tone: positive
        - label: 当前商业切口
          value: 85%
          unit: usage from social media marketers
          note: Sacra 称，2026 年 1 月该细分人群中有 80% 在制作商业内容
          tone: positive
    approximationNotes: 这不是数学推导出的 TAM / SAM / SOM 体系，而是把相邻市场视角、地域覆盖、观察到的平台采用率和商业使用集中度放在一起，展示相关性如何收窄，而不是可比的市场份额或转化率。
    claimRefs:
      - CM007
      - CM008
      - CM012
      - CM014
      - CM016
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 根据指定证据，将工作流广度与运营可预测性进行序数定位。
    data:
      xAxis:
        label: 工作流广度
        min: 1
        max: 5
        low: 狭窄的专业路径
        high: 广泛的多步骤工作流
        description: 1-5 ordinal synthesis from assigned-source descriptions
        scale: ordinal
      yAxis:
        label: 运营可预测性
        min: 1
        max: 5
        low: 成本波动 / 交接路径
        high: 更易审计和重复
        description: Higher scores reflect clearer cost, editing, or delivery path
        scale: ordinal
      points:
        - label: Higgsfield
          x: 5
          'y': 2
          detail: 指定证据中工作流最广，但积分规则、重试机制和多界面购买路径降低了可预测性。
          claimRefs:
            - CP002
            - CP009
            - CP010
            - CP011
        - label: Runway
          x: 4
          'y': 4
          detail: 在指定比较中，Runway 被定位为编辑控制能力更强的路径，但这里关于多模型广度的证据较少。
          claimRefs:
            - CP006
            - CP012
        - label: Kling / 原生模型路径
          x: 2
          'y': 3
          detail: 工作流广度更窄，但买家可以针对真实感或特定模型行为，不必为更大的套件付费。
          claimRefs:
            - CP006
            - CP012
        - label: Sora / Veo 路径
          x: 2
          'y': 2
          detail: 指定证据中的前沿模型选项，但相比完整工作流平台，路径仍然更窄。
          claimRefs:
            - CP002
            - CP006
            - CP012
        - label: Magic Hour
          x: 4
          'y': 4
          detail: 竞争对手自有证据强调，从生成到编辑再到交付的浏览器路径更短。
          claimRefs:
            - CP007
            - CP012
        - label: 直接 API + 编辑器技术栈
          x: 1
          'y': 5
          detail: 路径最窄，但指定证据称，团队统一采用一个稳定模型后，这一路径更易审计。
          claimRefs:
            - CP012
            - CP015
    approximationNotes: 坐标是根据指定来源池综合出的 1-5 序数评分，用于定位，不是实测基准。
    claimRefs:
      - CP002
      - CP006
      - CP007
      - CP009
      - CP010
      - CP011
      - CP012
      - CP015
  - id: FI001
    title: 公开收入模型桥接
    type: flow
    summary: 公开证据支持这样一条链路：获客、工作流使用、企业增购和计算效率如何连接到收入规模；但它不支持数字化转化漏斗或毛利瀑布。
    data:
      nodes:
        - id: entry
          label: 免费 + 付费入口
          detail: 用户可以免费开始使用，但部分高用量层级需要付费计划。
          claimRefs:
            - CI002
        - id: workspace
          label: 多模型工作区访问
          detail: Higgsfield 在一个创意工作区内提供多个主流视频模型的访问权，并据此变现。
          claimRefs:
            - CI001
        - id: workflow
          label: 产品链接与图片工作流
          detail: Click-to-Ad 将产品 URL 或图片转成适合专业团队使用的广告创意。
          claimRefs:
            - CI003
            - CI004
        - id: usage
          label: 使用量扩张
          detail: 收入结构从单纯订阅转向包含额外生成容量购买。
          claimRefs:
            - CI010
        - id: enterprise
          label: 企业变现
          detail: 部分账户每年为共享工作区、优先计算资源和安全工具支出超过 $200,000。
          claimRefs:
            - CI012
        - id: scale
          label: 年化收入规模
          detail: 公开报道追踪到年化收入在 11 个月内从 $300M 增长至 8 月的 $700M 和 2026 年 9 月的 $1B。
          claimRefs:
            - CI006
            - CI008
            - CI009
        - id: economics
          label: 利润率缓解，不是证明
          detail: 计算成本下降 45% 以及公司声称已实现现金流盈亏平衡，都有助于这条路径，但公开毛利率仍未披露。
          claimRefs:
            - CI011
            - CI014
            - CI015
      edges:
        - from: entry
          to: workspace
          label: 访问
        - from: workspace
          to: workflow
          label: 工作流
        - from: workflow
          to: usage
          label: 生成量
        - from: usage
          to: enterprise
          label: 增购
        - from: enterprise
          to: scale
          label: 收入规模
        - from: scale
          to: economics
          label: 利润率检验
    approximationNotes: 这条流程只展示顺序，不推断转化率、毛利或客户层面的单位经济性。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI014
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持一套六层工作流：从源资产出发，经角色专属控制和模型编排，走向交付与治理。
    data:
      layers:
        - label: 意图与源资产
          detail: 提示词、产品链接、产品照片、参考图片、现有短片和音频都可以启动受支持的工作流。
          modules:
            - 提示词
            - 产品背景
            - 参考媒体
        - label: 角色专属工作流
          detail: 产品界面围绕创作者、营销、电影化和转换任务组织生成。
          modules:
            - AI Video
            - Cinema Studio
            - Marketing Studio
            - Genjutsu
        - label: 创意控制
          detail: 摄像机、镜头、运动、画面和身份控制，旨在让生成不止受普通提示词驱动。
          modules:
            - 摄像机与镜头控制
            - 运动参考
            - 首帧与末帧
            - 身份保持工具
        - label: 模型编排
          detail: 精选目录通过共享产品界面接入 Higgsfield 及第三方图像和视频模型。
          modules:
            - Higgsfield 图像工具
            - Kling、Veo、Seedance、Wan 及其他模型系列
            - 特定模型端点
        - label: 交付与集成
          detail: Web 生成、API 任务、SDK、REST、MCP、轮询和 Webhook 将工作流连接到用户与软件。
          modules:
            - Web 工作区
            - API 与 SDK
            - MCP 客户端
            - 状态轮询或 Webhook
        - label: 存储、安全与保障
          detail: 输出需要下游存储；在这组证据中，审核与同意规则尚未配套公开的企业保障方案。
          modules:
            - 有时限的托管输出
            - 内容筛查
            - 人脸同意要求
            - 尚未解决的 SLA 与安全证据
    approximationNotes: 层级顺序是分析师对公开工作流的综合判断，不代表公司披露的内部架构。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE009
      - CE010
      - CE012
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Higgsfield 似乎先靠自助式创意试用获客，再向团队工作流、采购和年度企业合同扩张。
    data:
      nodes:
        - label: 发现自助式使用场景
          actor: Creator, freelancer, or growth marketer
          channel: Official site, AI video demos, creator education
          touchpoints:
            - Free or lightweight trial behavior
            - Multi-model video generation and quick ad concepts
          note: 面向创作者和营销人员的广泛宣传构成初始需求。
          tone: positive
        - label: 验证工作流匹配度
          actor: Freelancer, DTC brand, or agency operator
          channel: Marketing Studio, Cinema Studio, product workflows
          touchpoints:
            - Faster ad variants
            - Storyboards, product scenes, and campaign experiments
          note: 最好的公开证明在于活动产出，而不是深度留存。
          tone: neutral
        - label: 将团队带入共享工作区
          actor: Creative lead or agency manager
          channel: Shared credits, approvals, comments, and collaboration
          touchpoints:
            - Team workspace
            - Asset sharing and review loops
          note: 独立报道将产品描述为生产技术栈，而不只是短片工具。
          tone: positive
        - label: 通过企业采购
          actor: Admin, security, or procurement owner
          channel: Contact Sales, SSO/SAML review, security assessment
          touchpoints:
            - Annual contract discussion
            - Security documentation and centralized billing
          note: 进军企业市场取决于治理和采购流程的成熟度。
          tone: warning
        - label: 达到生产部署
          actor: Brand or performance marketing team
          channel: Adobe-linked editing workflow and campaign production
          touchpoints:
            - Publishable social assets
            - Ongoing campaign creative generation
          note: 产品已经用于生产，但多个来源仍指出工作流摩擦和审批风险。
          tone: neutral
        - label: 测试续约与扩张
          actor: Budget owner or operator
          channel: Credit usage, seat expansion, contract renewal
          touchpoints:
            - More teams and more generation volume
            - Procurement renewal decision
          note: 公开证据未披露 NRR、流失率或客户集中度。
          tone: risk
    claimRefs:
      - CU001
      - CU004
      - CU011
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在营销、成本波动和权利治理与规模化交汇处，剩余风险严重度最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余暴露
      rows:
        - label: 排队与服务透明度
          values:
            - label: 高
              tone: critical
            - label: 高
              tone: critical
            - label: 低
              tone: warning
            - label: 高
              tone: critical
        - label: 积分经济性波动
          values:
            - label: 高
              tone: high
            - label: 中高
              tone: high
            - label: 中
              tone: warning
            - label: 中高
              tone: high
        - label: 模型质量不一致
          values:
            - label: 高
              tone: high
            - label: 中
              tone: warning
            - label: 中
              tone: warning
            - label: 中
              tone: warning
        - label: 基础设施 / 供应商集中度
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: high
            - label: 中
              tone: warning
            - label: 中高
              tone: high
        - label: 合成 UGC / 推荐语合规
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 中低
              tone: warning
            - label: 高
              tone: critical
        - label: 肖像相似与众包权利治理
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 早期
              tone: warning
            - label: 高
              tone: critical
    approximationNotes: 序数热力图综合自保留的公开证据；这些类别是投资判断，不是经审计的事件频率。
    claimRefs:
      - CR012
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议遵循一条简单链路：产品与工作流的证明、商业牵引力都是真实的，但在公开尽调缺口补齐前，价格已经计入了其中很大一部分进展。
    data:
      nodes:
        - id: product-proof
          label: 产品证明
          detail: 多模型工作区、Cinema Studio 控制、编辑和运动迁移如今都已存在。
          claimRefs:
            - CV006
            - CV007
        - id: traction
          label: 商业牵引力
          detail: 独立评论指向以营销人员为主的使用、企业收入占比和快速增长的生成量。
          claimRefs:
            - CV004
            - CV005
            - CV013
        - id: financing
          label: 融资信号
          detail: 公司确实获得了已完成的融资，包括 $400M Series B，据报道累计融资 $538M。
          claimRefs:
            - CV001
            - CV002
        - id: price-anchor
          label: 价格锚点
          detail: 公开估值从 1 月约 6.5 倍 ARR，升至 8 月约 7.7 倍年化收入。
          claimRefs:
            - CV011
            - CV012
            - CV016
        - id: durability-risk
          label: 持久性风险
          detail: 竞争、支持摩擦和估值新闻可能跑在经验证的商业质量前面。
          claimRefs:
            - CV008
            - CV009
            - CV010
            - CV015
        - id: recommendation
          label: 建议
          detail: 在收入质量、清算优先权和单位经济性得到验证前，继续研究。
          claimRefs:
            - CV014
            - CV016
      edges:
        - from: product-proof
          to: traction
          label: 促成
          claimRefs:
            - CV006
            - CV007
        - from: traction
          to: financing
          label: 吸引
          claimRefs:
            - CV004
            - CV005
        - from: financing
          to: price-anchor
          label: 设定
          claimRefs:
            - CV001
            - CV011
        - from: price-anchor
          to: durability-risk
          label: 受到……制约
          claimRefs:
            - CV009
            - CV010
        - from: durability-risk
          to: recommendation
          label: 导向
          claimRefs:
            - CV008
            - CV014
    approximationNotes: 这是作者编排的决策链，不是机械评分模型；它用于展示逻辑顺序，而不是分配加权概率。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
