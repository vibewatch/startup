    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、上线与披露的运营规模
        blocks:
          - type: paragraph
            body: >-
              Higgsfield 自有页面将公司描述为面向创作者、代理机构和电影人的原生 AI 创意工作室，而不是单一模型实验室；其身份定位建立在 2025
              年上线和旧金山总部之上。同一套官方材料强调可捆绑访问多个视频模型和工作流控制，这与管理层试图把 Higgsfield
              呈现为碎片化基础模型供给之上的运营层，而非单点解决方案的做法一致。规模披露仍是公司自报、未经独立审计，但方向上具有重要意义：关于页面目前列出 2,500 万用户、8.5 亿次生成、3 亿条视频，以及约 600
              万次日生成，其中包括 200 万条日生成视频。
