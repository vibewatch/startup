  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              当前承销案例应将服务透明度风险、点数经济波动、供应商/平台集中度和合成媒体合规置于一般创业执行风险之前。Higgsfield
              自有产品页面营销“无限制”和多模型工作区，而独立评测描述的是隐藏限流、输出质量波动和预算不确定性，并非稳定的按席位 SaaS。NVIDIA
              案例提供了更积极的解读：公司已经构建自愈基础设施并达到可观规模，但同一证据也显示其依赖具名基础设施和合作伙伴生态。实际含义是，在信任、成本可预测性和权利治理通过运营数据而非产品营销得到证明前，不应把收入增长承销为持久增长。[CR013,
              CR014, CR015]
            claimRefs:
              - CR013
