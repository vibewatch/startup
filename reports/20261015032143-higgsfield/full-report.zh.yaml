              确有可观测性和自愈措施，但也确认了围绕具名供应商的集中度。独立评测补充指出，不同模型的输出一致性仍有差异，抽象层以便利换取控制，因此即使没有硬故障，服务质量也可能下降。[CR002, CR003, CR006,
