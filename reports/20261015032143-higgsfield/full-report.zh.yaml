  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 公司披露的 $700M 年化收入能够持续，企业收入占比保持高位，工作流差异化继续掌控高端创意预算。
        - $5.4B-$6.5B；只有当前估值被证明干净且可重复，而非靠宣传堆出来时，才有上行空间。
        - 如果大型平台填平工作流差距的速度超过 Higgsfield 加深锁定的速度，护城河仍会收窄。
        - 这一情景需要经审计的收入桥接、强劲留存和有说服力的支持成本结构。
      - - 基准
        - 增长仍然强劲，但在尽调补上主要缺口前，投资者会因收入质量和利润率不确定性而打折。
        - $3.5B-$5.4B；只有入场条款足够克制，估值才会围绕最新估值水平波动。
        - 清算优先权负担或更弱的转化经济性，仍可能压低实际回报。
        - 在没有新披露的情况下，这一情景最可能发生：产品故事不错，但验证层仍很薄。
      - - 悲观
        - 在公司证明企业业务能够干净、持久之前，收入质量、支持表现或差异化先行恶化。
        - $1.3B-$3.5B；如果投资者将公司重新定价到更接近早期估值的水平，折价融资或复杂条款融资的风险会上升。
        - 竞争、计费摩擦和不透明的资本结构都可能加速估值重置。
        - 如果新一轮融资依靠故事而非经验证的商业质量，这一情景就会成为现实。
    notes: 情景区间是分析师估计，锚定于公开的 $1.3B 和 $5.4B 融资估值，以及据报道的 $200M ARR 和 $700M 年化收入；它们不是可比公司估值、DCF 或经审计的估值模型。
