      - number: '4.2'
        title: 成本结构、变现深度与资本基础
        blocks:
          - type: paragraph
            body: >-
              公开证据支持计算效率是关键经济杠杆这一判断。TechTimes 和 Sacra 都称，将工作负载迁移至 GMI Cloud 后计算成本下降 45%，这是 AI
              视频毛利率驱动因素仅有的少数直接公开信号之一。变现深度似乎也超出业余爱好者支出：TechTimes 报道每条生成视频约 $30，并描述了一个单独的企业层级，面向年支出超过 $200,000
              的账户，提供共享工作区、优先计算和安全工具。资本方面，2026 年 8 月 B 轮新增 $400M，估值 $5.4B，资金用途包括研发、基础设施、招聘和市场拓展。Sacra
              后续关于现金流盈亏平衡的说法方向上利好，但不能替代毛利率、营运资本或现金余额的披露细节。
