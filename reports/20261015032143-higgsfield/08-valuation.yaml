  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: preference-stack
      missingEvidence: Board-grade cap table, liquidation preferences, participation terms, and any secondary or structured investor protections from the 2026 financings.
      whyItMatters: These terms determine effective entry price, downside protection, and whether the headline valuation overstates what common-equity buyers would actually own.
      diligencePath: Request the current cap table, financing docs, and counsel summary of preference, participation, and pro-rata rights.
      relatedQuestionRefs: [QV001, QV008]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Audited or reviewed bridge from annualized revenue and ARR to paying subscriptions, enterprise share, refunds, credit liabilities, NRR, and concentration.
      whyItMatters: The latest mark can only be defended if reported scale is durable, recurring, and not inflated by credits, short-term campaigns, or concentrated customers.
      diligencePath: Obtain finance-room revenue cohort files, contracted ARR definitions, enterprise concentration schedules, and refund/credit ledger summaries.
      relatedQuestionRefs: [QV002, QV003, QV008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin by workflow, GPU/inference commitments, burn, cash runway, support cost, and complaint-resolution metrics.
      whyItMatters: High-volume video generation can look attractive at the top line while still destroying value if support and compute costs outrun pricing power.
      diligencePath: Request operating model detail for compute spend, contribution margin, support SLAs, refund rates, and monthly cash burn.
