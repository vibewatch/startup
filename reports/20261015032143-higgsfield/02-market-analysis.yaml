      - [Enterprise marketing teams, "Team plans, governance features, and in-house content operations", "All enterprise design-suite or procurement spend", "Marketing operations / creative operations budget owner", "Upmarket path but budget owner evidence remains incomplete"]
      - [Entertainment and likeness licensing adjacency, "Pilot creation and AI-native episodic experimentation", "Broad film/TV production economics", "Creator / studio / rights holder", "Adjacency that expands narrative but is not yet the cleanest SAM proxy"]
    notes: >-
      Scope rows reflect the assigned evidence and analytical boundary of the
      chapter; they are not audited market totals and intentionally separate the
      workflow-software wedge from model-lab or broad media spend.
    claimRefs: [CM001, CM002, CM003, CM004, CM010, CM011]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - [PR Newswire / Higgsfield, "2026", Global, "$250B+ creator economy", null, "Company-issued adjacency lens for the talent and content economy surrounding creator workflows", Low, "Too broad to serve as Higgsfield TAM or AI-video SAM"]
      - [Inc citing Sensor Tower, "2026", Global, "361M+ visits Jan-Jul 2026; >10x YoY", null, "Observed platform traffic from January to July 2026", Medium, "Traffic is demand evidence, not spend or monetized customer count"]
      - [Sacra, "2026", Global, "32M+ users; nearly 1M paying subscribers", null, "Platform adoption lens from Sacra's current 2026 company page", Medium, "User and payer counts are platform scale proxies, not market size"]
      - [Sacra, "2026", Global, "85% of usage from social media marketers; 80% of that segment commercial", null, "Commercial-mix lens showing where present demand concentrates", Medium, "Usage mix is not a spend ceiling and may shift over time"]
      - [Inc, "2026", Global, "$15-$99 monthly individual plans; $65-$150 per-seat team plans", null, "Public pricing lens for willingness to pay across self-serve and team users", Medium, "Price points do not reveal seat counts, retention, or budget share"]
    notes: >-
      The assigned pool lacks an independent AI-video-workflow TAM/SAM/SOM, so
      this table deliberately mixes adjacent-market, traffic, adoption, usage-mix,
      and pricing lenses instead of pretending one broad figure is sufficient.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM012, CM016]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Individual creator, Creator, Creator, Creator, "Generate social clips and experiment with styles or scenes", "Personal software budget", "Lower-cost subscription access and faster iteration"]
      - [Small brand / DTC merchant, Founder or marketer, In-house creative lead or agency partner, Brand, "Turn product shots into many ad variants", "Growth / performance marketing", "Need to ship more creative with smaller production budgets"]
      - [Agency, Agency lead, Creative team, Agency, "Produce more client concepts and permutations from fewer shoots", "Agency operations / client services", "Shared workspace and credits lower production cost per concept"]
      - [Enterprise marketing team, Marketing or studio lead, Creative operations team, Enterprise department, "Governed multi-user content production", "Marketing operations or brand studio", "Need administration, capacity, and workflow consistency"]
      - [AI-native entertainment / rights holder, Creator or studio partner, Director / creative team, "Creator, brand, or studio", "Prototype pilots and licensed likeness content", "Experimental content budget", "Need faster concept-to-screen iteration before full greenlight"]
    notes: >-
      Buyer, user, payer, and budget-owner roles are compiled from public product
      descriptions, pricing disclosures, and third-party reporting; enterprise
      decision authority is directionally supported but not independently enumerated.
    claimRefs: [CM005, CM006, CM009, CM010, CM013]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Evidence-constrained market ladder from broad adjacency to the narrower
      commercial wedge that current Higgsfield usage appears to occupy.
    data:
      items:
        - label: Adjacent creator economy
          value: "$250B+"
          note: "Global creator-economy lens cited in a company-issued PR Newswire release"
          tone: neutral
        - label: Geographic platform reach
          value: "240+"
          unit: "countries / territories"
          note: "Company-issued reach signal, useful for distribution breadth rather than monetized SAM"
          tone: neutral
        - label: Platform user base
          value: "32M+"
          unit: users
          note: "Sacra adoption lens as of September 2026"
          tone: positive
        - label: Paying user base
          value: "~1M"
          unit: paying subscribers
          note: "Sacra says the platform had nearly 1 million paying subscribers"
          tone: positive
        - label: Observed adoption
          value: "361M+"
          unit: "visits Jan-Jul 2026"
          note: "Inc cites Sensor Tower for >10x YoY visits; Sacra separately cites 32M+ users and nearly 1M paying subscribers"
          tone: positive
        - label: Current commercial wedge
          value: "85%"
          unit: "usage from social media marketers"
          note: "Sacra says 80% of that segment was producing commercial work in January 2026"
          tone: positive
    approximationNotes: >-
      This is not a mathematically derived TAM/SAM/SOM stack. It mixes an
      adjacent market lens, geographic reach, observed platform adoption, and
      commercial-usage concentration to show narrowing relevance, not comparable
      shares or conversion rates.
    claimRefs: [CM007, CM008, CM012, CM014, CM016]
