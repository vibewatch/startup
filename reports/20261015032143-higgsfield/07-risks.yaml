callouts:
  - calloutType: "risk"
    title: "Top near-term underwriting risk"
    body: >-
      The most immediate risk is that usage marketing outruns service reality:
      the retained pool pairs an official "No limits" claim with an adverse
      review alleging hidden throttling and weak support transparency.
    claimRefs: ["CR001", "CR004", "CR012"]
  - calloutType: "insight"
    title: "Scale is both proof and dependency"
    body: >-
      NVIDIA's case study supports the view that Higgsfield has built real
      scale and observability, but it also shows how much of the platform's
      performance depends on named infrastructure and partner ecosystems.
    claimRefs: ["CR003", "CR006", "CR014"]
  - calloutType: "recommendation"
    title: "Do not underwrite synthetic-media upside on policy language alone"
    body: >-
      Treat crowdsourced pilots, synthetic UGC, and likeness licensing as
      upside only after the company can show enforceable disclosure, consent,
      moderation, and takedown controls in production workflows.
    claimRefs: ["CR010", "CR012", "CR015"]
