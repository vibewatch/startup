company:
  name: "Higgsfield"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Higgsfield is publicly framed as a San Francisco AI-video creative suite that scaled quickly from a 2024 seed-and-Diffuse milestone into late-2026 enterprise marketing workflows, but the current chapter still relies on secondary reporting for its newest funding and revenue milestones. The assigned pool supports a credible 2024-2026 growth arc while leaving customer definitions, headcount, board structure, and closed-round economics as open diligence asks.
sections:
  - id: "identity-and-scale"
    title: "Identity, launch, and disclosed operating scale"
    body: >-
      Higgsfield's own surfaces describe the company as an AI-native creative studio for creators, agencies, and filmmakers rather than as a single-model lab, and they anchor that identity in a 2025 launch and a San Francisco headquarters. The same official material emphasizes bundled access to multiple video models and workflow controls, which is consistent with management's effort to present Higgsfield as the operating layer on top of fragmented foundation-model supply rather than as a point solution. Scale disclosures are still company-claimed rather than independently audited, but they are directionally important: the about page currently cites 25 million users, 850 million generations, 300 million videos, and roughly 6 million daily generations including 2 million daily videos.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005"]
    tableRefs: ["TO001"]
  - id: "founders-capital-and-stakeholders"
    title: "Founders, capital history, and named stakeholders"
    body: >-
      Public reporting consistently ties Higgsfield to founders Alex Mashrabov and Yerzat Dulat, while the funding narrative shows a fast move from seed financing in 2024 to late-stage pricing in 2026. Sacra's chronology fills in the early capital path with an April 2024 seed and a November 2025 enterprise-plan launch, while TechTimes captures a June 2026 round-in-process before Sacra later reports a closed August 2026 Series B. That sequence matters for diligence because the chapter can name several investors and milestone valuations, but it still lacks primary closing documents, cap-table detail, debt information, and clear governance disclosure beyond the founders and investor syndicate described in secondary sources.
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO012", "CO013"]
    tableRefs: ["TO002", "TO003"]
  - id: "commercialization-risks-and-open-questions"
    title: "Commercialization, adverse signals, and unresolved metrics"
    body: >-
      The late-2026 commercial story is strong on headline momentum but weaker on underwriting detail. Secondary reports say enterprise clients became the majority of revenue by August 2026 and that annualized revenue reached $1 billion in September 2026, calculated by multiplying the latest four weeks by thirteen. This is a run-rate metric, not disclosed ARR or audited revenue, but it supports the view that Higgsfield is moving beyond creator experimentation into production marketing budgets. At the same time, the chapter carries two caution flags. First, February 2026 promotional-content failures created trust and governance risk before the company launched post-incident safeguards. Second, competitor Lotix frames Higgsfield as better for fast visual testing than for full production management; that is not an independent benchmark, but it identifies a workflow-stability question that needs direct diligence rather than extrapolation from growth headlines.
    claimRefs: ["CO010", "CO011", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
