  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows a simple chain: product/workflow proof and commercial traction are real, but the price
      already discounts a lot of that progress before public diligence gaps are closed.
    data:
      nodes:
        - id: product-proof
          label: Product proof
          detail: Multi-model workspace, Cinema Studio controls, editing, and motion transfer exist today.
          claimRefs:
            - CV006
            - CV007
        - id: traction
          label: Commercial traction
          detail: Independent commentary points to marketer-heavy usage, enterprise mix, and fast generation volume.
          claimRefs:
            - CV004
            - CV005
            - CV013
        - id: financing
          label: Financing signal
          detail: Closed capital access is real, with a $400M Series B and $538M total funding reported.
          claimRefs:
            - CV001
            - CV002
        - id: price-anchor
          label: Price anchor
          detail: Public marks moved from roughly 6.5x ARR in January to about 7.7x run-rate revenue in August.
          claimRefs:
            - CV011
            - CV012
            - CV016
        - id: durability-risk
          label: Durability risk
          detail: Competition, support friction, and valuation headlines can outrun verified commercial quality.
          claimRefs:
            - CV008
            - CV009
            - CV010
            - CV015
        - id: recommendation
          label: Recommendation
          detail: Research-more until revenue quality, preferences, and unit economics are verified.
          claimRefs:
            - CV014
            - CV016
      edges:
