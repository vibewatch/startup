      - number: '5.3'
        title: Breadth and integration are visible; repeatability remains the test
        blocks:
          - type: paragraph
            body: >-
              Product maturity is visible in the coexistence of self-serve web workflows, a documented API catalog, and
              an MCP integration discussed by an external practitioner source. The differentiating proposition is
              orchestration: marketers can start from product context, creators can direct camera or motion behavior,
              and developers can call multiple model families through a common interface. Independent coverage broadly
              agrees that this workflow abstraction is more important than any single model. However, the same sources
              describe trade-offs between speed, control, and reliability, and one practical guide warns that product
              identity can drift between generations. Repeatable quality therefore needs customer-level testing rather
              than a conclusion drawn from catalog breadth or polished demonstrations.
            claimRefs:
              - CE004
              - CE009
              - CE010
              - CE011
              - CE015
      - number: '5.4'
        title: Basic safety signals exist, but enterprise assurance is unproven
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows some product-level safeguards: an independent guide reports prohibited-content
              rules, consent requirements for visible faces, and model-provider moderation filters. Another independent
              source reports that users retain ownership of inputs and outputs while granting Higgsfield rights to use
              that material to operate and improve the service. These points are relevant controls and contractual
              considerations, not proof of a complete governance program. None of the assigned sources supplies a public
              uptime history, service-level commitment, security certification, audit report, incident-response record,
              or detailed enterprise data-control package. Those items remain diligence gaps; the absence of them from
              this source pool is not evidence that Higgsfield lacks them.
            claimRefs:
              - CE012
              - CE013
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow orchestration is the visible product wedge
            body: >-
              Official and independent sources align on multi-model access, role-specific workflows, and directed
              controls as the central differentiation rather than ownership of one underlying generation model.
            calloutType: strength
            claimRefs:
