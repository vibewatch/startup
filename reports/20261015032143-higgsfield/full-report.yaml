  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a six-layer workflow from source assets through role-specific controls and model
      orchestration to delivery and governance.
    data:
      layers:
        - label: Intent and source assets
          detail: >-
            Prompts, product links, product photos, reference images, existing clips, and audio can initiate supported
            workflows.
          modules:
            - Prompts
            - Product context
            - Reference media
        - label: Role-specific workflows
          detail: Product surfaces organize generation around creator, marketing, cinematic, and transformation jobs.
          modules:
            - AI Video
            - Cinema Studio
            - Marketing Studio
            - Genjutsu
        - label: Creative control
          detail: Camera, lens, motion, frame, and identity controls aim to direct generation beyond a plain prompt.
          modules:
            - Camera and lens controls
            - Motion references
            - First and last frames
            - Identity-preservation tools
        - label: Model orchestration
          detail: A curated catalog brokers Higgsfield and third-party image and video models through shared product surfaces.
          modules:
            - Higgsfield image tools
            - Kling, Veo, Seedance, Wan, and other families
            - Model-specific endpoints
        - label: Delivery and integrations
          detail: Web generation, API jobs, SDKs, REST, MCP, polling, and webhooks connect workflows to users and software.
          modules:
            - Web workspace
            - API and SDKs
            - MCP clients
            - Status polling or webhooks
        - label: Storage, safety, and assurance
          detail: >-
            Outputs require downstream storage, while moderation and consent rules operate without a public
            enterprise-assurance package in this evidence set.
          modules:
            - Time-limited hosted outputs
            - Content screening
            - Face-consent requirements
            - Unresolved SLA and security evidence
    approximationNotes: >-
      The layer order is an analyst synthesis of public workflows and does not represent a disclosed internal
      architecture.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE009
      - CE010
      - CE012
      - CE016
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Higgsfield appears to land through self-serve creative experimentation and expand toward team workflow,
      procurement, and annual enterprise contracts.
    data:
      nodes:
        - label: Discover self-serve use case
          actor: Creator, freelancer, or growth marketer
          channel: Official site, AI video demos, creator education
          touchpoints:
            - Free or lightweight trial behavior
            - Multi-model video generation and quick ad concepts
          note: Broad creator and marketer messaging anchors initial demand.
          tone: positive
        - label: Validate workflow fit
          actor: Freelancer, DTC brand, or agency operator
          channel: Marketing Studio, Cinema Studio, product workflows
          touchpoints:
            - Faster ad variants
            - Storyboards, product scenes, and campaign experiments
          note: Best-public proof is around campaign throughput rather than deep retention.
          tone: neutral
        - label: Bring team into shared workspace
          actor: Creative lead or agency manager
          channel: Shared credits, approvals, comments, and collaboration
          touchpoints:
            - Team workspace
            - Asset sharing and review loops
          note: Independent coverage frames the product as a production stack, not just a clip tool.
          tone: positive
        - label: Clear enterprise procurement
          actor: Admin, security, or procurement owner
          channel: Contact Sales, SSO/SAML review, security assessment
          touchpoints:
            - Annual contract discussion
            - Security documentation and centralized billing
          note: Expansion into enterprise depends on governance and buying-process maturity.
          tone: warning
        - label: Reach production deployment
          actor: Brand or performance marketing team
          channel: Adobe-linked editing workflow and campaign production
          touchpoints:
            - Publishable social assets
            - Ongoing campaign creative generation
          note: Production adoption exists, but multiple sources still flag workflow friction and approval risk.
          tone: neutral
        - label: Test renewal and expansion
          actor: Budget owner or operator
          channel: Credit usage, seat expansion, contract renewal
          touchpoints:
            - More teams and more generation volume
            - Procurement renewal decision
          note: Public evidence does not disclose NRR, churn, or customer concentration.
          tone: risk
    claimRefs:
      - CU001
      - CU004
      - CU011
      - CU014
      - CU015
