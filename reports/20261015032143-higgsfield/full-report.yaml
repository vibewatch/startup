            body: >-
              Public reporting consistently ties Higgsfield to founders Alex Mashrabov and Yerzat Dulat, while the
              funding narrative shows a fast move from seed financing in 2024 to late-stage pricing in 2026. Sacra's
              chronology fills in the early capital path with an April 2024 seed and a November 2025 enterprise-plan
