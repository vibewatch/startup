      - number: '4.2'
        title: Cost structure, monetization depth, and capital base
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports the view that compute efficiency is the key economic lever. TechTimes and Sacra
              both report that migrating workloads to GMI Cloud cut compute costs by 45%, which is one of the few direct
              public signals on gross-margin drivers in AI video. Monetization depth also appears to extend beyond
              hobbyist spend: TechTimes reports roughly $30 per generated clip and describes a separate enterprise tier
              for accounts spending more than $200,000 annually, with shared workspaces, priority compute, and safety
              tooling. On capital, the August 2026 Series B added $400 million at a $5.4 billion valuation, with stated
              uses including R&D, infrastructure, hiring, and go-to-market expansion. Sacra's later claim of cash-flow
              break-even is directionally positive, but it is not a substitute for disclosed gross margin,
              working-capital, or cash-balance detail.
            claimRefs:
