  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitute
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence places Higgsfield primarily in the application layer of AI video: its official
              pages emphasize a workspace that exposes multiple external models, while independent coverage describes a
              short-form creation platform for creators, brands, and social-media marketers. The underlying model
              boundary is not fully settled. TechJournal says Higgsfield does not build its own models and instead
              chains third-party systems, whereas a company-issued release says it develops generative video and image
              models while also integrating third-party models. That contradiction prevents this chapter from treating
              foundation-model capability as verified. The underwritten market is therefore the narrower workflow budget
              previously split across camera crews, agencies, editing tools, asset-generation products, and
              campaign-variation workflows. The status quo substitute is fragmented production across tools and manual
              iterations; Higgsfield's application-layer pitch is to collapse that overhead into one multi-model
              environment.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM011
      - number: '2.2'
        title: Sizing lenses and observed demand
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not contain a clean third-party TAM, SAM, and SOM stack for AI video marketing
              workflows, so the best defensible approach is to triangulate from adjacent market size, observed demand,
              and commercial concentration. The broadest lens is company-issued: PR Newswire cites a creator economy
              valued at over $250 billion globally, which is too broad to serve as Higgsfield's TAM but does frame why
              investors and suppliers care about creator tooling. More concrete signals come from current adoption and
              monetization: Inc cites more than 361 million Higgsfield visits from January to July 2026 and says that
              was more than 10x the same period in 2025, while Sacra's current 2026 page says the platform had more than
              32 million users and nearly 1 million paying subscribers. Sacra also says social-media marketers
              represented 85% of usage in January 2026 and that 80% of that segment was producing commercial work. These
              figures indicate that current demand is skewing toward ad-production workflows rather than hobbyist
              experimentation, but they do not establish a SAM because the sources do not disclose the spend
              denominator, geographic mix, or segment retention.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM014
              - CM015
