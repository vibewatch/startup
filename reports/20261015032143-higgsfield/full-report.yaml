  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the sequence of how acquisition, workflow usage, enterprise upsell, and compute
      efficiency connect to revenue scale, but it does not support a numeric conversion funnel or gross-profit
      waterfall.
    data:
      nodes:
        - id: entry
          label: Free + paid entry
          detail: Users can start for free, while some higher-usage tiers require paid plans.
          claimRefs:
