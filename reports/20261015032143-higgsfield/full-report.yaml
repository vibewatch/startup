companyProfile:
  summary: >-
    Higgsfield is an AI-native creative suite that wraps multiple video and image models into a single workflow for
    creators, agencies, marketers, and enterprise teams. The company appears to have moved from creator-first
    experimentation into large-scale commercial usage, with public claims of rapid user growth, broad enterprise
    adoption, and late-2026 annualized revenue scaling. The current diligence picture is still incomplete because the
    public record does not resolve revenue quality, margin structure, retention, runway, or full capital-stack terms.
