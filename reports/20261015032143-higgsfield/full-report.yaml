      - number: '2.3'
        title: Buyer map, adoption drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The evidence shows three overlapping buyer paths. First are creators and prosumers buying self-serve
              subscriptions to make social clips and test ideas. Second are agencies and direct-to-consumer brands using
              the product as a cheaper and faster way to produce many ad variations, which is where current pricing and
              heavy credit consumption become meaningful. Third are enterprise marketing or studio teams adopting shared
              workspaces, pooled credits, and governance features as Higgsfield moves upmarket. The adoption driver is
              speed: Adweek quotes Alex Mashrabov saying marketing teams struggle to decide each day what deserves
              younger audiences' attention before the moment passes, and Inc explicitly ties Higgsfield's traction to
              declining creative budgets and rising demand for fresh social content. The main constraint is that brand
              and enterprise buyers still worry about authenticity, disclosure, and job-displacement optics; Inc says
              some of Higgsfield's largest clients do not want to publicly discuss their use of the platform. That means
              budget ownership may broaden faster than enterprise referenceability, which is relevant to how durable the
              company's current demand curve is.
            claimRefs:
              - CM005
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
