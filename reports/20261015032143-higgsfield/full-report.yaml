      - number: '3.3'
        title: Moat durability depends on workflow compression more than hard lock-in
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a hard technological moat from exclusive model access, because
              Higgsfield itself emphasizes integration of third-party models and competitor-authored comparisons
              explicitly recommend direct APIs, focused editors, or finishing suites for certain jobs. That means buyers
              can multi-home: they can keep Higgsfield for camera-led ideation and short-form commercial generation
              while still relying on Runway-like editors, direct model APIs, or finishing products when predictability
              or post-production matters more. The bullish case is that Higgsfield keeps enough workflow steps inside
              one environment to reduce vendor switching for agencies and marketing teams. The bearish case is that
              breadth broadens the execution surface faster than switching costs deepen, especially as the company
              expands into enterprise automation, API use cases, and entertainment-adjacent surfaces such as Original
              Series and likeness licensing. In other words, the moat is convenience and workflow speed, not buyer
              captivity.
            claimRefs:
              - CP011
              - CP013
              - CP014
              - CP015
