      - number: '1.3'
        title: Commercialization, adverse signals, and unresolved metrics
        blocks:
          - type: paragraph
            body: >-
              The late-2026 commercial story is strong on headline momentum but weaker on underwriting detail. Secondary
              reports say enterprise clients became the majority of revenue by August 2026 and that annualized revenue
              reached $1 billion in September 2026, calculated by multiplying the latest four weeks by thirteen. This is
              a run-rate metric, not disclosed ARR or audited revenue, but it supports the view that Higgsfield is
              moving beyond creator experimentation into production marketing budgets. At the same time, the chapter
              carries two caution flags. First, February 2026 promotional-content failures created trust and governance
              risk before the company launched post-incident safeguards. Second, competitor Lotix frames Higgsfield as
              better for fast visual testing than for full production management; that is not an independent benchmark,
              but it identifies a workflow-stability question that needs direct diligence rather than extrapolation from
              growth headlines.
