      - number: '4.3'
        title: Underwriting gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed. Higgsfield has unusually strong public growth signals, evidence
              of increasing usage-based monetization, and a fresh capital raise that should reduce near- term financing
              pressure if the break-even claim is durable. But the public record still does not disclose the metrics
              that turn growth into an underwritable margin story: gross margin by product line, cohort retention or
              NRR, concentration of spend across enterprise accounts, and post-Series-B cash plus runway. The
              model-aggregator strategy also introduces supplier risk because underlying model providers can reprice
              access, restrict APIs, or build competing workflow layers. Netting those points together, revenue momentum
              is real and capital intensity may be improving, but revenue quality and durability remain only partially
              evidenced.
            claimRefs:
