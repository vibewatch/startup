          - type: callout
            title: Product breadth exceeds public assurance evidence
            body: >-
              The assigned sources document features, API mechanics, and some moderation rules but do not provide the
              SLA, incident, certification, or audit evidence required to underwrite enterprise reliability and
              governance.
            calloutType: risk
