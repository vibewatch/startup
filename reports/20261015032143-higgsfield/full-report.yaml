  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix spans self-serve creators through enterprise teams
        blocks:
          - type: paragraph
            body: >-
              Higgsfield's public customer story is intentionally wide, but the overlap across official and independent
              sources is still useful. The official surfaces consistently target creators, marketers, brands, agencies,
              creative teams, and developers, while the enterprise surface packages the product for business teams that
              need shared workspaces, security controls, and centralized buying. Independent reviews reinforce that
              split: the strongest current use cases appear to be AI-first creators, freelancers, e-commerce brands, and
              performance marketers on the self-serve side, with agencies and enterprise creative teams becoming the
              explicit upmarket motion. That is a healthier signal than a single vague "anyone can use it" claim because
              it implies Higgsfield can land in creator or campaign teams first, then move into managed enterprise
              workflows once procurement, governance, and collaboration matter.
