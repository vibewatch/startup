  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Company-reported $700M annualized revenue is durable, enterprise mix remains high, and workflow
          differentiation keeps command of premium creative budgets.
        - $5.4B-$6.5B; upside exists only if the current mark proves clean and repeatable rather than promotional.
        - Moat still compresses if larger platforms close the workflow gap faster than Higgsfield deepens lock-in.
        - Would require audited revenue bridge, strong retention, and convincing support economics.
      - - Base
        - >-
          Growth remains strong but investors haircut quality-of-revenue and margin uncertainty until diligence closes
          the main gaps.
        - $3.5B-$5.4B; valuation clusters around the latest mark only with disciplined entry terms.
        - Preference overhang or weaker conversion economics can still pressure effective returns.
        - Most likely without new disclosure because the product story is good but the verification layer is still thin.
      - - Bear
        - >-
          Revenue quality, support performance, or differentiation deteriorate before the company proves clean
          enterprise durability.
        - >-
          $1.3B-$3.5B; down-round or heavy-structure risk rises if investors re-rate the business closer to its earlier
          mark.
        - Competition, billing friction, and opaque capital structure can all accelerate the reset.
        - Becomes live if new fundraising depends on narrative rather than verified commercial quality.
    notes: >-
      Scenario ranges are analyst estimates anchored on public $1.3B and $5.4B financing marks plus reported $200M ARR
      and $700M annualized revenue; they are not market comps, a DCF, or an audited valuation model.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Assigned sources show a compressed path from 2024 seed financing to 2026 enterprise commercialization and
      late-stage fundraising.
    data:
      items:
        - date: Apr 2024
          label: Seed financing and Diffuse launch
          detail: $8M seed financing coincided with the launch of Diffuse, the company's first mobile AI-video app.
        - date: '2025'
          label: Commercial platform launch
          detail: >-
            Higgsfield says it launched in 2025 and set out to make professional video and image creation accessible to
            anyone with an idea.
        - date: Nov 2025
          label: Team and Enterprise Plans
          detail: Sacra says shared-workspace Team and Enterprise Plans formalized the company's upmarket motion.
        - date: Feb 2026
          label: Trust and moderation controversy
          detail: >-
            TechTimes says Forbes documented racist AI-generated promotional content and Higgsfield's X account was
            suspended that week.
        - date: Mar 2026
          label: Similarity Scoring launch
          detail: >-
            Post-controversy, Higgsfield launched Similarity Scoring to flag potential likeness and brand-logo overlaps
            before content ships.
        - date: Jun 2026
          label: Late-stage financing talks
          detail: >-
            TechTimes reported discussions for a $300M-$500M round at a $5B pre-money valuation, with the round not yet
            closed.
        - date: Aug 2026
          label: Enterprise mix inflects
          detail: >-
            AIBase reported enterprise clients had become the majority of revenue after being less than 25% of revenue
            in January.
        - date: Aug 2026
          label: Series B closes
          detail: Sacra reports a $400M Series B at a $5.4B valuation, bringing total reported funding to $538M.
        - date: Sep 2026
          label: Run-rate reaches $1B
          detail: >-
            Sacra reports $1B in annualized revenue using the latest four weeks multiplied by thirteen; this is not
            disclosed ARR or audited revenue.
    claimRefs:
      - CO002
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Evidence-constrained market ladder from broad adjacency to the narrower commercial wedge that current Higgsfield
      usage appears to occupy.
    data:
      items:
        - label: Adjacent creator economy
          value: $250B+
          note: Global creator-economy lens cited in a company-issued PR Newswire release
          tone: neutral
        - label: Geographic platform reach
          value: 240+
          unit: countries / territories
          note: Company-issued reach signal, useful for distribution breadth rather than monetized SAM
          tone: neutral
        - label: Platform user base
          value: 32M+
          unit: users
          note: Sacra adoption lens as of September 2026
          tone: positive
        - label: Paying user base
          value: ~1M
          unit: paying subscribers
          note: Sacra says the platform had nearly 1 million paying subscribers
          tone: positive
        - label: Observed adoption
          value: 361M+
          unit: visits Jan-Jul 2026
          note: >-
            Inc cites Sensor Tower for >10x YoY visits; Sacra separately cites 32M+ users and nearly 1M paying
            subscribers
          tone: positive
        - label: Current commercial wedge
          value: 85%
          unit: usage from social media marketers
          note: Sacra says 80% of that segment was producing commercial work in January 2026
          tone: positive
    approximationNotes: >-
      This is not a mathematically derived TAM/SAM/SOM stack. It mixes an adjacent market lens, geographic reach,
      observed platform adoption, and commercial-usage concentration to show narrowing relevance, not comparable shares
      or conversion rates.
