  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans workflow platforms, model-native routes, and finishing stacks
        blocks:
          - type: paragraph
            body: >-
              The assigned pool points to a broader competitive set than "AI video generator" alone. Higgsfield is
              framed by its own product surfaces and by independent reviews as a workflow layer that combines multiple
              hosted video models, camera controls, reference handling, and adjacent creative tools inside one account
              rather than as a single foundational model. That places its direct comparison set against workflow
              platforms such as Runway and Magic Hour, against model-native routes such as Kling or Sora/Veo when a
              buyer cares about specific motion or realism behavior, and against status-quo stacks where teams stitch
              together one model, one editor, and separate post-production steps. The company's October 2026 funding
              release also matters competitively because it signals enough public scale to attract agencies and
              marketers, not just hobby creators, but the assigned evidence still leaves many rival scale metrics
              undisclosed. The practical implication is that Higgsfield competes as a workflow orchestrator first and as
              a model provider second.
