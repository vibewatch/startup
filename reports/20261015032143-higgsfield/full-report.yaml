    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, launch, and disclosed operating scale
        blocks:
          - type: paragraph
            body: >-
              Higgsfield's own surfaces describe the company as an AI-native creative studio for creators, agencies, and
              filmmakers rather than as a single-model lab, and they anchor that identity in a 2025 launch and a San
              Francisco headquarters. The same official material emphasizes bundled access to multiple video models and
              workflow controls, which is consistent with management's effort to present Higgsfield as the operating
              layer on top of fragmented foundation-model supply rather than as a point solution. Scale disclosures are
              still company-claimed rather than independently audited, but they are directionally important: the about
              page currently cites 25 million users, 850 million generations, 300 million videos, and roughly 6 million
              daily generations including 2 million daily videos.
