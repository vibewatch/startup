  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product packages generation into role-specific workflows
        blocks:
          - type: paragraph
            body: >-
              Higgsfield is not presented as one foundation model. Its public surfaces combine video and image models
              with specialized workflows for cinematic control, marketing production, motion transfer, and programmatic
              access. The customer workflow begins with a prompt, product page, product photo, or reference asset and
              moves through model selection, generation, review, and export. Official copy emphasizes one workspace and
              detailed camera or motion controls, while independent guides describe the practical benefit as less tool
              switching for creators and marketers. The evidence supports a broad product surface, but module
              availability, output quality, and usage economics can vary by selected model or plan and should not be
              treated as uniform.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
              - CE014
