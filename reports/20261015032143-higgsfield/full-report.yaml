      - number: '5.2'
        title: A control plane brokers external models and Higgsfield workflows
        blocks:
          - type: paragraph
            body: >-
              The operating model visible in public documentation is a control plane between user intent and a curated
              model catalog. The web workspace supplies camera, motion, frame-reference, and editing controls; the API
              exposes model endpoints through SDKs or REST; and the MCP connector brings generation into compatible
              agent conversations. API jobs are asynchronous and require polling or webhooks, while outputs must be
              copied to customer storage because hosted availability is time-limited. This architecture can reduce
              integration work and let users swap models without rebuilding an entire workflow. It also concentrates
              dependency risk in Higgsfield's catalog decisions, third-party model availability, queueing, billing, and
              per-model control compatibility.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
