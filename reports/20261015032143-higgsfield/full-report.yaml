        title: Exhibits
        blocks:
          - type: callout
            title: Convenience moat, not captivity moat
            body: >-
              The evidence supports Higgsfield as a strong workflow compressor, but not as a route that forces buyers to
              abandon specialist editors, direct APIs, or finishing suites.
