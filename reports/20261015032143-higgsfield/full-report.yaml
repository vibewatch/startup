        - id: workspace
          label: Multi-model workspace access
          detail: Higgsfield monetizes access to multiple leading video models inside one creative workspace.
          claimRefs:
            - CI001
        - id: workflow
          label: Product-link and image workflows
          detail: Click-to-Ad turns a product URL or image into ad-ready creative for professional teams.
