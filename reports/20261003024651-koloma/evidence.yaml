evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-revenue-and-customers
    missingEvidence: >-
      Audited financial statements or disclosures detailing customer commitments, commercial pilot offtake agreements,
      or recurring revenues.
    whyItMatters: >-
      Validates whether Koloma has established commercial traction and verifiable customer economic willingness-to-pay
      ahead of commercial field commissioning.
    diligencePath: >-
      Request confidential customer pipeline data, letters of intent, and offtake agreement term sheets directly from
      Koloma management during technical diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: well-flow-rates-and-commercial-viability
    missingEvidence: >-
      Continuous hydrogen flow rates, gas purity levels, and production depletion curves from operating exploration
      wells.
    whyItMatters: >-
      Without empirical well flow data, unit production economics ($0.50–$1.50/kg) and addressable market sizing remain
      speculative models.
    diligencePath: >-
      Review state oil and gas regulatory completion filings and test results from Koloma's Idaho and Midwest
      exploratory drilling programs.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: commercial-well-performance
    missingEvidence: >-
      Comparable hydrogen concentration, sustained flow, pressure, decline, reserve, recovery, and cost data for Koloma
      and direct exploration peers.
    whyItMatters: >-
      Without normalized field data, proprietary targeting claims cannot be translated into a defensible production
      advantage.
    diligencePath: >-
      Obtain well-test packages and third-party reserve or resource reviews under NDA, then normalize results by
      geology, test duration, and measurement method.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing-and-packaging
    missingEvidence: >-
      Customer prices, units, delivery terms, contract periods, volume commitments, discount mechanics, and comparable
      peer pricing.
    whyItMatters: >-
      The absence of common price denominators prevents analysis of willingness to pay, substitution economics, or
      margin durability.
    diligencePath: >-
      Review executed customer proposals, term sheets, offtake agreements, and peer procurement records with price,
      unit, geography, and delivery basis preserved.
    relatedQuestionRefs:
      - QP006
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-distribution
    missingEvidence: >-
      Binding offtake commitments, transport obligations, interconnection requirements, buyer qualification tests,
      multi-homing rights, and termination terms.
    whyItMatters: >-
      An investor relationship does not establish distribution power, customer lock-in, or the cost and time required
      for a buyer to switch supply.
    diligencePath: >-
      Inspect signed offtake and collaboration agreements and interview counterparties about qualification, logistics,
      exclusivity, and fallback suppliers.
    relatedQuestionRefs:
      - QP005
      - QP009
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A company-confirmed financing ledger reconciling equity, debt, grants, strategic investments, and cumulative
      proceeds.
    whyItMatters: >-
      The $394 million and $306.44 million totals may use different instruments or cutoffs, so neither should be treated
      as cash available.
    diligencePath: >-
      Reconcile board-approved financing schedules, bank receipts, debt documents, grant awards, and current cash
      balances.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Audited financial statements detailing quarterly cash burn rates, net operating losses, and current cash on hand.
    whyItMatters: >-
      Without primary cash burn disclosures, underwriting forward capital adequacy relies on rough estimates of
      stratigraphic well costs.
    diligencePath: Request confidential quarterly financial statements and treasury reports during formal investor due diligence.
  - type: missing-source
    severity: blocking
    topic: empirical-wellhead-flow-rates
    missingEvidence: Empirical wellhead flow rate, gas concentration, and sustained reservoir pressure data from Koloma test wells.
    whyItMatters: >-
      Direct reservoir productivity data is required to establish commercial viability and validate low-cost unit
      economic models.
    diligencePath: Obtain certified well completion reports and flow test logs from Idaho and Kansas test drill sites.
  - type: unresolved-regulatory
    severity: material
    topic: 45v-lifecycle-certification
    missingEvidence: >-
      Official regulatory determination regarding whether geologic hydrogen qualifies for the full $3.00/kg clean
      hydrogen tax credit.
    whyItMatters: >-
      Offtake monetization and realized gross margin targets are heavily dependent on statutory clean energy production
      incentives.
    diligencePath: Review Department of Energy lifecycle GHG methodology filings and IRS guidance on geologic extraction.
  - type: missing-source
    severity: material
    topic: well-production-data
    missingEvidence: >-
      Verified gas purity analysis, continuous flow test records, and reservoir pressure decline curves from completed
      stratigraphic test wells in Kansas and Idaho.
    whyItMatters: >-
      Without empirical flow rates and reservoir pressure measurements, commercial extraction viability, capital
      intensity per kilogram, and subsurface depletion rates cannot be independently validated.
    diligencePath: >-
      Request third-party engineering log audits and state regulatory well completion filings from the Kansas
      Corporation Commission and Idaho Department of Lands upon commercial testing.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: surface-facilities-and-processing
    missingEvidence: >-
      Detailed engineering specifications for wellhead gas separation, helium/methane co-product processing facilities,
      and midstream compression infrastructure.
    whyItMatters: >-
      Natural hydrogen extracted from underground traps often requires separation from carrier gases and transport
      compression, directly impacting wellhead levelized cost of energy.
    diligencePath: >-
      Review vendor RFP releases and engineering, procurement, and construction (EPC) contract disclosures for planned
      demonstration surface facilities.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: named-customer-gap
    missingEvidence: >-
      Executed customer contracts or offtake agreements naming the buyer, product, committed volume, price mechanism,
      start date, term, and conditions precedent.
    whyItMatters: >-
      Without contract proof, investors, suppliers, and prospective buyers cannot be counted as customers or used to
      support revenue durability.
    diligencePath: >-
      Review the customer and offtake contract schedule in the data room and confirm material terms directly with at
      least two named counterparties.
    relatedQuestionRefs:
      - QU003
      - QU006
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: adoption-metrics-gap
    missingEvidence: >-
      Customer count, active pilots, production deployments, delivered kilograms, utilization, conversion rates, and
      customer-derived revenue by period.
    whyItMatters: >-
      Internal technical deployment and exploration activity cannot quantify external adoption or support a customer
      growth trajectory.
    diligencePath: >-
      Obtain a monthly customer and pilot cohort export reconciled to invoices, delivery records, and production data
      for the last 24 months.
    relatedQuestionRefs:
      - QU002
      - QU008
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Renewal, churn, NRR, GRR, contract duration, customer satisfaction, expansion, and top-customer revenue
      concentration metrics.
    whyItMatters: >-
      Durability, land-and-expand potential, and counterparty concentration cannot be assessed without contract and
      cohort evidence.
    diligencePath: >-
      Recalculate retention and concentration from signed agreements, invoices, and counterparty-level revenue,
      separating pilots from production contracts.
    relatedQuestionRefs:
      - QU004
      - QU005
      - QU010
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: material
    topic: adverse-customer-evidence
    missingEvidence: >-
      A complete record of cancelled discussions, failed pilots, blocked deployments, customer complaints, procurement
      objections, and reasons for non-conversion.
    whyItMatters: >-
      The retained reporting establishes exploration uncertainty but does not reveal whether commercial counterparties
      have rejected or delayed Koloma projects.
    diligencePath: >-
      Review the CRM loss log, pilot postmortems, board materials, complaint records, and references from counterparties
      that declined or paused engagement.
    relatedQuestionRefs:
      - QU007
      - QU009
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: blocking
    topic: wellhead-productivity
    missingEvidence: >-
      Empirical downhole flow rates, gas purity concentrations, and continuous production pressure measurements from
      Koloma's Idaho or Kansas test wells.
    whyItMatters: >-
      Without empirical flow rates, subsurface hydrogen volume and production economics cannot be validated beyond
      theoretical geological modeling.
    diligencePath: >-
      Request confidential technical well logs, gas chromatography assays, and reservoir pressure test results from
      Koloma engineering leadership under NDA.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: blocking
    topic: empirical-wellhead-flow-data
    missingEvidence: >-
      Disclosed hydrogen concentrations, flow rates, and sustained reservoir pressures from Idaho and Kansas test drill
      sites.
    whyItMatters: >-
      Direct reservoir productivity data is required to substantiate commercial extraction viability and justify an
      $800M+ valuation.
    diligencePath: >-
      Request certified well testing logs and geological completion reports from Cascade Exploration and Koloma
      engineering.
  - type: private-evidence-only
    severity: material
    topic: corporate-cash-burn
    missingEvidence: Audited financial statements detailing quarterly cash burn rates, exploration capex, and treasury cash balances.
    whyItMatters: >-
      Validating the remaining cash runway beyond 2026 requires primary operating expense and drilling capital outlay
      records.
    diligencePath: Examine internal financial statements and board reporting packages during confidential investor diligence.
  - type: private-evidence-only
    severity: material
    topic: secondary-transaction-clearing-prices
    missingEvidence: Clearing prices, transaction volumes, and cap-table transfer restrictions for pre-IPO secondary share trades.
    whyItMatters: >-
      Marketplace quotes on Forge and EquityZen do not display executed volume, leaving market-clearing equity marks
      unverified.
    diligencePath: Review company-approved secondary transfer logs and right-of-first-refusal waiver records.
