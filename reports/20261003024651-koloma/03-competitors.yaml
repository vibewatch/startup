callouts:
  - calloutType: strength
    title: Integrated capability is the credible differentiation thesis
    body: >
      Koloma combines proprietary-data claims, a cloud-and-AI geoscience platform signal,
      physical exploration, capital-planning capacity, and an industrial investor. That is
      broader than a pure land-acquisition or software-only strategy, although superiority
      has not been demonstrated with comparative field results.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP016
  - calloutType: risk
    title: The moat remains pre-production
    body: >
      A permitted data-gathering well and a large funding base can improve the odds of
      learning, but neither establishes commercial recovery, repeatable economics, buyer
      adoption, or defensible pricing. Those missing proofs are the central competitive
      diligence items.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP014
      - CP015
      - CP016
