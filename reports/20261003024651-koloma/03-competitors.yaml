        - label: Gold Hydrogen
          x: 5
          y: 3
          detail: "Resource explorer with active drilling reported"
        - label: Snowfox Discovery
          x: 1
          y: 1
          detail: "Exploration technology developer"
        - label: Getech
          x: 1
          y: 4
          detail: "Established geological data and software provider"
        - label: Hydroma
          x: 5
          y: 5
          detail: "Commercial natural-hydrogen production reference"
    approximationNotes: >
      Ordinal analyst coding, not measured scores. X reflects the reported operator-versus-
      tool-provider model; Y uses 1 for technology development, 2 for land or test activity,
      3 for active drilling, 4 for an established commercial tool, and 5 for reported
      commercial resource production.
