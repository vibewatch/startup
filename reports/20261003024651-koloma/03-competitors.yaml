figures:
  - id: FP001
    title: Competitive positioning by business model and public operating maturity
    type: quadrant
    summary: >
      Analyst-coded ordinal map separates resource operators from data providers and
      distinguishes exploration activity from reported commercial production.
    data:
      xAxis:
        min: 1
        max: 5
        label: "Business model: 1 = data/tool provider; 5 = resource operator"
      yAxis:
        min: 1
        max: 5
        label: "Public operating maturity: 1 = development; 5 = commercial production"
      points:
        - label: Koloma
          x: 5
          y: 2
          detail: "Resource explorer with reported stratigraphic test activity"
        - label: Max Power
          x: 5
          y: 2
          detail: "Resource explorer with a large reported land position"
        - label: HyTerra
          x: 5
