company:
  name: Koloma
chapter:
  number: 3
  title: Competitors
  summary: >
    Koloma's clearest competitive advantages are its reported funding scale, an integrated
    data-and-drilling model, and an industrial investor relationship with Mitsubishi Heavy
    Industries. Those signals do not yet establish a durable production moat: reviewed
    evidence does not disclose commercial well performance, customer pricing, binding
    offtake, or switching economics, and third-party funding totals conflict.
sections:
  - id: competitive-landscape
    title: A frontier market split between operators and exploration enablers
    body: >
      The visible natural-hydrogen field is not a single peer set. One group pursues the
      asset-heavy exploration model: Koloma, Max Power Mining, HyTerra, Gold Hydrogen,
      H2EX, and Hydroma seek or operate physical resource positions. A second group,
      including Snowfox Discovery and Getech, sells or develops the data and geological
      tools used to improve prospect selection. An independent issuer's comparison
      identifies this strategic split, but it is an editorial aggregation rather than an
      independently verified benchmark, so its acreage, funding, and operating-status
      entries remain single-source indicators. Within that comparison, Koloma is reported
      as the capital leader, Max Power as the disclosed acreage leader, HyTerra and Gold
      Hydrogen as active drillers, and Hydroma as the commercial-production reference.
      Manufactured hydrogen, internal buyer projects, and continued reliance on incumbent
      supply are relevant substitutes, but the reviewed source set does not quantify them
      on a comparable price, reliability, or emissions basis. The resulting landscape is
      useful for identifying strategic archetypes, not for declaring a winner.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP012
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: differentiation
    title: Koloma combines subsurface data, drilling, capital planning, and industrial access
    body: >
      Koloma presents a hybrid model rather than a pure acreage or software strategy.
      Mitsubishi Heavy Industries describes the company as using technology, proprietary
      data, and human capital to identify and commercialize geologic hydrogen globally.
      A company-issued systems role adds implementation detail: the planned geoscience
      platform integrates cloud computing, artificial intelligence, and large-scale data
      processing. A separate company-issued finance role calls for capital budgeting,
      downside planning, cash forecasting, and support for exploration, appraisal,
      development, and first-of-a-kind projects. Together these sources indicate an
      organization designed to combine prospect selection with physical development and
      disciplined allocation of exploration capital. They do not prove that the models
      predict productive reservoirs better than competitors, because both job listings are
      company-issued signals rather than performance evidence. A supplier case study also
      reports a coordinated brand system spanning six subsidiaries; that may support
      multi-jurisdiction expansion and stakeholder engagement, but it is supplier-issued
      evidence and not proof of operating scale. Koloma's technology and organizational
      breadth therefore look differentiated, while the accuracy and transferability of its
      subsurface advantage remain unverified.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP016
    tableRefs:
      - TP002
  - id: moat-and-commercialization
    title: Capital and partnerships help, but commercial proof determines moat durability
    body: >
      Capital availability matters in a business where dry holes and long appraisal cycles
      can consume substantial resources. One market comparison reports $394 million of
      funding for Koloma, while Forge reports $306.44 million; the two figures should not
      be blended because their coverage and methodology are not reconciled. Forge also
      shows no current Forge Price, underscoring the limited transparency of private-market
      pricing even though it lists historical financing data. Mitsubishi Heavy Industries'
      investment is strategically relevant because the investor explicitly frames hydrogen
      ecosystem development as a core strategy, but an investment and collaboration intent
      are not a binding offtake agreement, distribution contract, or customer commitment.
      The most important adverse evidence comes from Idaho: the reported Twin Peaks 1W
      well is a stratigraphic data-gathering test, and recoverability remains uncertain.
      The same source describes Mali as the only commercially producing natural-hydrogen
      well, emphasizing how little operating proof exists for the category. No reviewed
      source discloses Koloma's customer price, contract packaging, buyer switching costs,
      multi-homing behavior, or committed volumes. Koloma's moat is therefore best treated
      as a funded capability stack whose durability still depends on repeatable well results
      and commercial agreements.
    claimRefs:
      - CP001
      - CP007
      - CP008
      - CP009
      - CP012
      - CP013
      - CP014
      - CP015
      - CP016
    tableRefs:
      - TP003
