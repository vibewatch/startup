chapter:
  number: 7
  title: "Risks"
  summary: "Koloma faces compounding subsurface, regulatory, execution, and commercialization risks as it attempts to pioneer commercial geologic hydrogen extraction in North America. While backed by roughly $400 million in private capital, the company operates wildcat exploration wells in largely untested basalt formations with no public flow rates, undefined regulatory frameworks, and complete absence of commercial-scale precedent."
sections:
  - id: "subsurface-exploration-risks"
    title: "Subsurface and Geological Feasibility Risks"
    body: "Koloma's core enterprise thesis rests on locating and commercially extracting geologic hydrogen from continental subsurface formations. However, subsurface hydrogen systems remain poorly understood across global geoscience, creating substantial exploratory risk for every capital commitment. To date, only a single commercially producing natural hydrogen well exists globally, located in Bourakebougou, Mali, meaning Koloma's domestic exploration assets in Idaho, Kansas, and Iowa lack empirical North American operational precedent. In Canyon County, Idaho, Koloma's operating entity, Cascade Exploration, permitted the vertical Twin Peaks 1W stratigraphic test well to a planned depth of 3,658 meters (over 3,600 meters) targeting Miocene volcanic rocks and Columbia River Flood Basalts. The U.S. Geological Survey (USGS) hydrogen prospectivity model evaluates the site as possessing merely a medium probability of success, noting that mafic volcanic lithology is geochemically unfavorable for classic serpentinization reactions compared to ultramafic peridotites. While high geothermal heat flow or radiolysis might theoretically generate or migrate deep hydrogen, commercial concentrations remain unproven. Crucially, the Twin Peaks 1W permit specifies that the borehole is drilled solely for stratigraphic and geological data gathering and will not be completed as a producing well, underscoring that commercial resource discoverability remains an open scientific question."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-governance-risks"
    title: "Regulatory Uncertainty, Permitting, and Local Scrutiny"
    body: "A primary structural hurdle for Koloma is the comprehensive lack of unified federal and state regulatory frameworks governing geologic hydrogen extraction across the United States. Federal resource rights, public land leasing rules, subsurface ownership doctrines, and safety standards for natural hydrogen remain unlegislated, forcing operators to navigate disparate state-by-state administrative regimes. In Idaho, the Department of Lands and the Oil and Gas Conservation Commission elected to regulate natural hydrogen exploration by grouping it alongside traditional hydrocarbons, which grants Koloma near-term administrative clearance for seismic surveys and test wells but creates long-term compliance and public perception liabilities. Operating under local corporate subsidiaries such as Cascade Exploration has already triggered civic friction and adverse scrutiny. Community organizations, including Citizens Allied for Integrity and Accountability, have formally raised concerns that exploratory operations northwest of Boise could serve as a disguised entry vehicle for conventional fossil fuel prospecting in areas adjacent to hydrocarbon production in Payette County. Furthermore, eligibility for critical federal production incentives, such as the Inflation Reduction Act Section 45V clean hydrogen production tax credit of up to $3.00 per kilogram, remains conditional on rigorous lifecycle greenhouse gas emissions analysis and upstream leakage accounting, which cannot be finalized until commercial production wells are deployed and measured."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
    tableRefs:
      - "TR001"
  - id: "operational-capital-dependency-risks"
    title: "Operational Execution, Supply Chain, and Capital Intensity"
    body: "Transitioning from computational subsurface modeling to physical wellhead production exposes Koloma to severe operational and counterparty dependencies. Specialized deep-drilling rigs capable of penetrating abrasive volcanic basalt formations to depths exceeding 3,600 meters are in tight supply, and the industry faces an acute shortage of specialized contractors and downhole hydrogen monitoring equipment. Subsurface hydrogen gas is notoriously prone to embrittlement of conventional steel drillstrings and rapid atmospheric migration, necessitating specialized metallurgy and proprietary digital architecture. To manage its computational data pipeline, Koloma must build custom geoscience infrastructure spanning cloud computing, geospatial data engineering, and enterprise cybersecurity across its Denver and Columbus engineering facilities. Financially, although Koloma raised approximately $394 million to $403 million across multiple equity rounds—commanding an estimated $823.12 million Series B valuation—deep stratigraphic drilling and multi-basin seismic exploration incur steep cash burn. Strategic investments from industrial conglomerates Mitsubishi Heavy Industries and Osaka Gas provide validation and potential commercial pathways, but fail to eliminate midstream processing, distribution, and offtake execution risks in the absence of dedicated hydrogen pipeline infrastructure."
    claimRefs:
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
