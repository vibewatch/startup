callouts:
  - calloutType: "risk"
    title: "The Zero-Commercial-Precedent Paradox in North America"
    body: "Koloma is deploying tens of millions of dollars into frontier wildcat exploration where only a single commercial-scale producing natural hydrogen field exists worldwide—in Bourakebougou, Mali. Without demonstrated sustained flow rates, pressure dynamics, or gas purity from North American basins, Koloma's valuation implies technological and geological breakthroughs that have yet to be proven at commercial scale."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR007"
  - calloutType: "insight"
    title: "Local Subsidiary Masking and Community Trust Deficits"
    body: "Koloma's choice to operate exploration programs through local entities such as Cascade Exploration in Idaho creates civic and public relations vulnerabilities. Local watchdog groups suspect covert fossil fuel exploration, demonstrating that operating in oil and gas regulatory frameworks requires aggressive stakeholder transparency to avoid costly permitting moratoriums."
    claimRefs:
      - "CR008"
      - "CR010"
      - "CR011"
