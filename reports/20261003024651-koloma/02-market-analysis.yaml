callouts:
  - calloutType: insight
    title: "The Corn Belt Strategic Advantage: Agricultural Ammonia as the Anchor Offtake"
    body: >
      Koloma’s initial commercialization focus on the U.S. Midwest Corn Belt capitalizes on a unique geographic arbitrage [CM004]. While generic hydrogen adoption is often bottlenecked by missing long-distance pipeline infrastructure and specialized cryogenic transport, the Midwest represents the world’s most concentrated agricultural ammonia market, importing 2 million tons annually and paying an average $150/ton delivery premium over Gulf Coast hub prices [CM004]. Co-locating natural hydrogen exploration and extraction along the Midcontinent Rift allows Koloma to bypass long-distance transport costs and feed regional Haber-Bosch fertilizer manufacturing directly [CM004].
    claimRefs:
      - CM004
  - calloutType: risk
    title: Unproven Well Flow Rates and Exploratory Resource Disconnect
    body: >
      Despite raising over $400 million in private venture capital and securing millions of exploration acres globally, natural hydrogen exploration remains pre-commercial [CM005, CM011]. Modeled wellhead extraction costs of $0.50–$1.50/kg depend entirely on encountering commercially viable flow rates and high gas purity in stratigraphic test wells such as the Twin Peaks 1W in Idaho [CM002, CM005]. Until continuous flow rates and commercial longevity are empirically demonstrated, addressable market sizing remains an unproven theoretical boundary [CM005].
    claimRefs:
      - CM002
      - CM005
      - CM011
