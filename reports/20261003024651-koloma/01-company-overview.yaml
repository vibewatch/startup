chapter:
  number: 1
  title: "Company Overview"
  summary: "Koloma is a Denver-based geologic hydrogen exploration and production startup pioneering the discovery and commercial extraction of subsurface natural hydrogen using proprietary data and AI-driven subsurface targeting. Backed by over $394M to $403M in cumulative funding from tier-one climate and industrial investors including Breakthrough Energy Ventures, Amazon's Climate Pledge Fund, United Airlines Ventures, Khosla Ventures, and Mitsubishi Heavy Industries, the company is advancing exploratory stratigraphic drilling at its Notus, Idaho project while operating as Cascade Exploration."
sections:
  - id: "corporate-identity-mission"
    title: "Corporate Identity, Operating Model, and Subsurface Geologic Mission"
    body: |
      Koloma is an exploratory energy and natural hydrogen company established to locate, evaluate, and commercialize naturally occurring geologic hydrogen deposits, commonly known as white hydrogen. Headquartered in Denver, Colorado, with substantial engineering and IT facilities in Columbus, Ohio, the company operates across key iron-rich geologic formations in the American interior. Its core strategy relies on the natural generation of hydrogen gas occurring deep underground where groundwater interacts with iron-heavy basaltic and ultramafic rock formations through serpentinization reactions. Rather than synthesizing hydrogen on the surface via fossil-fuel reforming or electrolysis, Koloma aims to extract naturally accumulating hydrogen gas as a low-cost, continuous, zero-carbon feedstock for industrial decarbonization, sustainable aviation fuels, and power generation.

      To scale its exploration pipeline, Koloma employs proprietary geoscience software, geospatial modeling, and artificial intelligence platforms to integrate disparate geophysical datasets and prioritize high-probability drilling targets. The company operates project-level operations through dedicated regional subsidiaries, such as Cascade Exploration in Idaho, to isolate exploration permits and field-level operational risks while maintaining unified technological and governance control from its parent organization.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO010"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance Architecture"
    body: |
      Koloma was established by a multidisciplinary team combining subsurface geoscience scholarship, advanced energy operations, and venture commercialization. Key leadership and technical architecture include Chief Executive Officer Pete Johnson, scientific founder and geoscientist Dr. Tom Darrah, former Chief Business Officer Paul Harraka, and executive technical teams overseeing IT architecture and subsurface data systems. The technical team draws from mineral exploration, petroleum data engineering, and enterprise cloud architecture to construct its automated geoscience platform.

      Governance oversight and strategic capital are concentrated among major institutional venture syndicates and strategic industrial strategics. Anchor backers include Bill Gates' Breakthrough Energy Ventures, Khosla Ventures, Energy Impact Partners, Piva Capital, and Prelude Ventures, alongside industrial strategics such as Amazon's Climate Pledge Fund, United Airlines Ventures, and Mitsubishi Heavy Industries. The corporate structure relies heavily on key-person dependencies in geologic modeling and specialized field permitting, while board seats and operational voting control remain tightly held across early institutional lead sponsors.
    claimRefs:
      - "CO002"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO013"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-milestones"
    title: "Capitalization History, Stratigraphic Drilling, and Exploratory Milestones"
    body: |
      Since its formal inception in 2021, Koloma has secured approximately $400 million in total financing across equity rounds, conventional debt, and federal research grants, establishing it as the most well-capitalized natural hydrogen pure-play globally. Financing milestones include an initial $5.0M Seed round in August 2021, a $55.7M Series A financing in July 2022 led by Breakthrough Energy Ventures and Energy Impact Partners, and a major Series B round in February 2024 totaling between $245.7M and $280M+ with participation from Khosla Ventures, Amazon, and United Airlines. Strategic corporate investments expanded in late 2024 and January 2026 with commitments from Mitsubishi Heavy Industries and Osaka Gas. Secondary private markets, including Forge Global, tracked an implied post-money valuation benchmark of $823.12M following the Series B issuance.

      Operationally, Koloma's primary field milestone is centered on the Notus, Idaho exploration play west of Boise, where the Idaho Department of Lands issued an exploratory stratigraphic drilling permit for the Twin Peaks 1W test well. Targeting volcanic basalt formations to depths exceeding 3,600 meters, the project represents an exploratory stratigraphic data-gathering campaign rather than an immediate commercial production facility. In parallel, exploratory mapping continues across Kansas, Iowa, and California amidst substantial geologic uncertainty regarding subsurface hydrogen flow rates, concentration levels, and commercial reservoir entrapment.
