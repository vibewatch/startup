callouts:
  - calloutType: "insight"
    title: "Exploratory Stratigraphic Data Gathering vs. Commercial Production"
    body: "A critical diligence distinction is that Koloma's permitted well in Idaho (Twin Peaks 1W) is legally and operationally categorized as a stratigraphic test well designed solely for core sampling and data acquisition, rather than a completed commercial production well. Geologic hydrogen flow rates and reservoir volumes in North America remain wholly unproven."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
  - calloutType: "risk"
    title: "Severe Geologic and Flow Rate Uncertainty"
    body: "Despite raising over $400 million, Koloma has disclosed zero empirical data regarding continuous hydrogen concentration, flow rates, pressure decline curves, or commercial reservoir volumes from any well site. The sole worldwide commercial analogue remains a shallow well in Bourakébougou, Mali."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
