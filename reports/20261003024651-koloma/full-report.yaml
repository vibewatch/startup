        title: Adoption evidence stops before commercial production
        blocks:
          - type: paragraph
            body: >-
              GeoComputing reports that its RiVA platform progressed through user acceptance, implementation, and
              go-live inside Koloma, which is credible evidence of an operational exploration workflow. It is not
              evidence that an external buyer uses or pays for Koloma's output. The strongest adverse signal is the
              Idaho program: the retained reporting describes the initial well as a data-collection test whose
              commercial viability is still unknown, while identifying Mali as the location of the world's only
              commercially producing natural-hydrogen well. No retained source reports Koloma production volume,
              hydrogen deliveries, active accounts, locations, utilization, or customer-derived revenue. Capital raised
              and internal deployment should therefore not be presented as customer adoption.
