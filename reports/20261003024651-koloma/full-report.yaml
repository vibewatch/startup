              - CO005
              - CO006
              - CO013
      - number: '1.3'
        title: Capitalization History, Stratigraphic Drilling, and Exploratory Milestones
        blocks:
          - type: paragraph
            body: >
              Since its formal inception in 2021, Koloma has secured approximately $400 million in total financing
              across equity rounds, conventional debt, and federal research grants, establishing it as the most
              well-capitalized natural hydrogen pure-play globally. Financing milestones include an initial $5.0M Seed
              round in August 2021, a $55.7M Series A financing in July 2022 led by Breakthrough Energy Ventures and
              Energy Impact Partners, and a major Series B round in February 2024 totaling between $245.7M and $280M+
              with participation from Khosla Ventures, Amazon, and United Airlines. Strategic corporate investments
              expanded in late 2024 and January 2026 with commitments from Mitsubishi Heavy Industries and Osaka Gas.
              Secondary private markets, including Forge Global, tracked an implied post-money valuation benchmark of
              $823.12M following the Series B issuance.


              Operationally, Koloma's primary field milestone is centered on the Notus, Idaho exploration play west of
              Boise, where the Idaho Department of Lands issued an exploratory stratigraphic drilling permit for the
              Twin Peaks 1W test well. Targeting volcanic basalt formations to depths exceeding 3,600 meters, the
              project represents an exploratory stratigraphic data-gathering campaign rather than an immediate
              commercial production facility. In parallel, exploratory mapping continues across Kansas, Iowa, and
              California amidst substantial geologic uncertainty regarding subsurface hydrogen flow rates, concentration
              levels, and commercial reservoir entrapment.
