chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Model, and Subsurface Geologic Mission
        blocks:
          - type: paragraph
            body: >
              Koloma is an exploratory energy and natural hydrogen company established to locate, evaluate, and
              commercialize naturally occurring geologic hydrogen deposits, commonly known as white hydrogen.
              Headquartered in Denver, Colorado, with substantial engineering and IT facilities in Columbus, Ohio, the
              company operates across key iron-rich geologic formations in the American interior. Its core strategy
              relies on the natural generation of hydrogen gas occurring deep underground where groundwater interacts
              with iron-heavy basaltic and ultramafic rock formations through serpentinization reactions. Rather than
              synthesizing hydrogen on the surface via fossil-fuel reforming or electrolysis, Koloma aims to extract
              naturally accumulating hydrogen gas as a low-cost, continuous, zero-carbon feedstock for industrial
              decarbonization, sustainable aviation fuels, and power generation.


              To scale its exploration pipeline, Koloma employs proprietary geoscience software, geospatial modeling,
              and artificial intelligence platforms to integrate disparate geophysical datasets and prioritize
              high-probability drilling targets. The company operates project-level operations through dedicated
              regional subsidiaries, such as Cascade Exploration in Idaho, to isolate exploration permits and
              field-level operational risks while maintaining unified technological and governance control from its
              parent organization.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
