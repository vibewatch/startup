  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing Lenses, and Clean Hydrogen Substitution
        blocks:
          - type: paragraph
            body: >
              Koloma operates at the intersection of natural resource exploration and industrial clean energy transition
              [CM001]. The broader global clean hydrogen market represents a rapidly expanding addressable boundary as
              decarbonization mandates accelerate across energy-intensive industrial sectors [CM003]. In heavy industry,
              chemical synthesis, and agricultural fertilizer production, conventional hydrogen demand is overwhelmingly
              met via fossil-fuel-based steam methane reforming (grey hydrogen), which generates substantial carbon
              dioxide emissions [CM003]. Geologic hydrogen, generated naturally deep underground through
              serpentinization reactions between groundwater and iron-rich ultramafic rocks, introduces a primary energy
              alternative with near-zero direct extraction emissions [CM002]. Economic sizing for geologic hydrogen
              spans multiple analytical tiers, ranging from the total global hydrogen economy to regional agricultural
              commodity consumption where transport costs create immediate commercial opportunities [CM004]. However,
              overall market sizing remains constrained by early-stage exploratory risk, as commercial-scale flow rates
              and extraction economics remain unproven across operating basins [CM005].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
