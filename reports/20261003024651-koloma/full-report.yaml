              - CM002
              - CM003
              - CM004
              - CM006
      - number: '2.2'
        title: Buyer Segmentation, Regional Offtake Economics, and Agricultural Substitution
        blocks:
          - type: paragraph
            body: >
              Koloma prioritizes a regional go-to-market strategy focused on agricultural fertilizer producers and
              Midwest farming cooperatives rather than long-distance energy transport [CM004]. The U.S. Midwest Corn
              Belt consumes more ammonia-based fertilizer per acre than any other agricultural region globally, yet
              relies on importing approximately 2 million tons of ammonia annually via pipeline from Louisiana and
              foreign suppliers [CM004]. Because long-distance transport adds a delivery penalty of approximately $150
              per ton in states like Iowa, Kansas, and Minnesota, local geologic hydrogen production directly adjacent
              to agricultural demand creates an immediate margin buffer [CM004]. In this regional configuration,
              geologic hydrogen can feed local Haber-Bosch synthesis facilities, replacing volatile fossil-gas feedstock
              without requiring an expensive steam methane reformer [CM004]. Industrial chemical manufacturers,
              synthetic fuel producers, and energy utilities represent secondary buyer segments that face higher
              infrastructure barriers, including dedicated pipeline requirements and complex offtake specifications
              [CM003, CM005].
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
      - number: '2.3'
        title: Growth Drivers, Regulatory Incentives, and Adoption Bottlenecks
        blocks:
          - type: paragraph
            body: >
              Federal policy and technological maturation serve as primary market catalysts for natural hydrogen
              commercialization [CM001, CM006]. The Inflation Reduction Act Section 45V Clean Hydrogen Production Tax
              Credit provides up to $3.00/kg for hydrogen produced with near-zero lifecycle greenhouse gas emissions,
              establishing a powerful financial foundation that significantly enhances the margin profile of low-cost
              geologic extraction [CM006]. State-level initiatives, such as Michigan’s 2026 Geologic Hydrogen
              Exploration and Preparedness Initiative, provide regulatory acknowledgment to de-risk exploration
              permitting [CM006]. Furthermore, advanced high-performance computing platforms, such as the Ri VA private
              cloud adopted in 2026, compress subsurface data processing times from days to hours, accelerating target
              selection across exploration acreage [CM001, CM007]. Despite these tailwinds, severe adoption constraints
              persist: public equity markets and secondary venues lack liquid pricing mechanisms [CM009, CM010],
              subsurface hydrogen flow rates have not been commercially demonstrated [CM005], and private venture
              valuations remain decoupled from verified well production [CM008, CM011].
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Corn Belt Strategic Advantage: Agricultural Ammonia as the Anchor Offtake'
            body: >
              Koloma’s initial commercialization focus on the U.S. Midwest Corn Belt capitalizes on a unique geographic
              arbitrage [CM004]. While generic hydrogen adoption is often bottlenecked by missing long-distance pipeline
              infrastructure and specialized cryogenic transport, the Midwest represents the world’s most concentrated
              agricultural ammonia market, importing 2 million tons annually and paying an average $150/ton delivery
              premium over Gulf Coast hub prices [CM004]. Co-locating natural hydrogen exploration and extraction along
              the Midcontinent Rift allows Koloma to bypass long-distance transport costs and feed regional Haber-Bosch
              fertilizer manufacturing directly [CM004].
            calloutType: insight
            claimRefs:
              - CM004
          - type: callout
            title: Unproven Well Flow Rates and Exploratory Resource Disconnect
            body: >
              Despite raising over $400 million in private venture capital and securing millions of exploration acres
              globally, natural hydrogen exploration remains pre-commercial [CM005, CM011]. Modeled wellhead extraction
              costs of $0.50–$1.50/kg depend entirely on encountering commercially viable flow rates and high gas purity
              in stratigraphic test wells such as the Twin Peaks 1W in Idaho [CM002, CM005]. Until continuous flow rates
              and commercial longevity are empirically demonstrated, addressable market sizing remains an unproven
              theoretical boundary [CM005].
            calloutType: risk
            claimRefs:
              - CM002
              - CM005
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A frontier market split between operators and exploration enablers
        blocks:
          - type: paragraph
            body: >
              The visible natural-hydrogen field is not a single peer set. One group pursues the asset-heavy exploration
              model: Koloma, Max Power Mining, HyTerra, Gold Hydrogen, H2EX, and Hydroma seek or operate physical
              resource positions. A second group, including Snowfox Discovery and Getech, sells or develops the data and
              geological tools used to improve prospect selection. An independent issuer's comparison identifies this
              strategic split, but it is an editorial aggregation rather than an independently verified benchmark, so
              its acreage, funding, and operating-status entries remain single-source indicators. Within that
              comparison, Koloma is reported as the capital leader, Max Power as the disclosed acreage leader, HyTerra
              and Gold Hydrogen as active drillers, and Hydroma as the commercial-production reference. Manufactured
              hydrogen, internal buyer projects, and continued reliance on incumbent supply are relevant substitutes,
              but the reviewed source set does not quantify them on a comparable price, reliability, or emissions basis.
              The resulting landscape is useful for identifying strategic archetypes, not for declaring a winner.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.2'
        title: Koloma combines subsurface data, drilling, capital planning, and industrial access
        blocks:
          - type: paragraph
            body: >
              Koloma presents a hybrid model rather than a pure acreage or software strategy. Mitsubishi Heavy
              Industries describes the company as using technology, proprietary data, and human capital to identify and
              commercialize geologic hydrogen globally. A company-issued systems role adds implementation detail: the
              planned geoscience platform integrates cloud computing, artificial intelligence, and large-scale data
              processing. A separate company-issued finance role calls for capital budgeting, downside planning, cash
              forecasting, and support for exploration, appraisal, development, and first-of-a-kind projects. Together
              these sources indicate an organization designed to combine prospect selection with physical development
              and disciplined allocation of exploration capital. They do not prove that the models predict productive
              reservoirs better than competitors, because both job listings are company-issued signals rather than
              performance evidence. A supplier case study also reports a coordinated brand system spanning six
              subsidiaries; that may support multi-jurisdiction expansion and stakeholder engagement, but it is
              supplier-issued evidence and not proof of operating scale. Koloma's technology and organizational breadth
              therefore look differentiated, while the accuracy and transferability of its subsurface advantage remain
              unverified.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.3'
        title: Capital and partnerships help, but commercial proof determines moat durability
        blocks:
          - type: paragraph
            body: >
              Capital availability matters in a business where dry holes and long appraisal cycles can consume
              substantial resources. One market comparison reports $394 million of funding for Koloma, while Forge
              reports $306.44 million; the two figures should not be blended because their coverage and methodology are
              not reconciled. Forge also shows no current Forge Price, underscoring the limited transparency of
              private-market pricing even though it lists historical financing data. Mitsubishi Heavy Industries'
              investment is strategically relevant because the investor explicitly frames hydrogen ecosystem development
              as a core strategy, but an investment and collaboration intent are not a binding offtake agreement,
              distribution contract, or customer commitment. The most important adverse evidence comes from Idaho: the
              reported Twin Peaks 1W well is a stratigraphic data-gathering test, and recoverability remains uncertain.
              The same source describes Mali as the only commercially producing natural-hydrogen well, emphasizing how
              little operating proof exists for the category. No reviewed source discloses Koloma's customer price,
              contract packaging, buyer switching costs, multi-homing behavior, or committed volumes. Koloma's moat is
              therefore best treated as a funded capability stack whose durability still depends on repeatable well
              results and commercial agreements.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated capability is the credible differentiation thesis
            body: >
              Koloma combines proprietary-data claims, a cloud-and-AI geoscience platform signal, physical exploration,
              capital-planning capacity, and an industrial investor. That is broader than a pure land-acquisition or
              software-only strategy, although superiority has not been demonstrated with comparative field results.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP016
          - type: callout
            title: The moat remains pre-production
            body: >
              A permitted data-gathering well and a large funding base can improve the odds of learning, but neither
              establishes commercial recovery, repeatable economics, buyer adoption, or defensible pricing. Those
              missing proofs are the central competitive diligence items.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Mechanisms, and Commercialization Pathways
        blocks:
          - type: paragraph
            body: >-
              Koloma is currently a pre-commercial, pre-revenue geoscience exploration venture [CI001]. Its primary
              prospective commercial revenue stream centers on the exploration, extraction, and wholesale supply of
              naturally occurring geologic hydrogen (white hydrogen) to industrial, utility, and transportation
              off-takers [CI002]. A secondary potential monetization stream involves long-term bilateral offtake and
              joint development agreements with strategic industrial partners, such as energy utilities and heavy
              manufacturing conglomerates that have taken direct equity stakes in the company [CI003]. Additionally,
              Koloma has explored prospective federal production tax credits, specifically clean hydrogen production
              credits under Section 45V of the Internal Revenue Code that offer up to $3.00 per kilogram of clean
              hydrogen produced, subject to full lifecycle greenhouse gas intensity certification [CI004]. Because
              Koloma has not achieved commercial production or announced binding commercial supply deliveries, realized
              revenue across all operational subsidiaries remains zero [CI001]. Strategic partners, including Mitsubishi
              Heavy Industries and Osaka Gas, provide both capital and prospective distribution channels into Japanese
              and international clean fuel supply chains, but no public disclosures confirm minimum volume commitments
              or take-or-pay contract terms [CI003].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
