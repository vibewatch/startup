              - CE012
      - number: '5.4'
        title: Technical Differentiation, Operating Controls, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Koloma’s technical differentiation rests on its integration of advanced petro-technical computing with
              specialized geoscience partnerships, including joint research programs with the U.S. Geological Survey and
              the Colorado School of Mines. The company standardizes its external operational procedures using custom
              scientific materials detailing hydrogen generation and safety protocols while managing regional land
              acquisition under confidential domain masking. However, significant diligence blockers persist across the
              technology stack. Koloma has not disclosed continuous flow testing, reservoir permeability metrics, or
              surface gas separation plant designs. The transition from exploratory data collection to an operating
              production facility remains the primary technical and commercial risk confronting the company’s
              capital-intensive strategy.
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Compute-Intensive Subsurface Exploration Accelerates Play Derisking
            body: >-
              By leveraging GeoComputing’s RiVA private cloud platform to run over 200 petro-technical applications,
              Koloma compresses multi-day subsurface processing workflows into hours. This compute capability allows
              integrated exploration teams to evaluate complex rift basin tectonics and volcanic basalts simultaneously
              across Kansas and Idaho without bearing the overhead of designing an in-house supercomputing
              infrastructure.
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE004
          - type: callout
            title: Exploratory Drilling Success Contrasts With Undisclosed Wellhead Commerciality
            body: >-
              Although Koloma detected significant hydrogen concentrations in its Kansas test drilling and permitted
              deep stratigraphic testing exceeding 3,600 meters in Idaho, the venture has not disclosed continuous flow
              rates, gas purity levels, or commercial production facilities. The technical leap from confirming
              subsurface hydrogen existence to demonstrating scalable, commercial wellhead extraction remains unproven
              across frontier basins.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The buyer map is plausible but not yet verified
        blocks:
          - type: paragraph
            body: >-
              The available material points toward a business-to-business model serving energy producers and large
              industrial users, with hydrogen supply, technology deployment, or related services as possible commercial
              forms. That segmentation comes from a gated Preqin profile rather than disclosed contracts, and the
              profile names no customer. Koloma's own recruiting language describes global commercialization as an
              objective, not a completed sale. Strategic investors from energy and aviation may improve market access,
              but investor status is not customer status. The only clearly evidenced user group is internal: Koloma
              geoscientists and IT staff using a supplier platform for exploration analysis. As a result, buyer, user,
              and payer roles remain unproven outside Koloma's own operations.
