  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Subsurface and Geological Feasibility Risks
        blocks:
          - type: paragraph
            body: >-
              Koloma's core enterprise thesis rests on locating and commercially extracting geologic hydrogen from
              continental subsurface formations. However, subsurface hydrogen systems remain poorly understood across
              global geoscience, creating substantial exploratory risk for every capital commitment. To date, only a
              single commercially producing natural hydrogen well exists globally, located in Bourakebougou, Mali,
              meaning Koloma's domestic exploration assets in Idaho, Kansas, and Iowa lack empirical North American
              operational precedent. In Canyon County, Idaho, Koloma's operating entity, Cascade Exploration, permitted
              the vertical Twin Peaks 1W stratigraphic test well to a planned depth of 3,658 meters (over 3,600 meters)
              targeting Miocene volcanic rocks and Columbia River Flood Basalts. The U.S. Geological Survey (USGS)
              hydrogen prospectivity model evaluates the site as possessing merely a medium probability of success,
              noting that mafic volcanic lithology is geochemically unfavorable for classic serpentinization reactions
              compared to ultramafic peridotites. While high geothermal heat flow or radiolysis might theoretically
              generate or migrate deep hydrogen, commercial concentrations remain unproven. Crucially, the Twin Peaks 1W
              permit specifies that the borehole is drilled solely for stratigraphic and geological data gathering and
              will not be completed as a producing well, underscoring that commercial resource discoverability remains
              an open scientific question.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR008
              - CR010
              - CR012
              - CR015
      - number: '7.2'
        title: Regulatory Uncertainty, Permitting, and Local Scrutiny
        blocks:
          - type: paragraph
            body: >-
              A primary structural hurdle for Koloma is the comprehensive lack of unified federal and state regulatory
              frameworks governing geologic hydrogen extraction across the United States. Federal resource rights,
              public land leasing rules, subsurface ownership doctrines, and safety standards for natural hydrogen
              remain unlegislated, forcing operators to navigate disparate state-by-state administrative regimes. In
              Idaho, the Department of Lands and the Oil and Gas Conservation Commission elected to regulate natural
              hydrogen exploration by grouping it alongside traditional hydrocarbons, which grants Koloma near-term
              administrative clearance for seismic surveys and test wells but creates long-term compliance and public
              perception liabilities. Operating under local corporate subsidiaries such as Cascade Exploration has
              already triggered civic friction and adverse scrutiny. Community organizations, including Citizens Allied
              for Integrity and Accountability, have formally raised concerns that exploratory operations northwest of
              Boise could serve as a disguised entry vehicle for conventional fossil fuel prospecting in areas adjacent
              to hydrocarbon production in Payette County. Furthermore, eligibility for critical federal production
              incentives, such as the Inflation Reduction Act Section 45V clean hydrogen production tax credit of up to
              $3.00 per kilogram, remains conditional on rigorous lifecycle greenhouse gas emissions analysis and
              upstream leakage accounting, which cannot be finalized until commercial production wells are deployed and
              measured.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operational Execution, Supply Chain, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Transitioning from computational subsurface modeling to physical wellhead production exposes Koloma to
              severe operational and counterparty dependencies. Specialized deep-drilling rigs capable of penetrating
              abrasive volcanic basalt formations to depths exceeding 3,600 meters are in tight supply, and the industry
              faces an acute shortage of specialized contractors and downhole hydrogen monitoring equipment. Subsurface
              hydrogen gas is notoriously prone to embrittlement of conventional steel drillstrings and rapid
              atmospheric migration, necessitating specialized metallurgy and proprietary digital architecture. To
              manage its computational data pipeline, Koloma must build custom geoscience infrastructure spanning cloud
              computing, geospatial data engineering, and enterprise cybersecurity across its Denver and Columbus
              engineering facilities. Financially, although Koloma raised approximately $394 million to $403 million
              across multiple equity rounds—commanding an estimated $823.12 million Series B valuation—deep
              stratigraphic drilling and multi-basin seismic exploration incur steep cash burn. Strategic investments
              from industrial conglomerates Mitsubishi Heavy Industries and Osaka Gas provide validation and potential
              commercial pathways, but fail to eliminate midstream processing, distribution, and offtake execution risks
              in the absence of dedicated hydrogen pipeline infrastructure.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Zero-Commercial-Precedent Paradox in North America
            body: >-
              Koloma is deploying tens of millions of dollars into frontier wildcat exploration where only a single
              commercial-scale producing natural hydrogen field exists worldwide—in Bourakebougou, Mali. Without
              demonstrated sustained flow rates, pressure dynamics, or gas purity from North American basins, Koloma's
              valuation implies technological and geological breakthroughs that have yet to be proven at commercial
              scale.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR007
          - type: callout
            title: Local Subsidiary Masking and Community Trust Deficits
            body: >-
              Koloma's choice to operate exploration programs through local entities such as Cascade Exploration in
              Idaho creates civic and public relations vulnerabilities. Local watchdog groups suspect covert fossil fuel
              exploration, demonstrating that operating in oil and gas regulatory frameworks requires aggressive
              stakeholder transparency to avoid costly permitting moratoriums.
            calloutType: insight
            claimRefs:
              - CR008
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Core Investment Thesis, Anti-Thesis, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Koloma presents a compelling but speculative venture investment proposition anchored in the potential
              discovery of natural geologic hydrogen [CV001]. The core investment thesis posits that geologic hydrogen,
              formed naturally via deep subsurface serpentinization where groundwater reacts with iron-rich rocks, can
              serve as a primary clean energy feedstock with production economics far superior to capital-intensive
              manufactured green hydrogen [CV002]. With total lifetime funding of $394 million to $403 million from
              leading climate and corporate investors—including Breakthrough Energy Ventures, Khosla Ventures, Amazon's
              Climate Pledge Fund, United Airlines, and strategic Japanese partners Mitsubishi Heavy Industries and
              Osaka Gas—Koloma holds the industry's largest exploratory balance sheet [CV003, CV004]. However, the
              anti-thesis is substantial and immediate: the company is entirely pre-revenue, operates in a frontier
              domain where commercial flow rates remain unproven outside of a single artisanal well in Mali, and faces
              extreme exploratory risks where deep drilling in basalt formations is not guaranteed to yield commercially
              viable accumulations [CV005, CV006]. CEO Pete Johnson explicitly acknowledged these uncertainties,
              cautioning that exploration is neither a done deal nor a sure bet, though a commercial breakthrough would
              transform energy transition economics [CV007]. Underwriting Koloma at venture scale requires accepting
              binary resource risk while physical stratigraphic test wells, such as the Twin Peaks 1W well in Idaho,
              gather critical reservoir data [CV008].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV010
              - CV014
      - number: '8.2'
        title: Current Financing Context, Valuation Marks, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Koloma's valuation history reflects aggressive venture enthusiasm followed by milestone-gated private
              market pricing [CV009]. In February 2024, Koloma closed a major Series B-1 round raising $215 million at a
              share price of $36.00, establishing a post-money valuation benchmark of $823.12 million with 5,973,007
              shares outstanding [CV010]. A companion Series B-2 round of $30.74 million at $25.92 per share with
              1,186,199 shares outstanding was closed concurrently under the same $823.12 million post-money valuation
              ceiling [CV010]. Both Series B share classes carry a 1.0x non-participating liquidation preference with an
              8.0% non-cumulative dividend rate, creating a senior preference overhang relative to early common equity
              and Series Seed investors who entered at $1.00 per share [CV010]. Private secondary marketplaces,
              including Forge Global, Nasdaq Private Market, and EquityZen, list pre-IPO share opportunities for
              accredited investors, but display limited transaction volume, unquoted bid-ask spreads, and no updated
              transaction prices [CV011, CV012, CV013]. With lifetime funding reaching $394M to $403M through additional
              corporate strategic participation from Mitsubishi Heavy Industries and Osaka Gas in early 2026, the
              company's private market valuation benchmark remains pegged around $823M, reflecting a stretched pricing
              posture for a pre-revenue exploration entity prior to confirmed wellhead production [CV003, CV004, CV010].
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
      - number: '8.3'
        title: Scenario Analysis, Comparable Benchmarks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Koloma's enterprise trajectory requires structured scenario underwriting spanning bull, base,
              and bear outcomes [CV014]. In the bull case, exploratory stratigraphic wells in Idaho and Kansas confirm
              commercial flow rates and high gas purity, unlocking modeled wellhead extraction costs of $0.50 to $1.50
              per kilogram alongside eligibility for federal production tax credits of up to $3.00 per kilogram under
              Section 45V [CV002, CV015]. In this scenario, strategic offtake commitments with Osaka Gas, Mitsubishi
              Heavy Industries, and industrial consumers support an initial public offering or multi-billion-dollar
              strategic buyout [CV004, CV014]. In the base case, exploratory drilling yields technical data showing
              modest natural hydrogen presence, but reservoir permeability and flow mechanics require prolonged
              secondary stimulation and extended development cycles, prompting down-round or flat-round private
              extension financings [CV006, CV014]. In the bear case, test wells encounter sub-commercial concentrations,
              excessive downhole gas migration, or insurmountable separation costs, resulting in stranded capital,
              severe valuation impairment, or enterprise wind-down [CV006, CV014]. Comparable exploration peers such as
              HyTerra (publicly traded on the ASX with 39,000 Kansas acres) and Gold Hydrogen (AU$20M raised) operate at
              fractional valuations, underscoring that Koloma's valuation premium is predicated on geoscience IP and
              balance sheet scale rather than superior production proof [CV004, CV016]. Diligence asks must prioritize
              certified wellhead flow logs and IRS 45V lifecycle guidance before allocating capital [CV008, CV015].
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track Pending Wellhead Flow Rates'
            body: >-
              We recommend a track stance on Koloma. While the company is the undisputed capital and technological
              leader in natural hydrogen exploration, its $823.12M valuation is stretched for an enterprise with zero
              revenue, no confirmed well flow rates, and high exploratory dry-hole risk [CV005, CV007, CV010].
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV010
          - type: callout
            title: Binary Exploration Outcome and Valuation Overhang
            body: >-
              Koloma faces binary subsurface resource risk: if initial vertical stratigraphic test wells fail to
              establish commercially producible hydrogen concentrations, the enterprise has no fallback revenue,
              exposing equity holders to substantial capital loss [CV006, CV008, CV014].
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV014
