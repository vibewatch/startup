    title: Market Sizing and Production Economics Hierarchy
    type: pyramid
    summary: >-
      Six-tier hierarchical breakdown of addressable hydrogen market segments from global industrial demand down to
      localized Midwest agricultural fertilizer offtake.
    data:
      nodes:
        - label: Global Industrial Hydrogen Demand (TAM)
          detail: >-
            Total global hydrogen consumption dominated by fossil-fuel steam methane reforming in refining and bulk
            chemical manufacturing
          value: 100+ Mt Annual Demand
        - label: Clean Hydrogen Mandated Transition (SAM)
          detail: >-
            Decarbonization segment driven by federal Section 45V production tax credits ($3.00/kg) and corporate
            net-zero procurement
          value: Policy-Supported Shift
        - label: North American Exploration & Infrastructure
          detail: >-
            Exploration acreage across the Midcontinent Rift and western basins where transportation networks dictate
            offtake viability
          value: 20M+ Leased Acres
        - label: Regional Midwest Agricultural Market
          detail: >-
            Corn Belt fertilizer consumption hub exhibiting the highest agricultural hydrogen utilization per acre
            globally
          value: High-Intensity Agronomy
        - label: Midwest Imported Ammonia Offtake (SOM)
          detail: >-
            Annual regional ammonia volume imported from foreign and Gulf Coast producers via pipeline with a $150/ton
            premium
          value: 2M Tons Annual Imports
        - label: Co-Located Geologic Wellhead Feedstock
