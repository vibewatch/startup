      - number: '4.2'
        title: Exploration Cost Structure, Capital Intensity, and Operating Expenses
        blocks:
          - type: paragraph
            body: >-
              Koloma's operational cost structure is dominated by heavy front-loaded subsurface exploration capital
              expenditures and specialized technical personnel costs [CI005]. As an exploratory drilling enterprise,
              capex requirements are driven by vertical stratigraphic test well drilling, such as the Twin Peaks 1W test
              well in Idaho permitted to depths exceeding 3,600 meters [CI006]. Stratigraphic test drilling at these
              depths involves multi-million-dollar rig mobilization, casing, logging, and core sampling expenditures
              conducted primarily for geological data acquisition rather than immediate commercial extraction [CI006].
              Operating expenditures comprise advanced geospatial computing platform licensing, cloud analytics, and
              compensation for specialized geoscientists and systems architects, with engineering compensation
              benchmarks ranging between $160,000 and $185,000 annually for technical staff [CI007]. Corporate
              operations and public affairs activities add ongoing overhead across parent corporate offices and regional
              subsidiaries [CI008]. Lacking operating wells or processing infrastructure, Koloma records no cost of
              goods sold, gross margin, or standard service delivery costs, with cash burn concentrated in R&D,
              geophysical surveys, and exploratory acreage evaluation [CI005].
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
      - number: '4.3'
        title: Capital Adequacy, Cash Runway, and Underwriting Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Koloma has assembled an aggregate funding base of $403 million across 8 equity, debt, and grant financing
              rounds since its founding in 2021 [CI009]. Lifetime financing includes a notable $245.7 million Series B
              round finalized in February 2024 at an implied post-money valuation benchmark of $823.12 million, backed
              by Khosla Ventures, Breakthrough Energy Ventures, Amazon's Climate Pledge Fund, and United Airlines
              Ventures [CI010]. Strategic capital infusions from industrial leaders Mitsubishi Heavy Industries and
              Osaka Gas through early 2026 further extended the company's financial cushion [CI011]. With estimated
              annual exploratory burn rates in the tens of millions of dollars, Koloma possesses an estimated cash
              runway extending 2 to 4 years [CI012]. However, significant underwriting diligence blockers remain.
              Crucially, the commercial viability and recoverability of geologic hydrogen deposits remain unverified by
              commercial production flow tests [CI013]. Modeled wellhead production costs of $0.50 to $1.50 per kilogram
              lack empirical operational validation from producing wells, creating substantial uncertainty for financial
              underwriting until flow rates and reservoir pressures are formally disclosed [CI014].
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Substantial Capitalization Provides Extended Exploration Runway
            body: >-
              With $403 million in total capital raised from elite institutional climate funds and strategic industrial
              corporates, Koloma maintains an exceptional exploratory balance sheet that insulates near-term
              stratigraphic drilling from private venture market cycles [CI009, CI010].
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
          - type: callout
            title: Pre-Revenue Status and Absence of Empirical Well Flow Rates
            body: >-
              Koloma remains completely pre-revenue with unverified reservoir flow rates and zero commercial production
              data, leaving theoretical low-cost unit economic projections entirely ungrounded in empirical field
              operations [CI001, CI013, CI014].
            calloutType: risk
            claimRefs:
              - CI001
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Geologic Hydrogen Exploration Model
        blocks:
          - type: paragraph
            body: >-
              Koloma defines its core technical offering as the exploration, identification, and eventual production of
              geologic natural hydrogen trapped in subsurface formations. Unlike conventional industrial hydrogen
              produced via carbon-intensive steam methane reforming or capital-heavy water electrolysis, natural white
              hydrogen forms through underground geochemical reactions such as water-rock serpentinization in iron-rich
              formations. Koloma operates as an upstream exploration and technology developer, utilizing proprietary
              geoscience modeling and geospatial intelligence to target commercially viable accumulations. Industrial
              off-takers in heavy manufacturing, chemicals, and clean power require long-term zero-carbon feedstock,
              positioning Koloma’s upstream discovery model as a potential low-cost primary energy supply, provided
              subsurface accumulations can be accessed and produced economically.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
      - number: '5.2'
        title: Exploration Asset Matrix and Regional Drilling Programs
        blocks:
          - type: paragraph
            body: >-
              Koloma’s physical operational footprint spans multiple prospective basins in the United States, executed
              through regional operating subsidiaries. In the Mid-Continent Rift system across Kansas and Nebraska,
              subsidiary High Plains Resources completed a five-well stratigraphic test drilling program through 2023
              and initiated production-oriented test wells paired with 2D seismic surveys. In southwest Idaho, operating
              entity Cascade Exploration received state permits from the Idaho Department of Lands for the Twin Peaks 1W
              stratigraphic test well, targeting Miocene volcanic basalts and interbedded sandstones down to depths
              exceeding 3,600 meters across a 280-acre tract. These drilling campaigns focus on subsurface data
              gathering rather than immediate commercial delivery, as empirical flow rates, sustained pressure curves,
              and gas composition metrics remain unpublished.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
