      - number: '5.3'
        title: Subsurface Data Architecture and Computing Infrastructure
        blocks:
          - type: paragraph
            body: >-
              To process massive geological datasets and accelerate basin screening, Koloma selected GeoComputing
              Group’s RiVA high-performance private cloud platform. RiVA hosts more than 200 petro-technical exploration
              applications from leading oil and gas service providers alongside proprietary analytics, allowing
              multidisciplinary geoscience teams to execute complex seismic processing workflows in hours rather than
              days. Koloma’s internal technology stack incorporates Azure-based data engineering pipelines, relational
              SQL and PostgreSQL databases, and proprietary Python, Java, and C# processing modules. This infrastructure
              integrates regional geological surveys, 2D seismic reflections, and geochemical logs into unified
              predictive subsurface models, backed by enterprisewide automated disaster recovery and business continuity
              systems.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE009
              - CE010
              - CE011
