      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >
              Koloma was established by a multidisciplinary team combining subsurface geoscience scholarship, advanced
              energy operations, and venture commercialization. Key leadership and technical architecture include Chief
              Executive Officer Pete Johnson, scientific founder and geoscientist Dr. Tom Darrah, former Chief Business
              Officer Paul Harraka, and executive technical teams overseeing IT architecture and subsurface data
              systems. The technical team draws from mineral exploration, petroleum data engineering, and enterprise
              cloud architecture to construct its automated geoscience platform.


              Governance oversight and strategic capital are concentrated among major institutional venture syndicates
              and strategic industrial strategics. Anchor backers include Bill Gates' Breakthrough Energy Ventures,
              Khosla Ventures, Energy Impact Partners, Piva Capital, and Prelude Ventures, alongside industrial
              strategics such as Amazon's Climate Pledge Fund, United Airlines Ventures, and Mitsubishi Heavy
              Industries. The corporate structure relies heavily on key-person dependencies in geologic modeling and
              specialized field permitting, while board seats and operational voting control remain tightly held across
              early institutional lead sponsors.
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
