company:
  name: Koloma
chapter:
  number: 5
  title: Product & Technology
  summary: Koloma is developing a proprietary data-driven exploration platform to discover and commercialize subsurface geologic hydrogen, supported by over $394M in total funding and active exploration programs across Kansas and Idaho. The company deploys GeoComputing’s RiVA private cloud hosting over 200 petro-technical applications alongside Azure data pipelines to process seismic and volcanic strata. While exploratory drilling has detected significant hydrogen concentrations in Kansas and permitted wells exceeding 3,600 meters in Idaho, empirical wellhead flow rates, gas purity, and commercial extraction viability remain undisclosed.
sections:
  - id: product-definition-and-mechanisms
    title: Product Definition and Geologic Hydrogen Exploration Model
    body: Koloma defines its core technical offering as the exploration, identification, and eventual production of geologic natural hydrogen trapped in subsurface formations. Unlike conventional industrial hydrogen produced via carbon-intensive steam methane reforming or capital-heavy water electrolysis, natural white hydrogen forms through underground geochemical reactions such as water-rock serpentinization in iron-rich formations. Koloma operates as an upstream exploration and technology developer, utilizing proprietary geoscience modeling and geospatial intelligence to target commercially viable accumulations. Industrial off-takers in heavy manufacturing, chemicals, and clean power require long-term zero-carbon feedstock, positioning Koloma’s upstream discovery model as a potential low-cost primary energy supply, provided subsurface accumulations can be accessed and produced economically.
    claimRefs:
      - CE001
      - CE002
      - CE007
      - CE008
    tableRefs:
      - TE002
  - id: exploration-assets-and-field-programs
    title: Exploration Asset Matrix and Regional Drilling Programs
    body: Koloma’s physical operational footprint spans multiple prospective basins in the United States, executed through regional operating subsidiaries. In the Mid-Continent Rift system across Kansas and Nebraska, subsidiary High Plains Resources completed a five-well stratigraphic test drilling program through 2023 and initiated production-oriented test wells paired with 2D seismic surveys. In southwest Idaho, operating entity Cascade Exploration received state permits from the Idaho Department of Lands for the Twin Peaks 1W stratigraphic test well, targeting Miocene volcanic basalts and interbedded sandstones down to depths exceeding 3,600 meters across a 280-acre tract. These drilling campaigns focus on subsurface data gathering rather than immediate commercial delivery, as empirical flow rates, sustained pressure curves, and gas composition metrics remain unpublished.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE013
    tableRefs:
      - TE001
  - id: architecture-stack-and-computing-infrastructure
    title: Subsurface Data Architecture and Computing Infrastructure
    body: To process massive geological datasets and accelerate basin screening, Koloma selected GeoComputing Group’s RiVA high-performance private cloud platform. RiVA hosts more than 200 petro-technical exploration applications from leading oil and gas service providers alongside proprietary analytics, allowing multidisciplinary geoscience teams to execute complex seismic processing workflows in hours rather than days. Koloma’s internal technology stack incorporates Azure-based data engineering pipelines, relational SQL and PostgreSQL databases, and proprietary Python, Java, and C# processing modules. This infrastructure integrates regional geological surveys, 2D seismic reflections, and geochemical logs into unified predictive subsurface models, backed by enterprisewide automated disaster recovery and business continuity systems.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE009
      - CE010
      - CE011
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: differentiation-controls-and-diligence-blockers
    title: Technical Differentiation, Operating Controls, and Diligence Blockers
    body: Koloma’s technical differentiation rests on its integration of advanced petro-technical computing with specialized geoscience partnerships, including joint research programs with the U.S. Geological Survey and the Colorado School of Mines. The company standardizes its external operational procedures using custom scientific materials detailing hydrogen generation and safety protocols while managing regional land acquisition under confidential domain masking. However, significant diligence blockers persist across the technology stack. Koloma has not disclosed continuous flow testing, reservoir permeability metrics, or surface gas separation plant designs. The transition from exploratory data collection to an operating production facility remains the primary technical and commercial risk confronting the company’s capital-intensive strategy.
    claimRefs:
      - CE009
      - CE011
      - CE012
      - CE013
      - CE014
