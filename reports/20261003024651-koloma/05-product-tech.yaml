  - id: TE002
    title: Exploration Workflow and Use-Case Architecture
    columns:
      - Industrial Off-Taker Job
      - Current Industrial Workflow
      - Koloma Technical Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Clean Hydrogen Feedstock Procurement
        - Steam methane reforming with fossil gas or expensive water electrolysis
        - Geologic extraction of naturally generated hydrogen from underground iron-rich rock formations
        - Avoids high electricity inputs of green hydrogen and carbon emissions of gray hydrogen
        - Requires locating commercial accumulations with pipeline or local offtake access
      - - Basin Prospectivity Identification
        - Manual regional geological surveys and legacy oil/gas dry hole logs
        - AI-driven geospatial integration of geophysical data, fault mapping, and serpentinization indicators
        - Reduces exploration cycle from years to months across frontier basins
        - Subsurface predictive algorithms remain unbenchmarked by commercial discovery counts
      - - Stratigraphic Target Evaluation
        - Sequential 2D seismic processing and isolated core sample testing
        - High-throughput cloud computing via RiVA processing 200+ geoscience applications simultaneously
        - Accelerates processing workflows from days to hours for multidisciplinary teams
        - Computational modeling cannot eliminate exploratory drilling dry-hole risk
      - - Deep Well Drilling Verification
        - Standard oil and gas vertical drilling with generic hydrocarbon logging
        - Deep exploratory drilling (>3,600m in Idaho) with specialized gas sampling for low-density H2
        - Verifies physical presence of trapped geologic gas in deep volcanic rock strata
        - High depth increases drilling capex and wellbore integrity challenges for light H2 molecules
    notes: Workflow comparisons evaluated against standard petrochemical and clean energy benchmarks; commercial flow rates and offtake metrics remain undisclosed.
    claimRefs:
      - CE001
      - CE002
      - CE007
      - CE008
  - id: TE003
    title: Technology Stack and Operating Architecture
    columns:
      - Architecture Layer
      - Primary Technology / Process
      - Component Role
      - Key Dependency
      - Operational & Diligence Risk
    rows:
      - - Data Acquisition Layer
        - 2D Seismic Surveys & Stratigraphic Core Drilling
        - Acquires seismic profiles, core samples, and subsurface stratigraphy across Kansas and Idaho
        - Surface access rights, state drilling permits, and geophysical contractor availability
        - Drilling permits specify exploratory data gathering; commercial production requires new approvals
      - - Computing & Analytics Layer
        - GeoComputing RiVA Private Cloud & Azure Pipelines
        - High-throughput petro-technical processing, automated workflows, and disaster recovery
        - Third-party private cloud SLA, Azure infrastructure, and GeoComputing engineering support
        - Vendor lock-in and dependency on external petro-technical application maintainers
      - - Geoscience Modeling Layer
        - Proprietary Python / Java / C# Algorithms & GIS
        - Subsurface AI targeting, serpentinization modeling, and reservoir prospectivity mapping
        - Internal geoscience talent, USGS academic data inputs, and high-performance compute clusters
        - Unproven transferability of geological models across distinct rift and volcanic basins
      - - Field Operations Layer
        - Operating Subsidiaries (High Plains, Cascade)
        - Manages field-level leasing, community relations, town halls, and drilling operations
        - Local regulatory compliance, water resources, and community stakeholder buy-in
        - Operating through regional subsidiaries obscures corporate operating metrics and centralized controls
    notes: Architecture layers synthesized from Koloma job descriptions, vendor announcements, and regulatory filings; operational performance reflects pre-commercial status.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
