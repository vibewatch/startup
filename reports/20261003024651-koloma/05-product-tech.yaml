callouts:
  - calloutType: insight
    title: Compute-Intensive Subsurface Exploration Accelerates Play Derisking
    body: By leveraging GeoComputing’s RiVA private cloud platform to run over 200 petro-technical applications, Koloma compresses multi-day subsurface processing workflows into hours. This compute capability allows integrated exploration teams to evaluate complex rift basin tectonics and volcanic basalts simultaneously across Kansas and Idaho without bearing the overhead of designing an in-house supercomputing infrastructure.
    claimRefs:
      - CE002
      - CE003
      - CE004
  - calloutType: risk
    title: Exploratory Drilling Success Contrasts With Undisclosed Wellhead Commerciality
    body: Although Koloma detected significant hydrogen concentrations in its Kansas test drilling and permitted deep stratigraphic testing exceeding 3,600 meters in Idaho, the venture has not disclosed continuous flow rates, gas purity levels, or commercial production facilities. The technical leap from confirming subsurface hydrogen existence to demonstrating scalable, commercial wellhead extraction remains unproven across frontier basins.
    claimRefs:
      - CE006
      - CE007
      - CE013
