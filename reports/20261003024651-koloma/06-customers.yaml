  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: named-customer-gap
      missingEvidence: >-
        Executed customer contracts or offtake agreements naming the buyer, product,
        committed volume, price mechanism, start date, term, and conditions precedent.
      whyItMatters: >-
        Without contract proof, investors, suppliers, and prospective buyers cannot be
        counted as customers or used to support revenue durability.
      diligencePath: >-
        Review the customer and offtake contract schedule in the data room and confirm
        material terms directly with at least two named counterparties.
      relatedQuestionRefs: [QU003, QU006, QU009]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: adoption-metrics-gap
      missingEvidence: >-
        Customer count, active pilots, production deployments, delivered kilograms,
        utilization, conversion rates, and customer-derived revenue by period.
      whyItMatters: >-
        Internal technical deployment and exploration activity cannot quantify external
        adoption or support a customer growth trajectory.
      diligencePath: >-
        Obtain a monthly customer and pilot cohort export reconciled to invoices,
        delivery records, and production data for the last 24 months.
      relatedQuestionRefs: [QU002, QU008]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: >-
        Renewal, churn, NRR, GRR, contract duration, customer satisfaction, expansion,
        and top-customer revenue concentration metrics.
      whyItMatters: >-
        Durability, land-and-expand potential, and counterparty concentration cannot be
        assessed without contract and cohort evidence.
      diligencePath: >-
        Recalculate retention and concentration from signed agreements, invoices, and
        counterparty-level revenue, separating pilots from production contracts.
      relatedQuestionRefs: [QU004, QU005, QU010]
      relatedTableRefs: [TU001]
    - type: enumeration-incomplete
      severity: material
      topic: adverse-customer-evidence
      missingEvidence: >-
        A complete record of cancelled discussions, failed pilots, blocked deployments,
        customer complaints, procurement objections, and reasons for non-conversion.
      whyItMatters: >-
        The retained reporting establishes exploration uncertainty but does not reveal
        whether commercial counterparties have rejected or delayed Koloma projects.
      diligencePath: >-
        Review the CRM loss log, pilot postmortems, board materials, complaint records,
        and references from counterparties that declined or paused engagement.
      relatedQuestionRefs: [QU007, QU009]
      relatedTableRefs: [TU003]
