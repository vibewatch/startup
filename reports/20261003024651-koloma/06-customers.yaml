schemaVersion: "report-v2"
artifact: customers
slug: koloma
runDate: 2026-10-03
company:
  name: Koloma
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports an internally operational exploration workflow and several
    strategic or supplier relationships, but it does not establish a named paying
    hydrogen customer, executed offtake, commercial production, or retention. The
    customer thesis therefore remains a prospective industrial-sales case rather than a
    demonstrated adoption curve.
sections:
  - id: customer-definition
    title: The buyer map is plausible but not yet verified
    body: >-
      The available material points toward a business-to-business model serving energy
      producers and large industrial users, with hydrogen supply, technology deployment,
      or related services as possible commercial forms. That segmentation comes from a
      gated Preqin profile rather than disclosed contracts, and the profile names no
      customer. Koloma's own recruiting language describes global commercialization as
      an objective, not a completed sale. Strategic investors from energy and aviation
      may improve market access, but investor status is not customer status. The only
      clearly evidenced user group is internal: Koloma geoscientists and IT staff using
      a supplier platform for exploration analysis. As a result, buyer, user, and payer
      roles remain unproven outside Koloma's own operations.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU010, CU012]
    tableRefs: [TU001]
  - id: adoption-stage
    title: Adoption evidence stops before commercial production
    body: >-
      GeoComputing reports that its RiVA platform progressed through user acceptance,
      implementation, and go-live inside Koloma, which is credible evidence of an
      operational exploration workflow. It is not evidence that an external buyer uses
      or pays for Koloma's output. The strongest adverse signal is the Idaho program:
      the retained reporting describes the initial well as a data-collection test whose
      commercial viability is still unknown, while identifying Mali as the location of
      the world's only commercially producing natural-hydrogen well. No retained source
      reports Koloma production volume, hydrogen deliveries, active accounts, locations,
      utilization, or customer-derived revenue. Capital raised and internal deployment
      should therefore not be presented as customer adoption.
    claimRefs: [CU001, CU002, CU005, CU006, CU013, CU016]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof
    title: Named counterparties are suppliers or investors, not proven customers
    body: >-
      Three named relationships illustrate the distinction. GeoComputing is a technology
      supplier to Koloma and documents an internal deployment. Mitsubishi Heavy
      Industries and Osaka Gas are described by Enki as strategic investors; Enki views
      those ties as a possible route to future buyers and separately identifies a
      pre-production offtake agreement as the next meaningful signal. The source does not
      report that either investor has signed such an agreement. New Target's work on
      stakeholder education, policy engagement, and business-development materials also
      shows that Koloma is building commercialization infrastructure, but communications
      enablement is not a deployment outcome. The named-proof table therefore records
      relationship type and the exact missing proof instead of converting counterparties
      into customer logos.
    claimRefs: [CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration are diligence gaps
    body: >-
      Across the eight retained sources, there is no disclosed customer count, NRR, GRR,
      churn, renewal rate, contract length, cohort behavior, satisfaction measure, top-
      customer share, or channel concentration. This is a scoped finding about the
      assigned evidence set, not proof that Koloma has no confidential commercial
      discussions. The absence matters because a future offtake model could concentrate
      revenue in a small number of industrial counterparties, while exploration permits,
      infrastructure vendors, and strategic investors could create separate dependency
      risks. Diligence should require a contract-level customer schedule, executed
      offtake terms, pilot-to-production conversion data, and revenue concentration by
      counterparty before assigning retention or expansion value to the thesis.
    claimRefs: [CU011, CU012, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Do not treat financing or partnerships as demand
    body: >-
      The retained evidence shows substantial financing, supplier deployments, and
      strategic relationships, but no named paying end customer or executed offtake.
      Commercial traction remains a material diligence gap.
    claimRefs: [CU010, CU011, CU012, CU016]
tables:
  - id: TU001
    title: Customer segmentation and proof status
    columns:
      - Segment
      - Buyer / user / payer
      - Intended use case
      - Public scale
      - Revenue or strategic value
      - Evidence gap
    rows:
      - - Energy producers and large industrial users
        - Prospective organizational buyers and hydrogen users
        - Hydrogen supply, technology deployment, or related services
        - null
        - Preqin describes B2B direct sales and strategic partnerships
        - No named client, executed agreement, volume, price, or revenue disclosed
      - - Energy and aviation strategic investors
        - Investors; buyer or payer role is unverified
        - Potential future offtake or commercialization access
        - Mitsubishi Heavy Industries and Osaka Gas are named in one retained 2026 source
        - Strategic access only; no reported offtake in the retained set
        - Confirm whether any investor has customer, option, pilot, or offtake rights
      - - Internal exploration teams
        - Koloma geoscientists and IT staff
        - Subsurface analysis and geoscience applications on RiVA
        - User count not disclosed
        - Demonstrates internal operating readiness rather than external revenue
        - No usage denominator, productivity baseline, or customer-facing deployment
      - - Communities, policymakers, and other stakeholders
        - Non-paying audiences and commercialization gatekeepers
        - Education, policy engagement, and community communication
        - Audience reach not disclosed
        - May reduce permitting and stakeholder friction
        - No evidence linking engagement assets to customer conversion
    notes: >-
      Segments are derived only from the assigned source set; null means no public scale
      was reported, and prospective buyers are not counted as customers.
    claimRefs: [CU001, CU003, CU004, CU007, CU008, CU009, CU010, CU012]
  - id: TU002
    title: Customer growth and adoption evidence
    columns:
      - Evidence or metric
      - Value / status
      - Date or period
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Internal RiVA deployment
        - User acceptance through implementation and go-live
        - Date not stated
        - GeoComputing supplier announcement
        - Medium
        - Koloma has an operational exploration-computing workflow
        - Users, workloads, baseline performance, and external customer use
      - - Idaho Twin Peaks 1W activity
        - Data-collection test; commercial viability undetermined
        - Reported 2025-12-12
        - The Van Trump Report
        - Medium
        - Physical exploration has not yet become customer supply
        - Hydrogen concentration, flow, recoverable volume, and delivered output
      - - Strategic investor signal
        - Mitsubishi Heavy Industries and Osaka Gas investment reported
        - January 2026
        - Enki
        - Low
        - May open future-buyer conversations but is not an offtake
        - Contract, committed volume, price, term, and buyer obligation
      - - External customer adoption
        - No customer count, active-account, location, utilization, or customer-revenue metric found
        - Retained evidence reviewed through 2026-10-03
        - Eight-source assigned pool
        - Medium
        - Adoption trajectory cannot be quantified
        - Total customers, active customers, pilots, production deployments, and revenue basis
    notes: >-
      This table separates internal operating milestones from external customer adoption;
      dates, denominators, and confidence are preserved, and absence is scoped to the
      retained assigned evidence.
    claimRefs: [CU001, CU002, CU005, CU006, CU010, CU011, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Counterparty
      - Segment
      - Deployment or use case
      - Relationship status
      - Reported outcome
      - Limitation
    rows:
      - - GeoComputing
        - Exploration-technology supplier
        - RiVA private-cloud platform used by Koloma geoscientists
        - Implemented supplier relationship
        - Koloma reported go-live and productive internal users
        - GeoComputing is not a Koloma customer and no hydrogen sale is evidenced
      - - Mitsubishi Heavy Industries
        - Strategic industrial investor
        - Potential commercialization or future-buyer pathway
        - Investment reported; customer status unverified
        - No customer outcome reported
        - No offtake, pilot, volume, price, or contract term in retained evidence
      - - Osaka Gas
        - Strategic energy investor
        - Potential commercialization or future-buyer pathway
        - Investment reported; customer status unverified
        - No customer outcome reported
        - No offtake, pilot, volume, price, or contract term in retained evidence
    notes: >-
      Partial enumeration of named counterparties in the successful assigned pool; rows
      distinguish suppliers and investors from paying customers and do not imply sales.
    enumerationScope:
      coverage: partial
      basis: >-
        Named organizations surfaced by the assigned successful source pool through
        2026-10-03; no contract registry or company customer schedule was available.
    claimRefs: [CU001, CU002, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Evidence-based customer journey
    type: journey-map
    summary: >-
      Koloma has reached internal exploration deployment and stakeholder preparation,
      while buyer conversion, delivered supply, retention, and expansion remain unverified.
    data:
      items:
        - label: Prospective segment definition
          detail: Industrial energy users and producers are described only at a generic B2B level.
          status: Hypothesized
          touchpoints:
            - Gated market-data profile
        - label: Stakeholder education
          detail: Website, scientific visuals, and educational content support policy and community engagement.
          status: Operational outreach
          touchpoints:
            - Website and educational materials
        - label: Exploration proof
          detail: Idaho activity is described as data collection to test commercial viability.
          status: Pre-commercial test
          touchpoints:
            - Stratigraphic test well
        - label: Internal workflow deployment
          detail: RiVA progressed through user acceptance, implementation, and go-live at Koloma.
          status: Operational internally
          touchpoints:
            - Geoscience applications
            - Supplier support
        - label: Buyer conversion
          detail: Strategic investors may provide access, but no executed offtake is reported.
          status: Unverified
          touchpoints:
            - Investor relationships
            - Future offtake diligence
        - label: Retention and expansion
          detail: No renewal, churn, contract-length, cohort, or concentration metric is public in the retained set.
          status: No public evidence
          touchpoints:
            - Contract schedule required
            - Concentration analysis required
    approximationNotes: >-
      The sequence is an analytical maturity path, not a measured conversion funnel; no
      conversion rates, elapsed times, or implied probabilities are assigned.
    claimRefs: [CU005, CU008, CU009, CU011, CU014, CU015]
