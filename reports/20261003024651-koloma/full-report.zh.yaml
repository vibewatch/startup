  - id: TV002
    title: 核心投资逻辑与反向论点对照表
    columns:
      - 投资视角
      - 核心逻辑论点
      - 支撑依据与催化剂
      - 反向尽调风险
      - 观点反转触发条件
    rows:
      - - 看多逻辑
        - 天然产出地质氢具备颠覆性低成本清洁基荷潜力
        - 蛇纹石化反应持续生成白氢；模型测算成本仅 $0.50-$1.50/kg
        - 地质聚集可能呈弥散状分布，或赋存于无法触达的极深地层
        - 商业气井试采获权威认证，氢气纯度超 90% 且维持稳定压力
      - - 资本与合作伙伴壁垒
        - 全球资金储备最充裕的探矿方，深度绑定战略企业包销渠道
        - 坐拥 $394M-$403M 充裕弹药；与 Mitsubishi、Osaka Gas、Amazon、United 建立伙伴关系
        - 产业方注资纯属股权投资，缺乏具约束力的保底采购量承诺
        - 签署具法律约束力的多年期照付不议（take-or-pay）商业供气协议
      - - 看空逻辑
        - 地下勘探风险呈现非黑即白的二元性，风险探井缺乏商业先例
        - Twin Peaks 1W 探井许可仅限地层数据采集，禁止开采作业
        - USGS 成矿远景图证实 Mid-Continent Rift 沿线具备勘探潜力
        - Idaho 或 Kansas 连续打出多口干井，或气体浓度低至无法开采
      - - 估值承压因素
        - 一级市场定价达 $823M，在实物勘探确证前提前计入商业发现溢价
        - Series B-1/B-2 累积超 $245M 清算优先权，清偿顺位压制普通股
        - Forge 与 EquityZen 二级老股交易买卖价差过大且缺乏公允挂牌价
        - 二级市场成交倍数回落至勘探发现前的合理估值水平
    notes: 各项论点依据 2024-2026 年核心地质、财务及战略合作一手数据审视核验。
