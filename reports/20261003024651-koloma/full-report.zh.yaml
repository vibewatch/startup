      - number: '7.2'
        title: 监管不确定性、特许审批与地方审视
        blocks:
          - type: paragraph
            body: >-
              Koloma
              面临的首要体制障碍，在于全美范围内普遍缺失监管地质氢开采的统一联邦与州级监管框架。联邦资源权属、公有土地租赁细则、地下矿权法理以及天然氢安全标准均未完成立法，迫使运营方在各州割裂的行政体制中艰难斡旋。在
              Idaho，Department of Lands 与 Oil and Gas Conservation Commission 选择将天然氢勘探与传统化石油气捆绑归类监管，虽然这赋予 Koloma
              开展地震勘测与测试井钻探的短期行政许可，却埋下了长期合规风险与公众负面舆情隐患。借助 Cascade Exploration 等当地子公司名义开展运营，已然激化了社区矛盾并招致负面审视。包括 Citizens
              Allied for Integrity and Accountability 在内的民间组织已正式提出质疑，担忧 Boise 西北部的勘探作业或成为传统化石能源勘探的掩护外衣，危及毗邻 Payette
              County 油气产区的生态环境。此外，获取至关重要的联邦生产激励资格（例如每公斤最高补贴达 $3.00 的 Inflation Reduction Act Section 45V
              清洁氢生产税收抵免），严格取决于全生命周期温室气体排放核算与上游泄漏测算，而这些只有在商业开采井正式落地并实测之后方可最终敲定。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
