      - number: '4.3'
        title: 资本充裕度、现金跑道与投资核保尽调缺口
        blocks:
          - type: paragraph
            body: >-
              自 2021 年成立以来，Koloma 历经 8 轮股权、债权与拨款融资，累计筹集资金达 $403 million [CI009]。历次融资包括 2024 年 2 月完成的关键 $245.7 million
              Series B 轮，隐含投后估值基准达 $823.12 million，获 Khosla Ventures、Breakthrough Energy Ventures、Amazon 旗下 Climate
              Pledge Fund 及 United Airlines Ventures 鼎力支持 [CI010]。产业龙头 Mitsubishi Heavy Industries 与 Osaka Gas 截至 2026
              年初注入的战略资本，进一步扩充了公司的财务安全垫 [CI011]。按照每年数千万美元的预估勘探资金消耗率测算，Koloma 坐拥预计可持续 2 to 4 years 的现金跑道
              [CI012]。然而，重大的投资核保尽调阻碍依然存在。最关键的是，商业化开采测试尚未证实地质氢矿藏的商业可行性与可采性 [CI013]。模型测算的井口生产成本 $0.50 to $1.50 per
              kilogram 缺乏来自生产井的实操验证；在正式披露流量与储层压力之前，财务核保面临巨大不确定性 [CI014]。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
