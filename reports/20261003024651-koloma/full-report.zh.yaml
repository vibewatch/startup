              - CV014
      - number: '8.2'
        title: 当前融资背景、估值锚点与资本结构
        blocks:
          - type: paragraph
            body: >-
              Koloma 的估值演变折射出从早期风投狂热走向依赖里程碑考核的私募市场定价逻辑 [CV009]。2024 年 2 月，Koloma 完成总额达 $215 million 的 Series B-1
              核心轮次，每股价格 $36.00，按发行在外 5,973,007 股测算，确立了 $823.12 million 的投后估值基准 [CV010]。与此同时，公司以每股 $25.92 且发行在外 1,186,199
              股的条件完成了规模 $30.74 million 的配套 Series B-2 轮，同样受制于 $823.12 million 的投后估值上限约束 [CV010]。两类 Series B 股份均附带 1.0x
              不参与分配清算优先权以及 8.0% 非累积股息率，相较于以 $1.00 每股入股的早期普通股与 Series Seed 投资人，形成了明显的优先清算权压顶（preference
              overhang）[CV010]。Forge Global、Nasdaq Private Market 及 EquityZen 等私募二级市场虽向合格投资者提供 Pre-IPO
              股权交易机会，但成交量极其匮乏、买卖价差未见公开报价且无更新交易价格 [CV011, CV012, CV013]。随着 2026 年初 Mitsubishi Heavy Industries 与 Osaka
              Gas 追加产业战略投资使总融资额攀升至 $394M 至 $403M，公司在一级半市场的估值基准依然锚定在 $823M 附近；在井口商业产出获得证实之前，这无异于一家零营收勘探企业的超前过度透支定价
              [CV003, CV004, CV010]。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
      - number: '8.3'
        title: 情景分析、对标基准与投资逻辑破灭诱因
        blocks:
          - type: paragraph
            body: >-
              评估 Koloma 的企业发展轨迹，需要建立覆盖乐观、基准与悲观三种结局的结构化情景承保模型 [CV014]。在乐观情景下，Idaho 和 Kansas
              的勘探地层井证实了商业级流速与高气体纯度，成功兑现测算的井口开采成本 $0.50 to $1.50 per kilogram，并满足 Section 45V 项下最高可达 $3.00 per kilogram
              的联邦生产税收抵免资格 [CV002, CV015]。在此情景下，来自 Osaka Gas、Mitsubishi Heavy Industries 及工业消费巨头的战略承购承诺，将有力支撑公司实施 IPO
              或达成数以十亿美元计的战略并购 [CV004,
              CV014]。在基准情景下，勘探钻探获取的技术数据显示存在温和的天然氢赋存，但储层渗透率与流动机制需要漫长的二次增产作业与漫长开发周期，迫使公司开展平价轮或降价轮的私募过桥融资 [CV006,
              CV014]。在悲观情景下，测试井仅探获低于商业开采阈值的氢浓度、井下气体严重逸散运移，或面临无法逾越的气体分离成本，导致资本搁浅、巨额估值减值甚至企业清算注销 [CV006, CV014]。横向对标的勘探同行如
              HyTerra（在 ASX 上市，坐拥 39,000 Kansas acres 区块）与 Gold Hydrogen（募资 AU$20M），其估值仅为 Koloma 的零头，充分印证 Koloma
              的高额估值溢价建立在地球科学 IP 与资产负债表规模之上，绝非源于更过硬的实际产出证明 [CV004, CV016]。在调配资金前，尽调必须优先索取经权威认证的井口流量测井记录以及 IRS 45V
              全生命周期核算指南 [CV008, CV015]。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV014
              - CV015
      - number: '8.4'
        title: 附表与图表
        blocks:
          - type: callout
            title: 投资立场：维持跟踪，静待井口流量确认
            body: >-
              建议对 Koloma 维持跟踪评级。公司固然是天然氢勘探领域公认的资金与技术领头羊，但面对零营收、无已确认井口流量且勘探干井风险极高的现状，其 $823.12M 估值明显偏高 [CV005, CV007,
              CV010]。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV010
          - type: callout
            title: 二元勘探风险与估值悬顶
            body: Koloma 面临非成即败的地下资源二元风险：若首批垂直地层测试井未能探明具备商业开采价值的氢气浓度，公司缺乏后备营收支撑，股权投资人将承担重大本金损失 [CV006, CV008, CV014]。
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV014
