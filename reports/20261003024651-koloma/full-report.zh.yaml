          values:
            - 灾难性井喷 / 环境防污染屏障失效
            - 失去联邦税收抵免（IRA 45V）法定抵免资格
            - 勘探打出商业干井 / 地下氢气流量未达可行门槛
        - label: 高严重度
          values:
            - 核心知识产权泄露 / 专有地下 AI 数据泄密
            - 中游运输受阻并缺乏区域管网包销通路
            - 风险勘探资金消耗加剧及深井钻机承包商短缺
        - label: 中严重度
          values:
            - 企业下属子公司（Cascade Exploration）品牌稀释
            - 本地民间团体指责借道开采化石能源并引发抗议
            - 沿用传统油气监管规则引发的州级监管分类摩擦
        - label: 低严重度
          values:
            - 常规地震勘探审批延误
            - 内部企业品牌宣传统一步伐脱节
            - 常见 IT 硬件正常轮换更替
        - label: 可忽略严重度
          values:
            - 偶发性办公 IT 支持工单积压
            - 行业峰会差旅时间冲突
            - 官方网站常规公关文稿更新
        - label: 监控阶段
          values:
            - 竞品专利监测
            - 季度学术文献追踪
            - 州级地质调查局数据公开发布
    approximationNotes: 该矩阵结合运营、监管与地质维度的定性评估，对各类风险进行梳理映射。
