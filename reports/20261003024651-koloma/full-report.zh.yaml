  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、规模测算视角与清洁氢替代
        blocks:
          - type: paragraph
            body: >
              Koloma 处于自然资源勘探与工业清洁能源转型的交汇点 [CM001]。随着高耗能工业部门脱碳法令加速出台，更广阔的全球清洁氢市场构筑出迅速扩张的目标客群边界
              [CM003]。在重工业、化学合成与农业肥料生产领域，传统氢气需求绝大部分依赖化石燃料蒸汽甲烷重整（灰氢）满足，造成大量二氧化碳排放
              [CM003]。地质氢由地下深部的地下水与富铁超基性岩经蛇纹石化反应天然生成，提供了一种直接开采排放近乎为零的基础能源替代方案
              [CM002]。地质氢经济规模测算涵盖多个分析维度，既包含庞大的全球氢能经济，也包含运输成本构筑直接商业机遇的区域农业大宗商品消纳
              [CM004]。然而，因各作业盆地的商业级流速与开采经济性尚未得到验证，整体市场规模测算依然受制于早期勘探风险 [CM005]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
