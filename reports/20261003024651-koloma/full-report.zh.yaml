  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 决策链将勘探证据、商业化关键节点与估值基准映射至“观察”评级建议。
    data:
      nodes:
        - id: capital-scale
          label: 资金规模与资方背景
          detail: 累计融资 $394M-$403M，资方包括 Breakthrough、Khosla、Amazon、United、Mitsubishi 及 Osaka Gas
          tone: positive
        - id: geological-testing
          label: 地层探井钻探
          detail: 爱达荷州 Twin Peaks 1W 钻井许可深度超过 3,600m；纯属勘探性数据采集
          tone: neutral
        - id: resource-uncertainty
          label: 商业化开采未经证实
          detail: 无公开出气流量、储层储量数据或商业开采先例
          tone: warning
        - id: unit-economics
          label: 模型测算的井口经济性
          detail: 理论生产成本为 $0.50-$1.50/kg，缺乏实际现场作业的实证依据
          tone: warning
        - id: valuation-overhang
          label: 估值基准压力
          detail: Series B-1 轮投后估值达 $823.12M；附带 1.0x 清算优先权溢价压力
          tone: risk
        - id: recommendation-stance
          label: “观察”建议
          detail: 维持“观察”立场与高风险评级；在井口流量得到实证验证前暂缓直接介入
          tone: neutral
      edges:
        - from: capital-scale
          to: geological-testing
          label: 支持深层钻探
        - from: geological-testing
          to: resource-uncertainty
          label: 揭示地下地质风险
        - from: resource-uncertainty
          to: unit-economics
          label: 阻碍实证确证
        - from: unit-economics
          to: valuation-overhang
          label: 对 $823M 估值形成挑战
        - from: valuation-overhang
          to: recommendation-stance
          label: 支撑投资决策
    approximationNotes: 时序流动架构图，展示从融资输入到最终投资建议的分析决策路径。
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV010
      - CV014
