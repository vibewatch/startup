        - $0.50 – $1.50
        - 理论井口成本下限最低；受制于勘探钻井风险、储层渗透率以及气体纯度
        - Argus Media / Enki.AI 引述的行业测算
      - - 传统灰氢（主流存量）
        - 未配备 CCUS 的化石天然气蒸汽甲烷重整（SMR）
        - $1.00 – $2.00
        - 当前主流供应源；成本直接挂钩天然气现货价格；碳排放极高（~10 kg CO2/kg H2）
        - NHSJS / 行业报告
      - - 蓝氢
        - 配套碳捕集与封存（CCUS）的 SMR 或自热重整（ATR）
        - $1.50 – $2.50
        - 碳捕集设备属于重资产投入；可申领 $0.60–$0.75/kg 45V 税收抵免；承担长期 CO2 封存监测连带责任
        - UNFCCC / 行业报告
      - - 绿氢（电解水）
        - 利用专用可再生电力（光伏/风电）驱动电解水制氢
        - $2.00 – $6.00
        - 受电价与电解槽资本开支主导；在享受全额 $3/kg 45V 补贴下净成本可压降至 $2.00–$4.00/kg
        - Science Direct / 行业报告
