            body: >-
              Koloma 的实地作业版图依托区域运营子公司覆盖美国多个勘探前景盆地。在横跨 Kansas 与 Nebraska 的 Mid-Continent Rift 构造带中，子公司 High Plains
              Resources 于 2023 年底前完成了一套五口井的地层测试钻探计划，并同步开展 2D 地震勘测与导向性生产测试井。在 Idaho 西南部，运营实体 Cascade Exploration 取得 Idaho
              Department of Lands 颁发的州级许可，获准在占地 280-acre 地块上对 Twin Peaks 1W 地层测试井展开钻探，目标直指深度超过 3,600 meters
              的中新世火山玄武岩与互层砂岩。由于实际流速、持续压力曲线及气体组分指标均未公开披露，这些钻探作业的核心重心依然是地下数据采集，而非即期商业供货。
            claimRefs:
