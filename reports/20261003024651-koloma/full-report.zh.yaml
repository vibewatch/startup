      - number: '4.2'
        title: 勘探成本结构、资本密集度与运营支出
        blocks:
          - type: paragraph
            body: >-
              Koloma 运营成本结构以早期巨额地下勘探资本支出及专业技术人员薪酬为主导 [CI005]。作为勘探钻井企业，其资本开支主要流向垂直地层测试井钻探，例如在 Idaho 获批钻探深度超过 3,600 meters
              的 Twin Peaks 1W 测试井 [CI006]。该深度的地层测试钻探涉及钻机动员、套管、测井与岩心取样等高达数百万美元的支出，主要目的在于获取地质数据而非即期商业开采
              [CI006]。运营支出涵盖前沿地理空间计算平台许可、云端分析，以及专业地球科学家和系统架构师的薪酬，其中技术人员薪酬对标基准在每年 $160,000 至 $185,000 之间
              [CI007]。母公司办公室与区域子公司的一般行政管理及公共事务进一步增加了持续日常开销 [CI008]。因缺乏在役生产井或加工设施，Koloma
              并无主营业务成本、毛利率或标准服务交付成本记录，资金消耗主要集中于研发、地球物理勘测与勘探区块评估 [CI005]。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
