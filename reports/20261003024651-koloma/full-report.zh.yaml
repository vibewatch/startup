      - number: '5.4'
        title: 技术差异化、运营管控与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Koloma 的技术差异化优势在于将前沿石油工程计算与专业地球科学伙伴关系相融合，包括与 U.S. Geological Survey 及 Colorado School of Mines
              开展联合研究项目。公司借助详述制氢机制与安全规范的定制科研材料规范外部作业流程，同时在隐秘域名遮蔽下推进区域土地租约收购。然而，其技术栈中仍存在显著的尽调盲区。Koloma
              尚未公开披露连续流动测试、储层渗透率指标或地表气体分离装置设计方案。由勘探数据采集向量产运营设施的跨越，依然是该公司重资产推进战略面临的最主要技术与商业风险。
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: 专题展示
        blocks:
          - type: callout
            title: 算力密集型地下勘探加速区块去风险化
            body: >-
              借助 GeoComputing 旗下的 RiVA 私有云平台运行超过 200 种石油技术应用程序，Koloma 将耗时数天的地下数据处理流程缩短至数小时。强大的算力支持综合勘探团队同时对 Kansas 和
              Idaho 复杂的裂谷盆地构造与火山玄武岩展开综合评估，且无需承受自建超算基础设施的沉重包袱。
            calloutType: insight
            claimRefs:
