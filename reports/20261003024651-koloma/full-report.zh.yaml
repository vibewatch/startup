      - number: '5.3'
        title: 地下数据架构与计算基础设施
        blocks:
          - type: paragraph
            body: >-
              为处理庞大巨量的地质数据集并加速盆地优选，Koloma 选用了 GeoComputing Group 的 RiVA 高性能私有云平台。RiVA 托管了来自头部油气服务商的 200
              多种石油技术勘探应用程序以及专有分析工具，使多学科地球科学团队得以在数小时而非数天内完成复杂的地震数据处理流程。Koloma 内部技术栈整合了基于 Azure 的数据工程管线、关系型 SQL 与
              PostgreSQL 数据库，以及用 Python、Java 和 C# 编写的专有处理模块。该基础设施将区域地质调查、2D
              地震反射数据及地球化学测井资料汇编为统一的地下预测模型，并由全企业自动化灾备与业务连续性系统提供底层保障。
