  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与地质氢勘探模型
        blocks:
          - type: paragraph
            body: >-
              Koloma
              将自身核心技术服务界定为地下地层赋存天然地质氢的勘探、识别与最终开采。不同于经由高碳排放蒸汽甲烷重整或高资本开支电解水制取的传统工业氢，天然白氢系地下水与富铁地层发生水岩蛇纹石化等地球化学反应天然生成。Koloma
              定位于上游勘探与技术开发商，利用专有地球科学建模和空间地理情报锁定具备商业开采价值的富集区。重工业制造、化工及清洁电力领域的工业消纳方迫切需要长期零碳原料，若地下矿藏能以经济可行方式钻获并开采，Koloma
              的上游发现模型将有望成为低成本的一次能源供应来源。
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
