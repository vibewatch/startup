              尽管募资超过 $400 million，Koloma 从未公开披露任何井位关于连续氢气浓度、流速、压力递减曲线或商业储层体积的实测数据。目前全球唯一的商业参照物仍是位于 Bourakébougou, Mali
              的一口浅层井。
