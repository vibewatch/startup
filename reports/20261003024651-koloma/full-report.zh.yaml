            body: >-
              尽调的关键区别在于：Koloma 在 Idaho 获批的 Twin Peaks 1W
              井，在法律与运营归类上仅为地层测试井，纯粹用于岩心取样与数据获取，绝非完井投产的商业开采井。北美地质氢的流速与储层储量目前完全未经证实。
            calloutType: insight
