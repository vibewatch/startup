            title: 雄厚资本实力赋予充裕勘探跑道
            body: 依托从顶尖机构气候基金与产业巨头筹集的 $403 million 总资本，Koloma 构筑起极其稳健的勘探资产负债表，使近期地层钻探免受私募风投市场周期的冲击 [CI009, CI010]。
            calloutType: strength
