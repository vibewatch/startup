  - number: 4
    title: 财务状况
    sections:
      - number: '4.1'
        title: 营收模式、变现机制与商业化路径
        blocks:
          - type: paragraph
            body: >-
              Koloma 当前属于未实现商业化、零营业收入的地球科学勘探企业
              [CI001]。其最主要预期商业收入来源，聚焦于向工业、公用事业及交通运输消纳方勘探、开采并批发供应天然地质氢（白氢）[CI002]。次级潜在变现途径包括与入股该公司的能源公用事业及重工业制造巨头等战略产业伙伴签订长期双边承购和联合开发协议
              [CI003]。此外，Koloma 亦在积极探讨获取联邦生产税收抵免的可能，特别是依据 Internal Revenue Code Section 45V
              设立的清洁氢生产抵免——在全生命周期温室气体排放强度通过严格认证的前提下，每公斤清洁氢最高可享 $3.00 补贴 [CI004]。鉴于 Koloma
              尚未实现商业化投产，亦未宣布达成具备约束力的商业供货协议，旗下所有运营子公司的实际入账营收依然为零 [CI001]。尽管 Mitsubishi Heavy Industries 与 Osaka Gas
              等战略伙伴兼具资金供给并提供接入日本及国际清洁燃料供应链的潜在分销渠道，但并无公开披露数据证实存在最低采购量承诺或照付不议（take-or-pay）合同条款 [CI003]。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
