      - number: '3.3'
        title: 资本与伙伴关系提供助力，但商业实证决定护城河持久度
        blocks:
          - type: paragraph
            body: >
              在干井频现且评价周期漫长、耗资巨大的行业中，充裕资金至关重要。某市场对比报告称 Koloma 融资规模达 $394 million，而 Forge 记录的数据为 $306.44
              million；由于两者的统计口径与核算方法未经调和，不可混为一谈。Forge 亦未列出当前的 Forge Price，即便记录了历史融资数据，也突显出一级半私募市场定价透明度极其有限。Mitsubishi
              Heavy Industries 的入局具备战略意义，因该投资方明确将构建氢能生态系统列为核心战略，但投资行为与合作意向绝不等同于具备约束力的承购协议、分销合同或终端客户承诺。最关键的反向证据来自
              Idaho：据报道 Twin Peaks 1W 井纯属地层数据采集测试，开采可行性依然存疑。同份信源强调 Mali 拥有全球唯一的商业化天然氢开采井，印证了该赛道实际运营实证极其匮乏。所审阅的信源均未披露
              Koloma 的客户定价、合同打包方案、买方转换成本、多归属倾向或已锁定采购量。因此，Koloma 的护城河本质上属于一组获得资金注入的能力架构，其持久性仍取决于可复制的钻井成果与商业协议落地。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
