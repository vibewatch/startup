            body: >-
              在收录的 8 份信源中，均未见公开披露的客户数、NRR、GRR、流失率、续约率、合同周期、同期群行为、满意度指标、头部客户份额或渠道集中度数据。这是基于限定证据库得出的审慎结论，并不排除 Koloma
              存在保密的商业洽谈。此类关键指标缺失不容忽视，因为未来的承购模式可能将营收高度系于少数工业交易对手，而勘探许可、基础设施供应商及战略投资方则可能衍生出各自独立的依附性风险。尽调应要求核查合同级客户明细清单、已签署承购条款、试点向规模量产转化数据以及按交易对手细分的营收集中度，方可在投资逻辑中给予客户留存或扩张估值溢价。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
