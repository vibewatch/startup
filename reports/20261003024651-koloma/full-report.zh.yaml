chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、运营模式与地下地质使命
        blocks:
          - type: paragraph
            body: >
              Koloma 是一家旨在勘探、评估并商业化开采天然地质氢（通称白氢）的勘探型能源企业。公司总部设于 Colorado 州 Denver，并在 Ohio 州 Columbus 设有大型工程与 IT
              基地，业务覆盖美国内陆富铁关键地质构造。其核心战略依托地下深部天然制氢机制：地下水经蛇纹石化反应与富铁玄武岩及超基性岩层相互作用。Koloma
              摒弃地表化石燃料重整或电解水制氢路线，致力于直接开采地下天然富集氢气，为工业脱碳、可持续航空燃料与发电供应低成本、连续且零碳的优质原料。


              为扩充勘探管线，Koloma 运用专有地球科学软件、空间地理建模与人工智能平台整合异构地球物理数据集，优先锁定高概率钻探靶区。公司设立专属区域子公司推进项目级运营（例如 Idaho 的 Cascade
              Exploration），以此隔离勘探许可与现场作业风险，同时由母公司统一掌控核心技术与治理架构。
            claimRefs:
