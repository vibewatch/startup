            title: 切忌将融资规模或伙伴关系视同终端需求
            body: 现有证据仅证实公司具备可观融资储备、供应商系统部署与战略合作关系，但未见任何具名付费终端客户或已签署承购协议。商业拓展成效依然属于重大尽调缺口。
            calloutType: risk
