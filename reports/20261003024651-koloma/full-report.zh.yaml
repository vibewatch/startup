      - number: '1.2'
        title: 创始人、高管团队与治理架构
        blocks:
          - type: paragraph
            body: >
              Koloma 由一支跨学科团队创立，融合了地下地球科学学术造诣、前沿能源运营以及风险商业化经验。核心管理层与技术架构包括首席执行官 Pete Johnson、科学创始人兼地球科学家 Tom Darrah
              博士、前首席商务官 Paul Harraka，以及统领 IT 架构与地下数据系统的高管技术团队。该技术团队汇聚矿产勘探、石油数据工程和企业级云架构专业人才，联袂搭建自动化地球科学平台。


              公司治理监督与战略资本高度集中于顶级机构风投财团与产业战略投资方。基石投资人包括 Bill Gates 旗下的 Breakthrough Energy Ventures、Khosla
              Ventures、Energy Impact Partners、Piva Capital 与 Prelude Ventures，产业战略方则涵盖 Amazon 旗下的 Climate Pledge
              Fund、United Airlines Ventures 以及 Mitsubishi Heavy
              Industries。公司高度依赖地质建模与现场特许审批领域的关键核心人员，而董事会席位与运营投票权牢牢掌握在早期机构领投方手中。
