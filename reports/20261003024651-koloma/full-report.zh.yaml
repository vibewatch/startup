      - number: '2.2'
        title: 买方细分、区域承购经济性与农业替代
        blocks:
          - type: paragraph
            body: >
              Koloma 优先确立区域市场切入策略，侧重于农业化肥生产商与 Midwest 农业合作社，而非远距离能源输送 [CM004]。美国 Midwest Corn Belt
              每英亩消耗的氨基肥料超过全球其他任何农业区，但每年仍需依托管道从 Louisiana 以及海外供应商输入约 2 million tons 氨 [CM004]。在 Iowa、Kansas 和 Minnesota
              等州，长途运输会增加每吨约 $150 的到货溢价，因而紧邻农业需求实施本地地质氢开采能即刻构筑利润安全垫 [CM004]。在此区域配置下，地质氢可直接供给当地 Haber-Bosch
              合成设施，无需斥巨资兴建蒸汽甲烷重整装置即可替代价格波动的化石天然气原料
              [CM004]。工业化学品制造商、合成燃料生产商与能源公用事业公司属于次级买方群体，面临更高基础设施门槛，包括铺设专用管道需求与繁复的承购技术规范 [CM003, CM005]。
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
      - number: '2.3'
        title: 增长驱动因素、监管激励与采纳瓶颈
        blocks:
          - type: paragraph
            body: >
              联邦政策与技术日趋成熟是天然氢商业化的核心市场催化剂 [CM001, CM006]。Inflation Reduction Act Section 45V Clean Hydrogen Production
              Tax Credit 对全生命周期温室气体排放近乎为零的氢气提供最高 $3.00/kg 补贴，奠定了坚实财务基底，大幅改善低成本地质开采的利润空间 [CM006]。州级举措（例如 Michigan 于 2026
              年推出的 Geologic Hydrogen Exploration and Preparedness Initiative）给予监管认可，降低勘探许可审批风险 [CM006]。此外，先进高性能计算平台（如
              2026 年启用的 Ri VA 私有云）将地下数据处理耗时从数天压缩至数小时，显著加快勘探区块的靶区甄选进程 [CM001,
              CM007]。尽管坐拥多重利好，严峻的采纳瓶颈依然存在：公开股票市场与二级交易平台缺乏流动性定价机制 [CM009, CM010]，地下氢气流速尚未得到商业级验证
              [CM005]，且非上市风险投资估值与经核实的油气井产出严重脱钩 [CM008, CM011]。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 专题展示
        blocks:
          - type: callout
            title: Corn Belt 战略优势：农业合成氨充当核心基石承购
            body: >
              Koloma 将初期商业化重点聚焦于美国 Midwest Corn Belt，精准捕捉独特的地理套利机遇 [CM004]。通用氢气的大规模应用往往受制于远距离管道设施缺失和专用低温运输受阻，而 Midwest
              则是全球最集中的农业合成氨市场，每年输入 2 million tons 氨，且相比 Gulf Coast 枢纽价格需承担平均每吨 $150/ton 的运费溢价 [CM004]。沿 Midcontinent
              Rift 统筹布局天然氢勘探与开采，使 Koloma 得以规避长途运输成本，直接供应区域内 Haber-Bosch 化肥制造工厂 [CM004]。
            calloutType: insight
            claimRefs:
              - CM004
          - type: callout
            title: 未经证实的单井流量与勘探资源预期落差
            body: >
              尽管从私募风投斩获超过 $400 million 资金并在全球锁定数百万英亩勘探区块，天然氢勘探目前仍处于商业化前期 [CM005, CM011]。模型推演的井口开采成本 $0.50–$1.50/kg，完全取决于
              Idaho 的 Twin Peaks 1W 等地层测试井能否测得商业可行流速及高气体纯度 [CM002, CM005]。在连续流速和商业寿命获得实测数据证实之前，潜在市场规模依旧停留在未经证实的理论边界
              [CM005]。
            calloutType: risk
            claimRefs:
              - CM002
              - CM005
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 前沿市场两极分化：资源开采商与勘探赋能商
        blocks:
          - type: paragraph
            body: >
              当前可见的天然氢领域并非单一同质客群。第一类走重资产勘探路线：Koloma、Max Power Mining、HyTerra、Gold Hydrogen、H2EX 与 Hydroma
              均致力于获取或运营实体资源区块。第二类包括 Snowfox Discovery 与
              Getech，主要出售或研发旨在优化靶区甄选的数据和地质工具。某独立机构的对比报告指出这种战略分野，但该材料属于行业综述汇总，并非经过独立核实的对标基准，其关于区块面积、融资额与运营状态的数据依然属于单一信源指标。在此对比中，据称
              Koloma 处于资金规模领先地位，Max Power 拥有最多的已公开披露区块面积，HyTerra 和 Gold Hydrogen 属于活跃钻探方，Hydroma
              则是商业化开采参考样本。工业制氢、买方自建项目以及对既有传统供应的持续依赖均属于实质替代选项，但所审视的信源库并未在价格、可靠性或碳排放等可比维度上予以量化。由此得出的竞争格局有助于研判战略原型，绝不可作为判定行业赢家的定论。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
