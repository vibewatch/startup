  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 地下地质成藏与开采可行性风险
        blocks:
          - type: paragraph
            body: >-
              Koloma 的核心商业立论立足于在大陆地下地层中找寻并商业化开采地质氢。然而，全球地球科学界对地下氢系统认知依然浅薄，给每一笔资本注入带来巨大的勘探风险。迄今为止，全球仅有一口商业化开采天然氢井（位于
              Bourakebougou, Mali），Koloma 位于 Idaho、Kansas 及 Iowa 的本土勘探资产全然缺乏北美实操运营先例。在 Canyon County, Idaho，Koloma
              旗下运营实体 Cascade Exploration 获准钻探 Twin Peaks 1W 垂直地层测试井，设计井深 3,658 meters（超 3,600 meters），目标层位为中新世火山岩与
              Columbia River Flood Basalts。U.S. Geological
              Survey（USGS）氢成矿远景模型评估认为该靶区成功概率仅为中等，并特别指出相比超基性橄榄岩，基性火山岩岩性在地球化学特征上不利于发生经典的蛇纹石化反应。尽管高地温热流或放射性辐解理论上有望生成或运移深层氢，但商业富集浓度依然未经证实。尤为关键的是，Twin
              Peaks 1W 钻探许可明确载明该井眼纯属地层及地质数据采集，严禁作为生产井完井投产，突显出商业资源的可探明性仍属于悬而未决的科学课题。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
