      - number: '3.4'
        title: 专题展示
        blocks:
          - type: callout
            title: 一体化综合能力是差异化逻辑的可信依托
            body: |
              Koloma 汇聚了专有数据声称、云端结合 AI 的地球科学平台信号、实地勘探布局、资本规划实力以及产业战略投资者。这一布局远比纯粹圈地或单一软件策略更具纵深，但其竞争优势尚未获得横向实地作业对比成果的证实。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP016
          - type: callout
            title: 护城河仍停留在投产前阶段
            body: |
              获批的数据采集井与庞大的资金储备或能提高试错迭代胜率，但二者均无法确立商业化开采、可复制的经济效益、买方采纳度或坚实的定价权。这些缺失的实证正是竞品尽调的核心要件。
            calloutType: risk
            claimRefs:
