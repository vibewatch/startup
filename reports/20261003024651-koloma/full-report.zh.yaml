      - number: '1.3'
        title: 融资历程、地层钻探与勘探里程碑
        blocks:
          - type: paragraph
            body: >
              自 2021 年正式设立以来，Koloma 经由股权轮次、常规债务和联邦科研拨款累计斩获约 $400 million 总融资，成为全球资金储备最雄厚的天然氢纯业务企业。主要融资节点包括：2021 年 8 月的
              $5.0M Seed 轮；2022 年 7 月由 Breakthrough Energy Ventures 与 Energy Impact Partners 领投的 $55.7M Series A 轮；2024
              年 2 月总额达 $245.7M 至 $280M+ 的 Series B 重磅融资，吸引了 Khosla Ventures、Amazon 及 United Airlines 参投。2024 年末与 2026 年
              1 月，公司吸纳 Mitsubishi Heavy Industries 和 Osaka Gas 的出资，进一步扩大战略企业投资阵容。Forge Global 等一级半私募市场跟踪数据显示，Series B
              发行后公司隐含投后估值基准达 $823.12M。


              在业务运营端，Koloma 核心现场里程碑聚焦于 Boise 以西的 Notus, Idaho 勘探区。Idaho Department of Lands 已针对该区的 Twin Peaks 1W
              测试井颁发勘探性地层钻探许可。该项目靶向深度超过 3,600 meters
              的火山玄武岩构造，本质上属于勘探性地层数据采集作业，并非即期商业化生产设施。与此并行，尽管地下氢气流速、浓度水平以及商业储层封闭机制面临巨大地质不确定性，公司仍在 Kansas、Iowa 和 California
              持续开展勘探制图。
