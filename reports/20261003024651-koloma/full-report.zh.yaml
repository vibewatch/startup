      - number: '7.3'
        title: 作业执行、供应链约束与资本密集度
        blocks:
          - type: paragraph
            body: >-
              从地下计算建模跨越至现场井口实体开采，使 Koloma 暴露于严苛的作业与交易对手依赖之下。能够钻透高研磨性火山玄武岩构造且深度超 3,600 meters
              的特种深井钻机供应极度紧缺，全行业亦深陷专业承包商与井下氢气监测设备严重短缺的困境。地下氢气极易造成传统钢制钻柱氢脆现象，并伴随极快的大气逸散扩散特性，因此必须采用特种冶金材料与专有数字化架构。为把控庞大计算数据管线，Koloma
              必须在 Denver 与 Columbus 工程基地搭建涵盖云计算、地理空间数据工程与企业网络安全在内的定制化地球科学基础设施。在财务端，尽管 Koloma 经由多次股权融资筹得约 $394 million 至
              $403 million（Series B 估值测算达 $823.12 million），但深层地层钻探与多盆地地震勘测正引发剧烈资金消耗。即便工业巨头 Mitsubishi Heavy Industries 和
              Osaka Gas 的战略注资提供了行业背书与潜在商业落地通路，但在缺乏专用输氢管网的现状下，依然无法消除中游处理、储运分销及承购履约风险。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR015
              - CR016
      - number: '7.4'
        title: 专题展示
        blocks:
          - type: callout
            title: 北美商业先例归零困境
            body: >-
              在全球仅有一处商业级天然氢生产田（位于 Bourakebougou, Mali）的背景下，Koloma
              正将数千万美元重金砸向前沿风险探井。在缺乏北美盆地实测持续流速、压力动态或气体纯度数据支撑的前提下，Koloma 当前估值隐含着一系列尚未在商业规模上得到验证的技术与地质突破。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR007
          - type: callout
            title: 地方子公司名义掩护与社区信任赤字
            body: >-
              Koloma 选择借助 Idaho 的 Cascade Exploration
              等地方实体运作勘探项目，滋生了严重的社群信任与公关危机。当地民间监督组织怀疑其暗中勘探化石燃料；这一现实敲响警钟：在传统油气监管框架下运作必须向利益相关方保持绝对透明，否则极易遭遇代价高昂的许可审批冻结风险。
            calloutType: insight
            claimRefs:
              - CR008
              - CR010
              - CR011
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 核心投资逻辑、反向论点与尽调现实
        blocks:
          - type: paragraph
            body: >-
              Koloma 展现出极具吸引力却高度投机的新兴投资画像，其逻辑基石建立在勘探地下天然地质氢的潜在机遇之上
              [CV001]。核心投资逻辑认为，地下水与富铁岩石经深层蛇纹石化天然反应生成的地质氢，有望作为基础清洁能源原料，其开采经济性远胜于高资本开支的人工合成绿氢 [CV002]。依托来自顶级气候与产业机构投资者（包括
              Breakthrough Energy Ventures、Khosla Ventures、Amazon 旗下 Climate Pledge Fund、United Airlines，以及日本战略伙伴
              Mitsubishi Heavy Industries 和 Osaka Gas）累计 $394 million 至 $403 million 的融资注入，Koloma 坐拥全行业最庞大的勘探资产负债表
              [CV003, CV004]。然而，反向论点同样尖锐且现实：公司处于零营收状态，置身于除 Mali 一口简易小井外商业级流速未经证实的前沿领域，且玄武岩深井钻探绝无保证能探获商业可行矿藏，面临极致的勘探风险
              [CV005, CV006]。首席执行官 Pete Johnson 明确承认这些不确定性，警示勘探既非既成事实亦非稳赢押注，尽管一旦取得商业突破将彻底改写能源转型的经济格局 [CV007]。以风投尺度评估
              Koloma，必须接受非生即死的二元资源风险，同时静待 Idaho 的 Twin Peaks 1W 井等实地地层测试井采集关键储层数据 [CV008]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
