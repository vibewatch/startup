      - number: '5.3'
        title: Developer Signal, Cloud Infrastructure, and Technical Operating Rigor
        blocks:
          - type: paragraph
            body: >-
              Technical development signals from public repositories and practitioner surfaces reflect Go1's focus on
              microservice debugging, partner webhook authentication, and LMS bridge utilities. Go1 maintains
              open-source developer assets on GitHub under the go1com organization, including Bridge To Kubernetes (B2K)
              for local microservice debugging, technical interview evaluation repos, PHP-based RESTful service
              builders, and TypeScript verification libraries enabling integration partners to validate cryptographic
              signatures in webhook headers. Core platform infrastructure is hosted entirely on Microsoft Azure,
              delivering global cloud availability. In May 2026, Go1 executed a major infrastructure upgrade that
              improved typical response times by 36% to 42% globally and reduced slowest request latencies by 44% to 58%
              across Australia, the United States, and Europe, maintaining system uptime through a brief two-minute
              maintenance window. Corporate collaboration is deeply anchored in ecosystem partnerships, prominently
              including the Go1 Learning app for Microsoft Teams, which enables workers to discover, share, and discuss
              courses directly within everyday enterprise communication channels. Independent venture tracking confirms
              sustained capital backing across 2009 through 2026, supporting extensive engineering investments in
              latency reduction and partner API throughput.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Data Residency, Security Governance, and Technical Limitations
        blocks:
          - type: paragraph
            body: >-
              Enterprise trust, privacy governance, and regulatory compliance represent both operational moats and
              technical boundaries for Go1. The company publishes a defined data residency framework, allowing
              enterprise clients to designate where Personally Identifiable Information (PII) is stored—with localized
              storage options in Australia, the United States, or the European Union (Ireland)—while core data
              processing primarily occurs in Australia. Go1 holds ISO 27001:2022 security certification and an audited
              SOC 2 Type II attestation. Despite these enterprise safeguards, technical and product diligence reveals
              material architectural constraints. First, Go1 does not provide native mobile applications for learners on
              iOS or Android, relying entirely on web browser responsive design; while functional for desk-based
              corporate staff, Go1's own support documentation notes that third-party course playback is optimal on
              laptops or desktops, creating usability friction for field, shift, or care workers. Second, third-party
              content is subject to licensing expirations and periodic decommission, forcing clients to rely on advance
              retirement webhooks (content.decommission.pending) and recurring manual re-curation. Third, Go1's catalog
              consists of non-accredited training: in regulated environments such as Australian NDIS disability care,
              Go1 provides an 11-item introductory playlist rather than accredited clinical modules or audit-ready
              Practice Standards mapping, requiring employers to procure accredited training from specialized Registered
              Training Organisations (RTOs).
            claimRefs:
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE011
