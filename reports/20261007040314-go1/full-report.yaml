          annual revenue.
        - Treat the posture as robust but any point valuation as unsupported.
      - - Risk rating
        - High
        - Current margins, retention, cash use, concentration, debt, and preference seniority remain undisclosed.
        - Require downside protection only after the full capital structure is reviewed.
      - - Valuation stance
        - Unpriced; historical marks look evidence-heavy
