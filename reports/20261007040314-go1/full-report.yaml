              - CP008
              - CP011
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP011
              - CP012
      - number: '3.3'
        title: Pricing, distribution, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              Public price discovery is unreliable. SelectHub lists a $10 per-user monthly starting price with a
              freemium model, whereas GetApp lists $10 per user per year under a subscription model; neither figure is
              presented here as realized enterprise pricing. The fetched Go1 homepage provides no numeric price and
              instead directs buyers to an expert. Distribution can create practical switching friction because Content
              Hub, Connect, embedded workflows, and integrations place Go1 inside an existing learning stack. Yet the
              same architecture also permits multi-homing: GetApp lists Docebo among integrations, and the
              company-sponsored survey describes buyers already using multiple content vendors. Contract terms,
              discounts, renewal mechanics, content-provider concentration, and export portability remain private
              diligence items.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a convenience moat, not a proven structural moat. Provider breadth, multilingual
              reach, open content formats, and workflow embedding can reduce procurement and administrative effort.
              However, the Go1-sponsored survey itself says 47% of L&D leaders could not find upskilling content that
              fit all needs and that more than half believed 10% to 25% of budget was wasted on ineffective or unused
              content. Review evidence adds restricted custom authoring, reporting gaps, unclear packaging, slow system
              behavior, and a historical enrollment complaint. Incumbent suites can respond by bundling content and
              analytics, while buyers can retain several vendors. Durability therefore depends on content quality,
              recommendation accuracy, integration depth, and measurable outcomes that are not independently benchmarked
              in the assigned sources.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP008
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public price evidence conflicts
            body: >-
              SelectHub and GetApp both display a $10 starting price but disagree on whether the unit is monthly or
              annual and whether the model is freemium or subscription. A dated enterprise quote is required before any
              cost comparison.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
          - type: callout
            title: Breadth creates convenience, not automatic lock-in
            body: >-
              Provider breadth, open-format distribution, and embedding can make Go1 convenient, but named incumbent
              alternatives, multi-vendor behavior, and reported customization and reporting gaps leave buyers credible
              paths to multi-home or switch.
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP008
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Subscription Monetization Model
        blocks:
          - type: paragraph
            body: >-
              Go1 functions as an enterprise corporate training aggregator, providing enterprise organizations with
              unified access to curated learning content across more than 300 content creators and publishers. The core
              commercial model relies on recurring business-to-business subscriptions billed annually in advance for
              access to tiered libraries, designated as Essentials Select, Premium Essentials, and Premium Pro. Rather
              than publishing standard public per-seat rate cards, Go1 negotiates team and enterprise licenses with
              customized annual commitments, subject to a stated $20,000 annual spend threshold for dedicated
              implementation project management. Enterprise customer contracts incorporate auto-renewal provisions
              requiring at least thirty days written cancellation notice prior to annual expiration, and constrain
              operational flexibility by capping internal seat reassignment at twenty percent per contract year. This
              structure creates predictable upfront annual cash flow, yet leaves realized average contract values and
              per-seat net realization obscured behind custom quote discounting.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
