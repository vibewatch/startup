chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Model, and Market Position
        blocks:
          - type: paragraph
            body: >-
              Go1 (legally founded as Go1 Pty Ltd) is a corporate learning and development (L&D) content aggregation
              platform originally established in 2009 and incubated at Y Combinator in 2015. Operating out of Underwood
              in the Brisbane metropolitan region of Queensland, Australia, alongside primary offices in the United
              States, the United Kingdom, Singapore, and Malaysia, Go1 operates as a curated content aggregator akin to
              a 'Spotify for corporate learning'. The platform aggregates digital learning resources from more than 300
              commercial content providers and publishers, distributing courseware across workforce compliance,
              leadership, technology skills, and professional development. Rather than producing proprietary pedagogical
              content, Go1 licenses material from publishers who receive usage royalties based on consumption, packaging
              these catalogs into single corporate subscription licenses delivered directly or embedded into third-party
              Learning Management Systems (LMS), Human Resources Information Systems (HRIS), and collaboration software
              such as Microsoft Teams.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
