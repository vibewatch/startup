  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Evidence-supported case
      - Counterpoint
      - What would change the view
    rows:
      - - Distribution scale
        - Go1 claims more than 10,000 organizations use the platform.
        - The public count does not disclose active seats, retention, contract value, or concentration.
        - Customer-level ARR, gross retention, net retention, and top-account concentration.
      - - Content breadth
        - Go1 claims content from 300+ providers in 120+ languages.
        - Provider breadth may add royalty cost, overlap, and curation complexity.
        - Provider concentration, royalty schedule, content usage, and contribution margin.
      - - Product expansion
        - The company announced Go1 Learn, Go1 Pay, and Go1 Insights in 2025.
        - Launch evidence does not establish paid adoption or incremental revenue.
        - Attach rates, standalone pricing, expansion ARR, and product-level retention.
      - - Vertical defensibility
        - Broad coverage can serve employers with cross-category learning needs.
        - A disclosed competitor found Go1's NDIS offer less specialized and cited restrictive seat mechanics.
        - Direct product mapping, signed customer references, and current contract terms.
    notes: >-
      Company claims are not independently verified; Wyzed is a competitor and is used as an adverse diligence lead, not
      as an independent benchmark.
