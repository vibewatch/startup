      - number: '4.2'
        title: Cost Structure, Gross Margin Drivers, and Content Royalties
        blocks:
          - type: paragraph
            body: >-
              The defining cost component of Go1 business model is content partner royalties, governed by standard
              bilateral Content Partner Terms. Go1 defines a contractual Revenue Share Pool calculated as an agreed
              percentage of Net Revenue, where Net Revenue deducts applicable sales taxes, standard 3% payment
              processing and administrative handling fees, mobile platform store fees, and user refunds from gross
              subscription revenue. The partner pool is distributed proportionally based on relative consumption,
              specifically the exact percentage of total consumed minutes of partner content on the Go1 Premium Library
              during the accounting period. While this usage-variable royalty structure protects Go1 from paying for
              idle or unviewed courses, it establishes a variable gross margin floor where expanding learner engagement
              directly increases content payout liabilities. Beyond partner payouts, Go1 incurs customer onboarding and
              integration costs, including dedicated implementation support and enterprise HRIS and LMS connector
              maintenance.
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: Reported Commercial Scale and Metric Corroboration
        blocks:
          - type: paragraph
            body: >-
              Publicly visible commercial metrics indicate substantial enterprise distribution, with Go1 marketing
              adoption across more than 10,000 customer organizations and multiple secondary marketplaces tracking its
              scale. Unaudited industry benchmarks from GetLatka estimate Go1 annual recurring revenue at $94.8 million
              for October 2024, expanding from an estimated $68.9 million in 2023 and representing roughly 37.6%
              annualized growth. However, Go1 has not published audited financial statements or officially corroborated
              these ARR estimates. Furthermore, critical software performance metrics such as net revenue retention,
              logo churn, customer acquisition cost payback duration, and gross margins remain strictly private.
              Secondary transaction platforms also reflect data divergence regarding historical founding dates and
              corporate entities, underscoring that third-party profile aggregators compile disparate inputs without
              independent accounting verification.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Capital Adequacy, Historical Funding, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Go1 has financed its platform expansion and creator catalog aggregation through substantial institutional
              venture backing, having raised approximately $400 million to $480 million across multiple equity rounds,
              including a landmark $200 million Series D financing round that established a $1 billion valuation.
              Secondary platforms including Forge Global indicate a subsequent $2.0 billion private valuation anchor
              recorded as of mid-2026, though primary trading volume and transaction clearing prices remain opaque.
              Because Go1 maintains private company reporting status, its current balance sheet cash reserves,
              operational monthly cash burn rate, debt or credit obligations, and remaining runway cannot be verified
              through public filings. From an underwriting perspective, while Go1 demonstrates compelling market
              positioning and significant aggregated enterprise reach, institutional capital allocators cannot validate
              sustainable unit economics without direct diligence disclosure of gross margin splits, retention cohorts,
              and cash flow dynamics.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Content Royalty Gross Margin Floor
            body: >-
              Go1 usage-based revenue share structure aligns creator compensation with learner activity, but creates an
              inherent gross margin constraint: as user engagement expands, creator royalty liabilities increase in
              tandem. Without public disclosure of the agreed pool percentages, investors cannot verify whether platform
              gross margins mirror high-margin software (70%+) or lower-margin distribution aggregators (40%-50%).
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: callout
            title: Valuation Multiple Premium Versus Metric Visibility
            body: >-
              With secondary marketplaces anchoring Go1 valuation at $2.0 billion against unverified secondary ARR
              estimates of $94.8 million, Go1 commands an implied revenue multiple exceeding 20x. In the absence of
              audited net retention, gross margin, and cash burn metrics, this valuation implies aggressive forward
              growth and software-level profitability that cannot be verified from public documentation alone.
            calloutType: insight
            claimRefs:
              - CI010
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, SKU Architecture, and Enterprise Learning Suite
        blocks:
          - type: paragraph
            body: >-
              Go1 defines its core product value proposition not as an author of proprietary coursework, but as an
              aggregation middleware and turnkey content marketplace for enterprise learning and development (L&D)
              leaders. Historically, organizational training procurement has required managing a fragmented patchwork of
              vendor contracts, with industry surveys showing that 40% of organizations juggle five or more external
              learning providers and 14% manage ten or more. Go1 addresses this operational overhead through a unified
              subscription delivering aggregated courseware from over 300 publishers across compliance, professional
              leadership, technology skills, and soft skills in more than 40 languages. The product delivery surface is
              organized around the Go1 Learn product suite, unveiled alongside the company's brand repositioning under
              CEO Chris Eigeland. The suite packages consumer-grade discovery, dynamic homepages, and role-targeted
              playlists, complemented by Go1 Pay—which manages flexible, personalized learning budgets—and Go1 Insights,
              which tracks workforce skill benchmarks and consumption trends against organizational targets. Commercial
              packaging is structured into distinct SKU tiers: Go1 Learn (base platform access), Essentials Select
              (capped course allocations of 10, 25, or 50 curated items), and Premium tiers (Essentials and Essentials
              Plus, unlocking broader catalog rights and advanced curation). Rather than replacing client LMS
              infrastructure, Go1 operates as a content supply pipe that embeds into client workflows.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: Integration Middleware, API Architecture, and Interoperability
        blocks:
          - type: paragraph
            body: >-
              Go1's technical operating model functions as an API-first distribution layer connecting content
              publishers, third-party HR platforms, and end learners. The technical surface spans public RESTful
              endpoints (notably the 2025-01-01 v3 Public API release), the Publishing API for automated course catalog
              ingestion and metadata normalization, and the Plan and Portal APIs for programmatic customer provisioning,
              license activation, and subscription lifecycle management. The company maintains bidirectional
              integrations with over 75 human resources and LMS platforms, including Workday, SAP SuccessFactors, Oracle
              Learning, Schoox, LearnUpon, Absorb, Paylocity, and Paycor. In June 2026, Go1 launched a public Model
              Context Protocol (MCP) Server for content discovery, enabling permission-aware AI agents and enterprise
              chatbots to query the Go1 course catalog by skill, provider, language, and duration while enforcing the
              user's portal access entitlements. For learning packaging interoperability, Go1 accepts inbound bulk
              uploads of up to 1,000 SCORM packages into customer portals and supports exporting custom courses as SCORM
              packages. Content delivery is facilitated by an Embedding SDK that renders Go1 Learn experiences natively
              inside partner interfaces, while SSO-based identity federation synchronizes employee language preferences
              dynamically during playback across enterprise systems.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
