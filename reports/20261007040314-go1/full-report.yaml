              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution Ecosystem and Embedded Integration Moat
            body: >-
              Go1's pre-built integration ecosystem across 75+ HRIS, LMS, and collaboration platforms—including Workday,
              SAP, Oracle, and Microsoft Teams—creates substantial network distribution moats. Rather than asking
              enterprises to adopt a new standalone destination portal, Go1 embeds seamlessly into tools employees
              already use daily.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE013
          - type: callout
            title: Mobile Friction and Non-Accredited Curriculum Boundaries
            body: >-
              The absence of a native learner mobile application and reliance on non-accredited third-party courseware
              restrict Go1's applicability for field-heavy, shift-based, and strictly regulated workforces. In sectors
              like disability care or healthcare, buyers must purchase accredited training from dedicated RTOs.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Enterprise Buyer Persona
        blocks:
          - type: paragraph
            body: >-
              Go1 segments its commercial customer base primarily across enterprise corporations, mid-market
              organizations, and professional services networks seeking to simplify corporate training procurement.
              Enterprise buyers are typically centralized Chief Learning Officers, Chief People Officers, or HR
              technology directors seeking to consolidate disparate commercial content contracts into a unified annual
              enterprise subscription. Rather than serving as an end-to-end Learning Management System (LMS) with
              proprietary authoring and audit tracking, Go1 positions itself as a centralized content aggregation hub.
              The buyer is predominantly human resources and talent development leadership, while the user population
              consists of all active enterprise knowledge workers, field staff, or retail associates. Demand is driven
              by two distinct procurement jobs: baseline regulatory workplace compliance (such as anti-harassment, work
              health and safety, and cybersecurity awareness) and discretionary employee upskilling across leadership
              and technology domains. However, buyer incentives diverge across segments: while global enterprises with
              established LMS platforms leverage Go1 to enrich existing workflows via Workday, ADP, or Docebo
              integrations, mid-market organizations without an existing LMS face unexpected software stack duplication.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption Trajectory, Learner Reach, and Engagement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Go1's top-line commercial reach is anchored by self-reported scale exceeding 10,000 customer organizations
              and a historical reach of over five million registered corporate learners. Across its active accounts,
              adoption trajectory is heavily influenced by delivery modality: organizations deploying Go1 through deep
              native LMS and collaboration integrations (such as Microsoft Teams) observe higher baseline engagement
              than those relying on standalone web portal logins. Recent behavioral shifts highlight accelerated
              enrollment in emerging technical categories; for instance, over 600,000 learners enrolled in AI-related
              coursework on Go1 in the trailing year, with foundational awareness and governance topics outperforming
              advanced engineering. Despite broad reach, enterprise L&D surveys conducted by Go1 and independent
              procurement registries reveal persistent engagement bottlenecks: 75% of L&D leaders report that
              organizational ownership of AI strategy and training remains ambiguous, while more than half of surveyed
              enterprise leaders acknowledge that 10% to 25% of their training budget is wasted on unused or ineffective
              catalog material. Furthermore, Go1 does not publicly publish active monthly learner denominators, net
              renewal percentages, or cross-cohort seat utilization metrics, leaving true post-deployment software
              engagement opaque.
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU005
