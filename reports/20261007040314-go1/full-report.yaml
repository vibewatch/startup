      - number: '3.2'
        title: Capability, scope, and evidence quality
        blocks:
          - type: paragraph
            body: >-
              Go1's strongest evidenced differentiation is distribution rather than proprietary content ownership.
              GetApp reports that Content Hub supports content search and pre-curated playlists, while Go1 Connect can
              distribute SCORM, xAPI, and AICC files and embed content into business workflows. A syndicated company
              announcement adds AI-powered discovery, a dynamic homepage, Go1 Pay, and Go1 Insights to the suite.
              Customer-review evidence supports centralized compliance and professional-development delivery, but it
              also identifies limitations in custom authoring and advanced reporting. Because the pool contains no
              current, independent, side-by-side benchmark of Go1, Moodle, and Cornerstone, unsupported competitor cells
              are explicitly marked unknown rather than scored.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
