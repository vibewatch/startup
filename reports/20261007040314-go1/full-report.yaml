      - number: '6.3'
        title: Named Customer Deployments, Outcomes, and Production Proof
        blocks:
          - type: paragraph
            body: >-
              Independent technographic tracking from Apps Run The World corroborates widespread enterprise production
              adoption of Go1 Content Hub across diversified commercial verticals. In professional services and
              accounting, international advisory network Bentleys implemented Go1 across 700 staff in 18 locations
              throughout Australia, New Zealand, and China, centralizing continuing professional development (CPD) and
              raising firmwide training participation from 70% to 85%-90%. In retail operations, fast-fashion apparel
              brand Bohme deployed Go1 across 16 Midwest store locations and 220 employees to replace manual paper
              training packets, documenting double-digit improvements in store sales execution and store associate
              retention. In telecommunications infrastructure, UK fiber operator CityFibre integrated Go1 Content Hub
              directly into its Absorb LMS to serve 750 employees, eliminating ad-hoc third-party vendor sourcing.
              Additional verified global enterprise clients deploying Go1 Content Hub include Delta Air Lines (103,000
              employees), automotive manufacturer Suzuki (74,077 employees), media conglomerate NBCUniversal (35,000
              employees), agricultural producer Nutrien (25,500 employees), and Australian banking group Westpac (34,168
              employees). While these accounts confirm high-volume deployment, implementation narratives consistently
              reflect multi-month onboarding and configuration oversight required by customer success teams to align
              broad catalog playlists with internal job competencies.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU015
      - number: '6.4'
        title: Retention Dynamics, Procurement Friction, and Churn Triggers
        blocks:
          - type: paragraph
            body: >-
              Despite extensive customer adoption, Go1 experiences distinct retention vulnerabilities driven by its
              aggregator architecture and enterprise pricing posture. Detailed procurement analysis from former founding
              executives and L&D analysts reveals that Go1's refusal to publish standard pricing for its Premium
              Essentials and Premium Pro tiers creates budgeting friction for mid-sized buyers. More critically, because
              Go1 operates as a content aggregator rather than a certified system of record, organizations requiring
              granular compliance tracking, automated recertification, and audit-ready records must purchase a separate
              LMS license (such as Workday, Docebo, or Absorb). This double-licensing requirement substantially inflates
              total cost of ownership. In specialized regulatory environments, generic aggregated courses often fail to
              satisfy mandatory standards; for example, Australian National Disability Insurance Scheme (NDIS) care
              providers frequently churn from Go1 to vertical platforms like eTrainU, which offers fully mapped core
              compliance modules, offline in-person competency sign-offs, and pre-built audit verification compared to
              Go1's superficial 11-item NDIS playlist. Similarly, regional mid-market employers such as Altus Traffic
              (6,000+ staff) and Wuchopperen Health Service have migrated away from Go1 to bundled providers like
              SuperPath to capture native authoring, LMS functionality, and compliance tracking under a single
              transparent license.
            claimRefs:
              - CU001
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Double-Subscription Burden: Aggregation vs. True LMS Infrastructure'
            body: >-
              Because Go1 delivers content rather than serving as an audit-ready system of record, mid-market
              organizations must maintain both a Go1 content subscription and an external LMS license. For organizations
              with strict compliance requirements, this dual-vendor cost structure creates significant churn incentive
              toward bundled platforms.
            calloutType: insight
            claimRefs:
              - CU001
              - CU014
              - CU016
          - type: callout
            title: Curriculum Depth Vulnerability in Regulated Verticals
            body: >-
              Go1's broad 80,000+ course catalog lacks vertical depth in heavily audited sectors such as NDIS healthcare
              and disability care. When regulatory compliance requires pre-mapped audit standards and field competency
              sign-offs, specialized providers successfully displace Go1's generic playlists.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Assurance Exposure
        blocks:
          - type: paragraph
            body: >-
              Go1 sells into a compliance environment where training content must vary by industry, location, workforce,
              role, and changing law. Its own research highlights the central efficacy risk: 95% of surveyed HR leaders
              were confident that employees understood compliance policies after training, yet only 38% tested
              understanding and employees averaged 64.5% on scenario-based readiness assessments. This does not prove
              Go1 causes weak readiness, but it does show that completion alone is an inadequate control outcome. Go1
              describes role mapping, assessments, refreshes, and audit-ready tracking as mitigations. The retained pool
              does not establish Go1's own certifications, privacy terms, litigation history, security incidents, or
              regulatory inquiries; those are diligence gaps, not evidence of a clean record.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
