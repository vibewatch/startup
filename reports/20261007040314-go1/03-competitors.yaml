company:
  name: "Go1"
chapter:
  number: 3
  title: "Competitors"
  summary: "Go1 competes as an embedded learning-content aggregator: its claimed breadth and workflow integrations reduce the need to source multiple libraries, while Moodle and Cornerstone OnDemand remain named alternatives for more complex enterprise requirements. The assigned evidence does not support a defensible peer-scale or funding comparison, and conflicting third-party price listings plus user-reported reporting, customization, and responsiveness issues weaken confidence in a durable moat."
sections:
  - id: "landscape-and-alternatives"
    title: "Landscape and buyer alternatives"
    body: >-
      Go1's competitive set extends beyond another learning platform. The company says its
      service reaches more than 10,000 organizations and aggregates content from more than
      300 providers in more than 120 languages; GetApp describes the offering as an enterprise
      learning system with a searchable Content Hub. SelectHub names Moodle and Cornerstone
      OnDemand as alternatives for larger organizations with more intricate requirements, but
      the assigned evidence does not disclose comparable scale, funding, pricing, or feature
      detail for either peer. The status quo is also material: a Go1-sponsored survey reported
      that 40% of respondents used at least five content providers. Internal build remains a
      logical buyer option, but its cost and prevalence are not quantified in the available pool.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP006"
      - "CP008"
      - "CP016"
    tableRefs:
      - "TP001"
  - id: "capability-and-product-scope"
    title: "Capability, scope, and evidence quality"
    body: >-
      Go1's strongest evidenced differentiation is distribution rather than proprietary content
      ownership. GetApp reports that Content Hub supports content search and pre-curated
      playlists, while Go1 Connect can distribute SCORM, xAPI, and AICC files and embed content
      into business workflows. A syndicated company announcement adds AI-powered discovery, a
      dynamic homepage, Go1 Pay, and Go1 Insights to the suite. Customer-review evidence supports
      centralized compliance and professional-development delivery, but it also identifies
      limitations in custom authoring and advanced reporting. Because the pool contains no
      current, independent, side-by-side benchmark of Go1, Moodle, and Cornerstone, unsupported
      competitor cells are explicitly marked unknown rather than scored.
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP011"
      - "CP012"
      - "CP015"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "pricing-distribution-and-switching"
    title: "Pricing, distribution, and switching dynamics"
    body: >-
      Public price discovery is unreliable. SelectHub lists a $10 per-user monthly starting
      price with a freemium model, whereas GetApp lists $10 per user per year under a subscription
      model; neither figure is presented here as realized enterprise pricing. The fetched Go1
      homepage provides no numeric price and instead directs buyers to an expert. Distribution
      can create practical switching friction because Content Hub, Connect, embedded workflows,
      and integrations place Go1 inside an existing learning stack. Yet the same architecture
      also permits multi-homing: GetApp lists Docebo among integrations, and the company-sponsored
      survey describes buyers already using multiple content vendors. Contract terms, discounts,
      renewal mechanics, content-provider concentration, and export portability remain private
      diligence items.
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP006"
      - "CP009"
      - "CP010"
    tableRefs:
      - "TP003"
  - id: "durability-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      The evidence supports a convenience moat, not a proven structural moat. Provider breadth,
      multilingual reach, open content formats, and workflow embedding can reduce procurement
      and administrative effort. However, the Go1-sponsored survey itself says 47% of L&D leaders
      could not find upskilling content that fit all needs and that more than half believed
      10% to 25% of budget was wasted on ineffective or unused content. Review evidence adds
      restricted custom authoring, reporting gaps, unclear packaging, slow system behavior, and
      a historical enrollment complaint. Incumbent suites can respond by bundling content and
      analytics, while buyers can retain several vendors. Durability therefore depends on
      content quality, recommendation accuracy, integration depth, and measurable outcomes that
      are not independently benchmarked in the assigned sources.
    claimRefs:
      - "CP002"
      - "CP004"
      - "CP005"
      - "CP007"
      - "CP008"
      - "CP012"
      - "CP013"
      - "CP014"
