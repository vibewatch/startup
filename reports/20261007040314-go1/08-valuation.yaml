  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Required assumptions"
      - "Valuation / return logic"
      - "Key downside trigger"
      - "Probability signal"
    rows:
      - - "Bull"
        - "Audited revenue exceeds the 2024 estimate; retention and royalty-adjusted margins are strong; new products expand paid usage."
        - "A range becomes supportable only after verified cash flows, current terms, and an entry price are available."
        - "Growth is not recurring or content economics absorb the upside."
        - "Currently weak because the necessary operating disclosures are absent."
      - - "Base"
        - "Go1 sustains broad enterprise adoption, but disclosure remains insufficient for a clean underwriting model."
        - "Maintain research-more and do not convert historical private marks into present fair value."
        - "A financing process anchors investors to historical marks without current evidence."
        - "Currently strongest because it matches the observed evidence boundary."
      - - "Bear"
        - "Verified growth or retention underperforms while debt or senior preferences create financing pressure."
        - "Downside depends on the undisclosed capital stack, so a precise value would be false precision."
        - "A new round reveals preference overhang, dilution, weak margins, or concentrated counterparties."
        - "Material but unquantified until the cap table and audited accounts are obtained."
    notes: "Scenarios are conditional decision branches, not forecasts; probabilities and valuation ranges are intentionally not invented from incomplete public data."
    claimRefs:
