        - id: "revenue-estimate"
          label: "$94.8M estimated 2024 annual revenue"
          detail: "Third-party estimate; not labeled audited revenue in fetched text"
        - id: "historical-marks"
          label: "2021-2023 private marks"
          detail: "Above $1B, $2.0B, reported $2.8B, and believed $3.5B"
        - id: "missing-underwriting"
          label: "Audited economics and capital terms missing"
          detail: "No defensible current multiple or point value"
        - id: "decision"
          label: "Research more"
          detail: "High risk; price and return target withheld"
      edges:
        - from: "customer-scale"
          to: "content-scale"
          label: "adds distribution context"
        - from: "content-scale"
          to: "revenue-estimate"
          label: "requires monetization evidence"
        - from: "revenue-estimate"
          to: "historical-marks"
          label: "cannot be mixed across vintages"
        - from: "historical-marks"
          to: "missing-underwriting"
          label: "needs current verification"
        - from: "missing-underwriting"
          to: "decision"
          label: "blocks price-based conviction"
    approximationNotes: "No proportional geometry, valuation multiple, probability, or current fair value is implied."
