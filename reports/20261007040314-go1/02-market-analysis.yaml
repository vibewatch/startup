callouts:
  - calloutType: "insight"
    title: "The Aggregation Wedge vs. Infrastructure Commoditization"
    body: "Go1's strategic moat rests on content licensing consolidation rather than proprietary LMS delivery. By embedding across 250+ content providers into existing enterprise platforms like Cornerstone and Workday, Go1 lowers vendor management overhead while avoiding direct software replacement cycles."
    claimRefs:
      - "CM006"
      - "CM008"
  - calloutType: "risk"
    title: "Overage Penalties and Library Engagement Drop-Off"
    body: "Broad subscription libraries face utilization skepticism, with over half of L&D leaders citing 10% to 25% budget waste on unused courses. Combined with Go1's steep 105% list price penalty for unprovisioned seat overages, enterprises risk unexpected cost friction without active governance."
    claimRefs:
      - "CM013"
      - "CM014"
