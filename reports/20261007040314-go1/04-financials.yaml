callouts:
  - calloutType: risk
    title: Content Royalty Gross Margin Floor
    body: 'Go1 usage-based revenue share structure aligns creator compensation with learner activity, but creates an inherent gross margin constraint: as user engagement expands, creator royalty liabilities increase in tandem. Without public disclosure of the agreed pool percentages, investors cannot verify whether platform gross margins mirror high-margin software (70%+) or lower-margin distribution aggregators (40%-50%).'
    claimRefs:
      - CI006
      - CI007
      - CI008
  - calloutType: insight
    title: Valuation Multiple Premium Versus Metric Visibility
    body: With secondary marketplaces anchoring Go1 valuation at $2.0 billion against unverified secondary ARR estimates of $94.8 million, Go1 commands an implied revenue multiple exceeding 20x. In the absence of audited net retention, gross margin, and cash burn metrics, this valuation implies aggressive forward growth and software-level profitability that cannot be verified from public documentation alone.
    claimRefs:
      - CI010
      - CI014
      - CI015
