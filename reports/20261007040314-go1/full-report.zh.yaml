        title: 已报告商业规模与指标互证
        blocks:
          - type: paragraph
            body: >-
              公开可见的商业指标显示企业分发规模可观：Go1 宣传称已被超过 10,000 家客户组织采用，多家二级市场平台也在追踪其规模。GetLatka 的未经审计行业基准估计 Go1 2024 年 10 月 ARR 为
              $94.8 million，高于 2023 年估计的 $68.9 million，折合约 37.6% 年化增长。但 Go1 没有发布经审计财报，也没有正式核实这些 ARR 估计。净收入留存、logo
              流失、客户获取成本回收周期和毛利率等关键软件指标同样严格保密。二级交易平台对历史成立日期和公司实体的记录也存在分歧，说明第三方资料聚合商汇集了不同输入，未经过独立会计核验。
