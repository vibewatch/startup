      - number: '5.4'
        title: 数据驻留、安全治理与技术限制
        blocks:
          - type: paragraph
            body: >-
              企业信任、隐私治理和监管合规既是 Go1
              的运营护城河，也是技术边界。公司发布了明确的数据驻留框架，允许企业客户指定个人可识别信息（PII）的存储地点——可选澳大利亚、美国或欧盟（爱尔兰）的本地化存储——而核心数据处理主要在澳大利亚进行。Go1 持有
              ISO 27001:2022 安全认证和经审计的 SOC 2 Type II 鉴证。尽管有这些企业级保障，技术和产品尽调仍揭示出重要架构限制。第一，Go1 没有面向 iOS 或 Android
              学习者的原生移动应用，完全依赖响应式网页设计；这对坐班员工尚可用，但 Go1
              自有支持文档称第三方课程播放在笔记本或台式机上效果最佳，会给现场、轮班或护理工作人员造成使用摩擦。第二，第三方内容会到期并定期下线，客户必须依赖提前退休
              webhook（content.decommission.pending）和反复人工重新策划。第三，Go1 目录由非认证培训组成：在澳大利亚 NDIS 残障护理等受监管环境中，Go1 提供 11
              项入门播放列表，而非经认证的临床模块或可供审计的 Practice Standards 映射，雇主仍需向专业注册培训机构（RTO）采购认证培训。
