chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、模式与市场定位
        blocks:
          - type: paragraph
            body: >-
              Go1（法律实体为 Go1 Pty Ltd）是一家企业学习与发展（L&D）内容聚合平台，2009 年成立，并于 2015 年进入 Y Combinator 孵化。公司位于澳大利亚昆士兰州布里斯班都会区的
              Underwood，同时在美国、英国、新加坡和马来西亚设有主要办公室；它像“企业学习领域的 Spotify”一样聚合精选内容。平台从 300
              多家商业内容提供商和出版商处汇集数字学习资源，覆盖员工合规、领导力、技术技能和职业发展。Go1
              不生产自有教学内容，而是向出版商取得授权，按消费量向其支付使用费，再把这些目录打包成单一企业订阅许可，直接交付或嵌入第三方学习管理系统（LMS）、人力资源信息系统（HRIS）和 Microsoft Teams
              等协作软件。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
