  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、SKU 架构与企业学习套件
        blocks:
          - type: paragraph
            body: >-
              Go1 将核心产品价值定义为企业学习与发展（L&D）负责人的聚合中间件和即用型内容市场，而不是专有课程作者。过去，组织培训采购需要管理零散的供应商合同；行业调查显示，40% 的组织要协调 5
              家或更多外部学习提供商，14% 要管理 10 家或更多。Go1 用统一订阅解决这一运营负担，提供 300 多家出版商、覆盖合规、职业领导力、技术技能和软技能且支持 40 多种语言的聚合课程。产品交付以 Go1
              Learn 套件为核心，该套件在公司由 CEO Chris Eigeland 主导品牌重塑时推出，打包消费级发现、动态主页和按角色定制的播放列表，并配有 Go1 Pay（管理灵活、个性化学习预算）和 Go1
              Insights（跟踪员工技能基准及相对组织目标的消费趋势）。商业打包分为不同 SKU 层级：Go1 Learn（基础平台访问）、Essentials Select（限制为 10、25 或 50 项精选内容）以及
              Premium 层级（Essentials 和 Essentials Plus，解锁更广目录权限和高级策划）。Go1 不替换客户 LMS 基础设施，而是作为内容供应管道嵌入客户工作流。
