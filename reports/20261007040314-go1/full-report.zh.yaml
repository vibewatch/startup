              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV011
              - CV016
      - number: '8.2'
        title: 融资记录与数据限制
        blocks:
          - type: paragraph
            body: >-
              融资记录可观，但不同数据提供商之间并不一致。Staffing Industry Analysts 报道 2021 年 $200 million Series D，估值超过 $1 billion。GetLatka
              列出 2022 年 $100 million 风投轮、$2 billion 估值和七轮合计 $383.9 million 融资；FundedIQ 则记录两轮合计 $240 million。Startup
              Daily 另称 2022 年 6 月以 $2.8 billion 估值融资 $140 million，后来又描述一笔据称意味着约 $3.5 billion 的上调轮 $30 million
              股权投资。这些是覆盖范围不同的来源特定记录，不能安全合并为一份确定的资本化历史。证据中没有当前 term
              完全稀释股权结构表、清算优先权、债务明细或独立核实的二级价格。因此，入场纪律要求管理层数据，而不是锚定最高的历史标题数字。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV016
      - number: '8.3'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              核心判断是，Go1 有机会整合碎片化的学习采购，利用广泛的供应商网络服务全球雇主。Go1 的 2026 年合规指南称，监管变化、网络安全暴露面和审计要求提高了对一致且可证明培训的需求。Learning News
              刊发的一则公司公告也显示，Go1 通过 Go1 Learn、Go1 Pay 和 Go1 Insights 扩展产品。反向论点是，覆盖面广不等于深度或可防御性。已披露的竞争对手 Wyzed
              并非独立基准，但其调研认为 Go1 的 NDIS 产品只是包含 11
              个条目的入门播放列表，并指出公司公布了年度席位重新分配上限。这些说法需要直接核查合同和产品，但确实暴露出垂直领域专家和客户经济性方面的合理风险。关于 cohort
              留存、内容供应商集中度、版税经济性，以及新产品付费采用情况的证据，可能会实质性改变判断。
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 情景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              情景分析应保持条件性，不应凭空编造估值区间。乐观情景需要：经审计的增长超过 2024
              年收入估算、持久的留存、扣除版税影响后仍具吸引力的利润率，以及为可信退出留出空间的入场价格。基准情景是经营持续改善，但披露仍不足以为股权定价，因此继续保持“需要进一步研究”的判断。悲观情景则是经核实的经济性转弱，同时资深股东优先权或融资需求使新资金处于次级地位。Staffing
              Industry Analysts 报告的 SmartRecruiters 2021 年 $1.5 billion 估值，只是相邻的人才科技融资参考，并非 Go1
              的独立基准；目前没有证据表明两家公司在公司主体、收入基础和交易条款上可比。Startup Daily 关于 Blinkist 收购的报道证明了收购能力，但不能证明 Go1 已具备 IPO
              准备度或买方需求。最终尽调必须取得经审计财务报表、cohort 留存、当前股权结构表、优先权和债务条款、客户与供应商集中度、当前定价，以及管理层支持的退出方案。
            claimRefs:
              - CV003
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把年度收入改称 ARR
            body: GetLatka 抓取的文本将 $94.8 million 称为 2024 年的估算年度收入。本章保留这一指标名称，不把它视为经审计收入或年度经常性收入。
            calloutType: recommendation
            claimRefs:
              - CV003
          - type: callout
            title: 历史估值标记不等于当前价格
            body: 引用的估值是 2021 至 2023 年不同融资事件中的估值标记，报告口径各不相同。要确定当前公允价值，需要最新的 fully diluted 资本结构、优先股堆叠、经审计的经营数据和实际入场条款。
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV016
