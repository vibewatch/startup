            body: >-
              尽管客户采用广泛，Go1 的聚合架构和企业定价姿态仍带来明显留存脆弱性。前创始高管和 L&D 分析师的详细采购分析显示，Go1 拒绝为 Premium Essentials 和 Premium Pro
              层公布标准价格，给中型买家造成预算摩擦。更关键的是，Go1 是内容聚合商而非认证记录系统，需要细粒度合规追踪、自动再认证和可审计记录的组织必须另购 LMS 许可（如 Workday、Docebo 或
              Absorb），双重许可显著推高总拥有成本。在专业监管环境中，通用聚合课程往往无法满足强制标准；例如，澳大利亚国家残障保险计划（NDIS）护理提供商经常从 Go1 流失到 eTrainU 等垂直平台，后者相比
              Go1 浅层的 11 项 NDIS 播放列表，提供完整映射的核心合规模块、线下现场能力签核和预构建审计验证。同样，Altus Traffic（6,000+ 名员工）和 Wuchopperen Health
              Service 等地区中型雇主已离开 Go1，转向 SuperPath 等打包供应商，以单一透明许可获得原生创作、LMS 功能和合规追踪。
            claimRefs:
              - CU001
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 双订阅负担：聚合平台与真正的 LMS 基础设施
            body: Go1 交付内容而非充当可审计记录系统，因此中型组织必须同时保留 Go1 内容订阅和外部 LMS 许可。对合规要求严格的组织，这种双供应商成本结构会显著提高流失到打包平台的动力。
            calloutType: insight
            claimRefs:
              - CU001
              - CU014
              - CU016
          - type: callout
            title: 受监管垂直领域的课程深度脆弱性
            body: Go1 广泛的 80,000+ 课程目录在 NDIS 医疗和残障护理等高度审计行业缺乏垂直深度。当监管合规要求预先映射的审计标准和现场能力签核时，专业供应商能成功替代 Go1 的通用播放列表。
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与保障风险
        blocks:
          - type: paragraph
            body: >-
              Go1 面向一个培训内容必须随行业、地点、劳动力、岗位和法律变化而变化的合规环境销售。公司自身研究凸显核心有效性风险：95% 的受访 HR 负责人确信员工理解合规政策，但只有 38%
              测试了理解程度，员工在情境式准备度评估中的平均分为 64.5%。这不能证明 Go1 导致准备度不足，却说明单纯完成课程不是充分的控制结果。Go1
              将岗位映射、评估、刷新和可审计追踪描述为缓解措施。保留的资料池无法确定 Go1 自身的认证、隐私条款、诉讼历史、安全事件或监管调查；这些是尽调缺口，而不是清白记录的证据。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
