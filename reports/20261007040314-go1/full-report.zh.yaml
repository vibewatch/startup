  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与企业买家画像
        blocks:
          - type: paragraph
            body: >-
              Go1 的商业客户主要分为寻求简化企业培训采购的大型企业、中型市场组织和专业服务网络。企业买家通常是集中式首席学习官、首席人事官或 HR 技术主管，希望把分散的商业内容合同整合为统一的年度企业订阅。Go1
              不作为具备专有创作和审计追踪能力的端到端学习管理系统（LMS），而是把自己定位为集中式内容聚合中心。买家主要是人力资源和人才发展负责人，用户则包括所有在职企业知识工作者、现场员工或零售店员。需求来自两类采购任务：基础监管型职场合规（如反骚扰、职业健康安全和网络安全意识）以及领导力、技术领域的自主员工技能提升。但不同细分市场的买家激励不同：已有
              LMS 的全球企业借助 Workday、ADP 或 Docebo 集成丰富工作流；没有既有 LMS 的中型组织却可能面临软件栈重复。
