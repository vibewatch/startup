  - id: TV001
    title: 建议总结表
    columns:
      - 决策维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 规模主张和历史融资轮次清晰可见，但当前经审计的经营数据和融资条款并不清楚。
        - 在完成管理层尽调前，不要基于价格作出承诺。
      - - 信心
        - 对立场的信心为中；对价格的信心为低
        - 多个来源证实历史估值点位，但留存的唯一经营估计是未经审计的 2024 年收入。
        - 可认为立场稳健，但任何单点估值都缺乏支持。
      - - 风险评级
        - 高
        - 当前利润率、留存、现金使用、集中度、债务和优先权层级仍未披露。
        - 只有审阅完整资本结构后，才要求下行保护。
      - - 估值立场
        - 未定价；历史估值点位看起来证据较多
        - 报告的估值点位从超过 $1 billion 上升至 $2.0-$2.8 billion，并被认为达到 $3.5 billion，但留存资料中没有当前审计支持。
        - 不要将任何历史估值点位视为当前公允价值。
      - - 目标回报 / 退出
        - 无法由公开资料支持
        - 资料显示有收购及相关融资信息，但没有当前 Go1 退出定价证据。
        - 仅依据经管理层验证的进入条款和退出假设构建回报。
    notes: 历史融资估值点位与 2024 年收入估计的日期和定义不同；未计算倍数或当前公允价值。
    claimRefs:
