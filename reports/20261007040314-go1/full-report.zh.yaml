  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Go1 展现出可信的公司质量信号，但价格证据不足。公司称获得超过 10,000 家组织信任，并提供来自 300 多家供应商、覆盖 120 多种语言的内容；GetLatka 估计其 2024 年收入为 $94.8
              million。这些指标说明分发触达，却不能证明经常性收入、毛利率、留存、现金生成能力或当前股权价值。历史融资估值从 2021 年超过 $1 billion，到 2022 年报告的 $2.0 billion 和
              $2.8 billion，随后 Startup Daily 称 2023 年上调轮据称将公司估值推至约 $3.5 billion。由于指标年份和定义不同，把它们相除会产生误导性的当前倍数。建议为
              research-more；对这一姿态的信心为中等，但对价格的信心较低，风险为高，指定公开证据无法支持目标回报或退出价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
