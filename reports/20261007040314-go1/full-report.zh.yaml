  - id: FU001
    title: Go1 企业客户生命周期与采用旅程
    type: journey-map
    summary: 展示客户如何从多供应商采购痛点走向集成、持续内容管理，并最终面临留存或流失拐点。
    approximationNotes: 生命周期阶段、触点和摩擦因素综合自采购评审、高管调研和竞争对手迁移分析。
    data:
      items:
        - label: 1. 多供应商采购痛点
          detail: L&D 管理层受供应商泛滥拖累，每周要花 1-3+ 小时管理 5 至 10+ 家独立培训供应商。
          touchpoints:
            - 供应商 RFP 流程
            - 内容许可审查
            - 采购 ROI 评估
        - label: 2. 合同整合与许可
          detail: 组织购买 Go1 年度订阅，以访问合规和技能领域的 80,000+ 门课程。
          touchpoints:
            - 销售报价谈判
            - 内容范围定义
            - 预算审批
        - label: 3. HR 技术栈与 LMS 集成
          detail: 技术团队将 Go1 Content Hub 接入核心 LMS 或 HRIS（例如 Workday、ADP、Absorb、MS Teams）。
          touchpoints:
            - API 与 SSO 配置
            - 目录接入
            - 课程与岗位映射
        - label: 4. 部署与员工入职
          detail: 首轮向员工群体推出强制合规培训和按岗位划分的培训路径。
          touchpoints:
            - 员工邮件邀请
            - 移动端 / 桌面端学习启动
            - 管理者推动分配
        - label: 5. 主动策展与参与瓶颈
          detail: 学习者完成基础课程，但 L&D 管理层发现 10-25% 的预算浪费在未使用标题上，且内部缺乏内容创作能力。
          touchpoints:
