            - 未验证
            - 管理层无法调和客户与资金口径的定义
    approximationNotes: 可能性、影响和成熟度是根据所分配证据作出的定性判断；未知值仍保持未知，不转换为数值评分。
    claimRefs:
      - CR003
      - CR008
      - CR009
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 该流程将运营规模证据与历史估值标记分开，并将未解决的投资判断输入导向“继续研究”结论。
    data:
      nodes:
        - id: customer-scale
          label: 公司口径：10,000+ 家组织
          detail: 分销信号，不代表留存或收入证据
        - id: content-scale
          label: 公司口径：300+ 家供应商和 120+ 种语言
          detail: 广度信号，不代表利润率证据
        - id: revenue-estimate
          label: $94.8M 估算的 2024 年收入
          detail: 第三方估算；抓取文本未将其标为经审计收入
        - id: historical-marks
          label: 2021-2023 年私人市场估值
          detail: 高于 $1B、$2.0B、据报道 $2.8B，以及据认为 $3.5B
        - id: missing-underwriting
          label: 缺少经审计的经济数据和资本条款
          detail: 没有可信的当前倍数或时点价值
        - id: decision
          label: 继续研究
          detail: 风险高；暂不提供价格和回报目标
      edges:
        - from: customer-scale
          to: content-scale
          label: 补充分销背景
        - from: content-scale
          to: revenue-estimate
          label: 需要货币化证据
        - from: revenue-estimate
          to: historical-marks
          label: 不同年份不可混用
        - from: historical-marks
          to: missing-underwriting
          label: 需要当前验证
        - from: missing-underwriting
          to: decision
          label: 阻止基于价格形成确信
    approximationNotes: 不代表任何比例几何、估值倍数、概率或当前公允价值。
