      - number: '4.2'
        title: 成本结构、毛利率驱动因素与内容版税
        blocks:
          - type: paragraph
            body: >-
              Go1 商业模式的核心成本是内容合作伙伴版税，由标准双边 Content Partner Terms 约束。Go1 定义合同上的 Revenue Share Pool，按约定比例从 Net Revenue
              计算；Net Revenue 会从订阅总收入中扣除适用销售税、标准 3% 支付处理和行政处理费、移动平台商店费以及用户退款。合作伙伴池按相对消费比例分配，具体为会计期间 Go1 Premium Library
              中合作伙伴内容总消费分钟数的精确百分比。按使用量浮动的版税结构让 Go1 无需为闲置或未观看课程付费，却形成浮动毛利率底线：学习者参与度越高，内容支付负债越大。除合作伙伴支出外，Go1 还承担客户
              onboarding 和集成成本，包括专属实施支持以及企业 HRIS、LMS 连接器维护。
