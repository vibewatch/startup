            - 季度目录更新
            - 学习者反馈调查
        - label: 6. 续约、扩张或流失决策
          detail: 企业将订阅扩展到新部门；中型市场或专业客户则可能流失，转向捆绑式 LMS 或垂直解决方案。
          touchpoints:
