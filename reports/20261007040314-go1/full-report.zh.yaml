        title: 收入来源与订阅变现模式
        blocks:
          - type: paragraph
            body: >-
              Go1 是企业培训聚合商，为企业组织统一提供 300 多家内容创作者和出版商的精选学习内容。核心商业模式是按年预付的经常性 B2B 订阅，访问 Essentials Select、Premium
              Essentials 和 Premium Pro 等分层目录。Go1 不公布标准公共按席位价目表，而是与团队和企业客户协商定制年度承诺，并规定专属实施项目管理需达到 $20,000
              年度支出门槛。企业合同包含自动续约条款，要求在年度到期前至少提前 30
              天书面取消；同时把每个合同年度的内部席位重新分配限制在不超过五分之一。这种结构带来可预测的前置年度现金流，但实际平均合同价值和每席位净收入被定制报价折扣掩盖。
