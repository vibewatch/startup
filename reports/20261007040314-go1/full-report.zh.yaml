        - 目录可用性、本地化和内容更新
        - 按供应商和主题未知
        - 重要供应商撤回、重新定价或延迟必要更新
        - 高
        - 供应商数量多，目录支持多语言
        - 在使用、付款、续约和权利集中度披露前为高
      - - 客户规模可信度
        - 企业买方与渠道生态
        - 需求、客户背书和续约经济性
        - Unknown
        - 组织、账户、学习者或付费客户的定义可能掩盖较弱的变现采用
        - High
        - Go1 报告有 10,000+ 个信任其的组织
        - 高，因为 GetLatka 报告有 3,000 名客户，且无法核对两者
      - - 外部资本
        - 现有及潜在投资者
        - 运营与增长所需流动性
        - Unknown
        - 在消耗、现金跑道或融资条款未披露时，将历史融资额视为当前现金
        - High
        - 公开报道了多轮历史融资
        - 在现金、消耗、债务、优先权和当前融资计划得到验证前为高
    notes: 募集资金不等于可用现金；公开总额因数据库覆盖范围不同而存在差异，不能据此推断现金跑道或资产负债表流动性。
    claimRefs:
