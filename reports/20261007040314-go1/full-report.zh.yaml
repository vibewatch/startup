              - CR016
      - number: '7.2'
        title: 运营、产品与合作伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Go1 的广度也构成运营负担。公司宣传来自 300+ 家提供商、覆盖 120+ 种语言的内容，而其 2025 年调查发现，40% 的组织已使用至少 5 家学习提供商，14% 已使用至少 10
              家。同一份公司发布的调查报告称策划耗时和未使用内容预算都很高，使可量化的使用率和内容相关性成为关键续约风险。Go1 Learn、Go1 Pay 和 Go1 Insights
              通过发现、支出管理和活动分析扩大了缓解工具面，但也增加了路线图和变更管理执行风险。指定证据没有披露供应商权利、续约条款、集中度、内容新鲜度、服务水平、恢复表现和客户数据可移植性。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: 财务模型风险与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              财务投资判断受不一致的公开定义限制，而不是受已证实的流动性事件限制。Go1 发布的公告称公司已融资超过 $400 million；GetLatka 报告七轮融资合计 $383.9 million；FundedIQ
              则记录两轮合计 $240 million。这些数字描述的是已募资金，而非可用现金，不能证明现金消耗或 runway。GetLatka 另估计 Go1 2024 年收入为 $94.8
              million；不应把该估计改称经审计收入或 ARR。客户规模同样没有对齐：Go1 称超过 10,000 家组织信任平台，而 GetLatka 称客户数为
              3,000。若管理层无法调和这些分母、披露当前流动性和利润率，或证明供应商及客户集中度可接受，投资应暂停。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 完成课程不等于具备准备度
            body: Go1 自身研究显示，HR 的信心与经过测试的员工准备度之间存在很大差距。投资判断应关注可独立审计的评估、行为和事件结果，而不是只看课程完成。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
          - type: callout
            title: 决策闸门
            body: 不要从历史融资推断流动性。在把主要剩余风险视为已缓解前，必须取得对齐后的 KPI 定义、当前现金和消耗、毛利与贡献利润率、供应商与客户集中度、安全保障以及合同证据。
            calloutType: recommendation
            claimRefs:
              - CR011
              - CR012
