      - number: '4.4'
        title: 资本充足性、历史融资与投资判断
        blocks:
          - type: paragraph
            body: >-
              Go1 依靠大量机构风投为平台扩张和创作者目录聚合融资，多个股权轮次累计融资约 $400 million 至 $480 million，其中标志性的 $200 million Series D 将估值推至 $1
              billion。包括 Forge Global 在内的二级平台显示，截至 2026 年年中，后续私有估值锚点为 $2.0 billion，但一级交易量和成交清算价仍不透明。Go1
              作为私营公司没有公开报告，因此无法从公开申报核实当前资产负债表现金、月度经营现金消耗、债务或信贷义务以及剩余 runway。从投资判断看，Go1
              虽展示出有吸引力的市场定位和可观的企业覆盖，但若没有直接尽调披露毛利率拆分、留存 cohort 和现金流动态，机构资本配置者无法验证可持续的单位经济。
