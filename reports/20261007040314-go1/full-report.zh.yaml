  - id: TV002
    title: 正反论点表
    columns:
      - 观察角度
      - 有证据支持的论点
      - 反方论点
      - 哪些信息会改变判断
    rows:
      - - 分发规模
        - Go1 声称有超过 10,000 个组织使用该平台。
        - 公开数量没有披露活跃席位、留存、合同金额或集中度。
        - 客户层面的 ARR、总留存、净留存和头部账户集中度。
      - - 内容广度
        - Go1 声称内容来自 300+ 家供应商，覆盖 120+ 种语言。
        - 供应商广度可能增加版税成本、内容重叠和筛选复杂度。
        - 供应商集中度、版税安排、内容使用情况和贡献利润率。
      - - 产品扩张
        - 公司于 2025 年宣布 Go1 Learn、Go1 Pay 和 Go1 Insights。
        - 上线证据无法证明付费采用或增量收入。
        - 附加购买率、独立定价、扩张 ARR 和产品层面留存。
      - - 垂直领域防御力
        - 广泛覆盖可以服务有跨类别学习需求的雇主。
        - 一家披露身份的竞争对手认为 Go1 的 NDIS 产品专业化程度较低，并指出席位机制存在限制。
        - 直接产品映射、签署的客户背书和当前合同条款。
    notes: 公司主张未经独立验证；Wyzed 是竞争对手，其信息仅作为负面尽调线索，而非独立基准。
    claimRefs:
      - CV001
      - CV002
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 必要假设
      - 估值 / 回报逻辑
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 乐观
        - 经审计收入超过 2024 年估计；留存和经版税调整的利润率较强；新产品扩大付费使用。
        - 只有取得经验证的现金流、当前条款和进入价格后，区间才有依据。
        - 增长并非经常性增长，或内容经济性吞噬了上行空间。
        - 当前较弱，因为缺少必要的经营披露。
      - - 基准
        - Go1 保持广泛的企业采用，但披露仍不足以建立清晰的投资判断模型。
        - 继续研究，不要把历史私人市场估值点位转换为当前公允价值。
        - 融资过程在缺乏当前证据时，仍以历史估值点位锚定投资者。
        - 当前最强，因为它符合已观察到的证据边界。
      - - 悲观
        - 经验证的增长或留存表现不佳，同时债务或优先权造成融资压力。
        - 下行取决于未披露的资本结构，因此给出精确价值会造成虚假的精确感。
        - 新一轮融资暴露出优先权负担、稀释、利润率疲弱或交易对手集中。
        - 在取得股权结构表和经审计账目之前，风险重大但无法量化。
    notes: 情景是有条件的决策分支，而非预测；我们刻意不从不完整的公开数据中臆造概率和估值区间。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV016
