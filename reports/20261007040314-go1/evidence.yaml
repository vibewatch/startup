evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited financial statements confirming Go1's ARR, gross margins, cash burn rate, runway, and net retention.
    whyItMatters: >-
      Without audited financial disclosures, valuation multiples and unit economics cannot be verified against
      comparable public L&D SaaS peers.
    diligencePath: >-
      Request audited GAAP/IFRS financial statements, revenue cohort schedules, and subscription margin waterfall from
      management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: tam-sizing-gap
    missingEvidence: >-
      Audited, independent market sizing study specifically bounding the enterprise multi-vendor learning content
      aggregation subscription TAM, rather than generalized LMS infrastructure or corporate training expenditures.
    whyItMatters: >-
      Without an isolated TAM for content aggregation, market penetration rates cannot be accurately measured against
      Go1's estimated $94.8M ARR, making long-term growth runways uncertain.
    diligencePath: >-
      Request management's bottom-up addressable market model and cross-reference with third-party procurement data on
      content-only software line items.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: contract-expansion-rates
    missingEvidence: >-
      Audited customer expansion metrics, net revenue retention (NRR) rates, and seat-utilization distributions across
      Go1's claimed 10,000 organization base.
    whyItMatters: >-
      Given reported 10% to 25% budget waste on unused learning libraries and steep 105% list price overage penalties,
      true retention depends on active engagement rather than provisioned seat counts.
    diligencePath: >-
      Obtain customer cohort retention and net dollar retention reports from management during confirmatory financial
      due diligence.
  - type: missing-source
    severity: material
    topic: peer-scale-and-funding
    missingEvidence: >-
      Comparable current revenue, funding, customer-count, and segment data for Moodle, Cornerstone OnDemand, and other
      direct content aggregators.
    whyItMatters: Without common-period peer metrics, Go1's relative scale and capital advantage cannot be underwritten.
    diligencePath: >-
      Obtain current filings, investor materials, vendor disclosures, and customer references for a common-period peer
      set.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: commercial-terms
    missingEvidence: >-
      Current enterprise quotes, realized per-seat pricing, discount schedules, renewal terms, content rights, and
      export portability.
    whyItMatters: Conflicting public starting prices cannot establish total cost, switching cost, or gross-margin durability.
    diligencePath: Request a dated quote, standard order form, renewal cohort data, and representative customer contracts.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      A current independent benchmark comparing content quality, recommendation accuracy, implementation effort,
      analytics depth, and outcomes across Go1 and named alternatives.
    whyItMatters: Vendor claims and user reviews establish signals but not relative product performance or moat durability.
    diligencePath: >-
      Run a structured proof of concept with identical workflows and obtain reference calls from multi-vendor enterprise
      buyers.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited financial statements confirming GAAP/IFRS recognized revenue, subscription ARR breakdown, and cost of
      goods sold.
    whyItMatters: >-
      Without audited figures, underwriting must rely on third-party estimates that cannot establish true revenue
      quality or recurring stability.
    diligencePath: >-
      Request historical audited income statements, balance sheets, and cash flow statements under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin percentage, content partner pool payout ratios, customer acquisition cost (CAC), and net revenue
      retention (NRR).
    whyItMatters: >-
      Content creator royalties directly govern platform gross margin, determining whether Go1 exhibits software-like
      operating leverage.
    diligencePath: >-
      Obtain cohort-level retention data and the specific revenue-share percentage formulas in bilateral content cover
      agreements.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly net cash burn rate, debt or credit facility terms, and verified runway.
    whyItMatters: >-
      Determines forward financing dependency and whether the company requires additional dilutive capital under current
      market conditions.
    diligencePath: Review current management treasury reports, banking statements, and credit facility covenants.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cloud-uptime-and-isolation
    missingEvidence: >-
      Audited SOC 2 Type II controls report and production multi-tenant database isolation architecture across Azure
      regional clusters.
    whyItMatters: >-
      Enterprise IT buyers require formal evidence of tenant logical isolation, failover SLA terms, and encrypted
      credential handling beyond public marketing summaries.
    diligencePath: >-
      Request unredacted SOC 2 Type II audit report, ISO 27001 certificate Annex A statement, and architecture security
      whitepaper under NDA.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross renewal rates, annual logo churn, and cohort dollar retention
      schedules.
    whyItMatters: >-
      Without audited retention and churn data, investors cannot verify whether aggregate customer growth is masked by
      mid-market customer attrition under double-licensing pressure.
    diligencePath: >-
      Request confidential management financial pack detailing historical customer cohorts, gross revenue churn, and net
      expansion rates segmented by company size.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customers
    missingEvidence: Comprehensive census of all 10,000+ enterprise customers and their respective annual contract values (ACV).
    whyItMatters: >-
      Public customer references represent a self-selected sample that may overweight successful case studies and
      obscure accounts that have reduced licensing scope.
    diligencePath: >-
      Request customer master revenue ledger detailing ARR distribution across top 50 client accounts to evaluate
      customer concentration risk.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register-and-platform-assurance
    missingEvidence: >-
      Primary evidence for Go1's litigation, enforcement, privacy, security, outage, certification, recovery, and
      data-portability posture.
    whyItMatters: >-
      The assigned sources discuss customer compliance needs but cannot establish the vendor's own legal and technical
      control record.
    diligencePath: >-
      Obtain regulator and court searches, DPAs, subprocessor list, independent audit reports, penetration tests,
      incident log, uptime history, recovery tests, and exit-export terms.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: >-
      Current audited revenue, recurring-revenue definition, gross and contribution margin, cash, debt, burn, runway,
      preferences, and financing plans.
    whyItMatters: >-
      Historic funding raised is not cash available, and estimated annual revenue cannot support liquidity or
      unit-economics conclusions.
    diligencePath: >-
      Review audited statements, monthly management accounts, bank and debt statements, cap table, preference stack,
      board plan, and financing term sheets.
    relatedQuestionRefs:
      - QR003
      - QR009
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: provider-concentration
    missingEvidence: >-
      Provider-level usage, payouts, revenue contribution, renewal dates, rights, pricing, service levels, and
      geographic restrictions.
    whyItMatters: >-
      A large nominal provider count does not reveal whether a few counterparties control the most-used or
      compliance-critical content.
    diligencePath: >-
      Request top-20 provider concentration schedules, contracts, renewal calendar, churn history, takedowns,
      content-update SLAs, and substitution analysis.
    relatedQuestionRefs:
      - QR005
      - QR010
    relatedTableRefs:
      - TR001
      - TR003
  - type: conflicting-data
    severity: material
    topic: customer-and-funding-definitions
    missingEvidence: >-
      Reconciled definitions for organization, customer, paying account, learner, funding round, and total capital
      raised.
    whyItMatters: Unaligned denominators can overstate commercial scale and prevent reliable comparison of capital efficiency.
    diligencePath: >-
      Require a dated KPI dictionary, customer bridge, financing ledger, and reconciliation to audited financial
      statements and the cap table.
    relatedQuestionRefs:
      - QR004
      - QR009
      - QR010
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: independent-adverse-evidence
    missingEvidence: >-
      Independent customer complaints, failed deployments, legal disputes, security incidents, outages, and regulator
      findings tied specifically to Go1.
    whyItMatters: >-
      The successful assigned pool is dominated by company-issued material and neutral market-data profiles, limiting
      downside verification.
    diligencePath: >-
      Commission customer reference and churn calls, legal and regulator searches, security review, status-history
      review, and incident-focused management diligence.
    relatedQuestionRefs:
      - QR002
      - QR008
  - type: private-evidence-only
    severity: material
    topic: audited-economics
    missingEvidence: >-
      Audited revenue by type, recurring-revenue definition, gross margin net of provider royalties, retention cohorts,
      cash burn, and runway.
    whyItMatters: >-
      These inputs determine whether scale converts into durable cash flow and whether any valuation multiple is
      comparable.
    diligencePath: >-
      Request audited statements, monthly management accounts, revenue-recognition policy, provider-cost schedule, and
      customer cohorts under NDA.
    relatedQuestionRefs:
      - QV001
      - QV003
      - QV006
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Current fully diluted cap table, debt, liquidation preferences, participation rights, seniority, and any 2024-2026
      primary or secondary pricing.
    whyItMatters: Historical headline valuations do not show the economic price or downside allocation for a new investor.
    diligencePath: >-
      Obtain the certified cap table, debt schedule, investor-rights agreements, latest board valuation, and proposed
      term sheet.
    relatedQuestionRefs:
      - QV001
      - QV002
      - QV003
      - QV006
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      A like-for-like set of public or private learning-platform transactions with revenue vintage, growth, margins, and
