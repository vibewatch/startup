callouts:
  - calloutType: "risk"
    title: "Completion is not readiness"
    body: "Go1's own research shows a large difference between HR confidence and tested employee readiness. Underwriting should focus on independently auditable assessment, behavior, and incident outcomes rather than course completion alone."
    claimRefs:
      - "CR002"
      - "CR003"
  - calloutType: "recommendation"
    title: "Decision gate"
    body: "Do not infer liquidity from historic funding. Require reconciled KPI definitions, current cash and burn, gross and contribution margins, provider and customer concentration, security assurance, and contract evidence before treating the major residual risks as mitigated."
