chapter:
  number: 7
  title: "Risks"
  summary: "Go1's highest visible risks are proving compliance outcomes rather than course completion, governing a catalog sourced from 300+ providers, and underwriting the company without reconciled customer, funding, margin, burn, or runway data. Public evidence supports mitigations such as scenario assessment, role-based training, content refreshes, and new analytics, but it does not establish Go1's own security, legal, incident, provider-concentration, or liquidity posture."
sections:
  - id: "regulatory-legal-and-assurance"
    title: "Regulatory, Legal, and Assurance Exposure"
    body: "Go1 sells into a compliance environment where training content must vary by industry, location, workforce, role, and changing law. Its own research highlights the central efficacy risk: 95% of surveyed HR leaders were confident that employees understood compliance policies after training, yet only 38% tested understanding and employees averaged 64.5% on scenario-based readiness assessments. This does not prove Go1 causes weak readiness, but it does show that completion alone is an inadequate control outcome. Go1 describes role mapping, assessments, refreshes, and audit-ready tracking as mitigations. The retained pool does not establish Go1's own certifications, privacy terms, litigation history, security incidents, or regulatory inquiries; those are diligence gaps, not evidence of a clean record."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operations-product-and-partners"
    title: "Operational, Product, and Partner Dependencies"
    body: "Go1's breadth is also its operating burden. The company advertises content from 300+ providers in 120+ languages, while its 2025 survey found that 40% of organizations already used at least five learning providers and 14% used at least ten. The same company-issued survey reported substantial curation time and unused-content budgets, making measurable utilization and content relevance key renewal risks. Go1 Learn, Go1 Pay, and Go1 Insights broaden the mitigation surface through discovery, spend administration, and activity analytics, but they also add roadmap and change-management execution risk. Provider rights, renewal terms, concentration, content freshness, service levels, recovery performance, and customer data portability are not disclosed in the assigned evidence."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
    tableRefs:
      - "TR002"
  - id: "financial-model-and-kill-criteria"
    title: "Financial Model Risk and Thesis-Break Triggers"
    body: "Financial underwriting is constrained by inconsistent public definitions rather than by a demonstrated liquidity event. A Go1-issued release says the company has raised over $400 million; GetLatka reports $383.9 million across seven rounds; and FundedIQ records $240 million across two rounds. These figures describe funding raised, not cash available, and cannot establish burn or runway. GetLatka separately estimates $94.8 million of 2024 annual revenue; that estimate should not be relabeled as audited revenue or ARR. Customer scale is similarly unreconciled: Go1 says more than 10,000 organizations trust the platform, while GetLatka says 3,000 customers. Investment should pause if management cannot reconcile these denominators, disclose current liquidity and margins, or demonstrate acceptable provider and customer concentration."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
