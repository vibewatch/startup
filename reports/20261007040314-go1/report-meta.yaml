companyProfile:
  summary: >-
    Go1 is an enterprise learning-content aggregation platform founded in Brisbane, Australia, that distributes curated
    third-party courseware through HR and LMS integrations for employers and public-sector buyers. The business model
    combines subscription access to a multi-provider catalog with usage-based partner revenue sharing, and the public
    record supports wide customer adoption but not current audited economics.
