  topStrengths:
    - Broad enterprise distribution with more than 10,000 customer organizations
    - Large content catalog integrated into HR and LMS workflows
    - Revenue-sharing model aligns the company with many content partners
  topRisks:
    - Audited revenue, margin, burn, and retention metrics remain undisclosed
