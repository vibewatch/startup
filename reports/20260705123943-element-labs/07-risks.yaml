  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: export-control-compliance
    missingEvidence: A written export-control matrix covering China-linked buyers, U.S. technology content, reseller channels, and external counsel sign-off.
    whyItMatters: Policy risk is real and dynamic, and a stealth vendor can lose time or TAM if it discovers compliance constraints only after customer engagement.
    diligencePath: Request the current export-control memo, denied-party screening workflow, and any customer-country restriction list reviewed by counsel.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR028
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: benchmark-and-tco-proof
    missingEvidence: A customer-ready benchmark deck with latency, throughput, tokens-per-watt, cost-per-token, and model compatibility versus incumbent alternatives.
    whyItMatters: Without quantified efficiency proof, the valuation rests on pedigree and secrecy rather than on underwritable commercial differentiation.
    diligencePath: Request the latest benchmark package, workload methodology, and at least one customer or design-partner technical reference call.
    relatedQuestionRefs:
    - QR002
    - QR015
    - QR026
    - QR027
  - type: private-evidence-only
    severity: material
    topic: allocation-and-yield
    missingEvidence: Wafer, CoWoS or alternative packaging, HBM, and assembly allocation commitments plus current yield, respin reserve, and bring-up milestones.
    whyItMatters: Schedule, gross margin, and customer delivery timing all hinge on whether Element has secured enough external capacity and silicon quality.
    diligencePath: Request foundry and packaging allocation letters, current BOM assumptions, yield dashboards, and the first-silicon issue log.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR014
    - QR030
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-runway
    missingEvidence: Management operating model with revenue ramp, gross-margin bridge, monthly burn, working-capital needs, and downside runway case.
    whyItMatters: A chip startup can look well financed in headlines and still require emergency capital if packaging cost, yield, or customer timing slips.
    diligencePath: Ask for the board model, scenario sensitivities, and month-by-month cash forecast through first meaningful production revenue.
    relatedQuestionRefs:
    - QR022
    - QR023
    - QR030
  - type: private-evidence-only
    severity: material
    topic: governance-and-bench
    missingEvidence: Board composition, committee structure, succession plan, key technical and commercial hires, and decision-rights map across founders and investors.
    whyItMatters: Stealth founder-led teams can move quickly, but missing bench depth or weak governance can delay customer scaling and follow-on fundraising.
    diligencePath: Request the cap table, board deck, org chart, succession plan, and current open roles by function.
    relatedQuestionRefs:
    - QR025
    - QR028
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: freedom-to-operate
    missingEvidence: A formal freedom-to-operate review, litigation hold assessment, and internal trade-secret controls for code, model workflows, and employee transitions.
    whyItMatters: AI-chip startups operate in patent-dense and employee-mobile markets where litigation can become existential before revenue scales.
    diligencePath: Request outside-counsel FTO work product, employee exit protocols, and generative-AI usage controls for confidential technical material.
    relatedQuestionRefs:
    - QR006
    - QR007
    - QR008
    relatedTableRefs:
    - TR001
