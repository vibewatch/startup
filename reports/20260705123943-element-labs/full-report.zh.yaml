      - number: '6.4'
        title: 采购摩擦与底线
        blocks:
          - type: paragraph
            body: >-
              客户层面最重要的结论是，推理效率需求真实存在，但要转化成持久创业公司收入，先要穿过采购摩擦。Deloitte 称，在受访组织中，只有四分之一把 40% 或更多试点推进到生产；Gartner 预计，很多智能体 AI
              项目会因成本、业务价值和控制不匹配而被取消。Deloitte 还称，供应商所在国家如今会影响大多数受访者的选择；任何以色列或美国阵营芯片创业公司卖进受监管或主权场景时，这一点都直接相关。MLCommons
              补充了为什么只靠 logo 证明不够：推理采购由基准、时延、吞吐和合规驱动。换句话说，买家可能欣赏创始人，但在性能主张通过资格验证、支持路径看起来安全之前，仍然拒绝部署。Element Labs
              的结论应谨慎但不应否定。直接公开记录支持一个可信的目标客户假设——云巨头、模型实验室、neocloud 以及企业 /
              本地数据中心运营商——但还不支持生产采用结论。因此，本章是一张大量依赖代理样本的需求地图，外加一份精确尽调问题短清单；它不是客户牵引力已经坐实的证据。
