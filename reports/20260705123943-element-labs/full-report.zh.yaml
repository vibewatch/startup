  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价披露
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一种硬件主导的商业模式，但还不足以承销完整收入栈。多份采信来源把 Element Labs 描述为推理芯片公司，而不是模型训练供应商；2025 年 1 月 Globes
              报道更进一步，称公司目标是交付一套端到端系统，包括通信芯片、处理器、图形处理器和软件层。这让其可能的收入模式更接近定制化基础设施销售，而不是商品化组件或 SaaS
              订阅。同一报道称，处理器正按客户需求开发，这强烈暗示早期合同会是面向少数成熟买方的谈判式设计导入 项目，而不是自助式网页定价。公开来源没有披露的内容同样重要：没有任何采信来源给出系统
              ASP、软件许可结构、经常性维护费，或硬件、软件和支持之间的确认收入组合。Groq、Cerebras 和 AWS 等同业推理提供商都披露了透明的用量或容量定价，但 Element Labs
              没有。因此，本章可以描述可能的变现机制，但仍应把已实现定价、折扣和合同期限列为未解决的尽调事项。
