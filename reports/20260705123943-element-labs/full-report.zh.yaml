  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Element Labs 并不在一条干净的单供应商赛道里竞争。围绕公司的公开叙事描述的是一种推理优先的系统野心，目标客户包括超大规模云厂商、模型开发商、新型云运营商，以及其他寻找 NVIDIA
              中心化基础设施替代方案的运营方。这意味着可比同业集合比获得风投支持的推理 ASIC 初创公司更宽，至少包括五类相互重叠的解决方案。第一类是占主导地位的既有技术栈：NVIDIA 硬件加
              NIM、Dynamo、TensorRT-LLM，以及围绕 CUDA 和 NVLink 的生态。第二类是承诺更低锁定或更容易贴合现有基础设施的既有替代品，尤其是 AMD Instinct 和 Intel
              Gaudi。第三类是推理优先的初创公司，例如 Groq、Cerebras、SambaNova、Tenstorrent 和 d-Matrix；它们各自尝试把专用架构与云
              API、机架、板卡或私有部署配在一起。第四类是超大规模云替代品，包括 AWS Inferentia、Google TPU 和 Azure AI 基础设施，让买方在现有云合同内解决需求。第五类是 Marvell
              这类相邻定制芯片供应商；它们重要，是因为超大规模云厂商越来越能推进半定制 AI 基础设施，而不是直接购买现货商用加速器。对尽调的含义很简单：Element
              不只要击败一颗芯片，还要击败具有不同转换成本和采购动作的整套部署路径。
