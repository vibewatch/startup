      - number: '8.4'
        title: 情景区间，以及为什么干净倍数不适用
        blocks:
          - type: paragraph
            body: >-
              本章不应假装可以用干净的公开倍数给 Element 估值，因为这些倍数最需要的一个数字——收入——并不公开。Astera、Marvell 和 Nvidia 只能作为边界标记。它们展示了规模化 AI
              半导体企业在收入、毛利率和市值可见时的样子；却不能证明一家客户未披露的私营公司也配得上同一框架。私营公司和交易可比案例更有帮助，但噪音也更大。Groq
              说明，当商业规模可见时，投资者会用数十亿美元价值支持一个高溢价推理故事。SambaNova 说明 GPU 替代方案仍能拿到战略资本。Hailo 说明这种支持可以多快反转。Habana 和 ZT Systems
              说明买家关心可部署系统和进入市场速度，不只是芯片主张。基于这些证据，约 20 亿至 35 亿美元的基准情景区间比当前估值更可辩护；55 亿至 75 亿美元的多头情景需要真实证明；5 亿至 15
              亿美元的空头情景仍有可能。
