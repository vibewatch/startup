      - number: '2.2'
        title: 规模测算视角、TAM 压缩与真正可触达空间
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数字只适合当边界标记。Gartner 给出了最清晰的例子：它对 2024 年广义 AI 半导体的估计是 $71.25 billion，但同年更窄的服务器加速器切片只有 $21
              billion。其他发布方的跨度更大。MarketsandMarkets 推出一个 2025 年 $106.15 billion 的 AI 推理机会，Grand View 把 2024 年加速器市场框定为
              $25.56 billion，GMInsights 发布 2026 年 $154.6 billion 的加速器芯片数字，Mordor 则给出 2026 年 $174.69
              billion。这些估计并不是以同一种方式出错；它们使用了不同分母。有的纳入汽车和边缘
              NPU，有的混合训练和推理，有的只跟踪服务器内容，还有的更像软件或服务市场代理，而不是商用芯片收入。与估值最相关的结论是，Element Labs 不需要最宽口径的 TAM
              材料，也能具备方向上的吸引力；但它也不能主张那些口径。更诚实的框架，是一个商用推理芯片 SAM：它窄于广义 AI 芯片数字，因为超大规模云厂商的内部 ASIC
              会吸收大量需求，而训练预算池也不同于稳态推理服务预算池。
