              - CV045
      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 当前价格跑在公开证据前面
            body: 一轮 >$4B 融资证明的是投资者胃口，不是外部投资者可以在没有客户、收入和条款级披露的情况下承销公允价值。
