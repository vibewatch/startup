      - number: '4.4'
        title: 公开牵引与私有数据缺口
        blocks:
          - type: paragraph
            body: >-
              公开牵引信号真实存在，但更偏运营，而非商业。到 2025 年 4 月，Globes 已描述公司员工超过 100 人；到 2025 年 10 月，Globes 和 Calcalistech 都把公司规模放在约
              200 人，并将其与 Caesarea 前 Habana 园区联系起来；到 2026 年 6 月，Globes 估计约 350 名员工外加数百名外包承包商。Finder 仍报告较低的 51-200
              人区间，同时也称公司三轮融资共 $400 million，来自六家投资人。对一家 2024
              年才公开浮出水面的公司来说，这些都是有意义的规模指标。但缺失的商业数据集远大于可见数据集。没有任何采信来源披露收入、ARR、具名客户、部署利用率、毛利率、已实现定价或客户集中度。以色列注册路径对开放网络分析也很浅：政府门户只提供免费基础信息或付费完整摘录，注册信息相邻的数据供应商则称，更完整的法律和财务报告位于付费产品之后。结果是一种熟悉的隐身硬件不对称：公开来源显示资本形成和招聘动能，却没有给出把动能转化为收入质量或利润率信心判断所需的证据。
