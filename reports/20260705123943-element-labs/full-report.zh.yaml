            body: >-
              Element Labs
              没有披露直接客户证据，因此公开材料里最有用的参照，是相邻推理平台已经点名的部署长什么样。这些案例反复集中在几类客户：超大规模云厂商和前沿模型实验室，为下游用户打包专用芯片的云渠道，主权或国家级算力项目，以及有可衡量时延或成本痛点的特定应用企业。AWS
              是最干净的公开样本。Anthropic 称 Claude 已在近 100 万颗 Trainium2 芯片上训练和服务，Amazon 则称超过 100,000 名客户在 AWS 上运行 Claude。AWS
              同一组客户页面还给出 Poolside、Decart、Karakuri、NetoAI、SplashMusic 和 Tomofun
              这些更小但更具体的应用案例；这一点有用，因为它把大型平台广度和具体工作负载部署结果分开了。类似模式也出现在其他地方：IBM Cloud 在指定区域开放 Gaudi 3 生产工作负载，SoftBank 是
              SambaNova 在日本首个公开 SN50 部署，Groq 通过 Aramco Digital 拿到沙特主权锚点，OpenAI 则与 Cerebras 签了分阶段的低时延推理建设。上述信息不能证明
              Element 有同等牵引力，但说明这一品类里可信客户证据通常长什么样：点名的渠道、点名的地域、点名的工作负载，以及至少一个具体生产或规模信号。
