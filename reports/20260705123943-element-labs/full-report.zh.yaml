      - number: '8.3'
        title: 投资假设与反假设
        blocks:
          - type: paragraph
            body: >-
              投资假设并不难讲。推理需求正在变成战略问题，市场也在寻找办法，避免完全依赖以 Nvidia 为中心的栈。Element
              由已经打造并出售过相关芯片公司的创始人领导，公司把产品定位在更小或分布式数据中心足迹里的推理，至少在方向上与这类需求一致。Groq 和 SambaNova
              等公开可比公司显示，只要看到平台动能，投资者仍会积极资助替代推理架构。反假设是，这些正面因素都不能证明 Element
              自身的经济性。公开证据更强地支持创始人质量、资本获取能力和品类相关性，却远弱于对客户采用、软件护城河或利润率质量的支持。Habana 故事就是警示标签：可信团队仍可能难以把技术承诺转化为持久商业价值。Hailo
              的重置又补了一层警示：一旦资本紧迫性出现，估值会猛烈压缩。在当前价格下，反假设和投资假设一样重要。
            claimRefs:
              - CV008
              - CV011
              - CV016
              - CV017
              - CV018
