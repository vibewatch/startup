            body: >-
              公开可见的领导层几乎完全集中在三个人身上：Avigdor Willenz、David Dahan 和 Ran Halutz。早期创始报道将 Dahan 确认为 CEO、Halutz
              确认为高级开发负责人，独立行业报道则把 Willenz 描述为董事长和反复创业、为项目背书的人。这一结构很重要，因为 Element Labs 在任何公开产品发布之前，就已靠创始人声誉融资和招人。Willenz
              横跨 Galileo、Annapurna Labs 和 Habana Labs 的履历，确实能帮助公司打开投资人、代工厂和客户的大门，但也让公司异常依赖一个人的网络和判断。Dahan 和 Halutz 带来了
              Habana 创始团队的运营与研发信誉，部分降低了风险；但更广泛的高管梯队、董事会委员会和董事会构成仍大多未披露。采信的公开来源也始终只列出这三位创始人；它们没有把 Linor Saadia
              放在创始人或高管角色中，因此本章应将该归属视为未经验证。
