      - number: '8.6'
        title: 最终尽调问题，以及什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              好消息是，尽调议程很清楚。更好的建议不需要泛泛的“更多信息”；它需要少数具体私有数据点。第一，公司必须拿出可信商业化包：点名或脱敏的锚定客户，已签或接近签约的管线，以及与每 token
              成本或时延结果绑定的基准证据。第二，融资包必须拆开：股权结构表、优先权栈、债务、员工期权池，以及任何老股转让或棘轮条款。第三，团队必须展示从 tape-out
              到可重复经济性的桥，而不只是产品路线图的存在。如果这些项目很强，当前估值可以从缺乏支撑变成激进但理性。如果这些项目很弱，当前名义价格就很脆弱。因此，可执行信息很简单：把公司留在活跃名单上，但不要把融资动能误认为经过验证的公允价值。
            claimRefs:
              - CV009
              - CV036
              - CV038
              - CV042
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV009
              - CV036
