  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 商业化证明缺口
        - 基准测试和客户背书材料包
        - 下一次重大融资决策前，仍无客户可验证的性能或 TCO 证据
        - 不把产品优越性带来的上行写进承销假设
      - - 产能分配风险
        - 晶圆 / 封装承诺
        - 首个生产窗口没有硬性产能分配或备选方案
        - 基准情形假设进度滑坡、利润率受压
      - - 客户集中风险
        - 管线广度
        - 仅一两个 design-in 贡献早期收入计划的 >50%
        - 折价看待收入质量和谈判筹码
      - - 合规风险
        - 出口管制准备度
        - 跨境销售前没有法律顾问背书的销售矩阵或筛查流程
        - 把 TAM 和成交时间视为不稳定
      - - 人员 / 治理风险
        - 团队厚度和董事会结构
        - 到商业化阶段仍没有明确商业负责人、合规负责人或继任路径
        - 升级治理尽调，避免价格不敏感的承销
    notes: 这些触发项可在尽调期间和投资后监测。它们把宽泛风险主题转成明确红黄绿灯，从而改变承销判断。
    claimRefs:
