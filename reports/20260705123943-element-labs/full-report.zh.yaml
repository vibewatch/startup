      - number: '7.3'
        title: 运营、制造与质量风险
        blocks:
          - type: paragraph
            body: >-
              这个故事里最难的风险在公司墙外。公开报道称，Element 2025 年 4 月融资用于完成首个芯片系列，并推进到 TSMC tape-out；这意味着公司已经进入由晶圆分配、封装、良率和 bring-up
              纪律决定进度的领域。行业来源把这个领域描述得极其昂贵。Semiconductor Engineering 引用的历史 5nm 成本估计超过 5 亿美元，EPDT 则称，先进节点产品化成本在 16nm
              之后呈指数上升，2nm 可超过 10 亿美元。比绝对数字更重要的是风险结构：即使是 NVIDIA 和 AMD
              这样的巨头，也描述了对第三方晶圆厂、封装伙伴和组件可用性的依赖，并明确警告缺陷、短缺或供应延迟会打击毛利率和交付。TrendForce 2026 年 6 月对 CoWoS
              紧张的判断说明了为什么这点重要。产能在扩张，但市场到 2026 年底可能仍供不应求。Element 的公开披露没有说明首个产品是否使用
              HBM、CoWoS、更简单封装或其他路径，因此投资者还无法量化其真实暴露。运营结论很简单：首硅进展可信，但制造栈在进度和利润率风险最高的位置仍披露不足。
