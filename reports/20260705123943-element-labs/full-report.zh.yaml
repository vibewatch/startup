  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - Element Labs 关联性
    rows:
      - - 超大规模云厂商和模型提供商推理集群
        - 部署在云或自有数据中心的 LLM、排序、推荐和智能体工作负载服务支出
        - 前沿模型训练集群和通用云网络支出
        - 基础设施组织通常自己购买、使用和付款
        - 核心目标，因为每 token 成本、密度和能效直接重要
      - - 通过云服务消费的企业推理
        - 托管 AI 服务和托管推理容量的按量使用支出
        - 大多数直接芯片资本开支，因为企业通常购买服务结果而不是芯片
        - 应用团队使用；CIO、平台或业务单元负责人付款
        - 间接但重要，因为企业需求驱动云集群选择
      - - Neo-cloud / 专业推理提供商
        - 面向 AI 开发者或模型构建者销售的专用服务集群
        - 通用企业 IT 和无关托管工作负载
        - 平台运营商购买并付款；开发者客户使用
        - 可作为创业公司向重度依赖 GPU 的集群销售效率优势的早期滩头堡
      - - 边缘和物理 AI 推理
        - 面向机器人、工业自动化和类似物理 AI 工作负载的功耗受限本地推理服务
        - 智能手机客户端 NPU 和消费设备 AI 功能
        - OEM 或运营商购买；本地应用栈使用
        - 相邻机会，Element Labs 的效率叙事在这里比训练规模更契合
      - - 汽车 ADAS 和安全关键型嵌入式 AI
        - 近期投资假设大多排除，因为长验证周期和安全认证占主导
        - 消费者信息娱乐和无关汽车电子
        - 车企或一级供应商购买并付款
        - 可能是长期相邻领域，但不是近期承销基础
      - - 模型训练加速器
        - 排除在核心市场边界之外，因为内存、互联和软件优先级与推理优化显著不同
        - 更广泛的 HPC 和一次性实验预算
        - 中央 AI 研究团队通常购买和使用
        - 仅作为背景重要，不是 Element Labs 所称服务的主要市场
    notes: 边界行混合了直接芯片支出和服务驱动需求代理。目的在于把推理决策集从更宽泛、会高估可触达性的 AI 芯片类别中拆出来。
