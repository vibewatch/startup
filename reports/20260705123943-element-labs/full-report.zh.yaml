      - number: '6.3'
        title: 持久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开持久性证据同样不对称。Element Labs 本身没有披露 NRR、GRR、续约、流失、合同期限或客户数量，因此本章不能声称其留存已经被证明。代理样本更有用。正面看，Anthropic 对 AWS
              的多年承诺，以及 100,000 多个 Claude-on-AWS 装机基础，说明渠道、软件和硬件打包进可信云环境之后，持久推理需求可以出现。Red Hat 的推理层和 IBM 托管 Gaudi
              供给也指向同一方向：企业买家常常要的是围绕芯片的抽象层和支持模型，不只是裸硬件。负面看，同一组同行也显示客户集中度可以有多脆弱。Cerebras
              的申报文件和后续分析说得很清楚：即使技术很强的推理公司，也可能危险地依赖一两个锚定客户。主权或超大规模客户可以验证平台，但也可能主导收入结构。因此 Element
              面临双面持久性挑战：它需要足够多的标杆账户证明生产相关性，但最终也需要足够的广度或渠道杠杆，避免某个保密账户变成全部客户故事。
