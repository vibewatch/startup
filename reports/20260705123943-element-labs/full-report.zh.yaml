      - number: '8.5'
        title: 退出准备度与打破投资假设的触发点
        blocks:
          - type: paragraph
            body: >-
              Element 今天还没有公开退出准备度。业务未来可能达到 IPO 标准，但公开网络记录仍像一个隐身深科技项目，而不是一家准备承受公开市场披露的公司。战略兴趣比即时 IPO
              准备更容易想象，尤其是超大规模云厂商和基础设施供应商越来越重视集成系统、机架设计和可部署性，且这些价值与芯片并列。这不意味着出售迫在眉睫，甚至也不意味着出售更优；它意味着最可信的退出路径仍取决于技术和商业去风险，而这些公开资料还看不到。如果首硅未能达到目标经济性，如果客户转化停留在轶事层面，或如果下一轮融资需要惩罚性结构来弥合叙事和运营证明之间的差距，投资假设就会破裂。这些并不是
              AI 硬件里的偏远边缘情景，而是常见失败模式；当前估值已经几乎不给它们留空间。
            claimRefs:
              - CV015
              - CV016
              - CV026
              - CV027
              - CV045
              - CV046
              - CV047
