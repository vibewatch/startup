      - number: '3.3'
        title: 定价、分发、转换成本与供应获取
        blocks:
          - type: paragraph
            body: >-
              公开定价记录并不均衡，这很重要。Groq 和 Cerebras 让开发者或 AI 团队相对容易从按用量付费推理开始。Tenstorrent 不寻常之处在于，它公开板卡和 Galaxy
              服务器的硬件价格。即便总体交付经济性仍取决于负载和规模，这种透明度也降低了评估摩擦。相比之下，NVIDIA、AMD、Intel、SambaNova、d-Matrix 以及 Marvell 这类定制 ASIC
              路径，大多通过企业、OEM 或谈判式采购触达买方。分发深度的差异同样尖锐。AWS、Google 和 Azure 把推理基础设施包进全球云合同和既有运营关系。Intel 倚重 Dell 等
              OEM。SambaNova 通过 SoftBank、OVHcloud 和一项 Intel 合作展现了可见的伙伴证据。Marvell 对大多数开发者而言不是商用加速器替代品，但对超大规模云厂商很重要，因为它提供定制
              XPU 和封装能力，并且现在接入了 NVIDIA 的 NVLink Fusion 生态。这些事实决定转换成本。转向 Groq 或 Cerebras 的买方，可能需要改变 API
              端点和部署假设，但不一定第一天就买新机架。选择 NVIDIA、超大规模云芯片或半定制路径的买方，则是在围绕框架、互联、采购和长期容量做更深的技术栈选择。因此，Element 面临的挑战既是商业挑战，也是架构挑战。
