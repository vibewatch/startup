      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              推理加速器的需求逻辑是真实的，但闸门因素和增长故事同样重要。积极一面是，推理经济性正在快速改善，OpenAI 式 token
              定价让买方能清楚看见每次输出的成本，大型云厂商也开始公开用价格、吞吐量和能效营销替代芯片，而不只强调原始峰值规格。物理 AI
              和边缘用例扩大了低瓦数服务硬件能获得回报的负载集合。反过来，电力和互联容量正成为部署硬约束；Berkeley Lab 的更新显示，在基准情景下，美国数据中心用电量到 2030 年可能达到 649
              TWh，在高推理能耗情景下则可能达到 782 TWh。软件锁定是另一大刹车。CUDA 仍锚定庞大的装机基础和库生态，因此新进入者必须拿出足够的
              opex、时延或密度改善，才能让客户承担迁移风险。供应链和出口管制波动又叠加一层复杂性：晶圆可得性、液冷成本，以及不断变化的美国先进计算规则，都会扰乱长期需求规划。
