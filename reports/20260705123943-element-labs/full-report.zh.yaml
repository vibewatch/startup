      - number: '7.2'
        title: 监管、法律与知识产权暴露
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险并不是假设。2026 年 1 月，BIS 把对中国的先进半导体出口转向更有条件的逐案审批机制，但同时绑定客户筛查、美国本土测试和供应保护条件。GAO 和 CRS
              都把这些规则描述为操作复杂，而不是例行行政手续。即使 Element 本身从不直接卖进中国，这些规则仍可能通过中国相关客户、转售商、供应链伙伴，以及 AI
              芯片市场更广泛的议价动态影响公司。上市公司的传导很清楚：NVIDIA 称出口管制已经损害其竞争地位，而其集中在亚洲的供应链在规则进一步收紧时仍有暴露。法律环境同样活跃。商业秘密诉讼在 2025
              年创下纪录，近期法律分析称，法院在 AI 相关商业秘密诉状中越来越要求具体性，并且可能把不谨慎使用公开生成式 AI 工具视为保密保护没有得到合理维护的证据。Element
              看起来处于深度隐身状态，公开暴露面很小，缓释好处显而易见：公开泄漏更少。但剩余风险在于，投资者仍看不到成文合规框架、正式的自由实施判断，或团队扩张时能保护高价值设计信息的内部控制。
