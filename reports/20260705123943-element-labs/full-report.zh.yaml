        - 行业规模上限信号，不能作为可用的商用推理 SAM
      - - Gartner — 服务器 AI 加速器
        - 2024 / 2028
        - '2024: $21B; 2028: $33B'
        - 全球服务器加速器价值
        - 仅服务器的较窄切片；仍混合训练和推理
        - 数据中心子集最好的公开下限锚点
      - - MarketsandMarkets — AI 推理市场
        - 2025 / 2030
        - '2025: $106.15B; 2030: $254.98B'
        - 全球推理类别
        - '可能混合基础设施、部署和更宽泛的推理栈定义；FAQ 还引用 2024: $76.24B'
        - 方向上有帮助，但太宽，不能当作商用芯片 TAM
      - - Mordor — AI 加速器市场
        - 2026 / 2031
        - '2026: $174.69B; 2031: $518.12B'
        - 覆盖云、边缘、训练和推理的全球加速器
        - 更宽的加速器分类法和混合终端市场
        - 如果整个加速器类别持续复合增长，可显示上行空间
      - - Grand View — AI 加速器市场
        - 2024 / 2033
        - '2024: $25.56B; 2033: $256.84B'
        - 全球加速器市场
        - 起始边界明显比 Mordor 或 GMInsights 窄
        - 提醒公开 TAM 高度依赖分类口径
      - - GMInsights — AI 加速器芯片市场
        - 2026 / 2035
        - '2026: $154.6B; 2035: $1T'
