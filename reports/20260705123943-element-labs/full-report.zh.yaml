      - number: '1.2'
        title: 产品重点、商业模式，以及隐身状态为何重要
        blocks:
          - type: paragraph
            body: >-
              采信来源把 Element Labs 勾勒成一家推理优先的系统公司，而不只是单点芯片开发商。多篇报道称，公司正在为模型训练之后的阶段打造处理器：已部署的 AI
              系统需要回答提示、识别图像，并以可接受的成本和功耗运行智能体式工作流。公开描述也不止于一颗 ASIC：2025 年 1 月 Globes
              报道称，公司计划构建端到端技术栈，可能包括通信芯片、核心处理器、图形处理器，以及管理这些组件的软件。这个定位对尽调很关键。Element Labs
              看起来不像一家销售标准化器件的通用半导体公司，更像是为超大规模云厂商、模型开发商和其他大型 AI 运营方提供定制基础设施的供应商，服务那些寻找 Nvidia
              中心化架构替代方案的客户。因此，公司没有网站、LinkedIn 页面、公开基准测试材料或客户案例，并不只是品牌层面的异常；它也提醒投资人，尽管 GTM
              野心相对公司年龄而言异常庞大，类似公开市场标准的产品验证还没有出现。
