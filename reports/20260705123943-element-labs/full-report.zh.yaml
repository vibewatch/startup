      - number: '7.4'
        title: 伙伴、依赖、客户与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Element 并不是要进入一个空白市场。公开竞争门槛已经由能把芯片与软件、云分发或二者结合起来的厂商设定。AWS、Google 和 Azure 都在营销自有 AI 基础设施。Groq 公开 token
              定价，Cerebras 已经提供公开推理访问。OpenAI 自己的 tape-out 努力说明，大买家可能更愿意搭建议价杠杆，而不是继续依赖商用供应商。含义是，Element
              不只是需要一颗好芯片；它需要拿出一个系统层面的商业答案，比现有厂商、云替代方案，以及拥有更多公开证明的推理优先创业公司更好。这种依赖风险也穿过客户侧。Cerebras 的 S-1
              是有价值的警示，因为它显示收入可以快速扩张，同时仍集中在少数买家手中。如果 Element
              第一批真实胜利来自少数超大规模云厂商、主权实验室或模型构建者，那么狭窄客户基础可能是成功的特征，但同样也是明确的剩余风险。公开层面，Element
              还没有给出足以抵消这一担忧的基准、客户背书或采购证明。在做到之前，伙伴和客户依赖应被视为核心承销问题，而不是普通早期阶段的小麻烦。
