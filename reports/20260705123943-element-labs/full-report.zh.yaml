    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Element Labs 现在仍更适合被看作一家隐身运营的私营公司，而不是已经公开商业化的半导体供应商。最清晰的硬身份锚点来自法律实体记录：Element Labs Ltd. 于 2024-05-08
              在以色列注册，登记和总部地址为特拉维夫 Begin Road 132 号。随后，2024 年 8 月，Globes 报道 Avigdor Willenz、David Dahan 和 Ran Halutz 已以
              Element Labs 名义注册公司，内部则把项目非正式称为 Touch，公司由此进入公众视野。此后，公开报道一直将 Element Labs 描述为一家以色列 AI
              芯片初创公司，重点做推理，而不是模型训练。它的足迹不是单点，而是双点：法律和早期办公记录指向特拉维夫，后续运营报道又反复把公司放在 Caesarea，包括前 Habana Labs 园区。合起来看，Element
              Labs 是一家 2024 年 5 月注册、2024 年公开浮出水面、仍为私营的以色列芯片公司，法律总部在特拉维夫，主要运营正集中到 Caesarea。
