  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 融资支持存在，但收入和客户证明还没有。
        - 继续尽调；不要把当前估值标记视为自我验证。
      - - 置信度
        - 中
        - 关键价格敏感事实仍未公开。
        - 私有文件到手前，结论保持弹性。
      - - 风险评级
        - 高
        - 硬件执行、集中度和资本重组风险都仍在场。
        - 先建模下行，再看上行。
      - - 估值立场
        - 偏贵
        - 公开证据跟不上 >$4B 的名义估值。
        - 只有有效入场价格或条款改善，才继续推进。
      - - 入场纪律
        - 要求更低有效成本或更强结构
        - 股权结构和优先权不透明仍未解决。
        - 不只按名义投后估值承销回报。
      - - 目标回报门槛
        - 需要从今天成本出发实现 >2.5x 净回报的路径
        - 以 >$4B 入场，需要更大的最终退出或强下行保护。
        - 这个阶段，价格纪律比创始人质量更重要。
    notes: 摘要判断基于公开证据；只有在审阅私有 KPI、股权结构和客户材料后，才应重新评估。
    claimRefs:
      - CV038
      - CV042
      - CV043
      - CV044
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 视角
      - 投资论点
      - 反论点
      - 改变判断的证据
    rows:
      - - 创始人
        - 连续创业者曾实现相关 $2B 退出，降低团队风险。
        - 创始人履历不能替代产品市场证明。
        - 证明过往人脉已经转化为当前客户采用。
      - - 市场
        - 推理需求和 GPU 替代方案仍具战略价值。
        - 同样需求也吸引大得多的现有巨头和超大规模云厂商自研芯片。
        - 证明 Element 在某个细分场景靠经济性取胜，而不只是靠雄心。
      - - 产品
        - 流片资金和推理聚焦显示路线图较连贯。
        - 看不到公开基准、客户部署或软件护城河。
        - 披露首版芯片指标和软件移植证据。
      - - 资本
        - 跟投投资人在 2026 年愿意大幅加码。
        - 名义估值可能嵌入外部人还看不到的条款。
        - 披露股权结构机制和融资结构。
      - - 可比公司
        - Groq 和 SambaNova 说明，私募资本仍愿意为推理平台买单。
        - Hailo 和 Habana 说明，估值重置和商业化失败并不少见。
        - 证明商业牵引更接近赢家，而不是受挫者。
      - - 退出路径
        - 原则上存在战略出售或 IPO 路径。
        - 公开可见的退出准备度仍弱，时间也不透明。
        - 补上治理、披露和客户集中度准备。
    notes: 各行把公司质量和价格支撑拆开；即便投资论点强，如果证明和条款落后于估值，入场仍可能很差。
    claimRefs:
