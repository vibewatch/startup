      - number: '4.3'
        title: 成本结构、利润率驱动因素与制造经济性
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清楚的财务事实是，Element Labs 几乎肯定高度资本密集。Globes 称，2025 年 Series A 用于完成第一代芯片系列并启动 TSMC 流片测试；Reuters 引述的可比先进
              AI 芯片报道称，一次典型流片成本为数千万美元，耗时约六个月，如果首版硅失败，可能还要重复。更广泛的半导体来源把含义推得更远：EPDT 称，sub-7nm 产品化成本已经指数级上升，2nm 项目可能超过 $1
              billion，开发周期拉长到 24-30 个月；Semiconductor Engineering 则把 5nm
              项目也框定为数亿美元工程，因为光罩、工具、软件、人头和制造都要算进去。利润率驱动因素同样可见，尽管实际利润率不可见。TrendForce 认为，推理经济性取决于单位 token 成本、能效、吞吐量和利用率，并指出
              GPU 在低时延推理中可能受 HBM 成本、良率、功耗和利用率约束。TSMC 的 CoWoS 材料说明了封装为何重要：现代 AI 加速器越来越依赖大型中介层和多组 HBM
              堆栈，这会抬高成本和供应风险。因此，Element Labs 的财务画像是一家无晶圆厂但仍对制造高度敏感的公司：代工厂通道、先进封装、软件适配和工程薪酬，可能比办公室租金更大程度地驱动利润率，尽管
              Caesarea 园区本身已是一项可衡量的固定成本。
