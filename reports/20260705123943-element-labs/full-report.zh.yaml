      - CV017
      - CV019
      - CV024
      - CV035
      - CV036
      - CV046
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 估值区间（USD M）
      - 核心假设
      - 概率信号
      - 破坏或延续该情景的因素
    rows:
      - - 乐观
        - 5500-7500
        - 流片成功，私有尽调显示有锚定客户，Element 证明推理经济性足以支撑超大规模云厂商采用。
        - 今天看，这种情景可能存在，但不是公开证据主导。
        - 如果基准测试材料包或客户证明薄弱，这种情景就失效。
      - - 基准
        - 2000-3500
        - 团队和市场仍有价值，但商业化证明有限，未来稀释仍真实存在。
        - 最符合今天的公开数据。
        - 只有私有 KPI 访问补上证明缺口，情景才会改善。
      - - 悲观
        - 500-1500
        - 流片延误、集中度过窄，或桥轮像其他硬件公司一样重置价格。
        - 这是真实下行路径，不是尾部想象。
        - 如果融资条款转向防御，或收入兑现时间拉长，这种情景更可能发生。
    notes: 区间是情景估计，不是收入倍数输出，因为 Element 的公开收入和利润率数据不可得。
    claimRefs:
      - CV039
      - CV040
      - CV041
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 最新公开价值 / 轮次
      - 与 Element 的相关性
      - 局限
    rows:
      - - Astera Labs
        - 上市公司
        - ~$69.7B 市值；~69.6x 过去十二个月销售额
        - 展示优质 AI 半导体市场如何给已披露增长和利润率定价。
        - 阶段更晚、收入已披露，且由连接业务驱动，不是隐身芯片公司。
      - - Marvell
        - 上市公司
        - ~$214.6B 市值；~24.6x 过去十二个月销售额
        - 是已规模化数据基础设施公司切入 AI 建设的有用边界。
        - 产品组合和客户基础更宽，只能作宽松护栏，不是直接可比。
      - - NVIDIA
        - 上市公司
        - ~$4.72T 市值；~18.6x 过去十二个月销售额
        - 定义现有巨头经济体量，也说明挑战者必须差异化。
        - 体量和盈利能力都太高，不能锚定 Element 的直接公允价值。
      - - Groq 2025 年轮次
        - 私募融资
        - 以 $6.9B 投后估值完成系列融资
        - 是保留样本中最直接的高溢价推理融资参照。
        - Groq 公开平台证据更多，也有云业务足迹。
      - - Groq 2026 年轮次
        - 私募融资
        - 新增 $650M 增长资本；估值未公开更新
        - 说明 2026 年投资人仍在大规模支持推理基础设施。
        - 不能提供干净的更新估值标记。
      - - SambaNova 2026 年轮次
        - 私募融资
        - Series E 轮，$350M+
        - 又一个已获融资的推理平台，并有客户和伙伴主张。
        - 结构和确切投后估值此处未公开说明。
      - - Hailo 2026 年重置
        - 反向私募可比
        - 估值从 $1.2B 峰值降至 $500M 以下
        - 说明流动性和商业化不及预期时，AI 芯片价值会如何压缩。
        - Edge-AI 画像不同于 Element 的数据中心推理故事。
      - - Habana / Intel
        - 并购里程碑
        - 2019 年约 $2B 收购
        - 证明差异化 AI 芯片团队能拿到战略退出。
        - 后续在 Intel 旗下的商业化结果参差，不能美化名义退出。
    notes: 本章保留了最影响决策的部分公开可比公司和交易；目标是给出方向性框架，不是穷尽整个可比宇宙。
    enumerationScope:
      coverage: partial
      basis: >-
        Coverage is limited to retained direct URLs with usable public valuation, financing, or transaction evidence for
        AI-semiconductor and inference-adjacent peers as of the 2026 run date.
    claimRefs:
      - CV017
      - CV019
      - CV021
      - CV024
      - CV026
      - CV028
      - CV030
      - CV047
      - CV048
  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 首版芯片表现不及预期
        - 基准测试材料包显示没有明确 TCO 或延迟优势
        - 打破产品驱动的乐观情景。
        - 停止承销高溢价估值扩张。
      - - 锚定客户未转化
        - 下一轮融资周期后仍无已签 design win 或收入桥
        - 故事从商业化变成投机性研发。
        - 转向回避 / 等待重置。
      - - 经济性不及预期
        - 毛利率或单 token 成本模型打不过买方替代方案
        - 失去替代现有技术栈的理由。
        - 按资产或人才收购结果重切估值。
      - - 惩罚性资本重组条款
        - 下一轮引入沉重优先权栈、ratchet 或救助债
        - 尽管名义估值存在，新资金仍被置于次级。
        - 除非结构性优先级抵消这层优先权栈，否则拒绝。
      - - 人才或治理脆弱
        - 关键创始人或核心架构团队在证明点前流失
        - 在时间敏感的硬件项目中抬高执行风险。
        - 要求大幅价格让步，否则退出。
    notes: 这些是明确否决标准，不是泛泛风险；每一项都会直接削弱投资案例或投资人在资本结构中的位置。
    claimRefs:
      - CV005
      - CV017
      - CV036
      - CV045
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 客户与管线
        - 已披露或匿名设计定点、已签约收入、续约逻辑
        - 验证采用是真实发生，还是只被融资叙事暗示。
        - 审阅销售漏斗、已签合同和部署日程。
      - - 基准测试包
        - 独立的延迟、吞吐量和每 token 成本结果
        - 判断产品相对替代方案是否真的值得投资。
        - 获取基准测试方法和第三方验证。
      - - 股权结构与优先权
        - 清算瀑布、期权池、债务、老股转让和反稀释棘轮
        - 决定实际入场价格和下行分担。
        - 审阅融资文件，搭建完全稀释清算瀑布模型。
      - - 制造经济性
        - 良率、封装假设、代工厂承诺和 NRE 支出
        - 检验毛利率是否有机会支撑溢价估值。
        - 检查 BOM、良率模型以及代工或封装协议。
      - - 治理与退出准备度
        - 董事会结构、审计准备度和披露计划
        - 影响 IPO 与战略出售哪个路径更可能、何时可行。
        - 审阅治理资料包和报告就绪清单。
      - - 现金续航
        - 月度烧钱额、情景现金曲线和融资计划
        - 看公司能否掌控融资节奏，还是只能接受下一轮可拿到的钱。
        - 索取董事会预算、差异分析和最低现金约束。
    notes: 每一项要求都直指估值：管理层若无法满足这些要求，合理结果就是降价、加结构保护， 或者不交易。
    claimRefs:
      - CV009
      - CV036
      - CV042
      - CV044
      - CV045
