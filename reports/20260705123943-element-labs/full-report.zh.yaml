      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采用路径更多按运营模式划分，而不是按模型类别划分。超大规模云厂商和前沿模型提供商是最清晰的直接买方，因为它们设计或租用大规模机群，掌握服务经济账，也能在单位 token
              成本下降或部署密度提高时为软件迁移工作买单。大型企业通常是间接买方：用户可能在客服、研发、网络安全或供应链团队，但付款方通常是 CIO、平台、基础设施或业务职能预算负责人，部署也多通过云服务进入。边缘和物理 AI
              运营方构成第三条路径，本地时延和功耗包络在这里占主导。采用成熟度同样参差不齐。广义 AI 使用率很高，但 McKinsey 和 Deloitte 都显示，真正的生产级规模远少于试点活动；Gartner
              也警告，许多智能体式 AI 项目无法存活到持久部署。对 Element Labs 来说，这意味着第一批现实目标，是已经直接感受到推理成本或功耗限制的成熟运营方，而不是寻找交钥匙硬件替换的小公司。
