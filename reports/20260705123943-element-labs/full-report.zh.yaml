    title: 单位经济性桥
    type: flow
    layout: wide
    summary: Element Labs 公开的单位经济性桥始于高昂的芯片和封装成本，随后取决于吞吐、 能效和利用率，而不是办公室开销。
    approximationNotes: 这是由公司公开信息和行业证据搭出的定性桥。Element Labs 尚未披露经审计成本项、 良率或毛利率。
    data:
      nodes:
        - id: funding
          label: 股权资本
          detail: 公开融资在实质收入出现前，为流片、招聘和设计迭代供血
        - id: tapeout
          label: 流片与芯片 bring-up
          detail: 典型先进流片成本可达数千万级，且可能需要 respin
        - id: packaging
          label: 代工 / 封装栈
          detail: 先进封装、HBM 或 CoWoS 式依赖会推高成本和供应风险
        - id: software
          label: 软件使能与验证
          detail: 模型迁移、编排和认证在规模化前就会增加成本
        - id: performance
          label: 吞吐与能效
          detail: 买家比较每瓦 token、每 token 成本、延迟和利用率
        - id: margin
