        title: 财务模型、人员风险与打破投资假设的触发点
        blocks:
          - type: paragraph
            body: >-
              最后一层风险会把其他所有风险压缩成投资结果。2026 年 AI 需求可能巨大，但这不会取消周期性、集中度或执行失败。Deloitte 的市场展望显示，AI
              如今承载了半导体经济中很大一部分，这恰恰让错误变得昂贵：利润池集中、客户预期上升，下一轮下行周期会惩罚验证不足的进入者。Element
              的融资降低了眼前生存风险，创始人组合也明显提升了资本、人才和技术关系的获取能力。但同一结构也带来板凳深度和治理问题，因为公开记录仍围绕小创始人圈，而不是完整披露的商业和合规组织。尽调必须在这里从叙事转向基于触发点的监控。如果首硅里程碑之后仍没有客户背书，如果晶圆或封装分配没有合同锁定，如果毛利率假设依赖未经证明的利用率，或如果客户准备购买时出口管制尽调仍不成熟，投资假设就会明显变弱。反过来，主要缓释路径清晰且可衡量：展示经过基准验证的每
