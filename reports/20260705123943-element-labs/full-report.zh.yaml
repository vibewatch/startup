              页面、通过推荐招聘，并且除了媒体泄露和目录摘要之外披露极少。如果超大规模云厂商对话需要保密，这种姿态可能有战略合理性；但它也让外部投资人几乎看不到关于信任、安全、安防、隐私、支持或现场质量的公开证据。公司名下没有公开信任中心、没有可见安全认证组合、没有披露出口管制立场、没有正常运行时间承诺、没有
              RMA 或保修数据，也没有公开框架或 SDK 文档。低层级目录在基础元数据上也不一致，因此第三方聚合信息应谨慎对待。创始人 Habana
