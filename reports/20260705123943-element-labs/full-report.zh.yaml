companyProfile:
  summary: >-
    Element Labs 是一家以色列 AI 半导体初创公司，由 Avigdor Willenz 与 Habana Labs 前高管 David Dahan、Ran Halutz 共同创立。公开报道将公司定位在面向推理的 AI
    处理器及相邻系统组件，目标是降低 AI 工作负载服务环节的成本和功耗压力，尤其面向希望摆脱 Nvidia 中心化技术栈的大型运营方。作为仍处隐身期的硬件公司，Element Labs
    融资速度异常快，但公开记录仍缺少客户、基准测试和财务披露。
