  - id: TP003
    title: 定价 / 产品包比较
    columns:
      - 厂商 / 类别
      - 公开定价姿态
      - 主要商业产品
      - 部署模式
      - 可支撑的经济性信号
      - 含义
    rows:
      - - NVIDIA
        - 留存来源中没有企业硬件或平台套件的公开标价
        - 加速器加推理软件栈
        - 云、数据中心、OEM 和 AI 工厂部署
        - 厂商声称相较 Hopper，token 成本低 35x，GB300 NVL72 的 tokens/W 高 50x
        - 经济性论证很强，但没有买家特定配置时很难归一化
      - - AMD Instinct
        - 留存来源中没有公开标价
        - PCIe 卡和更大的加速器平台
        - 适配现有机架的企业和 CSP 部署
        - AMD 围绕更低 OPEX、开放软件和大容量 HBM 来定位 MI350
        - 买家需要 OEM 报价和工作负载测试，而不是官网价格
      - - Intel Gaudi
        - 留存来源中没有公开标价
        - Gaudi 3 PCIe 卡和 OEM 系统
        - OEM 主导的本地和混合部署
        - Intel 强调以太网上的高性价比扩展，以及相对 H100 更多的 I/O
        - 采购走 OEM 渠道，而不是自助云定价
      - - Groq
        - 公开用量定价
        - 按 token 计费的 GroqCloud，加上按需申请的 GroqRack
        - 公有、私有、联合云和本地部署
        - Llama 3.3 70B 输出标价为每百万输出 token $0.79；提供免费和开发者计划
        - 在 API 层做直接价格基准时，这是初创厂商里最容易比较的产品
      - - Cerebras
        - 公开自助式按 token 付费定价
        - 推理云，提供免费、开发者和企业层级
        - 公有云 API 和企业合同
        - 开发者可从 $10 起充值，并使用 OpenAI 兼容 API
        - 试点摩擦低，但逐模型经济性仍需工作负载测试
      - - SambaNova
        - 留存来源中，定价大多由销售主导
        - SambaCloud 加 SN50 系统
        - 云、主权服务商和企业部署
        - 公司称 SN50 运行智能体 AI 的成本可比 GPU 低 3x
        - 买家能看到一个全栈替代方案，但看不到官网可直接对照的报价单
      - - Tenstorrent
        - 明确硬件标价
        - 卡、服务器和超集群
        - 开发者工作站和私有数据中心部署
        - 卡起价 $999，Galaxy 系统起价 $70,000
        - 作为芯片厂商透明度异常高，不过落地 TCO 仍取决于集成和工作负载匹配
      - - d-Matrix
        - 留存来源中没有公开标价
        - 推理卡和系统架构
        - 企业数据中心部署
        - 公司强调可适配现有配置的 PCIe 形态，以及相对 H100 的预测，但注明结果可能不同
        - 企业推理适配叙事强，但公开采购可比性弱
      - - 超大规模云厂商 / 定制路径
        - 基础设施成本嵌入云或定制系统预算
        - 云实例、托管服务或定制 XPU 项目
        - 纳入现有云或超大规模云厂商采购
        - AWS 发布客户成本改善；Google 和 Azure 强调每美元性能和全球覆盖
        - 为商用加速器设定实际价格底线和采购捷径
    notes: 这张表把公开 API 或硬件标价，与厂商自述成本主张和仅面向企业的采购分开。缺少广泛可比的公开 ASP，本身就是尽调发现，不是漏了一行。
