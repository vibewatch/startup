  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 类型
      - 公开商业化信号
      - 目标买家
      - 差异化
      - 局限 / 证据缺口
    rows:
      - - NVIDIA
        - 在位全栈推理平台
        - 公开推理平台、NIM 微服务和 Dynamo 栈
        - 超大规模云厂商、新云和把加速 AI 基础设施标准化的企业
        - 软件 + 互联 + 生态栈最深；框架支持广，token 经济性叙事强
        - 锁定风险最高；公开经济性仍高度依赖厂商自行撰写的对比
      - - AMD Instinct
        - 在位 GPU 替代方案
        - MI350 以统一 AI 软件栈定位企业 AI
        - 希望获得开放 GPU 替代方案、且能适配现有机架的企业和 CSP
        - 大容量 HBM、免许可推理微服务、适配现有基础设施的叙事
        - 公开价格透明度低；留存证据主要来自厂商自述
      - - Intel Gaudi
        - 在位以太网 AI 加速器
        - 通过 Dell 和其他 OEM 渠道出货 PCIe 卡
        - 寻求非 NVIDIA 训练 / 推理路径的本地部署和混合部署买家
        - 标准以太网 Fabric、PyTorch / Hugging Face 工作流、迁移工具
        - 云端覆盖和公开定价不如头部对手清晰
      - - Groq
        - 推理优先的 API 与机架厂商
        - 公开 token 定价，并提供免费、开发者和企业计划
        - 优先考虑高速 API 推理的开发者、初创公司和企业
        - 确定性的 SRAM 优先 LPU 设计、风冷、公开价格、GroqRack 选项
        - 专有架构；公开企业生态比 NVIDIA 更薄
      - - Cerebras
        - 晶圆级推理和训练厂商
        - 带公开定价和 API 兼容性的自助式推理云
        - 需要大型开放模型极致速度的模型建设者和企业团队
        - 晶圆级架构、快速多模态推理、低摩擦 API 接入
        - 利用率和功耗取舍很关键；第三方同口径数据仍有限
      - - SambaNova
        - 垂直整合的推理初创公司
        - SambaCloud、SN50 路线图和主权 / 服务商部署
        - 企业、主权云、新云和服务商
        - 全栈云 + 芯片叙事、可见合作伙伴证明、聚焦智能体 AI
        - 经济性和基准大多仍由厂商自述、销售驱动
      - - Tenstorrent
        - 开源芯片厂商
        - 官网公开标价的卡和 Galaxy 服务器
        - 开发者、主权 / 本地部署买家和私有 AI 运营方
        - 开源软件姿态、RISC-V 品牌、明确硬件价格
        - 公开客户证据比云中心竞争对手更薄
      - - d-Matrix
        - 企业推理卡厂商
        - 有官方产品定位，但没有公开标价
        - 寻求 PCIe 推理加速的企业数据中心
        - 以内存为中心的 3DIMC 设计、PCIe 形态、支持最高 100B 参数模型
        - 公开基准、定价和客户证据稀疏
      - - 超大规模云厂商自研芯片
        - 现状替代方案
        - AWS、Google 和 Azure 把推理打包在更大的云合同里销售
        - 单云 AI 团队，以及优先简化采购的买家
        - 原生部署、强背书、全球区域和平台信任
        - 可能加深单云依赖，并降低可迁移性
      - - Marvell 定制芯片
        - 邻近 / 可能入局者
        - 定制 ASIC 和 NVLink Fusion 合作伙伴叙事
        - 建设半定制 AI 工厂的超大规模云厂商和 OEM
        - 定制 XPU 和封装能力，销售动作面向超大规模云厂商
        - 对多数软件团队来说，不是开箱即用的商用芯片选项
    notes: 这些行覆盖最可见的直接对手、在位替代方案、超大规模云厂商替代方案和可能的定制芯片入局者，依据留存的 2026 年来源；商业化信号只是面向公开市场的代理指标，不是经审计的出货数据。
