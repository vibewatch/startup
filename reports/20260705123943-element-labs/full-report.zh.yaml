      - number: '3.2'
        title: 直接供应商与产品权衡
        blocks:
          - type: paragraph
            body: >-
              在被点名的竞争对手中，NVIDIA 仍是默认参照，因为它卖的不只是芯片，而是一整套推理平台。其公开材料强调 token 经济性、框架兼容性、分布式服务和持续软件优化，而这正是年轻对手必须替代的组合。Intel 和
              AMD 的自我定位不同。Gaudi 倚重开放性、以太网互联和 OEM 分发；AMD 倚重企业级部署、开放软件，以及能装进现有机架的高内存加速器。初创公司阵营进一步分化。Groq 是最清晰的 API
              式挑战者：它公开定价，提供免费和开发者计划，采用确定性的 LPU 架构，也支持本地部署。Cerebras 也用 API
              兼容性和自助定价降低应用摩擦，但搭配的是晶圆级硬件，并更强调超高速多模态和智能体式推理。SambaNova 在初创公司中销售最纵向一体化的替代方案，把 RDU 芯片、SambaCloud、主权提供商关系，以及与
              Intel、SoftBank 绑定的新 SN50 路线图组合起来。Tenstorrent 走最透明的硬件网店路径，公开板卡和服务器价格，并释放强烈的开源信号。d-Matrix
              更接近企业加装板卡叙事，强调以内存为中心的推理和对现有数据中心的适配。这些是实质不同的购买主张，不是可以互换的初创公司 logo。
