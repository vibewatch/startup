      - number: '2.5'
        title: 矛盾、尽调缺口与对 Element Labs 的含义
        blocks:
          - type: paragraph
            body: >-
              这些相互矛盾的估计应该被保留，而不是被抹平，因为它们会改变尽调姿态。如果采用最宽的 AI 芯片或推理服务定义，公司看起来像是在追逐一个巨大市场；但一旦剔除训练支出、超大规模云厂商自供，以及不愿离开 Nvidia
              软件栈的买方，外部可触达的商用硬件楔形空间就小得多。最强的开放问题不是推理需求是否存在，而是 Element Labs
              能否展示经过基准测试和客户验证的足够优势，从大型运营方那里赢得重新设计工作。本章没有发现公开的 Element Labs 基准测试、量产客户或部署数据，采信来源也没有用证据隔离出公司专属
              SOM。这并不推翻投资主题，但意味着估值工作应大幅计入执行风险，不能把宽口径市场材料当成这家特定初创公司的已验证收入跑道。
