  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              第一个尽调任务，是先定义市场边界，再引用任何 TAM。Element Labs 的市场边界不是全部 AI
              芯片，甚至也不是全部数据中心加速器。关于公司的公开报道称，它追求的是面向已部署负载的推理处理器，并明确把这一重点与 Habana Labs
              训练时代的使命对比。因此，核心比较集应是已部署模型服务：超大规模云集群、模型提供商基础设施，以及部分边缘或物理 AI 环境，在这些场景中，时延、功耗和带宽都很重要。现状替代品仍是 Nvidia 以 CUDA
              为中心的 GPU 技术栈；Nvidia 巨大的数据中心收入基数显示了其经济权重，其软件护城河也依然异常深。但替代集合已经不止商用 GPU：Google、AWS、Microsoft 和 Meta
              都在推进自研芯片，Intel、AMD 以及其他替代商用供应商也持续用更低成本或更高能效的推理路径做销售。对 Element Labs 而言，现实边界落在三个条件的交叉处：推理密集型负载、愿意把软件从 CUDA
              迁出，以及增量效率能解锁部署而不只是削减运营开支的站点。
