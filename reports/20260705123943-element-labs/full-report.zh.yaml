  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险栈与剩余承销判断
        blocks:
          - type: paragraph
            body: >-
              Element Labs
              的风险画像前置，而不是后置。公开证据支持一个技术野心很高的推理芯片项目；它由一组少见的优秀创始人和大额资本支持。但这些证据还不足以给出投资者通常需要的去风险信号，不能让人有信心承销执行。公开资料里仍没有留存下来的公开基准，没有公开定价，没有点名生产客户，也没有披露毛利率或烧钱数据。这很重要，因为公司已经按一家数十亿美元级
              AI 基础设施竞争者定价。在这个背景下，剩余风险主要由三个相互连接的问题主导：Element
              能否锁定并认证足够的外部制造产能，能否在成本和部署上跑赢现有厂商和创业公司替代方案，能否在下一轮融资或市场周期把证明标准抬高之前同时做到这两点。正面传导是，现有投资者在 2026
              年继续加码，团队也有过往晶圆代工和系统经验。负面传导是，几乎所有关键证明点仍藏在管理层披露背后，而不是放在公开记录里。按投资用途，本章因此把供应链和商业化证明排在纯技术新颖性之前，视为最重要的剩余风险。
