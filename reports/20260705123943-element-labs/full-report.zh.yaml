  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 推理成本快速下降
        - 驱动
        - 当前 / 持续
        - 单 token 成本下降，会扩大可落地工作负载，也给替代硬件留出更大空间
        - 验证 Element Labs 能否把硬件效率转化为可见的单 token 成本节省
      - - 智能体 AI 和物理 AI 工作负载增长
        - 驱动
        - 近期
        - 多步骤、常驻型工作负载增加，推理服务需求会超出一次性聊天场景
        - 询问 Element Labs 优先瞄准哪些工作负载类别，以及理由
      - - 电力和互联限制
        - 约束
        - 当前至 2030 年
        - 为了塞进现有容量，站点可能会选择密度更高或效率更高的推理硬件
        - 要求提供客户证据，证明电力是采购门槛，而不是营销主题
      - - CUDA 生态锁定
        - 约束
        - 当前 / 持续
        - 替代硬件必须跨过迁移风险、工具缺口和组织惯性
        - 要求提供软件兼容性证明、迁移负担和基准可复现性
      - - 超大规模云厂商用定制 ASIC 自供
        - 约束
        - 当前 / 持续
        - 大买家可能在内部解决推理成本问题，而不是采购商用芯片
        - 澄清 Element Labs 是向仍需要外部供应商的运营方销售芯片、系统，还是拿设计导入机会
      - - 晶圆、封装和冷却瓶颈
        - 约束
        - 当前 / 持续
        - 即使需求真实，供给约束也会拖慢爬坡
        - 询问晶圆厂产能、封装计划和冷却假设
      - - 出口管制波动
        - 约束
        - 当前 / 持续
        - 规则变化会让区域需求规划和客户资格筛查更复杂
        - 明确梳理目标区域和合规假设
      - - 从试点到生产的 ROI 疑虑
        - 约束
        - 近期
        - 许多 AI 项目在规模化前卡住，从而推迟硬件更新决策
        - 要求证明目标工作负载已经达到生产规模，并有预算权限
      - - 边缘端功耗包络有利于高效推理服务
        - 驱动
        - 近期
        - 低功耗推理可以打开那些不值得部署超大规模 GPU 占用的工作负载
        - 验证 Element Labs 是否有具体的边缘端或本地数据中心路线图，而不只是超大规模野心
    notes: 几个因素会双向作用：增长创造需求，但同样的复杂度也会拖慢采用，或压缩愿意重构推理服务栈的买家范围。
