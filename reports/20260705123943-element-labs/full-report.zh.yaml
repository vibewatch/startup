              对这样一家保密程度很高的公司来说，Element Labs 的资本故事异常强，但公开的所有权可见度仍然很低。第一轮有清晰文件支撑的机构融资，是 2025 年 4 月的 Series A：$50
              million，估值约 $500 million，由 Fidelity 领投，Atreides 参投。更早的报道称，公司此前主要靠创始人资金，并获得 Manuel Alba-Marquez
              的早期支持。第二个重大资本拐点出现在 2026 年 6 月，Globes 及相互印证的二级来源报道，现有投资人又投入约 $300-400 million，估值超过 $4 billion。Startup
              Nation Central 现在概括称，公司三轮融资合计 $400 million，来自六家投资人；Globes 另引 PitchBook 称，融资前公司已融约 $130 million，2025 年估值约
              $1.1 billion。这些数字指向同一方向——估值快速抬升、机构背书很强——但还不足以还原精确股权结构。本报告留存语料中，公开点名的投资人仍然有限；本章也没有证实 Bessemer 或 Intel
