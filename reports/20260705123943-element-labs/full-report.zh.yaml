        title: 客户工作流与产品定义
        blocks:
          - type: paragraph
            body: >-
              Element Labs 最适合被理解为一家试图把 AI 推理推近使用时刻的公司，而不是泛泛的 AI
              芯片初创公司。采信来源反复称，公司正在为模型训练之后的阶段打造处理器：已部署系统必须回答提示、分类图像、运行自然语言流水线，并且越来越多地协调 AI 智能体任务。用工作流语言说，买方购买的不只是原始
              FLOPS。买方想降低在大规模请求机群上服务已训练模型的成本、时延和功耗负担。这也解释了为什么多份来源把公司放在较小、本地或分布式数据中心，而不只放在巨型集中式训练集群中。公开叙事还指出，可能买方包括企业和 IT
              数据中心运营方，以及希望为生产推理找到可信 Nvidia 中心化基础设施替代方案的超大规模或模型开发客户。
