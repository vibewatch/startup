  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sku-disclosure
    missingEvidence: Public confirmation of product family names, SKU map, and first-generation part numbers, including whether any Octopus branding is real or only market rumor.
    whyItMatters: Underwriting product strategy is difficult when the market cannot distinguish one chip generation, server SKU, or software release from another.
    diligencePath: Request a confidential product catalog, roadmap deck, and customer-facing naming convention, then tie each item to tape-out and release status.
    relatedQuestionRefs:
    - QE006
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: manufacturing-architecture
    missingEvidence: Process node, package type, memory architecture, chiplet topology, and supplier chain beyond the single public TSMC tape-out reference.
    whyItMatters: Those details determine yield risk, cost structure, power profile, and whether the stated inference-economics thesis is technically plausible.
    diligencePath: Review design reviews or architecture briefs under NDA and request foundry, packaging, and memory partner confirmations tied to the first product generation.
    relatedQuestionRefs:
    - QE011
    - QE012
    - QE013
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: material
    topic: benchmarks-and-customers
    missingEvidence: Independent benchmark results, named production deployments, or customer references for latency, throughput, power, and cost per token.
    whyItMatters: Without external proof, the core differentiation story remains reputation-led and cannot be translated into customer ROI or competitive win probability.
    diligencePath: Request benchmark methodology, third-party test reports, and at least two customer references tied to live or pilot inference deployments.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE002
    - TE005
  - type: missing-source
    severity: material
    topic: trust-and-compliance
    missingEvidence: Security certifications, privacy or export-control scope, vulnerability-response process, trust-center materials, and any AI safety or model-governance controls.
    whyItMatters: Large cloud and enterprise buyers need operational trust evidence before deploying infrastructure that runs sensitive workloads or agentic automation.
    diligencePath: Ask management for SOC or ISO documentation, security program ownership, export-control analysis, and a public or private trust-center package.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: support-and-reliability
    missingEvidence: Uptime or SLA commitments, RMA or warranty policy, field failure data, observability tooling, and framework or SDK support documentation.
    whyItMatters: Infrastructure products fail on deployment and support discipline as often as they fail on raw silicon performance.
    diligencePath: Request customer-support runbooks, reliability dashboards, on-call coverage, software release process, and integration guides for target frameworks.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: conflicting-data
    severity: minor
    topic: directory-metadata
    missingEvidence: Authoritative confirmation of headquarters, founding year, and any non-Israeli operating entities to resolve low-tier directory mismatches.
    whyItMatters: Directory inconsistencies are not fatal, but they reduce confidence in third-party metadata that investors often use for fast screening.
    diligencePath: Reconcile GLEIF, Israeli registry, and company-provided legal-entity documents against each external profile before using aggregator data in the IC memo.
    relatedQuestionRefs:
    - QE025
