tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User / buyer
  - Status / maturity
  - Differentiation angle
  - Diligence gap
  rows:
  - - Inference processor
    - Cloud and enterprise inference operators
    - Core function clearly disclosed; no public SKU
    - Inference-first economics versus training-oriented GPU stacks
    - Need benchmark, model support, memory design, and release status
  - - Communication chips / fabric
    - Dense clusters and multi-rack deployments
    - Disclosed in product vision and June 2026 architecture story
    - Treats interconnect as part of the product, not just a dependency
    - No published topology, bandwidth, or standards support
  - - Graphics processor component
    - End-to-end system buyers needing broader compute coverage
    - Mentioned in January 2025 product vision only
    - Suggests broader system ambition than a single ASIC
    - No proof it exists beyond plan-level disclosure
  - - Control software layer
    - Operators integrating silicon, servers, and networks
    - Disclosed conceptually; no public docs or SDK
    - Software manages communication network and AI processing together
    - Need framework, compiler, observability, and release evidence
  - - Server structure / rack design
    - Hyperscalers, model builders, and neocloud operators
    - Publicly surfaced in June 2026
    - Positions Element as a systems architect, not only a chip vendor
    - No chassis, rack-density, or thermal-design disclosure
  - - Foundry / tape-out program
    - Internal product team and supply chain
    - Public milestone through TSMC tape-out note
    - Shows product progress beyond slideware
    - Node, package, yield, and packaging partners undisclosed
  notes: Rows capture only modules explicitly disclosed or strongly implied in retained public sources. Missing fields mark genuine disclosure gaps rather than omitted analysis.
