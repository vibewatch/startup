  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in operating model
  - Known dependency
  - Primary risk
  rows:
  - - Inference silicon
    - Executes trained-model workloads after training is complete
    - Fabless manufacturing path and memory/package choices
    - No public proof of performance or cost advantage
  - - Communication fabric
    - Connects dense AI clusters and multiple server racks
    - Internal chip design plus external standards or packaging choices
    - Interconnect bottlenecks could erase silicon gains
  - - System software
    - Manages AI processing and communication network behavior
    - Compiler, runtime, observability, and scheduling stack not disclosed
    - Software immaturity can block deployment even if silicon works
  - - Server structure
    - Packages chips into deployable infrastructure for buyers
    - Thermal design, board design, and systems integration
    - No public disclosure on rack density, cooling, or field service
  - - Foundry / tape-out
    - Turns first chip series into physical silicon
    - TSMC publicly named in April 2025 only
    - Yield, schedule, and cost risks remain opaque
  - - Deployment footprint
    - Places inference capacity in smaller or local data centers
    - Customer facilities, operators, and integration partners
    - No named deployment partners or integration stories
