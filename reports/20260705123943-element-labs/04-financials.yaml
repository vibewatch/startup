- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - First tape-out cost
    - Tens of millions of dollars per design; repeat cost if first silicon fails
    - High
    - Defines minimum capital required before production revenue appears
    - Request actual node, mask-set budget, and planned respin reserve
  - - Full leading-edge chip development cost
    - Hundreds of millions of dollars; published 5nm estimates span roughly $280M to $542M
    - Medium
    - Sets the cash burden for silicon, tools, software, and validation before scale
    - Ask for cumulative program spend by design, software, and validation workstream
  - - Sub-7nm development timeline
    - Public industry range of roughly 24-30 months
    - Medium
    - Long cycles delay revenue recognition and extend financing dependence
    - Request milestone plan from architecture freeze through production qualification
  - - Annual Caesarea rent proxy
    - Close to NIS 8M on 8,000 square meters
    - High
    - Provides a measurable fixed-cost floor but is small relative to silicon R&D intensity
    - Verify full facilities footprint across Caesarea, Tel Aviv, and contractors
  - - Primary buyer value metric
    - Cost per token, tokens per watt, and throughput
    - High
    - These metrics drive whether buyers can justify switching from Nvidia-centric stacks
    - Request customer benchmark deck with throughput, latency, power, and TCO versus incumbent alternatives
  - - Packaging / HBM sensitivity
    - Likely material for any modern AI accelerator; CoWoS and HBM increase cost and supply risk
    - Medium
    - Packaging can compress gross margin even if silicon performance is strong
    - Ask whether first generation uses HBM, CoWoS, chiplets, or simpler packaging
  - - Gross margin
    - Not publicly disclosed
    - None
    - Gross margin determines whether the company can finance follow-on node transitions internally
    - Obtain stream-level gross margin and yield assumptions from management accounts
  notes: This table mixes company-specific public facts with industry cost benchmarks that frame what a stealth inference-chip startup is likely up against. Null or undisclosed entries are deliberate and should be treated as diligence blockers rather than missing spreadsheet work.
