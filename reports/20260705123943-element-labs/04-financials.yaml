- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Value / status
  - Confidence
  - Risk / implication
  - Diligence ask
  rows:
  - - April 2025 Series A
    - $50M at an estimated $500M valuation
    - High
    - Provided first institutional capital but was aimed at first-silicon progress rather than scaled commercialization
    - Verify exact close date, security terms, and liquidation preferences
  - - Lead investors publicly named
    - Fidelity and Atreides
    - High
    - Adds sponsor quality and follow-on capacity, but not operating proof
    - Request full investor list and board rights
  - - Capital before June 2026 round
    - ~$130M according to PitchBook as cited by Globes
    - Medium
    - Sets the base from which the follow-on round should be evaluated
    - Confirm whether this number includes founder money, angels, and any unannounced bridge financing
  - - June 2026 financing
    - $300-400M from existing investors at >$4B valuation
    - High
    - Substantially extends survivability for a capital-intensive chip program
    - Request exact round size, close status, and tranche schedule
  - - Public total-raised figure
    - $400M across 3 rounds from 6 investors (Finder)
    - Medium
    - Does not fully reconcile with Globes plus PitchBook, so cap-table precision is still missing
    - Reconcile round-by-round proceeds and investor counts against the company ledger
  - - Cash on hand
    - Not publicly disclosed
    - None
    - Prevents a defensible runway calculation
    - Obtain latest balance sheet and unrestricted cash balance
  - - Monthly burn and runway
    - Not publicly disclosed
    - None
    - Financing dependency cannot be converted into months of runway
    - Request trailing 12-month monthly cash flow and management runway plan
  - - Debt / project-finance obligations
    - No public obligation identified in retained sources
    - Medium
    - Could still exist privately; absence of evidence is not proof of zero leverage
    - Confirm any venture debt, purchase commitments, or foundry prepayment obligations
  notes: 'The public record is strong on equity fundraising headlines and weak on balance-sheet detail. Capital adequacy therefore remains directional: the company looks well funded for its stage, but exact liquidity and financing structure are still private.'
