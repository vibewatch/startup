- id: public-traction-versus-private-data-gaps
  title: Public Traction Versus Private-Data Gaps
  body: 'Public traction signals are real, but they are operational rather than commercial. By April 2025, Globes already described more than 100 employees; by October 2025, Globes and Calcalistech both put the company around 200 employees and linked it to the former Habana campus in Caesarea; and by June 2026, Globes estimated about 350 employees plus several hundred outsourced contractors. Finder still reports a lower 51-200 band while also stating $400 million raised across three rounds from six investors. Those are meaningful scale indicators for a company that only surfaced publicly in 2024. But the missing commercial dataset is much larger than the visible one. No retained source discloses revenue, ARR, named customers, deployment utilization, gross margin, realized pricing, or customer concentration. The Israeli registry path is also shallow for open-web analysis: the government portal offers only free basic information or a paid full extract, and registry-adjacent data vendors say
    fuller legal and financial reports sit behind purchased products. The result is a familiar stealth-hardware asymmetry: public sources show capital formation and hiring momentum, but not the evidence needed to convert that momentum into a revenue-quality or margin-confidence judgment.'
