  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing
    missingEvidence: Executed customer contracts or commercial proposals showing system ASP, any NRE fee, software treatment, discounts, milestones, and support terms.
    whyItMatters: Without actual price realization, it is impossible to test revenue quality, payback, or gross margin assumptions.
    diligencePath: Request the first three signed customer contracts and a quote-to-order bridge under NDA.
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Named customers, booked backlog, and revenue concentration by top account.
    whyItMatters: A stealth chip company can look funded while still depending on one or two undeclared design-in programs.
    diligencePath: Ask management for a pipeline and concentration schedule with customer names redacted if needed.
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, cash flow, and board runway plan after the June 2026 round.
    whyItMatters: Capital adequacy cannot be converted into months of runway or next-round timing without liquidity and burn data.
    diligencePath: Obtain the latest balance sheet plus trailing 12-month monthly cash flow and management runway forecast.
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-cogs
    missingEvidence: Product-level COGS, packaging and foundry cost assumptions, yield data, and gross margin by revenue stream.
    whyItMatters: Margin path is the core underwriting variable for a fabless AI-chip startup and is completely absent from public data.
    diligencePath: Request a gross-margin bridge from wafer and package cost through support burden for the first commercial product.
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: foundry-commitments
    missingEvidence: Any TSMC or OSAT prepayment, minimum-volume, or reservation obligations attached to the first production cycle.
    whyItMatters: Manufacturing commitments can absorb cash well before revenue ramps and may explain financing dependency.
    diligencePath: Review foundry and packaging commitment letters, reservation agreements, or procurement schedules.
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: access-blocked
    severity: material
    topic: cap-table-and-filings
    missingEvidence: Full registry extract, shareholder detail, director roster, and any filed security interests or paid financial statements.
    whyItMatters: Open-web sources only show basic entity facts, leaving governance, ownership, and hidden financing structure opaque.
    diligencePath: Purchase the Israeli registry extract and reconcile it with investor documents and board materials.
    relatedTableRefs:
    - TI004
    - TI005
