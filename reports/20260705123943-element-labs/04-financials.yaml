- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Realized pricing and discount schedule
    - Without realized ASPs and milestone terms, revenue quality and payback cannot be modeled
    - Request executed customer contracts or quote-to-order history for first deployments
  - - Named customers and concentration
    - Without customer identity and concentration, durability and counterparty risk are unknowable
    - Request top-customer list, booked pipeline, and percent of revenue tied to each account
  - - Gross margin by product or contract
    - Without gross margin, there is no way to test whether the company can self-fund future silicon generations
    - Request product-level COGS, yield, packaging cost, and gross-margin bridge
  - - Cash balance, burn, and runway
    - Without liquidity and burn, capital adequacy remains a narrative instead of a calculation
    - Obtain monthly cash flow, current cash balance, and board-approved runway plan
  - - Foundry and packaging commitments
    - Hidden prepayments or capacity reservations could absorb more cash than the equity headlines imply
    - Request TSMC / OSAT commitment schedule, minimum volumes, and any prepayment obligations
  - - Utilization, benchmarks, and deployment volume
    - Without throughput and live-utilization evidence, pricing power and support burden cannot be tested
    - Request benchmark deck, pilot utilization data, and deployment expansion schedule
  notes: This table is intentionally exhaustive within the material open-web gaps identified for this chapter as of 2026-07-05. Each row is a gating diligence item for revenue quality, margin path, or runway underwriting.
  enumerationScope:
    coverage: exhaustive
    basis: Table enumerates the material public-data gaps identified during this chapter review as of 2026-07-05 rather than the company's internal reporting universe.
