  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-accelerator-pricing
    missingEvidence: Comparable realized ASPs, discounts, minimum commitments, and support fees for NVIDIA, AMD, Intel, SambaNova, d-Matrix, and custom-silicon programs are not public in the retained source set.
    whyItMatters: Without realized pricing rather than public claims or list cards, it is impossible to compare true token economics or gross-margin headroom across serious enterprise alternatives.
    diligencePath: Request live quotes, committed-use terms, and delivered TCO models for a common 70B and 405B inference workload across at least NVIDIA, Groq, Cerebras, SambaNova, and one hyperscaler substitute.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: element-benchmark-and-software-proof
    missingEvidence: No retained public source shows Element Labs benchmarks, compiler/runtime evidence, API surface, or named production deployments that can be compared directly with peers.
    whyItMatters: The competitive question is not whether alternatives exist—they clearly do—but whether Element can prove a system-level advantage against them.
    diligencePath: Ask Element for benchmark methodology, software stack architecture, migration tooling, and at least two production or pilot reference deployments with workload details.
    relatedQuestionRefs:
    - QP024
  - type: conflicting-data
    severity: material
    topic: benchmark-comparability
    missingEvidence: A common third-party benchmark pack across NVIDIA, AMD, Intel, Groq, Cerebras, SambaNova, Tenstorrent, d-Matrix, and Element is not available in the retained evidence.
    whyItMatters: Vendor-authored speed and cost claims are directionally useful but not enough to underwrite moat durability because they use different models, contexts, concurrency assumptions, and price bases.
    diligencePath: Run a buyer-specific benchmark bake-off with identical models, prompts, concurrency, accuracy targets, and energy instrumentation, then reconcile the results against MLPerf or equivalent methodology where possible.
    relatedQuestionRefs:
    - QP020
  - type: private-evidence-only
    severity: material
    topic: supply-allocation-and-volume
    missingEvidence: Delivered wafer allocation, packaging capacity, lead times, and actual 2026 shipment volumes for startup vendors and custom-silicon programs are not public here.
    whyItMatters: A startup can appear competitive on architecture but still lose on supply access, especially when incumbents or hyperscalers absorb the most attractive foundry and packaging capacity.
    diligencePath: Request foundry relationships, packaging partners, booked capacity, and committed customer volumes for Element and the closest custom-silicon alternatives.
    relatedQuestionRefs:
    - QP018
    - QP019
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-competitor-map
    missingEvidence: The chapter covers the most visible vendors and substitute classes but not every long-tail accelerator startup, neocloud stack, or internal hyperscaler project.
    whyItMatters: The long tail is unlikely to change the overall conclusion, but it could matter for one or two niche sovereign or edge procurement contexts.
    diligencePath: Extend the competitor list during live diligence only after clarifying the target customer profile—hyperscaler, sovereign cloud, enterprise private AI, or developer platform.
    relatedQuestionRefs:
    - QP005
    relatedTableRefs:
    - TP001
