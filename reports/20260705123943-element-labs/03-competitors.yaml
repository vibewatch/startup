- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Specialized inference architecture creates a durable performance wedge
    - Workload-specific tradeoffs mean no architecture wins every batch size, sequence length, or model regime
    - High
    - Independent xPU-athalon analysis says platform advantage varies materially by workload
    - Request Element workload-level benchmarks against NVIDIA, Groq, Cerebras, and hyperscaler substitutes
  - - Full-stack software can protect pricing power
    - NVIDIA already combines silicon, software, and interconnect more deeply than Element has publicly shown
    - High
    - NIM, Dynamo, TensorRT-LLM, and NVLink Fusion all widen NVIDIA’s control plane
    - Ask for Element compiler, runtime, orchestration, and migration tooling evidence
  - - Inference-first startups can stay niche while still vulnerable to incumbents
    - High idle power or weaker tooling can erode headline efficiency gains outside ideal utilization
    - High
    - xPU-athalon highlights idle-power and programmability penalties for several novel accelerators
    - Test utilization assumptions and deployment complexity in real customer environments
  - - Cloud APIs lower trial friction for alternative silicon
    - Public APIs from Groq and Cerebras can win developer mindshare before a buyer ever evaluates new racks
    - Medium-High
    - Groq and Cerebras expose self-serve usage paths while many merchant rivals remain sales-led
    - Ask whether Element will sell via API, hardware, or custom systems and how fast pilots can start
  - - Sovereign and private-AI demand could support differentiated vendors
    - The same need also benefits Tenstorrent, SambaNova, GroqRack, and hyperscaler regional offerings
    - Medium
    - Multiple peers already market on-prem, sovereign, or air-gapped options
    - Validate whether Element has unique data-sovereignty or private-cluster advantages
  - - Custom silicon is a future entrant class, not just an adjacent supplier
    - Hyperscalers may prefer semi-custom XPU programs with vendors already tied into NVIDIA ecosystems
    - High
    - Marvell markets custom XPU and HBM capability and now plugs into NVLink Fusion
    - Pressure-test whether Element is selling merchant silicon, custom systems, or a semi-custom design service
  notes: Severity measures risk to Element’s eventual pricing power and win rate, not the probability that any one competitor fails. Each row is a diligence hypothesis grounded in retained public evidence rather than a forecast of vendor survival.
