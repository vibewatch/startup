tables:
- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor / class
  - Category
  - Public commercialization signal
  - Target buyer
  - Differentiation
  - Limitation / evidence gap
  rows:
  - - NVIDIA
    - Incumbent full-stack inference platform
    - Public inference platform, NIM microservices, and Dynamo stack
    - Hyperscalers, neoclouds, and enterprises standardizing on accelerated AI infrastructure
    - Deepest software + interconnect + ecosystem stack; broad framework support and strong token-economics messaging
    - Highest lock-in risk; public economics still rely heavily on vendor-authored comparisons
  - - AMD Instinct
    - Incumbent GPU alternative
    - MI350 enterprise AI positioning with unified AI software stack
    - Enterprises and CSPs wanting an open GPU alternative that fits current racks
    - Large HBM, no-license inference microservices, existing-infrastructure story
    - Public price transparency is low and retained evidence is mainly vendor-authored
  - - Intel Gaudi
    - Incumbent Ethernet AI accelerator
    - Shipping PCIe card via Dell and other OEM channels
    - On-prem and hybrid buyers seeking a non-NVIDIA training/inference path
    - Standard Ethernet fabrics, PyTorch/Hugging Face workflow, migration tooling
    - Cloud footprint and public pricing are less visible than top rivals
  - - Groq
    - Inference-first API and rack vendor
    - Public token pricing plus free/developer/enterprise plans
    - Developers, startups, and enterprises prioritizing fast API inference
    - Deterministic SRAM-first LPU design, air cooling, public prices, GroqRack option
    - Proprietary architecture and thinner public enterprise ecosystem than NVIDIA
  - - Cerebras
    - Wafer-scale inference and training vendor
    - Self-serve inference cloud with public pricing and API compatibility
    - Model builders and enterprise teams needing extreme speed for large open models
    - Wafer-scale architecture, fast multimodal inference, low-friction API entry
    - Utilization and power tradeoffs matter; third-party apples-to-apples data remain limited
  - - SambaNova
    - Vertically integrated inference startup
    - SambaCloud, SN50 roadmap, and sovereign/provider deployments
    - Enterprises, sovereign clouds, neoclouds, and service providers
    - Full-stack cloud plus chip story, visible partner proof, agentic-AI focus
    - Economics and benchmarks remain mostly vendor-authored and sales-led
  - - Tenstorrent
    - Open-source silicon vendor
    - Priced cards and priced Galaxy servers on the public website
    - Developers, sovereign/on-prem buyers, and private AI operators
    - Open-source software posture, RISC-V branding, explicit hardware pricing
    - Public customer proof is thinner than cloud-centric competitors
  - - d-Matrix
    - Enterprise inference card vendor
    - Official product positioning without public list pricing
    - Enterprise data centers seeking PCIe-based inference acceleration
    - Memory-centric 3DIMC design, PCIe form factor, models up to 100B parameters
    - Sparse public benchmark, pricing, and customer evidence
  - - Hyperscaler in-house silicon
    - Status-quo substitute
    - AWS, Google, and Azure sell inference inside broader cloud contracts
    - Single-cloud AI teams and buyers optimizing for procurement simplicity
    - Native deployment, strong referenceability, global regions, and platform trust
    - Can deepen single-cloud dependence and reduce portability
  - - Marvell custom silicon
    - Adjacent / likely entrant
    - Custom ASIC and NVLink Fusion partnership messaging
    - Hyperscalers and OEMs building semi-custom AI factories
    - Custom XPU and packaging capability with hyperscaler-facing sales motion
    - Not a turnkey merchant chip option for most software teams
  notes: Rows cover the most visible direct peers, incumbent alternatives, hyperscaler substitutes, and likely custom-silicon entrants evidenced by retained 2026 sources; commercialization signals are public-facing proxies, not audited shipment data.
  enumerationScope:
    coverage: partial
    basis: The table covers the most visible inference vendors and substitute classes found in retained public sources as of 2026-07-05 rather than every long-tail accelerator startup or internal hyperscaler project.
