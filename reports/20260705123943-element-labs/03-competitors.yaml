- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Vendor / class
  - Public pricing posture
  - Primary commercial offer
  - Deployment mode
  - Supportable economics signal
  - Implication
  rows:
  - - NVIDIA
    - No retained public list price for enterprise hardware or platform bundles
    - Accelerators plus inference software stack
    - Cloud, data center, OEM, and AI-factory deployments
    - Vendor claims 35x lower token cost vs Hopper and 50x tokens/W on GB300 NVL72
    - Economic case is powerful but hard to normalize without a buyer-specific configuration
  - - AMD Instinct
    - No retained public list price
    - PCIe cards and larger accelerator platforms
    - Existing-rack enterprise and CSP deployments
    - AMD frames MI350 around lower OPEX, open software, and large HBM
    - Buyers need OEM quotes and workload tests rather than website prices
  - - Intel Gaudi
    - No retained public list price
    - Gaudi 3 PCIe card and OEM systems
    - OEM-led on-prem and hybrid deployments
    - Intel stresses cost-effective scaling on Ethernet and more I/O versus H100
    - Procurement runs through OEM channels, not self-serve cloud pricing
  - - Groq
    - Public usage pricing
    - Token-billed GroqCloud plus GroqRack by request
    - Public, private, co-cloud, and on-prem
    - Llama 3.3 70B output is listed at $0.79 per million output tokens; free and developer plans exist
    - Easiest startup-vendor offer for direct price benchmarking at the API layer
  - - Cerebras
    - Public self-serve pay-per-token pricing
    - Inference cloud with free, developer, and enterprise tiers
    - Public cloud API and enterprise contracts
    - Developers can add funds starting at $10 and use OpenAI-compatible APIs
    - Low-friction pilot path, but model-by-model economics still need workload testing
  - - SambaNova
    - Pricing mostly sales-led in retained sources
    - SambaCloud plus SN50 systems
    - Cloud, sovereign provider, and enterprise deployments
    - Company claims SN50 can run agentic AI at 3x lower cost than GPUs
    - Buyers get a visible full-stack alternative, but not a website-grade price card
  - - Tenstorrent
    - Explicit hardware list prices
    - Cards, servers, and superclusters
    - Developer workstations and private data-center deployments
    - Cards start at $999 and Galaxy systems at $70,000
    - Exceptionally transparent for a chip vendor, though delivered TCO still depends on integration and workload fit
  - - d-Matrix
    - No retained public list price
    - Inference cards and system architecture
    - Enterprise data-center deployments
    - Company emphasizes existing-config PCIe fit and H100-relative projections, but notes results may vary
    - Strong fit messaging for enterprise inference, weak public procurement comparability
  - - Hyperscaler / custom path
    - Infrastructure cost is embedded in cloud or custom-system budgets
    - Cloud instances, managed services, or custom XPU programs
    - Inside existing cloud or hyperscaler procurement
    - AWS publishes customer cost improvements; Google and Azure emphasize performance-per-dollar and global reach
    - Sets the practical price floor and procurement shortcut under merchant accelerators
  notes: This table separates public API or hardware list prices from vendor-authored cost claims and enterprise-only procurement. The lack of broadly comparable public ASPs is itself a diligence finding, not a missing row.
