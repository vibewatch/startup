- id: capital-base-investors-and-ownership-visibility
  title: Funding History, Investor Visibility, and Ownership Gaps
  body: 'Element Labs’ capital story is unusually strong for such a secretive company, but public ownership visibility is
    still thin. The first clearly documented institutional round is the April 2025 Series A: $50 million at an estimated $500
    million valuation, led by Fidelity with participation from Atreides. Earlier coverage says the company had previously
    been financed mainly by founders’ money together with early support from Manuel Alba-Marquez. The second major capital
    inflection came in June 2026, when Globes and corroborating secondary sources reported another roughly $300-400 million
    from existing investors at a valuation above $4 billion. Startup Nation Central now summarizes the company at $400 million
    raised across three rounds from six investors, while Globes separately cited PitchBook for a pre-round figure of about
    $130 million raised and a 2025 valuation around $1.1 billion. Those numbers point in the same direction—rapid valuation
    escalation and strong institutional sponsorship—but they are not precise enough to reconstruct the exact cap table. Publicly
    named investors in the retained corpus remain limited, and this chapter does not corroborate Bessemer or Intel Capital
    participation.'
