  title: Valuation has outrun public disclosure
  body: By June 2026 the company had a multibillion-dollar valuation, but the retained source set still does not disclose
    revenue, customer names, detailed governance, or benchmark data. That leaves underwriting confidence materially below
    the headline financing signal.
  claimRefs:
