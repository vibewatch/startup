- id: scale-signals-milestones-and-adverse-considerations
  title: Scale Signals, Milestones, and Adverse Considerations
  body: 'Public scale signals exist, but they are directional rather than audit-grade. Globes described Element Labs as having
    more than 100 employees in April 2025, about 200 employees when it leased the former Habana site in October 2025, and
    roughly 350 employees plus outsourced contractors by June 2026; data platforms still show a lower 51-200 band. That progression
    is consistent with a rapidly scaling semiconductor startup, yet the company has not disclosed an official headcount, revenue,
    ARR, gross margin, or customer count. The milestone record is clearer than the economics: incorporation in May 2024, stealth
    emergence in August 2024, strategy becoming visible in January 2025, Series A in April 2025, the Caesarea campus lease
    in October 2025, and the June 2026 step-up round at a $4 billion-plus valuation. The strongest adverse read-through is
    not scandal but opacity. Despite multibillion-dollar pricing, retained public sources still do not offer product benchmarks,
    production customer names, or detailed governance disclosures. A second diligence caution is that the core team comes
    from Habana Labs, whose post-acquisition collapse inside Intel was described by multiple outlets as a rare blemish on
    Willenz’s record.'
