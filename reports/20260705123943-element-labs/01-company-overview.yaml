- id: founders-leadership-and-key-person-dependence
  title: Founders, Leadership, and Key-Person Dependence
  body: 'Public leadership visibility is concentrated almost entirely around three people: Avigdor Willenz, David Dahan, and
    Ran Halutz. Early founding coverage identified Dahan as CEO and Halutz as the senior development leader, while independent
    trade coverage described Willenz as chairman and the repeat entrepreneur backing the venture. That structure matters because
    Element Labs is raising capital and recruiting talent on the strength of founder reputation well before any public product
    launch. Willenz’s career history across Galileo, Annapurna Labs, and Habana Labs is a real asset for investor access,
    foundry relationships, and customer doors, but it also makes the company unusually exposed to one individual’s network
    and judgment. Dahan and Halutz reduce some of that risk because they bring the operating and R&D credibility of the Habana
    founding team, yet the broader executive bench, board committees, and board composition remain mostly undisclosed. Retained
    public sources also consistently name only these three founders; they do not surface Linor Saadia in a founder or executive
    role, so that attribution should be treated as unverified in this chapter.'
