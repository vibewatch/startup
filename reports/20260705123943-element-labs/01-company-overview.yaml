  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: A company-approved financing history showing every round, exact amounts, instrument types, and post-money
      valuations.
    whyItMatters: Current public sources point in the same direction but do not reconcile to one exact lifetime capital number,
      which weakens precision on dilution and valuation-step-up analysis.
    diligencePath: Request the board-approved financing schedule and cap table from management or lead investors, then reconcile
      against Series A and June 2026 press coverage.
    relatedQuestionRefs:
    - QO015
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, margin, burn, runway, and any management forecast for production ramp.
    whyItMatters: A multibillion-dollar private valuation cannot be underwritten confidently without basic operating economics,
      especially for a capital-intensive semiconductor company.
    diligencePath: Request the latest management reporting pack, monthly KPI dashboard, and current budget versus actuals
      from management.
    relatedQuestionRefs:
    - QO017
  - type: private-evidence-only
    severity: material
    topic: customer-validation
    missingEvidence: Named design partners, pilot customers, benchmark results, and evidence of production deployments or
      commercial commitments.
    whyItMatters: Without customer names or benchmark proof, it is impossible to judge whether the product is merely promising
      architecture or already validated commercial silicon.
    diligencePath: Request a customer-reference list, signed design-win summary, benchmark deck, and tape-out roadmap tied
      to commercial milestones.
    relatedQuestionRefs:
    - QO018
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-investor-map
    missingEvidence: A current board roster, committee map, observer list, and full cap table with investor rights and ownership
      percentages.
    whyItMatters: Founder concentration may be appropriate, but investors cannot assess control, reserved matters, or follow-on
      leverage from the public record alone.
    diligencePath: Request the current cap table, board consents, shareholder agreement summary, and latest financing documents
      from counsel or lead investors.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
