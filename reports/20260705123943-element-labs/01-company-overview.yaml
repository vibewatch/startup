  title: Founder credibility is real even without public product proof
  body: Willenz, Dahan, and Halutz are not first-time founders. Their prior exits and Habana operating history explain why
    Fidelity and other investors were willing to underwrite aggressive private valuations before Element Labs built a conventional
    public-facing company surface.
  claimRefs:
