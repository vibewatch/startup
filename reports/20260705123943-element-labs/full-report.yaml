  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              Element Labs is not competing in a clean one-vendor lane. The public story around the company describes an
              inference-first system ambition aimed at hyperscalers, model builders, neoclouds, and other operators
              looking for an alternative to NVIDIA-centric infrastructure. That means the relevant peer set is broader
              than venture-backed inference ASIC startups. It includes at least five overlapping solution classes. First
              is the dominant incumbent stack: NVIDIA hardware plus NIM, Dynamo, TensorRT-LLM, and the surrounding CUDA-
              and NVLink-centered ecosystem. Second are incumbent alternatives that promise lower lock-in or easier fit
              with existing infrastructure, especially AMD Instinct and Intel Gaudi. Third are inference-first startups
              such as Groq, Cerebras, SambaNova, Tenstorrent, and d-Matrix, each of which tries to pair a specialized
              architecture with cloud APIs, racks, cards, or private deployments. Fourth are hyperscaler substitutes
              including AWS Inferentia, Google TPU, and Azure AI infrastructure, which let buyers solve the job inside
              an existing cloud contract. Fifth are adjacent custom-silicon suppliers such as Marvell, which matter
              because hyperscalers can increasingly pursue semi-custom AI infrastructure rather than buy a merchant
              accelerator off the shelf. The implication for diligence is simple: Element must beat not just one chip,
              but entire deployment pathways with different switching costs and procurement motions.
            claimRefs:
