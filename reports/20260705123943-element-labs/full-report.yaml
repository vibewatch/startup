      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Adoption is segmented far more by operating model than by model class. Hyperscalers and frontier model
              providers are the clearest direct buyers because they design or lease fleets, own the serving economics,
              and can justify software-porting work if it lowers cost per token or improves deployment density. Large
              enterprises are usually indirect buyers: the user may sit in customer support, R&D, cybersecurity, or
              supply chain teams, but the payer is typically a CIO, platform, infrastructure, or business-function
              budget owner, and deployment arrives through cloud services rather than chip purchases. Edge and
              physical-AI operators form a third path in which local latency and power envelope dominate. Adoption
              maturity also remains uneven. Broad AI usage is high, but McKinsey and Deloitte both show that true
              production scale is much scarcer than pilot activity, and Gartner warns that many agentic-AI projects will
              never survive to durable deployment. For Element Labs, that means the first realistic targets are
              sophisticated operators that already feel inference costs or power limits directly, not smaller firms
              looking for a turnkey hardware swap.
