      - number: '7.2'
        title: Regulatory, legal, and IP exposure
        blocks:
          - type: paragraph
            body: >-
              The regulatory and legal stack is not hypothetical. In January 2026, BIS shifted advanced-semiconductor
              exports to China into a more conditional case-by-case regime, but only alongside customer screening,
              U.S.-based testing, and supply-protection conditions. GAO and CRS both frame the rules as operationally
              complex rather than ministerial. Even if Element itself never sells directly into China, these rules can
              still matter through China-linked customers, resellers, supply-chain partners, and the broader bargaining
              dynamics of the AI-chip market. The public-company read-through is clear: NVIDIA says export controls have
              already harmed its competitive position, while its Asia-concentrated supply chain leaves it exposed if
              rules tighten further. The legal environment is similarly active. Trade-secret litigation hit a record in
              2025, and recent legal analysis says courts increasingly demand specificity in AI-related trade-secret
              pleadings and can treat careless use of public generative-AI tools as evidence that secrecy protections
              were not reasonably maintained. For Element, which appears to operate in deep stealth with a small public
              surface, the mitigation benefit is obvious: less public leakage. But the residual risk is that investors
              still cannot see a documented compliance framework, a formal freedom-to-operate view, or the internal
              controls that would protect high-value design information as the team scales.
            claimRefs:
              - CR007
