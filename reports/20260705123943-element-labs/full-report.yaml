      - number: '8.4'
        title: Scenario Ranges and Why Clean Multiples Do Not Work
        blocks:
          - type: paragraph
            body: >-
              This chapter should not pretend that Element can be valued with clean public multiples, because the one
              number those multiples need — revenue — is not public. Astera, Marvell, and Nvidia are useful only as
              boundary markers. They show what scaled AI-semiconductor businesses look like when revenue, gross margin,
              and market capitalization are visible; they do not prove that a private company with undisclosed customers
              deserves the same framework. The private and transaction comparables are more helpful but also noisy. Groq
              shows that investors will support a premium inference story with billions of dollars of value when
              commercial scale is visible. SambaNova shows that strategic capital still exists for GPU alternatives.
              Hailo shows how quickly that support can reverse. Habana and ZT Systems show that buyers care about
              deployable systems and route-to-market speed, not just chip claims. Using that evidence, a base-case range
              of roughly $2.0-3.5 billion feels more defensible than the current mark, a bull case of $5.5-7.5 billion
              requires real proof, and a bear case of $0.5-1.5 billion remains possible.
