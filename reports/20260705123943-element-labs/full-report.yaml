      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is also asymmetric. For Element Labs itself there is no NRR, GRR, renewal,
              churn, contract-length, or customer-count disclosure, so the chapter cannot claim retention that has not
              been shown. The proxy set is more useful. On the positive side, Anthropic’s multiyear AWS commitment and
              the 100,000-plus Claude-on-AWS installed base show that durable inference demand can emerge when the
              channel, software, and hardware are bundled into a trusted cloud environment. Red Hat’s inference layer
              and IBM’s managed Gaudi exposure point in the same direction: enterprise buyers often want an abstraction
              and support model around the silicon, not raw hardware alone. On the negative side, the same peer set
              shows how fragile customer concentration can be. Cerebras’ filing and follow-on analysis make clear that
              even a technically strong inference company can remain dangerously dependent on one or two anchor
              customers. Sovereign or hyperscale wins can validate a platform, but they can also dominate its revenue
              mix. Element therefore faces a two-sided durability challenge: it needs enough marquee accounts to prove
              production relevance, but it also eventually needs enough breadth or channel leverage that one
              confidential account does not become the whole customer story.
