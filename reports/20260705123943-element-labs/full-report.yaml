      - number: '3.4'
        title: Moat Durability, Commoditization, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests Element Labs can still earn a wedge, but that wedge is conditional and
              fragile. The strongest opening is at the system-architecture level: inference growth is real, buyers want
              lower token cost and better performance-per-watt, and no single alternative dominates every workload. But
              the same evidence also weakens any naive moat story. Independent research shows the optimal accelerator
              changes with batch size, model size, and sequence length; that high utilization is required to realize
              efficiency promises on several alternative architectures; and that software-stack maturity remains a
              bottleneck across novel accelerators. In practice, this means commodity pressure comes from multiple
              directions at once. NVIDIA keeps deepening its software and interconnect moat while also accommodating
              semi-custom infrastructure. Hyperscalers keep absorbing more inference inside their own clouds. Startups
              such as Groq and Cerebras lower trial friction with public APIs and pricing, while Tenstorrent lowers
              hardware-trial friction with explicit product pricing. Element’s best chance is not to out-CUDA NVIDIA or
              out-cloud AWS. It is to show a hyperscaler-grade system advantage that materially changes token economics
              or density for large operators. Until Element publishes benchmarks, software evidence, and reference
              deployments, the public burden of proof remains on the company rather than on its competitors.
