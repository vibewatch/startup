      - number: '8.2'
        title: Financing Context and Public Support for the Price
        blocks:
          - type: paragraph
            body: >-
              The financing chronology is striking. Public reporting puts Element at about $50 million raised and a
              roughly $500 million valuation in April 2025, then at another $300-400 million raised above a $4 billion
              valuation in June 2026. Startup Nation Central independently points to roughly $400 million total capital
              and six investors, which is directionally consistent with a company that has attracted major follow-on
              support before public commercialization proof arrives. The bullish read is obvious: investors who know the
              company best were willing to write much larger checks after the initial round, and the 2025 capital was
              specifically tied to first-chip and tape-out work. The bearish read is just as important. The same public
              record does not disclose the cap table, liquidation stack, secondaries, debt, or cash burn. That means
              outside investors cannot tell whether the headline price is clean common-equity value, structured value,
              or a step-up buffered by terms. The result is a financing story that is real but still incomplete for
              valuation work.
