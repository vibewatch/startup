      - number: '7.5'
        title: Financial model, people risk, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final risk layer is the one that collapses all the others into investment outcomes. AI demand may be
              enormous in 2026, but that does not cancel cyclicality, concentration, or execution failure. Deloitte’s
              market outlook suggests that AI now carries a huge share of semiconductor economics, which is precisely
              why mistakes can be expensive: profit pools become concentrated, customer expectations rise, and the next
              down-cycle can punish under-validated entrants. Element’s financing reduces immediate survival risk, and
              the founder set clearly improves access to capital, talent, and technical relationships. Yet the same
              structure creates bench-depth and governance questions because the public record still revolves around a
              small founder circle, not a fully disclosed commercial and compliance organization. This is where
              diligence has to turn from narrative to trigger-based monitoring. The thesis weakens materially if
              customer references remain absent after first-silicon milestones, if wafer or packaging allocation is not
              contractually secured, if gross-margin assumptions rely on unproven utilization, or if export-control
              diligence is still immature when customers are ready to buy. Conversely, the main mitigation path is
              straightforward and measurable: show benchmarked cost-per-token advantages, secure allocation, broaden the
              decision-making bench, and convert secrecy into verified customer proof before the next financing or
              market reset raises the proof burden again.
