      - number: '2.5'
        title: Contradictions, Diligence Gaps, and Implications for Element Labs
        blocks:
          - type: paragraph
            body: >-
              The contradictory estimates should be preserved rather than smoothed away because they change the
              diligence posture. A company can look like it is chasing a massive market if one adopts the broadest
              AI-chip or inference-service definitions, yet the reachable merchant-hardware wedge becomes much smaller
              once one backs out training spend, hyperscaler self-supply, and buyers unwilling to leave Nvidia's
              software stack. The strongest open question is not whether demand for inference exists; it is whether
              Element Labs can show enough benchmarked and customer-validated advantage to earn redesign work from large
              operators. This chapter found no public Element Labs benchmark, production-customer, or deployment data,
              and the retained source set does not isolate a company-specific SOM with evidence. That does not negate
              the thesis, but it does mean valuation work should weight execution risk heavily and avoid treating broad
              market decks as if they were a validated revenue runway for this particular startup.
            claimRefs:
              - CM020
              - CM021
              - CM036
              - CM042
              - CM043
              - CM044
              - CM045
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: There is now a real post-Nvidia search process
            body: >-
              The chapter evidence no longer supports a view that buyers must choose only between Nvidia and doing
              nothing. Hyperscalers are investing in custom silicon, clouds openly market price-performance
              alternatives, and power constraints make efficiency a deployment variable rather than a nice-to-have spec.
            calloutType: strength
            claimRefs:
              - CM003
              - CM011
              - CM034
              - CM041
          - type: callout
            title: Hyperscaler self-supply compresses the merchant opportunity
            body: >-
              The biggest threat to a startup TAM deck is not weak demand for inference; it is that the largest buyers
              are also building their own chips. If AWS, Google, Microsoft, and Meta solve their own serving economics
              internally, the externally reachable slice for merchant inference silicon narrows quickly.
            calloutType: risk
            claimRefs:
              - CM021
              - CM028
              - CM035
              - CM036
          - type: callout
            title: Element Labs is underwriting a wedge, not a whole-market takeover
            body: >-
              The most credible Element Labs case is a focused wedge in workloads where power, bandwidth, and
              cost-per-token pressure justify software porting away from CUDA. That is narrower than broad AI-chip TAM
              claims but still meaningful if the company can prove a real efficiency delta on production inference
              workloads.
            calloutType: insight
            claimRefs:
              - CM020
              - CM042
              - CM044
