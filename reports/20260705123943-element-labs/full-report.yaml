chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Legal Footprint, and Current Stage
        blocks:
          - type: paragraph
            body: >-
              Element Labs is still best understood as a stealth private company rather than a publicly commercialized
              semiconductor vendor. The clearest hard identity anchor comes from the legal-entity record: Element Labs
              Ltd. was incorporated in Israel on 2024-05-08 with a registered and headquarters address at 132 Begin
              Road, Tel Aviv. Public media coverage then surfaced the venture in August 2024, when Globes reported that
              Avigdor Willenz, David Dahan, and Ran Halutz had registered the company under the name Element Labs while
              informally calling the project Touch. Since then, public reporting has consistently described Element Labs
              as an Israeli AI-chip startup focused on inference rather than model training. The footprint is dual
              rather than singular: Tel Aviv appears in legal and early-office records, while later operating coverage
              repeatedly places the company in Caesarea, including on the former Habana Labs campus. That combination
              supports a practical reading of Element Labs as a May 2024-incorporated, 2024-publicly surfaced,
              still-private Israeli chip venture with legal HQ in Tel Aviv and substantial operations in Caesarea.
