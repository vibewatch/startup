      - number: '3.3'
        title: Pricing, Distribution, Switching Costs, and Supply Access
        blocks:
          - type: paragraph
            body: >-
              The public pricing record is uneven and that matters. Groq and Cerebras make it relatively easy for a
              developer or AI team to start with pay-as-you-go inference. Tenstorrent is unusual in publishing explicit
              hardware prices for cards and Galaxy servers. That transparency lowers evaluation friction even if total
              delivered economics still depend on workload and scale. By contrast, NVIDIA, AMD, Intel, SambaNova,
              d-Matrix, and custom-ASIC paths like Marvell mostly route buyers through enterprise, OEM, or negotiated
              procurement. Distribution depth also diverges sharply. AWS, Google, and Azure wrap inference
              infrastructure inside global cloud contracts and existing operational relationships. Intel leans on OEMs
              like Dell. SambaNova has visible partner proof through SoftBank, OVHcloud, and an Intel collaboration.
              Marvell is not a merchant accelerator substitute for most developers, but it is highly relevant for
              hyperscalers because it offers custom XPU and packaging capability while now connecting into NVIDIA’s
              NVLink Fusion ecosystem. These facts drive switching cost. Buyers moving to Groq or Cerebras may change
              API endpoints and deployment assumptions but not necessarily buy a new rack from day one. Buyers choosing
              NVIDIA, hyperscaler silicon, or a semi-custom path are making much deeper stack choices around frameworks,
              interconnects, procurement, and long-term capacity. Element’s challenge is therefore commercial as much as
              architectural.
