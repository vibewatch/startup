companyProfile:
  summary: >-
    Element Labs is an Israeli AI semiconductor startup founded by Avigdor Willenz together with former Habana Labs
    leaders David Dahan and Ran Halutz. Public reporting positions the company around inference-oriented AI processors
    and adjacent system components aimed at lowering the cost and power burden of serving AI workloads, especially for
    large operators seeking alternatives to Nvidia-centric stacks. The company has raised capital unusually quickly for
    a stealth hardware business, but the open record still lacks customer, benchmark, and financial disclosure.
