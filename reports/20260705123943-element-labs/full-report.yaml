  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk stack and residual underwriting view
        blocks:
          - type: paragraph
            body: >-
              Element Labs’ risk profile is front-loaded rather than back-loaded. Public evidence supports a technically
              ambitious inference-chip program backed by an exceptional founder set and a large capital base, but it
              does not yet support the usual de-risking signals that let investors underwrite execution with confidence.
              There are still no retained public benchmarks, no public pricing, no named production customers, and no
              disclosed gross-margin or burn data. That matters because the company is already priced as a
              multibillion-dollar AI infrastructure contender. In that context, residual risk is dominated by three
              linked questions: can Element secure and qualify enough external manufacturing capacity, can it outperform
              incumbent and startup alternatives on cost and deployment, and can it do both before the next financing or
              market cycle forces a harder proof standard? The positive read-through is that existing investors doubled
              down in 2026 and the team has prior foundry and systems experience. The negative read-through is that
              nearly every critical proof point still sits behind management disclosure rather than on the public
              record. For investment purposes, this chapter therefore ranks supply chain and commercialization proof
              above pure technology novelty as the top residual risks.
            claimRefs:
