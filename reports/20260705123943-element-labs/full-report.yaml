      - number: '6.4'
        title: Procurement friction and bottom line
        blocks:
          - type: paragraph
            body: >-
              The most important customer takeaway is that demand for inference efficiency is real, but conversion into
              durable startup revenue is gated by procurement friction. Deloitte says only a quarter of surveyed
              organizations have moved 40% or more of pilots into production, while Gartner expects a large share of
              agentic-AI projects to be canceled because costs, business value, and controls do not line up. Deloitte
              also says country of origin now shapes vendor selection for most respondents, which matters directly for
              any Israeli or U.S.-aligned chip startup selling into regulated or sovereign contexts. MLCommons adds a
              practical reason why logo-based proof is not enough: inference procurement is benchmark-, latency-,
              throughput-, and compliance-driven. In other words, buyers may admire the founders and still refuse to
              deploy until the performance claims clear qualification and the support path looks safe. For Element Labs,
              that leaves a cautious but not dismissive conclusion. The direct public record supports a credible
              target-customer hypothesis—cloud giants, model labs, neoclouds, and enterprise/local-data-center
              operators—but it does not yet support a production-adoption conclusion. The chapter should therefore be
              read as a proxy-heavy demand map plus a short list of exact diligence asks, not as evidence that customer
              traction has already been proven.
