  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Element Labs
    rows:
      - - Hyperscaler and model-provider inference clusters
        - Serving spend for deployed LLM, ranking, recommendation, and agent workloads in cloud or owned data centers
        - Frontier model training clusters and general cloud networking spend
        - Infrastructure organization usually buys, uses, and pays itself
        - Core target because cost-per-token, density, and power efficiency directly matter
      - - Enterprise inference consumed through cloud services
        - Usage-based spending on managed AI services and hosted inference capacity
        - Most direct chip capex, because enterprises usually buy service outcomes rather than silicon
        - Application teams use; CIO, platform, or business unit owners pay
        - Indirect but important because enterprise demand drives cloud fleet choices
      - - Neo-cloud / specialized inference providers
        - Dedicated serving clusters sold to AI developers or model builders
        - Generic enterprise IT and unrelated hosting workloads
        - Platform operator buys and pays; developer customers use
        - Relevant early beachhead for a startup selling efficiency against GPU-heavy fleets
      - - Edge and physical-AI inference
        - Power-constrained local serving for robotics, industrial automation, and similar physical-AI workloads
        - Smartphone client NPUs and consumer-device AI features
        - OEM or operator buys; local application stack uses
        - Adjacent opportunity where Element Labs' efficiency narrative fits better than training scale
      - - Automotive ADAS and safety-critical embedded AI
        - Mostly excluded from near-term thesis because long validation cycles and safety certification dominate
        - Consumer infotainment and unrelated automotive electronics
        - Automaker or tier-one supplier buys and pays
        - Possible long-term adjacency, but not a near-term underwriting base
      - - Model training accelerators
        - >-
          Excluded from the core market boundary because memory, interconnect, and software priorities differ materially
          from inference optimization
        - Broader HPC and one-off experimentation budgets
        - Central AI research teams usually buy and use
        - Important as context only, not the primary market Element Labs says it serves
    notes: >-
      Boundary rows mix direct chip spend and service-driven demand proxies. The purpose is to separate the relevant
      inference decision set from broader AI-chip categories that overstate reachability.
