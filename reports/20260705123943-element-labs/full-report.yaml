    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Logical chain from founder quality and market pull through proof gaps and valuation stance to the public-only
      recommendation.
    approximationNotes: >-
      Flow maps the recommendation logic rather than a quantitative model and uses only retained public evidence as of
      2026-07-05.
    data:
      nodes:
        - id: market
          label: Inference market pull
          detail: Demand for GPU alternatives and distributed inference remains real.
        - id: team
          label: Founder quality
          detail: Repeat chip founders and prior exits create legitimate credibility.
        - id: capital
          label: Capital access
          detail: 2025 and 2026 financings show investors will continue funding the program.
        - id: proof
          label: Commercial proof gap
          detail: Customers, revenue, benchmarks, and preference terms remain mostly private.
        - id: valuation
          label: Current valuation stance
          detail: Public evidence does not yet justify treating >$4B as attractive fair value.
        - id: recommendation
          label: Recommendation
          detail: Research-more, with high risk and strict entry discipline.
      edges:
