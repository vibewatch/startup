    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - First-silicon underperformance
        - Benchmark packet shows no clear TCO or latency edge
        - Breaks the product-led bull case.
        - Stop underwriting premium valuation expansion.
      - - No anchor-customer conversion
        - No signed design win or revenue bridge after next financing cycle
        - Turns the story into speculative R&D rather than commercialization.
        - Move to avoid / wait for reset.
      - - Economics disappoint
        - Gross-margin or cost-per-token model cannot beat buyer alternatives
        - Removes the reason to displace incumbent stacks.
        - Recut valuation to asset or acqui-hire outcomes.
      - - Punitive recap terms
        - Next round introduces heavy preference stack, ratchets, or rescue debt
        - Subordinates new money despite headline valuation.
        - Decline unless structured seniority offsets the stack.
      - - Talent or governance fragility
        - Key founder or core architecture team churns before proof point
        - Raises execution risk in a timing-sensitive hardware program.
        - Require major price concession or step away.
    notes: >-
      These are explicit kill criteria, not generic risks; each one directly weakens the investment case or the
      investor’s position in the stack.
