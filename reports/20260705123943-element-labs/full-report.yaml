      - number: '7.3'
        title: Operational, manufacturing, and quality risk
        blocks:
          - type: paragraph
            body: >-
              The hardest risks in this story sit outside the company’s walls. Public reporting says Element’s April
              2025 financing was intended to finish the first chip series and move into TSMC tape-out, which means the
              company is already living in the domain where wafer allocation, packaging, yield, and bring-up discipline
              decide schedules. Industry sources describe that domain as brutally expensive. Semiconductor Engineering
              cites historical 5nm cost estimates above half a billion dollars, while EPDT says advanced-node
              productization costs turn exponential beyond 16nm and can exceed $1 billion at 2nm. More important than
              the absolute number is the structure of the risk: even giants like NVIDIA and AMD describe dependence on
              third-party foundries, packaging partners, and component availability, and they explicitly warn that
              defects, shortages, or delayed supply can hit gross margin and delivery. TrendForce’s June 2026 read on
              CoWoS tightness shows why this matters. Capacity is expanding, but the market may still exit 2026
              undersupplied. Element’s public disclosures do not say whether its first product uses HBM, CoWoS, simpler
              packaging, or another path, so investors cannot yet quantify its true exposure. That leaves the
              operational verdict simple: first-silicon progress is credible, but the manufacturing stack remains
              under-disclosed precisely where schedule and margin risk are highest.
