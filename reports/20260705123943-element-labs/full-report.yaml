      - number: '3.2'
        title: Direct Vendors and Product Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Among named competitors, NVIDIA remains the default comparison because it sells not only chips but a
              complete inference platform. Its public materials emphasize token economics, framework compatibility,
              distributed serving, and ongoing software optimization, which is exactly the combination a young rival has
              to displace. Intel and AMD frame themselves differently. Gaudi leans on openness, Ethernet fabrics, and
              OEM distribution; AMD leans on enterprise-ready deployment, open software, and high-memory accelerators
              that fit existing racks. The startup cohort splits further. Groq is the clearest API-style challenger: it
              exposes public pricing, free and developer plans, deterministic LPU architecture, and on-prem optionality.
              Cerebras also reduces application friction with API compatibility and self-serve pricing, but pairs that
              with wafer-scale hardware and a stronger emphasis on ultra-fast multimodal and agentic inference.
              SambaNova sells the most vertically integrated alternative among the startups, combining RDU chips,
              SambaCloud, sovereign-provider relationships, and a new SN50 roadmap tied to Intel and SoftBank.
              Tenstorrent takes the most transparent hardware-web-store path, with openly priced cards and servers plus
              a strongly open-source message. d-Matrix sits closer to an enterprise add-in-card story, emphasizing
              memory-centric inference and existing data-center fit. These are meaningfully different buying
              propositions, not interchangeable startup logos.
