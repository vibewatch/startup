      - number: '7.4'
        title: Partner, dependency, customer, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Element is not trying to enter an empty market. The public competitive bar is already set by vendors that
              combine silicon with software, cloud distribution, or both. AWS, Google, and Azure all market first-party
              AI infrastructure. Groq publishes token pricing, and Cerebras already offers public inference access.
              OpenAI’s own tape-out effort shows that major buyers may prefer to build bargaining leverage rather than
              remain dependent on merchant suppliers. The implication is that Element does not merely need a good chip;
              it needs a better system-level commercial answer than incumbents, cloud substitutes, and inference-first
              startups with more public proof. This dependency risk also runs through the customer side. Cerebras’ S-1
              is a valuable warning sign because it shows how quickly revenue can scale while still remaining
              concentrated in a handful of buyers. If Element’s first real wins come from a small set of hyperscalers,
              sovereign labs, or model builders, then a narrow customer base may be a feature of success, but it is also
              a clear residual risk. Publicly, Element has not yet shown the benchmarks, references, or procurement
              proof needed to offset that concern. Until it does, partner and customer dependency should be treated as a
              core underwriting issue rather than as a normal early-stage nuisance.
