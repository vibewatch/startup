            body: >-
              Public evidence supports a hardware-led commercial model, but not a fully underwritten revenue stack.
              Multiple retained sources describe Element Labs as an inference-chip company rather than a model-training
              vendor, and the January 2025 Globes report goes further by saying the company aims to deliver an
              end-to-end system that includes communication chips, processors, a graphics processor, and a software
              layer. That pushes the likely revenue model closer to customized infrastructure sales than to a commodity
              component or SaaS subscription. The same report says the processors are being developed according to
              customer requirements, which is a strong sign that early contracts would be negotiated design-in programs
              with a small number of sophisticated buyers rather than self-serve web pricing. What public sources do not
