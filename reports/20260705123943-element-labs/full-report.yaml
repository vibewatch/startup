  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The first diligence task is defining the market boundary before quoting any TAM. The relevant market for
              Element Labs is not all AI chips and not even all data-center accelerators. Public reporting on the
              company says it is pursuing inference processors for deployed workloads and explicitly contrasts that
              focus with Habana Labs' training-era mission. That makes the core comparison set deployed-model serving
              across hyperscaler clusters, model-provider infrastructure, and selected edge or physical-AI environments
              where latency, power, and bandwidth matter. The status-quo substitute is still Nvidia's CUDA-centered GPU
              stack, whose economic weight is visible in Nvidia's huge data-center revenue base and whose software moat
              remains unusually strong. But the substitute set is already broader than merchant GPUs: Google, AWS,
              Microsoft, and Meta are all pushing in-house silicon, while Intel, AMD, and other alternative merchant
              vendors keep pitching lower-cost or more power-efficient inference paths. For Element Labs, the practical
              boundary therefore sits at the intersection of inference-heavy workloads, willingness to port software
              away from CUDA, and sites where incremental efficiency can unblock deployment rather than merely trim
              operating expense.
