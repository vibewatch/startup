        - label: Base case
          low: 2000
          high: 3500
          unit: USD M
          detail: Credits team and capital access while discounting missing commercialization proof.
        - label: Bear case
          low: 500
          high: 1500
          unit: USD M
          detail: Reflects delay, weak adoption, or punitive recap terms.
        - label: Reported current mark
          low: 4000
          high: 4000
