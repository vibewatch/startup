      label: Named platform or channel
      detail: Cloud, OEM, or partner exposure that lets buyers trial silicon through a trusted wrapper
    - id: n3
      label: Production deployment proof
      detail: Named workload, region, or account with production-style scale or live service evidence
    - id: n4
      label: Expansion capacity commitment
