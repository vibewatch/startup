- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Concentration / channel read
  - Impact
  - Diligence path
  rows:
  - - Founder-led confidential design wins
    - Fast path to marquee accounts but low public referenceability
    - Can validate technology early while leaving outside investors blind on durability
    - Request signed design-win list, stage, and conversion criteria
  - - Cloud-channel distribution
    - Reduces buyer friction and spreads one platform into many downstream accounts
    - Best public proxy for scalable breadth in this market
    - Request any Bedrock-, IBM-, Red Hat-, or OEM-style channel commitments under NDA
  - - Sovereign / regional anchor projects
    - Large early revenue can accelerate growth but create customer concentration
    - Can de-risk production proof while increasing geopolitical and concentration exposure
    - Request whether any sovereign or public-sector buyer exceeds 20% of forecast revenue
  - - OEM / managed infrastructure path
    - Support and integration are packaged around the chip rather than around a direct startup sale
    - Improves procurement odds with regulated enterprises
    - Request server, rack, support, and warranty partners
  - - Self-supplying hyperscalers
    - Largest prospects can also become the strongest substitutes
    - Compresses reachable merchant opportunity and raises pricing pressure
    - Request where Element is selling true merchant hardware versus custom or semi-custom engagements
  notes: Rows synthesize direct evidence gaps with the most relevant proxy risks surfaced by public comparable deployments and customer-channel disclosures.
