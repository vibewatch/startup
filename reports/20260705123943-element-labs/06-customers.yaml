callouts:
- calloutType: risk
  title: There is still no direct public customer proof for Element Labs
  body: The direct record is strong enough to infer target buyer categories but not strong enough to validate one live customer, one production deployment, or one retention metric. That keeps the chapter firmly in proxy territory until private diligence closes the gap.
  claimRefs:
  - CU005
  - CU006
  - CU036
  - CU040
- calloutType: insight
  title: Inference demand is real, but channel design is part of the product
  body: Comparable wins suggest buyers increasingly want the silicon wrapped in a cloud, OEM, or inference-software channel that reduces migration and support risk. For Element, commercial architecture may matter almost as much as chip architecture.
  claimRefs:
  - CU018
  - CU027
  - CU037
  - CU038
  - CU043
- calloutType: assumption
  title: The cleanest bull case is a few large accounts, not broad public breadth yet
  body: The direct evidence is most consistent with a startup chasing a handful of hyperscaler, model-lab, or neocloud accounts first, then widening through channel or regional deployment partners if early proofs succeed.
