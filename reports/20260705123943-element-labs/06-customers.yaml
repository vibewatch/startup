    - Official statements; no economic unit metrics
  - - Poolside on AWS Trainium
    - AI coding model vendor
    - Scale usage of Poolside with Trainium and vLLM support
    - Production-leaning partnership
    - Customer-quoted price-performance benefit and workflow adaptation by AWS
    - No public usage volumes
  - - Decart on AWS Trainium
    - Real-time video generation startup
    - Serve interactive video models
    - Production-like workload proof
    - 4x throughput, 2x cost efficiency, latency from 40ms to 10ms
