- id: TU003
  title: Named customer proof table
  columns:
  - Customer / channel
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome or scale signal
  - Limitation
  rows:
  - - Anthropic on AWS Trainium
    - Frontier model lab / hyperscaler channel
