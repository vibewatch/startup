  - - Tomofun on AWS Inferentia
    - Consumer pet-tech enterprise
    - Continuous pet-behavior monitoring inference across thousands of devices
    - Production deployment
    - 83% deployment-cost reduction on Inf2
    - Single customer quote on AWS page
  - - IBM Cloud with Intel Gaudi 3
    - Enterprise cloud channel
    - Offer Gaudi 3 instances for production workloads in named regions
    - Production channel availability
    - Frankfurt and Washington live; Dallas planned
    - Cloud availability is not equal to broad end-customer adoption
  - - Aramco Digital with Groq
    - Sovereign / regional AI platform
    - Inference cluster and marketplace access in Saudi Arabia
    - Production buildout / expansion
    - 51-day cluster build and $1.5B expansion agreement
    - Scale claims are partly vendor reported
  - - SoftBank with SambaNova SN50
    - Sovereign / enterprise AI services in APAC
    - Low-latency inference services from Japan
    - First deployment announced
    - SoftBank named as first SN50 deployment
    - Still pre-broad-rollout and shipping later in 2026
