tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / evidence
  - Revenue or strategic value
  - Gap
  rows:
  - - Confidential U.S. cloud giants and model labs
    - Buyer likely hyperscaler or model-lab infrastructure team; end users are AI-platform teams; payer undisclosed
    - Serve LLMs, AI agents, and other post-training inference at lower cost than GPU-heavy stacks
    - Direct evidence is reported but unnamed in Globes
    - Could validate product-market fit and drive multi-generation capacity demand
    - No public customer name, contract stage, or spend disclosed
  - - Enterprise and IT data-center operators
    - Buyer is enterprise or IT operations; user is inference or platform team; payer likely infrastructure budget owner
    - Local or distributed inference for NLP and image workloads
    - Startup Nation Central explicitly describes enterprise and IT targets
    - Broadens TAM beyond hyperscalers and supports local-data-center wedge
    - No named enterprise account or vertical breakdown
  - - Neocloud operators
    - Buyer is cloud infrastructure company; users are downstream AI developers and enterprise tenants; payer is capacity operator
    - Rent AI processing capacity as an alternative to Nvidia-heavy fleets
    - Globes names Crusoe, Nebius, and CoreWeave as relevant target category
    - Can convert one design win into many downstream workloads
    - No proof Element has a live channel or signed neocloud account
  - - Sovereign and regional AI programs (proxy only)
    - Buyer is state-backed compute or digital-transformation entity; users are developers and public or enterprise institutions; payer is sovereign budget
    - Localized inference capacity, language models, and data-sovereign AI services
    - Comparable proof appears in Saudi and Japan, not at Element
    - Large anchor contracts can accelerate deployment scale and referenceability
    - Pure proxy evidence for Element today
  - - Cloud-channel software ecosystems (proxy only)
    - Buyer is cloud or platform partner; users are application builders; payer is subscription or cloud spend owner
    - Expose inference through APIs, Bedrock-style platforms, and supported inference layers
    - Strong proof in AWS, IBM, and Red Hat ecosystems
    - Reduces procurement friction for buyers that avoid direct chip adoption
    - Element has not disclosed any comparable software or channel partner
  notes: Rows combine direct Element evidence with clearly labeled proxy segments from comparable inference deployments; proxy rows describe how buyers in this category publicly reveal themselves, not confirmed Element customers.
