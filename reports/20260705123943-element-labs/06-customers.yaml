  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: direct-customer-proof
    missingEvidence: At least one named Element Labs customer reference with workload, contract stage, and whether the deployment is a pilot, design win, or scaled production account.
    whyItMatters: Without one direct reference, the chapter can only infer demand from positioning and proxy evidence, which is not enough to underwrite customer traction confidently.
    diligencePath: Request a current customer list under NDA with account owner, deployment stage, annualized spend, and permission to speak with at least one production user.
    relatedQuestionRefs:
    - QU005
    - QU006
    - QU025
  - type: private-evidence-only
    severity: material
    topic: buyer-user-payer-map
    missingEvidence: Account-level mapping of who buys, who operates, and who ultimately funds an Element Labs deployment inside each target segment.
    whyItMatters: Procurement, sales cycle, and expansion dynamics differ materially between hyperscalers, model labs, sovereign buyers, and enterprise IT operations.
    diligencePath: Ask management for a segment-by-segment GTM map covering buyer title, technical evaluator, budget owner, and expected sales-cycle length.
    relatedQuestionRefs:
    - QU007
    - QU018
    - QU025
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: NRR, GRR, churn, renewal rate, contract duration, usage expansion, and cohort behavior for live Element accounts.
    whyItMatters: A few marquee pilots can create a false sense of traction unless the company can show repeat usage, renewals, or growing committed capacity.
    diligencePath: Request cohort tables for the top ten accounts showing booked value, recognized revenue, consumption, and renewal status by quarter.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, backlog share, and any single-account capacity dependency for Element Labs.
    whyItMatters: Peer evidence shows that one or two anchor customers can dominate an inference-chip company long after the first public win, creating real downside if a program slips.
    diligencePath: Request current and projected top-five customer concentration, including any customer over 10%, 20%, and 30% of forecast revenue or reserved capacity.
    relatedQuestionRefs:
    - QU021
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: channel-and-partner-map
    missingEvidence: Public or private evidence of OEM, cloud, software-runtime, or managed-service partners that reduce deployment friction for Element Labs buyers.
    whyItMatters: Comparable deployments rely heavily on trusted channels; without one, a startup may need buyers to absorb far more integration and support risk directly.
    diligencePath: Ask whether Element has any distribution, OEM, hyperscaler, or inference-software partnerships already in pilot or contract form and request the stage of each.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: proxy-customer-proof-sample
    missingEvidence: The chapter samples the clearest public comparable deployments but does not enumerate every inference vendor, sovereign program, or OEM path globally.
    whyItMatters: The sample is sufficient to show what customer proof looks like in this category, but a live diligence process could refine which channel proxies matter most for Element’s actual GTM path.
    diligencePath: Expand the comparable set only after management narrows the intended primary segment to hyperscaler, sovereign, neocloud, or enterprise-private-AI accounts.
    relatedQuestionRefs:
    - QU009
    - QU013
    - QU022
    relatedTableRefs:
    - TU003
