- id: proxy-adoption-and-named-deployment-proof
  title: Proxy adoption trajectory and named deployment proof
  body: 'Because Element Labs discloses no direct customer proof, the best available public lens is what named deployments look like for adjacent inference platforms. Those proofs consistently cluster around a few customer types: hyperscalers and frontier-model labs, cloud channels packaging purpose-built silicon for downstream users, sovereign or national-compute programs, and application-specific enterprises with measurable latency or cost pain. AWS is the cleanest public example. Anthropic says Claude is already training and serving on nearly one million Trainium2 chips, while Amazon says more than 100,000 customers run Claude on AWS. The same AWS customer pages show smaller but more concrete application proofs from Poolside, Decart, Karakuri, NetoAI, SplashMusic, and Tomofun, which is useful because it separates large-platform breadth from workload-specific deployment outcomes. Comparable patterns show up elsewhere: IBM Cloud exposes Gaudi 3 for production workloads in named regions,
    SoftBank is the first public SN50 deployment for SambaNova in Japan, Groq has a Saudi sovereign anchor through Aramco Digital, and OpenAI has signed a phased low-latency inference buildout with Cerebras. None of that proves Element has the same traction, but it does show what credible customer proof in this category usually looks like: named channel, named geography, named workload, and at least one concrete production or scale signal.'
