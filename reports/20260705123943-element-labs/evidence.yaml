    whyItMatters: >-
      The long tail is unlikely to change the overall conclusion, but it could matter for one or two niche sovereign or
      edge procurement contexts.
    diligencePath: >-
      Extend the competitor list during live diligence only after clarifying the target customer profile—hyperscaler,
