evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: >-
      A company-approved financing history showing every round, exact amounts, instrument types, and post-money
      valuations.
    whyItMatters: >-
      Current public sources point in the same direction but do not reconcile to one exact lifetime capital number,
      which weakens precision on dilution and valuation-step-up analysis.
    diligencePath: >-
      Request the board-approved financing schedule and cap table from management or lead investors, then reconcile
      against Series A and June 2026 press coverage.
    relatedQuestionRefs:
      - QO015
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, margin, burn, runway, and any management forecast for production ramp.
    whyItMatters: >-
      A multibillion-dollar private valuation cannot be underwritten confidently without basic operating economics,
      especially for a capital-intensive semiconductor company.
    diligencePath: >-
      Request the latest management reporting pack, monthly KPI dashboard, and current budget versus actuals from
      management.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: customer-validation
    missingEvidence: >-
      Named design partners, pilot customers, benchmark results, and evidence of production deployments or commercial
      commitments.
    whyItMatters: >-
      Without customer names or benchmark proof, it is impossible to judge whether the product is merely promising
      architecture or already validated commercial silicon.
    diligencePath: >-
      Request a customer-reference list, signed design-win summary, benchmark deck, and tape-out roadmap tied to
      commercial milestones.
    relatedQuestionRefs:
      - QO018
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-investor-map
    missingEvidence: >-
      A current board roster, committee map, observer list, and full cap table with investor rights and ownership
      percentages.
    whyItMatters: >-
      Founder concentration may be appropriate, but investors cannot assess control, reserved matters, or follow-on
      leverage from the public record alone.
    diligencePath: >-
      Request the current cap table, board consents, shareholder agreement summary, and latest financing documents from
      counsel or lead investors.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: merchant-inference-sam
    missingEvidence: >-
      A public source that isolates merchant inference-accelerator revenue after backing out training spend and
      hyperscaler internal ASIC consumption.
    whyItMatters: >-
      Without this denominator, any TAM-to-SAM compression for Element Labs remains an analytical range rather than a
      validated market model.
    diligencePath: >-
      Request sell-side or industry-practitioner work that segments inference silicon by merchant versus captive
      deployment, or obtain customer-by-customer budget data in diligence.
    relatedQuestionRefs:
      - QM011
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: element-labs-benchmarks
    missingEvidence: >-
      Independent benchmark, latency, power, or cost-per-token evidence for Element Labs' own hardware versus Nvidia and
      other alternatives.
    whyItMatters: >-
      Element Labs' investment case depends on proving an efficiency wedge, but public sources only describe the
      ambition, not measured results.
    diligencePath: >-
      Ask management for benchmark methodology, customer evaluation results, software-porting burden, and any
      third-party validation of throughput and watt efficiency.
    relatedQuestionRefs:
      - QM025
  - type: access-blocked
    severity: minor
    topic: export-control-thresholds
    missingEvidence: >-
      Direct access to the blocked Federal Register rule text and any replacement-rule thresholds that would clarify
      country scope and technical cutoffs.
    whyItMatters: >-
      The chapter can show policy volatility, but exact licensing thresholds and replacement mechanics remain partially
      unverified in the retained source set.
    diligencePath: >-
      Review the official rule text through maintainers' approved access path or legal counsel memo before underwriting
      geography-sensitive revenue assumptions.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: independent-benchmark-comparability
    missingEvidence: >-
      Public apples-to-apples inference benchmark and cost-normalized comparisons across Nvidia, Trainium, TPU, Gaudi,
      and other alternatives.
    whyItMatters: >-
      Without normalized benchmark data, reported performance or ROI claims remain vendor-specific and cannot cleanly
      rank substitute options.
    diligencePath: >-
      Pull full MLPerf results or independent lab benchmarks with consistent model, batch, latency, and power
      assumptions.
    relatedQuestionRefs:
      - QM013
      - QM022
  - type: missing-source
    severity: minor
    topic: buyer-budget-ownership
    missingEvidence: >-
      Segment-specific procurement evidence showing which titles control inference budgets at hyperscalers, enterprises,
      and edge operators.
    whyItMatters: >-
      Buyer and payer separation influences sales-cycle length, pricing power, and whether Element Labs must sell chips,
      systems, or cloud capacity equivalents.
    diligencePath: >-
      Collect public job descriptions, procurement records, and customer interviews for each segment before final GTM
      assumptions are set.
    relatedQuestionRefs:
      - QM016
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: realized-accelerator-pricing
    missingEvidence: >-
      Comparable realized ASPs, discounts, minimum commitments, and support fees for NVIDIA, AMD, Intel, SambaNova,
      d-Matrix, and custom-silicon programs are not public in the retained source set.
    whyItMatters: >-
      Without realized pricing rather than public claims or list cards, it is impossible to compare true token economics
      or gross-margin headroom across serious enterprise alternatives.
    diligencePath: >-
      Request live quotes, committed-use terms, and delivered TCO models for a common 70B and 405B inference workload
      across at least NVIDIA, Groq, Cerebras, SambaNova, and one hyperscaler substitute.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: element-benchmark-and-software-proof
    missingEvidence: >-
      No retained public source shows Element Labs benchmarks, compiler/runtime evidence, API surface, or named
      production deployments that can be compared directly with peers.
    whyItMatters: >-
      The competitive question is not whether alternatives exist—they clearly do—but whether Element can prove a
      system-level advantage against them.
    diligencePath: >-
      Ask Element for benchmark methodology, software stack architecture, migration tooling, and at least two production
      or pilot reference deployments with workload details.
    relatedQuestionRefs:
      - QP024
  - type: conflicting-data
    severity: material
    topic: benchmark-comparability
    missingEvidence: >-
      A common third-party benchmark pack across NVIDIA, AMD, Intel, Groq, Cerebras, SambaNova, Tenstorrent, d-Matrix,
      and Element is not available in the retained evidence.
    whyItMatters: >-
      Vendor-authored speed and cost claims are directionally useful but not enough to underwrite moat durability
      because they use different models, contexts, concurrency assumptions, and price bases.
    diligencePath: >-
      Run a buyer-specific benchmark bake-off with identical models, prompts, concurrency, accuracy targets, and energy
      instrumentation, then reconcile the results against MLPerf or equivalent methodology where possible.
    relatedQuestionRefs:
      - QP020
  - type: private-evidence-only
    severity: material
    topic: supply-allocation-and-volume
    missingEvidence: >-
      Delivered wafer allocation, packaging capacity, lead times, and actual 2026 shipment volumes for startup vendors
      and custom-silicon programs are not public here.
    whyItMatters: >-
      A startup can appear competitive on architecture but still lose on supply access, especially when incumbents or
      hyperscalers absorb the most attractive foundry and packaging capacity.
    diligencePath: >-
      Request foundry relationships, packaging partners, booked capacity, and committed customer volumes for Element and
      the closest custom-silicon alternatives.
    relatedQuestionRefs:
      - QP018
      - QP019
