- id: TM002
  title: TAM / SAM / SOM and sizing-lens table
  columns:
  - Publisher / lens
  - Base year / forecast
  - Value
  - Geography / scope
  - Why it is not directly comparable
  - Implication for Element Labs
  rows:
  - - Gartner — AI semiconductors
    - 2024 / 2025
    - '2024: $71.25B; 2025: $91.96B'
    - Global AI semiconductor revenue across multiple end markets
    - Much broader than inference accelerators in servers; includes non-server categories
    - Upper-bound signal for sector size, not a usable merchant inference SAM
  - - Gartner — AI accelerators in servers
    - 2024 / 2028
    - '2024: $21B; 2028: $33B'
    - Global server accelerator value
    - Narrower server-only slice; still mixes training and inference
    - Best public lower-bound anchor for the data-center subset
  - - MarketsandMarkets — AI inference market
    - 2025 / 2030
    - '2025: $106.15B; 2030: $254.98B'
    - Global inference category
    - 'Likely mixes infrastructure, deployment, and broader inference stack definitions; FAQ also cites 2024: $76.24B'
    - Directionally helpful but too broad to treat as merchant silicon TAM
  - - Mordor — AI accelerators market
    - 2026 / 2031
    - '2026: $174.69B; 2031: $518.12B'
    - Global accelerators across cloud, edge, training, and inference
    - Broader accelerator taxonomy and mixed end markets
    - Shows upside if the entire accelerator category keeps compounding
  - - Grand View — AI accelerator market
    - 2024 / 2033
    - '2024: $25.56B; 2033: $256.84B'
    - Global accelerator market
    - Meaningfully narrower starting boundary than Mordor or GMInsights
    - Useful reminder that published TAM depends heavily on taxonomy
  - - GMInsights — AI accelerator chips market
    - 2026 / 2035
    - '2026: $154.6B; 2035: $1T'
    - Global accelerator chips market
    - Aggressive long-horizon framing; includes broad chip classes and end markets
    - Supports long-run category expansion, not near-term Element Labs SOM
  notes: The table intentionally keeps contradictory estimates side by side. Each row uses a different denominator, so the
    valuations are best read as boundary markers rather than reconcilable point estimates.
