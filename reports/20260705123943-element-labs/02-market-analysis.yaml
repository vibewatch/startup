callouts:
- calloutType: strength
  title: There is now a real post-Nvidia search process
  body: The chapter evidence no longer supports a view that buyers must choose only between Nvidia and doing nothing. Hyperscalers
    are investing in custom silicon, clouds openly market price-performance alternatives, and power constraints make efficiency
    a deployment variable rather than a nice-to-have spec.
  claimRefs:
  - CM003
  - CM011
  - CM034
  - CM041
- calloutType: risk
  title: Hyperscaler self-supply compresses the merchant opportunity
  body: The biggest threat to a startup TAM deck is not weak demand for inference; it is that the largest buyers are also
    building their own chips. If AWS, Google, Microsoft, and Meta solve their own serving economics internally, the externally
    reachable slice for merchant inference silicon narrows quickly.
  claimRefs:
  - CM021
  - CM028
  - CM035
  - CM036
- calloutType: insight
  title: Element Labs is underwriting a wedge, not a whole-market takeover
  body: The most credible Element Labs case is a focused wedge in workloads where power, bandwidth, and cost-per-token pressure
    justify software porting away from CUDA. That is narrower than broad AI-chip TAM claims but still meaningful if the company
    can prove a real efficiency delta on production inference workloads.
  claimRefs:
  - CM020
  - CM042
  - CM044
  - CM045
