- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'The demand case for inference accelerators is real, but the gating factors are as important as the growth story.
    On the positive side, inference economics are falling quickly, OpenAI-style token pricing has made cost per output legible
    to buyers, and large clouds now publicly market alternative chips on price, throughput, and power efficiency rather than
    raw peak specs alone. Physical-AI and edge use cases widen the set of workloads that reward lower-watt serving hardware.
    Against that, power and interconnection capacity are becoming hard constraints on deployment; Berkeley Lab''s update implies
    that U.S. data-center electricity use could reach 649 TWh in 2030 in its reference case and 782 TWh in a high-inference-energy
    scenario. Software lock-in is the other major brake. CUDA still anchors a huge installed base and library ecosystem, so
    a new entrant must win enough opex, latency, or density improvement to justify migration risk. Supply-chain and export-control
    volatility add another layer: wafer availability, liquid-cooling costs, and shifting U.S. advanced-computing rules all
    complicate long-range demand planning.'
  claimRefs:
