  evidenceGaps:
  - type: missing-source
    severity: material
    topic: merchant-inference-sam
    missingEvidence: A public source that isolates merchant inference-accelerator revenue after backing out training spend
      and hyperscaler internal ASIC consumption.
    whyItMatters: Without this denominator, any TAM-to-SAM compression for Element Labs remains an analytical range rather
      than a validated market model.
    diligencePath: Request sell-side or industry-practitioner work that segments inference silicon by merchant versus captive
      deployment, or obtain customer-by-customer budget data in diligence.
    relatedQuestionRefs:
    - QM011
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: element-labs-benchmarks
    missingEvidence: Independent benchmark, latency, power, or cost-per-token evidence for Element Labs' own hardware versus
      Nvidia and other alternatives.
    whyItMatters: Element Labs' investment case depends on proving an efficiency wedge, but public sources only describe the
      ambition, not measured results.
    diligencePath: Ask management for benchmark methodology, customer evaluation results, software-porting burden, and any
      third-party validation of throughput and watt efficiency.
    relatedQuestionRefs:
    - QM025
  - type: access-blocked
    severity: minor
    topic: export-control-thresholds
    missingEvidence: Direct access to the blocked Federal Register rule text and any replacement-rule thresholds that would
      clarify country scope and technical cutoffs.
    whyItMatters: The chapter can show policy volatility, but exact licensing thresholds and replacement mechanics remain
      partially unverified in the retained source set.
    diligencePath: Review the official rule text through maintainers' approved access path or legal counsel memo before underwriting
      geography-sensitive revenue assumptions.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: independent-benchmark-comparability
    missingEvidence: Public apples-to-apples inference benchmark and cost-normalized comparisons across Nvidia, Trainium,
      TPU, Gaudi, and other alternatives.
    whyItMatters: Without normalized benchmark data, reported performance or ROI claims remain vendor-specific and cannot
      cleanly rank substitute options.
    diligencePath: Pull full MLPerf results or independent lab benchmarks with consistent model, batch, latency, and power
      assumptions.
