- id: sizing-lenses-and-reachability
  title: Sizing Lenses, TAM Compression, and What Is Actually Reachable
  body: 'Public market-sizing numbers are useful only as boundary markers. Gartner offers the cleanest example of why: its
    broad AI-semiconductor estimate is $71.25 billion in 2024, yet its much narrower server-accelerator slice is only $21
    billion in the same year. Other publishers swing far wider. MarketsandMarkets markets a $106.15 billion 2025 AI inference
    opportunity, Grand View frames a $25.56 billion 2024 accelerator market, GMInsights publishes a $154.6 billion 2026 accelerator-chips
    figure, and Mordor reaches $174.69 billion for 2026. These estimates are not wrong in the same way; they are using different
    denominators. Some include automotive and edge NPUs, some mix training and inference, some track server content only,
    and some behave more like software-or-service market proxies than merchant silicon revenue. The valuation-relevant takeaway
    is that Element Labs does not need the broadest TAM decks to be directionally interesting, but it also cannot claim them.
    A more honest framing is a merchant inference-silicon SAM that is narrower than broad AI-chip numbers because hyperscaler
    internal ASICs absorb a material share of demand and because training budgets are not the same budget pools as steady-state
    inference serving.'
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
