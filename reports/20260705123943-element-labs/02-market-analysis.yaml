- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Rapid inference cost deflation
    - Driver
    - Current / ongoing
    - Lower cost per token expands viable workloads and widens room for alternate hardware
    - Test whether Element Labs can translate hardware efficiency into visible cost-per-token savings
  - - Agentic-AI and physical-AI workload growth
    - Driver
    - Near term
    - More multi-step and always-on workloads increase serving demand beyond one-shot chat use cases
    - Ask which workload families Element Labs targets first and why
  - - Power and interconnection limits
    - Constraint
    - Current through 2030
    - Sites may choose denser or more efficient inference hardware simply to fit inside available capacity
    - Request customer evidence that power is a purchase gate rather than a marketing theme
  - - CUDA ecosystem lock-in
    - Constraint
    - Current / ongoing
    - Alternative hardware must overcome porting risk, tooling gaps, and organizational inertia
    - Ask for software-compatibility proof, porting burden, and benchmark reproducibility
  - - Hyperscaler self-supply with custom ASICs
    - Constraint
    - Current / ongoing
    - Large buyers may solve inference cost problems internally instead of buying merchant silicon
    - Clarify whether Element Labs sells chips, systems, or design wins into operators that still need external vendors
  - - Wafer, packaging, and cooling bottlenecks
    - Constraint
    - Current / ongoing
    - Supply constraints can slow ramp even if demand is real
    - Ask about foundry access, packaging plan, and cooling assumptions
  - - Export-control volatility
    - Constraint
    - Current / ongoing
    - Shifting rules complicate geographic demand planning and customer qualification
    - Map target geographies and compliance assumptions explicitly
  - - Pilot-to-production ROI skepticism
    - Constraint
    - Near term
    - Many AI projects stall before scaling, which delays hardware refresh decisions
    - Request proof that intended workloads are already at production scale with budget authority
  - - Edge power envelopes favor efficient serving
    - Driver
    - Near term
    - Lower-watt inference can open workloads that do not justify hyperscale GPU footprints
    - Test whether Element Labs has a concrete edge or local-data-center roadmap rather than only hyperscale ambition
  notes: 'Several factors operate in both directions: growth creates demand, but the same complexity can slow adoption or
    compress the set of buyers willing to redesign their serving stack.'
