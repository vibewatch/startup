companyProfile:
  summary: Element Labs is an Israeli AI semiconductor startup founded by Avigdor Willenz together with former Habana Labs leaders David Dahan and Ran Halutz. Public reporting positions the company around inference-oriented AI processors and adjacent system components aimed at lowering the cost and power burden of serving AI workloads, especially for large operators seeking alternatives to Nvidia-centric stacks. The company has raised capital unusually quickly for a stealth hardware business, but the open record still lacks customer, benchmark, and financial disclosure.
  foundedDate: '2024-05-08'
  founders:
    - name: Avigdor Willenz
      role: Co-founder and chairman-like sponsor
      background: Serial semiconductor entrepreneur behind Galileo, Annapurna Labs, and Habana Labs, whose reputation appears central to Element Labs' fundraising and strategic access.
      claimRefs: [CO009, CO012, CO015]
    - name: David Dahan
      role: Co-founder and CEO
      background: Public founding coverage identifies Dahan as CEO and ties him to the Habana Labs founding team.
      claimRefs: [CO009, CO010]
    - name: Ran Halutz
      role: Co-founder and R&D leader
      background: Public sources tie Halutz to the founding team and to technical development leadership at Element Labs after prior Habana Labs work.
      claimRefs: [CO009, CO011]
  foundingLocation: Tel Aviv, Israel
  headquarters: Tel Aviv, Israel
  productSummary: Inference-oriented AI processors and adjacent system components intended to reduce cost, bandwidth strain, and power intensity for deployed AI serving workloads.
  customerFocus: Hyperscalers, model providers, and enterprise or local-data-center operators running large-scale inference workloads.
  businessModel: Custom AI processors and supporting systems or software sold into large inference deployments, likely through direct strategic relationships rather than broad self-serve distribution.
  stage: Private, post-Series A financing stage
  fundingStatus: Public reporting supports a $50M Series A in April 2025 and a further roughly $300-400M raise in June 2026 at a valuation above $4B, with total disclosed capital around $400M.
  disclosureProfile: stealth
  claimRefs: [CO003, CO004, CO005, CO009, CO015, CO017, CO020, CO022, CU008]
summary:
