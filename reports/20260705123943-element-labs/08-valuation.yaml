- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current judgment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Funding support exists, but revenue and customer proof do not.
    - Continue diligence; do not treat the current mark as self-validating.
  - - Confidence
    - medium
    - Key price-sensitive facts remain private.
    - Keep conclusions flexible until private documents arrive.
  - - Risk rating
    - high
    - Hardware execution, concentration, and recap risk are all live.
    - Model downside before upside.
  - - Valuation stance
    - expensive
    - Public evidence lags the >$4B headline mark.
    - Only engage if the effective entry price or terms improve.
  - - Entry discipline
    - Require lower effective basis or strong structure
    - Cap-table and preference opacity remain unresolved.
    - Do not underwrite returns off the headline post-money alone.
  - - Target-return hurdle
    - Need path to >2.5x net outcome from today’s basis
    - A >$4B entry needs a much larger eventual exit or strong downside protection.
    - Price discipline matters more than founder quality at this stage.
  notes: Summary judgments are public-evidence-based and should be revisited only after private KPI, cap-table, and customer materials are reviewed.
