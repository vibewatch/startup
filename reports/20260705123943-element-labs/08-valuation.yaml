- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - First-silicon underperformance
    - Benchmark packet shows no clear TCO or latency edge
    - Breaks the product-led bull case.
    - Stop underwriting premium valuation expansion.
  - - No anchor-customer conversion
    - No signed design win or revenue bridge after next financing cycle
    - Turns the story into speculative R&D rather than commercialization.
    - Move to avoid / wait for reset.
  - - Economics disappoint
    - Gross-margin or cost-per-token model cannot beat buyer alternatives
    - Removes the reason to displace incumbent stacks.
    - Recut valuation to asset or acqui-hire outcomes.
  - - Punitive recap terms
    - Next round introduces heavy preference stack, ratchets, or rescue debt
    - Subordinates new money despite headline valuation.
    - Decline unless structured seniority offsets the stack.
  - - Talent or governance fragility
    - Key founder or core architecture team churns before proof point
    - Raises execution risk in a timing-sensitive hardware program.
    - Require major price concession or step away.
  notes: These are explicit kill criteria, not generic risks; each one directly weakens the investment case or the investor’s position in the stack.
  claimRefs:
  - CV005
  - CV017
  - CV036
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Customers and pipeline
    - Named or masked design wins, contracted revenue, and renewal logic
    - Validates whether adoption is real or merely implied by fundraising.
    - Review sales funnel, signed contracts, and deployment calendar.
  - - Benchmark packet
    - Independent latency, throughput, and cost-per-token results
    - Determines whether the product is actually investable against alternatives.
    - Obtain benchmark methodology and third-party validation.
  - - Cap table and preferences
    - Waterfall, option pool, debt, secondaries, and ratchets
    - Determines effective entry price and downside sharing.
    - Review financing docs and build a fully diluted waterfall model.
  - - Manufacturing economics
    - Yield, packaging assumptions, foundry commitments, and NRE spend
    - Tests whether gross margin can ever justify premium value.
    - Inspect BOM, yield model, and foundry or packaging agreements.
  - - Governance and exit readiness
    - Board structure, audit readiness, and disclosure plan
    - Shapes timing and plausibility of IPO versus strategic sale.
    - Review governance pack and reporting-readiness checklist.
  - - Cash runway
    - Monthly burn, scenario cash curve, and financing plan
    - Shows whether the company controls timing or must accept the next round it can get.
    - Request board budget, variance analysis, and minimum-cash covenants.
  notes: 'Every ask is valuation-critical: if management cannot satisfy these requests, the right outcome is lower price, stronger structure, or no deal.'
