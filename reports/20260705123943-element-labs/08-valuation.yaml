- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Type
  - Latest public value / round
  - Relevance to Element
  - Limitation
  rows:
  - - Astera Labs
    - Public company
    - ~$69.7B market cap; ~69.6x trailing sales
    - Shows how premium AI-semiconductor markets can value disclosed growth and margins.
    - Much later-stage, revenue-disclosed, and connectivity-led rather than stealth silicon.
  - - Marvell
    - Public company
    - ~$214.6B market cap; ~24.6x trailing sales
    - Useful boundary for a scaled data-infrastructure player selling into AI buildouts.
    - Broader portfolio and customer base make it a loose guardrail, not a direct comp.
  - - NVIDIA
    - Public company
    - ~$4.72T market cap; ~18.6x trailing sales
    - Defines the scale of incumbent economics and why a challenger must be differentiated.
    - Too large and too profitable to anchor Element’s direct fair value.
  - - Groq 2025 round
    - Private financing
    - Series financing at $6.9B post-money
    - Best direct premium-inference financing reference in the retained set.
    - Groq had more public platform evidence and a cloud footprint.
  - - Groq 2026 round
    - Private financing
    - $650M new growth capital; valuation not refreshed publicly
    - Shows investors still back inference infrastructure at large scale in 2026.
    - Does not provide a clean updated valuation marker.
  - - SambaNova 2026 round
    - Private financing
    - Series E of $350M+
    - Another funded inference platform with customer and partner claims.
    - Structure and exact post-money are not publicly specified here.
  - - Hailo 2026 reset
    - Adverse private comp
    - Valuation fell to under $500M from $1.2B peak
    - Shows how AI-chip value can compress when liquidity and commercialization disappoint.
    - Edge-AI profile differs from Element’s data-center inference story.
  - - Habana / Intel
    - M&A milestone
    - ~$2B acquisition in 2019
    - Proves that a differentiated AI-chip team can earn a strategic exit.
    - The later commercialization outcome under Intel was mixed, so the headline exit should not be romanticized.
  notes: Partial enumeration of the most decision-relevant public comparables and transactions retained for this chapter; the goal is directional framing, not a complete comp universe.
  enumerationScope:
    coverage: partial
    basis: Coverage is limited to retained direct URLs with usable public valuation, financing, or transaction evidence for AI-semiconductor and inference-adjacent peers as of the 2026 run date.
