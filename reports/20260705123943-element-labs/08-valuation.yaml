- id: exit-readiness-and-thesis-breaks
  title: Exit Readiness and Thesis-Break Triggers
  body: Element is not publicly exit-ready today. The business may eventually become IPO-worthy, but the open-web record still looks like a stealth deep-tech program rather than a company preparing to sustain public-market disclosure. Strategic interest is easier to imagine than immediate IPO readiness, particularly because hyperscalers and infrastructure vendors increasingly value integrated systems, rack design, and deployability alongside silicon. That does not mean a sale is imminent or even preferred; it means the most credible exit routes still depend on technical and commercial de-risking that the public cannot yet see. The thesis breaks if first silicon fails to hit target economics, if customer conversion stays anecdotal, or if the next financing requires punitive structure to bridge the gap between narrative and operating proof. Those are not remote edge cases in AI hardware. They are ordinary failure modes, and the valuation already leaves little room for them.
  claimRefs:
  - CV015
  - CV016
  - CV026
  - CV027
  - CV045
  - CV046
  - CV047
