  - TV005
- id: final-diligence-asks
  title: Final Diligence Asks and What Would Change the Call
  body: 'The good news is that the diligence agenda is clear. A better recommendation does not require generic “more information”; it requires a small set of specific private datapoints. First, the company must show a believable commercialization packet: named or masked anchor customers, contracted or near-contracted pipeline, and benchmark evidence tied to cost-per-token or latency outcomes. Second, the financing package must be unpacked: cap table, preference stack, debt, employee pool, and any secondary or ratchet features. Third, the team must show the bridge from tape-out to repeatable economics, not just the existence of a product roadmap. If those items are strong, the current valuation could move from unsupported to aggressive-but-rational. If they are weak, the current headline price is vulnerable. That is why the actionable message is simple: keep the company on the active list, but do not confuse financing momentum with validated fair value.'
