  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-proof-gap
    missingEvidence: Named customers, contracted pipeline, benchmark packets, or audited revenue disclosures for first deployments.
    whyItMatters: Without customer and revenue proof, investors are underwriting narrative momentum rather than demonstrated commercialization.
    diligencePath: Request board-approved pipeline, signed design-win documentation, cohort revenue bridge, and third-party benchmark decks under NDA.
    relatedQuestionRefs:
    - QV006
  - type: private-evidence-only
    severity: material
    topic: exit-readiness-gap
    missingEvidence: Board composition, audit maturity, disclosure readiness, and a credible timeline for when Element could sustain IPO-style reporting.
    whyItMatters: Public exit readiness drives both time-to-liquidity and whether a strategic sale is the only realistic outcome.
    diligencePath: Obtain governance package, auditor status, monthly close process detail, and management plan for customer disclosure thresholds.
    relatedQuestionRefs:
    - QV009
    - QV029
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Full cap table, liquidation preferences, debt terms, secondary sales, employee-option pool size, and any ratchets or pay-to-play clauses.
    whyItMatters: A high headline valuation can still produce weak outcomes for new money if preference stacks or future dilution absorb the upside.
    diligencePath: Review latest financing documents, pro forma cap table, debt schedules, and waterfall model before underwriting return potential.
    relatedQuestionRefs:
    - QV022
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table partial coverage
    missingEvidence: A fuller private-comp set with verified 2026 post-money values, revenue, and structure for peer inference-chip startups.
    whyItMatters: Private comp marks are episodic and often structure-dependent, so the comparable set is only directional rather than exhaustive.
    diligencePath: Expand the comp file with paid databases, direct investor references, and company counsel documents before anchoring an entry price.
    relatedQuestionRefs:
    - QV015
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: benchmark-and-economics-gap
    missingEvidence: Independent first-silicon results, cost-per-token data, yield assumptions, and early gross-margin bridge for Element’s own system.
    whyItMatters: Scenario ranges change materially if Element cannot show economics that justify displacement of GPU-centric alternatives.
    diligencePath: Request internal benchmark methodology, third-party validation, and product gross-margin model tied to foundry and packaging assumptions.
    relatedQuestionRefs:
    - QV024
