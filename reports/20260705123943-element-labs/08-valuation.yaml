- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Valuation range (USD M)
  - Core assumptions
  - Probability signal
  - What breaks or extends it
  rows:
  - - Bull
    - 5500-7500
    - Tape-out works, private diligence shows anchor customers, and Element demonstrates inference economics that justify hyperscaler adoption.
    - Possible but not public-evidence-led today.
    - Fails if the benchmark packet or customer proof is weak.
  - - Base
    - 2000-3500
    - Team and market remain valuable, but commercialization proof stays limited and future dilution remains real.
    - Most consistent with today’s public data.
    - Improves only if private KPI access closes the proof gap.
  - - Bear
    - 500-1500
    - Tape-out slips, concentration is narrow, or a bridge round resets price like other hardware names.
    - A real downside path, not a tail fantasy.
    - Becomes more likely if financing terms turn defensive or time-to-revenue extends.
  notes: Ranges are scenario estimates, not revenue-multiple outputs, because public Element revenue and margin data are unavailable.
