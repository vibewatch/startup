- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Founders
    - Repeat founders with a relevant $2B prior exit lower team risk.
    - Founder pedigree cannot replace product-market proof.
    - Show that prior network access converted into current customer adoption.
  - - Market
    - Inference demand and GPU alternatives remain strategic.
    - The same demand attracts far larger incumbents and hyperscaler custom silicon.
    - Prove a niche where Element wins on economics, not just ambition.
  - - Product
    - Tape-out funding and inference focus suggest a coherent roadmap.
    - No public benchmark, customer deployment, or software moat is visible.
    - Share first-silicon metrics and software-porting evidence.
  - - Capital
    - Follow-on investors were willing to scale the bet sharply in 2026.
    - Headline valuation may embed terms outsiders cannot yet see.
    - Disclose cap-table mechanics and financing structure.
  - - Comparables
    - Groq and SambaNova show that private capital still pays for inference platforms.
    - Hailo and Habana show that valuation resets and commercialization failures are common.
    - Demonstrate commercial traction closer to the winners than the casualties.
  - - Exit path
    - A strategic or IPO path exists in principle.
    - Public exit readiness is still weak and timing is opaque.
    - Add governance, disclosure, and customer concentration readiness.
  notes: Thesis rows separate company quality from price support; a strong thesis can still be a bad entry if proof and terms lag the valuation.
