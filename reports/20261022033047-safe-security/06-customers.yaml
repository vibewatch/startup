company:
  name: Safe Security
chapter:
  number: 6
  title: Customers
  summary: SAFE appears positioned for enterprise security teams and third-party-risk stakeholders, with company-reported adoption among large enterprises and a named roster that includes Google, Fidelity, T-Mobile, Chevron, and IHG. The evidence supports customer targeting and workflow fit more strongly than it supports production status, retention, expansion, or concentration.
sections:
  - id: enterprise-customer-profile
    title: Enterprise buyer and user profile
    body: SAFE's public product surfaces point to a buyer group consisting of enterprise security, cyber-risk, third-party-risk, and executive stakeholders. The product page describes intake, vendor due diligence, continuous vendor views, off-boarding, exposure prioritization, exploit validation, and agentic workflows; these are enterprise operating jobs rather than consumer features. SAFE's homepage says it is trusted by 10% of the Fortune 500, while the product page presents a 60M-plus enterprise database for vendor context. Those are company-controlled statements and should be treated as positioning and scale signals, not audited customer counts. Independent funding coverage reports a client roster including Google, Fidelity, T-Mobile, Chevron, and IHG, but does not identify contract scope, deployment depth, revenue contribution, or whether each relationship is active. The likely economic buyer is a CISO or cyber-risk leader, with procurement, vendor owners, infrastructure teams, and business executives as users or stakeholders. The evidence does not disclose pricing, contract duration, implementation effort, or channel mix, leaving the commercial motion and payer-versus-user split unresolved.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption signals and named-customer proof
    body: The strongest adoption evidence is a combination of SAFE's own enterprise-trust statement and two independent news reports repeating a named customer roster and total funding. The reports describe SAFE as founded in 2020 and as delivering CRQ, autonomous TPRM, and CTEM, but they do not provide customer-level outcome data, active-seat counts, locations, utilization, renewal rates, or cohort behavior. The roster therefore supports named commercial references at the relationship level, not a conclusion that every logo is a production deployment. A customer-owned T-Mobile security page is useful for understanding the type of security and account-protection environment an enterprise operator manages, but it does not mention SAFE and cannot validate SAFE usage. SAFE's product claims of continuous vendor correlation, 20-plus off-boarding workflows, and 100-plus specialized agents describe the proposed operating model; they do not establish delivered outcomes for the named customers. The available evidence is consequently sufficient for a customer-proof inventory with explicit limitations, but not for a defensible adoption trajectory or retention calculation.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration diligence
    body: No assigned source reports SAFE's NRR, GRR, churn, renewal rate, contract length, cohort retention, customer concentration, or revenue by account. The financing coverage repeats SAFE's claim of consistent 120%-plus year-over-year growth since launch, but that metric is not defined by revenue, customers, bookings, or another denominator and is not corroborated by a filing. Similarly, the product pages describe cross-workflow coverage across CRQ, TPRM, and CTEM, but do not establish that customers expand from one module to another. The Balbix acquisition reporting indicates SAFE intends to unify exposure management with cyber-risk quantification; this may broaden the enterprise use case, but the acquisition price, integration timeline, customer overlap, and cross-sell results are not disclosed. The named roster spans large enterprises and may indicate reference quality, yet the same concentration cannot be quantified from the available evidence. Diligence should request a customer-level revenue bridge, logo and dollar retention cohorts, deployment stage, implementation time, module attach rates, top-10 revenue share, and churned-customer list under confidentiality.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    callouts:
      - calloutType: risk
        title: Retention and concentration are unverified
        body: Named logos and a company-reported growth rate do not establish recurring revenue durability, expansion, or customer concentration; these remain material diligence gaps.
        claimRefs: [CU012, CU013, CU016]
