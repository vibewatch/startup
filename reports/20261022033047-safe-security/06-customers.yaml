figures:
  - id: FU001
    title: Customer journey from risk intake to expansion
    type: journey-map
    summary: Enterprise security stakeholders can move from intake and exposure understanding to prioritized action, ongoing vendor management, and potential multi-workflow expansion; only the first three stages are directly evidenced as product behavior.
    data:
      nodes:
        - name: "1. Intake and context"
          label: "Intake and context"
          touchpoints: ["Vendor intake", "Business and asset context"]
          detail: "SAFE describes intelligent intake and a 60M+ enterprise database for context."
        - name: "2. Quantify exposure"
          label: "Quantify exposure"
          touchpoints: ["CRQ", "Business-impact framing"]
          detail: "SAFE and coverage describe cyber-risk quantification as a platform foundation."
        - name: "3. Prioritize and validate"
          label: "Prioritize and validate"
          touchpoints: ["25+ prioritization parameters", "Exploit validation"]
          detail: "SAFE describes dynamic prioritization and exploit mutation and validation."
        - name: "4. Act and remediate"
          label: "Act and remediate"
          touchpoints: ["Agentic workflows", "Remediation coordination"]
          detail: "The product and acquisition pages describe workflows that coordinate action."
        - name: "5. Monitor lifecycle"
          label: "Monitor lifecycle"
          touchpoints: ["Continuous vendor correlation", "Off-boarding"]
          detail: "SAFE describes continuous vendor views and audit-ready off-boarding."
        - name: "6. Expand across workflows"
          label: "Expand across workflows"
          touchpoints: ["CRQ", "TPRM", "CTEM"]
          detail: "Cross-module expansion is a commercial hypothesis, not a measured retention result."
    claimRefs: [CU001, CU002, CU011, CU014]
callouts:
  - calloutType: strength
    title: Enterprise reference quality is plausible
    body: Independent reports name Google, Fidelity, T-Mobile, Chevron, and IHG as customers, while SAFE claims Fortune 500 reach; the evidence supports a credible enterprise target profile but not account-level depth.
    claimRefs: [CU003, CU006, CU007]
  - calloutType: assumption
    title: Treat logos as relationship evidence only
    body: The assigned evidence does not distinguish pilot from production, disclose outcomes, or quantify active use, so customer durability should remain an open diligence question.
    claimRefs: [CU010, CU012, CU016]
