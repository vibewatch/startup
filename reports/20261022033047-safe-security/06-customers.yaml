      - [Fidelity, Financial-services enterprise, SAFE customer roster, null, "Named by two independent funding reports", "No contract, product module, deployment stage, outcome, or freshness beyond 2025 report"]
      - [T-Mobile, Telecommunications enterprise, SAFE customer roster; customer-owned page independently documents a security operating context, pilot or production not stated, "Named by two independent funding reports", "T-Mobile page does not mention SAFE; no outcome or contract evidence"]
      - [Chevron, Large enterprise, SAFE customer roster, null, "Named by two independent funding reports", "No contract, product module, deployment stage, outcome, or freshness beyond 2025 report"]
      - [IHG, Hospitality enterprise, SAFE customer roster, null, "Named by two independent funding reports", "No contract, product module, deployment stage, outcome, or freshness beyond 2025 report"]
    notes: "This is a partial, source-bounded enumeration of named logos; logos do not prove active production deployment, retention, revenue, or customer satisfaction."
