callouts:
  - calloutType: insight
    title: The market is converging, not cleanly bounded
    body: >-
      CRQ, TPRM, and CTEM are increasingly sold as connected workflows, but
      overlapping category definitions make broad TAM figures unsuitable for
      direct valuation. Safe Security's opportunity is better assessed through
      buyer workflow expansion and verified recurring economics than through one
      headline market number.
    claimRefs: [CM001, CM003, CM004]
  - calloutType: risk
    title: Adoption proof remains the central market diligence gap
    body: >-
      Assigned sources describe category demand and competitor expectations, but
      do not independently establish Safe Security's win rate, retention,
      realized pricing, or share. Those missing denominators constrain any
      company-specific SAM, SOM, or valuation conclusion.
    claimRefs: [CM003, CM010, CM014]
