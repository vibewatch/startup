    title: Recommendation logic
    type: flow
    summary: "The recommendation follows from evidence quality, market context, unresolved valuation inputs, and downside discipline."
    data:
      nodes:
        - {id: scale-proof, label: "Scale and category proof", note: "Financing, product expansion, and market signals"}
        - {id: market-context, label: "Cybersecurity market context", note: "Wiz acquisition and Netskope IPO comparables"}
        - {id: missing-denominator, label: "Missing valuation denominator", note: "No current audited ARR, revenue, margins, or post-money valuation"}
        - {id: downside, label: "Downside and dilution tests", note: "Cap table, preferences, burn, retention, and concentration"}
        - {id: entry-discipline, label: "Entry discipline", note: "Require verified metrics and price protection"}
        - {id: track, label: "Track", note: "Monitor until underwriting evidence clears"}
      edges:
        - {from: scale-proof, to: market-context}
        - {from: market-context, to: missing-denominator}
        - {from: missing-denominator, to: downside}
        - {from: downside, to: entry-discipline}
        - {from: entry-discipline, to: track}
    claimRefs: [CV006, CV016]
callouts:
  - calloutType: recommendation
    title: Track, do not price from headline funding
    body: The evidence supports continued diligence but not a buy recommendation. SAFE's $70 million Series C and reported category expansion are positive signals, while the absence of current audited revenue, ARR, margins, retention, post-money valuation, and preference terms makes a precise entry price unsupported.
    claimRefs: [CV001, CV002, CV011, CV012]
  - calloutType: risk
    title: Information asymmetry is itself an underwriting risk
    body: Company-issued growth and adoption claims are not substitutes for audited or board-approved financial evidence. A down-round, dilution, weak retention, or customer concentration could materially change return outcomes before an exit.
    claimRefs: [CV003, CV004, CV014, CV015, CV016]
