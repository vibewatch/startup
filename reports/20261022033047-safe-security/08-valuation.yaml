  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Category expansion", "SAFE announced CRQ, TPRM, and CTEM platform expansion", "Independent customer adoption and renewal data by module"]
      - ["Financing support", "Series C funding was announced at $70 million", "Round valuation, cap table, preferences, and use-of-proceeds disclosure"]
      - ["Growth potential", "Investor and company materials report 120%+ year-over-year growth", "Audited revenue bridge, ARR definition, cohort retention, and margin data"]
      - ["Exit optionality", "Wiz acquisition and Netskope IPO demonstrate cybersecurity exit routes", "SAFE scale, strategic interest, and public-company readiness evidence"]
    notes: "Company-issued metrics are treated as company-claimed; market transactions are context rather than direct valuation comparables."
    claimRefs: [CV003, CV004, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Verified high growth, durable retention, expanding multi-module adoption, efficient sales", "Use validated ARR or revenue with a premium growth multiple; target return depends on entry price", "Execution, AI commercialization, and competitive intensity", "Low until audited metrics are provided"]
      - [Base, "Demand persists but growth and margins normalize; disclosure remains incomplete", "Apply an information discount and require a lower entry price or stronger protections", "Dilution, preference overhang, and multiple compression", "Most plausible on current evidence"]
      - [Bear, "Growth decelerates, retention weakens, or capital needs require a down round", "Capital impairment or negative return is possible; do not underwrite upside without downside protection", "Customer concentration, burn, and failed commercialization", "Material downside cannot be quantified publicly"]
      - [Trigger, "Any scenario requires current cap table, MRR/ARR bridge, margins, burn, and cohorts", "No dollar range is supportable until denominators and security terms are verified", "Missing evidence itself is an underwriting risk", "Blocking diligence condition"]
    notes: "Scenario logic is qualitative because the assigned pool does not disclose SAFE's current ARR, revenue, margin, cash, valuation, or cap-table terms; dollar precision would be fabricated."
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
