company:
  name: Safe Security
chapter:
  number: 1
  title: Company Overview
  summary: Safe Security is a Series C cyber-risk software company whose current positioning spans cyber-risk quantification, third-party risk management, continuous threat-exposure management, and AI security posture management. The assigned evidence supports recent financing and acquisition-led product expansion, but it does not establish valuation, audited operating metrics, a complete governance roster, or the economics and progress of acquired-business integration.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: >-
      Safe Security markets an enterprise platform that turns security telemetry and
      business context into cyber-risk decisions. Its official TPRM page describes a
      five-stage vendor lifecycle covering intake, due diligence, remediation,
      continuous monitoring, and offboarding, while a company-authored job repost
      describes customer-deployed sensors for asset discovery, vulnerability
      detection, exposure validation, and secure cloud telemetry. The job profile
      places the company in Palo Alto and labels it Series C with 501-1,000 employees,
      but those directory-style fields are not independently audited. Founding-year
      evidence is internally inconsistent: the profile says 2012, whereas a 2025
      financing article says 2020. The latter may reflect the current platform launch
      rather than the original corporate lineage, but the supplied sources do not
      resolve that distinction.
    claimRefs: [CO001, CO002, CO003, CO004, CO008, CO009]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance visibility
    body: >-
      FinTech Global identifies Saket Modi as chief executive and co-founder, making
      him the only current SAFE founder explicitly identified by the assigned
      evidence. SiliconANGLE reports that Balbix founder Gaurav Banga joined SAFE as
      president of continuous threat exposure management following the acquisition.
      The FAIR Institute separately recorded Modi joining its board when RiskLens
      joined SAFE; that external board role indicates industry-ecosystem influence,
      not governance authority over SAFE itself. No source in the pool provides a
      current SAFE board roster, executive team census, voting-rights schedule, or
      succession plan. The visible evidence therefore suggests meaningful dependence
      on named founder and acquired-company leadership, but it cannot quantify
      key-person risk or decision control.
    claimRefs: [CO011, CO012, CO013]
    tableRefs: [TO002]
  - id: capital-and-strategic-expansion
    title: Funding, investors, and acquisition-led expansion
    body: >-
      FinTech Global reports a $70 million Series C led by Avataar Ventures, with
      Susquehanna Asia Venture Capital, NextEquity Partners, Prosperity7 Ventures,
      Eight Roads, John Chambers, and Sorenson Capital also named. It reports more
      than $170 million raised in total, while the company profile on Simplify lists
      $162.2 million, a discrepancy that could reflect timing, scope, debt, or
      database methodology and should not be silently normalized. SiliconANGLE
      reports that SAFE acquired Balbix on November 18, 2025 for an undisclosed sum.
      RiskLens had previously joined SAFE, adding FAIR-linked quantification
      capabilities. These transactions support a product-consolidation thesis, but
      the pool contains no primary financing documents, cap table, secondary pricing,
      debt schedule, purchase price, retention package, or integration scorecard.
    claimRefs: [CO005, CO006, CO007, CO010, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: scale-signals-and-diligence-risk
    title: Scale signals, category context, and diligence risk
    body: >-
      SAFE and its job repost both claim service to 10% of the Fortune 500, but the
      denominator, contract status, and revenue contribution are not disclosed.
      Forrester describes the broader CRQ category as expanding into exposure
      management and TPRM, while Mordor Intelligence includes Safe Security among
      industry leaders; these independent category signals support strategic
      relevance without proving SAFE's market share or economics. A SafeBreach
      explainer also frames CTEM as a cycle of scoping, discovery, prioritization,
      validation, and mobilization, consistent with the workflow breadth SAFE is
      pursuing. Adverse evidence is weak: Simplify's editorial section alleges that
      Balbix integration problems could slow renewals, but supplies no methodology or
      corroboration. That allegation should be investigated rather than treated as an
      established incident, especially because the adverse search queries returned no
      retained independent result.
    claimRefs: [CO008, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Broad enterprise cyber-risk scope
    body: SAFE's sourced product scope spans quantified risk, vendor risk, exposure management, and AI security posture, with acquisitions adding adjacent capabilities.
    claimRefs: [CO001, CO009, CO010, CO013, CO015]
  - calloutType: risk
    title: Private-company transparency remains the binding gap
    body: Funding and customer-scale signals are visible, but valuation, revenue quality, retention, governance control, and acquisition economics remain unsupported by the assigned evidence.
    claimRefs: [CO006, CO007, CO008, CO016]
