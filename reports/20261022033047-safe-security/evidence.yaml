evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: Primary corporate records that reconcile the 2012 and 2020 founding-year claims.
    whyItMatters: >-
      The unresolved chronology obscures whether 2020 marks a rebrand, platform launch, or new legal entity rather than
      original founding.
    diligencePath: Request the certificate of incorporation, historical entity chart, and dated product-launch records.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Current valuation, preferred terms, cap table, debt, secondary transactions, audited revenue or ARR, growth, gross
      margin, NRR, and CAC/LTV.
    whyItMatters: >-
      Funding raised is not cash available, and no valuation or operating denominator can be inferred from the disclosed
      round alone.
    diligencePath: >-
      Request the latest financing documents, fully diluted cap table, cash and debt schedule, and board-approved KPI
      package under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      A complete current executive team, SAFE board roster, observer rights, founder ownership, voting control, and
      succession plan.
    whyItMatters: Two visible leaders are insufficient to assess functional coverage, control, or resilience to key-person loss.
    diligencePath: Obtain the organization chart, board and observer roster, voting agreement, and succession or retention plans.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: acquisition
    missingEvidence: >-
      Balbix and RiskLens purchase prices, retention terms, integration milestones, customer overlap, churn, and
      realized cross-sell.
    whyItMatters: >-
      The strategic fit is visible, but acquisition economics and integration execution determine whether breadth
      creates value or complexity.
    diligencePath: >-
      Request transaction documents and a monthly integration scorecard covering product, people, pipeline, renewals,
      and synergies.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse
    missingEvidence: >-
      Independent legal, regulatory, incident, outage, and customer-retention evidence that can confirm or rebut the
      uncorroborated integration allegation.
    whyItMatters: The absence of a retained adverse result is not proof that no material incident or integration problem exists.
    diligencePath: >-
      Run counsel-assisted litigation and regulatory searches, review status-page history, and obtain renewal cohorts
      and post-acquisition customer references.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: company-market-proof
    missingEvidence: Safe Security-specific customer cohort, win-rate, retention, pricing, and market-share data.
    whyItMatters: >-
      Category growth cannot be converted into company-specific SAM, SOM, or valuation support without adoption
      denominators.
    diligencePath: >-
      Request a segmented customer list, ARR bridge, retention cohorts, ACV distribution, win-loss data, and competitive
      displacement evidence under NDA.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: SAM-SOM
    missingEvidence: A buyer-count and spend-based serviceable market model separating CRQ, TPRM, CTEM, and overlapping budgets.
    whyItMatters: >-
      Published category estimates use different boundaries and proprietary methods, preventing a defensible
      obtainable-share calculation.
    diligencePath: >-
      Build a bottom-up model from target geographies, enterprise counts, qualified accounts, expected ACV, attach
      rates, and product overlap, then reconcile it to external category estimates.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: adoption-constraints
    missingEvidence: >-
      Independent evidence on buyer implementation duration, integration burden, and budget approval friction for CRQ,
      TPRM, and CTEM platforms.
    whyItMatters: >-
      These factors determine sales-cycle length, deployment cost, and whether category growth converts into recurring
      software revenue.
    diligencePath: >-
      Interview current and lost buyers across security, procurement, risk, and finance and compare implementation
      timelines with renewal outcomes.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: private-evidence-only
    severity: material
    topic: switching-and-lock-in
    missingEvidence: >-
      Customer-level migration effort, implementation duration, renewal uplift, module adoption, replacement behavior,
      and multi-homing data.
    whyItMatters: >-
      These measures determine whether integrations and risk history create durable switching costs or only feature
      breadth.
    diligencePath: >-
      Review renewal cohorts and lost-account interviews, then sample implementation records for customers replacing
      GRC, CRQ, BAS, or exposure tools.
    relatedQuestionRefs:
      - QP009
  - type: missing-source
    severity: material
    topic: commercial-competition
    missingEvidence: >-
      Current win-loss records, realized prices, discount bands, contract minima, retention by module, and independently
      verified customer outcomes.
    whyItMatters: >-
      Without commercial evidence, vendor-authored capability breadth cannot establish pricing power or sustainable
      competitive advantage.
    diligencePath: >-
      Obtain the trailing-24-month CRM win-loss export, anonymized order forms, renewal cohorts, and reference calls
      covering wins against Tenable and specialist vendors.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: blocking
    topic: pricing-gap
    missingEvidence: A contract-level view of price, recurring versus services revenue, discounts, renewals, and module attach rates.
    whyItMatters: >-
      Without realized pricing and revenue mix, platform breadth cannot be translated into revenue quality or gross
      margin.
    diligencePath: >-
      Obtain a customer-level ARR bridge, representative order forms, billing exports, renewal cohorts, and services
      revenue separation.
    relatedQuestionRefs:
      - QI002
      - QI001
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy-gap
    missingEvidence: Cash, monthly burn, runway, debt, acquisition consideration, and the next financing trigger.
    whyItMatters: >-
      Funding raised is not cash available, and undisclosed acquisition or debt obligations can materially change
      dilution and liquidity risk.
    diligencePath: >-
      Request the latest balance sheet, cash reconciliation, twelve-month cash forecast, debt schedule, acquisition
      agreements, and use-of-funds plan.
    relatedQuestionRefs:
      - QI006
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Audited or independently reconciled ARR, gross margin, CAC payback, sales cycle, and net revenue retention.
    whyItMatters: >-
      These metrics determine whether SAFE's enterprise platform can scale with software-like economics rather than
      rising delivery costs.
    diligencePath: >-
      Reconcile management KPIs to the general ledger and inspect logo and dollar cohorts by product and customer
      segment.
    relatedQuestionRefs:
      - QI003
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: minor
    topic: acquisition
    missingEvidence: Public or private disclosure of the Balbix transaction price and integration budget.
    whyItMatters: The acquisition may add capability but can also consume cash and defer margin expansion.
    diligencePath: Request the purchase agreement summary, consideration schedule, earn-out terms, and integration plan.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: deployment-reliability
    missingEvidence: >-
      Independent uptime, incident, latency, false-positive, and autonomous-action approval metrics for representative
      SAFE One deployments.
    whyItMatters: >-
      The product thesis depends on continuous, autonomous workflows, but public descriptions do not show whether they
      are reliable or safe at production scale.
    diligencePath: >-
      Request a security and reliability data room with SLA history, incident reports, evaluation protocols, rollback
      tests, and customer references.
    relatedQuestionRefs:
      - QE004
      - QE007
      - QE009
  - type: missing-source
    severity: material
    topic: differentiation-validation
    missingEvidence: >-
      Independent benchmark or customer evidence testing whether SAFE's data normalization and risk models outperform
      alternative CRQ and exposure-management workflows.
    whyItMatters: >-
      Category positioning and standards alignment do not by themselves establish durable technical differentiation or
      superior outcomes.
    diligencePath: >-
