      severity: material
      topic: differentiation-validation
      missingEvidence: "Independent benchmark or customer evidence testing whether SAFE's data normalization and risk models outperform alternative CRQ and exposure-management workflows."
      whyItMatters: "Category positioning and standards alignment do not by themselves establish durable technical differentiation or superior outcomes."
