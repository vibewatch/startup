      - ["Automation", "Agentic workflows across CTEM and TPRM claimed", "Hexa AI multi-step orchestration with human oversight claimed", "Automation depth not established in assigned source", "Internal automation depends on integration and engineering capacity"]
      - ["Independent comparative proof", "Forrester validates category expansion, not SAFE-specific superiority", "No head-to-head benchmark in assigned source", "No head-to-head benchmark in assigned source", "No comparable outcome baseline in assigned evidence"]
    notes: "Cells summarize disclosed capabilities, not tested performance; unknown means the assigned prefetched evidence did not establish the capability."
    claimRefs: [CP001, CP002, CP003, CP004, CP012, CP013, CP014]
