      - ["DORA and NIS2 structured ICT-risk expectations", "European Union", "Ongoing regime", "Medium", "High", "Standards-oriented CRQ positioning", "Medium-high", "Confirm regional hosting, retention, and customer control mappings"]
      - ["Privacy restrictions on breach and telemetry data used for models", "Multi-jurisdiction", "Ongoing constraint", "Medium", "High", "Customer and vendor data controls are asserted but not scoped here", "High", "Review DPAs, sub-processors, residency, deletion, and lawful-basis records"]
      - ["Private litigation after a cyber incident or disputed security statement", "United States and other markets", "Fact-dependent", "Medium", "High", "Public product architecture is described, but statement-substantiation controls are not evidenced", "Medium-high", "Obtain insurance, claim history, and statement-substantiation files"]
      - ["IP or integration disputes arising from acquired technology", "Multi-jurisdiction", "Not disclosed", "Low-medium", "Material", "Acquisition integration and partner governance", "Medium", "Review Balbix and RiskLens IP, licenses, and indemnities"]
    enumerationScope:
      coverage: partial
      basis: Public regulatory and legal material available in the assigned pool as of the 2026-10-22 run date
    notes: >-
      The register covers material public-law and private-law pathways, not a complete legal
      opinion or a confirmed case list for Safe Security.
    claimRefs: [CR006, CR007, CR008, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Customer and third-party telemetry", "Enterprise customers and vendors", "Inputs to knowledge graph and TPRM", "Potentially high", "Missing or restricted data degrades prioritization and quantification", "High", "Integrations and continuous ingestion are part of the product architecture", "Medium-high"]
      - ["Risk quantification methodology and data lineage", "RiskLens / FAIR ecosystem / Cyentia-related inputs", "CRQ calibration and standards alignment", "High for CRQ credibility", "Model assumptions or licensing change weakens trust and comparability", "High", "RiskLens acquisition and FAIR Institute relationship", "Medium-high"]
      - ["Exposure-management capability", "Balbix technology and integration work", "CTEM and attack-surface coverage", "Medium-high", "Integration delays or defects fragment the platform", "High", "SiliconANGLE reports the acquisition as a unification move", "Medium-high"]
      - ["Cloud, identity, and security-control infrastructure", "Unspecified providers", "Platform availability and protected data processing", "Unknown", "Provider outage or control failure interrupts service or exposes data", "High", "No provider map or control-scope evidence appears in the assigned pool", "High until scope and provider map are reviewed"]
      - ["Specialist cyber and AI talent", "Labor market", "Product delivery and model governance", "Potentially high", "Hiring scarcity delays roadmap, assurance, and incident response", "Medium-high", "Techstrong reports 38% of surveyed organizations identified cybersecurity engineers as hard to fill", "Medium-high"]
    notes: >-
      Counterparty concentration and service-level fields are not disclosed in the assigned
      evidence; “Unknown” and “Potentially high” preserve that uncertainty rather than implying a
      measured percentage.
    claimRefs: [CR010, CR011, CR012, CR013, CR015]

figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Relative residual exposure rises where autonomous action, sensitive telemetry, or acquisition integration combine with limited public assurance evidence.
    data:
      columns:
        - label: Severity
        - label: Likelihood
        - label: Residual exposure
      rows:
        - label: Autonomous action from bad inputs
          values: [5, 3, 5]
          detail: "High residual exposure pending error-rate and approval evidence"
        - label: Non-reproducible CRQ outputs
          values: [4, 3, 4]
          note: "Trial counts and seed handling are not publicly disclosed"
        - label: Telemetry privacy or residency constraint
          values: [4, 3, 5]
          note: "Model granularity may fall when incident data cannot be shared"
        - label: Acquisition integration failure
          values: [4, 3, 4]
          note: "Balbix and RiskLens integration outcomes require verification"
        - label: Cybersecurity talent scarcity
          values: [3, 4, 4]
          note: "External survey evidence is sector-wide, not Safe-specific"
        - label: Disclosure or litigation mismatch
          values: [5, 3, 4]
          note: "SolarWinds illustrates scrutiny pathways, not a Safe incident"
    approximationNotes: >-
      Scores are ordinal analytical ratings on a 1–5 scale derived from the chapter's cited
      evidence and explicit gaps; they are not probabilities or measured incident frequencies.
    claimRefs: [CR002, CR008, CR010, CR014, CR015, CR016]

callouts:
  - calloutType: risk
    title: Evidence opacity is itself an investment risk
    body: >-
      Safe's public materials describe broad autonomous capabilities and standards-oriented
      category practices, but the assigned evidence does not disclose model error rates, incident history,
      reproducible trial settings, churn, NRR, burn, runway, or customer concentration.
    claimRefs: [CR002, CR004, CR015]
  - calloutType: recommendation
    title: Gate expansion on assurance evidence
    body: >-
      Before treating the platform breadth or acquisition strategy as de-risking, require a
      control-scope package, incident and uptime history, model-validation evidence, data-rights
      map, and customer references that demonstrate production remediation outcomes.
    claimRefs: [CR009, CR011, CR014]

