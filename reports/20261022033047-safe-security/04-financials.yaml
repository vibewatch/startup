callouts:
  - calloutType: risk
    title: Underwriting gap
    body: SAFE's funding history is visible, but cash available, burn, runway, ARR, margin, retention, and acquisition obligations are not disclosed in the assigned evidence.
    claimRefs: [CI005, CI006, CI010, CI011, CI012, CI013, CI014]
  - calloutType: insight
    title: Monetization optionality
    body: A multi-module platform can support land-and-expand economics, but the assigned sources do not show realized pricing, module attach, or renewal performance.
    claimRefs: [CI001, CI002, CI003, CI004]

