      - [Gross margin, null, low, "Separates software leverage from service-delivery intensity", "COGS by hosting, personnel, support, and implementation"]
      - [CAC payback and sales cycle, null, low, "Tests whether enterprise GTM can compound efficiently", "Cohort bookings, fully loaded CAC, cycle length, payback"]
      - [Net revenue retention, null, low, "Tests module expansion and customer durability", "Logo and dollar retention cohorts with contraction detail"]
      - ["Cash, burn, and runway", null, low, "Determines financing dependency and next-round timing", "Monthly cash ledger, burn bridge, runway case, financing trigger"]
      - [Debt and acquisition obligations, null, low, "Identifies senior claims and integration cash needs", "Debt schedule, acquisition consideration, earn-outs, integration budget"]
    notes: "No assigned successful source discloses SAFE operating or liquidity metrics; null is an explicit diligence gap, not zero."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]

