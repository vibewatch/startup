  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and category convergence
        blocks:
          - type: paragraph
            body: >-
              SAFE competes across several overlapping budgets rather than within a single stable category. Forrester
              describes CRQ vendors extending from quantification into exposure management, third-party risk, control
              monitoring, insurance, and compliance, while Mordor Intelligence characterizes the market as moderately
              fragmented but consolidating. The direct set includes CRQ and scoring vendors such as Bitsight,
              SecurityScorecard, Kovrr, and the RiskLens capability now inside SAFE. Tenable is a scaled
              exposure-management incumbent, SafeBreach represents validation-led CTEM, and GRC suites, security-tool
              aggregation, spreadsheets, and internal FAIR programs remain substitutes. This breadth increases SAFE's
              addressable workflow, but it also puts the company against vendors with established telemetry,
              distribution, or specialist credibility.
            claimRefs:
