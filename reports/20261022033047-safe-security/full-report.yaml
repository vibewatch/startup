  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              SAFE One is described as an enterprise cyber-risk platform spanning third-party risk management (TPRM),
              continuous threat exposure management (CTEM), AI security posture management (AI-SPM), and cyber-risk
              quantification (CRQ). The product workflow is presented as ingesting business context, threat
              intelligence, attack-surface data, and controls; reasoning over that context; and producing
              prioritization, reporting, and remediation actions. The 2025 platform datasheet describes 150+ MCP/API
              connectors and 100+ AI agents, while the acquisition announcement says Balbix exposure data is being
              combined with SAFE's quantification model. These are company materials and should be treated as product
              claims rather than independently measured performance. Customer quotations in the datasheet and the
              acquisition release provide directional usability evidence, but they do not disclose deployment size,
              retention, service levels, or measurable risk reduction.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
