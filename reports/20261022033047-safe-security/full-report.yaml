      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              SAFE's disclosed financing history indicates access to venture capital, but funding raised is not cash
              available. The current pool contains no SAFE balance sheet, cash-on-hand figure, burn rate, debt schedule,
              runway calculation, or next-round trigger. The market evidence also indicates that quantitative cyber-risk
              platforms face data-quality and privacy constraints: one market report says fragmented data pools can
              lower model granularity and prediction accuracy. That limitation is commercially relevant because it can
              increase implementation effort and constrain margin expansion even when demand is supported by regulatory
              and insurer use cases. SAFE can reasonably be underwritten as a capital-dependent private software company
              with strategic optionality, not as a business with proven self-funding economics. Before an investment
              decision, request monthly recurring revenue or contracted ARR reconciliation, cohort retention,
              gross-margin bridge, cash and restricted cash, debt and acquisition obligations, and a use-of-funds plan.
            claimRefs:
