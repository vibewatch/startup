      - number: '3.2'
        title: Capability and distribution contest
        blocks:
          - type: paragraph
            body: >-
              SAFE's differentiation claim is an integrated, agentic loop. Its CTEM page spans scoping, discovery,
              prioritization, validation, and mobilization, while its TPRM materials cover intake through offboarding
              and describe more than 100 AI agents. That product breadth is meaningful, but the underlying workflows are
              contested. Tenable One says it combines 300-plus integrations with broad first-party exposure coverage and
              an agentic orchestration layer. SafeBreach positions breach-and-attack simulation as a critical validation
              component of CTEM. The competitive question is therefore whether SAFE's CRQ-centered business context
              produces better decisions than an incumbent's native sensor estate or a specialist's deeper validation.
              Public materials describe capabilities, not controlled performance comparisons, deployment effort, or
              customer switching behavior.
            claimRefs:
