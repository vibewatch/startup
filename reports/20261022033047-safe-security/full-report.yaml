      - number: '3.3'
        title: Pricing, switching, and buyer control
        blocks:
          - type: paragraph
            body: >-
              The reviewed product pages do not publish list prices, contract minima, or realized discounting, so no
              defensible price-per-vendor, price-per-asset, or platform-total-cost comparison is available. Packaging
              may matter as much as nominal price: SAFE can sell a cross-workflow risk narrative, Tenable can use
              platform consolidation and its installed exposure stack, and SafeBreach can enter through validation.
              Switching costs should arise from integrations, normalized asset and vendor histories, risk models,
              approval workflows, and board reporting, but the assigned evidence does not quantify migration effort or
              show exclusive data rights. Multi-homing remains plausible because an enterprise can retain scanners, BAS,
              GRC, and CRQ tools together. Buyers should demand total-cost and coexistence evidence rather than infer
              lock-in from broad feature claims.
            claimRefs:
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              SAFE has used acquisitions to deepen its platform: RiskLens added FAIR-linked quantification expertise,
              and the Balbix transaction added exposure discovery, prioritization, and remediation assets. SiliconANGLE
              reported that Balbix had raised $100 million before the acquisition, indicating that SAFE absorbed a
              developed competitor rather than only a small feature team. SAFE also had reportedly raised more than $170
              million after its 2025 Series C, giving it resources to integrate these assets. The adverse case is that
              integration does not itself create durable advantage. Forrester says more vendors are entering CRQ and
              capabilities are spreading into adjacent markets, while the same five-stage CTEM model is available to
              incumbent and specialist ecosystems. Durability therefore depends on verified outcome quality, proprietary
              risk data, deployment speed, renewal strength, and distribution leverage that are not established in this
              public evidence set.
            claimRefs:
