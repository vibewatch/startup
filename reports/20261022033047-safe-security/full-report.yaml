      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer is usually an enterprise security or risk function, but the economic decision is
              cross-functional. CISOs and security operations teams need continuous visibility, prioritization, and
              remediation; third-party risk teams need vendor inventory, evidence collection, and monitoring; boards,
              finance, procurement, insurers, and regulators are downstream stakeholders that need defensible business
              impact. Tenable's market-facing description illustrates the enterprise workflow buyers increasingly
              expect: unify surfaces and signals, correlate attack paths, translate exposure into business insight, and
              activate prioritized actions. SecurityScorecard's competing TPRM description similarly emphasizes
              continuous monitoring, workflow automation, and remediation. These competitor descriptions are evidence of
              category expectations, not independent validation of Safe Security's performance. The FAIR Institute, a
              Safe-linked industry partner, reported a quantitative-risk community approaching 15,000 members across
              more than 100 countries; that indicates a broad standards ecosystem, not buyer conversion. Adoption is
              therefore likely to begin with a painful workflow such as annual questionnaires or disconnected exposure
              data, then expand into continuous monitoring and financially expressed risk.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by the operational shift from periodic assessment to continuous risk reduction. Mordor
              identifies regulatory disclosure pressure, cyber-insurance analytics, AI-driven financial-impact modeling,
              board pressure for monetary risk language, and supply-chain attacks as directional growth drivers.
              Security Boulevard's summary of Gartner's CTEM framework defines a cycle of scoping, discovery,
              prioritization, validation, and mobilization, and cites Gartner's forecast that organizations prioritizing
              security investment through CTEM by 2026 would be three times less likely to suffer a breach; this is a
              reported forecast, not an observed outcome. Constraints are equally material: Mordor flags absent modeling
              standards, data-privacy restrictions, scarce FAIR-certified talent, and immature generative-AI
              credibility. Safe Security's own materials claim automation and scale, but they are company-issued. For
              valuation, the implication is a potentially expanding category with execution risk around proof,
              integration, explainability, and budget consolidation; audited revenue, retention, and customer-level
              adoption data remain unavailable in this pool. models as category restraints. Independent coverage of
              Safe's acquisition of Balbix shows the company is using product consolidation to address the converging
              workflow, while the undisclosed purchase price and absent adoption data prevent an economic assessment of
              that expansion.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is converging, not cleanly bounded
            body: >-
              CRQ, TPRM, and CTEM are increasingly sold as connected workflows, but overlapping category definitions
              make broad TAM figures unsuitable for direct valuation. Safe Security's opportunity is better assessed
              through buyer workflow expansion and verified recurring economics than through one headline market number.
