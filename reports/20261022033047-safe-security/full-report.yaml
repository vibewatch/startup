            body: >-
              The evidence supports the existence of a funded, expanding product platform, but not the numerical inputs
              needed for a valuation or liquidity model. Comparable-company margin data are directional only:
              Macrotrends reports Zscaler's trailing gross margin at 76.84% on July 31, 2025, but Zscaler is a public
