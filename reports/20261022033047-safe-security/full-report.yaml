  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category structure
        blocks:
          - type: paragraph
            body: >-
              Safe Security's addressable market is best defined as enterprise cyber-risk management software that
              converts technical exposure into prioritized, business-relevant action. The boundary includes cyber-risk
              quantification (CRQ), third-party risk management (TPRM), and continuous threat exposure management
              (CTEM), including data integration, continuous monitoring, exposure validation, and workflow
              orchestration. It excludes general endpoint security, standalone vulnerability scanners, cyber-insurance
              itself, and consulting-only assessments. Forrester describes CRQ as extending into vulnerability and
              exposure management, threat intelligence, third-party risk, cyber insurance, application security, control
              monitoring, and compliance assessments, while also noting that the category now covers more use cases and
              vendors than two years earlier. This overlap means a broad vendor-reported TAM can double-count adjacent
              software budgets. Independent reporting on Safe's CTEM launch and Balbix acquisition confirms that the
              company's actual product perimeter has expanded across those adjacent workflows, but does not establish
              incremental market share.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM015
              - CM016
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The strongest numeric lens in the assigned evidence is Mordor Intelligence's estimate for cyber-risk
              quantification and scoring platforms: USD 5.43 billion in 2026 growing to USD 9.66 billion in 2031, with a
              12.25% CAGR. That is a category estimate, not Safe Security's serviceable market, and the publisher says
              its figures use a proprietary estimation framework. The same source gives useful segmentation: cloud
              deployments represented 63.42% of 2025 share, large enterprises 60.38%, enterprise risk management 31.62%,
              and North America 45.70%. These percentages help define buyer concentration but cannot be added to form
              SAM or SOM. A second lens is qualitative: Forrester says CRQ increasingly combines analytics,
              business-value insights, and automation, and that TPRM is one of its fastest-growing use cases. No
              assigned source isolates Safe Security's obtainable share, contract value, or penetration, so SOM remains
              unresolved.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
