  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              SAFE's public commercial surface supports a recurring enterprise-software interpretation, but it does not
              disclose a price list, contract minimum, usage metric, renewal schedule, or revenue recognition policy.
              The SAFE One datasheet describes a unified platform spanning TPRM, CTEM, AI-SPM, and CRQ, while the TPRM
              datasheet describes onboarding, assessment, monitoring, compliance, and offboarding workflows. Those
              capabilities imply multiple modules that could be sold as a platform or expanded through cross-sell, yet
              the source language is product positioning rather than realized revenue evidence. A SAFE datasheet quotes
              a senior manager saying the product added maturity and capacity without adding headcount, but that is a
              customer testimonial rather than a measured payback or gross-margin disclosure. The company therefore has
              a credible value proposition for enterprise risk budgets, but revenue quality remains untested until
              contracts, renewal cohorts, module attach rates, and recognized revenue are reviewed.
            claimRefs:
