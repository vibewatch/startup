  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: fortnite-mau-revenue-2025-2026
      missingEvidence: >-
        No public disclosure of Fortnite monthly active users, Battle Pass attach rate, or Fortnite Crew
        subscriber count after the GDC 2023 data point (~70M MAU). The engagement decline that started
        in 2025 (per CEO memo) cannot be quantified from public sources.
      whyItMatters: >-
        The scale of the Fortnite engagement decline determines whether the 2026 layoffs represent a
        temporary correction or a structural deterioration in Epic's primary revenue driver. Without
        2024–2026 MAU and revenue trends, the depth of the problem is unquantifiable.
      diligencePath: >-
        Request quarterly Fortnite MAU, Battle Pass sell-through rate, Crew subscriber count, and
        V-Bucks transaction volume for 2022–2026 from the data room.
      relatedQuestionRefs:
        - QU001
        - QU004

    - type: missing-source
      severity: material
      topic: epic-segment-financials
      missingEvidence: >-
        No public NRR, GRR, churn, or segment revenue split (Fortnite vs. UE5 royalties vs. EGS vs.
        enterprise) has been disclosed by Epic. The company is private and has not filed public
        financial statements since an SEC EDGAR search reveals no 10-K or equivalent disclosure.
      whyItMatters: >-
        Without segment revenue, it is impossible to quantify the magnitude of Fortnite concentration,
