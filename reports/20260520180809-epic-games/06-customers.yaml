company:
  name: Epic Games
chapter:
  number: 6
  title: Customers
  summary: >-
    Epic Games operates across five distinct customer segments, each with different buyer/user/payer dynamics.
    Fortnite players (650M+ registered as of November 2023, ~70M monthly active) are the primary payer segment,
    monetized via V-Bucks, Battle Pass, and Fortnite Crew ($11.99/month); a March 2026 V-Bucks price hike (~25%)
    triggered a player boycott and was cited in 1,000+ layoffs that month as Epic's CEO acknowledged a "downturn
    in Fortnite engagement that started in 2025." UEFN creators (20,000+ with published islands, $320M distributed
    in Year 1) form a second segment earning 40% engagement revenue but facing opaque discovery mechanics that
    concentrate income among top islands. Game developers using Unreal Engine 5 (Black Myth: Wukong — 20M units
    in first month; Senua's Saga: Hellblade II) pay 5% royalties on revenues above $1M, waived for EGS exclusives.
    Enterprise and film customers (The Mandalorian, Westworld, Fallout; 300+ virtual sets; U.S. Army, FBI Academy)
    use UE without disclosed pricing. Epic Games Store reaches 295M+ registered accounts with $950M revenue in 2023,
    serving game publishers at an 88%/12% split. The critical concentration risk is Fortnite's dominance in
    Epic's revenue, confirmed by the $500M cost-reduction program and 1,000+ layoffs in March 2026.

sections:
  - id: section-fortnite-consumer
    title: Fortnite consumer segment — players, payers, and engagement trajectory
    body: >
      Fortnite is Epic Games' primary consumer product and its largest revenue contributor. The game has
      accumulated 650 million players globally as of November 2023 per Statista, rising from 400 million in
      May 2021 — a trajectory that demonstrates broad consumer reach across PC, console, and mobile platforms.
      Epic's own disclosures referenced in Wikipedia cite 800 million registered accounts as of 2024–2026,
      though "registered accounts" and "active players" are structurally different metrics. The most operationally
      relevant figure, disclosed at GDC 2023, is approximately 70 million monthly active players — the pool
      from which monetization is drawn.

      Fortnite's monetization architecture separates the user (anyone who plays for free) from the payer
      (who purchases V-Bucks, a Battle Pass, or a Fortnite Crew subscription). All game modes are free-to-play;
      in-game revenue comes from three streams. V-Bucks (virtual currency) fund cosmetic purchases and seasonal
      Battle Passes. As of March 2026, Epic raised V-Buck pricing approximately 25%: 800 V-Bucks now cost $10,
      compared to approximately $8.99 per 1,000 V-Bucks previously. Battle Passes and their rewards are
      calibrated to V-Buck spending. The Fortnite Crew monthly subscription ($11.99/month) bundles the Battle
      Pass, Music Pass, LEGO Pass, 1,000 V-Bucks monthly, and exclusive cosmetics. The Crew model converts
      episodic purchasers into recurring payers, improving revenue predictability at the cost of per-transaction
      yield.

      The adverse signal in the consumer segment is unambiguous. In a March 2026 memo to employees, CEO Tim
      Sweeney explicitly cited a "downturn in Fortnite engagement that started in 2025" as the reason for
      laying off more than 1,000 employees — approximately 20% of the workforce. Sweeney wrote that Epic was
      "spending significantly more than we're making," and the layoff program combined with $500 million in
      identified cost savings was intended to return the company to a stable spending rate. Alongside the
      workforce reduction, Epic discontinued several low-engagement Fortnite modes: Rocket Racing, Ballistic
      (a tactical shooter launched December 2024), and the Festival Battle Stage. The pattern is consistent
      with a platform that expanded scope beyond what its player base could sustain.

      The March 2026 V-Bucks price increase compounded the engagement story. PC Gamer reporting described
      player revolt and a boycott movement targeting March 19, 2026. Fortnite's design director appealed for
      calm in public posts, explicitly framing the price increase as necessary to "pay the bills." Historical
      context: Fortnite generated over $9 billion in gross revenue in its first two years (2017–2019), and
      $2.4 billion in 2018 alone. The contrast between peak revenues and the 2025–2026 structural decline
      illustrates significant engagement erosion.
