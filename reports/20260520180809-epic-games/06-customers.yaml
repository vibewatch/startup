      expansion, showing how Epic's ecosystem creates cross-segment reinforcement and concentration points.
    data:
      items:
        - label: Awareness — Consumer (Fortnite player)
          note: >-
            Platform (console store, mobile app store, YouTube/Twitch), word-of-mouth;
            zero friction entry (free-to-play); Battle Royale cultural visibility
        - label: First play — Consumer activation
          note: >-
            Download → first match → tutorial → cosmetic shop exposure;
            V-Bucks prompted via limited-time item shop; Battle Pass introduced at season start
        - label: Monetization — V-Bucks, Battle Pass, Crew
          note: >-
            One-time V-Buck purchase → cosmetic spend → Battle Pass ($8.99 equivalent);
            Fortnite Crew conversion ($11.99/month recurring) adds 1,000 V-Bucks and pass bundle;
            V-Bucks price raised March 2026 (~25% increase) → player revolt signal
        - label: Creator discovery — UEFN segment entry
          note: >-
            Power player discovers UGC islands on Discover feed; 40% of playtime in Creative mode;
            some transition from player to UEFN creator via Island Creator program enrollment
        - label: Creator monetization — 40% engagement revenue share
          note: >-
            Published island → Discover algorithmic placement → player traffic → engagement revenue;
            $320M paid to 20,000+ creators Year 1; income highly concentrated in top islands
        - label: Developer discovery — UE5 adoption
          note: >-
            GDC, documentation, YouTube showcase (Black Myth, Hellblade II demos);
            free UE5 download → evaluation → project commitment; EOS SDK separately free
        - label: Developer monetization — royalties and EGS distribution
          note: >-
            Revenue >$1M: 5% royalty; waived for EGS exclusives; EGS 88%/12% split;
            EOS adds backend without additional licensing cost
        - label: Enterprise entry — UE beyond games
          note: >-
            Film studios via StageCraft/ILM reference; AEC/auto via MegaGrants and direct sales;
            Government via Unreal Government Network (Applied Research Associates);
            custom licensing; Emmy Award 2020 provides industry credibility
        - label: Expansion — Disney / IP / platform growth
          note: >-
            Disney $1.5B equity (Feb 2024); IP licensing (LEGO, Star Wars, Marvel) deepens Fortnite;
            EGS mobile (Aug 2024) expands publisher reach; extraction shooter in development
