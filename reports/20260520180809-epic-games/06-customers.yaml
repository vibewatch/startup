  - id: section-uefn-creators
    title: UEFN creator economy — engagement revenue and discovery dynamics
    body: >
      The Unreal Editor for Fortnite (UEFN), launched March 22, 2023, created a new creator customer segment
      that occupies a hybrid user/payer/earner role. Creators invest time and skills building islands (UGC
      experiences within Fortnite) using a near-full Unreal Engine interface. In return, creators in the
      Island Creator program receive 40% of engagement revenue attributable to their islands — where "engagement
      revenue" is calculated as a share of total Fortnite platform revenue (including Battle Pass and V-Bucks
      sales) weighted by player session time on each island. The remaining approximately 60% is retained by
      Epic.

      In the first year of UEFN's beta phase, Epic's Island Creator program paid an estimated $320 million to
      more than 20,000 developers with published experiences. This figure, disclosed at GDC 2024 and cited in
      Wikipedia's UEFN article, represents a significant creator economy — comparable in structure to Roblox's
      creator program and larger than many independent game development markets. The 40% of Fortnite playtime
      that players spent in Creative mode (per Epic's GDC 2023 data disclosed via Digiday) underpins the
      creator economy's scale: player time in UGC directly generates creator revenue.

      The adversarial dynamic in this segment is discovery concentration. Epic's algorithm — called "Discover" —
      controls which creator islands receive player traffic. The formula is kept secret, though Epic has stated
      it weights total hits, player engagement, player retention, and V-Bucks spend post-visit. The display of
      concurrent user (CCU) counts on the Discover page created community backlash: creators with low CCU
      alleged that the metric created a self-reinforcing disadvantage, since players skip low-CCU experiences,
      further suppressing algorithmic amplification. Additionally, trademark and DMCA disputes emerged in 2024
      when a top creator attempted to trademark "The Pit" (a common game type), prompting Epic to initially
      take down similar islands before reversing the decision under community pressure. The creator segment's
      economics depend structurally on algorithmic access to player traffic — a concentration risk analogous to
      YouTube creator dependence on recommendation algorithm changes.
