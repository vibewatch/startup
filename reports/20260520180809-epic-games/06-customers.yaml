  - id: section-game-developers
    title: Game developer customers — Unreal Engine 5 licensees and EOS adopters
    body: >
      Game developers represent Epic's most technically significant customer segment. Unreal Engine 5 is the
      engine of choice for AAA and AA productions targeting high-fidelity visuals, with its Nanite virtualized
      geometry and Lumen global illumination eliminating major content production bottlenecks. The commercial
      terms: developers pay a 5% royalty on gross product revenues exceeding $1 million per product. This
      royalty is waived entirely for products distributed exclusively through the Epic Games Store using Epic's
      payment system, creating a direct incentive linkage between UE5 adoption and EGS distribution.

      The named customer proof base for UE5 is strong and recent. Black Myth: Wukong, developed by Game
      Science and released August 20, 2024, was built on UE5 and sold 20 million units in its first month —
      one of the fastest-selling games of all time. The game received multiple Game of the Year awards and
      demonstrated UE5's viability for AAA production in markets beyond traditional Western studios. Senua's
      Saga: Hellblade II (Ninja Theory/Microsoft, released May 21, 2024) was built on UE5 with MetaHuman
      used for facial animation via Epic's 3Lateral subsidiary — a production-proof case combining two Epic
      tools. The game received generally positive reviews with praise for visual quality attributed to UE5.

      Epic Online Services (EOS) extends the developer customer relationship beyond engine use. EOS provides
      free, cross-platform backend services including multiplayer matchmaking, player accounts (with Epic or
      external identity providers), anti-cheat, cloud saves, and analytics. EOS is engine-agnostic — it
      supports Unity, Unreal Engine, and custom engines. The customer acquisition rationale: by offering
      competitive backend infrastructure for free, Epic captures developer relationships and account data even
      for games not built in UE5. EOS documentation describes the ability to "reach nearly a billion players"
      via the Epic Games account graph. No monetization model for EOS has been publicly disclosed; the service
      is free to integrate and operate, making it a developer ecosystem investment rather than a direct revenue
      line.
