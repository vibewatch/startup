  - id: section-enterprise-film
    title: Enterprise, film, architecture, and government customers using Unreal Engine
    body: >
      Unreal Engine's adoption beyond gaming represents a strategically distinct customer segment with different
      economics, buyer types, and switching dynamics. In film and television, UE is used for virtual production
      via LED volume stages — replacing traditional chromakey with real-time 3D backgrounds rendered on large
      LED walls that react to camera motion. Industrial Light & Magic co-developed the StageCraft technology
      with Epic for The Mandalorian, which received critical acclaim for visual quality and efficiency; the
      approach was subsequently adopted for Westworld (Season 3) and Fallout (2024). By October 2022, Epic
      was working with groups operating more than 300 virtual production sets globally, giving the technology
      significant production-scale adoption. UE received a Primetime Engineering Emmy Award in 2020 for
      exceptional contributions to broadcast technology, a form of industry validation that strengthens
      enterprise sales.

      In the government and defense segment, Epic established a partnership with Virtual Heroes (Applied
      Research Associates) for the Unreal Government Network, which handles UE licenses for government agencies.
      Named users include the U.S. Army (anesthesiology training software), the FBI Academy (multiplayer crime
      scene simulation), and the DHS Science and Technology Directorate (EDGE first-responder training platform).
      These are production deployments, not pilots.

      Architecture, engineering, and construction (AEC) customers use UE for 3D visualization, real-time
      walkthroughs, and design review. Automotive customers — BMW, Ford, Porsche and others — use UE for
      vehicle configuration visualization and digital showroom applications. Epic's MegaGrants program
      supports creators building tools and projects on UE5 or UEFN, extending access to educational institutions,
      research organizations, and emerging studios that become long-term ecosystem participants. The enterprise
      segment's revenue is not publicly disclosed; enterprise deals operate under custom licensing arrangements
      outside the standard 5% royalty model.
