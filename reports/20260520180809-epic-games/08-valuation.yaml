    - Public, audited, and more transparent than Epic
  - - Electronic Arts
    - Diversified premium publisher
    - 7.463 USD B (FY2025 net revenue)
    - 50.54 USD B (May 2026)
    - ~6.8x
    - Best mature public publisher floor for a high-scale gaming business
    - More diversified and less opaque than Epic
  - - Take-Two Interactive
    - Live-service IP / premium franchise platform
    - 5.63 USD B (FY2025 net revenue)
    - 43.81 USD B (May 2026)
    - ~7.8x
    - Best premium-IP comp with forward optionality
    - GTA VI anticipation and capital structure affect valuation
  - - Unity
    - Engine / tools platform
    - 1.813 USD B (FY2024 revenue)
    - 11.45 USD B (May 2026)
    - ~6.3x
    - Closest public engine/tools comp for Unreal piece
    - Engine mix differs and ad-tech exposure muddies purity
  - - Epic Games (reference anchors)
    - Private hybrid platform
    - ~6 USD B estimated 2022 company revenue; ~3.5 USD B estimated 2023 Fortnite revenue
