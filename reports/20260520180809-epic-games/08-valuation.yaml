company:
  name: Epic Games
chapter:
  number: 8
  title: Valuation
  summary: Epic Games still has a credible strategic case built on Fortnite scale, Unreal Engine, and Disney-backed optionality, but the public record does not support paying near peak-boom private marks with confidence. The last confirmed hard valuation is the 2022 $31.5 billion financing; secondary reporting around Disney's 2024 investment implied a lower mark near $22.5 billion, while 2026 layoffs and a $500 million savings target signal weaker current fundamentals than the boom-era anchor assumed. Public gaming and tools comps cluster around mid- to high-single-digit market-cap-to-revenue multiples, but Epic deserves a disclosure and concentration discount versus those transparent peers. The most defensible conclusion is research-more with medium confidence, high risk, and an expensive valuation stance.
sections:
- id: valuation-anchors-and-disclosure-limits
  title: Valuation anchors exist, but current earnings power is still opaque
  body: 'Epic does not suffer from a total absence of valuation evidence; it suffers from a mismatch between old valuation anchors and current operating disclosure. The 2022 Sony/KIRKBI round at a $31.5 billion post-money valuation is a confirmed anchor, and Disney''s $1.5 billion 2024 investment is a second major pricing event. But Disney and Epic did not publicly disclose a post-money figure, leaving outsiders to triangulate from secondary reporting that implied a lower valuation. That means the public market can see that Epic was once worth at least $31.5 billion and may have been repriced lower by 2024, but it still cannot see the current income statement that would justify either number today.


    That opacity matters more now than it would in a stable business. Epic''s 2026 layoffs and $500 million savings target are hard evidence that the company is still resetting its cost structure around weaker Fortnite engagement. Public revenue estimates for Epic stop at 2022, while Fortnite estimates extend only indirectly through third-party sources. Investors therefore face a classic late-stage private-company problem: valuation headlines are visible, but the underlying earnings power that should support those headlines is not. Any judgment on fair value has to start by discounting that disclosure gap rather than assuming it away.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
