- id: thesis-break-triggers-and-diligence
  title: The investment decision should turn on a short list of missing proofs
  body: 'Because Epic is private and disclosure-light, the most important work left is not spreadsheet refinement; it is evidence acquisition. Investors need current revenue, segment splits, cash burn, and capital-structure detail before they can know whether Epic deserves a premium software-platform multiple, a discounted publisher multiple, or something in between. They also need clearer evidence on whether Disney is becoming a monetizable business line or simply a high-profile strategic partnership with long-dated upside. Without those proofs, even a carefully reasoned valuation range remains more of a disciplined bracket than an underwritable fair-value point estimate.


    The cleanest way to use the current public record is to set explicit thesis-break triggers. If Fortnite engagement does not stabilize, if another restructuring round occurs, if Apple economics re-tighten, or if Disney still cannot show concrete monetization milestones, the fair-value range should move down. Conversely, a fuller segment disclosure, evidence of profitable or near-profitable EGS economics, and clear Unreal revenue growth would support revisiting the recommendation. Until then, research-more is less a hedge than a recognition that the missing evidence is exactly what determines whether Epic is merely expensive or genuinely compelling.'
  claimRefs:
  - CV036
  - CV037
  - CV038
  - CV039
