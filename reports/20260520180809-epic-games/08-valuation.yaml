- id: scenario-ranges-and-recommendation
  title: Bear, base, and bull cases all point to disciplined entry rather than enthusiasm
  body: 'Epic still has legitimate upside. Unreal Engine remains strategically important, Fortnite retains global scale, and Disney plus mobile litigation wins preserve optionality that many peers do not have. But those positives have to be balanced against the fact that Epic is not proving its case with transparent current metrics. The bear case assumes that Fortnite''s engagement erosion continues, EGS remains economically weak, and Disney monetization stays mostly conceptual. The base case assumes stabilization rather than reacceleration. The bull case assumes several good things happen at once: Fortnite regains momentum, Disney experiences become meaningful businesses, and Unreal captures more monetizable enterprise and media budgets.


    That distribution of outcomes supports a research-more call rather than a buy-style recommendation. The 2022 anchor is too stale to treat as fair value, while the 2024 implied markdown is informative but not confirmed. Public peers do not show an obvious cheapness case unless an investor already believes Epic''s diversification is much further along than public evidence suggests. The right valuation stance is therefore expensive: a company with excellent assets, but not enough fresh disclosure to justify paying close to peak-cycle private marks with confidence.'
  claimRefs:
