- id: TV005
  title: Thesis-break and trigger table
  description: Practical triggers that would move the valuation range lower or justify a pass decision.
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Fortnite fails to stabilize
    - No public evidence of stabilization and more major mode cuts or monetization stress
    - Core earnings engine may be structurally weaker than current range assumes
    - Move toward bear-case valuation and away from premium-entry pricing
  - - Another major restructuring
    - A third large layoff round or fresh cost-reset program
    - Suggests prior savings did not restore durable efficiency
    - Lower confidence and compress value range
  - - Apple economics reverse
    - Appeal or compliance outcome materially reduces external-payment benefit
    - Cuts one of the clearest sources of mobile upside
    - Reduce optionality value tied to mobile margin recovery
  - - Disney remains strategic but non-financial
    - No disclosed monetization milestones or economics after additional product cycles
    - Optionality cannot justify premium valuation by itself
    - Keep Disney value near zero in base case
  - - Disclosure gap persists into financing event
    - Still no current audited financials, segment splits, or cap-structure clarity
    - Investors would be paying for narrative without underwriteable evidence
    - Maintain research-more or pass until visibility improves
  notes: These triggers are intended for decision discipline after diligence, not for public-market style trading.
  claimRefs:
  - CV032
  - CV033
  - CV034
  - CV036
  - CV039
- id: TV006
  title: Final diligence asks table
  description: Highest-priority diligence requests needed to move from bracketed public valuation to investable fair value.
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current financials
    - 2025 and 2026 revenue, gross margin, EBITDA, free cash flow
    - Determines whether Epic is stabilizing or still overearning its old valuation anchor
    - Request audited monthly and quarterly financial package
  - - Segment mix
    - Revenue and margin split across Fortnite, Unreal, EGS, EOS, and other businesses
    - Necessary to value Epic as more than a monolithic game company
    - Request segment bridge with historical trend
  - - Capital structure
    - Cash, debt, preference stack, and any post-Disney financing terms
    - Needed to move from equity headline values to real investor economics
    - Request cap table, shareholder agreements, and debt schedule
  - - Disney economics
    - Budget, milestone plan, revenue share, and KPI dashboard for Disney universe
    - Determines whether optionality is strategic narrative or monetizable asset
    - Request partner agreement summary and product roadmap
  - - Store economics
    - EGS GMV, take rate realization, and operating contribution
    - Needed to justify any positive standalone store value
    - Request store P&L and cohort economics
  - - Unreal engine economics
    - Licensee count, royalty revenue, enterprise mix, and margin profile
    - Needed to support a software-style valuation premium
    - Request Unreal revenue build and growth cohort analysis
  notes: These asks focus on the evidence most likely to move valuation rather than on broad diligence checklists.
  claimRefs:
  - CV036
  - CV040
  - CV041
  - CV042
