- id: public-comp-set-and-sum-of-parts
  title: Public comps suggest value, but also justify a private-company discount
  body: 'The most useful way to frame Epic is as a hybrid of three partially overlapping businesses: a hit-driven consumer platform centered on Fortnite, a software tool platform centered on Unreal Engine, and a still-subscale store ecosystem anchored by EGS. No single public comp covers all three. Roblox is the closest public creator-economy and UGC analogue; EA is the best diversified publisher benchmark; Take-Two is the best live-service premium-IP analogue; Unity is the cleanest engine and tools comparator. Using CompaniesMarketCap and company result releases, those public names trade in a roughly 6x to 9x market-cap-to-revenue band.


    That band is useful but not automatically transferable. Public peers publish audited results, quarterly updates, and management guidance. Epic does not. Roblox earns a premium partly because the market can mark its creator economy every quarter; Unity''s compression shows how fast tools-platform value can reset when credibility weakens; EA and Take-Two show that even premier publishers do not command infinite multiples absent clear execution. Epic deserves some premium for Unreal and its ecosystem reach, but it also deserves a haircut for concentration and opacity. Sum-of-parts logic therefore works better as a range-setting exercise than as a claim of false precision.'
