company:
  name: Epic Games
chapter:
  number: 4
  title: Financials
  summary: >-
    Epic Games' financials are dominated by Fortnite, which generated an estimated $3.5 billion in 2023 and
    remains responsible for roughly 80% of total company revenue — down from a peak of ~$5.4 billion in 2018.
    Three structural forces are reshaping the P&L: the March 2026 V-Bucks price increase (the first in years)
    and paired 1,000-person layoff targeting $500M in annual savings signal a deliberate pivot from growth
    to margin; Apple's April 2025 contempt ruling and Google's March 2026 settlement materially improve
    mobile monetization economics; and a $520M FTC settlement in December 2022 absorbed a one-time cash charge
    while imposing a 20-year dark-patterns prohibition. The most recent clearly dated valuation anchor is
    April 2022 at $31.5 billion post-money; The Information reported a $22.5 billion implied valuation for the
    Disney deal (announced Feb 7, 2024), representing a 28.5% decline that Epic and Disney declined to confirm.
    All revenue, margin, and cash figures are private-company estimates; no audited financials are publicly available.

sections:
  - id: revenue-model
    title: Revenue model and monetization architecture
    body: >
      Epic Games operates across four commercial monetization pillars, each with distinct unit economics and
      risk profiles. Fortnite Battle Royale is overwhelmingly dominant: BusinessOfApps estimates place Fortnite
      revenue at approximately $3.5 billion in 2023, down from a peak of $5.4 billion in 2018 and $3.6 billion
      in 2019. The game accumulated $9 billion in lifetime revenue through December 2019 alone. Fortnite
      monetizes through three mechanisms — V-Bucks virtual currency (used for cosmetics and Battle Passes),
      the Fortnite Crew subscription ($11.99/month; includes the Battle Pass and monthly V-Bucks), and
      character/cosmetic licensing from IP partners including Marvel, Disney, and Star Wars. In March 2026,
      Epic increased V-Bucks pricing by approximately 20% (800 V-Bucks now costs $10, previously approximately
      1,000 V-Bucks for $8.99), the first significant price adjustment since Fortnite's launch. This increase
      coincided with an announcement that Fortnite Save the World — the original paid PvE mode — would go
      free-to-play in April 2026, trading upfront purchase revenue for engagement and cosmetic spend.

      The UEFN Creator Economy (launched with UEFN in March 2023) paid an estimated $320 million to over
      20,000 creators in its first year of beta operation, per Epic's GDC 2024 disclosure cited in Wikipedia's
      UEFN article. Creators receive 40% of engagement revenue attributable to their islands per Digiday's
      reporting. This creates a recurring payout obligation tied directly to Fortnite's revenue base.

      The Epic Games Store (EGS) offers an 88%/12% revenue split in favor of developers, with a 0% rate on
      the first $1 million per product per year (introduced June 2025). EGS grew to 295 million registered
      PC/Mac users by 2025. However, the EGS was running at significant losses in 2019–2020 (approximately
      $400 million per Apple court filing testimony), and Apple's own analysis projected EGS would not achieve
      profitability until 2027. Unreal Engine 5 (UE5) generates royalty revenue at 5% of gross product revenue
      above $1 million per product — waived entirely for games distributed exclusively through EGS — plus
      enterprise and cloud licensing fees. Fab marketplace (formerly Unreal Engine Marketplace, relaunched
      October 22, 2024 as a unified platform combining Sketchfab, ArtStation Marketplace, Quixel, and UE
      Marketplace assets) provides Epic a share of developer asset sales.
