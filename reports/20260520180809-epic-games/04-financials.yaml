  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: official-revenue-and-margin
      missingEvidence: >-
        Epic has never published audited financial statements. All revenue estimates are third-party
        (BusinessOfApps, Forbes, The Information) and range from $3.5B–$6B for 2022–2023. No gross margin,
        operating income, EBITDA, or cash flow figure is publicly confirmed. The most recent third-party
        revenue estimate (2023 Fortnite ~$3.5B) is nearly 3 years old as of the report date.
      whyItMatters: >-
        Without official financials, it is impossible to assess whether Epic is generating operating income,
        whether EGS has reached profitability, or whether the $500M savings target is sufficient to achieve
        cash-flow breakeven. All financial modeling must carry wide uncertainty bands.
      diligencePath: >-
        Request audited P&L, balance sheet, and cash flow statements for FY2022–FY2025 in diligence data room.
        At minimum, request management accounts showing segment revenue (Fortnite, EGS, UE5, Fab) and
        consolidated gross margin for the same period.
      relatedQuestionRefs:
        - QI008
        - QI023
        - QI028
    - type: conflicting-data
      severity: material
      topic: egs-profitability-timeline
      missingEvidence: >-
        Apple's 2021 court testimony projected EGS would not be profitable until 2027. Epic publicly stated
        it expected profitability by 2023. Neither claim is verified with post-2021 EGS financials. The
        resolution of this conflict is material to assessing EGS's ongoing cash drag on Epic's balance sheet.
      whyItMatters: >-
        If EGS is still loss-making through 2026, it represents a multi-hundred-million-dollar annual
        cash drain on top of Fortnite's declining revenue trajectory and the $520M FTC settlement cash charge.
