  - id: TI005
    title: Public financial gaps table
    description: >-
      Key financial metrics unavailable in public sources for Epic Games as a private company.
      Each gap is material to financial underwriting and is documented with the required diligence path.
    columns:
      - Missing metric
      - Impact on analysis
      - Best available proxy
      - Diligence path
    rows:
      - - Official total revenue (all segments)
        - Cannot size the business or assess revenue trajectory without it
        - BusinessOfApps estimate ~$5B 2022 total (~$6B per Forbes estimate); all third-party
        - Request audited P&L or management accounts covering FY2022–FY2025
      - - Gross margin by segment (Fortnite, EGS, UE5, Fab)
        - Cannot assess which revenue stream funds the overall business and which is a cash drain
        - EGS estimated ~5% actual margin (Apple filing); Fortnite gross margin likely 70–85% based on virtual-goods model
        - Request segment-level gross margin in diligence data room
      - - Cash and cash equivalents on balance sheet
        - Cannot assess whether Epic has sufficient liquidity to fund its operations and the $500M savings program transition
        - No public figure; last implied financing need was pre-Disney deal
        - Request current cash balance and trailing-12-month cash burn from management
      - - EGS profitability status (2024–2026)
        - Apple projected EGS unprofitable until 2027; Epic claimed 2023; truth is material to platform investment thesis
        - Adversarial Apple estimate (2021) vs. company claim (2023); both unverified as of report date
        - Request EGS-specific income statement for FY2023–FY2025 to resolve conflicting projections
      - - Post-FTC settlement compliance cost
        - 20-year dark-patterns prohibition requires ongoing compliance infrastructure; quantification missing
        - $520M cash charge confirmed; incremental compliance cost unquantified
        - Request annual compliance spend since 2022 FTC settlement effective date
    notes: >-
      Epic Games is a private company and does not publish audited financial statements. All revenue estimates
      are third-party. The FTC settlement cash figures are publicly confirmed ($520M). EGS profitability
      estimate conflict is between Apple's 2021 court testimony (2027 projected) and Epic's own 2021 statement
      (2023 projected); neither is verified with current financials.
