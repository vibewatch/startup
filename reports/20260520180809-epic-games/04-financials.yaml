callouts:
  - calloutType: risk
    title: Single-title revenue concentration in Fortnite is the dominant financial risk
    body: >-
      An estimated 80% of Epic's revenue derives from Fortnite, which itself peaked at $5.4 billion in 2018
      and has declined to approximately $3.5 billion by 2023 per BusinessOfApps. The March 2026 price increase
      (first significant V-Bucks adjustment since launch) and concurrent 1,000-person layoff targeting $500M
      in annual savings are consistent with a company responding to revenue-level pressure, not growth momentum.
      Epic's own 2026 layoff communication cited a Fortnite engagement downturn beginning in 2025. Without
      official revenue data, it is impossible to confirm whether the price increase reversed the trend.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI011
      - CI012
      - CI013
  - calloutType: strength
    title: Apple and Google legal outcomes structurally improve mobile monetization economics
    body: >-
      The April 2025 Apple contempt ruling (0% commission on external purchase link transactions; Apple pays
      Epic's attorney fees) and the March 2026 Google settlement (max 20% blended rate vs. prior 30%) together
      represent a durable improvement in Epic's mobile P&L — if they survive appeal. Apple is appealing the
      2025 ruling, introducing binary risk on the iOS side. Google's settlement terms are final. For a game
      with Fortnite's mobile revenue base, even a 10 percentage-point improvement in commission rate on mobile
      transactions could add hundreds of millions in annual net revenue, representing the most significant
      positive financial development in Epic's recent history.
    claimRefs:
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
  - calloutType: insight
    title: The Disney deal valuation signal is adverse and unconfirmed — diligence must resolve it
    body: >-
      The $22.5 billion valuation implied by The Information's reporting on the Disney transaction represents
      a 28.5% markdown from the $31.5 billion 2022 anchor. Epic and Disney declined to confirm. The Wikipedia
      infobox placing Disney at ~9% and the Variety D23 article treating the investment as past tense confirm
      the deal closed, but the valuation remains unconfirmed by any primary source. Underwriters relying on the
      2022 $31.5B anchor for valuation purposes should treat the implied markdown as a material adverse signal
      that must be resolved in due diligence before relying on any pre-money multiple for financial modeling.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025

