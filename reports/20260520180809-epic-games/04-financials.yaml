  - id: capital-structure
    title: Capital structure, funding history, and valuation trajectory
    body: >
      Epic is a private, closely-held company with Tim Sweeney retaining majority ownership (confirmed in
      multiple news sources covering the company's governance). The company's external financing history is
      well-documented through official press releases and news coverage. Tencent acquired a minority stake
      of approximately 40% in 2012 for approximately $330 million — a deal that provided transformative
      capital ahead of Unreal Engine's commercial expansion and Fortnite's development. This stake has been
      partially diluted by subsequent rounds but Tencent remains the largest single external shareholder.

      The documented post-2020 round sequence: a $1.25 billion round in 2020 valuing Epic at $17.3 billion;
      a $1 billion round in 2021 at $28.7 billion; and an April 2022 $2 billion round from Sony and KIRKBI
      (LEGO's parent) at $31.5 billion post-money — the most recent clearly dated round with a confirmed
      post-money valuation. The $31.5 billion 2022 valuation is the last hard data point for underwriting
      purposes.

      On February 7, 2024, Disney announced a $1.5 billion equity investment in Epic, described as purchasing
      a stake "pending regulatory approval." Variety's D23 coverage (August 10, 2024) treats the Disney
      investment as completed, and Wikipedia's Epic Games infobox lists Disney at approximately 9% current
      ownership, indicating the deal has closed. However, no primary source has confirmed an exact close date.
      The Information reported (via a person familiar with the matter, cited by the News & Observer) that the
      transaction implies a $22.5 billion valuation for Epic — a 28.5% discount from the 2022 valuation of
      $31.5 billion. Both Epic and Disney declined to confirm or deny this figure. This implied markdown, if
      accurate, is consistent with the broader gaming sector valuation compression of 2022–2024.

      Epic has not disclosed its cash position, burn rate, or runway. The $500 million annual cost savings
      target announced in March 2026 implies prior operating losses or at minimum cash consumption at scale.
      Total external capital raised across documented rounds is approximately $5.8 billion (Tencent $330M +
      $1.25B + $1B + $2B + $1.5B Disney) before any undisclosed earlier or interim rounds.
