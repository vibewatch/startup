tables:
  - id: TI001
    title: Revenue streams table
    description: >-
      Epic's estimated revenue streams, monetization mechanism, quality, and key diligence questions.
      All revenue figures are third-party estimates from BusinessOfApps; Epic does not publish financials.
    columns:
      - Revenue stream
      - Mechanism
      - Estimated size / status
      - Revenue quality
      - Diligence ask
    rows:
      - - Fortnite Battle Royale (V-Bucks / cosmetics)
        - Virtual currency sold in packs; spent on cosmetics, Battle Pass, limited-time items
        - ~$3.5B estimated 2023 (BusinessOfApps); peak ~$5.4B 2018
        - High — recurring, high-frequency, in-product; limited marginal delivery cost
        - Verify post-2023 actuals; assess whether 2026 price increase restored revenue trajectory
      - - Fortnite Crew subscription
        - $11.99/month; includes current Battle Pass + 1,000 V-Bucks/month; bundled with Xbox Game Pass Ultimate
        - Undisclosed subscribers; bundled via Xbox limits direct ARPU visibility
        - Medium — predictable monthly recurring but subscriber count unknown
        - Request subscriber count, churn rate, and bundle-vs-direct split
      - - UEFN Creator Economy 2.0 payouts (net revenue after creator share)
        - 40% of attributable engagement revenue to creators; Epic retains ~60%
        - ~$320M paid to creators in first year (2023–2024) → ~$533M implied gross engagement revenue
        - Medium — growing but operationally complex; payout obligation scales with Fortnite revenue
        - Verify total engagement revenue, payout ratio actuals vs 40% stated, top-creator concentration
      - - Epic Games Store (PC/Mac/mobile)
        - 12% developer take rate (0% on first $1M/product/year); 88% to developer
        - ~$400M cumulative losses 2019–2020 per Apple filing; profitability target unconfirmed
        - Low-medium — structural take-rate disadvantage vs. Steam 30%; volume growing but margin unclear
        - Obtain EGS P&L; verify current profitability status (Apple said 2027; Epic said 2023)
      - - Unreal Engine 5 (royalty + enterprise licensing)
        - 5% royalty on gross revenue >$1M/product (waived for EGS exclusives); enterprise SaaS/film
        - Undisclosed; estimated low hundreds of millions at scale (inferred from AAA adoption rate)
        - High — recurring royalty on commercially successful titles; sticky enterprise clients
        - Request annual royalty revenue; identify top-paying studios; assess EGS waiver cost to UE5 line
      - - Fab marketplace (formerly UE Marketplace)
        - Revenue share on asset sales (developer-submitted 3D assets, materials, plugins); launched Oct 2024
        - Undisclosed; replaces legacy UE Marketplace + Sketchfab + ArtStation + Quixel product lines
        - Low — marketplace economics challenging; Fab unification only launched Oct 2024
        - Verify GMV, take rate, and year-1 revenue after unification; compare to legacy UE Marketplace baseline
    notes: >-
      All Fortnite/Epic revenue figures are third-party estimates from BusinessOfApps and Forbes; Epic has
      not published official financials. EGS loss figure from Apple Inc. court filing testimony (Epic v. Apple
      trial, 2021). Creator Economy payout figure from Epic GDC 2024 disclosure per Wikipedia UEFN article.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI008
      - CI009
