  - id: FI002
    title: Unit economics bridge
    type: bar
    layout: standard
    summary: >-
      Estimated EGS unit economics waterfall: from gross developer sales through Epic's 12% take rate
      to estimated net operating margin, illustrating why EGS has historically run at a loss.
    data:
