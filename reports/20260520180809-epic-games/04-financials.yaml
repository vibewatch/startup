  - id: financial-verdict
    title: Financial diligence assessment and evidence gaps
    body: >
      Epic's financial profile presents a company at a pivotal inflection point. Revenue quality is high
      where it exists — Fortnite's V-Bucks model generates recurring, high-frequency micro-transaction
      revenue from a 650+ million registered player base — but the concentration in a single title (estimated
      ~80% of revenue from Fortnite) is a structural risk, particularly given the company's own acknowledgment
      of a Fortnite engagement downturn in 2025 that partly motivated the March 2026 workforce reduction.
      The V-Bucks price increase, concurrent cost-savings program, and layoffs collectively signal a deliberate
      shift from growth spending to profit discipline that the diligence record supports as a post-peak-revenue
      operational response.

      The Apple and Google legal victories improve the long-run financial model meaningfully: if Apple's
      appeal fails, routing iOS purchases through external payment links eliminates the commission entirely
      on those transactions. The Google settlement's sub-20% blended rate for Epic is a permanent structural
      improvement versus the prior 30% for mobile monetization. Both outcomes expand the TAM for Epic's
      mobile revenue share.

      The primary diligence gap is the absence of any verified gross margin, EBITDA, or cash figure. Epic
      has never published audited financials. All revenue estimates are third-party (BusinessOfApps, Forbes,
      The Information) and the most current Fortnite revenue estimate (2023) is already nearly 3 years old
      relative to the report date. The valuation anchor of $31.5 billion (April 2022) is 4 years old; the
      implied $22.5 billion (2024) is unconfirmed. This opacity makes financial underwriting dependent on
      Epic disclosing P&L, balance sheet, and cash-flow data in a due-diligence process — or modeling off
      conservative third-party revenue estimates with wide uncertainty bands.
    claimRefs:
