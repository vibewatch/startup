  - id: TI003
    title: Unit economics table
    description: >-
      Selected unit economics metrics for Epic's key business lines. Confidence levels reflect data quality:
      high = primary-source confirmed; medium = triangulated from public filings and analyst data;
      low = inferred from limited public signals.
    columns:
      - Metric
      - Value / estimate
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Fortnite estimated revenue per registered player (2023)
        - ~$5.40/player/year (est. $3.5B ÷ 650M registered)
        - Low — registered ≠ active; actuals undisclosed
        - Establishes floor ARPU vs. comparable live-service games; declining from 2018 peak (approx $8 per registered player)
        - Obtain MAU/DAU and revenue per active player to replace registered-player proxy
      - - Fortnite Crew subscriber ARPU
        - $143.88/year ($11.99 × 12 months)
        - Medium — list price known; subscriber count unknown
        - Crew subscribers are highest-value recurring segment; key retention indicator
        - Disclose subscriber count, churn rate, and % of revenue from Crew vs. cosmetic spend
      - - EGS developer take rate
        - 12% (0% on first $1M per product/year)
        - High — confirmed by official EGS distribution page
        - 18 percentage points below Steam's 30%, Epic's primary competitive lever; low-margin business
        - Compare to Steam WAM on actual EGS catalog mix; model EGS gross revenue and Epic's net take
      - - EGS actual net margin per dollar of GMV (Apple filing estimate)
        - ~5% (net after CDN, customer service, payment processing per Apple court filing)
        - Medium — adversarial party estimate from 2021 court testimony; may not reflect 2026 actuals
        - Confirms EGS is structurally low-margin; key driver of recurring EGS operating losses
        - Request current EGS gross margin actuals; compare 2025 CDN/infrastructure cost per transaction
      - - EGS operating losses 2019–2020
        - ~$400M cumulative (per Apple court filing testimony)
        - Medium — from adversarial party (Apple) in court; not confirmed by Epic directly
        - Demonstrates EGS was materially cash-negative through at least 2020; raises question of current status
        - Obtain EGS P&L for 2022–2026; Apple said 2027 profitability; Epic said 2023
      - - UE5 royalty rate
        - 5% on gross revenue >$1M per product
        - High — confirmed by official Unreal Engine FAQ and licensing docs
        - Standard AAA studio rate; waiver for EGS exclusives creates implicit cross-subsidy
        - Model royalty revenue across top-50 UE5-built titles and estimate annual royalty pool
    notes: >-
      EGS margin and loss data sourced from Apple's 2021 trial testimony, which was an adversarial estimate
      from an opposing party — treat with appropriate skepticism regarding current applicability. UE5 royalty
      rate confirmed on unrealengine.com/en-US/faq. Fortnite ARPU estimate is a simple division using
      BusinessOfApps' revenue and registered player figures; actual MAU-based ARPU would be materially higher.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI015

