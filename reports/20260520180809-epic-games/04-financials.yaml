  - id: cost-structure
    title: Cost structure, capital intensity, and efficiency actions
    body: >
      Epic's cost base reflects its unusual profile as a simultaneously a consumer game publisher, platform
      operator, engine licensor, and marketplace curator. The two largest disclosed cost actions are structural
      signals: in September 2023, Epic laid off approximately 870 employees (roughly 16% of its then-workforce,
      including approximately 170 Triangle-area North Carolina employees), citing high costs of building a
      metaverse-style experience as a driver. In March 2026, Epic executed a second round of layoffs exceeding
      1,000 employees and announced a $500 million annual cost savings target, with approximately 4,000
      employees remaining. Simultaneously, Epic cited a Fortnite engagement downturn beginning in 2025 as a
      motivation, suggesting revenue pressure compounded the cost imperative.

      The EGS cost structure is structurally adverse: the 12% take rate leaves limited gross margin after CDN
      delivery, customer service, and payment processing (with Apple's court filing estimating EGS achieved an
      effective ~5% actual profit margin after these costs, on its claimed path to profitability). The 0%
      first-$1M-per-product waiver introduced in June 2025 further compresses near-term EGS economics for
      growing titles. The Creator Economy 2.0 payout (40% of attributable island engagement revenue per
      Digiday) is an additional variable cost layer tied to Fortnite's revenue performance, creating a
      leveraged payout structure as island engagement grows.

      UE5's royalty-free EGS distribution incentive creates an implicit cost: every EGS-exclusive title that
      would have paid 5% UE5 royalties on more than $1M in revenue represents forgone royalty income. This
      cross-subsidy supports EGS catalog acquisition but depresses UE5 royalty revenue per title. The $520M
      FTC settlement cash payment (December 2022) was a one-time charge; the ongoing prohibition on dark
      patterns and new consent requirements add compliance cost but are not separately quantified in public
      sources. No official gross margin, operating income, or EBITDA figures are publicly available for Epic.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
    tableRefs:
      - TI003
    figureRefs:
