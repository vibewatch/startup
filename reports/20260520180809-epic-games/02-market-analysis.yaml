      Newzoo low/base values are derived from the 2026 report's statement that 2025 grew ~7% from 2024; the exact 2024
      base is not disclosed in the free report teaser. Statista's high figure uses a broader market boundary. These
      estimates are not directly comparable and should be used with explicit boundary caveats in any valuation model.
    claimRefs:
      - CM006
      - CM007
      - CM008

  - id: FM002
    title: Market sizing pyramid — Epic's addressable layers
    type: pyramid
    layout: standard
    summary: >-
      Epic's addressable markets stack from a $200B+ global games TAM through progressively narrower PC/console,
      Fortnite-relevant, and engine/creator layers, with non-gaming real-time 3D as a long-term adjacency.
    data:
      items:
        - label: "Global games software/services TAM"
          value: "~$200B (2025 Newzoo est.)"
          description: "All game software and service spending globally across PC, console, mobile"
        - label: "PC + console segment (excl. mobile)"
          value: "~$75B est."
          description: "PC and console share of global software; mobile excluded (~$126B est.)"
        - label: "Fortnite-relevant addressable (F2P live-service)"
          value: "Not independently sized"
          description: "Free-to-play and live-service spending within PC+console; Fortnite's competitive set"
        - label: "EGS distribution SAM (PC only, developer fees)"
          value: "~$1-2B est. (fee revenue layer)"
          description: "Revenue from 12% take-rate on PC digital sales; constrained by Steam's ~75%+ share"
        - label: "UE engine royalties + marketplace"
          value: "Not separately disclosed"
          description: "5% on commercial revenues >$1M; royalty revenue waived for EGS titles"
        - label: "UEFN / Creator Economy"
          value: "$320M+ paid in year 1"
          description: "Creator payout proxy; actual revenue base is subset of Fortnite total"
    approximationNotes: >-
      PC+console estimate of ~$75B is derived by subtracting Statista's ~$126B mobile estimate from the ~$200B
      Newzoo figure, which is an approximation since the methodologies differ. EGS fee revenue of $1-2B is an
      author estimate based on 295M user base, assumed 5-10% conversion to purchase, and average purchase value.
      None of these SAM/SOM figures are confirmed by Epic.
    claimRefs:
      - CM001
      - CM007
      - CM022
      - CM032

  - id: FM003
    title: Game engine market share — developer count vs. sales (2024)
    type: matrix
    layout: standard
    summary: >-
      Unity leads by developer count (50%) but Unreal Engine leads by sales (31%), reflecting Unreal's
      concentration in higher-budget AAA titles versus Unity's dominance in mobile and indie development.
    data:
      columns:
        - "Share by developer count (2024)"
        - "Share by sales revenue (2024)"
        - "Primary segment"
        - "Key risk"
      rows:
        - label: "Unreal Engine (Epic)"
          values:
            - "~28%"
            - "~31%"
            - "AAA console/PC, non-gaming enterprise"
            - "High per-title royalties limit indie adoption"
        - label: "Unity"
          values:
            - "~50%"
            - "~26%"
            - "Mobile, indie, mid-tier PC/console"
            - "Runtime fee crisis eroded developer trust 2023-2024"
        - label: "Proprietary engines"
          values:
            - "~22% (est.)"
            - "~42%"
            - "AAA publishers (EA, Activision, etc.)"
            - "Not licensable; closed ecosystem; competition for non-Unity/non-UE spend"
        - label: "Other commercial engines"
          values:
            - "Remainder"
            - "~1% (est.)"
            - "Niche / specialized"
            - "Low strategic relevance"
    approximationNotes: >-
      Developer count and sales share from Wikipedia Unreal Engine article, attributed to Creative Bloq February 2025.
      Proprietary engine developer-count share is derived residual (~100% - 28% UE - 50% Unity = ~22%).
      Proprietary engine sales share (42%) is as cited by the same source.
    claimRefs:
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018

  - id: FM004
    title: Creator economy adoption funnel — Fortnite UEFN to payout
    type: funnel
    layout: standard
    summary: >-
      The UEFN creator funnel moves from the 295M+ Epic account base through Fortnite MAU, Creative mode players,
      UEFN creators, and published islands to payout-eligible creators — with significant attrition at each stage.
    data:
      items:
        - label: "Epic Games registered accounts"
          value: 295
          description: "295M+ EGS registered users across 187 countries; upper bound of reachable audience (millions)"
        - label: "Fortnite monthly active players"
          value: 70
          description: "~70M MAU (2023 reference); active Fortnite players; base for Creative mode engagement (millions)"
        - label: "Players engaging with Creative mode"
          value: 28
          description: "~28M est. (40% of MAU per Digiday/Epic GDC 2023); playtime share proxy, not confirmed player count (millions)"
        - label: "UEFN-published island creators"
          value: 0.02
          description: "20,000+ creators with published UEFN experiences in the platform's first year (millions)"
        - label: "Payout-eligible creators (first year)"
          value: 0.02
          description: "20,000+ creators received $320M total in Island Creator program payouts in UEFN beta year 1 (millions)"
    approximationNotes: >-
      Creative mode player estimate (28M) is derived from Digiday-reported 40% playtime share applied to 70M MAU
      reference; this is an approximation as playtime share ≠ player count share. Actual UEFN creator count and
      payout figures from Wikipedia UEFN article citing Epic Island Creator program disclosures.
    claimRefs:
      - CM031
      - CM032
      - CM033
      - CM034
      - CM035

callouts:
  - calloutType: risk
    title: Mobile gatekeeping remains the largest market constraint
    body: >-
      Epic's iOS revenue was structurally eliminated from August 2020 (Fortnite removal) to May 2025 (US return)
      and remains geographically incomplete (Australia excluded as of May 2026). Apple's appeal of the April 2025
      ruling introduces multi-year appellate uncertainty. Google's Play Store retains its 30% fee for most Android
      developers despite Epic's settlement, and Fortnite's Android presence relies on Samsung's Galaxy Store and
      Epic's own sideloading pathway — materially narrower than a full Google Play reinstatement. Mobile gaming
      constitutes approximately $126B of the broader gaming market per Statista; Epic's ability to participate
      directly in this market is still partially blocked, limiting addressable revenue versus where Fortnite's
      player base actually spends time on mobile.
    claimRefs:
      - CM041
      - CM042
      - CM043

  - calloutType: insight
    title: Newzoo structural shift favors Fortnite but limits new-IP optionality
    body: >-
      Newzoo's 2026 report explicitly states that gaming growth is now "driven by monetization efficiency,
      pricing strategy, and platform economics, not expanding player time." This is a bullish signal for
      Fortnite as a deeply embedded live-service franchise, but a significant headwind for any new IP Epic
      might launch. New titles must compete for a fixed — or slowly growing — pool of player attention
      dominated by Fortnite itself, Roblox (85.3M DAU), Minecraft, and a handful of other persistent
      platforms. Epic's layoffs may partly reflect this structural recognition: maintaining Fortnite's
      position requires capital, but launching new competing platforms in a stagnant attention market
      is a high-cost, uncertain-return endeavor.
    claimRefs:
      - CM009
      - CM010
      - CM033

