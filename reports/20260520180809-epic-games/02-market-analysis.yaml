  - id: section-global-games-market
    title: Global video game market — size, trajectory, and Epic's position
    body: >
      The global video game market has grown from approximately $134.9 billion in 2018 to an estimated $183-200B
      range in 2024-2025 on a software/services basis, depending on methodology. Newzoo's PC and Console Gaming
      Report 2026 characterizes 2025 as "the first year of notable revenue growth in the industry since the pandemic,
      increasing 7% year-over-year," signaling a recovery cycle after two years of post-pandemic contraction. Critically,
      Newzoo notes that this growth is now "driven by monetization efficiency, pricing strategy, and platform economics,
      not expanding player time" — a structural shift that favors entrenched live-service franchises like Fortnite over
      new entrants.


      Statista's broader market metric — approximately $522.5 billion in 2025, including hardware and accessories —
      captures a wider value chain but is methodologically incomparable to Newzoo's software-centric figure. The mobile
      gaming market alone is estimated at approximately $126 billion within the Statista broader figure, underscoring
      how large a share mobile commands. This matters for Epic because mobile remains the platform where Epic's direct
      monetization is most constrained (see adversarial constraints below).


      Among publicly reported gaming companies, Newzoo's top-25 rankings through Q3 2025 show Tencent leading at
      $30.2B YTD revenues, followed by Microsoft ($15.9B) and Sony ($15.6B). Epic is private and not in the public
      rankings, but its estimated $5-6B annual revenue (based on 2022 analyst estimates and FTC settlement disclosures)
      would place it in the top-10 if it were a standalone public entity. Fortnite's publicly acknowledged $9B+ gross
      by end of 2019 provides a historical anchor, though more recent figures are not publicly disclosed.


      The gaming market exhibits high concentration: free-to-play live-service titles like Fortnite, Genshin Impact,
      and Roblox capture a disproportionate share of player time and in-game spending. Statista notes that "gaming
      studios have become more risk-averse" as players invest deeply in existing titles rather than sampling new
      releases — a dynamic that reinforces Fortnite's position as a durable revenue moat but also explains why Epic's
      2023-2026 layoff cycles coincided with Fortnite engagement declining from its historical peaks.
