slug: epic-games
runDate: '2026-05-20'
company:
  name: Epic Games
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Epic Games participates across five distinct but interrelated markets: global video game software (Newzoo estimates
    ~$187-200B software/services in 2024-2025, broader at ~$522B including hardware per Statista), game engines
    (Unreal Engine holds 28-31% share by developer count and sales respectively, versus Unity's 50-26%), PC digital
    distribution (Epic Games Store challenges Steam's entrenched position with a 12% revenue cut model and 295M+ users),
    creator/UGC platforms (UEFN paid $320M+ to creators in its first year), and non-gaming real-time 3D (AEC,
    automotive, film/TV). Mobile platform gatekeeping, Steam's network-effect dominance, and engine competition from
    Unity constrain addressable market opportunity, though the April-May 2025 Apple court rulings materially improved
    Epic's mobile monetization posture.
sections:
  - id: section-market-boundary
    title: Market boundary and segment definitions
    body: >
      Epic Games does not fit a single-market definition. Its commercial strategy spans five analytically distinct
      market segments that share common platform infrastructure but differ sharply in buyer, monetization model, and
      competitive dynamics. Diligence must evaluate each separately before sizing any addressable opportunity.


      The first segment is the global video game software and services market — the primary revenue pool for Fortnite.
      This market includes consumer spending on game software, digital downloads, in-game purchases, subscriptions, and
      live-service monetization across PC, console, and mobile platforms. It excludes gaming hardware, esports prize
      pools, and adjacent advertising markets unless explicitly noted. Estimates diverge substantially by methodology:
      Newzoo's annual global games market report tracks software/services spending and has reported figures in the
      $183-200B range for 2023-2025, while Statista's broader "global gaming market" figure of approximately $522.5B
      in 2025 incorporates hardware, accessories, and a wider set of adjacent spending categories. These are not
      directly comparable; this chapter uses Newzoo-equivalent software-centric definitions as the primary lens.


      The second segment is the game engine and real-time 3D creation tools market — the primary revenue pool for
      Unreal Engine. This market includes commercial licenses, royalty revenue, cloud-hosted dev services, and
      marketplace commissions from tools used to create interactive 3D content. It excludes finished game revenues
      (counted in the first segment) but includes non-gaming uses of those same tools (included separately below).


      The third segment is PC digital distribution — where the Epic Games Store competes with Steam and other
      storefronts for developer publishing relationships and consumer purchase share. Revenue to the platform operator
      comes from transaction fees (12% for EGS, 30% for Steam's standard tier), advertising/discovery fees, and
      DLC/currency marketplace economics.


      The fourth segment is the creator/UGC platform economy — where Fortnite Creative and UEFN compete with Roblox,
      Minecraft, and emerging platforms for creator attention, developer tooling adoption, and the revenue share from
      player-generated content engagement. This is a newer and less precisely sized market but is strategically
      critical given its impact on Fortnite's long-term engagement retention.


      The fifth segment is non-gaming real-time 3D — where Unreal Engine competes with specialist visualization
      tools in architecture/engineering/construction (AEC), automotive design, and film/TV virtual production. This
      represents the engine's highest-margin expansion opportunity outside the cyclical gaming market.
    claimRefs:
      - CM001
      - CM002
