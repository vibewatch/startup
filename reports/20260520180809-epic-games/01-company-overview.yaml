  - id: section-adverse
    title: Adverse events, legal history, and operational risks
    body: >
      Epic has faced substantial regulatory, legal, and operational headwinds since 2020, making its adverse event
      record one of the more material in the consumer gaming sector for this period.

      In December 2022, the Federal Trade Commission reached a $520 million settlement with Epic Games — the largest
      penalty in FTC history for two combined violations. The $275 million civil penalty addressed violations of the
      Children's Online Privacy Protection Act (COPPA), the largest COPPA penalty ever recorded. The separate $245
      million consumer refund addressed dark pattern practices in Fortnite's checkout and account systems that the FTC
      found tricked players — including minors — into unintended purchases. Epic acknowledged the settlement and
      implemented remedial design changes, but the case constitutes a confirmed adverse regulatory event with lasting
      reputational implications.

      In August 2020, Epic simultaneously filed lawsuits against both Apple and Google after deliberately triggering
      both platforms to remove Fortnite. In the Apple case (Epic Games v. Apple, N.D. California), Judge Yvonne
      Gonzalez Rogers ruled in September 2021 substantially in favor of Apple on nine of ten counts but issued an
      anti-steering injunction. After appeals upheld the ruling in 2023 and the Supreme Court declined review in
      January 2024, Apple initially implemented compliance measures that Epic challenged as inadequate. In April 2025,
      Judge Rogers ruled Apple had willfully violated her original injunction. Apple subsequently approved Fortnite's
      return to the US App Store with Epic's direct payment system in May 2025; Fortnite returned globally (except
      Australia) by early 2026. In the Google case, a December 2023 jury verdict held that Google's Play Store
      practices were monopolistic and illegal; Fortnite has since been restored on Google Play globally.

      Epic conducted two major layoff events in the current period: approximately 830 employees (16% of the workforce)
      in September 2023, accompanied by the sale of Bandcamp and the spin-off of SuperAwesome; and over 1,000
      employees in early 2026, with Tim Sweeney citing declining Fortnite engagement since 2025 and continued spending
      that outpaced the company's revenue. Both events reflect a structural correction from the pandemic-era expansion.
    claimRefs:
