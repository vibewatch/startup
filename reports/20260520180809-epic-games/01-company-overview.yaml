company:
  name: Epic Games
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Epic Games is a privately held American interactive entertainment and software company founded in 1991 by Tim
    Sweeney, best known for Fortnite, Unreal Engine, and the Epic Games Store. The company has secured over $5B in
    institutional capital at a last-disclosed $31.5B post-money valuation (April 2022), but entered 2026 managing a
    second wave of large-scale layoffs tied to a Fortnite engagement downturn and spending that outpaced revenue, while
    also navigating the aftermath of a $520M FTC settlement and landmark antitrust wins against Google's Play Store.
sections:
  - id: section-identity
    title: Identity, structure, and corporate profile
    body: >
      Epic Games, Inc. is a privately held Delaware-incorporated interactive entertainment and technology company
      headquartered at 620 Crossroads Blvd, Cary, North Carolina. Founded in 1991 by CEO Tim Sweeney under the name
      Potomac Computer Systems, the company was rebranded Epic MegaGames in 1992 and subsequently Epic Games in 1999
      as it expanded from shareware games into mainstream publishing and engine licensing. Sweeney retains majority
      ownership and voting control through a single class of common stock, a governance structure that has insulated the
      company from hostile investor influence even as strategic capital from Tencent, Disney, Sony, and KIRKBI has
      accumulated on the cap table.

      Epic's business spans four principal product lines: Fortnite (interactive entertainment platform), Unreal Engine
      (industry-leading 3D creation tool), Epic Games Store (a PC games marketplace), and Epic Online Services (a
      modular backend services platform). The company's official materials reference over 800 million Fortnite accounts
      and more than 6 billion friend connections as of early 2026, positioning it as one of the largest consumer gaming
      platforms by registered user count globally. Across all product lines, Epic holds a dual identity as both a
      game publisher and as a developer-facing platform and tooling business — a combination that creates meaningful
      cross-segment dependencies and leverage.

      As of the report date in May 2026, the company employs approximately 4,000 people after a series of significant
      workforce reductions in 2023 and early 2026. Epic is private and has not disclosed audited financial statements;
      public revenue estimates based on secondary sources place 2022 revenues at approximately $6B, though the company
      has not confirmed this figure and no more-recent consolidated revenue number is publicly available.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO001
    figureRefs:
      - FO003

  - id: section-governance
    title: Founding, leadership, and governance
    body: >
      Epic Games was founded by Tim Sweeney, who remains its CEO and controlling shareholder more than three decades
      after the company's 1991 inception. Sweeney initially built what is now Unreal Engine in 1995, shipping the first
      version with the 1998 game Unreal, and has since served as the primary technical and strategic decision-maker
      across all of Epic's major product pivots. Mark Rein, who joined around 1992, serves as Vice President and holds
      approximately 4% of the company, making him a material minority shareholder alongside institutional investors.

      Epic's governance is structured around Tim Sweeney's controlling equity position in a single-class common stock
      arrangement. Unlike dual-class structures that separate voting rights from economic rights, Sweeney's majority
      stake gives him both. This structure has been a consistent factor in Epic's ability to pursue adversarial
      positions against large platform owners — notably Apple and Google — without board-level override risk from
      institutional minority shareholders including Tencent, which holds approximately 28% of the company's equity
      but does not hold a control position. The company has not disclosed a formal board composition in public materials,
      and independent director information is not available through accessible public sources as of the report date.

      No CEO succession plan, chief financial officer appointment, or board expansion has been publicly announced.
      Key-person concentration in Tim Sweeney represents a material governance risk for any sustained assessment of
      executive continuity, particularly given the company's scale and the operational complexity of managing four
      simultaneous platform businesses through a period of layoff-driven restructuring.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    tableRefs:
      - TO002

  - id: section-capital
    title: Capital structure and investor map
    body: >
      Epic Games has raised over $5 billion in disclosed institutional capital since its 2012 Tencent transaction,
      with five major financing rounds anchoring the cap table. The company's last disclosed post-money valuation is
      $31.5 billion, set at the April 2022 round co-led by Sony and KIRKBI (the investment arm of the Kirk Kristiansen
      family, owners of the Lego Group). A subsequent $1.5 billion equity investment from The Walt Disney Company,
      announced on February 7, 2024, implied a per-unit value consistent with the 2022 benchmark; Wikipedia's
      current ownership listing shows Disney at approximately 9%, suggesting the transaction closed after announcement,
      though the precise closing date is not confirmed by a directly-accessible primary source as of the report date —
      this represents a minor evidence gap in the cap table timeline.

      The investor roster reflects the convergence of gaming, media, and consumer platform capital around Epic's
      platform ambitions. Tencent's ~28% stake, acquired in 2012 for approximately $330 million, has been diluted by
      subsequent rounds but remains the largest non-founder position. Sony's ~5.4% stake reflects a sustained strategic
      relationship that began with a $200 million co-investment in the 2021 round and deepened with a $1 billion
      participation in the 2022 round. Disney's announced $1.5 billion investment was accompanied by a multi-year
      partnership to create a new games and entertainment universe using Epic's platform and IP, making the capital
      transaction inseparable from the commercial collaboration. KIRKBI's $1 billion position in the 2022 round mirrors
      the family's approach to deep gaming ecosystem integration through its Lego partnership with Epic (Lego Fortnite).

      Epic's capital position as of 2026 is notable for an absence of new public funding announcements since the Disney
      deal. Given the 2026 layoffs and CEO messaging about spending outpacing earnings, the question of whether Epic
      is pursuing a new financing round, strategic M&A, or a path toward public markets is unresolved and represents
      a material forward-looking evidence gap for this chapter.
