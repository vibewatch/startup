callouts:
  - calloutType: strength
    title: Unmatched platform scale and developer ecosystem lock-in
    body: >-
      Fortnite's 800M+ registered accounts, Unreal Engine's industry-leading market position across gaming and film,
      and the Epic Games Store's below-market revenue share create compounding ecosystem advantages that are difficult
      for any single competitor to replicate. The Disney and Sony strategic investments further entrench Epic as
      a convergence point for games, entertainment, and developer tooling.
    claimRefs:
      - CO008
      - CO024
      - CO028
      - CO030
      - CO019
  - calloutType: risk
    title: Spending-to-revenue imbalance and Fortnite engagement risk
    body: >-
      Tim Sweeney's own statements in both the 2023 and 2026 layoff communications confirm that Epic has been spending
      more than it earns. The 2026 layoff cites a Fortnite engagement downturn starting in 2025, which, if sustained,
      would pressure the primary revenue driver and potentially require another financing event or further headcount
      reduction. As a private company with no disclosed audited financials since 2022, the depth of the revenue gap
      is a material blind spot.
    claimRefs:
      - CO041
      - CO042
      - CO034
  - calloutType: risk
    title: FTC enforcement record and ongoing platform regulatory exposure
    body: >-
      The $520M FTC settlement in 2022 — the largest COPPA penalty in history — established Epic as a company willing
      to challenge regulators as well as platform owners. The dark-pattern refund program adds operational complexity.
      Epic's ongoing battles with Apple and Google, while producing favorable outcomes, create continuing litigation
      cost and execution risk that could distract leadership during an already-challenging restructuring period.
    claimRefs:
      - CO033
      - CO035
      - CO036
      - CO037
  - calloutType: insight
    title: Disney deal closes evidence gap — strategic value clear, cap table unclear
    body: >-
      Wikipedia's current equity table lists Disney at ~9%, providing implied evidence that the February 2024
      announced $1.5B equity deal has closed. The commercial partnership to build a Disney-branded games and
      entertainment universe using Epic's Fortnite platform is strategically significant, but the specific closing
      date, final deal terms, and post-close cap table are not confirmed by any directly-accessible primary source
      as of the report date.
    claimRefs:
      - CO020
      - CO021
      - CO023

