  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
        Audited financial statements showing revenue, gross margin, EBITDA, and net income for fiscal years
        2023, 2024, and 2025.
      whyItMatters: >-
        Epic is a private company and has not released audited financials. The revenue-cost imbalance
        acknowledged by Sweeney in both layoff communications cannot be quantified, making valuation,
        unit-economics, and runway analysis impossible from public data.
      diligencePath: >-
        Request financial data room access from Epic Games directly; cross-reference with Tencent's
        consolidation reporting (if Epic is consolidated) or Sony annual reports mentioning equity income.
      relatedQuestionRefs:
        - QO020
    - type: missing-source
      severity: minor
      topic: disney-deal
      missingEvidence: >-
        Primary source confirming the exact closing date of Disney's $1.5B equity investment in Epic Games,
        announced February 7, 2024 as "subject to regulatory approval."
      whyItMatters: >-
        Without a closing-date confirmation, the current cap table and post-close valuation cannot be precisely
        stated; Wikipedia's listing of Disney at 9% provides implied evidence of closure but is not a primary
        source disclosure.
      diligencePath: >-
        Check Disney's 2024 annual report or 10-K for disclosure of the Epic investment; search SEC EDGAR for
        Disney 8-K filed around July–September 2024 that may have announced the closing.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: material
      topic: capital-plans-2026
      missingEvidence: >-
        Any indication of whether Epic Games is pursuing a new financing round, exploring an IPO, or planning
        strategic M&A following the 2026 layoffs and Fortnite engagement decline.
      whyItMatters: >-
        With Fortnite engagement down and spending exceeding revenues, the company's financing path forward
        is a central diligence variable for any forward-looking assessment.
      diligencePath: >-
        Monitor Epic newsroom for announcements; review Tim Sweeney public statements and interviews;
        track Tencent and Disney quarterly investor relations communications for commentary on Epic stake.
      relatedQuestionRefs:
        - QO027
    - type: stale
      severity: minor
      topic: headcount-2026
      missingEvidence: >-
        Official post-layoff headcount figure from Epic Games confirming total employee count after
        the early 2026 restructuring of 1,000+ employees.
      whyItMatters: >-
        The ~4,000 estimate is derived from pre-layoff Wikipedia data and newsroom context; no official
        updated headcount has been publicly released.
      diligencePath: >-
        Monitor Epic Games newsroom, LinkedIn employee count data, and subsequent press releases for
        an updated headcount confirmation.
      relatedQuestionRefs:
        - QO009
    - type: missing-source
      severity: minor
      topic: governance
      missingEvidence: >-
        Board of directors composition for Epic Games, including independent directors, any audit or
        compensation committee memberships, and formal governance structure beyond founder equity control.
      whyItMatters: >-
        Without board transparency, governance risk assessment (succession, oversight, related-party transactions)
        relies entirely on inferences from Sweeney's public statements and investor disclosures.
      diligencePath: >-
        Review Delaware corporate filings; request governance documentation through Epic's legal or investor
        relations contacts; check proxy statements if and when Epic files SEC materials.
      relatedQuestionRefs:
        - QO019
      relatedTableRefs:
        - TO002
