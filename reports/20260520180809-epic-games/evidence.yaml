evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements showing revenue, gross margin, EBITDA, and net income for fiscal years 2023, 2024,
      and 2025.
    whyItMatters: >-
      Epic is a private company and has not released audited financials. The revenue-cost imbalance acknowledged by
      Sweeney in both layoff communications cannot be quantified, making valuation, unit-economics, and runway analysis
      impossible from public data.
    diligencePath: >-
      Request financial data room access from Epic Games directly; cross-reference with Tencent's consolidation
      reporting (if Epic is consolidated) or Sony annual reports mentioning equity income.
    relatedQuestionRefs:
      - QO020
  - type: missing-source
    severity: minor
    topic: disney-deal
    missingEvidence: >-
      Primary source confirming the exact closing date of Disney's $1.5B equity investment in Epic Games, announced
      February 7, 2024 as "subject to regulatory approval."
    whyItMatters: >-
      Without a closing-date confirmation, the current cap table and post-close valuation cannot be precisely stated;
      Wikipedia's listing of Disney at 9% provides implied evidence of closure but is not a primary source disclosure.
    diligencePath: >-
      Check Disney's 2024 annual report or 10-K for disclosure of the Epic investment; search SEC EDGAR for Disney 8-K
      filed around July–September 2024 that may have announced the closing.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
