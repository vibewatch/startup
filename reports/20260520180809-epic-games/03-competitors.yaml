callouts:
  - calloutType: risk
    title: Steam's catalog moat has proven durable against EGS's pricing advantage
    body: >-
      Seven years after EGS's 2018 launch, Steam retains dominant market position by every available metric:
      132M+ MAUs, 50,000+ games, Workshop, Community Market, and Steam Deck hardware integration. Epic's
      12% take rate has attracted individual publisher relationships but has not shifted the market's center
      of gravity. With Fortnite engagement declining and EGS growth contingent on Fortnite cross-account
      infrastructure, the distribution business remains the weakest of Epic's four product lines against
      its primary competitor.
    claimRefs:
      - CP021
      - CP022
      - CP023
      - CP024
      - CP036
      - CP037
  - calloutType: risk
    title: Roblox outperforms UEFN on every creator economy breadth metric
    body: >-
      Roblox paid $923M to creators in 2024, nearly three times UEFN's estimated first-year payout of $320M.
      Roblox operates with 85.3M DAUs and millions of active creators versus UEFN's 20,000+ published
      island creators. While UEFN's quality ceiling is higher (full UE5 toolset vs Roblox Studio/Lua), creator
      economy platforms typically win on breadth and earnings predictability. Roblox's 2024 bookings guidance
      of $5.2-5.3B implies continued revenue growth that will further expand its creator payout pool.
    claimRefs:
      - CP001
      - CP006
      - CP007
      - CP008
      - CP038
  - calloutType: strength
    title: Unity's runtime fee controversy creates a durable UE5 trust advantage in AAA
    body: >-
      Unity's reversal of its Runtime Fee (announced September 2023, reversed September 2024) left a lasting
      trust deficit with professional and indie studios. Unity 6's technical improvements have not fully
      recovered this credibility gap, particularly among AAA studios that were already using or evaluating UE5.
      Epic's royalty-free model for EGS-exclusive games and the stability of UE5's EULA since its 2022 launch
      represent a durable trust advantage at the professional tier.
    claimRefs:
      - CP015
      - CP016
      - CP017
      - CP035
  - calloutType: insight
    title: Godot's MIT license creates a structural royalty floor that disciplines both Epic and Unity
    body: >-
      Godot's zero-cost, open-source model is not a near-term revenue threat to Epic — it lacks AAA rendering
      and console support. However, it anchors the market's price floor, making any future royalty increase by
      either Unity or Epic politically costly with the developer community. The Unity runtime fee episode
      demonstrated how quickly developer migration to Godot can accelerate. Epic must preserve its royalty-free
      EGS option as a defense against this structural pressure.
    claimRefs:
      - CP018
      - CP019
      - CP020
      - CP039

