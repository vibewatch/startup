        - Monitor Fortnite DAU/MAU trends; verify whether engagement decline is cyclical or structural
      - - EGS 12% take rate vs Steam's 30% as developer incentive
        - Steam's catalog depth, community features, and Steam Deck hardware moat
        - Medium — pricing undercut insufficient to overcome Steam's network effects
        - EGS needs catalog or community differentiation beyond pricing to grow share long-term
      - - UEFN as high-quality creator toolset tied to Fortnite audience
        - Roblox's larger creator base, simpler onboarding, and higher absolute creator payouts
        - Medium — Roblox wins creator breadth; UEFN may win creator quality and IP power
        - Track UEFN published island count, creator payout growth, and top-island engagement vs Roblox
      - - Epic's legal wins vs Apple/Google improving mobile TAM
        - Apple appealing 2025 ruling; Google remedy uncertain; political risk in US antitrust environment
        - Medium — regulatory wins may be partially reversed on appeal
        - Monitor Apple's appellate process and Google Play remedy negotiation through 2026
      - - Unreal Engine royalty waiver for EGS exclusives (developer incentive)
        - Developers can ship on Steam and EGS simultaneously; multi-homing limits exclusivity leverage
        - Low-Medium — EOS royalty waiver is a real incentive but has not moved catalog concentration
        - Assess what % of new EGS titles use EOS and whether royalty waiver is the primary acquisition driver
      - - Studio switching costs (engine migration is expensive for committed franchises)
        - New projects and indie developers face low switching costs; Godot's zero-cost model growing
        - "Low for new starts, High for committed franchises — net effect: medium"
        - Track Godot market share in published titles post-Unity crisis (2024-2026 indie cohort)
      - - Epic antitrust positioning as platform challenger (Apple, Google, Valve)
        - Regulatory counter-pressure; consumer perception of EGS exclusives as anti-consumer
        - Low-Medium — legal wins are real but consumer PR around exclusives remains negative
        - Assess EGS consumer sentiment surveys and return rate on exclusive-lapsed titles to Steam
    notes: >-
      Fortnite engagement downturn cited in Epic's 2026 layoff communication (per company overview chapter).
      Steam Steam Deck noted per Wikipedia Steam article. Unity 6 release per Wikipedia Unity article. Apple
      2025 ruling per The Verge reporting (covered in market analysis chapter). All threat severity assessments
      are qualitative based on available evidence; no formal probability weighting is warranted given Epic's
      private status and limited financial disclosure.
    claimRefs:
