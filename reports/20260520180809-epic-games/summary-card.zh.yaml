summary:
  headline: Epic Games 拥有顶级游戏和引擎资产，但 Fortnite 集中度、平台依赖和私有公司不透明，让最后一次硬性 $31.5 billion 估值显得偏贵；当前公开证据只支持谨慎的继续研究立场。
