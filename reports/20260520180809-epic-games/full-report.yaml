      - number: '2.4'
        title: PC digital distribution economics — Epic Games Store versus Steam
        blocks:
          - type: paragraph
            body: >
              Digital distribution of PC games is a market dominated by Valve's Steam, which held an estimated 75% of PC
              digital game distribution in 2013 (IHS Screen Digest) and had grown to over 34,000 titles with 132 million
              monthly active users by 2021. By 2017, annual Steam purchases totaled approximately $4.3 billion,
              representing at least 18% of global PC game sales (Steam Spy estimate). Steam's current market position is
              likely stronger than the 2013 figure given its network effects, but comparable current-year share data is
              not publicly disclosed.


              Epic's strategic rationale for the Epic Games Store was explicit from its December 2018 launch: challenge
              Steam's 30% revenue take with a 12% split (88% to developers), arguing that Valve's margin was unjustified
              at scale. As of May 2026, the EGS distribution page reports 295 million users across 187 countries, 80+
              payment methods in 43 regional currencies, and a zero-cut tier for the first $1 million in annual net
              revenue per product (effective June 2025 per Wikipedia EGS article). An opt-in exclusivity program offers
              100% revenue share during the first six months of release. The standard EGS model leaves Epic with
              approximately 5% net operating margin after content delivery costs — a thin buffer that requires scale
              economies from Fortnite and marketplace cross-selling to be sustainable.


              Steam's tiered pricing structure (30% standard, 25% for titles generating over $10M, 20% for those over
              $50M) means that Epic's 12% cut is most competitive for mid-tier publishers who generate between $1M and
              $50M annually and do not benefit from Steam's volume discounts. For AAA publishers exceeding $50M, Steam's
              effective take rate approaches 20%, narrowing (but not eliminating) Epic's competitive price advantage.
              This tiering dynamic segments the addressable publisher market for EGS.


              Steam's network effects — community features, trading cards, market integration, VR support, Steam Deck
              compatibility, and Proton Linux compatibility — represent substantial switching costs for both publishers
              and consumers that go beyond raw revenue economics. Epic acknowledged this implicitly: Tim Sweeney stated
              that exclusive deals were the only way to generate meaningful traffic to EGS against Steam's entrenched
              position. Epic has since moved to an open self-publishing model (March 2023) and progressively reduced
              revenue-share friction, but EGS market share in PC distribution remains materially below Steam's.
            claimRefs:
              - CM022
