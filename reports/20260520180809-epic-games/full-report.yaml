      - number: '6.4'
        title: Enterprise, film, architecture, and government customers using Unreal Engine
        blocks:
          - type: paragraph
            body: >
              Unreal Engine's adoption beyond gaming represents a strategically distinct customer segment with different
              economics, buyer types, and switching dynamics. In film and television, UE is used for virtual production
              via LED volume stages — replacing traditional chromakey with real-time 3D backgrounds rendered on large
              LED walls that react to camera motion. Industrial Light & Magic co-developed the StageCraft technology
              with Epic for The Mandalorian, which received critical acclaim for visual quality and efficiency; the
              approach was subsequently adopted for Westworld (Season 3) and Fallout (2024). By October 2022, Epic was
              working with groups operating more than 300 virtual production sets globally, giving the technology
              significant production-scale adoption. UE received a Primetime Engineering Emmy Award in 2020 for
              exceptional contributions to broadcast technology, a form of industry validation that strengthens
              enterprise sales.

              In the government and defense segment, Epic established a partnership with Virtual Heroes (Applied
              Research Associates) for the Unreal Government Network, which handles UE licenses for government agencies.
              Named users include the U.S. Army (anesthesiology training software), the FBI Academy (multiplayer crime
              scene simulation), and the DHS Science and Technology Directorate (EDGE first-responder training
              platform). These are production deployments, not pilots.

              Architecture, engineering, and construction (AEC) customers use UE for 3D visualization, real-time
              walkthroughs, and design review. Automotive customers — BMW, Ford, Porsche and others — use UE for vehicle
              configuration visualization and digital showroom applications. Epic's MegaGrants program supports creators
              building tools and projects on UE5 or UEFN, extending access to educational institutions, research
              organizations, and emerging studios that become long-term ecosystem participants. The enterprise segment's
              revenue is not publicly disclosed; enterprise deals operate under custom licensing arrangements outside
              the standard 5% royalty model.
            claimRefs:
              - CU024
              - CU025
              - CU026
              - CU027
              - CU042
      - number: '6.5'
        title: Concentration risks, EGS publisher segment, retention gaps, and regulatory findings
        blocks:
          - type: paragraph
            body: >
              The Epic Games Store serves a fifth customer category: game publishers and buyers. EGS reached 295 million
              registered accounts and $950 million in revenue in 2023. The platform's core value proposition to
              publishers is economics: 88% of revenue retained by publishers versus 70% on Steam. Starting June 2025,
              Epic further eliminated its revenue cut entirely for games earning under $1 million in total sales, making
              EGS a near-zero-cost channel for smaller studios. The First Run program, free weekly games (one per week
              since June 2019), and time-exclusivity deals with guaranteed minimum revenue payments are the primary
              publisher acquisition tools. The GTA V free giveaway in May 2020 attracted more than 7 million new users;
              Star Wars Battlefront II (January 2021) drew 19 million downloads — demonstrating that free games drive
              substantial user acquisition for EGS. The EGS mobile expansion (global Android and EU iOS, August 2024)
              broadens the addressable publisher distribution opportunity but leaves U.S. iOS pending an ongoing Apple
              court dispute.

              Customer concentration risk is materially weighted toward Fortnite. The March 2026 memo from CEO Tim
              Sweeney made explicit what was previously implicit: Fortnite is the primary revenue driver, and its
              engagement decline caused spending to exceed earnings at a company-wide level. The $500 million cost
              savings program and 1,000+ layoffs were the operational consequence of single-title revenue concentration.
              The FTC's $520 million settlement (December 2022) — comprising $275 million for COPPA violations in
              children's data collection and $245 million for dark-pattern monetization practices — further quantifies
              consumer behavior risks in Fortnite's user base. More than 600,000 users filed refund claims related to
              unwanted purchases, signaling a meaningful friction point in the monetization model. PCGamesN's reporting
              on Epic's settlement response shows Epic acknowledged that "long-standing industry practices are no longer
              enough," indicating structural reforms to consumer-facing payment flows.

              No publicly available NRR, GRR, or cohort churn data exists for any Epic customer segment; the company is
              private and does not publish segment financials. Disney's $1.5 billion minority equity investment in
              February 2024 provides strategic validation of Fortnite's long-term platform potential but does not
              substitute for disclosed retention metrics. The UEFN creator income concentration among top-performing
              islands (algorithmically amplified by the Discover system) creates a parallel concentration risk in the
              creator economy: a small number of islands likely capture a disproportionate share of the $320M+ in
              creator payments, leaving the majority of the 20,000+ creators with modest economics.
