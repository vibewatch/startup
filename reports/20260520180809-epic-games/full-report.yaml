      - number: '3.5'
        title: Moat durability, displacement risk, and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >
              Epic's competitive moats vary sharply by business line. In game engines, Unreal Engine 5's technical
              leadership in high-fidelity rendering (Nanite, Lumen, Chaos physics) creates real switching costs for AAA
              studios: migrating to a new engine mid-franchise requires tool re-training, asset pipeline
              re-construction, and significant sunk cost write-offs. The UE5 Visual Scripting system (Blueprints) and
              Marketplace asset library further increase stickiness. However, this moat is effective primarily against
              studios with active multi-title franchises; greenfield projects are free to evaluate all engines, and
              Unity's Pro subscription model and Godot's zero-cost model create ongoing competitive pressure at the
              lower and mid-market tiers where UE5's high-fidelity advantage is irrelevant.

              In PC distribution, Epic has no durable moat. The EGS's 12% take rate has not converted a majority of
              third-party publishers away from Steam over seven years of operation; the network-effect gap between
              Steam's 132M MAUs and EGS's 295M registered users (with lower implied active engagement per user) remains
              decisive. Steam's Workshop, Community Market, Steam Trading Cards, and native Linux support via Proton
              (Steam Deck) represent multi-layered community infrastructure that EGS cannot replicate quickly or
              cheaply. The adverse evidence is explicit: despite price-competitive positioning, EGS has not been
              publicly reported to approach Steam's per-user revenue or publisher catalog breadth.

              In UGC and creator economy, UEFN's moat is early-stage and structural: the UEFN toolset is uniquely tied
              to Fortnite's 800M+ account base as the distribution channel, creating a built-in audience that Roblox
              does not give UEFN creators. However, Roblox's larger creator base ($923M vs Epic's ~$320M first-year UEFN
              payouts), simpler onboarding, and higher daily engagement (85.3M DAUs vs Fortnite's 126M monthly players
              implies different daily active usage ratios) suggest Roblox holds the creator economy moat on breadth
              metrics. Epic's UEFN advantage is creator tooling quality and IP brand power (Marvel, Star Wars, Disney),
              not creator network scale.

              Switching costs across Epic's competitor ecosystem: - Engine switching: high for committed franchise
              studios; low for new projects - EGS switching: very low for consumers (no DRM lock-in beyond
              Epic-exclusive titles); low for publishers
                (multi-homing is common; most publishers ship simultaneously on Steam and EGS)
              - Fortnite/UEFN platform: medium (creator investments in maps and IP are EGS-exclusive; player V-Bucks
                are non-transferable; but Fortnite is free-to-play reducing consumer lock-in)

              The core adverse risk from competitors is concentrated in two areas: (1) Unity's eventual rebound from its
              2023-2024 credibility crisis could restore developer market share in mobile and mid-market — Unity 6
              (released 2024) represents a credible technical response to UE5's advances; (2) Steam's absolute catalog
              dominance means EGS success depends on Fortnite account relationships rather than storefront competitive
              merit, making EGS strategically contingent on Fortnite's continued audience engagement at a time when Epic
              has cited a Fortnite engagement downturn.
            claimRefs:
              - CP035
              - CP036
              - CP037
              - CP038
              - CP039
