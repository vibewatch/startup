              An estimated 80% of Epic's revenue derives from Fortnite, which itself peaked at $5.4 billion in 2018 and
              has declined to approximately $3.5 billion by 2023 per BusinessOfApps. The March 2026 price increase
              (first significant V-Bucks adjustment since launch) and concurrent 1,000-person layoff targeting $500M in
