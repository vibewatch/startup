      - number: '4.4'
        title: Legal settlements and regulatory cash outlays
        blocks:
          - type: paragraph
            body: >
              Epic has incurred significant legal and regulatory cash charges since 2022. The Federal Trade Commission
              settlement (December 2022) imposed a $520 million total payment across two components: $275 million paid
              to the US government as a civil penalty for violating the Children's Online Privacy Protection Act (COPPA)
              — the largest COPPA fine in FTC history — and a separate $245 million to a consumer refund fund to
              compensate users harmed by dark-pattern design practices. CNN reported the combined $520M as the "largest
              fine the FTC has ever imposed." The $245M refund fund has been partially disbursed: the FTC reported
              distributing approximately $72 million to over 600,000 eligible users in December 2024. The settlement
              additionally imposes a 20-year prohibition on dark patterns and requires Epic to implement explicit
              payment consent mechanisms.

              The Apple litigation produced a materially positive financial outcome for Epic. In April 2025, US District
              Judge Yvonne Gonzalez Rogers found Apple in willful violation of a 2021 injunction and ordered Apple to
              immediately cease charging commissions on external purchase link transactions. The court also ordered
              Apple to pay Epic's attorney fees incurred in the contempt proceedings. Apple had been charging a 27%
              commission on off-app purchases (down from the original 30% in-app rate) after the 2021 ruling — a
              practice the court found continued Epic's anticompetitive harm. Apple is appealing the April 2025 ruling;
              Fortnite returned to the US App Store in May 2025.

              The Google Play settlement (announced March 4, 2026) resolved Epic's antitrust case following Epic's
              December 2023 jury verdict win. The settlement establishes differentiated rates: 5% billing fee plus 15%
              service fee for new installs (in-app content), 20% all-in for existing installs, 15% for flat purchases
              (new installs), and 10% for subscriptions. Fortnite returned to Google Play globally on March 19, 2026.
              Ars Technica described the outcome as evidence that "the flat 30% Play Store share is well and truly dead"
              for Epic's titles.
