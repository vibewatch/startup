      - number: '5.3'
        title: Epic Games Store product economics and platform expansion
        blocks:
          - type: paragraph
            body: >
              The Epic Games Store (EGS) is Epic's PC, Mac, Android, and iOS games distribution platform, reaching over
              295 million registered PC/Mac users across 187 countries with 16 languages supported and 80+ payment
              methods. The store was launched in December 2018 with a developer-favorable 88%/12% revenue split —
              developers keep 88%, Epic takes 12% — compared to Steam's then-standard 30% (now tiered at 30%/25%/20%).
              As of June 2025, Epic extended the terms with a 100%/0% structure for the first $1 million in net revenue
              per product per year, effectively eliminating Epic's take rate for smaller titles. A "First Run Program"
              offers 100% revenue share for the first six months of exclusivity for new titles; the "Now on Epic"
              program extends similar terms to previously released games.

              For Unreal Engine games, the royalty economics are further incentivized: the 5% UE royalty is waived
              entirely for games distributed exclusively through EGS using Epic's payment system. This creates a
              meaningful, though opaque, total effective discount for UE5 developers who choose EGS exclusivity over
              multi-platform distribution.

              EGS mobile expansion: Epic launched the EGS on Android (global) and iOS (European Union only, under the EU
              Digital Markets Act) on August 16, 2024. The iOS EU launch capitalized on Apple's obligations under the
              DMA, which required Apple to permit alternative storefronts. Epic began offering third-party games on
              mobile in January 2025. In April 2025, following the contempt ruling against Apple in the Epic v. Apple
              litigation, Sweeney announced plans to bring EGS to iOS in the United States. The free games program,
              which offers weekly free PC titles, has been a critical user acquisition driver: EGS revenue of $950M in
              2023 with 270M users, per Wikipedia's EGS article.

              EGS self-publishing allows any developer to list their game for a $100 fee (introduced March 2023),
              similar to Steam Direct. Epic prohibits pornographic titles and requires cross-platform play support for
              multiplayer games.

              Adverse finding — EGS profitability: Apple's 2021 court testimony in the Epic v. Apple trial asserted that
              the EGS was running approximately $400 million in cumulative losses from 2019 to 2020, driven by
              exclusivity minimum guarantees and free game licensing costs. Apple's analysis projected EGS would not
              reach profitability until 2027. Epic publicly disputed this, stating it expected profitability by 2023. As
              of the report date, neither Epic's claimed 2023 profitability nor the 2027 Apple projection has been
              confirmed by public financial data, as Epic does not publish segment financials. This profitability
              ambiguity represents a material gap in understanding the net cash drag EGS places on Epic's consolidated
              P&L.
            claimRefs:
              - CE021
              - CE022
              - CE023
              - CE024
              - CE025
              - CE026
              - CE027
      - number: '5.4'
        title: Epic Online Services, MetaHuman, and Fab marketplace
        blocks:
          - type: paragraph
            body: >
              Epic Online Services (EOS) is Epic's free, cross-platform backend services suite for multiplayer game
              development. EOS is game-engine-agnostic and operates independently of Unreal Engine, with SDKs available
              in C and C# and integrations for Unity, Unreal Engine, and custom engines. EOS organizes its services into
              four groups: Accounts and Social (Epic Account Services requiring an Epic Games account), Multiplayer
              (Game Services, no Epic account required), Player and Game Data (Game Services), and Trust and Safety
              (Game Services).

              The Accounts and Social services tap into a player ecosystem of nearly one billion players via Epic Games
              accounts, enabling crossplay, friends lists, presence information, and a Social Overlay UI. The
              Multiplayer services include peer-to-peer (P2P), sessions, lobbies, matchmaking, NAT traversal, voice
              chat, and anti-cheat. Game Services accept player authentication via multiple identity providers including
              Steam, Google, Amazon, PlayStation, Xbox, Nintendo, and Epic accounts, enabling truly platform-agnostic
              backend integration. The Player and Game Data services cover cloud saves, achievements, leaderboards,
              stats, and title storage. The Trust and Safety group includes EOS Anti-Cheat and Kids Web Services (KWS)
              integration.

              Kids Web Services (KWS), originally developed by London-based startup SuperAwesome (which Epic acquired in
              2020), is a parental consent management and age verification toolkit. When SuperAwesome was demerged in a
              management buyout in January 2024, Epic retained KWS. KWS gained notable third-party adoption when Bluesky
              began requiring UK users to register with KWS for certain features in July 2025, fulfilling requirements
              under the UK Online Safety Act 2023. KWS represents a modest but growing revenue-adjacent asset: its
              adoption by non-gaming platforms signals expanding applicability of Epic's trust infrastructure.

              MetaHuman is Epic's cloud-based character creation framework for producing high-fidelity, fully rigged
              digital humans. The technology was assembled from three acquisitions — 3Lateral (character
              scanning/rigging), Cubic Motion (facial performance capture), and Quixel (photogrammetry assets).
              MetaHuman Creator allows developers to create photoreal digital humans in minutes from presets or starting
              from existing meshes ("Mesh to MetaHuman"). MetaHuman Animator enables real-time and offline facial
              animation from actor performances, including an audio-to-animation inference capability introduced in
              UE5.5. MetaHuman is compatible with UEFN (support added March 2024), compatible with Fab for sharing
              MetaHumans, and deployable from mobile to console. MetaHuman 5.7 (December 2025) delivered major body
              conforming improvements, removed the A-pose requirement, lifted height restrictions, and enabled FBX
              round-trip. MetaHuman 5.8 Preview was released in May 2026.

              Fab is Epic's unified digital asset marketplace, launched October 22, 2024, consolidating Sketchfab,
              ArtStation Marketplace, Quixel Megascans, and the legacy Unreal Engine Marketplace into a single platform.
              Fab is described as "tool-agnostic" and open to content for all engines, not just Unreal Engine. As of
              UE5.5 (November 2024), Fab is integrated into the Unreal Engine editor, enabling drag-and-drop import of
              individual Quixel Megascans assets directly into scenes. Fab uses an 88%/12% revenue split for sellers,
              matching the EGS developer terms.
