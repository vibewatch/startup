  - id: FU004
    title: Retention and repeat cohort — Fortnite engagement and developer stickiness
    type: cohort
    description: >-
      Estimated retention cohorts for Fortnite consumer engagement and UE5 developer repeat use. Values are analyst
      estimates derived from public platform data, industry benchmarks, and disclosed engagement signals (CEO memo, GDC
      disclosures). Not verified by Epic. Columns represent time since first engagement; values are percentage of
      original cohort still active.
    data:
      columns:
        - Month 1
