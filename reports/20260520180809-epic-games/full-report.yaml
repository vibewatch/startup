      - number: '1.2'
        title: Founding, leadership, and governance
        blocks:
          - type: paragraph
            body: >
              Epic Games was founded by Tim Sweeney, who remains its CEO and controlling shareholder more than three
              decades after the company's 1991 inception. Sweeney initially built what is now Unreal Engine in 1995,
              shipping the first version with the 1998 game Unreal, and has since served as the primary technical and
              strategic decision-maker across all of Epic's major product pivots. Mark Rein, who joined around 1992,
              serves as Vice President and holds approximately 4% of the company, making him a material minority
              shareholder alongside institutional investors.

              Epic's governance is structured around Tim Sweeney's controlling equity position in a single-class common
              stock arrangement. Unlike dual-class structures that separate voting rights from economic rights,
              Sweeney's majority stake gives him both. This structure has been a consistent factor in Epic's ability to
              pursue adversarial positions against large platform owners — notably Apple and Google — without
              board-level override risk from institutional minority shareholders including Tencent, which holds
              approximately 28% of the company's equity but does not hold a control position. The company has not
              disclosed a formal board composition in public materials, and independent director information is not
              available through accessible public sources as of the report date.

              No CEO succession plan, chief financial officer appointment, or board expansion has been publicly
              announced. Key-person concentration in Tim Sweeney represents a material governance risk for any sustained
              assessment of executive continuity, particularly given the company's scale and the operational complexity
              of managing four simultaneous platform businesses through a period of layoff-driven restructuring.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
