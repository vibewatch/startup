      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Steam's catalog moat has proven durable against EGS's pricing advantage
            body: >-
              Seven years after EGS's 2018 launch, Steam retains dominant market position by every available metric:
              132M+ MAUs, 50,000+ games, Workshop, Community Market, and Steam Deck hardware integration. Epic's 12%
              take rate has attracted individual publisher relationships but has not shifted the market's center of
              gravity. With Fortnite engagement declining and EGS growth contingent on Fortnite cross-account
              infrastructure, the distribution business remains the weakest of Epic's four product lines against its
              primary competitor.
            calloutType: risk
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP036
              - CP037
          - type: callout
            title: Roblox outperforms UEFN on every creator economy breadth metric
            body: >-
              Roblox paid $923M to creators in 2024, nearly three times UEFN's estimated first-year payout of $320M.
              Roblox operates with 85.3M DAUs and millions of active creators versus UEFN's 20,000+ published island
              creators. While UEFN's quality ceiling is higher (full UE5 toolset vs Roblox Studio/Lua), creator economy
              platforms typically win on breadth and earnings predictability. Roblox's 2024 bookings guidance of
              $5.2-5.3B implies continued revenue growth that will further expand its creator payout pool.
            calloutType: risk
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP038
          - type: callout
            title: Unity's runtime fee controversy creates a durable UE5 trust advantage in AAA
            body: >-
              Unity's reversal of its Runtime Fee (announced September 2023, reversed September 2024) left a lasting
              trust deficit with professional and indie studios. Unity 6's technical improvements have not fully
              recovered this credibility gap, particularly among AAA studios that were already using or evaluating UE5.
              Epic's royalty-free model for EGS-exclusive games and the stability of UE5's EULA since its 2022 launch
              represent a durable trust advantage at the professional tier.
            calloutType: strength
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP035
          - type: callout
            title: Godot's MIT license creates a structural royalty floor that disciplines both Epic and Unity
            body: >-
              Godot's zero-cost, open-source model is not a near-term revenue threat to Epic — it lacks AAA rendering
              and console support. However, it anchors the market's price floor, making any future royalty increase by
              either Unity or Epic politically costly with the developer community. The Unity runtime fee episode
              demonstrated how quickly developer migration to Godot can accelerate. Epic must preserve its royalty-free
              EGS option as a defense against this structural pressure.
            calloutType: insight
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP039
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >
              Epic Games operates across four commercial monetization pillars, each with distinct unit economics and
              risk profiles. Fortnite Battle Royale is overwhelmingly dominant: BusinessOfApps estimates place Fortnite
              revenue at approximately $3.5 billion in 2023, down from a peak of $5.4 billion in 2018 and $3.6 billion
              in 2019. The game accumulated $9 billion in lifetime revenue through December 2019 alone. Fortnite
              monetizes through three mechanisms — V-Bucks virtual currency (used for cosmetics and Battle Passes), the
              Fortnite Crew subscription ($11.99/month; includes the Battle Pass and monthly V-Bucks), and
              character/cosmetic licensing from IP partners including Marvel, Disney, and Star Wars. In March 2026, Epic
              increased V-Bucks pricing by approximately 20% (800 V-Bucks now costs $10, previously approximately 1,000
              V-Bucks for $8.99), the first significant price adjustment since Fortnite's launch. This increase
              coincided with an announcement that Fortnite Save the World — the original paid PvE mode — would go
              free-to-play in April 2026, trading upfront purchase revenue for engagement and cosmetic spend.

              The UEFN Creator Economy (launched with UEFN in March 2023) paid an estimated $320 million to over 20,000
              creators in its first year of beta operation, per Epic's GDC 2024 disclosure cited in Wikipedia's UEFN
              article. Creators receive 40% of engagement revenue attributable to their islands per Digiday's reporting.
              This creates a recurring payout obligation tied directly to Fortnite's revenue base.

              The Epic Games Store (EGS) offers an 88%/12% revenue split in favor of developers, with a 0% rate on the
              first $1 million per product per year (introduced June 2025). EGS grew to 295 million registered PC/Mac
              users by 2025. However, the EGS was running at significant losses in 2019–2020 (approximately $400 million
              per Apple court filing testimony), and Apple's own analysis projected EGS would not achieve profitability
              until 2027. Unreal Engine 5 (UE5) generates royalty revenue at 5% of gross product revenue above $1
              million per product — waived entirely for games distributed exclusively through EGS — plus enterprise and
              cloud licensing fees. Fab marketplace (formerly Unreal Engine Marketplace, relaunched October 22, 2024 as
              a unified platform combining Sketchfab, ArtStation Marketplace, Quixel, and UE Marketplace assets)
              provides Epic a share of developer asset sales.
