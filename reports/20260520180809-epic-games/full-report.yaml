      - number: '2.5'
        title: Creator economy and UGC platforms — UEFN and Fortnite Creative
        blocks:
          - type: paragraph
            body: >
              Fortnite's creator and UGC ecosystem represents one of Epic's most strategically differentiated market
              positions. Fortnite Creative launched alongside the game in December 2018, and the Unreal Editor for
              Fortnite (UEFN) — a full UE5-based toolset for island creation — launched in March 2023. The platform
              competes with Roblox (85.3M daily active users as of February 2025, per Wikipedia) and Minecraft's creator
              ecosystem.


              Epic's "Creator Economy 2.0" positions creators as revenue-sharing partners rather than content licensees.
              According to Digiday's reporting from Epic's GDC 2023 State of Unreal presentation, Fortnite users spend
              approximately 40% of their total playtime inside Creative mode, including user-created games, training
              maps, and brand activations. This figure motivated the shift to Creator Economy 2.0, under which creators
              receive 40% of all Fortnite revenue attributable to their island's engagement. Digiday reported
              approximately 70 million monthly Fortnite players at the time of this transition in mid-2023.


              In the first year of UEFN's beta phase, the Island Creator program paid an estimated $320 million to over
              20,000 developers with published experiences (per Wikipedia's UEFN article). This payout scale rivals
              smaller game engine licensing ecosystems in absolute dollar terms and validates the platform's creator
              monetization thesis. The UEFN ecosystem has since expanded with assets from LEGO, Fall Guys, TMNT, Star
              Wars (March 2026), and Walking Dead, progressively increasing IP diversity for creators.


              Structural risks in the creator economy model include: opacity of Epic's creator payout formula (not
              publicly disclosed as a safeguard against abuse), creator IP disputes (the "Pit" DMCA controversy in March
              2024  demonstrated tensions between platform governance and creator property rights), and concentration
              risk where a small number of high-traffic creators capture a disproportionate share of payout. However,
              the $320M first-year payout demonstrates that Epic has built a commercially real creator economy, not
              merely an announced strategy.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
