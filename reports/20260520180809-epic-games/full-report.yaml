      - number: '2.8'
        title: Exhibits
        blocks:
          - type: callout
            title: Mobile gatekeeping remains the largest market constraint
            body: >-
              Epic's iOS revenue was structurally eliminated from August 2020 (Fortnite removal) to May 2025 (US return)
              and remains geographically incomplete (Australia excluded as of May 2026). Apple's appeal of the April
              2025 ruling introduces multi-year appellate uncertainty. Google's Play Store retains its 30% fee for most
              Android developers despite Epic's settlement, and Fortnite's Android presence relies on Samsung's Galaxy
              Store and Epic's own sideloading pathway — materially narrower than a full Google Play reinstatement.
              Mobile gaming constitutes approximately $126B of the broader gaming market per Statista; Epic's ability to
              participate directly in this market is still partially blocked, limiting addressable revenue versus where
              Fortnite's player base actually spends time on mobile.
            calloutType: risk
            claimRefs:
              - CM041
              - CM042
              - CM043
          - type: callout
            title: Newzoo structural shift favors Fortnite but limits new-IP optionality
            body: >-
              Newzoo's 2026 report explicitly states that gaming growth is now "driven by monetization efficiency,
              pricing strategy, and platform economics, not expanding player time." This is a bullish signal for
              Fortnite as a deeply embedded live-service franchise, but a significant headwind for any new IP Epic might
              launch. New titles must compete for a fixed — or slowly growing — pool of player attention dominated by
              Fortnite itself, Roblox (85.3M DAU), Minecraft, and a handful of other persistent platforms. Epic's
              layoffs may partly reflect this structural recognition: maintaining Fortnite's position requires capital,
              but launching new competing platforms in a stagnant attention market is a high-cost, uncertain-return
              endeavor.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
