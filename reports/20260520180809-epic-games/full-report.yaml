  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Fortnite platform and UEFN creator ecosystem
        blocks:
          - type: paragraph
            body: >
              Fortnite is Epic's primary consumer product and its most important technology testbed. As of early 2026,
              the game has accumulated over 800 million registered accounts, making it one of the largest consumer
              gaming platforms by user count globally. Epic migrated Fortnite from Unreal Engine 4 to Unreal Engine 5 in
              December 2021, months before UE5's public release in April 2022, using the game to validate rendering
              pipeline changes at production scale and in real-time multiplayer conditions. This dual-use of Fortnite as
              a live product and internal engineering benchmark is a structural advantage: Epic's internal teams ship
              UE5 features directly into a game with 100+ concurrent million players, producing battle-tested production
              code that external studios then adopt.

              The Unreal Editor for Fortnite (UEFN), launched in March 2023, is a specialized version of Unreal Engine
              tailored for user-generated content within Fortnite. UEFN represents a fundamental architectural shift
              from the preceding Fortnite Creative (Creative 1.0): it exposes a near-full Unreal Engine editor interface
              to creators, introduces the Verse programming language (Epic's purpose-built scripting language for
              interactive experiences), and enables collaboration via Unreal Revision Control. UEFN operates on Windows
              only. Notably, Epic chose not to include Blueprints visual scripting — standard in Unreal Engine —
              replacing it with Verse, creating a new scripting paradigm that developers must learn from scratch.

              The UEFN Creator Economy paid an estimated $320 million to more than 20,000 creators with published
              experiences in the first year of its beta phase (2023–2024), per Epic's GDC 2024 disclosure cited in
              Wikipedia's UEFN article. Creators receive 40% of engagement revenue attributable to their islands, with
              Epic retaining approximately 60%. This model closely mirrors Roblox's creator economy and positions
              Fortnite as a user-generated content platform competing for creator mindshare. The ecosystem includes the
              Island Creator program for recurring engagement revenue and the Support-A-Creator affiliate program.

              The Fortnite platform has expanded its licensed content aggressively. LEGO assets and MetaHuman character
              support were added to UEFN on March 20, 2024. Fall Guys assets followed in July 2024. Star Wars assets
              were added in March 2026 with publishing support by May 1, 2026. This IP licensing strategy deepens
              Fortnite's cultural relevance while creating recurring developer opportunities within the UEFN ecosystem.

              Key adversarial note: UEFN's Discovery algorithm — the recommendation system controlling which creator
              islands receive player traffic — is opaque. Epic has stated it weights total hits, engagement, player
              retention, and V-Bucks spend, but the exact formula is not disclosed. The display of concurrent user (CCU)
              counts on the Discover page created community backlash as smaller creators alleged algorithmic bias
              against low-CCU experiences. IP and DMCA issues emerged early in UEFN's beta as the custom content import
              feature enabled copyright-infringing assets; Epic addressed this through content policies but the risk of
              moderation failure remains structurally elevated in an open creator platform.
