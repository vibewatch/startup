      - number: '1.3'
        title: Capital structure and investor map
        blocks:
          - type: paragraph
            body: >
              Epic Games has raised over $5 billion in disclosed institutional capital since its 2012 Tencent
              transaction, with five major financing rounds anchoring the cap table. The company's last disclosed
              post-money valuation is $31.5 billion, set at the April 2022 round co-led by Sony and KIRKBI (the
              investment arm of the Kirk Kristiansen family, owners of the Lego Group). A subsequent $1.5 billion equity
              investment from The Walt Disney Company, announced on February 7, 2024, implied a per-unit value
              consistent with the 2022 benchmark; Wikipedia's current ownership listing shows Disney at approximately
              9%, suggesting the transaction closed after announcement, though the precise closing date is not confirmed
              by a directly-accessible primary source as of the report date — this represents a minor evidence gap in
              the cap table timeline.

              The investor roster reflects the convergence of gaming, media, and consumer platform capital around Epic's
              platform ambitions. Tencent's ~28% stake, acquired in 2012 for approximately $330 million, has been
              diluted by subsequent rounds but remains the largest non-founder position. Sony's ~5.4% stake reflects a
              sustained strategic relationship that began with a $200 million co-investment in the 2021 round and
              deepened with a $1 billion participation in the 2022 round. Disney's announced $1.5 billion investment was
              accompanied by a multi-year partnership to create a new games and entertainment universe using Epic's
              platform and IP, making the capital transaction inseparable from the commercial collaboration. KIRKBI's $1
              billion position in the 2022 round mirrors the family's approach to deep gaming ecosystem integration
              through its Lego partnership with Epic (Lego Fortnite).

              Epic's capital position as of 2026 is notable for an absence of new public funding announcements since the
              Disney deal. Given the 2026 layoffs and CEO messaging about spending outpacing earnings, the question of
              whether Epic is pursuing a new financing round, strategic M&A, or a path toward public markets is
              unresolved and represents a material forward-looking evidence gap for this chapter.
            claimRefs:
