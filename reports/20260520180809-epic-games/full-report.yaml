figures:
  - id: FO001
    title: Epic Games Corporate Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      Epic's public record runs from a 1991 shareware startup through platform-scale gaming, $5B+ in institutional
      capital, landmark antitrust litigation, and a second wave of workforce restructuring in 2026.
    data:
      items:
        - date: 1991
          label: Founded as Potomac Computer Systems
          detail: Tim Sweeney starts shareware game company; renamed Epic MegaGames (1992) and Epic Games (1999).
          tone: positive
        - date: 1998
          label: Unreal Engine 1 ships
          detail: First commercial release of what becomes the world's most widely-used game engine.
          tone: positive
        - date: 2012
          label: Tencent $330M investment (~40% stake)
          detail: First major institutional capital; Tencent remains largest non-founder shareholder at ~28% in 2026.
          tone: positive
        - date: 2017
          label: Fortnite Battle Royale launches free-to-play
          detail: Cultural phenomenon; 125M players within one year; $9B+ cumulative gross revenue through 2019.
          tone: positive
        - date: 2018
          label: Epic Games Store opens
          detail: 88%/12% developer revenue share challenges Steam, Apple, and Google app store models.
          tone: positive
        - date: 2021
          label: $1B round at $28.7B valuation; UE5 announced
          detail: Sony leads; BlackRock, KKR participate; Unreal Engine 5 previewed.
          tone: positive
        - date: 2022-04
          label: $2B round at $31.5B; UE5 released
          detail: Sony ($1B) and KIRKBI ($1B) co-lead; last disclosed valuation; UE5 officially ships.
          tone: positive
        - date: 2022-12
          label: $520M FTC settlement (COPPA + dark patterns)
          detail: Largest COPPA penalty in FTC history ($275M); $245M consumer refunds for dark patterns.
          tone: negative
        - date: 2023-09
          label: 830 layoffs (16%); Bandcamp sold
          detail: First major restructuring; Sweeney cites spending outpacing earnings.
          tone: negative
        - date: 2023-12
          label: Epic wins Google Play antitrust jury verdict
          detail: Google Play Store ruled monopolistic; Fortnite eventually restored on Google Play globally.
          tone: positive
        - date: 2024-02
          label: Disney $1.5B equity stake announced
          detail: Multi-year games and entertainment universe partnership; Disney listed at ~9% by Wikipedia.
          tone: positive
        - date: 2025-05
          label: Fortnite returns to US App Store
          detail: Judge rules Apple willfully violated anti-steering injunction; Epic's direct payments restored.
          tone: positive
        - date: 2026-Q1
          label: 1,000+ layoffs; Fortnite engagement decline cited
          detail: Second major restructuring; options vest through January 2027; 4-month severance offered.
          tone: negative
    approximationNotes: >-
      Disney deal closing date not confirmed by primary source; listed as 2024 based on Wikipedia's current ownership
      table showing Disney at ~9%. 2026 layoff timing approximated as Q1 based on newsroom messaging.
