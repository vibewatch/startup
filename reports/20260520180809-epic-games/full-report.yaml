      - number: '2.3'
        title: Game engine market — Unreal Engine's position and dynamics
        blocks:
          - type: paragraph
            body: >
              The game engine market is a developer-tools market where Epic's Unreal Engine competes primarily with
              Unity Technologies and a long tail of proprietary/custom engines. According to data cited by Wikipedia's
              Unreal Engine article (attributed to Creative Bloq, February 2025), Unreal Engine held approximately 28%
              of developer market share in 2024, up from 17% in 2012, while Unity maintained approximately 50% of the
              developer market. However, the by-sales metric tells a different story: Unreal accounts for 31% of
              revenues by sales versus Unity's 26%, with proprietary engines accounting for a combined 42%. This
              bifurcation — Unity has more developers but Unreal generates more revenue per developer — reflects
              Unreal's concentration in high-budget AAA titles where royalties are material.


              Unreal Engine's royalty model charges 5% of commercial revenues above $1 million, waived entirely for
              titles published exclusively on the Epic Games Store. This royalty creates a natural linkage between
              engine market share and EGS distribution economics. Unity had no equivalent royalty until it
              controversially attempted a "runtime fee" in September 2023 that charged per-install rather than
              per-revenue — a model so poorly received that it triggered developer backlash, a CEO resignation (John
              Riccitiello left October 2023), and what Wired characterized as potentially irreparable reputational
              damage. Unity walked back the policy on September 22, 2023, but developer trust remains impaired, and
              Unity's stock declined from a $57B peak valuation in November 2021 to approximately $6B by September 2024.


              This credibility crisis created a significant migration tailwind for Unreal Engine 5, with high-profile
              studios including CD Projekt (next Witcher saga), Riot Games (exploring UGC competition), and dozens of
              mid-tier studios publicly committing to UE5. Unreal Engine 5 itself was released in April 2022 and
              introduces Nanite (virtualized geometry) and Lumen (dynamic global illumination), delivering AAA visual
              fidelity at lower development cost than prior engine generations.


              Non-gaming adoption of Unreal Engine is an emerging differentiator: by October 2022, Epic was working with
              groups running over 300 virtual production sets worldwide (using LED volume stages popularized by The
              Mandalorian). Epic's solutions pages for architecture, film/TV, and automotive confirm these verticals as
              strategic targets, though disclosed revenue contribution from non-gaming UE licensing is not available
              through public sources.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
