    notes: >-
      All cohort values are analyst estimates; Epic has not published retention or cohort data for any segment. Fortnite
      player cohort benchmarked against free-to-play battle royale industry averages; Battle Pass/Crew cohorts estimated
      at premium to baseline given committed spend. UEFN creator cohort reflects industry UGC platform norms. UE5
      developer cohort reflects high engine switching costs and multi-year production cycles. Null would indicate data
      not yet available; all estimates shown. The Fortnite engagement decline starting 2025 (CEO memo) suggests actual
      retention at Year 1–2 is materially lower than earlier cohorts.
