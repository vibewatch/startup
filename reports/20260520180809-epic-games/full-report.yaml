      - number: '1.4'
        title: Product portfolio and market position
        blocks:
          - type: paragraph
            body: >
              Fortnite is Epic's flagship consumer product and primary revenue driver. Launched in 2017 as a paid early
              access title with a cooperative survival mode, Fortnite Battle Royale launched as a free-to-play game mode
              in September 2017 and became a cultural phenomenon, reaching 125 million players within its first year.
              The game generated an estimated $9 billion in gross revenue through December 2019 and has since expanded
              into a multi-mode platform including Battle Royale, Lego Fortnite, Rocket Racing, Fortnite Festival, and
              Fortnite Creative. As of 2026, Epic reports over 800 million registered accounts across Fortnite. The game
              monetizes through V-Bucks, the in-game currency used for cosmetics and battle passes; Epic raised V-Bucks
              prices approximately 20% in March 2026, citing increased operating costs. The company also raised V-Buck
              prices by approximately 12.5% in 2023.

              Unreal Engine is Epic's developer-facing technology platform and dates to the original engine built by Tim
              Sweeney in 1995. The current generation, Unreal Engine 5 (stable release 5.7 as of the report date), was
              officially released in April 2022. UE5 features Nanite (virtualized geometry system) and Lumen (dynamic
              global illumination), representing a significant fidelity advance over prior generations. The engine is
              licensed under a royalty model: 5% of gross revenues over $1 million per product, with the royalty waived
              for games exclusively published on the Epic Games Store. Unreal Engine is used across gaming,
              film/television, automotive, architectural visualization, and live events, giving Epic material
              cross-industry reach beyond gaming.

              The Epic Games Store launched in 2018 with a deliberately lower revenue share than the industry standard:
              88%/12% in favor of developers (versus Steam's 70-75%/30-25% model) and 100% on a developer's first $1M in
              annual net revenue per product. The store serves over 295 million users across 187 countries in 16
              languages and supports 80+ payment methods. Epic Online Services (EOS) is a modular set of backend
              services (matchmaking, anti-cheat, achievements, friends, commerce) designed to work cross-platform across
              stores and publishers.
