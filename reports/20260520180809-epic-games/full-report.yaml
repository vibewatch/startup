      - number: '2.6'
        title: Non-gaming real-time 3D — architectural, automotive, and film/TV markets
        blocks:
          - type: paragraph
            body: >
              Unreal Engine's non-gaming addressable market is structurally attractive: the AEC, automotive, and film/TV
              virtual production verticals historically relied on specialized visualization tools (Autodesk suite, Chaos
              V-Ray, proprietary automotive rendering pipelines) that were expensive, slow to iterate, and siloed from
              game-quality interactive output. Unreal Engine's real-time rendering capabilities — particularly after
              UE5's Nanite and Lumen features — have lowered the quality gap sufficiently that enterprise architects,
              automotive designers, and film studios are adopting UE as a primary visualization platform.


              By October 2022, Epic was supporting over 300 virtual production stages worldwide using UE-powered LED
              volumes (the "StageCraft" approach, popularized by The Mandalorian). MegaGrants, Epic's grant program, has
              funded 45+ film and animation projects since 2020. Unreal's architecture solutions page and automotive
              solutions page explicitly position the engine for these verticals, though revenue contribution is not
              separated in public disclosures.


              Unity Technologies, Unreal's primary engine competitor, also competes in some non-gaming verticals — 
              particularly real-time automotive visualization and industrial simulation — but its reputation crisis in
              2023-2024 reduced its enterprise credibility, potentially accelerating non-gaming enterprise adoption of
              UE5. The AEC market (global construction market exceeding several trillion dollars) represents a large but
              slowly penetrating opportunity: most AEC firms use BIM software (Autodesk Revit, ArchiCAD) and require
              significant data pipeline investment to integrate UE5 for visualization. The opportunity is real but
              adoption is not rapid or mass-market in the 2024-2026 timeframe.
            claimRefs:
              - CM037
              - CM038
              - CM039
      - number: '2.7'
        title: Growth drivers, adverse constraints, and diligence asks
        blocks:
          - type: paragraph
            body: >
              Epic's addressable market across all five segments is shaped by several cross-cutting drivers and
              constraints that diligence must treat with equal rigor.


              On the growth driver side: the April-May 2025 Apple court rulings (Judge Gonzalez Rogers found Apple in
              willful contempt of the 2021 injunction and prohibited Apple from collecting fees on purchases outside
              apps) re-opened iOS as a material monetization channel for Epic for the first time since Fortnite was
              removed from the App Store in August 2020. Fortnite returned to the US iOS App Store on May 20, 2025, with
              Epic offering a 20% Epic Rewards incentive for users who use its in-game payment system over Apple's. This
              ruling structurally expands Epic's mobile SAM, though Apple has stated it will appeal. The EU Digital
              Markets Act similarly opened iOS in Europe, enabling the EGS iOS launch in the EU in 2024 and the UK in
              the second half of 2025.


              The UE5 engine's technical capabilities and Unity's credibility crisis create a window for engine market
              share consolidation over the 2024-2027 timeframe. The creator economy's 40% revenue share model, if it
              generates durable player retention, expands Fortnite's effective SAM by sustaining engagement in a market
              where player time is no longer expanding per Newzoo's 2026 report.


              On the constraint side: Apple's appeal of the April 2025 ruling introduces regulatory uncertainty that
              could limit or reverse Epic's iOS monetization gains outside the US. Epic's EGS remains structurally
              subscale versus Steam, with network-effect gaps in community features, VR compatibility, Steam Deck
              access, and the long-tail catalog that matter to consumers. Engine market share growth for UE5 is a
              lagging indicator — developers commit to engines years in advance of title release, and Unity's 50%
              developer install base will take multiple product cycles to erode materially. Mobile gaming's continued
              30% gatekeeping by Google Play (Epic settled with Google but did not eliminate the 30% fee structure
              globally) limits the financial benefit of Fortnite's mobile re-emergence on Android. Finally, Fortnite's
              2023-2026 engagement decline (triggering two rounds of layoffs) is itself a market signal: the
              battle-royale segment that drove Fortnite's growth is maturing, and the platform is executing a structural
              pivot to a multi-mode creator-first model whose long-term revenue profile is unproven at scale.
            claimRefs:
              - CM040
