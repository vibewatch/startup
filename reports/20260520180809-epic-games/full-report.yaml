  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and segment definitions
        blocks:
          - type: paragraph
            body: >
              Epic Games does not fit a single-market definition. Its commercial strategy spans five analytically
              distinct market segments that share common platform infrastructure but differ sharply in buyer,
              monetization model, and competitive dynamics. Diligence must evaluate each separately before sizing any
              addressable opportunity.


              The first segment is the global video game software and services market — the primary revenue pool for
              Fortnite. This market includes consumer spending on game software, digital downloads, in-game purchases,
              subscriptions, and live-service monetization across PC, console, and mobile platforms. It excludes gaming
              hardware, esports prize pools, and adjacent advertising markets unless explicitly noted. Estimates diverge
              substantially by methodology: Newzoo's annual global games market report tracks software/services spending
              and has reported figures in the $183-200B range for 2023-2025, while Statista's broader "global gaming
              market" figure of approximately $522.5B in 2025 incorporates hardware, accessories, and a wider set of
              adjacent spending categories. These are not directly comparable; this chapter uses Newzoo-equivalent
              software-centric definitions as the primary lens.


              The second segment is the game engine and real-time 3D creation tools market — the primary revenue pool
              for Unreal Engine. This market includes commercial licenses, royalty revenue, cloud-hosted dev services,
              and marketplace commissions from tools used to create interactive 3D content. It excludes finished game
              revenues (counted in the first segment) but includes non-gaming uses of those same tools (included
              separately below).


              The third segment is PC digital distribution — where the Epic Games Store competes with Steam and other
              storefronts for developer publishing relationships and consumer purchase share. Revenue to the platform
              operator comes from transaction fees (12% for EGS, 30% for Steam's standard tier), advertising/discovery
              fees, and DLC/currency marketplace economics.


              The fourth segment is the creator/UGC platform economy — where Fortnite Creative and UEFN compete with
              Roblox, Minecraft, and emerging platforms for creator attention, developer tooling adoption, and the
              revenue share from player-generated content engagement. This is a newer and less precisely sized market
              but is strategically critical given its impact on Fortnite's long-term engagement retention.


              The fifth segment is non-gaming real-time 3D — where Unreal Engine competes with specialist visualization
              tools in architecture/engineering/construction (AEC), automotive design, and film/TV virtual production.
              This represents the engine's highest-margin expansion opportunity outside the cyclical gaming market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: Global video game market — size, trajectory, and Epic's position
        blocks:
          - type: paragraph
            body: >
              The global video game market has grown from approximately $134.9 billion in 2018 to an estimated $183-200B
              range in 2024-2025 on a software/services basis, depending on methodology. Newzoo's PC and Console Gaming
              Report 2026 characterizes 2025 as "the first year of notable revenue growth in the industry since the
              pandemic, increasing 7% year-over-year," signaling a recovery cycle after two years of post-pandemic
              contraction. Critically, Newzoo notes that this growth is now "driven by monetization efficiency, pricing
              strategy, and platform economics, not expanding player time" — a structural shift that favors entrenched
              live-service franchises like Fortnite over new entrants.


              Statista's broader market metric — approximately $522.5 billion in 2025, including hardware and
              accessories — captures a wider value chain but is methodologically incomparable to Newzoo's
              software-centric figure. The mobile gaming market alone is estimated at approximately $126 billion within
              the Statista broader figure, underscoring how large a share mobile commands. This matters for Epic because
              mobile remains the platform where Epic's direct monetization is most constrained (see adversarial
              constraints below).


              Among publicly reported gaming companies, Newzoo's top-25 rankings through Q3 2025 show Tencent leading at
              $30.2B YTD revenues, followed by Microsoft ($15.9B) and Sony ($15.6B). Epic is private and not in the
              public rankings, but its estimated $5-6B annual revenue (based on 2022 analyst estimates and FTC
              settlement disclosures) would place it in the top-10 if it were a standalone public entity. Fortnite's
              publicly acknowledged $9B+ gross by end of 2019 provides a historical anchor, though more recent figures
              are not publicly disclosed.


              The gaming market exhibits high concentration: free-to-play live-service titles like Fortnite, Genshin
              Impact, and Roblox capture a disproportionate share of player time and in-game spending. Statista notes
              that "gaming studios have become more risk-averse" as players invest deeply in existing titles rather than
              sampling new releases — a dynamic that reinforces Fortnite's position as a durable revenue moat but also
              explains why Epic's 2023-2026 layoff cycles coincided with Fortnite engagement declining from its
              historical peaks.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
