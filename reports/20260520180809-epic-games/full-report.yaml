      - number: '5.2'
        title: Unreal Engine 5 capabilities and release cadence
        blocks:
          - type: paragraph
            body: >
              Unreal Engine 5 (UE5) is the current generation of Epic's flagship 3D creation tool, first released for
              developers on April 5, 2022 (version 5.0), with the latest stable release being UE5.7 on November 12,
              2025. UE5 is written in C++ and its source code is available on GitHub, gated to registered Epic
              developers. The engine supports Windows, Linux, macOS, PlayStation 4/5, Xbox One, Xbox Series X/S,
              Nintendo Switch, Nintendo Switch 2, iOS, and Android. Commercial use is governed by a royalty model:
              developers pay 5% of gross product revenue exceeding $1 million per product; this royalty is waived
              entirely for products distributed exclusively through the Epic Games Store using Epic's payment system.

              The core technical differentiators of UE5 are:

              Nanite — a virtualized micropolygon geometry system that automatically manages level-of-detail for complex
              meshes, enabling the use of film-quality photogrammetry assets, ZBrush sculpts, and CAD models without
              manual optimization. Nanite eliminates the need for artists to hand-craft multiple LOD versions, reducing
              content production time and cost substantially. The Nanite pipeline was extended in UE5.4 (April 2024)
              with experimental tessellation and is gaining support for animated geometry ("Nanite Skinning") as an
              experimental feature in UE5.7.

              Lumen — a dynamic global illumination and reflections system that can react in real time to scene and
              lighting changes. Lumen eliminates the need for precomputed lightmaps. It supports both software ray
              tracing (Mesh Distance Fields, optimized for broad device range) and hardware ray tracing (higher
              accuracy, supports skinned meshes). In UE5.5 (November 2024), hardware ray tracing Lumen gained 60 Hz
              support on consoles with hardware support.

              Virtual Shadow Maps — a new shadow mapping method delivering consistent high-resolution shadows for
              film-quality assets and large, dynamically lit open worlds, avoiding shadow cascade and pop-in artifacts
              common in traditional shadow mapping.

              Additional production systems include: Chaos physics engine (replacing PhysX), Niagara particle/fluid
              dynamics system, Substrate material authoring framework (production-ready in UE5.7), World Partition
              (large open-world streaming), Pixel Streaming 2 (WebRTC-based cloud streaming, shipping with UE5.5+),
              Neural Network Engine (Beta in UE5.4), Movie Render Graph (Beta in UE5.5), and Unreal Build Accelerator
              (UBA) for faster C++ and shader compilation (Beta in UE5.4, production-ready in UE5.5). MegaLights —
              enabling hundreds of dynamic shadow-casting lights without constraint — moved from experimental to Beta in
              UE5.7.

              Release cadence: Epic has maintained approximately two major UE5 version releases per year, advancing from
              5.0 (April 2022) through 5.1, 5.2, 5.3, 5.4 (April 2024), 5.5 (November 2024), 5.6, and 5.7 (November
              2025). This cadence provides regular capability upgrades but also introduces regression risk for studios
              relying on older features. Tim Sweeney discussed Unreal Engine 6 in a 2025 Lex Fridman podcast interview,
              indicating the first preview builds would be available in two to three years and that UE6 would aim to
              unify the development streams used for Fortnite and the broader engine.

              Known technical weaknesses: UE5 has been widely criticized for shader compilation stutter — frame-time
              jumps when new content loads for the first time — and traversal stutter. Epic has acknowledged the issue
              and developed new precompilation identification systems, but the problem remains unresolved at scale as of
              the report date. Temporal anti-aliasing (enabled by default) can introduce motion blur artifacts. These
              issues have been noted in multiple major UE5-based releases including Black Myth: Wukong and others,
              creating reputational risk in the developer community.
            claimRefs:
