            title: Disney deal closes evidence gap — strategic value clear, cap table unclear
            body: >-
              Wikipedia's current equity table lists Disney at ~9%, providing implied evidence that the February 2024
              announced $1.5B equity deal has closed. The commercial partnership to build a Disney-branded games and
              entertainment universe using Epic's Fortnite platform is strategically significant, but the specific
              closing date, final deal terms, and post-close cap table are not confirmed by any directly-accessible
              primary source as of the report date.
            calloutType: insight
