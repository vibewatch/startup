  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchors exist, but current earnings power is still opaque
        blocks:
          - type: paragraph
            body: >-
              Epic does not suffer from a total absence of valuation evidence; it suffers from a mismatch between old
              valuation anchors and current operating disclosure. The 2022 Sony/KIRKBI round at a $31.5 billion
              post-money valuation is a confirmed anchor, and Disney's $1.5 billion 2024 investment is a second major
              pricing event. But Disney and Epic did not publicly disclose a post-money figure, leaving outsiders to
              triangulate from secondary reporting that implied a lower valuation. That means the public market can see
              that Epic was once worth at least $31.5 billion and may have been repriced lower by 2024, but it still
              cannot see the current income statement that would justify either number today.


              That opacity matters more now than it would in a stable business. Epic's 2026 layoffs and $500 million
              savings target are hard evidence that the company is still resetting its cost structure around weaker
              Fortnite engagement. Public revenue estimates for Epic stop at 2022, while Fortnite estimates extend only
              indirectly through third-party sources. Investors therefore face a classic late-stage private-company
              problem: valuation headlines are visible, but the underlying earnings power that should support those
              headlines is not. Any judgment on fair value has to start by discounting that disclosure gap rather than
              assuming it away.
            claimRefs:
