chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, structure, and corporate profile
        blocks:
          - type: paragraph
            body: >
              Epic Games, Inc. is a privately held Delaware-incorporated interactive entertainment and technology
              company headquartered at 620 Crossroads Blvd, Cary, North Carolina. Founded in 1991 by CEO Tim Sweeney
              under the name Potomac Computer Systems, the company was rebranded Epic MegaGames in 1992 and subsequently
              Epic Games in 1999 as it expanded from shareware games into mainstream publishing and engine licensing.
              Sweeney retains majority ownership and voting control through a single class of common stock, a governance
              structure that has insulated the company from hostile investor influence even as strategic capital from
              Tencent, Disney, Sony, and KIRKBI has accumulated on the cap table.

              Epic's business spans four principal product lines: Fortnite (interactive entertainment platform), Unreal
              Engine (industry-leading 3D creation tool), Epic Games Store (a PC games marketplace), and Epic Online
              Services (a modular backend services platform). The company's official materials reference over 800
              million Fortnite accounts and more than 6 billion friend connections as of early 2026, positioning it as
              one of the largest consumer gaming platforms by registered user count globally. Across all product lines,
              Epic holds a dual identity as both a game publisher and as a developer-facing platform and tooling
              business — a combination that creates meaningful cross-segment dependencies and leverage.

              As of the report date in May 2026, the company employs approximately 4,000 people after a series of
              significant workforce reductions in 2023 and early 2026. Epic is private and has not disclosed audited
              financial statements; public revenue estimates based on secondary sources place 2022 revenues at
              approximately $6B, though the company has not confirmed this figure and no more-recent consolidated
              revenue number is publicly available.
