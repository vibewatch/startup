      - number: '3.4'
        title: Platform and ecosystem-level competition — Apple, Google, Microsoft
        blocks:
          - type: paragraph
            body: >
              Apple and Google function as adversarial platform gatekeepers rather than direct product competitors, but
              their impact on Epic's addressable revenue is material. Both historically charged 30% on all in-app
              purchases, which led Epic to deliberately violate App Store and Google Play payment policies in August
              2020 and triggered Epic's landmark antitrust litigation. On the Apple front, Judge Gonzalez Rogers found
              Apple in willful contempt of the 2021 injunction in April 2025 and prohibited Apple from collecting fees
              on external payment links; Fortnite returned to the US iOS App Store on May 20, 2025. On Google, Epic won
              a jury verdict in December 2023; Google's Play Store remedy is still being negotiated as of the report
              date.

              Microsoft operates Xbox Game Pass (Ultimate, PC, Essential tiers), a subscription gaming service that
              includes access to hundreds of titles for a monthly fee. Game Pass competes with Fortnite's Fortnite Crew
              subscription ($11.99/month), offering a value bundle including Fortnite Crew Pack monthly cosmetics, the
              Battle Pass, and 1,000 V-Bucks monthly. The Xbox Game Pass library includes Fortnite itself (and Fortnite
              Crew as a Game Pass Ultimate benefit), creating a co-distribution relationship that is cooperative rather
              than purely adversarial. However, Microsoft's broader game content strategy — which includes Call of Duty
              (via Activision Blizzard), Halo, Minecraft, and Forza — creates a direct competition for player time and
              subscription wallet share. Xbox cloud gaming (Game Pass Ultimate) enables console-quality games on mobile
              without requiring an App Store payment, creating an indirect workaround to Apple/Google mobile gatekeeping
              that Microsoft benefits from independently of Epic's antitrust strategy.

              Sony Interactive Entertainment is both an investor in Epic (approximately 5.4% equity stake per earlier
              chapter) and a platform operator (PlayStation 4/5). Sony's PlayStation Store charges the standard 30%
              commission on game sales and DLC, but this is console distribution, not PC distribution — Epic's EGS does
              not compete directly with Sony's store for console market share. The strategic Sony relationship provides
              distribution protection for Fortnite on PlayStation and may include preferential treatment for
              cross-promotion, but it does not change the competitive dynamics of PC distribution or mobile.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
