  - id: FV001
    title: Recommendation logic
    type: flow
    description: How valuation anchors, risk evidence, and peer comps combine into the final recommendation.
    summary: The evidence chain supports a disciplined bracket, not a high-conviction buy call.
    data:
      nodes:
        - id: anchors
          label: Known anchors
          detail: 31.5B hard 2022 mark; 22.5B unconfirmed 2024 implied mark
          tone: neutral
        - id: ops
          label: Current operating signals
          detail: 2025 engagement downturn + 2026 cost reset reduce confidence in peak anchor
          tone: risk
        - id: comps
          label: Public comp band
          detail: Roblox, EA, TTWO, Unity cluster around ~6x-9x market-cap / revenue
          tone: neutral
        - id: discount
          label: Private discount
          detail: Opacity, concentration, and cap-structure unknowns warrant a haircut versus public peers
          tone: risk
        - id: range
          label: Fair-value range
          detail: Public-evidence bracket centers in the mid-to-high teens
          tone: neutral
        - id: call
          label: Recommendation
          detail: research-more with medium confidence and high risk rating
          tone: risk
      edges:
        - from: anchors
          to: ops
          label: re-anchor
        - from: ops
          to: comps
          label: compare
        - from: comps
          to: discount
          label: adjust
        - from: discount
          to: range
          label: bracket
        - from: range
          to: call
          label: decide
    approximationNotes: Logic flow is analytical rather than management-disclosed.
    claimRefs:
      - CV001
      - CV004
      - CV025
      - CV036
      - CV039
  - id: FV002
    title: Valuation sensitivity
    type: bar
    description: Sensitivity of Epic's value discussion to peer bands and internal scenario assumptions.
    summary: The public record leaves enough uncertainty that small assumption changes move the range materially.
    data:
      items:
        - label: Bear case midpoint
          value: 10
          tone: risk
        - label: Base case midpoint
          value: 17.5
          tone: neutral
        - label: Bull case midpoint
          value: 30
          tone: positive
        - label: 2022 hard valuation anchor
          value: 31.5
          tone: opportunity
        - label: 2024 implied Disney valuation
          value: 22.5
          tone: neutral
    approximationNotes: Values are in USD billions.
