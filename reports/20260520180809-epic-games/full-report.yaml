  - id: FV003
    title: Valuation / return range
    type: range
    description: Illustrative valuation bands under bear, base, and bull assumptions.
    summary: Public evidence supports a wide range because current private financials are missing.
    data:
      items:
        - label: Bear case
          low: 8
          mid: 10
          high: 12
          tone: risk
          detail: Continued Fortnite decline; low Disney monetization; weak EGS economics
        - label: Base case
          low: 15
          mid: 17.5
          high: 20
          tone: neutral
          detail: Fortnite stabilizes; Unreal grows; Disney remains strategic optionality
        - label: Bull case
          low: 25
          mid: 30
          high: 35
          tone: positive
          detail: Fortnite reaccelerates; Disney monetizes; Unreal captures more premium value
        - label: 2022 hard anchor
          low: 31.5
          mid: 31.5
          high: 31.5
          tone: opportunity
          detail: Sony and KIRKBI financing in April 2022
    approximationNotes: Values shown in USD billions and intended as directional brackets rather than negotiated transaction marks.
    claimRefs:
      - CV001
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: Investment KPIs
    type: kpi
    description: IC-style scorecard across the dimensions that matter most to the Epic underwriting case.
    summary: Moat remains strong, but transparency and diversification score much lower.
    data:
      items:
        - label: Moat / strategic relevance
          value: 8/10
          detail: Fortnite + Unreal + ecosystem reach remain unusually strong
          tone: positive
        - label: Disclosure quality
          value: 2/10
          detail: Current private financials and segment splits remain undisclosed
          tone: risk
        - label: Diversification proof
          value: 4/10
          detail: Unreal and Disney optionality exist, but Fortnite still dominates the story
          tone: neutral
        - label: Valuation support
          value: 4/10
          detail: Public comps help, but they do not prove cheapness at a premium private mark
          tone: risk
        - label: Underwriteability today
          value: 3/10
          detail: Enough evidence to bracket value, not enough to commit confidently
          tone: risk
    approximationNotes: Scores are analytical shorthand for investment discussion, not statistical outputs.
    claimRefs:
      - CV025
      - CV026
      - CV029
      - CV036
      - CV039
