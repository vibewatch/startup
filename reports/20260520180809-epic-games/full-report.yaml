      - number: '6.2'
        title: UEFN creator economy — engagement revenue and discovery dynamics
        blocks:
          - type: paragraph
            body: >
              The Unreal Editor for Fortnite (UEFN), launched March 22, 2023, created a new creator customer segment
              that occupies a hybrid user/payer/earner role. Creators invest time and skills building islands (UGC
              experiences within Fortnite) using a near-full Unreal Engine interface. In return, creators in the Island
              Creator program receive 40% of engagement revenue attributable to their islands — where "engagement
              revenue" is calculated as a share of total Fortnite platform revenue (including Battle Pass and V-Bucks
              sales) weighted by player session time on each island. The remaining approximately 60% is retained by
              Epic.

              In the first year of UEFN's beta phase, Epic's Island Creator program paid an estimated $320 million to
              more than 20,000 developers with published experiences. This figure, disclosed at GDC 2024 and cited in
              Wikipedia's UEFN article, represents a significant creator economy — comparable in structure to Roblox's
              creator program and larger than many independent game development markets. The 40% of Fortnite playtime
              that players spent in Creative mode (per Epic's GDC 2023 data disclosed via Digiday) underpins the creator
              economy's scale: player time in UGC directly generates creator revenue.

              The adversarial dynamic in this segment is discovery concentration. Epic's algorithm — called "Discover" —
              controls which creator islands receive player traffic. The formula is kept secret, though Epic has stated
              it weights total hits, player engagement, player retention, and V-Bucks spend post-visit. The display of
              concurrent user (CCU) counts on the Discover page created community backlash: creators with low CCU
              alleged that the metric created a self-reinforcing disadvantage, since players skip low-CCU experiences,
              further suppressing algorithmic amplification. Additionally, trademark and DMCA disputes emerged in 2024
              when a top creator attempted to trademark "The Pit" (a common game type), prompting Epic to initially take
              down similar islands before reversing the decision under community pressure. The creator segment's
              economics depend structurally on algorithmic access to player traffic — a concentration risk analogous to
              YouTube creator dependence on recommendation algorithm changes.
            claimRefs:
              - CU009
              - CU014
              - CU015
              - CU016
              - CU017
      - number: '6.3'
        title: Game developer customers — Unreal Engine 5 licensees and EOS adopters
        blocks:
          - type: paragraph
            body: >
              Game developers represent Epic's most technically significant customer segment. Unreal Engine 5 is the
              engine of choice for AAA and AA productions targeting high-fidelity visuals, with its Nanite virtualized
              geometry and Lumen global illumination eliminating major content production bottlenecks. The commercial
              terms: developers pay a 5% royalty on gross product revenues exceeding $1 million per product. This
              royalty is waived entirely for products distributed exclusively through the Epic Games Store using Epic's
              payment system, creating a direct incentive linkage between UE5 adoption and EGS distribution.

              The named customer proof base for UE5 is strong and recent. Black Myth: Wukong, developed by Game Science
              and released August 20, 2024, was built on UE5 and sold 20 million units in its first month — one of the
              fastest-selling games of all time. The game received multiple Game of the Year awards and demonstrated
              UE5's viability for AAA production in markets beyond traditional Western studios. Senua's Saga: Hellblade
              II (Ninja Theory/Microsoft, released May 21, 2024) was built on UE5 with MetaHuman used for facial
              animation via Epic's 3Lateral subsidiary — a production-proof case combining two Epic tools. The game
              received generally positive reviews with praise for visual quality attributed to UE5.

              Epic Online Services (EOS) extends the developer customer relationship beyond engine use. EOS provides
              free, cross-platform backend services including multiplayer matchmaking, player accounts (with Epic or
              external identity providers), anti-cheat, cloud saves, and analytics. EOS is engine-agnostic — it supports
              Unity, Unreal Engine, and custom engines. The customer acquisition rationale: by offering competitive
              backend infrastructure for free, Epic captures developer relationships and account data even for games not
              built in UE5. EOS documentation describes the ability to "reach nearly a billion players" via the Epic
              Games account graph. No monetization model for EOS has been publicly disclosed; the service is free to
              integrate and operate, making it a developer ecosystem investment rather than a direct revenue line.
            claimRefs:
              - CU018
              - CU019
              - CU020
              - CU021
              - CU022
              - CU038
