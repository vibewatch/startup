      - number: '3.3'
        title: PC digital distribution — Steam's entrenched dominance vs Epic Games Store
        blocks:
          - type: paragraph
            body: >
              Steam, operated by Valve Corporation, is the largest PC digital distribution platform by any measure. Per
              Wikipedia's Steam article citing a 2021 figure, Steam had over 132 million monthly active users (MAUs) and
              over 34,000 games. The platform launched in 2003 and has 22 years of catalog accumulation, community
              features (Steam Workshop, Steam Community Market, Steam Trading Cards), and social networking tools that
              create multi-layered switching costs for both publishers and consumers. Valve's Steam Deck handheld PC
              (2022) further entrenched Steam by creating a hardware-software lock-in mechanism that has no equivalent
              in the EGS ecosystem. Steam's workshop modding ecosystem alone adds thousands of community-created content
              hours per title per year, a form of UGC that EGS does not offer.

              Steam's revenue sharing model charges publishers 30% on the first $10 million of revenue, 25% on revenue
              $10M-$50M, and 20% above $50M (per Steamworks documentation). By contrast, Epic Games Store charges a flat
              12% with no tiers, representing an 18 percentage-point advantage on the first $10M and a 13 point
              advantage above $50M. EGS also waives its commission entirely for games using the Epic Online Services
              backend. This structural pricing gap is Epic's primary competitive lever: the EGS FAQ explicitly states
              the 88%/12% revenue share as a founding design principle. For high-revenue games, Steam's tiered structure
              means the effective take rate approaches 20-22%, narrowing (but not eliminating) the EGS pricing advantage
              for top publishers.

              Despite launching in late 2018, the Epic Games Store has grown to 295 million PC and Mac users (per EGS
              FAQ and confirmed by multiple media reports in early 2025). However, EGS's library of ~9,000 games is
              dwarfed by Steam's 50,000+ titles, a catalog gap that reduces discovery-driven traffic for consumers on
              EGS. Epic's exclusive content strategy (major exclusives including Fortnite, Rocket League, Fall Guys, and
              third-party time-exclusive titles) created consumer awareness but also generated significant negative
              sentiment ("exclusives as anti-consumer") that has persisted in gamer community discourse. The EGS free
              weekly games program is a positive goodwill driver but primarily attracts price-sensitive users who are
              unlikely to convert to high-spend active buyers.

              The adverse competitive evidence on EGS versus Steam is stark: no publicly available data source confirms
              that EGS has approached Steam's engagement, catalog breadth, community feature depth, or per-user revenue
              metrics. Steam's network effects — where developers want to be where players are, and players want to be
              where games are — are self-reinforcing and have proven durable over seven years of EGS operation with
              sustained pricing pressure from the 12% take rate. EGS's primary value proposition remains its lower take
              rate and Fortnite's cross-platform account system, not library breadth or community tools.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
