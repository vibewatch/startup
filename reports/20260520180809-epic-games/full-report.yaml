  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Fortnite concentration, engagement, and restructuring risks
        blocks:
          - type: paragraph
            body: >-
              Epic's most important risk is that too much of the company still depends on Fortnite, while the strongest
              public evidence says Fortnite's engagement weakened in 2025. Tim Sweeney's 2026 layoff memo is unusually
              direct for a private company: he tied a downturn in Fortnite engagement to overspending, then paired
              layoffs with a $500 million annual cost-reduction target. Independent outlets corroborated both the scale
              of the layoffs and the shutdown of underperforming Fortnite modes, which turns the engagement story from
              abstract sentiment into visible product contraction. A company that could previously fund aggressive
              expansion across games, store subsidies, and ecosystem bets now looks more like a business re-basing
              itself around a franchise that is still huge but less forgiving than it was at peak.


              That concentration risk matters because the rest of Epic's portfolio remains harder to underwrite. Public
              estimates still put Epic's total 2022 revenue around $6 billion, while Fortnite-specific estimates remain
              in the multi-billion range even after recent slippage. That leaves a narrow margin for error if Fortnite
              weakens faster than Unreal Engine licensing, creator-economy payouts, or store economics can offset it.
              The store is still associated with prior losses and uncertain profitability; the engine is strategically
              valuable but not disclosed as a segment. Repeated layoffs in 2023 and 2026 therefore read as more than
              cyclical housekeeping: they indicate Epic has not yet proven that its cost base matches a post-boom
              Fortnite revenue profile.
