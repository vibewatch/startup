      - number: '5.3'
        title: Epic Games Store 产品经济性与平台扩张
        blocks:
          - type: paragraph
            body: >
              Epic Games Store（EGS）是 Epic 面向 PC、Mac、Android 和 iOS 的游戏分发平台，覆盖 187 个国家，注册 PC/Mac 用户超过 295 million，支持 16
              种语言和 80+ 种支付方式。商店于 2018 年 12 月上线，采用有利于开发者的 88%/12% 收入分成——开发者保留 88%，Epic 抽取 12%——相比 Steam 当时标准的 30%（现在按
              30%/25%/20% 分层）。截至 2025 年 6 月，Epic 将条款扩展为每个产品每年首 $1 million 净收入 100%/0% 结构，实际上取消小型游戏的 Epic 抽成。“First Run
              Program”向新游戏前六个月独占期提供 100% 收入分成；“Now on Epic”计划向此前已发布游戏提供类似条款。

              对 Unreal Engine 游戏而言，版税经济性还有进一步激励：只要游戏通过 EGS 使用 Epic 支付系统独占分发，5% UE 版税就完全豁免。这为选择 EGS 独占而非多平台分发的 UE5
              开发者，创造了有意义但不透明的总有效折扣。

              EGS 移动端扩张：Epic 于 2024 年 8 月 16 日在 Android（全球）和 iOS（仅欧盟，依据 EU Digital Markets Act）上线 EGS。iOS 欧盟上线利用了 Apple
              在 DMA 下必须允许替代应用商店的义务。Epic 于 2025 年 1 月开始在移动端提供第三方游戏。2025 年 4 月，在 Epic v. Apple 诉讼中针对 Apple
              的藐视法庭裁决后，Sweeney 宣布计划将 EGS 带到美国 iOS。每周免费 PC 游戏的免费游戏计划，一直是关键获客驱动：按 Wikipedia 的 EGS 条目，2023 年 EGS 收入为
              $950M，用户 270M。

              EGS 自助发行允许任何开发者支付 $100 费用后上架游戏（2023 年 3 月推出），类似 Steam Direct。Epic 禁止色情游戏，并要求多人游戏支持跨平台游玩。

              反向发现——EGS 盈利能力：Apple 在 2021 年 Epic v. Apple 审判中的法庭证词称，EGS 在 2019 至 2020 年累计亏损约 $400
              million，原因是独占最低保证和免费游戏授权成本。Apple 的分析预计 EGS 要到 2027 年才会盈利。Epic 公开反驳，称预期 2023 年盈利。截至报告日，Epic 声称的 2023 年盈利和
              Apple 的 2027 年预测，都没有被公开财务数据确认，因为 Epic 不发布分部财务。这种盈利不确定性，是理解 EGS 对 Epic 合并 P&L 造成净现金拖累的重大缺口。
