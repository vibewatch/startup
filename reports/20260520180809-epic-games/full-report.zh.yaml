            body: >-
              The Information 对 Disney 交易报道隐含的 $22.5 billion 估值，较 2022 年 $31.5 billion 锚点下降 28.5%。Epic 和 Disney
              拒绝确认。Wikipedia 信息框列出 Disney 持股约 9%，Variety D23 文章也以过去时处理该投资，确认交易已交割，但估值仍未被任何一手来源确认。若承销方为估值目的依赖 2022 年
