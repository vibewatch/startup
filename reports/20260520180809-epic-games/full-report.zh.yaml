  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: Fortnite 消费者细分——玩家、付费用户与参与度轨迹
        blocks:
          - type: paragraph
            body: >
              Fortnite 是 Epic Games 最核心的消费端产品，也是最大收入来源。Statista 数据显示，截至 2023 年 11 月，Fortnite 全球累计玩家 650 million，较 2021 年
              5 月的 400 million 上升——这条轨迹说明它在 PC、主机和移动平台上都有广泛消费者触达。Wikipedia 引用的 Epic 自身披露称，2024–2026 年注册账号为 800
              million，不过“注册账号”和“活跃玩家”本来就是两种结构不同的指标。运营上更关键的是 GDC 2023 披露的约 70 million 月活跃玩家——变现真正来自这个池子。

              Fortnite 的变现架构把用户和付费者拆开：用户可以免费玩，付费者购买 V-Bucks、Battle Pass 或 Fortnite Crew
              订阅。所有模式都免费游玩；游戏内收入来自三条线。V-Bucks（虚拟货币）用于购买外观和赛季 Battle Pass。截至 2026 年 3 月，Epic 将 V-Bucks 价格上调约 25%：800
              V-Bucks 现在 $10，而此前约 $8.99 可买 1,000 V-Bucks。Battle Pass 及其奖励围绕 V-Bucks 消耗校准。Fortnite Crew 月度订阅（$11.99/月）打包
              Battle Pass、Music Pass、LEGO Pass、每月 1,000 V-Bucks 和独家外观。Crew 模式把一次性购买者转成经常性付费者，收入可预测性更强，但牺牲单笔交易收益。

              消费端的反向信号很明确。CEO Tim Sweeney 在 2026 年 3 月给员工的备忘录中直接把裁撤超过 1,000 名员工——约 20% 员工——归因于“2025 年开始的 Fortnite
              参与度下滑”。Sweeney 写道，Epic“支出明显高于收入”；裁员方案叠加已识别的 $500 million 成本节约，目标是让公司回到稳定支出水平。伴随裁员，Epic 停掉了几个低参与度 Fortnite
              模式：Rocket Racing、Ballistic（2024 年 12 月上线的战术射击模式）和 Festival Battle Stage。这个模式符合一个平台的画像：扩张范围超过了玩家基础能承受的上限。

              2026 年 3 月 V-Bucks 涨价又放大了参与度叙事。PC Gamer 报道称，玩家发起反弹和抵制运动，目标日期是 2026 年 3 月 19 日。Fortnite
              设计总监在公开发帖中呼吁冷静，并明确把涨价说成是为了“支付账单”。历史背景是：Fortnite 上线头两年（2017–2019）总收入超过 $9 billion，仅 2018 年就有 $2.4
              billion。峰值收入和 2025–2026 年结构性下滑之间的落差，说明参与度明显流失。
