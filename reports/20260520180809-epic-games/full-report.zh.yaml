      - number: '7.3'
        title: 竞争、Disney 可选性和关键人物依赖让上行情景更复杂
        blocks:
          - type: paragraph
            body: >-
              Epic 的反向逻辑不是公司没有有价值的资产；而是这些资产中太多需要外部验证，才配得上私募市场溢价。Roblox
              每个季度持续报告大规模收入、参与度和创作者分成，给投资者提供了一个实时公开的创作者经济游戏基准，Epic 披露无法匹配。Steam 仍是默认 PC 商店，Unity 已撤回定价错误中最具破坏性的部分，Godot
              继续扩大面向小型工作室的免费替代选择。这些竞争事实不能证明 Epic 会输，但会压缩投资者假设 Unreal Engine 或 EGS 能按有吸引力时间表自动分散 Fortnite 风险的空间。


              Disney 关系同样双刃剑。它是真实的战略背书，而且已明显超越新闻稿：Disneyland Game Rush
              和管理层评论显示，裁员后项目仍在推进。但公开记录看起来仍更像品牌激活，而不是已变现的平台收入线。里程碑、收入分成条款和单位经济性都未公开。同时，Epic 仍围绕 Tim Sweeney
              运转：创始人、CEO、产品愿景提出者和诉讼门面都集中在他身上。公开材料没有足够解释接班安排或董事会独立性，无法中和关键人物风险。对一家平台暴露波动的私营公司来说，这种治理不透明不是装饰性问题；它改变了投资者必须在一个运营者判断上押注多少信心。
