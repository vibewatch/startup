      - number: '1.5'
        title: 负面事件、法律历史与运营风险
        blocks:
          - type: paragraph
            body: >
              自 2020 以来，Epic 面临显著监管、法律和运营逆风，使其负面事件记录成为这一时期消费游戏板块中更重要的一类。

              December 2022，Federal Trade Commission 与 Epic Games 达成 $520 million 和解——这是 FTC 历史上针对两项合并违规开出的最大处罚。其中 $275
              million 民事罚款针对违反 Children's Online Privacy Protection Act（COPPA），也是有记录以来最大 COPPA 罚款；另有 $245 million
              消费者退款针对 Fortnite 结账和账户系统中的暗黑模式，FTC 认定这些设计诱导包括未成年人在内的玩家发生非预期购买。Epic
              接受和解并实施补救性设计改动，但该案构成已确认的负面监管事件，并留下持久声誉影响。

              August 2020，Epic 在刻意触发 Apple 和 Google 下架 Fortnite 后，同时起诉两家公司。在 Apple 案（Epic Games v. Apple, N.D.
              California）中，Judge Yvonne Gonzalez Rogers 于 September 2021 在十项诉求中的九项上实质支持 Apple，但发布了反引流禁令。上诉在 2023
              维持判决、Supreme Court 于 January 2024 拒绝复审后，Apple 起初采取的合规措施被 Epic 认为不足。April 2025，Judge Rogers 裁定 Apple
              故意违反其原始禁令。随后 Apple 于 May 2025 批准 Fortnite 带着 Epic 直接支付系统重返 US App Store；到 early 2026，Fortnite
              已在全球（Australia 除外）回归。在 Google 案中，December 2023 陪审团裁定 Google 的 Play Store 做法构成垄断且违法；Fortnite 此后已在全球恢复到
              Google Play。

              Epic 在本期发生两次重大裁员：September 2023 约 830 名员工（员工总数 16%），同时出售 Bandcamp 并剥离 SuperAwesome；early 2026 又裁员超过 1,000
              人，Tim Sweeney 提到自 2025 起 Fortnite 参与度下降，同时公司持续支出高于收入。两次事件都反映疫情扩张后的结构性修正。
