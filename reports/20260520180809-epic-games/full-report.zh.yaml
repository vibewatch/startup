      - number: '8.3'
        title: 悲观、基准和乐观情景都指向克制入场，而不是热情追高
        blocks:
          - type: paragraph
            body: >-
              Epic 仍有真实上行空间。Unreal Engine 仍具战略重要性，Fortnite 保持全球规模，Disney 加上移动诉讼胜利保留了许多同行没有的可选性。但这些正面因素必须与另一个事实平衡：Epic
              没有用透明的当前指标证明自身投资逻辑。悲观情景假设 Fortnite 参与度流失延续、EGS 经济性仍弱、Disney
              变现大多停留在概念。基准情景假设稳定，而不是重新加速。乐观情景假设几件好事同时发生：Fortnite 重获动能，Disney 体验成为有意义的业务，Unreal 拿下更多可变现的企业和媒体预算。


              这种结果分布支持“继续研究”，而不是买入式建议。2022 年锚点太旧，不能当作公允价值；2024 年隐含下调有信息量，但未确认。除非投资者已经相信 Epic
              的多元化进展远超公开证据，否则公开同行并不能显示一个明显便宜的案例。因此，正确估值立场是昂贵：公司资产优秀，但新近披露不足，不足以让人有信心按接近周期峰值的私募价格付款。
            claimRefs:
              - CV031
