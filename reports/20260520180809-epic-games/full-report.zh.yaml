  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与细分定义
        blocks:
          - type: paragraph
            body: >
              Epic Games 无法被塞进单一市场定义。其商业策略横跨五个分析上不同的市场板块；这些板块共享平台基础设施，但买方、变现模式和竞争动态差异很大。尽调必须先分别评估每个板块，再测算任何可触达机会。


              第一块是全球电子游戏软件与服务市场——Fortnite 的主要收入池。该市场包括消费者在游戏软件、数字下载、游戏内购买、订阅和跨 PC、主机、移动平台 live-service
              变现上的支出。除非明确说明，它不包括游戏硬件、电竞奖金池和相邻广告市场。不同方法下估计差异很大：Newzoo 年度全球游戏市场报告跟踪软件 / 服务支出，曾报告 2023-2025 区间为
              $183-200B；Statista 更宽口径的 “global gaming market” 在 2025 约 $522.5B，纳入硬件、配件和更广的相邻支出类别。二者不可直接比较；本章以 Newzoo
              等价的软件中心定义作为主视角。


              第二块是游戏引擎和实时 3D 创作工具市场——Unreal Engine 的主要收入池。该市场包括商业授权、版税收入、云托管开发服务，以及用于创建交互式 3D
              内容的工具市场佣金。它不包括成品游戏收入（计入第一块），但包括同一套工具在非游戏场景中的使用（下文单列）。


              第三块是 PC 数字发行——Epic Games Store 在这里与 Steam 和其他商店争夺开发者发行关系和消费者购买份额。平台运营商收入来自交易费（EGS 为 12%，Steam 标准档为 30%）、广告
              / 发现费，以及 DLC / 货币市场经济。


              第四块是创作者 / UGC 平台经济——Fortnite Creative 和 UEFN 在这里与 Roblox、Minecraft
              及新兴平台争夺创作者注意力、开发工具采用和玩家生成内容参与带来的收入分成。这个市场更新、规模更难精确测算，但考虑到它对 Fortnite 长期参与度留存的影响，战略上很关键。


              第五块是非游戏实时 3D——Unreal Engine 在这里与建筑 / 工程 / 施工（AEC）、汽车设计和电影 / 电视虚拟制作中的专业可视化工具竞争。这是该引擎在周期性游戏市场之外利润率最高的扩张机会。
