        - 43.81 USD B（2026 年 5 月）
        - ~7.8x
        - 具备前瞻期权的最佳高端 IP 可比公司
        - GTA VI 预期和资本结构影响估值
      - - Unity
        - 引擎 / 工具平台
        - 1.813 USD B（FY2024 收入）
        - 11.45 USD B（2026 年 5 月）
