  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Fortnite 集中、参与度与重组风险
        blocks:
          - type: paragraph
            body: >-
              Epic 最大的风险是公司仍过度依赖 Fortnite，而最强的公开证据显示 Fortnite 参与度在 2025 年走弱。Tim Sweeney 的 2026 年裁员备忘录对一家私营公司来说异常直接：他把
              Fortnite 参与度下滑和过度支出联系起来，又把裁员与 $500 million 年化降本目标绑定。独立媒体同时证实裁员规模和低表现 Fortnite
              模式关闭，使参与度叙事不再只是抽象情绪，而变成可见的产品收缩。过去 Epic 可以用 Fortnite
              现金流支撑游戏、商店补贴和生态押注的激进扩张；现在它更像是在围绕一个仍很大、但已不如峰值时期宽容的核心游戏资产重新校准。


              这个集中风险重要，因为 Epic 其余组合更难承销。公开估计仍把 Epic 2022 年总收入放在约 $6 billion，而即便近期下滑，Fortnite 专项估计仍在数十亿美元区间。若 Fortnite
              弱化速度快过 Unreal Engine 授权、创作者经济分成或商店经济性抵消，容错空间很窄。商店仍与早前亏损和盈利不确定性绑定；引擎有战略价值，但没有作为分部披露。因此 2023 和 2026
              年重复裁员不只是周期性整理：它们说明 Epic 还没有证明自身成本基底能匹配后繁荣期的 Fortnite 收入曲线。
