      - number: '3.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: Steam 的目录护城河经受住了 EGS 价格优势的冲击
            body: >-
              EGS 2018 年上线七年后，Steam 按所有可得指标仍占据主导市场地位：132M+ MAU、50,000+ 款游戏、Workshop、Community Market，以及 Steam Deck
              硬件集成。Epic 的 12% 抽成促成了一些发行商合作，但没有改变市场重心。Fortnite 参与度下滑，而 EGS 增长又取决于 Fortnite 跨账号基础设施，发行分发业务仍是 Epic
              四条产品线中面对主要竞争者最薄弱的一条。
