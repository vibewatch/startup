      - number: '3.4'
        title: 平台与生态级竞争——Apple、Google、Microsoft
        blocks:
          - type: paragraph
            body: >
              Apple 和 Google 更像对抗性的平台把关方，而不是直接产品竞争者，但会实质影响 Epic 可触达收入。两者过去都对所有应用内购买收取 30%，促使 Epic 在 2020 年 8 月有意违反 App
              Store 和 Google Play 支付政策，并引发 Epic 里程碑式的反垄断诉讼。Apple 方面，Gonzalez Rogers 法官在 2025 年 4 月认定 Apple 故意违反 2021
              年禁令，并禁止 Apple 对外部支付链接收费；Fortnite 于 2025 年 5 月 20 日重返美国 iOS App Store。Google 方面，Epic 在 2023 年 12
              月赢得陪审团裁决；截至报告日，Google Play Store 的救济方案仍在谈判。

              Microsoft 运营 Xbox Game Pass（Ultimate、PC、Essential 档位），这是一项游戏订阅服务，按月付费即可访问数百款游戏。Game Pass 与 Fortnite 的
              Fortnite Crew 订阅（$11.99/月）竞争；后者打包 Fortnite Crew Pack 月度装扮、Battle Pass 和每月 1,000 V-Bucks。Xbox Game Pass
              游戏库本身包含 Fortnite（且 Fortnite Crew 是 Game Pass Ultimate 权益），因此二者有共同分发关系，并非纯粹对抗。不过，Microsoft 更广泛的游戏内容战略——包括
              Call of Duty（来自 Activision Blizzard）、Halo、Minecraft 和 Forza——会直接争夺玩家时间和订阅钱包份额。Xbox 云游戏（Game Pass
              Ultimate）让移动端不经过 App Store 支付也能玩到主机级游戏，形成 Apple/Google 移动端把关的间接绕行路径，且 Microsoft 从中受益并不依赖 Epic 的反垄断策略。

              Sony Interactive Entertainment 既是 Epic 的投资方（上一章约 5.4% 股权），也是平台运营商（PlayStation 4/5）。Sony 的 PlayStation
              Store 对游戏销售和 DLC 收取标准 30% 佣金，但这是主机发行，不是 PC 发行——Epic 的 EGS 不会与 Sony 商店直接争夺主机市场份额。Sony 这层战略关系为 Fortnite 在
              PlayStation 上的分发提供保护，并可能包括交叉推广的优待，但它不会改变 PC 发行或移动端的竞争动态。
