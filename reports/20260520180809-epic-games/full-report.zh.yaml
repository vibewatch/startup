      - number: '2.4'
        title: PC 数字发行经济——Epic Games Store 对 Steam
        blocks:
          - type: paragraph
            body: >
              PC 游戏数字发行市场由 Valve 的 Steam 主导；IHS Screen Digest 估计 Steam 在 2013 占 PC 数字游戏发行 75%，到 2021 已拥有超过 34,000 款游戏和
              132 million 月活用户。到 2017，Steam 年购买额约 $4.3 billion，至少占全球 PC 游戏销售额 18%（Steam Spy 估计）。考虑到网络效应，Steam 当前市场位置可能强于
              2013 数字，但可比较的当年份额数据未公开披露。


              Epic 推出 Epic Games Store 的战略理由在 December 2018 上线时就很明确：用 12% 分成（开发者拿 88%）挑战 Steam 30% 抽成，主张 Valve
              的规模化利润率缺乏正当性。截至 May 2026，EGS 分发页面报告用户 295 million、覆盖 187 个国家、43 种区域货币下支持 80+ 支付方式，并为每个产品前 $1 million
              年净收入提供零抽成档（据 Wikipedia EGS 条目，June 2025 生效）。可选独占计划在发售前六个月提供 100% 收入分成。标准 EGS 模式扣除内容分发成本后给 Epic 留下约 5%
              净运营利润率——缓冲很薄，必须靠 Fortnite 的规模经济和市场交叉销售才能持续。


              Steam 的阶梯定价结构（标准 30%，收入超过 $10M 的游戏 25%，超过 $50M 的游戏 20%）意味着，Epic 12% 抽成对年收入在 $1M 至 $50M 之间、且无法享受 Steam
              大客户折扣的中型发行商最有竞争力。对收入超过 $50M 的 AAA 发行商，Steam 实际抽成接近 20%，缩窄但没有消除 Epic 的价格优势。这个阶梯动态切分了 EGS 可触达的发行商市场。


              Steam 的网络效应——社区功能、集换式卡牌、市场集成、VR 支持、Steam Deck 兼容和 Proton Linux 兼容——对发行商和消费者都是实质切换成本，超出单纯收入经济。Epic
              对此已有隐性承认：Tim Sweeney 曾表示，独占交易是 EGS 面对 Steam 根深蒂固位置时获得有效流量的唯一方式。Epic 此后转向开放自助发行模式（March 2023），并逐步降低收入分成摩擦，但
              EGS 在 PC 发行中的市场份额仍明显低于 Steam。
