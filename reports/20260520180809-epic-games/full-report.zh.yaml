chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、架构与公司画像
        blocks:
          - type: paragraph
            body: >
              Epic Games, Inc. 是一家私营、注册在 Delaware 的互动娱乐与技术公司，总部位于 620 Crossroads Blvd, Cary, North Carolina。公司由 CEO Tim
              Sweeney 于 1991 以 Potomac Computer Systems 名义创立，1992 更名为 Epic MegaGames；随着从共享软件游戏扩展到主流发行和引擎授权，公司随后在 1999
              改名为 Epic Games。Sweeney 通过单一类别普通股保留多数所有权和投票控制权；这一治理结构让公司即便在股权结构表上逐步引入 Tencent、Disney、Sony 和 KIRKBI
              等战略资本，也能隔绝敌意投资人影响。

              Epic 业务覆盖四条主要产品线：Fortnite（互动娱乐平台）、Unreal Engine（行业领先 3D 创作工具）、Epic Games Store（PC 游戏市场）和 Epic Online
              Services（模块化后端服务平台）。公司官方材料称，截至 early 2026，Fortnite 账户超过 800 million，好友连接超过 6
              billion；按全球注册用户数看，它是最大的消费游戏平台之一。跨所有产品线，Epic 同时是游戏发行商，也是面向开发者的平台和工具公司——这种组合带来有意义的跨板块依赖和杠杆。

              截至报告日 May 2026，经历 2023 和 early 2026 一系列重大裁员后，公司约有 4,000 名员工。Epic 是私营公司，未披露经审计财务报表；基于二手来源的公开收入估计将 2022
              收入放在约 $6B，但公司未确认该数字，也没有更近期合并收入数字公开。
