      - number: '4.3'
        title: 资本结构、融资历史与估值轨迹
        blocks:
          - type: paragraph
            body: >
              Epic 是一家私人、股权高度集中的公司，Tim Sweeney 保留多数所有权（多家报道公司治理的新闻来源确认）。公司外部融资历史通过官方新闻稿和新闻报道有充分记录。Tencent 2012 年以约 $330
              million 收购约 40% 少数股权——这笔交易在 Unreal Engine 商业扩张和 Fortnite 开发前提供了转型资本。该股权已被后续轮次部分稀释，但 Tencent 仍是最大单一外部股东。

              有记录的 2020 年后轮次顺序为：2020 年 $1.25 billion 融资，估值 $17.3 billion；2021 年 $1 billion 融资，估值 $28.7 billion；以及 2022 年
              4 月来自 Sony 和 KIRKBI（LEGO 母公司）的 $2 billion 融资，投后估值 $31.5 billion——这是最近一轮日期明确且投后估值确认的融资。$31.5 billion 的 2022
              年估值，是承销判断可用的最后硬数据点。

              2024 年 2 月 7 日，Disney 宣布对 Epic 进行 $1.5 billion 股权投资，称将购买一笔股权，“尚待监管批准”。Variety 的 D23 报道（2024 年 8 月 10 日）将
              Disney 投资视为已完成，Wikipedia 的 Epic Games 信息框列示 Disney 当前持股约 9%，说明交易已经交割。不过，没有一手来源确认准确交割日期。The Information
              报道（News & Observer 引述一名知情人士称）该交易隐含 Epic 估值为 $22.5 billion——较 2022 年 $31.5 billion 估值折价 28.5%。Epic 和 Disney
              均拒绝确认或否认这一数字。若该隐含降价准确，它与 2022–2024 年游戏行业整体估值压缩一致。

              Epic 未披露现金余额、烧钱速度或现金跑道。2026 年 3 月宣布的 $500 million 年度成本节省目标，意味着此前存在运营亏损，或至少存在规模化现金消耗。有记录轮次的外部资本合计约 $5.8
              billion（Tencent $330M + $1.25B + $1B + $2B + $1.5B Disney），未计入任何未披露的更早或中间轮次。
