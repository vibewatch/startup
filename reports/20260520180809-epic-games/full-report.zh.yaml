      - number: '1.2'
        title: 创立、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Epic Games 由 Tim Sweeney 创立；自 1991 公司起步至今三十多年，他仍是 CEO 和控股股东。Sweeney 最早在 1995 搭出如今的 Unreal Engine，并随 1998
              游戏 Unreal 发布第一版；之后，Epic 每次重大产品转向的技术和战略决策几乎都由他拍板。Mark Rein 于 around 1992 加入，现任 Vice President，持有公司约
              4%，是机构投资人之外的重要少数股东。

              Epic 的治理围绕 Tim Sweeney 在单一类别普通股中的控股权益展开。不同于把投票权和经济权利拆开的双重股权结构，Sweeney 的多数股权同时给他二者。这一结构一直支撑 Epic
              与大型平台所有者——尤其 Apple 和 Google——对抗，而不必担心包括 Tencent 在内的机构少数股东在董事会层面否决；Tencent 持有约 28%
              股权，但没有控制地位。公司未在公开材料中披露正式董事会构成；截至报告日，可访问公开来源也查不到独立董事信息。

              公司未公开宣布 CEO 继任计划、首席财务官任命或董事会扩容。Tim Sweeney
              关键人集中度对任何持续评估高管连续性都是实质治理风险；考虑到公司规模，以及在裁员驱动重组期同时管理四个平台业务的运营复杂度，这一风险更突出。
