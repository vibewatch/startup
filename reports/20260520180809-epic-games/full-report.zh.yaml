      - number: '2.5'
        title: 创作者经济与 UGC 平台——UEFN 和 Fortnite Creative
        blocks:
          - type: paragraph
            body: >
              Fortnite 的创作者和 UGC 生态是 Epic 最具战略差异化的市场位置之一。Fortnite Creative 与游戏本体一起在 December 2018 推出；Unreal Editor for
              Fortnite（UEFN）是基于完整 UE5 的岛屿创作工具集，于 March 2023 上线。该平台与 Roblox（据 Wikipedia，February 2025 日活 85.3M）和
              Minecraft 创作者生态竞争。


              Epic 的 “Creator Economy 2.0” 将创作者定位为收入分成伙伴，而不是内容授权方。根据 Digiday 对 Epic GDC 2023 State of Unreal
              演示的报道，Fortnite 用户约 40% 总游玩时间花在 Creative 模式内，包括用户创建的游戏、训练地图和品牌活动。这个数字推动了向 Creator Economy 2.0
              的转型：创作者可获得其岛屿参与度对应的所有 Fortnite 收入的 40%。Digiday 报道，在 mid-2023 这一转型时，Fortnite 月玩家约 70 million。


              UEFN beta 阶段第一年，Island Creator 计划估计向 20,000 多名发布体验的开发者支付 $320 million（据 Wikipedia UEFN
              条目）。这个支付规模按绝对美元计已可比更小的游戏引擎授权生态，也验证了平台的创作者变现逻辑。此后 UEFN 生态引入 LEGO、Fall Guys、TMNT、Star Wars（March 2026）和
              Walking Dead 资产，逐步提高创作者可用 IP 多样性。


              创作者经济模式的结构性风险包括：Epic 创作者支付公式不透明（为防滥用，未公开披露）、创作者 IP 争议（March 2024 “Pit” DMCA
              争议暴露平台治理和创作者产权之间的张力），以及少数高流量创作者拿走不成比例分成的集中风险。不过，第一年 $320M 支付表明 Epic 已搭出商业上真实的创作者经济，而不只是宣布一项战略。
