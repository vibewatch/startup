              $520M FTC 和解发生在 2022，其中包含史上最大 COPPA 罚款；它证明 Epic 不仅愿意挑战平台所有者，也会与监管者对抗。暗黑模式退款计划增加了运营复杂度。Epic 与 Apple、Google
              的持续战斗虽然产生有利结果，但继续带来诉讼成本和执行风险，可能在本已艰难的重组期分散管理层注意力。
