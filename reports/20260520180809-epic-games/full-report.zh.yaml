      - number: '8.2'
        title: 公开可比公司显示价值，也支持私营公司折价
        blocks:
          - type: paragraph
            body: >-
              框定 Epic 最有用的方式，是把它看成三块部分重叠业务的混合体：以 Fortnite 为中心、爆款驱动的消费平台；以 Unreal Engine 为中心的软件工具平台；以及由 EGS
              锚定、仍未达规模的商店生态。没有一家公开可比公司能覆盖全部三块。Roblox 是最接近的公开创作者经济和 UGC 类比；EA 是最好的多元化发行商基准；Take-Two 是最好的实时服务优质 IP
              类比；Unity 是最纯的引擎和工具可比公司。根据 CompaniesMarketCap 和公司业绩发布，这些公开公司大致处在 6x 到 9x 的市值 / 收入区间。


              这个区间有用，但不能自动套到 Epic。公开同行发布审计结果、季度更新和管理层指引；Epic 不披露。Roblox 享有溢价，一部分是因为市场每个季度都能给其创作者经济标价；Unity
              的压缩说明，一旦可信度走弱，工具平台价值可以多快重置；EA 和 Take-Two 则说明，即便一线发行商，缺少清晰执行也拿不到无限倍数。Epic 因 Unreal
              和生态触达值得一些溢价，但集中度和不透明也应打折。因此，分部估值逻辑更适合用来设定区间，而不是声称有虚假的精确性。
            claimRefs:
