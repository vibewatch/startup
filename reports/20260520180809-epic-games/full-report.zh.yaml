      - number: '1.3'
        title: 资本结构与投资人图谱
        blocks:
          - type: paragraph
            body: >
              Epic Games 自 2012 Tencent 交易以来已披露募集机构资本超过 $5 billion，五轮主要融资构成股权结构表锚点。公司最后披露的投后估值为 $31.5 billion，来自 April
              2022 由 Sony 与 KIRKBI（Lego Group 所有者 Kirk Kristiansen 家族的投资机构）共同领投的轮次。The Walt Disney Company 后续在 February
              7, 2024 宣布 $1.5 billion 股权投资，隐含单位价值与 2022 基准一致；Wikipedia 当前所有权列表显示 Disney 持股约
              9%，暗示该交易在宣布后已交割，但截至报告日没有可直接访问的一手来源确认精确交割日期——这是股权结构表时间线上的小证据缺口。

              投资人名单反映，围绕 Epic 平台野心，游戏、媒体和消费平台资本正在汇聚。Tencent 约 28% 持股于 2012 以约 $330 million
              取得，后续融资稀释了比例，但它仍是创始人之外最大持股方。Sony 约 5.4% 持股体现持续战略关系：2021 轮 $200 million 共同投资打开关系，2022 轮 $1 billion
              参与进一步加深。Disney 宣布的 $1.5 billion 投资伴随多年合作，双方计划使用 Epic 平台和 IP 创建新的游戏与娱乐宇宙，使资本交易和商业合作无法切开。KIRKBI 在 2022 轮的 $1
              billion 仓位，也对应 Kirk Kristiansen 家族通过 Lego 与 Epic 合作（Lego Fortnite）深度嵌入游戏生态的路径。

              截至 2026，Epic 资本位置的显著之处在于 Disney 交易后没有新的公开融资公告。考虑到 2026 裁员，以及 CEO 关于支出快于收入的表态，Epic
              是否在推进新一轮融资、战略并购或上市路径仍未解决；这也是本章面向未来的实质证据缺口。
