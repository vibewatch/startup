      - 竞争威胁
      - 威胁程度
      - 缓释措施 / 尽调事项
    rows:
      - - UE5 在 AAA 渲染的技术领先（Nanite、Lumen）
        - Unity 6 缩小质量差距；Godot 在较低保真层级采用零成本模式
        - 中 — AAA 护城河短期稳固；中端市场被侵蚀
        - 跟踪 2025-2026 发布周期中，前 Unity 3D 工作室对 Unity 6 的采用
      - - Fortnite 800M+ 注册账户构成 EGS 分发基础
        - Epic 在 2026 年裁员公告中称，Fortnite 互动自 2025 年开始下滑
        - 高 — EGS 战略价值取决于 Fortnite 受众健康度
        - 跟踪 Fortnite DAU/MAU 趋势；验证互动下滑是周期性还是结构性
      - - EGS 12% 抽成相对 Steam 30%，构成开发者激励
        - Steam 的目录深度、社区功能和 Steam Deck 硬件护城河
        - 中 — 价格下探不足以突破 Steam 网络效应
        - EGS 若要长期增份额，需要价格之外的目录或社区差异化
      - - UEFN 作为高质量创作者工具集，并绑定 Fortnite 受众
        - Roblox 创作者基础更大、上手更简单、创作者绝对支付更高
        - 中 — Roblox 赢在创作者广度；UEFN 可能赢在创作者质量和 IP 力
        - 跟踪 UEFN 已发布岛屿数量、创作者支付增长，以及头部岛屿互动相对 Roblox 的表现
      - - Epic 对 Apple/Google 的法律胜利改善移动端 TAM
        - Apple 正在上诉 2025 年裁决；Google 补救措施不确定；美国反垄断环境有政治风险
        - 中 — 监管胜利可能在上诉中被部分推翻
        - 跟踪 Apple 上诉进程和 2026 年内 Google Play 补救协商
      - - EGS 独占游戏可免 Unreal Engine 版税（开发者激励）
        - 开发者可同时在 Steam 和 EGS 发布；多归属限制独占杠杆
        - 低-中 — EOS 版税豁免是真实激励，但尚未改变目录集中度
        - 评估新增 EGS 游戏中使用 EOS 的比例，以及版税豁免是否为主要获客驱动
      - - 工作室切换成本（已绑定系列迁移引擎很贵）
