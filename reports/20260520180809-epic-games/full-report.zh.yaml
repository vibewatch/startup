            title: 支出收入失衡与 Fortnite 参与度风险
            body: >-
              Tim Sweeney 在 2023 和 2026 两次裁员沟通中的表态均确认，Epic 的支出一直高于收入。2026 裁员提到 Fortnite 参与度自 2025
              开始下滑；若下滑持续，主要收入驱动将承压，并可能迫使公司再融资或继续减员。作为私营公司，Epic 自 2022 以来未披露经审计财务，收入缺口深度是实质盲区。
