      - number: '8.4'
        title: 投资决策应围绕一小组缺失证明展开
        blocks:
          - type: paragraph
            body: >-
              由于 Epic 是披露很少的私营公司，剩下最重要的工作不是打磨模型表格，而是获取证据。投资者需要当前收入、分部拆分、现金消耗和资本结构细节，才能判断 Epic
              应该拿溢价软件平台倍数、折价发行商倍数，还是介于两者之间。他们还需要更清楚的证据，判断 Disney
              正在变成可变现业务线，还是只是一个高调战略合作、上行空间兑现周期很长。没有这些证明，即便认真推导的估值区间，也更像一个有纪律的括号，而不是可承销的公允价值点估计。


              使用当前公开记录最干净的方法，是设定明确的投资逻辑破裂触发器。如果 Fortnite 参与度不能稳定，如果再发生一轮重组，如果 Apple 经济性重新收紧，或 Disney
              仍拿不出具体变现里程碑，公允价值区间就应下移。相反，更完整的分部披露、EGS 经济性已盈利或接近盈利的证据，以及清晰的 Unreal
              收入增长，都支持重新审视建议。在此之前，“继续研究”不是一种对冲，而是承认缺失证据恰好决定 Epic 到底只是昂贵，还是确实有吸引力。
