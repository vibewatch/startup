      - number: '3.5'
        title: 护城河耐久性、替代风险与反向竞争证据
        blocks:
          - type: paragraph
            body: >
              Epic 的竞争护城河在不同业务线之间差异很大。游戏引擎里，Unreal Engine 5 在高保真渲染（Nanite、Lumen、Chaos physics）上的技术领先，为 AAA
              工作室形成真实切换成本：在系列作品中途迁移到新引擎，需要重新培训工具、重建资产管线，并冲销大量沉没成本。UE5 的可视化脚本系统（Blueprints）和 Marketplace
              资产库进一步增强粘性。不过，这条护城河主要对拥有活跃多作品系列的工作室有效；绿地项目可以自由评估所有引擎，而 Unity 的 Pro 订阅模式和 Godot 的零成本模式，会在低端和中端市场持续施压，在这些层级
              UE5 的高保真优势并不重要。

              PC 发行里，Epic 没有可持续护城河。EGS 的 12% 抽成率运营七年，仍未让多数第三方发行商离开 Steam；Steam 132M MAU 与 EGS 295M
              注册用户之间的网络效应差距（后者隐含的单用户活跃度更低）仍是决定性因素。Steam 的 Workshop、Community Market、Steam Trading Cards，以及通过 Proton 支持原生
              Linux（Steam Deck），构成多层社区基础设施，EGS 无法快速或低成本复制。反向证据很明确：即便定位上具备价格竞争力，也没有公开报道显示 EGS 接近 Steam 的单用户收入或发行商目录广度。

              在 UGC 与创作者经济里，UEFN 的护城河还早，但结构性存在：UEFN 工具集独特地绑定了 Fortnite 800M+ 账号基础这个分发渠道，为创作者内置受众，这是 Roblox 无法给 UEFN
              创作者的。不过，Roblox 更大的创作者基础（$923M 对 Epic 首年 UEFN 支付约 $320M）、更简单的上手流程和更高的日活参与度（85.3M DAU；Fortnite 126M
              月玩家意味着不同的日活使用比例）说明，按广度指标看，Roblox 握着创作者经济护城河。Epic 的 UEFN 优势在于创作工具质量和 IP 品牌势能（Marvel、Star
              Wars、Disney），不是创作者网络规模。

              Epic 竞争者生态里的切换成本：- 引擎切换：对已押注系列作品的工作室很高；对新项目很低 - EGS 切换：消费者端很低（除 Epic 独占游戏外没有 DRM 锁定）；发行商端低
                （多平台上架很常见；多数发行商会同时登陆 Steam 和 EGS）
              - Fortnite/UEFN 平台：中等（创作者对地图和 IP 的投入是 EGS 独占；玩家 V-Bucks
                不可转移；但 Fortnite 免费游玩，降低了消费者锁定）

              来自竞争者的核心反向风险集中在两处：（1）Unity 若最终走出 2023-2024 年信用危机，可能在移动端和中端市场夺回开发者份额——Unity 6（2024 年发布）是对 UE5
              进展的可信技术回应；（2）Steam 对目录的绝对统治意味着，EGS 的成功依赖 Fortnite 账号关系，而不是店铺本身的竞争力；在 Epic 已提到 Fortnite 参与度下滑的背景下，EGS
              战略上取决于 Fortnite 继续维持受众参与。
