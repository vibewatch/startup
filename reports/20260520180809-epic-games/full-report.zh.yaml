    title: 缓释措施与投资逻辑破裂标准表
    description: Monitorable triggers that would move the investment view from high-risk optionality to clear thesis break.
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - Fortnite 下滑
        - 消费者参与度更新
        - 又一年没有披露企稳，且更多模式关闭
        - 假设盈利能力更低，并压缩估值假设
      - - 平台反转
        - Apple 上诉结果
        - 法院实质性收窄或延迟反引导经济收益
        - 下调来自移动端利润率恢复的上行空间
      - - 重组未完成
        - 人力调整
        - 第三轮重大裁员，或进一步大规模降本计划
        - 将当前重置视为不足，并下调治理信心
      - - Disney 执行
        - 合作进展
        - 更多品牌活动，但没有披露变现或里程碑
        - 按接近零的独立价值建模 Disney 期权
      - - 商店经济性
        - EGS 盈利能力
        - 到 2027 年或之后仍无可持续商店经济性证据
        - 赋予 EGS 极低或负向战略价值
      - - 治理不透明
        - 董事会 / 接班披露
        - 融资或流动性事件前，接班或董事会透明度没有改善
        - 要求更高折扣，或放弃溢价入场
    notes: 这些触发项用于承销纪律，而不是预测精确时点。
