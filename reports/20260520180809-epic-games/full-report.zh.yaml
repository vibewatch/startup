        - 2022 年硬性估值锚 31.5 USD B；2024 年未经证实隐含估值 22.5 USD B
        - ~5.3x，基于 2022 年估计收入；~3.8x，基于 22.5B / 6B
        - 显示即便没有公开交易，私募估值标记也能大幅移动
