      - number: '6.2'
        title: UEFN 创作者经济 — 参与收入与发现机制
        blocks:
          - type: paragraph
            body: >
              Unreal Editor for Fortnite（UEFN）于 2023 年 3 月 22 日上线，创造了一个新的创作者客户群：创作者同时是用户、付费者和收入获得者。创作者用接近完整 Unreal
              Engine 的界面投入时间和技能，在 Fortnite 内搭建岛屿（UGC 体验）。作为回报，Island Creator 计划向创作者支付其岛屿所归因参与收入的 40%——“参与收入”按 Fortnite
              平台总收入的一部分计算（包括 Battle Pass 和 V-Bucks 销售），并按玩家在各岛屿的会话时长加权。剩余约 60% 归 Epic。

              UEFN 测试期第一年，Epic 的 Island Creator 计划估计向超过 20,000 名发布体验的开发者支付 $320 million。这个数字在 GDC 2024 披露，并被 Wikipedia 的
              UEFN 条目引用，代表了一个可观的创作者经济——结构上可比 Roblox 的创作者计划，也大于许多独立游戏开发市场。玩家在 Creative 模式中花掉 Fortnite 游玩时间的 40%（据 Epic 在
              GDC 2023 披露、Digiday 转述的数据），支撑了创作者经济的规模：玩家在 UGC 中停留的时间，直接生成创作者收入。

              这个细分的对抗性动态在于发现流量集中。Epic 的算法名为“Discover”，决定哪些创作者岛屿拿到玩家流量。公式不公开，不过 Epic 表示它会权重总点击、玩家参与度、玩家留存，以及访问后的 V-Bucks
              消费。Discover 页面显示并发用户（CCU）数量，引发社区反弹：低 CCU 创作者称，这个指标会自我强化劣势，因为玩家会跳过低 CCU 体验，进一步压低算法放大。2024 年还出现商标和 DMCA
              纠纷：一名头部创作者试图把“The Pit”（常见游戏类型）注册为商标，Epic 起初下架相似岛屿，后在社区压力下撤回。创作者群体的经济性结构性依赖算法给到玩家流量——这和 YouTube
              创作者依赖推荐算法变化类似，是集中风险。
            claimRefs:
              - CU009
              - CU014
              - CU015
              - CU016
              - CU017
      - number: '6.3'
        title: 游戏开发者客户 — Unreal Engine 5 授权方与 EOS 采用者
        blocks:
          - type: paragraph
            body: >
              游戏开发者是 Epic 技术上最重要的客户群。Unreal Engine 5 是 AAA 和 AA 高保真视觉制作的首选引擎，Nanite 虚拟化几何和 Lumen
              全局光照消除了内容生产中的主要瓶颈。商业条款是：单个产品总收入超过 $1 million 后，开发者支付 5% 版税。若产品通过 Epic Games Store 独家发行并使用 Epic
              支付系统，版税完全免除，直接把 UE5 采用和 EGS 发行绑定成激励。

              UE5 的具名客户证据强且新。Game Science 开发、2024 年 8 月 20 日发布的 Black Myth: Wukong 基于 UE5 制作，首月售出 20 million
              份——是史上销售最快的游戏之一。该游戏获得多个 Game of the Year 奖项，也证明 UE5 在传统西方工作室之外的市场也能支撑 AAA 制作。Ninja Theory/Microsoft 于 2024
              年 5 月 21 日发布的 Senua's Saga: Hellblade II 基于 UE5 制作，并通过 Epic 子公司 3Lateral 的 MetaHuman 做面部动画——这是两个 Epic
              工具组合落地的生产级案例。该作评价整体积极，视觉质量获得肯定，并被归因于 UE5。

              Epic Online Services（EOS）把开发者客户关系延伸到引擎使用之外。EOS 免费提供跨平台后端服务，包括多人匹配、玩家账号（Epic 或外部身份提供方）、反作弊、云存档和分析。EOS
              不绑定引擎，支持 Unity、Unreal Engine 和自研引擎。获客逻辑是：Epic 免费提供有竞争力的后端基础设施，即使游戏不是 UE5 打造，也能拿到开发者关系和账号数据。EOS 文档称可借助 Epic
              Games 账号图谱“触达近 1 billion 玩家”。EOS 尚未公开变现模式；服务可免费集成和运营，因此更像开发者生态投入，而不是直接收入线。
