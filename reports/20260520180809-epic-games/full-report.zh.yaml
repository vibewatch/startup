      - number: '2.3'
        title: 游戏引擎市场——Unreal Engine 的位置与动态
        blocks:
          - type: paragraph
            body: >
              游戏引擎市场是开发者工具市场，Epic 的 Unreal Engine 主要与 Unity Technologies 以及长尾自研 / 定制引擎竞争。根据 Wikipedia 的 Unreal Engine
              条目引用的数据（归因于 Creative Bloq, February 2025），Unreal Engine 在 2024 约占开发者市场份额 28%，高于 2012 的 17%；Unity 约维持 50%
              开发者市场份额。但按销售额看，故事不同：Unreal 占销售收入 31%，Unity 为 26%，自研引擎合计 42%。这种分叉——Unity 开发者更多，但 Unreal 单开发者收入更高——反映 Unreal
              集中在高预算 AAA 游戏，版税金额更实质。


              Unreal Engine 版税模式对超过 $1 million 的商业收入收取 5%，在 Epic Games Store 独家发行的游戏完全免版税。这项版税在引擎市场份额和 EGS
              发行经济之间形成天然连接。Unity 此前没有等价版税，直到 September 2023 争议性推出 “runtime fee”，按安装量而不是收入收费——这个模式反响极差，引发开发者反弹、CEO
              辞职（John Riccitiello 于 October 2023 离任），并被 Wired 描述为可能造成不可修复的声誉损害。Unity 在 September 22, 2023
              撤回该政策，但开发者信任仍受损；Unity 股价对应估值也从 November 2021 峰值 $57B 降至 September 2024 约 $6B。


              这场可信度危机为 Unreal Engine 5 带来显著迁移顺风，CD Projekt（下一部 Witcher saga）、Riot Games（探索 UGC
              竞争）以及数十家中型工作室等高知名度团队公开承诺采用 UE5。Unreal Engine 5 本身于 April 2022 发布，引入 Nanite（虚拟化几何）和
              Lumen（动态全局光照），以低于前代引擎的开发成本交付 AAA 级视觉保真度。


              Unreal Engine 在非游戏领域的采用正成为新差异点：到 October 2022，Epic 已与全球运行 300 多个虚拟制作片场的团队合作（使用 The Mandalorian 带火的 LED
              volume stages）。Epic 面向建筑、电影 / 电视和汽车的解决方案页面确认这些垂直行业是战略目标，但公开来源看不到非游戏 UE 授权的收入贡献披露。
