      - number: '3.3'
        title: PC 数字发行——Steam 根深蒂固的主导地位对 Epic Games Store
        blocks:
          - type: paragraph
            body: >
              Steam 由 Valve Corporation 运营，无论按哪项指标看，都是最大的 PC 数字发行平台。Wikipedia 的 Steam 条目引用 2021 年数据称，Steam 月活跃用户（MAU）超过
              132 million，游戏超过 34,000 款。该平台 2003 年上线，22 年的目录沉淀、社区功能（Steam Workshop、Steam Community Market、Steam Trading
              Cards）和社交工具，为发行商和消费者都堆出了多层切换成本。Valve 的手持 PC Steam Deck（2022）又用软硬件绑定进一步加固了 Steam；EGS 生态里没有对应机制。仅 Steam
              的创意工坊 mod 生态，每款游戏每年就能新增数千小时社区创作内容，这类 UGC 是 EGS 没有提供的。

              Steam 的收入分成模式是：收入前 $10 million 向发行商收 30%，$10M-$50M 部分收 25%，超过 $50M 后收 20%（据 Steamworks 文档）。相比之下，Epic Games
              Store 统一收 12%，不设阶梯；在前 $10M 上有 18 个百分点优势，在超过 $50M 后仍有 13 个百分点优势。使用 Epic Online Services 后端的游戏，EGS
              还完全免佣。这个结构性价差是 Epic 最主要的竞争杠杆：EGS FAQ 明确把 88%/12% 收入分成写成创立时的设计原则。高收入游戏里，Steam 的阶梯结构使有效抽成率接近 20-22%，会压缩但不会抹掉
              EGS 对头部发行商的价格优势。

              Epic Games Store 虽然到 2018 年底才上线，但截至 2025 年初，按 EGS FAQ 和多家媒体报道确认，PC 与 Mac 用户已增至 295 million。不过，EGS 约 9,000
              款游戏的库容被 Steam 的 50,000+ 款远远压过，目录差距削弱了消费者在 EGS 上的发现型流量。Epic 的独占内容策略（包括 Fortnite、Rocket League、Fall Guys
              等重大独占，以及第三方限时独占）提高了消费者认知，却也引发了显著负面情绪（“独占反消费者”），并在玩家社区讨论中持续发酵。EGS
              每周免费游戏计划有助于积累正面好感，但主要吸引价格敏感用户，转化为高消费活跃买家的概率不高。

              EGS 相对 Steam 的反向竞争证据很尖锐：没有公开数据源能确认 EGS 接近 Steam 的参与度、目录广度、社区功能深度或单用户收入指标。Steam
              的网络效应——开发者想去玩家所在之处，玩家也想去游戏所在之处——会自我强化；EGS 运营七年、持续用 12% 抽成施压之后，这种效应仍被证明很稳固。EGS 的核心价值主张仍是更低抽成和 Fortnite
              的跨平台账号系统，而不是游戏库广度或社区工具。
