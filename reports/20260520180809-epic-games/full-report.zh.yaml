      - number: '6.5'
        title: 集中风险、EGS 发行商细分、留存缺口与监管发现
        blocks:
          - type: paragraph
            body: >
              Epic Games Store 服务第五类客户：游戏发行商和买家。EGS 2023 年达到 295 million 注册账号和 $950 million 收入。平台对发行商的核心价值主张是经济性：发行商保留
              88% 收入，而 Steam 为 70%。从 2025 年 6 月起，Epic 对总销售额低于 $1 million 的游戏进一步完全取消抽成，使 EGS 对小型工作室几乎成为零成本渠道。First Run
              计划、每周免费游戏（自 2019 年 6 月起每周一款）以及带保底收入支付的限时独占交易，是主要发行商获客工具。2020 年 5 月 GTA V 免费赠送带来超过 7 million 新用户；Star Wars
              Battlefront II（2021 年 1 月）获得 19 million 下载——说明免费游戏能为 EGS 带来大量用户获取。EGS 移动扩张（全球 Android 和欧盟 iOS，2024 年 8
              月）扩大了可触达的发行商分发机会，但美国 iOS 仍取决于持续中的 Apple 法庭争议。

              客户集中风险实质上偏向 Fortnite。Tim Sweeney 2026 年 3 月备忘录把此前隐含的事情说透：Fortnite 是主要收入驱动，参与度下滑导致公司整体支出超过收入。$500 million
              成本节约计划和 1,000+ 裁员，是单一游戏收入集中的运营后果。FTC 的 $520 million 和解（2022 年 12 月）——包括儿童数据收集 COPPA 违规 $275
              million、暗黑模式变现做法 $245 million——进一步量化了 Fortnite 用户基础中的消费者行为风险。超过 600,000
              名用户提交了与非自愿购买相关的退款申请，说明变现模型存在明显摩擦点。PCGamesN 对 Epic 和解回应的报道显示，Epic 承认“长期存在的行业做法已经不够了”，表明面向消费者的支付流程需要结构性改革。

              Epic 任何客户细分都没有公开可得的 NRR、GRR 或队列流失数据；公司是私营企业，不发布分部财务。Disney 2024 年 2 月 $1.5 billion 少数股权投资，为 Fortnite
              的长期平台潜力提供战略背书，但不能替代已披露留存指标。UEFN 创作者收入集中在表现最好的岛屿（由 Discover 系统算法放大），给创作者经济带来平行的集中风险：少数岛屿可能拿走 $320M+
              创作者分成中的不成比例份额，20,000+ 创作者中的大多数只能获得有限经济性。
