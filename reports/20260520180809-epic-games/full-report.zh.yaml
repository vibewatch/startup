      - number: '4.4'
        title: 法律和解与监管现金支出
        blocks:
          - type: paragraph
            body: >
              自 2022 年以来，Epic 发生了重大法律和监管现金支出。Federal Trade Commission 和解（2022 年 12 月）要求合计支付 $520 million，分两部分：向美国政府支付
              $275 million 民事罚款，因违反 Children's Online Privacy Protection Act（COPPA）——这是 FTC 史上最大 COPPA 罚款；另有 $245
              million 进入消费者退款基金，用于补偿受到 暗黑模式设计伤害的用户。CNN 将这笔合计 $520M 称为“FTC 史上开出的最大罚款”。$245M 退款基金已部分发放：FTC 报告称，2024 年 12
              月向超过 600,000 名合格用户发放约 $72 million。和解还施加了为期 20 年的暗黑模式禁令，并要求 Epic 实施明确支付同意机制。

              Apple 诉讼为 Epic 带来实质正向财务结果。2025 年 4 月，美国地区法官 Yvonne Gonzalez Rogers 认定 Apple 故意违反 2021 年禁令，并命令 Apple
              立即停止对外部购买链接交易收取佣金。法院还命令 Apple 支付 Epic 在藐视法庭程序中产生的律师费。2021 年裁决后，Apple 一直对应用外购买收取 27% 佣金（低于原本 30%
              的应用内费率）——法院认定该做法延续了对 Epic 的反竞争伤害。Apple 正在对 2025 年 4 月裁决上诉；Fortnite 于 2025 年 5 月重返美国 App Store。

              Google Play 和解（2026 年 3 月 4 日宣布）在 Epic 于 2023 年 12 月赢得陪审团裁决后，解决了 Epic 的反垄断案件。和解设定差异化费率：新安装（应用内内容）收 5% 计费费加
              15% 服务费，既有安装合计 20%，新安装一次性购买收 15%，订阅收 10%。Fortnite 于 2026 年 3 月 19 日全球重返 Google Play。Ars Technica 将结果描述为“固定
              30% Play Store 分成对 Epic 的游戏而言已经彻底死亡”的证据。
