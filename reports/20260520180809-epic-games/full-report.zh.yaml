        - 8-12 USD B
        - 若参与度持续下滑，或再次出现重大重组，这一情景更可能发生
      - - 基准
        - Fortnite 企稳，Unreal 稳步增长，EGS 仍具战略意义但利润率不高，Disney 大多仍是 期权价值
        - 15-20 USD B
