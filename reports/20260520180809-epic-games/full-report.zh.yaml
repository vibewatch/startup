        - 多元化高端游戏发行商
        - 7.463 USD B（FY2025 净收入）
        - 50.54 USD B（2026 年 5 月）
        - ~6.8x
        - 高规模游戏业务最好的成熟上市发行商下限参照
        - 比 Epic 更多元、透明度更高
      - - Take-Two Interactive
        - 实时运营 IP / 高端系列平台
