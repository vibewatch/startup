      - number: '5.5'
        title: 技术护城河、平台依赖与产品风险
        blocks:
          - type: paragraph
            body: >
              Epic 的技术护城河建立在三项叠加优势上：UE5 渲染管线（Nanite + Lumen）、Fortnite 作为试验场的飞轮，以及多边平台的网络效应。

              在 UE5 渲染侧，截至 2026 年，Nanite 和 Lumen 是行业最强的生产可用实时渲染管线。该引擎已被多家 AAA 工作室的大作采用（Black Myth: Wukong、Senua's Saga:
              Hellblade II、Avowed、Clair Obscur: Expedition 33、Fortnite），形成自我强化的开发者生态：工作室招聘 UE5 开发者，会叠加对 UE5
              专业能力的需求，加深人才池护城河。Epic 的开源模式（GitHub，需权限）允许工作室 fork 并定制引擎，同时 Epic 维护核心，相比自研闭源竞争者降低了流失风险。

              Fortnite 作为试验场的飞轮，给 Epic 带来独特验证闭环：UE5 功能在进入第三方工作室之前，先在星球级的在线多人环境中接受压力测试。Motion Matching（UE5.4 生产可用）发布前，已在
              Fortnite Battle Royale 全平台、100+ 角色加 NPC 场景中验证。这一循环交付了竞争者若没有可比 live-service 产品便难以自然匹配的质量底线。

              网络飞轮：约 1 billion EOS 玩家、295M+ EGS 用户和 800M+ Fortnite 账号，创造了跨平台价值，让 Epic 基础设施更有粘性。采用 EOS 的开发者零成本获得 Epic
              玩家图谱；EGS 独占把营销触达接入既有用户基础；UEFN 直接建立在 Fortnite 受众之上。

              关键平台依赖和风险集中点：（1）Apple 和 Google 移动端平台依赖——尽管取得里程碑式法律胜利，Epic 的 Fortnite 移动端变现（2026 年 3 月 19 日重返 Google
              Play；截至 2026 年 5 月美国 iOS 回归仍待定）仍面临持续的 Apple 上诉风险。（2）Tencent 约 28% 股权让 Epic
              在单一外国股东上形成战略依赖，并约束其地缘政治定位。（3）UEFN 发现算法集中：创作者收入高度依赖 Fortnite 算法偏好，给 20,000+ 活跃创作者带来经济脆弱性。（4）EGS 目录深度仍低于
              Steam（按二手报告，EGS 约 70K、Steam 约 100K+ 款游戏），限制了 EGS 对优先看重目录广度的 PC 玩家成为首选商店的吸引力。

              产品弱点：UE5 的 shader 编译和遍历卡顿问题，在开发者社区仍是声誉负担，尤其是面向 PC 上线的工作室，用户硬件差异很大。UEFN 仅限 Windows，限制了创作者可及性。EGS 缺少多项成熟
              Steam 功能——社区评论、Workshop mod 支持、社区中心——会影响消费者偏好。EGS 盈利能力未经确认。Fab 2024 年 10 月才上线，截至报告日仍处早期，没有公开 GMV 或卖家指标。
