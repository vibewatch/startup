      - number: '6.4'
        title: 使用 Unreal Engine 的企业、影视、建筑和政府客户
        blocks:
          - type: paragraph
            body: >
              Unreal Engine 在游戏之外的采用，是一个战略上不同的客户群，经济性、买方类型和切换动态都不同。电影和电视领域用 UE 做 LED volume 虚拟制作——大型 LED 墙实时渲染 3D
              背景，并随摄像机运动响应，替代传统绿幕抠像。Industrial Light & Magic 与 Epic 为 The Mandalorian 共同开发 StageCraft
              技术，该剧因视觉质量和效率获得好评；随后 Westworld（Season 3）和 Fallout（2024）也采用这一方法。截至 2022 年 10 月，Epic 与全球运营超过 300
              个虚拟制作片场的团队合作，说明这项技术已具备相当的生产规模。UE 在 2020 年获得 Primetime Engineering Emmy Award，以表彰其对广播技术的卓越贡献；这种行业验证会强化企业销售。

              政府与国防领域，Epic 与 Virtual Heroes（Applied Research Associates）建立 Unreal Government Network 合作，负责政府机构的 UE
              授权。具名用户包括 U.S. Army（麻醉学培训软件）、FBI Academy（多人犯罪现场模拟）和 DHS Science and Technology Directorate（EDGE
              急救人员培训平台）。这些是生产部署，不是试点。

              建筑、工程与施工（AEC）客户用 UE 做 3D 可视化、实时漫游和设计评审。BMW、Ford、Porsche 等汽车客户用 UE 做车辆配置可视化和数字展厅应用。Epic 的 MegaGrants 计划支持在
              UE5 或 UEFN 上构建工具和项目的创作者，把教育机构、研究组织和新兴工作室纳入长期生态参与者。企业细分收入未公开披露；企业交易采用定制授权安排，不走标准 5% 版税模式。
            claimRefs:
              - CU024
