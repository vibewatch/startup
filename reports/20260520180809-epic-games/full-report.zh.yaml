      - number: '4.2'
        title: 成本结构、资本强度与效率动作
        blocks:
          - type: paragraph
            body: >
              Epic 的成本底座反映了它不寻常的组合：它同时是消费者游戏发行商、平台运营商、引擎授权方和市场策展方。已披露的两项最大成本动作都是结构性信号：2023 年 9 月，Epic 裁员约 870 人（约占当时员工总数
              16%，包括北卡罗来纳 Triangle 地区约 170 名员工），理由之一是打造 metaverse 风格体验成本过高。2026 年 3 月，Epic 进行第二轮裁员，人数超过 1,000
              人，并宣布年度成本节省目标为 $500 million，剩余员工约 4,000 人。同时，Epic 提到 Fortnite 参与度自 2025 年开始下滑是裁员动因之一，说明收入压力叠加了成本压力。

              EGS 的成本结构天然不利：12% 抽成扣除 CDN 交付、客服和支付处理后，留下的毛利空间有限（Apple 法庭文件估计，EGS 在扣除这些成本后实际利润率约 5%，处在其声称的盈利路径上）。2025 年 6
              月推出的每产品首 $1M 免抽成，进一步压缩成长型游戏近期 EGS 经济性。Creator Economy 2.0 支付（按 Digiday 为归属岛屿参与收入的 40%）又增加了一层与 Fortnite
              收入表现挂钩的可变成本；岛屿参与度增长时，支付结构具备杠杆效应。

              UE5 的 EGS 免版税分发激励带来一项隐性成本：每一款 EGS 独占游戏，只要其收入超过 $1M、原本会支付 5% UE5 版税，就代表放弃的版税收入。这项交叉补贴支持 EGS 获取目录，但压低了 UE5
              单款游戏版税收入。$520M FTC 和解现金支付（2022 年 12 月）是一项一次性支出；持续禁止暗黑模式和新增同意要求会增加合规成本，但公开来源没有单独量化。Epic 没有公开任何官方毛利率、营业利润或
              EBITDA 数据。
