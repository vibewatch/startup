            body: >-
              2025 年 4 月 Apple 藐视法庭裁决（外部购买链接交易 0% 佣金；Apple 支付 Epic 律师费）和 2026 年 3 月 Google 和解（最高 20% 混合费率，相比此前
              30%）合在一起，为 Epic 移动端 P&L 带来持久改善——前提是它们经得住上诉。Apple 正在上诉 2025 年裁决，给 iOS 侧带来二元风险。Google 和解条款已最终确定。对于拥有
              Fortnite 这种移动端收入基础的游戏，移动交易佣金率哪怕改善 10 个百分点，也可能增加数亿美元年度净收入，是 Epic 近期历史上最重要的正向财务进展。
