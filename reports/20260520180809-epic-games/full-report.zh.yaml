              Roblox 2024 年向创作者支付 $923M，接近 UEFN 估计首年支付 $320M 的三倍。Roblox 拥有 85.3M DAU 和数百万活跃创作者，相比之下 UEFN 有 20,000+
              名已发布岛屿的创作者。虽然 UEFN 的质量上限更高（完整 UE5 工具集 vs Roblox Studio/Lua），但创作者经济平台通常靠广度和收入可预测性取胜。Roblox 2024 年预订收入指引为
              $5.2-5.3B，意味着收入会继续增长，并进一步扩大其创作者支付池。
