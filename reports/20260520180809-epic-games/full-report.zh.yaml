      - number: '5.4'
        title: Epic Online Services、MetaHuman 与 Fab 市场
        blocks:
          - type: paragraph
            body: >
              Epic Online Services（EOS）是 Epic 面向多人游戏开发的免费跨平台后端服务套件。EOS 不绑定游戏引擎，独立于 Unreal Engine 运行，提供 C 和 C# SDK，并集成
              Unity、Unreal Engine 和自定义引擎。EOS 将服务分为四组：Accounts and Social（Epic Account Services，需要 Epic Games
              账号）、Multiplayer（Game Services，不需要 Epic 账号）、Player and Game Data（Game Services），以及 Trust and Safety（Game
              Services）。

              Accounts and Social 服务接入近 1 billion 玩家规模的 Epic Games 账号生态，支持跨平台联机、好友列表、状态信息和 Social Overlay UI。Multiplayer
              服务包括点对点（P2P）、会话、大厅、匹配、NAT 穿透、语音聊天和反作弊。Game Services 接受来自多个身份提供方的玩家认证，包括
              Steam、Google、Amazon、PlayStation、Xbox、Nintendo 和 Epic 账号，从而实现真正的平台无关后端集成。Player and Game Data
              服务覆盖云存档、成就、排行榜、统计和 title storage。Trust and Safety 组包括 EOS Anti-Cheat 和 Kids Web Services（KWS）集成。

              Kids Web Services（KWS）最初由伦敦初创公司 SuperAwesome 开发（Epic 于 2020 年收购），是一套家长同意管理和年龄验证工具包。2024 年 1 月 SuperAwesome
              通过管理层收购拆分出去时，Epic 保留了 KWS。2025 年 7 月，Bluesky 开始要求英国用户为某些功能注册 KWS，以满足 UK Online Safety Act 2023 要求，KWS
              因此获得显著第三方采用。KWS 是一个规模不大但增长中的收入邻近资产：非游戏平台注册它，说明 Epic 信任基础设施的适用范围在扩张。

              MetaHuman 是 Epic 基于云的角色创作框架，用于制作高保真、全绑定数字人。该技术由三项收购拼成——3Lateral（角色扫描 / 绑定）、Cubic Motion（面部表演捕捉）和
              Quixel（摄影测量资产）。MetaHuman Creator 让开发者能从预设或现有网格（“Mesh to MetaHuman”）出发，在数分钟内创建照片级数字人。MetaHuman Animator
              支持从演员表演生成实时和离线面部动画，包括 UE5.5 引入的音频转动画推理能力。MetaHuman 兼容 UEFN（2024 年 3 月加入支持）、兼容 Fab 以共享
              MetaHumans，并可从移动端部署到主机端。MetaHuman 5.7（2025 年 12 月）带来主要身体贴合改进，取消 A-pose 要求，解除身高限制，并支持 FBX 往返。MetaHuman 5.8
              Preview 于 2026 年 5 月发布。

              Fab 是 Epic 的统一数字资产市场，2024 年 10 月 22 日上线，将 Sketchfab、ArtStation Marketplace、Quixel Megascans 和旧版 Unreal
              Engine Marketplace 整合为一个平台。Fab 被描述为“工具无关”，向所有引擎的内容开放，不只服务 Unreal Engine。截至 UE5.5（2024 年 11 月），Fab 已集成进
              Unreal Engine 编辑器，可将单个 Quixel Megascans 资产直接拖放导入场景。Fab 对卖家采用 88%/12% 收入分成，与 EGS 开发者条款一致。
