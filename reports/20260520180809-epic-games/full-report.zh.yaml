  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点存在，但当前盈利能力仍不透明
        blocks:
          - type: paragraph
            body: >-
              Epic 不是完全缺少估值证据；问题在于旧估值锚点与当前经营披露错位。2022 年 Sony/KIRKBI 轮投后估值 $31.5 billion，是已确认锚点；Disney 2024 年 $1.5
              billion 投资是第二个重要定价事件。但 Disney 和 Epic 未公开披露投后估值，外部只能从暗示较低估值的二级报道中三角测算。也就是说，公开市场能看到 Epic 曾经至少值 $31.5
              billion，且 2024 年可能被下调重估；但今天支撑任一数字的当前利润表仍看不到。


              在业务稳定时，这种不透明还没那么致命；现在它更重要。Epic 2026 年裁员和 $500 million 节约目标，是公司仍在围绕弱化的 Fortnite 参与度重置成本结构的硬证据。Epic
              的公开收入估计停在 2022 年，Fortnite
              估计也只能通过第三方来源间接延伸。投资者面对的是典型后期私营公司问题：估值标题可见，支撑这些标题的底层盈利能力不可见。任何公允价值判断都必须先折价这个披露缺口，而不是假装它不存在。
