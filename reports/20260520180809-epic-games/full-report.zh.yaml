      - number: '5.2'
        title: Unreal Engine 5 能力与发布节奏
        blocks:
          - type: paragraph
            body: >
              Unreal Engine 5（UE5）是 Epic 旗舰 3D 创作工具的当前一代，于 2022 年 4 月 5 日首次面向开发者发布（版本 5.0），最新稳定版为 2025 年 11 月 12 日的
              UE5.7。UE5 使用 C++ 编写，源代码可在 GitHub 上获取，但仅向注册 Epic 开发者开放。该引擎支持 Windows、Linux、macOS、PlayStation 4/5、Xbox
              One、Xbox Series X/S、Nintendo Switch、Nintendo Switch 2、iOS 和 Android。商业使用遵循版税模型：开发者对每个产品超过 $1 million
              的总收入支付 5%；若产品完全通过 Epic Games Store 使用 Epic 支付系统分发，则版税全免。

              UE5 的核心技术差异点包括：

              Nanite——虚拟化微多边形几何系统，可自动管理复杂网格的细节层级，让团队能够使用电影级摄影测量资产、ZBrush 雕刻和 CAD 模型，而无需手动优化。Nanite 消除了美术手工制作多个 LOD
              版本的需求，大幅降低内容生产时间和成本。Nanite 管线在 UE5.4（2024 年 4 月）加入实验性曲面细分，并在 UE5.7 中开始以实验功能支持动画几何（“Nanite Skinning”）。

              Lumen——动态全局光照与反射系统，可实时响应场景和光照变化。Lumen 消除了预计算 lightmaps 的需求。它同时支持软件光线追踪（Mesh Distance
              Fields，为广泛设备范围优化）和硬件光线追踪（精度更高，支持蒙皮网格）。UE5.5（2024 年 11 月）中，硬件光线追踪 Lumen 在具备硬件支持的主机上获得 60 Hz 支持。

              Virtual Shadow Maps——一种新的阴影贴图方法，可为电影级资产和大型动态照明开放世界提供一致的高分辨率阴影，避免传统阴影贴图常见的阴影级联和弹出伪影。

              其他生产系统包括：Chaos 物理引擎（取代 PhysX）、Niagara 粒子 / 流体动力学系统、Substrate 材质创作框架（UE5.7 生产可用）、World
              Partition（大型开放世界流式加载）、Pixel Streaming 2（基于 WebRTC 的云串流，随 UE5.5+ 发布）、Neural Network Engine（UE5.4
              beta）、Movie Render Graph（UE5.5 beta），以及 Unreal Build Accelerator（UBA），用于加快 C++ 和 shader 编译（UE5.4
              beta，UE5.5 生产可用）。MegaLights——可在无约束条件下支持数百个动态投射阴影的灯光——在 UE5.7 从实验阶段进入 beta。

              发布节奏：Epic 大致维持每年两个 UE5 大版本发布，从 5.0（2022 年 4 月）推进到 5.1、5.2、5.3、5.4（2024 年 4 月）、5.5（2024 年 11 月）、5.6 和
              5.7（2025 年 11 月）。这种节奏带来定期能力升级，也给依赖旧功能的工作室引入回归风险。Tim Sweeney 在 2025 年 Lex Fridman 播客访谈中谈到 Unreal Engine
              6，表示首批预览版本会在两到三年内可用，并且 UE6 将力图统一 Fortnite 所用开发流与更广泛引擎开发流。

              已知技术弱点：UE5 因 shader 编译卡顿——新内容首次加载时的帧时间跳变——和遍历卡顿受到广泛批评。Epic 已承认问题并开发新的预编译识别系统，但截至报告日，该问题在规模化场景下仍未解决。默认启用的
              temporal anti-aliasing 可能带来运动模糊伪影。这些问题出现在 Black Myth: Wukong 等多款主要 UE5 游戏中，在开发者社区造成声誉风险。
