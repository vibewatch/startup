  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >
              Epic Games 横跨四条商业变现支柱，每条都有不同的单位经济和风险结构。Fortnite Battle Royale 占绝对主导：BusinessOfApps 估计，Fortnite 2023 年收入约
              $3.5 billion，低于 2018 年 $5.4 billion 和 2019 年 $3.6 billion 的峰值。仅截至 2019 年 12 月，游戏累计生命周期收入就达到 $9
              billion。Fortnite 通过三种机制变现——V-Bucks 虚拟货币（用于装扮和 Battle Pass）、Fortnite Crew 订阅（$11.99/月；包含 Battle Pass 和每月
              V-Bucks），以及来自 Marvel、Disney、Star Wars 等 IP 合作方的角色 / 装扮授权。2026 年 3 月，Epic 将 V-Bucks 价格上调约 20%（800 V-Bucks
              现在为 $10，此前约为 1,000 V-Bucks 售 $8.99），这是 Fortnite 上线以来首次显著调价。此次涨价与一项公告同步：Fortnite Save the World——最初的付费 PvE
              模式——将在 2026 年 4 月转为免费游玩，用前置购买收入换取参与度和装扮消费。

              UEFN Creator Economy（2023 年 3 月随 UEFN 上线）在 beta 运营第一年向超过 20,000 名创作者支付估计 $320 million，据 Epic 在 GDC 2024
              披露、Wikipedia 的 UEFN 条目引用。根据 Digiday 报道，创作者获得归属于其岛屿的参与收入的 40%，由此产生一项与 Fortnite 收入基础直接挂钩的持续支付义务。

              Epic Games Store（EGS）向开发者提供 88%/12% 的收入分成，并对每个产品每年首 $1 million 收入实行 0% 抽成（2025 年 6 月推出）。到 2025 年，EGS 注册
              PC/Mac 用户增至 295 million。不过，2019–2020 年 EGS 处于重大亏损状态（按 Apple 法庭文件证词约 $400 million），Apple 自己的分析预计 EGS 要到
              2027 年才会盈利。Unreal Engine 5（UE5）对每个产品超过 $1 million 的总收入收取 5% 版税；若游戏完全通过 EGS 分发，则全额豁免；此外还有企业和云授权费用。Fab
              市场（前身为 Unreal Engine Marketplace，2024 年 10 月 22 日重新上线为统一平台，合并 Sketchfab、ArtStation Marketplace、Quixel 和 UE
              Marketplace 资产）让 Epic 从开发者资产销售中抽成。
