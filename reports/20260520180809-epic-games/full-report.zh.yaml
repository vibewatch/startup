      - number: '4.5'
        title: 财务尽调评估与证据缺口
        blocks:
          - type: paragraph
            body: >
              Epic 的财务画像显示，公司正处在关键拐点。收入一旦存在，质量很高——Fortnite 的 V-Bucks 模式从 650+ million
              注册玩家基础上产生高频、重复的微交易收入——但收入集中在单一游戏（估计约 80% 收入来自 Fortnite）是结构性风险，尤其是公司自己承认 Fortnite 参与度 2025 年下滑，并部分促成 2026 年
              3 月裁员。V-Bucks 涨价、同步成本节省计划和裁员共同指向一个有意的转向：从增长投入转为利润纪律。尽调记录支持把它看作峰值收入之后的运营回应。

              Apple 和 Google 的法律胜利显著改善长期财务模型：若 Apple 上诉失败，通过外部支付链接引导 iOS 购买，会在这些交易上完全消除佣金。Google 和解给 Epic 带来的低于 20%
              混合费率，相比此前 30% 是永久性结构改善。两项结果都扩大了 Epic 移动端可分得收入的 TAM。

              主要尽调缺口在于，没有任何经验证的毛利率、EBITDA 或现金数据。Epic 从未发布审计财务报表。所有收入估计均来自第三方（BusinessOfApps、Forbes、The Information），且最新
              Fortnite 收入估计（2023 年）相对报告日已接近 3 年。$31.5 billion 估值锚点（2022 年 4 月）已有 4 年；隐含 $22.5 billion（2024
              年）未经确认。这种不透明使财务承销必须依赖 Epic 在尽调流程中披露 P&L、资产负债表和现金流数据，或基于保守第三方收入估计建模，并设置很宽的不确定区间。
            claimRefs:
