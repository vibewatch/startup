  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Fortnite 平台与 UEFN 创作者生态
        blocks:
          - type: paragraph
            body: >
              Fortnite 是 Epic 的核心消费者产品，也是最重要的技术试验场。截至 2026 年初，该游戏累计注册账号超过 800 million，按用户数看是全球最大的消费者游戏平台之一。Epic 于 2021 年
              12 月将 Fortnite 从 Unreal Engine 4 迁移到 Unreal Engine 5，早于 UE5 在 2022 年 4
              月公开发布数月，用这款游戏在生产规模和实时多人环境下验证渲染管线变化。Fortnite 既是在线产品，又是内部工程基准，这种双重用途构成结构性优势：Epic 内部团队把 UE5 功能直接发到一款拥有 100+
              million 并发玩家的游戏里，产出经实战检验的生产代码，再由外部工作室采用。

              Unreal Editor for Fortnite（UEFN）于 2023 年 3 月上线，是 Unreal Engine 为 Fortnite 内用户生成内容定制的专用版本。UEFN 代表了相对前代
              Fortnite Creative（Creative 1.0）的基础架构转变：它向创作者开放接近完整的 Unreal Engine 编辑器界面，引入 Verse 编程语言（Epic
              为交互式体验专门打造的脚本语言），并支持通过 Unreal Revision Control 协作。UEFN 仅在 Windows 上运行。值得注意的是，Epic 选择不纳入 Unreal Engine 标配的
              Blueprints 可视化脚本，而以 Verse 取代，形成开发者必须从零学习的新脚本范式。

              UEFN Creator Economy 在 beta 阶段第一年（2023–2024）向超过 20,000 名已发布体验的创作者支付估计 $320 million，据 Epic GDC 2024
              披露、Wikipedia 的 UEFN 条目引用。创作者获得归属于其岛屿参与收入的 40%，Epic 保留约 60%。该模式与 Roblox 创作者经济高度相似，使 Fortnite
              成为一个争夺创作者心智的用户生成内容平台。生态包括用于持续参与收入的 Island Creator program，以及 Support-A-Creator 联盟计划。

              Fortnite 平台积极扩展授权内容。LEGO 资产和 MetaHuman 角色支持于 2024 年 3 月 20 日加入 UEFN。Fall Guys 资产随后在 2024 年 7 月加入。Star Wars
              资产于 2026 年 3 月加入，并在 2026 年 5 月 1 日前支持发布。这套 IP 授权策略加深了 Fortnite 的文化相关性，同时在 UEFN 生态中创造重复开发机会。

              关键反向备注：UEFN 的 Discovery 算法——控制哪些创作者岛屿获得玩家流量的推荐系统——不透明。Epic 称其会权衡总点击、参与度、玩家留存和 V-Bucks
              支出，但没有披露确切公式。Discover 页面显示并发用户（CCU）数量引发社区反弹，小创作者指称算法偏向高 CCU 体验。UEFN beta 早期就出现 IP 和 DMCA
              问题，因为自定义内容导入功能允许侵权资产进入；Epic 通过内容政策处理了这个问题，但开放创作者平台上的审核失灵风险仍然结构性偏高。
