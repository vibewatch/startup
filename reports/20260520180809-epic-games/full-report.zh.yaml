      - number: '1.6'
        title: 展项
        blocks:
          - type: callout
            title: 难以匹敌的平台规模与开发者生态锁定
            body: >-
              Fortnite 的 800M+ 注册账户、Unreal Engine 在游戏和电影领域的行业领先市场地位，以及 Epic Games Store
              低于市场的收入分成，共同形成会自我强化的生态优势，任何单一竞争对手都很难复制。Disney 和 Sony 的战略投资进一步把 Epic 锚定为游戏、娱乐和开发者工具的交汇点。
            calloutType: strength
            claimRefs:
              - CO008
              - CO024
              - CO028
