      - number: '2.2'
        title: 全球电子游戏市场——规模、走势与 Epic 位置
        blocks:
          - type: paragraph
            body: >
              按软件 / 服务口径，全球电子游戏市场已从 2018 约 $134.9 billion 增长到 2024-2025 估计 $183-200B 区间，具体取决于方法。Newzoo 的 PC and Console
              Gaming Report 2026 将 2025 描述为「疫情以来行业收入首次出现明显增长的一年，同比增长 7%」，显示后疫情两年收缩后的复苏周期。关键在于，Newzoo
              指出这轮增长如今由「变现效率、定价策略和平台经济驱动，而不是玩家时间扩张」——这是结构性变化，有利于 Fortnite 这样的根深蒂固 live-service IP，而不是新进入者。


              Statista 更宽市场指标——2025 约 $522.5 billion，含硬件和配件——覆盖更宽价值链，但方法上不可与 Newzoo 的软件中心数字比较。仅移动游戏市场在 Statista 更宽口径中估计约
              $126 billion，凸显移动端占比之大。这对 Epic 很重要，因为移动端仍是 Epic 直接变现受限最严重的平台（见下文对抗性约束）。


              在公开披露的游戏公司中，Newzoo 截至 Q3 2025 的 top-25 排名显示 Tencent 以 $30.2B YTD 收入领先，其后是 Microsoft（$15.9B）和
              Sony（$15.6B）。Epic 是私营公司，不在公开排名内，但其估计 $5-6B 年收入（基于 2022 分析师估计和 FTC 和解披露）若作为独立上市实体，足以进入前 10。Fortnite 到 2019
              年底公开确认超过 $9B 总收入，为历史锚点；但更新近数字未公开披露。


              游戏市场呈现高集中度：Fortnite、Genshin Impact、Roblox 等免费游玩 live-service 游戏占据了不成比例的玩家时间和游戏内支出。Statista
              指出，随着玩家更深投入现有游戏、而非尝试新作，「游戏工作室变得更厌恶风险」；这强化了 Fortnite 作为持久收入护城河的位置，也解释了为什么 Epic 的 2023-2026 裁员周期与 Fortnite
              参与度从历史峰值回落同时发生。
