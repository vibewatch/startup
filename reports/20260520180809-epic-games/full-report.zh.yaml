      - number: '1.4'
        title: 产品组合与市场地位
        blocks:
          - type: paragraph
            body: >
              Fortnite 是 Epic 旗舰消费产品，也是主要收入驱动。它在 2017 作为带合作生存模式的付费抢先体验游戏上线；Fortnite Battle Royale 于 September 2017
              以免费游玩模式推出，并迅速成为文化现象，第一年即触达 125 million 玩家。该游戏截至 December 2019 产生估计 $9 billion 总收入，此后扩展为多模式平台，涵盖 Battle
              Royale、Lego Fortnite、Rocket Racing、Fortnite Festival 和 Fortnite Creative。截至 2026，Epic 报告 Fortnite 注册账户超过
              800 million。游戏通过 V-Bucks 变现；这是用于购买外观和 battle pass 的游戏内货币。Epic 在 March 2026 将 V-Bucks 价格上调约
              20%，理由是运营成本上升；公司也曾在 2023 将 V-Buck 价格上调约 12.5%。

              Unreal Engine 是 Epic 面向开发者的技术平台，可追溯到 Tim Sweeney 于 1995 构建的原始引擎。当前代际 Unreal Engine 5（截至报告日稳定版 5.7）于 April
              2022 正式发布。UE5 包含 Nanite（虚拟化几何系统）和 Lumen（动态全局光照），相较前几代引擎显著提升画面保真度。引擎采用版税模式授权：每个产品总收入超过 $1 million 的部分收取
              5%，若游戏仅在 Epic Games Store 独家发行则免收版税。Unreal Engine 用于游戏、电影 / 电视、汽车、建筑可视化和现场活动，使 Epic 获得游戏之外的实质跨行业触达。

              Epic Games Store 于 2018 推出，故意采用低于行业标准的收入分成：开发者拿 88%，平台拿 12%（相较 Steam 70-75%/30-25% 模式），且开发者每个产品前 $1M 年净收入拿
              100%。该商店覆盖 187 个国家、16 种语言，用户超过 295 million，并支持 80+ 种支付方式。Epic Online
              Services（EOS）是一组模块化后端服务（匹配、反作弊、成就、好友、商业），设计目标是在不同平台、商店和发行商之间跨平台运行。
