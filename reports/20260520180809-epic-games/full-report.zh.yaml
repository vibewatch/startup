      - number: '2.8'
        title: 展项
        blocks:
          - type: callout
            title: 移动端守门仍是最大市场约束
            body: >-
              Epic 的 iOS 收入从 August 2020（Fortnite 下架）到 May 2025（US 回归）在结构上被清零，且地理覆盖仍不完整（截至 May 2026，Australia 被排除）。Apple
              对 April 2025 裁定的上诉引入多年上诉不确定性。尽管 Epic 已与 Google 和解，Google Play Store 对大多数 Android 开发者仍保留 30% 费用；Fortnite 的
              Android 存在依赖 Samsung 的 Galaxy Store 和 Epic 自有侧载路径——明显窄于完整恢复 Google Play。按 Statista，移动游戏约占更宽游戏市场 $126B；Epic
              直接参与这一市场的能力仍被部分阻断，相比 Fortnite 玩家在移动端实际花费时间的位置，可触达收入受到限制。
            calloutType: risk
            claimRefs:
              - CM041
              - CM042
              - CM043
          - type: callout
            title: Newzoo 结构性转向利好 Fortnite，但限制新 IP 选择权
            body: >-
              Newzoo 2026 报告明确表示，游戏增长如今由「变现效率、定价策略和平台经济驱动，而不是玩家时间扩张」。这对 Fortnite 这个深度嵌入的 live-service IP 是利好信号，但对 Epic
              可能推出的任何新 IP 都是显著逆风。新游戏必须争夺固定——或缓慢增长——的玩家注意力池；这个池子由 Fortnite 自身、Roblox（85.3M DAU）、Minecraft
              和少数其他持久平台主导。Epic 裁员可能部分反映了这一结构性认识：守住 Fortnite 位置需要资本，但在注意力停滞的市场中推出新的竞争平台，成本高且回报不确定。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM033
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: UGC 与 live-service 平台竞争——Roblox、Minecraft 和 UEFN
        blocks:
          - type: paragraph
            body: >
              Epic 最直接的 live-service 和 UGC 竞争对手是 Roblox Corporation，一家上市平台（NYSE: RBLX），承载数百万款用 Roblox Studio
              构建的用户创作游戏；Roblox Studio 是自研低代码游戏创作环境。Roblox 报告 Q4 2024 平均日活用户 85.3 million（同比增长 19%），full-year 2024 收入
              $3,602 million（同比增长 29%），并通过 Developer Exchange（DevEx）计划在 2024 向创作者支付 $923 million。Roblox 在 2024 的 73.5
              billion 小时参与度构成玩家时间护城河；Fortnite 报告的 2025 参与度下滑让这一点在竞争上更重要。按活跃创作者数量看，Roblox 创作者经济结构性更大：到 2020，Roblox 报告超过 2
              million 开发者使用 Roblox Studio；鉴于 UEFN 要求专业级工具能力，这一基数是 UEFN 在绝对规模上无法匹配的。Roblox 在 13 岁以下用户中的人口结构优势（据报道覆盖美国 16
              岁以下儿童的一半）给了它可有机复利的获客管线；相比之下，Fortnite 核心用户更广但也在老化（BusinessOfApps 估计 Fortnite 玩家 60%+ 位于 18-24 岁段）。

              Roblox Q1 2026 业绩于 April 30, 2026 发布，但新闻稿只是落地页引用；详细财务项目位于 ir.roblox.com 的股东信，而不是新闻稿。随 Q4 2024 业绩发布的
              full-year 2025 指引为收入 $4,245-$4,345 million、bookings $5,200-$5,300 million，意味着仍有 18%+ 增长。按这一轨迹，2025 年
              Roblox 与 Epic 估计 Fortnite 收入（BusinessOfApps 对 2023 估计 $3.5B）的收入差距会进一步拉大。Roblox 也有结构性劣势：2024 净亏损 $940.6
              million，GAAP 层面仍未盈利，不过自由现金流显著改善至 $641.3 million。

              Minecraft（Mojang 开发、Microsoft 所有）是第二个重要 UGC 和沙盒竞争对手。截至 2025，Minecraft 销量超过 350 million 份，是史上最畅销电子游戏。其
              Marketplace 生态（Bedrock Edition）允许创作者制作的内容包、地图和皮肤通过收入分成模式销售。Minecraft 用户更年轻，主要是休闲沙盒玩家，而非竞技 battle-royale
              玩家；因此它更像 UEFN / Fortnite Creative 建造模式的竞争对手，而不是 Fortnite Battle Royale 射击模式的竞争对手。Microsoft 收购 Activision
              Blizzard（October 2023 完成）后，将 Call of Duty、Overwatch 和 Diablo 纳入 live-service 组合，在 Game Pass 周围形成更广娱乐生态，与
              Fortnite 订阅产品（Fortnite Crew，$11.99/month）竞争。

              UEFN 相对 Roblox Studio 的竞争差异在于专业工具质量：UEFN 提供完整 UE5 创作工具、C++ 脚本和 AAA 级资产管线，可支持主机和 PC 质量体验。Roblox Studio
              使用更简单的 Lua 脚本环境，对休闲创作者更友好，但会限制可能体验的技术上限。不过，可触达创作者池与工具复杂度反向相关：Roblox 的简单性带来规模，UEFN 的复杂性吸引质量。Epic 在 UEFN
              计划第一年向创作者支付的 $320 million（据 Wikipedia UEFN 条目，引用 Epic GDC 2024 披露）显著低于 Roblox 2024 年 $923M
              创作者支付，代表持续存在的平台经济缺口，也强化了 Roblox 的创作者留存优势。
