            title: Godot 的 MIT 许可证形成结构性版税底线，约束 Epic 和 Unity
            body: >-
              Godot 的零成本、开源模式短期内不是 Epic 的收入威胁——它缺少 AAA 渲染能力和主机支持。但它锚定了市场价格底线，让 Unity 或 Epic
              未来任何提高版税的动作，都要在开发者社区付出政治成本。Unity Runtime Fee 事件证明，开发者迁移到 Godot 的速度可以很快加速。Epic 必须保留 EGS
              免版税选项，作为抵御这种结构性压力的防线。
