      - number: '7.2'
        title: 平台、监管和地缘政治风险仍是二元变量
        blocks:
          - type: paragraph
            body: >-
              Epic 的平台暴露仍结构性二元。Apple 藐视法庭裁定改善了外部支付相关法律位置，但 Apple 立即表示会上诉，Epic 仍取决于法院和监管机构未来如何执行反引导规则。2026 年 Google
              和解降低了移动市场一侧的摩擦，却也凸显更深问题：Epic 的移动经济性依赖政策、禁令和看门人让步，而这些都不由 Epic 控制。即使监管帮助
              Epic，也会创造新的依赖：监管者要持续施压，平台也要及时、无规避地执行。


              FTC 案卷显示另一种监管风险：它不再停留在头条诉讼里，却仍影响实时运营模型。Epic 已支付 $520 million 解决 COPPA 和暗黑模式指控，退款计划在 2025 年继续向用户打款，2026
              年预计还有更多款项。也就是说，消费者保护风险是当前风险，不是历史风险。Tencent 增加了地缘政治层。美国机构在 2025 年初将 Tencent 列入 DoD 中国军事企业名单，法律评论现在指向 2026 年
              6 月对被列实体的具体采购后果。Epic 不是 Tencent，但一个大型战略股东暴露在升级的中美审查之下，对任何承销未来流动性的投资者来说，仍是治理和退出复杂性风险。
