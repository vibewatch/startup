      - number: '3.2'
        title: 游戏引擎竞争——Unity、Godot 和自研引擎对 Unreal Engine
        blocks:
          - type: paragraph
            body: >
              Unity Technologies（NYSE: U）是 Unreal Engine 在游戏开发工具中的主要商业竞争对手。截至 2026，Unity 定价模式包括免费 Personal
              档（面向爱好者和小团队；限游戏与娱乐应用）、Pro 档每席 $210/month（收入或融资超过 $200K 的工作室必须使用），以及面向年收入超过 $25M 工作室的定制价 Enterprise 档。Unity
              Pro 公布的年成本为 $2,310/year。相比之下，Unreal Engine 5 可免费使用，但对每个产品超过 $1 million 的总收入收取 5% 版税（通过 Epic Games Store
              发行的游戏免收）。这种版税结构让 UE5 对小工作室进入成本更低，但成功商业发行后单游戏成本高于 Unity 订阅模式。

              Unity 按开发者数量看占据主导：Unity 自身披露显示，前 1,000 名移动游戏中超过 70% 使用 Unity 制作（截至 Q4 2022，unity.com/games 引用 Apptopia
              数据），下载量前 100 名游戏中有 82 款使用 Unity。Unity 在移动开发中的安装基数优势来自它在易用移动工具上的先发位置（2008 增加 iPhone 支持）以及强 2D
              工具管线。相比之下，Unreal Engine 主导高保真主机和 PC AAA 开发，并在非游戏企业垂直领域（汽车、电影 / 电视虚拟制作）有显著渗透。

              Unity 在 September 2023 遭遇严重可信度危机：它宣布 Runtime Fee，游戏跨过收入和安装门槛后按安装量收费。该政策遭开发者社区广泛谴责，引发 Unity
              项目大规模取消和开发者转向替代方案。Unity 于 September 2024 撤销 Runtime Fee，改为提高订阅价格并调整版税结构。这一事件——见 Unity 官方博客文章 “Unity is
              Canceling the Runtime Fee”——实质损害了 Unity 声誉，尤其是在独立开发者中，并加速迁移到 Godot Engine 和 Unreal Engine 5。

              Godot Engine 是一款采用 MIT License 发布的开源游戏引擎，不收版税，也无订阅费。Godot 于 2014 首次公开发布；Godot 4.0（2023）增加了显著 3D 改进，包括
              Vulkan 渲染。截至 April 2026，最新稳定版为 Godot 4.6.2。Godot 缺乏 UE5
              的高保真渲染能力和企业支持基础设施，但零成本模式和开源治理让它对成本敏感的独立开发者有结构性吸引力。Unity runtime fee 争议显著加速 Godot 采用：该引擎 GitHub 仓库 star 数在
              September 2023 期间及之后快速增长。Godot 本身在 Epic Games Store 上分发（可免费下载），凸显 Godot 与 Epic 发行业务的非威胁关系；但它也代表着 Unity 订阅和
              Unreal 版税模式的结构性价格地板竞争者。

              大型发行商的自研引擎——id Tech（Bethesda/id Software）、Frostbite（EA）、Decima（Guerrilla Games/Sony）、RE
              Engine（Capcom）——更多是既有业务保护策略，而不是 Unreal Engine 的商业竞争威胁。这些引擎不对外授权，其创建者要么已经是 Unreal Engine
              客户，要么可能成为客户（Bethesda 新项目和许多 EA 工作室使用 Unreal）。游戏开发趋势是即便大型工作室也在跨平台项目中采用 Unreal；这验证了 Epic
              的商业引擎策略，但也意味着引擎收入增长要靠扩大支付版税的可触达基数，而不是替换自研引擎。
