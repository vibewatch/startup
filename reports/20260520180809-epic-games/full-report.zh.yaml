        - 新项目为低，已绑定系列为高——净效应：中
        - 跟踪 Unity 危机后 Godot 在已发布游戏中的市占率（2024-2026 独立游戏队列）
      - - Epic 作为平台挑战者的反垄断定位（Apple、Google、Valve）
