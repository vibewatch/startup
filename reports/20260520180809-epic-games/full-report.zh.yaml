  - id: FU001
    title: 客户旅程图 — Epic Games 客户细分与扩张循环
    type: journey-map
    description: 各主要客户细分从发现、采用、变现到扩张的路径，展示 Epic 生态如何形成跨细分强化和集中点。
    data:
      items:
        - label: 认知 — 消费者（Fortnite 玩家）
          note: 平台（主机商店、移动应用商店、YouTube/Twitch）、口碑传播；免费游玩让进入几乎零摩擦；大逃杀模式具备文化可见度
        - label: 首次游玩 — 消费者激活
          note: 下载 → 首场对局 → 教程 → 接触外观商店；限时物品商店推动 V-Bucks 购买；赛季开始时引入 Battle Pass
        - label: 变现 — V-Bucks、Battle Pass、Crew
          note: >-
            一次性购买 V-Bucks → 外观消费 → Battle Pass（等值 $8.99）；Fortnite Crew 转化（$11.99/月订阅）叠加 1,000 V-Bucks 和通行证捆绑；2026 年 3 月
            V-Bucks 提价（约涨 25%）→ 玩家反弹信号
        - label: 创作者发现 — 进入 UEFN 细分
          note: 重度玩家在 Discover 信息流发现 UGC 岛屿；40% 游玩时长来自 Creative 模式；部分玩家报名 Island Creator 计划，从玩家转为 UEFN 创作者
        - label: 创作者变现 — 40% 互动收入分成
          note: 发布岛屿 → Discover 算法分发 → 玩家流量 → 互动收入；第 1 年向 20,000+ 名创作者支付 $320M；收入高度集中在头部岛屿
        - label: 开发者发现 — 采用 UE5
          note: GDC、文档、YouTube 展示（Black Myth、Hellblade II 演示）；免费下载 UE5 → 评估 → 确定项目采用；EOS SDK 另行免费
        - label: 开发者变现 — 版税和 EGS 分发
          note: 收入超过 $1M 后收取 5% 版税；EGS 独占可豁免；EGS 按 88%/12% 分成；EOS 提供后端且不增加许可成本
        - label: 企业进入 — 游戏之外的 UE
          note: >-
            影视工作室通过 StageCraft/ILM 案例进入；AEC/汽车靠 MegaGrants 和直销切入；政府客户通过 Unreal Government Network（Applied Research
            Associates）接入；定制许可；2020 年 Emmy Award 提供行业背书
        - label: 扩张 — Disney / IP / 平台增长
          note: >-
            Disney $1.5B 股权投资（2024 年 2 月）；IP 授权（LEGO、Star Wars、Marvel）加深 Fortnite；EGS mobile（2024 年 8
            月）扩大发行商触达；撤离射击游戏在开发中
