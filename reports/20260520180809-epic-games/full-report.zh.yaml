            title: Unity 的 Runtime Fee 风波让 UE5 在 AAA 市场获得持久信任优势
            body: >-
              Unity 对 Runtime Fee 的反转（2023 年 9 月宣布，2024 年 9 月撤回）在专业和独立工作室中留下了持久信任缺口。Unity 6
              的技术改进尚未完全修复这道信用裂缝，尤其是在已经使用或评估 UE5 的 AAA 工作室中。Epic 对 EGS 独占游戏免版税的模式，以及 UE5 自 2022 年上线以来 EULA
              的稳定性，在专业层级构成持久信任优势。
