      - number: '4.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: Fortnite 单一游戏收入集中是最主要财务风险
            body: >-
              估计 Epic 80% 收入来自 Fortnite，而 Fortnite 本身在 2018 年以 $5.4 billion 见顶，并按 BusinessOfApps 在 2023 年降至约 $3.5
              billion。2026 年 3 月提价（V-Bucks 上线以来首次显著调整）和同步裁减 1,000 人、目标年节省 $500M 的行动，与一家应对收入水平压力、而非增长动能的公司相吻合。Epic 自己的
              2026 年裁员沟通提到 Fortnite 参与度自 2025 年开始下滑。没有官方收入数据，就无法确认提价是否扭转了趋势。
