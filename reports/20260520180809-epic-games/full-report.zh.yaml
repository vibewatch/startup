  - id: TV005
    title: 投资逻辑破裂与触发项表
    description: Practical triggers that would move the valuation range lower or justify a pass decision.
    columns:
      - 触发项
      - 阈值 / 事件
      - 为何重要
      - 行动含义
    rows:
      - - Fortnite 未能企稳
        - 没有企稳公开证据，且更多重要模式削减或变现压力出现
        - 核心盈利引擎可能比当前区间假设的结构更弱
        - 转向悲观情景估值，远离溢价入场定价
      - - 再次重大重组
        - 第三轮大规模裁员，或新的成本重置计划
        - 说明此前节流没有恢复可持续效率
        - 下调信心并压缩价值区间
      - - Apple 经济性反转
        - 上诉或合规结果实质性削弱外部支付收益
        - 削弱最清晰的移动端上行来源之一
        - 下调来自移动端利润率恢复的期权价值
      - - Disney 仍具战略意义但不产生财务贡献
        - 更多产品周期后仍未披露变现里程碑或经济性
        - 单靠期权价值无法支撑溢价估值
        - 基准情景中将 Disney 价值保持在接近零
      - - 披露缺口延续到融资事件
        - 仍没有当前审计财务、分部拆分或资本结构清晰度
        - 投资者是在为叙事付费，却没有可承销证据
        - 在透明度改善前，维持继续研究或直接放弃
    notes: 这些触发项用于尽调后的决策纪律，不是公募市场式交易信号。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV036
      - CV039
  - id: TV006
    title: 最终尽调请求表
    description: Highest-priority diligence requests needed to move from bracketed public valuation to investable fair value.
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 当前财务
        - 2025 和 2026 年收入、毛利率、EBITDA、自由现金流
        - 判断 Epic 是否企稳，还是仍在透支旧估值锚下的超额盈利
        - 索取经审计的月度和季度财务包
      - - 分部组合
        - Fortnite、Unreal、EGS、EOS 和其他业务的收入与利润率拆分
        - 只有拿到这些，才能把 Epic 估成一家不只是单一游戏公司的企业
        - 索取带历史趋势的分部桥接
      - - 资本结构
        - 现金、债务、优先股堆叠，以及 Disney 之后任何融资条款
        - 有了这些，才能把股权口径名义估值落到真实投资者经济性
        - 索取股权结构表、股东协议和债务明细
      - - Disney 经济性
        - Disney 宇宙的预算、里程碑计划、收入分成和 KPI 看板
        - 判断期权价值只是战略叙事，还是可变现资产
        - 索取合作协议摘要和产品路线图
      - - 商店经济性
        - EGS GMV、实际抽成率和经营贡献
        - 要证明商店独立价值为正，必须看到这些
        - 索取商店 P&L 和队列经济性
      - - Unreal 引擎经济性
        - 授权客户数、版税收入、企业客户组合和利润率画像
        - 支撑软件式估值溢价需要这些证据
        - 索取 Unreal 收入拆解和增长队列分析
    notes: 这些请求聚焦最可能改变估值的证据，而不是宽泛尽调清单。
    claimRefs:
      - CV036
      - CV040
      - CV041
      - CV042
figures:
  - id: FO001
    title: Epic Games 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Epic 的公开记录始于 1991 年的共享软件创业，之后扩展到平台级游戏、$5B+ 机构资本、标志性反垄断诉讼，并在 2026 年迎来第二波员工重组。
    data:
      items:
        - date: 1991
          label: 以 Potomac Computer Systems 名义创立
          detail: Tim Sweeney 创办共享软件游戏公司；后更名为 Epic MegaGames（1992）和 Epic Games（1999）。
          tone: positive
        - date: 1998
          label: Unreal Engine 1 发布
          detail: 后来成为全球使用最广泛的游戏引擎；这是它的首次商业发布。
          tone: positive
        - date: 2012
          label: Tencent 投资 $330M（约 40% 股权）
          detail: 首笔大型机构资本；到 2026 年，Tencent 仍是最大非创始人股东，持股约 28%。
          tone: positive
        - date: 2017
          label: Fortnite Battle Royale 以免费模式上线
          detail: 成为文化现象；一年内玩家达 125M；截至 2019 年累计总收入 $9B+。
          tone: positive
        - date: 2018
          label: Epic Games Store 上线
          detail: 88%/12% 的开发者收入分成挑战 Steam、Apple 和 Google 应用商店模式。
          tone: positive
        - date: 2021
          label: $1B 轮融资，估值 $28.7B；UE5 发布预告
          detail: Sony 领投；BlackRock、KKR 参投；Unreal Engine 5 预览版亮相。
          tone: positive
        - date: 2022-04
          label: $2B 轮融资，估值 $31.5B；UE5 发布
          detail: Sony（$1B）和 KIRKBI（$1B）共同领投；最后一次披露估值；UE5 正式发布。
          tone: positive
        - date: 2022-12
          label: $520M FTC 和解（COPPA + 暗黑模式）
          detail: FTC 史上最大 COPPA 罚款（$275M）；另有 $245M 消费者退款，针对暗黑模式。
          tone: negative
        - date: 2023-09
          label: 裁员 830 人（16%）；Bandcamp 出售
          detail: 首次大规模重组；Sweeney 称支出增长快过盈利。
          tone: negative
        - date: 2023-12
          label: Epic 赢得 Google Play 反垄断陪审团裁决
          detail: Google Play Store 被裁定构成垄断；Fortnite 最终在全球 Google Play 恢复上架。
          tone: positive
        - date: 2024-02
          label: Disney 宣布 $1.5B 股权投资
          detail: 多年期游戏和娱乐宇宙合作；Wikipedia 将 Disney 持股列为约 9%。
          tone: positive
        - date: 2025-05
          label: Fortnite 回归美国 App Store
          detail: 法官裁定 Apple 故意违反反引导禁令；Epic 直接支付恢复。
          tone: positive
        - date: 2026-Q1
          label: 裁员 1,000+ 人；提及 Fortnite 参与度下滑
          detail: 第二次大规模重组；期权继续归属至 2027 年 1 月；提供 4 个月遣散费。
          tone: negative
    approximationNotes: Disney 交易交割日期尚无一手来源确认；此处按 Wikipedia 当前股权表中 Disney 约 9% 持股，列为 2024 年。2026 年裁员时间按新闻稿口径近似为 Q1。
    claimRefs:
      - CO001
      - CO015
      - CO022
      - CO024
      - CO033
      - CO034
      - CO037
      - CO039
      - CO040
      - CO041
      - CO042
  - id: FO002
    title: Epic Games 运营结构与风险图
    type: flow
    layout: standard
    summary: 截至 2026 年，Sweeney 控制的治理结构、四个相互交叉补贴的平台产品、战略投资者协同，以及不断叠加的法律和运营风险，共同构成 Epic 的运营架构。
    data:
      nodes:
        - id: founder-control
          label: Tim Sweeney 控制权
          detail: 多数股权、单一类别普通股；机构少数股东无法通过董事会推翻。
          tone: neutral
        - id: products
          label: 四个平台产品
          detail: Fortnite、Unreal Engine、Epic Games Store 和 Epic Online Services 构成相互交叉补贴的生态。
          tone: positive
        - id: investors
          label: 战略投资者资本（$5B+）
          detail: Tencent（28%）、Disney（9%）、Sony（5.4%）、KIRKBI（3.2%）提供资本和合作生态。
          tone: positive
        - id: legal-outcomes
          label: 反垄断诉讼结果
          detail: Epic v. Google 胜诉（2023 年 12 月）；Epic v. Apple 部分胜诉（2025 年强制执行禁令）；平台访问恢复。
          tone: positive
        - id: regulatory-risk
          label: FTC 执法（$520M 和解）
          detail: COPPA 和暗黑模式违规于 2022 年 12 月和解；声誉和运营约束仍在。
          tone: negative
        - id: operational-risk
          label: 裁员与收入缺口
          detail: 两次大规模重组（2023 年：830 名员工；2026 年：1,000+ 人）；Fortnite 参与度下行；支出超过收入。
          tone: negative
