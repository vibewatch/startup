      - number: '7.4'
        title: 缓释因素存在，但承销仍取决于缺失证据
        blocks:
          - type: paragraph
            body: >-
              Epic 并没有停滞。它已经两次降本，改善了对 Apple 和 Google 的诉讼位置，并在组织承压下继续让 Disney 保持参与。这些动作重要，因为它们降低了“公司马上崩塌”叙事的概率。但这些动作不等于
              Epic 已解决更深层问题的证据。公开数据仍没有揭示当前 Fortnite 活跃用户、重组后现金消耗、Disney
              宇宙经济性，或一条可信的多元化路径来抵消弱化的旗舰。因此，即便承认公司仍有强大资产，剩余暴露仍然高。


              因此，监测 Epic 的正确方式不是泛泛乐观地谈品牌强度，而是设定明确的投资逻辑破裂标准。如果 Fortnite 参与度继续下滑，如果 Apple 成功恢复外部支付摩擦，如果 Disney
              仍战略热情但财务模糊，或如果 Epic 需要再来一轮重大裁员，那么按溢价估值承销 Epic 的理由会迅速恶化。公司仍可能稳定或重新加速，尤其是新 Fortnite 内容或 Unreal
              相邻软件胜出时。但公开证据基础说明，在假设这些缓释已经奏效之前，投资者应要求更多运营证据。
