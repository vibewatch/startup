    summary: Epic 能影响执行，但经济模型仍依赖数个强势外部角色。
    data:
      nodes:
        - id: epic
          label: Epic Games
        - id: apple
          label: Apple / iOS
        - id: google
          label: Google Play
        - id: disney
          label: Disney
        - id: tencent
          label: Tencent
        - id: steam
          label: Steam / Valve
        - id: unity
          label: Unity / Godot
        - id: ftc
          label: FTC / 法院
      edges:
        - from: apple
          to: epic
          label: 分发 + 费用规则
        - from: google
          to: epic
          label: Android 商店条款
        - from: disney
          to: epic
          label: IP + 战略可选性
        - from: tencent
          to: epic
          label: 少数股权悬置风险
        - from: steam
          to: epic
          label: 商店竞争
        - from: unity
          to: epic
          label: 引擎竞争
        - from: ftc
          to: epic
          label: 合规 + 执法
    approximationNotes: 依赖关系图突出影响渠道，而非正式合同层级。
    claimRefs:
      - CR016
      - CR017
      - CR019
      - CR021
      - CR027
      - CR028
      - CR029
      - CR030
  - id: FV001
    title: 推荐逻辑
    type: flow
    description: 估值锚点、风险证据和可比公司估值如何共同形成最终建议。
    summary: 证据链支持有纪律的估值区间，而非高确信度买入结论。
    data:
      nodes:
        - id: anchors
          label: 已知锚点
          detail: 2022 年硬锚 31.5B；2024 年未经确认的隐含锚点 22.5B
          tone: neutral
        - id: ops
          label: 当前经营信号
          detail: 2025 年互动下行 + 2026 年成本重置降低了对峰值锚点的信心
          tone: risk
        - id: comps
          label: 上市可比公司区间
          detail: Roblox、EA、TTWO、Unity 集中在约 6x-9x 市值 / 收入
          tone: neutral
        - id: discount
          label: 私有公司折价
          detail: 不透明、集中度和资本结构未知，支持相对上市同业打折
          tone: risk
        - id: range
          label: 公允价值区间
          detail: 公开证据区间中枢落在十几区间的中高段
          tone: neutral
        - id: call
          label: 建议
          detail: 继续研究，中等信心，高风险评级
          tone: risk
      edges:
        - from: anchors
          to: ops
          label: 重新定锚
        - from: ops
          to: comps
          label: 对比
        - from: comps
          to: discount
          label: 调整
        - from: discount
          to: range
          label: 划定区间
        - from: range
          to: call
          label: 决策
    approximationNotes: 逻辑流是分析判断，而非管理层披露。
    claimRefs:
      - CV001
      - CV004
      - CV025
      - CV036
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    description: Epic 价值讨论对同业区间和内部情景假设的敏感性。
    summary: 公开记录留下足够多不确定性，小幅假设变化也会显著移动区间。
    data:
      items:
        - label: 悲观情景中点
          value: 10
          tone: risk
        - label: 基准情景中点
          value: 17.5
          tone: neutral
        - label: 乐观情景中点
          value: 30
          tone: positive
        - label: 2022 年硬估值锚点
          value: 31.5
          tone: opportunity
        - label: 2024 年 Disney 隐含估值
          value: 22.5
          tone: neutral
    approximationNotes: 数值单位为十亿美元。
    claimRefs:
      - CV001
      - CV004
      - CV032
      - CV033
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    description: 悲观、基准和乐观假设下的示意估值区间。
    summary: 现有公开证据支持一个很宽的区间，因为当前私有财务数据缺失。
    data:
      items:
        - label: 悲观情景
          low: 8
          mid: 10
          high: 12
          tone: risk
          detail: Fortnite 持续下滑；Disney 变现偏低；EGS 经济性疲弱
        - label: 基准情景
          low: 15
          mid: 17.5
          high: 20
          tone: neutral
          detail: Fortnite 企稳；Unreal 增长；Disney 仍是战略可选性
        - label: 乐观情景
          low: 25
          mid: 30
          high: 35
          tone: positive
          detail: Fortnite 重新加速；Disney 变现；Unreal 捕获更多高端价值
        - label: 2022 年硬锚点
          low: 31.5
          mid: 31.5
          high: 31.5
          tone: opportunity
          detail: Sony 和 KIRKBI 在 2022 年 4 月融资
    approximationNotes: 所示数值单位为十亿美元，意在给出方向性区间，而非经谈判确定的交易标记。
    claimRefs:
      - CV001
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    description: 按 Epic 承销案例最关键的维度制作的 IC 风格评分卡。
    summary: 护城河仍强，但透明度和多元化得分低得多。
    data:
      items:
        - label: 护城河 / 战略相关性
          value: 8/10
          detail: Fortnite + Unreal + 生态触达仍异常强
          tone: positive
        - label: 披露质量
          value: 2/10
          detail: 当前私有财务数据和分部拆分仍未披露
          tone: risk
        - label: 多元化证明
          value: 4/10
          detail: Unreal 和 Disney 可选性存在，但 Fortnite 仍主导叙事
          tone: neutral
        - label: 估值支撑
          value: 4/10
          detail: 上市可比公司有帮助，但无法证明高溢价私有估值足够便宜
          tone: risk
        - label: 当前可承销性
          value: 3/10
          detail: 证据足以划定价值区间，但不足以坚定下注
          tone: risk
    approximationNotes: 评分是投资讨论的分析简写，不是统计输出。
    claimRefs:
      - CV025
      - CV026
      - CV029
      - CV036
      - CV039
