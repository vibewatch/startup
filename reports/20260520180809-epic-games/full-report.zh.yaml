      - number: '2.6'
        title: 非游戏实时 3D——建筑、汽车和电影 / 电视市场
        blocks:
          - type: paragraph
            body: >
              Unreal Engine 的非游戏可触达市场在结构上有吸引力：AEC、汽车和电影 / 电视虚拟制作垂直领域历史上依赖专业可视化工具（Autodesk 套件、Chaos
              V-Ray、自研汽车渲染管线），这些工具昂贵、迭代慢，且与游戏级交互式输出割裂。尤其在 UE5 的 Nanite 和 Lumen 功能之后，Unreal Engine
              的实时渲染能力已把质量差距降到足够低，企业建筑师、汽车设计师和电影工作室开始把 UE 作为主要可视化平台采用。


              到 October 2022，Epic 使用 UE 驱动的 LED volumes 支持全球超过 300 个虚拟制作舞台（The Mandalorian 带火的 “StageCraft”
              方法）。MegaGrants 是 Epic 的资助计划，自 2020 起资助了 45+ 个电影和动画项目。Unreal
              的建筑解决方案页面和汽车解决方案页面明确将这些垂直领域定位为引擎目标，但公开披露未单列收入贡献。


              Unity Technologies 作为 Unreal 的主要引擎竞争对手，也在部分非游戏垂直领域竞争——尤其是实时汽车可视化和工业仿真——但其 2023-2024
              声誉危机削弱了企业可信度，可能加速非游戏企业采用 UE5。AEC 市场（全球建筑市场超过数万亿美元）规模大但渗透慢：大多数 AEC 公司使用 BIM 软件（Autodesk Revit、ArchiCAD），要把
              UE5 接入可视化，需要投入显著数据管线。机会真实存在，但在 2024-2026 时间框架内采用不会快速或走向大众市场。
            claimRefs:
              - CM037
              - CM038
              - CM039
      - number: '2.7'
        title: 增长驱动、反向约束与尽调问题
        blocks:
          - type: paragraph
            body: >
              Epic 横跨五个板块的可触达市场受多项交叉驱动和约束共同塑造，尽调必须同等严肃地处理二者。


              增长驱动端：April-May 2025 Apple 法院裁定（Judge Gonzalez Rogers 认定 Apple 蓄意藐视 2021 禁令，并禁止 Apple 对 app 外购买收费）让 iOS 自
              Fortnite 在 August 2020 被 App Store 下架以来首次重新成为 Epic 的实质变现渠道。Fortnite 于 May 20, 2025 回到 US iOS App
              Store，Epic 向使用其游戏内支付系统而非 Apple 支付的用户提供 20% Epic Rewards 激励。该裁定在结构上扩大 Epic 的移动端 SAM，但 Apple 已表示将上诉。EU
              Digital Markets Act 同样在欧洲打开 iOS，使 EGS iOS 于 2024 在 EU 上线，并将在 2025 下半年于 UK 上线。


              UE5 引擎的技术能力和 Unity 的可信度危机，为 2024-2027 时间框架内引擎市场份额整合打开窗口。创作者经济的 40% 收入分成模式若能形成持久玩家留存，将通过维持参与度扩大 Fortnite
              的有效 SAM；按 Newzoo 2026 报告，市场中玩家时间已不再扩张。


              约束端：Apple 对 April 2025 裁定的上诉带来监管不确定性，可能限制或逆转 Epic 在 US 之外的 iOS 变现收益。Epic 的 EGS 相对 Steam 仍结构性规模不足，在社区功能、VR
              兼容、Steam Deck 接入和长尾目录等消费者看重的网络效应上有缺口。UE5 引擎市场份额增长是滞后指标——开发者会在游戏发布数年前就选定引擎，Unity 50%
              开发者安装基数需要多个产品周期才会被实质侵蚀。移动游戏继续受到 Google Play 30% 抽成守门（Epic 与 Google 和解，但未在全球取消 30% 费用结构），限制了 Fortnite 在
              Android 重新出现后的财务收益。最后，Fortnite 2023-2026 参与度下滑（触发两轮裁员）本身就是市场信号：驱动 Fortnite 增长的 battle-royale
              板块正在成熟，平台正执行向多模式、创作者优先模型的结构性转向，而其长期收入画像尚未在规模上验证。
