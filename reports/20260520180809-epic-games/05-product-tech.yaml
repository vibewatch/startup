  - id: section-epic-games-store
    title: Epic Games Store product economics and platform expansion
    body: >
      The Epic Games Store (EGS) is Epic's PC, Mac, Android, and iOS games distribution platform, reaching over
      295 million registered PC/Mac users across 187 countries with 16 languages supported and 80+ payment methods.
      The store was launched in December 2018 with a developer-favorable 88%/12% revenue split — developers keep
      88%, Epic takes 12% — compared to Steam's then-standard 30% (now tiered at 30%/25%/20%). As of June 2025,
      Epic extended the terms with a 100%/0% structure for the first $1 million in net revenue per product per year,
      effectively eliminating Epic's take rate for smaller titles. A "First Run Program" offers 100% revenue share
      for the first six months of exclusivity for new titles; the "Now on Epic" program extends similar terms to
      previously released games.

      For Unreal Engine games, the royalty economics are further incentivized: the 5% UE royalty is waived entirely
      for games distributed exclusively through EGS using Epic's payment system. This creates a meaningful, though
      opaque, total effective discount for UE5 developers who choose EGS exclusivity over multi-platform distribution.

      EGS mobile expansion: Epic launched the EGS on Android (global) and iOS (European Union only, under the
      EU Digital Markets Act) on August 16, 2024. The iOS EU launch capitalized on Apple's obligations under
      the DMA, which required Apple to permit alternative storefronts. Epic began offering third-party games on
      mobile in January 2025. In April 2025, following the contempt ruling against Apple in the Epic v. Apple
      litigation, Sweeney announced plans to bring EGS to iOS in the United States. The free games program, which
      offers weekly free PC titles, has been a critical user acquisition driver: EGS revenue of $950M in 2023
      with 270M users, per Wikipedia's EGS article.

      EGS self-publishing allows any developer to list their game for a $100 fee (introduced March 2023), similar
      to Steam Direct. Epic prohibits pornographic titles and requires cross-platform play support for multiplayer
      games.

      Adverse finding — EGS profitability: Apple's 2021 court testimony in the Epic v. Apple trial asserted that
      the EGS was running approximately $400 million in cumulative losses from 2019 to 2020, driven by exclusivity
      minimum guarantees and free game licensing costs. Apple's analysis projected EGS would not reach profitability
      until 2027. Epic publicly disputed this, stating it expected profitability by 2023. As of the report date,
      neither Epic's claimed 2023 profitability nor the 2027 Apple projection has been confirmed by public financial
      data, as Epic does not publish segment financials. This profitability ambiguity represents a material gap in
      understanding the net cash drag EGS places on Epic's consolidated P&L.
    claimRefs:
