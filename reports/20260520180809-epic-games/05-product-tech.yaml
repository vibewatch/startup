  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: egs-profitability-confirmed
      missingEvidence: >-
        Epic has not published segment-level financials. The EGS profitability dispute (Apple's 2027
        projection vs. Epic's 2023 claim) cannot be resolved from public sources. Neither claim has
        been verified by post-2021 financial disclosure from Epic or an independent audit.
      whyItMatters: >-
        If EGS is still loss-making through 2026, it represents a continued multi-hundred-million-dollar
        cash drag on Epic's consolidated P&L, compounding Fortnite engagement decline and the $520M FTC
        settlement cash charge. If EGS has achieved profitability, it fundamentally changes the investment
        thesis for the platform.
