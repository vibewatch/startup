        - Up to 100% revenue share vs 70% on Steam; UE5 royalty waiver for exclusives
        - 70K vs 100K+ Steam catalog gap; no user reviews; lower organic discovery traffic
      - - Multiplayer game developer (any engine)
        - Add cross-platform backend without licensing cost
        - Epic Online Services (EOS) — free SDK
        - Free; ~1B player graph; no Epic account required for Game Services; anti-cheat included
