    rows:
      - - UE5 Rendering pipeline (Nanite, Lumen, VSM, Substrate)
        - Film-quality real-time rendering at 60 fps on console/PC
        - GPU hardware capability; DirectX 12 / Vulkan / Metal APIs
        - Shader stutter on game launch; traversal stutter during streaming; TAA blur artifacts
      - - Chaos physics + Niagara particle system
        - Physically accurate simulations; fluid and particle effects
        - CPU/GPU compute resources; platform-specific physics capability
        - Performance overhead on lower-end hardware; porting effort to new platforms
      - - Verse programming language + UEFN scripting runtime
        - Logic and game mechanics authoring in Fortnite creator ecosystem
        - Epic's VS Code extension and language server; UEFN content service
        - New language learning curve; no Blueprints fallback; Windows-only development environment
      - - Epic Online Services (EOS) — C/C# SDK
        - Cross-platform backend (auth, sessions, anti-cheat, player data, voice)
        - Cloud infrastructure (Epic-hosted); multiple identity providers; platform SDK approvals
        - Epic infrastructure availability; dependency on platform OS-level approvals for anti-cheat
      - - Epic Games Store backend (payment, DRM, launcher)
        - Digital distribution and payment processing (80+ payment methods, 43 currencies)
        - Regional payment processors; Apple/Google mobile platform policies
        - Apple appellate risk on US iOS commission; mobile regulatory changes
      - - Fab marketplace + Quixel Megascans integration
        - Unified digital content distribution and discovery for creators and studios
        - UE5.5+ integration; Fab content delivery infrastructure
        - Early-stage marketplace; no public GMV; seller migration from legacy platforms incomplete
