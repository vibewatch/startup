  - id: section-eos-metahuman-fab
    title: Epic Online Services, MetaHuman, and Fab marketplace
    body: >
      Epic Online Services (EOS) is Epic's free, cross-platform backend services suite for multiplayer game
      development. EOS is game-engine-agnostic and operates independently of Unreal Engine, with SDKs available
      in C and C# and integrations for Unity, Unreal Engine, and custom engines. EOS organizes its services into
      four groups: Accounts and Social (Epic Account Services requiring an Epic Games account), Multiplayer
      (Game Services, no Epic account required), Player and Game Data (Game Services), and Trust and Safety
      (Game Services).

      The Accounts and Social services tap into a player ecosystem of nearly one billion players via Epic Games
      accounts, enabling crossplay, friends lists, presence information, and a Social Overlay UI. The Multiplayer
      services include peer-to-peer (P2P), sessions, lobbies, matchmaking, NAT traversal, voice chat, and
      anti-cheat. Game Services accept player authentication via multiple identity providers including Steam,
      Google, Amazon, PlayStation, Xbox, Nintendo, and Epic accounts, enabling truly platform-agnostic backend
      integration. The Player and Game Data services cover cloud saves, achievements, leaderboards, stats, and
      title storage. The Trust and Safety group includes EOS Anti-Cheat and Kids Web Services (KWS) integration.

      Kids Web Services (KWS), originally developed by London-based startup SuperAwesome (which Epic acquired in
      2020), is a parental consent management and age verification toolkit. When SuperAwesome was demerged in a
      management buyout in January 2024, Epic retained KWS. KWS gained notable third-party adoption when Bluesky
      began requiring UK users to register with KWS for certain features in July 2025, fulfilling requirements
      under the UK Online Safety Act 2023. KWS represents a modest but growing revenue-adjacent asset: its
      adoption by non-gaming platforms signals expanding applicability of Epic's trust infrastructure.

      MetaHuman is Epic's cloud-based character creation framework for producing high-fidelity, fully rigged
      digital humans. The technology was assembled from three acquisitions — 3Lateral (character scanning/rigging),
      Cubic Motion (facial performance capture), and Quixel (photogrammetry assets). MetaHuman Creator allows
      developers to create photoreal digital humans in minutes from presets or starting from existing meshes
      ("Mesh to MetaHuman"). MetaHuman Animator enables real-time and offline facial animation from actor
      performances, including an audio-to-animation inference capability introduced in UE5.5. MetaHuman is
      compatible with UEFN (support added March 2024), compatible with Fab for sharing MetaHumans, and
      deployable from mobile to console. MetaHuman 5.7 (December 2025) delivered major body conforming
      improvements, removed the A-pose requirement, lifted height restrictions, and enabled FBX round-trip.
      MetaHuman 5.8 Preview was released in May 2026.

      Fab is Epic's unified digital asset marketplace, launched October 22, 2024, consolidating Sketchfab,
      ArtStation Marketplace, Quixel Megascans, and the legacy Unreal Engine Marketplace into a single
      platform. Fab is described as "tool-agnostic" and open to content for all engines, not just Unreal Engine.
      As of UE5.5 (November 2024), Fab is integrated into the Unreal Engine editor, enabling drag-and-drop import
      of individual Quixel Megascans assets directly into scenes. Fab uses an 88%/12% revenue split for sellers,
      matching the EGS developer terms.
