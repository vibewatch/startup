        - Shader compilation stutter; traversal stutter not fully resolved
      - - Independent Fortnite creator
        - Build and monetize a Fortnite experience without AAA budget
        - UEFN + Verse + Island Creator program
        - 40% of engagement revenue; 20,000+ creators paid; $320M distributed year 1
        - Windows-only; Discovery algorithm opacity; no Blueprints visual scripting
      - - PC game publisher (indie/mid-tier)
        - Distribute game to PC audience with favorable economics
