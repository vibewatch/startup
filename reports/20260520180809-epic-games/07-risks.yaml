  evidenceGaps:
  - type: missing-source
    severity: material
    topic: regulatory register completeness
    missingEvidence: Full cross-jurisdiction list of Epic legal matters, regulator correspondence, and any non-US investigations not visible in public sources.
    whyItMatters: The public legal record is strong on the FTC and Apple matters, but a partial register can still miss smaller enforcement, privacy, or regional compliance issues that change underwriting.
    diligencePath: Request outside-counsel litigation list, regulator inquiry log, and jurisdiction-by-jurisdiction compliance tracker.
    relatedQuestionRefs:
    - QR008
    - QR015
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: cash runway
    missingEvidence: Current cash balance, debt, and post-restructuring burn trajectory for 2025-2026.
    whyItMatters: Without cash and burn visibility, investors cannot size downside runway or the urgency of another financing event.
    diligencePath: Request audited 2024-2025 financial statements plus monthly cash bridge and debt schedule.
    relatedQuestionRefs:
    - QR005
    - QR029
  - type: missing-source
    severity: material
    topic: succession
    missingEvidence: Independent board roster and documented CEO succession plan.
    whyItMatters: Founder concentration is more material when no public governance framework explains continuity if Tim Sweeney steps back.
    diligencePath: Request board materials, governance charter, and emergency / planned succession documentation.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: engagement metrics
    missingEvidence: Quarterly Fortnite MAU, DAU, Battle Pass attach rate, and payer trend for 2024-2026.
    whyItMatters: The public record confirms a downturn but does not quantify its depth, making concentration and restructuring risk hard to model precisely.
    diligencePath: Request internal KPI dashboard by quarter and by major Fortnite mode.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: Disney economics
    missingEvidence: Revenue share, development spend, milestone roadmap, and KPIs for the Disney x Fortnite universe.
    whyItMatters: The partnership could justify upside optionality or destroy capital efficiency depending on economics that are currently undisclosed.
    diligencePath: Request Disney partnership agreement summary, budget, and milestone schedule.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: minor
    topic: Tencent governance rights
    missingEvidence: Detailed shareholder-rights package attached to Tencent's stake, including information rights and vetoes.
    whyItMatters: The headline stake size is public, but governance rights determine how much geopolitical scrutiny can transmit into real control or consent friction.
    diligencePath: Request shareholder agreement extracts or board-consent rights summary.
