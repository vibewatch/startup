- id: mitigations-and-thesis-break-triggers
  title: Mitigations exist, but underwriting still depends on missing evidence
  body: 'Epic is not standing still. It has already cut costs twice, improved its litigation position versus Apple and Google, and kept Disney engaged despite organizational stress. Those actions matter because they reduce the probability of an immediate collapse narrative. But they are not the same as evidence that Epic has solved its deeper issues. Public data still does not reveal current Fortnite actives, post-restructuring cash burn, Disney-universe economics, or a credible diversification path that can offset a weak flagship. For that reason, the residual exposure stays high even after acknowledging the company still has formidable assets.


    The right way to monitor Epic is therefore through explicit thesis-break criteria instead of broad optimism about brand strength. If Fortnite engagement continues falling, if Apple successfully restores friction around outside payments, if Disney remains strategically enthusiastic but financially vague, or if Epic needs another major layoff cycle, then the case for underwriting Epic at a premium valuation deteriorates quickly. The company still may stabilize or re-accelerate, especially if new Fortnite content or Unreal-adjacent software wins out. But the public evidence base says investors should demand more operational proof before assuming those mitigations have already worked.'
