- id: TR005
  title: Mitigation and thesis-break criteria table
  description: Monitorable triggers that would move the investment view from high-risk optionality to clear thesis break.
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Fortnite decline
    - Consumer engagement update
    - Another year with no disclosed stabilization and more mode closures
    - Assume lower earnings power and compress valuation assumptions
  - - Platform reversal
    - Apple appeal outcome
    - Court narrows or delays anti-steering economics materially
    - Reduce upside tied to mobile-margin recovery
  - - Restructuring incompleteness
    - Workforce actions
    - A third major layoff round or further large cost-cut program
    - Treat current reset as insufficient and governance confidence as weakened
  - - Disney execution
    - Partnership progress
    - More branded activations without disclosed monetization or milestones
    - Model Disney optionality at near-zero standalone value
  - - Store economics
    - EGS profitability
    - No evidence of sustainable store economics by or beyond 2027
    - Assign minimal or negative strategic value to EGS
  - - Governance opacity
    - Board / succession disclosure
    - No improved succession or board visibility before financing or liquidity event
    - Demand stronger discounts or pass on premium pricing
  notes: These triggers are intended for underwriting discipline rather than predicting exact timing.
