- id: platform-and-regulatory-risks
  title: Platform, regulatory, and geopolitical risks remain binary
  body: 'Epic''s platform exposure is still structurally binary. The Apple contempt order improved the legal posture around external payments, but Apple immediately signaled an appeal, leaving Epic dependent on how courts and regulators enforce anti-steering rules over time. The Google settlement in 2026 reduced friction on one side of the mobile market, yet it also highlighted the deeper issue: Epic''s mobile economics depend on policy, injunctions, and negotiated concessions from gatekeepers that Epic does not control. Even when regulation helps Epic, it creates a new dependency on regulators sustaining pressure and on platforms complying without delay or workaround.


    The FTC file shows a different kind of regulatory risk: one that no longer sits in headline litigation but still affects the live operating model. Epic already paid $520 million to resolve COPPA and dark-pattern allegations, and the refund program continued sending money to users in 2025 with more payments expected in 2026. That means consumer-protection risk remains current, not historical. Tencent adds a geopolitical layer. U.S. authorities placed Tencent on the DoD''s Chinese military companies list in early 2025, and legal commentary now points to concrete June 2026 procurement consequences for listed entities. Epic is not Tencent, but a large strategic shareholder exposed to rising U.S.-China scrutiny is still a governance and exit-complexity risk for any investor underwriting future liquidity.'
  claimRefs:
