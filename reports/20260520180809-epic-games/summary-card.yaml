  topStrengths:
    - Fortnite remains one of the world's largest gaming platforms by registered-account scale and cultural reach.
    - Unreal Engine gives Epic a differentiated software and ecosystem moat beyond any single game franchise.
    - >-
      Epic has repeatedly improved its strategic position against Apple and Google through litigation and settlement
      pressure.
    - >-
      Disney's capital and IP partnership preserves real upside optionality if Epic can convert branded experiences into
      monetized products.
  topRisks:
    - >-
      Fortnite still appears to drive too much of Epic's economic engine, and management has already acknowledged an
      engagement downturn since 2025.
    - >-
      Current revenue, margin, cash, debt, and segment-profitability disclosure is too thin to underwrite the business
      like a public peer.
    - Epic remains dependent on platform gatekeepers and regulators for part of its mobile-distribution upside.
    - Disney optionality is real but still not publicly monetized, making it hard to justify a premium valuation today.
    - >-
      Tim Sweeney's continuing centrality and the lack of clear succession disclosure create key-person and governance
      risk.
  unresolvedGaps:
    - 2025-2026 audited revenue, margin, EBITDA, and free-cash-flow data.
    - Segment revenue and margin split across Fortnite, Unreal Engine, Epic Games Store, EOS, and other businesses.
    - Current cash balance, debt schedule, and any preference stack or financing terms after the Disney deal.
    - Disney x Fortnite economic terms, development budget, milestones, and monetization KPIs.
    - >-
      Unreal Engine standalone revenue growth and margin profile sufficient to support a software-style valuation
      premium.
