companyProfile:
  summary: >-
    Epic Games is a privately held interactive entertainment and software company founded in 1991 by Tim Sweeney.
    Its core assets are Fortnite, Unreal Engine, Epic Games Store, and Epic Online Services, which together span
    consumer gaming, game development tools, marketplace distribution, and backend platform infrastructure. Epic's
    strategic strength comes from combining a world-scale consumer platform with a leading real-time 3D engine, but
    the company still discloses far less than public peers on current revenue, segment profitability, and capital structure.
  foundedDate: '1991-01-01'
  founders:
    - name: Tim Sweeney
      role: Founder and CEO
      claimRefs: [CO001]
  foundingLocation: Potomac, Maryland, USA
  headquarters: Cary, North Carolina, USA
  productSummary: >-
    Epic monetizes Fortnite through in-game purchases and subscriptions, licenses Unreal Engine via a 5% royalty
    above revenue thresholds, operates Epic Games Store on developer-favorable economics, and offers Epic Online
    Services as cross-platform infrastructure.
  customerFocus: >-
    Fortnite players and payers; game developers using Unreal Engine, UEFN, EOS, and Epic Games Store; plus film,
    enterprise, and branded-content partners using Epic's real-time 3D tools.
  businessModel: >-
    Free-to-play consumer monetization (V-Bucks, Battle Pass, Fortnite Crew), Unreal royalty and licensing economics,
    Epic Games Store take rate, and adjacent creator / platform ecosystem economics.
  stage: Late-stage private
  fundingStatus: >-
    Last hard valuation was the $31.5 billion April 2022 Sony/KIRKBI financing. Disney invested $1.5 billion in February
    2024 for an equity stake, and secondary reporting implied a roughly $22.5 billion valuation, though Epic and Disney
    did not confirm that figure publicly.
  disclosureProfile: private-undisclosed
