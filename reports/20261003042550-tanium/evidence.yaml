evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial disclosure of current annual recurring revenue (ARR), year-over-year growth rate, gross margins,
      net revenue retention, and operating cash burn for 2025-2026.
    whyItMatters: >-
      Without primary revenue run-rate and cash generation figures, Tanium's $9.0 billion private valuation and multiple
      sustainability cannot be validated under public SaaS comparables.
    diligencePath: >-
      Obtain confidential management presentation, audited financial statements, or recent 409A common stock valuation
      reports under non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: >-
      Complete breakdown of current board voting agreements, investor seat allocations, and secondary share sale
      transactions since the 2021 Series F financing round.
    whyItMatters: >-
      Founder voting control versus institutional investor liquidation preferences determines governance authority and
      potential IPO timing.
    diligencePath: >-
      Review amended certificate of incorporation and investor rights agreements filed in Delaware corporate registry or
      via institutional cap table audits.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Current eligible-endpoint counts by target segment, geographic availability, realized price and discount
      distributions, module attach rates, customer mix, renewal cohorts, and win rates.
    whyItMatters: >-
      Without these denominators, neither a Tanium-specific serviceable market nor a credible obtainable share can be
      calculated from public evidence.
    diligencePath: >-
      Request management's market model and reconcile it to customer-level endpoint counts, contract values, module
      attach, pipeline conversion, churn, and expansion cohorts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: aem-adoption
    missingEvidence: >-
      The original Gartner research supporting the forecast that more than 50% of organizations will adopt AEM by 2029,
      including its definition, survey base, and geography.
    whyItMatters: A company-issued secondhand forecast cannot establish the size, timing, or monetization of the AEM opportunity.
    diligencePath: >-
      Obtain the licensed Gartner report or a directly citable analyst excerpt and compare its AEM definition with
      Tanium's current bundles.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      Current Tanium quotes or executed contracts that independently verify endpoint minimums, per-module pricing,
      discounting, services, support, and true-up terms.
    whyItMatters: >-
      The available pricing evidence is authored by a competitor and may not represent realized pricing, customer mix,
      or current packaging.
    diligencePath: >-
      Sample recent new-logo and renewal contracts across endpoint bands and reconcile quoted license rates to
      first-year and steady-state total cost.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Official published price lists or verified discounting schedules by endpoint fleet tier directly from Tanium deal
      desk.
    whyItMatters: >-
      Without vendor-verified pricing disclosures, buyers must rely on negotiated benchmark data and third-party partner
      price sheets.
    diligencePath: Obtain redacted enterprise order forms or anonymized procurement benchmark studies from Gartner/Vendr.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: minor
    topic: unmanaged-endpoints
    missingEvidence: >-
      Empirical head-to-head performance benchmarks measuring network telemetry overhead across 100,000+ endpoint
      environments.
    whyItMatters: >-
      Direct verification of network saturation claims versus modern cloud-native aggregation models remains
      vendor-asserted.
    diligencePath: >-
      Request customer proof-of-concept audit logs and independent lab testing reports comparing Tanium P2P against
      CrowdStrike.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing-and-revenue-quality
    missingEvidence: >-
      Current price books, realized discounts, contract terms, ARR, bookings, billings, RPO, services mix, and
      revenue-recognition policy.
    whyItMatters: >-
      Without these records, product breadth cannot be converted into recurring revenue quality, pricing power, or cash
      timing.
    diligencePath: >-
      Obtain customer-contract samples, invoice cohorts, the revenue-recognition memo, and ARR-to-GAAP-revenue bridges
      from management.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current gross margin, NRR, gross retention, CAC, payback, sales cycle, support cost, cloud cost, and
      professional-services utilization.
    whyItMatters: These inputs determine whether historical scale translates into durable operating leverage and efficient growth.
    diligencePath: >-
      Review audited segment economics, customer cohorts, sales-capacity schedules, cloud bills, and support utilization
      with finance leadership.
    relatedQuestionRefs:
      - QI002
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: stale
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, debt and credit facilities, liquidation preferences, monthly burn, capex, and
      management's runway forecast.
    whyItMatters: >-
      A 2020 cumulative funding total cannot establish present liquidity, financing dependency, or the timing of a
      next-round trigger.
    diligencePath: >-
      Obtain the latest audited balance sheet, capitalization table, debt schedule, 24-month cash forecast, and
      board-approved operating plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cloud-vs-onprem-architecture
    missingEvidence: >-
      Comprehensive architectural breakdown and SLA performance comparisons between Tanium Cloud SaaS clusters and
      customer-hosted on-premises server environments.
    whyItMatters: >-
      Enterprise buyers and underwriting diligence must understand whether migration to Tanium Cloud imposes functional
      restrictions on custom sensors, data egress limits, or on-premises database connectors.
    diligencePath: >-
      Request Tanium Cloud deployment architecture whitepapers, SOC2 Type II audit reports, and on-premises vs cloud
      integration boundary specifications.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-concentration
    missingEvidence: >-
      Audited gross revenue retention (GRR), net revenue retention (NRR), customer count by ARR cohort, and top-ten
      customer revenue concentration.
    whyItMatters: >-
      Without retention and concentration disclosure, investors cannot evaluate whether revenue growth is driven by
      durable expansion or masked by enterprise churn.
    diligencePath: >-
      Request confidential customer cohort retention tables, NRR trends, and top customer revenue breakdown in
      management diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: missing-source
    severity: material
    topic: current-adverse-events
    missingEvidence: >-
      Current primary records for incidents, outages, lawsuits, enforcement actions, security certifications, and
      unresolved customer-impacting events.
    whyItMatters: >-
      The assigned evidence set cannot establish whether material adverse events exist, and absence from the set is not
      evidence that none occurred.
    diligencePath: >-
      Search regulator and court databases, review status and trust-center histories, obtain the incident register, and
      reconcile findings with insurer and customer disclosures.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: dependency-concentration
    missingEvidence: Revenue, customer, channel, connector-usage, cloud, and operating-system concentration by counterparty and cohort.
    whyItMatters: Unmeasured concentration can amplify pricing, renewal, platform-policy, outage, and competitive-bundling risk.
    diligencePath: >-
      Obtain customer and partner concentration schedules, connector telemetry, revenue by platform and channel, renewal
      cohorts, and counterparty contract terms.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-register
    missingEvidence: >-
      A current, jurisdiction-complete register supported by regulator, court, certification, and executed-contract
      records.
    whyItMatters: >-
      Company-authored guidance and public template terms cannot establish current legal status, exceptions, enforcement
      exposure, or customer-specific allocation.
    diligencePath: >-
      Have counsel reconcile applicable rules and proceedings by jurisdiction and review executed agreements, audit
      reports, certifications, and correspondence.
    relatedQuestionRefs:
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
