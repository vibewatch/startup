      - number: '3.4'
        title: 护城河韧性、架构取舍与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Tanium 的竞争护城河立足于自研线性链架构；该设计带来的点对点数据汇聚与全网亚秒级查询执行能力，是中心化客户端-服务器架构在超大规模下无法企及的。这种技术优势让 Tanium
              成为关键任务环境的事实标准，客户涵盖近半数 Fortune 100 强企业、大型金融机构以及美军多个军种。Tanium Atlas 与 MCP 服务器连接器的集成进一步扩大了这一优势，使受控生成式 AI
              客户端能安全查询实时终端状态。尽管如此，这一架构护城河仍存在明显的运维与经济脆弱性。由于查询和漏洞传感器在纳管设备本地执行，Tanium 给终端 CPU
              和内存带来了一定处理负荷，必须经过严格的传感器调优，以防全网扫描时拖垮系统性能。相比之下，采用服务端计算的竞品则消除了终端本地的资源峰值。此外，随着 SEC
              等监管机构对金融服务业提出严格的网络安全审查和快速泄露通报要求，企业愈发看重开箱即用的一体化遥测，而非复杂的模块拼凑。Tanium 高昂的总体拥有成本、运维复杂度以及层层捆绑的模块依赖（例如必须先购买 Asset
              和 Comply 才能采购软件物料清单 SBOM 模块），在续约窗口期带来了持续的被替代风险，尤其是当企业高层考虑向 Microsoft E5 或 CrowdStrike Falcon 套件整合时更是如此。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 终端无上限增长与模块蔓延带来的采购财务敞口
            body: >-
              与 Tanium 签约的企业采购方在两项结构性授权机制上面临严峻的财务敞口：超量终端默认按目录价计费，以及复杂的 SKU
              前置依赖链。在标准合同中，因云端扩容或并购产生的新增超量终端均按目录全价计费，无法享受基础折扣，导致续约费用激增 40% 至 60%。此外，高阶运维模块附带严苛的前置授权链——例如部署 SBOM 前必须采购
              Asset 和 Comply——悄然蚕食了原本承诺的套件折扣。
            calloutType: risk
            claimRefs:
