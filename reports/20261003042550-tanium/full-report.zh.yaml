      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              自主修复让 Tanium
              的潜在故障模式从“错误的观察结论”演变为“在客户终端上执行错误的操作”。公司宣称安全护栏与审批签署是保障机制，而独立分析则强调维护窗口、灰度发布、回滚路径与操作验证才是安全自动化的前置条件。终端数据的精准度既是产品优势，也是控制层面的依赖项：陈旧或残缺的遥测数据可能导致系统以极快速度做出错误动作。爬取页面中
              Tanium 公开宣称的 97%
              漏洞减少口径缺乏分母、客户样本群、时间周期和实名客户背书，不足以确立通用的生产环境有效性。投资决策关卡应当要求提供客户层面的故障率、回滚耗时、异常频率，以及证明修复成效经过独立核验而非仅从部署日志推断的证据。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR011
              - CR016
          - type: table
