  - id: FE001
    title: Tanium 核心平台架构栈
    type: stack
    summary: Tanium 终端管理平台分层架构，展示用户界面、自主工作流编排、点对点通信及终端执行引擎。
    data:
      layers:
        - label: 工作流与企业集成层
          detail: 面向事件分流的 ServiceNow AI Agent、Cloudflare Access 零信任态势验证及 SIEM 连接器
        - label: 核心平台与 API 服务
          detail: 用于统一查询与操作的 GraphQL API 网关、TDS 数据服务，以及基于角色的管理控制
        - label: Tanium Connect 与数据导出网络
          detail: 定时与事件驱动的数据流传输，对接 syslog 采集器、Webhook、文件及企业云存储
        - label: Direct Connect 与取证分流工具
          detail: 提供低延迟实时会话，支持深度性能排查、交互式进程管控及 Threat Response 证据采集
        - label: 线性链式通信架构
          detail: 获得专利的局域网点对点中继协议、动态邻居发现、100 台终端级联链与路由自愈修复
        - label: 分布式终端执行引擎
          detail: 轻量级终端 Agent 运行时，负责执行本地命令行 Sensor、程序包动作及原生操作系统集成
    approximationNotes: 概念性功能架构栈示意，梳理自官方架构说明书与开发者文档。
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE007
      - CE012
      - CE015
  - id: FU001
    title: 客户采纳生命周期与平台扩张路径
    type: journey-map
    summary: 企业客户从初期部署终端 Agent，逐步演进至自主 AI 运营的进阶历程。
    data:
      items:
        - label: 1. 全网资产初始摸底
          description: 客户部署轻量级终端客户端，对全部已纳管与未纳管资产建立起完整的实时可见性。
          points: Days 1-30
          touchpoints:
            - 统一终端扫描
            - 影子 IT 排查
            - 资产清单标准化
        - label: 2. 风险暴露面与补丁治理
          description: 运维团队在服务器与工作站上建立自动化补丁安装与漏洞修复工作流。
          points: Months 2-6
          touchpoints:
            - 自动化 OS 补丁周期
            - 收敛漏洞风险暴露
            - 合规态势验证
        - label: 3. 工作流融合
          description: 将 Tanium 终端遥测数据集成至 ServiceNow CMDB 等企业核心 ITSM 记录系统。
          points: Months 6-12
          touchpoints:
            - CMDB 数据丰富化
            - 自动化工单信息补全
            - IT 与 SecOps 团队协同整合
        - label: 4. 多模块扩张
          description: 扩展已授权终端能力，覆盖性能监控、威胁响应及文件完整性监控。
          points: Months 12-18
          touchpoints:
            - 部署性能监控
            - 终端检测与响应模块
            - 文件完整性与审计追踪
        - label: 5. 自主 IT 与 Atlas AI
          description: 迈向对话式自主运维、闭环修复及常驻系统级智能体。
          points: Year 2+
          touchpoints:
            - Tanium Atlas 自然语言查询
            - 受控自主修复
            - 全网跨设备 AI 智能体编排
        - label: 6. 生态系统持续协同创新
          description: 融入企业级 MDR 与 MSP 运营，对接合作伙伴自动化工作流及联邦级零信任架构。
          points: Year 3+
          touchpoints:
            - 托管式 SOC 合作伙伴集成
            - 联邦零信任架构
            - 自定义 REST/GraphQL 遥测数据流
    approximationNotes: 客户旅程图呈现了案例研究及合作伙伴材料中记载的客户扩张定性阶段。
    claimRefs:
      - CU001
      - CU004
      - CU008
      - CU009
      - CU011
