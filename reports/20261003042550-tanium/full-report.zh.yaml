      - number: '1.2'
        title: 高管团队、治理交接与关键人风险
        blocks:
          - type: paragraph
            body: >-
              成立近 20 年来，Tanium 的公司治理与运营方向始终与创始家族深度绑定。联合创始人兼执行董事长 Orion Hindawi 曾于 2016 至 2023 年间出任 CEO，2026 年 8 月 20
              日再次被任命为首席执行官，接替结束三年任期并主导市场拓展规模化的 Dan Streetman。与此同时，联合创始人 David Hindawi 重任董事会主席，Streetman
              则转任顾问角色。此次高管调整发生于 2026 年春季高层密集动荡之后；期间 Tanium 失去了五位核心高管，包括首席法务官 Brady Mickelsen、首席人力官 Tobias Julén、首席信息安全官
              Chris Hallenbeck 和首席营销官 Tara Ryan，新任 CPO Carol MacKinlay 也在短暂任职后辞职。高管离职源于员工与管理层之间的尖锐矛盾，焦点集中在 IPO
              无限期推迟、与强制返岗挂钩的股权扣留规定，以及高管迁址限制；由此可见，公司对 Orion Hindawi 存在显著的关键人依赖，需依靠他来维系长期组织稳定。
