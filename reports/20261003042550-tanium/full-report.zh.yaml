  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Tanium 的核心投资逻辑在于其作为企业级终端控制平面的深厚壁垒：能够在数以百万计的终端上实现亚秒级查询、打补丁以及自动化修复 [CV001]。凭借 2020 年经核验已超过 $430M 的历史收入体量与
              1,400 多名员工，Tanium 深度渗透进极其挑剔的 IT 环境，覆盖近半数 Fortune 100 强企业以及美军六大军种 [CV002]。此外，平台依托 Tanium Atlas 从被动监控向自主 IT
              及智能体工作流编排演进，在核心 IT 记录系统（systems of record）之外不断扩展企业工作流价值 [CV003]。然而，反向逻辑同样充分：Tanium 仍是一家未上市的后期独角兽，其公开估值叙事自
              2021 年 1 月以来未再获得一级市场定价验证 [CV004]。在活跃客户数、当前 ARR 及续约客户群均未公开披露的情况下，投资者无法判定其净收入留存率（NRR）面对 Microsoft Defender 和
              Intune 的捆绑竞争时能否保持韧性 [CV005]。加之 SEC 激进的事件通报规定与严格责任标准等网络安全监管环境变动，进一步推高了企业对自动化修复工具的运维审视 [CV006]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
