      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 规模优势遭遇非公开信息壁垒
            body: >-
              Tanium 拥有超过 3600 万台终端的纳管规模，且 Atlas 在短时间内被逾 1,300
              家机构采用，体现出真实的产品拉动力。但客户群留存数据、总流失率以及收入集中度披露的彻底缺失，给评估其业务韧性的机构投资者带来了巨大的尽调阻碍。
