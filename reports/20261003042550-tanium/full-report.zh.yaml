  - id: FI001
    title: 证据约束下的收入至现金转化桥梁
    type: flow
    summary: 产品与交付界面公开可见，但产品使用之后的每一步商业转化都依赖非公开证据。
    data:
      nodes:
        - id: platform
          label: 平台能力
          detail: 终端管理、打补丁、合规审计、威胁响应及 Atlas 均有公开说明。
        - id: packaging
          label: 产品打包与方案设计
          detail: 模块边界以及捆绑还是独立销售方案未予公开。
        - id: contract
          label: 企业合同
          detail: 计价单位、签约年限、折扣力度及结算条款未予公开。
        - id: revenue
          label: 确认收入
          detail: 仅保留了历史 2019 年的收入门槛数据；当前营收与 ARR 无法获取。
        - id: gross-profit
          label: 毛利润
          detail: 托管、技术支持、合作伙伴及服务交付成本未作量化。
        - id: cash
          label: 造血能力与现金跑道
          detail: 历史经营现金流利润率已有披露，但当前现金、烧钱速度（burn）、负债及现金跑道（runway）未予公开。
      edges:
        - from: platform
          to: packaging
          label: 商业配置未知
        - from: packaging
          to: contract
          label: 价格与条款未知
        - from: contract
          to: revenue
          label: 收入确认政策未知
        - from: revenue
          to: gross-profit
          label: 当前营业成本未知
