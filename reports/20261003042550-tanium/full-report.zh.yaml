      - number: '2.2'
        title: 市场测算视角：提供有效参考，而非虚构 TAM
        blocks:
          - type: paragraph
            body: >-
              本次尽调材料库中唯一有出处的品类收入序列属于 DEX 软件：FY24 为 $0.97B，FY25 为 $1.15B，预计 2033 年达 $4.25B。该序列属于相邻市场，而非 Tanium 的
              TAM，因为公司平台还覆盖终端管理与安全工作流，而 DEX 测算排除了这部分支出中的绝大多数。第二个视角是渗透率：Tanium 转引 Gartner 预测称，到 2029 年超过 50%
              的组织将采用自主终端管理（AEM）能力，但底层的 Gartner 原始材料并未收录在证据库中，且渗透率并不等同于收入。第三个视角是合同经济模型：一份竞对编写的指南显示，按 2,000
              台终端的最低起订量计算，核心平台单台终端年费为 $20–$24，多模块组合价格区间更高。这些指标圈定了机会分析的边界，但在缺乏符合条件的设备规模、模块搭配率、折扣水平以及客户结构数据的情况下，无法据此推导出
              SAM 或 SOM。
