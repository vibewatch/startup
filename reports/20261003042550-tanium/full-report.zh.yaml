      - number: '7.4'
        title: 合作伙伴、财务及信息依赖风险
        blocks:
          - type: paragraph
            body: >-
              Tanium 宣称与 ServiceNow、Microsoft、Splunk、Claude、ChatGPT 和 Copilot Studio 具备原生连接能力。这些集成拓展了工作流覆盖面，但也使业务面临 API
              变更、平台政策转向、客户架构调整以及竞品打包捆绑带来的直接冲击。独立评论指出 Microsoft、CrowdStrike、Palo Alto Networks、SentinelOne、Qualys、Tenable
              和 ServiceNow 均在同一整合赛道角逐，使产品差异化与生态契合度成为持续存在的执行风险。财务不透明构成了另一层依赖风险：一份市场数据预览将实质性数据隐藏在订阅权限之后，而另一家聚合平台虽记录了 2021
              年 1 月的 $9B 估值和 $1.1B
              累计融资，其员工人数数据却自相矛盾。累计融资金额并不等同于账面可用现金，历史估值亦不能作为当下普通股价值的依据。要对流动性、优先股权利、集中度、利润率以及留存率做出投资评估，必须获取管理层一手数据。
            claimRefs:
              - CR009
              - CR010
              - CR011
