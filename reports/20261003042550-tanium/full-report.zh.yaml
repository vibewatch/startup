  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心平台架构与线性链通信机制
        blocks:
          - type: paragraph
            body: >-
              Tanium
              围绕专利终端通信拓扑构建，在局域网网段内以自适应线性链取代了传统的中心辐射型（hub-and-spoke）模型。传统系统管理软件中，中心化服务器跨广域网单独直连每台纳管终端，在全网打补丁和遥测查询时极易引发
              WAN 拥堵、严重的数据库瓶颈以及长达数小时乃至数周的延迟。Tanium 部署轻量化终端 agent 实现通信去中心化：agent 定期轮询 Tanium Server
              以感知相邻设备，并在本地子网内动态建立点对点通信链。这一架构下，中心化 Tanium Server 发起查询或操作指令时仅需联系每条线性链首部的头节点。指令与遥测数据借助低延迟 LAN
              连接在相邻终端之间依次顺次传递，汇聚后的响应直接由链尾终端回传至服务器。这种拓扑大幅削减了 WAN 开销与服务器并发连接数。例如，在传统架构下向 10,000 台机器分发 372 MB 的 Windows
              更新包需要 10,000 个独立连接并消耗 3.72 TB 的 WAN 流量；而在由 100 台机器组成的 Tanium 链中，文件只需跨 WAN 传输一次便可在 LAN 内点对点分发，外部带宽消耗最高可削减
              99%。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
