      - number: '5.2'
        title: 产品模块、集成方式与生态可扩展性
        blocks:
          - type: paragraph
            body: >-
              Tanium 的功能边界涵盖终端管理、资产发现、安全合规、威胁狩猎与自动化修复，通过独立的功能模块与公开文档的集成接口对外提供。为连接外部 IT 与安全系统，Tanium
              针对延迟、数据流向及扩展性要求，提供了多种程序化集成方式。GraphQL API Gateway 作为主流现代化接口，用于查询在线与离线系统、触发操作下发以及管理计算机分组。向下游目标（如 SIEM、syslog
              收集器、webhook 及对象存储）进行的定时或事件驱动数据导出，由 Tanium Connect 模块统一处理。针对特定目标的细粒度取证、实时排查与深度溯源分析，Direct Connect
              可建立实时会话以获取即时资源利用率并执行 Threat Response 响应动作，且不至于瘫痪网络基础设施。针对传统专用组件，特定方案的 REST API 提供了定向机制，例如用于退役系统的 Asset API
              以及用于隔离动作的 Threat Response REST 端点。但 Tanium 明确限制了集成访问权限，警告未经文档说明的 API 或未经批准的自定义脚本存在导致数据损坏与集群不稳定的风险，凸显出严格
              API 治理的必要性。
