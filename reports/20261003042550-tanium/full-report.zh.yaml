      - number: '2.4'
        title: 增长驱动因素、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              混合办公、上云、运营技术（OT）以及更多样化的设备类型，增加了采购方必须盘点、打补丁与保障安全的终端设备基数。漏洞被利用速度加快以及披露合规义务收紧，强化了企业对实时数据和更短修复周期的需求；不过所引用的 SEC
              讨论出自 Tanium 2024 年发布的一篇文章，不应视作当下的法律建议。落地部署并非毫无阻力：ISG
              提醒称混合环境下的配置与集成工作可能推迟价值兑现，竞对编写的定价指南也指出专业服务、高级支持、用量补缴（true-up）、版本升级、遥测以及内部人工投入，可能推高首年总成本，远超名义软件授权费。估值判断不应只看品类增速，核心在于
              Tanium 能否证明自身具备快速部署能力、持续的模块使用率、可量化的整合降本效益，以及避免产生闲置软件（shelfware）的净扩张能力。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: SAM 与 SOM 仍无定论
            body: >-
              要测算具备可信度的可服务市场，需要掌握目标客群当前的合格终端数量、地域与监管准入范围、实际折扣水平、模块搭配率、续约行为以及 Tanium
              的真实竞标胜率。指定证据库中均未提供上述数据，因此直接将价格区间套用至宽泛的设备规模只会产生虚假的精确性。
            calloutType: risk
