      - number: '1.3'
        title: 资本结构、扩张轨迹与尽调视角
        blocks:
          - type: paragraph
            body: >-
              Tanium 在已披露的 12 轮融资中累计获得约 $1.1B 股权资本；其最高估值锚定在 2021 年 1 月完成的 $150M Series F 轮融资，投后估值达 $9.0B。公司的股权结构表汇集了
              Andreessen Horowitz、TPG 和 Salesforce Ventures
              等一线机构投资者；持续注入的资本提供了长达数年的流动性缓冲，让管理层有底气抵御公开市场上市压力。尽管第三方数据平台显示公司员工规模达到 1,900
              人或以上，但管理层官方口径对经核验的年经常性收入（ARR）、净留存率（NRR）、毛利率构成及 GAAP
              营业利润率保持严格保密。此外，随着美国证券交易委员会（SEC）的数据泄露披露规则与拟议的网络监管标准对企业终端运营方施加严格的 48
              小时通报窗口，金融服务业客户面临的合规执法环境日趋严苛。梳理历史里程碑可见，公司技术迭代虽快，资本结构的不透明度却在持续加剧。
