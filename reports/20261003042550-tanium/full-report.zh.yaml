  - id: FV001
    title: Tanium 投资决策与建议推导流
    type: flow
    summary: 决策架构梳理了从可观测商业规模与老股估值折价，一路推导至「继续研究」立场的完整分析路径。
    data:
      nodes:
        - id: enterprise-scale
          label: 企业级规模（$430M+ 体量与 Fortune 100 客户版图）
        - id: product-evolution
          label: 产品演进（自主 IT 与实时查询架构）
        - id: information-opacity
          label: 信息不透明（未披露经审计 ARR、NRR 或股权结构表）
        - id: valuation-divergence
          label: 估值分化（$9.0B 一级市场高点 vs $3.7B 老股交易）
        - id: scenarios-modeling
          label: 情景建模（$1.5B 悲观情景至 $7.0B 乐观情景估值区间）
        - id: underwriting-stance
          label: 投资研判立场（估值偏高下的「继续研究」立场）
      edges:
        - from: enterprise-scale
          to: product-evolution
        - from: product-evolution
          to: information-opacity
        - from: information-opacity
          to: valuation-divergence
        - from: valuation-divergence
          to: scenarios-modeling
        - from: scenarios-modeling
          to: underwriting-stance
    approximationNotes: 推导流程图展示了从可观测商业体量出发，穿透财务不透明度，最终得出投资建议的分析递进逻辑。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV010
      - CV015
