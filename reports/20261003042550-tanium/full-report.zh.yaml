      - number: '8.2'
        title: 融资历史、估值基准与估值倍数参照
        blocks:
          - type: paragraph
            body: >-
              Tanium 的股权融资历史显示，自成立以来历经 12 轮融资累计获得 $1.06B 股权资金 [CV007]。其一级市场估值在 2020 年 6 月至 2021 年 1 月达到 $9.0B 峰值；该轮
              $150M Series F 扩融由 Fidelity、Baillie Gifford、T. Rowe Price、Salesforce Ventures 以及 Ontario Teachers' Pension
              Plan 联合领投 [CV004, CV008]。然而，近期的非公开老股交易数据与市场研报显示其估值较峰值大幅缩水：Nasdaq Private Market 的二级交易基准显示截至 2026 年 9
              月预估每股股价为 $3.79，市场情报机构对 Tanium 当前私募市场估值的评估约为 $3.72B [CV009, CV010]。市场研究机构还指出，对应 2024 年预估 $700.0M
              的收入，其市销率估值倍数为 3.6x [CV011]。与 SentinelOne 等上市网络安全同行相比，这种估值落差尤为明显：高成长上市终端安全同行的远期市销率在 5.0x 至 8.0x 之间，且具备透明的
              GAAP 营业利润率；而 Tanium 财务数据未经审计，加上优先股堆叠（清算优先权），使得普通股价值面临大幅折价 [CV012]。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV015
      - number: '8.3'
        title: 情景分析、退出准备度与投资评估建议
        blocks:
          - type: paragraph
            body: >-
              在当前市场环境下对 Tanium 进行投资评估，我们结合运营规模与市场估值倍数设定了乐观、基准与悲观三种情景 [CV013]。在乐观情景（bull case）下，Tanium 加速渗透自主 IT 市场，将 ARR
              推升至 $1.0B，并以 7.0x 的估值倍数完成 IPO，对应企业估值为 $7.0B [CV014]。在基准情景（base case）下，企业客户拓展保持稳健，对应 $750M 至 $800M 的 ARR 给予
              4.0x 估值倍数，支撑 $3.0B 至 $3.2B 的估值，与当前二级市场交易指标高度吻合 [CV014]。在悲观情景（bear
              case）下，大厂商捆绑套件带来的竞争替代以及宏观采购周期拉长导致收入承压，估值倍数压缩至 2.5x，企业价值降至 $1.5B 至 $1.8B，并触发次级股权持有人的清算优先权挤压损失
              [CV014]。综合权衡各种概率，给出的投资建议为继续研究（research-more），置信度为中（medium），反映出在缺乏经核验证实的基本面支撑下估值偏高（stretched）的审慎立场
              [CV015]。在做出实质性资金投入之前，尽调重点必须放在获取经审计的 ARR、毛利率、客户集中度以及 Series F 轮优先股堆叠（清算优先权）细节上 [CV016]。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 应对非公开二级市场估值倒挂
            body: >-
              Tanium 账面上的 $9.0 billion 估值，仍是 2020-2021 年后期融资周期的历史遗存，缺乏实际支撑。私募老股交易指标对公司的估值约 $3.72B 到每股
              $3.79，潜在投资人在考虑出资前，必须严审优先股堆叠及经审计的 ARR。
            calloutType: recommendation
            claimRefs:
              - CV004
