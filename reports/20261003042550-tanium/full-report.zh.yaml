      - number: '6.3'
        title: 留存韧性、增购扩张机制与客户集中度瓶颈
        blocks:
          - type: paragraph
            body: >-
              Tanium 的业务韧性建立在对客户基础设施的深度架构绑定之上；一旦在终端完成部署，更换替代方案在技术与运维上代价极高 [CU001, CU011]。2026 年中发布 Tanium Atlas
              后，公司形成了一条增购扩张飞轮：向其存量超过 3600 万台终端推销自主 AI 智能体能力 [CU011]。在正式商用（GA）数周内，便有超过 1,300 家客户组织部署了
              Atlas，展现出在存量商业云与政府客户群中强劲的内生增购动能 [CU008]。渠道层面，与 vArmour 等安全伙伴的技术集成方案及托管服务商为公司搭建了多层级分销网络 [CU002,
              CU005]。然而，客户黏性仍面临结构性风险：金融行业客户承受着日益严苛的 SEC 合规压力，任何运维中断都会招致重罚 [CU012]；而标准合同条款对软件责任设立了上限并免责中断服务，关键风险实质由企业买方承担
              [CU013]。至关重要的是，Tanium 对总收入留存率（GRR）、净收入留存率（NRR）以及前十大客户收入集中度完全未作披露 [CU006]。
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU008
              - CU011
              - CU012
              - CU013
