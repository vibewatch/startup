      - number: '7.2'
        title: 监管、法律与合同风险敞口
        blocks:
          - type: paragraph
            body: >-
              Tanium 自身的合规指南将合法合规、人工监督、持续监控、文档留存及审计追踪列为企业级 AI 的核心要求。其 2024
              年关于金融服务业的分析亦指出美国网络合规通报提案重叠、通报窗口紧迫且落地时间表未定；该资料是合规复杂性的有效佐证，但并非监管机构的现行正式裁定。其公开授权条款将安装、配置、升级、访问控制、网络安全与数据保护均划归为客户的运营责任，并提醒该软件并未针对存储或处理特定敏感数据进行设计。当系统故障跨越产品自身行为与客户配置的界限时，这种责任划定可能引发落地与合同纠纷风险。目前的诉讼、执法动向、认证以及各司法管辖区的具体合规状态，仍需依靠一手资料开展尽调。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
