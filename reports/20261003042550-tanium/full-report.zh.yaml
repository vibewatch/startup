      - number: '3.3'
        title: 定价结构、SKU 繁复与企业客户折扣机制
        blocks:
          - type: paragraph
            body: >-
              Tanium 的商业策略以定制化、销售主导的企业级定价为特征，给客户采购团队带来显著的商务博弈摩擦。厂商未公布官方公开价目表，要求客户经由正式采购渠道谈判部署，并强制要求至少纳管 2,000
              台终端。企业基准数据显示，基础核心平台授权费用约为每年每台终端 $20 至 $24。但若要获得实用的运维与安全能力，必须叠加采购专用模块 SKU，包括 Threat Response（每年每终端 $15 至
              $22）、Comply（每终端 $10 至 $14）、Patch（每终端 $8 至 $12）以及 Deploy（每终端 $10 至
              $14）。完整的自主终端管理（AEM）全套套件合同，在计入必选专业服务之前，年费通常高达每终端 $60 至 $90；而专业服务往往会使首年部署成本进一步增加 20% 至
              40%。官方目录价对设备规模的自发扩张缺乏阶梯优惠，遭遇并购整合或混合云扩张的企业在续约周期中往往面临大幅成本攀升。为缓解价格压力，企业采购团队通常拿 CrowdStrike Falcon 或 Microsoft
              Defender for Endpoint 的书面竞标方案作为谈判筹码，往往能拿到较 XEM 目录价低 30% 至 48% 的实际折扣。此外，临近 Tanium 1 月 31
              日的财年截止日，交易审批部门面临业绩冲刺压力，战略采购方常能借此锁定续约价格上限并争取打包优惠。
            claimRefs:
