chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、运营概况与战略定位
        blocks:
          - type: paragraph
            body: >-
              Tanium Inc. 是一家专注于统一终端管理（UEM）与自主 IT 运维（Autonomous IT）的后期风投支持企业级软件提供商。公司由 David Hindawi 和 Orion Hindawi 父子于
              2007 年创立，设立双重企业与运营中心：总部位于华盛顿州 Kirkland，同时在加利福尼亚州 Emeryville 的 2100 Powell Street
              设有大规模管理及运营基地。其核心平台基于分布式点对点终端架构，使安全与基础设施团队能在数秒内对分布式计算设备集群完成查询、打补丁与故障修复。2026 年，Tanium 将核心市场叙事转向自主 IT，围绕
              Tanium Atlas 重新组织产品包装；这一自主运行层融合了系统级环境智能体、持续环境观测与闭环终端修复能力，无需手动切换工具即可实现复杂 IT 工作流的自动化。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
