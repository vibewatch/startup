  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：终端运维与安全，而非全部企业级 IT
        blocks:
          - type: paragraph
            body: >-
              具备防御力的市场边界始于纳管终端以及在终端上执行的工作流：资产盘点、可见性、补丁管理、配置合规、漏洞修复以及威胁响应。Tanium 将上述能力打包为一个平台；而 ISG
              则将相邻的数字员工体验（DEX）类别定义为围绕终端、应用、操作系统和网络触点遥测构建，旨在改善员工技术体验。现有证据并不支持将所有网络安全、IT 服务管理、移动设备管理、云安全或通用 AI
              支出均视为可服务市场。一份竞对编写的定价指南还指出，原生 iOS 和 Android 管理仍不在 Tanium
              的覆盖范围内，且容器是通过宿主操作系统计费，因此这些边界需要采购方在实际选型中核实。现状并非单一命名的产品门类，而是割裂的 IT 与安全工具、人工交接以及存量终端管理流程的混合体。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
