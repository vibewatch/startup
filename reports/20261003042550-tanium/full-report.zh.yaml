        title: Exhibits
        blocks:
          - type: callout
            title: 自主操作必须具备可逆性
            body: 尽调的核心考量不在于 Tanium 能否迅速发起修复，而在于自动化策略出错时，客户能否有效限制影响范围、对高风险操作进行审批、核验处置结果并及时恢复业务运行。
