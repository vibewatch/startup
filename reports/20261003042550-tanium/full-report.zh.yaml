      - number: '2.3'
        title: 买方、使用者、出资方与采购路径
        blocks:
          - type: paragraph
            body: >-
              最强匹配信号来自企业环境的复杂度，而非单纯的公司规模。ISG 将中端市场组织与大型客户区分开来，而据报道的 Forrester 评估报告则专门将 Tanium 与广泛、复杂的 IT
              和运营技术（OT）终端环境联系在一起。CIO、CISO 和采购部门都能影响最终候选名单，但日常使用者集中在终端工程、IT
              运维、漏洞管理以及安全运维团队。公司在公共部门的准入渠道亦可通过供应商发布的英国政府电子采购目录名录印证，但该名录属于合作伙伴层面的证据，而非政府对成效的官方验证。预期的采购路径始于资产盘点或打补丁痛点，逐步扩展至合规与应急响应，并可能向打包的
              AEM 演进；预算归属权与交叉销售率仍未公开披露。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
