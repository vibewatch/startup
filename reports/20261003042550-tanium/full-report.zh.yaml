        - 2026 年 8 月的日本 EULA 文本明确界定了客户环境的各项职责，并警告不要在被许可软件中处理特定敏感数据。
        - 中
        - 高
        - 架构审查、配置基线、访问控制、升级规范、DPA 审查以及明确的数据流向限制。
        - 中高，尤其在运维职责共担但故障定责不明确的情况下。
        - 审查已签署的客户协议、DPA 条款、谈判例外条款、数据流向、技术支持边界及历史争议记录。
    notes: 严重程度排序仅为基于留存公开来源的分析研判；目前缺少监管机构、法院、合规认证及已签署合同的最新证据。
    enumerationScope:
      coverage: sample
      basis: >-
        Public risk categories identifiable in the assigned Tanium legal and compliance sources as of the 2026-10-03 run
        date.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
  - id: TR002
    title: 运营、质量与安全风险登记表
    columns:
      - 失效模式
      - 发生概率
      - 严重程度
      - 缓解成熟度
      - 残余风险敞口
      - 监控指标
      - 未决缺口
    rows:
      - - 策略或自主工作流错误修改了大量特权终端。
        - 中
        - 高
        - 声称的控制措施包括安全护栏、签批流程、治理机制及可审计性；生产环境表现尚未得到独立证实。
        - 高
        - 回滚频率、操作失败率、异常调用量、爆炸半径限制越界次数及恢复耗时。
        - 所分配材料未见量化生产环境失败率、回滚耗时或客户对全自主操作的采用度。
      - - 终端状态不完整或过时导致错误的修复决策。
        - 中
        - 高
        - Tanium 与独立评论均强调实时数据与修复后验证。
        - 中高
        - 遥测数据新鲜度、不可达终端占比、验证失败次数，以及部署进度与风险敞口削减之间的脱节。
        - 分配材料池中没有任何独立基准测试衡量覆盖完整性或验证准确率。
      - - 客户配置、访问控制或更新习惯削弱了产品安全性。
        - 中
        - 高
        - 合同条款将安装、维护、升级、访问控制、网络安全及数据保护职责归于客户。
        - 中高
        - 不受支持版本占比、特权访问异常、升级滞后、配置漂移以及技术支持升级工单。
        - 已签署合同与全量设备合规数据未公开。
      - - 公布的有效性指标夸大了生产环境下的普适成效。
        - 中
        - 中
        - 官网公布了削减 97% 漏洞的指标，但抓取文本缺失分母、统计客群、时间跨度及实名出处归属。
        - 中
        - 指标定义、适用客群分母、观察周期、剔除项及独立客户复现情况。
        - 底层研究设计与客户层面的分布数据无法获取。
    notes: 发生概率与严重程度均为风险研判，而非实测事件频率；生产环境失效率证据缺失被列为明确缺口。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR011
      - CR016
  - id: TR003
    title: 合作伙伴与外部依赖风险登记表
    columns:
      - 依赖项
      - 交易对手 / 角色
      - 集中度证据
      - 故障情景
      - 严重程度
      - 缓解措施
      - 残余风险敞口
    rows:
      - - 企业工作流连接器
        - ServiceNow、Microsoft、Splunk 及 AI 客户端集成负责分发 Tanium 的数据与操作指令。
        - 官网列出了集成合作方，但未披露收入或部署集中度。
        - API、权限、产品政策或商业条款的变动可能干扰工作流，或削弱产品差异化优势。
        - 高
        - 连接器多版本管理、合同保护条款、兜底备用工作流、兼容性测试以及多元化集成使用。
        - 在审查连接器级使用情况与历史故障记录前保持为中高。
      - - 以 Windows 和微软为核心的终端资产
        - 微软为众多目标客户提供操作系统、身份认证、设备管理与安全层技术。
        - 分配资料中没有任何来源量化 Tanium 来自 Windows 或与微软关联的收入份额。
        - 微软自带的捆绑原生工具压缩了 Tanium 的增量价值感知与采购预算空间。
        - 高
        - 证明对异构设备群的覆盖能力、更快速且经实测的修复效果，以及超越捆绑工具的可衡量价值。
        - 高，因平台型竞争与客户供应商归并整合仍在持续。
      - - 客户运营模式与变更治理
        - 客户的 IT、安全、法务与数据团队负责配置和审批部署方案。
        - 合同措辞将多项环境与安全职责归于客户；集中度未予披露。
        - 客户内部管控薄弱可能引发归咎于平台的故障、拖延部署进度，或推高技术支持成本。
        - 高
        - 参考架构、部署阶段卡点、培训体系、策略模板以及受监控的升级合规机制。
        - 中高，因缺少实施耗时、支持负担及失败部署的分群数据。
      - - 私募资本与信息中介机构
        - 投资人、二级市场数据服务商及管理层披露共同界定了估值与流动性预期。
        - 一家聚合平台援引了 2021 年 1 月 $9 billion 估值与 $1.1 billion 融资金额；当前现金及优先清算权集中度未知。
        - 过时的估值锚点、估值下调融资（down-round）或沉重的优先清算权叠加，均会损害普通股回报与员工流动性。
        - 高
        - 应依据最新的经审计财务报表、股权结构表（cap table）、409A 估值或要约收购证据、负债、现金及优先清算权条款开展投资评估。
        - 高，因为已融资金不等于账面可用现金，且当前普通股价值未公开。
    notes: 所列集成合作方与私募市场数据均为公开渠道的观察结果；集中度、流动性与交易对手风险敞口仍需管理层提供证据。
    claimRefs:
      - CR003
      - CR004
      - CR009
      - CR010
      - CR011
      - CR013
      - CR014
      - CR015
  - id: TV001
    title: 投资研判建议与治理摘要
    columns:
      - 评估维度
      - 投资立场
      - 置信度 / 评级
      - 核心支撑证据
      - 决策影响
    rows:
      - - 投资建议
        - 继续研究
        - 中
        - 顶峰轮次 $9.0B 估值与 $3.7B 二级市场标价之间存在重大脱节
        - 在经审计的 ARR 及客户留存率披露前，暂缓追加新的成长型股权出资。
      - - 估值立场
        - 偏高
        - 高
        - 2021 年一级市场 $9.0B 的峰值估值反映了当时处于历史顶部的软件行业估值倍数
        - 仅在二级市场标价低于 $3.8B 时方可考虑投资，或要求设置强力优先清算保护条款。
      - - 风险评级
        - 高
        - 高
        - 缺少公开财务报告、面临 SEC 合规审查以及激烈的平台型竞争
        - 在确认性尽调阶段必须索取完整的 409A 估值历史、股权结构表及审计报告。
      - - 目标回报 / 退出路径
        - 1.5x - 2.2x MOIC（投资资本回报倍数）
        - 中
        - 仅在 ARR 增速重新回升至 20% 以上时，公开 IPO 或战略出售才具可行性
        - 目标入场估值需低于 4.0x ARR，方可达到机构投资者的最低回报门槛。
    notes: 总结了针对 Tanium 的核心投资研判结论、置信度评分及机构决策影响。
    claimRefs:
      - CV004
      - CV010
      - CV015
      - CV016
  - id: TV002
    title: 投资逻辑与反向逻辑分析框架
    columns:
      - 核心支柱
      - 正向投资逻辑
      - 反向风险论点
      - 扭转观点的关键变量
    rows:
      - - 市场地位
        - 具备经受检验的企业级规模，已深入部署于财富 100 强（Fortune 100）并获联邦国防机构深度采用
        - 市场对其仍存传统本地部署（on-premises）架构的固有认知，且面临云原生同行的激烈竞争
        - 独立审计证实其云原生客户采用度及 ARR 增速重新加快。
      - - 产品与技术
        - 独特的线性链式架构，支持对资产的实时查询与自主修复
        - 关键服务器上的运维爆炸半径隐患，以及 IT 团队潜在的变更抵触
        - 实测客户遥测数据显示自动化修复采用率高，且实现零系统停机时间。
      - - 财务可见度
        - 历史上曾达到 $430M+ 的收入规模，且调整后 EBITDA 与经营现金流均为正
        - 当前收入运行率、毛利率及客户群体留存率完全不透明
        - 管理层提供经审计的利润表及客户分群净留存率指标。
      - - 估值与资本结构
        - 汇聚 Fidelity、T. Rowe Price、TPG 及 Baillie Gifford 等蓝筹机构投资银团
        - 沉重的优先股堆叠（清算优先权），且二级市场标价在 $3.72B-$3.79B 附近徘徊
        - 最新的 409A 估值或不带严苛附加条款的新股融资设立了可信的公开估值底线。
    notes: 对比了核心看多投资逻辑与结构性下行风险，并列出持续监测的催化因素。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV010
  - id: TV003
    title: 投资研判情景与估值敏感性分析
    columns:
      - 情景
      - 运营与财务假设
      - 估值与回报逻辑
      - 核心风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 达到 $1.0B；净留存率 >115%；毛利率 >75%；自主 IT 业务扩张
        - 基于 7.0x ARR 估值倍数得出 $7.0B 估值；潜在 IPO 窗口打开
        - 面对捆绑销售的 Microsoft Defender E5 未能维持企业席位增长
        - 25% - 需要大型企业签约大单明确重新加速
      - - 基准情景
        - ARR 稳定在 $750M-$800M；净留存率 ~102-105%；温和增长
        - 基于 4.0x ARR 估值倍数得出 $3.0B-$3.2B 估值；与二级市场交易行情一致
        - 流动性兑现周期进一步拉长、二级市场股价受侵蚀、核心高管流失
        - 50% - 与私募二级市场定价及同业基准最为吻合
      - - 悲观情景
        - ARR 减速至 $650M 以下；净留存率降至 95% 以下；利润率承压收窄
        - 基于 2.5x ARR 估值倍数得出 $1.5B-$1.8B 估值；发生估值下调重置或资本重组
        - 严重补丁运维事故导致停机、客户流失转向捆绑套件、发生结构性股权稀释
        - 25% - 受私募市场流动性吃紧及缺乏审计数据推高
    notes: 评估不同运营增速与估值倍数走势下潜在企业价值变化的情景分析。
    claimRefs:
      - CV010
      - CV011
      - CV013
      - CV014
figures:
  - id: FO001
    title: Tanium 公司及战略演进时间线
    type: timeline
    summary: 2007 年至 2026 年间公司创立、融资资本化、领导层变动、产品里程碑及行业认可的关键大事记。
    data:
      items:
        - date: '2007'
          label: 公司创立
          detail: David 与 Orion Hindawi 在 Kirkland/Emeryville 创立 Tanium，开创高速对等网络（P2P）终端管理先河。
        - date: '2018-10-02'
          label: F 轮成长期融资
          detail: 完成 $200M 融资以拓展国际业务并强化企业安全能力。
        - date: '2021-01-27'
          label: $9B 估值里程碑
          detail: 在知名企业风投机构支持下完成 $150M 一级市场融资，投后估值达到 $9.0B。
        - date: '2021-12-01'
          label: 上市筹备评估
          detail: 任命首席财务官 Marc Levine，主持拟议公开发行上市的组织筹备与审计工作。
        - date: '2026-05-15'
          label: 高管离职潮
          detail: 因上市推迟及强制到岗办公引发内部摩擦，法务、人力资源、市场及安全条线的 5 位高管相继离职。
        - date: '2026-05-29'
          label: Censys 安全联盟
          detail: 宣布与 Censys 建立外部攻击面集成合作，整合持续暴露数据与终端数据。
        - date: '2026-06-09'
          label: 获评 Forrester Wave 领导者
          detail: 在 2026 年 Q2 终端管理平台报告中获评领导者（Leader），愿景、创新及采用度评分斩获最高分。
        - date: '2026-08-20'
          label: Orion Hindawi 重任 CEO
          detail: 随着 Dan Streetman 卸任，联合创始人 Orion Hindawi 重掌 CEO 帅印，带领 Tanium 转向以自主 AI 运维为核心。
        - date: '2026-09-25'
          label: Atlas 软件资产可见性发布
          detail: 发布 Tanium Atlas 软件资产管理更新，引入 AI 置信度评分及自然语言许可修正规则。
    approximationNotes: 时间线事件均采纳企业公告、行业分析师研报及深度调查报道中已核实的公开日期。
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO006
      - CO007
      - CO008
      - CO010
      - CO011
      - CO012
      - CO015
