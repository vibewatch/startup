chapter:
  number: 2
  title: "Market Analysis"
  summary: "Tanium addresses overlapping endpoint-management, endpoint-security, digital-employee-experience, and automation budgets, with the strongest evidence pointing to complex enterprise and public-sector estates rather than a universal endpoint market. The assigned evidence supports a $1.15 billion FY25 DEX category estimate and directional per-endpoint pricing, but it does not support a defensible Tanium-specific TAM, SAM, or SOM."
sections:
  - id: "market-boundary"
    title: "Market Boundary: Endpoint Operations and Security, Not All Enterprise IT"
    body: >-
      The defensible boundary starts with managed endpoints and the workflows performed on
      them: inventory, visibility, patching, configuration compliance, vulnerability
      remediation, and threat response. Tanium presents those functions as one platform,
      while ISG defines the adjacent DEX category around endpoint, application, operating
      system, and network-touchpoint telemetry used to improve employee technology
      experience. The evidence does not support treating all cybersecurity, IT service
      management, mobile-device management, cloud security, or generic AI spending as
      addressable. A competitor-authored pricing guide further reports that native iOS and
      Android management remains outside Tanium's coverage and that containers are counted
      through host operating systems, so those boundaries require buyer-level verification.
      The status quo is a mix of separate IT and security tools, manual handoffs, and
      incumbent endpoint-management processes rather than a single named product category.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Sizing Lenses: Useful Markers Without a Fabricated TAM"
    body: >-
      The only sourced category-revenue series in the assigned pool is for DEX software:
      $0.97 billion in FY24, $1.15 billion in FY25, and a $4.25 billion projection for
      2033. That series is an adjacency, not a Tanium TAM, because the platform also spans
      endpoint administration and security workflows while the DEX estimate excludes much
      of that spend. A second lens is adoption: Tanium relays a Gartner forecast that more
      than 50% of organizations will adopt AEM capabilities by 2029, but the underlying
      Gartner material is not in the pool and adoption is not revenue. A third lens is
      contract economics: a competitor-authored guide reports a $20-$24 annual core price
      per endpoint at a 2,000-endpoint minimum and higher multi-module ranges. These markers
      constrain opportunity analysis but cannot establish SAM or SOM without eligible fleet,
      attach-rate, discount, and customer-mix data.
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyer, User, Payer, and Adoption Path"
    body: >-
      The strongest fit signal is enterprise complexity rather than company size alone.
      ISG distinguishes midmarket organizations from large accounts, while the reported
      Forrester assessment specifically associates Tanium with broad, complex IT and
      operational-technology endpoint environments. CIO, CISO, and procurement functions
      can all influence a shortlist, but daily users sit in endpoint engineering, IT
      operations, vulnerability management, and security operations. Public-sector access
      is also visible through a UK government marketplace listing issued by a supplier,
      although that listing is partner evidence rather than government validation of
      outcomes. The likely adoption path begins with inventory or patching pain, expands
      into compliance and response, and may shift toward bundled AEM; budget ownership and
      cross-sell rates remain undisclosed.
    claimRefs:
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM012"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints"
    title: "Growth Drivers, Constraints, and Valuation Relevance"
    body: >-
      Hybrid work, cloud adoption, operational technology, and a wider device mix increase
      the endpoint population that buyers must inventory, patch, and secure. Faster
      vulnerability exploitation and disclosure obligations strengthen the case for
      real-time data and shorter remediation cycles, although the cited SEC discussion is
      a 2024 Tanium article and should not be treated as current legal advice. Adoption is
      not frictionless: ISG cautions that configuration and integration work in hybrid
      environments can delay value, and the competitor-authored pricing guide says
      professional services, premium support, true-ups, upgrades, telemetry, and internal
      labor can push first-year cost above the headline license. For valuation, category
      growth therefore matters less than whether Tanium can prove rapid deployment,
      sustained module use, measurable consolidation savings, and expansion without
      shelfware.
    claimRefs:
      - "CM013"
      - "CM014"
      - "CM015"
      - "CM016"
