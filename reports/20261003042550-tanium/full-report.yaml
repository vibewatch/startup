  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is execution at scale. Tanium says Atlas applies guardrails, sign-off, and
              auditability to multi-step workflows, but independent commentary warns that a bad enforcement policy
              deployed broadly can create an outage. That combination supports a high-impact, medium-likelihood
              assessment rather than an assumption that governance is already proven in production. The thesis should
              break if management cannot demonstrate staged rollout, exception handling, rollback testing, and
              post-action verification for privileged changes. Other high residual risks are an evolving AI and
              cyber-reporting compliance patchwork, dependence on major workflow and endpoint ecosystems, and limited
              public evidence for current operating and private-market metrics. A customer-transparency
              security-engineering job repost is a staffing signal, not proof that the controls are mature.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
