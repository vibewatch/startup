              - CU008
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale Advantage Meets Private Opacity
            body: >-
              Tanium's footprint of over 36 million endpoints and rapid uptake of Atlas by more than 1,300 organizations
              demonstrate genuine product pull. However, the complete absence of customer cohort retention figures,
              gross churn rates, and revenue concentration disclosures creates significant diligence friction for
              institutional investors evaluating durability.
            calloutType: insight
            claimRefs:
