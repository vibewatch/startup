  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Enterprise workflow connectors
        - ServiceNow, Microsoft, Splunk, and AI-client integrations distribute Tanium data and actions.
        - The homepage names integrations but does not disclose revenue or deployment concentration.
        - API, permission, product-policy, or commercial changes disrupt workflows or reduce differentiation.
        - High
        - >-
          Versioned connectors, contract protections, fallback workflows, compatibility tests, and diversified
          integration usage.
        - Medium-high until connector-level usage and incident history are reviewed.
      - - Windows and Microsoft-centered endpoint estates
        - Microsoft supplies operating-system, identity, management, and security layers used by many target customers.
        - No assigned source quantifies Tanium's Windows or Microsoft-linked revenue share.
        - Bundled native tooling narrows Tanium's incremental value or procurement budget.
        - High
        - Prove heterogeneous-fleet coverage, faster verified remediation, and measurable value beyond bundled tools.
        - High because platform competition and customer consolidation are continuing.
      - - Customer operating model and change governance
        - Customer IT, security, legal, and data teams configure and approve deployment.
        - Contract language assigns multiple environment and security duties to customers; concentration is undisclosed.
        - Weak customer controls cause failures attributed to the platform, delay deployment, or increase support cost.
        - High
        - Reference architectures, deployment gates, training, policy templates, and monitored upgrade compliance.
        - Medium-high without cohort data for implementation time, support burden, and failed deployments.
      - - Private capital and information intermediaries
        - Investors, secondary-market data providers, and management disclosures frame valuation and liquidity.
        - >-
          One aggregator cites a January 2021 $9 billion valuation and $1.1 billion raised; current cash and preference
          concentration are unknown.
        - >-
          A stale valuation anchor, down-round, or preference overhang impairs common-equity returns and employee
          liquidity.
        - High
        - >-
          Underwrite from current audited financials, cap table, 409A or tender evidence, debt, cash, and preference
          terms.
        - High because funding raised is not cash available and current common-equity value is not public.
    notes: >-
      Named integrations and private-market figures are public-source observations; concentration, liquidity, and
      counterparty exposure require management evidence.
