  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Endpoint Operations and Security, Not All Enterprise IT'
        blocks:
          - type: paragraph
            body: >-
              The defensible boundary starts with managed endpoints and the workflows performed on them: inventory,
              visibility, patching, configuration compliance, vulnerability remediation, and threat response. Tanium
              presents those functions as one platform, while ISG defines the adjacent DEX category around endpoint,
              application, operating system, and network-touchpoint telemetry used to improve employee technology
              experience. The evidence does not support treating all cybersecurity, IT service management, mobile-device
              management, cloud security, or generic AI spending as addressable. A competitor-authored pricing guide
              further reports that native iOS and Android management remains outside Tanium's coverage and that
              containers are counted through host operating systems, so those boundaries require buyer-level
              verification. The status quo is a mix of separate IT and security tools, manual handoffs, and incumbent
              endpoint-management processes rather than a single named product category.
