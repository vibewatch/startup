              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Autonomy must be reversible
            body: >-
              The central diligence test is not whether Tanium can initiate remediation quickly, but whether a customer
              can constrain scope, approve high-risk actions, verify outcomes, and restore service when an automated
              policy is wrong.
            calloutType: risk
            claimRefs:
              - CR001
