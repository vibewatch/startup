      - number: '1.2'
        title: Executive Leadership, Governance Transitions, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Governance and operational direction at Tanium have remained tightly bound to its founding family across
              nearly two decades of operation. Following an earlier tenure as CEO from 2016 to 2023, co-founder and
              executive chairman Orion Hindawi was reappointed Chief Executive Officer on August 20, 2026, succeeding
              Dan Streetman, who stepped down after a three-year term leading go-to-market scaling. Concurrently,
              co-founder David Hindawi returned to the role of Chairman of the Board, while Streetman transitioned into
              an advisory role. The executive shift followed an acute period of senior management turnover in the spring
              of 2026, during which Tanium lost five top executives including Chief Legal Officer Brady Mickelsen, Chief
              People Officer Tobias Julén, Chief Information Security Officer Chris Hallenbeck, and Chief Marketing
              Officer Tara Ryan, alongside the brief tenure and resignation of incoming CPO Carol MacKinlay. These
              departures occurred amid employee and leadership friction over indefinite IPO delays, rigid
              return-to-office equity withholding policies, and executive relocation constraints, highlighting
              significant key-person dependence on Orion Hindawi to anchor long-term organizational stability.
