chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Profile, and Strategic Positioning
        blocks:
          - type: paragraph
            body: >-
              Tanium Inc. operates as a late-stage venture-backed enterprise software provider specializing in unified
              endpoint management (UEM) and autonomous IT operations. Founded in 2007 by the father-and-son team of
              David Hindawi and Orion Hindawi, the business operates dual corporate and operating centers, maintaining
              headquarters in Kirkland, Washington alongside extensive executive and operational facilities at 2100
              Powell Street in Emeryville, California. The company's core platform enables security and infrastructure
              teams to query, patch, and remediate distributed computing fleets within seconds using a distributed
              peer-to-peer endpoint architecture. In 2026, Tanium transitioned its primary market narrative toward
              Autonomous IT, anchoring product packaging around Tanium Atlas, an autonomous operating layer that
              combines system-level ambient agents, continuous environmental observation, and closed-loop endpoint
              remediation to automate complex IT workflows without manual tool switching.
            claimRefs:
              - CO001
