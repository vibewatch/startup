      - number: '6.3'
        title: Retention Durability, Land-and-Expand Mechanics, and Concentration Friction
        blocks:
          - type: paragraph
            body: >-
              Tanium's durability relies on deep architectural embedding across customer infrastructure, making
              displacement technically and operationally disruptive once deployed across endpoints [CU001, CU011]. With
              the release of Tanium Atlas in mid-2026, the company introduced an expansion loop that upsells autonomous
              AI agent capabilities to its existing base of over 36 million endpoints [CU011]. More than 1,300 customer
              organizations deployed Atlas within weeks of general availability, demonstrating strong organic
              land-and-expand momentum within the installed commercial cloud and government client base [CU008]. In the
              channel, technology integration programs with security partners like vArmour and managed service providers
              provide multi-tiered distribution [CU002, CU005]. Nevertheless, customer durability faces structural
              risks: financial sector customers confront escalating SEC compliance burdens that penalize operational
              disruption [CU012], while standard contractual terms cap software liability and disclaim uninterrupted
              availability, leaving critical risks with enterprise buyers [CU013]. Crucially, Tanium maintains complete
              opacity regarding gross revenue retention (GRR), net revenue retention (NRR), and top-ten customer revenue
              concentration [CU006].
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU008
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
