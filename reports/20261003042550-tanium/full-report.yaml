  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Tanium rests on its defensible position as an enterprise-scale endpoint
              control plane capable of sub-minute querying, patching, and automated remediation across millions of
              endpoints [CV001]. With verified historical scale exceeding $430 million in revenue and over 1,400
              employees by 2020, Tanium established deep penetration within demanding IT environments, including nearly
              half of the Fortune 100 and six branches of the U.S. Armed Forces [CV002]. Furthermore, its platform
              evolution from reactive monitoring toward autonomous IT and agentic workflow orchestration through Tanium
              Atlas creates expanding enterprise workflow relevance alongside IT systems of record [CV003]. However, the
              anti-thesis is equally compelling: Tanium remains an unlisted late-stage unicorn whose headline valuation
              narrative has not received primary market validation since January 2021 [CV004]. Without public disclosure
              of active customer counts, current ARR, or renewal cohorts, investors cannot determine whether net revenue
              retention remains resilient against bundled competition from Microsoft Defender and Intune [CV005].
              Moreover, shifting cybersecurity regulatory regimes, including aggressive SEC incident reporting rules and
              strict liability standards, heighten enterprise operational scrutiny on automated remediation tools
              [CV006].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV010
      - number: '8.2'
        title: Financing History, Valuation Benchmarks, and Multiple Context
        blocks:
          - type: paragraph
            body: >-
              Tanium's capitalization history reflects cumulative equity funding of $1.06B raised across 12 financing
              rounds since inception [CV007]. Its primary valuation peaked at $9.0 billion following $150 million Series
              F expansions led by Fidelity, Baillie Gifford, T. Rowe Price, Salesforce Ventures, and Ontario Teachers'
              Pension Plan between June 2020 and January 2021 [CV004, CV008]. Nevertheless, contemporary private
              secondary trading data and market analytics reveal substantial compression from peak marks: secondary
              trading benchmarks from Nasdaq Private Market indicate an estimated share price of $3.79 as of September
              2026, while market intelligence sources evaluate Tanium's current private market valuation at
              approximately $3.72 billion [CV009, CV010]. Market intelligence also reports a 3.6x revenue multiple
              against estimated 2024 revenues of $700.0 million [CV011]. Comparing Tanium against publicly traded
              cybersecurity peers such as SentinelOne highlights this divergence: while high-growth public endpoint
              peers trade at forward revenue multiples between 5.0x and 8.0x with public visibility into GAAP operating
              margins, Tanium's unverified financial profile and liquidation-preference stack leave common equity value
              heavily discounted [CV012].
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV015
      - number: '8.3'
        title: Scenario Analysis, Exit Readiness, and Underwriting Recommendation
        blocks:
          - type: paragraph
            body: >-
              To underwrite Tanium under current market conditions, we evaluate bull, base, and bear scenarios across
              operating scale and market multiples [CV013]. In the bull case, Tanium accelerates autonomous IT adoption,
              scales ARR toward $1.0 billion, and executes an IPO at a 7.0x multiple, yielding a $7.0 billion enterprise
              valuation [CV014]. In the base case, enterprise expansion remains steady at a 4.0x multiple on $750
              million to $800 million in ARR, supporting a $3.0 billion to $3.2 billion valuation that aligns closely
              with current secondary trading indicators [CV014]. In the bear case, competitive displacement by bundled
              vendor suites and macroeconomic procurement delays compress revenue to a 2.5x multiple, reducing
              enterprise value toward $1.5 billion to $1.8 billion and triggering preference overhang losses for junior
              equity holders [CV014]. Weighing these probabilities, the underwriting recommendation is research-more
              with medium confidence, reflecting a stretched valuation stance relative to unverified fundamentals
              [CV015]. Diligence priorities must focus on obtaining audited ARR, gross margins, customer concentration,
              and the Series F liquidation preference stack before underwriting capital commitments [CV016].
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Navigating the Private Secondary Valuation Disconnect
            body: >-
              Tanium's headline $9.0 billion valuation remains an unanchored relic of the late-stage 2020-2021 funding
              cycle. With private secondary indicators evaluating the company at roughly $3.72B to $3.79 per share,
              prospective investors must demand rigorous diligence on the preference stack and audited ARR before
              considering capital deployment.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV015
