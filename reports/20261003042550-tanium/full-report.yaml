            - Shadow IT discovery
            - Asset inventory normalization
        - label: 2. Exposure & Patch Hygiene
          description: >-
            Operations team establishes automated patching and vulnerability remediation workflows across servers and
            workstations.
          points: Months 2-6
          touchpoints:
            - Automated OS patch cycles
            - Vulnerability exposure reduction
            - Compliance posture validation
        - label: 3. Workflow Convergence
          description: Integration of Tanium endpoint telemetry into enterprise ITSM systems of record such as ServiceNow CMDB.
          points: Months 6-12
          touchpoints:
            - CMDB data enrichment
            - Automated incident enrichment
            - IT and SecOps team consolidation
        - label: 4. Multi-Module Expansion
          description: >-
            Expansion of licensed endpoint capabilities across performance monitoring, threat response, and file
            integrity monitoring.
          points: Months 12-18
          touchpoints:
            - Performance monitoring deployment
            - Endpoint detection and response module
            - File integrity and audit tracking
        - label: 5. Autonomous IT & Atlas AI
          description: >-
            Expansion into conversational autonomous operations, closed-loop remediation, and ambient system-level
            agents.
          points: Year 2+
          touchpoints:
