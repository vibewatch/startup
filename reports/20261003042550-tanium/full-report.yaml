  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitoring indicator
      - Unresolved gap
    rows:
      - - A policy or autonomous workflow changes many privileged endpoints incorrectly.
        - Medium
        - High
        - >-
          Claimed controls include guardrails, sign-off, governance, and auditability; production performance is not
          independently established.
        - High
        - Rollback frequency, failed-action rate, exception volume, blast-radius limit breaches, and time to restore.
        - >-
          No assigned source quantifies production failure rates, rollback time, or customer adoption of fully
          autonomous action.
      - - Incomplete or stale endpoint state produces incorrect remediation decisions.
        - Medium
        - High
        - Tanium and independent commentary emphasize real-time data and post-remediation verification.
        - Medium-high
        - >-
          Telemetry freshness, unreachable endpoint share, verification failures, and mismatch between deployment and
          exposure reduction.
        - No independent benchmark in the assigned pool measures coverage completeness or verification accuracy.
      - - Customer configuration, access controls, or update practices undermine product security.
        - Medium
        - High
        - >-
          Contract terms assign installation, maintenance, upgrades, access controls, network security, and data
          protection to the customer.
        - Medium-high
        - >-
          Unsupported-version share, privileged-access exceptions, delayed upgrades, configuration drift, and support
          escalations.
        - Executed contracts and fleet-level compliance data are private.
      - - Published efficacy metrics overstate generalizable production outcomes.
        - Medium
        - Medium
        - >-
          The homepage publishes a 97% vulnerability-reduction metric, but the fetched text lacks denominator, cohort,
          period, and named attribution.
        - Medium
        - >-
          Metric definitions, eligible-population denominator, observation period, exclusions, and independent customer
          replication.
        - Underlying study design and customer-level distributions were not available.
    notes: >-
      Likelihood and severity are risk judgments, not measured incident frequencies; null production-rate evidence is
      carried as an explicit gap.
