        title: Capitalization Structure, Scale Trajectory, and Diligence Horizon
        blocks:
          - type: paragraph
            body: >-
              Tanium has raised approximately $1.1 billion in lifetime equity capital across twelve disclosed financing
              rounds, establishing a $9.0 billion post-money valuation mark anchored by its January 2021 Series F
              financing round of $150 million. The company's cap table features premier institutional backers including
              Andreessen Horowitz, TPG, and Salesforce Ventures, with cumulative capital inflows providing multi-year
              liquidity buffers that have allowed management to resist public market listing pressures. While
              third-party aggregators attribute 1,900 or more employees to the enterprise, official management updates
              maintain strict non-disclosure around verified annual recurring revenue (ARR), net revenue retention
              (NRR), gross margin composition, and GAAP operating profitability. Furthermore, the company faces an
              intensifying regulatory enforcement backdrop across financial services clients as Securities and Exchange
              Commission breach disclosure rules and proposed cyber oversight standards impose stringent 48-hour
              reporting windows on enterprise endpoint operators. Tracking historical milestones demonstrates rapid
