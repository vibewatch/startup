  - id: TV002
    title: Investment Thesis Versus Anti-Thesis Framework
    columns:
      - Pillar
      - Core Thesis Argument
      - Anti-Thesis Risk
      - What Would Change the View
    rows:
      - - Market Position
        - Proven enterprise scale with Fortune 100 deployments and deep federal defense adoption
        - Legacy on-premises architectural perception and intense competition from cloud-native peers
        - Independent audit of cloud-native customer adoption and ARR growth acceleration.
      - - Product & Technology
        - Unique linear chain architecture enabling real-time asset query and autonomous remediation
        - Operational blast-radius hazards on critical servers and potential IT change resistance
        - Empirical customer telemetry showing high automated remediation adoption with zero outage downtime.
      - - Financial Visibility
        - Historically achieved $430M+ revenue scale with positive adjusted EBITDA and operating cash flows
        - Complete opacity regarding current revenue run-rate, gross margins, and customer cohort retention
        - Management provision of audited income statements and cohort net retention metrics.
      - - Valuation & Capital Structure
        - Blue-chip institutional syndicate including Fidelity, T. Rowe Price, TPG, and Baillie Gifford
        - Significant liquidation preference stack and secondary marks hovering near $3.72B-$3.79B
        - Updated 409A valuation or clean primary equity round setting a credible public valuation floor.
    notes: Contrasts primary bullish investment arguments against structural downside risks and monitoring catalysts.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV010
  - id: TV003
    title: Underwriting Scenarios and Valuation Sensitivity Analysis
    columns:
      - Scenario
      - Operating & Financial Assumptions
      - Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - ARR reaches $1.0B; net retention >115%; gross margin >75%; autonomous IT expands
        - $7.0B valuation based on 7.0x ARR multiple; prospective IPO window opens
        - Failure to maintain enterprise seat growth against bundled Microsoft Defender E5
        - 25% - Requires clear re-acceleration in large enterprise contract wins
      - - Base Case
        - ARR stabilizes at $750M-$800M; net retention ~102-105%; moderate growth
        - $3.0B-$3.2B valuation at 4.0x ARR multiple; in line with secondary market trading
        - Prolonged liquidity delay, secondary share price erosion, key executive turnover
        - 50% - Best aligns with private market secondary pricing and competitor benchmarks
      - - Bear Case
        - ARR decelerates below $650M; net retention falls below 95%; margin compression
        - $1.5B-$1.8B valuation at 2.5x ARR multiple; down-round reset or recapitalization
        - Severe operational patch outage, customer churn to bundled suites, structural dilution
        - 25% - Elevated by private market liquidity constraints and lack of audited figures
    notes: >-
      Scenario analysis evaluating potential enterprise value outcomes under differing operational growth and multiple
      trajectories.
    claimRefs:
      - CV010
      - CV011
      - CV013
      - CV014
