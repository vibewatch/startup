              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Autonomous remediation changes Tanium's failure mode from an incorrect observation to an incorrect action
              on customer endpoints. The company presents guardrails and sign-off as safeguards, while the independent
              analysis emphasizes maintenance windows, staged rollout, rollback paths, and verification as prerequisites
              for safe automation. Endpoint accuracy is therefore both the product advantage and a control dependency:
              stale or incomplete telemetry can drive a fast but wrong action. Tanium's public 97%
              vulnerability-reduction claim lacks a denominator, cohort, time period, and named customer in the fetched
              page, so it cannot establish general production efficacy. The investment gate should require
              customer-level failure rates, rollback time, exception frequency, and evidence that remediation outcomes
              are independently verified rather than inferred from deployment logs.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR011
              - CR016
          - type: table
