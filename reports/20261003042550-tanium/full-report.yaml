              - CR011
              - CR016
      - number: '7.4'
        title: Partner, financial, and information dependencies
        blocks:
          - type: paragraph
            body: >-
              Tanium advertises native connectivity to ServiceNow, Microsoft, Splunk, Claude, ChatGPT, and Copilot
              Studio. Those integrations improve workflow reach but expose the proposition to API changes, platform
              policy, customer architecture, and competing bundled capabilities. Independent commentary identifies
              Microsoft, CrowdStrike, Palo Alto Networks, SentinelOne, Qualys, Tenable, and ServiceNow as participants
              in the same consolidation contest, making product differentiation and ecosystem fit continuing execution
              risks. Financial opacity adds another dependency: one market-data preview withholds substantive data
              behind a subscriber request, while a separate aggregator reports a January 2021 $9 billion valuation and
              $1.1 billion raised but presents internally inconsistent headcount figures. Funding raised is not cash
              available, and the old valuation is not evidence of current common-equity value. Management data is needed
              for liquidity, preference, concentration, margin, and retention underwriting.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR010
