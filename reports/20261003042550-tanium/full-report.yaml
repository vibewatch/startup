  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform Architecture and Linear-Chain Communication
        blocks:
          - type: paragraph
            body: >-
              Tanium is architected around a patented endpoint communications topology that replaces traditional
              hub-and-spoke models with an adaptive linear chain across local-area network segments. In conventional
              systems management software, a centralized server connects individually to each managed endpoint across
              wide-area network links, creating WAN congestion, severe database bottlenecks, and multi-hour or
              multi-week delays during enterprise-wide patching and telemetry queries. Tanium decentralizes
              communications by deploying a lightweight endpoint agent that periodically queries the Tanium Server to
              maintain awareness of neighboring machines and automatically forms dynamic peer-to-peer chains within
              local subnets. Under this design, the centralized Tanium Server initiates a query or operational
              instruction by contacting only a single lead machine at the head of each linear chain. Telemetry and
              commands propagate sequentially across adjacent endpoints over low-latency LAN connections, with
              aggregated responses returning directly to the server from the terminating endpoint in the chain. This
              structure drastically curtails WAN overhead and server connection counts. For instance, distributing a 372
              MB Windows update across 10,000 machines in a legacy architecture requires 10,000 distinct connections and
              3.72 TB of WAN data, whereas Tanium chains of 100 machines transfer the file once across the WAN and
              distribute peer-to-peer over the LAN, slashing external bandwidth consumption by up to 99%.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
