      - number: '7.2'
        title: Regulatory, legal, and contractual exposure
        blocks:
          - type: paragraph
            body: >-
              Tanium's own compliance guidance describes legal alignment, human oversight, continuous monitoring,
              documentation, and audit trails as core requirements for enterprise AI. Its 2024 financial-services
              commentary also described overlapping U.S. cyber-reporting proposals, short reporting windows, and
              unresolved implementation timing; that source is useful evidence of compliance complexity but not a
              current regulator ruling. The public licensing terms place installation, configuration, updates, access
              controls, network security, and data protection within the customer's operating responsibilities, and warn
              that the licensed software is not designed to store or process certain sensitive data. This allocation can
              create implementation and dispute risk when failures cross the boundary between product behavior and
              customer configuration. Current litigation, enforcement, certification, and jurisdiction-by-jurisdiction
              status require primary-source diligence.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
