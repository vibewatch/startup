callouts:
  - calloutType: "risk"
    title: "Procurement Exposure from Uncapped Endpoint Growth and Module Creep"
    body: "Enterprise buyers contracting with Tanium face acute financial exposure from two structural licensing mechanisms: default list-price billing for organic endpoint overage and complex SKU dependency cascades. In standard agreements, uncommitted endpoint growth from cloud scaling or M&A is billed at full list price without base discount parity, increasing renewal expenditures by 40% to 60%. Furthermore, advanced operational modules require prerequisite licensing chains—such as mandating Asset and Comply before permitting SBOM deployment—quietly eroding promised suite discounts."
