chapter:
  number: 4
  title: "Financials"
  summary: "The assigned evidence establishes a strong but dated 2019 operating baseline: Tanium said revenue exceeded $430 million after more than 50% year-over-year growth, with double-digit adjusted EBITDA and operating-cash-flow margins. Current pricing, ARR, gross margin, retention, cash, burn, runway, debt, and customer concentration remain undisclosed, so neither revenue quality nor capital adequacy can be underwritten from public evidence."
sections:
  - id: "historical-financial-baseline"
    title: "Historical scale is credible, but too stale for current underwriting"
    body: >-
      Tanium's clearest financial disclosure is historical and company-issued. In October
      2020, the company said 2019 revenue exceeded $430 million after growing more than
      50% year over year, while adjusted EBITDA and operating-cash-flow margins were both
      double digit. Wikipedia separately lists $440.2 million of 2019 revenue, broadly
      consistent with the company's threshold but not an audited primary filing. These
      observations establish that Tanium had reached meaningful scale and positive
      adjusted profitability before its 2020 financing. They do not establish 2026
      revenue, ARR, growth, GAAP profitability, free cash flow, or margin durability.
      PM Insights' public page offers headings for revenue and secondary-market analysis
      but no usable figures, and explicitly warns that preview data are delayed.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI010"
    tableRefs:
      - "TI003"
  - id: "revenue-model-and-pricing"
    title: "Product breadth is visible; monetization mechanics are not"
    body: >-
      Public materials show a broad endpoint-management and security platform spanning
      core management, risk and compliance, incident response, digital employee
      experience, Atlas-led automation, and integrations with ServiceNow, Microsoft,
      Splunk, and other systems. That breadth can support platform, module, integration,
      and support value propositions, but the assigned sources do not say whether each
      surface is separately priced, bundled, usage-based, endpoint-based, or included in
      a negotiated enterprise agreement. No source discloses list prices, realized
      discounts, average contract value, contract duration, billing cadence, services
      mix, or revenue-recognition policy. The revenue model therefore looks commercially
      plausible but cannot yet be translated into dependable ARR or gross-profit
      economics.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI005"
      - "CI013"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "gtm-costs-and-unit-economics"
    title: "Distribution leverage and delivery costs remain unquantified"
    body: >-
      Tanium's current website presents native connections into major IT and security
      tools, while its 2020 financing announcement described strategic relationships
      with Salesforce and Google Cloud. Those relationships may extend enterprise
      distribution and increase product utility, but no retained source quantifies
      sourced pipeline, reseller margins, referral fees, cloud-marketplace economics, or
      channel concentration. The help center confirms an ongoing documentation and
      support surface, and the Built In employer profile lists equity and performance
      bonuses. Together, these point to product, support, and talent cost centers without
      measuring their burden. CAC, payback, sales cycle, NRR, support cost per endpoint,
      hosting expense, professional-services mix, and current headcount cost remain
      specific diligence requests rather than estimable public metrics.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI012"
      - "CI015"
  - id: "capital-adequacy-and-verdict"
    title: "Funding history does not answer present liquidity or runway"
    body: >-
      Tanium said its October 2020 sale of $150 million in common stock brought cumulative
      capital raised above $900 million and valuation above $9 billion. That financing
      history demonstrates past access to institutional capital, not cash still available
      in 2026: the source supplies no current balance, burn, debt, preference stack, or
      planned use of funds. Regulatory complexity can support customer demand for
      endpoint controls, yet Tanium's own analysis also documents overlapping reporting
      rules and potentially expensive architecture obligations for financial-services
      buyers, creating budget and implementation friction. The financial verdict is
      therefore conditional: historical scale and cash-generation signals are positive,
      but current revenue quality, margin path, capital intensity, and financing
      dependency remain blocked by private evidence.
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI011"
      - "CI014"
