chapter:
  number: 7
  title: "Risks"
  summary: "Tanium's move from endpoint visibility toward governed autonomous action raises a high-consequence execution risk: weak change controls could turn fast remediation into a broad outage. Regulatory complexity, customer-side deployment obligations, platform dependencies, and stale private-market disclosure compound the risk, while current incident, concentration, and audited financial evidence remains unavailable in the assigned public source set."
sections:
  - id: "risk-ranking-and-kill-criteria"
    title: "Risk ranking and thesis-break criteria"
    body: >-
      The highest residual risk is execution at scale. Tanium says Atlas applies guardrails,
      sign-off, and auditability to multi-step workflows, but independent commentary warns that
      a bad enforcement policy deployed broadly can create an outage. That combination supports
      a high-impact, medium-likelihood assessment rather than an assumption that governance is
      already proven in production. The thesis should break if management cannot demonstrate
      staged rollout, exception handling, rollback testing, and post-action verification for
      privileged changes. Other high residual risks are an evolving AI and cyber-reporting
      compliance patchwork, dependence on major workflow and endpoint ecosystems, and limited
      public evidence for current operating and private-market metrics. A customer-transparency
      security-engineering job repost is a staffing signal, not proof that the controls are mature.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR005"
      - "CR006"
      - "CR009"
      - "CR010"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-and-contractual-exposure"
    title: "Regulatory, legal, and contractual exposure"
    body: >-
      Tanium's own compliance guidance describes legal alignment, human oversight, continuous
      monitoring, documentation, and audit trails as core requirements for enterprise AI. Its
      2024 financial-services commentary also described overlapping U.S. cyber-reporting
      proposals, short reporting windows, and unresolved implementation timing; that source is
      useful evidence of compliance complexity but not a current regulator ruling. The public
      licensing terms place installation, configuration, updates, access controls, network
      security, and data protection within the customer's operating responsibilities, and warn
      that the licensed software is not designed to store or process certain sensitive data.
      This allocation can create implementation and dispute risk when failures cross the boundary
      between product behavior and customer configuration. Current litigation, enforcement,
      certification, and jurisdiction-by-jurisdiction status require primary-source diligence.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR001"
  - id: "operational-quality-and-security-risk"
    title: "Operational, quality, and security risk"
    body: >-
      Autonomous remediation changes Tanium's failure mode from an incorrect observation to an
      incorrect action on customer endpoints. The company presents guardrails and sign-off as
      safeguards, while the independent analysis emphasizes maintenance windows, staged rollout,
      rollback paths, and verification as prerequisites for safe automation. Endpoint accuracy
      is therefore both the product advantage and a control dependency: stale or incomplete
      telemetry can drive a fast but wrong action. Tanium's public 97% vulnerability-reduction
      claim lacks a denominator, cohort, time period, and named customer in the fetched page, so
      it cannot establish general production efficacy. The investment gate should require
      customer-level failure rates, rollback time, exception frequency, and evidence that
      remediation outcomes are independently verified rather than inferred from deployment logs.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR011"
      - "CR016"
    tableRefs:
      - "TR002"
  - id: "partner-financial-and-information-dependencies"
    title: "Partner, financial, and information dependencies"
    body: >-
      Tanium advertises native connectivity to ServiceNow, Microsoft, Splunk, Claude, ChatGPT,
      and Copilot Studio. Those integrations improve workflow reach but expose the proposition
      to API changes, platform policy, customer architecture, and competing bundled capabilities.
      Independent commentary identifies Microsoft, CrowdStrike, Palo Alto Networks, SentinelOne,
      Qualys, Tenable, and ServiceNow as participants in the same consolidation contest, making
      product differentiation and ecosystem fit continuing execution risks. Financial opacity
      adds another dependency: one market-data preview withholds substantive data behind a
      subscriber request, while a separate aggregator reports a January 2021 $9 billion
      valuation and $1.1 billion raised but presents internally inconsistent headcount figures.
      Funding raised is not cash available, and the old valuation is not evidence of current
      common-equity value. Management data is needed for liquidity, preference, concentration,
      margin, and retention underwriting.
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
