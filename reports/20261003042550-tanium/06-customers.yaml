chapter:
  number: 6
  title: "Customers"
  summary: "Tanium has anchored its enterprise commercial footprint across global Fortune 100 enterprises, U.S. Federal defense and civilian agencies, and healthcare networks, managing over 36 million endpoints worldwide. While customer proof highlights accelerated vulnerability resolution and automated patching efficacy, customer-level ARR cohorts, exact account churn, net revenue retention, and customer concentration metrics remain completely undisclosed private-company gaps."
sections:
  - id: "customer-base-segmentation-and-targeting"
    title: "Enterprise and Public Sector Customer Base Segmentation"
    body: "Tanium's commercial strategy targets large-scale, highly distributed enterprise environments where IT operations and security convergence are paramount [CU001]. The customer base divides across three primary sectors: Global 2000 multinational commercial enterprises, regulated public sector institutions including the U.S. armed forces and federal civilian agencies, and critical infrastructure operators such as healthcare systems and financial services institutions [CU002, CU003]. Enterprise buyers typically comprise Chief Information Security Officers (CISOs), Chief Information Officers (CIOs), and VP-level heads of infrastructure and security operations seeking unified endpoint management and exposure remediation [CU001, CU004]. Mid-market and commercial customers increasingly access the platform through managed service providers (MSPs) and managed detection and response (MDR) partners who embed Tanium into managed services [CU005]. However, because Tanium does not disclose audited customer count breakdowns by revenue tier or geography, exact revenue concentration across these buyer segments remains an unresolved underwriting gap [CU006]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-production-outcomes"
    title: "Named Customer Proof and Real-World Operational Outcomes"
    body: "Tanium's adoption trajectory is substantiated by named production deployments across demanding enterprise and institutional environments rather than speculative pilots [CU007]. At Spire Healthcare, a major private healthcare provider, CISO Hammond Reddie confirmed deployment of Tanium Atlas to analyze patch status by operating system generation, calculate compliance percentages, and filter superseded patches using plain-language queries without custom API scripts [CU008]. In higher education and research, Kingston University London senior cyber security specialist Spiro Spyropoulos validated production usage of Atlas for conversational reasoning and real-time fleet querying to match adversary execution speed [CU008]. Broad enterprise metrics published by Tanium indicate 98% patch efficacy without remediation in targeted markets, a 97% reduction in vulnerabilities through automated patching workflows, investigation cycles collapsing from 24 hours to 5 minutes, and data center patch windows contracting from one week to three hours [CU009]. Across federal agencies, Tanium maintains FedRAMP High and DoD Impact Level (IL4/IL5) compliance boundaries, enabling mission-critical defense adoption [CU010]."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
  - id: "retention-durability-and-expansion-dynamics"
    title: "Retention Durability, Land-and-Expand Mechanics, and Concentration Friction"
    body: "Tanium's durability relies on deep architectural embedding across customer infrastructure, making displacement technically and operationally disruptive once deployed across endpoints [CU001, CU011]. With the release of Tanium Atlas in mid-2026, the company introduced an expansion loop that upsells autonomous AI agent capabilities to its existing base of over 36 million endpoints [CU011]. More than 1,300 customer organizations deployed Atlas within weeks of general availability, demonstrating strong organic land-and-expand momentum within the installed commercial cloud and government client base [CU008]. In the channel, technology integration programs with security partners like vArmour and managed service providers provide multi-tiered distribution [CU002, CU005]. Nevertheless, customer durability faces structural risks: financial sector customers confront escalating SEC compliance burdens that penalize operational disruption [CU012], while standard contractual terms cap software liability and disclaim uninterrupted availability, leaving critical risks with enterprise buyers [CU013]. Crucially, Tanium maintains complete opacity regarding gross revenue retention (GRR), net revenue retention (NRR), and top-ten customer revenue concentration [CU006]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
