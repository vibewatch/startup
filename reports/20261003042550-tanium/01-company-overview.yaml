chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2007 by David and Orion Hindawi, Tanium provides real-time autonomous IT and unified endpoint management for large enterprise and public-sector environments. The company reached a $9 billion post-money valuation across $1.1 billion in lifetime capital from Andreessen Horowitz, TPG, and Salesforce Ventures, and in August 2026 reappointed co-founder Orion Hindawi as CEO following executive turnover and extended IPO delay."
sections:
  - id: "identity-governance"
    title: "Corporate Identity, Operating Profile, and Strategic Positioning"
    body: "Tanium Inc. operates as a late-stage venture-backed enterprise software provider specializing in unified endpoint management (UEM) and autonomous IT operations. Founded in 2007 by the father-and-son team of David Hindawi and Orion Hindawi, the business operates dual corporate and operating centers, maintaining headquarters in Kirkland, Washington alongside extensive executive and operational facilities at 2100 Powell Street in Emeryville, California. The company's core platform enables security and infrastructure teams to query, patch, and remediate distributed computing fleets within seconds using a distributed peer-to-peer endpoint architecture. In 2026, Tanium transitioned its primary market narrative toward Autonomous IT, anchoring product packaging around Tanium Atlas, an autonomous operating layer that combines system-level ambient agents, continuous environmental observation, and closed-loop endpoint remediation to automate complex IT workflows without manual tool switching."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "leadership-succession"
    title: "Executive Leadership, Governance Transitions, and Key-Person Risk"
    body: "Governance and operational direction at Tanium have remained tightly bound to its founding family across nearly two decades of operation. Following an earlier tenure as CEO from 2016 to 2023, co-founder and executive chairman Orion Hindawi was reappointed Chief Executive Officer on August 20, 2026, succeeding Dan Streetman, who stepped down after a three-year term leading go-to-market scaling. Concurrently, co-founder David Hindawi returned to the role of Chairman of the Board, while Streetman transitioned into an advisory role. The executive shift followed an acute period of senior management turnover in the spring of 2026, during which Tanium lost five top executives including Chief Legal Officer Brady Mickelsen, Chief People Officer Tobias Julén, Chief Information Security Officer Chris Hallenbeck, and Chief Marketing Officer Tara Ryan, alongside the brief tenure and resignation of incoming CPO Carol MacKinlay. These departures occurred amid employee and leadership friction over indefinite IPO delays, rigid return-to-office equity withholding policies, and executive relocation constraints, highlighting significant key-person dependence on Orion Hindawi to anchor long-term organizational stability."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-milestones"
    title: "Capitalization Structure, Scale Trajectory, and Diligence Horizon"
    body: "Tanium has raised approximately $1.1 billion in lifetime equity capital across twelve disclosed financing rounds, establishing a $9.0 billion post-money valuation mark anchored by its January 2021 Series F financing round of $150 million. The company's cap table features premier institutional backers including Andreessen Horowitz, TPG, and Salesforce Ventures, with cumulative capital inflows providing multi-year liquidity buffers that have allowed management to resist public market listing pressures. While third-party aggregators attribute 1,900 or more employees to the enterprise, official management updates maintain strict non-disclosure around verified annual recurring revenue (ARR), net revenue retention (NRR), gross margin composition, and GAAP operating profitability. Furthermore, the company faces an intensifying regulatory enforcement backdrop across financial services clients as Securities and Exchange Commission breach disclosure rules and proposed cyber oversight standards impose stringent 48-hour reporting windows on enterprise endpoint operators. Tracking historical milestones demonstrates rapid technical evolution alongside mounting capital-structure opacity."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
