  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "financials"
      missingEvidence: "Audited financial statements, revenue-recognition policy, gross margin, cash balance, and cash-flow detail."
      whyItMatters: "Annualized revenue and operating-margin claims cannot establish audited profitability, liquidity, or runway."
      diligencePath: "Request the completed audit report, management accounts, bank statements, and auditor engagement details under NDA."
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001]
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "governance"
      missingEvidence: "Verified founder aliases, current executive roster, board seats, cap table, investor rights, and succession plan."
      whyItMatters: "The public founder roster conflicts and does not establish control, oversight, or key-person resilience."
      diligencePath: "Obtain corporate registry extracts, organization charts, board minutes, cap table, financing documents, and key-person plans."
      relatedQuestionRefs: [QO002, QO006]
      relatedTableRefs: [TO002, TO003]
    - type: "missing-source"
      severity: "material"
      topic: "workforce"
      missingEvidence: "Current employee headcount by function and a complete list of operating locations and legal entities."
      whyItMatters: "Execution capacity, compliance coverage, and geographic operating leverage cannot be assessed without workforce and entity data."
      diligencePath: "Request payroll-backed headcount, functional and geographic splits, legal-entity register, and office leases."
      relatedQuestionRefs: [QO010]
      relatedTableRefs: [TO001]
    - type: "conflicting-data"
      severity: "material"
      topic: "ipo"
      missingEvidence: "A filed prospectus, board-approved listing timetable, underwriter mandates, and a reconciled valuation target."
      whyItMatters: "Reported valuation targets and listing timing conflict, so they cannot be treated as a completed financing or current valuation."
      diligencePath: "Request board materials, engagement letters, draft registration documents, and written confirmation from appointed banks."
      relatedQuestionRefs: [QO005, QO007]
    - type: "missing-source"
      severity: "material"
      topic: "litigation"
      missingEvidence: "Complete Hong Kong and Singapore pleadings, partnership agreements, transaction logs, and current procedural status."
      whyItMatters: "News reporting establishes allegations and denials but not liability, damages, or operational impact."
      diligencePath: "Retrieve court dockets and operative pleadings, then obtain counsel's case assessment and the underlying partner contracts."
      relatedQuestionRefs: [QO007]
