company:
  name: "RedotPay"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    RedotPay is a Hong Kong-based, Series B stablecoin-payments company founded in
    2023, with company-reported scale of 9 million users and $12 billion in
    annualized payment volume. The operating footprint is material, but public
    evidence remains dominated by company claims and unresolved IPO, governance,
    financial-disclosure, and litigation questions.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      RedotPay is the trading name of Hong Kong-based Red F. Technology Limited,
      which Preqin dates to 2023. Its consumer proposition connects stablecoins to
      familiar payment and transfer workflows: virtual and physical cards,
      cross-border payouts, a multi-currency wallet, crypto-backed credit, swaps,
      and a peer-to-peer marketplace. The company explicitly says it is a fintech
      service provider rather than a bank, and that licensed financial institutions
      provide its multi-currency wallet. Preqin describes transaction fees as the
      core revenue mechanism. This positions RedotPay as an orchestration layer
      between digital-asset holders, licensed financial institutions, payment
      networks, and local-currency endpoints, making partner continuity and
      licensing scope central to the business model rather than peripheral
      compliance details.
    claimRefs: [CO001, CO002, CO015, CO016]
    tableRefs: [TO001]
  - id: "leadership-and-capital"
    title: "Leadership, capital, and governance"
    body: >-
      Michael Gao is consistently identified as co-founder and chief executive,
      while the wider founder roster is less settled in public materials. Preqin
      names Jonathan Chan; reporting on Binance's court petition names Gao
      Zhangpeng, Chan Wa Choi, and Yao Chao as co-founders, without enough evidence
      here to resolve aliases or current operating roles. RedotPay announced a
      $107 million Series B in December 2025 and said this brought capital raised
      during 2025 to $194 million. The round was led by Goodwater Capital, with
      Pantera Capital, Blockchain Capital, Circle Ventures, HSG, and others named
      as participants or continuing backers. Public sources reviewed do not provide
      a complete board, cap table, voting-rights map, or management succession
      plan, leaving meaningful key-person and control diligence outstanding.
    claimRefs: [CO003, CO004, CO005, CO006]
    tableRefs: [TO002, TO003]
  - id: "scale-and-public-market-readiness"
    title: "Scale claims and public-market readiness"
    body: >-
      RedotPay's reported scale has continued to rise: its December 2025 financing
      release cited more than 6 million registered users, more than $10 billion in
      annualized payment volume, and more than $150 million in annualized revenue,
      while the current company website displays 9 million users and $12 billion
      in annualized payment volume. These are company-reported operating metrics,
      not audited financial statements, ARR, cash balance, or active-user cohorts.
      Independent reporting says the company completed financial and AML/CFT
      reviews in 2026, but the firms were unnamed and the statements themselves
      were not public. IPO reporting also diverges between an earlier potential
      $4 billion valuation and a later target above $5 billion, with no filed
      prospectus or firm listing date.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
    figureRefs: [FO001]
  - id: "regulatory-and-litigation-overhang"
    title: "Regulatory claims and litigation overhang"
    body: >-
      The company says it is a VASP in Argentina, an MSB in Canada, a
      FinCEN-registered MSB in the United States, and holds Hong Kong money-lender
      and TCSP licenses. Those statements do not substitute for a legal-entity and
      product-by-product licensing matrix; RedotPay also says its U.S. FinCEN
      registration does not involve serving U.S. citizens. Separately, Binance
      affiliates allege that RedotPay diverted more than 470,000 customers and
      claim $472.8 million in losses. RedotPay denies the allegations and says the
      proceedings do not affect day-to-day operations. The dispute is therefore a
      live adverse event, not an adjudicated liability, but its timing and claimed
      customer-acquisition mechanics increase diligence sensitivity around partner
      dependencies, growth quality, and IPO readiness.
    claimRefs: [CO012, CO013, CO014, CO015]
