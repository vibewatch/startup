callouts:
  - calloutType: "strength"
    title: "Meaningful reported consumer scale"
    body: >-
      Company disclosures indicate a multi-million-user product and double-digit
      billions of annualized payment volume, supported by a large institutional
      financing round.
    claimRefs: [CO005, CO007, CO008]
  - calloutType: "risk"
    title: "IPO evidence remains preliminary"
    body: >-
      Audit completion is a readiness signal, but valuation targets conflict,
      the audit firms and financial statements are undisclosed, and there is no
      public prospectus or firm listing date.
    claimRefs: [CO009, CO010, CO011]
  - calloutType: "risk"
    title: "Partner dispute may affect growth-quality assessment"
    body: >-
      Binance's allegations are contested rather than adjudicated, but the claimed
      customer diversion and losses make acquisition provenance and partner
      agreements material diligence items.
    claimRefs: [CO012, CO013, CO014]
