  topStrengths:
    - 公司自报的全球用户数超过 9 million，年化支付量达 $12 billion，显示业务确有可观需求。
    - 产品线覆盖卡片、出款、钱包功能、转账、信贷、兑换、Earn 以及点对点交易。
    - $107 million 的 B 轮融资，以及与卡组织、区块链和本地出款通道的集成，为公司提供资金和分销支持。
  topRisks:
    - Binance 关联方就涉嫌转移超过 470,000 名用户索赔约 $472.8 million；RedotPay 否认这些指控。
    - 尽管公司声称业务运行规模可观，经审计的财务报表、利润率、现金、烧钱速度、现金跑道、客户经济性和合作伙伴成本仍不可得。
    - Crypto Earn 资产集中管理，公司又依赖卡、钱包、银行、稳定币和出款合作伙伴，因此面临客户资产、流动性和业务连续性风险。
    - 公开许可和 AML/CFT 审查方面的说法，并未提供完整的产品—司法辖区授权矩阵或独立控制报告。
  unresolvedGaps:
    - 覆盖收入确认、毛利率、现金、现金流、烧钱速度、债务和现金跑道的经审计财务报表及管理层账目。
    - 月活用户、入金用户和交易用户；留存队列；交易频率；获客归因；以及分部层面的单位经济性。
    - 覆盖每项产品和每个司法辖区的法律实体及许可矩阵，以及完整的 AML/CFT 审查和整改记录。
    - 关键卡、银行、钱包、托管、流动性、稳定币和出款合作伙伴的合同、经济条款、集中度、冗余安排及终止权。
    - Binance 争议的法院一手文件、律师评估、保险和准备金，以及完全摊薄后的股权结构表和优先权条款。
