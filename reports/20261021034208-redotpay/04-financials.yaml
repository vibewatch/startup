schemaVersion: "report-v2"
artifact: financials
slug: redotpay
runDate: 2026-10-21
company:
  name: RedotPay
chapter:
  number: 4
  title: Financials
  summary: >-
    RedotPay reports substantial annualized scale, but the public evidence remains a collection of
    management run-rate claims rather than disclosed audited statements. Monetization is visible
    across card fees, payment conversion, payouts, lending, and an Earn spread, while margins,
    cash, burn, customer economics, partner costs, and the financial effect of a large pending
    lawsuit remain unavailable for underwriting.
sections:
  - id: revenue-model
    title: Revenue model has multiple surfaces but little disclosed yield
    body: >-
      RedotPay sits between customer-held crypto and traditional payment rails. A third-party
      product review describes stablecoins being converted into fiat at purchase so the merchant
      receives conventional currency, while RedotPay's own pages add global payouts, in-app
      transfers, peer-to-peer exchange, collateralized credit, swaps, and Earn. Publicly visible
      monetization is clearest at card application and Earn: card applications require a
      crypto-funded fee, and the Earn terms permit RedotX Panama to charge a spread or service fee
      and retain returns above the reward credited to users. In-app transfers and P2P are marketed
      as fee-free, so they appear more useful for acquisition and activity than as directly priced
      products. No retained source discloses realized interchange, foreign-exchange spread, payout
      take rate, lending yield, or revenue mix.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: scale-and-pricing
    title: Reported run rates show scale, not audited revenue quality
    body: >-
      The December 2025 company release reported more than $150 million of annualized revenue,
      more than $10 billion of annualized payment volume, and six million registered users.
      A later Claims Journal article carrying Bloomberg reporting said RedotPay then described
      $180 million of annualized revenue, $14 billion of annualized payment volume, and more than
      eight million users. The current homepage instead displays more than nine million users and
      $12 billion of annualized payment volume. These are different snapshots with incomplete
      definitions, not fiscal-period accounts: registered users are not active users, payment
      volume is not revenue, and an annualized run rate is not recognized annual revenue. The
      public pricing evidence is similarly incomplete because it identifies fee mechanisms but
      generally omits prices, discounts, currency spreads, and partner pass-through costs.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI007, CI008, CI009, CI011]
    tableRefs: [TI002]
  - id: unit-economics-and-capital
    title: Unit economics and capital adequacy cannot yet be underwritten
    body: >-
      The strongest public capital evidence is historical funding availability, not current
      liquidity. RedotPay reported a $107 million Series B and $194 million raised during 2025,
      with proceeds intended for acquisitions, licenses, compliance capacity, and hiring. Those
      uses imply continuing investment, but funding raised cannot be treated as cash on hand or
      runway. The completed financial audit reported by CoinDesk is a positive readiness signal,
      yet the retained evidence does not publish the audited income statement, balance sheet, or
      cash-flow statement. CAC, payback, gross margin, transaction loss rates, customer
      concentration, reserve requirements, working-capital timing, cash, burn, debt, and runway
      are all absent. Earn also introduces a balance-sheet and liquidity question because its
      terms permit pooled customer assets to support lending, staking, and operating purposes.
    claimRefs: [CI009, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict is scale-positive but underwriting-blocked
    body: >-
      The public record supports a plausible high-volume payments business with several
      monetization paths, but it does not establish durable gross profit or free cash flow.
      Run-rate growth and a completed audit improve the case for institutional financing, while
      plans for a large U.S. listing show that access to new capital remains strategically
      important. The downside is unusually material: Binance affiliates seek $472.8 million in
      alleged losses, an amount that cannot be converted into an expected liability without the
      pleadings, defenses, insurance, legal reserves, and probability assessment. Investment
      underwriting should therefore remain conditional on audited statements, a revenue bridge
      from volume to recognized revenue, cohort-level activity and retention, full partner
      economics, current liquidity, and primary legal documents. Until then, reported scale is
      encouraging but revenue quality, margin durability, and capital sufficiency remain
      unverified.
    claimRefs: [CI001, CI004, CI005, CI012, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization status
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Card application
        - Upfront crypto-funded application fee
        - Fee per issued virtual or physical card
        - Fee required; amount not disclosed in retained evidence
        - Transactional but unquantified
        - Current fee schedule, waivers, card cost, and realized net fee
      - - Card spending
        - Stablecoin conversion to fiat over traditional card rails
        - Spend volume, interchange, and conversion spread
        - Product active; take rate not disclosed
        - Potentially recurring, but partner and FX costs are unknown
        - Interchange split, FX spread, network fees, losses, and issuer economics
      - - Global payouts
        - Crypto sent and local fiat delivered through payout infrastructure
        - Transfer count, transfer volume, and per-transfer spread or fee
        - Multi-market payout available; exact pricing not disclosed
        - Recurring usage possible; unit margin unknown
        - Realized fee, partner cost, failed-payment rate, and corridor mix
      - - In-app transfers
        - Transfers among RedotPay users
        - Transfer count and volume
        - Marketed at no additional fee
        - Acquisition or retention utility rather than disclosed direct revenue
        - Contribution to funded-account activation and downstream paid activity
      - - P2P marketplace
        - Facilitated matching across local currencies and payment methods
        - Trades and gross marketplace volume
        - Marketed as no-fee
        - Direct monetization not evidenced
        - Any spread, promotional subsidy, dispute cost, and conversion to paid products
      - - Crypto Earn
        - Gross deployment yield less user reward, spread, and service fees
        - Assets subscribed and net yield retained
        - Spread or fee permitted; rates and balances not disclosed
        - Recurring but exposed to market, liquidity, and counterparty risk
        - Assets under program, gross yield, user reward, loss reserve, and net spread
      - - Credit and swap
        - Collateralized lending and crypto conversion
        - Loan balance, interest yield, and swap spread
        - Products advertised; public pricing absent
        - Potential recurring yield with credit and liquidity risk
        - Loan book, LTV, defaults, funding cost, swap spread, and realized losses
    notes: >-
      Mechanisms are taken from official product pages, terms, and the cited third-party product
      review; realized pricing, revenue mix, and contribution margins are not publicly disclosed.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011]
  - id: TI002
    title: Public pricing and monetization evidence
    columns:
      - Product
      - Public price or contract term
      - List versus realized
      - Material unknown
      - Source interpretation
    rows:
      - - Physical card
        - Application fee must be pre-funded in crypto
        - Fee requirement only; no retained amount
        - Discounts, shipping, issuer cost, and replacement economics
        - Official launch page
      - - Virtual card
        - Card application requires funded digital assets
        - Fee requirement only; no retained amount
        - Promotions, provisioning cost, and interchange split
        - Official launch page
      - - In-app transfer
        - No additional fee
        - Public list claim; realized economics unavailable
        - Network subsidy and downstream monetization
        - Official homepage
      - - P2P marketplace
        - No fees
        - Public list claim; realized economics unavailable
        - Spread, dispute cost, incentives, and loss rate
        - Official homepage
      - - Crypto Earn
        - Variable spread or service fee may be charged
        - Contractual discretion; no rate disclosed
        - Gross yield, user reward, retained spread, and losses
        - Official terms
      - - Ripple-enabled payout
        - Described as transparent and cost-effective
        - Marketing description; no numeric price
        - Corridor-specific fee, FX rate, and partner share
        - Company-issued partnership announcement
    notes: >-
      This is a partial public-price inventory as of 2026-10-21. "No fee" is a list-price claim,
      not proof of zero economic cost or a zero realized take rate.
    claimRefs: [CI007, CI008, CI009, CI011]
  - id: TI003
    title: Unit economics and capital underwriting matrix
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Annualized revenue
        - "$150M+ in November 2025 company release; $180M current company figure reported in August 2026 article"
        - Medium
        - Indicates scale but is not recognized fiscal-period revenue
        - Audited monthly revenue, recognition policy, and stream mix
      - - Annualized payment volume
        - "$10B+ in November 2025 release; $12B homepage; $14B reported August 2026 company figure"
        - Medium
        - Denominator for implied take rate, subject to definition and timing
        - Reconciled TPV by month, product, corridor, and settled versus attempted volume
      - - Registered or reported users
        - "6M+ in November 2025 release; 9M+ homepage; 8M+ reported August 2026 company figure"
        - Medium
        - Registration does not establish active or monetized usage
        - MAU, funded users, transactors, retention cohorts, and revenue per active user
      - - Gross margin
        - null
        - Low
        - Determines whether volume growth creates durable gross profit
        - Audited gross profit with network, liquidity, fraud, and partner costs
      - - CAC and payback
        - null
        - Low
        - Tests whether channel-led growth is capital efficient
        - Spend by channel, attributed activations, contribution margin, and payback
      - - Cash, burn, and runway
        - null
        - Low
        - Required to assess financing dependency and downside capacity
        - Current unrestricted cash, monthly net burn, working capital, debt, and runway
      - - Funding raised
        - "$194M during 2025, including a $107M Series B"
        - High
        - Demonstrates financing access but not cash currently available
        - Closing statements, cash remaining, preferences, and deployment to date
      - - Claimed litigation exposure
        - "$472.8M sought by Binance affiliates"
        - Medium
        - Potential liability is large relative to disclosed historical funding
        - Pleadings, counsel assessment, insurance, reserves, and scenario exposure
    notes: >-
      Values are company-reported or third-party-reported annualized figures, not audited
      fiscal-period results. Null means the assigned public evidence did not disclose the metric.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI012, CI016]
figures:
  - id: FI001
    title: Revenue model bridge from customer activity to undisclosed gross profit
    type: flow
    summary: >-
      Public evidence identifies the activity and monetization surfaces, but not the deductions
      needed to bridge payment volume into recognized revenue and gross profit.
    data:
      nodes:
        - id: funded-balance
          label: Funded balance
          detail: Users deposit stablecoins or other digital assets into the RedotPay environment.
        - id: customer-activity
          label: Customer activity
          detail: Card purchases, payouts, in-app transfers, P2P trades, swaps, credit, and Earn.
        - id: conversion-settlement
          label: Conversion and settlement
          detail: Crypto is converted and merchants or payout recipients receive fiat.
        - id: payment-volume
          label: Annualized payment volume
          detail: Public figures range from $10B+ to $14B across different snapshots.
        - id: monetization
          label: Monetization surfaces
          detail: Card fees, conversion economics, payout pricing, lending yield, swap spread, and Earn spread.
        - id: cost-deductions
          label: Cost deductions
          detail: Card, payout, liquidity, fraud, compliance, customer-support, and funding costs are not quantified.
        - id: gross-profit
          label: Gross profit
          detail: No audited gross-margin or contribution-margin bridge is publicly available.
    approximationNotes: >-
      The sequence is conceptual and not value-proportional; no conversion rate, take rate, or
      gross-profit amount is inferred.
    claimRefs: [CI001, CI002, CI006, CI007, CI008, CI009, CI010, CI011]
callouts:
  - calloutType: strength
    title: Reported scale supports a real monetization opportunity
    body: >-
      Management-reported annualized revenue and payment volume indicate meaningful commercial
      throughput, while the product set offers several potential revenue pools.
    claimRefs: [CI001, CI002, CI004, CI006, CI009, CI010]
  - calloutType: risk
    title: Capital adequacy cannot be inferred from funding raised
    body: >-
      The $194 million raised in 2025 does not reveal current cash or runway, and the $472.8 million
      lawsuit demand cannot be underwritten without primary legal and accounting evidence.
    claimRefs: [CI012, CI013, CI016]
