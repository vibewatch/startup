  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        Audited income statements, balance sheets, cash-flow statements, revenue-recognition
        policies, gross-margin schedules, and related audit opinion.
      whyItMatters: >-
        Annualized company run rates cannot establish recognized revenue, gross profit, cash
        generation, or balance-sheet solvency.
      diligencePath: >-
        Obtain the completed audit package and monthly management accounts, then reconcile payment
        volume to recognized revenue and gross profit by product.
      relatedQuestionRefs: [QI004]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: >-
        Current unrestricted cash, monthly burn, runway, debt, collateral obligations, working
        capital, and planned next-round or IPO trigger.
      whyItMatters: >-
        Funding raised in 2025 does not establish current liquidity or the ability to absorb
        operating, regulatory, credit, or litigation shocks.
      diligencePath: >-
        Review bank statements, treasury schedules, debt agreements, a 24-month cash forecast, and
        board-approved financing scenarios.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: go-to-market-efficiency
      missingEvidence: >-
        CAC, payback, acquisition spend, referral incentives, partner-sourced volume, retention,
        and contribution margin by channel and cohort.
      whyItMatters: >-
        User and payment-volume growth cannot demonstrate efficient acquisition or durable
        monetization without cohort activity and cost data.
      diligencePath: >-
        Obtain monthly channel and cohort dashboards tied to recognized revenue and contribution
        margin.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: partner-economics
      missingEvidence: >-
        Card issuer, card-network, custody, liquidity, payout, banking, and Ripple partner contracts
        with pricing, reserves, minimums, loss allocation, and termination rights.
      whyItMatters: >-
        Third-party rail economics and concentration may determine gross margin, working capital,
        service continuity, and bargaining power.
      diligencePath: >-
        Review executed partner agreements and build a corridor- and product-level net revenue
        bridge after all external costs.
      relatedQuestionRefs: [QI004, QI005, QI006]
      relatedTableRefs: [TI001, TI002, TI003]
    - type: missing-source
      severity: material
      topic: litigation
      missingEvidence: >-
        Primary Hong Kong and Singapore pleadings, defense filings, hearing outcomes, insurance,
        accounting reserves, and external counsel's probability assessment.
      whyItMatters: >-
        The reported damages demand is not an expected loss estimate, but its scale could be
        material to liquidity and financing.
      diligencePath: >-
        Obtain court-filed documents and privileged counsel analysis, then model probability-
        weighted cash and operating scenarios.
      relatedQuestionRefs: [QI009]
      relatedTableRefs: [TI003]
