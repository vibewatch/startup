      basis: >-
        Material legal and regulatory matters visible in the assigned prefetched
        evidence through 21 October 2026, not an exhaustive jurisdictional inventory.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR009]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitor
    rows:
      - - Earn borrower or counterparty default
        - Terms permit lending and describe due diligence and collateral, but no portfolio data
        - Medium
        - Critical
        - Developing
        - High
        - Top counterparties, collateral haircuts, default rates, arrears, and recoveries
      - - Earn liquidity mismatch or delayed redemption
        - Terms acknowledge insufficient liquid assets in exceptional circumstances
        - Medium
        - Critical
        - Early
        - High
        - Liquid coverage, maturity ladder, run scenarios, redemption performance, and gates
      - - Hack, protocol failure, congestion, or slashing
        - Terms identify cyberattack, technical failure, network disruption, and staking penalties
        - Medium
        - High
        - Unverified
        - High
        - Security audits, incidents, loss history, validator policy, recovery objectives, and insurance
      - - P2P counterparty default or settlement dispute
        - Company states it does not guarantee settlement, completion, or outcome
        - Medium-high
        - High
        - Early
        - High
        - Dispute rate, fraud loss, frozen funds, complaint aging, refunds, and geographic controls
    notes: >-
      Ratings are qualitative, not loss-frequency estimates. Public terms describe
      risk and selected controls but provide no denominator, audited control test,
      incident history, balance-sheet capacity, or portfolio concentration.
    claimRefs: [CR007, CR008, CR009]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or rail
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation evidence
      - Residual exposure
    rows:
      - - Card acceptance and cash access
        - Visa network and unidentified issuing stack
        - Merchant acceptance and ATM withdrawal
        - No redundancy or contract disclosure
        - Suspension, regional restriction, or issuer termination
        - Critical
        - Broad Visa acceptance claimed; no backup evidenced
        - High
      - - Multi-currency wallet
        - Unnamed licensed financial institutions
        - Provide wallet while RedotPay facilitates access
        - Providers and shares undisclosed
        - License, solvency, service, or termination event
        - High
        - Licensed-provider requirement stated
        - High
      - - Nigeria and multi-market payouts
        - Ripple Payments and local bank accounts
        - Crypto-to-local-currency payout connectivity
        - No volume, SLA, or backup disclosure
        - Ripple, banking, liquidity, or local-access outage
        - High
        - Licensed payments solution and verified-user controls stated
        - Medium-high
      - - Stablecoin settlement assets
        - Third-party issuers including USDT and USDC
        - Underlying value and settlement assets
        - Asset mix and issuer limits unavailable
        - Depeg, freeze, reserve concern, or issuer restriction
        - Critical
        - Multiple supported assets; no exposure limits disclosed
        - High
    notes: >-
      The assigned evidence identifies roles but not contractual economics,
      concentration, termination rights, service levels, substitutability, or tested
      continuity; null concentration evidence is treated as a diligence gap, not zero.
    claimRefs: [CR010, CR011, CR012, CR013]
