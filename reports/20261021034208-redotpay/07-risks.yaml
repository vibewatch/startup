callouts:
  - calloutType: risk
    title: Litigation is a distribution and governance test
    body: >-
      Any injunction, material adverse judgment, settlement that constrains partner
      access, or evidence that management representations were unreliable should
      pause investment pending a refreshed legal and governance review.
    claimRefs: [CR001, CR002, CR003]
  - calloutType: recommendation
    title: Require proof before relying on mitigation claims
    body: >-
      Request the full AML/CFT review, entity-license matrix, audited customer-asset
      schedule, liquidity stress tests, incident history, critical-partner contracts,
      and a dated operating metric pack before treating rapid scale as risk offset.
    claimRefs: [CR004, CR005, CR008, CR010, CR012, CR014, CR015, CR016]
