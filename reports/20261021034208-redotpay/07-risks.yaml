        - Selected regions; exact public perimeter unavailable
        - Company disclaims settlement guarantee and places compliance duties on users
        - Medium
        - High
        - Early; disclosure-led
        - High
        - Test sanctions, fraud, disputes, complaints, monitoring, escalation, and consumer-protection controls
    notes: >-
      Qualitative likelihood, impact, maturity, and residual ratings are analyst
      judgments based only on the cited October 2026 evidence; coverage is partial
      because primary court records and a complete entity-license matrix were not available.
    enumerationScope:
