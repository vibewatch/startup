artifact: "customers"
slug: "redotpay"
runDate: "2026-10-21"
company:
  name: "RedotPay"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    RedotPay's public traction has increased from more than 6 million registered users and
    more than $10 billion of annualized payment volume in November 2025 to a current
    homepage snapshot of 9 million-plus global users and $12 billion of annualized payment
    volume. The evidence still does not disclose active users, retention, cohorts, segment
    economics, named customer references, or concentration, while an active Binance dispute
    introduces material uncertainty around channel-sourced acquisition.
sections:
  - id: "who-pays-and-uses"
    title: "Who pays, uses, and benefits"
    body: >-
      RedotPay presents a consumer-led customer base rather than a conventional enterprise
      account roster. The core user funds a wallet and pays for subscriptions, travel,
      everyday purchases, or cash withdrawals through virtual and physical cards. Adjacent
      segments include verified users sending crypto into local bank accounts, people
      transferring funds to another RedotPay user, and peer-to-peer traders using local
      payment methods. The company explicitly targets digital nomads, freelancers,
      entrepreneurs, and people working abroad for local-currency payouts. These are
      plausible user jobs, but the public evidence does not allocate users, volume, or
      revenue among them, so segment attractiveness cannot yet be ranked economically.
    claimRefs: ["CU007", "CU008", "CU009", "CU010", "CU011"]
    tableRefs: ["TU001"]
  - id: "adoption-trajectory"
    title: "Adoption trajectory is visible, but definitions drift"
    body: >-
      Company-issued figures show a meaningful rise in the scale displayed to the market.
      A December 2025 release reported more than 6 million registered users across more than
      100 markets and more than $10 billion of annualized payment volume as of November
      2025. The homepage reviewed on the run date displays 9 million-plus global users,
      100-plus countries, and $12 billion of annualized payment volume. A separate August
      2026 report relayed RedotPay's statement that the customer base had passed 8 million.
      The direction is positive, but "registered users" and "global users" are not proven
      equivalent, and annualized volume is a run-rate measure rather than realized annual
      transaction volume.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006", "CU016"]
    tableRefs: ["TU002"]
  - id: "reference-quality-and-durability"
    title: "Reference quality and durability remain unproven"
    body: >-
      The strongest customer illustrations in the allocated evidence are anonymous personas
      repeated from a RedotPay statement: a North African small-business owner paying for an
      AI subscription, a Central Asian user making a first contactless phone payment, and
      South American savers holding dollars for travel. They demonstrate credible jobs to
      be done, not named production references, measured outcomes, renewals, or durable
      cohorts. No retained source publishes monthly active users, transaction frequency,
      repeat-purchase rates, gross or net retention, churn, contract duration, satisfaction,
      or segment-level contribution. This leaves the quality of the reported user base and
      the persistence of payment volume as material diligence gaps.
    claimRefs: ["CU006", "CU014"]
    tableRefs: ["TU003"]
  - id: "expansion-and-concentration"
    title: "Expansion surfaces broaden while channel concentration is opaque"
    body: >-
      The product journey creates several potential expansion loops: card users can add
      internal transfers, local-currency payouts, peer-to-peer trading, credit, or Earn.
      Availability is not uniform. NGN payouts require verification and a local bank
      account, P2P is limited to selected regions, and Crypto Earn is not offered to the
      Hong Kong public. Channel durability also needs scrutiny. Fintech News Hong Kong
      reported that Binance-affiliated companies alleged more than 470,000 users were
      diverted through a Binance Pay card-funding arrangement. The allegation is contested
      and unresolved, but its scale makes acquisition provenance, partner dependence, and
      customer concentration priority diligence items.
    claimRefs: ["CU008", "CU009", "CU011", "CU012", "CU013", "CU015"]
    figureRefs: ["FU001"]
