    notes: >-
      Values preserve the issuers' labels and periods. Annualized payment volume is not realized
      yearly volume, and registered users are not assumed to be active or retained customers.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006", "CU016"]
