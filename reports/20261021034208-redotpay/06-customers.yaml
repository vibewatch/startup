figures:
  - id: "FU001"
    title: "Customer adoption surfaces and expansion journey"
    type: "journey-map"
    summary: >-
      The public product surface supports a multi-step consumer journey, but no conversion,
      retention, or expansion rates are disclosed.
    data:
      nodes:
        - id: "need"
          label: "Need accessible dollar-linked payments"
          detail: "Users seek online spending, travel utility, or cross-border value movement."
          touchpoints: ["Card", "Wallet", "Payout"]
        - id: "onboard"
          label: "Verify and fund"
          detail: "Users verify identity and fund a RedotPay wallet before applying for or using products."
          touchpoints: ["App", "Identity verification", "Wallet funding"]
        - id: "spend"
          label: "Spend or withdraw"
          detail: "Virtual and physical cards support purchases, subscriptions, travel, and ATM withdrawals."
          touchpoints: ["Virtual card", "Physical card", "ATM"]
        - id: "send"
          label: "Send inside the network"
          detail: "Users can send to another RedotPay user through a UID, email address, or phone number."
          touchpoints: ["UID", "Email", "Phone number"]
        - id: "cash-out"
          label: "Receive local currency"
          detail: "Verified users can route supported assets to local bank accounts in selected payout markets."
          touchpoints: ["NGN", "BRL", "MXN"]
        - id: "expand"
          label: "Add adjacent products"
          detail: "P2P, credit, and Earn broaden engagement, subject to eligibility and regional restrictions."
          touchpoints: ["P2P", "Credit", "Earn"]
    approximationNotes: >-
      Ordered from public product descriptions; stage order does not imply measured conversion,
      value-proportional scale, retention, or universal regional availability.
    claimRefs: ["CU007", "CU008", "CU009", "CU011", "CU012", "CU013"]
callouts:
  - calloutType: "risk"
    title: "User count is not an activity or retention metric"
    body: >-
      Public labels move between registered users, customer base, and global users. Without
      active-user, funded-account, frequency, cohort, or churn definitions, the 9M+ figure
      cannot establish durable adoption or customer lifetime value.
    claimRefs: ["CU001", "CU004", "CU006", "CU016"]
  - calloutType: "risk"
    title: "Acquisition provenance may be legally and commercially material"
    body: >-
      The reported Binance-affiliate claim concerns more than 470,000 allegedly diverted
      users. Until the litigation and underlying agreements are reviewed, treat channel
      ownership, acquisition economics, and continuity as unresolved rather than proven risk.
    claimRefs: ["CU015"]
