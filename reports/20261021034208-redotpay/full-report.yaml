      - number: '1.4'
        title: Regulatory claims and litigation overhang
        blocks:
          - type: paragraph
            body: >-
              The company says it is a VASP in Argentina, an MSB in Canada, a FinCEN-registered MSB in the United
              States, and holds Hong Kong money-lender and TCSP licenses. Those statements do not substitute for a
              legal-entity and product-by-product licensing matrix; RedotPay also says its U.S. FinCEN registration does
              not involve serving U.S. citizens. Separately, Binance affiliates allege that RedotPay diverted more than
              470,000 customers and claim $472.8 million in losses. RedotPay denies the allegations and says the
              proceedings do not affect day-to-day operations. The dispute is therefore a live adverse event, not an
              adjudicated liability, but its timing and claimed customer-acquisition mechanics increase diligence
              sensitivity around partner dependencies, growth quality, and IPO readiness.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
