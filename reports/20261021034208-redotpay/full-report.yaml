  - id: FM001
    title: Evidence ladder from broad demand to serviceable access
    type: pyramid
    summary: >-
      Reported reach narrows through actual payment activity, local payout use cases, and jurisdiction- and
      product-specific constraints before becoming a defensible serviceable market.
    data:
      items:
        - label: Reported user reach
          value: 9M+ global users
          detail: Company-reported footprint; active-user and cohort quality are not disclosed.
        - label: Reported geographic reach
          value: 100+ countries
          detail: Presence does not imply that every product is available in every jurisdiction.
        - label: Reported transaction scale
          value: $12B annualized payment volume
          detail: Payment volume is not revenue and the annualization method is undisclosed.
        - label: Remittance problem
          value: 6.49% average fees; 1-5 business days
          detail: Company announcement's global problem framing, not an independently retained benchmark.
        - label: Localized market access
          value: Argentina, Canada, Mexico
          detail: Registrations and planned local payouts or card programs create specific entry paths.
        - label: Serviceable constraints
          value: U.S. citizen service excluded; Hong Kong Earn excluded
          detail: Product and jurisdiction restrictions reduce broad reported reach to a narrower addressable wedge.
    approximationNotes: >-
      Ordered as an evidence and access ladder, not a value-proportional TAM funnel; no conversion rates or implied
      market shares are calculated.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM009
      - CM011
      - CM012
      - CM014
      - CM015
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Ordinal placement separates emerging-market stablecoin focus from product breadth; it is an analytical map, not a
      measured market benchmark.
    data:
      xAxis:
        label: Emerging-market stablecoin focus
        min: 1
        max: 5
      yAxis:
        label: Product breadth
        min: 1
        max: 5
      points:
        - label: RedotPay
          x: 5
          'y': 5
          detail: Integrated card, payouts, wallet, credit, Earn, swap, and P2P with emerging-market positioning.
        - label: ether.fi
          x: 3
          'y': 3
          detail: Non-custodial card alternative with lower evidenced TWD fees and free-tier rewards.
        - label: Crypto.com
          x: 2
          'y': 5
          detail: Broad exchange and rewards ecosystem; current detailed terms were not in the assigned pool.
        - label: Wirex
          x: 2
          'y': 4
          detail: Broad currency support reported by a third-party directory.
        - label: Nexo
          x: 2
          'y': 4
          detail: Card and lending adjacency reported by a third-party directory.
        - label: Wise
          x: 1
          'y': 3
          detail: Fiat-first cross-border substitute without a stablecoin-centered proposition.
