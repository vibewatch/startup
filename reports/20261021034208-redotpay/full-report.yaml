    title: Recommendation summary
    columns:
      - Decision factor
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Do not set an entry price until current financial and legal evidence is available.
      - - Confidence and risk
        - Medium confidence; high risk
        - Scale is visible, but evidence quality and unresolved downside limit conviction.
      - - Valuation stance
        - Indeterminate
        - Treat the reported $1B post-money mark as a reference point, not verified fair value.
    notes: >-
      Assessments are analyst judgments based on the cited company disclosures and secondary reports; no audited
      financial statements, cap table, or current financing terms were available.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV015
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - Current company disclosures show 9M users and $12B annualized payment volume.
        - Processor and bank records confirming active-user quality, retention, and volume would strengthen the thesis.
      - - Thesis
        - The company reported more than $150M annualized revenue and profitable growth in November 2025.
        - Audited 2026 revenue, gross margin, and cash conversion would support a positive re-rating.
      - - Anti-thesis
        - Earn terms disclose geographic restrictions plus borrower-default and liquidity risks.
        - Entity-level licenses, asset-liability data, and independently tested controls could narrow the risk discount.
      - - Anti-thesis
        - Binance affiliates reportedly seek nearly $473M over alleged user diversion; RedotPay contests the claims.
        - >-
          Court records, counsel analysis, insurance, and a bounded loss estimate are required before pricing the
          exposure.
    notes: >-
      Company metrics are unaudited claims; the lawsuit row describes allegations and RedotPay's reported response, not
      an adjudicated finding.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: Bull, base, and bear evidence scenarios
    columns:
      - Scenario
      - Assumptions and probability signal
      - Valuation and return logic
      - Downside trigger
    rows:
      - - Bull
        - >-
          Audited current growth and profitability confirm the 2025 trajectory; legal exposure is bounded; licenses and
          partner access remain durable.
        - >-
          A premium to the reported $1B reference could be evaluated only after comparable multiples and transaction
          terms are verified; no numeric range is supportable now.
        - Failure to reconcile company metrics to processor, bank, and audited records.
      - - Base
        - Scale persists but active-user quality, margins, cash conversion, and cap-table terms remain unverified.
        - >-
          At or near the reported $1B reference, public evidence does not establish the target return, dilution, hold
          period, or exit value.
        - Material slowdown, adverse preference terms, or continuing inability to verify economics.
      - - Bear
        - >-
          The partner dispute constrains distribution, legal exposure remains unbounded, or regulatory restrictions
          impair core products.
        - >-
          A discount to $1B may still be insufficient because public evidence cannot bound liability or liquidity; price
          is deferred rather than assigned.
        - Court, licensing, liquidity, or partner developments that threaten continued operations or financing access.
    notes: >-
      These are conditional evidence scenarios, not probability-weighted forecasts. Numeric fair-value ranges are
      intentionally withheld because audited inputs and comparable benchmarks are absent.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV013
      - CV014
      - CV015
      - CV016
