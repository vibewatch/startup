  - id: FI001
    title: Revenue model bridge from customer activity to undisclosed gross profit
    type: flow
    summary: >-
      Public evidence identifies the activity and monetization surfaces, but not the deductions needed to bridge payment
      volume into recognized revenue and gross profit.
    data:
      nodes:
        - id: funded-balance
          label: Funded balance
          detail: Users deposit stablecoins or other digital assets into the RedotPay environment.
        - id: customer-activity
          label: Customer activity
          detail: Card purchases, payouts, in-app transfers, P2P trades, swaps, credit, and Earn.
        - id: conversion-settlement
          label: Conversion and settlement
          detail: Crypto is converted and merchants or payout recipients receive fiat.
        - id: payment-volume
          label: Annualized payment volume
          detail: Public figures range from $10B+ to $14B across different snapshots.
        - id: monetization
          label: Monetization surfaces
          detail: Card fees, conversion economics, payout pricing, lending yield, swap spread, and Earn spread.
        - id: cost-deductions
          label: Cost deductions
          detail: Card, payout, liquidity, fraud, compliance, customer-support, and funding costs are not quantified.
        - id: gross-profit
          label: Gross profit
          detail: No audited gross-margin or contribution-margin bridge is publicly available.
    approximationNotes: >-
      The sequence is conceptual and not value-proportional; no conversion rate, take rate, or gross-profit amount is
      inferred.
    claimRefs:
      - CI001
      - CI002
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
  - id: FE001
    title: Public product and operating dependency stack
    type: stack
    summary: >-
      A conceptual stack of the externally evidenced layers required to move a user from app access to card, chain,
      payout, or Earn outcomes.
    data:
      layers:
        - label: Customer surfaces
          items:
            - Mobile app
            - Virtual card
            - Physical card
            - P2P
            - Earn
          detail: The visible product layer through which users onboard and select workflows.
        - label: Identity and monitoring
          items:
            - Identity verification
            - Sumsub KYC
            - Beosin KYT
          detail: Company-named onboarding and transaction-control inputs.
        - label: Wallet and asset records
          items:
            - Multi-currency wallet
            - User balances
            - Earn account ledger
          detail: >-
            The wallet is provided through licensed institutions; Earn records a pooled claim rather than segregated
            assets.
        - label: Asset and conversion connectivity
          items:
            - Supported blockchains
            - SUI
            - USDC-Sui
            - Other supported assets
          detail: Integrations connect digital assets to conversion, spending, and payout workflows.
        - label: Payment orchestration
          items:
            - Card network
            - Ripple Payments
            - P2P counterparties
          detail: External rails route a selected customer action toward a fiat endpoint.
        - label: Settlement and risk endpoints
          items:
            - Merchants and ATMs
            - Local bank accounts
            - Yield platforms
            - Borrowers and validators
          detail: Final delivery and risk-bearing endpoints sit outside the consumer interface.
    approximationNotes: >-
