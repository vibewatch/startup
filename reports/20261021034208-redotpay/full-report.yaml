              - CU011
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: User count is not an activity or retention metric
            body: >-
              Public labels move between registered users, customer base, and global users. Without active-user,
              funded-account, frequency, cohort, or churn definitions, the 9M+ figure cannot establish durable adoption
              or customer lifetime value.
            calloutType: risk
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU016
          - type: callout
            title: Acquisition provenance may be legally and commercially material
            body: >-
              The reported Binance-affiliate claim concerns more than 470,000 allegedly diverted users. Until the
              litigation and underlying agreements are reviewed, treat channel ownership, acquisition economics, and
              continuity as unresolved rather than proven risk.
            calloutType: risk
            claimRefs:
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure is active, not hypothetical
        blocks:
          - type: paragraph
            body: >-
              Binance-affiliated entities have filed proceedings in Hong Kong alleging that RedotPay's founders breached
              a partnership agreement by diverting more than 470,000 users; the reported damages claim is US$472.8
              million. RedotPay denies the allegations and says it will defend the claims, but that response is not a
              mitigation of potential damages, injunctions, partner termination, management distraction, or discovery
              risk. Separately, a company-issued release says a Big Four firm reviewed AML/CFT controls at two licensed
              Hong Kong subsidiaries. Independent coverage cautions that this was not regulatory approval, and neither
              the firm's identity nor the report was published. The review is therefore a positive control signal with
              limited diligence value. Crypto Earn's exclusion of Hong Kong residents and its contracting through RedotX
              Panama further show that product availability, legal entity, and customer jurisdiction must be mapped
              service by service.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
      - number: '7.2'
        title: Product disclosures transfer material asset and execution risk to users
        blocks:
          - type: paragraph
            body: >-
              Crypto Earn terms state that subscribed assets are not segregated, may be commingled with group and client
              assets, and may be deployed into lending, staking, liquidity pools, or operating uses without
              transaction-level user direction. The same terms acknowledge that defaults, inadequate collateral, an
              unrecovered insurance-fund shortfall, hacks, technical failures, or liquidity stress could delay
              redemptions or cause partial or total loss. RedotPay's P2P disclosure likewise says it acts only as
              facilitator and does not guarantee settlement, completion, or outcome. These disclosures reduce
              mis-selling ambiguity but do not reduce the underlying exposure. The public evidence does not provide
              asset-liability matching, reserve, insurance-fund, counterparty-concentration, incident-history,
              recovery-time, or stress-test data. Residual operational and financial risk is therefore high until those
              controls and loss-absorption resources can be tested directly.
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR016
      - number: '7.3'
        title: Global reach depends on counterparties RedotPay does not control
        blocks:
          - type: paragraph
            body: >-
              RedotPay says it is not a bank and that its multi-currency wallet is supplied by appropriately licensed
              financial institutions. Its card product uses the Visa network, while the Nigeria payout product uses
              Ripple Payments and requires a verified user's local bank account. An external wallet provider also
              describes the model as custodial and dependent on card networks and third-party stablecoin issuers. These
              relationships accelerate distribution but create multiple failure and termination points: issuer or
              banking access, card-network acceptance, payout availability, stablecoin reserves, and local account
              connectivity. The Binance dispute demonstrates that a failed commercial relationship can become both a
              legal and distribution event. Public materials do not identify redundancy, termination rights, service
              levels, concentration, economics, or transition plans for the critical partners, so mitigation maturity
              cannot be rated above early.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Monitoring should focus on evidence that can break the thesis
        blocks:
          - type: paragraph
            body: >-
              The immediate legal monitor is any adverse ruling, injunction, settlement, or restriction arising from the
              Binance-affiliate proceedings; loss of a material funding, card, wallet, or payout relationship would be a
              related thesis-break event. Regulatory diligence should require a legal-entity and license matrix tied to
              each product and jurisdiction, plus the full AML/CFT review scope, exceptions, remediation plan, and
              reviewer's identity. For customer assets, investment should pause if management cannot evidence
              segregation by product, liquid-asset coverage, counterparty limits, insurance-fund capacity, redemption
              stress tests, and incident response. Finally, public scale claims are not internally reconciled: the
              current homepage reports 9 million-plus users and US$12 billion of annualized payment volume, while
              independent coverage reports more than 8.5 million users and roughly US$14 billion. A dated, consistently
              defined operating pack is required before scale can be used to offset the risk case.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR008
              - CR010
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Litigation is a distribution and governance test
            body: >-
              Any injunction, material adverse judgment, settlement that constrains partner access, or evidence that
              management representations were unreliable should pause investment pending a refreshed legal and
              governance review.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Require proof before relying on mitigation claims
            body: >-
              Request the full AML/CFT review, entity-license matrix, audited customer-asset schedule, liquidity stress
              tests, incident history, critical-partner contracts, and a dated operating metric pack before treating
              rapid scale as risk offset.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR010
              - CR012
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view and recommendation
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that RedotPay has moved beyond a concept-stage crypto card: its current website
              claims 9 million users and $12 billion of annualized payment volume, while the December 2025 financing
              release reported more than $150 million of annualized revenue and profitable growth. Those are meaningful
              scale signals, but they are not audited results, active-user cohorts, cash generation, or proof that the
              economics are durable. A secondary report placed the Series B at a $1 billion post-money valuation. That
              reference is useful for entry discipline, not sufficient evidence of fair value. The appropriate call is
              research-more rather than buy or pass: require current financial, legal, and capitalization evidence
              before underwriting price or target return.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and downside
        blocks:
          - type: paragraph
            body: >-
              The thesis combines demonstrated product breadth with large self-reported scale and institutional
              financing. Cards, payouts, wallets, credit, earn, swaps, and peer-to-peer services create several
              monetization paths, while the Ripple integration shows an additional payout corridor. The anti-thesis is
              equally material. Product breadth expands regulatory and counterparty surfaces; Crypto Earn is expressly
              unavailable to the Hong Kong public and its terms describe borrower-default and liquidity risks.
              Separately, Binance affiliates reportedly seek nearly $473 million in damages over alleged user diversion.
              RedotPay contests those allegations, so the claim is not treated as an established liability, but the
              amount and partner dispute are large enough to impair valuation confidence until court records, insurance,
              reserves, and operational effects are reviewed.
            claimRefs:
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Financing context and scenario discipline
        blocks:
          - type: paragraph
            body: >-
              The December 2025 Series B was reported at $107 million and the company said total capital raised during
              2025 reached $194 million. The same release stated that proceeds would support acquisitions, licensing,
              compliance, and hiring; funding raised therefore should not be confused with cash currently available.
              Using the reported $1 billion post-money mark and the company's then-current annualized revenue claim
              yields an illustrative ratio of about 6.7 times annualized revenue, not ARR and not a verified trading
              multiple. No source in the assigned evidence set supplies audited 2026 revenue, margins, cash flow,
              liquidation preferences, dilution, debt, or credible comparable transactions. Bull, base, and bear cases
              can therefore define evidence thresholds and price discipline, but a numeric fair-value range would be
              false precision.
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Diligence path, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by the available public evidence. Before an investment committee sets
              entry price, ownership target, hold period, or return hurdle, management should provide audited
              statements, monthly cohorts, take rate, gross margin, loss and fraud rates, cash balance, legal-entity
              licensing, and the fully diluted capitalization table with preference terms. Counsel should quantify the
              Binance claims, procedural status, insurance coverage, and plausible loss range. The thesis breaks if
              current revenue or profitability cannot be reconciled to bank and processor records, if partner access
              materially weakens, if licensing blocks core corridors, or if legal exposure threatens liquidity. A
              positive re-rating requires independent confirmation of durable growth and economics; a lower price alone
              cannot cure unbounded legal or governance risk.
            claimRefs:
              - CV006
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
