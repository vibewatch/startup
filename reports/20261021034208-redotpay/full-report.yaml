      - number: '1.3'
        title: Scale claims and public-market readiness
        blocks:
          - type: paragraph
            body: >-
              RedotPay's reported scale has continued to rise: its December 2025 financing release cited more than 6
              million registered users, more than $10 billion in annualized payment volume, and more than $150 million
              in annualized revenue, while the current company website displays 9 million users and $12 billion in
              annualized payment volume. These are company-reported operating metrics, not audited financial statements,
              ARR, cash balance, or active-user cohorts. Independent reporting says the company completed financial and
              AML/CFT reviews in 2026, but the firms were unnamed and the statements themselves were not public. IPO
              reporting also diverges between an earlier potential $4 billion valuation and a later target above $5
              billion, with no filed prospectus or firm listing date.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
