chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              RedotPay is the trading name of Hong Kong-based Red F. Technology Limited, which Preqin dates to 2023. Its
              consumer proposition connects stablecoins to familiar payment and transfer workflows: virtual and physical
              cards, cross-border payouts, a multi-currency wallet, crypto-backed credit, swaps, and a peer-to-peer
              marketplace. The company explicitly says it is a fintech service provider rather than a bank, and that
              licensed financial institutions provide its multi-currency wallet. Preqin describes transaction fees as
              the core revenue mechanism. This positions RedotPay as an orchestration layer between digital-asset
              holders, licensed financial institutions, payment networks, and local-currency endpoints, making partner
              continuity and licensing scope central to the business model rather than peripheral compliance details.
            claimRefs:
              - CO001
              - CO002
              - CO015
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO008
              - CO010
              - CO011
      - number: '1.2'
        title: Leadership, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              Michael Gao is consistently identified as co-founder and chief executive, while the wider founder roster
              is less settled in public materials. Preqin names Jonathan Chan; reporting on Binance's court petition
              names Gao Zhangpeng, Chan Wa Choi, and Yao Chao as co-founders, without enough evidence here to resolve
              aliases or current operating roles. RedotPay announced a $107 million Series B in December 2025 and said
              this brought capital raised during 2025 to $194 million. The round was led by Goodwater Capital, with
              Pantera Capital, Blockchain Capital, Circle Ventures, HSG, and others named as participants or continuing
              backers. Public sources reviewed do not provide a complete board, cap table, voting-rights map, or
              management succession plan, leaving meaningful key-person and control diligence outstanding.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
