company:
  name: RedotPay
chapter:
  number: 8
  title: Valuation
  summary: >-
    RedotPay has credible scale signals and a reported $1 billion post-money financing
    reference, but the evidence remains dominated by company disclosures and secondary
    reporting rather than audited financials or transaction-grade terms. The recommendation
    is research-more with medium confidence, high risk, and an indeterminate valuation stance
    until current economics, legal exposure, cap-table terms, and comparable benchmarks are verified.
sections:
  - id: investment-view
    title: Investment view and recommendation
    body: >-
      The investable thesis is that RedotPay has moved beyond a concept-stage crypto card:
      its current website claims 9 million users and $12 billion of annualized payment volume,
      while the December 2025 financing release reported more than $150 million of annualized
      revenue and profitable growth. Those are meaningful scale signals, but they are not
      audited results, active-user cohorts, cash generation, or proof that the economics are
      durable. A secondary report placed the Series B at a $1 billion post-money valuation.
      That reference is useful for entry discipline, not sufficient evidence of fair value.
      The appropriate call is research-more rather than buy or pass: require current financial,
      legal, and capitalization evidence before underwriting price or target return.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and downside
    body: >-
      The thesis combines demonstrated product breadth with large self-reported scale and
      institutional financing. Cards, payouts, wallets, credit, earn, swaps, and peer-to-peer
      services create several monetization paths, while the Ripple integration shows an
      additional payout corridor. The anti-thesis is equally material. Product breadth expands
      regulatory and counterparty surfaces; Crypto Earn is expressly unavailable to the Hong
      Kong public and its terms describe borrower-default and liquidity risks. Separately,
      Binance affiliates reportedly seek nearly $473 million in damages over alleged user
      diversion. RedotPay contests those allegations, so the claim is not treated as an
      established liability, but the amount and partner dispute are large enough to impair
      valuation confidence until court records, insurance, reserves, and operational effects are reviewed.
    claimRefs: [CV010, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV002]
  - id: financing-and-scenarios
    title: Financing context and scenario discipline
    body: >-
      The December 2025 Series B was reported at $107 million and the company said total
      capital raised during 2025 reached $194 million. The same release stated that proceeds
      would support acquisitions, licensing, compliance, and hiring; funding raised therefore
      should not be confused with cash currently available. Using the reported $1 billion
      post-money mark and the company's then-current annualized revenue claim yields an
      illustrative ratio of about 6.7 times annualized revenue, not ARR and not a verified
      trading multiple. No source in the assigned evidence set supplies audited 2026 revenue,
      margins, cash flow, liquidation preferences, dilution, debt, or credible comparable
      transactions. Bull, base, and bear cases can therefore define evidence thresholds and
      price discipline, but a numeric fair-value range would be false precision.
    claimRefs: [CV001, CV005, CV009, CV011]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Diligence path, exit readiness, and thesis breaks
    body: >-
      Exit readiness is not established by the available public evidence. Before an investment
      committee sets entry price, ownership target, hold period, or return hurdle, management
      should provide audited statements, monthly cohorts, take rate, gross margin, loss and
      fraud rates, cash balance, legal-entity licensing, and the fully diluted capitalization
      table with preference terms. Counsel should quantify the Binance claims, procedural
      status, insurance coverage, and plausible loss range. The thesis breaks if current
      revenue or profitability cannot be reconciled to bank and processor records, if partner
      access materially weakens, if licensing blocks core corridors, or if legal exposure
      threatens liquidity. A positive re-rating requires independent confirmation of durable
      growth and economics; a lower price alone cannot cure unbounded legal or governance risk.
    claimRefs: [CV006, CV011, CV013, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision factor, Assessment, Decision implication]
    rows:
      - [Recommendation, Research more, "Do not set an entry price until current financial and legal evidence is available."]
      - [Confidence and risk, "Medium confidence; high risk", "Scale is visible, but evidence quality and unresolved downside limit conviction."]
      - [Valuation stance, Indeterminate, "Treat the reported $1B post-money mark as a reference point, not verified fair value."]
    notes: >-
      Assessments are analyst judgments based on the cited company disclosures and secondary
      reports; no audited financial statements, cap table, or current financing terms were available.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "Current company disclosures show 9M users and $12B annualized payment volume.", "Processor and bank records confirming active-user quality, retention, and volume would strengthen the thesis."]
      - [Thesis, "The company reported more than $150M annualized revenue and profitable growth in November 2025.", "Audited 2026 revenue, gross margin, and cash conversion would support a positive re-rating."]
      - [Anti-thesis, "Earn terms disclose geographic restrictions plus borrower-default and liquidity risks.", "Entity-level licenses, asset-liability data, and independently tested controls could narrow the risk discount."]
      - [Anti-thesis, "Binance affiliates reportedly seek nearly $473M over alleged user diversion; RedotPay contests the claims.", "Court records, counsel analysis, insurance, and a bounded loss estimate are required before pricing the exposure."]
    notes: >-
      Company metrics are unaudited claims; the lawsuit row describes allegations and RedotPay's
      reported response, not an adjudicated finding.
    claimRefs: [CV005, CV006, CV007, CV008, CV013, CV014, CV015, CV016]
  - id: TV003
    title: Bull, base, and bear evidence scenarios
    columns: [Scenario, Assumptions and probability signal, Valuation and return logic, Downside trigger]
    rows:
      - [Bull, "Audited current growth and profitability confirm the 2025 trajectory; legal exposure is bounded; licenses and partner access remain durable.", "A premium to the reported $1B reference could be evaluated only after comparable multiples and transaction terms are verified; no numeric range is supportable now.", "Failure to reconcile company metrics to processor, bank, and audited records."]
      - [Base, "Scale persists but active-user quality, margins, cash conversion, and cap-table terms remain unverified.", "At or near the reported $1B reference, public evidence does not establish the target return, dilution, hold period, or exit value.", "Material slowdown, adverse preference terms, or continuing inability to verify economics."]
      - [Bear, "The partner dispute constrains distribution, legal exposure remains unbounded, or regulatory restrictions impair core products.", "A discount to $1B may still be insufficient because public evidence cannot bound liability or liquidity; price is deferred rather than assigned.", "Court, licensing, liquidity, or partner developments that threaten continued operations or financing access."]
    notes: >-
      These are conditional evidence scenarios, not probability-weighted forecasts. Numeric
      fair-value ranges are intentionally withheld because audited inputs and comparable benchmarks are absent.
    claimRefs: [CV001, CV005, CV006, CV009, CV013, CV014, CV015, CV016]
figures:
