    title: Recommendation logic from scale to decision
    type: flow
    summary: >-
      Reported scale and financing support continued diligence, while evidence quality and
      legal uncertainty prevent a priced investment recommendation.
    data:
      nodes:
        - id: reported-mark
          label: Reported financing mark
          detail: "$1B post-money Series B reference reported by Gate."
        - id: operating-scale
          label: Current scale signal
          detail: "Company website claims 9M users and $12B annualized payment volume."
        - id: economics
          label: Economics signal
          detail: "Company reported more than $150M annualized revenue and profitable growth in November 2025."
        - id: evidence-discount
          label: Evidence discount
          detail: "No audited 2026 financials, cap table, preference terms, or comparable multiples in the assigned evidence."
        - id: downside
          label: Downside overhang
          detail: "Reported litigation seeks nearly $473M; RedotPay contests the allegations."
        - id: decision
          label: Research more
          detail: "Defer price, return target, and exit underwriting until the missing evidence is obtained."
    approximationNotes: >-
      This is a qualitative decision sequence; node order does not represent probability or magnitude.
    claimRefs: [CV001, CV005, CV007, CV008, CV014, CV015, CV016]
