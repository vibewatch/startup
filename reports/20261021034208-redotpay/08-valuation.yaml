  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-comparables
      missingEvidence: >-
        Recent public-company multiples, private-round terms, secondary marks, and relevant
        payments or stablecoin M&A transactions on a comparable revenue and margin basis.
      whyItMatters: >-
        Without benchmark evidence, the reported financing mark cannot be translated into a
        defensible valuation range or required return.
      diligencePath: >-
        Obtain the financing deck and banker materials, then build a dated comparable set using
        audited revenue, gross profit, growth, and regulatory-risk adjustments.
      relatedQuestionRefs: [QV007]
      relatedTableRefs: [TV003]
    - type: private-evidence-only
      severity: material
      topic: financial-and-capitalization-diligence
      missingEvidence: >-
        Audited 2026 financials, cash balance, monthly cohorts, take rate, gross margin, loss
        rates, fully diluted cap table, liquidation preferences, debt, and current financing terms.
      whyItMatters: >-
        These inputs determine sustainable economics, dilution, entry price, target return,
        hold period, and whether funding raised remains available.
      diligencePath: >-
        Review audited statements, processor and bank reconciliations, board-approved budgets,
        financing documents, debt schedules, and the fully diluted ownership model in a data room.
      relatedQuestionRefs: [QV008]
      relatedTableRefs: [TV001, TV003]
    - type: conflicting-data
      severity: material
      topic: litigation
      missingEvidence: >-
        Primary court filings, procedural status, defense analysis, insurance coverage, reserves,
        and a counsel-supported range of plausible outcomes for the Binance dispute.
      whyItMatters: >-
        The reported damages request is large relative to the reported financing mark, while
        RedotPay contests the allegations and no adjudicated outcome is available.
      diligencePath: >-
        Have Hong Kong and Singapore counsel review the dockets, contracts, claims, defenses,
        insurance policies, liquidity implications, and partner-access contingencies.
      relatedQuestionRefs: [QV005, QV009]
      relatedTableRefs: [TV002, TV003]
