evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited financial statements, revenue-recognition policy, gross margin, cash balance, and cash-flow detail.
    whyItMatters: Annualized revenue and operating-margin claims cannot establish audited profitability, liquidity, or runway.
    diligencePath: >-
      Request the completed audit report, management accounts, bank statements, and auditor engagement details under
      NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Verified founder aliases, current executive roster, board seats, cap table, investor rights, and succession plan.
    whyItMatters: The public founder roster conflicts and does not establish control, oversight, or key-person resilience.
    diligencePath: >-
      Obtain corporate registry extracts, organization charts, board minutes, cap table, financing documents, and
      key-person plans.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: workforce
    missingEvidence: Current employee headcount by function and a complete list of operating locations and legal entities.
    whyItMatters: >-
      Execution capacity, compliance coverage, and geographic operating leverage cannot be assessed without workforce
      and entity data.
    diligencePath: Request payroll-backed headcount, functional and geographic splits, legal-entity register, and office leases.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: ipo
    missingEvidence: A filed prospectus, board-approved listing timetable, underwriter mandates, and a reconciled valuation target.
    whyItMatters: >-
      Reported valuation targets and listing timing conflict, so they cannot be treated as a completed financing or
      current valuation.
    diligencePath: >-
      Request board materials, engagement letters, draft registration documents, and written confirmation from appointed
      banks.
    relatedQuestionRefs:
      - QO005
      - QO007
  - type: missing-source
    severity: material
    topic: litigation
    missingEvidence: >-
      Complete Hong Kong and Singapore pleadings, partnership agreements, transaction logs, and current procedural
      status.
    whyItMatters: News reporting establishes allegations and denials but not liability, damages, or operational impact.
    diligencePath: >-
      Retrieve court dockets and operative pleadings, then obtain counsel's case assessment and the underlying partner
      contracts.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      An independent category definition and comparable top-down or bottoms-up TAM, SAM, and SOM for stablecoin-funded
      card spending and crypto-to-local-currency payouts.
    whyItMatters: >-
      Without a comparable denominator, reported users, country reach, and payment volume cannot establish penetration
      or remaining market headroom.
    diligencePath: >-
      Commission or obtain an independent market study, then reconcile it with country eligibility, active verified
      users, and transaction-level volume.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segment-level active users, payer identity, fee incidence, customer acquisition cost, retention, and contribution
      margin.
    whyItMatters: >-
      Buyer reach does not establish willingness to pay or economically serviceable demand without conversion,
      retention, and margin evidence.
    diligencePath: >-
      Request anonymized cohort and unit-economic exports segmented by card spending, remittance corridor, wallet,
      credit, and Earn usage.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-scale
    missingEvidence: >-
      Definitions and reconciliations for registered users, active users, annualized payment volume, gross transaction
      value, and recognized revenue.
    whyItMatters: >-
      The reported 9M users and $12B annualized payment volume are not comparable to active-user or revenue metrics and
      cannot be used interchangeably.
    diligencePath: >-
      Obtain management's metric dictionary, monthly active and transacting-user bridge, corridor mix, and audited
      reconciliation from payment volume to net revenue.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Current primary evidence for competitor active users, payment volume, funding, geographic availability, and
      realized pricing on a comparable basis.
    whyItMatters: >-
      Without like-for-like competitor metrics, RedotPay's company-issued scale cannot be converted into a defensible
      relative market position.
    diligencePath: >-
      Collect official filings, audited disclosures, regulator records, and current pricing schedules for ether.fi,
      Wirex, Crypto.com, Nexo, and Wise.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cohort retention, wallet balances, product attach rates, multi-homing, churn after fee changes, partner
      concentration, and account-migration data.
    whyItMatters: >-
      These measures determine whether product breadth creates durable lock-in or merely a bundle that customers can
      replace feature by feature.
    diligencePath: >-
      Request monthly cohorts, product-level activation and retention, partner contracts, concentration schedules, and
      win-loss interviews segmented by corridor.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited income statements, balance sheets, cash-flow statements, revenue-recognition policies, gross-margin
      schedules, and related audit opinion.
    whyItMatters: >-
      Annualized company run rates cannot establish recognized revenue, gross profit, cash generation, or balance-sheet
      solvency.
    diligencePath: >-
      Obtain the completed audit package and monthly management accounts, then reconcile payment volume to recognized
      revenue and gross profit by product.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, runway, debt, collateral obligations, working capital, and planned
