      - number: '4.3'
        title: 单位经济与资本充足性目前无法纳入投资判断
        blocks:
          - type: paragraph
            body: >-
              最有力的公开资本证据是历史融资可得性，而不是当前流动性。RedotPay 报告完成 $107 million 的 B 轮融资，并称 2025 年募资达到 $194
              million，资金拟用于收购、牌照、合规能力和招聘。这些用途意味着公司仍需持续投入，但募资额不能视为手头现金或现金跑道。CoinDesk
              报道的财务审计完成是积极的准备度信号，但保留证据没有公开经审计的损益表、资产负债表或现金流量表。CAC、回本周期、毛利率、交易损失率、客户集中度、准备金要求、营运资本时点、现金、烧钱、债务和现金跑道均未披露。Earn
              也引入资产负债表和流动性问题，因为其条款允许将客户资金池用于借贷、质押和运营目的。
