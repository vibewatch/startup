      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的用户群体包括寻求日常消费入口的加密资产持有者、向家乡汇款的移民或全球流动工作者，以及收取或转移跨境资金的数字游民、自由职业者和创业者。在尼日利亚出金流程中，经过验证的用户发送受支持的数字资产，收款人的银行账户收到奈拉，因此发送方是用户，也可能是付费方；本地收款人则从出金中受益。采用依赖身份验证、受支持资产、本地银行账户和本地出金基础设施。证据没有披露采购周期、获客成本、费用承担方或分群留存，因此具体预算归属和付费意愿仍是尽调事项。
            claimRefs:
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              跨境汇款的成本和速度缺口，以及通过熟悉的银行卡和银行通道消费稳定币的需求，是现有证据支持的主要采用驱动因素。监管进展可以扩大可服务市场：阿根廷和加拿大支持本地化托管或出金计划，墨西哥则增加了本地虚拟资产注册和发卡机构审批。但注册并不等于可以不受限制地分销；FinTech
              Futures 报道称，美国 MSB 注册支持基础设施和跨境处理，却不支持服务美国公民。产品邻近业务也会增加风险：Earn
              资产没有隔离，可能被集中和部署，并可能在特殊情况下损失。因此，估值应奖励已验证的交易深度和市场准入，而不应只看宽泛类别的 TAM。
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 分销证据强于市场规模证据
            body: 保留的来源支持其当前触达和支付活动具有一定规模，但无法把注册用户或年化支付量转换成独立的可服务市场估算。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM016
          - type: callout
            title: 监管广度不等于产品权限全面
            body: 本地注册可以解锁特定流程，而明确的美国和香港限制说明，不能把国家数量当作统一的可服务市场。
            calloutType: risk
            claimRefs:
