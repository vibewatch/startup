          detail: 法院报道显示，原安排结束后，双方于 2025 年 3 月签署了新协议。
          tone: neutral
          claimRefs:
            - CO012
        - date: '2025-12-16'
          label: $107 million 的 Series B 轮
          detail: RedotPay 宣布完成 Series B，使 2025 年累计募资达到 $194 million。
          tone: positive
          claimRefs:
            - CO005
            - CO006
        - date: '2026-02-25'
          label: 据报道可能进行美国 IPO
          detail: 报道称双方讨论过募资约 $1 billion，估值可能达到 $4 billion。
          tone: neutral
          claimRefs:
            - CO011
        - date: '2026-08-06'
          label: 据报道 Binance 诉讼
          detail: Binance 关联方指控用户被转移，并称损失达 $472.8 million；RedotPay 否认这些主张。
          tone: negative
          claimRefs:
            - CO013
            - CO014
        - date: '2026-08-14'
          label: 据报道 IPO 暂停
          detail: Mark Radar 汇总报道称，潜在的美国发行因监管和法律问题而暂缓。
          tone: negative
          claimRefs:
            - CO011
        - date: '2026-09-28'
          label: 审计完成与 IPO 立场
          detail: 独立报道表示财务和 AML/CFT 审查已经完成，但未披露确定的上市日期。
          tone: neutral
          claimRefs:
            - CO009
            - CO010
