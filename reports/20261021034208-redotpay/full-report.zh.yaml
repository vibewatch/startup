      - number: '8.3'
        title: 融资背景与情景纪律
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月的 B 轮融资金额据报为 $107 million，公司称 2025 年累计募资达到 $194
              million。同一公告称资金将用于收购、牌照、合规和招聘；因此不能把募资额混同为当前可用现金。按报道的 $1 billion 投后估值和公司当时自报的年化收入计算，示意比率约为年化收入的 6.7
              times；这不是 ARR，也不是经验证的交易倍数。指定证据集中没有来源提供经审计的 2026
              年收入、利润率、现金流、清算优先权、稀释、债务或可信可比交易。因此，乐观、基准和悲观情景可以定义证据门槛和价格纪律，但给出数值公允价值区间会制造虚假精确。
