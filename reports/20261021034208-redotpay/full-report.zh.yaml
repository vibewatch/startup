  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与战略群组
        blocks:
          - type: paragraph
            body: >-
              买方可以通过多个类别解决底层需求，而不是面对一组单一的直接同业。RedotPay 和 ether.fi 最直接地争夺基于卡片的加密资产消费；Wirex、Crypto.com 和 Nexo
              则从更广泛的加密生态延伸卡片。Wise 代表以法币为主的跨境替代方案，用户也可以用自托管钱包、交易所或出金服务商、本地银行和传统银行卡拼出一套现有流程。RedotPay 当前网站称拥有覆盖 100+ 个国家的
              9M+ 用户和 $12B 年化支付量；公司 2025 年 12 月公告则报告 2025 年募资 $194M。这些公司发布的规模指标相当可观，但无法与竞争对手的活跃用户、交易量、融资或盈利能力形成同口径的独立比较。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP012
              - CP013
              - CP014
      - number: '3.2'
        title: 能力、产品组合与价格压力
        blocks:
          - type: paragraph
            body: >-
              RedotPay 最直观的优势是产品广度：其自有页面介绍了刷卡消费、本地货币出金、内部转账、多币种钱包、信贷、Earn、兑换和
              P2P。广度可以减少流程割裂，但指定证据显示，具体购买标准上存在明显竞争压力。Penchan 报道称 ether.fi 提供更低的非 USD 费用、免费层级奖励和非托管控制；相比之下，RedotPay
              收取发卡费，并把 3% 奖励放在 Pro 层级且设置月度上限。另一篇评测称其没有年卡费，但兑换、外汇、ATM
              和拒付费用不低。指定证据池没有支持这一狭窄卡片比较之外的定价信息，因此相关价格标记为未知，而不是估算值。
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: 分销能力、合作伙伴准入与信任姿态
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的触达依赖消费端分销，也依赖接入第三方金融基础设施。Hong Kong Business 报道称其卡片可在超过 130 million 家商户使用，并已扩展到超过 100
              个市场；RedotPay 另称其 Ripple 集成可让经过验证的用户在几分钟内完成本地银行 NGN
              出金。这些通道加快了地域覆盖，但也让产品暴露于卡组织、银行、出金和合规合作伙伴依赖之下，而内部自建必须重新搭建这些能力。整套产品的信任水平并不一致：RedotPay 条款称 Crypto Earn
              不向香港公众提供，且用户申购的资产可能被混同、部署或用于运营目的，用户无权追回特定资产。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              证据支持“分销加集成”的护城河假设，但还不能证明存在锁定型护城河。RedotPay 的功能多于单一卡片，且似乎聚焦新兴市场的支付和汇款痛点，这有利于获客和交叉销售。但竞争对手攻击的是不同层面：ether.fi
              强调非托管控制和更低的外汇成本，以奖励驱动的加密平台可以补贴刷卡消费，Wise
              用法币通道解决同一个跨境需求，而内部或多供应商架构可以降低对单一托管方的依赖。公开证据没有披露队列留存、多平台使用、每用户余额、商户集中度、合作伙伴经济性或迁移摩擦。在这些数据缺失前，产品广度应视为当前定位优势，而不是持久定价权的证据。
            claimRefs:
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 广度是可见的切入口
            body: RedotPay 把消费、出金、钱包、信贷、Earn、兑换和 P2P 结合起来，范围宽于本章证据中出现的单一卡片替代方案。
            calloutType: strength
            claimRefs:
              - CP002
              - CP014
          - type: callout
            title: 尚未证明存在锁定效应
            body: 公开证据没有量化留存、多平台使用、迁移成本、合作伙伴集中度或实际定价权，而竞争对手则在费用、奖励和托管上直接竞争。
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式触点多，但披露收益有限
        blocks:
          - type: paragraph
            body: >-
              RedotPay 位于客户持有的加密资产与传统支付通道之间。一篇第三方产品评测描述了购买时将稳定币兑换为法币、让商户收到传统货币；RedotPay
              自有页面则增加了全球出金、应用内转账、点对点兑换、抵押信贷、兑换和 Earn。公开可见的变现机制在办卡和 Earn 上最清楚：办卡需要用加密资产支付费用，Earn 条款允许 RedotX Panama
              收取价差或服务费，并保留超过用户所得奖励的收益。应用内转账和 P2P 被宣传为免费，因此更像是拉新和提升活跃度的工具，而不是直接定价的产品。没有保留来源披露实际交换费、外汇价差、出金抽成、借贷收益或收入构成。
