            body: >-
              公开记录支持这是一个具有多条变现路径、规模可观的支付业务，但无法证明持久的毛利或自由现金流。运行率增长和审计完成提高了机构融资的可信度，而筹备大型美国上市说明获得新资本仍具有战略重要性。下行风险异常重大：Binance
              关联方寻求 $472.8 million
              的被指称损失；没有诉状、抗辩、保险、法律准备金和概率评估，无法把这个金额转换成预期负债。因此，投资判断应以经审计报表、从交易量到确认收入的收入桥接、队列层面的活跃度和留存、完整的合作伙伴经济、当前流动性及主要法律文件为前提。在此之前，已披露规模令人鼓舞，但收入质量、利润率持久性和资本充足性仍未验证。
