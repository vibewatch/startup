          label: 当前规模信号
          detail: 公司网站声称有 9M 用户，年化支付额为 $12B。
        - id: economics
          label: 经济性信号
          detail: 公司报告称，2025 年 11 月年化收入超过 $150M，并报告盈利增长。
        - id: evidence-discount
          label: 证据折价
