              2025 年 12 月公司公告报告年化收入超过 $150 million、年化支付量超过 $10 billion、注册用户达到 six million。随后一篇刊载 Bloomberg 报道的 Claims
              Journal 文章称，RedotPay 当时披露年化收入为 $180 million、年化支付量为 $14 billion、用户超过 eight million。当前首页则显示用户超过 nine
              million、年化支付量为 $12
