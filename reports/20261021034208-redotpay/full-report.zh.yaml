      - 有证据支持的流程
      - 公司方案
      - 公开收益
      - 局限
    rows:
      - - 开始使用卡片
        - 下载应用、完成身份验证、支付申请费，并申请虚拟卡或实体卡
        - 基于应用的发卡流程
        - 公开描述称虚拟卡通常可在十分钟内激活
        - 当前开户中位时长、拒绝率、发卡方与费率表均无证据支持
      - - 提取现金
        - 在接受 Visa 网络的 ATM 上使用实体卡
        - 通过卡片界面提取法币现金
        - 在电子支付不普及的场景扩大可用性
        - 提现成功率、限额、外汇利差与 ATM 费用均未量化
      - - 使用 Sui 资产支付
        - 存入 SUI 或 USDC-Sui，并通过应用消费或转账
        - Sui 原生资产集成
        - 在该受支持路径上无需依赖桥接 USDC
        - 未提供独立的延迟、成本或可靠性基准
      - - 接收 NGN
        - 经验证用户发送受支持资产，并指定本地银行账户
        - Ripple Payments 支持的加密资产兑 NGN 出款
        - 公司称出款通常在数分钟内结算
        - 未公开按通道拆分的失败、冲正、合规冻结或实际费用数据
      - - 通过 P2P 交易
        - 选择本地货币和支付方式，并与交易对手完成交易
        - 应用内 P2P 市场与结算协助
        - 公司营销即时结算且不收费用
        - 公司声明不保证结算，并将交易对手尽调责任置于用户
      - - 获取浮动奖励
