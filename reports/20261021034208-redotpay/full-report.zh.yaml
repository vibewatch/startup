      - number: '5.3'
        title: 信任、安全与产品风险控制
        blocks:
          - type: paragraph
            body: >-
              RedotPay 公开列出 Sumsub 用于 KYC、Beosin 工具用于交易监控，但这只是公司对控制输入的描述，不是控制有效运行的独立证据。最重要的产品风险披露出现在公司自己的 Earn
              条款中。Crypto Earn 不向香港公众提供，由 RedotX Panama
              提供，且不会把申购资产与其他资产隔离。条款允许将资金池部署到收益平台、运营用途、借贷和链上质押，赎回则面临流动性、借款人、协议和技术故障风险。这一运营模式与简单的刷卡消费或钱包撮合明显不同，应作为独立的风险承担型产品进行投资判断。现有证据池没有独立渗透测试、SOC
              报告、认证、准备金证明、托管审计或事件历史数据，无法据此检验安全和资产保护声明。
            claimRefs:
