      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 诉讼是分销和治理测试
            body: 任何禁令、重大不利判决、限制合作伙伴准入的和解，或管理层陈述不可靠的证据，都应在更新法律和治理审查前暂停投资。
