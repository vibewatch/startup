  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资观点与建议
        blocks:
          - type: paragraph
            body: >-
              可投资逻辑是：RedotPay 已经超越概念阶段的加密卡产品。其当前网站称拥有 9 million 用户和 $12 billion 年化支付量，2025 年 12 月融资公告则报告年化收入超过 $150
              million 并报告盈利增长。这些是有意义的规模信号，但不是经审计结果、活跃用户队列、现金生成能力，也不能证明经济性持久。一份二级报道将 B 轮投后估值定为 $1
              billion。这个参考值可用于约束入场纪律，但不足以证明公允价值。更合适的结论是继续研究，而不是买入或放弃：在判断价格或目标回报前，必须取得当前财务、法律和资本化证据。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
