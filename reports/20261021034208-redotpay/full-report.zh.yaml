chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              RedotPay 是总部位于香港的 Red F. Technology Limited 使用的商业名称，Preqin 将其成立时间追溯至 2023
              年。它的消费产品把稳定币接入熟悉的支付和转账流程：虚拟卡和实体卡、跨境出金、多币种钱包、加密资产抵押信贷、兑换和点对点市场。公司明确表示自己是金融科技服务商而非银行，多币种钱包由持牌金融机构提供。Preqin
              将交易费描述为核心收入机制。因此，RedotPay 更像是连接数字资产持有者、持牌金融机构、支付网络和本地货币终端的编排层；合作关系连续性和牌照范围是商业模式的核心，而不是外围合规细节。
            claimRefs:
              - CO001
              - CO002
              - CO015
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO008
              - CO010
              - CO011
      - number: '1.2'
        title: 管理层、资本与治理
        blocks:
          - type: paragraph
            body: >-
              Michael Gao 一直被认定为联合创始人兼 CEO，但公开材料对更广泛的创始人名单说法并不一致。Preqin 列出 Jonathan Chan；有关 Binance 法院申请的报道则将 Gao
              Zhangpeng、Chan Wa Choi 和 Yao Chao 列为联合创始人，现有证据不足以厘清这些别名或当前运营职务。RedotPay 于 2025 年 12 月宣布完成 $107 million 的 B
              轮融资，并称这使其 2025 年累计募资达到 $194 million。该轮由 Goodwater Capital 领投，Pantera Capital、Blockchain Capital、Circle
              Ventures、HSG 及其他机构被列为参与者或持续支持者。审阅过的公开来源没有提供完整董事会、股权结构表、投票权图谱或管理层继任计划，关键人物与控制权方面仍有重要尽调缺口。
