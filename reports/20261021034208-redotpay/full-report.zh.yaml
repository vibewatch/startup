  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              RedotPay 所处的相关市场比全球支付或加密资产市场都窄。它的核心切入点是把数字资产接入日常刷卡消费、ATM 取现和本地货币银行出金；钱包、抵押信贷、Earn、兑换和 P2P
              属于可能加深使用但不应自动并入同一可服务支出池的邻近业务。实际替代方案包括传统银行卡、银行或汇款运营商，以及多步骤的加密货币交易所加银行出金。这个边界很重要，因为宽泛的钱包或汇款市场估算包含 RedotPay
              无法服务的支出。产品可用性也因司法辖区而异：首页称部分地区存在限制，Earn 条款则排除香港公众。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模估算
        blocks:
          - type: paragraph
            body: >-
              当前最有力的规模指标来自公司披露，而非独立市场测量：全球用户超过 9 million、覆盖超过 100 个国家、年化支付量为 $12
              billion。这些指标说明分销网络已经成形，但注册用户不等于活跃用户，国家覆盖不等于产品在当地全面可用，支付量也不等于收入或可服务市场。两个外部问题视角可以补充背景，但无法填补规模估算缺口：RedotPay
              引用平均汇款费率 6.49% 和 one-to-five-day 结算周期；其合规公告则引用 2026 年加拿大 $26.26 billion 数字钱包市场。后者是宽泛的钱包类别，不能视为 RedotPay
              在加拿大的 SAM。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM010
              - CM016
