      - CI008
      - CI009
      - CI010
      - CI011
  - id: FE001
    title: 公开产品与运营依赖堆栈
    type: stack
    summary: 这是一个概念堆栈，展示用户从访问应用到获得卡片、链上、出金或 Earn 结果所需、且有外部证据支持的各层。
    data:
      layers:
        - label: 客户界面
          items:
            - 移动应用
            - 虚拟卡
            - 实体卡
            - P2P
            - Earn
          detail: 用户完成开户并选择工作流的可见产品层。
        - label: 身份与监控
          items:
            - 身份验证
            - Sumsub KYC
            - Beosin KYT
          detail: 公司点名的开户和交易控制输入。
        - label: 钱包与资产记录
          items:
            - 多币种钱包
            - 用户余额
            - Earn 账户账本
          detail: 钱包由持牌机构提供；Earn 条款称，记录的是资金池债权，而非隔离资产。
        - label: 资产与转换连接
          items:
            - 支持的区块链
            - SUI
            - USDC-Sui
            - 其他支持的资产
          detail: 各项集成把数字资产连接到转换、消费和出金工作流。
        - label: 支付编排
          items:
            - 卡片网络
            - Ripple Payments
            - P2P 交易对手
          detail: 外部通道将选定的客户操作导向法币端点。
        - label: 结算与风险端点
          items:
            - 商户与 ATM
            - 本地银行账户
            - 收益平台
            - 借款人与验证者
          detail: 最终交付和承担风险的端点位于消费者界面之外。
    approximationNotes: 仅是概念性的公开证据地图；层级顺序不代表 RedotPay 的内部实现、所有权、延迟、冗余或控制边界。
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: 客户采用界面与扩张路径
    type: journey-map
    summary: 公开产品界面支持多步骤消费者路径，但未披露转化率、留存率或扩张率。
    data:
      nodes:
        - id: need
          label: 需要便捷的美元挂钩支付
          detail: 用户寻求线上消费、旅行使用或跨境价值转移。
          touchpoints:
            - Card
            - Wallet
            - Payout
        - id: onboard
          label: 验证身份并入金
          detail: 用户先验证身份并为 RedotPay 钱包入金，再申请或使用产品。
          touchpoints:
            - App
            - Identity verification
            - Wallet funding
        - id: spend
          label: 消费或取现
          detail: 虚拟卡和实体卡支持购物、订阅、旅行及 ATM 取现。
          touchpoints:
            - Virtual card
            - Physical card
            - ATM
        - id: send
          label: 在网络内转账
          detail: 用户可以通过 UID、电子邮件地址或电话号码向另一名 RedotPay 用户转账。
          touchpoints:
            - UID
            - Email
            - Phone number
        - id: cash-out
          label: 收取本地货币
          detail: 已验证用户可以将支持的资产转入指定出金市场的本地银行账户。
          touchpoints:
            - NGN
            - BRL
            - MXN
        - id: expand
          label: 添加相邻产品
          detail: P2P、信贷和 Earn 拓宽参与范围，但受资格和地域限制约束。
          touchpoints:
            - P2P
            - Credit
            - Earn
    approximationNotes: 按公开产品描述排序；阶段顺序不代表经测量的转化、按价值比例计算的规模、留存或普遍地域可用性。
