      - number: '1.4'
        title: 监管声明与诉讼压力
        blocks:
          - type: paragraph
            body: >-
              公司称自己在阿根廷是 VASP、在加拿大是 MSB、在美国是完成 FinCEN 注册的 MSB，并持有香港放债人和 TCSP 牌照。这些说法不能替代按法律实体和产品逐项建立的牌照矩阵；RedotPay
              还表示其美国 FinCEN 注册不涉及服务美国公民。另据 Binance 关联方指称，RedotPay 转移了超过 470,000 名客户，并声称损失为 $472.8 million。RedotPay
              否认相关指控，并称诉讼不会影响日常运营。因此，这场争议是正在发生的不利事件，而不是已经裁定的责任；但其时间点和所称获客机制，使合作伙伴依赖、增长质量和 IPO 准备度更值得审查。
