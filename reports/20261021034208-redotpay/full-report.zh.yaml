  - id: FM001
    title: 从广泛需求到可服务触达的证据阶梯
    type: pyramid
    summary: 报道中的触达范围经过实际支付活动、本地出金场景，以及司法辖区和产品限制逐步收窄，才可能形成可辩护的可服务市场。
    data:
      items:
        - label: 报道中的用户触达
          value: 9M+ global users
          detail: 公司披露的覆盖范围；未披露活跃用户和用户群质量。
        - label: 报道中的地域触达
          value: 100+ countries
          detail: 有业务存在不代表每种产品都能在每个司法辖区提供。
        - label: 报道中的交易规模
          value: $12B annualized payment volume
          detail: 支付额不等于收入，年化方法未披露。
        - label: 汇款问题
          value: 6.49% average fees; 1-5 business days
          detail: 公司公告对全球问题的框定，不是独立保留的基准。
        - label: 本地化市场进入
          value: Argentina, Canada, Mexico
          detail: 注册信息和计划中的本地出金或卡片项目，构成具体进入路径。
        - label: 可服务约束
          value: U.S. citizen service excluded; Hong Kong Earn excluded
          detail: 产品和司法辖区限制，把广泛的报道触达收窄为更小的可触达切口。
    approximationNotes: 这是按证据和访问路径排序的阶梯，不是按价值比例缩放的 TAM 漏斗；未计算转化率或隐含市场份额。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM009
      - CM011
      - CM012
      - CM014
      - CM015
  - id: FP001
    title: 受证据约束的竞争定位
    type: quadrant
    summary: 序数定位将新兴市场稳定币侧重与产品广度分开；这是分析地图，不是经测量的市场基准。
    data:
      xAxis:
        label: 新兴市场稳定币侧重
        min: 1
        max: 5
      yAxis:
        label: 产品广度
        min: 1
        max: 5
      points:
        - label: RedotPay
          x: 5
          'y': 5
          detail: 整合卡片、出金、钱包、信贷、Earn、兑换和 P2P，并定位于新兴市场。
        - label: ether.fi
          x: 3
          'y': 3
          detail: 非托管卡片替代方案；已有证据显示其 TWD 费用较低，并提供免费层级奖励。
        - label: Crypto.com
          x: 2
          'y': 5
          detail: 广泛的交易所和奖励生态；当前详细条款不在分配到的资料池中。
        - label: Wirex
          x: 2
          'y': 4
          detail: 第三方目录报道其支持广泛的货币。
        - label: Nexo
          x: 2
          'y': 4
          detail: 第三方目录报道其覆盖卡片和借贷相邻业务。
        - label: Wise
          x: 1
          'y': 3
          detail: 以法币为先的跨境替代方案，不以稳定币为核心。
    approximationNotes: 评分是分析师基于保留来源集作出的 1-5 序数判断，不是市场份额、质量或业绩测量；缺乏证据支持的竞争对手细节会降低信心。
    claimRefs:
      - CP014
      - CP015
  - id: FI001
    title: 从客户活动到未披露毛利的收入模型桥接
    type: flow
    summary: 公开证据识别了活动和变现界面，但没有说明将支付额桥接到确认收入和毛利所需扣除的成本。
    data:
      nodes:
        - id: funded-balance
          label: 资金余额
          detail: 用户将稳定币或其他数字资产存入 RedotPay 环境。
        - id: customer-activity
          label: 客户活动
          detail: 卡片消费、出金、应用内转账、P2P 交易、兑换、信贷和 Earn。
        - id: conversion-settlement
          label: 转换与结算
          detail: 加密资产被转换，商户或出金收款方收到法币。
        - id: payment-volume
          label: 年化支付额
          detail: 不同时间点的公开数字介于 $10B+ 和 $14B 之间。
        - id: monetization
          label: 变现界面
          detail: 卡片费用、兑换经济性、出金定价、借贷收益、兑换价差和 Earn 价差。
        - id: cost-deductions
          label: 成本扣除
          detail: 卡片、出金、流动性、欺诈、合规、客户支持和资金成本均未量化。
        - id: gross-profit
          label: 毛利
          detail: 公开资料中没有经审计的毛利率或贡献利润桥接。
    approximationNotes: 该序列是概念性的，不按价值比例排列；未推断转化率、抽成率或毛利金额。
    claimRefs:
      - CI001
      - CI002
      - CI006
