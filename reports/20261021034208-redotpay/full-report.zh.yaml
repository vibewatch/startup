  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 覆盖面广的稳定币到法币产品
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的客户产品是连接数字资产和传统支付终端的多触点桥梁。官网介绍了用于购物、取现和资金管理的稳定币卡，以及加密资产到本地货币的出金、多币种钱包、P2P 交易、信贷、Earn
              和兑换。广度具有商业价值：用户无需离开应用，就能充值、兑换、消费、转账或寻求收益；但每增加一个触点，也会增加不同的交易对手和监管边界。公司还表示自己不是银行，多币种钱包由适当持牌的金融机构提供，因此合作伙伴层是交付产品的一部分，而非实现细节。公开披露的
              9 million 用户、超过 100 个国家和 $12 billion 年化支付量说明运营需求不小，但无法说明活跃用户质量、交易成功率或产品层面的使用情况。
