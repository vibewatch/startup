      - number: '7.3'
        title: 全球触达依赖 RedotPay 无法控制的交易对手
        blocks:
          - type: paragraph
            body: >-
              RedotPay 称自己不是银行，多币种钱包由适当持牌的金融机构提供。其卡片产品使用 Visa 网络，尼日利亚出金产品使用 Ripple
              Payments，并要求经过验证的用户拥有本地银行账户。一家外部钱包提供商也将该模式描述为托管模式，依赖卡组织和第三方稳定币发行方。这些关系加速了分销，但也制造了多个失败和终止节点：发卡或银行准入、卡组织受理、出金可用性、稳定币储备和本地账户连接。Binance
              争议说明，商业关系失败可能同时演变成法律事件和分销事件。公开材料没有说明关键合作伙伴的冗余、终止权、服务水平、集中度、经济性或过渡计划，因此缓解措施成熟度不能评为高于早期阶段。
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR013
