        title: 法律和监管风险正在发生，而非假设情形
        blocks:
          - type: paragraph
            body: >-
              Binance 关联实体已在香港提起诉讼，指称 RedotPay 创始人违反合作协议，转移了超过 470,000 名用户；据报道索赔金额为 US$472.8 million。RedotPay
              否认指控并称将抗辩，但该回应并不能消除潜在损害赔偿、禁令、合作伙伴终止、管理层分心或取证风险。另据公司公告，一家四大会计师事务所审阅了两家香港持牌子公司的 AML/CFT
              控制。独立报道提醒，这并不是监管批准，事务所身份和报告也没有公开。因此，这次审阅是积极的控制信号，但尽调价值有限。Crypto Earn 排除香港居民，且通过 RedotX Panama
              签约，进一步说明产品可用性、法律实体和客户司法辖区必须逐项映射。
