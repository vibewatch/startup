      - - 悲观
        - 合作伙伴争议限制分销，法律敞口仍无边界，或监管限制损害核心产品。
        - 即使相对 $1B 打折也可能不足，因为公开证据无法界定负债或流动性；价格应暂缓，而不是硬行设定。
        - 威胁持续经营或融资渠道的法院、牌照、流动性或合作伙伴进展。
