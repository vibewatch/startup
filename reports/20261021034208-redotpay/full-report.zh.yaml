      - number: '8.4'
        title: 尽调路径、退出准备度与投资逻辑击穿点
        blocks:
          - type: paragraph
            body: >-
              现有公开证据无法证明退出准备度。在投资委员会设定入场价格、目标持股、持有期或回报门槛前，管理层应提供经审计报表、月度队列、抽成率、毛利率、损失和欺诈率、现金余额、法律实体牌照，以及包含优先权条款的完全摊薄资本化表。法律顾问应量化据称由
              Binance
              提出的索赔、程序状态、保险覆盖和可能损失区间。如果当前收入或盈利无法与银行及处理商记录对账、合作伙伴准入显著削弱、牌照阻断核心走廊，或法律风险威胁流动性，投资逻辑就会失效。积极重估需要独立确认增长和经济性具有持久性；单纯降低价格无法治愈无上限的法律或治理风险。
