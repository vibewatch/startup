          - type: callout
            title: 在依赖缓解声明前先要求证据
            body: 在把快速规模增长视为风险抵消因素前，应要求完整 AML/CFT 审查、实体牌照矩阵、经审计的客户资产明细、流动性压力测试、事件历史、关键合作伙伴合同以及有日期的运营指标数据包。
