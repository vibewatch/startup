      - number: '7.4'
        title: 监控应聚焦于能够击穿投资逻辑的证据
        blocks:
          - type: paragraph
            body: >-
              眼下的法律监控点是 Binance
              关联方诉讼中的任何不利裁决、禁令、和解或限制；任何重要的资金、卡片、钱包或出金关系丧失，都将成为相关的投资逻辑击穿事件。监管尽调应要求按产品和司法辖区建立法律实体及牌照矩阵，并取得完整 AML/CFT
              审查范围、例外事项、整改计划和审查人身份。对于客户资产，如果管理层无法证明按产品隔离、流动资产覆盖、交易对手限额、保险基金能力、赎回压力测试和事件响应，投资应暂停。最后，公开规模口径没有内部对齐：首页报告 9
              million+ 用户和 US$12 billion 年化支付量，而独立报道则称用户超过 8.5 million、约 US$14 billion。使用规模抵消风险前，需要一套有日期且定义一致的运营数据包。
            claimRefs:
              - CR001
