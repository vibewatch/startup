            body: >-
              有证据支持的工作流从应用注册和身份验证开始，然后通过钱包、兑换、卡片、区块链和本地出金合作伙伴转移价值。RedotPay 实体卡指南称，申请人要完成身份验证，并用加密货币预付申请费；虚拟卡通常可在 ten
              minutes 内完成激活，实体卡生产和配送通常需要 five to ten 个工作日。较新的合作伙伴公告进一步延伸了通道：Sui 集成增加了 SUI 和原生 USDC-Sui 的消费与出金，Ripple
              Payments 支持兑换为 NGN，并将在 BRL 和 MXN
              出金上线后继续扩展。这些说明集成速度，不代表基础设施由公司自有。产品执行还暴露于区块链可用性、发卡和银行合作伙伴、支付网络、本地出金终端及司法辖区特定的产品可用性。指定来源没有披露故障切换设计、延迟分布、服务水平目标或合作伙伴冗余。
