      - number: '8.2'
        title: 正论、反论与下行风险
        blocks:
          - type: paragraph
            body: >-
              正论结合了已展现的产品广度、大量自报规模和机构融资。卡片、出金、钱包、信贷、Earn、兑换和点对点服务创造了多条变现路径，而 Ripple
              集成展示了额外的出金走廊。反论同样重大。产品广度扩大了监管和交易对手暴露面；Crypto Earn 明确不向香港公众提供，其条款描述了借款人违约和流动性风险。另据报道，Binance 关联方据称因转移用户而寻求近
              $473 million 损害赔偿。RedotPay 对这些指控提出异议，因此不能把这项索赔视为已确定负债；但在审阅法院记录、保险、准备金和运营影响前，金额及合作伙伴争议足以削弱估值信心。
            claimRefs:
              - CV010
              - CV012
