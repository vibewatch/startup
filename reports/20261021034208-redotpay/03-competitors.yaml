      - ["Card spending", "Virtual and physical card proposition", "Virtual and physical Visa cards", "Core category capability reported for Wirex, Crypto.com, and Nexo", "Conventional bank card or separately integrated issuer"]
      - ["Local-currency payouts", "Named NGN, BRL, and MXN payout expansion; Ripple supports NGN rail", "Not evidenced in assigned pool", "Not evidenced in assigned pool", "Core remittance workflow or separately integrated payout provider"]
      - ["Rewards", "3% Pro reward reported for eligible mobile-wallet purchases with cap", "Free Core rewards reported, with tiered rates", "Cashback positioning reported for Crypto.com and Nexo", "Not evidenced or not applicable"]
      - ["Credit / yield", "Crypto-backed credit and Crypto Earn", "Borrow mode reported; yield breadth not compared", "Nexo lending adjacency reported; other cells unknown", "Separate lender or investment product required"]
