      - ["Recurring fee", "No monthly or annual card fee; Pro reported at $12.90 monthly or $129 annually", "No annual fee on Core", "Base card access is subscription-free for both; RedotPay rewards require a paid tier"]
      - ["Non-USD purchase cost", "2.2% reported for non-USD purchases", "About 1%-1.5% on a TWD purchase for Core", "RedotPay is disadvantaged on the evidenced TWD example"]
      - ["Rewards and cap", "3% for eligible Apple Pay or Google Pay purchases; 18 USDs monthly cap and 30-day expiry reported", "Tiered ETHFI rewards, including 3% on the first $2,000 of monthly non-euro spending on Core", "Reward currency, eligibility, caps, and custody make headline percentages non-comparable"]
    notes: "List prices and program terms come from third-party reviews, including an affiliate-supported comparison; realized economics, promotions, and geography-specific terms may differ."
    claimRefs: [CP009, CP010, CP011]
