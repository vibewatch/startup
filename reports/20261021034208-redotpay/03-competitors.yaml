artifact: competitors
slug: redotpay
runDate: "2026-10-21"
company:
  name: RedotPay
chapter:
  number: 3
  title: Competitors
  summary: >-
    RedotPay is differentiated less by a single card feature than by combining stablecoin
    spending, payouts, wallet functions, credit, Earn, swap, and P2P services in one app.
    That breadth and its emerging-market distribution are meaningful, but available evidence
    does not establish durable switching costs; lower-fee, rewards-led, non-custodial, exchange,
    and fiat-remittance alternatives keep the category contestable.
sections:
  - id: competitive-landscape
    title: Competitive landscape and strategic groups
    body: >-
      Buyers can solve the underlying job through several categories rather than a single
      direct peer set. RedotPay and ether.fi compete most directly for card-based crypto
      spending, while Wirex, Crypto.com, and Nexo extend cards from broader crypto ecosystems.
      Wise represents a fiat-first cross-border alternative, and users can also assemble a
      status-quo workflow from a self-custody wallet, exchange or off-ramp, local bank, and
      conventional card. RedotPay's current website claims 9M+ users across 100+ countries and
      $12B in annualized payment volume, while a December 2025 company release reported $194M
      raised during 2025. Those company-issued scale markers are substantial but are not a
      like-for-like independent benchmark against competitor active users, transaction volume,
      funding, or profitability.
    claimRefs: [CP001, CP003, CP004, CP012, CP013]
    tableRefs: [TP001]
  - id: product-and-price
    title: Capability, packaging, and price pressure
    body: >-
      RedotPay's strongest visible proposition is product breadth: its own surfaces describe
      card spending, local-currency payouts, internal transfers, multi-currency wallet access,
      credit, Earn, swap, and P2P. Breadth can reduce workflow fragmentation, but assigned
      evidence shows clear competitive pressure on individual buying criteria. Penchan reports
      that ether.fi offers lower non-USD fees, rewards on a free tier, and non-custodial control,
      whereas RedotPay charges for card issuance and places its 3% reward behind Pro with a
      monthly cap. A separate review reports no annual card fee but meaningful conversion,
      foreign-exchange, ATM, and chargeback fees. Pricing outside this narrow card comparison is
      not evidenced in the assigned pool and is therefore marked unknown rather than estimated.
    claimRefs: [CP002, CP009, CP010, CP011]
    tableRefs: [TP002, TP003]
  - id: distribution-and-trust
    title: Distribution power, partner access, and trust posture
    body: >-
      RedotPay's reach depends on both consumer distribution and access to third-party financial
      infrastructure. Hong Kong Business reports card acceptance at more than 130 million
      merchants and expansion across more than 100 markets; RedotPay separately says its Ripple
      integration supports local-bank NGN payouts within minutes for verified users. These rails
      accelerate geographic coverage, but they also expose the product to card-network,
      banking, payout, and compliance-partner dependencies that an internal build would have to
      recreate. Trust is not uniform across the suite: RedotPay's terms say Crypto Earn is not
      offered to the Hong Kong public and that subscribed assets may be commingled, deployed,
      or used for operating purposes, with no right to recover specific assets.
    claimRefs: [CP005, CP006, CP007, CP008]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The evidence supports a distribution-and-integration moat thesis, not a proven lock-in
      moat. RedotPay combines more functions than a standalone card and appears focused on
      emerging-market payment and remittance pain points, which can improve acquisition and
      cross-sell. However, the comparison set attacks different layers: ether.fi emphasizes
      non-custodial control and lower foreign-exchange costs, rewards-led crypto platforms can
      subsidize card use, Wise addresses the same cross-border job with fiat rails, and an
      internal or multi-provider stack can reduce dependence on one custodian. Public evidence
      does not reveal cohort retention, multi-homing, balances per user, merchant concentration,
      partner economics, or migration friction. Without those data, breadth should be treated as
      a current positioning advantage rather than evidence of durable pricing power.
    claimRefs: [CP014, CP015, CP016]
    figureRefs: [FP001]
