callouts:
  - calloutType: strength
    title: Breadth is the visible wedge
    body: >-
      RedotPay's combination of spending, payout, wallet, credit, Earn, swap, and P2P functions
      is broader than the standalone-card alternatives evidenced in this chapter.
    claimRefs: [CP002, CP014]
  - calloutType: risk
    title: Lock-in is not demonstrated
    body: >-
      Public evidence does not quantify retention, multi-homing, migration cost, partner
      concentration, or realized pricing power, while rivals compete on fees, rewards, and custody.
    claimRefs: [CP010, CP011, CP015, CP016]
