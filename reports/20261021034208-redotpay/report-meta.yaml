companyProfile:
  summary: >-
    RedotPay is a Hong Kong-based private fintech founded in 2023 that connects stablecoin holders to conventional card,
    wallet, transfer, and local-currency payout workflows. Its reported consumer and payment scale is material, but
    dependence on licensed financial institutions and other payment partners makes regulatory scope, partner continuity,
    and control effectiveness central to the investment case.
