  topStrengths:
    - >-
      Company-reported scale of more than 9 million global users and $12 billion in annualized payment volume indicates
      meaningful operating demand.
    - >-
      A broad product suite spans cards, payouts, wallet functions, transfers, credit, swaps, Earn, and peer-to-peer
      trading.
    - >-
      The $107 million Series B and integrations across card, blockchain, and local payout rails provide capital and
      distribution support.
  topRisks:
    - >-
      Binance affiliates seek approximately $472.8 million over alleged diversion of more than 470,000 users; RedotPay
      contests the allegations.
    - >-
      Audited statements, margins, cash, burn, runway, customer economics, and partner costs remain unavailable despite
      substantial run-rate claims.
    - >-
      Pooled Crypto Earn assets and reliance on card, wallet, banking, stablecoin, and payout partners create
      customer-asset, liquidity, and continuity risk.
    - >-
      Public licensing and AML/CFT review claims do not provide a complete product-by-jurisdiction authorization matrix
      or independent control report.
  unresolvedGaps:
    - >-
      Audited financial statements and management accounts covering revenue recognition, gross margin, cash, cash flow,
      burn, debt, and runway.
    - >-
      Monthly active, funded, and transacting users; retention cohorts; transaction frequency; acquisition attribution;
      and segment-level unit economics.
    - >-
      A legal-entity and licensing matrix for every product and jurisdiction, together with the full AML/CFT review and
      remediation record.
    - >-
      Critical card, banking, wallet, custody, liquidity, stablecoin, and payout partner contracts, economics,
      concentration, redundancy, and termination rights.
    - >-
      Primary court filings, counsel assessment, insurance and reserves for the Binance dispute, plus a fully diluted
      cap table and preference terms.
