  productSummary: >-
    Stablecoin-linked virtual and physical cards, crypto-to-local-currency payouts, a multi-currency wallet, internal
    transfers, crypto-backed credit, swaps, Earn, and a peer-to-peer marketplace.
  customerFocus: >-
