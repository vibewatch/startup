slug: "redotpay"
runDate: "2026-10-21"
company:
  name: "RedotPay"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    RedotPay addresses the intersection of stablecoin ownership, everyday card spending,
    and crypto-to-local-currency payouts rather than the whole payments or digital-asset
    markets. Company-reported scale is meaningful, but the assigned evidence does not
    provide an independent, comparable TAM/SAM/SOM or the active-user and unit-economic
    data needed to translate that footprint into a defensible serviceable market.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      RedotPay's relevant market is narrower than either global payments or crypto. Its
      core wedge connects digital assets to everyday card purchases, ATM cash access,
      and local-currency bank payouts; wallet, collateralized credit, Earn, swap, and P2P
      are adjacencies that may deepen engagement but should not be counted automatically
      in one addressable-spend pool. The practical substitutes are a conventional bank
      card, a bank or money-transfer operator, and a multi-step crypto exchange plus bank
      off-ramp. This boundary matters because broad wallet or remittance estimates include
      spend that RedotPay cannot serve. Product availability is also jurisdiction-specific:
      the homepage says selected-region limits apply, and the Earn terms exclude the Hong
      Kong public.
    claimRefs: ["CM001", "CM002", "CM006", "CM014"]
    tableRefs: ["TM001"]
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: >-
      The strongest current scale indicators are company-reported rather than independent
      market measurements: 9 million-plus global users, more than 100 countries, and
      $12 billion of annualized payment volume. These metrics indicate an established
      distribution footprint, but registered users are not active users, country presence
      is not uniform product availability, and payment volume is not revenue or addressable
      market. Two external-problem lenses add context without solving the sizing gap:
      RedotPay cites average remittance fees of 6.49% and one-to-five-day settlement, while
      its compliance release cites a $26.26 billion Canadian digital-wallet market in 2026.
      The latter is a broad wallet category and cannot be treated as RedotPay's Canadian
      SAM.
    claimRefs: ["CM003", "CM004", "CM005", "CM009", "CM010", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption-path"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      The clearest user groups are crypto holders seeking ordinary spending access,
      migrants or globally mobile workers sending value home, and digital nomads,
      freelancers, and entrepreneurs receiving or moving cross-border funds. In the
      Nigerian payout flow, a verified user sends a supported digital asset and a recipient
      bank account receives naira, so the sender is the user and likely fee payer while the
      local recipient benefits from the off-ramp. Adoption depends on identity verification,
      supported assets, a local bank account, and local payout infrastructure. The evidence
      does not disclose procurement cycles, customer acquisition cost, fee incidence, or
      segment-level retention, so exact budget ownership and willingness to pay remain
      diligence items.
    claimRefs: ["CM007", "CM008", "CM013"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Cost and speed gaps in cross-border remittance, plus the desire to spend stablecoins
      through familiar card and bank rails, are the principal adoption drivers supported
      by the retained evidence. Regulatory progress can widen the serviceable market:
      Argentina and Canada support localized custody or payout plans, while Mexico adds a
      local virtual-asset registration and card-issuer approvals. Yet registrations are
      not equivalent to unrestricted distribution; FinTech Futures reports that the U.S.
      MSB registration supports infrastructure and cross-border processing but not service
      to U.S. citizens. Product adjacencies also add risk: Earn assets are not segregated,
      may be pooled and deployed, and can be lost in exceptional circumstances. Valuation
      should therefore reward verified transaction depth and market access, not broad
      category TAM alone.
    claimRefs: ["CM009", "CM011", "CM012", "CM013", "CM014", "CM015", "CM016"]
