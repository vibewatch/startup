      - ["Crypto-to-local payout", "Supported digital assets converted into local-currency bank payouts", "Pure bank-to-bank transfers and cash-only remittance", "Sender initiates and likely bears transaction cost; recipient receives local currency", "Core growth wedge"]
      - ["Multi-currency wallet", "Managing currencies and converting funds into stablecoins through the product interface", "Deposit-taking by RedotPay; the company says licensed financial institutions provide the wallet", "Individual account holder", "Bridge adjacency"]
      - ["Crypto-backed credit", "Access to funds using crypto as collateral", "Unsecured consumer credit, mortgages, and general SME lending", "Borrower repays principal and applicable charges", "Monetization adjacency"]
