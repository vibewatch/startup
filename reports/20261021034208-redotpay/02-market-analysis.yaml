      - "User"
      - "Payer or budget"
      - "Workflow"
      - "Adoption trigger"
    rows:
      - ["Crypto holder seeking everyday utility", "Individual account holder", "Cardholder", "Personal spending balance or collateralized borrowing", "Hold digital assets, convert or borrow, then spend through card rails", "Broader merchant acceptance without a separate cash-out step"]
      - ["Migrant or overseas worker", "Sender", "Sender and local recipient", "Remittance budget; exact fee incidence undisclosed", "Send supported crypto and receive local currency in a bank account", "Lower cost and faster settlement than cited remittance norms"]
      - ["Digital nomad or freelancer", "Individual earner", "Worker moving cross-border funds", "Personal or freelance cash-flow budget", "Receive or hold digital value, then pay or withdraw locally", "Multi-market mobility and local-currency access"]
      - ["Emerging-market local-payout user", "Verified crypto holder", "Sender and bank-account recipient", "Transaction-level consumer budget", "Crypto-to-NGN, BRL, or MXN payout where supported", "Local banking integration and supported-asset coverage"]
      - ["Yield or liquidity user", "Eligible crypto holder", "Earn subscriber or collateralized borrower", "User assets, spread, fees, or borrowing cost; exact economics undisclosed", "Deploy assets into Earn or borrow against collateral", "Convenience inside one account, offset by asset and jurisdiction restrictions"]
    notes: >-
      Segment roles are derived from described product workflows; enterprise procurement,
      segment-level pricing, fee incidence, acquisition cost, and retention are not disclosed.
    claimRefs: ["CM006", "CM007", "CM008", "CM013", "CM014", "CM015"]
figures:
  - id: "FM001"
    title: "Evidence ladder from broad demand to serviceable access"
    type: "pyramid"
    summary: >-
      Reported reach narrows through actual payment activity, local payout use cases, and
      jurisdiction- and product-specific constraints before becoming a defensible serviceable market.
    data:
      items:
        - label: "Reported user reach"
          value: "9M+ global users"
          detail: "Company-reported footprint; active-user and cohort quality are not disclosed."
        - label: "Reported geographic reach"
          value: "100+ countries"
          detail: "Presence does not imply that every product is available in every jurisdiction."
        - label: "Reported transaction scale"
          value: "$12B annualized payment volume"
          detail: "Payment volume is not revenue and the annualization method is undisclosed."
        - label: "Remittance problem"
          value: "6.49% average fees; 1-5 business days"
          detail: "Company announcement's global problem framing, not an independently retained benchmark."
        - label: "Localized market access"
          value: "Argentina, Canada, Mexico"
          detail: "Registrations and planned local payouts or card programs create specific entry paths."
        - label: "Serviceable constraints"
          value: "U.S. citizen service excluded; Hong Kong Earn excluded"
          detail: "Product and jurisdiction restrictions reduce broad reported reach to a narrower addressable wedge."
    approximationNotes: >-
      Ordered as an evidence and access ladder, not a value-proportional TAM funnel; no
      conversion rates or implied market shares are calculated.
    claimRefs: ["CM003", "CM004", "CM005", "CM009", "CM011", "CM012", "CM014", "CM015"]
callouts:
  - calloutType: "insight"
    title: "Distribution evidence is stronger than market-size evidence"
    body: >-
      The retained sources support meaningful current reach and payment activity, but they
      do not convert registered users or annualized payment volume into an independent
      addressable-market estimate.
    claimRefs: ["CM003", "CM004", "CM005", "CM016"]
  - calloutType: "risk"
    title: "Regulatory breadth is not uniform product permission"
    body: >-
      Local registrations can unlock specific workflows, while explicit U.S. and Hong Kong
      limitations show why country count cannot be treated as a uniform serviceable market.
    claimRefs: ["CM011", "CM012", "CM014"]
