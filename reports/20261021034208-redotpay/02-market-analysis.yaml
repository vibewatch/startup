    notes: >-
      Scope is evidence-constrained and separates RedotPay-addressable workflows from broader
      payments, banking, remittance, credit, and crypto categories; fee ownership is partly
      inferred and requires product-level confirmation.
    claimRefs: ["CM001", "CM002", "CM006", "CM014"]
