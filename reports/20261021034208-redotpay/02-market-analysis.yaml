      - ["Reported geographic footprint", "100+ countries", "Current page accessed 2026-10-21", "Global", "RedotPay homepage", "Distribution breadth indicator", "Does not establish uniform product availability, licensing, or revenue by country"]
      - ["Reported payment throughput", "$12B annualized payment volume", "Current page accessed 2026-10-21", "Global", "RedotPay homepage", "Current-scale lens", "Annualization basis, gross versus net treatment, and revenue conversion are undisclosed"]
      - ["Remittance pain point", "6.49% average fees; 1-5 business days", "Reported 2025-12-02", "Global remittance framing", "RedotPay partnership announcement citing industry context", "Problem-size and adoption-driver lens", "Underlying benchmark is not retained independently and is not RedotPay-specific"]
      - ["Canadian digital-wallet category", "US$26.26B", "2026 projection", "Canada", "RedotPay release citing ResearchAndMarkets", "Broad adjacency only", "Digital wallets include spend beyond stablecoins and do not define RedotPay TAM or SAM"]
    notes: >-
      Values retain each source's metric name, period, geography, and attribution. No row is
      a comparable independent TAM/SAM/SOM, and company-reported payment volume is not revenue.
    claimRefs: ["CM003", "CM004", "CM005", "CM009", "CM010"]
