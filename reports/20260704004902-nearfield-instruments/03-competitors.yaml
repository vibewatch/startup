- id: switching-costs-and-moat-durability
  title: Switching costs, incumbency power, and moat durability
  body: 'The deepest moat question is not whether Nearfield has interesting technology; it is whether that technology can become embedded deeply enough in the fab workflow to overcome incumbent account control. KLA''s filings, ASML/HMI''s installed-lineage story, and Hitachi''s process-control framing all point to the same structural fact: once a vendor becomes part of the yield-management loop from pilot through HVM, switching costs rise because uptime, data continuity, service support, and adjacent-tool compatibility all matter. That creates a competitive environment where specialists must prove not just a better measurement, but a better operational outcome than the incumbent workaround.


    The public evidence suggests Nearfield''s moat is strongest in use cases where buried-feature, 3D, or AFM-derived data reveals something the broad platforms cannot deliver efficiently. Its moat is weakest wherever buyers can solve the problem through optical CD, e-beam inspection, thin-film metrology, or simply more intensive use of existing process-control stacks. Advanced packaging, HBM, and gate-all-around should create more opportunities for specialists, but those same drivers mobilize large incumbents with more distribution power, larger service organizations, and more public proof. The net view is therefore balanced: Nearfield appears differentiated, but the durability of that differentiation depends on precise workflow wedges that the public record still does not quantify well enough.'
