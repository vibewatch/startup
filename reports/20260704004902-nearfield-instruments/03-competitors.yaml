chapter:
  number: 3
  title: Competitors
  summary: 'Nearfield competes inside a process-control market dominated by large incumbents with broad installed bases and by adjacent research-tool vendors that can satisfy some measurement jobs without becoming full direct substitutes. Its strongest visible differentiation is specialist 3D and buried-feature metrology, while its weakest public area is breadth: rivals publish far deeper portfolios, service surfaces, and financial scale than the private company does.'
sections:
- id: landscape-and-positioning
  title: Landscape structure and positioning logic
  body: 'The competitive set around Nearfield is layered rather than singular. At the top sit process-control incumbents such as KLA, ASML/HMI, Applied Materials, Nova, Onto, and Hitachi High-Tech, all of which present broad portfolios spanning inspection, metrology, software, or adjacent yield-management surfaces. These are the companies a leading-edge fab already knows, budgets for, and often integrates across multiple steps. External mapping sources reinforce that framing: CB Insights places KLA, Oxford Instruments, SENTECH, and Hitachi High-Tech among Nearfield''s alternatives, which means third parties also view the company through a cross-section of direct, incumbent, and adjacent vendor classes rather than as a category of one.


    That matters because Nearfield''s public differentiation is not portfolio breadth. The clearest differentiation in public materials is specialized 3D or subsurface process control rooted in scanning-probe-style measurement, while most incumbents sell much broader optical, e-beam, defect-inspection, and software-led process-control stacks. In other words, Nearfield is likely to win by being uniquely useful in a narrow set of hard measurement problems, not by matching the incumbents feature for feature. A realistic competitor map therefore has to include both the giants that can bundle overlapping capabilities and the narrower research or AFM vendors that give buyers a cheaper or less risky substitute for some use cases.'
