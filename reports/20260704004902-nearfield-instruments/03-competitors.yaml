- id: capability-breadth-and-commercial-contrast
  title: Capability breadth, packaging, and commercial contrast
  body: 'On capability breadth, the incumbents look nothing like a young specialist. KLA''s 10-K describes a process-control portfolio that spans inspection, metrology, software, and services from R&D to high-volume manufacturing. ASML''s HMI business is pushing multi-beam e-beam inspection into 3 nm volume manufacturing. Onto markets advanced metrology across logic, memory, and advanced packaging and has already announced fresh customer wins in HBM and gate-all-around workflows. Nova and Applied likewise frame their offerings around integrated dimensional, materials, and process-control measurement rather than one narrow modality. Nearfield may have sharper differentiation in a smaller set of measurements, but the public competitive burden is obvious: every account pitch happens against vendors that can surround the same buyer with broader tool, service, and analytics coverage.


    The commercial comparison is asymmetric as well. Public competitors disclose quarterly results, long-run revenue histories, and public-market valuation signals that make scale legible. Nearfield does not. Even pricing is opaque across much of the category: product pages generally present quote-led enterprise sales motions, contact paths, or solution marketing rather than list pricing. That means the practical pricing comparison is less about posted dollar tags and more about packaging model, integration burden, service dependency, and whether the tool sits as a single-purpose add-on or as part of a broader process-control standard. Nearfield''s opportunity is that buyers may still pay for a narrow tool when the measurement pain is acute; the challenge is that most public rivals can tie their tool pitch to a wider platform story.'
