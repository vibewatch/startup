    - External databases and vendor pages show buyers can benchmark against giants and substitutes alike
    - Medium
    - Map the real consideration set by account, including incumbent workaround paths
  notes: Severity reflects how directly each threat could narrow Nearfield’s practical capture path even if the company’s technology remains differentiated.
