    - Not positioned as a subsurface AFM specialist
  - - Nova
    - Adjacent direct
    - Public company with broad materials and chemical metrology suite
    - Inline manufacturing metrology
    - Combines dimensional, materials, and chemical metrology with AI software
    - Less public emphasis on buried-feature specialty
  - - Bruker
    - Adjacent substitute
    - Large instrumentation company; low P/S peer versus core semi vendors
    - Characterization-heavy semiconductor workflows
    - Automated AFM and CIPT for inline and packaging workflows
    - Broader analytical instrumentation identity, less pure process-control platform depth
  - - Hitachi High-Tech
    - Incumbent adjacent
    - Large public industrial and semiconductor-equipment platform
    - CD-SEM, defect inspection, wafer-surface inspection
    - Deep presence in inspection and critical-dimension measurement
    - Public pages emphasize broad equipment family rather than Nearfield-style specialty niche
  - - SENTECH / Oxford Instruments
    - Research-tool substitute
    - Smaller or broader instrumentation vendors
    - Thin-film metrology, AFM, and lab-process workflows
    - Useful substitute paths in research and characterization settings
    - Weaker evidence of leading-edge inline fab standardisation
  notes: Scale signals are intentionally mixed across public revenue, public-market disclosure, and private-company opacity because the relevant comparison is what the buyer can observe before diligence, not a forced apples-to-apples metric.
