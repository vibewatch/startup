  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current revenue, installed base, service mix, and gross margin bridge
    whyItMatters: The company is valued like a strategic category leader, but public sources do not reveal the level or quality of recurring versus one-off hardware revenue.
    diligencePath: Request management accounts, backlog, service attach rate, and installed-base by node and customer tier.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: material
    topic: governance-control
    missingEvidence: Current board list, ownership percentages, investor rights, and voting control map
    whyItMatters: Founder and investor dependence is visible qualitatively, but governance control cannot be underwritten without formal disclosure.
    diligencePath: Request board deck, cap table, shareholder agreement summary, and investor-rights schedule.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: minor
    topic: headcount-footprint
    missingEvidence: Current employee count and exact global operating footprint
    whyItMatters: Public hiring pages show functional scale-up, but not the current size of the organization or support footprint.
