      - number: '4.3'
        title: Capital adequacy, disclosure limits, and the investability verdict
        blocks:
          - type: paragraph
            body: >-
              The good news is that capital adequacy improved in a concrete way in June 2026. Nearfield raised one of
              the largest deep-tech rounds in the Netherlands, and both the company and TNO describe the proceeds in
              operational terms that fit the next phase of scaling: production capacity, delivery, support, and
              applications infrastructure. The bad news is that those same statements highlight why the company is still
              difficult to underwrite from public materials alone. Management is clearly preparing to spend, yet
              investors cannot calculate how fast the money burns because there is no public cash balance, no runway
              disclosure, no gross-margin history, no backlog number, and no visibility into service share or customer
              concentration. The adverse reading is therefore not that Nearfield lacks traction; it is that the
              company’s public profile still outruns its financial disclosure. Public-market comparables also cut both
              ways. Category leaders such as KLA and ASML can command double-digit sales multiples, but
              instrumentation-like businesses can trade dramatically lower, which means Nearfield’s own $1.6 billion
              valuation could prove cheap or expensive depending on revenue quality that outsiders still cannot see. The
              practical diligence conclusion is straightforward: funding risk looks far lower after Series D, but
              underwriting risk remains high until management discloses actual revenue, gross margin, burn, and
              repeat-order behavior.
