  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing discipline
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Nearfield is narrower than generic wafer-fab equipment and broader than
              stand-alone AFM. Official product pages from KLA, Applied Materials, ASML, Nova, and Onto all describe a
              process-control layer that spans metrology, wafer inspection, defect review, overlay, materials
              characterization, and software used from R&D through high-volume manufacturing. KLA's filing and Applied
              Materials' process-control framing make the operational need vivid: manufacturers use metrology and
              inspection to catch drift before it damages yield, profitability, or production-ramp speed. That is why
              process control deserves its own market lens rather than being treated as a footnote inside lithography or
              deposition capex.


              Public market estimates confirm that this layer is already substantial, but they do not line up cleanly
              enough to justify a single precision TAM. Mordor Intelligence places the semiconductor
              metrology-and-inspection system market at $13.03 billion in 2025 and $16.95 billion in 2030. Yole's 2026
              report summary, cited by DQIndia, says the market exceeded $18 billion in 2025 and represented roughly 14%
              of wafer-fab-equipment spending. Those are directionally consistent on growth, but they clearly embed
              different boundaries, likely including different mixes of software, packaging tools, or adjacent
              inspection modalities. The correct diligence move is therefore to preserve multiple lenses and explicitly
              state that no public source cleanly isolates the AFM-plus-buried-feature subset that matters most for
              Nearfield.
