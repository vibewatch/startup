            body: >-
              The technical architecture that emerges from public sources is unusually specific for a private hardware
              company. The academy technology page ties Nearfield’s inline measurement capability to FFTP trajectory
              planning, advanced mechatronics, long- and short-range positioning stages, and six-degree-of-freedom
