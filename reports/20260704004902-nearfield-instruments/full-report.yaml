companyProfile:
  summary: >-
    Nearfield Instruments is a Rotterdam-based 2016 TNO spin-off that builds advanced semiconductor metrology and
    inspection systems for leading-edge chip production. Its public product identity centers on QUADRA, a
    high-throughput 3D scanning-probe / AFM platform for in-line process control, and AUDIRA, a subsurface metrology
    system for buried features and void detection. Public proof points include Samsung as an early named customer
    reference, a 2025 multi-year development project with imec, and a 2026 Fidelity-led $380 million Series D that
    valued the company at $1.6 billion. The company therefore looks strategically important and plausibly
    category-defining, but still withholds the revenue, margin, and governance detail needed for clean public-evidence
    underwriting.
  founders:
    - name: Hamed Sadeghian
      role: Co-founder and CEO
      background: >-
        TNO researcher and Delft-trained scientist who led the nanoscale metrology work that became Nearfield's core
        platform.
      claimRefs:
        - CO006
        - CO007
  foundingLocation: Rotterdam, Netherlands
  headquarters: Rotterdam, Netherlands
  productSummary: >-
