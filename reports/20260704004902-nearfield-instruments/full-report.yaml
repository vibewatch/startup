  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization path, and what is still hidden
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a hardware-led revenue story, but only in outline. Nearfield’s official materials
              describe QUADRA and AUDIRA as capital-equipment platforms sold into advanced semiconductor process-control
              workflows, not as software seats or transaction rails. That matters because it implies that recognized
              revenue should be tied primarily to system sales, qualification, and deployment work, with service,
              applications, and support layered around the installed base. The 2026 Series D release strengthens that
              interpretation: management did not say the capital would fund customer-acquisition spend in a low-touch
              model; it said the money would expand production capacity, shorten delivery times, broaden customer
              support, and build applications centers. Those are the fingerprints of a scale-up moving deeper into
              industrial delivery. At the same time, the public record stops short exactly where underwriting would
              begin. There is no disclosed revenue run rate, no public service-share split, no realized pricing, no
              disclosed gross margin, and no contract-term data. The result is a chapter in which the monetization
              mechanism is visible, but the monetization quality is not. Investors can see that Nearfield likely has
