              AUDIRA mixes acoustic microscopy with AFM to inspect buried structures. Independent technical literature
              sharpens the use cases: the DSPE paper maps QUADRA into hybrid bonding, buried-power-rail, and
              gate-all-around manufacturing problems, and the imec project pushes the platform into high-NA EUV resist
              work, CFET sidewalls, and heterogeneous integration. Maturity evidence also exists, though unevenly. The
              about page says QUADRA was deployed in HVM by late 2023 and TNO records a 2020 shipment to Samsung. At the
              same time, the dependency picture is still incomplete. Nearfield clearly depends on high-precision
              mechanics, control software, applications engineering, and regional field support, but it does not
