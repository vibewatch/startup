      - number: '2.3'
        title: Growth drivers, constraints, and what remains unknowable publicly
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are complexity-driven rather than unit-driven. IRDS highlights AI and HPC
              workloads, chiplets, advanced packaging, hybrid bonding, backside power delivery, and HBM as technologies
              that require new metrology approaches. DQIndia's summary of Yole pushes in the same direction, arguing
              that metrology and inspection grew faster because AI, HBM, advanced packaging, hybrid bonding, and High-NA
              EUV make process control a strategic bottleneck rather than a support function. KLA's recent results add a
              live commercial check on that thesis: management says the AI-infrastructure buildout is benefiting
              foundry/logic, memory, advanced packaging, and services simultaneously. In other words, the category
              tailwind is not hypothetical.


              The main constraints are equally real. Dutch export-control changes in 2024 and 2025 explicitly broadened
              authorisation requirements for advanced semiconductor manufacturing equipment and then for specific
              measuring and inspection equipment, which matters disproportionately to a Dutch supplier such as
              Nearfield. The market is also highly incumbent-shaped: KLA, ASML/HMI, Onto, Nova, Applied already occupy
              adjacent workflow positions with software, service, and installed-base credibility. Public sources
              therefore support a strong category-growth thesis but an incomplete company-capture thesis. The missing
              diligence asks are the ones that matter most to underwriting: exact AFM/subsurface SAM, buyer-by-buyer
              budget share, deployment-cycle length, and the share of demand that truly escapes incumbent substitute
              tools.
