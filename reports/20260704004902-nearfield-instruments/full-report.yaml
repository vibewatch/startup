        title: Milestones, external proof, and remaining disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Nearfield's milestone chronology is unusually compelling for a private European hardware scale-up. TNO
              documents the 2020 shipment of the first QUADRA system to Samsung Semiconductor, the High Tech Campus
              article states that Samsung was a customer by mid-2024, and the November 2025 imec project put QUADRA into
              one of the world's most credible advanced-node R&D environments. The 2026 Series D then added the
              strongest possible financial signal short of an IPO. At the same time, the negative space in the record is
              real. Neither the company nor third parties disclose current revenue, installed-base count, customer
              concentration, margin structure, or clear board governance. Verdict's IPO story and Business News Today's
              KLA framing make that tension explicit: Nearfield may have crossed the credibility threshold on technology
              and fundraising, but public evidence is still insufficient to underwrite operating maturity at the same
              level of confidence. The result is a chapter-level view that is bullish on strategic relevance and
              cautious on commercial completeness. In practical diligence terms, the next step after reading public
              materials is not to challenge whether the company matters, but to narrow how much of that importance has
              already translated into durable customer economics, repeat orders, and governable scaling discipline.
