  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, spin-out roots, and product definition
        blocks:
          - type: paragraph
            body: >-
              Nearfield Instruments is now best understood as a Rotterdam-based semiconductor metrology company with
              unusually strong research lineage and unusually thin public financial disclosure. TNO and TNO Ventures
              establish the company's 2016 spin-out origin, while the company's own pages anchor the current product
              identity around QUADRA and AUDIRA. Those products are not generic inspection tools: QUADRA is presented as
              a high-throughput atomic-force-microscopy platform for on-device 3D process control, while AUDIRA extends
              the platform into buried-feature and void inspection through subsurface acoustic readout. The official
              Series D release and the TNO coverage both position Nearfield as part of the critical infrastructure
              required for AI-era chip manufacturing rather than a narrow niche supplier. That framing matters because
              it explains why investors funded the company at a unicorn valuation before the company disclosed
              conventional software-style KPIs such as ARR, revenue run rate, or customer count. The identity picture is
              therefore strong on technical mission and weak on monetization detail. The public profile is also
              unusually coherent for a private European hardware business because the same origin story, product
              framing, and advanced-node use cases recur across company, investor, and institutional partner sources.
              That consistency materially reduces ambiguity about the company's strategic lane even as operating metrics
              remain sparse in public materials still.
