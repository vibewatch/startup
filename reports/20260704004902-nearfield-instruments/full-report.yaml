      - number: '8.3'
        title: 'Recommendation: research more, and be explicit about what changes the call'
        blocks:
          - type: paragraph
            body: >-
              The valuation chapter therefore lands on research-more with medium confidence. That is not a disguised
              “no”; it is a recognition that the company may deserve attention while the security still lacks price
              support. Nearfield has enough proof to avoid an immediate pass: repeat orders exist, customer demand is
              not fictional, lender participation suggests some working-capital credibility, and the strategic narrative
              is coherent. But there is not enough public evidence to justify a buy call at the current round price. The
              diligence path is straightforward. Revenue, gross margin, order conversion, cap-table preferences,
              facility covenants, and export workflow all need to be made visible. If management provides those and the
              numbers support the current multiple, the recommendation can upgrade quickly. If instead repeat orders
              fail to convert, export approvals drag, or the financing stack proves restrictive, the downside can
              materialise faster than the headline demand story would suggest. The practical implication is that
              diligence cannot stop at generic enthusiasm about AI infrastructure. It has to force a hard answer on
              revenue quality, downside protection, and whether the current price already capitalises most of the
              visible good news. In other words, the path from research-more to buy is short if the numbers are strong,
              but the path from research-more to avoid is also short if the hidden economics disappoint. That asymmetry
              is exactly why the current recommendation remains price-disciplined.
            claimRefs:
              - CV018
