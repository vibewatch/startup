        title: Leadership, capital base, and governance dependence
        blocks:
          - type: paragraph
            body: >-
              The public record points to a founder-led company whose credibility is driven by technical continuity and
              investor validation rather than transparent governance disclosure. Hamed Sadeghian remains the central
              public face of the business across Nearfield, TNO, and partner releases, and the careers surface shows a
              company still hiring deeply into engineering and operations instead of shifting into a low-intensity
              commercial model. The June 2026 Series D round materially changed the capital base: Fidelity led, QIA
              joined, and an existing coalition spanning Temasek, Walden Catalyst, Innovation Industries, M&G,
              Invest-NL, TNO Ventures, and ING doubled down. The use-of-proceeds language is specific about production,
              customer support, and applications centers, which fits a capital-equipment company that must scale
              hardware, service, and collaborative development simultaneously. What remains weak is formal governance
              visibility: public sources do not provide current board composition, ownership percentages, or voting
              control, so the chapter treats governance dependence as an unresolved diligence area rather than a
              verified strength. The hiring mix also suggests that module industrialization, supplier coordination, and
              export-control compliance are core scaling tasks rather than peripheral support functions. That
              combination is typical of a company moving from breakthrough platform validation into repeatable factory
              execution.
