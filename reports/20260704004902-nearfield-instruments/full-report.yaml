  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Nearfield’s product story is much clearer than its public financial story. The company is selling
              metrology systems that sit directly in advanced semiconductor process-control workflows, not generic
              laboratory tools and not software abstractions. QUADRA is the core inline 3D scanning-probe platform,
              while AUDIRA extends the stack into subsurface and buried-feature inspection. Around that base platform,
              Nearfield is publishing a visible capability-upgrade ladder: Lightning Mode for faster imaging throughput,
              Sidewall Imaging Mode for more complete 3D access in extreme high-aspect-ratio structures, and an
              imec-backed roadmap for high-NA EUV, CFET, hybrid bonding, and buried-power-rail metrology. That means
              customers are not buying a frozen box; they are buying into a measurement architecture that can add modes
              and applications over time. The strongest public proof is that these are customer-workflow tools, not
              merely technical demos. Nearfield repeatedly frames them around process monitoring, yield control,
              full-wafer coverage, and inline deployment. The weakest public area is still commercial-operational
              detail: there is no public installed-base count, no uptime disclosure, and no public map of which
              capabilities are sold as standard features versus separately monetized options.
