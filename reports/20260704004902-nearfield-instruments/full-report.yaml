          - type: callout
            title: The missing denominator is the entire underwriting problem
            body: >-
              As long as investors do not know whether Nearfield revenue is closer to $100 million or $300 million, the
              same $1.6 billion valuation can look stretched, fair, or even attractive. That is why diligence must start
              with revenue, gross margin, and order conversion rather than with narrative enthusiasm.
