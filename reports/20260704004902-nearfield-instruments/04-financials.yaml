- id: capital-intensity-and-unit-economics
  title: Capital intensity, unit-economics proxies, and comp brackets
  body: 'The public hiring trail makes Nearfield’s economic profile look like a deep-tech equipment business with real industrial overhead. The technical project lead role spans engineering, manufacturing, procurement, and quality, while the optics engineer role owns critical modules from concept through volume production. That means the cash model almost certainly includes supplier management, precision components, mechatronics, applications engineering, and field support, not just front-end research. Because Nearfield does not publish direct unit-economics data, public-company peers are the best available bracket. KLA shows what scaled process control can look like at the high end: more than $12 billion of annual revenue, gross margins a little above 60%, and multibillion-dollar free cash generation. Onto provides a smaller but still meaningful reference with roughly $292 million of Q1 2026 revenue and gross margins around 50% GAAP / 55.7% non-GAAP. Nova’s sub-$1 billion revenue base provides
    another scale marker for a more specialized metrology vendor. None of those figures is a proxy for Nearfield itself, but together they tell the right story: if a process-control vendor wins technically and operationally, margins can become attractive at scale. What remains unknowable publicly is where Nearfield sits on that curve today — before or after the point where installations, service burden, and manufacturing complexity start to turn into durable contribution margin.'
