chapter:
  number: 4
  title: Financials
  summary: Nearfield looks financially de-risked on funding but still opaque on operating economics. Public evidence supports a hardware-led revenue model and a capital-intensive scaling plan, yet revenue quality, gross margin, burn, runway, and concentration remain undisclosed.
sections:
- id: revenue-model-and-disclosure
  title: Revenue model, monetization path, and what is still hidden
  body: 'Public evidence supports a hardware-led revenue story, but only in outline. Nearfield’s official materials describe QUADRA and AUDIRA as capital-equipment platforms sold into advanced semiconductor process-control workflows, not as software seats or transaction rails. That matters because it implies that recognized revenue should be tied primarily to system sales, qualification, and deployment work, with service, applications, and support layered around the installed base. The 2026 Series D release strengthens that interpretation: management did not say the capital would fund customer-acquisition spend in a low-touch model; it said the money would expand production capacity, shorten delivery times, broaden customer support, and build applications centers. Those are the fingerprints of a scale-up moving deeper into industrial delivery. At the same time, the public record stops short exactly where underwriting would begin. There is no disclosed revenue run rate, no public service-share
    split, no realized pricing, no disclosed gross margin, and no contract-term data. The result is a chapter in which the monetization mechanism is visible, but the monetization quality is not. Investors can see that Nearfield likely has multiple revenue-bearing activities around tool deployment; they still cannot tell how much of reported value is recurring, how much is one-time system recognition, or how quickly service economics improve after installation.'
