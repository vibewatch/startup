  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-run-rate
    missingEvidence: Audited revenue and shipment history after the 2026 round.
    whyItMatters: Without a denominator, the disclosed valuation and financing scale cannot be interpreted economically.
    diligencePath: Request audited annual statements plus monthly revenue bridge.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross-margin history by systems, service, and applications work.
    whyItMatters: Margin path is central to whether the company scales like a high-quality process-control vendor or a permanently project-heavy hardware business.
    diligencePath: Request gross-margin waterfall and warranty reserve history.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: Current cash balance, monthly burn, and board runway cases after Series D.
    whyItMatters: Capital adequacy cannot be judged from raise size alone when the company is explicitly funding production and support expansion.
    diligencePath: Request cash-flow statement, current cash, and base/bear/bull runway model.
    relatedQuestionRefs:
    - QI015
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: contract-terms
    missingEvidence: Realized pricing, discounts, and contract structure by product line.
    whyItMatters: Revenue quality depends on how much monetization is one-time versus supportable repeat economics.
    diligencePath: Request top-10 contract archetypes and renewal / service attach terms.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer share and repeat-order history.
    whyItMatters: A small number of leading-edge fabs could dominate economics and downside risk.
    diligencePath: Request customer concentration and reorder cadence by region and segment.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI005
