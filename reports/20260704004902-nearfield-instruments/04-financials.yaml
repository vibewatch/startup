tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Public support
  - Current value / status
  - Revenue quality lens
  - Diligence ask
  rows:
  - - System sales
    - QUADRA and AUDIRA are sold as metrology platforms
    - Active but undisclosed
    - Likely largest revenue source; hardware recognition timing matters
    - Request ASPs, shipment count, and acceptance milestones
  - - Installation / qualification work
    - Delivery-time and applications-center language implies deployment activity
    - Active but undisclosed
    - Can pull revenue forward while masking steady-state utilization
    - Request install-to-acceptance timeline and labor capitalization policy
  - - Service / support
    - Nearfield says it markets and services machines; support expansion is a Series D use of funds
    - Active but undisclosed
    - Could become higher-quality recurring revenue once installed base scales
    - Request service attach rate, warranty burden, and renewal terms
  - - Applications / co-development projects
    - Global applications centers and imec-style development work imply engineering services around the tools
    - Active but undisclosed
    - Useful wedge into accounts but not automatically recurring
    - Request project pricing, margin profile, and conversion to tool orders
  - - Software / mode upgrades
    - Lightning Mode and other modes suggest upgrade value, but no separate commercial packaging is public
    - Unknown
    - Could improve monetization per tool if sold post-install
    - Request pricing / attach rates for mode and feature upgrades
  notes: Rows distinguish supportable revenue mechanisms from mechanisms that are plausible but not quantified publicly. Null economics are disclosure gaps, not evidence of zero.
