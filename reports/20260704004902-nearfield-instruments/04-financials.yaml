callouts:
- calloutType: strength
  title: Funding risk has fallen faster than disclosure risk
  body: The 2026 Series D clearly de-risked Nearfield’s ability to keep building, hiring, and supporting customers. What it did not do is reveal enough private metrics to convert that financing win into a public underwriting model.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI033
- calloutType: risk
  title: Valuation interpretation is impossible without a denominator
  body: Public process-control comps span from Bruker-like low-single-digit sales multiples to KLA-like mid-teens. Without revenue disclosure, Nearfield’s $1.6 billion valuation can still map to very different financial realities.
  claimRefs:
  - CI028
  - CI029
  - CI034
  - CI038
