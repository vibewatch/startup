- id: public-comps-and-scenario-band
  title: Public comps show why the missing denominator matters so much
  body: The comp evidence is directionally useful but not self-executing. Mature process-control and semiconductor-equipment leaders such as KLA and ASML trade at double-digit sales multiples, while Bruker sits much lower and Onto provides a more mid-scale metrology anchor. Because Nearfield’s own revenue is undisclosed, the same $1.6 billion valuation can map to very different implied multiples. At 10x sales, investors are implicitly assuming about $160 million of revenue. At 15x sales, they are assuming a little over $100 million. At Bruker-like instrumentation multiples, they would need more than $750 million of revenue, which is clearly a different business reality. That is why a scenario framework is more honest than false precision. A plausible base case leaves the current price roughly fair-to-stretched. A bull case exists, but it requires stronger revenue conversion and more disclosure. The bear case is not absurd if export timing or order conversion disappoints. Another way to frame the problem is that comps are giving investors a translation key, not an answer sheet. They show how the market prices quality, scale, and disclosure in adjacent businesses, but they cannot tell investors which part of the band Nearfield deserves until management discloses the denominator and margin structure with audited-style detail.
