- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Revenue / proof assumption
  - Multiple / valuation logic
  - Valuation range (USD bn)
  - Probability signal
  rows:
  - - Bull
    - Repeat orders expand into broad fab adoption and revenue reaches roughly $200M-$250M with strong mix
    - 12x-15x sales for a differentiated private process-control leader with visible growth
    - 2.2-3.0
    - Needs disclosed revenue, continued roadmap wins, and smooth export execution
  - - Base
    - Repeat orders convert, but revenue remains around $120M-$180M and disclosure stays limited
    - 10x-12x sales, in line with premium public-equipment peers but with a private discount
    - 1.2-1.8
    - Most plausible if proof improves faster than disclosure but not enough for a buy call
  - - Bear
    - Revenue is under $100M or delayed, while export or execution friction compresses confidence
    - 6x-10x sales, reflecting concentration and scale-up risk
    - 0.6-1.0
    - Triggered by shipment slippage, facility stress, or weak order conversion
  notes: Scenario bands are evidence-led estimates, not a formal DCF; they are anchored to public multiple bands and Nearfield’s disclosed valuation, not to disclosed private financials.
