- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Revenue context
  - P/S or valuation marker
  - Relevance
  - Limitation
  rows:
  - - KLA
    - ~$12.156B 2025 revenue; ~$12.524B TTM through Sep 2025
    - 14.5x year-end 2026 sales
    - Best public process-control scale anchor
    - Far larger and much more diversified than Nearfield
  - - ASML
    - ~$39.065B TTM revenue through Mar 2026
    - 13.0x year-end 2026 sales
    - Upper-bound semiconductor-equipment quality multiple
    - Lithography monopoly and unmatched scale distort direct comparability
  - - Onto Innovation
    - ~$987M 2024 revenue; $292M Q1 2026
    - 9.85x year-end 2026 sales
    - Closest mid-scale metrology / inspection public anchor
    - Public company with fuller disclosure and broader installed base
  - - Bruker
    - 2.13x year-end 2025 sales
    - Low-single-digit sales multiple
    - Useful low-end hardware/instrumentation anchor
    - Not a pure semiconductor metrology comp
  - - Nearfield current round
    - No public revenue disclosed
    - $1.6B post-money in Jun 2026
    - Sets actual entry price investors must underwrite
    - Cannot be converted into an observed P/S multiple publicly
  notes: The comparable set is intentionally mixed to show how sensitive the underwriting call is to the missing revenue denominator.
