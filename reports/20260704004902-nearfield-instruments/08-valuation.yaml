  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: actual-revenue
    missingEvidence: Actual monthly and annual revenue, backlog ageing, and order-to-revenue conversion for 2025 and 2026.
    whyItMatters: The recommendation is price-sensitive and cannot be upgraded without the denominator behind the $1.6 billion valuation.
    diligencePath: Request board reporting on bookings, backlog, shipments, acceptance, recognised revenue, and deferred revenue by quarter.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
