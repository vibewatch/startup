- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Repeat-order conversion failure
    - Orders do not become installed and accepted systems within the plan window
    - Commercial-proof thesis weakens and implied multiple expands artificially
    - Move from research-more to avoid until conversion is visible
  - - Export-control shock
    - Licence denial or prolonged hold on flagship non-EU accounts
    - Revenue timing and customer concentration both worsen
    - Reprice to bear-case band immediately
  - - Facility / preference surprise
    - Debt covenants or preference stack materially subordinate new capital
    - Downside for common and new investors worsens
    - Pause underwriting until full cap-table and debt package is reviewed
  - - Scale-up miss
    - Support, delivery, or applications build-out lags while orders continue rising
    - Execution risk overtakes technology advantage
    - Cut bull/base assumptions and delay investment
  - - Disclosure remains stagnant
    - Management still withholds revenue and margin metrics after fresh diligence cycle
    - Price support remains incomplete even if the company keeps winning press and awards
    - Retain research-more stance or disengage
  notes: Every kill trigger is tied to an observable event or a concrete diligence deliverable rather than to a vague narrative disappointment.
  claimRefs:
  - CV025
  - CV026
  - CV038
  - CV041
  - CV042
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and backlog
    - Quarterly revenue, backlog ageing, and order-to-revenue conversion by customer
    - Needed to translate the $1.6B round into a real multiple
    - Request board deck and revenue bridge from CFO
  - - Gross margin and service mix
    - Systems vs support vs applications revenue and gross margin
    - Needed to distinguish premium hardware economics from costly field work
    - Request product / service P&L and warranty reserve policy
  - - Cash burn and runway
    - Post-Series-D cash balance, monthly burn, and capex plan
    - Needed to know whether another round is likely before profitability
    - Request treasury dashboard and 18-month operating plan
  - - Cap table and preferences
    - Series preference stack, liquidation waterfall, and employee dilution
    - Needed to underwrite downside outcomes and exit proceeds
    - Review cap table, charter, and waterfall model
  - - ING facility terms
    - Size, covenants, collateral, availability tests, and maturity
    - Needed to judge whether debt is flexibility or hidden risk
    - Review executed credit agreement
  - - Export workflow
    - Classification, customer screening, and actual licence timing
    - Needed to test whether international scale can continue smoothly
    - Review compliance memo and shipment approval log
  notes: These asks are ordered by how directly they can change the recommendation or the acceptable entry price.
