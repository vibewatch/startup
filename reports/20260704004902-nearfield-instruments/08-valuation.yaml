chapter:
  number: 8
  title: Valuation
  summary: 'Nearfield’s $1.6 billion Series D valuation may be defensible, but the public record still withholds the revenue and margin denominator needed to prove it. The right call today is research-more with medium confidence: the business has real proof, but the security still lacks enough disclosed data for a buy recommendation.'
sections:
- id: thesis-and-price-discipline
  title: The company story is attractive; the price discipline is the problem
  body: Nearfield is easy to like as a company. The 2026 Series D proved global investor appetite, and company materials keep strengthening the narrative that advanced metrology is becoming strategically central to AI-era semiconductor manufacturing. Repeat orders, a full 2025 order book, lender support from ING, and continued product and whitepaper releases all suggest this is not just a lab story anymore. The challenge is that none of those positives gives public investors the denominator needed to underwrite a $1.6 billion valuation. No revenue, gross margin, cash-burn, or service-mix number was disclosed in the sources reviewed for this run. That means the right investment question is not “Is Nearfield interesting?” It is “What revenue and margin profile must exist for today’s price to be sensible?” Until management answers that question with numbers, the right stance is disciplined curiosity rather than enthusiastic extrapolation. In practice, that means treating Nearfield as a potentially strong business but an only partially priceable security. Strategic quality and entry-price quality are not the same thing yet for outside investors today.
