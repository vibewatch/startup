- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - Evidence
  - What would change the view
  rows:
  - - Advanced metrology relevance rises with AI, hybrid bonding, and advanced packaging
    - Thesis
    - Investor note, sidewall mode, and hybrid-bonding whitepaper show clear technical relevance
    - Third-party adoption or revenue proof from those workloads
  - - Repeat orders show the company is past pure pilot stage
    - Thesis
    - QUADRA repeat orders filled the 2025 order book
    - Need installed / accepted system count to judge durability
  - - Deep capital access and lender support reduce near-term solvency pressure
    - Thesis
    - Series C, EIC, ING, and Series D all support survival
    - Would weaken if facility terms or burn make another round urgent
  - - Headline valuation lacks a disclosed denominator
    - Anti-thesis
    - No public revenue, gross margin, or cash-burn disclosure found in this run
    - Would improve if management shares audited or board-level metrics
  - - Public comp multiples vary so widely that price can look fair or stretched
    - Anti-thesis
    - Bruker, Onto, ASML, and KLA span low-single to mid-teens sales multiples
    - Would clarify if actual revenue pins Nearfield to one part of the band
  - - Export-control timing can compress value before demand visibly weakens
    - Anti-thesis
    - Dutch inspection-equipment controls now apply to non-EU exports
    - Would ease if compliance history shows smooth approvals on key routes
  notes: The thesis is real, but every thesis point still needs a pricing denominator before it can become a buy case.
