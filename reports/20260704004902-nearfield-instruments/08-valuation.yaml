    - TV004
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-burn
    missingEvidence: Gross margin, service mix, warranty burden, cash burn, and runway assumptions after the Series D close.
    whyItMatters: Revenue alone is insufficient if gross margins are weak or field-service intensity absorbs the economics.
    diligencePath: Request product / service gross margin, monthly burn bridge, and post-close cash plus debt schedule.
