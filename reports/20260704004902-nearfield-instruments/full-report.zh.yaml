      - number: '3.3'
        title: 切换成本、既有势力与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              最深的护城河问题不是 Nearfield 是否有有趣技术，而是这项技术能否深嵌进晶圆厂工作流，足以越过既有供应商的客户控制。KLA 的申报文件、ASML/HMI 的装机传承叙事、Hitachi
              的制程控制框架都指向同一个结构性事实：一旦供应商从试点到 HVM
              都进入良率管理回路，切换成本就会上升，因为正常运行时间、数据连续性、服务支持和相邻工具兼容性都会变得重要。这会形成一种竞争环境：专才供应商不只要证明测量更好，还要证明运营结果优于既有巨头的绕行方案。


              公开证据显示，Nearfield 的护城河在以下用例里最强：埋藏结构、3D 或 AFM 衍生数据能揭示宽平台无法高效交付的信息。它的护城河在买家可通过 optical CD、e-beam
              inspection、薄膜计量，或更密集使用既有制程控制栈解决问题的地方最弱。先进封装、HBM 和 gate-all-around
              应该会为专才创造更多机会，但同一批驱动也会动员分销力更强、服务组织更大、公开验证更多的大型既有巨头。净判断因此是平衡的：Nearfield
              看起来有差异化，但这种差异化的耐久性取决于精准的工作流楔子；公开记录尚未把这些楔子量化到足够程度。
