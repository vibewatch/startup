      - number: '5.3'
        title: 支持足迹、信任缺口与技术结论
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Nearfield 比一个简单 R&D 拆分公司更成熟。管理层名单现在明确包括财务、销售、运营、系统工程和项目管理负责人；联系入口列出了在 Netherlands、Japan、South
              Korea、United States、Singapore 和 Taiwan
              的办公室或代表处。招聘页面也强化了公司仍在建设模式中：它招的是负责批量生产光学的岗位和跨职能工业化领导，而不只是纯研究。这是部署意图和区域支持准备度的强信号。信任侧则是公开记录变薄的地方。没有被引用的正常运行时间或
              SLA
              数字，没有公开质量证书清单，没有面向客户的明确软件安全控制栈，也没有公开供应商地图。同样重要的是，没有公开现场故障历史，没有量化支持响应披露，也没有第三方审计包能让外部尽调团队仅凭文件压力测试运营准备度。这些缺口都不否定产品；它们只是说明技术尽调还没结束。因此，正确的产品结论是平衡的。Nearfield
              的公开证据在形态、路线图具体性和困难下一代节点部署相关性上很强；在运营可靠性、认证深度和供应侧韧性上仍不完整，而这些正是买家把公司纳入耐久标准工具体系前会追问的领域。这些缺失层很重要，因为计量供应商不只按图像质量被评判，还要看它们能否留在产线控制回路里，不给晶圆厂制造运营拖累，尤其是在认证窗口、产线异常和晶圆厂切换期间。这个运营门槛具有决定性。
