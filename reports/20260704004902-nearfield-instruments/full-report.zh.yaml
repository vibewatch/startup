      - number: '7.3'
        title: 融资和治理改善了，但投资判断包仍不完整
        blocks:
          - type: paragraph
            body: >-
              Nearfield 当前画像里令人鼓舞的部分，是公开可见的缓释因素。公司 2024 年融资 €135 million，2026 年又完成 $380 million Series D，其间还拿到 ING 贷款，并在
              2025
              年新增一名独立监事会成员。这些信号重要，因为它们说明投资人、贷款方和合作伙伴仍愿意支持这家扩张期公司。不那么鼓舞的是，这些缓释因素并没有关闭核心尽调缺口。投资人仍不知道头部客户占比、订单到收入的转化周期、出口审批时间，或银行贷款里的法律条款。因此，风险监控必须保持具体：看许可证节奏、客户集中度、安装周期和贷款方余量，而不是泛泛谈「执行」。放到实际层面，Nearfield
              现在风险高，但还没有摧毁投资命题。需求验证和战略相关性都存在。让公司有风险的是，少数外部节点——监管者、旗舰客户、贷款方和路线图伙伴——仍可能快速传导到收入时点和估值压力。因此，只有当投资委员会愿意监控少数可测触发阈值，而不是依赖泛泛的长周期深科技故事时，公司才具备可投资性。如果这些触发阈值保持稳定，风险画像可以很快压缩；如果恶化，下行可能在围绕
              AI、主权或独角兽身份的公开叙事来得及调整之前到来。
