      - number: '2.3'
        title: 增长驱动、约束与公开材料仍无法回答的问题
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动来自复杂度，而不是出货单位数。IRDS 强调，AI 和 HPC 工作负载、chiplets、先进封装、混合键合、背面供电以及 HBM 都需要新的计量方法。DQIndia 对 Yole
              的摘要也指向同一方向：AI、HBM、先进封装、混合键合和 High-NA EUV 让制程控制从支持职能变成战略瓶颈，因此计量与检测增长更快。KLA 近期业绩给这个判断加了一层实时商业校验：管理层称 AI
              基础设施建设正在同时利好晶圆代工 / 逻辑、存储、先进封装和服务。换句话说，品类顺风不是假设。


              主要约束同样真实。荷兰在 2024 年和 2025 年调整出口管制，明确扩大先进半导体制造设备的许可要求，随后又把特定测量和检测设备纳入授权范围；对 Nearfield
              这样的荷兰供应商来说，这个影响格外大。市场也高度由既有巨头塑形：KLA、ASML/HMI、Onto、Nova、Applied
              已经在相邻工作流中占位，拥有软件、服务和装机基础可信度。因此，公开来源支持强品类增长判断，但还不能完整证明公司能吃到多少。尽调里最该问的问题仍缺答案：精确的 AFM / 次表面
              SAM、各买家的预算份额、部署周期长度，以及真正逃离既有替代工具的需求占比。
