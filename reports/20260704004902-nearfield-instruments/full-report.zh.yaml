  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现路径与仍被隐藏的部分
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个硬件驱动的收入故事，但只支持轮廓。Nearfield 官方材料把 QUADRA 和 AUDIRA
              描述为卖进先进半导体制程控制工作流的资本设备平台，不是软件席位，也不是交易轨道。这一点很重要，因为它意味着确认收入应主要绑定系统销售、资格认证和部署工作，服务、应用和支持围绕装机基础叠加。2026 年
              Series D
              新闻稿强化了这个解读：管理层没有说这笔资金会投入低接触模式下的获客开支，而是说会扩产能、缩短交付时间、扩大客户支持并建设应用中心。这些都是扩张期公司走向更深工业交付的指纹。同时，公开记录恰好在投资判断将要开始的地方停住：没有披露收入年化水平，没有公开服务收入占比，没有已实现定价，没有披露毛利率，也没有合同期限数据。因此，本章能看见变现机制，却看不见变现质量。投资人可以看到
              Nearfield 围绕工具部署很可能有多项可产生收入的活动；他们仍无法判断报告价值里多少是经常性收入、多少是一次性系统确认，以及安装后服务经济性改善得多快。
