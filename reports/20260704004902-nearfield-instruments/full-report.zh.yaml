        blocks:
          - type: paragraph
            body: >-
              Nearfield 的客户证据窄，但真实。公开具名证据恰好集中在前沿制程控制公司应当拿下的账户类型：Samsung 这个先进晶圆厂客户、imec 这个开发和验证伙伴，以及一个截至 2025
              年初已下多笔订单的未具名美国客户。这不是广基客户故事，但很严肃。最强信号是 Samsung。2024 年独立报道和 TNO 回顾都说公司把 QUADRA 发进了 Samsung 的环境，多方来源仍把
              Samsung 描述为客户，而不是一次性评估方。imec
              不同。它强力证明技术相关性和路线图访问权，但披露形态是多年开发项目，不是高产量生产客户。未具名美国客户介于两者之间：它证明了额外需求和地域扩张，但身份缺失让外部人无法判断集中度、部署成熟度，或这些订单来自一个买家还是多个买家。因此，公开证据越过了「真实采用」门槛，但还没越过「客户基础多元」门槛。
