      - number: '2.2'
        title: 买家、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家地图也比宽泛半导体设备筛选更专门。最相关的用户，是先进逻辑代工厂、存储厂商、先进封装或 OSAT 运营方，以及 imec 这类顶尖 R&D
              产线里的制程集成、良率工程和计量团队。预算通常掌握在制程控制或晶圆厂资本委员会手里，而不是产品设计团队，因为工具价值要靠良率保护、产线认证速度和缺陷逃逸减少来衡量。Onto
              的公开材料和季度业绩也强化了这个现实：它把当前客户斩获系在 2.5D 逻辑、HBM 和 gate-all-around 计量上，而不是泛泛的晶圆厂扩张。


              采用路径通常从技术问题定义开始，先做试点认证，然后才进入机群标准化。这条路径对 Nearfield 很关键，因为这个品类满是现状替代方案，不是一片空白绿地。遇到新的测量问题时，买家往往可以先用 optical
              CD、ellipsometry、e-beam inspection、离线 AFM，或在既有制程控制栈里加密采样；只有这些办法不够时，才会把新供应商认定为标准工具。Bruker、SENTECH、Onto 和
              ASML/HMI 的公开页面把这组替代方案摆在了台面上。因此，Nearfield 的机会不只是计量需求上升，而是某些下一代用例可能需要 3D 或埋藏结构测量；在这些场景里，传统光学或检测方法会损失效率或精度。
