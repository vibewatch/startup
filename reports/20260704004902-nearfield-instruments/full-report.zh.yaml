      - number: '3.2'
        title: 能力宽度、打包方式与商业对照
        blocks:
          - type: paragraph
            body: >-
              从能力宽度看，既有巨头和年轻专才完全不是一类公司。KLA 的 10-K 描述了一个从 R&D 到大规模制造、覆盖检测、计量、软件和服务的制程控制组合。ASML 的 HMI 业务正在把多束 e-beam 检测推进
              3 nm 量产。Onto 面向逻辑、存储和先进封装营销先进计量，并已宣布在 HBM 和 gate-all-around 工作流中拿到新客户。Nova 和 Applied
              也把自身产品放在集成尺寸、材料和制程控制测量里，而不是某个狭窄形态。Nearfield
              可能在更小的一组测量上差异化更尖，但公开竞争负担很明显：每一次客户推介，都要面对那些能用更宽工具、服务和分析覆盖包围同一买家的供应商。


              商业对比同样不对称。公开竞争对手披露季度业绩、长期收入历史和公开市场估值信号，规模可读。Nearfield
              不披露。整个品类的定价也大多不透明：产品页通常展示报价驱动的企业销售动作、联系路径或解决方案营销，而不是标价。因此，实际定价比较与其说看公开美元标签，不如看打包模式、集成负担、服务依赖，以及工具是作为单一用途附加件存在，还是成为更宽制程控制标准的一部分。Nearfield
              的机会在于，测量痛点足够尖锐时，买家仍可能为窄工具付费；挑战在于，大多数公开对手都能把工具推介系到更宽的平台故事上。
