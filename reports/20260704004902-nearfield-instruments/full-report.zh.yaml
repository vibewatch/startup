  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模纪律
        blocks:
          - type: paragraph
            body: >-
              Nearfield 的正确市场边界，比泛泛的晶圆厂设备更窄，又比独立 AFM 更宽。KLA、Applied Materials、ASML、Nova 和 Onto 的官方产品页都描述了一层制程控制：从 R&D
              到大规模制造，覆盖计量、晶圆检测、缺陷复查、套刻、材料表征和软件。KLA 的申报文件和 Applied Materials
              的制程控制框架，把运营需求讲得很清楚：制造商靠计量和检测在漂移损害良率、盈利能力或产线爬坡速度之前把问题抓出来。因此，制程控制需要自己的市场镜头，而不应被当成光刻或沉积资本开支里的脚注。


              公开市场估算确认，这一层已经相当大，但口径并不干净，无法支撑单一精确 TAM。Mordor Intelligence 估计，半导体计量与检测系统市场 2025 年为 $13.03 billion，2030 年为
              $16.95 billion。DQIndia 引用的 Yole 2026 年报告摘要称，2025 年该市场超过 $18 billion，约占晶圆厂设备支出的
              14%。这些数字在增长方向上相互印证，但显然嵌入了不同边界，可能包含不同组合的软件、封装工具或相邻检测形态。因此，正确的尽调做法是保留多个镜头，并明确说明：没有公开来源能干净隔离出对 Nearfield 最重要的
              AFM 加埋藏结构子集。
