      - number: '1.3'
        title: 里程碑、外部验证与仍未披露的空白
        blocks:
          - type: paragraph
            body: >-
              对一家欧洲私营硬件扩张期公司来说，Nearfield 的里程碑时间线很有说服力。TNO 记录了 2020 年第一台 QUADRA 系统发往 Samsung Semiconductor；High Tech
              Campus 文章称 Samsung 到 2024 年中已经是客户；2025 年 11 月的 imec 项目又把 QUADRA 放进全球最可信的先进制程 R&D 环境之一。随后，2026 年 Series D
              给出了 IPO 之外最强的财务信号。同时，记录里的负空间也真实存在。公司和第三方都没有披露当前收入、装机数量、客户集中度、利润率结构或清晰的董事会治理。Verdict 的 IPO 报道和 Business
              News Today 对 KLA 的对照，把这种张力讲得很直白：Nearfield
              可能已经在技术和融资上越过可信度门槛，但公开证据仍不足以用同等信心判断运营成熟度。因此，本章结论是：战略相关性偏多，商业完整度仍需谨慎。放到实际尽调里，读完公开材料后的下一步，不是质疑这家公司是否重要，而是缩小问题：这种重要性已经在多大程度上转化为耐久的客户经济性、复购和可治理的扩张纪律。
