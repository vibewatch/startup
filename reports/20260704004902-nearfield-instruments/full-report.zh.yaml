              语言也强调客户支持建设，而不是一次性研究活动。这些信号有帮助，但仍是代理。也没有公开满意度指标、披露服务绑定率，或公开逐客户部署地图，能把关系持续性转成可测的留存证据。因此，公开证据在客户质量上最强，在客户广度和持续性上最弱。这足以支撑技术尽调故事，但还不足以支撑对集中度敏感的投资模型。
