      - number: '8.3'
        title: 建议：继续研究，并明确哪些变化会改变判断
        blocks:
          - type: paragraph
            body: >-
              因此，估值章节给出的结论是继续研究，置信度为中。这不是包装过的“否决”；而是承认公司值得关注，但这笔投资仍缺乏价格支撑。Nearfield
              的证据足够避免立即放弃：已有重复订单，客户需求并非虚构，贷方参与说明其具备一定营运资本可信度，战略叙事也说得通。但公开证据还不足以支撑按当前轮次价格给出买入判断。尽调路径很直接：收入、毛利率、订单转化、股权结构表优先权、融资额度约束条款和出口流程都要摆到台面上。如果管理层给出这些信息，且数字支撑当前倍数，建议可以很快上调。反过来，如果重复订单无法转成收入、出口审批拖延，或融资结构带有限制，下行可能比表面需求故事暗示的更快兑现。实际含义是，尽调不能停在对
              AI
              基础设施的泛泛热情上。它必须逼出几个硬答案：收入质量、下行保护，以及当前价格是否已经把大部分可见利好资本化。换句话说，如果数字足够强，继续研究到买入的路径很短；如果隐藏经济性令人失望，继续研究到回避的路径也很短。这种不对称，正是当前建议仍需严守价格纪律的原因。
