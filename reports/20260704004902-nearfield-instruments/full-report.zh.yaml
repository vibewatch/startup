  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公司故事有吸引力；价格纪律才是问题
        blocks:
          - type: paragraph
            body: >-
              Nearfield 作为一家公司很容易让人喜欢。2026 年 Series D 证明了全球投资人的兴趣，公司材料也不断强化一个叙事：先进计量正成为 AI 时代半导体制造的战略核心。复购订单、满额 2025
              年订单簿、ING 的贷款支持，以及持续发布的产品和白皮书，都说明这已经不只是实验室故事。挑战在于，这些正面因素都没有给公开投资人一个分母，无法支撑他们判断 $1.6 billion
              估值。本次梳理的来源没有披露收入、毛利率、现金消耗或服务组合数据。因此，正确的投资问题不是「Nearfield
              有意思吗？」而是「怎样的收入和利润率画像，才配得上今天的价格？」在管理层用数字回答之前，正确姿态是有纪律的好奇，而不是热情外推。实际操作上，应把 Nearfield
              视为一个潜在很强的业务，但证券价格只可被部分定价。对今天的外部投资人来说，战略质量和入场价格质量还不是一回事。
