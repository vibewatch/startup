  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险现在位于风险栈顶部
        blocks:
          - type: paragraph
            body: >-
              Nearfield 最重要的单一风险，已经不再是技术是否重要。公开记录已经显示旗舰客户验证、复购订单和 2026 年大额融资。更大的问题是，在出口管制收紧的环境里，这股商业动能能否顺畅推进。荷兰主管部门先在
              2024 年 9 月扩大国家半导体设备措施，又在 2025 年 1 月再次收紧，明确称自 2025 年 4 月 1 日起，特定测量和检测设备出口到 EU 以外需要授权。Nearfield
              销售先进计量和制程控制工具，并且已经披露美国和亚洲订单，所以这套规则直接相关。问题不在于荷兰制度是彻底禁令；官方反复说它是逐案审查。问题在于时间和不透明。公开来源没有披露 Nearfield
              自身的分类、筛查流程或审批经验。BIS 2026 年 5
              月指南又加了第二层：某些先进计算客户要看母公司管辖权。这意味着即便终端市场需求仍在，监管拖累也可能出现。它还意味着尽调负担是运营问题，不只是法律问题。Nearfield
              内部必须有人给工具分类、筛查最终用户、监控母公司结构，并决定什么时候一笔有希望的订单不再值得花审批成本去争取。这些控制没有一个公开可见。对于一家卖给少数技术要求很高晶圆厂的公司来说，这种不可见性提高了一个延迟交易比标题融资实力显示的更重要的概率。
