        - 系统、支持、应用收入及毛利率拆分
        - 需要区分高端硬件经济性和昂贵现场工作
        - 索取产品 / 服务 P&L 和保修准备金政策
      - - 现金消耗和资金跑道
        - Series D 后现金余额、月度现金消耗和资本开支计划
        - 需要判断盈利前是否可能再融资
        - 索取资金看板和 18 个月经营计划
      - - 股权结构和优先权
        - Series 优先权堆栈、清算瀑布和员工稀释
        - 需要承销下行情景和退出分配
        - 审阅股权结构表、章程和瀑布模型
      - - ING 融资工具条款
        - 规模、契约、抵押品、可用性测试和到期日
        - 需要判断债务是灵活性还是隐藏风险
        - 审阅已签署授信协议
      - - 出口流程
        - 分类、客户筛查和实际许可证周期
        - 需要验证国际扩张能否顺畅持续
        - 审阅合规备忘录和出货审批日志
    notes: 这些问题按它们改变推荐或可接受入场价的直接程度排序。
    claimRefs:
      - CV014
      - CV025
      - CV026
      - CV031
      - CV039
      - CV040
