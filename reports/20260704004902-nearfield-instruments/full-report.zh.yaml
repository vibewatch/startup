        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Nearfield 的产品故事比公开财务故事清楚得多。公司销售的计量系统直接嵌在先进半导体制程控制工作流里，不是泛泛的实验室工具，也不是软件抽象。QUADRA 是核心在线 3D 扫描探针平台；AUDIRA
              则把这套栈延伸到次表面和埋藏结构检测。围绕这套基础平台，Nearfield 正在公开一条可见的能力升级阶梯：Lightning Mode 提高成像吞吐，Sidewall Imaging Mode
              在极高深宽比结构里提供更完整的 3D 访问，imec 背书的路线图则面向 High-NA
              EUV、CFET、混合键合和埋入式电源轨计量。这意味着客户买的不是一台冻结的盒子，而是一套可以随时间增加模式和应用的测量架构。最强的公开证据在于，这些是客户工作流工具，而不只是技术演示。Nearfield
              反复围绕制程监控、良率控制、全晶圆覆盖和在线部署来描述它们。最弱的公开区域仍是商业和运营细节：没有公开装机数量，没有正常运行时间披露，也没有公开说明哪些能力是标准功能、哪些是单独变现选项。
