            body: >-
              好消息是，2026 年 6 月后，资本充足性有了具体改善。Nearfield 完成了荷兰规模最大的深科技融资之一；公司和 TNO
              都用运营语言描述这笔钱将支持下一阶段扩张：产能、交付、支持和应用基础设施。坏消息是，同一批表述也凸显了为什么仅靠公开材料仍很难给公司定价。管理层显然准备继续花钱，但投资人无法计算资金消耗速度，因为没有公开现金余额、没有现金续航披露、没有毛利率历史、没有在手订单数字，也看不到服务占比或客户集中度。反向解读不是
              Nearfield 没有牵引力，而是公司的公开画像仍跑在财务披露前面。公开市场可比公司也两面切。KLA、ASML 这类品类领导者可以拿到两位数销售倍数，但仪器类业务的交易倍数可能低得多；这意味着
              Nearfield 自身 $1.6 billion 估值究竟便宜还是昂贵，取决于外部人仍看不见的收入质量。实际尽调结论很直接：Series D
              之后，融资风险看起来低得多；但在管理层披露实际收入、毛利率、现金消耗和复购行为之前，投资判断风险仍然很高。
