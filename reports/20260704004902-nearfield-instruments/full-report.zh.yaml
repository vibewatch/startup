chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、拆分源流与产品定义
        blocks:
          - type: paragraph
            body: >-
              现在看 Nearfield Instruments，最准确的定位是一家总部位于 Rotterdam 的半导体计量公司：研究血统异常扎实，公开财务披露却异常稀薄。TNO 和 TNO Ventures 确立了公司
              2016 年拆分创业的起点；公司自己的页面则把当前产品身份锚定在 QUADRA 和 AUDIRA。这两款产品不是泛泛的检测工具：QUADRA 被定位为高吞吐原子力显微平台，用于器件上 3D 制程控制；AUDIRA
              则借助次表面声学读出，把平台延伸到埋藏结构和空洞检测。官方 Series D 新闻稿和 TNO 报道都把 Nearfield 放在 AI
              时代芯片制造所需的关键基础设施里，而不是一个狭窄的小众供应商。这个框架很重要，因为它解释了为什么公司尚未披露 ARR、收入年化水平、客户数量等传统软件式
              KPI，就已经以独角兽估值拿到融资。因此，公司的身份画像在技术使命上很强，在变现细节上很弱。对一家欧洲私营硬件公司来说，Nearfield
              的公开画像也异常连贯：公司、投资人和机构伙伴反复讲述同一套起源故事、产品框架和先进制程用例。即便公开运营指标仍然稀疏，这种一致性也显著降低了外界对公司战略赛道的模糊感。
