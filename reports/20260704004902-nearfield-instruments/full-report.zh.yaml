          detail: HBM、混合键合、GAA、3D NAND 或埋藏特征控制挑战。
          tone: positive
        - id: pilot
          label: 试验线认证
          detail: R&D 或工艺整合团队测试新模态是否提供独特良率洞察。
          tone: neutral
        - id: selection
          label: 量产指定工具决策
          detail: 晶圆厂资本和过程控制负责人比较新厂商收益与既有替代方案。
          tone: warning
        - id: fleet
          label: 机群规模部署
          detail: 大批量制造需要服务、正常运行时间、软件集成和可重复性。
          tone: warning
        - id: lockin
          label: 装机基础强化
          detail: 一旦标准化，切换成本上升，既有厂商更难被替代。
          tone: warning
