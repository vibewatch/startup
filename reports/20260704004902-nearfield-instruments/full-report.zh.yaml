      - number: '8.4'
        title: 附录
        blocks:
          - type: callout
            title: 公司有看点，价格支撑不完整
            body: Nearfield 已经越过从投机性科研项目到严肃半导体设备竞争者的门槛。它尚未在公开层面披露足够财务细节，无法把质量判断转成有把握的价格判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV014
              - CV024
              - CV039
              - CV044
          - type: callout
            title: 缺失的分母就是整个投资判断的核心
            body: >-
              只要投资人不知道 Nearfield 收入更接近 $100 million 还是 $300 million，同一个 $1.6 billion
              估值就可能显得偏高、合理，甚至有吸引力。因此，尽调必须从收入、毛利率和订单转化切入，而不是从叙事热情切入。
            calloutType: risk
            claimRefs:
