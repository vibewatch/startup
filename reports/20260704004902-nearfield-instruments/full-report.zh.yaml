companyProfile:
  summary: >-
    Nearfield Instruments 是一家总部位于 Rotterdam 的半导体计量公司，2016 年从 TNO 拆分出来，面向先进芯片生产打造计量与检测系统。公司的公开产品身份集中在 QUADRA 和
    AUDIRA：前者是用于在线制程控制的高吞吐 3D 扫描探针 / AFM 平台，后者是面向埋藏结构和空洞检测的次表面计量系统。公开验证点包括 Samsung 这个早期具名客户、2025 年与 imec 的多年开发项目，以及 2026
    年由 Fidelity 领投、规模 $380 million 的 Series D；该轮把公司估值推至 $1.6 billion。因此，Nearfield
    看起来具备战略重要性，也有可能定义品类，但它仍未披露收入、利润率和治理细节，公开证据还不足以支撑干净的投资判断。
