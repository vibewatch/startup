      - number: '4.2'
        title: 资本强度、单位经济代理指标与可比区间
        blocks:
          - type: paragraph
            body: >-
              公开招聘痕迹让 Nearfield
              的经济画像更像一家有真实工业开销的深科技设备公司。技术项目负责人岗位横跨工程、制造、采购和质量；光学工程师岗位则从概念到批量生产负责关键模块。这意味着现金模型几乎一定包括供应商管理、精密部件、机电一体化、应用工程和现场支持，而不只是前端研究。Nearfield
              不发布直接单位经济数据，因此上市同业是公开条件下最好的区间参考。KLA 展示了规模化制程控制在高端可能是什么样：年收入超过 $12 billion，毛利率略高于 60%，自由现金流达到数十亿美元。Onto
              提供了一个规模更小但仍有意义的参照，Q1 2026 收入约 $292 million，毛利率约 50% GAAP / 55.7% non-GAAP。Nova 不到 $1 billion
              的收入基础，则给更专业计量供应商提供了另一个规模标记。这些数字都不能直接代理 Nearfield
              自身，但合在一起讲清了正确故事：如果制程控制供应商在技术和运营上都赢了，规模化后利润率可以很有吸引力。公开材料仍无法判断的是，Nearfield
              今天站在曲线的哪里——是在装机、服务负担和制造复杂度转化为耐久贡献利润率之前，还是之后。
