          - type: paragraph
            body: >-
              可比公司证据只能给方向，不能自动推出结论。KLA、ASML 这类成熟工艺控制和半导体设备龙头，以两位数销售倍数交易；Bruker 低得多，Onto 则提供一个中等规模的量测锚点。Nearfield
              自身收入未披露，因此同一个 $1.6 billion 估值可以对应截然不同的隐含倍数。按 10x 销售额，投资人其实在假设收入约 $160 million。按 15x 销售额，假设值略高于 $100
              million。如果按 Bruker 类仪器倍数，则需要超过 $750 million
              收入，那显然是另一种业务现实。因此，用情景框架比伪精确更诚实。可信的基准情景认为当前价格大致合理到偏高；乐观情景也存在，但需要更强的收入转化和更多披露。若出口节奏或订单转化不及预期，悲观情景并不荒唐。换个说法，可比公司给投资人的是翻译键，不是答案表。它们显示市场如何给相邻业务的质量、规模和披露定价；但在管理层以近似审计的细节披露分母和利润率结构之前，它们无法告诉投资人
              Nearfield 应落在区间的哪一段。
            claimRefs:
