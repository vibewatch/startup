  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局结构与定位逻辑
        blocks:
          - type: paragraph
            body: >-
              Nearfield 周围的竞争集合是分层的，不是单一对手。最上层是 KLA、ASML/HMI、Applied Materials、Nova、Onto、Hitachi High-Tech
              等制程控制既有巨头，它们都展示了横跨检测、计量、软件或相邻良率管理表面的宽组合。这些公司，是先进晶圆厂已经认识、已经给预算、也常常跨多个步骤集成的供应商。外部地图来源也强化了这个框架：CB Insights 把
              KLA、Oxford Instruments、SENTECH 和 Hitachi High-Tech 列入 Nearfield 的替代选项，说明第三方也不是把 Nearfield
              看成单独一个品类，而是放在直接供应商、既有巨头和相邻供应商的横截面里。


              这一点重要，因为 Nearfield 的公开差异化不在组合宽度。公开材料里最清楚的差异化，是植根于扫描探针式测量的专门 3D
              或次表面制程控制；大多数既有巨头卖的则是更宽的光学、e-beam、缺陷检测和软件驱动制程控制栈。换句话说，Nearfield
              更可能靠在少数高难测量问题上独特有用而取胜，而不是逐项匹配既有巨头的功能。现实的竞争地图必须同时纳入两类对手：一类是能捆绑重叠能力的巨头，另一类是更窄的研究或 AFM
              供应商，它们在部分用例里给买家更便宜或风险更低的替代方案。
