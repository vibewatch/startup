      - number: '1.2'
        title: 领导层、资本基础与治理依赖
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，Nearfield 是一家创始人主导的公司，可信度主要来自技术连续性和投资人背书，而不是透明的治理披露。Hamed Sadeghian 仍是 Nearfield、TNO
              和合作伙伴新闻稿里最核心的公开面孔；招聘页面也显示，公司还在深度补工程和运营能力，并未转向低强度商业模式。2026 年 6 月的 Series D 实质性改变了资本基础：Fidelity 领投，QIA
              加入，Temasek、Walden Catalyst、Innovation Industries、M&G、Invest-NL、TNO Ventures、ING
              等既有投资方继续加码。募资用途写得很具体：生产、客户支持和应用中心。这符合资本设备公司的现实——它必须同时扩硬件、服务和联合开发能力。薄弱处在正式治理可见度：公开来源没有给出当前董事会构成、持股比例或投票控制权，所以本章把治理依赖视为未解决的尽调事项，而不是已验证的优势。招聘结构还表明，模块工业化、供应商协调和出口管制合规是核心扩张任务，不是边缘支持职能。这种组合通常属于一家公司从突破性平台验证转向可重复工厂执行的阶段。
