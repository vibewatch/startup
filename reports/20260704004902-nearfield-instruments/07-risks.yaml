  title: Licensing friction matters more than an outright ban narrative
  body: The Dutch regime is explicitly case-by-case rather than an across-the-board prohibition. That still leaves plenty of room for value destruction if approvals slow shipments to a narrow base of flagship non-EU customers.
  claimRefs:
