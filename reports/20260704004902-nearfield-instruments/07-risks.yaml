  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: export-approval-cycle
    missingEvidence: Shipment-level export-licence applications, approval timing, and any denied or conditioned approvals for non-EU destinations.
    whyItMatters: Timing risk is the core regulatory question; a licence regime can still damage bookings if approvals are slow or unpredictable.
    diligencePath: Request the export-compliance memo, sample licence applications, and the last twelve months of approval timestamps by destination.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: ing-facility-terms
    missingEvidence: Facility size, covenants, security package, draw conditions, and maturity of the ING financing arrangement.
    whyItMatters: Debt terms determine whether the facility is a flexible growth tool or a hidden source of covenant and refinancing risk.
    diligencePath: Request the executed facility agreement, covenant schedule, borrowing-base mechanics, and lender reporting package.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-customer, top-geography, and top-program order share plus order-to-revenue conversion by account.
    whyItMatters: Without concentration data, investors cannot tell whether a small number of fabs can materially impair the growth story.
    diligencePath: Request top-10 customer/order concentration, backlog ageing, and revenue-recognition conversion by named account.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: export-classification
    missingEvidence: Formal ECCN/dual-use classification and the company’s customer screening workflow.
    whyItMatters: Classification determines what can ship where and whether downstream customers trigger extra screening obligations.
    diligencePath: Obtain counsel memo, internal classification file, and screening controls used before accepting non-EU orders.
  - type: private-evidence-only
    severity: material
    topic: order-conversion
    missingEvidence: Median shipment-to-installation-to-acceptance timeline for recent Asia and U.S. orders.
    whyItMatters: Execution risk depends on how quickly orders become installed, accepted, and revenue-bearing systems.
    diligencePath: Request the operating dashboard for backlog, shipment timing, installation cohorts, and customer acceptance milestones.
    relatedTableRefs:
    - TR002
    - TR005
