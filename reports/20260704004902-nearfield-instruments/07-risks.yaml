- calloutType: insight
  title: Demand proof and risk can rise together
  body: Repeat orders and new regional orders improve conviction that Nearfield solves a real problem. They also raise the cost of every execution miss because backlog, support load, and revenue timing become more sensitive to a small set of customers and programs.
