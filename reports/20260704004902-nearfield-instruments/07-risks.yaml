chapter:
  number: 7
  title: Risks
  summary: Nearfield’s risk stack is dominated by export-control timing, customer concentration, and industrial scale-up rather than by demand absence. New equity, lender support, repeat orders, and partner programs are real mitigants, but the public record still leaves the most price-sensitive operating details undisclosed.
sections:
- id: regulatory-legal-risk
  title: Regulatory and legal risk now sits at the top of the stack
  body: Nearfield’s single most important risk is no longer whether the technology matters. The public record already shows flagship customer proof, repeat orders, and a large 2026 financing round. The bigger issue is whether that commercial momentum can move through a tightening export-control environment without friction. Dutch authorities first broadened the national semiconductor-equipment measure in September 2024 and then tightened it again in January 2025, explicitly saying that specific measuring and inspection equipment would require authorisation from 1 April 2025 for exports outside the EU. Because Nearfield sells advanced metrology and process-control tools and already discloses U.S. and Asian orders, that rule set is directly relevant. The problem is not that the Dutch regime is an outright ban; officials repeatedly say it is case by case. The problem is timing and opacity. Public sources do not disclose Nearfield’s own classification, screening workflow, or approval experience.
    BIS’s May 2026 guidance adds a second layer by making parent jurisdiction relevant for some advanced-computing customers. That means regulatory drag can arise even when end-market demand remains intact. It also means the diligence burden is operational, not just legal. Someone inside Nearfield has to classify tools, screen end users, monitor parent-company structures, and decide when a promising order is no longer commercially worth the approval effort. None of those controls is visible publicly. For a company selling to a narrow set of technically demanding fabs, that invisibility raises the chance that one delayed transaction matters more than headline funding strength suggests.
