- id: financial-execution-and-monitoring
  title: Financing and governance improved, but the underwriting package is still incomplete
  body: 'The encouraging part of Nearfield’s current profile is that public mitigations are visible. The company raised €135 million in 2024, added a $380 million Series D in 2026, secured an ING facility in between, and added an independent supervisory board member in 2025. Those signals matter because they show that investors, lenders, and partners still want to back the scale-up. The less encouraging part is that these mitigations do not close the central diligence gaps. Investors still do not know the top-customer share, the order-to-revenue conversion cycle, the export-approval timing, or the legal terms inside the bank facility. That means risk monitoring has to stay concrete: watch licence timing, customer concentration, installation cycles, and lender headroom rather than generic “execution” language. In practical terms, Nearfield’s risk profile is high but not thesis-destroying today. Demand proof and strategic relevance are present. What makes the company risky is that a narrow
    set of external nodes—regulators, flagship customers, lender, and roadmap partners—can still propagate quickly into revenue timing and valuation pressure. The company is therefore investable only if the committee is willing to monitor a handful of measurable tripwires rather than rely on a generic long-duration deep-tech story. If those tripwires stay stable, the risk profile can compress quickly. If they deteriorate, the downside can arrive before public narratives around AI, sovereignty, or unicorn status have time to adjust.'
