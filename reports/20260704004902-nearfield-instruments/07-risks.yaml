- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Dutch export-control timing risk
    - Licence turnaround time
    - Any flagship non-EU shipment approval exceeds six months or is denied
    - Move stance to avoid until approvals normalize or demand diversifies
  - - Customer concentration
    - Top-customer order share
    - Any single customer exceeds one-third of backlog or cancels a multi-tool program
    - Reprice revenue durability and financing need immediately
  - - Execution / installation risk
    - Shipment-to-acceptance cycle
    - Median cycle slips materially versus management plan for two consecutive quarters
    - Cut valuation assumptions tied to repeat-order conversion
  - - Facility / liquidity risk
    - ING covenant headroom
    - Any waiver request, covenant reset, or restricted drawdown appears
    - Treat lender dependence as a top-three risk and pause underwriting
  - - Roadmap dependency risk
    - imec or A*STAR program status
    - Any public or private pause in flagship collaboration milestones
    - Downgrade moat assumptions tied to advanced-node relevance
  - - Support-capacity risk
    - Applications / field-service scaling
    - Customer-support expansion stalls while orders continue rising
    - Assume delivery and quality bottlenecks until capacity catches up
  notes: Kill triggers are intentionally measurable so that investment committees can monitor them without waiting for a full report refresh.
