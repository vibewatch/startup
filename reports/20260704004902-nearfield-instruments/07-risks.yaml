- id: operational-and-dependency-risk
  title: Order proof is real, but it heightens execution and dependency risk
  body: 'Operationally, Nearfield looks like a company entering the hard part of scale-up. Repeat orders filled the 2025 order book, a U.S. customer placed multiple system orders, and additional Asian orders were disclosed in 2024. Those are genuine positives, but they also create the next layer of risk: the company must now deliver, install, support, and absorb more geographically distributed demand while still expanding production capacity and applications infrastructure. Public hiring reinforces that reading. The technical project lead role spans manufacturing, procurement, and supply chain, while the optics engineer role runs from concept to volume production. At the same time, the roadmap remains tied to high-value external nodes such as imec and A*STAR IME. Those partnerships are strengths, but they also mean roadmap credibility is partly bound to collaborative programs that the public cannot fully monitor. Nearfield’s support footprint is expanding across the U.S. and Asia, which
    mitigates response-time risk, yet it also increases management span and knowledge-management complexity.'
