companyProfile:
  summary: >-
    Nearfield Instruments is a Rotterdam-based 2016 TNO spin-off that builds advanced semiconductor metrology
    and inspection systems for leading-edge chip production. Its public product identity centers on QUADRA,
    a high-throughput 3D scanning-probe / AFM platform for in-line process control, and AUDIRA, a subsurface
    metrology system for buried features and void detection. Public proof points include Samsung as an early named
    customer reference, a 2025 multi-year development project with imec, and a 2026 Fidelity-led $380 million
    Series D that valued the company at $1.6 billion. The company therefore looks strategically important and
    plausibly category-defining, but still withholds the revenue, margin, and governance detail needed for clean public-evidence underwriting.
  founders:
    - name: Hamed Sadeghian
      role: Co-founder and CEO
      background: TNO researcher and Delft-trained scientist who led the nanoscale metrology work that became Nearfield's core platform.
      claimRefs: [CO006, CO007]
  foundingLocation: Rotterdam, Netherlands
  headquarters: Rotterdam, Netherlands
  productSummary: >-
    Nearfield sells semiconductor metrology platforms led by QUADRA for non-destructive 3D in-line process control and AUDIRA for non-destructive subsurface metrology of buried features and defects.
  customerFocus: >-
    Leading-edge logic, memory, hybrid-bonding, and advanced-packaging fabs plus R&D lines that need high-throughput nanoscale process control.
  businessModel: >-
    Hardware-led capital-equipment sales with qualification and deployment work, followed by service, support, and application-center engagement.
  stage: Series D private
  fundingStatus: '$380M Series D at $1.6B valuation announced on 2026-06-22; public evidence confirms prior 2024 Series C funding but not a full lifetime-capital total.'
