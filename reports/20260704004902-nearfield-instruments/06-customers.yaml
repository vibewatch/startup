chapter:
  number: 6
  title: Customers
  summary: Nearfield has convincing named-customer proof for a young semiconductor-equipment company, but the proof is narrow. Samsung, imec, and an unnamed U.S. customer show real adoption; public durability, breadth, and concentration metrics are still missing.
sections:
- id: segments-and-proof
  title: Customer segments and named proof
  body: 'Nearfield’s customer evidence is narrow but real. Publicly named proof clusters in exactly the kinds of accounts one would expect for a frontier process-control company: a leading-edge fab customer in Samsung, a development and validation partner in imec, and an unnamed U.S. customer that had already placed multiple orders by early 2025. That is not a broad-base customer story, but it is a serious one. The strongest signal is Samsung. Independent 2024 reporting and TNO’s retrospective both say the company shipped QUADRA into Samsung’s environment, and multiple sources still describe Samsung as a customer rather than a one-time evaluator. Imec is different. It is strong proof of technical relevance and roadmap access, but it is disclosed as a multi-year development project rather than as a high-volume production account. The unnamed U.S. customer sits somewhere in between: it proves additional demand and geographic expansion, but the lack of identity keeps outsiders from judging
    concentration, deployment maturity, or whether those orders came from one buyer or several. So the public evidence clears the “real adoption” bar without clearing the “diversified customer base” bar.'
