- id: expansion-support-and-risk
  title: Expansion motion, support model, and concentration risk
  body: 'Nearfield’s expansion model appears much more service-heavy than logo-heavy. The company publicly lists offices or representation across major semiconductor geographies, has a visible management bench in sales and operations, and is using fresh capital to build applications centers. Those are all signs of a high-touch customer-support motion suited to large fabs and complex metrology deployments. They are not signs of a broad channel-led model or a low-touch product. In fact, public evidence for channel dependence is relatively thin: Japan and Taiwan references point to commercial agents, but the public record does not show a mature reseller network carrying the load. That leaves concentration risk as the core customer issue. Named proof is high quality but narrow, and the same narrowness that makes the technology feel premium also raises downside sensitivity if a small number of flagship accounts slow down, delay installs, or choose an incumbent workaround. The public evidence
    therefore supports a constructive but cautious customer verdict. Nearfield has crossed the line from “interesting lab company” to “credible strategic supplier,” yet investors still need the private retention and concentration package before they can judge durability with confidence. Until that package exists, customer strength should be treated as high-quality but concentrated proof rather than as broad-based adoption across many fab programs globally. Breadth remains unproven publicly.'
