- id: adoption-and-durability
  title: Adoption trajectory, durability signals, and what remains invisible
  body: 'The adoption trajectory that can be reconstructed publicly runs from first shipment into Samsung in late 2020, through Korean regional buildout in 2021, through HVM claims by late 2023, into 2024 customer coverage, into a multi-year imec development program in 2025, and finally into 2026 capital for more support and applications capacity. That is a coherent progression. It suggests a company moving from early flagship proof into a broader but still highly technical customer-development phase. What it does not reveal is classic durability data. There is no disclosed customer count, no public NRR or GRR, no renewal schedule, no contract-length data, and no top-customer concentration percentage. The best public durability proxy is repeat-order language: Reuters syndications say Nearfield had multiple orders from an unnamed U.S. customer, and the Series D language emphasizes customer-support buildout rather than one-off research activity. Those are helpful signals, but they are still
    proxies. There is also no published satisfaction metric, no disclosed service attach rate, and no public account-by-account deployment map that would turn relationship persistence into measurable retention evidence. Public proof is therefore strongest on account quality and weakest on account breadth and persistence. That is acceptable for a technology-diligence story, but not yet sufficient for a concentration-sensitive underwriting model.'
