- id: support-trust-and-roadmap
  title: Support footprint, trust gaps, and the technical verdict
  body: 'Operationally, Nearfield looks more mature than a simple R&D spin-out. The management roster now includes explicit finance, sales, operations, system-engineering, and program-management leaders, while contact surfaces list offices or representation across the Netherlands, Japan, South Korea, the United States, Singapore, and Taiwan. The hiring surfaces reinforce that the company is still in build mode: it is recruiting for volume-production optics ownership and cross-functional industrialisation leadership rather than only pure research. That is a strong signal for deployment intent and regional support readiness. The trust side is where the public record thins out. There are no cited uptime or SLA numbers, no public quality-certificate list, no explicit software-security control stack for customers, and no public supplier map. Just as important, there is no public field-failure history, no quantitative support-response disclosure, and no third-party audit packet that would let
    an outside diligence team stress-test operational readiness from documents alone. None of those gaps disproves the product; they simply mean the technical diligence is not finished. The correct product conclusion is therefore balanced. Nearfield’s     public evidence is strong on modality, roadmap specificity, and deployment relevance in difficult next-generation nodes. It is still incomplete on operational reliability, certification depth, and supply-side resilience, which are exactly the areas a buyer would probe before making the company a durable tool-of-record standard. Those missing layers matter because metrology vendors are judged not only on image quality, but on whether they can stay inside line control loops without creating operational drag for the fab, especially during qualification windows, line excursions, and fab changeovers. That operational threshold is decisive.'
