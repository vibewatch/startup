  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: uptime-sla
    missingEvidence: Named uptime, MTBF, SLA, and field-reliability metrics.
    whyItMatters: Production buyers care about operational stability at least as much as measurement novelty.
    diligencePath: Request fleet uptime, service response times, and warranty / failure-rate data.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: certifications
    missingEvidence: Public evidence of quality, security, or software-compliance certifications.
    whyItMatters: Certification depth influences buyer trust and audit burden.
    diligencePath: Request ISO / quality / security certificates and scope statements.
    relatedQuestionRefs:
    - QE017
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: supplier-concentration
    missingEvidence: Named critical suppliers, contract manufacturing structure, and dual-source status.
    whyItMatters: A precision hardware business can fail operationally even with good technology if supply dependencies are narrow.
    diligencePath: Request supplier map, single-source components, and mitigation plan.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: installed-base
    missingEvidence: Installed-base count by product and region.
    whyItMatters: This would sharpen maturity and support-burden analysis.
    diligencePath: Request shipment, install, and active-fleet breakdown by product.
    relatedQuestionRefs:
    - QE009
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: minor
    topic: field-throughput
    missingEvidence: Third-party benchmark detail behind claimed throughput and productivity improvements.
    whyItMatters: It would clarify whether Lightning Mode economics hold across real fab recipes.
    diligencePath: Request benchmark protocol, baseline tool set, and production-case studies.
