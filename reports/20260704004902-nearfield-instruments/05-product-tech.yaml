- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Nearfield solution
  - Measurable benefit claim
  - Limitation
  rows:
  - - GAA / high-aspect-ratio monitoring
    - Optical or destructive methods struggle on complex 3D geometry
    - QUADRA + FFTP inline 3D AFM metrology
    - Non-destructive inline measurements at 3 nm and beyond
    - Public pages do not disclose fab-level throughput by recipe
  - - Hybrid bonding / heterogeneous integration
    - Surface roughness, erosion, and alignment errors can create bond failures
    - QUADRA application set highlighted in DSPE and imec project
    - More complete 3D process insight for bond-quality control
    - Public outcome metrics remain technical, not economic
  - - CFET sidewall profiling
    - Extreme high-aspect-ratio sidewalls are hard to measure inline
    - Sidewall Imaging Mode
    - Full-3D profile measurement for features through full wafers
    - Mode was only announced in 2026 and lacks public field stats
  - - Buried-feature / void inspection
    - Subsurface defects are not fully visible from surface-only metrology
    - AUDIRA acoustic + AFM approach
    - Nanometer-level measurement of buried features and voids
    - Commercial deployment breadth is undisclosed
  - - Yield / process-variation control
    - Lot-to-lot and wafer-to-wafer variation can escape slower tools
    - Lightning Mode productivity boost
    - Faster scanning promises deeper process-variation insight and higher wafer coverage
    - Benchmark is company-published rather than third-party validated
  notes: Benefits are recorded only where a source names a technical advantage. Missing economic or field-scale outcomes stay explicit as limitations.
