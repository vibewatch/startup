- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  rows:
  - - Leading-edge logic / foundry
    - Foundry process-control leadership
    - Metrology and yield engineers
    - Fab-capital and yield-improvement budget
    - Node ramp, overlay, buried-feature, and defect control from pilot to HVM
    - New architecture or yield bottleneck that incumbent tools do not resolve cleanly
  - - Memory / HBM
    - Memory-fab and package-integration groups
    - Module, DRAM, HBM, and hybrid-bonding engineers
    - Memory line capex and yield budgets
    - 3D NAND, DRAM, HBM stack qualification and monitoring
    - HBM or stacking complexity forces more precise inline metrology
  - - Advanced packaging / OSAT
    - Packaging engineering management
    - Hybrid-bonding, TSV, and package-yield teams
    - Packaging process-control budget
    - Wafer-level packaging and 2.5D/3D integration
    - Packaging yield loss or void-detection problem requires a new modality
  - - R&D consortia / pilot lines
    - Research-program leads
    - Development engineers and tool owners
    - Program, grant, or pilot-line budgets
    - Process development before transfer into production
    - Tool demonstrates unique insight on emerging structures
  - - Status-quo substitute stack
    - Incumbent process-control vendor account teams
    - Existing optical, e-beam, and film-metrology users
    - Existing service and fleet budgets
    - More sampling or adjacent-tool tuning instead of buying a new platform
    - Incumbent workaround remains good enough on ROI and risk
  notes: Buyer and payer are separated because the end user is usually a process-control team while budget authority sits with fab-capital or yield-management leadership.
