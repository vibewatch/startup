- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI accelerator build-out and HPC demand
    - Positive
    - Current / 2025-2030
    - Raises process-control intensity across logic, memory, and packaging
    - Quantify which AI-linked workflows truly require Nearfield-like modalities
  - - HBM, hybrid bonding, and advanced packaging complexity
    - Positive
    - Current / 2025-2030
    - Expands high-value measurement problems beyond front-end CD alone
    - Test where buried-feature or subsurface inspection becomes mandatory rather than optional
  - - Gate-all-around and advanced-node transitions
    - Positive
    - Current / 2025-2028
    - Creates more difficult geometry and process-window control challenges
    - Identify which GAA steps benefit from AFM or subsurface measurement versus optical alternatives
  - - Incumbent portfolio breadth and service reach
    - Negative
    - Current
    - Large vendors can bundle software, service, and adjacent tools around the same buyer
    - Map where account-control and installed-base lock-in block specialist displacement
  - - Dutch and allied export-control tightening on measuring / inspection equipment
    - Negative
    - Current / 2025 onward
    - Adds licensing friction and geography-specific sales constraints
    - Determine which countries, customers, or product variants need authorisation
  - - Opaque AFM / buried-feature subsegment sizing
    - Negative
    - Current
    - Prevents clean SAM/SOM underwriting from public sources alone
    - Request internal segment, install-base, and win-rate data from management
  notes: Constraints are included alongside growth drivers because the category can grow quickly while a specialist entrant still struggles to capture spend if incumbents or export regimes narrow the practical sales surface.
