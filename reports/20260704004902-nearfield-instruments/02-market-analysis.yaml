- id: buyers-workflows-and-adoption-path
  title: Buyers, users, and the adoption path
  body: 'The buyer map is also more specialized than a broad semiconductor-equipment screen suggests. The most relevant users are process-integration, yield-engineering, and metrology teams inside leading-edge logic foundries, memory producers, advanced-packaging or OSAT operations, and elite R&D lines such as imec-like development environments. Budget ownership usually sits with process-control or fab-capital committees rather than product-design groups, because the tool''s value is measured through yield protection, line qualification speed, and defect escape reduction. Onto''s public materials and quarterly results reinforce that reality by tying current customer wins to 2.5D logic, HBM, and gate-all-around metrology rather than to generic fab expansion.


    The adoption path usually runs from technical problem definition to pilot qualification and only then into fleet standardization. That path matters for Nearfield because the category is full of status-quo substitutes, not an empty greenfield. Buyers can often respond to a new measurement problem with optical CD, ellipsometry, e-beam inspection, off-line AFM, or more intense sampling using incumbent process-control stacks before they grant a new vendor tool-of-record status. Public pages from Bruker, SENTECH, Onto, and ASML/HMI make this substitute set visible. Nearfield''s opportunity is therefore not simply that metrology demand is rising; it is that some next-generation use cases may require 3D or buried-feature measurement where legacy optical or inspection approaches lose efficiency or accuracy.'
