callouts:
- calloutType: insight
  title: The category is real; the serviceable slice is not public
  body: Public evidence is more than sufficient to establish a multi-billion-dollar metrology-and-inspection market and strong advanced-node tailwinds. It is not sufficient to isolate the AFM-plus-buried-feature slice that matters most to Nearfield without management data.
  claimRefs:
