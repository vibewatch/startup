- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: wide
  summary: A new metrology tool must move from architecture-driven need to pilot qualification, tool-of-record selection, and finally service-backed fleet deployment.
  data:
    nodes:
    - id: need
      label: New architecture problem
      detail: HBM, hybrid bonding, GAA, 3D NAND, or buried-feature control challenge.
      tone: positive
    - id: pilot
      label: Pilot-line qualification
      detail: R&D or process-integration teams test whether the new modality adds unique yield insight.
      tone: neutral
    - id: selection
      label: Tool-of-record decision
      detail: Fab-capital and process-control owners compare new-vendor benefit versus incumbent substitutes.
      tone: warning
    - id: fleet
      label: Fleet-scale rollout
      detail: High-volume manufacturing requires service, uptime, software integration, and repeatability.
      tone: warning
    - id: lockin
      label: Installed-base reinforcement
      detail: Once standardised, switching cost rises and incumbents become harder to displace.
      tone: warning
    edges:
    - from: need
      to: pilot
    - from: pilot
      to: selection
    - from: selection
      to: fleet
    - from: fleet
      to: lockin
  approximationNotes: The flow is structural rather than quantitative because public sources describe the sequence of adoption constraints without publishing conversion rates by stage.
