tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Nearfield
  rows:
  - - Semiconductor process control
    - Metrology, inspection, defect review, overlay, process-control software, related services
    - Lithography scanners, deposition, etch, broad fab construction
    - Yield engineering, process integration, fab-capital committees
    - Core category where Nearfield must win tool-of-record status
  - - Advanced-node logic and foundry
    - Critical-dimension, surface, defect, and buried-feature measurements tied to 3 nm and below ramps
    - General-purpose mature-node capacity additions with minimal new measurement intensity
    - Foundries and leading-edge IDMs
    - Highest-value adoption surface for Nearfield-like specialty metrology
  - - Memory and HBM
    - 3D NAND, DRAM, HBM stacking, hybrid-bonding, and packaging metrology
    - Commodity memory spend that does not require new measurement modalities
    - Memory fabs and packaging teams
    - Strong demand driver because AI accelerators pull HBM and 3D complexity upward
  - - Advanced packaging / OSAT
    - Wafer-level packaging, hybrid bonding, TSV, interposer, and 2.5D/3D integration process control
    - Board assembly or downstream system integration
    - Packaging engineering and yield teams
    - Expanding adjacency where incumbents and specialists both compete
  - - Research and pilot-line metrology
    - Pilot qualification, process-development, and failure-analysis measurement tools
    - Pure academic instrumentation with no fab-transfer path
    - R&D labs, consortia, process-development groups
    - Early wedge for new tools, but not proof of full HVM standardization
  notes: Boundary logic separates process-control spend from the rest of wafer-fab equipment because the public sources consistently describe metrology and inspection as a dedicated yield-management layer rather than generic equipment spend.
