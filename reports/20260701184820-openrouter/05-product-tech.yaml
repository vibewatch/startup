chapter:
  number: 5
  title: Product & Technology
  summary: 'OpenRouter has become a broad AI routing control plane rather than a simple proxy: one OpenAI-compatible API now spans hundreds of models, multiple SDKs, routing algorithms, server tools, and growing multimodal surfaces. Its strongest differentiation is operational compatibility and ecosystem reach, while the biggest public diligence gaps remain formal SLA terms, third-party security assurance, and private deployment evidence.'
sections:
- id: product-definition-and-module-scope
  title: Product Definition and Module Scope
  body: 'OpenRouter’s product is best understood as a routing and control plane inserted between an application or agent and many upstream model providers. Rather than integrating separately with OpenAI, Anthropic, Google, xAI, or open-model hosts, a developer can target one OpenAI-compatible endpoint and move among model choices without rewriting application structure. The quickstart also makes the commercial packaging legible: teams can stay at raw REST for maximum control, adopt thin Client SDKs for type safety and pagination, or move up to the Agent SDK when they need tool loops and state management. From the customer-workflow perspective, the product is not just cheaper token access. It compresses evaluation, vendor switching, and multi-model experimentation into a single operational surface. The module map now stretches beyond text inference into model discovery, rankings, server tools, structured outputs, dedicated image APIs, speech and transcription, and workspace governance. That
    breadth makes OpenRouter closer to AI connectivity infrastructure than to a narrow proxy, although the reviewed public materials still emphasize managed cloud access rather than private deployment.'
