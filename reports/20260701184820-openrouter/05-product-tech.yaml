- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / metric
  - Current public status
  - Scope
  - What it helps
  - Remaining gap
  rows:
  - - Provider training opt-out
    - Documented and configurable
    - Separate controls for paid and free models
    - Avoids routing to providers that may train on prompts
    - Does not change OpenRouter’s own separate data-use setting
  - - Provider retention visibility
    - Documented but advisory
    - Per-provider retention and training policy views
    - Lets buyers screen providers before use
    - Retention preferences are not enforced automatically by router policy
  - - EU in-region routing
    - Documented enterprise feature
    - Traffic sent to eu.openrouter.ai
    - Supports regional data handling requirements
    - Public docs do not show pricing, SLA, or architecture detail for this mode
  - - ZDR endpoint preview and per-provider ZDR controls
    - Documented
    - Endpoint-level metadata plus provider-specific toggles
    - Makes privacy trade-offs explicit before routing
    - Public docs do not show independent validation of provider-side behavior
  - - Input and output logging
    - Documented beta feature
    - Admin-only visibility, encrypted storage, minimum three-month retention
    - Debugging, evaluation, and usage review
    - Skipped for EU-routed traffic and still requires support contact for deletion
  - - Workspace guardrails
    - Documented May 2026 release surface
    - Spend limits, allowlists, prompt-injection blocking, and PII redaction
    - Centralizes safety and governance policies across keys and users
    - No public false-positive, recall, or efficacy metrics were found
  - - Formal assurance package
    - Not publicly verified in reviewed sources
    - SLA, SOC 2 / ISO, pen test, and private deployment proof
    - Would materially reduce enterprise diligence friction
    - Still a management-request item rather than a public artifact
  notes: The table separates visible product controls from the third-party assurance evidence that remains missing from reviewed public materials.
