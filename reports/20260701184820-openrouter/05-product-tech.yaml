- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow pain
  - OpenRouter solution
  - Public benefit signal
  - Limitation
  rows:
  - - Compare frontier models quickly
    - Separate keys, endpoints, and schemas per provider
    - Unified endpoint plus models catalog and rankings
    - Experimentation and model switching happen without refactoring core app logic
    - Underlying model quality and provider quirks still vary
  - - Build a tool-using agent
    - Provider-specific function schemas and brittle orchestration loops
    - Standardized tool calling plus Agent SDK loops and state
    - Shared tool and message patterns can be reused across models
    - Tool reliability still depends on schema quality and provider behavior
  - - Keep an app up during provider issues
    - Single-provider outages and 429 ceilings become user-facing errors
    - Automatic provider failover, optional model fallbacks, and zero completion insurance
    - Retry design is cheaper and more resilient than direct integration
    - Narrow allowlists reduce available recovery paths
  - - Lower repeated inference cost
    - Regression tests and repeated prompts rebill the same work
    - Response caching at the OpenRouter layer
    - Identical successful requests can return instantly with zero billed usage
    - Tool-calling and error responses are not cacheable
  - - Add live web context to agents
    - Teams must build or host their own search and fetch tools
    - Server-side web search and web fetch tools
    - Models can decide when to call current-information tools inside one request flow
    - Server tools are still beta and need governance controls
  - - Centralize privacy and spend controls
    - Every upstream provider has different logging and policy surfaces
    - Workspace guardrails, ZDR views, provider logging, and BYOK management
    - Governance becomes a layer above the provider set
    - Public assurance evidence is thinner than the feature surface
  notes: Workflow rows focus on customer jobs the product solves in practice, not on marketing feature names alone.
