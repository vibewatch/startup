- id: routing-architecture-and-operating-model
  title: Routing Architecture and Operating Model
  body: 'Architecturally, OpenRouter combines a normalized request interface with policy and routing logic that operates above upstream providers. The models API exposes pricing, modality, context, provider, author, benchmark, and ZDR filters, turning model selection criteria into machine-readable inputs rather than ad hoc per-provider code. Auto Router then adds prompt-aware model selection, session stickiness, and routing controls such as allowed_models and cost-quality preferences. Auto Exacto is a second layer specialized for tool use: it reorders providers by throughput, benchmark signals, and measured tool-call success, and it explicitly tracks invalid JSON, unknown tool names, and invalid arguments as failure buckets. Reliability features sit both before and after model execution. Response caching occurs at the OpenRouter layer before a request reaches any provider, while provider failover is automatic and model fallbacks are explicit through a models array. Tool calling, structured
    outputs, and server tools extend the control plane into runtime orchestration, letting a team standardize schemas and add search or fetch capabilities without building every tool wrapper itself.'
