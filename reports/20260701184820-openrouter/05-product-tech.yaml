- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Core function
  - Differentiation
  - Diligence gap
  rows:
  - - Unified inference API
    - Application and agent developers
    - Mature core
    - One OpenAI-compatible endpoint for hundreds of models and providers
    - Removes per-provider integration work and keeps switching cost low
    - No public throughput or SLO baseline by tier
  - - Model catalog and rankings
    - Evaluators and procurement-aware engineers
    - Mature
    - Browse, filter, and compare models by modality, price, context, and benchmark lenses
    - Makes routing criteria machine-readable instead of tribal knowledge
    - Ranking methodology and anti-gaming controls are not fully public
  - - Routing engines (Auto Router / Auto Exacto)
    - Platform engineers
    - Mature and expanding
    - Choose or reorder models and providers based on prompt, health, and tool-call performance
    - Operational know-how compounds above commodity inference access
    - No public workload-by-workload benchmark delta for every router mode
  - - Reliability and cost controls
    - Production operators
    - Mature core
    - Response caching, automatic failover, model fallbacks, and zero completion insurance
    - Turns uptime and retry economics into product features
    - Public docs still acknowledge some edge-case billing paths
  - - Server tools and structured outputs
    - Agent builders
    - Mixed beta and mature
    - Add server-side web tools, image generation, and schema-safe outputs
    - Moves orchestration logic into the control plane
    - Server-tool safety efficacy metrics are not public
  - - SDK and package surface
    - JavaScript and Python developers
    - Active
    - Official TS, Python, agent, and AI SDK provider packages
    - Meets developers inside existing ecosystems and runtime patterns
    - Package surface is visible, but enterprise guarantees vary by framework
  - - Workspace governance, BYOK, and ZDR
    - Enterprise admins
    - Growing
    - Spend controls, allowlists, PII redaction, per-provider ZDR, and BYOK management
    - Adds governance above a shared model marketplace
    - Public audit artifacts and formal SLA terms remain open diligence asks
  - - Media and private-model expansion
    - Multimodal product teams
    - New in 2026
    - Dedicated image API, speech and transcription, and private-model routing
    - Extends the platform beyond text-only brokering
    - Adoption, support load, and revenue mix of new modules are undisclosed
  notes: Rows summarize the distinct product surfaces explicitly documented in official docs, release notes, package surfaces, and independent integration references.
