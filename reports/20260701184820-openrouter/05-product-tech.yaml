  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-sla
    missingEvidence: A current public SLA, uptime commitment, support-response matrix, or sample contractual support schedule.
    whyItMatters: Enterprise buyers need to know whether support is a marketed capability or a contractually enforceable operating commitment.
    diligencePath: Request the standard enterprise MSA, SLA rider, escalation policy, and example support-response commitments for comparable customers.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: third-party-security-audit
    missingEvidence: Public SOC 2, ISO 27001, penetration-test summary, or equivalent third-party security assurance artifact.
    whyItMatters: Trust features are helpful, but regulated buyers often require independent control validation before routing production prompts through a shared gateway.
    diligencePath: Request the latest audit reports, bridge letters, pen-test executive summary, and control ownership matrix for workspace guardrails and logging.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: private-deployment-architecture
    missingEvidence: Documented VPC, private network, or self-host deployment architecture and the operational boundary between customer and OpenRouter responsibilities.
    whyItMatters: Private deployment options materially affect whether OpenRouter can serve buyers with strict network, residency, or audit requirements.
    diligencePath: Ask for private deployment architecture diagrams, residency controls, tenancy model, and a list of features that do or do not work in private deployment modes.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: minor
    topic: guardrail-efficacy-metrics
    missingEvidence: False-positive, false-negative, and coverage metrics for prompt-injection blocking, PII redaction, and workspace guardrails.
    whyItMatters: Feature presence alone does not show whether the safety layer is effective enough for production agent workflows.
    diligencePath: Request benchmark methodology, test set composition, and observed intervention rates for the announced guardrail controls.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: model-fusion-benchmarking
    missingEvidence: Public benchmark deltas, latency overhead, and cost trade-off evidence for Model Fusion and Auto Exacto outside announcement copy.
    whyItMatters: These features are plausible differentiators, but investors still need independent evidence that they outperform simpler routing or single-model defaults.
    diligencePath: Request benchmark decks, evaluation harnesses, and customer examples that compare fused or optimized routing against a fixed-model baseline.
    relatedQuestionRefs:
    - QE016
    - QE018
    relatedTableRefs:
    - TE005
