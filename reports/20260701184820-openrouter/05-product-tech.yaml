    - Accurate upstream metadata and benchmark refresh
    - Stale metadata would degrade routing decisions
  - - Routing and optimization engine
    - Apply Auto Router, Auto Exacto, failover, fallback, and health-aware selection
    - Auto Router, Auto Exacto, uptime, and failover docs
    - Provider health telemetry and policy configuration
    - Over-constraining providers reduces resiliency
  - - Reliability, caching, and billing controls
    - Cache repeat requests, waive zero-token failures, and expose usage signals
    - Response caching and zero completion insurance docs
    - Correct cache-keying and charge reconciliation
    - Edge-case billing paths remain a disclosed caveat
  - - Server-tool execution layer
    - Run search, fetch, image, and panel tools on behalf of models
