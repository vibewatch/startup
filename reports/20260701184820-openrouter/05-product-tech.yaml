- id: trust-privacy-support-and-diligence-gaps
  title: Trust, Privacy, Support, and Diligence Gaps
  body: Trust and governance are visibly present in the product, but they are not fully de-risked. On the positive side, OpenRouter publishes provider-level training and retention disclosures, EU routing, ZDR-aware endpoint previews, spend and allowlist controls, prompt-injection blocking, PII redaction, and admin-only input and output logging with encrypted storage. Zero completion insurance and automatic provider failover also show that cost protection and uptime are treated as product features rather than merely support promises. The open diligence items are equally important. Logging retention and EU-routing limitations mean privacy behavior still depends on feature toggles and traffic path. Provider-retention preferences are disclosed but not enforced automatically by routing policy. Independent review coverage also flags production-stage concerns around support speed and governance depth. Most importantly, the reviewed public materials do not verify a public SLA, a third-party audit
    package such as SOC 2 or ISO 27001, or a public VPC or self-host deployment architecture. The current evidence supports a credible cloud routing layer for sophisticated developers, but not full closure on enterprise assurance and support obligations.
