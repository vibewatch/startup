  title: Capital formation is visible, but capitalization transparency is still incomplete
  body: The $113M Series B and the rough $1.3B valuation are well supported, yet the exact lifetime capital stack is not. The August 2025 Form D, the reported 2025 Series A, and the 2026 Series B do not reconcile cleanly enough to state a precise total raised or to understand dilution, investor preferences, or any secondary component. That is a real diligence ask, not a formatting nit.
