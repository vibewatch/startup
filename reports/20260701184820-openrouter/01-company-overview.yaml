  title: OpenRouter already looks like a control plane, not only a model router
  body: 'The official material set is unusually coherent for a young private company. Quickstart docs, enterprise pages, workspaces docs, ZDR controls, and the May release spotlight all reinforce the same operating thesis: OpenRouter wants to own routing, governance, observability, and billing for multi-model AI traffic. That makes the business easier to understand and gives later diligence chapters a stable product baseline.'
