  evidenceGaps:
  - type: missing-source
    severity: minor
    topic: founder corroboration
    missingEvidence: A primary or official source that names Louis Vichy and fully explains founder-role coverage alongside Alex Atallah.
    whyItMatters: Founder completeness shapes key-person dependence, succession planning, and founder-market-fit analysis; today the retained evidence is materially stronger on Atallah than on Vichy.
    diligencePath: Request a current founder / leadership page, a financing memo naming founders, or a board-approved company overview that explicitly states the founder lineup.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: governance rights
    missingEvidence: Current board roster, observer list, investor protective provisions, and any voting or veto rights tied to major investors.
    whyItMatters: Without visibility into control rights, the public chapter can name directors but cannot assess who actually governs downside scenarios, hiring, financing approvals, or future strategic outcomes.
    diligencePath: Request the current board deck cover, investor rights summary, and a cap-table memo that identifies board seats, observers, and reserved matters.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: total-raised reconciliation
    missingEvidence: A reconciled financing history that maps the 2025 Form D, the reported Series A, and the 2026 Series B into one non-overlapping total raised number, including any secondaries or converted notes.
    whyItMatters: Valuation alone does not reveal dilution, liquidity preference overhang, or how much new primary capital actually reached the balance sheet.
    diligencePath: Obtain the financing deck, board financing summary, or cap-table waterfall that reconciles every primary issuance since formation.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: debt or credit facilities
    missingEvidence: Management confirmation on whether OpenRouter has any venture debt, credit lines, or provider-related financing arrangements.
    whyItMatters: Debt can change runway, covenant risk, and enterprise-contract flexibility, especially for an infrastructure company selling against heavy usage growth.
    diligencePath: Ask management or counsel for the debt schedule and any material financing side letters.
    relatedQuestionRefs:
    - QO016
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count by geography and function.
    whyItMatters: The company’s public usage scale is very large relative to the qualitative small-team narrative, so staffing depth matters for execution, support, security, and reliability judgments.
    diligencePath: Request an HR snapshot or board KPI page showing total headcount, engineering share, and hiring pace as of Q2 2026.
    relatedQuestionRefs:
    - QO028
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology for TO004
    missingEvidence: An exhaustive internal timeline of financings, launches, incidents, and commercial partnerships through the run date.
    whyItMatters: The public chronology is strong enough for the main story but may omit smaller events that matter for sequencing customer adoption, reliability, or governance changes.
    diligencePath: Request the PR / investor timeline or board-history summary used internally to track launches, financings, and incidents.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO004
