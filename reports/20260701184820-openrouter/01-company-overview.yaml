- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance
  body: 'Leadership visibility is concentrated around Alex Atallah. BusinessWire, TechCrunch-adjacent coverage, and the filing mirror all support that he is CEO and co-founder, and the filing also puts him in a director seat. The harder question is founder completeness. The SaaS News identifies Louis Vichy as a co-founder, but that attribution is thinner than the Alex Atallah record and is not yet backed by a robust official founder page or a broad executive roster. Public governance visibility is likewise narrow. The mirrored Form D identifies Anjney Midha as a director, but the retained public sources do not provide a full board list, committee structure, observer rights, or the control provisions attached to current investors. That means the chapter can describe governance anchors but cannot quantify founder control with precision. The key-person-dependence story is still straightforward: Atallah appears to be the core public spokesperson for product vision, fundraising, and market narrative,
    while the absence of a broader public executive bench raises succession and scaling diligence questions that management should answer directly.'
