- id: capitalization-and-scale-signals
  title: Funding History, Capitalization, and Scale Signals
  body: 'The financing record is strongest on the latest round and weakest on exact lifetime totals. OpenRouter announced a $113M Series B led by CapitalG in late May 2026, and TechCrunch plus other startup press tied that round to an approximately $1.3B post-money valuation. The syndicate mixed classic venture firms with strategic platform investors, including NVentures, ServiceNow Ventures, MongoDB Ventures, Snowflake Ventures, and Databricks Ventures, which strengthens the message that OpenRouter wants to be embedded in enterprise AI infrastructure stacks. TechCrunch also reported a $40M Series A in June 2025 led by Andreessen Horowitz and Menlo Ventures with Sequoia participation. That supports at least $153M of publicly reported equity financing, but the exact lifetime total is still not cleanly reconcilable because a mirrored August 2025 Form D showed a larger $47.6M offering, $29.6M sold, and 30 investors. Without the underlying financing documents, investors cannot tell how much
    of that filing overlaps with the round later summarized in the press. Scale signals are much more legible: official materials repeatedly cite 25T weekly tokens, 100T monthly tokens, 8M-plus users, 400-plus models, and later site counters showing 10M-plus users and 70-plus providers. Those are company claims, not audited KPIs, but they establish that OpenRouter is already selling against very large usage volumes even while revenue and headcount remain undisclosed.'
