company:
  name: OpenRouter
chapter:
  number: 1
  title: Company Overview
  summary: 'OpenRouter is a 2023-founded, New York-addressed private AI infrastructure company that sells a unified routing and governance layer for multi-model inference. Public evidence strongly supports a $113M CapitalG-led Series B in May 2026 at roughly a $1.3B valuation, plus rapid product expansion into workspaces, guardrails, image APIs, and MCP tooling. The same public file also shows real governance and diligence limits: founder corroboration beyond Alex Atallah is thin, precise headcount and debt disclosure are absent, and February 2026 outages plus review-site complaints complicate the otherwise strong scale narrative.'
sections:
- id: identity-product-and-operating-model
  title: Identity, Product, and Operating Model
  body: 'OpenRouter presents itself as infrastructure rather than as a consumer app or a model lab. Across its homepage, quickstart documentation, investor copy, and enterprise marketing, the company consistently describes itself as the unified interface for LLMs or the AI model exchange: one API, one billing layer, and one routing fabric spanning hundreds of models and dozens of providers. That positioning matters because it explains both the customer promise and the business model. Customers are buying abstraction away from direct vendor lock-in, along with automatic failover, routing optimization, governance controls, and usage reporting. The enterprise layer now goes beyond basic routing. Workspaces, zero-data-retention controls, spend limits, provider allowlists, guardrails, and observability all show that OpenRouter wants to be the control plane for production AI traffic, not just a convenience wrapper for developers. The legal and operating footprint is clearer than the org chart:
    the public terms and mirrored Form D point to OpenRouter, Inc., a Delaware corporation with a New York address, while the careers page frames the workforce as a small remote-first team hiring across the United States. That combination suggests a still-lean company selling infrastructure at much larger usage scale than its public staffing footprint would imply.'
