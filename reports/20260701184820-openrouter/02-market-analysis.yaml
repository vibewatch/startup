  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-estimate
    missingEvidence: A public market study that isolates third-party managed multi-model routing SaaS revenue without folding in self-hosted gateways, hardware, or generic API management.
    whyItMatters: Current public estimates span from tens of millions to several billions because the category boundary moves. That forces SAM to remain inferred rather than directly sourced.
    diligencePath: Obtain paid category reports with methodology detail or interview analysts for a stripped-down routing-only segment cut.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: OpenRouter enterprise customer counts, ACV bands, expansion patterns, and billing concentration by segment or geography.
    whyItMatters: Buyer segmentation and SOM quality depend on whether spend is concentrated in hobbyist developers, startup teams, or enterprise platform accounts with meaningful contract budgets.
    diligencePath: Request cohort-level billing concentration, enterprise pipeline data, and customer-segment revenue splits from the company.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-segmentation
    missingEvidence: Public vertical-level breakdown of managed-router adoption versus self-hosted or cloud-native alternatives in regulated sectors.
    whyItMatters: Segment fit likely differs sharply between developer-led SaaS buyers and security-heavy enterprises, but public evidence remains anecdotal.
    diligencePath: Collect customer case studies or CRM segmentation by industry, deployment preference, and win-loss reason.
