chapter:
  number: 2
  title: Market Analysis
  summary: OpenRouter participates in a real but definition-sensitive market that spans narrow LLM middleware, broader AI API gateways, and even larger gateway-platform control planes. Demand is pulled by model proliferation, price dispersion, and governance needs, but the company’s realistic SAM is much smaller than the multibillion outer lenses because native clouds, enterprise AI gateways, and self-hosted stacks absorb a large share of governance-heavy demand.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'OpenRouter does not participate in the entire generative-AI software stack. Its closest market is the managed multi-model routing layer that sits between applications and external model providers, standardizes APIs, selects providers, applies fallbacks, and increasingly adds caching, analytics, and billing control. That boundary is broader than a simple model picker but narrower than a full enterprise AI control plane. Included spend therefore covers unified API access, provider routing, failover, caching, usage analytics, and consolidated billing across third-party models. Excluded spend includes training and model creation, GPU hardware, generic enterprise API programs unrelated to AI inference, and end-application AI revenue. The adjacency set matters because OpenRouter competes against several status quos: developers can call providers directly; platform teams can extend Cloudflare, Kong, or Azure API Management; cloud-native teams can stay inside AWS Bedrock or Microsoft Foundry;
    and self-hosted teams can run LiteLLM. That means OpenRouter’s real addressable market is the slice that values fast multi-provider access without taking on self-hosting or deep infrastructure ownership.'
