      label: Provider / Model Sprawl
      detail: Too many SDKs, prices, and failure modes to manage directly
    - id: router
      label: Unified Routing Layer
      detail: One API, fallback, caching, analytics, and model comparison
    - id: team
      label: Team-Level Standardization
      detail: Multiple apps or developers reuse the same access layer
    - id: budget
      label: Budget & Reliability Pressure
      detail: Token spend, quotas, and outage risk become visible
    - id: governance
      label: Central Governance Choice
      detail: Organization decides whether managed router suffices or a deeper gateway/self-hosted layer is needed
    - id: production
      label: Production AI Control Plane
      detail: Routing persists only if ROI outweighs governance and deployment constraints
