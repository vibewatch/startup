tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Primary Buyer / Payer
  - OpenRouter Relevance
  rows:
  - - Managed multi-model routing SaaS
    - Unified API access, model selection, fallback, caching, usage analytics, and unified billing for third-party models
    - Model training, foundation-model R&D, or dedicated GPU infrastructure
    - Developers first; later AI platform or platform engineering budget
    - Core addressable layer
  - - Enterprise AI gateway / control plane
    - Governance, RBAC, quotas, audit logs, guardrails, token policies, MCP or agent control
    - Pure model experimentation without organizational controls
    - Platform engineering, central AI platform, security, IT governance
    - Adjacent and often overlaps in enterprise accounts
  - - Cloud-native managed routers
    - Bedrock prompt routing, Foundry model router, cloud AI-service governance
    - Cross-cloud independence or provider-agnostic billing
    - Cloud platform leaders and cloud-native application teams
    - Major substitute that caps third-party penetration
  - - AI-enabled API management
    - Unified model endpoints, policy enforcement, token quotas, logging, load balancing, circuit breaking
    - Model training, frontier-model creation, or end-user AI applications
    - API platform, integration, or security teams
    - Strong substitute when AI sits inside an existing API estate
  - - Self-hosted open-source routing
    - Provider abstraction, routing logic, retries, load balancing, fallbacks, and cost controls on owned infrastructure
    - Managed SaaS convenience and outsourced operations
    - Platform engineering or developer infrastructure teams
    - Important substitute for regulated or cost-sensitive teams
  - - Excluded adjacent layers
    - End-application AI software, GPU hardware, inference chips, training clusters, and non-AI API programs
    - n/a
    - n/a
    - Outside OpenRouter-specific SAM
  notes: The boundary includes routing, failover, caching, observability, and billing-control spend around external model usage, but excludes model creation, hardware, and most non-AI API-management spend.
