  layout: standard
  summary: OpenRouter’s realistic market narrows from broad gateway and control-plane revenue to a much smaller managed-routing SaaS slice and then to an even smaller independently winnable pool.
  data:
    nodes:
    - id: tam
      label: 'TAM — Broad AI gateway / LLM gateway lenses: ~$0.85B-$4.23B (2026)'
      detail: Outer boundary spanning AI API gateway, LLM gateways, and gateway-platform estimates; still broader than OpenRouter because many studies include hardware, services, or on-prem control planes.
    - id: sam
      label: 'SAM — Managed multi-model routing SaaS: ~$0.20B-$1.00B (2026 est.)'
      detail: Evidence-constrained slice for third-party managed routing, caching, fallback, and observability without the full enterprise self-hosted gateway stack.
    - id: som
      label: 'SOM — Independent managed-router slice: ~$0.03B-$0.15B (near term est.)'
      detail: Portion plausibly available to vendors like OpenRouter after native clouds, API-gateway incumbents, and self-hosted platforms absorb governance-heavy demand.
