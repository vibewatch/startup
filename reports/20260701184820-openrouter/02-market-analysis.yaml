- id: FM003
  title: Buyer / Segment Map
  type: matrix
  layout: wide
  summary: Buyer fit depends less on model breadth alone and more on whether the organization prioritizes speed, governance depth, or deployment control.
  data:
    columns:
    - Primary buyer
    - Why OpenRouter fits
    - Main blocker
    - Expansion vector
    rows:
    - label: Startup product teams
      values:
      - CTO / engineering lead
      - Fastest route to many models through one API and billing layer
      - Limited budgets and eventual governance needs
      - Grow into internal standard once multiple apps share AI usage
    - label: Developer platform teams
      values:
      - Platform / dev infra lead
      - Reduces repeated provider-specific integration work across teams
      - May need deeper quotas, RBAC, or internal key management
      - Can graduate to central AI access layer for internal products
    - label: AI infrastructure teams
      values:
      - Director of AI platform
      - Helps benchmark models and optimize quality-versus-cost choices
      - May prefer self-hosted or cloud-native controls for policy reasons
      - Expansion into analytics, routing policies, and budget governance
    - label: Regulated enterprises
      values:
      - CIO / security / architecture
      - Useful for sandboxing and early experimentation
      - SaaS-only model and weaker governance than enterprise gateways
      - Often shifts toward VPC, self-hosted, or cloud-native alternatives
