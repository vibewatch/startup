- id: TM003
  title: Segment / Buyer Map
  columns:
  - Segment
  - Primary Buyer
  - Primary User
  - Payer / Budget Owner
  - Workflow
  - Adoption Trigger
  - Why OpenRouter Can Matter
  rows:
  - - Startup product team
    - CTO, engineering lead, or product lead
    - Application developers and AI engineers
    - Product engineering budget or founder-controlled spend
    - Rapid model testing, prompt iteration, and provider swapping
    - Need to ship AI features quickly without many provider integrations
    - Single API and unified billing compress time to first production experiment
  - - Developer platform / API team
    - Head of platform or developer infrastructure
    - Platform engineers and internal tool builders
    - Shared platform budget
    - Standardize access to models for multiple internal apps
    - Provider sprawl or repeated API integration work across teams
    - Gateway abstraction reduces duplicated integration and creates one internal access layer
  - - AI / ML infrastructure team
    - VP or director of AI platform
    - AI engineers, infra engineers, model-ops staff
    - Central AI platform budget
    - Route workloads by cost, latency, and reliability across providers
    - Token spend becomes material and model benchmarking becomes continuous
    - Routing, caching, and analytics can turn model choice into a measurable control loop
  - - Compliance-sensitive enterprise
    - CIO, security, or enterprise architecture lead
    - Platform, security, and governance teams
    - Central IT, security, and business-unit AI budgets
    - Apply policies, data residency, and audit requirements across AI traffic
    - Regulated data, data-zone boundaries, or strict identity controls
    - OpenRouter can help at the experimentation layer but often loses to self-hosted or enterprise gateways in this segment
  - - Agency / multi-tenant AI builder
    - Technical founder or delivery lead
    - Solution engineers and client-facing builders
    - Project or client-delivery budgets
    - Serve many customer prompts across different models and use cases
    - Need cost attribution, failover, and fast access to long-tail models
    - Managed routing and unified billing reduce operational overhead across many client workloads
  notes: Budget ownership usually starts with engineering but migrates toward platform and governance teams as AI usage becomes shared infrastructure and token spend needs quotas or chargeback.
