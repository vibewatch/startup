- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Model proliferation and provider churn
    - Positive
    - Now
    - More models and providers increase demand for a unified routing layer instead of provider-specific integrations
    - How quickly does OpenRouter add, delist, or re-rank providers versus customer needs?
  - - Inter-model price dispersion
    - Positive
    - Now
    - Large cost differences between acceptable models make routing and caching economically meaningful
    - What share of customer traffic uses automatic routing versus fixed-model calls?
  - - Outages, throttling, and failover needs
    - Positive
    - Now
    - Reliability requirements push teams toward fallback chains and multi-provider resilience
    - How often do enterprise buyers cite failover or rate-limit pain in wins?
  - - Governance, trust, and data residency requirements
    - Mixed
    - Now to mid-term
    - These requirements create demand for gateways, but often favor enterprise or self-hosted options over developer-first SaaS routers
    - What controls does OpenRouter actually deliver in enterprise contracts beyond EU routing and provider filters?
  - - Native cloud and API-gateway substitutes
    - Negative
    - Now
    - AWS, Microsoft, Cloudflare, Kong, and internal platform teams can absorb much of the same spend
    - What fraction of target customers already have a credible substitute embedded in their current stack?
  - - SaaS-only architecture and governance depth gaps
    - Negative
    - Now to mid-term
    - Regulated or centralized enterprises may reject managed routers without VPC deployment, full RBAC, or deep audit support
    - How many late-stage deals are lost on deployment-model or compliance grounds?
  notes: Growth is driven by model sprawl, price dispersion, and reliability needs, while adoption is constrained by governance depth, substitute strength, and deployment-model requirements.
