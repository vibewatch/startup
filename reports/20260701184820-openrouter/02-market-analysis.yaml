callouts:
- calloutType: insight
  title: OpenRouter’s best fit is the fast-moving middle of the market
  body: OpenRouter is strongest where buyers want immediate multi-model access, broad catalog breadth, and lighter operational burden. It is weakest where the evaluation shifts from model breadth to enterprise deployment control, deep RBAC, and compliance enforcement.
  claimRefs:
  - CM033
  - CM034
  - CM037
  - CM041
- calloutType: risk
  title: The biggest market risk is substitute sufficiency, not category creation
  body: The category is real and growing, but the hardest question is how much of that growth will be captured by independent managed routers versus cloud-native routing, incumbent API gateways, and self-hosted open-source stacks.
  claimRefs:
  - CM025
  - CM027
  - CM028
  - CM030
  - CM046
