- id: sizing-lenses-and-constrained-sam
  title: TAM/SAM/SOM Lenses and Preserved Contradictions
  body: 'Public market sizing for OpenRouter’s category is highly definition-sensitive. The narrowest lens is Intel Market Research’s LLM middleware gateway market, which implies only $18.9M of 2026 revenue for multi-model middleware. Broader lenses rise fast: Intel’s AI API gateway market reaches $0.85B in 2026; The Business Research Company sizes LLM gateways at $2.76B in 2026 and its broader LLM gateway platform market at $4.23B in 2026; Research and Markets shows a still-broader AI gateway lens already at $3.66B in 2025. These estimates should not be averaged away. They are measuring different boundaries, and one TBRC page even preserves an internal inconsistency by calling the same $11.01B forecast a 2030 outcome in the overview and a 2035 forecast in the report-attribute box. The practical conclusion is that OpenRouter’s true serviceable market is not the whole gateway or AI middleware universe. A more evidence-constrained 2026 SAM is a low-hundreds-of-millions slice for managed multi-model
    routing SaaS, with a smaller near-term SOM after deducting demand captured by native clouds, enterprise gateways, and self-hosted stacks.'
