  - CU025
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU037
- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction risk
  - Impact
  - Diligence path
  rows:
  - - Self-serve developers can become team accounts through workspaces, shared billing, and budgets
    - No public conversion data from free or startup accounts into durable enterprise contracts
    - Growth may be broad but lower quality than token-volume headlines imply
    - Request cohort conversion from first credit purchase to multi-workspace organization adoption
  - - Embedded tooling such as Roo Code, OpenHands, Aider, and LiteLLM expands distribution
    - Channel concentration or dependency on coding-agent ecosystems is undisclosed
    - A change in a few major tools or frameworks could slow net-new demand and usage quality
    - Request GMV and revenue mix by top embedded partners and product channels
  - - Enterprise controls such as budgets, privacy settings, service tiers, and analytics create upsell surfaces
    - Budgets are Enterprise-plan only and SLA terms are negotiated rather than broadly published
    - Larger buyers may demand controls or support commitments before scaling spend
    - Request enterprise package attach rates, SLA templates, and procurement win-loss reasons
  - - BYOK keeps customers on OpenRouter’s control plane even when they hold provider relationships directly
    - BYOK can cap OpenRouter capture and make revenue concentration harder to read from top-line usage alone
    - GMV or token growth may overstate net revenue quality if more volume is routed on customer-owned keys
    - Request BYOK volume share, fee take rate, and BYOK retention relative to non-BYOK accounts
  - - Public rankings and app surfaces strengthen discovery and credibility
    - Discovery surfaces do not reveal whether any one vertical, partner, or account dominates spend
    - Investors may confuse ecosystem attention with diversified customer economics
    - Request top-vertical and top-geography revenue mix alongside active-organization counts
  - - Official outage transparency and review visibility can build trust when handled well
    - Support delays, security concerns, and outage confusion can raise churn or block regulated buyers
    - Production buyers may pause expansion until support ownership and incident posture improve
    - Request support SLA attainment, incident postmortem cadence, and churn linked to support or reliability events
  notes: Rows pair plausible land-and-expand drivers with the specific public-data holes that keep concentration and durability from being fully underwritten.
