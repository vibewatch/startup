tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Geography / vertical
  - Typical use case
  - Evidence and scale signal
  - Gap / implication
  rows:
  - - Individual developers and solo builders
    - Buyer=user=payer in self-serve motion
    - Global; software-heavy public proof
    - Quick model comparison, prompt experiments, free-model usage, one-key access
    - Series B post cites 8M+ developers; Aider and Stripe Projects emphasize fast setup and free-plan experimentation
    - Strong top of funnel, but public evidence does not show how many convert into paid long-lived accounts
  - - Startup product and AI teams
    - Engineering lead or founder buys; developers use; company card or credits pay
    - AI-native startups are explicitly named; public geography detail is thin
    - Embed multi-model inference into a product without integrating many providers
    - Business Wire says OpenRouter is used by AI-native startups; TrueFoundry says this stage values fast model switching and reduced key-management overhead
    - Startup demand is real, but revenue-band visibility is absent
  - - Embedded tooling vendors and frameworks
    - Platform maintainer or product team buys; end users consume through the tool; end customer or vendor may pay
    - Developer-tool vertical; coding and agent ecosystems dominate named proof
    - Route LLM traffic for coding agents, middleware, IDEs, and open-source frameworks
    - Roo Code, OpenHands, Aider, and LiteLLM all document first-class OpenRouter support
    - This is high-signal adoption proof, but it can also create channel dependence
  - - Multi-team organizations
    - Engineering, platform, or AI operations lead buys; multiple teams use; central billing pays
    - Cross-team internal AI deployments; specific vertical mix undisclosed
    - Separate teams, projects, and deployment stages under one account with common governance
    - Workspaces docs add org roles, shared billing, user analytics, and workspace controls
    - Shows path to expansion, but not how many organizations actually use it
  - - Enterprise or regulated buyers
    - Procurement, platform, or security buyer pays; operators and app teams use
    - Large enterprises are named broadly; sector-level monetized mix is not public
    - Governed production inference with spend visibility, privacy controls, and negotiated support
    - Business Wire and CapitalG emphasize large-enterprise use, routing permissions, and audit-friendly reporting
    - Public SLA, renewal, and concentration detail remains too thin for full underwriting
  - - BYOK power users and procurement-constrained teams
    - Developer or team lead buys direct provider capacity; organization pays provider bill plus OpenRouter fee
    - Coding tools, image apps, and multi-provider experimentation
    - Keep direct provider relationship while still using OpenRouter as the routing layer
    - Sacra describes BYOK use in Cline, Aider, and Fal.ai; Roo Code documents the BYOK pricing treatment
    - Useful for adoption, but it can limit OpenRouter capture if end customers keep upstream leverage
  notes: Rows separate the self-serve, embedded-channel, and organizational motions that public sources support; geography and vertical mix remain broad rather than numerically disclosed.
