- id: customer-verdict-and-evidence-gaps
  title: Customer Verdict and Evidence Gaps
  body: 'The customer verdict is constructive but qualified. OpenRouter clearly has real demand, and that demand is not hypothetical: independent press, the company’s own disclosures, Sacra’s earlier estimates, and third-party developer-tool docs all point to a platform that has become an important routing layer for multi-model AI usage. The best-supported segments today are developers, startup product teams, and coding-agent ecosystems that value fast model access and vendor portability. The least-supported part of the file is direct proof of durable, high-value enterprise customers. Public evidence shows that enterprise-oriented controls exist and that the company is trying to move upmarket, but it does not reveal how many paying organizations have made that transition, how concentrated revenue is, or whether renewals justify the infrastructure narrative. In other words, direct customer proof is thinner than funding and usage signaling. That is not a fatal flaw for the chapter, but it
    is a genuine diligence gap. The next diligence step should be a management data request, not another web search: active organizations by spend band, direct versus channel mix, top-customer concentration, contract archetypes, and cohort retention are the missing pieces that would turn a strong demand story into a fully underwritable customer-quality story.'
