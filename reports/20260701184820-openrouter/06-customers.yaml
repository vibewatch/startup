figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Shows how OpenRouter’s public motion runs from self-serve experimentation into embedded tooling and then into multi-team governance rather than through a classic top-down enterprise sale.
  data:
    items:
    - label: Discover and test models
      note: Individual developers or startup teams arrive through docs, rankings, or Stripe Projects and value one API, free-model access, and fast setup.
    - label: Embed in a tool or workflow
      note: Coding agents, middleware, and app builders adopt OpenRouter as the routing layer inside their own product or workflow.
    - label: Standardize access inside one account
      note: Workspaces, unified billing, and organization roles create a common control plane once multiple projects or teams are involved.
    - label: Govern production usage
      note: Budgets, service tiers, activity analytics, and privacy controls become more important when spend, compliance, and support expectations rise.
    - label: Expand or stall
      note: Accounts can expand into multi-team or regulated use, but support quality, SLA negotiation, and workflow-level cost control become gating factors.
  claimRefs:
