company:
  name: OpenRouter
chapter:
  number: 6
  title: Customers
  summary: OpenRouter shows unusually strong usage growth and real ecosystem embedment, but direct enterprise customer proof is thinner than the funding and token-volume narrative. Public evidence supports a self-serve-to-organization motion centered on developers, startup teams, and coding-agent toolchains, while retention, concentration, and contract durability remain materially under-disclosed.
sections:
- id: customer-segmentation-and-buying-centers
  title: Customer Segmentation, Buying Centers, and Core Workloads
  body: 'OpenRouter’s customer story begins with developers, but the public file shows at least four distinct economic motions underneath that headline. Official materials repeatedly describe one API for developers and enterprises, while the workspace and Stripe Projects documentation fill in how buyer, user, and payer roles separate as usage matures. Individual builders and startup teams appear to be the easiest top-of-funnel segment: they can provision access quickly, compare many models, and avoid managing multiple provider SDKs or keys. The next segment is embedded tooling—coding agents and middleware vendors such as Roo Code, OpenHands, Aider, and LiteLLM that explicitly document OpenRouter support. Those tools are important because they function as both customers and channels, pulling OpenRouter into coding workflows without a traditional procurement cycle. Above that sits the organizational buyer. Workspaces, user activity analytics, privacy settings, service tiers, and workspace
    budgets all indicate that OpenRouter is trying to convert the original self-serve motion into multi-team governance and spend management. The public evidence is much thinner on region and vertical mix than on product form factors: the clearest geography signal is simply “global users,” while the clearest vertical signal is the concentration of public proof in software, agent tooling, and other AI-native workloads. That means the chapter can map buyer, user, and payer segmentation with confidence, but it cannot yet quantify monetized demand by geography or industry.'
