- id: adoption-trajectory-and-named-proof
  title: Adoption Trajectory and Named Customer Proof
  body: 'The strongest public evidence for OpenRouter customers is breadth of usage growth, not a long list of enterprise case studies. Official and third-party Series B materials line up cleanly around the core trajectory: weekly traffic rose from 5 trillion to 25 trillion tokens in six months, monthly volume hit about 100 trillion tokens, and the platform claimed more than 8 million users or developers across 400-plus models. Sacra’s 2025 work gives a useful earlier anchor by estimating a jump from roughly $19 million annualized spend and $1 million annualized revenue at end-2024 to about $100 million annualized GMV and $5 million annualized revenue by May 2025. That is real adoption momentum. The thinner part of the file is named proof. Public, direct customer evidence is dominated by developer-tool documentation rather than classic enterprise reference accounts. Roo Code, OpenHands, Aider, and LiteLLM all maintain explicit OpenRouter integration pages; Product Hunt’s archived reviews
    add named maker testimonials from involve.me, Clado, and Agents Base. Those are credible proof points that OpenRouter is genuinely embedded in active workflows, especially coding and agentic ones, and that at least some customers are beyond a toy experiment. But they are still not the same thing as a disclosed Fortune 500 production deployment with renewal history and contractual economics. The right interpretation is that OpenRouter has abundant usage signaling and decent named developer-tool proof, while direct enterprise customer proof remains thinner than the financing narrative.'
