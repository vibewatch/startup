callouts:
- calloutType: strength
  title: Strong ecosystem embedment in coding and agent workflows
  body: The most defensible customer proof is not a traditional Fortune 500 case-study set but a dense web of third-party tool integrations. Roo Code, OpenHands, Aider, LiteLLM, Stripe Projects, and Product Hunt maker reviews all point to OpenRouter as a real routing layer in active developer workflows. That breadth matters because it shows the product is not only marketed; it is wired into tools other builders ship and use.
  claimRefs:
  - CU021
  - CU023
  - CU024
  - CU026
  - CU028
  - CU041
  - CU044
- calloutType: risk
  title: Retention and concentration remain the core customer diligence gaps
  body: OpenRouter’s public demand signals are much stronger than its disclosed customer-quality metrics. There is no public NRR, GRR, churn, contract-term, or concentration disclosure, and most named proof is indirect. Until management provides cohort retention, top-customer exposure, and channel mix, investors cannot tell whether token growth reflects diversified durable accounts or a more concentrated, tool-driven demand base.
  claimRefs:
  - CU030
  - CU045
  - CU046
  - CU048
- calloutType: insight
  title: The upmarket thesis depends on turning convenience into governance
  body: OpenRouter has already built many of the features needed for upmarket expansion—workspaces, budgets, service tiers, analytics, privacy controls, and negotiated enterprise support. The open question is not whether the product can add governance surfaces; it is whether those surfaces are strong enough to retain and expand production buyers once support, SLA, security, and spend-control requirements become binding.
  claimRefs:
  - CU020
  - CU031
  - CU035
  - CU036
  - CU039
  - CU040
  - CU047
