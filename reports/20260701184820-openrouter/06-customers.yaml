- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Value / public proxy
  - Segment
  - Confidence
  - Implication
  - Diligence ask
  rows:
  - - Net revenue retention
    - 'null'
    - All paying cohorts
    - Low
    - No public NRR means expansion quality is unverified
    - Request NRR by direct enterprise, startup, and embedded-channel cohort
  - - Gross retention / logo churn
    - 'null'
    - All paying cohorts
    - Low
    - No disclosed churn means the business could still be high-volume but shallow
    - Request GRR, logo retention, and lost-logo reasons by quarter
  - - Average contract length / renewal cadence
    - 'null'
    - Enterprise accounts
    - Low
    - Contract durability cannot be inferred from funding or token volume alone
    - Request standard MSA, order form, contract term, and renewal calendar
  - - Repeat-usage instrumentation
    - 30-day user activity grouped by endpoint plus unified workspace billing
    - Organization accounts
    - Medium
    - OpenRouter tracks behavior that could support customer-success and spend reviews
    - Ask management to publish or share cohort rollups from these internal systems
  - - Public satisfaction split
    - Product Hunt archived reviews show 5.0/5 on 86 reviews, while TrueFoundry reports a May 2026 Trustpilot snapshot of 1.7/5 on 41 reviews
    - Builder and production-review surfaces
    - Medium
    - The product appears well-liked in maker circles and much weaker in support-heavy production contexts
    - Request NPS/CSAT by segment plus ticket response-time data
  - - Free-tier repeat-use friction
    - 20 req/min and daily caps for free-model use; agentic or batch workloads can still hit 429s or overspend without workflow stops
    - Experimentation and lower-spend users
    - Medium
    - Free-to-paid conversion may be helped by convenience but hurt by quota friction or spend surprises
    - Request conversion, abuse, and rate-limit incidence for free and low-credit cohorts
  notes: Null means the public record did not disclose the metric. The table intentionally separates hard retention metrics from observable usage or satisfaction proxies.
  claimRefs:
