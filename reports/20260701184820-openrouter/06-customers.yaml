  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof coverage
    missingEvidence: A fuller register of paying organizations, reference accounts, and whether each deployment is self-serve, pilot, or contracted enterprise.
    whyItMatters: Public customer proof is concentrated in developer-tool docs, archived Product Hunt reviews, and company-controlled ecosystem surfaces, which is enough to show adoption but not enough to enumerate the installed base.
    diligencePath: Request a current customer list segmented by direct accounts, embedded-tool partners, and referenceable enterprise logos; then reconcile it against billing cohorts and active-organization counts.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention and contract durability
    missingEvidence: NRR, GRR, logo churn, contract term, renewal timing, and expansion by cohort or segment.
    whyItMatters: Without renewal data, it is hard to separate a sticky infrastructure layer from a high-volume but shallow experimentation tool.
    diligencePath: Ask management for cohort retention by signup quarter, contract archetypes by segment, renewal calendar, and any customer-success scorecards.
    relatedQuestionRefs:
    - QU021
  - type: missing-source
    severity: material
    topic: customer concentration and channel mix
    missingEvidence: Top-customer exposure, revenue mix by embedded partner versus direct accounts, and any concentration to coding-agent channels.
    whyItMatters: Channel concentration or a few large API accounts could change the durability and valuation of OpenRouter’s growth.
    diligencePath: Request the top-10 customers by revenue, partner-sourced share of GMV and revenue, and exposure to individual coding-agent ecosystems.
    relatedQuestionRefs:
    - QU019
    - QU024
  - type: missing-source
    severity: minor
    topic: geography and vertical revenue segmentation
    missingEvidence: Paid-customer breakdown by geography, vertical, company size, and revenue band rather than broad global-user language.
    whyItMatters: The public file supports global and cross-vertical intent, but not the mix of monetized demand by region or sector.
    diligencePath: Request an active-customer segmentation export from CRM or billing data that tags geography, vertical, seat or org count, and annualized spend band.
    relatedQuestionRefs:
    - QU024
