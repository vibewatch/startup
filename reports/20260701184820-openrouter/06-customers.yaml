- id: TU003
  title: Named customer proof table
  columns:
  - Named customer / tool
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome or evidence
  - Limitation
  rows:
  - - Roo Code
    - Coding agent / IDE extension
    - Official provider integration with API key setup, 100+ models, BYOK, and prompt-caching guidance
    - Production-supported integration
    - Roo Code maintains a dedicated OpenRouter guide and automatically fetches model choices from OpenRouter
    - Public docs show supported use, not contract size or whether Roo Code is a paid enterprise account
  - - OpenHands
    - Cloud coding agent / developer platform
    - LLM provider option inside OpenHands with explicit OpenRouter setup and recommended model strings
    - Production-supported integration
    - OpenHands documents OpenRouter as an authoritative provider reference for the Agent SDK and interfaces
    - Docs prove active support, but not spend, contract terms, or customer retention
  - - Aider
    - CLI coding agent
    - Command-line model routing through `openrouter/<provider>/<model>` strings
    - Production-supported integration
    - Aider says many users access Sonnet through OpenRouter and highlights free-model access via OpenRouter
    - Evidence is community and docs based rather than a public enterprise case study
  - - LiteLLM
    - Gateway / middleware vendor
    - OpenRouter listed as a first-class provider for production environment-variable configuration and multi-modal calls
    - Production-supported integration
    - LiteLLM treats OpenRouter as a real provider option across text, vision, and embedding use cases
    - This proves ecosystem embedment more than end-customer economics
  - - involve.me maker community
    - Builder / product team
    - Product Hunt maker review summarised OpenRouter as useful for multi-model testing and cost-quality optimization
    - Public testimonial
    - Named maker praise appears in Product Hunt review summary
    - Review summary is secondary, archived, and does not disclose paid depth
  - - Clado and Agents Base makers
    - Builder / agent product teams
    - Product Hunt review summary credits OpenRouter with reliable LLM traffic handling and quick adoption of newer options
    - Public testimonial
    - Multiple named makers appear in the same review corpus, showing non-company advocacy
    - Maker reviews are not the same as disclosed production contracts
  notes: This is a partial enumeration of named public customer proof retained for the chapter. It captures the strongest named integrations and testimonials visible on 2026-07-01, not the full installed base.
  enumerationScope:
    coverage: partial
    basis: Covers named public customer or integration evidence retained from third-party developer docs and archived Product Hunt review summaries as of 2026-07-01; excludes undisclosed self-serve accounts and private enterprise references.
