- id: TU002
  title: Customer growth / adoption trajectory table
  columns:
  - Metric
  - Value / evidence
  - Date
  - Source quality
  - Implication
  - Missing denominator
  rows:
  - - Annualized spend proxy
    - ~$19M annualized spend
    - 2024-12
    - Sacra estimate
    - Shows meaningful monetized usage existed before the 2025–2026 funding cycle
    - Not a disclosed GMV or revenue line from the company
  - - Annualized revenue proxy
    - ~$1M annualized revenue
    - 2024-12
    - Sacra estimate
    - Suggests OpenRouter had already found a take-rate business model by late 2024
    - No audited revenue or gross-margin disclosure
  - - Annualized GMV proxy
    - ~$100M annualized GMV
    - 2025-05
    - Sacra estimate
    - Indicates fast adoption among developers and embedded tools before the Series B
    - GMV does not reveal customer count or concentration
  - - Annualized revenue proxy
    - ~$5M annualized revenue
    - 2025-05
    - Sacra estimate
    - Implied monetization rose quickly alongside usage
    - Still no company-confirmed ARR or GAAP revenue
  - - Weekly token volume
    - 5T to 25T weekly tokens in six months
    - 2025-11 to 2026-05
    - Official plus independent press
    - Clear sign that adoption accelerated into 2026 and that workloads are becoming more production-like
    - Token volume does not equal distinct paying organizations
  - - User and model breadth
    - 8M+ users or developers and 400+ models; ~100T monthly tokens
    - 2026-05
    - Official plus independent press
    - Supports broad platform relevance across many model providers
    - User total is not segmented into free, paid, enterprise, or active organizations
  - - Operational expansion surfaces
    - Workspaces, per-workspace budgets, 30-day activity analytics, service tiers, and Stripe provisioning
    - '2026-07-01'
    - Official docs
    - Shows the product is instrumented for multi-team expansion, not only self-serve trials
    - Feature availability is not the same as disclosed customer penetration
  - - Ecosystem discovery surfaces
    - Public app/agent and LLM rankings
    - '2026-07-01'
    - Official site surfaces
    - Suggests sustained enough external activity to justify public rankings and discovery features
    - Rankings do not disclose revenue or renewal quality
  notes: The trajectory mixes disclosed operating metrics with clearly labeled Sacra estimates and platform-surface proxies because OpenRouter does not publish customer-count, ARR, or paying-organization cohorts.
