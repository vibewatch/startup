  rows:
  - - Annualized revenue / GMV proxy
    - $5M annualized revenue on $100M GMV in May 2025 (Sacra estimate)
    - Medium
    - Only public revenue-like datapoint for monetization efficiency
    - Provide current ARR, GAAP revenue, and provider passthrough split
  - - Platform fee monetization
    - 5.5% non-crypto top-up fee with $0.80 minimum; 5.0% crypto
    - High
    - Shows part of the take rate even if token prices are passthrough
    - Break out fee revenue versus usage-driven revenue
  - - BYOK monetization
    - 1M requests/month free, then 5% fee
    - High
    - Shows how OpenRouter can monetize traffic even when providers bill the compute
    - Provide BYOK request counts, overage incidence, and gross profit
  - - Public traction proxy
    - 8M+ users/developers, 400+ models, and 25T weekly tokens
    - High
    - Suggests top-of-funnel scale and usage density
    - Segment users into paying accounts, organizations, and enterprise logos
  - - Low-balance operating threshold
    - $10-20 recommended balance to avoid extra credit checks and latency
    - Medium
    - Implies wallet economics and that tiny balances raise service cost
    - Show share of accounts that top up infrequently or churn after small tests
  - - CAC / payback / NRR / ACV
    - null
    - Low
    - Core sales-efficiency metrics are absent from the public file
    - Provide CAC payback, ACV by segment, gross retention, and NRR
  - - Gross margin
    - null
    - Low
    - Needed to judge whether OpenRouter behaves like SaaS, payments, or lower-margin brokerage
    - Provide gross margin net of provider payouts, support, and free-tier subsidy
  notes: Nulls indicate genuine disclosure gaps. The usable public proxies emphasize adoption and fee rules far more than realized software economics.
