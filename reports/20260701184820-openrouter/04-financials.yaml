- id: TI004
  title: Capital Adequacy Table
  columns:
  - Capital item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2026 Series B
    - $113M announced in May 2026
    - High
    - Large fresh equity supports continued infrastructure and enterprise investment
    - Confirm cash proceeds net of fees and closing conditions
  - - Post-money valuation signal
    - ~$1.3B reported by TechCrunch citing NYT reporting
    - Medium
    - Frames how much financing headroom investors appear to be underwriting
    - Provide board-approved post-money and fully diluted ownership
  - - Planned use of funds
    - Infrastructure scaling, enterprise capabilities, routing, governance, and optimization
    - High
    - Indicates that reliability and enterprise tooling will remain spend priorities
    - Provide 12-24 month spend plan by product, infra, and GTM
  - - Visible SEC exempt-offering disclosure
    - 2025 Form D shows $47.6M offered, $29.6M sold, first sale May 27 2025, 30 investors
    - High
    - Shows one historical financing event but not the current round’s full economics
    - Reconcile the Form D trail with the broader private funding chronology
  - - Cash on hand
    - null
    - Low
    - Without cash balance, capital adequacy cannot be translated into runway
    - Provide ending cash and restricted cash as of the latest month-end
  - - Net burn
    - null
    - Low
    - Burn converts fundraising into survival time and determines next-round urgency
    - Provide monthly net burn and burn drivers after reliability and enterprise hiring
  - - Runway months
    - null
    - Low
    - Critical for assessing financing dependency in a fast-growing infra business
    - Provide base, downside, and stretch runway scenarios
  - - Debt or other financing obligations
    - null
    - Low
    - Venture debt, cloud commitments, or reserved capacity can change risk materially
    - Confirm whether any debt, minimum cloud commits, or capacity-prepurchase obligations exist
  notes: Public financing support is strong, but cash, burn, debt, and runway remain wholly undisclosed, which is the main reason adequacy cannot move from directional to underwritten.
