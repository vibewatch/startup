tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Prepaid routed inference
    - Customers pre-buy credits and spend them on non-BYOK requests that OpenRouter routes across providers
    - Usage-funded credits
    - Clearly active and central, but public sources do not say whether revenue is recorded gross or net of provider cost
    - Medium
    - Provide revenue-recognition policy and gross-versus-net presentation by product line
  - - Credit-purchase platform fees
    - OpenRouter retains fee revenue when users top up credits
    - '% of deposit value'
    - Officially 5.5% non-crypto with $0.80 minimum; 5.0% flat for crypto
    - High
    - Show fee revenue as a share of total recognized revenue
  - - BYOK overage fees
    - OpenRouter monetizes customer-owned provider traffic after the free threshold
    - '% of equivalent request value'
    - First 1M requests/month free; standard 5% beyond that
    - High
    - Break out BYOK request volume, overage penetration, and realized take rate
  - - Enterprise controls / support
    - Larger accounts buy governance, workspaces, budgets, analytics, and negotiated support around the routing layer
    - Contract / subscription / service
    - Product surface is visible, but pricing and attach rates are undisclosed
    - Low
    - Provide enterprise package structure, ACV bands, and support obligations
  - - Free tier as acquisition funnel
    - OpenRouter subsidizes some free-model access to attract developers before conversion
    - Non-revenue acquisition spend
    - Officially active and company-funded in at least some cases
    - Medium
    - Quantify free-to-paid conversion and subsidy cost per activated account
  - - Potential partner / embedded channel usage
    - Stripe Projects and partner distribution can originate usage without separate direct sales
    - Embedded usage
    - Visible in docs, but contribution to bookings is unknown
    - Low
    - Break out how much volume originates from embedded or partner-led flows
  notes: Rows distinguish true revenue streams from acquisition or channel mechanics; public evidence shows the layers exist but not their percentage mix.
