- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The financial verdict is positive on demand and funding, but still medium-confidence on the underlying unit economics. OpenRouter clearly has real market pull: rapid token growth, multi-provider relevance, and enough investor demand to close a large strategic Series B. The product also has several monetization levers—credit-purchase fees, BYOK overages, enterprise controls, and potential premium support—that could compound as usage scales. The problem is that none of the key underwriting outputs are public. There is no disclosed ARR, no public revenue mix between self-serve and enterprise, no provider-cost pass-through breakdown, no gross margin, no burn, no runway, no customer concentration disclosure, and no retention data. Adverse evidence matters too. Official outage writeups and independent reviews show that support quality, reliability engineering, and governance gaps can directly affect revenue quality once production workloads move beyond experimentation. That does not make
    OpenRouter unattractive; it means the next diligence step is not another press release. It is a management data request. Before underwriting the business as durable infrastructure rather than a fast-growing broker layer, an investor should demand the revenue-recognition memo, current P&L, burn and cash plan, enterprise contract archetypes, cohort retention, top-customer exposure, and the economics of keeping free models online. Until then, OpenRouter looks financially promising but not yet fully transparent.'
