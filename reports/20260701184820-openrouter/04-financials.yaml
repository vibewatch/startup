- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR / recognized revenue growth
    - Blocks valuation-multiple, payback, and growth-efficiency underwriting
    - Request monthly recurring and non-recurring revenue bridge plus trailing-12-month recognized revenue
  - - Gross vs net revenue recognition policy
    - Unclear whether credit sales, provider passthrough, and wallet balances overstate economic revenue
    - Request accounting memo and auditor view on principal-versus-agent treatment and deferred revenue
  - - Gross margin and provider COGS
    - Prevents judgment on whether the model behaves like high-margin SaaS or thinner broker economics
    - Request gross margin by revenue stream and provider-payout share
  - - Cash, burn, and runway
    - Makes capital adequacy incomplete despite a large Series B
    - Request latest cash balance, burn trend, and 24-month operating plan
  - - Enterprise contract mix and realized pricing
    - Without contract archetypes, enterprise value capture cannot be separated from self-serve fees
    - Review recent enterprise orders, minimum commits, discounting, and support obligations
  - - NRR / churn / cohort expansion
    - Needed to test whether workspaces and governance features actually drive durable expansion
    - Request cohort retention table and upsell/downgrade waterfall
  - - Customer concentration
    - A routing layer can look broad while still depending on a handful of heavy spenders
    - Request top-10 customer revenue share and spend concentration by provider or model family
  - - Free-tier subsidy economics
    - Free-model support may boost acquisition but can also consume margin if conversion is weak
    - Request subsidy spend, free-to-paid conversion, and payback by acquired cohort
  notes: These are the minimum missing fields required to move OpenRouter from a strong-demand story to a financeable operating model.
