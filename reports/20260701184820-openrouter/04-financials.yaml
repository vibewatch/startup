  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-recognition
    missingEvidence: Management accounting policy explaining gross-versus-net treatment for prepaid credits, provider passthrough, and unconsumed balances.
    whyItMatters: Without it, public token volume and credit purchases cannot be translated into recognized revenue or gross profit with confidence.
    diligencePath: Request the revenue-recognition memo, auditor position, and month-end deferred-revenue rollforward.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-runway
    missingEvidence: Current cash balance, monthly burn, runway, debt, and minimum cloud or provider commitments.
    whyItMatters: A $113M raise is directionally strong, but financing adequacy cannot be judged without the company’s current cash-consumption profile.
    diligencePath: Request the latest cash dashboard, board deck, 24-month operating plan, and any debt or capacity-commitment schedules.
    relatedQuestionRefs:
    - QI017
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Provider payout ratio, gross margin by revenue stream, free-tier subsidy cost, and support or reliability cost burden.
    whyItMatters: These inputs determine whether OpenRouter behaves like high-margin infrastructure SaaS or a thinner broker-like gateway.
    diligencePath: Request contribution-margin reporting by pay-as-you-go, BYOK, and enterprise workloads plus the cost of supporting free models.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: underwriting-metrics
    missingEvidence: ARR, revenue growth, enterprise contract mix, ACV, NRR, churn, and customer concentration.
    whyItMatters: Demand and usage volume do not prove durable recurring revenue quality without cohort and concentration data.
    diligencePath: Request KPI packs, top-customer exposure tables, cohort retention views, and representative enterprise order forms.
    relatedQuestionRefs:
    - QI023
    - QI027
    relatedTableRefs:
    - TI005
