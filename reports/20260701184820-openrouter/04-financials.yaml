- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Source / plan signal
  - Price / unit / contract
  - List vs realized
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Official platform-fee announcement
    - 5.5% of non-crypto top-up with $0.80 minimum
    - List rule
    - Credit purchase and wallet funding
    - No realized blend by customer size
    - Revenue is partly payment-layer economics, not just token resale
  - - Official platform-fee announcement
    - 5.0% flat on crypto top-ups
    - List rule
    - Credit purchase and wallet funding
    - Crypto share undisclosed
    - Could modestly improve contribution margin on larger crypto-funded accounts
  - - Official BYOK announcement
    - First 1M BYOK requests/month free, then 5% fee
    - List rule
    - Customer-owned provider keys routed through OpenRouter
    - Actual request mix and overage incidence undisclosed
    - BYOK can widen adoption while still monetizing scaled usage
  - - Official service tiers
    - Flex tier can be 50% cheaper than default in exchange for higher latency/lower availability
    - Usage rule
    - Routing tier selection and served-tier billing
    - Realized tier mix undisclosed
    - Average revenue per token depends on tier selection, not only model choice
  - - Independent plan summaries
    - Free tier at 20 req/min with higher daily limits after $10 credits; pay-as-you-go with 300+ models
    - List signal
    - Experimentation and paid model access
    - Derived from third-party plan review, not a structured official rate card
    - Supports a low-friction PLG motion but does not reveal paid conversion
  - - Enterprise offer
    - Custom pricing for support, governance, and SLA-oriented needs
    - Negotiated
    - Workspaces, access controls, and larger-account support
    - No public rate card or minimum commitment
    - Enterprise monetization likely exists but cannot be modeled from public evidence
  notes: Public pricing is mostly fee rules and qualitative plan descriptions; realized price, discounts, and enterprise contract structure are not disclosed.
