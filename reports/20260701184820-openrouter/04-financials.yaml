- id: gtm-motion-and-sales-efficiency-proxies
  title: GTM Motion, Public Traction, and Sales Efficiency Proxies
  body: 'The go-to-market motion looks product-led at acquisition and progressively more enterprise-led on expansion. OpenRouter’s official and partner materials emphasize a single API key, OpenAI-compatible endpoint, spend visibility, routing permissions, guardrails, workspaces, and analytics, all of which reduce initial integration friction and make the product easy to test before procurement. The public traction story is strong on breadth: OpenRouter says it serves more than 8 million users or developers across 400-plus models and expanded weekly token volume from 5 trillion to 25 trillion in six months. Stripe Projects and the free tier reinforce that the funnel begins self-serve. Workspaces, analytics, user-activity endpoints, and budget APIs indicate a progression into multi-team or organization use, which is the closest public proxy to expansion revenue. What remains missing is the actual efficiency math. There is no public CAC, average contract value, win rate, net retention, or
    payback disclosure. The user count is also not segmented into paying customers, enterprise organizations, or merely registered developers. Independent review sources further suggest that free-tier caps, support responsiveness, and governance gaps can become conversion friction once autonomous agents or production workloads scale. The right interpretation is that OpenRouter’s top-of-funnel is unusually strong, but the quality of monetized cohorts remains opaque.'
