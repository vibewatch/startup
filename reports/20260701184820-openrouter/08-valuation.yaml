- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Revenue / quality assumption
  - Multiple / reference
  - Implied value range ($M)
  - Gross outcome vs $1.3B
  - Probability signal / downside trigger
  rows:
  - - Bull
    - Current run-rate revenue already >$75M, enterprise retention is strong, and margins look more like premium infrastructure software than brokerage.
    - 18x-25x revenue, closer to Snowflake / Datadog / premium AI infra ranges.
    - 1,350-2,750
    - ~1.0x-2.1x
    - Requires private data showing that usage growth converted into high-quality recurring revenue quickly.
  - - Base
    - Revenue is material but still broker-like, with improving enterprise mix yet incomplete proof on margin and retention.
    - 12x-18x revenue, below premium software but above mature infra.
    - 540-1,260
    - ~0.4x-1.0x
    - Best fit if management can show real growth but not yet premium-software economics.
  - - Bear
    - Revenue remains relatively modest, take-rate economics stay thin, and customer objections on price or reliability slow conversion.
    - 6x-10x revenue, nearer lower-quality infrastructure or brokerage outcomes.
    - 120-350
    - ~0.1x-0.3x
    - Likely if hidden-cost friction, repeat outages, or weak retention reveal a low-moat routing intermediary.
  notes: Ranges are evidence-led valuation frames, not a claim that current revenue is known; public evidence does not disclose the actual 2026 run-rate needed to choose among them.
