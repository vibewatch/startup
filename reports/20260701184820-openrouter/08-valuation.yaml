  evidenceGaps:
  - type: stale
    severity: material
    topic: current-revenue-disclosure
    missingEvidence: A current 2026 revenue run-rate, ARR bridge, and revenue mix by self-serve, enterprise, routed traffic, and BYOK monetization.
    whyItMatters: Without a fresh revenue anchor, the gap between the reported $1.3B valuation and public evidence remains too large for precise underwriting.
    diligencePath: Request the latest board package or finance dashboard showing monthly recurring and usage-based revenue by product line.
    relatedQuestionRefs:
    - QV007
    - QV010
    - QV019
    - QV020
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: The exact Series B preference stack, any participation rights, anti-dilution terms, secondary component, and option-pool changes.
    whyItMatters: Headline post-money valuation is not equivalent to common-equivalent upside if the preferred stack is unusually protective.
    diligencePath: Review the cap table, financing docs, and board approvals with counsel before setting any price target.
    relatedQuestionRefs:
    - QV005
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-table-coverage
    missingEvidence: A fuller set of directly comparable private routing or gateway financings with disclosed valuation and revenue metrics.
    whyItMatters: The comparable table relies on the best public sample available, but many private peers still do not disclose enough to build a complete direct-comp set.
    diligencePath: Augment the public set with banker market checks, confidential investor materials, and private-market transaction data.
    relatedQuestionRefs:
    - QV015
    - QV018
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: customer-and-margin-quality
    missingEvidence: Net retention, logo churn, enterprise mix, top-customer concentration, and gross margin net of provider payouts and support cost.
    whyItMatters: These are the metrics that decide whether OpenRouter deserves a premium software multiple or a thinner infrastructure multiple.
    diligencePath: Request cohort analysis, top-account concentration schedules, and contribution-margin reporting by traffic type.
