- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Cloudflare
    - Public market cap / TTM revenue
    - ~40.9x revenue
    - Shows what premium, enterprise-trusted control planes can command.
    - Cloudflare is broader security and networking software with richer disclosure and a very different moat.
  - - Datadog
    - Public market cap / TTM revenue
    - ~25.6x revenue
    - Useful benchmark for observability and platform-software quality.
    - Datadog is more diversified and mature as a public software platform.
  - - Snowflake
    - Public market cap / TTM revenue
    - ~19.3x revenue
    - A reference for high-growth data infrastructure that still commands a premium.
    - Not a routing business; economics and product scope are different.
  - - CoreWeave
    - Public market cap / TTM revenue
    - ~9.3x revenue
    - Closest current public AI infrastructure hype benchmark.
    - Owns compute and training infrastructure, so it is not a neutral control plane.
  - - GitLab
    - Public market cap / TTM revenue
    - ~5.7x revenue
    - Developer infrastructure reference for more normalized software multiples.
    - Not AI-routing specific and already public-maturity priced.
  - - Akamai / Fastly
    - Public market cap / TTM revenue
    - ~3.9x / ~4.5x revenue
    - Downside check for lower-multiple edge and delivery infrastructure.
    - These are mature CDN / edge names, not model-routing platforms.
  - - Together AI
    - Private official financing status
    - 2026 $800M Series C announced; official valuation not surfaced on reviewed source.
    - Confirms investor appetite for AI infrastructure peers in 2026.
    - Official source does not disclose valuation or revenue on the reviewed page.
  - - Fireworks AI
    - Private official financing status
    - 2026 $4B valuation, >$280M annualized revenue, plus prior $552M Series B.
    - Most informative disclosed private AI-infra reference in the set.
    - Fireworks owns more of the infrastructure stack than OpenRouter and is not a neutral router-only business.
  notes: Selected sample chosen for business-model relevance and available valuation evidence as of July 2026; the private router market is not exhaustively disclosed in public sources.
