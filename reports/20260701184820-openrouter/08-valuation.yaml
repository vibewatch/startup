- id: TV002
  title: Thesis / Anti-thesis Table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market
    - Model routing is becoming a real category as agentic systems need cost, trust, and model-selection logic across many providers.
    - Routing can remain a feature inside broader clouds or open-source stacks rather than a durable standalone profit pool.
    - Show that enterprise buyers pay persistently for routing and governance rather than treating it as commodity glue.
  - - Product
    - OpenRouter has a useful neutral control-plane wedge with multi-provider access, failover, and optimization.
    - Neutral routing logic is easier to copy than exclusive compute or proprietary models.
    - Demonstrate premium win rates and measurable willingness to pay for proprietary routing features.
  - - Customers
    - 8M+ users and 25T weekly tokens imply strong top-of-funnel pull and real adoption.
    - Public sources do not segment paying accounts, enterprise logos, or revenue retention; usage may overstate monetized depth.
    - Provide paying-customer count, cohort retention, enterprise mix, and top-customer concentration.
  - - Financials
    - Take-rate mechanics, platform fees, and BYOK monetization create several revenue levers.
    - The only public revenue anchor is stale and tiny versus the current valuation; margin quality is still opaque.
    - Provide current revenue, gross margin net of provider payouts, and burn/runway.
  - - Competition
    - OpenRouter benefits from a structurally multi-model world where portability matters.
    - Hyperscalers, Fireworks, Together, and self-hosted routers can compress pricing or capture the most valuable workloads.
    - Show that larger rivals do not erode attach, pricing, or renewal quality in enterprise deals.
  - - Risks
    - A strong 2026 financing round reduces immediate solvency anxiety and funds go-to-market plus reliability work.
    - Outages, hidden-cost complaints, and undisclosed preferred terms can all hurt conversion, retention, or future financing leverage.
    - Disclose SLA performance, support economics, and the exact preferred-share stack from the latest round.
  notes: Rows pair the strongest pro and con arguments by valuation-relevant dimension rather than by generic company quality.
