  - CV044
  - CV046
  - CV047
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue / ARR
    - Latest monthly and annualized revenue, split by self-serve, enterprise, routed volume, and BYOK monetization.
    - Needed to test whether the $1.3B price sits inside or outside reasonable comp bands.
    - CFO or finance data room request.
  - - Gross margin net of provider payouts
    - Contribution margin by traffic type, including free-tier subsidy and support burden.
    - Determines whether the business behaves like premium software, payments, or thin intermediation.
    - Finance + operations workstream.
  - - Retention and expansion
    - Gross retention, NRR, cohort curves, and paying-account segmentation.
    - Without it, usage growth could still conceal weak monetized durability.
    - Revenue-ops / board-pack request.
  - - Cap table and round terms
    - Series B preference stack, participation rights, anti-dilution, option-pool changes, and any secondary component.
    - Headline valuation alone is not enough to judge common-equivalent upside.
    - Legal diligence and cap-table review.
  - - Customer concentration
    - Top 10 and top 20 customers by revenue, plus any hyperscaler or channel dependence.
    - Concentration can compress exit quality and raises renewal risk.
    - Customer analytics + sales leadership.
  - - Reliability and support economics
    - SLA performance, support staffing model, outage remediation cost, and enterprise-support attach.
    - Reliability is part of the product promise and may be expensive to defend.
    - Engineering / support ops diligence.
  notes: Each ask closes a valuation-critical gap rather than a generic diligence wishlist item.
