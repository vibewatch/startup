- id: scenario-framework-and-investment-call
  title: Scenario Framework and Investment Call
  body: The scenario math explains why the recommendation is not a buy. At a $1.3 billion entry, OpenRouter would need roughly $52 million of revenue just to sit near a 25x revenue multiple, more than $72 million to trade at 18x, and roughly $144 million to fit a 9x multiple typical of less premium infrastructure names. The only public revenue-like anchor in the file is Sacra’s May 2025 estimate of $5 million of annualized revenue, which makes the current valuation look extremely stretched if nothing material changed. Of course, something may have changed materially; official usage growth suggests that possibility. But the evidence needed to prove it is private, not public. The bull case is therefore plausible but unverified. The base case is that OpenRouter is strategically important, commercially promising, and still too opaque for price-led conviction. The bear case is that the business proves economically closer to a routing broker than to a premium software platform. That mix supports
    a research-more recommendation, medium confidence, high risk, and a stretched valuation stance.
