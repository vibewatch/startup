- id: exit-readiness-diligence-and-thesis-breakers
  title: Exit Readiness, Final Diligence Asks, and Thesis-Breakers
  body: 'Exit readiness is not just about whether OpenRouter can grow; it is about whether a future buyer or public market can underwrite durable economics from today’s position. A new investor entering around the reported valuation would typically want a multi-year hold and a credible path to a value well north of $3.9 billion to earn a 3x gross outcome before later dilution. That path is not impossible, but it requires evidence that is still absent from the public file: current run-rate revenue, gross margin net of provider payouts, retention, concentration, support economics, and the exact preference stack. The final diligence asks are therefore straightforward and investment-critical. If management can supply those items and they confirm premium-software economics, the call can move up. If they instead reveal low margin, weak retention, repeat outages, or a punitive preferred stack, the thesis breaks quickly. Investors should treat those data requests and kill triggers as core valuation
    work, not as peripheral confirmatory diligence.'
