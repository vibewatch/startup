- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue quality disappoints
    - Current run-rate revenue or margin profile lands much closer to low-take-rate brokerage economics than premium software economics.
    - Breaks the case for paying a premium control-plane multiple.
    - Step away or materially lower valuation expectations.
  - - Retention / concentration risk
    - NRR, logo churn, or top-customer concentration reveal a fragile enterprise base.
    - Undercuts durability of the routing layer and narrows exit optionality.
    - Pause underwriting until customer quality is proven.
  - - Reliability repeats
    - Another serious outage cluster or SLA failure hits production customers before enterprise trust is established.
    - 'Damages the exact value proposition investors are paying for: reliability and routing quality.'
    - Downgrade the moat and comp band immediately.
  - - Preferred stack is punitive
    - Latest cap-table terms include investor protections or secondary mix that meaningfully reduce common-equivalent upside.
    - Reduces actual return potential even if the headline valuation looks unchanged.
    - Reprice the deal or pass.
  - - Competitive win rates collapse
    - Hyperscalers, Fireworks, or self-hosted routers win the highest-value workloads consistently.
    - Suggests the category stays multi-homed and OpenRouter cannot defend premium take rates.
    - Shift view from platform premium to commodity routing utility.
  notes: 'Triggers are valuation-specific: each one changes the multiple or dilution math, not just the qualitative story.'
  claimRefs:
