  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Shows how OpenRouter’s public motion runs from self-serve experimentation into embedded tooling and then into
      multi-team governance rather than through a classic top-down enterprise sale.
    data:
      items:
        - label: Discover and test models
          note: >-
            Individual developers or startup teams arrive through docs, rankings, or Stripe Projects and value one API,
            free-model access, and fast setup.
        - label: Embed in a tool or workflow
          note: >-
            Coding agents, middleware, and app builders adopt OpenRouter as the routing layer inside their own product
            or workflow.
        - label: Standardize access inside one account
          note: >-
            Workspaces, unified billing, and organization roles create a common control plane once multiple projects or
            teams are involved.
        - label: Govern production usage
          note: >-
            Budgets, service tiers, activity analytics, and privacy controls become more important when spend,
            compliance, and support expectations rise.
        - label: Expand or stall
          note: >-
            Accounts can expand into multi-team or regulated use, but support quality, SLA negotiation, and
            workflow-level cost control become gating factors.
    claimRefs:
      - CU004
      - CU006
      - CU010
      - CU020
      - CU031
      - CU035
      - CU047
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: >-
      Traces the evidence-backed path from public usage growth into documented deployments and ecosystem channels,
      showing where proof is strong and where it becomes thinner.
    data:
      nodes:
        - id: usage-growth
          label: Usage growth
          detail: >-
            Series B materials and TechCrunch anchor the top of funnel with 8M+ users or developers, 400+ models, and
            5T→25T weekly token growth.
        - id: developer-onramp
          label: Developer on-ramp
          detail: >-
            Stripe Projects, the normalized API, and free-model access make first adoption easy for builders and startup
            teams.
        - id: embedded-tools
          label: Embedded tools
          detail: >-
            Roo Code, OpenHands, Aider, and LiteLLM publish explicit OpenRouter integrations that pull the product into
            coding and agent workflows.
        - id: org-controls
          label: Organization controls
          detail: >-
            Workspaces, budgets, analytics, privacy settings, and service tiers indicate an upmarket motion into
            governed multi-team usage.
        - id: proof-limit
          label: Proof limit
          detail: >-
            Customer-quality proof gets thinner at the contract stage because public sources do not disclose retention,
            concentration, or enterprise reference depth.
      edges:
        - from: usage-growth
          to: developer-onramp
          label: broad demand enters via self-serve
        - from: developer-onramp
          to: embedded-tools
          label: tooling ecosystems pull OpenRouter into products
        - from: embedded-tools
          to: org-controls
          label: teams add budgets, roles, and analytics
        - from: org-controls
          to: proof-limit
          label: public evidence weakens at renewal and concentration
