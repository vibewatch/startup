  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              OpenRouter does not face one clean peer set. The market breaks into at least five alternative ways to
              solve the same buyer job. First are neutral routing layers such as LiteLLM and Martian, which promise
              model selection, failover, or control-plane abstraction without necessarily owning the underlying compute.
              Second are inference clouds such as Together AI, Replicate, and Fireworks, which sell model access but
              also bundle model hosting, training, or dedicated infrastructure. Third are cloud-incumbent routers inside
              AWS Bedrock and Microsoft Foundry, where routing is packaged with broader security, procurement, and
              governance stacks. Fourth are direct-provider APIs from OpenAI and Anthropic, which keep pricing
              transparent but push routing logic back onto the customer. Fifth are internal-build paths using frameworks
              like LangChain and LlamaIndex. That structure matters because OpenRouter usually competes against a stack
              choice, not just against another startup logo.
