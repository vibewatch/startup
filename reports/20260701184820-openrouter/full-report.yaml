      - number: '4.3'
        title: Cost Structure, Working Capital, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              OpenRouter’s cost structure should be materially lighter on hardware capex than a model lab, but that does
              not make it a trivial software margin story. The company’s own documentation frames the platform around
              Cloudflare Workers, edge caching, provider routing, fallback logic, budgets, and analytics rather than
              owned GPUs or foundation-model training. That points to lower capital intensity than inference providers
              or labs. At the same time, non-BYOK traffic still appears to pass through upstream model costs, meaning
              gross margin depends on what OpenRouter keeps via platform fees, BYOK overages, enterprise support, and
              any other undisclosed contractual economics. Reliability also carries real delivery cost: low balances
              force extra database checks, failed primary routes add latency, the company says it subsidizes some
              free-model capacity, and February 2026 outages forced circuit-breaker and fallback-cache work. Working
              capital is probably favorable because customers prepay credits before consuming them, but that same wallet
              model creates deferred-service and gross-vs-net judgment calls. Capital adequacy is directionally strong
              after the $113 million Series B and about $1.3 billion valuation signal, yet the filing record is sparse
              and backward-looking. The visible SEC materials are a 2025 Form D showing only a partially sold exempt
              offering and no revenue disclosure, not the current cash, burn, or runway an investor would need for full
              underwriting.
