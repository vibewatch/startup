            body: >-
              The public record supports a believable land-and-expand story, but not a durable-retention verdict. On the
              positive side, OpenRouter has built the surfaces a real organization would need after first adoption:
              workspaces, per-workspace keys, organization roles, unified billing, per-user activity analytics,
              enterprise budgets, service-tier controls, and opt-in data-handling settings. Those are expansion
              features, not hobby-project niceties. They suggest OpenRouter wants customers to move from self-serve
              experimentation into multi-team deployment. At the same time, the missing metrics are exactly the ones an
              investor would want before underwriting customer quality. There is no public NRR, no GRR, no churn
              disclosure, no contract-length disclosure, and no concentration disclosure. Adverse evidence also matters
              here. TrueFoundry’s review and pricing analyses describe a clear split between early-stage builders and
              production buyers: OpenRouter is praised for unified model access and fast switching, but criticized for
              support responsiveness, account-security handling, workflow-level spend control, missing public SLA
              standards, and the governance limits that appear once an organization moves into regulated or high-volume
              use. OpenRouter’s own February 2026 outage write-up reinforces the same point. The company was transparent
              and fixed the 401-versus-503 behavior, but the incident still undercuts the reliability promise that
              larger buyers need. Expansion is plausible, but durability remains unproven without renewal data and
              concentration detail.
