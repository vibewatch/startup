  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Price Support
        blocks:
          - type: paragraph
            body: >-
              OpenRouter has undeniably won investor attention. The company announced a $113 million Series B in May
              2026, and independent reporting tied that round to an approximately $1.3 billion post-money valuation.
              Official materials also show real usage momentum: 25 trillion tokens per week, more than 8 million users,
              and access across 400-plus models. That is enough to justify serious diligence and to explain why growth
              investors wanted exposure. It is not enough to underwrite price. The public filing trail is still thin,
              backward-looking, and centered on a 2025 Form D rather than current operating statements. The SEC
              materials do not disclose current revenue, burn, cash, customer concentration, or preferred-share
              economics, and the reviewed public record does not reveal whether the new round included secondary stock,
              participating preferences, or option-pool expansion. In practical terms, the market is pricing strong
              strategic relevance and demand momentum, while public evidence still leaves the core price-support
              question unresolved.
            claimRefs:
              - CV001
