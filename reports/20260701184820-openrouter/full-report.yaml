  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              OpenRouter does not participate in the entire generative-AI software stack. Its closest market is the
              managed multi-model routing layer that sits between applications and external model providers,
              standardizes APIs, selects providers, applies fallbacks, and increasingly adds caching, analytics, and
              billing control. That boundary is broader than a simple model picker but narrower than a full enterprise
              AI control plane. Included spend therefore covers unified API access, provider routing, failover, caching,
              usage analytics, and consolidated billing across third-party models. Excluded spend includes training and
              model creation, GPU hardware, generic enterprise API programs unrelated to AI inference, and
              end-application AI revenue. The adjacency set matters because OpenRouter competes against several status
              quos: developers can call providers directly; platform teams can extend Cloudflare, Kong, or Azure API
              Management; cloud-native teams can stay inside AWS Bedrock or Microsoft Foundry; and self-hosted teams can
              run LiteLLM. That means OpenRouter’s real addressable market is the slice that values fast multi-provider
              access without taking on self-hosting or deep infrastructure ownership.
