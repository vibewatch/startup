        - Request top-10 customer revenue share and spend concentration by provider or model family
      - - Free-tier subsidy economics
        - Free-model support may boost acquisition but can also consume margin if conversion is weak
        - Request subsidy spend, free-to-paid conversion, and payback by acquired cohort
