  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanics, and Recognition Caveats
        blocks:
          - type: paragraph
            body: >-
              OpenRouter’s public file supports a hybrid routing-platform revenue model, but not a clean breakdown of
              realized revenue. Official sources show the company monetizes around usage rather than annual contract
              disclosures: customers can buy credits in advance, route inference through OpenRouter’s unified API, and
              optionally run Bring Your Own Key traffic through the same control plane. The most concrete official fees
              are not per-seat SaaS fees but payment-layer economics. OpenRouter says non-crypto top-ups carry a 5.5%
              fee with a $0.80 minimum, crypto top-ups carry a 5.0% flat fee, and BYOK becomes a 5% monetization lever
              only after the first 1 million monthly requests. Stripe Projects shows a free default plan and
              pay-as-you-go upgrade path, while Sacra’s 2025 work estimated only $5 million of annualized revenue on
              $100 million of GMV, implying that most gross payment volume likely passes through to upstream providers
              rather than staying on OpenRouter’s income statement. That, in turn, creates a real recognition issue:
              credits are purchased before they are consumed, credits-used and credits-purchased are tracked separately,
              and the public record does not explain whether reported revenue is gross credit sales, net take rate, or
              some deferred-revenue style balance. The route-to-revenue logic is visible; the accounting policy is not.
