  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
      - Diligence ask
    rows:
      - - Routing-layer reliability
        - OpenRouter-originated major incidents
        - More than one material platform-caused outage in a quarter after the Feb-2026 remediations
        - Treat reliability as thesis-broken until root-cause trend is demonstrably fixed
        - Request monthly Sev-1/Sev-2 log, postmortems, and uptime/SLO history
      - - Regulated-data compliance
        - Evidence that compliant routing has to fail open or leave approved jurisdictions/providers
        - Any inability to prove EU-only processing, ZDR, or data_collection-deny behavior for target workloads
        - Restrict use to non-sensitive workloads and haircut enterprise upside
        - Request architecture walkthrough, logs, and sample audit evidence for regulated traffic
      - - Price / take-rate compression
        - Native-routing expansion by AWS, Microsoft, or model vendors coincides with price cuts or rebate pressure
        - Sustained routing-price concessions without offsetting retention or upsell gains
        - Lower margin assumptions and require stronger retention proof
        - Request cohort retention, blended take-rate, and top-win / top-loss pricing cases
      - - Billing integrity
        - Credit disputes or incorrect failed-request charges
        - Recurring complaints that 429 / partial-output paths still consume credits without fast remediation
        - Increase support-cost assumptions and pressure-test gross margin
        - Request dispute volumes, average credit-adjustment latency, and billing QA controls
      - - Provider concentration
        - Traffic or spend becomes overly dependent on one frontier model family
        - Any single provider >50% of traffic or spend without contracted fallback commitments
        - Apply concentration discount and question routing defensibility
        - Request monthly provider-mix dashboard and contractual flexibility summary
      - - Compliance disclosure readiness
        - Lack of independent security / privacy artifacts during diligence
        - Inability to produce current certification, pen-test, or subprocessor documentation under NDA
        - Pause regulated or mission-critical underwriting
        - Request full trust package, audit reports, and remediation tracker
      - - Payment / account dependency
        - Stripe, Coinbase, or auth-provider policy/service changes affect onboarding or credits
        - Any suspension, settlement disruption, or prolonged login outage tied to core external services
        - Increase churn assumptions and reevaluate checkout friction
        - Request dependency map, fallback plans, and incident response for billing/auth surfaces
      - - Legal / enforcement posture
        - New privacy, AI-governance, or IP challenge emerges
        - Any formal regulator inquiry, injunction, or material lawsuit tied to routing, retention, or outputs
        - Pause investment or require repricing until exposure is bounded
        - Have counsel run litigation, privacy, sanctions, and AI-governance diligence before close
    notes: >-
      These are intentionally monitorable gates: they are designed to tell an investor when OpenRouter's residual risk
      is merely operationally noisy versus when the underwriting thesis should be paused, repriced, or broken.
