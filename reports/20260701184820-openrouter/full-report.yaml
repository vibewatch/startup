      - number: '3.3'
        title: Incumbents, Open Source, and Internal Build
        blocks:
          - type: paragraph
            body: >-
              The most powerful substitutes are not necessarily venture-backed peers. AWS and Microsoft now market
              routing inside broader AI platforms, and both couple that routing with governance, procurement, and trust
              posture that small routers cannot match. Bedrock prompt routing stays within a model family, while Azure
              model router stays within eligible deployed models and data-zone rules, so neither is as neutral as
              OpenRouter; however, both are easier to justify inside existing cloud estates. At the other end of the
              spectrum, direct APIs and open-source frameworks make self-build increasingly viable. OpenAI and Anthropic
              expose public token pricing and service tiers, while LangChain and LlamaIndex expose routing or
              portability primitives. LiteLLM bridges those worlds by standardizing the OpenAI format across 100+ models
              and adding fallbacks, budgets, and load balancing, which materially lowers migration friction away from
              any managed router.
