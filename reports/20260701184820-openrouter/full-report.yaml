            title: Compliance controls are meaningful but not universally default
            body: >-
              OpenRouter has real controls—ZDR, guardrails, EU routing, human-oversight guidance, and spend caps—but
              several are opt-in or enterprise-only. That means regulated-workload safety depends not just on product
              existence, but on configuration, plan tier, and customer operational discipline.
