    title: Pricing / Packaging Comparison
    columns:
      - Option / class
      - Public pricing signal
      - Contract model
      - Included capabilities
      - Unknowns / limits
      - Implication
    rows:
      - - OpenRouter
        - Service tiers expose flex/priority controls, but broad enterprise economics are private
        - Usage-based API with enterprise overlays
        - Provider routing, failover, and specialized routers
        - Realized enterprise discounting and win-rate data are not public
        - Easy to trial technically, harder to benchmark commercially at scale
      - - Together AI
        - Serverless per-token pricing with no minimum; batch discounts and dedicated endpoints
        - Self-serve for variable usage, sales-assisted for steadier or reserved workloads
        - Open-model access plus deeper infrastructure options
        - Dedicated pricing and realized discounts are not public
        - Attractive for teams that may graduate from routing into hosted infrastructure
      - - Replicate
        - Clear pay-as-you-go language and model-specific price estimates
        - Self-serve usage billing
        - Model execution, fine-tuning, and custom deployment
        - Not framed as a neutral routing contract
        - Good for experimentation and shipping features, less direct for uptime abstraction
      - - Fireworks AI
        - Per-token serverless and per-GPU-second on-demand pricing
        - Self-serve plus enterprise deployments
        - Inference, training, and dedicated deployments
        - Enterprise rate cards and volume discounts are not public
        - Competes when performance and infra depth matter more than neutrality
      - - Martian / LiteLLM
        - LiteLLM shows pricing-request and on-prem motion; Martian public pricing was not surfaced
        - Open-source plus enterprise support for LiteLLM; consultative enterprise sale for Martian
        - Gateway controls, routing, compliance, or self-hosting leverage
        - Public comparability is limited, especially for Martian
        - These options appeal when buyers want control or regulated-workflow customization
      - - AWS / Azure routers
        - Pricing sits inside cloud-provider model pricing, calculators, and enterprise agreements
        - Cloud consumption plus enterprise procurement
        - Routing with broader platform governance and compliance
        - Router-only economics are not isolated cleanly from wider cloud spend
        - Hard for startups to beat when routing is purchased as part of a bigger platform standard
      - - OpenAI / Anthropic direct APIs + internal build
        - Public token tables, service tiers, and enterprise add-ons are visible
        - Usage-based API plus whatever internal engineering the buyer adds
        - Raw model access, provider-native tiers, and room for custom orchestration
        - Buyer must build routing, failover, and governance on top
        - Sets the transparency floor under third-party routers and keeps multi-homing economically credible
