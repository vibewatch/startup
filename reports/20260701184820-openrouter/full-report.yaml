              than classic enterprise reference accounts. Roo Code, OpenHands, Aider, and LiteLLM all maintain explicit
              OpenRouter integration pages; Product Hunt’s archived reviews add named maker testimonials from
              involve.me, Clado, and Agents Base. Those are credible proof points that OpenRouter is genuinely embedded
              in active workflows, especially coding and agentic ones, and that at least some customers are beyond a toy
              experiment. But they are still not the same thing as a disclosed Fortune 500 production deployment with
              renewal history and contractual economics. The right interpretation is that OpenRouter has abundant usage
