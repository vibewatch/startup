          - type: callout
            title: Retention and concentration remain the core customer diligence gaps
            body: >-
              OpenRouter’s public demand signals are much stronger than its disclosed customer-quality metrics. There is
              no public NRR, GRR, churn, contract-term, or concentration disclosure, and most named proof is indirect.
              Until management provides cohort retention, top-customer exposure, and channel mix, investors cannot tell
              whether token growth reflects diversified durable accounts or a more concentrated, tool-driven demand
              base.
