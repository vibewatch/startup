        title: Peer Profiles, Capability, and Pricing
        blocks:
          - type: paragraph
            body: >-
              Among direct and adjacent peers, the most important distinction is whether the vendor is selling routing
              neutrality or broader infrastructure ownership. OpenRouter is strongest when the buyer explicitly wants
              multi-provider uptime, failover, and model-selection logic without moving workloads into one model host.
              LiteLLM and Martian attack that same orchestration layer from different angles: LiteLLM from open-source
              platform tooling and Martian from enterprise routing plus compliance automation. Together and Fireworks
              compete differently. Both offer developers self-serve usage but steer larger or steadier demand toward
              deeper infrastructure footprints, including dedicated endpoints, on-demand deployments, or training.
              Replicate sits further toward runtime and marketplace substitution, making it attractive for shipping
              model-backed features quickly but less directly equivalent to a neutral router. Pricing transparency is
              uneven: direct APIs, Replicate, Fireworks, and Together serverless expose more visible usage economics
