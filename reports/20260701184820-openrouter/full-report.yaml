      - number: '7.2'
        title: Operational, Security, and Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, OpenRouter's highest-severity risk is self-inflicted control-plane failure. The February 17
              and 19, 2026 postmortem showed that a third-party caching dependency failure degraded all API surfaces,
              first as 500s and then as misleading 401 authentication errors after cache invalidation pushed too many
              lookups onto the database. The company's own write-up says the second outage made clear that the caching
              layer, not just a concurrent denial-of-service event, was the root cause. This is a structurally important
              signal because the entire value proposition is to make AI access more reliable than any single
              direct-provider integration.


              The narrower status incidents reinforce that the problem is not limited to one root cause. OpenRouter
              disclosed a Clerk authentication incident that affected logins and account access, an Amazon Bedrock
              outage that propagated into the platform, a separate 401-errors incident across chat and generation APIs,
              and a nearly five-hour logging incident that delayed budgets and billing events. Meanwhile, OpenRouter's
              own routing docs say provider failover is on by default but model fallbacks are opt-in, and that
              restricting providers for compliance reasons narrows the fallback set. In other words, the same controls
              that make OpenRouter attractive to regulated buyers can reduce recovery paths when upstream systems fail.


              The company does have credible mitigants: circuit breakers, fallback caching, prompt-injection blocking,
              sensitive-info redaction, and spend limits. But several safeguards are optional, and some of the
              sensitive-info detection remains beta-like and can allow requests through on timeout. Investors should
              therefore treat reliability as the master risk: if OpenRouter-originated incidents recur, the platform
              becomes a new single point of failure rather than a resilience layer.
