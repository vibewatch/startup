  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a simple chain: category relevance and usage proof are real, but economics opacity and
      price support gaps still dominate the underwriting call.
    data:
      nodes:
        - id: market
          label: Routing category matters
          detail: IDC and market reports frame model routing and gateways as a real and growing control-plane problem.
        - id: usage
          label: OpenRouter has real traction
          detail: OpenRouter discloses 8M+ users, 400+ models, and 25T weekly tokens.
        - id: economics
          label: Economics still opaque
          detail: Public sources do not disclose current revenue, margin, retention, or concentration.
        - id: price
          label: Headline price is demanding
          detail: The reported $1.3B valuation requires much higher revenue than the public file discloses.
        - id: decision
          label: 'Recommendation: research-more'
          detail: Advance only with private economics or a much better entry price.
      edges:
        - from: market
          to: usage
          label: supports interest in
        - from: usage
          to: economics
          label: does not resolve
        - from: economics
          to: price
          label: weakens
        - from: price
          to: decision
          label: drives
