        title: Exhibits
        blocks:
          - type: callout
            title: The router itself is the top residual risk
            body: >-
              The February 2026 incidents matter more than normal SaaS downtime because they cut directly against
              OpenRouter's core promise: buyers adopt the product to remove single-provider fragility, so repeated
              OpenRouter-originated failures would collapse the differentiation narrative.
            calloutType: risk
