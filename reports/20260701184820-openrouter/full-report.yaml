              side, OpenRouter publishes provider-level training and retention disclosures, EU routing, ZDR-aware
              endpoint previews, spend and allowlist controls, prompt-injection blocking, PII redaction, and admin-only
              input and output logging with encrypted storage. Zero completion insurance and automatic provider failover
              also show that cost protection and uptime are treated as product features rather than merely support
              promises. The open diligence items are equally important. Logging retention and EU-routing limitations
              mean privacy behavior still depends on feature toggles and traffic path. Provider-retention preferences
