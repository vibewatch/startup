      - number: '7.3'
        title: Partner Dependency, Disintermediation, and Economic Compression
        blocks:
          - type: paragraph
            body: >-
              OpenRouter depends on a stack of counterparties that are simultaneously suppliers, policy setters, and in
              some cases direct substitutes. Upstream model providers still determine many of the hard constraints that
              matter most to customers: who can process data, whether prompts may be retained or used for training, what
              rate limits or quotas apply, and which terms govern output ownership or service suspension. OpenRouter can
              route around some failures, but it cannot remove provider policy dependence. Its own terms say model
              access may be suspended if customers violate provider terms or if a provider requests action, and its
              routing docs make clear that routing choices such as only/order/ignore and data_collection filters trade
              off resilience for control.


              The economic risk is amplified because major platforms now sell native routing rather than just raw model
              endpoints. Amazon Bedrock offers prompt routing across model families, and Microsoft Foundry's model
              router already optimizes across quality, cost, and latency inside a single deployment. That makes routing
              increasingly feature-like rather than standalone. Add OpenAI and Google quota systems on top, and
              OpenRouter can become the party blamed for slowness, throttling, or cost volatility even when the upstream
              constraint sits elsewhere.


              There are also softer but still real partner dependencies around authentication, billing, and payment
              rails. The status pages show that Clerk and Bedrock events can surface at the OpenRouter layer, while the
              terms page links Stripe and Coinbase legal agreements into parts of the billing stack. None of this means
              the model is broken; it means investors should assume margin pressure, support friction, and
              partner-policy shocks are endemic to the business model unless OpenRouter proves it can keep buyers loyal
              despite direct-routing alternatives.
