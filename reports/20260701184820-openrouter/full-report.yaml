        title: Exhibits
        blocks:
          - type: callout
            title: Strong ecosystem embedment in coding and agent workflows
            body: >-
              The most defensible customer proof is not a traditional Fortune 500 case-study set but a dense web of
              third-party tool integrations. Roo Code, OpenHands, Aider, LiteLLM, Stripe Projects, and Product Hunt
              maker reviews all point to OpenRouter as a real routing layer in active developer workflows. That breadth
              matters because it shows the product is not only marketed; it is wired into tools other builders ship and
              use.
