      - number: '3.4'
        title: Switching Costs, Distribution Power, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              OpenRouter's moat is real but conditional. The product has a credible control-plane wedge—provider load
              balancing, failover, flex or priority pricing tiers, and specialized routers such as Pareto and Fusion—but
              the moat is software logic rather than exclusive supply. That makes it easier for adjacent infrastructure
              vendors, hyperscalers, or open-source gateways to copy enough of the value proposition to compress
              pricing. The strongest distribution advantage belongs to AWS and Microsoft because routing can ride
              broader cloud contracts and enterprise governance mandates. The strongest switching-pressure comes from
              LiteLLM plus internal-build frameworks, because those tools preserve model portability and keep
              multi-homing cheap. Martian's RouterBench logic also cuts both ways: it validates that routing matters,
              but it also validates that buyers should stay flexible across models and providers. The likely outcome is
              a structurally multi-homed category where OpenRouter can win on convenience and velocity but may struggle
              to own the entire stack or command durable lock-in. The key diligence test is whether premium routing
