      - number: '1.4'
        title: Milestones, Risk Signals, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              OpenRouter’s 2026 milestone cadence suggests a company moving quickly from routing utility to broader
              infrastructure platform. Workspaces added organization-level controls, the May release spotlight pushed
              guardrails and PII redaction into the core offer, the image API expanded the platform into media
              generation, and the June MCP launch pushed OpenRouter directly into coding-agent workflows. Those launches
              make the operating thesis stronger because they extend the product from API access toward governance,
              tooling, and ecosystem distribution. But the same period also surfaced the clearest public negatives.
              OpenRouter published a detailed write-up on two February 2026 outages tied to a third-party caching
              dependency, including customer-facing 500s and misleading 401s. That transparency is positive, yet the
              incident still undercuts the company’s central reliability promise. Independent review coverage adds a
              second caution layer: TrueFoundry’s synthesis of user complaints points to support responsiveness,
              account-security handling, and weak hard-budget controls for agentic workloads. Finally, third-party
              directory data is noisy enough to warrant active skepticism. An archived Tracxn profile still described
              the company as Anguilla-based and backed only by Soma Capital, which directly clashes with later New York
              filing evidence and the broader 2026 investor set. Overall, the public story is investable and
              fast-growing, but not yet disclosure-complete.
