  - id: TP001
    title: Competitor Profile Table
    columns:
      - Option / class
      - Category
      - Scale / funding signal
      - Target customer
      - Product scope
      - Pricing signal
      - Strategic angle / limitation
    rows:
      - - OpenRouter
        - Neutral routing layer
        - >-
          Official docs emphasize provider routing, fallbacks, service tiers, and specialized routers rather than owned
          model supply
        - App builders and platform teams that want portability across upstream providers
        - Multi-provider routing, failover, and specialized routing logic on top of external models
        - Usage-based routing with flex/priority controls; realized enterprise discounts are not public
        - Strong abstraction layer; weaker exclusivity because it does not own model supply
      - - Together AI
        - Inference cloud
        - Homepage advertises Series C and GPU-cluster expansion
        - Developers and startups that want open-model inference plus deeper infra options
        - Serverless, batch, dedicated endpoints, dedicated containers, and GPU clusters
        - Per-token serverless with no minimum; dedicated endpoints for steadier demand; some batch discounts
        - Broad infra scope, but routing neutrality is not the center of the story
      - - Replicate
        - Model runtime / marketplace substitute
        - Homepage highlights multi-million run counts on popular models
        - Developers shipping model-backed features quickly with minimal ops
        - Run models, fine-tune, and deploy custom models through one API
        - Usage-based via hardware-time or input/output token billing depending on model
        - Fast self-serve motion; less centered on cross-provider control logic
      - - Fireworks AI
        - Inference and training platform
        - Homepage claims 30T+ tokens per day
        - Teams that want open-model inference, dedicated deployments, and training in one vendor
        - Serverless inference, on-demand deployments, and training flows
        - Per-token serverless and per-GPU-second on-demand deployments
        - Deep infra ownership and performance positioning; less neutral than a router-only layer
      - - Martian
        - Router plus compliance suite
        - Official materials highlight Accenture partnership and Airlock compliance launch
        - Regulated or enterprise buyers with model-governance concerns
        - Model routing plus compliance automation and interpretability-led optimization
        - Public list pricing and customer-count disclosures were not surfaced in reviewed sources
        - Potentially differentiated in regulated accounts, but public commercial transparency is thin
      - - LiteLLM
        - Open-source gateway
        - GitHub API shows ~52k stars and ~9k forks; homepage says YC-backed
        - Platform teams that want self-hosted or on-prem model access control
        - Unified OpenAI-format access, fallbacks, budgets, load balancing, and admin features
        - Open-source base with pricing-request / on-prem sales motion
        - Strong substitution risk because buyers can self-host and preserve portability
      - - AWS Bedrock / Azure Model Router
        - Incumbent cloud routers
        - AWS cites 100k+ organizations; Microsoft packages routing inside a broader AI platform
        - Enterprises already standardized on AWS or Azure
        - Routing inside broader cloud AI platforms with governance, security, and procurement leverage
        - Cloud-provider usage pricing and enterprise commitments rather than a simple neutral-router list price
        - Best trust and channel leverage; routing scope is narrower and less neutral than OpenRouter
      - - Direct APIs + internal build
        - Status-quo substitute
        - OpenAI and Anthropic expose direct pricing while LangChain and LlamaIndex expose router primitives
        - Teams with enough platform engineering depth to own orchestration
        - Direct provider integration plus custom routing, retries, and middleware
        - Transparent usage-based API pricing plus internal engineering cost
        - Maximum control and lowest dependence on a router vendor, but highest implementation burden
    notes: >-
      Rows compare the main ways a buyer can solve the routing or model-access job as of the 2026 run date; where public
      funding or price detail was absent, the table uses the strongest supportable scale or distribution signal instead
