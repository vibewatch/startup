  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: provider-concentration
    missingEvidence: Provider-level traffic, spend, GMV, rebate, and failover concentration by major model family and by top enterprise customers.
    whyItMatters: Without concentration data, it is impossible to tell whether OpenRouter's diversification story is real or whether one provider or customer already dominates the economics.
    diligencePath: Request a monthly provider-mix and top-customer concentration dashboard under NDA, plus any contractual minimums or preferential terms with key model providers.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Independent security attestations, current certification pack, public or NDA subprocessor schedule, and uptime / SLO history.
    whyItMatters: Regulated or mission-critical buyers will care less about feature breadth than about independently auditable evidence that the control plane is secure, resilient, and properly subcontracted.
    diligencePath: Request SOC 2 / ISO reports, pen-test cadence, subprocessor list, trust-center materials, and monthly uptime / incident metrics before underwriting enterprise expansion.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: minor
    topic: litigation-enforcement
    missingEvidence: A counsel-led docket and regulatory sweep under the company legal name, founder names, and known jurisdictions.
    whyItMatters: The direct public materials reviewed here did not reveal a formal litigation or enforcement issue, but absence from product and policy pages is not the same as legal clearance.
    diligencePath: Have external counsel run litigation, privacy-enforcement, sanctions, and AI-governance searches across federal, state, and EU sources before close.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
