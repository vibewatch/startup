company:
  name: OpenRouter
chapter:
  number: 7
  title: Risks
  summary: OpenRouter's biggest risk is that it sells reliability, privacy control, and routing abstraction while still concentrating failure and compliance burden in its own control plane. The most material residual exposures are (1) routing-layer outages and billing/logging faults that directly undermine the product promise, (2) privacy and regulatory leakage when customers do not correctly constrain multi-provider routing, and (3) disintermediation and take-rate compression as AWS, Microsoft, and model vendors ship native routing and rate-limit controls.
sections:
- id: overall-risk-ranking-and-regulatory-overhang
  title: Overall Risk Ranking and Regulatory / Legal Overhang
  body: |-
    OpenRouter's residual-risk profile is unusual because the company is both a control layer and a new concentration point. The product promise is stronger uptime, lower cost, and better compliance through routing, but the same architecture means OpenRouter becomes the place where model-provider terms, routing policy, privacy settings, logging choices, and customer spend governance all converge. That makes legal and compliance risk more than a pure paperwork issue: if the router defaults, documentation, or policy toggles are misunderstood, the error can propagate across many providers and many customers at once.

    The most immediate regulatory issue is not that OpenRouter is itself obviously a banned AI practice, but that it is increasingly used as plumbing for enterprise and agentic workloads subject to evolving AI-governance obligations. The European Commission's AI Act guidance says GPAI obligations are already effective and that transparency obligations arrive in August 2026, while high-risk use cases require logging, documentation, human oversight, and cybersecurity controls. OpenRouter has responded with public materials on EU in-region routing, zero data retention, human oversight patterns, and data-processing terms, but several of these protections are configuration-dependent or enterprise-gated rather than universal defaults.

    That opt-in structure matters because OpenRouter's own privacy and provider-logging materials say it does not control upstream LLM handling of inputs and outputs, that some providers may train on prompts unless the customer disables them, and that some non-training endpoints may still retain data for abuse or legal reasons. The DPA and privacy policy give a contractual path through SCCs and audit rights, yet those contractual protections do not remove execution risk. Net result: the highest legal/regulatory risk is not a single lawsuit already on file, but the possibility that regulated traffic is routed, retained, logged, or explained in a way enterprise buyers later view as non-compliant or insufficiently documented.
