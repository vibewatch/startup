  body: The fastest way to de-risk the story is not another product demo; it is an NDA package showing provider concentration, uptime/SLO history, security attestations, and billing-dispute rates. Without that, the biggest remaining questions sit exactly where the business model is most fragile.
  claimRefs:
  - CR051
  - CR052
  - CR053
  - CR054
