- id: mitigations-monitors-and-thesis-breaks
  title: Mitigations, Monitors, Thesis-Break Triggers, and Diligence Asks
  body: |-
    OpenRouter is not ignoring these risks; the public product surface shows a serious effort to productize mitigation. Customers can force zero-data-retention routing, restrict providers, set per-key and per-workspace spend caps, route regulated workloads through EU-only endpoints, and block or redact prompt-injection patterns and sensitive inputs before traffic reaches providers. The outage postmortem also documents concrete remediation steps such as circuit breakers, better error codes, and fallback caching. For underwriting purposes, these are meaningful positives because they show the company is translating risk lessons into features rather than relying only on process.

    The key investment question is not whether mitigations exist, but whether they are default enough, adopted enough, and independently auditable enough to change enterprise buying behavior. Several controls are enterprise-only, some are opt-in, and some rely on customer discipline to configure correctly. Public materials also leave important blind spots: concentration by provider, public uptime/SLO history, independent security attestations, and a comprehensive diligence-ready disclosure pack remain incomplete from the outside.

    Accordingly, the monitor set should stay concrete. Repeated OpenRouter-originated Sev-1 incidents, evidence that regulated traffic cannot stay inside approved jurisdictions or providers, persistent billing-credit disputes, or rising win-loss pressure from hyperscaler-native routers would all be thesis-damaging. Before underwriting mission-critical or regulated adoption, investors should request provider concentration, SLA/SLO data, subprocessor and certification detail, and historical credit-adjustment / dispute metrics under NDA.
