  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 整体风险排序与监管 / 法律包袱
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的剩余风险画像很特殊：它既是控制层，也成了新的集中点。产品承诺是靠路由带来更高可用性、更低成本和更好合规，但同一套架构也让模型供应商条款、路由政策、隐私设置、日志选择和客户支出治理都汇到
              OpenRouter 这里。法律与合规风险因此不只是文书问题；一旦路由默认值、文档或策略开关被误解，错误会同时传导到许多供应商和许多客户。


              眼下最直接的监管问题，不是 OpenRouter 本身显然属于被禁止的 AI 实践，而是它越来越像企业和代理式工作负载的底层管道，而这些工作负载正落入不断演进的 AI 治理义务。European
              Commission 的 AI Act 指引称，GPAI 义务已经生效，透明度义务将在 2026 年 8 月到来；高风险用例还需要日志、文档、人工监督和网络安全控制。OpenRouter 已经发布 EU
              区域内路由、零数据留存、人工监督模式和数据处理条款等材料，但其中不少保护依赖配置，或只向企业客户开放，并非通用默认项。


              这种选择加入式结构很重要。OpenRouter 自己的隐私和供应商日志材料说，公司不控制上游 LLM
              如何处理输入和输出；部分供应商可能训练提示词，除非客户关闭；即便是不训练的端点，也可能出于滥用防控或法律原因留存数据。DPA 和隐私政策给出了通过 SCCs
              和审计权的合同路径，但合同保护并不能消除执行风险。结果是，最大的法律 / 监管风险并不是已经出现的某一起诉讼，而是受监管流量可能以企业买方事后认为不合规或记录不足的方式被路由、留存、记录或解释。
