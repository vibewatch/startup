      - number: '2.4'
        title: 增长驱动、ROI 逻辑与采用约束
        blocks:
          - type: paragraph
            body: >-
              路由层需求逻辑很直接。模型目录持续扩张，价格和质量按任务差异很大，供应商故障或速率限制 会打断面向客户的应用。路由、缓存和集中分析把这些问题变成明确的 ROI 杠杆。IDC
              用性能、成本和信任来框定该类别；GetMaxim 认为混合工作负载路由可削减 40% 到 70% 的 token 支出；Google 自家模型阵容也说明，买方不想让每个 prompt
              都走一个默认模型。但采用约束同样真实。托管 SaaS 路由器在 VPC 部署、内部密钥控制、审计轨迹和策略执行上弱于自托管或企业 AI gateway。原生云和现有 API gateway
              已经为许多企业解决了足够多问题，这会限制独立路由器渗透。即便采用 gateway，团队也必须盯住代理延迟、精确匹配缓存限制，以及治理要求超过开发者优先托管服务能力的风险。
