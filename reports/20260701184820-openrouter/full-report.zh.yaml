      - number: '5.2'
        title: 路由架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              架构上，OpenRouter 把标准化请求接口与政策和路由逻辑结合起来，运行在上游供应商之上。models API 暴露定价、模态、上下文、供应商、作者、benchmark 和 ZDR
              过滤器，把模型选择标准变成机器可读输入，而不是临时的单供应商代码。Auto Router 随后加入 prompt 感知的模型选择、会话粘性，以及 allowed_models 和成本质量偏好等路由控制。Auto
              Exacto 是专门面向工具使用的第二层：它按吞吐量、benchmark 信号和实测 tool-call 成功率重排供应商，并明确跟踪 invalid JSON、unknown tool names 和
              invalid arguments 等失败桶。可靠性功能位于模型执行前后两侧。请求到达任何供应商之前，响应缓存在 OpenRouter 层发生；供应商故障转移是自动的，模型回退则通过 models
              数组显式给出。Tool calling、结构化输出和服务器工具把控制平面延伸到运行时编排，让团队能标准化 schema，并加入搜索或 fetch 能力，而不用自己构建每一个工具 wrapper。
