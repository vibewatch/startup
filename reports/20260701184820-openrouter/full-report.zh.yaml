      - number: '1.3'
        title: 融资历史、资本结构与规模信号
        blocks:
          - type: paragraph
            body: >-
              融资记录在最新一轮最强，在历史总额上最弱。OpenRouter 于 2026 年 5 月下旬宣布 CapitalG 领投的 $113M B 轮，TechCrunch 和其他创业媒体把该轮与约 $1.3B 的投后
              估值相连。财团把传统风投与战略平台投资人混在一起，包括 NVentures、ServiceNow Ventures、MongoDB Ventures、Snowflake Ventures 和 Databricks
              Ventures，这强化了 OpenRouter 想嵌入企业 AI 基础设施栈的信息。TechCrunch 还报道，2025 年 6 月公司完成 Andreessen Horowitz 和 Menlo
              Ventures 领投、Sequoia 参投的 $40M A 轮。这支持至少 $153M 的公开报道股权融资，但精确历史总额仍无法干净对齐，因为一份 2025 年 8 月镜像 Form D 显示，发行规模更大，为
              $47.6M，已售 $29.6M，投资人 30 名。没有底层融资文件，投资人无法判断该申报与后来媒体概述的轮次重叠多少。规模信号更清晰：官方材料多次引用每周 25T tokens、每月 100T
              tokens、超过 8M 用户、超过 400 个模型，以及后续网站计数器显示超过 10M 用户、超过 70 家供应商。这些是公司说法，不是审计 KPI，但足以证明 OpenRouter
              已在极大用量下销售，尽管收入和员工数仍未披露。
