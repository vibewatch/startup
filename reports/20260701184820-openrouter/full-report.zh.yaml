        - Serverless、批处理、专用端点、专用容器和 GPU 集群
        - Serverless 按 token 计费且无最低消费；专用端点面向更稳定需求；部分批处理折扣
        - 基础设施范围广，但路由中立性不是叙事中心
      - - Replicate
        - 模型运行时 / 市场型替代
        - 首页突出热门模型的数百万次运行记录
        - 希望以最低运维快速发布模型驱动功能的开发者
        - 通过一个 API 运行模型、微调并部署自定义模型
        - 视模型而定，按硬件时间或输入 / 输出 token 计费
        - 自助动作快；对跨供应商控制逻辑着墨较少
      - - Fireworks AI
        - 推理和训练平台
        - 首页称每天处理 30T+ token
        - 希望在同一供应商获得开放模型推理、专用部署和训练的团队
        - Serverless 推理、按需部署和训练流程
        - Serverless 按 token 计费，按需部署按 GPU 秒计费
        - 基础设施掌控深、性能定位强；中立性不如纯路由层
      - - Martian
        - 路由 + 合规套件
        - 官方材料突出 Accenture 合作和 Airlock 合规发布
        - 有模型治理顾虑的受监管或企业买家
        - 模型路由，加上合规自动化和以可解释性驱动的优化
        - 审阅来源未显示公开标价和客户数量披露
        - 在受监管账户中可能有差异化，但公开商业透明度薄
      - - LiteLLM
        - 开源网关
        - GitHub API 显示约 52k 星和约 9k fork；首页称 YC 支持
        - 希望自托管或本地部署模型访问控制的平台团队
        - 统一 OpenAI 格式访问、后备、预算、负载均衡和管理员功能
        - 开源基础，叠加询价 / 本地部署销售动作
        - 替代风险强，因为买方可以自托管并保留可携带性
      - - AWS Bedrock / Azure Model Router（云厂商路由）
        - 既有云平台路由器
        - AWS 称有 100k+ 组织；Microsoft 将路由打包进更广泛的 AI 平台
        - 已在 AWS 或 Azure 标准化的企业
        - 更广泛云 AI 平台内的路由，叠加治理、安全和采购杠杆
        - 云供应商用量定价和企业承诺，而不是简单的中立路由器标价
        - 信任和渠道杠杆最强；路由范围比 OpenRouter 更窄，也更不中立
      - - 直连 API + 内部自建
        - 现状替代方案
        - OpenAI 和 Anthropic 披露直接定价，LangChain 和 LlamaIndex 提供路由器原语
        - 有足够平台工程能力自主管理编排的团队
        - 直接供应商集成，加上自定义路由、重试和中间件
        - 透明的用量 API 定价，加上内部工程成本
        - 控制力最高，对路由器供应商依赖最低，但实施负担最重
    notes: 截至 2026 年运行日期，各行比较买方完成路由或模型访问任务的主要路径；公开融资或价格细节缺失时，表格采用最强可支撑的规模或分发信号，而不是编造数字。
