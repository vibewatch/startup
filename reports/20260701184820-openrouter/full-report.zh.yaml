  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 主要威胁
      - 严重度
      - 当前证据
      - 缓释措施 / 尽调问题
    rows:
      - - 供应商抽象难以复制
        - 开源网关和框架路由器已能复制足够多控制平面
        - 高
        - LiteLLM、LangChain 和 LlamaIndex 已提供后备、可携带性和路由器原语
        - 要求按集成深度拆分同期群留存，并证明托管路由比自建更省工程时间
      - - 故障切换和可用性支撑溢价
        - 云巨头和直连 API 不断加入自有路由和服务层级控制
        - 高
        - Bedrock 提示词路由、Azure 模型路由器和 OpenAI 式服务层级都会削弱托管路由的新鲜度
        - 要求提供专门对云原生路由和直连 API 自建的赢单 / 输单数据
      - - 专用路由器创造差异化价值
        - 竞争对手可以快速加入自己的判别、评分或策略层
        - 中
        - OpenRouter 推出 Pareto 和 Fusion，但护城河来自算法，而非独占供给
        - 验证 Pareto / Fusion 功能的附加率和实际支付意愿
      - - 中立性胜过打包的既有巨头
        - AWS 和 Microsoft 可以在大得多的合同里销售路由，并提供更强治理保证
        - 高
        - 云文档强调合规、治理和平台广度，初创公司很难照做
        - 测试 OpenRouter 在受监管或采购繁重账户中是否仍能赢
      - - 品类受益于模型碎片化
        - 多归属需求也会降低任一单一路由器的锁定
        - 中
        - RouterBench 认为，在成本、能力和延迟之间，没有单一模型始终最优
        - 衡量客户是替换或补充 OpenRouter，还是排他性地标准化到 OpenRouter
    notes: 严重度反映对定价权和续约耐久性的压力，不代表路由这个品类是否会存在。风险登记表有意围绕可能压缩 OpenRouter 抽成率或渠道杠杆的证据来写。
