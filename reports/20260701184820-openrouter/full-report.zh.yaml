      - number: '2.2'
        title: TAM/SAM/SOM 口径与保留矛盾
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 所处类别的公开市场测算高度依赖定义。最窄口径是 Intel Market Research 的 LLM middleware gateway 市场，隐含 2026 年多模型中间件收入仅
              $18.9M。更宽口径上升很快：Intel 的 AI API gateway 市场 2026 年达到 $0.85B；The Business Research Company 估算 LLM gateways
              2026 年为 $2.76B，更宽的 LLM gateway platform 市场 2026 年为 $4.23B；Research and Markets 则给出更宽 AI gateway 口径，2025
              年已达 $3.66B。这些估计不应被平均抹平。它们测量的边界不同，而且一个 TBRC 页面甚至保留了内部不一致：同一个 $11.01B 预测，在概览中称为 2030 年结果，在报告属性框中又称为 2035
              年预测。实务结论是，OpenRouter 的真实可服务市场不是整个 gateway 或 AI middleware 宇宙。更受证据约束的 2026 年 SAM 是托管多模型路由 SaaS
              的低数亿美元切片；扣除原生云、企业网关和自托管栈已经拿走的需求后，近期 SOM 更小。
