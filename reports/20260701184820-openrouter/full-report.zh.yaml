  - id: TR005
    title: 缓解措施与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
      - 尽调要求
    rows:
      - - 路由层可靠性
        - OpenRouter 自身引发的重大事故
        - 2026 年 2 月整改后，单季度发生超过一次由平台造成的重大宕机
        - 在根因趋势被证明修复前，将可靠性视为投资论点已破
        - 要求提供月度 Sev-1/Sev-2 日志、事后复盘和可用性 / SLO 历史
      - - 受监管数据合规
        - 证据显示合规路由必须失败放行，或离开获批司法辖区 / 提供商
        - 只要无法证明目标工作负载仅在 EU 处理、ZDR 或 data_collection-deny 行为
        - 将使用限制在非敏感工作负载，并下调企业端上行空间
        - 要求演示架构、日志和受监管流量样本审计证据
      - - 价格 / 抽成率压缩
        - AWS、Microsoft 或模型厂商扩张原生路由，同时出现降价或返利压力
        - 路由价格持续让步，却没有留存或增购收益抵消
        - 下调利润率假设，并要求更强留存证明
        - 要求提供 cohort 留存、混合抽成率，以及头部赢单 / 输单定价案例
      - - 计费完整性
        - credits 争议或失败请求误收费
        - 反复有投诉称，429 / 部分输出路径仍消耗 credits，且没有快速补救
        - 上调支持成本假设，并对毛利率做压力测试
        - 要求提供争议量、平均 credits 调整延迟和计费 QA 控制
      - - 提供商集中
        - 流量或支出过度依赖一个前沿模型家族
        - 任何单一提供商占流量或支出 >50%，且没有合同化兜底承诺
        - 施加集中度折价，并质疑路由防御性
        - 要求提供月度提供商组合仪表盘和合同灵活性摘要
      - - 合规披露准备度
        - 尽调中缺少独立安全 / 隐私材料
        - 无法在 NDA 下提供当前认证、渗透测试或子处理方文档
        - 暂停受监管或关键任务场景的投资判断
        - 要求提供完整信任资料包、审计报告和整改跟踪表
      - - 支付 / 账户依赖
        - Stripe、Coinbase 或认证提供商政策 / 服务变化影响开户或 credits
        - 只要核心外部服务引发暂停、结算中断或长时间登录宕机
        - 上调流失假设，并重新评估结账摩擦
        - 要求提供依赖图谱、兜底方案，以及计费 / 认证界面的事故响应
      - - 法律 / 执法态势
        - 出现新的隐私、AI 治理或 IP 挑战
        - 任何与路由、留存或输出相关的正式监管询问、禁令或重大诉讼
        - 在暴露边界确定前，暂停投资或要求重新定价
        - 交割前由律师完成诉讼、隐私、制裁和 AI 治理尽调
    notes: 这些门槛有意设计成可监控：它们帮助投资者区分 OpenRouter 的剩余风险只是运营噪音，还是投资论点应被暂停、重定价或判定破裂。
