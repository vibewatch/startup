  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与确认口径注意事项
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的公开资料支持一种混合路由平台收入模式，但无法给出已实现收入的清晰拆分。官方来源显示，公司围绕用量变现，而不是披露年度合同：客户可以预先购买积分，通过 OpenRouter 的统一 API
              路由推理，也可以选择把 BYOK 流量跑在同一控制平面上。最具体的官方费用不是按席位 SaaS 费，而是支付层经济性。OpenRouter 称，非加密货币充值收取 5.5% 费用，最低
              $0.80；加密货币充值收取 5.0% 固定费；BYOK 只有在每月前 1 million 次请求之后，才成为 5% 的变现杠杆。Stripe Projects 显示免费默认计划和按量付费升级路径；Sacra
              2025 年的研究估计，$100 million GMV 只对应 $5 million 年化收入，意味着大部分总支付量很可能流向上游供应商，而不是留在 OpenRouter
              损益表上。反过来，这带来真实的收入确认问题：积分在消耗前购买，已用积分和已购积分分开跟踪，公开记录没有解释报道收入是总积分销售额、净抽成率，还是某种递延收入式余额。收入路径看得见，会计政策看不见。
