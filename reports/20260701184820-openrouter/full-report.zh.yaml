        title: 耐久性、扩张与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个可信的先落地再扩张故事，但还不能给出耐久留存结论。正面看，OpenRouter 已经搭出真实组织在首次采用后会需要的界面：workspaces、按 workspace
              的密钥、组织角色、统一账单、按用户活动分析、企业预算、服务层级控制，以及 opt-in 数据处理设置。这些是扩张功能，不是业余项目的小便利。它们说明 OpenRouter
              想让客户从自助试验进入多团队部署。与此同时，缺失指标正是投资人承销客户质量前最想看的。公开资料没有 NRR、GRR、churn
              披露，没有合同期限披露，也没有集中度披露。负面证据在这里同样重要。TrueFoundry 的评论和定价分析描述了早期构建者与生产买方之间的清晰分裂：OpenRouter
              因统一模型访问和快速切换受到称赞，但也因支持响应、账户安全处理、工作流级支出控制、缺少公开 SLA 标准，以及组织进入受监管或高用量场景后出现的治理限制受到批评。OpenRouter 自己的 2026 年 2
              月故障复盘强化了同一点。公司透明并修复了 401-versus-503 行为，但事故仍削弱大买方需要的可靠性承诺。扩张可信，但没有续约数据和集中度细节，耐久性仍未证明。
