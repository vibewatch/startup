      - number: '7.3'
        title: 伙伴依赖、脱媒与经济压缩
        blocks:
          - type: paragraph
            body: >-
              OpenRouter
              依赖一整层交易对手方，而这些对象同时是供应商、政策制定者，有些情况下还是直接替代品。上游模型供应商仍决定许多客户最在意的硬约束：谁能处理数据、提示词是否可被留存或用于训练、适用哪些速率限制或配额，以及哪些条款约束输出所有权或服务暂停。OpenRouter
              可以绕开一部分故障，但无法消除对供应商政策的依赖。其条款称，如果客户违反供应商条款，或供应商要求采取行动，模型访问可能被暂停；路由文档也写明，only/order/ignore 和 data_collection
              过滤器等路由选择，是用韧性换控制。


              经济风险还被放大了，因为大型平台现在卖的是原生路由，而不只是原始模型端点。Amazon Bedrock 提供跨模型家族的提示词路由；Microsoft Foundry
              的模型路由器已经能在单一部署内按质量、成本和延迟优化。这让路由越来越像一个功能，而不是独立产品。再叠加 OpenAI 和 Google 的配额系统，即便上游约束在别处，OpenRouter
              也可能成为被责怪速度慢、被限流或成本波动的一方。


              认证、计费和支付通道也有更软但真实的伙伴依赖。状态页显示，Clerk 和 Bedrock 事件会在 OpenRouter 层浮现；条款页则把 Stripe 和 Coinbase
              法律协议接入了计费栈的一部分。这些都不意味着模式已经坏掉；它意味着投资人应假设利润率压力、支持摩擦和伙伴政策冲击是商业模式的常态，除非 OpenRouter 证明即便存在直接路由替代品，也能让买方保持忠诚。
