      - number: '1.4'
        title: 里程碑、风险信号与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 2026 年的里程碑节奏显示，公司正从路由工具快速走向更宽的基础设施平台。Workspaces 增加组织级控制，5 月发布重点把护栏和 PII 脱敏推入核心产品，图像 API
              扩展到媒体生成，6 月 MCP 发布又把 OpenRouter 直接带入编程 agent 工作流。这些发布增强了运营论点，因为产品从 API
              访问延伸到治理、工具和生态分发。但同一时期也暴露了最清楚的公开负面信号。OpenRouter 详细复盘了 2026 年 2 月两次与第三方缓存依赖有关的故障，包括客户侧 500 和误导性
              401。透明度是加分项，但事故仍削弱公司最核心的可靠性承诺。独立评论又加一层警示：TrueFoundry 对用户投诉的综合指向支持响应、账户安全处理，以及自主 agent
              工作负载下偏弱的硬预算控制。最后，第三方目录数据噪音很大，值得主动怀疑。一份归档 Tracxn 页面仍把公司描述为 Anguilla 基地、且仅由 Soma Capital 支持，这与后来的纽约申报证据和更广的
              2026 年投资人阵容直接冲突。总体看，公开故事可投、增长很快，但披露还不完整。
