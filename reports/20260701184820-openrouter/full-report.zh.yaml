  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 维度
      - 投资论点
      - 反论点
      - 什么会改变判断
    rows:
      - - 市场
        - 智能体系统需要跨多个提供商处理成本、信任和模型选择逻辑，模型路由因此正在长成真实品类。
        - 路由也可能一直只是大型云或开源栈里的功能，而不是可持久独立变现的利润池。
        - 证明企业买方会持续为路由和治理付费，而不是把它当作商品化胶水。
      - - 产品
        - OpenRouter 以中立控制平面切入：多提供商访问、故障切换和优化都实用。
        - 中立路由逻辑比独家算力或自有模型更容易复制。
        - 证明专有路由功能带来溢价赢单率和可量化付费意愿。
      - - 客户
        - 8M+ 用户和每周 25T tokens 说明漏斗顶端拉力强，采用真实存在。
        - 公开来源未拆分付费账户、企业客户标识或收入留存；使用量可能高估变现深度。
        - 提供付费客户数量、cohort 留存、企业客户占比和头部客户集中度。
      - - 财务
        - 抽成率机制、平台费和 BYOK 变现提供多条收入杠杆。
        - 唯一公开收入锚点已经陈旧，且相对当前估值很小；利润率质量仍不透明。
        - 提供当前收入、扣除提供商分成后的毛利率，以及现金消耗 / runway。
      - - 竞争
        - 多模型成为结构性常态，客户又在意可移植性，OpenRouter 因此受益。
        - 超大规模云厂商、Fireworks、Together 和自托管路由器可能压低价格，或拿走最有价值的工作负载。
        - 证明更大的对手没有侵蚀企业交易中的附加销售、定价或续约质量。
      - - 风险
        - 2026 年一轮强劲融资降低了短期偿付压力，也为商业化和可靠性建设提供资金。
        - 宕机、隐性成本投诉和未披露的优先条款，都可能伤害转化、留存或未来融资议价能力。
        - 披露 SLA 表现、支持成本结构，以及最新一轮的优先股条款栈。
    notes: 各行按影响估值的维度配对最强正反论据，而不是按泛泛的公司质量排序。
