      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的第一批用户通常是开发者、产品工程师或 AI 构建者，他们想用最快路径试验模型，不想管理一堆 SDK
              和供应商合同。用量扩大后，买方变宽。当公司需要配额、可观测性、故障转移、路由政策或跨团队标准化访问时，平台工程或 AI 基础设施负责人会变重要。在更大组织里，一旦 token 支出、部门级配额和
              chargeback 变得重要，财务或 IT 治理就会成为共同付费方。这个买方地图也解释了分层。开发者主导的初创公司和 AI 产品团队适合托管路由器，因为它们看重速度、广度和轻运维。相反，受监管企业、集中式
              API 平台团队，或必须混合内部与外部模型的组织，往往会评估完整 AI gateway 或自托管层。因此，采用路径从模型试验开始，走向团队级标准化；当 AI 用量从单一应用功能变成共享基础设施后，再走向集中治理。
