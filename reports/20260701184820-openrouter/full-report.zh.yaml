  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 方案 / 类别
      - 公开定价信号
      - 合同模式
      - 包含能力
      - 未知项 / 限制
      - 含义
    rows:
      - - OpenRouter
        - 服务层级展示 flex / priority 控制，但广义企业经济性未公开
        - 基于用量的 API，叠加企业条款
        - 供应商路由、故障切换和专用路由器
        - 实际企业折扣和赢单率数据未公开
        - 技术试用容易，大规模商业基准更难做
      - - Together AI
        - Serverless 按 token 定价且无最低消费；批处理折扣和专用端点
        - 可变用量走自助，较稳定或预留工作负载走销售辅助
        - 开放模型访问，加上更深基础设施选项
        - 专用定价和实际折扣未公开
        - 对可能从路由升级到托管基础设施的团队有吸引力
      - - Replicate
        - 清晰的按需付费表述和模型特定价格估算
        - 自助用量计费
        - 模型执行、微调和自定义部署
        - 未定位成中立路由合同
        - 适合实验和发布功能，对可用性抽象的直接性较弱
      - - Fireworks AI
        - Serverless 按 token 计费，按需部署按 GPU 秒计费
        - 自助加企业部署
        - 推理、训练和专用部署
        - 企业价目表和批量折扣未公开
        - 当性能和基础设施深度比中立性更重要时形成竞争
      - - Martian / LiteLLM
        - LiteLLM 显示询价和本地部署动作；Martian 未显示公开定价
        - LiteLLM 为开源加企业支持；Martian 为顾问式企业销售
        - 网关控制、路由、合规或自托管杠杆
        - 公开可比性有限，Martian 尤其如此
        - 当买方想要控制权或受监管工作流定制时，这些方案更有吸引力
      - - AWS / Azure 路由器
        - 定价嵌在云供应商模型定价、计算器和企业协议中
        - 云消费加企业采购
        - 路由叠加更广泛的平台治理和合规
        - 仅路由经济性很难从更广泛云支出中干净拆出
        - 当路由作为更大平台标准的一部分采购时，初创公司很难胜出
      - - OpenAI / Anthropic 直连 API + 内部自建
        - 公开 token 表、服务层级和企业附加项可见
        - 基于用量的 API，加上买方投入的内部工程
        - 原始模型访问、供应商原生层级，以及自定义编排空间
        - 买方必须在其上自建路由、故障切换和治理
        - 给第三方路由器设定透明度底线，也让多归属在经济上仍可信
