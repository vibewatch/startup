  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与价格支撑
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 确实赢得了投资人注意。公司在 2026 年 5 月宣布 $113M Series B，独立报道把该轮对应到约 $1.3B 投后估值。官方材料也显示真实使用势头：每周 25T token、超过
              8M 用户、接入 400+ 模型。这足以支撑严肃尽调，也解释了成长型投资人为什么想获得敞口。但它还不足以承销价格。公开备案轨迹仍然稀薄、滞后，并且围绕 2025 年 Form D，而不是当前经营报表。SEC
              材料没有披露当前收入、烧钱、现金、客户集中度或优先股经济条款；已审阅的公开记录也没有说明新一轮是否包括老股转让、参与型优先权或期权池扩张。实际含义是，市场在给强战略相关性和需求动能定价，而公开证据仍让核心价格支撑问题悬而未决。
