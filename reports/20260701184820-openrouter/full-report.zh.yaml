      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              管理层能见度集中在 Alex Atallah 身上。BusinessWire、TechCrunch 相邻报道和申报镜像都支持他是 CEO 兼联合创始人，申报文件也显示他担任董事。更难的是创始人名单是否完整。The
              SaaS News 把 Louis Vichy 列为联合创始人，但这条归因比 Alex Atallah 的记录薄，还没有强官方创始人页或广泛高管名单支撑。公开治理能见度同样窄。镜像 Form D 列出
              Anjney Midha
              为董事，但保留的公开来源没有给出完整董事会名单、委员会结构、观察员权利，或当前投资人附带的控制条款。因此，本章只能描述治理锚点，不能精确量化创始人控制。关键人依赖的故事仍然直观：Atallah
              看起来是产品愿景、融资和市场叙事的核心公开代言人；更宽公开高管梯队缺失，则带来继任与扩张尽调问题，管理层需要直接回答。
