      - number: '3.4'
        title: 切换成本、分发力量与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的护城河真实但有条件。产品有可信的控制平面楔子——供应商负载均衡、故障转移、flex 或 priority 定价层，以及 Pareto 和 Fusion
              等专用路由器——但护城河是软件逻辑，不是独家供给。因此，相邻基础设施厂商、hyperscaler 或开源 gateway 更容易复制足够多价值主张，从而压缩定价。最强分发优势属于 AWS 和
              Microsoft，因为路由可以搭上更宽云合同和企业治理要求。最强切换压力来自 LiteLLM 加内部自建框架，因为这些工具保留模型可移植性，让多归属成本很低。Martian 的 RouterBench
              逻辑也有双刃剑：它验证路由重要，也验证买方应在模型和供应商之间保持灵活。可能结果是一个结构性多归属类别，OpenRouter
              可以靠便利性和速度赢单，但可能难以拥有整个栈或形成持久锁定。关键尽调测试是，溢价路由功能能否转化为可衡量的商业耐久性：多供应商客户留存更高，客户愿意为 Pareto 或 Fusion
              额外付费，以及当买方可以默认选择捆绑云或自托管 gateway 时，赢率仍能守住。没有这些证明，路由便利性仍有价值，但经济上可被替代。
