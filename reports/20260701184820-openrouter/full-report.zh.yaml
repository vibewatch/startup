  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、计入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 并不覆盖整个生成式 AI 软件栈。最贴近它的市场，是位于应用与外部模型供应商之间的托管多模型路由层：统一
              API、选择供应商、设置回退，并越来越多地加入缓存、分析和计费控制。这个边界比简单模型选择器更宽，但比完整企业 AI 控制平面更窄。计入支出因此包括第三方模型上的统一 API
              访问、供应商路由、故障转移、缓存、用量分析和合并账单。排除支出包括训练和模型创建、GPU 硬件、与 AI 推理无关的通用企业 API 项目，以及终端应用 AI 收入。邻近集合很重要，因为 OpenRouter
              对抗的是几种现状：开发者可以直接调用供应商；平台团队可以扩展 Cloudflare、Kong 或 Azure API Management；云原生团队可以留在 AWS Bedrock 或 Microsoft
              Foundry；自托管团队可以运行 LiteLLM。因此，OpenRouter 真正可服务的市场，是那些看重快速多供应商接入、但不想承担自托管或深度基础设施所有权的那一片。
