      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论在需求和融资上正面，但底层单位经济性仍只有中等置信度。OpenRouter 显然有真实市场拉力：token 快速增长、多供应商相关性，以及足够的投资人需求来完成一笔大型战略 B
              轮。产品也有几条变现杠杆——积分购买费、BYOK 超额、企业控制，以及潜在溢价支持——这些可能随用量扩大而叠加。问题是，关键承销输出没有一个公开。没有披露
              ARR，没有自助式与企业之间的公开收入结构，没有供应商成本穿透拆分，没有毛利率、现金消耗、资金续航、客户集中度披露，也没有留存数据。负面证据同样重要。官方故障复盘和独立评论显示，一旦生产工作负载超过试验阶段，支持质量、可靠性工程和治理缺口会直接影响收入质量。这不意味着
              OpenRouter 没有吸引力；它意味着下一步尽调不是再看一篇新闻稿，而是向管理层要数据。在把公司承销为持久基础设施、而不是快速增长的经纪层之前，投资人应要求收入确认备忘录、当前
              P&L、现金消耗和现金计划、企业合同原型、cohort 留存、头部客户暴露，以及维持免费模型在线的经济性。在此之前，OpenRouter 财务上有希望，但还没有完全透明。
