  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Cloudflare
        - 公开市值 / TTM 收入
        - 约 40.9x 收入
        - 显示高端、受企业信任的控制平面能拿到怎样的估值。
        - Cloudflare 是范围更广的安全与网络软件公司，披露更充分，护城河也完全不同。
      - - Datadog
        - 公开市值 / TTM 收入
        - 约 25.6x 收入
        - 可作为可观测性和平台软件质量的参考基准。
        - 作为上市软件平台，Datadog 更多元、更成熟。
      - - Snowflake
        - 公开市值 / TTM 收入
        - 约 19.3x 收入
        - 可参照仍享受溢价的高增长数据基础设施。
        - 不是路由业务；经济性和产品范围不同。
      - - CoreWeave
        - 公开市值 / TTM 收入
        - 约 9.3x 收入
        - 当前最接近的公开 AI 基础设施热度基准。
        - 拥有算力和训练基础设施，因此不是中立控制平面。
      - - GitLab
        - 公开市值 / TTM 收入
        - 约 5.7x 收入
        - 作为开发者基础设施，可参考更常态化的软件倍数。
        - 并非专门面向 AI 路由，且估值已按上市成熟度定价。
      - - Akamai / Fastly
        - 公开市值 / TTM 收入
        - 约 3.9x / 约 4.5x 收入
        - 用来校验低倍数边缘与交付基础设施的下行情形。
        - 它们是成熟 CDN / 边缘厂商，不是模型路由平台。
      - - Together AI
        - 私有公司官方融资状态
        - 2026 年宣布 $800M Series C 轮；所审阅官方来源未显示估值。
        - 证实 2026 年投资人仍有胃口投 AI 基础设施同类公司。
        - 官方来源在所审阅页面未披露估值或收入。
      - - Fireworks AI
        - 私有公司官方融资状态
        - 2026 年估值 $4B，年化收入 >$280M，且此前有 $552M Series B 轮。
        - 是本组中信息量最大的已披露私有 AI 基础设施参照。
        - Fireworks 拥有更多基础设施栈，不是只做中立路由的业务。
