chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 把自己定位成基础设施，而不是消费应用或模型实验室。从官网、快速入门 文档、投资人文案到企业营销材料，公司都反复使用同一套说法：它是 LLM 的统一接口，也是 AI 模型交易所；一个
              API、一个计费层、一套路由网络，横跨数百个模型和数十家供应商。这个定位很关键，因为它同时解释客户承诺和商业模式。客户买的是摆脱直接厂商锁定的抽象层，也买自动故障转移、路由优化、治理控制和用量报告。企业层现在已经超过基础路由。Workspaces、零数据保留控制、支出上限、供应商白名单、护栏和可观测性都表明，OpenRouter
              想做生产 AI 流量的控制平面，而不是给开发者用的便利封装。法律和运营足迹比组织架构更清楚：公开条款和镜像 Form D 指向 OpenRouter, Inc.，一家带纽约地址的 Delaware
              公司；招聘页则把团队描述成远程优先、在美国各地招聘的小团队。这个组合说明，公司仍然精简，却在远超公开员工规模所暗示的用量层级上出售基础设施。
