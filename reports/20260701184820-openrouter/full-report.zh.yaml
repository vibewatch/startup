        title: GTM 路径、公开牵引力与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              GTM 路径看起来获客阶段是产品驱动，扩张阶段逐步转向企业驱动。OpenRouter 官方和合作伙伴材料强调一个 API key、兼容 OpenAI 的
              endpoint、支出可见性、路由权限、护栏、workspaces 和 analytics；这些都降低初始集成摩擦，让产品在采购前就容易测试。公开牵引力故事在广度上很强：OpenRouter 称其服务超过 8
              million 用户或开发者，覆盖超过 400 个模型，并在六个月内把每周 token 量从 5 trillion 扩到 25 trillion。Stripe Projects
              和免费层强化了漏斗从自助开始。Workspaces、analytics、用户活动 endpoints 和预算 API
              显示产品正进入多团队或组织级使用，这是公开资料里最接近扩张收入的代理指标。缺失的是实际效率数学。公开资料没有
              CAC、平均合同价值、赢率、净留存或回本期披露。用户数也没有拆成付费客户、企业组织或仅注册开发者。独立评论来源进一步表明，免费层 上限、支持响应和治理缺口，会在自主 agent
              或生产工作负载扩张后变成转化摩擦。正确解读是，OpenRouter 的顶层漏斗异常强，但变现 cohort 的质量仍不透明。
