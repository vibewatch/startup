  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块范围
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的产品最好理解为插在应用或 agent 与众多上游模型供应商之间的路由和控制平面。开发者不必分别集成 OpenAI、Anthropic、Google、xAI 或开放模型主机，可以指向一个兼容
              OpenAI 的 endpoint，并在不重写应用结构的情况下切换模型选择。快速入门文档也让商业包装更清楚：团队可以留在原始 REST 以获得最大控制，也可以采用轻量客户端 SDK
              获得类型安全和分页，或在需要工具循环和状态管理时上移到 Agent SDK。从客户工作流看，产品不只是更便宜的 token
              访问。它把评估、供应商切换和多模型试验压缩进一个运营界面。模块地图现在已经从文本推理延伸到模型发现、排名、服务器工具、结构化输出、专用 图像 API、语音和转录，以及 workspace 治理。这种宽度让
              OpenRouter 更接近 AI 连接基础设施，而不是狭义代理，尽管已审阅公开材料仍强调托管云访问，而不是私有部署。
