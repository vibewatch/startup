  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与解决方案类型
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 面对的不是一个干净的同业集合。市场至少分成五种替代路径来完成同一个买方任务。第一类是 LiteLLM 和 Martian
              这样的中立路由层，承诺模型选择、故障转移或控制平面抽象，但不一定拥有底层算力。第二类是 Together AI、Replicate 和 Fireworks
              这样的推理云，销售模型访问，也打包模型托管、训练或专用基础设施。第三类是 AWS Bedrock 和 Microsoft Foundry 内的云巨头路由，路由被打包进更宽的安全、采购和治理栈。第四类是
              OpenAI 和 Anthropic 的直接供应商 API，定价透明，但把路由逻辑推回给客户。第五类是用 LangChain 和 LlamaIndex 等框架内部自建。这种结构很重要，因为 OpenRouter
              通常是在和一种栈选择竞争，而不只是和另一个创业公司标识竞争。
