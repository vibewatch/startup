      - number: '4.3'
        title: 成本结构、营运资本与资本充足性
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的成本结构在硬件资本开支上应明显轻于模型实验室，但这不等于一个简单的软件利润率故事。公司自己的文档把平台框定为 Cloudflare Workers、边缘缓存、供应商路由、回退逻辑、预算和
              analytics，而不是自有 GPU 或基础模型训练。这指向低于推理供应商或实验室的资本强度。同时，非 BYOK 流量看起来仍会穿透上游模型成本，意味着毛利率取决于 OpenRouter 能通过平台费、BYOK
              超额、企业支持和其他未披露合同经济性留下多少。可靠性也有真实交付成本：低余额会触发额外数据库检查，主路由失败会增加延迟，公司称其补贴部分免费模型 容量，2026 年 2 月故障还迫使团队做熔断器和回退缓存
              工作。营运资本可能有利，因为客户先预付积分再消耗；但同一个钱包模式也带来递延服务和总额法 / 净额法判断。$113 million B 轮和约 $1.3 billion
              估值信号之后，资本充足性方向上较强，但申报记录稀疏且滞后。可见 SEC 材料是一份 2025 年 Form D，只显示部分售出的豁免发行且没有收入披露，不是投资人完整承销需要的当前现金、现金消耗或资金续航。
