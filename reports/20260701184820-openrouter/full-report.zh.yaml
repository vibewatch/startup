      - number: '7.4'
        title: 缓释措施、监控指标、推翻投资论点的触发点与尽调问题
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 并没有无视这些风险；公开产品界面显示，公司在认真把缓释能力产品化。客户可以强制零数据留存路由、限制供应商、设置每个密钥和每个工作区的支出上限、让受监管工作负载走仅限 EU
              的端点，并在流量到达供应商前阻断或脱敏提示词注入模式和敏感输入。宕机复盘也记录了具体修复动作，例如熔断器、更好的错误码和回退缓存。对承销判断来说，这些是有意义的正面因素，因为它们显示公司在把风险教训转成产品功能，而不是只靠流程兜底。


              关键投资问题不是有没有缓释措施，而是这些措施是否足够默认、采用率是否足够高、是否足够可被独立审计，从而改变企业采购行为。多项控制只限企业版，一些需要主动启用，还有一些依赖客户纪律来正确配置。公开材料也留下重要盲点：按供应商的集中度、公开正常运行时间
              / SLO 历史、独立安全证明，以及一套完整的尽调可用披露包，从外部看仍不完整。


              因此，监控集合要保持具体。OpenRouter 自身 Sev-1 事故反复出现；证据显示受监管流量无法留在获批司法辖区或供应商内；账单抵扣争议持续；或超大云厂商原生路由器带来的赢单 /
              输单压力上升，都会伤到投资论点。在承销关键任务或受监管采用前，投资人应在 NDA 下索取供应商集中度、SLA / SLO 数据、分处理方和认证细节，以及历史账单抵扣调整 / 争议指标。
