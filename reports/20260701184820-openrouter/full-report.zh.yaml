  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - OpenRouter 方案
      - 公开收益信号
      - 限制
    rows:
      - - 快速比较前沿模型
        - 每个提供商都有单独密钥、端点和 schema
        - 统一端点，加模型目录和排名
        - 无需重构核心应用逻辑，就能试验和切换模型
        - 底层模型质量和提供商特性仍有差异
      - - 构建使用工具的 agent
        - 提供商专属函数 schema 和脆弱编排循环
        - 标准化工具调用，加 Agent SDK 循环和状态
        - 共享工具和消息模式可跨模型复用
        - 工具可靠性仍取决于 schema 质量和提供商行为
      - - 提供商出问题时保持应用在线
        - 单一提供商宕机和 429 上限会变成用户可见错误
        - 自动提供商故障转移、可选模型 fallback 和零 completion 保险
        - 重试设计比直接集成更便宜，也更有韧性
        - 过窄白名单会减少可用恢复路径
      - - 降低重复推理成本
        - 回归测试和重复 prompt 会让同一工作重复计费
        - OpenRouter 层响应缓存
        - 相同且成功的请求可即时返回，且计费使用量为零
        - 工具调用和错误响应不可缓存
      - - 为 agent 增加实时 web 上下文
        - 团队必须自建或托管搜索和抓取工具
        - 服务器端 web 搜索和 web fetch 工具
        - 模型可在单次请求流程中决定何时调用实时信息工具
        - 服务器端工具仍处 beta，需要治理控制
      - - 集中隐私和支出控制
        - 每个上游提供商的日志和政策界面都不同
        - 工作区护栏、ZDR 视图、提供商日志和 BYOK 管理
        - 治理成为提供商集合之上的一层
        - 公开保障证据比功能界面薄
