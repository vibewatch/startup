  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议基于一条简单链条：品类相关性和使用证明确实存在，但经济性不透明和价格支撑缺口仍主导承销判断。
    data:
      nodes:
        - id: market
          label: 路由品类重要
          detail: IDC 和市场报告把模型路由与网关视作真实且不断增长的控制平面问题。
        - id: usage
          label: OpenRouter 已有真实牵引力
          detail: OpenRouter 披露 8M+ 用户、400+ 模型和每周 25T tokens。
        - id: economics
          label: 经济性仍不透明
          detail: 公开来源未披露当前收入、利润率、留存或集中度。
        - id: price
          label: 明面价格要求高
          detail: 据报 $1.3B 估值需要远高于公开材料披露的收入来支撑。
        - id: decision
          label: 建议：继续研究
          detail: 只有拿到私有经济性数据，或入口价格大幅改善，才应推进。
      edges:
        - from: market
          to: usage
          label: 支撑关注
        - from: usage
          to: economics
          label: 无法解决
        - from: economics
          to: price
          label: 削弱
        - from: price
          to: decision
          label: 驱动
    claimRefs:
      - CV004
      - CV017
      - CV032
      - CV034
      - CV041
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 相关公开可比公司的收入倍数，从低个位数基础设施公司到高溢价软件控制平面不等；多数证据相关公司集中在 Cloudflare 这个异常值之下。
    data:
