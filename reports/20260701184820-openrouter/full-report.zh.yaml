      - number: '8.3'
        title: 情景框架与投资判断
        blocks:
          - type: paragraph
            body: >-
              情景测算解释了为什么建议不是买入。在 $1.3B 入场价下，OpenRouter 仅要接近 25x 收入倍数，就需要约 $52M 收入；若要按 18x 交易，需要超过 $72M；若要落入较低溢价基础设施公司常见的
              9x 倍数，则需要约 $144M。公开档案里唯一接近收入的锚，是 Sacra 在 2025 年 5 月估算的 $5M
              年化收入；如果没有实质变化，当前估值看起来极其拉伸。当然，实质变化可能已经发生；官方使用增长提示了这种可能。但证明它所需的证据是私有的，不是公开的。因此，牛市情景可信但未验证。基本情景是，OpenRouter
              具有战略重要性、商业前景不错，但仍过于不透明，难以形成价格驱动的确信。熊市情景是，该业务的经济属性更接近路由经纪商，而不是高溢价软件平台。这个组合支持继续研究的建议、中等信心、高风险和估值拉伸判断。
