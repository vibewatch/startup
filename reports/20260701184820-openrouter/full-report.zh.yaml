      - number: '3.3'
        title: 巨头、开源与内部自建
        blocks:
          - type: paragraph
            body: >-
              最有力的替代品不一定是风投支持的同业。AWS 和 Microsoft 现在在更宽 AI 平台中营销路由，并把路由与治理、采购和信任姿态捆在一起，小型路由器很难匹配。Bedrock prompt routing
              留在模型家族内，Azure model router 留在符合条件的已部署模型和 data-zone 规则内，所以二者都不如 OpenRouter 中立；但在既有云资产内，二者更容易被合理化。光谱另一端，直接
              API 和开源框架让自建越来越可行。OpenAI 和 Anthropic 公开 token 定价和服务层级，LangChain 和 LlamaIndex 暴露路由或可移植性原语。LiteLLM
              把这些世界接起来：它在 100+ 模型上标准化 OpenAI 格式，并加入 fallback、预算和负载均衡，实质性降低离开任何托管路由器的迁移摩擦。
