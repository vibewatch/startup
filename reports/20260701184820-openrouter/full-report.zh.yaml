        title: 退出准备度、最终尽调问题与推翻投资论点的触发点
        blocks:
          - type: paragraph
            body: >-
              退出准备度不只看 OpenRouter 能否增长，还要看未来买方或公开市场能否从今天的位置承销耐久经济性。新投资人若按报道估值入场，通常会希望多年持有，并看到通向远高于 $3.9B
              价值的可信路径，才能在后续稀释前拿到 3x
              总回报。这条路径并非不可能，但它需要公开档案里仍缺失的证据：当前年化收入、扣除供应商分成后的毛利率、留存、集中度、支持经济性，以及确切优先权栈。因此，最终尽调问题很直接，也关乎投资成败。若管理层能提供这些项目，并且它们证实高溢价软件经济性，判断可以上调。若材料反而显示低毛利、弱留存、反复宕机或惩罚性优先权栈，投资论点会很快破裂。投资人应把这些数据请求和终止触发点视为核心估值工作，而不是外围确认性尽调。
