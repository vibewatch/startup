  - id: TU001
    title: 客户分群表
    columns:
      - 客群
      - 买方 / 用户 / 付款方
      - 地域 / 垂直行业
      - 典型用例
      - 证据和规模信号
      - 缺口 / 含义
    rows:
      - - 个人开发者和独立构建者
        - 自助模式下，买方 = 用户 = 付款方
        - 全球；公开证据集中在软件场景
        - 快速比较模型、试提示词、使用免费模型、一把密钥接入
        - Series B 轮公告提到 8M+ 开发者；Aider 和 Stripe Projects 强调快速设置与免费计划试用
        - 漏斗顶部很强，但公开证据未说明有多少转化为长期付费账户
      - - 初创公司产品和 AI 团队
        - 工程负责人或创始人购买，开发者使用，公司卡或额度付款
        - 明确提到 AI-native 初创公司；公开地域细节很少
        - 无需接入多个提供商，就把多模型推理嵌入产品
        - Business Wire 称 AI-native 初创公司在使用 OpenRouter；TrueFoundry 称这一阶段看重快速切换模型和降低密钥管理负担
        - 初创公司需求真实存在，但收入分层不可见
      - - 嵌入式工具供应商和框架
        - 平台维护者或产品团队购买；终端用户通过工具消费；终端客户或供应商可能付款
        - 开发者工具垂直；具名证据主要来自编程和 agent 生态
        - 为编程 agent、中间件、IDE 和开源框架路由 LLM 流量
        - Roo Code、OpenHands、Aider 和 LiteLLM 都记录了对 OpenRouter 的一等支持
        - 这是高信号采用证据，但也可能造成渠道依赖
      - - 多团队组织
        - 工程、平台或 AI 运营负责人购买；多个团队使用；统一账单付款
        - 跨团队内部 AI 部署；具体垂直行业组合未披露
        - 在一个账户下分离团队、项目和部署阶段，并套用共同治理
        - Workspaces 文档增加了组织角色、共享账单、用户分析和工作区控制
        - 展示了扩张路径，但未说明实际有多少组织在使用
      - - 企业或受监管买方
        - 采购、平台或安全买方付款；运维和应用团队使用
        - 大型企业被笼统提及；按行业拆分的变现组合不公开
        - 受治理的生产推理，带支出可见性、隐私控制和协商支持
