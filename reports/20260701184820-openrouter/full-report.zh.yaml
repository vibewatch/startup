      - - 计划资金用途
        - 基础设施扩容、企业能力、路由、治理和优化
        - 高
        - 说明可靠性和企业工具仍是支出重点
        - 按产品、基础设施和 GTM 提供未来 12-24 个月支出计划
      - - 可见 SEC 豁免发行披露
        - 2025 年 Form D 显示发行 $47.6M、售出 $29.6M，首次销售为 2025 年 5 月 27 日，30 名投资者
        - 高
        - 展示一次历史融资事件，但未呈现当前轮次的完整经济条款
        - 将 Form D 线索与更完整的私募融资时间线对齐
      - - 手头现金
        - null
        - 低
        - 没有现金余额，就无法把资本充足性换算成续航月数
        - 提供最近月末现金和受限现金余额
      - - 净烧钱
        - null
        - 低
        - 烧钱速度把融资额转化为生存时间，也决定下一轮融资紧迫性
        - 提供月度净烧钱，以及可靠性和企业团队招聘后的烧钱驱动因素
      - - 续航月数
        - null
        - 低
        - 评估快速增长基础设施业务的融资依赖时，这一指标很关键
        - 提供基准、下行情境和拉伸情境的续航月数
      - - 债务或其他融资义务
        - null
        - 低
        - 风险债、云承诺或预留容量会显著改变风险
        - 确认是否存在债务、最低云用量承诺或容量预购义务
    notes: 公开融资支持很强，但现金、烧钱、债务和续航完全未披露，这是资本充足性无法从方向性判断走向可承销结论的主因。
