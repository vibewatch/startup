      - number: '8.2'
        title: 可比基准与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最好的公开基准并不是完美同业，但仍可用来框定纪律。Cloudflare 和 Datadog
              展示了当投资人能看到耐久增长和披露财务时，受企业信任的软件控制平面可以拿到怎样的溢价。Snowflake、CoreWeave、GitLab、Fastly 和 Akamai
              则说明，当业务看起来更偏基础设施、更成熟或结构性利润率更低时，倍数会跌多远。放在这条光谱上，OpenRouter
              显然有战略相关性，但其公开披露更接近不透明一端，而不是高溢价软件一端。私有市场参照也讲同一个故事。Together AI 和 Fireworks 在 2026 年都融了大轮，但 Fireworks 还披露了
              $4B 估值和超过 $280M 的年化收入，这种披露水平和规模是 OpenRouter 公开档案无法匹配的。因此入场纪律很重要：如果没有私下证据证明 OpenRouter
              已把使用量转化为收入质量，当前头部价格就是让投资人在关键经济指标可见前先为上行付费。
