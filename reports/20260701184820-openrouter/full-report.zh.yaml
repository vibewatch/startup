      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 客户最强的公开证据是用量增长的广度，而不是一长串企业案例。官方和第三方 B 轮材料在核心轨迹上高度一致：每周流量在六个月内从 5 trillion tokens 升到 25 trillion
              tokens，月度量达到约 100 trillion tokens，平台称覆盖超过 400 个模型、拥有超过 8 million 用户或开发者。Sacra 2025 年研究给了一个有用的早期锚点，估算公司从
              2024 年底约 $19 million 年化支出和 $1 million 年化收入，跃升到 2025 年 5 月约 $100 million 年化 GMV 和 $5 million
              年化收入。这是真实采用动能。资料中更薄的是具名证明。公开、直接客户证据主要由开发者工具文档主导，而不是经典企业 标杆客户案例。Roo Code、OpenHands、Aider 和 LiteLLM 都维护明确的
              OpenRouter 集成页面；Product Hunt 归档评论还加入来自 involve.me、Clado 和 Agents Base 的具名创作者 证言。这些都是可信证据，说明 OpenRouter
              确实嵌入活跃工作流，尤其是编程和自主 agent 工作流，而且至少有部分客户超过玩具实验阶段。但这仍不同于披露的 Fortune 500
              生产部署，后者还应带有续约历史和合同经济性。正确解读是，OpenRouter 有丰富用量信号和不错的具名开发者工具证明，但直接企业客户证明比融资叙事更薄。
