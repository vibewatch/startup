  - id: FM001
    title: 市场规模测算视角（TAM / SAM / SOM 金字塔）
    type: pyramid
    layout: standard
    summary: OpenRouter 的现实市场从宽泛网关和控制平面收入，收窄到小得多的托管路由 SaaS 切片，再收窄到更小、可由独立厂商赢下的池子。
    data:
      nodes:
        - id: tam
          label: TAM — 宽口径 AI 网关 / LLM 网关视角：~$0.85B-$4.23B（2026）
          detail: 外层边界横跨 AI API 网关、LLM 网关和网关平台估算；仍比 OpenRouter 更宽，因为许多研究纳入硬件、服务或本地部署控制平面。
        - id: sam
          label: SAM — 托管多模型路由 SaaS：~$0.20B-$1.00B（2026 估）
          detail: 受证据约束的切片，覆盖第三方托管路由、缓存、故障切换和可观测性，但不包括完整的企业自托管网关栈。
        - id: som
          label: SOM — 独立托管路由器切片：~$0.03B-$0.15B（近期估）
          detail: 在原生云、API 网关既有厂商和自托管平台吸收治理重需求之后，OpenRouter 这类厂商有望拿到的部分。
    claimRefs:
