      - number: '5.4'
        title: 信任、隐私、支持与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              信任和治理在产品里很可见，但风险没有完全解除。正面看，OpenRouter 发布了供应商级训练和留存披露、EU routing、ZDR 感知 endpoint 预览、支出和白名单控制、提示词注入阻断、PII
              脱敏，以及仅管理员可见的输入输出日志，且使用加密存储。Zero completion insurance 和自动供应商故障转移也显示，成本保护和可用性
              被当作产品功能，而不只是支持承诺。开放尽调项同样重要。日志留存和 EU routing
              限制意味着，隐私行为仍取决于功能开关和流量路径。供应商留存偏好有披露，但路由政策不会自动强制执行。独立评论也提示生产阶段围绕支持速度和治理深度的担忧。最重要的是，已审阅公开材料没有验证公开 SLA、SOC 2 或
              ISO 27001 等第三方审计包，也没有公开 VPC 或自托管部署架构。现有证据支持一个面向成熟开发者的可信云路由层，但还不能完全关闭企业保证和支持义务问题。
