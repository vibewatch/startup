  - id: TV005
    title: 打破投资论点与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 如何击穿论点
      - 行动含义
    rows:
      - - 收入质量低于预期
        - 当前收入运行率或利润率结构更接近低抽佣率经纪中介经济性，而不是高端软件经济性。
        - 支付高端控制平面倍数的理由被击穿。
        - 退出，或大幅下调估值预期。
      - - 留存 / 集中度风险
        - NRR、客户流失或头部客户集中度显示企业客户基础脆弱。
        - 削弱路由层的耐久性，并压窄退出可选路径。
        - 暂停投资测算，直到客户质量被证明。
      - - 可靠性问题反复
        - 在企业信任建立前，又出现一组严重宕机或 SLA 失效，影响生产客户。
        - 伤害投资人愿意付钱的核心价值主张：可靠性和路由质量。
        - 立即下调护城河判断和可比估值区间。
      - - 优先股条款栈苛刻
        - 最新股权结构条款包含投资人保护、参与权或二级出售组合，实质性压低普通股等价上行空间。
        - 即使名义估值不变，实际回报潜力也会下降。
        - 重新定价，或放弃交易。
      - - 竞争胜率坍塌
        - 超大规模云厂商、Fireworks 或自托管路由器持续赢走最高价值工作负载。
        - 说明该品类仍会多宿主，OpenRouter 无法守住高端抽佣率。
        - 将判断从平台溢价下调为商品化路由工具。
    notes: 触发因素都与估值直接相关：每一项都会改变倍数或稀释计算，而不只是改变定性叙事。
    claimRefs:
      - CV041
      - CV042
      - CV044
      - CV046
      - CV047
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方或尽调路径
    rows:
      - - 当前收入 / ARR
        - 最新月度收入和年化收入，按自助、企业、路由量和 BYOK 变现拆分。
        - 用来检验 $1.3B 价格落在合理可比区间内还是区间外。
        - 向 CFO 或财务资料室索取。
      - - 扣除模型供应商分成后的毛利率
        - 按流量类型拆分贡献毛利率，包括免费层补贴和支持负担。
        - 决定业务更像高端软件、支付，还是薄利中介。
        - 财务 + 运营工作流。
      - - 留存与扩张
        - 毛留存、NRR、分群曲线和付费账户分层。
        - 没有这些，使用量增长仍可能掩盖变现后的耐久性不足。
        - 向收入运营 / 董事会材料索取。
      - - 股权结构和轮次条款
        - Series B 轮优先权栈、参与权、反稀释、期权池调整，以及任何二级出售成分。
        - 仅看名义估值不足以判断普通股等价上行空间。
        - 法务尽调和股权结构审阅。
      - - 客户集中度
        - 按收入排名的前 10 / 前 20 大客户，以及任何超大规模云厂商或渠道依赖。
        - 集中度会压缩退出质量，并抬高续约风险。
        - 客户分析 + 销售负责人。
      - - 可靠性和支持经济性
        - SLA 表现、支持人员配置模式、宕机补救成本，以及企业支持附加率。
        - 可靠性是产品承诺的一部分，守住它可能很贵。
        - 工程 / 支持运营尽调。
    notes: 每项索取都在补一个影响估值的关键缺口，而不是泛泛尽调愿望清单。
    claimRefs:
      - CV008
      - CV010
      - CV041
      - CV042
      - CV045
