  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对承销判断的影响
      - 具体尽调路径
    rows:
      - - ARR / 确认收入增长
        - 阻断估值倍数、回收期和增长效率承销判断
        - 索取月度经常性 / 非经常性收入桥，以及过去 12 个月确认收入
      - - 总额法 vs 净额法收入确认政策
        - 不清楚额度销售、提供商转付和钱包余额是否高估经济收入
        - 索取会计备忘录和审计师对主要责任人 vs 代理人处理及递延收入的意见
      - - 毛利率和提供商 COGS
        - 无法判断该模式更像高毛利 SaaS，还是更薄的经纪经济性
        - 索取按收入流拆分的毛利率和提供商支付占比
      - - 现金、烧钱和续航
        - 尽管有大额 Series B，资本充足性判断仍不完整
        - 索取最新现金余额、烧钱趋势和 24 个月运营计划
      - - 企业合同组合和实际定价
        - 没有合同原型，就无法把企业价值获取与自助服务费用拆开
        - 审阅近期企业订单、最低承诺、折扣和支持义务
      - - NRR / 流失 / cohort 扩张
        - 用来检验工作区和治理功能是否真正带来持久扩张
        - 索取 cohort 留存表和加购 / 降级瀑布图
      - - 客户集中度
        - 路由层看起来覆盖很广，但仍可能依赖少数高消费客户
        - 索取前 10 大客户收入占比，以及按提供商或模型家族拆分的支出集中度
      - - 免费层补贴经济性
        - 支持免费模型可能促进获客；若转化弱，也会吃掉毛利
        - 索取补贴支出、免费到付费转化，以及按获客 cohort 拆分的回收期
    notes: 这些是最低限度缺失字段；有了它们，OpenRouter 才能从强需求故事走向可融资的运营模型。
