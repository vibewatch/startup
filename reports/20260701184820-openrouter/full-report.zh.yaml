              在直接和相邻同业中，最重要差别是供应商卖的是路由中立性，还是更宽的基础设施所有权。买方明确想要多供应商可用性、故障转移和模型选择逻辑，又不想把工作负载迁到单一模型主机时，OpenRouter 最强。LiteLLM
              和 Martian 从不同角度攻同一编排层：LiteLLM 靠开源平台工具，Martian 靠企业路由加合规自动化。Together 和 Fireworks
              的竞争方式不同。两者都给开发者自助用量，但会把更大或更稳定的需求引向更深的基础设施足迹，包括专用 endpoints、按需部署或训练。Replicate
              更偏运行时和市场替代，适合快速交付模型驱动功能，但与中立路由器的直接等同性更低。定价透明度不均：直接 API、Replicate、Fireworks 和 Together serverless
