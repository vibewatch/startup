        title: 客户分层、购买中心与核心工作负载
        blocks:
          - type: paragraph
            body: >-
              OpenRouter 的客户故事从开发者开始，但公开资料显示，这个标题下面至少有四种不同经济动线。官方材料反复描述一个面向开发者和企业的 API；workspace 和 Stripe Projects
              文档则补足了随着用量成熟，买方、用户和付费方如何分离。个人构建者和初创团队看起来是最容易进入的顶层漏斗：他们可以快速开通访问、比较多个模型，并避免管理多个供应商 SDK 或密钥。下一段是嵌入式工具——Roo
              Code、OpenHands、Aider 和 LiteLLM 等编程 agents 与中间件供应商，它们明确记录支持 OpenRouter。这些工具很重要，因为它们既是客户也是渠道，不经过传统采购周期就把
              OpenRouter 拉进编程工作流。再往上是组织买方。Workspaces、用户活动分析、隐私设置、服务层级和 workspace 预算都说明，OpenRouter
              正试图把最初的自助动线转成多团队治理和支出管理。公开证据在地区和垂直结构上远比产品形态薄：最清楚的地理信号只是“全球用户”，最清楚的垂直信号则是公开证据集中在软件、agent 工具和其他 AI 原生
              工作负载。因此，本章可以有信心地绘制买方、用户和付费方分层，但还无法量化按地域或行业划分的变现需求。
