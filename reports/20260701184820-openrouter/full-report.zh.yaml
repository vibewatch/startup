      - number: '7.2'
        title: 运营、安全与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              运营上，OpenRouter 最严重的风险是自己控制平面失效。2026 年 2 月 17 日和 19 日的复盘显示，第三方缓存依赖故障拖累了所有 API 入口，先是 500
              错误，随后缓存失效把过多查询推向数据库，又表现成误导性的 401 认证错误。公司自己的复盘称，第二次宕机证明根因是缓存层，而不只是并发拒绝服务事件。这个信号在结构上很关键，因为 OpenRouter
              的全部价值主张，就是让 AI 访问比接任何单一直接供应商更可靠。


              更窄的状态事件进一步说明，问题不止一个根因。OpenRouter 披露过 Clerk 认证事件，影响登录和账户访问；Amazon Bedrock 宕机并传导到平台；另有一次覆盖聊天和生成 API 的 401
              错误事件；还有一次近五小时日志事件，延迟了预算和账单事件。与此同时，OpenRouter
              的路由文档说，供应商故障切换默认开启，但模型回退需要主动启用；出于合规原因限制供应商，会缩小可回退集合。换句话说，吸引受监管买方的同一套控制，也可能在上游系统失效时减少恢复路径。


              公司确实有可信的缓释手段：熔断器、回退缓存、提示词注入阻断、敏感信息脱敏和支出上限。但多项防护是可选项，一些敏感信息检测仍像测试版，超时时可能放行请求。因此，投资人应把可靠性视为主风险：如果 OpenRouter
              自身事故反复出现，平台就会从韧性层变成新的单点故障。
