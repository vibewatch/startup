- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Provider abstraction is hard to replicate
    - Open-source gateways and framework routers replicate enough of the control plane
    - High
    - LiteLLM, LangChain, and LlamaIndex already expose fallbacks, portability, and router primitives
    - Request cohort retention by integration depth and proof that managed routing saves engineering time beyond self-build
  - - Failover and uptime justify a premium
    - Hyperscalers and direct APIs keep adding their own routing and service-tier controls
    - High
    - Bedrock prompt routing, Azure model router, and OpenAI-style tiering all reduce the novelty of managed routing
    - Ask for win-loss data specifically against cloud-native routing and direct-API builds
  - - Specialized routers create differentiated value
    - Competitors can add their own judge, score, or policy layers quickly
    - Medium
    - OpenRouter ships Pareto and Fusion, but the moat is algorithmic rather than exclusive supply
    - Validate attach rate and realized willingness to pay for Pareto/Fusion features
  - - Neutrality beats bundled incumbents
    - AWS and Microsoft can sell routing inside much larger contracts with stronger governance guarantees
    - High
    - Cloud docs emphasize compliance, governance, and platform breadth that startups cannot easily mirror
    - Test whether OpenRouter still wins in regulated or procurement-heavy accounts
  - - The category benefits from model fragmentation
    - Multi-homing demand also lowers lock-in to any one router
    - Medium
    - RouterBench argues that no single model stays optimal across cost, capability, and latency
    - Measure how often customers replace or complement OpenRouter rather than standardize exclusively on it
  notes: Severity reflects pressure on pricing power and renewal durability, not whether routing as a category will exist. The risk register is intentionally framed around evidence that could compress OpenRouter’s take rate or channel leverage.
