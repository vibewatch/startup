evidenceGaps:
  - type: missing-source
    severity: minor
    topic: founder corroboration
    missingEvidence: >-
      A primary or official source that names Louis Vichy and fully explains founder-role coverage alongside Alex
      Atallah.
    whyItMatters: >-
      Founder completeness shapes key-person dependence, succession planning, and founder-market-fit analysis; today the
      retained evidence is materially stronger on Atallah than on Vichy.
    diligencePath: >-
      Request a current founder / leadership page, a financing memo naming founders, or a board-approved company
      overview that explicitly states the founder lineup.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance rights
    missingEvidence: >-
      Current board roster, observer list, investor protective provisions, and any voting or veto rights tied to major
      investors.
    whyItMatters: >-
      Without visibility into control rights, the public chapter can name directors but cannot assess who actually
      governs downside scenarios, hiring, financing approvals, or future strategic outcomes.
    diligencePath: >-
      Request the current board deck cover, investor rights summary, and a cap-table memo that identifies board seats,
      observers, and reserved matters.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: total-raised reconciliation
    missingEvidence: >-
      A reconciled financing history that maps the 2025 Form D, the reported Series A, and the 2026 Series B into one
      non-overlapping total raised number, including any secondaries or converted notes.
    whyItMatters: >-
      Valuation alone does not reveal dilution, liquidity preference overhang, or how much new primary capital actually
      reached the balance sheet.
    diligencePath: >-
      Obtain the financing deck, board financing summary, or cap-table waterfall that reconciles every primary issuance
      since formation.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: debt or credit facilities
    missingEvidence: >-
      Management confirmation on whether OpenRouter has any venture debt, credit lines, or provider-related financing
      arrangements.
    whyItMatters: >-
      Debt can change runway, covenant risk, and enterprise-contract flexibility, especially for an infrastructure
      company selling against heavy usage growth.
    diligencePath: Ask management or counsel for the debt schedule and any material financing side letters.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count by geography and function.
    whyItMatters: >-
      The company’s public usage scale is very large relative to the qualitative small-team narrative, so staffing depth
      matters for execution, support, security, and reliability judgments.
    diligencePath: >-
      Request an HR snapshot or board KPI page showing total headcount, engineering share, and hiring pace as of Q2
      2026.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology for TO004
    missingEvidence: >-
      An exhaustive internal timeline of financings, launches, incidents, and commercial partnerships through the run
      date.
    whyItMatters: >-
      The public chronology is strong enough for the main story but may omit smaller events that matter for sequencing
      customer adoption, reliability, or governance changes.
    diligencePath: >-
      Request the PR / investor timeline or board-history summary used internally to track launches, financings, and
      incidents.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-estimate
    missingEvidence: >-
      A public market study that isolates third-party managed multi-model routing SaaS revenue without folding in
      self-hosted gateways, hardware, or generic API management.
    whyItMatters: >-
      Current public estimates span from tens of millions to several billions because the category boundary moves. That
      forces SAM to remain inferred rather than directly sourced.
    diligencePath: >-
      Obtain paid category reports with methodology detail or interview analysts for a stripped-down routing-only
      segment cut.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      OpenRouter enterprise customer counts, ACV bands, expansion patterns, and billing concentration by segment or
      geography.
    whyItMatters: >-
      Buyer segmentation and SOM quality depend on whether spend is concentrated in hobbyist developers, startup teams,
      or enterprise platform accounts with meaningful contract budgets.
    diligencePath: >-
      Request cohort-level billing concentration, enterprise pipeline data, and customer-segment revenue splits from the
      company.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-segmentation
    missingEvidence: >-
      Public vertical-level breakdown of managed-router adoption versus self-hosted or cloud-native alternatives in
      regulated sectors.
    whyItMatters: >-
      Segment fit likely differs sharply between developer-led SaaS buyers and security-heavy enterprises, but public
      evidence remains anecdotal.
    diligencePath: Collect customer case studies or CRM segmentation by industry, deployment preference, and win-loss reason.
    relatedQuestionRefs:
      - QM024
      - QM026
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: latency-and-roi
    missingEvidence: >-
      Independent benchmark data comparing latency overhead, routing quality, and failure recovery across OpenRouter,
      Cloudflare, Kong, Azure, and LiteLLM on the same prompt set.
    whyItMatters: >-
      Routing ROI depends on whether token savings and resilience gains outweigh proxy latency and governance trade-offs
      in production conditions.
    diligencePath: >-
      Run a controlled benchmark harness or obtain an independent comparative performance study before making hard
      efficiency claims.
    relatedQuestionRefs:
      - QM015
      - QM017
      - QM023
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: martian-commercial-transparency
    missingEvidence: >-
      Public pricing, customer-count, and funding disclosures for Martian that would allow a normalized row-level
      comparison with OpenRouter, Together, Replicate, and Fireworks.
    whyItMatters: >-
      Without commercial transparency, Martian can only be positioned as an enterprise-routing and compliance
      alternative, not underwritten as a directly comparable price or scale benchmark.
    diligencePath: >-
      Request Martian sales collateral, customer references, or financing disclosures; if unavailable, treat Martian as
      a strategic entrant rather than a cleanly comparable peer.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: openrouter-realized-enterprise-economics
    missingEvidence: >-
      Realized OpenRouter enterprise pricing, discount bands, and win-loss data against AWS, Azure, and LiteLLM in
      comparable customer segments.
    whyItMatters: >-
      Moat durability and distribution-power analysis ultimately depends on whether OpenRouter can hold price and win
      deals when the buyer already has cloud or open-source alternatives.
    diligencePath: >-
      Request cohort-level pricing, pipeline, and win-loss cut by segment, especially regulated enterprise accounts and
      self-serve-to-enterprise expansions.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
      - TP004
  - type: missing-source
    severity: minor
    topic: normalized-router-tco
    missingEvidence: >-
      Comparable enterprise commit terms, negotiated discounts, or savings-share structures for Together, Fireworks, and
      Replicate that would support a like-for-like TCO model.
    whyItMatters: >-
      The public sources show list-pricing posture, but they do not fully reveal how enterprise buyers experience unit
      economics once volume commitments or dedicated capacity enter the picture.
    diligencePath: >-
      Request sample contracts, price quotes, or customer budget screenshots for dedicated deployments and enterprise
      commitments across the peer set.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
