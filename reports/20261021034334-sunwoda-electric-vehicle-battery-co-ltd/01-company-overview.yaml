company:
  name: "Sunwoda Electric Vehicle Battery Co., Ltd."
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Sunwoda EVB is a controlled power-battery subsidiary of Shenzhen-listed Sunwoda Electronic,
    with disclosed OEM nominations and a reported May 2026 financing at a CNY 25 billion
    pre-money valuation. The evidence also points to a valuation reset, substantial holding-company
    dilution, and a recently settled battery-quality dispute, while subsidiary-only financial,
    headcount, capitalization, and listing-status data remain incomplete.
sections:
  - id: identity-and-boundary
    title: "Identity, scope, and disclosure boundary"
    body: >-
      Sunwoda Electric Vehicle Battery Co., Ltd. should be underwritten as a controlled operating
      subsidiary rather than treated as interchangeable with listed parent Sunwoda Electronic.
      Sunwoda's own Volvo announcement describes EVB as a holding subsidiary, while independent
      reporting says the parent expected to retain absolute control after a proposed separation.
      The parent was co-founded in December 1997, is headquartered in Shenzhen, and reports across
      six battery and adjacent business segments. Those parent facts provide governance context,
      but they do not establish EVB's separate founding date, registered headquarters, workforce,
      or complete legal-name history. A 2026 filing-derived report calls the financed entity
      Sunwoda Mobility Energy Technology, making current registry confirmation a diligence item
      rather than an identity assumption.
    claimRefs: [CO001, CO002, CO005, CO007]
    tableRefs: [TO001]
  - id: operating-scale-and-commercial-position
    title: "Operating scale and commercial position"
    body: >-
      The strongest operating figures are segment disclosures from the parent, not standalone EVB
      accounts. For 2024, Sunwoda reported 25.29 GWh of power-battery shipments, up 116.89% year on
      year, and CNY 15.139 billion of electric-vehicle-battery sales, up 40.24% and equal to 27.02%
      of group revenue. Commercial evidence includes a 2022 Volvo battery nomination and April
      2026 reporting that Sunwoda EVB had become Tesla's fifth global power-battery supplier, with
      cells shipping from Yiwu for export vehicles. These points demonstrate OEM access and scaled
      production, but neither nomination nor supplier status discloses contract value, committed
      volume, customer concentration, or subsidiary profitability.
    claimRefs: [CO003, CO004, CO014, CO015]
    tableRefs: [TO002]
  - id: ownership-leadership-and-capital
    title: "Ownership, leadership, and capital formation"
    body: >-
      Control remains anchored in the listed parent and its operating leadership. Parent chairman
      and general manager Wang Wei co-founded Sunwoda with Wang Mingwang, while parent deputy
      general manager Liang Rui is disclosed as EVB chairman, creating clear operational oversight
      but also concentration around parent executives. Capital formation has broadened the
      shareholder base: a 2022 plan involved CNY 2.43 billion from 19 companies for 19.5495%, and
      the May 2026 round raised about CNY 1.68 billion from 13 investors at a CNY 25 billion
      pre-money valuation. Filing-derived reporting says the holding entity's stake would fall
      from 40.03% to 27.18% while management control remained, after a capital-reserve conversion
      intended to address a valuation decrease. The complete post-money cap table and investor
      rights are not public in the retained evidence.
    claimRefs: [CO005, CO006, CO009, CO010, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-listing-and-adverse-events
    title: "Milestones, listing path, and adverse events"
    body: >-
      EVB's development path combines rapid scaling with unresolved corporate-process risk. A
      ChiNext separation proposed in July 2023 was preliminary and required shareholder and
      regulatory approval; later reporting says EVB filed for a Hong Kong listing in July 2025,
      but the retained evidence does not establish its status as of the run date. The most material
      adverse event was VREMT's CNY 2.31 billion claim over allegedly defective cells supplied
      during 2021-2023. December 2025 reports said the case had not been heard and its impact was
      uncertain; by April 2026, CnEVPost reported a settlement with a CNY 500-800 million expected
      impact on parent 2025 attributable net profit. The sequence reduces open litigation
      uncertainty but leaves settlement terms, technical root cause, remediation, and subsidiary
      allocation unverified.
    claimRefs: [CO010, CO011, CO016]
    figureRefs: [FO001]
