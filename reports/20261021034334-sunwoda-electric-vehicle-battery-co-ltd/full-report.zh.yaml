              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.4'
        title: 最终尽调要求与投资逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              决定性尽调包应当窄而可量化：经审计的 EVB 利润表和现金流；债务、担保和项目融资义务；2026 年 5
              月融资前后的完全摊薄资本结构表；清算优先权和反稀释权利；最终和解会计处理；质保准备金和质量损失历史；以及实时更新的香港上市时间表。如果这些材料显示利润率持续为正、质量成本受控、OEM
              出货持续，且无需惩罚性稀释即可实现流动性，观点会改善。如果 IPO 路径停滞、客户项目流失、质量成本超过已报告的和解区间、市场份额明显回落，或在没有补偿性投资者保护的情况下出现低于 RMB25 billion
              的融资，观点就会失效。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.5'
        title: 附件
        blocks:
          - type: callout
            title: 价格仍缺乏证明
            body: 只有经审计的子公司经济数据和融资权利足以支撑入场价格时，商业进展才值得投资；公开证据尚未证明这一条件成立。
            calloutType: recommendation
            claimRefs:
