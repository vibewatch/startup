  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入引擎与商业转化
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 通过直接销售制造的电芯、模组、BMS 和 PACK 系统变现，而不是订阅或 ARR。母公司报告称，2023
              年全部销售均采用直销模式；其会计政策通常在国内电池交付并经客户验收时确认收入，出口收入则通常在货物从供应商管理库存仓库提货并验收时确认。因此，客户定点先于实际收入，但不等于实际收入。Volvo 和
              Volkswagen 的公告证明 Sunwoda 已进入 OEM 项目，但没有披露价格、承诺量、量产启动经济性或全生命周期合同价值。2026 年 Tesla 关系又带来一种只卖电芯的模式：据报道，Tesla
              直接采购电芯，自行组装模组和电池包。这种安排可以缩小 Sunwoda 的交付范围，但公开证据没有披露实际电芯价格或利润率。
            claimRefs:
              - CI001
              - CI007
              - CI014
              - CI015
