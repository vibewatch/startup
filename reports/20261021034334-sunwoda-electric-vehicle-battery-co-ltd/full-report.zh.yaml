      - number: '3.2'
        title: OEM 触达是已被证明的最强竞争资产
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 已积累多种 OEM 验证。Nissan 于 2020 年宣布研究下一代电池和稳定生产系统；Sunwoda 后来披露获得 Volvo 供应商定点；2026 年报道称 Sunwoda 已进入
              Tesla 全球供应链，成为其第五大动力电池供应商。2026 年 4 月客户结构也相对分散：Nio 占 Sunwoda 装机量 17.4%，SGMW 占 16.7%，Dongfeng-Nissan 占
              14.4%，Dongfeng 占 12.0%，Dongfeng-Liuzhou 占 10.3%。这一结构比 FinDreams 更不封闭，后者据报道有 58.0% 的供应集中于 BYD；也比 Svolt 对
              Leapmotor 和 Great Wall Motor 的合计敞口更分散。证据支持客户触达和多客户合作，但不支持议价能力：定点、研究项目和装机份额都没有披露项目盈利能力、续约条款或已获全生命周期订单量。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
