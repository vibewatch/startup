              Sunwoda EVB 销售的是汽车电池系统能力，而不是单一、无差异的电芯。公开范围从电芯延伸到模组、电池管理系统和电池包，车企可以按不同集成深度采购。Volkswagen 选择该公司供应 HEV
              电池包系统；独立报道则称 Tesla 采购 Sunwoda 电芯并自行组装模组和电池包。这些例子说明 Sunwoda 已进入 OEM
              的工程、认证、采购和生产流程，但没有披露良率、现场可靠性、整车层面经济性，或从定点推进到量产的项目比例。
