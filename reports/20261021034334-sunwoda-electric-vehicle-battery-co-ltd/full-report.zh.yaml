          - type: paragraph
            body: >-
              客户定点可以加快产能利用，也会把议价能力和质保风险转移给成熟车企。Sunwoda 宣布获得 Volvo 定点；独立报道则称，Tesla 开始在上海生产的出口车型上使用其电芯，采用直接采购电芯模式。与 Geely
              关联的质量纠纷表明，OEM 关系也可能转化为集中的财务和声誉负担。山东项目中的政府支持资本分散了融资来源，但增加了交易对手和政策依赖。Sunwoda
              公司披露的生产布局覆盖中国、印度、越南、匈牙利、摩洛哥和泰国，扩大了市场触达，同时也增加了许可、劳动力、物流、外汇和执行风险面，指定证据无法量化这些风险。
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR013
      - number: '7.4'
        title: 缓解措施、监测指标与退出标准
        blocks:
          - type: paragraph
            body: >-
              当前缓解措施仍不完整：Vremt 争议已和解，供应商付款承诺为 60 天内结清，项目引入外部共同投资者，主要 OEM
              定点提供商业验证。但这些措施都没有填补核心尽调缺口。应按季度监测质保准备金、召回数量、电芯现场故障率、供应商应付账款天数、项目投产和利用率、EVB 现金生成，以及任何上市计划的状态和上市地。如果再次出现重大
              OEM
              质量主张，安全召回在没有记录根因修复的情况下扩大，累计质保和和解费用超过披露准备金，供应商付款超过承诺期限，或承诺产能反复错过投产和利用率里程碑，应暂停或否决投资逻辑。官方财报落地页没有提供设定数值阈值所需的子公司层面证据。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: 附件
        blocks:
          - type: callout
            title: 投资逻辑破坏触发器
            body: 新的重大 OEM 质量主张、没有经过验证整改措施却扩大的安全召回，或反复错失产能爬坡目标，都说明和解与商业定点尚未控制执行风险。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为观察 / 继续研究，信心中等、风险高，估值立场为公开支持不足。当前最有力的价格证据是一份 2026 年 5 月融资摘要：该轮投前估值为 RMB25 billion；较早的 2022
              年报道则称，在规模大得多的一轮融资后估值约为 RMB30
              billion。这两个价格不能直接比较，因为投前和投后口径、证券权利及资本结构影响不同。即便如此，较低的名义参考值、资本公积调整和缺乏独立现金流证据，都不支持把当前价格视为已验证。投资应等待经审计的子公司经济数据、完全摊薄股权结构表、优先权条款和债务敞口。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV010
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
