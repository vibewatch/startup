      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              车企是直接买方和付款方；车型项目、采购团队、电池工程、质量和制造部门决定认证及定点范围。驾驶员是间接用户，OEM 承担整车质保风险并获得整车层面的成本节约。公开证据确认了不同的签约模式：Volvo
              发布电池供应商定点，Volkswagen 选择 Sunwoda 供应 HEV 电池包系统，2026 年一篇报道称 Tesla 采购 Sunwoda
              电芯，同时保留模组和电池包组装。该报道还称动力电池采购成本超过整车成本的 30%，因此买方高度关注价格和议价能力。因此，采用并非短期交易，而要经历定点、验证、启动和规模化车型生产。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: 增长驱动、约束与尽调含义
        blocks:
          - type: paragraph
            body: >-
              OEM 供应商多元化、更快充 LFP 的需求和地域扩产，可能扩大 Sunwoda 可服务的项目；固定式储能则提供另一条相邻增长路径。约束同样是结构性的：据报道，义乌一个年产能 5 GWh、投资 RMB 21.3
              billion
              的项目，说明在利用率和回报尚不明确前就需要投入大量资本。由于电池占整车成本比重较高，车企保有议价能力，也可以将电芯与模组、电池包拆开采购。面向欧洲的电池还面临日益严格的可追溯要求；一家技术行业来源称，欧盟将在
              2026 年碳足迹和标签里程碑之后，于 2027 年 2 月起全面实行数字电池护照要求。因此，在采用市场增长倍数估值前，应先要求提供当前产能、利用率、已获订单量、项目定价、认证状态和合规准备度。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 附件
        blocks:
          - type: callout
            title: 不要把市场快照换算成 TAM
            body: 现有 EV 指标混合了月度、季度、年度、中国和全球分母。它们能证明参与度和历史位置，但不能证明当前可服务市场规模或可靠的 Sunwoda SOM。
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 集中市场使 Sunwoda 处于挑战者梯队
        blocks:
          - type: paragraph
            body: >-
              竞争版图不只是专业电池初创企业名单。买方可以向中国规模化龙头 CATL 和 FinDreams 采购，也可以选择 CALB、Gotion 等多元化挑战者，或选择 Svolt 等与 OEM
              绑定的供应商；还可以采用拆分式买建方案，即采购电芯、再自行整合模组和电池包。Multiples.vc 还将 Farasis、SVOLT、YinLong、StoreDot、QuantumScape 和 BAIC
              BluePark 列为可比公司，但其分类混合了电芯制造商、技术开发商和整车企业，因此只能作为方向性参考，不能当作同口径运营基准。2026 年 4 月装机数据提供了最清晰的共同基础：CATL 份额为
              47.0%，FinDreams 为 18.3%，CALB 为 8.5%，Gotion 为 6.1%，Sunwoda 为 2.2%。Sunwoda 排名第九，必须依靠 OEM
              触达、服务或经济性取胜，而不是依靠装机基数领先。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
