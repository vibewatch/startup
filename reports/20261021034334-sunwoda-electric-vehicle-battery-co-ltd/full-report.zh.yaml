            title: 以当前独立财务包作为投资判断门槛
            body: 在把近期融资视为现金跑道充足的证据前，应要求提供 2024-2026 年子公司报表、客户层面定价和订单积压、工厂资本开支承诺、债务契约及质保损失细节。
            calloutType: recommendation
            claimRefs:
