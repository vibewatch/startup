      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景框架
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 车企项目扩大规模，经审计利润率为正，和解成本得到控制，且香港上市继续推进。
        - RMB25 billion-RMB30 billion 只是观察到的公开估值区间；上行空间需要经核实的盈利和清晰的条款。
        - IPO 延期、价格竞争、股权稀释以及保修问题复发。
        - 在披露经审计的经营数据和上市里程碑前，信号偏弱。
      - - 基准
        - 当前客户项目延续，市场地位维持在引用的 2.2% 份额附近，质量成本仍可控。
        - 仅将 RMB25 billion 投前估值作为谈判锚点；回报判断必须建立在经审计现金流之上。
        - 份额偏低、杠杆不清晰、优先权压力以及利润率不透明。
        - 经营信号中等，但估值信心偏弱。
      - - 悲观
        - 质量成本超过报道区间、市场份额下降、IPO 时点延后，或融资条款变得更具保护性。
        - 进入价格应低于 RMB25 billion 投前估值，或暂缓进入；没有资产负债表数据，无法支持精确底价。
        - 下轮融资估值下调、客户流失、诉讼复发以及流动性压力。
        - 影响重大，因为每个触发因素都尚未解决，或已有公开先例。
    notes: 这些区间是基于不可比的 2022 年和 2026 年公开估值标记设定的情景检查点，不代表公允价值判断；由于缺少独立财务数据和条款，概率信号仅为定性判断。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
