  - id: TV002
    title: 正向逻辑与反向逻辑
    columns:
      - 立场
      - 有证据支持的论点
      - 哪些变化会改变判断
    rows:
      - - 正向论点
        - 据报道进入 Tesla 供应链并向出口车型供货，为其成为全球车企供应商提供了当前的验证点。
        - 若能持续获得量产定点并披露出货经济性，论据会更有力。
      - - 正向论点
        - Volvo 供应商定点提供了公司发布的另一项全球车企关系证据。
        - 要把定点转化为财务证据，还需要项目启动、供货量和实际利润率。
      - - 正向论点
        - SNE 衍生数据将 Sunwoda 列为 2026 年第一季度全球第十，份额为 2.2%。
        - 若份额提升且不牺牲利润率，经营杠杆将改善。
      - - 反向论点
        - 2026 年 5 月的 RMB25 billion 投前估值名义上低于 2022 年报道的约 RMB30 billion 估值。
        - 可比证券条款和经核对的股权结构表，可能显示这次表面上的估值重置被夸大了。
      - - 反向论点
        - 一家 Geely 关联方因据称的电芯缺陷索赔 RMB2.31 billion。
        - 最终和解文件、充足的准备金以及下降的现场故障数据，才能压住这一风险。
      - - 反向论点
        - 后续报道预计，和解将使 2025 年归属于股东的净利润受到 RMB500 million-RMB800 million 的影响。
        - 若经审计的和解会计处理低于该区间，且不再出现重复索赔主张，悬而未决的压力会减轻。
    notes: 客户和市场证据不能作为利润率基准；估值标记的日期和交易基础不同，据报道的质量索赔说法按原文所述属于指控或预期影响。
    claimRefs:
