    type: quadrant
    summary: 序数评分显示，Sunwoda 属于规模较小的供应商，但其披露的车企组合比分销受限或高度集中的同行更分散。
    data:
      points:
        - label: CATL
          x: 5
          'y': 5
          note: 份额为 47.0%；披露的五家主要车企均不超过 9.5%。
        - label: FinDreams
          x: 4
          'y': 2
          note: 份额为 18.3%；BYD 占供货量的 58.0%。
        - label: CALB
          x: 3
          'y': 4
          note: 份额为 8.5%；披露的五家主要车企中，最大一家占 16.0%。
        - label: Gotion
          x: 3
          'y': 4
          note: 份额为 6.1%；披露的五家主要车企中，最大一家占 18.3%。
        - label: Svolt
          x: 2
          'y': 3
          note: 份额为 2.6%；Leapmotor 和 GWM 分别占 44.3% 和 37.1%。
        - label: Sunwoda
          x: 2
          'y': 4
          note: 份额为 2.2%；披露的五家主要车企占比在 10.3% 至 17.4% 之间。
    approximationNotes: >-
      X 是基于 2026 年 4 月中国份额的序数规模评分：低于 2% 为 1，2.0% 至 4.9% 为 2，5.0% 至 9.9% 为 3，10.0% 至 29.9% 为 4，30% 或以上为 5。Y
      是披露客户多元化的序数评分：大部分供货为内部配套时为 2，两家客户超过 35% 时为 3，五家点名客户且均不超过 20% 时为 4，五家点名客户且均不超过 10% 时为
      5。这些评分来自单个月度中国市场快照，不是全球排名或质量基准。
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
  - id: FI001
    title: 从车企项目到毛利的收入模型桥接
    type: flow
    summary: 公开证据支持这一经营流程，但不支持转化率、合同金额或客户层面的贡献利润率。
    data:
      nodes:
        - id: nomination
          label: 车企定点
          detail: 供应商选择或定点通知；不构成已确认收入。
        - id: qualification
          label: 认证与开发
          detail: 工程、验证和项目准备先于生产。
        - id: order
          label: 批量订单
          detail: 公开来源未披露承诺供货量或 take-or-pay 保护。
        - id: delivery
          label: 电芯、模组或电池包交付
          detail: 交付范围各异；据报道 Tesla 采购电芯并组装模组和电池包。
        - id: acceptance
          label: 客户验收或 VMI 提货
          detail: 母公司政策规定，在控制权转移时确认电池收入。
        - id: revenue
          label: 产品收入
          detail: 据报告，2023 年新能源汽车电池分部收入为 RMB10.795bn。
        - id: gross-profit
          label: 扣除生产和保修成本后的毛利
          detail: 据报告，2023 年新能源汽车电池毛利率为 11.22%。
      edges:
        - from: nomination
          to: qualification
          label: 项目授予
        - from: qualification
          to: order
          label: 验证
        - from: order
          to: delivery
          label: 生产
        - from: delivery
          to: acceptance
          label: 控制权转移
        - from: acceptance
          to: revenue
          label: 确认收入
        - from: revenue
          to: gross-profit
          label: 减去销售成本和保修负担
    approximationNotes: 这是根据报道的直销和收入确认政策整理出的概念流程；公开信息不支持任何转化率、周期长度、合同金额或客户层面利润率。
    claimRefs:
      - CI001
      - CI003
      - CI007
      - CI008
      - CI014
      - CI015
  - id: FE001
    title: 披露的产品架构图
    type: stack
    summary: Sunwoda 的公开产品体系从电池化学体系延伸到云连接充电运营。
    data:
      layers:
        - label: 化学体系
          detail: 据报道，供给 Tesla 的电芯采用第三代 LFP。
          items:
            - LFP 活性材料体系
            - 充电倍率范围
        - label: 电芯
          detail: 据报道，在 Tesla 车型中直接供货的单元是电芯。
          items:
            - 方形电芯
            - Smart cell 3.0
        - label: 模组
          detail: 模组属于 Sunwoda 更广泛的集成产品范围。
          items:
            - 电芯组合
            - 电气互连
        - label: 电池包
          detail: 电池包系统是 Volkswagen HEV 项目所称的交付单元。
          items:
            - 机械外壳
            - 热管理集成
        - label: 嵌入式控制
          detail: BMS 和能源域控制器负责运行边界与诊断。
          items:
            - BMS
            - 能源域控制器
        - label: 互联运营
          detail: 2026 年概念方案加入 AI 云控制和多品牌充电生态。
          items:
            - AI 云控制平台
            - 充电基础设施
    approximationNotes: 层级顺序是对已披露组件的分析性重构，不是完整的物理设计或接口规格。
    claimRefs:
      - CE002
      - CE007
      - CE010
      - CE013
  - id: FU001
    title: 观察到的客户关系深化路径
    type: journey-map
    summary: 公开案例显示，从选择第二供应商到深入共同开发可能要经历多个步骤，但质量整改可能打断关系延续。
    data:
      items:
        - label: 选择第二供应商
          detail: Sunwoda 将自己定位为增补供应商，而不是正面挑战主导在位供应商。
          touchpoints:
            - 车企采购流程
            - 成本与服务竞争
        - label: 技术共同开发
          detail: 电芯、模组、BMS 和电池包能力支持 OEM/ODM 合作。
          touchpoints:
            - 工程认证
            - 平台要求
        - label: 供应商定点
          detail: Volvo 证据证明已获定点，但不能证明已量产。
          touchpoints:
            - 定点函
            - 未确认的定点供货量
        - label: 量产爬坡
          detail: Xpeng 车型部署和 Tesla 出口车辆出货提供了量产层面的证据。
          touchpoints:
            - 量产
            - 整车组装
        - label: 关系扩展
          detail: Li Auto 的投资和据报道的 50:50 合资企业，显示出更深入的合作路径。
          touchpoints:
            - 少数股权投资
            - 联合制造
        - label: 质量监控与整改
          detail: Vremt 和解表明，现场质量问题可能带来更换义务并削弱关系持续性。
          touchpoints:
            - 电池健康监测
            - 更换电池包
    approximationNotes: 这一有序路径综合了观察到的关系阶段；它不是转化漏斗，不暗示每个客户都会经历每个阶段，也不包含推断出的转化率。
    claimRefs:
      - CU006
      - CU008
      - CU009
      - CU012
      - CU014
      - CU015
