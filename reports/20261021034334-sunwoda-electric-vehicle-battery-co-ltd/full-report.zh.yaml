              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: 产品覆盖电芯和系统集成，但价格领先尚未验证
        blocks:
          - type: paragraph
            body: >-
              Tesla 项目同时说明了 Sunwoda 的能力和供应商锁定的边界。据报道，Tesla 直接从 Sunwoda 购买电芯，并自行组装模组和电池包；供应的第三代 LFP 电芯支持最高 3C 充电速率。这让
              Sunwoda 无需交付完整电池包也能进入大型客户，但系统集成价值和架构控制权仍掌握在 OEM
              手中。同一报道将客户吸引力归因于有竞争力的定价和服务，但没有公布单价、合同期限、质保分配、折扣安排或实际利润率。Nissan 的联合开发研究和 Volvo
              的定点说明供应商关系可能更深，但其经济性同样未披露。因此，买方似乎可以多源采购并选择不同的自制或外购边界；公开证据无法证明 Sunwoda 存在持久的切换成本。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 规模经济与 OEM 议价能力限制护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 将自己描述为全球动力电池装机量前十，但 4 月的独立快照显示，公司距离龙头仍有明显差距。CATL 47.0% 的份额带来了规模、客户广度和采购杠杆，公开证据无法证明 份额仅为 2.2%
              的参与者能够匹敌。同时，Tesla 引入第五家全球供应商并将模组和电池包工作内部化，说明 OEM 可以分散电芯供应，同时保留更高层级的集成。行业经济性并不友好：Reuters
              报道称，价格战和需求走弱压缩了利润率，也拉长了供应商回款周期。Sunwoda 的 OEM
              结构较分散，快充能力主张也有一定可信度，但没有证据表明二者具有排他性。因此，其护城河更适合定义为经过认证的工程准入和执行能力，而非专有锁定效应；如果更大的竞争对手在价格、化学体系、充电性能或本地化能力上追上来，替代风险仍高。
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.5'
