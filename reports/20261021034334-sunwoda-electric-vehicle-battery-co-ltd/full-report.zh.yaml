  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 核心市场边界与相邻领域
        blocks:
          - type: paragraph
            body: >-
              核心可投资市场，是车企为纯电、插电式混合动力和混合动力项目采购 EV 动力电芯、模组、电池包和电池管理系统的价值。Sunwoda
              的公开产品覆盖这些层级，因此边界比单纯电芯更宽，但窄于全部锂离子电池。消费电子电池不纳入核心范围，因为买方、认证周期和经济性不同。固定式储能属于相邻领域，不计入核心 EVB TAM，尽管 Sunwoda
              表示母公司同时经营动力电池和储能电池业务。现有替代方案包括现有电芯供应商、OEM 自行组装模组和电池包，以及其他化学体系；Tesla
              据报道选择采购电芯、自己组装模组和电池包，说明供应商的交付范围可以停留在电芯，而不必覆盖整个系统。
            claimRefs:
              - CM001
              - CM006
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM009
              - CM013
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模与位置
        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持单一的自上而下市场规模。相反，它提供了几个历史运营视角：Sunwoda 在 2023 年 6 月中国装机量为 0.73 GWh、份额为 2.21%；2023 年第二季度中国装机量为 2.34
              GWh；2023 年 1-8 月全球装机量为 4.7 GWh、份额为 1.4%。另一个来源报告 2022 年动力电池出货量为 12.11 GWh。这些期间、地域和分母不可互换，因此不能相加得出 SOM。pv
              magazine 报道的 BloombergNEF 数据显示，相邻的固定式储能市场在 2025 年新增 112 GW 和 307 GWh，预计 2026 年新增 158 GW 和 459
              GWh；这些数字说明电池需求正在增长，但不是 EV 动力电池 TAM。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM013
              - CM014
              - CM015
