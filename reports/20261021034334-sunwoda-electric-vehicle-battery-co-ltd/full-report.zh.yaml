              质量风险并非理论问题。一家与 Geely 关联的客户声称，2021-2023 年供应的电芯存在缺陷并造成损失，但该指控本身不能证明缺陷普遍程度或根因。据称 Sunwoda
              可以高准确率提前预警故障，但指定来源没有提供验证协议、误报率、现场分母或独立测试。投资者应要求提供电池包和电芯层面的质保队列、热事件历史、供应商变更控制、验证报告、功能安全和网络安全证据，以及明确的量产里程碑。指定证据中没有公开的开发者或从业者社区信号，因此无法从外部评估集成可运营性。
