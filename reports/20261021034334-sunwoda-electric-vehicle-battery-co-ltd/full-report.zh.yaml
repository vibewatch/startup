chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、范围与披露边界
        blocks:
          - type: paragraph
            body: >-
              评估 Sunwoda Electric Vehicle Battery Co., Ltd. 时，应将其视为受控运营子公司，而不能与上市母公司 Sunwoda Electronic 等同。Sunwoda 自己发布的
              Volvo 公告将 EVB 描述为控股子公司；独立报道则称，拟议分拆完成后，母公司预计仍将保持绝对控制。母公司由 Wang Wei 和 Wang Mingwang 于 1997 年 12
              月共同创立，总部位于深圳，业务覆盖六个电池及相关板块。上述母公司信息只能提供治理背景，不能证明 EVB 自身的成立日期、注册地址、员工规模或完整法定名称沿革。一份源自 2026 年监管文件的报道将融资主体称为
              Sunwoda Mobility Energy Technology，因此当前登记信息仍需核实，不能直接假定其身份。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO007
              - CO008
              - CO012
      - number: '1.2'
        title: 运营规模与商业地位
        blocks:
          - type: paragraph
            body: >-
              最有力的运营数据来自母公司分部披露，而非 EVB 独立账目。2024 年，Sunwoda 报告动力电池出货量为 25.29 GWh，同比增长 116.89%；电动汽车电池销售额为 CNY 15.139
              billion，同比增长 40.24%，占集团收入 27.02%。商业证据还包括 2022 年 Volvo 电池定点，以及 2026 年 4 月的报道：Sunwoda EVB 已成为 Tesla
              全球第五大动力电池供应商，电芯从义乌发往出口车型。这些信息证明其具备 OEM 渠道和规模化生产能力，但无论定点还是供应商地位，都没有披露合同金额、承诺量、客户集中度或子公司盈利能力。
            claimRefs:
              - CO003
              - CO004
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO010
              - CO013
      - number: '1.3'
        title: 所有权、管理层与资本形成
        blocks:
          - type: paragraph
            body: >-
              控制权仍掌握在上市母公司及其运营管理层手中。母公司董事长兼总经理 Wang Wei 与 Wang Mingwang 共同创办 Sunwoda；母公司副总经理 Liang Rui 被披露为 EVB
              董事长，说明运营监督清晰，但治理也集中在母公司高管手中。资本形成扩大了股东基础：2022 年计划由 19 家公司出资 CNY 2.43 billion，取得 19.5495%；2026 年 5 月一轮融资从 13
              位投资者处募得约 CNY 1.68 billion，投前估值为 CNY 25 billion。源自监管文件的报道称，控股主体持股比例将在管理层控制不变的情况下从 40.03% 降至
              27.18%，同时通过资本公积转增股本应对估值下调。现有证据中没有公开完整的投后股权结构表和投资者权利。
            claimRefs:
              - CO005
              - CO006
              - CO009
              - CO010
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO012
              - CO013
              - CO016
      - number: '1.4'
        title: 里程碑、上市路径与不利事件
        blocks:
          - type: paragraph
            body: >-
              EVB 的发展路径兼具快速扩张和未解决的公司流程风险。2023 年 7 月提出的创业板分拆仍属初步方案，需要股东和监管批准；后续报道称 EVB 于 2025 年 7
              月提交了香港上市申请，但留存证据无法确认截至本次运行日期的状态。最重大的不利事件是 VREMT 就 2021-2023 年供应的疑似缺陷电芯提出 CNY 2.31 billion 索赔。2025 年 12
              月的报道称案件尚未审理，影响仍不确定；到 2026 年 4 月，CnEVPost 报道双方已和解，预计将使母公司 2025 年归母净利润减少 CNY 500-800
              million。事件进展降低了未决诉讼的不确定性，但和解条款、技术根因、整改措施和子公司承担比例仍未得到验证。
            claimRefs:
              - CO010
              - CO011
              - CO016
