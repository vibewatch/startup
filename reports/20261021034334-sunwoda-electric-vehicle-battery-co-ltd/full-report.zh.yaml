              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 运营证明与下行证据
        blocks:
          - type: paragraph
            body: >-
              投资逻辑有真实运营支撑，但估值支撑仍不足。CnEVPost 报道称，Sunwoda EVB 已进入 Tesla 全球供应链，并已为出口车型供应电芯；Sunwoda 官方发布则记录了 Volvo
              供应商定点。36Kr 还援引超过 1.5 million 套已装机 HEV 电池，SNE 数据显示 Sunwoda 在 2026 年第一季度全球排名第十、份额为 2.2%。反向逻辑同样具体：规模仍远低于龙头，一家
              Geely 关联公司提出 RMB2.31 billion 质量索赔，后续报道预计和解将影响 2025 年归母净利润 RMB500 million 至 RMB800
              million。因此，客户验证并不能消除执行或质保成本风险。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: 融资情景与退出准备度
        blocks:
          - type: paragraph
            body: >-
              公开价格只能支持情景框架，不能支持现金流折现估值或目标回报。若经审计的利润率、杠杆或和解经济性不及预期，悲观情景应低于 RMB25 billion 投前参考值。基准情景只把 RMB25 billion
              作为入场检查点，等待干净的条款和经验证的盈利能力。乐观情景可以讨论已观察到的 RMB25 billion 至约 RMB30 billion 价格区间，但只能作为尽调区间，不能当作同口径公允价值范围。退出准备度已从
              2023 年初步创业板计划推进到 2026 年 4 月的报道：香港申请已于 2025 年 7 月提交；但指定证据无法验证当前审批状态、时间、流通股比例和定价。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
