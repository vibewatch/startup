      - number: '4.2'
        title: 历史分部经济性与定价压力
        blocks:
          - type: paragraph
            body: >-
              指定证据中最新的详细分部经济数据仍属历史数据。EV 电池收入从 2022 年的 RMB12.687 billion 上升，出货量为 12.11 GWh，毛利率为 10.28%；2023 年收入降至
              RMB10.795 billion，出货量降至 11.66 GWh。2023 年监管文件披露毛利率为 11.22%，在收入收缩的同时提升了 0.94 个百分点。用披露的收入除以出货量，可估算 2022 年每
              GWh 实际收入约为 RMB1.047 billion，2023 年约为 RMB0.926 billion，下降约
              11.6%。这只是混合口径的分析代理指标，不是披露价格；产品化学体系、电芯与系统的组合、合同时间和客户结构都可能影响结果。未发现公开的客户层面定价、折扣、返利或当前 2026 年利润率桥接。
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI012
      - number: '4.3'
        title: 成本结构、资本密集度与流动性限制
        blocks:
          - type: paragraph
            body: >-
              证据显示，这种制造模式对固定资产、营运资本、质保和融资的要求都很高。母公司 2023 年经营现金流为 RMB3.618 billion；购置固定资产、无形资产和其他长期资产消耗 RMB5.896
              billion，融资现金流贡献 RMB4.275 billion。年末现金及现金等价物为 RMB13.669 billion，但同一合并范围内还有 RMB8.820 billion 短期借款、RMB6.667
              billion 长期借款和 RMB399 million 债券。产品质量准备金达到 RMB599 million，主要覆盖汽车电池售后服务。上述母公司余额均不能证明 EVB
              子公司的现金、烧钱速度、现金跑道或杠杆。2026 年披露的股权融资和项目担保提供了资本可得性的新增证据，但融资金额和担保能力不等于子公司可用现金。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI008
              - CI009
              - CI010
              - CI016
      - number: '4.4'
        title: 财务判断与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              已点名的全球 OEM 项目，以及与交付或验收挂钩的时点确认，为收入质量提供支撑；但客户定点本身不能证明确定性订单，披露的分部利润率也偏薄。2022 至 2023 年每 GWh
              混合收入下降，与产品组合或定价压力相符，但公开记录无法区分二者。资本密集度仍是投资判断的核心约束：近期股权交易显示投资者愿意提供资金，但公开来源无法将所得资金与 EVB
              现金、已承诺厂房支出、债务偿付或下一轮融资触发条件对应起来。质量纠纷又增加了明确的下行信号：预计和解将使母公司 2025 年净利润减少 RMB500-800
              million。逐轮融资时间线应放在公司概况；就财务情况而言，投资决定应等到取得当前子公司利润表、现金流量表、资产负债表、资本开支计划、合同积压和质保损失桥接。
            claimRefs:
              - CI003
              - CI006
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: 附件
        blocks:
          - type: callout
            title: 母公司流动性不等于子公司现金跑道
            body: 现有现金流、现金、借款和债券数据都是 Sunwoda Electronic 的合并余额。没有法人实体报表和关联方资金流，不能用它们计算 EVB 的烧钱速度或现金跑道。
            calloutType: risk
