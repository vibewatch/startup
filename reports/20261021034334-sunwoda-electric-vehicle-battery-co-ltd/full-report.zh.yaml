  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 先把经营验证放进竞争、质量和融资证据里过一遍，才能作出观察 / 继续研究的决定。
    data:
      nodes:
        - id: market
          label: 市场需求
          detail: 2026 年第一季度新能源汽车电池产量增长 9.1%，达到 244.6 GWh。
        - id: position
          label: 竞争地位
          detail: 在引用的全球数据集中，Sunwoda 以 2.2% 份额排名第十。
        - id: proof
          label: 车企与部署验证
          detail: Tesla 供货报道、Volvo 定点，以及引用的超过 150 万次 HEV 部署。
        - id: price
          label: 价格参考
          detail: 2026 年 5 月 RMB25 billion 投前估值，对比 2022 年报道的约 RMB30 billion。
        - id: downside
          label: 下行筛选
          detail: 质量和解影响、缺失的独立经营数据，以及未知的证券条款。
        - id: decision
          label: 决定
          detail: 观察 / 继续研究；要求经审计的经营数据和清晰的进入条款。
    approximationNotes: 这是定性的决策链；节点顺序不代表数值转化或概率。
