      - ["EV-battery revenue", "2023", "RMB10.795bn revenue; 11.66GWh shipments", "Approx. RMB0.926bn revenue/GWh", "Medium", "Blended proxy fell about 11.6% year over year"]
      - ["EV-battery gross margin", "2023", "RMB10.795bn revenue; RMB9.583bn cost of sales", "11.22%", "Medium", "Thin disclosed segment margin despite 0.94 percentage-point annual improvement"]
      - ["July equity pricing", "2026", "RMB805m new equity; 2.93% post-transaction stake", "RMB25.805bn reported post-money valuation", "Medium", "Financing valuation is not product pricing, revenue, or cash runway"]
    notes: >-
      Revenue-per-GWh values are analyst calculations from company-reported annual segment revenue and shipments;
      they mix products and contracts and should not be treated as quoted pricing or forward guidance.
    claimRefs: [CI002, CI003, CI004, CI005, CI006, CI012]
  - id: TI003
    title: Unit economics, capital, and underwriting gaps
    columns: [Metric, Public value, Perimeter and period, Confidence, Why it matters, Diligence ask]
    rows:
      - ["EV-battery gross margin", "11.22%", "Parent-reported EV-battery segment, 2023", "Medium", "Shows limited historical cushion for pricing, utilization, and warranty shocks", "Provide 2024-2026 quarterly gross margin by chemistry, plant, and customer"]
      - ["Warranty / product-quality provision", "RMB599.184m", "Parent consolidated, year-end 2023", "Medium", "After-sales obligations consume margin and cash; EVB share is undisclosed", "Provide EVB claims frequency, severity, reserve roll-forward, and insurer recoveries"]
      - ["Operating cash flow", "RMB3.618bn", "Parent consolidated, 2023", "Medium", "Positive parent cash flow does not establish subsidiary self-funding", "Provide EVB standalone cash-flow statements and intercompany cash movements"]
      - ["Fixed/intangible asset purchases", "RMB5.896bn", "Parent consolidated, 2023", "Medium", "Cash investment exceeded parent operating cash generation in that year", "Provide EVB maintenance versus growth capex and committed project schedule"]
      - ["Cash and debt", "RMB13.669bn cash equivalents; RMB15.486bn short/long borrowings", "Parent consolidated, year-end 2023; excludes RMB399m bonds from stated borrowing subtotal", "Medium", "Gross parent liquidity cannot be assigned to EVB and may be restricted", "Provide EVB unrestricted cash, debt, guarantees, covenants, and maturity ladder"]
      - ["Quality-settlement impact", "RMB500-800m expected reduction in 2025 parent net profit", "Parent impact reported in February 2026", "High", "Demonstrates potentially material downside from battery-quality liabilities", "Provide settlement payment timing, EVB allocation, recoveries, and remaining related claims"]
    notes: >-
      Parent-consolidated values are presented only as capital-intensity and liquidity proxies; null subsidiary metrics
      are not inferred, and each row states the evidence required to establish the EVB legal entity's economics.
    claimRefs: [CI003, CI008, CI009, CI010, CI016]
figures:
  - id: FI001
    title: Revenue model bridge from OEM program to gross profit
    type: flow
    summary: >-
      Public evidence supports the operating sequence, but not conversion rates, contract values, or customer-level
      contribution margins.
    data:
      nodes:
        - id: nomination
          label: OEM nomination
          detail: "Supplier selection or fixed-point notice; not recognized revenue."
        - id: qualification
          label: Qualification and development
          detail: "Engineering, validation, and program preparation precede production."
        - id: order
          label: Volume order
          detail: "Public sources do not disclose committed volume or take-or-pay protection."
        - id: delivery
          label: Cell, module, or pack delivery
          detail: "Delivered scope varies; Tesla reportedly buys cells and assembles modules and packs."
        - id: acceptance
          label: Customer acceptance or VMI pickup
          detail: "The parent policy recognizes battery revenue when control transfers."
        - id: revenue
          label: Product revenue
          detail: "Reported EV-battery segment revenue was RMB10.795bn in 2023."
        - id: gross-profit
          label: Gross profit after production and warranty costs
          detail: "Reported EV-battery gross margin was 11.22% in 2023."
      edges:
        - from: nomination
          to: qualification
          label: Program award
        - from: qualification
          to: order
          label: Validation
        - from: order
          to: delivery
          label: Production
        - from: delivery
          to: acceptance
          label: Control transfer
        - from: acceptance
          to: revenue
          label: Recognition
        - from: revenue
          to: gross-profit
          label: Less cost of sales and warranty burden
    approximationNotes: >-
      Conceptual sequence assembled from reported direct-sales and recognition policies; no conversion rate, cycle
      length, contract value, or customer-level margin is publicly supported.
    claimRefs: [CI001, CI003, CI007, CI008, CI014, CI015]
callouts:
  - calloutType: risk
    title: Parent liquidity is not subsidiary runway
    body: >-
      The available cash-flow, cash, borrowing, and bond figures are consolidated Sunwoda Electronic balances.
      They cannot be used to calculate EVB burn or runway without legal-entity statements and intercompany flows.
    claimRefs: [CI009, CI010, CI013]
  - calloutType: recommendation
    title: Gate underwriting on a current standalone financial pack
    body: >-
      Require 2024-2026 subsidiary statements, customer-level pricing and backlog, plant capex commitments, debt
      covenants, and warranty-loss detail before treating recent financing as evidence of adequate runway.
    claimRefs: [CI006, CI008, CI011, CI012, CI013, CI016]
