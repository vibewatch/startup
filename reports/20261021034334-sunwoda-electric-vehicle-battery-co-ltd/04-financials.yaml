company:
  name: "Sunwoda Electric Vehicle Battery Co., Ltd."
chapter:
  number: 4
  title: Financials
  summary: >-
    Public segment data show a capital-intensive direct-sales battery model: EV-battery revenue fell 14.91% to
    RMB10.795 billion in 2023 while reported gross margin remained only 11.22%. Two 2026 equity transactions and
    parent-level project guarantees reinforce financing dependence, while subsidiary cash, debt, burn, and current
    profitability remain unavailable for underwriting.
sections:
  - id: revenue-engine
    title: Revenue engine and commercial conversion
    body: >-
      Sunwoda monetizes manufactured battery cells, modules, BMS, and PACK systems through direct product sales,
      not subscriptions or ARR. The parent reported that all 2023 sales used a direct-sales model, while its
      accounting policy recognizes domestic battery revenue on delivery and customer acceptance and generally
      recognizes export revenue when goods are picked up and accepted from a vendor-managed-inventory warehouse.
      Customer nominations therefore precede, but do not equal, realized revenue. Volvo and Volkswagen notices
      demonstrate qualification into OEM programs without disclosing price, committed volume, start-of-production
      economics, or lifetime contract value. The 2026 Tesla relationship adds a distinct cell-only model: Tesla
      reportedly purchases cells directly and performs module and pack assembly itself. That arrangement can
      simplify Sunwoda's delivered scope, but the public evidence does not disclose realized cell pricing or margin.
    claimRefs: [CI001, CI007, CI014, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: historical-segment-economics
    title: Historical segment economics and pricing pressure
    body: >-
      The latest detailed segment economics in the assigned evidence are historical. EV-battery revenue rose to
      RMB12.687 billion in 2022, with 12.11 GWh shipped and a 10.28% gross margin, then declined to RMB10.795
      billion in 2023 as shipments fell to 11.66 GWh. The 2023 filing reported an 11.22% gross margin, a 0.94
      percentage-point improvement despite the revenue contraction. Dividing disclosed revenue by shipments gives
      an estimated realized revenue intensity of about RMB1.047 billion per GWh in 2022 and RMB0.926 billion per
      GWh in 2023, an approximately 11.6% decline. This is a blended analytical proxy, not a disclosed price:
      product chemistry, cell-versus-system mix, contract timing, and customer mix can all move it. No public
      customer-level pricing, discounts, rebates, or current 2026 margin bridge was found.
    claimRefs: [CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI002]
  - id: cost-capital-and-liquidity
    title: Cost structure, capital intensity, and liquidity limits
    body: >-
      The evidence indicates a manufacturing model with substantial fixed-asset, working-capital, warranty, and
      financing demands. At the parent group, 2023 operating cash flow was RMB3.618 billion, while purchases of
      fixed assets, intangible assets, and other long-term assets consumed RMB5.896 billion and financing cash flow
      contributed RMB4.275 billion. Year-end cash equivalents were RMB13.669 billion, but the same consolidated
      perimeter carried RMB8.820 billion of short-term borrowings, RMB6.667 billion of long-term borrowings, and
      RMB399 million of bonds. Product-quality provisions reached RMB599 million and predominantly covered
      after-sales service for automotive batteries. None of these parent-level balances establishes EVB subsidiary
      cash, burn, runway, or leverage. In 2026, reported equity raises and project guarantees provide fresh evidence
      of capital access, but funding raised and guarantee capacity are not cash available to the subsidiary.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      Revenue quality benefits from named global OEM programs and point-in-time recognition tied to delivery or
      acceptance, but nominations alone do not establish firm backlog and the disclosed segment margin was thin.
      The observed fall in blended revenue per GWh between 2022 and 2023 is consistent with mix or pricing pressure,
      although the public record cannot isolate either cause. Capital intensity remains the central underwriting
      constraint: recent equity transactions show access to investors, yet the public sources do not reconcile those
      proceeds to EVB cash, committed plant spending, debt service, or a next-round trigger. A quality dispute adds a
      concrete downside signal: the settlement was expected to reduce parent 2025 net profit by RMB500-800 million.
      The round-by-round financing chronology belongs in Company Overview; for Financials, an investment decision
      should wait for a current subsidiary P&L, cash-flow statement, balance sheet, capex schedule, contract backlog,
      and warranty-loss bridge.
    claimRefs: [CI003, CI006, CI013, CI015, CI016]
