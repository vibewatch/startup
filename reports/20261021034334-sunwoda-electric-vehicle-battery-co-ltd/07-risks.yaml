company:
  name: "Sunwoda Electric Vehicle Battery Co., Ltd."
chapter:
  number: 7
  title: "Risks"
  summary: "Quality and product-liability exposure is the leading risk after a Geely-unit dispute produced an expected RMB 500-800 million impact and Sunwoda-supplied batteries were identified in Volvo EX30 recall plans. Large manufacturing commitments, supplier-payment pressure, global execution complexity, and unresolved listing and subsidiary-level disclosure gaps keep residual risk high despite a settlement and a 60-day supplier-payment pledge."
sections:
  - id: "quality-legal-and-regulatory"
    title: "Quality, legal, and regulatory exposure"
    body: >-
      Product quality is the clearest thesis-breaking risk. Vremt sought RMB 2.31 billion over alleged defects in cells supplied from 2021 through 2023; the dispute was later settled, but Sunwoda estimated a RMB 500-800 million impact on 2025 net profit. Separately, Volvo announced EX30 recall plans in several markets for an overheating risk that could lead to fire, and the cited U.S. safety record identified Sunwoda Power Battery Company batteries. The settlement reduces litigation uncertainty but does not establish root cause, affected-vehicle count, warranty-reserve adequacy, or whether field-failure rates are improving. Those missing operating facts, rather than the absence of a pending case, drive the high residual rating.
    claimRefs: [CR001, CR002, CR003, CR004, CR016]
    tableRefs: [TR001]
  - id: "operations-capital-and-working-capital"
    title: "Operational scale, capital intensity, and working capital"
    body: >-
      Expansion creates a second high-risk cluster. Public reporting describes a 30 GWh Shandong project funded through a RMB 3 billion vehicle, planned EVB projects of RMB 8 billion and RMB 12 billion, and a separate RMB 2.3 billion cylindrical-cell facility financed with self-raised funds. These announcements demonstrate access to projects and partners, but they also expose the business to utilization, construction, commissioning, commodity, and refinancing risk before project-level returns are visible. The industry's 60-day supplier-payment initiative is a mitigation, not proof that Sunwoda has no working-capital stress: Reuters reported that delayed payments were already straining suppliers across the sector.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: "partners-customers-and-geography"
    title: "Partner, customer, and geographic dependencies"
    body: >-
      Customer nominations can accelerate utilization but also transfer bargaining power and warranty exposure to sophisticated automakers. Sunwoda announced a Volvo nomination, while independent reporting said Tesla began using its cells for Shanghai-built export vehicles under a direct cell-purchase model. The Geely-affiliated quality dispute shows that an OEM relationship can become a concentrated financial and reputational liability. Government-backed capital in the Shandong project diversifies funding, yet adds counterparty and policy dependencies. Sunwoda's company-reported production footprint across China, India, Vietnam, Hungary, Morocco, and Thailand broadens market access while increasing permitting, labor, logistics, foreign-exchange, and execution surfaces that cannot be quantified from the assigned evidence.
    claimRefs: [CR003, CR005, CR012, CR013, CR014]
    tableRefs: [TR003]
  - id: "mitigations-monitoring-and-kill-criteria"
    title: "Mitigations, monitoring indicators, and kill criteria"
    body: >-
      Current mitigations are partial: the Vremt dispute is settled, supplier payments are pledged within 60 days, projects use external co-investors, and major OEM nominations provide commercial validation. None closes the core diligence gaps. Monitor quarterly warranty provisions, recall populations, cell field-failure rates, supplier days payable, project commissioning and utilization, EVB cash generation, and the status and venue of any listing. Pause or reject the thesis if another material OEM quality claim emerges, safety recalls broaden without a documented root-cause fix, cumulative warranty and settlement charges exceed disclosed reserves, suppliers are paid beyond the pledged window, or committed capacity repeatedly misses commissioning and utilization milestones. The official financial-report landing page did not expose subsidiary-level evidence needed to set numeric thresholds.
    claimRefs: [CR002, CR003, CR004, CR005, CR008, CR009, CR010, CR011, CR015, CR016]
