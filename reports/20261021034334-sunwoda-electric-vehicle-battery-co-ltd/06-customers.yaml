chapter:
  number: 6
  title: Customers
  summary: >-
    Sunwoda EVB has credible production evidence across Chinese and international
    automakers, including shipped batteries for Tesla export vehicles and established
    supply relationships with Li Auto and Xpeng. However, public evidence does not
    disclose retention, renewal, customer-count, or revenue-concentration metrics, while
    the resolved Geely-unit quality dispute demonstrates that customer durability can be
    impaired by costly field remediation.
sections:
  - id: customer-base-and-buying-context
    title: Customer base and buying context
    body: >-
      The observable customer base is concentrated in automotive OEM relationships rather
      than direct end-user sales: Sunwoda offers cells, modules, battery-management systems,
      and packs, while a specialist profile describes OEM/ODM co-development. Independent
      reporting identified Li Auto, Nio, Xpeng, SAIC Motor, GAC Group, and Dongfeng Motor
      among customers by 2022. The evidence also spans international brands, but the proof
      level varies materially: Renault and Nissan appear in a retrospective account, Volvo
      issued only a supplier nomination in the retained record, and Tesla batteries were
      reported as already shipping for export vehicles in 2026. This breadth supports a
      multi-OEM segmentation, but neither account-level revenue nor customer-count
      denominators are public in the assigned evidence.
    claimRefs: [CU001, CU002, CU003, CU007, CU009]
    tableRefs: [TU001]
  - id: adoption-and-production-proof
    title: Adoption and production proof
    body: >-
      Several relationships have progressed beyond logos or announcements. Sunwoda's
      SFC480 battery entered mass production in 2022 and debuted in Xpeng's G9, while the
      chairman later described hybrid-battery production as operating near full capacity.
      Historical installation data also show 0.73 GWh in China during June 2023 and
      2.34 GWh in the second quarter of 2023; these figures evidence manufacturing adoption
      at those dates, not current active-customer counts. The freshest production signal is
      the April 2026 report that batteries had begun shipping from Yiwu for Tesla vehicles
      manufactured in Shanghai and sold overseas. No comparable utilization series or
      account cohort is disclosed, so trajectory analysis must remain milestone-based.
    claimRefs: [CU004, CU005, CU007, CU010, CU011]
    tableRefs: [TU002]
  - id: relationship-depth-and-expansion
    title: Relationship depth and expansion
    body: >-
      Customer depth appears to increase through multiple mechanisms rather than a single
      standardized funnel. Sunwoda has used a secondary-supplier position to enter OEM
      programs; Tesla reportedly buys cells directly and performs module and pack assembly
      itself, while Volvo's retained evidence stops at nomination. Li Auto provides the
      clearest expansion path: after a 2022 minority investment in the EV-battery unit, a
      specialist profile reports a 50:50 battery joint venture formed in September 2025 for
      selected fast-charging vehicle platforms. These examples indicate potential
      land-and-expand behavior, but public evidence does not disclose contract terms,
      renewal rates, awarded volumes, program duration, or customer-level economics.
    claimRefs: [CU006, CU008, CU009, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration-risk
    title: Durability and concentration risk
    body: >-
      Retention and concentration remain the core customer diligence gaps. The assigned
      sources provide no NRR, GRR, churn, renewal, satisfaction, top-customer revenue, or
      contract-length metrics. Qualitative evidence also cautions against treating awarded
      business as durable: Sunwoda's chairman said some customers placed orders and paid
      advances before the orders failed to materialize. Separately, Sunwoda and Geely unit
      Vremt settled a dispute over allegedly defective cells supplied from 2021 through
      2023, with replacement losses shared; Yicai reported that more than 10,000 vehicles
      had received replacement packs. The settlement resolves litigation, not the need to
      test warranty exposure, quality controls, and whether remediation affected future
      sourcing decisions.
    claimRefs: [CU014, CU015, CU016]
