figures:
  - id: FU001
    title: Observed customer relationship maturation paths
    type: journey-map
    summary: >-
      Public examples show several possible steps from secondary-source selection to deeper
      co-development, while quality remediation can interrupt durability.
    data:
      items:
        - label: "Secondary-source selection"
          detail: "Sunwoda positions itself as an additional supplier rather than confronting the dominant incumbent head-on."
          touchpoints:
            - "OEM sourcing process"
            - "Cost and service competition"
        - label: "Technical co-development"
          detail: "Cell, module, BMS, and pack capabilities support OEM/ODM engagement."
          touchpoints:
            - "Engineering qualification"
            - "Platform requirements"
        - label: "Supplier nomination"
          detail: "Volvo evidence establishes nomination but not production."
          touchpoints:
            - "Nomination letter"
            - "Unconfirmed awarded volume"
        - label: "Production ramp"
          detail: "Xpeng model deployment and Tesla export-vehicle shipments provide production-level evidence."
          touchpoints:
            - "Mass production"
            - "Vehicle assembly"
        - label: "Relationship expansion"
          detail: "Li Auto's investment and reported 50:50 joint venture indicate a deeper relationship path."
          touchpoints:
            - "Minority investment"
            - "Joint manufacturing"
        - label: "Quality monitoring and remediation"
          detail: "The Vremt settlement shows that field quality can create replacement obligations and disrupt durability."
          touchpoints:
            - "Battery health monitoring"
            - "Replacement packs"
    approximationNotes: >-
      The ordered path synthesizes observed relationship stages; it is not a conversion funnel,
      does not imply every customer follows every stage, and contains no inferred conversion rates.
    claimRefs: [CU006, CU008, CU009, CU012, CU014, CU015]
callouts:
  - calloutType: strength
    title: Production evidence exceeds a logo list
    body: >-
      Xpeng model deployment, historical installation data, and 2026 Tesla export-vehicle
      shipments provide multiple forms of adoption evidence beyond supplier announcements.
    claimRefs: [CU004, CU007, CU010, CU011]
  - calloutType: risk
    title: Durability is unquantified and quality-sensitive
    body: >-
      No retention or customer-concentration metrics are disclosed, while the Vremt
      settlement and reported replacement program show how quality failures can impose
      financial and relationship costs after production deployment.
    claimRefs: [CU015, CU016]
