company:
  name: "Sunwoda Electric Vehicle Battery Co., Ltd."
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Sunwoda EVB spans cells, modules, BMS and packs, with public evidence of both
    component supply and integrated-pack delivery to automakers. Its 2026
    ultra-fast-charging roadmap is technically ambitious, but series deployment,
    sustained peak performance, independent durability validation and software
    assurance remain material diligence gaps.
sections:
  - id: product-boundary-and-workflow
    title: "Product boundary and customer workflow"
    body: >-
      Sunwoda EVB sells an automotive battery-system capability rather than a
      single undifferentiated cell. The disclosed scope runs from cells through
      modules, battery-management systems and packs, allowing an automaker to buy
      at different integration depths. Volkswagen selected the company for an HEV
      pack-system program, while independent reporting says Tesla buys Sunwoda
      cells and performs module and pack assembly itself. Those examples place
      Sunwoda inside the OEM engineering, qualification, sourcing and production
      workflow, but they do not disclose yields, field reliability, vehicle-level
      economics or the share of programs that progress from nomination to volume.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: architecture-and-control
    title: "Architecture and control surfaces"
    body: >-
      The public architecture has six observable layers: chemistry, cells,
      modules, packs, embedded battery control, and a newer cloud-connected
      charging layer. Sunwoda says the flash-charging system combines smart cells,
      an energy-domain controller and an AI cloud-control platform for monitoring
      and early warnings. This is a meaningful expansion from electrochemistry
      into controls and lifecycle operations, but the disclosures do not identify
      software interfaces, redundancy, over-the-air governance, cybersecurity
      controls or functional-safety certifications. The 15C label is also a peak
      power measure, not a whole-session average, so thermal throttling and charging
      curves matter more than the headline alone.
    claimRefs: [CE002, CE007, CE010, CE011, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: "Maturity, deployment and differentiation"
    body: >-
      Commercial maturity is uneven across the portfolio. Pack supply has an
      established nomination path with Volkswagen, and reporting indicates LFP
      cells are shipping from Yiwu for Tesla vehicles exported from Shanghai.
      The newer flash-charging system is earlier: Sunwoda disclosed room-temperature
      charging targets and a 2027 infrastructure ambition, yet did not name the
      first vehicle, mass-production timing, investment plan or station locations.
      BYD's vehicle-linked five-minute charging benchmark shows that rapid charging
      is becoming a competitive requirement, not a unique moat. Sunwoda's case
      therefore depends on converting laboratory and conference claims into
      independently tested series applications.
    claimRefs: [CE004, CE005, CE007, CE008, CE009, CE012, CE014, CE015]
  - id: quality-trust-and-diligence
    title: "Quality, trust and diligence priorities"
    body: >-
      Quality risk is not theoretical. A Geely-affiliated customer alleged that
      cells supplied during 2021–2023 were defective and caused losses, although
      that allegation does not by itself establish defect prevalence or root
      cause. Sunwoda separately claims advance fault warnings with high accuracy,
      but no assigned source provides a validation protocol, false-positive rate,
      field denominator or independent test. Investors should request pack- and
      cell-level warranty cohorts, thermal-event history, supplier-change controls,
      validation reports, functional-safety and cybersecurity evidence, and named
      series-production milestones. No public developer or practitioner-community
      signal was present in the assigned evidence, so integration operability
      cannot be assessed externally.
    claimRefs: [CE011, CE013, CE014, CE016]
