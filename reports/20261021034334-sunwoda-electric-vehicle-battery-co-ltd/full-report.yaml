              - CP009
              - CP010
              - CP011
      - number: '3.2'
        title: OEM access is the strongest demonstrated competitive asset
        blocks:
          - type: paragraph
            body: >-
              Sunwoda has accumulated several forms of OEM validation. Nissan announced a study of next-generation
              batteries and a stable production system in 2020; Sunwoda later disclosed a Volvo supplier nomination; and
              2026 reporting said Sunwoda had entered Tesla's global supply chain as its fifth power-battery supplier.
              The April 2026 customer mix was also relatively distributed: Nio represented 17.4% of Sunwoda's
              installations, SGMW 16.7%, Dongfeng-Nissan 14.4%, Dongfeng 12.0%, and Dongfeng-Liuzhou 10.3%. That profile
              is less captive than FinDreams, whose reported supply was 58.0% concentrated on BYD, and less concentrated
              than Svolt's combined exposure to Leapmotor and Great Wall Motor. The evidence supports access and
              multi-homing, not bargaining power: nominations, studies, and installation shares do not disclose program
              profitability, renewal terms, or awarded lifetime volume.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: The offer spans cells and integration, but price leadership is unverified
        blocks:
          - type: paragraph
            body: >-
              The Tesla program illustrates both Sunwoda's capability and the limits of supplier lock-in. Reporting says
              Tesla buys cells directly from Sunwoda and performs module and pack assembly itself, while the supplied
              third-generation LFP cells support charging rates of up to 3C. This gives Sunwoda a route into a major
              account without owning the full pack, but it also leaves integration value and architecture control with
              the OEM. The same report attributes customer attraction to competitive pricing and service, yet it
              publishes no unit price, contract duration, warranty allocation, discount schedule, or realized margin.
              Nissan's co-development study and Volvo's nomination point to deeper supplier relationships, but their
              economics are likewise undisclosed. Buyers therefore appear able to multi-source and choose different
              make-versus-buy boundaries; public evidence does not establish durable switching costs for Sunwoda.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Scale economics and OEM bargaining power constrain moat durability
        blocks:
          - type: paragraph
            body: >-
              Sunwoda describes itself as a global top-ten power-battery installer, but the independent April snapshot
              shows how far the company remains from the leaders. CATL's 47.0% share supplies scale, customer breadth,
              and procurement leverage that a 2.2% participant cannot match on public evidence. At the same time,
              Tesla's addition of a fifth global supplier and its decision to internalize module and pack work show that
              OEMs can diversify cell supply and retain higher-level integration. Industry economics are adverse:
              Reuters reported that price wars and weakening demand had squeezed margins and lengthened supplier payment
              delays. Sunwoda's distributed OEM mix and fast-charge claim are credible footholds, but neither is shown
              to be exclusive. The moat is therefore best characterized as qualified engineering access and execution
              rather than proprietary lock-in; displacement risk remains high if larger rivals match price, chemistry,
              charging performance, or localization.
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence-backed foothold
            body: >-
              Nissan, Volvo, and reported Tesla relationships show that Sunwoda can qualify with global OEMs even
              without incumbent-scale market share.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP004
          - type: callout
            title: No public proof of price or margin advantage
            body: >-
              Competitive-pricing language is qualitative, while OEM internal integration and supplier diversification
              limit the evidence for durable lock-in.
            calloutType: risk
            claimRefs:
              - CP005
              - CP015
