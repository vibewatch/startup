          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI007
              - CI008
              - CI014
              - CI015
      - number: '4.2'
        title: Historical segment economics and pricing pressure
        blocks:
          - type: paragraph
            body: >-
              The latest detailed segment economics in the assigned evidence are historical. EV-battery revenue rose to
              RMB12.687 billion in 2022, with 12.11 GWh shipped and a 10.28% gross margin, then declined to RMB10.795
              billion in 2023 as shipments fell to 11.66 GWh. The 2023 filing reported an 11.22% gross margin, a 0.94
              percentage-point improvement despite the revenue contraction. Dividing disclosed revenue by shipments
              gives an estimated realized revenue intensity of about RMB1.047 billion per GWh in 2022 and RMB0.926
              billion per GWh in 2023, an approximately 11.6% decline. This is a blended analytical proxy, not a
              disclosed price: product chemistry, cell-versus-system mix, contract timing, and customer mix can all move
              it. No public customer-level pricing, discounts, rebates, or current 2026 margin bridge was found.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI012
      - number: '4.3'
        title: Cost structure, capital intensity, and liquidity limits
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates a manufacturing model with substantial fixed-asset, working-capital, warranty, and
              financing demands. At the parent group, 2023 operating cash flow was RMB3.618 billion, while purchases of
              fixed assets, intangible assets, and other long-term assets consumed RMB5.896 billion and financing cash
              flow contributed RMB4.275 billion. Year-end cash equivalents were RMB13.669 billion, but the same
              consolidated perimeter carried RMB8.820 billion of short-term borrowings, RMB6.667 billion of long-term
              borrowings, and RMB399 million of bonds. Product-quality provisions reached RMB599 million and
              predominantly covered after-sales service for automotive batteries. None of these parent-level balances
              establishes EVB subsidiary cash, burn, runway, or leverage. In 2026, reported equity raises and project
              guarantees provide fresh evidence of capital access, but funding raised and guarantee capacity are not
              cash available to the subsidiary.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI008
              - CI009
              - CI010
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality benefits from named global OEM programs and point-in-time recognition tied to delivery or
              acceptance, but nominations alone do not establish firm backlog and the disclosed segment margin was thin.
              The observed fall in blended revenue per GWh between 2022 and 2023 is consistent with mix or pricing
              pressure, although the public record cannot isolate either cause. Capital intensity remains the central
              underwriting constraint: recent equity transactions show access to investors, yet the public sources do
              not reconcile those proceeds to EVB cash, committed plant spending, debt service, or a next-round trigger.
              A quality dispute adds a concrete downside signal: the settlement was expected to reduce parent 2025 net
              profit by RMB500-800 million. The round-by-round financing chronology belongs in Company Overview; for
              Financials, an investment decision should wait for a current subsidiary P&L, cash-flow statement, balance
              sheet, capex schedule, contract backlog, and warranty-loss bridge.
            claimRefs:
              - CI003
              - CI006
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Parent liquidity is not subsidiary runway
            body: >-
              The available cash-flow, cash, borrowing, and bond figures are consolidated Sunwoda Electronic balances.
              They cannot be used to calculate EVB burn or runway without legal-entity statements and intercompany
              flows.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI013
          - type: callout
            title: Gate underwriting on a current standalone financial pack
            body: >-
              Require 2024-2026 subsidiary statements, customer-level pricing and backlog, plant capex commitments, debt
              covenants, and warranty-loss detail before treating recent financing as evidence of adequate runway.
            calloutType: recommendation
            claimRefs:
