      - number: '5.3'
        title: Maturity, deployment and differentiation
        blocks:
          - type: paragraph
            body: >-
              Commercial maturity is uneven across the portfolio. Pack supply has an established nomination path with
              Volkswagen, and reporting indicates LFP cells are shipping from Yiwu for Tesla vehicles exported from
              Shanghai. The newer flash-charging system is earlier: Sunwoda disclosed room-temperature charging targets
              and a 2027 infrastructure ambition, yet did not name the first vehicle, mass-production timing, investment
              plan or station locations. BYD's vehicle-linked five-minute charging benchmark shows that rapid charging
              is becoming a competitive requirement, not a unique moat. Sunwoda's case therefore depends on converting
              laboratory and conference claims into independently tested series applications.
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE009
              - CE012
              - CE014
              - CE015
      - number: '5.4'
        title: Quality, trust and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Quality risk is not theoretical. A Geely-affiliated customer alleged that cells supplied during 2021–2023
              were defective and caused losses, although that allegation does not by itself establish defect prevalence
              or root cause. Sunwoda separately claims advance fault warnings with high accuracy, but no assigned source
              provides a validation protocol, false-positive rate, field denominator or independent test. Investors
              should request pack- and cell-level warranty cohorts, thermal-event history, supplier-change controls,
              validation reports, functional-safety and cybersecurity evidence, and named series-production milestones.
              No public developer or practitioner-community signal was present in the assigned evidence, so integration
              operability cannot be assessed externally.
            claimRefs:
              - CE011
              - CE013
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multiple integration depths
            body: >-
              Public examples show Sunwoda delivering a pack system to one OEM while another reportedly buys cells and
              retains module and pack assembly.
            calloutType: insight
            claimRefs:
              - CE002
              - CE004
              - CE006
          - type: callout
            title: Headline charging rate is not validation
            body: >-
              The 15C figure is a peak measure, while series application, sustained thermal performance and independent
              durability evidence remain undisclosed.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying context
        blocks:
          - type: paragraph
            body: >-
              The observable customer base is concentrated in automotive OEM relationships rather than direct end-user
              sales: Sunwoda offers cells, modules, battery-management systems, and packs, while a specialist profile
              describes OEM/ODM co-development. Independent reporting identified Li Auto, Nio, Xpeng, SAIC Motor, GAC
              Group, and Dongfeng Motor among customers by 2022. The evidence also spans international brands, but the
              proof level varies materially: Renault and Nissan appear in a retrospective account, Volvo issued only a
              supplier nomination in the retained record, and Tesla batteries were reported as already shipping for
              export vehicles in 2026. This breadth supports a multi-OEM segmentation, but neither account-level revenue
              nor customer-count denominators are public in the assigned evidence.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU007
              - CU009
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption and production proof
        blocks:
          - type: paragraph
            body: >-
              Several relationships have progressed beyond logos or announcements. Sunwoda's SFC480 battery entered mass
              production in 2022 and debuted in Xpeng's G9, while the chairman later described hybrid-battery production
              as operating near full capacity. Historical installation data also show 0.73 GWh in China during June 2023
              and 2.34 GWh in the second quarter of 2023; these figures evidence manufacturing adoption at those dates,
              not current active-customer counts. The freshest production signal is the April 2026 report that batteries
              had begun shipping from Yiwu for Tesla vehicles manufactured in Shanghai and sold overseas. No comparable
              utilization series or account cohort is disclosed, so trajectory analysis must remain milestone-based.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU010
              - CU011
      - number: '6.3'
        title: Relationship depth and expansion
        blocks:
          - type: paragraph
            body: >-
              Customer depth appears to increase through multiple mechanisms rather than a single standardized funnel.
              Sunwoda has used a secondary-supplier position to enter OEM programs; Tesla reportedly buys cells directly
              and performs module and pack assembly itself, while Volvo's retained evidence stops at nomination. Li Auto
              provides the clearest expansion path: after a 2022 minority investment in the EV-battery unit, a
              specialist profile reports a 50:50 battery joint venture formed in September 2025 for selected
              fast-charging vehicle platforms. These examples indicate potential land-and-expand behavior, but public
              evidence does not disclose contract terms, renewal rates, awarded volumes, program duration, or
              customer-level economics.
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU009
              - CU012
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU012
              - CU014
              - CU015
      - number: '6.4'
        title: Durability and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Retention and concentration remain the core customer diligence gaps. The assigned sources provide no NRR,
              GRR, churn, renewal, satisfaction, top-customer revenue, or contract-length metrics. Qualitative evidence
              also cautions against treating awarded business as durable: Sunwoda's chairman said some customers placed
              orders and paid advances before the orders failed to materialize. Separately, Sunwoda and Geely unit Vremt
              settled a dispute over allegedly defective cells supplied from 2021 through 2023, with replacement losses
              shared; Yicai reported that more than 10,000 vehicles had received replacement packs. The settlement
              resolves litigation, not the need to test warranty exposure, quality controls, and whether remediation
              affected future sourcing decisions.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production evidence exceeds a logo list
            body: >-
              Xpeng model deployment, historical installation data, and 2026 Tesla export-vehicle shipments provide
              multiple forms of adoption evidence beyond supplier announcements.
            calloutType: strength
            claimRefs:
              - CU004
              - CU007
              - CU010
              - CU011
          - type: callout
            title: Durability is unquantified and quality-sensitive
            body: >-
              No retention or customer-concentration metrics are disclosed, while the Vremt settlement and reported
              replacement program show how quality failures can impose financial and relationship costs after production
              deployment.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Quality, legal, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Product quality is the clearest thesis-breaking risk. Vremt sought RMB 2.31 billion over alleged defects
              in cells supplied from 2021 through 2023; the dispute was later settled, but Sunwoda estimated a RMB
              500-800 million impact on 2025 net profit. Separately, Volvo announced EX30 recall plans in several
              markets for an overheating risk that could lead to fire, and the cited U.S. safety record identified
              Sunwoda Power Battery Company batteries. The settlement reduces litigation uncertainty but does not
              establish root cause, affected-vehicle count, warranty-reserve adequacy, or whether field-failure rates
              are improving. Those missing operating facts, rather than the absence of a pending case, drive the high
              residual rating.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
              - CR016
      - number: '7.2'
        title: Operational scale, capital intensity, and working capital
        blocks:
          - type: paragraph
            body: >-
              Expansion creates a second high-risk cluster. Public reporting describes a 30 GWh Shandong project funded
              through a RMB 3 billion vehicle, planned EVB projects of RMB 8 billion and RMB 12 billion, and a separate
              RMB 2.3 billion cylindrical-cell facility financed with self-raised funds. These announcements demonstrate
              access to projects and partners, but they also expose the business to utilization, construction,
              commissioning, commodity, and refinancing risk before project-level returns are visible. The industry's
              60-day supplier-payment initiative is a mitigation, not proof that Sunwoda has no working-capital stress:
              Reuters reported that delayed payments were already straining suppliers across the sector.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Partner, customer, and geographic dependencies
        blocks:
          - type: paragraph
            body: >-
              Customer nominations can accelerate utilization but also transfer bargaining power and warranty exposure
              to sophisticated automakers. Sunwoda announced a Volvo nomination, while independent reporting said Tesla
              began using its cells for Shanghai-built export vehicles under a direct cell-purchase model. The
              Geely-affiliated quality dispute shows that an OEM relationship can become a concentrated financial and
              reputational liability. Government-backed capital in the Shandong project diversifies funding, yet adds
              counterparty and policy dependencies. Sunwoda's company-reported production footprint across China, India,
              Vietnam, Hungary, Morocco, and Thailand broadens market access while increasing permitting, labor,
              logistics, foreign-exchange, and execution surfaces that cannot be quantified from the assigned evidence.
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Current mitigations are partial: the Vremt dispute is settled, supplier payments are pledged within 60
              days, projects use external co-investors, and major OEM nominations provide commercial validation. None
              closes the core diligence gaps. Monitor quarterly warranty provisions, recall populations, cell
              field-failure rates, supplier days payable, project commissioning and utilization, EVB cash generation,
              and the status and venue of any listing. Pause or reject the thesis if another material OEM quality claim
              emerges, safety recalls broaden without a documented root-cause fix, cumulative warranty and settlement
              charges exceed disclosed reserves, suppliers are paid beyond the pledged window, or committed capacity
              repeatedly misses commissioning and utilization milestones. The official financial-report landing page did
              not expose subsidiary-level evidence needed to set numeric thresholds.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              A new material OEM quality claim, widening safety recall without verified remediation, or repeated
              capacity ramp misses would indicate that settlement and commercial nominations are not containing
              execution risk.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track / research more, with medium confidence, high risk, and an
              insufficient-public-support valuation stance. The strongest current price evidence is a May 2026 financing
              summary that places the round at RMB25 billion pre-money; the older 2022 report described an approximately
              RMB30 billion valuation after a much larger financing. Those marks are not directly comparable because
              their pre- and post-money bases, security rights, and capitalization effects differ. Even so, the lower
              nominal reference, the capital-reserve adjustment, and the absence of stand-alone cash-flow evidence argue
              against treating the current price as validated. Investment consideration should wait for audited
              subsidiary economics, the fully diluted cap table, preference terms, and debt exposure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV010
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Operating proof versus downside evidence
        blocks:
          - type: paragraph
            body: >-
              The thesis has real operating support but not enough valuation support. CnEVPost reported that Sunwoda EVB
              entered Tesla's global supply chain and was already shipping cells for export vehicles, while an official
              Sunwoda release records a Volvo supplier nomination. A 36Kr report also cited more than 1.5 million
              installed HEV battery units, and SNE-derived market data placed Sunwoda tenth globally with 2.2% share in
              the first quarter of 2026. The anti-thesis is equally concrete: scale remains far below the leaders, a
              Geely affiliate brought a RMB2.31 billion quality claim, and later reporting expected a RMB500 million to
              RMB800 million impact on 2025 attributable net profit from settlement. Customer validation therefore does
              not eliminate execution or warranty-cost risk.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: Financing scenarios and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The public marks permit a scenario frame, not a discounted-cash-flow valuation or a target return. A bear
              case sits below the RMB25 billion pre-money reference if audited margins, leverage, or settlement
              economics disappoint. A base case uses RMB25 billion only as an entry checkpoint pending clean terms and
              verified profitability. A bull case can discuss the observed RMB25 billion to roughly RMB30 billion mark
              band only as a diligence bracket, not a like-for-like fair-value range. Exit readiness has advanced from a
              preliminary 2023 ChiNext plan to an April 2026 report that a Hong Kong application had been submitted in
              July 2025, but current approval status, timing, float, and pricing remain unverified in the assigned
              evidence.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The decisive diligence package is narrow and measurable: audited EVB income statements and cash flows;
              debt, guarantees, and project-finance obligations; a fully diluted capitalization table before and after
              the May 2026 round; liquidation preferences and anti-dilution rights; final settlement accounting;
              warranty reserves and quality-loss history; and the live Hong Kong listing timetable. The view improves if
              those materials show durable positive margins, contained quality costs, continued OEM shipments, and a
              clean route to liquidity without punitive dilution. It breaks if the IPO path stalls, customer programs
              are lost, quality costs exceed the reported settlement range, market share retreats materially, or a
              financing below RMB25 billion arrives without compensating investor protections.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the missing proof
            body: >-
              Commercial traction is investable only if audited subsidiary economics and financing rights justify the
              entry mark; the public evidence does not yet establish that condition.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV016
