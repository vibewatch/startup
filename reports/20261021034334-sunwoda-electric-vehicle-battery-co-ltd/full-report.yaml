  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product boundary and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Sunwoda EVB sells an automotive battery-system capability rather than a single undifferentiated cell. The
              disclosed scope runs from cells through modules, battery-management systems and packs, allowing an
              automaker to buy at different integration depths. Volkswagen selected the company for an HEV pack-system
              program, while independent reporting says Tesla buys Sunwoda cells and performs module and pack assembly
              itself. Those examples place Sunwoda inside the OEM engineering, qualification, sourcing and production
              workflow, but they do not disclose yields, field reliability, vehicle-level economics or the share of
              programs that progress from nomination to volume.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE007
              - CE008
              - CE010
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE010
              - CE011
              - CE013
      - number: '5.2'
        title: Architecture and control surfaces
        blocks:
          - type: paragraph
            body: >-
              The public architecture has six observable layers: chemistry, cells, modules, packs, embedded battery
              control, and a newer cloud-connected charging layer. Sunwoda says the flash-charging system combines smart
              cells, an energy-domain controller and an AI cloud-control platform for monitoring and early warnings.
              This is a meaningful expansion from electrochemistry into controls and lifecycle operations, but the
              disclosures do not identify software interfaces, redundancy, over-the-air governance, cybersecurity
              controls or functional-safety certifications. The 15C label is also a peak power measure, not a
              whole-session average, so thermal throttling and charging curves matter more than the headline alone.
            claimRefs:
              - CE002
              - CE007
