  - id: FI001
    title: Revenue model bridge from OEM program to gross profit
    type: flow
    summary: >-
      Public evidence supports the operating sequence, but not conversion rates, contract values, or customer-level
      contribution margins.
    data:
      nodes:
        - id: nomination
          label: OEM nomination
          detail: Supplier selection or fixed-point notice; not recognized revenue.
        - id: qualification
          label: Qualification and development
          detail: Engineering, validation, and program preparation precede production.
        - id: order
          label: Volume order
          detail: Public sources do not disclose committed volume or take-or-pay protection.
        - id: delivery
          label: Cell, module, or pack delivery
          detail: Delivered scope varies; Tesla reportedly buys cells and assembles modules and packs.
        - id: acceptance
          label: Customer acceptance or VMI pickup
          detail: The parent policy recognizes battery revenue when control transfers.
        - id: revenue
          label: Product revenue
          detail: Reported EV-battery segment revenue was RMB10.795bn in 2023.
        - id: gross-profit
          label: Gross profit after production and warranty costs
          detail: Reported EV-battery gross margin was 11.22% in 2023.
      edges:
        - from: nomination
