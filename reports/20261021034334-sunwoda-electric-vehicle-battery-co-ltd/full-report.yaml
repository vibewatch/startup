        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert market snapshots into TAM
            body: >-
              The available EV metrics mix monthly, quarterly, annual, Chinese, and global denominators. They establish
              participation and historical position, not a current addressable-market value or a reliable Sunwoda SOM.
            calloutType: risk
            claimRefs:
