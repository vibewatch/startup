      - - Thesis
        - SNE-derived data placed Sunwoda tenth globally at 2.2% share in Q1 2026.
        - Share gains without margin sacrifice would improve operating leverage.
      - - Anti-thesis
        - >-
          The May 2026 RMB25 billion pre-money mark is nominally below the roughly RMB30 billion valuation reported in
          2022.
        - Like-for-like security terms and a reconciled cap table could show the apparent reset is overstated.
      - - Anti-thesis
        - A Geely affiliate sought RMB2.31 billion over alleged cell defects.
        - Final releases, reserve adequacy, and declining field-failure data would contain the risk.
      - - Anti-thesis
        - >-
          Later reporting expected a RMB500 million-RMB800 million impact on 2025 attributable net profit from
          settlement.
        - Audited settlement accounting below the range and no repeat claims would reduce the overhang.
    notes: >-
      Customer and market evidence is not a margin benchmark; valuation marks differ in date and transaction basis, and
      quality claims are reported allegations or expected impacts as stated.
    claimRefs:
      - CV005
      - CV006
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
  - id: TV003
    title: Bull / base / bear scenario frame
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          OEM programs scale, audited margins are positive, settlement costs stay contained, and Hong Kong listing
          progresses.
        - >-
          RMB25 billion-RMB30 billion is only an observed public-mark bracket; upside requires verified earnings and
          clean terms.
        - IPO delay, price competition, dilution, and warranty recurrence.
        - Weak until audited economics and listing milestones are disclosed.
      - - Base
        - >-
          Current customer programs persist, market position holds near the cited 2.2% share, and quality costs remain
          manageable.
        - >-
          Use RMB25 billion pre-money solely as a negotiation anchor; require return underwriting from audited cash
          flow.
        - Low share, unclear leverage, preference overhang, and margin opacity.
        - Moderate operating signal but weak valuation confidence.
      - - Bear
        - >-
          Quality costs exceed the reported range, market share falls, IPO timing slips, or financing terms become more
          protective.
        - >-
          Entry should be below RMB25 billion pre-money or deferred; no precise floor is supportable without
          balance-sheet data.
        - Down-round, customer loss, litigation recurrence, and liquidity pressure.
        - Material because each trigger is unresolved or has a public precursor.
    notes: >-
      Ranges are scenario checkpoints based on non-comparable 2022 and 2026 public marks, not a fair-value opinion;
      probability signals are qualitative because stand-alone financials and terms are unavailable.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
      - CV016
