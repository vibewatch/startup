  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A concentrated market leaves Sunwoda in the challenger tier
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than a list of specialist battery startups. Buyers can source from the
              scaled Chinese leaders CATL and FinDreams, diversified challengers such as CALB and Gotion, OEM-linked
              suppliers such as Svolt, or pursue a buy-and-build split in which they buy cells but integrate modules and
              packs internally. Multiples.vc also identifies Farasis, SVOLT, YinLong, StoreDot, QuantumScape, and BAIC
              BluePark as comparables, but its taxonomy mixes cell makers, technology developers, and vehicle companies
              and therefore is directional rather than a like-for-like operating benchmark. April 2026 installation data
              provides the clearest common basis: CATL held 47.0%, FinDreams 18.3%, CALB 8.5%, Gotion 6.1%, and Sunwoda
              2.2%. Sunwoda's ninth-place position means it must win on OEM access, service, or economics rather than
              installed-base leadership.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
