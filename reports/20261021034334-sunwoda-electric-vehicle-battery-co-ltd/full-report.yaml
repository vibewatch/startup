  - id: FP001
    title: 'April 2026 China competitive positioning: scale versus disclosed OEM diversity'
    type: quadrant
    summary: >-
      Ordinal scoring places Sunwoda among smaller suppliers but with a more distributed disclosed OEM mix than captive
      or highly concentrated peers.
    data:
      points:
        - label: CATL
          x: 5
          'y': 5
          note: 47.0% share; five disclosed leading OEMs, none above 9.5%.
        - label: FinDreams
          x: 4
          'y': 2
          note: 18.3% share; BYD represented 58.0% of supply.
        - label: CALB
          x: 3
          'y': 4
          note: 8.5% share; five disclosed leading OEMs, largest at 16.0%.
        - label: Gotion
          x: 3
          'y': 4
          note: 6.1% share; five disclosed leading OEMs, largest at 18.3%.
        - label: Svolt
          x: 2
          'y': 3
          note: 2.6% share; Leapmotor and GWM represented 44.3% and 37.1%.
        - label: Sunwoda
          x: 2
          'y': 4
          note: 2.2% share; five disclosed leading OEMs ranged from 10.3% to 17.4%.
    approximationNotes: >-
      X is an ordinal scale score from April 2026 China share: 1 below 2%, 2 from 2.0% to 4.9%, 3 from 5.0% to 9.9%, 4
      from 10.0% to 29.9%, and 5 at 30% or more. Y is an ordinal disclosed-customer-diversity score: 2 for majority
      captive supply, 3 for two customers above 35%, 4 for five named customers with none above 20%, and 5 for five
      named customers with none above 10%. The scores are derived from one monthly China snapshot and are not global
      rankings or quality benchmarks.
