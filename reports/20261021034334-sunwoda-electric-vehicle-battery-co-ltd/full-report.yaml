chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and disclosure boundary
        blocks:
          - type: paragraph
            body: >-
              Sunwoda Electric Vehicle Battery Co., Ltd. should be underwritten as a controlled operating subsidiary
              rather than treated as interchangeable with listed parent Sunwoda Electronic. Sunwoda's own Volvo
              announcement describes EVB as a holding subsidiary, while independent reporting says the parent expected
              to retain absolute control after a proposed separation. The parent was co-founded in December 1997, is
              headquartered in Shenzhen, and reports across six battery and adjacent business segments. Those parent
              facts provide governance context, but they do not establish EVB's separate founding date, registered
              headquarters, workforce, or complete legal-name history. A 2026 filing-derived report calls the financed
              entity Sunwoda Mobility Energy Technology, making current registry confirmation a diligence item rather
              than an identity assumption.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO007
              - CO008
              - CO012
      - number: '1.2'
        title: Operating scale and commercial position
        blocks:
          - type: paragraph
            body: >-
              The strongest operating figures are segment disclosures from the parent, not standalone EVB accounts. For
              2024, Sunwoda reported 25.29 GWh of power-battery shipments, up 116.89% year on year, and CNY 15.139
              billion of electric-vehicle-battery sales, up 40.24% and equal to 27.02% of group revenue. Commercial
              evidence includes a 2022 Volvo battery nomination and April 2026 reporting that Sunwoda EVB had become
              Tesla's fifth global power-battery supplier, with cells shipping from Yiwu for export vehicles. These
              points demonstrate OEM access and scaled production, but neither nomination nor supplier status discloses
              contract value, committed volume, customer concentration, or subsidiary profitability.
            claimRefs:
              - CO003
              - CO004
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO010
              - CO013
      - number: '1.3'
        title: Ownership, leadership, and capital formation
        blocks:
          - type: paragraph
            body: >-
              Control remains anchored in the listed parent and its operating leadership. Parent chairman and general
              manager Wang Wei co-founded Sunwoda with Wang Mingwang, while parent deputy general manager Liang Rui is
              disclosed as EVB chairman, creating clear operational oversight but also concentration around parent
              executives. Capital formation has broadened the shareholder base: a 2022 plan involved CNY 2.43 billion
              from 19 companies for 19.5495%, and the May 2026 round raised about CNY 1.68 billion from 13 investors at
              a CNY 25 billion pre-money valuation. Filing-derived reporting says the holding entity's stake would fall
              from 40.03% to 27.18% while management control remained, after a capital-reserve conversion intended to
              address a valuation decrease. The complete post-money cap table and investor rights are not public in the
              retained evidence.
            claimRefs:
