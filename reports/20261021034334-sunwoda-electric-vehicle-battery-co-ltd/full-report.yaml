  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Core market boundary and adjacencies
        blocks:
          - type: paragraph
            body: >-
              The investable core is the value of EV traction cells, modules, packs, and battery-management systems
              procured by automakers for battery-electric, plug-in-hybrid, and hybrid programs. Sunwoda's reported
              portfolio spans those layers, so the boundary is broader than cells alone but narrower than all
              lithium-ion batteries. Consumer-device batteries are excluded because their buyers, qualification cycles,
              and economics differ. Stationary energy storage is an adjacency, not part of the core EVB TAM, even though
              Sunwoda says the parent operates in both power-battery and storage-battery segments. Status-quo
              alternatives include incumbent cell suppliers, OEM in-house module and pack assembly, and competing
              chemistries; Tesla's reported decision to buy cells while assembling modules and packs itself shows that
              supplier scope can stop at the cell rather than covering the whole system.
            claimRefs:
              - CM001
              - CM006
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM009
              - CM013
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing and position
        blocks:
          - type: paragraph
            body: >-
              The evidence does not support a single top-down market value. Instead, it offers historical operating
              lenses: Sunwoda had 0.73 GWh of Chinese installations and 2.21% share in June 2023, 2.34 GWh in China
              during the second quarter of 2023, and 4.7 GWh globally in January-August 2023 for a 1.4% share. A
              separate source reported 12.11 GWh of 2022 power-battery shipments. These periods, geographies, and
              denominators are not interchangeable and therefore cannot be summed into SOM. BloombergNEF figures
              reported by pv magazine show the adjacent stationary storage market adding 112 GW and 307 GWh in 2025,
              with 158 GW and 459 GWh forecast for 2026; those figures indicate battery-demand momentum but are not an
              EV traction-battery TAM.
            claimRefs:
