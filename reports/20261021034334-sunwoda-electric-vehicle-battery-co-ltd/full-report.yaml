      - number: '1.4'
        title: Milestones, listing path, and adverse events
        blocks:
          - type: paragraph
            body: >-
              EVB's development path combines rapid scaling with unresolved corporate-process risk. A ChiNext separation
              proposed in July 2023 was preliminary and required shareholder and regulatory approval; later reporting
              says EVB filed for a Hong Kong listing in July 2025, but the retained evidence does not establish its
              status as of the run date. The most material adverse event was VREMT's CNY 2.31 billion claim over
              allegedly defective cells supplied during 2021-2023. December 2025 reports said the case had not been
              heard and its impact was uncertain; by April 2026, CnEVPost reported a settlement with a CNY 500-800
              million expected impact on parent 2025 attributable net profit. The sequence reduces open litigation
              uncertainty but leaves settlement terms, technical root cause, remediation, and subsidiary allocation
              unverified.
