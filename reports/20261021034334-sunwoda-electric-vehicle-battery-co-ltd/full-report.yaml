      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Automakers are the direct buyers and payers; vehicle programs, procurement teams, battery engineering,
              quality, and manufacturing functions determine qualification and award scope. Drivers are indirect users,
              while the OEM owns warranty exposure and captures vehicle-level cost savings. Public evidence confirms
              different contracting models: Volvo issued a battery supplier nomination, Volkswagen selected Sunwoda for
              HEV pack systems, and a 2026 report said Tesla bought Sunwoda cells while retaining module and pack
              assembly. That report also placed power-battery procurement above 30% of vehicle cost, explaining strong
              buyer focus on price and bargaining leverage. Adoption therefore proceeds through nomination, validation,
              launch, and scaled vehicle production rather than a short transactional sale.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              OEM supplier diversification, faster-charging LFP demand, and geographic manufacturing expansion can widen
              Sunwoda's addressable programs, while stationary storage creates a separate growth adjacency. The offset
              is structural: a reported RMB 21.3 billion Yiwu project for 5 GWh of annual capacity illustrates the
              capital required before utilization and returns are known. Automakers retain bargaining power because
              batteries are a large share of vehicle cost and can unbundle cells from modules and packs. European-bound
              batteries also face expanding traceability obligations; a technical-industry source reports a full EU
              digital battery-passport mandate from February 2027 after 2026 carbon-footprint and labeling milestones.
              Valuation work should therefore request current capacity, utilization, awarded volumes, program pricing,
              qualification status, and compliance readiness before applying a market-growth multiple.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
