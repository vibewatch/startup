company:
  name: "Sunwoda Electric Vehicle Battery Co., Ltd."
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Sunwoda EVB addresses the OEM traction-battery value chain from cells through packs and
    battery-management systems, but the assigned evidence supports only historical share and
    shipment snapshots rather than a defensible current TAM, SAM, or SOM. Current demand signals
    include OEM supply-chain diversification and a fast-growing stationary-storage adjacency,
    while capital intensity, buyer bargaining power, and traceability regulation constrain
    adoption economics.
sections:
  - id: market-boundary
    title: "Core market boundary and adjacencies"
    body: >-
      The investable core is the value of EV traction cells, modules, packs, and battery-management
      systems procured by automakers for battery-electric, plug-in-hybrid, and hybrid programs.
      Sunwoda's reported portfolio spans those layers, so the boundary is broader than cells alone
      but narrower than all lithium-ion batteries. Consumer-device batteries are excluded because
      their buyers, qualification cycles, and economics differ. Stationary energy storage is an
      adjacency, not part of the core EVB TAM, even though Sunwoda says the parent operates in both
      power-battery and storage-battery segments. Status-quo alternatives include incumbent cell
      suppliers, OEM in-house module and pack assembly, and competing chemistries; Tesla's reported
      decision to buy cells while assembling modules and packs itself shows that supplier scope can
      stop at the cell rather than covering the whole system.
    claimRefs: [CM001, CM006, CM009]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: "Evidence-constrained sizing and position"
    body: >-
      The evidence does not support a single top-down market value. Instead, it offers historical
      operating lenses: Sunwoda had 0.73 GWh of Chinese installations and 2.21% share in June 2023,
      2.34 GWh in China during the second quarter of 2023, and 4.7 GWh globally in January-August
      2023 for a 1.4% share. A separate source reported 12.11 GWh of 2022 power-battery shipments.
      These periods, geographies, and denominators are not interchangeable and therefore cannot be
      summed into SOM. BloombergNEF figures reported by pv magazine show the adjacent stationary
      storage market adding 112 GW and 307 GWh in 2025, with 158 GW and 459 GWh forecast for 2026;
      those figures indicate battery-demand momentum but are not an EV traction-battery TAM.
    claimRefs: [CM002, CM003, CM004, CM005, CM013, CM014, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: "Buyer, user, payer, and adoption path"
    body: >-
      Automakers are the direct buyers and payers; vehicle programs, procurement teams, battery
      engineering, quality, and manufacturing functions determine qualification and award scope.
      Drivers are indirect users, while the OEM owns warranty exposure and captures vehicle-level
      cost savings. Public evidence confirms different contracting models: Volvo issued a battery
      supplier nomination, Volkswagen selected Sunwoda for HEV pack systems, and a 2026 report said
      Tesla bought Sunwoda cells while retaining module and pack assembly. That report also placed
      power-battery procurement above 30% of vehicle cost, explaining strong buyer focus on price
      and bargaining leverage. Adoption therefore proceeds through nomination, validation, launch,
      and scaled vehicle production rather than a short transactional sale.
    claimRefs: [CM007, CM008, CM009, CM010]
    tableRefs: [TM003]
  - id: drivers-constraints-gaps
    title: "Growth drivers, constraints, and diligence implications"
    body: >-
      OEM supplier diversification, faster-charging LFP demand, and geographic manufacturing
      expansion can widen Sunwoda's addressable programs, while stationary storage creates a
      separate growth adjacency. The offset is structural: a reported RMB 21.3 billion Yiwu
      project for 5 GWh of annual capacity illustrates the capital required before utilization and
      returns are known. Automakers retain bargaining power because batteries are a large share of
      vehicle cost and can unbundle cells from modules and packs. European-bound batteries also
      face expanding traceability obligations; a technical-industry source reports a full EU
      digital battery-passport mandate from February 2027 after 2026 carbon-footprint and labeling
      milestones. Valuation work should therefore request current capacity, utilization, awarded
      volumes, program pricing, qualification status, and compliance readiness before applying a
      market-growth multiple.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014, CM015, CM016]
callouts:
  - calloutType: risk
    title: "Do not convert market snapshots into TAM"
    body: >-
      The available EV metrics mix monthly, quarterly, annual, Chinese, and global denominators.
      They establish participation and historical position, not a current addressable-market value
      or a reliable Sunwoda SOM.
    claimRefs: [CM002, CM003, CM004, CM005]
