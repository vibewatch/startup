      sizing lenses, not additive TAM/SAM/SOM components; null dollar-market sizing remains a gap.
    claimRefs: [CM002, CM003, CM004, CM005, CM013, CM014, CM015]
  - id: TM003
    title: "Buyer and adoption-path map"
    columns:
      - "Segment"
      - "Buyer"
      - "User"
      - "Payer / budget owner"
      - "Workflow and adoption trigger"
    rows:
      - ["BEV cell supply", "Automaker procurement and battery engineering", "Vehicle program and ultimately driver", "Automaker vehicle-program budget", "Nomination, validation, cell supply, then OEM module/pack assembly where unbundled"]
      - ["HEV pack systems", "Automaker powertrain and procurement teams", "Vehicle platform", "Automaker platform budget", "Fixed-point notice, pack validation, mass-production award"]
      - ["Integrated EV battery supply", "Automaker procurement, engineering, and quality", "Vehicle platform and driver", "Automaker platform and warranty budgets", "Supplier nomination followed by technical and quality qualification"]
      - ["Overseas OEM programs", "Global automaker sourcing teams", "Export or local-market vehicle programs", "Automaker regional program budget", "Local supply-chain qualification, compliance, and production ramp"]
      - ["Stationary storage adjacency", "Utility, project developer, or C&I buyer", "Grid operator or site owner", "Project capital budget", "Project bankability, chemistry selection, system integration, and commissioning"]
    notes: >-
      Buyer roles are inferred from the Volvo, Volkswagen, and Tesla contracting examples; contract
      values, pricing, awarded volumes, and final program launch status are not public in this pool.
    claimRefs: [CM007, CM008, CM009, CM010, CM013]
