chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports tracking Sunwoda EVB rather than endorsing a price: a May 2026 financing summary cites a RMB25 billion pre-money valuation, below the roughly RMB30 billion valuation reported after a 2022 round, while stand-alone profitability, preferences, leverage, and fully diluted ownership remain unavailable. Commercial and IPO signals are meaningful, but a quality-related settlement and intense market competition keep the risk rating high and make entry discipline decisive.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is track / research more, with medium confidence, high risk, and an insufficient-public-support valuation stance. The strongest current price evidence is a May 2026 financing summary that places the round at RMB25 billion pre-money; the older 2022 report described an approximately RMB30 billion valuation after a much larger financing. Those marks are not directly comparable because their pre- and post-money bases, security rights, and capitalization effects differ. Even so, the lower nominal reference, the capital-reserve adjustment, and the absence of stand-alone cash-flow evidence argue against treating the current price as validated. Investment consideration should wait for audited subsidiary economics, the fully diluted cap table, preference terms, and debt exposure.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Operating proof versus downside evidence
    body: >-
      The thesis has real operating support but not enough valuation support. CnEVPost reported that Sunwoda EVB entered Tesla's global supply chain and was already shipping cells for export vehicles, while an official Sunwoda release records a Volvo supplier nomination. A 36Kr report also cited more than 1.5 million installed HEV battery units, and SNE-derived market data placed Sunwoda tenth globally with 2.2% share in the first quarter of 2026. The anti-thesis is equally concrete: scale remains far below the leaders, a Geely affiliate brought a RMB2.31 billion quality claim, and later reporting expected a RMB500 million to RMB800 million impact on 2025 attributable net profit from settlement. Customer validation therefore does not eliminate execution or warranty-cost risk.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: financing-scenarios-and-exit
    title: Financing scenarios and exit readiness
    body: >-
      The public marks permit a scenario frame, not a discounted-cash-flow valuation or a target return. A bear case sits below the RMB25 billion pre-money reference if audited margins, leverage, or settlement economics disappoint. A base case uses RMB25 billion only as an entry checkpoint pending clean terms and verified profitability. A bull case can discuss the observed RMB25 billion to roughly RMB30 billion mark band only as a diligence bracket, not a like-for-like fair-value range. Exit readiness has advanced from a preliminary 2023 ChiNext plan to an April 2026 report that a Hong Kong application had been submitted in July 2025, but current approval status, timing, float, and pricing remain unverified in the assigned evidence.
    claimRefs: [CV002, CV005, CV006, CV007, CV008, CV010, CV011, CV016]
    tableRefs: [TV003]
  - id: diligence-and-thesis-breaks
    title: Final diligence asks and thesis-break triggers
    body: >-
      The decisive diligence package is narrow and measurable: audited EVB income statements and cash flows; debt, guarantees, and project-finance obligations; a fully diluted capitalization table before and after the May 2026 round; liquidation preferences and anti-dilution rights; final settlement accounting; warranty reserves and quality-loss history; and the live Hong Kong listing timetable. The view improves if those materials show durable positive margins, contained quality costs, continued OEM shipments, and a clean route to liquidity without punitive dilution. It breaks if the IPO path stalls, customer programs are lost, quality costs exceed the reported settlement range, market share retreats materially, or a financing below RMB25 billion arrives without compensating investor protections.
    claimRefs: [CV001, CV002, CV004, CV008, CV009, CV010, CV011, CV013, CV016]
