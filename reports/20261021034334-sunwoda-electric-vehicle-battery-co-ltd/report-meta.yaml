companyProfile:
  summary: >-
    Sunwoda EVB is a controlled operating subsidiary of Shenzhen-listed Sunwoda Electronic. Public evidence shows scaled
    power-battery production, a vertically integrated cell-to-pack product scope, and relationships with Chinese and
    global automakers, but the subsidiary's legal identity details, standalone financials, customer concentration, and
    current listing timetable are not fully disclosed.
  foundingLocation: null
  headquarters: null
  productSummary: >-
    Electric-vehicle battery cells, modules, battery-management systems, and pack systems, including fast-charging and
    hybrid-vehicle battery solutions.
  customerFocus: >-
    Automotive OEMs in China and international markets, with public production or nomination evidence involving Tesla,
    Volvo, Li Auto, Xpeng, and other automakers.
  businessModel: >-
    Direct product sales to OEMs after qualification, nomination, production, delivery, and acceptance; public sources
    do not disclose customer-level pricing or margins.
