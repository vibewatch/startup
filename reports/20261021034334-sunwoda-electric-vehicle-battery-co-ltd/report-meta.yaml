  topStrengths:
    - Scaled power-battery production and FY2024 segment growth provide tangible operating proof.
    - >-
      Tesla shipments, Volvo nomination, and established Chinese OEM programs demonstrate broad qualification
      capability.
    - Integrated cells, modules, BMS, packs, and fast-charging development support multiple OEM delivery models.
  topRisks:
    - >-
      Battery-quality and product-liability exposure remains high after the VREMT settlement and Volvo EX30 recall
