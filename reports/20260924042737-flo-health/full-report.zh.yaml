    title: 投资建议决策逻辑
    type: flow
    summary: Flo 的投资建议有扎实的品类证据支撑；在关键指标获得审计验证前，估值判断仍保持克制。
    data:
      nodes:
        - id: n1
          label: 规模体量
        - id: n2
          label: 品牌与用户信任
        - id: n3
          label: 经常性变现能力
        - id: n4
          label: 隐私与监管合规风险
        - id: n5
