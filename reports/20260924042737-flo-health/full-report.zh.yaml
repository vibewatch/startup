      - number: '7.2'
        title: 运营与技术工程风险
        blocks:
          - type: paragraph
            body: >-
              Flo 的技术风险低于硬件制造商或实体诊所，但并非没有。AWS 的优化文章显示，其后端规模大且对成本敏感；GitHub 代码库和 issue
              记录则显示团队持续维护隐私与基础设施代码。这带来常见的软件风险：回归故障、供应商依赖和扩容失误。特殊之处在于，若漏洞触及身份、健康数据或临床相关指导，后果会更严重。在高度敏感的赛道，工程纪律本身就是风险的一部分；任何一层失守，都可能演变成监管事件。
            claimRefs:
              - CR004
              - CR005
