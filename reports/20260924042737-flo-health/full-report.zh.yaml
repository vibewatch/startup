        title: 业务进展与公开测算
        blocks:
          - type: paragraph
            body: >-
              虽然财务报表尚未公开，Flo 的业务增长信号仍然强劲。Flo 和第三方数据库显示，付费订阅用户接近五百万，2024 年预订额（bookings）超过 $200 million；但不同机构对收入和 ARR
              的估算相差很大。差距本身就是尽调信号：Flo 已具备规模化变现能力，但准确收入和利润结构仍依赖第三方估算。估值时应把它视为已有规模、披露仍有限的公司，不宜建过度精细的财务模型。
