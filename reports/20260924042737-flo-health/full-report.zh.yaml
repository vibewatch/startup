  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化变现
        blocks:
          - type: paragraph
            body: >-
              Flo 称订阅收入是核心商业模式：先用免费版获客，再靠高级功能收费。创始人访谈显示，各国付费转化率可能不同，因此变现部分取决于区域定价和当地付费意愿，而不是一套全球通用的 ARPU 逻辑。业务更像 C
              端消费软件，而非临床服务；收入也因此高度依赖转化质量和长期留存。与普通 C 端订阅 App 相比，Flo 还要付出更高的信任成本：用户一旦担心隐私，获客和付费转化都会受阻。
            claimRefs:
              - CI001
              - CI007
              - CI009
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI007
              - CI009
              - CI011
