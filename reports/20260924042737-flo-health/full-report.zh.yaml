    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、创始人与管理层
        blocks:
          - type: paragraph
            body: >-
              Flo Health 于 2015 年创立，总部位于伦敦，由联合创始人兼 CEO Dmitry Gurski 领导。公司将自己定位为服务广泛生殖健康需求的 Femtech
              平台，而非单一经期追踪工具；其材料称，公司在欧洲和北美设有办公室及人才中心。创始人叙事之所以重要，是因为 Flo
              目前仍主要靠创始人带动品牌、信任和产品公信力，公开经营记录与审计披露尚少。治理结构也显露出创始人色彩：与公开财务透明度相比，公司似乎更倚重高管曝光、品牌信任和医学背书。
