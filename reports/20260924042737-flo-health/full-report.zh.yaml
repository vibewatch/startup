  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群分层与应用场景
        blocks:
          - type: paragraph
            body: >-
              Flo 的客群应按人生阶段划分，而不是按企业客户名单理解：包括追踪经期、备孕、怀孕，以及进入围绝经期或更年期的人群。买方和使用者通常是同一个人，产品必须持续提供即时价值，才能让 C
              端用户保持活跃；整个购买过程不需要销售团队推动，也不经过机构采购。由于同一用户可能跨多个生殖阶段使用 App，持续参与比一次性销售更重要。
            claimRefs:
              - CU001
              - CU002
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU010
      - number: '6.2'
        title: 采纳证据与体量规模
        blocks:
          - type: paragraph
            body: >-
              公开采纳规模很大：Flo 官网称月活跃用户达 7,700 万（77 million），CEO 的社交媒体发文则声称下载量和月活更高。Auth0 案例提供了转化证据：优化新用户引导后，注册率从 6% 升至
              75%。这些数字不等于长期留存，但显示产品摩擦较低时，用户愿意安装、注册并持续使用。触达规模虽醒目，指标仍主要反映品牌认知和注册转化，尚不能构成完整的客户终身价值模型。
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
