  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景看重 Flo 庞大的 C 端触达、鲜明品牌、订阅收入，以及能在低切换成本市场中形成差异化的隐私与产品叙事。反向逻辑也很直接：公司没有公开审计财报，隐私风险敏感；一旦信任或转化走弱，消费 App
              的增长动能可能很快下滑。估值取决于 Flo 扩大的同时能否证明变现质量经得住时间检验。关键投资问题是，品牌和信任护城河是否足以抵消消费 App 常见的用户流失风险。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
