      - number: '1.3'
        title: 融资历程、估值与运营版图
        blocks:
          - type: paragraph
            body: >-
              Flo 最近披露的融资是 2024 年 7 月由 General Atlantic 领投的 Series C，金额超过 $200 million，公司估值因此超过 $1 billion
              。第三方数据库估计其累计融资约 $275 million；在仍未上市的情况下，这一资金规模显示公司资金较充裕。相关材料还称，Flo 总部位于伦敦，在维尔纽斯（Vilnius）设有大型工程中心，并在 66
              个国家免费提供 Premium 权益，试图把商业扩张与全球公共卫生叙事结合起来。公司尚无公开审计财务数据，尽调需区分公司披露的规模与第三方估算的经营表现，并跟踪下一轮融资或经营里程碑是否会实质改变资本结构。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状格局
        blocks:
          - type: paragraph
            body: >-
              Flo 切入的市场远不止经期追踪。App 还覆盖备孕、孕期、产后、更年期和健康教育，市场边界因此包括 C 端健康管理应用、生殖健康教育及隐私敏感型健康数据工具。替代选择也不只是其他 Femtech
              应用：Apple 系统自带经期追踪、通用健康 App，乃至不使用 App 或自行记录，都在其中。用户是否采纳，关键是能否建立信任并养成习惯，而非单看功能参数。下表据此把 C
              端日常追踪与医疗机构服务、硬件及受监管医疗支出区分开来。
            claimRefs:
              - CM001
              - CM002
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: 市场规模与客群分层
        blocks:
          - type: paragraph
            body: >-
              公司材料一再把 Femtech 描述为庞大且仍在扩张的市场，Flo 还引用了到 2027 年达到 $60 billion
              的市场机会估算。但只有先厘清买方和付款方，这个数字才有意义：使用者通常是记录健康数据的女性或个人，付款方往往也是本人；购买决策看重便利、隐私和感知到的健康价值，而非临床报销。市场经济效益由 C
              端转化和留存主导。与单一自上而下的 TAM 估算相比，多角度交叉验证更可靠，因为 Flo 能否变现取决于转化效率，不只是用户总量。
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
