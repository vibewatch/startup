      - number: '8.2'
        title: 当前估值背景
        blocks:
          - type: paragraph
            body: >-
              公开融资材料显示，Flo 在 2024 年 7 月完成 Series C 后估值超过独角兽门槛；第三方机构目前的估值大多落在约 $1.2 billion
              。视收入估算口径而定，隐含市销率处于中个位数，并非深度价值标的。具体倍数不如方向重要：Flo 更像享有溢价的成长资产，而不是尚未被发现的便宜货。公司未披露上市消费软件企业通常向公众投资者提供的详细
              KPI，私募市场估值因而只能定性判断、难以精确测算；这也支持谨慎立场。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV010
