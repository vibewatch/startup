      - number: '3.3'
        title: 切换成本与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              这个品类的硬性切换成本很低：C 端用户可以同时安装多款 App、比较结果，也能留一个备用追踪工具。Flo
              靠品牌、规模和医学公信力立足，而非独占数据或监管锁定。持续迭代并守住信任，公司就有韧性；隐私或产品公信力一旦下滑，脆弱性也会立刻显现。其护城河更像概率优势，而非绝对壁垒：品牌和规模虽有帮助，用户仍可同时使用多款产品并迅速重新选择。这是
              Flo 面临的核心权衡。
