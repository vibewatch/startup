  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规与数据隐私风险
        blocks:
          - type: paragraph
            body: >-
              FTC 命令是 Flo 最重要的公开风险标记，说明生殖健康 App 一旦发生隐私失误，代价可能很高。Flo 现在高度依赖 Anonymous
              Mode、开源隐私工具和明确的知情同意说明，但风险并未因此消失：处理敏感生殖数据的产品，持续面对比普通健康软件更严格的法律和公众审视。隐私不是单纯的控制措施，而是经营前提。尽调重点是这些保护是否在真实规模下经受过验证，而非只写在产品文案里。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
          - type: table
