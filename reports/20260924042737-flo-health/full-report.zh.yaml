              资金较充裕，近期偿付能力风险随之降低，但研发、隐私保护和国际扩张仍需持续投入。公司以软件为主，营业成本（COGS）预计相对有利；不过，其增长计划仍显示，医学审核、产品研发和市场拓展（GTM）都需要大量投入。财务模型理论上有吸引力，但不少关键输入仍来自第三方估算或管理层表述，而非审计披露。当前数字只能作方向性参考；用于估值前，仍应取得经审计的财务证据。
