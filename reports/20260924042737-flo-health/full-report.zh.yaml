      - number: '8.3'
        title: 情景假设与投资纪律
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设订阅用户继续增长、更年期业务扩张，并打开可选的 B2B2C
              渠道；基准情景是假设增长延续、估值合理；悲观情景则是假设隐私或竞争压力压低估值倍数。务实做法是跟踪而非追高：上行空间仍在，但现有公开证据还不足以判断风险调整后的入场时机是否足够有吸引力。只有经审计指标改善，才应调整投资判断，不能只因市场叙事升温就改变看法。各情景差距较大；若后续披露令人失望，估值回调并不意外。
            claimRefs:
              - CV005
