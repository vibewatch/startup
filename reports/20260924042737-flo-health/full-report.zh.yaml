      - number: '6.3'
        title: 留存持久度、论证质量与数据缺口
        blocks:
          - type: paragraph
            body: >-
              客群分析真正棘手的不是触达规模，而是留存韧性、队列质量和集中度。Flo 有医疗及工作流合作伙伴的公开佐证，包括面向临床医生的教学材料、公益分发项目，以及内部工程和客户工具；但公司仍未披露
              NRR、GRR、流失率（churn）或详细的客户队列留存报告。客户故事覆盖面广，却缺少可量化的终身价值证据。现有材料能证明用户不断到来并参与使用，队列数据缺失则意味着价值捕获的深度和持久性尚未得到证明。业务势头已显现，长期变现质量仍未证实。
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU011
              - CU012
