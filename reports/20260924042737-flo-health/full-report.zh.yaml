  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Flo 的竞争并非只来自一组同类公司。Clue 和 Eve by Glow 争夺追踪与健康教育用户，Natural Cycles 凭受监管的避孕产品竞争，Apple
              内置经期追踪则靠便利性分流。市场较为分散，用户可以同时用多款产品、快速切换，也会把隐私保护情况纳入选择。调取的竞品清单多次将 Flo 列为功能最丰富的女性健康 App
              之一，但也显示用户很容易横向比较和更换产品。几分钟就能换一款，产品优势必须足够直观。
            claimRefs:
