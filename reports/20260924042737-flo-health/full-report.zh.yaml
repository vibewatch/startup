      - number: '7.3'
        title: 品牌声誉与市场环境风险
        blocks:
          - type: paragraph
            body: >-
              赛道越敏感，Flo 的声誉风险越大。负面舆论、FTC
              过往事件，以及公司持续发布的信任导向产品材料，都说明商誉既关键又脆弱。庞大用户群和公开的开源实践能增强信心，也会让任何事故更受关注。信任既是护城河，也是负担。规模带来优势，也放大反噬：任何面向用户的问题都可能迅速成为声誉头条。这种权衡无法回避。
