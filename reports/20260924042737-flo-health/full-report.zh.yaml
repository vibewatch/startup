  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与用户交互流
        blocks:
          - type: paragraph
            body: >-
              Flo 是面向消费者的健康 App，帮助用户追踪经期、生理症状、备孕、孕期及更年期相关变化，也提供健康教育和伴侣支持。用户录入身体信号，App
              给出预测或健康信息；产品随生殖阶段调整，促使用户持续回来。它不只是记录工具，也承担培养使用习惯、提供指引的作用。许多用户在别处也能免费追踪经期，Flo
              的产品深度因此必须足以支撑订阅。这些功能不是点缀，而是推动复访、让订阅有价值的关键机制。
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
      - number: '5.2'
        title: 隐私控制与技术架构
        blocks:
          - type: paragraph
            body: >-
              Anonymous Mode 是 Flo 技术栈中最鲜明的功能。它使用 OHTTP 和后量子加密，避免任何单一方把个人身份与健康数据关联起来；Flo
              称该功能已开源，并向所有用户免费提供。隐私保护因此不只是面向用户的功能，也落实在技术架构中，而非停留在政策文本上。FTC 过往事件更凸显这一设计的重要性：Flo
              必须证明隐私控制确实有效，而不只是营销说法。公司试图把隐私做成产品能力，而非合规注脚，这在 C 端健康领域并不常见。尽调要问的是，用户规模扩大、监管趋严后，这套技术能否继续守住信任。
            claimRefs:
              - CE002
              - CE003
              - CE011
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE010
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.3'
        title: 交付能力、系统规模与工程运作模式
        blocks:
          - type: paragraph
            body: >-
              Flo 的工程工作由规模问题驱动：AWS 曾介绍如何为超过 7,000 万（70 million）用户优化 DynamoDB；Auth0
              案例则显示，公司为改善新用户引导而彻底重做注册流程，显著提高转化率。内部资料也多次提到高频发布和持续实验，公司似乎迭代很快。Flo 对云基础设施、身份工具、内容系统和 AI
              辅助运营的依赖，不亚于对产品设计的依赖。技术运营覆盖数据分析、身份管理、云成本和内容流程，而不只是移动端 UI 改动。因此，可观测性、发布管理和供应商治理几乎与用户界面同样重要。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE010
          - type: table
