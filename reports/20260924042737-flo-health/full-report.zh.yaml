        title: 产品范畴与用户规模
        blocks:
          - type: paragraph
            body: >-
              Flo 经营女性健康订阅制 App，覆盖经期追踪、备孕、孕期、产后和更年期支持。公司官网和媒体材料称，平台有 7,700 万（77 million）月活跃用户、近五百万付费订阅用户；按公司口径，全球受众已超过 4
              亿（400 million）女性。它把大众消费级分发与医学专业内容结合起来，在同等规模的非上市健康 App 中并不常见。Flo
              靠持续订阅而非一次性硬件销售赚钱，关键问题是：能否在不损害用户信任的前提下，把免费用户持续转为付费用户？
