      - 核心假设
      - 预估走向
      - 成立前提
    rows:
      - - 乐观情景
        - 订阅用户持续增长、更年期业务成功拓展、B2B2C 衍生期权兑现
        - 高估值倍数得以维持甚至进一步扩张
        - 留存率保持坚挺，隐私合规风险处于受控状态
      - - 中性情景
        - 业务平稳增长、变现节奏合理、未发生重大外部冲击
        - 当前估值大体处于合理区间
        - 营收与流失率趋势大体向好，但关键数据依然不透明
      - - 悲观情景
        - 遭遇 FTC 与隐私合规拖累，或行业竞争加剧
        - 估值倍数出现显著收缩
        - 用户信任或转化率下滑，增长陷入停滞或放缓
    notes: 鉴于公开财务披露有限，各情景测算主要体现方向性推演。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: Flo 的核心里程碑涵盖成立、融资、隐私整改、产品功能拓展以及当前的规模披露。
    data:
      items:
        - label: '2015'
          value: Founding
          detail: Flo 成立，并开始打造女性健康应用。
        - label: '2016'
          value: Seed round
          detail: 早期融资为公司奠定了第一笔外部资本基础。
        - label: '2018'
          value: Series A
          detail: 随着应用用户规模迅速扩大，Flo 完成了新一轮外部融资。
        - label: '2021'
          value: Series B + FTC settlement
          detail: Flo 完成 $50M 融资，同时化解了 FTC 针对其隐私问题的指控。
        - label: '2023'
          value: Flo for Partners / privacy recognition
          detail: 产品进一步拓展至伴侣支持和注重隐私的新功能。
        - label: 2024-07
          value: Series C
          detail: General Atlantic 领投 >$200M 融资，公司正式跻身独角兽行列。
        - label: 2024-06
          value: Scale disclosure
          detail: Flo 称其月活用户近 70M，付费订阅用户近 5M。
        - label: '2026'
          value: Current company-page scale
          detail: 公司官网持续展示其拥有 77M 月活跃用户及全球覆盖能力。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
  - id: FM001
    title: 市场空间测算分层模型
    type: pyramid
    summary: 这套市场测算先划清边界，再区分消费级追踪、健康教育和受监管临床服务等相邻市场。
    data:
      nodes:
        - label: 女性健康科技（Femtech）/ 女性健康应用市场
          value: $60B by 2027
          detail: 公司引用的宏观市场口径
        - label: 消费级生殖健康应用
          value: Large but unquantified
          detail: Flo 直接面向的潜在市场
        - label: 订阅转化人群细分
          value: Small subset
          detail: 真正产生付费的消费者，而非免费用户
        - label: 高信任度与隐私敏感型用户
          value: Niche but valuable
          detail: 最可能为隐私保护与医学专业审核买单的核心用户
        - label: 企业端 / 医疗机构延伸业务
          value: Adjacency
          detail: 目前尚非核心主营业务
        - label: 受监管的临床诊疗
          value: Excluded
          detail: 商业模式与经济效益截然不同的独立市场
    approximationNotes: 本图仅作方向性分层；各层级是定性标签，不是完整的量化模型。
    claimRefs:
      - CM003
      - CM004
      - CM009
      - CM012
  - id: FP001
    title: 竞争格局定位图
    type: quadrant
    summary: Flo 在业务覆盖广度和用户规模上都较突出，但部分竞品在隐私或监管等单一维度上更强。
    data:
      points:
        - label: Flo
          x: 8
          'y': 8
          r: 10
          group: Broad breadth / scale
        - label: Clue
          x: 6
          'y': 7
          r: 8
          group: Science / privacy
        - label: Natural Cycles
          x: 5
          'y': 9
          r: 8
          group: Regulated contraception
        - label: Apple Cycle Tracking
          x: 9
          'y': 4
          r: 7
          group: Default / convenience
        - label: Midi Health
          x: 4
          'y': 6
          r: 7
          group: Focused menopause
        - label: Ask Tia
          x: 5
          'y': 5
          r: 6
          group: Care navigation
    approximationNotes: 图中各点基于收集到的竞品资料做定性落位，而非经精确测算的市占率坐标。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP012
  - id: FI001
    title: 商业变现漏斗路径图
    type: waterfall
    summary: 这张图从免费用户一路展示到付费订阅和收入，梳理 Flo 的核心变现漏斗。
    data:
      items:
        - label: 免费用户
          value: 70
          detail: 漏斗顶部受众规模庞大
        - label: 活跃互动用户
          value: 20
          detail: 逐步转化为具有规律记录习惯的用户
        - label: 付费订阅用户
          value: 5
          detail: 付费用户规模近 500 万
        - label: 预订总额
          value: 200
          detail: 2024 年公司官方预期指引
        - label: 营业收入
          value: 157.6
          detail: 第三方研究机构给出的偏低区间估算
        - label: 营业收入（备选测算）
          value: 300
          detail: 第三方研究机构给出的偏高区间估算
    approximationNotes: 本漏斗仅用于示意，并非经核对的会计勾稽图；数据综合了公司官方披露与第三方机构估算。
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
  - id: FE001
    title: 产品功能架构图
    type: stack
    summary: Flo 在共享运营技术栈之上，叠加隐私保护、数据记录、预测、健康教育和伴侣支持等功能。
    data:
      layers:
        - label: 身份认证与隐私
          detail: 登录模式或 Anonymous Mode
        - label: 数据记录
          detail: 生理周期、身体症状及孕期记录录入
        - label: 预测功能
          detail: 健康见解与趋势预测
        - label: 科普宣教
          detail: 经专家审核的专业内容与健康报告
        - label: 伴侣支持
          detail: Flo for Partners 及家庭互动场景
        - label: 底层运营技术栈
          detail: 身份鉴权、云服务、AI 及医学专业审核
    approximationNotes: 仅为概念层面的架构分层，并非实际系统的完整组件清单。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE008
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: 用户转化与留存漏斗
    type: funnel
    summary: 这是一条从品牌认知到付费留存的 C 端转化漏斗；公开证据集中在前端，后端留存数据最缺乏。
    data:
      items:
        - label: 品牌认知
          value: 570
          detail: 数以百万计的下载量与广泛的用户触达
        - label: 应用安装
          value: 77
          detail: 以百万计的月活跃用户体量
        - label: 用户注册
          value: 75
          detail: Auth0 案例中改版后的注册率
        - label: 付费转化
          value: 5
          detail: 付费订阅用户近 500 万
        - label: 品牌倡导
          value: 66
          detail: 纳入公益回馈计划的国家和地区
        - label: 持续留存
          value: 1
          detail: 留存与流失数据未见公开
    approximationNotes: 仅供方向性参考；各层统计口径不一，反映了不同公开披露的口径差异以及后端留存数据的缺失。
    claimRefs:
      - CU003
      - CU004
      - CU006
      - CU007
      - CU012
  - id: FR001
    title: 风险热力图
    type: quadrant
    summary: Flo 最高的风险集中在隐私与合规监管象限，软件运营层面的风险虽相对略低，但依然不可忽视。
    data:
      points:
        - label: FTC 监管与隐私执法
          x: 9
          'y': 9
          r: 10
          group: Critical
        - label: 声誉负面外溢
          x: 8
          'y': 8
          r: 8
          group: High
        - label: 后端系统回退故障
          x: 6
          'y': 6
          r: 7
          group: Medium
        - label: 身份认证与登录故障
          x: 7
          'y': 7
          r: 8
          group: High
        - label: 供应商依赖风险
          x: 6
          'y': 5
          r: 6
          group: Medium
        - label: 内容质量与医学指导偏差
          x: 8
          'y': 7
          r: 8
          group: High
    approximationNotes: 基于公开信息与该行业敏感度进行的定性风险归类，而非量化的概率测算模型。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR010
