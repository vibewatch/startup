- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Angle
  - Bull argument
  - Bear argument
  - Implication
  rows:
  - - Market
    - Large, growing femtech audience
    - Fragmented category with low switching costs
    - Scale alone is not enough
  - - Product
    - Broad lifecycle coverage and privacy differentiation
    - Focused rivals can outflank narrow use cases
    - Breadth must stay evident
  - - Financials
    - Recurring subscription model with strong bookings
    - Exact revenue and margin are opaque
    - Multiple is hard to anchor
  - - Trust
    - Anonymous Mode and medical review support trust
    - FTC history keeps scrutiny high
    - Compliance is part of the moat
  - - Optionality
    - Menopause and partner features can expand
    - Optionality can stay unmonetized
    - Upside exists but is not guaranteed
  notes: The table frames underwriting as a balance between category leadership and public-data gaps.
