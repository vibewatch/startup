- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumption set
  - Indicative outcome
  - What would have to be true
  rows:
  - - Bull
    - Subscriber growth, menopause expansion, B2B2C optionality
    - Premium valuation holds or expands
    - Retention stays strong and privacy risk stays contained
  - - Base
    - Steady growth, fair monetization, no major new shocks
    - Current valuation looks roughly fair
    - Revenue and churn stay directionally positive but still opaque
  - - Bear
    - FTC / privacy drag or competitive pressure
    - Multiple compresses materially
    - Trust or conversion weakens and growth slows
  notes: Scenarios are deliberately directional because public financial disclosures are limited.
