company:
  name: Flo Health
chapter:
  number: 8
  title: Valuation
  summary: Flo Health looks like a category leader with a credible growth story, but the public valuation case is still constrained
    by opaque financials, privacy risk, and the fact that the company is not yet fully audited. That leaves the stock-equivalent
    question less about whether Flo is valuable and more about whether the current multiple is already pricing in the best-case
    outcome.
sections:
- id: thesis
  title: Thesis and anti-thesis
  body: 'The bull case is straightforward: Flo has huge consumer reach, a recognizable brand, recurring subscription economics,
    and a privacy/product story that helps it stay differentiated in a category with low switching costs. The anti-thesis
    is equally straightforward: the company still does not publish audited financials, the privacy surface is sensitive, and
    consumer apps can lose momentum quickly if trust or conversion weakens. Valuation therefore hinges on whether Flo can
    keep scaling while proving durable monetization quality. The key underwriting question is whether the brand and trust
    moat are strong enough to offset the usual consumer-app churn risk.'
  claimRefs:
  - CV001
  - CV003
  - CV006
  - CV009
  tableRefs:
  - TV001
  - TV002
- id: current-valuation
  title: Current valuation context
  body: 'Public financing materials place Flo above the unicorn threshold after a July 2024 Series C, and vendor sources currently
    cluster around a roughly $1.2 billion valuation. Depending on which revenue estimate you use, that implies a mid-single-digit
    revenue multiple rather than a deep value story. The precise answer matters less than the direction: Flo looks like a
    premium growth asset, not an undiscovered bargain. That still leaves room for interpretation because the company has not
    published the same KPI detail that public investors would expect from a listed consumer software business. That gap keeps
    the private-market pricing view directional, not precise, and supports a cautious stance.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV010
  tableRefs:
  - TV003
  figureRefs:
  - FV001
- id: scenarios-and-discipline
  title: Scenarios and discipline
  body: A bull case assumes sustained subscriber growth, menopause expansion, and optional B2B2C channels; a base case assumes
    continued growth but only fair valuation; and a bear case assumes privacy or competition pressure compresses the multiple.
    The practical diligence stance is to track the company rather than to chase it, because the upside is still real but the
    public evidence is not yet rich enough to call the risk-adjusted entry clearly attractive. In practice, the call should
    move only when audited metrics improve, not when the narrative simply gets louder. The scenario spread is wide enough
    that a price reset would not be surprising if disclosure disappoints.
  claimRefs:
  - CV005
  - CV007
  - CV008
  - CV011
  - CV012
  tableRefs: []
