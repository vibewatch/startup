evidenceGaps:
  - type: missing-source
    severity: minor
    topic: investor-map
    missingEvidence: A current audited employee count or organizational chart
    whyItMatters: The company uses multiple self-reported scale figures, but headcount is still only estimate-quality evidence.
    diligencePath: Request the latest org chart or HR snapshot in a follow-up diligence pass.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: sizing
    missingEvidence: A current third-party market model that isolates Flo's exact SAM and SOM
    whyItMatters: >-
      The $60B framing is broad and company-cited, so underwriting should not treat it as a precise addressable market
      number.
    diligencePath: Add a dedicated market-sizing source or build a bottoms-up cohort model in a later pass.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: competitive-pricing
    missingEvidence: A fully comparable pricing sheet for every major competitor
    whyItMatters: Several competitor sites do not publish clean apples-to-apples prices, so pricing comparisons remain directional.
    diligencePath: Collect current app-store or public pricing pages in a later refresh.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: financial-precision
    missingEvidence: Audited revenue, gross margin, and churn disclosure
    whyItMatters: >-
      The company is clearly monetizing, but precise underwriting requires margin and retention data that public sources
      do not disclose.
    diligencePath: Request audited financials or a management KPI pack before any investment decision.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: architecture
    missingEvidence: A public technical diagram or architecture review with explicit service boundaries
    whyItMatters: Public sources support the high-level stack, but not every internal boundary or dependency.
    diligencePath: Request architecture documentation or a security review summary.
    relatedQuestionRefs:
      - QE003
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Public NRR, churn, and cohort-retention data
    whyItMatters: Scale looks strong, but the quality of the customer base cannot be fully underwritten without retention evidence.
    diligencePath: Request cohort retention and paid-subscriber churn metrics in a follow-up diligence pass.
    relatedQuestionRefs:
      - QU006
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: residual-risk
    missingEvidence: A current legal reserve estimate or quantified residual exposure analysis
    whyItMatters: The public record shows the existence of risk, but not the dollar value of any remaining exposure.
    diligencePath: Ask management for a litigation and privacy-risk summary with reserve commentary.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: valuation-precision
    missingEvidence: Audited revenue, gross margin, and retention data
    whyItMatters: The valuation range is sensible but still wide because the underlying unit economics are not public.
    diligencePath: Request audited KPI reporting and churn/cohort data before final price conviction.
    relatedQuestionRefs:
      - QV007
      - QV009
    relatedTableRefs:
      - TV003
