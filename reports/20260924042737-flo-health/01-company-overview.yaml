company:
  name: Flo Health
chapter:
  number: 1
  title: Company Overview
  summary: Flo Health is a London-based femtech subscription app founded in 2015 that spans menstrual, fertility, pregnancy,
    and menopause support. It combines large consumer scale, public funding disclosure, and a privacy-centric product story,
    but much of the commercial detail still comes from company statements and vendor estimates rather than audited filings.
sections:
- id: identity-and-leadership
  title: Identity, founders, and leadership
  body: 'Flo Health is a private London-based company founded in 2015 and led by co-founder and CEO Dmitry Gurski. The company
    presents itself as a femtech platform with a broad reproductive-health mission rather than a narrow period tracker, and
    its own materials describe a global organization with offices and talent hubs in Europe and North America. The founder
    narrative matters because Flo still leans heavily on founder-led brand, trust, and product credibility rather than on
    a public operating history or audited disclosures. The profile also hints at a founder-centric governance model: Flo still
    appears to depend on executive visibility, brand trust, and medical credibility more than on public financial transparency.'
  claimRefs:
  - CO001
  - CO002
  - CO011
  - CO012
  tableRefs:
  - TO002
  - TO003
  figureRefs:
  - FO001
- id: product-and-scale
  title: Product scope and user scale
  body: Flo sells a subscription-based women’s health app that covers cycle tracking, fertility, pregnancy, postpartum, and
    menopause support. The company page and press materials continue to emphasize very large consumer reach, with 77 million
    monthly active users, close to five million paid subscribers, and a global audience that now exceeds 400 million women
    on the company’s own framing. The product story is therefore a mix of mass-market consumer distribution and medically
    informed content, which is unusual for a private health app at this scale. Because Flo sells a recurring subscription
    rather than one-off hardware, the key diligence question is whether the consumer funnel can keep converting free users
    into paid users without eroding trust.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO001
- id: capital-and-footprint
  title: Funding, valuation, and operating footprint
  body: Flo’s latest disclosed financing was a July 2024 Series C led by General Atlantic that raised more than $200 million
    and pushed the company above a $1 billion valuation. Third-party databases currently put total known capital raised at
    about $275 million, which is consistent with the company remaining well funded while still private. The same materials
    describe a London HQ, a major Vilnius engineering hub, and a pro-social program that provides free Premium access in 66
    countries, underscoring that Flo is trying to pair commercial scale with a global public-health narrative. The company
    still lacks audited public financials, so the practical diligence task is to separate company-claimed scale from vendor-estimated
    economics and to track whether the next funding or operating milestone changes the capital structure meaningfully.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
