companyProfile:
  summary: >-
    Flo Health is a private London-based femtech company founded in 2015 and led by co-founder and CEO Dmitry Gurski.
    The company spans cycle tracking, fertility, pregnancy, postpartum, and menopause support, and it combines large
    consumer scale with a privacy-centric product story. Because Flo remains private and does not publish full audited
    operating metrics, the diligence lens stays centered on product scale, monetization quality, and regulatory trust.
