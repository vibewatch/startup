company:
  name: Flo Health
chapter:
  number: 6
  title: Customers
  summary: 'Flo Health’s customer base is broad, consumer-led, and global: the relevant buyer is usually the user herself,
    and the company monetizes through conversion to premium rather than enterprise contracts. Public proof points show massive
    reach and strong onboarding conversion, but retention, churn, and cohort quality remain largely unverified.'
sections:
- id: segments
  title: Customer segments and use cases
  body: Flo’s customer base is best understood as a set of life-stage segments rather than a list of enterprise accounts.
    The company serves users tracking cycles, trying to conceive, pregnant users, and people moving into perimenopause or
    menopause. Because the buyer and the user are usually the same person, the product has to deliver enough immediate value
    to keep the consumer engaged without any sales motion or institutional procurement. For Flo, that makes sustained engagement
    more important than a one-time sale, because the same person may use the app across several reproductive stages.
  claimRefs:
  - CU001
  - CU002
  - CU010
  tableRefs:
  - TU001
- id: proof-of-adoption
  title: Proof of adoption and scale
  body: 'The public adoption story is very large: Flo’s company page says it reaches 77 million monthly active users, and
    CEO-led social posts have claimed even larger download and monthly usage figures. The Auth0 case study adds a conversion
    proof point by showing that onboarding changes moved new-user sign-ups from 6% to 75%. Those signals are not the same
    as retention, but they do indicate that users are willing to install, register, and keep engaging when the product friction
    is low. The broad reach claims are compelling, but they sit closer to awareness and sign-up metrics than to a complete
    customer-lifetime model.'
  claimRefs:
  - CU003
  - CU004
  - CU006
  - CU007
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: durability-and-proof
  title: Durability, proof quality, and gaps
  body: The hardest customer questions are not about raw reach; they are about durability, cohort quality, and concentration.
    Flo has public proof from medical and workflow partners, including instructional material for clinicians, a pro-social
    distribution program, and internal engineering/customer tooling, but it still does not publish NRR, GRR, churn, or a detailed
    customer cohort report. That means the company’s customer story is convincing on breadth and less convincing on measurable
    lifetime value. The missing cohort data means Flo can show that customers arrive and engage, but not yet prove the depth
    or durability of value capture. This is enough to show traction, but not enough to prove long-term monetization quality.
  claimRefs:
  - CU005
  - CU008
  - CU009
  - CU011
  - CU012
  tableRefs:
  - TU003
