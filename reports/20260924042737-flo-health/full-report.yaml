              - CU006
              - CU007
              - CU012
      - number: '6.3'
        title: Durability, proof quality, and gaps
        blocks:
          - type: paragraph
            body: >-
              The hardest customer questions are not about raw reach; they are about durability, cohort quality, and
              concentration. Flo has public proof from medical and workflow partners, including instructional material
              for clinicians, a pro-social distribution program, and internal engineering/customer tooling, but it still
              does not publish NRR, GRR, churn, or a detailed customer cohort report. That means the company’s customer
              story is convincing on breadth and less convincing on measurable lifetime value. The missing cohort data
              means Flo can show that customers arrive and engage, but not yet prove the depth or durability of value
              capture. This is enough to show traction, but not enough to prove long-term monetization quality.
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU008
              - CU009
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and privacy risk
        blocks:
          - type: paragraph
            body: >-
              The FTC order is the central public risk marker for Flo because it shows how expensive a privacy mistake
              can be in a reproductive-health app. Flo now leans heavily on Anonymous Mode, open-source privacy tooling,
              and explicit consent language, but the underlying risk does not disappear: any product that touches
              sensitive reproductive data will stay under a higher legal and public-scrutiny lens than ordinary wellness
              software. That means privacy is not just a control; it is an operating condition. The key diligence point
              is whether those controls are proven in practice under real scale, not just described in product copy.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR010
      - number: '7.2'
        title: Operational and technical risk
        blocks:
          - type: paragraph
            body: >-
              Flo’s technical risk is lower than that of a hardware or clinic business, but it is still real. The AWS
              optimization article shows a large-scale, cost-sensitive backend, while the GitHub repositories and issues
              indicate ongoing maintenance of privacy and infrastructure code. That creates the usual software
              risks—regressions, vendor dependencies, and scaling mistakes—but with a special twist: a bug is more
              dangerous when it touches identity, health data, or clinically relevant guidance. In a category this
              sensitive, technical discipline is part of the risk profile, because a failure in one layer can become a
              regulatory event.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
      - number: '7.3'
        title: Reputational and market risk
        blocks:
          - type: paragraph
            body: >-
              Flo’s reputational risk is amplified by the sensitivity of the category. Negative public commentary, FTC
              history, and the fact that the company must keep publishing trust-oriented product material all make
              reputation a core asset that can be damaged quickly. At the same time, the company’s own scale can create
              confidence: a big user base and a visible open-source story help, but they also make any incident more
              visible. The result is a business where trust is both a moat and a liability. The upside of scale is
              visible, but so is the downside: every user-facing issue can become a reputational headline quickly. That
              tradeoff is unavoidable.
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Flo has huge consumer reach, a recognizable brand, recurring
              subscription economics, and a privacy/product story that helps it stay differentiated in a category with
              low switching costs. The anti-thesis is equally straightforward: the company still does not publish
              audited financials, the privacy surface is sensitive, and consumer apps can lose momentum quickly if trust
              or conversion weakens. Valuation therefore hinges on whether Flo can keep scaling while proving durable
              monetization quality. The key underwriting question is whether the brand and trust moat are strong enough
              to offset the usual consumer-app churn risk.
            claimRefs:
              - CV001
              - CV003
