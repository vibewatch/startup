  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Flo’s competitive set is not a single peer group. Direct rivals such as Clue and Eve by Glow compete on
              tracking and educational content, Natural Cycles competes on regulated contraception, and Apple’s built-in
              cycle tracking competes on convenience. The result is a fragmented market where users can multi-home,
              switch quickly, and compare privacy posture as part of the product decision. The fetched competitor lists
              repeatedly place Flo among the most feature-rich women’s-health apps, but they also show how easily
              consumers can compare and switch across products. Users can choose a different app in minutes, so product
              quality must stay obvious.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: Differentiation and niches
        blocks:
          - type: paragraph
            body: >-
              Flo’s main differentiator is breadth: the app spans cycle tracking, conception, pregnancy, menopause,
              partner support, and medically reviewed content. That breadth helps with distribution, but focused
              competitors can still outflank Flo in very specific areas such as contraception clearance, privacy-first
              design, or niche menopause support. In practice, Flo wins on “one app for the whole journey,” while many
              rivals win on a sharper point solution. That means Flo must keep its breadth advantage while making sure
              its privacy story and medical review remain credible against focused specialists and platform-native
              defaults. The most realistic way to defend share is to keep shipping broad utility and to stay visibly
              safer than generic wellness tools.
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
