      - number: '1.2'
        title: Product scope and user scale
        blocks:
          - type: paragraph
            body: >-
              Flo sells a subscription-based women’s health app that covers cycle tracking, fertility, pregnancy,
              postpartum, and menopause support. The company page and press materials continue to emphasize very large
              consumer reach, with 77 million monthly active users, close to five million paid subscribers, and a global
              audience that now exceeds 400 million women on the company’s own framing. The product story is therefore a
              mix of mass-market consumer distribution and medically informed content, which is unusual for a private
              health app at this scale. Because Flo sells a recurring subscription rather than one-off hardware, the key
              diligence question is whether the consumer funnel can keep converting free users into paid users without
              eroding trust.
