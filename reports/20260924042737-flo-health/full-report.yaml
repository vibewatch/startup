      - number: '6.2'
        title: Proof of adoption and scale
        blocks:
          - type: paragraph
            body: >-
              The public adoption story is very large: Flo’s company page says it reaches 77 million monthly active
              users, and CEO-led social posts have claimed even larger download and monthly usage figures. The Auth0
              case study adds a conversion proof point by showing that onboarding changes moved new-user sign-ups from
              6% to 75%. Those signals are not the same as retention, but they do indicate that users are willing to
              install, register, and keep engaging when the product friction is low. The broad reach claims are
              compelling, but they sit closer to awareness and sign-up metrics than to a complete customer-lifetime
              model.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
