        title: Identity, founders, and leadership
        blocks:
          - type: paragraph
            body: >-
              Flo Health is a private London-based company founded in 2015 and led by co-founder and CEO Dmitry Gurski.
              The company presents itself as a femtech platform with a broad reproductive-health mission rather than a
              narrow period tracker, and its own materials describe a global organization with offices and talent hubs
              in Europe and North America. The founder narrative matters because Flo still leans heavily on founder-led
              brand, trust, and product credibility rather than on a public operating history or audited disclosures.
              The profile also hints at a founder-centric governance model: Flo still appears to depend on executive
              visibility, brand trust, and medical credibility more than on public financial transparency.
