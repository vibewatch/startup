  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and use cases
        blocks:
          - type: paragraph
            body: >-
              Flo’s customer base is best understood as a set of life-stage segments rather than a list of enterprise
              accounts. The company serves users tracking cycles, trying to conceive, pregnant users, and people moving
              into perimenopause or menopause. Because the buyer and the user are usually the same person, the product
              has to deliver enough immediate value to keep the consumer engaged without any sales motion or
              institutional procurement. For Flo, that makes sustained engagement more important than a one-time sale,
              because the same person may use the app across several reproductive stages.
            claimRefs:
              - CU001
              - CU002
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
