      - number: '1.3'
        title: Funding, valuation, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Flo’s latest disclosed financing was a July 2024 Series C led by General Atlantic that raised more than
              $200 million and pushed the company above a $1 billion valuation. Third-party databases currently put
              total known capital raised at about $275 million, which is consistent with the company remaining well
              funded while still private. The same materials describe a London HQ, a major Vilnius engineering hub, and
              a pro-social program that provides free Premium access in 66 countries, underscoring that Flo is trying to
              pair commercial scale with a global public-health narrative. The company still lacks audited public
              financials, so the practical diligence task is to separate company-claimed scale from vendor-estimated
              economics and to track whether the next funding or operating milestone changes the capital structure
              meaningfully.
