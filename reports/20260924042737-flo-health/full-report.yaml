        title: Current valuation context
        blocks:
          - type: paragraph
            body: >-
              Public financing materials place Flo above the unicorn threshold after a July 2024 Series C, and vendor
              sources currently cluster around a roughly $1.2 billion valuation. Depending on which revenue estimate you
              use, that implies a mid-single-digit revenue multiple rather than a deep value story. The precise answer
              matters less than the direction: Flo looks like a premium growth asset, not an undiscovered bargain. That
              still leaves room for interpretation because the company has not published the same KPI detail that public
              investors would expect from a listed consumer software business. That gap keeps the private-market pricing
              view directional, not precise, and supports a cautious stance.
