              - CE008
              - CE009
              - CE010
              - CE011
      - number: '5.3'
        title: Delivery, scale, and operating model
        blocks:
          - type: paragraph
            body: >-
              Flo’s engineering story is dominated by scale: AWS describes how it optimized DynamoDB for more than 70
              million users, while the Auth0 case study shows that the company cared enough about onboarding to overhaul
              sign-up flows and lift conversion sharply. The company also appears to ship quickly, with internal
              references to high release cadence and continuous experimentation. In practice, that means Flo depends on
              cloud infrastructure, identity tooling, content systems, and AI-assisted operations as much as it depends
              on product design. The technical operating model therefore spans analytics, identity, cloud cost control,
              and content workflows rather than only mobile UI changes. That means observability, release management,
              and vendor governance matter almost as much as the user interface itself.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
