      - number: '4.3'
        title: Capital structure and cost drivers
        blocks:
          - type: paragraph
            body: >-
              Flo remains well financed after the 2024 Series C, which reduces near-term solvency risk but does not
              eliminate the need for ongoing investment in R&D, privacy, and international expansion. The business is
              software-heavy, so cost of goods sold should be relatively favorable, yet the company’s own growth plan
              still points to substantial spend on medical review, product development, and go-to-market expansion. In
              short, the financial model looks attractive in principle, but too many inputs still come from estimates or
              management statements rather than audited disclosures. A prudent diligence posture is to treat the current
              numbers as directional and to insist on audited evidence before relying on them in a valuation model.
