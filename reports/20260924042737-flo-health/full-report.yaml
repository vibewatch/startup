  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Flo says subscription revenue is the core business model, with a free tier used to acquire users and
              premium features used to monetize them. The founder interview also suggests conversion rates vary by
              country, which means monetization is partly a geographic pricing and willingness-to-pay problem rather
              than a single global ARPU story. That makes the business feel closer to consumer software than to a
              clinical-services model, but it also means the top line depends heavily on conversion quality and
              retention. Flo also faces a higher cost of trust than a normal consumer subscription app, because privacy
              skepticism can slow both acquisition and premium conversion.
