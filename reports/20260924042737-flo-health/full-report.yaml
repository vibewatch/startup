      - number: '3.3'
        title: Switching costs and moat durability
        blocks:
          - type: paragraph
            body: >-
              The category has low hard switching costs because consumer users can install multiple apps, compare
              outputs, and keep a fallback tracker. Flo therefore depends on brand, scale, and medical credibility
              rather than on exclusive data access or regulatory lock-in. That makes the company durable if it keeps
              shipping and remains trusted, but vulnerable if privacy or product credibility slips. In diligence terms,
              the competitive moat is probabilistic rather than absolute: brand and scale help, but the category still
              allows users to multi-home and re-evaluate quickly. That is the core strategic tradeoff.
            claimRefs:
