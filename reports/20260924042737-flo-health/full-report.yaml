      - number: '8.3'
        title: Scenarios and discipline
        blocks:
          - type: paragraph
            body: >-
              A bull case assumes sustained subscriber growth, menopause expansion, and optional B2B2C channels; a base
              case assumes continued growth but only fair valuation; and a bear case assumes privacy or competition
              pressure compresses the multiple. The practical diligence stance is to track the company rather than to
              chase it, because the upside is still real but the public evidence is not yet rich enough to call the
              risk-adjusted entry clearly attractive. In practice, the call should move only when audited metrics
              improve, not when the narrative simply gets louder. The scenario spread is wide enough that a price reset
              would not be surprising if disclosure disappoints.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
