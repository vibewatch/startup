  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and user workflow
        blocks:
          - type: paragraph
            body: >-
              Flo is a consumer health app that helps users track cycles, symptoms, pregnancy, fertility, and
              menopause-related milestones while also serving educational content and partner-support features. The app
              is designed around a simple recurring workflow: the user logs signals, the app returns predictions or
              educational context, and the user keeps returning because the product adapts to the stage of the
              reproductive journey. That matters because the product is not just a data recorder; it is a habit-forming
              guidance layer. This design also matters commercially because product depth has to justify a paid
              subscription even when many users can track a cycle for free elsewhere. These are not cosmetic additions;
              they are the mechanics that keep users returning and make the subscription meaningful.
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE009
      - number: '5.2'
        title: Privacy controls and architecture
        blocks:
          - type: paragraph
            body: >-
              Anonymous Mode is the most distinctive technical feature in Flo’s stack. It uses OHTTP and post-quantum
              cryptography so no single party can link identity with health data, and Flo says the feature is open
              source and free to all users. That makes privacy both a user-facing feature and a technical architecture
              decision, not merely a policy statement. The FTC history increases the importance of that design choice
              because the company has to prove that privacy controls are real, not just marketing. In other words, Flo
              is trying to make privacy a product feature, not just a compliance footnote, which is rare in consumer
              health. For diligence, the key question is whether the privacy stack can continue to protect trust as
              scale and regulation both increase.
            claimRefs:
              - CE002
              - CE003
              - CE011
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE010
              - CE013
