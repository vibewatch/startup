              - CM009
              - CM012
      - number: '2.3'
        title: Adoption drivers, constraints, and evidence
        blocks:
          - type: paragraph
            body: >-
              Flo benefits from privacy features, medically reviewed content, and scale, but those same attributes sit
              inside a sensitive regulatory environment. The FTC settlement history remains a live trust constraint, and
              subscription willingness varies materially by region. Still, the published app trial literature suggests
              the product can improve menstrual health literacy and wellbeing, which supports a real product value
              proposition rather than pure lifestyle branding. The evidence gap is therefore not whether the category
              exists, but how much of it Flo can actually capture at premium subscription prices. In other words, the
              category can be large without Flo being able to monetize all of it directly.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
