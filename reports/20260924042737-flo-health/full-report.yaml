  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Flo’s practical market is broader than period tracking alone. The app spans menstrual tracking, fertility,
              pregnancy, postpartum, menopause, and educational support, so the real market boundary includes consumer
              wellness apps, reproductive-health education, and privacy-sensitive health data tooling. The relevant
              substitutes are not only other femtech apps but also Apple’s native cycle tracking, generic wellness apps,
              and “do nothing” or self-managed tracking habits. That makes adoption a trust and habit-conversion
              problem, not just a feature-comparison exercise. The table below makes the boundary explicit by separating
              consumer tracking from adjacent provider, device, and regulated-care spend.
            claimRefs:
              - CM001
              - CM002
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: Sizing and segmentation
        blocks:
          - type: paragraph
            body: >-
              Company materials repeatedly describe femtech as a very large and still expanding market, with Flo itself
              citing a $60 billion by 2027 opportunity. That headline matters only if the buyer and payer are clear: the
              user is usually the woman or person tracking health, the payer is often the same consumer, and the
              decision path is driven by convenience, privacy, and perceived health utility rather than by clinical
              reimbursement. The result is a market where consumer conversion and retention dominate the economics.
              Using several lenses is more defensible than a single top-down TAM because Flo’s monetization depends on
              conversion, not just broad user counts.
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM006
