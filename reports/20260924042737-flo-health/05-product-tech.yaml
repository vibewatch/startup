chapter:
  number: 5
  title: Product & Technology
  summary: 'Flo Health is more than a tracker: it is a privacy-sensitive consumer health platform built around education,
    symptom logging, predictions, and Anonymous Mode. The technical story combines large-scale app delivery with identity,
    cloud, and medical-review dependencies, so product depth and infrastructure discipline are inseparable from trust.'
sections:
- id: product-definition
  title: Product definition and user workflow
  body: 'Flo is a consumer health app that helps users track cycles, symptoms, pregnancy, fertility, and menopause-related
    milestones while also serving educational content and partner-support features. The app is designed around a simple recurring
    workflow: the user logs signals, the app returns predictions or educational context, and the user keeps returning because
    the product adapts to the stage of the reproductive journey. That matters because the product is not just a data recorder;
    it is a habit-forming guidance layer. This design also matters commercially because product depth has to justify a paid
    subscription even when many users can track a cycle for free elsewhere. These are not cosmetic additions; they are the
    mechanics that keep users returning and make the subscription meaningful.'
  claimRefs:
  - CE001
  - CE008
  - CE009
  - CE012
  tableRefs:
  - TE001
- id: privacy-and-architecture
  title: Privacy controls and architecture
  body: Anonymous Mode is the most distinctive technical feature in Flo’s stack. It uses OHTTP and post-quantum cryptography
    so no single party can link identity with health data, and Flo says the feature is open source and free to all users.
    That makes privacy both a user-facing feature and a technical architecture decision, not merely a policy statement. The
    FTC history increases the importance of that design choice because the company has to prove that privacy controls are
    real, not just marketing. In other words, Flo is trying to make privacy a product feature, not just a compliance footnote,
    which is rare in consumer health. For diligence, the key question is whether the privacy stack can continue to protect
    trust as scale and regulation both increase.
  claimRefs:
  - CE002
  - CE003
  - CE011
  - CE013
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: delivery-and-scale
  title: Delivery, scale, and operating model
  body: 'Flo’s engineering story is dominated by scale: AWS describes how it optimized DynamoDB for more than 70 million users,
    while the Auth0 case study shows that the company cared enough about onboarding to overhaul sign-up flows and lift conversion
    sharply. The company also appears to ship quickly, with internal references to high release cadence and continuous experimentation.
    In practice, that means Flo depends on cloud infrastructure, identity tooling, content systems, and AI-assisted operations
    as much as it depends on product design. The technical operating model therefore spans analytics, identity, cloud cost
    control, and content workflows rather than only mobile UI changes. That means observability, release management, and vendor
    governance matter almost as much as the user interface itself.'
