runDate: '2026-09-24'
company:
  name: Flo Health
chapter:
  number: 7
  title: Risks
  summary: Flo’s risk profile is dominated by privacy, regulatory, and trust issues rather than by classic balance-sheet or
    supply-chain stress. The company has strong technical mitigations and a visible security posture, but the same product
    category that creates scale also creates outsized legal and reputational exposure when anything goes wrong.
sections:
- id: regulatory-and-privacy
  title: Regulatory and privacy risk
  body: 'The FTC order is the central public risk marker for Flo because it shows how expensive a privacy mistake can be in
    a reproductive-health app. Flo now leans heavily on Anonymous Mode, open-source privacy tooling, and explicit consent
    language, but the underlying risk does not disappear: any product that touches sensitive reproductive data will stay under
    a higher legal and public-scrutiny lens than ordinary wellness software. That means privacy is not just a control; it
    is an operating condition. The key diligence point is whether those controls are proven in practice under real scale,
    not just described in product copy.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR007
  tableRefs:
  - TR001
- id: operational-and-technical
  title: Operational and technical risk
  body: 'Flo’s technical risk is lower than that of a hardware or clinic business, but it is still real. The AWS optimization
    article shows a large-scale, cost-sensitive backend, while the GitHub repositories and issues indicate ongoing maintenance
    of privacy and infrastructure code. That creates the usual software risks—regressions, vendor dependencies, and scaling
    mistakes—but with a special twist: a bug is more dangerous when it touches identity, health data, or clinically relevant
    guidance. In a category this sensitive, technical discipline is part of the risk profile, because a failure in one layer
    can become a regulatory event.'
  claimRefs:
  - CR004
  - CR005
  - CR008
  - CR011
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: reputational-and-market
  title: Reputational and market risk
  body: 'Flo’s reputational risk is amplified by the sensitivity of the category. Negative public commentary, FTC history,
    and the fact that the company must keep publishing trust-oriented product material all make reputation a core asset that
    can be damaged quickly. At the same time, the company’s own scale can create confidence: a big user base and a visible
    open-source story help, but they also make any incident more visible. The result is a business where trust is both a moat
    and a liability. The upside of scale is visible, but so is the downside: every user-facing issue can become a reputational
    headline quickly. That tradeoff is unavoidable.'
  claimRefs:
  - CR006
  - CR009
  - CR010
  - CR012
  tableRefs:
  - TR003
