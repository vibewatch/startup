- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Type
  - Risk
  - Diligence ask
  rows:
  - - AWS / cloud
    - Platform
    - Cost, reliability, and vendor concentration
    - Review cloud architecture and fallback plans
  - - Identity tooling
    - Vendor
    - Onboarding and access control dependence
    - Confirm auth redundancy and SSO posture
  - - Medical experts
    - Human capital
    - Content credibility depends on reviewer quality
    - Review review cadence and staffing
  - - Cloudflare / privacy relay
    - Partner
    - Anonymous Mode relies on external infrastructure
    - Verify contractual and technical controls
  - - Public perception
    - Market dependency
    - Trust shocks can hit conversion quickly
    - Track sentiment and crisis response readiness
  notes: Flo does not depend on one large customer, but it does depend on a small number of platform and trust primitives.
