chapter:
  number: 2
  title: Market Analysis
  summary: Flo Health sits in the women’s health / femtech market, where consumers buy a recurring health-tracking and education
    product but regulators, privacy expectations, and willingness to pay vary sharply by geography. The market is large enough
    to support a category leader, but the boundary between consumer wellness, reproductive-health education, and regulated
    health claims remains a major diligence issue.
sections:
- id: market-boundary
  title: Market boundary and status quo
  body: Flo’s practical market is broader than period tracking alone. The app spans menstrual tracking, fertility, pregnancy,
    postpartum, menopause, and educational support, so the real market boundary includes consumer wellness apps, reproductive-health
    education, and privacy-sensitive health data tooling. The relevant substitutes are not only other femtech apps but also
    Apple’s native cycle tracking, generic wellness apps, and “do nothing” or self-managed tracking habits. That makes adoption
    a trust and habit-conversion problem, not just a feature-comparison exercise. The table below makes the boundary explicit
    by separating consumer tracking from adjacent provider, device, and regulated-care spend.
  claimRefs:
  - CM001
  - CM002
  - CM011
  tableRefs:
  - TM001
- id: sizing-and-segmentation
  title: Sizing and segmentation
  body: 'Company materials repeatedly describe femtech as a very large and still expanding market, with Flo itself citing
    a $60 billion by 2027 opportunity. That headline matters only if the buyer and payer are clear: the user is usually the
    woman or person tracking health, the payer is often the same consumer, and the decision path is driven by convenience,
    privacy, and perceived health utility rather than by clinical reimbursement. The result is a market where consumer conversion
    and retention dominate the economics. Using several lenses is more defensible than a single top-down TAM because Flo’s
    monetization depends on conversion, not just broad user counts.'
  claimRefs:
  - CM003
  - CM004
  - CM009
  - CM012
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: adoption-drivers
  title: Adoption drivers, constraints, and evidence
  body: Flo benefits from privacy features, medically reviewed content, and scale, but those same attributes sit inside a
    sensitive regulatory environment. The FTC settlement history remains a live trust constraint, and subscription willingness
    varies materially by region. Still, the published app trial literature suggests the product can improve menstrual health
    literacy and wellbeing, which supports a real product value proposition rather than pure lifestyle branding. The evidence
    gap is therefore not whether the category exists, but how much of it Flo can actually capture at premium subscription
    prices. In other words, the category can be large without Flo being able to monetize all of it directly.
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM010
  tableRefs:
  - TM003
