chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Core Platform
        blocks:
          - type: paragraph
            body: >-
              Kapital is a technology-first B2B financial institution founded in 2020 by René Saúl and Fernando
              Sandoval, headquartered in Mexico City, Mexico [CO001]. The institution operates across four core regional
              markets—Mexico, Colombia, Spain, and the United States—providing enterprise-grade financial visibility,
              cash flow management, corporate spend controls, and automated credit underwriting to small and
              medium-sized enterprises (SMBs) [CO002]. Built natively as a computational banking infrastructure rather
              than a legacy core patched with software, Kapital unifies corporate cards, multi-currency corporate
              accounts, instant SPEI transfers, and proprietary AI analytics [CO003]. In September 2023, Kapital closed
              the strategic acquisition of Banco Autofin Mexico S.A., securing a full commercial banking license and
              absorbing an established customer base of 65,000 clients into its technology ecosystem [CO004]. By
              combining regulated banking capabilities with proprietary automated risk intelligence, Kapital delivers
              working capital and digital treasury services traditionally restricted to large multinational corporations
              [CO005].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO008
              - CO009
              - CO011
              - CO014
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Operational Focus
        blocks:
          - type: paragraph
            body: >-
              Kapital was co-founded by Chief Executive Officer René Saúl and Chief Financial Officer Fernando Sandoval,
              who lead the firm's global strategy, technology execution, and financial management [CO001, CO006].
              Executive operational leadership also includes Managing Director Eder Echeverria, directing institutional
              scaling and regional distribution across Latin America [CO007]. Co-founder and CEO René Saúl serves as the
              primary external architect of Kapital's expansion, maintaining high key-person dependence across
              regulatory negotiations, sovereign licensing, and capital formation [CO001, CO004]. Governance and
              oversight are anchored by institutional representation from venture capital and private equity sponsors on
              the board of directors and investment committees, including Tribe Capital, Pelion Venture Partners, Tru
              Arrow Partners, and Fasanara Capital [CO008, CO009]. To mitigate key-person operational risk across
              fragmented regulatory frameworks in Mexico, Colombia, and the US, Kapital structures local management
              teams around licensed banking compliance, automated AML/KYC protocols, and computational risk management
              [CO005, CO010].
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
