      - number: '6.3'
        title: Retention Durability, Client Concentration, and Adverse Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Despite reported customer top-line scale, independent verification reveals substantive information gaps
              regarding customer retention, net revenue retention (NRR), churn rates, and borrower concentration [CU008,
              CU009]. Kapital operates as a privately held financial technology institution and does not publicly
              publish audited cohort renewal rates, gross revenue retention, or single-obligor loan concentrations,
              leaving customer durability open to diligence scrutiny [CU008, CU009]. Furthermore, high nominal customer
              counts bundle transactional debit card users and retail depositors with full-suite commercial treasury
              borrowers, obscuring the economic concentration of loan book assets [CU001, CU002, CU004]. Adverse naming
              ambiguity represents an additional diligence hazard: public filings for Azerbaijan's OJSC Kapital
              Bank—which reported 6 billion AZN in customer loans and 10 billion AZN in customer deposits in 2026 under
              PASHA Holding—are frequently conflated with Mexico's Kapital, requiring strict corporate disambiguation
              during institutional credit and risk assessments [CU010, CU011]. Diligence must also distinguish unrelated
              corporate entities such as US IT staffing firm Kapital Data Corp from Kapital's Latin American commercial
              banking operations [CU012].
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU008
              - CU009
              - CU010
