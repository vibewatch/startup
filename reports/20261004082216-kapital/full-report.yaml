      - number: '7.3'
        title: Credit Loss Exposure, Counterparty Dependencies, and Currency Volatility
        blocks:
          - type: paragraph
            body: >-
              Kapital's business model concentrates substantial exposure in commercial credit underwriting and
              macroeconomic volatility across Latin American emerging markets [CR003, CR008]. With approximately 60% of
              revenues historically generated from balance-sheet lending and working capital credit facilities, loan
              book performance is vulnerable to regional macroeconomic downturns [CR001, CR008]. While Kapital's
              reported non-performing loan ratio (IMOR) averaged 2.9% with loan loss coverage (ICOR) at 1.4x and a
              capital adequacy ratio (ICAP) of 13.1%, rapid balance sheet expansion could compress credit quality if
              automated AI scoring models misprice risk during credit contractions [CR008]. Furthermore, severe foreign
              exchange volatility—such as historical fluctuations of the Colombian peso between 3,200 and 5,000 per
              USD—poses dual-sided risk: borrowers earning revenue in depreciating local currencies face elevated
              default risk if servicing dollar-denominated obligations, while Kapital's cross-border stablecoin (USDC)
              treasury services expose operations to digital asset counterparty and clearing stability [CR003, CR009].
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR009
      - number: '7.4'
        title: Corporate Identity Disambiguation, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Institutional diligence encounters material external risk from widespread corporate identity confusion
              across public registries, market data vendors, and algorithmic scrapers [CR010, CR011]. Unrelated entities
              bearing the Kapital name—specifically OJSC Kapital Bank in Azerbaijan (reporting 13.3 billion AZN in
              assets and 222 million AZN in net profit in H1 2026 under PASHA Holding) and Bayern Kapital in Germany (a
              European venture capital investor)—are frequently conflated with Mexico's fintech startup [CR010, CR011].
              Diligence teams must segregate sovereign ratings, legal proceedings, and financial filings of these
              foreign institutions from Kapital's Mexican entity [CR010, CR011]. Finally, investors must monitor
              quantitative thesis-break kill criteria: (1) a spike in non-performing loans (IMOR) surpassing 5.0%
              without commensurate provisioning; (2) regulatory sanctions or license revocation by the CNBV; (3) deposit
              runoffs on retail investment certificates (PRLV); or (4) severe operational disruptions during core
              banking migrations [CR003, CR008, CR012].
            claimRefs:
              - CR003
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-Acquisition Integration and Rating Outlook Vulnerability
            body: >-
              The acquisition of Intercam's brokerage, mutual funds, and operational banking assets fundamentally
              transforms Kapital into a Grupo Financiero, but introduces severe operational complexity across 180,000
              new accounts and 1,900 trusts. Moody's Local México placed Kapital's A-.mx rating on 'Developing' outlook
              specifically due to integration uncertainty, requiring active capital monitoring despite a $100M support
              commitment [CR003].
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
          - type: callout
            title: Underwriting Diligence Requirements on Loan Book Vintage and Reserve Coverage
            body: >-
              Prospective investors and debt syndicates must bypass aggregate balance sheet marketing figures and
              independently audit vintage non-performing loan ratios (IMOR), loan loss coverage (ICOR), and specific
              capital adequacy reserves (ICAP) against historical LatAm credit cycle stress tests before extending
              further capital [CR008, CR012].
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              Kapital presents a compelling structural thesis as Latin America's first regulated AI-native digital bank
              and SMB financial operating platform [CV001, CV002]. By acquiring Banco Autofin Mexico S.A. in September
              2023 for $50M, Kapital secured a direct commercial banking license, enabling low-cost deposit funding and
              vertically integrated lending that bypasses fee-extractive banking-as-a-service intermediaries [CV002,
              CV003]. In September 2025, Kapital doubled its valuation to $1.3B through an up to $100M Series C round
              led by Tribe Capital and Pelion Ventures [CV001, CV004]. Operational momentum accelerated into 2026, with
              the company reporting approximately $50M in net income for the first half of 2026, deposits exceeding
              $3.5B, and a loan book surpassing $1.7B while maintaining a 34.9% efficiency ratio and a 2.86%
              non-performing loan ratio [CV005, CV006]. However, the anti-thesis centers on extreme balance sheet
              gearing, private market opacity regarding debt seniority, and macro exposure to Mexican credit cycles
              [CV007]. Consequently, the valuation stance is classified as fair, yielding an investment recommendation
              of track with medium confidence until audited regulatory filings confirm sustainable credit performance
              [CV001, CV005, CV008].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
          - type: table
