  - id: TV002
    title: Thesis and Anti-Thesis
    notes: >-
      Analytical arguments framing the core investment thesis against principal structural risks and countervailing
      factors.
    columns:
      - Perspective
      - Core Argument
      - Key Evidence
      - What Would Change The View
    rows:
      - - 'Thesis: Charter Advantage'
        - >-
          Owning Banco Autofin provides a full commercial banking license, eliminating BaaS middleman margins and
          securing low-cost deposits.
        - Deposits reached $3.5B in H1 2026, supporting a $1.7B loan portfolio with high operational efficiency.
        - Regulatory sanction, CNBV capital adequacy issues, or deposit flight back to tier-1 commercial Mexican banks.
      - - 'Thesis: AI Operating Leverage'
        - >-
          Proprietary AI underwriting and cash management automate risk assessment, resulting in a low 34.9% efficiency
          ratio.
        - H1 2026 net income reached $50M with loan book growth of 220% year-over-year.
        - >-
          Efficiency ratio deterioration above 50% or inability to maintain low acquisition costs as customer base
          expands.
      - - 'Anti-Thesis: Credit Risk'
        - >-
          SME commercial borrowers in Latin America are highly vulnerable to macroeconomic downturns and currency
          volatility.
        - NPL ratio stood at 2.86% in H1 2026 amidst rapid 220% loan portfolio expansion.
        - Demonstrated vintage seasoning with NPLs remaining sub-3.0% across a full 24-month credit cycle.
      - - 'Anti-Thesis: Capital Seniority'
        - >-
          Extensive debt facilities and structured credit extensions create significant liquidation preference overhang
          for common equity.
        - September 2026 $125M round included debt from Fasanara Capital; prior rounds included $125M and $45M debt.
        - Refinancing expensive mezzanine debt into low-cost senior corporate deposits or clean equity recapitalization.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
