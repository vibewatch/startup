              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Financing Context, Capital Structure, and Comparable Multiples
        blocks:
          - type: paragraph
            body: >-
              Kapital's capital structure has expanded across multiple equity and debt tranches since its 2020
              inception, totaling nearly $300M in cumulative equity alongside substantial institutional warehouse lines
              [CV003, CV004, CV009]. In September 2026, Kapital closed a $125M financing package structured as a Series
              C extension co-led by Tru Arrow Partners and credit specialist Fasanara Capital, with participation from
              Cervin Ventures, Niya Partners, and Overlook Capital [CV006, CV009]. The inclusion of Fasanara Capital and
              mixed equity-debt instruments underscores that a material share of headline capital constitutes senior
              credit facilities rather than pure growth equity, creating structural liquidation overhang for common
              shareholders [CV007, CV009]. In relative valuation benchmarks, private neo-banking and commercial lending
              peers exhibit broad multiple dispersion: bunq commands a $1.9B valuation on modest reported revenues,
              while C6 Bank is valued at approximately $5.0B or 3.0x trailing revenues [CV004]. Public emerging market
              banking comps like PicPay trade at 0.4x EV/revenue, whereas profitable regional commercial franchises
              trade around 1.0x to 2.5x revenues [CV004]. At a $1.3B valuation against an annualized H1 2026 net income
              run rate of $100M (an implied ~13x P/E multiple), Kapital appears reasonably valued only if credit loss
              provisions remain contained below 3.0% [CV004, CV005, CV006].
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
      - number: '8.3'
        title: Scenario Analysis, Downside Kill Criteria, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Underwriting Kapital requires evaluating asymmetric outcomes across bull, base, and bear scenarios tied to
              operating leverage and credit quality [CV005, CV008, CV010]. In the bull case, Kapital successfully
              leverages its proprietary AI models and banking charter to scale SMB cross-border payments between Mexico
              and the United States, expanding net income toward $150M annually and achieving an exit valuation of $2.2B
              to $2.8B via a US or Mexican IPO [CV006, CV011]. In the base case, loan growth moderates to sustainable
              rates, net margins stabilize, and the firm justifies its current $1.3B to $1.6B valuation mark [CV001,
              CV004, CV005]. Conversely, the bear scenario models macro deceleration in Mexico, rising NPLs above 5.0%,
              and credit line contraction from warehouse lenders, compressing equity value toward $600M to $800M in a
              down-round restructuring [CV005, CV007, CV012]. Investors must also guard against identity confusion with
              OJSC Kapital Bank in Azerbaijan, an entirely unrelated institution holding 13.3B AZN in assets and 222M
              AZN in net profit, whose data frequently pollutes algorithmic private market screens [CV013]. Core
              thesis-break triggers include any regulatory enforcement by Mexican banking authorities, NPL spikes above
              4.5%, or senior debt covenant breaches [CV007, CV012].
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Actionable Diligence Gateway
            body: >-
              Before deploying growth equity or participating in secondary liquidity at the $1.3B valuation mark,
              institutional investors must condition capital deployment on two non-negotiable diligence deliverables:
              complete disclosure of liquidation preferences across the Fasanara debt facility, and vintage-by-vintage
              NPL cohort curves covering the past 24 months of Mexican SMB loan originations.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
