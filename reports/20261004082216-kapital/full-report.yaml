              - CU007
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Impact of Bank Acquisition on Customer Acquisition Economics
            body: >-
              Kapital's acquisition of Banco Autofin Mexico S.A. fundamentally reshaped its customer acquisition
              dynamics. By acquiring an established banking institution with 65,000 accounts and a full commercial
              license, Kapital bypassed the multi-year regulatory ramp and exorbitant marketing costs typically required
              for standalone fintechs to aggregate deposits [CU001, CU002]. This dual infrastructure enables Kapital to
              offer lower cost of capital and higher deposit yields directly to SMB customers without paying
              intermediation spreads to third-party sponsor banks [CU001, CU004].
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU004
          - type: callout
            title: Customer Retention and Cohort Performance Opacity
            body: >-
              While Kapital has demonstrated rapid customer scaling to over 300,000 accounts, the absence of public
              cohort-level churn, net revenue retention (NRR), and loan default data poses an investment diligence risk
              [CU002, CU008, CU009]. In Latin American SMB lending, small business insolvency rates can rise sharply
              during macroeconomic contraction. Investors must independently audit whether customer expansion reflects
              enduring multi-product platform lock-in or transient single-feature usage [CU008, CU009].
            calloutType: risk
            claimRefs:
              - CU002
              - CU008
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Prudential Banking Regulation, Supervisory Scrutiny, and Legal Architecture
        blocks:
          - type: paragraph
            body: >-
              Operating as a licensed financial holding company (Grupo Financiero) following the regulatory integration
              of Banco Autofin Mexico S.A. transforms Kapital's supervisory posture from a light-touch software provider
              into a heavily regulated deposit-taking institution [CR001]. In Mexico, the company operates under the
              direct prudential supervision of the Comisión Nacional Bancaria y de Valores (CNBV) and Banco de México
              (Banxico), enforcing strict capital adequacy rules, statutory reserve requirements, and mandatory
              anti-money laundering (AML/KYC) compliance frameworks [CR001, CR002]. Credit rating agencies have
              reflected this operational and regulatory complexity: while Moody's Local México assigned A-.mx long-term
              deposit ratings, it revised its outlook to 'Developing' following the acquisition of Intercam assets,
              highlighting the supervisory friction of integrating regulated brokerages, trusts, and mutual funds
              [CR003]. Beyond Mexican banking law, Kapital faces cross-border legal fragmentation as it scales
              operations in Colombia and targets expansion into the United States and Europe, requiring localized
              financial licenses, data protection compliance, and continuous alignment with monetary authorities [CR002,
              CR004].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
