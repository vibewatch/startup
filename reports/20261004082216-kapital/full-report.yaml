      - number: '6.2'
        title: Customer Adoption Trajectory, Account Growth, and Platform Velocity
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Kapital's platform demonstrates significant expansion in active customer
              accounts and platform balance sheet scale across its core regional jurisdictions [CU001, CU002]. During
              2023, Kapital reported expanding its customer base to 80,000 small businesses operating across Mexico,
              Colombia, and Peru [CU001]. Growth was substantially accelerated in September 2023 via the strategic
              acquisition of Banco Autofin Mexico S.A., which integrated an established base of 65,000 existing banking
              clients directly into Kapital's technology stack [CU001]. By September 2025, public company disclosures
              reported that Kapital's platform scale had extended to over 300,000 customers across Mexico, Colombia, and
              the United States, supporting a platform balance sheet of $3 billion [CU002]. This rapid customer
              acquisition reflects strong commercial demand for integrated corporate cards, instant SPEI settlement, and
              AI-underwritten working capital credit facilities across Latin American enterprise corridors [CU001,
              CU002, CU007].
            claimRefs:
              - CU001
              - CU002
              - CU007
