      - number: '7.2'
        title: M&A Integration Complexity, Operational Continuity, and IT System Reliability
        blocks:
          - type: paragraph
            body: >-
              Kapital's rapid transformation through major institutional acquisitions introduces substantial operational
              execution and integration risks [CR003, CR005]. Absorbing traditional banking platforms like Banco Autofin
              (65,000 legacy accounts) and Intercam's brokerage and asset management operations (180,000 clients and
              approximately 1,900 trusts) requires migrating legacy mainframe architectures onto Kapital's cloud-native
              computational stack [CR001, CR005]. To support these post-acquisition operations and compliance demands,
              Kapital committed $100 million in operational capital [CR003]. Operational risks are amplified by
              technical dependencies on mandatory government electronic invoicing (CFDI) ingestion pipelines, instant
              domestic clearing rails like Mexico's SPEI, and real-time ERP accounting synchronization [CR006, CR007].
              Any systemic outage, clearing failure, or software bug across its proprietary FX engine or invoice
              ingestion API directly threatens business continuity for over 80,000 SMB clients and retail depositors
              [CR005, CR006].
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
