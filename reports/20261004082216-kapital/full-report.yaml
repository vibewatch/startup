      - number: '5.3'
        title: Trust, Regulatory Compliance Controls, and Technical Scaling Risks
        blocks:
          - type: paragraph
            body: >-
              Kapital operates within highly regulated multi-jurisdictional banking environments, necessitating advanced
              anti-money laundering (AML), automated Know Your Customer (KYC), and computational compliance safeguards
              across Mexico, Colombia, and the United States [CE003]. The platform's security controls incorporate
              device-level hardware authentication, tokenized payment provisioning, and integrated biometric
              confirmation via Apple Pay Face ID and Touch ID to protect transaction authorization [CE004]. However,
              rigorous diligence reveals technical and ecosystem vulnerabilities: public developer signals, external API
              documentation, open-source repository commits, and developer community discussions remain private,
              restricting third-party verification of system uptime, code maintainability, and microservice resilience
              [CE006]. Furthermore, Kapital faces corporate disambiguation friction in global registries due to
              unrelated entities such as European securitization fiduciary KAPITAL Group SA / KAPITAL Luxembourg S.a
              r.l. [CE007], Brazilian technology consultancy Kapital Tecnologia [CE008], and maritime propulsion
              investor Grieg Kapital [CE009]. In the absence of published SOC2 audit summaries, penetration test
              attestations, or public API changelogs, technical risk management depends heavily on internal engineering
              governance [CE006, CE010].
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Advantage of Owned Banking Infrastructure
            body: >-
              By acquiring Banco Autofin Mexico S.A. and stripping out legacy infrastructure in favor of a proprietary
              computational stack, Kapital eliminated reliance on BaaS intermediary middleware. This native architecture
              grants full control over payment settlement, reduces interchange friction, and optimizes loss ratios
              through direct balance sheet integration [CE002, CE003].
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: Developer Signal and Technical Opacity Diligence Risk
            body: >-
              Kapital maintains a closed technical surface without public software repositories, developer API portals,
              or published system status metrics. Diligence teams cannot independently audit microservice architecture,
              API deprecation policies, or SOC2 controls through public developer signal channels [CE006].
            calloutType: risk
            claimRefs:
              - CE006
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Target Verticals, and Value Propositions
        blocks:
          - type: paragraph
            body: >-
              Kapital directs its financial technology and banking services toward underserved commercial segments
              across Latin America, specifically focusing on micro, small, and mid-sized enterprises (SMBs) in Mexico
              and Colombia that lack adequate credit access from traditional commercial banking institutions [CU001,
              CU002]. The enterprise customer base is segmented into three primary operating tiers: owner-operated small
              enterprises seeking working capital and instant automated cash visibility; emerging mid-market
              corporations requiring multi-currency treasury orchestration, expense management, and payroll
              distribution; and retail depositors utilizing yield-bearing promissory notes [CU001, CU003, CU004].
              Traditional banking institutions in Mexico historically restrict total bank credit to only 10.5% of small
              businesses despite SMBs representing 90% of operating businesses, positioning Kapital's integrated banking
              and software ecosystem to capture high-margin commercial treasury and lending relationships [CU001,
              CU005]. Value realization across customer cohorts is anchored by automated cash flow visibility,
              predictive analytics for vendor selection, and integrated corporate payment rails that eliminate manual
              reconciliation [CU001, CU006].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
