              - CO006
              - CO007
              - CO008
              - CO010
      - number: '1.3'
        title: Financing History, Balance Sheet Scale, and Growth Metrics
        blocks:
          - type: paragraph
            body: >-
              Kapital's capitalization strategy blends equity financing with institutional debt facilities to support
              its credit portfolio and proprietary balance sheet expansion [CO004, CO008, CO009]. In December 2023,
              Kapital secured $165 million in mixed financing comprising $40 million in Series B equity led by Tribe
              Capital alongside $125 million in debt facilities [CO004]. In September 2025, the company finalized an up
              to $100 million Series C round co-led by Tribe Capital and Pelion Ventures with participation from Y
              Combinator, Marbruck Ventures, and Tru Arrow Partners, doubling its valuation to $1.3 billion and
              establishing Kapital as Mexico's first AI unicorn [CO008]. In September 2026, Kapital closed an additional
              $125 million financing round co-led by Tru Arrow Partners and Fasanara Capital with participation from
              Cervin Ventures, Niya Partners, and Overlook Capital to accelerate US and European market entry [CO009].
              During the first half of 2026, Kapital reported approximately $50 million in net income, with customer
              deposits exceeding $3.5 billion, a total loan portfolio above $1.7 billion, an efficiency ratio of 34.9%,
              and a non-performing loan ratio of 2.86% [CO011].
            claimRefs:
              - CO004
              - CO008
              - CO009
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO008
              - CO009
