callouts:
  - calloutType: "insight"
    title: "Regulatory Licensing as a Structural Distribution Moat"
    body: "Unlike pure software-as-a-service fintech wrappers that depend entirely on third-party sponsor banks, Kapital's strategic acquisition of a regulated banking license in Mexico enables native deposit holding, direct interbank clearing, and lower cost of funds. This structural integration mitigates rent extraction by intermediary sponsor institutions and expands net interest margins."
    claimRefs:
      - "CM001"
      - "CM006"
  - calloutType: "risk"
    title: "Credit Underwriting Vulnerability in Fragmented SME Portfolios"
    body: "Small business credit underwriting in volatile macroeconomic environments presents persistent default risk, particularly when extending revolving working capital without liquid collateral. Ensuring algorithmically driven credit models remain resilient across high-inflation or recessionary cycles constitutes a critical diligence check for institutional investors."
    claimRefs:
      - "CM002"
      - "CM014"
