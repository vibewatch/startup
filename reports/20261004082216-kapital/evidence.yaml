evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-and-arr
    missingEvidence: >-
      Exact worldwide FTE employee headcount breakdown by engineering, compliance, and sales, along with software ARR vs
      banking net interest margin breakdown.
    whyItMatters: >-
      Without exact headcount and software ARR figures, software gross margins, revenue per employee, and computational
      operating leverage cannot be modeled independently.
    diligencePath: >-
      Request audited GAAP financial statements, segmented revenue breakdowns, and HR headcount reports during
      confirmatory management diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: Complete cap table and exact equity ownership percentages across Series A, B, and C preferred share classes.
    whyItMatters: >-
      Investor syndication details only reflect lead public disclosures, leaving minority syndicate stakes and secondary
      share transfers unverified.
    diligencePath: Obtain certified cap table and voting rights schedule from company counsel.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: named-competitor-set
    missingEvidence: >-
      A relevant named-peer list covering incumbent banks, spend platforms, digital lenders, internal build, and likely
      entrants in Kapital's operating markets.
    whyItMatters: >-
      Without a verified set, peer scale, funding, positioning, and strategic direction cannot be compared without
      speculation.
    diligencePath: >-
      Request management's RFP and win-loss competitor list, then verify each peer through current official, regulatory,
      and independent sources.
    relatedQuestionRefs:
      - QP001
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Current rate cards, fee schedules, credit pricing, discounts, and contract terms for Kapital and relevant named
      alternatives.
    whyItMatters: >-
      Feature breadth cannot be translated into buyer value, price position, or contribution margin without comparable
      commercial terms.
    diligencePath: >-
      Collect dated proposals and executed contracts for representative SMB cohorts, preserving currency, term, customer
      size, and included services.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-multihoming
    missingEvidence: >-
      Primary-account share, product attachment, cohort retention, wallet share, churn, and win-loss reasons by
      competitor.
    whyItMatters: >-
      These data determine whether integration creates durable lock-in or whether customers multi-home with little
      switching friction.
    diligencePath: >-
      Review anonymized customer cohorts and lost-deal records segmented by tenure, product count, geography, and
      primary financial provider.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: missing-source
    severity: material
    topic: independent-moat-benchmark
    missingEvidence: >-
      Independent peer data on margins, customer lifetimes, credit losses, distribution efficiency, and incumbent
      digital response.
    whyItMatters: Kapital's company-issued advantage claims cannot establish durability or risk-adjusted economics on their own.
    diligencePath: >-
      Obtain regulator returns, audited peer disclosures, channel checks, and matched-cohort credit performance before
      underwriting a moat premium.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-opacity
    missingEvidence: >-
      Audited schedule of customer acquisition cost (CAC), LTV/CAC ratios, and payback periods across SME client
      cohorts.
    whyItMatters: >-
      Without CAC payback metrics, investors cannot verify whether rapid customer expansion generates sustainable equity
      value.
    diligencePath: >-
      Request management's confidential unit economics data room, cohort retention curves, and sales channel
      compensation plans.
    relatedQuestionRefs:
      - QI002
  - type: missing-source
    severity: material
    topic: revenue-mix-disaggregation
    missingEvidence: >-
      Disaggregated breakdown of net interest margin, payment interchange fee share, and pure recurring SaaS
      subscription revenue.
    whyItMatters: >-
      Determines whether Kapital warrants a high-multiple software valuation or should be valued as a regional specialty
      commercial bank.
    diligencePath: >-
      Obtain trial balances and audited segment reporting detailing software subscription contracts versus balance-sheet
      credit yield.
    relatedQuestionRefs:
      - QI001
  - type: private-evidence-only
    severity: material
    topic: debt-facility-terms
    missingEvidence: Detailed credit agreements, interest spreads, asset-pledge covenants, and maturity schedules for debt facilities.
    whyItMatters: >-
      Reliance on wholesale debt introduces liquidity refinancing risks if regional credit markets tighten or
      non-performing loans rise.
    diligencePath: Review credit agreements with Fasanara Capital and prior warehouse debt providers in legal diligence.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: technical-metrics-and-uptime
    missingEvidence: >-
      Audited system availability (uptime SLA percentages), API latency percentiles, microservice architecture diagrams,
      and loan loss cohort analytics.
    whyItMatters: >-
      Without audited uptime logs and default loss cohort curves, platform engineering robustness and AI underwriting
      accuracy cannot be independently quantified.
    diligencePath: >-
      Request SOC2 Type II compliance reports, cloud architecture documentation, and loan default performance curves
      during confirmatory technical diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal-proxy
    missingEvidence: >-
      Public developer signal documentation, developer community discussion boards, or third-party integration partner
      technical blogs.
    whyItMatters: >-
      External engineering community perception, API reliability, and third-party developer adoption cannot be verified
      from open sources.
    diligencePath: >-
      Review internal Git commit velocity, CI/CD pipeline deployment cadence, and developer hiring documentation
      provided in a confidential virtual data room.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: customer-retention-cohorts
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross renewal rates, and monthly SMB churn data across Mexican
      and Colombian borrower cohorts.
    whyItMatters: >-
      Without verified retention cohorts, investors cannot determine whether rapid customer account growth reflects
      durable enterprise lock-in or high churn compensated by aggressive acquisition.
    diligencePath: >-
      Request confidential management data room disclosure of quarterly cohort NRR, logo retention curves, and customer
      lifetime value (LTV) relative to customer acquisition cost (CAC).
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: loan-concentration-and-defaults
    missingEvidence: >-
      Granular breakdown of top-20 customer borrower concentrations and vintage-specific non-performing loan (NPL)
      ratios across Kapital's SMB loan book.
    whyItMatters: >-
      Credit underwriting in emerging markets carries significant concentration risk, where delinquency among top
      borrower accounts can disproportionately impair balance sheet equity.
    diligencePath: >-
      Inspect audited regulatory loan book filings submitted to the Comisión Nacional Bancaria y de Valores (CNBV) for
      Banco Autofin Mexico S.A.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU001
      - TU003
  - type: private-evidence-only
    severity: material
    topic: loan-loss-provisions
    missingEvidence: >-
      Audited loan loss provision schedules, vintage cohort default curves, and specific CNBV regulatory examination
      results post-2025.
    whyItMatters: >-
      Aggregate non-performing loan metrics (IMOR 2.9%) do not disclose vintage degradation or potential
      under-provisioning during rapid credit expansion.
    diligencePath: >-
      Obtain quarterly CNBV regulatory compliance returns (R01/C041), internal audit reports, and vintage credit loss
      tables during confirmatory diligence.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: core-banking-migration
    missingEvidence: >-
      Detailed technical cutover schedule, SLA metrics, and legacy mainframe decommissioning status for Banco Autofin
      and Intercam assets.
    whyItMatters: >-
      Unfinished banking migrations create systemic operational risks, potential regulatory fines, and elevated customer
      attrition.
    diligencePath: >-
      Request the engineering and IT integration roadmap alongside third-party system audit logs from the Chief
      Technology Officer.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
