callouts:
  - calloutType: "risk"
    title: "Wholesale Debt Dependency and Maturity Risk"
    body: "Kapital has repeatedly supplemented equity financing with large debt tranches and private credit facilities, including $125 million in Series B debt and $125 million from Fasanara Capital and Tru Arrow Partners in 2026. Without visibility into debt covenants, borrowing interest rates, and asset-backing pledging requirements, investors face substantial maturity and refinancing risks in volatile interest rate environments."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
  - calloutType: "insight"
    title: "Operating Leverage Anchored in Bank Infrastructure"
    body: "By acquiring Banco Autofin Mexico S.A. and obtaining a direct banking charter, Kapital bypassed expensive third-party banking-as-a-service intermediaries, enabling a 34.9% efficiency ratio and direct access to low-cost deposits exceeding $3.5 billion to fund its loan growth."
    claimRefs:
      - "CI003"
      - "CI007"
      - "CI008"
      - "CI010"
