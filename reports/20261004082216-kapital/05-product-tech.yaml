chapter:
  number: 5
  title: "Product & Technology"
  summary: "Kapital delivers an integrated B2B financial operating system that combines business checking accounts, instant SPEI transfers, corporate spend cards, and credit facilities with proprietary automated risk underwriting. Built natively as computational banking infrastructure following its acquisition of Banco Autofin Mexico, the platform removes legacy core dependencies to automate AML/KYC workflows, cash flow visibility, and working capital underwriting for small and mid-sized businesses."
sections:
  - id: "product-definition-and-customer-workflow"
    title: "Product Architecture, Service Definition, and Enterprise Workflow"
    body: "Kapital provides a cloud-native financial operating platform tailored to the cash management, payment execution, and working capital needs of small and medium-sized enterprises across Latin America and cross-border commercial corridors [CE001]. Rather than acting as a superficial software layer dependent on third-party sponsor banks, Kapital operates an integrated computational banking environment anchored by a full commercial banking license secured through its acquisition of Banco Autofin Mexico S.A. [CE002, CE003]. The company's customer-facing workflow unifies business bank accounts with minimum opening balances starting from $1,000 MXN, digital debit cards, corporate credit lines, local automated clearing via real-time SPEI transfers, and mobile spend management supporting device-level biometrics such as Apple Pay [CE004]. By centralizing payments, expense approvals, invoice settlement, and financing inside a single operating portal, the platform provides SMB operators with automated financial visibility and cash flow intelligence historically accessible only to large multinational enterprises with dedicated treasury divisions [CE001, CE005]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
  - id: "module-matrix-and-operating-architecture"
    title: "Core Modules, Software Stack, and Computational Underwriting Engine"
    body: "Kapital's core operating architecture is architected around modular computational services that execute transaction processing, underwriting, and treasury functions in real time [CE003, CE005]. Every system was designed from the ground up as financial infrastructure rather than an off-the-shelf legacy core patched with frontend software, enabling Kapital to strip out outdated core banking modules from acquired legacy institutions and rebuild operations directly onto its modern stack [CE003]. The platform's computational underwriting engine ingests customer transaction histories, vendor invoice registries, cash flow telemetry, and payment velocity to automate credit limits and revolving loan approvals for SMBs [CE001, CE005]. Furthermore, Kapital's R&D roadmap emphasizes predictive analytics and margin optimization algorithms designed to evaluate vendor options and recommend working capital adjustments for enterprise clients [CE005]. On the consumer and SME treasury side, the platform integrates fixed-rate savings and investment certificates, including Pagare con Rendimiento Liquidable al Vencimiento (PRLV) instruments offering fixed annual yields under structured eligibility criteria [CE004]."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "trust-compliance-and-technical-risks"
    title: "Trust, Regulatory Compliance Controls, and Technical Scaling Risks"
    body: "Kapital operates within highly regulated multi-jurisdictional banking environments, necessitating advanced anti-money laundering (AML), automated Know Your Customer (KYC), and computational compliance safeguards across Mexico, Colombia, and the United States [CE003]. The platform's security controls incorporate device-level hardware authentication, tokenized payment provisioning, and integrated biometric confirmation via Apple Pay Face ID and Touch ID to protect transaction authorization [CE004]. However, rigorous diligence reveals technical and ecosystem vulnerabilities: public developer signals, external API documentation, open-source repository commits, and developer community discussions remain private, restricting third-party verification of system uptime, code maintainability, and microservice resilience [CE006]. Furthermore, Kapital faces corporate disambiguation friction in global registries due to unrelated entities such as European securitization fiduciary KAPITAL Group SA / KAPITAL Luxembourg S.a r.l. [CE007], Brazilian technology consultancy Kapital Tecnologia [CE008], and maritime propulsion investor Grieg Kapital [CE009]. In the absence of published SOC2 audit summaries, penetration test attestations, or public API changelogs, technical risk management depends heavily on internal engineering governance [CE006, CE010]."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
