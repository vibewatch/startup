callouts:
  - calloutType: "insight"
    title: "Architectural Advantage of Owned Banking Infrastructure"
    body: "By acquiring Banco Autofin Mexico S.A. and stripping out legacy infrastructure in favor of a proprietary computational stack, Kapital eliminated reliance on BaaS intermediary middleware. This native architecture grants full control over payment settlement, reduces interchange friction, and optimizes loss ratios through direct balance sheet integration [CE002, CE003]."
    claimRefs:
      - "CE002"
      - "CE003"
  - calloutType: "risk"
    title: "Developer Signal and Technical Opacity Diligence Risk"
    body: "Kapital maintains a closed technical surface without public software repositories, developer API portals, or published system status metrics. Diligence teams cannot independently audit microservice architecture, API deprecation policies, or SOC2 controls through public developer signal channels [CE006]."
    claimRefs:
      - "CE006"
