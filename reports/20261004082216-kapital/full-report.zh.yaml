        title: 信任、监管合规控制与技术扩展风险
        blocks:
          - type: paragraph
            body: >-
              Kapital 在高度受监管的多司法辖区银行环境中运营，需要在墨西哥、哥伦比亚和美国部署先进的反洗钱（AML）、自动化了解你的客户（KYC）和计算型合规防护
              [CE003]。平台安全控制包含设备级硬件认证、代币化支付配置，以及通过 Apple Pay Face ID 和 Touch ID 进行的集成生物识别确认，以保护交易授权
              [CE004]。但严格尽调发现技术和生态脆弱性：公开开发者信号、外部 API 文档、开源代码库提交记录和开发者社区讨论均为私有，限制了第三方对系统正常运行时间、代码可维护性和微服务韧性的核验
              [CE006]。此外，由于欧洲证券化受托机构 KAPITAL Group SA / KAPITAL Luxembourg S.a r.l.、巴西技术咨询公司 Kapital Tecnologia 和海事推进投资者
              Grieg Kapital 等无关实体，Kapital 在全球登记信息中面临身份辨识摩擦 [CE007, CE008, CE009]。在缺乏 SOC2 审计摘要、渗透测试证明或公开 API
              更新日志的情况下，技术风险管理高度依赖内部工程治理 [CE006, CE010]。
