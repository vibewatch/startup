chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营版图与核心平台
        blocks:
          - type: paragraph
            body: >-
              Kapital 是一家技术优先的 B2B 金融机构，由 René Saúl 和 Fernando Sandoval 于 2020 年创立，总部位于墨西哥墨西哥城
              [CO001]。机构覆盖墨西哥、哥伦比亚、西班牙和美国四个核心区域市场，为中小企业（SMB）提供企业级财务可见性、现金流管理、企业支出控制和自动化信贷承销 [CO002]。Kapital
              原生构建为计算型银行基础设施，而不是在旧核心系统上打补丁，因而能把企业卡、多币种企业账户、即时 SPEI 转账和自研 AI 分析统一起来 [CO003]。2023 年 9 月，Kapital 完成对 Banco
              Autofin Mexico S.A. 的战略收购，取得完整商业银行牌照，并将 65,000 名既有客户纳入技术生态 [CO004]。凭借受监管银行能力与自研自动化风险智能，Kapital
              把过去通常只向大型跨国企业提供的营运资金和数字资金管理服务带给 SMB [CO005]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO008
              - CO009
              - CO011
              - CO014
      - number: '1.2'
        title: 执行层、治理结构与运营重点
        blocks:
          - type: paragraph
            body: >-
              Kapital 由首席执行官 René Saúl 和首席财务官 Fernando Sandoval 联合创立，两人负责公司全球战略、技术落地和财务管理 [CO001,
              CO006]。执行团队还包括负责机构规模化和拉美区域分销的董事总经理 Eder Echeverria [CO007]。联合创始人兼 CEO René Saúl 是 Kapital
              扩张的主要外部推动者，公司在监管谈判、主权许可和资本募集上对关键人物依赖度较高 [CO001, CO004]。治理与监督由董事会及投资委员会中的机构投资者代表支撑，包括 Tribe Capital、Pelion
              Venture Partners、Tru Arrow Partners 和 Fasanara Capital [CO008,
              CO009]。为降低墨西哥、哥伦比亚和美国碎片化监管框架下的关键人物运营风险，Kapital 围绕持牌银行合规、自动化 AML/KYC 流程和计算型风险管理搭建本地管理团队 [CO005, CO010]。
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO007
              - CO008
              - CO010
      - number: '1.3'
        title: 融资历史、资产负债表规模与增长指标
        blocks:
          - type: paragraph
            body: >-
              Kapital 以股权融资和机构债务工具相结合的方式，支持信贷组合及自有资产负债表扩张 [CO004, CO008, CO009]。2023 年 12 月，Kapital 获得总额 $165 million
              的混合融资，其中包括 Tribe Capital 领投的 $40 million Series B 股权和 $125 million 债务额度 [CO004]。2025 年 9 月，公司完成最高 $100
              million 的 Series C，由 Tribe Capital 和 Pelion Ventures 联合领投，Y Combinator、Marbruck Ventures 和 Tru Arrow
              Partners 参与；估值翻倍至 $1.3 billion，Kapital 也成为墨西哥首家 AI 独角兽 [CO008]。2026 年 9 月，Kapital 又完成 $125 million 融资，由
              Tru Arrow Partners 和 Fasanara Capital 联合领投，Cervin Ventures、Niya Partners 和 Overlook Capital
              参与，用于加速进入美国和欧洲市场 [CO009]。2026 年上半年，Kapital 报告净利润约 $50 million，客户存款超过 $3.5 billion，总贷款组合超过 $1.7
              billion，效率比率为 34.9%，不良贷款率为 2.86% [CO011]。
            claimRefs:
              - CO004
              - CO008
              - CO009
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO008
              - CO009
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO008
              - CO009
              - CO011
              - CO015
      - number: '1.4'
        title: 市场辨识、机构边界与逆境分析
        blocks:
          - type: paragraph
            body: >-
              评估 Kapital 时，必须严格将其与同名的无关国际实体区分开来 [CO012]。公开市场登记信息和全球数据库经常把墨西哥 Kapital 与在 PASHA Holding 旗下运营的阿塞拜疆 OJSC
              Kapital Bank 混淆 [CO012]。阿塞拜疆 Kapital Bank 在 2026 年上半年报告资产 13.3 billion AZN、净利润 222 million AZN，并获得当地
              Moody's 和 S&P 评级，但它与这家拉美金融科技初创公司在法律、治理、资本和运营上均无关联 [CO012]。同样，总部位于卢森堡和瑞士、专注资产管理人 SPV 的 KAPITAL Inc.，以及
              Kapital Bank Brasil，也都是完全不同的公司结构 [CO013]。Kapital
              的核心业务风险仍集中在多主权司法辖区的监管合规、快速扩表下的资本充足性、墨西哥利率的宏观波动，以及中型企业借款人的贷款组合信用质量 [CO011, CO014]。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 受监管银行牌照护城河
            body: 不同于依赖第三方赞助银行的典型新银行金融科技公司，Kapital 直接拥有 Banco Autofin Mexico，可获得完整监管控制、低成本存款，并原生控制清算和支付轨道 [CO004, CO005]。
            calloutType: strength
            claimRefs:
              - CO004
              - CO005
          - type: callout
            title: 与无关主权实体的身份混淆
            body: 金融数据供应商广泛混淆 Kapital（墨西哥/美国金融科技公司）与 OJSC Kapital Bank（阿塞拜疆）。投资者必须严格拆分公司申报材料，避免把无关的资产负债表和主权风险混在一起 [CO012]。
            calloutType: risk
            claimRefs:
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可寻址支出与结构性替代方案
        blocks:
          - type: paragraph
            body: >-
              Kapital 位于拉丁美洲 SMB 商业银行基础设施、企业信贷承销和企业财务运营软件的交汇处，墨西哥是其基础市场 CM001, CM002。核心可寻址支出包括 B2B
              交易银行手续费、营运资金和循环信贷利差、支付编排价差，以及自动化资金管理和会计对账带来的订阅或服务费收入 CM003。Kapital
              的目标边界明确排除机构债务承销、市政公共融资，以及缺乏商业联系的零售消费分期贷款 CM004。历史上，拉美 SMB
              依赖零散的非正式现金安排、用于商业运营的个人信用卡、手工电子表格对账，以及设置高额抵押门槛的传统网点商业银行 CM005。Kapital 在受监管银行基础设施上整合自动化财务可见性和自研信贷承销，正面解决这些摩擦
              CM002, CM006。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
      - number: '2.2'
        title: 市场规模视角与多层机会框架
        blocks:
          - type: paragraph
            body: >-
              评估拉丁美洲 SME 银行和金融平台的商业机会，需要把宽泛的企业数量拆解为可触达、可数字化服务的细分市场 CM007。S&P Global
              评级数据表明，成熟银行机构在同类市场拥有数十亿本币的庞大资本资产，但信贷仍高度集中于大型企业 CM008。在墨西哥，小企业约占全部运营企业的 90%，然而本地商业银行服务严重受限，只有 10.5% 的 SMB
              拥有正式银行信用额度 CM002, CM009。这种明显的信贷配给，形成了一个由数百万家正式和半正式企业构成的可服务市场，它们需要营运资金、资金管理可见性和快速跨境支付 CM006, CM010。Kapital
              的可服务可获得市场（SOM）依托其在墨西哥和哥伦比亚的跨境业务，已扩展到超过 300,000 个活跃客户关系，平台资产负债表规模超过 $3 billion CM006, CM011。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM009
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM006
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Kapital 的企业采用路径横跨商业财务负责人和运营行政人员
              CM012。对于新兴初创企业和中型成长公司，首席财务官或财务总监是主要经济买方，从运营资金预算中分配软件支出，同时评估营运资金额度、企业支出可见性和实时 ERP 会计同步 CM003,
              CM013。对于较小的商业企业和业主经营公司，创始人或董事总经理直接掌握财务决策，主要诉求是现金流可见性、工资发放和更顺畅的供应商付款 CM002,
              CM012。采用触发因素主要是突发的运营事件，包括库存融资受限、国内税务对账截止期，或在拉美进行国际跨境扩张 CM006, CM013。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、监管障碍与尽调现实
        blocks:
          - type: paragraph
            body: >-
              墨西哥技术赋能型 B2B 银行的发展由宏观数字化要求、电子发票框架和美洲内部不断增长的跨境贸易流推动 CM001,
              CM006。但严格的资本充足性标准、反洗钱（AML）合规要求，以及借款人群体碎片化带来的高交易对手信用风险，会限制增长 CM006, CM014。权威宏观研究往往把消费小额金融与企业软件混在一起，因此第三方发布的
              TAM 估算在地域粒度和会计口径上经常不一致 CM015。严谨的投资尽调需要核实监管拨备比例，跟踪经济下行周期中的贷款组合不良资产轨迹，并验证不同 SMB 群组的净收入留存 CM014, CM016。
            claimRefs:
              - CM001
              - CM006
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 监管牌照构成结构性分销护城河
            body: >-
              不同于完全依赖第三方赞助银行的纯 SaaS 金融科技外壳，Kapital
              收购墨西哥受监管银行牌照后，可以原生持有存款、直接进行银行间清算，并降低资金成本。这种结构性整合减少了中介赞助机构攫取租金的空间，也扩大了净息差。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
          - type: callout
            title: 碎片化 SME 组合中的信贷承销脆弱性
            body: 在宏观经济波动环境下，小企业信贷承销持续面临违约风险，尤其是在没有流动抵押品时提供循环营运资金。机构投资者必须检查算法驱动的信贷模型能否在高通胀或衰退周期中保持韧性。
            calloutType: risk
            claimRefs:
              - CM002
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与证据边界
        blocks:
          - type: paragraph
            body: >-
              可防御的竞争集合不应只包括数字贷款机构，因为 Kapital
              把交易账户、卡、支付、信贷、投资产品和外汇整合在一个方案中。买方也可以把它与传统银行、专业卡或费用工具、非银行贷款机构、内部财务运营，或多供应商现状进行比较。但现有证据对 Kapital
              的刻画远强于这些替代方案：没有保留的来源点名相关直接同业，也没有记录其规模、融资、目标细分和产品限制。两条搜索结果还涉及使用 Kapital
              名称的无关企业——一家阿塞拜疆零售银行和一家卢森堡私人市场管理人——必须排除，不能误列为直接竞争者。因此，这是一张品类地图，而非完整的同业排名表。
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.2'
        title: 能力与产品组合比较
        blocks:
          - type: paragraph
            body: >-
              Kapital
              官网宣传银行、信贷、投资和外汇产品，第三方市场描述则补充了企业卡、本地转账、费用管理、账单支付、工资发放、供应商付款和基于现金流的循环信贷。这些来源足以支持产品广度，但不能证明相对于某个具体竞争者具有功能对等或优势。保留证据中唯一具体的公开商业条款，是按
              MXN 1,000–49,999.99 投资区间计算的 8.50% 年化 PRLV 总促销利率，且明确只在 2026 年 9 月 30 日前有效，早于本报告 10 月 4
              日的运行日期。因此，它是历史促销证据，不是当前定价。竞争者的订阅费、利率、信用额度、折扣、服务水平和合同条款仍未知，不应按品类惯例推断。
            claimRefs:
