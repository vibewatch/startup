  - id: FU001
    title: 客户旅程与采用循环图
    type: journey-map
    summary: 展示拉丁美洲 SMB 客户获取、数字化接入、平台扩张及运营留存循环的可视化地图。
    approximationNotes: 工作流阶段依据 Kapital 平台产品功能与公开商业披露映射。
    data:
      items:
        - label: 发现与获客
          touchpoints:
            - 数字营销与商业银行顾问触达
            - 同业 SME 转介与口碑推荐
          painPoints: Strict collateral demands and high rejection rates from legacy commercial banks
          actions: SMB submits commercial profile and baseline business registry documents online
        - label: 接入与开户
          touchpoints:
            - 数字化 KYC/AML 验证
            - 即时激活 SPEI 企业账户，起始金额为 $1,000 MXN
          painPoints: Protracted multi-week branch onboarding cycles at traditional institutions
          actions: Customer receives virtual corporate debit card and accesses mobile dashboard
        - label: 资金管理集成与支出控制
          touchpoints:
            - 发行企业卡，并为员工设置定制化支出限额
            - 自动采集费用凭证并与会计 ERP 对账
          painPoints: Fragmented cash payments and manual receipt tracking across multiple vendors
          actions: Client routes operational expenditures and supplier disbursements through Kapital
        - label: 信贷承保与营运资金
          touchpoints:
            - AI 驱动的现金流与支付记录承保分析
            - 循环授信额度与短期贷款审批
          painPoints: Working capital deficits hindering inventory purchasing and commercial expansion
          actions: Borrower accesses credit liquidity directly integrated into operating treasury account
        - label: 平台扩张与多产品留存
          touchpoints:
            - 配置 PRLV 固定利率储蓄存款（8.50% 毛收益率）
            - 执行覆盖墨西哥、哥伦比亚与美国通道的跨境支付
          painPoints: Yield drag on idle cash balances and high friction in cross-border transfers
          actions: Customer consolidates complete company treasury and deposit relationship onto platform
        - label: 长期嵌入工作流
          touchpoints:
            - 自动向员工发放工资
            - 预测性现金流分析与供应商优化洞察
          painPoints: Disjointed software tools requiring manual financial subcontracting
          actions: High operational switching costs lock enterprise into Kapital financial ecosystem
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU007
