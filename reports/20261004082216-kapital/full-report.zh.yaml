        title: 展示项
        blocks:
          - type: callout
            title: 可执行尽调入口
            body: >-
              在 $1.3B 估值水平投入成长股权或参与二级流动性交易前，机构投资人必须把资金部署绑定在两项不可妥协的尽调交付物上：完整披露 Fasanara 债务工具的清算优先权，以及覆盖过去 24 个月墨西哥 SMB
              新发贷款、按发放批次拆分的 NPL 队列曲线。
