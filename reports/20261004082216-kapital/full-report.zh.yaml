      - number: '7.2'
        title: 并购整合复杂度、运营连续性与 IT 系统可靠性
        blocks:
          - type: paragraph
            body: >-
              Kapital 通过大型机构收购快速转型，带来显著的运营执行和整合风险 [CR003, CR005]。吸收 Banco Autofin（65,000 个旧账户）等传统银行平台，以及 Intercam
              的券商和资产管理业务（180,000 名客户、约 1,900 个信托），需要把旧主机架构迁移到 Kapital 的云原生计算栈 [CR001, CR005]。为支持收购后的运营和合规要求，Kapital 承诺投入
              $100 million 运营资本 [CR003]。对政府强制电子发票（CFDI）摄取管线、墨西哥 SPEI 等即时国内清算轨道以及实时 ERP 会计同步的技术依赖，会进一步放大运营风险 [CR006,
              CR007]。其自有外汇引擎或发票摄取 API 发生系统级故障、清算失败或软件漏洞，都可能直接威胁超过 80,000 名 SMB 客户和零售存款人的业务连续性 [CR005, CR006]。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
