      - number: '5.2'
        title: 核心模块、软件栈与计算型承销引擎
        blocks:
          - type: paragraph
            body: >-
              Kapital 的核心运营架构围绕模块化计算服务搭建，实时执行交易处理、承销和资金管理功能 [CE003, CE005]。每套系统都从头构建为金融基础设施，而不是在现成旧核心上打补丁，因此 Kapital
              能从收购的旧机构中剥离过时的核心银行模块，直接在现代软件栈上重建运营 [CE003]。平台的计算型承销引擎读取客户交易历史、供应商发票登记、现金流遥测和支付速度，自动确定 SMB 的信用额度和循环贷款审批
              [CE001, CE005]。此外，Kapital 的研发路线强调预测分析和利润率优化算法，用于评估供应商选项并为企业客户建议营运资金调整 [CE005]。在消费者和 SME
              资金管理侧，平台整合固定利率储蓄和投资证书，包括在结构化资格条件下提供固定年化收益的 Pagare con Rendimiento Liquidable al Vencimiento（PRLV）工具
              [CE004]。
