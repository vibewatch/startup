      - number: '4.2'
        title: GTM 效率、单位经济与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              公司依靠企业产品捆绑、数字获客以及收购银行带来的机会扩张资产负债表，推进 GTM。2023 年收购 Banco Autofin Mexico S.A. 后，Kapital 获得 65,000 名既有银行客户；到
              2026 年年中，覆盖墨西哥、美国、哥伦比亚和欧洲的客户总触达超过 350,000。公司报告 2026 年上半年经营效率比率为 34.9%，不良贷款率为 2.86%，这次扩张带来了明显经营杠杆。2026
              年前六个月净利润约 $50 million，贷款组合同比扩大
              220%。然而，私人市场几乎没有单位层面的客户获客成本（CAC）、各细分群组回收周期或净收入留存（NRR）信息。尽调团队无法独立审计，在区域宏观下行期间，高额信贷损失是否压缩了客户回收期。
