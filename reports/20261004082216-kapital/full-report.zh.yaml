            body: >-
              Kapital 面向拉丁美洲服务不足的商业细分市场提供金融科技和银行服务，重点是墨西哥和哥伦比亚缺乏传统商业银行充分信贷支持的微型、小型和中型企业（SMB）[CU001,
              CU002]。企业客户分为三类主要运营层级：需要营运资金和即时自动现金可见性的业主经营小企业；需要多币种资金编排、费用管理和工资分发的新兴中型企业；以及使用收益型期票的零售存款人 [CU001, CU003,
              CU004]。尽管 SMB 占运营企业的 90%，墨西哥传统银行历史上只向 10.5% 的小企业提供银行信贷，这使 Kapital 的一体化银行与软件生态有机会获取高利润的企业资金管理和贷款关系 [CU001,
              CU005]。各客户群的价值实现依靠自动现金流可见性、用于供应商选择的预测分析，以及消除手工对账的一体化企业支付轨道 [CU001, CU006]。
