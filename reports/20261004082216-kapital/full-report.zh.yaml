      - number: '7.4'
        title: 公司身份辨识、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              机构尽调因公开登记、市场数据供应商和算法抓取器广泛混淆公司身份，而面临重大外部风险 [CR010, CR011]。带有 Kapital 名称的无关实体——尤其是阿塞拜疆 OJSC Kapital Bank（在
              PASHA Holding 旗下，H1 2026 报告资产 13.3 billion AZN、净利润 222 million AZN）和德国 Bayern
              Kapital（一家欧洲风险投资机构）——经常被误认为这家墨西哥金融科技初创公司 [CR010, CR011]。尽调团队必须将这些外国机构的主权评级、法律诉讼和财务申报与 Kapital 的墨西哥实体分开
              [CR010, CR011]。最后，投资者必须监控量化的论点破坏终止标准：(1) 不良贷款（IMOR）升破 5.0% 且拨备没有同步增加；(2) CNBV 监管制裁或吊销牌照；(3)
              零售投资证书（PRLV）存款流失；或 (4) 核心银行迁移期间发生严重运营中断 [CR003, CR008, CR012]。
            claimRefs:
              - CR003
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 收购后整合与评级展望脆弱性
            body: >-
              收购 Intercam 的券商、共同基金和运营银行资产后，Kapital 从根本上转变为 Grupo Financiero，但也在 180,000 个新账户和 1,900
              个信托之间引入严重运营复杂度。Moody's Local México 正是因整合不确定性将 Kapital 的 A-.mx 评级展望列为“Developing”；即使有 $100M 支持承诺，仍需主动监测资本
              [CR003]。
            calloutType: risk
            claimRefs:
