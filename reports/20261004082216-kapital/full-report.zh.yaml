      - number: '3.3'
        title: 集成、切换摩擦与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              最明确的潜在差异化来自纵向整合。TechCrunch 报道了 Kapital 2023 年收购 Banco Autofin
              Mexico，之后公司的新闻稿称其将银行牌照与自有软件结合。账户、支付、工资、供应商付款、卡和贷款流程整合后，客户若要更换供应商，可能必须同时迁移多项运营流程，从而形成切换摩擦。这是分析推断，不是已观察到的留存证据。同一份公司新闻稿称，拥有基础设施能带来高于无牌照金融科技公司的利润率、更长客户生命周期和更低损失率，但证据池中没有独立基准、群组数据、损失率比较或赢单/丢单记录来验证这些说法。             
              因此，多头持有和传统机构的分销能力仍是重要且未解决的替代风险。
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP010
              - CP011
              - CP015
              - CP016
      - number: '3.4'
        title: 竞争结论与尽调重点
        blocks:
          - type: paragraph
            body: >-
              证据支持可信的产品广度论点，但不足以得出持久护城河结论。Kapital 报告客户规模大幅扩张——从 2023 年三个拉美国家的 80,000 名小企业客户，增至 2025 年 Series C 时公司自称的
              300,000 名客户和 $3 billion 资产负债表——但这些数字没有说明主账户渗透率、钱包份额、流失率、实际定价或风险调整后的放贷表现。核心承销问题是：受监管的整合基础设施，究竟让 Kapital
              成为客户主要的金融运营层，还是只是多头持有系统中的又一个账户。管理层应提供有名有姓的竞争集合、丢单原因、按产品数量拆分的群组留存、产品级贡献利润率、信贷批次损失和当前价目表。在这些数据可得之前，竞争优势只能视为合理但未经验证。
            claimRefs:
              - CP003
              - CP005
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 证据池无法证明相对同业的护城河
            body: Kapital 的整合范围清晰可见，但当前定价、具名同业能力、钱包份额、留存、损失表现和竞争赢单率均缺失。公司关于利润率、客户生命周期和损失率优势的说法，在独立基准验证前都应视为假设。
            calloutType: risk
