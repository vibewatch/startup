  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现机制与收入组合
        blocks:
          - type: paragraph
            body: >-
              Kapital 通过多引擎架构变现，将企业软件工具、支付处理交换费和受监管资产负债表贷款结合起来。公司把自己定位为面向 SMB 的一体化金融运营平台，提供企业签账卡、自动化费用管理、SPEI
              支付路由、资金账户和循环营运资金信贷额度。营销材料突出 AI
              优先的软件界面，但底层收入引擎高度依赖通过银行资产负债表赚取的净息差（NIM）和信贷发放费，另有支付交易费和客户存款带来的交易性浮存金补充。核心银行与软件平台的挂牌定价强调低门槛存款账户，例如提供固定年化收益的零售期票据（PRLV），而企业软件订阅定价对公众仍大多未拆分或不透明。尽调需要确认软件订阅收入究竟是可持续的经常性
              ARR，还是主要作为低利润获客渠道，为高收益信贷发放导流。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
