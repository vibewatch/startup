              - CR003
          - type: callout
            title: 贷款组合批次与准备金覆盖的承销尽调要求
            body: >-
              潜在投资者和债务银团必须绕开汇总资产负债表营销数字，在进一步投入资本前，独立审计历史批次不良贷款率（IMOR）、贷款损失覆盖率（ICOR）和具体资本充足准备金（ICAP），并与历史拉美信贷周期压力测试对照
              [CR008, CR012]。
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议框架
        blocks:
          - type: paragraph
            body: >-
              Kapital 作为拉丁美洲首家受监管、AI 原生的数字银行和 SMB 金融运营平台，提出了有吸引力的结构性论点 [CV001, CV002]。Kapital 于 2023 年 9 月以 $50M 收购
              Banco Autofin Mexico S.A.，取得直接商业银行牌照，因而能以低成本存款融资，并绕开抽取费用的银行即服务中介，开展纵向整合贷款 [CV002, CV003]。2025 年 9
              月，Kapital 通过由 Tribe Capital 和 Pelion Ventures 领投、最高 $100M 的 Series C 将估值翻倍至 $1.3B [CV001, CV004]。进入 2026
              年后，运营势头加快：公司报告上半年净利润约 $50M，存款超过 $3.5B，贷款组合超过 $1.7B，同时效率比率为 34.9%、不良贷款率为 2.86% [CV005,
              CV006]。但反方论点在于资产负债表杠杆极高、私人市场对债务优先级不透明，以及暴露于墨西哥信贷周期 [CV007]。因此，估值立场为合理，投资建议为中等置信度下持续跟踪，直到经审计的监管申报确认信贷表现可持续
              [CV001, CV005, CV008]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
