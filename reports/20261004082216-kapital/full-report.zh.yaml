            body: >-
              Kapital 的运营成本主要来自存款和信贷额度利息支出，同时还包括信贷损失拨备、监管合规和计算平台开销。2023 至 2026 年间，Kapital 连续完成股权与债务混合融资，最终在 2026 年 9 月由
              Tru Arrow Partners 与 Fasanara Capital 联合领投 $125 million 成长融资；此前 2025 年 9 月 Series C 估值为 $1.3
