      - - 论点：牌照优势
        - 持有 Banco Autofin 可获得完整商业银行牌照，消除 BaaS 中间商利润空间，并锁定低成本存款。
        - H1 2026 存款达到 $3.5B，支撑 $1.7B 贷款组合，同时保持较高运营效率。
        - 监管处罚、CNBV 资本充足率问题，或存款逃回墨西哥一级商业银行。
      - - 论点：AI 运营杠杆
        - 自研 AI 承保与现金管理自动化风险评估，使效率比率保持在较低的 34.9%。
        - H1 2026 净利润达到 $50M，贷款规模同比增长 220%。
        - 效率比率恶化至 50% 以上，或客户基础扩大后无法维持低获客成本。
      - - 反论点：信用风险
        - 拉丁美洲 SME 商业借款人高度容易受到宏观经济下行与汇率波动冲击。
        - 在贷款组合快速扩张 220% 的同时，H1 2026 NPL 比率为 2.86%。
        - 经过完整 24 个月信用周期的账龄表现显示，NPL 仍低于 3.0%。
      - - 反论点：资本优先级
        - 大量债务融资与结构化信贷展期，使普通股面临显著的清算优先权悬置。
        - 2026 年 9 月的 $125M 融资轮包含 Fasanara Capital 债务；此前轮次还包括 $125M 和 $45M 债务。
        - 将昂贵的夹层债务再融资为低成本优先级企业存款，或进行干净的股权资本重组。
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
  - id: TV003
    title: 情景估值分析
    notes: 在 24 个月周期内估算估值区间、运营假设与概率信号的投资评估情景。
    columns:
      - 情景
      - 估值区间
      - 运营假设
      - 关键风险与下行触发因素
      - 概率
