      - number: '8.2'
        title: 融资背景、资本结构与可比倍数
        blocks:
          - type: paragraph
            body: >-
              自 2020 年成立以来，Kapital 的资本结构扩展到多批股权和债务融资，累计股权接近 $300M，另有大量机构仓储额度 [CV003, CV004, CV009]。2026 年 9 月，Kapital 完成
              $125M 融资方案，作为 Series C 延伸轮，由 Tru Arrow Partners 和信贷专业机构 Fasanara Capital 联合领投，Cervin Ventures、Niya
              Partners 和 Overlook Capital 参与 [CV006, CV009]。              Fasanara Capital
              的加入以及混合股债工具表明，表面融资额中相当部分是高级信贷额度而非纯增长股权，这会给普通股股东造成结构性清算悬垂 [CV007, CV009]。相对估值基准显示，私人新银行和商业贷款同业的倍数分散度很大：bunq
              以有限报告收入获得 $1.9B 估值，C6 Bank 的估值约为 $5.0B，即过去收入的 3.0x [CV004]。PicPay 等新兴市场上市银行的 EV/收入为
              0.4x，而盈利型区域商业银行特许经营业务约为收入的 1.0x 至 2.5x [CV004]。若按 $1.3B 估值对应 2026 年上半年年化净利润运行率 $100M（隐含约 13x
              P/E），只有当信贷损失拨备维持在 3.0% 以下时，Kapital 的估值才显得合理 [CV004, CV005, CV006]。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
      - number: '8.3'
        title: 情景分析、下行情景终止标准与尽调路径
        blocks:
          - type: paragraph
            body: >-
              评估 Kapital 时，必须围绕经营杠杆和信贷质量，测算乐观、基准、悲观三种情景下的不对称结果 [CV005, CV008, CV010]。在乐观情景中，Kapital 成功利用自有 AI
              模型和银行牌照，扩大墨西哥与美国之间的 SMB 跨境支付业务，推动年净利润接近 $150M，并通过美国或墨西哥 IPO 实现 $2.2B 至 $2.8B 的退出估值 [CV006,
              CV011]。基准情景假设贷款增长放缓至可持续水平、净利率趋稳，公司足以支撑当前 $1.3B 至 $1.6B 的估值 [CV001, CV004, CV005]。反之，悲观情景计入墨西哥宏观经济放缓、NPL 升至
              5.0% 以上，以及仓储贷款机构收紧授信额度；在一轮下调估值的重组中，股权价值压缩至约 $600M 至 $800M [CV005, CV007, CV012]。投资人还必须防止把 Kapital 与阿塞拜疆的
              OJSC Kapital Bank 混为一谈；后者是完全无关的机构，资产为 13.3B AZN、净利润为 222M AZN，其数据经常污染算法驱动的私募市场筛选结果
              [CV013]。核心论点的破坏性触发因素包括墨西哥银行监管机构采取监管执法行动、NPL 突破 4.5%，或高级债务契约被触发 [CV007, CV012]。
            claimRefs:
