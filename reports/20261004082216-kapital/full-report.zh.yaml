        - 贷款规模扩张至 $3.0B 以上；年净利润超过 $150M；跨境美国通道快速扩大。
        - 美国扩张执行受阻；跨境支付通道面临监管摩擦。
        - 25%
      - - 基准情景
        - $1.3B - $1.6B
        - 贷款增长放缓至 25-35%；净利润稳定在 $100M-$110M 左右；NPL 维持在约 3.0%。
        - 区域金融科技公司（Nubank、Clara）及墨西哥现有银行带来竞争性利润率压缩。
        - 55%
