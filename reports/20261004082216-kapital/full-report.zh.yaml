      - number: '7.3'
        title: 信贷损失敞口、交易对手依赖与货币波动
        blocks:
          - type: paragraph
            body: >-
              Kapital 的商业模式高度暴露于商业信贷承销以及拉美新兴市场的宏观波动 [CR003, CR008]。历史上约 60% 的收入来自资产负债表贷款和营运资金信贷额度，因此区域宏观下行会直接伤害贷款组合表现
              [CR001, CR008]。Kapital 报告的不良贷款率（IMOR）平均为 2.9%，贷款损失覆盖率（ICOR）为 1.4x，资本充足率（ICAP）为 13.1%；但如果自动化 AI
              评分模型在信贷收缩时错误定价风险，快速扩表可能压低信用质量 [CR008]。此外，严重的外汇波动——例如哥伦比亚比索历史上在每美元 3,200 至 5,000
              之间波动——会带来双向风险：以贬值本币赚取收入的借款人在偿还美元债务时违约风险上升，而 Kapital 的跨境稳定币（USDC）资金管理服务则使业务暴露于数字资产交易对手和清算稳定性风险 [CR003,
              CR009]。
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR009
