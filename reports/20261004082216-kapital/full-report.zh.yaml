  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构、服务定义与企业工作流
        blocks:
          - type: paragraph
            body: >-
              Kapital 提供云原生金融运营平台，面向拉丁美洲及跨境商业走廊中 SMB 的现金管理、支付执行和营运资金需求 [CE001]。Kapital 并非依赖第三方赞助银行的表层软件层，而是以收购 Banco
              Autofin Mexico S.A. 获得的完整商业银行牌照为支点，运营一体化计算型银行环境 [CE002, CE003]。面向客户的工作流把最低开户余额从 $1,000 MXN
              起的企业银行账户、数字借记卡、企业信用额度、本地实时 SPEI 自动清算，以及支持 Apple Pay 等设备级生物识别的移动支出管理整合起来
              [CE004]。平台把支付、费用审批、发票结算和融资集中在一个运营门户内，为 SMB 经营者提供过去只有配备专门资金部门的大型跨国企业才能获得的自动化财务可见性和现金流智能 [CE001, CE005]。
