  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 审慎银行监管、监管审查与法律架构
        blocks:
          - type: paragraph
            body: >-
              Kapital 在整合 Banco Autofin Mexico S.A. 后以持牌金融控股公司（Grupo Financiero）运营，监管属性由轻监管的软件供应商转变为严格受监管的吸收存款机构
              [CR001]。在墨西哥，公司接受 Comisión Nacional Bancaria y de Valores（CNBV）和 Banco de
              México（Banxico）的直接审慎监管，必须遵守严格的资本充足性规则、法定准备金要求和反洗钱（AML/KYC）合规框架 [CR001, CR002]。评级机构也反映了这种运营和监管复杂性：Moody's
              Local México 曾给予 A-.mx 长期存款评级，但在收购 Intercam 资产后将展望调整为“Developing”，凸显整合受监管券商、信托和共同基金的监管摩擦
              [CR003]。除墨西哥银行法外，Kapital 扩大哥伦比亚业务并计划进入美国和欧洲，还会面临跨境法律碎片化，需要本地金融牌照、数据保护合规并持续与货币当局保持一致 [CR002, CR004]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
