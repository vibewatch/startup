    title: "Regulated Banking License Moat"
    body: "Unlike typical neo-banking fintechs that rely on third-party sponsor banks, Kapital's direct ownership of Banco Autofin Mexico provides full regulatory control, access to low-cost deposits, and native control over clearing and payment rails [CO004, CO005]."
    claimRefs:
      - "CO004"
      - "CO005"
  - calloutType: "risk"
    title: "Identity Confusion with Unrelated Sovereign Entities"
    body: "Extensive confusion exists across financial data vendors between Kapital (Mexico/US fintech) and OJSC Kapital Bank (Azerbaijan). Investors must rigorously isolate corporate filings to avoid conflating unrelated balance sheets and sovereign risks [CO012]."
    claimRefs:
      - "CO012"
