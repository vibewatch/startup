company:
  name: "Kapital"
chapter:
  number: 3
  title: "Competitors"
  summary: "Kapital publicly presents a broad, integrated SMB finance stack spanning banking, credit, investment, foreign exchange, cards, payments, and treasury workflows. The assigned evidence supports that product breadth and the strategic significance of owning banking infrastructure, but it does not support a named-peer ranking, current cross-vendor pricing comparison, or independently verified moat claim."
sections:
  - id: "landscape-and-boundary"
    title: "Competitive Landscape and Evidence Boundary"
    body: >-
      The defensible competitive set is broader than digital lenders alone because Kapital combines
      transaction accounts, cards, payments, credit, investment products, and foreign exchange in one
      proposition. Buyers can therefore compare it with incumbent banks, specialized card or expense
      tools, non-bank lenders, internal finance operations, or a multi-provider status quo. The supplied
      evidence, however, profiles Kapital far better than any of those alternatives: no retained source
      names a relevant direct peer and documents that peer's scale, funding, target segment, and product
      limitations. Two search results also refer to unrelated businesses using the Kapital name—an
      Azerbaijani retail bank and a Luxembourg private-markets administrator—and must be excluded rather
      than misclassified as direct competitors. The resulting landscape is a category map, not an
      exhaustive peer league table.
    claimRefs:
      - "CP001"
      - "CP006"
      - "CP007"
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP015"
    tableRefs:
      - "TP001"
  - id: "capability-and-packaging"
    title: "Capability and Packaging Comparison"
    body: >-
      Kapital's own site advertises banking, credit, investment, and foreign-exchange products, while
      third-party marketplace descriptions add corporate cards, local transfers, expense management,
      bill pay, payroll, supplier payments, and cash-flow-informed revolving credit. Together these
      sources support breadth, but not feature parity or superiority against a named rival. The only
      specific public commercial term in the retained evidence is an 8.50% gross annual promotional PRLV
      rate calculated on a MXN 1,000–49,999.99 investment range and explicitly valid only through
      September 30, 2026—before this report's October 4 run date. It is therefore historical promotional
      evidence, not current pricing. Competitor subscription fees, interest rates, credit limits,
      discounts, service levels, and contract terms remain unknown and should not be inferred from
      category norms.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP015"
    tableRefs:
      - "TP002"
      - "TP003"
  - id: "integration-and-moat"
    title: "Integration, Switching Friction, and Moat Durability"
    body: >-
      The clearest potential differentiator is vertical integration. TechCrunch reported Kapital's 2023
      acquisition of Banco Autofin Mexico, and a later company-issued release described the business as
      combining a banking license with proprietary software. An integrated account, payment, payroll,
      supplier-payment, card, and lending workflow could create switching friction because replacing the
      provider may require migrating several operating processes at once. That is an analytical
      inference, not observed retention evidence. The same company release claims that infrastructure
      ownership produces higher margins, longer customer lifetimes, and lower loss ratios than fintechs
      without licenses, but the assigned pool contains no independent benchmark, cohort data, loss-rate
      comparison, or win/loss record to verify those assertions. Multi-homing and incumbent distribution
      power consequently remain material, unresolved displacement risks.
    claimRefs:
      - "CP004"
      - "CP009"
      - "CP010"
      - "CP014"
      - "CP016"
    figureRefs:
      - "FP001"
  - id: "competitive-verdict"
    title: "Competitive Verdict and Diligence Priorities"
    body: >-
      The evidence supports a credible breadth thesis but not a durable-moat conclusion. Kapital reported
      substantial expansion—from 80,000 small-business customers in three Latin American countries in
      2023 to a company-claimed 300,000 customers and a $3 billion balance sheet by the 2025 Series C—but
      those figures do not reveal primary-account penetration, wallet share, churn, realized pricing, or
      risk-adjusted lending performance. The key underwriting question is whether integrated regulated
      infrastructure makes Kapital the customer's primary financial operating layer or merely one more
      account in a multi-homed stack. Management should provide a named competitive set, lost-deal
      reasons, cohort retention by product count, product-level contribution margins, credit-vintage
      losses, and current price sheets. Until those data are available, competitive advantage should be
      treated as plausible but unverified.
    claimRefs:
      - "CP003"
      - "CP005"
      - "CP014"
      - "CP015"
      - "CP016"
