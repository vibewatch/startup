callouts:
  - calloutType: "insight"
    title: "Strategic Impact of Bank Acquisition on Customer Acquisition Economics"
    body: "Kapital's acquisition of Banco Autofin Mexico S.A. fundamentally reshaped its customer acquisition dynamics. By acquiring an established banking institution with 65,000 accounts and a full commercial license, Kapital bypassed the multi-year regulatory ramp and exorbitant marketing costs typically required for standalone fintechs to aggregate deposits [CU001, CU002]. This dual infrastructure enables Kapital to offer lower cost of capital and higher deposit yields directly to SMB customers without paying intermediation spreads to third-party sponsor banks [CU001, CU004]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
  - calloutType: "risk"
    title: "Customer Retention and Cohort Performance Opacity"
    body: "While Kapital has demonstrated rapid customer scaling to over 300,000 accounts, the absence of public cohort-level churn, net revenue retention (NRR), and loan default data poses an investment diligence risk [CU002, CU008, CU009]. In Latin American SMB lending, small business insolvency rates can rise sharply during macroeconomic contraction. Investors must independently audit whether customer expansion reflects enduring multi-product platform lock-in or transient single-feature usage [CU008, CU009]."
    claimRefs:
      - "CU002"
      - "CU008"
      - "CU009"
