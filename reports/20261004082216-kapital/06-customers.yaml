chapter:
  number: 6
  title: "Customers"
  summary: "Kapital serves small and medium-sized businesses across Mexico, Colombia, and the United States, expanding from 80,000 SMB customers in 2023 to more than 300,000 active client accounts following its acquisition of Banco Autofin Mexico S.A. and AI-enabled platform expansion. While customer adoption is driven by unmet demand for formal banking and automated cash visibility, customer retention and concentration metrics remain guarded private figures requiring rigorous cohort and deposit-stickiness diligence."
sections:
  - id: "customer-segmentation-and-targeting"
    title: "Customer Base Segmentation, Target Verticals, and Value Propositions"
    body: "Kapital directs its financial technology and banking services toward underserved commercial segments across Latin America, specifically focusing on micro, small, and mid-sized enterprises (SMBs) in Mexico and Colombia that lack adequate credit access from traditional commercial banking institutions [CU001, CU002]. The enterprise customer base is segmented into three primary operating tiers: owner-operated small enterprises seeking working capital and instant automated cash visibility; emerging mid-market corporations requiring multi-currency treasury orchestration, expense management, and payroll distribution; and retail depositors utilizing yield-bearing promissory notes [CU001, CU003, CU004]. Traditional banking institutions in Mexico historically restrict total bank credit to only 10.5% of small businesses despite SMBs representing 90% of operating businesses, positioning Kapital's integrated banking and software ecosystem to capture high-margin commercial treasury and lending relationships [CU001, CU005]. Value realization across customer cohorts is anchored by automated cash flow visibility, predictive analytics for vendor selection, and integrated corporate payment rails that eliminate manual reconciliation [CU001, CU006]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-scale"
    title: "Customer Adoption Trajectory, Account Growth, and Platform Velocity"
    body: "The adoption trajectory of Kapital's platform demonstrates significant expansion in active customer accounts and platform balance sheet scale across its core regional jurisdictions [CU001, CU002]. During 2023, Kapital reported expanding its customer base to 80,000 small businesses operating across Mexico, Colombia, and Peru [CU001]. Growth was substantially accelerated in September 2023 via the strategic acquisition of Banco Autofin Mexico S.A., which integrated an established base of 65,000 existing banking clients directly into Kapital's technology stack [CU001]. By September 2025, public company disclosures reported that Kapital's platform scale had extended to over 300,000 customers across Mexico, Colombia, and the United States, supporting a platform balance sheet of $3 billion [CU002]. This rapid customer acquisition reflects strong commercial demand for integrated corporate cards, instant SPEI settlement, and AI-underwritten working capital credit facilities across Latin American enterprise corridors [CU001, CU002, CU007]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "customer-retention-and-concentration-risks"
    title: "Retention Durability, Client Concentration, and Adverse Diligence Realities"
    body: "Despite reported customer top-line scale, independent verification reveals substantive information gaps regarding customer retention, net revenue retention (NRR), churn rates, and borrower concentration [CU008, CU009]. Kapital operates as a privately held financial technology institution and does not publicly publish audited cohort renewal rates, gross revenue retention, or single-obligor loan concentrations, leaving customer durability open to diligence scrutiny [CU008, CU009]. Furthermore, high nominal customer counts bundle transactional debit card users and retail depositors with full-suite commercial treasury borrowers, obscuring the economic concentration of loan book assets [CU001, CU002, CU004]. Adverse naming ambiguity represents an additional diligence hazard: public filings for Azerbaijan's OJSC Kapital Bank—which reported 6 billion AZN in customer loans and 10 billion AZN in customer deposits in 2026 under PASHA Holding—are frequently conflated with Mexico's Kapital, requiring strict corporate disambiguation during institutional credit and risk assessments [CU010, CU011]. Diligence must also distinguish unrelated corporate entities such as US IT staffing firm Kapital Data Corp from Kapital's Latin American commercial banking operations [CU012]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
