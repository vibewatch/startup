callouts:
  - calloutType: "risk"
    title: "Post-Acquisition Integration and Rating Outlook Vulnerability"
    body: "The acquisition of Intercam's brokerage, mutual funds, and operational banking assets fundamentally transforms Kapital into a Grupo Financiero, but introduces severe operational complexity across 180,000 new accounts and 1,900 trusts. Moody's Local México placed Kapital's A-.mx rating on 'Developing' outlook specifically due to integration uncertainty, requiring active capital monitoring despite a $100M support commitment [CR003]."
    claimRefs:
      - "CR001"
      - "CR003"
  - calloutType: "recommendation"
    title: "Underwriting Diligence Requirements on Loan Book Vintage and Reserve Coverage"
    body: "Prospective investors and debt syndicates must bypass aggregate balance sheet marketing figures and independently audit vintage non-performing loan ratios (IMOR), loan loss coverage (ICOR), and specific capital adequacy reserves (ICAP) against historical LatAm credit cycle stress tests before extending further capital [CR008, CR012]."
    claimRefs:
      - "CR008"
      - "CR012"
