- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited revenue by stream
    - Cannot judge revenue quality or concentration
    - Request audited 2025 and YTD 2026 revenue broken down by direct systems, partner programs, development work, and sustainment
  - - Gross margin by product family
    - Cannot assess whether volume improves economics or magnifies loss-making production
    - Request product-line contribution margin and warranty / rework experience
  - - Cash on hand and monthly burn
    - Cannot estimate runway or financing urgency
    - Request cash bridge, monthly burn, and financing plan through 2027
  - - Backlog and bookings
    - Cannot separate interest from contracted demand
    - Request signed backlog, bookings, and cancellation rights by customer
  - - Working-capital terms
    - Cannot model inventory risk or payment timing
    - Request inventory build plan, milestone payments, receivable terms, and supplier prepayments
  - - Debt, convertibles, and covenant detail
    - Cannot understand true balance-sheet risk or downside waterfall
    - Request credit agreements, loan schedules, and convertible instrument terms
