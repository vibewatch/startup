    - Plausible but not publicly quantified
    - 'Medium: products clearly exist, revenue not disclosed'
    - Request signed order book by product family and customer
  - - Partner / JV production revenue
    - Revenue through Rheinmetall JV, consortium, or partner-mediated manufacturing
    - Programs / deliveries
    - Emerging; public positioning stronger than booked economics
    - Low to medium
    - Clarify profit split, timing, and which entity books revenue
  - - Development / prototyping / industrialisation work
    - Paid trials, qualification work, or customer-funded development
    - Milestone payments
    - Possible but not publicly separated
    - Low
