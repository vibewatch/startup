  - - Autonomy / subsystem monetization
    - Seekers, AI, navigation, or integration layers sold with systems or separately
    - Program line items
    - Strategically important, monetization structure undisclosed
    - Low
    - Ask whether software and subsystem revenue are separately priced
  - - Training / maintenance / sustainment
    - After-sale support and operator enablement
    - Support contracts
    - Likely relevant but not publicly disclosed
    - Low
    - Request sustainment attach rates and service-margin data
  - - Future commercial / hypersonic revenue
    - Long-term optionality outside current defense core
    - Program or product revenue
    - Not a near-term public revenue driver
    - Low
    - Do not underwrite until a concrete commercial program and customer set exist
  notes: The table distinguishes mechanisms the business plausibly monetizes from metrics that are actually disclosed. Public evidence is much stronger on the existence of product lines than on realized revenue by stream.
