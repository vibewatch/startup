companyProfile:
  summary: Destinus is a private European defense and aerospace company founded in 2021 by Mikhail Kokorich. The company started with a hydrogen-hypersonic transport vision but has pivoted toward nearer-term defense demand, now positioning itself as a supplier of interceptors, deep-strike and saturation systems, propulsion subsystems, and autonomy-enabled air vehicles sold through government and prime-contractor channels. Public evidence shows a Netherlands-based headquarters, fast hiring, serious partners, and named Spanish military evaluation proof, but the economics and governance disclosures still lag the ambition of the commercial narrative.
  founders:
    - name: Mikhail Kokorich
      role: Founder
      background: Serial space entrepreneur previously linked to Dauria Space, Astro Digital, and Momentus; his later SEC/Momentus history remains a live governance diligence factor.
      claimRefs: [CO007, CO016, CR001, CR004]
  foundingLocation: null
  headquarters: Netherlands
  productSummary: Portfolio spans interceptors, deep-strike and saturation systems, propulsion, and related autonomy-enabled defense-air platforms, including Ruta Block 3 at up to 2,000 km range.
  customerFocus: NATO and allied militaries, defense ministries, and prime contractors rather than near-term commercial aviation buyers.
  businessModel: Business-to-government and business-to-prime defense supply, with partner-mediated qualification, manufacturing, and route-to-market channels.
  stage: Private / growth
  fundingStatus: Nearly €400M of disclosed capital by December 2025, plus a €50M Commerzbank facility and a reported 2026 pre-IPO fundraising push at a valuation above €5B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO007, CO008, CO010, CO019, CO041, CE007, CU001, CU003, CU008, CR004, CI014, CI027, CV001]
