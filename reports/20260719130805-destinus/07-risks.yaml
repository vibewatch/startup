    - Licence or classification delays
    - Any material program blocked or delayed by licensing / sanctions decisions
    - Revise revenue timing and customer-expansion assumptions downward
  - - Qualification risk
    - Program milestones slip
    - Failed or delayed qualification beyond management plan for core products
    - Lower deployment assumptions and require independent test evidence
  - - Partner concentration
    - Counterparty disengagement or slowed integration
    - Rheinmetall, Diehl, Shield, Quantum, or TNO materially slow or change terms
