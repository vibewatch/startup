  - - Security / geopolitical risk
    - Operational incident or customer confidence shock
    - Site disruption, credible cyber event, or customer pause tied to threat environment
    - Increase discount rate and demand continuity proof
  - - Financing dependency
    - Next financing step weakens or slips
    - Inability to close targeted capital or materially worse-than-expected financing terms
    - Treat as major valuation and survival risk
