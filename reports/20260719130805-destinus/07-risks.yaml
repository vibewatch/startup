- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: |-
    Destinus is not without mitigations. Official Dutch licensing frameworks provide a formal compliance path; ISO 9001 offers a baseline quality system; Rheinmetall and other partners provide industrial and channel support; and management has at least publicly signaled active security monitoring after hostile public references. Those are meaningful protections. But they are best understood as framework mitigations rather than proof that the hardest issues are already solved.

    The right monitoring stance is therefore thesis-break oriented. Watch for qualification slippage, failure to close the next financing step, visible partner disengagement, security incidents that affect operations or customer confidence, or evidence that high-profile evaluations fail to convert into funded programs. Also watch for governance signals: changes in founder role, extra compliance undertakings, or disclosure friction if the company moves closer to a public listing.

    The diligence ask is straightforward even if the answers may not be. Investors need export-licence and end-user matrices, program-level reliability and sustainment data, customer concentration and order-book quality, partner-governance terms, and a clear view of who controls the company if public-market or national-security scrutiny intensifies. Without those, the risk stack can only be approximated, not underwritten.
