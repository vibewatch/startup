  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: export-licensing-matrix
    missingEvidence: Product-by-product export classification, licence status, customer-country permissions, denied destinations, and technical-assistance controls.
    whyItMatters: Growth cannot be underwritten if the shipment and support path is unknown for core systems.
    diligencePath: Request export-control matrix by product family, destination, service type, and current licence state.
    relatedQuestionRefs:
    - QR006
    - QR007
    - QR008
    - QR028
    relatedTableRefs:
    - TR001
    - TR003
  - type: private-evidence-only
    severity: material
    topic: qualification-and-reliability
    missingEvidence: Independent test results, qualification schedules, acceptance status, mission reliability, sustainment burden, and product failure data.
    whyItMatters: Without it, neither customer conversion nor operational trust can be judged rigorously.
    diligencePath: Request qualification matrix, live test reports, reliability-growth curves, and sustainment metrics for every major system.
    relatedQuestionRefs:
    - QR012
    - QR024
    - QR027
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: security-and-continuity
    missingEvidence: Physical-security controls, cyber incidents, insurance changes, continuity planning, and customer communications after hostile public references.
    whyItMatters: A high-visibility defense manufacturer can suffer commercial harm before a direct attack ever lands.
    diligencePath: Request security governance, incident log, business continuity plan, and site-risk review across all major locations.
    relatedQuestionRefs:
    - QR009
    - QR010
    - QR023
    - QR029
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: financing-and-concentration
    missingEvidence: Customer concentration, partner-attributed pipeline, backlog quality, cash runway, and downside scenarios if core channels slip.
    whyItMatters: The business can look well-funded and still be fragile if orders, cash timing, and concentration are poorly understood.
    diligencePath: Request pipeline ownership by channel, backlog and bookings, top-customer exposure, runway model, and financing contingency plan.
