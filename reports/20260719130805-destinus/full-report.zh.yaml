  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              承保 Destinus 应放在防务采购市场里，而不是投机性的民用高超音速航空。公司 2026
              年官方定位很明确：它自称欧洲防务制造商，聚焦为欧洲和盟军提供可规模化的打击与防空系统。产品页把这一定位映射到具体任务类别：Kryla 用于分布式饱和打击，Hornet Block 1 用于反 UAS
              和防空拦截，Ruta Block 2 用于远程精确打击，Ruta Block 3 和 Bliksem EXO
              等新项目则延伸到更深层打击和高层导弹防御邻近领域。这意味着相关支出池是防务系统预算、弹药和拦截器补库、自主软件、导引头、发射架构、产能和保障，而不是广义商业航天或消费级无人机需求。


              边界重要，因为 Destinus 现在跨越不止一个产品小众。TNO 雷达导引头合资项目、Shield AI 自主合作、Quantum Systems
              侦察打击合作都显示，公司不只卖单一空中平台，而是试图在子系统、任务软件和联盟集成中捕获价值。落到实践，Destinus 竞争的场景是：武装力量需要可负担、可补充的系统，能在 GNSS
              退化、电子战密集环境中生存，并能在欧洲按工业节奏制造。


              因此，现状替代品是军事和制度性选项，不是民用方案。Hornet 与成本更高的拦截器和近程防空选项竞争，也与技术含量较低的反无人机方案竞争。Ruta
              家族系统与有人打击飞机、火箭炮和导弹库存，以及主承包商既有远程打击方案竞争。Bliksem 与 TNO 相关工作争夺欧洲导弹防御和传感器链建设的一部分份额。一个有用的心智模型是：Destinus
              追逐的是欧洲重整军备堆栈中的多个环节——打击、防空、自主和工业补库——而不是一个边界整齐的无人机类别。
