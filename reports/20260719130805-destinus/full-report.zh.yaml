companyProfile:
  summary: >-
    Destinus 是一家欧洲私营防务与航空航天公司，由 Mikhail Kokorich 于 2021
    年创立。公司最初押注氢动力高超音速运输愿景，但已转向更近端防务需求，现在把自己定位为拦截器、纵深打击和饱和系统、推进子系统，以及带自主能力的空中平台供应商，通过政府和主承包商渠道销售。公开证据显示，公司总部在荷兰，招聘很快，有分量的合作伙伴，并拿出西班牙军方具名评估验证，但经济性和治理披露仍跟不上商业叙事的雄心。
