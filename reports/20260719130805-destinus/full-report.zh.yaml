      - number: '8.2'
        title: 可比公司组与估值框架
        blocks:
          - type: paragraph
            body: >-
              对 Destinus 最干净的公开估值框架，是用国防科技可比公司搭一座销售倍数桥，再用私营独角兽估值做现实校验。成熟上市国防和无人系统公司远低于最亢奋的私营国防异常值。用当前公开市值快照对照已披露 2025
              年收入，Kratos 看起来约为 6.4x 销售额，AeroVironment 约为 8.7x。Rheinmetall
              虽是大型存量玩家，但按这里可得的粗略公开数字，也处在高个位数销售倍数附近。这些锚有用，因为它们代表真实公开市场在消化真实收入、利润率和项目风险。


              溢价端，私营国防科技异常值交易更贵。StockAnalysis 和 CNBC 显示，Anduril 估值约 $61 billion，对应约 $2.2 billion 的 2025 年收入，隐含约 27.7x
              销售额。Shield AI 的 $12.7 billion 估值和 Quantum Systems 的 $8 billion 投后估值表明，自主能力和主权无人机叙事可以承载异常高的私募市场溢价，尤其是在 2026
              年国防融资环境中。但这些溢价不是免费的可比项。Anduril 收入规模大得多，合同密度更强，公开扩张观感也更干净。Shield 和 Quantum 也代表偏自主能力或平台网络的叙事，市场给它们的奖励可能不同于
              Destinus 混合导弹、拦截器、推进和工业化的栈。


              结论是，Destinus 默认既不应拿最低的上市公司倍数，也不应拿最高的私营国防溢价。正确框架是一个宽区间，中心取决于公司实际能拿出什么证据，而不是只看板块狂热。
