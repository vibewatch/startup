      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是混合的。Destinus 看起来有能力产生有意义的防务收入，并在短期内为持续增长融资。它的产品组合、合作伙伴、工业里程碑和融资记录都足够实在，不应被贴上“只有
              PowerPoint”的标签。但从投资人角度看，业务在区分动人防务增长故事与资本黑洞的变量上仍披露不足：收入构成、已实现定价、利润率、在手订单质量、烧钱速度和现金转化。


              可比对象也有两面性。Kratos 说明，即便承包商在增长，若先于授标建设库存和产能，也可能烧钱。AeroVironment
              说明，更成熟的防务科技公司可以交出强订单和在手订单，但仍暴露于利润率波动、整合风险和政府采购依赖。MBDA 则展示既有导弹主承包商背后巨大的资本规模和工业深度。Destinus
              处在这条曲线更早的位置，意味着增长可能更快，也意味着还不能像已经拥有主承包商式韧性那样被承保。


              底线是：公开证据支持其雄心和部分工业验证，但不能清晰看见收入质量或单位经济性。在管理层披露由合同背书的收入、在手订单和现金烧钱指标、把当前规模故事变成财务上具体可审之前，后续章节应假设公司仍会依赖融资。
