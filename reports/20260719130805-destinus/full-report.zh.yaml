      - number: '1.4'
        title: 里程碑、工业化与反向信号
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年的里程碑记录解释了为什么 Destinus 现在被当作一家严肃的欧洲防务公司，而不只是投机性机体初创公司。2025 年 3 月，它收购 Aerialtronics 的资产、人才和
              IP，加深荷兰无人机能力。2025 年 8 月，它同意以 CHF 180 million（约 $225 million）收购 Daedalean，大幅补强 AI、感知和自主深度。到 2025 年 11
              月，公司宣布与 Shield AI 达成战略合作，在 Ruta 和 Hornet 平台集成 Hivemind；2026 年 3 月，双方公开披露在 Segovia 完成两个月 Hornet 集成飞行活动。2026
              年 4 月，Destinus 报告 Ruta Block 2 测试里程碑，并宣布与 Quantum Systems 达成侦察打击合作。2026 年 6 月，它宣布第 1,000 台自研 T150
              涡喷发动机下线、西班牙海军从 F-81 Santa María 护卫舰发射 Hornet、以及 TNO 雷达导引头合资项目。到 2026 年 7 月，Destinus 又通过 Bliksem EXO
              意向书进入联盟规模导弹防御，同行包括 Airbus、MBDA Deutschland、Safran、Thales 等。


              这些里程碑重要，因为硬件、自主、工业化和机构关系被串到一起。最强信号不是某个耀眼原型，而是一种模式：集装箱化打击系统、自研推进、外部自主集成、欧洲主承包商合作，以及贴近客户的军事测试。即便部分主张——尤其是乌克兰部署数量或精确月产能——仍难独立审计，公司显然已远远越过
              PowerPoint 阶段。


              反向信号同样重要。创始人治理历史很实质，董事会和股权结构表条款仍不透明；在“近期公开提及”之后，公司还不得不于 2026 年 4 月发布声明，同时 NL Times
              报道称，在欧洲加大对乌克兰无人机支持之后，Destinus 出现在俄罗斯潜在目标名单上。这不能证明运营已受扰动，但说明 Destinus
              已处在真实地缘政治升级回路中。因此，投资人应把公司视为确有工业和客户势能，但也已经进入需要机构级尽调的地缘政治、监管和治理审查层级。
