      - number: '6.3'
        title: 持续性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              公开的持续性证据很弱。审阅来源没有披露客户数、已部署单位数、续约率、合同期限、复购行为或满意度指标。这在国防领域并不罕见，但会实质改变对牵引的解读。公开记录展示的不是广泛、稳固的装机基础，而是一组窄但质量高的军事评估，以及更宽的合作伙伴中介扩张路径。因此，采用轨迹只能通过代理信号读出来：更多具名野外评估、更多合作伙伴集成、更多工业化公告，以及更多文档、合规、工程和制造岗位招聘。


              扩张潜力真实存在。西班牙看起来是最清晰的近期滩头阵地，因为陆军和海军评估界面都已公开。Rheinmetall 合资企业通过德国工业资格认证和系列化生产，把故事拓向 NATO 和 EU 成员国市场。Quantum
              和 Diehl 创造相邻渠道入口：一个通过侦察和 C2 工作流，另一个通过现有分层防空架构。但同样的结构也带来集中度风险。如果少数部委、军种或主承包商放慢资格认证，或选择替代效应器，Destinus
              可见客户管线可能很快收窄。


              本章核心尽调结论是：Destinus 有可信的早期军事客户证据和合理的扩张逻辑，但公开数据不足以支撑留存、收入集中度或试点后持续性。投资人应把集中度和资格认证风险视为客户故事的核心，而不是边缘情景。
