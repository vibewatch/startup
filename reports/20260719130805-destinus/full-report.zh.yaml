      - number: '5.4'
        title: 信任、质量与合规
        blocks:
          - type: paragraph
            body: >-
              公开的信任和质量证据存在，但不均衡。最清晰披露的控制项是 ISO 9001 认证：质量政策页面链接了 Destinus Energy B.V.、Destinus NL B.V. 和 Destinus Spain
              的证书。这有用，因为它表明关键经营实体都有成文质量管理基线；一家声称要做工业级国防生产的公司需要这样的基线。供应商页面又给出一个运营控制面：潜在供应商有结构化准入路径，也有已公布条款，意味着采购和质量流程不只停留在内部工程环节。


              缺口在于，ISO 9001
              不等于产品可靠性证明，也不等于国防资格认证证明。本次审阅的公开材料没有披露平均故障间隔时间、拦截成功率、导引头性能包线、网络保障认证、出口许可证状态，或自主软件保障证据。Rheinmetall 2026 年 6
              月发布称目标是让 Ruta Block 3 获得 NATO 资格认证，方向上是正面的，但目标不是已完成认证。同样，Shield AI
              围绕可追溯性、可靠性和可治理性的表述有助于自主能力叙事，却仍是合作伙伴语言，不是 Destinus 系统已披露的项目级保障包。


              尽调中更诚实的结论是：信任故事在流程层面可信，在产品保障层面披露不足。买方可能会因为公司有质量体系和产业合作伙伴而更安心；投资人仍应按产品族索取正式资格认证证据、可靠性测试、软件保障文档和出口管制治理材料。
