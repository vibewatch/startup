      - number: '1.2'
        title: 领导层、治理与创始人历史
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露以创始人为中心。官方公司声明仍把 Mikhail Kokorich 称为创始人兼 CEO，其他具名高管主要出现在与运营领域绑定的新闻稿引语中：Tim Moser 为集团 CTO，Sidney
              Berndt 为首席制造官，Wouter Van Beek 为首席商务官。这能让人相信产品、制造和商业职能已有负责人，但公开记录对董事会构成、独立董事、委员会架构和最终受益所有权披露很薄。基于登记资料的
              Destinus Group B.V. 荷兰公司档案显示其地址在 Valkenburg，并列出与 2025 年有关的管理条目，但透明度达不到投资人在承保潜在上市前应要求的水平。


              Kokorich 本人既是优势也是风险。独立报道将他描述为连续航天和航空航天创业者，在 2021 年创立 Destinus 之前曾创办 Dauria Space、Astro Digital 和
              Momentus。这段履历说明他能在多个司法辖区反复创立公司、组织资本、推动高技术愿景，也解释了 Destinus 为什么能异常快速地拼出跨国工程团队和战略关系网络。


              反向因素绕不开。SEC 2024 年 11 月 25 日诉讼公告称，最终同意判决解决了以下指控：Kokorich 在 Momentus de-SPAC
              交易前夕，就公司技术、国家安全风险和本人移民身份作出误导性陈述。判决施加 $2 million 民事罚款，并禁止其在五年内担任上市公司高管或董事。法院记录显示，诉讼从 SEC 2021 年起诉延续到 2023
              年驳回 Kokorich 撤诉动议，最终在 2024 年解决。这些内容都没有直接指控 Destinus
              有不当行为，但实质抬高了投资人围绕一家创始人主导、在政治敏感市场运营的防务公司做治理尽调、披露纪律、出口管制审查和 IPO 可信度评估的门槛。
