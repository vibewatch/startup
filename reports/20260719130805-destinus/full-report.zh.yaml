      - number: '2.3'
        title: 买方 / 用户 / 付款方地图与采用路径
        blocks:
          - type: paragraph
            body: >-
              Destinus 卖进的是用户与付款方分离的机构采购系统。Hornet 的终端用户很可能是防空部队、海军舰员和设施防护运营者；Ruta
              家族系统的终端用户是负责远程打击效果的打击规划者和军事单位；自主和导引头子系统的终端用户则是集成更广防务架构的项目办公室和主承包商。但真正付款的是国防部、军备机构或联盟采购载体。这很关键，因为技术上漂亮的演示，只有穿过项目遴选、预算分配、互操作审查和生产资格认证，才会转成收入。


              公开证据点把 Destinus 放在漏斗中段。西班牙海军 Hornet 发射验证了海上部署概念，但还不是正式列装项目授标的证据。Shield AI 集成活动和 Quantum Systems
              合作显示互操作进展和买方相关性，但仍属于规模化采用前证据。TNO 雷达导引头合资和 Bliksem EXO 联盟展示了另一条路径：Destinus
              也可以作为子系统或系统集成玩家，进入具欧洲主权色彩的联盟项目；买方关系在其中由更大的主承包商、政府背书联盟和共同采购结构部分中介。


              SAFE、TED、NATO 和 EDA
              都强化同一点：欧洲防务需求越来越通过正式采购系统、多国合作和互操作要求转化。对一家有可信伙伴的欧洲供应商来说，这在战略上有吸引力，因为主权和工业基础逻辑可以成为顺风。但这也意味着采用节奏更慢，且比风投叙事暗示的更受里程碑约束。投资人应把公开测试、LOI
              和集成公告看作采购站位证据，而不是已披露订单簿的替代品。
