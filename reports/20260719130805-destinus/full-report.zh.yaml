  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量落空
        - 经审计或已签合同的经济性明显低于隐含的 €500M 叙事
        - 打掉乐观情景的倍数支撑，并压缩基准情景
        - 不要支付传闻估值；按悲观 / 基准情景重做测算
      - - 认证延误
        - 核心产品未能按期取得计划批准或里程碑
        - 延缓客户转化，并抬高融资需求
        - 下调上行情景，并提高风险折扣
      - - 合作伙伴渠道恶化
        - Rheinmetall、Diehl、Shield 或 Quantum 路径明显走弱
        - 推向市场路径收窄，去风险程度低于假设
        - 按公开可比公司低端区间重新定价
      - - 治理事件
        - 出现新的披露问题、治理冲突，或涉及创始人的复杂事项
        - 扩大公开市场折扣，并可能推迟退出路径
        - 除非治理重置，否则转为放弃
      - - 融资落空
        - 下一轮融资延期，或定价远低于计划
        - 释放市场怀疑信号，并加大稀释压力
        - 视为重大下行催化剂
      - - 安全 / 地缘政治事件
        - 出现运营中断，或可信的客户信心冲击
        - 抬高连续运营成本，并压缩估值容忍度
        - 提高折现率，并重新评估存续能力
    notes: 这些事件最可能把估值判断从观察推向放弃，或从观察推向主动尽调。
    claimRefs:
      - CV024
      - CV025
      - CV028
      - CV033
      - CV035
      - CV040
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 按收入流、客户和合同类型拆分的经审计收入
        - 没有它，远期销售额测算大多只是叙事
        - 索取经审计的 2025 年和 2026 年至今收入桥
      - - 积压订单与签约订单
        - 已签积压订单、签约订单、取消情况和里程碑排期
        - 决定预测收入是有支撑还是只是愿景
        - 按产品族索取订单簿和管线明细
      - - 客户集中度
        - 头部客户和国家集中度，以及合作伙伴贡献管线
        - 客户基础集中，应给更低倍数
        - 索取集中度表和按渠道拆分的收入占比
      - - 出口 / 认证矩阵
        - 逐产品的许可、批准和客户所在国状态
        - 发货权不确定，收入就无法干净估值
        - 索取合规与认证矩阵
      - - 治理与创始人角色
        - 董事会结构、保留事项、创始人控制权和整改步骤
        - 决定 IPO 准备度和折现率
        - 索取治理文件包和律师备忘录
      - - 优先权 / 稀释包袱
        - 股权结构表、可转债、股东贷款、债务契约和轮次条款
        - 隐藏的优先顺位会大幅改变回报测算
        - 索取完整股权结构表和融资文件
    notes: 这里每个缺失项都会直接改变合理倍数或投资者的下行保护。
    claimRefs:
      - CV028
      - CV032
      - CV034
      - CV039
