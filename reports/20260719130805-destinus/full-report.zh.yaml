chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与产品转向
        blocks:
          - type: paragraph
            body: >-
              2026 年，Destinus
              将自己呈现为一家欧洲防务制造商，聚焦为欧洲及盟军提供可规模化的打击和防空系统。官网首页与关于页面强调“以工业节奏推进防务”、深度垂直整合，以及靠可负担、成本不对称的系统强化欧洲安全和战略自主的使命。这套叙事与
              Destinus 最初的公开身份已经明显不同。独立历史报道和 Sacra 2026 年画像都称，公司 2021
              年创立时围绕氢动力高超音速货运和客运飞机起步；高超音速飞机路线图仍被作为长期愿景讨论，但相较能更快贡献收入和采购牵引的防务 UAV、巡航导弹和自主系统，优先级显然后移。


              当前产品栈已从概念走向具体。Kryla 被描述为分布式饱和巡航系统，载荷 50 kg、射程 800+ km。Hornet Block 1 定位为雷达指示拦截器，面向亚音速空中威胁，射程 75+ km，并能在
              GNSS 受拒环境下自主末段拦截。Ruta Block 2 则作为增程精确打击系统销售，载荷 250 kg、射程 700+
              km，具备贴地突防和集装箱化发射架构。公司还强调子系统、自主、推进和效应器是自研层，而不是单纯依赖供应商。到 2026
              年中，公开帖子显示，这套组合正从宣传册走向可重复的工业化供给，并与批量生产、测试活动和欧洲主承包商合作绑定。


              公开材料能看到的商业模式因此是面向政府和主承包商，而不是商业航空。Destinus
              似乎通过直接防务系统销售、战略合资、技术集成合作，以及可能有合同背书的工业扩产项目变现。官方招聘页也强化了这一点：这是一家防务优先的工业公司，团队分布在荷兰、西班牙、德国、瑞士、法国、乌克兰和英国，不是追逐单一验证机的小型研发实验室。身份问题很重要，因为后续章节应主要按一家快速扩张的欧洲防务平台公司来承保
              Destinus，同时给高超音速留下可选项，而不是反过来。
