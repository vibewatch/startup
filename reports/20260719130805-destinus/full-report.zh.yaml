      - number: '2.2'
        title: 规模测算视角、预算池，以及为什么单一 TAM 会误导
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多视角市场判断，而不是一个单一的总可用市场（TAM）。最宽口径上，SIPRI 称 2025 年全球军费达到 $2.887 trillion，欧洲军费为 $864 billion，29 个欧洲 NATO
              成员国为 $559 billion。NATO 相关需求尤其重要，因为 Destinus 围绕欧洲和盟友客户搭建，公司自己的项目也强调与 NATO 防空和导弹防御概念互操作。再收窄一层，仅德国、西班牙和荷兰在
              2025 年的军费合计就约 $183.1 billion；在考虑其他欧洲买家之前，Destinus 已有相当大的本土区域预算池。


              下一层是项目融资和 R&D 入口。European Commission 的 Readiness 2030 白皮书明确优先支持乌克兰，包括弹药、防空、无人机以及对乌克兰防务工业的直接支持。SAFE
              为成员国紧急防务采购增加最高 €150 billion 的长期贷款，EDF 2026 工作计划则包括高超音速滑翔飞行器行动，以及对 EU 大气层内拦截器的支持。这些资金池不是 Destinus
              收入预测，但它们是高信号证据：欧洲机构正在围绕公司当前运营的正是这些类别开辟资金通道。


              通用无人机市场报告仍有用，但只能当外沿边界。Grand View 估计 2026 年军用无人机市场为 $54.2 billion，Research and Markets 估计较窄的 2026 年防务无人机市场为
              $13.73 billion，StartUs 引用 2030 年军用无人机 $22.81 billion
              前景。这些数字指向同一方向——实质增长——但显然不是一个统一市场定义。承保含义很直接：后续章节应更多依赖支出池、采购信号和项目证据，而不是任何单一 TAM 份额叙事。
