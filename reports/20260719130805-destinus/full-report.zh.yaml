  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方地图与渠道结构
        blocks:
          - type: paragraph
            body: >-
              Destinus 2026
              年公开客户界面压倒性地偏政府和国防工业，而不是商业客户。公司官网、展会复盘和合作伙伴发布一贯把目标客户描述为欧洲及盟国武装力量、其部委和采购组织，以及已经介入采购和资格认证的主承包商。本次来源集中最强的公开买方语言来自
              Eurosatory 2026：Destinus 称与来自欧洲、NATO 及更广地区的部长、参谋长、采购主管和产业伙伴会面。这不能证明已签合同，但清楚显示销售动作瞄准谁。


              同样重要的是，「客户」并不总是单一主体。在这个市场，付款方、使用方和渠道可以拆开。部委或采购机关资助项目；军种和操作员使用系统；Rheinmetall、Diehl
              等主承包商可以成为资格认证和进入市场的渠道；Quantum Systems、Shield AI 等软件或 ISR 伙伴可以让方案更容易嵌入现有指挥结构。因此，Destinus 的客户架构不像直销企业
              SaaS，更像一套国防采购栈，买方、验证者和集成方分层叠加。


              实际含义是，判断客户牵引不能看传统创业指标，如 logo、席位数或自助增长，而要看具名军事评估和合作伙伴背书的渠道入口。公开证据支持这一框架；尚不支持一个多元、直接披露的客户名单。
