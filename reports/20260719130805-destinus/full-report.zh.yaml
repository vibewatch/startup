      - number: '2.4'
        title: 增长驱动、采用约束，以及最重要的变量
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动异常具体。乌克兰战场已经把可消耗规模、快速补库、反无人机防御和抗电子战自主从可选实验变成采购核心问题。NATO 在东翼加强 IAMD 姿态，EU 的 Readiness 2030 和 SAFE
              架构也明确把防务支出、共同采购和支持乌克兰连在一起。与此同时，私人资本继续涌入防务技术，帮助初创公司在政府合同完全跟上之前先为产能融资。换句话说，宏观需求背景真实存在，目前也有利。


              同样重要的是，欧洲主权诉求正在从口号进入采购标准。EDF 页面明确写出控制权和资格规则，Destinus 官方公告也越来越强调欧洲设计主导权、制造能力，以及与 NATO 和盟友系统的互操作。这对 Destinus
              是有意义的战略顺风，因为公司并不是只靠机体新奇取胜；它试图证明欧洲可以用本地掌控的推进、导引头、自主和集成能力，以工业节奏部署打击和防空系统。


              约束也同样真实。采购仍然慢、正式且受里程碑驱动。网络和 EW 韧性不是可选产品功能，而是核心采用门槛。公开市场规模估计仍不一致，很容易高估 TAM。当前防务科技热情也可能跑在合同转化之前：Forbes 明确提出
              2025 年防务独角兽热潮是否是“铁泡沫”，同时指出很多防务初创公司因为资本密集并依赖政府合同，往往要多年才能变现。实际结论是：Destinus
              拥有支持性市场，但真正考验是试点、合作伙伴和主权工业定位能否转化为可重复的项目授标和工业生产经济性。
