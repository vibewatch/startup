      - number: '8.3'
        title: 情景区间与回报测算
        blocks:
          - type: paragraph
            body: >-
              由于当前公开证据在经审计经济性上很薄，用情景分析比单点估值更诚实。关键公开输入，是 2026 年围绕 pre-IPO 融资报道中提到的约 €500 million
              预测年收入。如果这个数字能在可信客户转化、资格认证进展和治理稳定的支撑下实现，乐观情景估值可以用 9x 到 11x 远期销售额，论证出约 €4.5 billion 到 €5.5 billion
              区间。这很贵，但在国防景气行情中并非不可能；市场愿意为稀缺的主权打击和自主资产付费。


              基准情景应明显更低，因为公司尚未在公开层面赢得顶级倍数资格。更冷静的基准情景假设预测部分兑现——例如 €300 million 到 €375 million 的真实收入支撑——并使用 6x 到 8x
              销售额区间，更贴近强上市国防可比公司，得到约 €2.0 billion 到 €3.0 billion。悲观情景不是零；Destinus
              有太多工业和合作伙伴证据，不能按零处理。但如果收入更慢、客户证据仍窄，或融资依赖持续存在，用 €200 million 到 €250 million 收入支撑套 4x 到 5x 销售额，价值可能压向约 €0.8
              billion 到 €1.3 billion。


              这个分布解释了建议。在超过 €5 billion 的传闻估值下，投资人被要求在公开证据基础尚未达到乐观情景之前，就几乎付完整个乐观情景价格。
