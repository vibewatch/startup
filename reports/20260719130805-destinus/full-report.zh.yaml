  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 创始人、治理与监管包袱
        blocks:
          - type: paragraph
            body: >-
              Destinus 最重要的反向因素不是技术挑战，而是创始人 Mikhail Kokorich 从 Momentus 带来的治理和可信度包袱。SEC 2024 年 11 月官方诉讼发布称，围绕 Momentus
              技术、国家安全风险以及 Kokorich 移民身份在 de-SPAC 交易前的误导性陈述，法院对 Kokorich 作出最终同意判决。判决包括 $2 million 民事罚款，以及五年不得担任上市公司高管 /
              董事。更早的 SEC 新闻稿和法院案卷显示，这不是小型披露争执；它与一家敏感技术公司的涉嫌欺诈和国家安全担忧绑定在一起。


              这段历史会直接影响 Destinus，因为公司再次面向敏感国防和军民两用领域销售，同时培育 pre-IPO
              叙事。政府买方、主承包商、银行和未来公开市场投资人，正是最可能重新审视创始人近期执法历史的群体。National Law Review 对 Momentus CFIUS
              流程的总结凸显了此前审查的严重性：缓释协议、监督角色和一名 CFIUS 批准的董事都被要求用来处理外资所有权担忧。即便 Destinus
              是一家处在不同司法环境中的不同公司，教训仍然清楚：技术触及国家安全时，治理整改可能变得侵入性强，并重塑价值。


              风险结论不是 Destinus 自动出局。而是：创始人驱动的治理风险并非理论问题，已有近期文件记录，对一家既想获得主权客户信任、又保留公开市场选择权的国防公司尤其突出。
