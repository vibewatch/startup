      - number: '7.4'
        title: 财务模型与人员风险
        blocks:
          - type: paragraph
            body: >-
              财务风险不只是「烧钱」。真正的问题是资本密集度、当前经济性披露不足，以及清晰可见的激进规模计划之间的相互作用。到 2025 年 12 月，公司称累计融资接近 €400 million；但 2026
              年报道仍称其正寻求另一笔约 €200 million 的 pre-IPO
              融资。这个组合意味着公司在为严肃的工业爬坡融资，但尚未证明能自我供血。公开估值讨论已经跑在公开单位经济披露前面，未来融资条款因此可能过度依赖叙事可信度、合作伙伴信心和项目里程碑。


              人员侧进一步放大风险。Workable 显示 Destinus 仍在工程、生产、贸易合规、文档和 IT
              方向大量招聘。这是野心健康的信号，也说明公司追逐多个国家的复杂项目时，仍在搭建核心执行肌肉。一家公司可以有产品动能，却仍被协调负荷压垮：太多新员工、太多合作伙伴接口、太多并行产品线，再加上过度依赖一位外部形象带包袱的创始人。


              从承销角度看，财务和人员风险应被视为一阶风险。如果融资推迟、几个关键职能招聘失败，或项目转化滞后，整个规模化逻辑会迅速走弱，因为固定成本基础和合作伙伴承诺已经按更大产出在搭建。
