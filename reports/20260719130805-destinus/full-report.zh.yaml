      - number: '3.2'
        title: 能力宽度与渠道权力
        blocks:
          - type: paragraph
            body: >-
              Destinus 最强的竞争对手，不一定是宣传册最像的公司，而是那些已经占据同一工作流中买方注意力的公司。Shield AI 的 V-BAT 加 Hivemind
              栈就是清晰例子：它把战术飞机、海事可信度和可位于多平台之上的软件层组合在一起。Quantum Systems 把自己定位为跨域自主系统公司，覆盖空、陆、海和 cUAS；Forbes
              称其无人机已被乌克兰战场上的军队使用，并在 2025 年大举融资。TEKEVER 则证明，泛欧洲 UAS 公司可以赢下直接面向运营者的海事合同，并把飞机销售与培训、维护和技术援助打包。


              既有玩家进一步拉开差距。Kratos 横跨无人系统、推进、高超音速和武器，使其在支撑 Destinus 叙事的“可负担规模”和高速国家安全讨论中都有可选项。AeroVironment
              在部署层面更广：官网称其系统在 55+ 个国家有 50,000+ 次部署，覆盖精确打击、ISR、反 UAS、电子战、自主和兵力保护。MBDA
              代表另一类竞争者——不是风投支持的颠覆者，而是欧洲导弹主承包商，其分销权力、可信客户关系和战略独立框架，让买方可以通过既有渠道解决类似打击或防空需求。


              Destinus 通过合作伙伴部分抵消这些劣势。公司自己的公告越来越显示，它接入 Shield AI、Quantum Systems、TNO
              以及大型欧洲联盟结构。这样做有用，因为降低了被视为独立外来者的风险。但它也意味着，这个品类里部分最强的相对护城河——自主软件、导引头技术或主承包商牵头的客户入口——并不完全归 Destinus 自己所有。
