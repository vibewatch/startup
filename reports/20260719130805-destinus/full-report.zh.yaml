      - number: '7.5'
        title: 缓释措施、监测与否决标准
        blocks:
          - type: paragraph
            body: >-
              Destinus 并非没有缓释。荷兰官方许可框架提供正式合规路径；ISO 9001 提供质量体系基线；Rheinmetall
              等合作伙伴提供工业和渠道支持；管理层在遭遇敌对公开点名后，至少公开释放了主动安全监测信号。这些保护有意义。但更准确地说，它们是框架级缓释，而不是最难问题已经解决的证明。


              因此，正确的监测姿态应围绕投资逻辑破裂来设定。关注资格认证延误、下一步融资未能关闭、明显合作伙伴脱钩、影响运营或客户信心的安全事件，或高调评估未能转化为获资助项目的证据。也要关注治理信号：创始人角色变化、额外合规承诺，或公司接近公开上市时出现披露摩擦。


              尽调要求很直接，即便答案未必容易拿到。投资人需要出口许可证和终端用户矩阵、项目级可靠性和保障数据、客户集中度和订单簿质量、合作伙伴治理条款，以及在公开市场或国家安全审查升级时谁控制公司的清晰视图。没有这些，风险栈只能近似估计，不能承销。
