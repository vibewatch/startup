      - number: '5.2'
        title: 架构、自主与子系统
        blocks:
          - type: paragraph
            body: >-
              比起单个机体名称，架构叙事更值得看。Destinus
              在公开产品页反复强调一组通用积木：集装箱或助推辅助发射、拒止环境下的自主导航、地形跟随飞行，以及末端制导或拦截。子系统页面把这套栈讲得更具体：T150、T70、T35 涡喷发动机系列，加上 Vista
              视觉导航模块。Ruta Block 3 又给出公开记录里最明确的系统表述：自研 T220 涡喷发动机、不受 ITAR 限制的欧洲技术栈，以及覆盖 INS、GNSS、视觉导航和 TERCON
              的导航组合。合起来看，这些来源暗示 Destinus 想掌握足够多的推进、制导和任务系统 IP，避免沦为最终总装商。


              外部自主能力证据强化了这一判断，也暴露哪些层是共享的。Shield AI 2026 年 3 月发布称，Hivemind 两个月内接入 Hornet
              飞控架构，并能在飞行中围绕不断变化的地理围栏区域动态改航。Shield 和 Destinus 都把 Hornet 描述为后续扩展到更多平台族的首个基线系统；Tim Moser 也明确说 Destinus
              的平台共享一套通用技术架构。这说明单个机体之上有一层软件定义层，但不意味着每一层自主能力都由内部自建。Daedalean 收购报道也指向同一方向：Destinus 似乎在买入并整合可认证 AI
              和飞行软件能力，以加快路线图。


              因此，这套架构看起来模块化、纵向野心强，也便于集成；但它同样依赖推进、自主、导引头和生产系统之间能否顺利耦合。通用架构叙事已经可信到值得认真对待；未解的尽调问题是，这套栈有多少已经在实地条件下端到端验证，而不只是有限演示里跑通。
