  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真正与 Destinus 竞争的是谁
        blocks:
          - type: paragraph
            body: >-
              Destinus 面对的不是一个干净的同业集合。竞争格局分成四组：直接自主防务同行、采购触达更广的既有防务承包商、欧洲主承包商或联盟替代方案，以及更多争夺人才和资本而非 2026
              年同一预算的高速航空航天邻近公司。最接近的直接重叠并不是商用超音速航空，而是销售军事自主、战术 UAS、巡飞或打击邻近系统，以及欧洲主权 ISR 或防空能力的公司。


              按这个定义，Shield AI、Quantum Systems 和 TEKEVER 是最相关的初创型可比公司。Shield AI 在韧性自主和战术无人系统上竞争；Quantum Systems
              在欧洲自主系统、侦察、cUAS 和软件骨干定位上竞争；TEKEVER 则以 AI 为中心的自主系统竞争，并在欧洲逐步拿出面向运营者的海事和监视验证。Hermeus
              有战略相关性，因为它共享军民两用、高速、风投支持的航空航天叙事，但当前产品路径仍是服务美国国家安全的高 Mach 飞机，而不是 Destinus 今天实际营销的防空和远程打击产品。Boom Supersonic
              离得更远：它主要是资本和工程人才的邻近项，而不是直接防务系统竞争者。


              实际结果是，Destinus
              与自主防务和打击系统供应商的碰撞，比与光鲜的超音速初创公司更直接。这在一个层面上是好事，因为真实市场被收窄了；但也带来挑战，因为这个窄市场里资本最充足的竞争者，往往拥有更强的软件栈、更清晰的海事或 ISR
              客户验证，或更深的既有防务采购渠道。
