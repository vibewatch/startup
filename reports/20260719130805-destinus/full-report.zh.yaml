  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 法律、监管、伙伴和融资风险会同时传导到客户转化、收入确认节奏和估值。
    data:
      nodes:
        - id: n1
          label: 创始人 / 治理风险
          description: SEC 与 Momentus 过往经历影响可信度和尽调结果
        - id: n2
          label: 出口 / 资质认证摩擦
          description: 许可证、制裁和审批约束交付
        - id: n3
          label: 伙伴依赖
          description: 主承包商和技术伙伴影响市场路径和能力交付
        - id: n4
          label: 客户转化
          description: 评估必须转成有资金支持的项目
        - id: n5
          label: 收入节奏和利润率
          description: 项目延误会推迟现金流并抬高持有成本
        - id: n6
          label: 融资需求
          description: 转化延迟或额外成本会加深对新资本的依赖
        - id: n7
          label: 估值 / IPO 可选性
          description: 公开市场就绪度取决于治理、披露和项目质量
      edges:
