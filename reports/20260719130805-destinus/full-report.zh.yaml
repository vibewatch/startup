      - number: '5.3'
        title: 部署、工业化与路线图
        blocks:
          - type: paragraph
            body: >-
              Destinus 2026 年最强的技术证据更接近部署，而不是重认证。西班牙海军护卫舰测试表明 Hornet 至少已经在集装箱化海上防空概念中演练过，比静态靶场演示更贴近作战。第 1000
              台发动机公告同样重要：它把 T150 涡喷制造定义为 Destinus 自有的欧洲生产体系，而不是原型车间，并直接把推进产能同 Ruta 系列挂钩。Ruta Block 3 和 Rheinmetall
              材料继续推高叙事，呈现 Ruta Block 1 在荷兰的系列化生产、Ruta 系列产能扩张，以及德国最终总装路径，首批交付就绪计划在 2026 年实现。


              这是有意义的产业叙事，因为它把「深科技创业公司」语言转换成生产逻辑。它也显示了路线图层级。Hornet Block 1、Ruta Block 1、Ruta Block 2 和 Kryla
              看起来更接近近期部署或初始生产。Hornet Block 2，尤其是 Ruta Block
              3，则加入更大载荷、更远航程和更深打击野心，但更依赖合作伙伴执行、资格认证和规模化。公开路线图证据因此只能指方向，不能给完整背书：足以看出哪些系统更接近列装，哪些仍是成熟化项目；不足以支撑精确产能、验收标准或进度信心。


              同样重要的是，路线图不再把什么放在中心。在本章来源中，Destinus 的公开产品身份几乎完全转向国防。品牌仍带着高速航空航天
              DNA，但当前技术证据集中在拦截器、打击、推进和防空系统，而不是客运级高超音速飞机项目。
