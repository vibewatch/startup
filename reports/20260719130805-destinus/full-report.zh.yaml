  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从有利市场和真实产品证据出发，最终落在较弱的经济性和经风险调整后的估值支撑上。
    data:
      nodes:
        - label: 强劲市场顺风
        - label: 真实产品 + 伙伴证据
        - label: 部分客户证据
        - label: 经济性不透明 + 治理风险
        - label: 传闻 >€5B 要价
        - label: 观察 / 继续研究，而非买入
      edges:
        - from: Strong market tailwind
          to: Real product + partner proof
        - from: Real product + partner proof
          to: Partial customer proof
        - from: Partial customer proof
          to: Opaque economics + governance risk
        - from: Opaque economics + governance risk
          to: Rumored >€5B price
        - from: Rumored >€5B price
          to: Track / research more, not buy
    approximationNotes: null
    claimRefs:
      - CV015
      - CV017
      - CV021
      - CV036
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在公开的约 €500M 预测收入水平下，合理估值会随所用销售倍数大幅摆动。
    data:
      items:
        - label: 4x 收入
          value: 2
        - label: 6x 收入
          value: 3
        - label: 8x 收入
          value: 4
        - label: 10x 收入
          value: 5
        - label: 12x 收入
          value: 6
    approximationNotes: 若把约 €500M 预测收入视为真实且质量高，图中数值就是隐含企业价值 / 估值结果，单位为 €B。
    claimRefs:
      - CV003
      - CV021
      - CV029
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支撑的区间很宽；传闻价格接近当前乐观情景能够解释的上沿。
    data:
      items:
        - label: 悲观情景（€B）
          low: 0.8
          mid: 1
          high: 1.3
          displayValue: €0.8B-€1.3B
          detail: 约 4x-5x 销售倍数支撑 €200M-€250M
          tone: negative
        - label: 基准情景（€B）
          low: 2
          mid: 2.5
          high: 3
          displayValue: €2.0B-€3.0B
          detail: 约 6x-8x 销售倍数支撑 €300M-€375M
          tone: warning
        - label: 乐观情景（€B）
          low: 4.5
          mid: 5
          high: 5.5
          displayValue: €4.5B-€5.5B
          detail: 约 9x-11x 销售倍数支撑 €500M
          tone: positive
        - label: 传闻 2026 年要价（€B+）
          low: 5
          mid: 5
          high: 5.2
          displayValue: '>€5.0B'
          detail: 公开报道的 IPO 前推介水平
          tone: warning
    approximationNotes: 这些区间只是投资讨论用的情景输出；未纳入未知的优先股堆叠经济性。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV037
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Destinus 在市场需求和产品野心上得分高，但经济性可见度、治理和当前估值支撑明显偏低。
    data:
      items:
        - label: 市场需求
          score: 9
          detail: 欧洲重新武装和主权打击需求异常强。
          tone: positive
        - label: 产品 / 工业证据
          score: 7
          detail: 产品、发动机、伙伴和评估都是真实存在的，但资质认证仍在成熟中。
          tone: positive
        - label: 客户证据
          score: 6
          detail: 西班牙军方评估证据面和伙伴渠道真实存在，但范围仍窄。
          tone: warning
        - label: 经济性可见度
          score: 3
          detail: 公开收入、积压订单、利润率和集中度披露仍不足。
          tone: negative
        - label: 治理质量
          score: 3
          detail: 创始人包袱和公开市场就绪度仍是实质担忧。
          tone: negative
        - label: 估值支撑
          score: 4
          detail: 公开证据能支撑很宽的区间，但不足以轻率按 >€5B 做投资测算。
          tone: warning
        - label: 证据质量
          score: 5
          detail: 足够严肃跟踪；还不够盲目买入。
          tone: neutral
    approximationNotes: 分数是供 IC 讨论使用的 0-10 顺序判断，不是确定性评级。
    claimRefs:
      - CV013
      - CV017
      - CV021
      - CV031
      - CV036
      - CV040
