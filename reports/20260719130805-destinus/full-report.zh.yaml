      - number: '6.2'
        title: 具名客户证据与采用触点
        blocks:
          - type: paragraph
            body: >-
              公开来源中最可信的具名客户证据来自西班牙。西班牙海军是最干净的例子：Destinus 官方披露了 2026 年 6 月 Hornet Block 1 从 F-81 Santa María 护卫舰发射，Naval
              Today 和 Infodefensa 也分别把同一测试描述为集装箱化海上防空评估。西班牙陆军 TEC 3 实验活动是第二个主要证据点。Defence Blog 和 TheDefenseNews 都称
              Hornet B1 在西班牙 Future Force 2035 计划相关的军方实验环境中展示，重点是野外验证，而不是展会表演。


              这些证据重要，因为它们不是泛泛的「客户兴趣」表述。它们点名军事组织、用例和运行环境。但边界也很清楚。公开来源没有披露采购数量、价格、成功率，也没有说明演示是否转化为生产订单。海军报道明确指出，西班牙海军没有公布威胁场景、交战参数或结果。陆军报道描述的是进入评估和潜在采购的管线，不是已完成采购。


              西班牙之外，Destinus 的采用触点通过渠道而非直接具名终端客户披露来扩大。Rheinmetall 提供进入欧洲和盟国武装力量的工业及资格认证路径；Quantum Systems 把 Destinus
              打击系统接入与现有国家和 NATO 指挥系统兼容的传感器到效应器工作流；Diehl 打开进入分层 GBAD 和反 UAS 架构的路径；Shield AI
              展示与操作员相关的自主工作流。合在一起，这些都是有意义的客户证据界面——但距离公开付费、已部署客户名单仍隔着一步。
