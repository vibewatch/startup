      - number: '8.5'
        title: 最终尽调要求与决策触发点
        blocks:
          - type: paragraph
            body: >-
              好消息是，尽调路径很清楚。这不是投资人需要奇特信息的情况。他们需要的是标准承销信息，只是这些信息恰好缺失：按收入流拆分的经审计收入、按客户拆分的积压订单和预订额、按产品拆分的出口和资格认证状态、客户集中度、优先股堆叠和稀释细节，以及明确的创始人治理边界。如果这些材料显示，公司确实正接近
              €500 million 高质量年收入，资格认证可重复，股权结构表可管理，投资观点会明显改变。


              如果没有这些，价格纪律应保持强硬。改善判断的主要触发点包括：经审计的收入质量证明、超出少数公开军事界面的客户广度、更干净的治理包，以及一轮更接近基准情景而非乐观情景定价的融资。恶化判断的主要触发点包括：融资落空、合作伙伴或资格认证延误、不利安全或治理进展，或证据显示收入故事主要建立在非经常性或承诺松散的项目经济上。


              这就是最终结论为何是「跟踪，不买入」。上行真实存在，但当前公开证据基础仍要求投资人用希望跨过太多缺口。
