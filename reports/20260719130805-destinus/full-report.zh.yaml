  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Destinus
              的估值问题不在于它是否有意思。它显然有意思。公开记录支持一个真实的国防制造努力：产品广度有意义，产业伙伴强，近期有军事评估证据，欧洲重整军备也带来异常有利的市场时点。估值问题在于价格纪律。公开估值标记从 2025
              年末 Forbes / PitchBook 约 $1.76 billion 的估计，跳到 2026 年报道称 Destinus 正寻求以超过 €5 billion 估值融资约 €200
              million，销售说法绑定接近 €500 million 的预测年收入。这不是小幅上调；而是从一个合理的后期私营国防估值，跃迁到要求异常强执行的溢价成长型国防估值。


              仅凭公开证据，更高价格还无法承销。投资人仍缺少经审计的当前收入、毛利率、积压订单质量、客户集中度、优先股堆叠细节和干净的治理故事。公司证据足以避免一概否定，但不足以把传闻价格当成未来里程碑已经兑现来支付。因此，正确建议必须对价格敏感：积极跟踪、继续研究；只有在估值实质下调，或公司披露的证据强到让传闻估值显得是挣来的而非愿望时，才承销入场。


              落到 IC 语境，这不是「坏公司」结论，而是「好故事、证据不完整、价格激进」结论。
