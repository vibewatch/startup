      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Destinus 公开披露最强的财务事实是资本形成，而不是收入质量。公司 2025 年 12 月公告称，€50 million Commerzbank 商业银行授信叠加近期完成的 €140 million
              可转工具和股东贷款，以及此前募得的逾 €200 million 股权资金，使累计融资接近 €400 million。2026 年独立报道随后称，Destinus 正在潜在 Amsterdam IPO 前再寻求约
              €200 million，营销叙事锚定预测年收入约 €500 million。


              合在一起，这些事实指向一家已经募到足够资金来建设真实工业产能、但仍依赖融资的公司。如果接近 €400 million 的资本足以把业务带到自我维持规模，2026
              年上市前融资就不会那么急。相反，公开图景更像典型防务硬件扩张曲线：庞大工程团队薪酬、制造扩张、收购自主能力整合，以及透明持续现金回款之前的营运资金需求。Rheinmetall 合资公司 2026
              年交付就绪目标和德国总装计划也强化了这个判断，因为这种准备通常先消耗现金，之后才可靠地产生现金。


              公开证据无法显示现金余额、净债务、月度烧钱速度、契约余量或现金跑道。因此，投资人应把资产负债表看作相对早期初创公司方向性较强，但相对真正承保所需仍然不透明。公司有融资势能；还没有公开财务透明度。
