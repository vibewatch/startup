  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引
        blocks:
          - type: paragraph
            body: >-
              Destinus 的收入模式公开可见的只有轮廓，但轮廓足以排除错误框架。它不是 SaaS
              业务，也不是商业飞机预订单故事。公开记录显示，这是一家防务制造商，把系统、子系统和项目入口卖进政府或主承包商中介的工作流。官方产品页展示 Hornet 和 Ruta 等可变现硬件类别，Shield
              AI、Quantum Systems 和 Rheinmetall 相关公告则显示，部分未来收入很可能通过集成合作、联合生产或联盟结构流动，而不是单一清晰的直销动作。


              缺失的是扎实的公开收入披露。本轮审阅的公司官方页面和独立报道，都没有披露 Destinus 本身当前年收入、毛利或在手订单。TNW 和 NL Times 都称，2026 年上市前流程围绕预测年收入约 €500
              million 营销，但这是前瞻性承保输入，不是当前已实现收入的证据。财务解读是：Destinus
              可能已经产生有意义的防务收入，但公开来源看不出收入来自已交付系统、开发工作、原型项目、伙伴出资工业化，还是四者混合。


              因此，公开牵引代理指标比平时更重要。Destinus 披露的员工数、发动机生产里程碑、西班牙海军 Hornet 测试，以及 2026 年与 Rheinmetall
              的交付就绪措辞，都指向一家已越过原型阶段的公司。但这些是运营信号，不是收入质量信号。后续尽调应把它们当作收入引擎可能存在的证据，同时仍要求合同层面证明：到底预订了什么、交付了什么、验收了什么、收了多少钱。
