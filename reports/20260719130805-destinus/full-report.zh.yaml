      - number: '4.2'
        title: 成本结构、单位经济性与可比对象
        blocks:
          - type: paragraph
            body: >-
              Destinus
              没有发布投资人通常需要的单位经济性数据：没有披露毛利率、物料清单、库存周转、月度烧钱速度，也没有合同在手订单。因此，本章必须按机制和防务硬件可比公司推理，而不是依赖公司直接披露。本组来源中最相关的公开可比是
              Kratos。其 2025 年业绩清楚展示，无人和打击邻近防务承包商即便订单和收入增长，也会因为提前备货、扩张性资本开支和营运资金需求而消耗现金。Kratos
              称，由于较高资本开支等原因，经营自由现金流为负；部分原因是它在合同授标前先生产 Valkyries，以满足预期客户需求。


              这对 Destinus 很重要，因为其公开叙事的经济形态听起来相似：批量生产、欧洲工业扩张，以及在完全透明的订单簿披露之前，就准备把硬件交付进防务项目。AeroVironment 2025
              年业绩提供第二个可比。AV 的收入、订单、已拨款在手订单、毛利率和 2026 财年展望，展示了一家更成熟防务科技生产公司在需求、制造规模和收购整合都进入数字之后的样子。MBDA 2025
              年业绩则展示了规模大得多的主承包商终点：高收入、巨大在手订单、产量上升，以及支持导弹产出的数十亿欧元投资计划。


              实际教训是，Destinus 的经济瓶颈不太可能是软件式 CAC
              或按席位定价，更可能是硬件吞吐、固定价合同纪律、工程人员薪酬、供应商可靠性、库存融资，以及在项目成熟为稳定回款之前先建出足够产能的成本。这也是下表每一个缺失的单位经济性字段都重要的原因。
