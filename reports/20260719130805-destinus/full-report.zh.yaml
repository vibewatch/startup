      - - 如果约 €500M 收入预测接近现实且质量高，乐观情景才成立
        - 如果当前收入明显低于预测，或合同约束弱，传闻价格很难自洽
      - - 公开市场可比公司表明，高质量防务标的可以获得健康的销售倍数
        - 如果 Destinus 在利润率、积压订单和治理上仍不透明，就不应拿到一流倍数
    notes: 每条投资逻辑都配了最可能推翻它的条件。
    claimRefs:
      - CV001
      - CV012
      - CV013
      - CV018
      - CV021
      - CV024
      - CV035
      - CV038
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入支撑达到约 €500M；认证和合作伙伴渠道转化；治理担忧淡化
        - 用约 9x-11x 远期销售额支撑约 €4.5B-€5.5B 估值
        - 需要顶级执行，并且市场愿意接受溢价倍数
        - 可能成立，但公开证据尚未充分支持
      - - 基准
        - 收入支撑达到约 €300M-€375M；客户和认证证据改善，但仍不完美
        - 用约 6x-8x 销售额推导约 €2.0B-€3.0B
        - 客户集中、融资和治理折扣仍在
        - 最能被当前公开证据支撑
      - - 悲观
        - 收入支撑仅约 €200M-€250M；融资和认证拖累延续
        - 用约 4x-5x 销售额推导约 €0.8B-€1.3B
        - 预测落空、降价融资压力、合作伙伴延误，或安全冲击
        - 如果当前叙事跑在实际合同经济性前面，这一情景非常可能
    notes: 这些是讨论区间，不是 DCF 输出；它们有意摊开收入质量和倍数选择对结论的影响有多大。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV033
      - CV035
      - CV037
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Comparable set mixes public-defense companies with private-defense unicorns because Destinus sits between mature
        contractor and still-private sovereign-tech narratives.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Kratos
        - 2025 年收入 $1.347B；2026 年 7 月市值 $8.62B
        - 约 6.4x 往绩销售额
        - 有真实收入的公开市场无人系统 / 打击邻近防务可比公司
        - 成熟度高得多，项目组合也更宽
      - - AeroVironment
        - 2025 年收入 $820.6M；2026 年 7 月市值 $7.17B
        - 约 8.7x 往绩销售额
        - 公开市场自主系统和打击技术可比公司
        - 公开公司披露和部署基础远强于 Destinus
      - - Rheinmetall
        - 2025 年收入 €5.8B；2026 年 7 月市值约 $52.16B
        - 高个位数销售倍数
        - 可作为规模化欧洲防务工业公司的估值上限校验
        - 既有主承包商结构与 Destinus 差异很大
      - - Anduril
        - 2025 年收入 $2.2B；2026 年 5 月估值 $61B
        - 27.7x 销售额
        - 显示市场眼中的顶级赢家在私募防务领域能拿到多高溢价
        - Anduril 收入、合同和投资者认可度都高得多
      - - Shield AI
        - 2026 年投后估值 $12.7B
        - 私募自主系统溢价；此处收入未披露
        - 自主系统占比高的私募防务科技可比公司
        - 本来源集没有干净的公开收入分母
      - - Quantum Systems
        - 2026 年 7 月投后估值 $8B
        - 欧洲私募防务无人机溢价；此处收入未披露
        - 可作为欧洲主权无人机热度标尺
        - 本来源集仍缺少干净的公开收入分母
      - - Hermeus
        - 2025 年投后估值 $1B
        - 私募高速航空航天 / 防务邻近估值标记
        - 显示先进飞行器叙事的估值仍可能远低于 Destinus 传闻
        - 产品组合不同，防务工业覆盖也更窄
    notes: 本表用于定向框定区间，不是为了假设所有可比公司都能直接类比。
