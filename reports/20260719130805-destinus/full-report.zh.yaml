      - number: '7.2'
        title: 出口管制、地缘政治与安全风险
        blocks:
          - type: paragraph
            body: >-
              出口管制是 Destinus
              的核心业务约束，不是后台职能。荷兰政府和海关官方页面明确写明，军事物项、军民两用物项、技术援助、经纪活动，甚至软件或技术的非物理转移，都可能需要许可证或通知。安全利益明确优先于经济利益。这里尤其相关，因为
              Destinus 推向市场的是打击系统、推进、导航及相关技术，可能同时跨越军事和军民两用边界。实际增长不只受工程进度约束，还取决于公司能否在多个司法辖区取得并维持正确许可证、分类、买方认证和制裁合规。


              地缘政治让难度更高，而不是更低。2026 年 4 月，Destinus 出现在俄罗斯一份欧洲国防相关实体清单上，报道称这些实体可能成为潜在目标，NL Times、RTL 和 DutchReview
              均有覆盖。公司随后发布声明，称支持客户和合作伙伴当前没有中断，但也拒绝讨论具体安全措施。这组信息需要谨慎解读：管理层试图安抚利益相关方，同时不公开暴露防御姿态。对投资人而言，含义是公司在乌克兰相关供应链中的曝光，即使没有遭受攻击，也会带来实体安全、网络、保险和连续性成本。


              这些外部约束直接传导到客户、融资和估值风险。面向欧洲和盟国用户打造高可见度军事系统的公司可能受益于政策需求，但也会继承制裁复杂性、终端用户审查，以及来自对手的潜在报复性关注。
