  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户任务
        blocks:
          - type: paragraph
            body: >-
              按客户工作流看，Destinus 不再是在卖单一未来主义飞机概念。2026
              年公开产品呈现是一组面向军事用户的打击、拦截器和子系统供给，这些用户需要以工业节奏获得可负担的效应器与反制效应器。官网和下载材料把产品栈说得很直白：Kryla 用于分布式饱和打击，Hornet Block 1 和
              Block 2 用于防空和精确打击角色，Ruta Block 1 到 Block 3 覆盖基线到纵深打击任务。这种宽度重要，因为它显示管理层试图覆盖现代欧洲导弹和无人机问题的多个层级，而不是追逐一个精致平台。


              工作流也足够具体，可以进入尽调。Hornet 围绕反制亚音速空中威胁展开，Block 2 形态还可打击海上或地面目标。Ruta 围绕对加固或高价值目标的预先计划精确打击展开，包括 GNSS 受限和 EW
              争夺场景。Kryla 把组合延伸到由齐射协调的高数量、低载荷饱和攻击。实际读法是，Destinus
              正把产品映射到作战任务：点防御、精确打击、纵深打击和分布式规模。这比公司早期与氢动力高超音速客运旅行的公开联想更连贯，也与官方页面和招聘文案中现在可见的防务优先身份一致。


              公开验证仍止步于买方层面项目细节之前。没有公开价目表，没有按客户划分的可用性矩阵，对宣传能力中多少已通过资格认证、多少仍处高级开发阶段也披露有限。但产品页展示的不只是品牌包装。它们暴露了射程、载荷级别、发射概念和任务框架，具体程度足以判断公司拥有真实硬件组合，而不是纯概念材料。
