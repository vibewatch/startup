      - number: '1.3'
        title: 资本形成、利益相关方与估值信号
        blocks:
          - type: paragraph
            body: >-
              Destinus 在 2025 年末和 2026 年的公开融资图景有两层：已经落地的融资基础，以及目标中的下一道估值标记。已完成部分相对有较好佐证。Destinus 2025 年 12 月新闻稿称，新的 €50
              million Commerzbank 授信叠加近期完成的 €140 million 可转工具和股东贷款，以及此前募得的逾 €200 million 股权资金，使累计融资接近 €400
              million。EU-Startups 和 Defence Industry Europe 复述了同一融资结构，并称该授信是 Destinus 首笔商业银行融资，意味着贷款人已愿意在纯风投资本之外承保其工业扩张。


              目标层是 2026 年上市前叙事。TNW 和 NL Times 援引 Bloomberg 报道称，Destinus 正在潜在 Amsterdam IPO 前寻求约 €200 million 融资，估值超过 €5
              billion，锚定预测年收入约 €500 million。这不是已经交割的轮次，更适合理解为试探价格发现和公开市场胃口。相比之下，Forbes 2025 年 11 月防务独角兽文章明确称，其给出的
              Destinus $1.76 billion 估值是 PitchBook 估计，并称公司在 2025 年两轮融资中筹得逾 $267
              million。这些数字有用，因为有日期、有出处，也嵌在更广的行业背景里；但不能把它们与 2026 年已签投资条款书混为一谈。


              利益相关方可见度也不对称。Forbes 点名 Mountain Partners 和 Thornapple River Capital 是 2025 年轮次投资者；公司自己的融资新闻稿点名
              Commerzbank、Rothschild & Co 和 Clear Corporate Finance；与 Rheinmetall、Shield AI、TNO、Quantum Systems
              的运营合作如今几乎与纯股权投资者同样重要，因为它们塑造产能、自主能力和分销入口。承保含义是：Destinus 已募到足够重要的资本，也有足够多的战略联盟来加速；但公开证据对股权结构表所有权、优先权、债务契约，以及
              €5 billion 要价到底由已签订单还是前瞻叙事支撑，仍然过薄。
